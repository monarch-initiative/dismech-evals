  0cda2af643adc7a9cbba3007171a27d2905e99dc1ac483aee422ba9ae7f71290:
    claim:
      about:
        disease:
          name: MOGAD
          disease_term:
            preferred_term: myelin oligodendrocyte glycoprotein antibody-associated disease
            term:
              id: MONDO:1040024
              label: myelin oligodendrocyte glycoprotein antibody-associated disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Anti-MOG Autoimmunity
        description: 'The hallmark of MOGAD is the production of IgG autoantibodies (predominantly IgG1)
          targeting conformational epitopes on myelin oligodendrocyte glycoprotein, a quantitatively minor
          myelin protein expressed exclusively on the outermost surface of CNS myelin and on oligodendrocyte
          membranes. MOG is therefore directly accessible to circulating antibodies that breach the blood-brain
          barrier. Detection of pathogenic MOG-IgG requires cell-based assays presenting full-length human
          MOG in its native conformation; older immunoblot/ELISA assays detect non-pathogenic linear-epitope
          antibodies and are not specific for MOGAD.

          '
        cell_types:
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        cellular_components:
        - preferred_term: myelin sheath
          term:
            id: GO:0043209
            label: myelin sheath
      selected_evidence:
        snippet: MOG-IgG cell-based assays are important for diagnostic accuracy.
        supports: SUPPORT
    origin:
