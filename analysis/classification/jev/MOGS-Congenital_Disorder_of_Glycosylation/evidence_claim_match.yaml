        snippet: We evaluated two siblings with CDG-IIb who presented with multiple neurologic complications
          and a paradoxical immunologic phenotype characterized by severe hypogammaglobulinemia but limited
          clinical evidence of an infectious diathesis.
        supports: SUPPORT
