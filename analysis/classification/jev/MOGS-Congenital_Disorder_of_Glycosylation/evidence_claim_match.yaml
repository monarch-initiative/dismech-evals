  ff3d66bf9fec054d82fc8c10dfb8958d12ecb7e85fa58fabba64f96739f2422a:
    claim:
      about:
        disease:
          name: MOGS-Congenital Disorder of Glycosylation
          disease_term:
            preferred_term: MOGS-congenital disorder of glycosylation
            term:
              id: MONDO:0011629
              label: MOGS-congenital disorder of glycosylation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mogs_cdg_antiviral_target
        kind: EMERGING_HYPOTHESIS
        prompt: Can ER glucosidase inhibition be used as a broad-spectrum antiviral, and what would the
          MOGS-CDG phenotype predict about its safety?
        attaches_to:
        - pathophysiology#Impaired Viral Replication and Cellular Entry
        rationale: 'The human deficiency is the experiment, and it is a weaker experiment than it first
          appears. Patients with almost no glucosidase I activity do show impaired viral replication and
          entry, and one sibling pair showed limited clinical evidence of an infectious diathesis despite
          severe hypogammaglobulinemia. That pair is the whole of the survivability argument: across all
          11 reported patients, recurrent infection is present in 10, and a patient from another pair
          had cytomegalovirus infection despite CMV being enveloped. So the target may well be effective;
          whether inhibiting it is survivable rests on two children, not on the disease. What the argument
          also does not establish is a therapeutic window. These patients also have a severe neurological
          and dysmorphic phenotype from lifelong constitutive loss, and nothing in the human data separates
          which of those consequences would follow acute pharmacological inhibition in an adult. The proposal
          is recorded as emerging on that basis.

          There is also a direct negative result, from the same group that made the original observation.
          Testing the FDA-approved alpha-glucosidase inhibitor miglustat against SARS-CoV-2 in vitro,
          they found the expected structural change in the spike and ACE2 glycans without the functional
          consequence: miglustat did not reproduce the resistance the human deficiency shows, and they
          say so. That does not refute the mechanism in the constitutive human deficiency, where the block
          is near-total and lifelong, but it is a concrete demonstration that partial pharmacological
          inhibition is not the same intervention, and it belongs beside the proposal rather than in a
          citation nobody reads.'
      selected_evidence:
        snippet: Miglustat treatment in our in vitro model did not corroborate this assumption.
        supports: REFUTE
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33245474
      reference_title: 'N-Glycan Modification in Covid-19 Pathophysiology: In vitro Structural Changes
        with Limited Functional Effects.'
      evidence_source: IN_VITRO
      explanation: The negative result. Graded REFUTE against the proposition that pharmacological alpha-glucosidase
        inhibition reproduces the antiviral phenotype of the genetic deficiency.
