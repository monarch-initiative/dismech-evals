        biological_scale: ORGANISM
        description: 'Immunoglobulins carry N-glycans, and glycan structure governs their stability and
          circulating half-life. In MOGS-CDG the hypogammaglobulinemia is a catabolic problem rather than
          a production one: the mechanism identified in the two studied siblings was a shortened immunoglobulin
          half-life.

          Serum glycomics names the specific defect behind that clearance. Patient IgG carries aberrant
          oligo-mannose and hybrid-type N-glycans, and its core-fucosylated complex di-antennary glycans
          are markedly reduced - while transferrin and alpha-1-antitrypsin move the other way, with increased
          sialylated species. The defect is therefore not uniform across serum glycoproteins, which is
          part of why transferrin-based CDG screening misses this disease.'
        cell_types:
        - preferred_term: plasma cell
          term:
            id: CL:0000786
