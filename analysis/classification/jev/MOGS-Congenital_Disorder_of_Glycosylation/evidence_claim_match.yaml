        biological_scale: CELLULAR
        description: 'Patient fibroblasts show two- to threefold higher endo-alpha-1,2-mannosidase activity
          with a matching rise in its transcript. That enzyme cleaves internally to the glucose block,
          so it clears most glycans through an alternative route and releases the Glc3Man tetrasaccharide.
          This single compensation explains two otherwise puzzling observations at once: why the serum
          transferrin pattern is normal despite a near-complete enzyme loss, and where the diagnostic
          urinary tetrasaccharide comes from.'
        biological_processes:
        - preferred_term: alternative oligosaccharide processing via endo-alpha-1,2-mannosidase
          modifier: INCREASED
          term:
            id: GO:0006491
            label: N-glycan processing
      selected_evidence:
        snippet: By contrast, the patient's fibroblasts displayed a two- to threefold higher endo-alpha1,2-mannosidase
          activity, associated with an increased level of enzyme-specific mRNA-transcripts.
        supports: SUPPORT
