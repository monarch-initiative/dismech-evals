      assertion_type: Genetic
      assertion:
        name: MOGS
        association: Causal biallelic variant
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: MOGS
          term:
            id: hgnc:24862
            label: MOGS
        notes: 'Encodes mannosyl-oligosaccharide glucosidase, also called ER alpha-glucosidase I or glucosidase
          1. Four exons, with exon 4 encoding the 64 kDa catalytic domain.

          No genotype-phenotype correlation has been established. The largest series states directly that
          severity varied by organ system with no definite genotype correlation, and the reported range
          is wide - from death at 74 days to children in their second decade. Prognostic counselling from
          the genotype is therefore not currently supportable.

          Variants of uncertain significance are the practical difficulty. Exome sequencing turns them
          up faster than functional validation can resolve them, which is precisely why the urinary tetrasaccharide
          assay matters: it is the orthogonal test that can confirm or exclude a candidate MOGS genotype.'
      selected_evidence:
        snippet: Molecular analysis, combined with biochemical testing, is important for diagnosis.
        supports: SUPPORT
