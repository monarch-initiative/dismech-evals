  76e356c3fdd9aeefdd4e40343f87386a2bb4cd241aa3ad27a37eafaf98cfc573:
    claim:
      about:
        disease:
          name: MOGS-Congenital Disorder of Glycosylation
          disease_term:
            preferred_term: MOGS-congenital disorder of glycosylation
            term:
              id: MONDO:0011629
              label: MOGS-congenital disorder of glycosylation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of the First N-Glycan Trimming Step
        biological_scale: MOLECULAR
        description: Glucosidase I removes the distal alpha-1,2-linked glucose from the Glc3Man9GlcNAc2
          precursor immediately after it is transferred en bloc from dolichyl diphosphate to the nascent
          chain. Without that first cut the glycan cannot enter the maturation sequence, and a fraction
          of N-glycans is arrested at the Glc3Man9-7GlcNAc2 stage.
        biological_processes:
        - preferred_term: processing of protein-bound N-glycans
          modifier: DECREASED
          term:
            id: GO:0006487
            label: protein N-linked glycosylation
      selected_evidence:
        snippet: despite the dramatically reduced glucosidase I activity, the bulk of the N-linked carbohydrate
          chains (>80%) in the patient's fibroblasts appeared to have been processed correctly, with only
          approximately 16% of the N-glycans being arrested at the Glc(3)-Man(9-7)-GlcNAc(2) stage.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12145188
      reference_title: Processing of N-linked carbohydrate chains in a patient with glucosidase I deficiency
        (CDG type IIb).
      evidence_source: IN_VITRO
      explanation: Quantifies how much of the glycan pool is actually arrested, which is smaller than
        the near-total enzyme loss would suggest and is the reason the bypass node exists.
