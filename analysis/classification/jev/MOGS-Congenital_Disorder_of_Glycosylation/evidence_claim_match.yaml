            term:
              id: MONDO:0011629
              label: MOGS-congenital disorder of glycosylation
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: UGGT1-congenital disorder of glycosylation
        disease_term:
          preferred_term: UGGT1-congenital disorder of glycosylation
          term:
            id: MONDO:0980705
            label: congenital disorder of glycosylation, type IIcc
        description: 'The nearest neighbour in the pathway. UGGT1 re-glucosylates misfolded glycoproteins
          to return them to the calnexin/calreticulin cycle, so UGGT1-CDG and MOGS-CDG break the same
          ER glycoprotein quality-control loop from opposite directions: MOGS removes the first glucose,
          UGGT1 puts one back. The clinical overlap is broad - developmental delay, seizures, dysmorphism,
          hepatic and respiratory involvement - and a normal transferrin pattern does not separate them.

          The separator is the urinary tetrasaccharide. Glc3Man accumulates only when the glucosidase
          I block leaves the triglucosylated glycan intact, so it is specific to MOGS-CDG and is not produced
          by a UGGT1 lesion.'
        distinguishing_features:
        - Urinary Glc3Man tetrasaccharide is specific to the glucosidase I block and is the positive test
          for MOGS-CDG. It is the discriminator that does the work.
        - Scoliosis and polycystic kidneys mark the severe end of UGGT1-CDG and are not features of MOGS-CDG.
        - Microcephaly does NOT discriminate. It is near-universal in both, present in 10 of 11 reported
          MOGS-CDG patients with no negative column.
        - Cardiac involvement does NOT discriminate. It occurs in roughly six of the eleven reported MOGS-CDG
          patients as ASD, PFO, left ventricular hypertrophy, dilated cardiomyopathy or heart failure.
        - Biallelic pathogenic MOGS variants favour MOGS-CDG; biallelic pathogenic UGGT1 variants favour
          UGGT1-CDG.
      selected_evidence:
        snippet: The more severely affected individuals display congenital heart malformations, variable
          skeletal abnormalities including scoliosis, and hepatic and renal involvement, including polycystic
          kidneys mimicking autosomal recessive polycystic kidney disease.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/2
      evidence_path: /differential_diagnoses/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40267907
      reference_title: Bi-allelic UGGT1 variants cause a congenital disorder of glycosylation.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The severe-end features of UGGT1-CDG. Only scoliosis and the polycystic kidneys separate:
        cardiac malformation and hepatic involvement occur in MOGS-CDG too, so this quote is read for
        its skeletal and renal half only.'
