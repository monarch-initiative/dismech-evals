            term:
              id: MONDO:0011629
              label: MOGS-congenital disorder of glycosylation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic MOGS Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: 'Missense, frameshift and other variants on both MOGS alleles. The gene has four
          exons, with exon 4 encoding the 64 kDa catalytic domain, and both original disease alleles fall
          in that exon. Reintroducing either into wild-type glucosidase I abolished measurable activity,
          and the two acted differently on the protein: one retained weak affinity-resin binding and the
          other did not, so they disturb folding and active-site formation by different routes.'
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: 'Molecular studies showed that the patient was a compound heterozygote for two missense
          mutations in the glucosidase I gene: (1) one allele harbored a G-->C transition at nucleotide
          (nt) 1587, resulting in the substitution of Arg at position 486 by Thr (R486T), and (2) on the
          other allele a T-->C transition at nt 2085 resulted in the substitution of Phe at position 652
          by Leu (F652L).'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
