        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Viral Replication and Cellular Entry
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: 'Enveloped viruses depend on host ER glucosidases to fold their own glycoproteins
          and on host glycan structures for receptor engagement, so the same block that destabilises immunoglobulin
          also handicaps the virus. It is the observation that made ER glucosidases a broad-spectrum antiviral
          target.

          What this node does not claim is that patients escape infection. Recurrent infection is present
          in 10 of 11 reported patients; the single exception is the sibling pair in whom the reduced
          infectious diathesis was described, and the elder sister of a separate pair had documented cytomegalovirus
          infection despite CMV being an enveloped virus. The scope of the claim is reduced susceptibility
          to some glycosylation-dependent enveloped viruses in the patients where it was looked for, not
          a clinical phenotype of the disease.

          The bound GO process covers the entry half of this node only. The replication half has no equally
          specific GO counterpart and is deliberately left unbound rather than approximated by a broader
          term.'
        biological_processes:
        - preferred_term: glycan-dependent viral entry into the host cell
          modifier: DECREASED
          term:
            id: GO:0019065
            label: receptor-mediated endocytosis of virus by host cell
      selected_evidence:
        snippet: This paradox phenomenon is, at least in part, because the impaired N-linked glycan processing
          of the patients compromises their ability to support efficient replication and cellular entry
          of viruses.
        supports: SUPPORT
    origin:
