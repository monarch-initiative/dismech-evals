      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Neuronal Glycoprotein Function
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        description: 'Neuronal ion channels, adhesion molecules and receptors are N-glycosylated, and
          the standard account is that mishandling their glycans is what produces the encephalopathy.
          It is worth being clear that this is an inference from glycan biology plus a consistent clinical
          association, not a demonstrated step: no specific neuronal glycoprotein has been shown to be
          the one that matters, and no cited work measures a neuronal glycoprotein defect in a patient.
          It is recorded as HYPOTHETICAL for that reason, and the entry does not name a mechanism it cannot
          cite.

          What is well established is the clinical output. Seizures, hypotonia and developmental delay
          are present in essentially every reported patient, the seizures are frequently drug-resistant,
          and imaging shows progressive cortical and subcortical atrophy.'
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: At birth she presented facial dysmorphism, marked hypotonia, and drug-resistant tonic
          seizures.
        supports: SUPPORT
