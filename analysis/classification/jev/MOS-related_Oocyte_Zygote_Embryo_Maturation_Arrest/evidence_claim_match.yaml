            term:
              id: MONDO:0957278
              label: oocyte/zygote/embryo maturation arrest 20
        context: []
      assertion_type: Genetic
      assertion:
        name: MOS
        association: Causative
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: MOS (MOS proto-oncogene, serine/threonine kinase)
          term:
            id: hgnc:7199
            label: MOS
        notes: Ten affected women from eight families have been reported in five studies, most from Chinese
          infertility cohorts. Missense variants cluster in the kinase domain (residues 60-341). Presentation
          varies between cleavage-stage arrest with fragmentation and large first polar body with or without
          parthenogenetic activation; whether this tracks residual kinase activity of the allele is not
          established. The ClinGen gene-disease validity export committed in cache/clingen/gene_validity.csv
          (file created 2026-01-24) has no MOS record, so no validity tier is recorded.
        variants:
        - name: c.285C>A (p.Asn95Lys)
          description: Homozygous missense in a proband from a consanguineous family, and in a second
            independent cohort; reduces MOS protein and MEK1 binding.
          type: missense_variant
        - name: c.960C>A (p.Cys320Ter)
          description: Homozygous nonsense variant; the truncated protein hardly binds MEK1.
          type: stop_gained
        - name: c.791C>G (homozygous); c.596A>T and c.875C>T (compound heterozygous)
          description: Missense variants in the large-polar-body families; none activates MEK1/2 or ERK1/2
            in oocytes.
          type: missense_variant
        - name: c.573C>A (p.Phe191Leu)
          description: Homozygous missense in a patient with large polar bodies and parthenogenetic activation.
          type: missense_variant
      selected_evidence:
        snippet: the effects of the mutations in human embryonic kidney 293T (HEK293T cells) and mouse
          oocytes provided evidence for a causal relation between MOS and female infertility.
        supports: SUPPORT
