        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cortical Actin and Spindle Assembly Defects in Oocytes
        biological_scale: CELLULAR
        description: MOS-ERK signalling thickens the cortical F-actin layer and supports spindle assembly
          during oocyte maturation, which together position the spindle so the first meiotic division
          is asymmetric. Mos knockdown, oocyte-specific Erk1/2 deletion, or MEK inhibition of human oocytes
          reduces cortical F-actin and destabilizes alpha-tubulin, and patient MOS variants fail to restore
          cortical F-actin after Mos knockdown. The authors propose these cytoskeletal defects as the
          origin of the large first polar body and of embryo fragmentation; the second link is a hypothesis
          rather than a demonstrated mechanism.
        biological_processes:
        - preferred_term: cortical actin cytoskeleton organization
          term:
            id: GO:0030866
            label: cortical actin cytoskeleton organization
          modifier: DECREASED
        cell_types:
        - preferred_term: oocyte
          term:
            id: CL:0000023
            label: oocyte
      selected_evidence:
        snippet: ERK1/2 deficiency in oocytes caused very low cortical F-actin and TPX2 signals, in which
          the latter one is a marker of spindle assembly
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
