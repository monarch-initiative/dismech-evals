        variant_origin: GERMLINE
        notes: Biallelic pathogenic variants in MPI (15q24.1), an eight-exon gene spanning only 5 kb,
          cause MPI-CDG. Missense variants predominate, consistent with survival requiring residual activity.
          Three recurrent variants - c.656G>A (p.Arg219Gln), c.457G>A (p.Arg152Gln) and c.884G>A (p.Arg295His)
          - together account for roughly half of reported alleles. p.Arg219Gln, the first variant identified,
          has been found homozygous in clinically asymptomatic adults, indicating incomplete penetrance
          or the action of unknown modifiers; neither residual enzyme activity nor carbohydrate-deficient
          transferrin reliably predicts clinical severity.
      selected_evidence:
        snippet: The gene is composed of 8 exons and spans only 5 kb.
