          and tubular acidosis - causally related to the glycosylation defect?
        attaches_to:
        - phenotypes#Enlarged kidney
        rationale: Renal findings were noticed in six reviewed patients, but the consensus guideline explicitly
          states that their connection with MPI-CDG is unclear, and altered kidney function has separately
          been reported in an adult on long-term mannose. Because even the causal association - let alone
          a mechanism - is unresolved, no causal edge is drawn to this phenotype.
      selected_evidence:
        snippet: Mild tubular acidosis, nephromegaly, renal cysts, and severe hypertrophic cardiomyopathy
          were described in sporadic cases; the connection with MPI-CDG is unclear.
