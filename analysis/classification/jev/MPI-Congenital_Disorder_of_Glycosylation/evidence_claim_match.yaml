          readout is the classic CDG type I serum transferrin pattern - reduced tetrasialotransferrin
          with increased disialo- and asialotransferrin - which is 100% sensitive but biochemically indistinguishable
          from PMM2-CDG and other type I disorders. Because glycosylation modifies a large fraction of
          the secreted proteome, this single lesion degrades many unrelated proteins at once, and the
          specific organ pattern of MPI-CDG reflects which client glycoproteins are rate-limiting rather
          than any tissue-restricted expression of MPI.
