      assertion_type: Pathophysiology
      assertion:
        name: Multisystem Glycoprotein Dysfunction with Neurologic Sparing
        biological_scale: ORGANISM
        conforms_to: congenital_disorder_of_glycosylation#Multisystem Glycoprotein Dysfunction
        role: consequence
        description: The convergent multisystem outflow of hypoglycosylation in MPI-CDG is hepatic, gastrointestinal,
          endocrine, coagulation and immune, but - unlike almost every other CDG - not neurologic. Cognitive
          development and brain imaging are typically normal, cerebellar hypoplasia is absent, and the
          dysmorphic, fat-pad, inverted-nipple and skeletal features of PMM2-CDG do not occur. A proposed
          explanation is that circulating maternal and dietary mannose partially rescues glycosylation
          in developing cerebral tissue, consistent with the zebrafish finding that mannose rescue is
          effective only within an early developmental window.
        biological_processes:
        - preferred_term: protein N-linked glycosylation
          modifier: ABNORMAL
          term:
            id: GO:0006487
            label: protein N-linked glycosylation
      selected_evidence:
        snippet: In contrast with PMM2-CDG, facial dysmorphia, atypical fat pads, inverted nipples, and
          skeletal deformities are not present in MPI-CDG patients.
        supports: SUPPORT
