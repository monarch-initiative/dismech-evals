        presence: ABNORMAL
        context: Spectrophotometric MPI assay in freshly isolated leukocytes or fibroblasts is the second-line
          confirmatory test, typically showing under 10% of normal activity; obligate carriers show intermediate
          values of 30-83% (median 50%).
        readouts:
        - target: Phosphomannose Isomerase Deficiency
          relationship: READOUT_OF
