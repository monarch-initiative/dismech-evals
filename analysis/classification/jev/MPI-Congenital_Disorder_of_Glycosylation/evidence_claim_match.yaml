        description: Germline ablation of mouse Mpi causes mannose-6-phosphate accumulation, inhibition
          of glycolytic enzymes, ATP depletion and embryonic lethality around E11.5, with growth retardation,
          placental hyperplasia and failed yolk sac vasculogenesis; mannose supplementation hastens rather
          than rescues embryonic death, so a faithful murine CDG-Ib model requires hypomorphic alleles.
          Hypomorphic mice with patient-range residual activity are largely normal apart from about 15%
          embryonic lethality, but antenatal mannose reduces litter size and survival to weaning and causes
          eye defects in about half of survivors. The model therefore establishes the mannose-toxicity
          mechanism but does not reproduce the human hepatic-intestinal disease.
        genes:
        - preferred_term: MPI
          term:
            id: hgnc:7216
            label: MPI
        associated_phenotypes:
        - Embryonic lethality
        - Blindness
      selected_evidence:
        snippet: However, mannose further reduced litter size and survival to weaning by 40 and 66%, respectively.
          Moreover, ~50% of survivors developed eye defects beginning around midgestation.
        supports: SUPPORT
