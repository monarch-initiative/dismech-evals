        context: []
      assertion_type: Biochemical
      assertion:
        name: CDG type I transferrin pattern
        presence: ABNORMAL
        context: Serum or plasma transferrin isoelectric focusing (or HPLC/capillary electrophoresis quantifying
          carbohydrate-deficient transferrin) shows reduced tetrasialotransferrin with increased disialo-
          and asialotransferrin. This is the first-line screen but cannot distinguish MPI-CDG from PMM2-CDG
          or other type I disorders.
        biomarker_term:
          preferred_term: N-glycan
          term:
            id: CHEBI:59520
            label: N-glycan
        readouts:
        - target: Protein Hypoglycosylation
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: The cathodal transferrin shift directly reports systemic N-glycosylation deficiency.
        notes: Transferrin protein polymorphisms, untreated galactosaemia, hereditary fructose intolerance,
          chronic alcohol misuse, liver disease and severe infection can all mimic the pattern; abnormal
          profiles should be repeated on an independent sample in an experienced laboratory. The pattern
          improves but rarely normalises completely on mannose.
      selected_evidence:
        snippet: MPI-CDG can be biochemically characterised by a decreased level of the major tetrasialylated
          transferrin (Trf) glycoform (tetrasialotransferrin) and an increase of disialotransferrin and
          asialotransferrin, that is, CDG type I pattern.
        supports: SUPPORT
