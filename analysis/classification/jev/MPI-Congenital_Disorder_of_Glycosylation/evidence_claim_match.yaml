    claim:
      about:
        disease:
          name: MPI-congenital disorder of glycosylation
          disease_term:
            preferred_term: MPI-congenital disorder of glycosylation
            term:
              id: MONDO:0011257
              label: MPI-congenital disorder of glycosylation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mpi_cdg_mannose_pregnancy_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the mannose-toxicity findings in Mpi mice - accelerated embryonic death in nulls and
          ocular defects with blindness in hypomorphs - predict any risk of oral or antenatal mannose
          therapy in human MPI-CDG?
        attaches_to:
        - pathophysiology#Mannose-6-Phosphate Accumulation and Energy Failure on Excess Mannose
        rationale: The direction of the mannose effect is species- and route-discordant. Complete Mpi
          ablation in mice is embryonic lethal and mannose hastens embryonic death; Mpi hypomorphic mice
          develop blindness on antenatal mannose. Yet in zebrafish mannose rescues the phenotype when
          given early, and in humans oral mannose is well tolerated and clearly beneficial, with normal
          pregnancies reported in treated women; human toxicity has been seen only with the intravenous
          route. Whether the murine antenatal toxicity has any human counterpart is unresolved and directly
          gates the guideline's cautious stance on mannose in pregnancy.
      selected_evidence:
        snippet: It is unknown whether mannose is harmful to human fetuses during gestation; however,
          mothers who are at risk for having MPI-CDG children and who consume mannose during pregnancy
          hoping to benefit an affected fetus in utero should be cautious.
        supports: SUPPORT
