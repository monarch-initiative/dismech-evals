          mannose) allows intracellular mannose-6-phosphate to accumulate. Mannose-6-phosphate inhibits
          hexokinase, phosphoglucose isomerase and glucose-6-phosphate dehydrogenase, suppressing glycolysis
          and depleting ATP - the "honeybee effect". This underlies reported seizures and stupor during
