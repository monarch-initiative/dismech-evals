      assertion_type: Pathophysiology
      assertion:
        name: Phosphomannose Isomerase Deficiency
        biological_scale: MOLECULAR
        role: trigger
        description: Biallelic loss-of-function or hypomorphic variants in MPI reduce the activity of
          phosphomannose (mannose-6-phosphate) isomerase, the mainly cytosolic enzyme that interconverts
          fructose-6-phosphate and mannose-6-phosphate. Residual enzyme activity in patient leukocytes
          and fibroblasts is typically below 10% of normal. Because fructose-6-phosphate is a glycolytic
          intermediate, the block itself does not cause accumulation of a toxic upstream substrate; the
          lesion is one of insufficient mannose-6-phosphate supply.
        genes:
        - preferred_term: MPI
          term:
            id: hgnc:7216
            label: MPI
        molecular_functions:
        - preferred_term: mannose-6-phosphate isomerase activity
          modifier: DECREASED
          term:
            id: GO:0004476
            label: mannose-6-phosphate isomerase activity
        biological_processes:
        - preferred_term: mannose metabolic process
          modifier: DECREASED
          term:
            id: GO:0006013
            label: mannose metabolic process
        chemical_entities:
        - preferred_term: D-mannose 6-phosphate
          modifier: DECREASED
          term:
            id: CHEBI:17369
            label: D-mannose 6-phosphate
        cell_types:
        - preferred_term: Hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: In described MPI-CDG patients, enzyme activities were usually very deficient with activities
          less than 10% of normal values in both leukocytes and fibroblasts.
        supports: SUPPORT
    origin:
