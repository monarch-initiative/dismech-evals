        prompt: What causes the recurrent, sometimes unusual infections reported in MPI-CDG patients whose
          conventional immune function studies are normal?
        attaches_to:
        - phenotypes#Recurrent infections
        rationale: 'The secondary IgG loss of protein-losing enteropathy explains hypogammaglobulinaemia
          but not the reported infection phenotype: the patient with the most striking unusual infections
          and the four patients with recurrent fever, leucocytosis and sepsis all had normal conventional
          immunological testing. Glycosylation-dependent immune dysfunction is known in other CDGs, so
          a primary MPI-specific immune defect is plausible but undemonstrated. No causal edge is drawn
          to this phenotype for that reason.'
      selected_evidence:
        snippet: Although an immunodeficiency was very likely, the conventional immune function studies
          were normal.
        supports: SUPPORT
