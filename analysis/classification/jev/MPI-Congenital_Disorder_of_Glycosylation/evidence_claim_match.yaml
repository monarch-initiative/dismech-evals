  2a7aeacb58f98b847ef47665402c4371458b29197736048567201a2c0473ba2c:
    claim:
      about:
        disease:
          name: MPI-congenital disorder of glycosylation
          disease_term:
            preferred_term: MPI-congenital disorder of glycosylation
            term:
              id: MONDO:0011257
              label: MPI-congenital disorder of glycosylation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GDP-Mannose Depletion and Impaired Lipid-Linked Oligosaccharide Assembly
        biological_scale: MOLECULAR
        conforms_to: congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect
        description: Mannose-6-phosphate is the committed precursor of GDP-mannose, the mannosyl donor
          for assembly of the dolichol-linked (lipid-linked) oligosaccharide in the endoplasmic reticulum.
          In MPI deficiency the endogenous route to mannose-6-phosphate fails and dietary mannose is insufficient
          to compensate under ordinary conditions, so lipid-linked oligosaccharide synthesis is curtailed
          and incomplete precursors are transferred to nascent protein - the canonical CDG type I lesion.
          Plasma mannose is under 10 micromol/L in patients versus 50-100 micromol/L in healthy individuals.
          This is the step at which exogenous D-mannose therapy re-enters the pathway.
        biological_processes:
        - preferred_term: GDP-mannose biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0009298
            label: GDP-mannose biosynthetic process
        - preferred_term: dolichol-linked oligosaccharide biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0006488
            label: dolichol-linked oligosaccharide biosynthetic process
        cellular_components:
        - preferred_term: endoplasmic reticulum
          term:
            id: GO:0005783
            label: endoplasmic reticulum
        chemical_entities:
        - preferred_term: GDP-mannose
          modifier: DECREASED
          term:
            id: CHEBI:21168
            label: GDP-mannose
      selected_evidence:
        snippet: Synthesis of the lipid-linked oligosaccharide (LLO), which serves as the sugar donor
          for the N-glycosylation of secretory proteins, requires conversion of fructose-6-phosphate to
          mannose-6-phosphate via the phosphomannose isomerase (MPI) enzyme.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22899857
      reference_title: A zebrafish model of congenital disorders of glycosylation with phosphomannose
        isomerase deficiency reveals an early opportunity for corrective mannose supplementation.
      evidence_source: OTHER
      explanation: Places the MPI reaction directly upstream of lipid-linked oligosaccharide synthesis.
