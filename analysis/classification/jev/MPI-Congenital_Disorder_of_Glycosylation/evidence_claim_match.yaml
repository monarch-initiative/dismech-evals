  fe92d22fe706d336fdf8879d1f76af53eb1f4d1ac23523287edd84a614f57803:
    claim:
      about:
        disease:
          name: MPI-congenital disorder of glycosylation
          disease_term:
            preferred_term: MPI-congenital disorder of glycosylation
            term:
              id: MONDO:0011257
              label: MPI-congenital disorder of glycosylation
        context: []
      assertion_type: Treatment
      assertion:
        name: Multisystem surveillance programme
        action_category: MONITORING
        description: 'Because the hepatic arm progresses independently of mannose and the coagulopathy
          fluctuates with intercurrent illness, the consensus guideline specifies scheduled surveillance
          rather than symptom-driven review: six-monthly liver chemistry (transaminases, GGT, bilirubin,
          alpha-fetoprotein, prothrombin time) plus liver ultrasound; annual elastography where transaminases
          remain elevated; annual and then at least three-yearly oesophageal endoscopy once portal hypertension
          is present, with echocardiography and oximetry for portopulmonary hypertension and hepatopulmonary
          syndrome; a broad annual haemostasis panel, repeated around infection, dehydration and any invasive
          procedure; albumin at a frequency set by the presence and severity of protein-losing enteropathy
          and the treatment response; and glucose, thyroid/IGF-axis, renal, immunoglobulin and nutritional
          review.'
        treatment_term:
          preferred_term: scheduled multisystem disease surveillance
        notes: NCIT has no clinical-action term for scheduled disease surveillance that is reachable from
          NCIT:C25218 (Clinical Intervention or Procedure) - the obvious candidate, NCIT:C61256 Monitoring,
          is not in that subtree - so treatment_term carries a free-text preferred_term only, per the
          documented fallback. The MONITORING action_category makes the intent machine-queryable, and
          target_phenotypes/target_mechanisms are deliberately omitted because surveillance does not modify
          pathophysiology.
      selected_evidence:
        snippet: Broad haemostatic study including fibrinogen, prothrombin time, partial thromboplastin
          time, factor VIII, factor IX, factor XI, AT, PC, and PS, complete blood count and differential
          should be performed at diagnosis and then annually.
        supports: SUPPORT
    origin:
