      assertion_type: Discussion
      assertion:
        discussion_id: mpi_cdg_hyperinsulinism_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does hyperinsulinaemic hypoglycaemia occur in MPI-CDG, and which hypoglycosylated
          beta-cell protein is responsible?
        attaches_to:
        - pathophysiology#Hyperinsulinaemic Hypoglycaemia
        rationale: Hyperinsulinism accounts for more than two-thirds of hypoglycaemia in MPI-CDG and also
          occurs in PGM1-CDG and PMM2-CDG, suggesting a shared glycosylation-dependent mechanism, but
          the consensus guideline states the cause is unknown. Hypoglycosylation of the sulfonylurea receptor
          SUR1 is proposed and altered insulin secretion has been shown in hypoglycosylated murine beta
          cells, but neither has been demonstrated in human MPI-CDG islets. Resolving this would clarify
          why mannose corrects the hypoglycaemia and whether beta-cell-directed therapy is ever needed
          beyond diazoxide.
      selected_evidence:
        snippet: However, the exact cause of HH in CDG patients is still unknown.
        supports: SUPPORT
