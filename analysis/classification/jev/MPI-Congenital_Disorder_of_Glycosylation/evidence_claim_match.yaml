            term:
              id: MONDO:0011257
              label: MPI-congenital disorder of glycosylation
        context: []
      assertion_type: Treatment
      assertion:
        name: Oral D-mannose supplementation
        description: Oral D-mannose is the disease-specific therapy and the reason MPI-CDG is one of the
          few treatable CDGs. Exogenous mannose is phosphorylated by hexokinase to mannose-6-phosphate,
          entering the N-glycosylation pathway downstream of the MPI block. The recommended dose is 150-170
          mg/kg per dose, four to five times daily, started as soon as the diagnosis is made and continued
          lifelong. It corrects the digestive symptoms, hypoglycaemia and coagulopathy, but it does not
          treat the hepatic disease. Clinical response usually begins within a week while biochemical
          abnormalities take months to stabilise. Abdominal pain and diarrhoea are the main side effects.
          Poor compliance is associated with relapse.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: D-mannose
            term:
              id: CHEBI:16024
              label: D-mannose
        target_phenotypes:
        - preferred_term: Protein-losing enteropathy
          term:
            id: HP:0002243
            label: Protein-losing enteropathy
        - preferred_term: Hypoglycemia
          term:
            id: HP:0001943
            label: Hypoglycemia
        - preferred_term: Reduced antithrombin III activity
          term:
            id: HP:0001976
            label: Reduced antithrombin III activity
        notes: 'Intravenous mannose is NOT recommended for stable patients and must be reserved for life-threatening
          situations in which oral intake is impossible, because mannose-6-phosphate accumulation can
          precipitate seizures, stupor and haemolysis. Caution is advised with mannose (and mannose-containing
          antibiotics) in pregnancy, since mannose accelerated embryonic death in Mpi-null mice and caused
          blindness in Mpi hypomorphic mice. Monitoring on oral therapy: unconjugated bilirubin, blood
          count, HbA1c and mannose levels every three months, targeting mannose above 20 micromol/L before
          a dose and above 100 micromol/L one hour after.'
      selected_evidence:
        snippet: Poor compliance with D-mannose was correlated with recurrence of diarrhea, thrombosis,
          and abnormal biological parameters including coagulation factors and transferrin profiles.
        supports: SUPPORT
