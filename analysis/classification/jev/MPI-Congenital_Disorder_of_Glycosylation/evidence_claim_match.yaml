      selected_evidence:
        snippet: Probing for the underlying enzyme defect(s) using cultured skin fibroblasts demonstrated
          normal activity of phosphomannomutase, whereas the activity of phosphomannose isomerase (MPI)
          was reduced (0.64 mU/mg protein, reference 2.1-6.9), pointing to CDG of the MPI subtype (formerly
          called CDG-Ib).
        supports: SUPPORT
