      assertion:
        name: Normal cognitive development
        category: Neurologic
        description: In sharp contrast with almost all other congenital disorders of glycosylation, intellect
          and psychomotor development are normal in MPI-CDG. Mild developmental delay was reported in
          only four of 35 patients in the consensus review and normalised in most; no patient in the 2023
          review of 52 cases had intellectual disability, and brain imaging is unremarkable. Transient
          neurological findings - hypotonia in five patients and the mild developmental delay above -
          mostly normalise in early childhood or were secondary to severe systemic illness, so they are
          documented within this sparing entry as a deliberate scoping choice rather than modeled as standalone
          phenotypes.
      selected_evidence:
        snippet: None of the patients was reported to have an intellectual disability (0/28).
