        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic MRPL44 Loss of Function and mL44 Protein Depletion
        biological_scale: MOLECULAR
        description: Pathogenic MRPL44 genotypes reduce steady-state mL44 abundance in examined patient
          tissues and fibroblasts. The recurrent p.Leu156Arg allele is associated with protein instability.
          The p.Thr161Serfs*2 allele is predicted to be null; p.Leu156Pro was observed in trans with p.Leu156Arg,
          so residual protein cannot be assigned specifically to the proline allele. These functional
          observations are not extended to the p.Arg78Gln or 2025 delins alleles. mL44 is a mitochondrial
          large-subunit protein; murine-expression experiments support matrix localization and multimer
          formation.
        gene:
          preferred_term: MRPL44
          term:
            id: hgnc:16650
            label: MRPL44
        cellular_components:
        - preferred_term: mitochondrial large ribosomal subunit
          term:
            id: GO:0005762
            label: mitochondrial large ribosomal subunit
      selected_evidence:
        snippet: We found severely reduced MRPL44 levels in the patient's heart, skeletal muscle and fibroblasts
          suggesting that the missense mutation affected the protein stability.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23315540
      reference_title: Whole-exome sequencing identifies a mutation in the mitochondrial ribosome protein
