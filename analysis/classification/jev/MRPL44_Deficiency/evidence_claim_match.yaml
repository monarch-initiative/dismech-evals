      assertion_type: Discussion
      assertion:
        discussion_id: gap_nutrient_dependent_hypothesis_validation
        prompt: Does the postnatal glucose-to-fatty-acid fuel switch causally trigger MRPL44 hypertrophic
          cardiomyopathy in vivo, and does the ISRmt/lipid-handling arm represent a tractable therapeutic
          target distinct from OXPHOS repletion?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Nutrient-Dependent Metabolic Stress Response in Cardiomyocytes
        rationale: 'The nutrient-dependent model is currently supported by a single unreviewed preprint
          using one patient iPSC line in short-term culture, with immature in-vitro cardiomyocyte physiology.
          It is mechanistically attractive because it would explain the otherwise puzzling perinatal timing
          of disease onset, and because it points to a stress-signalling rather than purely bioenergetic
          target. It must not, however, be translated into fat restriction, ketogenic diet, or any other
          dietary manipulation: no clinical evidence supports this, and fasting/catabolic stress is itself
          a recognized hazard in mitochondrial disease. Replication across genotypes, in matured or engineered
          heart tissue, and ideally in vivo is required.'
        proposed_experiments:
        - experiment_id: exp_mrpl44_fuel_switch_replication
          name: Multi-genotype nutrient-switch replication in matured cardiac tissue
          description: Replicate the glucose-versus-lipid comparison across at least three MRPL44 genotypes
            plus isogenic controls in maturation-promoted engineered heart tissue, with longitudinal transcriptomics,
            lipidomics, contractile force, and ISRmt readouts, and test whether pharmacological ISRmt
            attenuation rescues the lipid-condition phenotype.
          experiment_type:
            preferred_term: engineered heart tissue nutrient-switch assay
          model_systems:
          - name: Engineered human heart tissue
            description: Maturation-promoted 3D engineered heart tissue from MRPL44-mutant and isogenic
              control iPSCs, addressing the immaturity limitation of monolayer iPSC cardiomyocytes.
            experimental_model_type: OTHER
      selected_evidence:
        snippet: Our findings indicate that glucose and lipids, the latter being the postnatally favored
          cardiac fuel, exert remarkably different consequences in MRPL44 deficient cardiomyocytes.
        supports: SUPPORT
