            term:
              id: MONDO:0014162
              label: infantile hypertrophic cardiomyopathy due to MRPL44 deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cardiac_tissue_selectivity
        prompt: What determines the striking tissue gradient of MRPL44 deficiency, in which heart muscle
          shows profound respiratory chain deficiency, skeletal muscle intermediate, and fibroblasts only
          borderline changes, despite comparable reduction of mL44 protein in all three tissues?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Cardiomyocyte Contractile Element Loss
        rationale: mL44 protein levels are reduced in heart, skeletal muscle, and fibroblasts alike, yet
          the enzymatic and clinical consequences are overwhelmingly cardiac. Candidate explanations include
          the higher OXPHOS flux demand and mitochondrial density of the myocardium, the postnatal switch
          to fatty-acid oxidation (the nutrient-dependent hypothesis), tissue-specific differences in
          mitoribosome assembly-factor buffering, and a possible transcript hierarchy in mitochondrial
          translation - the yeast work showed that MrpL3/mL44 mutation does not affect all mtDNA-encoded
          transcripts equally. Distinguishing a threshold effect from a genuinely cardiac-specific mechanism
          is required before extrapolating any therapy tested in fibroblasts to the heart.
      selected_evidence:
        snippet: we observed that mutation of the MrpL3/mL44 does not impact the translation of all mitochondrial
          encoded proteins equally, suggesting the mitochondrial translation system may exhibit a transcript
          hierarchy and prioritization.
        supports: SUPPORT
    origin:
