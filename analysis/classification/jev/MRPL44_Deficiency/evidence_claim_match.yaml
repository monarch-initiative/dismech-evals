        prompt: Which mechanisms account for early metabolic and feeding findings?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Lactic Acidosis
        - phenotypes#Hypoglycemia
        - phenotypes#Hypothermia
        - phenotypes#Hyperammonemia
        - phenotypes#Feeding Difficulties in Infancy
        - phenotypes#Failure to Thrive
        rationale: The infant report establishes neonatal acidosis, hypoglycemia and feeding difficulty,
          with transient hyperammonemia in Patient 2 and hypothermia in Patient 1. A qualified OXPHOS-to-lactic-acidosis
          route is represented using established pyruvate/redox physiology and the MRPL44 clinical measurements;
          missing tissue-level reconstruction does not negate that relation. The precise tissue contribution
          and possible cardiac/illness amplification remain unresolved. Intrinsic hypoglycemia, hypothermia,
          hyperammonemia and feeding difficulty are less causally localized by these sources. Hypoglycemia
          preceded cardiac shock; the shock link concerns its acute exacerbation only. Feeding insufficiency
          has a supported nutritional route to poor growth. Patient 1 also carried a 16q23.3 deletion.
          No blanket ATP-depletion fanout is asserted.
      selected_evidence:
        snippet: She presented on the second day of life with Kussmaul breathing due to metabolic acidosis
          (pH < 7.0, base excess – 27 mEq/L), with elevated lactate 19 mmol/L (normal < 2 mmol/L) and
          mildly elevated ammonia 180 μM (normal < 100 μM).
        supports: SUPPORT
