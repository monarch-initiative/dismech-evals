        attaches_to:
        - phenotypes#Hepatic Steatosis
        - phenotypes#Elevated Hepatic Transaminases
        - phenotypes#Renal Insufficiency
        - phenotypes#Hepatic Failure
        rationale: Chronic renal insufficiency and hepatopathy occur in the multisystem literature; the
          Orphanet definition specifies steatosis and elevated transaminases. These sources do not establish
          a renal cell compartment or demonstrate a liver-specific lipid/ATP pathway. The infant’s renal
          dysfunction and hepatic failure during shock support separately qualified secondary circulatory
          routes, which must not be transferred to the chronic organ findings. Cardiac iPSC lipid droplets
          are not evidence for a hepatocyte steatosis mechanism.
