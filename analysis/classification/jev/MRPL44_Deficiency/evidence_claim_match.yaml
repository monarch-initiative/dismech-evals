        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_yeast_mrpl3_l156r_equivalent
        prompt: Can the yeast MrpL3/mL44 homolog or a mouse Mrpl44 knockout serve as a valid model for
          human MRPL44 disease alleles, given that the human disease mutation modelled at the equivalent
          yeast residue does not impair function and that mouse null loss is embryonically lethal?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Biallelic MRPL44 Loss of Function and mL44 Protein Depletion
        - pathophysiology#Large Mitoribosomal Subunit Assembly Defect
        rationale: 'Yeast MrpL3/mL44 is the tractable genetic model for mL44 function, and mutagenesis
          of its conserved hydrophobic pocket does identify residues critical for assembling translationally
          active mitoribosomes. However, the exact human disease substitution modelled at the equivalent
          yeast residue (A186) had no major functional impact, and the authors concluded the two orthologs
          have diverged in evolution. Mouse Mrpl44 loss is a different kind of mismatch: knockout is embryonically
          lethal, whereas human patients carry hypomorphic alleles with residual protein and survive with
          tissue-restricted disease. Neither model therefore reproduces the human hypomorphic, cardiac-selective
          genotype-phenotype relationship, and both should be treated as tools for general mitoribosome
          biology rather than as MRPL44 disease models. Patient-derived iPSC cardiomyocytes are the emerging
          replacement, but the only published line covers a single genotype and the work remains a preprint.'
        proposed_experiments:
        - experiment_id: exp_mrpl44_isogenic_ipsc_cardiomyocyte
          name: Isogenic MRPL44 iPSC-derived cardiomyocyte allelic series
          description: Engineer an allelic series (p.Leu156Arg, p.Leu156Pro, p.Thr161Serfs*2, and corrected
            wild type) in a common human iPSC background, differentiate to cardiomyocytes, and quantify
            mL44 abundance, 39S assembly, mitochondrial translation, complex I and IV activity, and contractile
            function, testing whether the human cardiac context reproduces the allele-severity gradient
            that neither yeast nor mouse captures.
          experiment_type:
            preferred_term: isogenic iPSC-derived cardiomyocyte allelic series
          model_systems:
          - name: Human iPSC-derived cardiomyocyte
            description: Cardiomyocytes differentiated from gene-edited human iPSCs carrying the reported
              MRPL44 disease alleles, preserving the human sequence context that diverges from yeast MrpL3.
            experimental_model_type: OTHER
      selected_evidence:
        snippet: In mice, it is expressed widely throughout multiple tissues during development and its
          absence is embryonically lethal
        supports: SUPPORT
