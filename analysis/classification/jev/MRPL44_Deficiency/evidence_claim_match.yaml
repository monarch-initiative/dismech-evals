        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: nutrient_dependent_postnatal_manifestation
        hypothesis_label: Postnatal glucose-to-fatty-acid fuel switch as the trigger for MRPL44 cardiomyopathy
          manifestation
        status: EMERGING
        description: A single-patient preprint proposes that nutrient-dependent mitochondrial stress contributes
          to perinatal hypertrophy. One homozygous p.Leu156Arg iPSC line was compared with three healthy
          donor lines, without an isogenic correction. The 72-hour media comparison used 2 g/L glucose
          versus 1 g/L glucose with oleate 100 μM and palmitate 50 μM, not glucose-free fatty-acid conditions.
          In glucose-rich medium, mtDNA copy number, mitochondrial area and transcripts increased despite
          reduced complex I protein. Lipid-enriched medium induced mitochondrial and partial ER stress,
          with XBP1 expression but no splicing and no FGF21 induction. Transcript-based mTOR prediction
          and inferred lipid utilization do not measure mTOR activity or fatty-acid oxidation flux. The
          proposed contribution to hypertrophic growth remains provisional and does not justify dietary
          treatment.
      selected_evidence:
        snippet: These observations provide a mechanistic basis for postnatal disease manifestation and
          highlight nutrient metabolism as a key driver in development of infantile-onset mitochondrial
          hypertrophic cardiomyopathy.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1101/2025.09.24.678132
      reference_title: Nutrient-dependent pathology in mitochondrial hypertrophic cardiomyopathy model
      evidence_source: OTHER
      explanation: States the hypothesis directly. Preprint, one patient iPSC line, awaiting peer review
        and replication.
