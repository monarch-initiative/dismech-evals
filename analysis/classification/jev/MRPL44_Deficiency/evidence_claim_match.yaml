  dc8797913361d388939654ba0556fc5a50976620f9f3122db7522d428e98801a:
    claim:
      about:
        disease:
          name: MRPL44 Deficiency
          disease_term:
            preferred_term: Infantile hypertrophic cardiomyopathy due to MRPL44 deficiency
            term:
              id: MONDO:0014162
              label: infantile hypertrophic cardiomyopathy due to MRPL44 deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: MRPL44 biallelic pathogenic variants
        gene_term:
          preferred_term: MRPL44
          term:
            id: hgnc:16650
            label: MRPL44
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: MRPL44 (2q36.1) encodes mL44, a 39S mitoribosomal protein with an RNase III-like domain
          spanning residues 86–228. Patient genotypes containing p.Leu156Arg, p.Leu156Pro or p.Thr161Serfs*2
          showed reduced mL44 abundance; the compound-heterozygous assays did not resolve residual protein
          from each individual allele. The p.Arg78Gln allele and the 2025 p.(Trp66_His69delinsCysAsn)
          allele lie outside that domain. The reviewed sources do not establish allele-specific protein-abundance
          effects for them; the 2025 delins interpretation is computational and its formal classification
          remains VUS. These case reports do not establish population allele frequencies or validated
          modifier effects.
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
          description: 'Disease requires biallelic MRPL44 variants - homozygous in consanguineous or founder
            settings, compound heterozygous otherwise. One reported patient became homozygous through
            complete maternal uniparental isodisomy of chromosome 2 rather than by biparental transmission,
            so a homozygous MRPL44 result with only one carrier parent should prompt uniparental disomy
            testing (and altered recurrence-risk counselling) rather than being dismissed as non-paternity.

            '
        variants:
        - name: MRPL44 c.467T>G, p.(Leu156Arg)
          description: 'The recurrent missense allele, present in 9 of the first 10 published disease
            alleles. It is located in the conserved hydrophobic pocket of the RNase III-like domain and
            strongly reduces mL44 protein levels while leaving some residual protein and activity. Homozygotes
            have been reported with both fatal infantile cardiomyopathy and with later-onset multisystem
            disease, so genotype alone does not predict the clinical course.

            '
          gene:
            preferred_term: MRPL44
            term:
              id: hgnc:16650
              label: MRPL44
          clinical_significance: PATHOGENIC
        - name: MRPL44 c.233G>A, p.(Arg78Gln)
          description: 'A missense allele identified in compound heterozygosity with the recurrent p.Leu156Arg
            variant in a patient with childhood-onset hypertrophic cardiomyopathy plus late multisystem
            features. No clinical_significance is recorded here deliberately: unlike the other four alleles,
            p.Arg78Gln has never been assigned a formal ACMG classification in the literature and has
            not been functionally assayed (no protein-abundance, mitoribosome-assembly, or translation
            data exist for it), so any classification would be curator invention rather than a sourced
            claim.

            '
          gene:
            preferred_term: MRPL44
            term:
              id: hgnc:16650
              label: MRPL44
        - name: MRPL44 c.481_484delinsTC, p.(Thr161Serfs*2)
          description: 'A frameshift allele predicted to trigger nonsense-mediated decay or produce a
            premature stop codon, i.e. a true null. In trans with p.Leu156Arg it produced the most severe
            biochemical phenotype in the published series - mitochondrial protein synthesis at roughly
            a third of controls - and fatal infantile cardiomyopathy.

            '
          gene:
            preferred_term: MRPL44
            term:
              id: hgnc:16650
              label: MRPL44
          clinical_significance: PATHOGENIC
        - name: MRPL44 c.467T>C, p.(Leu156Pro)
          description: A second substitution at Leu156, observed in trans with p.Leu156Arg. The authors
            predict a disruptive proline substitution. Reduced mL44 abundance was measured in the compound-heterozygous
            cells, without assigning residual protein specifically to the proline allele.
          gene:
            preferred_term: MRPL44
            term:
              id: hgnc:16650
              label: MRPL44
          clinical_significance: PATHOGENIC
        - name: MRPL44 c.198_205delinsTA, p.(Trp66_His69delinsCysAsn)
          description: 'A homozygous delins allele reported in a Tunisian family with severe hypertrophic
            cardiomyopathy affecting two siblings. It shortens the protein and was absent from ClinVar
            and HGMD at the time of reporting; formal ACMG classification was VUS, with pathogenicity
            supported by co-segregation and in silico structural modelling rather than by functional assays.

            '
          gene:
            preferred_term: MRPL44
            term:
              id: hgnc:16650
              label: MRPL44
          clinical_significance: UNCERTAIN_SIGNIFICANCE
      selected_evidence:
        snippet: The disease genes converge on metabolic causes (PRKAG2, MRPL44, AARS2, HADHB, DNAJC19,
          PPA2, TAZ, BAG3), MAPK pathways (HRAS, PTPN11, RAF1, TAB2), development (NEK8 and TBX20), calcium
          signaling (JPH2, CALM1, CACNA1C), and the sarcomeric contraction cycle (TNNC1, TNNI3, ACTC1,
          MYH7, NRAP).
        supports: SUPPORT
