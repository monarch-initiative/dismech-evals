      assertion_type: Pathophysiology
      assertion:
        name: Nutrient-Dependent Metabolic Stress Response in Cardiomyocytes
        biological_scale: CELLULAR
        description: Lipid-enriched medium induced mitochondrial stress-response and partial ER-stress
          transcripts in the p.Leu156Arg iPSC-cardiomyocyte line, with lipid droplets and altered lipid-uptake/cholesterol
          genes. ATF5 targets increased; FGF21 induction and XBP1 splicing were absent. Fatty-acid utilization
          was inferred from these data rather than directly measured as oxidation flux. Ingenuity pathway
          analysis predicted mTOR changes; direct mTORC1 activation was not measured. The authors propose
          that nutrient-dependent stress promotes hypertrophic growth, a preprint hypothesis requiring
          replication and in-vivo testing.
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: In contrast the lipid-enriched medium triggered both mitochondrial and endoplasmic reticulum
          -related stress responses, disrupted lipid and cholesterol homeostasis, accompanied by remodeling
          of the central biosynthetic pathway of one carbon metabolism.
        supports: SUPPORT
