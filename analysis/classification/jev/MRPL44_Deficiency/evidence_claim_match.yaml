            term:
              id: MONDO:0014162
              label: infantile hypertrophic cardiomyopathy due to MRPL44 deficiency
        context: []
      assertion_type: ProgressionInfo
      assertion:
        notes: 'Variable course. Infantile-onset disease is dominated by rapidly progressive hypertrophic
          cardiomyopathy; cardiac decompensation within the first year of life has been fatal in several
          reported infants despite inotropes, ventricular assist devices, and ECMO. Children who stabilize
          after the first year may remain well with asymptomatic cardiomyopathy into adolescence, and
          at least one case of spontaneous resolution of the cardiomyopathy has been described. Some individuals
          homozygous for the recurrent p.Leu156Arg allele subsequently developed a slowly progressive
          multisystem phenotype in the second and third decades, with myopathy, exercise intolerance,
          hepatopathy, renal insufficiency, hemiplegic migraine, pigmentary retinopathy, and Leigh-like
          brain MRI lesions. This age-dependent emergence of neurological involvement is prognostically
          important when cardiac transplantation is being considered in infancy. No prospective natural-history
          study, survival estimate, or validated prognostic biomarker exists.

          '
      selected_evidence:
        snippet: A decompensation of the cardiac function in the first year resulted in demise.
        supports: SUPPORT
    origin:
