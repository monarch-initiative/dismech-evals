            id: GO:1902775
            label: mitochondrial large ribosomal subunit assembly
          modifier: DECREASED
      selected_evidence:
        snippet: In patient fibroblasts, decreased MRPL44 affected assembly of the large ribosomal subunit
          and stability of 16S rRNA leading to complex IV deficiency.
        supports: SUPPORT
