  405b2faf43187940090ed42d1fd45a164ac782da80c127c493c6d8beff3834e4:
    claim:
      about:
        disease:
          name: MRPL44 Deficiency
          disease_term:
            preferred_term: Infantile hypertrophic cardiomyopathy due to MRPL44 deficiency
            term:
              id: MONDO:0014162
              label: infantile hypertrophic cardiomyopathy due to MRPL44 deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_disproportionate_complex_iv_deficiency
        prompt: Why is complex IV activity disproportionately reduced relative to complex I in MRPL44
          deficiency, when the measured synthesis rates of complex I and complex IV mtDNA-encoded subunits
          are similarly depressed and complex I has more than twice as many mtDNA-encoded subunits?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Mitochondrial Translation
        - pathophysiology#Combined Complex I and IV Deficiency
        rationale: In most mitochondrial transcription and translation defects, complex I (seven mtDNA-encoded
          subunits) is more affected than complex IV (three) simply through subunit stoichiometry. MRPL44
          deficiency inverts this, as do LRPPRC and TACO1 disease. The 2021 functional study excluded
          the obvious explanation by showing that the newly synthesized complex IV subunits (MT-CO1, MT-CO2,
          MT-CO3) were reduced to approximately the same degree as complex I subunits (average 30.1% versus
          34.3% of controls, not significantly different). A difference in post-synthetic stability of
          the assembled subunits was proposed but could not be excluded or confirmed. Resolving this matters
          because a complex IV-selective post-translational bottleneck would be a different therapeutic
          target from generic mitoribosome insufficiency.
        proposed_experiments:
        - experiment_id: exp_mrpl44_cox_subunit_pulse_chase
          name: Pulse-chase stability assay of mtDNA-encoded complex IV versus complex I subunits
          description: In MRPL44-patient and isogenic corrected cardiomyocytes, perform 35S pulse-chase
            labelling with quantification of the decay rate of newly synthesized MT-CO1/2/3 versus MT-ND
            subunits, to test whether the excess complex IV deficit arises from accelerated degradation
            of unassembled cytochrome c oxidase subunits rather than from unequal synthesis.
          experiment_type:
            preferred_term: pulse-chase protein stability assay
          model_systems:
          - name: Patient iPSC-derived cardiomyocyte
            description: MRPL44-mutant patient iPSC-derived cardiomyocytes with isogenic corrected controls,
              providing the human cardiac context where the biochemical defect is most severe.
            experimental_model_type: OTHER
      selected_evidence:
        snippet: The reason for this more pronounced defect in complex IV is not clear.
        supports: SUPPORT
