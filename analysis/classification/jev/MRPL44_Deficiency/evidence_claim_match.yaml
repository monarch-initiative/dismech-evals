        biological_scale: MOLECULAR
        description: 'Loss of mL44 reduces the amount of assembled large (39S) mitoribosomal subunit and
          destabilizes the mtDNA-encoded 16S rRNA that forms its scaffold, while leaving the small (28S)
          subunit largely intact. Retroviral re-expression of wild-type MRPL44 in patient fibroblasts
          restores the large subunit assembly defect, establishing the causal direction.

          '
        cellular_components:
        - preferred_term: mitochondrial large ribosomal subunit
          term:
            id: GO:0005762
            label: mitochondrial large ribosomal subunit
        biological_processes:
