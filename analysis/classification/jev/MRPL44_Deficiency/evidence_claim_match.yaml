              showed reduced mL44 abundance; the compound-heterozygous assays did not resolve residual
              protein from each individual allele. The p.Arg78Gln allele and the 2025 p.(Trp66_His69delinsCysAsn)
              allele lie outside that domain. The reviewed sources do not establish allele-specific protein-abundance
              effects for them; the 2025 delins interpretation is computational and its formal classification
              remains VUS. These case reports do not establish population allele frequencies or validated
              modifier effects.
