              label: colorectal cancer
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DNA Mismatch Repair Deficiency
        conforms_to: genome_instability_mutation#Genome-Maintenance Defect or Replication Stress
        description: Loss of MMR protein function (MLH1, MSH2, MSH6, or PMS2) impairs the recognition
          and repair of DNA replication errors. The MMR system normally corrects base-base mismatches
          and insertion/deletion loops at microsatellite sequences. Deficiency leads to accumulation of
          thousands of somatic mutations.
        cell_types:
        - preferred_term: colon epithelial cell
          term:
            id: CL:0011108
            label: colon epithelial cell
        biological_processes:
        - preferred_term: mismatch repair
          modifier: DECREASED
          term:
            id: GO:0006298
            label: mismatch repair
      selected_evidence:
        snippet: High microsatellite instability (MSI-H) colorectal cancer (CRC), caused by deficient
          mismatch repair, accounts for about 15% of all CRC cases and is more common in right-sided tumors.
        supports: SUPPORT
    origin:
