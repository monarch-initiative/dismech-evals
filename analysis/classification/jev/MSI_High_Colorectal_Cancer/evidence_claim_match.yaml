      assertion_type: Subtype
      assertion:
        name: Lynch Syndrome-Associated MSI-H CRC
        description: Hereditary MSI-H colorectal cancer caused by germline mutations in MMR genes (MLH1,
          MSH2, MSH6, PMS2) or EPCAM deletions affecting MSH2. Accounts for approximately 3% of all CRC.
          Younger age at onset, right-sided predominance, and risk of synchronous/metachronous cancers.
        mappings:
          ncit_mappings:
          - term:
              id: NCIT:C8494
              label: Lynch Syndrome
            mapping_predicate: skos:closeMatch
            mapping_source: NCIT
            mapping_justification: NCIT provides a closely related hereditary syndrome term for the germline
              etiology underlying this MSI-H CRC subtype.
      selected_evidence:
        snippet: Colorectal cancers resulting from defective DNA mismatch repair can occur in both hereditary
          non-polyposis colon cancer (HNPCC) and in the sporadic setting.
        supports: SUPPORT
    origin:
