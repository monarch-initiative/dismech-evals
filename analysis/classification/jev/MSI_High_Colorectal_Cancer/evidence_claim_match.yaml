      assertion_type: Pathophysiology
      assertion:
        name: PD-L1 Upregulation and Immune Evasion
        conforms_to: immune_checkpoint_blockade#Adaptive Immune Resistance
        description: MSI-H tumors upregulate PD-L1 expression in response to interferon-gamma from infiltrating
          T cells. PD-L1 engagement of PD-1 on T cells suppresses cytotoxic function, allowing immune
          evasion despite the immunogenic microenvironment. This makes MSI-H tumors vulnerable to PD-1/PD-L1
          blockade.
        biological_processes:
        - preferred_term: Negative Regulation of T Cell Mediated Immunity
          term:
            id: GO:0002710
            label: negative regulation of T cell mediated immunity
          modifier: INCREASED
      selected_evidence:
        snippet: Tumor samples evaluated by multiplex quantitative immunofluorescence analysis showed
          variable PD-L1 protein expression with higher levels in cytokeratin-negative stromal cells than
          in cytokeratin-expressing cancer cells, as well as lymphocytic infiltration enriched for cells
          expressing CD8 or CD20.
        supports: SUPPORT
