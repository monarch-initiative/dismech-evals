        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Desmosterolosis
        description: A post-squalene disorder caused by deficiency of 3beta-hydroxysterol-Delta24-reductase
          (DHCR24). It sits in the same autosomal recessive, sterol-profile-diagnosed group as MSMO1 deficiency
          and is routinely tabulated alongside it, but desmosterol rather than C4-methylsterol is the
          accumulating species, and it presents with prominent congenital anomalies and minimal skin disease
          - close to the inverse of the MSMO1 cutaneous-predominant phenotype.
        distinguishing_features:
        - Deficient enzyme is DHCR24 (3beta-hydroxysterol Delta24-reductase), not MSMO1
        - Desmosterol accumulates in plasma, tissue and cultured cells, whereas MSMO1 deficiency accumulates
          4-monomethyl and 4,4-dimethylsterols
        - Prominent congenital anomalies with minimal skin abnormality, the opposite emphasis to the severe
          ichthyosiform/psoriasiform dermatitis of MSMO1 deficiency
        disease_term:
          preferred_term: Desmosterolosis
          term:
            id: MONDO:0011217
            label: desmosterolosis
      selected_evidence:
        snippet: Patients with desmosterolosis have elevated levels of the cholesterol precursor desmosterol,
          in plasma, tissue, and cultured cells; this abnormality suggests a deficiency of the enzyme
          3beta-hydroxysterol Delta24-reductase (DHCR24), which, in cholesterol biosynthesis, catalyzes
          the reduction of the Delta24 double bond of sterol intermediates.
        supports: SUPPORT
