      assertion_type: Discussion
      assertion:
        discussion_id: msmo1_no_mouse_model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does any available Msmo1 mouse allele model human MSMO1 deficiency, given that every reported
          human allele is a hypomorphic missense change while the available mouse alleles are nulls and
          gene traps, and zebrafish msmo1 nulls are larval lethal?
        attaches_to:
        - pathophysiology#MSMO1 Deficiency
        rationale: The zebrafish null is lethal, so a mouse null would most plausibly be embryonic or
          perinatal lethal, and an absence of adult phenotypes in a knockout pipeline would reflect absent
          homozygotes rather than a benign knockout. No published mouse model reproducing the human microcephaly,
          cataract and psoriasiform dermatitis phenotype was identified. The informative mammalian in
          vivo data come from Nsdhl mice, which model CHILD syndrome and are a paralog, not an MSMO1 model.
        proposed_experiments:
        - experiment_id: exp_msmo1_hypomorphic_knockin_mouse
          experiment_design: TARGETED_PERTURBATION
          name: Hypomorphic Msmo1 knock-in mouse
          description: Generate and characterise a mouse carrying a recurrent human hypomorphic allele
            such as p.Tyr244Cys or p.Gly115Arg, and test whether it reproduces the cutaneous, ocular and
            neurodevelopmental phenotype.
        - experiment_id: exp_msmo1_null_lethality_staging
          experiment_design: TARGETED_PERTURBATION
          name: Staging of Msmo1 null lethality in mouse
          description: Determine homozygous viability for existing Msmo1 null and gene-trap alleles and
            stage any embryonic or perinatal lethality, so that an absence of adult phenotypes is not
            misread as a benign knockout.
      selected_evidence:
        snippet: Generated msmo1nu81 knockdown mutation resulted in lethality at larval stage.
        supports: SUPPORT
