        description: Congenital hemidysplasia with ichthyosiform erythroderma and limb defects, caused
          by NSDHL variants. NSDHL is the immediate partner of MSMO1 in the same C4-demethylation complex
          and CHILD syndrome is the disorder for which topical cholesterol plus statin therapy is best
          known, so treatment and mechanism literature is easily misattributed between the two. CHILD
          syndrome is X-linked dominant with characteristically lateralised skin and limb involvement,
          whereas MSMO1 deficiency is autosomal recessive with generalised psoriasiform dermatitis.
        distinguishing_features:
        - Caused by NSDHL, the immediate C4-demethylation partner of MSMO1, rather than MSMO1 itself
        - X-linked dominant with male lethality, not autosomal recessive
        - Strikingly lateralised (hemidysplastic) skin and ipsilateral limb defects
        - Congenital cataract, microcephaly and immune dysfunction are not its defining triad
        - Allelic with CK syndrome - both are NSDHL disorders that accumulate methyl sterols, so the discriminator
          against CK syndrome is clinical (lateralised cutaneous/limb disease in females) and not biochemical
        disease_term:
          preferred_term: CHILD syndrome
          term:
            id: MONDO:0010621
            label: CHILD syndrome
      selected_evidence:
        snippet: Finally, a prominent skin phenotype has been described in two patients with SC4MOL deficiency,
          who present with a severe ichthyosiform dermatosis and psoriasiform features.
        supports: SUPPORT
