        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the natural history of MSMO1 deficiency, and does treatment started presymptomatically
          change neurodevelopmental outcome?
        rationale: No registry, natural history study, survival analysis or quality-of-life measurement
          exists. All prognostic statements derive from a handful of individually reported patients. The
          cataract and microcephaly appear fixed before current diagnosis is possible, which is why the
          disorder is described as only partially treatable, but whether presymptomatic therapy following
          cascade testing of a sibling would alter the neurodevelopmental trajectory has never been tested.
        proposed_experiments:
        - experiment_id: exp_msmo1_natural_history_registry
          experiment_design: HUMAN_OBSERVATIONAL
          name: International MSMO1 deficiency registry
          description: Establish a registry with standardised developmental, ophthalmologic, dermatologic
            and growth outcome measures to build the first natural history dataset for this disorder.
        - experiment_id: exp_msmo1_presymptomatic_cascade_treatment
          name: Presymptomatic treatment of cascade-identified siblings
          description: Systematically offer cascade testing at proband diagnosis and start cholesterol
            plus statin therapy in presymptomatic biallelic siblings, with prospective developmental and
            cutaneous follow-up.
      selected_evidence:
        snippet: 'MSMO1 deficiency (OMIM #616834) is an ultrarare autosomal recessive disorder of distal
          cholesterol metabolism with only five cases reported to date.'
        supports: SUPPORT
