        name: Plasma sterol profiling by gas chromatography-mass spectrometry
        presence: PRESENT
        description: Quantitative plasma sterol analysis by GC-MS is the definitive biochemical test,
          showing marked elevation of C4-monomethyl and C4-dimethyl sterols. Cultured fibroblasts and
          skin scales are alternative sample types, with dimethylsterol accumulating preferentially in
          skin. Because most MSMO1 missense alleles are initially reported as variants of uncertain significance,
          the sterol profile also functions as the practical functional assay for variant classification.
      selected_evidence:
        snippet: Analysis of the blood sterol profile showed accumulation of C4-monomethyl and C4-dimethyl
          sterols suggesting a deficiency of the SC4MOL enzyme.
        supports: SUPPORT
