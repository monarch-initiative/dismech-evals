            term:
              id: MONDO:0014793
              label: microcephaly-congenital cataract-psoriasiform dermatitis syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: CK syndrome
        description: The second, brain-predominant NSDHL disorder. Like CHILD syndrome it is caused by
          variants in NSDHL, the partner of MSMO1 in the same C4-demethylation complex, and like MSMO1
          deficiency it accumulates methyl sterols and presents with intellectual disability - so both
          the mechanism sentences and the sterol-profile sentences of this literature are easy to misattribute
          to MSMO1. It is separated from MSMO1 deficiency by X-linked recessive inheritance in males,
          by cortical brain malformation with an asthenic build rather than psoriasiform dermatitis with
          congenital cataract, and by the deficient enzyme being NSDHL (the C4 decarboxylase step) rather
          than MSMO1 (the C4 methyl oxidase step).
        distinguishing_features:
        - Deficient enzyme is NSDHL, not the MSMO1 sterol-C4-methyl oxidase
        - Accumulating sterols are methyl sterols shared with CHILD syndrome, whereas MSMO1 deficiency
          accumulates both 4-monomethyl and 4,4-dimethylsterols upstream of the NSDHL step
        - X-linked recessive, affecting males, rather than autosomal recessive
        - Cortical brain malformation, dysmorphism and asthenic build dominate; the psoriasiform/ichthyosiform
          skin phenotype of MSMO1 deficiency is not its presenting feature
        - Separated from its allelic disorder CHILD syndrome by the absence of lateralised ichthyosiform
          skin and ipsilateral limb defects
        disease_term:
          preferred_term: CK syndrome
          term:
            id: MONDO:0010441
            label: CK syndrome
      selected_evidence:
        snippet: CK syndrome (CKS) is an X-linked recessive intellectual disability syndrome characterized
          by dysmorphism, cortical brain malformations, and an asthenic build.
        supports: SUPPORT
