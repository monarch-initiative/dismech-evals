            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: msto1_fusion_first
        hypothesis_label: Fusion failure is the primary lesion and mtDNA depletion is downstream of it
        status: CANONICAL
        description: 'The standard model, held since the first recessive families were described in 2017
          and restated by every clinical group that has reported the disorder since. Loss of cytosolic
          MSTO1 impairs mitochondrial fusion; the fragmented, poorly distributed network then fails to
          distribute the mtDNA replication machinery and to segregate nucleoids, and mtDNA content falls.
          The strongest direct argument for the ordering comes from rescue kinetics in patient fibroblasts:
          re-expressing wild-type MSTO1 fully restores mitochondrial and lysosomal morphology by 48 hours
          but only partially restores mtDNA, which is what one expects if the genome defect is the later,
          downstream event. The model is also supported by analogy, since the same fusion-to-depletion
          relationship is established for MFN2 and OPA1. Its weakness is that the connecting steps have
          never been demonstrated in MSTO1 cells, and that a cytosolic protein with no demonstrated enzymatic
          activity is an odd fusion factor.'
      selected_evidence:
        snippet: MSTO1 likely has a physiologically relevant role in mitochondrial morphogenesis by supporting
          mitochondrial fusion.
        supports: SUPPORT
