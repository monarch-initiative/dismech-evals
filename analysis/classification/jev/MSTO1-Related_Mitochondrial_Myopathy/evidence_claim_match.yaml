  f2d6b4d78d92dc2be4e4d3f03cba9a51f4b714be889f4f81ba923b8b7685828f:
    claim:
      about:
        disease:
          name: MSTO1-Related Mitochondrial Myopathy
          disease_term:
            preferred_term: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: mtDNA Depletion and Nucleoid Reorganisation
        biological_scale: MOLECULAR
        description: 'The finding that reclassified this disorder. Mitochondrial DNA content is reduced
          in patient cells to roughly a third to two thirds of control, and the surviving genomes are
          redistributed: nucleoids become fewer and larger, and some mitochondrial fragments contain no
          genome at all. The depletion is reproducible across independent laboratories, appears in muscle
          as well as in fibroblasts, and is quantitatively in the same range as that seen in fibroblasts
          from patients with OPA1 or MFN2 disease and in the established mtDNA depletion syndromes, which
          is the basis for the proposal that MSTO1 deficiency be classified as an mtDNA depletion syndrome.'
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: skeletal muscle fibre
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        cellular_components:
        - preferred_term: mitochondrial nucleoid
          modifier: ABNORMAL
          term:
            id: GO:0042645
            label: mitochondrial nucleoid
        biological_processes:
        - preferred_term: mitochondrial DNA metabolic process
          modifier: DECREASED
          term:
            id: GO:0032042
            label: mitochondrial DNA metabolic process
        notes: 'Consistency assessment, which was the specific question this curation was asked to settle.
          mtDNA depletion is CONSISTENT wherever it has been measured, but it has been measured in a small
          number of laboratories and almost entirely in cultured fibroblasts. Positive: 7 of 7 fibroblast
          lines in PMID:31463572 (30-70% depletion); muscle from patient A1 at 27% of control and fibroblasts
          from A1 and A2 at 39% and 68% in PMID:28544275; the homozygous proband of PMID:33612823; the
          adult-onset patient of PMID:42051546. No published report of a normal mtDNA content in an MSTO1
          patient was found. Two important limits on that consistency: the largest cohort could not obtain
          muscle tissue for mtDNA studies at all ("Unfortunately, muscle tissue was not available for
          further mtDNA content studies"), so the muscle evidence rests on a single patient in a different
          series; and depletion in a dividing fibroblast may not predict depletion in postmitotic muscle
          or cerebellum, the tissues that are actually diseased. The claim curated here is therefore "consistently
          found in patient fibroblasts, with single-patient support in muscle", not "consistently found
          in patient tissue".'
      selected_evidence:
        snippet: all fibroblasts were found to have depletion of mtDNA ranging from 30 to 70% along with
          alterations to mtDNA nucleoids
        supports: SUPPORT
