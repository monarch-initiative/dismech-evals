              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Biochemical
      assertion:
        name: Reduced citrate synthase activity in muscle
        presence: Decreased
        notes: 'Citrate synthase activity, the conventional index of mitochondrial mass, was markedly
          reduced in patient muscle in the 2017 recessive series even though respiratory chain complex
          activities normalised to citrate synthase were unremarkable. Read together with the reduced
          mtDNA content, this supports a model of fewer mitochondria rather than defective ones, and it
          is the biochemical counterpart of the dissociation node in the pathograph.

          Reported in a single family (patients A1 and A2 of PMID:28544275). It has not been measured
          systematically in later cohorts, so its sensitivity as a biomarker is unknown and it should
          not be used as a diagnostic test.'
      selected_evidence:
        snippet: However, we detected markedly low activity of citrate synthase and reduced mtDNA amount,
          suggesting a reduction in mitochondrial mass.
        supports: SUPPORT
