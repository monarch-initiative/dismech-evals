  94e95b8c0670e1a5c8a24b8eea1ffa688ecd706e7b68c4445b8071715b1c8ca9:
    claim:
      about:
        disease:
          name: MSTO1-Related Mitochondrial Myopathy
          disease_term:
            preferred_term: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of TRiC Chaperonin Assembly
        biological_scale: MOLECULAR
        description: 'An alternative account of what MSTO1 actually does, published as a preprint in July
          2026 and not yet peer reviewed. Using auxin-inducible degradation to strip MSTO1 from cells
          within hours, the authors found that TRiC (the chaperonin-containing T-complex, CCT), the essential
          cytosolic ATP-dependent chaperonin that folds actin, tubulin and a large set of other substrates,
          falls within two days, whereas mitochondrial fragmentation does not appear until day six. Early
          TRiC assembly subcomplexes accumulate when MSTO1 is absent, MSTO1 co-immunoprecipitates with
          TRiC, and TRiC is also reduced in MSTO1 patient fibroblasts. Critically, knocking down TRiC
          on its own is sufficient to fragment mitochondria, and does so without measurable changes in
          tubulin or actin. If this holds, the ordering of the whole pathograph changes: the mitochondrial
          phenotype becomes a downstream consequence of a cytosolic proteostasis defect rather than the
          primary lesion, and MSTO1 becomes a chaperonin assembly factor that happens to have been discovered
          through a mitochondrial phenotype.'
        genes:
        - preferred_term: MSTO1
          term:
            id: hgnc:29678
            label: MSTO1
        protein_complexes:
        - preferred_term: TRiC/CCT chaperonin
          modifier: DECREASED
          term:
            id: GO:0005832
            label: chaperonin-containing T-complex
        cellular_components:
        - preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
        notes: Evidence status matters here and is stated rather than implied. PMID:42539026 is a bioRxiv
          preprint (posted 2026-07-23) and has not been peer reviewed; it is the sole source for this
          node. It is included because it is the only work that proposes a concrete molecular activity
          for MSTO1 and because its temporal-ordering experiment is a direct test of the canonical model,
          but no clinical or diagnostic claim in this entry depends on it, and the node is grouped under
          an EMERGING hypothesis rather than placed on the canonical causal path.
      selected_evidence:
        snippet: Surprisingly, prior to any changes in mitochondria, we show that MSTO1-depleted cells
          have a significant decrease in TRiC levels, an essential cytosolic ATP-dependent chaperone required
          to fold diverse substrates, including actin and tubulin.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42539026
      reference_title: MSTO1 functions as a TRiC assembly factor linking cytosolic proteostasis to mitochondrial
        function.
      evidence_source: IN_VITRO
      explanation: The temporal-ordering result on which the whole alternative model rests, and the reason
        it is a challenge to the fusion-first account.
