        name: Muscular dystrophy
        category: Musculoskeletal
        diagnostic: true
        description: Muscle histology in this disorder is dystrophic rather than merely myopathic, which
          is diagnostically important because it sends the workup towards the congenital muscular dystrophy
          panel rather than towards a mitochondrial panel. Biopsies show variation in fibre size, internalised
          nuclei, whorled fibres and mild necrosis with regeneration. Importantly the conventional oxidative
          histochemical markers of mitochondrial myopathy were absent where they were sought, so a normal
          COX and SDH stain does not exclude the diagnosis.
        phenotype_term:
          preferred_term: Muscular dystrophy
          term:
            id: HP:0003560
            label: Muscular dystrophy
        notes: No frequency band is asserted. Muscle biopsy was performed in 10 of 15 patients in PMID:31463572
          and all were dystrophic, but a 10/15 denominator reflects who was biopsied rather than who has
          the pathology, and biopsy in the era of first-line genome sequencing is increasingly selective.
      selected_evidence:
        snippet: Muscle biopsies were performed in ten patients and were consistent with a dystrophic
          process
        supports: SUPPORT
