              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: NOT_YET_DOCUMENTED
        notes: No prevalence or incidence estimate of any kind has been published for this disorder, and
          no Orphanet epidemiology record was reachable from this checkout, so the class is NOT_YET_DOCUMENTED
          rather than a numeric or qualitative band and `rate_per_100000` is deliberately left empty.
          What is available is a case count. A 2025 ophthalmological review counted 33 confirmed cases
          across 11 published articles; a 2026 report states 31 cases reported globally; a 2022 case report
          put the figure at 31 patients. A 2026 Mayo Clinic series adds four more patients from three
          families. The discrepancy between the counts is not resolved in any of the abstracts and is
          left visible here. Most reports state no ancestry for their patients at all, so no geographic
          distribution should be read off the author affiliations. Where ancestry is stated it is heterogeneous
          - the ethnicity row of the largest cohort lists Caucasian, African, Chinese, Caucasian/Hispanic
          and Native American across its fifteen patients, one patient of the 2017 recessive series is
          recorded as of British Caucasian descent, and separate reports describe Chinese families and
          one Ashkenazi Jewish sibship - which is consistent with ascertainment through neuromuscular
          and exome-sequencing referral networks rather than with any population restriction. No founder
          allele has been established.
      selected_evidence:
        snippet: A literature review was conducted, analysing the data from 11 published articles encompassing
          33 confirmed cases of MMYAT up to 2025.
        supports: SUPPORT
