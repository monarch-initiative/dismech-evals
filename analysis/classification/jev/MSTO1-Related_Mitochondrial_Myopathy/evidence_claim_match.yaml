  048354627d3c834d8d2ca5803fcc166aba1ec9fade52fdd6f1676a96f4f32be9:
    claim:
      about:
        disease:
          name: MSTO1-Related Mitochondrial Myopathy
          disease_term:
            preferred_term: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Mitochondrial Fusion and Network Fragmentation
        biological_scale: CELLULAR
        description: 'Mitochondria are maintained as a dynamic, partly continuous reticulum by balanced
          fusion and fission. Fusion allows content mixing - complementation of damaged mtDNA and proteins
          between organelles - and its failure leaves a population of small, isolated, functionally isolated
          fragments. Every patient fibroblast line examined across four independent groups shows a fragmented
          mitochondrial network, and in one series the fragments coexist with abnormally enlarged structures.
          The effect is MSTO1-dependent in both directions: acute knockdown of MSTO1 in HeLa cells reproduces
          the fragmentation, over-expression of the protein drives the opposite phenotype of perinuclear
          mitochondrial aggregation, and re-expression of wild-type MSTO1 in patient cells restores the
          network. Loss of network continuity also degrades organelle distribution - the property for
          which the gene is named - which is expected to matter most in the long, highly polarised cells
          of muscle and the cerebellum.'
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: mitochondrial fusion
          modifier: DECREASED
          term:
            id: GO:0008053
            label: mitochondrial fusion
        - preferred_term: mitochondrion distribution within the cell
          modifier: ABNORMAL
          term:
            id: GO:0048312
            label: intracellular distribution of mitochondria
        cellular_components:
        - preferred_term: mitochondrion
          modifier: ABNORMAL
          term:
            id: GO:0005739
            label: mitochondrion
      selected_evidence:
        snippet: Consistent with impaired mitochondrial fusion, mitochondrial networks in fibroblasts
          were found to be fragmented.
        supports: SUPPORT
    origin:
