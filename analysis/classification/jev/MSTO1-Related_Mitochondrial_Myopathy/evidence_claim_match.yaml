  4b7dd751c2f1243f33adca52a77b5a0425d19ae6d69ddfa6b00a5b86a50a78c4:
    claim:
      about:
        disease:
          name: MSTO1-Related Mitochondrial Myopathy
          disease_term:
            preferred_term: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dissociation Between mtDNA Depletion and Respiratory Chain Function
        biological_scale: CELLULAR
        description: 'A patient with MSTO1 disease usually does not look biochemically like a classical
          mitochondrial patient. Lactate is normal, respiratory chain complex activities in muscle homogenate
          are normal or near normal, and fibroblast respiration measured by micro-oxygraphy is normal,
          even though mtDNA is reduced and the network is fragmented. What is abnormal is citrate synthase
          activity, which is markedly low and indexes mitochondrial mass rather than mitochondrial function,
          so the coherent reading is that these cells have fewer, poorly distributed mitochondria carrying
          less mtDNA rather than mitochondria that respire badly. This matters diagnostically: a normal
          mitochondrial biochemical screen does not exclude the diagnosis, and it is a large part of why
          the disorder was reached by exome sequencing rather than by metabolic workup. The dissociation
          is not absolute - the 2026 adult-onset case did show reduced membrane potential and respiratory
          capacity - and that exception is carried here rather than hidden.'
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: skeletal muscle fibre
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: However, we detected markedly low activity of citrate synthase and reduced mtDNA amount,
          suggesting a reduction in mitochondrial mass.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
