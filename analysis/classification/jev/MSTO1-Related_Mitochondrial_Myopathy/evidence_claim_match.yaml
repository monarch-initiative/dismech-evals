            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: msto1-retinopathy-denominator
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What fraction of patients with bi-allelic MSTO1 variants actually have a pigmentary retinopathy,
          given that the feature names the disease term but was absent from the largest published cohort?
        rationale: 'The MONDO and Orphanet labels for this disorder include pigmentary retinopathy, and
          the feature is unambiguously real: both probands of the report that named it, the index patient
          of the first recessive series and two Chinese sisters followed for seventeen years all have
          it, and the 2025 ophthalmological study calls retinal dystrophy a key characteristic. Yet none
          of the fifteen patients in the largest cohort had it recorded. The authors of that cohort state
          that formal ophthalmological examination was not pursued in all patients, so the conflict may
          be entirely one of ascertainment - a rod-predominant dystrophy with concentric field loss and
          preserved acuity is asymptomatic for years and will not be found unless it is looked for. The
          alternative is a genuine genotype- or ancestry-dependent difference in retinal involvement.
          The distinction matters for practice, because if the retinopathy is common but silent then every
          patient needs baseline retinal imaging, whereas if it is genuinely rare then targeted examination
          suffices. It also matters for nosology: a disease named after a feature that most patients lack
          is a naming problem that MONDO may eventually need to address.'
        attaches_to:
        - phenotypes#Pigmentary retinopathy
        - pathophysiology#Retinal Degeneration with Pigmentary Change
        proposed_experiments:
        - experiment_id: msto1-protocolised-retinal-imaging
          name: Protocolised retinal imaging in every ascertained MSTO1 patient
          description: Apply a common protocol - wide-field fundus autofluorescence, optical coherence
            tomography, visual fields and full-field electroretinography - to all newly ascertained and,
            where possible, previously reported patients, to convert an inconsistent set of case observations
            into a real numerator and denominator.
        - experiment_id: msto1-genotype-retina-correlation
          name: Genotype-retinal phenotype correlation across the published cohort
          description: Test whether retinal involvement tracks with allele class or residual protein level
            by collating genotype alongside protocolised retinal phenotyping, which would distinguish
            an ascertainment artefact from a genotype effect.
      selected_evidence:
        snippet: This finding was not reported in any of the patients in our cohort; however, formal ophthalmologic
          examination was not pursued in all patients.
        supports: SUPPORT
