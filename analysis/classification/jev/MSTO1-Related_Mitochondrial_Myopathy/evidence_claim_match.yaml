  56ea16efa4cfc8c9b0de4f19505f7eae7810a09b65e84231369ec78d7a05d649:
    claim:
      about:
        disease:
          name: MSTO1-Related Mitochondrial Myopathy
          disease_term:
            preferred_term: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: msto1-mechanism-ordering
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        prompt: Is impaired mitochondrial fusion the primary consequence of losing MSTO1, or is it downstream
          of a cytosolic proteostasis defect, or of a direct effect on mtDNA replication through RAD51?
        rationale: 'Three accounts of MSTO1''s molecular function are now on the table and they make different
          predictions. The canonical fusion-first model, in place since 2017, is supported by rescue kinetics
          in patient fibroblasts and by analogy with MFN2 and OPA1, but has never demonstrated the connecting
          steps in MSTO1 cells and leaves the protein without a defined molecular activity. The 2026 TRiC
          model gives it one - chaperonin assembly factor - and its temporal-ordering experiment directly
          contradicts the canonical ordering, with TRiC falling at day two and mitochondria fragmenting
          only at day six; but it is an unreviewed preprint from one laboratory, and the TRiC substrate
          that connects proteostasis to the organelle is unidentified since tubulin and actin were excluded.
          The 2026 RAD51 model would explain mtDNA depletion without a fusion intermediate, but it is
          entirely in cancer cell systems. The three are not mutually exclusive and the entry models all
          three as separate hypothesis groups rather than picking one. Which is correct determines what
          a therapeutic target would even be: the fusion machinery, the chaperonin system, or mtDNA replication.'
        attaches_to:
        - pathophysiology#Loss of Cytosolic MSTO1 Protein
        - pathophysiology#Failure of TRiC Chaperonin Assembly
        - pathophysiology#Unrestrained RAD51 Binding to Mitochondrial DNA
        proposed_experiments:
        - experiment_id: msto1-tric-replication-in-patient-cells
          name: Independent replication of the TRiC assembly result in patient fibroblasts
          description: Measure TRiC/CCT subunit levels and assembly intermediates in the established panel
            of MSTO1 patient fibroblast lines in a second laboratory, with peer review, before the proteostasis
            model is treated as more than a lead.
        - experiment_id: msto1-tric-substrate-screen
          name: Identify the TRiC substrate that links proteostasis to mitochondrial morphology
          description: Screen TRiC substrates for one whose depletion reproduces mitochondrial fragmentation,
            given that tubulin and actin were explicitly excluded, to supply the missing intermediate
            in the proteostasis model.
        - experiment_id: msto1-rad51-in-patient-fibroblasts
          name: Test the MSTO1-RAD51 interaction in patient rather than cancer cells
          description: Assay mitochondrial RAD51 occupancy on mtDNA in MSTO1 patient fibroblasts and ask
            whether inhibiting mitochondrial RAD51 rescues mtDNA content, which would establish whether
            the RAD51 route operates in the human disease.
      selected_evidence:
        snippet: further suggests that impairments in mitochondrial dynamics are upstream of mtDNA depletion
          in MSTO1 patient fibroblasts
        supports: SUPPORT
