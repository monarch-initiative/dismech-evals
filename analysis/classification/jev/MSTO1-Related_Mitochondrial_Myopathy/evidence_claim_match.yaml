  7036a23cf5448b53db493df3e578ff2c4b765431614822ff5c9d391ca18d2e51:
    claim:
      about:
        disease:
          name: MSTO1-Related Mitochondrial Myopathy
          disease_term:
            preferred_term: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: HarrisonsChapterAssignment
      assertion:
        classification_value: NEUROLOGIC
        notes: 'The morbidity of this disorder is almost entirely neuromuscular and neurological: a dystrophic
          myopathy with proximal weakness, congenital or early-childhood cerebellar atrophy with ataxia
          and dysarthria, and corticospinal tract signs. The skeletal deformities (scoliosis, pectus excavatum)
          and the restrictive respiratory physiology are secondary to the myopathy rather than independent
          organ disease, and the retinopathy is a lesion of the neurosensory retina. Cardiac, hepatic,
          renal and endocrine involvement have not been established (echocardiography was normal in all
          11 patients screened in the largest cohort), so a single NEUROLOGIC chapter assignment is correct.
          Endocrine and psychiatric features that appear in the OMIM/HPO annotation set for this disease
          derive from the family whose variant was later localised to the MSTO2P pseudogene and are deliberately
          not carried here; see the entry-level notes.'
      selected_evidence:
        snippet: Bi-allelic loss-of-function variants in MSTO1 manifest clinically with a remarkably consistent
          phenotype of childhood-onset muscular dystrophy, corticospinal tract dysfunction and early-onset
          non-progressive cerebellar atrophy.
        supports: SUPPORT
    origin:
      assertion_path: /classifications/harrisons_chapter/0
      evidence_path: /classifications/harrisons_chapter/0/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /classifications
