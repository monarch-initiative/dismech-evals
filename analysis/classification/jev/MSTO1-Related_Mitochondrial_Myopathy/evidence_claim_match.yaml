        biological_scale: ORGANISM
        description: 'The organism-level expression of the muscle disease. Presentation is with hypotonia
          and delayed motor milestones between birth and three years, followed by independent but waddling,
          wide-based ambulation and predominantly proximal weakness that then remains relatively stable.
          Loss of respiratory muscle strength shows up as a reduced forced vital capacity before it produces
          symptoms, which is the argument for scheduled pulmonary function testing rather than symptom-triggered
          testing. A later-onset arm of the spectrum exists: a 2026 series reported diagnosis between
          13 and 30 years, and a separate 2026 case had adult-onset disease.'
      selected_evidence:
        snippet: Patients typically presented with hypotonia and delayed motor milestones with first symptoms
          recognized between birth and three years of age.
        supports: SUPPORT
