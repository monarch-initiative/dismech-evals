            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bi-allelic Loss-of-Function Variants in MSTO1
        biological_scale: MOLECULAR
        description: 'The primary lesion is bi-allelic damage to MSTO1 at 1q22, reported against transcript
          NM_018116.3. The allelic spectrum is broad and includes missense substitutions across the length
          of the protein, frameshift and nonsense alleles, a start-loss allele, splice-acceptor variants
          and at least one multi-exon intragenic deletion, and there is no recurrent founder allele. The
          functional consequence converges regardless of allele class: in every patient fibroblast line
          assayed to date the MSTO1 protein is absent or strongly reduced, so the disease behaves as a
          loss of protein rather than as a set of allele-specific effects. Heterozygous parents are unaffected,
          so one intact allele suffices.'
        genes:
        - preferred_term: MSTO1
          term:
            id: hgnc:29678
            label: MSTO1
      selected_evidence:
        snippet: We present extensive phenotypic and genetic data from 12 independent families, including
          15 new patients harbouring a broad array of bi-allelic MSTO1 pathogenic variants
        supports: SUPPORT
