  13e6a9fcad8505459178c5209539194e704002613a87869632fbe7a928820c58:
    claim:
      about:
        disease:
          name: MSTO1-Related Mitochondrial Myopathy
          disease_term:
            preferred_term: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: MSTO1
        association: Bi-allelic loss-of-function variants; no recurrent founder allele; a single reported
          dominant family was subsequently shown to carry its variant in the MSTO2P pseudogene
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: MSTO1
          term:
            id: hgnc:29678
            label: MSTO1
        notes: 'Nomenclature and locus. HGNC:29678 is symbol MSTO1, "misato mitochondrial distribution
          and morphology regulator 1", at 1q22, Entrez 55154, Ensembl ENSG00000125459, UniProt Q9BUK6,
          with alias symbols FLJ10504, LST005, MST and misato (HGNC REST API, retrieved 2026-08-01). The
          reference transcript used consistently across the clinical literature is NM_018116.3.

          The MSTO2P pseudogene problem, which is a practical laboratory issue and not only a historical
          curiosity. MSTO2P (HGNC:26329, verified against the HGNC REST API on 2026-08-01, which returns
          symbol MSTO2P, name "misato family member 2, pseudogene", locus_type "pseudogene", locus 1q22)
          is not a processed pseudogene: PMID:31463572 places it in a roughly 240 kb tandem segmental
          duplication at 1q22 arising from a duplication event in the human lineage, with 99.5% exonic
          nucleotide identity to MSTO1. That identity means short-read alignments can place pseudogene
          reads on the parent gene and vice versa. This is exactly what happened to the family reported
          as the first dominant MSTO1 case: the c.22G>A (p.Val8Met) variant was later confirmed by the
          original authors to lie in MSTO2P. Any laboratory reporting a heterozygous MSTO1 variant, and
          particularly a variant near the 5'' end of the gene, should confirm that the read alignment
          is not pseudogene-derived before issuing a report.

          Allelic architecture. Reported alleles span the protein and include missense (for example p.Arg256Gln,
          p.Arg279His, p.Asp236His, p.Asp236Gly, p.Phe217Leu, p.Thr324Ile, p.Arg191Trp, p.Arg256Trp, p.Pro479Ser,
          p.Ala243Pro, p.Leu468Gln, p.Glu447Lys), frameshift (p.Gly420ValfsTer2), nonsense (p.Gln27*),
          splice-acceptor (c.1099-1G>A) and start-loss (c.1A>G, p.M1?) changes, together with at least
          one multi-exon intragenic deletion covering exons 7 to 14. Variant names in this note are transcribed
          from the abstracts of the cached references and are recorded here rather than as evidence snippets
          because each comes from a different paper. Because a copy-number allele can be one of the two
          hits, an exome that finds a single heterozygous MSTO1 variant in a compatible phenotype should
          be followed by deletion/duplication analysis rather than closed.

          Not asserted, deliberately. gnomAD constraint metrics (pLI, o/e LoF, missense Z) are not recorded
          anywhere in this entry because no cached source consulted here reports them and they must not
          be written from memory. No ClinGen gene-disease validity classification could be retrieved (see
          the entry-level notes), so the gene-disease relationship is typed CAUSATIVE on the strength
          of the published families - at least 20 independent families across the cited reports, with
          segregation, patient-cell functional data and rescue - rather than on a curated external assertion.
          No modifier locus, methylation episignature, founder allele or somatic mechanism has been established.'
      selected_evidence:
        snippet: deletion encompassing exons 7-14 of MSTO1
        supports: SUPPORT
    origin:
