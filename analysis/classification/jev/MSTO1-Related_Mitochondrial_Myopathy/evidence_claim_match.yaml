  f79d97965cfdf753b8076959f5f545ce103b41a16b2b2454663e108086ab720e:
    claim:
      about:
        disease:
          name: MSTO1-Related Mitochondrial Myopathy
          disease_term:
            preferred_term: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: msto1-mtdna-depletion-tissue-gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is mtDNA depletion present in the tissues that are actually diseased - skeletal muscle
          and cerebellum - or only in the cultured fibroblasts where it has almost always been measured?
        rationale: mtDNA depletion is the observation that reclassified this disorder as an mtDNA depletion
          syndrome, and it is consistent wherever it has been looked for. But the evidence base is narrower
          than the claim. Seven of seven fibroblast lines in the largest cohort showed 30-70% depletion,
          and the same paper states that muscle tissue was not available for further mtDNA content studies;
          the only muscle measurement in the literature is 27% of control in a single patient in a different
          series. No cerebellar tissue from an MSTO1 patient has ever been examined. Fibroblasts divide
          and muscle fibres and Purkinje cells do not, and mtDNA copy number regulation differs substantially
          between proliferating and postmitotic cells, so the extrapolation is not safe. Until depletion
          is measured in muscle in a series rather than in one patient, the causal edge from mtDNA depletion
          to muscle and cerebellar pathology in this entry rests on an inference.
        attaches_to:
        - pathophysiology#mtDNA Depletion and Nucleoid Reorganisation
        - pathophysiology#Dystrophic Degeneration of Skeletal Muscle Fibres
        proposed_experiments:
        - experiment_id: msto1-muscle-mtdna-series
          name: Quantitative mtDNA content in MSTO1 patient muscle across a series
          description: Measure mtDNA relative to nuclear DNA in stored muscle biopsy material from as
            many reported patients as can be recovered, with single-fibre analysis where possible, to
            establish whether the fibroblast depletion is reproduced in the diseased tissue and whether
            it is uniform or mosaic across fibres.
        - experiment_id: msto1-ipsc-neurons-and-myotubes
          name: Patient iPSC-derived myotubes and cerebellar organoids
          description: Differentiate patient iPSC into myotubes and cerebellar organoids and measure mtDNA
            content, nucleoid distribution and network morphology in postmitotic, disease-relevant cell
            types rather than in dividing fibroblasts.
      selected_evidence:
        snippet: all fibroblasts were found to have depletion of mtDNA ranging from 30 to 70% along with
          alterations to mtDNA nucleoids
        supports: SUPPORT
    origin:
