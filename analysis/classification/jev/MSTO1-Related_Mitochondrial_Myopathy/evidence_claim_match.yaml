  97413c4c336f14c0a4fd1b3335fee51e05e710f410afb952da48162dad930e3e:
    claim:
      about:
        disease:
          name: MSTO1-Related Mitochondrial Myopathy
          disease_term:
            preferred_term: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: msto1-dominant-claim-retracted
        kind: CONTROVERSY
        status: RESOLVED
        prompt: Is autosomal dominant inheritance a real mode for MSTO1 disease, given that it was reported
          in 2017, repeated in reviews through 2019, and still appears in the HPO annotation set for OMIM:617675?
        rationale: 'This entry answers no, and the reasoning should be auditable rather than implicit.
          The claim originated with a single Hungarian family in which a heterozygous c.22G>A (p.Val8Met)
          change segregated with a multisystem phenotype dominated by psychiatric and endocrine features;
          the report was titled as revealing the first dominant MSTO1 mutation, and the authors also proposed
          a possible dominant-negative mechanism. In 2023 Gerber et al challenged the variant assignment,
          and in their published reply the original authors confirmed that the mutation lies in the MSTO2P
          pseudogene rather than in MSTO1; EMBO Molecular Medicine issued an erratum to the 2017 paper.
          Independently, the largest cohort had already observed that heterozygous parents carrying MSTO1
          loss-of-function alleles are unaffected, which removes haploinsufficiency as a plausible dominant
          route. Every other reported family is bi-allelic. The residual open question, and the reason
          the discussion is retained rather than deleted, is what the MSTO2P variant was doing in that
          family: the original authors maintain that their patients genuinely had reduced MSTO1 mRNA and
          protein, and whether the pseudogene variant contributed to that reduction is explicitly unresolved.'
        attaches_to:
        - genetic#MSTO1
        - pathophysiology#Bi-allelic Loss-of-Function Variants in MSTO1
        resolution_note: 'Resolved for the purpose of this entry: only autosomal recessive inheritance
          is asserted, and the phenotypes unique to the MSTO2P family are excluded. The subsidiary question
          of whether an MSTO2P variant can lower MSTO1 expression remains open and is recorded in the
          rationale.'
        proposed_experiments:
        - experiment_id: msto1-msto2p-expression-test
          name: Test whether MSTO2P variants modulate MSTO1 expression
          description: Introduce the MSTO2P c.22G>A-equivalent change into cells on an otherwise isogenic
            background and measure MSTO1 mRNA and protein, to determine whether a pseudogene variant can
            account for the reduced MSTO1 levels reported in the original family or whether that observation
            had another cause.
        - experiment_id: msto1-pseudogene-alignment-audit
          name: Audit of MSTO1 variant calls for pseudogene mis-mapping
          description: Re-examine reported heterozygous MSTO1 variants in clinical databases with alignment
            methods that discriminate MSTO1 from MSTO2P, to establish how often the misassignment recurs
            in routine diagnostics.
      selected_evidence:
        snippet: Gerber et al report 2 autosomal recessive pathogenic Misato homolog 1 (MSTO1) variants
          causing hereditary optic atrophy and raise concerns about a previously identified dominant variant
          of MSTO1 by Gal et al (2017).
        supports: SUPPORT
