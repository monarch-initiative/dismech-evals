          data. Present in both probands of PMID:29339779, in patient A1 of PMID:28544275 and in both
          sisters of PMID:40542878; absent in 0 of 15 of PMID:31463572, where the authors note that formal
          ophthalmological examination was not performed in every patient. Pooling those numerators across
          cohorts that used different ophthalmological protocols would manufacture a precision the literature
          does not support. See the `msto1-retinopathy-denominator` discussion.
      selected_evidence:
        snippet: Our study provides a comprehensive ophthalmic characterization of MMYAT, indicating that
          retinal dystrophy is a key characteristic of this disease.
