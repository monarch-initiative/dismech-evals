      assertion:
        hypothesis_group_id: msto1_rad51_mtdna
        hypothesis_label: MSTO1 restrains RAD51 at the mitochondrial genome and its loss depletes mtDNA
          directly
        status: EMERGING
        description: Proposed in 2026 from cancer cell models. MSTO1 binds RAD51 through a conserved FxxA
          motif and restrains its mitochondrial, but not its nuclear, activity; losing MSTO1 increases
          RAD51 occupancy on mtDNA, disrupts mtDNA replication and depletes the genome. This would make
          the mtDNA phenotype a direct consequence of MSTO1 loss rather than a sequela of fragmentation,
          and it is not mutually exclusive with the fusion model - both could contribute. The principal
          limitation is that the work is entirely in cancer and cultured cell systems, with no patient
          material, and that the accompanying cGAS-STING inflammatory arm has never been sought in a patient.
      selected_evidence:
        snippet: Loss of MSTO1 impairs mitochondrial membrane potential, reduces mtDNA content, and increases
          susceptibility to oxidative stress.
        supports: SUPPORT
