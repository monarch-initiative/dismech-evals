        hypothesis_group_id: msto1_tric_proteostasis
        hypothesis_label: MSTO1 is a TRiC/CCT chaperonin assembly factor and the mitochondrial phenotype
          is secondary to a cytosolic proteostasis defect
        status: EMERGING
        description: Proposed in a 2026 preprint that has not been peer reviewed. Rapid, auxin-induced
          degradation of MSTO1 lowers TRiC within two days while mitochondrial fragmentation does not
          appear until day six; early TRiC assembly subcomplexes accumulate in the absence of MSTO1; MSTO1
          co-immunoprecipitates with TRiC; TRiC is reduced in patient fibroblasts; and depleting TRiC
          alone is sufficient to fragment mitochondria. If confirmed, this reverses the direction of the
          canonical model and would make MSTO1-related disease a cytosolic chaperonopathy with a mitochondrial
          readout. It would also predict phenotypic overlap with CCT-subunit disorders that has not yet
          been looked for clinically. It is recorded as EMERGING rather than ALTERNATIVE because it currently
          rests on one unreviewed preprint from one laboratory.
      selected_evidence:
        snippet: MSTO1 patient-derived fibroblasts have fragmented mitochondria and a striking loss of
          mtDNA.
        supports: SUPPORT
