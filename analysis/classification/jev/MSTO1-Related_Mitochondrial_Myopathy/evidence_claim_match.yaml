            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Cytosolic MSTO1 Protein
        biological_scale: MOLECULAR
        description: MSTO1 is a soluble cytosolic protein, not a mitochondrial matrix or inner-membrane
          resident, and this is the feature that makes the disorder mechanistically unusual among mitochondrial
          diseases. Its localisation was initially reported as the mitochondrial outer membrane, but two
          later groups working independently on patient material and on transfected cells placed it predominantly
          in the cytosol, interacting with the outer-membrane fusion machinery from the cytosolic face
          rather than residing in the organelle. The protein carries a region homologous to the tubulin/FtsZ
          GTPase superfamily, the same fold family used for chromosome segregation in eukaryotes and for
          organelle division in bacteria and algae, but no GTPase activity has been demonstrated for the
          human protein and its molecular activity remained undefined until 2026. In patient fibroblasts
          the protein is undetectable by western blot in every line examined in the largest series, and
          strongly reduced in the others, so this node is the convergence point of the whole allelic spectrum.
        genes:
        - preferred_term: MSTO1
          term:
            id: hgnc:29678
            label: MSTO1
        cellular_components:
        - preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
        - preferred_term: mitochondrial outer membrane
          modifier: ABNORMAL
          term:
            id: GO:0005741
            label: mitochondrial outer membrane
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        notes: Localisation is a genuine, unresolved disagreement in the primary literature and is presented
          as such rather than harmonised. Kimura and Okano (PMID:17349998) fractionated mitochondria and
          assigned Misato to the outer membrane. Gal et al (PMID:28554942) explicitly contradicted that
          result, and Nasca et al (PMID:28544275) independently found the protein to be mainly cytosolic.
          The weight of evidence favours a cytosolic protein that acts at the outer-membrane interface,
          which is how this entry models it, but the two outer-membrane and cytosolic evidence items below
          are both retained so the disagreement stays visible.
      selected_evidence:
        snippet: MSTO1 protein was not detectable in the cultured fibroblasts of all seven patients evaluated,
          suggesting that pathogenic variants result in a loss of protein expression and/or affect protein
          stability.
        supports: SUPPORT
