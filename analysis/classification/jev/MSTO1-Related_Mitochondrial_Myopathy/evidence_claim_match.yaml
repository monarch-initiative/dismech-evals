  3a54d398181248bca312f09f5dc2ca39ac6879b3c7d7d1bb96f034b65f97e990:
    claim:
      about:
        disease:
          name: MSTO1-Related Mitochondrial Myopathy
          disease_term:
            preferred_term: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cerebellar Hypoplasia and Cortical Atrophy
        biological_scale: TISSUE
        description: 'The cerebellar lesion is the second constant of the disorder and is developmental
          at least in part. Brain MRI showed moderate to severe cerebellar atrophy or hypoplasia involving
          the vermis and both hemispheres in all twelve patients imaged in the largest cohort, four of
          whom were imaged before the age of two, and repeat imaging in four patients confirmed no progression.
          That pattern - present early, stable thereafter - is unusual among mitochondrial cerebellar
          syndromes and argues for a defect in cerebellar development rather than for ongoing neurodegeneration.
          It is not universal: an additional case with clinical and radiological evidence of progressive
          cerebellar involvement has been reported, and a 2026 patient presented with adult-onset progressive
          ataxia, so this entry records both courses. Purkinje cells are the obvious candidate substrate
          given their energetic demands and their sensitivity in other mitochondrial disorders, but no
          neuropathological material from an MSTO1 patient has been published.'
        locations:
        - preferred_term: cerebellum
          term:
            id: UBERON:0002037
            label: cerebellum
        - preferred_term: cerebellar vermis
          term:
            id: UBERON:0004720
            label: cerebellar vermis
        notes: The Purkinje cell is deliberately NOT bound as a cell type on this node. No autopsy, biopsy
          or imaging-based cell-type-resolved evidence exists for Purkinje cell loss in MSTO1 disease;
          asserting it would import a mechanism from other cerebellar ataxias rather than record one demonstrated
          here.
      selected_evidence:
        snippet: involving the vermis and both hemispheres in all 12
        supports: SUPPORT
    origin:
