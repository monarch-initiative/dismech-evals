  9a09767d5e2a992b307eb2dd3902298704de8c4a88a3beb382540d6e9644e7ed:
    claim:
      about:
        disease:
          name: MSTO1-Related Mitochondrial Myopathy
          disease_term:
            preferred_term: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
            term:
              id: MONDO:0044714
              label: mitochondrial myopathy-cerebellar ataxia-pigmentary retinopathy syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: 'Disease requires two damaging MSTO1 alleles, in the great majority of reported families
          as compound heterozygous missense, truncating or splice-site variants, and in at least one Ashkenazi
          Jewish family as a homozygous missense variant. Heterozygous parents are unaffected, and the
          largest cohort makes that point explicitly as an argument about mechanism: haploinsufficiency
          for MSTO1 does not produce disease. Penetrance in bi-allelic individuals appears complete on
          present evidence and is recorded as such, with the caveat that the total published experience
          is around 30 patients and no unaffected bi-allelic individual has been sought systematically
          in population databases.

          The historically competing dominant mode is deliberately not asserted. It rested on a single
          family whose variant was later shown to lie in the MSTO2P pseudogene; see the entry-level notes
          and the `msto1-dominant-claim-retracted` discussion. Reviews published between 2018 and 2019
          that describe "both autosomal dominant and recessive modes" predate that correction, and the
          2018 statement is quoted below as evidence of the state of the field at the time rather than
          as a current claim.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        penetrance: COMPLETE
      selected_evidence:
        snippet: 'We report here the first families carrying recessive variants in the MSTO1 gene: compound
          heterozygous mutations were identified in two sisters and in an unrelated singleton case, who
          presented a multisystem complex phenotype mainly characterized by myopathy and cerebellar ataxia.'
        supports: SUPPORT
