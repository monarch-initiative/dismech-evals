      assertion:
        name: Unrestrained RAD51 Binding to Mitochondrial DNA
        biological_scale: MOLECULAR
        description: A second 2026 account, this one placing MSTO1 directly at the mitochondrial genome.
          In cancer cell models MSTO1 interacts with the recombinase RAD51 through a conserved FxxA motif
          and restrains its activity specifically within mitochondria, without affecting RAD51's nuclear
          functions. When MSTO1 is lost, RAD51 binding to mtDNA increases, mtDNA replication is disrupted
          and mtDNA damage accumulates, membrane potential falls and mtDNA content drops. The same work
          reports that mtDNA then leaks to the cytosol through a BAX/BAK-dependent route and activates
          cGAS-STING signalling, which would give MSTO1 deficiency an innate-immune arm. This route would
          explain mtDNA depletion without requiring the fusion defect as an intermediate, and it is therefore
          modelled as a competing hypothesis rather than as an addition to the canonical chain.
        genes:
        - preferred_term: MSTO1
          term:
            id: hgnc:29678
            label: MSTO1
        cellular_components:
        - preferred_term: mitochondrial nucleoid
          modifier: ABNORMAL
          term:
            id: GO:0042645
            label: mitochondrial nucleoid
        biological_processes:
        - preferred_term: mitochondrial DNA replication
          modifier: DECREASED
          term:
            id: GO:0006264
            label: mitochondrial DNA replication
        notes: 'Scope caveat. PMID:42098462 is a cancer-biology paper: the mechanistic work is in tumour
          and cultured cell models and the clinical bioinformatics arm uses TCGA. It contains no patient
          with an MSTO1-related myopathy. It is curated here because it is direct experimental evidence
          about the molecular activity of the disease protein at the mitochondrial genome, but the cGAS-STING
          inflammatory arm in particular has never been looked for in a patient with this disorder and
          is not asserted as part of the human disease.'
      selected_evidence:
        snippet: This study identifies MSTO1 as a crucial regulator of mitochondrial genome integrity
          through direct interaction with RAD51.
        supports: SUPPORT
