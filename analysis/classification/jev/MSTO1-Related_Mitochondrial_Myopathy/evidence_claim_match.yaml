      assertion_type: Biochemical
      assertion:
        name: Normal blood lactate and normal respiratory chain enzyme activities
        presence: Normal
        notes: 'The standard mitochondrial biochemical screen is normal in most patients. Lactate is not
          elevated, respiratory chain complex activities in muscle homogenate are normal or near normal,
          and fibroblast respiration is normal. This is the opposite of what a clinician expects in a
          disease that has been proposed to belong among the mtDNA depletion syndromes, and it is the
          main reason these patients were historically not identified through metabolic pathways. The
          2026 adult-onset case is the exception, with reduced membrane potential and respiratory capacity.

          Curated as a normal-result biomarker because the negative result carries diagnostic information
          - it must not be used to exclude the diagnosis. No LOINC-coded reference range is attached because
          the sources report qualitative normality rather than an interval.'
      selected_evidence:
        snippet: As for other mutations affecting genes involved in mitochondrial dynamics, no biochemical
          defects typical of mitochondrial disorders were reported.
        supports: SUPPORT
