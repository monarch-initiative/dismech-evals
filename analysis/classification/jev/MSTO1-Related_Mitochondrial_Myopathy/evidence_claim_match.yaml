      assertion:
        name: Marinesco-Sjogren syndrome
        disease_term:
          preferred_term: Marinesco-Sjogren syndrome
          term:
            id: MONDO:0009567
            label: Marinesco-Sjogren syndrome
        description: The closest clinical mimic and the one most likely to be considered first. Marinesco-Sjogren
          syndrome, caused by bi-allelic SIL1 variants, pairs a myopathy with raised creatine kinase and
          cerebellar atrophy with ataxia, which is precisely the MSTO1 core. The index patient of the
          first recessive MSTO1 family had SIL1 sequenced and excluded before the MSTO1 diagnosis was
          reached, which is direct documentation that this differential is worked through in practice.
        distinguishing_features:
        - Early-onset bilateral cataract is a cardinal feature of Marinesco-Sjogren syndrome and was absent
          in all 15 patients of the largest MSTO1 cohort.
        - Hypergonadotropic hypogonadism and short stature are typical of Marinesco-Sjogren syndrome and
          are not established features of MSTO1 disease.
        - Marinesco-Sjogren muscle shows rimmed autophagic vacuoles with abnormal membranous whorls, whereas
          MSTO1 muscle shows a non-specific dystrophic pattern.
        - Only the causal gene distinguishes the two definitively; SIL1 was verified as HGNC:24624 and
          Marinesco-Sjogren syndrome as MONDO:0009567 with OMIM:248800 using OAK and the HGNC REST API
          on 2026-08-01.
      selected_evidence:
        snippet: 'The following genes were previously excluded by Sanger sequencing: SPG7, FKTN, POMT1,
          POMT2, LARGE, POMGNT1, and SIL1.'
        supports: SUPPORT
