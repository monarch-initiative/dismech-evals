        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: p148h_enhanced_degradation
        hypothesis_label: MSX2 p.Pro148His is degraded faster and promotes degradation of wild-type MSX2,
          reducing suture mesenchyme proliferation
        status: ALTERNATIVE
        description: In cultured mesenchymal cells, wild-type MSX2 stimulated proliferation and cyclin
          D1 expression but p.Pro148His did not, and the mutant protein had a shorter half-life, was more
          heavily ubiquitylated through Praja1, and increased ubiquitylation of wild-type MSX2. The authors
          read the variant as dominant negative. This conflicts with the DNA-binding and transgenic mouse
          data behind the canonical model and has not been tested in vivo; no edge in this entry is assigned
          to it.
      selected_evidence:
        snippet: Overexpression of wild type MSX2 in mesenchymal cells stimulated cell proliferation and
          cyclin D1 expression, whereas P148H mutant did not.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
