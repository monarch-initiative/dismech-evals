        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: msx2_dosage_gain
        hypothesis_label: Codon 148 variants increase MSX2 activity in the sutures, retarding osteogenic
          differentiation and expanding the proliferating osteogenic cell pool that drives premature fusion
        status: CANONICAL
        description: 'The Pro148His variant stabilizes MSX2 binding to its target sequences, both wild-type
          and mutant Msx2 overexpression cause craniosynostosis in mice, and extra copies of MSX2 in distal
          5q duplications are associated with craniosynostosis, so the disease is read as a dose-dependent
          gain of MSX2 function. Edges that belong to it carry hypothesis_groups: [msx2_dosage_gain].'
      selected_evidence:
        snippet: That both mutant and wild-type Msx2 elicit craniosynostosis in transgenic mice and that
          the Boston type mutation is dominant led us to hypothesize that the mutation might enhance the
          normal function of Msx2.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
