      assertion:
        name: Endocranial erosions
        category: Skeletal
        description: Multiple erosions of the inner surface of the skull vault on CT, present in both
          of the first two reported families and proposed as a diagnostic clue.
        phenotype_term:
          preferred_term: Multiple endocranial erosions
        notes: Left without an HPO binding. HP:0034271 Copper beaten skull is defined as "Diffuse prominent
          gyral impressions on the inner table of skull vault said to resemble beaten copper", and the
          cited sources describe erosions without calling them gyral or convolutional impressions, so
          that term would assert more than they say. OLS HPO searches (ols4 api/search, ontology=hp) returned
          no hits for "endocranial erosion", "endocranial erosions", "skull erosion" or "calvarial erosion";
          "inner table" returned only HP:0034271 and HP:0034454 Arachnoid granulation; "digital markings"
          and "convolutional markings" returned only unrelated terms (finger and renal terms).
      selected_evidence:
        snippet: Besides unique features such as the cranial sutures involved, minor limb abnormalities
          and incomplete penetrance, our patients share with the original family autosomal dominant inheritance
          and the presence of multiple endocranial erosions on CT imaging.
