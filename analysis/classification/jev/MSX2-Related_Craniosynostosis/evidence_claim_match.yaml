  9bf230c04e05f50b6f17e646fdc282a01b025cd05c4ad1b1d7e8da8c4a5e6bf5:
    claim:
      about:
        disease:
          name: MSX2-Related Craniosynostosis
          disease_term:
            preferred_term: craniosynostosis 2
            term:
              id: MONDO:0011481
              label: craniosynostosis 2
        context: []
      assertion_type: Genetic
      assertion:
        name: MSX2
        gene_term:
          preferred_term: MSX2
          term:
            id: hgnc:7392
            label: MSX2
        association: CAUSATIVE
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Heterozygous missense variants at codon 148 in the homeodomain: p.Pro148His in the
          original Boston family and p.Pro148Leu in later families. A duplication of the whole MSX2 gene
          has been reported in one child with bicoronal synostosis, cutaneous syndactyly and colobomas.
          Loss-of-function MSX2 variants cause enlarged parietal foramina instead.'
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_ac8a9313-9ef2-4556-9a25-db7fa2ed99ed-2020-09-28T170000.000Z
        variants:
        - name: p.Pro148His
          description: The original Boston-family variant, a histidine for the conserved proline at position
            7 of the homeodomain N-terminal arm. It increases DNA binding affinity by stabilizing the
            protein-DNA complex.
          clinical_significance: PATHOGENIC
        - name: p.Pro148Leu (c.443C>T)
          description: A leucine at the same codon, segregating in a family reported in 2013 and found
            in a UK family by exome sequencing. The UK report counts both families published in 2013 as
            p.Pro148Leu.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: These data confirm that missense mutations altering the proline at codon 148 of MSX2
          cause dominantly inherited craniosynostosis.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
