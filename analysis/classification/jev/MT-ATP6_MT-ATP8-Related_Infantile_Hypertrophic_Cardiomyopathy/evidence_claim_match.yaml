          reading frame, substitutes arginine for the conserved tryptophan at MT-ATP8 position 55. Heteroplasmic;
          identified in four unrelated infants with isolated hypertrophic cardiomyopathy, and subsequently
          reported at 90% cardiac heteroplasmy in a child who died at two months.
        gene:
          preferred_term: MT-ATP6
          term:
            id: hgnc:7414
            label: MT-ATP6
        clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: In all four, a novel mitochondrial m.8528T-->C mutation was identified.
        supports: SUPPORT
