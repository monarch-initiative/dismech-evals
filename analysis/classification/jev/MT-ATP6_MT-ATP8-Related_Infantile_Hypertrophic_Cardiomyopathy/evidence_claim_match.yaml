              label: cardiomyopathy, infantile hypertrophic
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Complex V Holoenzyme Deficiency with Accumulation of Subcomplexes
        biological_scale: MOLECULAR
        description: The biochemical consequence is an isolated deficiency of assembled, catalytically
          competent ATP synthase. In the closest characterised human model - a homoplasmic MT-ATP8 nonsense
          variant one base away, at m.8529 - patient fibroblasts, muscle and transmitochondrial cybrids
          all showed reduced complex V activity, absent holocomplex V, an excess of ATP synthase subcomplexes,
          and in-gel activity of free F1-ATPase, i.e. an unattached catalytic head no longer coupled to
          a proton channel.
        protein_complexes:
        - preferred_term: proton-transporting ATP synthase complex
          modifier: DECREASED
          term:
            id: GO:0045259
            label: proton-transporting ATP synthase complex
        molecular_functions:
        - preferred_term: proton-transporting ATP synthase activity, rotational mechanism
          modifier: DECREASED
          term:
            id: GO:0046933
            label: proton-transporting ATP synthase activity, rotational mechanism
        notes: The mechanistic evidence quoted here is from m.8529G>A (p.Trp55X), a homoplasmic MT-ATP8
          nonsense variant in an adolescent with apical hypertrophic cardiomyopathy and neuropathy, not
          from m.8528T>C itself. It is cited because it is the best-characterised demonstration that loss
          of an mtDNA-encoded complex V subunit in this overlap region produces an assembly defect; the
          corresponding cellular experiments have not been reported for m.8528T>C.
      selected_evidence:
        snippet: Reduced complex V activity was measured in the patient's fibroblasts and muscle tissue,
          and was confirmed in cybrid clones containing patient-derived mitochondrial DNA.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
