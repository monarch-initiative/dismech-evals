        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cardiac_restriction
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why is the phenotype of m.8528T>C cardiac-restricted when the mutant genome is present
          in every tissue?
        attaches_to:
        - pathophysiology#Cardiac Heteroplasmy Threshold
        rationale: The index series described isolated hypertrophic cardiomyopathy without the encephalopathy,
          myopathy or optic involvement typical of other MT-ATP6 disease, and the one variant carrier
          with tissue data had 90% cardiac heteroplasmy. Whether the restriction reflects tissue-specific
          segregation of mutant genomes, a lower threshold in a tissue with extreme ATP demand, or both
          has not been determined, and no systematic multi-tissue heteroplasmy survey of this variant
          exists.
        proposed_experiments:
        - experiment_id: exp_cmih_multitissue_heteroplasmy
          name: Multi-tissue heteroplasmy mapping in autopsy material
          description: Quantify m.8528T>C heteroplasmy across heart, skeletal muscle, brain, liver and
            blood in the same individuals to test whether the cardiac predominance is a segregation effect
            or a threshold effect.
      selected_evidence:
        snippet: The CNS was the most frequently affected tissue (93%), followed by the muscle (75%),
          eye (46%), and heart (18%).
        supports: SUPPORT
    origin:
