        description: Human ATP synthase is an assembly of 29 subunits of 18 kinds, of which only ATP6
          and ATP8 are encoded in mitochondrial DNA. Assembly proceeds through a nuclear-encoded intermediate
          - the F1-c8 complex attached to the peripheral stalk with subunits e, f and g - into which ATP6
          and ATP8, translated on mitochondrial ribosomes, are inserted last; the 6.8 proteolipid then
          locks them in place and only at that point is the complex coupled to ATP synthesis. A lesion
          that removes or destabilises either mtDNA-encoded subunit therefore arrests assembly at the
          final, coupling-conferring step rather than preventing formation of the F1 head.
        cellular_components:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
        biological_processes:
        - preferred_term: mitochondrial ATP synthase complex assembly
          modifier: DECREASED
          term:
            id: GO:0033615
            label: mitochondrial proton-transporting ATP synthase complex assembly
      selected_evidence:
        snippet: All but two membrane components are encoded in nuclear genes, synthesized on cytoplasmic
          ribosomes, and imported into the matrix of the organelle, where they are assembled into the
          complex with ATP6 and ATP8, the products of overlapping genes in mitochondrial DNA.
        supports: SUPPORT
