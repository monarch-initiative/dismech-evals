  95d13dffcaaec67aa478c23fb526a0ffe0311178aa9ae2eb4d1a22c8961d4a95:
    claim:
      about:
        disease:
          name: MT-ATP6/MT-ATP8-Related Infantile Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: cardiomyopathy, infantile hypertrophic
            term:
              id: MONDO:0010777
              label: cardiomyopathy, infantile hypertrophic
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cardiac Heteroplasmy Threshold
        biological_scale: CELLULAR
        description: Because the variant is heteroplasmic, each tissue carries a mixture of mutant and
          wild-type mitochondrial genomes and expresses a biochemical defect only once the mutant load
          passes a tissue-specific threshold. This is what makes the phenotype cardiac-predominant despite
          a genome present in every cell, and it accounts for the variable expression seen among maternal
          relatives. In a fatal infantile case the cardiac heteroplasmy level of m.8528T>C was 90%.
        notes: Heteroplasmy is not a clean switch. A mother carrying 82% m.8528T>C in blood was reported
          as an asymptomatic carrier, and one affected infant with hypertrophic cardiomyopathy had only
          59% mutant load in blood, so blood heteroplasmy neither predicts nor excludes cardiac disease
          and the cardiac-tissue level is the meaningful measurement.
      selected_evidence:
        snippet: In the three patients with mitochondrial DNA mutations whose cardiac tissues were available,
          high heteroplasmy rates in the cardiac tissue were observed for m.8528T>C (90%, died at 2 months
          of age)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/0
      context_paths:
