      assertion:
        name: Disrupted ATP Synthase Dimerisation and Cristae Architecture
        biological_scale: CELLULAR
        description: Beyond catalysis, ATP synthase dimers and their oligomeric rows along the cristae
          edges impose the curvature of the inner mitochondrial membrane. Failure to incorporate ATP6
          therefore has a structural consequence as well as a bioenergetic one, degrading the cristae
          surface on which the whole respiratory chain is organised. This arm is inferred from the assembly
          and membrane-shaping literature rather than from ultrastructural study of m.8528T>C hearts.
        cellular_components:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
        biological_processes:
        - preferred_term: cristae formation
          modifier: DECREASED
          term:
            id: GO:0042407
            label: cristae formation
        notes: Curated as a mechanistically expected parallel arm, not as an observed finding in this
          disorder. No ultrastructural study of myocardium carrying m.8528T>C has been published, so this
          node should not be read as an established human phenotype.
      selected_evidence:
        snippet: The present data show that there is a link between dimerization of the mitochondrial
          ATP synthase and cristae morphology.
        supports: SUPPORT
