    claim:
      about:
        disease:
          name: MT-ATP6/MT-ATP8-Related Infantile Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: cardiomyopathy, infantile hypertrophic
            term:
              id: MONDO:0010777
              label: cardiomyopathy, infantile hypertrophic
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: atp6_vs_atp8_driver
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the infantile cardiomyopathy of m.8528T>C driven by loss of the MT-ATP6 initiation
          codon, by the MT-ATP8 p.Trp55Arg substitution, or does it require both?
        attaches_to:
        - pathophysiology#m.8528T>C Substitution in the MT-ATP6/MT-ATP8 Overlap
        rationale: The variant's two consequences fall in different genes and are not separable in patients,
          because the overlapping reading frames make it impossible for a natural allele to carry one
          without the other. The current best inference, stated in the 2024 ATP synthase review, is that
          loss of subunit a is the primary driver of the assembly defect - and the natural experiment
          supports it, since the adjacent m.8529G>A variant truncates only A6L, spares subunit a, and
          produces later-onset (about four years), substantially milder disease at comparably high heteroplasmy.
          But the review reaches that conclusion by analogy to a different MT-ATP6 variant rather than
          by measurement, and it immediately notes that the A6L-only lesion still destabilises the complex.
          No cybrid or transmitochondrial study of m.8528T>C itself has been reported, so the relative
          contribution of the two arms remains an inference.
        proposed_experiments:
        - experiment_id: exp_cmih_m8528_cybrids
          name: Transmitochondrial cybrids carrying m.8528T>C
          description: Generate cybrid clones spanning a range of m.8528T>C heteroplasmy and measure complex
            V assembly by blue native PAGE, ATP synthesis rate, and steady-state ATP6 and ATP8 protein
            levels, to establish which subunit is lost and at what mutant load the defect appears.
        - experiment_id: exp_cmih_separated_frames
          name: Separated-frame expression of the two consequences
          description: Express the ATP6 start-codon change and the ATP8 p.Trp55Arg substitution independently
            in a recoded or heterologous system to attribute the assembly defect to one arm, the other,
            or their combination.
      selected_evidence:
        snippet: one would expect that the lack of subunit a is the primary driver of diminished assembly/stability
          of complex V in the case of m.8528T>C substitution.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
