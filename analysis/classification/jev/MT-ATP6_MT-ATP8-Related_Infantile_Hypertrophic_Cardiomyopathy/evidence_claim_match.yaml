  8b670e2368fcc51eefbb508836ad9af2fdac4b655e5eb9ea2a603a739daba4b3:
    claim:
      about:
        disease:
          name: MT-ATP6/MT-ATP8-Related Infantile Hypertrophic Cardiomyopathy
          disease_term:
            preferred_term: cardiomyopathy, infantile hypertrophic
            term:
              id: MONDO:0010777
              label: cardiomyopathy, infantile hypertrophic
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: m.8528T>C Substitution in the MT-ATP6/MT-ATP8 Overlap
        biological_scale: MOLECULAR
        description: 'MT-ATP8 and MT-ATP6 are transcribed as a bicistronic message whose reading frames
          overlap by 46 nucleotides. Position 8528 falls inside that overlap. The m.8528T>C substitution
          therefore has two simultaneous consequences in two different proteins: it converts the ATP6
          initiation codon (ATG) so that the encoded residue is threonine rather than methionine, and
          it replaces tryptophan 55 of ATP8, a strictly conserved hydrophobic residue, with the strongly
          basic arginine. This is the defining molecular lesion of the entity, and the first reported
          mutation to hit both mtDNA-encoded complex V subunits at once.'
        genes:
        - preferred_term: MT-ATP6
          term:
            id: hgnc:7414
            label: MT-ATP6
        - preferred_term: MT-ATP8
          term:
            id: hgnc:7415
            label: MT-ATP8
      selected_evidence:
        snippet: This results in a change of the initiation codon in ATPase 6 to threonine and a concurrent
          change from a highly conserved hydrophobic amino acid, tryptophan, at position 55 of ATPase
          8 to a highly basic arginine.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19188198
      reference_title: Infantile cardiomyopathy caused by a mutation in the overlapping region of mitochondrial
        ATPase 6 and 8 genes.
      evidence_source: HUMAN_CLINICAL
      explanation: States both consequences of the single substitution, which is the whole basis for treating
        this as one lesion affecting two gene products.
