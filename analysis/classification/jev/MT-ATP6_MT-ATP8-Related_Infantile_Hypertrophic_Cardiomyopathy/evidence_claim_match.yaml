        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Systemic Lactate Accumulation
        biological_scale: ORGANISM
        description: Reliance on glycolysis where oxidative phosphorylation is blocked raises circulating
          lactate. Elevated lactate is the classic, though neither sensitive nor specific, systemic marker
          of a primary mitochondrial disorder, and in an infant with unexplained hypertrophic cardiomyopathy
          it is one of the findings that redirects investigation toward mitochondrial DNA.
        notes: Hyperlactataemia is curated as the expected systemic consequence of blocked oxidative phosphorylation,
          quantified only at the level of the whole MT-ATP6/MT-ATP8 spectrum. The index m.8528T>C series
          describes the cardiac phenotype as isolated and does not report lactate values, so lactic acidosis
          is not curated as a frequency-bearing phenotype of this entry.
      selected_evidence:
        snippet: Reduced citrulline levels and increased alanine and lactate levels were reported in 56%,
          49%, and 71% of patients, respectively, suggesting their role as potential biomarkers.
        supports: SUPPORT
