          cites show methionine formation in patient cells did not increase on cobalamin supplementation
          but did respond to folate, which places the block on the folate side. It is plausibly given
          before that localisation is known, since the presenting biochemistry - raised methylmalonic
          acid and reduced methylcobalamin synthesis - points at a cobalamin disorder.'
