        description: Remethylation of homocysteine to methionine by methionine synthase requires 5-methyltetrahydrofolate
          derived from the MTHFD1-generated pool. This is the arm the cell sacrifices when MTHFD1 is limiting,
          and correspondingly it is the arm with the largest flux deficit - a 90% fall in formate incorporation
          into methionine. Patient fibroblasts show severely reduced methionine formation that does not
          respond to cobalamin supplementation but does respond to folic and folinic acid, locating the
          block on the folate side rather than the cobalamin side.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        biological_processes:
