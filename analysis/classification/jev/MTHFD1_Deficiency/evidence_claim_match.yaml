            term:
              id: MONDO:0060611
              label: combined immunodeficiency and megaloblastic anemia with or without hyperhomocysteinemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Depletion of the Cytosolic One-Carbon-Loaded Folate Pool
        description: 'MTHFD1 is the primary entry point for single carbons into cytosolic folate metabolism,
          condensing formate with tetrahydrofolate to generate 10-formyl- and 5,10-methylenetetrahydrofolate.
          Losing it starves the downstream folate-dependent pathways of activated one-carbon units. The
          starvation is not uniform: patient fibroblast flux measurements show it falls hardest on methionine
          synthesis, next on thymidylate synthesis, and not at all on purine synthesis.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        biological_processes:
        - preferred_term: tetrahydrofolate metabolic process
          modifier: DECREASED
          term:
            id: GO:0046653
            label: tetrahydrofolate metabolic process
        - preferred_term: one-carbon metabolic process
          modifier: DECREASED
          term:
            id: GO:0006730
            label: one-carbon metabolic process
      selected_evidence:
        snippet: MTHFD1 functions to condense formate with tetrahydrofolate and serves as the primary
          entry point of single carbons into folate-dependent one-carbon metabolism in the cytosol.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25548164
      reference_title: Human mutations in methylenetetrahydrofolate dehydrogenase 1 impair nuclear de
