  83fdbaba6141ba9c862f9f15a9c7b5b6c0657a99548011b40594b681337ea07f:
    claim:
      about:
        disease:
          name: MTHFD1 Deficiency
          disease_term:
            preferred_term: combined immunodeficiency and megaloblastic anemia with or without hyperhomocysteinemia
            term:
              id: MONDO:0060611
              label: combined immunodeficiency and megaloblastic anemia with or without hyperhomocysteinemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MTHFD1 Trifunctional Enzyme Loss of Function
        description: 'Biallelic MTHFD1 variants disable the cytoplasmic trifunctional C1-tetrahydrofolate
          synthase. Reported alleles hit the enzyme in several ways: c.517C>T (p.Arg173Cys) alters a critical
          arginine in the NADP-binding site, c.727+1G>A and c.1674G>A disrupt splicing, an exon 13 deletion
          removes coding sequence outright, and c.673G>T (p.Glu225*) truncates the protein. The shared
          consequence is loss of the enzyme that condenses formate with tetrahydrofolate.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genes:
        - preferred_term: MTHFD1
          term:
            id: hgnc:7432
            label: MTHFD1
        notes: No mouse model of this disease exists, and the reason is worth recording so nobody adds
          the wrong one. Homozygous Mthfd1 disruption in mouse is early embryonic lethal, so there is
          no viable null. The available Mthfd1S(+/-) mouse models the common R653Q synthetase polymorphism,
          which is a distinct entity from this Mendelian disorder - a low-penetrance susceptibility allele
          studied for neural tube and congenital heart defect risk, not a model of biallelic MTHFD1 deficiency.
          Human patient fibroblasts are therefore the only system in which this disease's mechanism has
          been measured.
        molecular_functions:
        - preferred_term: 5,10-methylenetetrahydrofolate dehydrogenase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0004488
            label: methylenetetrahydrofolate dehydrogenase (NADP+) activity
        - preferred_term: 10-formyltetrahydrofolate synthetase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0004329
            label: formate-tetrahydrofolate ligase activity
        - preferred_term: 5,10-methenyltetrahydrofolate cyclohydrolase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0004477
            label: methenyltetrahydrofolate cyclohydrolase activity
      selected_evidence:
        snippet: There was no detectable methylenetetrahydrofolate dehydrogenase specific activity in
          extracts from any of the four patients.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32414565
      reference_title: Biochemical analysis of patients with mutations in MTHFD1 and a diagnosis of methylenetetrahydrofolate
        dehydrogenase 1 deficiency.
      evidence_source: IN_VITRO
      explanation: The first direct measurement of MTHFD1 enzyme function in patients, and the strongest
        evidence that the disease alleles abolish catalytic activity rather than merely reducing it.
