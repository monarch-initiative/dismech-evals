        rationale: 'Both routes were plausible before the flux experiment. Severe combined immunodeficiency
          is classically associated with impaired purine nucleotide metabolism (ADA and PNP deficiency),
          while megaloblastic anemia is classically associated with impaired de novo thymidylate biosynthesis
          - and this disorder has both phenotypes, so a two-lesion explanation was available. Labelled
          flux measurement in patient fibroblasts discriminated between them: purine biosynthesis was
          unaffected, so one lesion in thymidylate synthesis accounts for both arms. This is recorded
          because the resolved answer is easy to lose - the entry''s causal chain now runs only through
          thymidylate, and a reader should know that the purine route was tested rather than overlooked.'
        attaches_to:
        - pathophysiology#Lymphocyte Developmental and Proliferative Failure
        - pathophysiology#Impaired Nuclear de novo Thymidylate Biosynthesis
      selected_evidence:
        snippet: These results provide evidence that impaired nuclear de novo dTMP biosynthesis can lead
          to both megaloblastic anemia and SCID in MTHFD1 deficiency.
        supports: SUPPORT
