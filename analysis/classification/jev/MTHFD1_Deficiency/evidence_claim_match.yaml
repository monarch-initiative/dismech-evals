      - /disease_term
    evidence_metadata:
      reference: PMID:27707659
      reference_title: Precision Molecular Diagnosis Defines Specific Therapy in Combined Immunodeficiency
        with Megaloblastic Anemia Secondary to MTHFD1 Deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents that the second allele was found only by deliberate structural-variant review,
