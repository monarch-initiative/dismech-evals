  d7c7f6eda1203da7582a1c5a0c3b2b8b6b01a81d4eae7bc48dd0caa1c452a4fc:
    claim:
      about:
        disease:
          name: MTHFD1 Deficiency
          disease_term:
            preferred_term: combined immunodeficiency and megaloblastic anemia with or without hyperhomocysteinemia
            term:
              id: MONDO:0060611
              label: combined immunodeficiency and megaloblastic anemia with or without hyperhomocysteinemia
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Exome sequencing with explicit structural-variant review
        description: 'The diagnosis is molecular. Two features of these cases are worth carrying forward.
          First, the biochemical picture is misleading: the founding patient had a selective decrease
          in methylcobalamin synthesis in fibroblasts and raised methylmalonic acid, which points toward
          a cobalamin disorder rather than a folate one, and the fibroblast studies that resolved it showed
          the methionine defect was unresponsive to cobalamin but responsive to folate. Second, standard
          exome variant calling can find only one allele: in one family the paternal allele was an exon
          13 deletion, recovered only by manually inspecting per-exon coverage depth after the phenotype
          made a second hit likely.'
      selected_evidence:
        snippet: In view of highly suggestive phenotype, we extended our bioinformatics interrogation
          for structural variants in the MTHFD1 gene by manual evaluation of the exome data for sequence
          depth coverage of all the exons.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
