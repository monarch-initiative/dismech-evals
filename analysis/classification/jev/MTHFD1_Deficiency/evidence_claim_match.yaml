          so the edge is recorded as indirect. Notably this arm is also the one that can leave permanent
          damage: in the second reported patient every feature resolved on treatment except the retinopathy.'
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: The second patient presented with hyperhomocysteinemia, megaloblastic anaemia, HUS, microangiopathy
          and retinopathy; all except the retinopathy resolved after treatment with hydroxocobalamin,
          betaine and folinic acid.
