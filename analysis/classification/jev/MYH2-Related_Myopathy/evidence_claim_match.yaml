    claim:
      about:
        disease:
          name: MYH2-Related Myopathy
          disease_term:
            preferred_term: myopathy, proximal, and ophthalmoplegia
            term:
              id: MONDO:0011577
              label: myopathy, proximal, and ophthalmoplegia
        context: []
      assertion_type: Subtype
      assertion:
        name: Autosomal dominant
        display_name: Autosomal dominant MYH2 myopathy (hereditary inclusion body myopathy 3)
        subtype_term:
          preferred_term: hereditary inclusion body myopathy-joint contractures-ophthalmoplegia syndrome
          term:
            id: MONDO:0019195
            label: hereditary inclusion body myopathy-joint contractures-ophthalmoplegia syndrome
        genes:
        - preferred_term: MYH2
          term:
            id: hgnc:7572
            label: MYH2
        description: Heterozygous MYH2 variants. The prototype is the E706K motor-domain missense variant
          in the original Swedish family, with congenital joint contractures that normalise in early childhood,
          external ophthalmoplegia, proximal weakness that is static in childhood and progressive from
          adulthood, and rimmed vacuoles with tubulofilamentous inclusions in older patients. Other dominant
          alleles, several de novo, lie in the distal tail around the assembly competence domain (L1870P,
          L1877P, and a splice variant skipping exon 39) and give neonatal, oculopharyngodistal-like,
          or ophthalmoplegia-free presentations. MONDO:0019195 is the Orphanet concept defined on the
          E706K phenotype; the tail-variant presentations are included here by inheritance rather than
          because they match that phenotype.
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: We identified a missense mutation, Glu-706 --> Lys, which is located in a highly conserved
          region of the motor domain, the so-called SH1 helix region.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
