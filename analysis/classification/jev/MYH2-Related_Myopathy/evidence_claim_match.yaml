              label: myopathy, proximal, and ophthalmoplegia
        context: []
      assertion_type: Genetic
      assertion:
        name: MYH2
        gene_term:
          preferred_term: MYH2
          term:
            id: hgnc:7572
            label: MYH2
        relationship_type: CAUSATIVE
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'Encodes myosin heavy chain IIa, the major isoform of fast type 2A fibres, in the skeletal
          myosin heavy chain cluster on chromosome 17p13. Dominant alleles are motor-domain (E706K) or
          distal-tail missense and splice variants; recessive alleles are truncating, splice, or missense
          variants. Sequencing of 50 control individuals found little coding variation in MYH2, consistent
          with strong selective constraint. ClinGen curates the two inheritance modes separately against
          MONDO:0011577: autosomal recessive as Definitive and autosomal dominant as Moderate, noting
          that a dominant-negative mechanism for the dominant form has been suggested but not established.'
        variants:
        - name: c.2116G>A p.(Glu706Lys)
          description: Founding dominant motor-domain variant (E706K) in the SH1 helix, from the original
            Swedish family.
          gene:
            preferred_term: MYH2
            term:
              id: hgnc:7572
              label: MYH2
        - name: c.5673+1G>C (exon 39 skipping)
          description: Dominant splice-donor variant causing in-frame skipping of exon 39 and loss of
            residues 1860-1891 of the distal tail.
          gene:
            preferred_term: MYH2
            term:
              id: hgnc:7572
              label: MYH2
      selected_evidence:
        snippet: We here report on a human myopathy associated with a mutation in a fast myosin heavy
          chain (MyHC) gene, and also the genetic defect in a hereditary inclusion body myopathy.
        supports: SUPPORT
