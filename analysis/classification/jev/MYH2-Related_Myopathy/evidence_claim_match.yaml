        context:
        - path: /has_subtypes/0
          value:
            name: Autosomal dominant
            display_name: Autosomal dominant MYH2 myopathy (hereditary inclusion body myopathy 3)
            subtype_term:
              preferred_term: hereditary inclusion body myopathy-joint contractures-ophthalmoplegia syndrome
              term:
                id: MONDO:0019195
                label: hereditary inclusion body myopathy-joint contractures-ophthalmoplegia syndrome
            genes:
            - preferred_term: MYH2
              term:
                id: hgnc:7572
                label: MYH2
            description: Heterozygous MYH2 variants. The prototype is the E706K motor-domain missense
              variant in the original Swedish family, with congenital joint contractures that normalise
              in early childhood, external ophthalmoplegia, proximal weakness that is static in childhood
              and progressive from adulthood, and rimmed vacuoles with tubulofilamentous inclusions in
              older patients. Other dominant alleles, several de novo, lie in the distal tail around the
              assembly competence domain (L1870P, L1877P, and a splice variant skipping exon 39) and give
              neonatal, oculopharyngodistal-like, or ophthalmoplegia-free presentations. MONDO:0019195
              is the Orphanet concept defined on the E706K phenotype; the tail-variant presentations are
              included here by inheritance rather than because they match that phenotype.
          role: subtype
      assertion_type: Phenotype
      assertion:
        name: Rimmed vacuoles
        category: Neuromuscular
        description: Rimmed vacuoles in adult dominant E706K patients and in some recessive missense cases;
          absent in young patients and in a recent 13-patient series.
        phenotype_term:
          preferred_term: Rimmed vacuoles
          term:
            id: HP:0003805
            label: Rimmed vacuoles
        subtype: Autosomal dominant
      selected_evidence:
        snippet: In adults with progressive muscle weakness, the muscle biopsies showed dystrophic changes
          and rimmed vacuoles with cytoplasmic and intranuclear inclusions of 15- to 21-nm filaments.
        supports: SUPPORT
