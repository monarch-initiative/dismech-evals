      assertion_type: Subtype
      assertion:
        name: Myosin storage myopathy
        display_name: Myosin storage (hyaline body) myopathy, autosomal dominant
        subtype_term:
          preferred_term: congenital myopathy 7A, myosin storage, autosomal dominant
          term:
            id: MONDO:0008409
            label: congenital myopathy 7A, myosin storage, autosomal dominant
        description: Childhood-onset, slowly progressive myopathy defined histologically by large subsarcolemmal
          inclusions of slow/beta-cardiac myosin (hyaline bodies) in type 1 fibres, caused by distal-rod
          missense variants such as Arg1845Trp, His1904Leu and Leu1793Pro. MONDO keeps it as a separate
          term; ClinGen lumps it into MYH7-related skeletal myopathy. The recessive form (MONDO:0009708)
          is not covered here.
      selected_evidence:
        snippet: 'Slow, oxidative, type 1 muscle fibers showed large inclusions consisting of slow/beta-cardiac
          MyHC. The features were similar to a previously described entity: hyaline body myopathy.'
        supports: SUPPORT
