        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: myosin_inhibitor_transfer
        prompt: Would cardiac myosin inhibitors such as mavacamten or aficamten improve skeletal muscle
          function in Laing distal myopathy or myosin storage myopathy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Myosin ATPase inhibition (preclinical)
        - mechanistic_hypotheses#myosin_inhibitor_rescue
        rationale: 'Only one tool compound (MYK-581) has been tested, in one mouse model; no human skeletal-muscle
          data exist for the approved cardiac inhibitors. The two approved drugs are not interchangeable
          for this purpose: mavacamten sequesters heads on the thick filament, whereas aficamten slows
          ATP turnover without doing so. Mavacamten does act on skeletal muscle myosin, and skeletal myopathy
          has been reported as an adverse effect, so any transfer needs a safety margin.'
      selected_evidence:
        snippet: mavacamten treatment reduced the proportion of myosin heads in an active state but did
          not eliminate length-dependent structural changes in passive muscle
        supports: SUPPORT
