            term:
              id: MONDO:0008050
              label: MYH7-related skeletal myopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: assembly_versus_energetics
        prompt: Is weakness in MYH7 rod myopathy driven mainly by defective thick-filament assembly and
          aggregation, or by loss of myosin head sequestration and raised ATP use, and is the human disease
          hypercontractile?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Defective Thick Filament Assembly
        - pathophysiology#Loss of Myosin Head Sequestration
        - mechanistic_hypotheses#rod_assembly_aggregation
        - mechanistic_hypotheses#rod_srx_energetics
        rationale: The two models rest on different systems (in vitro and fly assembly studies versus
          a transgenic mouse and patient biopsies) and lead to different therapies. The mouse study reports
          hypercontractility; a study of patient myofibres with LMM variants reports unchanged contractility.
        proposed_experiments:
        - experiment_id: srx_stabiliser_versus_aggregate_burden
          name: Relaxed-state stabiliser rescue measured against aggregate burden
          description: Treat a rod-variant model (R1500P mouse, or patient iPSC-derived myotubes) with
            a small molecule that restores head sequestration, and measure function together with thick-filament
            integrity and myosin aggregate burden. Rescue of function without any change in aggregates
            would favour the energetic model; failure to rescue despite a corrected DRX fraction would
            favour the assembly model.
          would_support:
          - mechanistic_hypotheses#rod_srx_energetics
          would_refute:
          - mechanistic_hypotheses#rod_srx_energetics
          supporting_outcome:
          - Function improves with normalized DRX fraction while aggregate burden and filament disorganization
            are unchanged.
          refuting_outcome:
          - DRX fraction is corrected but function does not improve, or improvement tracks a reduction
            in aggregates.
        - experiment_id: muscle_energetics_mrs_in_patients
          name: 31P magnetic resonance spectroscopy in genotyped patients
          description: Measure resting phosphocreatine/ATP and post-exercise phosphocreatine recovery
            in the tibialis anterior of genotyped MYH7 rod-variant carriers against controls, to test
            whether the raised myosin ATP use seen in biopsies is detectable in vivo and tracks weakness.
          would_support:
          - mechanistic_hypotheses#rod_srx_energetics
          supporting_outcome:
          - Carriers show an altered energetic profile in affected muscle that scales with weakness.
          refuting_outcome:
          - No energetic difference from controls in affected muscle.
      selected_evidence:
        snippet: These findings indicate that the structural remodeling associated with LMM mutations
          induces a pathogenic state in which formation of shutdown heads is impaired, thus increasing
          myosin head ATP demand in the filaments, rather than affecting contractility.
        supports: SUPPORT
    origin:
