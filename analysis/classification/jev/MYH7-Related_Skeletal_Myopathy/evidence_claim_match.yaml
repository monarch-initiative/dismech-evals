        discussion_id: shared_rod_mechanism_across_isoforms
        prompt: Do MYH7 and MYH2 rod variants share a single head-sequestration mechanism, and does it
          hold for myosin storage alleles as well as Laing alleles?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Myosin Head Sequestration
        - mechanistic_hypotheses#shared_myosin_rod_mechanism
        rationale: 'A shared mechanism would justify a cross-isoform mechanism module linking this entry
          with MYH2-Related_Myopathy, but the evidence is one study from one group, and its readouts are
          themselves contested: the mantATP assay for the super-relaxed state, and the assumed equivalence
          of that state with the interacting-heads structure, are both disputed. The question applies
          only to dominant rod variants; recessive MYH2 myopathy is a loss of type 2A fibres, a different
          mechanism.'
      selected_evidence:
        snippet: A combination of our experimental observations and theories suggests that the displacement
          of mantATP in purified proteins is not a reliable assay to quantify the SRX population.
        supports: SUPPORT
