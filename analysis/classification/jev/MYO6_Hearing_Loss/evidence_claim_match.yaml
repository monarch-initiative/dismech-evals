        context: []
      assertion_type: Treatment
      assertion:
        name: Allele-selective Cas9 editing of the mutant Myo6 allele (preclinical)
        description: 'Experimental, preclinical only. Inner-ear delivery of AAV-PHP.eB carrying SaCas9-KKH
          and a guide RNA that preferentially cuts the dominant Myo6 C442Y allele rescued auditory function
          for up to 5 months in heterozygous Myo6WT/C442Y mice, with more regular hair bundles and better
          hair cell survival. It targets the dominant (DFNA22-type) mechanism and has not been tested
          in humans.

          '
        therapeutic_modality: GENE_EDITING
        treatment_term:
          preferred_term: Gene Therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: The in vivo editing efficiency of the AAV-SaCas9-KKH-Myo6-g2 system on Myo6C442Y is 4.05%
          on average in Myo6WT/C442Y mice, which was ∼17-fold greater than editing efficiency of Myo6WT
          alleles.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/0
      context_paths:
