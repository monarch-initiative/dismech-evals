      assertion:
        name: MYO6 heterozygous variants (DFNA22)
        subtype: DFNA22
        gene_term:
          preferred_term: MYO6
          term:
            id: hgnc:7605
            label: MYO6
        association: Causative
        relationship_type: CAUSATIVE
        features: MYO6 encodes unconventional myosin VI, the only known minus-end-directed actin-based
          motor. Heterozygous missense variants cause dominant progressive postlingual sensorineural hearing
          loss (DFNA22). The H246R allele has been associated with both hearing loss and hypertrophic
          cardiomyopathy.
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        case_fractions:
        - population: Japanese autosomal dominant sensorineural hearing loss families
          case_fraction_percent: 2.4
          cohort_size: 1336
          notes: 'Recorded as a per-gene case fraction rather than under `prevalence:`: the figure is
            the share of a disease cohort explained by MYO6, not the occurrence of MYO6-related hearing
            loss in a population.'
        - population: Korean autosomal dominant nonsyndromic hearing loss families (two hospitals)
          case_fraction_percent: 6.2
          cohort_size: 81
          notes: Five of 81 families segregated a MYO6 variant.
        variants:
        - name: p.Cys442Tyr (C442Y)
          description: Motor-domain missense variant in the original Italian DFNA22 family. A humanized
            knock-in mouse carrying it reproduces progressive postlingual deafness in a semi-dominant
            pattern.
        - name: p.Arg205Ter (p.R205X)
          description: Recurrent heterozygous truncating variant, found in three of five Korean DFNA22
            families.
        - name: p.Gly223Arg and p.Thr158Arg
          description: Novel missense variants in two Korean DFNA22 families.
        - name: c.IVS23+2321T>G (deep intronic splice-site)
          description: Deep intronic variant that inserts 108 bp of intron 23 into the mRNA and creates
            a premature stop, yet only 15-20% of the transcript is removed by nonsense-mediated decay,
            so an aberrant protein may be made.
        - name: c.2775G>C (p.Arg925Ser)
          description: Likely pathogenic missense variant in the single alpha helix region, found in an
            Argentine family with postlingual hearing loss. Human mutant RNA fails to fully rescue a zebrafish
            myo6b knockdown.
          clinical_significance: LIKELY_PATHOGENIC
        - name: c.[2377T>G;2382G>T] (p.[Trp793Gly;Lys794Asn]) in cis
          description: Two missense changes on one allele, segregating with early-onset severe progressive
            hearing loss in a Chinese family.
        - name: c.737A>G (p.His246Arg)
          description: Missense mutation associated with both sensorineural hearing loss and hypertrophic
            cardiomyopathy in a large kindred.
      selected_evidence:
        snippet: The evidence that pathogenic variants of human MYO3A, MYO6, MYO7A, MYO15A, MYH14 and
          MYH9 are associated with deafness ranges from moderate to definitive.
        supports: SUPPORT
