        context:
        - path: /pathophysiology/0
          value:
            name: Myosin VI Motor and Dosage Dysfunction
            biological_scale: MOLECULAR
            description: 'Pathogenic MYO6 variants alter the minus-end-directed myosin VI motor or its
              dosage. Truncating, splice-site and missense alleles are reported, and a motor-domain missense
              allele in the Tailchaser mouse lowers actin-activated ATPase activity and destroys coordination
              between the two heads of the dimer, which myosin VI needs to walk processively along, or
              anchor to, actin. A Belgian DFNA22 family with only a 1.5-1.8-fold overexpression of MYO6
              shows that hair cells are sensitive to too much as well as too little myosin VI, so the
              dominant disease is not explained by haploinsufficiency alone.

              '
            genes:
