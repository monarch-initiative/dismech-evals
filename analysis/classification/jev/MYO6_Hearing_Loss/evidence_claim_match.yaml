              motor. Pathogenic variants include missense mutations causing dominant progressive hearing
              loss (DFNA22), and frameshift, nonsense, and missense mutations causing recessive congenital
              deafness (DFNB37). Specific mutations such as H246R have been associated with both hearing
              loss and hypertrophic cardiomyopathy.
          role: ancestor
