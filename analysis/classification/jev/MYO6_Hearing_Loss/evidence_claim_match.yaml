  f9992a7a89f35ef14eef8a4c91dca049d9585713e8d23a842c1e8673c9b6e193:
    claim:
      about:
        disease:
          name: MYO6_Hearing_Loss
          disease_term:
            preferred_term: MYO6-related hearing loss
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Myosin VI Motor and Dosage Dysfunction
        biological_scale: MOLECULAR
        description: 'Pathogenic MYO6 variants alter the minus-end-directed myosin VI motor or its dosage.
          Truncating, splice-site and missense alleles are reported, and a motor-domain missense allele
          in the Tailchaser mouse lowers actin-activated ATPase activity and destroys coordination between
          the two heads of the dimer, which myosin VI needs to walk processively along, or anchor to,
          actin. A Belgian DFNA22 family with only a 1.5-1.8-fold overexpression of MYO6 shows that hair
          cells are sensitive to too much as well as too little myosin VI, so the dominant disease is
          not explained by haploinsufficiency alone.

          '
        genes:
        - preferred_term: MYO6
          term:
            id: hgnc:7605
            label: MYO6
        molecular_functions:
        - preferred_term: microfilament motor activity
          modifier: ABNORMAL
          term:
            id: GO:0000146
            label: microfilament motor activity
      selected_evidence:
        snippet: The actin-activated ATPase rates measured for the D179Y mutation are decreased, and indicate
          loss of coordination of the myosin VI heads or 'gating' in the dimer form.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18833301
      reference_title: A Myo6 mutation destroys coordination between the myosin heads, revealing new functions
        of myosin VI in the stereocilia of mammalian inner ear hair cells.
      evidence_source: IN_VITRO
      explanation: Biochemical analysis of the Tailchaser (D179Y) motor-domain allele shows a missense
        variant directly impairs myosin VI motor function.
