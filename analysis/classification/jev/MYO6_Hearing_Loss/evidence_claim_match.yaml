                label: microfilament motor activity
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Cardiac Involvement
        description: In a subset of dominant families, the myosin VI defect also affects the heart.
      selected_evidence:
        snippet: In mice and humans, loss of myosin VI (Myo6) function results in deafness, and certain
          Myo6 mutations also result in cardiomyopathies in humans.
        supports: SUPPORT
