      assertion:
        name: Stereocilia Dysfunction in Cochlear Hair Cells
        conforms_to: sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death
        description: 'MYO6 encodes myosin VI, the only known minus-end-directed actin-based motor protein.
          In cochlear hair cells, myosin VI is essential for anchoring the stereocilia plasma membrane
          to the actin core and for maintaining stereocilia structural integrity. Loss-of-function mutations
          lead to disorganized and malformed stereocilia, impairing mechanotransduction and causing sensorineural
          hearing loss.

          '
        genes:
        - preferred_term: MYO6
          term:
            id: hgnc:7605
            label: MYO6
        molecular_functions:
