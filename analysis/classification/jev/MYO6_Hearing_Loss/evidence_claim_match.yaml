          term:
            id: GO:0030036
            label: actin cytoskeleton organization
        - preferred_term: Endocytosis
          modifier: ABNORMAL
          term:
            id: GO:0006897
            label: endocytosis
      selected_evidence:
        snippet: In conclusion, the present data clearly showed that MYO6 is one of the genes to keep
          in mind with regard to ADSNHL, and the molecular characteristics of the identified gene variants
