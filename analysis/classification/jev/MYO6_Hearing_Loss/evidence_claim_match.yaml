        name: Stereocilia Dysfunction in Cochlear Hair Cells
        conforms_to: sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death
        biological_scale: CELLULAR
        description: 'MYO6 encodes myosin VI, the only known minus-end-directed actin-based motor protein.
          In cochlear hair cells, myosin VI is essential for anchoring the stereocilia plasma membrane
          to the actin core and for maintaining stereocilia structural integrity. Loss-of-function mutations
          lead to disorganized and malformed stereocilia, impairing mechanotransduction and causing sensorineural
          hearing loss. In the Myo6-null Snell''s waltzer mouse, bundles look normal at birth but stereocilia
          progressively fuse over the first postnatal week and giant stereocilia form by day 20, consistent
          with myosin VI anchoring the apical membrane to the cuticular plate. Patient-derived dominant
          variants shorten espin1-induced microvilli in cultured epithelial cells.

          '
        genes:
        - preferred_term: MYO6
          term:
            id: hgnc:7605
            label: MYO6
        molecular_functions:
        - preferred_term: microfilament motor activity
          term:
            id: GO:0000146
            label: microfilament motor activity
        cell_types:
        - preferred_term: Auditory hair cell
          term:
            id: CL:0000202
            label: auditory hair cell
        biological_processes:
        - preferred_term: Stereocilium maintenance
          modifier: DECREASED
          term:
            id: GO:0120045
            label: stereocilium maintenance
        - preferred_term: Actin cytoskeleton organization
          term:
            id: GO:0030036
            label: actin cytoskeleton organization
        - preferred_term: Endocytosis
          modifier: ABNORMAL
          term:
            id: GO:0006897
            label: endocytosis
      selected_evidence:
        snippet: In conclusion, the present data clearly showed that MYO6 is one of the genes to keep
          in mind with regard to ADSNHL, and the molecular characteristics of the identified gene variants
          suggest that a possible pathology seems to result from malformed stereocilia of the cochlear
          hair cells.
        supports: SUPPORT
