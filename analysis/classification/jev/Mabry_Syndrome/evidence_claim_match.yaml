      assertion_type: Pathophysiology
      assertion:
        name: Impaired Golgi GPI-Anchor Fatty-Acid Remodeling
        description: In the remodeling-arm subtypes (PGAP2, PGAP3), ER GPI assembly completes but Golgi
          fatty-acid remodeling of the attached anchor fails. The unremodeled lyso-GPI anchor cannot stably
          partition into membrane lipid rafts and becomes a substrate for phospholipases that release
          the attached protein. This arm converges on the same downstream nodes as the biosynthesis arm.
        genes:
        - preferred_term: PGAP2
          term:
            id: hgnc:17893
            label: PGAP2
        - preferred_term: PGAP3
          term:
            id: hgnc:23719
            label: PGAP3
        cellular_components:
        - preferred_term: Golgi membrane
          term:
            id: GO:0000139
            label: Golgi membrane
      selected_evidence:
        snippet: PGAP2 is involved in fatty-acid GPI-anchor remodeling, which occurs in the Golgi apparatus
