        description: High-dose oral pyridoxine (or pyridoxal-5-phosphate) restores the CNS cofactor pool
          depleted by circulating free alkaline phosphatase. It reduces seizure frequency in roughly a
          third to a half of patients but rarely achieves seizure freedom, with no established dose-response
          and occasional paradoxical worsening; chronic high-dose exposure carries a risk of sensory peripheral
          neuropathy.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: pyridoxine supplementation
          term:
            id: NCIT:C15433
            label: Nutritional Support
          therapeutic_agent:
