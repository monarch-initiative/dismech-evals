          pyridoxal 5'-phosphate, the active vitamin B6 vitamer and the cofactor for glutamate decarboxylase.
          CNS pyridoxal-5-phosphate falls, GABA synthesis falls, and a genetically fixed enzyme-trafficking
          defect thereby creates an acquired, nutritionally correctable cofactor deficiency in the brain.
        chemical_entities:
