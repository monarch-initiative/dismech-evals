      assertion_type: Discussion
      assertion:
        discussion_id: hmm_mabry_pigv341e_mouse
        prompt: How faithfully does the Pigv341E knock-in mouse model the human HPMRS phenotype, given
          that it inverts the social phenotype and leaves the defining biomarker unmeasured?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Neuronal GPI-Anchored-Protein-Dependent Synaptic Function
        rationale: The Pigv341E mouse faithfully recapitulates the neurologic core (motor deficits, seizure
          susceptibility, memory impairment, hippocampal synaptopathy), but shows ENHANCED rather than
          reduced sociability - opposite in valence to the human phenotype - and did not quantify alkaline
          phosphatase, so it does not validate the defining hyperphosphatasia biomarker. Facial dysmorphism,
          brachytelephalangy, Hirschsprung disease, and progressive cerebral/cerebellar atrophy are also
          not reproduced. Translational validity of the social-behavior and biomarker domains is therefore
          the open question.
        proposed_experiments:
        - experiment_id: exp_mabry_mouse_alp
          name: Serum ALP and cross-species behavioral validation in GPI-anchor-deficient mice
          description: Quantify serum tissue-nonspecific alkaline phosphatase and re-assess social behavior
            with standardized assays across Pigv341E and additional HPMRS-gene mouse lines to test whether
            the biomarker and social-domain mismatches are model-specific.
      selected_evidence:
        snippet: A CRISPR-Cas9-engineered mouse model for GPI-anchor deficiency mirrors human
        supports: SUPPORT
