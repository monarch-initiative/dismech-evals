            term:
              id: MONDO:0014863
              label: macrocephaly, dysmorphic facies, and psychomotor retardation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_herc1_null_allele_overgrowth_mechanism
        prompt: How do protein-null HERC1 alleles produce megalencephaly and somatic overgrowth, when
          loss of the ligase that degrades TSC2 is predicted to stabilize TSC2 and lower, not raise, mTORC1
          activity?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#HERC1 Protein Deficiency
        - pathophysiology#Dysregulated TSC2-mTORC1 Growth Signaling
        rationale: mTORC1 hyperactivation has been measured only in fibroblasts carrying the HECT-domain
          gain-of-function allele. The null-allele families share the overgrowth phenotype, but no study
          has measured TSC2 levels, mTORC1 activity, or autophagy in cells lacking HERC1, so the model
          that unites the two allele classes is an inference from the HERC1-TSC2 interaction.
        posed_by: dismech curation
        proposed_experiments:
        - experiment_id: herc1_null_fibroblast_mtorc1_starvation_assay
          name: TSC2 abundance, mTORC1 activity and autophagic flux in HERC1-null patient fibroblasts
          description: Repeat the nutrient-starvation assay used for the gain-of-function family in fibroblasts
            from a protein-null proband, measuring TSC2 protein, S6K1 and 4E-BP1 phosphorylation and LC3-II
            flux, against age-matched controls.
          would_support:
          - pathophysiology#Dysregulated TSC2-mTORC1 Growth Signaling
          - pathophysiology#Reduced Starvation-Induced Autophagy
          would_refute:
          - pathophysiology#Dysregulated TSC2-mTORC1 Growth Signaling
          - pathophysiology#Reduced Starvation-Induced Autophagy
          supporting_outcome:
          - Persistent mTORC1 activity and reduced autophagy under starvation in null cells, as in the
            gain-of-function cells.
          refuting_outcome:
          - Normal or reduced mTORC1 activity in null cells, indicating that null alleles reach overgrowth
            by a TSC2-independent route.
      selected_evidence:
        snippet: HERC1-TSC2 interaction destabilizes and degrades TSC2.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32921582
      reference_title: A new homozygous HERC1 gain-of-function variant in MDFPMR syndrome leads to mTORC1
        hyperactivation and reduced autophagy during cell catabolism.
      evidence_source: IN_VITRO
      explanation: The direction of the HERC1-TSC2 relationship that makes the null-allele mechanism puzzling.
