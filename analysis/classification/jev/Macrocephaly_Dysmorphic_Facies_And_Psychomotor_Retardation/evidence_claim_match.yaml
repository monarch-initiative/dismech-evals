        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HERC1 Protein Deficiency
        description: Homozygous nonsense, frameshift, and splice-site HERC1 variants trigger nonsense-mediated
          decay and abolish the giant HERC1 protein, as shown by complete absence of HERC1 in proband
          fibroblasts. HERC1 is a HECT-domain E3 ubiquitin ligase and an RCC1-like-domain guanine nucleotide
          exchange factor for ARF and Rab GTPases, so loss removes both activities.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genes:
        - preferred_term: HERC1
          term:
            id: hgnc:4867
            label: HERC1
        genetic_context:
          gene:
            preferred_term: HERC1
            term:
              id: hgnc:4867
              label: HERC1
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          allele_type: truncating (nonsense, frameshift, splice-site)
          functional_impact_category: LOSS_OF_FUNCTION
          description: Reported loss-of-function alleles include the nonsense variant c.9748C>T p.(Arg3250*),
            a splice-site variant that activates a cryptic site and introduces a premature stop, and the
            frameshift c.1280dup p.(Ile469Aspfs*33).
        molecular_functions:
        - preferred_term: ubiquitin protein ligase activity
          term:
            id: GO:0061630
            label: ubiquitin protein ligase activity
          modifier: DECREASED
        - preferred_term: guanyl-nucleotide exchange factor activity
          term:
            id: GO:0005085
            label: guanyl-nucleotide exchange factor activity
          modifier: DECREASED
        notes: 'No cell type is bound: the absence of HERC1 protein was measured in proband skin fibroblasts,
          which are the assay system rather than the cell in which the loss acts, and the germline null
          allele is present in every cell.'
      selected_evidence:
        snippet: Assessment of the primary skin fibroblast from the proband revealed complete absence
          of the HERC1 protein.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
