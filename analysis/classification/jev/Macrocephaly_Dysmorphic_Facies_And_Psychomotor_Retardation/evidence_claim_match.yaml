        discussion_id: mismatch_tambaleante_allele_direction
        prompt: Does the tambaleante mouse, whose allele accumulates mutant HERC1 and lowers mTOR activity,
          model the human disorder, in which alleles are protein nulls or a gain of function with mTORC1
          hyperactivation?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Autophagy-Associated Purkinje Cell Degeneration
        - pathophysiology#Presynaptic Vesicle Depletion and Impaired Synaptic Plasticity
        - pathophysiology#Reduced Starvation-Induced Autophagy
        - animal_models#Tambaleante mouse (Herc1 Gly483Glu homozygous)
        rationale: The mouse supplies all of the cellular neurobiology attributed to HERC1 (Purkinje cell
          autophagic death, presynaptic vesicle depletion, loss of LTP, learning deficits), yet its molecular
          signature runs in the opposite direction on the mTOR axis, it is not macrocephalic, and its
          growth is reduced. Which of its neuronal phenotypes transfer to a HERC1-null or gain-of-function
          brain is untested.
        posed_by: dismech curation
        proposed_experiments:
        - experiment_id: herc1_null_mouse_neurodevelopmental_phenotyping
          experiment_design: TARGETED_PERTURBATION
          name: Brain size, cortical architecture and learning in Herc1-knockout mice
          description: Phenotype the existing Herc1-knockout line for brain weight and cortical thickness,
            Purkinje cell counts across age, and hippocampal learning, to determine which tambaleante
            neuronal phenotypes are reproduced by a null allele.
          would_support:
          - pathophysiology#Autophagy-Associated Purkinje Cell Degeneration
          - pathophysiology#Presynaptic Vesicle Depletion and Impaired Synaptic Plasticity
          would_refute:
          - animal_models#Tambaleante mouse (Herc1 Gly483Glu homozygous)
          supporting_outcome:
          - Megalencephaly, Purkinje cell loss or learning deficits in null mice.
          refuting_outcome:
          - Normal brain size and learning in null mice, confining the tambaleante neuronal phenotype
            to its specific allele.
      selected_evidence:
        snippet: Histological and biochemical studies revealed extensive autophagy associated with an
          increase of the mutant protein level and a decrease of mTOR activity.
        supports: SUPPORT
