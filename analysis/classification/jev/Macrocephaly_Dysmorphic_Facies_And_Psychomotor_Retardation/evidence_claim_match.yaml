  bacddcb193d65b1efa3ecc964b5dab7b3d0c599ff476695659cc80f45d2b50e6:
    claim:
      about:
        disease:
          name: Macrocephaly, Dysmorphic Facies, and Psychomotor Retardation
          disease_term:
            preferred_term: Macrocephaly, dysmorphic facies, and psychomotor retardation
            term:
              id: MONDO:0014863
              label: macrocephaly, dysmorphic facies, and psychomotor retardation
        context: []
      assertion_type: Genetic
      assertion:
        name: HERC1
        association: Biallelic (homozygous) HERC1 variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: HERC1
          term:
            id: hgnc:4867
            label: HERC1
        inheritance:
        - name: Autosomal Recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        features: HERC1 (15q22.31) encodes a 4,861-residue, 532 kDa protein with one HECT domain and two
          RCC1-like domains. Reported disease alleles are homozygous nonsense, frameshift, and splice-site
          variants that abolish the protein, plus one homozygous HECT-domain missense variant with gain-of-function
          behaviour in fibroblasts.
        notes: ClinGen has not published a gene-disease validity classification for HERC1 and this disorder,
          so no gene_disease_validity assertion is recorded.
        variants:
        - name: c.9748C>T p.(Arg3250*)
          description: Homozygous nonsense variant in exon 49; proband fibroblasts lack HERC1 protein.
          type: nonsense
          clinical_significance: PATHOGENIC
        - name: c.14072G>C p.(Arg4691Pro)
          description: Homozygous HECT-domain missense variant in two sisters; gain of function in fibroblast
            starvation assays.
          type: missense
          clinical_significance: PATHOGENIC
        - name: c.1280dup p.(Ile469Aspfs*33)
          description: 'Homozygous frameshift variant classified as likely pathogenic in an Iranian boy
            who also carried a heterozygous PMP22 duplication. The published notation is internally inconsistent:
            the abstract and results give NM_003922.3:c.1280dup p.(Ile469Aspfs*33), while the same report
            elsewhere writes c.12804dup, p.4269Aspfs*33, and a predicted ~4300-residue truncated protein
            lacking the HECT domain. The cDNA position and the protein position do not agree under either
            spelling, so the variant is recorded under the abstract''s notation and should be re-derived
            from the transcript before reuse.'
          type: frameshift
          clinical_significance: LIKELY_PATHOGENIC
        - name: Homozygous splice-site variant (Indian sib pair)
          description: Activates an alternate splice site, creating a downstream stop codon with nonsense-mediated
            decay.
          type: splice-site
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Biallelic mutations in HERC1 were recently shown to cause a human phenotype with overgrowth
          and intellectual disability as main features.
        supports: SUPPORT
    origin:
