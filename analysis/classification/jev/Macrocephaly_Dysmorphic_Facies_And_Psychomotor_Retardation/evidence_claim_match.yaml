  4ee4d728f5f7dbdc43183c219a7a4e889fd6a3de54169c951ea4dbdd3f2b0d60:
    claim:
      about:
        disease:
          name: Macrocephaly, Dysmorphic Facies, and Psychomotor Retardation
          disease_term:
            preferred_term: Macrocephaly, dysmorphic facies, and psychomotor retardation
            term:
              id: MONDO:0014863
              label: macrocephaly, dysmorphic facies, and psychomotor retardation
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Tambaleante mouse (Herc1 Gly483Glu homozygous)
        species: Mouse
        genotype: Herc1 c.1448G>A p.Gly483Glu homozygous (tbl/tbl), spontaneous
        publication: PMID:20041218
        genes:
        - preferred_term: Herc1
          term:
            id: hgnc:4867
            label: HERC1
        description: A spontaneous recessive missense allele in the N-terminal RCC1-like domain that raises
          mutant HERC1 protein levels and lowers mTOR activity, causing autophagy-associated progressive
          Purkinje cell degeneration with ataxia from the second month, reduced growth and lifespan. Before
          Purkinje cell loss the mice already show impaired neuromuscular transmission, peripheral myelin
          abnormalities, fewer presynaptic vesicles, absent amygdalar LTP, and deficits in associative
          and spatial learning. Transgenic rescue with human HERC1 cDNA validated the locus.
        modeled_mechanisms:
        - target: Autophagy-Associated Purkinje Cell Degeneration
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: CELLULAR
          description: Reproduces progressive, autophagy-associated Purkinje cell loss, but through an
            allele whose molecular effect (protein accumulation, reduced mTOR, excess autophagy) is the
            reverse of the human gain-of-function family and different from the human null alleles.
          limitations: Gly483Glu is an RCC1-like-domain missense allele with increased protein and decreased
            mTOR activity, whereas human disease alleles are protein nulls or a HECT-domain gain of function
            with mTORC1 hyperactivation and reduced autophagy; the mouse is not macrocephalic and shows
            reduced rather than increased growth.
          divergences:
          - divergence_type: CAUSE_UNREPRESENTED
            materiality: QUALIFYING
            description: The human initiating lesions (complete loss of HERC1 protein, or a HECT-domain
              gain of function) are absent from the model; the tambaleante allele accumulates mutant protein
              and lowers mTOR activity, the opposite direction on the growth-signaling axis.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Mouse Purkinje cell loss begins in adult life and produces ataxia with reduced
              growth; the human disorder is a congenital overgrowth and neurodevelopmental syndrome in
              which cerebellar atrophy is reported in a single proband.
          readouts:
          - name: Cerebellar Purkinje cell number
            target: Autophagy-Associated Purkinje Cell Degeneration
            description: Histological count of Purkinje cells in homozygous mice over two months of age.
            direction: DECREASED
            interpretation: Progressive Purkinje cell loss is the structural correlate of the node.
        - target: Presynaptic Vesicle Depletion and Impaired Synaptic Plasticity
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: CELLULAR
          description: Supplies every presynaptic and plasticity measurement attributed to HERC1 (vesicle
            depletion, impaired evoked release, absent LTP, learning deficits), but through an allele
            that accumulates mutant protein rather than removing it or activating its ligase.
          limitations: The synaptic phenotypes are documented for Gly483Glu, an RCC1-like-domain allele
            with increased protein and decreased mTOR activity; whether neurons lacking HERC1, or carrying
            the HECT-domain gain of function, share them is untested, and no patient synaptic measurement
            exists.
          divergences:
          - divergence_type: CAUSE_UNREPRESENTED
            materiality: QUALIFYING
            description: Neither human initiating lesion (absent HERC1 protein, or a HECT-domain gain
              of function) is present; the tambaleante allele accumulates mutant HERC1.
          readouts:
          - name: Hippocampal learning performance
            target: Presynaptic Vesicle Depletion and Impaired Synaptic Plasticity
            description: Novel-object recognition, T-maze and Morris water maze performance in tbl mice
              versus littermates.
            direction: DECREASED
            interpretation: Learning deficits are the behavioral readout of the synaptic dysfunction attributed
              to HERC1.
          - name: Evoked neurotransmitter release at the neuromuscular junction
            target: Presynaptic Vesicle Depletion and Impaired Synaptic Plasticity
            description: In vivo neuromuscular activity and evoked release at postnatal day 30, before
              cerebellar degeneration.
            direction: DECREASED
            interpretation: A presynaptic release defect precedes neurodegeneration, pointing at a primary
              synaptic role of HERC1.
        - target: Reduced Starvation-Induced Autophagy
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: CELLULAR
          description: The mouse shows extensive autophagy with reduced mTOR activity, the reverse of
            the reduced autophagy and persistent mTORC1 activity measured in gain-of-function patient
            fibroblasts.
          limitations: The comparison is between mouse neurons in vivo and starved patient fibroblasts,
            and between an RCC1-like-domain allele and a HECT-domain allele; the human null alleles have
            been measured in neither setting.
          divergences:
          - divergence_type: CAUSE_UNREPRESENTED
            materiality: INVALIDATING
            description: The HECT-domain gain of function that drives the autophagy failure in patient
              cells is not present in the model, whose allele lowers mTOR activity and raises autophagy.
      selected_evidence:
        snippet: causing a Gly to Glu substitution (Gly483Glu) in the highly conserved N-terminal RCC1-like
          domain of the HERC1 protein
        supports: SUPPORT
