        description: Presynaptic terminals carrying mutant HERC1 have fewer synaptic vesicles and active
          zones, less clathrin, and more endosomes and autophagosomes; evoked neurotransmitter release
          at the neuromuscular junction is impaired before any neurodegeneration; glutamatergic input
          to the lateral amygdala and hippocampal CA1 is reduced, long-term potentiation is absent, and
          associative and spatial learning are deficient. All of this is documented in the tambaleante
          mouse; in patients the correlates are the constant intellectual disability and hypotonia, which
          have no human cellular measurement.
