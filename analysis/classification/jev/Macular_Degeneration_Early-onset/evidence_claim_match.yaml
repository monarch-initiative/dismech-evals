      assertion_type: Genetic
      assertion:
        name: FBN2
        association: Causal heterozygous variant
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: FBN2
          term:
            id: hgnc:3604
            label: FBN2
        notes: The causal claim rests on one two-generation family in which p.Glu1144Lys segregates with
          the maculopathy (four affected members exome-sequenced, two further affected and one unaffected
          member Sanger-sequenced), plus rare FBN2 variants of predicted but unmeasured effect among 192
