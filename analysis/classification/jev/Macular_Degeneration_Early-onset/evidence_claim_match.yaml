          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Outer Retinal Degeneration
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: In mice, reducing or blocking fibrillin-2 in the eye leads to retinal degeneration
          with thinning of the outer nuclear layer and reduced ERG amplitudes. The intermediate steps
          are not known. Both mouse studies report increased retinal TGF-beta when fibrillin-2 is lost,
          but whether that increase drives the degeneration has not been tested (see discussions).
      selected_evidence:
        snippet: our findings indicate that the intravitreous delivery of anti-FBN2 protein could induce
          retina degeneration in mice
        supports: SUPPORT
        directness: INDIRECT
