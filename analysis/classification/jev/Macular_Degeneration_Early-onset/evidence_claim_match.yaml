        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: eomd_fbn2_variant_mechanism
        kind: KNOWLEDGE_GAP
        prompt: How does a heterozygous FBN2 missense variant cause macular degeneration, and is the increase
          in retinal TGF-beta seen after fibrillin-2 loss in mice a cause of the degeneration or a bystander?
        attaches_to:
        - pathophysiology#FBN2 Heterozygous Missense Variant
        - pathophysiology#Bruch's Membrane Elastic Microfibril Dysfunction
        rationale: 'The human evidence is one family and variants of predicted effect, and the mechanism
          is inferred from fibrillin-2 localizing to Bruch''s membrane. Both mouse models remove or block
          fibrillin-2 rather than express a disease variant. They agree on TGF-beta: anti-FBN2 blockade
          raised retinal TGF-beta 1-3 alongside degeneration, and Fbn2 knockdown raised retinal TGF-beta1
          and LTBP-1 mRNA and protein, which fell again after recombinant fibrillin-2 rescue. Neither
          study blocked TGF-beta to test whether the increase causes the degeneration, neither measured
          Bruch''s membrane structure, and the abstract of the knockdown study describes the TGF-beta1
          and LTBP-1 change in the rescue arm as an increase, which its own Results contradict.'
        proposed_experiments:
        - experiment_id: eomd_fbn2_e1144k_microfibril_assembly
          name: Microfibril assembly by FBN2 p.Glu1144Lys
          description: Express wild-type and p.Glu1144Lys fibrillin-2 in RPE or fibroblast cultures and
            compare secretion, incorporation into microfibrils and LTBP binding.
          decision_criterion: Reduced secretion or microfibril incorporation of the variant, or a dominant-negative
            effect on wild-type assembly, would support the variant impairing Bruch's membrane microfibrils.
          would_support:
          - pathophysiology#FBN2 Heterozygous Missense Variant
      selected_evidence:
        snippet: the mRNA expression of endogenous of TGF-β1 and LTBP-1 was significantly higher in the
          eyes with the intravitreal injection of AAV-sh-fbn2
        supports: SUPPORT
