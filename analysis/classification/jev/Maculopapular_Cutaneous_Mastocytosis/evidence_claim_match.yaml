              label: maculopapular cutaneous mastocytosis
        context: []
      assertion_type: Genetic
      assertion:
        name: Somatic KIT Activating Mutations
        association: Somatic Driver Mutation
        notes: MPCM is a clonal disease caused by somatic activating mutations of KIT. In pediatric cutaneous
          disease the mutation spectrum is broad and frequently outside codon 816 (extracellular exon
          8/9 and juxtamembrane exon 11), in contrast to adult and systemic disease, which is dominated
          by the activation-loop mutation D816V (exon 17). Because D816V lies in the activation loop it
          is resistant to imatinib, whereas many non-codon-816 variants retain imatinib sensitivity, making
          the KIT genotype the decisive determinant of tyrosine-kinase-inhibitor selection.
        gene_term:
          preferred_term: KIT
          term:
            id: hgnc:6342
            label: KIT
      selected_evidence:
        snippet: KIT D816V mutation was detected in 34% of 215 tested patients.
        supports: SUPPORT
