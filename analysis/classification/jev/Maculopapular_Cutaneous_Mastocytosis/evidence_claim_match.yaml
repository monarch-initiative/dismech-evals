      assertion_type: Treatment
      assertion:
        name: KIT-Targeted Tyrosine Kinase Inhibitor (Genotype-Guided)
        description: 'KIT-targeted tyrosine kinase inhibitors are reserved for systemic or severe disease
          (see the distinct entry Systemic Mastocytosis), not typical skin-limited MPCM. Selection is
