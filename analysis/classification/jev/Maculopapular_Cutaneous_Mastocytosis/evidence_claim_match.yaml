  7b2c56daf20efddaef56d75b27b5cdbb156f3b5267e4abaa256b5ea51dd66bf4:
    claim:
      about:
        disease:
          name: Maculopapular Cutaneous Mastocytosis
          disease_term:
            preferred_term: maculopapular cutaneous mastocytosis
            term:
              id: MONDO:0019316
              label: maculopapular cutaneous mastocytosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mast Cell Mediator Release
        description: Mast cells degranulate and release preformed and newly synthesized mediators (histamine,
          tryptase, prostaglandins, leukotrienes, cytokines), most characteristically when lesions are
