  243e316915d2aa884b58294c1a5550e0f1f863089a0d8670e7519c1b0c903ea2:
    claim:
      about:
        disease:
          name: Maculopapular Cutaneous Mastocytosis
          disease_term:
            preferred_term: maculopapular cutaneous mastocytosis
            term:
              id: MONDO:0019316
              label: maculopapular cutaneous mastocytosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Constitutive KIT Activation in Skin Mast Cells
        description: MPCM is a clonal mast-cell disease driven by somatic gain-of-function mutations of
          KIT, the receptor tyrosine kinase for stem cell factor (CD117). The mutations render KIT constitutively
          active and ligand independent, driving downstream MAPK and PI3K/AKT pro-survival and proliferative
          signaling. Whereas adult and systemic disease is dominated by the activation-loop mutation D816V
          (exon 17), children with cutaneous disease carry a broader spectrum of activating KIT mutations,
          frequently outside codon 816 (e.g. extracellular exon 8/9 and juxtamembrane exon 11), which
          has direct therapeutic consequences because D816V is imatinib resistant while many non-codon-816
          variants are imatinib sensitive.
        gene:
          preferred_term: KIT
          term:
            id: hgnc:6342
            label: KIT
        cell_types:
        - preferred_term: skin mast cell
          term:
            id: CL:0000097
            label: mast cell
        molecular_functions:
        - preferred_term: transmembrane receptor protein tyrosine kinase activity
          term:
            id: GO:0004714
            label: transmembrane receptor protein tyrosine kinase activity
          modifier: INCREASED
        biological_processes:
        - preferred_term: KIT receptor tyrosine kinase signaling
          term:
            id: GO:0007169
            label: cell surface receptor protein tyrosine kinase signaling pathway
          modifier: INCREASED
        - preferred_term: MAPK cascade
          term:
            id: GO:0000165
            label: MAPK cascade
          modifier: INCREASED
        - preferred_term: PI3K/AKT signaling
          term:
            id: GO:0043491
            label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
          modifier: INCREASED
      selected_evidence:
        snippet: All mutations identified in this study were somatic and caused a constitutive activation
          of c-KIT.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
