        display_name: Monomorphic MPCM (small-lesion variant)
        description: Variant presenting with small, uniform maculopapular lesions, the morphology typically
          seen in adults. When it develops in children it often persists into adulthood and may indicate
          or associate with underlying systemic mastocytosis. Associated with higher serum tryptase, longer
          disease duration, and a less favorable prognosis than the polymorphic variant.
