  a81f673c7723cbb3ea2a05926eb872cc9f160ca389aca501958ebb5f52506fa2:
    claim:
      about:
        disease:
          name: Madras Motor Neuron Disease
          disease_term:
            preferred_term: Madras motor neuron disease
            term:
              id: MONDO:0015307
              label: Madras motor neuron disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Unknown Etiology with Negative Riboflavin-Transporter and C9ORF72 Genetics
        description: The cause of MMND remains unknown. Despite phenotypic overlap with Brown-Vialetto-Van
          Laere syndrome (BVVL), sequencing of the riboflavin transporter genes SLC52A1, SLC52A2 and SLC52A3
          in MMND probands and sporadic cases identified no defects, and C9ORF72 repeat expansions were
          absent (all repeats <10), establishing MMND as a distinct clinico-genetic subgroup. The authors
          propose that MMND may share a common defective biological pathway with BVVL arising from a combination
          of genetic and environmental factors. No specific causative gene is asserted here.
      selected_evidence:
        snippet: We sequenced the SLC52A1, SLC52A2 and SLC52A3 in affected probands and sporadic individuals
          from the MMND series as well as the C9ORF72 expansion. No genetic defects were identified and
          the C9ORF72 repeats were all less than 10.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24139842
      reference_title: Madras motor neuron disease (MMND) is distinct from the riboflavin transporter
