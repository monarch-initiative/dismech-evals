  b038d37f60525771017717c9c469ad91102395677abbb7cf94490a1fd2ffd31c:
    claim:
      about:
        disease:
          name: Majeed Syndrome
          disease_term:
            preferred_term: Majeed syndrome
            term:
              id: MONDO:0012316
              label: Majeed syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Lipin-2 Restraint on the NLRP3 Inflammasome
        biological_scale: CELLULAR
        description: Lipin-2 restrains the inflammasome at more than one point. It limits MAPK activation
          during priming, which controls pro-IL-1 beta synthesis, and it inhibits activation and sensitisation
          of the P2X7 receptor together with the potassium efflux, ASC oligomerisation and caspase-1 processing
          that follow. The P2X7 arm is cholesterol-dependent, which is how a lipid phosphatase ends up
          controlling an ion channel.
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        genes:
        - preferred_term: NLRP3
          term:
            id: hgnc:16400
            label: NLRP3
        - preferred_term: P2RX7
          term:
            id: hgnc:8537
            label: P2RX7
        biological_processes:
        - preferred_term: NLRP3 inflammasome complex assembly
          modifier: INCREASED
          term:
            id: GO:0044546
            label: NLRP3 inflammasome complex assembly
      selected_evidence:
        snippet: Lipin-2 also inhibits the activation and sensitization of the purinergic receptor P2X7
          and K+ efflux, apoptosis-associated speck-like protein with a CARD domain oligomerization, and
