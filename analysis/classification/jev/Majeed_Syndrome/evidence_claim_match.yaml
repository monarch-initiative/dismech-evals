            label: NLRP3 inflammasome complex assembly
      selected_evidence:
        snippet: Reduced levels of lipin-2 in macrophages lead to a decrease in cellular cholesterol levels.
          In fact, restoration of cholesterol concentrations in cells lacking lipin-2 decreases ion currents
          through the P2X7 receptor, and downstream events that drive IL-1β production.
        supports: SUPPORT
