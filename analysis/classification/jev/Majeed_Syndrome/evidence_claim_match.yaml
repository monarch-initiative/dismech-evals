      assertion:
        name: Widening phenotypic spectrum
        description: Early reports described severely affected children. As more families have been found,
          milder presentations have been recognised, so the original description is probably an ascertainment-biased
          extreme rather than the typical case.
      selected_evidence:
        snippet: The early descriptions of Majeed syndrome reported severely affected children with recurrent
          fevers, severe multifocal osteomyelitis, failure to thrive, and marked elevations of blood inflammatory
          markers. As more affected families have been identified, it has become clear that there is significant
          phenotypic variability.
        supports: SUPPORT
