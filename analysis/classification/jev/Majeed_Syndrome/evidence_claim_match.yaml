          during priming, which controls pro-IL-1 beta synthesis, and it inhibits activation and sensitisation
          of the P2X7 receptor together with the potassium efflux, ASC oligomerisation and caspase-1 processing
          that follow. The P2X7 arm is cholesterol-dependent, which is how a lipid phosphatase ends up
          controlling an ion channel.
        cell_types:
