        context: []
      assertion_type: Treatment
      assertion:
        name: Tumour Necrosis Factor Blockade
        therapeutic_modality: MONOCLONAL_ANTIBODY
        description: Recorded mainly because it failed. TNF-alpha was elevated in serum and etanercept
          produced no improvement in two siblings whose disease then responded to IL-1 blockade, which
          is what makes the IL-1 response mechanistically informative. The record is not uniformly negative.
          A child treated as juvenile idiopathic arthritis with adalimumab alongside an NSAID and methotrexate
          had fewer flares but incomplete control, and a 2025 review lists anti-TNF agents among the medications
          reported effective. The fair reading is little or partial benefit, well short of the IL-1 response.
        treatment_term:
          preferred_term: biological therapy
          term:
            id: NCIT:C15187
            label: Biological Therapy
          therapeutic_agent:
          - preferred_term: etanercept
            term:
              id: NCIT:C2381
              label: Etanercept
          - preferred_term: adalimumab
            term:
              id: NCIT:C65216
              label: Adalimumab
      selected_evidence:
        snippet: Both siblings had elevated proinflammatory cytokines in their serum, including tumour
          necrosis factor α (TNF-α), however a trial of the TNF inhibitor etanercept resulted in no improvement.
        supports: REFUTE
    origin:
