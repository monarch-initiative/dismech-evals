      assertion:
        name: Persistent postural-perceptual dizziness (PPPD)
        description: 'The closest mimic and the most important distinction. Both are chronic functional
          vestibular disorders, but the response to motion is opposite: MdDS symptoms transiently improve
          on re-exposure to passive motion, whereas PPPD is aggravated by motion and by complex visual
          environments. The non-motion-triggered presentation of oscillatory vertigo is where the two
          genuinely blur.'
