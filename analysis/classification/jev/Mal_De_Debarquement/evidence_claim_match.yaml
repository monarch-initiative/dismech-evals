            term:
              id: MONDO:0016217
              label: mal de Debarquement
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Velocity Storage Cross-Axis Maladaptation
        biological_scale: ORGANISM
        description: The core lesion. Velocity storage is the central vestibular integrator that prolongs
          the response to rotation well beyond the cupula's own time constant; roll-while-rotating conditioning
          maladapts the vestibulo-ocular reflex through it. The dependence on velocity storage is not
          assumed - in the monkey experiments the maladaptation appeared only in animals with long VOR
          time constants and not when the time constant approached the cupula's, which is what implicates
          the central integrator rather than the periphery. Modelled as a three-by-three dynamical system,
          normal upright orientation gives a diagonal system matrix whose yaw eigenvector aligns with
          gravity; in MdDS off-diagonal terms appear, representing cross-axis coupling and a misalignment
          between the yaw eigenvector and the head vertical, which is experienced as a directional pull.
          No GO term is bound here because none describes the vestibulo-ocular reflex.
      selected_evidence:
        snippet: A pull sensation of MdDS has been expressed with a system matrix with off-diagonal elements
          representing cross-axis coupling and interpreted as a misalignment between the yaw eigenvector
          and the head vertical.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41122084
      reference_title: Potential lesson from a model-based exploration on treatment effect heterogeneity
        of mal de débarquement syndrome.
      evidence_source: COMPUTATIONAL
      explanation: Formalizes the lesion as cross-axis coupling in the velocity-storage matrix. INDIRECT
        because it is a mathematical model of the mechanism, not a measurement of it.
