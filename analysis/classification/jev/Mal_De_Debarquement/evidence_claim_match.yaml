        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Prolonged Passive Oscillatory Motion Exposure
        biological_scale: ORGANISM
        description: 'The initiating exposure: hours of passive, periodic, oscillatory motion - a ship,
          aircraft, car or train, but also a swaying building, a waterbed or moving exercise equipment.
          What matters mechanistically is the oscillatory or periodic character of the stimulus coupled
          with a minimum duration on the order of hours, not the mode of transport. A concurrent physical
          or psychological stressor during the exposure is commonly reported, and perimenstrual or perimenopausal
          hormonal state at the time of exposure has been proposed as a risk factor. Notably the triggering
          journey is not otherwise remarkable - it need not involve seasickness or illness.'
      selected_evidence:
        snippet: The key features of the triggers are an oscillatory or periodic stimulus coupled with
          some minimal duration of exposure, generally on the order of hours.
        supports: SUPPORT
        directness: DIRECT
