        name: Repetitive Transcranial Magnetic Stimulation over Left DLPFC
        description: '10 Hz rTMS over the left dorsolateral prefrontal cortex, targeting the cortico-limbic
          node implicated by imaging rather than the vestibular lesion. A small double-blind sham-controlled
          crossover trial in eight women reported improvement in dizziness and in mood and anxiety persisting
          beyond the treatment period. Evidence is limited and the effect sizes modest: a scoping review
          of TMS across chronic vestibular disorders found statistically significant improvement on the
          Dizziness Handicap Inventory in a minority of studies (3 of 7) and no clinically significant
          improvement at all, with the authors cautioning that methodological limitations bear on how
          the results are read.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: Transcranial Magnetic Stimulation
          term:
            id: NCIT:C116655
            label: Transcranial Magnetic Stimulation
      selected_evidence:
        snippet: Our study provides evidence that the dizziness, mood and anxiety symptoms of MdDS can
          be improved with 10 Hz rTMS over left DLPFC beyond the treatment period in selected individuals
        supports: SUPPORT
        directness: DIRECT
