        context: []
      assertion_type: Treatment
      assertion:
        name: Vestibulo-Ocular Reflex Readaptation (Optokinetic Roll Protocol)
        description: 'The one disease-specific therapy, and the clearest test of the mechanism: the patient
          rolls the head side to side while viewing a rotating full-field visual stimulus, driving reflex
          adaptation in the direction opposite to the maladapted components. In the original series 17
          of 24 patients had complete or substantial recovery sustained about a year, six relapsed after
          initial benefit and one did not respond. Its rationale is not empirical - it was predicted from
          the velocity-storage account and then tested, so its success is itself evidence for the mechanism.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Rehabilitation
          term:
            id: NCIT:C15315
            label: Rehabilitation
      selected_evidence:
        snippet: Seventeen of the 24 subjects had a complete or substantial recovery on average for approximately
          1 year.
        supports: SUPPORT
        directness: DIRECT
