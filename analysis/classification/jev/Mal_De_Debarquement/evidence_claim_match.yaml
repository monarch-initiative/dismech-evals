      assertion:
        name: Functional Impairment and Secondary Affective Burden
        biological_scale: ORGANISM
        description: The clinical endpoint. Beyond the motion illusion itself, patients develop spatial
          disorientation, visual motion intolerance, chronic fatigue, impaired cognition, insomnia, and
          exacerbation of headache, anxiety and depression. Whether the affective symptoms are secondary
          to a relentless perceptual disturbance or share the limbic substrate is not resolved; the imaging
          studies covaried for mood and anxiety precisely because of that ambiguity.
      selected_evidence:
        snippet: Chronic fatigue, anxiety, and depression are frequently associated with primary symptoms.
        supports: SUPPORT
        directness: DIRECT
