      assertion:
        target: Velocity Storage Cross-Axis Maladaptation
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Reproduces the proposed lesion by applying the proposed cause, and the equivalent
          conditioning was subsequently produced in humans in rotating-room experiments, which bridges
          the species gap.
        limitations: 'The model reproduces the reflex maladaptation, not the disease: conditioned monkeys
          are not reported to develop a persistent self-motion percept, and the perceptual and limbic
          components of MdDS have no counterpart here. What it models is the initiating vestibular lesion
          alone.'
        readouts:
