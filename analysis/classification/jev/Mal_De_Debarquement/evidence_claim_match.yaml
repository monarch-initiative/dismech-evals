      assertion_type: Discussion
      assertion:
        discussion_id: mdds_non_motion_triggered_variant
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Prolonged Passive Oscillatory Motion Exposure
        - differential_diagnoses#Persistent postural-perceptual dizziness (PPPD)
        prompt: Is motion-moderated oscillatory vertigo without a motion trigger the same disease as motion-triggered
          MdDS, a variant of PPPD, or a third entity?
        rationale: 'The consensus criteria require onset within 48 hours of passive motion, yet the same
          committee records an otherwise indistinguishable presentation arising with no motion trigger
          - typically after another vestibular disorder, a medical illness, psychological stress or metabolic
          disturbance - and states that its terminology has varied because it has features of both MdDS
          and PPPD. This is not a naming quibble: the entire mechanistic account in this entry begins
          with an oscillatory conditioning stimulus, so a presentation without one either reaches the
          same velocity-storage state by another route or is a different disease wearing the same symptoms.
          The entry curates the motion-triggered form, which is what the criteria define, and does not
          silently extend its mechanism to the non-triggered presentation. Resolving this needs the phenomenological
          and mechanistic comparison the committee itself calls for.'
      selected_evidence:
        snippet: Terminology for this non-motion triggered presentation has been varied as it has features
          of both MdDS and PPPD.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
