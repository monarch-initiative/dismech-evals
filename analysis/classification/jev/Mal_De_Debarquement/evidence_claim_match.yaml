        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Limbic-Vestibular Network Reorganization
        biological_scale: TISSUE
        description: Downstream of the maladapted reflex, functional imaging shows a limbic focus of hypermetabolism
          in the left entorhinal cortex and amygdala, increased functional connectivity from that focus
          to posterior visual and vestibular processing areas including motion-sensitive MT/V5, and reduced
          connectivity to frontal and temporal cortices. Resting-state EEG frames the same state as entrainment
          to oscillating motion, with treatment response tracking inter-regional alpha-band phase coherence.
          This is a network-level dysrhythmia rather than a focal lesion, which is consistent with structural
          imaging being normal.
      selected_evidence:
        snippet: MdDS subjects showed increased metabolism in the left entorhinal cortex and amygdala
          (z>3.3).
        supports: SUPPORT
        directness: DIRECT
