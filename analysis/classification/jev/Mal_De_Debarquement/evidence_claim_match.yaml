      assertion_type: Definition
      assertion:
        name: Bárány Society diagnostic criteria for MdDS
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'The International Classification of Vestibular Disorders case definition. Criteria
          A-D must all be met and E excludes better explanations: (A) non-spinning vertigo of oscillatory
          character, continuous or most of the day; (B) onset within 48 hours of the end of passive motion
          exposure; (C) temporary reduction of symptoms on re-exposure to passive motion; (D) duration
          beyond 48 hours; (E) not better accounted for by another disorder. Criterion C is the discriminating
          one - it is what separates MdDS from the disorders it most resembles.'
      selected_evidence:
        snippet: 1] Non-spinning vertigo characterized by an oscillatory perception ('rocking,' 'bobbing,'
          or 'swaying') present continuously or for most of the day; 2] Onset occurs within 48 hours after
          the end of exposure to passive motion, 3] Symptoms temporarily reduce with exposure to passive
          motion (e.g. driving), and 4] Symptoms persist for >48 hours.
        supports: SUPPORT
        directness: DIRECT
