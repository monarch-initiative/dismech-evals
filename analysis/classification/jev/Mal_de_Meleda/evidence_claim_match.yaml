      assertion:
        target: Cutaneous Inflammation with TNF-alpha Excess
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: SLURP-1 cholinergic signalling is proposed to inhibit TNF-alpha release, so its loss
          is linked to the inflammatory component of the disease.
      selected_evidence:
        snippet: These results identify SLURP-1 as a secreted epidermal neuromodulator which is likely
