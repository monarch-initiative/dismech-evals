          value:
            name: Loss of SLURP1 Modulation of Keratinocyte Alpha7 Nicotinic Acetylcholine Receptors
            description: SLURP1 is an auto/paracrine cholinergic peptide that binds alpha7 nicotinic acetylcholine
              receptors on keratinocytes. Early studies with fusion constructs described it as a potentiator
              or allosteric agonist of these receptors, while a recombinant protein closer to the native
              sequence acted as a non-competitive allosteric antagonist; both lines of work agree that
              SLURP1 signalling through alpha7 receptors restrains keratinocyte growth. In Mal de Meleda
              this receptor-mediated signal is lost.
            biological_scale: CELLULAR
            cell_types:
            - preferred_term: keratinocyte
              term:
                id: CL:0000312
                label: keratinocyte
            biological_processes:
            - preferred_term: acetylcholine receptor signaling pathway
              term:
