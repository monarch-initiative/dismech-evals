        description: 'The accepted explanation for why loss of the penultimate enzyme of tyrosine catabolism
          is benign while loss of the final one is lethal. Glutathione binds maleylacetoacetate spontaneously
          and can isomerise it to fumarylacetoacetate without the enzyme, slowly but fast enough at the
          millimolar hepatic glutathione concentrations found in vivo. The bypass was shown directly in
          vitro, and inferred in vivo from Maai/Fah double-mutant mice, which die of a fumarylacetoacetate-driven
          phenotype that could only have arisen if maleylacetoacetate reached fumarylacetoacetate in the
          absence of the enzyme.

          '
      selected_evidence:
        snippet: A glutathione-mediated isomerization of MAA to FAA independent of MAAI enzyme was demonstrated
          in vitro. This nonenzymatic bypass is likely responsible for the lack of a phenotype in nonstressed
          MAAI mutant mice.
        supports: SUPPORT
