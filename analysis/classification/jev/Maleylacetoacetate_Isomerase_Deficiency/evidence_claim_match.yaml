        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: bypass_saturation_toxicity
        hypothesis_label: The bypass is saturable, so substrate overload or glutathione depletion should
          be toxic
        status: EMERGING
        description: 'A conditional-toxicity model derived entirely from the mouse. Because the non-enzymatic
          reaction is slow, it should fail when maleylacetoacetate production is raised or when glutathione
          is consumed — and in mice it does, producing hepatic and renal necrosis, leucopenia and death.
          Curated as EMERGING rather than CANONICAL because no human has been reported in that stressed
          state: the only long-term human observations are of unrestricted ordinary diets, which the mouse
          data would not predict to be dangerous either. The model is what motivates the standing advice
          to avoid protein supplements, dichloroacetate and glutathione-depleting drugs, so it is currently
          doing clinical work on animal evidence alone.

          '
      selected_evidence:
        snippet: A complete redundancy of MAAI could be ruled out because substrate overload of the tyrosine
          catabolic pathway (administration of homogentisic acid, phenylalanine, or tyrosine) resulted
          in renal and hepatic damage.
        supports: SUPPORT
