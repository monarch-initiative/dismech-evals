              least 22 months on standard chow with normal weight, fertility and histology and no tumours
              — while excreting fumarylacetoacetate and succinylacetone in urine. That combination is
              the human phenotype in miniature and is what makes the model unusually informative here.
              Under phenylalanine, tyrosine or homogentisic acid loading, a high-protein bean-and-lentil
              diet, or pharmacological glutathione depletion, the same animals develop hepatic necrosis
              and steatosis, renal epithelial vacuolisation, apoptosis and necrosis, and die; nitisinone
              prevents it.

