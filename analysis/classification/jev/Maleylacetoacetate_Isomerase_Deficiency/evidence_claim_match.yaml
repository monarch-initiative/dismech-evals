              label: maleylacetoacetate isomerase deficiency
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide, published case literature
        measure_type: CASES_IN_LITERATURE
        prevalence_class: BELOW_1_IN_1000000
        notes: 'No population-based rate has been established. As of the 2025 review, fewer than 20 people
          with MAAI deficiency had been reported, clinical follow-up was available for nine, and biallelic
          GSTZ1 variants had been confirmed in only eight. The band is recorded as the coarse ultra-rare
          tier on that published-case basis, not from a measured rate. Ascertainment is almost entirely
          through succinylacetone-based newborn screening, so the reported count is a lower bound on an
          unknown true frequency: individuals whose screening succinylacetone falls below the local cut-off
          — as it did in the 32-year-old homozygous father, whose dried-blood-spot value was within the
          reference range — are invisible to that route entirely.

          '
      selected_evidence:
        snippet: Less than 20 people with MAAID have been reported, with clinical follow-up only available
          for 9 of them; among these, bi-allelic variants in the GSTZ1 gene were identified in only eight
          individuals
        supports: SUPPORT
