  0560f7806290c94dd4df8d817178de1be225b9804e1354227978b3b59379133e:
    claim:
      about:
        disease:
          name: Maleylacetoacetate Isomerase Deficiency
          disease_term:
            preferred_term: maleylacetoacetate isomerase deficiency
            term:
              id: MONDO:0060527
              label: maleylacetoacetate isomerase deficiency
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: LOW
        rationale: 'No molecularly confirmed individual has developed disease. The Québec series of six
          went untreated with a normal course to 13 years; a German homozygote reached 32 years on an
          unrestricted diet including dairy and meat with normal liver and kidney chemistry; two Italian
          infants were well at 2 and 4 years, one of them after nitisinone and dietary restriction were
          withdrawn without consequence. The real burden is iatrogenic and informational rather than pathophysiological:
          a positive newborn screen for a lethal treatable disease, an interval of unnecessary nitisinone
          and protein restriction while tyrosinemia type 1 is excluded, and a lifelong surveillance recommendation
          whose necessity is unestablished. Recorded LOW rather than UNKNOWN because the observed burden
          across every confirmed case is genuinely low; the residual uncertainty about lifelong metabolite
          exposure is carried by a knowledge-gap discussion instead.

          '
      selected_evidence:
        snippet: The six individuals with mild hypersuccinylacetonaemia (MHSA) were not treated with diet
          or nitisinone. Their clinical course has been normal for up to 13 years.
        supports: SUPPORT
    origin:
      assertion_path: /clinical_burden
      evidence_path: /clinical_burden/evidence/0
      context_paths:
