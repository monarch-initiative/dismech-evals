      assertion_type: ProgressionInfo
      assertion:
        phase: Diagnostic interval
        age_range: Weeks to months after screening
        notes: 'Until tyrosinemia type 1 is excluded, some infants are started on nitisinone and a tyrosine-
          and phenylalanine-restricted diet. In the reported Italian case this ran to 21 months before
          GSTZ1 sequencing allowed withdrawal. Succinylacetone in dried blood spots falls into the reference
          range on treatment and rises modestly again afterwards, without any accompanying change in tyrosine,
          transaminases, bilirubin, coagulation or renal parameters — so the treatment moves the marker
          without evidence of moving anything else.

          '
      selected_evidence:
        snippet: Case 1 showed intermittent SA elevation; Nitisinone and dietary treatment were started,
          then discontinued after the identification of two variants in the GSTZ1 gene and the definitive
          diagnosis of MAAID.
        supports: SUPPORT
