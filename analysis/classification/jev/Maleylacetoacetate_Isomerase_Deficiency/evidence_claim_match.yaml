  a18cbe533b1e2f34d6814faf7723e4aed0a250e6c94e6689530a6d40eb8f32e1:
    claim:
      about:
        disease:
          name: Maleylacetoacetate Isomerase Deficiency
          disease_term:
            preferred_term: maleylacetoacetate isomerase deficiency
            term:
              id: MONDO:0060527
              label: maleylacetoacetate isomerase deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: maai_lifelong_succinylacetone_exposure_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Succinylacetone has been characterised as an oncometabolite in GSTZ1-deficient hepatocellular
          carcinoma models. Is decades of mild, intermittent succinylacetone exposure in constitutional
          maleylacetoacetate isomerase deficiency genuinely inert, and does the surveillance recommendation
          have any evidential basis?

          '
        rationale: 'Every human observation to date says the disorder is benign, and every observation
          to date is short. Only four individuals have longitudinal follow-up, the longest to 32 years,
          in a condition whose plausible harm — hepatocellular carcinoma — is a late outcome. Meanwhile,
          somatic GSTZ1-1 loss in hepatocellular carcinoma drives NRF2 activation through succinylacetone-mediated
          alkylation of KEAP1 and is described as tumour-promoting, and the same review that argues against
          treating this disorder notes that these cancer observations would argue for lowering succinylacetone.
          The two literatures have not been reconciled, and the difference between them may simply be
          somatic loss in a transformed hepatocyte versus lifelong constitutional loss with an intact
          bypass — but that is a hypothesis, not a finding. Concretely: the imaging surveillance now recommended
          has no reported yield, and no cohort large or old enough to estimate one exists.

          '
        attaches_to:
        - pathophysiology#Escape of succinylacetone and maleic acid into blood and urine
        - treatments#Withholding nitisinone and dietary tyrosine restriction, with structured surveillance
        proposed_experiments:
        - experiment_id: exp_maai_international_registry_longitudinal_outcome
          name: International registry of molecularly confirmed cases with standardised long-term outcome
            capture
          description: 'Pooling of confirmed GSTZ1 cases across newborn screening programmes with a common
            minimum dataset — periodic transaminases, alpha-fetoprotein, hepatic imaging and time-integrated
            succinylacetone — carried into adult life, since no single centre has enough cases to answer
            the question.

            '
          decision_criterion: 'Any excess of hepatic nodules, alpha-fetoprotein elevation or hepatocellular
            carcinoma over an age-matched expectation would justify the current surveillance and reopen
            the case for lowering succinylacetone. Event-free ageing across a registry-scale cohort would
            support de-escalating surveillance to reassurance.

            '
      selected_evidence:
        snippet: Mechanistically, GSTZ1-1 deficiency led to succinylacetone accumulation, alkylation modification
          of KEAP1, and NRF2 activation, thus promoting IGF1R transcription by recruiting SP1 to its promoter.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
