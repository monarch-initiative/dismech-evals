        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bypass saturation under substrate overload or glutathione depletion
        biological_scale: MOLECULAR
        description: 'A conditional state, established only in the mouse, in which the chemical rescue
          fails. It is reached by raising flux into the blocked step (homogentisic acid, phenylalanine
          or tyrosine loading, or simply a bean-and-lentil high-protein diet) or by consuming the co-substrate
          (diethylmaleate or phorone, and by extension glutathione-depleting drugs such as acetaminophen).
          Free maleylacetoacetate then accumulates. No human has been reported in this state, and the
          ordinary unrestricted human diets under which affected people have remained well are not obviously
          equivalent to any of the murine loading protocols — so this node is a prediction about humans,
          not an observation of them.

          '
        chemical_entities:
        - preferred_term: 4-maleylacetoacetate
          term:
            id: CHEBI:17105
            label: 4-maleylacetoacetate
          modifier: INCREASED
        - preferred_term: glutathione
          term:
            id: CHEBI:16856
            label: glutathione
          modifier: DECREASED
      selected_evidence:
        snippet: Therefore, MAAI deficiency may manifest itself as hypersensitivity to GSH-depleting drugs,
          such as acetaminophen.
        supports: SUPPORT
        directness: INDIRECT
