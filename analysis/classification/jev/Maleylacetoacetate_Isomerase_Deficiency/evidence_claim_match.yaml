        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: maai_unconfirmed_fatal_case
        kind: CONTROVERSY
        status: OPEN
        prompt: 'A historical patient attributed to maleylacetoacetate isomerase deficiency died of hepatic
          and renal failure but was never molecularly confirmed. Should that case be counted when describing
          the phenotypic spectrum, or excluded as a probable misdiagnosis?

          '
        rationale: 'It matters because it is the only human report inconsistent with a benign course,
          and because the reasoning is circular in both directions. Excluding it on the grounds that confirmed
          cases are benign assumes the conclusion; including it risks importing a case that, on today''s
          differential, could equally have been tyrosinemia type 1 or partial fumarylacetoacetate hydrolase
          deficiency — both of which were unavailable as diagnoses at the time and both of which produce
          the same succinylacetone elevation. This entry describes the disorder from molecularly confirmed
          cases only and records the unconfirmed case here rather than in the burden assessment, but that
          is a curation choice with consequences: it is what licenses the LOW burden level, and a single
          confirmed severe case would overturn it.

          '
        attaches_to:
        - clinical_burden#
      selected_evidence:
        snippet: While Berger et al. described one patient showing fatal hepatic and renal failure, for
          whom molecular confirmation was not available
        supports: SUPPORT
