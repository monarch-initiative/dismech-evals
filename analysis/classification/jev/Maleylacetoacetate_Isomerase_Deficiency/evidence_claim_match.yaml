  bf242427f87a61a68a80f782fb99a8c6a231c79ab8c9db662649874a4bd7b4b7:
    claim:
      about:
        disease:
          name: Maleylacetoacetate Isomerase Deficiency
          disease_term:
            preferred_term: maleylacetoacetate isomerase deficiency
            term:
              id: MONDO:0060527
              label: maleylacetoacetate isomerase deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: maai_bypass_saturation_no_human_counterpart
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: 'Gstz1-null mice die of hepatic and renal necrosis on a high-protein diet of beans and
          lentils, yet a homozygous human adult ate an unrestricted diet including dairy and meat for
          32 years without a single episode of hepatic decompensation. Does the murine substrate-overload
          arm describe a real human vulnerability at all, and if so at what exposure?

          '
        rationale: 'This is not an absence of evidence but a conflict between evidence in a model and
          evidence in humans, which is why it is curated as a model mismatch rather than a knowledge gap.
          The mouse result is robust and internally controlled — the injury is prevented by nitisinone,
          so it is genuinely flux-driven — and it is the sole mechanistic basis for the standing advice
          to avoid protein supplements, dichloroacetate and glutathione-depleting drugs. But the murine
          loading protocols are extreme relative to human intake, mouse chow is unusually low in phenylalanine
          and tyrosine so the baseline is not the human baseline, and mouse survival on high phenylalanine
          varied by sex and strain by an order of magnitude, which points to modifiers that have no human
          counterpart mapped. The strain effect reaches the baseline as well as the challenge: a second,
          independently derived null on BALB/c has hepatomegaly, renomegaly, splenic atrophy and multifocal
          hepatitis on ordinary chow, where the line that is healthy for 22 months has none of it. So
          the murine arm does not speak with one voice about what an unstressed null looks like, and its
          human extrapolation inherits that. Two readings remain open: either humans sit permanently below
          the saturation threshold under any realistic diet, or the threshold exists and no ascertained
          individual has yet crossed it. The nine people with clinical follow-up are far too few to distinguish
          these.

          '
        attaches_to:
        - pathophysiology#Bypass saturation under substrate overload or glutathione depletion
        - pathophysiology#Hepatorenal injury and leucopenia in the saturated state
        proposed_experiments:
        - experiment_id: exp_maai_glutathione_stress_challenge
          name: Prospective biochemical monitoring of confirmed cases through glutathione-depleting exposures
          description: 'Register-based prospective collection of paired succinylacetone, maleic acid,
            transaminase, creatinine and tubular-function measurements in molecularly confirmed individuals
            before and during naturally occurring glutathione-depleting exposures — therapeutic acetaminophen
            courses, febrile intercurrent illness, high-protein dietary periods — rather than any deliberate
            challenge.

            '
          decision_criterion: 'A reproducible rise in succinylacetone or maleic acid with concurrent tubular
            or hepatic markers during such exposures would establish that the murine saturation threshold
            is reachable in humans and would convert the avoidance advice from prediction to evidence.
            Stable metabolites and normal organ markers across the exposure range would argue that human
            glutathione turnover keeps the bypass unsaturated and that the advice is precautionary only.

            '
      selected_evidence:
        snippet: Humans, at least in developed countries, are unlikely to experience nutritional stress
          severe enough to be affected by MAAI deficiency if this gene defect exists in the human population.
        supports: SUPPORT
