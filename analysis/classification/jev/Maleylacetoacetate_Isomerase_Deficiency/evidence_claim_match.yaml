          node where the disorder diverges from tyrosinemia type 1: at a matched plasma succinylacetone
          concentration, the predicted intracellular profile here is high maleylacetoacetate with low
          fumarylacetoacetate, whereas fumarylacetoacetate hydrolase deficiency predicts the reverse.
          Since fumarylacetoacetate is the strongly electrophilic species held responsible for hepatocyte
          and tubular injury in tyrosinemia type 1, the swap of which intermediate accumulates is the
          leading account of why the two disorders share a marker but not a phenotype. Note this is an
          inference from pathway position, not a measurement: neither intermediate is stable enough to
          have been quantified in human tyrosinemic liver.

          '
