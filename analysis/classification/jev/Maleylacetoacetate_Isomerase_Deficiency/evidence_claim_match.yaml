  f28d0324a76c4e77aebc8fcb05eda3cdc656725d20f60decded631f45bf3d5cf:
    claim:
      about:
        disease:
          name: Maleylacetoacetate Isomerase Deficiency
          disease_term:
            preferred_term: maleylacetoacetate isomerase deficiency
            term:
              id: MONDO:0060527
              label: maleylacetoacetate isomerase deficiency
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Maai/Fah double-mutant mouse
        species: Mouse
        genotype: Maai (Gstz1) and Fah double homozygous null
        publication: PMID:12052898
        genes:
        - preferred_term: GSTZ1
          term:
            id: hgnc:4643
            label: GSTZ1
        description: 'A genetic test of the bypass rather than a model of the disease. If maleylacetoacetate
          could not reach fumarylacetoacetate without the enzyme, removing fumarylacetoacetate hydrolase
          as well should have been harmless or protective; instead the double mutants died within about
          a week of nitisinone withdrawal, with severe liver and kidney injury and a marked creatinine
          rise and acute renal necrosis not seen in Fah-null animals. That is the strongest in vivo evidence
          that the non-enzymatic bypass operates, and it simultaneously shows that maleylacetoacetate
          deficiency generates a toxic species distinct from the fumarylacetoacetate of tyrosinemia type
          1.

          '
        modeled_mechanisms:
        - target: Glutathione-dependent non-enzymatic isomerisation to fumarylacetoacetate
          relationship: PERTURBS
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Removing the downstream hydrolase converts the products of the bypass into a lethal
            readout, so the double mutant reports on whether the bypass is carrying flux.
          limitations: The genotype has no human counterpart — no person carries biallelic null alleles
            at both loci — so this model speaks only to the existence of the bypass and not to any human
            phenotype. Its severe renal necrosis is evidence about maleylacetoacetate toxicity in a doubly
            blocked pathway, and must not be read as a prediction for constitutional GSTZ1 deficiency,
            where the hydrolase is intact.
          readouts:
          - name: Plasma creatinine and renal histology in double mutants
            target: Glutathione-dependent non-enzymatic isomerisation to fumarylacetoacetate
            description: Blood chemistry and kidney histopathology in Maai/Fah double mutants compared
              with Fah single mutants after nitisinone withdrawal.
            direction: INCREASED
            interpretation: Renal injury exceeding that of Fah-null animals shows the double mutant accumulates
              something the single mutant does not, which is the signature of maleylacetoacetate rather
              than fumarylacetoacetate.
      selected_evidence:
        snippet: Mice doubly mutant for MAAI and fumarylacetoacetate hydrolase (FAH) died rapidly on a
          normal diet, indicating that MAA could be isomerized to FAA in the absence of MAAI.
        supports: SUPPORT
