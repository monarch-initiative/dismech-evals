            term:
              id: MONDO:0060527
              label: maleylacetoacetate isomerase deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Withholding nitisinone and dietary tyrosine restriction, with structured surveillance
        description: 'The management decision in this disorder is a decision not to treat. Every reported
          cohort has been managed without nitisinone or protein restriction, or has had both withdrawn
          once GSTZ1 variants were found, with no clinical or biochemical deterioration afterwards. What
          replaces treatment is surveillance — regular clinical, biochemical and imaging review — plus
          advice to seek evaluation of liver function and clotting during severe intercurrent illness.
          Note the asymmetry that makes this hard in practice: withholding is correct only once tyrosinemia
          type 1 has been excluded, and until then the cost of treating unnecessarily is much lower than
          the cost of not treating tyrosinemia type 1.

          '
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: clinical and biochemical surveillance without disease-directed therapy
      selected_evidence:
        snippet: we suggest regular clinical, biochemical and imaging surveillance in MAAID.
        supports: SUPPORT
