          contain no alternative isomerase, so the rescue is chemical rather than enzymatic. The strongest
          in vivo argument is the Maai/Fah double mutant, which dies of a fumarylacetoacetate-driven phenotype
          that could not exist unless maleylacetoacetate still reached fumarylacetoacetate without the
