        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Trigger-dependent RyR1 calcium dysregulation
        description: Triggering anesthetics or succinylcholine expose a latent defect in skeletal-muscle
          excitation-contraction coupling. In most genetically resolved cases this involves RYR1, with
          CACNA1S contributing a smaller fraction and STAC3 relevant mainly in biallelic syndromic myopathy.
          The affected channel complex permits uncontrolled myoplasmic calcium rise.
        genes:
        - preferred_term: RYR1
          term:
            id: hgnc:10483
            label: RYR1
        - preferred_term: CACNA1S
          term:
            id: hgnc:1397
            label: CACNA1S
        - preferred_term: STAC3
          term:
            id: hgnc:28423
            label: STAC3
        cell_types:
        - preferred_term: skeletal muscle cell
          term:
            id: CL:0000188
            label: cell of skeletal muscle
        biological_processes:
        - preferred_term: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
          term:
            id: GO:0014808
            label: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
          modifier: INCREASED
        - preferred_term: regulation of skeletal muscle contraction by calcium ion signaling
          term:
            id: GO:0014722
            label: regulation of skeletal muscle contraction by calcium ion signaling
          modifier: DYSREGULATED
        - preferred_term: calcium ion transport
          term:
            id: GO:0006816
            label: calcium ion transport
          modifier: DYSREGULATED
        - preferred_term: calcium ion homeostasis
          term:
            id: GO:0055074
            label: calcium ion homeostasis
          modifier: DYSREGULATED
        molecular_functions:
        - preferred_term: calcium channel activity
          term:
            id: GO:0005262
            label: calcium channel activity
          modifier: DYSREGULATED
        cellular_components:
        - preferred_term: sarcoplasmic reticulum
          term:
            id: GO:0016529
            label: sarcoplasmic reticulum
        locations:
        - preferred_term: skeletal muscle tissue
          term:
            id: UBERON:0001134
            label: skeletal muscle tissue
      selected_evidence:
        snippet: Uncontrolled rise of myoplasmic calcium, which activates biochemical processes related
          to muscle activation leads to the pathophysiologic changes. In most cases, the syndrome is caused
          by a defect in the ryanodine receptor.
        supports: SUPPORT
