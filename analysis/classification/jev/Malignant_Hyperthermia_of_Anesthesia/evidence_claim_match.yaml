  0e814b89c82119e84cb38b700c3a51ca6e24418acf3ff10558b2cfb37078a7ed:
    claim:
      about:
        disease:
          name: Malignant hyperthermia of anesthesia
          disease_term:
            preferred_term: malignant hyperthermia of anesthesia
            term:
              id: MONDO:0018493
              label: malignant hyperthermia of anesthesia
        context: []
      assertion_type: Definition
      assertion:
        name: Peri-anesthetic MH-reaction case-finding query for latent RYR1/CACNA1S susceptibility carriers
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: ESTABLISHED_CRITERIA
        validation_status:
          status: UNVALIDATED
          rationale: 'MH susceptibility is a textbook latent trait — carriers are asymptomatic until a
            triggering anesthetic exposure, and 50->70% of those who have an MH reaction carry a pathogenic
            RYR1/CACNA1S variant — so a peri-anesthetic reaction is a strongly enriching case-finding
            signal. The mechanism and trigger are established (derivation_basis: ESTABLISHED_CRITERIA),
            but this specific computable EHR phenotype has not been evaluated against a genotyped/contracture-tested
            gold standard for PPV/yield. Natural validation substrate: genotype-linked EHR biobanks (eMERGE,
            All of Us) or a linked anesthesia/MH registry (e.g. NAMHR/MHAUS).'
        attaches_to:
        - pathophysiology#Trigger-dependent RyR1 calcium dysregulation
        description: 'EHR/OMOP case-finding query: identify individuals with an intraoperative / peri-anesthetic
          hypermetabolic event — unexplained rising end-tidal CO2, hyperthermia, masseter/generalized
          rigidity, or acute rhabdomyolysis during or shortly after exposure to a volatile anesthetic
          or succinylcholine — in a patient without a prior MH diagnosis, as candidates for latent RYR1/CACNA1S
          susceptibility warranting referral for genetic testing and/or in-vitro contracture testing and
          a flagged trigger-free anesthetic plan. This is the anesthetic-trigger member of the trigger-provoked-latent-disease
          archetype (cf. the Timothy/Brugada fever and Long-QT drug queries); because the trigger→reaction
          mechanism is established, derivation_basis is ESTABLISHED_CRITERIA.'
        scope: EHR/OMOP + anesthesia-record case-finding for latent MH-susceptible carriers; grounded
          in the established anesthetic-trigger mechanism but not yet validated as a computable phenotype.
        criteria_sets:
        - name: Peri-anesthetic hypermetabolic reaction
          description: A hypermetabolic reaction (rising end-tidal CO2, hyperthermia, muscle rigidity/masseter
            spasm, or acute rhabdomyolysis) during or shortly after exposure to a volatile anesthetic
            or succinylcholine, in a patient without a prior MH diagnosis; refer for genetic and/or contracture
            testing and flag a trigger-free anesthetic plan.
          inclusion_criteria:
          - preferred_term: Triggering anesthetic exposure
            description: Exposure to a potent volatile anesthetic or succinylcholine (index exposure).
          - preferred_term: Acute peri-anesthetic hypermetabolic reaction
            description: Unexplained rising end-tidal CO2, hyperthermia, muscle rigidity/masseter spasm,
              or acute rhabdomyolysis during or shortly after the exposure.
          exclusion_criteria:
          - preferred_term: Pre-existing MH-susceptibility diagnosis
            description: Already-diagnosed/known MH-susceptible (not a latent-case-finding hit).
        notes: Anesthetic-trigger member of the hypothesis-based EHR case-finding set (Timothy MECHANISTIC_HYPOTHESIS/fever;
          Brugada ESTABLISHED_CRITERIA/fever; Long QT ESTABLISHED_CRITERIA/drug). MH is the archetype's
          strongest established example — a discrete codeable exposure (anesthesia record) and an unusually
          high genotype yield (50->70%). See docs/hypothesis-based-phenotype-algorithms.md and docs/reports/hypothesis-driven-ehr-case-finding-2026-07-12.md.
      selected_evidence:
        snippet: From 50% to >70% of those who have experienced a malignant hyperthermia reaction are
          found to have at least one of more than 200 variants in either RYR1 or CACNA1S, indicating that
          there is both locus and allelic heterogeneity.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32898259
      reference_title: Genomic Screening for Malignant Hyperthermia Susceptibility.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Empirical basis for the query: a documented MH reaction strongly enriches for genotype-positive
        RYR1/CACNA1S carriers (50->70%), so peri-anesthetic reactions are a high-yield latent-case-finding
        signal.'
