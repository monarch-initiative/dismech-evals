      assertion:
        name: Asbestos Exposure
        description: Asbestos fibers, when inhaled or ingested, become lodged in mesothelial tissues where
          they cause chronic inflammation, oxidative stress, and DNA damage. The fibers persist indefinitely
          in tissue and are directly genotoxic, causing chromosomal abnormalities and mesothelial cell
          transformation. Occupational exposure accounts for approximately 80% of cases.
        exposure_term:
          preferred_term: exposure to asbestos
          term:
            id: ECTO:9000033
            label: exposure to asbestos
      selected_evidence:
        snippet: Malignant pleural mesothelioma (MPM) is an aggressive, malignant tumor of the pleural
          surface and is strongly associated with asbestos exposure.
        supports: SUPPORT
