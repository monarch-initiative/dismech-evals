        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BAP1 Tumor Suppressor Inactivation
        description: BAP1 (BRCA1-associated protein 1) is a nuclear deubiquitinase that regulates chromatin
          remodeling, DNA damage response, and cell cycle progression. BAP1 is one of the most frequently
          inactivated tumor suppressors in mesothelioma, affected through germline or somatic loss-of-function
          alterations that predispose to malignant transformation. BAP1 loss impairs chromatin regulation
          and global gene expression control.
        genes:
        - preferred_term: BAP1
          term:
            id: hgnc:950
            label: BAP1
        molecular_functions:
        - preferred_term: deubiquitinase activity
          modifier: DECREASED
          term:
            id: GO:0101005
            label: deubiquitinase activity
        biological_processes:
        - preferred_term: DNA damage response
          modifier: DECREASED
          term:
            id: GO:0006974
            label: DNA damage response
      selected_evidence:
        snippet: The cyclin-dependent kinase inhibitor 2A/alternative reading frame (CDKN2A/ARF), neurofibromatosis
          type 2 (NF2) and BRCA1-associated protein-1 (BAP1) genes are the most frequently mutated tumor
          suppressor genes detected in MM cells
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23677068
      reference_title: Molecular pathogenesis of malignant mesothelioma.
