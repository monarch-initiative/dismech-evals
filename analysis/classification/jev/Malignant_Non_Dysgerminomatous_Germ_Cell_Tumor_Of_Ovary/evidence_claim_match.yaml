        definition_type: CASE_DEFINITION
        description: Ovarian malignant germ cell tumors arise from ovarian germ cells; the non-dysgerminomatous
          subset excludes pure dysgerminoma and captures malignant primitive or teratomatous histologies
          such as yolk sac tumor, embryonal carcinoma, choriocarcinoma, immature teratoma, and mixed malignant
          germ cell tumor.
        scope: Rare gynecologic oncology disease grouping
      selected_evidence:
        snippet: Precursory germ cells of the ovary form the basis of GCT. They are histologically classified
          into primitive GCT, teratomas, and monodermal and somatic-type tumours associated with dermoid
          cysts.
        supports: SUPPORT
