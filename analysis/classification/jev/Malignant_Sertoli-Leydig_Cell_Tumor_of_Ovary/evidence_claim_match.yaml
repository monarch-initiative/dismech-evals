              label: malignant Sertoli-Leydig cell tumor of ovary
        context: []
      assertion_type: Diagnosis
      assertion:
        name: DICER1 Molecular Testing, Tumor and Germline
        description: 'Diagnosis rests on morphology plus a sex cord immunophenotype, with DICER1 RNase
          IIIb testing used both to confirm a moderately/poorly differentiated or retiform SLCT and to
          trigger germline evaluation. The workflow is deliberately two-tiered: a somatic hotspot variant
          in the tumor prompts germline testing, and a negative conventional germline test does not close
          the question, because deep intronic splice-altering DICER1 variants have been found by custom-capture
          panel in patients whose exon-directed sequencing was negative.'
      selected_evidence:
        snippet: We suggest that when no DICER1 pLOF variants or large deletions are discovered in exonic
          regions despite strong clinical suspicion, intron sequencing and splicing analysis should be
          performed.
        supports: SUPPORT
