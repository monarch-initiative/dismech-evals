              label: malignant Sertoli-Leydig cell tumor of ovary
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DICER1 RNase IIIb Hotspot Mutation
        biological_scale: MOLECULAR
        description: 'Somatic missense mutations cluster tightly in the DICER1 region encoding the RNase
          IIIb domain, and are restricted to the codons encoding the four metal-binding residues of the
          RNase IIIb catalytic centre that are critical for microRNA interaction and cleavage. These mutations
          were found in 60% of Sertoli-Leydig cell tumors in the founding series and are somatic in every
          case with germline DNA available. Crucially they do not abolish DICER1: the mutant proteins
          retain RNase IIIa activity while losing RNase IIIb activity, so this is a hypomorphic, activity-altering
          lesion rather than a classic null.'
        genes:
        - preferred_term: DICER1
          term:
            id: hgnc:17098
            label: DICER1
        molecular_functions:
        - preferred_term: DICER1 RNase IIIb catalytic activity
          modifier: DECREASED
          term:
            id: GO:0004525
            label: ribonuclease III activity
        locations:
        - preferred_term: ovary
          term:
            id: UBERON:0000992
            label: ovary
      selected_evidence:
        snippet: These mutations were restricted to codons encoding metal-binding sites within the RNase
          IIIb catalytic centers, which are critical for microRNA interaction and cleavage, and were somatic
          in all 16 samples in which germline DNA was available for testing.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
