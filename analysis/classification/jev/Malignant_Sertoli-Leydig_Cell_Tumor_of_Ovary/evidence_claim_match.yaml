      assertion:
        name: Genetic Counseling and Germline DICER1 Testing
        description: A diagnosis of moderately or poorly differentiated SLCT is an indication to consider
          germline DICER1 testing, since the tumor is a sentinel neoplasm of an autosomal dominant predisposition
          syndrome with implications for the patient and first-degree relatives.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        notes: Conventional exon-directed germline sequencing can miss the predisposing allele. Two SLCT
          patients whose tumors carried only a somatic RNase IIIb missense variant were found on custom-capture
          panel testing to have novel intronic DICER1 variants interfering with normal splicing, so a
          negative standard germline test in the face of strong clinical suspicion should prompt intron
          sequencing and splicing analysis rather than closing the question.
      selected_evidence:
        snippet: Once a germline DICER1 pathogenic variant has been identified in an affected family member,
          predictive testing for at-risk relatives and prenatal/preimplantation genetic testing are possible.
        supports: SUPPORT
