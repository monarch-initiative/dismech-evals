      assertion_type: Pathophysiology
      assertion:
        name: Germline DICER1 Loss-of-Function Predisposition
        biological_scale: MOLECULAR
        description: A heterozygous germline loss-of-function DICER1 variant establishes the predisposed
          state. Penetrance is reduced and age-related, and ovarian sex cord-stromal tumors are among
          the most characteristic manifestations, with SLCT diagnosed at a median age of 14 years in a
          large international registry cohort. The germline variant is the first hit; the somatic RNase
          IIIb hotspot change is the second.
        genes:
        - preferred_term: DICER1
          term:
            id: hgnc:17098
            label: DICER1
        notes: Roughly half of hotspot-mutant SLCTs arise on a germline predisposing background and half
          are tumor-limited, so this node is a frequent but NOT obligatory upstream step; the somatic
          RNase IIIb hit below is the constant element. Somatic mosaicism for a hotspot variant is a recognised
          third architecture. Because germline pLOF variants are not always found by conventional exon-directed
          sequencing, two SLCT patients with a somatic hotspot variant and negative germline exon testing
          were shown to carry deep intronic splice-altering DICER1 variants, so a negative standard germline
          test does not exclude predisposition.
      selected_evidence:
        snippet: The diagnosis of DICER1 is established by identification of a heterozygous germline DICER1
          pathogenic variant that is known or suspected to cause loss of function.
        supports: SUPPORT
