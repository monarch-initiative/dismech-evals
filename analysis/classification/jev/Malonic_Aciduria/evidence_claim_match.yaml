      assertion_type: Pathophysiology
      assertion:
        name: Protein Lysine Malonylation
        biological_scale: MOLECULAR
        description: 'A proposed second, non-canonical arm of pathogenesis. Excess malonyl-CoA serves
          as the acyl donor for lysine malonylation (Kmal) of mitochondrial and metabolic proteins. In
          MCD-deficient patient fibroblasts hundreds of Kmal sites increase, and cells with raised Kmal
          show impaired mitochondrial function and fatty-acid oxidation, suggesting that post-translational
          malonylation amplifies the primary CPT1-mediated block rather than merely accompanying it. The
          evidence is in vitro and the arm should be treated as mechanistically plausible rather than
          established in patient tissue.

          '
        biological_processes:
        - preferred_term: protein malonylation
          term:
            id: GO:0044394
            label: protein malonylation
          modifier: INCREASED
      selected_evidence:
        snippet: Cells with increased lysine malonylation displayed impaired mitochondrial function and
          fatty acid oxidation, suggesting that lysine malonylation plays a role in pathophysiology of
          malonic aciduria.
        supports: SUPPORT
