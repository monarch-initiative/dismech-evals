        hypothesis_label: Protein lysine malonylation as a pathogenic amplifier
        status: EMERGING
        description: 'Beyond CPT1 inhibition, accumulating malonyl-CoA malonylates lysine residues on
          mitochondrial and metabolic proteins. The hypothesis holds that this post-translational modification
          is itself pathogenic, further impairing mitochondrial function and fatty-acid oxidation and
          thereby amplifying the primary block. Support is currently limited to proteomic and functional
          work in MCD-deficient fibroblasts; the modification has not been shown to drive disease in patient
          heart or brain tissue.

          '
