      assertion:
        name: p53 Activation and Cellular Senescence
        biological_scale: CELLULAR
        conforms_to: cellular_senescence#Senescence-Associated Cell Cycle Arrest
        description: 'Zmpste24 deficiency upregulates p53 target genes with cellular senescence and organismal
          accelerated ageing; these are largely rescued by halving Lmna dosage and partly reversed by
          p53 loss. Patient fibroblasts show reduced proliferation and lifespan. Senescence is not simply
          a consequence of nuclear shape: reducing ICMT or RCE1 activity in Zmpste24-deficient cells relieves
          senescence through prelamin A-dependent AKT-mTOR signalling without correcting misshapen nuclei.'
        biological_processes:
        - preferred_term: cellular senescence
          modifier: INCREASED
          term:
            id: GO:0090398
            label: cellular senescence
