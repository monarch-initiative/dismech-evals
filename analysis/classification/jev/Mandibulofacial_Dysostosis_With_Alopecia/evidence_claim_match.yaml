        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Maxillary-to-Mandibular Homeotic Transformation
        biological_scale: TISSUE
        conforms_to: pharyngeal_arch_patterning_serial_homology#Disrupted Pharyngeal-Arch Patterning and
          Neural-Crest Skeletogenesis
        description: 'ETAR signalling in cranial neural crest acts through the Dlx5/Dlx6 code that assigns
          ventral (mandibular) identity within the first arch. Ectopic activation in the dorsal territory
          drives upper-jaw skeletal elements toward a lower-jaw program, giving the partial maxillary-to-mandibular
          transformation seen in the knock-in mice. The human radiographic correlate is a zygomatic arch
          that resembles that of mice with experimentally induced ectopic maxillary ETAR activation, together
          with absent temporomandibular joints, flattened condyles and a thickened malar bone.

          Note that MFDA is not a pure gain: the reported functional consequences are complex and territory-dependent,
          with the upper jaw showing aberrant ETAR signalling while the lower jaw appears to show disrupted
          signalling. That dual character is what makes the phenotype a dysostosis with micrognathia rather
          than a straightforward duplication of the mandible.

          '
        biological_processes:
        - preferred_term: regionalization
          term:
            id: GO:0003002
            label: regionalization
          modifier: ABNORMAL
        - preferred_term: embryonic skeletal system morphogenesis
          term:
            id: GO:0048704
            label: embryonic skeletal system morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: the expression of Dlx5 and Dlx6, homeobox transcription factors that act downstream of
          ET1-ETAR signaling to determine ventral identity in PA1, extended dorsally in mutant embryos
          (Figure 2M). These results suggest that the Ednra mutations had an ectopic gain-of-function
          effect in the dorsal PA1
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
