        context: []
      assertion_type: Pathophysiology
      assertion:
        name: EDNRA Gain-of-Function Variant
        biological_scale: MOLECULAR
        conforms_to: pharyngeal_arch_patterning_serial_homology#Cranial Neural Crest and Pharyngeal Arch
          Program Perturbation
        description: 'Two recurrent de novo missense substitutions in EDNRA cause MFDA. Neither sits in
          the orthosteric ligand-binding site; both act allosterically. Tyr129 is the residue that normally
          enforces ETAR selectivity for endothelin 1 over endothelin 3, and p.Tyr129Phe raises affinity
          for endothelin 3 by two orders of magnitude by disrupting the sodium-water network beneath the
          binding pocket. Glu303 lies at the intracellular end of transmembrane helix 6, and p.Glu303Lys
          increases the flexibility of that helix, favouring G protein binding and thereby enhancing agonist
          affinity from the cytoplasmic side. The two variants thus converge on the same functional outcome
          — enhanced endothelin 3 responsiveness — by structurally opposite routes.

          '
        genes:
        - preferred_term: EDNRA
          term:
            id: hgnc:3179
            label: EDNRA
        molecular_functions:
        - preferred_term: endothelin receptor type A (ETAR) activity
          term:
            id: GO:0004962
            label: endothelin receptor activity
          modifier: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: Pharmacological experiments confirmed the causative ETAR mutations as gain of function,
          dependent on ET3.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36637912
      reference_title: Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations
        via allosteric effects on ligand binding.
      evidence_source: IN_VITRO
      explanation: Direct pharmacological confirmation that both variants are gain of function and that
        the gain is endothelin-3 dependent.
