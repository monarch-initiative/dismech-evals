    evidence_metadata:
      reference: PMID:36637912
      reference_title: Mandibulofacial dysostosis with alopecia results from ETAR gain-of-function mutations
        via allosteric effects on ligand binding.
      evidence_source: MODEL_ORGANISM
      explanation: 'Direct, same-direction evidence for this node: in embryos carrying the MFDA alleles
        themselves (Ednra Y129F and E303K), the Dlx5/Dlx6 ventral-identity code expands dorsally, which
        the authors read as an ectopic gain of function in dorsal PA1. This is the dorsal respecification
        the node asserts, measured in the MFDA genotype rather than inferred from the reciprocal knockout.'
