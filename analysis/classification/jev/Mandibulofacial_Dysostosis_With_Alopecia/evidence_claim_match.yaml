      assertion_type: Pathophysiology
      assertion:
        name: Ectopic ETAR Activation in the Maxillary Prominence
        biological_scale: CELLULAR
        description: 'In normal craniofacial development endothelin 1 is secreted by the epithelium and
          core mesoderm of the ventral pharyngeal arch and acts on ETAR-expressing cranial neural crest
          cells, establishing mandibular identity ventrally while the dorsal (maxillary) territory remains
          ETAR-unstimulated. A receptor that now responds to endothelin 3 is activated in the maxillary
          prominence, where endothelin 3 is available but endothelin 1 is not. Genetic rescue makes the
          dependency explicit: deleting Edn3 in the knock-in mice abolishes the craniofacial transformation.

          '
        biological_processes:
        - preferred_term: G protein-coupled receptor signaling pathway
          term:
            id: GO:0007186
            label: G protein-coupled receptor signaling pathway
          modifier: INCREASED
        cell_types:
        - preferred_term: cranial neural crest cell
          term:
            id: CL:0000008
            label: migratory cranial neural crest cell
      selected_evidence:
        snippet: Mouse models carrying either of these missense mutations exhibited a partial maxillary-to-mandibular
          transformation, which was rescued by deleting the ligand endothelin 3 (ET3/EDN3).
        supports: SUPPORT
