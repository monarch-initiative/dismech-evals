  038d8fe0f78ac33e6bd7e8c6975db2cb0a62c0c1126ec381d748b1ffb12b6cbd:
    claim:
      about:
        disease:
          name: Mandibulofacial Dysostosis with Alopecia
          disease_term:
            preferred_term: mandibulofacial dysostosis with alopecia
            term:
              id: MONDO:0014608
              label: mandibulofacial dysostosis with alopecia
        context: []
      assertion_type: Genetic
      assertion:
        name: EDNRA
        gene_term:
          preferred_term: EDNRA
          term:
            id: hgnc:3179
            label: EDNRA
        association: Causative
        notes: 'EDNRA encodes the endothelin receptor type A (ETAR), a class A GPCR that binds endothelin
          1 and endothelin 2 with much higher affinity than endothelin 3. Two recurrent de novo missense
          variants cause MFDA: p.Tyr129Phe (three of the four individuals in the founding report) and
          p.Glu303Lys (one somatic mosaic case, plus a later fully characterized patient). Allelic series
          note: the same gene produces three distinct clinical entities depending on the direction and
          magnitude of the signalling change. Gain of function gives MFDA; biallelic loss of function
          gives oro-oto-cardiac syndrome, with severe mandibular hypoplasia, anotia and cardiac defects;
          and loss of function in the downstream partners EDN1, PLCB4 and GNAI3 gives auriculocondylar
          syndrome. Interpreting a novel EDNRA variant therefore requires a functional assay establishing
          the direction of effect, not merely a pathogenicity prediction.

          '
      selected_evidence:
        snippet: Three of the four individuals have the same substitution, p.Tyr129Phe.
        supports: SUPPORT
    origin:
