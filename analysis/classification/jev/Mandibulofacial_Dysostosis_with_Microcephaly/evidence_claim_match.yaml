  8f5398cafb536dddf6e7b35afa623cfb46215a634c90efe1ff054f787001e1e5:
    claim:
      about:
        disease:
          name: Mandibulofacial dysostosis with microcephaly
          disease_term:
            preferred_term: Mandibulofacial dysostosis with microcephaly
            term:
              id: MONDO:0012516
              label: mandibulofacial dysostosis-microcephaly syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mdm2 mis-splicing activates p53-dependent neural crest apoptosis
        description: 'In vertebrate models of EFTUD2 deficiency, the splicing defect causes increased
          exon skipping, including an alternatively spliced Mdm2 transcript lacking exon 3. Reduced functional
          MDM2 stabilizes and activates nuclear P53, increasing expression of P53-target genes and triggering
          apoptosis of cranial neural crest cells and neural progenitors. Early depletion of these craniofacial
          precursor populations drives the craniofacial malformations and microcephaly of MFDM. The mechanism
          is partly p53-dependent: pharmacologic P53 inhibition (pifithrin-alpha) partially rescues craniofacial
          development, while Trp53 deletion reduces apoptosis without fully rescuing morphology, implying
          additional p53-independent mis-splicing contributions.'
        cell_types:
        - preferred_term: migratory neural crest cell
          term:
            id: CL:0000333
            label: migratory neural crest cell
        biological_processes:
        - preferred_term: signal transduction by p53 class mediator
          modifier: INCREASED
          term:
            id: GO:0072331
            label: signal transduction by p53 class mediator
        - preferred_term: apoptotic process in cranial neural crest cells
          modifier: INCREASED
          term:
            id: GO:0006915
            label: apoptotic process
      selected_evidence:
        snippet: RNAseq analysis of embryonic heads revealed a significant increase in exon skipping and
          increased levels of an alternatively spliced Mdm2 transcript lacking exon 3. Exon skipping in
          Mdm2 was also increased in O9-1 mouse neural crest cells after siRNA knock-down of Eftud2 and
          in MFDM patient cells. Moreover, we found increased nuclear P53, higher expression of P53-target
          genes and increased cell death.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33601405
      reference_title: Mutation in Eftud2 causes craniofacial defects in mice via mis-splicing of Mdm2
        and increased P53.
      evidence_source: MODEL_ORGANISM
      explanation: The neural crest-specific mouse model directly demonstrates Mdm2 mis-splicing, P53
        activation, and increased cell death as the mechanism of EFTUD2-related craniofacial defects.
