  54e64378697f92e5eaa0aa6fa8bc81ed4b2fce833cc8262f9995ae2f50680ef3:
    claim:
      about:
        disease:
          name: Mandibulofacial dysostosis with microcephaly
          disease_term:
            preferred_term: Mandibulofacial dysostosis with microcephaly
            term:
              id: MONDO:0012516
              label: mandibulofacial dysostosis-microcephaly syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: EFTUD2 haploinsufficiency impairs U5 snRNP spliceosome function
        description: MFDM is caused by heterozygous loss-of-function variants (null alleles, frameshifts,
          intragenic and contiguous 17q21.31 deletions, and a subset of missense and splice-altering variants)
          in EFTUD2. EFTUD2 encodes U5-116kD (SNU114), a highly conserved spliceosomal GTPase that is
          a core component of the U5 snRNP with a central regulatory role in catalytic pre-mRNA splicing
          and post-splicing spliceosome disassembly. Reduced EFTUD2 dosage impairs the major spliceosome,
          making MFDM the first multiple-malformation syndrome attributed to a defect of the major spliceosome.
        genes:
        - preferred_term: EFTUD2
          modifier: DECREASED
          term:
            id: hgnc:30858
            label: EFTUD2
        biological_processes:
        - preferred_term: mRNA splicing via the major spliceosome
          modifier: ABNORMAL
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
        cellular_components:
        - preferred_term: U5 snRNP
          modifier: DECREASED
          term:
            id: GO:0005682
            label: U5 snRNP
      selected_evidence:
        snippet: A range of EFTUD2-mutation types, including null alleles and frameshifts, is seen in
          MFDM, consistent with haploinsufficiency; segregation is de novo in all cases assessed to date.
          U5-116kD, the protein encoded by EFTUD2, is a highly conserved spliceosomal GTPase with a central
          regulatory role in catalytic splicing and post-splicing-complex disassembly.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
