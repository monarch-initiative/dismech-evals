      assertion_type: Pathophysiology
      assertion:
        name: Disrupted pre-mRNA splicing in neural crest and craniofacial development
        description: The major spliceosome is broadly required for pre-mRNA maturation during embryogenesis,
          including in cranial neural crest cells that give rise to craniofacial skeletal and connective
          tissues. Insufficient EFTUD2 dosage disrupts splicing-dependent gene expression during neural
          crest and craniofacial morphogenesis, contributing to malar/mandibular hypoplasia, ear and palatal
          malformations, and brain underdevelopment. A zebrafish eftud2-null model shows reduced head
          size, small eye, and widespread apoptosis in the developing brain, eye, and spinal cord, demonstrating
          a conserved requirement during development of diverse tissues.
        cell_types:
        - preferred_term: migratory neural crest cell
          term:
            id: CL:0000333
            label: migratory neural crest cell
        biological_processes:
        - preferred_term: mRNA splicing via the major spliceosome
          modifier: ABNORMAL
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
      selected_evidence:
        snippet: emphasise the necessity of mRNA maturation through the spliceosome complex for global
          growth and within specific regions of the embryo during development.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
