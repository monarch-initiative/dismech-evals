      reference: PMID:22305528
      reference_title: Haploinsufficiency of a spliceosomal GTPase encoded by EFTUD2 causes mandibulofacial
        dysostosis with microcephaly.
      evidence_source: HUMAN_CLINICAL
      explanation: The original gene-discovery paper establishes EFTUD2 haploinsufficiency and the role
