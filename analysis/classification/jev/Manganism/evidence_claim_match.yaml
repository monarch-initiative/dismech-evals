      assertion_type: Pathophysiology
      assertion:
        name: Manganese Transport Across the Blood-Brain Barrier
        biological_scale: CELLULAR
        description: Manganese travels on carriers it does not own. Several transporters move it and few
          are selective for it - DMT1, ZIP8, ZIP14, transferrin receptor, all built for iron or zinc -
          which is why iron status changes the dose that reaches the brain and why the metal lands where
          those carriers are densest rather than where it would do least harm.
        genes:
        - preferred_term: SLC11A2
          term:
            id: hgnc:10908
            label: SLC11A2
        - preferred_term: SLC39A14
          term:
            id: hgnc:20858
            label: SLC39A14
        - preferred_term: SLC39A8
          term:
            id: hgnc:20862
            label: SLC39A8
        - preferred_term: TFRC
          term:
            id: hgnc:11763
            label: TFRC
        biological_processes:
        - preferred_term: manganese ion transmembrane transport
          term:
            id: GO:0071421
            label: manganese ion transmembrane transport
          modifier: INCREASED
      selected_evidence:
        snippet: 'DMT1 facilitates Mn transport in its divalent state (Mn2+), and it is regulated by iron
          status: iron deficiency enhances Mn absorption and brain accumulation'
        supports: SUPPORT
        directness: DIRECT
