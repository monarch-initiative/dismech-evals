  8b4d9cbfa53e9308f04443032412d532a1ed29f88453007aa2198bcdbcd6f9fa:
    claim:
      about:
        disease:
          name: Manganism
          disease_term:
            preferred_term: manganese poisoning
            term:
              id: MONDO:0017638
              label: manganese poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_manganese_complex_ii_rodent_microglia
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the complex II-dependent oxidative mechanism established in rat microglial cultures
          hold in human basal ganglia, where the affected cell populations, manganese concentrations,
          and exposure durations all differ?
        attaches_to:
        - pathophysiology#Microglial Complex II-Dependent Reactive Oxygen Species Production
        rationale: 'The evidence assigning the oxidative lesion of manganese to respiratory complex II
          rather than complex I is strong but comes from acute exposure of isolated rat microglia to low
          micromolar Mn(2+). Human manganism arises from chronic exposure over years, and the node sits
          in a chain whose downstream effector is a pallidal circuit lesion rather than a microglial one.
          Three things are therefore open: whether complex II dependence is a property of microglia specifically
          or of manganese-exposed cells generally; whether the same selectivity holds at the far lower
          concentrations reached over chronic human exposure; and how much of the human pallidal injury
          this route accounts for. The mismatch matters for curation because it is the sole basis for
          this entry declining to conform to the parkinsonism module''s complex I node, so if the complex
          II selectivity turned out to be a feature of the acute rodent preparation, that decision would
          need revisiting.'
      selected_evidence:
        snippet: Mn(2+) was capable of inducing significant H2O2 production in the mitochondrial but not
          the cytosolic or nuclear fraction prepared from microglia
        supports: SUPPORT
    origin:
      assertion_path: /discussions/5
