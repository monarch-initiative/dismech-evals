      reference_title: Complex II of the mitochondrial respiratory chain is the key mediator of divalent
        manganese-induced hydrogen peroxide production in microglia.
      evidence_source: IN_VITRO
      explanation: Pharmacological dissection assigning the oxidative lesion to complex II, and excluding
        complexes I and III.
