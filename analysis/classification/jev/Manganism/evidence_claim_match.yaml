          from an occupational exposure; `ancestors -p i` confirms C15843 reaches NCIT:C25218, so it is
          inside the TreatmentActionTerm root, and the specificity is carried in the name and preferred_term.
      selected_evidence:
        snippet: Despite a cessation of exposure, their symptoms, which did not have a sustained response
          to levodopa, were progressive over the first decade and then plateaued
