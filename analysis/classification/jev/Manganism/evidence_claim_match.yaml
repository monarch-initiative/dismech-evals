      assertion:
        discussion_id: presynaptic_involvement_versus_pallidal_lesion
        kind: CONTROVERSY
        prompt: Is the dopaminergic system in manganism untouched, or functionally impaired without degenerating?
        rationale: 'The textbook account is that manganism spares the nigrostriatal dopaminergic neurons,
          and the neuropathology supports it: substantia nigra pars compacta preserved, no Lewy bodies.
          But asymptomatic welders show measurably reduced FDOPA uptake, and Mn-exposed primates show
          marked inhibition of dopamine release with terminals intact. These are not contradictory once
          function and structure are kept apart - the terminals are there and underperforming - but the
          entry should not be read as claiming the dopaminergic system is unaffected. The FDOPA pattern
          is also the discriminating detail: reduced, but caudate-first, which is the reverse of the posterior-putamen-first
          pattern of idiopathic Parkinson disease.'
        attaches_to:
