      assertion_type: Discussion
      assertion:
        discussion_id: occupational_prevalence_and_referral_bias
        kind: INTERPRETATION
        prompt: What is the prevalence of parkinsonism among manganese-exposed workers, and can the widely
          cited welder figures be used for it?
        rationale: The most-cited occupational prevalence estimates come from a screen of 1,423 Alabama
          welders who were referred for medical-legal evaluation for Parkinson disease. That is a population
          selected for having, or claiming, the outcome being measured, so the resulting rate cannot be
          read as an occupational prevalence, and this entry records no prevalence figure rather than
          launder one. The exposure-response relationship from the trade-union longitudinal cohort is
