        kind: OPEN_QUESTION
        prompt: Does manganism stabilise, improve, or continue to progress after exposure stops?
        rationale: Removal from exposure is the main intervention, and what it achieves is not settled.
          Reviews describe symptoms persisting after the source is eliminated, and at least one series
          describes progression through the first decade after cessation before plateauing. The methcathinone
          series found deficits that did not resolve. Against that, blood manganese falls and MRI signal
          fades, so the biomarkers improve while the patient does not. A framing in which manganism is
          simply reversible on removal does not fit the reported courses, and the entry avoids it.
        attaches_to:
        - treatments#Removal from Exposure
      selected_evidence:
