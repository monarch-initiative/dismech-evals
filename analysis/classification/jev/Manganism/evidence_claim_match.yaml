          overload is characterised by negative alpha-synuclein immunostaining. Does the primate finding
          describe anything that happens in human manganism?
        rationale: 'The mismatch is sharp rather than gradual. In Mn-exposed cynomolgus macaques, alpha-synuclein-positive
          neurons and glia appear in frontal cortex grey and white matter. In humans with pallidal manganese
          accumulation measured directly at autopsy, alpha-synuclein immunostaining was negative in all
          but one case, and the defining neuropathology of manganism is the absence of Lewy bodies. Both
          cannot be generalised. Possible reconciliations: the primate aggregates are a different species
          of assembly from Lewy pathology; the cortical location differs from the pallidal region sampled
          in the human series; or the primate exposure regimen produces something the human occupational
          one does not. This matters because alpha-synuclein is the bridge people use to argue that manganese
          exposure causes Parkinson disease, and the human pathology is the main evidence against that.'
        attaches_to:
