              label: manganese poisoning
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Brain MRI with T1-weighted sequences
        description: 'The most direct test available, in the literal sense: manganese is paramagnetic,
          so the accumulated metal is what generates the signal. Symmetric pallidal T1 hyperintensity
          without gadolinium is the finding. It reports body burden rather than disease, and the two come
          apart - the signal tracks ongoing exposure, and it fades after exposure stops while symptoms
          do not.'
        diagnosis_term:
          preferred_term: T1-weighted brain magnetic resonance imaging
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
        notes: Bound to the generic NCIT:C16809 Magnetic Resonance Imaging. NCIT's brain-specific MRI
          terms are contrast-qualified (NCIT:C137874 without contrast, NCIT:C137913 with and without),
          and this finding is a plain unenhanced T1 sequence, so neither is a better fit than the parent;
          `ancestors -p i` confirms C16809 reaches NCIT:C25218.
      selected_evidence:
        snippet: In patients with pallidal T1 hyperintensity, pallidal manganese concentrations were increased
          sevenfold over controls and over fourfold vs liver patients with normal MRI
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17159105
      reference_title: Brain metal concentrations in chronic liver failure patients with pallidal T1 MRI
        hyperintensity.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Direct tissue validation of the imaging sign: the signal tracks measured pallidal
        manganese, not a proxy for it.'
