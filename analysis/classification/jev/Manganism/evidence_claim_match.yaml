      assertion_type: Pathophysiology
      assertion:
        name: Impaired Hepatobiliary Manganese Excretion
        role: trigger
        biological_scale: ORGANISM
        description: 'The other way to reach overload: normal intake with a broken exit. Manganese is
          cleared in bile, so chronic liver failure raises body burden without any unusual exposure, and
          parenteral nutrition delivers manganese straight into the blood past the gut and liver entirely.
          Both produce the same pallidal accumulation as the occupational route.'
        biological_processes:
        - preferred_term: manganese ion homeostasis
          term:
            id: GO:0055071
            label: manganese ion homeostasis
          modifier: ABNORMAL
      selected_evidence:
        snippet: Mn-induced parkinsonism may occur in patients with chronic liver failure who fail to
          adequately excrete Mn in bile
        supports: SUPPORT
        directness: DIRECT
