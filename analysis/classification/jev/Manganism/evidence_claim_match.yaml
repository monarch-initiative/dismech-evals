      assertion_type: Pathophysiology
      assertion:
        name: Basal Ganglia Output Failure
        conforms_to: parkinsonism_dopaminergic_degeneration#Striatal Dopamine Deficiency and Basal Ganglia
          Circuit Dysfunction
        biological_scale: TISSUE
        description: The final common pathway for the motor syndrome. Because the damage is at and beyond
          the pallidum rather than upstream of the dopamine synapse, supplying more dopamine precursor
          does not restore the circuit - which is the mechanistic reason levodopa disappoints here.
        locations:
        - preferred_term: basal ganglion
          term:
            id: UBERON:0002420
            label: basal ganglion
        notes: 'Conformance. The module node is named "Striatal Dopamine Deficiency and Basal Ganglia
          Circuit Dysfunction", and this entry argues the lesion is pallidal and postsynaptic with the
          substantia nigra pars compacta spared - so the name looks like it asserts what this entry denies.
          It does not. The module''s own description of that node states the exception in terms: "In the
          dopaminergic parkinsonisms this circuit deficit is levodopa-responsive; manganism is a partial
          exception with predominantly pallidal pathology and poor levodopa response." The module has
          already scoped itself to include this disease, and a module''s description is the authoritative
          statement of its scope.

          The dopamine half of the module node''s name is carried by `Impaired Striatal Dopamine Release`
          upstream of this one, which is where the module''s `dopamine secretion DECREASED` process belongs
          in this entry: manganese inhibits dopamine release with the terminals structurally intact. The
          conformance therefore spans two nodes here against one in the module, which is the organ-specific
          substitution the conformance mechanism is for, not a mismatch.'
      selected_evidence:
        snippet: when accumulated in the globus pallidus, Mn influences the subthalamic (STN) and substantia
          nigra (SN) neurons, which are at the origin of changes in the thalamus and the cortex.
        supports: SUPPORT
        directness: DIRECT
    origin:
