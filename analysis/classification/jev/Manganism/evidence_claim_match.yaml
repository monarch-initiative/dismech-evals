  e3e1acbaac31db436755a4f9a077302cd4473cedc7b3ac3f42aed3ff80f586a0:
    claim:
      about:
        disease:
          name: Manganism
          disease_term:
            preferred_term: manganese poisoning
            term:
              id: MONDO:0017638
              label: manganese poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Microglial Complex II-Dependent Reactive Oxygen Species Production
        biological_scale: MOLECULAR
        description: 'Divalent manganese drives hydrogen peroxide production in the mitochondrial fraction
          of microglia, and the route is specifically complex II: the effect is supported by the complex
          II substrate succinate and abolished by complex II inhibition, while complex I substrates do
          not support it and complex I inhibition does not abolish it. The resulting microglial free-radical
          output in turn facilitates dopaminergic neurotoxicity. This is a narrower claim than the general
          oxidative-stress node, about a named respiratory complex in a named cell type, which is why
          the two are kept apart.'
        cell_types:
        - preferred_term: microglial cell
          term:
            id: CL:0000129
            label: microglial cell
        biological_processes:
        - preferred_term: reactive oxygen species biosynthetic process
          term:
            id: GO:1903409
            label: reactive oxygen species biosynthetic process
          modifier: INCREASED
        notes: 'Deliberately NOT wired to "parkinsonism_dopaminergic_degeneration#Mitochondrial Complex
          I Inhibition and Oxidative Stress". That module node names complex I, which is right for its
          MPTP and rotenone conformers, but the manganese literature tests complex I directly and excludes
          it: complex I substrates fail to support the effect and complex I inhibition does not abolish
          it. Declaring conformance would validate cleanly while asserting the wrong respiratory complex.
          If the module ever generalises that node to mitochondrial respiratory chain inhibition, revisit
          this.

          Kept separate from `Mitochondrial Dysfunction and Oxidative Stress` rather than merged into
          it. That node is the general claim, graded OTHER from a review aggregating across systems; this
          one is a specific in vitro result in microglia naming a complex. Merging them would bury the
          complex I exclusion the note above turns on.'
      selected_evidence:
        snippet: the succinate-supported Mn(2+)-induced mitochondrial H2O2 production was abolished by
          pharmacological inhibition of complex II but not that of complexes I and III
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/9
      evidence_path: /pathophysiology/9/evidence/0
      context_paths:
