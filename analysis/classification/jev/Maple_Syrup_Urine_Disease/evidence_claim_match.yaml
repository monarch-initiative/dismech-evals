          to MATCH controls achieves ≥90% power (p ≤ 0.025) to detect 64% fewer CMDs (3.0% vs. 8.4%),
          a 57% increase in PIPE (19.3% vs. 12.3%), and a 36% reduction in alloisoleucine (117 vs. 183
          μM).
