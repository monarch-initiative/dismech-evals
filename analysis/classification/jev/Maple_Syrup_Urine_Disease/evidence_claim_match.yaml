      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Systemic BCAA and BCKA Accumulation
        environmental_effect: EXACERBATES
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: 'Illness, injury, fasting, and psychological stress push the body into net protein
          breakdown, and the branched-chain amino acids released from muscle enter a pathway that cannot
          clear them. Proteolysis is the intervening step, which is why the intermediates are recorded
          as known rather than absent. Recorded as exacerbating on the same reasoning as the dietary protein
          link into this node: the pool is present at steady state from the enzyme defect alone, so an
          endogenous load raises its height rather than creating it. What catabolic stress does start
          is the acute decompensation episode downstream, which is a different claim from the one this
          link makes.'
      selected_evidence:
        snippet: metabolic stress with a risk of decompensation ... injury, failure to eat (fasting) or
          psychological stress that lead to BCAA accumulation
        supports: SUPPORT
