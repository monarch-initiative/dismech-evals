        name: Gene Therapy (Clinical Development)
        description: 'Liver-directed AAV8 gene therapy for MSUD is advancing toward clinical trials. The
          MSUD Age-matched Standard Treatment Cohort (MATCH) is a prospective natural history study of
          11 infants with classic MSUD designed to serve as regulatory-grade external controls for single-arm
          gene therapy trials. The study applies FDA and ICH E9(R1) guidelines with prespecified eligibility
          criteria, fixed visit cadence, and adjudicated outcomes. Primary outcome measures include proportional
          intact protein equivalent (PIPE), crisis management days (CMDs), and blood alloisoleucine concentration.
          Monte Carlo simulations demonstrate ≥90% power to detect clinically meaningful improvements:
          64% reduction in CMDs (from 8.4% to 3.0%), 57% increase in PIPE (from 12.3% to 19.3%), and 36%
          reduction in alloisoleucine (from 183 to 117 μM).

          '
        therapeutic_modality: GENE_THERAPY
