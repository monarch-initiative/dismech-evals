      assertion_type: AgentLifeCycle
      assertion:
        description: Marburg virus is maintained in the Egyptian fruit bat (Rousettus aegyptiacus), in
          which it circulates with low-level year-round horizontal transmission and distinct seasonal
          pulses of infection in juvenile bats that coincide with peak human spillover risk. Humans are
          incidental, dead-end hosts that do not maintain the cycle but can sustain outbreaks through
          person-to-person transmission.
        hosts:
        - preferred_term: Egyptian fruit bat (reservoir host)
          role: reservoir host
          term:
            id: NCBITaxon:9407
            label: Rousettus aegyptiacus
        - preferred_term: Human (incidental dead-end host)
          role: incidental (dead-end) host
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
      selected_evidence:
        snippet: distinct pulses of virus infection in older juvenile bats (~six months of age) that temporarily
          coincide with the peak twice-yearly birthing seasons
        supports: SUPPORT
