      assertion_type: Pathophysiology
      assertion:
        name: Excessive Mechanotransduction in Proprioceptive Sensory Neurons
        biological_scale: CELLULAR
        role: central_effector
        mechanism_confidence: PROVISIONAL
        description: 'PIEZO2 is the principal mechanotransduction channel of proprioceptive sensory neurons
          innervating muscle spindles and Golgi tendon organs. In gain-of-function Piezo2 E2799del knock-in
          mice (modeling the human DA5 E2727del variant), conditional expression in Pvalb-Cre proprioceptive
          neurons is sufficient to induce hindlimb contractures and shortened tendons, whereas conditional
          expression in Prrx1-Cre limb mesenchyme (osteoblasts, chondrocytes, tenocytes, and fibroblasts)
          produces normal joints and tendon lengths. The defect depends on peripheral sensory-neuron activity
          during a postnatal developmental critical window (between P7 and P21 in mice): local intramuscular
          botulinum toxin (Botox) injection at P7-P10 rescues the joint and tendon defects, whereas motor-endplate
          blockade with alpha-bungarotoxin does not, and ex vivo stretch-evoked muscle spindle afferent
          firing at P7 is not significantly changed. The authors conclude that overactive PIEZO2 acts
          via ectopic efferent activity (increased exocytosis) from afferent mechanosensory nerve endings
          rather than increased reflex motor drive. This node is PROVISIONAL for Marden-Walker syndrome
          because the mouse models a DA5 allele during a postnatal window, whereas human MWS contractures
          are congenital and MWS is genetically heterogeneous.'
        cell_types:
        - preferred_term: Proprioceptive sensory neuron
          term:
            id: CL:1001451
            label: sensory neuron of dorsal root ganglion
        locations:
        - preferred_term: Muscle spindle
          term:
            id: UBERON:0003718
            label: muscle spindle
        - preferred_term: Tendon
          term:
            id: UBERON:0000043
            label: tendon
        biological_processes:
        - preferred_term: Detection of Mechanical Stimulus
