          that includes Gordon syndrome (distal arthrogryposis type 3), distal arthrogryposis type 5,
          and Marden-Walker syndrome. PIEZO2 is found in only a subset of MWS families, consistent with
          genetic heterogeneity.
      selected_evidence:
        snippet: Marden-Walker syndrome (MWS; OMIM 248700) is an extremely rare congenital disorder characterized
          by multiple joint contractures, craniofacial dysmorphism, neurological abnormalities, and multisystem
          involvement. Although historically diagnosed on clinical grounds, only a few cases have been
          molecularly confirmed. Here, we describe a Brazilian female infant with classic manifestations
          of MWS, carrying a heterozygous pathogenic variant in the PIEZO2 gene not previously reported
          in MWS.
        supports: SUPPORT
