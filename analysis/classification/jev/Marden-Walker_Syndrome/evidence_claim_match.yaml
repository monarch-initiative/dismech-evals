      assertion:
        name: Fetal Akinesia Deformation Sequence
        biological_scale: ORGANISM
        role: consequence
        mechanism_confidence: PROVISIONAL
        description: Clinical and nosological framing for Marden-Walker syndrome as one etiologic possibility
          within the genetically heterogeneous fetal akinesia/hypokinesia deformation sequence (FADS),
          based on clinical reports of pregnancies complicated by feeble fetal movements and polyhydramnios
          followed at birth by multiple joint contractures, decreased muscular bulk, immobile mask-like
          facies, micrognathia, and palatal anomalies. Because MWS is genetically heterogeneous (with
          PIEZO2 mutations identified in only a subset of MWS families) and the Piezo2 gain-of-function
          mouse model develops contractures postnatally via sensory-neuron efferent activity and tendon
          shortening rather than in utero akinesia or primary muscle pathology, this clinical FADS node
          is modeled separately rather than as a direct downstream consequence of the PIEZO2 sensory-neuron
          mechanism.
        locations:
        - preferred_term: Skeletal joint
          term:
            id: UBERON:0000982
            label: skeletal joint
        - preferred_term: Skeletal muscle tissue
          term:
            id: UBERON:0001134
            label: skeletal muscle tissue
      selected_evidence:
        snippet: We propose that Marden-Walker syndrome is one of the etiologic possibilities in children
          with the heterogeneous fetal a(hypo)kinesia deformation sequence (FADS).
        supports: SUPPORT
