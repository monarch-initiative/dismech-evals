        context: []
      assertion_type: Genetic
      assertion:
        name: PIEZO2 gain-of-function variants
        association: Causative
        gene_term:
          preferred_term: PIEZO2
          term:
            id: hgnc:26270
            label: PIEZO2
        notes: PIEZO2 encodes a large mechanically activated (mechanosensitive) non-selective cation channel.
          Heterozygous gain-of-function variants (clustered toward the C-terminal pore module, e.g., the
          recurrent p.Arg2686His and the in-vitro-characterized E2727del and I802F) underlie a spectrum
          that includes Gordon syndrome (distal arthrogryposis type 3), distal arthrogryposis type 5,
          and Marden-Walker syndrome. PIEZO2 is found in only a subset of MWS families, consistent with
          genetic heterogeneity.
      selected_evidence:
        snippet: Using molecular inversion probes for targeted sequencing to screen PIEZO2, we found mutations
          in 24/29 (82%) DA5-affected families and one of two MWS-affected families.
        supports: SUPPORT
