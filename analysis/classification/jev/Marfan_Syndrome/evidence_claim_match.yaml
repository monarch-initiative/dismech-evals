          this differential, and Marfan syndrome carries no type 2 subtype. Note that MONDO retired MFS2
          as a dubious entity rather than asserting that MFS2 is equivalent to Loeys-Dietz syndrome; the
          obsolete CURIE must not be cited as a term anywhere in the knowledge base. The two diseases
          are related as sibling members of the Heritable_Thoracic_Aortic_Disease grouping, not as parent
          and subtype.
      selected_evidence:
        snippet: Unlike the increased risk of aortic dissection at or above the 5.0-cm aortic root dimension
          in Marfan syndrome, dissections have occurred in individuals with LDS 1, 2, or 3 at aortic dimensions
          of 3.9–4.0 cm
        supports: SUPPORT
