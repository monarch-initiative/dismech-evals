            description: A heritable connective tissue disorder caused by mutations in FBN1, characterized
              by cardiovascular, ocular, and skeletal abnormalities.
            term:
              id: MONDO:0007947
              label: Marfan syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_fbn1_tgfb_dysregulation_model
        hypothesis_label: Canonical FBN1 Loss / TGF-β Dysregulation Model
        status: CANONICAL
        description: 'Heterozygous FBN1 pathogenic variants reduce or qualitatively alter fibrillin-1
          microfibrils, the extracellular scaffold that both confers elastic-fiber mechanical integrity
          and sequesters latent TGF-β complexes. Loss of microfibrillar function therefore produces a
          dual lesion: (1) structural weakness of elastin-rich tissues (aortic media, suspensory ligament
          of the lens, dura, lung, skin, mitral valve) and (2) excess bioavailable TGF-β with downstream
          Smad2/3 and non-canonical pathway activation in aortic wall and other tissues. The result is
          the characteristic multisystem phenotype — progressive aortic root aneurysm and dissection,
          ectopia lentis, dolichostenomelia, scoliosis, dural ectasia, mitral valve prolapse, and pulmonary
          blebs. Losartan and other angiotensin/TGF-β-axis inhibitors that reduce aortic-wall TGF-β signaling
          provide interventional support for the TGF-β-dysregulation component.'
        notes: 'Retained as CANONICAL. The 2026 falcon hypothesis-search report (kb/hypotheses/Marfan_Syndrome/canonical_fbn1_tgfb_dysregulation_model;
          openscientist timed out) confirms the dual-lesion model: heterozygous FBN1 variants cause microfibrillar
          mechanical failure AND excess bioavailable TGF-β with downstream Smad2/3 activation. Three qualifications:
          (1) the relative contribution of structural-weakness vs TGF-β-signaling components varies by
          tissue and variant — ectopia lentis is primarily structural while aortic aneurysm involves substantial
          TGF-β-driven medial degeneration and matrix remodeling; (2) losartan''s clinical benefit on
          aortic root growth in pediatric MFS is modest in head-to-head trials with atenolol, indicating
          that TGF-β antagonism alone does not fully prevent dissection risk and that hemodynamic stress
          reduction remains critical; (3) Loeys-Dietz syndrome (TGFBR1/TGFBR2 mutations) and related TGF-β-pathway
          disorders display a more aggressive aneurysm phenotype, indicating that the TGF-β-axis can be
          pathogenic even when fibrillin-1 is intact, qualifying the necessity of microfibrillar disruption
          for the aortic phenotype.'
      selected_evidence:
        snippet: Marfan syndrome (MFS) is a hereditary condition caused by mutations in the FBN1 gene.
        supports: SUPPORT
