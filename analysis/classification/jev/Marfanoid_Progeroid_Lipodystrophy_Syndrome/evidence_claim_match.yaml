        modeled_mechanisms:
        - target: Microfibril and Extracellular Matrix Assembly Defect
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Heterozygous rabbits reproduce the connective-tissue, ocular, and aortic features
            of the marfanoid arm.
          limitations: The engineered truncation is not one of the specific human MFLS alleles, and rabbit
            connective-tissue involvement is reported qualitatively rather than against a quantitative
            microfibril-assembly assay.
        - target: Congenital Generalized Lipodystrophy and Extreme Leanness
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Lipodystrophy and growth retardation appear in the heterozygous rabbits and had
            not been reported in prior FBN1 animal models.
          limitations: Dysglycemia accompanies the rabbit lipodystrophy, which does not match the human
            MFLS metabolic phenotype of low fasting insulin with preserved euglycemia and insulin sensitivity;
            the metabolic arm is therefore only partially reproduced.
      selected_evidence:
        snippet: we describe the generation of a rabbit MPL model with C-terminal truncation of fibrillin-1
          using a CRISPR/Cas9 system
