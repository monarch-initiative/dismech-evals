          defective microfibrillar network raises TGF-beta bioavailability and downstream SMAD2 phosphorylation.
          Both a classic Marfan allele and an MFLS allele upregulate SMAD2 phosphorylation in vitro, which
          is why this node is shared with the aortopathy module rather than being MFLS-specific; the causal
          reasoning for MFLS in the primary literature is that TGF-beta signaling is altered by, rather
          than untouched by, the neomorphic truncated protein.
        biological_processes:
        - preferred_term: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
