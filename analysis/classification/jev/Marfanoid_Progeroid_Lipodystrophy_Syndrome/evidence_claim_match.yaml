        discussion_id: mfls_aortic_dissection_risk
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Progressive Aortic Root Dilation
        prompt: Is the lifetime risk of aortic dissection in MFLS the same as, lower than, or higher than
          in classic Marfan syndrome?
        rationale: Aortic root dilation is documented in MFLS and this entry conforms to the aortopathy
          module's dilation node, but no dissection has been reported, and at least one molecularly confirmed
          patient had a normal aortic root through nine years of follow-up. With fewer than a few dozen
          molecularly confirmed patients, most reported in childhood or early adulthood, absence of reported
          dissection carries almost no information. Because the allelic mechanism differs from classic
          Marfan syndrome (NMD-escaping neomorphic protein rather than haploinsufficiency), the aortic
          risk cannot simply be assumed equal, in either direction. This is why the entry deliberately
          does not conform to the module's dissection node.
        proposed_experiments:
        - experiment_id: exp_mfls_aortic_registry
          experiment_design: HUMAN_OBSERVATIONAL
          name: International MFLS registry with prospective aortic imaging
          description: Assemble all molecularly confirmed 3'-FBN1 truncation patients into a registry
            with standardized serial aortic root z-score imaging, and compare dilation trajectories against
            age- and sex-matched classic Marfan cohorts.
      selected_evidence:
        snippet: We review six previous reports between 2000 and 2014 of seven unrelated patients
        supports: SUPPORT
    origin:
