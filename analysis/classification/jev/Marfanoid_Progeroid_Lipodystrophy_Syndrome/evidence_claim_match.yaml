        description: 'Pharmacologic reduction of hemodynamic stress on the aortic wall — the therapy that
          the aortic surveillance in the entry above exists to trigger. In FBN1-related Marfan syndrome,
          beta-blockers or angiotensin receptor blockers are routinely prescribed once aortic root dilation
          is progressive, and GeneReviews recommends initiating therapy at diagnosis at any age.

          This is recorded because MFLS patients have documented aortic root dilation and the entry already
          carries three Marfan-derived surveillance recommendations; carrying the surveillance while omitting
          the therapy it triggers would be internally inconsistent. It is NOT evidence that the therapy
          works in MFLS. No MFLS patient has been reported on either drug class, no aortic outcome has
          been measured in this entity, and the published series is roughly eight to nine patients — so
          the extrapolation is from shared FBN1 aortopathy biology, not from data. All evidence here is
          therefore marked directness INDIRECT, exactly as for the other GeneReviews-derived items.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
