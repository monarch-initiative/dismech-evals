        description: MFLS is autosomal dominant, and every reported case with parental testing arose de
          novo, so recurrence risk to the parents of a proband is low. An affected individual, however,
          has a 50% transmission risk to each child — ordinary Mendelian arithmetic for a heterozygous
          autosomal dominant variant, which transfers from FBN1-related Marfan syndrome to MFLS without
          needing MFLS-specific data because it follows from the mode of inheritance rather than from
          the phenotype.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        notes: 'This is the one GeneReviews-derived item where the extrapolation is not clinical: the
          50% figure is a consequence of autosomal dominant inheritance, which this entry independently
          curates and evidences, not of any Marfan-specific observation. Its evidence is still marked
          directness INDIRECT because the quoted sentence names Marfan syndrome rather than MFLS.'
      selected_evidence:
        snippet: Each child of an individual with Marfan syndrome has a 50% chance of inheriting the pathogenic
          variant and the disorder
        supports: SUPPORT
