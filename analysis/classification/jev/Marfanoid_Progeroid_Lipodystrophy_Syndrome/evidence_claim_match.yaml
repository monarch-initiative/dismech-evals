      assertion_type: Treatment
      assertion:
        name: Multidisciplinary supportive and surveillance care
        description: 'There is no disease-modifying therapy. Management is supportive and follows the
          components of the phenotype: cardiovascular surveillance for aortic root dilation as for any
          fibrillinopathy, ophthalmological management of ectopia lentis and myopia, and nutritional support
          for the very low body weight. No MFLS-specific treatment trial has been performed, and these
          recommendations are extrapolated from the constituent phenotypes rather than tested in this
          entity.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: 'No publication reports a treatment OUTCOME in MFLS, so nothing here is evidenced as effective
          in this entity. The evidence items below are the FBN1-Related Marfan Syndrome GeneReviews recommendations
          that this entry is explicitly extrapolating from, cited so the extrapolation is auditable rather
          than unattributed. They are marked directness INDIRECT for that reason.

          GeneReviews "Agents/circumstances to avoid" for FBN1-related Marfan syndrome includes fluoroquinolone
          antibiotics, which may exacerbate the predisposition for aneurysm and dissection, alongside
          contact/competitive sports and isometric exercise. Whether that caution transfers to MFLS is
          untested, but given the documented aortic root dilation it is recorded here rather than omitted.'
      selected_evidence:
        snippet: Comprehensive management by a multidisciplinary team including a clinical geneticist,
          cardiologist, ophthalmologist, orthopedist, and cardiothoracic surgeon is strongly recommended.
        supports: SUPPORT
        directness: INDIRECT
