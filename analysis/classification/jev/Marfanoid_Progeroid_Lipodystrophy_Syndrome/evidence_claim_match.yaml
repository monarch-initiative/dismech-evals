        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Intrauterine Growth Retardation
        - phenotypes#Premature Birth
        prompt: Why are fetal growth restriction and preterm birth part of MFLS — what do a truncated
          profibrillin-1 and absent asprosin do to placental function or fetal growth?
        rationale: 'Both features are listed among the cardinal characteristics of the entity, yet no
          study addresses their mechanism. The single documented account is circumstantial: in the 2023
          proband fetal growth stopped around 32 weeks, which the authors read as suggesting placental
          insufficiency, inferred from fetal biometry rather than from any placental examination. Whether
          the prenatal phenotype reflects a fibrillin-1 microfibril defect in placental or uterine connective
          tissue, a role for asprosin in fetal energy balance, or something else entirely is unstudied,
          so the entry deliberately draws no causal edge to either phenotype.'
        proposed_experiments:
        - experiment_id: exp_mfls_placental_pathology
          name: Placental examination in molecularly confirmed MFLS births
          description: Collect placental histopathology and biometry prospectively for MFLS births and
            compare against gestational-age-matched controls, to test the placental-insufficiency account
            of the fetal growth arrest.
      selected_evidence:
        snippet: Fetal growth stopped around 32 weeks, suggesting placental insufficiency.
        supports: SUPPORT
