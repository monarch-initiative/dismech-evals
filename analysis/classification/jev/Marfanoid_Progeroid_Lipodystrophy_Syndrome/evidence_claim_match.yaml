              label: progeroid and marfanoid aspect-lipodystrophy syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mfls_lipodystrophy_mechanism_split
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Congenital Generalized Lipodystrophy and Extreme Leanness
        prompt: How much of the congenital lipodystrophy is caused by hypophagia secondary to asprosin
          deficiency, and how much by a cell-autonomous failure of adipocyte differentiation in a fibrillin-1-deficient
          extracellular-matrix niche?
        rationale: 'Three routes are on the table and the literature has not separated them. The hypophagia
          route is well evidenced in patients and rescued in the mouse. A cell-autonomous adipogenic route
          rests on expression dynamics (fibrillin-1 rises as mesenchymal stem cells enter adipogenesis
          and declines as adipocytes mature) and on the conservation of the affected FBN1 region; the
          authors who proposed it state explicitly that a differentiation failure still needs to be shown
          experimentally. A third route proposed in review is purely mechanical — that deficient microfibrils
          change the mechanical properties of the adipose matrix, making it non-permissive for adipocyte
          expansion, independently of both appetite and TGF-beta. The distinction is therapeutically consequential:
          if hypophagia dominates, asprosin replacement or caloric support could restore adipose mass,
          whereas a cell-autonomous or matrix-mechanical block would not respond.'
        proposed_experiments:
        - experiment_id: exp_mfls_adipogenesis_ipsc
          name: Patient-derived iPSC or preadipocyte adipogenic differentiation assay
          description: Differentiate MFLS patient-derived mesenchymal stem cells or preadipocytes to adipocytes
            in vitro, where caloric intake is not a variable, and compare lipid accumulation and adipogenic
            marker induction against isogenic corrected controls and against classic Marfan (NMD-degraded
            allele) cells.
        - experiment_id: exp_mfls_pairfeed_repletion
          name: Pair-feeding and asprosin-repletion in the Fbn1(NPS/+) mouse
          description: Determine what fraction of the fat-mass deficit is recovered by matching caloric
            intake to wild-type littermates, or by chronic asprosin repletion, versus what fraction persists
            — the residual being attributable to a cell-autonomous or matrix-mechanical adipogenic defect.
      selected_evidence:
        snippet: Increased TGF-β signaling, altered mechanical properties and impaired adipogenesis are
          potential causes of adipose tissue dysfunction, mediated through deficient microfibrils.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
