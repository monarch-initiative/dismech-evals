          - preferred_term: angiotensin receptor blocker
            term:
              id: NCIT:C66930
              label: Angiotensin II Receptor Antagonist
        notes: GeneReviews cautions that some antihypertensive classes — calcium channel blockers and
          ACE inhibitors — lack direct evidence for efficacy or safety in Marfan syndrome, so they are
          deliberately not listed as therapeutic agents here.
      selected_evidence:
        snippet: Therapy is generally initiated at the time of diagnosis with Marfan syndrome at any age
