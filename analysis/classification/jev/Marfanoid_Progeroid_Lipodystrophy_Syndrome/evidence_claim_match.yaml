        name: Molecular confirmation of a 3' FBN1 truncating variant
        description: 'Diagnosis rests on identifying a heterozygous truncating FBN1 variant within the
          short 3''-terminal segment (the penultimate exon, its donor site, or the final intron) in an
          individual with congenital generalized lipodystrophy, a progeroid facial appearance, and marfanoid
          features. Variant position is diagnostically decisive: an FBN1 truncating variant located further
          5'' is subject to nonsense-mediated decay and predicts classic Marfan syndrome, not MFLS. Note
          that phenotype alone is not sufficient — the Marfan systemic score was only 5 in one molecularly
          confirmed proband.'
      selected_evidence:
        snippet: all have truncating mutations within a 71-bp segment at the 3′ end of the FBN1 coding
          region, displaying tight genotype-phenotype correlation
        supports: SUPPORT
