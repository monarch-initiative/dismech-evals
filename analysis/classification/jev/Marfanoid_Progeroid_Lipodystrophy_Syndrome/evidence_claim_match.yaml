      assertion:
        name: Progressive Aortic Root Dilation
        conforms_to: aortopathy_tgfbeta_dysregulation#Progressive Aortic Dilation and Aneurysm
        biological_scale: ORGANISM
        description: 'Dilation of the aortic bulb/root is documented in several molecularly confirmed
          MFLS patients and is reproduced in the rabbit model, so the marfanoid arm does reach the aorta.
          It is not, however, universal: at least one molecularly confirmed child had stable mild mitral
          regurgitation with a normal aortic root through nine years of follow-up, so aortic involvement
          is less uniform than in classic Marfan syndrome. Conformance is asserted only to this dilation
          node of the aortopathy module — aortic dissection or rupture, the module''s terminal node, has
          not been reported in MFLS, and the reported case total is far too small to establish or exclude
          that risk. MFLS should nonetheless be managed with the aortic surveillance appropriate to a
          fibrillinopathy.'
        biological_processes:
        - preferred_term: extracellular matrix organization in the aortic wall
          modifier: ABNORMAL
          term:
            id: GO:0030198
            label: extracellular matrix organization
      selected_evidence:
        snippet: who also had Marfan syndrome (MFS; fulfilling the Ghent criteria) with mild skeletal
          features, dilated aortic bulb, dural ectasia, bilateral subluxation of the lens, and severe
          myopia
        supports: SUPPORT
