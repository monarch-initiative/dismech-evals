      assertion_type: Discussion
      assertion:
        discussion_id: mfls_craniofacial_periocular_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Craniosynostosis
        - phenotypes#Dolichocephaly
        - phenotypes#Macrocephaly
        - phenotypes#Hydrocephalus
        - phenotypes#Prominent Forehead
        - phenotypes#Narrow Nasal Ridge
        - phenotypes#Retrognathia
        - phenotypes#Entropion
        prompt: What mechanism produces the cranial and bony facial features of MFLS (craniosynostosis,
          dolichocephaly, macrocephaly with hydrocephalus, the facial gestalt) and the eyelid entropion?
        rationale: These phenotypes are documented but mechanistically unexplained, so the entry deliberately
          draws no causal edge to them. Craniosynostosis is rare in FBN1-related Marfan syndrome yet recurrent
          in MFLS, and TGF-beta signaling is implicated in cranial suture fusion in other connective-tissue
          syndromes (Loeys-Dietz, Shprintzen-Goldberg), which makes the dysregulated TGF-beta node a plausible
          but untested source; the 2023 report reads dolichocephaly as collateral evidence of a craniosynostosis
          spectrum, and the macrocephaly/hydrocephalus of one proband has no proposed mechanism at all.
          For the facial gestalt, loss of facial fat explains the progeroid look (that edge is drawn)
          but not the individual bony elements — prominent forehead, narrow nasal ridge, retrognathia.
          Entropion has two candidate routes, periocular fat loss versus lax tarsal connective tissue,
          and no source examines either.
        proposed_experiments:
        - experiment_id: exp_mfls_cranial_imaging_census
          name: Systematic cranial imaging and suture assessment across MFLS patients
          description: Standardized cranial CT/MR across known molecularly confirmed MFLS patients to
            establish the true frequency of craniosynostosis and hydrocephalus, paired with suture imaging
            or histology in the FBN1 C-terminal-truncation rabbit to test whether the truncated protein
            or TGF-beta dysregulation drives suture fusion.
      selected_evidence:
        snippet: Craniosynostosis is rare in FBN1-related Marfan syndrome but is reported in several cases
          in MFLS
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
