        description: 'The neomorphic gene product. Profibrillin-1 is a 2,871-residue proprotein normally
          cleaved at its C-terminus by furin to yield mature fibrillin-1 plus a 140-residue C-terminal
          peptide. The MFLS variants cluster around that cleavage site and truncate the protein just before
          or within it, leaving an extremely charged terminal motif. That the mutant allele is expressed
          rather than degraded is not merely predicted: in one proband, cycloheximide treatment of lymphoblastoid
          cells failed to change the abundance of the exon-skipped transcript, experimentally confirming
          NMD escape in patient material. The resulting protein is the shared origin of both disease arms
          — it is incorporated into (and perturbs) the microfibrillar matrix, and it destroys the furin
          cleavage event that would have released asprosin.'
