  bd6ebe3f439acf6d2bdf78f639885e04ed1bc15790a909b31633ea67bbb238af:
    claim:
      about:
        disease:
          name: Marfanoid-Progeroid-Lipodystrophy Syndrome
          disease_term:
            preferred_term: progeroid and marfanoid aspect-lipodystrophy syndrome
            term:
              id: MONDO:0014831
              label: progeroid and marfanoid aspect-lipodystrophy syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: FBN1
        association: Heterozygous, de novo truncating (frameshift or splice-site) variants confined to
          a short segment at the extreme 3' end of the FBN1 coding region — the penultimate exon, its
          splice donor site, and the final intron.
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        presence: Positive
        gene_term:
          preferred_term: FBN1
          term:
            id: hgnc:3603
            label: FBN1
        notes: 'The pathogenic mechanism is not haploinsufficiency. Because the variants lie 3'' of the
          last 50 nucleotides of the penultimate exon, the mutant transcript escapes nonsense-mediated
          decay and a stable truncated profibrillin-1 is expressed; this is captured structurally as functional_impact_category
          DOMINANT_NEGATIVE on the initiating pathophysiology node. Reported alleles include c.8155_8156del,
          c.8156_8175del (p.Lys2719Thrfs*12), c.8175_8182del8 (p.Arg2726Glufs*9), the splice variants
          c.8226+1G>A, c.8226+1G>T and c.8226+5G>A, and p.Glu2759Cysfs*9.

          Exon numbering differs between reports and is a recurring source of confusion. The earlier case
          reports and the 2016 naming review place the frameshifts in "exon 64", described as the penultimate
          exon; the asprosin papers and the 2023 Japanese case report, using NM_000138.5, place the same
          region at exons 65-66 with the splice variants in intron 65. The stable description is positional:
          the penultimate exon and the final intron, i.e. the last 71 bp of coding sequence.

          ClinGen''s Gene-Disease Validity curation for FBN1 covers Marfan syndrome (MONDO:0007947, Definitive)
          and does not separately assert MFLS, so no ClinGen assertion is cited here.'
      selected_evidence:
        snippet: all have truncating mutations within a 71-bp segment at the 3′ end of the FBN1 coding
          region, displaying tight genotype-phenotype correlation
        supports: SUPPORT
    origin:
