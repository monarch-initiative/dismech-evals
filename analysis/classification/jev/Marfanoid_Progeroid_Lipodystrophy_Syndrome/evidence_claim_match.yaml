        discussion_id: mfls_mouse_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Stable Truncated Profibrillin-1 with an Altered C-Terminus
        prompt: Do the widely used FBN1 mouse models of Marfan syndrome say anything at all about MFLS,
          given that they were built on a mechanism (haploinsufficiency or dominant-negative missense)
          that MFLS does not use?
        rationale: 'The published FBN1 knockout and dominant-negative mouse models were designed around
          classic Marfan biology and, by the explicit statement of the group that built the rabbit model,
          cannot recapitulate the MFLS genotype-phenotype relationship, because they do not produce a
          stable NMD-escaping C-terminally truncated profibrillin. The models that ARE informative for
          MFLS are the purpose-built asprosin-ablating Fbn1(NPS/+) mouse and the CRISPR rabbit. This matters
          for interpretation: metabolic findings from Marfan mouse models — for example that male Marfan
          mice are predisposed to high-fat-diet obesity, diabetes, and fatty liver — point in the opposite
          direction from the human MFLS metabolic phenotype and should not be transferred to this entity.'
        proposed_experiments:
        - experiment_id: exp_mfls_allele_knockin
          experiment_design: TARGETED_PERTURBATION
          name: Knock-in of a specific human MFLS allele into mouse and rabbit
          description: Generate models carrying an exact reported human MFLS variant (e.g. c.8226+1G>A
            or p.Arg2726Glufs*9) rather than an engineered truncation, and compare microfibril assembly,
            aortic dimensions, adipose mass, plasma asprosin, and glucose/insulin handling against both
            wild-type and a classic Marfan allele in the same background.
      selected_evidence:
        snippet: these mice cannot recapitulate the genotype/phenotype relationship of Marfanoid-progeroid-lipodystrophy
          (MPL) syndrome, which is caused by a mutation in the C-terminus of fibrillin-1, the penultimate
          exon of the FBN1 gene
        supports: SUPPORT
    origin:
