            term:
              id: MONDO:0017604
              label: marginal zone lymphoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Chronic Antigenic Stimulation of Marginal Zone B Cells
        conforms_to: tumor_promoting_inflammation#Chronic Inflammatory Stimulus
        biological_scale: TISSUE
        role: trigger
        description: 'The initiating step across the MZL family is sustained, non-resolving antigenic
          drive rather than a germline lesion. A persistent infection (Helicobacter pylori in the stomach,
          hepatitis C virus in splenic disease, Chlamydia psittaci in the ocular adnexa) or a chronic
          autoimmune process (Sjogren syndrome, Hashimoto thyroiditis) maintains a reactive marginal-zone
          B-cell population at the affected site. This is the step that makes MZL aetiologically heterogeneous
          by anatomical location: which organism or autoimmune process supplies the drive differs by site,
          while the resulting selection pressure on marginal-zone B cells does not.'
        cell_types:
        - preferred_term: marginal zone B cell
          term:
            id: CL:0000845
            label: marginal zone B cell of spleen
        biological_processes:
        - preferred_term: B cell activation
          term:
            id: GO:0042113
            label: B cell activation
          modifier: INCREASED
          temporality: CHRONIC
      selected_evidence:
        snippet: Etiopathogenesis is strongly linked to chronic antigenic stimulation and specific infections
          or autoimmune disorders for extranodal disease.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
