      assertion_type: Discussion
      assertion:
        discussion_id: mzl_three_entity_lump_split
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Deregulation of Marginal Zone B-Cell Differentiation Signalling
        prompt: Is the three-entity division of marginal zone lymphoma a division of distinct diseases,
          or three anatomical presentations of one antigen-driven process that differ mainly in which
          secondary lesion the clone happens to acquire?
        rationale: 'The entities share a cell of origin, a shared aetiological mechanism (chronic antigenic
          drive), a shared convergent effector (constitutive NF-kB activation), and a shared set of background
          lesions (trisomies 3 and 18, 6q23 deletion). They are separated by secondary lesions and by
          anatomical compartment. This is exactly the configuration in which the dismech lump/split question
          is undecided, and the classification literature itself frames it as an open challenge rather
          than a settled nosology. The practical consequence is not cosmetic: it determines whether a
          shared pathograph at this root, or three independent pathographs, is the honest representation.'
      selected_evidence:
        snippet: They share some features, but differ significantly in clinical presentation, associated
          inflammatory conditions, anatomic sites of involvement, and molecular alterations.
        supports: SUPPORT
