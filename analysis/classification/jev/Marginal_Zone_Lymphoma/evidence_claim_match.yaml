  426ee4dab7998ae6828e8c976e5a84c070c019b30d931cb9734160d67fa5056c:
    claim:
      about:
        disease:
          name: Marginal Zone Lymphoma
          disease_term:
            preferred_term: marginal zone lymphoma
            term:
              id: MONDO:0017604
              label: marginal zone lymphoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deregulation of Marginal Zone B-Cell Differentiation Signalling
        biological_scale: MOLECULAR
        role: intermediate
        description: 'The expanded clone acquires lesions in the NOTCH, B-cell-receptor and Toll-like
          receptor pathways that normally specify marginal-zone B-cell identity. This is where the three
          entities diverge: extranodal disease acquires translocations engaging the BCL10-MALT1 axis,
          while splenic and nodal disease acquire KLF2 and NOTCH2 mutations, with 7q deletion largely
          restricted to splenic disease. The entity-specific detail is held in the member entries; what
          belongs at the root is that all three routes converge on the next node.'
        genes:
        - preferred_term: NOTCH2
          term:
            id: hgnc:7882
            label: NOTCH2
        - preferred_term: KLF2
          term:
            id: hgnc:6347
            label: KLF2
        - preferred_term: MALT1
          term:
            id: hgnc:6819
            label: MALT1
        - preferred_term: BCL10
          term:
            id: hgnc:989
            label: BCL10
      selected_evidence:
        snippet: Although trisomies of chromosomes 3 and 18, deletions at 6q23, deregulation of nuclear
          factor kappa B, and chromatin remodeling genes are frequent events in all of them, the three
          MZLs differ in the presence of recurrent translocations, mutations affecting the NOTCH pathway,
          and the transcription factor Kruppel like factor 2 ( KLF2) or the receptor-type protein tyrosine
          phosphatase delta ( PTPRD).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29657712
      reference_title: Recent advances in understanding the biology of marginal zone lymphoma.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The load-bearing shared-versus-distinct statement for this entry: trisomies 3/18,
        6q23 deletion and NF-kB deregulation are common to all three, while translocations, NOTCH-pathway
        mutations, KLF2 and PTPRD separate them.'
