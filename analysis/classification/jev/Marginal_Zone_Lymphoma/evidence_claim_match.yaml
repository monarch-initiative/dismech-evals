      reference: PMID:41026919
      reference_title: 'The biology of marginal zone lymphoma subtypes: challenge and relevance of classification.'
      evidence_source: HUMAN_CLINICAL
      explanation: States the antigen-driven aetiology directly, and scopes the infection/autoimmune link
