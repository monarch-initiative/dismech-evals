      assertion_type: Genetic
      assertion:
        name: SIL1
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: SIL1
          term:
            id: hgnc:24624
            label: SIL1
        notes: SIL1 encodes an adenine nucleotide exchange factor for the ER chaperone HSPA5/BiP. Pathogenic
          variants are predominantly loss-of-function — nonsense, frameshift, splice-site, and single-
          or multi-exon deletions — and, notably, produce severely reduced SIL1 protein regardless of
          variant type or position. That uniform effect on protein level is the proposed explanation for
          why an allelically heterogeneous disease has a relatively homogeneous phenotype.
      selected_evidence:
        snippet: We identified four disease-associated, predicted loss-of-function mutations in SIL1,
          which encodes a nucleotide exchange factor for the heat-shock protein 70 (HSP70) chaperone HSPA5.
        supports: SUPPORT
