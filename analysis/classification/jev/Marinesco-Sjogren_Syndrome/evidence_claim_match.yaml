      assertion_type: Genetic
      assertion:
        name: HYOU1
        relationship_type: MODIFIER
        gene_term:
          preferred_term: HYOU1
          term:
            id: hgnc:16931
            label: HYOU1
        notes: 'HYOU1/ORP150 is a nucleotide exchange factor that works in parallel to SIL1. Its dosage
          modifies the phenotype bidirectionally in Sil1-null mice, which is what makes it a modifier
          rather than an incidental correlate: overexpression prevents ER stress and rescues neurodegeneration,
          and reduced expression makes it worse. Established in mouse; no human modifier effect has been
          demonstrated.'
      selected_evidence:
        snippet: overexpression of HYOU1/ORP150, an exchange factor that works in parallel to SIL1, prevents
          ER stress and rescues neurodegeneration in Sil1(-/-) mice, whereas decreasing expression of
          HYOU1 exacerbates these phenotypes.
        supports: SUPPORT
