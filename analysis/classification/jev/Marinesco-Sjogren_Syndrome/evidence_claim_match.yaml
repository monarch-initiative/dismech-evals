          preferred_term: DNAJC3
          term:
            id: hgnc:9439
            label: DNAJC3
        notes: 'DNAJC3/p58IPK is an ER co-chaperone that promotes ATP hydrolysis by BiP. Its loss ameliorates
          ER stress and neurodegeneration in Sil1-null mice. Note the direction: losing a second chaperone
          component improves the phenotype, which is what points to the nucleotide-exchange cycle itself
          rather than chaperone capacity as the thing that is broken. Established in mouse only.'
      selected_evidence:
        snippet: In addition, loss of DNAJC3/p58(IPK), a co-chaperone that promotes ATP hydrolysis by
          BiP, ameliorates ER stress and neurodegeneration in Sil1(-/-) mice.
