        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sil1_negative_mss_locus_heterogeneity
        kind: KNOWLEDGE_GAP
        prompt: What causes Marinesco-Sjogren syndrome in the 40% of patients with the full clinical triad
          who have no detectable SIL1 variant?
        attaches_to:
        - pathophysiology#SIL1 Loss of Nucleotide Exchange Factor Activity
        rationale: 'The mutation detection rate is 60% (15/25) among patients with the characteristic
          triad. That leaves a substantial minority whose disease is clinically indistinguishable but
          molecularly unexplained. Two readings are possible and the data do not separate them: either
          a second locus in the same BiP nucleotide-exchange pathway, or non-coding and structural SIL1
          variation missed by the screening used. The contrast with the sub-3% detection rate in patients
          with variable, non-triad phenotypes matters here — it says the triad is a sharp clinical entity,
          which makes an unexplained 40% within it harder to dismiss as phenotypic overlap.'
      selected_evidence:
        snippet: We obtained a mutation detection rate of 60% (15/25) among patients with the characteristic
          Marinesco-Sjögren syndrome triad (ataxia, cataracts, myopathy) whereas the detection rate in
          the group of patients with more variable phenotypic presentation was below 3% (1/37).
        supports: SUPPORT
