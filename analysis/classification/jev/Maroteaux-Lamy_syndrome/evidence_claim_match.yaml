        display_name: Slowly progressing MPS VI
        subtype_term:
          preferred_term: Slowly progressing Maroteaux-Lamy syndrome
          term:
            id: MONDO:0017172
            label: mucopolysaccharidosis type 6, slowly progressing
        description: The attenuated end of the MPS VI spectrum, with later onset, slower accumulation
          of somatic dermatan sulfate storage, and life expectancy into the fifth or sixth decade without
          treatment. The same organ systems are involved as in the rapidly progressing subtype, so the
          distinction is one of tempo rather than of which tissues are affected; joint restriction, corneal
          clouding, and valve disease still accrue, and cervical cord compression remains a surveillance
          priority. Intelligence is preserved, as in the rapidly progressing subtype.
      selected_evidence:
        snippet: while slowly progressing patients have a life expectancy into the 5th or 6th decade of
          life
        supports: SUPPORT
