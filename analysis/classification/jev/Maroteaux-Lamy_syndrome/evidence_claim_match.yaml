        context: []
      assertion_type: Subtype
      assertion:
        name: Rapidly progressing
        display_name: Rapidly progressing MPS VI
        subtype_term:
          preferred_term: Rapidly progressing Maroteaux-Lamy syndrome
          term:
            id: MONDO:0017171
            label: mucopolysaccharidosis type 6, rapidly progressing
        description: 'The severe end of the MPS VI spectrum, presenting in early childhood with the full
          somatic picture - coarse facies, short stature, joint and skeletal deformity, corneal clouding,
          recurrent respiratory and ear infection, cardiovascular and pulmonary compromise, and spinal
          cord compression. Untreated life expectancy is limited to the second or third decade. Note that
          unlike the MPS I and MPS II severity splits, the MPS VI split is not about central nervous system
          involvement: intelligence is preserved in both subtypes, because heparan sulfate is not an ARSB
          substrate. What varies is the rate at which somatic dermatan sulfate storage accumulates, which
          is why the subtype names describe progression rate rather than neuronopathic status.'
      selected_evidence:
        snippet: Patients with rapidly progressing disease often have coarse face, short stature, joint
          and skeletal deformities, corneal clouding, recurrent respiratory and ear infections, compromised
          cardiovascular and pulmonary function, spinal cord compression
        supports: SUPPORT
