      assertion_type: Discussion
      assertion:
        discussion_id: mss_mouse_allelic_mechanism_mismatch
        prompt: Does the Nfix-null mouse model MSS, given that it reproduces the skeletal and failure-to-thrive
          phenotype through loss of function rather than the dominant-negative allelic mechanism that
          causes human MSS?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Dysregulated Osseous Maturation
        - animal_models#Mouse
        rationale: The only reported mouse reproduces the MSS skeletal phenotype (spinal deformation,
          decreased bone mineralization) and failure to thrive, but it is Nfix loss of function. In humans,
          NFIX loss of function / haploinsufficiency causes Malan syndrome (overgrowth), not MSS; MSS
          is caused by NMD-escaping dominant-negative alleles. The mouse therefore models the wrong allelic
          mechanism while reproducing the phenotype, so its findings cannot be treated as validating the
          dominant-negative mechanism of human MSS.
      selected_evidence:
        snippet: Nfix-deficient mice are unable to gain weight and die in the first 3 postnatal weeks,
          while they also present with a spinal deformation and decreased bone mineralization.
        supports: SUPPORT
