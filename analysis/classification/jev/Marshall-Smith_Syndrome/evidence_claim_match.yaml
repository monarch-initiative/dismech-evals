      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative NFIX Transcriptional Dysfunction
        description: 'The NMD-escaping mutant NFIX proteins retain a preserved DNA-binding and dimerization
          domain but differ grossly in their C-terminal portion, so they dimerize with and interfere with
          wild-type NFIX transcription-factor function. NFIX is a nuclear factor I family transcription
          factor normally expressed prenatally during human brain development and skeletogenesis; its
          dominant-negative disruption dysregulates the transcriptional programs of those tissues.

          '
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: regulation of DNA-templated transcription
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
          modifier: ABNORMAL
        molecular_functions:
