          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
          modifier: ABNORMAL
      selected_evidence:
        snippet: Predicted MSS-associated mutant NFIX proteins consistently have a preserved DNA binding
          and dimerization domain, whereas they grossly vary in their C-terminal portion.
        supports: SUPPORT
