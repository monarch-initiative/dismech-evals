        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NFIX Truncating Variants Escaping Nonsense-Mediated Decay
        description: 'Marshall-Smith syndrome is caused by heterozygous frameshift and splice-site NFIX
          variants (and recurrent deletions of exons 6 and 7) scattered through exons 6-10. In contrast
          to the exon-2 variants that cause Malan syndrome, the MSS-associated mutant mRNAs are not cleared
          by nonsense-mediated mRNA decay, so they persist and are translated into aberrant, C-terminally
          altered NFIX protein.

          '
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: NFIX
            term:
              id: hgnc:7788
              label: NFIX
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
          description: 'Frameshift, splice-site, and exon 6-7 deletion variants in exons 6-10 escape NMD
            and encode truncated proteins acting in a dominant-negative manner; variants arise de novo.

            '
        biological_processes:
        - preferred_term: escape from nonsense-mediated mRNA decay of mutant NFIX transcript
          term:
            id: GO:0000184
            label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
          modifier: DECREASED
      selected_evidence:
        snippet: MSS-associated mutant mRNAs are not cleared by nonsense-mediated mRNA decay
        supports: SUPPORT
    origin:
