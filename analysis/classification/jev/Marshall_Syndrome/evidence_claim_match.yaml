          bone formation.
        limitations: Morpholino knockdown rather than a genetic allele, so off-target and transient-knockdown
          caveats apply and no stable line is characterised. Zebrafish craniofacial cartilage is not a
          mammalian growth plate, and the human lesion is a dominant-negative chain rather than reduced
          gene product, so this supports the general requirement for col11a1a in cartilage organisation
          rather than the specific human mechanism.
