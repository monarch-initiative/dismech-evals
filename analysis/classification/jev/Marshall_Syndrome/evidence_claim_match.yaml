  876b44bea2a52d46e1c95bcd67f870f2f90e2144485accd1fa076c4aa579c325:
    claim:
      about:
        disease:
          name: Marshall Syndrome
          disease_term:
            preferred_term: Marshall syndrome
            term:
              id: MONDO:0007949
              label: Marshall syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Fibrochondrogenesis
        description: 'The severe recessive end of the same gene, and the most informative contrast in
          this entry. Biallelic COL11A1 variants produce a neonatally severe skeletal dysplasia, while
          the heterozygous dominant-negative alleles produce Marshall syndrome. The comparison is what
          shows that the disorder curated here is not simply "less collagen XI": losing both alleles gives
          a different and far worse disease than contaminating the heterotrimer does.'
        disease_term:
          preferred_term: fibrochondrogenesis
          term:
            id: MONDO:0016068
            label: fibrochondrogenesis
        distinguishing_features:
        - Biallelic COL11A1 rather than a single dominant-negative allele
        - Neonatally severe skeletal dysplasia rather than a survivable multisystem disorder
        - Not a differential in practice; a mechanistic contrast
      selected_evidence:
        snippet: Pathogenic mutations in the gene can result in Stickler syndrome, Marshall syndrome or
          Fibrochondrogenesis.
        supports: SUPPORT
