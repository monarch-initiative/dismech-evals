      assertion_type: AnimalModel
      assertion:
        name: cho/cho chondrodysplasia mouse
        species: Mouse
        genotype: Col11a1 cho allele, homozygous (single-cytidine deletion causing a frameshift and premature
          stop)
        publication: PMID:7859283
        description: 'A spontaneous Col11a1 null that mapped the gene and established what collagen XI
          does. It is the source of the cartilage mechanism in this entry and it is not a model of the
          human disease: it is recessive and null where the human disorder is dominant and dominant-negative,
          and it dies at birth.'
        modeled_mechanisms:
        - target: Defective Heterotypic Collagen II/XI Fibril Assembly
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Cartilage collagen fibrils fail to form normally in the absence of collagen XI,
            which is the assertion this node makes.
          limitations: Complete loss of function, in the homozygote, of a gene that in humans causes disease
            in the heterozygous dominant-negative state. The null removes collagen XI; the human allele
            contaminates it. The two are not the same lesion and the mouse cannot show that a shortened
            chain is worse than no chain.
        - target: Growth Plate Chondrocyte Disorganization
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Growth-plate chondrocyte differentiation and spatial organisation depend on collagen
            XI in the matrix.
          limitations: Neonatally lethal, so it reports on skeletal morphogenesis only and can say nothing
            about the progressive postnatal features - the myopia, the vitreoretinal degeneration, the
            progressive deafness, the adult osteoarthritis - that make up most of the human disease burden.
          readouts:
          - name: Long bone length and metaphyseal width
            target: Growth Plate Chondrocyte Disorganization
            direction: DECREASED
            interpretation: Shortened, metaphyseally widened limb bones as the structural readout of disorganised
              growth-plate cartilage.
      selected_evidence:
        snippet: Mice that are homozygous for the autosomal recessive chondrodysplasia (cho) mutation
          die at birth with abnormalities in cartilage of limbs, ribs, mandible, and trachea.
        supports: SUPPORT
