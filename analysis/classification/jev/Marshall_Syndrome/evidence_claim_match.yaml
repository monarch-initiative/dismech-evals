  13383dfb25476d36a4bcdb98bf60c66d2e697b33ed22d8e10bf6b409363dc7fa:
    claim:
      about:
        disease:
          name: Marshall Syndrome
          disease_term:
            preferred_term: Marshall syndrome
            term:
              id: MONDO:0007949
              label: Marshall syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: COL11A1
        association: Causal heterozygous variant
        gene_term:
          preferred_term: COL11A1
          term:
            id: hgnc:2186
            label: COL11A1
        frequency: The only gene associated with Marshall syndrome.
        notes: 'Two practical points about testing. First, the gene is around 250 kb with 68 exons, and
          large intragenic deletions are a real and previously underestimated share of COL11A1 disease;
          exon sequencing alone will miss them, so a dosage assay belongs in the workup. Second, the variant
          class carries prognostic weight: a 54-bp C-terminal splice variant, and the intron 50 hot spot
          in particular, predicts the Marshall end of the spectrum with its early severe deafness, while
          other lesion classes predict the overlapping Marshall/Stickler picture. That correlation is
          a tendency drawn from two modest cohorts, not a rule to counsel from.'
      selected_evidence:
        snippet: A series of 44 unrelated patients in whom COL2A1 screening demonstrated normal results
          but whose phenotype was nevertheless highly suggestive of either Stickler syndrome (with ocular
          involvement) or Marshall syndrome were investigated for mutations in the COL11A1 gene. Heterozygous
          COL11A1 mutations were found in 10 individuals.
        supports: SUPPORT
    origin:
