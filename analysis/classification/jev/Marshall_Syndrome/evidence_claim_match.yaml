      assertion_type: Pathophysiology
      assertion:
        name: In-Frame Exon Skipping and a Shortened proalpha1(XI) Chain
        biological_scale: MOLECULAR
        description: Because fibrillar collagen exons are sized in multiples of the 9-residue Gly-Xaa-Yaa
          unit, skipping one keeps the reading frame and the triple-helix register intact. The cell therefore
          produces a stable, shortened chain rather than degrading a truncated one - which is precisely
          why the allele is harmful rather than merely null.
      selected_evidence:
        snippet: Because skipping of these exons leaves the message in-frame and the Gly-Xaa-Yaa repeating
          collagen motif in register, this results in mutant collagen α chains capable of co-assembly
          with α chains synthesized from the normal genes, resulting in a dominant negative effect
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
