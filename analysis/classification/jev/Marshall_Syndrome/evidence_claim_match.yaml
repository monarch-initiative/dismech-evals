      assertion:
        name: Stickler syndrome type 2
        description: The allelic neighbour, and the one that matters. Both are COL11A1. The working discriminators
          are the variant class (54-bp C-terminal splice variants track Marshall) and the audiological
          phenotype (earlier and more severe in Marshall), together with the facial gestalt. Neither is
          absolute, and patients with both phenotypes are reported.
        disease_term:
          preferred_term: Stickler syndrome type 2
          term:
            id: MONDO:0011493
            label: Stickler syndrome type 2
        distinguishing_features:
        - Splice variants of the 54-bp C-terminal COL11A1 exons, the intron 50 hot spot in particular
        - Earlier-onset and more severe sensorineural hearing loss
        - More pronounced midfacial hypoplasia and a more distinctive facial gestalt
        - Short stature reported more often
      selected_evidence:
        snippet: In 4/10 patients the phenotype was classified as Marshall syndrome because of early-onset
          severe hearing loss and characteristic facial features. These four patients were all heterozygous
          for a splice site mutation in intron 50.
        supports: SUPPORT
