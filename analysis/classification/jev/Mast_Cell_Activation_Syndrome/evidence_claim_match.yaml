              label: mast cell activation syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mast Cell Surface Receptor Engagement
        biological_scale: MOLECULAR
        description: Mast cell activation is triggered either through classical IgE-dependent FcεRI cross-linking
          by allergen-bound IgE (secondary/allergic MCAS), or through IgE-independent routes -- MRGPRX2
          engagement by basic secretagogues/drugs, complement anaphylatoxins C3a/C5a, physical stimuli,
          or endotoxin -- in idiopathic MCAS where no IgE trigger is identified.
        cell_types:
        - preferred_term: mast cell
          term:
            id: CL:0000097
            label: mast cell
      selected_evidence:
        snippet: The resulting IgE antibodies are secreted by B cells into the systemic circulation, where
          they bind with high affinity to FcεRI on MCs and basophils.
        supports: SUPPORT
    origin:
