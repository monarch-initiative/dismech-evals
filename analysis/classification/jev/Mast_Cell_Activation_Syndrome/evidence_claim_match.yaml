      assertion_type: Pathophysiology
      assertion:
        name: Multisystem Mediator-Driven Symptom Generation
        biological_scale: ORGANISM
        description: 'Released mediators act at end-organ sites: histamine and PGD2 drive vasodilation,
          flushing, and hypotension; histamine and leukotrienes contract smooth muscle (bronchoconstriction,
          GI cramping); increased vascular permeability produces urticaria and angioedema; autonomic engagement
          produces tachycardia and presyncope -- together the episodic, multisystem clinical picture required
          by the consensus diagnostic criteria.'
      selected_evidence:
        snippet: 'Typical clinical manifestations: sudden onset episodes with symptoms typical of MCA
          (see list below), affecting at least two organ systems, and resolving within several hours (often
          meeting anaphylaxis criteria)'
        supports: SUPPORT
    origin:
