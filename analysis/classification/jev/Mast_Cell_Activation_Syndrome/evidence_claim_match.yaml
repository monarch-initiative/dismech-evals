      assertion_type: Diagnosis
      assertion:
        name: Consensus diagnostic criteria (Akin, Valent, Metcalfe 2010; refined 2019-2020)
        description: 'All three criteria are required: episodic symptoms consistent with mast cell mediator
          release affecting two or more organ systems; an event-related increase in a validated serum
          or urinary mediator marker (preferably tryptase meeting or exceeding baseline x 1.2 + 2 ng/mL,
          drawn within four hours of an episode); and a decrease in frequency or severity, or resolution,
          of symptoms with anti-mediator therapy. A clonal mast cell disorder and well-defined secondary
          causes must be excluded before the idiopathic label is assigned.'
        markers: Event-related serum tryptase rise; urinary N-methylhistamine; urinary 11-beta-prostaglandin
          F2alpha
      selected_evidence:
        snippet: patients with a presumptive diagnosis of “MCAS” must have two or more of the organ manifestations
          of mast cell activation such as flushing, urticaria, diarrhea, wheezing. The diagnosis requires
          that a patient has evidence of an elevation in mediators such as serum tryptase, 24-hour N-methylhistamine,
          or 11βPGF2 during at least two episodes with a negative workup for systemic mastocytosis or
          clonal mast cell disease in bone marrow biopsies
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
