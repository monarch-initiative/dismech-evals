        description: Akin et al. (2010) proposed classifying mast cell activation disorders as primary
          (a clonal mast cell disorder is identified), secondary (a well-defined condition is identified
          as the cause of mast cell activation), or idiopathic (neither is found). The classification
          was later extended with combined (both clonal and secondary) and hereditary alpha-tryptasemia-associated
          categories, and is now referred to as the ECNM-AIM consortium classification.
        validation_status:
          status: UNVALIDATED
          rationale: The classification is consensus- and cohort-derived and in wide clinical use, but
            the literature explicitly frames MCAS diagnostic criteria as still evolving, with no formal
            diagnostic-accuracy study establishing operating characteristics for the idiopathic/secondary
            distinction itself.
