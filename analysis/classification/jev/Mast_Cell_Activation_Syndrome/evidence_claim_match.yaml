      assertion_type: Discussion
      assertion:
        discussion_id: mcas_overdiagnosis_underdiagnosis
        kind: KNOWLEDGE_GAP
        prompt: How much of the clinical/patient-facing "MCAS" label reflects consensus-criteria-confirmed
          disease versus a broader, unvalidated symptom complex, and what does that mean for prevalence
          estimates?
        attaches_to:
        - disease#Mast Cell Activation Syndrome
        - prevalence#
        rationale: A 2024 review frames MCAS explicitly as both overdiagnosed (broad multisystem symptom
          complexes labeled MCAS without meeting the three consensus criteria) and underdiagnosed (long
          diagnostic delay before confirmation). A large single-center cohort found only 4.4% of patients
          referred for suspected mast cell disorders met strict criteria for idiopathic MCAS, far below
          popular/patient-facing prevalence claims. Because no general-population prevalence study exists,
          any figure cited for this entry should be read as bounded to a referred, already-selected population,
          and the underlying question -- how common consensus-criteria-confirmed MCAS actually is in an
          unselected population -- remains open.
      selected_evidence:
        snippet: Whether MCAS is a primary syndrome or exists as a constellation of symptoms in the context
          of known inflammatory, allergic, or clonal disorders associated with systemic mast cell activation
          is not well understood
        supports: SUPPORT
