      assertion_type: Genetic
      assertion:
        name: TPSAB1
        gene_term:
          preferred_term: TPSAB1
          term:
            id: hgnc:12019
            label: TPSAB1
        association: 'Genetic modifier: germline TPSAB1 (alpha-tryptase) copy-number gain (hereditary
          alpha-tryptasemia) is not itself a cause of MCAS but raises basal serum tryptase and heightens
          mediator-symptom severity and anaphylaxis risk when co-occurring with clonal or secondary mast
          cell disease.'
        relationship_type: MODIFIER
        variant_origin: GERMLINE
        frequency: 4-6% of the general Caucasian population
        features: Autosomal-dominant germline duplication (most commonly) or triplication of the TPSAB1-encoded
          alpha-tryptase sequence at chromosome 16p13.3, highly penetrant for elevated basal serum tryptase
          but with variable and incomplete penetrance for symptomatic multisystem disease.
      selected_evidence:
        snippet: Individuals harboring alleles encoding three copies of α-tryptase had higher basal serum
          levels of tryptase and were more symptomatic than those with alleles encoding two copies, suggesting
          a gene-dose effect.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27749843
      reference_title: Elevated basal serum tryptase identifies a multisystem disorder associated with
        increased TPSAB1 copy number.
      evidence_source: HUMAN_CLINICAL
      explanation: Demonstrates the gene-dose relationship between TPSAB1 copy number and symptom severity
        that underlies the modifier (not causal) role modeled here.
