        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MKKS chaperonin assembly defect
        conforms_to: bbsome_trafficking#BBS Chaperonin Assembly Defect
        description: Biallelic MKKS/BBS6 variants impair the chaperonin-like BBS assembly complex required
          to build the BBSome. MKKS/BBS6 is a divergent Group II chaperonin-like protein derived from
          the eukaryotic chaperonin CCT/TRiC that resides largely in the pericentriolar material around
          the centrioles; disease-causing mutants adopt an abnormal conformation, fail to localize to
          the centrosome, and are degraded by CHIP-mediated ubiquitination. The same protein additionally
          has a distinct non-ciliary nuclear-cytoplasmic transport function (see downstream).
        genes:
        - preferred_term: MKKS
          term:
            id: hgnc:7108
            label: MKKS
        cellular_components:
        - preferred_term: pericentriolar material
          term:
            id: GO:0000242
            label: pericentriolar material
      selected_evidence:
        snippet: Three additional BBS genes (BBS6, BBS10, and BBS12) have homology to type II chaperonins
          and interact with CCT/TRiC proteins and BBS7 to form a complex termed the BBS-chaperonin complex.
          This complex is required for BBSome assembly.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22500027
      reference_title: Intrinsic protein-protein interaction-mediated and chaperonin-assisted sequential
        assembly of stable bardet-biedl syndrome protein complex, the BBSome.
      evidence_source: IN_VITRO
      explanation: Establishes MKKS/BBS6 as part of the chaperonin complex required for BBSome assembly,
