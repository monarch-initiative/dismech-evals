            label: MKKS
        notes: MKKS (also known as BBS6) encodes a chaperonin-like protein required for BBSome assembly.
          The same gene causes both McKusick-Kaufman syndrome and Bardet-Biedl syndrome 6, making the
          two conditions allelic. The leading allelic model is that complete loss of function biases toward
          Bardet-Biedl syndrome whereas specific (hypomorphic) missense alleles produce the McKusick-Kaufman-restricted
          phenotype.
      selected_evidence:
        snippet: both syndromes are caused by mutations in the MKKS gene
        supports: SUPPORT
