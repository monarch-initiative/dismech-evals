      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_mkks_noncilliary_chd_human_fidelity
        prompt: Does the non-ciliary BBS6 nuclear-cytoplasmic transport / SMARCC1 chromatin-remodeling
          defect actually drive congenital heart disease in human McKusick-Kaufman syndrome patients,
          as it does in the zebrafish and cell models?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Non-ciliary BBS6 nuclear-cytoplasmic transport defect
        - phenotypes#Congenital heart disease
        rationale: 'The nuclear-cytoplasmic transport / SMARCC1 mechanism for MKS congenital heart disease
          is demonstrated in zebrafish and in cell-based assays of the MKS-associated BBS6 H84Y;A242S
          allele, but its fidelity to human cardiac morphogenesis is not yet established. This is a HUMAN_MODEL_MISMATCH
          rather than a generic knowledge gap: a specific non-ciliary mechanism exists in model systems,
          and the open question is its translational validity to the human heart defect.'
        proposed_experiments:
        - experiment_id: exp_mkks_chd_human_cardiac_tissue
          name: Test the BBS6 nuclear-transport/SMARCC1 axis in human cardiac models
          description: Use patient-derived or genome-edited human iPSC-cardiomyocytes / cardiac organoids
            carrying the MKS BBS6 H84Y;A242S allele to test whether BBS6 nuclear-cytoplasmic transport
            and SMARCC1-dependent chromatin remodeling are perturbed and whether cardiac differentiation/morphogenesis
            is affected, establishing or refuting human relevance of the model-system mechanism.
      selected_evidence:
        snippet: Our work identifies a new function for BBS6 in nuclear-cytoplasmic transport, and provides
          insight into the disease mechanism underlying the congenital heart defects in McKusick-Kaufman
          syndrome patients
        supports: SUPPORT
