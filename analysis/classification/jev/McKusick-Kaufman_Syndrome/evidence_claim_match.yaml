              label: McKusick-Kaufman syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Non-ciliary BBS6 nuclear-cytoplasmic transport defect
        description: 'The congenital heart disease of McKusick-Kaufman syndrome appears to arise from
          a non-ciliary function of BBS6, distinct from its BBSome/ciliary role: BBS6 is actively shuttled
          between cytoplasm and nucleus, where it interacts with the SWI/SNF chromatin-remodeling protein
          SMARCC1, and the MKS-associated allele is defective in this transport while preserving cilia
          function. Perturbation of this nuclear-cytoplasmic / chromatin-remodeling axis is proposed to
          underlie the congenital heart defects that distinguish MKS from the largely cilia-driven Bardet-Biedl
          syndrome. NOTE: this mechanism is established in zebrafish and cell models; its fidelity to
          human cardiac morphogenesis remains to be confirmed (see the HUMAN_MODEL_MISMATCH discussion).'
        biological_processes:
        - preferred_term: nucleocytoplasmic transport
          term:
            id: GO:0006913
            label: nucleocytoplasmic transport
          modifier: ABNORMAL
        - preferred_term: chromatin remodeling
          term:
            id: GO:0006338
            label: chromatin remodeling
          modifier: ABNORMAL
        - preferred_term: heart development
          term:
            id: GO:0007507
            label: heart development
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        cell_types:
        - preferred_term: cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: Mutations in BBS6 cause two clinically distinct syndromes, Bardet-Biedl syndrome (BBS),
          a syndrome caused by defects in cilia transport and function, as well as McKusick-Kaufman syndrome,
          a genetic disorder characterized by congenital heart defects
        supports: SUPPORT
