        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mkks_genotype_phenotype_mks_vs_bbs
        prompt: Can MKKS/BBS6 genotype predict whether a patient will manifest the McKusick-Kaufman-restricted
          phenotype (limb + genitourinary) versus full Bardet-Biedl syndrome, and can the two be distinguished
          in the neonatal period?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#MKKS chaperonin assembly defect
        - pathophysiology#BBSome-dependent ciliary cargo trafficking failure
        rationale: The Mkks-null mouse supports a mechanistic model in which complete loss of function
          produces Bardet-Biedl syndrome while specific (hypomorphic) missense alleles produce the McKusick-Kaufman-restricted
          phenotype. At the human clinical level, however, no reliable genotype-phenotype correlation
          has been established and the McKusick-Kaufman triad cannot be reliably differentiated from neonatal
          Bardet-Biedl syndrome, so an early McKusick-Kaufman diagnosis may be reclassified as Bardet-Biedl
          syndrome on follow-up. Whether allele type, modifiers, or oligogenic load resolve this is unresolved.
      selected_evidence:
        snippet: These observations suggest that the complete absence of MKKS leads to BBS while the MKS
          phenotype is likely to be due to specific mutations.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
