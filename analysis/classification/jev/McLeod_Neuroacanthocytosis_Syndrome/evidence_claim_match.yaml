              label: XK-related neurodegenerative disease
        context: []
      assertion_type: Genetic
      assertion:
        name: XK
        gene_term:
          preferred_term: XK
          term:
            id: hgnc:12811
            label: XK
        relationship_type: CAUSATIVE
        association: 'Hemizygous XK loss-of-function variants cause McLeod neuroacanthocytosis syndrome
          in males. About 90 percent are intragenic variants and about 10 percent are Xp21.1 deletions
          involving XK. The deletion class matters clinically beyond XK itself: XK sits adjacent to CYBB,
          so a large deletion can remove both and produce chronic granulomatous disease together with
          McLeod syndrome, and deletions extending further can reach DMD.'
        notes: 'Xp21 gene order places XK next to CYBB, and a deletion large enough to remove both produces
          a patient with chronic granulomatous disease who is also McLeod-positive. This is not merely
          a curiosity: the CGD-McLeod patient needs granulocyte transfusions for infection while being
          at risk of Kx alloimmunization from them, so the two diagnoses interact in management. The KB
          entry Chronic_Granulomatous_Disease already records the McLeod association from the other direction.'
      selected_evidence:
        snippet: A 50 kb deletion was detected by screening DNA from patients with radiolabeled whole
          cosmids, and two transcription units were identified within this deletion. The mRNA expression
          pattern of one of them, designated as XK, correlates closely to the McLeod phenotype
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8004674
      reference_title: Isolation of the gene for McLeod syndrome that encodes a novel membrane transport
        protein.
      evidence_source: HUMAN_CLINICAL
      explanation: The positional cloning that identified XK, and the deletion that led to it.
