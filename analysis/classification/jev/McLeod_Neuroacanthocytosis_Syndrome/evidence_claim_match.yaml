        biological_scale: TISSUE
        description: The arm of the disease that was misnamed for decades. McLeod syndrome was originally
          described as a benign myopathy, but systematic study of ten patients including the original
          index patient found that the muscle weakness and atrophy are predominantly neurogenic rather
          than myopathic. Myopathic changes were present in a minority; every patient had neurogenic changes.
          This is why the entry curates a neuropathy node rather than a myopathy node, with the elevated
          creatine kinase as its biochemical readout.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: Clear but unspecific myopathic changes were found in only four patients. All patients,
          however, had neurogenic changes of variable degree
        supports: SUPPORT
