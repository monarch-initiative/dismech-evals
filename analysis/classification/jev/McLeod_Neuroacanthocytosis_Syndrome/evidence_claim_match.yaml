      assertion_type: DifferentialDiagnosis
      assertion:
        name: Huntington disease
        description: Adult-onset chorea with cognitive decline, psychiatric disturbance and caudate atrophy
          - the clinical and radiological picture McLeod syndrome reproduces closely enough that the autopsy
          series cited here draws the analogy explicitly and models its proposed neuropathological grading
          system on the Huntington one.
        distinguishing_features:
        - Acanthocytosis and the McLeod blood group phenotype are absent in Huntington disease.
        - Elevated creatine kinase is characteristic of McLeod syndrome and not of Huntington disease.
        - Huntington disease is autosomal dominant with a CAG repeat expansion in HTT; McLeod syndrome
          is X-linked.
      selected_evidence:
        snippet: Analogous to Huntington's disease (HD), MLS displays cognitive and behavioural symptoms
          besides the progressive movement disorder
        supports: SUPPORT
