        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: vps13a_xk_scramblase_complex_model
        status: CANONICAL
        description: Loss of XK disables a VPS13A-XK lipid handling complex at membrane contact sites,
          and it is that shared complex failure - not anything specific to the Kell blood group system
          - that produces the neurodegeneration. The model's strength is that it explains why an X-linked
          and an autosomal recessive disease look alike; its weakness is that it does not yet explain
          the caudate selectivity, and the evidence is from overexpression in cultured human cells rather
          than from patient neural tissue.
      selected_evidence:
        snippet: ChAc phenotypes resemble those of McLeod Syndrome, caused by mutations in the XK gene,
          suggesting that XK could be a partner protein for VPS13A
        supports: SUPPORT
