        description: 'Not a mimic but a co-occurrence, and it runs in the other direction: a boy presenting
          with CGD may also be McLeod-positive because one deletion removed both CYBB and XK. That matters
          because CGD management involves granulocyte transfusion, which is exactly what a McLeod patient
          cannot safely receive.'
