        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the Kell-XK Membrane Complex
        biological_scale: MOLECULAR
        description: 'XK and the Kell glycoprotein are joined by a single disulphide bond, Kell Cys72-XK
          Cys347. The two proteins are encoded on different chromosomes - KEL at 7q33, XK at Xp21 - yet
          depend on each other in the membrane, which is why an X-linked defect produces an abnormality
          in a chromosome 7 blood group system. Losing XK abolishes the Kx antigen and markedly weakens
          Kell antigen expression: the McLeod blood group phenotype.'
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
      selected_evidence:
        snippet: A single disulphide bond, Kell Cys 72-XK Cys 347, links Kell to XK
        supports: SUPPORT
