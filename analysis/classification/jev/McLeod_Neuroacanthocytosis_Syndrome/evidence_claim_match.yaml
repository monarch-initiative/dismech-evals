              label: XK-related neurodegenerative disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Kx and Km Alloimmunization Risk
        biological_scale: ORGANISM
        description: 'Because affected males never express Kx or Km, transfused red cells carrying those
          antigens are immunologically foreign. The resulting alloantibodies cause severe transfusion
          reactions, and this is the mechanism behind the disease''s one absolute contraindication. The
          antibody repertoire also differs by genotype: patients whose deletion extends into CYBB, producing
          chronic granulomatous disease alongside McLeod syndrome, are generally held to be able to make
          both anti-Km and anti-Kx, whereas non-CGD McLeod patients were believed to make only anti-Km
          - a belief the cited case report was written to challenge.'
      selected_evidence:
        snippet: Alloantibodies in the Kell and Kx blood group system can cause strong reactions to transfusions
          of incompatible blood and severe anemia in affected male newborns of Kell-negative mothers
        supports: SUPPORT
