      assertion_type: Pathophysiology
      assertion:
        name: Loss of XK-VPS13A Phospholipid Scrambling at Membrane Contact Sites
        biological_scale: MOLECULAR
        description: The mechanistically informative finding, and the one that reframes the disease. XK
          forms a complex with VPS13A - the lipid transfer protein mutated in chorea-acanthocytosis -
          and when overexpressed relocalizes VPS13A from lipid droplets to subdomains of the endoplasmic
          reticulum. Introducing chorea-acanthocytosis disease variants into VPS13A prevents that relocalization.
          Two clinically near-identical neuroacanthocytosis syndromes, one X-linked and one autosomal
          recessive, therefore converge on dysregulation of a single complex.
        molecular_functions:
        - preferred_term: phospholipid scramblase activity
          term:
            id: GO:0017128
            label: phospholipid scramblase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: plasma membrane phospholipid scrambling
          term:
            id: GO:0017121
            label: plasma membrane phospholipid scrambling
          modifier: DECREASED
        cellular_components:
        - preferred_term: endoplasmic reticulum-plasma membrane contact site
          term:
            id: GO:0140268
            label: endoplasmic reticulum-plasma membrane contact site
        notes: The scramblase assignment postdates and supersedes the founding paper's reading of XK as
          a membrane transport protein. Both are curated - the earlier one on the XK Loss of Function
          node - because the transporter description is still what many secondary sources repeat, and
          a curator meeting it should be able to see when and by what it was replaced.
      selected_evidence:
        snippet: it forms a complex with VPS13A in human cells and, when overexpressed, relocalizes VPS13A
          from lipid droplets to subdomains of the endoplasmic reticulum
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
