      assertion:
        name: Chorea-acanthocytosis (VPS13A disease)
        description: The closest mimic and, as it turns out, a mechanistic relative rather than a coincidence.
          VPS13A disease produces acanthocytosis, chorea, psychiatric features and raised creatine kinase,
          and the two proteins form a complex, so the clinical similarity has a molecular basis.
        distinguishing_features:
        - 'Inheritance: McLeod syndrome is X-linked and affects males; chorea-acanthocytosis is autosomal
          recessive and affects both sexes.'
        - 'Blood group serology: the McLeod phenotype - absent Kx and Km with weakened Kell antigens -
          is present only in McLeod syndrome and is what settles the distinction.'
        - Cardiac involvement is prominent in McLeod syndrome and is not a defining feature of chorea-acanthocytosis.
      selected_evidence:
        snippet: ChAc phenotypes resemble those of McLeod Syndrome, caused by mutations in the XK gene
        supports: SUPPORT
