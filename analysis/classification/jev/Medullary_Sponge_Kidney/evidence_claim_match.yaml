        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted GDNF-RET Signaling at the Ureteric Bud-Metanephric Mesenchyme Interface
        biological_scale: MOLECULAR
        description: Proposed developmental origin. Rare heterozygous GDNF regulatory variants were found
          in some patients and cosegregated with MSK in families, and MSK co-occurs with extrarenal anomalies
          of tissues that also depend on GDNF-RET signaling. A later exome study of 42 patients, with
          a screen of a larger variant datastore, found no GDNF, RET or GFRA1 association, so this is
          at most a cause in a subset of patients.
        genes:
        - preferred_term: GDNF
          term:
            id: hgnc:4232
            label: GDNF
        - preferred_term: RET
          term:
            id: hgnc:9967
            label: RET
      selected_evidence:
        snippet: A total of 140 rare variants of RET (n = 107), GDNF (n = 11) and GFR α1 (n = 22) were
          identified in the variant datastore, none was associated with MSK.
        supports: REFUTE
    origin:
