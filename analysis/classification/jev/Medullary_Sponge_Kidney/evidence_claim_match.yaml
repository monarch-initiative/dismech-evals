        name: Urinary Stasis and Intraductal Crystallization
        biological_scale: TISSUE
        description: Slow urine flow through the dilated ducts favors crystallization of calcium oxalate
          and apatite; ductal stones pass into the pelvis and seed larger stones. This mechanism does
          not require a metabolic abnormality.
      selected_evidence:
        snippet: Stones may form over white (Randall's) plaque, but most renal pelvic stones are not attached,
          and have a similar morphology as ductal stones, which are a mixture of calcium oxalate and apatite.
        supports: SUPPORT
