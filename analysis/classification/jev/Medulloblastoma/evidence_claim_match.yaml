        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cerebellar Progenitor Proliferation
        description: All molecular subgroups arise from progenitor populations of the developing cerebellum
          and rhombic lip, and converge on dysregulated proliferation, but they do not share a single
          cell of origin. SHH tumors derive from external-granule-layer granule-neuron precursors; WNT
          tumors from lower-rhombic-lip / dorsal brainstem progenitors; and Group 3 and Group 4 (non-WNT/non-SHH)
          tumors from rhombic-lip-derived progenitors, with Group 4 in particular linked to the unipolar
          brush cell lineage. The subgroup-specific oncogenic pathways (WNT/beta-catenin, Sonic Hedgehog,
          MYC-driven programs) feed a common proliferative phenotype across these distinct progenitor
          lineages. Cell Ontology currently has no class for unipolar brush cells or rhombic-lip progenitors,
          so the non-SHH lineages are bound to the generic neural progenitor cell class.
        cell_types:
        - preferred_term: cerebellar granule neuron precursor (SHH subgroup cell of origin)
          term:
            id: CL:0002362
            label: cerebellar granule cell precursor
        - preferred_term: rhombic lip-derived progenitor (WNT and non-WNT/non-SHH cell of origin)
          term:
            id: CL:0011020
            label: neural progenitor cell
        biological_processes:
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
        - preferred_term: cerebellum development
          modifier: ABNORMAL
          term:
            id: GO:0021549
            label: cerebellum development
        locations:
        - preferred_term: cerebellum
          term:
            id: UBERON:0002037
            label: cerebellum
        - preferred_term: rhombic lip
          term:
            id: UBERON:0006215
            label: rhombic lip
      selected_evidence:
        snippet: Medulloblastoma (MB) is the most common malignant pediatric posterior fossa
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
