        description: The majority of SHH-activated medulloblastomas retain wildtype TP53. Prognosis is
          intermediate between WNT-activated (best) and Group 3 (worst), with approximately 70-80% long-term
          survival. May respond to SHH pathway inhibitors.
      selected_evidence:
        snippet: Recent WHO (2021) guidelines stratified MB into four molecular subgroups with four and
          eight further subgroups for SHH and non-WNT/non-SHH MB, respectively.
        supports: SUPPORT
