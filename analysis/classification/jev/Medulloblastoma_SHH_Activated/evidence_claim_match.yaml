      assertion_type: Subtype
      assertion:
        name: SHH-Activated, TP53-Mutant Medulloblastoma
        description: Approximately 10-15% of SHH-activated medulloblastomas harbor TP53 mutations, often
          associated with Li-Fraumeni syndrome (germline TP53 mutation). These tumors have significantly
          worse prognosis (approximately 40-50% survival), often show large cell/anaplastic histology
          and chromothripsis.
      selected_evidence:
        snippet: recent molecular analyses have subdivided SHH MB into several subtypes with distinct
          characteristics such as age, TP53 mutation, MYC amplification, presence of metastases, TERT
          promoter alterations, PTEN loss, and other chromosomal alterations as well as SHH pathway-related
          gene mutations.
        supports: SUPPORT
