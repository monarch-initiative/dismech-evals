        description: 'Sustained TGF-beta signalling accompanies the wall remodelling that permits dilatation,
          but the earlier wording put it in the wrong layer: the increase in the media was slight, and
          significantly more pronounced in the adventitia, which is the major site of biglycan deposition.'
