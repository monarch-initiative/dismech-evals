      assertion:
        name: Increased TGF-beta Signaling in the Aortic Wall
        biological_scale: TISSUE
        description: 'Fluorescent staining of the aortic wall shows increased nuclear pSMAD2, the canonical
          readout of active TGF-beta signalling. This is the mechanistic link to the wider heritable-aortopathy
          literature, where TGF-beta dysregulation is the recurring theme. It is also the least settled
          part of the model: how loss of biglycan produces it is described by the discoverers themselves
          as largely unresolved, and a 2025 family found the aortic-wall signal without a matching change
          in patient dermal fibroblasts.'
        biological_processes:
        - preferred_term: transforming growth factor beta receptor signaling pathway
