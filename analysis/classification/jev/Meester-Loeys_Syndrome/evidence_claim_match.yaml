              id: MONDO:0010515
              label: Meester-Loeys syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mrls_tgfbeta_tissue_discordance
        kind: CONTROVERSY
        attaches_to:
        - pathophysiology#Increased TGF-beta Signaling in the Aortic Wall
        prompt: Is TGF-beta dysregulation in MRLS a property of the aortic wall specifically, and can
          patient dermal fibroblasts report it at all?
        rationale: 'The aortic-wall finding is replicated: increased nuclear pSMAD2 in 2017, TGF-beta/SMAD
          dysregulation in a second family in 2025. But in that same 2025 study, reporter assays in cell
          lines expressing mutant biglycan showed *reduced* canonical Wnt and TGF-beta activity, and the
          patients'' own dermal fibroblasts showed no consistent difference in nuclear beta-catenin or
          p-SMAD2/3 against controls. Three results, three directions. The most economical reading is
          that the signalling change is tissue-specific to the arterial media and that dermal fibroblasts
          are simply the wrong cell, which would matter because fibroblasts are the accessible tissue
          and the one the iPSC line is derived from. The alternative, that the increase is a downstream
          consequence of wall injury rather than a driver, is not excluded. The pathophysiology node states
          the observation and the review''s own verdict that the functional consequences remain largely
          elusive, rather than asserting a mechanism.'
      selected_evidence:
        snippet: However, patients' dermal fibroblasts did not show consistent differences in the nuclear
          abundance of β-catenin or p-SMAD2/3 compared to cells from controls.
        supports: REFUTE
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
