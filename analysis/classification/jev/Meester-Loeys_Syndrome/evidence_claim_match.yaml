      assertion_type: HistopathologyFinding
      assertion:
        name: Preserved elastic fibres with low to normal collagen content
        description: The finding that separates this disease from the classic TGF-beta vasculopathies
          it resembles clinically. The paper draws the contrast with both Marfan and Loeys-Dietz, where
          collagen content increases and elastic fibres break; in the MRLS probands the elastin was normal
          and collagen was low to normal. Of the evidence below, the first item is the staining description
          itself; the two that follow it are the paper's Results and Discussion statements of the contrast,
          the Results naming Loeys-Dietz only and the Discussion naming both syndromes. A mechanism routed
          only through TGF-beta would predict the opposite, so this is the histological constraint any
          account of the disease has to satisfy.
        finding_term:
          preferred_term: preserved elastic fibres with low to normal collagen content in the aortic wall
      selected_evidence:
        snippet: The staining revealed low to normal collagen content; elastin fibers appeared normal
        supports: SUPPORT
