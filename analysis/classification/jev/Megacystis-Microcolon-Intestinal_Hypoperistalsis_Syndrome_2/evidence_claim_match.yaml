              label: megacystis-microcolon-intestinal hypoperistalsis syndrome 2
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Normal or non-specific intestinal histopathology
        description: 'A negative finding with real diagnostic weight. Intestinal tissue from patients
          with MYH11-variant visceral myopathy shows nothing diagnostic: routine histology and electron
          microscopy find only non-specific changes attributable to distension, and immunohistochemistry
          against a panel of smooth muscle proteins including MYH11 is indistinguishable from controls.

          Two things follow. Clinically, tissue is often taken before mutational analysis, so a normal
          biopsy is the expected result in this disease and does not exclude it - the authors'' own recommendation
          is to go to molecular genetics when pseudo-obstruction has normal or non-specific pathology.
          Mechanistically, MYH11 immunoreactivity being preserved says the defect is functional rather
          than one of protein absence in these patients, which sits alongside the Western blot showing
          reduced protein in a different patient and is not obviously reconcilable with it. Both are recorded.'
        finding_term:
          preferred_term: normal muscularis propria morphology and smooth muscle immunophenotype
      selected_evidence:
        snippet: Apart from non-specific changes (e.g., muscle hypertrophy and distension-related muscularis
          propria necrosis), no alterations were identified by routine histopathological evaluation or
          electron microscopy.
        supports: SUPPORT
