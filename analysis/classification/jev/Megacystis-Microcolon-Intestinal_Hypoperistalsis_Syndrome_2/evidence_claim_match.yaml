      assertion_type: EpidemiologyInfo
      assertion:
        name: Female predominance
        description: 'Roughly seven in ten reported MMIHS patients are female, and the figure is stable
          across independent systematic reviews two decades apart: 70.6 per cent of 227 cases reviewed
          to 2011, 73 per cent of 121 to 2016, and 16 of 19 in the Japanese national survey. Berdon''s
          original 1976 description was of five female neonates.

          This is a syndrome-level figure across all causative genes, not a MYH11-specific one, and it
          is drawn from published case reports rather than from a population denominator, so ascertainment
          bias cannot be excluded. It is recorded because a skew this large and this reproducible is not
          what an autosomal recessive mechanism predicts; the open question that raises is curated in
          `discussions`.'
        minimum_value: 70.6
        maximum_value: 84.2
        unit: percent of reported cases that are female
      selected_evidence:
        snippet: A clear preponderance for female infants was found (female 70.6 vs. male 29.4%).
        supports: SUPPORT
