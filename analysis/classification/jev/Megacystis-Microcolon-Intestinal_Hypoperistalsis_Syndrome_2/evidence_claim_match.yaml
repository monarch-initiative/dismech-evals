          disease_term:
            preferred_term: megacystis-microcolon-intestinal hypoperistalsis syndrome 2
            term:
              id: MONDO:0025708
              label: megacystis-microcolon-intestinal hypoperistalsis syndrome 2
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Ganglion cells present, excluding Hirschsprung disease
        description: 'The differential-diagnostic finding, and the reason a rectal suction biopsy is usually
          the first tissue taken. MMIHS presents as neonatal functional bowel obstruction, which is Hirschsprung
          disease until proven otherwise - and what proves otherwise is the presence of ganglion cells
          in the biopsy. MMIHS is formally classified among the "variants of Hirschsprung''s disease",
          a group defined by clinically resembling it *despite* normal ganglion cells, and the classification
          lists it explicitly as a congenital smooth muscle cell disorder within that group.

          The point is that the negative here is doing diagnostic work in a way the negative in the entry
          above is not. A normal muscularis propria does not exclude MMIHS and is the expected result;
          present ganglion cells do exclude the main alternative. The two findings are usually reported
          from the same specimen and are easily conflated.'
        finding_term:
          preferred_term: ganglion cells present in rectal suction biopsy
        notes: '`finding_term` is deliberately left unbound, and the reason is the shape of the finding
          rather than a gap in the search. What is being recorded is the *presence* of a normal cell population,
          and the ontologies this slot draws on describe abnormalities: HP codes aganglionosis and abnormal
          enteric nervous system morphology, NCIT''s histopathology branch codes morphologic findings
          rather than their absence, and CL:0007011 names the enteric neuron as a cell type rather than
          as a biopsy result. Binding any of those would assert an abnormality where the whole point is
          that there is none. Searched HP, NCIT and CL; no term beats a wrong one.'
      selected_evidence:
        snippet: '"Variants of Hirschsprung''s disease" are conditions that clinically resemble Hirschsprung''s
          disease (HD), despite the presence of ganglion cells in rectal suction biopsies.'
        supports: SUPPORT
