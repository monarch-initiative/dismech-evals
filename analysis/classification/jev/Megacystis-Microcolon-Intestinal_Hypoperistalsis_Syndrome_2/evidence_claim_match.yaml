      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: residual_function_sets_onset
        hypothesis_label: Whether residual MYH11 function sets age of onset along a continuum
        status: EMERGING
        description: 'MMIHS is defined as a congenital disease, but a family carrying a whole-gene deletion
          in trans with an in-frame hypomorphic allele presented in adulthood - a brother with severe
          bladder dysfunction and intestinal obstruction at 38, a sister with end-stage kidney disease,
          neurogenic bladder and recurrent sigmoid volvulus at 30. If that is the same disease with more
          residual motor function, then "congenital MMIHS" and "adult visceral myopathy" are two points
          on one dose-response curve rather than two entities, and adults with unexplained visceral myopathy
          are an under-tested group.

          The evidence is one family, described by its authors as the second such report. An alternative
          reading - that the in-frame allele produces a qualitatively different protein rather than less
          of the same function - is not excluded by the data available.'
      selected_evidence:
        snippet: The 38 years-old brother had severe bladder dysfunction and intestinal obstruction, whereas
          the 30 years-old sister suffered from end-stage kidney disease with neurogenic bladder and recurrent
          sigmoid volvulus.
        supports: SUPPORT
