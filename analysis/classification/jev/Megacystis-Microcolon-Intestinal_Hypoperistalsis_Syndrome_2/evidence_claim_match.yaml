            name: Loss of Smooth Muscle Myosin Heavy Chain Protein
            description: Smooth muscle myosin heavy chain is the force-generating motor of visceral smooth
              muscle. Without it the thick filament has no head to cycle against actin, so the contractile
              apparatus is structurally present but cannot do work. This is why the downstream failure
              is functional rather than obstructive.
            biological_scale: MOLECULAR
            cell_types:
            - preferred_term: smooth muscle cell
              term:
                id: CL:0000192
                label: smooth muscle cell
            cellular_components:
            - preferred_term: muscle myosin complex
              term:
                id: GO:0005859
                label: muscle myosin complex
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Failure of Visceral Smooth Muscle Contraction
        causal_link_type: DIRECT
        description: The motor protein is the thing that contracts; removing it removes contraction.
      selected_evidence:
        snippet: Previous studies showed that loss of Myh11 function in mice causes a bladder and intestinal
          phenotype that is highly reminiscent of MMIHS.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1/downstream/0
      evidence_path: /pathophysiology/1/downstream/0/evidence/0
