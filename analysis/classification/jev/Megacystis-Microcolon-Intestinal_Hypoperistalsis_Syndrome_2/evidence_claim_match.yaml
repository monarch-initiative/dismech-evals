      assertion_type: Discussion
      assertion:
        discussion_id: mmihs_female_predominance_mechanism
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - epidemiology#Female predominance
        - disease#Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome 2
        prompt: Why are roughly seven in ten reported MMIHS patients female, when the causative genes
          are autosomal and the MYH11 form is recessive?
        rationale: 'An autosomal recessive mechanism predicts an even sex distribution. The observed skew
          is large, it holds at 70.6 per cent across 227 literature cases, 73 per cent across 121, and
          16 of 19 in a national survey that is not subject to publication bias, and it was present in
          the original 1976 description of five female neonates.

          Three readings are available from the evidence curated here and none is settled. It may be ascertainment:
          most of these figures come from published case reports, and a male infant with a distended bladder
          is more likely to be worked up for posterior urethral valves and classified there. It may be
          sex-specific modification of a common pathway - the syndrome is genetically heterogeneous and
          is dominated by ACTG2 rather than MYH11, so the skew may not belong to this gene at all. Or
          it may be survival: if affected males die earlier or in utero, the reported series are the survivors.

          Nothing in the curated sources distinguishes these. It is recorded as an open question rather
          than curated into the pathograph because a sex effect with no proposed mechanism is not a mechanism,
          and because the honest thing to say about the most reproducible epidemiological fact in this
          disease is that it is unexplained.'
      selected_evidence:
        snippet: ACTG2 (15/19) was the most common causative gene variant, followed by MYH11 (2/19), MYLK
          (1/19), and LMOD1 (1/19).
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
