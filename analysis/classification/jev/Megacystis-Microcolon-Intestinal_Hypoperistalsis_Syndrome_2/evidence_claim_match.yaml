      assertion_type: Genetic
      assertion:
        name: MYH11
        association: Causal
        gene_term:
          preferred_term: MYH11
          term:
            id: hgnc:7569
            label: MYH11
        notes: Biallelic loss-of-function MYH11 variants cause the recessive form of MMIHS. Reported alleles
          include homozygous c.3598A>T (p.Lys1200Ter) in a consanguineous Algerian family, compound heterozygous
          c.2051G>A (p.R684H) and c.3540_3541delinsTT in a Chinese family, a 1.3 Mb 16p13.11 deletion
          encompassing MYH11 in trans with c.379C>T (p.Pro127Ser), and a 1.2 Mb deletion in trans with
          the in-frame c.2578_2580del (p.Glu860del) in the late-onset family. Two of the four involve
          a copy-number event, so sequencing alone can miss the diagnosis and copy-number analysis is
          needed alongside it. MYH11 accounted for 2 of 19 molecularly diagnosed patients in the largest
          contemporary cohort, behind ACTG2.
      selected_evidence:
        snippet: All together, these observations strongly suggest that loss-of-function variants in MYH11
          cause MMIHS.
        supports: SUPPORT
