        hypothesis_label: Whether the mechanism of MYH11 disruption, not the gene, determines which smooth
          muscle bed fails
        status: EMERGING
        description: 'MYH11 is a disease gene at least three times over, and the entry point for each
          disease is a different kind of lesion rather than a different gene. Dominant-negative missense
          alleles cause familial thoracic aortic aneurysm and dissection. Biallelic null alleles cause
          this visceral myopathy. And heterozygous protein-elongating frameshifts at the 3'' end, affecting
          the SM2 isoforms, cause a dominantly inherited severe oesophageal, gastric and intestinal dysmotility
          syndrome whose authors propose a third mechanism again - dominant hypercontractile loss of function
          - explicitly distinct from the other two.

          That third arm is the one that makes this a hypothesis about mechanism rather than a two-way
          table. It shares an organ system with MMIHS and an inheritance pattern with the aortic disease,
          so neither "dominant means vascular" nor "gastrointestinal means recessive" survives it. The
          phenotypes otherwise barely overlap, and the mother in the late-onset family - an obligate carrier
          of a hypomorphic allele - had a normal cardiac and vascular assessment.

          The proposal is that this is a statement about mechanism rather than about expression: a poisoned
          motor incorporated into an otherwise intact filament is a different lesion from an absent motor,
          and vascular and visceral smooth muscle apparently tolerate the two differently. The authors
          of the founding MYH11 MMIHS report state this directly.

          What is not established is why. Both tissues express MYH11, so the explanation cannot be that
          one is spared. Candidate accounts - differences in isoform usage, in the mechanical demands
          placed on the filament, or in compensation by other myosins - are not tested in the literature
          curated here, though the third arm makes isoform usage the most concrete of them, since those
          variants are specific to SM2. The practical consequence is that carrier relatives of a visceral
          case should not be assumed to carry aortic risk, and vice versa; that inference is exactly what
          this hypothesis leaves open.'
