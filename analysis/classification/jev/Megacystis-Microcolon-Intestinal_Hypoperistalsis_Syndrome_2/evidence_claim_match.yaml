      assertion:
        name: Reported survival
        description: Survival figures for MMIHS range widely and the range is the honest statement. The
          oldest and largest systematic review reported 19.7 per cent of 218 patients surviving; the Japanese
          national survey reported 63 per cent at five years and 57 per cent at ten; a later literature
          review reported 57 per cent; and a recent 26-patient cohort reported 88 per cent. The trend
          is real - parenteral nutrition, intestinal rehabilitation and transplantation have improved
          outcomes, and patients now live into the second decade - but the highest figure comes from the
          smallest and most recent series and should not be read as the expected outcome.
        minimum_value: 19.7
        maximum_value: 88.0
        unit: percent surviving
        notes: All syndrome-level, across causative genes. The denominators differ (218, 19, 121, 26)
          and so do the follow-up intervals, so these are not directly comparable.
      selected_evidence:
        snippet: 'Survival rate was 19.7% (survivors: n = 43, non-survivors: n = 175), the oldest survivor
          being 24 years old.'
