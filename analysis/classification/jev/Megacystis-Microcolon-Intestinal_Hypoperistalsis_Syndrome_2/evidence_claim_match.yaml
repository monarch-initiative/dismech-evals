  c813af7e058f6f5858a48d1106df1e3dc7590bfc45c2341dda3533114babefeb:
    claim:
      about:
        disease:
          name: Megacystis-Microcolon-Intestinal Hypoperistalsis Syndrome 2
          disease_term:
            preferred_term: megacystis-microcolon-intestinal hypoperistalsis syndrome 2
            term:
              id: MONDO:0025708
              label: megacystis-microcolon-intestinal hypoperistalsis syndrome 2
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Myh11 heterozygous knockout mouse
        species: Mouse
        genotype: Myh11+/- heterozygous knockout
        publication: PMID:41797110
        description: 'The first purpose-built MMIHS model for this gene, and the one thing to read carefully
          about it is the genotype. Human MMIHS2 is recessive: patients carry two damaged MYH11 alleles
          and their unaffected parents carry one. This mouse is a heterozygote. It nonetheless develops
          a markedly enlarged bladder, a thickened smooth muscle layer, collagen deposition, reduced voiding
          frequency, increased post-void residual volume and slowed bladder contraction, which is the
          human megacystis phenotype in miniature.

          So the model reproduces the phenotype through a dose that does not produce disease in humans.
          That is worth stating plainly rather than smoothing over: it makes the mouse a good readout
          of what losing Myh11 does to a bladder, and a poor model of the human genotype-phenotype relationship.
          The intestinal arm is mild in the mouse - prolonged transit and raised faecal water content
          - where in patients it is the lethal half of the disease, so the microcolon and the functional
          obstruction are not modelled here at all.'
        modeled_mechanisms:
        - target: Bladder Failure with Megacystis
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Enlarged bladder volume, raised bladder-to-body weight ratio, thickened smooth
            muscle, collagen deposition, and the functional counterpart - reduced voiding frequency with
            raised residual volume.
          limitations: The mouse is heterozygous where the human disease is biallelic, so the allele dose
            that produces the phenotype here is the carrier dose in patients. Bladder wall thickening
            with collagen deposition and active proliferation is also a remodelling response that human
            MMIHS bladders are not reported to share in this form.
          divergences:
          - divergence_type: POPULATION_MISMATCH
            materiality: QUALIFYING
            description: Human obligate carriers of a single MYH11 loss-of-function allele are unaffected
              - the mother in the late-onset family had a normal assessment - while the model's whole
              phenotype arises at exactly that dose. The comparison the model supports is Myh11-low versus
              Myh11-normal bladder, not patient versus carrier.
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: Microcolon is absent from the model and the intestinal phenotype is mild dysmotility.
              The gastrointestinal failure that determines survival in patients is outside the boundary
              of what this mouse reproduces, so it cannot speak to parenteral nutrition dependence or
              its complications. Recorded as a boundary omission because ModelDivergenceTypeEnum has no
              value for an incomplete phenotype, which is the more exact description.
          - divergence_type: SCALE_EXTRAPOLATION
            materiality: QUALIFYING
            description: 'The model observes tissue - bladder wall thickness, collagen content, muscle
              tension, void volumes - while this node is an organism-level claim about a failing bladder
              in a patient. One step of upward extrapolation, so the organ failure is inferred from the
              tissue measurements rather than observed. Recorded explicitly to agree with `model_scale:
              TISSUE` against the node''s `biological_scale: ORGANISM`.'
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Mouse and human visceral smooth muscle differ in ways this model cannot control
              for, and the human disease is defined partly by a prenatal presentation - megacystis on
              antenatal ultrasound with polyhydramnios or normal fluid - that a mouse study does not assess
              at all. A second, independent gap alongside the allele-dose one above.
          readouts:
          - name: Post-void residual urine volume
            target: Bladder Failure with Megacystis
            direction: INCREASED
            interpretation: The functional measure of the failure to empty, rather than the anatomical
              one - a bladder can be large without being a failing bladder.
        - target: Failure of Visceral Smooth Muscle Contraction
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Muscle tension assays showed slowed bladder contraction, which is a direct measurement
            of the contractile defect this node names rather than an inference from organ size.
          limitations: Measured in bladder, not in bowel. The node covers visceral smooth muscle generally,
            and the intestinal contractile apparatus is assessed only indirectly here, through transit
            time.
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The intestinal half of this node is represented by whole-gut transit time, which
              is an outcome of contraction rather than a measurement of it. The bladder half is measured
              directly by muscle tension assay; the two are not equivalent evidence.
      selected_evidence:
        snippet: Myh11+/- mice successfully recapitulate the core bladder phenotypes of MMIHS, including
          megacystis and voiding dysfunction.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41797110
      reference_title: Myh11 haploinsufficiency recapitulates megacystis and voiding dysfunction in a
        mouse model of MMIHS.
      evidence_source: MODEL_ORGANISM
      explanation: The authors' own statement of what the model does and does not cover - bladder phenotypes,
        not the whole syndrome.
