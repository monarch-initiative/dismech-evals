        biological_scale: CELLULAR
        description: Reduced GlialCAM in astrocytes leaves MLC1 off the membrane, impairs activation of
          the volume-regulated anion current (VRAC, carried by LRRC8 channels) and increases vacuolation,
          as MLC1 loss does. Co-expressing GlialCAM with mutant MLC1 restores VRAC currents. In acute
          brain slices from Glialcam-null mice, cortical astrocytes recover volume less well after potassium-induced
          swelling, so the defect is not an artefact of culture. The link from the MLC1-GlialCAM complex
          to LRRC8 appears indirect, through signalling rather than physical association.
