        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: gap_junction_coupling_potassium_buffering
        hypothesis_label: Reduced astrocyte gap junction coupling contributes to the disturbed potassium
          dynamics
        status: EMERGING
        description: 'A candidate second route from GlialCAM loss to the seizures, running outside the
          MLC1 complex. Conditional deletion of Hepacam from developing mouse astrocytes impairs gap junction
          coupling and shifts the balance between synaptic excitation and inhibition, and gap junction
          coupling carries part of astrocyte potassium buffering. Three things keep it a hypothesis: the
          coupling defect was produced by a conditional knockout in otherwise wild-type mice rather than
          by a patient allele, coupling is only modestly reduced in the germline Glialcam-null mouse where
          the syncytium stays electrically isopotential, and no study has connected reduced coupling to
          the seizures of MLC2A.'
      selected_evidence:
        snippet: conditional deletion of Hepacam from developing astrocytes significantly impairs gap
          junction coupling between astrocytes and disrupts the balance between synaptic excitation and
          inhibition.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
