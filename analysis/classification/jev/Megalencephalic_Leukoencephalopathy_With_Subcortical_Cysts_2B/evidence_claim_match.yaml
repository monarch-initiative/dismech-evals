      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: developmental_window_for_glialcam_function
        hypothesis_label: The partial loss of GlialCAM function matters only while the perivascular astrocyte
          complex is being assembled
        status: EMERGING
        description: The proposed explanation of the remission. One wild-type allele is expressed and
          the mutant protein keeps part of its chaperone activity, so the reduction of junctional GlialCAM,
          MLC1 and ClC-2 is partial; the suggestion is that this partial reduction is enough to cause
          white matter edema while the MLC1-GlialCAM complex is being established at perivascular astrocyte
          junctions in early postnatal life, and not enough to matter once it is established. It stays
          a hypothesis because it was put forward as speculation from the knock-in mouse, because no measurement
          of volume regulation or junctional protein has been made across development in a cell or animal
          with a single dominant allele, and because the one heterozygous knock-in followed longitudinally
          shows regression in one tract alongside progression in another.
      selected_evidence:
        snippet: In agreement with the reversibility of the phenotype observed in MLC2B patients in adult
          stages, a decreased GlialCAM/MLC1 function may not be so pathogenic in adults as it is in infants
        supports: SUPPORT
