  fb561ed6ac1b1716754603e0b9bd00b2c24ea81ddb5ed6b8096c3285fff291e2:
    claim:
      about:
        disease:
          name: Megalencephalic Leukoencephalopathy With Subcortical Cysts 2B
          disease_term:
            preferred_term: megalencephalic leukoencephalopathy with subcortical cysts 2B, remitting,
              with or without intellectual disability
            term:
              id: MONDO:0013491
              label: megalencephalic leukoencephalopathy with subcortical cysts 2B, remitting, with or
                without intellectual disability
        context: []
      assertion_type: Genetic
      assertion:
        name: HEPACAM
        gene_term:
          preferred_term: HEPACAM
          term:
            id: hgnc:26361
            label: HEPACAM
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: The literature calls the protein GlialCAM or hepaCAM and usually the gene GLIALCAM; the
          HGNC symbol is HEPACAM. Of the 29 GLIALCAM variants reported in MLC patients, 11 act dominantly
          and cause this disease, all in exon 2 and all missense except one single-codon deletion. GeneReviews
          states the molecular criterion for improving MLC as a heterozygous gain-of-function HEPACAM
          variant; the functional studies describe these alleles as reducing delivery of the wild-type
          protein to junctions, which is why the pathophysiology records the impact as dominant negative
          rather than as a gain of function. Patients carrying a dominant variant on one allele together
          with a recessive variant on the other have classic MLC, not this disease.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_3da28582-9929-4fcd-8c77-13dc1705b168-2023-01-12T190000.000Z
        variants:
        - name: p.Arg92Trp (c.274C>T)
          description: The recurrent dominant allele, accounting for four of the five MLC2B patients in
            a Chinese series. It sits in the cis dimerization segment, loses interaction with wild-type
            GlialCAM and reduces the wild-type protein's junctional localization. The same residue carries
            the recessive MLC2A allele p.Arg92Gln.
          clinical_significance: PATHOGENIC
        - name: p.Gly89Ser (c.265G>A)
          description: Dominant cis-interface allele with incorrect junctional localization and impaired
            homo-oligomerization. It is the allele knocked into the Glialcam(dn) mouse line, which with
            the p.Arg92Trp knock-in is one of only two in vivo models of a dominant GLIALCAM variant.
          clinical_significance: PATHOGENIC
        - name: p.Asp128Asn (c.382G>A)
          description: Dominant trans-interface allele. It keeps normal interaction with wild-type GlialCAM
            yet still reduces the wild-type protein's junctional targeting, and it introduces a new N-glycosylation
            site.
          clinical_significance: PATHOGENIC
        - name: p.Gln56Pro (c.167A>C)
          description: Dominant trans-interface allele found in a patient whose MRI and clinical parameters
            improved; it mislocalizes GlialCAM and its partners while still activating ClC-2 like the
            wild-type protein. The variant update classifies it as of unknown significance.
          clinical_significance: UNCERTAIN_SIGNIFICANCE
        - name: p.Arg92Pro (c.275G>C)
          description: Dominant allele first reported in a Chinese patient with MLC2B who had autism and
            absent language, inherited from a mother with transient macrocephaly.
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: Dominant HEPACAM mutations can cause either macrocephaly and mental retardation with
          or without autism or benign familial macrocephaly.
        supports: SUPPORT
