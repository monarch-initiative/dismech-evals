      assertion_type: Pathophysiology
      assertion:
        name: Loss of Junctional MLC1 and ClC-2 at Astrocyte Endfeet
        biological_scale: MOLECULAR
        description: 'GlialCAM is the subunit that brings MLC1 out of the endoplasmic reticulum to astrocyte-astrocyte
          junctions at perivascular and subpial endfeet, and it also targets the ClC-2 chloride channel
          to those junctions and changes its gating. Dominant GlialCAM alleles do not weaken binding to
          MLC1 or to ClC-2 and still modify ClC-2 currents, so the defect is one of position: with less
          GlialCAM at junctions, less MLC1 and ClC-2 are there too. The reduction is partial rather than
          complete, because one wild-type allele is expressed and the mutant protein retains part of its
          chaperone activity, which is the usual explanation for the milder course.'
        genes:
        - preferred_term: HEPACAM
          term:
            id: hgnc:26361
            label: HEPACAM
        - preferred_term: MLC1
