      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: glialcam_developmental_astrocyte_function
        hypothesis_label: A developmental function of GlialCAM outside the endfoot complex produces the
          intellectual disability and autistic features
        status: EMERGING
        description: A candidate account of the part of the phenotype that does not remit. GlialCAM controls
          astrocyte territory, branching and gap junction coupling in mouse cortex, and dominant variants
          expressed in astrocytes of the developing mouse cortex redistribute the protein and lose association
          with Connexin 43, ClC-2 and the potassium channel KCNQ2. Since autistic features are commoner
          here than in the classic forms whose white matter lesion is worse, a route separate from the
          endfoot volume-regulation complex is attractive. It stays a hypothesis because the interactome
          and coupling work used viral overexpression or conditional knockout rather than a patient genotype,
          because no study has connected any of these changes to a cognitive or behavioural outcome, and
          because the human frequencies rest on clinician-reported assessment.
      selected_evidence:
        snippet: HEPACAM encodes hepatic and glial cell adhesion molecule (hepaCAM), also known as GlialCAM,
          an astrocyte-enriched transmembrane protein with important roles in astrocyte territory establishment,
          gap junction coupling, branching organization, synaptic function, and development of the gliovascular
          unit.
        supports: SUPPORT
