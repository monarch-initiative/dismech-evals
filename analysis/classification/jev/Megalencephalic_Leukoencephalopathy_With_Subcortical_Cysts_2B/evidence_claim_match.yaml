        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mlc2b_autism_excess
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why are intellectual disability and autistic features more common in MLC2B, whose white
          matter lesion resolves, than in the classic forms whose lesion persists?
        attaches_to:
        - pathophysiology#Disrupted GlialCAM Interactome in Developing Astrocytes
        - phenotypes#Autistic Behavior
        - phenotypes#Intellectual Disability
        rationale: The developmental phenotype runs opposite to the white matter phenotype, which is hard
          to explain if both follow from the same endfoot defect. Candidate routes exist, including GlialCAM's
          role in astrocyte territory and gap junction coupling and the loss of association with Connexin
          43 and KCNQ2 shown for dominant variants in developing mouse cortex, but none has been connected
          to the cognitive or behavioural phenotype, and the frequency figures themselves come from clinician-reported
          rather than instrument-based assessment.
      selected_evidence:
        snippet: Therefore, while motor symptoms are invariably milder in remitting MLC, the occurrence
          of autistic features is higher. The basis for this difference is not understood.
        supports: SUPPORT
