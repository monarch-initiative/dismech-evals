        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing
        description: 'The diagnosis rests on a single heterozygous pathogenic HEPACAM variant. Because
          the dominant alleles cluster in exon 2 and the recurrent one is p.Arg92Trp, a GLIALCAM result
          has to be read with the mode of inheritance in mind: a second variant on the other allele makes
          the disease classic MLC rather than this one. Testing the parents matters both for counseling
          and for interpretation, since the transmitting parent is often only transiently macrocephalic.'
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: Some patients from the ALC database have a dominant variant on one allele and a recessive
          variant on the second allele. These patients have classic MLC.
        supports: SUPPORT
