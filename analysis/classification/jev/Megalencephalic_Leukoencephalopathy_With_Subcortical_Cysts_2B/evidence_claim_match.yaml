          matter decreases although some cysts or near-cysts usually persist, head circumference frequently
          returns to the normal range, and the early motor delay resolves. No patient has a decline of
          motor function and all remain ambulatory. This is the phase that defines the disease and separates
          it from MLC2A, where the same early picture is followed by motor deterioration from a median
          age of about 5 years.
