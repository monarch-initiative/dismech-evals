              with or without intellectual disability
            term:
              id: MONDO:0013491
              label: megalencephalic leukoencephalopathy with subcortical cysts 2B, remitting, with or
                without intellectual disability
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mlc2b_why_does_it_remit
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does the white matter edema of MLC2B resolve, when the same lesion produced by biallelic
          GLIALCAM variants progresses?
        attaches_to:
        - pathophysiology#Resolution of White Matter Edema
        - progression#Remission
        rationale: 'The remission is the defining feature of the disease and has no established mechanism.
          The leading account, that a partial reduction of GlialCAM and MLC1 function matters only while
          the perivascular astrocyte complex is being assembled, is offered as speculation by its authors
          and has not been tested: nobody has measured regulatory volume decrease, junctional MLC1 or
          brain water across development in cells or animals carrying a single dominant allele. The one
          heterozygous knock-in followed over months shows the lesion regressing in the anterior commissure
          while it increases in the cerebellum, so the model does not settle it either.'
        proposed_experiments:
        - experiment_id: mlc2b_developmental_volume_regulation_time_course
          experiment_design: TARGETED_PERTURBATION
          name: Developmental time course of volume regulation in heterozygous dominant knock-in astrocytes
          description: Measure regulatory volume decrease, junctional MLC1 and ClC-2, and brain water
            content in Glialcam(+/R92W) or Glialcam(+/G89S) mice across the postnatal window in which
            the perivascular complex forms and again in adults, against wild-type and Glialcam-null littermates.
          would_support:
          - pathophysiology#Resolution of White Matter Edema
          supporting_outcome:
          - A volume-regulation and junctional-protein deficit that is present during the early postnatal
            window and has closed by adulthood in the heterozygote, while the null animal's deficit persists.
          refuting_outcome:
          - An equal deficit at both ages in the heterozygote, which would put the remission somewhere
            other than in a developmental window of GlialCAM dependence.
      selected_evidence:
        snippet: With this model, it has been speculated that dominant MLC2B mutations may lead to a minor
          reduction of GlialCAM/MLC1 function, which might be pathogenic in humans only at the early stages
          of life.
        supports: SUPPORT
    origin:
