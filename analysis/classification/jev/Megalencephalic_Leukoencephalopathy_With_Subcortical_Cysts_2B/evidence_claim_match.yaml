              not do. Two structural routes produce the same result. Group D1 alleles (p.Gly89Ser, p.Gly89Asp,
              p.Arg92Trp) sit in the cis dimerization segment and also lose the ability to bind GlialCAM
              in the same cell; group D2 alleles (p.Gln56Pro, p.Ser59Asn, p.Asp128Asn) keep normal homo-oligomerization
              and instead map to the surface modelled as the trans interface between GlialCAM on apposed
