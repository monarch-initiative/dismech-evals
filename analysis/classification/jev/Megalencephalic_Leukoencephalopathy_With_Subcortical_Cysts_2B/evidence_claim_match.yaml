        prompt: Do the tissue-level mechanisms of this disease, inferred from mice, hold in a patient
          heterozygous for a dominant GLIALCAM variant?
        attaches_to:
        - pathophysiology#Loss of Junctional MLC1 and ClC-2 at Astrocyte Endfeet
        - pathophysiology#Intramyelinic Edema and Myelin Vacuolation
        rationale: 'Brain tissue from patients with GLIALCAM-related MLC is unavailable, and the disease
          is mild enough that it is unlikely to become available. So every tissue-level node here rests
          on model systems whose fidelity is in question at exactly the point that matters: the two heterozygous
          knock-ins show white matter vacuoles but no MRI abnormality, the one patient brain studied in
          any form of MLC carried an MLC1 variant and had preserved GlialCAM at junctions, and the measurements
          that bound the dominant allele''s residual chaperone activity were made in homozygous animals
          whose genotype no patient has. This is not an absence of evidence but a translational question
          about the evidence there is.'
        proposed_experiments:
        - experiment_id: mlc2b_patient_ipsc_astrocyte_model
          name: Patient-derived astrocyte model of a dominant GLIALCAM allele
          description: Differentiate astrocytes from induced pluripotent stem cells of a patient heterozygous
            for p.Arg92Trp and an isogenic corrected control, and measure junctional GlialCAM, MLC1 and
            ClC-2 and regulatory volume decrease.
          would_support:
          - pathophysiology#Loss of Junctional MLC1 and ClC-2 at Astrocyte Endfeet
          supporting_outcome:
          - Reduced junctional MLC1 and ClC-2 and impaired volume recovery in the patient astrocytes,
            corrected in the isogenic control, in human cells carrying one dominant allele at its native
            locus and expression level.
          refuting_outcome:
          - Junctional MLC1 and ClC-2 and volume recovery indistinguishable from the corrected control,
            which would put the human mechanism elsewhere than the endfoot complex.
      selected_evidence:
        snippet: However, the amount of GlialCAM and its localization were nearly unaffected, indicating
          that MLC1 is not necessary for GlialCAM expression or targeting.
        supports: SUPPORT
        directness: INDIRECT
