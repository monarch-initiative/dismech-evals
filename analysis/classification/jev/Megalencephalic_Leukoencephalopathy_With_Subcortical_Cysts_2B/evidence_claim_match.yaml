        description: A single heterozygous missense variant in exon 2 of HEPACAM, encoding the first immunoglobulin
          (IgV) domain of GlialCAM, is the whole genetic lesion; the second allele is wild type. Eleven
          of the 29 GLIALCAM variants known from MLC patients act dominantly, all of them in exon 2 and
          all missense except one single-codon deletion. The variant is inherited from a parent in about
          four fifths of cases and arises de novo in the rest. The recurrent allele is p.Arg92Trp, and
          the same residue also carries the recessive MLC2A allele p.Arg92Gln, so the amino acid substituted
          rather than the position decides the mode of inheritance.
