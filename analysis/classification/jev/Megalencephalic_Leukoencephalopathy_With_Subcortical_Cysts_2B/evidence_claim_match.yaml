  093da75cf09ccc7685e72fd25aa1b3a17ed954df3a3614b1f456d28d966fbd84:
    claim:
      about:
        disease:
          name: Megalencephalic Leukoencephalopathy With Subcortical Cysts 2B
          disease_term:
            preferred_term: megalencephalic leukoencephalopathy with subcortical cysts 2B, remitting,
              with or without intellectual disability
            term:
              id: MONDO:0013491
              label: megalencephalic leukoencephalopathy with subcortical cysts 2B, remitting, with or
                without intellectual disability
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dominant Interference With Wild-Type GlialCAM Trafficking
        biological_scale: CELLULAR
        description: Expressed alongside wild-type GlialCAM, a dominant IgV allele reduces the fraction
          of wild-type GlialCAM that reaches cell-cell junctions, which a recessive MLC2A allele does
          not do. Two structural routes produce the same result. Group D1 alleles (p.Gly89Ser, p.Gly89Asp,
          p.Arg92Trp) sit in the cis dimerization segment and also lose the ability to bind GlialCAM in
          the same cell; group D2 alleles (p.Gln56Pro, p.Ser59Asn, p.Asp128Asn) keep normal homo-oligomerization
          and instead map to the surface modelled as the trans interface between GlialCAM on apposed cells.
          Both groups mislocalize GlialCAM itself, as recessive alleles also do, so the dominance lies
          in the effect on the normal allele's product rather than in the mutant protein's own destination.
        genes:
        - preferred_term: HEPACAM
          term:
            id: hgnc:26361
            label: HEPACAM
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        molecular_functions:
        - preferred_term: GlialCAM homophilic cis and trans interaction
          modifier: DECREASED
          term:
            id: GO:0042802
            label: identical protein binding
        biological_processes:
        - preferred_term: protein localization to cell junction
          modifier: DECREASED
          term:
            id: GO:1902414
            label: protein localization to cell junction
        cellular_components:
        - preferred_term: cell-cell junction
          term:
            id: GO:0005911
            label: cell-cell junction
      selected_evidence:
        snippet: These experiments indicated that GlialCAM containing an MLC2A mutation (p.R92Q) did not
          influence the localization at cell–cell junctions of the flag-tagged WT GlialCAM, whereas GlialCAM
          containing two different types of MLC2B mutations (p.R92W and p.D128N) reduced the localization
          of flag-tagged GlialCAM at cell–cell junctions
        supports: SUPPORT
    origin:
