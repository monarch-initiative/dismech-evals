      assertion:
        name: Megalencephalic leukoencephalopathy with subcortical cysts 2A
        disease_term:
          preferred_term: megalencephalic leukoencephalopathy with subcortical cysts 2A
          term:
            id: MONDO:0013490
            label: megalencephalic leukoencephalopathy with subcortical cysts 2A
        description: The allelic recessive disorder, caused by biallelic HEPACAM variants. The early picture
          is the same, but motor deterioration begins at a median age of about 5 years, the MRI abnormalities
          persist or worsen, most patients have seizures and cognitive decline follows, and autistic behaviour
          has not been reported. A dominant variant on one allele with a recessive variant on the other
          also gives the classic phenotype.
        distinguishing_features:
        - Two HEPACAM variants rather than one, so parents are unaffected heterozygotes.
        - Motor deterioration with loss of independent walking, where this disease has no motor decline.
        - Persisting or worsening white matter abnormalities, and true subcortical cysts in almost all
          patients.
        - Delayed-onset cognitive decline in almost half of patients, against stable impairment here.
      selected_evidence:
        snippet: Patients with MLC2B invariably had a milder phenotype with preservation of motor function,
          while intellectual disability and autism were relatively frequent.
        supports: SUPPORT
