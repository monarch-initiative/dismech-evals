                without intellectual disability
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted GlialCAM Interactome in Developing Astrocytes
        biological_scale: CELLULAR
        description: A candidate second route, outside the endfoot volume-regulation complex, for the
          developmental part of the phenotype. In astrocytes of the developing mouse cortex, dominant
          hepaCAM variants from both structural groups redistribute the protein across the cell and change
          its interaction partners, with less association with Connexin 43 and ClC-2 and with the potassium
          channel KCNQ2. GlialCAM also controls astrocyte territory, branching and gap junction coupling
          in mouse cortex. Intellectual disability and autistic features are more frequent in this disease
          than in classic MLC, which fits a function of GlialCAM separate from its endfoot role, but no
          study has connected any of these changes to the cognitive or behavioural phenotype.
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        cellular_components:
        - preferred_term: cell-cell junction
          term:
            id: GO:0005911
            label: cell-cell junction
      selected_evidence:
        snippet: We also observed significant changes in protein interactome between wild type and mutant
          hepaCAM, including decreased association with previously described hepaCAM-interacting proteins
          Connexin 43 and CLC-2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
