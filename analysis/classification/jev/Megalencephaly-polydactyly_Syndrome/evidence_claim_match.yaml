            term:
              id: MONDO:0958279
              label: megalencephaly-polydactyly syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MYCN Thr58 Phosphodegron Disruption
        description: The disease-causing missense variants (p.Thr58Met, p.Pro60Leu) sit in the N-terminal
          phosphodegron of MYCN. GSK3B phosphorylation of Thr58 marks MYCN for recognition by the FBXW7
          ubiquitin ligase and proteasomal degradation. Both variants reduce Thr58 phosphorylation, so
          the mutant protein escapes FBXW7-mediated degradation.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: MYCN
          term:
            id: hgnc:7559
            label: MYCN
        genetic_context:
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          allele_type: MISSENSE
          functional_impact_category: GAIN_OF_FUNCTION
          notes: Gain of function here means increased protein stability and therefore increased MYCN
            dosage. In transfected HEK293T cells the mutant proteins activated CCND1 and CCND2 transcription
            to the same extent as wild-type MYCN, so there is no evidence of increased intrinsic transcriptional
            potency per molecule.
        biological_processes:
        - preferred_term: FBXW7-mediated proteasomal degradation of MYCN
          modifier: DECREASED
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
      selected_evidence:
        snippet: at the Thr58 phosphorylation site essential for ubiquitination and subsequent MYCN degradation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
