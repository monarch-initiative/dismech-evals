        prompt: The Mycn T58M knock-in mouse has enlarged kidneys with dilated tubules and, in females,
          vaginal atresia with hydrometra, but no kidney or genital malformation has been recognized in
          the three reported patients beyond one fetus with left pyeloureteral dilatation. Do patients
          have renal or reproductive tract anomalies that small numbers and young age have hidden, or
          is this a mouse-specific effect?
        rationale: The answer decides whether renal imaging and later gynecological assessment belong
          in the care of patients. All three reported patients are male, so the female reproductive phenotype
          could not have been observed.
      selected_evidence:
        snippet: Interestingly, the kidney and female reproductive tract exhibited overt morphological
          anomalies, possibly as a result of excess proliferation during organogenesis.
