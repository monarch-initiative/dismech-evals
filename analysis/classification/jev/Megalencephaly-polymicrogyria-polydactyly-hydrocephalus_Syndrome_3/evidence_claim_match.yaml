      assertion_type: Pathophysiology
      assertion:
        name: Distal CCND2 Variant Disrupting the Thr280 Phosphodegron
        description: Heterozygous germline variants in the final exon of CCND2 alter conserved residues
          around Thr280, the residue GSK-3beta phosphorylates to mark cyclin D2 for degradation, or truncate
          the protein before it. The truncating variants lie in the last exon and are not expected to
          trigger nonsense-mediated decay, so a stable, shortened protein is made.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: CCND2
          term:
            id: hgnc:1583
            label: CCND2
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: GAIN_OF_FUNCTION
        molecular_functions:
        - preferred_term: cyclin D2 regulation of CDK4
          term:
            id: GO:0016538
            label: cyclin-dependent protein serine/threonine kinase regulator activity
      selected_evidence:
        snippet: Interestingly, all mutations in our MPPH cohort either alter highly conserved residues
          surrounding p.Thr280, or truncate the protein prior to this phosphorylation site (p.Lys270X).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
