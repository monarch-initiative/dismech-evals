  4caea9fea8ecc7755df8776f9407242ecb1dd46b19c3b079a056e951adc4bcc9:
    claim:
      about:
        disease:
          name: Meier-Gorlin syndrome
          disease_term:
            preferred_term: Meier-Gorlin syndrome
            term:
              id: MONDO:0016817
              label: Meier-Gorlin syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mgors_licensing_severity_uncoupling
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does the measured origin licensing deficit in patient cells fail to predict S-phase
          progression rate or clinical severity?
        attaches_to:
        - pathophysiology#Impaired Replication Origin Licensing
        - pathophysiology#Delayed S-Phase Entry and Reduced Cell Proliferation
        rationale: 'Licensing capacity is impaired in all MGORS patient cells regardless of gene, yet
          it does not correlate with the rate of S-phase progression, and the clinical severity gradient
          (ORC1 and ORC4 most severe) is not explained by licensing measurements alone. This uncoupling
          is a central unresolved question of MGORS pathogenesis and is what motivates the parallel non-replicative
          arms, notably the centriole and ciliogenesis route. Whether the non-canonical roles of these
          proteins, tissue-specific proliferative demand, or something else supplies the missing explanatory
          variable is unknown. One partial answer already exists for the ORC1 arm specifically: the BAH
          domain reads H4K20me2 to target ORC to origins, so BAH mutations remove a chromatin-targeting
          step rather than simply lowering licensing capacity. Whether an analogous upstream-targeting
          defect distinguishes the other severe arms has not been tested.'
        proposed_experiments:
        - experiment_id: exp_mgors_licensing_vs_output_allelic_series
          name: Parallel licensing, fork, cell-cycle and ciliogenesis phenotyping across an isogenic MGORS
            allelic series
          description: Measure licensed origin density, fork speed, cell cycle length and ciliogenesis
            competence in parallel across an isogenic allelic series spanning the licensing module (ORC1,
            ORC4, CDT1) and the CMG module (CDC45, GINS2, GINS3), in a developmentally relevant proliferating
            cell type such as iPSC-derived chondroprogenitors, and test which measure predicts differentiation
            output.
          decision_criterion: The measure whose variation across the allelic series best predicts chondrogenic
            differentiation output identifies the rate-limiting step.
          supporting_outcome:
          - Ciliogenesis competence predicts differentiation output better than licensed origin density,
            supporting the non-replicative arm as the severity determinant
          refuting_outcome:
          - Licensed origin density predicts differentiation output linearly, restoring the simple licensing-deficit
            model
      selected_evidence:
        snippet: Thus, the replicative capacity in MGS patient cells does not correlate with clinical
          manifestation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/11
      evidence_path: /discussions/11/evidence/0
