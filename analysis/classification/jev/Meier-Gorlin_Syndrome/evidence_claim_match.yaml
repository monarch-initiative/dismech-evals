      assertion:
        name: Molecular genetic testing
        description: Molecular confirmation uses a primordial dwarfism panel spanning all thirteen replication-initiation
          genes, or exome or genome sequencing with copy-number analysis. Testing limited to the five
          founding pre-replication complex genes identifies only about two-thirds to three-quarters of
          patients, and exome-only pipelines can miss deep-intronic splice-altering alleles.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: Mutations in one of five genes (ORC1, ORC4, ORC6, CDT1, and CDC6) of the pre-replication
          complex, involved in DNA-replication, are detected in approximately 67-78% of patients with
          MGS.
        supports: SUPPORT
