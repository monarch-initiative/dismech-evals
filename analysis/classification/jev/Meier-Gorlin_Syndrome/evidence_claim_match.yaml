  f2b30fc3e3e10719e2c6dd7b379829b96a7ec69aabda52f321d6e2fbec2052a6:
    claim:
      about:
        disease:
          name: Meier-Gorlin syndrome
          disease_term:
            preferred_term: Meier-Gorlin syndrome
            term:
              id: MONDO:0016817
              label: Meier-Gorlin syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mgors_gh_axis_abnormality_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do roughly a third of endocrinologically assessed individuals with MGORS show a decreased
          response to growth hormone stimulation testing, when the growth failure of the syndrome is largely
          growth-hormone independent?
        attaches_to:
        - phenotypes#Decreased response to growth hormone stimulation test
        - biochemical#Low circulating IGF-1
        rationale: Growth hormone therapy is ineffective in most individuals and growth velocity normalizes
          spontaneously after the first year of life, which points to a cell-intrinsic, GH-independent
          growth deficit. Yet 35.3% of endocrinologically assessed cases in a review selected for endocrinopathy
          or hormonal therapy had reported growth hormone deficiency, and 42.9% had low IGF-1. The abstract
          does not give feature-specific denominators. No study has established how a replication-initiation
          defect would produce a pituitary secretory abnormality - candidate routes include reduced somatotroph
          progenitor expansion during pituitary development and ascertainment bias in an endocrine-referred
          case literature - so this phenotype is deliberately left without a causal edge from the growth-restriction
          node rather than wired through an unsupported intermediate.
        proposed_experiments:
        - experiment_id: exp_mgors_gh_axis_imaging_and_secretion
          name: Systematic pituitary imaging and GH-axis phenotyping in molecularly confirmed MGORS
          description: In a molecularly confirmed MGORS cohort unselected for endocrine referral, combine
            pituitary MRI volumetry with standardized GH stimulation testing, IGF-1 measurement and overnight
            spontaneous GH secretion profiling, stratified by gene arm.
          decision_criterion: Reduced pituitary volume co-segregating with abnormal stimulation responses
            would support a developmental somatotroph deficit; normal imaging and secretion in an unselected
            cohort would attribute the reported GHD rate to ascertainment bias.
          supporting_outcome:
          - Pituitary hypoplasia and blunted stimulated GH secretion cluster in the same individuals and
            gene arms
          refuting_outcome:
          - Unselected cohort shows normal GH-axis measures, reclassifying the reported GHD rate as referral
            bias
      selected_evidence:
        snippet: Growth hormone treatment is ineffective in most patients with MGS, but may be effective
          in patients in whom growth continues to decrease after the first year of life (usually growth
          velocity normalizes after the first year) and with low levels of IGF1.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/13
