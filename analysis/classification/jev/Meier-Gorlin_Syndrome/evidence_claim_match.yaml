        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mgors_tissue_selectivity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What determines the tissue selectivity of MGORS, so that external ear cartilage, the patella,
          mammary tissue and the external genitalia are affected out of proportion to overall stature?
        attaches_to:
        - pathophysiology#Tissue-Disproportionate Growth Failure
        - pathophysiology#Reduced Hedgehog Signaling and Impaired Chondroinduction
        rationale: A uniform, cell-autonomous replication deficit should scale all tissues together, yet
          the phenotype is strikingly selective, and it is that selectivity, not the short stature, that
          makes MGORS clinically recognizable. Candidate explanations include narrow developmental windows
          of unusually intense proliferation in these structures and the ciliary Hedgehog and chondroinduction
          arm, but no cell-type-resolved human data exist.
        proposed_experiments:
        - experiment_id: exp_mgors_progenitor_demand_mapping
          name: Cell-type-resolved mapping of proliferative demand in MGORS-vulnerable human embryonic
            structures
          description: Build a cell-type-resolved map of proliferative demand and replication stress in
            human embryonic auricular cartilage, patellar anlage and mammary bud, and test whether a licensing-deficient
            background preferentially depletes progenitors in exactly those compartments.
          decision_criterion: Preferential progenitor depletion in the MGORS-vulnerable compartments relative
            to matched control compartments supports proliferative demand as the selectivity mechanism.
          supporting_outcome:
          - MGORS-vulnerable compartments show the highest proliferative demand and the greatest progenitor
            loss under a licensing-deficient background
          refuting_outcome:
          - Progenitor loss is uniform across compartments, implicating a tissue-specific signaling requirement
            instead
      selected_evidence:
        snippet: we highlight that growth is disproportionately affected in certain structures
        supports: SUPPORT
