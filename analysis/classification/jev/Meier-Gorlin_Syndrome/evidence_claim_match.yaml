        context: []
      assertion_type: Treatment
      assertion:
        name: Growth hormone therapy
        description: 'Recombinant growth hormone is used off-label for short stature. It is ineffective
          in most individuals, whose growth velocity normalizes after the first year of life without treatment,
          but a subgroup benefits: those with documented growth hormone deficiency, delayed bone age,
          or low IGF-1, in whom substantial height gains have been reported. Screening for growth hormone
          deficiency is therefore recommended before deciding.'
        therapeutic_modality: PEPTIDE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: recombinant human growth hormone
            term:
              id: NCIT:C837
              label: Somatropin
      selected_evidence:
        snippet: Growth hormone treatment is ineffective in most patients with MGS, but may be effective
          in patients in whom growth continues to decrease after the first year of life (usually growth
          velocity normalizes after the first year) and with low levels of IGF1.
        supports: SUPPORT
