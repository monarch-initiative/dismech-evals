        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        description: A distinct dominant form arises from de novo heterozygous GMNN variants that delete
          the geminin destruction box, stabilizing the licensing inhibitor rather than disabling a licensing
          activator. This is the mechanistic and inheritance exception within MGORS.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: We present data supporting a gain-of-function mechanism, in which the GMNN mutations
          result in proteins lacking the destruction box and hence increased protein stability and prolonged
          inhibition of replication leading to autosomal-dominant MGS.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/1
      evidence_path: /inheritance/1/evidence/0
