      assertion_type: Pathophysiology
      assertion:
        name: Loss of ORC1 BAH Recognition of H4K20me2
        biological_scale: MOLECULAR
        description: In metazoans, ORC is directed to origins by chromatin rather than by DNA sequence,
          and the ORC1 BAH domain performs that reading step by binding histone H4 dimethylated at lysine
          20. MGORS-associated BAH domain mutations abrogate this recognition, reducing ORC1 occupancy
          at origins and ORC chromatin loading. This is a candidate explanation for why the ORC1 arm sits
          at the severe end of the clinical gradient, since it removes the targeting step upstream of
          licensing rather than merely reducing licensing capacity.
        genes:
        - preferred_term: ORC1
          term:
            id: hgnc:8487
            label: ORC1
        molecular_functions:
        - preferred_term: DNA replication origin binding
          term:
            id: GO:0003688
            label: DNA replication origin binding
          modifier: DECREASED
      selected_evidence:
        snippet: H4K20me2 is enriched at replication origins, and abrogating ORC1 recognition of H4K20me2
          in cells impairs ORC1 occupancy at replication origins, ORC chromatin loading and cell-cycle
          progression.
        supports: SUPPORT
    origin:
