  2112ba6f36c26018f8e42c657d3a0c770801c2beb51a646e46094ad6ef63b2d0:
    claim:
      about:
        disease:
          name: Meier-Gorlin syndrome
          disease_term:
            preferred_term: Meier-Gorlin syndrome
            term:
              id: MONDO:0016817
              label: Meier-Gorlin syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_mgors_gins3_mouse_lethality
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the GINS3 D24 mouse model, which is embryonic lethal, faithfully represent human
          GINS3-related Meier-Gorlin syndrome, in which affected individuals survive?
        attaches_to:
        - pathophysiology#Global Prenatal and Postnatal Growth Restriction
        rationale: Homozygous D24 mouse embryos show intrauterine growth retardation and do not survive
          to birth, while the seven humans reported with the corresponding hypomorphic GINS3 genotypes
          survive with an MGORS-like phenotype. The mouse therefore recapitulates growth restriction but
          overshoots on severity, so mechanistic inferences drawn from it, particularly the accelerated
          senescence of the derived fibroblasts, may reflect a more complete loss of function than human
          disease alleles produce.
        proposed_experiments:
        - experiment_id: exp_mgors_gins3_humanized_allelic_series
          name: Humanized GINS3 allelic series calibrating mouse severity against patient fibroblasts
          description: Generate a mouse allelic series carrying the specific human GINS3 hypomorphic substitutions
            at matched residues, and compare residual protein level, fork progression and senescence markers
            against patient-derived fibroblasts to calibrate where the human alleles sit on the murine
            severity curve.
          decision_criterion: Concordance of residual protein level, fork speed and senescence markers
            between the humanized mice and patient fibroblasts establishes the translational validity
            of the murine readouts.
          supporting_outcome:
          - Humanized alleles produce viable mice whose fibroblast phenotypes match patient cells, validating
            the model
          refuting_outcome:
          - Humanized alleles remain lethal or produce senescence far exceeding patient cells, confining
            the model to loss-of-function extremes
      selected_evidence:
        snippet: We further showed that mouse embryos homozygous for a D24 variant presented intrauterine
          growth retardation and did not survive to birth
        supports: SUPPORT
