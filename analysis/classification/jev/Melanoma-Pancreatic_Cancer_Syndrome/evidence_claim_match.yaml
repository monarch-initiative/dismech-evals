        name: Germline CDKN2A Locus Alteration
        biological_scale: MOLECULAR
        conforms_to: germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation
        description: 'The constitutional first hit: a heterozygous germline loss-of-function variant in
          CDKN2A, carried by every somatic cell. Founder alleles include the Dutch p16-Leiden 19-bp exon
          2 deletion (c.225_243del) and the Swedish p.Arg112dup; in-frame deletions and missense variants
          that impair p16INK4A folding and CDK4 binding are also reported. Exon 2 variants can also alter
          the overlapping p14ARF reading frame.'
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous germline CDKN2A pathogenic variants; the pancreatic cancer risk is
            associated with variants that affect the p16INK4A protein.
        genes:
        - preferred_term: CDKN2A
          term:
            id: hgnc:1787
            label: CDKN2A
      selected_evidence:
        snippet: The diagnosis of CDKN2A cancer predisposition is established in a proband by identification
          of a heterozygous germline pathogenic variant in CDKN2A by molecular genetic testing.
        supports: SUPPORT
