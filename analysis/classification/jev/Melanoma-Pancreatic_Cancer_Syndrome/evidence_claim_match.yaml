      assertion_type: Discussion
      assertion:
        discussion_id: mpcs_arf_contribution_to_pancreatic_risk
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does loss of p14ARF contribute to pancreatic cancer risk in germline CDKN2A carriers,
          or is the pancreatic arm of the syndrome attributable to p16INK4A loss alone?
        attaches_to:
        - pathophysiology#Loss of p14ARF Function
        - phenotypes#Pancreatic Ductal Adenocarcinoma
        rationale: Most pathogenic exon 2 variants affect both reading frames, so in most carrier families
          the two arms cannot be separated. The one series cited here that compares them found no pancreatic
          cancer among nine families carrying a p14ARF-only variant, against PDAC in more than half of
          families with p16INK4A-affecting variants; nine families and twenty carriers is a small denominator,
          and the question decides which carriers are offered pancreatic surveillance.
      selected_evidence:
        snippet: PDAC developed in 95 of 163 families (58%, including 373 of 629 proven carriers) harbouring
          a variant with an effect on the p16INK4a protein, whereas PDAC did not occur in the 9 families
          (20 proven carriers) with a variant affecting only p14ARF.
        supports: SUPPORT
