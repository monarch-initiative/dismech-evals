      assertion:
        name: Somatic Second-Hit Inactivation of CDKN2A
        biological_scale: MOLECULAR
        conforms_to: germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type
          Allele
        description: In the tumor, p16INK4A function is lost from the remaining allele. In pancreatic
          carcinomas from p16-Leiden carriers, p16 immunostaining was absent in every tumor tested, but
          loss of heterozygosity of the wild-type allele was demonstrated in only 2 of 7, so the mechanism
          of second-allele inactivation is not established for most pancreatic tumors (promoter methylation
          and intragenic mutation were not reported in the cited study). In melanoma, consistent loss
          of the wild-type allele is seen in the Ink4a-heterozygous mouse model, and somatic inactivation
          of the wild-type allele has been documented in a human melanoma from a germline ARF-variant
          kindred.
        genetic_context:
          variant_origin: SOMATIC
          functional_impact_category: LOSS_OF_FUNCTION
          description: Somatic loss of the wild-type CDKN2A allele (loss of heterozygosity, deletion or
            intragenic mutation) on the germline background.
        genes:
        - preferred_term: CDKN2A
          term:
            id: hgnc:1787
            label: CDKN2A
      selected_evidence:
        snippet: Loss of heterozygosity of the wild-type allele was present in 2 of 7 tumors analyzed.
          Immunostaining for p16 was negative in 10 of 10.
        supports: SUPPORT
