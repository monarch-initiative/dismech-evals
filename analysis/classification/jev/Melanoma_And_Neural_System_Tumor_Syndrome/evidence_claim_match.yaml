              id: MONDO:0007967
              label: melanoma and neural system tumor syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mast_p14arf_versus_contiguous_deletion
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the neural-tumor component of melanoma and neural system tumor syndrome driven specifically
          by loss of p14ARF, or by contiguous loss of multiple INK4-locus tumor suppressors?
        attaches_to:
        - pathophysiology#Loss of p14ARF Function
        - pathophysiology#Germline CDKN2A Locus Alteration
        rationale: The syndrome was first explained by contiguous germline deletion of the whole INK4
          gene cluster, so that the tumor spectrum reflected which neighbouring tumor suppressors were
          co-deleted. Later families carried lesions restricted to the p14ARF-specific exon 1beta, sparing
          the CDKN2A and CDKN2B coding sequences, which is consistent with loss of p14ARF alone being
          sufficient for the neural-tumor phenotype. The two models are not mutually exclusive across
          families, and the question bears on which carriers warrant brain-tumor surveillance.
      selected_evidence:
        snippet: families with mutations involving the p14ARF-specific exon 1B may be predisposed to central
          nervous system tumours.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35904890
      reference_title: CDKN2A exon 1B deletion predisposing to melanoma and neural system tumour syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the p14ARF-specific side of the open question with an additional exon 1B family.
