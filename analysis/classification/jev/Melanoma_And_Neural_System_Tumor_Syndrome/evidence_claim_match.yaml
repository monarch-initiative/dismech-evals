            term:
              id: MONDO:0007967
              label: melanoma and neural system tumor syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: CDKN2A
        gene_term:
          preferred_term: CDKN2A
          term:
            id: hgnc:1787
            label: CDKN2A
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Germline alterations of the CDKN2A locus (encoding p16INK4A and p14ARF) cause melanoma
          and neural system tumor syndrome; the neural tumor component has been associated particularly
          with lesions affecting p14ARF.
        notes: Reported lesions range from large contiguous deletions of the whole INK4 gene cluster (p16INK4A/p15INK4B/p14ARF)
          to lesions restricted to the p14ARF-specific exon 1beta, including deletions and a G16D missense,
          that spare the CDKN2A and CDKN2B coding sequences. The latter is the basis for treating loss
          of p14ARF, rather than contiguous loss of multiple genes, as sufficient for the neural-tumor
          phenotype.
      selected_evidence:
        snippet: Our results suggest that multiple cancer susceptibility in these two families ensues
          from contiguous tumor suppressor gene deletion.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
