      assertion_type: Phenotype
      assertion:
        category: Craniofacial
        name: Bluish-Black Pigmented Swelling
        description: A review of jaw MNTI states that, because of the tumour's melanin content, the lesion
          appears clinically as a bluish-black swelling, usually covered by the oral mucosa, and regards
          a maxillary swelling with a bluish-black hue and a rapid course in an infant as a pathognomonic
          clinical sign of oral MNTI. In the case the authors present, the swelling looked like a coin-sized,
          marble-like elevation with blanching of the overlying mucosa and a central melanaceous hue,
          and that hue, with the patient's age and the site, was the basis for the provisional diagnosis.
        phenotype_term:
          preferred_term: bluish-black pigmented swelling
        notes: 'No HPO term is bound, because none describes a pigmented swelling or mass. Abnormal pigmentation
          of the oral mucosa (HP:0100669) and its child Intra-oral hyperpigmentation (HP:0010284) describe
          pigment in the mucosa itself, whereas the source describes the tumour''s own melanin in a swelling
          covered by the mucosa, which in the authors'' case was blanched over it. The other descendants
          of HP:0100669 are mucosal patterns and named lesions: reticulate pigmentation of oral mucosa,
          oral melanotic macule, oral melanoacanthoma, white oral mucosal macule and tongue hyperpigmentation.
          An OLS search of HPO for "jaw swelling" returned Jaw swelling (HP:0030793) and Jaw mass (HP:6000307),
          which describe only the swelling, already recorded by the Rapidly Growing Jaw Mass phenotype,
          and not its colour; "oral mass" returned Fetal oral mass and Oral mucosal papule. Searches for
          "pigmented mass" (which returned only Iris flocculi), "pigmented lesion", "pigmented tumor",
          "melanotic", "bluish" and "blue-black" returned terms for skin and eye findings, cyanosis, melanomas
          and other named tumours and lesions, including the oral lesions above, and none for a pigmented
          swelling or mass of the jaw or mouth. No frequency band is set: the review describes the appearance
          without saying how often it is seen.'
      selected_evidence:
        snippet: Due to the melanin content of the tumor, clinically, the lesion will appear as a bluish-black
          swelling usually draped by the oral mucosa. Maxillary swelling with a bluish-black hue and a
          rapid course in an infant can be considered as a clinical pathognomic sign to diagnose an oral
          MNTI.
        supports: SUPPORT
        directness: DIRECT
    origin:
