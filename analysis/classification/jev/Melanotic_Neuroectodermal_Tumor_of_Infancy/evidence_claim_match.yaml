      assertion_type: Treatment
      assertion:
        name: Chemotherapy for Inoperable, Metastatic or Recurrent Disease
        description: Chemotherapy may be considered for the fewer than 10% of patients whose MNTI is inoperable,
          metastatic or persistently recurring, although its role is still unclear. The main source is
          a review that combined four of its authors' own infants with 38 published cases from the previous
          42 years. In that review neoadjuvant chemotherapy, based mainly on neuroblastoma protocols,
          was often effective, and the review's conclusions say it allowed delayed complete surgery in
          a large subset of patients (in first-line use, partial shrinkage in 8 of 12 children, with delayed
          surgery complete in 5 of those 8). The role of adjuvant chemotherapy in preventing recurrence
          after incomplete resection remains unclear, and disseminated inoperable disease was almost universally
          associated with poor response to chemotherapy and an unfavourable outcome. A 2026 expert consensus
          likewise says that chemotherapy may be considered for advanced disease, and that radiotherapy
          is generally avoided in young children.
        action_category: THERAPEUTIC
        context: Inoperable, metastatic or persistently recurring MNTI
        treatment_term:
          preferred_term: chemotherapy
          term:
            id: NCIT:C15632
            label: Chemotherapy
        notes: No agent or regimen is bound, because the cited review pooled cases treated with different
          regimens; neuroblastoma-derived protocols were the most frequently used (12 of 39 reported inoperable,
          recurrent or metastatic cases).
      selected_evidence:
        snippet: In less than 10% of patients with inoperable, metastatic or persistently recurring MNTI,
          chemotherapy (CHT) may be considered; however, its role is still unclear. The aim of our study
          was to assess the efficacy of CHT in children with large, inoperable, metastatic and/or recurrent
          MNTI. Four such infants, treated with CHT in Polish and German centers of pediatric oncology,
          were presented. Additionally, a systematic literature search of the PubMed/MEDLINE, Scopus and
          Web of Science databases was performed, yielding 38 similar cases within the last 42 years.
          Neoadjuvant CHT, based mainly on the protocols for neuroblastoma, was often effective, allowing
          for complete delayed surgery in most cases. However, the role of adjuvant CHT in preventing
          recurrences after incomplete resection of MNTI remains unclear. Disseminated inoperable MNTI
          was almost universally associated with poor response to CHT and unfavorable outcome.
        supports: SUPPORT
        directness: DIRECT
