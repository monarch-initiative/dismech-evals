    evidence_metadata:
      reference: PMID:33572349
      reference_title: Melanotic Neuroectodermal Tumor of Infancy (MNTI) and Pineal Anlage Tumor (PAT)
        Harbor A Medulloblastoma Signature by DNA Methylation Profiling.
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      explanation: In the Discussion of their DNA methylation study of seven MNTIs, Lopez-Nunez et al.
        call the neural-crest origin of MNTI putative and its histogenesis elusive, with odontogenic,
        primordial germ cell and neural-crest origins all proposed over the years. The passage restates
        earlier literature, which it cites, rather than reporting a result of the study. It supports the
        node description's hedge that the neural-crest origin is attributed to the tumour rather than
        established; the same paper's abstract calls MNTI a tumour of indeterminate histogenesis.
