      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      explanation: This systematic review of the published MNTI literature, which also presents an original
        case, states that the lesion most commonly affects the maxilla of infants during the first year
        of life, and that it may also occur in the mandible, skull, brain, epididymis and other rare locations.
        It also states that the tumour's expansive, destructive and rapid growth and its effects on the
        surrounding tissues are its most obvious clinical features. Together these support the node and
        the five sites recorded as its locations, with the maxilla the usual site. The five sites are
        not a complete list, and the review describes the growth pattern for MNTI as a whole rather than
        separately for each site. The ellipsis skips one sentence on the tumour's neural-crest origin.
