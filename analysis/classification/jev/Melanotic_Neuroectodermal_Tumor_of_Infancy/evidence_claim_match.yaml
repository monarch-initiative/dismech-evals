    evidence_metadata:
      reference: PMID:34094962
      reference_title: 'Melanotic Neuroectodermal Tumor of Infancy: A Clinicopathological and BRAF V600E
        Mutation Study of 11 Cases.'
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      explanation: 'In their Introduction, Xia et al. restate the tumour-site distribution reported by
        what they call the largest systematic review of MNTI (472 cases): maxilla 62.2%, skull 15.6%,
        mandible 7.8%. These figures are not from their own 11-case series, so the quote is BACKGROUND.
        The sentence carries no citation, but the 472-case count matches Rachidi et al. 2015 (PMID:25936939),
        which is in Xia et al.''s reference list and whose abstract gives no site percentages, which is
        why the figures are quoted from this restatement. They are site shares of all MNTIs, so they set
        how often the tumour presents as a jaw mass: the maxilla alone (62.2%) is inside the FREQUENT
        band (30-79%), and adding the mandible (7.8%) keeps the jaw share inside that band. The quote
        says nothing about growth rate.'
