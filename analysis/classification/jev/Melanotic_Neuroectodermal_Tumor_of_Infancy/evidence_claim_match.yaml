      evidence_source: HUMAN_CLINICAL
      explanation: The EXPeRT and ERN PaedCan consensus guidance states that chemotherapy may be considered
        for advanced disease, whereas radiotherapy is generally avoided in young children. This agrees
        with the review's position that chemotherapy is an option for inoperable, metastatic or recurrent
        disease. It is a recommendation from a structured consensus process, not an outcome the guidance
        measured, and the abstract does not define advanced disease, although it names unresectable, multiply
        recurrent and metastatic cases as the ones whose management can be challenging.
