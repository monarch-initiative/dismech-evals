      assertion:
        discussion_id: mnti_shared_progenitor_with_group_3_medulloblastoma
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Biphasic Melanocyte-Like and Neuroblast-Like Tumor Cell Population
        prompt: Do MNTI and group 3 medulloblastoma, which share a DNA methylation profile, arise from
          a common multipotent progenitor such as an early cranial neural crest cell, and if so, why is
          MNTI mostly benign while group 3 medulloblastoma is mainly known for aggressive behaviour?
        rationale: In a DNA methylation study of seven MNTIs, five clustered in the group 3 medulloblastoma
          class family with an optimal score and the other two in the PLEX, PED B (plexus tumour) class
          family with suboptimal scores, while a medulloblastoma group 3/4 classifier classed all seven
          as high-risk group 3 tumours, subtype II. Compared with methylation data from a cohort of 36
          medulloblastoma patients, all the MNTIs had a global methylation profile very close to that
          of group 3 medulloblastoma. The authors conclude that MNTI shares a homogeneous methylation
          profile with group 3 medulloblastoma, and propose that MNTI, pineal anlage tumour and group
          3 medulloblastoma could form a spectrum of tumours determined by neural-crest-derived stem cells,
          with an early cranial neural crest cell named as a candidate multipotent progenitor. They present
          this as a hypothesis deserving further investigation. They also contrast the benign behaviour
          of MNTI with group 3 medulloblastoma, which is mainly known for aggressive clinical behaviour,
          and name the anatomical site, the tumour microenvironment and other cytogenetic events as factors
          whose role in that difference deserves further investigation. Because the shared progenitor
          is a hypothesis, the entry records it here and not as a pathophysiology node or causal edge.
      selected_evidence:
        snippet: In our series, 5/7 MNTI clustered in the class family MB G3 with an optimal score (>0.9)
          ... The remaining two MNTI cases clustered in the class family PLEX, PED B, with suboptimal
          scores (>0.45). However, when analyzed with the 'Medulloblastoma classifier group 3/4 v1.0',
          all seven MNTIs classified as high-risk MB G3 tumors, subtype II, with a score >0.45. Furthermore,
          compared with methylation data from a cohort of 36 medulloblastoma patients ... all MNTIs and
          PATs displayed a global methylation profile very close to those of MB G3.
        supports: SUPPORT
        directness: DIRECT
