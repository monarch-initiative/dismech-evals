      assertion_type: ProgressionInfo
      assertion:
        phase: Local recurrence after treatment
        notes: 'In a review pooling 250 jaw cases (249 published and one new), recurrence was significantly
          associated with age and with treatment method. In that cohort the recurrence rate was 15.2%,
          with recurrences 15 days to 20 months after treatment; the malignancy rate was 2% and mortality
          2.4%, which are separate outcomes rather than recurrences. Most included case reports had short
          follow-up, so recurrence may be under-counted. The review gives incomplete tumour excision,
          multifocal tumour and tumour seeding during surgery as the reasons stated in the literature
          for recurrence. Malignancy estimates differ by series and by site: the review''s 2% is lower
          than an earlier estimate of 6.97% that it mentions, and it states that jaw MNTI has lower metastatic
          potential than MNTI of the skull and brain, so these jaw-only figures are not rates for MNTI
          at those sites. The review describes chemotherapy as used for inoperable, metastatic or progressing
          tumours and radiotherapy for malignant and metastatic ones, so the association with treatment
          method may reflect which tumours received those treatments rather than a treatment effect.'
      selected_evidence:
        snippet: Literature review of 250 cases of MNTI including the current case report was conducted
          considering study parameters such as age and gender of the patient, location of the lesion,
          levels of vanillylmandelic acid, management options, and outcome after treatment. ... Recurrence
          of the lesion shows a significant association with age of the individual and treatment method
          employed. This study reports a 2.4% mortality rate, 2% malignancy rate, and a recurrence rate
          of 15.2%, with recurrence times ranging from 15 days to 20 months.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /progression/0
      evidence_path: /progression/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38681460
      reference_title: 'Melanotic Neuroectodermal Tumor of Infancy of Jaws: A Case Report and Review of
        Literature.'
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      explanation: 'The abstract of this pooled literature review states the claim directly. The review
        pooled 250 histologically proven MNTI cases of the jaw: 249 from 178 published articles plus the
        authors'' own case. It excluded MNTI at any other site, so these are jaw-only figures, not rates
        for the disease as a whole. Recurrence was significantly associated with age and with treatment
        method, each tested separately by chi-square. In this cohort the recurrence rate was 15.2% (recurrences
        15 days to 20 months after treatment), the malignancy rate 2% and mortality 2.4%. The authors
        warn that most included case reports had short follow-up and recurrence might have come later,
        so 15.2% may under-count recurrence; the paper also cites 11.3% from the latest systematic review
        of jaw MNTI. In the full text, infants aged zero to two months recurred in 24.8% of cases against
        9.7% at three to six months. The treatment association should not be read as a treatment effect:
        recurrence was 12.4% after surgery alone against 37.5% after surgery plus chemotherapy and 66.7%
        after surgery, chemotherapy and radiotherapy, but the paper describes chemotherapy as used for
        inoperable or metastatic tumours and for disease that progresses after surgery, and radiotherapy
        for malignant and metastatic tumours, and its tests do not adjust for this. The ellipsis skips
        one sentence on the anterior maxilla and infants under six months.'
