    evidence_metadata:
      reference: PMID:34094962
      reference_title: 'Melanotic Neuroectodermal Tumor of Infancy: A Clinicopathological and BRAF V600E
        Mutation Study of 11 Cases.'
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      explanation: 'In the first paragraph of their Discussion, Xia et al. restate earlier work: MNTI
        is proposed to be of neural crest origin because the tumour produces VMA and has a heterogeneous
        cellular phenotype. For the VMA statement they cite their reference 2, which their introduction
        identifies as Borello and Gorlin''s proposal; Lopez-Nunez et al. (PMID:33572349) attribute that
        original observation to a single case. The quote supports only the tumour itself as a source of
        VMA. It uses that production as evidence for a proposed origin, so it does not show that neural
        crest derivation explains the VMA. It mentions neither urine nor a raised level, and the paper
        never expands the abbreviation VMA, so the step from tumour VMA production to elevated urinary
        vanillylmandelic acid is an inference. The authors state that none of their own cases had urinary
        VMA measured, so this is background rather than a result of their study.'
