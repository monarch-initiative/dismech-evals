    evidence_metadata:
      reference: PMID:34359769
      reference_title: The Role of Chemotherapy in Management of Inoperable, Metastatic and/or Recurrent
        Melanotic Neuroectodermal Tumor of Infancy-Own Experience and Systematic Review.
      evidence_source: HUMAN_CLINICAL
      explanation: This paper combines four chemotherapy-treated infants from Polish and German paediatric
        oncology centres with 38 similar published cases found by a systematic search covering the previous
        42 years, so its findings rest on a small, heterogeneous set of reported cases rather than a cohort.
        Its abstract says chemotherapy may be considered for the fewer than 10% of patients whose MNTI
        is inoperable, metastatic or persistently recurring, although its role is still unclear; that
        figure is the abstract's framing statement and is not derived in the body. From the pooled cases
        it reports that neoadjuvant chemotherapy, based mainly on neuroblastoma protocols, was often effective
        and allowed complete delayed surgery in most cases. The paper's conclusions word the same result
        as delayed complete surgery in a large subset of patients, so 'most cases' should not be read
        as most of all children given neoadjuvant chemotherapy. It also says the role of adjuvant chemotherapy
        in preventing recurrence after incomplete resection remains unclear, and that disseminated inoperable
        MNTI was almost universally associated with poor response to chemotherapy and an unfavourable
        outcome.
