      assertion_type: DifferentialDiagnosis
      assertion:
        name: Neuroblastoma
        description: In one series of seven MNTIs, the small neuroblast-like cells expressed NSE and synaptophysin
          while PHOX2B was negative in every tumour component, and metastatic neuroblastoma was excluded
          in every MNTI by negative imaging studies and negative PHOX2B immunostaining. PHOX2B is regarded
          as a highly sensitive and specific immunohistochemical marker for tumours of neuroblastic origin,
          and the series' authors propose it as a diagnostic aid when urinary VMA is raised, particularly
          when a limited biopsy looks neuroblastic and expresses neuronal markers. The authors of an 11-case
          series (Sharma et al. 2025) note that raised urinary VMA, seen in some patients, can add to
          the confusion when a biopsy from an infant's facial-bone tumour shows primitive round cells,
          leading to a misdiagnosis of metastatic neuroblastoma.
        distinguishing_features:
        - PHOX2B immunostaining was negative in every component of the MNTIs in one series, and had been
          reported negative in MNTI before; PHOX2B is regarded as a highly sensitive and specific marker
          for tumours of neuroblastic origin.
        - Negative imaging studies were used together with PHOX2B staining to exclude metastatic neuroblastoma.
        disease_term:
          preferred_term: neuroblastoma
          term:
            id: MONDO:0005072
            label: neuroblastoma
      selected_evidence:
        snippet: Remarkably, the possibility of metastatic neuroblastoma was excluded in all cases by
          negative imaging studies and negative expression of Phox2b, which is considered a highly sensitive
          and specific immunohistochemical marker for tumors of neuroblastic origin, whereas it was reported
          negative in MNTI ... This immunostain can be used as a diagnostic aid in patients presenting
          with increased urinary levels of VMA, particularly in cases with limited biopsy material containing
          a predominantly neuroblastic-like morphology and expression of neuronal markers (i.e., synaptophysin,
          chromogranin A, PGP9.5, CD56).
        supports: SUPPORT
        directness: DIRECT
