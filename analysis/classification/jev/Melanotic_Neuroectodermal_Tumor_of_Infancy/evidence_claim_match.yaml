      reference: PMID:40278957
      reference_title: 'Melanotic Neuroectodermal Tumor of Infancy: Clinicopathological Evaluation of
        a 10-Year Consecutive Case Series from a Tertiary Cancer Center.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In this single-centre series of 11 head and neck MNTIs, infiltrative borders were noted
        microscopically in all 9 cases described, and all cases showed extensive permeation into the bone;
        the figure it cites shows native bone infiltrated by the biphasic cell population. This ties the
        tumour cells to bone-destroying growth at the microscopic level. It is a histological observation
        in resected tumours, not a measurement of how fast they grew, so the link to the clinical expansile
        growth is an inference.
