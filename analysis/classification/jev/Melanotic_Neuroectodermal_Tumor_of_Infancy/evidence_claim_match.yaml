      reference: PMID:33572349
      reference_title: Melanotic Neuroectodermal Tumor of Infancy (MNTI) and Pineal Anlage Tumor (PAT)
        Harbor A Medulloblastoma Signature by DNA Methylation Profiling.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'In this series of seven MNTIs and one pineal anlage tumour, the authors excluded metastatic
        neuroblastoma in every MNTI by negative imaging and negative PHOX2B immunostaining; their Methods
        state that PHOX2B immunohistochemistry was done in all cases. They then propose PHOX2B immunostaining
        as a diagnostic aid in patients with raised urinary VMA, particularly when limited biopsy material
        shows a predominantly neuroblastic-like morphology with expression of neuronal markers. That is
        the authors'' recommendation, not a measured result: the paper reports no urinary VMA values.
        Two parts of the quote restate earlier work rather than this study''s own measurement: the description
        of PHOX2B as a highly sensitive and specific marker of neuroblastic tumours (introduced with ''is
        considered''), and the clause that PHOX2B was previously reported negative in MNTI, which carries
        a citation to an earlier report. The study included no neuroblastomas, so it did not measure PHOX2B''s
        sensitivity or specificity. The ellipsis replaces only that citation marker and the end of its
        sentence.'
