  dbaf913de54123b63b2aa75c8f186c662a14bf422feaa67d9c5ffd715fe699d8:
    claim:
      about:
        disease:
          name: Melanotic Neuroectodermal Tumor of Infancy
          disease_term:
            preferred_term: melanotic neuroectodermal tumor of infancy
            term:
              id: MONDO:0002072
              label: melanotic neuroectodermal tumor
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biphasic Melanocyte-Like and Neuroblast-Like Tumor Cell Population
        description: 'The tumour cells form two populations: large polygonal epithelioid cells that resemble
          melanocytes and produce melanin, which they contain in variable amounts, and smaller neuroblast-like
          round cells. The tumour''s origin is attributed to the neural crest, but that origin is also
          described as putative and the histogenesis of MNTI as still unresolved.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: melanin-containing epithelioid tumor cell
          term:
            id: CL:0000147
            label: pigment cell
        - preferred_term: neuroblast-like small round tumor cell
        biological_processes:
        - preferred_term: melanin production by the large epithelioid tumor cells
          term:
            id: GO:0042438
            label: melanin biosynthetic process
        notes: 'No node is marked as the origin node (genetic_context), because the cited sources describe
          no recurrent initiating lesion (see the entry notes). The large cells are bound to pigment cell
          rather than melanocyte, because the sources describe them only as epithelioid cells that resemble
          melanocytes and produce or contain melanin. Their melanin production is bound to melanin biosynthetic
          process rather than its child melanin biosynthetic process from tyrosine (GO:0006583), because
          the sources say only that the cells produce melanin, not by which pathway. No modifier is set,
          because the sources do not compare the amount of melanin with that made by normal melanocytes.
          The small cells are described only as neuroblast-like, and no CL term is bound for them. An
          OLS search of CL for "neuroblast" returned five neuroblast classes (neuroblast (sensu Vertebrata),
          neural crest derived neuroblast, cycling neuroblast (sensu Vertebrata), neuroblast (sensu Nematoda
          and Protostomia) and forebrain neuroblast) and three other cell classes (ependymal cell, ganglion
          mother cell and neural crest cell); a search for "neuroblast-like" returned only ependymal cell.
          A neuroblast class would assert that the cells are neuroblasts, which the sources do not establish:
          they describe the cells only by their resemblance to neuroblasts, and the cells were PHOX2B-negative
          in the series cited under the neuroblastoma differential diagnosis.'
      selected_evidence:
        snippet: The origin of the tumor is the neural crest. ... Microscopically, large polygonal epithelioid
          cells resembling melanocytes, with variable deposits of melanin, and smaller neuroblast-like
          round cells characterize MNTI.
        supports: SUPPORT
        directness: DIRECT
    origin:
