      reference: PMID:30407852
      reference_title: Melanotic Neuroectodermal Tumor of Infancy.
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      explanation: 'This 2018 review of the MNTI literature and University of Michigan cases states the
        histology directly: the tumour is composed of a biphasic population of epithelioid melanin-producing
        cells and primitive neurogenic cells in a fibrocollagenous stroma. Its opening sentence adds that
        the small round blue cell morphology can lead to misdiagnosis of a malignant neoplasm, and names
        the tumour that ''it'' refers to in the histology sentence. The last sentence qualifies the pattern''s
        diagnostic value: especially in small biopsies, these findings can raise a broad differential
        diagnosis that includes malignant small round blue cell tumours and malignant melanoma. The opening
        sentence also calls MNTI generally regarded as benign; that is the 2018 view and is not relied
        on here, because a 2025 case series (PMID:40278957) reports that the 5th edition of the WHO classification
        of paediatric tumours considers MNTI of the head and neck a malignant entity. The ellipsis skips
        the review''s objective, data sources and a sentence on tumour sites.'
