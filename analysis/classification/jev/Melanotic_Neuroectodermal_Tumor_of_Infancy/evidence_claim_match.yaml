    evidence_metadata:
      reference: PMID:16876064
      reference_title: 'Melanotic neuroectodermal tumor of infancy: systematic review of the literature
        and presentation of a case.'
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      explanation: A systematic literature review of published MNTI cases, which also presents one original
        case, states that the tumour's origin is the neural crest. It also states that MNTI is characterised
        microscopically by large polygonal epithelioid cells resembling melanocytes, with variable melanin
        deposits, and smaller neuroblast-like round cells. This supports the node's two cell populations
        and the attribution of the tumour's origin to the neural crest. The quote places the melanin in
        the large cells, so it supports binding them to pigment cell; they are only said to resemble melanocytes,
        which is why they are not bound to melanocyte. The small cells are described only as neuroblast-like,
        so this quote supports their morphology, not that they are neuroblasts, which is why no CL term
        is bound for them. The origin is stated as an assertion, and the abstract gives no data for it.
        The ellipsis skips one sentence on clinical growth features.
