          with earlier reports. The authors suggest that this two-cell profile could help distinguish
          MNTI from small round cell tumours, including Ewing sarcoma; the series stained no Ewing sarcoma
          and used no Ewing-directed marker. Ewing sarcoma is characterised by diffuse membranous MIC2
          (CD99) positivity with FLI1 and NKX2-2 positivity. In a second 11-case series (Sharma et al.
          2025), MIC2 was positive, in a dot-like pattern, in 1 of the 4 MNTIs tested, and NKX2-2 and
          FLI1 were negative in both tumours tested; a 2021 review adds that several MNTIs have been reported
          to express CD99, a marker used in diagnosing tumours of the Ewing sarcoma group. A 2024 review
          of jaw MNTI states that Ki-67 or CD99 positivity of the neuroblast-like cells appears to be
          associated with an aggressive type of MNTI.
