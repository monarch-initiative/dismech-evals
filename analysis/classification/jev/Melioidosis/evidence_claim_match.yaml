        description: 'Unlike classic obligate intracellular pathogens, B. pseudomallei is fully susceptible
          to the cell-wall-active beta-lactams (ceftazidime, carbapenems) that anchor the acute intensive
          phase. Its facultative intracellular persistence instead gates the second, eradication phase:
          because surviving intracellular organisms drive relapse and recrudescence, cure requires months
          of oral therapy with cell-penetrant agents (trimethoprim-sulfamethoxazole, with doxycycline
          as an alternative) that reach the intracellular niche.'
        role: therapeutic_vulnerability
        conforms_to: intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials
