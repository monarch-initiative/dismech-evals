      assertion:
        name: SCN1A variants in rare phenotypes
        notes: 'SCN1A variants have been identified in rare cases of Melkersson-Rosenthal syndrome, particularly
          in patients presenting with concomitant migraine or neurological symptoms (familial hemiplegic
          migraine-like presentation). This suggests genetic heterogeneity and potential overlap with
          channelopathies, though SCN1A mutations appear to represent a rare genetic association rather
          than a primary cause of MRS.

          '
