            term:
              id: MONDO:0007970
              label: melorheostosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Post-zygotic Somatic Mutation in Skeletal Tissue
        biological_scale: MOLECULAR
        description: The initiating lesion, and the reason this disease looks the way it does. The mutation
          arises after fertilisation and is confined to a clone of cells, so it is present in affected
          bone and absent from unaffected bone in the same patient. Mosaicism extends to the skin overlying
          the lesions in most patients tested, which is consistent with a progenitor mutated early enough
          to populate more than one tissue.
        genes:
        - preferred_term: MAP2K1
          term:
            id: hgnc:6840
            label: MAP2K1
        - preferred_term: SMAD3
          term:
            id: hgnc:6769
            label: SMAD3
      selected_evidence:
        snippet: Using whole exome sequencing, we identify somatic mosaic MAP2K1 mutations in affected,
          but not unaffected, bone of eight unrelated patients with melorheostosis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29643386
      reference_title: Somatic activating mutations in MAP2K1 cause melorheostosis.
      evidence_source: HUMAN_CLINICAL
      explanation: The affected-versus-unaffected contrast within the same patient is what establishes
        somatic mosaicism rather than germline disease.
