      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: sclerotome_hypothesis
        hypothesis_label: Sclerotomal Distribution
        status: DEPRECATED
        description: 'The historical account, that lesions occupy the bone territory innervated by a single
          spinal nerve level. It was tested directly by whole body CT in thirty patients and largely failed:
          only 17% conformed to a single sclerotome. Retained here because it is still widely repeated,
          including in reviews published after the test.'
        notes: Marked DEPRECATED rather than deleted because it is still stated as fact in the review
          literature, including PMID:28676968, which describes a sclerotomal distribution. A curator meeting
          that claim should be able to find the test that contradicts it.
      selected_evidence:
        snippet: We found that the disease distribution conformed to the distribution of a single sclerotome
          in only 5 patients (17%). In another 12 patients, the lesions spanned parts of contiguous sclerotomes
          but did not involve the entire extent of the sclerotomes.
        supports: REFUTE
