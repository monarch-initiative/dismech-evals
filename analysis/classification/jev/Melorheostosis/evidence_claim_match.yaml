      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: somatic_mosaic_clone
        hypothesis_label: Somatic Mosaic Clone Determines the Segmental Distribution
        status: CANONICAL
        description: The distribution reflects the territory occupied by the descendants of a single mutated
          progenitor. This follows from the genetics rather than from anatomy, and it accounts for the
          sharp boundary, the restriction to one side of a limb, and the involvement of overlying skin.
      selected_evidence:
        snippet: We believe that the disease distribution can be explained by clonal proliferation of
          a mutated skeletal progenitor cell along the limb axis. Studies in mice models on clonal proliferation
          in limb buds mimic the patterns seen in melorheostosis.
        supports: SUPPORT
