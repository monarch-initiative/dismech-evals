          be on affected tissue: the variants are absent from unaffected bone in the same patient, so
          a blood sample will not find them. MAP2K1 accounts for about half of sporadic cases, and the
          sources state further locus heterogeneity, so a negative result on affected tissue does not
          exclude the diagnosis.'
      selected_evidence:
        snippet: Using whole exome sequencing, we identify somatic mosaic MAP2K1 mutations in affected,
          but not unaffected, bone of eight unrelated patients with melorheostosis.
