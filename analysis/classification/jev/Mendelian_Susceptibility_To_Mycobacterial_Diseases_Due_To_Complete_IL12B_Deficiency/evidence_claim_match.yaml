            term:
              id: MONDO:0013954
              label: Mendelian susceptibility to mycobacterial diseases due to complete IL12B deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Recombinant Interferon Gamma
        description: 'Subcutaneous recombinant IFN-gamma is the mechanistically indicated adjunct for
          this etiology. The IL12B lesion impairs IFN-gamma production while leaving the IFN-gamma receptor
          and downstream JAK-STAT1 machinery intact, so exogenous cytokine engages a competent receptor
          and restores macrophage activation. This is the therapeutic dividing line within MSMD: production
          defects such as IL-12p40 deficiency are candidates for recombinant IFN-gamma, whereas defects
          abolishing the response to the cytokine are managed with transplantation or gene therapy. It
          is given together with antibiotics, not in place of them, and outcomes remain guarded.

          '
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: interferon gamma-1b
            term:
              id: NCIT:C100089
              label: Interferon Gamma-1b
      selected_evidence:
        snippet: Only 12 of 44 symptomatic patients received human recombinant IFN-γ together with specific
          antibiotic treatment during infection
        supports: SUPPORT
