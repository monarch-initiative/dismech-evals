      assertion_type: Pathophysiology
      assertion:
        name: Failed IFN-gamma-Dependent Macrophage Activation
        biological_scale: CELLULAR
        description: 'IFN-gamma is the signal that licenses macrophages to kill the intracellular mycobacteria
          and Salmonella they harbour. With IFN-gamma output insufficient, infected macrophages are not
          activated and cannot restrict microbial growth. This is the shared final mechanism across MSMD
          etiologies: the disease is defined by insufficient IFN-gamma-mediated immunity, whether the
          lesion is in cytokine production (as here) or in the response to the cytokine.

          '
        biological_processes:
        - preferred_term: macrophage activation
          term:
            id: GO:0042116
            label: macrophage activation
          modifier: DECREASED
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
      selected_evidence:
        snippet: almost all genetic etiologies of MSMD alter the interferon-gamma (IFN-γ)- mediated immunity
          by impairing or abolishing IFN-γ production or the response to this cytokine.
        supports: SUPPORT
