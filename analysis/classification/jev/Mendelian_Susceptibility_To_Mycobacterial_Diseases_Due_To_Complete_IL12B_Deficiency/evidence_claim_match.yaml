            term:
              id: MONDO:0013954
              label: Mendelian susceptibility to mycobacterial diseases due to complete IL12B deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: IL12B
        gene_term:
          preferred_term: IL12B
          term:
            id: hgnc:5970
            label: IL12B
        association: CAUSATIVE
        variant_origin: GERMLINE
        features: 'IL12B encodes the p40 subunit shared by interleukin-12 (p35/p40) and interleukin-23
          (p19/p40). Disease alleles are biallelic loss-of-function variants — small insertions and deletions,
          splice-site changes, nonsense variants, and one large deletion — each producing a frameshift
          or premature stop and abolishing p40 protein. Reported patients are homozygous and display complete
          IL-12p40 deficiency, with no detectable IL-12p40 or IL-12p70. Most alleles are private founder
          mutations restricted to a single ethnic group (e.g. c.315insA in Saudi Arabia, c.297del8 in
          Tunisia, c.526del2 in Iran).

          '
      selected_evidence:
        snippet: 'There are only 9 different mutant alleles of the IL12B gene: 2 small insertions, 3 small
          deletions, 2 splice site mutations, and 1 large deletion, each causing a frameshift and leading
          to a premature stop codon, and 1 nonsense mutation.'
        supports: SUPPORT
