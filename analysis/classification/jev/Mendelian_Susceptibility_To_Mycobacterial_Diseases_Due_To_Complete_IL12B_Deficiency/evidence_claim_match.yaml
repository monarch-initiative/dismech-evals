      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: UNKNOWN
        notes: No population rate has been established. The largest series reported 49 patients from 30
          kindreds across five countries (India, Iran, Pakistan, Saudi Arabia, Tunisia), and IL-12p40
          deficiency was estimated to account for less than 9% of MSMD cases. Almost all patients carry
          private founder alleles concentrated in consanguineous populations, and no patient had been
          diagnosed in a low-consanguinity country at the time of that review, so the count reflects ascertainment
          as much as true frequency. Recorded as a literature case count rather than a rate for that reason.
      selected_evidence:
        snippet: IL-12p40 deficiency is therefore thought to be a very rare genetic etiology of MSMD,
          estimated to account for less than 9% of cases.
        supports: SUPPORT
