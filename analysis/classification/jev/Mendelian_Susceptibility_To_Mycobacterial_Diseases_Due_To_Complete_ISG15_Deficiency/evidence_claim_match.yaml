  15ad2d3795ceef3dc6699ade421a5d82a02c5500aeef833ff8037b69e8748df4:
    claim:
      about:
        disease:
          name: Mendelian Susceptibility To Mycobacterial Diseases Due To Complete ISG15 Deficiency
          disease_term:
            preferred_term: Mendelian susceptibility to mycobacterial diseases due to complete ISG15 deficiency
            term:
              id: MONDO:0014502
              label: Mendelian susceptibility to mycobacterial diseases due to complete ISG15 deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: ISG15
        gene_term:
          preferred_term: ISG15
          term:
            id: hgnc:4053
            label: ISG15
        association: CAUSATIVE
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'ISG15 encodes a small ubiquitin-like protein induced by type I interferon. Disease
          alleles are biallelic and abolish protein function: the founding MSMD kindreds carried a homozygous
          nonsense variant in exon 2 and a homozygous frameshift insertion, the calcification kindred
          a homozygous nonsense variant, and later families a whole-gene deletion, a point variant in
          trans with a 1p36.33 microdeletion, and a homozygous missense allele that leaves protein expressed
          but functionally null. Patient cells show no detectable ISG15 protein and no interferon-inducible
          ISGylation, while ISG15 mRNA induction and ISGF3 binding are normal, so the truncating alleles
          act by loss of the protein rather than by a signalling defect upstream of it.

          '
      selected_evidence:
        snippet: These data suggest that the two mutant ISG15 alleles are loss-of-expression.
        supports: SUPPORT
    origin:
