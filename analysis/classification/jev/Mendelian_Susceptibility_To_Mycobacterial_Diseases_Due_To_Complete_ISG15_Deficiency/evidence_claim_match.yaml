          but functionally null. Patient cells show no detectable ISG15 protein and no interferon-inducible
          ISGylation, while ISG15 mRNA induction and ISGF3 binding are normal, so the truncating alleles
          act by loss of the protein rather than by a signalling defect upstream of it.

          '
      selected_evidence:
        snippet: Functional analysis revealed that this variant impaired ISGylation and disrupted the
          stabilization of USP18, leading to defective negative regulation of IFN-I signaling and consequent
          excessive IFN-I production.
        supports: SUPPORT
