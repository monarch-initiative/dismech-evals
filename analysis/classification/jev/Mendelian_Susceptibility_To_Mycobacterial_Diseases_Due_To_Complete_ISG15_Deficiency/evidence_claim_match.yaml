            term:
              id: MONDO:0014502
              label: Mendelian susceptibility to mycobacterial diseases due to complete ISG15 deficiency
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: Burden comes from both arms. The mycobacterial arm produces BCG disease in infancy
          requiring prolonged multidrug chemotherapy; the interferon arm produces recurrent deep necrotising
          skin ulceration that is steroid-refractory, and seizures that were fatal in one of the six patients
          in the founding interferonopathy cohort. Against that, the MSMD component is relatively mild
          compared with IFN-gamma receptor deficiency, and JAK inhibition produces rapid resolution of
          the inflammatory features in the cases reported so far, so the burden is high but not uniformly
          lethal.
      selected_evidence:
        snippet: Three of the six ISG15-deficient individuals experienced epileptic seizures, which were
          lethal in one case.
        supports: SUPPORT
    origin:
      assertion_path: /clinical_burden
      evidence_path: /clinical_burden/evidence/0
      context_paths:
