  2d5c40544e4f64c5c62aeee296c9d331506abd6d1c0bc04f74512916e848a144:
    claim:
      about:
        disease:
          name: Mendelian Susceptibility To Mycobacterial Diseases Due To Complete ISG15 Deficiency
          disease_term:
            preferred_term: Mendelian susceptibility to mycobacterial diseases due to complete ISG15 deficiency
            term:
              id: MONDO:0014502
              label: Mendelian susceptibility to mycobacterial diseases due to complete ISG15 deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Janus Kinase Inhibition
        description: 'Baricitinib blocks signalling downstream of the type I interferon receptor and so
          interrupts the arm of the disease that the ISG15 lesion drives by removing the USP18 brake.
          It is the mechanistically targeted treatment for the inflammatory and neurological features
          and does not address the mycobacterial arm. Reported responses are rapid and, in one sibling,
          complete; reported dosing in these case reports is 2 mg orally twice daily with a tapering course
          of oral prednisolone. The evidence is at the level of individual case reports, not trials.

          A caveat carried over from the wider type I interferonopathy literature rather than from ISG15
          deficiency itself: in Aicardi-Goutieres syndrome, intracranial calcification has been found
          at post-mortem to be extensive despite baricitinib started at two months of age and continued
          for over four years, which the authors attribute to poor CNS bioavailability. No comparable
          long-term neurological follow-up has been published for ISG15 deficiency, so whether early JAK
          inhibition protects the brain in this disease is unknown.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: baricitinib
            term:
              id: CHEBI:95341
              label: baricitinib
      selected_evidence:
        snippet: Finally, we demonstrate the complete and rapid resolution of clinical symptoms associated
          with ISG15 deficiency in one sibling from the second family following treatment with the Janus
          kinase (JAK) inhibitor baricitinib.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
