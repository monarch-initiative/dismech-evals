          from two consanguineous kindreds (Turkey, Iran), extended in 2015 by Chinese siblings ascertained
          through intracranial calcification, and by 2023 a review of the published literature put the
          total at fewer than 100 cases worldwide. Recorded as a literature case count rather than a rate.
      selected_evidence:
        snippet: ISG15 deficiency remains an extremely rare disease, with fewer than 100 cases reported
          worldwide.
        supports: SUPPORT
