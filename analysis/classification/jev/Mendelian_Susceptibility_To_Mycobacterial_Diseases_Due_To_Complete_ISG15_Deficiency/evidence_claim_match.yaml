      assertion:
        name: Impaired ISG15-Dependent IFN-gamma Production by NK and T Cells
        biological_scale: CELLULAR
        description: 'NK cells are the key ISG15-responsive population, with T cells contributing. Without
          extracellular ISG15 these cells produce only small amounts of IFN-gamma on mycobacterial challenge
          - impaired but not abolished, the same quantitative picture as IL-12p40 and IL-12Rbeta1 deficiency
          and the reason the MSMD is relatively mild. Adding recombinant ISG15 back to patient blood restores
          IFN-gamma nearly to normal. The receptor is the LFA-1 integrin (CD11a/CD18): ISG15 binds the
          CD11a alphaI domain, and engagement drives SRC-family kinase activation and cytokine release,
          so what the deficiency removes is a defined outside-in signal rather than an unspecified soluble
          factor.

          '
        biological_processes:
