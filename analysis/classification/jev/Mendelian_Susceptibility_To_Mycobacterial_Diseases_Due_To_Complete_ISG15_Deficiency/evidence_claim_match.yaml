        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: isg15_mouse_human_antiviral_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Mouse Isg15 is an antiviral effector and Isg15-null mice are virus-susceptible, while
          ISG15-deficient humans have no unusual viral susceptibility and their fibroblasts are more virus-resistant
          than controls. Does any part of the murine antiviral ISGylation phenotype apply to human ISG15
          deficiency?
        rationale: 'The divergence is not a matter of degree but of direction, and it has a stated mechanistic
          cause: human ISG15 is required to sustain USP18 and mouse Isg15 is not, so losing ISG15 raises
          the interferon set-point in humans and does not in mice. That makes murine inferences about
          ISGylation-dependent antiviral immunity unsafe to carry into the human disease, which matters
          because the mouse literature came first and framed the expectation the first patients were measured
          against. What remains genuinely open is whether human ISGylation has any antiviral role against
          pathogens these few patients have not met - the authors state the negative result cannot exclude
          it - and whether the enhanced antiviral state confers clinical protection rather than only a
          cell-culture advantage.'
        attaches_to:
        - pathophysiology#Enhanced Cellular Antiviral Resistance
        - animal_models#Mouse
      selected_evidence:
        snippet: This experiment of nature shows that human ISGylation is largely redundant for antiviral
          immunity, but that ISG15 plays an essential role as an IFN-γ-inducing secreted molecule for
          optimal antimycobacterial immunity.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22859821
      reference_title: Mycobacterial disease and impaired IFN-γ immunity in humans with inherited ISG15
        deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: States the human conclusion that contradicts the murine expectation, and the one function
