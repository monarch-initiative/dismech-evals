      - /disease_term
    evidence_metadata:
      reference: PMID:25307056
      reference_title: Human intracellular ISG15 prevents interferon-α/β over-amplification and auto-inflammation.
      evidence_source: HUMAN_CLINICAL
      explanation: Records death from seizures in the interferonopathy arm, the most severe outcome documented
        and the main driver of the HIGH burden assessment.
