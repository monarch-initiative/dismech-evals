      assertion_type: Diagnosis
      assertion:
        name: ISG15 sequencing
        description: 'Molecular confirmation identifies the biallelic ISG15 genotype. Because the two
          presentations look like two different diseases - a pediatric infectious-disease problem and
          a pediatric neurology or dermatology problem - the genotype is often what unifies them, and
          exome sequencing made the connection both in the founding MSMD kindreds and in the kindred labelled
          idiopathic basal ganglia calcification. A normal-appearing protein does not exclude the diagnosis:
          one reported allele is missense and functionally null.

          '
      selected_evidence:
        snippet: Whole-exome sequencing (WES) of P5 and P6 and their healthy mother identified only one
          common nonsense homozygous mutation, which had not been reported in public databases or in in-house
          WES data for 1,500 other individuals
        supports: SUPPORT
