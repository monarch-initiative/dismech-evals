              pending genetic testing. The pediatric timing problem is acute: in endemic countries BCG
              is given at or shortly after birth, months before any presentation that would prompt testing.
              The unvaccinated ISG15-deficient siblings have no mycobacterial phenotype, which is the
              clearest available evidence that withholding the exposure prevents that arm of the disease.

