        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: 'Disease requires biallelic loss-of-function ISG15 variants. Reported patients are
          homozygous (nonsense, frameshift, whole-gene deletion, or a functionally null missense allele)
          or compound heterozygous for a point variant and a contiguous microdeletion; parents are healthy
          heterozygotes and consanguinity is common in the reported kindreds. Expressivity within a family
          is wide: two siblings homozygous for the same novel null allele presented differently, one with
          skin lesions and the other with intracranial calcification and recurrent pneumonia, so a sibling''s
          presentation does not predict the proband''s.

          '
      selected_evidence:
        snippet: In both families, the segregation of the ISG15 mutant alleles was consistent with autosomal
          recessive MSMD.
        supports: SUPPORT
