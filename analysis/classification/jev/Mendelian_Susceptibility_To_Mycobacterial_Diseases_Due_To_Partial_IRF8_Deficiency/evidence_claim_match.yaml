            name: Adjunctive Recombinant Interferon Gamma
            description: 'Recombinant IFN-gamma is the mechanistically rational adjunct for an MSMD etiology
              on the production side of the circuit, which is where an IRF8 defect sits: the lesion reduces
              the IFN-gamma signal reaching macrophages rather than their ability to respond to it, so
              supplying the cytokine bypasses the block. The published experience is from other MSMD genotypes,
              not from an IRF8 patient.'
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: recombinant interferon gamma-1b
                term:
                  id: NCIT:C100089
                  label: Interferon Gamma-1b
            therapeutic_modality: PROTEIN_REPLACEMENT
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Insufficient Interferon-Gamma-Dependent Macrophage Activation
        treatment_effect: ACTIVATES
        description: Exogenous IFN-gamma acts directly on the node the disease chain fails at, downstream
          of the DC and IL-12 steps that the IRF8 lesion disables. It activates the macrophage response
          rather than repairing the production defect above it, which is why the effect is ACTIVATES and
          not RESTORES.
      selected_evidence:
        snippet: A 30-month treatment regimen of antimycobacterial treatment combined with recombinant
          IFN-γ1b was tried for the first time in patients carrying the PF75S mutation, and the patients
          recovered well after treatment.
        supports: SUPPORT
        directness: INDIRECT
