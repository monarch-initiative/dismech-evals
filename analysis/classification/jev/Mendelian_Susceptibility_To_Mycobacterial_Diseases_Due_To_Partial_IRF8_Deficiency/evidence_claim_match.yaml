          distinguishes the partial from the complete form, and what makes the diagnosis reachable at
          all in a patient whose routine immunology is normal. Monocytes preserved with selective loss
          of CD11c+CD1c+ conventional DCs indicates the dominant form; absence of monocytes and all DC
          subsets indicates the recessive one.
