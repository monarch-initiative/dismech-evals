            gene_term:
              preferred_term: IRF8
              term:
                id: hgnc:5358
                label: IRF8
            relationship_type: CAUSATIVE
            presence: PRESENT
            variant_origin: GERMLINE
            notes: The reported dominant allele is the T80A missense substitution. Both T80A and the recessive
              K108E allele act by disrupting the IRF8-DNA interaction rather than by reducing IRF8 expression,
              which is why the two produce graded rather than qualitatively different transcriptional
              lesions even though the diseases differ.
          role: ancestor
      assertion_type: Variant
      assertion:
        name: IRF8 T80A
        description: 'The heterozygous missense substitution that defines this entry. It sits in the IRF8
          DNA-binding domain and impairs the IRF8-DNA interaction rather than IRF8 expression. It is what
          separates this autosomal dominant, partial deficiency from the autosomal recessive complete
          deficiency caused by the biallelic K108E allele: the same kind of lesion, in the same domain,
          at a different dose.'
      selected_evidence:
        snippet: Mutation T80A causes autosomal dominant IRF8 deficiency and a milder form of the disease
          with selective loss of a subset of dendritic cells.
        supports: SUPPORT
