            term:
              id: MONDO:0006042
              label: meningeal tuberculosis
        context: []
      assertion_type: Treatment
      assertion:
        name: Adjunctive Dexamethasone
        description: Dexamethasone is recommended as adjunctive host-directed therapy and lowers early
          CSF MMP-9, but its survival benefit is modest and heterogeneous. A phase 3 trial in HIV-negative
          adults stratified by LTA4H genotype found no benefit over placebo in CC and CT genotypes and
          no better outcome in TT genotype, so genotype-guided steroid use is not established.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: dexamethasone
            term:
              id: CHEBI:41879
              label: dexamethasone
        effect_modifiers:
        - effect_modifier_type: GENOTYPE
          stratum: LTA4H TT genotype (open-label dexamethasone)
          comparator_stratum: LTA4H CC or CT genotype
          modified_outcome: all-cause death or new neurological event over 12 months
          effect_in_stratum: NO_DIFFERENCE
          modification_analysis: CROSS_STRATUM_COMPARISON
          description: HIV-negative Vietnamese adults. TT-genotype participants were not randomized and
            all received dexamethasone, so this compares outcomes across genotype strata within one trial
            rather than a randomized treatment-by-genotype interaction. Among randomized CC and CT participants,
            dexamethasone and placebo outcomes did not differ, and no prespecified subgroup showed benefit
            or heterogeneity (NCT03100786).
      selected_evidence:
        snippet: Dexamethasone significantly reduced CSF MMP-9 concentrations in early follow up samples
          (median 5 days (range 3-8) of treatment), but had no significant influence on other MMPs/TIMPs.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19789647
      reference_title: Dexamethasone, cerebrospinal fluid matrix metalloproteinase concentrations and
        clinical outcomes in tuberculous meningitis.
      evidence_source: HUMAN_CLINICAL
      explanation: Mechanistically links dexamethasone to lower early MMP-9 in CSF during tuberculous
        meningitis treatment.
