      assertion:
        target: Blood-Brain Barrier Disruption
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: TISSUE
        description: Infected mice develop blood-brain barrier breakdown with MMP-9 secretion when SHH
          signalling is pharmacologically blocked.
        limitations: Barrier breakdown is produced under cyclopamine antagonism of SHH, an artificial
          accelerant with no counterpart in human TBM, in mice rather than humans; the basal exudate,
          arteritis and hydrocephalus are not reported.
      selected_evidence:
        snippet: Immunohistochemistry demonstrated that CYC caused severe BBB breakdown and reactive gliosis,
          while PUR partially attenuated this response.
        supports: SUPPORT
