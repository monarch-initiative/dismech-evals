        - path: /pathophysiology/0
          value:
            name: MKHK-Region Missense or In-Frame Variant in CBP/p300
            description: A heterozygous missense or in-frame indel variant alters one residue or a few
              residues in the C-terminal MKHK region of CBP or p300 (ZZ domain, TAZ2 domain, or the first
              helix of ID4). Unlike RSTS alleles, these variants are predicted to produce a full-length
              protein. Most cluster around the zinc-coordinating residues of the two zinc fingers or around
              ID4 residues predicted to hydrogen-bond with the HAT domain.
            biological_scale: MOLECULAR
            mechanism_confidence: ESTABLISHED
            genes:
            - preferred_term: CREBBP
              term:
                id: hgnc:2348
                label: CREBBP
            - preferred_term: EP300
              term:
                id: hgnc:3373
                label: EP300
            genetic_context:
              variant_origin: GERMLINE
              zygosity: HETEROZYGOUS
            notes: 'functional_impact_category is left unset: no functional study of a patient variant
              has established whether these alleles act as gain-of-function, dominant-negative or neomorphic
              alleles. A small number of truncating variants in the last exon of CREBBP and EP300 have
              also been reported with an MKHK-like phenotype, so the variant class is not exclusively
              missense or in-frame.'
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Disrupted ZZ/TAZ2 Zinc-Finger Fold and ID4 Interface
        causal_link_type: DIRECT
        description: Substitutions at or next to zinc-coordinating residues are expected to destabilize
          the zinc-finger fold; ID4 substitutions are predicted to disturb hydrogen bonds with the HAT
          domain. This is a structural prediction, not a measured effect.
      selected_evidence:
        snippet: Variants in these domains were thus hypothesized to affect the coordinating properties
          of the two zinc-finger domains of CBP/p300 by affecting their proper folding.
        supports: SUPPORT
        directness: INDIRECT
