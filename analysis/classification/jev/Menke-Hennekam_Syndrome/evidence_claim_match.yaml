              label: Menke-Hennekam syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: MKHK-ID4
        display_name: MKHK, ID4 linker helix subtype
        description: Variants in the first alpha helix of the fourth intrinsically disordered linker (CBP
          residues 1,852-1,875; p300 1,810-1,833), including the recurrent CREBBP c.5602C>T p.(Arg1868Trp).
          This is the largest subtype, with a recognizable face (prominent forehead, short upslanted palpebral
          fissures, ptosis/blepharophimosis, depressed nasal bridge, short nose, anteverted nares, short
          columella, long philtrum) and a robust diagnostic blood episignature (21 of 21 tested). Domain-defined
          subtype without its own MONDO class.
      selected_evidence:
        snippet: Domain-specific methylation profiles were discerned for the ZZ domain in CBP/p300 (found
          in nine out of 10 tested individuals) and TAZ2 domain in CBP (in 14 out of 20), while a domain-specific
          diagnostic episignature was refined for the ID4 domain in CBP/p300 (in 21 out of 21).
        supports: SUPPORT
