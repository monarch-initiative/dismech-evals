      assertion_type: Discussion
      assertion:
        discussion_id: mkhk_variant_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do MKHK variants act by altering zinc-finger-mediated partner binding, by increasing or
          redirecting CBP/p300 acetyltransferase activity, or by different mechanisms in the ZZ, TAZ2
          and ID4 subtypes?
        attaches_to:
        - pathophysiology#Disrupted ZZ/TAZ2 Zinc-Finger Fold and ID4 Interface
        - pathophysiology#Dysregulated CBP/p300 Acetyltransferase Activity
        - mechanistic_hypotheses#altered_zinc_finger_interaction
        - mechanistic_hypotheses#hat_gain_of_function
        rationale: No functional study of patient variants has been published. The two hypotheses rest
          on variant position, structural modeling, facial similarity to 16p13.3 duplication, methylation
          direction, and biochemistry of cancer mutations or engineered deletions. The subtype-specific
          phenotypes and methylation profiles suggest the mechanism may differ by domain, and truncating
          last-exon variants with an MKHK-like phenotype further complicate a single explanation.
      selected_evidence:
        snippet: These focus on functional impact of the presently reported variants in ZZ, TAZ2, and
          ID4 that are needed to confirm our hypothesis that variants in ID4 result in a gain of function.
        supports: SUPPORT
