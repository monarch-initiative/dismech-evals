        hypothesis_label: Gain of CBP/p300 acetyltransferase function
        status: EMERGING
        description: MKHK variants, particularly in ID4 and TAZ2, relieve the restraint these regions
          place on the HAT domain or alter its substrate specificity, giving a gain of function that opposes
          the loss of function in RSTS. Supported indirectly by facial resemblance to 16p13.3 duplication,
          by opposite methylation direction to RSTS, and by structural studies of p300 autoinhibition;
          the cohort authors state that functional studies are needed to confirm it.
      selected_evidence:
        snippet: 3D face shape demonstrated resemblance to individuals with a duplication of 16p13.3 (the
          region that includes CREBBP), possibly indicating a gain of function.
        supports: SUPPORT
