      assertion_type: Subtype
      assertion:
        name: MKHK-ZZ
        display_name: MKHK, ZZ zinc-finger domain subtype
        description: Variants in the ZZ zinc-finger domain of CBP or p300 (CBP residues 1,705-1,745; p300
          1,668-1,708). Intellectual disability is typically mild, and the subtype is marked by overweight,
          hypermetropia, dental anomalies (mostly missing teeth) and hormonal problems. A mild blood DNA
          methylation profile was found in nine of ten tested individuals. This is a domain-defined subtype
          without its own MONDO class; it contains both CREBBP and EP300 variants.
      selected_evidence:
        snippet: These findings demonstrate existence of at least three MKHK subtypes, which are domain
          specific (MKHK-ZZ, MKHK-TAZ2, and MKHK-ID4) rather than gene specific (CREBBP/EP300).
        supports: SUPPORT
    origin:
