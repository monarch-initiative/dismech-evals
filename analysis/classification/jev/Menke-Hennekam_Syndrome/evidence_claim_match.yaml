      assertion:
        name: Dysregulated CBP/p300 Acetyltransferase Activity
        description: CBP and p300 are histone and protein acetyltransferases. The TAZ2 domain and the
          ID4 helix sit against the HAT domain and are proposed to regulate it, so MKHK variants could
          release autoinhibition or change substrate specificity rather than abolish catalysis. This is
          the gain-of-function hypothesis; it is supported by structural work on p300 and on engineered
          deletions of the region, and by the observation that MKHK faces resemble 16p13.3 duplication
          (CREBBP gain of dosage) rather than RSTS. No patient variant has been shown to increase HAT
          activity.
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        genes:
        - preferred_term: CREBBP
