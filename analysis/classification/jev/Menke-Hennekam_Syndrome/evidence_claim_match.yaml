            term:
              id: MONDO:0020774
              label: Menke-Hennekam syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mkhk_unexplained_phenotypes
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which mechanisms produce the clinical features of MKHK - intellectual disability, autistic
          behavior, short stature, microcephaly, feeding problems, hearing and visual impairment, recurrent
          infections, the facial gestalt, the ZZ-subtype overweight and the TAZ2/ID4 muscle hypertrophy,
          contractures and clubfeet?
        attaches_to:
        - phenotypes#
        - pathophysiology#Dysregulated Neurodevelopmental Transcriptional Program
        rationale: The published literature on MKHK is clinical delineation (case reports and cohorts)
          plus blood and iPSC methylation profiling. No study connects a molecular or cellular change
          to any specific clinical feature, and no animal or cellular model of an MKHK variant has been
          reported in the sources cited here. Apart from the structural brain anomalies, the phenotypes
          are therefore left without an upstream mechanism node. The subtype-specific features (overweight
          and hypermetropia in MKHK-ZZ; muscle hypertrophy, contractures and clubfeet in MKHK-TAZ2 and
          MKHK-ID4) suggest domain-specific downstream pathways.
      selected_evidence:
        snippet: Phenotypes including intellectual disability of varying degree and distinct physical
          features were defined for each of the regions.
        supports: SUPPORT
