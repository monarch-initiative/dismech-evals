          value:
            name: Viable brindled mouse (Atp7a Mo-vbr)
            species: Mouse
            genotype: Atp7a<Mo-vbr>/Y (hemizygous male)
            alleles:
            - Atp7a<Mo-vbr>
            genes:
            - preferred_term: ATP7A
              term:
                id: hgnc:869
                label: ATP7A
            publication: PMID:9342151
            description: A viable mottled allele assessed by 31P magnetic resonance spectroscopy and enzymology
              as a model of mitochondrial impairment. Two respiratory-chain activities are reduced in
              a tissue-specific pattern - succinate-cytochrome c reductase in muscle and the copper-dependent
              cytochrome oxidase in brain - and phosphocreatine recovery after exercise is slowed. Only
              cytochrome oxidase (complex IV) is a cuproenzyme; succinate-cytochrome c reductase spans
              complexes II and III, which use flavin, iron-sulfur clusters and hemes, so the muscle deficit
              is not itself evidence of cuproenzyme failure.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Cuproenzyme deficiency and neurodevelopmental injury
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: Reduced cytochrome oxidase activity in brain is the cuproenzyme deficit that this
          node names, measured directly in the tissue where Menkes disease causes neurodegeneration.
        limitations: The study measures enzyme activities and energetics, not neurodevelopmental outcome,
          so it substantiates the cuproenzyme arm rather than the injury arm. The deficits are tissue-restricted
          - cytochrome oxidase is reduced in brain but not muscle - so a single-tissue assay does not
          generalize across organs. Mo-vbr is a mouse allele, not a human ATP7A variant.
        readouts:
        - name: Cytochrome oxidase activity in brain
          target: Cuproenzyme deficiency and neurodevelopmental injury
          direction: DECREASED
          interpretation: Direct catalytic-activity measurement of a copper-dependent respiratory-chain
            enzyme in the affected tissue.
      selected_evidence:
        snippet: We conclude that mo(vbr) brain and muscle tissue have biochemical abnormalities consistent
          with mitochondrial impairment.
        supports: SUPPORT
