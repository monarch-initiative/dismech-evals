          term:
            id: GO:0005739
            label: mitochondrion
        locations:
        - preferred_term: kidney
          term:
            id: UBERON:0002113
            label: kidney
      selected_evidence:
        snippet: Redox misbalance does not significantly affect mitochondrion morphology or the activity
          of respiratory complex IV but markedly increases cell sensitivity to even mild glutathione depletion,
          resulting in loss of cell viability.
        supports: SUPPORT
