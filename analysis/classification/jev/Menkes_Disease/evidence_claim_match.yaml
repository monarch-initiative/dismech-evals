        biological_scale: CELLULAR
        description: In cells lacking functional ATP7A, copper accumulates in mitochondria and disrupts
          glutathione-based redox buffering. This renders cells highly sensitive to oxidative stress and
          contributes to tissue injury, particularly in renal epithelia where copper paradoxically accumulates.
        cell_types:
        - preferred_term: epithelial cell of proximal tubule
          term:
            id: CL:0002306
            label: epithelial cell of proximal tubule
        biological_processes:
        - preferred_term: cellular response to oxidative stress
          term:
            id: GO:0034599
