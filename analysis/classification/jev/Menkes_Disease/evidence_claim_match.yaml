              label: Menkes disease
        context: []
      assertion_type: Genetic
      assertion:
        name: ATP7A pathogenic variants
        gene_term:
          preferred_term: ATP7A
          term:
            id: hgnc:869
            label: ATP7A
        association: Loss-of-function
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Positive
        notes: ATP7A encodes a copper-transporting P-type ATPase required for copper export across polarized
          epithelia and copper delivery to secretory-pathway cuproenzymes. Disease-causing variants include
          missense, nonsense, frameshift, splice-site, and copy-number defects, with more severe phenotypes
          generally associated with variants that abolish residual copper transport.
        variants:
        - name: ATP7A severe loss-of-function variants
          description: Nonsense, frameshift, splice-site, and copy-number ATP7A variants can severely
            reduce or abolish copper transport, creating the classic early infantile Menkes pathograph
            that begins with failed epithelial copper export.
          gene:
            preferred_term: ATP7A
            term:
              id: hgnc:869
              label: ATP7A
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: ATP7A copper transport activity
            description: Abrogates or severely reduces ATP7A copper transport activity.
            type: loss-of-function
        - name: ATP7A residual-function variants
          description: Some ATP7A variants preserve partial ATPase activity or some correctly spliced
            transcript, producing residual copper transport that can modify severity and response to early
            copper treatment.
          gene:
            preferred_term: ATP7A
            term:
              id: hgnc:869
              label: ATP7A
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: ATP7A copper transport activity
            description: Preserves partial ATP7A copper transport or correctly spliced ATP7A transcript.
            type: partial loss-of-function
      selected_evidence:
        snippet: Truncating mutations are frequently associated with CMD, in contrast with splice site
          and intronic mutations which are more prevalent in OHS.
        supports: SUPPORT
