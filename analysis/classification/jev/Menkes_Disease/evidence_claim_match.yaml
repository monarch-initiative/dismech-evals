              label: Menkes disease
        context:
        - path: /animal_models/0
          value:
            name: Brindled mouse (Atp7a Mo-br)
            species: Mouse
            genotype: Atp7a<Mo-br>/Y (hemizygous male)
            background: C57BL/6-Atp7a<Mo-br>/J
            alleles:
            - Atp7a<Mo-br>
            genes:
            - preferred_term: ATP7A
              term:
                id: hgnc:869
                label: ATP7A
            publication: PMID:16371425
            description: 'The brindled allele of the mouse mottled series, the long-standing Menkes model.
              The study cited here uses it to show that ATP7A is required to load copper onto a secretory
              cuproenzyme in the trans-Golgi network: aortic and fibroblast SOD3 loses specific activity
              while cytosolic SOD1 does not, and copper supplementation partially restores it. That rescue
              is the point of curating this model against an amount-versus-activity node - the enzyme
              protein is present, and what is missing is its metal cofactor.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: ATP7A-mediated copper export failure
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: A mutant Atp7a allele reproduces the failure to deliver copper through the secretory
          pathway, assayed in vascular tissue and cultured fibroblasts.
        limitations: Mo-br is a mouse mottled allele, not a human ATP7A variant, and the copper delivery
          step is assayed here only for the trans-Golgi/secretory route to SOD3. The study is a vascular-biology
          investigation rather than a Menkes natural-history study.
        readouts:
        - name: SOD3 specific activity in aorta and cultured fibroblasts
          target: ATP7A-mediated copper export failure
          direction: DECREASED
          interpretation: A specific-activity measurement that falls without the enzyme protein being
            lost, and is partially restored by adding copper - the cofactor-deficiency pattern in which
            activity and amount dissociate. Cytosolic SOD1 is unaffected, which localizes the lesion to
            the secretory route ATP7A serves.
      selected_evidence:
        snippet: In conclusion, vascular MNK plays an essential role in full activity of SOD3 through
          transporting copper to SOD3 in the TGN, thereby regulating O2*- levels in the vasculature.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0/modeled_mechanisms/0
      evidence_path: /animal_models/0/modeled_mechanisms/0/evidence/0
      context_paths:
