      assertion_type: ProgressionInfo
      assertion:
        notes: Affected infants are often neurologically normal at birth but typically deteriorate after
          6 to 10 weeks of age with hypotonia, seizures, failure to thrive, stalled neurodevelopment,
          and progressive neurodegeneration. Untreated classic disease usually causes death before 3 years
          of age.
      selected_evidence:
        snippet: At birth, affected Menkes infants appear healthy and typically develop normally for 6
          to 10 weeks before seizures, failure to thrive, irreversible brain atrophy, and stalled neurodevelopment
          ensue.
        supports: SUPPORT
    origin:
