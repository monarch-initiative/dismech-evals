      assertion_type: Discussion
      assertion:
        discussion_id: gap_mercury_inorganic_arm_not_curated
        prompt: What are the pathophysiology nodes, phenotypes, and treatments of the elemental and inorganic
          mercury arms, which this entry names but does not yet model?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Methylmercury CNS Accumulation and Neuronal Injury
        rationale: The entry is scoped to mercury poisoning generally and its description contrasts the
          organic and inorganic clinical profiles, but every pathophysiology node, phenotype, and exposure
          record curated so far concerns methylmercury and Minamata disease. The inorganic/elemental arm
          — mercury vapour pneumonitis, erethism, acrodynia, and mercury-associated membranous nephropathy
          — has a distinct mechanism, a distinct target-organ profile, and (unlike established methylmercury
          neuronal injury) a chelation-responsive course. Leaving it unmodelled makes the entry read as
          complete for a disease for which only one arm is represented.
        proposed_experiments:
        - experiment_id: exp_mercury_curate_inorganic_arm
          name: Curate the elemental/inorganic mercury arm
          description: 'Build the inorganic/elemental pathograph from primary literature: vapour inhalation
            to chemical pneumonitis; mercuric ion binding to renal tubular and glomerular targets to membranous
            nephropathy and nephrotic syndrome; and CNS deposition to erethism and tremor. Add the chelation
            treatments (succimer/DMSA, unithiol/DMPS) that apply to that arm and not to established methylmercury
            injury.'
      selected_evidence:
        snippet: In contrast, peripheral nerve disease is more characteristic of inorganic mercury intoxication.
        supports: SUPPORT
