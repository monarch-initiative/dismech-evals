      assertion_type: Pathophysiology
      assertion:
        name: Regional Neuronal Degeneration
        description: 'Methylmercury injures characteristic, selectively vulnerable brain regions: cerebellar
          granule cell neurons (producing ataxia), the calcarine/visual cortex (producing visual-field
          constriction), and the somatosensory cortex (producing sensory disturbance). This regional pattern
          of neuronal loss, not a diffuse progressive proteinopathy, defines the neuropathology of Minamata
          disease.'
        role: effector
        cell_types:
        - preferred_term: cerebellar granule cell
          term:
            id: CL:0001031
            label: cerebellar granule cell
        locations:
        - preferred_term: cerebellum
          term:
            id: UBERON:0002037
            label: cerebellum
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
        biological_processes:
        - preferred_term: neuron apoptotic process
          term:
            id: GO:0051402
            label: neuron apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: Visual field constriction due to involvement of the calcarine cortex, sensory disturbance
          due to involvement of the somatosensory cortex, and cerebellar ataxia due to involvement of
          granule cell neurons of the cerebellum are common and characteristic features due to methylmercury
          poisoning.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
