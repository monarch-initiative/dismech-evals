        context: []
      assertion_type: Environmental
      assertion:
        name: Methylmercury-Contaminated Fish and Mercury Exposure
        exposure_term:
          preferred_term: exposure to mercury
          term:
            id: ECTO:0001571
            label: exposure to mercury
        notes: Organic methylmercury bioaccumulates in fish and shellfish; the Minamata epidemic resulted
          from industrial methylmercury discharge contaminating seafood. Other documented exposures include
          contaminated waters in Japan and northwestern Ontario and methylmercury-fungicide-treated seed
          grain in Iraq. Occupational and elemental/inorganic mercury exposures (e.g., the historical
          felt-hat industry) produce a different, predominantly peripheral and neuropsychiatric syndrome.
          Notably, an international case-control comparison found no association between mercury exposure
          from seafood consumption or dental amalgam fillings and amyotrophic lateral sclerosis.
      selected_evidence:
        snippet: psychosis is more typical of exposure to inorganic mercury, which has been documented
          in the felt hat industry
        supports: SUPPORT
