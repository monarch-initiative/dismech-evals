      assertion_type: Diagnosis
      assertion:
        name: Blood, hair, and toenail mercury measurement
        description: 'Mercury concentration in blood, hair, and toenail samples documents exposure and
          is the standard laboratory approach to suspected mercury poisoning. Interpretation is bounded:
          in patients presenting with established chronic neurological disease these matrices may not
          reflect the remote exposure that caused the neuronal injury, so a normal result late in the
          course does not exclude prior methylmercury poisoning.'
        diagnosis_term:
          preferred_term: Laboratory Procedure
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
