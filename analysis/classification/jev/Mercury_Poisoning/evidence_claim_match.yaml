      assertion_type: Pathophysiology
      assertion:
        name: Methylmercury CNS Accumulation and Neuronal Injury
        conforms_to: glutamate_excitotoxicity#Glutamate Receptor Overactivation and Calcium Overload
        description: 'Methylmercury readily crosses the blood-brain barrier and accumulates in the central
          nervous system, where it injures neurons through several converging molecular mechanisms: glutathione/thiol
          (NPSH) depletion with reactive-oxygen-species overproduction (oxidative stress), intracellular
          calcium dyshomeostasis, and NMDA-receptor-mediated excitotoxicity. These insults drive neuronal
          apoptosis and underlie the regional neurodegeneration of the disease.'
        role: trigger
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
      selected_evidence:
        snippet: Methylmercury (MeHg) is an extremely dangerous environmental pollutant that induces severe
          toxic effects in the central nervous system.
        supports: SUPPORT
