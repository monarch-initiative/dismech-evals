            term:
              id: MONDO:0020476
              label: mesial temporal lobe epilepsy with hippocampal sclerosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mtlehs_rodent_post_se_model_fidelity
        prompt: Do rodent post-status-epilepticus models (kainate, pilocarpine) faithfully recapitulate
          human MTLE-HS, including the years-long human latent period, the febrile-status-epilepticus
          etiology, and the characteristic pattern and laterality of hippocampal sclerosis?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Hippocampal Sclerosis
        rationale: 'Rodent chemoconvulsant models reproduce HS-like neuronal loss and gliosis and generate
          spontaneous seizures, and are the workhorse for mechanistic and antiepileptogenesis studies.
          However, their fidelity to human MTLE-HS is debated: the human latent period spans years rather
          than days to weeks, the common human antecedent of febrile status epilepticus is not modeled
          by direct intracerebral excitotoxin injection, and the acute, bilateral, and often severe sclerosis
          induced in rodents may not match the typically unilateral, subfield-specific human sclerosis
          pattern. This is a model-evidence-exists-but-human-validity-uncertain gap rather than a missing
          assertion.'
        proposed_experiments:
        - experiment_id: exp_mtlehs_cross_species_sclerosis_concordance
          name: Cross-species concordance of sclerosis pattern and latent-period biology
          description: Systematically compare rodent post-status-epilepticus hippocampi with resected
            human MTLE-HS tissue for subfield-specific neuronal loss pattern, laterality, gliosis, and
            mossy fiber sprouting, and map the temporal dynamics of epileptogenesis onto the human latent-period
            timescale.
          experiment_type:
            preferred_term: cross-species histopathological concordance study
          readouts:
          - name: Sclerosis pattern and laterality concordance
            target: pathophysiology#Hippocampal Sclerosis
            biological_processes:
            - preferred_term: chemical synaptic transmission
              term:
                id: GO:0007268
                label: chemical synaptic transmission
              modifier: DYSREGULATED
            assays:
            - preferred_term: histopathology
            - preferred_term: immunohistochemistry
            direction: POSITIVE
          controls:
          - name: Non-epileptic autopsy and naive rodent hippocampus
            description: Non-epileptic human autopsy hippocampus and naive rodent hippocampus as baselines
              for the sclerosis-pattern comparison.
          decision_criterion: Rodent post-SE models are supported as faithful when their subfield sclerosis
            pattern, laterality, and epileptogenic time-course scale concordantly to human MTLE-HS; systematic
            divergence flags a human-model mismatch requiring cautious extrapolation.
          would_support:
          - pathophysiology#Hippocampal Sclerosis
      selected_evidence:
        snippet: kainic acid (KA) was stereotactically injected into the hippocampal CA1 region of mice,
          followed by a 7-day postinjection period.
        supports: SUPPORT
