              label: mesial temporal lobe epilepsy with hippocampal sclerosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mtlehs_epileptogenesis_drivers_vs_bystanders
        prompt: During the latent period of MTLE-HS, which molecular and cellular changes in the sclerotic
          hippocampus (neuroinflammation, reactive gliosis, mossy fiber sprouting, altered synaptic signaling)
          are causal drivers of epileptogenesis versus reactive bystanders?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Hippocampal Sclerosis
        - pathophysiology#Large-Scale Network Reorganization
        rationale: The mechanisms converting an injured hippocampus into a chronically epileptic network
          remain unresolved. Transcriptomic profiling of the epileptic hippocampus reveals many reactive
          changes in glia and neurons, but whether inflammatory activation and synaptic remodeling drive
          epileptogenesis or merely accompany it is unknown. Separating drivers from bystanders is prerequisite
          to any disease-modifying (antiepileptogenic) intervention and to weighting the causal edge from
          the sclerotic focus to network reorganization.
        proposed_experiments:
        - experiment_id: exp_mtlehs_latent_period_causal_perturbation
          name: Latent-period causal perturbation of candidate epileptogenic drivers
          description: In a post-status-epilepticus model, selectively suppress individual candidate mechanisms
            (e.g., neuroinflammatory signaling, reactive astrogliosis, mossy fiber sprouting) during the
            latent period and measure whether spontaneous recurrent seizures are prevented or delayed,
            thereby classifying each change as driver versus bystander.
          experiment_type:
            preferred_term: targeted mechanism perturbation experiment
          readouts:
          - name: Spontaneous recurrent seizure emergence
            target: pathophysiology#Large-Scale Network Reorganization
            biological_processes:
            - preferred_term: transmission of nerve impulse
              term:
                id: GO:0019226
                label: transmission of nerve impulse
              modifier: DYSREGULATED
            assays:
            - preferred_term: electroencephalography
            direction: NEGATIVE
          controls:
          - name: Vehicle/untargeted controls
            description: Model animals receiving inactive or non-targeting intervention over the same
              latent-period window.
          decision_criterion: A mechanism is classified as a causal driver if its latent-period suppression
            reproducibly prevents or substantially delays spontaneous recurrent seizures; changes without
            such effect are reclassified as reactive bystanders.
          would_support:
          - pathophysiology#Large-Scale Network Reorganization
      selected_evidence:
        snippet: The mechanisms underlying TLE-HS development remain unclear, but the reactive transcriptomic
          changes in glial cells and neurons of the hippocampus post-epileptogenesis may provide insights.
        supports: SUPPORT
