  2a8f05aeb7afdef1696abb53f59f2f3d32fdd76472a6e0070c6b8ea8f2a1469a:
    claim:
      about:
        disease:
          name: Mesial Temporal Lobe Epilepsy with Hippocampal Sclerosis
          disease_term:
            preferred_term: mesial temporal lobe epilepsy with hippocampal sclerosis
            term:
              id: MONDO:0020476
              label: mesial temporal lobe epilepsy with hippocampal sclerosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mtlehs_sclerosis_cause_or_consequence
        prompt: Is hippocampal sclerosis in MTLE-HS the primary cause of the epilepsy or a progressive
          consequence of recurrent seizures? Does an initial precipitating injury (e.g., febrile status
          epilepticus) produce the sclerotic lesion that then drives epileptogenesis, or do ongoing seizures
          themselves generate and worsen the sclerosis over time?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Hippocampal Sclerosis
        rationale: The causal direction between hippocampal sclerosis and seizures is a long-standing,
          unresolved chicken-or-egg question. Prospective imaging after febrile status epilepticus shows
          that an initial precipitating injury can predict later hippocampal sclerosis and MTLE, favoring
          a lesion-first model; yet the etiology of MTLE-HS is heterogeneous, with multiple risk factors
          that may precede HS, and seizure-driven progressive injury remains a competing account. Because
          dismech models the sclerotic hippocampus as the epileptogenic focus, whether that lesion is
          upstream cause, downstream consequence, or a self-reinforcing loop directly affects how the
          causal edges out of this node should be interpreted.
        proposed_experiments:
        - experiment_id: exp_mtlehs_prospective_injury_to_sclerosis_cohort
          name: Prospective injury-to-sclerosis longitudinal imaging cohort
          description: Follow a large prospective cohort from an initial precipitating injury (e.g., febrile
            status epilepticus) with serial quantitative hippocampal MRI and seizure surveillance, distinguishing
            subjects whose sclerosis is established at baseline from those in whom sclerosis emerges or
            progresses only after recurrent seizures.
          experiment_type:
            preferred_term: prospective longitudinal imaging cohort study
          readouts:
          - name: Hippocampal sclerosis trajectory versus seizure burden
            target: pathophysiology#Hippocampal Sclerosis
            biological_processes:
            - preferred_term: chemical synaptic transmission
              term:
                id: GO:0007268
                label: chemical synaptic transmission
              modifier: DYSREGULATED
            assays:
            - preferred_term: magnetic resonance imaging
            direction: POSITIVE
          controls:
          - name: Injury-exposed without recurrent seizures
            description: Subjects with the same initial precipitating injury who do not develop recurrent
              seizures, to isolate seizure-driven progression.
          decision_criterion: A lesion-first (cause) model is favored if sclerosis is present or predicted
            at baseline and does not progress with seizure burden; a seizure-driven (consequence) model
            is favored if sclerosis emerges or worsens in proportion to cumulative recurrent seizures.
          would_support:
          - pathophysiology#Hippocampal Sclerosis
      selected_evidence:
        snippet: Hippocampal T2 hyperintensity following febrile status epilepticus predicted hippocampal
          sclerosis and significant likelihood of mesial temporal lobe epilepsy.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1111/epi.17979
      reference_title: 'Hippocampal sclerosis and temporal lobe epilepsy following febrile status epilepticus:
        The <scp>FEBSTAT</scp> study'
      evidence_source: HUMAN_CLINICAL
      explanation: Prospective FEBSTAT imaging supports an initial-precipitating-injury (lesion-first)
        pathway in which acute hippocampal injury precedes later sclerosis and MTLE.
