              id: MONDO:0010881
              label: mesomelia-synostoses syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Heparan Sulfate 6-O-Endosulfatase Activity
        biological_scale: MOLECULAR
        description: 'SULF1 removes 6-O-sulfate groups from heparan sulfate proteoglycans at the cell
          surface, and that sulfation pattern determines how tightly heparan sulfate binds and sequesters
          the growth factors — Wnt, FGF, BMP, hedgehog — that pattern the skeleton. Losing an endosulfatase
          therefore changes growth factor availability rather than any structural protein. The expression
          data point the same way: SULF1 transcripts are highest in human osteoblasts and cartilage, while
          its co-deleted neighbour is a brain- and heart-expressed transporter of unknown function.'
        molecular_functions:
        - preferred_term: heparan sulfate 6-O-endosulfatase activity
          modifier: DECREASED
          term:
            id: GO:0008201
            label: heparin binding
        biological_processes:
        - preferred_term: glycosaminoglycan metabolic process
          modifier: DECREASED
          term:
            id: GO:0030203
            label: glycosaminoglycan metabolic process
      selected_evidence:
        snippet: SULF1 acts as a regulator of numerous growth factors in skeletal embryonic development
          whereas the function of SLCO5A1 is yet unknown.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
