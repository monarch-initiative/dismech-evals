          allele_type: interstitial 8q13 deletion of 582-738 kb
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        description: Array CGH found an interstitial 8q13 deletion in every patient. The deletions differ
          in size but converge on the same two-gene content, which is what identified the interval. Because
          no patient has been reported with a lesion in only one of the two genes, the deletion is curated
          here as the unit of causation, with the relative contributions of the two genes left open.
      selected_evidence:
        snippet: 'The deletions vary from 582 Kb to 738 Kb in size, but invariably encompass only two
          genes: SULF1, encoding the heparan sulfate 6-O-endosulfatase 1, and SLCO5A1, encoding the solute
          carrier organic anion transporter family member 5A1.'
        supports: SUPPORT
