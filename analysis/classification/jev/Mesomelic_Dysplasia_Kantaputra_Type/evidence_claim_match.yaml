        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Kantaputra-like mesomelic dysplasia without a HOXD lesion
        description: 'A Brazilian family with eight affected members over three generations has a Kantaputra-like
          phenotype — marked upper-limb shortening, lower-limb hypotrophy, clubfeet — but no synostosis,
          and neither array CNV analysis nor exome sequencing found a candidate. Males were more severely
          affected than females. This is a caution against reading "mesomelic dysplasia resembling Kantaputra"
          as "HOXD rearrangement": absence of synostosis and a negative array should prompt a search for
          another locus rather than a deeper hunt at 2q31.'
      selected_evidence:
        snippet: This family presents marked shortening of the upper limbs with hypotrophy of the lower
          limbs and clubfeet without synostosis. Array-based CNV analysis and exome sequencing of four
          family members failed to show any region or gene candidate.
        supports: SUPPORT
