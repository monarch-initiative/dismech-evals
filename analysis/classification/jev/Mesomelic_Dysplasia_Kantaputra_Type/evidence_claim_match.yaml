              label: mesomelic dysplasia, Kantaputra type
        context: []
      assertion_type: Genetic
      assertion:
        name: HOXD cluster (2q31.1-q31.2)
        gene_term:
          preferred_term: HOXD13
          term:
            id: hgnc:5136
            label: HOXD13
        relationship_type: CAUSATIVE
        notes: The causal unit here is a genomic region, not a gene. The gene_term binds HOXD13 because
          the mouse work identifies ectopic HOXD13 as the effector, but HOXD13's own coding sequence is
          intact in these patients — the pathogenic events are duplications, inversions, and translocations
          that reposition it relative to the flanking enhancer deserts. The centromeric duplication in
          the Kantaputra family also spans EVX2 and MTX2. Diagnostically this means HOXD13 sequencing
          is uninformative and copy-number or structural-variant analysis is required.
      selected_evidence:
        snippet: We propose that MDK is caused by duplications that modify the topography of the locus
          and as such result in deregulation of HOXD gene expression.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
