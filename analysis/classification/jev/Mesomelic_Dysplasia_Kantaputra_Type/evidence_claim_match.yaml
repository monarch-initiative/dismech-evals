          - preferred_term: HOXD13
            term:
              id: hgnc:5136
              label: HOXD13
          allele_type: 2q31 microduplication spanning the HOXD cluster; also translocation and inversion
            alleles
          zygosity: HETEROZYGOUS
        description: 'Array CGH in the Kantaputra family found two microduplications at 2q31.1-q31.2 of
          roughly 481 and 507 kb, separated by a segment of normal copy number, the centromeric one spanning
          the whole HOXD cluster plus EVX2 and MTX2. Crucially, the causal rearrangements at this locus
          need not disrupt any gene at all: the t(2;8) translocation that causes a similar phenotype breaks
          about 60 kb from the HOXD complex and interrupts no coding sequence. The lesion is positional.'
      selected_evidence:
        snippet: we performed array CGH and identified two microduplications on chromosome 2 (2q31.1-q31.2)
          encompassing ∼481 and 507 kb, separated by a segment of normal copy number. The more centromeric
          duplication encompasses the entire HOXD cluster, as well as the neighboring genes EVX2 and MTX2.
        supports: SUPPORT
