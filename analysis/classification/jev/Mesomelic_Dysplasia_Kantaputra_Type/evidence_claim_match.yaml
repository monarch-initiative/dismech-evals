  47c47b7c3c2a3228537200d53f62f76eb44f9996a6e418eaffbb3f47a8b7b69e:
    claim:
      about:
        disease:
          name: Mesomelic Dysplasia, Kantaputra Type
          disease_term:
            preferred_term: mesomelic dysplasia, Kantaputra type
            term:
              id: MONDO:0007977
              label: mesomelic dysplasia, Kantaputra type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reallocation of Limb Enhancer-Promoter Contacts
        biological_scale: MOLECULAR
        description: 'HOXD genes are read by enhancers in the two gene deserts flanking the cluster, one
          serving proximal and one distal limb territory, partitioned by topologically associating domain
          boundaries. Rearrangement moves genes across that partition. The consequences are not uniformly
          gain or loss: a duplication in the upstream regulatory desert has been shown to *down*-regulate
          transcription in developing digits by impairing physical contact between target genes and their
          enhancers, phenocopying deletion of those enhancers — so at this locus a duplication can produce
          a partial loss of function. In the mesomelic dysplasias the decisive event is the opposite one:
          HOXD13 is brought within reach of proximal enhancers.'
        biological_processes:
        - preferred_term: Enhancer-driven regulation of HOXD transcription
          modifier: DYSREGULATED
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: The HoxD cluster is critical for vertebrate limb development. Enhancers located in both
          the telomeric and centromeric gene deserts flanking the cluster regulate the transcription of
          HoxD genes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31591517
      reference_title: Fryns type mesomelic dysplasia of the upper limbs caused by inverted duplications
        of the HOXD gene cluster.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the two-gene-desert regulatory architecture that the rearrangements reallocate.
