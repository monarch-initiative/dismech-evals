              label: mesomelic dysplasia, Kantaputra type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ectopic Proximal Expression of HOXD13
        biological_scale: CELLULAR
        description: HOXD13 is normally a distal, digit-specifying transcription factor. When a rearrangement
          places it near proximal limb enhancers, those enhancers contact and activate it in proximal
          cells. Engineered mice carrying a 1 Mb inversion of the HoxD cluster develop mesomelic dysplasia
          by exactly this route, and — the decisive experiment — adding a HOXD13-null mutation in cis
          with the inversion completely rescues the skeletal phenotype. That rescue converts "HOXD13 is
          misexpressed" from a correlation into a demonstrated cause. The downstream damage appears to
          run through genes HOXD13 normally controls in distal cells, now switched on in the wrong territory.
        biological_processes:
        - preferred_term: anterior/posterior pattern specification in the limb
          modifier: DYSREGULATED
          term:
            id: GO:0009952
            label: anterior/posterior pattern specification
        - preferred_term: limb morphogenesis
          modifier: DYSREGULATED
          term:
            id: GO:0035108
            label: limb morphogenesis
      selected_evidence:
        snippet: Here we engineer 1 Mb inversion including the HoxD gene cluster, which positioned Hoxd13
          close to proximal limb enhancers. Using this model, we show that these enhancers contact and
          activate Hoxd13 in proximal cells, inducing the formation of mesomelic dysplasia.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
