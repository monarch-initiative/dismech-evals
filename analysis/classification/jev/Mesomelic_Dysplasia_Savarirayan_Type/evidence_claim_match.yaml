          value:
            name: ID4 (6p22.3 regulatory landscape)
            gene_term:
              preferred_term: ID4
              term:
                id: hgnc:5363
                label: ID4
            relationship_type: CAUSATIVE
            notes: The causal unit is a genomic region rather than a gene, and ID4 is named as the effector
              on positional grounds only — its coding sequence is intact and it lies outside the smallest
              deleted interval. Diagnostically this means ID4 sequencing is uninformative; copy-number
              analysis finds the deletion alleles and whole-genome sequencing can identify inversion alleles.
              The deleted interval itself contains MBOAT1, E2F3, CDKAL1 and SOX4. The proposed regulatory
              effect on ID4 is distinct from the loss of these coding genes.
          role: ancestor
      assertion_type: Variant
      assertion:
        name: 6p22.3 inversion with a breakpoint insertion
        variant_type: inversion
        regulatory_target_gene:
          preferred_term: ID4
          term:
            id: hgnc:5363
            label: ID4
        description: De novo inversion identified by whole-genome sequencing after a negative array in
          the 2026 report. The author-deposited LOVD record gives the hg38 genomic description on chromosome
          6 as g.19066060_21763046delins[CGAATTAACTGT;19066051_21763045inv]. Supplementary Figure 2 documents
          a templated insertion at the telomeric breakpoint, so this is not represented as a completely
          balanced simple inversion. ID4 is a predicted regulatory target whose coding sequence is retained.
          Genomic contexts are omitted because the accessed abstract and supplement do not establish transcript-specific
          breakpoint overlaps.
        external_assertions:
        - name: LOVD 6p22.3 inversion record 0001070241
          source: Global Variome shared LOVD
          external_id: '0001070241'
          assertion_type: author-deposited variant record
          url: https://databases.lovd.nl/shared/individuals/00474045
          description: Variant linked from individual 00474045 in the publication's data availability
            statement. The record includes hg19 and hg38 descriptions and resolves the associated inversion
            junction insertion.
        functional_effects:
        - function: Spatial regulation of ID4 expression during limb development
          type: predicted enhancer adoption
          regulatory_element_type: TAD_BOUNDARY
          affected_developmental_stage: embryonic limb development
          regulatory_mechanism: The inversion is predicted to alter TAD organization and reposition intact
            ID4 relative to telomeric limb enhancers.
          description: The proposed gain of ectopic expression is supported by genomic position and POSTRE
            prediction, not by direct measurement of ID4 RNA or protein in developing limb tissue.
      selected_evidence:
        snippet: we predict that the structural variant disrupts several topologically associated domains
          (TADs) in the region and is likely to place ID4 in closer proximity to more telomerically located
          limb enhancers, which could result in enhancer adoption and potentially lead to ID4 limb misexpression
        supports: SUPPORT
        directness: INDIRECT
