            term:
              id: MONDO:0011530
              label: mesomelic dysplasia, Savarirayan type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Enhancer Adoption by ID4 in the Limb Bud
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        regulatory_category: GOE
        gene:
          preferred_term: ID4
          term:
            id: hgnc:5363
            label: ID4
        description: Both allele classes are predicted to disrupt topologically associating domains at
          6p22.3 and place ID4 nearer to limb enhancers that normally cannot reach it. ID4 is an inhibitor-of-DNA-binding
          HLH protein — a dominant-negative regulator of bHLH transcription factors — so misexpressing
          it in the limb bud would be expected to interfere with, rather than augment, the differentiation
          programs those factors run. Both papers state this as a prediction from breakpoint position,
          not as a measured expression change.
        biological_processes:
        - preferred_term: Enhancer-driven regulation of ID4 transcription in the limb bud
          modifier: DYSREGULATED
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
        - preferred_term: limb development
          modifier: DYSREGULATED
          term:
            id: GO:0060173
            label: limb development
      selected_evidence:
        snippet: We identified a fourth patient with intellectual disability and an overlapping slightly
          larger do novo deletion also encompassing the flanking gene ID4. Given the fact that the fourth
          patient had no skeletal abnormalities and none of the genes in the deleted interval are known
          to be associated with abnormalities in skeletal development, other mutational mechanisms than
          loss of function of the deleted genes have to be considered.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26032025
      reference_title: Microdeletions on 6p22.3 are associated with mesomelic dysplasia Savarirayan type.
