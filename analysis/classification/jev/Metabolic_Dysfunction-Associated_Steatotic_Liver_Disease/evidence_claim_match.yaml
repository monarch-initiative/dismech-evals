  29f87681d7e86f54d7e45c82a2967b91eec70a49097e392743af05609befae92:
    claim:
      about:
        disease:
          name: Metabolic Dysfunction-Associated Steatotic Liver Disease
          disease_term:
            preferred_term: metabolic dysfunction-associated steatotic liver disease
            term:
              id: MONDO:0013209
              label: metabolic dysfunction-associated steatotic liver disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kgap_masld_osa_cpap_hepatic_benefit
        prompt: If chronic intermittent hypoxia is a genuine driver of MASLD progression, why does correcting
          it with CPAP not improve the liver — and is the hypoxic exposure therefore a causal driver,
          a marker of adiposity, or a driver whose damage is not reversible on trial timescales?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Obstructive Sleep Apnea-Associated Chronic Intermittent Hypoxia
        - pathophysiology#Hypoxia-Driven Hepatic Lipogenesis and Oxidative Stress
        rationale: 'The observational and mechanistic arms of this hypothesis point one way and the interventional
          arm points the other, and the disagreement is the gap. Observationally, hypoxia metrics track
          hepatic severity after adjustment for obesity in biopsy-based cohorts; mechanistically, controlled
          murine intermittent hypoxia raises hepatic SREBP-1/SCD-1 and liver triglyceride, and the triglyceride
          response is HIF-1-dependent. Yet randomized trials of CPAP monotherapy show no change in steatosis,
          fibrosis or aminotransferases, and a 2026 scoping review of 74 studies reports that what hepatic
          improvement does occur in CPAP trials tracks weight change rather than correction of sleep-disordered
          breathing. At least four readings remain open and the curated evidence does not discriminate
          between them: the association is residual confounding by adiposity that adjustment did not remove;
          CPAP adherence in the trials was too low or the follow-up too short to register a histological
          change; hypoxia contributes to establishing steatosis but not to sustaining it once the metabolic
          state exists; or the hepatic lesion is real but not reversible without concurrent weight loss.
          Until one of these is settled, CPAP must not be curated as a MASLD treatment, and the hypoxia
          arm must not be promoted out of EMERGING.'
        proposed_experiments:
        - experiment_id: exp_masld_cpap_adherence_stratified_pdff
          name: Adherence-stratified CPAP trial with MRI-PDFF and hypoxic-burden endpoints
          description: Randomize CPAP-naive patients with biopsy- or MRI-confirmed MASLD and moderate-to-severe
            OSA to CPAP versus sham, with telemonitored objective adherence, weight held as a prespecified
            covariate rather than an outcome, and MRI proton density fat fraction plus liver stiffness
            at 12 months. Test whether a hepatic effect emerges above an adherence threshold and above
            a hypoxic-burden threshold, both of which prior trials averaged below.
          experiment_type:
            preferred_term: adherence-stratified randomized sham-controlled trial
          decision_criterion: A dose-response between nightly CPAP hours (or reduction in time below 90%
            saturation) and fall in MRI-PDFF, independent of weight change, supports the hypoxia arm as
            causal and reversible; a flat response across the adherence range with weight change explaining
            the variance supports adiposity as the operative variable.
          would_support:
          - pathophysiology#Obstructive Sleep Apnea-Associated Chronic Intermittent Hypoxia
          would_refute:
          - pathophysiology#Hypoxia-Driven Hepatic Lipogenesis and Oxidative Stress
        - experiment_id: exp_masld_ih_weight_clamped_rodent
          name: Weight-clamped intermittent hypoxia exposure in diet-induced steatohepatitis
          description: Expose mice with established diet-induced steatohepatitis to intermittent hypoxia
            versus normoxia under pair-feeding so body weight and adiposity are matched between arms,
            then measure hepatic SREBP-1/SCD-1, 4-hydroxynonenal adducts, NAFLD activity score and fibrosis
            stage, with a hepatocyte-specific Hif1a deletion arm. This separates the hypoxic signal from
            the adiposity it is confounded with in every human cohort, and tests whether the effect exists
            on an already-steatotic background rather than only in the lean state where it was first shown.
          experiment_type:
            preferred_term: pair-fed intermittent-hypoxia exposure with conditional knockout
          decision_criterion: Higher activity score or fibrosis stage in the hypoxia arm at matched body
            weight, abolished by hepatocyte Hif1a deletion, establishes a weight-independent hepatic effect
            of intermittent hypoxia; no difference at matched weight argues the human association is adiposity-mediated.
          would_support:
          - pathophysiology#Hypoxia-Driven Hepatic Lipogenesis and Oxidative Stress
      selected_evidence:
        snippet: After CPAP treatment, no changes in liver steatosis, liver fibrosis, and aminotransferase
          levels (alanine aminotransferase and aspartate aminotransferase) were found.
        supports: SUPPORT
