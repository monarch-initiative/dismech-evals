            interpretation: On-target confirmation. If uptake does not fall, the human hepatocyte does
              not depend on these transporters in the way the mouse liver does, and that is itself the
              answer.
          - name: Hepatocyte lipid content at fixed adipose fatty acid supply
            target: pathophysiology#Hepatocyte Lipid Overload
            direction: DECREASED
            biological_processes:
            - preferred_term: lipid storage
              term:
                id: GO:0019915
                label: lipid storage
            interpretation: The discriminating measurement. Because substrate delivery is held constant
              by the chip, a fall here isolates the contribution of the transport step in a way the murine
              caloric-uptake confound prevents.
          controls:
          - name: Non-targeting knockdown construct
            description: Scrambled or non-targeting construct delivered to the hepatocyte compartment
              on the same schedule, controlling for the delivery vehicle and the knockdown procedure rather
              than for the transporters.
          - name: Uninflamed (M0 macrophage) chip
            description: The same chip with non-activated macrophages, in which hepatocyte fatty acid
              uptake is not elevated. Sets the floor against which a knockdown effect in the inflamed
              arm is measured.
          - name: Knockdown before versus after adipose inflammation
            description: Two timing arms, so prevention of hepatocyte lipid accumulation is separated
              from reversal of accumulation that has already occurred — the distinction that made the
              murine FATP5 knockdown result stronger than a prevention-only design.
          decision_criterion: A fall in hepatocyte lipid content on transporter knockdown, at unchanged
            adipose fatty acid release and unchanged media fatty acid concentration, supports the uptake
            step as rate-limiting in human hepatocytes and would move the hypothesis toward canonical.
            Confirmed on-target knockdown with no change in hepatocyte lipid content refutes the rate-limiting
            claim for human cells and reassigns the murine result to a whole-animal energy-balance effect.
          would_support:
          - pathophysiology#Transporter-Mediated Hepatic Fatty Acid Uptake
          - mechanistic_hypotheses#hepatic_fatty_acid_uptake_masld
          would_refute:
          - mechanistic_hypotheses#hepatic_fatty_acid_uptake_masld
          supporting_outcome:
          - Hepatocyte fatty acid uptake and lipid content both fall on knockdown while adipose fatty
            acid release and circulating fatty acid levels are unchanged, with the combined SLC27A5/SLC27A2
            knockdown exceeding either alone.
          - The fall in hepatocyte lipid content is present in the arm where knockdown follows established
            inflammation, showing reversal rather than prevention only.
          refuting_outcome:
          - Transporter transcript and protein fall as intended but hepatocyte fatty acid uptake and lipid
            content are unchanged, indicating that human hepatocyte fatty acid entry in this system is
            not gated by these transporters.
          - Hepatocyte lipid content falls only alongside a fall in circulating fatty acid availability
            in the chip, which would place the effect on supply rather than on the hepatocyte transport
            step.
      selected_evidence:
        snippet: Whether WAT expansion or its inflammation is the main trigger in WAT-driven MASLD and
          hepatic insulin resistance (HIR) has been difficult to address in animal models because lipid
          accumulation and lipotoxic events often go hand in hand with inflammation of WAT and liver
        supports: SUPPORT
