      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: osa_intermittent_hypoxia_masld
        hypothesis_label: Obstructive sleep apnea-associated chronic intermittent hypoxia as a progression
          driver
        status: EMERGING
        description: 'Chronic intermittent hypoxia (CIH) — the cyclical desaturation-reoxygenation of
          obstructive sleep apnea — is proposed to act on the liver as a second hit that is separable
          from adiposity, upregulating SREBP-1/SCD-1-dependent hepatic lipogenesis and generating hepatic
          lipid peroxidation, and thereby accelerating the transition from steatosis to steatohepatitis
          and fibrosis. This is deliberately modeled as a parallel arm of the pathograph rather than a
          replacement for the canonical lipotoxic backbone, and as EMERGING rather than CANONICAL, for
          three reasons that the curated evidence states directly. (1) The human data are observational,
          and they do not agree with each other endpoint by endpoint: the largest individual-participant
          meta-analysis attributes the fibrosis association mainly to body mass index by causal mediation
          analysis while finding apnea severity an independent risk factor for steatosis, whereas the
          one cohort scored on liver biopsy inverts that pattern, finding an obesity-adjusted fibrosis
          association but no association with steatosis or steatohepatitis. Each edge therefore carries
          both the supporting and the refuting human result. (2) The causal, dose-controlled experiments
          — including the HIF-1 dependence of the triglyceride response — are five-day murine intermittent-hypoxia
          exposures in lean mice, a model that produced no additional effect in already-obese mice. (3)
          Correcting the exposure does not correct the liver: randomized trials of CPAP monotherapy show
          no change in steatosis, fibrosis or aminotransferases. A curator extending this arm should preserve
          that asymmetry rather than resolving it, and should not curate CPAP as a MASLD therapy.'
      selected_evidence:
        snippet: This meta-analysis confirms the strong association between steatosis and the severity
          of OSA. The relation between OSA and fibrosis is mainly due to BMI as shown by causal mediation
          analysis.
        supports: SUPPORT
    origin:
