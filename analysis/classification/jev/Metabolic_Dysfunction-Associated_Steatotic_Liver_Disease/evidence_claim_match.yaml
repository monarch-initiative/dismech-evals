        description: A second, independent genetic route to the same transport step, which is what distinguishes
          a transporter-specific result from a general hepatic lipid-handling effect.
        limitations: FATP2 is bifunctional — a minor peroxisomal pool contributes roughly half of peroxisomal
          very-long-chain acyl-CoA synthetase activity — so knockdown is not a clean transport-only perturbation,
          even though total hepatic synthetase activity was unchanged. Murine, and the effect size on
          uptake is partial.
        readouts:
        - name: Hepatic long-chain fatty acid uptake after FATP2 loss
          target: Transporter-Mediated Hepatic Fatty Acid Uptake
          direction: DECREASED
          biological_processes:
          - preferred_term: long-chain fatty acid import into hepatocytes
            term:
              id: GO:0044539
              label: long-chain fatty acid import into cell
          interpretation: A partial (40%) reduction, consistent with several transporters sharing the
            step rather than one accounting for all of it.
      selected_evidence:
        snippet: This suggests FATP2 as a potential target for a therapeutic intervention of hepatosteatosis.
        supports: SUPPORT
