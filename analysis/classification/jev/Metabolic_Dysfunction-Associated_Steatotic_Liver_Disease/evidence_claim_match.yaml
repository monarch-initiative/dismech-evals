      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: sinusoidal_endothelial_dysfunction_masld
        hypothesis_label: Liver sinusoidal endothelial dysfunction as an early driver
        status: EMERGING
        description: 'An endothelium-first model in which loss of the liver sinusoidal endothelial cell
          (LSEC) phenotype — capillarization (loss of fenestrae) and loss of shear-responsive vasodilator
          production — occurs early, before overt steatohepatitis, and then licenses inflammatory-cell
          recruitment and hepatic stellate cell activation rather than merely following hepatocyte injury.
          This is deliberately modeled as a parallel arm of the pathograph, not a replacement for the
          canonical lipotoxic backbone: the human data are cross-sectional histology, and the causal experiments
          are endothelium-specific mouse models. The same endothelial lesion has been proposed as the
          axis shared with atherosclerosis, where vascular endothelial dysfunction initiates lipoprotein
          retention and leukocyte recruitment; whether dismech should represent that shared axis as a
          cross-disease module or a comorbidity entry is an open scope question (issue #6352), so no cross-disease
          structure is asserted here.'
      selected_evidence:
        snippet: Capillarization, namely the loss of LSEC fenestrae, and LSEC dysfunction, namely the
          loss of the ability of LSECs to generate vasodilator agents in response to increased shear stress
          both occur early in NAFLD.
        supports: SUPPORT
