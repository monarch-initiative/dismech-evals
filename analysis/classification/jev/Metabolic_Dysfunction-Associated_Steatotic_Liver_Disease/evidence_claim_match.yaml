  270d9c83dc87ee4242f8bbb62aef2886f42bc101293ccec8af10bd6602e21a9f:
    claim:
      about:
        disease:
          name: Metabolic Dysfunction-Associated Steatotic Liver Disease
          disease_term:
            preferred_term: metabolic dysfunction-associated steatotic liver disease
            term:
              id: MONDO:0013209
              label: metabolic dysfunction-associated steatotic liver disease
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: hepatic_fatty_acid_uptake_masld
        hypothesis_label: Transporter-mediated hepatic fatty acid uptake as a rate-limiting, druggable
          step
        status: EMERGING
        description: 'The canonical model treats the hepatocyte as a passive sink for the non-esterified
          fatty acid load that adipose insulin resistance releases. This hypothesis holds instead that
          entry into the hepatocyte is itself protein-mediated and rate-limiting, so that the fatty acid
          transport proteins on the basolateral hepatocyte membrane — FATP5 (SLC27A5), which is expressed
          exclusively by liver, and FATP2 (SLC27A2) — set how much of that load actually reaches the hepatic
          lipid pool, and blocking them reverses steatosis that is already established. The strong form
          of the claim is therapeutic: hepatic fatty acid uptake is a target in its own right, upstream
          of and separable from the lipogenic and oxidative arms the approved agents act on. It is modeled
          as EMERGING, not canonical, for two reasons the curated evidence states directly. First, every
          causal experiment is murine knockdown or knockout; no FATP-directed agent has been tested in
          human MASLD, and no human genetic evidence linking SLC27A5 or SLC27A2 variation to MASLD is
          curated here. Second, hepatic FATP5 knockdown also reduced whole-animal caloric uptake, so the
          reported protection is not cleanly attributable to the hepatic uptake step alone — a confound
          the source paper reports rather than one imputed to it. A curator strengthening this arm should
          look for the human evidence that is missing, not for more rodent replication.'
      selected_evidence:
        snippet: resulting in a marked reduction of hepatic dietary fatty acid uptake, reduced caloric
          uptake, and concomitant protection from diet-induced non-alcoholic fatty liver disease.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/4
      evidence_path: /mechanistic_hypotheses/4/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18524776
      reference_title: Silencing of hepatic fatty acid transporter protein 5 in vivo reverses diet-induced
        non-alcoholic fatty liver disease and improves hyperglycemia.
      evidence_source: MODEL_ORGANISM
      explanation: 'Retained deliberately as the bounding quote: the same sentence that reports protection
        also reports reduced caloric uptake, so the hepatic effect is confounded with a whole-animal energy-intake
        effect. Graded INDIRECT because the protection follows from the uptake block only through that
        unresolved intermediate.'
