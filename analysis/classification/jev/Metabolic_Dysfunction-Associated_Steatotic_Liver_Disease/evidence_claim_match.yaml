      assertion_type: Pathophysiology
      assertion:
        name: Hypoxia-Driven Hepatic Lipogenesis and Oxidative Stress
        biological_scale: CELLULAR
        role: amplifier
        description: Intermittent hypoxia raises hepatic SREBP-1 and its target stearoyl-CoA desaturase
          1, increasing triglyceride and phospholipid biosynthesis, and the reoxygenation half of each
          cycle generates reactive oxygen species so that the hepatocyte experiences a repeated ischemia-reperfusion-like
          insult. The lipogenic limb is HIF-1-dependent in mice; the oxidative limb is the one measured
          directly in human liver, as in-situ 4-hydroxynonenal staining and urinary F2-isoprostanes that
          scale with the nocturnal hypoxia metrics. The node therefore feeds both the lipid-overload state
          and the injury state of the canonical backbone rather than substituting for either.
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: cellular response to hypoxia
          term:
            id: GO:0071456
            label: cellular response to hypoxia
          modifier: INCREASED
        - preferred_term: triglyceride biosynthetic process
          term:
            id: GO:0019432
            label: triglyceride biosynthetic process
          modifier: INCREASED
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
      selected_evidence:
        snippet: These data support the role of nocturnal hypoxia as a trigger for localized hepatic oxidative
          stress, an important factor associated with the progression of NASH and hepatic fibrosis in
          obese pediatric patients.
        supports: SUPPORT
    origin:
