  ec5fb26fcd97aff5fb5783c344f59795113ddbd1e7ba0234c306be77d5d2238d:
    claim:
      about:
        disease:
          name: Metabolic Dysfunction-Associated Steatotic Liver Disease
          disease_term:
            preferred_term: metabolic dysfunction-associated steatotic liver disease
            term:
              id: MONDO:0013209
              label: metabolic dysfunction-associated steatotic liver disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hmm_masld_hepatic_fatp_uptake_human_translation
        prompt: Is transporter-mediated hepatic fatty acid uptake rate-limiting in human MASLD, or is
          the reversal of steatosis on FATP5/FATP2 knockdown a property of the diet-induced mouse — and
          why has the one human system that can measure hepatic fatty acid uptake never been used to perturb
          the transporters?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Transporter-Mediated Hepatic Fatty Acid Uptake
        - mechanistic_hypotheses#hepatic_fatty_acid_uptake_masld
        rationale: 'This is a model-fidelity question rather than an absence of evidence, which is why
          it is curated as HUMAN_MODEL_MISMATCH and not as a knowledge gap. The rodent evidence is strong
          and internally replicated: hepatocyte long-chain fatty acid entry is protein-mediated, silencing
          FATP5 reverses established diet-induced fatty liver and improves glucose homeostasis, and liver-specific
          FATP2 knockdown reproduces the steatosis result through a different gene while high-fat feeding
          continues. What is missing is not another mouse. Three things bound the translation. First,
          the FATP5 knockdown reduced whole-animal caloric uptake as well as hepatic fatty acid uptake,
          so the published protection is not cleanly attributable to the hepatic step — the confound is
          in the source paper''s own summary sentence. Second, no human genetic evidence links SLC27A5
          or SLC27A2 variation to MASLD in this entry, in contrast to the PNPLA3, TM6SF2, GCKR, MBOAT7
          and HSD17B13 signals that anchor the other hepatocyte-intrinsic arms, and no FATP-directed agent
          has entered human testing. Third — and this is what makes the mismatch actionable rather than
          merely noted — the human iPSC adipose-liver microphysiological system curated in this entry
          already measures hepatocyte fatty acid uptake as a primary endpoint and already shows that uptake
          rises when the connected adipose compartment is inflamed. It has the readout. It has never been
          reported with the transporters knocked down, so the human system that could adjudicate the hypothesis
          has been used to observe the flux and not to test what gates it. A curator should not resolve
          this by promoting the uptake hypothesis on the strength of additional rodent replication, and
          should not retire it on the absence of human data: the discriminating experiment has not been
          done.'
        proposed_experiments:
        - experiment_id: exp_masld_fatp_knockdown_in_human_adipose_liver_mps
          name: FATP5 and FATP2 knockdown in the human iPSC adipose-liver microphysiological system under
            adipose inflammation
          description: 'Take the isogenic iPSC adipose-liver chip in its inflamed configuration, in which
            hepatocyte fatty acid uptake and lipid accumulation are already elevated, and silence SLC27A5
            and SLC27A2 in the hepatocyte compartment singly and together, with a non-targeting control.
            Measure hepatocyte fatty acid uptake and lipid content as the primary endpoints, and hepatic
            glucose production under insulin as the secondary endpoint. The design is what the whole-animal
            experiments cannot supply: the adipose fatty acid supply is fixed by the chip rather than
            varying with the animal''s feeding behaviour, so a fall in hepatocyte lipid can be attributed
            to the transport step and not to reduced caloric intake. Running the knockdown after inflammation
            is established tests reversal rather than prevention, matching the design of the murine knockdown.'
          experiment_type:
            preferred_term: transporter knockdown in a human multi-tissue microphysiological system
          perturbations:
          - name: Hepatocyte-compartment SLC27A5 and SLC27A2 silencing
            target: pathophysiology#Transporter-Mediated Hepatic Fatty Acid Uptake
            description: RNA-interference or CRISPR-interference knockdown of each transporter alone and
              in combination in the iPSC-derived hepatocyte compartment only, leaving the adipocyte and
              macrophage compartments unmodified.
            genes:
            - preferred_term: SLC27A5
              term:
                id: hgnc:10999
                label: SLC27A5
            - preferred_term: SLC27A2
              term:
                id: hgnc:10996
                label: SLC27A2
          readouts:
          - name: Hepatocyte fatty acid uptake after transporter knockdown
            target: pathophysiology#Transporter-Mediated Hepatic Fatty Acid Uptake
            direction: DECREASED
            biological_processes:
            - preferred_term: long-chain fatty acid import into hepatocytes
              term:
                id: GO:0044539
                label: long-chain fatty acid import into cell
            interpretation: On-target confirmation. If uptake does not fall, the human hepatocyte does
              not depend on these transporters in the way the mouse liver does, and that is itself the
              answer.
          - name: Hepatocyte lipid content at fixed adipose fatty acid supply
            target: pathophysiology#Hepatocyte Lipid Overload
            direction: DECREASED
            biological_processes:
            - preferred_term: lipid storage
              term:
                id: GO:0019915
                label: lipid storage
            interpretation: The discriminating measurement. Because substrate delivery is held constant
              by the chip, a fall here isolates the contribution of the transport step in a way the murine
              caloric-uptake confound prevents.
          controls:
          - name: Non-targeting knockdown construct
            description: Scrambled or non-targeting construct delivered to the hepatocyte compartment
              on the same schedule, controlling for the delivery vehicle and the knockdown procedure rather
              than for the transporters.
          - name: Uninflamed (M0 macrophage) chip
            description: The same chip with non-activated macrophages, in which hepatocyte fatty acid
              uptake is not elevated. Sets the floor against which a knockdown effect in the inflamed
              arm is measured.
          - name: Knockdown before versus after adipose inflammation
            description: Two timing arms, so prevention of hepatocyte lipid accumulation is separated
              from reversal of accumulation that has already occurred — the distinction that made the
              murine FATP5 knockdown result stronger than a prevention-only design.
          decision_criterion: A fall in hepatocyte lipid content on transporter knockdown, at unchanged
            adipose fatty acid release and unchanged media fatty acid concentration, supports the uptake
            step as rate-limiting in human hepatocytes and would move the hypothesis toward canonical.
            Confirmed on-target knockdown with no change in hepatocyte lipid content refutes the rate-limiting
            claim for human cells and reassigns the murine result to a whole-animal energy-balance effect.
          would_support:
          - pathophysiology#Transporter-Mediated Hepatic Fatty Acid Uptake
          - mechanistic_hypotheses#hepatic_fatty_acid_uptake_masld
          would_refute:
          - mechanistic_hypotheses#hepatic_fatty_acid_uptake_masld
          supporting_outcome:
          - Hepatocyte fatty acid uptake and lipid content both fall on knockdown while adipose fatty
            acid release and circulating fatty acid levels are unchanged, with the combined SLC27A5/SLC27A2
            knockdown exceeding either alone.
          - The fall in hepatocyte lipid content is present in the arm where knockdown follows established
            inflammation, showing reversal rather than prevention only.
          refuting_outcome:
          - Transporter transcript and protein fall as intended but hepatocyte fatty acid uptake and lipid
            content are unchanged, indicating that human hepatocyte fatty acid entry in this system is
            not gated by these transporters.
          - Hepatocyte lipid content falls only alongside a fall in circulating fatty acid availability
            in the chip, which would place the effect on supply rather than on the hepatocyte transport
            step.
      selected_evidence:
        snippet: Consequently, the iHEP-MPS showed increased fatty acid uptake and lipid accumulation
          under inflamed iADIPO-MPS conditions
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39266553
      reference_title: Adipocyte inflammation is the primary driver of hepatic insulin resistance in a
        human iPSC-based microphysiological system.
      evidence_source: IN_VITRO
      explanation: Establishes that the human non-animal system has the hepatocyte fatty acid uptake readout
        this question needs, which is what makes the missing transporter perturbation a specific and reachable
        experiment rather than an open-ended wish for human data.
