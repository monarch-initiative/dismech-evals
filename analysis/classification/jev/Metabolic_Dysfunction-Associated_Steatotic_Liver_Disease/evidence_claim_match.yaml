        description: 'The same cardiometabolic state that drives hepatocyte lipid loading also acts on
          the sinusoidal endothelium: insulin resistance and dyslipidaemia exacerbate endothelial activation
          and lipid handling across vascular and hepatic beds. This edge is what makes the endothelial
          arm a branch of the shared cardiometabolic trigger rather than a second, unexplained initiating
          step.'
