      assertion:
        target: Hepatocyte Lipid Overload
        description: 'SREBP-1/SCD-1 upregulation adds a hypoxia-driven de novo lipogenesis inflow on top
          of the adipose-derived and dietary inflows of the canonical model. As on the fibrosis edge,
          the human results are curated in disagreement rather than chosen between, but the disagreement
