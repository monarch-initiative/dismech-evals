      assertion_type: Pathophysiology
      assertion:
        name: Transporter-Mediated Hepatic Fatty Acid Uptake
        biological_scale: MOLECULAR
        role: amplifier
        description: 'Long-chain fatty acids delivered to the liver do not enter hepatocytes by passive
          diffusion alone. Uptake is largely protein-mediated, through fatty acid transport proteins at
          the basal plasma membrane of the hepatocyte. FATP5 (SLC27A5) is expressed exclusively by liver
          and localizes to that membrane; FATP2 (SLC27A2) accounts for a further large share of hepatic
          long-chain fatty acid uptake while also serving as a peroxisomal very-long-chain acyl-CoA synthetase.
          This node is deliberately kept separate from Hepatocyte Lipid Overload because it is the step
          at which the circulating non-esterified fatty acid load is gated, and because it is where the
          two rodent interventions that reverse established steatosis act. What is increased in the high-fat
          state is the flux through this step rather than, on the curated evidence, transporter expression:
          the murine experiments show that continued transporter activity is required to sustain fatty
          acid entry, not that the transporters are upregulated by disease. The node carries the emerging
          hepatic-uptake hypothesis and is not asserted as a required step in human disease.'
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        genes:
        - preferred_term: SLC27A5
          term:
            id: hgnc:10999
            label: SLC27A5
        - preferred_term: SLC27A2
          term:
            id: hgnc:10996
            label: SLC27A2
        biological_processes:
        - preferred_term: long-chain fatty acid import into hepatocytes
          term:
            id: GO:0044539
            label: long-chain fatty acid import into cell
          modifier: INCREASED
        molecular_functions:
        - preferred_term: FATP5/FATP2 long-chain fatty acid transport activity
          term:
            id: GO:0005324
            label: long-chain fatty acid transmembrane transporter activity
        locations:
        - preferred_term: liver
          term:
            id: UBERON:0002107
            label: liver
      selected_evidence:
        snippet: FATP5 is exclusively expressed by the liver and localized to the basal plasma membrane
          of hepatocytes, congruent with a role in LCFA uptake from the circulation.
        supports: SUPPORT
