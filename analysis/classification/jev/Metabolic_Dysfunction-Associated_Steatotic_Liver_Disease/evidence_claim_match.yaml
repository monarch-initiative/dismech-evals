              risk factor (overweight/obesity, dysglycaemia or type 2 diabetes, hypertension, hypertriglyceridaemia,
              or low HDL cholesterol). Adipose-tissue insulin resistance fails to restrain lipolysis,
              so non-esterified fatty acids flood the portal circulation, while hyperinsulinaemia and
              carbohydrate surplus drive hepatic de novo lipogenesis. This cardiometabolic state is the
              initiating context that distinguishes MASLD from other steatotic liver diseases.
