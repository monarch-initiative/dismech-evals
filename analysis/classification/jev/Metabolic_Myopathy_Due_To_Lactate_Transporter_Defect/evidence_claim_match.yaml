        context: []
      assertion_type: Genetic
      assertion:
        name: SLC16A1
        gene_term:
          preferred_term: SLC16A1
          term:
            id: hgnc:10922
            label: SLC16A1
        relationship_type: CAUSATIVE
        notes: 'relationship_type is CAUSATIVE because OMIM (245340) and Orphanet (ORPHA:171690) still
          list SLC16A1 as the disease-causing gene for this disorder; that is a stronger reading than
          the evidence alone supports. Gene-disease validity is Limited (GenCC). The two historically
          reported heterozygous missense variants (p.Lys204Glu, p.Gly472Arg) are of disputed pathogenicity:
          later heterologous assays did not reproduce reduced lactate uptake and p.Gly472Arg carries benign/VUS
          ClinVar submissions and appreciable population frequency. The reproducible finding is the subnormal
          erythrocyte/muscle lactate-transport phenotype; specific causal variants should be interpreted
          with current ACMG evidence rather than inherited from the historical OMIM labels. Two distinct
          allelic SLC16A1 disorders are out of scope here: MCT1 deficiency with recurrent ketoacidosis
          (biallelic loss-of-function, OMIM:616095) and autosomal dominant exercise-induced hyperinsulinism
          (promoter gain-of-expression, OMIM:610021).'
      selected_evidence:
        snippet: All 3 patients were heterozygotes.
        supports: SUPPORT
