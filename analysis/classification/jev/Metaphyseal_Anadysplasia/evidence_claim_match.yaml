      assertion_type: Pathophysiology
      assertion:
        name: Dominant MMP13 Prodomain Autoactivation
        biological_scale: MOLECULAR
        description: Missense variants in the MMP13 prodomain destabilise the cysteine switch that holds
          the zymogen inactive, so the enzyme autoactivates before secretion. The prematurely active protease
          degrades itself and, because MMP9 traffics with it, degrades MMP9 as well. A single mutant allele
          therefore removes both enzymes rather than half of one, which is why the dominant form is more
          severe than the recessive single-gene forms.
        genes:
        - preferred_term: MMP13
          term:
            id: hgnc:7159
            label: MMP13
        molecular_functions:
        - preferred_term: metalloendopeptidase activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0004222
            label: metalloendopeptidase activity
      selected_evidence:
        snippet: dominant MAD is associated with missense mutations in the prodomain of MMP13 that determine
          autoactivation of MMP13 and intracellular degradation of both MMP13 and MMP9, resulting in a
          double enzymatic deficiency
        supports: SUPPORT
    origin:
