          disease_term:
            preferred_term: metaphyseal anadysplasia
            term:
              id: MONDO:0015177
              label: metaphyseal anadysplasia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mad_mechanism_of_regression
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does a constitutive, lifelong deficiency of MMP9 and MMP13 produce a growth-plate
          lesion that resolves during childhood while the genetic defect persists unchanged?
        attaches_to:
        - pathophysiology#Distorted Metaphyseal Growth Plate
        - pathophysiology#Regressive Metaphyseal Irregularity and Limb Bowing
        - progression#Spontaneous regression
        rationale: 'Spontaneous regression is the defining feature of this disease and the reason it was
          named, yet no mechanism has been offered for it. The germline lesion does not change, so regression
          must reflect either a developmental shift in how much metaphyseal remodelling depends on these
          two proteases, or compensation by other matrix metalloproteinases as the growth rate falls.
          Neither has been tested. The question also matters practically: the same proteases are drug
          targets in osteoarthritis, and an endogenous compensatory route would be worth identifying.'
      selected_evidence:
        snippet: Metaphyseal anadysplasia is a very rare hereditary skeletal dysplasia with onset occurring
          normally during the second and third years of life, but unlike many other dysplasias, symptoms
          appear to resolve by adolescence.
        supports: SUPPORT
