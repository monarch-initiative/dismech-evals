              label: metaphyseal chondrodysplasia, Jansen type
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Schmid metaphyseal chondrodysplasia
        description: 'The differential that actually arises at the bedside, where Blomstrand does not.
          Schmid is far commoner than JMC and shares the metaphyseal flaring and irregularity, so the
          radiographs alone do not separate them. What separates them is the biochemistry this entry stakes
          JMC''s identity on: in Schmid and the other metaphyseal chondrodysplasias calcium and phosphorus
          metabolism is normal, whereas JMC is defined by PTH-independent hypercalcaemia with suppressed
          endogenous PTH. The radiographic picture is also mistaken for rickets, which is the error the
          cited case report documents.'
      selected_evidence:
        snippet: Other types are Schmid, Spahr, McKusick, Schwachman and Jansen, which can be separated
          by clinical, radiographic, genetic and biochemical criteria.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
