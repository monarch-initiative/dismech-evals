            description: The best available model, and the one that resolved the field's problem. Expressing
              the milder T410R allele from the endogenous locus gives mice with near-normal longevity
              and fertility - unlike the H223R humanized line, which dies early without breeding - while
              still showing misshapen long bones, expanded metaphyses, disarrayed chondrocyte zones, reduced
              primary spongiosa, elevated serum calcium and suppressed PTH. It reproduces both arms of
              the human disease in one animal, which no earlier model did.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: SIK2/SIK3 Inhibition and Class IIa HDAC De-repression
        relationship: RECAPITULATES
        fidelity: HIGH
        description: 'This model supplies the decisive in vivo test of the SIK-HDAC route: genetic ablation
          of Hdac4 rescues the growth plate abnormalities, which is an epistasis result rather than a
          correlation.'
        limitations: T410R is the mildest of the five human alleles, so quantitative severity does not
          transfer to H223R patients. The rescue is genetic ablation from conception, not a post-hoc intervention.
        readouts:
        - name: Growth plate morphology after Hdac4 ablation
          target: SIK2/SIK3 Inhibition and Class IIa HDAC De-repression
          direction: RESTORED
          interpretation: Removing the downstream HDAC restores the growth plate, placing the SIK-HDAC
            axis on the causal path rather than beside it.
      selected_evidence:
        snippet: Mutant mice show near-normal longevity and reproductive capacity yet exhibit a profound
          skeletal phenotype characteristic of the disease.
