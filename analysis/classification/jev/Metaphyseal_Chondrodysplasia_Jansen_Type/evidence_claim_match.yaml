            publication: PMID:11713230
            description: 'Growth-plate-targeted expression of the constitutively active Jansen receptor
              delays chondrocyte differentiation, and it rescues the early lethality of PTHrP-null mice
              by preventing their accelerated chondrocyte differentiation. In PTH/PTHrP receptor-null
              mice the same transgene restored most bone abnormalities but did *not* prevent perinatal
              lethality, which the authors read as evidence that something besides the abnormal rib cage
              kills those animals. The informative part for JMC is the first result: a ligand-independent
              receptor substitutes for the ligand-dependent one in the growth plate and produces delay,
              which is what the human allele does.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Delayed Growth Plate Chondrocyte Hypertrophy
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Expressing the human JMC allele in growth-plate chondrocytes reproduces the delayed-hypertrophy
          phenotype and rescues receptor-null mice.
        limitations: This is a transgenic overexpression model on a receptor-null background rather than
          a knock-in of the human heterozygous state, so expression level and cellular context differ
          from patients. It also addresses only the growth-plate arm; the mineral-ion and renal phenotypes
          are not what this model was built to test.
      selected_evidence:
        snippet: Expression of the Jansen transgene under the control of the type alpha1(II) collagen
          promoter was, furthermore, shown to delay chondrocyte differentiation and to prevent the dramatic
          acceleration of chondrocyte differentiation in PTHrP(-/-) mice, thus rescuing the early lethality
          of these animals.
        supports: SUPPORT
