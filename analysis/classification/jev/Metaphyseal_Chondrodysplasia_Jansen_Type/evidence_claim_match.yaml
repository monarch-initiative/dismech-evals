        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: allele_specific_constitutive_activity_sets_severity
        kind: KNOWLEDGE_GAP
        prompt: Does the intrinsic constitutive activity of each PTH1R allele quantitatively predict clinical
          severity, and if so can it be used prospectively?
        attaches_to:
        - pathophysiology#Constitutively Active PTH1R
        rationale: 'The ingredients for a dose-response account are present and the account has not been
          made. Five mutants show varying degrees of constitutive cAMP signalling in reporter cells; separately,
          adult height was below the third centile in every patient except the T410R carriers. Those two
          observations are consistent with severity tracking basal activity, but they have not been fitted
          against each other, and with 24 patients across five alleles — 18 of them a single allele —
          the series cannot support it. Two things would need separating: whether basal activity predicts
          severity at all, and whether it predicts the skeletal and renal arms to the same degree, which
          is not obvious given that they act through different tissues. Until that is done, genotype cannot
          be used prospectively to counsel a newly diagnosed infant.'
      selected_evidence:
        snippet: Adult heights were well below the 3rd percentile for all patients, except for those with
          the T410R mutation.
        supports: SUPPORT
