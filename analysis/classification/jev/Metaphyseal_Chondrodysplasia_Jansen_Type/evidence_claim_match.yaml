              label: metaphyseal chondrodysplasia, Jansen type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: inverse_agonist_translation
        kind: KNOWLEDGE_GAP
        prompt: PTH1R inverse agonists suppress basal signalling of every JMC mutant in vitro. What would
          a clinical trial in an ultra-rare disease with an age-dependent biochemical endpoint and an
          irreversible skeletal one actually measure?
        attaches_to:
        - pathophysiology#Ligand-Independent Gs-alpha and cAMP Signaling
        rationale: 'This is the one mechanism-directed strategy for JMC and the pharmacology is encouraging:
          the inverse agonist reduced basal cAMP signalling for each of the five mutant receptors, so
          it acts on the lesion rather than a consequence. The difficulty is on the trial side, and it
          is structural rather than pharmacological. Serum calcium, the obvious biomarker, is normal in
          most infants and normalises in adults, so it is only informative in a window; urinary calcium/creatinine
          is elevated in both children and adults and is the better candidate. Adult height is a decisive
          endpoint but takes two decades and is unavailable to anyone diagnosed late. And nephrocalcinosis,
          the complication that accumulates, is what a trial would most want to prevent and is the slowest
          to read out. An endpoint strategy is a prerequisite here, not an afterthought.'
      selected_evidence:
        snippet: reduced basal cAMP signaling for each PTHR1 mutant
        supports: SUPPORT
    origin:
