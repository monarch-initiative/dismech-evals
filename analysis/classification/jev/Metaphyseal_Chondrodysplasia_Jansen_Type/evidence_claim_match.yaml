      assertion_type: DifferentialDiagnosis
      assertion:
        name: Blomstrand lethal chondrodysplasia
        description: 'The mirror image at the same locus, and the most illuminating contrast in the disease''s
          biology. Blomstrand is caused by homozygous or compound heterozygous PTH1R variants producing
          less-active or inactive receptors, and the growth plate phenotype runs the other way: accelerated
          chondrocyte differentiation and premature ossification, where JMC delays both. The two diseases
          bracket the receptor''s dose-response and are not clinically confusable - Blomstrand is lethal
          in the perinatal period.'
      selected_evidence:
        snippet: Heterozygous PTH1R mutations that lead to constitutively activity were identified in
          Jansen metaphyseal chondrodysplasia, and homozygous or compound heterozygous mutations that
          lead to less-active or completely inactive receptors were identified in patients with Blomstrand
          lethal chondrodysplasia.
        supports: SUPPORT
