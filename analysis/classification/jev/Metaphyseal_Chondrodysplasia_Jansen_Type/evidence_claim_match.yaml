      assertion:
        target: Delayed Growth Plate Chondrocyte Hypertrophy
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Expressing the human JMC allele in growth-plate chondrocytes reproduces the delayed-hypertrophy
          phenotype and rescues receptor-null mice.
        limitations: This is a transgenic overexpression model on a receptor-null background rather than
          a knock-in of the human heterozygous state, so expression level and cellular context differ
          from patients. It also addresses only the growth-plate arm; the mineral-ion and renal phenotypes
          are not what this model was built to test.
