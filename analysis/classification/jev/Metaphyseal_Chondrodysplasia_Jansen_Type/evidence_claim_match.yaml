  f5f198b19c5a1e826f44f5646f1b6926c704b186644926fd7e3f690ea2cc7d50:
    claim:
      about:
        disease:
          name: Metaphyseal Chondrodysplasia, Jansen Type
          disease_term:
            preferred_term: metaphyseal chondrodysplasia, Jansen type
            term:
              id: MONDO:0007982
              label: metaphyseal chondrodysplasia, Jansen type
        context: []
      assertion_type: Genetic
      assertion:
        name: PTH1R
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: PTH1R
          term:
            id: hgnc:9608
            label: PTH1R
        notes: 'Five heterozygous activating missense variants at three residues account for reported
          JMC: H223R, T410P, T410R, I458R and I458K. H223R dominates numerically (18 of 24 in the largest
          series). Each renders the receptor constitutively active in a ligand-independent manner, and
          the five mutants show varying degrees of constitutive and PTH-stimulated cAMP signalling in
          reporter cells — which is the mechanistic basis for the genotype-phenotype relationship, since
          T410R patients were the only ones in the cohort whose adult height was not below the third centile.'
        variants:
        - name: PTH1R H223R
          description: A histidine-to-arginine substitution at a strictly conserved residue in the first
            intracellular loop; the original and by far the commonest JMC allele.
        - name: PTH1R T410R
          description: The milder allele. Transmitted through a father and two sons, and the only genotype
            in the series whose carriers reached adult heights at or above the third centile.
      selected_evidence:
        snippet: Five different activating PTH/PTH-related peptide (PTHrP) receptor (PTHR1) mutations
          have been reported as causes of Jansen metaphyseal chondrodysplasia (JMC), a rare disorder characterized
          by severe growth plate abnormalities and PTH-independent hypercalcemia.
        supports: SUPPORT
