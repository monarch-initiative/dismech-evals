              label: metaphyseal chondrodysplasia, Jansen type
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Adulthood — calcium normalises, renal damage does not
        notes: 'Serum calcium tends to normalise in adults, which is the trap in the other direction:
          an adult with normal calcium may still be affected, as in the 38-year-old mother diagnosed only
          after both her sons were. What does not normalise is the accumulated renal injury — most patients
          had nephrocalcinosis and two had advanced chronic kidney disease — nor adult height, which was
          below the third percentile in every patient except those carrying the milder T410R allele.'
      selected_evidence:
        snippet: Surprisingly, however, the now 38-year-old mother was never overtly hypercalcemic and
          was therefore not diagnosed until her sons were found to be affected by JMC at the ages of 28
          months and 40 days, respectively.
        supports: SUPPORT
