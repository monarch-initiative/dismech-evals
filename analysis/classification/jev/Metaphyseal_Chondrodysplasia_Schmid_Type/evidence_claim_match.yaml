        description: 'The PERK arm of the UPR is the dominant pathogenic pathway in MCDS. PERK-mediated
          phosphorylation of eIF2-alpha leads to preferential translation of ATF4 and CHOP. ATF4 directly
          transactivates Sox9, reverting hypertrophic chondrocytes toward a proliferative-like state,
          while CHOP inhibits C/EBP-beta, a master regulator of chondrocyte differentiation. This disrupted
          differentiation program, rather than chondrocyte death, is responsible for the expanded hypertrophic
          zone.

          '
        cell_types:
        - preferred_term: Hypertrophic chondrocyte
          term:
            id: CL:0000743
