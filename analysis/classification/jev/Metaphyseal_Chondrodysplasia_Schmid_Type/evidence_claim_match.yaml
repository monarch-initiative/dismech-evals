        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: functional_haploinsufficiency
        hypothesis_label: Functional Haploinsufficiency Model
        status: DEPRECATED
        description: 'An earlier model in which the shared proximate cause across MCDS mutation classes
          is a reduction in functional extracellular collagen X: nonsense alleles are degraded by nonsense-mediated
          decay, and missense/frameshift alleles remove their product from the matrix by intracellular
          retention.'
        notes: 'Retained for provenance because it is still cited in the older literature and correctly
          describes the reduction in extracellular collagen X. It is superseded as an explanation of the
          phenotype: Col10a1 null mice are essentially normal, and the mutation-specific ER stress response
          accounts for the growth-plate pathology. The dosage reduction is a real but insufficient consequence
          rather than the driver.'
      selected_evidence:
        snippet: We show that nonsense/frame-shift mutations can elicit a gain-of-function effect, affecting
          chondrocyte differentiation in the growth plate.
        supports: REFUTE
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
