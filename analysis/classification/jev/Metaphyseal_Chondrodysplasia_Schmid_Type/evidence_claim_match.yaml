            label: PERK-mediated unfolded protein response
        - preferred_term: Growth Plate Chondrocyte Differentiation
          term:
            id: GO:0003418
            label: growth plate cartilage chondrocyte differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: We show the protein kinase RNA-like ER kinase (PERK) pathway that mediates preferential
          synthesis of ATF4 and CHOP, dominates in causing dysplasia by reverting chondrocyte differentiation
          via ATF4-directed transactivation of Sox9.
        supports: SUPPORT
