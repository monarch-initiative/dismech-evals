              label: Schmid metaphyseal chondrodysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Extracellular Collagen X
        description: 'All MCDS mutation classes lower the amount of functional collagen X reaching the
          hypertrophic-zone matrix: nonsense alleles may be degraded by nonsense-mediated mRNA decay,
          while missense and frameshift alleles remove their product from the matrix by intracellular
          retention. This dosage reduction is a real consequence of the mutation but is not by itself
          sufficient to produce the disease. Col10a1 null animals, which have the dosage defect without
          a mutant chain, do not reproduce MCDS, whereas animals expressing a mutant chain do. The phenotype
          is therefore attributed to the gain-of-function ER stress response (see mechanistic_hypotheses:
          er_stress_gain_of_function), with the older haploinsufficiency reading retained as a deprecated
          hypothesis.

          '
        cell_types:
        - preferred_term: Hypertrophic chondrocyte
          term:
            id: CL:0000743
            label: hypertrophic chondrocyte
        biological_processes:
        - preferred_term: Cartilage Development
          term:
            id: GO:0051216
            label: cartilage development
      selected_evidence:
        snippet: We show that nonsense/frame-shift mutations can elicit a gain-of-function effect, affecting
          chondrocyte differentiation in the growth plate.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
