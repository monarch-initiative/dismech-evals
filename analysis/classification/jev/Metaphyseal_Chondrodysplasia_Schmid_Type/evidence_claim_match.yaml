              label: Schmid metaphyseal chondrodysplasia
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: er_stress_gain_of_function
        hypothesis_label: ER Stress Gain-of-Function Model
        status: CANONICAL
        description: Mutant collagen X misfolds and is retained in the ER of hypertrophic chondrocytes,
          and the resulting ER stress and UPR (dominantly the PERK arm) reverts chondrocyte differentiation
          and expands the hypertrophic zone. This is a gain of function of the mutant chain, not a loss
          of collagen X dosage.
        notes: Two independent lines of evidence discriminate this model from the older haploinsufficiency
          model. First, Col10a1 null mice do NOT phenocopy MCDS whereas mice expressing a mutant chain
          do. Second, driving an unrelated ER-stress-inducing protein from the collagen X promoter is
          sufficient to reproduce the cartilage pathology. Pharmacologic relief of ER stress (carbamazepine)
          and PERK inhibition both ameliorate disease in vivo.
      selected_evidence:
        snippet: Unlike Col10a1 null mutants, transgenic mice (FCdel) bearing the mouse equivalent of
          a human MCDS p.P620fsX621 mutation, displayed typical characteristics of MCDS with disproportionate
          shortening of limbs and early onset coxa vara.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17403716
      reference_title: COL10A1 nonsense and frame-shift mutations have a gain-of-function effect on the
        growth plate in human and mouse metaphyseal chondrodysplasia type Schmid.
      evidence_source: MODEL_ORGANISM
      explanation: 'The decisive comparison: null (dosage-reduced) animals do not reproduce MCDS, whereas
        animals expressing a mutant chain do, arguing against haploinsufficiency as the operative mechanism.'
