  ff35719ac8d47e84777fdce00bb3fb5d1b98cac12d1152eef7fb9be82ab7af45:
    claim:
      about:
        disease:
          name: Metaphyseal Chondrodysplasia, Schmid Type
          disease_term:
            preferred_term: metaphyseal chondrodysplasia, Schmid type
            term:
              id: MONDO:0007983
              label: Schmid metaphyseal chondrodysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Collagen X Misfolding and ER Stress
        description: 'COL10A1 mutations, predominantly in the NC1 domain, cause misfolding and intracellular
          retention of mutant collagen X in hypertrophic chondrocytes. This triggers endoplasmic reticulum
          stress and activation of all three canonical UPR sensors (IRE1, ATF6, PERK). ER stress is a
          central and sufficient pathogenic factor, as demonstrated by knock-in mouse models and transgenic
          lines expressing unrelated ER stress-inducing proteins under the collagen X promoter.

          '
        genes:
        - preferred_term: COL10A1
          term:
            id: hgnc:2185
            label: COL10A1
        molecular_functions:
        - preferred_term: extracellular matrix structural constituent conferring tensile strength
          term:
            id: GO:0030020
            label: extracellular matrix structural constituent conferring tensile strength
        cell_types:
        - preferred_term: Hypertrophic chondrocyte
          term:
            id: CL:0000743
            label: hypertrophic chondrocyte
        biological_processes:
        - preferred_term: Response to ER Stress
          term:
            id: GO:0034976
            label: response to endoplasmic reticulum stress
        - preferred_term: ER Unfolded Protein Response
          term:
            id: GO:0030968
            label: endoplasmic reticulum unfolded protein response
        - preferred_term: Protein Folding
          term:
            id: GO:0006457
            label: protein folding
      selected_evidence:
        snippet: Our data provide the first clear evidence for misfolding of SMCD collagen X mutants,
          and we propose that solvent exposure of the NC1 thiol may trigger the recognition and degradation
          of mutant collagen X chains.
        supports: SUPPORT
    origin:
