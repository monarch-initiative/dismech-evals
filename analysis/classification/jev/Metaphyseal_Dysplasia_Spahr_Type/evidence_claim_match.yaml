        context:
        - path: /pathophysiology/0
          value:
            name: Biallelic MMP13 Catalytic-Domain Loss of Function
            biological_scale: MOLECULAR
            description: The variants reported in MDST fall in the catalytic domain of MMP13. The founding
              family's p.Trp207Gly substitution disrupts a hydrogen bond in the calcium-binding region
              of that domain, disabling the collagenase. This is the mechanistic contrast with dominant
              metaphyseal anadysplasia, where the variants sit in the prodomain and cause premature autoactivation
              rather than simple inactivation.
            genes:
            - preferred_term: MMP13
              term:
                id: hgnc:7159
                label: MMP13
            molecular_functions:
            - preferred_term: metalloendopeptidase activity
              modifier: LOSS_OF_FUNCTION
              term:
                id: GO:0004222
                label: metalloendopeptidase activity
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Failure of Physeal Collagen Remodelling
        description: Loss of MMP13 collagenase activity removes the enzyme that degrades collagen and
          other matrix proteins during physeal remodelling.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: This protein plays a role in the degradation of collagen and other proteins in the extracellular
          matrix with particular importance in the maturation and remodeling of the cartilaginous component
          of physes in growing children
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0/downstream/0
