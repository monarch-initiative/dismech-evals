      assertion_type: Discussion
      assertion:
        discussion_id: gap_mdst_regressive_or_persistent
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is metaphyseal dysplasia, Spahr type regressive or persistent, and does the answer depend
          on which part of the phenotype is measured?
        attaches_to:
        - pathophysiology#Metaphyseal Irregularity with Lower-Limb Deformity
        - phenotypes#Disproportionate short stature
        rationale: The literature is not consistent. Long-term follow-up of the founding family reports
          moderate short stature and knee pain persisting in adults, while an independent sibship describes
          MDST as regressive. Both statements may be true of different components - radiographic metaphyseal
          change may resolve while stature and joint symptoms do not - but no series has separated them.
          Since regression is exactly the axis on which the nosology distinguishes this entity from dominant
          metaphyseal anadysplasia, resolving it would sharpen a classification boundary as well as prognostic
          counselling.
      selected_evidence:
        snippet: These cases confirm the phenotypic variability and regressive nature of MDST in addition
          to suggesting bone fragility as a feature.
        supports: SUPPORT
