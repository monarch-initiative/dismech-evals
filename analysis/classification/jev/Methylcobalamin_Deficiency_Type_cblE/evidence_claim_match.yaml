            term:
              id: MONDO:0009354
              label: methylcobalamin deficiency type cblE
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cble_mouse_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Human cblE presents in infancy with megaloblastic anemia and progressive neurocognitive
          disease, yet the Mtrr(gt/gt) mouse becomes anemic only in late adult life, only in females,
          with a rising rather than falling reticulocyte count, and with no reported neurological phenotype.
          Does that reflect residual activity of the hypomorphic allele, a species difference in erythroid
          and cerebral folate handling, or a different mechanism reaching the same cell type - and can
          any model reproduce the infantile presentation?
        attaches_to:
        - pathophysiology#Impaired Erythropoiesis
        - pathophysiology#Central Nervous System White Matter Injury
        rationale: 'The mismatch is not that the mouse lacks the human phenotypes - it has an erythroid
          one - but that the two systems diverge in different ways, and the difference matters for what
          the model can be used to test. On the erythroid side the divergence is in timing and kinetics:
          the anemia appears late in adult life and is accompanied by reticulocytosis, whereas human folate-deficiency
          megaloblastic anemia is reticulocytopenic, and the authors could not establish that the murine
          anemia is megaloblastic at all. So a mouse that models the consequence of chronic MTRR deficiency
          does not model the neonatal marrow crisis. On the neurological side the divergence is starker
          and mechanistically specific: the entry attributes human white-matter injury to deficient S-adenosylmethionine-dependent
          methylation, and in this line the AdoMet/AdoHcy ratio is preserved in most tissues - unlike
          other murine hyperhomocysteinemia models, where it falls. Until a model reproduces the infantile
          presentation, the question that matters most clinically - whether earlier treatment prevents
          the neurocognitive injury, which is also what the newborn-screening gap turns on - cannot be
          tested in mouse.'
      selected_evidence:
        snippet: Unexpectedly, Mtrr(gt/gt) mice do not show decreases in the AdoMet/AdoHcy ratio in most
          tissues.
        supports: SUPPORT
