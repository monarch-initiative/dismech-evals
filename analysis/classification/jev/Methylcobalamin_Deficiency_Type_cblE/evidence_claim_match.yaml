      assertion:
        discussion_id: cble_newborn_screening_benefit
        kind: KNOWLEDGE_GAP
        prompt: Does presymptomatic detection of cblE by newborn screening improve neurocognitive outcome,
          and which analyte combination detects it reliably?
        attaches_to:
        - pathophysiology#Central Nervous System White Matter Injury
        rationale: 'The haematological features of cblE respond well to hydroxocobalamin while the neurological
          injury often does not, which is the usual argument for presymptomatic treatment. But the screening
          evidence for cblE specifically is weak: the systematic review that recommends newborn screening
          for CBS and severe MTHFR deficiency explicitly declines to extend that to cblE, both because
          benefit-of-early-treatment data are weaker and because analyte performance data are more limited.
          Whether the persistent neurocognitive morbidity reflects irreversible prenatal or early postnatal
          injury, or simply late treatment, is unresolved.'
      selected_evidence:
        snippet: For the cblE and cblG defects, evidence for the benefit of early treatment is weaker;
          and data on performance of Met, Met/Phe and tHcy even more limited.
        supports: SUPPORT
