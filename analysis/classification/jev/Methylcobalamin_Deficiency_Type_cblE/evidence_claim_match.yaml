              label: methylcobalamin deficiency type cblE
        context: []
      assertion_type: Phenotype
      assertion:
        name: Hemolytic Anemia in Adulthood
        category: Hematologic
        description: A late complication, first described in 2024 in two adult cblE siblings who had been
          diagnosed neonatally and treated throughout. Both developed hemolytic anemia with LDH above
          11,000 U/L, undetectable haptoglobin and raised unconjugated bilirubin, which resolved on escalating
          the hydroxocobalamin dose rather than on any new agent. This is a different lesion from the
          presenting megaloblastic anemia and argues that treated cblE needs continued haematological
          surveillance into adult life.
        frequency: VERY_RARE
        phenotype_term:
          preferred_term: Hemolytic anemia
          term:
            id: HP:0001878
            label: Hemolytic anemia
        notes: Reported in one sibling pair. One of the two had a concurrent parvovirus B19 infection,
          which the authors note can cause erythroblastopenia even without immunocompromise, so the hemolysis
          and the viral trigger are not cleanly separable in that patient.
      selected_evidence:
        snippet: We report herein 2 cblE siblings diagnosed in the neonatal period with isolated pancytopenia
          who, despite treatment, exhibited in adulthood hemolytic anemia (LDH >11 000 U/L, undetectable
          haptoglobin, elevated unconjugated bilirubin) which could finally be successfully treated by
          hydroxocobalamin dose escalation.
        supports: SUPPORT
