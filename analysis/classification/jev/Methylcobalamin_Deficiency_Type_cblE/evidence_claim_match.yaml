  7b6359bd270bb41740b130feaf91714b31bf60d75240af518dc6c320077ed973:
    claim:
      about:
        disease:
          name: Methylcobalamin Deficiency Type cblE
          disease_term:
            preferred_term: methylcobalamin deficiency type cblE
            term:
              id: MONDO:0009354
              label: methylcobalamin deficiency type cblE
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Methionine Synthase Trapped in Oxidised Cob(II)alamin State
        description: Methionine synthase turnover intermittently oxidises its cob(I)alamin cofactor to
          catalytically inert cob(II)alamin. MTRR normally performs the NADPH-dependent reductive methylation
          that restores the active form. Without it methionine synthase accumulates in the oxidised state,
          so cellular methylcobalamin is depleted while methionine synthase protein and its intrinsic
          activity are preserved - a functional, not structural, enzyme deficiency. This is why patient
          fibroblast MTR activity can measure normal under strong reducing conditions and only falls when
          the reducing agent is limited.
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: methionine synthase activity
          modifier: DECREASED
          term:
            id: GO:0008705
            label: methionine synthase activity
        chemical_entities:
        - preferred_term: methylcobalamin
          modifier: DECREASED
          term:
            id: CHEBI:28115
            label: methylcobalamin
      selected_evidence:
        snippet: transfection of fibroblasts of cblE patients with a wild-type MTRR minigene expression
          construct resulted in a significant approximately four-fold increase of methionine synthesis,
          indicating correction of the enzyme defect
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/5
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15714522
      reference_title: 'cblE type of homocystinuria due to methionine synthase reductase deficiency: functional
        correction by minigene expression.'
      evidence_source: IN_VITRO
      explanation: Functional rescue - restoring wild-type MTRR to patient cells restores methionine synthesis,
        establishing MTRR loss as sufficient to cause the cellular defect.
