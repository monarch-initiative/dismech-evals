            preferred_term: methylcobalamin deficiency type cblE
            term:
              id: MONDO:0009354
              label: methylcobalamin deficiency type cblE
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Methyl-Group and Folate Trapping
        description: Methionine synthase is the only reaction that regenerates tetrahydrofolate from 5-methyltetrahydrofolate.
          When it stalls, folate is sequestered as 5-methyltetrahydrofolate and becomes unavailable for
          one-carbon transfers - the classical methyl-folate trap. Reduced methionine also lowers S-adenosylmethionine,
          constraining the many downstream methylation reactions on which myelin maintenance and nucleotide
          synthesis depend. The trap explains the raised formiminoglutamate excretion seen in cblE and
          the partial biochemical response to pharmacological folate.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: tetrahydrofolate metabolic process
          modifier: DECREASED
          term:
            id: GO:0046653
            label: tetrahydrofolate metabolic process
        - preferred_term: methylation
          modifier: DECREASED
          term:
            id: GO:0032259
            label: methylation
        - preferred_term: one-carbon metabolic process
          modifier: DECREASED
          term:
            id: GO:0006730
            label: one-carbon metabolic process
      selected_evidence:
        snippet: Before treatment, major findings were microcephaly, psychomotor retardation, episodic
          reduced consciousness, megaloblastic anaemia, increased plasma free homocystine (> 20 mumol/L),
          low plasma methionine (< 10 mumol/L) and increased excretion of formiminoglutamate.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9427140
      reference_title: Folate-responsive homocystinuria and megaloblastic anaemia in a female patient
        with functional methionine synthase deficiency (cblE disease).
      evidence_source: HUMAN_CLINICAL
      explanation: Formiminoglutamate accumulates when tetrahydrofolate is unavailable for the formiminotransferase
        step, the expected consequence of methyl-folate trapping.
