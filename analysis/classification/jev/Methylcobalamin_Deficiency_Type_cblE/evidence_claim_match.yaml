        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide (published cases)
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: No population-based incidence or prevalence estimate exists. Published case counts are
          the only available measure, and the largest systematic survey assembled 11 cblE patients alongside
          13 cblG. cblE is additionally not reliably detected by standard newborn screening, because the
          block spares the propionate pathway and so produces no propionylcarnitine (C3) elevation - meaning
          any case count is an undercount of unknown size, not merely a small number.
      selected_evidence:
        snippet: In 11 cblE and 13 cblG patients, failure to thrive, feeding problems, delayed milestones,
          muscular hypotonia, cognitive impairment and macrocytic anaemia were the most frequent symptoms.
        supports: SUPPORT
