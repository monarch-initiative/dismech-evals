        description: The principal published Mtrr model is a gene-trap hypomorph rather than a null. It
          reproduces the upstream metabolic lesion - MTRR deficiency with hyperhomocysteinemia - and,
          on dedicated haematological characterisation, a macrocytic anemia. That anemia is late adult-onset
          and largely confined to females, however, so it maps onto the human erythroid phenotype in kind
          rather than in timing or sex distribution. The model's other reported phenotypes are reproductive
          and cardiac (embryonic resorption, growth restriction, ventricular septal defects, placental
          defects); the progressive neurocognitive disease that defines human cblE has not been reported
          in it.
        genes:
        - preferred_term: MTRR
          term:
            id: hgnc:7473
            label: MTRR
        modeled_mechanisms:
        - target: MTRR Loss of Function
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Reproduces reduced MTRR function and the expected one-carbon metabolic perturbation,
            but as a hypomorphic gene trap with residual activity rather than the biallelic loss-of-function
            alleles seen in patients.
          limitations: Hypomorphic, not null; the human disorder is caused by biallelic loss-of-function
            or severely hypomorphic alleles, and the mouse allele's residual activity is not calibrated
            against any patient genotype.
        - target: Impaired Erythropoiesis
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: 'Dedicated haematological phenotyping of this line shows that Mtrr(gt/gt) homozygotes
            do develop a macrocytic anemia with compensatory extramedullary haematopoiesis, so the erythroid
            consequence of MTRR deficiency is reproduced. It is reproduced partially: the murine anemia
            is late adult-onset and sex-limited, while human cblE presents with megaloblastic anemia in
            the first months of life in both sexes.'
          limitations: Three specific divergences from the human phenotype. Onset - the murine defect
            is late adult-onset, whereas the human anemia is usually the presenting feature in infancy.
            Sex - female Mtrr(gt/gt) mice are anemic while males show erythrocytic macrocytosis without
            anemia; no comparable sex bias is reported in cblE. Morphology and kinetics - the authors
            state they could not establish whether the murine anemia meets megaloblastic criteria, and
            the reticulocytosis they observe runs opposite to the low reticulocyte count typical of human
            folate-deficiency megaloblastic anemia. The model is therefore informative for the erythroid
            consequence of MTRR deficiency but is not a surrogate for the infantile megaloblastic presentation
            that brings patients to attention.
          readouts:
          - name: Peripheral erythrocyte count and cell volume in adult females
            target: Impaired Erythropoiesis
            direction: ALTERED
            interpretation: Anemia with enlarged erythrocytes - the murine counterpart of the human macrocytic
              anemia, attributed by the authors to defective erythroid differentiation rather than to
              haemolysis.
          - name: Bone marrow cellularity and splenic extramedullary haematopoiesis
            target: Impaired Erythropoiesis
            direction: INCREASED
            interpretation: Compensatory expansion of erythropoiesis in response to the anemia, with raised
              renal Epo transcription driving it.
      selected_evidence:
        snippet: We conclude that Mtrr deficiency adversely impacts reproductive outcomes and cardiac
          development in mice.
        supports: SUPPORT
