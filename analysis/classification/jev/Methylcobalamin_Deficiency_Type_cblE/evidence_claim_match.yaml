  643417defaec57dfc495b6074ef44eabbdce959ba7ff7e603467bf56848fc5fe:
    claim:
      about:
        disease:
          name: Methylcobalamin Deficiency Type cblE
          disease_term:
            preferred_term: methylcobalamin deficiency type cblE
            term:
              id: MONDO:0009354
              label: methylcobalamin deficiency type cblE
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Methionine Synthase Trapped in Oxidised Cob(II)alamin State
        description: Methionine synthase turnover intermittently oxidises its cob(I)alamin cofactor to
          catalytically inert cob(II)alamin. MTRR normally performs the NADPH-dependent reductive methylation
          that restores the active form. Without it methionine synthase accumulates in the oxidised state,
          so cellular methylcobalamin is depleted while methionine synthase protein and its intrinsic
          activity are preserved - a functional, not structural, enzyme deficiency. This is why patient
          fibroblast MTR activity can measure normal under strong reducing conditions and only falls when
          the reducing agent is limited.
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: methionine synthase activity
          modifier: DECREASED
          term:
            id: GO:0008705
            label: methionine synthase activity
        chemical_entities:
        - preferred_term: methylcobalamin
          modifier: DECREASED
          term:
            id: CHEBI:28115
            label: methylcobalamin
      selected_evidence:
        snippet: These data demonstrate a unique requirement for MSR in the reductive activation of MS.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10484769
      reference_title: Molecular basis for methionine synthase reductase deficiency in patients belonging
        to the cblE complementation group of disorders in folate/cobalamin metabolism.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that methionine synthase depends on MTRR for reductive reactivation.
    first_seen_at: '2026-11-09T21:04:01.490984+00:00'
