        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Methionine Synthase Loss of Function
        description: Biallelic pathogenic MTR variants remove or inactivate methionine synthase, the cobalamin-dependent
          enzyme of the remethylation limb. Unlike cblE, where the enzyme is present but cannot be reactivated,
          here the catalytic machinery itself is defective, so in vitro assay under strongly reducing
          conditions does not rescue activity the way it can in cblE - which is the biochemical basis
          on which the two complementation groups were originally separated.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: MTR
          term:
            id: hgnc:7468
            label: MTR
        molecular_functions:
        - preferred_term: methionine synthase activity
          modifier: DECREASED
          term:
            id: GO:0008705
            label: methionine synthase activity
      selected_evidence:
        snippet: The cblG inborn error of vitamin B12 metabolism is associated with pathogenic variants
          in the MTR gene, which encodes methionine synthase.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41202372
      reference_title: Identification of variants of the MTR gene in patients with the cblG inborn error
