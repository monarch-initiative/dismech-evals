  9e946451454faa08cdfe0275d3bd75999800581c5218045c72ffb3402074da58:
    claim:
      about:
        disease:
          name: Methylcobalamin Deficiency Type cblG
          disease_term:
            preferred_term: methylcobalamin deficiency type cblG
            term:
              id: MONDO:0009609
              label: methylcobalamin deficiency type cblG
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cblg_treatment_alters_natural_history
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does treatment of cblG with hydroxocobalamin, betaine and folinic acid change the natural
          history of the neurological disease, or only the biochemistry?
        attaches_to:
        - treatments#Parenteral Hydroxocobalamin
        - pathophysiology#Cerebral White Matter Injury
        - phenotypes#Global Developmental Delay
        rationale: 'The two most relevant papers disagree, and the disagreement is substantive rather
          than a matter of emphasis.

          The larger cohort (24 patients, cblE and cblG pooled) found the biochemical response significant
          and the overall course improving or stable in 96% of patients - and in the same breath reported
          that the average number of CNS symptoms per patient rose significantly over time and that 16
          of 23 were developmentally delayed or severely handicapped at follow-up. Its conclusion is that
          these patients "show limited clinical response to treatment and have neurocognitive impairment."

          The cblG-specific case series argues the opposite for its own five patients, reporting objective
          neurological improvement and better outcomes in those treated early, especially before neurological
          symptoms appeared, and uses that to argue cblG belongs in newborn screening.

          The two are not straightforwardly comparable. Timing of treatment relative to symptom onset
          is the obvious candidate explanation - the favourable series emphasises presymptomatic treatment,
          and the larger cohort found that diagnostic delay correlated significantly with impaired communication
          at follow-up. But the smaller series is five selected patients reported by authors making a
          screening argument, and the larger is retrospective and survey-based with pooled cblE and cblG
          data. Neither design can settle it, and this entry does not.

          This is recorded as a KNOWLEDGE_GAP rather than a HUMAN_MODEL_MISMATCH because the uncertainty
          is in human clinical evidence, not in translation from a model system.'
        proposed_experiments:
        - experiment_id: exp_cblg_presymptomatic_treatment_cohort
          name: Prospective outcome comparison by treatment timing in a cblG-only cohort
          description: Assemble a cblG-only (not pooled with cblE) cohort stratified by whether treatment
            began before or after the first neurological symptom, with prospective standardised neurocognitive
            assessment, to test whether the apparent benefit tracks presymptomatic initiation rather than
            differing between the two published series for other reasons.
          would_support:
          - phenotypes#Global Developmental Delay
          supporting_outcome:
          - Presymptomatically treated cblG patients show materially better neurocognitive outcomes than
            symptomatically treated ones, supporting newborn screening and explaining the discrepancy
            as a timing effect.
          refuting_outcome:
          - Outcomes are comparable regardless of treatment timing, indicating the neurological phenotype
            is largely determined before or independently of the correctable biochemistry.
      selected_evidence:
        snippet: However, the published literature contains differing conclusions on whether treatment
          is effective in changing the natural history of the disease.
        supports: SUPPORT
