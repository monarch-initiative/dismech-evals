              label: methylcobalamin deficiency type cblG
        context: []
      assertion_type: Treatment
      assertion:
        name: Avoidance of Nitrous Oxide Anaesthesia
        description: 'GeneReviews lists nitrous oxide among the agents to avoid, and for cblG this is
          the most mechanistically pointed item on the list rather than a generic precaution: nitrous
          oxide irreversibly oxidises the cobalamin cofactor of methionine synthase - the exact enzyme
          this disease has already lost - so an anaesthetic exposure removes whatever residual activity
          treatment is working to sustain. It is also the hazard most likely to be met by a clinician
          who does not know the diagnosis.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: 'Agents/circumstances to avoid: Prolonged fasting (longer than overnight without dextrose-containing
          intravenous fluids); dietary protein intake below the recommended dietary allowance for age
          or more than that prescribed by a metabolic specialist; methionine restriction including use
          of medical foods that do not contain methionine; and the anesthetic nitrous oxide.'
        supports: SUPPORT
