        name: Methylmalonic Acid
        notes: 'Normal. cblE and cblG affect only methylcobalamin synthesis, leaving the adenosylcobalamin-dependent
          mutase intact, so these are isolated homocystinurias. A raised methylmalonic acid points to
          cblC, cblD, cblF or cblJ instead.

          Bound to the CHEBI analyte rather than to an HP abnormality term, because the finding is a normal
          value: an HP term names an abnormality, so pairing one with presence NORMAL would machine-readably
          assert the opposite of what this record says.'
        presence: NORMAL
        biomarker_term:
          preferred_term: methylmalonic acid
          term:
            id: CHEBI:30860
            label: methylmalonic acid
      selected_evidence:
        snippet: inborn errors affecting synthesis of the methylcobalamin coenzyme required by methionine
          synthase (cblE and cblG) result in isolated homocystinuria
        supports: SUPPORT
