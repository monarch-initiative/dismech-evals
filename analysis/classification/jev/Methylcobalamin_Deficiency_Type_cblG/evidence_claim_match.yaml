      assertion_type: Pathophysiology
      assertion:
        name: Thrombotic Microangiopathy
        description: A rare but important complication, and the one with the sharpest diagnostic trap.
          In cblC it is a well-known presentation; in cblG only two cases are reported. The published
          case was misdiagnosed as atypical haemolytic uraemic syndrome, treated with eculizumab without
          response, and only resolved once exome sequencing found MTR variants and hydroxocobalamin was
          started - so the practical point is that a poor eculizumab response in a child with TMA and
          any developmental concern should prompt homocysteine measurement.
        biological_scale: TISSUE
      selected_evidence:
        snippet: We report the second case of MSD associated to TMA previously diagnosed as aHUS in which
          the patient had a poor response to eculizumab.
        supports: SUPPORT
