        context: []
      assertion_type: Definition
      assertion:
        name: Isolated remethylation defect biochemical signature
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'The triad that localises a patient to cblE or cblG rather than to the combined disorders
          or to classical homocystinuria: total homocysteine high, methionine low, methylmalonic acid
          normal. Each of the three carries information the other two do not - homocysteine says there
          is a remethylation problem, normal MMA excludes the combined defects, and low methionine distinguishes
          a remethylation defect from cystathionine beta-synthase deficiency, where methionine is high.
          Separating cblE from cblG then requires MTR/MTRR sequencing or complementation analysis; the
          biochemistry cannot do it.'
      selected_evidence:
        snippet: It leads to a biochemical phenotype of hyperhomocysteinemia and hypomethioninemia.
        supports: SUPPORT
