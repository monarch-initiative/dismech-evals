        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Methylfolate Trap
        description: Methionine synthase is the only reaction that consumes 5-methyltetrahydrofolate.
          When it fails, folate becomes metabolically stranded in the 5-methyl form and cannot re-enter
          the tetrahydrofolate pool that supplies one-carbon units for purine and thymidylate synthesis.
          The cell is therefore functionally folate-deficient despite adequate total folate, which is
          why the haematological picture is megaloblastic and why folinic acid - which bypasses the trap
          - is part of treatment.
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: Derivatives of folic acid are involved in transfer of one-carbon units in cellular metabolism,
          playing a role in synthesis of purines and thymidylate and in the remethylation of homocysteine
          to form methionine.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22108709
      reference_title: Update and new concepts in vitamin responsive disorders of folate transport and
        metabolism.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the premise the trap rests on - one folate pool serves both homocysteine
        remethylation and purine/thymidylate synthesis, so blocking the first strands folate away from
        the second. The trap itself has not been measured directly in cblG patients, which is why this
        node carries mechanistic rather than patient-level evidence.
