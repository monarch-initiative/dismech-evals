      assertion_type: Pathophysiology
      assertion:
        name: Methionine and S-Adenosylmethionine Depletion
        description: Methionine is the precursor of S-adenosylmethionine, the universal methyl donor.
          Falling methionine constrains SAM supply and therefore cellular methylation capacity, which
          is the most plausible route from this enzyme defect to the predominantly neurological phenotype
          - myelin maintenance being heavily methylation-dependent. This entry treats the SAM link as
          the mechanistic rationale for methionine supplementation rather than as a directly measured
          step in patients.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: methionine biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0071265
            label: L-methionine biosynthetic process
        chemical_entities:
        - preferred_term: methionine
          term:
            id: CHEBI:16643
            label: L-methionine
      selected_evidence:
        snippet: Medical management of cblG includes the use of hydroxocobalamin, betaine, folinic acid,
          and in some cases methionine supplementation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
