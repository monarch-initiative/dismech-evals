              label: methylcobalamin deficiency type cblG
        context: []
      assertion_type: Treatment
      assertion:
        name: Long-Term Biochemical Monitoring and Dose Adjustment
        description: 'Long-term management targets numbers rather than symptoms: lower plasma total homocysteine,
          and plasma methionine kept within the normal range. The methionine goal is the one specific
          to the remethylation disorders - in cblG methionine is low, so the goal is to raise it, the
          opposite of management in classical homocystinuria. GeneReviews states the goal as lowering
          tHcy *and* MMA, but that sentence covers all the intracellular cobalamin disorders collectively;
          MMA is normal in cblG (see the Methylmalonic Acid biochemical record), so there is nothing to
          lower on that arm and it is not a monitoring target here.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Long-term management focuses on improving the metabolic derangement by lowering plasma
          tHcy and MMA concentrations and maintaining plasma methionine concentrations within the normal
          range.
        supports: SUPPORT
