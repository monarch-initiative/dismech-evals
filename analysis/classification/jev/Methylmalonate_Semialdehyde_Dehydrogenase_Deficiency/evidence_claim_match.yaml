        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'All reported disease alleles are missense and affect residues conserved across mammals:
          c.1336G>A (p.Gly446Arg), c.785C>A (p.Ser262Tyr), c.184C>T (p.Pro62Ser), c.514T>C (p.Tyr172His),
          c.1603C>T (p.Arg535Cys) and c.1261C>T (p.Pro421Ser). Most patients are homozygous, several through
          consanguinity; one is compound heterozygous. The disease mechanism is biallelic loss of function.
          Two caveats matter for variant interpretation: p.Pro62Ser was also seen once in 530 control
          chromosomes, and p.Pro421Ser was reported as a variant of uncertain significance whose pathogenicity
          rests on the accompanying protein and metabolite data rather than on the sequence change alone.'
      selected_evidence:
        snippet: suggested homozygosity for the missense mutation c.785 C > A (S262Y) in exon 7 which
          was not found in 210 control alleles
        supports: SUPPORT
