        description: Metabolomic profiling of fibroblasts from one patient found an over-representation
          of fatty acids and acylcarnitines. The authors proposed that blocked methylmalonate semialdehyde
          is diverted to beta-alanine and then to malonyl-CoA, increasing fatty acid synthesis. This is
          an inference from a metabolite pattern in a single patient's cells, not a demonstrated flux,
          so the node is provisional and is not used to explain any clinical finding.
        chemical_entities:
