  cae46233054be0ee049f1b77dfd28795422977e0c96431f44dc234afec9c4a25:
    claim:
      about:
        disease:
          name: Methylmalonate Semialdehyde Dehydrogenase Deficiency
          disease_term:
            preferred_term: methylmalonate semialdehyde dehydrogenase deficiency
            term:
              id: MONDO:0013579
              label: methylmalonate semialdehyde dehydrogenase deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mmsdh_metabolite_variability
        prompt: Why does a single, well-defined enzymatic block produce a different metabolite profile
          in every reported patient, and what determines which metabolites accumulate in a given individual?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Accumulation of upstream valine- and thymine-pathway metabolites
        - phenotypes#Methylmalonic aciduria
        rationale: 'Among molecularly confirmed patients the clinical and biochemical phenotype is highly
          variable: methylmalonic acid has been persistent in some, transient in another, and absent in
          others, and the fifth reported case diverges clinically from the earlier ones. Residual enzyme
          activity, relative valine versus thymine flux, and the observed dissociation between plasma
          and urinary beta-alanine are all candidate explanations, none tested. The three earliest reported
          patients also had essentially non-overlapping urinary profiles, but only the first of those
          was confirmed at the cDNA level, so that particular contrast is at least as consistent with
          three different disorders as with variability within this one and is not the basis of this gap.
          The practical consequence is that the disorder has no reliable biochemical screening signature.'
        proposed_experiments:
        - experiment_id: exp_mmsdh_flux_genotype_correlation
          name: Residual-activity and stable-isotope flux correlation across genotypes
          description: Express each reported ALDH6A1 missense allele, measure residual activity against
            both (R)- and (S)-methylmalonate semialdehyde, and pair this with stable-isotope valine and
            thymine flux studies in patient fibroblasts. Testing whether allele-specific enantiomer preference
            predicts the individual metabolite profile would convert an unexplained heterogeneity into
            a genotype-phenotype rule.
      selected_evidence:
        snippet: clinical phenotypes diverge from prior cases
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32151545
      reference_title: 'Clinical, biochemical, mitochondrial, and metabolomic aspects of methylmalonate
        semialdehyde dehydrogenase deficiency: Report of a fifth case.'
      evidence_source: HUMAN_CLINICAL
      explanation: A second molecularly confirmed case whose phenotype diverges from the earlier ones.
