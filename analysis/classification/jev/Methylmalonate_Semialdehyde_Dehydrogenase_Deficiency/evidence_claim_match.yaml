        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: HIBADH deficiency
        description: The other primary cause of 3-hydroxyisobutyric aciduria. HIBADH catalyses the immediately
          upstream step of the same valine pathway, so the two disorders produce overlapping urinary 3-hydroxyisobutyrate.
          The discriminators are that HIBADH deficiency does not affect thymine catabolism (so beta-aminoisobutyrate
          and beta-alanine should not be raised) and that HIBADH enzyme activity is normal in MMSDH deficiency.
          Measuring HIBADH activity is exactly how MMSDH deficiency was established in two of the reported
          patients.
      selected_evidence:
        snippet: the only previously recognized primary cause had been a deficiency of methylmalonic semialdehyde
          dehydrogenase, the enzyme that is immediately downstream of HIBADH in the valine catabolic pathway
          and is encoded by the ALDH6A1 gene
        supports: SUPPORT
