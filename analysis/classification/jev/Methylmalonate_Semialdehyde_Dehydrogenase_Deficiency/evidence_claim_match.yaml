          disease_term:
            preferred_term: methylmalonate semialdehyde dehydrogenase deficiency
            term:
              id: MONDO:0013579
              label: methylmalonate semialdehyde dehydrogenase deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mmsdh_clinical_causality
        prompt: Do the neurological, hepatic and growth findings reported in ALDH6A1 patients arise from
          the enzyme deficiency, or are they ascertainment artefacts of investigating children who were
          referred for those problems?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Reported neurological association of uncertain causality
        - phenotypes#Global developmental delay
        - phenotypes#Abnormal myelination
        - phenotypes#Hepatic encephalopathy
        rationale: Every reported patient bar one was ascertained because of a clinical problem, and the
          exception - the 1985 index patient, found through newborn screening for an unrelated reason
          - was developing normally at four years. With fewer than ten molecularly confirmed patients,
          no segregation data and no population screening, the disorder's clinical penetrance is not estimable
          and the direction of the association cannot be resolved. ClinGen's Limited classification rests
          on exactly this ambiguity.
        proposed_experiments:
        - experiment_id: exp_mmsdh_unbiased_ascertainment
          name: Unbiased ascertainment through untargeted metabolomic screening
          description: Identify ALDH6A1 biallelic individuals from large unselected biobank and newborn-screening
            metabolomic datasets rather than from clinical referral, then phenotype them with standardized
            developmental, hepatic and neuroimaging assessments against variant-negative relatives. This
            is the only design that can separate the disorder's true clinical spectrum from referral bias.
      selected_evidence:
        snippet: In summary, there is limited evidence to support this gene-disease relationship.
        supports: SUPPORT
