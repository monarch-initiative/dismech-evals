      assertion_type: Pathophysiology
      assertion:
        name: ALDH6A1-dependent methylmalonate semialdehyde dehydrogenase deficiency
        conforms_to: metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Biallelic ALDH6A1 variants reduce or abolish the activity of mitochondrial methylmalonate
          semialdehyde dehydrogenase. Six missense alleles affecting residues conserved across mammals
          have been reported. Direct enzymatic confirmation was historically impossible because the substrate
          is too unstable to assay; the first successful fibroblast assay was reported in 2013, and reduced
          protein has separately been shown by Western blot.
        genes:
        - preferred_term: ALDH6A1
          term:
            id: hgnc:7179
            label: ALDH6A1
        molecular_functions:
        - preferred_term: methylmalonate-semialdehyde dehydrogenase activity
          term:
            id: GO:0004491
            label: methylmalonate-semialdehyde dehydrogenase (acylating, NAD) activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: mitochondrial matrix
          term:
            id: GO:0005759
            label: mitochondrial matrix
      selected_evidence:
        snippet: The disease mechanism appears to be biallelic loss-of-function, with a deficiency in
          the MMSDH protein leading to an increase in valine metabolites such as 3-hydroxyisobutyric acid
        supports: SUPPORT
