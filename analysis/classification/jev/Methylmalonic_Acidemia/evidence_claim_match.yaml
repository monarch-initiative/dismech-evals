        description: The most upstream step modeled here, and the mildest. CD320 encodes the transcobalamin
          receptor, which takes cobalamin-loaded transcobalamin into the cell; biallelic loss of function
          therefore limits the cobalamin available for both coenzymes, and the mitochondrial arm shows
          up as elevated propionylcarnitine on the newborn screen and elevated methylmalonic acid on its
          workup. Unlike the mutase and cofactor defects the biochemical abnormality is correctable with
          oral cobalamin and the reported homozygotes have typically had no major health or developmental
          concerns, so this node is modeled as a cobalamin-availability constraint on the mutase step
          rather than as a route to the decompensation and organ injury nodes.
        biological_processes:
        - preferred_term: cobalamin transport
          modifier: DECREASED
          term:
            id: GO:0015889
            label: cobalamin transport
      selected_evidence:
        snippet: Cellular uptake of vitamin B12 (cobalamin, Cbl) is mediated by a cell surface receptor
          (TCblR/CD320) that binds transcobalamin (TC) saturated with Cbl.
        supports: SUPPORT
