              label: methylmalonic acidemia
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Newborn screening
        description: 'Detection of MMA via tandem mass spectrometry using elevated propionylcarnitine
          (C3) as the primary marker. A multicenter Chinese study demonstrated NBS-detected mut-type MMA
          patients had significantly lower mortality (12.5% vs 32.7%) and better outcomes (normal outcome
          51.8% vs 15.7%) compared to clinically diagnosed patients.

          '
      selected_evidence:
        snippet: By comparison of the clinically-diagnosed patients, NBS-detected patients showed younger
          age at diagnosis, less incidence of disease onset, better responsiveness of vitamin B12, younger
          age at start of treatment, lower levels of biochemical features before and after treatment,
          and better long-term prognosis
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/1
