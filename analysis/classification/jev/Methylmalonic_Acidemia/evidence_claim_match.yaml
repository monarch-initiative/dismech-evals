              label: Autosomal recessive inheritance
        features: MCEE acts one step before the mutase, racemizing D-methylmalonyl-CoA to the L isomer
          that methylmalonyl-CoA mutase requires. Fewer than twenty probands have been reported and the
          founder nonsense allele p.Arg47* accounts for the predominance of cases. The gene has its own
          dismech entry (Methylmalonyl-CoA_Epimerase_Deficiency), bound to MONDO:0009615; it is listed
          here because GeneReviews counts it among the genes whose biallelic variants establish a diagnosis
          of isolated MMA.
      selected_evidence:
        snippet: The diagnosis of isolated MMA is established in a proband by identification of biallelic
          pathogenic variants in MCEE, MMAA, MMAB, MMADHC, or MMUT
