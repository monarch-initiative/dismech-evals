      assertion:
        name: Methylmalonyl-CoA epimerase deficiency
        genes:
        - preferred_term: MCEE
          term:
            id: hgnc:16732
            label: MCEE
        description: A separate enzymatic step from the mutase and its cofactor. MCEE interconverts D-
          and L-methylmalonyl-CoA, the racemization that must happen before methylmalonyl-CoA mutase can
          act, so biallelic MCEE loss of function blocks the propionyl-CoA to succinyl-CoA route one step
          earlier than MMUT does and produces methylmalonic aciduria. The clinical consequence is variable,
          from no symptoms to severe metabolic acidosis, and ClinGen notes that the range of reported
          phenotypes leaves causation of anything beyond the methylmalonic aciduria itself uncertain.
        molecular_functions:
        - preferred_term: methylmalonyl-CoA epimerase activity
          modifier: DECREASED
          term:
            id: GO:0004493
            label: methylmalonyl-CoA epimerase activity
      selected_evidence:
        snippet: We investigated a cohort of 150 individuals suffering from MMAuria of unknown origin,
          identifying ten new patients with pathogenic variations in MCEE.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
