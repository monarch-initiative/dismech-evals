  dbf318ef334c3f4405ac26a9b683389ed1a04e9e61d17c3e84edeb9b06bd783d:
    claim:
      about:
        disease:
          name: Methylmalonic Acidemia
          disease_term:
            preferred_term: methylmalonic acidemia
            term:
              id: MONDO:0002012
              label: methylmalonic acidemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MMUT/AdoCbl pathway molecular function deficiency
        description: Pathogenic variants affecting MMUT and adenosylcobalamin-handling genes reduce catalytic
          conversion capacity for methylmalonyl-CoA utilization. MMUT encodes the mutase apoenzyme itself;
          MMAA (cblA) and MMAB (cblB) supply and deliver its adenosylcobalamin cofactor, and MMADHC (cblD)
          sits at the branch point of intracellular cobalamin trafficking that partitions cobalamin between
          mitochondrial adenosylcobalamin and cytosolic methylcobalamin, so cblD variants that impair
          the mitochondrial arm present as isolated methylmalonic aciduria.
        genes:
        - preferred_term: MMUT
          term:
            id: hgnc:7526
            label: MMUT
        - preferred_term: MMAA
          term:
            id: hgnc:18871
            label: MMAA
        - preferred_term: MMAB
          term:
            id: hgnc:19331
            label: MMAB
        - preferred_term: MMADHC
          term:
            id: hgnc:25221
            label: MMADHC
        molecular_functions:
        - preferred_term: methylmalonyl-CoA mutase activity
          term:
            id: GO:0004494
            label: methylmalonyl-CoA mutase activity
          modifier: DECREASED
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        locations:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
      selected_evidence:
        snippet: Methylmalonic and propionic acidemia (MMA/PA) are inborn errors of metabolism characterized
          by accumulation of propionic acid and/or methylmalonic acid due to deficiency of methylmalonyl-CoA
          mutase (MUT) or propionyl-CoA carboxylase (PCC).
        supports: SUPPORT
