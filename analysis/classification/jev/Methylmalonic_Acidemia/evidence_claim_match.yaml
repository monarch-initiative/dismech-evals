  216c645e4a58988ce4e81106c6e4bb3c4a8f510b14219a5ee5d83af29ab7d88c:
    claim:
      about:
        disease:
          name: Methylmalonic Acidemia
          disease_term:
            preferred_term: methylmalonic acidemia
            term:
              id: MONDO:0002012
              label: methylmalonic acidemia
        context: []
      assertion_type: Subtype
      assertion:
        name: TCblR defect
        display_name: Transcobalamin receptor (CD320) defect
        description: Biallelic CD320 loss of function, most commonly homozygosity for the in-frame p.Glu88del
          deletion, restricts cellular uptake of cobalamin-loaded transcobalamin and raises propionylcarnitine
          (C3) and methylmalonic acid enough to produce a positive newborn screen for propionic/methylmalonic
          aciduria. It is set apart from the mutase and cofactor forms by its course rather than by its
          biochemistry. The elevations correct on oral cobalamin, and ClinGen records that p.Glu88del
          homozygotes have typically had no major health or developmental concerns and that the condition
          is probably benign, while still grading the gene-disease relationship Definitive; one consanguineous
          case with bilateral retinal artery occlusions at seven weeks is the reported exception. It is
          kept as a subtype row here, and not promoted to its own entry, because GeneReviews does not
          count CD320 among the genes whose biallelic variants establish a diagnosis of isolated MMA and
          the mechanism is fully captured by the cobalamin-uptake node in this entry.
        subtype_term:
          preferred_term: methylmalonic acidemia due to transcobalamin receptor defect
          term:
            id: MONDO:0013341
            label: methylmalonic acidemia due to transcobalamin receptor defect
        genes:
        - preferred_term: CD320
          term:
            id: hgnc:16692
            label: CD320
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: CD320 | HGNC:16692 | methylmalonic acidemia due to transcobalamin receptor defect | MONDO:0013341
          | AR | Definitive
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/2
