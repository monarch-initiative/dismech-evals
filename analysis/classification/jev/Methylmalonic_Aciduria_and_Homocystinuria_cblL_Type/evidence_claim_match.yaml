        context: []
      assertion_type: Treatment
      assertion:
        name: Dietary Management and Avoidance of Catabolic Stress
        description: 'Dietary protein restriction is part of the group regimen, but the more clinically
          load-bearing half of this entry is what to avoid, because two of the items are things a clinician
          unaware of the diagnosis would do routinely.

          GeneReviews lists prolonged fasting beyond overnight without dextrose-containing intravenous
          fluids, protein intake below the age-appropriate allowance or above what a metabolic specialist
          has prescribed, methionine restriction including medical foods that contain no methionine, and
          the anaesthetic nitrous oxide. Nitrous oxide is the sharpest of these: it irreversibly oxidises
          the cobalt of cobalamin and inactivates methionine synthase, so in a patient whose cobalamin
          processing is already limited it can precipitate acute decompensation. Methionine restriction
          is the counterintuitive one, since restricting the amino acid a patient is already short of
          is exactly the wrong move here.

          Note the direction of inference. This is management for disorders of intracellular cobalamin
          metabolism as a class, which MAHCL belongs to by biochemistry; nothing has been reported for
          a MAHCL patient specifically.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: dietary intervention
          term:
            id: NCIT:C15447
            label: Dietary Intervention
      selected_evidence:
        snippet: 'Agents/circumstances to avoid: Prolonged fasting (longer than overnight without dextrose-containing
          intravenous fluids); dietary protein intake below the recommended dietary allowance for age
          or more than that prescribed by a metabolic specialist; methionine restriction including use
          of medical foods that do not contain methionine; and the anesthetic nitrous oxide.'
        supports: SUPPORT
