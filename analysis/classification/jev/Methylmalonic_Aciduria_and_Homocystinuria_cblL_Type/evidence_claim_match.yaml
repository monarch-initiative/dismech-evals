            name: Reduced THAP11 Occupancy of the MMACHC Promoter
            description: 'The step that turns a transcription factor variant into a metabolic disease,
              and the one place in this entry where the causal claim is directly measured rather than
              inferred. In HEK-293 cells the F80L protein bound a subset of THAP11 target promoters less
              well than wild type, and the MMACHC promoter was among the strongly affected ones. Binding
              was selectively rather than globally impaired, which matters: a transcription factor that
              had simply stopped working everywhere would not explain a disease whose dominant biochemical
              signature is a single pathway.'
            biological_scale: MOLECULAR
