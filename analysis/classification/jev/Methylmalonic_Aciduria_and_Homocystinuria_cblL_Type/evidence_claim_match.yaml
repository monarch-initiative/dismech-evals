          value:
            name: thap11-depleted zebrafish embryo
            species: Zebrafish
            genotype: thap11 loss of function
            publication: PMID:28449119
            description: The functional model in the founding report. Loss of THAP11 impairs neural precursor
              proliferation and differentiation and abolishes Meckel's cartilage, the ceratohyal and all
              ceratobranchial cartilages, mirroring the craniofacial phenotype the same group had previously
              shown for HCFC1.
            genes:
            - preferred_term: THAP11
              term:
                id: hgnc:23194
                label: THAP11
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Neural Precursor Proliferation and Differentiation
        relationship: RECAPITULATES
        fidelity: LOW
        model_scale: CELLULAR
        description: The only in vivo evidence that THAP11 has a developmental role beyond the metabolic
          one.
        limitations: 'Depletion rather than the patient''s missense allele, so it tests gene requirement
          and not variant effect, and the patient''s F80L protein is known from cell work to retain partial
          and selective function. The craniofacial phenotype has no reported human counterpart: the single
          MAHCL patient was not described with cartilage or craniofacial anomalies, which may mean the
          fish overstates the lesion or simply that nobody looked.'
        divergences:
        - divergence_type: PROXY_QUANTITY
          materiality: INVALIDATING
          description: The manipulated quantity is thap11 gene dosage reduced to near zero. The disease's
            quantity is a homozygous missense protein that binds a subset of its normal targets, including
            MMACHC, less well. Selective partial loss and complete depletion are different lesions, and
            the cell work exists precisely because they are.
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: Meckel's cartilage and the ceratobranchial series are pharyngeal arch derivatives
            with no direct human equivalents at the structures scored, so the craniofacial readout cannot
            be matched to a human phenotype even in principle.
      selected_evidence:
        snippet: The loss of THAP11 in zebrafish embryos results in craniofacial abnormalities including
          the complete loss of Meckel's cartilage, the ceratohyal, and all of the ceratobranchial cartilages.
        supports: SUPPORT
