              id: MONDO:0975798
              label: methylmalonic aciduria and homocystinuria, cb1L type
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Biochemical testing followed by sequencing after MMACHC and HCFC1 are excluded
        description: 'Biochemical testing comes first for the group: methylmalonic acid in urine and blood
          together with plasma total homocysteine. Confirmation is molecular, and GeneReviews lists THAP11
          among the genes in which biallelic variants confirm a diagnosis of a disorder of intracellular
          cobalamin metabolism.

          Two things make cblL harder to reach than that summary suggests. The index patient was found
          only after MMACHC and HCFC1 had been sequenced and excluded, so THAP11 is reached by exclusion
          rather than as a first-line test unless the panel already contains it. And the biochemistry
          that would trigger the workup may not be the expected pairing: the OMIM clinical synopsis for
          that patient records methylmalonic aciduria without homocystinuria, so a result showing isolated
          methylmalonic aciduria should not be taken to exclude this group. That second point is a single-patient
          observation and is recorded here as a caution rather than as a rule; see the naming discussion.'
      selected_evidence:
        snippet: Evaluation of the methylmalonic acid (MMA) level in urine and blood and plasma total
          homocysteine (tHcy) level are the mainstays of biochemical testing.
        supports: SUPPORT
