      assertion_type: Pathophysiology
      assertion:
        name: Loss of Cytosolic Cobalamin Processing
        description: 'MMACHC is the cytosolic chaperone that processes incoming cobalamin, removing the
          upper axial ligand from cyanocobalamin, methylcobalamin and adenosylcobalamin so the cofactor
          can be routed onward. Without enough of it, dietary and therapeutic cobalamin cannot be converted
          into the two active forms the cell needs.

          This node and everything below it are inherited from cblC biology rather than measured in a
          MAHCL patient. That is a legitimate inference, because the complementation behaviour and biochemistry
          of the transcriptional disorders match cblC, but it is an inference and the entry does not present
          it otherwise.'
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        biological_processes:
