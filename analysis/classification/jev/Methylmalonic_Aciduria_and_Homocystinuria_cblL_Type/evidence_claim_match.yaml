      assertion_type: Pathophysiology
      assertion:
        name: Biallelic THAP11 p.Phe80Leu
        description: 'A homozygous missense change in the THAP domain, the zinc-finger DNA-binding module
          shared across the twelve human THAP proteins. The variant was found after MMACHC and HCFC1 had
          been sequenced and excluded in a patient whose clinical and biochemical picture overlapped cblX,
          so the gene was reached by elimination plus a mechanistic hypothesis rather than by an unbiased
          screen.

          p.Phe80Leu is the only reported MAHCL allele. No second family, no null allele, and no allelic
          series exist, so nothing is known about whether other THAP11 variants would give the same disease.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: THAP11
          term:
            id: hgnc:23194
            label: THAP11
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
          modifier: DECREASED
      selected_evidence:
        snippet: We report a patient who presented with clinical and biochemical phenotypic features that
          overlap cblX, but who does not have any mutations in either MMACHC or HCFC1.
        supports: SUPPORT
