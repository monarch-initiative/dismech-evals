  633d73d0738eace2e2ca59192754693830a4abc8308b6898733b9b0057c09313:
    claim:
      about:
        disease:
          name: Methylmalonic Aciduria and Homocystinuria cblL Type
          disease_term:
            preferred_term: methylmalonic aciduria and homocystinuria, cblL type
            term:
              id: MONDO:0975798
              label: methylmalonic aciduria and homocystinuria, cb1L type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mahcl_named_for_a_pairing_its_only_patient_lacked
        kind: KNOWLEDGE_GAP
        prompt: The disorder is called methylmalonic aciduria and homocystinuria, but the OMIM clinical
          synopsis for its single reported patient records mild methylmalonic aciduria without homocystinuria.
          Is MAHCL genuinely a combined disorder?
        attaches_to:
        - phenotypes#Methylmalonic aciduria
        - pathophysiology#Combined Methylmalonyl-CoA Mutase and Methionine Synthase Cofactor Deficiency
        rationale: 'This matters because the biochemical pairing is what places a patient in this disease
          group in the first place. A newborn screen or a metabolic workup that finds isolated methylmalonic
          aciduria will not generate a differential that includes the cobalamin complementation groups,
          and the one MAHCL patient described so far would have looked like that.

          Three readings are open and one patient cannot separate them. The mechanism might be quantitative:
          partial, selective loss of MMACHC transcription could reduce adenosylcobalamin enough to raise
          methylmalonic acid while leaving methylcobalamin adequate for methionine synthase, which would
          predict an isolated or methylmalonic-predominant picture as characteristic of the transcriptional
          disorders rather than as an exception. It might be developmental, with the biochemistry sampled
          at an age or a treatment state that masked the homocysteine rise. Or the single patient might
          simply be atypical.

          The literature is already hedged here in a way worth noticing: the standard description of the
          cobalamin disorders speaks of methylmalonic acid "and/or" homocysteine. Naming this entity for
          both, in the same act as recording a patient who had one, is a nosological decision made by
          OMIM rather than a finding.

          A second reported patient with a full biochemical profile would settle it. There is currently
          nothing else that would.'
      selected_evidence:
        snippet: A common phenotype of severe neurological symptoms including intractable epilepsy and
          profound neurocognitive impairment, along with variable biochemical manifestations, was observed
          in all affected subjects compared to individuals with early-onset cblC.
        supports: SUPPORT
