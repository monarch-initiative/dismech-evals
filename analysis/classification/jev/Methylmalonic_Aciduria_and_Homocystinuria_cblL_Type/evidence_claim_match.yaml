  6ba0d15832743f1198ea80c2dadeb156a2912bce098e07ec7091d42960ee7920:
    claim:
      about:
        disease:
          name: Methylmalonic Aciduria and Homocystinuria cblL Type
          disease_term:
            preferred_term: methylmalonic aciduria and homocystinuria, cblL type
            term:
              id: MONDO:0975798
              label: methylmalonic aciduria and homocystinuria, cb1L type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mahcl_versus_cblx_entity_boundary
        kind: KNOWLEDGE_GAP
        prompt: Is cblL a distinct disease from cblX, or the autosomal recessive arm of one disorder of
          the HCFC1-THAP11 complex?
        attaches_to:
        - disease#Methylmalonic Aciduria and Homocystinuria cblL Type
        - genetic#HCFC1
        - genetic#THAP11
        rationale: 'The two are separated by inheritance and gene and joined by mechanism, and the literature
          has not settled which of those should decide. GeneReviews still calls THAP11 "cblX-like" rather
          than giving it its own complementation letter, and clinical gene panels list THAP11 and ZNF143
          together under that label; OMIM has since given it a separate number and the cblL name.

          This entry follows OMIM and curates cblL separately, for two reasons that are about the knowledge
          base rather than about nosology. First, inheritance differs, and an entry that merged an X-linked
          hemizygous disorder with an autosomal recessive one could not carry a coherent inheritance block
          or support correct recurrence-risk counselling. Second, the surrounding entries already work
          this way: cblC, cblD, cblE and cblG each have their own entry rather than being subtypes of
          a cobalamin grouping.

          One consequence should be flagged for a curator rather than silently absorbed. `kb/disorders/Inborn_Disorder_of_Cobalamin_Metabolism_and_Transport.yaml`
          describes THAP11 inside its cblX subtype as a "cblX-like form", which was accurate when written
          and is now superseded by this entry. Reconciling that description is a separate edit to a shared
          file and is deliberately not bundled into this PR.'
      selected_evidence:
        snippet: THAP11(cblX-like), ZNF143(cblX-like), or a hemizygous variant in HCFC1 (cblX, which can
          show a cblC complementation class).
        supports: SUPPORT
