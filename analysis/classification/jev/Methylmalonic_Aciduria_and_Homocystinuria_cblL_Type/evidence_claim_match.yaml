            term:
              id: MONDO:0975798
              label: methylmalonic aciduria and homocystinuria, cb1L type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neural Precursor Proliferation and Differentiation
        description: 'A parallel branch, and the reason MAHCL may not be simply a metabolic disease with
          a neurological complication. THAP11 loss in zebrafish impairs proliferation and differentiation
          of neural precursors, and separately abolishes Meckel''s cartilage and the pharyngeal cartilages.
          Mouse work on Hcfc1 and Ronin found the same complex regulating ribosome protein genes, with
          phenotypes attributed to deregulated ribosome biogenesis rather than to the metabolic block.

          How independent this branch really is from the metabolic one is not settled, and the honest
          answer is less independent than it first looks. In the companion zebrafish work on hcfc1b, the
          craniofacial abnormalities were rescued by expressing human MMACHC, and the authors concluded
          that the craniofacial role is mediated in part through MMACHC regulation. So at least some of
          what looks like a separate developmental program runs back through the same downstream gene
          as the metabolic lesion. The ribosome biogenesis arm has no such rescue reported and remains
          the clearest candidate for a genuinely MMACHC-independent contribution.

          Whether this branch contributes to the human phenotype is unknown, because there is one patient
          and no craniofacial or ribosomal assessment was reported for them.'
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: Functional analysis in the developing zebrafish embryo demonstrated that both THAP11
          and HCFC1 regulate the proliferation and differentiation of neural precursors, suggesting important
          roles in normal brain development.
        supports: SUPPORT
