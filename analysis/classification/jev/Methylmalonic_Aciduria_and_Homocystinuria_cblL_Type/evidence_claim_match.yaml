          term:
            id: GO:0005829
            label: cytosol
        chemical_entities:
        - preferred_term: cobalamin
          term:
            id: CHEBI:30411
            label: cobalamin
      selected_evidence:
        snippet: we demonstrate that this versatile protein catalyzes an entirely different chemical reaction
          with alkylcobalamins using the thiolate of glutathione for nucleophilic displacement to generate
          cob(I)alamin and the corresponding glutathione thioether
        supports: SUPPORT
