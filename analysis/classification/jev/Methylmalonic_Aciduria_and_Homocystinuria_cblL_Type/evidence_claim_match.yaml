  777079979f7191e1de2d99c43e8398e774e419f316764451ef2a1c72c49c22ab:
    claim:
      about:
        disease:
          name: Methylmalonic Aciduria and Homocystinuria cblL Type
          disease_term:
            preferred_term: methylmalonic aciduria and homocystinuria, cblL type
            term:
              id: MONDO:0975798
              label: methylmalonic aciduria and homocystinuria, cb1L type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mahcl_single_patient_evidence_base
        kind: KNOWLEDGE_GAP
        prompt: One patient, one allele, and no reported treatment outcome. How much of this entry is
          about MAHCL rather than about the pathway it sits on?
        attaches_to:
        - genetic#THAP11
        - treatments#
        rationale: 'Worth stating explicitly because the entry looks better evidenced than the disease
          is. The molecular mechanism is genuinely well supported: promoter binding and transcription
          were measured directly for the patient''s own allele in HEK-293 cells, and the regulatory relationship
          is confirmed in mouse and zebrafish. That is more functional evidence than many single-patient
          disorders have.

          What is missing is everything patient-facing. There is no second family, so penetrance, expressivity
          and allelic spectrum are unknown and no genotype-phenotype statement is possible. There is no
          reported treatment response, so the hydroxocobalamin entry in this file is group management
          applied by inference. And there is a specific mechanistic reason not to assume it transfers:
          in enzymatic cblC the chaperone is present but defective, whereas here it is scarce but normal,
          and it is not obvious that saturating a reduced pool of functional chaperone behaves like saturating
          a normal pool of defective one.

          The single most useful thing anyone could add to this entry is a second reported patient.'
      selected_evidence:
        snippet: HEK-293 cells bearing a THAP11 mutation identified in a patient suffering from cobalamin
          disorder (THAP11F80L) were viable although proliferated more slowly.
        supports: SUPPORT
