            term:
              id: MONDO:0975798
              label: methylmalonic aciduria and homocystinuria, cb1L type
        context: []
      assertion_type: Genetic
      assertion:
        name: THAP11
        notes: 'The causal gene, also known as RONIN. It encodes a THAP-domain zinc-finger transcription
          factor that partners with HCFC1. Note the HGNC identifier: THAP11 is hgnc:23194. hgnc:20856
          is THAP1, a different THAP-family gene that causes DYT6 dystonia and has nothing to do with
          cobalamin metabolism. The deep-research report for this entry offered HGNC:20856 as THAP11 in
          four places, so the trap is worth recording; a separate report in this repository uses the same
          identifier correctly for THAP1.

          That particular form of the error is caught. HGNC is configured in conf/oak_config.yaml, and
          validate-terms compares a bound label against the ontology''s canonical label, so copying the
          report''s identifier together with its offered label fails with a label mismatch. What is not
          caught is the self-consistent version: hgnc:20856 carrying its own true label THAP1, under a
          name and preferred_term of THAP11. Nothing compares the gene the binding resolves to against
          the gene the entry says it is about, so that combination passes schema validation and term validation
          alike.'
        gene_term:
          preferred_term: THAP11
          term:
            id: hgnc:23194
            label: THAP11
        relationship_type: CAUSATIVE
        variants:
        - name: NM_020457.3:c.240C>G (p.Phe80Leu)
          type: missense
          clinical_significance: LIKELY_PATHOGENIC
          identifiers:
          - ClinVar:VCV000393304
          - dbSNP:rs188675529
          description: 'The only reported MAHCL allele, homozygous in the index patient of Moroccan parentage.
            It falls in the THAP domain, the zinc-finger DNA-binding module that mediates sequence-specific
            promoter contact, which is what makes a binding defect the expected consequence rather than
            a guess.

            Recorded as LIKELY_PATHOGENIC rather than PATHOGENIC. The functional support is unusually
            direct for a single-patient disorder, since promoter binding and MMACHC transcription were
            measured for this exact allele in HEK-293 cells, but the reporting authors themselves described
            it as potentially pathogenic and there is no second family and no segregation beyond one homozygote.'
      selected_evidence:
        snippet: THAP11(cblX-like), ZNF143(cblX-like), or a hemizygous variant in HCFC1 (cblX, which can
          show a cblC complementation class).
        supports: SUPPORT
