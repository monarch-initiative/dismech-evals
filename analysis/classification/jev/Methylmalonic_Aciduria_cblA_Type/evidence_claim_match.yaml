      assertion:
        name: Renal Tubulointerstitial Injury
        biological_scale: TISSUE
        description: Tubulointerstitial injury can impair renal function in cblA. Chronic interstitial
          inflammation has been documented on biopsy, and another severe cblA case had tubulointerstitial
          nephropathy with glomerulosclerosis. Renal involvement is variable, and early hydroxocobalamin
          benefit remains supported by observational evidence.
        notes: The cblA biopsy evidence establishes a tubulointerstitial lesion without resolving its
          proximal-tubule epithelial-cell localization. CL:0002306 is therefore not assigned to this tissue
          node. Proximal-tubule mitochondrial mechanisms from other MMA subtypes remain candidates for
          cblA, not a demonstrated cellular lesion in these patients.
        locations:
        - preferred_term: kidney
          term:
            id: UBERON:0002113
            label: kidney
