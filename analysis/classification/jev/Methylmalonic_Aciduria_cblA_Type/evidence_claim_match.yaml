        name: cblB type methylmalonic aciduria (MMAB deficiency)
        description: The other adenosylcobalamin-synthesis defect causing isolated methylmalonic acidemia,
          caused by biallelic MMAB variants and covered within `kb/disorders/Methylmalonic_Acidemia.yaml`.
          cblB affects the adenosyltransferase that makes adenosylcobalamin, whereas cblA affects the
          G-protein that delivers and maintains it, and the clinical courses differ sharply despite the
          shared pathway.
        distinguishing_features:
        - cblB patients have an earlier onset, more complications and deaths, and higher urinary methylmalonic
          acid than cblA patients.
        - Chronic renal failure is common in cblB and relatively spared in cblA.
        - Cobalamin responsiveness is the rule in cblA and only occasional in cblB.
        - MONDO keeps the two as separate terms with separate OMIM anchors and separate causal genes,
          MMAA with OMIM:251100 for cblA and MMAB with OMIM:251110 for cblB.
      selected_evidence:
        snippet: Overall, patients with mut0 and cblB defects had an earlier onset of symptoms, a higher
          frequency of complications and deaths, and a more pronounced urinary excretion of MMA than those
          with mut- and cblA defects.
        supports: SUPPORT
