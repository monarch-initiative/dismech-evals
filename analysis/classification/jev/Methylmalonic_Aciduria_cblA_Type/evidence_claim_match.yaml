  4e0d9b0c3b1ae08791f4b91acfe30363f0df716876856264f5979f2de5943d1b:
    claim:
      about:
        disease:
          name: Methylmalonic Aciduria, cblA Type
          disease_term:
            preferred_term: methylmalonic aciduria, cblA type
            term:
              id: MONDO:0009613
              label: methylmalonic aciduria, cblA type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cbla_residual_renal_disease_on_treatment
        kind: KNOWLEDGE_GAP
        prompt: Why does chronic kidney disease still develop in cblA patients whose methylmalonate is
          well controlled on cobalamin?
        attaches_to:
        - pathophysiology#Renal Tubulointerstitial Injury
        rationale: 'Renal mitochondrial dysfunction is represented as a hypothesis, with a causal path
          to tubulointerstitial injury and CKD. cblA-specific mediation remains unproven: incomplete metabolite
          control, damage before treatment and tissue mitochondrial dysfunction may contribute. The adult
          series was retrospective and included variable initial treatment; the Polish series used cystatin
          C to identify CKD. Neither cohort establishes why renal disease persists in a particular well-controlled
          patient. The full 2022 severe-case biopsy account localizes disease to the tubulointerstitium
          with glomerulosclerosis, without specifying proximal epithelial cells; the accessible 2013 biopsy
          abstract likewise reports nonspecific interstitial inflammation. A later biomarker study found
          no elevated urinary markers in five genetically confirmed cblA patients sampled while well,
          all with normal cystatin C. That small, preserved-function subgroup neither demonstrates proximal-cell
          injury nor excludes it in cblA patients with CKD.'
      selected_evidence:
        snippet: This is also in line with the pathophysiological hypotheses suggesting that chronic kidney
          disease is more directly linked to MMA toxicity, while brain involvement seems to be more complex
          and related partially to acute decompensation and energy deficit, and partially to de novo synthesis
          and trapping of toxic metabolites in brain tissue.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35618652
      reference_title: Very long-term outcomes in 23 patients with cblA type methylmalonic acidemia.
      evidence_source: OTHER
      explanation: The cblA cohort discussion proposes organ-injury routes; these are hypotheses, not
        measured causal mediation.
