      assertion_type: Pathophysiology
      assertion:
        name: Secondary impairment of ureagenesis
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: Propionyl-CoA inhibition of N-acetylglutamate synthase can reduce the N-acetylglutamate
          required to activate carbamoyl-phosphate synthetase I. Rat liver extract experiments support
          this candidate route to hyperammonemia in organic acidemias. Its quantitative contribution in
          MMAA deficiency is unmeasured, and other mechanisms of urea-cycle impairment may contribute.
      selected_evidence:
        snippet: A decreased level of N-acetylglutamate in liver mitochondria that would follow inhibition
          of N-acetylglutamate synthetase by propionyl-CoA would be expected to lead to hyperammonemia.
        supports: SUPPORT
        directness: INDIRECT
