      assertion_type: DifferentialDiagnosis
      assertion:
        name: cblH
        description: A complementation class defined out of the cblA cohort itself. A patient with the
          clinical and biochemical phenotype of cblA whose fibroblasts complemented all cblA lines was
          assigned to a new class, cblH, before MMAA was cloned. The episode is why a cblA-like biochemical
          phenotype is not by itself a cblA diagnosis.
        distinguishing_features:
        - Defined by somatic cell complementation rather than by biochemistry, which cannot separate it
          from cblA.
        - Requires molecular testing to resolve, since MMAA sequencing is normal.
      selected_evidence:
        snippet: These results strongly suggest that the cblA variant represents a novel complementation
          class, which we have designated cblH and which represents a mutation at a distinct gene.
