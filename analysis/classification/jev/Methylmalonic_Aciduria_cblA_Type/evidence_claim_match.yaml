  5792a9f2ad4b30f760a3210acbc74e0d02245c98b215b9de061333f3b7be6b08:
    claim:
      about:
        disease:
          name: Methylmalonic Aciduria, cblA Type
          disease_term:
            preferred_term: methylmalonic aciduria, cblA type
            term:
              id: MONDO:0009613
              label: methylmalonic aciduria, cblA type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of MMAA-Mutase Functional Interaction
        biological_scale: MOLECULAR
        description: 'MMAA variants can disrupt its functional interaction with MMUT and impair cofactor
          loading and repair. The 2017 series found reduced MMUT-stimulated GTPase activity in all 15
          tested mutant proteins, with physical binding lost in nine. This is not universal across alleles:
          a 2023 study found enhanced MMUT-stimulated activity for R98G but defective gating and cofactor
          repair.'
        molecular_functions:
        - preferred_term: mutase-stimulated MMAA GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
        notes: No modifier is set on the GTPase descriptor because the biochemical effects are allele-dependent.
          All 15 purified mutants in the 2017 series retained wild-type-like intrinsic GTPase activity
          but had reduced MMUT stimulation; nine also lost physical binding. The p.Asp292Val exception
          concerned GTP binding, not basal GTPase activity. R98G showed enhanced MMUT stimulation in the
          2023 study despite defective gating and repair. A uniform DECREASED annotation would obscure
          these distinctions.
      selected_evidence:
        snippet: However, all mutations strongly decreased functional association with MUT by reducing
          GTPase activity stimulation upon incubation with MUT, while nine mutant proteins additionally
          lost the ability to physically bind MUT.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28497574
      reference_title: Protein destabilization and loss of protein-protein interaction are fundamental
        mechanisms in cblA-type methylmalonic aciduria.
      evidence_source: IN_VITRO
      explanation: All 15 purified mutants had reduced functional association in this assay; only nine
        additionally lost physical binding, so the two defects are distinguished.
