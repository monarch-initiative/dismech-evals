          group. The allele spectrum is dominated by premature termination codons, and one nonsense allele,
          c.433C>T (p.Arg145Ter), accounts for a large fraction of mutant chromosomes.
        gene_term:
          preferred_term: MMAA
          term:
            id: hgnc:18871
            label: MMAA
        frequency: approximately 20% of isolated methylmalonic acidemia
        case_fractions:
        - population: Isolated methylmalonic acidemia, literature estimate
          case_fraction_percent: 20.0
          notes: Share of isolated methylmalonic acidemia attributable to cblA, quoted as an approximate
            literature figure rather than derived from a single genotyped cohort.
        variants:
        - name: c.433C>T (p.Arg145Ter)
          description: Recurrent nonsense allele on a common haplotype, reported as 43% of pathogenic
            alleles in the founding mutation survey and seen in the homozygous state in long-followed
            patients.
        - name: Missense alleles at conserved residues
          description: A minority allele class that is mechanistically the most informative. The protein
            is made and retains intrinsic GTPase activity, but cannot engage the mutase or gate cofactor
            transfer, and about a third of these alleles additionally destabilise the protein.
      selected_evidence:
        snippet: It is located on chromosome 4q31.1-2 and encodes a predicted protein of 418 aa.
        supports: SUPPORT
