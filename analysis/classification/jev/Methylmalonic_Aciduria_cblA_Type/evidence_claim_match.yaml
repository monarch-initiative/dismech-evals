      assertion:
        name: Methylmalonyl-CoA mutase deficiency (mut-type isolated methylmalonic acidemia)
        disease_term:
          preferred_term: methylmalonic acidemia
          term:
            id: MONDO:0002012
            label: methylmalonic acidemia
        description: The other, and commoner, cause of isolated methylmalonic acidemia, curated as `kb/disorders/Methylmalonic_Acidemia.yaml`.
          The biochemical presentation at first crisis is essentially the same and the age at diagnosis
          is similar, so the two are separated by genotype and by cobalamin responsiveness rather than
          at the bedside.
        distinguishing_features:
        - Near-universal cobalamin responsiveness in cblA, against a much lower rate in mut-type disease
          and none in mut0.
        - Significantly lower plasma and urine methylmalonic acid in cblA.
        - Better preserved glomerular filtration rate and less frequent chronic renal failure in cblA.
        - Neurological complications predominate in the mut subgroup on direct comparison.
        - The lesion in cblA is in cofactor delivery to a structurally intact mutase, whereas in mut-type
          disease the mutase apoenzyme itself is deficient.
      selected_evidence:
        snippet: Although similar at first, cblA patients respond to hydroxocobalamin treatment, subsequently
          show significantly lower levels of MMA and a milder course than mut patients.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
