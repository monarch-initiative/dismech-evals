        prompt: How does p.Lys60Gln cause disease when its protein behaves like wild type in every assay
          applied to it?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Two Molecular Routes to Enzyme Loss
        - genetic#MCEE
        rationale: p.Lys60Gln was reported homozygous in a patient, but it maps onto the wild-type structure
          without an obvious defect, is predicted tolerated by both SIFT and PolyPhen2, and its recombinant
          protein matches wild type in soluble level, unfolding and activity. Either the assays miss the
          defect - an interaction with a partner enzyme, a tissue-specific effect, an expression-level
          change not captured by over-expression - or the variant is not the cause of that patient's phenotype.
          Nothing published resolves it.
      selected_evidence:
        snippet: By contrast, soluble protein levels, unfolding characteristics and activity of MCEE-Lys60Gln
          were comparable to wt, leaving unclear how this variation may cause disease.
        supports: SUPPORT
