            term:
              id: MONDO:0009615
              label: methylmalonic acidemia due to methylmalonyl-CoA epimerase deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_mcee_clinical_significance
        prompt: Is MCEE deficiency a disease, or a biochemical trait that has been ascertained through
          disease?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Acute Encephalopathy and Neurological Injury
        - disease#Methylmalonyl-CoA Epimerase Deficiency
        rationale: 'The biochemical phenotype is not in dispute: biallelic null alleles, reduced propionate
          incorporation, complementation to the MCEE group, and rescue by wild-type cDNA. What is disputed
          is whether the clinical findings reported alongside it are caused by it. The case against is
          specific rather than general - two patients'' neurological disease was fully explained by a
          co-inherited SPR defect and reversed by neurotransmitter replacement; two others were asymptomatic;
          siblings homozygous for the same null allele are discordant for symptoms; and the largest review
          found no genotype-phenotype relationship. The case for rests on the acute decompensations, which
          are hard to attribute to anything else and which follow catabolic stress in the way an intoxication-type
          block predicts. The most defensible current reading is that the enzymatic block and the acute
          crises are real, and that the chronic neurological burden is unproven.'
      selected_evidence:
        snippet: The clinical significance and biochemical characteristics of this rare condition have
          been incompletely defined.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
