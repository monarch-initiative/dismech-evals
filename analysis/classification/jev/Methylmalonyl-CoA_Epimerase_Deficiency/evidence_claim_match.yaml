          epimerization of d-methylmalonyl-CoA, generated from propionyl-CoA by propionyl-CoA carboxylase
          (PCC), to form l-methylmalonyl-CoA, subsequently converted into succinyl-CoA by methylmalonyl-CoA
          mutase (MUT) for entry into the TCA cycle.
