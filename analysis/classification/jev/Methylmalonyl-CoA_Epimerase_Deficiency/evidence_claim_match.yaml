        context: []
      assertion_type: Genetic
      assertion:
        name: MCEE
        gene_term:
          preferred_term: MCEE
          term:
            id: hgnc:16732
            label: MCEE
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'MCEE on 2p13.3 encodes mitochondrial methylmalonyl-CoA epimerase. Reported disease
          alleles are overwhelmingly one nonsense variant, c.139C>T (p.Arg47*), which accounts for 83%
          of alleles in the published series; the remainder are rare missense, frameshift and deep-intronic
          splicing changes. The locus matters clinically for a second reason: SPR, whose deficiency causes
          a treatable neurotransmitter disorder, lies 1.8 Mb away, and consanguineous families have been
          reported homozygous for null alleles in both.'
        variants:
        - name: c.139C>T (p.Arg47*)
          description: The recurrent nonsense allele, truncating the protein within the first beta-sheet
            so that essentially no product survives nonsense-mediated decay. It accounts for the large
            majority of reported disease alleles.
        - name: c.158T>G (p.Ile53Arg)
          description: A misfolding missense allele at the dimer interface, absent from ExAC, yielding
            almost no soluble protein and no measurable activity.
        - name: c.427C>T (p.Arg143Cys)
          description: An expressed but catalytically defective allele; the crystal structure of the variant
            protein shows displacement of two loops framing the active site. Reported only in the heterozygous
            state without an identified second allele, so its clinical role is not settled.
        - name: c.379-644A>G
          description: A deep-intronic splicing variant found in trans with p.Arg47*, identified only
            by RNA study after exon sequencing found a single heterozygous allele. It is the reason a
            heterozygous-looking exome result does not exclude the diagnosis.
      selected_evidence:
        snippet: This remains by far the most common pathogenic variation identified in MCEE deficiency,
          with 16 out of 21 patients homozygous for this allele.
        supports: SUPPORT
