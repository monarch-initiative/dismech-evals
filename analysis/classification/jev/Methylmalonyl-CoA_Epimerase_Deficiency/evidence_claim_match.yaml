        prompt: What actually carries the residual flux past the missing epimerase, and how much does
          it vary between people?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Partial Block of the Propionate-to-Succinate Pathway
        rationale: 'Two bypasses have been proposed - spontaneous non-enzymatic racemisation of the CoA
          ester, and a shunt through free methylmalonic acid - and the siRNA experiment shows something
          substantial is carrying flux, but neither has been quantified in humans and no second enzyme
          has been identified. This matters beyond mechanism: if bypass capacity varies between individuals
          it is the most obvious candidate explanation for why the same homozygous null allele produces
          everything from no symptoms to severe disease, which is the question the controversy above turns
          on.'
      selected_evidence:
        snippet: In contrast, the physiological significance of the second enzymatic step, catalysed by
          methylmalonyl-coA epimerase (MCE; also known as methylmalonyl-coA racemase), has remained less
          clear.
        supports: SUPPORT
