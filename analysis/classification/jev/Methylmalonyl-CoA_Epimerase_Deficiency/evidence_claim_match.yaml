              term:
                id: CHEBI:15465
                label: (R)-methylmalonyl-CoA
              modifier: INCREASED
            - preferred_term: (S)-methylmalonyl-CoA
              term:
                id: CHEBI:15466
                label: (S)-methylmalonyl-CoA
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Accumulation of Propionate-Pathway Metabolites
        description: Substrate backs up behind the block and is disposed of through the alternative routes
          that generate the characteristic organic acids.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: Methylmalonyl-CoA epimerase deficiency is an ultra-rare autosomal recessive disorder
