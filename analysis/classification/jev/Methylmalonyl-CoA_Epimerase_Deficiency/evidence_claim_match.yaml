        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Two Molecular Routes to Enzyme Loss
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: The dominant allele by far, c.139C>T (p.Arg47*), truncates the protein inside the
          first beta-sheet, so essentially no protein survives. The missense alleles fail differently.
          p.Ile53Arg sits at the dimer interface and yields almost no soluble protein in either a recombinant
          system or patient fibroblasts, i.e. it misfolds. p.Arg143Cys is expressed at close to wild-type
          levels but its crystal structure shows two displaced loops that frame the active-site pocket,
          and its activity is nearly gone. So the same enzyme deficiency is reached either by losing the
          protein or by keeping it and breaking the site.
        molecular_functions:
        - preferred_term: methylmalonyl-CoA epimerase activity
          term:
            id: GO:0004493
            label: methylmalonyl-CoA epimerase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Functional analysis of MCEE-Ile53Arg expressed in a bacterial recombinant system as well
          as patient-derived fibroblasts revealed nearly undetectable soluble protein levels, defective
          globular protein behavior, and using a newly developed assay, lack of enzymatic activity - consistent
          with misfolded protein.
        supports: SUPPORT
