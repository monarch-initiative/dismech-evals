        description: This is the node that makes the disorder what it is. D-methylmalonyl-CoA accumulates
          behind the missing enzyme and less L-methylmalonyl-CoA reaches methylmalonyl-CoA mutase, so
          flux into succinyl-CoA and the TCA cycle falls. But it falls only partly. The D-to-L conversion
          also happens non-enzymatically, and a second bypass runs through free methylmalonic acid, so
          a complete genetic null still leaves measurable pathway activity - siRNA knockdown of MCEE reduced
          propionate incorporation only slightly. A partial block is why this disorder is biochemically
          milder than a mutase defect despite sitting on the same pathway, and why its methylmalonate
          elevation is modest and intermittent rather than massive and constant.
        biological_processes:
