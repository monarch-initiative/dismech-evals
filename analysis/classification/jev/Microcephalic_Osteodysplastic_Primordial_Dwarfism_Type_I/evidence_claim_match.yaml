      assertion_type: ProgressionInfo
      assertion:
        phase: Prenatal-onset deficit with historically infantile-lethal course
        notes: Growth restriction, microcephaly, and brain malformation are established prenatally and
          are already complete at birth. The course is chronic and non-remitting, punctuated by acute
          neurologic events precipitated by physiologic stress. Historically MOPD I has been lethal in
