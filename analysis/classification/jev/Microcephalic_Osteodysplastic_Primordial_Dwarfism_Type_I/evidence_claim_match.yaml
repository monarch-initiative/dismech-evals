  39828ee32b139ce01b706847ea75590b150d932a4e188625df460f59830d4c40:
    claim:
      about:
        disease:
          name: Microcephalic Osteodysplastic Primordial Dwarfism Type I
          disease_term:
            preferred_term: microcephalic osteodysplastic primordial dwarfism type I
            term:
              id: MONDO:0008871
              label: microcephalic osteodysplastic primordial dwarfism type I
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic RNU4ATAC Variants Destabilizing U4atac snRNA
        description: 'Pathogenic variants in RNU4ATAC (2q14.2) are single-nucleotide substitutions in
          a non-protein-coding snRNA gene, clustering in two structurally critical regions of U4atac —
          the 5'' stem-loop (n.30G>A, n.50G>A/C, n.51G>A, n.55G>A; n.51G>A is an Old Order Amish founder
          allele) and the Stem II domain (n.16G>A, n.111G>A, n.124G>A). Most act by disrupting the snRNA''s
          secondary structure and its binding of essential di-snRNP protein components; n.124G>A acts
          differently, by reducing U4atac abundance. Complete loss of U4atac is expected to be lethal,
          so disease alleles are hypomorphic rather than null.

          A 2026 reevaluation of every published RNU4ATAC case makes the genotype-phenotype relationship
          explicit and gives it a structural basis: genotypes in which the variants are located *exclusively*
          in the 5'' stem-loop produce the severe, lethal MOPD I end of the spectrum, while a genotype
          carrying at least one variant that spares the 5'' stem-loop gives a milder phenotype with later
          onset - Roifman or Lowry-Wood syndrome. The reason is that the 5'' stem-loop is where U4atac
          binds the essential di-snRNP proteins NHP2L1 and PRPF31, so sparing it preserves partial function.
          This is the single most useful predictive rule in the RNU4ATAC-opathies, and it is why the three
          disorders are separate dismech entries rather than subtypes of one.'
        biological_scale: MOLECULAR
        role: trigger
        genes:
        - preferred_term: RNU4ATAC
          term:
            id: hgnc:34016
            label: RNU4ATAC
      selected_evidence:
        snippet: may be explained through the severely impaired binding of U4atac to key protein constituents
          of the minor spliceosome (i.e. NHP2L1 and PRPF31)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41808109
      reference_title: 'Phenotypic spectrum of RNU4ATAC-related spliceosomopathies: four novel cases and
        integrated reevaluation of previously reported patients.'
      evidence_source: HUMAN_CLINICAL
      explanation: Gives the structural reason the 5' stem-loop is the severity-determining region, which
        is what the node description asserts.
