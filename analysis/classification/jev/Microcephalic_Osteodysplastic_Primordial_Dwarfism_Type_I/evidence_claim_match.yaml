              label: microcephalic osteodysplastic primordial dwarfism type I
        context: []
      assertion_type: Genetic
      assertion:
        name: RNU4ATAC
        gene_term:
          preferred_term: RNU4ATAC
          term:
            id: hgnc:34016
            label: RNU4ATAC
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'RNU4ATAC (2q14.2) is a single-copy, non-protein-coding gene encoding the U4atac small
          nuclear RNA of the minor spliceosome. All reported pathogenic variants are single-nucleotide
          substitutions clustering in the 5'' stem-loop and Stem II structural domains. n.51G>A is an
          Old Order Amish founder allele and the most frequently reported pathogenic variant. Allele combination
          is the principal determinant of where an individual falls on the RNU4ATAC spectrum: variants
          that overlap MOPD I-implicated structural elements paired with a milder second allele shift
          the phenotype toward Roifman or Lowry-Wood syndrome. Because complete U4atac loss is expected
          to be lethal, disease alleles are hypomorphic.'
      selected_evidence:
        snippet: Functional assays showed that mutations (30G>A, 51G>A, 55G>A, and 111G>A) associated
          with MOPD I cause defective U12-dependent splicing.
        supports: SUPPORT
