        description: The other numbered MOPD entity. Despite the shared clinical name and shared membership
          in the microcephalic primordial dwarfism group, MOPD II is a mechanistically unrelated disorder
          caused by biallelic PCNT loss of function, a centrosomal rather than spliceosomal lesion. It
          is the single most important differential because the names invite conflation.
        disease_term:
          preferred_term: microcephalic osteodysplastic primordial dwarfism type II
          term:
            id: MONDO:0008872
            label: microcephalic osteodysplastic primordial dwarfism type II
        distinguishing_features:
        - MOPD I has profound cognitive impairment; MOPD II has near-normal intelligence
        - MOPD I has structural brain malformation; the MOPD II brain is small but structurally unremarkable
        - MOPD I is historically lethal in infancy or early childhood; MOPD II permits survival into adulthood
        - MOPD II carries a distinctive later-onset vasculopathy, abnormal dentition, and insulin resistance
          not characteristic of MOPD I
        - Causal gene differs (RNU4ATAC vs PCNT), as does the cellular mechanism (minor spliceosome vs
          centrosome)
      selected_evidence:
        snippet: mRNA splicing (U4atac), and centrosome function (CEP152, PCNT, and CPAP)
