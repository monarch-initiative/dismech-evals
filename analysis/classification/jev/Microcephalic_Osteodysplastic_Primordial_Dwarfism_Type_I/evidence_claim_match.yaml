        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective U12-Type Minor Intron Splicing
        description: 'The functional consequence is selective mis-splicing of U12-type (minor) introns,
          present in roughly 700 human genes, while U2-dependent (major) intron splicing is unaffected.
          The defect is selective at the level of splicing rather than expression: transcriptomic analysis
          of TALS patient-derived cells shows distinct U12-type intron splicing profiles versus controls
          but largely unchanged mRNA levels. The specificity of the lesion is demonstrated by rescue —
          introducing wild-type U4atac into MOPD I cells restores U12-dependent splicing.'
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: skin fibroblast
          term:
            id: CL:0002620
            label: skin fibroblast
        biological_processes:
        - preferred_term: mRNA splicing, via spliceosome
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: DECREASED
      selected_evidence:
        snippet: Concerning RNU4ATAC-mutated patients, we show that as expected, they display distinct
          U12-type intron splicing profiles compared to controls, but that rather unexpectedly mRNA expression
          levels are mostly unchanged.
        supports: SUPPORT
