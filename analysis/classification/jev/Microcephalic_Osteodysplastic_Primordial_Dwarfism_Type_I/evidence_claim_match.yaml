          altered cilium function in patient fibroblasts and by a u4atac zebrafish model with ciliopathy-related
          phenotypes rescued by wild-type but not variant human U4atac, and it explains why some individuals
          with biallelic RNU4ATAC variants present with Joubert-syndrome-like features. This is a secondary
          (downstream) arm, not the primary lesion.
        biological_scale: CELLULAR
