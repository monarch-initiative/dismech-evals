            label: U12-type spliceosomal complex
          modifier: ABNORMAL
      selected_evidence:
        snippet: Analysis of MOPD I patient fibroblasts and iPS cells homozygous for the most common mutation,
          51G>A, shows reduced levels of the U4atac/U6atac.U5 tri-snRNP complex as determined by glycerol
          gradient sedimentation and immunoprecipitation.
        supports: SUPPORT
