          I, cognition in MOPD II is typically near-normal or only mildly affected. Cognitive impairment
          when present is usually attributable to stroke rather than to the primary developmental lesion.
          This dissociation between brain volume and cognitive outcome is a defining and mechanistically
          notable feature of the disorder. The evidence items below are recorded as REFUTE against the
          intellectual-disability annotation: they document the ABSENCE of intellectual disability as
          a positive discriminating feature.'
        phenotype_term:
          preferred_term: Intellectual disability
          term:
            id: HP:0001249
            label: Intellectual disability
      selected_evidence:
        snippet: MOPD II is distinct from SCKL by more severe growth retardation, radiological abnormalities,
          and absent or mild mental retardation.
        supports: REFUTE
