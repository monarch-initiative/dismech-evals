              label: microcephalic osteodysplastic primordial dwarfism type II
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective ATR-Dependent Checkpoint Signaling
        description: Pericentrin loss also impairs ATR-dependent DNA damage checkpoint signaling, the
          same pathway disrupted by hypomorphic ATR variants in Seckel syndrome. This provides the first
          mechanistic link between a structural centrosomal protein and DNA damage signaling and explains
          why the centrosomal and DNA-damage-response classes of microcephalic primordial dwarfism converge
          on one clinical phenotype.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: DNA damage response
          term:
            id: GO:0006974
            label: DNA damage response
          modifier: DECREASED
      selected_evidence:
        snippet: Furthermore, we find that cells of individuals with Seckel syndrome due to mutations
          in PCNT (PCNT-Seckel) have defects in ATR-dependent checkpoint signaling, providing the first
          evidence linking a structural centrosomal protein with DNA damage signaling.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
