        distinguishing_features:
        - MOPD II has near-normal intelligence; MOPD I has profound intellectual disability
        - MOPD II has no primary structural brain malformation; MOPD I has lissencephaly, corpus callosum
          and cerebellar vermis anomalies
        - MOPD II permits survival into adulthood; MOPD I is historically lethal in infancy
        - MOPD II has a distinctive later-onset vasculopathy, dental, and metabolic phenotype not seen
          in MOPD I
        - Causal gene differs (PCNT vs RNU4ATAC), as does the cellular mechanism (centrosome vs minor
          spliceosome)
      selected_evidence:
        snippet: mRNA splicing (U4atac), and centrosome function (CEP152, PCNT, and CPAP)
        supports: SUPPORT
