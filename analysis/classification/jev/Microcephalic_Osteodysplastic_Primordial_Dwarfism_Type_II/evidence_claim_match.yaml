      assertion_type: Pathophysiology
      assertion:
        name: Biallelic PCNT Loss of Function
        description: Biallelic nonsense, frameshift, splice-site, or small indel variants in PCNT (21q22.3)
          abolish production of functional pericentrin, an unusually large coiled-coil scaffold protein
          of the pericentriolar material. Sequence analysis detects the great majority of pathogenic alleles;
          missense variants are a minor contributor. Some individuals originally reported as having Seckel
          syndrome carry PCNT loss-of-function variants and are, on review, clinically compatible with
          MOPD II.
        biological_scale: MOLECULAR
        role: trigger
        genes:
        - preferred_term: PCNT
          term:
            id: hgnc:16068
            label: PCNT
        cellular_components:
        - preferred_term: pericentriolar material
          term:
            id: GO:0000242
            label: pericentriolar material
          modifier: ABNORMAL
      selected_evidence:
        snippet: Using genetic linkage analysis, we find that biallelic loss-of-function mutations in
          the centrosomal pericentrin (PCNT) gene on chromosome 21q22.3 cause microcephalic osteodysplastic
          primordial dwarfism type II (MOPD II) in 25 patients.
        supports: SUPPORT
    origin:
