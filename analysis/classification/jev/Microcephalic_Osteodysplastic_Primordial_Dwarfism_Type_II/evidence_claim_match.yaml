  c90d7d0b109a79fce94ecad66f13f8aa73c494e63c698d225ef3dd95c22fd29c:
    claim:
      about:
        disease:
          name: Microcephalic Osteodysplastic Primordial Dwarfism Type II
          disease_term:
            preferred_term: microcephalic osteodysplastic primordial dwarfism type II
            term:
              id: MONDO:0008872
              label: microcephalic osteodysplastic primordial dwarfism type II
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Progenitor Proliferation and Global Cell Number Deficit
        description: Impaired mitotic fidelity and checkpoint signaling reduce the proliferative output
          of rapidly dividing progenitor pools during embryonic and fetal development — neural progenitors
          in the cortical germinal zones, and growth plate chondrocytes and osteoblasts in the skeleton.
          Because the lesion is in a ubiquitously required mitotic apparatus rather than a tissue-restricted
          program, the deficit is global rather than organ-selective, which is what makes the resulting
          growth failure "primordial" (prenatal in onset and never caught up).
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        - preferred_term: radial glial cell
          term:
            id: CL:0000681
            label: radial glial cell
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: cell population proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
          modifier: DECREASED
        - preferred_term: cerebral cortex development
          term:
            id: GO:0021987
            label: cerebral cortex development
          modifier: ABNORMAL
        - preferred_term: skeletal system development
          term:
            id: GO:0001501
            label: skeletal system development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Adults with this rare inherited condition have an average height of 100 centimeters and
          a brain size comparable to that of a 3-month-old baby, but are of near-normal intelligence.
        supports: SUPPORT
    origin:
