      assertion_type: Pathophysiology
      assertion:
        name: Global Vasculopathy
        description: Beyond the growth deficit, MOPD II carries a distinctive systemic vasculopathy affecting
          the intracranial, coronary, renal, and external carotid circulations. Neurovascular disease
          (moyamoya vasculopathy and intracranial aneurysms) is the leading cause of premature death;
          moyamoya tends to present earlier than aneurysms, and aneurysm risk persists across the shortened
          lifespan. Hypertension, hypercholesterolemia, and premature coronary artery disease with myocardial
          infarction in young adults complete the picture. This is a parallel arm that is not fully explained
          by the proliferation deficit alone; the intervening cell biology is curated as an explicit knowledge
          gap rather than asserted.
        biological_scale: ORGANISM
        mechanism_confidence: PROVISIONAL
        cell_types:
        - preferred_term: vascular associated smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
      selected_evidence:
        snippet: It is now clear that vascular disease in MOPDII is global and screening of the cardiac
          and renal vessels is warranted along with close monitoring of blood pressure.
        supports: SUPPORT
