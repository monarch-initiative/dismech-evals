      assertion_type: Pathophysiology
      assertion:
        name: Insulin Resistance and Diabetes
        description: Severe insulin resistance and early-onset diabetes are common in PCNT deficiency
          but are not congenital — they emerge during childhood and adolescence. Pericentrin knockdown
          in adipocytes does not impair proximal insulin signaling but does impair insulin-stimulated
          glucose uptake in proportion to a defect in cell proliferation and adipogenesis, suggesting
          partial failure of adipocyte differentiation rather than a receptor-proximal signaling lesion.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Of 21 patients with genetic defects in PCNT, 18 had insulin resistance, which was severe
          in the majority of subjects.
        supports: SUPPORT
