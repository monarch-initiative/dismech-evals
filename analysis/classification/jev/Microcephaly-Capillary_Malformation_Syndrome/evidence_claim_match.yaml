          correlate of the region-selective cortical and hippocampal neuronal loss modelled in Amsh-deficient
          mice. It is the radiographic signature that separates MIC-CAP from a purely developmental (non-progressive)
          primary microcephaly, and it names the "Progressive Microcephaly and Cortical Atrophy" pathophysiology
          node. No frequency band is asserted: the quotable documentation covers two autopsied/imaged
          patients and no series reports a denominator for atrophy specifically.

          '
