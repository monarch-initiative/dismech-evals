  6a626463f0f469a80e123972db70c82e8e405a2a2c8bfc11a32e5024b0ffa33a:
    claim:
      about:
        disease:
          name: Microcephaly-Capillary Malformation Syndrome
          disease_term:
            preferred_term: microcephaly-capillary malformation syndrome
            term:
              id: MONDO:0013659
              label: microcephaly-capillary malformation syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: miccap_apoptosis_vs_proliferation_model_mismatch
        prompt: Is the primary cellular lesion of STAMBP deficiency apoptotic neuronal death (as in mouse)
          or failed neural progenitor proliferation (as in human organoids), and does the mouse under-represent
          the prenatal human corticogenesis defect?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Region-Selective Neuronal Apoptosis and Progressive Neuronal Loss
        - pathophysiology#Impaired Neural Stem and Progenitor Cell Proliferation
        rationale: 'Amsh-null mice are grossly normal at birth and develop apoptotic CA1 and cortical
          neuronal loss postnatally, whereas human STAMBP-knockout cortical organoids show reduced neural
          stem cell proliferation with explicitly no early apoptosis. Human infants are microcephalic
          at birth AND progressively so, which neither model captures alone. The mismatch is mechanistically
          meaningful because it determines the therapeutic window: a purely postnatal apoptotic mechanism
          would be tractable to postnatal intervention, while a prenatal proliferative deficit would not.'
        proposed_experiments:
        - experiment_id: miccap_exp_prenatal_proliferation_vs_apoptosis
          experiment_design: TARGETED_PERTURBATION
          name: Stage-matched proliferation-versus-apoptosis comparison across mouse and human models
          description: Quantify proliferation (Ki-67, phospho-histone H3, EdU) and apoptosis (cleaved
            caspase-3, TUNEL) markers in embryonic Stambp-null mouse cortex alongside stage-matched human
            STAMBP-knockout cortical organoids.
          decision_criterion: Concordant proliferation deficits with discordant apoptosis would confirm
            that the mouse under-represents the prenatal human proliferative arm.
        - experiment_id: miccap_exp_human_brain_aggregate_ihc
          name: Ubiquitin, p62 and TDP-43 immunohistochemistry on human MIC-CAP brain
          description: Perform ubiquitin-conjugate, p62/SQSTM1 and TDP-43 immunohistochemistry on archived
            human MIC-CAP autopsy brain tissue. This is the direct human test of the mouse aggregate findings
            and, to our knowledge, has never been reported.
          decision_criterion: Presence of ubiquitin-conjugate, p62 and TDP-43 aggregates in human cortical
            and hippocampal neurons would confirm that the mouse proteostasis mechanism operates in human
            disease.
        - experiment_id: miccap_exp_postnatal_aav_window
          name: Postnatal-only AAV9 Stambp delivery window test
          description: Test whether AAV9-Stambp delivery restricted to defined postnatal windows rescues
            brain size, or merely slows further loss, in the Stambp Sox1-cKO mouse.
          decision_criterion: Rescue of absolute brain size would indicate a postnatally tractable mechanism;
            arrest of further decline without size recovery would indicate a fixed prenatal deficit.
      selected_evidence:
        snippet: Furthermore, STAMBP disruption did not affect apoptosis in early cortical organoids.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36033615
      reference_title: Novel compound heterozygous mutation in STAMBP causes a neurodevelopmental disorder
