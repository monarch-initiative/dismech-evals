      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: 'MIC-CAP is autosomal recessive. Typically one pathogenic STAMBP variant is inherited
          from each parent, giving a 25% recurrence risk to sibs. In a minority of families both variants
          derive from one parent through uniparental isodisomy of chromosome 2, in which case the sib
          recurrence risk falls to under 1% - a distinction with substantial counseling consequences.
          Penetrance in biallelic individuals appears complete; expressivity is variable and tracks residual
          STAMBP protein level.

          '
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        penetrance: COMPLETE
        expressivity: VARIABLE
