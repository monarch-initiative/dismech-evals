        name: Ubiquitin-Conjugate Aggregation and Proteostatic Stress
        biological_scale: CELLULAR
        description: 'Undegraded K63-ubiquitinated substrates accumulate as cytoplasmic ubiquitin-conjugate
          aggregates. Patient-derived lymphoblastoid cell lines show elevated conjugated-ubiquitin aggregates
          with increased autophagosome content, and lentiviral STAMBP re-expression reverses the phenotype.
          In the Amsh-null mouse the aggregates begin as early as embryonic day 10 and become severe in
          the postnatal brain, and the co-accumulating species have been identified as TDP-43, p62/SQSTM1
          and glutamate receptors. Glutamate-receptor accumulation offers a direct, still-untested route
          from failed receptor downregulation to the excitation/inhibition imbalance underlying the epilepsy.

          '
        cellular_components:
        - preferred_term: inclusion body
