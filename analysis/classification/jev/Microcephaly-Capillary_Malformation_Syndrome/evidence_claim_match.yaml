      assertion_type: Treatment
      assertion:
        name: AAV9-Mediated STAMBP Gene Replacement (Preclinical)
        description: 'Neonatal AAV9-mediated brain-directed supplementation of Stambp significantly improved
          neurological defects, sustained growth and prolonged lifespan in a CNS-specific Stambp knockout
          mouse. This is the leading translational prospect for MIC-CAP and is unusually favourable on
          paper: the STAMBP coding sequence is small enough for AAV packaging, the CNS-restricted knockout
          phenocopies the global null (so brain-directed delivery may suffice), and the intervention worked
          postnatally. It remains mouse-only - there is no investigational new drug application, no clinical
          trial and no human data.

          '
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
        therapeutic_modality: GENE_THERAPY
      selected_evidence:
        snippet: Importantly, neonatal AAV9-mediated gene supplementation of Stambp in the brain could
          significantly improve neurological defects, sustain growth, and prolong the lifespan of StambpSox1-cKO
          mice.
        supports: SUPPORT
