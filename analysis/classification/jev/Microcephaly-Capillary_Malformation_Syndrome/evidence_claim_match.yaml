      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mtor_driven_capillary_malformation
        hypothesis_label: Constitutive PI3K-AKT-mTOR signaling drives the cutaneous capillary malformations
        status: ALTERNATIVE
        description: 'The discovery cohort found serum-insensitive RAS-MAPK and PI3K-AKT-mTOR activation
          in patient lymphoblastoid cell lines and proposed it as the link to the capillary malformations,
          by analogy with PIK3CA- and RASA1-related vascular anomalies. A later patient homozygous for
          p.Ser236Phe had multiple capillary malformations without detectable PI3K-AKT-mTOR activation,
          so either the capillary-malformation mechanism is mTOR-independent, or the lymphoblastoid readout
          does not reflect endothelial biology. No endothelial or skin-biopsy signaling study has been
          published in MIC-CAP.

          '
      selected_evidence:
        snippet: The latter cellular phenotype is notable considering the established connection between
          these pathways and their association with vascular and capillary malformations.
        supports: SUPPORT
