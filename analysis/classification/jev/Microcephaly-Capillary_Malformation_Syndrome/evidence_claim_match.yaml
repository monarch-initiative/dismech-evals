      assertion_type: Pathophysiology
      assertion:
        name: Dermal Capillary Malformation
        biological_scale: TISSUE
        description: 'Multiple small, pink-to-red, blanchable, roughly oval or circular capillary malformations
          are distributed generally and randomly over the body - a few to hundreds, ranging from 1-2 mm
          to several centimetres. They are present at birth, are not segmental or dermatomal (distinguishing
          them from the V1 trigeminal port-wine stain of Sturge-Weber syndrome), and carry none of the
          leptomeningeal-angiomatosis or glaucoma risk of that disorder. Skin biopsy confirms their nature
          histologically - dilated small-caliber vessels in the papillary dermis - but the proposed signaling
          substrate, capillary endothelium responding to the dysregulated RAS-MAPK and PI3K-AKT-mTOR activity
          described above, has never been assayed in MIC-CAP lesional skin.

          '
        cell_types:
        - preferred_term: capillary endothelial cell
          term:
            id: CL:0002144
            label: capillary endothelial cell
        biological_processes:
