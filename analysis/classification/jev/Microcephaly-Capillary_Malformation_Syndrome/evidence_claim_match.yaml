              label: microcephaly-capillary malformation syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: STAMBP
        notes: 'STAMBP (2p13.1) encodes the 424-residue STAM-binding protein / AMSH, a Zn(2+)-dependent
          JAMM/MPN+ metalloprotease deubiquitinase specific for Lys63-linked polyubiquitin. Biallelic
          loss-of-function variants - homozygous or compound heterozygous - are necessary and sufficient
          for MIC-CAP. The reported allele spectrum is dominated by truncating and splice-disrupting variants,
          with a minority of missense alleles that cluster in the N-terminal MIT domain and the SH3-binding
          motif rather than in the catalytic JAMM domain. Recurrent alleles include p.Arg38Cys and p.Arg424*;
          a deep-intronic leaky splice allele (c.1005+358A>G) is associated with a markedly attenuated
          phenotype and is invisible to exome sequencing. Heterozygous carriers are asymptomatic; no gain-of-function
          or dominant-negative mechanism is known.

          '
        gene_term:
          preferred_term: STAMBP
          term:
            id: hgnc:16950
            label: STAMBP
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: We used whole-exome sequencing of five patients with MIC-CAP syndrome and identified
          recessive mutations in STAMBP
        supports: SUPPORT
