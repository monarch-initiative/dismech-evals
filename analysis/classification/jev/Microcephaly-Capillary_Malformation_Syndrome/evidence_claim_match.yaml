      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neural Stem and Progenitor Cell Proliferation
        biological_scale: CELLULAR
        description: 'A developmental arm that operates before birth and is distinct from the postnatal
          degenerative arm. Human STAMBP-knockout cortical organoids show significantly reduced neural
          stem cell proliferation and are smaller, with no detectable increase in apoptosis at early stages;
          re-expression of wild-type STAMBP rescues proliferation while the disease alleles p.Gly307Glu
          and p.Thr313Ile do not. Independently, neural progenitor cells derived from STAMBP-deficient
          human embryonic stem cells cannot be maintained long term, with downregulation of the anti-apoptotic
          protein CFLAR as the identified effector and CFLAR re-expression rescuing the defect. Together
          these explain why the brain is already small at birth.

          '
        cell_types:
        - preferred_term: neural stem cell
