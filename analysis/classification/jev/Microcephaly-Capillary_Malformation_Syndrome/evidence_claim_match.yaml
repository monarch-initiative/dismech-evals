          by apoptosis, while cerebellar neurons, thymocytes and fibroblasts are spared - a cell-autonomous,
          region-restricted survival requirement that is the most distinctive cellular phenotype of AMSH
          deficiency and matches the human neuropathology of disproportionately small cerebral hemispheres
          with a relatively preserved cerebellum. This postnatal degenerative arm explains the *progressive*
          component of the microcephaly and the cortical atrophy, in contrast with the prenatal proliferation
          arm that sets brain size at birth.

          '
