        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of ESCRT-Dependent Endosomal Sorting of Ubiquitinated Cargo
        biological_scale: CELLULAR
        description: 'AMSH is recruited to the ESCRT-0 complex through the interaction of its SH3-binding
          motif with the SH3 domain of STAM, and to ESCRT-III through its MIT domain. There it removes
          K63-linked chains from internalized, ubiquitin-tagged cell-surface receptors as they are handed
          down the ESCRT chain into intraluminal vesicles of the multivesicular body. Loss of AMSH leaves
          K63-ubiquitinated cargo mis-sorted: receptors are neither properly committed to lysosomal degradation
          nor cleanly recycled, and ubiquitin is not recovered. This is the proximal convergence node
          from which the proteostasis, signaling, progenitor and inflammatory arms of the disease all
          branch.

          '
        cellular_components:
        - preferred_term: ESCRT-0 complex
          term:
            id: GO:0033565
            label: ESCRT-0 complex
        - preferred_term: early endosome
          term:
            id: GO:0005769
            label: early endosome
        - preferred_term: multivesicular body
          term:
            id: GO:0005771
            label: multivesicular body
        biological_processes:
        - preferred_term: multivesicular body sorting pathway
          term:
            id: GO:0071985
            label: multivesicular body sorting pathway
          modifier: ABNORMAL
        - preferred_term: endosome transport via multivesicular body sorting pathway
          term:
            id: GO:0032509
            label: endosome transport via multivesicular body sorting pathway
          modifier: ABNORMAL
        - preferred_term: ubiquitin-dependent protein catabolic process via the multivesicular body sorting
            pathway
          term:
            id: GO:0043162
            label: ubiquitin-dependent protein catabolic process via the multivesicular body sorting pathway
          modifier: DECREASED
      selected_evidence:
        snippet: AMSH, a deubiquitinating enzyme (DUB) with exquisite specificity for Lys63-linked polyubiquitin
          chains, is an endosome-associated DUB that regulates sorting of activated cell-surface signaling
          receptors to the lysosome, a process mediated by the members of the endosomal sorting complexes
          required for transport (ESCRT) machinery.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
