        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of STAMBP/AMSH K63-Linked Deubiquitinase Activity
        biological_scale: MOLECULAR
        description: 'Biallelic loss-of-function STAMBP variants abolish or severely reduce the activity
          of AMSH, a Zn(2+)-dependent JAMM/MPN+ metalloprotease deubiquitinase with strict specificity
          for Lys63-linked polyubiquitin chains. Two routes to loss of function are documented: (i) protein
          destabilization and near-absence of AMSH, the dominant route, seen with truncating alleles and
          with missense alleles in the SH3-binding motif (e.g. p.Ser236Phe) that block STAM binding and
          thereby destabilize the protein; and (ii) direct catalytic or substrate-binding impairment,
          exemplified by the JAMM-domain allele p.Thr313Ile. Enzyme regulation is itself relevant: the
          N-terminal MIT domain clamps the catalytic domain in an autoinhibited state that STAM1 binding
          relieves, which explains why MIT-domain and SH3-binding-motif missense variants - not just catalytic-site
          variants - are pathogenic.

          '
        genes:
        - preferred_term: STAMBP
          term:
            id: hgnc:16950
            label: STAMBP
        molecular_functions:
        - preferred_term: K63-linked deubiquitinase activity
          term:
            id: GO:0061578
            label: K63-linked deubiquitinase activity
          modifier: DECREASED
        - preferred_term: cysteine-type deubiquitinase activity
          term:
            id: GO:0004843
            label: cysteine-type deubiquitinase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: protein K63-linked deubiquitination
          term:
            id: GO:0070536
            label: protein K63-linked deubiquitination
          modifier: DECREASED
        - preferred_term: protein deubiquitination
          term:
            id: GO:0016579
            label: protein deubiquitination
          modifier: DECREASED
      selected_evidence:
        snippet: We used whole-exome sequencing of five patients with MIC-CAP syndrome and identified
          recessive mutations in STAMBP, a gene encoding the deubiquitinating (DUB) isopeptidase STAMBP
          (STAM-binding protein, also known as AMSH, associated molecule with the SH3 domain of STAM)
          that has a key role in cell surface receptor-mediated endocytosis and sorting.
        supports: SUPPORT
    origin:
