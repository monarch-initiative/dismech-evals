          on molecular genetic testing. Exome sequencing is the usual route; note that the deep-intronic
          leaky splice allele c.1005+358A>G is invisible to exome sequencing, so genome sequencing or
          RNA studies may be required in a clinically compatible exome-negative proband. Chromosomal microarray
          has been normal in the reported patients in whom it was performed and has no established yield
          in this disorder.

          '
