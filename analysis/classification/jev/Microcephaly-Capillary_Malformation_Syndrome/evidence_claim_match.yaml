          else runs in the opposite direction: MCAP is a sporadic somatic mosaic activating PIK3CA disorder
          with megalencephaly, segmental overgrowth and polymicrogyria, whereas MIC-CAP is a germline
          biallelic loss-of-function STAMBP deubiquitinase defect with microcephaly and progressive cortical
          atrophy. MCAP additionally has a targeted therapy (alpelisib) that has no rationale in MIC-CAP.

          '
        disease_term:
