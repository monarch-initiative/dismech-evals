  35067469fc8135870f0cf3ce22d98f6528c7726d35d990bb4f603ee4566f5e92:
    claim:
      about:
        disease:
          name: Microcephaly-Capillary Malformation Syndrome
          disease_term:
            preferred_term: microcephaly-capillary malformation syndrome
            term:
              id: MONDO:0013659
              label: microcephaly-capillary malformation syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: miccap_capillary_malformation_mechanism_gap
        prompt: What actually causes the cutaneous capillary malformations, given that at least one patient
          had them without PI3K-AKT-mTOR activation?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Constitutive Serum-Insensitive RAS-MAPK and PI3K-AKT-mTOR Signaling
        - pathophysiology#Dermal Capillary Malformation
        rationale: The mTOR/MAPK hypothesis rests entirely on patient lymphoblastoid cell lines, which
          are not endothelium. A patient homozygous for p.Ser236Phe had multiple capillary malformations
          without detectable PI3K-AKT-mTOR activation, so either the mechanism is pathway-independent
          or the lymphoblastoid readout is uninformative about endothelial biology. Lesional skin has
          been biopsied and described histologically (dilated small-caliber papillary-dermal vessels),
          but no endothelial signaling study - phospho-S6, phospho-ERK or equivalent - has ever been performed
          on that tissue, despite the lesions being trivially accessible.
        proposed_experiments:
        - experiment_id: miccap_exp_cm_endothelial_signaling_ihc
          name: Endothelial signaling immunohistochemistry on MIC-CAP capillary malformations
          description: Biopsy MIC-CAP cutaneous capillary malformations and stain for endothelial phospho-S6
            and phospho-ERK against matched control skin and, ideally, against PIK3CA-related capillary
            malformation tissue.
          decision_criterion: Elevated endothelial phospho-S6/phospho-ERK in lesional skin would support
            the mTOR/MAPK hypothesis in the tissue that actually matters; normal staining would refute
            it.
        - experiment_id: miccap_exp_endothelial_conditional_ko
          experiment_design: TARGETED_PERTURBATION
          name: Endothelial-specific Stambp conditional knockout
          description: Generate an endothelium-restricted Stambp conditional knockout mouse to test whether
            capillary malformations arise cell-autonomously in endothelium.
          decision_criterion: Development of cutaneous capillary malformations in the absence of a CNS
            phenotype would establish endothelial cell autonomy.
      selected_evidence:
        snippet: suggesting that it is not the major pathomechanism underlying the disorder in this patient
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29907875
      reference_title: A novel homozygous missense mutation in the SH3-binding motif of STAMBP causing
        microcephaly-capillary malformation syndrome.
      evidence_source: IN_VITRO
      explanation: The authors' explicit rejection of mTOR activation as the mechanism in their patient,
        who nonetheless had capillary malformations.
