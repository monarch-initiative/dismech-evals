        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NLRP3 Inflammasome Derepression and Neuroinflammation
        biological_scale: CELLULAR
        description: 'A proposed inflammatory arm. STAMBP is a negative regulator of the NLRP3 inflammasome,
          restraining it by removing K63-linked (non-degradative) polyubiquitin from NLRP3; STAMBP depletion
          in monocytes increases NLRP3 K63 polyubiquitination, inflammasome activation and IL-1beta release.
          The CNS-conditional Stambp knockout mouse shows massive neuroinflammation accompanying neuronal
          death. No patient-level inflammasome or IL-1beta data exist, so this arm is hypothesized rather
          than established in human MIC-CAP - but it is the disease''s most tractable drug-repurposing
          hypothesis.

          '
        cell_types:
        - preferred_term: microglial cell
          term:
            id: CL:0000129
            label: microglial cell
        cellular_components:
        - preferred_term: NLRP3 inflammasome complex
          term:
            id: GO:0072559
            label: NLRP3 inflammasome complex
        biological_processes:
        - preferred_term: interleukin-1 beta production
          term:
            id: GO:0032611
            label: interleukin-1 beta production
          modifier: INCREASED
        - preferred_term: microglial cell activation
          term:
            id: GO:0001774
            label: microglial cell activation
          modifier: INCREASED
        - preferred_term: neuroinflammatory response
          term:
            id: GO:0150076
            label: neuroinflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: While STAMBP does not modulate NLRP3 protein abundance, cellular depletion of the deubiquitinase
          increased NLRP3 K63 chain polyubiquitination resulting in increased NLRP3 inflammasome activation.
        supports: SUPPORT
