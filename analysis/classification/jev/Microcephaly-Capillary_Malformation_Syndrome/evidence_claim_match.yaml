            term:
              id: MONDO:0013659
              label: microcephaly-capillary malformation syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: miccap_natural_history_and_qol_gap
        prompt: What is the actual natural history, survival distribution, and caregiver/ patient quality-of-life
          burden of MIC-CAP?
        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: With roughly 25-30 molecularly confirmed individuals reported worldwide there is no
          registry, no natural-history study, no survival curve, and no validated quality-of-life or caregiver-burden
          instrument has ever been administered. Life expectancy is described only as "shortened", with
          the oldest known living individual reported at 12 years. Prognostic counseling is therefore
          anecdote-based.
        proposed_experiments:
        - experiment_id: miccap_exp_international_registry
          experiment_design: HUMAN_OBSERVATIONAL
          name: International STAMBP patient registry with longitudinal phenotyping
          description: Establish a registry capturing standardized longitudinal phenotyping, seizure burden,
            feeding status, growth and survival across all molecularly confirmed STAMBP patients.
          decision_criterion: A cohort large enough to compute a survival distribution and to stratify
            outcome by variant class.
        - experiment_id: miccap_exp_qol_instruments
          name: Quality-of-life and caregiver-burden instrument administration
          description: Administer CPCHILD or PedsQL together with a validated caregiver-burden instrument
            across the reported MIC-CAP cohort, none of which has ever been done.
          decision_criterion: Any validated instrument data would replace the current inference-only quality-of-life
            assessment.
        - experiment_id: miccap_exp_protein_level_prognostic
          name: STAMBP protein level as a prognostic biomarker
          description: Test whether residual STAMBP protein level quantified on immunoblot from patient-derived
            cells predicts motor and language outcome, as the leaky splice-allele homozygote suggests.
          decision_criterion: A monotonic relationship between residual protein level and functional outcome
            would establish the first prognostic biomarker for the disease.
      selected_evidence:
        snippet: Currently, there is little published information about the natural history and long-term
          outcomes for individuals with MIC-CAP.
        supports: SUPPORT
    origin:
