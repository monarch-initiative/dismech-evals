        distinguishing_features:
        - Megalencephaly (brain and head overgrowth) rather than microcephaly
        - Somatic mosaic gain-of-function PIK3CA rather than germline biallelic loss-of-function STAMBP
        - Sporadic/mosaic rather than autosomal recessive
        - Asymmetric segmental overgrowth of limbs, trunk and face
        - Polymicrogyria, ventriculomegaly, thick corpus callosum and cerebellar tonsillar ectopia
        - No hypoplastic distal phalanges
        - Targeted therapy with the PI3K-alpha inhibitor alpelisib is approved for PROS and has no rationale
