        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: miccap_il1_blockade_repurposing
        prompt: Would IL-1beta blockade modify the epileptic encephalopathy of MIC-CAP, given that STAMBP
          restrains the NLRP3 inflammasome and the mouse shows massive neuroinflammation?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#NLRP3 Inflammasome Derepression and Neuroinflammation
        rationale: 'AMSH restrains NLRP3 by exactly the K63-linked deubiquitination chemistry it is specialized
          for, and the CNS-conditional Stambp knockout shows massive neuroinflammation. IL-1 blockade
          with anakinra is already used in other refractory epilepsy syndromes, making this the most tractable
          repurposing hypothesis in the disease. It is entirely untested: the inflammasome work was done
          in monocytes with no patient or neural data.'
        proposed_experiments:
        - experiment_id: miccap_exp_neural_inflammasome_readout
          experiment_design: TARGETED_PERTURBATION
          name: Inflammasome and IL-1beta quantification in STAMBP-deficient neural tissue
          description: Measure NLRP3 K63-ubiquitination, inflammasome assembly and IL-1beta release in
            Stambp-knockout mouse brain and in patient-derived microglia-like cells, extending the monocyte
            finding to neural context.
          decision_criterion: Elevated NLRP3 K63-ubiquitination and IL-1beta in STAMBP-deficient neural
            cells would establish the arm as neural-relevant rather than monocyte-specific.
        - experiment_id: miccap_exp_il1_blockade_mouse
          name: IL-1 receptor blockade trial in the Stambp Sox1-cKO mouse
          description: Test whether IL-1 receptor blockade (e.g. anakinra) reduces seizure burden, neuroinflammation
            or preweaning mortality in the CNS-conditional Stambp knockout mouse.
          decision_criterion: A significant improvement in survival or seizure burden would justify considering
            IL-1 blockade as a repurposing candidate in human MIC-CAP.
      selected_evidence:
        snippet: STAMBP knockout directly increased release of IL-1beta with TLR ligation
        supports: SUPPORT
