      assertion_type: HarrisonsChapterAssignment
      assertion:
        classification_value: NEUROLOGIC
        notes: 'Primary clinical home. Although MIC-CAP is a multisystem neurocutaneous syndrome, the
          burden of disease, the surveillance plan and essentially all management are neurologic: a developmental
          and epileptic encephalopathy with progressive microcephaly, cortical atrophy, spastic tetraparesis
          and profound developmental delay. The cutaneous capillary malformations are diagnostically decisive
          but clinically inert.'
      selected_evidence:
        snippet: Microcephaly-capillary malformation (MIC-CAP) syndrome is characterized by severe microcephaly
          with progressive cortical atrophy, intractable epilepsy, profound developmental delay and multiple
          small capillary malformations on the skin.
        supports: SUPPORT
