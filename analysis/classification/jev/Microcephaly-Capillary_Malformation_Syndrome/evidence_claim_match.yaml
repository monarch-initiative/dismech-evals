          term:
            id: GO:0001525
            label: angiogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: generalized cutaneous capillary malformations (a few to hundreds of oval/circular macules
          or patches varying in size from 1-2 mm to several cm)
        supports: SUPPORT
