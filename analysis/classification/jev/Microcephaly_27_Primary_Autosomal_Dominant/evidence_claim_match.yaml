      assertion_type: Pathophysiology
      assertion:
        name: Neural Progenitor Nuclear Fragility and Cell Death
        description: The reporting authors propose that LMNB2 variants alter the physical properties of
          lamin filaments, making the nuclei of neural progenitors fragile under the mechanical stresses
          of interkinetic nuclear migration and neuronal migration and increasing cell death during brain
          development. The proposal rests on the analogous LMNA variant producing fragile nuclei; increased
          apoptosis in the cortex has been observed in lamin B2-null mouse embryos, but not with the human
          variants.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: interkinetic nuclear migration
          term:
            id: GO:0022027
            label: interkinetic nuclear migration
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Such fragility in neuronal precursors would enhance susceptibility to mechanical stresses
          of interkinetic nuclear migration and neuronal migration and lead to increased cell death during
          brain development.
        supports: SUPPORT
        directness: INDIRECT
