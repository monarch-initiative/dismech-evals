            term:
              id: MONDO:0030929
              label: microcephaly 27, primary, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: LMNB2 Rod-Domain Missense Variant Disrupting Lamin B2 Dimer Assembly
        description: 'Heterozygous missense variants alter conserved residues in coiled-coil segments
          of the lamin B2 alpha-helical rod: Asn54 at the coil 1A intradimer interface and Glu398 at the
          coil 2B intradimer interface. Glu398 normally repels the Glu398 of the partner chain; the p.Glu398Lys
          substitution is predicted by structural modeling on lamin A/C structures to aberrantly stabilize
          mixed mutant/wild-type dimers. The variants are proposed to act dominantly on assembly of the
          lamin B2 filament that forms part of the nuclear lamina, rather than by haploinsufficiency.'
        biological_scale: MOLECULAR
        genetic_context:
          functional_impact_category: DOMINANT_NEGATIVE
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          allele_type: missense
          description: Recurrent de novo missense variants at specific residues and the absence of truncating
            variants led the reporting authors to favor a dominant negative mechanism (with gain of function
            not excluded) over haploinsufficiency. This is an inference from the variant spectrum and
            structural modeling, not a measured effect on endogenous lamin B2.
        genes:
        - preferred_term: LMNB2
          term:
            id: hgnc:6638
            label: LMNB2
        molecular_functions:
        - preferred_term: structural constituent of nuclear lamina
          term:
            id: GO:0160123
            label: structural constituent of nuclear lamina
          modifier: DYSREGULATED
        cellular_components:
        - preferred_term: nuclear lamina
          term:
            id: GO:0005652
            label: nuclear lamina
        - preferred_term: lamin filament
          term:
            id: GO:0005638
            label: lamin filament
      selected_evidence:
        snippet: The pathogenic variants reported here are most likely dominant negative rather than haploinsufficient
          given that microcephaly is not present in the Lmnb1+/- mouse.
        supports: SUPPORT
        directness: INDIRECT
