        prompt: Do the brain phenotypes of lamin B2-null mice, which center on neuronal migration, tell
          us anything about how heterozygous dominant LMNB2 missense variants cause microcephaly without
          a migration defect?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Neural Progenitor Spindle Misorientation
        - pathophysiology#Neural Progenitor Nuclear Fragility and Cell Death
        - pathophysiology#Reduced Cortical Neuron Output
        rationale: Every mechanistic step below the lamina defect is supported only by null or double-null
          mice. Those mice show cortical layering and migration defects, and the constitutive Lmnb2 null
          has a nearly normal brain size, while patients with MCPH27 have severe congenital microcephaly
          with no migration defect. The reporting authors attribute the difference to the human variants
          acting dominantly rather than through loss of lamin B2. No heterozygous knock-in of a patient
          variant and no patient-derived neural cell or organoid model has been reported, so which of
          the proposed progenitor mechanisms operates in MCPH27 is unknown.
      selected_evidence:
        snippet: there were neuronal migration defects resulting in abnormal layering of the cerebral
          cortex,18 suggesting potential discordance with the human phenotype and neuroimaging findings
        supports: SUPPORT
