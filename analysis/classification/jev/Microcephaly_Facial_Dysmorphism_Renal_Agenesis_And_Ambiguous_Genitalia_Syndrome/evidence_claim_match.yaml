      assertion:
        name: Loss of Cytosolic tRNA Wobble Uridine 2-Thiolation
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'The wobble uridine of cytosolic tRNA-Lys(UUU), tRNA-Glu(UUC) and tRNA-Gln(UUG) normally
          carries mcm5s2U: a 5-methoxycarbonylmethyl group added by Elongator and ALKBH8, and a 2-thio
          group added by CTU1-CTU2. Cells from patients with each tested CTU2 allele, including the founder
          allele, lack the 2-thio group on all thiol-containing tRNAs.'
        biological_processes:
        - preferred_term: tRNA wobble position uridine thiolation
          term:
            id: GO:0002143
            label: tRNA wobble position uridine thiolation
          modifier: DECREASED
      selected_evidence:
        snippet: Functional characterization using patient-derived cells for each of these alleles, as
          well as the original founder allele; revealed a specific impairment of wobble uridine thiolation
          in all known thiol-containing tRNAs.
        supports: SUPPORT
        directness: DIRECT
