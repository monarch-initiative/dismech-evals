              id: MONDO:0020647
              label: microcephaly, facial dysmorphism, renal agenesis, and ambiguous genitalia syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: CTU2
        gene_term:
          preferred_term: CTU2
          term:
            id: hgnc:28005
            label: CTU2
        relationship_type: CAUSATIVE
        notes: 'At least seven alleles are reported: the founder splice variant c.873G>A, further truncating
          and splice variants, and the missense alleles p.Leu63Pro and p.Arg467Cys. A 2026 report of compound
          heterozygous missense variants in an individual with renal-predominant congenital anomalies
          of the kidney and urinary tract (CAKUT), without the multisystem phenotype, suggests that residual
          function may yield milder disease; its authors state this does not establish CTU2 as a cause
          of isolated CAKUT.'
        variants:
        - name: c.873G>A (p.Thr247Alafs*21)
          description: Founder splice variant in Saudi Arabian and Emirati families. It leaves the codon
            unchanged but destroys the exon 8 donor site, causing frameshift and truncation. Because it
            looks synonymous it is easily filtered out.
      selected_evidence:
        snippet: In this study, we describe five new patients with DREAM-PL phenotype and whose molecular
          analysis expands the allelic heterogeneity of the syndrome to five different alleles; four of
          which predict protein truncation.
        supports: SUPPORT
        directness: DIRECT
