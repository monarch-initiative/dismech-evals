      assertion:
        name: Impaired Translational Decoding at Lys Glu and Gln Codons
        biological_scale: CELLULAR
        role: central_effector
        mechanism_confidence: PROVISIONAL
        description: The 2-thio group restricts wobble pairing and strengthens codon-anticodon interaction
          for the split codon boxes read by these three tRNAs. In fission yeast and nematodes, loss of
          Ctu1-Ctu2 causes misreading and frameshifting, genome instability and abnormal development,
          and over-expressing the hypomodified tRNAs suppresses the yeast defects. PROVISIONAL because
          no study has measured translation in CTU2-deficient human cells or tissues; the original authors
          name translational efficiency and fidelity as the candidate mechanism, not a demonstrated one.
        biological_processes:
        - preferred_term: translation
          term:
            id: GO:0006412
            label: translation
          modifier: ABNORMAL
      selected_evidence:
        snippet: In both species, inactivation of the complex leads to loss of thiolation on tRNAs and
          to a thermosensitive decrease of viability associated with marked ploidy abnormalities and aberrant
          development.
        supports: SUPPORT
        directness: INDIRECT
    origin:
