          modifier: DECREASED
      selected_evidence:
        snippet: This modification is catalyzed by a highly conserved CTU1/CTU2 complex, disruption of
          which has been shown to cause abnormal phenotypes in yeast, worms, and plants.
        supports: SUPPORT
        directness: DIRECT
