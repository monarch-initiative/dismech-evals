        mechanism_confidence: HYPOTHETICAL
        description: The developmental pattern - small brain with cortical and callosal malformation,
          absent or malformed kidney, under-masculinised external genitalia, heart defects and limb anomalies
          - points to a defect during organogenesis. Why these organs are affected, and not others, is
          unexplained. Knockdown of the partner subunit ctu1 in zebrafish impairs angiogenesis and embryonic
          development, and is the nearest vertebrate model; no CTU2 animal model has been reported. HYPOTHETICAL
          because the link from the tRNA defect to any specific organ malformation has not been studied.
        biological_processes:
