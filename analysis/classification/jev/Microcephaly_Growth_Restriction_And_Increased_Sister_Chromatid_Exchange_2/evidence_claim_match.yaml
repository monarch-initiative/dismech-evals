        - phenotypes#Dilated cardiomyopathy
        - phenotypes#Hypertrophic cardiomyopathy
        - phenotypes#Mitochondrial DNA depletion in muscle
        - phenotypes#Hepatomegaly
        prompt: Do all children with TOP3A Bloom-like disease have impaired mitochondrial DNA maintenance,
          and does it cause their cardiomyopathy?
        rationale: TOP3A also has a mitochondrial isoform needed to separate replicated mtDNA. Cardiomyopathy
          is not a Bloom syndrome feature. It occurred in several TOP3A children, and one had 87% muscle
          mtDNA depletion. Two Bloom-like alleles only partially rescued mtDNA loss in cells, and patient-derived
          cells from a later family had a respiration defect that a missense allele failed to rescue.
          Muscle mtDNA was measured in only one index patient, and no study has measured mtDNA in the
          heart of a Bloom-like patient. The pathograph therefore has no mitochondrial node. These phenotypes
          are left unconnected until mtDNA maintenance is shown to fail in every case, or the cardiomyopathy
          is shown to follow from it.
      selected_evidence:
        snippet: In contrast, reduced mitochondrial ATP generation and oxygen consumption rates observed
          in TOP3A defective cells were rescued by over-expression of the wildtype TOP3A, but not TOP3A-D479G.
        supports: SUPPORT
