              id: MONDO:0000208
              label: microcephaly, short stature, and impaired glucose metabolism 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Coordinated mRNA m6A Dysregulation via the FTO Axis
        description: Beyond its catalytic role on tRNA, TRMT10A physically interacts with the mRNA demethylase
          FTO. Ablating TRMT10A therefore raises m6A on a shared set of mRNAs, which are then destabilized
          through the m6A reader YTHDF2. The affected transcripts are enriched for codons read by the
          very tRNAs that carry m1G9 (tRNA-Gln(TTG), tRNA-Arg(CCG), tRNA-Thr(CGT)), coupling the tRNA
          and mRNA arms of the lesion. This is a parallel, non-catalytic route by which TRMT10A loss perturbs
          gene expression, and it is why the disorder is not fully explained by tRNA methylation alone.
        role: modifier
        biological_scale: MOLECULAR
        genes:
        - preferred_term: FTO
          term:
            id: hgnc:24678
            label: FTO
        biological_processes:
        - preferred_term: mRNA catabolic process
          term:
            id: GO:0006402
            label: mRNA catabolic process
          modifier: INCREASED
      selected_evidence:
        snippet: Here, we show that a tRNA methyltransferase, TRMT10A, interacts with an mRNA demethylase
          FTO (ALKBH9), both in vitro and inside cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
