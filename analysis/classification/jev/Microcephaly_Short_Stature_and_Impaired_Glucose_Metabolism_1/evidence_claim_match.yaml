            term:
              id: MONDO:0000208
              label: microcephaly, short stature, and impaired glucose metabolism 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: insulin_resistance_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What causes the peripheral insulin resistance in TRMT10A deficiency, and is it a distinct
          mechanism from beta-cell loss?
        attaches_to:
        - pathophysiology#Peripheral Insulin Resistance
        rationale: The established mechanism — tRNA hypomethylation, tRNA-Gln fragmentation, beta-cell
          apoptosis — predicts insulin deficiency, not insulin resistance. Yet marked insulin resistance
          is documented in at least two independent reports, one by formal oral glucose tolerance testing
          with Matsuda index and one clinically with a striking metformin response. Neither report offers
          a mechanism. Candidate explanations include a direct effect of TRMT10A loss on translation in
          insulin-target tissues (muscle, liver, adipose), a consequence of the body-composition phenotype
          suggested by the dorsocervical fat pad and central obesity, or the mRNA m6A/FTO arm of TRMT10A
          function — FTO being itself a well-known obesity and insulin-sensitivity locus, which makes
          this the most testable of the three. The gap is clinically live because it determines whether
          metformin should be tried before insulin.
        proposed_experiments:
        - experiment_id: tissue_specific_trmt10a_deletion
          name: Tissue-specific Trmt10a deletion in insulin-target tissues
          description: Generate muscle-, liver- and adipose-specific Trmt10a knockouts and measure insulin
            sensitivity by hyperinsulinaemic-euglycaemic clamp. A tissue in which deletion alone produces
            resistance would establish a cell-autonomous route independent of beta-cell loss.
        - experiment_id: fto_m6a_insulin_signalling_test
          name: Test whether the FTO-m6A arm mediates the resistance
          description: In TRMT10A-null human myotubes and adipocytes, map m6A changes and transcript stability
            for insulin-signalling components, and test whether restoring FTO activity or a catalytically
            dead TRMT10A that retains FTO binding rescues insulin signalling. This separates the catalytic
            tRNA arm from the non-catalytic FTO arm of TRMT10A function.
      selected_evidence:
        snippet: Diabetes was diagnosed while the subjects were in their 20s and was characterized by
          insulin resistance.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26526202
