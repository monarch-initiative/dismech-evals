  79e367be677d0071bf2d6eda760bfc4bba56b00627828bdf9aeea567b1ba9387:
    claim:
      about:
        disease:
          name: Microcephaly, Short Stature, and Impaired Glucose Metabolism 1
          disease_term:
            preferred_term: microcephaly, short stature, and impaired glucose metabolism 1
            term:
              id: MONDO:0000208
              label: microcephaly, short stature, and impaired glucose metabolism 1
        context: []
      assertion_type: Genetic
      assertion:
        name: TRMT10A
        gene_term:
          preferred_term: TRMT10A
          term:
            id: hgnc:28403
            label: TRMT10A
        relationship_type: CAUSATIVE
        notes: 'Every reported pathogenic allele is private or population-specific; no recurrent global
          founder variant exists, and nearly all published kindreds are consanguineous. Alleles span the
          full loss-of-function spectrum — nonsense, canonical splice-acceptor, whole-locus deletion —
          plus one catalytically dead missense variant. Because a contiguous gene deletion has caused
          the syndrome, copy-number analysis is warranted when sequencing is negative in a compatible
          phenotype.

          Population constraint corroborates the recessive mechanism rather than merely being consistent
          with it: TRMT10A (ENSG00000145331) is entirely tolerant of heterozygous loss of function in
          gnomAD — pLI 3.2e-12, observed/expected LoF 0.917 with a 90% upper bound (LOEUF) of 1.21, i.e.
          the observed rate of LoF variation in the population is what you would expect if there were
          no selection against it at all. So haploinsufficiency is not a disease mechanism here, which
          is why the unaffected heterozygous parents in every reported pedigree are the expected result
          and not a puzzle. Retrieved from the gnomAD API and recorded as a database observation; it carries
          no evidence block because it is not a literature claim with a quotable sentence.'
        variants:
        - name: p.Arg127Ter
          description: The first-reported disease allele, homozygous in a large consanguineous Moroccan
            family with three affected siblings. Neither TRMT10A mRNA nor protein was detectable in patient
            lymphoblasts, indicating nonsense-mediated decay and complete loss of the gene product. Also
            reported homozygously in a patient with GH deficiency and primary ovarian failure.
          clinical_significance: PATHOGENIC
        - name: p.Gly206Arg (c.616G>A)
          description: 'Homozygous missense allele in a consanguineous Uzbek Jewish family with three
            affected siblings, and independently in a girl with hypoplastic kidneys. Uniquely informative
            mechanistically: the variant enzyme binds tRNA normally but retains under 0.1% of wild-type
            methylation activity, attributed to defective S-adenosylmethionine binding. It is therefore
            a catalytically dead allele rather than a folding or substrate-recognition defect.'
          clinical_significance: PATHOGENIC
        - name: p.Glu27Ter (c.79G>T)
          description: 'Homozygous nonsense allele in two siblings who represent the mild end of the spectrum:
            diabetes diagnosed in their twenties, mild microcephaly at birth with normal final head circumference,
            and mild learning disability with epilepsy as the only other features. Notable that a truncating
            allele this proximal produces a milder clinical course than p.Gly206Arg, arguing against a
            simple allele-severity gradient.'
          clinical_significance: PATHOGENIC
        - name: p.Arg93Ter (c.277C>T) / p.Arg133Ter (c.397C>T)
          description: Compound heterozygous nonsense alleles in non-consanguineous siblings with microcephaly,
            developmental delay and periventricular white matter hyperintensities but no documented dysglycaemia
            at ages 10 and 12 — the first indication that the neurodevelopmental phenotype can present
            without the metabolic one.
          clinical_significance: PATHOGENIC
        - name: c.496-1G>A
          description: Homozygous canonical splice-acceptor variant in the first reported Chinese patient,
            whose diabetes was driven by marked insulin resistance and responded to metformin.
          clinical_significance: PATHOGENIC
        - name: c.421-1G>A
          description: Homozygous canonical splice-acceptor variant disrupting the SAM-dependent methyltransferase
            TRM10-type domain, reported in the patient with spastic-ataxic paraparesis and a Dandy-Walker
            variant.
          clinical_significance: PATHOGENIC
        - name: p.Arg43Ter (c.127C>T)
          description: Homozygous stop-gained variant classified pathogenic on PVS1, PM2 and PM3 criteria
            in a 15-year-old with microcephaly, intellectual disability, epilepsy and short stature but
            no metabolic abnormality at evaluation.
          clinical_significance: PATHOGENIC
        - name: Contiguous gene deletion encompassing TRMT10A
          description: Homozygous contiguous gene deletion removing the whole TRMT10A locus in a 17-year-old
            female, with RT-PCR and Western blot confirming complete absence of transcript and protein.
            The most severe reported genotype, with failure to thrive from infancy and gonadal failure;
            establishes that copy-number variation is a route to this syndrome.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: This is the first study describing the impact of TRMT10A deficiency in mammals, highlighting
          a role in the pathogenesis of microcephaly and early onset diabetes.
        supports: SUPPORT
