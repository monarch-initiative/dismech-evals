      assertion_type: Pathophysiology
      assertion:
        name: Loss of tRNA m1G9 Methyltransferase Activity
        description: TRMT10A is the principal — and in human cells apparently non-redundant — enzyme installing
          N1-methylguanosine at position 9 of cytoplasmic tRNAs, the mammalian orthologue of yeast Trm10.
          Its activity is lost outright by nonsense and splice alleles, and reduced below 0.1% of wild
          type by the p.Gly206Arg missense variant, which retains normal tRNA binding but cannot use the
          S-adenosylmethionine methyl donor. This separates substrate recognition from catalysis and shows
          the disease mechanism is loss of methyl transfer rather than loss of tRNA engagement.
        role: intermediate
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: tRNA (guanosine(9)-N1)-methyltransferase activity
          term:
            id: GO:0052905
            label: tRNA (guanosine(9)-N1)-methyltransferase activity
          modifier: LOSS_OF_FUNCTION
        biological_processes:
        - preferred_term: tRNA methylation
          term:
            id: GO:0030488
            label: tRNA methylation
          modifier: DECREASED
      selected_evidence:
        snippet: The completely abolished m(1)G9 methyltransferase activity of the mutant enzyme is likely
          due to significant defects in its ability to bind the methyl donor S-adenosyl methionine.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
