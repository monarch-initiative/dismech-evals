              globally; it biases it. Ribosome profiling of Trmt10a null mouse brain shows slowing at
              Gln(CAG) codons and, because initiator tRNA is limiting, more frequent leaky scanning past
              the upstream open reading frames of Atf4 — the canonical integrated-stress-response sensor
              — so ATF4 is translationally derepressed without an upstream eIF2-alpha kinase signal. Transcripts
              encoding neuronal structural proteins are among those most perturbed, which is the proposed
              link between a housekeeping RNA-modification enzyme and a specifically neurodevelopmental
              phenotype.
