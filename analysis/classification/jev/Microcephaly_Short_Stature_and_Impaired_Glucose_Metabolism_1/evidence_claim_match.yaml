      assertion_type: DifferentialDiagnosis
      assertion:
        name: Microcephaly, epilepsy, and diabetes syndrome 1 (IER3IP1)
        description: 'MEDS1 shares the microcephaly + epilepsy + diabetes triad and, like TRMT10A deficiency,
          involves a protein enriched in cerebral cortex and beta cells. It is separated by timing and
          severity, not by which organs are involved: MEDS diabetes is permanent NEONATAL diabetes, the
          microcephaly is severe with a simplified gyral pattern, and the epilepsy is an infantile epileptic
          encephalopathy with cortical blindness and early death. TRMT10A patients present decades later
          with mild intellectual disability and a normally gyrated small brain.'
        disease_term:
          preferred_term: microcephaly, epilepsy, and diabetes syndrome 1
          term:
            id: MONDO:0031481
            label: microcephaly, epilepsy, and diabetes syndrome 1
        distinguishing_features:
        - 'MEDS1: biallelic IER3IP1 variants, permanent neonatal diabetes, primary microcephaly with simplified
          gyral pattern, infantile epileptic encephalopathy, cortical blindness, death in childhood. MSSGM1:
          biallelic TRMT10A variants, diabetes from late childhood to the third decade, structurally normal
          small brain, mild intellectual disability, normal lifespan reported to date.'
      selected_evidence:
        snippet: The triad of microcephaly, generalized seizures, and permanent neonatal diabetes should
          prompt screening for mutations in IER3IP1.
        supports: SUPPORT
