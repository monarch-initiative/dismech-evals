              ATF4 derepression). Critically, it does NOT reproduce the pancreatic phenotype.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Codon-Specific Translational Impairment
        relationship: RECAPITULATES
        fidelity: HIGH
        description: Ribosome profiling in null-mouse brain establishes the codon-level translational
          lesion, and the same tRNA depletion was confirmed in a human TRMT10A-null cell line.
        limitations: Ribosome profiling was performed in mouse brain; the corresponding measurement has
          not been made in human neural tissue, though the underlying tRNA depletion was replicated in
          a human cell line.
        readouts:
        - name: tRNA-Gln(CUG) and initiator methionine tRNA steady-state levels
          target: Codon-Specific Translational Impairment
          direction: DECREASED
          interpretation: Depletion of the two m1G9-dependent tRNAs is the proximate cause of the codon-specific
            translational deficit.
        - name: Ribosome occupancy at the Gln(CAG) codon
          target: Codon-Specific Translational Impairment
          direction: INCREASED
          interpretation: Increased ribosome dwell time at Gln codons is the direct functional consequence
            of tRNA-Gln depletion.
      selected_evidence:
        snippet: Taken together, our study provides mechanistic insight into the roles of TRMT10A in the
          brain, and exemplifies the importance of universal tRNA modification during translation of specific
          codons.
        supports: SUPPORT
