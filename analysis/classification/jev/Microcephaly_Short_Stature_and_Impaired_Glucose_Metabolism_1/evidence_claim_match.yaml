      assertion_type: DifferentialDiagnosis
      assertion:
        name: Type 1 diabetes mellitus
        description: 'The commonest misdiagnosis, because the diabetes begins in youth and can present
          with hyperglycaemia or even ketoacidosis. Distinguished by autoantibody negativity with persistent
          C-peptide, absence of insulin dependence, and — decisively — the accompanying microcephaly,
          intellectual disability and epilepsy, which are not features of type 1 diabetes. The discriminator
          is imperfect: one TRMT10A patient had both ketoacidosis and islet cell autoantibodies, so the
          neurodevelopmental phenotype rather than the antibody result should drive the referral.'
        distinguishing_features:
        - Autoantibody-negative with persistent C-peptide in most patients; frequently non-insulin-dependent
          and sometimes insulin-resistant and metformin responsive; obligatory neurodevelopmental features
          absent in type 1 diabetes.
      selected_evidence:
        snippet: This report also shows the advantages of using a targeted panel to identify previously
          unsuspected monogenic diabetes among young-onset non-insulin-dependent diabetes in the absence
          of obesity and autoimmunity.
        supports: SUPPORT
