          and, in one family, infantile cirrhosis requiring liver transplantation; MSSGM1 features hypoglycaemia
          preceding diabetes, documented peripheral insulin resistance, and epilepsy as a prominent feature.
      selected_evidence:
        snippet: We describe a new syndrome of young onset diabetes, short stature and microcephaly with
          intellectual disability in a large consanguineous family with three affected children.
