        name: Dandy-Walker Variant
        description: 'The same c.421-1G>A patient had a Dandy-Walker variant. This is bound to HP:0001320
          (Cerebellar vermis hypoplasia) rather than to HP:0001305 (Dandy-Walker malformation) deliberately:
          HPO defines Dandy-Walker malformation as incomplete vermis formation PLUS fourth-ventricle dilation
          PLUS enlargement of the posterior fossa, and it is precisely the absence of posterior-fossa
          enlargement that distinguishes the "variant" from the malformation. Binding to HP:0001305 would
          therefore assert a finding the source does not report. Vermian hypoplasia is the component that
          is definitional for the variant and is safely asserted; `preferred_term` preserves the clinical
          designation the paper used. The abstract gives no further radiological detail, so nothing more
          specific is claimed.'
        phenotype_term:
