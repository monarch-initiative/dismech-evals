  4aabb950c3b01b2c5be314a3aeac87fdf350cf23445cbce0a64d3cb346110100:
    claim:
      about:
        disease:
          name: Microcephaly, Short Stature, and Impaired Glucose Metabolism 1
          disease_term:
            preferred_term: microcephaly, short stature, and impaired glucose metabolism 1
            term:
              id: MONDO:0000208
              label: microcephaly, short stature, and impaired glucose metabolism 1
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Wolcott-Rallison syndrome (EIF2AK3)
        description: 'The canonical differential for syndromic young-onset diabetes with growth failure,
          and mechanistically the far end of the same axis: EIF2AK3/PERK loss LOWERS eIF2-alpha phosphorylation,
          MSSGM2/PPP1R15B raises it, and MSSGM1 perturbs translation a step earlier at tRNA modification
          — yet all three converge on beta-cell failure plus microcephaly and growth retardation. The
          discriminators against MSSGM1 are clean: Wolcott-Rallison diabetes is neonatal with undetectable
          C-peptide from beta-cell loss, and it carries epiphyseal dysplasia and hepatic dysfunction,
          whereas MSSGM1 presents from late childhood to the third decade with persistent C-peptide and
          an explicitly normal skeletal survey.'
        disease_term:
          preferred_term: Wolcott-Rallison syndrome
          term:
            id: MONDO:0009192
            label: Wolcott-Rallison syndrome
        distinguishing_features:
        - 'Wolcott-Rallison: biallelic EIF2AK3 variants, neonatal diabetes with undetectable C-peptide,
          epiphyseal dysplasia, hepatic dysfunction. MSSGM1: biallelic TRMT10A variants, diabetes from
          late childhood to the third decade with persistent C-peptide, hypoglycaemia often preceding
          it, and a skeletal survey showing no epiphyseal dysplasia.'
      selected_evidence:
        snippet: In the Wolcott-Rallison syndrome (with decreased eIF2α phosphorylation), neonatal diabetes
          is due to β-cell loss and C-peptide is undetectable (13), while DNAJC3, IER3IP1, and PPP1R15B
          mutations (with increased eIF2α phosphorylation) lead to permanent neonatal or young-onset diabetes
          with residual C-peptide levels
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/2
      evidence_path: /differential_diagnoses/2/evidence/1
      context_paths:
      - /name
      - /disease_term
