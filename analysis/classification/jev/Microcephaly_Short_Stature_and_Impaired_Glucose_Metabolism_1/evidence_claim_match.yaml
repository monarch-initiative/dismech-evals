        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: metabolic_penetrance_and_onset
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the metabolic phenotype fully penetrant with age, or is there a genuine neurodevelopment-only
          form of TRMT10A deficiency?
        attaches_to:
        - pathophysiology#Biphasic Glucose Dysregulation
        rationale: 'Several molecularly confirmed patients have no dysglycaemia at the time of report:
          compound heterozygous siblings aged 10 and 12 with neither documented hypoglycaemia nor hyperglycaemia,
          and a 15-year-old homozygous for p.Arg43Ter with no metabolic abnormality. Because diabetes
          has been diagnosed as late as the late twenties in other patients, these observations are equally
          consistent with (a) age-dependent but eventually complete penetrance and (b) a genuinely distinct
          neurodevelopment-only phenotype determined by allele or modifier. The distinction is not academic:
          it determines whether lifelong glucose surveillance is mandatory for every biallelic carrier
          or can be stratified. Only longitudinal follow-up of the published cohort can settle it, and
          the 2026 report calls for exactly that.'
        proposed_experiments:
        - experiment_id: longitudinal_metabolic_followup
          name: Longitudinal metabolic follow-up of the published TRMT10A cohort
          description: Prospectively follow all molecularly confirmed individuals with annual HbA1c, oral
            glucose tolerance testing with Matsuda index, and C-peptide, recording age at first dysglycaemia
            against genotype. Age-stratified penetrance curves would distinguish delayed onset from true
            non-penetrance and would set the evidence-based surveillance interval.
      selected_evidence:
        snippet: This case represents one of the rare reported TRMT10A-related syndrome patients in whom
          diabetes has not yet been documented.
        supports: SUPPORT
