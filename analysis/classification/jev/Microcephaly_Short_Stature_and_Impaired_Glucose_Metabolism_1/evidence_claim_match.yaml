              label: microcephaly, short stature, and impaired glucose metabolism 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: tRNA Hypomethylation, Destabilization and Fragmentation
        description: 'Hypomodified tRNAs are degraded or cleaved rather than simply carried in an unmethylated
          state. In Trmt10a null mice and in a TRMT10A-null human cell line the steady-state levels of
          tRNA-Gln(CUG) and initiator methionine tRNA fall across tissues, and in patient-derived beta-like
          cells tRNA-Gln is cleaved into 5'' fragments. The fragments are not inert by-products: purified
          5''-tRNA-Gln fragments are themselves sufficient to kill beta cells, making this node both a
          loss of translational capacity and a gain of a cytotoxic species.'
        role: intermediate
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: tRNA decay
          term:
            id: GO:0016078
            label: tRNA decay
          modifier: INCREASED
      selected_evidence:
        snippet: Here, we generated Trmt10a null mice and showed that tRNAGln(CUG) and initiator methionine
          tRNA levels were universally decreased in various tissues; the same was true in a human cell
          line lacking TRMT10A.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
