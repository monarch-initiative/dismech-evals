              label: microcephaly, short stature, and impaired glucose metabolism 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic TRMT10A Loss-of-Function Variants
        description: The initiating lesion is biallelic inactivation of TRMT10A (4q23). Reported alleles
          span nonsense variants subject to nonsense-mediated decay (p.Arg127Ter in the index Moroccan
          family, p.Glu27Ter, p.Arg43Ter, p.Arg93Ter/p.Arg133Ter in compound heterozygosity), canonical
          splice-acceptor variants (c.496-1G>A, c.421-1G>A), a catalytically dead missense allele (p.Gly206Arg),
          and a homozygous contiguous gene deletion removing the locus. In the index family neither TRMT10A
          mRNA nor protein was detectable in patient lymphoblasts, establishing complete loss of the gene
          product rather than a dominant-negative or hypomorphic effect. Heterozygous parents are unaffected.
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: TRMT10A
          term:
            id: hgnc:28403
            label: TRMT10A
        cellular_components:
        - preferred_term: nucleolus
          term:
            id: GO:0005730
            label: nucleolus
      selected_evidence:
        snippet: Linkage analysis and whole exome sequencing were used to identify the causal nonsense
          mutation, which changed an arginine codon into a stop at position 127 of the tRNA methyltransferase
          homolog gene TRMT10A (also called RG9MTD2).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
