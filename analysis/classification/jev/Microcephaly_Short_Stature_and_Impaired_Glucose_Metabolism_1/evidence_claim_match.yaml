      assertion_type: Diagnosis
      assertion:
        name: Distinguishing the Diabetes from Type 1 Diabetes
        description: 'The diabetes is usually autoantibody-negative with persistent C-peptide, which separates
          it from autoimmune type 1 diabetes. This discriminator is imperfect and should not be applied
          mechanically: one reported patient had both ketoacidosis at onset and islet cell autoantibodies,
          yet retained endogenous insulin secretion 22 months later and maintained near-normal glucose
          for three days off insulin. Autoantibody positivity therefore does not exclude the syndrome
          when the neurodevelopmental phenotype is present.'
        diagnosis_term:
          preferred_term: autoantibody measurement
          term:
            id: NCIT:C181397
            label: Autoantibody Measurement
      selected_evidence:
        snippet: She had an incidental diagnosis of diabetes at age 11.4 years which was negative for
          diabetes antibodies with persistent C-peptide level and she was treated with metformin.
        supports: SUPPORT
