    claim:
      about:
        disease:
          name: Microcephaly, Short Stature, and Impaired Glucose Metabolism 1
          disease_term:
            preferred_term: microcephaly, short stature, and impaired glucose metabolism 1
            term:
              id: MONDO:0000208
              label: microcephaly, short stature, and impaired glucose metabolism 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mouse_pancreas_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why do Trmt10a null mice show no discernible pancreatic defect when autoantibody-negative
          diabetes is the defining metabolic feature of human TRMT10A deficiency?
        attaches_to:
        - pathophysiology#Beta-Cell Oxidative Stress and Intrinsic Apoptosis
        - pathophysiology#Progressive Beta-Cell Mass Loss
        rationale: 'This is the sharpest translational gap in the disorder. The constitutive Trmt10a null
          mouse faithfully reproduces the neurological arm — reduced body weight, smaller hippocampal
          postsynaptic densities, defective synaptic plasticity and memory, and the underlying codon-specific
          translational lesion — while explicitly showing no discernible defect in the pancreas. The entire
          beta-cell mechanism therefore rests on human material: siRNA knockdown in rat and human beta-cell
          lines, and patient-derived iPSC beta-like cells. Several explanations are compatible with the
          data and are not distinguished by current evidence: species differences in beta-cell tRNA-Gln
          dependence or angiogenin-mediated fragmentation; a cumulative, lifespan-scaled apoptotic burden
          that a two-year mouse cannot accrue; or a ceiling effect from assessing an unstressed mouse
          pancreas, given that TRMT10A deficiency in human cells acts partly by sensitizing beta cells
          to ER stress rather than killing them outright. Distinguishing these matters because it determines
          whether the mouse can be used at all to test beta-cell-protective interventions.'
        proposed_experiments:
        - experiment_id: mouse_pancreas_stress_challenge
          name: Metabolic stress challenge of the Trmt10a null mouse pancreas
          description: Phenotype Trmt10a null mice under conditions that stress the beta cell — high-fat
            diet, prolonged glucose challenge, aged cohorts, or pharmacological ER stress — with glucose
            tolerance testing, insulin secretion, and beta-cell mass histomorphometry, rather than under
            standard housing alone. A null mouse that becomes diabetic only under stress would support
            the sensitization model demonstrated in patient iPSC beta-like cells and reconcile the species
            discrepancy.
        - experiment_id: cross_species_trna_fragmentation
          name: Cross-species comparison of beta-cell tRNA fragmentation
          description: Measure m1G9 occupancy, tRNA-Gln steady-state levels and 5'-tRNA-Gln fragment abundance
            side by side in TRMT10A/Trmt10a-null mouse islets, human islets and patient iPSC beta-like
            cells. If mouse beta cells do not generate the cytotoxic fragment at comparable levels, the
            mismatch is mechanistic rather than a matter of duration or stress.
      selected_evidence:
        snippet: Despite not showing discernable defects in the pancreas, liver, or kidney, Trmt10a null
          mice showed lower body weight and smaller hippocampal postsynaptic densities, which is associated
          with defective synaptic plasticity and memory.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
