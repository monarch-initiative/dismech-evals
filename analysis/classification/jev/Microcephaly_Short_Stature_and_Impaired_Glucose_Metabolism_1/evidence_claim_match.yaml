            name: Trmt10a null mouse (E29Stop)
            species: Mouse
            genotype: Trmt10a c.85G>T (p.Glu29Ter) homozygous null
            publication: PMID:38950903
            description: Constitutive null mouse engineered to mimic the human p.Glu27Ter allele. Reproduces
              the reduced body weight and the neurological arm of the human syndrome — smaller hippocampal
              postsynaptic densities with impaired synaptic plasticity and memory — and provides the only
