            term:
              id: MONDO:0000208
              label: microcephaly, short stature, and impaired glucose metabolism 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: neural_arm_direct_evidence
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the primary microcephaly caused by a reduced neural progenitor pool, and has this ever
          been measured directly in a human system?
        attaches_to:
        - pathophysiology#Reduced Neural Progenitor Pool in the Developing Brain
        rationale: 'The neural-progenitor account of the microcephaly is a proposal, not a measurement.
          It rests on three indirect observations: TRMT10A is expressed in human embryonic and fetal brain;
          TRMT10A silencing kills beta cells; and the patients have small, structurally normal brains.
          No study has measured proliferation or apoptosis in human TRMT10A-deficient neural progenitors.
          The competing account is that the phenotype arises from impaired synthesis of neuronal structural
          proteins with preserved cell number — the mechanism actually demonstrated in the null mouse,
          which has smaller postsynaptic densities and no reported reduction in neuron number. These predict
          different things about whether the deficit is fixed prenatally, and therefore about any therapeutic
          window.'
        proposed_experiments:
        - experiment_id: patient_cerebral_organoid_progenitors
