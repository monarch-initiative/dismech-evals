        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic PPP1R15B (CReP) Variants Disrupting the PP1-Binding Site
        description: Biallelic PPP1R15B variants — recurrently the homozygous missense c.1972G>A; p.Arg658Cys
          — alter a conserved residue inside the PPP1C (protein phosphatase 1) binding domain of CReP.
          CReP is the constitutively expressed member of the PPP1R15 family and acts as the non-catalytic
          targeting subunit that presents eIF2-alpha to PP1 under basal, unstressed conditions. Damaging
          this interface is the initiating molecular lesion of the syndrome. A second, mechanistically
          distinct route to the same endpoint is the homozygous p.Asn423Asp variant adjacent to helix
          H1 of the substrate-recruitment module, which impairs capture of the trimeric eIF2 substrate
          while leaving PP1 binding largely intact; both allele classes converge on deficient eIF2-alpha
          dephosphorylation.
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: PPP1R15B
          term:
            id: hgnc:14951
            label: PPP1R15B
        molecular_functions:
        - preferred_term: protein phosphatase 1 binding
          term:
            id: GO:0008157
            label: protein phosphatase 1 binding
          modifier: DECREASED
      selected_evidence:
        snippet: The R658C mutation in PPP1R15B affects a conserved amino acid within the domain important
          for protein phosphatase 1 (PP1) binding.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
