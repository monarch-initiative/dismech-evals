            term:
              id: MONDO:0014785
              label: microcephaly, short stature, and impaired glucose metabolism 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: interp_ppp1r15b_inhibitors_directionally_counterproductive
        prompt: Would PPP1R15B/CReP inhibitors (e.g. Raphin1) or other agents that further raise phospho-eIF2-alpha
          be expected to worsen MSSGM2?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of CReP-Directed eIF2-alpha Dephosphorylation
        - pathophysiology#Pancreatic Beta-Cell Secretory Failure and Apoptosis
        rationale: 'PPP1R15B/CReP is an active drug target, and selective CReP inhibitors are being developed
          to raise phospho-eIF2-alpha therapeutically in other contexts. In MSSGM2 the defect is already
          excessive phospho-eIF2-alpha from deficient CReP function, so pharmacologically inhibiting the
          same node is directionally counterproductive rather than therapeutic. The concern is not purely
          theoretical: in rodent and human beta cells the eIF2-alpha phosphatase inhibitor salubrinal
          exacerbates cell death. This is a prescribing-relevant caution rather than an established clinical
          contraindication, since no such agent has been given to an affected individual; it is recorded
          here so the inference is explicit rather than left for a reader to reconstruct.'
        proposed_experiments:
        - experiment_id: exp_ppp1r15b_inhibitor_directionality
          name: Directionality test of CReP inhibition in R658C beta cells
          description: Compare apoptosis and glucose-stimulated insulin secretion in R658C-knockin versus
            wild-type human beta cells exposed to selective CReP/PPP1R15B inhibitors, to test whether
            further raising phospho-eIF2-alpha worsens the beta-cell phenotype.
      selected_evidence:
        snippet: "we will discuss several pharmacological inhibitors of \nGADD34 and/or CReP that show\
          \ promise as treatments and the controversies as to \ntheir mechanism of action."
        supports: SUPPORT
