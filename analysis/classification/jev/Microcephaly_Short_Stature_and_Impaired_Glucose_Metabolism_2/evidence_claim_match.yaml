          value:
            name: Chronic Attenuation of Cap-Dependent Translation Initiation
            description: Phosphorylated eIF2-alpha sequesters eIF2B and blocks regeneration of the eIF2-GTP/Met-tRNA
              ternary complex, so a sustained rise in basal phospho-eIF2-alpha chronically dampens global
              cap-dependent translation initiation. Because this is the constitutive (unstressed) arm
              of the integrated stress response rather than a transient stress response, the burden falls
              on tissues with high protein-synthetic and secretory demand and on rapidly proliferating
              progenitors.
            role: intermediate
            biological_scale: CELLULAR
            biological_processes:
            - preferred_term: regulation of translational initiation by eIF2 alpha phosphorylation
              term:
                id: GO:0010998
                label: regulation of translational initiation by eIF2 alpha phosphorylation
              modifier: INCREASED
            - preferred_term: translational initiation
              term:
                id: GO:0006413
                label: translational initiation
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Pancreatic Beta-Cell Secretory Failure and Apoptosis
        causal_link_type: DIRECT
        description: Beta cells are among the tissues most sensitive to translational and ER-stress imbalance
          because of their proinsulin biosynthetic load.
      selected_evidence:
        snippet: PPP1R15B deficiency sensitizes β-cells to FFA- and ER stress–induced apoptosis and activates
          the intrinsic pathway of apoptosis via DP5, PUMA, and Bim-S.
        supports: SUPPORT
