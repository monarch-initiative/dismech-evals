              id: MONDO:0014785
              label: microcephaly, short stature, and impaired glucose metabolism 2
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: bidirectional_eif2a_dysregulation
        hypothesis_label: Bidirectional eIF2-alpha dysregulation converges on beta-cell failure
        description: 'MSSGM2 (excess eIF2-alpha phosphorylation from phosphatase-subunit loss) and Wolcott-Rallison
          syndrome (deficient eIF2-alpha phosphorylation from EIF2AK3/PERK loss) are proposed to be mechanistic
          mirror images: departure from tightly regulated eIF2-alpha phosphorylation in either direction
          is deleterious to beta cells and other secretory tissues, producing overlapping syndromic diabetes
          with microcephaly and growth failure. This framing is well supported for the shared endpoint,
          but the reason particular tissues (brain, bone, liver) are selectively vulnerable, and why hepatic
          disease dominates in some families, is not established.'
        status: EMERGING
      selected_evidence:
        snippet: Our findings support the concept that dysregulated eIF2α phosphorylation, whether decreased
          by mutation
        supports: SUPPORT
