          description: Recurrent homozygous missense variant in the C-terminal PP1-binding region, independently
            reported in two unrelated consanguineous families with the full microcephaly-short stature-diabetes
            syndrome. It weakens PPP1R15B-PP1 binding and thereby reduces eIF2-alpha dephosphorylation.
          clinical_significance: PATHOGENIC
        - name: p.Asn423Asp
          description: 'Homozygous missense variant adjacent to helix H1 of the substrate-recruitment
            module, reported in a rare syndrome with microcephaly, developmental delay and intellectual
            disability. Mechanistically distinct from p.Arg658Cys: it reduces capture of the trimeric
            eIF2 substrate rather than binding of the PP1 catalytic subunit, converging on the same biochemical
            endpoint of deficient eIF2-alpha dephosphorylation. Diabetes was not established in the primary
            report, so this allele is best regarded as an overlapping PPP1R15B-related phenotype.'
          clinical_significance: PATHOGENIC
