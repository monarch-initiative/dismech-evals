          is due to β-cell loss and C-peptide is undetectable (13), while DNAJC3, IER3IP1, and PPP1R15B
          mutations (with increased eIF2α phosphorylation) lead to permanent neonatal or young-onset diabetes
          with residual C-peptide levels
        supports: SUPPORT
