    claim:
      about:
        disease:
          name: Microcephaly, Short Stature, and Impaired Glucose Metabolism 2
          disease_term:
            preferred_term: microcephaly, short stature, and impaired glucose metabolism 2
            term:
              id: MONDO:0014785
              label: microcephaly, short stature, and impaired glucose metabolism 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pancreatic Beta-Cell Secretory Failure and Apoptosis
        description: 'Pancreatic beta cells are exquisitely sensitive to translational and ER-stress imbalance
          because of their proinsulin biosynthetic load. PPP1R15B deficiency reduces cellular insulin
          content, blunts glucose-stimulated insulin secretion, and sensitizes beta cells to apoptosis
          both basally and under ER stress or free-fatty-acid exposure, acting through the intrinsic (mitochondrial)
          pathway via the BH3-only proteins DP5, PUMA and Bim. Important evidence caveat: this node rests
          on siRNA knockdown in rat INS-1E and primary rat beta cells, not on the R658C hypomorph and
          not on human tissue — no human beta-cell histopathology is available. The human data are in
          fact only partly concordant: affected individuals retain detectable glucagon-stimulated C-peptide
          and initially modest insulin requirements, so a secretory defect is better supported than outright
          loss of beta-cell mass.'
        role: intermediate
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: pancreatic beta cell
          term:
            id: CL:0000169
            label: type B pancreatic cell
        biological_processes:
        - preferred_term: insulin secretion involved in cellular response to glucose stimulus
          term:
            id: GO:0035773
            label: insulin secretion involved in cellular response to glucose stimulus
          modifier: DECREASED
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: PPP1R15B deficiency sensitizes β-cells to FFA- and ER stress–induced apoptosis and activates
          the intrinsic pathway of apoptosis via DP5, PUMA, and Bim-S.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
