            label: Autosomal recessive inheritance
        description: 'Biallelic ADAMTS18 variants: homozygous in the consanguineous and endogamous families
          that make up most reports, and compound heterozygous in a Caucasian adult and in a Chinese twin
          pair. Apparent dominant transmission in one original family was attributed to pseudodominance.'
      selected_evidence:
        snippet: Consistent with the presumed pseudodominant inheritance in one of the original families,
          we show that MMCAT maps to a single autozygous locus on chr16q23.1 in which exome sequencing
          revealed a homozygous missense change in ADAMTS18.
        supports: SUPPORT
