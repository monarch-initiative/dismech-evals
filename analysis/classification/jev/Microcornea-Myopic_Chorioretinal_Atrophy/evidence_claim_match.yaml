              label: microcornea-myopic chorioretinal atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of ADAMTS18 Extracellular Metalloproteinase Activity
        biological_scale: MOLECULAR
        description: 'ADAMTS18 is a secreted zinc-dependent metalloproteinase that acts on extracellular
          matrix. Its one well-characterised substrate is fibronectin: it cleaves fibronectin in the linker
          between type I modules 5 and 6, removing the N-terminal fragment that fibronectin needs to assemble
          into fibrils, and its loss leads to fibronectin accumulation in knockout tissues. Whether fibronectin
          is the substrate that matters in the eye is not known.'
        molecular_functions:
        - preferred_term: metalloendopeptidase activity
          modifier: DECREASED
          term:
            id: GO:0004222
            label: metalloendopeptidase activity
      selected_evidence:
        snippet: Using mass spectrometry, we identified two sites in FN that are proteolytically cleaved
          by ADAMTS18, including a cleavage site in the linker FN-I5-6.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41135673
      reference_title: A disintegrin and metalloproteinase with thrombospondin motifs 18 (ADAMTS18) cleaves
        fibronectin and negatively regulates its fibrillogenesis.
      evidence_source: IN_VITRO
      explanation: Identifies fibronectin as a direct proteolytic substrate of ADAMTS18.
