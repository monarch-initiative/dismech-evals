              label: microcornea-myopic chorioretinal atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disordered Extracellular Matrix Remodeling in the Developing Eye
        biological_scale: TISSUE
        description: ADAMTS18 is expressed in the developing lens, surface ectoderm, prospective cornea
          and optic cup, and later in the inner retina. Loss of its activity is thought to disturb extracellular
          matrix remodeling as these tissues grow. In Adamts18-null mice the only eye defect is a posterior
          lens-capsule failure that appears at embryonic day 13.5, when the lens grows rapidly, with herniation
          of lens fibre cells into the vitreous. How the same loss produces small corneas, angle anomalies
          and retinal degeneration in humans is unresolved (see discussions).
        biological_processes:
        - preferred_term: extracellular matrix organization
          modifier: ABNORMAL
          term:
            id: GO:0030198
            label: extracellular matrix organization
        - preferred_term: lens development in camera-type eye
          modifier: ABNORMAL
          term:
            id: GO:0002088
            label: lens development in camera-type eye
        cell_types:
        - preferred_term: lens fiber cell
          term:
            id: CL:0011004
            label: lens fiber cell
      selected_evidence:
        snippet: Histological examination revealed a 100% penetrant eye defect resulting from leakage
          of lens material through the lens capsule occurring at embryonic day (E)13.5, when the lens
          grows rapidly.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27638769
      reference_title: Adamts18 deletion results in distinct developmental defects and provides a model
