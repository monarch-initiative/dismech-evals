              label: microcornea-myopic chorioretinal atrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mouse_lacks_human_eye_phenotype
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Retinal and Choroidal Degeneration
        - pathophysiology#Anterior Segment and Lens Maldevelopment
        - animal_models#Adamts18 knockout mouse
        prompt: Why does loss of ADAMTS18 cause microcornea, anterior segment dysgenesis and retinal degeneration
          in humans when the Adamts18-null mouse shows only a posterior lens-capsule defect with a normal
          retina?
        rationale: Evidence exists in a model but does not reproduce the disease. The knockout establishes
          that ADAMTS18 is needed for lens-capsule integrity, yet its retina is structurally and electrically
          normal and it has no corneal or angle anomaly. Possible explanations include species differences
          in eye growth (mice have no macula and do not become myopic), domain-specific effects of the
          human missense alleles, or a requirement in human ocular tissues that the mouse does not share.
          Until this is resolved the connection from the lost protease activity to the retinal and anterior
          segment phenotypes is inferred, not demonstrated.
      selected_evidence:
        snippet: Intriguingly, while ADAMTS18 mutations are associated with complex eye phenotypes in
          humans, we discerned a very restricted abnormality in mice, namely fenestration of the lens
          capsule resulting in posterior extrusions of herniated lens fibers.
        supports: SUPPORT
