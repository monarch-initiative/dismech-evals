        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ahmio1_human_model_hepatic_overload_mismatch
        prompt: Why do humans with biallelic SLC11A2/DMT1 loss develop hepatic iron overload when the
          mk mouse and Belgrade rat carrying the analogous G185R mutation are iron-deficient rather than
          iron-overloaded?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Hepatic Iron Overload via DMT1-Independent Uptake
        - animal_models#Mouse
        rationale: 'The erythroid and intestinal iron-transport failure of DMT1 deficiency is faithfully
          reproduced by the rodent models, but the paradoxical hepatic iron overload that names the human
          disease is not: the mk mouse and Belgrade rat are iron-deficient. The divergence is mechanistically
          meaningful because it localises the open question to the hepatic arm - whether a species difference
          in DMT1-independent hepatic uptake (for example ZIP14-mediated non-transferrin-bound iron entry
          under high serum iron), in dietary iron handling, or in iatrogenic iron exposure explains why
          humans load hepatic iron while the analogous rodents do not.'
        proposed_experiments:
        - experiment_id: exp_ahmio1_cross_species_hepatic_iron
          name: Cross-species comparison of DMT1-independent hepatic iron uptake
          description: Compare hepatic non-transferrin-bound-iron uptake and ZIP14 expression in DMT1-mutant
            mk mice and Belgrade rats against human AHMIO1 liver tissue under matched high-serum-iron
            conditions, to determine whether a species difference in the DMT1-independent hepatic route
            explains the divergent iron-overload phenotype.
          experiment_type:
            preferred_term: cross-species model comparison experiment
        - experiment_id: exp_ahmio1_iron_loaded_rodent_hepatic
          name: Controlled iron loading of DMT1-mutant rodents
          description: Systematically iron-load DMT1-mutant rodents (as with the reported iron dextran
            injection in the Belgrade rat) and quantify hepatic iron deposition and its ZIP14 dependence,
            to test whether the human hepatic overload reflects the DMT1-independent route operating under
            the high serum iron of untreated or transfused patients.
          experiment_type:
            preferred_term: model-system iron-loading experiment
      selected_evidence:
        snippet: unlike the animal models of DMT1 mutation, the patient is iron overloaded
        supports: SUPPORT
