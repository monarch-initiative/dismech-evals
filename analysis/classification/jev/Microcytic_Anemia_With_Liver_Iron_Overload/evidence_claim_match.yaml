      assertion_type: Pathophysiology
      assertion:
        name: SLC11A2/DMT1 Loss of Function
        biological_scale: MOLECULAR
        description: Biallelic SLC11A2 variants reduce or abolish functional DMT1, the proton-coupled
          divalent metal transporter that carries ferrous iron across membranes. Different alleles act
          by different molecular routes - defective protein processing and endoplasmic-reticulum retention
          (R416C), lysosomal mis-accumulation and degradation (G75R), or exon skipping that leaves only
          a small amount of functional transporter (E399D) - but all converge on quantitatively reduced
          DMT1 activity.
        genes:
        - preferred_term: SLC11A2
          term:
            id: hgnc:10908
            label: SLC11A2
        molecular_functions:
        - preferred_term: iron ion transmembrane transporter activity
          modifier: DECREASED
          term:
            id: GO:0005381
            label: iron ion transmembrane transporter activity
      selected_evidence:
        snippet: We report here the first human mutation of DMT1 identified in a female with severe hypochromic
          microcytic anemia and iron overload.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
