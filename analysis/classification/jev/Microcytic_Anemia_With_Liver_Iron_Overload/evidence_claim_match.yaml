        biological_scale: CELLULAR
        description: DMT1 imports dietary ferrous iron across the apical brush-border membrane of duodenal
          enterocytes. Its loss impairs intestinal iron absorption; in humans, however, this is partly
          bypassed by up-regulation of other absorptive pathways, so intestinal loss alone does not produce
          iron deficiency.
        cell_types:
        - preferred_term: enterocyte
          term:
            id: CL:0000584
            label: enterocyte
        biological_processes:
        - preferred_term: iron ion transmembrane transport
          modifier: DECREASED
          term:
            id: GO:0034755
            label: iron ion transmembrane transport
        cellular_components:
        - preferred_term: brush border membrane
          term:
            id: GO:0031526
            label: brush border membrane
        notes: 'No downstream edge to the anemia is drawn from this node: the cited source (PMID:16160008)
          states the intestinal defect "is likely bypassed by the up-regulation of other pathways of iron
          use", so in humans the duodenal loss does not measurably contribute to the phenotype. The compensation
          is kept as node description rather than asserted as a causal contribution its own citation denies.'
      selected_evidence:
        snippet: Divalent metal transporter 1 (DMT1) is a transmembrane protein crucial for duodenal iron
          absorption and erythroid iron transport.
        supports: SUPPORT
