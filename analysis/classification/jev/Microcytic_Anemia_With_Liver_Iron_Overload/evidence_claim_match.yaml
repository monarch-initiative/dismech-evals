        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Erythroid Transferrin-Cycle Iron Utilization
        biological_scale: CELLULAR
        description: In erythroid precursors, iron delivered by transferrin is internalised through the
          transferrin-receptor cycle and must be exported from the recycling endosome into the cytosol
          by DMT1 to reach the mitochondrion for haem synthesis. Loss of DMT1 leaves iron trapped in the
          endosome, starving haemoglobin synthesis despite adequate whole-body iron.
        cell_types:
        - preferred_term: erythroblast
          term:
            id: CL:0000765
