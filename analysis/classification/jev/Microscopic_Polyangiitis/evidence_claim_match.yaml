  aa3fb5dac4003953310c8a44b9011a5d8af5d0a24bd5d75a6bb9cdc965bbd019:
    claim:
      about:
        disease:
          name: Microscopic Polyangiitis
          disease_term:
            preferred_term: Microscopic Polyangiitis
            term:
              id: MONDO:0019124
              label: microscopic polyangiitis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NET Formation and Complement Amplification
        conforms_to: necrotizing_vasculitis#Complement C5a Amplification and Neutrophil Recruitment
        description: ANCA-stimulated neutrophils release neutrophil extracellular traps (NETs) - chromatin
          fibers decorated with MPO and PR3. NETs perpetuate autoimmunity by re-exposing MPO, directly
          injure endothelium, and activate the alternative complement pathway, generating the anaphylatoxin
          C5a. C5a engages the neutrophil C5a receptor (C5aR/CD88) to prime more neutrophils, producing
          a feed-forward amplification loop. The C5a-C5aR axis is essential in experimental anti-MPO disease
          and is the therapeutic target of avacopan.
        cell_types:
        - preferred_term: Neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        biological_processes:
        - preferred_term: Neutrophil Extracellular Trap Formation
          term:
            id: GO:0140645
            label: neutrophil extracellular trap formation
          modifier: INCREASED
        - preferred_term: Complement Alternative Pathway Activation
          term:
            id: GO:0006957
            label: complement activation, alternative pathway
          modifier: INCREASED
      selected_evidence:
        snippet: This conditioned serum primed neutrophils for ANCA-induced respiratory burst; neutrophil
          C5aR blockade abrogated this priming, but C3aR blockade did not.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19073822
      reference_title: C5a receptor mediates neutrophil activation and ANCA-induced glomerulonephritis.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the C5a-C5aR axis as the complement amplification loop priming neutrophils
        for ANCA-induced activation - the mechanistic rationale for the C5aR antagonist avacopan.
