        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ANCA-Mediated Neutrophil Activation
        conforms_to: necrotizing_vasculitis#Intramural Leukocyte Degranulation and Oxidative Burst
        description: Cytokine-primed neutrophils (primed by TNF-alpha, IL-1beta, and complement C5a) translocate
          MPO from azurophilic granules to the cell surface, where MPO-ANCA IgG engages it together with
          Fc-gamma receptors. This triggers the respiratory burst, degranulation, and release of reactive
          oxygen species and lytic enzymes. Passive transfer of anti-MPO IgG reproduces pauci-immune necrotizing
          crescentic glomerulonephritis in mice, and neutrophil depletion completely prevents it, establishing
          the neutrophil as the obligate effector.
        cell_types:
        - preferred_term: Neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: Monocyte-derived macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: Neutrophil Activation
          term:
            id: GO:0042119
            label: neutrophil activation
          modifier: INCREASED
        - preferred_term: Neutrophil Degranulation
          term:
            id: GO:0043312
            label: neutrophil degranulation
          modifier: INCREASED
        - preferred_term: Respiratory Burst
          term:
            id: GO:0045730
            label: respiratory burst
          modifier: INCREASED
      selected_evidence:
        snippet: anti-MPO IgG alone was able to cause pauci-immune glomerular necrosis and crescent formation
          in the absence of functional T or B lymphocytes in Rag2(-/-) mice and in the presence of an
          intact immune system in wild-type C57BL/6J mice.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
