      assertion_type: Pathophysiology
      assertion:
        name: Necrotizing Small-Vessel Capillaritis
        conforms_to: necrotizing_vasculitis#Fibrinoid Necrosis of the Vessel Wall
        description: Activated neutrophils adhere to and lyse small-vessel endothelium (capillaries, venules,
          arterioles), causing leukocytoclasia, fibrinoid necrosis, and vessel-wall destruction with little
          or no immunoglobulin deposition ("pauci-immune"). In the kidney this produces focal necrotizing
          and crescentic glomerulonephritis; in the lung, alveolar capillaritis with diffuse hemorrhage;
          in nerve, ischemic vasculitic neuropathy. Granulomatous inflammation is characteristically absent,
          distinguishing MPA from GPA.
        cell_types:
        - preferred_term: Vascular endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: Inflammatory Response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: Mice that received anti-MPO IgG but not mice that received control IgG developed focal
          necrotizing and crescentic glomerulonephritis with a paucity of glomerular Ig deposition.
        supports: SUPPORT
