      - /disease_term
    evidence_metadata:
      reference: PMID:22808956
      reference_title: Genetically distinct subsets within ANCA-associated vasculitis.
      evidence_source: HUMAN_CLINICAL
      explanation: The Lyons GWAS shows MPO-ANCA (the dominant serotype in MPA) is genetically associated
        with HLA-DQ, supporting an HLA class II-restricted loss of tolerance to MPO as the upstream susceptibility
        mechanism.
