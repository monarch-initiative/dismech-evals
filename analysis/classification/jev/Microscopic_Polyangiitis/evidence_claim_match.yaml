      assertion_type: Pathophysiology
      assertion:
        name: Loss of Tolerance and MPO-ANCA Production
        description: On a permissive HLA class II background (HLA-DQ for MPO-ANCA), with environmental
          priming (silica, culprit drugs, infection) and epigenetic de-repression of the MPO autoantigen
          gene, autoreactive B cells generate anti-myeloperoxidase IgG (MPO-ANCA). This break in tolerance
          to a neutrophil granule antigen is the defining upstream event. Genetics segregate by ANCA serotype
          rather than by clinical syndrome, and MPA is predominantly the MPO-ANCA arm of AAV.
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: B Cell Activation
          term:
            id: GO:0042113
            label: B cell activation
      selected_evidence:
        snippet: Anti-myeloperoxidase ANCA was associated with HLA-DQ
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
