      assertion:
        name: Brush-Border Loss and Intracellular Microvillus Inclusion Formation
        conforms_to: enterocyte_polarity_trafficking_failure#Loss of a Functionally Polarized Absorptive
          Epithelial Surface
        description: 'The defining structural lesion and the diagnostic hallmark. Without myosin-Vb-dependent
          apical delivery, the enterocyte cannot build or maintain its brush border: apical microvilli
          are sparse or absent over the villus surface. Microvilli that do form are internalized into
          vacuolar structures within the cytoplasm, producing the pathognomonic microvillus inclusions
          - intracellular vacuoles lined by fully formed microvilli - accompanied by accumulation of periodic-acid-Schiff-positive
          granules in the subapical cytoplasm. Villous atrophy is present, so unlike the diet-induced
          congenital diarrheas the villus-to-crypt ratio is abnormal, which is what places MVID in the
          enterocyte-structural rather than the digestive-absorptive CODE class.'
        role: central_effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Small-intestinal enterocyte
          term:
            id: CL:0000584
            label: enterocyte
        biological_processes:
        - preferred_term: Microvillus assembly at the apical surface
          term:
            id: GO:0030033
            label: microvillus assembly
          modifier: DECREASED
        - preferred_term: Apical membrane protein delivery
          term:
            id: GO:0072659
            label: protein localization to plasma membrane
          modifier: DECREASED
        cellular_components:
        - preferred_term: Microvillus
          term:
            id: GO:0005902
            label: microvillus
      selected_evidence:
        snippet: MVID is characterized by lack of microvilli on the surface of enterocytes and occurrence
          of intracellular vacuolar structures containing microvilli.
        supports: SUPPORT
