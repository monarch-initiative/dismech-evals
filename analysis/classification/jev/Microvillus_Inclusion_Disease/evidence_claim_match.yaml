            label: MYO5B
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Biallelic nonsense, frameshift, splice and missense variants in MYO5B, encoding the
          type Vb myosin motor, are the principal cause of MVID. The motor couples apical recycling endosomes
          to the actin cytoskeleton, so its loss disrupts trafficking of both apical and basolateral membrane
          proteins in the enterocyte. Genotype partly predicts organ involvement: some MYO5B variants
          produce isolated low-GGT cholestasis without enteropathy, indicating that intestinal and hepatic
          manifestations can dissociate.'
      selected_evidence:
        snippet: Following homozygosity mapping in a single kindred, we identified nonsense and missense
          mutations in MYO5B, encoding type Vb myosin motor protein, in individuals with microvillus inclusion
          disease (MVID).
