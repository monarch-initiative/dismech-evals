        name: Loss of Apical Absorptive and Ion-Transport Capacity
        conforms_to: enterocyte_polarity_trafficking_failure#Loss of a Functionally Polarized Absorptive
          Epithelial Surface
        description: The functional consequence of losing the apical membrane. The brush border is the
          entire absorptive interface of the enterocyte, carrying the disaccharidases, the nutrient carriers
          and the sodium-coupled ion exchangers that drive net fluid absorption. Its loss, together with
          failure to deliver and retain apical transporters, abolishes absorptive capacity across the
          board rather than for one substrate. The resulting diarrhea is therefore non-selective and,
          distinctively, persists during complete bowel rest - fluid loss continues when nothing is being
          fed, because the defect is in the absorptive surface itself and not in the handling of any ingested
          nutrient.
