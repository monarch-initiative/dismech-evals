        conforms_to: enterocyte_polarity_trafficking_failure#Loss of Apical Delivery Machinery
        description: The initiating molecular lesion. Myosin Vb is an actin-based motor that moves apical
          recycling endosomes along the subapical actin network of the polarized enterocyte and, with
          its RAB8/RAB11 partners and the apical SNARE syntaxin-3, delivers their cargo to the apical
          plasma membrane. Biallelic loss of the motor - or of syntaxin-3, the receiving SNARE one step
          downstream - arrests this delivery step. Cargo destined for the apical surface is retained in
          the subapical endosomal compartment, and, as the original gene-discovery work showed by the
          mislocalization of transferrin receptor, basolateral trafficking is disturbed as well, so the
          defect is one of general epithelial polarity rather than of a single apical protein.
