      assertion_type: Pathophysiology
      assertion:
        name: Canalicular Trafficking Failure and Low-GGT Intrahepatic Cholestasis
        description: The hepatic arm of the same trafficking lesion. Myosin Vb organizes apical membrane
          traffic in the hepatocyte just as it does in the enterocyte, and the hepatocyte's apical membrane
          is the bile canaliculus. Loss of the motor mislocalizes the canalicular bile-salt export pump
          and disorganizes the canaliculus, producing a low-gamma-glutamyl-transferase intrahepatic cholestasis
          (PFIC10). This arm can occur together with the enteropathy or, with certain MYO5B genotypes,
          in isolation without any intestinal disease, which is why MYO5B disease is best understood as
          one trafficking defect expressed in two polarized epithelia. It is mechanistically distinct
          from - and must not be conflated with - the intestinal-failure-associated liver disease that
          parenteral nutrition itself causes in these same children.
        role: effector
        biological_scale: CELLULAR
        locations:
        - preferred_term: Liver
          term:
            id: UBERON:0002107
            label: liver
        notes: The specific mechanism by which canalicular trafficking failure produces cholestasis -
          mislocalization of the bile-salt export pump and disorganization of the canaliculus - is described
          in the MYO5B literature but is not itself snippet-evidenced here; the cited references establish
          the phenotype and its independence from intestinal disease, not the BSEP-mislocalization step.
          Do not cite the MVID gene-discovery paper (PMID:18724368) as evidence for the cholestasis phenotype.
      selected_evidence:
        snippet: MYO5B deficiency causes defective trafficking of apical and basolateral proteins
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
