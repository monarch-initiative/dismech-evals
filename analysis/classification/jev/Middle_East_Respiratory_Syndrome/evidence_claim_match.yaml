  712f7172f47f2c774f36a8a2899759544fb3a63984b16617c395c7a0a00bdae2:
    claim:
      about:
        disease:
          name: Middle East Respiratory Syndrome
          disease_term:
            preferred_term: Middle East respiratory syndrome
            term:
              id: MONDO:0100116
              label: Middle East respiratory syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MERS-CoV Spike-Mediated Entry via DPP4
        conforms_to: host_directed_antiviral_dependency#Host Receptor and Protease Engagement
        description: 'MERS-CoV enters host cells through its spike (S) glycoprotein, whose receptor-binding
          S1 domain engages the host cell-surface enzyme dipeptidyl peptidase 4 (DPP4, also known as CD26);
          host serine proteases then prime the spike for membrane fusion. DPP4 is expressed on respiratory
          epithelium and pneumocytes, defining the tropism for the lower respiratory tract, and is also
          expressed on renal and intestinal epithelium and liver — a tissue distribution consistent with
          the extrapulmonary (notably renal and gastrointestinal) manifestations of severe MERS. Receptor
          engagement is independent of DPP4 enzymatic activity: clinically used gliptin DPP4 inhibitors
          do not block infection, so DPP4 serves as an attachment protein rather than through its peptidase
          catalysis. Because the receptor is a host protein, antibodies against DPP4 block infection —
          the host-directed-target logic shared with SARS-CoV-2/ACE2.

          '
        genes:
        - preferred_term: DPP4
          term:
            id: hgnc:3009
            label: DPP4
        cell_types:
        - preferred_term: bronchial epithelial cell
          term:
            id: CL:0002328
            label: bronchial epithelial cell
        - preferred_term: pulmonary alveolar type 2 cell
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        biological_processes:
        - preferred_term: virion attachment to host cell
          term:
            id: GO:0019062
            label: virion attachment to host cell
        - preferred_term: symbiont entry into host cell
          term:
            id: GO:0046718
            label: symbiont entry into host cell
        locations:
        - preferred_term: bronchiole
          term:
            id: UBERON:0002186
            label: bronchiole
        - preferred_term: kidney
          term:
            id: UBERON:0002113
            label: kidney
        - preferred_term: small intestine
          term:
            id: UBERON:0002108
            label: small intestine
        - preferred_term: liver
          term:
            id: UBERON:0002107
            label: liver
        notes: Extrapulmonary locations (kidney, small intestine, liver) reflect documented human DPP4
          receptor expression (PMID:23486063) that determines potential host cell susceptibility, whereas
          histopathologically confirmed human infection in extrapulmonary organs remains sparsely characterized.
      selected_evidence:
        snippet: Here we identify dipeptidyl peptidase 4 (DPP4; also known as CD26) as a functional receptor
          for hCoV-EMC.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23486063
      reference_title: Dipeptidyl peptidase 4 is a functional receptor for the emerging human coronavirus-EMC.
      evidence_source: IN_VITRO
      explanation: Identifies DPP4 (CD26) as the functional host receptor for MERS-CoV (hCoV-EMC), the
        druggable host-factor entry step. Evidence source is IN_VITRO as this is a cell-based receptor-identification
        study.
