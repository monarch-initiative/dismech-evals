      assertion_type: Pathophysiology
      assertion:
        name: Severe Lower Respiratory Infection and Systemic Spread
        description: 'MERS-CoV replication in the lower respiratory tract produces severe pneumonia that
          frequently progresses to acute respiratory distress syndrome and respiratory failure. Systemic
          and extrapulmonary involvement — notably acute kidney injury and gastrointestinal symptoms —
