      assertion_type: DifferentialDiagnosis
      assertion:
        name: Severe acute respiratory syndrome
        description: Severe acute respiratory syndrome (SARS), caused by the lineage B betacoronavirus
          SARS-CoV, presents with an overlapping initial febrile and nonproductive cough prodrome progressing
          to viral pneumonia and respiratory failure.
        distinguishing_features:
        - MERS-CoV uses DPP4 (CD26) as its entry receptor whereas SARS-CoV uses ACE2.
        - MERS shows a stronger association with underlying comorbidities, more frequent acute renal failure,
          higher hemoptysis frequency (17% vs 0-1%), and more rapid progression to mechanical ventilation
          (median 7 days vs mean 11 days) than SARS.
      selected_evidence:
        snippet: The clinical syndrome is similar to SARS, with an initial phase of nonspecific fever
          and mild, nonproductive cough, which may last for several days before progressing to pneumonia.
        supports: SUPPORT
