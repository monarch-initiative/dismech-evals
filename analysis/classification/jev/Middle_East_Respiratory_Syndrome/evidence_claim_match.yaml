        snippet: The presence of viral nucleic acid can be confirmed either by positive real-time reverse
          transcription PCR on at least two specific genomic targets or by a single positive target with
          sequencing of a second positive PCR product.97 Available real-time reverse transcription PCR
          tests include an assay targeting RNA upstream of the E gene (upE) and assays targeting open
          reading frames 1b (ORF 1b) and 1a (ORF 1a).
        supports: SUPPORT
