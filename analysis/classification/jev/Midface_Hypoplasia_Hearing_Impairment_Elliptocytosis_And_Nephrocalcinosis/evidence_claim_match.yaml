      assertion_type: Diagnosis
      assertion:
        name: Audiometry
        description: Hearing loss is sensorineural, mild to moderate where audiograms are reported, and
          the affected frequencies vary between individuals - so a normal impression on casual testing
          is not sufficient, and carriers should be tested too rather than asked.
        diagnosis_term:
          preferred_term: audiometric assessment
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
        results: Mild to moderate sensorineural hearing loss with a variable pattern of affected frequencies.
          A normal audiogram does not exclude the diagnosis and should be repeated.
        notes: 'Longitudinal audiometry, not a single screen. The hearing loss is postnatal in onset and
          progressive - one proband had a normal audiogram at 2 and detectable sensorineural loss at 3,
          and his half-brother''s audiogram at 4 had deteriorated from a previous one while still reading
          within the normal range on air conduction. So a normal or borderline result in an infant or
          toddler carries almost no information, and the practical recommendation is repeat testing through
