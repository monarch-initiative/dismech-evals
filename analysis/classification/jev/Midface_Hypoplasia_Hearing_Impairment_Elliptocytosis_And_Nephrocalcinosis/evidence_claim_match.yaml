          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0003676
            label: nucleic acid binding
      selected_evidence:
        snippet: The expression pattern of mutated AMMECR1 we observed within the nucleus is consistent
          with the altered protein being targeted for degradation by this system.
        supports: SUPPORT
        directness: INDIRECT
