      evidence_source: IN_VITRO
      explanation: The authors' proposed route from the missense allele to loss of nuclear function -
        proteasomal degradation of the mal-folded protein, inferred from the mutant's resemblance to nuclear
        20S proteasome staining and from reduced GFP expression. INDIRECT because it is an interpretation
        of a localisation pattern, and the source hedges it throughout ("consistent with", "may therefore
        be"); no degradation assay was performed. It is recorded on this node rather than as a node of
        its own, because a separate proteasomal node would give a speculative step the same graph weight
        as the measured mislocalisation.
