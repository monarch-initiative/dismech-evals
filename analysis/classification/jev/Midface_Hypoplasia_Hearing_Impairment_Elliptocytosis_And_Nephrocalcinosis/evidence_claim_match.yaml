  96a12f96552ef84cecf0251868e6514cc6aed6f0d0adebb1e0dd3a6475fd6980:
    claim:
      about:
        disease:
          name: Midface Hypoplasia, Hearing Impairment, Elliptocytosis, and Nephrocalcinosis
          disease_term:
            preferred_term: midface hypoplasia, hearing impairment, elliptocytosis, and nephrocalcinosis
            term:
              id: MONDO:0010516
              label: midface hypoplasia, hearing impairment, elliptocytosis, and nephrocalcinosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: AMMECR1 Loss of Function
        description: 'The initiating lesion. Reported alleles span the range: microdeletions removing
          AMMECR1 alone or with its immediate neighbours TMEM164 and SNORD96B, nonsense variants, an X-autosome
          translocation with skewed inactivation of the normal X, and missense changes. AMMECR1 sits in
          the Xq22.3 interval deleted in AMME, and the disease-defining observation is that variants hitting
          AMMECR1 while sparing COL4A5 reproduce the non-renal AMME features without Alport syndrome.

          The gene encodes a 35.5 kDa protein from six exons with a ubiquitous transcript, conserved from
          yeast and nematode upward. When it was cloned, its function was unknown; a conserved six-amino-acid
          domain in exon 2 was noted with function unknown then, and it remains substantially unknown
          now.'
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: AMMECR1
          term:
            id: hgnc:467
            label: AMMECR1
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HEMIZYGOUS
          description: Hemizygous in affected males - microdeletion, nonsense or missense. The functional
            impact is recorded as loss of function because the microdeletion and nonsense alleles are
            unambiguous and produce the same phenotype as the missense ones; whether every missense allele
            acts by simple loss of function is not established.
      selected_evidence:
        snippet: In the affected half-brothers, we identified a hemizygous novel non-synonymous variant
          of unknown significance in AMMECR1 (c.G530A; p.G177D), a gene residing in the AMME disease locus.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27811305
      reference_title: 'AMMECR1: a single point mutation causes developmental delay, midface hypoplasia
        and elliptocytosis.'
      evidence_source: HUMAN_CLINICAL
      explanation: The first point mutation in the gene, in the family that separated AMMECR1's contribution
        from the rest of the AMME deletion.
