      assertion_type: Phenotype
      assertion:
        name: Sensorineural Hearing Impairment
        category: Auditory
        description: 'Sensorineural hearing loss, mild to moderate where audiograms are reported, with
          a variable pattern of affected frequencies. It is one of the few features with any tissue-level
          support: AMMECR1 is expressed in the human fetal inner ear.'
        phenotype_term:
          preferred_term: Sensorineural hearing impairment
          term:
            id: HP:0000407
            label: Sensorineural hearing impairment
          clinical_course: PROGRESSIVE
          onset:
            onset_category: CHILDHOOD
            notes: Both onset qualifiers come from the two point-mutation half-brothers of PMID:27811305
              and from nowhere else. In the older proband sensorineural loss was first detected at age
              3 with a normal audiogram a year earlier; in the younger, an audiogram at 4 showed deterioration
              from a previous one. The authors read that pair of observations as progressive hearing loss
              without congenital onset. Age of detection is not the same as age of onset, and no other
              report gives an age at all, so `CHILDHOOD` records where the only dated observations fall
              rather than a spectrum-wide onset claim.
        notes: 'No frequency band; see the entry `notes`. Observed in the loss-of-function series (PMID:29193635),
          the microdeletion pair (PMID:30737907), the X-linked elliptocytosis family (PMID:28089922),
          the second missense case as partial hearing impairment (PMID:42386221), and in all three carrier
          females (PMID:35084080). The audiometric detail comes from the carrier report, so it describes
          carriers rather than affected males.

          The course is the clinically consequential part and it is not what a reader would assume from
          a congenital syndrome: the loss is postnatal in onset and progressive, so a normal audiogram
          in infancy does not exclude it. That is what makes repeated audiometry rather than a single
          screen the right diagnostic posture - see the Audiometry entry under `diagnosis`.'
      selected_evidence:
        snippet: In this article, we present two unrelated male patients with short stature, mild intellectual
          disability or neurodevelopmental delay, sensorineural hearing loss, and elliptocytosis harboring
          small microdeletions identified by array-CGH involving TMEM164 and AMMECR1 genes and SNORD96B
          small nucleolar RNA for one patient, inherited from their mothers.
        supports: SUPPORT
