  a9c0ed052837cdfb5359f44c70c256d4cdf2f528b08e4a405ae960cfce57603f:
    claim:
      about:
        disease:
          name: Midface Hypoplasia, Hearing Impairment, Elliptocytosis, and Nephrocalcinosis
          disease_term:
            preferred_term: midface hypoplasia, hearing impairment, elliptocytosis, and nephrocalcinosis
            term:
              id: MONDO:0010516
              label: midface hypoplasia, hearing impairment, elliptocytosis, and nephrocalcinosis
        context: []
      assertion_type: Phenotype
      assertion:
        name: Nephrocalcinosis
        category: Renal
        description: Calcium deposition in the renal parenchyma. This is the renal finding that belongs
          to AMMECR1; it is distinct from the Alport nephropathy of the contiguous-gene AMME deletion,
          which comes from COL4A5 and is not part of this entity.
        phenotype_term:
          preferred_term: Nephrocalcinosis
          term:
            id: HP:0000121
            label: Nephrocalcinosis
        notes: 'No frequency band; see the entry `notes`. Observed in the point-mutation half-brothers,
          where it was the presenting problem (PMID:27811305), and in the second missense case (PMID:42386221).
          The first-report authors state the attribution cautiously, as AMMECR1 possibly playing a role,
          and that hedge is preserved here.

          How settled is this feature, given that it is in the disease name? Less than the name suggests,
          and the entry now says so with a `REFUTE` item rather than only in prose. The first-report authors
          wrote that the nephrocalcinosis "may be entirely incidental". Two things have changed since,
          and they cut in opposite directions. Against the caveat: their premise was that these findings
          were "unique to our study", and the 2026 second missense case reports nephrocalcinosis independently,
          so the finding is no longer unique. For the caveat: an independent recurrence in a second family
          is a much weaker claim than a mechanism, and none has been proposed. The honest position is
          that the association is now better supported than in 2016 and still not established, which is
          what the two evidence items below record.

          The same "may be entirely incidental" sentence also covers the submucous cleft palate and bifid
          uvula. It is quoted once, here, rather than repeated on the Cleft Palate phenotype - which carries
          a pointer to it in its own `notes:`.'
      selected_evidence:
        snippet: We sought to discover a genetic cause for two half-brothers presenting with nephrocalcinosis,
          early speech and language delay and midface hypoplasia with submucous cleft palate and bifid
          uvula.
        supports: SUPPORT
