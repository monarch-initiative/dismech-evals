      assertion_type: Pathophysiology
      assertion:
        name: Loss of Nuclear AMMECR1 Function
        description: 'AMMECR1 and its paralog AMMECR1L dimerize and localize to the nucleus, which their
          nucleic-acid-binding RAGNYA folds would predict. The one patient allele examined functionally,
          p.G177D, is not absent from the nucleus but distributed abnormally within it - and the second
          reported missense allele is described the same way, as altered intranuclear distribution with
          reduced expression.

          What the protein does there is unresolved. The strongest statement its investigators make is
          that it is potentially involved in cell cycle control, inferred from coexpression rather than
          from an assay of AMMECR1 itself. This node therefore records a demonstrated molecular abnormality
          with an undetermined downstream function, which is the honest shape of the evidence.'
        biological_scale: MOLECULAR
        cellular_components:
