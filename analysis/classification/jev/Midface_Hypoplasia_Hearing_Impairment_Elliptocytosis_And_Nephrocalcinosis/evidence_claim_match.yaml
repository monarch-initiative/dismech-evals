  75e116d8303dbf767afeda5bd277259fef508a96a8113610e460335f4f3520dd:
    claim:
      about:
        disease:
          name: Midface Hypoplasia, Hearing Impairment, Elliptocytosis, and Nephrocalcinosis
          disease_term:
            preferred_term: midface hypoplasia, hearing impairment, elliptocytosis, and nephrocalcinosis
            term:
              id: MONDO:0010516
              label: midface hypoplasia, hearing impairment, elliptocytosis, and nephrocalcinosis
        context: []
      assertion_type: Genetic
      assertion:
        name: AMMECR1
        notes: 'Encodes a 35.5 kDa nuclear protein of six exons with a ubiquitous transcript, conserved
          from yeast and Caenorhabditis elegans upward, carrying a nucleic-acid-binding RAGNYA fold and
          dimerizing with its paralog AMMECR1L. It was cloned specifically because it lay inside the AMME
          deletion interval and was named after that syndrome; its function was unknown then and is still
          not established.

          The gene''s position is the whole story of this disease. It sits telomeric to COL4A5 in Xq22.3,
          inside the interval whose deletion produces AMME. Because COL4A5 accounts for the Alport syndrome
          and nothing else, the remaining features had to belong to a neighbour, and both point mutations
          and AMMECR1-sparing-COL4A5 microdeletions have since confirmed the assignment from opposite
          directions.

          Allelic spectrum: microdeletions (including small ones covering only TMEM164, AMMECR1 and SNORD96B),
          nonsense variants, an X-autosome translocation with inactivation of the normal X, and at least
          two missense alleles - p.G177D and p.Val217Met - both associated with altered intranuclear distribution.
          No genotype-phenotype correlation has been established.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: AMMECR1
          term:
            id: hgnc:467
            label: AMMECR1
      selected_evidence:
        snippet: Exon 2 of AMMECR1 encodes a domain consisting of six amino acids identically conserved
          throughout the course of evolution and whose function is as yet unknown.
        supports: SUPPORT
