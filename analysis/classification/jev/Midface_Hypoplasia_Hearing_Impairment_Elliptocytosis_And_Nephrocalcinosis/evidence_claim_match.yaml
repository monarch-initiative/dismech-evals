      - /disease_term
    evidence_metadata:
      reference: PMID:29193635
      reference_title: Inactivation of AMMECR1 is associated with growth, bone, and heart alterations.
      evidence_source: COMPUTATIONAL
      explanation: The structural and localisation account of the normal protein. Graded COMPUTATIONAL
        because the nucleic-acid-binding function is a fold-based prediction, and INDIRECT because it
        describes the wild-type protein rather than a patient allele.
