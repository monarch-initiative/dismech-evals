      assertion_type: DifferentialDiagnosis
      assertion:
        name: Focal Segmental Glomerulosclerosis
        disease_term:
          preferred_term: Focal Segmental Glomerulosclerosis
          term:
            id: MONDO:0100313
            label: focal segmental glomerulosclerosis
        description: Primary podocytopathy presenting with nephrotic syndrome and diffuse foot process
          effacement that overlaps clinically with MCD but exhibits focal and segmental glomerular sclerosis
          on light microscopy and higher rates of corticosteroid resistance.
        distinguishing_features:
        - Light microscopy shows focal and segmental glomerular sclerosis lesions in FSGS, whereas glomeruli
          appear normal on light microscopy in MCD.
        - Primary FSGS more frequently exhibits steroid resistance and progression to chronic kidney failure
          compared with classic steroid-sensitive MCD.
      selected_evidence:
        snippet: As regards MCD, there is not a complete correspondence between sensitivity to steroids
          and pathology findings, since not all patients respond to steroids, while a minority of patients
          responding to steroids present sclerotic lesions that involve focal segments of glomeruli and
          are associated with diffuse fusion of foot process. When these pathological features are well
          structured, then the condition is defined as primary Focal Segmental Glomerulosclerosis (FSGS),
          that represents a separate entity with different clinical and prognostic features (Table 1).
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
