        notes: 'Rare heterozygous nephrin variants have been reported in biopsy-proven childhood-onset
          MCNS cohorts, but no reproducible MCNS-defining NPHS1 mutation has been established. In MCD,
          NPHS1 findings are best interpreted as uncommon podocyte vulnerability signals rather than a
          canonical monogenic cause of acquired disease.

          '
      selected_evidence:
        snippet: The analysis of NPHS1 revealed no specific MCNS-associated mutation. However, 5 of the
          25 MCNS patients had heterozygous allelic variants leading to nonconservative amino acid substitutions
          not previously reported (G879R; R800C; T294I; A916S).
        supports: SUPPORT
