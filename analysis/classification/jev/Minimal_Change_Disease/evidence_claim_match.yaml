        description: 'Anti-nephrin autoantibodies define an autoantibody-associated subgroup within acquired
          diffuse podocytopathies that includes many biopsy-proven MCD cases. In adult MCD/primary FSGS
          cohorts, seropositivity tracks with active nephrotic syndrome, more severe proteinuria, and
          relapse dynamics, supporting nephrin-directed immune injury in a subset rather than all MCD.

          '
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        - preferred_term: Podocyte
          term:
            id: CL:0000653
            label: podocyte
      selected_evidence:
        snippet: Since the discovery of antinephrin antibodies and antibodies against other slit diaphragm
          components in a subset of patients with minimal change disease and focal segmental glomerulosclerosis,
          there has been a transformation of our understanding of disease pathogenesis and treatment rationale.
        supports: SUPPORT
