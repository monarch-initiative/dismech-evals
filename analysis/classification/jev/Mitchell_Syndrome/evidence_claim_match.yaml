          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: Recurrent heterozygous germline (usually de novo) ACOX1 c.710A>G, p.Asn237Ser.
        molecular_functions:
        - preferred_term: acyl-CoA oxidase activity
          term:
            id: GO:0003997
            label: acyl-CoA oxidase activity
          modifier: INCREASED
        cellular_components:
        - preferred_term: peroxisomal matrix
          term:
            id: GO:0005782
            label: peroxisomal matrix
      selected_evidence:
