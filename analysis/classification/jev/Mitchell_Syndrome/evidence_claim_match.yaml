      assertion_type: Treatment
      assertion:
        name: Antioxidant Therapy
        description: Antioxidants target the excess ROS produced by the gain-of-function oxidase. N-acetylcysteine
          amide (NACA) rescues the fly and Schwann cell models but is not approved for human use, so patients
          have received N-acetylcysteine (NAC) instead. NAC was followed by an 11-month improvement in
          the index patient, who later died of a CNS flare, and by no improvement in another patient;
          NAC penetrates the blood-brain barrier poorly.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: N-acetylcysteine amide
            term:
              id: CHEBI:231847
              label: N-Acetylcysteine amide
          - preferred_term: N-acetylcysteine
            term:
              id: CHEBI:28939
              label: N-acetyl-L-cysteine
      selected_evidence:
        snippet: Interestingly, the toxic effects of hACOX1WT and hACOX1N237S in rat Schwann cells are
          strongly suppressed by NACA (Figure 6B) when compared to vehicle control.
        supports: SUPPORT
