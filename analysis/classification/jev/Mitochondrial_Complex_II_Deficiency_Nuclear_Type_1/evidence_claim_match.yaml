  890d0b1b0eb0c4ed9c4f33ba4d90898fe93c9496fabc07c7aac97a4eadfc0cf5:
    claim:
      about:
        disease:
          name: Mitochondrial Complex II Deficiency, Nuclear Type 1
          disease_term:
            preferred_term: mitochondrial complex II deficiency, nuclear type 1
            term:
              id: MONDO:0100294
              label: mitochondrial complex II deficiency, nuclear type 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_no_faithful_sdha_animal_model
        prompt: Do the available whole-organism complex II mouse models faithfully recapitulate SDHA nuclear
          type 1 disease, given that the principal inducible Leigh-like mouse model disrupts Sdhc (not
          SDHA) by abrupt systemic knockout rather than the hypomorphic biallelic SDHA alleles seen in
          patients?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#SDHA Loss and Complex II (Succinate Dehydrogenase) Deficiency
        - pathophysiology#Bioenergetic Failure and Multisystem Energy Deficit
        rationale: The best whole-organism complex II model - an inducible systemic SDH-loss mouse - produces
          a lethal Leigh-like syndrome and validates the general consequence of complex II failure, and
          chronic hypoxia rescues it. However, it disrupts Sdhc, not SDHA, and uses abrupt complete knockout
          rather than the partial-function hypomorphic biallelic SDHA alleles that cause human disease.
          It therefore models complex II failure in general but not the SDHA genotype, residual-activity
          biology, or the human neuroanatomy of Leigh lesions. This is a translational-validity gap (a
          model exists but does not phenocopy the SDHA genotype/tissue context), so it is flagged as HUMAN_MODEL_MISMATCH.
          Isogenic CRISPR-corrected SDHA patient iPSC-derived neurons and organoids are the emerging route
          to a faithful model.
        proposed_experiments:
        - experiment_id: exp_sdha_ipsc_neuron_complexII
          name: SDHA patient iPSC-derived neuron complex II assembly and bioenergetics assay
          description: Generate isogenic CRISPR-corrected and SDHA-mutant human iPSC-derived neurons and
            quantify complex II assembly, succinate-supported respiration, ATP/phosphocreatine production,
            and susceptibility to metabolic stress, testing whether hypomorphic biallelic SDHA alleles
            reproduce the severe, cell-type-specific bioenergetic failure that the Sdhc mouse cannot capture.
          experiment_type:
            preferred_term: iPSC-derived neuron perturbation assay
          model_systems:
          - name: Human iPSC-derived neuron
            description: Neurons differentiated from SDHA-mutant patient iPSCs (with isogenic corrected
              controls), preserving the human SDHA genotype and neuronal context absent from the Sdhc
              mouse.
            experimental_model_type: OTHER
      selected_evidence:
        snippet: Its pathogenicity was confirmed by lentiviral complementation experiments on the fibroblasts
          of patients carrying this mutation.
        supports: SUPPORT
