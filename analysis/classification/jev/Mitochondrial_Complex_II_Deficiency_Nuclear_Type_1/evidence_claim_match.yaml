      assertion_type: Pathophysiology
      assertion:
        name: Bioenergetic Failure and Multisystem Energy Deficit
        description: 'Reduced electron flux through the respiratory chain lowers oxidative phosphorylation
          and forces a shift to anaerobic glycolysis, elevating lactate and producing lactic acidosis.
          Energy-demanding post-mitotic tissues (brain, skeletal muscle, optic nerve, and sometimes heart)
          are preferentially affected, giving the characteristic Leigh-spectrum and multisystem phenotype.

          '
        biological_processes:
        - preferred_term: oxidative phosphorylation
          term:
            id: GO:0006119
            label: oxidative phosphorylation
          modifier: DECREASED
        - preferred_term: lactate biosynthetic process
          term:
            id: GO:0019249
            label: lactate biosynthetic process
          modifier: INCREASED
      selected_evidence:
        snippet: Genetic disorders of the mitochondrial respiratory chain are often characterized by hypotonia,
          growth retardation, cardiomyopathy, myopathy, neuropathy, organ failure, and metabolic derangement.
        supports: SUPPORT
