        prevalence_class: ULTRA_RARE
        notes: 'No population prevalence estimate exists. Isolated complex II deficiency accounts for
          only 2-4% of oxidative phosphorylation defects, and recessive SDHD disease had been reported
          in one Swiss child, one Irish neonate and one extended Palestinian family (four affected children)
          when it was consolidated as a disease gene in 2021.

          '
      selected_evidence:
        snippet: Previously, only two individuals with candidate biallelic SDHD variants and isolated
          complex II deficiency have been reported
        supports: SUPPORT
