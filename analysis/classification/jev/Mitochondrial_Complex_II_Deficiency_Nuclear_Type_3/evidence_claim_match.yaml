            label: succinate dehydrogenase (quinone) activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: respiratory chain complex II assembly
          term:
            id: GO:0034552
            label: respiratory chain complex II assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Native polyacrylamide gel electrophoresis and western blotting demonstrated an impaired
          complex II assembly.
        supports: SUPPORT
