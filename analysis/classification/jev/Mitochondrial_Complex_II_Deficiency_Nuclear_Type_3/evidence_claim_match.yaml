            label: lactate biosynthetic process
          modifier: INCREASED
      selected_evidence:
        snippet: explaining why common findings include optic atrophy, leukoencephalopathy, myopathy,
          cardiomyopathy and Leigh syndrome
        supports: SUPPORT
        directness: INDIRECT
