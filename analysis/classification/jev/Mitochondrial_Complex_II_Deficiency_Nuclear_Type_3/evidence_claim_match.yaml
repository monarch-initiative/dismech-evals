  8c207c9d0cd26373509e182c87d69081c186514a1e67d50cd016d7b1cac352ff:
    claim:
      about:
        disease:
          name: Mitochondrial Complex II Deficiency, Nuclear Type 3
          disease_term:
            preferred_term: mitochondrial complex II deficiency, nuclear type 3
            term:
              id: MONDO:0030937
              label: mitochondrial complex 2 deficiency, nuclear type 3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sdhd_complex_ii_no_disease_specific_therapy
        prompt: Is there any treatment that modifies the course of SDHD-related complex II deficiency?
          Riboflavin has been tried in other complex II-deficient children, but no SDHD patient has a
          reported treatment trial.
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#
        rationale: The literature on recessive SDHD disease consists of three case reports covering six
          patients, none of which reports a therapeutic intervention, so the treatments section is deliberately
          empty. Riboflavin, the precursor of the FAD cofactor carried by the SDHA flavoprotein, has been
          given empirically to children with isolated complex II deficiency of unstated genotype, with
          stabilization in some. Whether it could help a defect of the SDHD membrane-anchor subunit, which
          does not carry FAD, is unknown.
