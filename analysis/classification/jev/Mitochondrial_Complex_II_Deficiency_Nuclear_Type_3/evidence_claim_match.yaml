        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Succinate Oxidation and Electron Transfer to Ubiquinone
        biological_scale: MOLECULAR
        description: 'Deficient complex II activity impairs oxidation of succinate to fumarate and the
          transfer of the resulting electrons to ubiquinone, disrupting the single enzyme that links the
          tricarboxylic acid cycle to the respiratory electron transport chain. Residual complex II activity
          in patient muscle was about 30% of control with complexes I, III and IV normal, and the equivalent
          yeast sdh4 substitution abolishes oxidative growth.

          '
        biological_processes:
        - preferred_term: mitochondrial electron transport, succinate to ubiquinone
          term:
            id: GO:0006121
            label: mitochondrial electron transport, succinate to ubiquinone
          modifier: DECREASED
        - preferred_term: tricarboxylic acid cycle
          term:
            id: GO:0006099
            label: tricarboxylic acid cycle
          modifier: DECREASED
      selected_evidence:
        snippet: Consistent with the reduction of SDHD steady-state levels and fully assembled complex
          II found in our patient, the p.(Asp92Gly) mutation was detrimental to both oxidative growth
          and succinate dehydrogenase activity in yeast.
        supports: SUPPORT
