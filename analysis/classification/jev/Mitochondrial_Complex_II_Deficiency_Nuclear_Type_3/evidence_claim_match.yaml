      assertion_type: Pathophysiology
      assertion:
        name: SDHD Loss and Impaired Complex II Assembly
        biological_scale: MOLECULAR
        description: 'Biallelic SDHD variants (missense substitutions in the transmembrane helices, or
          a stop-loss extension) destabilize the membrane-anchor subunit of succinate dehydrogenase. Patient
          tissue shows reduced steady-state levels of SDHD and of the catalytic SDHA subunit and less
          fully assembled complex II, consistent with degradation of subunits that cannot be incorporated
          into the holoenzyme.

          '
        genes:
        - preferred_term: SDHD
          term:
            id: hgnc:10683
            label: SDHD
        molecular_functions:
        - preferred_term: succinate dehydrogenase (quinone) activity
