            term:
              id: MONDO:0032617
              label: mitochondrial complex I deficiency, nuclear type 11
        context:
        - path: /pathophysiology/1
          value:
            name: MCIA Complex Dysfunction
            description: NDUFAF1 does not work alone. It is one of four core components of the mitochondrial
              complex I intermediate assembly (MCIA) complex, with ECSIT, ACAD9 and TMEM126B, and that
              complex builds the ND2 module of complex I. Knocking out any one component is enough to
              impair complex I assembly, which is why an assembly-factor gene behaves like a structural
              one clinically.
            biological_scale: MOLECULAR
            cellular_components:
            - preferred_term: mitochondrial inner membrane
              term:
                id: GO:0005743
                label: mitochondrial inner membrane
            notes: 'This node says NDUFAF1 belongs to the MCIA complex and that the complex is required
              for the ND2 module. It deliberately does not assert that patient NDUFAF1 variants destabilise
              the rest of the complex: the knockout hierarchy in the cited paper is a cell-line experiment
              on each component in turn, not an observation in patient material, and no cached source
              measures ECSIT, ACAD9 or TMEM126B in an NDUFAF1 patient. `kb/disorders/ACAD9_Deficiency.yaml`
              models the same complex from the ACAD9 side.'
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Failure of Early Complex I Assembly
        causal_link_type: DIRECT
        description: A defective MCIA complex cannot build the intermediate it exists to build.
      selected_evidence:
        snippet: Cell knockout studies reveal that while each MCIA component is critical for complex I
          assembly, a hierarchy of stability exists centered on ACAD9
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1/downstream/0
      evidence_path: /pathophysiology/1/downstream/0/evidence/0
      context_paths:
      - /name
