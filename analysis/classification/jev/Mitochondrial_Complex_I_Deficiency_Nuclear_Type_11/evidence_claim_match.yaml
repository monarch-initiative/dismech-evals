    evidence_metadata:
      reference: PMID:32320651
      reference_title: Dissecting the Roles of Mitochondrial Complex I Intermediate Assembly Complex Factors
        in the Biogenesis of Complex I.
      evidence_source: IN_VITRO
      explanation: Establishes that losing any single MCIA component impairs complex I assembly, which
