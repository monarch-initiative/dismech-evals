              label: mitochondrial complex I deficiency, nuclear type 11
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ndufaf1_direct_versus_indirect_assembly_role
        kind: CONTROVERSY
        status: OPEN
        prompt: Does NDUFAF1 promote complex I assembly by binding early assembly intermediates directly,
          or is its involvement indirect?
        attaches_to:
        - pathophysiology#Failure of Early Complex I Assembly
        rationale: 'The founding EMBO J paper reports CIA30 associating with newly translated mtDNA-encoded
          subunits at early assembly and dissociating later, which reads as direct chaperoning and is
          what this entry''s main chain assumes. A survey of complex I-deficient patient cells published
          the same year reaches the opposite reading: NDUFAF1''s association with the 500-850 kDa subcomplexes
          did not track the nature or severity of the assembly defect, and persisted even in a patient
          whose assembly intermediates were absent because of an unrelated translation-elongation defect.
          If NDUFAF1 stays bound when there is nothing to bind, the association is not obviously the mechanism.
          This matters for the entry because the ROS arm attributes the metabolic phenotype to the intermediates
          themselves, and that arm is unaffected either way - but the description of what NDUFAF1 does
          at the assembly step is not settled by anything cached here.'
      selected_evidence:
        snippet: the human complex I assembly factor CIA30 (complex I intermediate associated protein)
          associates with newly translated mtDNA-encoded complex I subunits at early stages in their assembly
          before dissociating at a later stage
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
