  53371e498481f2702ddfd6e2bbe71c576a21b2385c9cf4fe2e148a778856ecdf:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 11
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 11
            term:
              id: MONDO:0032617
              label: mitochondrial complex I deficiency, nuclear type 11
        context: []
      assertion_type: Environmental
      assertion:
        name: Intercurrent infection
        description: Not a cause of the disease - this is a Mendelian disorder - but the trigger that
          converted compensated disease into decompensation in two of the four published patients. The
          index patient's cardiomyopathy declared itself during a viral illness at fifteen months, and
