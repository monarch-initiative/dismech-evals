      assertion_type: Inheritance
      assertion:
        name: X-linked inheritance
        inheritance_term:
          preferred_term: X-linked inheritance
          term:
            id: HP:0001417
            label: X-linked inheritance
        description: NDUFA1 is X-chromosomal, which sets this entity apart from the largely autosomal
          recessive complex I series. Affected patients described first were hemizygous males, and the
          male preponderance of earlier complex I cohorts was itself the clue that led investigators to
          the X chromosome. Heterozygous female carriers were initially assumed unaffected, but that is
          not reliably true — see the skewed X-inactivation node.
      selected_evidence:
        snippet: Two novel p.Gly8Arg and p.Arg37Ser hemizygous mutations in NDUFA1 were identified in
          two unrelated male patients presenting with Leigh's syndrome and with myoclonic epilepsy and
          developmental delay, respectively.
        supports: SUPPORT
