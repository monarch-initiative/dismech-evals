      assertion:
        name: Skewed X-Inactivation in Heterozygous Females
        biological_scale: CELLULAR
        role: modifier
        mechanism_confidence: ESTABLISHED
        description: Because NDUFA1 is X-linked, a heterozygous female is a mosaic of cells expressing
          either the wild-type or the mutant allele, and her phenotype depends on which allele is active
          in the affected tissue. In the reported affected girl, 72% of NDUFA1 mRNA in muscle carried
          the mutation and 74% of the active allele in that muscle was the paternally inherited one —
          skewing toward the mutant allele in the very tissue that was biochemically deficient. This is
          why heterozygous females cannot be assumed to be unaffected carriers, and it modifies the whole
          chain rather than sitting at one point in it.
      selected_evidence:
        snippet: Analysis of the cDNA showed that 72% of the expressed mRNA was mutated in the muscle
          biopsy sample.
        supports: SUPPORT
