        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'NDUFA1 (Xq24) encodes MWFE, an accessory subunit of complex I. It is one of only two X-chromosomal
          nuclear genes among the 58 that control complex I biogenesis — NDUFB11 is the other — which
          is what makes this entity''s inheritance pattern unusual within the complex I series and offers
          a mechanism for sex-dependent variation in presentation. Reported alleles are missense: p.Gly8Arg,
          p.Arg37Ser, c.55C>T (hemizygous males) and p.Gly32Arg (affected heterozygous female).'
      selected_evidence:
        snippet: Two of these are X-chromosome linked nuclear (nDNA) genes (NDUFA1 and NDUFB11), and 7
          are mitochondrial (mtDNA, MT-ND1-6, -4L) genes, which may be responsible for sex-dependent variation
          in the presentation of mitochondrial diseases.
        supports: SUPPORT
