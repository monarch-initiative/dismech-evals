      assertion_type: Pathophysiology
      assertion:
        name: Impaired NADH-Ubiquinone Oxidoreduction and OXPHOS Deficit
        conforms_to: complex_i_deficiency#Impaired NADH:Ubiquinone Oxidoreduction and ATP Synthesis
        biological_scale: CELLULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: Less intact complex I means less NADH oxidation and less electron delivery to ubiquinone,
          reducing proton pumping and oxidative phosphorylation capacity. NADH that cannot be reoxidized
          through the respiratory chain is instead consumed by cytosolic lactate dehydrogenase, which
          is why the biochemical signature is lactic acidosis and a raised lactate-to-pyruvate ratio.
          The deficiency is partial rather than complete — the mouse model of an equivalent allele shows
          roughly 50% residual activity — consistent with survival to presentation rather than embryonic
          lethality.
        biological_processes:
        - preferred_term: mitochondrial electron transport, NADH to ubiquinone
          modifier: DECREASED
          term:
            id: GO:0006120
            label: mitochondrial electron transport, NADH to ubiquinone
        - preferred_term: oxidative phosphorylation
          modifier: DECREASED
          term:
            id: GO:0006119
            label: oxidative phosphorylation
        molecular_functions:
        - preferred_term: NADH dehydrogenase (ubiquinone) activity
          modifier: DECREASED
          term:
            id: GO:0008137
            label: NADH dehydrogenase (ubiquinone) activity
      selected_evidence:
        snippet: The S55A mutation caused systemic partial Complex I deficiency of ∼50% in both sexes.
        supports: SUPPORT
