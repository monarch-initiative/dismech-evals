        name: Whole Exome Sequencing after Negative mtDNA Analysis
        description: Complex I deficiency can arise from either genome. Where whole mitochondrial DNA
          sequencing is negative or identifies only a non-pathogenic variant, exome sequencing of the
          nuclear genes is what reaches an NDUFA1 diagnosis — and a molecular diagnosis is what makes
          accurate genetic counselling possible, which matters especially here given X-linked transmission.
      selected_evidence:
        snippet: Our results demonstrate that it is important to perform whole mtDNA sequencing rather
          than only typing reported mutations.
        supports: SUPPORT
