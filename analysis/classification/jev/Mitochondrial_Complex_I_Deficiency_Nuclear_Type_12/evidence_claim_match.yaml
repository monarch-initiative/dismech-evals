          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          description: Germline missense variants in the X-chromosomal NDUFA1 gene, hemizygous in affected
            males and heterozygous in the reported affected female.
        molecular_functions:
        - preferred_term: NADH dehydrogenase (ubiquinone) activity
          term:
            id: GO:0008137
            label: NADH dehydrogenase (ubiquinone) activity
          modifier: DECREASED
      selected_evidence:
        snippet: The resulting allele Ndufa1S55A introduced systemic serine-55-alanine (S55A) mutation
