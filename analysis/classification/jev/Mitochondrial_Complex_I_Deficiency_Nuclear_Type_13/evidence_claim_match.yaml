      assertion_type: Pathophysiology
      assertion:
        name: Destabilisation of the NDUFA2-NDUFS1 Contact
        biological_scale: MOLECULAR
        description: 'NDUFA2 binds the matrix arm through a single interface. It has exclusive contacts
          with the core subunit NDUFS1, made mostly through the flat four-stranded beta-sheet of its thioredoxin-like
          fold, and it sits at least 40 angstroms from any iron-sulfur cluster - so it cannot be doing
          chemistry, and what it can be doing is holding NDUFS1 in place. Both patient missense residues
          map to that interface: Lys45 contacts several NDUFS1 residues directly, and Glu57 makes a probable
          ion pair with NDUFS1 Arg382. The reading is that these alleles weaken the contact rather than
          remove the protein.'
        genes:
        - preferred_term: NDUFA2
          term:
            id: hgnc:7685
            label: NDUFA2
        - preferred_term: NDUFS1
          term:
            id: hgnc:7707
            label: NDUFS1
        mechanism_confidence: PROVISIONAL
        notes: The interface itself is established from cryo-EM structures of mammalian complex I. The
          step from a patient residue to a destabilised contact is a structural inference and is stated
          as one by the source, which says the binding is "likely" destabilised. Nobody has measured NDUFA2-NDUFS1
          binding, NDUFA2 abundance or complex I assembly for either missense allele in a patient cell.
          That is why the node is PROVISIONAL and why the genetic_context keeps LOSS_OF_FUNCTION rather
          than claiming a partial one.
      selected_evidence:
        snippet: This residue is at the interface with NDUFS1 and makes a possible ion pair with Arg382
          of NDUFS1.
