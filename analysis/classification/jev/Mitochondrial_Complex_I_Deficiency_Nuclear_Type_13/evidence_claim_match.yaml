  d1d67ec000124bcdfdee57561786d6f4d3d202bf7eeaa2f96e67ff62a57cceb2:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 13
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 13
            term:
              id: MONDO:0032618
              label: mitochondrial complex I deficiency, nuclear type 13
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn13_no_treatment_or_natural_history
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#
        - progression#Childhood leukodystrophic course
        prompt: Is there anything to curate under treatments, and what is actually known about the course?
        rationale: 'No, and very little.

          Nothing disease-modifying exists for NDUFA2 deficiency, no treatment or response is reported
          for any of the four patients, and no trial is registered for the gene or the disorder. The one
          intervention in the literature, baculovirus complementation of patient fibroblasts, is an experiment
          establishing causality and is curated where it belongs, under experimental_models with a RESCUES
          link and its limitations attached. This entry therefore has no treatments block.

          Supportive management of mitochondrial disease, and the management recommendations in the GeneReviews
          Leigh syndrome spectrum chapter, are both ready-made content that would look right here. Importing
          either would assert of four NDUFA2 patients an experience recorded only of other people with
          other genotypes, and in an exported graph the borrowed annotation would be indistinguishable
          from an observed one.

          Natural history is thinner than the progression block may suggest. What exists is three single-patient
          courses and one death, and two of the three are known only as an age at last evaluation. There
          is no age-of-onset distribution, no survival estimate and no imaging series. Closing that needs
          no new science - a follow-up report on the four published patients would do it.'
      selected_evidence:
        snippet: Biallelic variants in nuclear gene NDUFA2 have been reported so far in only three children
          with variable presentations including Leigh syndrome or leukoencephalopathy.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
