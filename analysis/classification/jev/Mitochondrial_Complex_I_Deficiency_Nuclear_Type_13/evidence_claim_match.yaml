  dd9dfc7bc5fb31527c30c3d2bd15c4a91c4ca4be553e396fdd867beede8396df:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 13
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 13
            term:
              id: MONDO:0032618
              label: mitochondrial complex I deficiency, nuclear type 13
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Complex I N-Module Assembly
        biological_scale: MOLECULAR
        description: Losing NDUFA2 does not just weaken complex I, it prevents part of it from being built.
          In knockout cell lines, blue native electrophoresis shows the N-module only partly assembled,
          with the core subunits NDUFS1, NDUFV1 and NDUFV2 lost along with the accessory subunits NDUFS4,
          NDUFS6, NDUFA7 and NDUFV3. The N-module carries the NADH binding site, which is why activity
          falls further than the amount of residual complex would suggest. In the founding patient the
          same effect was described as disturbed assembly of complex I.
        genes:
        - preferred_term: NDUFS1
          term:
            id: hgnc:7707
            label: NDUFS1
        - preferred_term: NDUFV1
          term:
            id: hgnc:7716
            label: NDUFV1
        - preferred_term: NDUFV2
          term:
            id: hgnc:7717
            label: NDUFV2
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex I assembly
          modifier: DECREASED
          term:
            id: GO:0032981
            label: mitochondrial respiratory chain complex I assembly
