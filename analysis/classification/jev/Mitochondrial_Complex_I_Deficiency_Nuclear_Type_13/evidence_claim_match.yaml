  d3c3aa56854f00821d780b32c7311c57800ea58e3235d115a5980e7fea9c0eee:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 13
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 13
            term:
              id: MONDO:0032618
              label: mitochondrial complex I deficiency, nuclear type 13
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn13_allele_class_and_phenotype
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Destabilisation of the NDUFA2-NDUFS1 Contact
        - pathophysiology#Bioenergetic Failure in Brain and Heart
        prompt: Does the null allele give Leigh disease and the interface missense alleles give leukodystrophy,
          or is the difference something else?
        rationale: 'Four patients, two phenotypes, and a suspiciously tidy correspondence with allele
          class.

          The one patient with Leigh disease and hypertrophic cardiomyopathy, who died at eleven months,
          is homozygous for a splice allele in which neither protein nor transcript was detectable - a
          demonstrated null. The three patients with leukodystrophy who survived into childhood carry
          missense alleles at the NDUFS1 interface, or one such allele in trans with a frameshift, and
          the structural reading of those is a weakened contact rather than an absent protein. Residual
          function explaining severity is the obvious hypothesis and it is consistent with everything
          published.

          Three things stop it being an answer. Nobody has quantified residual NDUFA2 protein or residual
          complex I activity in the missense patients, so "hypomorphic" is a structural inference and
          not a measurement; the one patient with a compound heterozygous genotype carries a frameshift
          on the other allele, which should place her closer to the null end than her phenotype does;
          and four patients across three laboratories and twelve years are not a genotype-phenotype series.
          It is also worth noting that the review from which the structural argument comes describes the
          p.Lys45Thr patient''s course in detail while the primary report''s abstract does not, so the
          clinical and structural claims here rest partly on a secondary source.

          What would settle it is unglamorous and cheap: complex I activity, assembled complex I and NDUFA2
          abundance measured in one laboratory in fibroblasts from a null patient and a missense patient
          side by side.'
        proposed_experiments:
        - experiment_id: exp_mc1dn13_residual_function
          name: Side-by-side biochemistry across the two allele classes
          description: Measure complex I activity, assembled complex I by blue native electrophoresis,
            complexome profile and NDUFA2 abundance in one laboratory, in fibroblasts from the splice-allele
            patient and from at least one interface-missense patient. If residual NDUFA2 and residual
            complex I track the phenotype, the genotype-phenotype reading becomes a mechanism; if they
            do not, the difference lies somewhere else and the entity needs a different explanation for
            its two poles.
      selected_evidence:
        snippet: No protein or transcript was found, making it a null mutation.
        supports: SUPPORT
