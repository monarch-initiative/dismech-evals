            term:
              id: MONDO:0032618
              label: mitochondrial complex I deficiency, nuclear type 13
        context: []
      assertion_type: Genetic
      assertion:
        name: NDUFA2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: NDUFA2
          term:
            id: hgnc:7685
            label: NDUFA2
        notes: 'NDUFA2 is on chromosome 5 and encodes a 99-residue, roughly 10.9 kDa accessory subunit
          of complex I, also known as B8. It is not catalytic: it has a compact thioredoxin-like fold
          with a flat four-stranded beta-sheet, sits on the matrix arm, and lies at least 40 angstroms
          from any iron-sulfur cluster. Two cysteines sit in the loops of the sheet but are not oxidised
          in the available mammalian complex I structures, so the thioredoxin resemblance is structural
          rather than functional.

          A caution for anyone extending this entry from the gene rather than from the disease. A homozygous
          NDUFA2 p.Asp50Asn was reported in one individual in a breast cancer screen; the residue is not
          at the NDUFS1 interface and the significance is explicitly uncertain. It is not a mitochondrial
          disease allele and is not curated here.'
      selected_evidence:
        snippet: The mutation in this accessory subunit causes reduced activity and disturbed assembly
          of complex I.
        supports: SUPPORT
    origin:
