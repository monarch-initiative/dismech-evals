  caff713c91929576620e9486258765a6abd97e080565cd2089e5a2fd5ea01524:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 13
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 13
            term:
              id: MONDO:0032618
              label: mitochondrial complex I deficiency, nuclear type 13
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn13_carnitine_is_a_second_diagnosis
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - phenotypes#
        prompt: Why is decreased circulating carnitine not curated as a phenotype of this disorder?
        rationale: 'Because it belongs to a different disease in the same patient.

          The first of the two 2018 patients was initially diagnosed with primary systemic carnitine deficiency
          on the strength of a homozygous SLC22A5 variant, and the complex I deficiency was suspected
          only afterwards, when her developmental regression and cystic leukoencephalopathy did not fit.
          She therefore has two molecular diagnoses, and her low carnitine is attributable to the first.

          This matters because the HPO annotation set for OMIM:618235 includes decreased circulating carnitine
          concentration, sourced to that patient. Curating it from the HPOA row would import a dual-diagnosis
          confound into the knowledge base as an NDUFA2 phenotype, and it would then be indistinguishable
          from an observed feature of the disease in any export. It is not curated here.

          The general point is worth keeping: in a four-patient entity, one patient''s second diagnosis
          is a quarter of the apparent phenotype. Any future NDUFA2 phenotype claim that traces to this
          individual needs the SLC22A5 caveat stated in the same breath.'
      selected_evidence:
        snippet: The first patient was initially diagnosed with a primary systemic carnitine deficiency
          associated with a homozygous variant in SLC22A5, but also exhibited developmental regression
          and cystic leukoencephalopathy, and an additional diagnosis of complex I deficiency was suspected.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
