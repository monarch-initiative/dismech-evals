        description: Two damaged copies of NDUFA2. Four patients and four alleles are known and they fall
          into two classes. The founding case is homozygous for the splice variant c.208+5G>A, which causes
          most transcripts to skip exon 2 with a frameshift; no protein or transcript was detected, so
          it behaves as a null. The three later patients carry missense alleles at residues that contact
          NDUFS1 - p.Lys45Thr, homozygous in one and in trans with the frameshift p.Asn76Metfs*4 in another,
          and p.Glu57Ala homozygous in the fourth.
        genes:
