          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Three of the four patients are homozygous, which is the value recorded here; the
            fourth is compound heterozygous for p.Lys45Thr and the frameshift p.Asn76Metfs*4, and is described
            in the notes because the slot is single-valued.
          notes: 'LOSS_OF_FUNCTION covers the whole allelic set under this schema''s definition, "complete
            or partial reduction of normal gene product function", but the set is not homogeneous and
            the difference may be the most interesting thing about the disease. The splice allele is a
            demonstrated null - neither protein nor transcript was detected. The two interface missense
            alleles are a different kind of lesion: Lys45 and Glu57 both sit at the contact surface with
            NDUFS1, and the structural reading is that the NDUFA2-NDUFS1 binding is destabilised rather
            than that the protein is absent. No residual NDUFA2 protein has been quantified for any missense
            patient, so PARTIAL_LOSS_OF_FUNCTION would be a plausible reading of those two alleles that
            nothing has actually measured. The single value is set for the block; the allelic distinction
            is carried by the description here and by the open discussion.'
      selected_evidence:
        snippet: Screening of this gene on genomic DNA revealed a mutation that interferes with correct
          splicing and results in the skipping of exon 2.
        supports: SUPPORT
