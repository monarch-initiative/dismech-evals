        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Isolated Complex I Deficiency
        biological_scale: MOLECULAR
        conforms_to: mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress
        description: The measured biochemical endpoint, and the phenotype the entity is named for. The
          founding patient's deficiency was expressed in both skin fibroblasts and muscle, and it was
          isolated - the other respiratory chain complexes were spared, which is what a subunit dedicated
          to complex I predicts and what distinguishes this from the combined deficiencies caused by defects
          of mitochondrial gene expression. Transducing the patient's cells with a baculovirus expressing
          wild-type NDUFA2 partially restored complex I expression and activity, which is the experiment
          that makes the gene causal rather than merely associated.
        biological_processes:
        - preferred_term: mitochondrial electron transport, NADH to ubiquinone
          modifier: DECREASED
          term:
            id: GO:0006120
            label: mitochondrial electron transport, NADH to ubiquinone
        notes: Conformance note, following the sibling entries MC1DN24 and MC1DN34. The module node pairs
          decreased oxidative phosphorylation with increased reactive oxygen species. Only the first half
          is evidenced here - no reactive-oxygen measurement has been reported in an NDUFA2 patient -
          and the ROS arm is not asserted. The module's upstream node, age-related mitochondrial damage
          and mtDNA mutation, does not apply to a primary nuclear-gene subunit defect, so conformance
          is declared at this node alone.
      selected_evidence:
        snippet: We report 2 patients with cystic leukoencephalopathy and complex I deficiency with recessive
          mutations in NDUFA2, an accessory subunit of complex I.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
