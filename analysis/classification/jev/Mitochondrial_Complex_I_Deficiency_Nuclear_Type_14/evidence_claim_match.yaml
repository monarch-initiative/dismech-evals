        name: Mitochondrial-genome complex I deficiency
        description: A complex I deficiency caused by a variant in one of the seven mitochondrial-encoded
          subunits presents the same way biochemically but is maternally transmitted, may be heteroplasmic,
          and carries entirely different recurrence and reproductive counselling. Distinguishing it from
          a nuclear form such as MC1DN14 is the first branch point in the diagnostic pathway, not a refinement
          after it.
      selected_evidence:
        snippet: Approximately 25% of cases have mitochondrial DNA mutations, while a further ~25% have
          mutations in a nuclear subunit or in one of nine known assembly factors.
        supports: SUPPORT
