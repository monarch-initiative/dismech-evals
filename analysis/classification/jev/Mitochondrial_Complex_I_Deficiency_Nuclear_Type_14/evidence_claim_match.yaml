        - path: /experimental_models/0
          value:
            name: NDUFA11 siRNA knockdown in H9c2 cardioblasts
            experimental_model_type: CELL_LINE
            publication: PMID:30531981
            organism:
              preferred_term: rat
              term:
                id: NCBITaxon:10116
                label: Rattus norvegicus
            cell_source: H9c2 embryonic rat cardioblast line (ATCC)
            culture_system: Two-dimensional monolayer culture; siRNA transfection
            description: 'The only mammalian system in which NDUFA11 itself has been removed and the consequences
              measured, and therefore the most load-bearing piece of non-patient evidence in this entry.
              NDUFA11 was silenced with two independent siRNAs in H9c2 embryonic rat cardioblasts, and
              respirasome levels, individual complex activities, ATP, membrane potential and mitochondrial
              ROS were read out against a negative-control siRNA.

              Two features make it more than a single-gene knockdown. The first is the comparison arm:
              silencing SDHC, the membrane-anchored subunit of complex II, did not disintegrate the respirasome,
              so respirasome loss is not the generic consequence of removing any inner-membrane respiratory
              subunit. The second is that the authors chose NDUFA11 precisely because of the cryo-EM structures
              this entry also cites - so the biochemical and structural lines of evidence are one argument
              rather than two coincidences.'
          role: ancestor
        - path: /experimental_models/0/modeled_mechanisms/1
          value:
            target: Impaired Mitochondrial NADH Reoxidation and ATP Synthesis
            relationship: RECAPITULATES
            fidelity: MODERATE
            description: NDUFA11 knockdown halves cellular ATP, depolarises the inner membrane and raises
              mitochondrial ROS - the bioenergetic consequences this node asserts, measured on loss of
              the gene this entry is about.
            limitations: 'An acutely silenced rat cell line, so it does not speak to the chronic, whole-organism
              energy deficit that reaches a patient''s heart and brain, and cardioblasts are proliferating
              cells whose energetic demands differ from those of post-mitotic myocardium.

              The ROS half of this link is not specific to NDUFA11: knocking down the complex II subunit
              SDHC raised mitochondrial ROS as well, and by a larger margin (114 and 82 percent, against
              62 and 30 percent for NDUFA11) even though the paper''s own prose characterises the two
              as similar effects. So raised mitochondrial ROS reads here as a general consequence of losing
              respiratory capacity rather than as a signature of losing this subunit. The membrane-potential
              half is a different matter - SDHC knockdown did not affect membrane potential at all - and
              that specificity is recorded on the readout below.'
