          systemic read-out of a respiratory chain defect and it is what one pole of the reported MC1DN14
          cohort presented with.

          Named for the mechanism rather than for the finding, so that it is not a near-duplicate of the
          `Lactic Acidosis` phenotype it feeds. The node is the reason lactate rises; the phenotype is
          the measured clinical consequence.'
      selected_evidence:
        snippet: The patients presented with encephalocardiomyopathy or fatal infantile lactic acidemia.
        supports: SUPPORT
