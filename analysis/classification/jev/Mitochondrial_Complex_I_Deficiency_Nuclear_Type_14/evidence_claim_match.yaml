  82ff1652366b8978169af107a8675193acdb71758676b1200cb596146e8f2867:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 14
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 14
            term:
              id: MONDO:0032619
              label: mitochondrial complex I deficiency, nuclear type 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Supercomplex Assembly
        biological_scale: MOLECULAR
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'The node that is specific to this subunit rather than generic to complex I deficiency.
          Two independent cryo-EM structures of the mammalian respirasome place NDUFA11 at the contact
          between complex I and complex III, and name it among the handful of complex I subunits that
          hold the supercomplex together. If that interface is what a patient loses, then MC1DN14 is not
          only a complex I deficiency but a supercomplex assembly defect.

          That is not merely inferred from the structures. Silencing NDUFA11 with two independent siRNAs
          in rat H9c2 cardioblasts disintegrates the respirasome and drops complex III and complex IV
          activity by 63-72 percent alongside complex I - and silencing a complex II subunit in the same
          system does not, so the effect is attributable to NDUFA11 rather than to perturbing the inner
          membrane. The C. elegans knockdown reports the same combination independently. So the mechanism
          itself is demonstrated, in the right gene, with a functional consequence and a negative control
          attached.

          It is graded PROVISIONAL rather than established because the step that remains untaken is the
          one to a patient. Nobody has run blue native gel electrophoresis on tissue from an NDUFA11-deficient
          patient and asked whether the respirasome is present, which is the experiment this node is waiting
          on and the subject of an open discussion below. Note also that the knockdown result cuts both
          ways for the entry''s own logic: reduced complex III and IV activity alongside complex I is
          what a supercomplex defect predicts, yet the patients'' biochemistry is described as an isolated
          complex I deficiency.'
        biological_processes:
        - preferred_term: respirasome assembly
          modifier: DECREASED
          term:
            id: GO:0097250
            label: mitochondrial respirasome assembly
      selected_evidence:
        snippet: The NDUFA11 and NDUFB9 supernumerary subunits of CI contribute to the oligomerization
          of CI and CIII.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27654917
      reference_title: The architecture of the mammalian respirasome.
      evidence_source: IN_VITRO
      explanation: Places NDUFA11 at the complex I to complex III interface. INDIRECT because it is a
        structural determination on purified porcine heart supercomplex, with no patient material and
        no disease claim.
