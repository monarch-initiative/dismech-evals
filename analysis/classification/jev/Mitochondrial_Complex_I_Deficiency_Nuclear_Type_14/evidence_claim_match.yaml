          the bacterial enzyme and does not itself carry out the redox chemistry; its interest is structural,
          and in mammalian respirasome structures it sits at the complex I to complex III interface. The
          single reported disease allele is a homozygous splice-site mutation predicted to remove the
          protein's first transmembrane domain.
