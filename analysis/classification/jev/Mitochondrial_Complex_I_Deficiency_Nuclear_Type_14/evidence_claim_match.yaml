            publication: PMID:34106255
            description: 'The only animal model of NDUFA11 loss in the literature, and it is informative
              in two settings at once. Complete knockout is developmentally lethal - homozygotes arrest
              at the L2 larval stage - so the null is not viable to characterise. Partial knockdown by
              RNAi permits development to adulthood and is what yields the phenotype: destabilised complex
              I and supercomplexes, disturbed respiration, a compensatory rise in complex II activity,
              and widened cristae junctions on cryo-electron tomography.

              The dose-dependence is the useful part. It says NDUFA11 function is required in a graded
              way rather than all-or-nothing, which is the shape a human hypomorphic allele would need
              in order to be survivable.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Destabilization of Assembled Complex I
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Knockdown of the NDUFA11 homologue destabilises complex I and its supercomplexes,
          which is the central molecular claim of this entry measured rather than predicted.
        limitations: C. elegans is an invertebrate whose respiratory chain and supercomplex organisation
          are similar but not identical to the mammalian one, and the perturbation is an engineered knockdown
          of expression rather than the patients' splice-site allele, so it models loss of the protein
          and not loss of this particular helix. The complete knockout is larval lethal, which no human
          patient is, so the model's viable arm is a hypomorph whose residual expression level does not
          correspond to any measured human value.
        readouts:
        - name: Complex I and supercomplex stability
          target: Destabilization of Assembled Complex I
          direction: DECREASED
          interpretation: Direct structural read-out of the destabilisation node in the knockdown animal.
        - name: Larval development to adulthood
          target: Destabilization of Assembled Complex I
          direction: ABOLISHED
          interpretation: Complete loss of the subunit arrests development at L2, establishing that the
            gene is essential in this organism and setting the ceiling on how much function a viable animal
            can lose.
      selected_evidence:
        snippet: We identified nduf-11 (B0491.5) as encoding the Caenorhabditis elegans homologue of NDUFA11.
        supports: SUPPORT
