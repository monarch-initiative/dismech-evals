              label: mitochondrial complex I deficiency, nuclear type 14
        context:
        - path: /experimental_models/0
          value:
            name: NDUFA11 siRNA knockdown in H9c2 cardioblasts
            experimental_model_type: CELL_LINE
            publication: PMID:30531981
            organism:
              preferred_term: rat
              term:
                id: NCBITaxon:10116
                label: Rattus norvegicus
            cell_source: H9c2 embryonic rat cardioblast line (ATCC)
            culture_system: Two-dimensional monolayer culture; siRNA transfection
            description: 'The only mammalian system in which NDUFA11 itself has been removed and the consequences
              measured, and therefore the most load-bearing piece of non-patient evidence in this entry.
              NDUFA11 was silenced with two independent siRNAs in H9c2 embryonic rat cardioblasts, and
              respirasome levels, individual complex activities, ATP, membrane potential and mitochondrial
              ROS were read out against a negative-control siRNA.

              Two features make it more than a single-gene knockdown. The first is the comparison arm:
              silencing SDHC, the membrane-anchored subunit of complex II, did not disintegrate the respirasome,
              so respirasome loss is not the generic consequence of removing any inner-membrane respiratory
              subunit. The second is that the authors chose NDUFA11 precisely because of the cryo-EM structures
              this entry also cites - so the biochemical and structural lines of evidence are one argument
              rather than two coincidences.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Supercomplex Assembly
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Loss of NDUFA11 disintegrates the respirasome and collapses the activity of the partner
          complexes, which is this node's claim measured directly rather than inferred from where the
          subunit sits in a structure.
        limitations: 'An immortalised rat cardioblast line under acute siRNA knockdown, not human patient
          tissue carrying the chronic splice-site allele, so it cannot show that the same thing happens
          in a person or that a lifetime of it is what makes patients ill. More substantively, the model
          and the disease disagree on one point that this entry records rather than smooths over: NDUFA11
          silencing cut complex III activity by 63-72 percent and complex IV by about 71 percent alongside
          complex I, whereas the patients'' biochemistry is reported as an *isolated* complex I deficiency.
          Either the patients'' allele is milder than an siRNA knockdown, or a supercomplex phenotype
          is present in patients and has not been looked for. Both are testable and neither has been tested.'
        readouts:
        - name: Respirasome level
          target: Impaired Supercomplex Assembly
          direction: DECREASED
          interpretation: Respirasome abundance falls with NDUFA11 loss, reproducibly across two independent
            siRNAs, though the size of the effect differs between them (13 percent versus 30 percent)
            - so the direction is solid and the magnitude is knockdown-depth dependent.
        - name: Complex III and complex IV enzymatic activity
          target: Impaired Supercomplex Assembly
          direction: DECREASED
          interpretation: 'The functional signature of a supercomplex defect rather than an isolated complex
            I lesion: losing a complex I subunit takes down the activity of the complexes it is docked
            against.'
        - name: Respirasome level after complex II subunit knockdown
          target: Impaired Supercomplex Assembly
          direction: UNCHANGED
          interpretation: 'The specificity control, and a real negative result: silencing the complex
            II subunit SDHC reduced complex II activity without disintegrating the respirasome, so the
            NDUFA11 effect is attributable to NDUFA11 rather than to perturbing the inner membrane in
            general.'
      selected_evidence:
        snippet: Our results demonstrate that NDUFA11 is involved in the respirasome assembly whereas
          SDHC is not a part of the respirasome.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0/modeled_mechanisms/0
      evidence_path: /experimental_models/0/modeled_mechanisms/0/evidence/0
