      assertion_type: Pathophysiology
      assertion:
        name: Loss of the NDUFA11 First Transmembrane Helix
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: PROVISIONAL
        description: 'The proposed protein-level consequence of the splice-site allele: the transcript
          loses the sequence encoding the first membrane-spanning helix, so the subunit can no longer
          be anchored in the inner membrane where it belongs.

          Graded PROVISIONAL deliberately. The source states this as a prediction, and the entry says
          the same. No western blot, no complexome profile, and no transcript analysis of a patient sample
          is reported in the material that can be verified here, so what is on record is a sequence-based
          inference about the mutant product and not a measurement of it.'
      selected_evidence:
        snippet: The mutation is predicted to abolish the first transmembrane domain of the gene product,
          thereby destabilizing the enzymatic complex.
        supports: SUPPORT
