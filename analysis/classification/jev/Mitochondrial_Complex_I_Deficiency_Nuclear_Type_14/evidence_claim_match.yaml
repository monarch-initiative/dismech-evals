        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: NDUFA11 is nuclear-encoded and autosomal, so this is a nuclear recessive mitochondrial
          disease rather than one of the maternally transmitted mitochondrial-genome forms of complex
          I deficiency. The defining cohort was found by homozygosity mapping across three unrelated families,
          which is a method that works only on a homozygous-by-descent recessive architecture, and the
          same splice-site allele was carried by all six patients.
      selected_evidence:
        snippet: Using homozygosity mapping, we identified a splice-site mutation in the NDUFA11 gene
          in six patients from three unrelated families.
        supports: SUPPORT
