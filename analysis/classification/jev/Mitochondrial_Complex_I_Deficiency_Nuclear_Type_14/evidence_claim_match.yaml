      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other nuclear-type mitochondrial complex I deficiencies
        description: Biochemically indistinguishable at the point of presentation. An isolated complex
          I deficiency with infantile lactic acidosis or an encephalocardiomyopathy can arise from a defect
          in any of the enzyme's nuclear-encoded subunits or its assembly factors, and the knowledge base
          already holds NDUFAF8 (type 34), NDUFB9 (type 24), NDUFA12 (type 23) and others. Only sequencing
          separates them, which is precisely why the diagnostic route is a panel rather than a targeted
          test.
      selected_evidence:
        snippet: Causative genetic defects may involve the seven mitochondrial-encoded or 38 nuclear-encoded
          subunits of the enzyme, or any of an increasing number of assembly factors implicated in the
          correct biosynthesis of complex I within the inner mitochondrial membrane.
        supports: SUPPORT
        directness: INDIRECT
