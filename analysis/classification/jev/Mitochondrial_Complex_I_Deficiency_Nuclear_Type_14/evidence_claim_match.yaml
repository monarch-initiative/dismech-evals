        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Destabilization of Assembled Complex I
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'Losing an accessory subunit of the membrane arm does not slow assembly, it destabilises
          the assembled enzyme. This is the node where the general complex I literature does the work
          that the NDUFA11 patient literature cannot: a systematic gene-editing study made human knockout
          lines for every accessory subunit and found that losing one destabilises the other subunits
          of its own structural module, and RNAi knockdown of the C. elegans NDUFA11 homologue destabilises
          complex I directly.

          Neither of those measurements was made on an NDUFA11 patient, and both are marked INDIRECT for
          that reason. What makes the node ESTABLISHED rather than provisional is that the human clinical,
          human cell-line, and invertebrate lines of evidence agree, and that the defining clinical paper
          reaches the same conclusion from the sequence.'
        biological_processes:
        - preferred_term: complex I assembly and stability
          modifier: DECREASED
          term:
            id: GO:0032981
            label: mitochondrial respiratory chain complex I assembly
      selected_evidence:
        snippet: Quantitative proteomic analysis of cell lines revealed that loss of each subunit affects
          the stability of other subunits residing in the same structural module.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27626371
      reference_title: Accessory subunits are integral for assembly and function of human mitochondrial
