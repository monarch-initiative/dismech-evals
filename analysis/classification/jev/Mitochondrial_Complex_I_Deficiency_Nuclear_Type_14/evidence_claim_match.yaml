      assertion_type: Diagnosis
      assertion:
        name: Nuclear gene panel or exome sequencing after biochemical complex I deficiency
        description: 'The workable route today is the reverse of how the entity was found. The defining
          cohort required genome-wide homozygosity mapping in consanguineous families, which is not a
          diagnostic test. In current practice the biochemical demonstration of an isolated complex I
          deficiency - usually on a muscle biopsy assayed for respiratory chain enzyme activities - directs
          sequencing to a nuclear complex I gene panel, on which NDUFA11 is listed in the United Kingdom
          best practice guidelines. That matters for an ultra-rare gene: the patient does not need anyone
          to have suspected NDUFA11 specifically.'
      selected_evidence:
        snippet: In addition, muscle biopsy is extremely useful for histology, histochemistry and respiratory
          chain enzyme studies to help investigate a diagnosis of mitochondrial or other diseases.
        supports: SUPPORT
        directness: INDIRECT
