      assertion_type: Diagnosis
      assertion:
        name: Recurrence counselling after a nuclear gene diagnosis
        description: Once the gene is known, counselling follows the mode of inheritance of that gene
          rather than the mitochondrial-inheritance rules families often expect to hear. For NDUFA11 that
          means the ordinary autosomal recessive figures - a one in four recurrence risk for full siblings,
          no maternal transmission - and the distinction is worth making explicitly to a family who have
          been told they have a mitochondrial disease.
      selected_evidence:
        snippet: In families with a nuclear gene diagnosis of mitochondrial disease, counselling and further
          family testing is related to the mode of inheritance of the specific gene (autosomal dominant,
          autosomal recessive or X-linked).
        supports: SUPPORT
        directness: INDIRECT
