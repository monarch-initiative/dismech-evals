            term:
              id: MONDO:0032620
              label: mitochondrial complex I deficiency, nuclear type 15
        context: []
      assertion_type: Treatment
      assertion:
        name: TAT-mediated NDUFAF4 Protein Replacement
        therapeutic_modality: PROTEIN_REPLACEMENT
        description: 'A preclinical attempt at a gene-directed therapy. Recombinant NDUFAF4 was fused
          to the HIV TAT cell-penetrating peptide, expressed in E. coli, purified, and applied to fibroblasts
          from a patient in the founding family. The fusion protein reached the cells and their mitochondria,
          raised complex I activity and ATP production, increased cell number, and lowered reactive oxygen
          species.

          It has never left cell culture. There is no animal work, no pharmacokinetics, no dosing and
          no trial - and the delivery problem this approach would have to solve in a patient is exactly
          the one cell culture does not test, since the affected organs are brain and optic nerve. It
          is curated because it is a real, published, mechanism-directed intervention for this specific
          gene, and because the alternative - listing nothing under treatments - would misrepresent the
          state of the field.

          No therapeutic_agent is bound: no CHEBI or NCIT term names a TAT-NDUFAF4 fusion protein, and
          binding a term for something else would be worse than leaving the slot empty.'
        treatment_term:
          preferred_term: protein replacement therapy with a TAT-NDUFAF4 fusion protein
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: Moreover, we observed an increase in ATP production, a decrease in the content of mitochondria
          and a decrease in the level of reactive oxygen species.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/1
