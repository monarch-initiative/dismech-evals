  8733a32d4487a1c96eca8873a7bcfdbe244e2f4ccbf050f70aa8741fed3ecbfe:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 15
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 15
            term:
              id: MONDO:0032620
              label: mitochondrial complex I deficiency, nuclear type 15
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn15_genotype_phenotype_domain_hypothesis
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#NDUFAF4
        - pathophysiology#Loss of NDUFAF4 from Q-Module Assembly Intermediates
        prompt: Does where in NDUFAF4 a variant sits determine whether a patient dies in infancy of encephalopathy
          or lives with isolated optic atrophy?
        rationale: 'The clinical range of this gene is as wide as any in the MC1DN series - fatal neonatal
          encephalopathy at one end, isolated optic atrophy at the other - and there is one structural
          observation that might explain it.

          The 2026 series notes that the optic-atrophy missense allele p.I138T lies in a well-modelled
          globular domain of NDUFAF4, clearly distant from the Leigh-associated variants reported previously,
          which affect the N-terminus. It offers a reason why that might matter: N-terminal variants may
          impair mitochondrial import of the assembly factor rather than its function once inside, which
          would reduce the amount of protein reaching the matrix at all. A severe import defect and a
          partial functional defect would be expected to differ in severity.

          Three things stop this being a finding. The prediction is in silico, from AlphaFold models and
          folding-stability predictors; no import assay has been done on any NDUFAF4 allele. The correlation
          is not clean even in the reported patients: the optic-atrophy proband from Family S carries
          the p.I138T globular-domain allele in trans with a frameshift, p.(P75Lfs*7), which should behave
          as a null and yet the phenotype is still isolated optic atrophy. And the founding family undercuts
          any simple genotype rule from a different direction: one patient with the same homozygous allele
          as five relatives who had infantile encephalomyopathy presented instead with antenatal cardiomyopathy,
          so within-genotype variation is already documented for this gene.

          Why it matters: a laboratory reporting a new biallelic NDUFAF4 genotype has no basis for prognosis
          today. The experiment that would create one is a mitochondrial import and steady-state abundance
          assay across the reported allelic series, which is small enough to do exhaustively.'
        proposed_experiments:
        - experiment_id: mc1dn15_import_assay_across_alleles
          name: Mitochondrial import and steady-state abundance across the NDUFAF4 allelic series
          description: Import assays and steady-state protein measurement for each reported NDUFAF4 allele
            - p.(Ala3Pro), p.(Leu65Pro), p.(Pro75LeufsTer7), p.(Ile138Thr), p.(Glu160Ter) - expressed
            on a common null background, with complex I assembly and activity read out in parallel.
          would_support:
          - pathophysiology#Loss of NDUFAF4 from Q-Module Assembly Intermediates
          supporting_outcome:
          - N-terminal alleles showing reduced import and lower matrix abundance than the globular-domain
            allele, tracking with clinical severity, would establish import efficiency as the variable
            behind the phenotypic range.
          refuting_outcome:
          - Comparable import and abundance across alleles of very different clinical severity would refute
            the import hypothesis and point instead to modifiers, residual assembly-factor activity, or
            tissue-specific thresholds.
      selected_evidence:
        snippet: The mutation was also detected in a patient who presented with antenatal cardiomyopathy.
        supports: REFUTE
