        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Every reported patient carries two NDUFAF4 alleles. The founding family is consanguineous
          and homozygous for a missense change; the Leigh-syndrome patient and the two siblings with neonatal
          encephalopathy are each homozygous for a different allele; the optic-atrophy families are compound
          heterozygous in one and homozygous in the other. NDUFAF4 is nuclear-encoded and autosomal, so
          this is a nuclear recessive mitochondrial disease, with the 25 percent sibling recurrence risk
          and absence of maternal transmission that distinguishes it from the mitochondrial-genome forms
          of complex I deficiency.
      selected_evidence:
        snippet: The proband from Family S carried the novel biallelic variants c.224del p.(P75Lfs*7)
          and c.413T>C p.(I138T), with the latter variant also found in the homozygous state in the two
          affected siblings from Family T.
        supports: SUPPORT
