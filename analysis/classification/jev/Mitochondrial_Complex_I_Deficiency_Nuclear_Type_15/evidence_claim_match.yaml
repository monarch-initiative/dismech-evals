              label: mitochondrial complex I deficiency, nuclear type 15
        context: []
      assertion_type: Genetic
      assertion:
        name: NDUFAF4
        gene_term:
          preferred_term: NDUFAF4
          term:
            id: hgnc:21034
            label: NDUFAF4
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'NDUFAF4 (HGNC:21034, "NADH:ubiquinone oxidoreductase complex assembly factor 4") is at
          6q16.1. Its previous symbol is C6ORF66, which is the name under which the gene was discovered
          and the name used throughout the 2008 and 2013 literature; the HGNC record also lists the aliases
          HSPC125, bA22L21.1, My013 and HRPAP20, the last of which belongs to a separate line of breast-cancer
          work - the founding paper closes by noting that the same gene product had been shown to promote
          breast cancer cell invasiveness. None of that is part of this disease, and a literature search
          on the gene symbol will return a good deal of it.

          Two facts about the allelic series bear on how a new variant should be read. The alleles span
          missense, frameshift and nonsense classes, and the truncating one is at the severe pole - but
          so is a missense allele, so allele class alone does not predict severity. And the optic-atrophy
          alleles sit in a well-modelled globular domain, distant from the N-terminal positions of the
          Leigh-associated alleles, which is the observation behind the open genotype-phenotype discussion.'
      selected_evidence:
        snippet: Transfection of the patients' fibroblasts with wild-type C6ORF66 cDNA restored complex
          I activity.
        supports: SUPPORT
