        name: Blue-native gel analysis of complex I assembly in fibroblasts
        description: 'Native gel electrophoresis of patient fibroblast mitochondria, which distinguishes
          an assembly-factor defect from a loss of enzyme activity: holo-complex I is reduced, the complex
          I-containing supercomplexes fall away, complex III dimers and III2/IV supercomplexes rise, and
          monomeric complex IV is unchanged. Two-dimensional analysis then shows which module''s intermediates
          have accumulated. This is a research assay rather than a routine diagnostic one, but it is what
          made the NDUFAF4 lesion legible.'
