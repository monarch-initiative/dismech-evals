          MONDO identifier rather than an HP phenotype, and there is no HP term that names it; the neighbouring
          MC1DN entries make the same call. Frequency is OCCASIONAL against a denominator of roughly a
          dozen reported patients, one of whom carries this diagnosis - the numerator is 1, and with a
          series this small the band should be read as "reported once", not as a rate.
      selected_evidence:
        snippet: Via exome sequencing, we identified a homozygous missense variant in a complex I-deficient
          patient with Leigh syndrome.
