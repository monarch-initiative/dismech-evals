              label: mitochondrial complex I deficiency, nuclear type 15
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'No prevalence estimate exists. Roughly a dozen patients have been reported across four
          papers between 2008 and 2026: six in the founding consanguineous family (five with encephalomyopathy,
          one with antenatal cardiomyopathy), one with Leigh syndrome, two siblings with fatal neonatal
          encephalopathy, and three with isolated optic atrophy in two families. The count is approximate
          because the founding family''s exact patient total is reported as five plus one and later papers
          describe it in summary.

          One denominator exists and is worth recording even though it cannot be turned into a rate: the
          three optic-atrophy patients came from a cohort of 31 patients in 23 families with biallelic
          or hemizygous variants in 11 nuclear complex I genes, itself drawn from a targeted screen of
          patients who already had optic atrophy. That bounds how common NDUFAF4 is among nuclear complex
          I optic neuropathy, not in any population.'
      selected_evidence:
        snippet: We identified biallelic or hemizygous candidate pathogenic genotypes in 11 genes encoding
          subunits of respiratory CI in 31 patients from 23 families.
        supports: SUPPORT
