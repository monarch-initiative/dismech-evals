          where it associates early and stays until just before the enzyme is completed. It works with
          NDUFAF3, with which it is physically associated and whose deficiency produces a similar assembly
          defect. Without NDUFAF4 the Q-module intermediates it normally marks are not detectable at all.
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex I assembly
          modifier: DECREASED
          term:
            id: GO:0032981
            label: mitochondrial respiratory chain complex I assembly
        locations:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
      selected_evidence:
        snippet: NDUFAF4 (C6ORF66) is an assembly factor of complex I that associates with assembly intermediates
          of the Q-module.
        supports: SUPPORT
