              label: mitochondrial complex I deficiency, nuclear type 15
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Stalled Complex I Assembly with Accumulated P- and N-Module Intermediates
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: Proximal P-module intermediates carrying ACAD9 and ECSIT, distal P-module intermediates
          carrying NDUFB11, and an N-module intermediate carrying NDUFV2 all accumulate, while the Q-module
          intermediates do not. The authors read this as NDUFAF4 being required for two specific joining
          steps rather than for building any one module, and note the alternative that the P- and N-module
          pile-up is simply secondary to a Q-module that never arrives. Every one of these accumulations
          is reversed by supplying wild-type NDUFAF4.
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex I assembly
          modifier: DECREASED
          term:
            id: GO:0032981
            label: mitochondrial respiratory chain complex I assembly
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        notes: The two candidate readings of the accumulation - a direct requirement for NDUFAF4 at two
          joining steps, or a secondary pile-up behind a missing Q-module - are stated as alternatives
          by the paper that made the measurement, and this entry keeps them as alternatives. Independent
          Drosophila work on NDUFAF3 and NDUFAF4 finds Q-, N- and PP-b-module biogenesis all impaired
          when either factor is lost, which is consistent with both readings and settles neither.
      selected_evidence:
        snippet: Lentiviral complementation of patient fibroblasts with wild-type NDUFAF4 rescued complex
          I deficiency and the assembly defect, confirming the causal role of the variant.
        supports: SUPPORT
