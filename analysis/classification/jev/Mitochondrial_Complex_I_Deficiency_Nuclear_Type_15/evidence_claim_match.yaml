              label: mitochondrial complex I deficiency, nuclear type 15
        context: []
      assertion_type: Treatment
      assertion:
        name: Idebenone for the Optic Neuropathy
        therapeutic_modality: SMALL_MOLECULE
        description: 'A recommendation rather than a result, and it applies only to the optic-atrophy
          pole.

          The 2026 series that found the NDUFAF4 optic-atrophy patients concludes that patients with nuclear
          complex I optic neuropathy may benefit from idebenone, dosed as for Leber hereditary optic neuropathy,
          where it is an approved therapy. Its rationale is mechanistic: reduced idebenone can bypass
          complex I and hand electrons from NADH directly to complex III, so any complex I defect might
          be partially corrected by it.

          What the same paper reports about its own cohort is discouraging, and should be read alongside
          the recommendation: visual improvement was variable, with only three of thirteen patients showing
          some degree of response. Those thirteen are not thirteen NDUFAF4 patients - the sentence sits
          in a paragraph describing the whole thirty-one-patient series, directly after the list of drugs
          used, so the thirteen are most plausibly the patients who received idebenone. No response rate
          can be attributed to this genotype from it, and no individual NDUFAF4 patient''s treatment or
          outcome is reported. Nothing at all has been reported for the severe pole, where an optic-nerve-directed
          therapy would not address the encephalopathy.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: idebenone
            term:
              id: CHEBI:31687
              label: idebenone
      selected_evidence:
        snippet: Visual improvement was variable, with only 3 of 13 patients showing some degree of response
          to idebenone treatment
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41234160
      reference_title: Recessive variants in mitochondrial complex I nuclear subunits are an underrated
        cause of optic atrophy.
      evidence_source: HUMAN_CLINICAL
      explanation: The observed response in the cohort that contains the NDUFAF4 patients. It is the reason
        this block is worded as a recommendation rather than as an effective treatment.
