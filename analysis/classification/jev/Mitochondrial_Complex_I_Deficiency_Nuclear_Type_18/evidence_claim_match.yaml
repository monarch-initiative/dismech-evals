        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'The holoenzyme does not complete. Two-dimensional blue-native and denaturing gels
          from the leukoencephalopathy patient show matrix-arm Q-module subunits (NDUFS2, NDUFS3, NDUFA9)
          and membrane-arm P-module subunits (NDUFB10, NDUFB11) reduced together, so the block is not
          confined to one module. Complexome profiling of the 2023 patient shows what piles up behind
          it: early membrane-arm sub-assemblies still bound to the MCIA complex. The same profiling reports
          a second, unusual species in that patient - free monomeric complex I still holding the MCIA
          complex and other assembly factors - so the holoenzyme that does form has not released its assembly
          machinery.'
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex I assembly
          modifier: DECREASED
          term:
            id: GO:0032981
            label: mitochondrial respiratory chain complex I assembly
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: Two-dimensional, blue-native polyacrylamide gel electrophoresis (PAGE) and sodium dodecyl
          sulfate-PAGE revealed reductions in Q-module (NDUFS2, NDUFS3, and NDUFA9) and P-module (NDUFB10
          and NDUFB11) subunits, indicating disruption of mitochondrial complex I assembly.
        supports: SUPPORT
