          as Definitive on 7 March 2022 under SOP8, on case-level and experimental data from three publications
          plus model-organism support. Note what the assertion is against: ClinGen curated NDUFAF3 to
          "mitochondrial disease" (MONDO:0044970), not to MC1DN18, having deliberately lumped the NDUFAF3
          phenotype into one disease entity. That is a different granularity decision from the one this
          entry makes, and it is recorded rather than resolved.'
