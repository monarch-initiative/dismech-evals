            description: 'Fibroblasts from patients, complemented with wild-type NDUFAF3. This is the
              experiment that made NDUFAF3 a disease gene: baculovirus-delivered NDUFAF3-GFP in the founding
              report, and an independent complementation in the Leigh-syndrome patient''s fibroblasts
              nine years later. There is no NDUFAF3 mouse, and no patient tissue beyond the muscle and
              fibroblast samples of the published cases.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Isolated Complex I Deficiency
        relationship: RESCUES
        fidelity: HIGH
        model_scale: CELLULAR
        description: Supplying wild-type NDUFAF3 to the patient's own cells is what localises the enzyme
          deficiency to this gene rather than to a coincidental variant, and it was the basis on which
          the founding alleles were called pathogenic.
        limitations: Fibroblasts are not neurons, and the affected tissues - basal ganglia, brainstem,
          white matter - have never been studied in this disease. The rescue establishes causality; it
          says nothing about why those structures fail, nor about the threshold of residual complex I
          activity a neuron tolerates. The 2023 patient's fibroblasts show only a mild activity reduction
          alongside a severe complexome defect, which is a direct demonstration that the fibroblast activity
          assay can under-read this disease.
      selected_evidence:
        snippet: In a patient presenting with Leigh syndrome, which has hitherto not been described as
          a clinical feature of NDUFAF3 deficiency, we identified a novel homozygous variant and confirmed
          its pathogenicity in patient fibroblasts studies.
        supports: SUPPORT
