        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Rapid Proteolytic Turnover of Newly Synthesized ND1
        biological_scale: MOLECULAR
        role: effector
        mechanism_confidence: ESTABLISHED
        description: 'ND1 is translated normally but destroyed shortly afterwards. Short-term knockdown
          of the m-AAA protease in cells depleted of NDUFAF3 completely restores ND1 labelling, which
          is what identifies the loss as proteolysis of an unprotected subunit rather than a failure to
          make it. The effect belongs to the early assembly factors specifically: knockdown of the late
          assembly factor NDUFAF2 does not produce it.'
        biological_processes:
        - preferred_term: protein quality control for misfolded or incompletely synthesized proteins
          modifier: INCREASED
          term:
            id: GO:0006515
            label: protein quality control for misfolded or incompletely synthesized proteins
        notes: 'Curated as its own node rather than folded into the assembly block because the experiment
          separates two things that look identical on a native gel: a subunit that is never made and a
          subunit that is made and then degraded. It also names a protease, which is the only point in
          this pathograph where a candidate pharmacological handle exists. Note that the quoted sentence
          spells the protease "AGF3L2"; the gene symbol is AFG3L2, and the snippet is quoted as the source
          printed it rather than corrected.'
      selected_evidence:
        snippet: Transient, short-term knock-down of the m-AAA protease AGF3L2 in cells that had been
          depleted of any of the early CI assembly factors completely rescued the ND1 labeling phenotype,
          confirming that it is not a synthesis defect, but rather results from rapid proteolysis of newly
          synthesized ND1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
