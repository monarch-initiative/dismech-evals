        context:
        - path: /pathophysiology/1
          value:
            name: Loss of NDUFAF3 from Early Complex I Assembly Intermediates
            biological_scale: MOLECULAR
            role: central_effector
            mechanism_confidence: ESTABLISHED
            description: NDUFAF3's place in complex I biogenesis is on the earliest assembly intermediates.
              It co-immunoprecipitates with NDUFAF4 and with the matrix-arm subunits NDUFS2, NDUFA9 and
              NDUFS3 in a roughly 400 kDa intermediate that also contains the mitochondrially encoded
              ND1 subunit. Losing it therefore removes a component from the step at which the nuclear-encoded
              matrix arm and the mtDNA-encoded membrane arm are first brought together.
            biological_processes:
            - preferred_term: mitochondrial respiratory chain complex I assembly
              modifier: DECREASED
              term:
                id: GO:0032981
                label: mitochondrial respiratory chain complex I assembly
            locations:
            - preferred_term: mitochondrial inner membrane
              term:
                id: GO:0005743
                label: mitochondrial inner membrane
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Stalled Complex I Assembly with Depleted Q- and P-Module Subunits
        causal_link_type: DIRECT
        description: The intermediate NDUFAF3 normally marks does not progress, so the subunits that depend
          on it do not accumulate into the holoenzyme.
      selected_evidence:
        snippet: Furthermore, we present an analysis of complex I assembly routes representative of each
          functional module and, thereby, link NDUFAF3 to a specific step in complex I assembly.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1/downstream/1
      evidence_path: /pathophysiology/1/downstream/1/evidence/0
      context_paths:
