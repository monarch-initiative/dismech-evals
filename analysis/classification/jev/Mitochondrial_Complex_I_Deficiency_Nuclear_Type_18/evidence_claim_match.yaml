            target: Rapid Proteolytic Turnover of Newly Synthesized ND1
            relationship: PERTURBS
            fidelity: MODERATE
            model_scale: MOLECULAR
            description: Depleting NDUFAF3 abolishes complex I assembly and shortens the half-life of
              newly synthesised ND1 fourfold, and knocking down the protease restores it.
            limitations: Knockdown is not a patient genotype. Every reported human allele is missense,
              in-frame, splice-site or initiation-codon rather than a null, and the missense alleles may
              leave partial function, so the magnitude of the ND1 effect in knockdown cells is an upper
              bound on what happens in a patient. The cells are also not an affected tissue.
          role: ancestor
