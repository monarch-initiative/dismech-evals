      assertion:
        name: ND1 half-life in pulse-chase after NDUFAF3 knockdown
        target: Rapid Proteolytic Turnover of Newly Synthesized ND1
        direction: DECREASED
        interpretation: A fourfold shorter chase half-life, which fully accounts for the reduced pulse
