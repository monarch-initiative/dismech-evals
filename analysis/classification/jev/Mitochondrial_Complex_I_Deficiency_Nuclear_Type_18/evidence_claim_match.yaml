        context:
        - path: /animal_models/0
          value:
            name: Drosophila NDUFAF3 and NDUFAF4 disruption
            species: Drosophila melanogaster
            genotype: RNAi disruption of the Drosophila NDUFAF3 or NDUFAF4 orthologue in flight muscle
            publication: PMID:34386730
            genes:
            - preferred_term: NDUFAF3
              term:
                id: hgnc:29918
                label: NDUFAF3
            description: Genetic disruption of either assembly factor in Drosophila, used to dissect what
              the two do and how they relate. It is not a disease model - no fly phenotype is matched
              to a human one here - and it is curated because it is the only in vivo work bearing on the
              mechanism node, and because it tests the NDUFAF3 and NDUFAF4 relationship that the human
              work could only infer.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Stalled Complex I Assembly with Depleted Q- and P-Module Subunits
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: MOLECULAR
        description: Losing either factor impairs biogenesis of the Q-, N- and PP-b-modules. Forced expression
          of NDUFAF4 rescues the Q-module defect caused by loss of NDUFAF3, which is direct in vivo evidence
          that the two act in one pathway, and raises the possibility that some NDUFAF3 missense alleles
          could be rescued by raising NDUFAF4.
        limitations: 'Drosophila, and no human variant is modelled - the manipulation is RNAi knockdown
          of the fly orthologue, not knock-in of a patient allele. The module nomenclature also does not
          map cleanly onto the human patient data: the fly work reports impaired Q-, N- and PP-b module
          biogenesis, while the patient gels show Q- and P-module subunits depleted together with early
          membrane-arm sub-assemblies accumulating. Both place the lesion early; neither settles the order
          of events.'
        divergences:
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: Complex I assembly-factor composition and module boundaries are conserved between
            fly and human but not identical, and the fly experiment measures the consequence of depleting
            the factor rather than of carrying a patient missense or splice-site allele.
      selected_evidence:
        snippet: Notably, forced expression of NDUFAF4 rescues the biogenesis defects in the Q-module
          and some aspects of the defects in the PP-b-module of CI when NDUFAF3 is disrupted.
        supports: SUPPORT
    origin:
