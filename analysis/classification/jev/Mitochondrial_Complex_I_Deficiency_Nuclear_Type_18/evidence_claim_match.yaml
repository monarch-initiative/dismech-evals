            role: effector
            mechanism_confidence: ESTABLISHED
            description: 'ND1 is translated normally but destroyed shortly afterwards. Short-term knockdown
              of the m-AAA protease in cells depleted of NDUFAF3 completely restores ND1 labelling, which
              is what identifies the loss as proteolysis of an unprotected subunit rather than a failure
              to make it. The effect belongs to the early assembly factors specifically: knockdown of
              the late assembly factor NDUFAF2 does not produce it.'
            biological_processes:
            - preferred_term: protein quality control for misfolded or incompletely synthesized proteins
              modifier: INCREASED
              term:
                id: GO:0006515
                label: protein quality control for misfolded or incompletely synthesized proteins
            notes: 'Curated as its own node rather than folded into the assembly block because the experiment
              separates two things that look identical on a native gel: a subunit that is never made and
              a subunit that is made and then degraded. It also names a protease, which is the only point
              in this pathograph where a candidate pharmacological handle exists. Note that the quoted
              sentence spells the protease "AGF3L2"; the gene symbol is AFG3L2, and the snippet is quoted
              as the source printed it rather than corrected.'
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Stalled Complex I Assembly with Depleted Q- and P-Module Subunits
        causal_link_type: DIRECT
        description: ND1 is the subunit around which the holoenzyme nucleates, so destroying it removes
          the seed for the rest of the assembly.
      selected_evidence:
        snippet: These data suggest that the four early CI assembly factors have non-redundant functions
