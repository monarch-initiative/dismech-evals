  a376eb0e9f977ed7c1ca02e3b8e9f1d6a23aef7b2ca06108c3f8fbf6d5ea5f4e:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 18
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 18
            term:
              id: MONDO:0032623
              label: mitochondrial complex I deficiency, nuclear type 18
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn18_why_some_children_survive
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#NDUFAF3
        - pathophysiology#Isolated Complex I Deficiency
        prompt: Why do most children with biallelic NDUFAF3 variants die in infancy while a few survive
          into the second decade with a movement disorder, and can a genotype or a biochemical measurement
          predict which?
        rationale: 'Prognosis is the question a family asks at diagnosis and the one this gene cannot
          currently answer. Most of the first seven reported patients died in infancy of severe neurological
          disease with lactic acidosis. Two later patients did not: a girl still alive at one year after
          a cavitating leukoencephalopathic crisis, and a child reported at ten with a neurodevelopmental
          disorder, dystonia and only a mild fibroblast complex I reduction. A 2025 series then added
          NDUFAF3 to the genes causing childhood-onset complex dystonia, which implies further survivors.

          Two candidate explanations are available and neither has been tested. The first is residual
          function: every reported allele is missense, in-frame, splice-site or initiation-codon rather
          than a clean null, so different genotypes may leave different amounts of working assembly factor.
          The 2023 patient''s biochemistry is consistent with that, in that the activity reduction is
          mild where the complexome defect is severe. The second is that fibroblast biochemistry simply
          does not track the neurological outcome, in which case the apparent correlation in that one
          patient is a coincidence and the assay is measuring the wrong tissue.

          Distinguishing them matters clinically. If residual assembly-factor function predicts survival,
          a quantitative complexome measurement becomes a prognostic test at diagnosis. If it does not,
          it stays a diagnostic test only, and families should be counselled from the genotype and the
          clinical course rather than from the enzymology.'
        proposed_experiments:
        - experiment_id: mc1dn18_residual_function_vs_outcome
          name: Residual NDUFAF3 abundance and complex I assembly across the reported allelic series
          description: Express each reported NDUFAF3 allele on a common null background and measure steady-state
            NDUFAF3 abundance, ND1 stability, assembly-intermediate distribution by complexome profiling,
            and complex I activity, then compare the ranking against the clinical course of the patient
            each allele came from. The allelic series is small enough to do exhaustively.
          would_support:
          - pathophysiology#Isolated Complex I Deficiency
          supporting_outcome:
          - Residual assembly-factor abundance and complex I assembly ranking with clinical severity across
            alleles would establish residual function as the variable behind the survival difference,
            and make the complexome measurement prognostic.
          refuting_outcome:
          - Comparable residual function across alleles from patients with very different outcomes would
            refute the residual-function explanation and point instead to modifiers, tissue-specific thresholds,
            or ascertainment as the reason the survivors look different.
      selected_evidence:
        snippet: The seven patients reported to date exhibited severe neurologic symptoms and lactic acidosis,
          followed by a fatal course and death during infancy in most cases.
        supports: SUPPORT
