        prevalence_class: ULTRA_RARE
        notes: 'No prevalence estimate exists, and no population-based denominator of any kind has been
          published for this gene. The literature accessible to this curation describes at least nine
          individuals: five from three families in the 2009 founding report, one with Leigh syndrome in
          2017, one with cavitating leukoencephalopathy in 2018, one with dystonia and a neurodevelopmental
          disorder in 2023, and at least one further individual in a 2025 Indian childhood-onset dystonia
          series that names NDUFAF3 as a newly contributed gene without stating how many of its 22 individuals
          carried it. The count is a floor rather than a total. The 2023 report''s tally of "seven patients
          reported to date" is the one figure in the literature stated as a series total, and is quoted
          below.'
      selected_evidence:
        snippet: The seven patients reported to date exhibited severe neurologic symptoms and lactic acidosis,
          followed by a fatal course and death during infancy in most cases.
