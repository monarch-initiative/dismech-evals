        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: 'Every reported patient carries two damaged NDUFAF3 alleles. The gene was found by
          homozygosity mapping in three families with severe neonatal lactic acidosis; the Leigh-syndrome
          patient is homozygous, and the leukoencephalopathy and 2023 patients are each compound heterozygous.
          NDUFAF3 is nuclear-encoded and autosomal at 3p21.31, so this is a nuclear recessive mitochondrial
          disease: sibling recurrence risk is one in four and there is no maternal transmission, which
          is what distinguishes counselling here from the mitochondrial-genome forms of complex I deficiency.
          No NDUFAF3-specific recurrence figure has been published; the one in four follows from the mode
          of inheritance, which the ClinGen expert panel records as autosomal recessive, and is not an
          observed rate in these families.'
      selected_evidence:
        snippet: NDUFAF3 | HGNC:29918 | mitochondrial disease | MONDO:0044970 | AR | Definitive | SOP8
          | Mitochondrial Diseases Gene Curation Expert Panel | 2022-03-07T05:00:00.000Z
