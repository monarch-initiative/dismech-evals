          therapeutic_agent:
          - preferred_term: riboflavin
            term:
              id: CHEBI:17015
              label: riboflavin
      selected_evidence:
        snippet: Treatment with biotin 20 mg (q12 hrs), levocarnitine 100 mg (q12 hrs), thiamine 200 mg
          (q12 hrs), riboflavin 100 mg (q6 hrs), coenzyme Q10 90 mg (q6 hrs), and alpha lipoic acid 25
          mg (q12 hrs) did not improve blood lactic acid levels.
        supports: REFUTE
