            name: Arrest and Breakdown of the Late Complex I Assembly Intermediate
            description: Without FOXRED1 the mitochondrially encoded subunits are still translated and
              are still incorporated into a late-stage assembly intermediate of roughly 815 kDa. That
              intermediate then fails to mature into the holoenzyme and instead breaks down into a smaller
              complex of roughly 475 kDa. The same smaller species is detectable in patient cells, so
              the cellular model and the patient material agree on where the pathway stops.
            biological_scale: MOLECULAR
            biological_processes:
            - preferred_term: mitochondrial respiratory chain complex I assembly
              term:
                id: GO:0032981
                label: mitochondrial respiratory chain complex I assembly
              modifier: DECREASED
          role: ancestor
