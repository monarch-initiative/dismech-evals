  0b1a2b4e6ad8be432252e350e5113c5a5a4248965e4262128c9933d720fb0351:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency Nuclear Type 19
          disease_term:
            preferred_term: mitochondrial complex I deficiency, nuclear type 19
            term:
              id: MONDO:0032624
              label: mitochondrial complex I deficiency, nuclear type 19
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Arrest and Breakdown of the Late Complex I Assembly Intermediate
        description: Without FOXRED1 the mitochondrially encoded subunits are still translated and are
          still incorporated into a late-stage assembly intermediate of roughly 815 kDa. That intermediate
          then fails to mature into the holoenzyme and instead breaks down into a smaller complex of roughly
          475 kDa. The same smaller species is detectable in patient cells, so the cellular model and
          the patient material agree on where the pathway stops.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex I assembly
          term:
            id: GO:0032981
            label: mitochondrial respiratory chain complex I assembly
          modifier: DECREASED
      selected_evidence:
        snippet: In the absence of FOXRED1, mtDNA-encoded complex I subunits are still translated and
          transiently assembled into a late stage ∼815 kDa intermediate; but instead of transitioning
          further to the mature complex I, the intermediate breaks down to an ∼475 kDa complex.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25678554
      reference_title: Characterization of mitochondrial FOXRED1 in the assembly of respiratory chain
        complex I.
      evidence_source: IN_VITRO
      explanation: 'The whole of this node in one sentence: translation and early incorporation are intact,
        the late intermediate forms, and it is the final maturation step that fails, after which what
        was built comes apart.'
