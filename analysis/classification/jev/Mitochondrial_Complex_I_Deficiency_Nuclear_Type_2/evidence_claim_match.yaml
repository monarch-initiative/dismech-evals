          value:
            target: Impaired NADH-Ubiquinone Oxidoreduction and OXPHOS Deficit
            relationship: RECAPITULATES
            fidelity: MODERATE
            description: Under galactose the patient cells reproduce the bioenergetic lesion - depolarized
              mitochondrial membrane potential, altered mitochondrial morphology, reduced total cellular
              ATP - and the rescue profile identifies redox rather than carbon supply as limiting.
            limitations: Skin fibroblasts, not neurons; the rescue experiments show what restores viability
              in culture, not what would restore neurological function.
          role: ancestor
      assertion_type: ExperimentalReadout
