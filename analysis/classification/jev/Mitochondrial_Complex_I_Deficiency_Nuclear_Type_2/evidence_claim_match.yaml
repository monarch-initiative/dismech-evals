      assertion_type: Pathophysiology
      assertion:
        name: Increased Reactive Oxygen Species Production
        biological_scale: CELLULAR
        role: modifier
        mechanism_confidence: PROVISIONAL
        description: 'Fibroblasts from children with nuclear complex I gene defects, including NDUFS8,
          show raised reactive oxygen species. The interesting finding is not the ROS itself but what
          happens when it is removed: chronic treatment with the water-soluble vitamin E derivative Trolox
          dramatically lowers ROS and is accompanied by a substantial increase in the amount of complex
          I. The reporting authors read that as evidence that complex I expression is itself regulated
          by ROS, which makes this node a feedback modifier on the assembly node rather than a terminal
          consequence.

          It is curated PROVISIONAL because the causal claim rests on the correlated response to one intervention
          in cultured fibroblasts, and because the authors describe the contribution of ROS to pathogenesis
          as supported by circumstantial evidence.'
        biological_processes:
        - preferred_term: reactive oxygen species metabolic process
          modifier: INCREASED
          term:
            id: GO:0072593
            label: reactive oxygen species metabolic process
        cell_types:
