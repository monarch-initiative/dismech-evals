      assertion_type: Phenotype
      assertion:
        category: Metabolic
        name: Lactic Acidosis
        description: 'Elevated lactate and pyruvate in blood and CSF, the expected consequence of NADH
          that cannot be reoxidized through a blocked respiratory chain and is instead consumed by lactate
          dehydrogenase. Present in the index patient.

          The important qualifier is that it is not obligatory: in the late-onset patient, lactate and
          pyruvate in blood, urine and CSF were repeatedly normal while complex I activity was 31-43%
          of control and the MRI showed Leigh-compatible putaminal lesions. A normal lactate does not
          exclude this diagnosis, which is exactly the kind of negative that changes what a clinician
          does next.'
        phenotype_term:
          preferred_term: Lactic acidosis
          term:
            id: HP:0003128
            label: Lactic acidosis
      selected_evidence:
        snippet: Measurements of lactate and pyruvate concentrations in blood, urine, and CSF were also
          repeatedly normal.
