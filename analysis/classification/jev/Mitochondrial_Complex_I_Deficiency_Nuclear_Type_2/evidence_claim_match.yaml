        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Complex I Amount and Intrinsic Catalytic Activity
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'The step at which this entity''s biochemistry says something the assembly story
          alone does not. In control fibroblasts the ratio between complex I enzymatic activity and complex
          I amount is exactly one - enzyme present is enzyme working. In fibroblasts from children with
          nuclear complex I gene defects including NDUFS8 that ratio falls below one. The enzyme that
          does get assembled is therefore intrinsically impaired, not merely scarce.

          That is what a core subunit carrying the terminal iron-sulfur cluster would be expected to do,
          and it distinguishes this entity mechanistically from the accessory-subunit deficiencies elsewhere
          in the nuclear complex I series, where the lesion is essentially one of quantity. Practically,
          it also predicts a ceiling on any therapy that works by increasing the amount of complex I -
          see the antioxidant node.'
        molecular_functions:
        - preferred_term: NADH dehydrogenase (ubiquinone) activity
          modifier: DECREASED
          term:
            id: GO:0008137
            label: NADH dehydrogenase (ubiquinone) activity
        cell_types:
        - preferred_term: Fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: For control cells, the ratio between activity and amount was 1 whereas for the patients
          this ratio was below 1, indicating a defect in intrinsic catalytic activity of complex I in
          the latter cells.
        supports: SUPPORT
