      assertion_type: Pathophysiology
      assertion:
        name: Glycolytic Compensation Masking the Bioenergetic Deficit
        biological_scale: CELLULAR
        role: modifier
        mechanism_confidence: ESTABLISHED
        description: 'A compensatory response that is also a methodological trap, and the reason it is
          curated as a node rather than left as a footnote. Cells with complex I deficiency upregulate
          glycolysis to replace lost mitochondrial ATP, and that adaptation masks other consequences of
          the deficiency. Replacing glucose with galactose in a pyruvate-free medium removes the glycolytic
          escape route: under those conditions patient fibroblasts die while control cells do not.

          Clinically the same logic explains why these patients decompensate under catabolic stress, and
          why a resting biochemical measurement can understate how close to the edge a tissue is.

          Glycolysis is not the only compensatory response in play. In the late-onset patient''s skeletal
          muscle the mitochondrially encoded complex IV COI subunit was ELEVATED while complex I protein
          was reduced, which the reporting authors read as an attempt to compensate by inducing mitochondrial
          gene expression. That is hedged as a reading rather than a demonstration, but it is worth recording:
          an assay that finds one respiratory complex up and another down should not be assumed to have
          gone wrong.'
        cell_types:
        - preferred_term: Fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: Following optimization of the cell culture protocol, LS fibroblasts died in the galactose
          medium, whereas control cells did not.
        supports: SUPPORT
