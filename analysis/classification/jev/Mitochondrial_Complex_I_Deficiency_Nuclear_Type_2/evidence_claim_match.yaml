        description: 'Loss of motor and intellectual milestones already attained - regression rather than
          delay, which is what distinguishes the Leigh syndrome course from a static encephalopathy and
          is often the observation that starts the metabolic workup.

          Scope caveat, because it matters for how this record should be read: the evidence here is the
          DEFINITION of Leigh syndrome, not an observation in a genotyped NDUFS8 patient. It applies to
          the infantile-onset form, whose index case followed the classical course. It explicitly does
          NOT hold across the entity - the late-onset patient in the same paper had dysarthria and gait
          failure with cognitive skills that "remained normal". Curated as a feature of the severe end
          rather than of the disease as a whole.'
        phenotype_term:
