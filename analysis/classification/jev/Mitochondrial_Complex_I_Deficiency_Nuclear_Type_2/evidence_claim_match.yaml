      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9837812
      reference_title: The first nuclear-encoded complex I mutation in a patient with Leigh syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the conservation and the proposed iron-sulfur cluster-binding role of the
