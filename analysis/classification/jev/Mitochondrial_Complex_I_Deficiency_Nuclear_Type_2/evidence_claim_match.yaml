            term:
              id: MONDO:0032606
              label: mitochondrial complex I deficiency, nuclear type 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn2_ndufs8_angiogenesis_axis
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the NDUFS8-dependent ATP-Akt-mTOR-angiogenesis axis demonstrated in endothelial cells
          contribute anything to the phenotype of patients with biallelic NDUFS8 variants?
        attaches_to:
        - pathophysiology#Impaired NADH-Ubiquinone Oxidoreduction and OXPHOS Deficit
        - pathophysiology#Leigh Syndrome and Mitochondrial Encephalomyopathy
        rationale: 'A 2024 study did to NDUFS8 what the patient literature cannot: silenced and knocked
          it out on its own, in a single cell type, with rescue experiments. It found that NDUFS8 loss
          inhibits endothelial proliferation, migration and tube formation; that the mechanism runs through
          failure of Akt-mTOR activation; that exogenous ATP restores Akt-mTOR signalling and constitutively
          active Akt1 rescues the cellular phenotypes; and that endothelial-specific knockdown inhibits
          retinal angiogenesis in mice. That is a well-controlled causal chain from this entity''s gene
          to a vascular phenotype.

          None of it has been observed in a patient. Vascular maldevelopment is not a reported feature
          of MC1DN2; the affected tissues are brain, muscle and heart; and the paper''s own framing is
          angiogenesis biology, with its human tissue observation coming from proliferative diabetic retinopathy
          rather than from mitochondrial disease. The mismatch matters in a specific way rather than generically:
          if the ATP-Akt-mTOR link is real in patients it would predict vascular contributions to the
          brain lesions - the symmetric basal ganglia necrosis of Leigh syndrome has long been argued
          to have a perfusion component - and would make ATP-restoring or mTOR-directed intervention mechanistically
          motivated rather than empirical. If it is endothelium-specific biology, the axis belongs to
          angiogenesis research and not to this entry, and should stay out of the pathograph. It is currently
          kept out.'
        proposed_experiments:
        - experiment_id: mc1dn2_vascular_phenotype_in_patients
          name: Vascular and Akt-mTOR assessment in NDUFS8 patients and patient-derived endothelium
          description: Differentiate endothelial cells from NDUFS8 patient iPSCs carrying the actual biallelic
            missense alleles rather than a knockout, and test whether Akt-mTOR activation and angiogenic
            capacity are impaired at patient-relevant residual complex I activity. In parallel, review
            retinal and cerebral vascular imaging in the existing NDUFS8 cases for any unreported vascular
            abnormality.
      selected_evidence:
        snippet: revealed that endothelial knockdown of NDUFS8 inhibited retinal angiogenesis
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38594244
      reference_title: The requirement of the mitochondrial protein NDUFS8 for angiogenesis.
      evidence_source: MODEL_ORGANISM
      explanation: The in vivo vascular phenotype, in mouse retina - the strongest form of the claim available,
        and still not a patient observation.
