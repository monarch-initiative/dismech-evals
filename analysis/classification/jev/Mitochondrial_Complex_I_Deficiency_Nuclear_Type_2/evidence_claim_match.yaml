          NAD+ rescue while lactate, succinate, alpha-ketobutyrate and uridine do not points at NAD+ regeneration
          rather than substrate supply as the limiting step.
      selected_evidence:
        snippet: LS cell death was dose-dependently inhibited by pyruvate, malate, oxaloacetate, α-ketoglutarate,
