              that these specific alleles - not merely loss of the gene - compromise the subunit's function.
            limitations: A yeast, and one whose complex I differs from the human enzyme in subunit composition
              even though the core is conserved. It establishes allele pathogenicity, not clinical severity,
              and it cannot speak to the tissue selectivity that determines what the disease looks like
              in a patient. The cached record states the confirmation without reporting the quantitative
              result, so no readout magnitude is curated.
          role: ancestor
