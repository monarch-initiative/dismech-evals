          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: Trolox treatment dramatically reduced ROS levels in both control and patient cells, which
          was paralleled by a substantial increase in the amount of complex I.
        supports: SUPPORT
