            term:
              id: MONDO:0032606
              label: mitochondrial complex I deficiency, nuclear type 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NDUFS8 Loss of Function
        conforms_to: complex_i_deficiency#Complex I Biogenesis or Repair Failure
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'NDUFS8 encodes TYKY, a structural core subunit of complex I rather than an accessory
          one. Two features make it a plausible point of failure. It is highly conserved across eukaryotes
          and prokaryotes, which is the signature of a subunit whose sequence is constrained by an essential
          function rather than tolerated as scaffolding. And it carries two 4Fe4S ferredoxin consensus
          patterns that have long been thought to provide the binding site for iron-sulfur cluster N-2
          - the terminal cluster of the electron relay, the one that delivers electrons to ubiquinone.

          Reported pathogenic alleles are missense: C236T (p.Pro79Leu) and G305A (p.Arg102His) as compound
          heterozygotes in the index patient, two further novel missense changes in the late-onset patient,
          and homozygous variants in the consanguineous "PEO plus" family.'
        genes:
        - preferred_term: NDUFS8
          term:
            id: hgnc:7715
            label: NDUFS8
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: COMPOUND_HETEROZYGOUS
          description: Biallelic germline missense variants in NDUFS8 - compound heterozygous in the two
            index cases, homozygous in the consanguineous family.
        molecular_functions:
        - preferred_term: 4 iron, 4 sulfur cluster binding
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0051539
            label: 4 iron, 4 sulfur cluster binding
      selected_evidence:
        snippet: The nuclear-encoded NDUFS8 (TYKY) subunit of complex I is highly conserved among eukaryotes
          and prokaryotes and contains two 4Fe4S ferredoxin consensus patterns, which have long been thought
          to provide the binding site for the iron-sulfur cluster N-2.
        supports: SUPPORT
    origin:
