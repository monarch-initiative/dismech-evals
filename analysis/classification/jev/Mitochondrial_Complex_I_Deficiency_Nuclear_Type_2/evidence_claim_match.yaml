            description: 'Human umbilical vein and other endothelial cells with NDUFS8 silenced by shRNA
              or deleted by CRISPR/Cas9. This is the only NDUFS8-specific loss-of-function model in the
              cited literature, and its value here is that it isolates NDUFS8 from the other complex I
              genes that the patient-fibroblast panels unavoidably pool. It reproduces the bioenergetic
              lesion cleanly: reduced oxygen consumption and complex I activity, decreased ATP, mitochondrial
              depolarization, raised ROS and lipid oxidation.

              What it also reports - an NDUFS8-dependent ATP-Akt-mTOR-angiogenesis axis, with retinal
              angiogenesis inhibited in vivo by endothelial-specific knockdown - is deliberately NOT curated
              as a disease mechanism on this entry. Endothelial cells are not the tissue that fails in
              MC1DN2, vascular maldevelopment is not a reported patient phenotype, and the paper''s own
              framing is about angiogenesis biology rather than about this disease. The open question
              is recorded as a HUMAN_MODEL_MISMATCH discussion instead.'
            experimental_model_type: CELL_LINE
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            cell_types:
            - preferred_term: Human umbilical vein endothelial cell
              term:
                id: CL:0002618
                label: endothelial cell of umbilical vein
            publication: PMID:38594244
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired NADH-Ubiquinone Oxidoreduction and OXPHOS Deficit
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Gene-specific depletion of NDUFS8 alone reproduces the bioenergetic lesion - falling
          complex I activity, oxygen consumption, ATP and membrane potential - without any confound from
          other complex I genes.
        limitations: An engineered knockdown or knockout in endothelial cells, not a patient allele in
          an affected tissue. Complete loss of the protein is a more severe perturbation than the biallelic
          missense variants patients actually carry, and endothelium is not a tissue in which MC1DN2 is
          known to fail. The model therefore supports the gene-to-bioenergetics step and nothing downstream
          of it.
        readouts:
        - name: Complex I activity, oxygen consumption, ATP and membrane potential
          target: Impaired NADH-Ubiquinone Oxidoreduction and OXPHOS Deficit
          direction: DECREASED
          interpretation: All four fall together on NDUFS8 loss, which is the expected signature of losing
            a core subunit of the enzyme.
      selected_evidence:
        snippet: NDUFS8 (NADH:ubiquinone oxidoreductase core subunit S8) is a protein that plays a critical
          role in the function of mitochondrial Complex I.
        supports: SUPPORT
