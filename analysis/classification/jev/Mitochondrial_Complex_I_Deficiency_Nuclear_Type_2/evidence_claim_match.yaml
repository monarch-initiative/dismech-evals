  fa40f60e4467b0264bee241ed1266598e0206e382d0cc9a1361e942dc2dc2109:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 2
          disease_term:
            preferred_term: mitochondrial complex I deficiency, nuclear type 2
            term:
              id: MONDO:0032606
              label: mitochondrial complex I deficiency, nuclear type 2
        context: []
      assertion_type: Genetic
      assertion:
        name: NDUFS8
        gene_term:
          preferred_term: NDUFS8
          term:
            id: hgnc:7715
            label: NDUFS8
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'NDUFS8 (11q13.2) encodes TYKY, a structural core subunit of complex I with an open reading
          frame of 633 bp coding for 210 amino acids. It is the gene MONDO uses to define this entity
          - MONDO:0032606 is an intersection class, "mitochondrial complex I deficiency, nuclear type"
          AND has-causal-agent NDUFS8 - so the gene is not merely associated with the concept but constitutive
          of it.

          Reported alleles are missense and biallelic: C236T (p.Pro79Leu) with G305A (p.Arg102His) in
          the 1998 index compound heterozygote; C254T (p.Pro85Leu) with G413A (p.Arg138His) in the late-onset
          compound heterozygote, each parent carrying one and neither found in 100 control DNAs; and homozygous
          variants in the consanguineous PEO-plus family. Worth noting how rare this is: in the original
          screen of 20 patients with isolated enzymatic complex I deficiency, NDUFS8 explained exactly
          one.

          The full reported allelic series, homozygous and compound heterozygous together, is: p.Pro79Leu,
          p.Gly154Ser, p.Glu63Gln, p.Arg54Trp and p.Arg94Cys as homozygotes; p.Pro79Leu with p.Arg102His,
          p.Pro85Leu with p.Arg138His, p.Arg77Trp with p.Ala159Asp, and p.Arg18Cys, p.Val162Met and p.Cys153Arg
          as compound heterozygotes. That is the set any genotype-phenotype analysis has to work with,
          and it is larger than the two families this entry''s primary reports describe.

          A striking feature of the whole reported allelic series: every identified NDUFS8 mutation is
          missense, and no patient has been reported with a nonsense variant. The proposed explanation
          is that complete absence of the protein may be lethal in utero, so the living patient population
          is by construction hypomorphic. That is a selection effect worth holding in mind whenever this
          entity''s phenotypic range is discussed - the severe end of the observable range may not be
          the severe end of the biological one.

          The positions of the late-onset pair relative to the iron-sulfur machinery are what make them
          mechanistically interesting rather than merely two more variants: P85L lies upstream of the
          two cysteine motifs thought to coordinate the [4Fe-4S] clusters, and R138H lies between them.
          Neither disrupts a cysteine motif, which is the reporting authors'' explanation for why this
          patient''s disease was milder - see the genotype-phenotype discussion.'
      selected_evidence:
        snippet: the R138H amino acid substitution is located between these two iron sulfur clusters which
          have been shown to generate the complex I N2 clusters.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
