    evidence_metadata:
      reference: PMID:38594244
      reference_title: The requirement of the mitochondrial protein NDUFS8 for angiogenesis.
      evidence_source: HUMAN_CLINICAL
      explanation: The only human tissue observation in the paper, and it is from diabetic retinopathy
        rather than from mitochondrial disease - which is precisely why this axis is not curated as an
        MC1DN2 mechanism.
