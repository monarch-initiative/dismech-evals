  9c73c1f2297a38f1b07c89a9bedf974d72b7a647f21ea3fe4df66dd6600b2606:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 2
          disease_term:
            preferred_term: mitochondrial complex I deficiency, nuclear type 2
            term:
              id: MONDO:0032606
              label: mitochondrial complex I deficiency, nuclear type 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn2_antioxidant_therapy_ceiling
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the Trolox-induced increase in complex I amount seen in patient fibroblasts translate
          into any functional benefit in patients - and is it bounded by the intrinsic catalytic defect
          that antioxidant treatment cannot touch?
        attaches_to:
        - pathophysiology#Increased Reactive Oxygen Species Production
        - pathophysiology#Reduced Complex I Amount and Intrinsic Catalytic Activity
        rationale: 'This is a model-to-human question with an unusually well-specified answer already
          sketched in the model. Chronic antioxidant treatment of complex I-deficient fibroblasts lowers
          ROS and substantially increases the amount of complex I, which reads as a therapeutic lead.
          But the same experiment measures the catch: in control cells the increase in activity matched
          the increase in amount exactly, whereas in patient cells the ratio ran between 0.1 and 0.8.
          More enzyme does not reliably mean more function, because the enzyme that is restored still
          carries the intrinsic catalytic defect. The authors draw the conclusion themselves - such treatment
          may only benefit patients with a relatively small intrinsic defect.

          Two things make this a HUMAN_MODEL_MISMATCH rather than a plain knowledge gap. The evidence
          exists and is quantitative; what is unknown is whether it holds in an organism. And the mismatch
          is directional and predictable: the model says who should not be expected to respond, which
          is a testable stratification hypothesis rather than a generic call for more research. The fibroblast
          panel also pooled five genes, so no NDUFS8-specific ratio is available.'
        proposed_experiments:
        - experiment_id: mc1dn2_antioxidant_stratified_by_ratio
          name: Antioxidant trial stratified by baseline activity-to-amount ratio
          description: In complex I deficiency including NDUFS8, measure the fibroblast activity-to-amount
            ratio at baseline, then treat with an antioxidant and test whether functional response is
            predicted by that ratio - with the model's prediction being benefit confined to patients whose
            ratio is close to one.
      selected_evidence:
        snippet: The finding that Trolox treatment increased the amount of complex I might aid the future
          development of antioxidant treatment strategies for patients.
        supports: SUPPORT
