  3dc85094d23b5ea3e8e654536d7d49076b6fe0c775771cb46952309935ac036d:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 2
          disease_term:
            preferred_term: mitochondrial complex I deficiency, nuclear type 2
            term:
              id: MONDO:0032606
              label: mitochondrial complex I deficiency, nuclear type 2
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Diagnostic Negatives That Narrow the Differential
        description: 'A cluster of unremarkable results is curated deliberately, because in this entity
          the negatives do more diagnostic work than most of the positives. In the late-onset patient,
          electromyography and nerve conduction studies were normal at age 7; histochemistry and electron
          microscopy of skeletal muscle were unremarkable; and muscle mtDNA screening for rearrangements
          by Southern blot and for common point mutations was negative. The only abnormality on routine
          metabolic screening was a mild rise in plasma alanine, with organic acids, carnitines and repeated
          lactate and pyruvate all normal.

          Each of those narrows the field. Normal EMG and nerve conduction argue against a neuropathic
          or primary myopathic process; unremarkable muscle histochemistry and EM remove the findings
          a curator might expect of a mitochondrial disease - ragged red fibres, abnormal mitochondrial
          morphology - and show that neither is required; a negative muscle mtDNA screen is what redirects
          the search to the NUCLEAR genome, which is the whole reason this entity has a "nuclear type"
          in its name. The mild alanine elevation is the one positive among them and is the classic soft
          pointer to a respiratory chain defect, reflecting transamination of accumulated pyruvate.

          The practical warning is that a child with this disease can pass every first-line test. Respiratory
          chain enzymology on isolated mitochondria, and then nuclear sequencing, are what find it.'
      selected_evidence:
        snippet: Histochemistry and electron microscopy performed on the skeletal muscle were unremarkable.
        supports: SUPPORT
