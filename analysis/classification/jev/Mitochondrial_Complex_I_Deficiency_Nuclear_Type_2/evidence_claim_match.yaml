  a6d7f4234068593ef5f5b4118290f942d8385295fc668d612a5c26a458b00b9a:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 2
          disease_term:
            preferred_term: mitochondrial complex I deficiency, nuclear type 2
            term:
              id: MONDO:0032606
              label: mitochondrial complex I deficiency, nuclear type 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn2_genotype_phenotype_range
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does loss of a structural core subunit of complex I produce a range from death within
          months to a late-onset "PEO plus" phenotype, and what predicts where a given patient will fall
          in it?
        attaches_to:
        - pathophysiology#NDUFS8 Loss of Function
        - pathophysiology#Reduced Complex I Amount and Intrinsic Catalytic Activity
        - pathophysiology#Leigh Syndrome and Mitochondrial Encephalomyopathy
        rationale: 'The expectation is explicit in the literature and it is wrong: NDUFS8 is a structural
          core protein and mutations were expected to cause infantile onset and severe disease. The index
          patient met that expectation. A second patient had late-onset disease with a partial biochemical
          defect. Three siblings presented as progressive external ophthalmoplegia, a phenotype so far
          from expectation that the gene would not normally have been considered.

          Two candidate explanations are available in this entry''s own data, and they are not the same
          kind of answer.

          The first is structural and allele-specific, and it is the closest thing to a partial answer
          that exists. The late-onset patient''s two substitutions, P85L and R138H, both change highly
          conserved residues - but NEITHER disrupts the cysteine motifs that coordinate the [4Fe-4S] clusters,
          so the reporting authors argue that electron transport through the subunit should be partially
          preserved. That is a concrete, testable structural criterion: alleles that spare the cysteine
          motifs should be milder than alleles that do not. It has not been tested across an allelic series,
          and it does not obviously explain the PEO-plus family, whose variants are not characterised
          in this way.

          The second is quantitative and gene-agnostic: patients differ in how much of their complex I
          deficit is loss of enzyme versus loss of intrinsic catalytic competence, and that activity-to-amount
          ratio varies between individuals. If the ratio tracked clinical severity it would be both an
          explanation and a prognostic assay.

          A third observation sits between them and may be the most tractable. The late-onset patient
          differed from the infantile index patient in one specific respect at the protein level: a drastic
          reduction in the 39-kDa subunit, which is proposed to occupy the same membrane-peripheral domain
          boundary as TYKY and to interact with it. If which partner subunits an allele destabilises varies
          by allele, that is a measurable intermediate between "where the substitution sits" and "how
          severe the disease is" - and it is measurable by western blot on the fibroblasts these patients
          already have.

          None of the three has been tested across an NDUFS8 allelic series, and the series is tiny -
          roughly 17 patients described in the literature to date, all carrying missense alleles - so
          none can be powered from clinical data alone. The proposed experiment below is designed to test
          them together, since the structural hypothesis predicts which alleles should show which ratio.'
        proposed_experiments:
        - experiment_id: mc1dn2_allelic_series_activity_amount
          name: Activity-to-amount ratio across an NDUFS8 allelic series
          description: Measure complex I amount and activity separately in fibroblasts from every available
            NDUFS8 patient across the full reported allelic series - eleven distinct missense alleles
            in homozygous and compound heterozygous combinations, not the two families the primary reports
            describe - computing the activity/amount ratio per allele, and test whether that ratio correlates
            with age of onset and survival - and, specifically, whether alleles that spare the cysteine
            motifs coordinating the iron-sulfur clusters show a higher ratio than those that do not, as
            the structural hypothesis predicts. If the reported alleles are too few, complement with a
            saturating set of NDUFS8 missense variants introduced into a common cell background, or into
            the Yarrowia lipolytica homologue already used to validate the patient alleles.
      selected_evidence:
        snippet: NDUFS8 is a nuclear-encoded structural core protein of complex I, and mutations are expected
          to cause infantile onset and severe disease.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23430795
      reference_title: NDUFS8-related Complex I Deficiency Extends Phenotype from "PEO Plus" to Leigh
        Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: States the expectation that the observed phenotypic range contradicts.
