      assertion_type: Diagnosis
      assertion:
        name: MRI pattern recognition
        description: The NUBPL MRI pattern - cerebellar cortex, deep cerebral white matter and corpus
          callosum - is described as consistent and recognisable enough to make the diagnosis directly.
          The original authors state it obviates the need for other tests including muscle or fibroblast
          respiratory chain assays, which is a strong claim in a field where imaging is usually only supportive.
          It rests on six patients from five families plus one previously published case, so it is a small
          series, and this entry reports the claim with that limit rather than generalising it.
      selected_evidence:
        snippet: Upon identification of the mutated gene, we analyzed the MRI of a previously published
          case with NUBPL mutations and found exactly the same pattern.
        supports: SUPPORT
