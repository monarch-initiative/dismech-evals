      assertion:
        name: Impaired Iron-Sulfur Cluster Delivery to the Complex I Peripheral Arm
        description: NUBPL is an iron-sulfur cluster assembly factor for complex I. Analysis of how mutant
          NUBPL affects assembly of the peripheral arm placed its role early in the complex I assembly
          pathway, at the stage where iron-sulfur clusters are inserted. The peripheral arm is the electron-transferring
          limb of the complex, so a cluster-insertion failure there prevents the holoenzyme being completed
          rather than degrading an assembled enzyme's performance.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genes:
        - preferred_term: NUBPL
          term:
            id: hgnc:20278
            label: NUBPL
        biological_processes:
        - preferred_term: iron-sulfur cluster assembly for complex I
          modifier: DECREASED
          term:
            id: GO:0016226
            label: iron-sulfur cluster assembly
      selected_evidence:
        snippet: Analysis of the effect of mutated NUBPL on the assembly of the peripheral arm of complex
          I indicated that NUBPL is involved in assembly of iron-sulfur clusters early in the complex
          I assembly pathway.
        supports: SUPPORT
