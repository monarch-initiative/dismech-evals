  4a5a02c2fe0049f50a10cf808246075b80293a04eca4e2c28e86f3ff61720730:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency Nuclear Type 21
          disease_term:
            preferred_term: mitochondrial complex I deficiency, nuclear type 21
            term:
              id: MONDO:0032625
              label: mitochondrial complex I deficiency, nuclear type 21
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NUBPL Loss of Function
        conforms_to: complex_i_deficiency#Complex I Biogenesis or Repair Failure
        description: 'Biallelic NUBPL variants reduce functional NUBPL protein. The recurrent allele is
          the branch-site variant c.815-27T>C, present in all reported families and in roughly 1.2% of
          European haplotypes, which produces a frameshifted, altered C-terminus. Modelling that altered
          C-terminus in the yeast homologue Ind1 showed the mechanism is protein instability rather than
          transcript loss: mRNA was unaffected while protein level fell. Not every missense allele is
          equally damaging - p.Leu104Pro impaired complex I function in the yeast model while p.Val182Ala
          did not.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genes:
        - preferred_term: NUBPL
          term:
            id: hgnc:20278
            label: NUBPL
      selected_evidence:
        snippet: We demonstrate that the altered sequence did not affect IND1 mRNA stability, yet it led
          to a decrease in Ind1 protein level.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23828044
      reference_title: Insights into the pathogenic character of a common NUBPL branch-site mutation associated
        with mitochondrial disease and complex I deficiency using a yeast model.
      evidence_source: MODEL_ORGANISM
      explanation: Locates the effect of the branch-site allele at the protein rather than the transcript
