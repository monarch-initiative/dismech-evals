      - /disease_term
    evidence_metadata:
      reference: PMID:35739187
      reference_title: Most mitochondrial dGTP is tightly bound to respiratory complex I through the NDUFA10
        subunit.
      evidence_source: IN_VITRO
      explanation: The authors' own framing of the consequence. Indirect, and hedged in the source itself
        - "may represent" - which is why this node is hypothetical.
