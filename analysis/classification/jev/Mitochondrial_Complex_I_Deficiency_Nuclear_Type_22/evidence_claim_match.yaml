  97c4004af59b4d2904cb472e24b4ede31e4e440a9d1fe900cf188542ae5cb589:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 22
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 22
            term:
              id: MONDO:0032626
              label: mitochondrial complex I deficiency, nuclear type 22
        context: []
      assertion_type: Genetic
      assertion:
        name: NDUFA10
        gene_term:
          preferred_term: NDUFA10
          term:
            id: hgnc:7684
            label: NDUFA10
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'NDUFA10 encodes the NADH:ubiquinone oxidoreductase subunit A10, an accessory subunit of
          the complex I membrane arm. Reading the literature on this gene needs one caution: most NDUFA10
          papers are not about this disease. The gene appears constantly as a member of expression signatures
          in cancer transcriptomics, in Parkinson-disease models through its PINK1 connection, and in
          cardiac ischaemia-reperfusion work. The disease literature is four reports.

          A second caution concerns the alleles themselves. Both a start-codon variant and single-residue
          missense and in-frame-deletion changes have been reported, and there is no evident hotspot -
          the residues modelled in the 2026 series sit at interfaces with NDUFC1, NDUFC2 and ND2 rather
          than in a single domain. Three specific alleles are quotable and are cited on the evidence items
          here: the compound-heterozygous pair in the index case, described only as a start-codon disruption
          plus a substitution; the homozygous in-frame deletion c.233_235del p.(A78del) in two optic-atrophy
          families; and the homozygous c.1009C>T p.(R337C) in a third, which had already been reported
          in a patient with a much broader phenotype.

          Uncited leads, from the deep-research report committed with this entry, which had full-text
          access to the two paywalled case reports. The index patient''s alleles are given there as c.1A>G
          (start-loss, p.Met1?) inherited from the father and c.425A>G (p.Gln142Arg) from the mother,
          both absent from 108 controls and from 21 further patients with isolated complex I deficiency.
          The 2017 patient is given as homozygous c.296G>A (p.Gly99Glu), with heterozygous third-degree-cousin
          parents. Neither is curated as evidence: the cached record for both papers is abstract-only,
          and neither abstract names an allele.

          One discrepancy for the next curator to resolve rather than inherit. The 2026 series states
          that p.(A78del) had previously been reported *in trans* with p.(G99E) in a case of Leigh syndrome,
          while the deep-research report gives the 2017 patient as a p.(G99E) homozygote. Those cannot
          both describe the same patient. Either a third G99E case exists, or one of the two descriptions
          is wrong; nothing quotable here settles it, and no phase claim is made in this entry as a result.'
      selected_evidence:
        snippet: We identified compound-heterozygous mutations in the NDUFA10 gene, encoding an accessory
          subunit of complex I.
        supports: SUPPORT
        directness: DIRECT
