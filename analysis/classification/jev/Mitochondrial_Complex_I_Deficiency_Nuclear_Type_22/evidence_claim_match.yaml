              label: mitochondrial complex I deficiency, nuclear type 22
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic NDUFA10 Variant
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'The initiating lesion. Reported alleles span the mutational spectrum a loss-of-function
          gene would be expected to show: a start-codon-destroying variant paired with a missense in the
          index patient, a homozygous missense in the second, and a homozygous in-frame single-residue
          deletion p.(A78del) plus a homozygous missense p.(R337C) in the optic-atrophy families.

          Structural modelling in the 2026 series places two of these residues in the subunit''s protein-protein
          interfaces rather than in any catalytic site, which is what an accessory-subunit lesion should
          look like: the variant degrades the subunit''s ability to hold on to its neighbours, not its
          ability to turn over substrate.'
        genes:
        - preferred_term: NDUFA10
          term:
            id: hgnc:7684
            label: NDUFA10
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          description: Curated as loss of function on the strength of the start-codon variant in the index
            case together with the measured fall in complex I amount, activity and assembly, rather than
            from a predicted variant consequence. Zygosity is not set at this node because it differs
            between patients - compound heterozygous in one, homozygous in the others - and is recorded
            per report in the genetic section instead.
      selected_evidence:
        snippet: Two siblings from Family M harboured the homozygous missense variant c.1009C>T p.(R337C);
          this genotype has previously been reported in a patient with ataxia, hypotonia and developmental
          regression.
        supports: SUPPORT
        directness: DIRECT
