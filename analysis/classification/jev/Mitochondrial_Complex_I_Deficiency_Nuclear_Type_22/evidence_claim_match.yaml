            term:
              id: MONDO:0032626
              label: mitochondrial complex I deficiency, nuclear type 22
        context: []
      assertion_type: Phenotype
      assertion:
        category: Neurological
        name: Cerebellar Atrophy
        description: 'Reported in one of the two NDUFA10 families in the 2026 optic-atrophy series. The
          attribution needs its reasoning stated, because the quoted sentence names two families without
          naming their genes: cerebellar atrophy was found in Families J and L, and the same paper assigns
          Family J to NDUFA1 and Families K and L to the homozygous NDUFA10 p.(A78del) allele. So Family
          L is the NDUFA10 case and Family J is not. That is a structural inference across two passages
          of one paper rather than a single quotable statement, which is why the evidence below is marked
          INDIRECT and why the reasoning is written out here rather than left for the reader to reconstruct.

          One patient, so no frequency band. It is worth curating because it is the only structural neuroimaging
          finding attributed to an NDUFA10 patient anywhere in the citable literature, and because cerebellar
          atrophy sits outside the optic nerve - evidence that even the mild pole of this entity is not
          always confined to the visual pathway.'
        phenotype_term:
