        name: Other nuclear-encoded complex I subunit and assembly factor deficiencies
        description: 'MC1DN22 cannot be separated from its siblings clinically or biochemically - only
          by genotype. The class spans 38 nuclear-encoded subunits and a growing list of assembly factors,
          and this knowledge base already carries several members. One structural distinction may eventually
          matter at the bench: a core-subunit defect would be expected to reduce activity with the enzyme
          still assembled, whereas an accessory-subunit defect such as this one reduces the assembled
          amount too. That is visible on a combined amount-and-activity assay; it has no demonstrated
          clinical correlate.'
