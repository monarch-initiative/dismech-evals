  3aa48847d9efdcfb6eccb9d66b16d7fb0f151d4eb8b5c74f29f87a71634d7782:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 22
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 22
            term:
              id: MONDO:0032626
              label: mitochondrial complex I deficiency, nuclear type 22
        context: []
      assertion_type: Biochemical
      assertion:
        name: Complex I Enzyme Activity, Assembled Amount and Assembly Pattern
        notes: 'Three measurements, and the informative point is that they move together. Reduced activity
          alone is the entry criterion for complex I deficiency; what an NDUFA10 defect adds is a fall
          in the assembled amount and a disturbed assembly pattern, which is the signature of a stability
          lesion and is consistent with NDUFA10 being an accessory rather than a core subunit. A laboratory
          that measures activity alone will not see that distinction.

          Note what appears not to be available for this entity. Neither the accessible literature nor
          the deep-research report committed with this entry - which read both paywalled case reports
          in full - records a functional complementation of an NDUFA10 patient''s fibroblasts with wild-type
          cDNA. On that reading the causal assignment rests on parental segregation, on the null nature
          of the start-codon allele, on absence from controls, and on the biochemistry, rather than on
          a rescue experiment. That is a weaker footing than several sibling entities in this series have,
          and it is the reason this entry carries no `experimental_models` block. It is stated as what
          two searches found, not as a proven absence.

          Quantities, as uncited leads from that report: complex I activity in the index patient was about
          29 percent of the lower reference limit in fibroblasts and about 7 percent of it in muscle,
          with mildly reduced complex III in muscle and complex IV within range - the profile of an isolated
          complex I defect with a minor secondary effect, which is worth knowing when interpreting a similar
          assay. Blood lactate was 8.6 mmol/L and CSF lactate 4.9 mmol/L at ten months. None of this is
          in either abstract.'
      selected_evidence:
        snippet: The fibroblasts of the patient displayed decreased amount and activity, and a disturbed
          assembly of complex I.
        supports: SUPPORT
        directness: DIRECT
