              label: mitochondrial complex I deficiency, nuclear type 22
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the NDUFA10 dGTP Reservoir
        biological_scale: MOLECULAR
        role: modulator
        mechanism_confidence: HYPOTHETICAL
        description: 'A second property of NDUFA10 that has no counterpart in most complex I accessory
          subunits, and whose relevance to this disease is unknown. NDUFA10 retains a deoxyribonucleoside-kinase
          fold, and the large majority of the dGTP inside mitochondria is bound to it - tightly enough
          to survive mitochondrial isolation and methanol treatment. Engineering the dNK domain in HEK-293T
          cells, while deliberately preserving complex I assembly and activity, halves mitochondrial dGTP
          content. The authors propose the interaction as a link between oxidative metabolism and mitochondrial
          DNA maintenance.

          Marked HYPOTHETICAL, and it is worth being precise about what is hypothetical. That NDUFA10
          holds most mitochondrial dGTP is measured, not conjectured. What is conjectural is that this
          matters in MC1DN22: no patient allele has been tested for dGTP binding, no mitochondrial DNA
          depletion or deletion phenotype has been reported in an NDUFA10 patient, and the experiment
          that isolates the dGTP function used a mutant chosen precisely because it does *not* destabilise
          the complex - the opposite of what the disease alleles do. The node is curated because it is
          a testable prediction unique to this gene, not because there is evidence for it.'
      selected_evidence:
        snippet: a vast majority of mitochondrial dGTP is tightly bound to NDUFA10, an accessory subunit
          of complex I of the mitochondrial respiratory chain
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
