      assertion_type: Pathophysiology
      assertion:
        name: Brainstem and Basal Ganglia Neurodegeneration
        biological_scale: TISSUE
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'The severe pole. Leigh syndrome is a pathological diagnosis as much as a clinical
          one - bilateral, symmetric spongiform degeneration of the basal ganglia, brainstem, thalamus,
          cerebellum, spinal cord and optic nerves - and isolated complex I deficiency is its commonest
          biochemical cause. Two NDUFA10 patients have carried that diagnosis, and the gene appears among
          the nuclear Leigh genes of a 219-patient Russian cohort.

          Marked PROVISIONAL rather than ESTABLISHED because the association between NDUFA10 loss and
          this lesion distribution rests on a small number of patients diagnosed clinically and radiologically;
          no NDUFA10 case has been examined neuropathologically, and why complex I deficiency selects
          these structures is not answered by any source cited here. The edge into this node is typed
          with unknown intermediates for the same reason: the steps between a cell-level bioenergetic
          deficit and a stereotyped lesion distribution are exactly what is missing.'
      selected_evidence:
        snippet: LS is pathologically uniformly characterized by multifocal bilateral and symmetric spongiform
          degeneration of the basal ganglia, brainstem, thalamus, cerebellum, spinal cord, and optic nerves.
