          name: Mitochondrial Complex I Deficiency, Nuclear Type 22
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 22
            term:
              id: MONDO:0032626
              label: mitochondrial complex I deficiency, nuclear type 22
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Serine-250 Control of Ubiquinone Reduction
        biological_scale: MOLECULAR
        role: modulator
        mechanism_confidence: HYPOTHETICAL
        description: 'A regulatory function of NDUFA10 discovered from the other end - not by studying
          NDUFA10 disease, but by asking why PINK1 loss reduces complex I activity. Phosphoproteomics
          of complex I in Pink1-null mouse liver and brain found a specific loss of phosphorylation at
          NdufA10 serine-250, and that phosphorylation turned out to be required for ubiquinone reduction
          by the complex.

          The claim is contested, and the contradiction is curated below rather than smoothed over. An
          independent Drosophila study reached the opposite conclusion about the site itself: overexpressing
          ND42, the fly NDUFA10 homologue, did restore complex I activity and partially rescue locomotion
          in pink1 mutants, but that rescue showed no specific requirement for phosphorylation at Ser-250.
          So the two studies agree that NDUFA10 abundance governs complex I activity downstream of PINK1,
          and disagree about whether the serine-250 phospho-switch is the mechanism.

          Whether any of this bears on MC1DN22 is a separate and unexamined question. No phosphorylation
          measurement has been made in an NDUFA10 patient''s cells, and none of the alleles quotable here
          is described as affecting serine-250. The node is curated as a hypothesis about a second, potentially
          separable arm of the lesion, and its edge to the measured endpoint is typed as having unknown
          intermediates for that reason.'
      selected_evidence:
        snippet: we found specific loss of phosphorylation of serine-250 in complex I subunit NdufA10
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
