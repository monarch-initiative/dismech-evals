          "Juvenile-onset dystonia with spasticity in Leigh syndrome caused by a novel NDUFA10 variant";
          it has no abstract, and neither PubMed nor its DOI returns any body text, so its cached record
          is empty. Its title is the only accessible statement about it, and a title is not a finding.
          Dystonia and spasticity are therefore NOT curated as phenotypes of this entity, and the juvenile
          onset it reports is not curated either.'
