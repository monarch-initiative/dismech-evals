      assertion_type: Pathophysiology
      assertion:
        name: Optic Nerve Degeneration
        biological_scale: TISSUE
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'The mild pole, and the reason this entity is not simply "NDUFA10 Leigh syndrome".
          A 2026 screen of complex I genes in patients with optic atrophy found biallelic NDUFA10 variants
          in three families and reported optic atrophy - isolated in one of them - as a presentation of
          this gene for the first time. The optic nerve is not a surprising target: it is already on the
          list of structures degenerating in Leigh syndrome, and retinal ganglion cells are the classic
          casualty of complex I failure in the mitochondrial optic neuropathies.

          PROVISIONAL because the number of families is small, because the series is a targeted ascertainment
          of patients who already had optic atrophy - so it cannot say how often NDUFA10 disease presents
          this way - and because no mechanism specific to retinal ganglion cells has been demonstrated
          for this gene.'
      selected_evidence:
        snippet: Furthermore, isolated or plus OA was found for the first time in NDUFV2, NDUFA1, NDUFA10
          and NDUFAF3 families, for which only a single report of arLHON existed for a patient carrying
          NDUFA10 variants.
        supports: SUPPORT
        directness: DIRECT
