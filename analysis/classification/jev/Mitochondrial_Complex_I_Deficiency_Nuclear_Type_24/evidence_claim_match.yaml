        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Respirasome Oligomerization
        biological_scale: MOLECULAR
        role: effector
        mechanism_confidence: HYPOTHETICAL
        description: 'A second, structurally motivated role that has never been tested in a patient. Two
          independent cryo-electron microscopy structures of the porcine heart respirasome - the 1.7-megadalton
          supercomplex of one complex I, a complex III dimer and one complex IV - place NDUFB9 among the
          accessory subunits that directly mediate the oligomerization of the individual complexes into
          the supercomplex. Losing NDUFB9 should therefore impair supercomplex formation as well as complex
          I assembly.

          This node is HYPOTHETICAL in the strict sense: it is an inference from a static structure to
          a functional consequence, with no supporting measurement in any NDUFB9-deficient cell. It is
          curated rather than omitted because it is a testable prediction that distinguishes this subunit
          from most other complex I accessory subunits, and because a respirasome assay is an obvious
          next experiment that nobody appears to have run.'
      selected_evidence:
        snippet: Several accessory or supernumerary subunits of CI, such as NDUFA11, NDUFB4, NDUFB8, and
          NDUFB9, directly contribute to the oligomerization of CI, CIII, and CIV.
        supports: SUPPORT
