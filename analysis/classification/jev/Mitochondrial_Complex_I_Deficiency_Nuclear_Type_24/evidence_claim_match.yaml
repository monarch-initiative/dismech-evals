              label: mitochondrial complex I deficiency, nuclear type 24
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the NDUFB9-Acyl Carrier Protein Module
        biological_scale: MOLECULAR
        role: effector
        mechanism_confidence: HYPOTHETICAL
        description: 'The mechanistic account of why losing an accessory subunit disassembles the enzyme.
          NDUFB9 is LYRM3, a leucine-tyrosine-arginine motif protein, and its role is to anchor a copy
          of mitochondrial acyl carrier protein - the central element of mitochondrial fatty acid synthesis
          - to the complex I membrane arm. In Yarrowia lipolytica the two ACP-LYRM modules have a division
          of labour that maps onto this disease well: the ACPM1-LYRM6 (NDUFA6) module is essential for
          complex I activity, while the ACPM2-LYRM3 (NDUFB9) module is essential for assembly and stability.
          A patient with reduced NDUFB9 should therefore lose complex I amount, not just complex I function
          - which is exactly what was measured.

          Marked HYPOTHETICAL despite that agreement, because the module assignment comes entirely from
          a yeast enzyme that carries two ACPMs where the mammalian enzyme carries one, and no study has
          tested ACP anchoring in an NDUFB9 patient or in any human cell. The correspondence between the
          yeast prediction and the patient measurement is suggestive, not demonstrative.

          That said, the broader assembly-or-stability claim does have patient-level corroboration waiting
          behind the paywall, and it belongs here as an uncited lead. The deep-research report records
          that NDUFS1, NDUFS3, NDUFB8 and NDUFA9 were all reduced in the patient''s fibroblasts and all
          restored by wild-type NDUFB9. A single accessory-subunit lesion depleting several other subunits,
          reversibly, is the signature of failed assembly rather than failed catalysis - and unlike the
          yeast module assignment it is a human-cell observation. It is not curated as evidence because
          it is not snippet-verifiable; what stays HYPOTHETICAL is specifically the ACP-anchoring mechanism,
          not the assembly phenotype it is invoked to explain.

          A further consequence worth recording: the anchoring depends on a long acyl chain on the ACP
          phosphopantetheine cofactor, so this module is a point at which complex I biogenesis is coupled
          to mitochondrial fatty acid synthesis rather than to respiration.'
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex I assembly
          modifier: DECREASED
          term:
            id: GO:0032981
            label: mitochondrial respiratory chain complex I assembly
      selected_evidence:
        snippet: They are anchored to the protein complex by LYR (leucine-tyrosine-arginine) motif containing
          protein (LYRM) subunits LYRM3 (NDUFB9) and LYRM6 (NDUFA6).
        supports: SUPPORT
