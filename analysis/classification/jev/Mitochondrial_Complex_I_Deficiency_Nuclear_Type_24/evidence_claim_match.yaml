        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other nuclear-encoded complex I subunit and assembly factor deficiencies
        description: 'MC1DN24 is one of a large family of nuclear complex I deficiencies, and it cannot
          be separated from its siblings clinically or biochemically - only by genotype. The class spans
          38 nuclear-encoded subunits and a growing list of assembly factors, and this knowledge base
          already carries several members (NDUFS8, NDUFA1, TIMMDC1). A structural distinction that may
          eventually matter: NDUFB9 is an accessory subunit whose loss reduces the assembled amount of
          complex I, whereas a core-subunit defect would be expected to reduce activity with the enzyme
          still assembled. That distinction is visible on a combined amount-and-activity assay but has
          not been shown to have any clinical correlate.'
      selected_evidence:
        snippet: Causative genetic defects may involve the seven mitochondrial-encoded or 38 nuclear-encoded
          subunits of the enzyme, or any of an increasing number of assembly factors implicated in the
          correct biosynthesis of complex I within the inner mitochondrial membrane.
        supports: SUPPORT
