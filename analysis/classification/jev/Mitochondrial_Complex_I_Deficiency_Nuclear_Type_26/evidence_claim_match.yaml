        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn26_genotype_severity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the severity of an NDUFA9 allele's assembly defect predict whether a patient dies
          in infancy or lives into adulthood with dystonia?
        attaches_to:
        - pathophysiology#Destabilized Matrix-Membrane Arm Junction and Stalled Complex I Assembly
        - pathophysiology#Isolated Complex I Deficiency
        rationale: 'The 2018 comparison of two patients concluded that clinical severity tracks the severity
          of the assembly defect. The neonatal patient had Q- and P-module subassembly accumulation and
          near-absent activity. The adult with dystonia had Q-module accumulation only and about 17 percent
          activity. The 2025 cohort points the other way in one family: one affected brother homozygous
          for Arg354Gln had normal fibroblast complex I activity despite losing fully assembled complex
          I, and he died at 13. The 2025 authors state that correlations are limited by the small number
          of mostly private variants. Fibroblasts may also not reflect brain.'
        proposed_experiments:
        - experiment_id: exp_mc1dn26_isogenic_alleles
          name: Compare patient alleles in an isogenic NDUFA9-null background
          description: Re-express each of the nine patient alleles in NDUFA9-knockout human cells, or
            in iPSC-derived striatal neurons, and quantify NDUFA9 stability, subassembly accumulation
            and complex I activity side by side, to see whether the measurements rank the alleles in line
            with clinical severity.
      selected_evidence:
        snippet: demonstrates that the severity of the clinical phenotype correlates with the severity
          of the effects of the different NDUFA9 variants on complex I assembly
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28671271
      reference_title: NDUFA9 point mutations cause a variable mitochondrial complex I assembly defect.
