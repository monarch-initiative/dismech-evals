      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn26_null_allele_viability
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is complete loss of NDUFA9 lethal in humans, so that only hypomorphic missense alleles
          are seen in patients?
        attaches_to:
        - pathophysiology#Biallelic NDUFA9 Missense Variants
        rationale: All nine reported alleles are missense, none affects the presequence, and the knockout
          in human cell lines abolishes matrix-arm attachment. The 2025 authors suggest that complete
          loss of function may be incompatible with survival. With twelve patients this is an ascertainment-limited
          observation, not a demonstrated constraint, and no NDUFA9 animal model has been reported to
          test it.
      selected_evidence:
        snippet: From a genotypic perspective, all nine NDUFA9 variants linked to human disease so far
          are missense mutations, which might suggest that complete loss of function is not compatible
          with complex I assembly and/or functioning and ultimately with survival in humans.
        supports: SUPPORT
