            label: NADH dehydrogenase (ubiquinone) activity
        biological_processes:
        - preferred_term: mitochondrial electron transport, NADH to ubiquinone
          modifier: DECREASED
          term:
            id: GO:0006120
            label: mitochondrial electron transport, NADH to ubiquinone
      selected_evidence:
        snippet: Five affected individuals underwent respiratory chain enzyme testing in dermal fibroblasts
          and/or muscle tissue, with confirmation of isolated complex I deficiency in all and detection
          of a complex I stalled assembly intermediate in one individual (F3-P1).
        supports: SUPPORT
