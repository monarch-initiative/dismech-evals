      assertion_type: Pathophysiology
      assertion:
        name: Biallelic NDUFA9 Missense Variants
        conforms_to: complex_i_deficiency#Complex I Biogenesis or Repair Failure
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: The initiating lesion. Nine missense variants are known, all in the mature protein
          rather than the mitochondrial targeting presequence, and most lie in the last exon. Arg360 is
          changed in three unrelated families (to Cys, Gly and Leu) and has been proposed as a mutational
          hotspot. Two complementation experiments in patient fibroblasts, carrying the Arg321Pro and
          Arg360Cys alleles, show that wild-type NDUFA9 corrects the defect. That makes the variants causal
          and loss of function.
        genes:
        - preferred_term: NDUFA9
          term:
            id: hgnc:7693
            label: NDUFA9
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          description: Curated as loss of function because wild-type NDUFA9 rescues the fibroblast defect.
            The reported alleles are all missense, and the 2025 cohort authors suggest that complete loss
            of NDUFA9 may be incompatible with survival. If so, the human alleles are hypomorphs rather
            than nulls, but this has not been tested and PARTIAL_LOSS_OF_FUNCTION is not asserted. Zygosity
            is left unset at entry level because eleven of twelve patients are homozygous and one is compound
            heterozygous.
      selected_evidence:
        snippet: A pathogenic mutation was found in the complex I subunit encoding the NDUFA9 gene, changing
          a highly conserved arginine at position 321 to proline.
        supports: SUPPORT
