        mechanism_confidence: ESTABLISHED
        description: 'The biochemical endpoint. All five patients tested had complex I deficiency in fibroblasts
          and/or muscle, and the deficiency is isolated: the other respiratory chain complexes are normal
          in both amount and activity. Residual activity ranges from about 2 percent of control in the
          fatal neonatal case to about 20 percent in the two adults with dystonia. That fits the report
          that clinical severity tracks the severity of the assembly defect, although one affected brother
          had normal fibroblast activity (see discussions). The module''s ATP-synthesis consequence is
          inferred from loss of complex I and was not measured in these patients.'
        genes:
        - preferred_term: NDUFA9
          term:
            id: hgnc:7693
            label: NDUFA9
        molecular_functions:
