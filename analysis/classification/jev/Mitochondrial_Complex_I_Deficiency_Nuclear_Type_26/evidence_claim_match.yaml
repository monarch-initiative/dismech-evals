        description: The Leigh syndrome lesion pattern, and the substrate of the movement disorder. Every
          patient imaged had abnormal basal ganglia signal, always involving the putamen and caudate.
          The accumbens, thalami and globi pallidi were involved less often. Atrophy or swelling and foci
          of restricted diffusion accompany the signal change, and symmetric brainstem lesions (central
          tegmental tracts, cerebral peduncles, periaqueductal grey, posterior medulla) appear in a minority.
          Follow-up scans in two brothers showed the basal ganglia atrophy getting worse. The 2025 authors
          read the consistency of the striatal involvement as a selective vulnerability of these structures.
          The cause of that vulnerability is not known.
        locations:
