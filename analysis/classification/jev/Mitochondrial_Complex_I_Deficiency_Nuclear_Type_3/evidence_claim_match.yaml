              label: mitochondrial complex I deficiency, nuclear type 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NDUFS7 Loss of Function
        conforms_to: complex_i_deficiency#Complex I Biogenesis or Repair Failure
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'Biallelic NDUFS7 variants. The reported alleles fall into two mechanistic classes,
          and the distinction matters downstream.

          Missense alleles leave a protein to be made: V122M, homozygous in the 1999 sibling pair and
          the first missense mutation found in any nuclear-encoded complex I subunit; R145H, homozygous
          in a consanguineous family, altering a highly conserved region and absent from over a hundred
          ethnically matched controls; and the further L126F and R168S alleles that later structural work
          grouped with them.

          Splice alleles remove the protein instead. A first-intron variant (c.17-1167C>G) creates a strong
          donor splice site and a cryptic exon, predicted to yield a 41-residue product retaining only
          the first five amino acids of the normal 213; the intronic c.16+5G>A variant found in Finnish
          siblings likewise acts through splicing.

          Note on nomenclature: the founding allele is written V122M in the yeast reconstruction and V112M
          in the fibroblast panel that used the same cell line. That is a numbering difference, not two
          alleles, and a curator matching variant strings across these papers should expect it.'
        genes:
        - preferred_term: NDUFS7
          term:
            id: hgnc:7714
            label: NDUFS7
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          description: Biallelic germline NDUFS7 variants, homozygous in the reported pedigrees; missense
            in the founding cases and splice-altering in the intronic ones.
      selected_evidence:
        snippet: We report the first missense mutation within the nuclear encoded complex I subunit, NDUFS7,
          in 2 siblings with neuropathologically proven complex I-deficient Leigh syndrome.
        supports: SUPPORT
