            term:
              id: MONDO:0032608
              label: mitochondrial complex I deficiency, nuclear type 3
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other nuclear-encoded complex I subunit and assembly factor deficiencies
        description: 'MC1DN3 cannot be separated from its sibling entities clinically or biochemically
          - only by genotype. The differential spans 38 nuclear-encoded subunits plus a growing list of
          assembly factors, and this knowledge base already carries several members (NDUFS8, NDUFS2, NDUFA1,
          NDUFA12, NDUFB9). A distinction that may eventually matter for NDUFS7 specifically: it is a
          core Q-module subunit, so its lesion has a catalytic component on top of the reduced-amount
          component that accessory-subunit defects produce alone. That shows on a combined amount-and-activity
          assay and has no established clinical correlate.'
      selected_evidence:
        snippet: Causative genetic defects may involve the seven mitochondrial-encoded or 38 nuclear-encoded
          subunits of the enzyme, or any of an increasing number of assembly factors implicated in the
          correct biosynthesis of complex I within the inner mitochondrial membrane.
        supports: SUPPORT
