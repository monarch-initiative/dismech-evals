          consanguineous family with the cryptic-exon intronic allele, and the homozygous R105C families
          in the optic-atrophy series. Sibling recurrence with unaffected parents is the recurring pedigree
          shape, and it is reproduced in the canine model, where the variant co-segregated in a litter
          exactly as a monogenic recessive trait predicts.'
