          the other complexes are unchanged, which is what makes the defect isolated and points the analysis
          at a complex I subunit or assembly factor rather than at a global mitochondrial problem.'
      selected_evidence:
        snippet: Analysis of the assembly state of the respiratory chain complexes under native condition
          revealed a marked decrease of fully assembled complex I while the quantity of the other complexes
          was not altered.
