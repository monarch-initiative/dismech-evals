        context:
        - path: /experimental_models/0
          value:
            name: Yarrowia lipolytica complex I carrying the PSST V122M patient substitution
            experimental_model_type: OTHER
            description: The patient V122M substitution reconstructed in the PSST homologue of the obligate
              aerobic yeast Yarrowia lipolytica, whose complex I can be assayed in isolated mitochondrial
              membranes. It is the cleanest available separation of the allele's catalytic effect from
              everything else about a patient cell, and it is what first showed that a nuclear-coded subunit
              participates in the reaction with ubiquinone.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Defective NADH-to-Ubiquinone Electron Transfer
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Reconstructing the patient allele in a yeast complex I halves Vmax and shifts the
          Km for decyl-ubiquinone, isolating a quinone-reaction defect.
        limitations: A yeast enzyme carrying an engineered substitution at the homologous position, not
          the human enzyme; the residue numbering and sequence context differ. The measured Vmax reduction
          of about 50% is far milder than the near-complete deficiency seen in patient tissue, so the
          model captures the direction of the lesion rather than its magnitude.
        readouts:
        - name: Complex I Vmax in isolated mitochondrial membranes
          target: Defective NADH-to-Ubiquinone Electron Transfer
          direction: DECREASED
          interpretation: The catalytic capacity of the enzyme carrying the patient substitution.
        - name: Km for n-decyl-ubiquinone
          target: Defective NADH-to-Ubiquinone Electron Transfer
          direction: ALTERED
          interpretation: A quinone-site-specific readout, altered by a mutation in a nuclear-coded subunit.
      selected_evidence:
        snippet: We have used the obligate aerobic yeast Yarrowia lipolytica to reconstruct and analyse
          three missense mutations in the nuclear coded subunits homologous to bovine TYKY and PSST of
          mitochondrial complex I
        supports: SUPPORT
