  3dfc9ea585739c8ae9575576828a3ab2a480f55ef7afdf30139abfe611d39cb4:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency Nuclear Type 3
          disease_term:
            preferred_term: mitochondrial complex I deficiency, nuclear type 3
            term:
              id: MONDO:0032608
              label: mitochondrial complex I deficiency, nuclear type 3
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Sequencing strategies that reach intronic NDUFS7 alleles
        description: 'Two of the reported NDUFS7 pedigrees carry intronic variants, one of them deep in
          the first intron (c.17-1167C>G) and acting by creating a cryptic exon. A coding-only analysis
          will not find them. The first such family was solved by genotyping microsatellite markers at
          candidate loci, before exome sequencing was routine; the second by whole exome sequencing that
          captured a variant five bases into an intron. The practical point stands regardless of era:
          a complex I-deficient patient with no coding variant found is not a patient in whom NDUFS7 has
          been excluded.'
      selected_evidence:
        snippet: By genotyping several putative disease loci using microsatellite markers we were able
          to describe a new NDUFS7 mutation in a consanguineous family with Leigh syndrome and isolated
