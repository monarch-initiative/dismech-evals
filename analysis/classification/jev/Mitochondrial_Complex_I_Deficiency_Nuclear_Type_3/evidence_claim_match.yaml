        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        description: Tests whether the patient-equivalent allele retains NDUFS7 function, by asking whether
          it can substitute for the endogenous orthologue.
        limitations: Neither construct fully rescued lethality, so the assay measures a difference in
          partial rescue rather than function versus no function. It uses overexpression of a canine protein
          in an invertebrate, tests the canine rather than a human allele, and reports developmental lethality
          rather than any neurological or bioenergetic phenotype.
        readouts:
        - name: Developmental stage at lethality following ND-20 knockdown
          target: NDUFS7 Loss of Function
          direction: RESTORED
          interpretation: Wild-type NDUFS7 delays lethality to later development; the mutant does not,
            indicating the variant impairs the subunit's function.
      selected_evidence:
        snippet: Neither of the investigated overexpression lines completely rescued the lethality upon
          knockdown of the endogenous ND-20.
        supports: SUPPORT
