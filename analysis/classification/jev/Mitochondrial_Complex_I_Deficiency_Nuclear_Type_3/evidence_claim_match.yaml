              label: mitochondrial complex I deficiency, nuclear type 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Q-Module Integrity at the Cluster N2 and CoQ Binding Site
        biological_scale: MOLECULAR
        genes:
        - preferred_term: NDUFS7
          term:
            id: hgnc:7714
            label: NDUFS7
          modifier: DECREASED
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'What NDUFS7/PSST actually does, and the reason a missense allele here is not equivalent
          to losing an accessory subunit. Complex I transfers two electrons from NADH to FMN and then
          one at a time along a ninety-five-angstrom chain of seven conserved iron-sulfur clusters to
          a quinone-binding site at the interface with the membrane domain. That site is unusually long,
          narrow and enclosed, and the quinone headgroup binds at its deep end, immediately adjacent to
          cluster N2 - the cluster that donates the electrons. NDUFS7 sits at the junction between the
          peripheral and membrane arms and contributes to forming that site.

          The functional consequence has been isolated experimentally. Mutating conserved residues in
          the PSST loop that faces the roughly thirty-angstrom Q-binding tunnel causes a drastic decrease
          in quinone reductase activity despite full assembly of the complex, and molecular dynamics of
          the arginine variants shows the bound quinone being ejected from the site near N2. This is a
          catalytic lesion, separable from the assembly lesion that the truncating alleles produce.'
        cellular_components:
        - preferred_term: respiratory chain complex I
          term:
            id: GO:0045271
            label: respiratory chain complex I
        molecular_functions:
        - preferred_term: 4 iron, 4 sulfur cluster binding
          modifier: DECREASED
          term:
            id: GO:0051539
            label: 4 iron, 4 sulfur cluster binding
      selected_evidence:
        snippet: The quinone headgroup binds at the deep end of this chamber, near iron-sulphur cluster
          N2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23417064
      reference_title: Crystal structure of the entire respiratory complex I.
      evidence_source: IN_VITRO
      explanation: Establishes the spatial relationship between the quinone site and cluster N2 that makes
