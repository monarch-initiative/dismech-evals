        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'The second, separable arm of the lesion. Native analysis of respiratory-chain complexes
          in the cryptic-exon patient showed a marked decrease of fully assembled complex I while the
          other complexes were unaltered - the definition of an isolated, assembly-level complex I defect.
          The Finnish siblings with the c.16+5G>A allele were likewise characterised as having an isolated
          complex I assembly defect on blue native PAGE.

          NDUFS7 enters the assembly pathway early: complexome profiling places NDUFAF8, together with
          NDUFAF5, at the early stabilisation of NDUFS7, which is why a defect in this subunit stalls
          Q-module maturation rather than removing a late decorative step.

          A negative observation from an unrelated study is worth recording here because it is specific
          to this gene: in patient fibroblasts carrying an NDUFS7 mutation, the assembly factor NDUFAF2
          was not detected on complex I at all, whereas in NDUFS1- and NDUFV1-mutant cells it remained
          attached to the 830-kDa subcomplex. Whatever intermediate NDUFAF2 normally holds is not formed
          or not retained when NDUFS7 is defective.'
