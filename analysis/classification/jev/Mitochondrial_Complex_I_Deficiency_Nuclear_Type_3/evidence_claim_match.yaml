      assertion_type: Biochemical
      assertion:
        name: Complex I activity relative to assembled complex I amount in fibroblasts
        notes: A ratio rather than a level, and the more informative of the two measurements. In control
          fibroblasts complex I enzymatic activity divided by complex I amount is one; in fibroblasts
          from children with nuclear complex I subunit defects including NDUFS7 it falls below one. Enzyme
          that is present is not fully working, which separates an intrinsic catalytic defect from a shortage
          of enzyme and is exactly what a Q-module core subunit lesion predicts.
        cell_types:
