              label: mitochondrial complex I deficiency, nuclear type 3
        context:
        - path: /experimental_models/2
          value:
            name: NDUFS7-mutant HEK293T cells
            experimental_model_type: CELL_LINE
            description: An engineered NDUFS7 mutation in HEK293T cells, used to ask what limits cell
              death in complex I deficiency. Loss of the subunit reduces proliferation and raises death
              and oxidative-stress susceptibility; upregulated SLC7A11 imports cystine and raises glutathione,
              and that response measurably restrains the death. It is the only NDUFS7-specific cellular
              model in the literature and the only one that identifies a compensatory pathway.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Isolated Complex I Deficiency and Bioenergetic Failure
        relationship: RECAPITULATES
        fidelity: LOW
        description: Reproduces the oxidative-stress vulnerability of NDUFS7 loss in a genetically defined
          cell background.
        limitations: HEK293T is an immortalised, transformed embryonic kidney line with a glycolytic metabolic
          phenotype and no relationship to the neurons or retinal ganglion cells that fail in patients.
          The mutation is engineered rather than a patient allele, and cell proliferation and death are
          not the clinical endpoints.
        readouts:
        - name: Cell death and oxidative-stress susceptibility
          target: Isolated Complex I Deficiency and Bioenergetic Failure
          direction: INCREASED
          interpretation: Loss of NDUFS7 alone is sufficient to raise cell death and sensitivity to oxidative
            stress.
        - name: Cell death after SLC7A11 upregulation
          target: Isolated Complex I Deficiency and Bioenergetic Failure
          direction: DECREASED
          interpretation: Cystine import and glutathione synthesis limit the death caused by NDUFS7 loss,
            identifying an endogenous compensatory pathway.
      selected_evidence:
        snippet: we introduced a mutation in NDUFS7, a crucial subunit of CI, in HEK293T cells
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/2/modeled_mechanisms/0
