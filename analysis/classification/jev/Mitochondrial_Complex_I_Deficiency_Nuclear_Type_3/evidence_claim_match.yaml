      assertion_type: DifferentialDiagnosis
      assertion:
        name: Mitochondrial-DNA-encoded complex I deficiency
        description: 'About a quarter of complex I deficiency is caused by mitochondrial DNA mutations,
          with maternal inheritance, heteroplasmy and recurrence-risk implications entirely different
          from a nuclear recessive disorder. Distinguishing them changes the counselling more than it
          changes the management. It matters here in a second way as well: the optic-atrophy presentation
          of NDUFS7 disease is clinically indistinguishable from mitochondrially inherited Leber hereditary
          optic neuropathy, so an mtDNA-negative LHON phenotype should not close the mitochondrial investigation.'
      selected_evidence:
        snippet: we highlight the possibly underestimated prevalence of CI nuclear subunits in the molecular
          diagnosis of ION, prompting the inclusion of all CI-related genes in the standard diagnostic
          screening
        supports: SUPPORT
