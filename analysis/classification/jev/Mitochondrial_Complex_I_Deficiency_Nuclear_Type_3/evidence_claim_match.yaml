              label: mitochondrial complex I deficiency, nuclear type 3
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ndufs7_variant_position_determines_phenotype
        hypothesis_label: Variant position within NDUFS7 determines whether the presentation is Leigh
          syndrome or isolated optic atrophy
        status: EMERGING
        description: 'The proposal is that the two clinical poles of NDUFS7 disease are not modifier-driven
          but position-driven within a single subunit. Variants associated with Leigh syndrome - L126F,
          R145H, R168S - cluster close to iron-sulfur cluster N2 and the coenzyme Q binding site, where
          they should impair the terminal electron-transfer step directly. Variants found in isolated
          optic atrophy - R75C, R100C, R105C - sit instead in the N-terminal region of the subunit, peripherally,
          where they mediate protein-protein interfaces with NDUFS2, NDUFS8, NDUFA7 and NDUFA12 rather
          than lining the catalytic site.

          If this holds, the same gene produces a severe infantile encephalopathy or an adult-onset optic
          neuropathy according to whether the lesion is catalytic or interfacial, and the structural position
          of a novel allele becomes prognostically informative. It is graded EMERGING because the segregation
          is explicitly described as partial, rests on one cohort mapped onto a single structure, and
          is supported by in-silico prediction rather than functional assays of the new alleles. ND1 is
          noted as the one interaction partner shared across both variant groups, which is a caveat rather
          than a refutation.'
      selected_evidence:
        snippet: Moreover, in the NDUFS7 subunit, partial spatial segregation was observed for missense
          variants associated with either Leigh syndrome or isolated optic atrophy, suggesting possible
          disease-specific molecular defects.
        supports: SUPPORT
