      assertion_type: Pathophysiology
      assertion:
        name: Retinal Ganglion Cell and Optic Nerve Vulnerability
        biological_scale: TISSUE
        role: consequence
        mechanism_confidence: PROVISIONAL
        description: 'The other end of the tissue spectrum, and the newer of the two. In a 2026 optic-neuropathy
          cohort NDUFS7 was the most frequently affected gene, and biallelic core-subunit variants produced
          isolated optic atrophy in six of eight patients, with either insidious childhood onset or an
          acute to subacute young-adult course indistinguishable from Leber hereditary optic neuropathy.
          NDUFS7 is among the genes that series associates with the autosomal recessive LHON phenotype.

          Curated PROVISIONAL for the tissue claim specifically: the association rests on one large case
          series with in-silico rather than functional validation of the new alleles, and none of the
          classical Leigh-associated NDUFS7 patients was reported with isolated optic involvement. The
          mechanistic proposal for why the same gene should do two different things is curated separately
          as a hypothesis.'
        locations:
        - preferred_term: optic nerve
          term:
            id: UBERON:0000941
            label: cranial nerve II
      selected_evidence:
        snippet: The homozygous variant c.313C>T p.(R105C) was found in affected individuals from Families
          D and E, making NDUFS7 the most commonly affected gene in our case series.
        supports: SUPPORT
