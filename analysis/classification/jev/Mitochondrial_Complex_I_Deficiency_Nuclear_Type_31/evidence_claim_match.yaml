              label: mitochondrial complex I deficiency, nuclear type 31
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TIMMDC1 Poison-Exon Inclusion
        conforms_to: complex_i_deficiency#Complex I Biogenesis or Repair Failure
        role: trigger
        biological_scale: MOLECULAR
        description: 'The recurrent pathogenic allele is not a coding change. c.597-1340A>G (equivalently
          c.596+2146A>G under the earlier transcript numbering) lies deep within intron 5 and acts as
          a splicing enhancer, causing an ~80 bp cryptic exon to be spliced into the mature transcript
          between exons 5 and 6. The inserted exon shifts the reading frame and introduces a premature
          termination codon (p.Gly199_Thr200ins5*), so the aberrant message is degraded by nonsense-mediated
          decay.

          Curated as the trigger node rather than as a variant annotation because the splicing event is
          the mechanism: everything downstream follows from the transcript, and the one available therapeutic
          handle acts here and nowhere else.'
        genes:
        - preferred_term: TIMMDC1
          term:
            id: hgnc:1321
            label: TIMMDC1
        genetic_context:
          gene:
            preferred_term: TIMMDC1
            term:
              id: hgnc:1321
              label: TIMMDC1
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Homozygous in the three discovery families and in the 2022 consanguineous sibship;
            compound heterozygous with the nonsense allele c.385C>T (p.Arg129*) in the 2021 Dutch sibling
            pair.
        biological_processes:
        - preferred_term: pre-mRNA splicing of TIMMDC1 intron 5
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: ABNORMAL
        - preferred_term: nonsense-mediated decay of the poison-exon transcript
          term:
            id: GO:0000184
            label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
          modifier: INCREASED
      selected_evidence:
        snippet: One such event is found in the complex I assembly factor TIMMDC1 establishing a novel
          disease-associated gene.
        supports: SUPPORT
