  b68dd170f25edfada314d0e701d8252d0ce0f8a8d1feb1be4202cb5104d6301f:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency Nuclear Type 31
          disease_term:
            preferred_term: mitochondrial complex I deficiency, nuclear type 31
            term:
              id: MONDO:0032634
              label: mitochondrial complex I deficiency, nuclear type 31
        context: []
      assertion_type: Genetic
      assertion:
        name: TIMMDC1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: TIMMDC1
          term:
            id: hgnc:1321
            label: TIMMDC1
        association: 'Biallelic loss-of-function variants in TIMMDC1 cause this disease. The gene was
          established in 2017 when RNA sequencing of exome-negative mitochondriopathy patients found the
          same deep intronic allele in three unrelated families from three different ethnicities, which
          is what carried the causality argument - a single family with a deep intronic variant of this
          kind would not have.

          Two allele classes are reported. The recurrent deep intronic enhancer variant c.597-1340A>G
          (c.596+2146A>G in the original numbering) is by far the most common and is present in gnomAD
          at roughly 1 in 5,000. Nonsense alleles also occur: c.385C>T (p.Arg129*) was found in trans
          with the intronic allele in a Dutch sibling pair.

          The practical point for a diagnostic laboratory is that exome sequencing sees the coding allele
          and not the intronic one, so a TIMMDC1 patient can present as an unsolved heterozygote. In the
          2021 report that is exactly what happened, and the second allele was recovered only by targeted
          sequencing of the intron.'
      selected_evidence:
        snippet: One such event is found in the complex I assembly factor TIMMDC1 establishing a novel
          disease-associated gene.
        supports: SUPPORT
    origin:
