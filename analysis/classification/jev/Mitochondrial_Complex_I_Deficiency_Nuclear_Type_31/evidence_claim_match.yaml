  c1d9d0da824bd89bfbbcf3600c714dfbfeba25e28ab62289da0e9bf7a8a08c8e:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency Nuclear Type 31
          disease_term:
            preferred_term: mitochondrial complex I deficiency, nuclear type 31
            term:
              id: MONDO:0032634
              label: mitochondrial complex I deficiency, nuclear type 31
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Complex I Assembly Failure
        role: central_effector
        biological_scale: MOLECULAR
        description: 'Without TIMMDC1 the ND1 module fails to be built and the subunits that would have
          joined the holoenzyme are turned over instead. Quantitative proteomics on patient fibroblasts
          shows reduced ND1 together with reduced ND1-module subunits NDUFA8 and NDUFA13 and other complex
          I subunits, and the discovery cohort found globally decreased complex I subunit levels by both
          proteomics and western blot. The loss is of assembled complex rather than of transcription:
          the subunit genes are intact and the defect is post-translational.'
        cellular_components:
        - preferred_term: respiratory chain complex I
          term:
            id: GO:0045271
            label: respiratory chain complex I
        molecular_functions:
        - preferred_term: NADH:ubiquinone oxidoreductase activity
          term:
            id: GO:0008137
            label: NADH dehydrogenase (ubiquinone) activity
          modifier: DECREASED
      selected_evidence:
        snippet: Re-expression of TIMMDC1 in these cells increased complex I subunit levels
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28604674
      reference_title: Genetic diagnosis of Mendelian disorders via RNA sequencing.
      evidence_source: IN_VITRO
      explanation: 'The complementation experiment, which is the strongest evidence that the subunit loss
        is caused by absent TIMMDC1 rather than by anything else in the patient background: putting the
        protein back reverses it.'
