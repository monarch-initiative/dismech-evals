        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'No prevalence estimate exists. The literature comprises a small number of families: three
          unrelated families homozygous for the recurrent deep intronic allele in the 2017 discovery report,
          a Dutch sibling pair reported in 2021, and a consanguineous sibship reported in 2022. The recurrent
          allele is present in gnomAD at roughly 1 in 5,000, which bounds the carrier pool but not the
          disease frequency, since detection of the second allele depends on assays most laboratories
          do not run.'
      selected_evidence:
        snippet: Genome sequencing data revealed a known, deep intronic pathogenic variant TIMMDC1 c.597-1340A>G,
          also present in gnomAD (~1/5000 frequency), that enhances aberrant splicing.
        supports: SUPPORT
