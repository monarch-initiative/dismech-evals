      assertion_type: Diagnosis
      assertion:
        name: Targeted Intronic Sequencing of TIMMDC1
        description: Once one TIMMDC1 allele is known, the second can be recovered by sequencing the intronic
          region containing the recurrent enhancer variant. Standard exome capture does not cover it.
      selected_evidence:
        snippet: 'Exome sequencing yielded a novel heterozygous TIMMDC1 variant: c.385C > T, p.(Arg129*).
          Targeted sequencing revealed the previously published deep intronic variant c.596 + 2146A >
          G, p.(Gly199_Thr200ins5*) on the second allele which is not detected by exome sequencing. In
          summary, we present the fourth family with TIMMDC1-related disease, with a novel nonsense variant.
          This report illustrates the importance of considering mitochondrial disease even when laboratory
          findings are normal, and the added value of targeted sequencing of introns.'
        supports: SUPPORT
