        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of TIMMDC1 Protein
        role: central_effector
        biological_scale: MOLECULAR
        description: 'TIMMDC1 is a multi-pass inner mitochondrial membrane protein that acts as an assembly
          factor for complex I, and in particular for the biogenesis of the mitochondrially encoded core
          subunit ND1. Patient cells carrying the poison-exon allele have almost no detectable TIMMDC1
          protein; in the discovery cohort the protein could not be detected at all by quantitative proteomics.

          The node is kept separate from the splicing node because it is the level at which the rescue
          experiments read out: restoring the protein is what the antisense oligonucleotides achieve,
          and what everything downstream is then measured against.'
        cellular_components:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex I assembly
          term:
            id: GO:0032981
            label: mitochondrial respiratory chain complex I assembly
          modifier: DECREASED
      selected_evidence:
        snippet: TIMMDC1 is a multi-pass membrane protein found within the inner mitochondrial membrane
          and implicated in the biogenesis of core complex I subunit ND1, one of the 13 proteins encoded
          by mitochondrial DNA
        supports: SUPPORT
