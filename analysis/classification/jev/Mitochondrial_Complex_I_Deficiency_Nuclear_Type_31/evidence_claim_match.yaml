        name: Splice-Switching Antisense Oligonucleotide (investigational)
        therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
        description: 'Two splice-switching oligonucleotides, SSO1 and SSO2, target the region around the
          pathogenic intronic enhancer and suppress inclusion of the poison exon. In patient fibroblasts
          they restore normal TIMMDC1 message, restore protein to at least parental levels, restore complex
          I subunit abundance by quantitative proteomics, and raise oxygen consumption, ATP production
          and maximal respiration. A non-targeting control oligonucleotide does none of this.

          This is preclinical. It has been shown only in cultured patient fibroblasts, there is no animal
          work and no trial, and the approach would be allele-specific - it treats the splicing lesion,
          so it has nothing to offer a patient whose alleles are both nonsense variants. It is curated
          because the mechanism makes it the one plausible disease-modifying route in a disease that otherwise
          has none.

          On the structured detail below: the oligonucleotide suppresses inclusion of an aberrant pseudoexon
          rather than skipping a constitutive exon, and SPLICE_MODULATION_EXON_SKIPPING is the closest
          available enum value. Chemistry and conjugation are not stated in the source and are left absent
          rather than guessed.'
        oligonucleotide_details:
          oligonucleotide_mechanism: SPLICE_MODULATION_EXON_SKIPPING
          target_gene:
            preferred_term: TIMMDC1
            term:
              id: hgnc:1321
              label: TIMMDC1
          target_transcript: TIMMDC1 pre-mRNA, intron 5 poison exon
      selected_evidence:
        snippet: We have designed and applied two different splice-switching antisense oligonucleotides
          (SSO) to restore normal TIMMDC1 mRNA processing and protein levels in patients' cells.
        supports: SUPPORT
