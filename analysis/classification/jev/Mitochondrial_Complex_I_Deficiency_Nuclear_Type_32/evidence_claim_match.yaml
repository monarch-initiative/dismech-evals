            term:
              id: MONDO:0032635
              label: mitochondrial complex I deficiency, nuclear type 32
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Caution interpreting the OXPHOS immunoassay that uses NDUFB8 as its complex I probe
        description: 'NDUFB8 is the conventional antibody target for complex I in quadruple immunofluorescent
          and immunoblot OXPHOS panels, and loss of NDUFB8 immunoreactivity is a validated indicator of
          a Mendelian complex I defect. The trap is directional: reduced NDUFB8 staining says complex
          I is deficient, not that NDUFB8 is mutated. In a validation series of 25 patients with genetically
          proven complex I variants, every patient with a nuclear-encoded subunit or assembly-factor mutation
          lost NDUFB8 immunoreactivity, but only three of ten patients with mtDNA-encoded subunit mutations
          did - so the assay is a sensitive screen for the nuclear causes as a class, and NDUFB8 is one
          member of that class rather than the thing being assayed for.'
      selected_evidence:
        snippet: We observed loss of NDUFB8 immunoreactivity in all patients with mutations affecting
          nuclear-encoding structural subunits and assembly factors, whilst only 3 of the 10 patients
          with mutations affecting mtDNA-encoded structural subunits showed loss of NDUFB8
        supports: SUPPORT
    origin:
