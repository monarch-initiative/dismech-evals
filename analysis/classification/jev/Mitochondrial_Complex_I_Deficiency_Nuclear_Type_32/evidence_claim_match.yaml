      assertion:
        name: Impaired NADH-Linked Oxidative Phosphorylation
        conforms_to: complex_i_deficiency#Impaired NADH:Ubiquinone Oxidoreduction and ATP Synthesis
        biological_scale: CELLULAR
        description: 'Complex I is the entry point for NADH-derived electrons into the respiratory chain
          and pumps four protons per NADH oxidised, so a complex I defect cuts both the electron flux
          into the chain and the proton-motive force that drives ATP synthesis. Cells retain succinate-driven,
          complex II-dependent respiration, which is why the defect is survivable at all and why severity
          tracks residual complex I activity and tissue energy demand rather than being uniformly lethal.

          This node is a mechanistic inference from the measured enzyme deficiency above rather than a
          separately measured quantity in these patients: no respirometry or ATP-synthesis measurement
          from an NDUFB8 patient is reported in the sources cited here, beyond the statement that complementation
          restored mitochondrial function.'
        biological_processes:
        - preferred_term: mitochondrial ATP synthesis coupled electron transport
          modifier: DECREASED
          term:
            id: GO:0042775
            label: mitochondrial ATP synthesis coupled electron transport
      selected_evidence:
        snippet: Complex I exists in supercomplex forms with respiratory chain complexes III and IV, which
          are together required for the generation of a transmembrane proton gradient used for the synthesis
          of ATP.
        supports: SUPPORT
        directness: INDIRECT
