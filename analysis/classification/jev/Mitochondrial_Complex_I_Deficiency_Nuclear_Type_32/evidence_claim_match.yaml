      assertion:
        target: Failure of Complex I Holoenzyme Assembly
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Establishes that NDUFB8 is strictly required for complex I assembly in human cells,
          which is the step the patient variants disrupt.
        limitations: A complete knockout in an immortalised cell line against patients who are compound
          heterozygous for hypomorphic alleles and retain measurable residual complex I activity; the
          model therefore overstates the severity of the molecular lesion. It also has no tissue context,
          so it cannot speak to why basal ganglia, heart and muscle are the tissues that fail.
        readouts:
        - name: Assembled complex I in the NDUFB8 knockout line
