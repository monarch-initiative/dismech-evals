        name: Autosomal recessive inheritance
        description: Both 2018 patients were compound heterozygotes, each carrying two different NDUFB8
          alleles, and neither family was reported as consanguineous. NDUFB8 is nuclear-encoded and autosomal,
          so this is a nuclear recessive mitochondrial disease with a 25 percent sibling recurrence risk
          and no maternal transmission - the feature that separates it from the mitochondrial-genome causes
          of a Leigh-like presentation. ClinGen's expert panel independently classifies the mode of inheritance
          as autosomal recessive.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Here, we describe rare biallelic variants in NDUFB8 encoding a complex I accessory subunit
          revealed by whole-exome sequencing in two individuals from two families.
        supports: SUPPORT
