  40ddb4526e72acd9b8f7f6b2623e3c889968abcd02c1507da11a33f3a820fe19:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 32
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 32
            term:
              id: MONDO:0032635
              label: mitochondrial complex I deficiency, nuclear type 32
        context: []
      assertion_type: Genetic
      assertion:
        name: NDUFB8
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: NDUFB8
          term:
            id: hgnc:7703
            label: NDUFB8
        notes: 'NDUFB8 encodes NADH:ubiquinone oxidoreductase subunit B8, an accessory subunit of the
          distal membrane arm of complex I. Its structural position - clamping the ND5 lateral helix at
          the ND5-module interface - is the mechanism of this disease and is curated as its own pathophysiology
          node.

          Two traps for anyone extending this entry from the gene rather than from the disease.

          First, and by far the larger, NDUFB8 is the standard antibody target for complex I in the OXPHOS
          immunoblot and immunofluorescence panels used across mitochondrial diagnostics and cell biology.
          The great majority of papers naming NDUFB8 are using reduced NDUFB8 staining as a *readout*
          of complex I loss caused by something else entirely - PUS1, MCAT, EARS2, NDUFA13, ERCC6, and
          many others. Those papers say nothing about NDUFB8 as a disease gene, and a literature search
          on the symbol returns them in overwhelming preponderance over the three actual patient reports.

          Second, ClinGen''s classification is Moderate, not Definitive, and has been recurated once -
          originally against Leigh syndrome spectrum in 2020, then against NDUFB8-related primary mitochondrial
          disease in 2024, with the Leigh cases folded into the broader entity. The two curations are
          the same relationship under two disease labels, not two independent lines of support.'
      selected_evidence:
        snippet: Hereby we establish NDUFB8 as a relevant gene in childhood-onset mitochondrial disease.
        supports: SUPPORT
