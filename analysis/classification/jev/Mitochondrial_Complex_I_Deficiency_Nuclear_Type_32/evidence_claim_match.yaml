  8d0cdb46ee6614c6ac2cec1864403bb5a75fe07c6c5c5f76b7ca13029b15be43:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 32
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 32
            term:
              id: MONDO:0032635
              label: mitochondrial complex I deficiency, nuclear type 32
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Exon 4 Skipping from a Variant-Created Exonic Splicing Silencer
        biological_scale: MOLECULAR
        description: 'The c.432C>G (p.Cys144Trp) allele behaves mostly as a splicing variant rather than
          a missense one. It creates a new exonic splicing silencer, and Sanger sequencing of patient
          cDNA showed skipping of exon 4, which encodes Met105 to Val156 - the segment carrying the transmembrane
          helix. Skipping is favoured but not complete: about 14 percent of total cDNA still carried the
          missense sequence, so the allele produces a mixture of a large in-frame-disrupting deletion
          product and a low level of full-length mutant protein. This is the one place in the entity where
          the molecular consequence of an allele is not what its protein-level nomenclature suggests.'
        genes:
        - preferred_term: NDUFB8
          term:
            id: hgnc:7703
            label: NDUFB8
      selected_evidence:
        snippet: Nevertheless, 14% of total cDNA from Patient 1 contained the p.Cys144Trp missense mutation,
          indicating that while skipping exon 4 is favored, normal splicing also occurs at a lower frequency.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33233646
      reference_title: Analysis of Human Mutations in the Supernumerary Subunits of Complex I.
      evidence_source: HUMAN_CLINICAL
      explanation: The quantitative limit on the skipping claim, and the reason this node describes a
        mixture rather than a null allele.
