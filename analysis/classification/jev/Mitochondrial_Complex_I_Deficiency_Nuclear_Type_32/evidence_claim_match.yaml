      assertion:
        name: Cavitating Leukoencephalopathy
        category: Neurologic
        description: The third published patient, ascertained in a Chinese cohort of 37 children with
          cavitating leukoencephalopathies, was the single NDUFB8 case in that series. Cavitating leukoencephalopathy
          had not previously been associated with NDUFB8, and the finding broadens the entity's imaging
          phenotype beyond the Leigh-like basal ganglia pattern of the two index patients.
        frequency: OCCASIONAL
        phenotype_term:
          preferred_term: Cavitating leukoencephalopathy
          term:
            id: HP:0033369
            label: Cavitating leukodystrophy
        notes: 1 of 3 published patients, which falls in the OCCASIONAL band. The denominator is unusual
          here because that patient was ascertained *by* the imaging phenotype rather than assessed for
          it - a cavitating-leukoencephalopathy cohort will find cavitating leukoencephalopathy in every
          case it reports - so the figure describes the composition of the literature, not the risk in
          a genotype-first patient. Bound to HP:0033369 rather than to the parent Leukoencephalopathy
          term, following COA8-Related_COX_Deficiency, which binds the same term for the same imaging
          phenotype; preferred_term keeps the source's wording.
      selected_evidence:
        snippet: 'Pathogenic or likely pathogenic mutations in eight genes were identified in 31 individuals
          (83.78%): IBA57 (17/37), NDUFS1 (5/37), NDUFV1 (2/37), NDUFV2 (3/37), NDUFAF5 (1/37), LYRM7
          (1/37), NDUFB8 (1/37), and GLRX5 (1/37).'
        supports: SUPPORT
