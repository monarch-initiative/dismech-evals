  e917353b48370e23e97a307ee2fef6424a83250dac25171127b08b27dfeae4cf:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 32
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 32
            term:
              id: MONDO:0032635
              label: mitochondrial complex I deficiency, nuclear type 32
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic NDUFB8 Loss-of-Function Variants
        conforms_to: complex_i_deficiency#Complex I Biogenesis or Repair Failure
        biological_scale: MOLECULAR
        description: Two damaged copies of NDUFB8, in a compound-heterozygous configuration in both 2018
          patients. Patient 1 carried p.Pro76Gln in trans with p.Cys144Trp; Pro76 lies in a highly conserved
          matrix-side region above the ND5 lateral helix and close to ND4, while Cys144 sits in the membrane
          domain and appears to form a disulfide with Cys279 of ND5. Patient 2 carried p.Tyr62His, at
          a residue whose hydroxyl hydrogen-bonds to Asp74 of NDUFB8 and which lies 4 to 5 angstrom from
          Pro76 in the same conserved patch, in trans with the frameshift p.Glu63Aspfs*35 (c.189delA).
          ClinGen's 2024 recuration counted five unique variants across the three published cases and
          read the mechanism as loss of function.
        genes:
        - preferred_term: NDUFB8
          term:
            id: hgnc:7703
            label: NDUFB8
        genetic_context:
          genes:
          - preferred_term: NDUFB8
            term:
              id: hgnc:7703
              label: NDUFB8
          allele_type: missense variants in trans with a frameshift or with a splice-disrupting exonic
            change
          variant_origin: GERMLINE
          zygosity: COMPOUND_HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Both index patients are compound heterozygotes. One allele in each patient is a
            conserved-residue missense change; the second allele destroys the product in a different way
            in each - a frameshift in one patient, and in the other a nominally missense change that predominantly
            causes exon skipping.
          notes: 'LOSS_OF_FUNCTION follows ClinGen''s own reading of the mechanism. It is a gene-level
            statement rather than an allele-level one: the residual 14 percent of normally spliced p.Cys144Trp
            transcript in Patient 1 means at least one allele is not a complete null, and the entry does
            not claim that any single variant abolishes the protein.'
      selected_evidence:
        snippet: 'This curation included five unique variants (four missense, one frameshift) identified
          in three unrelated cases from two publications (PMIDs: 29429571, 30770271).'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: CGGV:assertion_ef011d17-b13b-445e-af02-e1bd504da75e-2024-11-18T050000.000Z
      reference_title: NDUFB8 / mitochondrial disease (Moderate)
      evidence_source: OTHER
      explanation: The full allelic tally across the literature, and the count of unrelated cases the
        entity rests on. Graded OTHER because a curation narrative is an expert synthesis.
