          abnormality, but the distribution differs. Subject 1 had diffusely abnormal supratentorial white
          matter with brainstem and cerebellar white-matter signal change at 36 hours of age. Subject
          2 had extensive progressive lesions of supratentorial white matter including the corpus callosum,
          together with basal ganglia, brainstem and cervical cord involvement, later showing partial
          cystic degeneration and white-matter volume loss. Subject 3 had increased T2 signal in the basal
          ganglia with a diffuse atrophic process on follow-up. Subject 4 had white-matter change in the
          corticospinal tract, brainstem and thalamus.
