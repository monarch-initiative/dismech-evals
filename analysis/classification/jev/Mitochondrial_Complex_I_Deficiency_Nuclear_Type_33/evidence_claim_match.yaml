  ceaa64ebecbbae134ff4709314822b204650119151e9714a90c2d2ed48599571:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 33
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 33
            term:
              id: MONDO:0032636
              label: mitochondrial complex I deficiency, nuclear type 33
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn33_normal_enzymology_in_subject_3
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Isolated Complex I Deficiency
        - pathophysiology#Biallelic NDUFA6 Variant
        prompt: Why did the child with a start-loss NDUFA6 variant have normal complex I activity in muscle?
        rationale: 'Subject 3 is homozygous for c.3G>A, which abolishes the initiation methionine of the
          predominant transcript, and yet his muscle complex I enzymology was normal. His fibroblasts
          nonetheless showed a marked isolated assembly defect on blue native electrophoresis, and failed
          to grow when forced onto oxidative phosphorylation in galactose medium. The authors call the
          combination most unusual and say so plainly: it is common for fibroblasts to look normal when
          muscle is deficient, but the reverse is not.

          Two explanations are offered and neither is settled. The first is the longer NDUFA6 isoform:
          against transcript NM_002490.4 the same nucleotide change reads as p.Met27Ile, which in silico
          tools call tolerated, so if the long isoform is expressed in muscle it would supply functional
          protein there. The second is leaky initiation, where translation starts at various in-frame
          methionines and Met1- and Met27-containing polypeptides coexist, diluting the effect. Both were
          tested as far as the available methods allowed and neither could be confirmed: tryptic fragments
          from complexome profiling were uninformative about which methionine was used, and the antibodies
          available did not work on the target protein in either subject or control tissue.

          This is not an academic point. It is the reason a normal muscle complex I assay does not exclude
          MC1DN33, which is the diagnostic conclusion the paper itself draws, and it is why any reinterpretation
          of a variant in this gene has to state its transcript.'
        proposed_experiments:
        - experiment_id: exp_mc1dn33_translation_initiation_site
          name: Determine which NDUFA6 initiation methionine is used, and in which tissue
          description: Ribosome profiling, or targeted N-terminomics, on muscle and fibroblasts from a
            c.3G>A homozygote would say directly whether translation initiates at Met1, Met27 or both,
            and whether the balance differs between the two tissues. That distinguishes the long-isoform
            explanation from the leaky-initiation one, which the antibody and tryptic fragment approaches
            could not. A tissue difference would additionally explain why the assembly defect appears
            in fibroblasts and not in muscle.
          readouts:
          - name: Translation initiation site usage across NDUFA6 transcripts
            target: pathophysiology#Biallelic NDUFA6 Variant
            direction: ALTERED
            interpretation: Initiation predominantly at Met27 in muscle and not in fibroblasts would support
              the isoform explanation; mixed initiation in both would support leaky initiation.
          would_support:
          - pathophysiology#Isolated Complex I Deficiency
          supporting_outcome:
          - Muscle-predominant initiation at Met27 would explain the preserved muscle enzymology without
            weakening the case that the variant is pathogenic in other tissues.
      selected_evidence:
        snippet: the situation for subject 3—normal enzymatic activity in muscle despite a demonstrable
          complex I assembly defect—is most unusual
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
