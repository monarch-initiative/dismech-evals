          four single unexplained variants into a gene-disease relationship. The diagnostic lesson the
          authors draw is about enzymology rather than sequencing: subject 3 had normal complex I activity
          in muscle, so an enzymology-first pathway would have excluded him, and the paper argues this
          is why an unbiased genetic approach matters.'
