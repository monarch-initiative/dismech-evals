      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: Two of the four children are homozygous and two are compound heterozygous, and parental
          samples were analysed in every family. Subject 2's unaffected sister carries one copy of his
          familial deletion, which is the clearest single piece of segregation evidence in the series.
          Two families are consanguineous (second-cousin Kurdish parents for subject 2, first-cousin South
          Asian parents for subject 3) and two are not. NDUFA6 is nuclear-encoded and autosomal, so this
          is a nuclear recessive mitochondrial disease without maternal transmission - which is what separates
          it from the mtDNA causes of childhood complex I deficiency, and mitochondrial genome sequencing
          was wild-type in all four.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Molecular genetic investigations were initiated for all four subjects—sequencing analysis
          of the entire mitochondrial genome (mtDNA) revealed only wild-type sequence, suggestive of an
          underlying Mendelian genetic etiology for each subject.
        supports: SUPPORT
    origin:
