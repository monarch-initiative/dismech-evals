  5228e7541d082d1c631012093b01153fc7d999fe66ac86541cbc47936478af0b:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 33
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 33
            term:
              id: MONDO:0032636
              label: mitochondrial complex I deficiency, nuclear type 33
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Yarrowia lipolytica LYRM6/NB4M deletion and LYR-motif mutants
        species: Yarrowia lipolytica
        genotype: chromosomal deletion of the NB4M/LYRM6 gene, and alanine substitution of the LYR motif
          and the conserved phenylalanine
        publication: PMID:24706851
        description: The aerobic yeast Yarrowia lipolytica is the system in which the function of this
          subunit was worked out, years before it was linked to human disease. Deleting the orthologous
          gene removed the acyl carrier protein ACPM1 from complex I and abolished ubiquinone reductase
          activity; replacing the LYR motif and an associated conserved phenylalanine with alanines did
          the same. A later study of the same organism determined the structure of an inactive F89A mutant
          and found long-range changes across a cluster of conserved loops at the interface between the
          Q-module and the membrane arm.
        notes: A yeast is not an animal, and the schema has no plant/fungal model section, so this record
          sits in animal_models for want of a better slot. It is flagged here rather than left for a reader
          to notice.
        modeled_mechanisms:
        - target: Loss of NDUFA6 from the Complex I Q-Module
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: 'Removing the subunit from the yeast enzyme reproduces the two things that matter
            for the human disease: the acyl carrier protein leaves with it, and ubiquinone reduction stops.
            It is also the source of the expectation that NDUFAB1 would be lost from patient complex I,
            which the human complexome data then confirmed.'
          limitations: A yeast, and a yeast whose complex I differs from the human enzyme in subunit composition.
            The alleles are a clean chromosomal deletion and designed alanine substitutions, not the missense,
            start-loss and frameshift alleles the patients carry. Most importantly, the yeast result is
            about catalysis - ubiquinone reductase activity is paralysed - whereas the human patients
            have an assembly defect, so the two systems agree on the subunit's importance without agreeing
            on the failure mode.
          readouts:
          - name: ACPM1 content of complex I after subunit deletion
            target: Loss of NDUFA6 from the Complex I Q-Module
            direction: DECREASED
            interpretation: The acyl carrier protein is lost from the enzyme complex when the LYR subunit
              is deleted, which is the interaction that predicts the human NDUFAB1 result.
          - name: Ubiquinone reductase activity after LYR-motif substitution
            target: Loss of NDUFA6 from the Complex I Q-Module
            direction: ABOLISHED
            interpretation: Mutating the LYR motif alone, without deleting the subunit, abolishes activity
              and ACPM1 binding - so it is the motif rather than the bulk of the protein that carries
              the function.
      selected_evidence:
        snippet: We determined the high-resolution structure of inactive mutant F89ALYRM6 of eukaryotic
          complex I from the yeast Yarrowia lipolytica and found long-range structural changes affecting
          the entire loop cluster.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33243981
      reference_title: Essential role of accessory subunit LYRM6 in the mechanism of mitochondrial complex
        I.
      evidence_source: MODEL_ORGANISM
      explanation: That a single substitution in this accessory subunit propagates structural change across
        the module interface, which is the mechanistic reason a small subunit matters.
