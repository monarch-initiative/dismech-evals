          an hour of birth, rising above 20 before death at about 51 hours. Subject 4's blood pH fell
          from 7.308 to 7.076 with blood gas lactate of 16.9 to 18.5 mmol per litre, and the acidosis
          continued to her death at 13 weeks.
        frequency: FREQUENT
        phenotype_term:
          preferred_term: Lactic acidosis
          term:
            id: HP:0003128
            label: Lactic acidosis
        notes: Two of the four children, so 2/4, inside the FREQUENT band. Subject 3 had raised CSF lactate
          without a recorded systemic acidosis and subject 2 had normal lactate altogether, so neither
          is counted here; both are covered by the separate raised-lactate phenotype and by the pathophysiology
          node. A count in a four-patient series, not a population frequency.
      selected_evidence:
        snippet: Despite intensive-care management in a tertiary care center, her lactic acidosis continued
          until her death at 13 weeks of age.
        supports: SUPPORT
