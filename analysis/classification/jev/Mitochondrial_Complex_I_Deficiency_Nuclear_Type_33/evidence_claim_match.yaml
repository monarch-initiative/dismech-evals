        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn33_no_disease_modifying_treatment
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#
        prompt: Is there any disease-modifying treatment to curate for NDUFA6 deficiency?
        rationale: 'No. Nothing disease-modifying is reported for any of these four children, no treatment
          response is described, and no trial has been registered for the gene or the disorder.

          What the treatments block holds is the three symptomatic measures the paper actually records,
          each in one patient: intrathecal baclofen and botulinum toxin for spasticity, a gastrostomy
          tube for an unsafe swallow, and granulocyte colony-stimulating factor for neutropenia. All three
          address complications, none is reported with an outcome, and one of the two treated children
          is severely disabled while the other has drug-resistant seizures. They are curated because they
          are documented facts about these patients, not because they amount to a management strategy.
          The intensive care both dying infants received - inotropes, fresh frozen plasma, transfusion,
          bicarbonate, ventilation - is described in the progression block rather than curated as treatment,
          because the source records it as a level of care rather than as intervention with an indication.

          The lentiviral complementation is not a treatment. It is the experiment that established causality,
          it is curated under experimental_models with its limitations, and the authors present it as
          proof of pathogenicity. Reading it as gene therapy in prospect would be an inference the source
          does not make.

          Generic supportive management of mitochondrial encephalopathy is ready-made content that would
          look right here and is deliberately not imported. Asserting of four NDUFA6 patients an experience
          recorded only of other people with other genotypes would make the entry look more complete and
          be less true.'
      selected_evidence:
        snippet: Despite intensive-care management in a tertiary care center, her lactic acidosis continued
          until her death at 13 weeks of age.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
