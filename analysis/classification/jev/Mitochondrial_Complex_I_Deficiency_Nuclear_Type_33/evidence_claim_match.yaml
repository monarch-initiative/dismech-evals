  a7f614c86d5868bdf1891c09b3a15e20bf127d5caa89d83b3106ee01273adbdc:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 33
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 33
            term:
              id: MONDO:0032636
              label: mitochondrial complex I deficiency, nuclear type 33
        context: []
      assertion_type: Genetic
      assertion:
        name: NDUFA6
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: NDUFA6
          term:
            id: hgnc:7690
            label: NDUFA6
        notes: 'NDUFA6 encodes NADH:ubiquinone oxidoreductase subunit A6, also known as LYRM6, a 15 kDa
          accessory subunit of the complex I Q-module whose LYR motif binds the mitochondrial acyl carrier
          protein NDUFAB1. The 2018 report establishes it as the 29th structural subunit of complex I
          linked to human disease.

          A transcript trap, which the paper itself is largely about. NDUFA6 has three in-frame isoforms
          using alternative initiation methionines, and the consensus RefSeq accession did not correspond
          to the predominant transcript in clinically relevant tissues; the paper''s expression data prompted
          the revision of the reference accession to NM_002490.5. This is not a bookkeeping detail. Subject
          3''s start-loss allele is pathogenic against the predominant short transcript and would read
          as a tolerated p.Met27Ile missense change against the longer one, which is the authors'' candidate
          explanation for his normal muscle complex I activity. Anyone re-interpreting a variant in this
          gene has to state which transcript they are numbering against.

          A Named Entity Confusion trap, which dominates a naive literature search. NDUFA6 carries a large
          common-variant and expression-signature literature that has nothing to do with this disease:
          a missense variant reported to confer schizophrenia risk, bioinformatic hub-gene analyses in
          tetralogy of Fallot, multiple myeloma, glioma, thyroid cancer, sepsis and preeclampsia, a lncRNA
          named NDUFA6-DT, and a ceramide-NDUFA6 interaction in liver ischaemia-reperfusion injury. None
          of it is cited here and none of it concerns MC1DN33.'
      selected_evidence:
        snippet: Subsequent analysis by BN-PAGE confirmed that transduction of all three subject cell
          lines with a wild-type NDUFA6 cDNA transcript ameliorated the complex I assembly defect, unequivocally
          establishing the subjects’ NDUFA6 variants as the cause of disease
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
