  0c3a4b3e5e2426fe88e7c83eb1bcf6ee035ee7ee4dc41b845388f72774671bc1:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 33
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 33
            term:
              id: MONDO:0032636
              label: mitochondrial complex I deficiency, nuclear type 33
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of NDUFA6 from the Complex I Q-Module
        biological_scale: MOLECULAR
        description: NDUFA6 is an accessory subunit of the Q-module, the ubiquinone-reducing part of the
          peripheral arm. Complexome profiling of the three patients with available fibroblasts shows
          a marked reduction of NDUFA6 incorporated into complex I. Its LYR motif is what binds the mitochondrial
          acyl carrier protein encoded by NDUFAB1, a binding first demonstrated by deleting the orthologous
          gene in the yeast Yarrowia lipolytica, where loss of the subunit removed ACPM1 from the enzyme
          and paralysed ubiquinone reductase activity.
        genes:
        - preferred_term: NDUFA6
          term:
            id: hgnc:7690
            label: NDUFA6
        cellular_components:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
      selected_evidence:
        snippet: Next-generation sequencing identified bi-allelic variants in NDUFA6, encoding a 15 kDa
          LYR-motif-containing complex I subunit that forms part of the Q-module.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
