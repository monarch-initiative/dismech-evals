        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of NDUFAB1, NDUFA7 and NDUFA12 from the Assembly Intermediate
        biological_scale: MOLECULAR
        description: 'Losing NDUFA6 takes its neighbours with it. Complexome profiling shows NDUFAB1 lost
          in the most severely affected patient and markedly reduced in the other two, and NDUFA7 and
          NDUFA12 lost from the subcomplex in proportion to the degree of NDUFA6 loss. The NDUFAB1 result
          is the one that was predicted: the LYR motif of NDUFA6 is what binds it. The authors'' proposal
          is that NDUFA6 is a prerequisite for NDUFA7 and NDUFA12 incorporation, which they put forward
          as a possibility.'
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex I assembly
          modifier: DECREASED
          term:
            id: GO:0032981
            label: mitochondrial respiratory chain complex I assembly
        mechanism_confidence: PROVISIONAL
        notes: PROVISIONAL because the ordering claim - that NDUFA6 must be in place before NDUFA7 and
          NDUFA12 can be - is offered by the authors as a possibility rather than demonstrated. What is
          measured is co-loss and its correlation with the degree of NDUFA6 reduction, not assembly order.
          The NDUFAB1 half of the node is on firmer ground, because the NDUFA6-NDUFAB1 interaction was
          independently established in yeast.
      selected_evidence:
        snippet: A loss of NDUFA7 and NDUFA12 from the subcomplex is evident, particularly in subject
          1, and appears to correlate with the degree of NDUFA6 loss.
        supports: SUPPORT
