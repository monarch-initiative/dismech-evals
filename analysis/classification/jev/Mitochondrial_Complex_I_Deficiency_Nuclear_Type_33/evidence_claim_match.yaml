      assertion_type: Pathophysiology
      assertion:
        name: White Matter and Deep Grey Matter Injury
        conforms_to: complex_i_deficiency#High-Energy Tissue Dysfunction
        biological_scale: TISSUE
        description: The tissue lesion, and it is imaged rather than examined. All four children had neuroradiological
          abnormality, but the distribution differs. Subject 1 had diffusely abnormal supratentorial white
          matter with brainstem and cerebellar white-matter signal change at 36 hours of age. Subject
          2 had extensive progressive lesions of supratentorial white matter including the corpus callosum,
          together with basal ganglia, brainstem and cervical cord involvement, later showing partial
          cystic degeneration and white-matter volume loss. Subject 3 had increased T2 signal in the basal
          ganglia with a diffuse atrophic process on follow-up. Subject 4 had white-matter change in the
          corticospinal tract, brainstem and thalamus.
        locations:
        - preferred_term: cerebral white matter
          term:
            id: UBERON:0002316
            label: white matter
        - preferred_term: basal ganglia
          term:
            id: UBERON:0002420
            label: basal ganglion
        - preferred_term: brainstem
          term:
            id: UBERON:0002298
            label: brainstem
        - preferred_term: thalamus
          term:
            id: UBERON:0001897
            label: dorsal plus ventral thalamus
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        mechanism_confidence: PROVISIONAL
        notes: No neuropathology is reported for any of these children; the lesion is defined radiologically
          in all four. The step from a respiratory defect measured in fibroblasts and muscle to this particular
          distribution of brain injury is the general account of mitochondrial encephalopathy applied
          to this genotype rather than anything measured in it, which is why the node is PROVISIONAL and
          its incoming edge is marked as having unknown intermediates.
      selected_evidence:
        snippet: White matter abnormalities and/or basal ganglia lesions have been seen on brain imaging.
        supports: SUPPORT
