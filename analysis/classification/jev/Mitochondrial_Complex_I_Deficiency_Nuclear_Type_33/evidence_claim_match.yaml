            genotype: nuo-3(G60D), a dominant missense allele of the NDUFA6 orthologue
            publication: PMID:38215760
            description: Forward genetic selections in C. elegans for suppressors of complex I mutants
              repeatedly recovered G60D substitutions in nuo-3, the NDUFA6 orthologue. The allele restores
              forward complex I activity in three different complex I mutants and phenocopies the rescue
              that hypoxia produces. ClinGen cites this work as part of the experimental evidence supporting
              the NDUFA6 gene-disease relationship.
            notes: 'This is emphatically not a model of NDUFA6 deficiency, and it is curated with a link
              to the subunit''s role rather than to any disease node. nuo-3(G60D) is a gain-of-activity
              suppressor that makes complex I work better in a mutant background; the patients have loss-of-function
              alleles that make it work worse. What the worm result establishes is that this accessory
              subunit is allosterically coupled to the ubiquinone binding pocket, which is why changing
              it has large functional consequences in either direction. No knockout model of the orthologue
              in any animal is cited here: a PubMed search in September 2026 for an Ndufa6 mouse knockout
              returned no hits, and none is described in the ClinGen curation, which lists a HEK293T knockout
              and this worm study as the experimental evidence.'
          role: ancestor
        - path: /animal_models/1/modeled_mechanisms/0
          value:
            target: Loss of NDUFA6 from the Complex I Q-Module
            relationship: PERTURBS
            fidelity: LOW
            description: An engineered change in the orthologous subunit alters complex I catalysis at
              a distance, which supports treating NDUFA6 as functionally coupled to the enzyme's ubiquinone
              chemistry rather than as a structural passenger.
            limitations: The direction is opposite to the disease. This is a dominant suppressor allele
              that improves complex I forward activity, recovered in a screen for rescue of other complex
              I mutants; the human patients carry recessive loss-of-function alleles. The organism is
              a nematode, and the paper itself notes that outside the LYRM domain the primary sequence
              of NUO-3 has diverged across eukaryotic evolution, so residue-level correspondence to human
              NDUFA6 is uncertain. Nothing here models the assembly defect that is the human lesion.
          role: ancestor
