          at 25 months, then recovered several words and was walking with assistance by three years. No
          further episode of rapid regression followed, but he has declined slowly since - dysarthric
          and wheelchair-dependent from seven years, and without voluntary limb movement at the time of
          report. His cognition remains good and his mood is recorded as very low, which is worth keeping
          because it is the only patient-experience observation in the series.
