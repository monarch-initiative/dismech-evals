      assertion_type: ExperimentalModel
      assertion:
        name: Lentiviral NDUFA6 complementation of patient fibroblasts
        experimental_model_type: OTHER
        description: Fibroblasts from subjects 1 to 3 were transduced with a wild-type NDUFA6 cDNA transcript.
          Blue native electrophoresis showed the complex I assembly defect corrected in all three lines,
          and in-gel activity assay showed complex I activity restored in the two lines tested. Subject
          2's line was attempted for the activity assay but the cells failed to grow.
        modeled_mechanisms:
        - target: Stalled 830 kDa Complex I Assembly Intermediate
          relationship: RESCUES
          fidelity: HIGH
          description: Supplying wild-type NDUFA6 to the patients' own cells restores assembly, which
            is the demonstration that the variants rather than something else in those genomes cause the
            stall.
          limitations: 'Cultured skin fibroblasts, not brain or muscle, and three of four patients - no
            tissue was available from subject 4. The activity arm of the rescue covers only two lines,
            because subject 2''s cells failed to grow. Retroviral and lentiviral expression is non-physiological
            in level and timing. And the rescue says nothing about whether restoring the subunit would
            help a patient: it is a pathogenicity experiment, not a therapeutic one.'
          readouts:
          - name: Complex I assembly on blue native electrophoresis after transduction
            target: Stalled 830 kDa Complex I Assembly Intermediate
            direction: RESTORED
            interpretation: The assembly defect is corrected in all three transduced patient lines, and
              complex I levels are described as restored.
          - name: In-gel complex I activity after transduction
            target: Stalled 830 kDa Complex I Assembly Intermediate
            direction: RESTORED
            interpretation: In-gel NADH dehydrogenase activity is restored in the two patient lines tested,
              so the rescued enzyme works and is not merely assembled.
      selected_evidence:
        snippet: Subsequent analysis by BN-PAGE confirmed that transduction of all three subject cell
          lines with a wild-type NDUFA6 cDNA transcript ameliorated the complex I assembly defect, unequivocally
          establishing the subjects’ NDUFA6 variants as the cause of disease
        supports: SUPPORT
