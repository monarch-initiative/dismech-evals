  865cf1e2fdc59c3013f66ad92c2af04bf202b98e8317ff7b6b8190b119e6cb64:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 33
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 33
            term:
              id: MONDO:0032636
              label: mitochondrial complex I deficiency, nuclear type 33
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic NDUFA6 Variant
        conforms_to: complex_i_deficiency#Complex I Biogenesis or Repair Failure
        biological_scale: MOLECULAR
        description: Two damaged copies of NDUFA6. Six distinct alleles are known across the four children,
          and they span most of the ways a small gene can be broken. Subject 1 is compound heterozygous
          for c.191G>C (p.Arg64Pro) and c.265G>T (p.Glu89*); subject 2 is homozygous for the two-base
          deletion c.331_332del (p.Glu111Serfs*35); subject 3 is homozygous for c.3G>A, which abolishes
          the initiation methionine; subject 4 is compound heterozygous for the frameshifts c.309del (p.Met104Cysfs*35)
          and c.355del (p.Leu119Tyrfs*20). None of the six is seen homozygous in gnomAD.
        genes:
        - preferred_term: NDUFA6
          term:
            id: hgnc:7690
            label: NDUFA6
        genetic_context:
          genes:
          - preferred_term: NDUFA6
            term:
              id: hgnc:7690
              label: NDUFA6
          allele_type: missense, nonsense, start-loss and frameshift alleles across four families
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'Six alleles in four unrelated children: two homozygous families and two compound-heterozygous
            ones. Parental DNA was analysed in each family and supported recessive inheritance.'
          notes: 'The zygosity slot takes a single value and HOMOZYGOUS is the one that fits the two consanguineous
            families; subjects 1 and 4 are compound heterozygous, which the description and the surrounding
            prose record because the slot cannot. Two of the alleles need a caveat rather than a flat
            loss-of-function reading. The c.331_332del frameshift sits in the terminal exon and is predicted
            to escape nonsense-mediated decay, and transcript was in fact normal in the patient''s fibroblasts,
            so the loss is at the protein level rather than the message level. The c.3G>A start-loss allele
            is the one the paper is least certain about: against the longer NDUFA6 isoform it would read
            as p.Met27Ile, a change in silico tools call tolerated, and that subject had normal complex
            I activity in muscle. LOSS_OF_FUNCTION is the category ClinGen also records for this gene-disease
            relationship, but subject 3 is the reason this entry does not treat every allele as equivalent.'
      selected_evidence:
        snippet: 'Subject 1 harbored two heterozygous variants within NDUFA6 (GenBank: NM_002490.5; OMIM:
          602138), a c.191G>C transversion predicted to cause a p.Arg64Pro missense substitution and a
          c.265G>T transversion predicted to cause a premature stop codon, p.Glu89∗.'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
