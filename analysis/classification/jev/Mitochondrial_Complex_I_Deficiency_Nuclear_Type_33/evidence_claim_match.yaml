            id: hgnc:7690
            label: NDUFA6
        notes: 'NDUFA6 encodes NADH:ubiquinone oxidoreductase subunit A6, also known as LYRM6, a 15 kDa
          accessory subunit of the complex I Q-module whose LYR motif binds the mitochondrial acyl carrier
          protein NDUFAB1. The 2018 report establishes it as the 29th structural subunit of complex I
          linked to human disease.

          A transcript trap, which the paper itself is largely about. NDUFA6 has three in-frame isoforms
          using alternative initiation methionines, and the consensus RefSeq accession did not correspond
          to the predominant transcript in clinically relevant tissues; the paper''s expression data prompted
          the revision of the reference accession to NM_002490.5. This is not a bookkeeping detail. Subject
          3''s start-loss allele is pathogenic against the predominant short transcript and would read
          as a tolerated p.Met27Ile missense change against the longer one, which is the authors'' candidate
          explanation for his normal muscle complex I activity. Anyone re-interpreting a variant in this
          gene has to state which transcript they are numbering against.

