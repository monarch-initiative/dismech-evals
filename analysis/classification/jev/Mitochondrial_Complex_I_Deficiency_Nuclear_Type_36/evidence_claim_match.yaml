  7dc9523521a5b985090da79177db8c5df52c2740331cd6d6bc0b878edf81d9d2:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 36
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 36
            term:
              id: MONDO:0030902
              label: mitochondrial complex I deficiency, nuclear type 36
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic NDUFC2 Variant
        biological_scale: MOLECULAR
        description: 'Two damaged copies of NDUFC2. Two alleles are known and each is homozygous in one
          family. The Saudi siblings carry c.346_*7del, a 22-nucleotide deletion that removes the stop
          codon and replaces the last four residues with a 21-residue extension, p.(His116_Arg119delins21).
          The Moroccan boy carries c.173A>T, p.(His58Leu), at a histidine conserved across species, with
          every in silico predictor calling it damaging. Neither allele class is present homozygously
          in population databases: gnomAD contains no homozygous loss-of-function NDUFC2 variant at all.'
        genes:
        - preferred_term: NDUFC2
          term:
            id: hgnc:7706
            label: NDUFC2
        genetic_context:
          genes:
          - preferred_term: NDUFC2
            term:
              id: hgnc:7706
              label: NDUFC2
          allele_type: a homozygous stop-loss deletion and a homozygous missense variant at a conserved
            histidine
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Two consanguineous families. Homozygosity is molecularly confirmed in two of the
            three patients; the second Saudi sibling was not genotyped, because no DNA was available,
            and is presumed homozygous from parental segregation and a concordant phenotype. Only the
            two index subjects, one per family, had biochemical study.
          notes: 'LOSS_OF_FUNCTION is used, and the striking observation behind it is that the two very
            different alleles behave the same way. The paper states that the biochemical findings were
            similar for both subjects despite one carrying a missense change and the other a loss-of-function
            variant. A single conserved residue at a module interface therefore costs as much as losing
            the protein''s terminus, which is why the block takes one value rather than distinguishing
            the alleles. The alleles are not indistinguishable at every level, though: the complexome
            profile resolves NDUFC2 abundance directly and finds none in the stop-loss subject against
            a scant amount in the missense subject, so the shared value records a shared functional outcome
            rather than an identical molecular lesion.'
      selected_evidence:
        snippet: Review of the gnomAD variant database revealed no homozygous loss-of-function variants
          within NDUFC2
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32969598
      reference_title: Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled
        biogenesis of complex I.
      evidence_source: HUMAN_CLINICAL
      explanation: The population-database argument that biallelic NDUFC2 loss is not tolerated, which
        is part of what makes the variants credible as causal.
