  f02f85454d8a84c5bf92ad9896d32388d0beca1c257934fa0925bd83430387bc:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 36
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 36
            term:
              id: MONDO:0030902
              label: mitochondrial complex I deficiency, nuclear type 36
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn36_two_disease_framings
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - disease#
        prompt: Is this a complex I deficiency subtype or a Leigh syndrome gene, and does the difference
          matter?
        rationale: 'Both framings are in current use by authorities that are not disagreeing about any
          fact.

          MONDO and OMIM file the entity in the nuclear complex I deficiency series as type 36, which
          is the name this entry carries. ClinGen''s Mitochondrial Diseases expert panel curated NDUFC2
          first against Leigh syndrome spectrum in 2020, then re-curated it in 2023 against primary mitochondrial
          disease, applying its lumping and splitting framework to fold the Leigh cases into a single
          gene-defined entity. The three published patients were all diagnosed with Leigh syndrome.

          So there are three names for one set of three children, and each is defensible: a biochemical
          classification, a clinical syndrome, and a gene-defined entity. This entry uses the MONDO name
          because that is what the knowledge base keys on, curates Leigh syndrome as an OBLIGATE phenotype
          because it is what all three patients had, and cites the ClinGen assertions for both of that
          panel''s framings.

          Where the difference could matter is in retrieval rather than in biology. A clinician searching
          Leigh syndrome genes and a curator searching the MC1DN series should both find this entity,
          and a knowledge base that recorded only one framing would fail one of them. It also matters
          for how the disorder''s boundaries will be drawn if a patient is reported who has NDUFC2 variants
          without Leigh syndrome - on the MONDO framing that patient still has MC1DN36, on the ClinGen
          framing they still have NDUFC2-related mitochondrial disease, and only the clinical framing
          would exclude them.

          Worth noting for the structural record: MONDO:0030902 has exactly one superclass, MONDO:0100223
          mitochondrial complex I deficiency nuclear type, and is not placed under Leigh syndrome, so
          the ontology does not itself hold both framings.'
      selected_evidence:
        snippet: The relationship between NDUFC2 and Leigh syndrome spectrum was evaluated using the ClinGen
          Clinical Validity Framework as of November 23, 2020.
        supports: SUPPORT
