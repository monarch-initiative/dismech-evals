        - path: /experimental_models/0
          value:
            name: Lentiviral NDUFC2 complementation of patient fibroblasts
            experimental_model_type: OTHER
            description: Fibroblasts from both index patients were transduced with wild-type NDUFC2 under
              a doxycycline-inducible lentiviral vector. Induction raised NDUFC2 itself and the complex
              I subunits NDUFB8, NDUFA9 and NDUFV1, and increased the amount of fully assembled complex
              I. The rescue was partial in both lines and more prominent in the missense patient than
              in the stop-loss patient.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Stalled Complex I Biogenesis
        relationship: RESCUES
        fidelity: HIGH
        description: Supplying wild-type NDUFC2 to the patients' own cells restores assembly, which is
          the demonstration that the variants rather than something else in those genomes cause the stall.
        limitations: 'The rescue is partial in both lines and neither reaches control levels of assembled
          complex I, and the authors work through why: complex I is thought to assemble within 24 hours
          and the induction ran for 72, so time is not the limitation, but the mutant protein or the aberrant
          subassemblies already present may interfere. The system is a cultured fibroblast, so it says
          nothing about brain; the third patient could not be tested at all for lack of material; and
          doxycycline-driven expression is non-physiological in level and timing.'
        readouts:
        - name: Fully assembled complex I on blue native electrophoresis after induction
          target: Stalled Complex I Biogenesis
          direction: RESTORED
          interpretation: Assembled complex I increases with doxycycline induction relative to both uninduced
            and untransduced patient cells, without reaching control levels.
        - name: Steady-state levels of complex I subunits after induction
          target: Stalled Complex I Biogenesis
          direction: INCREASED
          interpretation: NDUFB8, NDUFA9 and NDUFV1 all rise with induction, so the rescue acts on the
            assembly of the whole enzyme rather than on NDUFC2 alone.
      selected_evidence:
        snippet: Lentiviral transduction of subjects' fibroblasts with wild-type NDUFC2 cDNA increased
          complex I assembly supporting the association of the identified NDUFC2 variants with mitochondrial
          pathology.
        supports: SUPPORT
