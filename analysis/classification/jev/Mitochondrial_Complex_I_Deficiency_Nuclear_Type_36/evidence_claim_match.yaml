        snippet: Clinical evaluation performed at 5 months showed impaired growth (weight and length <
          3rd centile), microcephaly (< 3rd centile), poor eye contact, non-paralytic strabismus, truncal
          hypotonia with limb hypertonia, paucity of spontaneous movements and lack of postural control.
