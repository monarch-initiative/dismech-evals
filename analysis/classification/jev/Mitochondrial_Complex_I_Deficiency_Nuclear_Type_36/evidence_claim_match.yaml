  2c797a61d070847472a6adef8fc472270a4d60e6584a73f6541d045a1e0144fe:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 36
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 36
            term:
              id: MONDO:0030902
              label: mitochondrial complex I deficiency, nuclear type 36
        context: []
      assertion_type: Genetic
      assertion:
        name: NDUFC2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: NDUFC2
          term:
            id: hgnc:7706
            label: NDUFC2
        notes: 'NDUFC2 encodes NADH:ubiquinone oxidoreductase subunit C2, a small membrane subunit of
          the proton-pumping arm of complex I. Its structural position, in the ND2 module facing the intermembrane
          space with contacts to twelve other subunits across three modules, is the whole mechanism of
          this disease and is curated as its own pathophysiology node.

          Two traps for anyone extending this entry from the gene rather than from the disease, and both
          are easy to fall into because they dominate a naive literature search.

          First, NDUFC2 carries a large cardiovascular and complex-trait association literature - polymorphic
          variants and cardiac hypertrophy in human hypertension, autophagy and hypertension-related stroke,
          glucose metabolism in recombinant inbred mice, Mendelian randomisation studies of hyperuricaemia,
          psychiatric multi-omics, melanoma. None of it concerns this disease, and none of it is cited
          here. The gene is common-variant interesting and rare-variant interesting for entirely different
          reasons.

          Second, there is a separate HGNC entity, NDUFC2-KCTD14 (HGNC:42956), a readthrough transcript,
          and several association signals in this genomic region are reported against the readthrough
          rather than against NDUFC2 itself. The binding in this entry is hgnc:7706, the protein-coding
          gene, and a search that does not separate the two will conflate them.'
      selected_evidence:
        snippet: Our study documents the first cases of mitochondrial disease caused by variants in the
          NDUFC2 gene.
        supports: SUPPORT
