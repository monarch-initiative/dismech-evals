            term:
              id: MONDO:0030902
              label: mitochondrial complex I deficiency, nuclear type 36
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: Both families are consanguineous first-cousin unions - two siblings in a Saudi family
          for a stop-loss deletion, and a Moroccan boy for a missense variant. Homozygosity was molecularly
          confirmed in two of the three children; DNA was not available from the second Saudi sibling,
          who is presumed homozygous on the strength of parental segregation and a concordant phenotype
          rather than on his own genotype. Carrier testing confirmed both parents of the Moroccan patient
          heterozygous. NDUFC2 is nuclear-encoded and autosomal, so this is a nuclear recessive mitochondrial
          disease with a 25 percent sibling recurrence risk and no maternal transmission, which is what
          distinguishes it from the mitochondrial-genome causes of Leigh syndrome.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Here, we describe three affected children from two unrelated families who presented with
          Leigh syndrome due to homozygous variants (c.346_*7del and c.173A>T p.His58Leu) in NDUFC2, encoding
          a complex I subunit.
        supports: SUPPORT
