  8fb1bab0c41809ea53918ff9927f37245b23308ad8e8f0f8e4bfc446ed8cd218:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 36
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 36
            term:
              id: MONDO:0030902
              label: mitochondrial complex I deficiency, nuclear type 36
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn36_no_treatment_or_natural_history
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#
        prompt: Is there any disease-modifying treatment to curate?
        rationale: 'No. Nothing disease-modifying exists for NDUFC2 deficiency, no treatment response
          is reported for any of the three patients, and no trial is registered for the gene or the disorder.

          What the treatments block does hold is the two supportive interventions the paper actually records,
          each in the same single patient: a ventriculoperitoneal shunt for acute hydrocephalus, and nasogastric
          tube feeding for an unsafe swallow. Both are directed at complications rather than at the complex
          I defect, neither is reported with an outcome, and the child died at three years. They are curated
          because they are documented facts about these patients, not because they constitute a management
          strategy. Intensive care during his respiratory crisis is described in the course rather than
          curated as a treatment, because the paper records it as a level of care rather than as an intervention
          with an indication.

          The lentiviral complementation is not a treatment. It is the experiment that established causality,
          it is curated under experimental_models with its limitations attached, and the authors present
          it as support for pathogenicity rather than as a therapeutic proposal. Reading it as gene therapy
          in prospect would be an inference the source does not make.

          Generic supportive management of Leigh syndrome, and the management recommendations in the GeneReviews
          Leigh syndrome spectrum chapter, are ready-made content that would look right here and are deliberately
          not imported. Doing so would assert of three NDUFC2 patients an experience recorded only of
          other people with other genotypes.

          The one thing the diagnosis demonstrably changed for these families is recorded in the diagnosis
          block rather than here: it enabled prenatal testing in subsequent pregnancies, which the authors
          give as the concrete clinical value of the molecular result.'
      selected_evidence:
        snippet: Confirmation of these variants as causative enables prenatal testing of a subsequent
          pregnancies in these families, demonstrating the clinical importance of providing a genetic
          diagnosis in mitochondrial disease cases
        supports: SUPPORT
