          the same patient, so a hypotonia binding would have been narrower than the entry name and broader
          than the preferred_term at once - the one combination that fits neither. Axial hypotonia (HP:0008936)
          would be the most specific term for the truncal half alone, but taking it would drop the limb
          hypertonia from the binding entirely; splitting into two entries would instead double-count
          one patient's single tone examination. The other two children have spasticity, which is curated
          separately - this entry exists so that the third child's documented tone abnormality is retrievable
          rather than surviving only as prose.
