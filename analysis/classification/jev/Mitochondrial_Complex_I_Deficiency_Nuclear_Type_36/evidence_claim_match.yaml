      assertion:
        name: Complex I enzymology and nuclear gene sequencing, with GeneMatcher
        description: 'The two families reached the same diagnosis by different routes, and the contrast
          is instructive. In the Saudi family a commercial exome was done first and prioritised known
          disease genes, so the answer came only from whole genome sequencing. In the Moroccan family
          an isolated complex I defect on muscle biopsy came first and prompted a targeted panel of nuclear
          complex I genes. Neither family could have been solved alone: NDUFC2 was not a known disease
          gene, and the two were connected through GeneMatcher, which is what made a single unexplained
          variant into a gene-disease relationship. The authors note that NDUFC2 can now be screened as
          a candidate in genetically undiagnosed Leigh syndrome.'
      selected_evidence:
        snippet: in addition, NDUFC2 may now be screened as a candidate gene in genetically undiagnosed
          cases of Leigh syndrome
        supports: SUPPORT
