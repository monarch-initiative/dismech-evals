      assertion_type: Pathophysiology
      assertion:
        name: Stalled Complex I Biogenesis
        biological_scale: MOLECULAR
        description: Assembly does not fail from the start - it gets part-way and stops. The Q module
          forms successfully, and the process then halts because the ND1 subunit is not incorporated into
          the inner membrane, leaving aberrant intermediates rather than holoenzyme. In one patient's
          fibroblasts no fully assembled complex I was detectable at all; in the other it was greatly
          decreased. All other oxidative phosphorylation complexes were unaffected, which is what makes
          the deficiency isolated.
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex I assembly
          modifier: DECREASED
          term:
            id: GO:0032981
            label: mitochondrial respiratory chain complex I assembly
      selected_evidence:
        snippet: Our data support successful formation of the Q module with subsequent assembly stalling
          due to failed incorporation of the ND1 subunit into the inner mitochondrial membrane.
        supports: SUPPORT
