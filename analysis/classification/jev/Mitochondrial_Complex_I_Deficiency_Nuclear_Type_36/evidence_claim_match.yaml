              map. It showed the loss of NDUFC2's associating subunits in the ND1 and ND2 modules, the
              independent survival of the ND4 module, and the complete absence of ND5 and N module intermediates.
            limitations: Cultured fibroblasts, not the affected tissue, and two patients. The readout
              is abundance across a gradient rather than a direct measurement of assembly order, so the
              assembly sequence is inferred by comparing the observed intermediates against a published
              model. The scaffold interpretation the authors draw from it is offered as a possibility
              rather than a conclusion.
          role: ancestor
