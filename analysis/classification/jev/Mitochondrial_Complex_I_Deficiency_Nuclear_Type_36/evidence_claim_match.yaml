      reference_title: Bi-allelic pathogenic variants in NDUFC2 cause early-onset Leigh syndrome and stalled
        biogenesis of complex I.
      evidence_source: HUMAN_CLINICAL
      explanation: The one clinical consequence the authors claim for the diagnosis, which is reproductive
        rather than therapeutic.
