  b88b9c2375b873ea1e2375e919aeb198724384c39ce16678481dbf42eaab771e:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 36
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 36
            term:
              id: MONDO:0030902
              label: mitochondrial complex I deficiency, nuclear type 36
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn36_two_alleles_same_biochemistry
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Biallelic NDUFC2 Variant
        - pathophysiology#Failure of ND1 and ND2 Module Assembly
        prompt: Why does a single missense change at His58 cost as much as a stop-loss allele?
        rationale: 'The two families carry very different alleles and the biochemistry does not distinguish
          them, which the paper states plainly. One patient is homozygous for c.346_*7del, which removes
          the stop codon and replaces the last four residues with a 21-residue extension. The other is
          homozygous for p.(His58Leu), one substitution at a conserved histidine. Residual complex I activity
          was 16 and 19 percent respectively, oxygen consumption was severely reduced in both, and both
          showed the same module-level assembly failure.

          The authors'' reading is that His58 matters for the assembly or stability of the ND2 module
          itself, so losing it is functionally equivalent to losing the subunit. That is consistent with
          everything measured, and it is not the only possibility: the stop-loss extension might be tolerated
          better than a frank truncation would be, which would raise the missense allele to meet a less
          severe null rather than lowering the null to meet a severe missense. Residual NDUFC2 protein
          has in fact been measured, and it does not separate the two accounts as cleanly as it might
          have. The complexome profile resolves NDUFC2 abundance directly: none is detectable in the stop-loss
          patient, while a scant amount is detectable in the missense patient. So the two alleles are
          not identical at the protein level even though the assembly phenotype converges, and the missense
          subject retains a little protein that is nonetheless failing to sustain the ND2 module.

          It matters beyond this gene because it bears on how a missense variant in a small interface
          subunit should be interpreted when it is found in a new patient. If a single conserved interface
          residue routinely costs a whole module, then in silico conservation scores are doing more work
          in these genes than they usually are.

          What remains open is therefore not whether the missense protein is present - it is whether that
          scant His58Leu protein is assembly-incompetent at the ND2 interface or merely unstable and present
          below the level needed to nucleate the module. Those two predict the same abundance and different
          incorporation behaviour.'
        proposed_experiments:
        - experiment_id: exp_mc1dn36_ndufc2_protein_levels
          name: Test whether the residual His58Leu protein can incorporate into the ND2 module
          description: Abundance is already known - the complexome profile detects a scant amount of NDUFC2
            in the missense patient and none in the stop-loss patient - so the open question is what that
            residual protein is doing. Express His58Leu NDUFC2 at a controlled level in a NDUFC2-null
            background and ask whether it incorporates into the ND2 module, by immunoprecipitation or
            by complexome profiling restricted to that module. A protein present but excluded from the
            module establishes an interface-binding defect; a protein that incorporates and is simply
            too scarce points to instability instead.
      selected_evidence:
        snippet: The loss of the NDUFC2-containing ND2 module in Subject 3 asserts that the conserved
          His58 residue plays an important role in its assembly or stability.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
