        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of NDUFC2 from the Complex I Membrane Arm
        biological_scale: MOLECULAR
        description: NDUFC2 is a membrane protein of the proton-pumping arm, assigned to the ND2 module,
          facing the intermembrane space, and in contact with twelve other subunits - NDUFA8 in the ND1
          module, five subunits of its own ND2 module, and five of the ND4 module. That is an unusual
          amount of connectivity for a small accessory subunit and is the structural reason a defect in
          it is an assembly defect rather than a catalytic one. Complexome profiling of patient fibroblasts
          confirms the loss of NDUFC2 itself.
        genes:
        - preferred_term: NDUFC2
          term:
            id: hgnc:7706
            label: NDUFC2
        cellular_components:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
      selected_evidence:
        snippet: NDUFC2 is a membrane protein assigned to the ND2 module within the proton pumping modules
        supports: SUPPORT
