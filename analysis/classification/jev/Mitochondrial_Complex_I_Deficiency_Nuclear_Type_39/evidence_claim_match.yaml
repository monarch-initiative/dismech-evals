  0cee31401adfdac1fda5f569d4cbd490ac0d23135f9f8af1345021b40b5e7e1e:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 39
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 39
            term:
              id: MONDO:0859320
              label: mitochondrial complex I deficiency, nuclear type 39
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn39_prognosis_from_one_patient
        kind: KNOWLEDGE_GAP
        prompt: The one reported MC1DN39 patient died. Is MC1DN39 a lethal neonatal disorder, or is that
          one point on a range nobody has sampled?
        attaches_to:
        - disease#Mitochondrial Complex I Deficiency, Nuclear Type 39
        - pathophysiology#Bioenergetic Failure in High-Demand Tissues
        rationale: 'This is the gap most likely to be answered wrongly by inference, because a single
          fatal case reads as a prognosis unless something stops it.

          The group-level data say stop. Across 130 patients with nuclear gene defects causing complex
          I deficiency, a quarter died before six months and three quarters before ten years, but some
          recovered skills and some were alive in their thirties, and the authors reported that no clinical,
          biochemical or genetic parameter predicted longer survival. A range that wide, with no predictor,
          means one observation carries almost no information about the next patient.

          There is also a specific reason to expect variability for this gene in particular. The reported
          allele is an intronic splicing variant, which produces a quantitative rather than an absolute
          reduction in protein; a different NDUFB7 allele producing a different residual level could plausibly
          give a different course. That is speculation, but it is speculation the evidence base cannot
          currently rule out, which is precisely why the entry does not state a prognosis.

          A note on how the fatal outcome is recorded. It is not curated as a phenotype: HP:0003811 Neonatal
          death sits under HPO''s mortality branch rather than under Phenotypic abnormality, so it is
          outside the PhenotypeTerm dynamic enum and cannot be bound in a phenotypes entry. The outcome
          therefore lives in this discussion and in the entry description, which is the right place for
          it given that it is one observation rather than a disease feature, but the constraint is the
          schema''s rather than a curation decision.'
      selected_evidence:
        snippet: Twenty-five percent of the patients died before the age of six months, more than half
          before the age of two and 75 % before the age of ten years.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22644603
      reference_title: 'Natural disease course and genotype-phenotype correlations in Complex I deficiency
