      assertion:
        name: Bioenergetic Failure in High-Demand Tissues
        description: 'Reduced electron transfer through complex I lowers oxidative phosphorylation output,
          and the tissues that decompensate first are the ones with the highest ATP demand: heart and
          brain. The clinical picture in the index patient follows that pattern, with hypertrophic cardiomyopathy
          and encephalopathy, and the anaerobic compensation shows as lactic acidosis.

          The tissue-selectivity reasoning is standard mitochondrial-medicine inference rather than a
          measurement in this patient, so the node is marked PROVISIONAL. No cardiac or brain tissue enzymology
          was reported.'
        biological_scale: ORGANISM
