          allele is an intronic splicing variant, which produces a quantitative rather than an absolute
          reduction in protein; a different NDUFB7 allele producing a different residual level could plausibly
          give a different course. That is speculation, but it is speculation the evidence base cannot
          currently rule out, which is precisely why the entry does not state a prognosis.

          A note on how the fatal outcome is recorded. It is not curated as a phenotype: HP:0003811 Neonatal
          death sits under HPO''s mortality branch rather than under Phenotypic abnormality, so it is
          outside the PhenotypeTerm dynamic enum and cannot be bound in a phenotypes entry. The outcome
          therefore lives in this discussion and in the entry description, which is the right place for
          it given that it is one observation rather than a disease feature, but the constraint is the
          schema''s rather than a curation decision.'
      selected_evidence:
        snippet: Such mutations can present a wide range of clinical manifestations, varying from mild
          deficiencies to severe, lethal disorders.
        supports: SUPPORT
