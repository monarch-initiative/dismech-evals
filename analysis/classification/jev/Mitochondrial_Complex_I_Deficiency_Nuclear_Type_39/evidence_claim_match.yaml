              id: MONDO:0859320
              label: mitochondrial complex I deficiency, nuclear type 39
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Destabilised Assembly of the Complex I Membrane Arm
        description: 'The step from a missing subunit to a broken enzyme. A systematic knockout screen
          of every accessory subunit found that losing any one of them destabilises the other subunits
          sitting in the same structural module, and that twenty-five of the thirty-one are strictly required
          for a functional complex to assemble at all.

          That is the mechanism this node asserts, and it is asserted as a general property of accessory
          subunits rather than as a measurement on NDUFB7. The cached record of the screen reports the
          rule across subunits without naming NDUFB7''s module or its individual result, and no complexome
          profile has been published for a MC1DN39 patient. The node is marked PROVISIONAL for that reason.'
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex I assembly
          term:
            id: GO:0032981
            label: mitochondrial respiratory chain complex I assembly
          modifier: DECREASED
        cellular_components:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
      selected_evidence:
        snippet: Quantitative proteomic analysis of cell lines revealed that loss of each subunit affects
          the stability of other subunits residing in the same structural module.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
