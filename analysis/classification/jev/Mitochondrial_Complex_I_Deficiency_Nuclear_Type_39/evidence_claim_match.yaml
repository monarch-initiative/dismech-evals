      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn39_module_mechanism_is_generic
        kind: KNOWLEDGE_GAP
        prompt: The step from reduced NDUFB7 to a destabilised complex is taken from a screen of accessory
          subunits in general. Which module does NDUFB7 belong to, and is it one of the twenty-five strictly
          required subunits?
        attaches_to:
        - pathophysiology#Destabilised Assembly of the Complex I Membrane Arm
        rationale: 'The entry''s causal chain has one link that is not measured for this gene, and it
          is worth naming rather than leaving a reader to notice.

          The knockout screen established a rule: losing an accessory subunit destabilises the other subunits
          in its own structural module, and twenty-five of thirty-one accessory subunits are strictly
          required for a functional complex. The record cached for this entry states the rule and the
          count without naming NDUFB7''s module or reporting its individual result, so the entry applies
          a strong prior rather than a finding. Six accessory subunits are not strictly required, and
          nothing here excludes NDUFB7 being one of them, with the enzyme defect in this patient arising
          some other way.

          Two things would close it and neither is expensive. The screen''s own supplementary data almost
          certainly contain the NDUFB7 knockout line''s result, which would settle the general question
          immediately. A complexome profile or blue native analysis of the patient''s fibroblasts, which
          already exist and already showed the enzyme defect, would settle the specific one and say whether
          assembly stalls at an identifiable intermediate.'
      selected_evidence:
        snippet: Here we use gene editing to generate human knockout cell lines for each accessory subunit.
        supports: SUPPORT
