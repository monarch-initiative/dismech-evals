          name: Mitochondrial Complex I Deficiency, Nuclear Type 39
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 39
            term:
              id: MONDO:0859320
              label: mitochondrial complex I deficiency, nuclear type 39
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mc1dn39_intronic_variant_ascertainment
        kind: KNOWLEDGE_GAP
        prompt: The causal variant is intronic and ten bases from the splice site. How many NDUFB7 cases
          are being missed by exome sequencing and coding-region filters?
        attaches_to:
        - pathophysiology#Biallelic Intronic NDUFB7 Variant
        - genetic#NDUFB7
        rationale: 'Worth recording because it bears on why this disorder has one patient, and the answer
          is not necessarily that it is vanishingly rare.

          A c.113-10C>G change is outside the coding sequence and outside the canonical splice dinucleotides.
          Exome capture may not cover it well, standard variant filtering usually discards it, and in
          silico splice prediction is the only thing that would flag it. This case was solved because
          the group ran whole genome sequencing and then sequenced the RNA to check what the variant actually
          did. A laboratory doing exome-only analysis with coding filters would have found nothing in
          this patient.

          So the reported frequency of MC1DN39 is a statement about how the group has been ascertained
          as much as about how often the disease occurs. Re-analysis of unsolved isolated complex I deficiency
          cohorts with genome sequencing plus RNA sequencing is the obvious test, and it is the same test
          that would answer the prognosis gap above by supplying more patients.'
      selected_evidence:
        snippet: Whole genome sequencing revealed an intronic biallelic mutation in the NDUFB7 gene (c.113-10C>G)
          and splicing pattern alterations in NDUFB7 messenger RNA were confirmed by RNA Sequencing.
        supports: SUPPORT
