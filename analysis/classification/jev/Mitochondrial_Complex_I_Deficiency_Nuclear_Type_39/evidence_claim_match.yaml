  7216d6ddc8e367112e93a49315fa6668ae9c8966ca4d974facb15777362d5cb0:
    claim:
      about:
        disease:
          name: Mitochondrial Complex I Deficiency, Nuclear Type 39
          disease_term:
            preferred_term: Mitochondrial complex I deficiency, nuclear type 39
            term:
              id: MONDO:0859320
              label: mitochondrial complex I deficiency, nuclear type 39
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Genome sequencing with RNA sequencing, after enzymology shows isolated complex I deficiency
        description: 'The diagnostic route that solved this case, and the reason it is worth recording
          as a diagnosis entry rather than assumed. Biochemical testing establishes an isolated complex
          I deficiency, but the genetic confirmation needed two things that are not routine.

          Whole genome sequencing was needed because the causal variant is intronic and ten bases from
          the acceptor site, outside the coding regions an exome captures reliably and outside the canonical
          splice dinucleotides a coding-focused filter retains. RNA sequencing was then needed to show
          the variant actually altered splicing, rather than leaving the claim to a prediction tool. A
          laboratory running exome-only analysis with standard coding filters would have returned no result
          in this patient.

          The practical consequence for a patient with unexplained isolated complex I deficiency is that
          a negative exome does not exclude a nuclear complex I gene, and that reflex RNA sequencing is
          what converts a candidate non-coding variant into a diagnosis.'
      selected_evidence:
        snippet: Whole genome sequencing revealed an intronic biallelic mutation in the NDUFB7 gene (c.113-10C>G)
          and splicing pattern alterations in NDUFB7 messenger RNA were confirmed by RNA Sequencing.
        supports: SUPPORT
    origin:
