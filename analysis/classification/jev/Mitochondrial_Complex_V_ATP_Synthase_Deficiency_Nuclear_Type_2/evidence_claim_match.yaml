              seen in patients.
        - target: Stalled F1 Intermediate Accumulation
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The knockout directly demonstrates the stalled-at-F1 assembly signature — free
            F1 complexes accumulate because biogenesis halts after F1 formation.
          limitations: Demonstrated in the embryonic-lethal constitutive null; the equivalent free-F1
            accumulation has not been quantified in patient tissue, where reduced fully assembled complex
            with detectable F1 subunits is what is reported.
          readouts:
          - name: Free F1 complex abundance in Tmem70-/- embryos
            target: Stalled F1 Intermediate Accumulation
            direction: INCREASED
            interpretation: Accumulation of free F1 complexes, the mechanistic marker of biogenesis stalled
              after F1 formation.
