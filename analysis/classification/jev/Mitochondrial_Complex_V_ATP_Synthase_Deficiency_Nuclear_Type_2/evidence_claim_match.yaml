            id: GO:0033615
            label: mitochondrial proton-transporting ATP synthase complex assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Our results show that TMEM70 is involved in mitochondrial ATP synthase biogenesis in
          higher eukaryotes.
        supports: SUPPORT
