        description: 'TMEM70 is an ancillary factor required for the biogenesis of mitochondrial ATP synthase
          in higher eukaryotes. Biallelic loss-of-function variants — usually the c.317-2A>G founder splice
          defect — remove this biogenesis support. The causal role is proven by complementation: restoring
          wild-type TMEM70 to patient cells restores assembly and metabolic function of the enzyme complex.'
        role: trigger
