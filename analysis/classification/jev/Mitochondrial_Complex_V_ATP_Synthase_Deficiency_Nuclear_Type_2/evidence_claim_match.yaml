  94a3bb3589f55bdd867b06f853da5bb185327a85f47c7b9919511a615fb6e46f:
    claim:
      about:
        disease:
          name: Mitochondrial Complex V (ATP Synthase) Deficiency, Nuclear Type 2
          disease_term:
            preferred_term: Mitochondrial complex V (ATP synthase) deficiency, nuclear type 2
            term:
              id: MONDO:0013546
              label: mitochondrial complex V (ATP synthase) deficiency, nuclear type 2
        context: []
      assertion_type: Genetic
      assertion:
        name: TMEM70
        notes: 'TMEM70 (8q21.11) encodes a 21 kD inner-mitochondrial-membrane protein of three exons acting
          as an ancillary factor in ATP synthase biogenesis; the precise molecular function is not fully
          determined. The founder splice-site variant c.317-2A>G accounts for the great majority of alleles
          and is strongly enriched in the Roma population, but it is not the whole spectrum: at least
          14 further TMEM70 mutations are reported, and the broader allelic spectrum widens the phenotype
          to include hypospadias and pulmonary arterial hypertension.'
        gene_term:
          preferred_term: TMEM70
          term:
            id: hgnc:26050
            label: TMEM70
        relationship_type: CAUSATIVE
        variants:
        - name: TMEM70 c.317-2A>G
          description: Founder splice-site variant enriched in the Roma population; homozygosity is the
            usual genotype in the classic neonatal presentation and defined the 25-patient natural-history
            cohort.
          type: splice site
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: We carried out whole-genome homozygosity mapping, gene expression analysis and DNA sequencing
          in individuals with isolated mitochondrial ATP synthase deficiency and identified disease-causing
          mutations in TMEM70.
        supports: SUPPORT
    origin:
