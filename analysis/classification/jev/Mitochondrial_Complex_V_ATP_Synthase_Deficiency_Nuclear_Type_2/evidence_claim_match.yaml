            term:
              id: MONDO:0013546
              label: mitochondrial complex V (ATP synthase) deficiency, nuclear type 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Stalled F1 Intermediate Accumulation
        biological_scale: MOLECULAR
        description: 'TMEM70 acts late in ATP synthase assembly, after the soluble F1 head has formed,
          so its loss stalls biogenesis at the F1 stage: the F1 oligomer is built but cannot be completed
          into holo-enzyme, and free F1 complexes accumulate. This is the mechanistic feature that distinguishes
          MC5DN2 from the ATPAF2 sibling disorder (MC5DN1), where the F1 assembly chaperone ATP12 is lost,
          F1 itself cannot form, and free F1 does not accumulate. Shown directly in the Tmem70-knockout
          mouse; human patient tissue shows the reciprocal, reduced fully assembled complex with F1 subunits
          still detectable.'
      selected_evidence:
        snippet: a marked accumulation of F1 complexes indicative of impairment in ATP synthase biogenesis
          that was stalled at the early stage, following the formation of F1 oligomer
        supports: SUPPORT
