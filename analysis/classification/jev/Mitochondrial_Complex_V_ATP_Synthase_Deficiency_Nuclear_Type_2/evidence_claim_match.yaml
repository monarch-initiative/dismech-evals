            relationship: RECAPITULATES
            fidelity: MODERATE
            description: Blue-native analysis of Tmem70-/- embryos shows an isolated ~80% decrease in
              fully assembled ATP synthase, the same biochemical lesion measured in patient tissue, which
              the authors call analogous to human TMEM70 dysfunction.
            limitations: A constitutive null is embryonically lethal, whereas the common human allele
              is a hypomorphic splice variant compatible with live birth, so the model captures the biochemical
              deficiency and its developmental consequences rather than the postnatal clinical course.
          role: ancestor
