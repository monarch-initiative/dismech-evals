            rescue of the biochemical lesion rather than reproducing the human clinical course; cardiac
            complementation was only partial in hemizygotes, and the SHR background carries its own cardiovascular
            phenotype.
          readouts:
          - name: TMEM70 protein and ATP synthase biogenesis after transgenic rescue
            target: Isolated ATP Synthase Deficiency
            direction: RESTORED
            interpretation: Partial restoration of the assembly factor is sufficient for full biochemical
              complementation of the enzyme deficiency in liver.
      selected_evidence:
        snippet: we tested the efficiency of gene complementation by using a transgenic rescue approach
