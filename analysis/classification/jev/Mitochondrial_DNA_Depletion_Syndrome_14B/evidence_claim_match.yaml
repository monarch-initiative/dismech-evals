      assertion_type: AnimalModel
      assertion:
        name: Opa1 homozygous mutant mouse (embryonic lethal)
        species: Mouse
        genotype: Opa1 homozygous mutant
        publication: PMID:26561570
        description: 'Homozygous Opa1 mutant mice die in utero during embryogenesis due to severe abrogation
          of Opa1 protein, confirming that Opa1 is essential in early development. This is the central
          translational mismatch for MTDPS14B: the human homozygous state is compatible with live birth
          and roughly a year of life, so the p.Leu534Arg allele must retain partial function that the
          mouse null does not model.

          '
        modeled_mechanisms:
        - target: Fatal Infantile Multisystem Decompensation
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: 'Complete Opa1 loss in the mouse is embryonic lethal and therefore cannot reproduce
            the postnatal human course — live birth, progressive infantile multisystem deterioration,
            and death at 10-11 months — produced by a homozygous destabilising missense allele. The model
            does reproduce the molecular node (severe loss of Opa1 protein); what it fails to reproduce
            is the organismal phenotype.

            '
          limitations: 'The models reported are protein-null rather than carrying a hypomorphic missense
            allele; embryonic lethality precludes any assessment of the infantile cardiac, neurological
            or optic phenotype. Conclusions about human residual OPA1 function cannot be drawn from them.

            '
          model_scale: ORGANISM
          divergences:
          - divergence_type: CAUSE_UNREPRESENTED
            materiality: INVALIDATING
            description: 'The model encodes complete loss of Opa1 protein. The MTDPS14B lesion is a homozygous
              destabilising missense allele that must retain enough residual GTPase function to permit
              organogenesis and live birth. The causal allele is therefore not represented, and the difference
              is the whole reason the model fails: null and hypomorphic are different lesions rather than
              different severities of one.'
          - divergence_type: TEMPORAL_SCOPE
            materiality: INVALIDATING
            description: Death occurs in utero, before the developmental window in which every feature
              of this node arises. The human course - live birth, progressive infantile deterioration,
              death at 10-11 months - lies entirely outside the model's observable lifespan.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: 'Mouse rather than human. Species alone is the lesser problem here: even a human
              null would be expected to behave differently from the p.Leu534Arg homozygote, so the allele
              mismatch above dominates.'
      selected_evidence:
        snippet: Homozygous mutant mice died in utero during embryogenesis due to severe abrogation of
          Opa1 protein levels, confirming a critical role for this pro-fusion mediator in early life and
          development.
        supports: SUPPORT
