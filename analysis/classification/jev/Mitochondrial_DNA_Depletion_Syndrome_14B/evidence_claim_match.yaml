            term:
              id: MONDO:0014820
              label: mitochondrial DNA depletion syndrome 14B (cardioencephalomyopathic type)
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Muscle mtDNA Depletion
        biological_scale: MOLECULAR
        description: 'Beyond membrane fusion, OPA1 is required for maintenance of the mitochondrial genome.
          A small hydrophobic peptide derived from the OPA1 isoform containing alternatively spliced exon
          4b is embedded in the inner membrane and co-immunoprecipitates with nucleoid components, tethering
          nucleoids to the inner membrane and promoting mtDNA replication and distribution. Silencing
          exon-4b-containing OPA1 isoforms in human cells causes mtDNA depletion secondary to inhibited
          mtDNA replication. In MTDPS14B, quantitative PCR of patient skeletal muscle showed a roughly
          78% reduction in mtDNA copy number in both affected sisters, while long-range PCR found no multiple
          mtDNA deletions — the depletion phenotype, not the deletion phenotype seen in older OPA1 mutation
          carriers, is what places this disorder in the mtDNA depletion syndrome series.

          '
        biological_processes:
        - preferred_term: mitochondrial DNA replication
          term:
            id: GO:0006264
            label: mitochondrial DNA replication
          modifier: DECREASED
        - preferred_term: mitochondrion organization
          term:
            id: GO:0007005
            label: mitochondrion organization
          modifier: ABNORMAL
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: there was evidence of significant mtDNA depletion with a 78% decrease for patient I-1
          and a 78% decrease for patient I-2 compared with control values
        supports: SUPPORT
