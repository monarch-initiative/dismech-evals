  26aa596ab4cdeee10988d2e17b65247b49f639a5074c4fc5c9966afb298ebbf6:
    claim:
      about:
        disease:
          name: Mitochondrial DNA Depletion Syndrome 14B (Cardioencephalomyopathic Type)
