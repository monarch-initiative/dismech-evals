          the assembly and stability of respiratory chain supercomplexes. Loss of OPA1 is therefore expected
          to disorganize cristae and destabilise supercomplexes, giving a second route from the OPA1 lesion
          to the measured respiratory chain deficiency alongside the mtDNA depletion arm. The evidence
          for this node is general OPA1 cell biology; no cristae abnormality was reported in the patient
          biopsies, whose only reported ultrastructural finding was incomplete inner-membrane fusion.

          '
