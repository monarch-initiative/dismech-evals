          value:
            name: Muscle mtDNA Depletion
            biological_scale: MOLECULAR
            description: 'Beyond membrane fusion, OPA1 is required for maintenance of the mitochondrial
              genome. A small hydrophobic peptide derived from the OPA1 isoform containing alternatively
              spliced exon 4b is embedded in the inner membrane and co-immunoprecipitates with nucleoid
              components, tethering nucleoids to the inner membrane and promoting mtDNA replication and
              distribution. Silencing exon-4b-containing OPA1 isoforms in human cells causes mtDNA depletion
              secondary to inhibited mtDNA replication. In MTDPS14B, quantitative PCR of patient skeletal
              muscle showed a roughly 78% reduction in mtDNA copy number in both affected sisters, while
              long-range PCR found no multiple mtDNA deletions — the depletion phenotype, not the deletion
              phenotype seen in older OPA1 mutation carriers, is what places this disorder in the mtDNA
              depletion syndrome series.

              '
