  91efabfefe5ce7b40a1cbf997bbd47b59ebd39e3a66d56f4273b51ef1a863b8c:
    claim:
      about:
        disease:
          name: Mitochondrial DNA Depletion Syndrome 14B (Cardioencephalomyopathic Type)
          disease_term:
            preferred_term: mitochondrial DNA depletion syndrome 14B (cardioencephalomyopathic type)
            term:
              id: MONDO:0014820
              label: mitochondrial DNA depletion syndrome 14B (cardioencephalomyopathic type)
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mtdps14b_14a_14b_boundary
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'What clinical or molecular criteria separate MTDPS14B (cardioencephalomyopathic, OMIM
          616896, MONDO:0014820) from its sibling concept MTDPS14A (encephalomyopathic, OMIM 621481, MONDO:0980967),
          and is hypertrophic cardiomyopathy a necessary discriminator or merely the feature that happened
          to be present in the index family?

          '
        rationale: 'OMIM split the original MTDPS14 designation into 14A and 14B, both OPA1 disorders.
          MONDO:0014820 records no causal-gene relationship of its own, while MONDO:0980967 does — an
          asymmetry that makes automated gene-identity checks return SKIP for this entry. The published
          biallelic OPA1 spectrum is continuous rather than bimodal, and the single defining family for
          14B is too small to establish whether cardiomyopathy is definitional or incidental. Until that
          is resolved, curators must anchor on OMIM:616896 rather than on the clinical label, and must
          not merge 14A material into this entry.

          '
        proposed_experiments:
        - experiment_id: biallelic_opa1_genotype_phenotype_review
          name: Genotype-phenotype review of published biallelic OPA1 cases
          description: 'Systematically re-annotate all published biallelic OPA1 patients for presence
            or absence of cardiomyopathy, mtDNA copy number where measured, and allele severity, then
            test whether the 14A/14B division corresponds to any reproducible molecular or clinical boundary.

            '
          readouts:
          - name: Cardiomyopathy status per published biallelic OPA1 proband
            target: phenotypes#Hypertrophic Cardiomyopathy
            description: 'Presence, absence, or not-assessed for cardiomyopathy in every published biallelic
              OPA1 patient, recorded separately from whether an echocardiogram was performed, so that
              unascertained cases are not counted as negatives.

              '
            interpretation: 'A bimodal distribution would support cardiomyopathy as a definitional discriminator
              for 14B; a continuous or ascertainment-driven distribution would not.

              '
          - name: Muscle mtDNA copy number where measured
            target: pathophysiology#Muscle mtDNA Depletion
            description: 'mtDNA copy number relative to controls in the subset of published biallelic
              OPA1 patients in whom it was quantified.

              '
            interpretation: 'Establishes whether mtDNA depletion tracks with the cardiac phenotype or
              occurs across the biallelic spectrum irrespective of it.

              '
          - name: Allele severity class per genotype
            target: pathophysiology#Destabilization of the OPA1 Dynamin-like GTPase
            description: 'Classification of each published allele as null, GTPase-domain missense, or
              other missense, and of each genotype by the milder of its two alleles.

              '
            interpretation: 'If cardiomyopathy segregates with a particular allele class rather than with
              the clinical label, the 14A/14B split is a molecular boundary; if it does not, the split
              records which family was described first.

              '
          decision_criterion: 'The 14A/14B division is a reproducible boundary only if cardiomyopathy
            status separates published biallelic OPA1 probands into two groups that also differ by allele
            class or mtDNA copy number. Agreement with the clinical label alone, in a series where cardiac
            assessment was not systematic, does not meet this criterion.

            '
          would_support:
          - disease#Mitochondrial DNA Depletion Syndrome 14B (Cardioencephalomyopathic Type)
          supporting_outcome:
          - Cardiomyopathy is present in essentially all probands carrying one allele class and essentially
            absent in the others, with mtDNA copy number differing in the same direction.
          refuting_outcome:
          - Cardiomyopathy is distributed continuously across allele classes, or its apparent absence
            in 14A cases tracks with whether echocardiography was performed, which would make the 14A/14B
            division an artefact of ascertainment.
          notes: 'This is a literature re-annotation study, not a wet-lab experiment; the readouts are
            extracted from published case reports rather than measured. No new patient material is required,
            which is what makes it tractable for a disorder with two index cases.

            '
      selected_evidence:
        snippet: This report provides evidence that bi-allelic OPA1 mutations may lead to complex and
          severe multi-system recessive mitochondrial disorders, where optic atrophy might not represent
          the main feature.
        supports: SUPPORT
