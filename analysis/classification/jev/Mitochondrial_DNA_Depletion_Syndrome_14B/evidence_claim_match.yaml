      assertion_type: Pathophysiology
      assertion:
        name: Impaired Inner Mitochondrial Membrane Fusion
        biological_scale: CELLULAR
        description: 'OPA1 mediates fusion of the inner mitochondrial membrane. Transmission electron
          microscopy of patient skeletal muscle in MTDPS14B disclosed large mitochondria with incomplete
          fusion of the inner mitochondrial membrane — the directly observed structural correlate of the
          fusion defect in these patients. This node carries only what was measured in patient tissue;
          the cristae arm is modelled separately because it was NOT observed in these biopsies and because
          OPA1 fusion and cristae-shaping are genetically and molecularly distinct functions.

          '
        biological_processes:
