  53861ba22d479f3412c36a6d3faab31436218a74a57cd70495fa2d23ef5e8644:
    claim:
      about:
        disease:
          name: Mitochondrial DNA Depletion Syndrome 14B (Cardioencephalomyopathic Type)
          disease_term:
            preferred_term: mitochondrial DNA depletion syndrome 14B (cardioencephalomyopathic type)
            term:
              id: MONDO:0014820
              label: mitochondrial DNA depletion syndrome 14B (cardioencephalomyopathic type)
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Opa1 heterozygous mutant mouse (cardiac phenotype)
        species: Mouse
        genotype: Opa1 heterozygous mutant
        publication: PMID:26561570
        description: 'Histopathological evidence of cardiomyopathy was apparent in a heterozygous mutant
          Opa1 mouse as early as 5 months of age, with a combined complex I and IV respiratory chain defect
          and reduced ATP production in the affected cardiac tissue. This is the animal-model support
          for a cardiac consequence of Opa1 deficiency, cited by the authors when they reported the previously
          unrecognised human hypertrophic cardiomyopathy.

          '
        modeled_mechanisms:
        - target: Bioenergetic Failure of High-Demand Tissues
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: 'Demonstrates that Opa1 deficiency alone produces a cardiac phenotype with a complex
            I/IV respiratory chain defect, supporting the cardiac arm of the bioenergetic failure node.

            '
          limitations: 'The mouse is heterozygous, not homozygous, and its cardiomyopathy emerges at 5
            months rather than in the neonatal period; homozygous Opa1 mutant mice die in utero and so
            cannot model the human homozygous phenotype at all. The human disease is infantile, hypertrophic
            and rapidly fatal, and no mouse carrying the human p.Leu534Arg allele has been reported.

            '
          model_scale: TISSUE
          divergences:
          - divergence_type: POPULATION_MISMATCH
            materiality: INVALIDATING
            description: 'The model is a heterozygous Opa1 mutant. MTDPS14B is defined by a homozygous
              destabilising missense allele, and the gene-dose relationship between the two states is
              exactly what is unmodelled: the homozygous mouse is embryonic lethal while the homozygous
              human survives ten to eleven months. A cardiac phenotype in the heterozygote therefore cannot
              be read as the MTDPS14B cardiac phenotype at reduced strength.'
          - divergence_type: CAUSE_UNREPRESENTED
            materiality: QUALIFYING
            description: 'The mouse carries a null allele, not the destabilising p.Leu534Arg missense
              allele that causes MTDPS14B, so the causal lesion is absent as well as under-dosed. This
              is a separate gap from the dose mismatch above: even a heterozygous knock-in of the missense
              allele would leave the dose question open, and even a homozygous null would leave the allele
              question open. The link''s own claim - that Opa1 deficiency is sufficient to reach the heart
              - survives it, which is why this is QUALIFYING where the dose mismatch is INVALIDATING.'
          - divergence_type: TEMPORAL_SCOPE
            materiality: QUALIFYING
            description: Cardiomyopathy appears in the mouse at 5 months of adult life. In the index sisters
              the cardiomyopathy was progressive from infancy and fatal within the first year, so the
              model's time course supports that Opa1 deficiency reaches the heart without supporting the
              infantile tempo.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Murine cardiac tissue, not human. The claim it grounds is that OPA1 deficiency
              alone is sufficient to produce a cardiac respiratory chain defect, which is a conserved
              bioenergetic argument, but the human hypertrophic morphology has no murine counterpart here.
      selected_evidence:
        snippet: adult myocardial function depends on balanced mitochondrial fusion and fission, maintained
          by processing of the dynamin-like guanosine triphosphatase OPA1 by the mitochondrial peptidases
          YME1L and OMA1
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26785494
      reference_title: Imbalanced OPA1 processing and mitochondrial fragmentation cause heart failure
        in mice.
      evidence_source: MODEL_ORGANISM
      explanation: 'Primary murine evidence that cardiac function depends on OPA1, supporting a cardiac
        consequence of OPA1 dysfunction. The mouse phenotype is dilated cardiomyopathy driven by imbalanced
        OPA1 processing rather than the infantile hypertrophic cardiomyopathy of MTDPS14B, so the step
        to this disease is an inference.

        '
