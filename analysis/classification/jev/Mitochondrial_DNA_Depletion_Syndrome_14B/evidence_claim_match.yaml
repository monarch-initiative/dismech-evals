        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Destabilization of the OPA1 Dynamin-like GTPase
        biological_scale: MOLECULAR
        description: 'OPA1 is a large, multimeric, dynamin-like GTPase that localises to the inner mitochondrial
          membrane. In MTDPS14B the homozygous c.1601T>G (p.Leu534Arg) substitution replaces a highly
          conserved hydrophobic leucine with arginine immediately adjacent to the catalytic GTPase domain.
          In silico modelling predicts that this destabilises the protein fold, and western blotting of
          patient skeletal muscle confirms a marked reduction in steady-state native OPA1. Because OPA1
          acts as an oligomer, the complete absence of a wild-type allele in the homozygous state is expected
          to further compromise stability through impaired oligomerisation.

          '
        genes:
        - preferred_term: OPA1
          term:
            id: hgnc:8140
            label: OPA1
        molecular_functions:
        - preferred_term: GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
          modifier: DECREASED
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          allele_type: SNV
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
      selected_evidence:
        snippet: They were found to be homozygous for a novel c.1601T>G (p.Leu534Arg) mutation in the
          OPA1 gene, which resulted in a marked loss of steady-state levels of the native OPA1 protein.
        supports: SUPPORT
