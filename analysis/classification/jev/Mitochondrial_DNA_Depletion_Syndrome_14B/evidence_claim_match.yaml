            preferred_term: mitochondrial DNA depletion syndrome 14B (cardioencephalomyopathic type)
            term:
              id: MONDO:0014820
              label: mitochondrial DNA depletion syndrome 14B (cardioencephalomyopathic type)
        context: []
      assertion_type: Treatment
      assertion:
        name: Supportive and Multidisciplinary Care
        description: 'No disease-modifying therapy exists for MTDPS14B. Management is entirely supportive:
          nutritional support for failure to thrive (gastrostomy and anti-reflux surgery were required
          in the index family), cardiological surveillance for the progressive hypertrophic cardiomyopathy,
          ophthalmological and audiological assessment, and respiratory monitoring given the apnoeic deaths.

          '
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: 'No clinical trial, treatment guideline, or disease-modifying intervention specific to
          MTDPS14B exists. The falcon deep-research sweep did surface two things, and both were deliberately
          excluded rather than curated here: a single-patient observational use of idebenone 135 mg/day
          in the broader biallelic OPA1 series (Nasca 2017), which describes a Behr-like patient and not
          this cardioencephalomyopathic entity; and OPA1 interventional programmes (intravitreal oligonucleotide
          candidates NCT06461286, NCT06970106, plus natural-history studies), which target autosomal dominant
          optic atrophy, an allelic but distinct disorder. Neither supports a treatment claim for MTDPS14B.
          Gene-level OPA1 guidance on avoiding medications that interfere with mitochondrial metabolism
          (GeneReviews PMID:20301426) is a reasonable precaution in a child with a proven biallelic OPA1
          defect, but it is recorded here as a note rather than as a curated treatment because its only
          source describes the dominant disorder and its smoking and alcohol items are inapplicable to
          an infant.

          '
      selected_evidence:
        snippet: Due to gastro-oesophageal reflux and persisting failure to thrive, a gastrostomy tube
          and Nissen funduplication procedures were performed at 3 months of age.
        supports: SUPPORT
        directness: INDIRECT
