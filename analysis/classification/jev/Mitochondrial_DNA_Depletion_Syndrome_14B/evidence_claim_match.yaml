          disease_term:
            preferred_term: mitochondrial DNA depletion syndrome 14B (cardioencephalomyopathic type)
            term:
              id: MONDO:0014820
              label: mitochondrial DNA depletion syndrome 14B (cardioencephalomyopathic type)
        context: []
      assertion_type: Genetic
      assertion:
        name: OPA1
        gene_term:
          preferred_term: OPA1
          term:
            id: hgnc:8140
            label: OPA1
        association: 'Biallelic (homozygous) pathogenic OPA1 variants; the defining family carried homozygous
          c.1601T>G (p.Leu534Arg), reported on domain-annotation lookup as affecting the catalytic GTPase
          domain and modelled as lying in its immediate vicinity. The defining publication states the
          position both ways and the boundary call is not settled; see the entry notes.

          '
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'OPA1 shows a striking allelic series. Heterozygous OPA1 variants cause autosomal dominant
          optic atrophy (OMIM 165500) and, in up to 20% of carriers, DOA plus. Compound heterozygous variants
          produce severe syndromic neurodegeneration often labelled Behr syndrome. MTDPS14B represents
          the homozygous extreme. Curators should not transfer phenotype or management claims between
          these allelic disorders: this entry is the recessive, cardioencephalomyopathic entity only.
          ENTITY-IDENTITY NOTE: the causal gene here is OPA1 (HGNC:8140), NOT SLC25A4 (ANT1), which causes
          mitochondrial DNA depletion syndrome 12 (cardiomyopathic type) — a separate member of the numbered
          MTDPS series with a superficially similar cardiac label.

          '
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: We have established, for the first time, a causal link between a pathogenic homozygous
          OPA1 mutation and human disease.
        supports: SUPPORT
