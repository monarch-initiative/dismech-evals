        rationale: 'The mouse models that exist bracket the human disease rather than model it. Homozygous
          Opa1 nulls die in utero, so they overshoot; heterozygous mice develop a cardiomyopathy only
          at 5 months, so they undershoot both the severity and the timing. The human allele is a destabilising
          missense change that must retain enough residual function to permit organogenesis and a year
          of postnatal life, and no model carrying it has been reported. Any claim that a mouse phenotype
          recapitulates the human infantile cardiomyopathy therefore rests on an unmodelled dose-response
          relationship.

          '
        proposed_experiments:
        - experiment_id: opa1_l534r_knockin_mouse
          name: Opa1 p.Leu534Arg knock-in mouse
          description: 'Generate a homozygous knock-in mouse carrying the orthologous destabilising missense
            allele and characterise survival, cardiac ultrastructure and mass, muscle mtDNA copy number,
            respiratory chain enzymology and retinal ganglion cell counts against age-matched wild type.

            '
          perturbations:
          - name: Homozygous knock-in of the orthologous Opa1 destabilising missense allele
            target: pathophysiology#Destabilization of the OPA1 Dynamin-like GTPase
            description: 'Introduce the mouse residue orthologous to human OPA1 p.Leu534Arg (NM_015560.2
              c.1601T>G) at the endogenous locus and breed to homozygosity, so the allele is expressed
              under native regulation at native dose. This is the manipulation the existing models omit:
              they vary Opa1 dose (one null allele, or two) rather than substituting a hypomorphic missense
              allele.

              '
            gene:
              preferred_term: OPA1
              term:
                id: hgnc:8140
                label: OPA1
          controls:
          - name: Age-matched wild-type littermates
            description: 'Isogenic wild-type littermates from the same crosses, phenotyped on the same
              schedule, establish the baseline for survival, cardiac mass, mtDNA copy number and respiratory
              chain activity.

              '
          - name: Heterozygous knock-in littermates
            description: 'The heterozygous arm separates gene dose from allele identity. If heterozygous
              knock-in mice phenocopy the published heterozygous Opa1 null (cardiomyopathy at about 5
              months), the missense allele behaves as a simple loss-of-function; if they do not, the allele
              carries allele-specific behaviour that dose models cannot capture.

              '
          readouts:
          - name: Survival to weaning and beyond
            target: pathophysiology#Fatal Infantile Multisystem Decompensation
            description: 'Postnatal survival curve for homozygous knock-in mice against wild-type littermates.

              '
            interpretation: 'Live birth followed by early postnatal death is the outcome that would place
              the model inside the human course rather than before it (homozygous null) or after it (heterozygous
              null).

              '
          - name: Skeletal muscle mtDNA copy number
            target: pathophysiology#Muscle mtDNA Depletion
            direction: DECREASED
            description: 'Quantitative PCR of mtDNA relative to nuclear DNA in skeletal muscle, benchmarked
              against the roughly 78% reduction measured in patient muscle.

              '
            interpretation: 'Depletion of comparable magnitude would establish that the missense allele
              is sufficient to cause the mtDNA maintenance defect, which no existing Opa1 model demonstrates.

              '
          - name: Cardiac mass and myocardial ultrastructure
            target: phenotypes#Hypertrophic Cardiomyopathy
            direction: INCREASED
            description: 'Heart weight to body weight ratio with electron microscopy of cristae architecture
              in myocardium.

              '
            interpretation: 'Hypertrophic rather than dilated remodelling would be the finding that distinguishes
              this model from the OPA1-processing heart failure mouse. Targeted at the phenotype rather
              than at the upstream bioenergetic node because increased heart weight measures the hypertrophy
              itself, not the energy deficit inferred to drive it.

              '
          - name: Respiratory chain enzyme activities in muscle and heart
            target: pathophysiology#Combined Respiratory Chain Deficiency
            direction: DECREASED
            description: 'Spectrophotometric complex I-IV activities normalised to citrate synthase, in
              skeletal muscle and myocardium.

              '
            interpretation: 'A combined defect weighted to complexes I and IV would reproduce the patient
              enzymology.

              '
          - name: Retinal ganglion cell counts
            target: phenotypes#Optic Atrophy
            direction: DECREASED
            description: 'Retinal ganglion cell density on retinal flat mounts.

              '
            interpretation: 'Retinal ganglion cell loss is the cellular substrate of the optic atrophy,
              so the count adjudicates that phenotype directly. This is the arm the embryonic-lethal null
              cannot report at all.

              '
          decision_criterion: 'The model counts as recapitulating MTDPS14B only if homozygous knock-in
            mice are born alive and then show all three of: skeletal muscle mtDNA depletion of similar
            magnitude to patient muscle, a combined complex I and IV deficiency, and hypertrophic cardiac
            remodelling before adulthood.

            '
          would_support:
          - pathophysiology#Destabilization of the OPA1 Dynamin-like GTPase
          - pathophysiology#Muscle mtDNA Depletion
          - pathophysiology#Bioenergetic Failure of High-Demand Tissues
          supporting_outcome:
          - Homozygous knock-in mice survive gestation, then develop progressive hypertrophic cardiomyopathy
            with reduced muscle mtDNA copy number and a combined complex I and IV respiratory chain defect.
          would_refute:
          - pathophysiology#Muscle mtDNA Depletion
          refuting_outcome:
          - Homozygous knock-in mice show a fusion or cristae defect without any reduction in mtDNA copy
            number, which would place mtDNA depletion downstream of a separate lesion rather than of OPA1
            destabilisation itself.
      selected_evidence:
        snippet: Homozygous mutant mice died in utero during embryogenesis due to severe abrogation of
          Opa1 protein levels, confirming a critical role for this pro-fusion mediator in early life and
          development.
        supports: SUPPORT
