          a high basal energy requirement — the central nervous system, retinal ganglion cells and the
          optic nerve, cardiac muscle and skeletal muscle. In MTDPS14B this produces the defining combination
          of progressive encephalomyopathy with generalised neuromuscular weakness, progressive non-obstructive
          hypertrophic cardiomyopathy, and optic atrophy with attenuated visual evoked potentials indicating
          primary retinal ganglion cell pathology. Hypertrophic cardiomyopathy had not previously been
          reported with human OPA1 mutations, and its appearance in the homozygous state is what distinguishes
          this cardioencephalomyopathic entity from other OPA1 disorders.

          '
