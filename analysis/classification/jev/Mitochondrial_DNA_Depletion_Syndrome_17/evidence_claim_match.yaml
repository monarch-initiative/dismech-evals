        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of 16S mt-rRNA U1369 2'-O-Methylation
        description: 'MRM2 is the 2''-O-ribose methyltransferase for uridine U1369 of human 16S mitochondrial
          rRNA, a residue in the A-loop of the peptidyl transferase centre that contacts aminoacyl-site
          tRNA. Loss of MRM2 activity removes this modification. Work in MRM2 knockout cells shows that
          large-subunit assembly does not require the methyltransferase activity, so this node is recorded
          as a consequence of MRM2 loss with no downstream edge; whether the missing methyl mark itself
          contributes to disease is not known.

          '
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: rRNA (uridine-2'-O-ribose)-methyltransferase activity
          term:
            id: GO:0008650
            label: rRNA (uridine-2'-O-ribose)-methyltransferase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: rRNA 2'-O-methylation
          term:
