      assertion:
        name: Biallelic MRM2 Loss of Function
        description: 'Homozygous MRM2 variants have been reported in three families: the missense p.Gly189Arg
          (c.567G>A) at a residue conserved from E. coli RrmJ to human in the index MELAS-like patient,
          a donor splice-site variant c.8+1G>T that produces a frameshifted transcript in a subset of
          mRNAs in a dystonia family, and the missense p.Ala81Val in a family with a neurodevelopmental
          disorder. Yeast complementation showed that the allele carrying the equivalent of p.Gly189Arg
          cannot rescue respiration.

          '
        biological_scale: MOLECULAR
        genes:
        - preferred_term: MRM2
          term:
            id: hgnc:16352
            label: MRM2
        molecular_functions:
