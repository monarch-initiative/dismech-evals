          modifier: DECREASED
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Targeted exome sequencing of genes encoding the mitochondrial proteome identified a damaging
          mutation, c.567 G > A, affecting a highly conserved amino acid residue (p.Gly189Arg) of the
          MRM2 protein.
        supports: SUPPORT
