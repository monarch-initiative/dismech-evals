      assertion:
        discussion_id: cns_mechanism_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the neurological disease in DGUOK deficiency caused by mtDNA depletion and respiratory
          chain failure in the brain itself, by liver failure, or both?
        attaches_to:
        - pathophysiology#Central Nervous System Dysfunction
        rationale: The sources cited here document mtDNA depletion in liver, muscle and blood but not
          in brain, and the knockout mouse has no neurological phenotype. Neurological signs can appear
          after liver transplantation, which argues for a primary CNS component, but that observation
          does not measure brain mtDNA. The answer matters for transplant selection and for whether a
          nucleoside therapy would need to reach the brain.
      selected_evidence:
        snippet: Only six patients had additional mild neurological signs after liver transplant.
        supports: SUPPORT
