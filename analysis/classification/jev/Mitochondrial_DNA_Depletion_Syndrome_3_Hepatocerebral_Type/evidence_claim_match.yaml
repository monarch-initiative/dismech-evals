          through NCOA4-dependent ferritinophagy and labile iron release, rescued by N-acetylcysteine;
          corrected isogenic cells are resistant. Not yet shown in patient liver. The paper's introduction
          states that most patients develop iron overload, whereas siderosis was found in about a quarter
          of biopsies in the 2024 cohort, so how often this mechanism operates in vivo is unsettled.
        cell_types:
