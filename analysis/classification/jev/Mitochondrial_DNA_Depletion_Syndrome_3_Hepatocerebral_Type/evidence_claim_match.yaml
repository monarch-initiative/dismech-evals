      assertion_type: Discussion
      assertion:
        discussion_id: lt_selection_neurological_signs
        kind: CONTROVERSY
        status: OPEN
        prompt: Should neurological signs at presentation exclude an infant with DGUOK deficiency from
          liver transplantation, and if so which signs?
        attaches_to:
        - treatments#Liver Transplantation
        - phenotypes#Nystagmus
        rationale: A 2008 systematic review found that profound hypotonia, significant psychomotor retardation
          or nystagmus predicted death and that transplantation did not improve survival when they were
          present. The 2024 international cohort (26 transplanted) found no survival difference by neurological
          involvement, MRI abnormality, hypotonia or psychomotor delay, but did find worse survival with
          nystagmus at onset. A single-centre series reported long-term survivors with mild pre-transplant
          neurological signs. All data are retrospective and subject to selection, so the question is
          open; nystagmus is the sign on which the studies agree.
      selected_evidence:
        snippet: We compared the survival rate of individuals with or without neurological involvement
          but there was no statistically significant difference (Kaplan-Meier, P = 0.5410) (Fig. 3B).
        supports: SUPPORT
