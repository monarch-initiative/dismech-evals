          transaminases) with neurological signs (hypotonia, nystagmus, developmental delay) within weeks
          of birth; lactic acidosis and hypoglycaemia are common. Onset is neonatal or infantile, and
          nearly all affected infants die in the first 18 months without transplantation.
        genes:
        - preferred_term: DGUOK
          term:
            id: hgnc:2858
            label: DGUOK
      selected_evidence:
        snippet: Data on mortality revealed that 99/106 (93.4%) (4 N/A) patients died at an average age
          of 6.79 months (ranging from less than one month to 1.5 years), while 7/106 (6.6%) were still
          alive at the last follow-up, with an age that ranged from less than a month to seventeen years.
        supports: SUPPORT
