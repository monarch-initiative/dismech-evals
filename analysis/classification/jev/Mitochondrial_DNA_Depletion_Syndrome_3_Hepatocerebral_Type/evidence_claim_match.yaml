        - diagnosis#Hepatocellular carcinoma surveillance
        rationale: HCC is documented in single patients from infancy, and GeneReviews recommends three-monthly
          AFP and ultrasound, but no cohort gives an incidence, and AFP is already very high from the
          liver disease, which limits it as a tumour marker. Evidence for the surveillance interval is
          expert opinion.
      selected_evidence:
