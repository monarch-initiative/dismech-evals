        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: genotype_phenotype_correlation
        kind: CONTROVERSY
        status: OPEN
        prompt: Do biallelic truncating DGUOK variants predict the hepatocerebral phenotype and earlier
          death?
        attaches_to:
        - genetic#DGUOK
        rationale: Two overlapping 2024 literature cohorts disagree. One reports no genotype-phenotype
          correlation; the other finds that two truncating alleles raise the risk of death and of the
          hepatocerebral phenotype. The 2008 series had already noted that every patient with two null
          alleles had early liver failure and neurological disease. The difference may reflect how variants
          were grouped rather than contradictory data, but it bears on prognostic counselling after a
          molecular diagnosis.
      selected_evidence:
        snippet: Patients with two truncating variants had a higher risk of death and were more likely
          to have the neonatal/infantile-onset hepatocerebral disease phenotype.
        supports: SUPPORT
