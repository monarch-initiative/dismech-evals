  e1c5aae94ec2f6e8fa74cb6d620e2309abc6f02d2d85bba08ff765dd16e7b70b:
    claim:
      about:
        disease:
          name: Mitochondrial DNA Depletion Syndrome 3 (Hepatocerebral Type)
          disease_term:
            preferred_term: mitochondrial DNA depletion syndrome 3 (hepatocerebral type)
            term:
              id: MONDO:0009636
              label: mitochondrial DNA depletion syndrome 3 (hepatocerebral type)
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lt_selection_neurological_signs
        kind: CONTROVERSY
        status: OPEN
        prompt: Should neurological signs at presentation exclude an infant with DGUOK deficiency from
          liver transplantation, and if so which signs?
        attaches_to:
        - treatments#Liver Transplantation
        - phenotypes#Nystagmus
        rationale: A 2008 systematic review found that profound hypotonia, significant psychomotor retardation
          or nystagmus predicted death and that transplantation did not improve survival when they were
          present. The 2024 international cohort (26 transplanted) found no survival difference by neurological
          involvement, MRI abnormality, hypotonia or psychomotor delay, but did find worse survival with
          nystagmus at onset. A single-centre series reported long-term survivors with mild pre-transplant
          neurological signs. All data are retrospective and subject to selection, so the question is
          open; nystagmus is the sign on which the studies agree.
      selected_evidence:
        snippet: Nevertheless, a decision to carry out LT for patients with DGUOK deficiency remains difficult
          because neurological symptoms may occur and worsen after LT despite their absence before transplantation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24478274
      reference_title: 'Long-term outcomes after liver transplantation for deoxyguanosine kinase deficiency:
        a single-center experience and a review of the literature.'
      evidence_source: HUMAN_CLINICAL
      explanation: Neurological outcome after transplantation is not predictable from pre-transplant status.
