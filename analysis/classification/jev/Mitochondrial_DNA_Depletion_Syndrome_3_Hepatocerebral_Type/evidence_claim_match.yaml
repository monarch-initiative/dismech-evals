            term:
              id: MONDO:0009636
              label: mitochondrial DNA depletion syndrome 3 (hepatocerebral type)
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Mitochondrial DNA depletion syndrome, myopathic form (TK2)
        disease_term:
          preferred_term: mitochondrial DNA depletion syndrome, myopathic form
          term:
            id: MONDO:0012301
            label: mitochondrial DNA depletion syndrome, myopathic form
        description: The pyrimidine counterpart of this disease and its closest mechanistic relative.
          TK2 encodes the other mitochondrial deoxyribonucleoside kinase; between them TK2 and dGK phosphorylate
          all four deoxynucleosides, so loss of either impairs the same salvage pathway and causes mtDNA
          depletion. The separation is by substrate arm and by target organ, not by biochemistry.
        distinguishing_features:
        - TK2 phosphorylates the pyrimidines deoxythymidine, deoxycytidine and deoxyuridine; DGUOK phosphorylates
          the purines deoxyguanosine and deoxyadenosine.
        - TK2 deficiency is skeletal-muscle-predominant with progressive myopathy and respiratory failure,
          and liver, brain, heart and skin were unaffected throughout life in the original series; DGUOK
          deficiency is liver-predominant.
        - Oral deoxycytidine and deoxythymidine substitution is an established treatment for TK2 deficiency;
          no equivalent purine-side therapy is established for DGUOK deficiency, where liver transplantation
          is the intervention that alters survival.
        - Curated separately as Mitochondrial_DNA_Depletion_Syndrome_Myopathic_Form.
      selected_evidence:
        snippet: Other tissues such as liver, brain, heart, and skin remain unaffected throughout the
          patients' life.
        supports: SUPPORT
