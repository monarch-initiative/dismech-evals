        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Deoxynucleotide Insufficiency
        biological_scale: MOLECULAR
        description: Mitochondrial dGTP and dTTP fall in tissues that depend on mtDNA replication with
          little de novo supply, most clearly in liver and in quiescent cells. The 2018 review describes
          MPV17 as importing deoxynucleotides into mitochondria. The direct evidence is the measured pool
          deficit and its correction by deoxynucleoside supplementation; MPV17 has not been shown to transport
          a deoxynucleotide. A cell study also linked MPV17 loss to low mitochondrial folate and to uracil
          in mtDNA, consistent with poor thymidylate supply.
        chemical_entities:
        - preferred_term: mitochondrial dGTP
          term:
            id: CHEBI:16497
            label: dGTP
          modifier: DECREASED
        - preferred_term: mitochondrial dTTP
          term:
            id: CHEBI:18077
            label: dTTP
          modifier: DECREASED
        notes: The node binds the measured pool deficit (dGTP and dTTP) rather than a transport process,
          because MPV17 has not been shown to transport a deoxynucleotide. GO:0030302 deoxynucleotide
          transport would assert that unsettled mechanism.
      selected_evidence:
        snippet: One of the mtDNA maintenance proteins is MPV17, which is a mitochondrial inner membrane
          protein involved in importing deoxynucleotides into the mitochondria.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
