              stress and form petite colonies (large mtDNA deletions or depletion), and sym1-null mitochondria
              have reduced levels of all four dNTPs. Most missense proteins reach mitochondria but fail
              to join the high molecular weight complex. A repurposing screen found ten approved drugs
              that raise the mitochondrial dTTP pool and reduce mtDNA instability in the yeast; none has
              been tested in patient cells or animals.
            organism:
              preferred_term: baker's yeast
              term:
                id: NCBITaxon:4932
                label: Saccharomyces cerevisiae
            publication: PMID:30273399
