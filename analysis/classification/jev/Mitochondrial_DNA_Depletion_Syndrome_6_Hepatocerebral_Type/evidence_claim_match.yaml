        snippet: All ten of the identified molecules cause a concomitant increase of both the mitochondrial
          deoxyribonucleoside triphosphate (mtdNTP) pool and mtDNA stability, which suggests that the
          reduced availability of DNA synthesis precursors is the cause for the mtDNA deletion and depletion
          associated with Sym1 deficiency.
        supports: SUPPORT
