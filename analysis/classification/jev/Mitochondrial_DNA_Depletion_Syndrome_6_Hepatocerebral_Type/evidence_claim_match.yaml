              label: mitochondrial DNA depletion syndrome 6 (hepatocerebral type)
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mpv17_null_animals_without_liver_failure
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why do MPV17-null animals not develop the liver failure that defines the human disease?
          Mpv17 knockout mice keep a working liver on a standard diet, and dogs homozygous for a truncating
          MPV17 allele show no reported disease.
        attaches_to:
        - pathophysiology#Hepatocellular Injury and Progressive Liver Failure
        - animal_models#Dog
        - animal_models#Mouse
        rationale: Two mammals lacking functional MPV17 escape the hepatic outcome, the mouse despite
          severe liver mtDNA depletion. The canine authors suggest late onset, mild or tissue-limited
          disease, or compensation, and found no MPV17 paralogue in the dog genome. If a species-specific
          compensating pathway exists, it would be a candidate therapeutic target; if instead the difference
          is metabolic stress, as the mouse ketogenic-diet result suggests, fasting and diet are the modifiers
          to study. The canine data are owner reports with no liver or muscle tissue, so a veterinary
          workup with tissue mtDNA measurement is the missing step.
      selected_evidence:
        snippet: The lack of observable phenotype could be due to a late onset, mild symptoms or potential
          tissue-specific compensatory mechanisms.
        supports: SUPPORT
