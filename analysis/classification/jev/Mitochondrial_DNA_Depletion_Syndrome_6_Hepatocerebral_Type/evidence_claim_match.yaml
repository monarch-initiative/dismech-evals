        description: A frameshift allele that lowers MPV17 transcript and yields no stable protein, comparable
          to the truncating human alleles.
        readouts:
        - name: MPV17 mRNA in blood lymphocytes
          target: MPV17 Loss of Function
          direction: DECREASED
          interpretation: About 50% of wild-type expression in two homozygous Boxers.
        - name: Truncated MPV17 protein in transduced fibroblasts
          target: MPV17 Loss of Function
          direction: ABOLISHED
          interpretation: The mutant protein is not detected, so it is presumed unstable.
      selected_evidence:
        snippet: We found a 1-bp insertion in exon 4 of the MPV17 gene, resulting in a frameshift and
          early truncation of the encoded protein.
        supports: SUPPORT
