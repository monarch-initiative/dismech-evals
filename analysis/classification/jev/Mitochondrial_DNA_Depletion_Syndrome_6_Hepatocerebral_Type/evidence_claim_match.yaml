  286ce25c42bae68f36c0eb38bee0aafa8d5ac644f17a2ad5e4d56479f0395f0b:
    claim:
      about:
        disease:
          name: Mitochondrial DNA Depletion Syndrome 6 (Hepatocerebral Type)
          disease_term:
