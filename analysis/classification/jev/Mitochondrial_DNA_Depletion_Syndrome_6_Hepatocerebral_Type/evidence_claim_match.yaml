            term:
              id: MONDO:0009747
              label: mitochondrial DNA depletion syndrome 6 (hepatocerebral type)
        context: []
      assertion_type: Treatment
      assertion:
        name: Medium-Chain Triglyceride-Based Diet
        description: Conservative dietary management with a medium-chain triglyceride (MCT)-based diet.
          In a series of four infants, the two survivors were managed this way together with vitamin,
          coenzyme Q and carnitine supplements, and were alive with their native liver and no neurological
          dysfunction at 12 and 25 months. The report is an uncontrolled case series, so it does not separate
          the effect of the diet from the supplements or from the natural course.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: medium-chain triglyceride-based diet
          term:
            id: NCIT:C15447
            label: Dietary Intervention
        notes: MCT feeding is ketogenic, and in the Mpv17 knockout mouse a ketogenic diet induces liver
          cirrhosis and failure (PMID:24247928). Neither source compares the two, so whether MCT-based
          feeding carries a hepatic risk in patients is not settled by the evidence cited here.
      selected_evidence:
        snippet: Two of the four cases died in infancy, while the other two improved on conservative management
          with medium-chain triglyceride-based diet, vitamin supplements, co-enzyme Q and carnitine.
        supports: SUPPORT
        directness: INDIRECT
