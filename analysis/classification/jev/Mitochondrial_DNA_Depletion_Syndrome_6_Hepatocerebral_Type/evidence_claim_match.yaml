      assertion_type: Discussion
      assertion:
        discussion_id: mpv17_molecular_function
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What does MPV17 move across the inner mitochondrial membrane, and how does its loss lower
          mitochondrial dGTP and dTTP?
        attaches_to:
        - pathophysiology#MPV17 Loss of Function
        - pathophysiology#Mitochondrial Deoxynucleotide Insufficiency
        rationale: The dNTP deficit and its rescue by deoxynucleosides are established, but the protein's
          own activity is not. Recombinant MPV17 forms a non-selective channel in vitro; a cell study
          links it to mitochondrial folate and thymidylate supply; the zebrafish work links it to pyrimidine
          de novo synthesis through dihydroorotate dehydrogenase. These are not mutually exclusive and
          none shows transport of a deoxynucleotide directly. The answer decides whether substrate therapy
          (deoxynucleosides, orotic acid, folate) is aimed at the right step.
      selected_evidence:
        snippet: we used electrophysiological measurements with recombinant MPV17 to reveal that this
          protein forms a non-selective channel with a pore diameter of 1.8 nm and located the channel's
          selectivity filter.
        supports: SUPPORT
