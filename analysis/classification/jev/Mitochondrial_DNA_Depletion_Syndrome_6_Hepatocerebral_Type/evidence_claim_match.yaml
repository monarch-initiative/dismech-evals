      assertion:
        target: MPV17 Loss of Function
        relationship: MEASURES
        fidelity: MODERATE
        model_scale: MOLECULAR
        description: 'Tests human missense alleles in the orthologue: all seven impaired respiratory growth
          and mtDNA stability, one destabilised the protein, and the others left it in mitochondria but
          outside the full complex.'
        limitations: Yeast Sym1 is an orthologue, and the high molecular weight complex has an unknown
          composition, so failure to assemble it is a correlate of loss of function rather than a measured
          transport defect.
      selected_evidence:
        snippet: The phenotypic analysis of the appropriate sym1 mutant strains created demonstrated deleterious
          effect for all mutations regarding OXPHOS metabolism and mtDNA stability.
        supports: SUPPORT
