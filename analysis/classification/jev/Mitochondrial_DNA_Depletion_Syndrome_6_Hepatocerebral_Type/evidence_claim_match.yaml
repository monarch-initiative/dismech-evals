            description: A naturally occurring 1-bp insertion in a guanine run in exon 4 of canine MPV17
              shifts the frame and truncates the protein. It is recurrent across unrelated breeds and
              common in Boxers (22% of 180 genotyped Boxers were homozygous). Homozygous dogs have about
              half the MPV17 mRNA in blood, and the truncated protein was not detected when expressed
              in cells. Despite this, owner-reported health records showed no enrichment of any disease
              in homozygous dogs, which were reported to live normal lives; mtDNA copy number in blood
              was inconclusive and liver and muscle were not studied.
          role: ancestor
