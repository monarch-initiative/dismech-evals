        association: Biallelic recessive pathogenic variants in TWNK (Twinkle helicase)
        notes: 'MTDPS7/IOSCA is caused by biallelic (recessive) pathogenic variants in TWNK (formerly
          C10orf2/PEO1), encoding the Twinkle mitochondrial replicative helicase. The classic Finnish
          IOSCA is caused by the homozygous founder Y508C variant; the hepatocerebral form has been reported
          with compound-heterozygous variants (e.g., A318T/Y508C). Dominant TWNK variants cause a distinct
          disorder (autosomal dominant progressive external ophthalmoplegia with multiple mtDNA deletions).
          Note: the IOSCA-specific GeneReviews chapter (PMID:20301746) has been retired and superseded
          by the active Mitochondrial DNA Maintenance Defects Overview chapter (PMID:29517884), whose
          PubMed cache contains only the overview purpose statement.

          '
        inheritance:
