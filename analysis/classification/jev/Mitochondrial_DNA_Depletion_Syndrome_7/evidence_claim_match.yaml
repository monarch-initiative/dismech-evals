      assertion:
        name: Impaired Twinkle Helicase Function and mtDNA Replication
        description: 'TWNK encodes Twinkle, the replicative helicase of the mitochondrial DNA replisome
          that unwinds double-stranded mtDNA ahead of polymerase gamma. Recessive TWNK variants (the Finnish
          founder Y508C and others) impair Twinkle function in a highly tissue- and cell-type-specific
          manner, compromising mtDNA maintenance. Unlike the dominant PEO mutations that cause multiple
          mtDNA deletions, the recessive IOSCA variant leaves mtDNA intact but reduces mtDNA copy number
          (depletion).

          '
        genes:
        - preferred_term: TWNK
          term:
            id: hgnc:1160
            label: TWNK
