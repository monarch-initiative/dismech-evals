          modifier: DECREASED
        - preferred_term: mtDNA maintenance
          term:
            id: GO:0032042
            label: mitochondrial DNA metabolic process
          modifier: ABNORMAL
        molecular_functions:
        - preferred_term: DNA helicase activity
          term:
            id: GO:0003678
            label: DNA helicase activity
          modifier: DECREASED
      selected_evidence:
        snippet: we identified two point mutations in the gene C10orf2 encoding Twinkle, a mitochondrial
          deoxyribonucleic acid (mtDNA)-specific helicase, and a rarer splice variant Twinky, underlying
          IOSCA
        supports: SUPPORT
