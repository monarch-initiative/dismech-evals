          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: The founder IOSCA mutation, homozygous in all but one of the patients, leads to a Y508C
          amino acid change in the polypeptides.
        supports: SUPPORT
