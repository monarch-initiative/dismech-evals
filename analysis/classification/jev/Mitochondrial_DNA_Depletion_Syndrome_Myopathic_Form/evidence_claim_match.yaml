              label: mitochondrial DNA depletion syndrome, myopathic form
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Skeletal muscle biopsy
        description: 'Muscle histochemistry was abnormal in every patient in whom it was performed: cytochrome
          c oxidase-deficient fibres with ragged-red fibres in three quarters, COX-deficient fibres alone
          in a further fifth, and isolated ragged-red fibres in the remainder. On routine histology there
          are atrophic and necrotic fibres, fibre-size variability with type 1 predominance, increased
          internal nuclei and replacement by fat and connective tissue, so the biopsy reads as a dystrophy
          with a mitochondrial overlay. Respiratory-chain enzyme activities were reduced in the great
          majority of biopsies.'
      selected_evidence:
        snippet: In 87.5% of the biopsies, biochemical activities of respiratory chain enzymes were reduced
          with isolated complex IV deficiency or variable defects of complexes I, III and IV.
        supports: SUPPORT
