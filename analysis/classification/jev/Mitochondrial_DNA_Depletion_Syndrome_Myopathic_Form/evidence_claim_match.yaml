      reference_title: 'mtDNA depletion myopathy: elucidation of the tissue specificity in the mitochondrial
        thymidine kinase (TK2) deficiency.'
      evidence_source: HUMAN_CLINICAL
      explanation: The human-tissue account of why skeletal muscle is the target organ.
