        description: 'The nearest laboratory mimic: a myopathy with reduced mtDNA copy number whose largest
          cohort argued it should itself be classified as an mtDNA depletion syndrome. The dismech MSTO1
          entry already lists this disease as its nosological neighbour; this is the reverse pointer.'
        distinguishing_features:
        - MSTO1 encodes a cytosolic protein acting on mitochondrial dynamics, not an enzyme of the deoxynucleoside
          salvage pathway.
        - Cerebellar atrophy with ataxia is core to MSTO1 disease and is not a feature of the myopathic
          form of TK2 deficiency.
        - MSTO1 muscle shows a dystrophic pattern with normal oxidative histochemistry and normal respiratory-chain
          activities, whereas COX-deficient and ragged-red fibres with combined respiratory-chain deficiency
          are the rule in TK2 muscle.
        - Progression in MSTO1 disease is slow or static, whereas TK2 myopathy is relentlessly progressive
          with respiratory failure.
