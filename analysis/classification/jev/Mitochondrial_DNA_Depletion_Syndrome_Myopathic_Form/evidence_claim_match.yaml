  468a1fc2021a331f9fd01008ba97e4528867d5dbdb0ccdcff35fc9bf93af7296:
    claim:
      about:
        disease:
          name: Mitochondrial DNA Depletion Syndrome, Myopathic Form
          disease_term:
            preferred_term: mitochondrial DNA depletion syndrome, myopathic form
            term:
              id: MONDO:0012301
              label: mitochondrial DNA depletion syndrome, myopathic form
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mouse
        genotype: Tk2 H126N homozygous knock-in
        background: C57BL/6-derived, generated by homologous recombination in embryonic stem cells
        publication: PMID:18467430
        description: The reference model of the disease, homologous to the human H121N allele. Homozygotes
          are normal at birth, stop gaining weight around postnatal day 10 and die of a rapidly progressive
          encephalomyelopathy at 2-3 weeks. It is the system in which the mitochondrial dNTP pool imbalance
          was measured, in which both therapies were developed, and whose organ distribution differs informatively
          from the human disease.
        genes:
        - preferred_term: TK2
          term:
            id: hgnc:11831
            label: TK2
        modeled_mechanisms:
        - target: Imbalanced Mitochondrial dNTP Pool
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: 'The pool imbalance that is asserted but not measured in patients is measured directly
            here: low dTTP in brain and reduced dTTP and dCTP in liver, with mtDNA depletion and respiratory-chain
            deficits following.'
          readouts:
          - name: Tissue dTTP and dCTP concentrations
            target: Imbalanced Mitochondrial dNTP Pool
            direction: DECREASED
            interpretation: Direct measurement of the precursor shortage that the human entry can only
              infer.
          - name: Tissue mtDNA copy number on dCMP/dTMP treatment
            target: Imbalanced Mitochondrial dNTP Pool
            direction: RESTORED
            interpretation: Supplying the missing precursors raises mtDNA again, which is the pharmacological
              test of the mechanism rather than a correlation.
        - target: Combined Respiratory Chain Deficiency
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: 'The mouse does develop deficiency of the mtDNA-dependent complexes, but the organ
            distribution is inverted relative to patients: the defect is CNS-predominant, and heart and
            skeletal muscle are largely spared by transcriptional compensation.'
          limitations: In the mouse only brain showed significant respiratory-chain deficiency, with heart
            and muscle protected, whereas the human disease is defined by a skeletal-muscle respiratory-chain
            defect with the brain usually spared. A muscle-endpoint experiment in this model therefore
            does not test the organ in which the human disease is expressed.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Mouse Tk1 down-regulates sharply in the second postnatal week and the heart compensates
              by suppressing MTERF3 to raise mitochondrial transcript levels per mtDNA copy. Neither the
              timing nor the compensatory mechanism has a demonstrated human counterpart, and it is what
              spares mouse muscle and heart.
          readouts:
          - name: Brain complex I and complex IV activities
            target: Combined Respiratory Chain Deficiency
            direction: DECREASED
            interpretation: Quantifies the biochemical defect and, by its tissue restriction, the model's
              divergence from the human organ pattern.
        - target: Central Nervous System Involvement
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The mouse develops a frank encephalomyelopathy with anterior-horn vacuolar change,
            which is the strongest available argument that human CNS features can be a primary consequence
            of neuronal mtDNA depletion rather than of hypoxia.
          limitations: In patients CNS involvement is a minority feature (16% overall) and its attribution
            is confounded by respiratory failure, whereas in the mouse it is the lethal, defining lesion.
            The model therefore over-represents the importance of the CNS phenotype relative to the human
            disease.
          readouts:
          - name: Spinal cord anterior horn histopathology
            target: Central Nervous System Involvement
            direction: ALTERED
            interpretation: A structural CNS lesion attributable to Tk2 loss alone, with no respiratory
              confounder.
      selected_evidence:
        snippet: Homozygous Tk2 mutant (Tk2(-/-)) mice developed rapidly progressive weakness after age
          10 days and died between ages 2 and 3 weeks.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18467430
      reference_title: Thymidine kinase 2 (H126N) knockin mice show the essential role of balanced deoxynucleotide
        pools for mitochondrial DNA maintenance.
      evidence_source: MODEL_ORGANISM
      explanation: The model's phenotype and timeline.
