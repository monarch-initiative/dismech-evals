        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Post-Mitotic Dependence on Mitochondrial Salvage
        biological_scale: CELLULAR
        description: TK2 is ubiquitously expressed, yet the disease is predominantly a myopathy. Two non-exclusive
          explanations are supported. In proliferating cells the cytosolic, cell-cycle-regulated kinases
          TK1 and dCK, together with de novo synthesis, supply enough deoxynucleotide to mask the defect;
          when TK1 activity falls in post-mitotic tissue the TK2 deficiency is unmasked, which in the
          mouse coincides exactly with the onset of mtDNA depletion. Independently, human tissue work
          found muscle to combine low basal TK2 activity with a high demand for mtDNA-encoded proteins.
        cell_types:
        - preferred_term: skeletal muscle fibre
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: Our results suggest that low basal TK2 activity combined with a high requirement for
          mitochondrial encoded proteins in muscle predispose this tissue to the devastating effect of
          TK2 deficiency.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
