          preferred_term: TK2
          term:
            id: hgnc:11831
            label: TK2
        features: 'Biallelic TK2 variants are the cause of the myopathic form of mtDNA depletion syndrome.
          Pathogenic variants have been found in every exon and no clear genotype-phenotype correlation
          emerges: p.Thr108Met homozygotes in one cohort spanned all three clinical forms, and residual
          enzyme activity in patient fibroblasts did not track severity. Two regions are recurrent, the
          substrate-binding site encoded by exon 5 and the active site in exon 8.'
        notes: ClinGen has not published a Gene-Disease Validity assertion for TK2, so no gene_disease_validity
          tier is recorded here; `just clingen-list` returns no TK2 assertion as of 2026-09-29.
        case_fractions:
        - population: Spanish late-onset TK2 deficiency cases
          case_fraction_percent: 46.9
          cohort_size: 53
          notes: Share of Spanish late-onset patients carrying the founder in-frame deletion p.Lys202del.
            This is an allele share within a founder population, not a population prevalence.
      selected_evidence:
        snippet: The substrate binding site (encoded by exon 5) and active site (exon 8) are hotspots
          for the mutations.
        supports: SUPPORT
