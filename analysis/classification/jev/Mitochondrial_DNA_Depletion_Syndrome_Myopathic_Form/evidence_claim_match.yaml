        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Pyrimidine Deoxynucleoside Salvage Failure
        biological_scale: MOLECULAR
        description: TK2 phosphorylates deoxythymidine, deoxycytidine and deoxyuridine to their monophosphates
          inside the mitochondrial matrix; these are then phosphorylated onward to the pyrimidine deoxynucleoside
          triphosphates used by the mtDNA replisome. The inner membrane is impermeable to charged nucleotides
          and mitochondria have no de novo synthesis pathway of their own, so in cells that are not dividing
          this salvage route is the principal supply.
        biological_processes:
        - preferred_term: pyrimidine deoxyribonucleoside salvage
          term:
            id: GO:0043099
            label: pyrimidine deoxyribonucleoside salvage
          modifier: DECREASED
        - preferred_term: deoxyribonucleoside triphosphate biosynthetic process
          term:
            id: GO:0009202
            label: deoxyribonucleoside triphosphate biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: Human dGK efficiently phosphorylates deoxyguanosine and deoxyadenosine, whereas TK2 phosphorylates
          deoxythymidine, deoxycytidine and deoxyuridine.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
