  b84840337bb1790ddfd98b04826d5b7cc97e996483f89949c1c42954fbeea429:
    claim:
      about:
        disease:
          name: Mitochondrial DNA Depletion Syndrome, Myopathic Form
          disease_term:
            preferred_term: mitochondrial DNA depletion syndrome, myopathic form
            term:
              id: MONDO:0012301
              label: mitochondrial DNA depletion syndrome, myopathic form
        context: []
      assertion_type: Treatment
      assertion:
        name: Deoxycytidine and Deoxythymidine Substitution
        description: 'Oral deoxycytidine plus deoxythymidine -- given the pharmaceutical names doxecitine
          and doxribtimine and marketed as KYGEVVI -- the substrate-enhancement therapy that is the major
          therapeutic development in this disease, and since 3 November 2025 the first approved treatment
          for TK2 deficiency in the USA, where the licensed indication is restricted to symptom onset
          on or before age 12. The rationale is that raising the concentration of TK2''s own substrates
          lets residual enzyme, and the cytosolic kinases, deliver enough pyrimidine deoxynucleotide for
          mtDNA replication. It was established in the Tk2 H126N knock-in mouse, where dC+dT delayed onset,
          extended lifespan and restored mtDNA copy number and respiratory-chain activity, and then given
          to 16 patients under expanded access. In that open-label cohort three of eight non-ambulatory
          patients regained walking, four of five discontinued feeding-tube use, and one of nine came
          off mechanical ventilation. Doses are 300-400 mg/kg/day of each nucleoside, titrated against
          stool frequency; dose-dependent diarrhoea occurred in half the patients and two of a separate
          group of twelve developed reversible transaminase elevation. The approval rested on pooled retrospective
          and single-arm data rather than a randomised comparison, and that data set is what draws the
          age limit: mortality was 4% in treated against 57% in untreated patients with onset at or before
          12 years, but in later-onset patients the difference, 18% against 24%, was not significant.
          A 2022 review, written before the filing, still described the supporting trials as ongoing.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: doxecitine (deoxycytidine)
            term:
              id: CHEBI:15698
              label: 2'-deoxycytidine
          - preferred_term: doxribtimine (deoxythymidine)
            term:
              id: CHEBI:17748
              label: thymidine
      selected_evidence:
        snippet: In patients aged > 12 years at symptom onset, death occurred in 18% of treated patients
          and 24% of untreated patients
        supports: SUPPORT
