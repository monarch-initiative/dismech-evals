        biological_scale: MOLECULAR
        description: 'Biallelic TK2 variants reduce or abolish thymidine kinase 2, the mitochondrial matrix
          deoxyribonucleoside kinase. Missense, in-frame deletion, splice and frameshift alleles are all
          reported, and residual activity measured in patient-derived fibroblasts spans 1-39% of control
          without tracking clinical severity, so the genotype does not by itself predict the form of disease.
          Recombinant work on the two original alleles shows two distinct kinetic lesions: I212N is essentially
          inactive, whereas H121N retains normal substrate affinity but loses catalytic efficiency through
          a raised Km for ATP.'
        genes:
        - preferred_term: TK2
          term:
            id: hgnc:11831
