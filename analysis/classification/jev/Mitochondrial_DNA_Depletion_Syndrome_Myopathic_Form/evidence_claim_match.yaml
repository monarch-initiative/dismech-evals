      assertion:
        name: Mitochondrial DNA depletion syndrome 3 (hepatocerebral type)
        disease_term:
          preferred_term: mitochondrial DNA depletion syndrome 3 (hepatocerebral type)
          term:
            id: MONDO:0009636
            label: mitochondrial DNA depletion syndrome 3 (hepatocerebral type)
        description: 'The purine mirror image of this disease, and the closest mechanistic relative in
          the knowledge base. DGUOK encodes deoxyguanosine kinase, the other mitochondrial deoxyribonucleoside
          kinase: between them, dGK and TK2 phosphorylate all four deoxynucleosides. Loss of either impairs
          the same salvage pathway and produces mtDNA depletion, so the biochemistry is shared and the
          separation is by substrate arm and target organ.'
        distinguishing_features:
        - DGUOK phosphorylates the purine deoxynucleosides deoxyguanosine and deoxyadenosine; TK2 phosphorylates
          the pyrimidines deoxythymidine, deoxycytidine and deoxyuridine.
        - DGUOK deficiency is liver-predominant with cholestatic liver failure, nystagmus and developmental
          delay; TK2 deficiency is skeletal-muscle-predominant and the liver is spared.
        - In the original TK2 series, liver, brain, heart and skin remained unaffected throughout life,
          which is the tissue distinction rather than a severity one.
        - Nucleoside substitution is established for TK2 deficiency; for DGUOK deficiency the intervention
          that changes survival is liver transplantation.
      selected_evidence:
        snippet: Other tissues such as liver, brain, heart, and skin remain unaffected throughout the
          patients' life.
        supports: SUPPORT
