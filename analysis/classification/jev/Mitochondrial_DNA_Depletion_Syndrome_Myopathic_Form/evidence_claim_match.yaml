            label: mitochondrial neurogastrointestinal encephalomyopathy
        description: 'The other pyrimidine-pool mtDNA maintenance disorder. TYMP encodes thymidine phosphorylase,
          which catabolises the same nucleosides TK2 phosphorylates, so the two diseases sit on opposite
          sides of one metabolic balance: TK2 deficiency depletes the pool and MNGIE floods it with thymidine
          and deoxyuridine. Both cause mtDNA depletion, multiple deletions and a mitochondrial myopathy
          with ptosis and ophthalmoparesis.'
        distinguishing_features:
