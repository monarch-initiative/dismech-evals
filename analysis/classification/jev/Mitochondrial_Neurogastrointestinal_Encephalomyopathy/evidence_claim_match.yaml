        name: Erythrocyte-encapsulated thymidine phosphorylase (EE-TP)
        description: EE-TP is an experimental enzyme-replacement therapy in which the patient's autologous
          erythrocytes are loaded ex vivo with E. coli thymidine phosphorylase; circulating loaded red
          cells metabolize thymidine and deoxyuridine taken up via the equilibrative nucleoside transporter
          ENT1. In a three-patient compassionate-use study, EE-TP was well tolerated and reduced plasma
          thymidine and deoxyuridine in all patients, with clinical improvement in two. There are no approved
          therapies for MNGIE; a planned phase 2 trial (NCT03866954) was withdrawn before enrollment.
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: enzyme replacement or supplementation therapy
          term:
            id: NCIT:C16221
            label: Protein Replacement Therapy
      selected_evidence:
        snippet: EE-TP was well tolerated and reductions in the disease-associated plasma metabolites,
          thymidine, and deoxyuridine were observed in all three patients. Clinical improvements, including
          weight gain and improved disease scores, were observed in two patients
        supports: SUPPORT
