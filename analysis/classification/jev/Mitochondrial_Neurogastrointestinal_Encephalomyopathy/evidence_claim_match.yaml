        name: Allogeneic hematopoietic stem cell transplantation
        description: Allogeneic HSCT replaces deficient thymidine phosphorylase via donor-derived hematopoietic
          cells, restoring TP enzyme activity and lowering circulating thymidine and deoxyuridine. In
          an international retrospective cohort, TP activity rose from undetectable to normal in all survivors
          and long-term engrafted patients showed clinical improvement, but transplant-related mortality
          is high, so it is reserved for selected patients with an optimal donor and is most beneficial
          before advanced irreversible damage.
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: allogeneic hematopoietic stem cell transplantation
          term:
            id: NCIT:C46089
            label: Allogeneic Hematopoietic Stem Cell Transplantation
      selected_evidence:
        snippet: Allogeneic haematopoietic stem cell transplantation can restore thymidine phosphorylase
          enzyme function in patients with mitochondrial neurogastrointestinal encephalomyopathy and improve
          clinical manifestations of mitochondrial neurogastrointestinal encephalomyopathy in the long
          term.
        supports: SUPPORT
