          cells, restoring TP enzyme activity and lowering circulating thymidine and deoxyuridine. In
          an international retrospective cohort, TP activity rose from undetectable to normal in all survivors
          and long-term engrafted patients showed clinical improvement, but transplant-related mortality
          is high, so it is reserved for selected patients with an optimal donor and is most beneficial
          before advanced irreversible damage.
        therapeutic_modality: CELL_THERAPY
        treatment_term:
