        name: Liver transplantation
        description: Because the liver is a major systemic source of thymidine phosphorylase, orthotopic
          liver transplantation supplies TP and lowers toxic plasma nucleosides. In a series of four additional
          patients, plasma thymidine nearly normalized in all and symptoms stabilized, with a more favorable
          safety profile than HSCT, especially when liver disease is already present.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: liver transplantation
          term:
            id: NCIT:C15271
            label: Liver Transplantation
      selected_evidence:
        snippet: Following LT, thymidine levels nearly normalized in all four patients and remained low
          for the duration of follow-up. Disease symptoms stabilized in all patients, with some manifesting
          improvements, including intestinal function. No patient died, and LT appeared to have a more
          favorable safety profile than HSCT
        supports: SUPPORT
