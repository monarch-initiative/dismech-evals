      assertion:
        name: Classic MNGIE
        display_name: Classic TYMP-related MNGIE (MTDPS1)
        description: The defining form of MNGIE, caused by biallelic loss-of-function variants in TYMP
          with thymidine phosphorylase deficiency and systemic accumulation of thymidine and 2'-deoxyuridine.
          Presents with the classic constellation of gastrointestinal dysmotility, cachexia, ptosis/ophthalmoplegia,
          peripheral neuropathy, and leukoencephalopathy.
      selected_evidence:
        snippet: Examination of 12 MNGIE probands revealed homozygous or compound-heterozygous mutations
          in the gene specifying thymidine phosphorylase (TP), located on chromosome 22q13.32-qter.
        supports: SUPPORT
