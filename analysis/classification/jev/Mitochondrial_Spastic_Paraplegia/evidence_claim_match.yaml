  a1b4e93c98b79cff84f2ddffbf2491f65346088166eef7300d8989ce7e853619:
    claim:
      about:
        disease:
          name: Mitochondrial Spastic Paraplegia
          disease_term:
            preferred_term: mitochondrial spastic paraplegia
            term:
              id: MONDO:0975951
              label: spastic paraplegia, mitochondrial
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Homoplasmic MT-TV m.1661A>G Variant
        biological_scale: MOLECULAR
        conforms_to: mitochondrial_dysfunction#Mitochondrial Damage and mtDNA Mutation
        description: 'MT-TV encodes the mitochondrial transfer RNA for valine, one of the 22 tRNAs the
          mitochondrial genome supplies for translating its own thirteen protein-coding genes. The reported
          variant, m.1661A>G, is homoplasmic - present in every copy of the mitochondrial genome that
          was sampled - rather than heteroplasmic, which is the usual state for a pathogenic mt-tRNA variant.

          What the variant does to tRNA-Val was not measured. No aminoacylation assay, steady-state tRNA
          measurement or mitochondrial translation assay is reported, so the step from variant to translational
          defect is a gap rather than a link in this entry: no causal edge below this node runs through
          a translational defect. The reduced-copy-number node further down does bind mitochondrial translation
          with a DECREASED modifier, but as an expected consequence of having fewer genomes to translate
          from rather than as a claim about what the variant does to the tRNA. That node''s notes say
          so.'
        genes:
        - preferred_term: MT-TV
          term:
            id: hgnc:7500
            label: MT-TV
        genetic_context:
          genes:
          - preferred_term: MT-TV
            term:
              id: hgnc:7500
              label: MT-TV
          allele_type: homoplasmic mitochondrial tRNA point variant m.1661A>G
          variant_origin: GERMLINE
          description: The zygosity slot is deliberately left empty. ZygosityEnum offers heterozygous,
            compound heterozygous, homozygous and hemizygous, none of which describes a mitochondrial
            genome present in hundreds of copies per cell. The relevant quantity is homoplasmy versus
            heteroplasmy, and it is recorded in allele_type and in the node description instead of being
            forced into a nuclear-genetics vocabulary.
          notes: functional_impact_category is also left empty. The published support is segregation and
            rarity, not a measured consequence for tRNA-Val function, and choosing LOSS_OF_FUNCTION would
            assert a mechanism nobody has demonstrated for this allele.
      selected_evidence:
        snippet: We found a homoplasmic MT-TV (mitochondrial tRNAVal) mutation, m.1661A > G, present in
          all affected individuals across four generations of a family with complex HSP.
        supports: SUPPORT
