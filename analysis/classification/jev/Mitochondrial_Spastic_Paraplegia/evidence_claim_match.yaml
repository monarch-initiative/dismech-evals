            preferred_term: mitochondrial spastic paraplegia
            term:
              id: MONDO:0975951
              label: spastic paraplegia, mitochondrial
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Earlier onset and greater severity in successive generations
        notes: 'The one longitudinal observation in the entity, and it is across generations rather than
          within a patient. Fourth-generation affected individuals had earlier onset and more severe symptoms
          than their forebears. The authors label this presumptive anticipation and offer decreasing mtDNA
          copy number as the mechanism.

          Two reasons to hold this loosely. Apparent anticipation in a pedigree is a classic ascertainment
          artefact - later generations are examined earlier in life and with more awareness of the family
          diagnosis - and the abstract reports no correction for it. And the copy-number explanation is
          offered as a possibility by the authors themselves, in the same sentence.'
      selected_evidence:
        snippet: Fourth-generation affected individuals displayed earlier onset, likely due to presumptive
          anticipation, and greater symptom severity, potentially caused by decreased mitochondrial DNA
          (mtDNA) copy number.
        supports: SUPPORT
