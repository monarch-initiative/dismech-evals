  739d841f500a814994aeee2311c1ae542c1f6b8d0cc25b32490e4764b624abcf:
    claim:
      about:
        disease:
          name: Mitochondrial Spastic Paraplegia
          disease_term:
            preferred_term: mitochondrial spastic paraplegia
            term:
              id: MONDO:0975951
              label: spastic paraplegia, mitochondrial
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Mitochondrial DNA Copy Number
        biological_scale: CELLULAR
        conforms_to: mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress
        description: 'Fewer copies of the mitochondrial genome per cell. This is the node that carries
          the entity''s explanatory weight, because it is what the authors use to account for variation
          within the family: the fourth generation has the lowest copy number, the earliest onset and
          the most severe disease.

          The conformance to the mitochondrial dysfunction module''s bioenergetic node follows the precedent
          of the mtDNA depletion entries in this knowledge base. It should be read as placing this entity
          in that family of mechanisms, not as a claim that oxidative phosphorylation was measured here
          - it was not. No respiratory chain assay, ATP measurement or oxidative stress marker is reported
          for this family.'
        biological_processes:
        - preferred_term: mitochondrial DNA metabolic process
          modifier: DECREASED
          term:
            id: GO:0032042
            label: mitochondrial DNA metabolic process
        - preferred_term: mitochondrial translation
          modifier: DECREASED
          term:
            id: GO:0032543
            label: mitochondrial translation
        notes: 'Both process modifiers on this node are inferences from the measured copy number, not
          measurements, and neither should be read as a second lesion.

          Mitochondrial translation is bound DECREASED as the expected consequence of having fewer mitochondrial
          genomes to transcribe and translate from. No translation assay is reported for this family.

          The mtDNA process is bound to GO:0032042 mitochondrial DNA metabolic process rather than to
          GO:0006264 mitochondrial DNA replication, and the distinction is load-bearing here. The entry''s
          causal model is increased removal of mitochondrial genomes through mitophagy, so binding decreased
          replication would assert an independent lesion in mtDNA synthesis that the pathograph never
          places and the paper never observed. It would also cut across a principled split already present
          in the corpus: GO:0006264 is used where the lesion is in the replication machinery itself (POLG,
          TWNK, TYMP entries), and GO:0032042 where a depletion has no replication lesion behind it (Pearson
          syndrome, Kearns-Sayre syndrome, Behr syndrome). MT-TV is a tRNA gene; there is no replication
          machinery in this causal story.'
      selected_evidence:
        snippet: Fourth-generation affected individuals displayed earlier onset, likely due to presumptive
          anticipation, and greater symptom severity, potentially caused by decreased mitochondrial DNA
          (mtDNA) copy number.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
