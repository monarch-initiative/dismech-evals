      assertion:
        name: Myelin and Mitochondrial Ultrastructural Abnormality in Peripheral Nerve
        biological_scale: TISSUE
        description: 'Peroneal nerve biopsy in the affected family showed ultrastructural abnormalities
          of both myelin and mitochondria. This is the only tissue-level observation in the entity and
          the only direct evidence that the mitochondrial lesion reaches a nerve.

          It is also the evidence that SPGM is a complex rather than a pure spastic paraplegia: a peripheral
          nerve abnormality is outside the corticospinal tract. What the abstract does not give is any
          clinical neurophysiology, so whether the affected individuals have a clinically manifest neuropathy,
          and of what kind, is not recorded here.'
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        cellular_components:
