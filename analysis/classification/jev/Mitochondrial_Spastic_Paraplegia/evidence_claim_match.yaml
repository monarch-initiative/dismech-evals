            term:
              id: MONDO:0975951
              label: spastic paraplegia, mitochondrial
        context: []
      assertion_type: Inheritance
      assertion:
        name: Mitochondrial inheritance
        description: 'The variant is in the mitochondrial genome, so transmission is matrilineal: every
          child of an affected woman inherits it and no child of an affected man does. In the reported
          family the variant is present in all affected individuals across four generations. Because it
          is homoplasmic there is no heteroplasmy bottleneck to make transmission probabilistic, which
          is a recurrence-risk statement quite unlike that of the nuclear-gene spastic paraplegias.'
        inheritance_term:
          preferred_term: Mitochondrial inheritance
          term:
            id: HP:0001427
            label: Mitochondrial inheritance
      selected_evidence:
        snippet: We found a homoplasmic MT-TV (mitochondrial tRNAVal) mutation, m.1661A > G, present in
          all affected individuals across four generations of a family with complex HSP.
        supports: SUPPORT
