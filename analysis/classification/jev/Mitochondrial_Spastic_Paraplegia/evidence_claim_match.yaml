  1af44500c2c633daac2935eb7c3590423d7a44a6a2652c948f11e40d2c68bba7:
    claim:
      about:
        disease:
          name: Mitochondrial Spastic Paraplegia
          disease_term:
            preferred_term: mitochondrial spastic paraplegia
            term:
              id: MONDO:0975951
              label: spastic paraplegia, mitochondrial
        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counselling for Mitochondrial Inheritance
        description: 'The counselling here is not the counselling for a nuclear recessive or dominant
          spastic paraplegia, which is why it is curated rather than assumed. Transmission is matrilineal:
          an affected or carrier woman passes the variant to all of her children, an affected man to none
          of his. Because the variant is homoplasmic there is no heteroplasmy bottleneck, so the usual
          mitochondrial hedge about unpredictable transmitted load does not apply, and by the same token
          the reproductive options that work by selecting for low mutant load - preimplantation genetic
          testing in particular - have nothing to select on.

          Counselling does not act on the mechanism. It is curated because it is the only intervention
          the genotype itself indicates, and because getting the inheritance pattern wrong in a spastic
          paraplegia family has direct consequences for who is offered testing.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        notes: No treatment is reported for any member of the family. Symptomatic management of spasticity
          - baclofen, tizanidine, botulinum toxin, physiotherapy - is standard for hereditary spastic
          paraplegia and is curated on the parent Hereditary Spastic Paraplegia entry, where it belongs;
          it is not repeated here, because nothing in the source records what these patients received
          and duplicating the parent's treatment list would assert otherwise.
      selected_evidence:
        snippet: We found a homoplasmic MT-TV (mitochondrial tRNAVal) mutation, m.1661A > G, present in
          all affected individuals across four generations of a family with complex HSP.
        supports: SUPPORT
