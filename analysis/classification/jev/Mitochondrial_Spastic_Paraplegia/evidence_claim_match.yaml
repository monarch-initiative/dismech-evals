        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Length-Dependent Degeneration of Corticospinal Axons
        biological_scale: CELLULAR
        conforms_to: corticospinal_tract_axonopathy#Distal Length-Dependent Degeneration of Long CNS Axons
        description: 'The convergence point shared with every other hereditary spastic paraplegia: the
          corticospinal axons running from motor cortex to lumbosacral cord degenerate from their distal
          ends, because a supply failure bites hardest where the supply line is longest. Mitochondria
          are among the things those axons must transport furthest, which is why mitochondrial lesions
          - SPG7 and SPG13 among the nuclear ones - recur as causes of this syndrome.

          This node is inferred for SPGM, not observed. No central nervous system tissue, imaging or electrophysiology
          is reported for this family; what is reported is the clinical syndrome of complex HSP, and the
          node is here because it is the mechanism that syndrome names. It conforms to the corticospinal
          tract axonopathy module for the same reason, and the conformance should be read as a claim about
          which final common pathway this entity joins, not as a claim that the degeneration was demonstrated.'
        cell_types:
        - preferred_term: upper motor neuron
          term:
            id: CL:0008048
            label: upper motor neuron
        locations:
        - preferred_term: corticospinal tract
          term:
            id: UBERON:0002707
            label: corticospinal tract
      selected_evidence:
        snippet: Hereditary spastic paraplegia (HSP) is characterized by progressive lower limb weakness
          and spasticity, with unknown genetic cause in many cases.
        supports: SUPPORT
        directness: INDIRECT
