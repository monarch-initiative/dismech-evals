            term:
              id: MONDO:0975951
              label: spastic paraplegia, mitochondrial
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Upregulation of Mitochondrial Autophagy Gene Expression
        biological_scale: MOLECULAR
        description: 'Transcriptome sequencing of the affected family showed mitochondrial autophagy genes
          expressed above normal. The authors offer this as the mechanism by which the MT-TV variant depletes
          mitochondrial genomes: more mitophagy, fewer mitochondria, fewer copies of mtDNA.

          Two caveats belong on this node. The measurement is transcript abundance, not mitophagic flux,
          and upregulated transcription of autophagy genes is as consistent with a compensatory response
          to damaged mitochondria as with a primary driver of their removal. The direction of causation
          between this node and the next is therefore the paper''s interpretation, and the paper itself
          words it as a suggestion.'
        biological_processes:
        - preferred_term: mitophagy
          modifier: INCREASED
          term:
            id: GO:0000423
            label: mitophagy
        cellular_components:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
      selected_evidence:
        snippet: Upregulation of mitochondrial autophagy genes in these patients suggested that MT-TV
          mutations could lead to reduced mtDNA copy number.
        supports: SUPPORT
