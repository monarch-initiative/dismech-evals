            label: MT-TV
        features: 'MT-TV is the mitochondrially encoded transfer RNA for valine. The SPGM variant is m.1661A>G,
          homoplasmic in all affected members of the one reported family. MT-TV is an established disease
          locus in its own right: other variants in it cause mitochondrial cardiomyopathy with neurological
          features (m.1628C>T, m.1644G>A) and Leigh-like disease at high mutant load.'
        notes: 'No causal gene is recorded in MONDO for MONDO:0975951, and NCBI mim2gene_medgen maps OMIM:500018
          to GeneID `-` with no GeneMap source. That blank is not the same signal it was for the gene-less
          DFNB loci: OMIM''s 5-series is its mitochondrial-DNA phenotype series, and those entries are
          not gene-mapped through the nuclear GeneMap that mim2gene_medgen reads. The gene is named unambiguously
          in the defining paper and in the OMIM entry title, so the identity is not in doubt; what the
          blank reflects is the file''s scope, not a missing answer. A curator repeating the mapped-locus
          test on this concept should read it that way.'
      selected_evidence:
        snippet: The rare MT-TV m.1661A > G mutation is associated with HSP.
        supports: SUPPORT
