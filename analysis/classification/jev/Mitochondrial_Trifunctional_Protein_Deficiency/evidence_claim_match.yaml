  53f0ee42a6bec8cac165d1002e45a7b6b7a3bd5e7f475c68eab8dbf0d176887c:
    claim:
      about:
        disease:
          name: Mitochondrial Trifunctional Protein Deficiency
          disease_term:
            preferred_term: mitochondrial trifunctional protein deficiency
            term:
              id: MONDO:0012172
              label: mitochondrial trifunctional protein deficiency
        context:
        - path: /has_subtypes/3
          value:
            name: Isolated LCKAT deficiency
            display_name: Isolated long-chain 3-ketoacyl-CoA thiolase (LCKAT) deficiency
            description: 'Biochemically restricted HADHB-related form in which the long-chain 3-ketoacyl-CoA
              thiolase activity of the trifunctional protein (variously abbreviated LCKAT or LCTH) is
              severely reduced while the HADHA-encoded LCHAD activity measured in the same sample is normal.
              It is the third recognised biochemical phenotype of the MTP complex, alongside isolated
              LCHAD deficiency and generalised MTP deficiency with loss of all three activities, and was
              first reported in 2006. Newborn-screening acylcarnitine profiles do not discriminate it
              from isolated LCHAD or complete MTP deficiency, so the diagnosis rests on assaying the LCKAT
              and LCHAD activities separately. Clinically it has presented uniformly as neonatal-onset
              cardiomyopathy with lactic acidosis, and all four patients reported through 2022 died in
              infancy or early childhood.

              '
            mappings:
              mondo_mappings:
              - term:
                  id: MONDO:0958185
                  label: mitochondrial trifunctional protein deficiency 2
                mapping_predicate: skos:broadMatch
                mapping_source: MONDO
                mapping_justification: 'MONDO:0958185 is the HADHB-specific (RO:0004003 HGNC:4803) child
                  of the MONDO:0012172 anchor of this entry and is the closest available term. It covers
                  all HADHB-related trifunctional protein deficiency, including the complete form, whereas
                  this subtype is the narrower biochemical phenotype in which only the LCKAT activity
                  is lost. MONDO has no term for the isolated-LCKAT phenotype, so the mapping is deliberately
                  broad rather than exact and does not retire the concept from the curation queue.

                  '
            genes:
            - preferred_term: HADHB
              term:
                id: hgnc:4803
                label: HADHB
          role: subtype
      assertion_type: Biochemical
      assertion:
        name: Long-chain 3-ketoacyl-CoA thiolase (LCKAT) enzyme activity with preserved LCHAD activity
        subtype: Isolated LCKAT deficiency
        presence: DECREASED
        context: 'The paired enzyme assay is what defines this subtype: LCKAT activity is severely reduced
          (4% of normal in the index case) while LCHAD activity measured in the same lymphocyte or fibroblast
          sample falls within the reference range. This is the only test that separates isolated LCKAT
          deficiency from generalized MTP deficiency, because the acylcarnitine screening profile the
          two produce is the same. An LCKAT-only assay, or an acylcarnitine profile alone, cannot make
          the distinction.

          '
        readouts:
        - target: HADHA/HADHB molecular function deficiency in mitochondrial trifunctional protein
          relationship: READOUT_OF
          direction: NEGATIVE
          endpoint_context: DIAGNOSTIC
          interpretation: Selective loss of the HADHB-encoded LCKAT activity with an intact HADHA-encoded
            LCHAD activity reports a molecular lesion restricted to one catalytic function of the MTP
            complex.
      selected_evidence:
        snippet: Enzyme investigations revealed very low LCTH (4% of normal) and normal LCHAD activities,
          whereas molecular analysis showed compound heterozygosity for 185G > A (R62H) and 1292T > C
          (F431S) mutations in the HADHB gene.
        supports: SUPPORT
