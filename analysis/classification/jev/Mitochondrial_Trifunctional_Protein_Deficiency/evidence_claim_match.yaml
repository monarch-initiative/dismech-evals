  c2e175d45c9f8ad7766f89ceea3f0a0b2a4ee8bf885eee8edee0a9c0d508e69b:
    claim:
      about:
        disease:
          name: Mitochondrial Trifunctional Protein Deficiency
          disease_term:
            preferred_term: mitochondrial trifunctional protein deficiency
            term:
              id: MONDO:0012172
              label: mitochondrial trifunctional protein deficiency
        context:
        - path: /has_subtypes/3
          value:
            name: Isolated LCKAT deficiency
            display_name: Isolated long-chain 3-ketoacyl-CoA thiolase (LCKAT) deficiency
            description: 'Biochemically restricted HADHB-related form in which the long-chain 3-ketoacyl-CoA
              thiolase activity of the trifunctional protein (variously abbreviated LCKAT or LCTH) is
              severely reduced while the HADHA-encoded LCHAD activity measured in the same sample is normal.
              It is the third recognised biochemical phenotype of the MTP complex, alongside isolated
              LCHAD deficiency and generalised MTP deficiency with loss of all three activities, and was
              first reported in 2006. Newborn-screening acylcarnitine profiles do not discriminate it
              from isolated LCHAD or complete MTP deficiency, so the diagnosis rests on assaying the LCKAT
              and LCHAD activities separately. Clinically it has presented uniformly as neonatal-onset
              cardiomyopathy with lactic acidosis, and all four patients reported through 2022 died in
              infancy or early childhood.

              '
            mappings:
              mondo_mappings:
              - term:
                  id: MONDO:0958185
                  label: mitochondrial trifunctional protein deficiency 2
                mapping_predicate: skos:broadMatch
                mapping_source: MONDO
                mapping_justification: 'MONDO:0958185 is the HADHB-specific (RO:0004003 HGNC:4803) child
                  of the MONDO:0012172 anchor of this entry and is the closest available term. It covers
                  all HADHB-related trifunctional protein deficiency, including the complete form, whereas
                  this subtype is the narrower biochemical phenotype in which only the LCKAT activity
                  is lost. MONDO has no term for the isolated-LCKAT phenotype, so the mapping is deliberately
                  broad rather than exact and does not retire the concept from the curation queue.

                  '
            genes:
            - preferred_term: HADHB
              term:
                id: hgnc:4803
                label: HADHB
          role: subtype
      assertion_type: Genetic
      assertion:
        name: HADHB variants associated with isolated LCKAT deficiency
        subtype: Isolated LCKAT deficiency
        gene_term:
          preferred_term: HADHB
          term:
            id: hgnc:4803
            label: HADHB
        association: Pathogenic Variants
        variants:
        - name: HADHB c.185G>A (p.Arg62His)
          description: 'Missense variant reported in compound heterozygosity in both genotyped patients
            with an isolated LCKAT biochemical phenotype, and also in a third patient in trans with a
            different second allele.

            '
          gene:
            preferred_term: HADHB
            term:
              id: hgnc:4803
              label: HADHB
        - name: HADHB c.1292T>C (p.Phe431Ser)
          description: 'Missense variant reported in trans with c.185G>A in both genotyped patients with
            an isolated LCKAT biochemical phenotype.

            '
          gene:
            preferred_term: HADHB
            term:
              id: hgnc:4803
              label: HADHB
        features: 'What makes an HADHB genotype spare LCHAD activity rather than abolishing all three
          MTP functions is not established. The observation is currently carried by one recurrent allele
          pair: the index case (2006) and the fourth reported case (2022) are compound heterozygous for
          the same c.185G>A (p.Arg62His) and c.1292T>C (p.Phe431Ser) variants. Two patients sharing a
          genotype is a genotype-phenotype hypothesis, not a demonstrated rule, and one further reported
          patient had no identified mutation at all, so the isolated-LCKAT phenotype should not be treated
          as predictable from HADHB genotype.

          '
        notes: 'Recorded as a distinct genetic block rather than folded into the general HADHB block above,
          because the claim being made is narrower: these alleles are associated with selective loss of
          the LCKAT activity, whereas HADHB variants generally cause complete TFP deficiency.

          '
      selected_evidence:
        snippet: The HADHB gene encodes long-chain ketoacyl-CoA thiolase (LCTH) activity, whereas the
          HADHA gene contains the information for the long-chain enoyl-CoA hydratase and long-chain 3-hydroxyacyl-CoA
          dehydrogenase (LCHAD) functions.
        supports: SUPPORT
    origin:
