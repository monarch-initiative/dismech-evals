          name: Mitochondrial Trifunctional Protein Deficiency
          disease_term:
            preferred_term: mitochondrial trifunctional protein deficiency
            term:
              id: MONDO:0012172
              label: mitochondrial trifunctional protein deficiency
        context: []
      assertion_type: ProgressionInfo
      assertion:
        notes: 'Disease progression varies by clinical subtype. Severe neonatal-onset forms present within
          the first days to weeks of life with multiorgan failure and high mortality. Intermediate forms
          present in infancy or early childhood with hepatic and cardiac involvement. Late-onset or mild
          forms manifest in childhood or adulthood with progressive peripheral neuropathy and episodic
          rhabdomyolysis. Retinopathy, rhabdomyolysis, and peripheral neuropathy tend to present later
          in childhood, while cardiomyopathy and hypoglycemia can present across a wide age spectrum.

          '
      selected_evidence:
        snippet: retinopathy, rhabdomyolysis and peripheral neuropathy tended to present later in childhood,
          many features including initial report of cardiomyopathy and hypoglycemia presented across a
          wide age spectrum.
        supports: SUPPORT
    origin:
