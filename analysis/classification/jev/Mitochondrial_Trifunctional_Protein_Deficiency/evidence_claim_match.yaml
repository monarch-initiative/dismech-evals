              label: mitochondrial trifunctional protein deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Ketone body therapy with sodium-D,L-3-hydroxybutyrate
        description: 'Enteral sodium-D,L-3-hydroxybutyrate supplies a ketone body directly, providing
          heart, brain and skeletal muscle with an energy substrate that does not require the blocked
          long-chain beta-oxidation steps. It was given alongside an LCT-restricted, MCT-supplemented
          formula to the fourth reported patient with isolated LCKAT deficiency, and was followed by improved
          acylcarnitine profiles and improved cardiac function on speckle-tracking echocardiography. The
          evidence is a single treated patient with no control or blinding, and the comparison is against
          historical cases, so this is an experimental option rather than an established therapy; the
          authors themselves put the survival benefit no higher than "may have contributed".

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: nutritional supplementation
          term:
            id: NCIT:C15433
            label: Nutritional Support
          therapeutic_agent:
          - preferred_term: sodium D,L-3-hydroxybutyrate
            term:
              id: CHEBI:20067
              label: 3-hydroxybutyric acid
        target_phenotypes:
        - preferred_term: Cardiomyopathy
          term:
            id: HP:0001638
            label: Cardiomyopathy
        notes: 'Curated at the level the source supports. Resveratrol was considered for the same patient
          as an alternative way to raise fatty acid oxidation, but showed no benefit in that patient''s
          fibroblasts in vitro and is deliberately not curated here as a treatment.

          '
      selected_evidence:
        snippet: Even though our patient deceased at the age of 13 months, early diagnosis and prompt
          initiation of dietary management with addition of sodium-D,L-3-hydroxybutyrate may have contributed
          to improved cardiac function and a much longer survival when compared to the previously reported
          cases of isolated LCKAT-deficiency.
        supports: SUPPORT
