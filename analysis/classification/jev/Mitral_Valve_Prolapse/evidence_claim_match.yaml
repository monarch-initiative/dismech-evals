  1f1c241ff1ad41b0b4e691474ede9a84f4a47378ba4a99212d84bdc84887b486:
    claim:
      about:
        disease:
          name: Mitral Valve Prolapse
          disease_term:
            preferred_term: mitral valve prolapse
            term:
              id: MONDO:0004910
              label: mitral valve prolapse
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mitral Annular Disjunction and Systolic Curling
        biological_scale: TISSUE
        description: 'A structural abnormality of the valve hinge rather than of the leaflet: the atrial
          wall-mitral valve junction is displaced away from the ventricular myocardium, so the annulus
          is not anchored where it should be. In systole the disjointed posterior annulus curls toward
          the atrium instead of descending with the ventricle. Disjunction is a constant feature of arrhythmic
          prolapse with ventricular fibrosis - median 4.8 mm versus 1.8 mm in prolapse without fibrosis
          - and the degree of disjunction correlates tightly with the degree of curling. It is what converts
          leaflet excursion into myocardial traction, and it can be measured directly.

          '
        locations:
        - preferred_term: mitral valve
          term:
            id: UBERON:0002135
            label: mitral valve
      selected_evidence:
        snippet: Mitral annulus disjunction is a constant feature of arrhythmic MVP with LV fibrosis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27516479
