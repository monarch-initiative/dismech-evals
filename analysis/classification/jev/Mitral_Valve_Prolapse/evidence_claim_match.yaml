      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mechanical_traction_arrhythmogenesis
        hypothesis_label: Leaflet traction-induced myocardial fibrosis
        status: CANONICAL
        description: 'Arrhythmic risk in mitral valve prolapse is generated by mechanical traction rather
          than by regurgitation. An unanchored, curling annulus converts excessive leaflet excursion into
          repetitive stretch of the papillary muscles and inferobasal wall, which scars; the scar plus
          surviving Purkinje tissue is the substrate, and stretch-elicited premature beats are the trigger.
          The hypothesis makes three predictions, all of which have been met: the fibrosis should be regional
          and confined to the traction territory, it should be present in patients with no significant
          regurgitation, and annular disjunction should be measurable and should correlate with curling.
          Its most important untested prediction is therapeutic - that abolishing the traction should
          abolish the substrate''s progression.

          '
      selected_evidence:
        snippet: MVP may present with ventricular arrhythmias and sudden cardiac death (SCD) even in the
          absence of hemodynamic impairment.
        supports: SUPPORT
    origin:
