              id: MONDO:0004910
              label: mitral valve prolapse
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ventricular Electrical Instability and Sudden Cardiac Death
        biological_scale: ORGANISM
        description: 'Malignant ventricular arrhythmia in prolapse appears to need both halves of the
          classical substrate-plus-trigger pair. The substrate is the regional hypertrophy and fibrosis
          together with surviving Purkinje tissue; the trigger is mechanical stretch eliciting premature
          ventricular beats, documented arising from Purkinje tissue in patients with aborted sudden death.
          Prolapse accounts for 7% of sudden cardiac deaths in adults aged 40 or under and 13% of those
          in young women, and the electrocardiographic signature points back at the anatomy: inverted
          inferior T waves in 83% of cases with an available tracing, and right bundle-branch block morphology
          arrhythmias in all of them, consistent with a left ventricular inferobasal origin.

          '
        locations:
        - preferred_term: heart left ventricle
          term:
            id: UBERON:0002084
            label: heart left ventricle
        cell_types:
        - preferred_term: Purkinje myocyte
          term:
            id: CL:0002068
            label: Purkinje myocyte
      selected_evidence:
        snippet: Forty-three patients with MVP (26 females; age range, 19-40 years; median, 32 years)
          were identified (7% of all SCD, 13% of women).
        supports: SUPPORT
