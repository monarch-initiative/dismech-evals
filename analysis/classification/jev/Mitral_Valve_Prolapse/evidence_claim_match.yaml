      assertion_type: Pathophysiology
      assertion:
        name: Myxomatous Leaflet Remodeling
        biological_scale: TISSUE
        role: trigger
        description: 'The primary lesion. Mitral valve interstitial cells remodel the leaflet extracellular
          matrix, producing thickened, redundant, abnormally compliant leaflets - the myxomatous or "floppy"
          valve. Leaflet thickness of 5 mm or more distinguishes classic from non-classic prolapse echocardiographically
          and is not a cosmetic distinction: it marks the more substantially remodeled valve. Myxomatous
          valve disease is among the commonest indications for valvular surgery.

          '
        locations:
        - preferred_term: mitral valve
          term:
            id: UBERON:0002135
            label: mitral valve
        cell_types:
        - preferred_term: mitral valve interstitial cell
          term:
            id: CL:4030032
            label: valve interstitial cell
        biological_processes:
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: Classic mitral-valve prolapse was defined as superior displacement of the mitral leaflets
          of more than 2 mm during systole and as a maximal leaflet thickness of at least 5 mm during
          diastasis
        supports: SUPPORT
