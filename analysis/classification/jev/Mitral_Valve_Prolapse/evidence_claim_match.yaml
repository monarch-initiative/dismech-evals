  7138af2c5632c020b5bd176e427fe3354f97422ce6b877a59d00c571158c271e:
    claim:
      about:
        disease:
          name: Mitral Valve Prolapse
          disease_term:
            preferred_term: mitral valve prolapse
            term:
              id: MONDO:0004910
              label: mitral valve prolapse
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mechanical Traction on Papillary Muscles and Inferobasal Wall
        biological_scale: TISSUE
        description: 'The mechanistic pivot of the arrhythmic phenotype. Excessive leaflet mobility combined
          with an unanchored, curling annulus applies repetitive systolic stretch to the inferobasal left
          ventricular wall and the papillary muscles. The regional distribution of the resulting injury
          is the signature: fibrosis appears exactly where the traction is applied, not diffusely, and
          not where ischaemia or a cardiomyopathy would put it. Crucially, this operates in patients with
          no or trivial mitral regurgitation, so it is not a consequence of volume loading.

          '
