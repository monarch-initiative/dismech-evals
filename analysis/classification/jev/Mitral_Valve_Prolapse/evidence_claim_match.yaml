  92fb6c3349a695de07f6308e095b4c859d5ff7eb1097b6e73e35ddaced0d97ad:
    claim:
      about:
        disease:
          name: Mitral Valve Prolapse
          disease_term:
            preferred_term: mitral valve prolapse
            term:
              id: MONDO:0004910
              label: mitral valve prolapse
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Valve Developmental and Cytoskeletal Gene Lesion
        biological_scale: MOLECULAR
        role: trigger
        description: 'Non-syndromic prolapse has a clear heritable component, and two genes identified
          in isolated families implicate different layers of valve biology. FLNA, encoding the actin-crosslinking
          protein filamin A, causes X-linked myxomatous valvular dystrophy with complete penetrance in
          men and incomplete penetrance in women - a cytoskeletal, mechanotransductive lesion. DCHS1,
          the human homologue of the Drosophila planar-cell-polarity gene dachsous, causes autosomal prolapse
          through impaired valve interstitial cell migration and patterning, and the mouse heterozygote
          traces adult prolapse back to developmental errors in valve morphogenesis. Together they suggest
          the adult valve lesion is in part a developmental one.

          '
        genes:
        - preferred_term: FLNA
          term:
            id: hgnc:3754
            label: FLNA
        - preferred_term: DCHS1
          term:
            id: hgnc:13681
            label: DCHS1
      selected_evidence:
        snippet: Dchs1(+/-) mice had prolapse of thickened mitral leaflets, which could be traced back
          to developmental errors in valve morphogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26258302
      reference_title: Mutations in DCHS1 cause mitral valve prolapse.
      evidence_source: MODEL_ORGANISM
      explanation: Supports a developmental origin for the adult leaflet lesion. Evidence source is MODEL_ORGANISM
