      assertion:
        name: Mitral Regurgitation and Left Ventricular Volume Overload
        biological_scale: ORGANISM
        description: 'The haemodynamic route, and the one that dominates the surgical literature. Failure
          of coaptation regurgitates a fraction of stroke volume into the left atrium; the ventricle compensates
          by dilating. Outcome is graded by the effective regurgitant orifice area rather than by symptoms:
          in asymptomatic patients followed for a median of 26 years, five-year survival under medical
          management fell from 88% with an orifice below 20 mm2 to 55% at 40 mm2 or above, with risk rising
          continuously rather than at a threshold. This is a different disease from the arrhythmic one,
          in a different population, and it is measured differently.

          '
        locations:
