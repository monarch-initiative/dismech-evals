      assertion_type: Pathophysiology
      assertion:
        name: Anti-U1 RNP Autoimmunity
        description: High-titer antibodies against U1 small nuclear ribonucleoprotein (U1 RNP) are the
          serological hallmark. These antibodies may directly contribute to disease through immune complex
          formation and cellular dysfunction.
        biological_processes:
        - preferred_term: Immunoglobulin Production
          term:
            id: GO:0002377
            label: immunoglobulin production
      selected_evidence:
        snippet: Mixed Connective Tissue Disease (MCTD) is a rare complex systemic autoimmune disease
          (SAD) characterized by the presence of increased levels of anti-U1 ribonucleoprotein autoantibodies
          and signs and symptoms that resemble other SADs such as systemic sclerosis (SSc), rheumatoid
          arthritis (RA), and systemic lupus erythematosus (SLE).
        supports: SUPPORT
