    evidence_metadata:
      reference: PMID:31440254
      reference_title: Epigenome-Wide Comparative Study Reveals Key Differences Between Mixed Connective
        Tissue Disease and Related Systemic Autoimmune Diseases.
      explanation: This epigenome-wide study confirms anti-U1-RNP antibodies as the defining serological
        feature of MCTD, with pervasive hypomethylation at interferon-related genes (MX1, PARP9, DDX60,
        IFI44L) supporting the central role of this autoimmune response in disease pathogenesis.
