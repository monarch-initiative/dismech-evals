    evidence_metadata:
      reference: PMID:31440254
      reference_title: Epigenome-Wide Comparative Study Reveals Key Differences Between Mixed Connective
        Tissue Disease and Related Systemic Autoimmune Diseases.
      explanation: The first epigenome-wide association study in MCTD revealed widespread DNA hypomethylation
        at interferon-related genes (MX1, PARP9, DDX60, IFI44L) with evidence that genetic variants at
        IRF7 and IFI44 may exert disease risk through DNA methylation changes, establishing type I interferon
        pathway activation as a central molecular mechanism shared with SLE and Sjogren syndrome.
