    evidence_metadata:
      reference: PMID:38479808
      reference_title: Machine learning-driven immunophenotypic stratification of mixed connective tissue
        disease, corroborating the clinical heterogeneity.
      explanation: Machine learning-based immunophenotyping revealed that MCTD patients with SLE-like
        features show significantly elevated Th1 cells (2.85% vs 1.33%, P=0.027) and plasmablasts, with
        enhanced interferon-alpha and interferon-gamma responses in central memory CD8+ T cells, demonstrating
        the central role of T cell-driven inflammation in disease heterogeneity.
