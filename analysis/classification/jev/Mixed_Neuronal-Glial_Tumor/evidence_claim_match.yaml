      assertion_type: Genetic
      assertion:
        name: BRAF
        notes: BRAF p.V600E is the single most common somatic alteration in mixed neuronal-glial tumors,
          found in roughly 36.9% of gangliogliomas in a systematic review of 1360 cases. The substitution
          causes constitutive activation of the BRAF serine/threonine kinase and the downstream MAPK/ERK
          pathway. BRAF V600E is also the most actionable therapeutic target in this tumor group.
        gene_term:
          preferred_term: BRAF
          term:
            id: hgnc:1097
            label: BRAF
        association: Most common somatic driver mutation (p.V600E)
        relationship_type: SOMATIC_DRIVER
        variant_origin: SOMATIC
      selected_evidence:
        snippet: The most common mutation was BRAFV600E present in 36.94%, followed by the mutation in
          FGFR1, reported in 1.18% of cases.
        supports: SUPPORT
