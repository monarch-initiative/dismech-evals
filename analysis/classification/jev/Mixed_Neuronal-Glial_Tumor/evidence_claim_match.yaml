      assertion_type: Pathophysiology
      assertion:
        name: MAPK Pathway Activation
        description: The initiating and central pathogenic event is a somatic genetic alteration that
          constitutively activates the RAS-RAF-MEK-ERK (MAPK) signaling cascade. In ganglioglioma the
          dominant driver is the BRAF p.V600E missense mutation (glutamic acid-to-valine substitution
          in the kinase domain), while in DNET and other entities FGFR1 hotspot mutations (N546K, K656E)
          predominate; FGFR1 activation simultaneously stimulates the RAS/RAF/MEK and PI3K-AKT cascades.
          These low-grade glioneuronal tumors are considered developmental neoplasms arising from MAPK-activated
          neural progenitors rather than from environmental exposures.
        gene:
          preferred_term: BRAF
          term:
            id: hgnc:1097
            label: BRAF
        molecular_functions:
        - preferred_term: protein serine/threonine kinase activity
          term:
            id: GO:0004674
            label: protein serine/threonine kinase activity
          modifier: INCREASED
        biological_processes:
        - preferred_term: MAPK cascade
          term:
            id: GO:0000165
            label: MAPK cascade
          modifier: INCREASED
        - preferred_term: positive regulation of cell proliferation
          term:
            id: GO:0008284
            label: positive regulation of cell population proliferation
          modifier: INCREASED
        - preferred_term: negative regulation of apoptosis
          term:
            id: GO:0043066
            label: negative regulation of apoptotic process
          modifier: INCREASED
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
      selected_evidence:
        snippet: Low-grade gliomas (LGG) and mixed neuronal-glial tumors (MNGT) show frequent MAPK pathway
          alterations.
        supports: SUPPORT
