      assertion_type: Pathophysiology
      assertion:
        name: Dual Neuronal-Glial Differentiation
        description: Aberrant differentiation of MAPK-activated neural progenitors yields a neoplasm containing
          both a neoplastic neuronal component (dysmorphic ganglion cells, floating neurons, or neurocytic
          rosettes depending on subtype) and a neoplastic glial component (astrocytic GFAP-positive and/or
          oligodendrocyte-like OLIG2-positive cells). This dual lineage is the defining histological feature
          of glioneuronal tumors and distinguishes them from pure gliomas.
        biological_processes:
        - preferred_term: neuron differentiation
          term:
            id: GO:0030182
            label: neuron differentiation
          modifier: ABNORMAL
        - preferred_term: cell fate determination
          term:
            id: GO:0001709
            label: cell fate determination
