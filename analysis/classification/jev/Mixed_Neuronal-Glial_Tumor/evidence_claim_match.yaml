      assertion_type: Subtype
      assertion:
        name: Ganglioglioma
        description: Most common mixed neuronal-glial tumor; CNS WHO grade 1. Composed of dysmorphic neoplastic
          neuronal (ganglion) cells admixed with a neoplastic glial component. Driven most often by BRAF
          p.V600E, with less frequent FGFR1, KRAS, NF1, H3-3A, or RAF1 alterations. Typically presents
          with long-standing focal epilepsy, often temporal lobe.
        subtype_term:
          preferred_term: ganglioglioma
          term:
            id: MONDO:0016733
            label: ganglioglioma
      selected_evidence:
        snippet: While ganglioglioma, dysembryoplastic neuroepithelial tumor, and desmoplastic infantile
          tumor are common glioneuronal tumors, anaplastic ganglioglioma, papillary glioneuronal tumor,
          rosette-forming glioneuronal tumor, gangliocytoma, and central neurocytoma are less frequent.
        supports: SUPPORT
