          and frequent association with focal cortical dysplasia generate a highly epileptogenic substrate,
          such that these tumors have been informally termed "epileptomas".
        locations:
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
      selected_evidence:
        snippet: Structural brain lesions, including the broad range of malformations of cortical development
