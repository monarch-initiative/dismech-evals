      assertion:
        name: MRI with Genotype Correlation
        description: 'MRI is the cornerstone of diagnosis. Genotype-relevant imaging patterns have been
          described: BRAF V600E tumors show indistinct borders with iso-T1 and high T2 signal without
          diffuse mass effect (93.8% sensitivity, 100% specificity), whereas FGFR1-mutant tumors show
          sharp borders and very high T2 signal with a diffuse mass effect (100% sensitivity and specificity).'
      selected_evidence:
        snippet: Group 1 had indistinct borders and iso T1-weighted and slightly high or high T2-weighted
          signal intensities without a diffuse mass effect, associated with 93.8% sensitivity and 100%
          specificity to BRAF V600E mutations; Group 2 exhibited sharp borders and very or slightly low
          T1-weighted and very high T2-weighted signal intensities with a diffuse mass effect and 100%
          sensitivity and specificity for FGFR1 mutations
        supports: SUPPORT
