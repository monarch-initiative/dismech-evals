        biological_scale: MOLECULAR
        description: Rearrangement of KMT2A at 11q23.3 replaces the wild-type methyltransferase with a
          fusion that recruits the DOT1L/super-elongation machinery to KMT2A target loci and enforces
          sustained expression of HOXA cluster genes and MEIS1. This locks the cell in a self-renewing,
          stem-like state in which lineage commitment cannot proceed, and it also underlies the well-described
          tendency of KMT2A-rearranged leukemias to switch lineage.
        subtypes:
        - MPAL KMT2A
