        - preferred_term: myeloid leukocyte differentiation
          modifier: ABNORMAL
          term:
            id: GO:0002573
            label: myeloid leukocyte differentiation
      selected_evidence:
        snippet: In mouse HSPCs, concomitant lesions, such as NRASG12D, were required for fully penetrant
          leukemia, whereas in human HSPCs, expression of ZNF384 FO drove B/myeloid leukemia, with sensitivity
          of a ZNF384-rearranged xenograft to FLT3 inhibition in vivo.
        supports: SUPPORT
