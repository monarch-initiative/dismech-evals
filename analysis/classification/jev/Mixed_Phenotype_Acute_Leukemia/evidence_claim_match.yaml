      assertion_type: Subtype
      assertion:
        name: ALAL BCL11B
        display_name: Acute leukemia of ambiguous lineage with BCL11B rearrangement
        classification: genetically defined
        description: Ambiguous-lineage acute leukemia carrying a structural rearrangement that hijacks
          an enhancer to BCL11B at 14q32.2. WHO-HAEM5 and the ICC name it as a defined ambiguous-lineage
          genetic group alongside ZNF384-rearranged disease. It is curated at subtype level rather than
          folded into the T/myeloid NOS group because the entity spans acute undifferentiated leukemia
          and T/myeloid MPAL, and reaches into ETP-ALL and AML with minimal differentiation, so it cuts
          across the immunophenotypically defined subtypes rather than sitting inside one. No MONDO term
          exists for this entity yet, so no subtype_term is bound.
      selected_evidence:
        snippet: The other subtype is ALAL with BCL11B rearrangement, which has a more heterogenous immunophenotype
          ... in acute undifferentiated leukaemia (AUL) and ~20-30% of T/myeloid MPAL.
        supports: SUPPORT
