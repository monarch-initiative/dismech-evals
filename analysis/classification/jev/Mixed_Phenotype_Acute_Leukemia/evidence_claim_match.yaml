        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mpal_no_prospective_randomized_therapy_data
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does ALL-directed induction actually outperform AML-directed or hybrid induction in mixed
          phenotype acute leukemia when tested prospectively, and for which genetic subgroups?
        attaches_to:
        - treatments#ALL-Type Induction Chemotherapy
        rationale: Every current recommendation to prefer ALL-type induction derives from retrospective
          series, registry data and meta-analysis of those series. No prospective controlled trial has
          compared induction strategies in MPAL, so confounding by indication, era and center cannot be
          excluded, and the optimal approach for genetically defined subgroups is unknown.
        proposed_experiments:
        - experiment_id: exp_mpal_prospective_induction_backbone
          name: Prospective cooperative-group induction-backbone study in centrally reviewed MPAL
          description: Enrol centrally reviewed WHO/ICC MPAL into a cooperative-group protocol that randomizes
            or risk-stratifies the induction backbone (ALL-type versus AML-type versus hybrid), using
            end-of-induction measurable residual disease as the primary early endpoint and event-free
            survival as the confirmatory endpoint.
          decision_criterion: A prespecified difference in end-of-induction MRD negativity between induction
            backbones, confirmed by event-free survival.
          supporting_outcome:
          - Prospective confirmation that ALL-directed induction is superior would convert the current
            retrospective recommendation into controlled evidence.
          refuting_outcome:
          - Equivalent MRD and survival across backbones would show the retrospective signal reflects
            confounding by indication, era and center.
        - experiment_id: exp_mpal_genetic_subgroup_induction_analysis
          name: Prespecified genetic-subgroup analysis of induction response
          description: Within the same prospective cohort, analyse induction response separately by BCR::ABL1,
            KMT2A, ZNF384 and BCL11B status and by AML-like versus ALL-like methylation class.
          decision_criterion: A subgroup-by-backbone interaction that survives prespecified multiplicity
            control.
          supporting_outcome:
          - Evidence that induction choice should be genetically rather than immunophenotypically guided.
          refuting_outcome:
          - Absence of interaction would support a single uniform backbone for all MPAL.
      selected_evidence:
        snippet: No prospective, controlled trials exist to guide therapy.
        supports: SUPPORT
    origin:
