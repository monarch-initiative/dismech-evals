            id: GO:0048863
            label: stem cell differentiation
        - preferred_term: hemopoiesis
          modifier: ABNORMAL
          term:
            id: GO:0030097
            label: hemopoiesis
      selected_evidence:
        snippet: Myeloid-B and myeloid-T MPAL show distinct mutation and methylation signatures that are
          associated with differences in lineage-commitment gene expressions.
        supports: SUPPORT
