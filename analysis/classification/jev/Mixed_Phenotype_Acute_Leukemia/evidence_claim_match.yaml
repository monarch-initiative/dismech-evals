      assertion_type: Subtype
      assertion:
        name: Acute undifferentiated leukemia
        display_name: Acute undifferentiated leukemia (AUL)
        classification: related ambiguous-lineage entity
        description: An acute leukemia of ambiguous lineage in which blasts express no lineage-defining
          marker at all (no myeloperoxidase, no cytoplasmic CD3, no B-lineage marker combination) and
          typically carry only immaturity markers such as CD34, HLA-DR and TdT. AUL is not strictly MPAL,
          since no lineage is assigned rather than more than one, but it sits in the same ambiguous-lineage
          category and shares the immature-progenitor cell of origin, so it is curated here as a related
          subtype.
        subtype_term:
          preferred_term: acute undifferentiated leukemia
          term:
            id: MONDO:0020321
            label: acute undifferentiated leukemia
      selected_evidence:
        snippet: Acute undifferentiated leukemia (AUL) is rare and defined by the absence of bona fide
          myeloid and lymphoid markers.
        supports: SUPPORT
