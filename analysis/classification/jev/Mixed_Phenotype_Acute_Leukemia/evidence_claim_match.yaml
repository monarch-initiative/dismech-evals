      assertion_type: Diagnosis
      assertion:
        name: Measurable residual disease monitoring
        description: Flow cytometric (and where available molecular) measurable residual disease assessment
          at end of induction and end of consolidation. MRD must be designed at diagnosis to track every
          abnormal blast compartment, because MPAL clones can shift phenotype. End-of-induction MRD is
          the strongest early prognostic variable in pediatric MPAL and is the proposed basis for therapy
          adaptation, including the decision to proceed to transplant.
      selected_evidence:
        snippet: ALL induction therapy achieved an EOI MRD negative (<0.01%) remission in most patients
          (70%). EOI MRD positivity was predictive of 5-year EFS (HR = 6.00, p < 0.001) and OS (HR = 9.57,
          p = 0.003).
        supports: SUPPORT
