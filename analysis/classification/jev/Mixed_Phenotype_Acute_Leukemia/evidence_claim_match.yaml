          variant_origin: SOMATIC
        biological_scale: MOLECULAR
        description: Rearrangements that fuse the ZNF384 transcription factor to partners such as TCF3,
          EP300, CREBBP or TAF15 generate a chimeric transcriptional regulator that imposes a hybrid B-lymphoid/myeloid
          expression program. ZNF384 fusions are the recurrent alteration most characteristic of B/myeloid
          MPAL and link that subtype to the ZNF384-rearranged subgroup of B-ALL.
        subtypes:
        - MPAL B/myeloid NOS
        genes:
        - preferred_term: ZNF384
