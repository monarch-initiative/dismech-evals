            label: MPO
        - preferred_term: CD19
          term:
            id: hgnc:1633
            label: CD19
        biological_processes:
        - preferred_term: hemopoiesis
          modifier: ABNORMAL
          term:
            id: GO:0030097
            label: hemopoiesis
      selected_evidence:
        snippet: Myeloid and T-lineage features were demonstrated by cytoplasmic myeloperoxidase and CD3;
          B-lineage features were demonstrated by at least 2 B-lymphoid markers.
        supports: SUPPORT
