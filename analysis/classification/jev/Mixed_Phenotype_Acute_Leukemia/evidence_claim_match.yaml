      assertion:
        name: Stem-like Transcriptional State and Epigenetic Lineage Programming
        biological_scale: MOLECULAR
        description: Multiomic single-cell profiling shows that MPAL blasts, irrespective of their surface
          immunophenotype or driver genotype, converge on a shared stem-cell-like transcriptional program
          indicating high differentiation potential; the degree of that stemness tracks with survival.
          Genome-wide methylation separates MPAL into AML-like and ALL-like epigenetic classes whose lineage-commitment
          gene expression differs, so the epigenetic state, not only the mutation set, determines which
          lineage programs the blast can access. This node is the mechanistic bridge between a failed
          commitment decision and both the observed cross-lineage phenotype and the capacity for lineage
          switch.
        cell_types:
        - preferred_term: hematopoietic multipotent progenitor cell
          term:
            id: CL:0000837
            label: hematopoietic multipotent progenitor cell
        biological_processes:
        - preferred_term: stem cell differentiation
          modifier: ABNORMAL
