              label: mixed phenotype acute leukemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Lineage Plasticity and Therapy Escape
        biological_scale: CELLULAR
        description: Because alternative lineage programs remain transcriptionally accessible, MPAL clones
          can shift immunophenotype under therapeutic pressure. This is seen as spontaneous lymphoid-to-myeloid
          switching at relapse, and as antigen-loss or lineage-switch escape from lineage-directed immunotherapy
          such as CD19-targeted CAR T cells and blinatumomab. Plasticity is a major reason MPAL responds
          poorly to single-lineage-directed strategies and a principal driver of its inferior outcome
          relative to ALL.
        cell_types:
        - preferred_term: hematopoietic multipotent progenitor cell
          term:
            id: CL:0000837
            label: hematopoietic multipotent progenitor cell
        biological_processes:
        - preferred_term: hematopoietic progenitor cell differentiation
          modifier: ABNORMAL
          term:
            id: GO:0002244
            label: hematopoietic progenitor cell differentiation
      selected_evidence:
        snippet: Whole genome sequencing unambiguously revealed the AML derived from the initial ALL,
          with distinct driver mutations that were detectable before emergence. Extensive prior diversification
          and subsequent clonal selection underpins this fatal lineage switch.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/11
      evidence_path: /pathophysiology/11/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37474833
      reference_title: Clonal origin of KMT2A wild-type lineage-switch leukemia following CAR-T cell and
        blinatumomab therapy.
      evidence_source: HUMAN_CLINICAL
      explanation: Whole-genome phylogeny shows a lymphoid-to-myeloid lineage switch under anti-CD19 pressure
        arises by selection of a pre-existing subclone, the escape mechanism this node describes.
