      assertion_type: Discussion
      assertion:
        discussion_id: mpal_aul_optimal_therapy_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the optimal induction strategy for acute undifferentiated leukemia, where no lineage
          is assigned and therefore no lineage-directed regimen is indicated by phenotype?
        attaches_to:
        - has_subtypes#Acute undifferentiated leukemia
        rationale: The therapeutic logic used in MPAL is to pick the regimen matching an assignable lineage.
          In AUL no lineage is assignable, so that logic gives no guidance, and population-based data
          show most AUL patients receive no chemotherapy at all and have the worst adult survival of any
          acute leukemia.
        proposed_experiments:
        - experiment_id: exp_aul_molecular_class_registry
          name: Molecular-class-stratified registry study of acute undifferentiated leukemia
          description: Assemble a prospective registry of centrally reviewed AUL and stratify by DNA methylation
            and transcriptomic class rather than by immunophenotype, which by definition provides no lineage
            information in this entity.
          decision_criterion: Identification of molecular classes with reproducibly different treatment
            response or survival.
          supporting_outcome:
          - A molecular basis for assigning induction therapy in a phenotypically uninformative leukemia.
          refuting_outcome:
          - Absence of class-associated outcome differences would argue AUL should be treated as a single
            high-risk group.
        - experiment_id: exp_aul_lineage_agnostic_regimen_trial
          name: Trial of lineage-agnostic regimens in prospectively identified AUL
          description: Evaluate BCL2-directed and other lineage-agnostic regimens in prospectively identified
            AUL, given that most AUL patients currently receive no chemotherapy at all.
          decision_criterion: Response rate and overall survival compared with the population-based untreated
            and chemotherapy-treated AUL benchmarks.
          supporting_outcome:
          - A deliverable standard of care for a group with the worst adult acute leukemia survival.
          refuting_outcome:
          - Lack of activity would redirect effort toward transplant-directed or supportive strategies.
      selected_evidence:
        snippet: For AUL the optimal therapeutic approach is uncertain.
        supports: SUPPORT
