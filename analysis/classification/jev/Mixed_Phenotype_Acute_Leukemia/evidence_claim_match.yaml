        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mpal_immunophenotype_does_not_track_genotype
        kind: OPEN_QUESTION
        status: OPEN
        prompt: If neither genotype nor transcriptome reliably predicts MPAL immunophenotype, should MPAL
          be classified and treated by immunophenotype at all, or by epigenetic/transcriptional lineage
          class?
        attaches_to:
        - pathophysiology#Stem-like Transcriptional State and Epigenetic Lineage Programming
        rationale: Multiomic single-cell data show immunophenotype is decoupled from genetic and transcriptional
          profile, while methylation-defined AML-like versus ALL-like classes predict response to lineage-matched
          therapy. This challenges the immunophenotypic basis of the current WHO/ICC definition and of
          therapy selection.
        proposed_experiments:
        - experiment_id: exp_mpal_methylation_vs_immunophenotype_assignment
          name: Methylation-class-guided versus immunophenotype-guided therapy assignment
          description: Prospectively assign induction therapy either by the current immunophenotypic lineage
            call or by AML-like versus ALL-like methylation class, and compare remission and survival.
          decision_criterion: Superior complete response or survival in the methylation-guided arm.
          supporting_outcome:
          - Replacing or supplementing the immunophenotypic definition of MPAL with an epigenetic one
            for therapeutic purposes.
          refuting_outcome:
          - Equivalence would justify retaining immunophenotype as the operational basis of classification
            and therapy.
        - experiment_id: exp_mpal95_independent_validation
          name: Independent validation of the MPAL95 stemness score
          description: Validate the 95-gene MPAL95 stemness score as a risk stratifier in an independent
            prospective MPAL cohort, modelled jointly with end-of-induction measurable residual disease.
          decision_criterion: MPAL95 retains independent prognostic value after adjustment for MRD and
            established clinical covariates.
          supporting_outcome:
          - Adding a transcriptional stemness axis to MPAL risk stratification.
          refuting_outcome:
          - Loss of significance after MRD adjustment would show the score is captured by existing response-based
            measures.
      selected_evidence:
        snippet: Genome-wide methylation comparison among MPAL, AML, B-ALL, and T-ALL sub-classifies MPAL
          into AML-type and ALL-type MPAL, which is associated with better clinical response when lineage-matched
          therapy is given.
        supports: SUPPORT
