        description: The mutant hard-keratin chain is incorporated into the obligate type-I/type-II heterodimer
          of the hair cortex, so filament assembly is disrupted throughout the network rather than in
          the mutant protein alone. This is the dominant-negative step, and it is what makes a single
          variant allele sufficient.
        cell_types:
        - preferred_term: hair follicle cell
          term:
            id: CL:0002559
            label: hair follicle cell
        biological_processes:
        - preferred_term: intermediate filament organization
          term:
            id: GO:0045109
            label: intermediate filament organization
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: keratin filament
          term:
            id: GO:0045095
            label: keratin filament
        notes: Dominant-negative incorporation is inferred here from the autosomal dominant inheritance
          of missense alleles in obligate-heterodimer keratins, by analogy with the well-demonstrated
          epidermal keratinopathies. The cited source is not offered as a direct demonstration of network
          collapse in hair cortex.
      selected_evidence:
        snippet: Monilethrix is an autosomal dominant hair disorder caused by mutations in the hard keratins
          KRT81, KRT83 and KRT86.
        supports: SUPPORT
