              id: MONDO:0008009
              label: monilethrix
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Keratin Assembly in the Hair Shaft Cortex
        conforms_to: keratin_intermediate_filament_fragility#Loss of Keratinocyte Mechanical Resilience
        biological_scale: CELLULAR
        description: The cortical keratin network of the developing hair shaft is assembled abnormally,
          so the shaft loses the mechanical resilience that its densely packed keratin filaments normally
          provide. Unlike the epidermal keratinopathies, the affected cells are not lysed in a living
          tissue plane - the hair shaft is already a dead, keratinized structure - so the mechanical failure
          presents as fracture of a structure rather than as cytolysis and blistering.
        cell_types:
        - preferred_term: hair follicle cell
          term:
            id: CL:0002559
            label: hair follicle cell
        biological_processes:
        - preferred_term: intermediate filament organization
          term:
            id: GO:0045109
            label: intermediate filament organization
          modifier: ABNORMAL
        - preferred_term: keratinization
          term:
            id: GO:0031424
            label: keratinization
          modifier: ABNORMAL
        locations:
        - preferred_term: hair follicle
          term:
            id: UBERON:0002073
            label: hair follicle
        notes: 'Conformance here is declared against the keratin module''s central effector, but the module''s
          node is written for keratinocytes and its effector node speaks of cytolysis. Monilethrix reaches
          mechanical failure without cytolysis because the failing structure is already dead and keratinized.
          That is a genuine partial mismatch and is recorded rather than papered over: the entry conforms
          to the module''s trigger and resilience nodes and deliberately does NOT conform to its cytolysis
          node.'
      selected_evidence:
        snippet: The affected hairs are fragile and break easily
        supports: SUPPORT
    origin:
