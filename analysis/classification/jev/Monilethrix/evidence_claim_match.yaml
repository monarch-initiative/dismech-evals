        name: Supportive Hair Care and Trauma Avoidance
        description: No specific therapy corrects the keratin defect. Because breakage is mechanical,
          gentle hair care and avoidance of physical and chemical trauma are the mainstay. Oral acitretin,
          topical and oral minoxidil, and oral N-acetylcysteine have all been reported, but only at case-report
          and small case-series level with inconsistent and often non-sustained benefit, so none is curated
          here as an effective treatment. They are named rather than silently omitted so a later curator
          can see what was considered.
