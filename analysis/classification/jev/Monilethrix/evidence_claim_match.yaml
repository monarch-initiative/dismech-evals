  5df059e202e4a80bec6115e60a6dffad14b37612c6b4e6d136f4cc92e5954177:
    claim:
      about:
        disease:
          name: Monilethrix
          disease_term:
            preferred_term: monilethrix
            term:
              id: MONDO:0008009
              label: monilethrix
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative Hair Cortex Keratin Variant
        conforms_to: keratin_intermediate_filament_fragility#Dominant-Negative Keratin Variant in a Filament
          Assembly Domain
        biological_scale: MOLECULAR
        description: 'A heterozygous variant in one of the hair-cortex keratins KRT81, KRT83 or KRT86
          alters a residue required for keratin filament assembly. KRT81 and KRT86 variants are the most
          commonly reported. These are the same class of filament-assembly lesion that produces epidermolysis
          bullosa simplex and pachyonychia congenita in other keratin pairs; what differs is the tissue
          in which the affected pair is expressed. A nonsense variant in the type I hair-cortex keratin
          KRT31 reaches the same node from the partner side of the obligate heterodimer: it removes the
          last three residues of the 2B subdomain and the whole C-terminal tail domain, and the shortened
          chain is still expressed, without nonsense-mediated decay, but localises abnormally.'
        cell_types:
        - preferred_term: hair follicle cell
          term:
            id: CL:0002559
            label: hair follicle cell
        genes:
        - preferred_term: KRT86
          term:
            id: hgnc:6463
            label: KRT86
        - preferred_term: KRT81
          term:
            id: hgnc:6458
            label: KRT81
        - preferred_term: KRT83
          term:
            id: hgnc:6460
            label: KRT83
        - preferred_term: KRT31
          term:
            id: hgnc:6448
            label: KRT31
        molecular_functions:
        - preferred_term: structural constituent of cytoskeleton
          term:
            id: GO:0005200
            label: structural constituent of cytoskeleton
          modifier: LOSS_OF_FUNCTION
        cellular_components:
        - preferred_term: keratin filament
          term:
            id: GO:0045095
            label: keratin filament
        locations:
        - preferred_term: hair follicle
          term:
            id: UBERON:0002073
            label: hair follicle
      selected_evidence:
        snippet: Monilethrix is an autosomal dominant hair disorder caused by mutations in the hard keratins
          KRT81, KRT83 and KRT86.
        supports: SUPPORT
