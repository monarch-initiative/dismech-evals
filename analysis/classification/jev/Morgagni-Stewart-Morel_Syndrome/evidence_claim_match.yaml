              label: Morgagni-Stewart-Morel syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Systemic endocrine and metabolic dysregulation
        description: 'Systemic endocrine and metabolic dysfunction—potentially driven by genetic and environmental
          factors, postmenopausal hormonal changes, prolonged estrogen exposure, and altered leptin and
          glucose homeostasis—is postulated as an upstream driver in Morgagni-Stewart-Morel syndrome,
          contributing both to metabolic manifestations (obesity and diabetes mellitus) and to altered
          bone metabolism with frontal bone apposition.

          '
        biological_processes:
        - preferred_term: Endocrine process
          term:
            id: GO:0050886
            label: endocrine process
        - preferred_term: Regulation of hormone levels
          term:
            id: GO:0010817
            label: regulation of hormone levels
        - preferred_term: Glucose homeostasis
          term:
            id: GO:0042593
            label: glucose homeostasis
        locations:
        - preferred_term: Endocrine system
          term:
            id: UBERON:0000949
            label: endocrine system
      selected_evidence:
        snippet: Metabolic and endocrine dysfunctions should be interpreted not only as isolated components
          of the syndrome, but also as the reason behind its pathogenesis.
        supports: SUPPORT
    origin:
