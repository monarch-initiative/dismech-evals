            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
        description: 'Multiple-generation family studies and monozygotic twin concordance suggest autosomal
          dominant inheritance with incomplete penetrance and variable expressivity. Hyperostosis frontalis
          interna has been found in multiple generations of affected families, though no case of male-to-male
          transmission has been documented, and X-linked dominant inheritance has not been excluded.

          '
      selected_evidence:
        snippet: The symptoms common to both twins appear to correspond to the Morgagni-Stewart-Morel
          syndrome and indicate a genetic basis of this disorder as these features occur in genetically
          identical patients.
        supports: SUPPORT
