              label: Morgagni-Stewart-Morel syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Endocrine-mediated calvarial bone overgrowth
        description: 'The precise pathogenesis of frontal bone thickening remains unclear. Well-supported
          hypotheses include prolonged estrogen exposure stimulating osteoblastic activity in the frontal
          bone inner table (supported by large-scale anthropological studies) and elevated leptin levels
          associated with obesity promoting bone formation. A more contested hypothesis involves dysregulated
          growth hormone secretion from pituitary microadenomatosis; however, recent evidence shows no
          direct causative role for GH excess or hyperprolactinemia in HFI etiopathogenesis. The condition
          predominantly affects females and is associated with age, being much less frequent in females
          under 40 years.

          '
        cell_types:
        - preferred_term: Osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: Bone mineralization
          term:
            id: GO:0030282
            label: bone mineralization
        - preferred_term: Osteoblast differentiation
          term:
            id: GO:0001649
            label: osteoblast differentiation
        locations:
        - preferred_term: Frontal bone
          term:
            id: UBERON:0000209
            label: tetrapod frontal bone
      selected_evidence:
        snippet: It is most commonly found among females and is believed to be associated with prolonged
          estrogen stimulation
        supports: SUPPORT
    origin:
