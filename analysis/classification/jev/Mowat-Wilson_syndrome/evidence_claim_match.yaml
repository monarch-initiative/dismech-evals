              preferred_term: Mowat-Wilson syndrome due to monosomy 2q22
              term:
                id: MONDO:0016855
                label: Mowat-Wilson syndrome due to monosomy 2q22
            description: The etiological subtype of Mowat-Wilson syndrome caused by a heterozygous deletion
              at chromosome band 2q22 that removes the entire ZEB2 gene, as opposed to an intragenic ZEB2
              sequence variant. The deletion may extend beyond ZEB2 to neighbouring genes, in which case
              the resulting ZEB2 haploinsufficiency is accompanied by loss of one copy of flanking loci.
              Because a whole-gene deletion is not detectable by ZEB2 sequencing alone, this subtype is
              ascertained by copy-number methods (chromosomal microarray, FISH, MLPA, or qPCR) rather
              than by sequencing. Reported deletion patients show the recognizable Mowat-Wilson phenotype
              rather than a distinct syndrome, which is why Orphanet and MONDO model this as an etiological
              subtype nested under Mowat-Wilson syndrome rather than as a separate disease. The extent
              to which deletion size modifies the phenotype is not established here; see the entry notes.
            genes:
            - preferred_term: ZEB2
              description: Whole-gene deletion of ZEB2 within the deleted 2q22 segment, producing haploinsufficiency
                by loss of one entire allele.
              modifier: DECREASED
              term:
                id: hgnc:14881
                label: ZEB2
          role: subtype
      assertion_type: Genetic
      assertion:
        name: ZEB2 whole-gene deletion at 2q22
        subtype: Monosomy 2q22
        association: Causal heterozygous contiguous-gene deletion removing the entire ZEB2 locus
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: In the monosomy 2q22 subtype the causal lesion is a heterozygous interstitial deletion
          at 2q22 that removes all of ZEB2, and which may extend to flanking genes. A reported case carried
          a 2.27-Mb deletion. Because the lesion is a copy-number change rather than a sequence change,
          it is detected by copy-number methods rather than by sequencing.
        case_fractions:
        - population: Polish cohort of molecularly confirmed Mowat-Wilson syndrome
          case_fraction_percent: 7.1
          cohort_size: 28
          notes: Whole-gene (all-exon) ZEB2 deletions in two of 28 molecularly confirmed patients, matching
            this subtype's scope (deletion removing the entire ZEB2 locus). The broader class of exonic
            ZEB2 deletions of any extent was six of 28 (21%); one further patient carried a large 2q22.3q23.3
            deletion found by array-CGH. The share is cohort- and ascertainment-dependent, as this series
            used MLPA alongside sequencing.
      selected_evidence:
        snippet: Using FISH, qPCR and sequencing, ZFHX1B deletions, splice site or truncating mutations
          were detected in all 28 patients classified as typical MWS.
        supports: SUPPORT
