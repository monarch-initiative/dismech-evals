        name: 2q22 contiguous-gene deletion removing ZEB2
        description: In the monosomy 2q22 subtype the proximal lesion is a heterozygous interstitial deletion
          at chromosome band 2q22 that removes the entire ZEB2 coding region rather than altering it in
          situ. A reported case carried a 2.27-Mb deletion encompassing ZEB2 and additional genes, making
          this a contiguous-gene deletion whose dominant contribution is ZEB2 haploinsufficiency. The
          lesion therefore converges on the same downstream mechanism as intragenic loss-of-function variants,
          which is consistent with deletion patients presenting with the recognizable Mowat-Wilson phenotype.
        subtypes:
        - Monosomy 2q22
        biological_scale: MOLECULAR
        gene:
          preferred_term: ZEB2
          description: Entire ZEB2 locus lost on one homolog within the deleted 2q22 segment.
          modifier: ABSENT
          term:
            id: hgnc:14881
            label: ZEB2
        genes:
