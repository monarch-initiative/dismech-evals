      assertion:
        name: Monosomy 2q22
        display_name: Mowat-Wilson syndrome due to monosomy 2q22
        subtype_term:
          preferred_term: Mowat-Wilson syndrome due to monosomy 2q22
          term:
            id: MONDO:0016855
            label: Mowat-Wilson syndrome due to monosomy 2q22
        description: The etiological subtype of Mowat-Wilson syndrome caused by a heterozygous deletion
          at chromosome band 2q22 that removes the entire ZEB2 gene, as opposed to an intragenic ZEB2
          sequence variant. The deletion may extend beyond ZEB2 to neighbouring genes, in which case the
          resulting ZEB2 haploinsufficiency is accompanied by loss of one copy of flanking loci. Because
          a whole-gene deletion is not detectable by ZEB2 sequencing alone, this subtype is ascertained
          by copy-number methods (chromosomal microarray, FISH, MLPA, or qPCR) rather than by sequencing.
          Reported deletion patients show the recognizable Mowat-Wilson phenotype rather than a distinct
          syndrome, which is why Orphanet and MONDO model this as an etiological subtype nested under
          Mowat-Wilson syndrome rather than as a separate disease. The extent to which deletion size modifies
          the phenotype is not established here; see the entry notes.
        genes:
        - preferred_term: ZEB2
          description: Whole-gene deletion of ZEB2 within the deleted 2q22 segment, producing haploinsufficiency
            by loss of one entire allele.
          modifier: DECREASED
          term:
            id: hgnc:14881
            label: ZEB2
        inheritance:
        - name: Autosomal dominant inheritance
          description: The 2q22 deletion behaves as an autosomal dominant allele and is almost always
            de novo.
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: a heterozygous deletion of 2q22.3 involving ZEB2
        supports: SUPPORT
