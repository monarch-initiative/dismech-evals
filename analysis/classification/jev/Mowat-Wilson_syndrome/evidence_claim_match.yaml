      assertion_type: Diagnosis
      assertion:
        name: Chromosomal microarray for 2q22 copy-number analysis
        presence: A heterozygous interstitial deletion at 2q22 encompassing ZEB2 establishes the monosomy
          2q22 subtype.
        description: Copy-number analysis is the diagnostic step that specifically ascertains the monosomy
          2q22 subtype. A whole-gene ZEB2 deletion is invisible to sequence-based testing, so chromosomal
          microarray (or MLPA, qPCR, or FISH) is required to detect it; a negative ZEB2 sequencing result
          in a patient with a suggestive Mowat-Wilson gestalt should therefore prompt copy-number testing.
          In the reported Egyptian case, targeted MLPA and subtelomere screening were normal and only
          chromosomal microarray revealed the deletion.
        diagnosis_term:
          preferred_term: chromosomal microarray testing
          term:
            id: NCIT:C18477
            label: Microarray Analysis
      selected_evidence:
        snippet: CMA revealed an interstitial 2.27-Mb microdeletion in chromosome 2q, involving the entire
          ZEB2 gene and other genes.
        supports: SUPPORT
