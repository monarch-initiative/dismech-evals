  61559b0ec336136fc51230c8c361d4c8041de81ba9b502707ed7ae9a8d6d2f8b:
    claim:
      about:
        disease:
          name: Moyamoya Disease
          disease_term:
            preferred_term: Moyamoya disease
            term:
              id: MONDO:0016820
              label: Moyamoya disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_moyamoya_rnf213_nfkb
        prompt: Does RNF213-mediated NF-κB activation and IL-6 amplification constitute a central inflammatory
          driver of moyamoya disease pathogenesis, and how does the MMD-associated RNF213 p.R4810K variant
          convert genetic susceptibility into the progressive steno-occlusive arteriopathy that defines
          the disease?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Progressive steno-occlusive intracranial arteriopathy
        - pathophysiology#RNF213-associated angiogenic and remodeling dysregulation
        - pathophysiology#RNF213 loss-of-function Hippo-YAP/TAZ-VEGFR2 activation
        rationale: 'RNF213, the major East Asian susceptibility gene for moyamoya disease, is an E3 ubiquitin
          ligase whose precise pathogenic mechanism is unresolved. Yasuda et al. (2026, PMID:41891799)
          identify RNF213 as a critical regulator of the IL-6 amplifier (IL6-Amp), an NF-κB/STAT3 inflammatory
          module active in non-immune cells: RNF213 knockdown selectively suppressed NF-κB target genes
          and reduced IL-6 expression, and RNF213 depletion attenuated inflammation in an NF-κB-dependent
          in vivo model. The disease-associated p.R4810K variant strengthens the RNF213-TRAF2 interaction,
          enhancing TNF-α-NF-κB signaling and IL6-Amp activation, with genotype-dependent NF-κB p65/STAT3
          phosphorylation seen in patient superficial temporal arteries. This positions an inflammatory
          axis alongside the existing angiogenic and Hippo-YAP/TAZ-VEGFR2 mechanisms, but it remains unclear
          whether NF-κB/IL6-Amp activation is an initiating driver of vascular wall remodeling and stenosis
          or a parallel/amplifying process, and how it interacts with the angiogenic dysregulation already
          modeled. The upstream physiological triggers of IL6-Amp induction in cerebral vessels and whether
          anti-inflammatory or anti-IL-6 strategies can slow steno-occlusive progression in p.R4810K carriers
          are also unknown.'
        proposed_experiments:
        - experiment_id: exp_moyamoya_rnf213_nfkb_vascular_progression
          name: Genotype-stratified vascular inflammation and stenosis-progression study
          description: Combine longitudinal imaging of intracranial stenosis with molecular profiling
            of RNF213-genotyped MMD cohorts and matched vascular cells. Stratify patients by RNF213 p.R4810K
            status (homozygous, heterozygous, wild-type) and quantify IL6-Amp activation (NF-κB p65 and
            STAT3 phosphorylation, IL-6 output) in superficial temporal artery samples and in patient-derived
            arachnoid/endothelial cells stimulated with TNF-α plus IL-6, while tracking radiographic stenosis
            progression over time. Test whether RNF213-TRAF2-dependent NF-κB signaling predicts and mechanistically
            precedes vascular remodeling.
          experiment_type:
            preferred_term: genotype-stratified translational cohort with cell-based mechanistic assays
          readouts:
          - name: Genotype-dependent IL6-Amp activation in vessel wall
            target: pathophysiology#RNF213-associated angiogenic and remodeling dysregulation
            description: 'Quantify phosphorylated NF-κB p65 and STAT3 and IL-6 expression in superficial
              temporal artery tissue and stimulated patient-derived vascular cells across RNF213 genotypes
              to test whether the p.R4810K variant amplifies NF-κB/IL6-Amp inflammatory signaling.

              '
            assays:
            - preferred_term: immunohistochemistry for phospho-NF-κB p65 and phospho-STAT3
            - preferred_term: IL-6 expression quantification in stimulated vascular cells
            direction: POSITIVE
          - name: NF-κB-dependence of inflammatory output
            target: pathophysiology#RNF213 loss-of-function Hippo-YAP/TAZ-VEGFR2 activation
            description: 'Use RNF213 knockdown and TRAF2/NF-κB perturbation in vascular cell models to
              determine whether RNF213-driven IL-6 amplification is mediated through the TRAF2-NF-κB axis
              rather than the Hippo-YAP/TAZ-VEGFR2 program.

              '
            assays:
            - preferred_term: RNF213 knockdown with NF-κB target-gene readout
            direction: POSITIVE
          - name: Inflammatory signature versus stenosis progression
            target: pathophysiology#Progressive steno-occlusive intracranial arteriopathy
            description: 'Correlate baseline IL6-Amp/NF-κB activation markers with subsequent radiographic
              progression of intracranial stenosis to test whether inflammatory activation precedes and
              predicts steno-occlusive remodeling.

              '
            assays:
            - preferred_term: serial neurovascular imaging of intracranial stenosis
            direction: POSITIVE
          decision_criterion: An RNF213-NF-κB/IL6-Amp inflammatory driver is supported if (1) p.R4810K
            genotype dose-dependently increases NF-κB p65/STAT3 phosphorylation and IL-6 output in vessel
            wall and patient-derived cells, (2) RNF213 knockdown suppresses inflammatory output in a TRAF2-NF-κB-dependent
            manner, and (3) baseline inflammatory activation predicts subsequent stenosis progression;
            a primarily parallel/amplifying role is favored if inflammatory markers do not precede or
            predict remodeling.
          would_support:
          - pathophysiology#RNF213-associated angiogenic and remodeling dysregulation
          - pathophysiology#Progressive steno-occlusive intracranial arteriopathy
      selected_evidence:
        snippet: Here, we identify RNF213 as a critical regulator of the IL-6 amplifier (IL6-Amp), a mechanism
          that enhances NF-κB-mediated inflammation in the presence of IL-6-STAT3 in non-immune cells.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41891799
      reference_title: RNF213-TRAF2 interaction enhances inflammatory responses via NF-κB activation in
        moyamoya disease.
      evidence_source: IN_VITRO
      explanation: This cell-based study identifies RNF213 as a regulator of the NF-κB-driven IL-6 amplifier,
        motivating the gap about whether this inflammatory axis is a central MMD mechanism.
