              label: mucoepidermoid carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CRTC1-MAML2 Fusion Oncogene Formation
        genetic_context:
          variant_origin: SOMATIC
        description: A recurrent t(11;19)(q21;p13) translocation fuses exon 1 of CRTC1 (CREB-regulated
          transcription coactivator 1) in-frame to exons 2-5 of MAML2 (mastermind-like 2), generating
          a chimeric oncoprotein that combines the CREB-binding domain of CRTC1 with the transcriptional
          activation domain of MAML2. This fusion is detected in up to 80% of MEC cases and is an early,
          often sole, cytogenetic event. A CRTC3-MAML2 variant occurs in up to 6% of cases and is mutually
          exclusive with CRTC1-MAML2.
        cell_types:
        - preferred_term: salivary gland epithelial cell
          term:
            id: CL:0009005
            label: salivary gland cell
        genes:
        - preferred_term: CRTC1
          term:
            id: hgnc:16062
            label: CRTC1
        - preferred_term: MAML2
          term:
            id: hgnc:16259
            label: MAML2
        - preferred_term: CRTC3
          term:
            id: hgnc:26148
            label: CRTC3
      selected_evidence:
        snippet: A recurrent t(11;19)(q14-21;p12-13) translocation encoding a potentially novel CRTC1-MAML2
          gene fusion has been detected in up to 80% of MEC cases in studies of multiple cohorts
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
