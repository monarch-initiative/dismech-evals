      assertion:
        name: Aberrant CREB and Notch Transcriptional Reprogramming
        description: Because the fusion replaces the Notch-binding region of MAML2 with the CREB-binding
          domain of CRTC1, the CRTC1-MAML2 oncoprotein constitutively transactivates CREB-mediated gene
          transcription while disrupting normal Notch receptor-mediated transcriptional activation. This
          aberrant transcriptional program is the proximate molecular driver of tumor-cell behavior.
        cell_types:
        - preferred_term: salivary gland epithelial cell
          term:
            id: CL:0009005
            label: salivary gland cell
        biological_processes:
        - preferred_term: aberrant CREB-driven positive regulation of transcription
          modifier: INCREASED
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
        - preferred_term: disrupted Notch signaling
          modifier: ABNORMAL
          term:
            id: GO:0007219
            label: Notch signaling pathway
      selected_evidence:
        snippet: Gene set enrichment analysis using the Molecular Signatures Database (MSigDB) curated
          motif gene sets (C3:TFT) revealed upstream regulators of MEC-DEGs, including CREB (Figure 4D),
          which was consistent with CRTC1-MAML2 transactivation of the CREB-mediated gene transcription
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33830080
      reference_title: The CRTC1-MAML2 fusion is the major oncogenic driver in mucoepidermoid carcinoma.
      evidence_source: MODEL_ORGANISM
      explanation: Transcriptomic analysis identifies CREB as an upstream regulator of MEC differentially
        expressed genes, supporting fusion-driven CREB transactivation.
