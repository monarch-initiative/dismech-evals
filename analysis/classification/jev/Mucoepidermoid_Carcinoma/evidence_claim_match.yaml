      assertion_type: Pathophysiology
      assertion:
        name: Tumor-Cell Proliferation and Multilineage Differentiation
        description: The CRTC1-MAML2 fusion activates AREG/EGFR signaling as a critical downstream effector,
          driving proliferation of salivary gland epithelial tumor cells and producing the characteristic
          admixture of mucous, epidermoid, and intermediate cells. The fusion is required for tumor establishment
          and maintenance, with 100% penetrant salivary gland tumor formation in a conditional transgenic
          mouse model.
        cell_types:
        - preferred_term: salivary gland epithelial cell
          term:
            id: CL:0009005
            label: salivary gland cell
        biological_processes:
        - preferred_term: tumor-cell proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
        - preferred_term: aberrant multilineage tumor-cell differentiation
          modifier: ABNORMAL
          term:
            id: GO:0030154
            label: cell differentiation
      selected_evidence:
        snippet: we demonstrate that the CRTC1-MAML2 fusion is an oncogenic driver for MEC establishment
          and maintenance by generating the first genetically engineered mouse model to our knowledge
          of CRTC1-MAML2–driven MEC
        supports: SUPPORT
    origin:
