  0445bf884a38fe3f9c7da30450093c01f318d8247ae14d3b0458c5ff86420198:
    claim:
      about:
        disease:
          name: Mucopolysaccharidosis-Plus Syndrome
          disease_term:
            preferred_term: Mucopolysaccharidosis-plus syndrome
            term:
              id: MONDO:0015012
              label: mucopolysaccharidosis-plus syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mpsps_unexplained_phenotype_mechanisms
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does loss of VPS33A produce the congenital cardiac lesions, the neurological
          and neuroimaging findings, the discordant immunoglobulin pattern, the ocular and prenatal features
          and the nephromegaly of MPSPS?
        attaches_to:
        - phenotypes#Congenital heart defect
        - phenotypes#Atrial septal defect
        - phenotypes#Patent ductus arteriosus
        - phenotypes#Tricuspid regurgitation
        - phenotypes#Mitral regurgitation
        - phenotypes#Ventricular hypertrophy
        - phenotypes#Pulmonary hypertension
        - phenotypes#Hypotonia
        - phenotypes#Nystagmus
        - phenotypes#Delayed CNS myelination
        - phenotypes#Basal ganglia calcification
        - phenotypes#Fundus hypopigmentation
        - phenotypes#Enlarged kidney
        - phenotypes#Decreased circulating IgG concentration
        - phenotypes#Increased circulating IgM level
        - phenotypes#Hemophagocytosis
        - phenotypes#Fetal ascites
        rationale: 'These phenotypes are deliberately left without incoming causal edges. The marrow precedent
          shows why manufacturing storage edges would be wrong: MPSPS marrow is hypoplastic yet contains
          no storage cells, so at least one major MPSPS organ phenotype is demonstrably NOT storage-cell-driven,
          and the same may be true of any phenotype in this list. Per cluster: the congenital heart lesions
          (ASD, PDA) are established at birth, before substantial postnatal storage, and the valve regurgitation
          that is storage-attributed in classical MPS has no MPSPS valve histology to support the same
          attribution; ventricular hypertrophy and pulmonary hypertension are plausibly haemodynamic consequences
          of the valve disease, but no source asserts that chain. Delayed CNS myelination and basal ganglia
          calcification are not classical MPS features, so the MPS-phenocopy attribution to GAG accumulation
          does not extend to them; hypotonia and nystagmus have no localising pathology. The IgM-high/IgG-low
          pattern could reflect selective urinary IgG loss in the nephrotic state, but no MPSPS source
          makes that link. Retinal hypopigmentation is intriguing given that the Vps33a-mutant buff mouse
          models Hermansky-Pudlak syndrome with oculocutaneous albinism, suggesting a lysosome-related-organelle
          route, but this has not been examined in patients. Secondary HLH is a single case, and fetal
          ascites and nephromegaly are reported without any mechanistic account. The mpsps_no_organ_level_model
          discussion records the corresponding absence of any organ-level experimental system in which
          these mechanisms could be tested.'
      selected_evidence:
        snippet: It is still unknown how missense mutation p.R498W in VPS33A cause accumulation of GAGs.
          Detailed mechanism and disease pathophysiology remain to be elucidated.
        supports: SUPPORT
