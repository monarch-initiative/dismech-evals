      assertion_type: Treatment
      assertion:
        name: Supportive and symptomatic care
        description: 'There is no approved disease-modifying therapy for MPSPS, and enzyme replacement
          is not a logical strategy because no single hydrolase is deficient. Management is multidisciplinary
          and supportive: airway clearance, oxygen and ventilatory support, prompt antibiotics for respiratory
          infection, nutritional and developmental support, standard cardiac and renal management, transfusion
          for significant cytopenia, and surveillance of cardiac, renal, respiratory, haematologic, hearing
          and vision status.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
