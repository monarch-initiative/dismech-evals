              nodes. Two departures from the module must be read alongside the conformance. First, the
              cause: the module''s accumulation node presumes the substrate arrived at the lysosome and
              could not be degraded, whereas in MPSPS the substrate is poorly delivered. Second - and
              more consequentially - the COMPARTMENT may differ. The module (and the Lysosomal_Storage_Disorders
              grouping criterion) specify accumulation "within the lysosomal lumen", but in MPSPS fibroblasts
              heparan sulphate shows only weak colocalisation with LysoTracker and is interpreted as trapped
              in endosomes rather than delivered to lysosomes (PMID:40758165). Conformance is asserted
              because the disease-level endpoint - progressive intracellular storage of an undegraded
              macromolecule driving secondary endolysosomal dysfunction and multisystem disease - is the
              same, but it should NOT be read as asserting classical intralysosomal storage. This is the
              single most interesting unresolved detail in MPSPS cell biology and is the reason the grouping
              membership question stays open.'
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Recurrent respiratory infections
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Respiratory problems with bronchial obstruction are an enumerated member of the MPS-like
          cluster attributed to GAG accumulation (in classical MPS, airway GAG deposition); airway histology
          has not been examined in MPSPS, so the intermediates are unknown.
      selected_evidence:
        snippet: These results suggested that dysfunction of VPS33A protein leads to GAG accumulation
          and causes MPS-like phenotypes.
        supports: SUPPORT
        directness: INDIRECT
