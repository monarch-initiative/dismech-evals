        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HOPS and CORVET Tethering Complex Depletion
        description: 'VPS33A is a core component of the class C core vacuole/endosome tethering (CORVET)
          and the homotypic fusion and protein sorting (HOPS) complexes, which have essential functions
          in the endocytic pathway. Because VPS33A is shared by both complexes, its depletion is not isolated:
          patient cells show reduced abundance of the other HOPS and CORVET components as well, so both
          the early-endosome (CORVET) and late-endosome/lysosome (HOPS) tethering arms are simultaneously
          compromised.'
        role: amplifier
        biological_scale: MOLECULAR
        protein_complexes:
        - preferred_term: HOPS complex
          term:
            id: GO:0030897
            label: HOPS complex
          modifier: DECREASED
        - preferred_term: CORVET complex
