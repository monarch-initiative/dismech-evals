      assertion_type: Genetic
      assertion:
        name: VPS33A
        gene_term:
          preferred_term: VPS33A
          term:
            id: hgnc:18179
            label: VPS33A
        relationship_type: CAUSATIVE
        association: 'Biallelic missense variants in VPS33A (12q24.31), encoding a core Sec1/Munc18-family
          subunit of the HOPS and CORVET membrane-tethering complexes, cause MPSPS. Two variants are established:
          the recurrent founder allele c.1492C>T (p.Arg498Trp), homozygous in essentially all reported
          patients and associated with the severe infantile form, and c.599G>C (p.Arg200Pro), reported
          homozygous in two patients with an attenuated juvenile course. Both act as hypomorphic loss
          of function via protein destabilisation and proteasomal degradation.'
        variant_origin: GERMLINE
        notes: 'Variant class and mechanism: both known alleles are germline homozygous MISSENSE substitutions
          in conserved regions, acting as hypomorphic loss of function through protein instability - NOT
          nonsense, frameshift, whole-gene deletion, gain of function or dominant negative. No CNV, structural,
          somatic or mosaic mechanism has been implicated, and no modifier gene is known. Because VPS33A
          is a shared core subunit, the molecular consequence extends beyond VPS33A itself: patient cells
          show secondary reduction of the other HOPS/CORVET components (VPS18, VPS41), so a single missense
          allele depletes two multi-subunit complexes. Penetrance and genotype-phenotype: penetrance of
          homozygous p.Arg498Trp appears complete in reported families, with no formal age-dependent penetrance
          estimate published. The genotype-phenotype correlation is the clearest feature of the MPSPS
          genetics - p.Arg498Trp gives the lethal infantile disease while p.Arg200Pro gives an attenuated
          juvenile course, attributed to appreciable RESIDUAL endosomal-lysosomal trafficking rather than
          to any qualitative difference in mechanism. Caveat: the p.Arg200Pro correlation rests on only
          two reported patients. Founder allele: p.Arg498Trp is a Yakut founder allele with a carrier
          frequency of 1:81 and a birth incidence of about 1 per 12,100 in that population (see prevalence).
          Consanguinity is not required - the original Yakut series comprised children of healthy, non-consanguineous
          parents - although the two Turkish patients were born to first cousins.'
      selected_evidence:
        snippet: We observed that the missense mutation reduced the abundance of full-length VPS33A and
          other components of the HOPS and CORVET complexes.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
