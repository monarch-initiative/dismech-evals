        description: 'Heparan, dermatan and (variably) chondroitin sulphate accumulate and are excreted
          in excess in the urine, and plasma heparan sulphate is extraordinarily elevated - around 60
          times the normal reference range and six times the level seen in classical MPS patients. Sialylated
          conjugates, sialooligosaccharides, elevated beta-D-galactosylsphingosine and cholesterol and
          sphingolipid abnormalities are also reported. The defining biochemical signature of MPSPS is
          that all of this occurs with entirely normal activity of the cognate lysosomal hydrolases: it
          is substrate accumulation without an enzyme deficiency.'
        role: central_effector
        biological_scale: CELLULAR
        conforms_to: lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation
        biological_processes:
        - preferred_term: glycosaminoglycan catabolic process
          term:
            id: GO:0006027
            label: glycosaminoglycan catabolic process
          modifier: DECREASED
        chemical_entities:
        - preferred_term: glycosaminoglycan
          term:
            id: CHEBI:18085
            label: glycosaminoglycan
          modifier: INCREASED
        notes: 'This is the one node where MPSPS genuinely converges on the lysosomal_substrate_accumulation
          module, and it is the reason conforms_to is asserted here but not on the three upstream nodes.
          Two departures from the module must be read alongside the conformance. First, the cause: the
          module''s accumulation node presumes the substrate arrived at the lysosome and could not be
          degraded, whereas in MPSPS the substrate is poorly delivered. Second - and more consequentially
          - the COMPARTMENT may differ. The module (and the Lysosomal_Storage_Disorders grouping criterion)
          specify accumulation "within the lysosomal lumen", but in MPSPS fibroblasts heparan sulphate
          shows only weak colocalisation with LysoTracker and is interpreted as trapped in endosomes rather
          than delivered to lysosomes (PMID:40758165). Conformance is asserted because the disease-level
          endpoint - progressive intracellular storage of an undegraded macromolecule driving secondary
          endolysosomal dysfunction and multisystem disease - is the same, but it should NOT be read as
          asserting classical intralysosomal storage. This is the single most interesting unresolved detail
          in MPSPS cell biology and is the reason the grouping membership question stays open.'
      selected_evidence:
        snippet: a weak HS colocalisation with LysoTracker Red
        supports: SUPPORT
