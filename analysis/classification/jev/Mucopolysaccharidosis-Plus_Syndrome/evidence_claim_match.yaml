      assertion_type: Diagnosis
      assertion:
        name: Clinical and biochemical suspicion of MPSPS
        description: 'MPSPS is suspected when an infant has an MPS-like phenotype (coarse facies, dysostosis
          multiplex, hepatosplenomegaly, developmental delay) with excessive urinary GAG excretion BUT
          normal activity of the lysosomal enzymes. The negative enzyme panel is the discriminator, and
          it is also why MPSPS cannot be detected by any enzyme-based newborn screen: there is no deficient
          hydrolase to assay.'
      selected_evidence:
        snippet: Finding of MPS-like phenotype and excess secretion of urinary GAGs without deficiency
          in the activity of lysosomal enzymes is the basis for suspicion of MPSPS.
        supports: SUPPORT
