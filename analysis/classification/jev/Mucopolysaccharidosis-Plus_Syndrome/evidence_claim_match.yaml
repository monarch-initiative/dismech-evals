        notes: 'Conforms to the module''s storage-cell node, substituting the podocyte (CL:0000653) for
          the module''s generic macrophage/neuron storage cells - the module explicitly states that the
          specific storage cell varies by disorder. The foamy podocyte is the one unambiguous storage
          cell in MPSPS. Note the deliberate asymmetry with the marrow node, which does NOT conform because
          MPSPS marrow is hypoplastic without storage cells. Neuroinflammation, the other half of the
          module node''s title, is not asserted here: no MPSPS microglial or astrocyte activation data
          exist.'
        cell_types:
