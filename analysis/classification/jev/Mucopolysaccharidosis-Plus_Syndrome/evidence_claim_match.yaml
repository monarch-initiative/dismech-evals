  d974470cbdb759cd8fceb6fc9e43451ce0398851d1a7ce7423fc6d9980c91cc1:
    claim:
      about:
        disease:
          name: Mucopolysaccharidosis-Plus Syndrome
          disease_term:
            preferred_term: Mucopolysaccharidosis-plus syndrome
            term:
              id: MONDO:0015012
              label: mucopolysaccharidosis-plus syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Proteasome and protein-degradation modulation (experimental)
        description: Because the disease mechanism is destabilisation and degradation of a partially functional
          VPS33A protein rather than absence of catalytic activity, raising the steady-state level of
          the mutant protein is a rational strategy. In patient-derived fibroblasts the proteasome inhibitor
          bortezomib (and, separately, the glucosylceramide-synthase inhibitor eliglustat) partially corrected
          the lactosylceramide trafficking defect, and the proteasome inhibitor genistein combined with
          the ERAD inhibitor ambroxol raised mutant VPS33A levels and corrected GAG, endosomal-marker
          and cytoskeletal defects. All of this is IN VITRO only. No clinical trial exists, and bortezomib's
          toxicity makes off-label use unsupported outside formal research.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: Exposure of patient-derived fibroblasts to the clinically approved proteasome inhibitor,
          bortezomib, or inhibition of glucosylceramide synthesis with eliglustat, partially corrected
          the impaired lactosylceramide trafficking defect and immediately suggest therapeutic avenues
          to explore in this fatal orphan disease.
        supports: SUPPORT
    origin:
