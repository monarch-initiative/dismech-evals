  28fbe5bcad222abaddd542b843e3e9638b636bb95ad8a4eb44821a1f0a17be07:
    claim:
      about:
        disease:
          name: Mucopolysaccharidosis-Plus Syndrome
          disease_term:
            preferred_term: Mucopolysaccharidosis-plus syndrome
            term:
              id: MONDO:0015012
              label: mucopolysaccharidosis-plus syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Endosome-Lysosome Tethering and Fusion
        description: 'With HOPS and CORVET depleted, the tethering and fusion events that carry endocytic
          cargo from early through late endosomes into the lysosome become inefficient. Patient fibroblasts
          show vacuolation with disordered endosomal/lysosomal compartments, elevated EEA1 (required at
          early/late endosome fusion and early-endosome sorting), altered Golgi morphology, and abnormal
          endocytic trafficking of lactosylceramide and other glycosphingolipids. This node is the mechanistic
          pivot of MPSPS: it is a delivery failure upstream of catabolism, not a catabolic block, and
          it is what distinguishes MPSPS from every classical mucopolysaccharidosis.'
        role: central_effector
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: endosome to lysosome transport
          term:
            id: GO:0008333
            label: endosome to lysosome transport
          modifier: DECREASED
        - preferred_term: vesicle fusion
          term:
            id: GO:0006906
            label: vesicle fusion
          modifier: DECREASED
        - preferred_term: endosome organization
          term:
            id: GO:0007032
            label: endosome organization
          modifier: DYSREGULATED
        cellular_components:
        - preferred_term: late endosome
          term:
            id: GO:0005770
            label: late endosome
        - preferred_term: lysosome
          term:
            id: GO:0005764
            label: lysosome
        notes: Deliberately carries no conforms_to. This is the distinctive upstream route by which MPSPS
          reaches lysosomal-storage biology, and it has no counterpart in the lysosomal_substrate_accumulation
          module chain.
      selected_evidence:
        snippet: 'Here we show that cultured fibroblasts from patients with this disorder have morphological
          changes: vacuolation with disordered endosomal/lysosomal compartments'
        supports: SUPPORT
