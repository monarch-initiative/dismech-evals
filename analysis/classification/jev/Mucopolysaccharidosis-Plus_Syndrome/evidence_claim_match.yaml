        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mpsps_autophagy_discrepancy
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is autophagic flux genuinely impaired in MPSPS, or is the reported autophagy abnormality
          specific to the p.Arg200Pro variant or to assay conditions?
        attaches_to:
        - pathophysiology#Endolysosomal Compartment Expansion and Over-Acidification
        rationale: The original p.Arg498Trp study explicitly reported that the mutation did NOT affect
          the endocytic or autophagic pathways in patient skin fibroblasts, whereas a later study of p.Arg200Pro
          fibroblasts found elevated LC3-II and p62, indicating a block in autophagic flux. Because HOPS
          is required for autophagosome-lysosome fusion, an autophagy defect is mechanistically expected,
          making the negative result surprising. Resolving this matters for whether the Autophagic-Lysosomal
          Dysfunction conformance asserted here is correct for both variants, and for whether autophagy-modulating
          therapy is rational.
        proposed_experiments:
        - experiment_id: mpsps_autophagic_flux_headtohead
          name: Head-to-head autophagic flux assay across both VPS33A genotypes
          description: Side-by-side autophagic-flux assay (LC3-II turnover with and without bafilomycin
            A1, plus p62 and tandem mRFP-GFP-LC3 reporter) in p.Arg498Trp and p.Arg200Pro patient fibroblasts
            and isogenic knock-in controls, under identical starvation and basal conditions.
        - experiment_id: mpsps_autophagosome_lysosome_fusion_imaging
          name: Live-cell imaging of autophagosome-lysosome fusion
          description: Quantify autophagosome-lysosome fusion directly by live-cell imaging of LC3 and
            LAMP1 colocalisation in both genotypes, to distinguish a fusion block from altered autophagosome
            biogenesis.
      selected_evidence:
        snippet: VPS33A is involved in endocytic and autophagic pathways, but the identified mutation
          did not affect either of these pathways.
        supports: SUPPORT
    origin:
