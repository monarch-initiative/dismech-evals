            name: Renal Podocyte Storage and Glomerular Destruction
            description: The kidney is one of the two most discriminating "plus" targets. Storage in podocytes
              converts them to foam cells and destroys glomerular architecture, producing nephrotic-range
              proteinuria, hypoalbuminaemia, and rising creatinine, cholesterol and uric acid. Histology
              shows extensive destruction of glomerular structures by foamy podocytes, with periglomerular
              fibrosis and interstitial inflammation.
            role: effector
            biological_scale: TISSUE
            conforms_to: lysosomal_substrate_accumulation#Storage-Cell Cytotoxicity and Neuroinflammation
            notes: 'Conforms to the module''s storage-cell node, substituting the podocyte (CL:0000653)
              for the module''s generic macrophage/neuron storage cells - the module explicitly states
              that the specific storage cell varies by disorder. The foamy podocyte is the one unambiguous
              storage cell in MPSPS. Note the deliberate asymmetry with the marrow node, which does NOT
              conform because MPSPS marrow is hypoplastic without storage cells. Neuroinflammation, the
              other half of the module node''s title, is not asserted here: no MPSPS microglial or astrocyte
              activation data exist.'
            cell_types:
            - preferred_term: podocyte
              term:
                id: CL:0000653
                label: podocyte
            locations:
            - preferred_term: renal glomerulus
              term:
                id: UBERON:0000074
                label: renal glomerulus
            - preferred_term: kidney
              term:
                id: UBERON:0002113
                label: kidney
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Nephrotic range proteinuria
        causal_link_type: DIRECT
        description: Destruction of the glomerular filtration barrier by foamy podocytes lets protein
          pass into the urine.
      selected_evidence:
