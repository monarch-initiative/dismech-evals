        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mpsps_nosology
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Should MPSPS be classified as a type of mucopolysaccharidosis, or as a distinct vesicular-trafficking
          metabolic disease that phenocopies one?
        attaches_to:
        - pathophysiology#Glycosaminoglycan Accumulation With Normal Lysosomal Hydrolase Activity
        rationale: 'GAG storage and MPS-like clinical features argue for inclusion among the mucopolysaccharidoses;
          normal lysosomal GAG-hydrolase activity and a primary membrane-tethering/trafficking lesion
          argue for a separate entity. The question is not merely terminological: it determines whether
          MPSPS belongs in the Mucopolysaccharidoses grouping (whose rationale requires deficiency of
          a GAG-degrading enzyme) and whether newborn screening by enzyme assay could ever detect it.
          This entry takes the position that MPSPS is a lysosomal storage disorder reached by a trafficking
          route, hence downstream-only conformance to lysosomal_substrate_accumulation and no MPS-grouping
          membership on the criteria as currently written.'
      selected_evidence:
        snippet: Moreover, we asked the question whether MPSPS should be classified as a type of MPS or
          a separate disease, as contrary to 'classical' MPS types, despite GAG accumulation, no defects
          in lysosomal enzymes responsible for degradation of these compounds could be detected in MPSPS.
        supports: SUPPORT
