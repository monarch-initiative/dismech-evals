  4bdbcfefee18db3b1115e08723dd0ce6aa48b1e2ff9dfbb5147c9b06a6e6cb6e:
    claim:
      about:
        disease:
          name: Mucopolysaccharidosis-Plus Syndrome
          disease_term:
            preferred_term: Mucopolysaccharidosis-plus syndrome
            term:
              id: MONDO:0015012
              label: mucopolysaccharidosis-plus syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: VPS33A Missense Variant Destabilisation and Proteasomal Degradation
        description: Biallelic missense variants in VPS33A destabilise the folded protein and target it
          for proteasomal degradation, so the steady-state intracellular abundance of intact full-length
          VPS33A falls. The 3D crystal structure of human VPS33A predicts that replacement of arginine
          498 by tryptophan de-stabilises folding; the same instability-plus-degradation mechanism is
          documented for the juvenile p.Arg200Pro variant. The functional consequence is hypomorphic loss
          of function through protein instability, not gain of function or dominant-negative activity,
          and mutant protein can be rescued by proteasome inhibition.
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: VPS33A
          term:
            id: hgnc:18179
            label: VPS33A
        notes: Deliberately carries no conforms_to. This trigger is a chaperone/tethering protein-stability
          defect, not the hydrolase-or-cofactor catabolic deficiency that the lysosomal_substrate_accumulation
          module's trigger node models.
      selected_evidence:
        snippet: We propose that the disease is due to diminished intracellular abundance of intact VPS33A.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31070736
      reference_title: The lysosomal disease caused by mutant VPS33A.
      evidence_source: IN_VITRO
      explanation: 'States the proposed proximal disease mechanism: reduced abundance of intact VPS33A
        rather than an altered catalytic activity.'
