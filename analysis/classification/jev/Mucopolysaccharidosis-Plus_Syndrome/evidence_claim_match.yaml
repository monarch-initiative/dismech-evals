            id: GO:0033263
            label: CORVET complex
          modifier: DECREASED
      selected_evidence:
        snippet: VPS33A is a core component of the class C core vacuole/endosome tethering (CORVET) and
          the homotypic fusion and protein sorting (HOPS) complexes, which have essential functions in
          the endocytic pathway.
        supports: SUPPORT
