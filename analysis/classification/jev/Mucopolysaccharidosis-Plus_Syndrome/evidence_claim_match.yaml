          role: subtype
      assertion_type: ProgressionInfo
      assertion:
        phase: Rapid multisystem progression
        subtype: Infantile
        notes: Cardiac disease can progress from moderate to severe within only 3-4 months, in parallel
          with worsening renal and haematopoietic involvement.
      selected_evidence:
        snippet: Previously, we reported a novel disease of impaired glycosaminoglycans (GAGs) metabolism
          without deficiency of known lysosomal enzymes-mucopolysaccharidosis-plus syndrome (MPSPS). MPSPS,
          whose pathophysiology is not elucidated, is an autosomal recessive multisystem disorder caused
          by a specific mutation p.R498W in the VPS33A gene. ... Disease is very severe, prognosis is
          unfavorable and most of patients died at age of 10-20 months. ... Such acute conditions since
          the beginning tended to more frequent and each time the child’s condition worsened. Most patients
          developed congenital heart defects. Mitral and tricuspid valve defects and pulmonary hypertension
          progressed from moderate to severe within 3–4 months. ... All MPSPS patients showed recurrent
          infections of the upper respiratory tract in infancy or early childhood. MPSPS is a multisystem
          disorder with severe phenotype. In addition to clinical phenotype of conventional MPS, MPSPS
          patients present with hematopoietic disorders, renal involvement and congenital heart defects.
          Individuals affected by MPSPS share similar symptoms that progress rapidly.
        supports: SUPPORT
