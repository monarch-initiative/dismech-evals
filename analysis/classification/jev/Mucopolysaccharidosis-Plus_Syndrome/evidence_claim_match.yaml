      assertion:
        name: Endolysosomal Compartment Expansion and Over-Acidification
        description: Failed tethering and fusion leave an expanded endocytic compartment that is abnormally
          acidified. Lysosomal over-acidification was detected in patient-derived and VPS33A-depleted
          cells in the original description, and increased endolysosomal acidification with an expanded
          endocytic compartment was independently confirmed in the juvenile p.Arg200Pro form. Autophagy
          markers LC3-II and p62 are elevated in p.Arg200Pro fibroblasts, indicating a block in autophagic
          flux, though the original p.Arg498Trp study did not detect an autophagic defect (see the autophagy-discrepancy
          discussion below).
        role: amplifier
        biological_scale: CELLULAR
        conforms_to: lysosomal_substrate_accumulation#Autophagic-Lysosomal Dysfunction and Secondary Cascade
        biological_processes:
        - preferred_term: lysosomal lumen acidification
          term:
            id: GO:0007042
            label: lysosomal lumen acidification
          modifier: INCREASED
        - preferred_term: autophagy
          term:
            id: GO:0006914
            label: autophagy
          modifier: DYSREGULATED
        notes: 'This is the weakest of the four asserted conformances and is qualified in two ways. (1)
          It rests on the lysosomal-dysfunction half of the module node: endolysosomal expansion and over-acidification
          are solidly replicated across both VPS33A variants, whereas the autophagy half is contested
          - see the mpsps_autophagy_discrepancy discussion and the REFUTE evidence item retained below.
          (2) The edge topology differs from the module: the module places autophagic-lysosomal dysfunction
          strictly downstream of substrate accumulation, whereas here over-acidification and accumulation
          are parallel consequences of the same tethering failure, and PMID:40758165 explicitly entertains
          over-acidification as a candidate primary mechanism rather than a storage consequence.'
      selected_evidence:
        snippet: Lysosomal over-acidification and HS accumulation were detected in patient-derived and
          VPS33A-depleted cells, suggesting a novel role of this gene in lysosomal functions.
        supports: SUPPORT
