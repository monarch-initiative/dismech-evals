      assertion:
        name: Infantile
        display_name: Severe infantile MPSPS (p.Arg498Trp founder form)
        description: The classical and by far the commonest form, caused by homozygous VPS33A c.1492C>T
          (p.Arg498Trp). Presentation is in the first months of life with MPS-like facies and dysostosis
          together with congenital heart disease, renal and haematopoietic involvement; death from cardiorespiratory
          failure typically occurs at 10-20 months. 39 of the first 41 reported patients carried this
          variant.
      selected_evidence:
        snippet: Up to now, a total number of 39 patients have been reported; in all of them, the c.1492C>T
          (p.Arg498Trp) variant of the VPS33A gene was detected.
        supports: SUPPORT
