        name: Lysosomal hyaluronan accumulation
        conforms_to: mps_gag_storage#Lysosomal GAG Accumulation
        description: Undegraded hyaluronan accumulates within lysosomes. This is the GAG-accumulation
          hub of the mps_gag_storage module, but unlike the sulfated GAGs, hyaluronan does not engage
          the heparan-sulfate neuronopathic, dermatan-sulfate somatic, or keratan-sulfate skeletal arms.
          Hyaluronan is instead enriched in synovial fluid, cartilage, and skin, directing the downstream
          pathology toward the joints rather than toward the central nervous system, viscera, cornea,
          or generalized skeleton. This tissue distribution underlies the unexpectedly mild, joint-centred
          phenotype of MPS IX.
        chemical_entities:
