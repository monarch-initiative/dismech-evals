          modifier: DECREASED
          term:
            id: GO:0030214
            label: hyaluronan catabolic process
      selected_evidence:
        snippet: The turnover of HA requires endoglycosidic breakdown by lysosomal hyaluronidase, and
          a congenital deficiency of hyaluronidase has been thought to be incompatible with life.
        supports: SUPPORT
