            id: HP:0000007
            label: Autosomal recessive inheritance
        description: MPS IX is inherited in an autosomal recessive manner. The index patient was a compound
          heterozygote for two HYAL1 mutations, consistent with autosomal recessive segregation reported
          in the family.
      selected_evidence:
        snippet: We identified two mutations in the HYAL1 alleles of the patient, a 1412G --> A mutation
          that introduces a nonconservative amino acid substitution (Glu268Lys) in a putative active site
          residue and a complex intragenic rearrangement, 1361del37ins14, that results in a premature
          termination codon.
        supports: SUPPORT
