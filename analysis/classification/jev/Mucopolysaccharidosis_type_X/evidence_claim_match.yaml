              label: mucopolysaccharidosis, type 10
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ARSK glucuronate 2-sulfatase deficiency
        conforms_to: lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency
        biological_scale: MOLECULAR
        description: 'Biallelic loss-of-function variants in ARSK abolish or severely reduce the activity
          of arylsulfatase K, the lysosomal sulfatase that removes the 2-O-sulfate group from 2-sulfoglucuronate.
          Reported variants act through two distinct routes to the same end point. Nonsense alleles (p.Leu187Ter,
          p.Tyr417Ter) yield no detectable protein, consistent with nonsense-mediated decay. Missense
          alleles are catalytically dead while remaining stably expressed: p.Arg84Cys disrupts the conserved
          sulfatase signature 80-CCPSR-84 that is required to convert the active-site cysteine to formylglycine,
          and p.Ser356Tyr abolishes activity within the sulfatase domain without destabilizing the protein.
          Because sulfatases show high substrate specificity and no functional redundancy, no other human
          sulfatase compensates for the lost step.

          Term-binding note: the molecular function below is bound to GO:0008484 (sulfuric ester hydrolase
          activity), a broad parent, deliberately. GO has no term for glucuronate 2-O-sulfatase (glucuronate
          2-sulfatase, GDS) activity, and no sibling sulfatase term fits - ARSK is specific for the 2-O-sulfate
          of 2-sulfoglucuronate and does not share substrates with the other lysosomal sulfatases. Binding
          a narrower but wrong term would misstate the enzymology, so the accurate parent is preferred
          over a manufactured match. A GO term request for the specific activity is the way to improve
          this.'
        genes:
        - preferred_term: ARSK
          term:
            id: hgnc:25239
            label: ARSK
        molecular_functions:
        - preferred_term: glucuronate 2-O-sulfatase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0008484
            label: sulfuric ester hydrolase activity
        cellular_components:
        - preferred_term: lysosome
          term:
            id: GO:0005764
            label: lysosome
      selected_evidence:
        snippet: Arylsulfatase K (ARSK) is a recently characterised lysosomal hydrolase involved in GAG
          degradation that removes the 2-O-sulfate group from 2-sulfoglucuronate.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
