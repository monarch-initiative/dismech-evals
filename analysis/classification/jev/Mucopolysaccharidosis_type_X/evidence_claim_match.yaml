          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Chondro-osseous storage and epiphyseal-metaphyseal dysplasia
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: 'The mouse does not develop the skeletal disease that defines human MPS X. This is
          a substantive negative result rather than a gap: it means the mouse cannot serve as a preclinical
          efficacy model for the outcome that matters clinically, and any enzyme replacement therapy programme
          would need a different readout or a different species.'
        limitations: No bone abnormalities or prominent lysosomal storage pathology develop, despite complete
          loss of glucuronate desulfation and measurable metabolite accumulation. The mouse phenotype
          is limited to behavioural changes, which is close to the inverse of the human picture, where
          skeletal disease is universal and cognition is normal. The species divergence most likely reflects
          differences in glucuronate-2-O-sulfation abundance or in the growth-plate load carried by the
          affected chains; it has not been resolved experimentally.
      selected_evidence:
        snippet: Pathophysiological studies reflect a rather mild phenotype including behavioral changes.
          Interestingly, no prominent lysosomal storage pathology like bone abnormalities were detected.
        supports: SUPPORT
