          zone temporal to the macula on optical coherence tomography in one patient. Two independent
          later series reported normal eye examinations throughout. This arm is therefore genuinely inconsistent
          between kindreds rather than merely under-ascertained, which is why it is recorded with both
          supporting and refuting evidence rather than being asserted or dropped. It remains the basis
          for offering ophthalmological surveillance once MPS X is diagnosed.
