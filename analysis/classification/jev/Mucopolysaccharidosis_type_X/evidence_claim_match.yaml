        context: []
      assertion_type: Phenotype
      assertion:
        name: Dysostosis Multiplex Absent
        category: Skeletal
        frequency: EXCLUDED
        diagnostic: true
        description: The defining exclusion of MPS X, and the reason it is not recognised as a mucopolysaccharidosis
          at the bedside. Dysostosis multiplex is the skeletal hallmark shared by MPS I, II, IV, VI, and
          VII; it is explicitly absent in MPS X. What is present instead is a narrower epiphyseal-metaphyseal
          dysplasia - metaphyseal striation, platyspondyly with anterior beaking, delayed carpal ossification
          - which reads as a primary skeletal dysplasia rather than as storage. This exclusion is why
          every published patient carried a spondyloepiphyseal-dysplasia, multiple-epiphyseal-dysplasia,
          or Legg-Calve-Perthes label before sequencing, and it is why MPS X is admitted to the Mucopolysaccharidoses
          grouping through the joint operands of the membership criterion rather than through the classic
          hallmarks.
        phenotype_term:
          preferred_term: Dysostosis multiplex
          term:
            id: HP:0000943
            label: Dysostosis multiplex
          modifier: ABSENT
      selected_evidence:
        snippet: While typical dysostosis multiplex findings were not observed, mild platyspondyly with
          anterior beaking of some vertebral bodies, irregular vertebral endplates, wide ribs, inferior
          tapering of the ilea with a poorly developed acetabulum, irregularity of the central part of
          the femoral head, delayed ossification of the carpals were noted.
        supports: SUPPORT
        directness: DIRECT
