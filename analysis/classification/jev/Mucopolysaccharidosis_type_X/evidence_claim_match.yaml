        description: 'A mild and late arm of the disease, found only on deliberate targeted assessment
          after the genetic diagnosis is made. Reported findings are an aortic or mitral murmur, valve
          thickening with regurgitation, mild aortic valve stenosis, and mild left ventricular hypertrophy
          suggesting early storage cardiomyopathy. Curated separately from the ocular arm below because
          the two have different evidence: the later series that found normal eye examinations throughout
          did not report absent cardiac involvement, so a single bundled node would leave it ambiguous
          which half its refuting evidence applied to.'
