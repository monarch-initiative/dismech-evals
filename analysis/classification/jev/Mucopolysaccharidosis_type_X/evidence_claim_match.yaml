      assertion_type: DifferentialDiagnosis
      assertion:
        name: Spondyloepiphyseal dysplasia
        description: The radiographic label most often applied to MPS X before molecular diagnosis, on
          the basis of platyspondyly with small epiphyses. Multiple epiphyseal dysplasia and Meyer dysplasia
          have also been proposed in reported patients. None of these is excluded radiographically; the
          discriminator is the finding of biallelic ARSK variants.
        distinguishing_features:
        - Metaphyseal striation of the long bones is atypical for spondyloepiphyseal dysplasia and favors
          MPS X.
        - Elevated urinary dermatan sulfate on LC-MS/MS favors MPS X.
        - Biallelic ARSK variants are definitive.
      selected_evidence:
        snippet: In both families, parents were consanguineous and had two affected children with skeletal
          dysplasia, resembling spondyloepiphysial dysplasia.
        supports: SUPPORT
