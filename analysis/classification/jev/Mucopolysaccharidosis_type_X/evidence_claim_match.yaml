        context: []
      assertion_type: Biochemical
      assertion:
        name: Urinary dermatan sulfate
        presence: Elevated
        context: 'The biochemical hallmark of MPS X, and the one that most distinguishes it from the other
          mucopolysaccharidoses in practice: it is small enough to be missed. Sensitive LC-MS/MS disaccharide
          quantification shows a threefold to fourfold elevation of dermatan-sulfate-derived disaccharides,
          with heparan and keratan sulfate generally normal. Routine dimethylmethylene blue total-GAG
          screening, by contrast, is normal or only borderline in most patients, and thin-layer chromatography
          shows a normal GAG profile. A normal urinary GAG screen therefore does not exclude MPS X - the
          practical consequence is that this diagnosis is reached by sequencing, not by biochemistry,
          and the biochemistry serves to confirm it afterwards.'
      selected_evidence:
        snippet: Mild elevation of dermatan sulfate was detected in the two subjects investigated by LC-MS/MS.
        supports: SUPPORT
