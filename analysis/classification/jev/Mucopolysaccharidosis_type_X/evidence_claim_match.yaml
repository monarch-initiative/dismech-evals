              label: mucopolysaccharidosis, type 10
        context:
        - path: /pathophysiology/1
          value:
            name: Lysosomal accumulation of 2-O-sulfoglucuronate-capped GAG fragments
            conforms_to: mps_gag_storage#Lysosomal GAG Accumulation
            biological_scale: CELLULAR
            description: 'Partially degraded heparan sulfate, dermatan sulfate, and chondroitin sulfate
              fragments terminating in 2-O-sulfoglucuronate accumulate in lysosomes. This is the GAG-accumulation
              hub of the mps_gag_storage module, but the storage burden is far smaller than in the other
              mucopolysaccharidoses and is engaged in a highly restricted way. Glucuronate-2-O-sulfation
              is an uncommon modification rather than a backbone-defining one, so only the minority of
              chains carrying it are blocked; the bulk of heparan, dermatan, and chondroitin sulfate is
              still catabolized normally. The module''s heparan-sulfate neuronopathic arm and its keratan-sulfate
              skeletal arm are therefore not engaged - keratan sulfate is not an ARSK substrate, and no
              reported patient has CNS disease. Only the dermatan-sulfate connective-tissue arm is engaged,
              and even that partially: dermatan sulfate is the one GAG species reproducibly elevated in
              patient urine, and the downstream disease is confined to chondro-osseous and cardiac connective
              tissue rather than the generalized visceral storage of MPS I or VI.'
            chemical_entities:
            - preferred_term: dermatan sulfate
              modifier: INCREASED
              term:
                id: CHEBI:18376
                label: dermatan sulfate
            - preferred_term: heparan sulfate
              modifier: INCREASED
              term:
                id: CHEBI:28815
                label: heparan sulfate
            - preferred_term: chondroitin sulfate
              modifier: INCREASED
              term:
                id: CHEBI:37397
                label: chondroitin sulfate
            cellular_components:
            - preferred_term: lysosome
              term:
                id: GO:0005764
                label: lysosome
            biological_processes:
            - preferred_term: glycosaminoglycan catabolic process
              modifier: DECREASED
              term:
                id: GO:0006027
                label: glycosaminoglycan catabolic process
            - preferred_term: dermatan sulfate proteoglycan catabolic process
              modifier: DECREASED
              term:
                id: GO:0030209
                label: dermatan sulfate proteoglycan catabolic process
            - preferred_term: chondroitin sulfate proteoglycan catabolic process
              modifier: DECREASED
              term:
                id: GO:0030207
                label: chondroitin sulfate proteoglycan catabolic process
            - preferred_term: heparan sulfate proteoglycan catabolic process
              modifier: DECREASED
              term:
                id: GO:0030200
                label: heparan sulfate proteoglycan catabolic process
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Chondro-osseous storage and epiphyseal-metaphyseal dysplasia
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: Storage in cartilage and bone-forming tissue disturbs epiphyseal and metaphyseal
          development, producing the skeletal disease that dominates MPS X. The intermediate steps between
          fragment accumulation and disturbed endochondral ossification have not been worked out in this
          disorder, so the link is annotated as indirect.
      selected_evidence:
        snippet: The main radiological abnormalities in all four subjects were thickened calvaria, platyspondyly,
          anterior inferior beaking of the thoracolumbar vertebrae, broadening of clavicles and ribs,
          narrowing of lower parts of iliac bones, small epiphyses, metaphysial striae, and hypoplastic
          carpal bones
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1/downstream/0
      evidence_path: /pathophysiology/1/downstream/0/evidence/0
      context_paths:
      - /name
