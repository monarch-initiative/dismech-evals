  362403c95a35f1b92619d8eca59322de1b318dea57ec54c76324ff657069cb18:
    claim:
      about:
        disease:
          name: Mucopolysaccharidosis type X
          disease_term:
            preferred_term: Mucopolysaccharidosis type X
            term:
              id: MONDO:0030524
              label: mucopolysaccharidosis, type 10
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Chondro-osseous storage and epiphyseal-metaphyseal dysplasia
        biological_scale: TISSUE
        description: 'The dominant and near-universal disease arm of MPS X. Cartilage and bone-forming
          tissue develop an epiphyseal, metaphyseal, and vertebral dysplasia that presents clinically
          as hip and knee pain with a waddling gait in mid-childhood, and radiographically as metaphyseal
          striation of the long bones, platyspondyly with anterior vertebral beaking, delayed carpal ossification,
          small epiphyses, and inferior tapering of the ilia with a poorly formed acetabulum. Two features
          of its natural history distinguish it from the other mucopolysaccharidoses: the vertebral changes
          regress with time rather than progressing, while the hip dysplasia progresses in every reported
          patient, so the hip rather than the spine is the long-term burden. The picture is close enough
          to spondyloepiphyseal dysplasia, multiple epiphyseal dysplasia, and bilateral Legg-Calve-Perthes
          disease that every published patient carried one of those labels before sequencing.'
        locations:
        - preferred_term: hip joint
          term:
            id: UBERON:0001486
            label: hip joint
        - preferred_term: epiphysis
          term:
            id: UBERON:0001437
            label: epiphysis
        - preferred_term: vertebra
          term:
            id: UBERON:0002412
            label: vertebra
        - preferred_term: growth plate cartilage
          term:
            id: UBERON:0004129
            label: growth plate cartilage
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: endochondral ossification
          modifier: ABNORMAL
          term:
            id: GO:0001958
            label: endochondral ossification
      selected_evidence:
        snippet: While typical dysostosis multiplex findings were not observed, mild platyspondyly with
          anterior beaking of some vertebral bodies, irregular vertebral endplates, wide ribs, inferior
          tapering of the ilea with a poorly developed acetabulum, irregularity of the central part of
          the femoral head, delayed ossification of the carpals were noted.
        supports: SUPPORT
