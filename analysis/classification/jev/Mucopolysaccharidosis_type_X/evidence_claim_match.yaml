      assertion_type: DifferentialDiagnosis
      assertion:
        name: Legg-Calve-Perthes disease
        description: Bilateral Legg-Calve-Perthes disease is the single most common misclassification
          of MPS X. Idiopathic Legg-Calve-Perthes disease is usually unilateral; bilateral disease, particularly
          with metaphyseal striation, vertebral changes, or delayed carpal ossification, should prompt
          consideration of a mucopolysaccharidosis including MPS X.
        distinguishing_features:
        - Bilaterality favors a storage or dysplasia diagnosis over idiopathic Legg-Calve-Perthes disease.
        - Metaphyseal striation, platyspondyly, and delayed carpal ossification are extrinsic to Legg-Calve-Perthes
          disease.
      selected_evidence:
        snippet: Bilateral LCPD should result in considering the possibility of MPS type X as well as
          other MPS subtypes
        supports: SUPPORT
