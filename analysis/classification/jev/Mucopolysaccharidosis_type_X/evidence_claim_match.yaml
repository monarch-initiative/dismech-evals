      assertion:
        name: Morquio syndrome
        description: MPS IVA and IVB are the differential that has been actively pursued in essentially
          every reported MPS X patient, because the short-trunk skeletal phenotype, platyspondyly, joint
          hypermobility, and enamel defects all overlap. Normal galactosamine-6-sulfatase and beta-galactosidase
          activity excludes MPS IV and leaves MPS X reachable only by sequencing.
        distinguishing_features:
        - Normal GALNS and GLB1 enzyme activity excludes Morquio syndrome.
        - Metaphyseal striation of the long bones favors MPS X.
        - Progressive femoral head osteonecrosis with a Legg-Calve-Perthes appearance favors MPS X.
        - Corneal clouding and marked keratan sulfate excretion favor Morquio syndrome.
        disease_term:
          preferred_term: Morquio syndrome
          term:
            id: MONDO:0018938
