        description: 'Cognition is normal in MPS X. All four index patients attended regular school, two
          at A level, and no neurological deficit or cognitive impairment has been reported in any of
          the ten published patients. This is the mechanistic expectation rather than a surprise: the
          CNS-toxic mucopolysaccharidoses are the heparan-sulfate storers, and although heparan sulfate
          carries the ARSK-dependent modification, the fraction of chains stalled is too small to produce
          a neuronopathic burden. It also means MPS X sits with MPS IV, MPS VI, and MPS IX rather than
          with MPS I, II, III, or VII on the neuronopathic axis.'
        phenotype_term:
          preferred_term: Intellectual disability
