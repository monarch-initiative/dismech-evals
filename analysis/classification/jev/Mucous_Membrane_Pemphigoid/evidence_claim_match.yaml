      assertion_type: Subtype
      assertion:
        name: Ocular MMP
        display_name: Ocular mucous membrane pemphigoid (ocular cicatricial pemphigoid)
        description: MMP with conjunctival involvement, either isolated (pure ocular MMP) or as part of
          multisite disease. Chronic conjunctival inflammation causes subepithelial fibrosis, fornix foreshortening,
          symblepharon, entropion, trichiasis, secondary dry eye and limbal stem-cell failure, and can
          end in corneal keratinization and blindness. About half of ocular cases cannot be confirmed
          by basement-membrane autoantibody tests.
        subtype_term:
          preferred_term: ocular cicatricial pemphigoid
          term:
            id: MONDO:0008109
            label: ocular cicatricial pemphigoid
      selected_evidence:
        snippet: Integrin β4 was considered to be the major and specific autoantigen for pure OMMP.
        supports: SUPPORT
    origin:
