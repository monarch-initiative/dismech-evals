  cc9affb053d34075fd9839799215028bc7300966cdb1b8179564f21e55c58d34:
    claim:
      about:
        disease:
          name: Mucous Membrane Pemphigoid
          disease_term:
            preferred_term: mucous membrane pemphigoid
            term:
              id: MONDO:0018746
              label: mucous membrane pemphigoid
        context: []
      assertion_type: Subtype
      assertion:
        name: Anti-laminin 332 MMP
        display_name: Anti-laminin 332 mucous membrane pemphigoid (anti-epiligrin cicatricial pemphigoid)
        description: MMP with circulating autoantibodies against laminin 332 (formerly epiligrin/laminin
          5), found in roughly 10-25% of patients. Clinically it resembles other MMP and is distinguished
          only serologically; patients frequently have severe multisite disease, and about a quarter have
          an associated, mainly solid, malignancy. No MONDO class exists for this serological subtype,
          so no subtype_term is bound; the genes listed encode the laminin 332 autoantigen chains and
          are not inherited disease genes.
        genes:
        - preferred_term: LAMA3
          term:
            id: hgnc:6483
            label: LAMA3
        - preferred_term: LAMB3
          term:
            id: hgnc:6490
            label: LAMB3
        - preferred_term: LAMC2
          term:
            id: hgnc:6493
            label: LAMC2
      selected_evidence:
        snippet: Anti-laminin (LM) 332-type mucous membrane pemphigoid (MMP) is a rare autoimmune bullous
          disease and was originally discovered as anti-epiligrin cicatricial pemphigoid. Anti-LM332-type
          MMP has clinical manifestations similar to those of other types of MMP and can only be distinguished
          through the detection of circulating autoantibodies against LM332.
        supports: SUPPORT
