    evidence_metadata:
      reference: PMID:27193492
      reference_title: Integrin β4 is a major target antigen in pure ocular mucous membrane pemphigoid.
      evidence_source: HUMAN_CLINICAL
      explanation: In 43 pure ocular MMP sera, integrin beta4 was the dominant autoantigen, distinguishing
        the serological profile of this subtype.
