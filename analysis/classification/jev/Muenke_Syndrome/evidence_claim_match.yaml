      assertion_type: Genetic
      assertion:
        name: FGFR3 P250R Mutation
        gene_term:
          preferred_term: FGFR3
          term:
            id: hgnc:3690
            label: FGFR3
        association: Causative
        notes: 'A single recurrent mutation, c.749C>G (p.Pro250Arg), in FGFR3 causes all cases. This mutation
          is analogous to the P253R mutation in FGFR2 that causes Apert syndrome, affecting the homologous
          position in the Ig-II/III linker region. The mutation alters FGF ligand binding specificity.

          '
      selected_evidence:
        snippet: Here we present 61 individuals from 20 unrelated families where coronal synostosis is
