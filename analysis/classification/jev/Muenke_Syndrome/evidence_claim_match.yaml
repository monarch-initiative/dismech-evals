        context: []
      assertion_type: Treatment
      assertion:
        name: Cranial Vault Surgery
        description: 'Surgical correction of craniosynostosis when indicated. Timing and approach depend
          on severity and uni- vs bilateral involvement. One operation is frequently not the end of it:
          in an operated craniosynostosis cohort, 58% of children with a single-gene cause required repeat
          craniofacial surgery, against 17% of those with a chromosomal cause. The authors read this as
          a mechanistic difference rather than a severity one — a mutation that continuously disrupts
          physiological signalling in the suture keeps driving fusion after the suture is released, whereas
          a chromosomal cause produces a more indolent, secondary craniosynostosis. For an FGFR gain-of-function
          disorder this makes reoperation an expected part of the course, and is a direct argument for
          the pharmacological suture-directed approaches now under investigation.

          '
        treatment_term:
          preferred_term: Craniofacial surgery
          term:
            id: NCIT:C15214
            label: Craniotomy
      selected_evidence:
        snippet: Repeat craniofacial surgery was required for 58% of children with single-gene mutations
          but only 17% of those with chromosomal abnormalities (P = .01).
        supports: SUPPORT
