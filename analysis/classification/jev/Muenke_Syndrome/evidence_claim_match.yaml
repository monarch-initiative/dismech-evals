      assertion_type: Pathophysiology
      assertion:
        name: FGFR3 P250R Gain-of-Function Developmental Signaling
        conforms_to: fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation
        description: 'The P250R mutation in FGFR3 causes altered ligand binding specificity, allowing
          aberrant activation by non-cognate FGF ligands. In cranial sutures, this drives premature osteogenic
          differentiation and suture fusion; in other craniofacial, appendicular skeletal, inner-ear,
          and neurodevelopmental contexts it contributes to the variable extra-sutural phenotype of Muenke
          syndrome. The mechanism differs from achondroplasia-type mutations that predominantly affect
          growth plate chondrocytes.

          '
        cell_types:
        - preferred_term: Osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: FGFR Signaling
          term:
            id: GO:0008543
            label: fibroblast growth factor receptor signaling pathway
        - preferred_term: Cranial Suture Morphogenesis
          term:
            id: GO:0060363
            label: cranial suture morphogenesis
      selected_evidence:
        snippet: Recent evidence suggests that the phenotypic differences may be due to specific alleles
          with varying degrees of ligand-independent activation, allowing the receptor to be constitutively
          active.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
