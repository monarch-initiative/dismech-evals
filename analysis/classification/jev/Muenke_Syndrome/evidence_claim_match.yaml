      assertion_type: Prevalence
      assertion:
        population: Children requiring craniosynostosis surgery, single UK craniofacial unit (born 1993-2002)
        measure_type: PERIOD_PREVALENCE
        prevalence_class: COMMON
        notes: 'Expressed as a share of a surgical craniosynostosis cohort rather than of the population:
          in 326 operated children, 84 had a pathogenic genetic alteration and the FGFR3 p.Pro250Arg (Muenke)
          allele alone accounted for 24% of that genetic group — the single largest contributor. This
          is what makes Muenke the most common syndromic craniosynostosis in practice, and it is a surgical-cohort
          figure, so it is not comparable with the 1-in-30,000 birth incidence above.'
      selected_evidence:
        snippet: 'Eighty-four children (and 64 relatives) had pathologic genetic alterations (86% single-gene
          mutations and 14% chromosomal abnormalities). '
        supports: SUPPORT
