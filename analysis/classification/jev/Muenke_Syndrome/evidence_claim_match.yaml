      reference_title: 'The molecular and genetic basis of fibroblast growth factor receptor 3 disorders:
        the achondroplasia family of skeletal dysplasias, Muenke craniosynostosis, and Crouzon syndrome
        with acanthosis nigricans.'
      evidence_source: HUMAN_CLINICAL
