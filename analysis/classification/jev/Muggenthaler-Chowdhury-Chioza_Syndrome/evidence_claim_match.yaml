        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HYAL2 hyaluronidase 2 deficiency
        description: Biallelic loss-of-function variants in HYAL2 destabilize the hyaluronidase 2 protein,
          dramatically reducing its levels and causing an absence of the GPI-anchored enzyme from the
          cell surface. HYAL2 normally degrades extracellular high-molecular-weight hyaluronan, acting
          alongside HYAL1 as one of the two major mammalian somatic hyaluronidases.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: HYAL2
          term:
            id: hgnc:5321
            label: HYAL2
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic HYAL2 missense and truncating variants destabilize the protein and abolish
            its cell-surface presentation, producing a loss of hyaluronidase 2 function. Nonsense alleles
            yield no detectable protein and missense alleles are degraded or fail GPI-anchored surface
            localization.
        molecular_functions:
        - preferred_term: hyaluronidase 2 activity
          modifier: DECREASED
          term:
            id: GO:0004415
            label: hyalurononglucosaminidase activity
      selected_evidence:
        snippet: Transfection assays demonstrated that the gene mutations destabilize the molecule, dramatically
          reducing HYAL2 protein levels.
        supports: SUPPORT
