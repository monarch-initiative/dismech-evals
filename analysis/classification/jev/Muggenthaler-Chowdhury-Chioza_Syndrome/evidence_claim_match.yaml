        features: Muggenthaler-Chowdhury-Chioza syndrome is caused by biallelic loss-of-function variants
          in HYAL2, which encodes the GPI-anchored cell-surface hyaluronidase 2. The originally reported
          Amish and Saudi Arabian families carried homozygous missense variants, and a later series identified
          additional novel missense and small-deletion variants. Functional and in silico studies indicate
          that the missense variants cluster around the predicted enzymatic active site and destabilize
          protein folding, causing protein instability and loss of the enzyme from the cell surface.
