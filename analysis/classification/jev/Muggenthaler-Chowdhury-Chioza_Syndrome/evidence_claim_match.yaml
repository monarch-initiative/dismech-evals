  a0754b8707c41b79f698bd00cc74e14f528f7ae7aeb9513fdcbd8e73e0325936:
    claim:
      about:
        disease:
          name: Muggenthaler-Chowdhury-Chioza Syndrome
          disease_term:
            preferred_term: Muggenthaler-Chowdhury-Chioza syndrome
            term:
              id: MONDO:0976127
              label: Muggenthaler-Chowdhury-Chioza syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted hyaluronan-dependent developmental morphogenesis
        description: Dysregulated hyaluronan turnover during embryonic development disrupts morphogenesis
          of the tissues in which hyaluronan is a critical, transient matrix constituent - the craniofacial
          structures (palatal shelves, lip), the heart, the vitreous of the eye, and the skeleton - producing
          the orofacial clefting, cardiac malformations, myopia, and skeletal findings that define the
          syndrome. Mechanistically, failure to clear high-molecular-weight hyaluronan drives excess epithelial-to-mesenchymal
          transition and decreased differentiation in the affected cushions and shelves. The Hyal2-/-
          mouse recapitulates these developmental abnormalities, supporting a causal, conserved role for
          HYAL2 in this process.
        biological_scale: TISSUE
      selected_evidence:
        snippet: investigations of Hyal2-/- mice revealed craniofacial abnormalities, including submucosal
          cleft palate.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
