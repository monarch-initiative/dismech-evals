      assertion_type: Genetic
      assertion:
        name: STAG2
        gene_term:
          preferred_term: STAG2
          term:
            id: hgnc:11355
            label: STAG2
        relationship_type: CAUSATIVE
        notes: 'STAG2 (Xq25) encodes stromal antigen 2, a HEAT-repeat subunit of the cohesin complex.
          De novo loss-of-function variants (nonsense, frameshift, splice, and copy-number deletions),
          hemizygous variants, and somatic mosaicism cause MKMS; a hypomorphic missense allele (p.Ser327Asn)
          causes a milder X-linked recessive syndromic intellectual disability at the mild end of the
          spectrum. Scope note: this entry models the loss-of-function/haploinsufficiency arm. A phenotypically
          overlapping but molecularly distinct gain-of-dosage entity from Xq25 microduplication spanning
          STAG2 (Leroy et al. 2016, PMID:25677961) is not modeled here, and somatically acquired STAG2
          mutation in cancer is a separate, clinically distinct phenomenon.'
      selected_evidence:
        snippet: Candidate or recently reported cohesinopathy genes were supported by de novo SNVs/indels
          in STAG1 (N = 3), STAG2 (N = 5), PDS5A (N = 1), and WAPL (N = 1)
        supports: SUPPORT
