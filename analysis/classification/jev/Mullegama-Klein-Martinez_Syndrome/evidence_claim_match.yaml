      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: sex_differential_viability
        hypothesis_label: Sex-Differential Viability and Male Embryonic Lethality
        status: EMERGING
        description: 'A proposed model for the disorder''s X-linked genetics: because STAG2 is dosage-sensitive
          and undergoes X-inactivation, heterozygous females can survive severe (truncating) loss-of-function
          alleles—buffered, though often imperfectly, by the wild-type X and modulated by X-inactivation
          skewing— whereas hemizygous males with equivalent severe alleles are proposed to be largely
          non-viable, so surviving affected males instead carry milder missense alleles. This is inferential
          rather than directly proven in humans.'
      selected_evidence:
        snippet: pathogenic loss-of-function STAG2 variants that affect canonical STAG, SCD and GR domains
          are lethal in males with a 46,XY karyotype
        supports: SUPPORT
