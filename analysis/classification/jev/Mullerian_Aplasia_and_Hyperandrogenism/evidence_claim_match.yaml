      assertion_type: AnimalModel
      assertion:
        name: Wnt4-null mouse
        species: Mouse
        genotype: Wnt4 homozygous null (knockout)
        publication: PMID:9989404
        description: Female Wnt4-null mice lack Mullerian ducts, retain Wolffian ducts and ectopically
          synthesize testosterone in the ovary, which is the combination seen in the human disease. Males
          are normal at birth. The knockout also fails to form nephrons and dies shortly after birth,
          so the adult reproductive phenotype cannot be studied in it.
        modeled_mechanisms:
        - target: Failed Mullerian Duct Formation
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Complete absence of the Mullerian duct in female null embryos.
          limitations: The mouse is homozygous null whereas patients are heterozygous for missense alleles,
            some dominant negative; heterozygous mice are not reported to share the phenotype, so the
            model shows the requirement for WNT4 rather than the human dosage sensitivity.
        - target: Derepressed Ovarian Androgen Biosynthesis
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Null ovaries express testosterone biosynthetic enzymes and secrete testosterone
            into the embryonic circulation.
          limitations: Androgen excess in the mouse is fetal and is read out as Wolffian duct maintenance;
            the human phenotype is adolescent clinical hyperandrogenism, which the perinatal-lethal knockout
            cannot show.
        - target: Impaired Nephron Tubulogenesis
          relationship: RECAPITULATES
          fidelity: LOW
          model_scale: TISSUE
          description: Null metanephric mesenchyme fails to form pretubular aggregates.
          limitations: The null mouse has a severe bilateral nephrogenesis defect, while the human disease
            shows at most unilateral renal agenesis in a single case; the model establishes the renal
            role of WNT4 but not that heterozygous human alleles act through it.
      selected_evidence:
        snippet: Wnt-4 is initially required in both sexes for formation of the Mullerian duct, then Wnt-4
          in the developing ovary appears to suppress the development of Leydig cells; consequently, Wnt-4-mutant
          females ectopically activate testosterone biosynthesis.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9989404
      reference_title: Female development in mammals is regulated by Wnt-4 signalling.
