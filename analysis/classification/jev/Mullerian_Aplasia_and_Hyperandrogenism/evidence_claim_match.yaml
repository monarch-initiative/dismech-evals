      assertion_type: Pathophysiology
      assertion:
        name: Derepressed Ovarian Androgen Biosynthesis
        biological_scale: CELLULAR
        description: In the ovary WNT4 represses the steroidogenic enzymes of the androgen pathway (CYP17A1,
          HSD3B2, and in the mouse also Cyp11a1 and Hsd17b enzymes) and, in the fetal mouse gonad, keeps
          adrenal-type steroidogenic precursor cells from migrating in. Loss of WNT4 releases this repression
          and the ovary synthesizes testosterone. In mice the excess androgen maintains the Wolffian ducts;
          in women it produces acne, hirsutism and raised serum testosterone.
        biological_processes:
        - preferred_term: negative regulation of androgen biosynthetic process
          modifier: DECREASED
          term:
            id: GO:2000180
            label: negative regulation of androgen biosynthetic process
        - preferred_term: androgen biosynthetic process
          modifier: INCREASED
          term:
            id: GO:0006702
            label: androgen biosynthetic process
      selected_evidence:
        snippet: We demonstrate here that testosterone is produced by the ovary of Wnt-4-deficient female
          embryos and is also detected in the embryonic plasma.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
