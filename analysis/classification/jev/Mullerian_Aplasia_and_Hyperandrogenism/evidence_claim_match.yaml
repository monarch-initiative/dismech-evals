        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: NOT_YET_DOCUMENTED
        notes: No population estimate exists. Four distinct pathogenic WNT4 alleles had been reported
          by 2011 (E226G, R83C, L12P and A233T), each in a single patient. Screening of Mullerian anomaly
          cohorts in China (189 women) and India (32 women) found no causal WNT4 variants, so the disorder
          accounts for a very small fraction of Mullerian aplasia.
      selected_evidence:
        snippet: This study screened WNT4 for mutation in 189 Chinese women with Müllerian duct abnormalities
          (10 Mayer-Rokitansky-Küster-Hauser syndrome, five Müllerian aplasia and 174 incomplete Müllerian
          fusion) and detected no perturbation that would indicate a major role for WNT4.
        supports: SUPPORT
    origin:
