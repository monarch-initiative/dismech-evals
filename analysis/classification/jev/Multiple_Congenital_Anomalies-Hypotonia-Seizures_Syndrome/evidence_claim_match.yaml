      assertion_type: Pathophysiology
      assertion:
        name: Deficient Cell-Surface GPI-Anchored Protein Expression
        biological_scale: CELLULAR
        description: Reduced GPI-anchor availability lowers the cell-surface expression of the >150 GPI-anchored
          proteins, including folate receptor, CD59, CD16, CD24, and GPI-anchored alkaline phosphatase.
          Loss of these surface proteins across many cell lineages underlies the multisystem, neurodevelopmental
          phenotype; flow-cytometric reduction of surface GPI-anchored proteins on blood cells is a diagnostic
          biomarker of the pathway defect.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: The expression of GPI linked protein CD59 on fibroblasts from patients as compared to
          that in a control individual showed a 10-fold reduction in expression, confirming the pathogenic
          consequences of the mutation on GPI dependent protein expression.
        supports: SUPPORT
