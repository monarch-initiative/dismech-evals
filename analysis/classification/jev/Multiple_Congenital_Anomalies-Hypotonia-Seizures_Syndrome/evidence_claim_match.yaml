        context: []
      assertion_type: Biochemical
      assertion:
        name: Serum alkaline phosphatase
        biomarker_term:
          preferred_term: serum alkaline phosphatase
        notes: 'Serum ALP is a useful biomarker across the inherited GPI deficiencies but is direction-dependent
          by branch: markedly elevated (hyperphosphatasia) in the HPMRS subgroup, whereas in MCAHS it
          is typically normal or, in the PIGT/MCAHS3 subtype, low. A normal ALP therefore does not exclude
          a GPI-anchor defect.'
      selected_evidence:
        snippet: the serum level of alkaline phosphatase (ALP) serves as another biomarker and clinical
          evidence for IGD
        supports: SUPPORT
