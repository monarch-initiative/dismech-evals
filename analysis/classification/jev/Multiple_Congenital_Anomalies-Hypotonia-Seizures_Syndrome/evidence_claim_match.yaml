            name: MCAHS3
            display_name: MCAHS3 (PIGT)
            description: Autosomal recessive subtype caused by biallelic PIGT variants. PIGT encodes a
              subunit of the GPI transamidase complex that attaches the preassembled GPI anchor to the
              C-terminus of target proteins. MCAHS3 is characterized by neonatal hypotonia, infantile-onset
              seizures, progressive cerebral and cerebellar atrophy, skeletal abnormalities, and characteristically
              low (rather than elevated) serum alkaline phosphatase; some PIGT variants additionally produce
              an autoinflammatory phenotype.
            subtype_term:
              preferred_term: multiple congenital anomalies-hypotonia-seizures syndrome 3
              term:
