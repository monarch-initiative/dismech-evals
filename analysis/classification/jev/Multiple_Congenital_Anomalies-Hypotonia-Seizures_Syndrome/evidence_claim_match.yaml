        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired TNAP-Dependent Vitamin B6 Activation
        biological_scale: MOLECULAR
        description: Tissue-nonspecific alkaline phosphatase (TNAP) is itself a GPI-anchored protein.
          Reduced cell-surface TNAP impairs the extracellular dephosphorylation of pyridoxal 5'-phosphate
          (PLP) to pyridoxal that is required for cellular vitamin B6 uptake; intracellular re-phosphorylation
          to PLP then falls, reducing the activity of PLP-dependent enzymes including those of glutamate/GABA
          metabolism. This provides a distinctive mechanistic rationale for the vitamin B6 (pyridoxine)
          responsiveness observed in a subset of inherited GPI-deficiency seizures, and is mechanistically
          separate from the elevated serum ALP (hyperphosphatasia) seen in the HPMRS branch.
        molecular_functions:
        - preferred_term: alkaline phosphatase activity
          modifier: DECREASED
          term:
            id: GO:0004035
            label: alkaline phosphatase activity
      selected_evidence:
        snippet: In IGD patients, the absence or reduction of cell-surface TNAP diminishes PLP uptake
          and subsequently affects the activities of PLP-dependent enzymes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
