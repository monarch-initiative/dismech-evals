      assertion_type: Diagnosis
      assertion:
        name: Flow-cytometric GPI-anchored protein assay
        description: Beyond molecular genetic confirmation, the GPI defect is validated functionally by
          flow cytometry of cell-surface GPI-anchored proteins (commonly CD55, CD59, and CD16, plus pan-specific
          FLAER) on blood cells or skin fibroblasts. Some variants reduce only a subset of GPI-anchored
          proteins (e.g., transamidase-stage PIGT lowers granulocyte CD16 while sparing CD55/CD59), and
          standard serum-transferrin CDG screening does not detect GPI-anchor defects.
      selected_evidence:
        snippet: Flow cytometry analysis can detect the levels of certain GPI-APs on the cell surface,
          which is typically performed on blood cells and skin fibroblasts.
        supports: SUPPORT
