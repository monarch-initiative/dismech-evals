            term:
              id: MONDO:0007540
              label: multiple endocrine neoplasia type 1
        context: []
      assertion_type: Treatment
      assertion:
        name: Presymptomatic Biochemical and Imaging Surveillance
        notes: 'Curated under `treatments:` as a management intervention, not as a claim that imaging
          or biochemistry is itself therapeutic. In a two-hit predisposition syndrome the second hit cannot
          be prevented, so the only available lever is stage at detection: surveillance is the intervention
          that converts an unavoidable tumor into a resectable one. Where a `target_mechanisms` link is
          present it points at the clinical-outcome node for that reason, and never at an upstream mechanistic
          node.'
        description: The concrete protocol behind this entry's surveillance rationale. Surveillance begins
          in early childhood — age five for calcium, prolactin and IGF-1 — because tumors initiate whenever
          a second hit occurs rather than at a set age, and continues across several organ systems on
          different schedules.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: Magnetic Resonance Imaging
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
      selected_evidence:
        snippet: Annual fasting serum calcium, and consider fasting serum intact PTH from age five years;
          annual serum prolactin, IGF-1, fasting glucose, and insulin from age five years; head MRI every
          three to five years from age five years
        supports: SUPPORT
