        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Menin Loss in Endocrine Tissue
        conforms_to: germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in
          a Susceptible Cell
        description: A parathyroid chief cell, pancreatic islet cell, or anterior pituitary cell now carries
          no functional MEN1 allele. Menin is a nuclear scaffold with no catalytic activity of its own;
          the tumor-suppressive function it provides in these lineages is lost as a whole rather than
          as a single enzymatic step, which is why no one pathway substitutes for it and why the tumors
          that follow are lineage-defined rather than pathway-defined.
        role: central_effector
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: negative regulation of cell population proliferation
          term:
            id: GO:0008285
            label: negative regulation of cell population proliferation
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: By comparing constitutional and tumour tissue genotypes of insulinomas from a pair of
          brothers who had inherited MEN-1 from their mother, we have shown that oncogenesis in these
          cases involves unmasking of a recessive mutation at this locus.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:2894610
      reference_title: Multiple endocrine neoplasia type 1 gene maps to chromosome 11 and is lost in insulinoma.
