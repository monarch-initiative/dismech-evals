              label: multiple endocrine neoplasia type 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic MEN1 Second-Hit Inactivation
        conforms_to: germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type
          Allele
        description: A somatic event removes the retained wild-type MEN1 allele in a single endocrine
          cell, most often as loss of heterozygosity across the 11q13 region. This was demonstrated for
          MEN1 a decade before the gene was cloned, by comparing constitutional with tumour genotypes
          in insulinomas from two brothers who had inherited MEN1 from their mother — the tumours showed
          unmasking of the recessive mutation at the locus. Because the second hit is stochastic and every
          cell of the target tissue is equally primed, hits occur independently many times over, which
          is the direct mechanistic reason MEN1 parathyroid and islet disease is multiglandular and multicentric
          rather than solitary.
        role: amplifier
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: MEN1
            term:
              id: hgnc:7010
              label: MEN1
          variant_origin: SOMATIC
          allelic_hit_role: SECOND_HIT
          allelic_events:
          - LOSS_OF_HETEROZYGOSITY
          - DELETION
          functional_impact_category: LOSS_OF_FUNCTION
          description: Acquired inactivation of the retained wild-type MEN1 allele in tumor tissue, predominantly
            by loss of heterozygosity at 11q13.
      selected_evidence:
        snippet: By comparing constitutional and tumour tissue genotypes of insulinomas from a pair of
          brothers who had inherited MEN-1 from their mother, we have shown that oncogenesis in these
          cases involves unmasking of a recessive mutation at this locus.
        supports: SUPPORT
    origin:
