      assertion_type: Pathophysiology
      assertion:
        name: Germline MEN1 First-Hit Inactivation
        conforms_to: germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation
        description: A heterozygous loss-of-function variant in MEN1 at 11q13 is present in every nucleated
          cell of the carrier. MEN1 encodes menin, a nuclear scaffold protein with no similarity to previously
          characterized proteins, which acts as a tumor suppressor in endocrine tissue. The heterozygous
          state is compatible with normal endocrine function, so the constitutional lesion is a susceptibility
          rather than a disease state — what it changes is that every parathyroid, islet, and pituitary
          cell now sits one event away from complete menin loss.
        role: trigger
        biological_scale: MOLECULAR
        gene:
          preferred_term: MEN1
          modifier: DECREASED
          term:
            id: hgnc:7010
            label: MEN1
        genetic_context:
          gene:
            preferred_term: MEN1
            term:
              id: hgnc:7010
              label: MEN1
          variant_origin: GERMLINE
          allelic_hit_role: FIRST_HIT
          allelic_events:
          - PATHOGENIC_VARIANT
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Constitutional heterozygous MEN1 loss of function; frameshift, nonsense, missense
            and in-frame deletion alleles were all identified in the original mutation-positive families.
      selected_evidence:
        snippet: MEN1 is an autosomal dominant disorder that is due to mutations in the tumor suppressor
          gene MEN1, which encodes a 610-amino acid protein, menin.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
