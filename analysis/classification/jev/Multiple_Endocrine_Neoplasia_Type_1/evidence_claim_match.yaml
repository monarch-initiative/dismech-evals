        conforms_to: germline_two_hit_tumor_predisposition#Early-Onset, Multifocal, and Bilateral Tumor
          Spectrum
        description: 'The clinical signature: parathyroid, pancreatic islet and anterior pituitary tumors,
          with carcinoid, adrenocortical, meningeal and cutaneous lesions in a substantial minority. Tumors
          in MEN1 carriers behave worse than their sporadic counterparts not because the histology differs
          but because they are multiple, larger, more often metastatic, and less amenable to the operations
          that cure the solitary sporadic lesion — the direct clinical expression of the two-hit architecture.
          Life expectancy is reduced accordingly.'
        role: consequence
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Some patients may also develop carcinoid tumors, adrenocortical tumors, meningiomas,
          facial angiofibromas, collagenomas, and lipomas.
