      assertion:
        name: Parathyroidectomy for MEN1 Hyperparathyroidism
        description: 'Surgery for MEN1 hyperparathyroidism is not the single-gland operation used for
          sporadic disease: because every parathyroid cell carries the first hit and disease is multiglandular,
          the operation is subtotal parathyroidectomy with cryopreservation, or total parathyroidectomy
          with autotransplantation. Postoperative hypoparathyroidism is the expected trade-off and must
          be monitored for. Calcimimetics are the fallback when surgery fails or is contraindicated.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Surgical Procedure
