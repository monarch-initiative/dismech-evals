        name: Multicentric Endocrine Tumorigenesis
        conforms_to: germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation
        description: Menin-null cells expand clonally within parathyroid, enteropancreatic and anterior
          pituitary tissue. Because initiation events are independent, MEN1 parathyroid disease is characteristically
          an asynchronous multigland process and MEN1 pancreatic neuroendocrine disease is multicentric
          — a distinction with direct surgical consequence, since resecting one apparently causative lesion
          leaves the remaining primed tissue behind.
        role: effector
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: cell population proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
          modifier: INCREASED
      selected_evidence:
        snippet: MEN1 is characterized by the occurrence of parathyroid, pancreatic islet, and anterior
          pituitary tumors.
        supports: SUPPORT
