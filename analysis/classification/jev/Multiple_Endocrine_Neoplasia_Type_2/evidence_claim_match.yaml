        name: Medullary Thyroid Carcinoma
        frequency: VERY_FREQUENT
        diagnostic: true
        description: 'MTC is the defining neoplasm of MEN2 and the primary cause of morbidity and mortality.
          Develops from thyroid C-cells that produce calcitonin. Penetrance approaches 100% for the highest-risk
          genotypes but is mutation-dependent and is substantially lower for moderate-risk variants and
          in unselected carriers ascertained incidentally, so the frequency band is VERY_FREQUENT rather
          than OBLIGATE. Age of onset likewise depends on RET mutation: MEN2B patients may develop MTC
          in infancy while some FMTC mutations cause later onset. Prophylactic thyroidectomy timing is
          based on mutation risk category.'
        phenotype_term:
          preferred_term: Medullary thyroid carcinoma
          term:
            id: HP:0002865
            label: Medullary thyroid carcinoma
      selected_evidence:
        snippet: MEN2A accounts for 90-95% of childhood MTC cases and is most commonly due to mutations
          in codon 634 of RET. MEN2B is associated with the most aggressive clinical presentation of MTC
          and is almost always due to the Met918Thr mutation of RET.
        supports: SUPPORT
