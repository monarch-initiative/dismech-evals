          do not have lens dislocation or aortic root dilation.
        phenotype_term:
          preferred_term: Marfanoid habitus
          term:
            id: HP:0001519
            label: Disproportionate tall stature
        notes: HP:0001519 carries "Marfanoid habitus" as an exact synonym and is the correct binding for
          the whole-habitus phenotype. Arachnodactyly (HP:0001166) is only one component of the marfanoid
          habitus and understates the finding.
      selected_evidence:
        snippet: Additional features of MEN2B include mucosal neuromas of the lips and tongue, distinctive
          facies with enlarged lips, ganglioneuromatosis of the gastrointestinal tract, and a marfanoid
          habitus.
