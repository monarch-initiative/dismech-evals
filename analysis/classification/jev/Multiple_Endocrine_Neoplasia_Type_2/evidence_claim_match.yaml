      assertion_type: Genetic
      assertion:
        name: RET
        gene_term:
          preferred_term: RET
          term:
            id: hgnc:9967
            label: RET
        association: Germline Activating Mutations
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        notes: RET, which PMID:11786689 places on chromosome 10cen-10q11.2, encodes a receptor tyrosine
          kinase essential for neural crest development. Germline activating mutations cause ligand-independent
          kinase activation, via extracellular-cysteine disulfide dimerization in MEN2A; the MEN2B M918T
          kinase-domain allele activates without forming dimers. MEN2A is most commonly caused by cysteine
          mutations in extracellular domain (codons 609, 611, 618, 620, 634). MEN2B is almost always caused
          by M918T. De novo mutations account for 50% of MEN2B and 5% of MEN2A. Penetrance for MTC approaches
          100% but age of onset varies with mutation.
      selected_evidence:
        snippet: The gene causing all three MEN2 variants is located on chromosome 10cen-10q11.2, and
          is the c-ret proto-oncogene which encodes a tyrosine kinase receptor with cadherin-like and
          cysteine-rich extracellular domains, and a tyrosine kinase intracellular domain. Specific mutations
          of c-ret have been identified for each of the three MEN2 variants.
        supports: SUPPORT
