  24a90b0744ed91c846e7e1eec693da32e68e94feb0a85a17e935ecd256122cff:
    claim:
      about:
        disease:
          name: Multiple Endocrine Neoplasia Type 2
          disease_term:
            preferred_term: multiple endocrine neoplasia type 2
            term:
              id: MONDO:0019003
              label: multiple endocrine neoplasia type 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RET Oncogene Activation
        description: 'Germline activating mutations in RET cause ligand-independent, constitutive tyrosine
          kinase activation. The route differs by subtype: MEN2A extracellular-cysteine alleles activate
          the kinase by forming disulfide-bonded homodimers, while the MEN2B M918T kinase-domain allele
          activates without forming dimers. Unlike tumor suppressor syndromes, only one mutant allele
          is required (no second hit). This represents a gain-of-function oncogene mechanism.'
        biological_processes:
        - preferred_term: transmembrane receptor protein tyrosine kinase signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007169
            label: cell surface receptor protein tyrosine kinase signaling pathway
        genes:
        - preferred_term: RET
          term:
            id: hgnc:9967
            label: RET
        gene_products:
        - preferred_term: RET receptor
          term:
            id: NCIT:C18539
            label: Proto-Oncogene Tyrosine-Protein Kinase Receptor Ret
        notes: Detail on the subtype split stated in the description. MEN2A extracellular-cysteine alleles
          (codons 609, 611, 618, 620, 634) activate the kinase by forming disulfide-bonded homodimers.
          The MEN2B M918T allele sits in the kinase domain and is reported NOT to form dimers, activating
          instead through a proposed cis-autophosphorylation route while remaining ligand-independent.
          Both converge on constitutive kinase activity, which is what the downstream nodes model, so
          the causal chain is the same for both subtypes.
      selected_evidence:
        snippet: identification of a heterozygous germline gain-of-function variant in RET on molecular
          genetic testing.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20301434
      reference_title: Multiple Endocrine Neoplasia Type 2.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Establishes the two claims this node''s "no second hit" statement rests on: the variant
        is gain-of-function, and a single heterozygous allele is diagnostic — the oncogene pattern rather
        than the tumor-suppressor one.'
