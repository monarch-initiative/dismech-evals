      assertion:
        name: RET Molecular Genetic Testing
        description: The diagnosis of MEN2 is established either clinically, in a proband meeting existing
          clinical diagnostic criteria, or molecularly, by identification of a heterozygous germline gain-of-function
          RET variant. Molecular testing is recommended in every individual with a clinical diagnosis
          because surveillance and treatment recommendations are genotype-specific and a confirmed familial
          variant enables cascade testing of at-risk relatives.
        diagnosis_term:
          preferred_term: RET molecular genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        results: A heterozygous germline gain-of-function RET variant establishes the molecular diagnosis.
        notes: 'Molecular testing of RET identifies pathogenic variants and guides management. ATA risk
          categories based on specific mutations determine timing of prophylactic thyroidectomy: highest
          risk (M918T) within first year of life; high risk (codons 634, A883F) before age 5; moderate
          risk (others) individualized.'
      selected_evidence:
        snippet: The diagnosis of MEN2 is established in a proband who fulfills existing clinical diagnostic
          criteria or by identification of a heterozygous germline gain-of-function variant in RET on
          molecular genetic testing.
        supports: SUPPORT
