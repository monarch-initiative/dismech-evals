  069e0fbbddef82f3ce5e01ea1f2b31674f6952ac6b931ffb12b820f473d4e25c:
    claim:
      about:
        disease:
          name: Multiple Epiphyseal Dysplasia
          disease_term:
            preferred_term: Multiple Epiphyseal Dysplasia
            term:
              id: MONDO:0016648
              label: multiple epiphyseal dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SLC26A2 Sulfate Transport Defect and Disturbed Chondrocyte Homeostasis
        description: 'In recessive MED (MED-4), biallelic SLC26A2 variants reduce sulfate uptake into
          chondrocytes, producing undersulfated cartilage proteoglycans and disturbed chondrocyte homeostasis.
          Mutant SLC26A2 protein shows reduced expression and abnormal subcellular localization, and chondrocyte
          differentiation markers are altered (decreased MMP13, COL10A1, and RUNX2; increased aggrecan),
          favoring proliferation while inhibiting differentiation.

          '
        genes:
        - preferred_term: SLC26A2
          term:
            id: hgnc:10994
            label: SLC26A2
        molecular_functions:
        - preferred_term: sulfate transmembrane transporter activity
          term:
            id: GO:0015116
            label: sulfate transmembrane transporter activity
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: Sulfate Transmembrane Transport
          term:
            id: GO:1902358
            label: sulfate transmembrane transport
          modifier: DECREASED
        - preferred_term: Chondrocyte Differentiation
          term:
            id: GO:0002062
            label: chondrocyte differentiation
          modifier: ABNORMAL
      selected_evidence:
        snippet: Overall, our data demonstrate that the variants p.Val341del and p.Ile421Thr in SLC26A2
          cause MED-4 and that these two variants promote chondrocyte proliferation while inhibiting chondrocyte
          differentiation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38956600
      reference_title: Biallelic variants in SLC26A2 cause multiple epiphyseal dysplasia-4 by disturbing
        chondrocyte homeostasis.
      evidence_source: IN_VITRO
      explanation: Functional study in primary human chondrocytes links SLC26A2 variants to disturbed
        chondrocyte differentiation in MED-4.
