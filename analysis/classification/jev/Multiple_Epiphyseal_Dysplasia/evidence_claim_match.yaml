            term:
              id: MONDO:0016648
              label: multiple epiphyseal dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mutant Cartilage Matrix Protein Misfolding and ER Retention
        description: 'In autosomal dominant MED, mutant cartilage extracellular matrix proteins (COMP,
          type IX collagen, matrilin-3) misfold and are retained within the rough endoplasmic reticulum
          of chondrocytes, where they co-retain other ECM proteins. This triggers endoplasmic reticulum
          stress and the unfolded protein response, producing abnormal cartilage matrix. COMP-MED is the
          most common and severe subtype, whereas collagen IX-related MED alters ECM composition with
          relatively prominent knee involvement.

          '
        genes:
        - preferred_term: COMP
          term:
            id: hgnc:2227
            label: COMP
        - preferred_term: MATN3
          term:
            id: hgnc:6909
            label: MATN3
        - preferred_term: COL9A1
          term:
            id: hgnc:2217
            label: COL9A1
        - preferred_term: COL9A2
          term:
            id: hgnc:2218
            label: COL9A2
        - preferred_term: COL9A3
          term:
            id: hgnc:2219
            label: COL9A3
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: Protein Folding
          term:
            id: GO:0006457
            label: protein folding
          modifier: ABNORMAL
        - preferred_term: Response to Endoplasmic Reticulum Stress
          term:
            id: GO:0034976
            label: response to endoplasmic reticulum stress
          modifier: INCREASED
        - preferred_term: Extracellular Matrix Organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: COMP-MED usually shows significant involvement of the capital femoral epiphyses and irregular
          acetabulum; instead, COL9A1-, COL9A2-, and COL9A3-MED appear to have more severe knee involvement
          than hips
        supports: SUPPORT
