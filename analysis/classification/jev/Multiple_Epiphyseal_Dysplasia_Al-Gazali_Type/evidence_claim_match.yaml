        context: []
      assertion_type: Pathophysiology
      assertion:
        name: KIF7 Cilium-Tip Dysfunction and Impaired Hedgehog Signal Transduction
        conforms_to: ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction
        description: KIF7, the human ortholog of Drosophila Costal2, is an immotile kinesin-4 protein
          that localizes to the tip of the primary cilium, where it regulates the GLI transcription factors
          of the Hedgehog pathway. In the absence of Hedgehog ligand KIF7 promotes processing of GLI3
          into its transcriptional repressor form; biallelic loss-of-function KIF7 mutations deregulate
          most GLI target genes and impair GLI3 processing, disrupting the tightly dosed Hedgehog output
          required for skeletal, limb, and craniofacial patterning. The homozygous p.N1060S missense mutation
          identified in Al-Gazali type multiple epiphyseal dysplasia is a hypomorphic allele whose partial
          activity is proposed to account for the distinctive skeletal presentation.
        genes:
        - preferred_term: KIF7
          term:
            id: hgnc:30497
            label: KIF7
        molecular_functions:
        - preferred_term: Microtubule Binding
          term:
            id: GO:0008017
            label: microtubule binding
        biological_processes:
        - preferred_term: Smoothened (Hedgehog) Signaling
          term:
            id: GO:0007224
            label: smoothened signaling pathway
          modifier: ABNORMAL
        - preferred_term: Regulation of Hedgehog Signaling
          term:
            id: GO:0008589
            label: regulation of smoothened signaling pathway
          modifier: DECREASED
        cellular_components:
        - preferred_term: Ciliary Tip
          term:
            id: GO:0097542
            label: ciliary tip
        - preferred_term: Primary Cilium
          term:
            id: GO:0005929
            label: cilium
      selected_evidence:
        snippet: the identification of a homozygous p.N1060S missense mutation in a highly conserved residue
          in KIF7, a regulator of Hedgehog signaling
        supports: SUPPORT
