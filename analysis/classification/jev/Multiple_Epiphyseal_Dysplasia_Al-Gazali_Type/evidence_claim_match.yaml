        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Skeletal and Craniofacial Patterning Defect
        description: Deregulated KIF7-dependent Hedgehog/GLI3 signaling disrupts dosed skeletal and craniofacial
          patterning. The hallmark consequence in Al-Gazali type is multiple epiphyseal dysplasia (abnormal
          development of the epiphyses of the long bones), accompanied by macrocephaly and a distinctive
          facial appearance. This skeletal-predominant presentation distinguishes the disorder from the
          brain- and limb-predominant allelic KIF7 ciliopathies.
        biological_processes:
        - preferred_term: Skeletal System Development
          term:
            id: GO:0001501
            label: skeletal system development
          modifier: ABNORMAL
        - preferred_term: Cartilage Development
          term:
            id: GO:0051216
            label: cartilage development
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
      selected_evidence:
        snippet: The phenotype in our patients partially overlaps with the phenotypes associated with
          those syndromes but they also exhibit some distinctive features including multiple epiphyseal
          dysplasia
        supports: SUPPORT
