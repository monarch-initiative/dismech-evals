          sits at an X or Y position of a Gly-X-Y repeat rather than at the obligate glycine, which is
          the position mutated in the severe, often perinatally lethal type II collagenopathies.
        genes:
        - preferred_term: COL2A1
          term:
            id: hgnc:2200
            label: COL2A1
