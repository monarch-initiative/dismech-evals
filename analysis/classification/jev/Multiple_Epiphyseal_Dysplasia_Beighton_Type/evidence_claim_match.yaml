              label: COL2A1
          allele_type: MISSENSE
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
          description: A heterozygous germline missense allele in a structural collagen chain. Curated
            as dominant-negative rather than loss-of-function because the mutant chain is secreted and
            incorporated into the trimer rather than being degraded, so the proposed mechanism is interference
            by the mutant chain with the network the wild-type chains build.
        molecular_functions:
        - preferred_term: extracellular matrix structural constituent
          term:
            id: GO:0005201
