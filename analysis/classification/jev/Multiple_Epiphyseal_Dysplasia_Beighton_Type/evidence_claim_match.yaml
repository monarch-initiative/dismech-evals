      assertion_type: Diagnosis
      assertion:
        name: Genotype-Directed Placement Within the COL2A1 Arginine-to-Cysteine Series
        description: The COL2A1 arginine-to-cysteine alleles each give a fairly constant, site-specific
          phenotype, so placement within the series is made on the variant rather than on the clinical
          picture. R704C carriers were described as having Stickler dysplasia with brachydactyly; R365C
          gives classic Stickler dysplasia and R789C gives spondyloepiphyseal dysplasia congenita, while
          R75C, R519C and R1076C give spondyloarthropathy with normal stature and no ocular involvement.
          A carrier presenting with the skeletal-ocular-auditory combination but a different arginine-to-cysteine
          allele is therefore a different entity, not a variant of this one.
        diagnosis_term:
          preferred_term: Diagnostic Procedure
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
      selected_evidence:
        snippet: Stickler dysplasia with brachydactyly was observed in patients with the R704C mutation.
        supports: SUPPORT
