      assertion_type: Pathophysiology
      assertion:
        name: Preserved Chondrocyte Proteostasis
        biological_scale: CELLULAR
        description: Cells expressing R704C collagen II show no splicing of XBP-1 and no activated caspase-3,
          meaning neither the unfolded protein response nor apoptosis is engaged. This is the mechanistic
          point on which the disorder separates from both the C-terminal COL2A1 dysplasias and the COMP-
          and MATN3-related forms of multiple epiphyseal dysplasia, in all of which mutant cartilage protein
          is retained in the endoplasmic reticulum and the resulting stress response is the proximate
          cause of chondrocyte dysfunction.
        biological_processes:
        - preferred_term: response to unfolded protein
          term:
            id: GO:0006986
            label: response to unfolded protein
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        notes: This node deliberately carries no `downstream` edge. It records a process that is *not*
          perturbed, which is a substantive mechanistic finding for this allele but cannot be a cause
          of any consequence node.
      selected_evidence:
        snippet: In non-transfected cells or cells expressing WT, R75C, R134C and R704C collagens, no
          active caspase-3 staining could be detected
        supports: SUPPORT
        directness: DIRECT
