        name: Secreted, Correctly Folded Mutant Type II Collagen Heterotrimer
        biological_scale: MOLECULAR
        description: Type II collagen is a homotrimer of three alpha-1(II) chains, so in a heterozygote
          roughly seven of every eight molecules incorporate at least one mutant chain. Recombinant R704C
          collagen II is trypsin-resistant, gives a normal collagen circular-dichroism spectrum, and is
          recovered mainly from the culture supernatant, so the mutant chain reaches the extracellular
          space carrying an unpaired cysteine that the wild-type sequence does not have.
        cellular_components:
        - preferred_term: collagen trimer
          term:
            id: GO:0005581
            label: collagen trimer
          modifier: ABNORMAL
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
      selected_evidence:
        snippet: WT, R75C, R134C and R704C collagens were trypsin resistant, while R740C and R789C collagens
          were completely degraded
        supports: SUPPORT
        directness: DIRECT
    origin:
