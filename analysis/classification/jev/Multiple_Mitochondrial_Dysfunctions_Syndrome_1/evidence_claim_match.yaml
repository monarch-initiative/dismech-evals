        prompt: 'Do the available invertebrate and rodent Fe-S models reproduce the cavitating leukoencephalopathy
          and pulmonary hypertension of human NFU1 deficiency, given that the sex-based phenotype discrepancy
          described in rat models is not seen in patients?

          '
        rationale: 'The C. elegans allelic series reports cellular and neuromuscular phenotypes only,
          and the 2026 review notes that a sex-based phenotype difference in rat MMDS models is not recapitulated
          in the human case literature, so translational validity of the animal models for the human CNS
          and pulmonary disease is an open question.

          '
      selected_evidence:
        snippet: A key difference between established animal models of this disorder and human cases published
          to date is that the previously described sex-based phenotype discrepancy in rats was not recapitulated
          in this review.
        supports: SUPPORT
