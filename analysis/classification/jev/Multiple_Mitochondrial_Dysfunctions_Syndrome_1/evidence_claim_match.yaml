        name: Biallelic NFU1 Loss of Function
        description: 'Pathogenic variants abolish mature mitochondrial NFU1 or disrupt its structure so
          that it can no longer receive a [4Fe-4S] cluster. NFU1 dimerises and reductively assembles a
          bridging [4Fe-4S] cluster from two [2Fe-2S] clusters donated by the scaffold ISCU2 and the carrier
          ISCA1, aided by ferredoxin 2, through a conserved hydrophobic patch at its C-terminal helix;
          disease variants near the cluster-binding site perturb folding and oligomerisation and block
          this acceptance.

          '
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: 4 iron, 4 sulfur cluster binding
          term:
            id: GO:0051539
            label: 4 iron, 4 sulfur cluster binding
          modifier: DECREASED
      selected_evidence:
        snippet: we identified the initial scaffold protein, mitochondrial ISCU (ISCU2) and the secondary
          carrier, ISCA1, as the direct donors of Fe-S clusters to mitochondrial NFU1
        supports: SUPPORT
