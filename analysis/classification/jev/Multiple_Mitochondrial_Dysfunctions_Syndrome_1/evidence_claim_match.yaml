  c842a0aa7ada4fc39fba630acd59fe6b46bd47ace0944b770778b44118751de0:
    claim:
      about:
        disease:
          name: Multiple Mitochondrial Dysfunctions Syndrome 1
          disease_term:
            preferred_term: Multiple mitochondrial dysfunctions syndrome 1
            term:
              id: MONDO:0011582
              label: multiple mitochondrial dysfunctions syndrome 1
        context: []
      assertion_type: Genetic
      assertion:
        name: NFU1
        gene_term:
          preferred_term: NFU1
          term:
            id: hgnc:16287
            label: NFU1
        relationship_type: CAUSATIVE
        notes: 'Biallelic NFU1 (2p13.3) variants cause MMDS1; about 20 variants (missense, splice, frameshift,
          exon deletion) are reported and over half of patients are compound heterozygous. The Iberian
          founder p.Gly208Cys (c.622G>T) and the splice-region c.545+5G>A / p.Arg182Gln alleles are recurrent;
          structural work shows that Gly208Cys and Gly189Arg perturb NFU1 folding and oligomerisation
          and abolish cluster acceptance from physiological donors. Variants form an allelic series with
          residual function tracking phenotype severity.

          '
        variants:
        - name: c.622G>T (p.Gly208Cys)
          description: 'Founder missense variant, homozygous in nine of the ten original Spanish patients;
            near the cluster-binding site, it increases dimerisation, perturbs secondary structure and
            severely reduces the ability of NFU1 to accept an Fe-S cluster.

            '
          type: missense
          clinical_significance: PATHOGENIC
        - name: c.545G>A (p.Arg182Gln)
          description: 'Missense variant near the exon 6 splice donor found in the first Canadian family;
            it causes abnormal splicing of exon 6 and no mature protein is detectable in fibroblast mitochondria.

            '
          type: missense
          clinical_significance: PATHOGENIC
        - name: c.565G>A (p.Gly189Arg)
          description: 'Recurrent missense variant, reported compound heterozygous with p.Cys210Phe in
            an Italian cavitating-leukoencephalopathy case and homozygous in a Turkish family with marked
            intrafamilial variability; in vitro it increases flexibility, decreases stability and shifts
            NFU1 toward monomer, impairing cluster acceptance.

            '
          type: missense
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: To date, 20 NFU1 variants have been reported and the unique contributions of each variant
          to MMDS1 pathogenesis is unknown. Given that over half of MMDS1 individuals are compound heterozygous
          for different NFU1 variants, it is valuable to investigate individual variants in an isogenic
          background.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34449775
      reference_title: Allele-specific mitochondrial stress induced by Multiple Mitochondrial Dysfunctions
        Syndrome 1 pathogenic mutations modeled in Caenorhabditis elegans.
      evidence_source: MODEL_ORGANISM
      explanation: Variant count and compound heterozygosity rate.
