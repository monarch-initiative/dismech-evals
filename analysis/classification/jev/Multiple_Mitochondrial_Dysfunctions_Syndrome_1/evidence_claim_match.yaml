          in the human case literature, so translational validity of the animal models for the human CNS
          and pulmonary disease is an open question.

          '
      selected_evidence:
        snippet: Importantly, the penetrance of the PAH phenotype was found to be more prevalent in females
          than in males, replicating the established sex difference among patients with PAH.
        supports: SUPPORT
