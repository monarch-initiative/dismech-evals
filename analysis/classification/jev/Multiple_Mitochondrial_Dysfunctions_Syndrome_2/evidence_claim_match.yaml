            term:
              id: MONDO:0013675
              label: multiple mitochondrial dysfunctions syndrome 2
        context:
        - path: /genetic/0
          value:
            name: BOLA3
            gene_term:
              preferred_term: BOLA3
              term:
                id: hgnc:24415
                label: BOLA3
            relationship_type: CAUSATIVE
            notes: 'Biallelic BOLA3 (2p13.1) variants cause MMDS2; the disease is caused by loss of the
              mitochondrial isoform 1, which alone rescues patient fibroblasts. Truncating alleles (c.123dupA
              p.Glu42Argfs*13, p.Arg46*) and missense alleles at cluster-ligand or partner-binding residues
              (p.His96Arg, p.Ile67Asn, p.Cys59Tyr) are reported; structural studies show that His96Arg
              and Ile67Asn abolish a functional BOLA3-[2Fe-2S]-GLRX5 heterocomplex, whereas Cys59Tyr perturbs
              but does not abolish cluster binding, matching its milder phenotype.

              '
          role: ancestor
      assertion_type: Variant
      assertion:
        name: c.287A>G (p.His96Arg)
        description: 'Homozygous missense at a conserved [2Fe-2S] ligand residue, associated with a severe
          phenotype of leukodystrophy with hypertrophic cardiomyopathy and death at 10 months; the mutant
          still binds GLRX5 but forms an aberrant heterocomplex unable to assemble a [4Fe-4S] cluster
          on NFU1.

          '
        type: missense
        clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Size exclusion chromatography, NMR, UV-visible, circular dichroism, and EPR spectroscopy
          characterization have shown that the His96Arg mutation does not impair the interaction of BOLA3
          with its protein partner GLRX5
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0/variants/1
      evidence_path: /genetic/0/variants/1/evidence/0
      context_paths:
