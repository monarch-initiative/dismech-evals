          term:
            id: hgnc:19857
            label: ISCA2
        relationship_type: CAUSATIVE
        notes: 'Biallelic loss-of-function variants in ISCA2 (iron-sulfur cluster assembly factor 2) cause
          MMDS4. The recurrent homozygous missense founder variant c.229G>A (p.Gly77Ser) is found in consanguineous
          Arab (predominantly Saudi Arabian) families and accounts for most reported cases; several sporadic
          non-founder variants have been reported in patients of other ancestries and affect all regions
          of the ISCA2 protein.

          '
        variants:
        - name: c.229G>A (p.Gly77Ser)
          description: 'Recurrent homozygous missense founder variant in consanguineous Arab (predominantly
            Saudi Arabian) families; the most frequently reported ISCA2 allele and the one in the original
            MMDS4 description.

            '
          type: missense
          clinical_significance: PATHOGENIC
        - name: c.355G>A (p.Ala119Thr)
          description: 'Novel non-founder missense variant reported in a consanguineous Iranian family,
            predicted to eliminate a helix motif in the Fe-S biosynthesis domain; the third ISCA2 patient
            reported worldwide at the time and outside the Saudi founder background.

            '
          type: missense
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: We identified a homoallelic missense founder mutation in ISCA2 leading to mitochondrial
          depletion and reduced complex I activity as well as decreased ISCA2, ISCA1 and IBA57 expression
          in fibroblasts.
        supports: SUPPORT
