            description: 'ISCA2 normally heterodimerizes with ISCA1 (with IBA57) to catalyze the reductive
              fusion of two GLRX5-derived [2Fe-2S] clusters into a [4Fe-4S] cluster, the terminal step
              of mitochondrial iron-sulfur cluster biogenesis. Loss of ISCA2 impairs [4Fe-4S] cluster
              supply while sparing [2Fe-2S] proteins.

              '
            biological_scale: MOLECULAR
            biological_processes:
            - preferred_term: '[4Fe-4S] cluster assembly'
              term:
                id: GO:0044572
                label: '[4Fe-4S] cluster assembly'
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Failure to Mature 4Fe-4S Client Enzymes
        causal_link_type: DIRECT
      selected_evidence:
        snippet: which results in a deficiency of mitochondrial respiratory complexes and the impaired
          function of lipoic-acid-dependent enzymes
        supports: SUPPORT
    origin:
