        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: isca1_mettl17_translation_branch
        kind: KNOWLEDGE_GAP
        prompt: Does ISCA1 loss also attenuate mitochondrial protein synthesis by leaving the mitoribosome
          assembly factor METTL17 without its [4Fe-4S] cluster, and if so does that branch contribute
          to the disease?
        attaches_to:
        - pathophysiology#Failure of Mitochondrial [4Fe-4S] Cluster Assembly
        rationale: 'A third client branch is proposed in the literature and is deliberately not curated
          as a node. METTL17 is a mitoribosome biogenesis factor carrying a [4Fe-4S] cluster, and the
          paper that reports it proposes, in its own words, that the cluster is inserted via an ISCA1-NFU1
          node. The measured consequence in that paper is in the sibling genes: fibroblasts from BOLA3
          and NFU1 patients show attenuated mitochondrial translation. Nobody has measured it in ISCA1
          cells, and the deep-research report that raised this branch says so in its own limitations.
          So the entry carries the question rather than the mechanism. If it holds, the respiratory chain
          deficit in this disease is partly a translation defect and not only a failure to mature individual
          complexes, which would change what a rescue experiment should target.'
        proposed_experiments:
        - experiment_id: isca1_mitochondrial_translation_measurement
          name: Mitochondrial translation and METTL17 maturation in ISCA1 patient cells
          description: Measure mitochondrial protein synthesis by metabolic labelling, and small mitoribosomal
            subunit assembly, in ISCA1 patient fibroblasts against the BOLA3 and NFU1 cells where the
            defect is already established.
          readouts:
          - name: Mitochondrial protein synthesis rate
            target: pathophysiology#Failure of Mitochondrial [4Fe-4S] Cluster Assembly
            direction: DECREASED
            interpretation: Attenuated synthesis in ISCA1 cells would establish the translation branch
              in this disease rather than only in its siblings.
      selected_evidence:
        snippet: fibroblasts from subjects suffering from 'multiple mitochondrial dysfunction' syndrome
          due to mutations in BOLA3 or NFU1 display previously unrecognized attenuation of mitochondrial
          protein synthesis
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
