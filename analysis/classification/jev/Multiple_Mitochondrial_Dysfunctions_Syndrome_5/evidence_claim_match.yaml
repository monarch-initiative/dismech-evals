        name: Lipoic Acid Synthase Failure
        biological_scale: MOLECULAR
        description: Lipoic acid synthase is itself a [4Fe-4S] enzyme, so a defect in the assembly machinery
          also removes the cofactor from the enzyme that makes lipoate. Proteins that depend on a lipoyl
          group - pyruvate dehydrogenase, alpha-ketoglutarate dehydrogenase, and the glycine cleavage
          system - lose activity as a second, parallel consequence. This is the branch responsible for
          the non-ketotic hyperglycinemia reported across the MMDS series.
