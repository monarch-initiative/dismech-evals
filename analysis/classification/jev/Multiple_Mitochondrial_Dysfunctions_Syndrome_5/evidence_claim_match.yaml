              label: multiple mitochondrial dysfunctions syndrome 5
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Mitochondrial [4Fe-4S] Cluster Assembly
        biological_scale: MOLECULAR
        description: 'Mitochondrial Fe-S biogenesis runs in two steps. The core machinery builds a [2Fe-2S]
          cluster and hands it to GRX5; a second, separately staffed step converts that into [4Fe-4S]
          clusters and inserts them into client apoproteins. ISCA1 is the organizing node of that second
          step, interacting with both ISCA2 and NFU1 (which do not interact with each other) and forming
          the transient ternary complex through which the cluster is handed on. Losing ISCA1 therefore
          stalls maturation of every mitochondrial [4Fe-4S] client at once, which is why a single gene
          defect produces a multi-enzyme phenotype. The client class is wider than the two downstream
          nodes name: purified ISCA1 also matures apo-aconitase, so aconitase deficiency belongs to this
          lesion even though the human reports measure complex I, complex II and lipoylation specifically.'
        molecular_functions:
        - preferred_term: 4 iron, 4 sulfur cluster binding
          term:
            id: GO:0051539
            label: 4 iron, 4 sulfur cluster binding
          modifier: DECREASED
        biological_processes:
        - preferred_term: iron-sulfur cluster assembly
          term:
            id: GO:0016226
            label: iron-sulfur cluster assembly
          modifier: DECREASED
      selected_evidence:
        snippet: ISCA1 works as the promoter of the interaction between ISCA2 and NFU1 being able to determine
          the formation of a transient ISCA1-ISCA2-NFU1 ternary complex.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33711344
      reference_title: ISCA1 Orchestrates ISCA2 and NFU1 in the Maturation of Human Mitochondrial [4Fe-4S]
        Proteins.
      evidence_source: IN_VITRO
      explanation: NMR structural work establishing why ISCA1 is the non-redundant node of this step,
        which is the reason its loss affects the whole client class.
