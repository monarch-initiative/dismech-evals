      assertion_type: Pathophysiology
      assertion:
        name: Biallelic ISCA1 Loss of Function
        biological_scale: MOLECULAR
        description: ISCA1 encodes a 129-amino-acid mitochondrial A-type carrier protein with a conserved
          C-terminal HESB domain. The founder p.(Glu87Lys) substitution sits in that domain at a highly
          conserved residue and abolishes a salt bridge to Lys49, destabilizing the protein; the independent
          p.V10G substitution lies in the uncleaved presequence and impairs both mitochondrial import
          and stability, reducing ISCA1 protein to a fraction of normal. Both routes converge on loss
          of functional ISCA1 in the mitochondrial matrix.
        genes:
        - preferred_term: ISCA1
          term:
            id: hgnc:28660
            label: ISCA1
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          zygosity: HOMOZYGOUS
          variant_origin: GERMLINE
      selected_evidence:
        snippet: Analyses of protein stability via I-Mutant (score 7) and Eris web-server (score 0.64
          ΔΔG kcal/mol) are also consistent in predicting that this variant leads to destabilization of
          ISCA1 protein.
        supports: SUPPORT
