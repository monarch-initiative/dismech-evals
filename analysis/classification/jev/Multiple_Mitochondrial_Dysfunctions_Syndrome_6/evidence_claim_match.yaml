          cases the Leigh-like features are often associated with febrile illness. Prompt treatment of
          intercurrent infection is the corresponding clinical priority.

          '
        notes: 'exposure_term left unbound. ECTO has no clean single term for "intercurrent febrile illness
          / minor infection as a metabolic-decompensation trigger"; the concept is a nonspecific physiological
          stressor rather than a chemical or defined-agent exposure. The claim is nonetheless evidenced
          for PMPCB disease as cited below.

          '
