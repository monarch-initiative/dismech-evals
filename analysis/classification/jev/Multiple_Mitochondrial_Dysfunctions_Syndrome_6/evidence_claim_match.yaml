      assertion_type: Pathophysiology
      assertion:
        name: PMPCB Catalytic Subunit Deficiency
        biological_scale: MOLECULAR
        description: 'Biallelic PMPCB variants reduce PMPCB protein levels and the proteolytic activity
          of the mitochondrial processing peptidase (MPP). PMPCB is the catalytic beta subunit of MPP,
          a heterodimeric metalloendopeptidase that cleaves the N-terminal presequences of the majority
          of nuclear-encoded mitochondrial precursor proteins imported into the matrix. The alpha subunit
          (PMPCA) recognizes substrate while the beta subunit carries the catalytic metalloprotease site;
          both are required for processing.

          '
        genes:
        - preferred_term: PMPCB
          term:
            id: hgnc:9119
            label: PMPCB
        molecular_functions:
        - preferred_term: metalloendopeptidase activity
          term:
            id: GO:0004222
            label: metalloendopeptidase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: mitochondrial protein processing
          term:
            id: GO:0034982
            label: mitochondrial protein processing
          modifier: DECREASED
      selected_evidence:
        snippet: PMPCB encodes the catalytic subunit of the essential mitochondrial processing protease
          (MPP), which is required for maturation of the majority of mitochondrial precursor proteins.
        supports: SUPPORT
