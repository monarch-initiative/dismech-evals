              label: multiple mitochondrial dysfunctions syndrome 6
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Mitochondrial Presequence and Frataxin Processing
        biological_scale: MOLECULAR
        description: 'Loss of MPP proteolytic activity impairs cleavage of imported mitochondrial precursor
          proteins. Frataxin, an especially sensitive MPP substrate, is not matured normally, so its processing
          intermediate accumulates in patient fibroblasts, induced pluripotent stem cells, and differentiated
          neuroepithelial stem cells. Because frataxin is a core factor for iron-sulfur cluster biogenesis,
          its failed maturation is the principal indirect route by which a protease defect produces the
          Fe-S phenotype shared with the rest of the MMDS series and with Friedreich ataxia.

          '
        biological_processes:
        - preferred_term: mitochondrial protein processing
          term:
            id: GO:0034982
            label: mitochondrial protein processing
          modifier: DECREASED
      selected_evidence:
        snippet: showed reduced PMPCB levels and accumulation of the processing intermediate of frataxin,
          a sensitive substrate for MPP dysfunction.
        supports: SUPPORT
