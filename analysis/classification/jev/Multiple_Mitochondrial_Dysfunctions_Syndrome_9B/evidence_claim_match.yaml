      assertion_type: ProgressionInfo
      assertion:
        notes: 'Variable. Severe early-onset cases present in infancy with Leigh syndrome features and
          may be fatal. Late-onset cases show progressive optic atrophy, auditory neuropathy, and ataxia
          with survival into the second decade and beyond. 18% mortality in published cohorts (10/57 with
          outcome data). Overall survival ~82%. Deaths concentrated in severe early-onset phenotype (infants).
          Key prognostic factors include genotype (variants with residual function predict milder disease),
          age of onset (earlier onset predicts worse prognosis), and specific variants (p.Arg386Trp homozygotes
          tend toward severe early-onset). No validated prognostic biomarkers exist, though residual FDXR
          enzyme activity in fibroblasts may correlate with disease severity.

          '
      selected_evidence:
        snippet: 'Mortality is high, with 18% of patients, often infants, passing from complications.

          '
        supports: SUPPORT
