      assertion:
        species: Mouse
        genotype: Fdxr(R389Q/R389Q)
        background: B6/129S
        description: 'Spontaneous/naturally occurring homozygous mouse mutant carrying the p.Arg389Gln
          variant, affecting the corresponding residue (human Arg392) but with a different amino acid
          substitution (Gln vs Trp). Closely recapitulates human disease with progressive optic atrophy
          (54% retinal ganglion cell loss at 6 months), peripheral neuropathy (reduced sciatic nerve conduction),
          ataxia (rotarod and Morris Water Maze failure), neurodegeneration with gliosis (hippocampus,
          cerebellum, cortex), and mitochondrial complex I and III deficiencies. FDXR activity 33-49%
          of wild-type. Shorter lifespan and spontaneous tumors. Used for preclinical AAV gene therapy
          studies. Limitations: seizures not prominently reported, hearing loss not characterized, infection-triggered
          deterioration not studied, single homozygous variant does not model compound heterozygous genotypes.

          '
        associated_phenotypes:
        - Progressive vision loss
