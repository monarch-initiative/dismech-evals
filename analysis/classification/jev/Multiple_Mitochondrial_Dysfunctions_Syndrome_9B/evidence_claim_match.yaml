      assertion_type: Pathophysiology
      assertion:
        name: Ferroptosis via NRF2 Pathway Disruption
        description: 'Mitochondrial iron overload from FDXR deficiency increases lipid peroxidation in
          inner mitochondrial and plasma membranes, leading to ferroptotic cell death. Disruption of the
          NRF2 pathway and its target gene SLC7A11 plays a key role in this pathogenic process. NRF2 activation
          with omaveloxolone mitigates pathogenesis in preclinical models, suggesting ferroptosis as a
          tractable therapeutic target.

          '
        biological_processes:
        - preferred_term: Lipid Oxidation
          term:
            id: GO:0034440
            label: lipid oxidation
          modifier: INCREASED
        - preferred_term: Response to Oxidative Stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
      selected_evidence:
        snippet: 'We demonstrated increased lipid peroxidation in the inner mitochondrial and plasma membranes,
          resulting in susceptibility to ferroptosis. Closer examination revealed that disruption of the
          NRF2 pathway and its target gene SLC7A11 appear to play important roles in this pathogenic process.

          '
        supports: SUPPORT
