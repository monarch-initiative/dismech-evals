      assertion_type: Treatment
      assertion:
        name: AAV Gene Therapy (Preclinical)
        description: 'AAV-PHP.B vector carrying Fdxr cDNA demonstrated remarkable efficacy in mouse model.
          Neonatal administration (P1-P2, 2x10^11 gc/g via facial vein) prevented optic atrophy, restored
          retinal ganglion cell density (54% loss prevented), restored sciatic nerve myelination and conduction,
          improved motor function (19/20 treated mice escaped Morris Water Maze vs 1/20 untreated), restored
          mitochondrial complex I/IV activity, reduced neuroinflammation, and maintained expression at
          5 months. FDXR cDNA is 1.485 kb, suitable for AAV packaging. No human trials registered as of
          2024. No visible adverse effects in treated mice at 5 months.

          '
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
        target_phenotypes:
        - preferred_term: Optic atrophy
          term:
            id: HP:0000648
            label: Optic atrophy
        - preferred_term: Peripheral neuropathy
          term:
            id: HP:0009830
            label: Peripheral neuropathy
      selected_evidence:
        snippet: 'AAV-Fdxr treatment reversed almost all the symptoms of the mutants (Fdxr R389Q/R389Q
          ). This therapy also improved the electronic conductivity of the sciatic nerves, prevented optic
          atrophy, improved mobility, and restored mitochondrial complex function.

          '
        supports: SUPPORT
