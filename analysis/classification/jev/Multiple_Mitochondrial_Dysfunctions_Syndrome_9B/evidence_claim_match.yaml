          and hyperglycemia. High veterinary relevance for breeding decisions. Demonstrates cross-species
          conservation of FDXR-related neurodegeneration. Clinically characterized by Willis et al. 2024;
          the FDXR genetic cause (intronic variant inducing a cryptic exon in intron 2) was subsequently
