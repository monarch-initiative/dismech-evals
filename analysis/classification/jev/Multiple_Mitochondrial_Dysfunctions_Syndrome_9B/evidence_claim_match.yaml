      assertion_type: Environmental
      assertion:
        name: Intercurrent systemic infection
        description: 'Systemic infection is the documented precipitant in this disease. Compromised mitochondria
          cannot meet the increased metabolic demand of illness, and affected patients may deteriorate
          abruptly, including from an asymptomatic baseline. Prompt treatment of infection is the corresponding
          clinical priority.

          '
        notes: 'Renamed from "Metabolic Stress Susceptibility". The previous name stated a host susceptibility
          and a recommendation rather than the exposure, and bundled three stressors of unequal evidential
          standing. Infection is evidenced for FDXR specifically, as cited below. Prolonged fasting and
          extreme physical exertion are general precautions in primary mitochondrial disease and are not
          documented for this gene; they were removed from the description rather than carried as an unsourced
          claim.

          '
      selected_evidence:
        snippet: However, oxidative stress in the setting of systemic infection can precipitate severe
          symptoms with distinct imaging manifestations, including confluent white matter signal abnormality,
          longitudinally extensive spinal cord lesions, and optic nerve enhancement.
        supports: SUPPORT
