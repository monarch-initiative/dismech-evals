  09738994254213c74c4fd5de4ab0dec16e43112a3695f140518c00944409dcb0:
    claim:
      about:
        disease:
          name: Multiple Myeloma
          disease_term:
            preferred_term: multiple myeloma
            term:
              id: MONDO:0009693
              label: plasma cell myeloma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mm_obesity_accelerated_progression
        prompt: Severe obesity is epidemiologically associated with increased multiple myeloma risk and
          mortality, yet the mechanisms by which obesity accelerates myeloma progression are unknown.
          Which obesity-driven factors — adipokine dysregulation (leptin, adiponectin, IL-6, TNF-alpha),
          altered marrow lipid and metabolic flux, and immune disruption — causally promote clonal plasma
          cell expansion and impair anti-tumor immunity, and do these mechanisms operate universally or
          only in specific genetic and immune-competent backgrounds?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Clonal Plasma Cell Proliferation
        - pathophysiology#Immune Dysregulation
        - pathophysiology#Bone Marrow Failure
        rationale: 'Epidemiologic data robustly link severe obesity to higher multiple myeloma incidence
          and mortality, and Fairfield et al. (2026) confirmed in CoMMpass clinical data that moderate-to-severe
          obesity at diagnosis associates with increased patient mortality and distinct myeloma-cell gene-expression
          and pathway signatures. They further showed that high-fat-diet obesity accelerated myeloma only
          in the immune-competent C57BL/6J 5TGM1 semisyngeneic model — not in the SCID-beige xenograft
          or the Vk*MYC model — implicating the host immune system rather than a tumor-intrinsic effect
          alone. However, the underlying mechanisms remain unknown: it is unresolved which specific immune
          populations (T cells, NK cells, macrophages, neutrophils, regulatory T cells) are disrupted,
          and how obesity-associated adipokines and altered marrow lipid/metabolic flux mechanistically
          drive plasma-cell survival and proliferation. It is also unclear whether the obesity-altered
          myeloma-cell gene signatures activate stemness, drug-resistance, or immune-evasion programs.
          Resolving whether obesity acts primarily through impaired anti-tumor immunity, a permissive
          adipocyte-rich marrow niche, or tumor-intrinsic reprogramming would clarify whether obesity
          is a modifiable target for myeloma prevention and which interventions to prioritize.'
        proposed_experiments:
        - experiment_id: exp_mm_obesity_immune_niche_dissection
          name: Immune and metabolic dissection of obesity-accelerated myeloma in the 5TGM1 model
          description: Use the immune-competent HFD-fed C57BL/6J 5TGM1-TKGFP+/Luc+ semisyngeneic model
            with bioluminescent tumor tracking to compare obese versus lean mice. Profile bone-marrow
            and tumor-infiltrating immune populations by flow cytometry and single-cell RNA-seq, quantify
            circulating and marrow adipokines and lipid metabolites, and perform selective immune-cell
