        - preferred_term: lipid metabolism
          modifier: ABNORMAL
          term:
            id: GO:0006629
            label: lipid metabolic process
        locations:
        - preferred_term: bone marrow
          term:
            id: UBERON:0002371
            label: bone marrow
      selected_evidence:
        snippet: obesity-accelerated multiple myeloma is coupled with immune disruptions in mice and that
          gene expression is altered in myeloma cells from patients with obesity, further implicating
          obesity as a critical modifier for prevention.
        supports: SUPPORT
