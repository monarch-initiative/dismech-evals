  f828e068f050cf972a56506ed6f793a10dc96ec0fc1ccc0f9e84692f69b439e7:
    claim:
      about:
        disease:
          name: Multiple Myeloma
          disease_term:
            preferred_term: multiple myeloma
            term:
              id: MONDO:0009693
              label: plasma cell myeloma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Osteolytic Bone Disease
        description: Myeloma cells activate osteoclasts and suppress osteoblasts through secretion of
          RANKL, MIP-1alpha, and DKK1. This uncoupled bone remodeling leads to lytic bone lesions, pathologic
          fractures, hypercalcemia, and bone pain. The RANK/RANKL/OPG axis is central to myeloma bone
          disease.
        cell_types:
        - preferred_term: osteoclast
          term:
            id: CL:0000092
            label: osteoclast
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: osteoclast differentiation
          modifier: INCREASED
          term:
            id: GO:0030316
            label: osteoclast differentiation
        - preferred_term: bone resorption
          modifier: INCREASED
          term:
            id: GO:0045453
            label: bone resorption
      selected_evidence:
        snippet: Elevated levels of osteoclast activating factors such as RANK/RANKL/OPG, MIP-1-α., TNF-α,
          IL-3, IL-6, and IL-11 increase bone resorption by osteoclast stimulation, differentiation, and
          maturation, whereas osteoblast inhibitory factors such as the Wnt/DKK1 pathway, secreted frizzle
          related protein-2, and runt-related transcription factor 2 inhibit osteoblast differentiation
          and formation leading to decreased bone formation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34201396
