        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BMP Signaling Dysregulation
        description: 'NOG mutations reduce noggin''s ability to antagonize BMPs (particularly BMP2, BMP4,
          and GDF5), leading to excessive BMP signaling in developing joints. This causes progressive
          ossification and fusion of joints that would normally remain separate. GDF5 mutations cause
          gain-of-function changes that similarly enhance BMP pathway activity in joint development, and
          the SYNS4 GDF6 p.Y444N variant raises BMP signaling by the same route, resisting noggin-mediated
          antagonism.

          '
        biological_processes:
        - preferred_term: BMP Signaling Pathway
          term:
            id: GO:0030509
            label: BMP signaling pathway
        - preferred_term: Limb Development
          term:
            id: GO:0060173
            label: limb development
        - preferred_term: Chondrocyte Differentiation
          term:
            id: GO:0002062
            label: chondrocyte differentiation
        genes:
        - preferred_term: NOG
          term:
            id: hgnc:7866
            label: NOG
        - preferred_term: GDF5
          term:
            id: hgnc:4220
            label: GDF5
        - preferred_term: GDF6
          term:
            id: hgnc:4221
            label: GDF6
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
      selected_evidence:
        snippet: this gain of function is caused by strongly reduced affinity of GDF5-S94N to the BMP/GDF
          antagonist noggin and the consequential lack of noggin inhibition.
        supports: SUPPORT
