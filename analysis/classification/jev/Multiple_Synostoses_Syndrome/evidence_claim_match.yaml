              label: multiple synostoses syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Abnormal Joint Cavitation
        description: 'Normal joint formation requires interzone specification and subsequent cavitation.
          Both routes above disrupt this process: excess BMP signaling from loss of noggin antagonism
          (SYNS1) or from noggin-resistant GDF5/GDF6 ligands (SYNS2, SYNS4), and loss of FGF9 receptor
          signaling at the prospective joint (SYNS3). Either way joint space formation fails and synostosis
          is progressive.

          '
        biological_processes:
        - preferred_term: Ossification
          term:
            id: GO:0001503
            label: ossification
      selected_evidence:
        snippet: noggin has both species-specific and joint-specific dosage-dependent roles during joint
          formation.
        supports: SUPPORT
