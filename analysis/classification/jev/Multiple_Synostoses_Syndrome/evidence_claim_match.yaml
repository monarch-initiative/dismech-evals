  e8c87efad0ae23d3775a797e99d998b9c38b0e38e09cf8c7fce413ff5d79428e:
    claim:
      about:
        disease:
          name: Multiple Synostoses Syndrome
          disease_term:
            preferred_term: Multiple synostoses syndrome
            term:
              id: MONDO:0017923
              label: multiple synostoses syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FGF9 Signaling Loss in the Joint Interzone
        description: 'SYNS3 is caused by the FGF9 p.S99N substitution, which is secreted normally but
          binds FGFR poorly, so FGF signaling in the developing joint is reduced rather than increased.
          FGF9 normally restrains mesenchymal cells from differentiating into chondrocytes at the prospective
          joint site and sustains Gdf5 expression there; the mutant protein does neither, and the interzone
          fails to form. This is a separate route to the same synostoses from the BMP-side lesions in
          SYNS1, SYNS2 and SYNS4, and it converges on the same failure of joint separation.

          '
        biological_processes:
        - preferred_term: FGF receptor signaling in the joint interzone
          term:
            id: GO:0008543
            label: fibroblast growth factor receptor signaling pathway
          modifier: DECREASED
        - preferred_term: Embryonic skeletal joint morphogenesis
          term:
            id: GO:0060272
            label: embryonic skeletal joint morphogenesis
        - preferred_term: Mesenchymal cell differentiation at the prospective joint
          term:
            id: GO:0048762
            label: mesenchymal cell differentiation
        genes:
        - preferred_term: FGF9
          term:
            id: hgnc:3687
            label: FGF9
        cell_types:
        - preferred_term: Mesenchymal stem cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
      selected_evidence:
        snippet: Importantly, the binding of FGF9(S99N) to its receptor is severely impaired although
          the dimerization ability of mutant FGF9 itself or with wild-type FGF9 is not detectably affected,
          providing a basis for the defective FGFR signaling.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19589401
      reference_title: Multiple synostoses syndrome is due to a missense mutation in exon 2 of FGF9 gene.
      evidence_source: IN_VITRO
      explanation: Identifies impaired receptor binding, not impaired dimerization or secretion, as the
        molecular defect behind reduced FGF signaling in SYNS3.
