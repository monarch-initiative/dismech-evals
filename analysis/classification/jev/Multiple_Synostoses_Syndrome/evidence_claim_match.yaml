      assertion_type: Genetic
      assertion:
        name: GDF6 Mutations (SYNS4)
        gene_term:
          preferred_term: GDF6
          term:
            id: hgnc:4221
            label: GDF6
        association: Causative
        notes: 'GDF6 encodes growth/differentiation factor 6, a BMP-family ligand. The SYNS4 subtype was
          defined by a GDF6 missense variant (p.Y444N) segregating in a six-generation Chinese pedigree;
          the substitution lies in the region that binds GDF6 receptors and the BMP antagonist noggin,
          and the mutant ligand resists noggin antagonism and signals more strongly than wild-type GDF6.
          A separate five-generation family with SYNS4 carries a chromosomal breakpoint 3'' of GDF6 that
          reduces GDF6 expression rather than a coding gain-of-function change.

          '
      selected_evidence:
        snippet: Using genetic data obtained from a six-generation Chinese family, we identified a missense
          variant in GDF6 (NP_001001557.1; p.Y444N) that fully segregates with a novel autosomal dominant
          synostoses (SYNS) phenotype, which we designate as SYNS4.
        supports: SUPPORT
