  81a9559b9717276ddc5e311b3440b225a57a097597638b3a2c6a330981f6493d:
    claim:
      about:
        disease:
          name: Multiple System Atrophy
          disease_term:
            preferred_term: multiple system atrophy
            term:
              id: MONDO:0007803
              label: multiple system atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Dysfunction and Coenzyme Q10 Deficiency
        description: 'Mitochondrial bioenergetic failure, particularly involving the coenzyme Q10 (CoQ10)
          biosynthetic pathway, contributes to MSA pathogenesis. Reduced expression of COQ2 and COQ7 enzymes
          in disease-affected brain regions correlates with reduced ATP levels. Plasma CoQ10 is significantly
          lower in MSA patients than controls, independent of COQ2 genotype. This bioenergetic compromise
          renders vulnerable neurons and oligodendrocytes susceptible to degeneration.

          '
        biological_processes:
        - preferred_term: Oxidative Phosphorylation
          term:
            id: GO:0006119
            label: oxidative phosphorylation
        genes:
        - preferred_term: COQ2
          term:
            id: hgnc:25223
            label: COQ2
      selected_evidence:
        snippet: We found a reduction in ATP levels in disease-affected regions of MSA brain that associated
          with reduced expression of COQ2 and COQ7, supporting the concept that abnormalities in the biosynthesis
          of coenzyme Q10 play an important role in the pathogenesis of MSA.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31736705
      reference_title: Reductions in COQ2 Expression Relate to Reduced ATP Levels in Multiple System Atrophy
