        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Central Autonomic Network Degeneration
        biological_scale: TISSUE
        description: 'Degeneration of the autonomic control network in the brainstem and spinal cord.
          The affected nuclei span the hypothalamus, pontine and medullary autonomic centres, the thoracolumbar
          intermediolateral column and Onuf''s nucleus, and postmortem work places the lesion in the preganglionic
          autonomic neurons of the brainstem and spinal cord rather than in the periphery. Bladder failure
          is localized separately from cardiovascular failure, the urinary retention being attributed
          specifically to pontine and sacral lesions.

          '
        locations:
        - preferred_term: brainstem
          term:
            id: UBERON:0002298
            label: brainstem
        - preferred_term: spinal cord
          term:
            id: UBERON:0002240
            label: spinal cord
      selected_evidence:
        snippet: Clinical manifestations include orthostatic hypotension, incomplete bladder emptying,
          erectile dysfunction, and constipation.
        supports: SUPPORT
