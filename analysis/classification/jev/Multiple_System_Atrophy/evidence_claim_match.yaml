      assertion_type: Pathophysiology
      assertion:
        name: Oligodendroglial Alpha-Synuclein Accumulation (GCIs)
        description: 'The pathological hallmark of MSA is the aberrant accumulation of phosphorylated
          alpha-synuclein in oligodendrocytes, forming glial cytoplasmic inclusions (GCIs), also known
          as Papp-Lantos bodies. Unlike Parkinson''s disease where alpha-synuclein accumulates in neurons,
          MSA uniquely affects oligodendrocytes. MSA is therefore classified as a primary oligodendrogliopathy
          with secondary neuronal degeneration. The GCIs disrupt oligodendrocyte function, impair myelin
          maintenance, and ultimately lead to axonal degeneration.

          '
        cell_types:
        - preferred_term: Oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        biological_processes:
