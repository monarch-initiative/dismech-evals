  8acac8435021f9dc246f65669422847ac625d4050fb32ab8c292920a01f5cb38:
    claim:
      about:
        disease:
          name: Multiple System Atrophy
          disease_term:
            preferred_term: multiple system atrophy
            term:
              id: MONDO:0007803
              label: multiple system atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Axon-to-Oligodendrocyte Transfer of Alpha-Synuclein
        description: 'GCIs may originate through transfer of aggregated alpha-synuclein from neurons to
          oligodendrocytes via axonal pruning. In this model, alpha-synuclein fibrils first accumulate
          in neuronal axons as Lewy neurites, and oligodendrocytes then prune and engulf the diseased
          axonal segments, incorporating the aggregated protein as GCIs. This explains the paradox that
          mature oligodendrocytes do not normally express alpha-synuclein yet harbor fibrillar inclusions
          containing the protein.

          '
        cell_types:
        - preferred_term: Oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Phagocytosis
          term:
            id: GO:0006909
            label: phagocytosis
      selected_evidence:
        snippet: We conclude that the 1B fibril strain can rapidly induce an α-Syn pathology typical of
          MSA in mice, in which the appearance of GCIs results from the pruning of diseased axonal segments
          containing aggregated α-Syn.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36830639
      reference_title: Oligodendrocytes Prune Axons Containing alpha-Synuclein Aggregates In Vivo - Lewy
        Neurites as Precursors of Glial Cytoplasmic Inclusions in Multiple System Atrophy?
      evidence_source: MODEL_ORGANISM
      explanation: This mouse model study provides direct experimental evidence that GCIs result from
        oligodendrocytes pruning alpha-synuclein-laden axonal segments, supporting the neuron-to-oligodendrocyte
        transfer model.
