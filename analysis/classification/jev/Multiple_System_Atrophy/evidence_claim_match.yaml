  e4128e1ffe807d9e928162da47bdcbfbd7f0de173e643122479b0a6dff3d5f4f:
    claim:
      about:
        disease:
          name: Multiple System Atrophy
          disease_term:
            preferred_term: multiple system atrophy
            term:
              id: MONDO:0007803
              label: multiple system atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Demyelination and Connexin Dysfunction
        description: 'MSA is characterized by extensive demyelination in olivopontocerebellar and striatonigral
          pathways. A distinctive pattern of "distal oligodendrogliopathy-type" demyelination occurs,
          with early loss of myelin-associated glycoprotein (MAG) before myelin oligodendrocyte glycoprotein
          (MOG). Early and extensive loss of connexin 32 (Cx32) from myelin, and its redistribution into
          oligodendrocyte cytoplasm co-localizing with GCIs, disrupts inter-glial communication and accelerates
          myelin breakdown.

          '
        cell_types:
        - preferred_term: Oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        biological_processes:
        - preferred_term: Myelination
          modifier: DECREASED
          term:
            id: GO:0042552
            label: myelination
      selected_evidence:
        snippet: Myelin-associated glycoprotein, but not myelin oligodendrocyte glycoprotein, was preferentially
          decreased in Stage I, suggesting distal oligodendrogliopathy type demyelination.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36368713
      reference_title: Early and extensive alterations of glial connexins, distal oligodendrogliopathy
        type demyelination, and nodal/paranodal pathology are characteristic of multiple system atrophy.
      explanation: This neuropathology study demonstrates that selective MAG loss precedes MOG loss in
        early MSA, establishing the distal oligodendrogliopathy pattern of demyelination.
