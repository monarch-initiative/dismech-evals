          term:
            id: hgnc:11138
            label: SNCA
      selected_evidence:
        snippet: The pathological hallmark of multiple system atrophy (MSA) is aberrant accumulation of
          phosphorylated α-synuclein in oligodendrocytes, forming glial cytoplasmic inclusions (GCIs).
        supports: SUPPORT
