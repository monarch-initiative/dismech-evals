          The co-localization of autophagic organelles with alpha-synuclein aggregates suggests that impaired
          protein clearance mechanisms contribute to GCI formation and accumulation, consistent with broader
          proteostasis failure in alpha-synucleinopathies.

          '
        cell_types:
