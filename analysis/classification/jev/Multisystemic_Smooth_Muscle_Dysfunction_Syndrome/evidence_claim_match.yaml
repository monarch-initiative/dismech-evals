        description: Sapropterin dihydrochloride (Kuvan) was identified by molecular dynamics simulation
          and in silico drug screening as a candidate capable of restoring actin polymerization disrupted
          by the ACTA2 p.R179H variant. Patient-derived fibroblasts showed improved actin organization
          on treatment, and off-label use in a first-in-human pediatric patient with ACTA2-MSMDS was followed
          by observed cerebrovascular stabilization.
        notes: n-of-1 off-label experience only; sapropterin is not approved for MSMDS, and the authors
          state that further studies are needed to establish a robust therapeutic effect and to elucidate
          the mechanism underlying the observed cerebrovascular benefit.
