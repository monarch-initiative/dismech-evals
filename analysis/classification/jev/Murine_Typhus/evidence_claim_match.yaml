      assertion_type: Pathophysiology
      assertion:
        name: Rickettsial Ribosomal Translation (Tetracycline Target)
        description: Rickettsia typhi, like other bacteria, depends on 70S-ribosome translation of its
          mRNA. Doxycycline, a tetracycline, binds the 30S ribosomal subunit and blocks aminoacyl-tRNA
          delivery to the A site, arresting bacterial protein synthesis. This ribosomal target — not a
          cell-wall target — is why a tetracycline rather than a beta-lactam is the treatment of choice.
        role: therapeutic_vulnerability
        conforms_to: bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome
        biological_processes:
        - preferred_term: Translation
          term:
            id: GO:0006412
            label: translation
      selected_evidence:
        snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
        supports: SUPPORT
