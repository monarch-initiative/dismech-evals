      assertion_type: Pathophysiology
      assertion:
        name: Obligate Intracellular Niche (Cell-Penetrant Drug Requirement)
        description: R. typhi is an obligate intracellular bacterium that replicates free in the cytoplasm
          of host endothelial cells. Effective therapy therefore requires an antibiotic that accumulates
          inside host cells; doxycycline does, whereas beta-lactams cannot reach the cytoplasmic organism
          — the lifestyle gating that further constrains drug choice beyond the ribosomal target.
        role: intrinsic_resistance
        conforms_to: intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion
        biological_processes:
        - preferred_term: Biological Process Involved in Interaction with Host
          term:
            id: GO:0051701
            label: biological process involved in interaction with host
      selected_evidence:
        snippet: The intracellular location of some microorganisms allow them to resist antibiotics with
          poor ability to penetrate eukaryotic cell membranes, such as the beta-lactam compounds.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18611821
      reference_title: Intracellular organisms.
      evidence_source: OTHER
      explanation: Review stating that the intracellular niche confers resistance to poorly cell-penetrant
        antibiotics such as beta-lactams, the gating principle this node represents. Evidence source is
        OTHER as this is a review article.
