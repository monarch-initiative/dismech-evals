    evidence_metadata:
      reference: PMID:42323079
      reference_title: Skeletal muscle-specific deficiency of Rab geranylgeranyl transferase beta subunit
        induces myopathy and exacerbates the symptoms caused by HMG-CoA reductase deficiency in mice.
      evidence_source: MODEL_ORGANISM
      explanation: 'This result is about HMGCR, not GGPS1: it concerns mice lacking the rate-limiting
        enzyme two steps upstream, and it is cited here only to establish that depletion of GGPP is by
