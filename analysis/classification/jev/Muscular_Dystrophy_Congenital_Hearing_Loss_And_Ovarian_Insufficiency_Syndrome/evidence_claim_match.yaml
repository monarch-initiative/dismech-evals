        description: 'Hypergonadotropic ovarian insufficiency in postpubertal 46,XX individuals, confirmed
          by menopausal follicle-stimulating hormone levels in the setting of amenorrhoea or infertility.
          It was present in every postpubertal female of the founding cohort. Like the hearing loss it
          is not obligatory: in the 2022 cohort only one woman had reached adulthood and she had no clinical
          signs of it, though a twelve-year-old had a raised FSH. Male gonadal function has never been
          formally assessed in this disease, and none of the five adult men in the founding cohort had
          fathered a child.'
        phenotype_term:
          preferred_term: Premature ovarian insufficiency
          term:
            id: HP:0008209
            label: Premature ovarian insufficiency
        frequency: FREQUENT
      selected_evidence:
        snippet: This report consolidates the disease-causing role of biallelic variants in GGPS1 and
          demonstrates that hearing loss and ovarian insufficiency might be a variable feature of the
          GGPS1-associated muscular dystrophy.
        supports: SUPPORT
