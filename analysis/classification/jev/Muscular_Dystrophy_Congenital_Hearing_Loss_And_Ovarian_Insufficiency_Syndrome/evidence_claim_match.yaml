            label: Decreased level of coenzyme Q10 in skeletal muscle
        presence: Absent
        notes: A negative biochemical finding, and a useful one. GGPP feeds the ubiquinone branch of the
          isoprenoid pathway as well as the prenylation branch, so coenzyme Q10 deficiency is the obvious
          alternative mechanism and would carry a directed treatment. Muscle coenzyme Q10 was normal in
          the one patient measured, and an empirical oral coenzyme Q10 trial in another produced no improvement.
          The item is bound to the HPO term for the abnormality that was looked for and not found (`HP:0034369`,
          decreased muscle coenzyme Q10), with `presence` recording that it was absent; this is a negative
          finding curated as one, not an assertion that patients are coenzyme Q10 deficient. One patient
          measured and one patient treated is thin evidence either way.
      selected_evidence:
        snippet: The CoQ10 level in muscle was determined to be normal in Patient P1.
        supports: REFUTE
