              the disease: homozygotes develop with a markedly slowed rate, reach no further than embryonic
              day 12.5 and are not recovered alive thereafter. The authors state plainly that this left
              them unable to do mechanistic work relevant to the human phenotype, which is why almost
              everything mechanistic in this entry comes from patient cells or from tissue-specific mouse
              models of other genotypes.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Myofiber Degeneration with Disordered Autophagy
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: Homozygous animals die as embryos and never develop a postnatal muscular dystrophy,
          so no muscle phenotype, hearing phenotype or ovarian phenotype can be observed.
        limitations: 'Embryonic lethality precludes phenotyping of any kind, so the model yields no readout
          of weakness, creatine kinase, histology, hearing or fertility. The species difference is the
          substantive limitation: mouse appears far less tolerant of this allele than human, since the
          corresponding human compound heterozygotes were liveborn and survived into their twenties. Nothing
          about the human disease can be inferred from this model beyond the severity of the allele.'
      selected_evidence:
        snippet: Thus, detailed mechanistic studies relevant to the human phenotype were not possible
          in this mouse strain.
        supports: SUPPORT
