            term:
              id: MONDO:0859189
              label: muscular dystrophy, congenital hearing loss, and ovarian insufficiency syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Hypomorphic GGPS1 Missense Variants
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'All reported disease alleles are missense. In the founding cohort four of the five
          clustered in a five-amino-acid stretch at the start of the eleventh alpha-helix, on the outward-facing
          surface of the hexamer rather than in the catalytic barrel, and the fifth (P15S) sits in the
          helix involved in assembling the hexamer. The alleles are hypomorphic rather than null: they
          leave measurable enzyme activity, and a complete loss of GGPPS is incompatible with multicellular
          life, so a biallelic null genotype is not expected to be seen in a living patient.'
        genetic_context:
          gene:
            preferred_term: GGPS1
            term:
              id: hgnc:4249
              label: GGPS1
          allele_type: SNV
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: Reported genotypes are homozygous missense in consanguineous families and compound
            heterozygous missense elsewhere. No biallelic null genotype has been reported.
      selected_evidence:
        snippet: The mutations do not abolish enzymatic activity of this essential enzyme, but with a
          highly distinctive genotype/phenotype correlation define the mevalonate pathway as essential
          for muscle, hearing, and endocrine functions.
        supports: SUPPORT
