        context: []
      assertion_type: Genetic
      assertion:
        name: GGPS1 (geranylgeranyl diphosphate synthase 1)
        gene_term:
          preferred_term: GGPS1
          term:
            id: hgnc:4249
            label: GGPS1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: The only gene associated with this disease and the only causal gene MONDO links to MONDO:0859189.
          All reported disease alleles are missense; no biallelic null genotype has been reported and
          none is expected, since complete inactivation of GGPPS is incompatible with multicellular survival
          and the mouse null is not viable. Four of the five founding alleles cluster within five residues
          at the start of helix 11, on the outer surface of the hexamer rather than in the catalytic barrel,
          and that domain is conserved in animals but not in plants, which the discovery authors read
          as evidence for an animal-specific function beyond bulk catalysis. A separate, monoallelic GGPS1
          association with bisphosphonate-related atypical femoral fracture exists and is a different
          claim entirely; see `differential_diagnoses` and the entry notes.
      selected_evidence:
        snippet: The pathogenic variants fell within a specific 5 amino acid region toward the C terminus
          around the start of helix 11, with as of yet unclear function
        supports: SUPPORT
