              label: muscular dystrophy, congenital hearing loss, and ovarian insufficiency syndrome
        context:
        - path: /experimental_models/0
          value:
            name: Patient-derived MyoD-converted myoblasts and myotubes with laser membrane injury
            experimental_model_type: PRIMARY_CELL_CULTURE
            description: Dermal fibroblasts from affected individuals converted to myoblasts with lentiviral
              MyoD and differentiated to myotubes, then wounded with a focal laser pulse in the presence
              of the membrane-impermeant dye FM 1-43 so that resealing can be followed as dye exclusion.
              This is the system that produced the only cellular phenotype demonstrated in patient material,
              and it is also the system in which GGPPS activity was measured at about half of control.
            publication: PMID:32403198
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Sarcolemmal Membrane Repair
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: CELLULAR
        description: Reproduces, in cells carrying the patients' own genotypes, a delay in resealing the
          wounded plasma membrane and a roughly twofold increase in the proportion of cells that fail
          to reseal at all.
        limitations: MyoD-converted fibroblasts are not mature innervated muscle, and a laser wound is
          not the eccentric contraction injury that damages muscle in life. The assay reports resealing
          kinetics and not the downstream dystrophic process, so the link from this defect to the biopsy
          findings remains inferential. The measurement pools cells from several patients with different
          genotypes, so it cannot distinguish allele-specific effects.
        readouts:
        - name: FM 1-43 dye entry after focal laser injury
          target: Impaired Sarcolemmal Membrane Repair
          direction: INCREASED
          interpretation: Greater dye entry means slower resealing, which is the direct measure of the
            membrane-repair defect this node claims.
        - name: GGPPS enzymatic activity in patient myoblasts
          target: Impaired Sarcolemmal Membrane Repair
          direction: DECREASED
          interpretation: Establishes that the cells showing the repair defect really do carry a measurable
            enzymatic deficit, which is what ties the cellular phenotype to the genotype.
      selected_evidence:
        snippet: We observed greater dye entry, indicating a poor cell membrane repair, in both the patient
          myoblasts and myotubes as compared to the healthy controls
        supports: SUPPORT
