          step in the isoprenoid branch several steps below it. The two entries agree mechanistically
          rather than competing: the LGMDR28 entry argues from mouse rescue experiments that the myopathy
          of HMGCR deficiency is caused by depletion of the geranylgeranyl branch rather than of sterol,
          and this disease is what a lesion placed directly in that branch looks like. Both are hypomorphic-missense
          diseases of an essential enzyme whose complete loss is lethal.'
        distinguishing_features:
        - LGMDR28 is a limb-girdle dystrophy with markedly raised creatine kinase and no hearing or ovarian
          involvement; this syndrome adds congenital sensorineural hearing loss and primary ovarian insufficiency.
        - The LGMDR28 biopsy is characteristically unremarkable, without necrosis, fibrosis or inflammation;
          the biopsy here is frankly dystrophic and adds excess autophagic material and enlarged mitochondria.
        - LGMDR28 onset spans birth to the fourth decade and is often adult; this syndrome is congenital
          to preschool in onset.
        - LGMDR28 has a directed metabolite-replacement candidate, oral mevalonolactone, which supplies
          the pathway product below the block; there is no equivalent for GGPS1, since the block is below
          the branch point and mevalonate would not bypass it.
      selected_evidence:
        snippet: Our findings demonstrate that myopathy induced by HMGCR deficiency is primarily driven
          by GGPP depletion in a mouse model.
        supports: SUPPORT
        directness: INDIRECT
