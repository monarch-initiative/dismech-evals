  3dc00042babe4befa069f288686a4ef8e31549cf6390872cc078c4463655e6e5:
    claim:
      about:
        disease:
          name: Muscular Dystrophy, Congenital Hearing Loss, and Ovarian Insufficiency Syndrome
          disease_term:
            preferred_term: muscular dystrophy, congenital hearing loss, and ovarian insufficiency syndrome
            term:
              id: MONDO:0859189
              label: muscular dystrophy, congenital hearing loss, and ovarian insufficiency syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Geranylgeranyl Pyrophosphate Depletion
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: 'Reduced GGPPS activity is taken to lower the cellular geranylgeranyl pyrophosphate
          pool. This step is inferred rather than measured: no GGPP measurement has been reported in tissue
          or cells from a patient with this syndrome. It is marked provisional for that reason. Independent
          support that GGPP depletion is a mechanistically consequential state in muscle comes from mouse
          work on the upstream enzyme HMG-CoA reductase, where the myopathy of HMGCR deficiency is attributed
          to GGPP depletion.'
        biological_processes:
        - preferred_term: geranylgeranyl diphosphate biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0033386
            label: geranylgeranyl diphosphate biosynthetic process
        - preferred_term: isoprenoid biosynthesis
          modifier: DECREASED
          term:
            id: GO:0008299
            label: isoprenoid biosynthetic process
      selected_evidence:
        snippet: Our findings demonstrate that myopathy induced by HMGCR deficiency is primarily driven
          by GGPP depletion in a mouse model.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
