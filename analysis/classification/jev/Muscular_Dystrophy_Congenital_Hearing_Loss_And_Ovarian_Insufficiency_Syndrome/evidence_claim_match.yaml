            term:
              id: MONDO:0859189
              label: muscular dystrophy, congenital hearing loss, and ovarian insufficiency syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Perrault syndrome
        disease_term:
          preferred_term: Perrault syndrome
          term:
            id: MONDO:0017312
            label: Perrault syndrome
        description: The closest differential and the reason the lump/split decision for this entry is
          a real one. Perrault syndrome is sensorineural hearing loss with primary ovarian insufficiency
          in 46,XX individuals -- two of this disease's three cardinal features -- and GGPS1 was independently
          nominated as a Perrault candidate gene from a Perrault cohort in the same year this syndrome
          was named. dismech curates Perrault syndrome separately in `kb/disorders/Perrault_Syndrome.yaml`,
          where GGPS1 appears as a gene whose phenotype overlaps Perrault syndrome. The two entries are
          deliberately cross-referenced rather than merged.
        distinguishing_features:
        - Perrault syndrome does not include muscle disease; the discovery paper for this syndrome states
          that Perrault syndrome manifests with hearing loss and ovarian insufficiency but without muscle
          involvement.
        - 'Here the muscular dystrophy is the constant feature and the two Perrault features are the variable
          ones, which inverts the Perrault definition: hearing loss was present in only 46% of one cohort
          and a 2024 patient had normal hearing.'
        - The mechanisms are different in kind. Perrault syndrome is unified by failure of mitochondrial
          gene expression and proteostasis, with peroxisomal exceptions; this is an isoprenoid and protein-prenylation
          lesion.
        - MONDO and OMIM assign a separate identity (MONDO:0859189, OMIM:619518) rather than a numbered
          PRLTS designation, and MONDO does not place this term under Perrault syndrome.
        - The practical discriminator is a creatine kinase and a muscle examination in anyone presenting
          with the Perrault dyad, since the dystrophy is what changes management.
        - 'The case against this separation should be stated too: a 2026 review lists GGPS1 among the
          fifteen principal Perrault syndrome genes, so a reader who takes that classification is entitled
          to regard this disease as a Perrault subtype with muscle involvement.'
      selected_evidence:
        snippet: Perrault syndrome, caused by mutations in various mitochondrial and peroxisomal genes,
          clinically manifests with sensorineural hearing loss and primary ovarian insufficiency but without
          muscle involvement
        supports: SUPPORT
    origin:
