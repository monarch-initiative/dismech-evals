  0fd8cdbca103d048b9513e4f19ff09e6b5165f67142c9c9bdd83c0204ebc98e2:
    claim:
      about:
        disease:
          name: Muscular Dystrophy, Congenital Hearing Loss, and Ovarian Insufficiency Syndrome
          disease_term:
            preferred_term: muscular dystrophy, congenital hearing loss, and ovarian insufficiency syndrome
            term:
              id: MONDO:0859189
              label: muscular dystrophy, congenital hearing loss, and ovarian insufficiency syndrome
        context:
        - path: /animal_models/1
          value:
            name: Oocyte-specific Ggpps conditional knockout mouse
            species: Mouse
            genotype: Ggpps flox/flox; Ddx4-Cre (oocyte-specific conditional knockout)
            publication: PMID:28072828
            description: Not built as a model of this disease -- it predates it by three years and its
              authors were asking how oocyte-granulosa cell communication is established -- but it is
              the only animal system in which loss of GGPP produces a phenotype in one of this disease's
              three target organs. Follicles are almost entirely lost by six weeks, the primary-to-secondary
              transition fails, Rho GTPase geranylgeranylation is inhibited, and supplying GGPP rescues
              all of it.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Ovarian Follicle Depletion
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: TISSUE
        description: Reproduces follicle loss and infertility from loss of GGPP in the oocyte, and identifies
          the failing step as Rho GTPase geranylgeranylation. The rescue by GGPP is what makes the attribution
          causal rather than correlative.
        limitations: This is a conditional null restricted to the oocyte, whereas patients carry a partial
          loss of function expressed in every tissue, so the model overstates the enzymatic deficit while
          missing any granulosa-cell or somatic contribution. It is a mouse ovary rather than a human
          one, the phenotype is near-complete follicle loss by six weeks rather than ovarian insufficiency
          after apparently normal puberty, and no patient with this syndrome has had ovarian histology
          examined, so the correspondence is by mechanism and not by observation.
        readouts:
        - name: Ovarian follicle number
          target: Ovarian Follicle Depletion
          direction: DECREASED
          interpretation: Direct histological correlate of the follicle-depletion node in this model.
        - name: Follicular development after GGPP administration
          target: Ovarian Follicle Depletion
          direction: RESTORED
          interpretation: Rescue by the missing metabolite establishes that the follicular defect follows
            from GGPP depletion rather than from some other consequence of deleting the enzyme.
      selected_evidence:
        snippet: oocyte geranylgeranyl diphosphate (GGPP), a metabolic intermediate involved in protein
          geranylgeranylation, is required to establish the oocyte-granulosa cell communication.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1/modeled_mechanisms/0
      evidence_path: /animal_models/1/modeled_mechanisms/0/evidence/0
