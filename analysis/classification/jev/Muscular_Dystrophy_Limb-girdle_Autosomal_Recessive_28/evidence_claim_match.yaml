        context:
        - path: /animal_models/3
          value:
            name: hmgcr knockdown Drosophila
            species: Drosophila melanogaster
            genotype: RNAi knockdown of hmgcr, ubiquitous and muscle-specific drivers
            publication: PMID:39823152
            description: The invertebrate arm of the same study that produced the myoblast data. Both
              ubiquitous and muscle-restricted knockdown of the fly HMGCR orthologue are lethal, so like
              every available mouse the fly cannot be carried to a state resembling the human muscular
              dystrophy. It contributes the conserved requirement for the enzyme in muscle rather than
              a phenotype.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Progressive Myofiber Loss and Fatty Replacement
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: Knockdown is lethal rather than myopathic, so no progressive proximal weakness, creatine
          kinase elevation or biopsy phenotype can be observed.
        limitations: Lethality precludes any muscle phenotyping, so the model yields no readout that maps
          onto the human disease. Knockdown severity is also not comparable to the partial loss of function
          patients carry, and the phylogenetic distance means the result establishes only that the enzyme
          is required in muscle, not how a hypomorphic human allele produces a slowly progressive dystrophy.
      selected_evidence:
        snippet: Both ubiquitous and muscle-specific knockdown of hmgcr in Drosophila led to lethality.
        supports: SUPPORT
