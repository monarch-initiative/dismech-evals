      assertion_type: DifferentialDiagnosis
      assertion:
        name: Statin-associated muscle symptoms and statin myopathy
        disease_term:
          preferred_term: drug-induced myopathy
          term:
            id: MONDO:0100637
            label: drug-induced myopathy
        description: 'The same enzyme, inhibited pharmacologically instead of mutated. The overlap is
          not superficial: proximal weakness, raised creatine kinase, an unremarkable biopsy and end-stage
          imaging with fatty replacement are shared, and the founding LGMDR28 report describes its own
          patients as phenotypically resembling severe statin myopathy. The entities are nonetheless distinct
          in cause, and MONDO defines drug-induced myopathy by an exposure relation rather than a germline
          gene relation.'
        distinguishing_features:
        - Cause is a biallelic germline HMGCR genotype rather than exposure to a drug; there is no statin
          exposure in the LGMDR28 families, including in utero.
        - Onset in statin myopathy is relatively acute and follows the start of the drug, whereas LGMDR28
          is insidious and lifelong; withdrawal of a statin has no counterpart in the genetic disease.
        - LGMDR28 is inherited in a Mendelian recessive pattern with unaffected heterozygous parents;
          statin myopathy is not inherited.
        - One caveat cuts the other way, in that chronic or subacute severe statin myopathy has been described
          and can mimic limb-girdle muscular dystrophy, so drug history rather than phenotype is the discriminator.
      selected_evidence:
        snippet: One major difference between SAMS and the hereditary HMGCR disease is the relatively
          acute onset of SAMS compared with the insidious presentation of muscle symptoms in the HMGCR-limb
          girdle muscle disease.
        supports: SUPPORT
