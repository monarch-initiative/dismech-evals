      assertion_type: DifferentialDiagnosis
      assertion:
        name: Sarcolemmal autosomal recessive limb-girdle muscular dystrophy subtypes
        disease_term:
          preferred_term: autosomal recessive limb-girdle muscular dystrophy
          term:
            id: MONDO:0015152
            label: autosomal recessive limb-girdle muscular dystrophy
        description: The rest of the LGMD-R group, curated in `kb/disorders/Autosomal_Recessive_Limb-Girdle_Muscular_Dystrophy.yaml`,
          whose shared mechanism is sarcolemmal fragility and failed membrane repair. LGMDR28 is a MONDO
          child of this term and shares its clinical syndrome, but not its mechanism, which is why it
          is curated as its own entry rather than folded into that one.
        distinguishing_features:
        - Immunohistochemistry for dystrophin, the sarcoglycans and dysferlin is normal in LGMDR28, whereas
          the sarcoglycanopathies and dysferlinopathy show loss of the corresponding protein.
        - The LGMDR28 biopsy lacks the necrosis, inflammation and fibrofatty replacement that characterise
          the membrane-repair subtypes.
        - Creatine kinase elevation in LGMDR28 is at the high end even for this group, reported up to
          250-fold the upper limit of normal.
        - Clinical cardiomyopathy, which occurs in several sarcolemmal subtypes, has not been reported
          in LGMDR28, although subclinical troponin T elevation and ECG conduction changes were found
          in the founding kindred.
        - LGMDR28 has a directed metabolite-replacement candidate; the sarcolemmal subtypes have supportive
          care and gene-directed trials.
      selected_evidence:
        snippet: The main immunostainings (against dystrophin, sarcoglycans and dysferlin) were reported
          as normal.
        supports: SUPPORT
