  13f1d7340d828093020d0252d9890ff6d8668a0b1ab0369e5b6428415d19243a:
    claim:
      about:
        disease:
          name: Muscular Dystrophy, Limb-Girdle, Autosomal Recessive 28
          disease_term:
            preferred_term: muscular dystrophy, limb-girdle, autosomal recessive 28
            term:
              id: MONDO:0957270
              label: muscular dystrophy, limb-girdle, autosomal recessive 28
        context: []
      assertion_type: Treatment
      assertion:
        name: Oral Mevalonolactone
        description: Metabolite replacement directed at the missing pathway product. Mevalonolactone is
          not an available pharmaceutical preparation and was synthesised and purified for the purpose,
          then given under an expanded-access authorisation to the single most severely affected patient
          of the founding kindred, who gained strength on dynamometry and manual testing and improved
          substantially on spirometry. The evidence is one patient treated openly without a control, so
          this is a promising directed therapy rather than an established one.
        notes: 'Two deliberate restraints. The CHEBI binding is to the stereochemically unspecified `CHEBI:194429
          mevalonolactone` rather than to `CHEBI:67849 (R)-mevalonolactone`, because the paper states
          only that the compound was produced by batch fermentation and purified to over 94% and never
          names the enantiomer; binding the (R) form would assert a fact the source does not give. Second,
          the paper''s discussion says "Further large clinical trials are in place", but no registry identifier
          is published with it. A ClinicalTrials.gov API query for "mevalonolactone" and for "HMGCR muscular
          dystrophy" returned zero studies each on 2026-08-31, and `just ictrp-fetch` takes a trial identifier
          rather than a search term, so no WHO ICTRP record could be looked up either. No `clinical_trials`
          entry is therefore curated: this records that the trial could not be located, not that none
          exists.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: mevalonolactone
            term:
              id: CHEBI:194429
              label: mevalonolactone
      selected_evidence:
        snippet: Respiratory muscles were assessed by spirometry, which demonstrated marked increase in
          peak expiratory flow (+265%; from 6 to 22% of predicted value), forced vital capacity (+342%;
          from 17.4 to 77.6% of predicted value), and FEV1 (+345%, from 10.7 to 48.1% of predicted value,
          Fig. 4M).
        supports: SUPPORT
    origin:
