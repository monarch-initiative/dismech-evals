        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced HMG-CoA Reductase Catalytic Activity
        biological_scale: MOLECULAR
        description: 'Disease-associated HMGCR alleles are amorphic to hypomorphic: they reduce catalytic
          rate and destabilise the enzyme rather than preventing its expression or mislocalising it. The
          founding G822D allele retains the protein in its normal cytoplasmic and endoplasmic-reticulum
          distribution while losing most of its turnover number and most of its affinity for HMG-CoA,
          and independently assayed alleles from a second cohort show the same pattern of reduced activity
          with reduced stability.'
        molecular_functions:
        - preferred_term: HMG-CoA reductase activity
          modifier: DECREASED
          term:
            id: GO:0004420
            label: hydroxymethylglutaryl-CoA reductase (NADPH) activity
      selected_evidence:
        snippet: the mutant protein had 69% reduction in Vmax and 65% increase in Km in relation to the
          substrate HMG-CoA, indicating lower affinity of the mutated protein for HMG-CoA, as well as
          overall slower reaction-rate
        supports: SUPPORT
