            experimental_model_type: CELL_LINE
            description: C2C12 mouse myoblasts, the standard immortalised myogenic line, with Hmgcr knocked
              down by shRNA to about 60% of control transcript. Used both to characterise the cellular
              phenotype of HMGCR loss and, by re-expressing wild-type versus patient HMGCR cDNA, to test
              whether specific disease alleles are functional. It is the system that connects the enzymatic
              defect to a myogenic one.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Myoblast Proliferation and Myotube Fusion
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Reproduces the proliferation, survival and fusion defects attributable to HMGCR loss,
          and shows that three patient alleles cannot rescue them while the reference sequence can.
        limitations: Knockdown rather than the biallelic hypomorphic genotype patients carry, in mouse
          rather than human cells, and in proliferating myoblasts rather than mature innervated muscle.
          A fusion defect in culture is a developmental readout, whereas most patients present after normal
          early motor development, so the correspondence to the adult-onset end of the spectrum is uncertain.
        readouts:
        - name: Myotube fusion after complementation with reference or variant HMGCR cDNA
          target: Impaired Myoblast Proliferation and Myotube Fusion
          direction: RESTORED
          interpretation: Reference cDNA restores fusion and the patient alleles do not, which is the
            functional demonstration that those alleles are loss-of-function in a muscle cell.
      selected_evidence:
        snippet: Hmgcr deficiency was associated with decreased proliferation, increased apoptosis, and
          impaired myotube fusion.
        supports: SUPPORT
