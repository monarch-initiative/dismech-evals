            term:
              id: MONDO:0957270
              label: muscular dystrophy, limb-girdle, autosomal recessive 28
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Non-specific myopathic change with normal muscular dystrophy immunohistochemistry
        description: The biopsy is characteristically unhelpful, which is itself diagnostically informative.
          Findings range from non-specific dystrophic or myopathic change to a biopsy that is essentially
          normal, with no necrosis, fibrosis or inflammatory infiltrate in the founding kindred. Immunostaining
          for dystrophin, the sarcoglycans and dysferlin is normal, so the structural LGMD subtypes are
          excluded on the biopsy without this one being identified by it.
        notes: 'Deliberately incomplete, and the gap is in the sources rather than in the disease. HPO
          curates finer biopsy findings for this disease from the discovery cohort (PMID:37167966): type
          1 fiber predominance 4/4, centrally nucleated fibers 3/3, increased endomysial connective tissue
          2/3, increased intramyocellular lipid droplets 1/3, and reduced muscle fiber alpha-dystroglycan
          1/1. Those come from that paper''s full text and supplement; `references_cache/PMID_37167966.md`
          is abstract-only, whose only histological statement is the "non-specific dystrophic changes"
          quoted below. The findings are therefore recorded here as a pointer rather than curated as evidence
          items, because no exact quote supporting them is available in the cache. A curator with full-text
          access should add them. Note in particular that "non-specific" in the abstract should not be
          read as "normal": the founding kindred''s near-normal biopsy (PMID:36745799) is the exception
          rather than the rule.'
      selected_evidence:
        snippet: Muscle biopsies in most affected individuals showed non-specific dystrophic changes with
          non-diagnostic immunohistochemistry.
        supports: SUPPORT
