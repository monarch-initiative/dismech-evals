            label: immune-mediated necrotizing myopathy
        description: 'An autoantibody disease directed against the same protein, and the differential
          most likely to be mistaken for this one, because it is repeatedly reported as presenting like
          a limb-girdle muscular dystrophy in both adults and children. The distinction is consequential
          rather than academic: anti-HMGCR myopathy responds to immunosuppression, and LGMDR28 has no
          reason to.'
        distinguishing_features:
        - Anti-HMGCR autoantibodies are present by definition in the autoimmune disease and were explicitly
          absent in all six patients of the founding LGMDR28 kindred.
        - Biopsy in anti-HMGCR myopathy shows myocyte necrosis and regeneration; the LGMDR28 biopsy shows
          non-specific change or nothing, without necrosis or inflammation.
        - Anti-HMGCR myopathy is acquired and typically acute or subacute; LGMDR28 is a Mendelian recessive
          disease with unaffected heterozygous parents.
        - Immunosuppressive therapy is the treatment of the autoimmune disease and has no rationale in
          the genetic one, where metabolite replacement is the directed approach.
      selected_evidence:
        snippet: The presence of anti-HMGCR enzyme antibodies has been found to result in auto-immune
          necrotizing myopathy, a disease mimicking muscular dystrophy in adults but also in a growing
          number of children.
        supports: SUPPORT
