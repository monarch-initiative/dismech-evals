  a36077ad8bf1e0eb0e7121a8693b77a5112247acf0e0460b3986024c1e0a069a:
    claim:
      about:
        disease:
          name: Muscular Dystrophy, Limb-Girdle, Autosomal Recessive 28
          disease_term:
            preferred_term: muscular dystrophy, limb-girdle, autosomal recessive 28
            term:
              id: MONDO:0957270
              label: muscular dystrophy, limb-girdle, autosomal recessive 28
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Isoprenoid Depletion and Impaired Protein Geranylgeranylation
        biological_scale: MOLECULAR
        description: The branch of the mevalonate pathway that appears to carry the myopathy is the isoprenoid
          one. In muscle-specific Hmgcr-knockout mice the fiber-type loss is reversed by geranylgeraniol,
          the precursor of geranylgeranyl pyrophosphate, and independently knocking out the Rab geranylgeranyltransferase
          beta subunit produces its own myopathy and aggravates the Hmgcr one. This is a mouse-derived
          mechanism; no patient measurement of prenylation exists.
        biological_processes:
        - preferred_term: protein geranylgeranylation
          modifier: DECREASED
          term:
            id: GO:0018344
            label: protein geranylgeranylation
        - preferred_term: isoprenoid biosynthesis
          modifier: DECREASED
          term:
            id: GO:0008299
            label: isoprenoid biosynthetic process
      selected_evidence:
        snippet: Our findings demonstrate that myopathy induced by HMGCR deficiency is primarily driven
          by GGPP depletion in a mouse model.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42323079
      reference_title: Skeletal muscle-specific deficiency of Rab geranylgeranyl transferase beta subunit
        induces myopathy and exacerbates the symptoms caused by HMG-CoA reductase deficiency in mice.
