      assertion:
        classification_value: NEUROLOGIC
        notes: 'A muscular dystrophy, assigned to the neurology part where Harrison''s places the muscular
          dystrophies and other muscle diseases. The morbidity is entirely neuromuscular: proximal and
          axial weakness, loss of ambulation, and respiratory muscle failure. A second ENDOCRINOLOGY_METABOLISM
          assignment was considered because the lesion is in a metabolic enzyme, but no metabolic derangement
          is the presenting or defining problem, so it is deliberately not made.'
      selected_evidence:
        snippet: The clinical features resembled other genetic causes of muscular dystrophy with incidental
          high CPK levels (>1,000 U/L), proximal muscle weakness, variable age of onset, and progression
          leading to impaired ambulation.
        supports: SUPPORT
