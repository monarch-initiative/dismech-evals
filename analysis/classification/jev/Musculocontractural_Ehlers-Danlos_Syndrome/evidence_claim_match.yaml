        - path: /animal_models/1
          value:
            name: Xenopus DS-epi1 (dse) morphant embryos
            species: Xenopus laevis
            genotype: Morpholino knockdown of DS-epi1/dse, with cranial neural crest transplantation and
              explant culture
            category: Targeted knockdown model of dermatan sulfate epimerase deficiency
            publication: PMID:27101845
            description: The only model of this disease that addresses the embryonic origin of its congenital
              features. Knocking down DS-epi1 in frog embryos removes iduronic acid from chondroitin sulfate/dermatan
              sulfate chains and leaves neural crest induction intact while blocking epithelial-mesenchymal
              transition and migration; transplantation shows the requirement is tissue-autonomous, and
              explants place the defect in adhesion and spreading on fibronectin. The downstream loss
              of neural-crest-derived craniofacial skeleton offers a developmental account of the congenital
              malformations, complementing the Chst14-null mouse, which dies perinatally, and the human
              fibroblast work, which is postnatal.
            genes:
            - preferred_term: DSE
              term:
                id: hgnc:21144
                label: DSE
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Dermatan Sulfate Biosynthesis Failure
        relationship: RECAPITULATES
        fidelity: HIGH
        description: 'Reproduces the mcEDS-DSE biochemical lesion directly: loss of DS-epi1 removes iduronic
          acid residues from hybrid CS/DS glycosaminoglycan chains.'
        limitations: Morpholino knockdown rather than the biallelic null genotype of patients, and it
          models the DSE half of the disease only — mcEDS-CHST14, the more common form, acts one step
          later at 4-O-sulfation and is not addressed.
        readouts:
        - name: Isolated iduronic acid residues in CS/DS proteoglycans
          target: Dermatan Sulfate Biosynthesis Failure
          direction: DECREASED
          interpretation: The epimerase product itself, measured in the embryo, which is what makes this
            a model of the enzymatic lesion rather than of its consequences.
      selected_evidence:
        snippet: this syndrome comprises multiple congenital malformations that are caused by dysfunction
          of dermatan sulfate (DS) biosynthetic enzymes, including DS epimerase-1 (DS-epi1; also known
          as DSE)
        supports: SUPPORT
