            label: CHST14
        - preferred_term: DSE
          term:
            id: hgnc:21144
            label: DSE
        biological_scale: MOLECULAR
        description: 'Biallelic loss-of-function variants in CHST14 (dermatan 4-O-sulfotransferase-1,
          D4ST1) or DSE (dermatan sulfate epimerase-1, DS-epi1) abolish consecutive steps required to
          build iduronic acid-containing dermatan sulfate domains within hybrid chondroitin sulfate/dermatan
          sulfate glycosaminoglycan chains. DS-epi1 epimerizes glucuronic acid to iduronic acid and D4ST1
          4-O-sulfates the adjacent N-acetylgalactosamine; loss of either leaves a negligible amount of
          dermatan sulfate and a reciprocal excess of chondroitin sulfate. This is the single lesion shared
          by both gene-defined subtypes.

          '
        cell_types:
        - preferred_term: skin fibroblast
          term:
            id: CL:0002620
            label: skin fibroblast
        biological_processes:
