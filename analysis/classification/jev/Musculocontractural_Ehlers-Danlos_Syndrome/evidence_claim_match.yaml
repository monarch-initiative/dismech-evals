              label: Ehlers-Danlos syndrome, musculocontractural type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mceds_dse_residual_ds_severity_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the residual decorin dermatan sulfate seen in DS-epi1 deficiency actually the cause
          of the milder mcEDS-DSE phenotype, and is DSE2 the compensating activity?
        attaches_to:
        - pathophysiology#Decorin Glycosaminoglycan Chain Replacement
        rationale: The persistence of some dermatan sulfate moieties in DS-epi1-deficient fibroblasts,
          in contrast to complete chondroitin sulfate replacement in D4ST1 deficiency, is the leading
          explanation for the lower symptom burden in mcEDS-DSE. The source literature states this only
          as a hedged proposal, and with only a handful of reported mcEDS-DSE patients the genotype-phenotype
          comparison is underpowered. Whether DSE2 provides the compensating epimerase activity is untested.
        proposed_experiments:
        - experiment_id: mceds_decorin_ds_severity_correlation
          name: Decorin dermatan sulfate content versus clinical severity
          description: Quantify decorin dermatan sulfate content across a matched series of mcEDS-CHST14
            and mcEDS-DSE fibroblast lines and correlate with a standardized clinical severity score.
        - experiment_id: mceds_dse2_compensation_test
          name: DSE2 knockdown in DS-epi1-deficient fibroblasts
          description: Knock down or knock out DSE2 in DS-epi1-deficient patient fibroblasts and test
            whether residual dermatan sulfate is lost, establishing or excluding DSE2 compensation.
      selected_evidence:
        snippet: Milder phenotypes in mcEDS-DSE might be related to a smaller fraction of decorin DS,
          potentially through residual DSE activity or compensation by DSE2 activity.
        supports: SUPPORT
