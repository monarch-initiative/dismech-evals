        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mceds_chst14_mouse_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the perinatally lethal Chst14-null mouse adequately model human mcEDS-CHST14, in
          which affected individuals survive and the dominant morbidity is progressive postnatal connective-tissue
          fragility?
        attaches_to:
        - pathophysiology#Progressive Multisystem Connective Tissue Fragility
        rationale: Homozygous Chst14-null mice die perinatally with shorter fetal length and placental
          vascular abnormalities, so the model speaks to the developmental arm of the disease but cannot
          report on the progressive fragility arm — skin fragility, recurrent dislocations, large subcutaneous
          hematomas, pneumothorax, and diverticular perforation — that defines long-term human morbidity.
          Evidence for the fragility mechanism therefore rests on human ultrastructural and biochemical
          studies rather than on the mouse.
        proposed_experiments:
        - experiment_id: mceds_conditional_chst14_postnatal_fragility
          name: Conditional or hypomorphic Chst14 allele surviving to adulthood
          description: Generate and characterize conditional or hypomorphic Chst14 alleles that bypass
            perinatal lethality, then assess postnatal skin, joint, vascular, and hollow-organ fragility
            against the human phenotype.
        - experiment_id: mceds_dse_null_mouse_survival
          name: Dse-null mouse phenotyping
          description: Test whether a Dse-null mouse, expected to retain residual dermatan sulfate as
            in human mcEDS-DSE, survives to adulthood and develops the milder progressive fragility phenotype
            seen in patients.
      selected_evidence:
        snippet: Homozygous (Chst14-/-) mice have been shown perinatal lethality, shorter fetal length
          and vessel-related placental abnormalities.
        supports: SUPPORT
    origin:
