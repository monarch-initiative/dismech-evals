            genes:
            - preferred_term: DSE
              term:
                id: hgnc:21144
                label: DSE
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Congenital Malformation of Connective-Tissue-Dependent Structures
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: 'Supplies a developmental mechanism for the congenital craniofacial features: neural
          crest cells are induced normally but fail to undergo EMT and migrate, so crest-derived craniofacial
          skeleton is reduced.'
        limitations: The craniofacial readouts are frog structures — dorsal fin and larval cartilage —
          that have no direct human counterpart, and melanocyte loss is not an mcEDS feature. The authors
          themselves put the link to human malformation as a proposal. Nothing here addresses the postnatal
          progressive fragility that dominates the disease.
        readouts:
        - name: Neural crest EMT transcription factor activation and extent of migration
          target: Congenital Malformation of Connective-Tissue-Dependent Structures
          direction: DECREASED
          interpretation: Localizes the defect to EMT and migration rather than to crest induction, which
            the same experiment shows is unaffected.
        - name: Cranial neural crest adhesion and spreading on fibronectin
          target: Congenital Malformation of Connective-Tissue-Dependent Structures
          direction: DECREASED
          interpretation: Reduces the migration defect to a cell-matrix interaction, the level at which
            a missing glycosaminoglycan modification would be expected to act.
      selected_evidence:
        snippet: Transplantation experiments demonstrate a tissue-autonomous role for DS-epi1 in cranial
          NC cell migration in vivo
        supports: SUPPORT
