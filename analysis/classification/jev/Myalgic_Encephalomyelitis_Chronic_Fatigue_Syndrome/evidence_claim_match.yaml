      assertion_type: Pathophysiology
      assertion:
        name: Small-Fiber Neuropathy
        description: Reduced epidermal small-fiber density occurs in a subset of selected patients. Autonomic
          small-fiber dysfunction could affect venous tone or distribution of muscle blood flow, but skin-fiber
          density does not directly establish either mechanism.
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: Among the 160 ME/CFS patient biopsies, 31% were consistent with SFN (epidermal innervation
          ≤5.0% of predicted; P < .0001). Denervation severity did not correlate with exertional measures.
        supports: SUPPORT
    origin:
