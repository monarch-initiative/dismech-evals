        prompt: Which ME/CFS susceptibility variants act through which tissues and effector genes?
        rationale: The 2025 DecodeME preprint reports eight associated loci in up to 15,579 cases and
          259,909 ancestry-matched controls. It is not peer reviewed, and nearby genes are not proven
          effector genes. HLA and GWAS findings support polygenic susceptibility without establishing
          Mendelian inheritance, a clinical test or this specific perfusion-to-PEM pathway.
      selected_evidence:
        snippet: We recruited 21,620 ME/CFS cases and performed genome-wide association studies (GWAS)
          for up to 15,579 cases and 259,909 population controls with European genetic ancestry.
