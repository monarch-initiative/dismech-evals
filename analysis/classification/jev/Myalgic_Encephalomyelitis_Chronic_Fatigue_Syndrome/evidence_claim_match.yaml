    evidence_metadata:
      reference: PMID:26148446
      reference_title: 'Chronic fatigue syndrome and circulating cytokines: A systematic review.'
      evidence_source: OTHER
      explanation: 'A PRISMA systematic review of 38 case-control studies found no post-exercise difference
        in circulating cytokine levels and concluded that circulating cytokines do not seem to explain
        post-exertional fatigue. This generalizes the two single negative studies above and is the reason
        this node is framed around platelet and monocyte states rather than a cytokine cascade. It constrains
        a circulating cytokine bridge only: the same review found elevated resting TGF-beta in five of
        eight studies, and tissue-level or non-cytokine immune mechanisms are untested by it.'
