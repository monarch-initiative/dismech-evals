            term:
              id: MONDO:0005404
              label: myalgic encephalomeyelitis/chronic fatigue syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mecfs_pem_causal_ordering
        prompt: 'Which causal edge best connects exertion to delayed multi-system symptom worsening in
          ME/CFS: impaired microvascular oxygen delivery/extraction, skeletal muscle ionic and mitochondrial
          disturbance, immune-metabolic signaling, autonomic dysfunction, central nervous system amplification,
          or a subtype-specific combination?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Peripheral Oxygen Extraction
        - pathophysiology#Skeletal Muscle Bioenergetic Disturbance
        - pathophysiology#Proposed Delayed Immunometabolic Amplification
        - phenotypes#Post-Exertional Malaise
        rationale: No study in the reviewed literature measures and perturbs the complete peripheral-perfusion,
          myocyte-ion, metabolic, immune and CNS sequence in the same ME/CFS participants. Existing sodium
          MRI, acute pyridostigmine, single-cell exercise and long-COVID muscle-biopsy studies narrow
          the gaps; they do not validate the entire chain. Muscle sodium compartment specificity, causal
          ordering, subgroup boundaries and physiological/symptom discordance remain open. A 2022 patient
          serum-vesicle/microglial assay demonstrates peripheral-preparation bioactivity but not muscle
          source, mtDNA-specific causality, BBB transport or in vivo brain effects.
        proposed_experiments:
        - experiment_id: exp_mecfs_pem_serial_exertion_perfusion_multiomics
          name: Serial exertion-challenge perfusion and muscle multi-omics cohort
          description: Use a prospectively registered, severity-adapted cohort with activity-matched controls
            and carefully tolerated provocation. Measure symptoms and selected perfusion, muscle metabolism,
            sodium-compartment, immune and autonomic endpoints across baseline, immediate, 24–72-hour
            and recovery windows. An invasive or maximal exercise battery should not be imposed on people
            unable to tolerate it. Specify missing-data handling, medication/activity covariates and independent
            validation before subgroup discovery.
          experiment_type:
            preferred_term: longitudinal exertion-challenge cohort
          model_systems:
          - name: Human ME/CFS exertion-challenge cohort
            description: 'Patient cohort designed to temporally order peripheral perfusion, skeletal muscle,
              metabolic, immune, autonomic, and symptom readouts during PEM induction and recovery.

              '
            experimental_model_type: OTHER
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
          decision_criterion: Temporal precedence and adjusted mediation would increase plausibility but
            would not establish causality because unmeasured confounding and feedback remain possible.
            A targeted randomized perturbation must demonstrate target engagement and downstream physiological
            and symptom changes, with rescue and safety outcomes, to test direction. Compartment-specific
            sodium results are needed before inferring intracellular calcium loading.
          would_support:
          - pathophysiology#Impaired Peripheral Oxygen Extraction
          - pathophysiology#Skeletal Muscle Bioenergetic Disturbance
          - pathophysiology#Proposed Delayed Immunometabolic Amplification
          would_refute:
          - mechanistic_hypotheses#exertion_perfusion_muscle_immunometabolic_pem_model
      selected_evidence:
        snippet: Here, we show that mitochondrial DNA (mtDNA) associated with serum exosomes, is increased
          in ME/CFS patients only after exercise.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
