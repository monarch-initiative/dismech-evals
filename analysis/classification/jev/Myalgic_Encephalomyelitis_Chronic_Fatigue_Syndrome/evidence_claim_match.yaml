        - target: TRPM3-Associated NK-Cell Calcium Dysregulation
          description: Patch-clamp and compartment-specific calcium measurements identify condition-dependent
            NK-cell abnormalities; IL-2/naltrexone experiments test ex vivo channel rescue.
          relationship: MEASURES
      selected_evidence:
        snippet: Cytosolic Ca2+ influx amplitude and slope were significantly reduced (p < 0.001), with
          a significantly shorter T1/2 response (p = 0.001) in ME/CFS compared to HC. Ca2+ influx amplitude
          (p < 0.001) and slope (p < 0.041) into the mitochondria were significantly higher in ME/CFS
          compared to HC. TRPM3 activation triggered pronounced cytosolic response (P < 0.001) accompanied
          by mitochondrial Ca2+ increase in HC. TRPM3-dependent cytosolic and mitochondrial Ca2+ mobilisation
          (P < 0.015) were significantly reduced with a shorter T1/2 response (p < 0.02) in ME/CFS compared
          to HC.
        supports: SUPPORT
