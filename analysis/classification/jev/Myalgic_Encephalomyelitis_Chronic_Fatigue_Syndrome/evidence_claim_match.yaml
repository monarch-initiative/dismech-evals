    evidence_metadata:
      reference: PMID:42177403
      reference_title: Deficient TRPM3-linked mitochondrial Ca(2+) influx in natural killer cells associated
        with myalgic encephalomyelitis/chronic fatigue syndrome.
      evidence_source: IN_VITRO
      explanation: 'Ten cases and ten controls: calcium re-addition produced higher mitochondrial influx
        despite lower cytosolic response, whereas pregnenolone-sulfate/TRPM3-dependent cytosolic and mitochondrial
        responses were both reduced. These are stimulus-specific NK-cell assays, not muscle calcium measurements.'
