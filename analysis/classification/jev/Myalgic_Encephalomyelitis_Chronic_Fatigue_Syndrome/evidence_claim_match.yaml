        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: exertion_perfusion_muscle_immunometabolic_pem_model
        hypothesis_label: Exertion-Perfusion-Muscle Immunometabolic PEM Model
        status: EMERGING
        description: Exertion may expose neurovascular or muscle metabolic limitations in a subset of
          patients, followed by delayed immune and central amplification of symptoms. Low-flow preload
          failure, high-flow impaired extraction, tissue sodium changes and immune-state abnormalities
          are distinct observations. The ordering and necessity of the proposed links remain unresolved.
        notes: Retain EMERGING after source-level assessment of OpenScientist. Corrected its false absence
          of sodium MRI and acute hemodynamic intervention evidence, 50% small-fiber-neuropathy figure
          (31% in the cited cohort), review-as-primary EM attribution and cohort conflations. The 2024
          EM study lacks healthy EM controls; the exercise-biopsy study is in long COVID and does not
          demonstrate intravascular microclots. A 2022 sodium MRI pilot measures mixed tissue sodium,
          not isolated intracellular sodium or calcium overload. Acute pyridostigmine improves exercise
          hemodynamics but does not establish durable PEM benefit. Positive and negative day-two CPET
          studies coexist. None of these findings proves an obligatory muscle-to-immune-to-CNS sequence
          or validated biological subtype boundaries.
      selected_evidence:
        snippet: These results identify two types of peripheral neurovascular dysregulation that are biologically
          plausible contributors to ME/CFS exertional intolerance-depressed Qc from impaired venous return,
          and impaired peripheral oxygen extraction.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
