      reference_title: Insights From Invasive Cardiopulmonary Exercise Testing of Patients With Myalgic
        Encephalomyelitis/Chronic Fatigue Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: The ME/CFS biopsy proportion was 31%, not the report's approximately 50%; the latter
        is background POTS/fibromyalgia literature. A shunting mechanism is proposed rather than causally
        demonstrated.
