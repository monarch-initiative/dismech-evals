        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical Symptom and Functional Assessment
        description: 'Document pre-illness function, the delayed response to physical and cognitive activity,
          sleep, cognition, upright symptoms and duration. A symptom/activity diary can help. CDC/NAM-style
          criteria require at least six months of substantial functional impairment with fatigue, PEM
          and unrefreshing sleep, plus cognitive impairment or orthostatic intolerance (or both). NICE
          permits diagnosis after three months and requires all four domains: debilitating fatigue, PEM,
          unrefreshing sleep or sleep disturbance, and cognitive difficulties; OI is an additional feature.
          In either approach assess other explanations and coexisting conditions, and start symptom care
          while evaluation continues.'
      selected_evidence:
        snippet: A thorough medical history, physical (including neurological) and mental health exam,
          and laboratory testing should be performed.
        supports: SUPPORT
