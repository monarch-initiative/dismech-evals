          in fungi. Examples of imidazoles include ketoconazole (1981: Nizoral) and clotrimazole (1975:
          Mycelex). Examples of triazoles include fluconazole (1990: Diflucan), itraconazole (1992: Sporanox),
          posaconazole (2006: Noxafil) and voriconazole (2002: Vfend).'
        supports: SUPPORT
