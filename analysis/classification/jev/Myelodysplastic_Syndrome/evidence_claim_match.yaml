      assertion:
        name: MDS-IB
        display_name: MDS with Increased Blasts
        description: Higher-risk MDS subtype defined by an increased proportion of bone marrow or peripheral
          blood blasts (still below the 20% threshold that defines AML), carrying a substantial risk of
          progression to acute myeloid leukemia. This is the subtype population in which hypomethylating
          agents prolong survival.
        mappings:
          ncit_mappings:
          - term:
              id: NCIT:C7506
              label: Myelodysplastic Syndrome with Excess Blasts
            mapping_predicate: skos:exactMatch
            mapping_source: NCIT
            mapping_justification: NCIT "Myelodysplastic Syndrome with Excess Blasts" is the established
              oncology label for the increased-blast (higher-risk) MDS category.
      selected_evidence:
        snippet: Patients with myelodysplastic syndromes who had intermediate-2 or high-risk scores on
          the international prognosis scoring system (known as higher-risk myelo-dysplastic syndromes)
          have a median survival of 1·2 years or 0·4 years, respectively,5 and a high-risk for progression
          to acute myeloid leukaemia.
        supports: SUPPORT
