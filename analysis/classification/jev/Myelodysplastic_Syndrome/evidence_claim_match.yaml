        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Spliceosome and Epigenetic Founder Lesions
        description: Early driver mutations in the RNA splicing machinery (SF3B1, SRSF2, U2AF1, ZRSR2)
          and in DNA-methylation and chromatin regulators (TET2, DNMT3A, ASXL1, EZH2) establish the clonal
          architecture of MDS. Splicing-factor mutations are highly specific to myeloid neoplasms with
          dysplasia and frequently arise as the founder lesion, dictating subsequent disease trajectory.
        cell_types:
        - preferred_term: hematopoietic stem cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        biological_processes:
        - preferred_term: mRNA splicing, via spliceosome
          modifier: ABNORMAL
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
        - preferred_term: chromatin organization
          modifier: ABNORMAL
          term:
            id: GO:0006325
            label: chromatin organization
      selected_evidence:
        snippet: most of the mutations, which occurred in a mutually exclusive manner, affected genes
          involved in the 3'-splice site recognition during pre-mRNA processing, inducing abnormal RNA
          splicing and compromised haematopoiesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
