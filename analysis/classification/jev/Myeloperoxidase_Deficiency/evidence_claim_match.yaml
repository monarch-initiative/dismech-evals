      assertion_type: Pathophysiology
      assertion:
        name: Defective MPO Precursor Maturation
        description: Mutant MPO precursors are glycosylated and acquire heme but are retained in the endoplasmic
          reticulum in prolonged association with calreticulin and calnexin, are not proteolytically processed
          to mature subunits, and are degraded by the proteasome through endoplasmic reticulum quality
          control. Neutrophils therefore carry a 90-kDa precursor but no mature enzyme.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: ER-associated degradation of mutant MPO precursor
          term:
            id: GO:0036503
            label: ERAD pathway
          modifier: INCREASED
        - preferred_term: MPO precursor proteolytic maturation
          term:
            id: GO:0051604
            label: protein maturation
          modifier: DECREASED
      selected_evidence:
        snippet: it was neither proteolytically processed to mature MPO subunits nor secreted. After prolonged
          association with calreticulin and calnexin in the endoplasmic reticulum, MPOY173C was degraded.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
