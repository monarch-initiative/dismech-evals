          as CGD. MPO deficiency is distinguished by normal eosinophil DHR signal (eosinophil peroxidase
          is preserved), rescue of the DHR signal by added recombinant MPO, and increased rather than
          decreased lucigenin chemiluminescence.
        disease_term:
          preferred_term: chronic granulomatous disease
          term:
            id: MONDO:0018305
            label: chronic granulomatous disease
      selected_evidence:
        snippet: Eosinophils from MPO-deficient individuals retain eosinophilic peroxidase and therefore
          generate a normal DHR signal.
