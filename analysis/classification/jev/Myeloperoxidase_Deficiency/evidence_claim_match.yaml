      assertion:
        name: MPO Pathogenic Variants
        description: Biallelic or compound heterozygous variants in MPO cause the disease. The most frequent
          allele in Western populations is the exon 10 missense variant R569W; other missense, frameshift,
          splice-site and small-deletion alleles (Y173C, M251T, the exon 9 14-base deletion, and several
          Italian and Japanese alleles) have been described. Several genotypes produce the same biochemical
          phenotype.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: MPO
          term:
            id: hgnc:7218
            label: MPO
      selected_evidence:
        snippet: At the amino acid level this mutation would replace arginine at codon 569 with tryptophan.
          Six of seven patients with complete MPO deficiency had this mutation.
        supports: SUPPORT
