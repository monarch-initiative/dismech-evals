        name: Disrupted Chondrogenesis and Skeletal Growth
        description: 'SMAD4 is the obligate co-SMAD regulating chondrogenesis, including condensation,
          proliferation, ECM deposition, and differentiation in the growth plate. Dysregulated SMAD4-dependent
          TGF-beta signaling disturbs growth-plate cartilage development, contributing to short stature,
          brachydactyly, and the skeletal features of the acromelic-dysplasia spectrum. Chondrocyte-specific
          Smad4 loss in mice disrupts growth plates and causes dwarfism, supporting SMAD4''s central role
          in skeletal growth, although Myhre syndrome itself results from gain-of-function rather than
          loss-of-function alleles.

          '
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: Cartilage Development
          term:
            id: GO:0051216
            label: cartilage development
      selected_evidence:
        snippet: This review is focused on the involvement of transforming growth factor-β signaling in
          a group of chondrodysplasias, entitled acromelic dysplasia, characterized by short stature,
          short hands and restricted joint mobility.
        supports: SUPPORT
    origin:
