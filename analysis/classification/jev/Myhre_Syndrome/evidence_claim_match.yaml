      assertion_type: Treatment
      assertion:
        name: Losartan (Angiotensin Receptor Blocker)
        description: 'Losartan, an angiotensin II type 1 receptor blocker, has an anti-fibrotic rationale
          because it antagonizes TGF-beta signaling; prior in vitro work showed losartan improved ECM
          deposition in Myhre syndrome fibroblasts. A small pilot trial (3 treated for 12 months) reported
          improvement in skin thickness and joint range of motion, with adverse effects including dizziness
          and orthostatic hypotension. Larger controlled trials are needed.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: losartan
            term:
              id: CHEBI:6541
              label: losartan
      selected_evidence:
        snippet: In three MS subjects, improvements in skin thickness, joint ROM and to a lesser extent
          of myocardial strain, were observed after 6 and 12 months of losartan treatment.
        supports: SUPPORT
