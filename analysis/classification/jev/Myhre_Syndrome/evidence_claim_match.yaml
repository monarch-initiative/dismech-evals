      assertion:
        name: Autosomal Dominant
        description: 'Myhre syndrome is an autosomal dominant disorder typically caused by a de novo pathogenic
          SMAD4 variant. Evaluated de novo variants have all been of paternal origin and are associated
          with advanced paternal age. Rare inheritance from an affected parent has been reported; each
          child of an affected individual has a 50% chance of inheriting the variant.

          '
      selected_evidence:
        snippet: Myhre syndrome is an increasingly diagnosed ultrarare condition caused by recurrent germline
          autosomal dominant de novo variants in SMAD4.
        supports: SUPPORT
