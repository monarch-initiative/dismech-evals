  c6325207b82433b98eb7eaca57f5936540207dd223ed0e950682722b9169aa17:
    claim:
      about:
        disease:
          name: Myhre Syndrome
          disease_term:
            preferred_term: Myhre Syndrome
            term:
              id: MONDO:0007688
              label: Myhre syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SMAD4 Gain-of-Function Variants Dysregulating TGF-beta/BMP Signaling
        description: 'Myhre syndrome is caused by recurrent heterozygous missense variants in the MH2
          domain of SMAD4 (codon 500: p.Ile500Val/Thr/Leu/Met; and p.Arg496Cys). These variants act through
          a gain-of-function mechanism, with proposed molecular bases including impaired SMAD4 ubiquitination
          and degradation and altered stability of the SMAD heterotrimer, leading to enhanced and dysregulated
          TGF-beta/BMP transcriptional output. SMAD4 is the central co-mediator integrating canonical
          TGF-beta, BMP, and Activin signaling, so a single gain-of-function lesion perturbs multiple
          developmental and homeostatic programs.

          '
        cell_types:
        - preferred_term: Fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: TGF-beta Receptor Signaling
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
        - preferred_term: BMP Signaling
          term:
            id: GO:0030509
            label: BMP signaling pathway
          modifier: INCREASED
        - preferred_term: SMAD Protein Signal Transduction
          term:
            id: GO:0060395
            label: SMAD protein signal transduction
          modifier: INCREASED
      selected_evidence:
        snippet: Pathogenic variants in SMAD4 involved protein residues p.Ile500Val (49%), p.Ile500Thr
          (11%), p.Ile500Leu (2%), and p.Arg496Cys (38%).
        supports: SUPPORT
