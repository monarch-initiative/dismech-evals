      assertion_type: Pathophysiology
      assertion:
        name: Proliferative Fibrosis and Extracellular Matrix Deposition
        description: 'Defective/dysregulated TGF-beta/BMP signaling through mutant SMAD4 promotes the
          proliferation of abnormal fibrous tissue with excessive extracellular matrix and collagen deposition.
          This proliferative-fibrotic response thickens and stiffens the skin, restricts joints, and produces
          interstitial fibrosis with airway collagen and smooth-muscle hyperplasia. The fibroproliferative
          tendency is progressive and is characteristically exacerbated by trauma, invasive medical procedures,
          or surgery (abnormal scarring, adhesions, restenosis).

          '
        cell_types:
        - preferred_term: Fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: Extracellular Matrix Organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: INCREASED
        - preferred_term: Collagen Fibril Organization
          term:
            id: GO:0030199
            label: collagen fibril organization
          modifier: INCREASED
        - preferred_term: Wound Healing and Scarring
          term:
            id: GO:0042060
            label: wound healing
          modifier: INCREASED
      selected_evidence:
        snippet: Myhre syndrome is a rare condition caused by a mutation in the SMAD4 gene, which leads
          to a defective TGF-β/BMP signaling, resulting in the proliferation of abnormal fibrous tissues.
        supports: SUPPORT
