  f974736075d7edc26d9517470d966fede32e102c9d9d913b4c53a9c2f49cb57d:
    claim:
      about:
        disease:
          name: Myhre Syndrome
          disease_term:
            preferred_term: Myhre Syndrome
            term:
              id: MONDO:0007688
              label: Myhre syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: SMAD4
        association: Causative
        gene_term:
          preferred_term: SMAD4
          term:
            id: hgnc:6770
            label: SMAD4
        notes: 'Myhre syndrome is caused by recurrent heterozygous gain-of-function missense variants
          in SMAD4, the co-mediator SMAD of TGF-beta/BMP signaling. The mutational spectrum is unusually
          narrow, restricted to MH2-domain residues Ile500 (c.1498A>G p.Ile500Val; c.1499T>C p.Ile500Thr;
          c.1500A>G p.Ile500Met; p.Ile500Leu) and Arg496 (c.1486C>T p.Arg496Cys). Variants are almost
          always de novo and of paternal germline origin.

          '
        variants:
        - name: p.Ile500Val (c.1498A>G)
          description: 'The most common Myhre-associated SMAD4 variant (49% of the MGH cohort), affecting
            MH2-domain residue Ile500.

            '
        - name: p.Arg496Cys (c.1486C>T)
          description: 'A recurrent MH2-domain variant (38% of the MGH cohort) associated with milder
            hearing loss, growth restriction, and aortic hypoplasia.

            '
        - name: p.Ile500Thr (c.1499T>C)
          description: 'An MH2-domain variant associated with moderate/severe aortic hypoplasia in a majority
            of carriers in the MGH cohort.

            '
      selected_evidence:
        snippet: Pathogenic variants in SMAD4 involved protein residues p.Ile500Val (49%), p.Ile500Thr
          (11%), p.Ile500Leu (2%), and p.Arg496Cys (38%).
        supports: SUPPORT
