        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: myiasis_maggot_debridement_duality
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Under what conditions does facultative larval colonization of a wound shift from pathological
          myiasis to therapeutic debridement?
        attaches_to:
        - pathophysiology#Proteolytic digestion of host tissue
        - pathophysiology#Secondary bacterial superinfection
        rationale: The same species that causes facultative wound myiasis, Lucilia sericata, is reared
          for maggot debridement therapy, where its proteolytic and antimicrobial secretions are deliberately
          used to clean infected wounds. This is not a contradiction to be resolved by picking a side;
          it means the sign of the mechanism depends on larval burden, species, tissue selectivity, and
          whether the colonization was controlled. Curating that boundary matters, because the entry asserts
          tissue digestion as pathogenic while the literature reports the same activity as beneficial
          in a controlled setting.
      selected_evidence:
        snippet: Maggot debridement therapy may be a promising treatment and beneficial for soft tissue
          infection-related sepsis.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
