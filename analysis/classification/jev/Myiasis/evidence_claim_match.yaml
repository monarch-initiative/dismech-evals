              label: myiasis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: myiasis_evidence_base_case_reports
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the true global burden of human myiasis, and how do the available treatments compare?
        attaches_to:
        - treatments#Ivermectin
        - epidemiology#Tropical and subtropical distribution with socioeconomic gradient
        rationale: 'Myiasis is not notifiable in any jurisdiction and there is no surveillance system,
          so incidence and prevalence estimates rest on case reports and single-country reviews that are
          known to under-ascertain. The same gap affects therapy: ivermectin dosing and route are supported
          only by individual cases and uncontrolled series, and no comparative trial of mechanical removal,
          occlusion, or antiparasitic adjuncts exists. Standardized case definitions separating true myiasis
          from pseudomyiasis are also lacking.'
        proposed_experiments:
        - experiment_id: exp_myiasis_sentinel_surveillance
          name: Sentinel surveillance with species-level reporting
          description: Establish sentinel surveillance for myiasis in endemic districts with mandatory
            species-level reporting and a case definition that excludes pseudomyiasis, to produce the
            first incidence estimates not derived from case reports.
        - experiment_id: exp_myiasis_ivermectin_comparative_study
          name: Comparative study of ivermectin adjunct versus removal alone
          description: Run a prospective comparative study of ivermectin as an adjunct versus mechanical
            removal alone in wound and cavitary myiasis, with prespecified outcomes of complete larval
            clearance, secondary infection, and tissue loss.
      selected_evidence:
        snippet: Our findings indicate that cryptic myiasis cases due to the obligate parasite, C. bezziana,
          are under-recognized.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31618203
      reference_title: 'Human Chrysomya bezziana myiasis: A systematic review.'
      evidence_source: HUMAN_CLINICAL
      explanation: Supports systematic under-recognition of cases even for a listed obligate parasite.
