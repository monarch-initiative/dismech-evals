      assertion_type: Definition
      assertion:
        name: Clinical case definition for human myiasis
        definition_type: CASE_DEFINITION
        description: Human myiasis is defined by the presence of living dipteran fly larvae in or on the
          tissues of a living person, with the larvae feeding on host tissue, body fluids, or ingested
          food for at least part of their development.
        scope: Symptomatic and asymptomatic human infestation by dipteran fly larvae
      selected_evidence:
        snippet: refers to the infestation of live human and vertebrate animals with dipterous (two-winged)
          larvae (maggots) which, at least for a certain period, feed on the host's dead or living tissue,
          liquid body-substance, or ingested food
        supports: SUPPORT
