      assertion:
        name: Secondary bacterial superinfection
        biological_scale: TISSUE
        description: 'Necrotic tissue, exudate, and a breached epithelial barrier permit bacterial colonization
          and invasive soft-tissue infection. This is the principal mechanism by which myiasis becomes
          life-threatening. Most isolates are the ordinary wound flora - Staphylococcus aureus, Streptococcus
          pyogenes - but the larvae also carry their own: Wohlfahrtiimonas chitiniclastica is a chitinolytic
          gram-negative rod associated with the larvae themselves rather than with the host''s skin, first
          isolated from Wohlfahrtia magnifica, and it is reported almost exclusively in myiasis. That
          makes it a myiasis-specific superinfection risk rather than generic wound contamination, and
          it is easily missed without MALDI-TOF or 16S sequencing.'
        biological_processes:
        - preferred_term: neutrophil chemotaxis
          term:
            id: GO:0030593
            label: neutrophil chemotaxis
          modifier: INCREASED
      selected_evidence:
        snippet: This obligate parasitism can result in severe pain, secondary bacterial infections, disfigurement,
          and, in the absence of timely treatment, substantial morbidity or death in both humans and animals.
        supports: SUPPORT
