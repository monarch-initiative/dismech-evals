      assertion_type: Definition
      assertion:
        name: Distinction of true myiasis from pseudomyiasis
        definition_type: DIAGNOSTIC_CRITERIA
        description: True myiasis requires larvae that develop on or in living host tissue. Recovery of
          larvae from stool or a body orifice is not sufficient, because accidentally ingested or post-passage-contaminating
          larvae of synanthropic flies may be passed without ever having colonized the host.
        scope: Reported gastrointestinal and cavitary cases where larvae are recovered but colonization
          is unproven
      selected_evidence:
        snippet: Larvae of this species have been reported in suspected cases of intestinal myiasis, but
          whether they can establish true gastrointestinal infestation remains uncertain.
        supports: SUPPORT
