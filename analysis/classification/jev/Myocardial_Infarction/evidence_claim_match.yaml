              label: myocardial infarction
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Coronary Atherothrombosis
        description: 'A coronary atherosclerotic plaque with a thin fibrous cap and a large necrotic core
          ruptures (or, less often, erodes), exposing highly thrombogenic necrotic-core material and subendothelial
          collagen to flowing blood. Platelet adhesion and activation with activation of the coagulation
          cascade form an occlusive or near-occlusive coronary thrombus that abruptly interrupts blood
          flow to the downstream myocardium. Systemic inflammation, including that accompanying acute
          respiratory infection, can destabilize vulnerable plaque and promote a procoagulant state.

          '
        cell_types:
        - preferred_term: coronary endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: platelet activation
          term:
            id: GO:0030168
            label: platelet activation
          modifier: INCREASED
        - preferred_term: blood coagulation
          term:
            id: GO:0007596
            label: blood coagulation
          modifier: INCREASED
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
        locations:
        - preferred_term: coronary artery
          term:
            id: UBERON:0001621
            label: coronary artery
      selected_evidence:
        snippet: such plaques may suddenly cause life-threatening coronary thrombosis presenting as an
          acute coronary syndrome.
        supports: SUPPORT
    origin:
