  2ef96589c99f3fe4fa176f80b500bd0421d4959c30e768d1b2f41a4810e28947:
    claim:
      about:
        disease:
          name: Myocardial Infarction
          disease_term:
            preferred_term: myocardial infarction
            term:
              id: MONDO:0005068
              label: myocardial infarction
        context:
        - path: /experimental_models/0
          value:
            name: Human cardiac infarct organoid with an internal oxygen-diffusion gradient
            description: A self-assembled multicellular human cardiac microtissue in which the infarct
              is produced by geometry rather than by a uniform treatment. At a radius of ~150 um and 10%
              ambient oxygen, oxygen consumption outruns diffusion toward the core, so a single organoid
              carries an apoptotic centre, a dysfunctional interior and a functional edge at once — the
              in vitro counterpart of the infarct, border and remote zones. Chronic norepinephrine supplies
              the neurohormonal arm. Because the pathology is spatially graded within one construct, edge
              and interior can be compared as internal controls, which uniform hypoxia (0.1% O2, which
              kills the whole construct) cannot do.
            experimental_model_type: ORGANOID
            namo_type: namo:Organoid
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: myocardium
              term:
                id: UBERON:0002349
                label: myocardium
            cell_types:
            - preferred_term: cardiac muscle cell
              term:
                id: CL:0000746
                label: cardiac muscle cell
            - preferred_term: cardiac fibroblast
              term:
                id: CL:0002548
                label: fibroblast of cardiac tissue
            - preferred_term: endothelial cell
              term:
                id: CL:0000115
                label: endothelial cell
            - preferred_term: adipose-derived stem cell
              term:
                id: CL:0002570
                label: mesenchymal stem cell of adipose tissue
            conditions:
            - graded hypoxia (10% ambient O2, 10 days) with 1 uM norepinephrine
            - hypoxia-exacerbated doxorubicin cardiotoxicity
            cell_source: iPSC-derived cardiomyocytes combined with primary human cardiac ventricular fibroblasts,
              umbilical vein endothelial cells and adipose-derived stem cells
            culture_system: Non-adhesive agarose micromold self-assembly into ~150 um-radius microtissues;
              calcium dynamics read by a custom two-photon scanned light-sheet microscope at 20 ms resolution
              through the organoid interior
            publication: PMID:32284552
            notes: Curated from the Brenden et al. perspective on spatiotemporally instrumented in vitro
              tissues (DOI:10.1016/j.celbio.2026.100576), which cites this model as the example of engineering
              spatial heterogeneity into an organoid instead of applying a spatially uniform disease stimulus.
          role: ancestor
        - path: /experimental_models/0/modeled_mechanisms/0
          value:
            target: Myocardial Ischemia and Cardiomyocyte Death
            relationship: RECAPITULATES
            fidelity: MODERATE
            model_scale: CELLULAR
            description: The oxygen gradient reproduces regional ischemic cardiomyocyte death and the
              arrhythmogenic calcium-handling defect, spatially separated within one construct rather
              than averaged over it.
            limitations: Death here is driven by diffusion-limited hypoxia in a construct with no vasculature
              and no coronary occlusion, so the model reproduces the consequence of interrupted perfusion
              but not its atherothrombotic cause. The cardiomyocytes are immature iPSC-derived cells.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Apoptotic nuclei at the organoid core (TUNEL)
        target: Myocardial Ischemia and Cardiomyocyte Death
        direction: INCREASED
        interpretation: Cell death is localized to the region the diffusion model predicts is below viable
          oxygen, which is what makes the construct zonal rather than uniformly injured.
      selected_evidence:
        snippet: infarct organoids showed apoptotic TUNEL+ staining in the center of organoid sections,
          attributed mainly to the non-viable oxygen levels at the center of the organoids
        supports: SUPPORT
