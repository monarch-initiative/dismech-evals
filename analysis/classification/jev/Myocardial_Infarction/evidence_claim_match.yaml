  70ef69d56f46c40e54dbcfa85a0cb750c47182f0a752f5ac170ecf0249c1cf48:
    claim:
      about:
        disease:
          name: Myocardial Infarction
          disease_term:
            preferred_term: myocardial infarction
            term:
              id: MONDO:0005068
              label: myocardial infarction
        context: []
      assertion_type: Biochemical
      assertion:
        name: Total lipids in very small VLDL (XS-VLDL-L)
        specificity: 'Research NMR lipoprotein measure, not a clinical MI test. Ranked as the metabolite
          with the strongest risk-increasing Mendelian randomization estimate for myocardial infarction
          across 313 plasma measures in a 274,241-participant UK Biobank atlas.

          '
        context: 'XS-VLDL-L quantifies the total lipid carried in the very small VLDL subclass, the remnant-lipoprotein
          end of the triglyceride-rich spectrum, on the Nightingale Health NMR platform used in UK Biobank.
          No presence value is recorded because the reported quantity is a genetically instrumented effect
          estimate over a general-population cohort rather than an observed level in patients with infarction.
          The finding is consistent with the wider remnant-cholesterol literature and supports curating
          atherogenic apoB-lipoprotein burden, not LDL-C alone, as the lipid input to coronary atherothrombosis.
          It is a risk-stratification signal and does not displace troponin, which remains the diagnostic
          biomarker for an acute event.

          '
        readouts:
        - target: Coronary Atherothrombosis
          relationship: PREDICTS
          direction: POSITIVE
          endpoint_context: PROGNOSTIC
          interpretation: 'Higher very-small-VLDL lipid content marks a more atherogenic remnant-lipoprotein
            burden and tracks with a higher risk of the atherothrombotic event that initiates infarction.

            '
      selected_evidence:
        snippet: total lipids in very small VLDL (XS-VLDL-L) exhibited the strongest association with
          increased risk of myocardial infarction (OR = 1.55 (1.48-1.63)
        supports: SUPPORT
