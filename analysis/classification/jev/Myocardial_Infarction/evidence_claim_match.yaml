  25f61c1f86138784b44428fdff2146796c1945d42e3243041168d9e469bbe38f:
    claim:
      about:
        disease:
          name: Myocardial Infarction
          disease_term:
            preferred_term: myocardial infarction
            term:
              id: MONDO:0005068
              label: myocardial infarction
        context: []
      assertion_type: Biochemical
      assertion:
        name: Elevated cardiac troponin
        presence: Elevated
        context: 'A rise and/or fall of high-sensitivity cardiac troponin (cTnI or cTnT) above the 99th-percentile
          upper reference limit, in a clinical context of ischemia, is the biomarker cornerstone of the
          Fourth Universal Definition of MI; troponin is the most sensitive/specific marker for acute
          myocardial injury.

          '
        notes: 'Sensitivity and mechanistic specificity diverge here. The 99th-centile threshold detects
          troponin release from any cause of cardiomyocyte injury, so widening hs-cTn testing enlarges
          the myocardial-injury pool faster than the type 1 MI pool: in a whole-population registry the
          diagnostic yield among tested emergency-department patients fell from 73 to 47 per 1000 between
          2014 and 2024 as testing extended to lower-risk patients (PPR:PPR1272216, a preprint), while
          a cluster-randomised trial found only about a third of patients reclassified by the assay had
          type 1 MI (PMID:30170853). See the `definitions` entry for the ascertainment consequences. The
          73-to-47 figures are deliberately NOT curated as `prevalence:` records: they are a test-positivity
          yield inside a clinician-selected denominator, so encoding them as `rate_per_100000` / `prevalence_class`
          would present roughly 25-30x the true adult population MI incidence to any consumer reading
          those slots, and the caveat would survive only in prose.'
        readouts:
        - target: Myocardial Ischemia and Cardiomyocyte Death
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: 'Troponin reaches the circulation only when cardiomyocyte membrane integrity
            is lost, so a rise and fall above the 99th centile measures the cardiomyocyte-death step.
            It is sensitive for that step but not specific to the type 1 atherothrombotic route, as this
            entry''s evidence records.

            '
      selected_evidence:
        snippet: distinguishing reperfusion injury from ischemic damage is challenging and often requires
          the use of sensitive biomarkers, such as cardiac troponins, alongside advanced imaging modalities.
        supports: SUPPORT
