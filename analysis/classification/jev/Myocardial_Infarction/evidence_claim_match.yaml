  38f1b41e603671702bfbe5d76a8087a7197fef01c7b293106c14ec94a96060d7:
    claim:
      about:
        disease:
          name: Myocardial Infarction
          disease_term:
            preferred_term: myocardial infarction
            term:
              id: MONDO:0005068
              label: myocardial infarction
        context: []
      assertion_type: Definition
      assertion:
        name: High-sensitivity cardiac troponin ascertainment of myocardial infarction in emergency-department
          suspected acute coronary syndrome
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: ESTABLISHED_CRITERIA
        validation_status:
          status: UNVALIDATED
          rationale: 'The underlying threshold rule is consensus criteria (Universal Definition of MI:
            hs-cTn above the sex-specific 99th centile with a rise and/or fall in an ischemic context),
            and the cohort form of it has been executed at whole-population scale in a linked EHR registry
            (117,142 consecutive patients over a decade). What is NOT validated is its specificity for
            the type 1 atherothrombotic mechanism this entry models: in a cluster-randomised trial of
            the same threshold, most patients it reclassified had myocardial injury rather than type 1
            MI. Treat this as an ascertainment cohort for suspected ACS, not as a mechanism-specific case
            definition, until a query that separates type 1 MI from type 2 MI and non-ischemic myocardial
            injury is evaluated against adjudicated diagnoses.'
        description: 'EHR/OMOP-style ascertainment used by linked-registry studies of suspected acute
          coronary syndrome: take all adult emergency-department presentations in which high-sensitivity
          cardiac troponin was measured within 24 hours as the denominator, and count as cases those meeting
          the Universal Definition threshold (hs-cTn above the 99th centile of a normal reference population).
          Recorded here because the boundary it draws is mechanistically load-bearing for this entry,
          which models type 1 (atherothrombotic) MI: the threshold detects cardiomyocyte troponin release
          from any cause, so the cohort it returns mixes type 1 MI with type 2 MI and non-ischemic myocardial
          injury.'
        scope: Emergency-department suspected-ACS ascertainment in linked primary/secondary care records;
          denominator plus troponin-threshold case rule, without adjudication of MI type.
        attaches_to:
        - pathophysiology#Myocardial Ischemia and Cardiomyocyte Death
        criteria_sets:
        - name: Troponin-tested suspected-ACS cohort
          description: Adults presenting to a secondary- or tertiary-care emergency department in whom
            high-sensitivity cardiac troponin was measured within 24 hours of presentation; cases are
            those exceeding the 99th-centile diagnostic threshold.
          inclusion_criteria:
          - preferred_term: Adult emergency-department presentation
            description: Adult patient presenting to a secondary- or tertiary-care emergency department.
          laboratory_requirements:
          - preferred_term: High-sensitivity cardiac troponin measured within 24 hours
            description: hs-cTnI or hs-cTnT measured within 24 hours of presentation; defines the denominator
              of the tested population.
          - preferred_term: Troponin above the 99th-centile diagnostic threshold
            description: Concentration exceeding the (sex-specific) 99th centile of a normal reference
              population, the Universal Definition threshold.
          additional_requirements:
          - preferred_term: MI type not resolved by the algorithm
            description: The threshold does not distinguish type 1 MI from type 2 MI or non-ischemic myocardial
              injury; adjudication is required for that.
        notes: PPR:PPR1272216 is a non-peer-reviewed preprint and is used here only to document how the
          cohort was operationalized at population scale; the threshold rule and the injury-versus-type-1-MI
          caveat are both carried by the peer-reviewed randomised trial PMID:30170853. The primary source
          of the threshold rule is the Fourth Universal Definition of Myocardial Infarction (PMID:30165617,
          Thygesen et al.), but it is not cited as an evidence item here because no abstract or full text
          is retrievable for it (the fetcher caches it as content unavailable), so no snippet can be verified;
          the rule is therefore quoted from PMID:30170853's statement of it.
      selected_evidence:
        snippet: The Universal Definition of Myocardial Infarction1 recommends that an increase in troponin
          above the 99th centile of a normal reference population should be used as the threshold for
          diagnosis of myocardial infarction.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30170853
      reference_title: 'High-sensitivity troponin in the evaluation of patients with suspected acute coronary
        syndrome: a stepped-wedge, cluster-randomised controlled trial.'
      evidence_source: HUMAN_CLINICAL
      explanation: States the consensus threshold rule this ascertainment algorithm implements.
