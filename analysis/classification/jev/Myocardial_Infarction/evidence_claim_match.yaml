            label: inflammatory response
          modifier: INCREASED
        - preferred_term: wound healing
          term:
            id: GO:0042060
            label: wound healing
          modifier: INCREASED
        locations:
        - preferred_term: myocardium
          term:
            id: UBERON:0002349
