  bc2cabde411cc49b58c17c20ad4fbbfe802d645b5d096f269a6bd0daa4c2c38a:
    claim:
      about:
        disease:
          name: Myocardial Infarction
          disease_term:
            preferred_term: myocardial infarction
            term:
              id: MONDO:0005068
              label: myocardial infarction
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Myocardial Ischemia and Cardiomyocyte Death
        description: 'Sustained interruption of coronary perfusion causes regional myocardial ischemia.
          If flow is not restored, cardiomyocytes undergo necrosis and apoptosis, releasing cardiac troponin
          into the circulation (the biomarker basis of MI diagnosis). Loss of contractile myocardium reduces
          left ventricular systolic function and provides an arrhythmogenic substrate, and can progress
          to heart failure.

          '
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: cardiac muscle cell apoptotic process
          term:
            id: GO:0010659
            label: cardiac muscle cell apoptotic process
          modifier: INCREASED
        locations:
        - preferred_term: myocardium
          term:
            id: UBERON:0002349
            label: myocardium
        - preferred_term: heart
          term:
            id: UBERON:0000948
            label: heart
      selected_evidence:
        snippet: Myocardial infarction is defined as sudden ischemic death of myocardial tissue.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
