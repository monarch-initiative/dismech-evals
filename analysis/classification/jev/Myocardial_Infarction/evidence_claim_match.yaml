              id: MONDO:0005068
              label: myocardial infarction
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Post-Infarction Inflammation and Cardiac Repair
        description: 'Massive cardiomyocyte death releases damage-associated molecular patterns (DAMPs/alarmins)
          that engage pattern-recognition receptors (TLRs, NLRs), driving cytokine (IL-1, TNF-alpha, IL-6)
          and chemokine (CCL2) production and recruitment of neutrophils and monocytes. Expansion and
          diversification of cardiac macrophages clears dead cells; efferocytosis then triggers anti-inflammatory
          mediators (IL-10, TGF-beta) that restrain inflammation and activate reparative fibroblasts and
          vascular cells. This tightly regulated inflammatory-to-reparative transition is essential for
          healing, but an excessive or unresolved response promotes adverse outcomes.

          '
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
