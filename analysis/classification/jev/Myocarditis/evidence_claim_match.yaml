      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: postinfectious_autoimmunity
        hypothesis_label: Post-infectious autoimmunity against cardiac myosin sustains chronic injury
        status: CANONICAL
        description: Under this model the initiating virus is cleared, but antigen release and the inflammatory
          context break tolerance to cardiac myosin. Cross-reactive T cells and autoantibodies then sustain
          myocardial injury after the virus is gone, which is why virus-negative inflammatory cardiomyopathy
          responds to immunosuppression.
      selected_evidence:
        snippet: The chronic phase of myocarditis is associated with mononuclear infiltration of the myocardium
          and the production of autoantibodies to cardiac myosin, although infectious virus cannot be
          detected past day 14 of infection.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
