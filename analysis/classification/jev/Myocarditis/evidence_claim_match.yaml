        description: NOD2-deficient mice infected with CVB3 show reduced cardiac inflammation, fibrosis
          and apoptosis, lower CAR expression and viral copy number, and improved left ventricular function
          relative to wild-type infected controls.
        publication: PMID:28912259
        modeled_mechanisms:
        - target: Innate Immune Sensing and Cytokine Amplification
          relationship: PERTURBS
          fidelity: MODERATE
          description: Genetic removal of the innate sensor establishes that this node is causally required
            for the downstream inflammation, fibrosis and contractile loss.
          limitations: A single-gene knockout in an enteroviral model; NOD2 dependence has not been shown
            for the non-enteroviral or drug-induced forms of human myocarditis.
      selected_evidence:
        snippet: Left ventricular NOD2 mRNA expression was also induced in CVB3-induced myocarditis versus
          healthy control mice.
        supports: SUPPORT
