      assertion:
        name: Cardiotropic Viral Infection of the Myocardium
        description: A cardiotropic virus reaches and infects the myocardium. Enteroviruses such as coxsackievirus
          B enter cardiomyocytes through the coxsackievirus and adenovirus receptor; parvovirus B19 and
          HHV-6 are recovered most often from contemporary biopsies and are largely endothelial in tropism;
          SARS-CoV-2 can be detected in myocardium in fatal COVID-19, but usually as very rare infected
          cells. Direct viral replication is only the opening move - in most cases the burden of injury
          is delivered by what the host does next.
        role: trigger
        biological_scale: CELLULAR
        cell_types:
