  a7c70474b20f340ef44b157a0ae0f330d51b86d8b6fa271eaf4b5384377ce02c:
    claim:
      about:
        disease:
          name: Myocarditis
          disease_term:
            preferred_term: myocarditis
            term:
              id: MONDO:0004496
              label: myocarditis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Checkpoint Withdrawal and Off-Target Myocardial T Cell Reactivity
        description: Blockade of CTLA-4, PD-1 or PD-L1 removes the inhibitory signalling that normally
          restrains T cell activation, including in the heart. The myocardial infiltrate in checkpoint-inhibitor
          myocarditis carries the same clonally expanded T cell populations found in the tumour and in
          skeletal muscle, so this is not hypersensitivity to a drug but a loss of peripheral tolerance
          that lets a tumour-directed T cell response spill onto a shared cardiac and skeletal-muscle
          antigen. It explains the frequent myositis and myasthenic overlap.
        role: trigger
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: CD8-positive cytotoxic T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: Negative regulation of T cell activation
          term:
            id: GO:0050868
            label: negative regulation of T cell activation
          modifier: DECREASED
      selected_evidence:
        snippet: Inflammation of the heart muscle, known as myocarditis, resulting from ICI targeting
          cytotoxic T lymphocyte-associated antigen 4 (CTLA4), programmed cell death protein 1 (PD1) and
          PD1 ligand 1 (PDL1) is an infrequent but potentially fatal complication.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
