              label: myocarditis
        context: []
      assertion_type: Genetic
      assertion:
        name: Cardiomyopathy-associated gene variants
        relationship_type: SUSCEPTIBILITY
        association: Pathogenic or likely pathogenic variants in inherited-cardiomyopathy genes - desmosomal
          genes such as DSP and PKP2, and sarcomeric and cytoskeletal genes such as TTN, MYH7 and FLNC
          - are found in a substantial minority of patients with acute myocarditis and are markedly enriched
          in those with a complicated course. There is no myocarditis gene; the genotype modifies susceptibility
          and severity rather than causing the inflammatory episode, and it is one reason a myocarditis-like
          presentation can be the first manifestation of an inherited cardiomyopathy.
        notes: No gene_term is bound because the evidence curated here is at the level of gene classes
          (desmosomal versus sarcomeric) from a meta-analysis, not a variant-level claim about a named
          gene. Binding a specific HGNC gene would assert more than the cited source supports.
      selected_evidence:
        snippet: Acute myocarditis is an inflammatory condition that may precede the development of dilated
          or arrhythmogenic cardiomyopathy.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
