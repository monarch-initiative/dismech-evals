      assertion_type: Pathophysiology
      assertion:
        name: Genetically Susceptible Myocardium
        description: A minority of patients carry a pathogenic or likely pathogenic variant in an inherited-cardiomyopathy
          gene, and that background modifies how the myocardium responds to an inflammatory insult. Such
          variants are found in around 4% of uncomplicated acute myocarditis but in roughly a fifth of
          adults and nearly half of children whose myocarditis is complicated by heart failure, reduced
          ejection fraction, or life-threatening ventricular arrhythmia, with desmosomal genes predominating
          in the milder group and sarcomeric genes in the severe one. This is a susceptibility and severity
          modifier, not a cause of myocarditis - the inflammatory episode still needs its own trigger.
        role: modifier
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: 'For uncomplicated myocarditis, the pooled prevalence was 4.2% (95% CI: 1.8%-7.4%; I2
          = 1.4%), whereas for complicated myocarditis, the pooled prevalence was 21.9% (95% CI: 14.3%-30.5%;
          I2 = 38.8%) and 44.5% (95% CI: 22.7%-67.4%; I2 = 52.8%) in adults and children, respectively.'
        supports: SUPPORT
    origin:
