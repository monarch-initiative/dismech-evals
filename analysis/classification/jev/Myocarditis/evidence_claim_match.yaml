      assertion_type: Discussion
      assertion:
        discussion_id: why_some_progress_to_dcm
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do some patients with acute myocarditis recover with no residual myocardial injury
          while others progress to dilated cardiomyopathy?
        attaches_to:
        - pathophysiology#Post-Inflammatory Ventricular Remodeling
        - pathophysiology#Inflammatory Dilated Cardiomyopathy
        rationale: 'This is the determining question for the whole entry: the acute phase is usually survivable
          and the chronic phase is not reversible, so everything that matters clinically turns on which
          patients cross between them. The relative contributions of the pathogen, host genotype and environment
          are unsettled, which is also why no treatment strategy is established for preventing the transition.
          The two hypothesis groups curated above - post-infectious autoimmunity and viral persistence
          - are the leading competing explanations and are not mutually exclusive.'
      selected_evidence:
        snippet: The relative roles of the pathogen, host genomics and environmental factors in disease
          progression and healing are still under discussion, including which viruses are active inducers
          and which are only bystanders.
        supports: SUPPORT
