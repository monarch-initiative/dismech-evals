      assertion_type: Subtype
      assertion:
        name: ICI-Associated
        display_name: Immune checkpoint inhibitor-associated myocarditis
        description: 'Myocarditis precipitated by cancer immunotherapy targeting CTLA-4, PD-1 or PD-L1.
          It is uncommon but has the highest case fatality of any immune-related adverse event, typically
          presents within weeks of the first doses, and frequently overlaps with myositis and myasthenia
          gravis. Mechanistically it is not a hypersensitivity reaction: the myocardial infiltrate carries
          the same T cell clones found in the tumour and skeletal muscle. Combination CTLA-4 plus PD-1
          blockade is the best-established risk factor.'
      selected_evidence:
        snippet: Myocarditis had the highest fatality rate (52 [39.7%] of 131 reported cases), whereas
          endocrine events and colitis had only 2% to 5% reported fatalities
        supports: SUPPORT
