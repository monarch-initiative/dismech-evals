            label: innate immune response
          modifier: INCREASED
        - preferred_term: Inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: NOD2 knockdown(-/-) mice were rescued from the detrimental CVB3-mediated effects as shown
          by a reduced cardiac inflammation (less cardiac infiltrates and suppression of proinflammatory
          cytokines), cardiac fibrosis, apoptosis, lower CAR (Coxsackievirus and adenovirus receptor)
          expression and CVB3 copy number, and an improved left ventricular function in NOD2-/- CVB3 mice
          compared with wild-type CVB3 mice.
        supports: SUPPORT
