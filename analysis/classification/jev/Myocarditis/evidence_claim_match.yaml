        description: Myocyte death - by immune killing, by eosinophil granule toxicity, or by direct viral
          cytoskeletal disruption - releases troponin, removes contractile units, and together with interstitial
          oedema impairs systolic performance. This is the inflammatory instance of the generic primary
          cardiomyocyte insult that opens the maladaptive remodelling pathway shared with the inherited
          and toxic cardiomyopathies.
        role: effector
