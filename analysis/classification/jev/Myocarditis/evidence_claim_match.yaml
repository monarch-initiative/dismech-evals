      assertion_type: Subtype
      assertion:
        name: Lymphocytic
        display_name: Lymphocytic myocarditis
        description: 'The commonest histological form: a T-cell-rich mononuclear infiltrate with associated
          myocyte injury. It is the histological correlate of most presumed-viral and idiopathic myocarditis,
          and is the form in which the Myocarditis Treatment Trial found no benefit from routine immunosuppression.
          It has no distinct MONDO identifier; it is a biopsy-defined pattern rather than an aetiology.'
      selected_evidence:
        snippet: In a subanalysis including only adults with lymphocytic myocarditis, the main endpoints
          occurred more frequently in FM compared with in NFM both at 60 days (19.5% vs. 0%, p = 0.005)
          and at 7-year follow up (41.4% vs. 3.1%, p = 0.0004).
        supports: SUPPORT
