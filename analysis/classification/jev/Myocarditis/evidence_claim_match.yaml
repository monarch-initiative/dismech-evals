        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: eam_cvb3_translational_validity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the two standard rodent models - coxsackievirus B3 infection and cardiac myosin-induced
          experimental autoimmune myocarditis - reproduce the mechanisms that actually drive human myocarditis,
          given that enterovirus is now a minority cause and that no human disease begins with adjuvanted
          self-antigen immunization?
        attaches_to:
        - pathophysiology#Cardiotropic Viral Infection of the Myocardium
        - pathophysiology#Anti-Cardiac Myosin Autoimmunity
        rationale: Most of the mechanistic content in this entry - innate sensing, dystrophin cleavage,
          anti-myosin autoimmunity, IL-17-driven fibrosis - rests on these two models, and both have a
          specific translational problem. CVB3 models an agent that contemporary human endomyocardial
          biopsy recovers far less often than parvovirus B19 or HHV-6, and its outcome is strongly conditioned
          on strain, sex and viral passage. Experimental autoimmune myocarditis reproduces the effector
          autoimmunity faithfully but starts from a deliberate adjuvanted immunization that has no human
          counterpart, so it cannot speak to how tolerance is broken in the first place. Evidence exists
          in these models; what is uncertain is how far it carries.
      selected_evidence:
        snippet: Most frequently, virus DNA was detected by PCR from parvovirus B19 (PVB19, 59%) and human
          herpesvirus 6 (HHV6, 26%).
        supports: SUPPORT
    origin:
