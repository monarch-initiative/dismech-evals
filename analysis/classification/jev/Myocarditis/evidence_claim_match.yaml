          drives NLRP3-caspase-1-IL-1beta signalling and viral uptake; monocytes and macrophages are recruited
          and generate IL-1, IL-6, TNF and reactive oxygen species. This is the step that converts a focal
          infection into diffuse myocardial inflammation, and it is the target of IL-1 blockade.
