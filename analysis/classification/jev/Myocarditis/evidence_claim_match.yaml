        display_name: Viral myocarditis
        subtype_term:
          preferred_term: viral myocarditis
          term:
            id: MONDO:0023161
            label: viral myocarditis
        description: Myocarditis in which a cardiotropic virus is the initiating insult. Enteroviruses
          (notably coxsackievirus B), parvovirus B19, human herpesvirus 6, adenovirus, influenza and SARS-CoV-2
          are the agents most often recovered from myocardium. The endomyocardial-biopsy virome has shifted
          over time from enterovirus-dominant to parvovirus B19- and HHV-6-dominant, and detection of
          viral nucleic acid alone does not establish that the virus is causing the current inflammation
          rather than sitting latent in endothelium.
      selected_evidence:
        snippet: Most frequently, virus DNA was detected by PCR from parvovirus B19 (PVB19, 59%) and human
          herpesvirus 6 (HHV6, 26%).
        supports: SUPPORT
