        description: Methylprednisolone pulse therapy at 500-1,000 mg/day is the guideline-recommended
          first step for checkpoint-inhibitor myocarditis, and a substantial fraction of patients do not
          respond to it. Abatacept is the proposed preferred second agent for isolated steroid-refractory
          disease; alemtuzumab or tocilizumab/tofacitinib are proposed for rapidly progressive or IL-6-high
          disease, and abatacept combined with ruxolitinib, mycophenolate mofetil or IVIG for cases overlapping
          myositis or myasthenia gravis. The evidence base is 45 case reports and case series, not a trial,
          and the authors of the proposed algorithm say so themselves.
        treatment_term:
          preferred_term: Immunosuppressive Therapy
          term:
            id: NCIT:C15261
            label: Immunosuppressive Therapy
          therapeutic_agent:
