      assertion:
        name: Interleukin-1 Blockade
        description: Anakinra, an IL-1 receptor antagonist, targets the NLRP3-caspase-1-IL-1beta arm of
          the innate amplification step. It is investigational in acute myocarditis; ARAMIS is the randomized
          trial designed to test it, and the indication should not be treated as established.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: anakinra
            term:
              id: NCIT:C38717
              label: Anakinra
        therapeutic_modality: OTHER
        notes: ARAMIS has reported and was negative in its enrolled population, so IL-1 blockade is NOT
          an established treatment for acute myocarditis. It is retained here because the mechanism target
          is real and the residual signal is confined to fulminant or hyperinflammatory disease, where
          the evidence is case series only.
      selected_evidence:
        snippet: Clinically, the randomized trial of anakinra in acute myocarditis (ARAMIS) did not improve
          outcomes in a largely low-risk cohort, but accumulating case reports and small series suggest
          potential benefit in fulminant/hyperinflammatory myocarditis and chronic active refractory myocarditis.
        supports: REFUTE
