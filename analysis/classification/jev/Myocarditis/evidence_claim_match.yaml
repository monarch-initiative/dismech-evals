        description: Antigen release in an inflamed myocardium, together with viral epitopes that cross-react
          with the cardiac myosin heavy chain, breaks tolerance. The resulting anti-cardiac-myosin response
          outlives the infection and is itself sufficient to cause myocardial inflammation and necrosis
          - passive transfer of the antibodies reproduces the lesion in uninfected animals. This node
          is the mechanistic content of the post-infectious autoimmunity hypothesis and the rationale
          for immunosuppressing virus-negative inflammatory cardiomyopathy.
