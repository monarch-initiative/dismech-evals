      assertion:
        name: Eosinophilic
        display_name: Eosinophilic and hypersensitivity myocarditis
        description: Myocarditis with an eosinophil-rich infiltrate, most often provoked by a drug (hypersensitivity
          myocarditis) or occurring in the setting of a systemic eosinophilic disorder such as eosinophilic
          granulomatosis with polyangiitis. Peripheral eosinophilia is usual but not obligatory. The hypersensitivity
          form has the highest in-hospital mortality of the eosinophilic subgroups, and the first therapeutic
          step is withdrawal of the offending agent rather than a drug.
