        hypothesis_group_id: viral_persistence
        hypothesis_label: Persistent myocardial viral genome drives ongoing injury and remodelling
        status: ALTERNATIVE
        description: The competing model holds that low-level viral persistence in the myocardium, rather
          than autoimmunity, drives continuing injury; the corollary is that clearance predicts recovery
          and persistence predicts deterioration, and that immunosuppression could be harmful. The two
          hypotheses are not mutually exclusive and probably apply to different patients, which is exactly
          why endomyocardial biopsy with viral PCR governs whether immunosuppression is offered.
      selected_evidence:
        snippet: Advances in molecular diagnosis have indicated beyond doubt that persistence of viral
          infection is associated with disease deterioration and poor prognosis.
        supports: SUPPORT
