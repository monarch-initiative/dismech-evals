      assertion:
        name: Electrical Instability and Arrhythmogenesis
        description: Inflammation, oedema and patchy necrosis disturb conduction and repolarisation directly,
          and the scar left behind provides a fixed re-entrant substrate. The result is ventricular tachyarrhythmia
          and high-grade atrioventricular block, and it is this arm rather than pump failure that accounts
          for myocarditis being a recognised cause of sudden death in young people with previously normal
          hearts.
        role: consequence
        biological_scale: TISSUE
        cell_types:
        - preferred_term: Cardiomyocyte
