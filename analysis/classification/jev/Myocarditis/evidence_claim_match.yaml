      assertion_type: AnimalModel
      assertion:
        species: Mouse
        genotype: Wild-type BALB/c infected with coxsackievirus B3
        category: Infection model
        description: Intraperitoneal coxsackievirus B3 infection of susceptible BALB/c mice produces acute
          myocarditis at days 7-14 and chronic myocarditis from day 28, with viral replication, innate
          and adaptive infiltration, myocyte necrosis and later fibrosis. It is the workhorse model for
          enteroviral myocarditis.
        publication: PMID:11334481
        modeled_mechanisms:
        - target: Cardiotropic Viral Infection of the Myocardium
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Reproduces cardiotropic enteroviral infection of the myocardium and the biphasic
            acute-then-chronic inflammatory course.
          limitations: Enterovirus accounts for a minority of contemporary human myocarditis, where parvovirus
            B19 and HHV-6 dominate the biopsy virome; outcome in the model is also strongly dependent
            on mouse strain, sex, age and viral passage.
        - target: Direct Cardiomyocyte Cytoskeletal Injury
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Murine CVB3 hearts show loss of sarcolemmal dystrophin and dissociation of the
            sarcoglycan complex, the structural lesion this node asserts.
          limitations: Specific to enteroviral protease 2A; it does not generalise to parvovirus B19,
            HHV-6, drug-induced or checkpoint-inhibitor myocarditis.
      selected_evidence:
        snippet: We have investigated two models of virally-induced autoimmune myocarditis in mice using
          widely different infectious agents.
        supports: SUPPORT
