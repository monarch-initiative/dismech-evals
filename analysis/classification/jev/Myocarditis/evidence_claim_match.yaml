          modifier: INCREASED
      selected_evidence:
        snippet: Inflammatory cardiomyopathy is predominantly mediated by viral infection, but can also
          be induced by bacterial, protozoal or fungal infections as well as a wide variety of toxic substances
          and drugs and systemic immune-mediated diseases.
        supports: SUPPORT
