        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: Myocarditis is a leading identified cause of sudden cardiac death in young people,
          and the fulminant presentation carries high short- and long-term rates of cardiac death or transplantation.
          Giant cell myocarditis is near-uniformly fatal without immunosuppression or transplantation.
      selected_evidence:
        snippet: Patients with FM (n = 165) had significantly higher rates of cardiac death and heart
          transplantation compared with those with NFM (n = 55), both at 60 days (28.0% vs. 1.8%, p =
          0.0001) and at 7-year follow-up (47.7% vs. 10.4%, p < 0.0001).
        supports: SUPPORT
    origin:
      assertion_path: /clinical_burden
      evidence_path: /clinical_burden/evidence/0
