        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reflex Sensitivity to Tactile and Acoustic Stimuli in a Subset
        biological_scale: ORGANISM
        description: In a subset of infants the jerks are not spontaneous but are elicited reliably by
          a sudden unexpected touch or noise. Whether these children have a variant of the same syndrome
          or a separate one is genuinely disputed, and this node exists to make the disputed branch explicit
          in the graph rather than leaving it in prose. What can be said from the evidence is that the
          reflex group is developmentally normal in every reported case, which is a real difference from
          the syndrome as a whole and is the strongest argument for separating them.
      selected_evidence:
        snippet: The cognitive outcome in reflex myoclonic epilepsy of infancy is normal in all reported
          cases.
        supports: SUPPORT
