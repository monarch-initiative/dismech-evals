  4f50cac06c91f9ec25e7835c95f363ea9018bcab52a50e140a5f55a080f87a20:
    claim:
      about:
        disease:
          name: Myoclonic Epilepsy in Infancy
          disease_term:
            preferred_term: myoclonic epilepsy in infancy
            term:
              id: MONDO:0100566
              label: myoclonic epilepsy in infancy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mei_genetic_basis_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What are the genetic mechanisms underlying myoclonic epilepsy in infancy, and is the syndrome's
          clinical heterogeneity the surface of genuine genetic heterogeneity?
        attaches_to:
        - pathophysiology#Age-Restricted Generalized Cortical Hyperexcitability of Infancy
        rationale: 'This entry carries no genetic section and the omission is deliberate. The literature
          reads the syndrome as genetic on the strength of its clinical shape rather than on mapping evidence,
          and it goes a step further, taking the heterogeneity of the presentation as a hint that several
          different genetic mechanisms converge on the same picture. That is a testable claim and nobody
          has tested it. The obstacle is arithmetic: just over a hundred cases in four decades means no
          single centre has a cohort, and the reflex dispute would split even that. The consequence for
          this knowledge base is that borrowing candidate genes from adjacent infantile myoclonic epilepsies
          would be inventing content, and the gap is recorded here instead. It also connects to the other
          two discussions: if the cognitive subgroup and the reflex subgroup have distinct genetic bases,
          both of those disputes resolve at once.'
        proposed_experiments:
        - experiment_id: mei_multicentre_sequencing
          name: Multicentre sequencing cohort with phenotype stratification
          description: Trio exome or genome sequencing of an internationally aggregated cohort recruited
            on current ILAE criteria, stratified at entry by reflex versus spontaneous presentation and
            followed for developmental outcome, so that any genetic findings can be tested against both
            open sub-questions rather than only against the diagnosis.
          decision_criterion: Recurrent variants in one or more genes would establish a genetic basis;
            finding different genes segregating with the reflex and spontaneous groups, or with the cognitive
            outcome, would resolve those disputes directly. A null result at adequate power would support
            polygenic susceptibility.
        - experiment_id: mei_family_aggregation_study
          name: Family aggregation and febrile seizure history
          description: Systematic ascertainment of family history of epilepsy and febrile seizures in
            a multicentre cohort against matched controls, to quantify familial aggregation before any
            molecular work, which is feasible at this syndrome's numbers where sequencing cohorts are
            not.
          decision_criterion: Significant familial aggregation would justify the sequencing investment
            and would constrain the plausible architecture. Aggregation no greater than background would
            weaken the genetic presumption the field currently holds.
      selected_evidence:
        snippet: The clinical heterogeneity within this syndrome suggests that there may be a variety
          of genetic mechanisms that underlie the presentation.
        supports: SUPPORT
