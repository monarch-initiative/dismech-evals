        name: Brief Generalized Myoclonic Seizures
        biological_scale: ORGANISM
        conforms_to: epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures
        description: 'The clinical seizure: a sudden brief bilateral jerk, usually of the head and upper
          limbs, lasting a second or less, often in clusters. Consciousness is not obviously impaired,
          which is one reason the events are frequently dismissed at first as startles or colic. In this
          syndrome the myoclonic seizure is the only seizure type; the appearance of other seizure types
          is a reason to doubt the diagnosis.'
      selected_evidence:
        snippet: Benign myoclonic epilepsy in infancy, classified among the generalised idiopathic epilepsies,
          is characterised by the occurrence of myoclonic seizures in the first three years of life in
          otherwise normal infants.
        supports: SUPPORT
