      assertion_type: Pathophysiology
      assertion:
        name: Persisting Cognitive and Behavioural Difficulty in a Minority
        biological_scale: ORGANISM
        description: 'The reason the syndrome is no longer called benign. Roughly a third of children
          with long-term follow-up have cognitive problems, despite seizures that remitted and an infancy
          that looked normal before onset. Whether this reflects the seizures, the underlying substrate
          that produced them, or the medication used to stop them is not established, and the entry does
          not choose. The practical consequence is stated plainly in the source: the word benign may be
          applied to the seizures but must be used cautiously when counselling a family about their child''s
          development.'
      selected_evidence:
        snippet: However, the cognitive outcome is much less certain with cognitive problems present in
          one-third of children who have long term follow up.
        supports: SUPPORT
