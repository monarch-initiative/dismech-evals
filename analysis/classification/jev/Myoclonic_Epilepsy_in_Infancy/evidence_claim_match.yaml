  0e40f68b072987684d88ec8b31f12b9d8f5d9a70284118e7153da42ab9c28704:
    claim:
      about:
        disease:
          name: Myoclonic Epilepsy in Infancy
          disease_term:
            preferred_term: myoclonic epilepsy in infancy
            term:
              id: MONDO:0100566
              label: myoclonic epilepsy in infancy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mei_reflex_variant_separate_syndrome
        kind: CONTROVERSY
        status: UNDER_DISCUSSION
        prompt: Is reflex myoclonic epilepsy in infancy a variant of this syndrome or a separate entity,
          and does the uniformly normal cognitive outcome of the reflex group settle it?
        attaches_to:
        - pathophysiology#Reflex Sensitivity to Tactile and Acoustic Stimuli in a Subset
        rationale: 'Twenty-three of the just-over-hundred reported cases had seizures elicited by sudden
          touch or noise rather than occurring spontaneously, and their inclusion in the syndrome is described
          in the literature as debatable in those words. Two things pull in opposite directions. Against
          separation: the seizure type is the same myoclonic jerk, the age window is the same, the electroencephalographic
          picture is described as the same, and dividing a hundred-case literature into two fifty-case
          literatures makes both harder to study. For separation: the cognitive outcome differs, and it
          differs in exactly the place where this syndrome''s real morbidity lives. Every reported reflex
          case has been developmentally normal, against a third of the syndrome as a whole having cognitive
          difficulty. If that difference is real rather than an artefact of small numbers and shorter
          follow-up, the reflex group is not a variant but a genuinely better-prognosis entity, and one
          review explicitly recommends that clinicians distinguish them. The curation consequence is concrete:
          this entry currently models the reflex presentation as a node within the syndrome, and if the
          separation is confirmed it should become its own entry.'
        proposed_experiments:
        - experiment_id: mei_reflex_matched_followup
          name: Matched-duration follow-up of reflex and spontaneous groups
          description: Pooled reanalysis of reported cases with developmental outcome censored at equal
            follow-up duration in both groups, testing whether the reflex group's uniformly normal outcome
            survives matching, or whether it reflects shorter follow-up in a group that presents more
            benignly and is discharged earlier.
          decision_criterion: A persisting outcome difference at matched follow-up supports genuine separation.
            Convergence of outcomes once follow-up is equalized would indicate the difference was an ascertainment
            artefact.
        - experiment_id: mei_reflex_electrophysiological_signature
          name: Electrophysiological comparison of reflex and spontaneous jerks
          description: Direct comparison of discharge morphology, the latency from stimulus to jerk in
            the reflex group, and any somatosensory or auditory evoked response abnormality, against age-matched
            children with the spontaneous form.
          decision_criterion: A reproducible electrophysiological difference, particularly an evoked response
            abnormality present only in the reflex group, would support two mechanisms. Indistinguishable
            physiology would support one syndrome with a triggered presentation.
      selected_evidence:
        snippet: The cognitive outcome in reflex myoclonic epilepsy of infancy is normal in all reported
          cases.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
