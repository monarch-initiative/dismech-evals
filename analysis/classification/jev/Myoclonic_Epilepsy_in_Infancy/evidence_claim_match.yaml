      assertion_type: ProgressionInfo
      assertion:
        phase: Evolution to another epilepsy in a minority
        age_range: Later childhood, years after remission
        notes: 'A minority of children go on to develop a different epilepsy after this one has remitted,
          usually another idiopathic generalized epilepsy. This complicates the self-limited framing:
          what remits may be the infantile expression of a generalized epilepsy tendency rather than the
          tendency itself. A polygraphically documented case followed the syndrome into childhood absence
          epilepsy at six years and eight months, which the authors read as evidence of a shared neurobiological
          and genetic link between age-related epileptic phenotypes.'
      selected_evidence:
        snippet: This finding suggests a common neurobiological and genetic link between different age-related
          epileptic phenotypes.
        supports: SUPPORT
