  d8838c52744d4580635a9fa8d8f89fa9e1d4c0a01dd4e7e7aeb83b6f8877985b:
    claim:
      about:
        disease:
          name: Myoclonic Epilepsy in Infancy
          disease_term:
            preferred_term: myoclonic epilepsy in infancy
            term:
              id: MONDO:0100566
              label: myoclonic epilepsy in infancy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mei_benign_label_and_cognitive_outcome
        kind: CONTROVERSY
        status: UNDER_DISCUSSION
        prompt: If about a third of children have lasting cognitive difficulty, what produces it, and
          is it the seizures, the substrate that generated them, or the treatment used to stop them?
        attaches_to:
        - pathophysiology#Persisting Cognitive and Behavioural Difficulty in a Minority
        rationale: 'For forty years this syndrome was called benign, and the seizure data support that:
          they respond to valproate and they stop. The developmental data do not. Roughly a third of children
          with long-term follow-up have cognitive problems, in children whose development was normal before
          onset and whose seizures remitted. The 2022 ILAE nosology removed benign from the syndrome names
          generally, and here the removal has content rather than being a matter of tone. What is not
          settled is the mechanism. Three explanations are available and they are not mutually exclusive.
          The seizures or the interictal discharges may themselves interfere with development during a
          sensitive window, in which case earlier and more complete seizure control should improve outcome.
          The cognitive difficulty may be a second expression of whatever substrate produces the seizures,
          in which case controlling seizures will not change it and the outcome is set before treatment
          begins. Or the treatment may contribute, which is not an idle worry given that the most effective
          drug in this syndrome is valproate and that valproate has recognized neurodevelopmental considerations
          in very young children. These make sharply different predictions and none has been tested against
          the others, largely because the syndrome is rare enough that the whole literature is a hundred-odd
          cases.'
        proposed_experiments:
        - experiment_id: mei_seizure_burden_versus_outcome
          name: Seizure and discharge burden against developmental outcome
          description: A prospective multicentre cohort with quantified seizure counts and interictal
            discharge burden from serial recordings during the active phase, and standardized developmental
            assessment at school age, testing whether burden during infancy predicts outcome once age
            at onset and treatment are accounted for.
          decision_criterion: A dose-response relationship between seizure or discharge burden and later
            cognitive score would support the seizures interfering with development. Absence of any relationship
            would point to a shared substrate or to treatment.
        - experiment_id: mei_valproate_versus_alternative_outcome
          name: Developmental outcome by treatment received
          description: Comparison of developmental outcome between children treated with valproate and
            those treated with an alternative agent or untreated, drawn from a multicentre registry, with
            adjustment for seizure burden and age at onset. Randomization is not realistic at this syndrome's
            case numbers, so this is explicitly an observational design with the confounding-by-indication
            limitation stated.
          decision_criterion: Worse outcome in valproate-treated children after adjustment for seizure
            burden would raise treatment contribution as a real possibility. Equivalent outcomes across
            treatments would largely exclude it.
        - experiment_id: mei_premorbid_and_familial_markers
          name: Premorbid and familial markers of the cognitive subgroup
          description: Testing whether the third of children with cognitive difficulty are identifiable
            before or at onset by family history, subtle premorbid developmental measures, or genetic
            findings, rather than only in retrospect.
          decision_criterion: Identification of a premorbid or familial marker would support the shared-substrate
            explanation and would make the subgroup prospectively identifiable. No such marker would leave
            the seizure and treatment explanations in play.
      selected_evidence:
        snippet: However, the cognitive outcome is much less certain with cognitive problems present in
          one-third of children who have long term follow up.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
