  e935d0c702cdafba634a36c902f379b16bf60112bb23b59e963ad16eb6f989df:
    claim:
      about:
        disease:
          name: Myoclonic Epilepsy in Infancy
          disease_term:
            preferred_term: myoclonic epilepsy in infancy
            term:
              id: MONDO:0100566
              label: myoclonic epilepsy in infancy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Age-Restricted Generalized Cortical Hyperexcitability of Infancy
        biological_scale: TISSUE
        conforms_to: epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony
        description: 'The substrate is a transient, presumed genetic tendency of the infant brain to generate
          generalized epileptic discharge, appearing in the first three years of life and generally disappearing
          after it. Nothing is known about it at the molecular level, and this entry does not pretend
          otherwise: the node carries cellular annotation and no gene. What justifies calling it generalized
          rather than focal is that the discharge is generalized on the recording and the jerk it produces
          is bilateral. What justifies calling it age-restricted is that both the onset and the remission
          are tied to a developmental window rather than to any event.'
        cell_types:
        - preferred_term: cortical neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: neuronal action potential
          term:
            id: GO:0019228
            label: neuronal action potential
          modifier: INCREASED
      selected_evidence:
        snippet: Benign myoclonic epilepsy in infancy, classified among the generalised idiopathic epilepsies,
          is characterised by the occurrence of myoclonic seizures in the first three years of life in
          otherwise normal infants.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23770486
      reference_title: 'Reflex myoclonic epilepsy in infancy: a critical review.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Establishes the three components this node asserts: a generalized rather than focal
        mechanism, a restricted age window, and an otherwise normal infant, which is what makes the substrate
        a functional excitability state rather than a lesion.'
