          term:
            id: MONDO:0100135
            label: Dravet syndrome
        description: 'The differential that matters most, because both begin in infancy with seizures
          in a previously normal child and both involve myoclonus, but the trajectories diverge completely.
          Getting this wrong in either direction has consequences: sodium channel blockers worsen Dravet,
          and a family told their child has a self-limited epilepsy when they do not has been badly misinformed.'
        distinguishing_features:
        - Onset in Dravet is typically with prolonged, often hemiclonic, fever-provoked seizures rather
          than with brief myoclonic jerks.
        - Multiple seizure types appear over time in Dravet; the myoclonic seizure is the only type in
          this syndrome.
        - Development arrests or regresses in the second year in Dravet rather than remaining normal.
        - SCN1A mutation is found in the majority of Dravet and is not a feature of this syndrome.
      selected_evidence:
        snippet: Syndromes are separated into self-limited syndromes, where there is likely to be spontaneous
          remission and developmental and epileptic encephalopathies, diseases where there is developmental
          impairment related to both the underlying etiology independent of epileptiform activity and
          the epileptic encephalopathy.
