      assertion_type: Inheritance
      assertion:
        name: Presumed genetic and heterogeneous, no established locus
        description: 'No mode of inheritance is established and no locus is known. The literature infers
          a genetic contribution from the clinical picture rather than from mapping: the syndrome is clinically
          heterogeneous enough that reviewers have suggested several distinct genetic mechanisms may produce
          the same presentation. No inheritance_term is bound, because binding one would assert a mode
          of transmission that has not been demonstrated.'
      selected_evidence:
        snippet: The clinical heterogeneity within this syndrome suggests that there may be a variety
          of genetic mechanisms that underlie the presentation.
        supports: SUPPORT
