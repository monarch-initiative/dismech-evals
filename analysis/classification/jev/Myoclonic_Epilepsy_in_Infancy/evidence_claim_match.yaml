  f67312c18e918b066671e602cf324974cbf11e91e12188418bba077c3caa07af:
    claim:
      about:
        disease:
          name: Myoclonic Epilepsy in Infancy
          disease_term:
            preferred_term: myoclonic epilepsy in infancy
            term:
              id: MONDO:0100566
              label: myoclonic epilepsy in infancy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Generalized Epileptiform Discharge Time-Locked to the Jerk
        biological_scale: TISSUE
        description: 'The electrographic event: a brief burst of generalized spike-wave or polyspike-wave,
          coinciding with the myoclonic jerk closely enough that the two can be shown to be one event
          on combined recording. This time-locking is what makes the jerk a seizure rather than a movement
          disorder, and it is the single most useful discriminator from the non-epileptic myoclonias of
          infancy that otherwise look identical at the cotside.'
        cell_types:
        - preferred_term: cortical neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: The ictal video-EEG and polygraphic recording revealed generalized discharge of spike-wave
          (SW) lasting 1-2s associated with isolated bilateral synchronous jerk involving mainly the upper
          limbs controlled by valproic acid (VPA).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21752671
      reference_title: Benign myoclonic epilepsy in infancy followed by childhood absence epilepsy.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Direct polygraphic evidence for every element of this node: the discharge is generalized
        spike-wave, it is brief, and it is recorded in association with the bilateral jerk rather than
        merely alongside it, which is what time-locking means here.'
