            term:
              id: MONDO:0000903
              label: myoclonus-dystonia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: KCTD17 putaminal network and ER calcium-signaling disturbance
        description: 'KCTD17 is most highly expressed in the putamen and sits in a putaminal co-expression
          network enriched for dystonia genes whose functional annotation is over-represented for post-synaptic
          dopaminergic transmission. Fibroblasts from carriers of the p.(Arg145His) variant show abnormal
          endoplasmic-reticulum-dependent calcium signaling. These are the observed correlates rather
          than an established causal chain: the founding report states explicitly that further work is
          needed to characterise how KCTD17 contributes to myoclonus-dystonia, so this node is recorded
          as a hypothetical upstream input to the striatal mechanism rather than as a settled route.'
        genes:
        - preferred_term: KCTD17
          term:
            id: hgnc:25705
            label: KCTD17
        biological_processes:
        - preferred_term: Endoplasmic reticulum calcium ion homeostasis
          term:
            id: GO:0032469
            label: endoplasmic reticulum calcium ion homeostasis
          modifier: ABNORMAL
        - preferred_term: Post-synaptic dopaminergic transmission
          term:
            id: GO:0001963
            label: synaptic transmission, dopaminergic
        locations:
        - preferred_term: Putamen
          term:
            id: UBERON:0001874
            label: putamen
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: KCTD17 is abundantly expressed in all brain regions with the highest expression in the
          putamen. Weighted gene co-expression network analysis, based on mRNA expression profile of brain
          samples from neuropathologically healthy individuals, showed that KCTD17 is part of a putamen
          gene network, which is significantly enriched for dystonia genes.
        supports: SUPPORT
    origin:
