      assertion_type: Genetic
      assertion:
        name: COL12A1
        gene_term:
          preferred_term: COL12A1
          term:
            id: hgnc:2188
            label: COL12A1
        notes: 'COL12A1 encodes collagen XII, a homotrimeric FACIT collagen that bridges collagen I-containing
          fibrils with extracellular matrix proteins including decorin and tenascin-X. Dominant variants
          (missense, in-frame exon-skipping) produce a milder phenotype; biallelic loss-of-function variants
          produce a more severe phenotype.

          '
      selected_evidence:
        snippet: COLXII is a homotrimer assembled from three COLXII alpha chains encoded by COL12A1. It
          is essential for collagen fibril organization by bridging Collagen I-containing fibrils bound
          at the collagenous domain with various extracellular matrix (ECM) proteins including tenascin-X.
        supports: SUPPORT
    origin:
