              label: myopathy, congenital proximal, with minicore lesions
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted FXR1-Mediated Translational Repression at the Z-Line
        description: Wild-type P82/P84 sit immediately adjacent to Z-lines and at costameres. FXR1P is
          proposed to hold specific structural mRNAs in a translationally repressed state there, as shown
          for desmoplakin and talin2 in heart, where Fxr1 loss raised both proteins and disrupted costamere
          architecture. The authors of the founding study propose that deregulated translation of Z-line
          mRNAs underlies the minicores; the specific skeletal-muscle target mRNAs have not been identified.
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        biological_processes:
        - preferred_term: negative regulation of translation
          modifier: DECREASED
          term:
            id: GO:0017148
            label: negative regulation of translation
        cellular_components:
        - preferred_term: Z disc
          term:
            id: GO:0030018
            label: Z disc
        - preferred_term: costamere
          term:
            id: GO:0043034
            label: costamere
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: Co-immunofluorescence of FXR1P with α-actinin or phalloidin to visualize Z and M lines
          showed the wt FXR1P isoforms in a position immediately adjacent to Z-lines.
        supports: SUPPORT
