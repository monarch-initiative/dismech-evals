          in a consanguineous Turkish family. No homozygotes for these alleles are listed in gnomAD. The
          3'' exon-15 frameshift c.1764_1767delACAG p.(Arg588Serfs*37) causes the lethal sibling disorder
          CMYO9A (MONDO:0032936), not this one. No ClinGen gene-disease validity record for FXR1 is present
          in the reference cache.'
      selected_evidence:
        snippet: 'In family 2 we applied WES to four members of the family (the three affected siblings
          and the mother), which revealed a homozygous single nucleotide deletion also in exon-15 of FXR1
          (XM_005247813.3: c.1707delA (delA); p.Lys569Asnfs*57) in all three affected siblings.'
        supports: SUPPORT
