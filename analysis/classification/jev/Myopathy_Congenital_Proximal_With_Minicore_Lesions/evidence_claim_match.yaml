  e7e72efa054ed24a4a98dd8b29643383c09b58e338dbbe18202d37715bc11ed7:
    claim:
      about:
        disease:
          name: Myopathy Congenital Proximal With Minicore Lesions
          disease_term:
            preferred_term: Myopathy, congenital proximal, with minicore lesions
            term:
              id: MONDO:0032937
              label: myopathy, congenital proximal, with minicore lesions
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Muscle-Specific FXR1 Isoforms
        description: Cardiac and skeletal muscle express FXR1P isoforms P82 and P84 that contain exon
          15, while other tissues express shorter isoforms that skip it. The CMYO9B variants are frameshifts
          at the 5' end of exon 15, so the muscle isoforms lose most of their exon-15 sequence while the
          ubiquitous isoforms are untouched, which fits the restriction of disease to muscle. In a mouse
          5' exon-15 frameshift (dupA) the mutant transcript was reduced to about 31% of control and little
          P82/P84 protein remained. The biopsy of the founding family lacked the mutant-protein granules
          seen with the 3' allele that causes CMYO9A, which the authors attribute to low P82/P84 expression.
          Protein levels have not been measured in CMYO9B patient muscle.
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        genes:
        - preferred_term: FXR1
          term:
            id: hgnc:4023
            label: FXR1
        genetic_context:
          gene:
            preferred_term: FXR1
            term:
              id: hgnc:4023
              label: FXR1
          zygosity: HOMOZYGOUS
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: mRNA binding
          modifier: DECREASED
          term:
            id: GO:0003729
            label: mRNA binding
        - preferred_term: translation repressor activity
          modifier: DECREASED
          term:
            id: GO:0030371
            label: translation repressor activity
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: In contrast to other tissues, cardiac and skeletal muscle express two FXR1P isoforms
          that incorporate an additional exon-15. We report that recessive mutations in this particular
          exon of FXR1 cause congenital multi-minicore myopathy in humans and mice.
        supports: SUPPORT
