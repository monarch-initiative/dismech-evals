  265d0a5eee27b38e0b1de0c774cd27b65a042cac4c63723448d626d698691d83:
    claim:
      about:
        disease:
          name: Myopathy Due To Myoadenylate Deaminase Deficiency
          disease_term:
            preferred_term: Myopathy due to myoadenylate deaminase deficiency
            term:
              id: MONDO:0014220
              label: myopathy due to myoadenylate deaminase deficiency
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Ischemic forearm exercise test
        description: A forearm (or aerobic) exercise test showing a flat or absent venous ammonia rise
          with a normal lactate response points to the defect; it is a screen, not a confirmation.
        measurements:
        - preferred_term: venous lactate after ischemic forearm exercise
          term:
            id: LOINC:59849-0
            label: Lactate [Moles/volume] in Serum or Plasma --post exercise
        notes: 'Only the lactate limb of this test is codeable, and the limb that carries the diagnosis
          is not. LOINC has no exercise-qualified ammonia measurement: across the full LOINC 2.83 table
          no ammonia code is qualified by any challenge at all, and the Monarch KG, asked separately because
          that table holds no Part codes, returns 38 ammonia records of which four are Parts, all unqualified
          components. So the flat ammonia rise that distinguishes this deficiency has nothing to bind
          to, while the normal lactate rise the test is read against does. The post-exercise lactate code
          is bound in millimoles per litre, the unit the comparison entries in this family report. Two
          near misses were avoided: the release''s only pre-exercise lactate code is for D-lactate, a
          different enantiomer measured for unrelated reasons, and the KG carries a D-Lactate Part alongside
          the plain one. No reference range is bound; this row reports the pattern in words and states
          no concentration.'
        results: Flat/absent venous ammonia rise with a normal lactate rise.
