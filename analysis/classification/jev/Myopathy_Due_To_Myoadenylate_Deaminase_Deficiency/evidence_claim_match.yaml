          disease_term:
            preferred_term: Myopathy due to myoadenylate deaminase deficiency
            term:
              id: MONDO:0014220
              label: myopathy due to myoadenylate deaminase deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ampd1_asymptomatic_homozygotes
        prompt: Why do the great majority of individuals homozygous for the common AMPD1 nonsense allele
          remain clinically asymptomatic, when the same biallelic loss-of-function abolishes muscle AMP
          deaminase and disables the purine nucleotide cycle?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Failure of the Purine Nucleotide Cycle During Exercise
        - mechanistic_hypotheses#energy_charge_buffering_symptom_mechanism
        rationale: The biochemical deficiency is common (~2% of the population) but symptomatic myopathy
          is far rarer, and no genotype-phenotype rule explains who becomes symptomatic. Proposed explanations
          include alternative splicing of the mutation-bearing exon that restores some catalytically active
          enzyme, and metabolic pathways that compensate for the absent cycle flux; the reason the ATP-regenerating
          function of the cycle appears dispensable in most people is unresolved.
        proposed_experiments:
        - experiment_id: exp_ampd1_modifier_cohort
          name: Genotype-stratified deep-phenotyping cohort for AMPD1 symptom modifiers
          description: Assemble a cohort of genetically confirmed AMPD1-homozygous individuals, stratified
            by symptom status, with standardized exercise physiology, quantification of residual AMPD1
            transcript and enzyme activity, and testing of candidate genetic and metabolic modifiers of
            the symptomatic phenotype.
      selected_evidence:
        snippet: However, the vast majority of homozygous subjects do not develop a metabolic myopathy.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9211191
      reference_title: Clinical heterogeneity and molecular mechanisms in inborn muscle AMP deaminase
