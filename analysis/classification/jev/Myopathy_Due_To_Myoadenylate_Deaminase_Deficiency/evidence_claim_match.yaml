        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: energy_charge_buffering_symptom_mechanism
        hypothesis_label: Exertional symptoms arise from loss of adenine-nucleotide energy-charge buffering
          during intense contraction
        status: EMERGING
        description: 'One proposed account of the exercise-induced symptoms is that, without AMP deaminase
          to drain AMP and pull the adenylate kinase reaction toward ATP resynthesis, the muscle cannot
          buffer its adenine-nucleotide energy charge under the demand of intense contraction, impairing
          exertional energy metabolism. The hypothesis is contested: because the biochemical deficiency
          is common yet most homozygotes are asymptomatic, the ATP-regenerating role of the cycle appears
          largely dispensable, so the branch is marked EMERGING rather than canonical and is tied to the
          open knowledge gap on why so few homozygotes become symptomatic.'
      selected_evidence:
        snippet: The observation that it can be found in clinically asymptomatic individuals suggests,
          paradoxically, that the ATP-regenerating function which has been attributed to the purine nucleotide
          cycle is not essential for muscle function.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
