      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: scleral_ecm_weakening
        hypothesis_label: Zinc-dependent scleral matrix deficit drives axial elongation
        status: EMERGING
        description: Reduced ZIP5 zinc import destabilizes Smad proteins, lowers TGF-beta-driven collagen
          synthesis and weakens the sclera, allowing the eye to elongate. The cellular steps rest on one
          HEK293 knockout study; the scleral and axial steps are inferred from SLC39A5 expression in mouse
          sclera and from genotype-phenotype data in human cohorts.
      selected_evidence:
        snippet: Overall, the SLC39A5 depletion-induced zinc deficiency destabilized Smad proteins, which
          inhibited the TGF-β signalling and downstream ECM synthesis, thus contributing to the pathogenesis
          of high myopia.
        supports: SUPPORT
