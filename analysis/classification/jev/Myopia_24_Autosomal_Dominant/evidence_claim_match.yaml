      assertion_type: Discussion
      assertion:
        discussion_id: smad_direction_conflict
        kind: CONTROVERSY
        status: OPEN
        prompt: Does SLC39A5 loss increase or decrease BMP/TGF-beta Smad signalling?
        attaches_to:
        - pathophysiology#Impaired TGF-beta Smad Signaling
        rationale: The founding study found that wild-type ZIP5 suppresses Smad1 and that the disease
          alleles do not, giving higher Smad1 in patient lymphocytes. The later knockout study found destabilized
          Smad proteins and reduced R-Smad phosphorylation. The two used different cells, readouts and
          Smads (Smad1 versus receptor Smads generally), and neither measured signalling in scleral cells,
          so the direction of the pathway change in the eye is unknown.
      selected_evidence:
        snippet: Furthermore, we found that wild-type, but not disease-associated SLC39A5 inhibited the
          expression of Smadl, a key phosphate protein in the downstream of the BMP/TGF-β (bone morphogenic
          protein/transforming growth factor-β) pathway.
        supports: SUPPORT
