      assertion:
        name: Impaired TGF-beta Smad Signaling
        description: In SLC39A5 knockout cells, receptor Smad phosphorylation was largely blocked and
          TGF-beta signalling was inhibited; re-expression of SLC39A5 restored it. The founding study
          instead reported that wild-type, but not mutant, ZIP5 suppressed Smad1 expression, so patient
          cells had higher Smad1. Both studies place the defect in BMP/TGF-beta Smad signalling, but they
          disagree on its direction (see the controversy discussion).
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: TGF-beta receptor signaling pathway
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Further, we demonstrated that TGF-β signalling, the regulator of ECM, was inhibited in
          SLC39A5 depletion situation, wherein the activation of receptor Smads (R-Smads) via phosphorylation
          was greatly blocked.
        supports: SUPPORT
