          and pancreatic zinc handling. No study has measured refraction, axial length or scleral collagen
          in them, so the scleral and axial steps of the mechanism rest on expression data and on cell-line
          results.
      selected_evidence:
        snippet: We found that ZIP5 is not essential for growth and viability but total knockout of ZIP5
          led to increased zinc in the liver in mice fed a zinc-adequate (ZnA) diet
        supports: SUPPORT
