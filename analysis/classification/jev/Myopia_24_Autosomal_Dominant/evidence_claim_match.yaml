  df1fdbd68ae62f4c8c62d7ac515d986fb8b5be173bfb92cd16228fd3568a93c2:
    claim:
      about:
        disease:
          name: Myopia 24, Autosomal Dominant
          disease_term:
            preferred_term: myopia 24, autosomal dominant
            term:
              id: MONDO:0014411
              label: myopia 24, autosomal dominant
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC39A5
        association: Causal
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: SLC39A5
          term:
            id: hgnc:20502
            label: SLC39A5
        notes: 'Reported heterozygous variants include the nonsense p.Y47* (founding family and an unrelated
          sporadic case), missense p.M304T (a second family), p.Gly293Arg, p.Pro287Leu, p.Arg319Thr, p.G413A,
          frameshifts p.Arg243fs*140, p.V451Cfs*76 and p.P342Tfs*41, and missense c.577G>A. Each later
          cohort finds SLC39A5 variants in a few percent or less of Chinese high myopia probands, and
          several missense variants were classified on prediction and absence from controls rather than
          on functional testing. Penetrance has not been measured: the founding p.Y47* allele is also
          carried by one 1000 Genomes individual (HG00701) with no phenotype record. No external gene-disease
          validity classification was found, so none is recorded.'
        variants:
        - name: c.141C>G (p.Y47*)
          description: Nonsense variant in the amino-terminal domain. Co-segregated in the three-generation
            founding family, was also found in an unrelated sporadic case, and was absent from 1276 controls.
            Patient cells had normal mRNA but reduced protein.
        - name: c.911T>C (p.M304T)
          description: Missense variant in a transmembrane domain (the founding paper places it in the
            third in its results and in the fourth in its discussion) that co-segregated in a three-member
            family and was absent from 1276 controls. It did not change ZIP5 localization but failed to
            suppress Smad1 expression.
      selected_evidence:
        snippet: We identified a nonsense mutation (c.141C>G:p.Y47*) in SLC39A5 co-segregating with the
          phenotype in a non-syndromic severe high myopia family.
        supports: SUPPORT
    origin:
