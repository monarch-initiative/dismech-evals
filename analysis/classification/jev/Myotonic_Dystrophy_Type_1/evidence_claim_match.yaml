  a97b0d039c5467a6dae11dbab4726c44276b12629dbf6ab22d1331db84071fb0:
    claim:
      about:
        disease:
          name: Myotonic Dystrophy Type 1
          disease_term:
            preferred_term: Myotonic Dystrophy Type 1
            term:
              id: MONDO:0008056
              label: myotonic dystrophy type 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dm1_cataract_mechanism_hierarchy
        prompt: In the DM1 lens, how much of cataract formation is MBNL1-dependent spliceopathy, how much
          is SIX5 dosage acting through SK3, and how much is dsRNA-triggered innate immune activation?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#dsRNA-Triggered Innate Immune Activation in Lens
        - pathophysiology#SIX5/DMPK Locus Effects in Lens
        - phenotypes#Cataracts
        rationale: 'Cataract is near-universal in DM1 and the entry now carries two candidate lens mechanisms
          that are neither ranked nor mutually exclusive, alongside the splicing axis that explains the
          rest of the disease. Each rests on evidence of a different kind and none is decisive: the SIX5
          branch has a mouse dosage series plus human lens cell lines in which SIX5 is measured but not
          manipulated, and the innate-immune branch has an expression signature in surgical specimens
          with no perturbation and no MBNL1 comparison arm. Because the lens is accessible and both DM1
          and DM2 share the immune signature, this is an unusually tractable place to test whether repeat-RNA
          diseases have one mechanism hierarchy or tissue-specific ones.'
        proposed_experiments:
        - experiment_id: dm1_lens_mechanism_decomposition
          experiment_design: TARGETED_PERTURBATION
          name: Selective restoration and blockade in DM1 lens models
          description: 'In DM1 lens organoids or conditional knockout mice, run four arms: restore MBNL1
            alone, restore SIX5 alone, block interferon signaling alone, and combine all three. Read out
            lens epithelial cell density, viability under calcium challenge, the interferon-regulated
            gene signature, and transparency.'
          would_support:
          - pathophysiology#dsRNA-Triggered Innate Immune Activation in Lens
          would_refute:
          - pathophysiology#SIX5/DMPK Locus Effects in Lens
          supporting_outcome:
          - Interferon blockade alone preserves epithelial cell density and transparency to a degree that
            SIX5 restoration does not, establishing the innate-immune arm as the dominant lens mechanism.
          refuting_outcome:
          - SIX5 restoration alone rescues transparency while interferon blockade leaves it unchanged,
            showing the immune signature is a bystander consequence rather than a cataract mechanism.
      selected_evidence:
        snippet: A high proportion, 83% in DM1 and 75% in DM2, of the significantly disregulated genes
          were shared by both forms of the disease, suggesting a common mechanism.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22062891
      reference_title: Activation of the innate immune response and interferon signalling in myotonic
        dystrophy type 1 and type 2 cataracts.
      evidence_source: HUMAN_CLINICAL
      explanation: The DM1/DM2 overlap is what makes the innate-immune branch a candidate independent
        of the DMPK locus, and so a genuine competitor to the SIX5 explanation rather than a restatement
        of it.
