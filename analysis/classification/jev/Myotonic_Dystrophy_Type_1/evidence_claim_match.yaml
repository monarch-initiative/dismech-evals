    evidence_metadata:
      reference: PMID:16864772
      reference_title: Reversal of RNA missplicing and myotonia after muscleblind overexpression in a
        mouse poly(CUG) model for myotonic dystrophy.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that restoration works and that splicing correction tracks the functional
        readout, which is what makes the missing quantitative threshold the actionable gap rather than
        the qualitative question.
