        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dm1_mbnl1_restoration_threshold
        prompt: How much MBNL1 activity has to be restored, in each affected tissue, before splicing correction
          translates into clinical benefit?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Splicing Factor Imbalance and Fetal Spliceopathy
        - mechanistic_hypotheses#canonical_dmpk_ctg_rna_toxicity_splicing_dysregulation_model
        - treatments#DMPK-Targeting Antisense Oligonucleotide (Investigational)
        rationale: Restoring MBNL1 reverses myotonia and adult splicing in poly(CUG) mice, but the experiments
          that establish this use a single delivered dose and report an outcome, not a dose-response curve.
          No published work defines the fraction of normal MBNL1 activity that has to be recovered before
          a given tissue crosses back into a functional range, and the threshold is unlikely to be the
          same in skeletal muscle, heart, lens, and brain. That number is the therapeutic window for every
          approach in this class, and its absence is why the phase 1/2a DMPK ASO result — muscle exposure
          below the level predicted to reduce the target — could not be read as either a mechanism failure
          or a dosing failure.
      selected_evidence:
        snippet: Myotonia reversal occurs concurrently with restoration of the normal adult-splicing patterns
          of four pre-mRNAs that are misspliced during postnatal development in DM muscle.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
