      assertion_type: Definition
      assertion:
        name: Orphanet disease definition
        definition_type: CASE_DEFINITION
        description: 'Orphanet defines Steinert myotonic dystrophy / DM1 as a rare genetic multisystem
          disorder with muscle manifestations, early-onset cataracts, and cerebral, endocrine, cardiac,
          gastrointestinal, uterine, skin, and immunologic involvement across a broad onset spectrum.

          '
      selected_evidence:
        snippet: A rare genetic multi-system disorder characterized by a wide range of muscle-related
          manifestations (muscle weakness, myotonia, early onset cataracts (before age 50) and systemic
          manifestations (cerebral, endocrine, cardiac, gastrointestinal tract, uterus, skin and immunologic
          involvement) that vary depending on the age of onset.
        supports: SUPPORT
