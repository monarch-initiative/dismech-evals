          - pathophysiology#dsRNA-Triggered Innate Immune Activation in Lens
          would_refute:
          - pathophysiology#SIX5/DMPK Locus Effects in Lens
          supporting_outcome:
          - Interferon blockade alone preserves epithelial cell density and transparency to a degree that
            SIX5 restoration does not, establishing the innate-immune arm as the dominant lens mechanism.
          refuting_outcome:
          - SIX5 restoration alone rescues transparency while interferon blockade leaves it unchanged,
            showing the immune signature is a bystander consequence rather than a cataract mechanism.
      selected_evidence:
        snippet: Since both the hyper-stimulation of K(+) efflux and cell death were reduced by the highly
          specific SK inhibitor apamin, we suggest that increased expression of SK3 has a critical role
          in the increased Ca(2+)-induced fragility in DM1 cells.
        supports: SUPPORT
