      assertion_type: Pathophysiology
      assertion:
        name: Splicing-Independent Progressive Cardiac Pathology
        biological_scale: TISSUE
        description: 'Cardiac disease in DM1 worsens over time through a route that does not run through
          the MBNL-dependent spliceopathy. In an inducible heart-specific model expressing a stable, interrupted
          960-CUG-repeat RNA — a design that holds repeat length fixed and so excludes somatic expansion
          — sustained expression produced progressive cardiac enlargement, contractile dysfunction, conduction
          delay, myocardial fibrosis, and reduced survival while MBNL-dependent splicing defects stayed
          static. Suppressing the transgene rescued the cardiac abnormalities, but reversibility fell
          with longer exposure, implying a component that accumulates rather than simply tracking the
          current RNA burden. The intermediate steps between persistent nuclear CUG RNA and fibrotic and
          contractile failure are not identified.

          '
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        locations:
        - preferred_term: heart
          term:
            id: UBERON:0000948
            label: heart
      selected_evidence:
        snippet: Sustained CUGexp RNA expression caused progressive cardiac enlargement, contractile dysfunction,
          conduction delay, myocardial fibrosis, and reduced survival, while MBNL-dependent splicing defects
          remained static, consistent with the stable repeat length.
        supports: SUPPORT
