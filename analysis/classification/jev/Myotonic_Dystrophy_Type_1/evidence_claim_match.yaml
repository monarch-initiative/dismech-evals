          — largest in the most clinically affected tissues such as skeletal muscle — and its rate, set
          by the expression balance of DNA-repair modifiers, tracks disease severity and age of onset.
          This ongoing somatic expansion continually raises the expanded-CUG RNA burden that drives the
          downstream RNA-toxicity cascade.

