  d4a78b4b36296fef161486e0f6fecffe62375461446198bd6cd55af2bccc5f6f:
    claim:
      about:
        disease:
          name: Myotonic Dystrophy Type 1
          disease_term:
            preferred_term: Myotonic Dystrophy Type 1
            term:
              id: MONDO:0008056
              label: myotonic dystrophy type 1
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_dmpk_ctg_rna_toxicity_splicing_dysregulation_model
        hypothesis_label: Canonical DMPK CTG Expansion / RNA Toxicity / Splicing Dysregulation Model
        status: CANONICAL
        description: Myotonic dystrophy type 1 (DM1) is caused by CTG-trinucleotide repeat expansion (>50
          repeats; severe congenital >1000) in the 3' UTR of DMPK on 19q13.3. Expanded CUG-repeat RNA
          transcripts form nuclear foci that sequester MBNL1 (muscleblind-like 1) splicing factor and
          induce aberrant upregulation of CELF1, producing dysregulated alternative splicing of >100 developmentally
          regulated transcripts (e.g., CLCN1, INSR, SCN5A, BIN1). Mis-splicing reverts adult-tissue isoforms
          toward embryonic patterns, producing myotonia (CLCN1), insulin resistance (INSR), cardiac conduction
          defects (SCN5A), muscle weakness and atrophy, cataracts, frontal balding, hypogonadism, and
          characteristic CNS involvement. CTG repeat instability drives intergenerational anticipation.
          MBNL transgenic rescue, CUG-ASO therapy, and small-molecule MBNL/CELF1 normalizers corroborate
          the RNA-toxicity / splicing-dysregulation axis as the canonical pathogenic mechanism.
        notes: 'Retained as CANONICAL with tissue-specific qualifications. The 2026 openscientist hypothesis-search
          report (kb/hypotheses/Myotonic_Dystrophy_Type_1/canonical_dmpk_ctg_rna_toxicity_splicing_dysregulation_model)
          finds STRONGLY SUPPORTED. Three independent genetic proofs establish the central CUG-RNA / MBNL1-sequestration
          axis: (1) MBNL1 knockout mice recapitulate DM1 phenotypes including cardiac pathology and embryonic
          splice-isoform persistence; (2) AAV-mediated MBNL1 overexpression rescues myotonia and corrects
          splicing in poly(CUG) mice; (3) CRISPR-Cas9 deletion of expanded CTG repeats eliminates nuclear
          RNA foci and corrects spliceopathy. Global transcriptomics confirm most CUG-expansion RNA effects
          in skeletal muscle are explained by reduced MBNL1 activity. Four tissue-specific qualifications:
          (1) cardiac pathology is multifactorial — SCN5A mis-splicing rescue does not correct conduction
          delays or structural defects, and prolonged CUG-RNA expression drives progressive cardiac disease
          even when splicing defects remain static; (2) cataracts involve dsRNA-triggered innate immune
          activation and SIX5 haploinsufficiency rather than pure MBNL1/CELF1 spliceopathy; (3) congenital
          DM1 requires a multigene dosage model incorporating DMPK, SIX5, MBNL1, and DMWD; (4) the pathogenic
          landscape extends beyond spliceopathy to include miRNA dysregulation, RAN translation of toxic
          homopolymeric peptides (Gln, Ala, Ser), disrupted signaling cascades (PKC, GSK-3β, mTOR), satellite
          cell senescence, and bidirectional transcription at the DM1 locus. CUG-ASO and MBNL/CELF1 normalizer
          trials remain consistent with the canonical RNA-toxicity axis. One qualification on that last
          point: the completed phase 1/2a DMPK-targeting ASO trial established tolerability but reported
          skeletal muscle drug concentrations below the level predicted to achieve substantial target
          reduction, so it has not yet tested the RNA-toxicity axis therapeutically and should not be
          cited as corroborating it.'
      selected_evidence:
        snippet: Myotonic Dystrophy type 1 (DM1) is a neuromuscular disease showing strong genetic anticipation,
          and is caused by the expansion of a CTG repeat tract in the 3'-UTR of the DMPK gene.
        supports: SUPPORT
