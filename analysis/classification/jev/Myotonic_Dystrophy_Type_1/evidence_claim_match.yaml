      assertion_type: Pathophysiology
      assertion:
        name: Toxic CUG RNA Nuclear Foci
        description: 'The expanded DMPK repeat is transcribed into CUG repeat-containing RNA that is retained
          in the nucleus and recruits RNA-binding proteins that normally regulate adult splicing programs.
          Nuclear retention, rather than the higher-order focus itself, is the toxic state: quantitative
          imaging in patient-derived myotubes shows that most objects scored as "foci" are single RNA
          molecules, and that these individual nuclear-retained transcripts titrate MBNL1. Multimeric
          foci arise from transcriptional bursting, dissociate over time, and depend on MBNL proteins
          for their own assembly, so they are better read as a marker of the retained-RNA burden than
          as the pathogenic species.

          '
        cell_types:
