              label: myotonic dystrophy type 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Satellite Cell Premature Senescence
        conforms_to: cellular_senescence#Senescence-Associated Cell Cycle Arrest
        biological_scale: CELLULAR
        description: 'DM1 muscle precursor cells carrying large CTG expansions stop dividing early not
          because they have used up their replicative capacity but because they enter premature senescence.
          p16 accumulates abnormally, and abolishing p16 activity overcomes the early growth arrest and
          restores extended proliferation; accelerated telomere shortening, which is also present, does
          not account for the p16 induction. Because the reserve is arrested rather than exhausted, this
          is a candidate contributor to impaired regeneration and atrophy in large-expansion DM1 that
          is separable from the spliceopathy.

          '
        cell_types:
        - preferred_term: skeletal muscle satellite cell
          term:
            id: CL:0000594
            label: skeletal muscle satellite cell
        biological_processes:
        - preferred_term: cellular senescence
          term:
            id: GO:0090398
            label: cellular senescence
          modifier: INCREASED
        locations:
        - preferred_term: skeletal muscle tissue
          term:
            id: UBERON:0001134
            label: skeletal muscle tissue
      selected_evidence:
        snippet: We demonstrate that an abnormal accumulation of p16 is responsible for this defect because
          the abolition of p16 activity overcomes early growth arrest and restores an extended proliferative
          capacity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/12
      evidence_path: /pathophysiology/12/evidence/0
      context_paths:
