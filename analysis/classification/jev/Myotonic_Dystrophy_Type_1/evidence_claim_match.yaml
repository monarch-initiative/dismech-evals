  5c671f7228c99758ed064e31b79a1cd69ae1bcb9dc0672e3c449f2788a4dfd87:
    claim:
      about:
        disease:
          name: Myotonic Dystrophy Type 1
          disease_term:
            preferred_term: Myotonic Dystrophy Type 1
            term:
              id: MONDO:0008056
              label: myotonic dystrophy type 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dm1_congenital_multigene_dosage_fidelity
        prompt: Does congenital DM1 in humans arise through reduced dosage of DMPK, SIX5, MBNL1, and DMWD
          together, as the mouse multigene heterozygote model implies, or does the mouse model reach the
          same phenotype by a route the single expanded human allele does not take?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#DMPK CTG Repeat Expansion
        - pathophysiology#SIX5/DMPK Locus Effects in Lens
        rationale: 'The mouse genetics are clean: triple heterozygous Dmpk, Six5 and Mbnl1 mutants show
          adult-onset DM1 phenotypes, and adding Dmwd yields quadruple heterozygotes recapitulating much
          of congenital DM1. But the construct is four engineered null alleles, whereas a human congenital
          DM1 patient has one expanded repeat and no null alleles at all. The experiment therefore shows
          that combined dosage reduction is sufficient to produce the phenotype, not that it is what happens
          in patients. The distinction matters for therapy: if congenital severity is dosage-driven at
          neighbouring loci, then removing or silencing the toxic RNA would not address it, whereas if
          it is repeat-driven through chromatin change at the locus, it would.'
      selected_evidence:
        snippet: The triple heterozygous mutant mice exhibit adult-onset DM1 phenotypes. With the additional
          mutation in Dmwd, the quadruple heterozygous mutant mice recapitulate many major manifestations
          in congenital DM1.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
