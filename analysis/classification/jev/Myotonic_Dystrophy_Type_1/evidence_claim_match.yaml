      - /disease_term
    evidence_metadata:
      reference: PMID:39126705
      reference_title: Rescue of Scn5a mis-splicing does not improve the structural and functional heart
        defects of a DM1 heart mouse model.
      evidence_source: MODEL_ORGANISM
      explanation: 'The complementary argument for this node: the best-characterized cardiac splicing
        defect can be fully corrected without benefit, so a splicing-independent arm is required to account
        for the phenotype.'
