        description: 'In DM1 heart tissue, MBNL-dependent spliceopathy shifts SCN5A from the adult exon
          6B isoform toward the fetal exon 6A isoform. The resulting Nav1.5 channel has reduced excitability,
          providing a mutation-to-cardiac conduction defect branch in the pathograph. This branch contributes
          but is not sufficient: forcing the adult exon 6B isoform in a CUG960 DM1 heart model leaves
          conduction delay and structural change unimproved, so DM1 cardiac disease is not the sum of
          this splicing defect. See the Splicing-Independent Progressive Cardiac Pathology node for the
          parallel arm, and the dm1_nonsplicing_cardiac_progression discussion for what remains unresolved.

          '
