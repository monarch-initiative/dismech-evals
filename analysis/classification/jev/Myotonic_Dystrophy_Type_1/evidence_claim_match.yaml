      reference_title: Large CTG repeats trigger p16-dependent premature senescence in myotonic dystrophy
        type 1 muscle precursor cells.
      evidence_source: IN_VITRO
      explanation: The p16 removal experiment is what makes this causal rather than correlative in cultured
        DM1 muscle precursor cells. The upstream link from the expanded repeat to p16 accumulation is
        described only as a cellular stress and remains uncharacterized, and the connection to muscle
        wasting in vivo is proposed rather than shown.
