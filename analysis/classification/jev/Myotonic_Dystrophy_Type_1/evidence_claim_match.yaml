        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dm1_nonsplicing_cardiac_progression
        prompt: What carries DM1 cardiac disease forward when repeat length is fixed and MBNL-dependent
          splicing is static — and can any splicing-directed therapy halt it?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Splicing-Independent Progressive Cardiac Pathology
        - pathophysiology#SCN5A Splicing Shift and Cardiac Excitability Loss
        - phenotypes#Cardiac Conduction Defects
        rationale: Cardiac disease is a leading cause of death in DM1, and two independent mouse results
          say the splicing account of it is incomplete. Correcting the best-characterized cardiac splicing
          defect rescues nothing, and a repeat-length-stable model progresses to fibrosis, contractile
          failure, and death with splicing readouts unchanged. Whatever mediates that progression is unidentified,
          which means the current generation of splicing-directed and repeat-directed therapies has no
          established mechanism of action against the phenotype that kills patients. Candidate intermediates
          raised but not tested include reduced SCN5A expression as distinct from mis-splicing, fibrotic
          signaling, and cumulative cardiomyocyte loss.
        proposed_experiments:
        - experiment_id: dm1_cardiac_multiplex_splice_correction
          experiment_design: TARGETED_PERTURBATION
          name: Multiplex cardiac splice correction versus total CUG RNA reduction
          description: In a DM1 heart model, correct the top cardiac MBNL-dependent splicing events together
            using multiplexed splice-switching oligonucleotides, and compare against DMPK knockdown that
            removes the CUG RNA itself. Read out conduction, chamber dimensions, contractile function,
            fibrosis, and survival, stratified by duration of prior CUG RNA exposure.
          would_support:
          - pathophysiology#Splicing-Independent Progressive Cardiac Pathology
          would_refute:
          - pathophysiology#SCN5A Splicing Shift and Cardiac Excitability Loss
          supporting_outcome:
          - Comprehensive splicing correction leaves fibrosis, remodeling, and survival substantially
            worse than CUG RNA removal does, showing a splicing-independent arm carries the progressive
            phenotype.
          refuting_outcome:
          - Multiplex splicing correction matches CUG RNA removal on every cardiac endpoint, showing that
            the cardiac phenotype is after all the sum of MBNL-dependent splicing defects and that the
            single-target rescue failure only reflected the insufficiency of correcting SCN5A alone.
      selected_evidence:
        snippet: We showed that correction Scn5a mis-splicing does not improve the DM1 heart conduction
          delays and structural changes induced by CUG repeat RNA expression.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39126705
      reference_title: Rescue of Scn5a mis-splicing does not improve the structural and functional heart
        defects of a DM1 heart mouse model.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that the gap is real by showing a complete single-target splicing rescue
        with no cardiac benefit.
