    evidence_metadata:
      reference: PMID:31853004
      reference_title: Dosage effect of multiple genes accounts for multisystem disorder of myotonic dystrophy
        type 1.
      evidence_source: MODEL_ORGANISM
      explanation: Records the model result whose translational validity is the open question. The authors
        demonstrate sufficiency of combined dosage reduction in mouse; no human congenital DM1 tissue
        has been shown to reproduce this dosage pattern.
