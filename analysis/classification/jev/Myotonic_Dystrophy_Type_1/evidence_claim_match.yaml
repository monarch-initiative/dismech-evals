        description: 'Transcription of the expanded repeat produces double-stranded RNA in DM cells, and
          lens tissue from DM1 and DM2 cataracts carries a shared transcriptional signature dominated
          by interferon-regulated genes and dsRNA-response genes, with 83 percent of dysregulated genes
          common to the two diseases. This is a candidate lens mechanism sitting outside the MBNL1/CELF1
          splicing axis. It is an expression association in surgical specimens: no perturbation was performed,
          there is no MBNL1 comparison arm, and the signature has not been shown to precede or cause opacity,
          so its weight relative to the SIX5 locus branch is unresolved.

          '
