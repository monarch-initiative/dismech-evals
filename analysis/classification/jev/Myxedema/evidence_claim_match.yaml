            label: adrenocortical insufficiency
        description: Primary adrenal insufficiency (Schmidt syndrome) or secondary pituitary adrenal insufficiency
          shares overlapping electrolyte and hemodynamic features with myxedema coma and can coexist in
          autoimmune polyendocrinopathy or hypopituitarism.
        distinguishing_features:
        - Hypoglycemia, hyponatremia, hyperkalemia, and hypercalcemia overlap with myxedema coma
        - Distinguished by baseline plasma cortisol and ACTH testing alongside free T4 and TSH measurement
      selected_evidence:
        snippet: Concern for adrenal insufficiency is based upon findings of low blood sugar, low sodium,
          and high calcium and potassium which are equally compatible with adrenal insufficiency.
        supports: SUPPORT
