      assertion_type: Diagnosis
      assertion:
        name: Clinical Evaluation and Myxedema Diagnostic Scoring System
        diagnosis_term:
          preferred_term: Clinical Evaluation
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
        description: Myxedema coma is primarily a clinical diagnosis based on history, physical examination
          findings of profound hypothyroidism (hypothermia, altered mental status, non-pitting edema,
          bradycardia), and quantitative clinical scoring systems such as the Popoveniuc diagnostic score
          (>=60 indicating myxedema coma) and Myxedema Score (>90 predicting high mortality).
        results: Popoveniuc diagnostic score >=60 indicates myxedema coma (45-59 indicates severe hypothyroidism
          at risk for coma); Myxedema Score >90 predicts markedly increased inpatient mortality.
      selected_evidence:
        snippet: Because a definitive diagnosis of coma due to myxedema cannot be made on the basis of
          laboratory tests, several workers have attempted to develop scoring systems based on history,
          physical findings, and symptoms in order to objectify a diagnosis and differentiate between
          the presence of just overt or severe hypothyroidism and myxedema coma (5, 6).
        supports: SUPPORT
