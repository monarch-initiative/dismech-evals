      assertion:
        population: Hospitalized tertiary-care cohorts
        measure_type: CASES_IN_LITERATURE
        notes: Extremely rare life-threatening decompensation of severe hypothyroidism; single-center
          tertiary cohorts report 11 cases over 8 years in Krakow, Poland (PMID:38967885) and 41 cases
          over 21 years with 80.5% female predominance in Chandigarh, India (PMID:35945394), while Ono
          et al.'s 149-patient Japanese inpatient series summarized in PMID:31237256 reported that two-thirds
          were women (mean age 77 years) with 30% mortality and higher frequency in winter.
      selected_evidence:
        snippet: Myxedema coma (MC) is an extremely rare but potentially fatal endocrine emergency. The
          aim of the study was to report an increased incidence of life-threatening myxedema coma that
          occurred in relation to the COVID-19 pandemic. In this paper, we report a cohort of 11 patients
          with MC who were treated at the University Hospital in Krakow, Poland, in the period from 2015
          to 2023.
        supports: SUPPORT
