        snippet: FT4 levels will be low and can be almost undetectable, while TSH levels have varied widely
          in reported cases of myxedema coma. Of course, in secondary or pituitary hypothyroidism the
          FT4 and TSH levels will be low or low ‘normal’ and the presence of biologically inactive TSH
          may account for the measured normal concentrations.
        supports: SUPPORT
