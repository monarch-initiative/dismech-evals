        disease_term:
          preferred_term: infectious disease with sepsis
          term:
            id: MONDO:1040015
            label: infectious disease with sepsis
        description: Severe bacterial infection or sepsis both precipitates myxedema coma and mimics its
          systemic decompensation, encephalopathy, hypothermia, and hypotension.
        distinguishing_features:
        - Classic signs of sepsis such as fever and tachycardia are frequently masked by hypothyroid hypothermia
          and bradycardia
        - Identified by infectious workup and coupled with thyroid function and Popoveniuc clinical scoring
      selected_evidence:
        snippet: It is highly important to consider underlying infection, e.g., pneumonia, which is a
          very common precipitant of myxedema coma, because these patients may have the usual signs of
          infection masked by the bradycardia and hypothermia, thus not demonstrating the fever or tachycardia
          typical of infection.
        supports: SUPPORT
