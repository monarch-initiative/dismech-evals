          from an alternative start codon in exon 2 while exon 1 encodes the mitochondrial propeptide.
          These patients present with myopathy, moderate neuropathy and cardiac disease, and characteristically
          lack the skin lesions, seizures and neurological degeneration of the combined form.
      selected_evidence:
        snippet: Interestingly, patients with NAXD variants exclusively affecting the mitochondrial isoform
