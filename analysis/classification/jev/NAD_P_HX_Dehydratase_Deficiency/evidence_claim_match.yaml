      assertion:
        discussion_id: naxd_phenotypic_diversity_incomplete_triad
        kind: CONTROVERSY
        attaches_to:
        - phenotypes#Cutaneous necrosis
        - pathophysiology#Trigger-Precipitated Neurometabolic Crisis
        prompt: How much of the NAXD phenotype is obligate, given patients who lack both the febrile trigger
          and the skin eruption?
        rationale: 'The clinical picture is usually stated as a triad: fever trigger, skin eruption, neurological
          crisis. Two published cases break it. One 7-month-old with a novel homozygous NAXD variant had
          neither a preceding fever nor any skin lesion, and his authors concluded the cases show phenotypic
          diversity. Another patient had prominent skin findings after immunization with no fever at all.
          Meanwhile the largest cohort puts skin manifestations at 31%, so the eruption is a minority
          finding rather than a defining one. This matters practically: a diagnostic heuristic built on
          the triad will miss patients, and the entry curates the skin phenotypes without asserting that
          they are obligate.'
      selected_evidence:
        snippet: Unlike the cases reported in the literature, our patient had neither preceding fever
          nor skin lesion during follow-up.
        supports: SUPPORT
