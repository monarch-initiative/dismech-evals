      assertion_type: Pathophysiology
      assertion:
        name: Inhibition of De Novo Serine Synthesis
        biological_scale: CELLULAR
        description: 'A branch that does not run through the mitochondrion. In NAXD knockout cells grown
          on galactose the mitochondrial signs were only subtle, while metabolomics showed strong inhibition
          of the cytosolic de novo serine synthesis pathway, and the same inhibition was present in NAXD
          patient fibroblasts. This matters for how the disease is read: it means the mitochondrial arm
          is not the whole account of what damaged cofactor does to a cell.'
        biological_processes:
        - preferred_term: L-serine biosynthetic process
          term:
            id: GO:0006564
            label: L-serine biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: Surprisingly, the galactose-grown NAXDko cells displayed only subtle signs of mitochondrial
          impairment, whereas metabolomic analyses revealed a strong inhibition of the cytosolic, de novo
          serine synthesis pathway in those cells as well as in NAXD patient-derived fibroblasts.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39789421
      reference_title: Failure to repair damaged NAD(P)H blocks de novo serine synthesis in human cells.
