      assertion_type: Pathophysiology
      assertion:
        name: Biallelic NAXD Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic NAXD variants reduce or abolish ATP-dependent NAD(P)HX dehydratase activity.
          Two characterised missense substitutions produce a thermolabile enzyme with reduced Vmax and
          increased KM, which is a mechanistically satisfying fit to a disease whose crises are precipitated
          by fever: the residual enzyme is least able to work exactly when demand for repair is highest.'
        genetic_context:
          gene:
            preferred_term: NAXD
            term:
              id: hgnc:25576
              label: NAXD
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Recombinant NAXD protein harbouring two missense variants leading to the amino acid changes
          p.(Gly63Ser) and p.(Arg608Cys) were thermolabile and showed a decrease in Vmax and increase
          in KM for the ATP-dependent NADHX dehydratase activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
