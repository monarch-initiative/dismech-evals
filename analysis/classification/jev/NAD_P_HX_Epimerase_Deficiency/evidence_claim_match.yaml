  4ae7a4bc1521b2e04d3ede5615a280701f6d3ad3053538c0c28839ec02012af4:
    claim:
      about:
        disease:
          name: NAD(P)HX Epimerase Deficiency
          disease_term:
            preferred_term: NAD(P)HX epimerase deficiency
            term:
              id: MONDO:0020781
              label: encephalopathy, progressive, early-onset, with brain edema and/or leukoencephalopathy,
                1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of NAD(P)HX Epimerization
        biological_scale: MOLECULAR
        description: NAD(P)H hydration yields R- and S-NAD(P)HX. The dehydratase NAXD acts only on the
          S epimer, so the R epimer has to be converted to S by NAXE before it can be repaired. Loss of
          NAXE leaves the R form stranded outside the repair cycle.
        molecular_functions:
        - preferred_term: NAD(P)HX epimerase activity
          term:
            id: GO:0052856
            label: NAD(P)HX epimerase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: metabolite repair
          term:
            id: GO:0110051
            label: metabolite repair
          modifier: DECREASED
      selected_evidence:
        snippet: The NAXE epimerase accelerates interconversion between the S- and R-NAD(P)HX forms, whereas
          the NAXD dehydratase stereospecifically acts on S-NAD(P)HX in an ATP-dependent manner.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39789421
      reference_title: Failure to repair damaged NAD(P)H blocks de novo serine synthesis in human cells.
      evidence_source: OTHER
      explanation: 'Explains why the epimerase is required: the dehydratase is specific for the S epimer.'
