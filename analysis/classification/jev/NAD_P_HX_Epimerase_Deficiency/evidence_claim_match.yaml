              label: encephalopathy, progressive, early-onset, with brain edema and/or leukoencephalopathy,
                1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: naxe_niacin_efficacy_uncontrolled
        kind: KNOWLEDGE_GAP
        attaches_to:
        - treatments#Niacin or Nicotinamide (NAD+ Precursor) Supplementation
        prompt: Does NAD+ precursor treatment change survival in NAXE deficiency, and should it start
          before the first crisis?
        rationale: All outcome data are case reports and retrospective series. The largest comparison
          pools NAXE with NAXD and sets treated patients, mostly diagnosed recently and alive long enough
          to be treated, against an untreated historical group, which favours the treated arm. One patient
          deteriorated to death on the highest niacin dose reported. The authors who showed metabolomic
          correction also note that no one knows whether NAD+ is chronically depleted between crises,
          which is the question that decides prophylactic use in a presymptomatic sibling.
      selected_evidence:
        snippet: Furthermore, it is not currently known if there is a chronic, low-grade depletion of
          intracellular NAD+ pool, limiting our data for niacin supplementation as a prophylactic measure
          (see below).
        supports: SUPPORT
