              label: encephalopathy, progressive, early-onset, with brain edema and/or leukoencephalopathy,
                1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: naxe_zebrafish_no_severe_phenotype
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - animal_models#naxe knockout zebrafish
        - pathophysiology#Progressive Cerebellar and Spinal Cord Neurodegeneration
        prompt: Why do naxe-null zebrafish accumulate NADHX without developing the neurodegeneration that
          NAXE loss causes in children?
        rationale: The zebrafish model reproduces the biochemical lesion but not the disease. That gap
          matters because the human disease is defined by fever-triggered crises, and zebrafish live at
          28 degrees C with no febrile response, while NAD(P)HX formation rises with temperature. If heat
          stress unmasks a phenotype, the model becomes usable for preclinical testing of NAD+ precursors,
          as the naxd model already is. If it does not, the human vulnerability likely depends on something
          the fish lack. The authors propose exactly this test and have not reported it.
        proposed_experiments:
        - experiment_id: naxe_zebrafish_heat_stress
          name: Heat stress challenge in naxe-null zebrafish larvae
          description: Raise water temperature in naxe-null and wild-type larvae and compare NADHX accumulation,
            locomotion and survival, with and without nicotinic acid.
          readouts:
          - name: NADHX accumulation and survival under heat stress
            target: pathophysiology#Accumulation of Damaged NAD(P)HX Cofactors
            direction: INCREASED
            interpretation: A heat-dependent rise in NADHX with reduced survival would show the model's
              failure reflects the missing trigger.
      selected_evidence:
        snippet: While both models accumulated NADHX, only naxd-/- larvae developed a severe phenotype,
          showing reduced locomotion and early death, which was partially rescued by nicotinic acid supplementation.
        supports: SUPPORT
    origin:
