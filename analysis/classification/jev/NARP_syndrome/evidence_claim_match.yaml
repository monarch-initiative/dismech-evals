    claim:
      about:
        disease:
          name: NARP syndrome
          disease_term:
            preferred_term: NARP syndrome
            term:
              id: MONDO:0010794
              label: NARP syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Maternal mitochondrial inheritance
        description: NARP is caused by heteroplasmic MT-ATP6 point variants at m.8993 and is therefore
          transmitted down the maternal line. Expression depends on the heteroplasmy level, which segregates
          unpredictably between siblings through the mitochondrial bottleneck; the same variant can present
          as NARP at intermediate load and as maternally inherited Leigh syndrome (MILS) at high load.
        inheritance_term:
          preferred_term: Mitochondrial inheritance
          term:
            id: HP:0001427
            label: Mitochondrial inheritance
      selected_evidence:
        snippet: Mutations in mitochondrial DNA (mtDNA) encoded nucleotide 8993 can cause NARP syndrome
          (neuropathy, ataxia, and retinitis pigmentosa) or MILS (maternally inherited Leigh syndrome).
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22819295
      reference_title: Whole mitochondrial genome analysis of a family with NARP/MILS caused by m.8993T>C
        mutation in the MT-ATP6 gene.
      evidence_source: HUMAN_CLINICAL
      explanation: Places the m.8993 MT-ATP6 variants that cause NARP on the maternally inherited mtDNA
        genome, the basis for the mitochondrial inheritance mode.
