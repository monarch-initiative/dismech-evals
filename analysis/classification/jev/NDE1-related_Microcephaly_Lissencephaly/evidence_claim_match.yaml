      assertion:
        discussion_id: gap_nde1_human_organoid_translatability
        prompt: Which NDE1-dependent radial-glial progenitor, outer-radial-glial, and neuronal-migration
          defects seen in rodent and biochemical systems are conserved in human iPSC-derived cortical
          organoids or fetal cortical tissue?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Biallelic NDE1 Loss and Centrosome-Dynein Perturbation
        - pathophysiology#Progenitor Cell-Cycle Arrest and Failed Neurogenesis
        - pathophysiology#Dynein-Dependent Neuronal Migration Failure
        rationale: NDE1 disease has direct human genetic evidence, rat in utero perturbation evidence,
          and in vitro dynein reconstitution, but the Falcon review did not identify an NDE1-specific
          patient iPSC or organoid model. This matters because human cortical expansion depends on OSVZ
          and outer radial glia, which are not fully represented in lissencephalic rodent cortex. A direct
          NDE1 organoid experiment is needed to determine whether the disease has an oRG-specific branch
          beyond the apical radial-glial defects observed in rat.
        proposed_experiments:
        - experiment_id: exp_nde1_isogenic_cortical_organoid_cell_cycle_migration
          name: NDE1 isogenic cortical-organoid cell-cycle and migration experiment
          description: Generate patient-derived or CRISPR-engineered human cortical organoids carrying
            biallelic NDE1 loss-of-function variants, with isogenic corrected and knock-in controls, and
            compare apical radial-glial INM, ciliary dynamics, G2-to-M transition, oRG mitosis, neuronal
            migration, and dynein/LIS1 rescue against the rodent and biochemical expectations.
          experiment_type:
            preferred_term: isogenic cortical organoid perturbation experiment
          model_systems:
          - name: NDE1 human iPSC-derived cortical organoid
            description: Three-dimensional human cortical organoid with radial-glial progenitors, oRG-like
              cells, and migrating cortical neurons, derived from patient-specific or engineered iPSCs.
            experimental_model_type: ORGANOID
