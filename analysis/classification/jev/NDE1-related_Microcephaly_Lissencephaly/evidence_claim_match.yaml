          decision_criterion: The NDE1 disease skeleton is strengthened if mutant organoids reproduce
            apical INM, G2-to-M, ciliary, neuronal-output, and migration defects that are rescued by isogenic
            correction and reproduced by knock-in. A human-specific branch is supported if oRG mitosis
