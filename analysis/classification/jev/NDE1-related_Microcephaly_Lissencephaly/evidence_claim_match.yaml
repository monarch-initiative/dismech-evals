      assertion:
        name: Progenitor Cell-Cycle Arrest and Failed Neurogenesis
        description: In radial-glial progenitors, NDE1 deficiency produces a multi-stage cell-cycle failure
          rather than a single mitotic-spindle defect. Model data support arrest during apical interkinetic
          nuclear migration, arrest at the G2-to-M transition, and a cilia-linked G1-to-S transition defect.
          These defects prevent progenitors from reaching or completing productive mitosis and thereby
          reduce cortical neuron production.
        conforms_to: neural_progenitor_centrosome_spindle_dysfunction#Abnormal Progenitor Division and
          Fate Choice
