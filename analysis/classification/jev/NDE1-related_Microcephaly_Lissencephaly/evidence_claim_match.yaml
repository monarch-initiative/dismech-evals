      assertion_type: Discussion
      assertion:
        discussion_id: gap_nde1_paralog_and_cnv_diagnostics
        prompt: How should NDE1/NDEL1 paralog compensation and 16p13.11 CNV-plus-sequence variant unmasking
          be incorporated into diagnosis and mechanism-specific curation?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Progenitor Cell-Cycle Arrest and Failed Neurogenesis
        - genetic#NDE1
        rationale: 'The mechanism literature shows overlapping but non-identical NDE1 and NDEL1 functions,
          including an NDE1-specific G2-to-M transition role. Separately, case literature shows that a
          16p13.11 deletion can unmask a truncating NDE1 variant on the other chromosome. These observations
          create two curation questions: which cell-cycle functions are truly NDE1-specific in human cortex,
          and when should CMA plus sequencing be treated as required to resolve biallelic NDE1 disease?'
        proposed_experiments:
        - experiment_id: exp_nde1_ndel1_rescue_and_diagnostic_resolution
          name: NDE1/NDEL1 rescue and CNV-plus-sequence diagnostic resolution
          description: In NDE1 mutant human cortical organoids, compare NDE1, NDEL1, dynein/LIS1, and
            cilia-pathway rescue at INM, G1-to-S, and G2-to-M checkpoints; in parallel, assemble a clinical
            series of severe congenital microcephaly cases with 16p13.11 deletions and sequence NDE1 on
            the retained allele.
          experiment_type:
            preferred_term: combined organoid rescue and genomic diagnostic study
          would_support:
          - pathophysiology#Progenitor Cell-Cycle Arrest and Failed Neurogenesis
          - genetic#NDE1
      selected_evidence:
        snippet: Sequencing NDE1 and CMA in patients with severe congenital microcephaly may be warranted.
        supports: SUPPORT
