      assertion_type: Pathophysiology
      assertion:
        name: Biallelic NDE1 Loss and Centrosome-Dynein Perturbation
        description: Homozygous or compound biallelic NDE1 loss-of-function variants remove or destabilize
          the C-terminal dynein-binding and centrosome-targeting functions of NDE1. NDE1 normally localizes
          to centrosomes and mitotic spindle poles in proliferating neural progenitors and cooperates
          with LIS1 to activate cytoplasmic dynein. Loss of this molecular platform perturbs the centrosome-spindle
          apparatus and dynein-dependent microtubule transport at the top of the pathograph.
        conforms_to: neural_progenitor_centrosome_spindle_dysfunction#Centrosome and Mitotic Spindle Perturbation
        role: trigger
        genes:
        - preferred_term: NDE1
          term:
            id: hgnc:17619
