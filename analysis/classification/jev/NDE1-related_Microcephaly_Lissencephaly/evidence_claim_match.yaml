            target: pathophysiology#Biallelic NDE1 Loss and Centrosome-Dynein Perturbation
            genes:
            - preferred_term: NDE1
              term:
                id: hgnc:17619
                label: NDE1
            description: Correct patient variants or introduce representative truncating variants in an
              isogenic human iPSC background.
          readouts:
