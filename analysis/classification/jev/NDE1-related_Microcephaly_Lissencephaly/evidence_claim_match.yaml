        name: Dynein-Dependent Neuronal Migration Failure
        description: In addition to the dominant radial-glial progenitor branch, NDE1 and its paralog
          NDEL1 regulate postmitotic neuronal migration through the dynein/LIS1 microtubule apparatus.
          NDE1 loss therefore has a migration branch that helps explain cortical lamination abnormalities
          and lissencephaly features beyond reduced neuron output alone.
