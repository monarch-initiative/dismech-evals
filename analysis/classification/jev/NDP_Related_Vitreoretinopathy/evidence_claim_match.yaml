  0fd7b4a50605371384e33d579aff1cba2196830789258741e199b452f859d7ed:
    claim:
      about:
        disease:
          name: NDP-Related Vitreoretinopathy
          disease_term:
            preferred_term: NDP-related vitreoretinopathy
            term:
              id: MONDO:0700377
              label: NDP-related vitreoretinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Intraretinal Capillary Formation
        description: 'The retinal consequence of the signalling deficit, and the step at which this disease
          separates from an ordinary vasculopathy. Norrin is secreted by Muller glia and acts on the endothelium
          beside them, so the affected cell and the signalling cell are different; the vessels never receive
          the instruction to grow inward from the superficial plexus and form the deep intraretinal capillary
          beds. In Ndp-null mice intraretinal capillary formation is abolished outright rather than merely
          reduced. Severity in humans scales with residual signal, from a peripheral avascular zone in
          X-linked FEVR to near-total retinal hypovascularization in Norrie disease.

          '
        role: central_effector
        biological_scale: TISSUE
        conforms_to: norrin_fzd4_retinal_vascular_development#Incomplete Retinal Vascularization with
          Peripheral Avascular Retina
        cell_types:
        - preferred_term: retinal blood vessel endothelial cell
          term:
            id: CL:0002585
            label: retinal blood vessel endothelial cell
        - preferred_term: Mueller cell
          term:
            id: CL:0000636
            label: Mueller cell
        biological_processes:
        - preferred_term: Retinal blood vessel morphogenesis
          term:
            id: GO:0061304
            label: retinal blood vessel morphogenesis
          modifier: DECREASED
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
      selected_evidence:
        snippet: Norrin, secreted by retinal Müller cells, activates canonical Wnt signaling via Frizzled-4
          and co-receptors.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
