        name: X-linked inheritance
        inheritance_term:
          preferred_term: X-linked inheritance
          term:
            id: HP:0001417
            label: X-linked inheritance
        description: 'NDP-related retinopathies are inherited in an X-linked manner. The majority of affected
          males have an NDP pathogenic variant inherited from their carrier mother, who has a 50% transmission
          risk per pregnancy; affected males transmit the variant to all daughters (who become carriers)
          and no sons. Rarely, heterozygous females have clinical manifestations.

          '
      selected_evidence:
        snippet: males who inherit the pathogenic variant will be affected; females who inherit the pathogenic
          variant will be heterozygous and may rarely have clinical manifestations. Affected males transmit
          the NDP pathogenic variant to all of their daughters and none of their sons.
        supports: SUPPORT
