        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Norrin-FZD4-LRP5-TSPAN12 Retinal Vascular Wnt Signaling Deficiency
        conforms_to: norrin_fzd4_retinal_vascular_development#Insufficient Norrin-FZD4-beta-catenin Signalling
          in Retinal Endothelium
        role: trigger
        description: 'Loss-of-function NDP variants impair Norrin ligand activity, disrupting Norrin-FZD4-LRP5-TSPAN12
          canonical Wnt/beta-catenin signaling in retinal vascular endothelium. This signaling axis is
          required for deep retinal vascular plexus formation and stabilization of endothelial junctional
          complexes that maintain the inner blood-retinal barrier; its loss produces the combined degenerative
          and proliferative retinal vascular pathology (incomplete vascularization with secondary neovascularization
          and exudation) seen across the NDP-related retinopathy spectrum.

          '
        cell_types:
        - preferred_term: Endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: Canonical Wnt signaling pathway
          term:
            id: GO:0060070
            label: canonical Wnt signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: The early angiogenesis of the retina and its iBRB is a delicate process that is mediated
          by the canonical Norrin Wnt-signaling pathway in retinal endothelial cells. Pathogenic variants
          in genes that play key roles within this pathway, such as NDP, FZD4, TSPAN12, and LRP5, have
          been associated with the incidence of these retinal diseases.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37947657
      reference_title: 'Mechanisms Underlying Rare Inherited Pediatric Retinal Vascular Diseases: FEVR,
