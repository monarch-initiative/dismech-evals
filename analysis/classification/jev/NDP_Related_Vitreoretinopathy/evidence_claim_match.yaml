              density and plexus organization, preserved the blood-retinal barrier and rescued visual
              function, establishing that the vascular defect is correctable postnatally rather than fixed
              at birth.

              '
            limitations: 'Mouse retinal vascularization is largely postnatal whereas human retinal vascularization
              completes before term, so the postnatal-day-7 treatment window has no straightforward human
              equivalent; and the mouse lacks the retrolental fibrovascular mass and retinal detachment
              that define severe human Norrie disease.

