      assertion_type: Pathophysiology
      assertion:
        name: Retinal Hypovascularization, Dysplasia and Congenital Blindness
        description: 'At the severe end of the spectrum the avascular retina is also dysplastic, producing
          the retrolental fibrovascular mass historically called pseudoglioma, with retinal detachment
          usually present at or shortly after birth and blindness from infancy. The same lesion at higher
          residual signal gives X-linked FEVR, whose peripheral avascularity and exudative complications
          resemble retinopathy of prematurity - a resemblance that is phenotypic convergence on ischaemic
          retina, not shared aetiology, since ROP begins with hyperoxic vessel arrest rather than with
          a Norrin lesion.

          '
        role: consequence
        biological_scale: ORGANISM
        conforms_to: norrin_fzd4_retinal_vascular_development#Ischaemia-Driven Neovascularization, Exudation
          and Tractional Detachment
        biological_processes:
        - preferred_term: Visual perception
          term:
            id: GO:0007601
            label: visual perception
          modifier: DECREASED
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
      selected_evidence:
        snippet: In humans, mutations in NDP, which encodes norrin, cause Norrie disease, characterized
          by retinal hypovascularization and congenital blindness, and X-linked familial exudative vitreoretinopathy
          (FEVR), resembling retinopathy of prematurity (ROP).
        supports: SUPPORT
