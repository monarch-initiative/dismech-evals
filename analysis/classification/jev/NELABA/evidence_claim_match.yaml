            label: lipoic acid
      selected_evidence:
        snippet: Affected individuals' fibroblasts showed reduced oxygen consumption rates, PDHc, α-KGDHc
          activities, leucine catabolic flux, and decreased protein lipoylation.
        supports: SUPPORT
