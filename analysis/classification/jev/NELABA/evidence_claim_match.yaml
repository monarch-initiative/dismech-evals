            term:
              id: MONDO:0060562
              label: encephalopathy, neonatal severe, with lactic acidosis and brain abnormalities
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired mitochondrial lipoylation via LIPT2 deficiency
        description: 'LIPT2 encodes lipoyltransferase 2, which transfers octanoyl groups from octanoyl-ACP
          (synthesized by the mitochondrial fatty acid synthesis system) to the glycine cleavage system
          H protein (GCSH). This is the first committed step in the mitochondrial lipoylation pathway.
          The octanoyl-GCSH is then converted to lipoyl-GCSH by lipoic acid synthetase (LIAS), and LIPT1
          relays lipoyl groups from GCSH to the E2 subunits of alpha-ketoacid dehydrogenases. Loss-of-function
          mutations in LIPT2 abolish this initial transfer, leading to deficient lipoylation of all lipoic
          acid-dependent enzyme complexes and disruption of the glycine cleavage system. Unlike LIPT1
          deficiency which spares glycine cleavage, LIPT2 deficiency affects all lipoylated proteins.

          '
        genes:
        - preferred_term: LIPT2
          term:
            id: hgnc:37216
            label: LIPT2
        gene:
          preferred_term: LIPT2
          description: Lipoyltransferase 2, catalyzes the first committed step in mitochondrial lipoylation
            by transferring octanoyl groups from octanoyl-ACP to GCSH.
          modifier: DECREASED
          term:
            id: hgnc:37216
            label: LIPT2
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        molecular_functions:
        - preferred_term: lipoyl(octanoyl) transferase activity
          term:
            id: GO:0033819
            label: lipoyl(octanoyl) transferase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: lipoate biosynthetic process
          modifier: DECREASED
