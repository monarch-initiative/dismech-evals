              label: encephalopathy, neonatal severe, with lactic acidosis and brain abnormalities
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Combined alpha-ketoacid dehydrogenase deficiency
        description: 'Defective lipoylation of the E2 subunits of pyruvate dehydrogenase (PDHc), alpha-ketoglutarate
          dehydrogenase (alpha-KGDHc), and branched-chain ketoacid dehydrogenase (BCKDHc) impairs oxidative
          metabolism of pyruvate, alpha-ketoglutarate, and branched-chain amino acids. Loss of PDHc blocks
          entry of glycolytic end products into the TCA cycle, causing pyruvate and lactate accumulation
          and energy failure. Loss of alpha-KGDHc disrupts the TCA cycle at its midpoint. The brain is
          particularly vulnerable due to its high dependence on oxidative metabolism.

          '
        biological_processes:
        - preferred_term: Tricarboxylic acid cycle
          modifier: DECREASED
          term:
            id: GO:0006099
            label: tricarboxylic acid cycle
        - preferred_term: pyruvate decarboxylation to acetyl-CoA
          modifier: DECREASED
          term:
            id: GO:0006086
            label: pyruvate decarboxylation to acetyl-CoA
        - preferred_term: branched-chain amino acid catabolic process
          modifier: DECREASED
          term:
            id: GO:0009083
            label: branched-chain amino acid catabolic process
        cellular_components:
        - preferred_term: Pyruvate dehydrogenase complex
          term:
            id: GO:0045254
            label: pyruvate dehydrogenase complex
        chemical_entities:
        - preferred_term: pyruvate
          modifier: INCREASED
          term:
            id: CHEBI:15361
            label: pyruvate
        - preferred_term: lactate
          modifier: INCREASED
          term:
            id: CHEBI:24996
            label: lactate
      selected_evidence:
        snippet: The loss of these two dehydrogenases short-circuits the citric acid cycle, resulting
          in severe respiratory deficiency and extreme muscle weakness
