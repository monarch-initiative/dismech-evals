          value:
            target: Disrupted Cortical Neuron Migration and Lamination
            relationship: RECAPITULATES
            fidelity: HIGH
            limitations: Mouse and human neocortical development differ in scale, in the extent of the
              outer subventricular zone and in gyrification, so the magnitude of a migration defect does
              not transfer quantitatively. The mouse also carries a null or heterozygous-null allele rather
              than the patients' hypomorphic missense alleles, so it models the dosage consequence rather
              than the specific allele.
            description: Cortical projection neurons over-migrate, shifting the final position and size
              of cortical layers, in both null and heterozygous animals.
          role: ancestor
