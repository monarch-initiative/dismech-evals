      assertion_type: Pathophysiology
      assertion:
        name: Reduced Proneural Transcription Factor Activity
        biological_scale: MOLECULAR
        description: 'Loss of NEUROD2 transcriptional activity during vertebrate brain development. This
          is the disorder''s defining molecular state and the level at which it differs from most developmental
          and epileptic encephalopathies: the lesion is in a regulator of gene expression, so its consequences
          are distributed across every downstream program NEUROD2 controls rather than concentrated in
          one protein''s function.'
        biological_processes:
        - preferred_term: central nervous system neuron differentiation
          modifier: DECREASED
          term:
            id: GO:0021953
            label: central nervous system neuron differentiation
      selected_evidence:
        snippet: Our results support a model of DEE75 resulting from reduced NeuroD2 activity during vertebrate
          brain development
        supports: SUPPORT
