  dc27d444c4263a0ca43aa0c5b213ac85820bf827df7c188674915302b39b56fc:
    claim:
      about:
        disease:
          name: NEUROD2-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 72
            term:
              id: MONDO:0032710
              label: developmental and epileptic encephalopathy, 72
        context: []
      assertion_type: Genetic
      assertion:
        name: NEUROD2
        gene_term:
          preferred_term: NEUROD2
          term:
            id: hgnc:7763
            label: NEUROD2
        relationship_type: CAUSATIVE
        association: 'Heterozygous de novo variants in NEUROD2 reduce the activity of the encoded transcription
          factor and cause DEE72. Reported pathogenic variants cluster in the bHLH domain, the DNA-binding
          module: p.Glu130Gln, p.Met134Thr and p.Arg129Trp all fall in the conserved DNA-binding basic
          region of the first helix, and p.Leu163Pro lies in the second helix, also DNA-binding and also
          highly conserved. p.Glu130Gln is recurrent across unrelated families. In cellular assay the
          variants are hypomorphic rather than null - markedly less effective than wild type in a neuron-induction
          assay, but not inert.'
        notes: 'Haploinsufficiency and hypomorphism are not competing claims here, and the entry should
          not be read as leaving two readings live. They are measurements of different things. Haploinsufficiency
          is a statement about gene DOSAGE in mouse: one wild-type Neurod2 copy is not enough, since heterozygotes
          show the same defects as nulls in kind if milder in degree. Hypomorphism is a statement about
          the patient ALLELE: the mutant protein retains partial activity in a neuron-induction assay
          rather than none. A haploinsufficient gene carrying a partially active allele is exactly the
          expected architecture for a dominant disorder of this kind - the mutant contributes some activity,
          the total falls below the threshold the mouse data show exists, and the phenotype follows. What
          is NOT established by any source available to this entry is whether the patient alleles additionally
          act dominant-negatively against the wild-type copy, which would be a third and distinct claim.
          A nomenclature hazard worth recording. One of the sources cited here, the Xenopus laevis CRISPR
          model, repeatedly designates this disorder DEE75. That designation belongs to a different disease:
          DEE75 is MONDO:0032752, OMIM 618437, caused by PARS2. NEUROD2 is DEE72, MONDO:0032710, OMIM
          618374, which carries EIEE72 as an exact synonym. The paper is cited here for its findings,
          which concern NEUROD2 and are not in doubt, but its DEE number is not propagated into this entry.
          A future curator should not "correct" DEE72 to DEE75 on the strength of that paper.'
      selected_evidence:
        snippet: We identified novel de novo variants in neuronal differentiation factor 2 (NEUROD2) in
          two unrelated children with early infantile epileptic encephalopathy
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
