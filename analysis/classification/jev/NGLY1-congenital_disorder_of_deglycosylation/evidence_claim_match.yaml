        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Progressive developmental divergence with relatively stable individual function
        age_range: infancy onward; symptom onset averages about 4 months
        notes: 'A one-year prospective natural-history study of 15 participants - roughly 10% of the identified
          patient population - found profound global developmental delay across communication, gross and
          fine motor, and cognitive domains. The pattern it documents is specific and easy to misread:
          individual measurements were mostly stable over the year, while age-equivalent scores diverged
          further from neurotypical peers, meaning the gap widens because development does not keep pace
          rather than because function is lost. Most patients never walk and do not develop verbal communication.
          Peripheral and auditory neuropathy in the 2026 multicenter cohort were observed to appear over
          time rather than at presentation, so the disease continues to accrue features after diagnosis.'
      selected_evidence:
        snippet: Age-equivalent scores identified a widening developmental gap between participants and
          neurotypical peers over time, indicating delayed milestone achievement and/or regression.
        supports: SUPPORT
    origin:
      assertion_path: /progression/0
