  439c11ed9323bbe16fa59d5830a747905f2d5a0199d497c570ecf85a9912fc22:
    claim:
      about:
        disease:
          name: NGLY1-congenital disorder of deglycosylation
          disease_term:
            preferred_term: congenital disorder of deglycosylation 1
            term:
              id: MONDO:0800044
              label: congenital disorder of deglycosylation 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ngly1_gene_therapy_partial_rescue
        prompt: AAV9-delivered NGLY1 suppressed convulsions in Ngly1-null rats without correcting EEG
          abnormality or sleep fragmentation. What does the dissociation mean for what gene therapy can
          be expected to achieve?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#GS-100 (AAV9-mediated NGLY1 gene replacement)
        - pathophysiology#Neurodevelopmental, ocular, and hepatic dysfunction
        rationale: 'The gene-therapy programme has a strong preclinical package on motor endpoints and
          on the GNA biomarker, and it is easy to read that as disease-wide correction. A separate group,
          dosing AAV9-hNGLY1 into the same rat model, found the opposite for two other endpoints: NGLY1
          protein was robustly expressed and deglycosylation activity partially restored, and non-epileptic
          convulsions fell, but EEG abnormalities and sleep disruption did not improve. Only partial restoration
          of enzymatic activity was achieved, so the dissociation may reflect dose rather than a ceiling
          on what restoration can fix; the alternative - that some features are already developmentally
          fixed by the time of dosing, or depend on a function the vector does not restore - has different
          implications for patient selection and for the age at which treatment is worth giving. The trial''s
          co-primary endpoints are CSF GNA and motor function, neither of which would detect this gap.'
        proposed_experiments:
        - experiment_id: exp_ngly1_dose_response_across_endpoint_classes
          name: Dose-response across endpoint classes in the Ngly1-null rat
          description: Dose AAV9-NGLY1 across a range spanning the reported partial-restoration level,
            and score motor function, GNA, EEG, and sleep architecture in the same animals. If EEG and
            sleep respond at higher restored activity, the dissociation is a dose effect; if they remain
            refractory at full restoration, they identify features that gene replacement cannot address.
        - experiment_id: exp_ngly1_treatment_age_window
          name: Does the age at dosing determine which features respond
          description: Compare dosing at weaning against dosing after the phenotype is established in
            the Ngly1-null rat, using the same endpoint panel. A window effect would bear directly on
            the 2-to-18-year enrolment range of the first-in-human trial.
      selected_evidence:
        snippet: While NGLY1 protein was robustly expressed in the brain with partial restoration of enzymatic
          deglycosylation activity, AAV9-hNGLY1-treated Ngly1-/- rats showed no significant improvement
          in EEG abnormalities or sleep disruption.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41176936
