  3950af32bb69cceb6ec9aa520c382b88620db410ee11dc2aa0dc138c2ba61caa:
    claim:
      about:
        disease:
          name: NGLY1-congenital disorder of deglycosylation
          disease_term:
            preferred_term: congenital disorder of deglycosylation 1
            term:
              id: MONDO:0800044
              label: congenital disorder of deglycosylation 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_ngly1_mouse_rat_human_severity
        prompt: Ngly1-null mice die in utero, Ngly1-null rats live to adulthood and then degenerate, and
          human patients survive to a median of about 13 years. Which of these is the right model of human
          NGLY1 deficiency, and what does the disagreement mean?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#NGLY1 N-glycanase deficiency
        - pathophysiology#Neurodevelopmental, ocular, and hepatic dysfunction
        rationale: The species spread is not a nuisance but a finding. Complete loss of the same enzyme
          is embryonically lethal in one rodent and compatible with adult life in another, and the mouse
          lethality is itself strain-dependent - outcrossing C57BL/6 to ICR partially rescues it, as does
          deleting Engase. Whatever makes the difference is a modifier of severity that is not NGLY1,
          and the same logic likely applies to the phenotypic heterogeneity seen between human patients
          with identical NGLY1 genotypes. The practical consequence is that a therapeutic rescue measured
          against mouse embryonic lethality is measured against an endpoint no patient has, while the
          rat's progressive adult decline is a closer match to the human course but was only characterized
          out to 17-18 months in 2026. Curating either rodent result as though it were a human result
          would overstate it.
        proposed_experiments:
        - experiment_id: exp_ngly1_modifier_mapping_across_backgrounds
          name: Map the background modifiers of Ngly1-null severity
          description: Cross the Ngly1 null onto a panel of inbred backgrounds and map the loci that convert
            embryonic lethality into viability. Candidate modifiers with human orthologs - SEL1L is already
            one such candidate from the Drosophila screen - can then be tested against severity in the
            patient cohort, where genotype currently predicts nothing.
      selected_evidence:
        snippet: Notably, Ngly1⁻/⁻ mice (C57BL/6) are embryonically lethal, and prior characterization
          of Ngly1⁻/⁻ rats was restricted to young adult rat (~7 months old), leaving late-onset phenotypes
          and potential lifespan reduction unexplored.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41721346
      reference_title: Progressive neurodegeneration, motor decline, and premature mortality in aging
        Ngly1 deficient rats.
      evidence_source: MODEL_ORGANISM
      explanation: States the species discrepancy and the gap in rat characterization that the study was
        designed to close.
