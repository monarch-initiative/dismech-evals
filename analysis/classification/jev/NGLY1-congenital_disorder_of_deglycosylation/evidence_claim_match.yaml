              label: congenital disorder of deglycosylation 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ENGase-mediated alternative deglycosylation and GlcNAc-Asn accumulation
        conforms_to: cytosolic_deglycosylation#Cytosolic Glycan Catabolite Dysregulation
        biological_scale: MOLECULAR
        role: amplifier
        description: 'With peptide:N-glycanase absent, the cytosol has no other way to cut the GlcNAc-asparagine
          bond, so endo-beta-N-acetylglucosaminidase (ENGase) cleaves between the two GlcNAc residues
          instead and leaves a single GlcNAc on the asparagine. The partially deglycosylated protein that
          results is aggregation-prone, and its eventual proteasomal breakdown yields GlcNAc-asparagine
          (GNA), which accumulates in cells, animal models, and patients. Two things make this node the
          most consequential in the entry. GNA is the disease''s substrate biomarker and the pharmacodynamic
          endpoint that the gene-therapy programme is built on. And ENGase itself is a therapeutic target
          rather than a bystander: deleting Engase partially rescues the embryonic lethality of Ngly1-null
          mice, which is the strongest genetic evidence available that the damage is done by the diverted
          route and not merely by loss of the normal one.'
        biological_processes:
        - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
          modifier: ABNORMAL
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
        - preferred_term: protein deglycosylation
          modifier: ABNORMAL
          term:
            id: GO:0006517
            label: protein deglycosylation
      selected_evidence:
        snippet: Under NGLY1 deficiency, another deglycosylating enzyme known as ENGase removes N-glycans
          by cleaving the glycosidic bond between the 2 GlcNAc residues, leaving a single GlcNAc residue
          attached to the protein. This incompletely deglycosylated protein is prone to aggregation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39137042
      reference_title: Systemic gene therapy corrects the neurological phenotype in a mouse model of NGLY1
