  efadf70a6c0c2cd3197508580ffd1cd4045c3829072086116401c7304865936b:
    claim:
      about:
        disease:
          name: NGLY1-congenital disorder of deglycosylation
          disease_term:
            preferred_term: congenital disorder of deglycosylation 1
            term:
              id: MONDO:0800044
              label: congenital disorder of deglycosylation 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ngly1_which_substrate_explains_the_phenotype
        prompt: Which NGLY1 substrate or function accounts for the clinical phenotype - alacrima, the
          hyperkinetic movement disorder, the neuropathy - and is ERAD involvement even part of the answer?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired cytosolic deglycosylation of ERAD substrates
        - pathophysiology#Failed NFE2L1 sequence editing and proteasome bounce-back failure
        - pathophysiology#ENGase-mediated alternative deglycosylation and GlcNAc-Asn accumulation
        rationale: The textbook account - NGLY1 deglycosylates ERAD substrates, so its loss breaks ERAD
          - is under direct challenge. Work on the Drosophila model states plainly that loss of NGLY1
          has little effect on ERAD and does not prevent degradation of misfolded proteins, and that the
          physiological significance of NGLY1 in ERAD is not understood. Meanwhile the best characterized
          substrate, NFE2L1/Nrf1, is not an ERAD client being disposed of but a transcription factor being
          activated, and NGLY1 has further reported substrates and functions - NKCC1, BMP signaling, AMPK
          signaling, and a non-enzymatic role in aquaporin transcription - none of which has been tied
          to a specific clinical feature. Nothing in the literature connects any single substrate to alacrima,
          to the movement disorder, or to the length-dependent neuropathy. This entry therefore keeps
          every edge from a molecular node to the clinical consequence typed as INDIRECT_UNKNOWN_INTERMEDIATES,
          and curates the ERAD node as a perturbation rather than as a demonstrated degradative failure.
        proposed_experiments:
        - experiment_id: exp_ngly1_substrate_specific_rescue
          name: Substrate-specific rescue in a viable NGLY1-deficient model
          description: 'In the Ngly1-null rat or the inducible mouse, restore individual candidate outputs
            one at a time - constitutively edited Nrf1, corrected NKCC1, ENGase suppression - without
            restoring NGLY1 itself, and score tear production, motor phenotype, and nerve conduction separately.
            A feature that a single-substrate rescue corrects is a feature that substrate explains. Note
            the constraint the Nrf1 work supplies: mutants mimicking constitutive activation are cytotoxic,
            so the Nrf1 arm needs a conditional design.'
        - experiment_id: exp_ngly1_lacrimal_gland_mechanism
          name: Why the lacrimal gland
          description: Alacrima is near-pathognomonic and among the earliest features, yet no mechanism
            links NGLY1 to tear production. Profile lacrimal gland tissue from a viable model for NGLY1-dependent
            substrates, testing in particular the reported non-enzymatic role in aquaporin transcription,
            which is the only proposed route with an obvious connection to secretion.
      selected_evidence:
        snippet: The pathophysiological basis of NGLY1 deficiency may be associated with the absence of
          various enzymatic and nonenzymatic roles of NGLY1
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
