        - name: Spinal motor neuron and peripheral axon counts
          target: Neurodevelopmental, ocular, and hepatic dysfunction
          direction: DECREASED
          interpretation: The neuropathological substrate of the motor decline, and the structural correlate
            of the human sensorimotor neuropathy.
      selected_evidence:
        snippet: The findings reported here demonstrate that Ngly1⁻/⁻ rats recapitulate the severe, progressive
          course of NGLY1 Deficiency, including neurodegenerative deterioration, motor deficits, and premature
          mortality.
        supports: SUPPORT
