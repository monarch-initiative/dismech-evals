              label: congenital disorder of deglycosylation 1
        context: []
      assertion_type: Biochemical
      assertion:
        name: GlcNAc-asparagine (GNA) in plasma, urine and CSF
        context: GlcNAc-Asn, also written GNA and reported in earlier work as aspartylglycosamine, is
          the substrate biomarker of NGLY1 deficiency. It is the terminal catabolite of the ENGase bypass
          route, so its concentration is an inverse readout of NGLY1 function. It is elevated in patient
          plasma and urine, in dried blood spots, and in the plasma and CSF of the Ngly1-null rat; it
          is stable over time; and it falls with gene-therapy treatment, which is what makes it usable
          as a pharmacodynamic endpoint rather than only a diagnostic marker. CSF GNA is a co-primary
          endpoint of the first-in-human GS-100 trial.
        readouts:
        - target: ENGase-mediated alternative deglycosylation and GlcNAc-Asn accumulation
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: GNA concentration is the direct measurement of the catabolite this node represents.
      selected_evidence:
        snippet: We demonstrate that N-acetylglucosamine-asparagine (GlcNAc-Asn; GNA), is the analyte
          most closely associated with NGLY1 deficiency, showing consistent separation in levels between
          patients and controls.
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/1
      evidence_path: /biochemical/1/evidence/0
