          value:
            name: Ngly1-null mouse (C57BL/6) and the Engase double knockout
            species: Mouse
            genotype: Ngly1 knockout on C57BL/6; Ngly1/Engase double knockout
            description: 'A negative and a genetic result rather than a phenotyping platform. The Ngly1-null
              mouse is embryonically lethal on a C57BL/6 background, which human NGLY1 deficiency is not,
              so on its own it fails as a model of the human disease. Its value is what rescues it: additionally
              deleting Engase partially rescues the lethality, and outcrossing to ICR partially rescues
              it too. Viable mixed-background animals then show a severe phenotype reminiscent of patients,
              and those defects are again suppressed by Engase deletion. This is the strongest genetic
              evidence that the damage in NGLY1 deficiency is done by the diverted ENGase route rather
              than by the absence of deglycosylation as such.'
            publication: PMID:28426790
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Neurodevelopmental, ocular, and hepatic dysfunction
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: On the C57BL/6 background the model dies in utero, so it cannot express the postnatal
          multisystem phenotype that defines the human disease.
        limitations: 'The failure is background-dependent, not absolute: a mixed C57BL/6-ICR background
          yields viable animals with a phenotype resembling patients. A strain-specific embryonic lethality
          with no human counterpart means any rescue measured against it is measured against the wrong
          endpoint, which is the core translational problem with this model.'
      selected_evidence:
        snippet: we analyzed Ngly1-deficient mice and found that they are embryonic lethal in C57BL/6
          background
        supports: SUPPORT
