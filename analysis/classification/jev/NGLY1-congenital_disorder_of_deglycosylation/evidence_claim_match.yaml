              label: congenital disorder of deglycosylation 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failed NFE2L1 sequence editing and proteasome bounce-back failure
        conforms_to: cytosolic_deglycosylation#Loss of Deglycosylation-Dependent Substrate Activation
        biological_scale: CELLULAR
        role: effector
        description: 'Not every NGLY1 substrate is being thrown away. The ER-associated transcription
          factor NFE2L1/Nrf1 is activated by deglycosylation: NGLY1 converts its glycosylated asparagines
          to aspartate, and only after that edit at Asn574 can Nrf1 bind host cell factor C1 and O-GlcNAc
          transferase, reach chromatin, and drive proteasome-subunit gene expression. Without NGLY1 the
          edit does not happen, and the cell cannot mount the proteasome bounce-back response when the
          proteasome is compromised. Pathogenic patient variants, including Arg401* which accounts for
          roughly a fifth of alleles, misprocess NFE2L1 and impair proteasomal-subunit transcription,
          so this is a lesion of the human disease and not only of engineered cells. Note the counterintuitive
          constraint from the same work: constitutively active Nrf1 is itself cytotoxic, so a therapy
          that simply forced the pathway on would not be safe.'
        biological_processes:
        - preferred_term: proteasome assembly
          modifier: DECREASED
          term:
            id: GO:0043248
            label: proteasome assembly
        - preferred_term: response to oxidative stress
          modifier: ABNORMAL
          term:
            id: GO:0006979
            label: response to oxidative stress
      selected_evidence:
        snippet: Editing of Asn574 is essential for interaction with host cell factor C1 and O-GlcNAc
          transferase, which is required for Nrf1 chromatin binding and sufficient proteasome expression.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
