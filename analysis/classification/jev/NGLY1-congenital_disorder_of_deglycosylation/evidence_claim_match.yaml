              label: congenital disorder of deglycosylation 1
        context: []
      assertion_type: Treatment
      assertion:
        name: GS-100 (AAV9-mediated NGLY1 gene replacement)
        description: 'A recombinant single-stranded AAV9 vector delivering a functional copy of human
          NGLY1, given as a single intracerebroventricular dose. The route is the finding, not an implementation
          detail: in the Ngly1-null rat, ICV and IV+ICV administration improved behaviour while intravenous-only
          did not, and adding IV to ICV added nothing - which is the evidence that the CNS is the primary
          therapeutic target organ. Preclinical work showed dose-dependent CNS biodistribution, reduced
          CSF and brain GNA, and improved motor function, with CSF GNA reduction correlating with behavioural
          improvement. Safety studies in wild-type rats and non-human primates found no adverse effects
          at or near the clinical starting dose, supporting an FDA IND. This is an investigational therapy
          with no human efficacy data yet.'
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: In pharmacology studies using Ngly1 -/- rats, intracerebroventricular (i.c.v.) administration
          of GS-100 showed dose-dependent biodistribution, increased hNGLY1 mRNA expression, reduced disease
          biomarker N-acetylglucosamine-asparagine (GNA), improved motor function, and prevented phenotype
          progression.
        supports: SUPPORT
    origin:
