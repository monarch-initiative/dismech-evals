      assertion:
        target: Neurodevelopmental, ocular, and hepatic dysfunction
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Reproduces the neurological course including its progression and premature mortality.
        limitations: The rat's terminal course is not a documented feature of every human patient; the
          human median lifespan of about 13 years is cited from published clinical data rather than measured
          alongside the rodent. Ocular and hepatic components of the human phenotype are not the readouts
          this model is characterized on, so the RECAPITULATES claim rests on the neurological arm.
        readouts:
        - name: Rotarod latency
          target: Neurodevelopmental, ocular, and hepatic dysfunction
          direction: DECREASED
          interpretation: Motor performance decline with age in the null animals.
        - name: Survival
