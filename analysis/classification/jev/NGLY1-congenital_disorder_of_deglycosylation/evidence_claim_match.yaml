              implementation detail: in the Ngly1-null rat, ICV and IV+ICV administration improved behaviour
              while intravenous-only did not, and adding IV to ICV added nothing - which is the evidence
              that the CNS is the primary therapeutic target organ. Preclinical work showed dose-dependent
              CNS biodistribution, reduced CSF and brain GNA, and improved motor function, with CSF GNA
              reduction correlating with behavioural improvement. Safety studies in wild-type rats and
              non-human primates found no adverse effects at or near the clinical starting dose, supporting
