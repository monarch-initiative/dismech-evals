          are not informative here and a normal result does not exclude it. Screening an NGLY1-CDDG proband
          the way a CDG proband would be screened yields a false negative.
        diagnosis_term:
          preferred_term: serum transferrin glycoform screening
          term:
            id: NCIT:C15419
