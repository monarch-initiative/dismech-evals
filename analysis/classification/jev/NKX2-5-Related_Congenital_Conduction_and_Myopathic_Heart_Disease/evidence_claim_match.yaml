      assertion_type: Environmental
      assertion:
        name: Advanced maternal age
        description: In the mouse, maternal age modifies the risk that a heterozygous Nkx2-5 genotype
          produces a septal defect, and it does so only in mutant offspring. This is a modifier of penetrance
          in a model organism, not an established human risk factor, and it is recorded as MODULATES rather
          than as a trigger.
        exposure_term:
          preferred_term: advanced maternal age
        notes: 'No ontology term is bound. ECTO has no maternal-age class: searching OLS (ontologyId=ecto)
          for "maternal age" returns only ECTO:0300011 exposure to opioid agent via maternal, and neither
          cache/ecto/terms.csv nor cache/xco/terms.csv holds a maternal-age or parental-age row. Maternal
          age is a parental characteristic rather than an exposure to a substance, so no ECTO class is
          expected to fit; a wrong binding would be worse than none.'
      selected_evidence:
        snippet: The maternal age effect is unrelated to aneuploidy or a genetic polymorphism in the affected
          individuals.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
