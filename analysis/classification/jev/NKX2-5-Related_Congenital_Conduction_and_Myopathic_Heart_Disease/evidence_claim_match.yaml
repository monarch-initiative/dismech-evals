            description: Heterozygous NKX2-5 variants, either truncating or missense within the homeodomain,
              reduce the dose of functional cardiac homeodomain transcription factor. Most impair binding
              of NKX2-5 to its target DNA; some missense alleles additionally act dominant-negatively
              on the wild-type protein, and one reported allele instead augments target-DNA binding, so
              reduced dose is the common mechanism rather than the only one.
            biological_scale: MOLECULAR
