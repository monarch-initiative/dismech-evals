  a6258936a05ba74cf693ab9436c257b614c8e636174e17725f5f70a3252b7e50:
    claim:
      about:
        disease:
          name: NKX2-5-Related Congenital, Conduction and Myopathic Heart Disease
          disease_term:
            preferred_term: NKX2-5-related congenital, conduction and myopathic heart disease
            term:
              id: MONDO:0800441
              label: NKX2.5-related congenital, conduction and myopathic heart disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Outflow Tract and Valve Morphogenesis
        description: NKX2-5 is required beyond the septa. The same transcriptional deficit also disturbs
          outflow-tract alignment and septation of the conotruncus, the tricuspid valve, and the growth
          of the left heart, which is why conotruncal malformation, Ebstein anomaly and other tricuspid
          abnormalities, double outlet right ventricle and left-heart hypoplasia all appear in this gene's
          reported spectrum. These are separated from the septal node because a conotruncal or left-heart
          lesion is not a failure of septation.
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: outflow tract morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0003151
            label: outflow tract morphogenesis
      selected_evidence:
        snippet: The coinheritance of NKX2.5 mutations with various congenital heart defects suggests
          that this transcription factor contributes to diverse cardiac developmental pathways.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10587520
      reference_title: Mutations in the cardiac transcription factor NKX2.5 affect diverse cardiac developmental
        pathways.
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: The cohort study's own conclusion that this gene feeds more than one developmental
