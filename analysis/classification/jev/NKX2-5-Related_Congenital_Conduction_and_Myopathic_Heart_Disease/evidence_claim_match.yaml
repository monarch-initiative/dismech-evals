              modifier: DECREASED
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Impaired Cardiac Transcriptional Program
        causal_link_type: DIRECT
        description: 'Reduced NKX2-5 activity lowers transactivation of its target genes. The routes to
          that reduced activity differ by allele: a reduced protein dose, impaired DNA binding at a normal
          dose, or, for the allele quoted here, failure of the protein to reach the nucleus at all.'
      selected_evidence:
        snippet: Functional studies indicate that the c.512insGC mutation impedes nuclear localization
          of NKX2.5 and causes a total loss of transactivation activity of NKX2.5.
        supports: SUPPORT
