              id: MONDO:0044923
              label: acute myeloid leukemia with mutated NPM1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NPM1 Cytoplasmic Mislocalization
        description: NPM1 is a nucleolar phosphoprotein that shuttles between the nucleolus, nucleoplasm,
          and cytoplasm. Wild-type NPM1 localizes predominantly to nucleoli due to a C-terminal nucleolar
          localization signal. Mutations in exon 12 disrupt this signal and create a nuclear export signal,
          causing aberrant cytoplasmic accumulation (NPMc+). This depletes nucleolar NPM1, disrupting
          its normal functions.
        cell_types:
        - preferred_term: myeloblast
          term:
            id: CL:0000835
            label: myeloblast
      selected_evidence:
        snippet: The aberrant localization of the mutated nucleophosmin (NPM1) protein in the cytoplasm
          is the hallmark of the development of acute myeloid leukemia (AML)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
