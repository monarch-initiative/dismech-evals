      - /disease_term
    evidence_metadata:
      reference: PMID:40647396
      reference_title: 'NPM1-Mutated AML: Deciphering the Molecular and Clinical Puzzle in the Era of
        Novel Treatment Strategies.'
      explanation: This abstract identifies cytoplasmic NPM1 as a hallmark of NPM1-mutated AML, supporting
        the mislocalization mechanism.
