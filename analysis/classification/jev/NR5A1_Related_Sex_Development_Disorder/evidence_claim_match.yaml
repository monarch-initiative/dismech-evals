  8c37fb0eaffa9f0176baf885a0f6fb878ec65fef403f809106032c997df418ed:
    claim:
      about:
        disease:
          name: NR5A1-related sex development disorder
          disease_term:
            preferred_term: NR5A1-related sex development disorder
            term:
              id: MONDO:1060211
              label: NR5A1-related sex development disorder
        context: []
      assertion_type: Subtype
      assertion:
        name: SRXY3
        display_name: 46,XY sex reversal 3 (NR5A1-related 46,XY gonadal dysgenesis, with or without adrenal
          failure)
        classification: clinical_phenotype
        subtype_term:
          preferred_term: 46,XY sex reversal 3
          term:
            id: MONDO:0013066
            label: 46,XY sex reversal 3
        genes:
        - preferred_term: NR5A1
          term:
            id: hgnc:7983
            label: NR5A1
        description: 'SRXY3 is the 46,XY arm of the NR5A1/SF-1 spectrum: reduced SF-1 transactivation
          impairs testis determination and fetal androgen output, so a 46,XY fetus undervirilizes. The
          gonadal lesion ranges from partial to complete gonadal dysgenesis and the external genitalia
          from penoscrotal hypospadias with micropenis through ambiguous genitalia to an entirely female
          appearance; Mullerian derivatives may persist when Sertoli-cell AMH output fails. The first
          two reported NR5A1 patients had the severe end of this range together with primary adrenal failure,
          which is why the OMIM entity is named "with or without adrenal failure", but adrenal involvement
          is in fact exceptional and most SRXY3 patients have normal adrenal function. NR5A1 is among
          the most frequently identified causes of 46,XY DSD, commonly cited at 8-15% and reported at
          9% and 13% in the two cohorts cited here. Two features distinguish SRXY3 from the other 46,XY
          gonadal dysgenesis subtypes and drive management: gonads retained into adolescence carry a raised
          germ-cell-tumour risk, and severely undervirilized infants may nevertheless virilize spontaneously
          at puberty, so the neonatal phenotype is a poor guide to adult androgen status. Inheritance
          is usually heterozygous and sex-limited dominant; a carrier mother may be unaffected or present
          with primary ovarian insufficiency.'
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          description: SRXY3 probands typically carry a single heterozygous NR5A1 variant that is either
            de novo or inherited in a sex-limited dominant manner from a heterozygous mother.
      selected_evidence:
        snippet: Heterozygous missense mutations in NR5A1 were found in four individuals (four of 30,
          13%) with this phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
      - /name
      - /disease_term
