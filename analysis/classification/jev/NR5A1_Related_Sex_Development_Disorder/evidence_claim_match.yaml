      reference: PMID:17200175
      reference_title: Heterozygous missense mutations in steroidogenic factor 1 (SF1/Ad4BP, NR5A1) are
        associated with 46,XY disorders of sex development with normal adrenal function.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes heterozygous NR5A1 variants as a recurrent cause of the 46,XY DSD phenotype
        that defines this subtype, at 13% of a screened cohort.
