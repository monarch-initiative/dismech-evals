      assertion_type: Treatment
      assertion:
        name: Orchidopexy and germ cell tumour surveillance
        description: 'Where the gonads are preserved in a 46,XY (SRXY3) patient, they should be brought
          into a palpable position by early orchidopexy and then kept under germ-cell-tumour surveillance,
          because dysgenetic gonads carry a raised risk of malignant germ cell tumour and of carcinoma-in-situ
          precursor lesions. Finding premalignant or malignant change is what prompts gonadectomy. The
          corollary is that reflex gonadectomy in infancy is not the default: because severely undervirilized
          SRXY3 infants may still virilize spontaneously at puberty, irreversible procedures should be
          deferred until sex assignment has been considered carefully.'
        context: Applies to the SRXY3 (46,XY) arm of NR5A1-related disease in patients whose gonads are
          retained; not applicable to the 46,XX arms of the spectrum.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: orchidopexy with germ-cell tumour surveillance
          term:
            id: NCIT:C111066
            label: Orchiopexy
        target_phenotypes:
        - preferred_term: Testicular neoplasm
          term:
            id: HP:0010788
            label: Testicular neoplasm
      selected_evidence:
        snippet: In case of preserved gonads, early orchidopexy and germ cell tumor screening is warranted.
        supports: SUPPORT
