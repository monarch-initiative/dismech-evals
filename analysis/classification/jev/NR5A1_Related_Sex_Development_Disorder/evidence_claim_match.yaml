              adrenal failure)
            classification: clinical_phenotype
            subtype_term:
              preferred_term: 46,XY sex reversal 3
              term:
                id: MONDO:0013066
                label: 46,XY sex reversal 3
            genes:
            - preferred_term: NR5A1
              term:
                id: hgnc:7983
                label: NR5A1
            description: 'SRXY3 is the 46,XY arm of the NR5A1/SF-1 spectrum: reduced SF-1 transactivation
              impairs testis determination and fetal androgen output, so a 46,XY fetus undervirilizes.
              The gonadal lesion ranges from partial to complete gonadal dysgenesis and the external genitalia
              from penoscrotal hypospadias with micropenis through ambiguous genitalia to an entirely
              female appearance; Mullerian derivatives may persist when Sertoli-cell AMH output fails.
              The first two reported NR5A1 patients had the severe end of this range together with primary
              adrenal failure, which is why the OMIM entity is named "with or without adrenal failure",
              but adrenal involvement is in fact exceptional and most SRXY3 patients have normal adrenal
              function. NR5A1 is among the most frequently identified causes of 46,XY DSD, commonly cited
              at 8-15% and reported at 9% and 13% in the two cohorts cited here. Two features distinguish
              SRXY3 from the other 46,XY gonadal dysgenesis subtypes and drive management: gonads retained
              into adolescence carry a raised germ-cell-tumour risk, and severely undervirilized infants
              may nevertheless virilize spontaneously at puberty, so the neonatal phenotype is a poor
              guide to adult androgen status. Inheritance is usually heterozygous and sex-limited dominant;
              a carrier mother may be unaffected or present with primary ovarian insufficiency.'
          role: subtype
      assertion_type: ProgressionInfo
      assertion:
        phase: Spontaneous virilization at puberty
        subtype: SRXY3
        age_range: Pubertal age
        notes: A substantial share of SRXY3 patients virilize spontaneously at puberty, including some
          who showed no discernible androgen effect in utero, because Leydig-cell function can recover
          as gonadotropin drive rises. Gonadotropins sit at or above the upper reference range, and testosterone
          can reach the adult male range despite reduced gonadal volume. Neither the neonatal genital
          phenotype nor the presence of Mullerian structures predicts how far an individual will virilize,
          which is the argument against irreversible infant surgery and early gonadectomy in this subtype.
      selected_evidence:
        snippet: Patients who first presented in early infancy due to ambiguous genitalia showed spontaneous
          virilization at pubertal age accompanied by a significant testosterone production despite the
          decreased gonadal volume.
        supports: SUPPORT
