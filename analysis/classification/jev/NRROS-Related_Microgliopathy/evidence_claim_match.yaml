        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Microglial Autocrine TGF-beta1 Activation
        description: NRROS is the milieu molecule that presents latent TGF-beta1 on the microglial surface
          for integrin alpha-v beta-8-dependent activation. The activated cytokine acts on the presenting
          cell and its immediate neighbours, so loss of NRROS removes TGF-beta signalling from microglia.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: microglial cell
          term:
            id: CL:0000129
            label: microglial cell
        biological_processes:
        - preferred_term: TGF-beta receptor signaling in microglia
          modifier: DECREASED
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
      selected_evidence:
        snippet: LRRC33 on the surface of microglia functions as a milieu molecule and enables highly
          localized, integrin-αVβ8-dependent TGF-β activation
        supports: SUPPORT
