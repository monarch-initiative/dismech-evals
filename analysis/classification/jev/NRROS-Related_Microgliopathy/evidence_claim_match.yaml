        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nrros_tgfb_versus_nox2
        prompt: Does the human disease follow from loss of microglial TGF-beta1 activation alone, or does
          loss of NRROS-mediated restraint of NOX2 and reactive oxygen species production also contribute?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#NRROS Loss of Function
        - pathophysiology#Perivascular Foamy Macrophage Accumulation
        rationale: NRROS was first described as a negative regulator of NOX2 in phagocytes, and the foamy
          macrophages in patient brain are p22phox-positive. The phenotype of the knockouts, rescue by
          wild-type marrow, and the overlap with human TGF-beta1 deficiency point to the TGF-beta axis,
          but no study has separated the two functions in the CNS disease.
      selected_evidence:
        snippet: NRROS is localized to the endoplasmic reticulum, where it directly interacts with nascent
          NOX2 (also known as gp91(phox) and encoded by Cybb) monomer, one of the membrane-bound subunits
          of the NADPH oxidase complex, and facilitates the degradation of NOX2 through the endoplasmic-reticulum-associated
          degradation pathway
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24739962
      reference_title: NRROS negatively regulates reactive oxygen species during host defence and autoimmunity.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the second, NOX2-regulating function of NRROS.
