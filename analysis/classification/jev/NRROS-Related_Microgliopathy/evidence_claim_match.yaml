        description: Without NRROS-dependent TGF-beta1 signalling, microglia do not express the homeostatic
          microglial signature (Sall1 in the mouse; P2Y12 and TMEM119 in human brain) and adopt a reactive
          phenotype. In the one autopsied child with truncating variants, the accumulating foamy myeloid
          cells lacked the homeostatic microglial markers P2Y12 and TMEM119.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: microglial cell
          term:
            id: CL:0000129
            label: microglial cell
        biological_processes:
        - preferred_term: microglia development
          modifier: DECREASED
          term:
            id: GO:0014005
            label: microglia development
        - preferred_term: microglial cell activation
          modifier: INCREASED
          term:
            id: GO:0001774
            label: microglial cell activation
      selected_evidence:
        snippet: NRROS is required for normal expression of Sall1 and other microglial genes that are
          important for microglial development and function.
        supports: SUPPORT
