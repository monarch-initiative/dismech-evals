  ab3daec296733bcde6d96e4b7257e6f5ae72743c55303291d11d95b77551c568:
    claim:
      about:
        disease:
          name: Nager Acrofacial Dysostosis
          disease_term:
            preferred_term: Nager acrofacial dysostosis
            term:
              id: MONDO:0007943
              label: Nager acrofacial dysostosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nager_sf3b4_dose_species_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why does heterozygous loss of sf3b4 cause no craniofacial phenotype in Xenopus tropicalis
          when the same half dose of SF3B4 causes Nager syndrome in humans, and what does that imply for
          using the frog null as a model of a human haploinsufficiency disorder?
        attaches_to:
        - pathophysiology#SF3B4 Haploinsufficiency
        - animal_models#Xenopus tropicalis sf3b4 CRISPR mutant line
        rationale: 'Human Nager syndrome is a dominant haploinsufficiency: one truncating SF3B4 allele
          is enough. In the frog, heterozygotes are transcriptionally and morphologically near-normal
          and only homozygous nulls show the crest and cartilage phenotype — which the authors themselves
          read as an autosomal recessive mode in X. tropicalis. So the genotype that models the disease
          biochemically is not the genotype that models it clinically. Either the frog tolerates a lower
          dose of Sf3b4 than humans do, or something outside gene dosage — a modifier, a threshold effect,
          or a difference in how long cranial crest is exposed to the deficit — sets the human threshold.
          Until that is resolved, mechanisms read off the null should be treated as showing what losing
          Sf3b4 can do, not as showing what patients'' cells are doing. The same question sits underneath
          the disease''s central puzzle, which is why a core spliceosome component fails in one lineage
          only.'
      selected_evidence:
        snippet: our data indicate that sf3b4 haploinsufficiency is compatible with normal development
          in X. tropicalis, whereas homozygous deletion of sf3b4 is detrimental to survival and the formation
          of NC-derived cartilage progenitors, consistent with an autosomal recessive mode of inheritance
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
