        - path: /pathophysiology/1
          value:
            name: Aberrant Pre-mRNA Splicing and Exon Skipping
            biological_scale: MOLECULAR
            description: Loss of SF3B4 dose does not abolish splicing. It shifts splice-site choice, producing
              an excess of transcripts with atypically skipped exons, and only afterwards a broad dysregulation
              of gene expression enriched for splicing, apoptosis, cell cycle and neural crest migration.
              This two-step course is what turns a housekeeping defect into a developmental one.
            biological_processes:
            - preferred_term: mRNA splicing, via spliceosome
              modifier: ABNORMAL
              term:
                id: GO:0000398
                label: mRNA splicing, via spliceosome
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Cranial Neural Crest Migration Failure and Apoptosis
        description: The transcriptional consequences of mis-splicing fall on migration and survival programmes,
          and the cranial neural crest is the lineage in which that shows.
      selected_evidence:
        snippet: NC cell migration is disrupted at the tailbud stage, and coupled with an increase in
          apoptosis in the head region, a phenotype that is much more pronounced in Null than in Het animals.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1/downstream/0
