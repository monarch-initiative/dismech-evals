            target: Aberrant Pre-mRNA Splicing and Exon Skipping
            direction: INCREASED
            interpretation: Exon skipping rises before general gene dysregulation, identifying it as the
              primary molecular consequence rather than a downstream effect.
        - target: Cranial Neural Crest Migration Failure and Apoptosis
          relationship: RECAPITULATES
          fidelity: HIGH
          description: 'Separates induction from migration: pre-migratory crest markers are normal, and
            the phenotype emerges at the migratory stage as shortened crest streams with increased head
            apoptosis.'
          limitations: Severity is dose-dependent and the informative phenotype is largely in the null,
            which is not the human genotype. The apoptotic component is scored by TUNEL in the whole head
            region rather than in identified crest cells, so apoptosis of crest cells specifically is
            inferred.
          readouts:
