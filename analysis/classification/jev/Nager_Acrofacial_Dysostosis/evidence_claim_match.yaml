            target: Cranial Neural Crest Migration Failure and Apoptosis
            direction: DECREASED
            interpretation: Shorter streams at the migratory stage, with normal pre-migratory markers,
              place the defect in migration rather than specification.
          - name: TUNEL-positive cells in the head region
            target: Cranial Neural Crest Migration Failure and Apoptosis
            direction: INCREASED
            interpretation: Cell death rises only once migration begins, matching the stage at which the
              migration defect appears.
        - target: First and Second Branchial Arch Skeletal Hypoplasia
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Null embryos lose the neural-crest-derived cartilage progenitor pool that builds
            the arch skeleton, giving a developmental account of the craniofacial hypoplasia.
