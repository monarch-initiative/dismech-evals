        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nager_spliceosome_lineage_selectivity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does reduced dose of a ubiquitously required core spliceosome component damage cranial
          neural crest specifically, rather than every dividing tissue?
        attaches_to:
        - pathophysiology#Aberrant Pre-mRNA Splicing and Exon Skipping
        rationale: This is the defining unanswered question of the spliceosomopathies, and nothing in
          this entry's pathophysiology answers it — the chain from reduced SF3B4 to shortened crest streams
          describes what happens without explaining why the crest is where it happens. Candidate explanations
          include an unusually high transcriptional demand in migrating crest, particular sensitivity
          of specific transcripts to branch-point recognition, and a p53-linked apoptotic threshold that
          crest cells cross first. The frog line gives the tools to test these, since it separates the
          splicing change in time from the cellular failure.
      selected_evidence:
        snippet: It is especially puzzling that variants of a core component of this largely ubiquitous
          cellular machinery result in such an exquisitely cell type- and lineage-specific defect.
        supports: SUPPORT
