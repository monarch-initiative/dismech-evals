            term:
              id: MONDO:0007943
              label: Nager acrofacial dysostosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SF3B4 Haploinsufficiency
        biological_scale: MOLECULAR
        description: Heterozygous SF3B4 variants — nearly all frameshifts predicted to encode truncated
          protein — reduce the dose of SAP49, the U2 snRNP component that binds upstream of the intronic
          branch point and helps tether U2 to the pre-mRNA. Roughly 60% of Nager syndrome is explained
          this way; the remaining 40% has no identified cause. The same gene, with more severe alleles,
          causes Rodriguez syndrome.
        genes:
        - preferred_term: SF3B4
          term:
            id: hgnc:10771
            label: SF3B4
        biological_processes:
        - preferred_term: U2 snRNP tethering to the pre-mRNA branch point
          modifier: DECREASED
          term:
            id: GO:0000387
            label: spliceosomal snRNP assembly
      selected_evidence:
        snippet: After Sanger sequencing of SF3B4 in a validation cohort, 20 of 35 (57%) families affected
          by Nager syndrome had 1 of 18 different mutations, nearly all of which were frameshifts.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22541558
      reference_title: Haploinsufficiency of SF3B4, a component of the pre-mRNA spliceosomal complex,
        causes Nager syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: The discovery cohort establishing the mutation spectrum and its frameshift character.
