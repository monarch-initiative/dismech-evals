              id: MONDO:0008061
              label: nail-patella syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: LMX1B
        gene_term:
          preferred_term: LMX1B
          term:
            id: hgnc:6654
            label: LMX1B
        notes: 'NPS is caused by heterozygous loss-of-function variants in LMX1B (missense, nonsense,
          frameshift, splice-site, whole/partial gene deletions, rare translocations/inversions, and non-coding
          LARM enhancer variants). Haploinsufficiency is the predominant mechanism, although some homeodomain
          missense alleles that abolish DNA binding may act dominant-negatively. Mutation location carries
          genotype-phenotype information for nephropathy: homeodomain variants confer a higher proteinuria
          risk than LIM-domain variants, whereas no clear correlation exists for extrarenal features.
          Specific homeodomain missense variants at residue R246 (R246Q/R246P) cause an allelic, isolated
          LMX1B-associated FSGS/nephropathy without the classic nail/skeletal/ocular features, so LMX1B
          belongs on hereditary-FSGS gene panels even absent NPS skeletal findings.'
      selected_evidence:
        snippet: We also report on two NPS patient families with normal LMX1B coding sequence, but with
          loss-of-function variations in the LARM1/2 region
        supports: SUPPORT
    origin:
