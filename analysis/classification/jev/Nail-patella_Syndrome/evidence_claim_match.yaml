        description: 'In the dorsal limb mesenchyme LMX1B is the master dorsalizing transcription factor
          (induced by Wnt7a from the dorsal ectoderm). Reduced dosage produces a partial "double-ventral"
          limb, manifesting as dysplasia of dorsal-derived structures: nails, patellae, elbows, and the
          iliac horns. In mice, complete loss yields symmetrical ventral-ventral autopods lacking nails
          and patellae.'
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: dorsal/ventral limb pattern formation
          modifier: DECREASED
          term:
            id: GO:0009953
            label: dorsal/ventral pattern formation
      selected_evidence:
        snippet: Lmx1b is induced by Wnt7a from the dorsal ectoderm, and its expression is restricted
          to the dorsal mesoderm
        supports: SUPPORT
