        species: Mouse
        genotype: Xcat, a large insertion between exons 1 and 2 of Nhs
        publication: PMID:16357105
        description: The spontaneous X-linked cataract (Xcat) mouse carries an insertion between exons
          1 and 2 of Nhs that abolishes the exon 1-containing isoform, leaving only the alternative exon
          1A isoform, and reduces Nhs protein in lens fiber cells. Hemizygous males and homozygous females
          have fully penetrant cataract; heterozygous females show variegated lens opacity.
        modeled_mechanisms:
        - target: NHS Loss of Function
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Isoform-selective loss of the exon 1 Nhs isoform causing congenital cataract.
          limitations: The allele removes one isoform rather than the whole protein, and the cited abstracts
            report only the lens phenotype; dental, craniofacial and neurodevelopmental features are not
            described.
        - target: Mosaic NHS Expression in Heterozygous Females
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Heterozygous females show variegated lens opacity, the mouse counterpart of variable
            carrier expression.
          limitations: Mouse X-inactivation and lens growth differ from human, and Y-sutural localisation
            is not described.
      selected_evidence:
        snippet: In hemizygous males and homozygous females penetrance is complete with only slight variation
          in the degree of expression.
        supports: SUPPORT
