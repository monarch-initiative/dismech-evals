      assertion_type: Inheritance
      assertion:
        name: X-linked inheritance
        inheritance_term:
          preferred_term: X-linked inheritance
          term:
            id: HP:0001417
            label: X-linked inheritance
        expressivity: VARIABLE
        description: NHS lies on Xp22.13. Hemizygous males carry the full phenotype, while heterozygous
          females range from unaffected to a near-complete male-like presentation, most often showing
          posterior Y-sutural lens opacities with or without mild dental and facial features. Because
          heterozygotes commonly express the trait, the condition is described as X-linked dominant in
          some reports and X-linked recessive in others; the generic X-linked term is bound here for that
          reason, matching ClinGen's XL designation. Female expressivity tracks X-inactivation, which
          is recorded as a pathophysiology node rather than as somatic mosaicism.
      selected_evidence:
        snippet: Nance-Horan syndrome (NHS) is an X-linked disorder characterized by congenital cataracts,
          dental anomalies, dysmorphic features, and, in some cases, mental retardation.
        supports: SUPPORT
