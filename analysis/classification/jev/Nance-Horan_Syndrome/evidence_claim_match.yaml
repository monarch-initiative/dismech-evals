      assertion:
        name: NHS
        gene_term:
          preferred_term: NHS
          term:
            id: hgnc:7820
            label: NHS
        relationship_type: CAUSATIVE
        association: Loss-of-function
        notes: Pathogenic alleles are mostly nonsense and frameshift variants, with partial or whole-gene
          deletions, an intragenic inversion and balanced X-autosome translocations that disrupt the gene.
          All are expected to leave no functional NHS protein.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_a7f57ca3-efb2-4333-9ae1-732aa429f37a-2017-10-20T100000.000Z
        variants:
        - name: NHS c.115C>T p.(Gln39Ter)
          type: single nucleotide variant
          clinical_significance: PATHOGENIC
          description: Exon 1 nonsense variant segregating in a four-generation Asian Indian family with
            eight affected males, who had severe ocular but mild to moderate non-ocular features.
        - name: NHS p.(Arg373Ter)
          type: single nucleotide variant
          clinical_significance: PATHOGENIC
          description: Recurrent nonsense variant reported in unrelated families from different countries.
        - name: Xp22.13 microdeletions including NHS
          type: copy number variation
          clinical_significance: PATHOGENIC
          description: Contiguous deletions removing NHS together with neighbouring genes such as REPS2,
            SCML1 and RAI2 cause the classical syndrome, and larger deletions can add features attributable
            to the co-deleted genes.
      selected_evidence:
        snippet: have identified protein-truncating mutations in a novel gene, which we have called "NHS,"
          in five families.
        supports: SUPPORT
