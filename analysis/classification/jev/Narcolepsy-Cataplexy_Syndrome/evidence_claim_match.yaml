      assertion_type: Pathophysiology
      assertion:
        name: Orexin Neuron Loss
        description: 'Selective loss or dysfunction of hypocretin/orexin-secreting neurons in the lateral
          hypothalamus causes hypocretin deficiency and destabilizes sleep-wake and rapid eye movement
          sleep boundaries. The loss is cell-type-selective - the intermingled melanin-concentrating hormone
          neurons are spared - which is what makes this a defined lesion rather than a nonspecific hypothalamic
          injury, and it is permanent, since the population is small and unreplaced.

          '
        role: trigger
        biological_scale: CELLULAR
        conforms_to: orexin_arousal_instability#Loss of Hypothalamic Orexin (Hypocretin) Signal
        cell_types:
        - preferred_term: hypocretin-secreting neuron
          term:
            id: CL:0011109
            label: hypocretin-secreting neuron
        biological_processes:
        - preferred_term: circadian sleep/wake cycle
          term:
            id: GO:0042745
            label: circadian sleep/wake cycle
      selected_evidence:
        snippet: Narcolepsy is a sleep disorder caused by an apparent degeneration of orexin/hypocretin
          neurons in the lateral hypothalamic area and a subsequent decrease in orexin/hypocretin levels
          in the cerebrospinal fluid.
        supports: SUPPORT
