          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Autoimmune Destruction
        description: 'Strong HLA-DQB1*06:02 association suggests autoimmune etiology. T-cell mediated
          destruction of hypocretin neurons is the leading hypothesis. Environmental triggers (infections,
          H1N1 vaccination) may initiate the autoimmune response in genetically susceptible individuals.
          Direct cellular evidence has since been obtained: hypocretin-specific CD4+ T cells are detectable
          in patients and not in controls, and hypocretin-specific CD8+ T cells are found in blood and
          cerebrospinal fluid.

          '
        role: trigger
        biological_scale: CELLULAR
        subtypes:
        - Narcolepsy Type 1
        biological_processes:
        - preferred_term: Autoimmune Response
          term:
            id: GO:0002460
            label: adaptive immune response based on somatic recombination of immune receptors built from
              immunoglobulin superfamily domains
      selected_evidence:
        snippet: The hypothesis that a targeted immune-mediated or autoimmune attack causes the specific
          degeneration of hypocretin neurons arose mainly through the discovery of genetic associations,
          first with the HLA-DQB1*06:02 allele and then with the T-cell receptor α locus.
        supports: SUPPORT
