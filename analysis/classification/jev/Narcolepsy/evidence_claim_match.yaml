              id: MONDO:0021107
              label: narcolepsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dissociated Intrusion of REM Sleep Components
        description: 'REM sleep is normally an all-or-none package: EEG desynchronisation, rapid eye movements,
          dreaming, and skeletal muscle atonia arrive together. State instability lets the package come
          apart, so single components appear at the wrong time and without the others. Muscle atonia intruding
          into full wakefulness is cataplexy; atonia persisting into waking consciousness at a state boundary
          is sleep paralysis; dream imagery without sleep is hypnagogic hallucination; and the whole state
          entered directly from wake is a sleep-onset REM period. This node is what distinguishes orexin-driven
          hypersomnolence from every other cause of sleepiness, and is the reason the multiple sleep latency
          test counts sleep-onset REM periods rather than only measuring sleep latency.'
        role: effector
        biological_scale: ORGANISM
        conforms_to: orexin_arousal_instability#Dissociated Intrusion of REM Sleep Components into Wakefulness
        biological_processes:
        - preferred_term: REM sleep
          term:
            id: GO:0042747
            label: circadian sleep/wake cycle, REM sleep
          modifier: ABNORMAL
        notes: The atonia machinery whose intrusion produces cataplexy is the same pontine circuit modelled
          in rem_sleep_atonia_control_failure, where it fails in the opposite direction - atonia absent
          during REM sleep rather than present during wakefulness. Narcolepsy type 1 can show both, and
          REM sleep behaviour disorder is a recognised association. This entry does not declare conformance
          to that module, because it curates no polysomnographic finding of REM sleep without atonia,
          which is that module's stated entry requirement.
      selected_evidence:
        snippet: This result identifies hypocretins as major sleep-modulating neurotransmitters
        supports: SUPPORT
