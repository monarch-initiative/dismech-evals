      reference_title: 'Pandemrix™ and narcolepsy: A critical appraisal of the observational studies.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Cited deliberately alongside the risk estimate as the dissenting reading of the same
        twelve European studies. Provenance matters here and is not neutral: the authors are staff and
        contractors of GSK Vaccines, the manufacturer of Pandemrix, together with a pharmacovigilance
        consultancy, so this is the manufacturer-affiliated critique rather than independent scrutiny.
        The two cited sources genuinely disagree - PMID:29855798 concedes that confounding and diagnostic
        bias may influence some studies but judges it unlikely they explain the increased incidence across
        every country where Pandemrix was used. The dispute is recorded here rather than resolved.'
