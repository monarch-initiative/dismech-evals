            description: With cataplexy and orexin/hypocretin deficiency.
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Orexin/Hypocretin Deficiency
        description: 'Loss of orexin-producing neurons in the lateral hypothalamus removes the signal
          that normally holds the sleep-wake switch in a stable position. Postmortem series show an 85-95%
          reduction in orexin neuron number, and the loss is cell-type-selective: the intermingled melanin-concentrating
          hormone neurons are spared, which excludes a nonspecific hypothalamic lesion. Because the population
          is small and unreplaced, the deficit is permanent, and it is detectable in life as low or undetectable
          CSF hypocretin-1. Scoped to Narcolepsy Type 1: CSF hypocretin-1 is normal or intermediate in
          most patients with Type 2, which is why this node - and its conformance to the orexin module''s
          trigger - applies to the Type 1 subtype only.

          '
        role: trigger
        biological_scale: CELLULAR
        subtypes:
        - Narcolepsy Type 1
        conforms_to: orexin_arousal_instability#Loss of Hypothalamic Orexin (Hypocretin) Signal
        cell_types:
        - preferred_term: Orexin Neuron
          term:
            id: CL:0011109
            label: hypocretin-secreting neuron
        biological_processes:
        - preferred_term: Sleep-Wake Regulation
          term:
            id: GO:0042745
            label: circadian sleep/wake cycle
      selected_evidence:
        snippet: Narcolepsy with cataplexy is caused by hypocretin deficiency owing to destruction of
          most of the hypocretin-producing neurons in the hypothalamus.
        supports: SUPPORT
