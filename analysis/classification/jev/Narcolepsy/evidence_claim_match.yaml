      assertion_type: Pathophysiology
      assertion:
        name: Sleep-Wake State Instability
        description: 'The rate-limiting step, and the node that makes sense of the disorder''s apparent
          paradox. Loss of orexinergic stabilisation does not abolish any single behavioural state; it
          makes every state transition too easy. Wakefulness fragments into involuntary sleep episodes,
          and nocturnal sleep fragments into frequent awakenings - which is why these patients are simultaneously
          excessively sleepy by day and poor sleepers by night, an observation a simple "insufficient
          wake drive" account does not predict. Unlike the trigger nodes above, this node is not scoped
          to Type 1: Type 2 patients show the same state instability without a demonstrated orexin deficit,
          which is precisely why the module places its conformance bar at the trigger rather than here.'
        role: central_effector
        biological_scale: ORGANISM
        conforms_to: orexin_arousal_instability#Sleep-Wake State Instability
        biological_processes:
        - preferred_term: sleep-wake cycle state transition
          term:
            id: GO:0022410
            label: circadian sleep/wake cycle process
          modifier: ABNORMAL
        - preferred_term: regulation of the sleep-wake cycle
          term:
            id: GO:0042749
            label: regulation of circadian sleep/wake cycle
          modifier: DECREASED
      selected_evidence:
        snippet: human narcoleptics have an 85%-95% reduction in the number of Hcrt neurons
