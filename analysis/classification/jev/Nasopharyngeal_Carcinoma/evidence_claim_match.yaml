      assertion_type: InfectiousAgent
      assertion:
        name: Epstein-Barr Virus (EBV)
        description: EBV is present in virtually all non-keratinizing NPC and is essential for carcinogenesis.
          The virus establishes latent infection with expression of specific viral proteins (LMP1, LMP2,
          EBNA1) and non-coding RNAs (EBERs, BARTs) that drive oncogenic transformation.
        infectious_agent_term:
          preferred_term: Epstein-Barr virus
          term:
            id: NCBITaxon:10376
            label: human gammaherpesvirus 4
      selected_evidence:
        snippet: In addition to its involvement in a wide range of malignancies such as lymphomas, nasopharyngeal
          carcinoma, and gastric cancer, recent evidence has shown its potential association with autoimmune
          diseases, positioning EBV as an interdisciplinary research model linking virology, oncology,
          and immunology.
        supports: SUPPORT
