      assertion_type: Pathophysiology
      assertion:
        name: Immune Evasion
        conforms_to: immune_checkpoint_blockade#Adaptive Immune Resistance
        description: EBV-infected NPC cells evade immune surveillance through multiple mechanisms including
          PD-L1 upregulation, suppression of antigen presentation, and recruitment of regulatory T cells.
          STAT3 signaling downstream of EGFR/SRC activation drives PD-L1 transcription, enabling durable
          immune evasion independent of EBV mechanisms. This provides rationale for immune checkpoint
          inhibition.
        biological_processes:
        - preferred_term: negative regulation of T cell mediated immunity
          modifier: INCREASED
          term:
            id: GO:0002710
            label: negative regulation of T cell mediated immunity
      selected_evidence:
        snippet: Expression of PD-L1 was higher in EBV positive NPC cell lines compared with EBV negative
          cell lines. PD-L1 expression could be increased by exogenous and endogenous induction of LMP1
          induced PD-L1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25361008
      reference_title: 'EBV-driven LMP1 and IFN-γ up-regulate PD-L1 in nasopharyngeal carcinoma: Implications
        for oncotargeted therapy.'
      evidence_source: IN_VITRO
      explanation: Demonstrates that EBV-driven LMP1 upregulates PD-L1 in NPC cell lines, establishing
        the mechanism of immune evasion via checkpoint ligand expression in EBV-associated nasopharyngeal
        carcinoma.
