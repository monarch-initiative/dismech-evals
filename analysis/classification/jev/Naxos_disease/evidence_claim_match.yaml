      assertion:
        name: JUP
        gene_term:
          preferred_term: JUP
          term:
            id: hgnc:6207
            label: JUP
        relationship_type: CAUSATIVE
        variants:
        - name: c.2157del2 (p.Ser710fs)
          description: Homozygous 2-base-pair deletion in plakoglobin causing a frameshift and premature
            protein truncation; the founder variant in Naxos disease.
        notes: 'Biallelic loss-of-function variants in JUP (plakoglobin) cause Naxos disease. The founder
          allele is a homozygous 2-bp deletion (c.2157del2, p.Ser710fs) truncating the C-terminal domain
          of the protein. The genotype-phenotype boundary is informative: a heterozygous dominant JUP
          variant (S39_K40insS) instead causes arrhythmogenic right ventricular cardiomyopathy without
          the cutaneous phenotype. A Naxos-like phenotype (woolly hair, palmoplantar keratoderma, and
          cardiomyopathy) can also occur without the JUP founder allele: a single consanguineous 2004
          Saudi Arab family was reported as JUP-negative, though exclusion there rested only on heterozygosity
          at one intronic marker (IVS11+22G/A) in the affected proband rather than gene-panel/exome sequencing.
          Such JUP-negative Naxos-like families are in current nosology most often attributed to DSP (see
          the Carvajal syndrome differential), so this is better read as a boundary of the JUP-defined
          entity than as intrinsic locus heterogeneity of Naxos disease itself.'
      selected_evidence:
        snippet: A homozygous 2 base pair deletion in the plakoglobin gene was identified only in the
          19 affected individuals. This deletion caused a frameshift and premature termination of the
          protein, which was shown by western blot analysis.
        supports: SUPPORT
