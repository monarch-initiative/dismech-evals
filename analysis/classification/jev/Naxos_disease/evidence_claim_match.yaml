        measure_type: POINT_PREVALENCE
        prevalence_class: RARE
        notes: A founder disorder originally described on the Greek island of Naxos, with additional families
          reported from Greece, Italy, India, Ecuador, Israel and Turkey. Overall it is very rare; higher
          local carrier frequency reflects the island founder effect.
      selected_evidence:
        snippet: The clinical and histopathological spectrum of heart disease, molecular genetics and
          genotype-phenotype correlation are reviewed in 22 affected families with this cardiocutaneous
          syndrome reported in the literature from Greece, Italy, India, Ecuador, Israel and Turkey.
        supports: SUPPORT
