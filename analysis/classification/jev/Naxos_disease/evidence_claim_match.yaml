          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        penetrance: COMPLETE
        description: Naxos disease is inherited in an autosomal recessive pattern; affected individuals
          are homozygous for a JUP loss-of-function variant, classically the founder frameshift c.2157del2
          (p.Ser710fs). The cutaneous phenotype is present from infancy and the cardiomyopathy is fully
          penetrant by adolescence. Heterozygous carriers are clinically unaffected, though a minority
          show minor ECG or echocardiographic changes.
      selected_evidence:
        snippet: Autosomal recessive ARVC caused by a mutation in plakoglobin was 100% penetrant by adolescence.
        supports: SUPPORT
