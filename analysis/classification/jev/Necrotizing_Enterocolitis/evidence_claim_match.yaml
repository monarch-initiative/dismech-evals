    claim:
      about:
        disease:
          name: Necrotizing Enterocolitis
          disease_term:
            preferred_term: necrotizing enterocolitis
            term:
              id: MONDO:0005313
              label: necrotizing enterocolitis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nec_white_matter_injury_causality
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the excess of periventricular leukomalacia and neurodevelopmental impairment after
          NEC caused by the disease's systemic inflammatory response, or is it confounded by gestational
          age, illness severity and interrupted nutrition?
        rationale: 'The association is large, replicated and graded by disease severity, and a plausible
          mediator route exists in the circulating cytokine load. None of that establishes causation from
          observational data: the infants who develop surgical NEC are also the sickest and the most nutritionally
          deprived, and the meta-analysis that supplies the effect estimates says in its own conclusion
          that causality is not established. Resolving it would need mediation analysis against measured
          inflammatory mediators, or a preventive trial powered on neurodevelopmental rather than intestinal
          outcomes.'
        attaches_to:
        - pathophysiology#Cerebral White Matter Injury
        - phenotypes#Neurodevelopmental delay
      selected_evidence:
        snippet: Further high-quality studies with comprehensive adjustments for potential confounding
          factors are required to definitively establish whether the association with NDI is causal.
        supports: SUPPORT
        directness: DIRECT
