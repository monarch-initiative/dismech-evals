  bc9b560dad5c64f9074d942586fa0a814a721029fbfade53e0eb5163cc096e6d:
    claim:
      about:
        disease:
          name: Necrotizing Enterocolitis
          disease_term:
            preferred_term: necrotizing enterocolitis
            term:
              id: MONDO:0005313
              label: necrotizing enterocolitis
        context: []
      assertion_type: Phenotype
      assertion:
        category: Radiographic
        name: Pneumoperitoneum
        description: 'Free gas in the peritoneal cavity, released when necrotic bowel ruptures. Radiographic
          pneumoperitoneum is the only absolute indication for operation in NEC, but it is insensitive:
          fewer than half of infants found to have perforation or necrosis at laparotomy show it.'
        phenotype_term:
          preferred_term: Pneumoperitoneum
        diagnostic: true
        severity: SEVERE
        notes: 'Left unbound. HPO has no pneumoperitoneum or free-intraperitoneal-gas class. Searches
          run against OLS HP: `l~pneumoperitoneum`, `l~pneumatosis`, `l~free air`, `l~intraperitoneal`
          and `l~peritoneal gas` each return nothing; `l~peritoneal` returns nine terms (peritonitis,
          meconium peritonitis, abnormal peritoneum morphology, peritoneal abscess, peritoneal mass, three
          peritoneal neoplasms, positive peritoneal fluid culture) and none is a gas finding; `l~air`
          returns twenty-seven terms, every one pulmonary or airway. Positive controls on the same adapter
          in the same session: `l~intramural` returns `HP:6000377 Intramural intestinal gas` and `l~Hematochezia`
          returns `HP:0002573`. Note HPO does hold the sibling finding as `HP:6000377`, so the gap is
          specific to free and portal gas rather than to radiographic gas findings generally.'
      selected_evidence:
        snippet: In severe cases, the necrotic bowel ruptures to release the intraluminal air into the
          peritoneal cavity.
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/5
      evidence_path: /phenotypes/5/evidence/0
