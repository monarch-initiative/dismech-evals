  2eceb59d0fe9279cf7d53d71a5c2aab39ceea5e7d80cd931e18f0717f3447e5a:
    claim:
      about:
        disease:
          name: Necrotizing Enterocolitis
          disease_term:
            preferred_term: necrotizing enterocolitis
            term:
              id: MONDO:0005313
              label: necrotizing enterocolitis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cerebral White Matter Injury
        biological_scale: TISSUE
        description: Preterm infants with NEC carry an excess of severe intraventricular haemorrhage and
          periventricular leukomalacia, and the excess is larger in surgical than in medically managed
          disease. The proposed mechanism is the circulating proinflammatory mediator load generated by
          the intestinal lesion, acting on the vulnerable developing white matter; the dose-response with
          disease severity is the main argument that the association is more than shared prematurity.
        notes: 'Whether this is causal remains open. The meta-analysis cited here says so explicitly,
          and confounding by gestational age, illness severity and nutritional interruption is not fully
          separable in observational data. No microglial or astrocytic cell type is bound and no `conforms_to`
          on `neuroinflammation_glial_activation` is asserted: the module''s central node is a reactive
          microglial and astrocytic state, and no source read for this entry measures glial activation
          in the brains of infants with NEC. See the `discussions` entry.'
      selected_evidence:
        snippet: Regarding brain injury, pooled crude ORs indicated an association of NEC with severe
          intraventricular haemorrhage (IVH) (OR 1.42, 95% CI 1.06-1.92) and periventricular leucomalacia
          (PVL) (OR 2.55, 95% CI 1.76-3.69).
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/14
      evidence_path: /pathophysiology/14/evidence/0
