      assertion_type: Environmental
      assertion:
        name: Packed red blood cell transfusion in the anemic preterm infant
        description: 'Transfusion-associated NEC: clinical studies link NEC onset to an antecedent red
          blood cell transfusion. Whether transfusion or the anemia that prompts it is the operative exposure
          is contested, and the two are hard to separate because the sickest and most anemic infants are
          the ones transfused. A murine model resolves the pair into a two-hit sequence in which anemia
          primes intestinal macrophages and transfusion then activates them through TLR4.'
        causal_role: RISK_FACTOR
        exposure_term:
          preferred_term: exposure to packed red blood cell transfusion
          term:
            id: ECTO:2000058
            label: exposure to blood transfusion
        notes: 'Transfusion sits on both sides of this entry: it is a putative risk exposure at onset
          and a supportive treatment for the anemia and coagulopathy of established disease. The two are
          not in conflict - different timing, different context - and neither should be read as cancelling
          the other. The human association is recorded as contested rather than established, so the mechanism
          link is PREDISPOSES and not TRIGGERS, even though the model demonstrates triggering directly.'
      selected_evidence:
        snippet: Intestinal injury worsens with increasing severity and the duration of anemia prior to
          transfusion, indicating a need for the re-evaluation of current transfusion guidelines for premature
          infants.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /environmental/2
      evidence_path: /environmental/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31375667
      reference_title: A murine neonatal model of necrotizing enterocolitis caused by anemia and red blood
