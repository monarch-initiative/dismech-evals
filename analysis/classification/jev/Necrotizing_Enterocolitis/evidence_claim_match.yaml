        description: 'Unit-level standardized feeding guidelines, with preset thresholds for managing
          feeding intolerance, have reduced NEC incidence and severity where implemented. What standardization
          does not require is slow feed advancement: pooled randomized evidence shows that advancing enteral
          volumes slowly (daily increments up to 24 mL/kg) rather than faster does not reduce NEC, and
          may slightly increase invasive infection. The benefit appears to lie in consistency of practice
          rather than in caution about volume.'
        treatment_term:
