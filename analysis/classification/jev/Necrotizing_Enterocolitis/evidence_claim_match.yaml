  77bad168fa6b364548608eaf569099b515639e85917afde3ee95f3ca86d35511:
    claim:
      about:
        disease:
          name: Necrotizing Enterocolitis
          disease_term:
            preferred_term: necrotizing enterocolitis
            term:
              id: MONDO:0005313
              label: necrotizing enterocolitis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Abnormal Microbial Colonization of the Preterm Gut
        biological_scale: ORGANISM
        description: 'The preterm gut is colonized on an abnormal trajectory. Rather than a consistent
          single pathogen, what distinguishes infants who go on to develop NEC is a shift in community
          structure that emerges weeks after birth: an expansion of facultatively anaerobic Gammaproteobacteria
          and a depletion of strict anaerobes. No organism is necessary or sufficient, which is why this
          node is a community-level state rather than an infection.'
        locations:
        - preferred_term: intestinal mucosa
          term:
            id: UBERON:0001242
            label: intestinal mucosa
        notes: Taxa named in the supporting studies are Gammaproteobacteria (NCBITaxon:1236) and Enterobacteriaceae
          (NCBITaxon:543) on the expanding side, Negativicutes and other strict anaerobes on the depleted
          side, and Bifidobacterium longum (NCBITaxon:216816) among the taxa reduced before onset. NCBITaxon
          terms are not bound in `cell_types`, per the microbiome-curation rule that microbial taxa are
          not cell types.
      selected_evidence:
        snippet: The microbial community structure in case stools differed significantly from those in
          control stools. These differences emerged only after the first month of age.
        supports: SUPPORT
        directness: DIRECT
    origin:
