          name: Necrotizing Enterocolitis
          disease_term:
            preferred_term: necrotizing enterocolitis
            term:
              id: MONDO:0005313
              label: necrotizing enterocolitis
        context: []
      assertion_type: Genetic
      assertion:
        name: SIGIRR
        gene_term:
          preferred_term: SIGIRR
          term:
            id: hgnc:30575
            label: SIGIRR
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        association: 'Rare loss-of-function SIGIRR variants are reported in premature infants with stage
          II and worse NEC. SIGIRR is a negative regulator of TLR4 signalling enriched in intestinal epithelium,
          so loss of function is mechanistically coherent with the dominant arm of this entry: it lowers
          the threshold at which a given luminal lipopolysaccharide load activates epithelial TLR4. This
          is a susceptibility claim, not a causal one - NEC is not Mendelian and no gene is necessary
          or sufficient for it.'
        notes: '`gene_disease_validity` is deliberately absent: no external body has classified the SIGIRR-NEC
          pair, and a tier is copied from a source rather than assigned here. The supporting cohort is
          17 sequenced infants with no matched preterm control group reported, so "10 of 17" is a variant
          frequency among cases and not an association estimate - it cannot be read as an effect size,
          and the same variants may well be carried by preterm infants who never develop NEC. No causal
          `genetic:` record is curated for any NEC gene for that reason.'
      selected_evidence:
        snippet: Additionally, Sanger sequencing identified missense, stop, or splice region SIGIRR variants
          in 10 of 17 premature infants with stage II+ NEC.
        supports: SUPPORT
        directness: DIRECT
    origin:
