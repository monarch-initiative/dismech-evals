      assertion_type: Pathophysiology
      assertion:
        name: Intestinal Immaturity of Prematurity
        biological_scale: TISSUE
        description: Preterm birth interrupts intestinal maturation, leaving an epithelium with incomplete
          junctional and mucus barrier function, an innate immune set-point tuned to over-respond to microbial
          ligands, and immature microvascular and neuromuscular control. This is the substrate on which
          every other node in this entry acts, and it is why gestational age is the dominant risk factor
          for NEC rather than any single exposure.
        biological_processes:
        - preferred_term: intestinal epithelial cell development
          term:
            id: GO:0060576
            label: intestinal epithelial cell development
          modifier: DECREASED
        locations:
        - preferred_term: small intestine
          term:
            id: UBERON:0002108
            label: small intestine
      selected_evidence:
        snippet: We examine key contributing factors, including intestinal vascular development, mucosal
          immunity, intestinal regeneration, the enteric nervous system, and the gut microbiome, highlighting
          how prematurity disrupts these processes and predisposes neonates to NEC.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40953322
      reference_title: Exploring the Complex Pathophysiology of Necrotizing Enterocolitis in Preterm Neonates.
