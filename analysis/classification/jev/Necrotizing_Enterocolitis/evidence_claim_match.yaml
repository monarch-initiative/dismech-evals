        kind: CONTROVERSY
        status: OPEN
        prompt: Does Paneth cell loss or dysfunction precede and contribute to NEC, or is the Paneth cell
          change observed in resected bowel a consequence of the disease and its repair?
        rationale: 'Paneth cell dysfunction has been a standing hypothesis for NEC pathogenesis, on the
          reasoning that loss of alpha-defensin output would remove a control on the colonizing community.
          The one human tissue series read for this entry points the other way at the time that matters:
          Paneth cell abundance in acute NEC did not differ from preterm controls, and hyperplasia with
          raised alpha-defensin 5 appeared only after recovery. That is compatible with a reparative rather
          than causal role. No Paneth cell node is curated in the pathograph for this reason.'
        attaches_to:
        - pathophysiology#Abnormal Microbial Colonization of the Preterm Gut
      selected_evidence:
        snippet: In acute NEC, Paneth cell abundance in small intestinal tissue was not significantly
          different from preterm controls.
        supports: REFUTE
