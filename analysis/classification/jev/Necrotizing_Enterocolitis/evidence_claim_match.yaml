        role: preventive
        notes: 'Two claims are kept deliberately separate here because the literature separates them:
          standardized feeding practice reduces NEC, while slow volume advancement specifically does not.
          Conflating them would read the positive quality-improvement result as evidence for a practice
          that randomized trials do not support.'
