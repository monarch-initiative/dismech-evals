          modifier: INCREASED
      selected_evidence:
        snippet: Central amongst the bacterial signalling receptors implicated in NEC development is the
          lipopolysaccharide receptor Toll-like receptor 4 (TLR4), which is expressed at higher levels
          in the premature gut than in the full-term gut.
        supports: SUPPORT
