      assertion_type: Discussion
      assertion:
        discussion_id: nec_heritable_component
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is there a heritable component to NEC risk over and above the heritability of prematurity
          itself, and is the twin concordance signal genetic or shared environmental?
        rationale: The evidence pulls both ways in the same body of work. Zygosity and same-sex concordance
          data in twins point at shared genetic and environmental contributions, and preterm twin faecal
          microbiome data are consistent with that. Against it, studies that controlled for gestational
          age found no difference between twins and singletons - which is the comparison that matters,
          because twins are born earlier and prematurity is the dominant risk factor in this disease.
          Twin concordance also cannot separate genes from a shared uterine, feeding and microbial environment,
          and the monochorionic excess is conventionally attributed to placental vascular anatomy rather
          than to genotype. SIGIRR is the one locus with human loss-of-function variants plus functional
          corroboration, and even there the supporting cohort has no control group. Resolving this needs
          cohorts large enough to estimate a variant effect against matched preterm controls, not further
          concordance counting.
        attaches_to:
        - genetic#SIGIRR
      selected_evidence:
        snippet: Same sex concordance and zygosity data suggest shared genetic and environmental factors
          as important contributing factors to the pathogenesis of NEC.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
