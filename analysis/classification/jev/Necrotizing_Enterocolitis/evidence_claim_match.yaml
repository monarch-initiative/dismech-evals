  ba9fae2ae63adb965e4a9d6dc938ef98dc2d38be62b7fd88d9664e5c18bd781e:
    claim:
      about:
        disease:
          name: Necrotizing Enterocolitis
          disease_term:
            preferred_term: necrotizing enterocolitis
            term:
              id: MONDO:0005313
              label: necrotizing enterocolitis
        context: []
      assertion_type: Phenotype
      assertion:
        category: Radiographic
        name: Portal venous gas
        description: 'Radiolucent gas in the portal venous system, seen as branching lucency over the
          liver. It is the second finding considered near-pathognomonic for NEC, and it arises from the
          same intramural gas: gas generated in the bowel wall tracks into the draining venules.'
        phenotype_term:
          preferred_term: Hepatic portal venous gas
        diagnostic: true
        notes: 'Left unbound. HPO has no portal-venous-gas class. Searches run against OLS HP: `l~portal
          venous gas` and `l~hepatoportal` each return nothing; `l~portal` returns eleven terms, all of
          them portal vein or portal tract morphology and haemodynamics (hypertension, thrombosis, fibrosis,
          hypoplasia, sclerosis, absence, inflammation, velocity, venule thickening), none a gas finding;
          `l~gas` is truncated at the OLS 50-result page limit and so cannot be read as a negative. Positive
          controls on the same adapter in the same session: `l~intramural` returns `HP:6000377 Intramural
          intestinal gas` and `l~Hematochezia` returns `HP:0002573`, so the adapter was live and the absence
          is HPO''s, not the lookup''s. `preferred_term` carries the concept rather than asserting a wrong
          binding.'
      selected_evidence:
        snippet: Some of these collected gases gradually find their way into the local venules that drain
          into the portal venous system and can be seen as branching radiolucency against the relatively
          opaque background of the liver
        supports: SUPPORT
