              id: MONDO:0005313
              label: necrotizing enterocolitis
        context: []
      assertion_type: Phenotype
      assertion:
        category: Gastrointestinal
        name: Post-NEC intestinal stricture
        description: Fibrotic narrowing of healed bowel is the commonest late gastrointestinal complication,
          reported in roughly 12-35% of survivors, more frequent after medical than surgical management,
          and affecting the colon in up to 80% of cases.
        phenotype_term:
          preferred_term: Post-NEC colonic stricture
          term:
            id: HP:0012851
            label: Colonic stenosis
          temporality: CHRONIC
        frequency: COMMON
        notes: 'Bound to `HP:0012851 Colonic stenosis` because the colon is the site the cited review
          puts up to 80% of post-NEC strictures in. HPO has no generic intestinal-stricture or intestinal-stenosis
          class to bind instead. Searches run against OLS HP: `l~stricture` returns nine terms, all site-specific
          (anorectal, urethral, esophageal, `HP:0020002 Ileal stricture`, vaginal, ureteric), which is
          the whole of HPO''s "stricture" vocabulary and contains no generic parent; `l~stenosis` returns
          50 terms including `HP:0012851 Colonic stenosis`; `l~intestinal stenosis` returns only `HP:0012848
          Small intestinal stenosis`. HPO therefore names this concept by site and by the word *stenosis*,
          not *stricture*, which is why a search on *stricture* alone reads as an absence. `HP:0012848`
          would carry the non-colonic minority, but no source read for this entry names or quantifies
          the small-bowel share, so a second row is not asserted on the strength of the "up to 80%" complement
          alone. Note that an `l~` search returning exactly 50 results is truncated at the OLS page limit,
          so a negative drawn from one is not a negative: `l~gas` returns 50 and misses `HP:6000377`,
          which `l~intramural` returns directly.'
      selected_evidence:
        snippet: Common complications of NEC include neurodevelopmental delay, failure to thrive, gastrointestinal
          problems including strictures and adhesions, cholestasis, short bowel syndrome with or without
          intestinal failure that can be difficult to manage.
        supports: SUPPORT
