          heterozygous carrier sibling of two affected children had juvenile hypothyroidism, so a milder
          carrier thyroid phenotype is possible.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: To date, 14 mutations in GLIS3 have been reported, inherited in an autosomal recessive
          manner.
        supports: SUPPORT
