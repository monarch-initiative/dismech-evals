            term:
              id: CHEBI:145810
              label: insulin
      selected_evidence:
        snippet: A rapid molecular diagnosis of NDM is recommended as the specific etiology assists in
          clinical management (insulin vs. sulfonylurea)
        supports: SUPPORT
