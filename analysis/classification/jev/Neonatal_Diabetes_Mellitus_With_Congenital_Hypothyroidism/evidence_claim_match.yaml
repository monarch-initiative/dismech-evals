              label: neonatal diabetes mellitus with congenital hypothyroidism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Endocrine Pancreas Differentiation
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: GLIS3 binds GLIS3 response elements in the Neurog3 promoter and activates it directly
          and together with HNF6 and FOXA2. In Glis3-null mouse embryos Ngn3 expression falls by more
          than 90% and insulin is nearly absent, so the fetal islet endocrine lineage, beta cells in particular,
          is not generated. The human evidence is genetic and clinical; the step-level mechanism comes
          from mouse and cell models.
        biological_processes:
        - preferred_term: endocrine pancreas development
          term:
            id: GO:0031018
            label: endocrine pancreas development
          modifier: DECREASED
        - preferred_term: type B pancreatic cell differentiation
          term:
            id: GO:0003309
            label: type B pancreatic cell differentiation
          modifier: DECREASED
        cell_types:
        - preferred_term: pancreatic endocrine cell
          term:
            id: CL:0008024
            label: pancreatic endocrine cell
        locations:
        - preferred_term: islet of Langerhans
          term:
            id: UBERON:0000006
            label: islet of Langerhans
      selected_evidence:
        snippet: These results indicate that GLIS3 controls fetal islet differentiation via direct transactivation
          of Neurog3, a perturbation that causes neonatal diabetes in mice.
        supports: SUPPORT
