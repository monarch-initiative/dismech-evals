      assertion:
        name: Insulin Therapy
        description: 'Lifelong insulin from diagnosis, often by continuous subcutaneous infusion with
          glucose monitoring. Insulin sensitivity varies widely, from recurrent hypoglycaemia on very
          small doses to insulin resistance during illness, so control is often labile. The diabetes is
          a beta-cell developmental deficiency rather than a KATP-channel defect, so molecular diagnosis
          matters: it distinguishes insulin-dependent forms like this one from the sulfonylurea-responsive
          KCNJ11/ABCC8 channel forms.'
