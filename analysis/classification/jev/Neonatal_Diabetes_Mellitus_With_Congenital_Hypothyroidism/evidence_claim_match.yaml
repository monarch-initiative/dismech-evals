              label: neonatal diabetes mellitus with congenital hypothyroidism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired TSH-Dependent Thyroid Hormone Biosynthesis
        biological_scale: CELLULAR
        description: In the thyroid GLIS3 acts downstream of TSH and TSHR. It binds the promoters of iodide
          transporter genes (Nis/SLC5A5, Pds/SLC26A4) and other thyroid hormone biosynthesis genes. The
          global knockout also loses TSH-driven follicular cell proliferation through mTORC1, but a thyroid-specific
          (Pax8-Cre) knockout keeps normal proliferation while biosynthesis genes stay suppressed, so
          the proliferation defect is attributed to GLIS3 loss in other cell types and the cell-autonomous
          thyroid defect is in hormone synthesis. Its loss produces a dyshormonogenic hypothyroidism in
          which TSH and thyroglobulin rise. Thyroid anatomy in patients ranges from normal to hypoplasia
          or athyreosis, and a post-mortem gland showed sparse colloid with interstitial fibrosis, so
          a developmental contribution is not excluded.
        biological_processes:
        - preferred_term: thyroid hormone generation
          term:
            id: GO:0006590
            label: thyroid hormone generation
          modifier: DECREASED
        cell_types:
        - preferred_term: thyroid follicular cell
          term:
            id: CL:0002258
            label: thyroid follicular cell
        locations:
        - preferred_term: thyroid gland
          term:
            id: UBERON:0002046
            label: thyroid gland
      selected_evidence:
        snippet: we demonstrate that GLIS3 acts downstream of thyroid-stimulating hormone (TSH) and TSH
          receptor (TSHR) and is indispensable for TSH/TSHR-mediated proliferation of thyroid follicular
          cells and biosynthesis of thyroid hormone.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
