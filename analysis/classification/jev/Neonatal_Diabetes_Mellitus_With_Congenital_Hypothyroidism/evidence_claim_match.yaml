  67193c07b7a1f5015f3a269907aa0062ed1c502982e0b3c6edd58dca96357399:
    claim:
      about:
        disease:
          name: Neonatal Diabetes Mellitus With Congenital Hypothyroidism
          disease_term:
            preferred_term: neonatal diabetes mellitus with congenital hypothyroidism
            term:
              id: MONDO:0012436
              label: neonatal diabetes mellitus with congenital hypothyroidism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic GLIS3 Loss of Function
        biological_scale: MOLECULAR
        description: Biallelic GLIS3 variants remove or truncate the transcription factor. The original
          NDH1 frameshift (c.1873dupC) yields a protein that still enters the nucleus but has lost its
          C-terminal transactivation function, while partial deletions remove the 5' exons and the major
          pancreatic and thyroid transcripts. Residual expression of shorter tissue-specific transcripts
          from some deletion alleles is the proposed explanation for incomplete phenotypes.
        molecular_functions:
        - preferred_term: GLIS3 sequence-specific DNA-binding transcription factor activity
          term:
            id: GO:0000981
            label: DNA-binding transcription factor activity, RNA polymerase II-specific
          modifier: DECREASED
        genetic_context:
          gene:
            preferred_term: GLIS3
            term:
              id: hgnc:28510
              label: GLIS3
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: In the original family, we identified a frameshift mutation predicted to result in a
          truncated protein. In two other families with an incomplete syndrome, we found that affected
          individuals harbor deletions affecting the 11 or 12 5'-most exons of the gene.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16715098
      reference_title: Mutations in GLIS3 are responsible for a rare syndrome with neonatal diabetes mellitus
        and congenital hypothyroidism.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies the truncating and deletion alleles that define the disease mechanism as
        loss of GLIS3.
