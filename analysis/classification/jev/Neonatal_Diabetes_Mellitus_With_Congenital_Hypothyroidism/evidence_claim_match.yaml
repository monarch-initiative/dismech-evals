        context: []
      assertion_type: Genetic
      assertion:
        name: GLIS3
        gene_term:
          preferred_term: GLIS3
          term:
            id: hgnc:28510
            label: GLIS3
        relationship_type: CAUSATIVE
        notes: 'Biallelic variants: partial or whole-exon deletions (most frequent), frameshift (c.1873dupC
          in the index family), nonsense (p.Gln798Ter) and missense variants in the zinc-finger DNA-binding
          domain (p.Cys536Trp, p.His561Tyr, p.Arg589Trp, p.His647Arg). Some deletions also remove the
          neighbouring SLC1A1 gene. Common GLIS3 variants associated with type 1 and type 2 diabetes in
          GWAS are susceptibility alleles and are not part of this Mendelian entry.'
      selected_evidence:
        snippet: Here, we show that this syndrome results from mutations in GLIS3, encoding GLI similar
          3, a recently identified transcription factor.
        supports: SUPPORT
