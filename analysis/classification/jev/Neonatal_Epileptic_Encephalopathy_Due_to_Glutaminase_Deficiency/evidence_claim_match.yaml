      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: glutamate_deficiency
        hypothesis_label: Glutamate Deficiency (Loss-of-Function) Model
        status: ALTERNATIVE
        description: 'Because glutaminase produces glutamate — the principal excitatory neurotransmitter
          and the precursor of GABA — from astrocyte-derived glutamine, complete glutaminase deficiency
          is proposed to deprive neurons of glutamate and so disturb excitatory and inhibitory neurotransmission,
          producing the refractory seizures and the failure of central respiratory regulation. This was
          the framing of the original report. Its weakness is that it does not readily account for the
          cerebral edema and the cystic brain lesions.

          '
      selected_evidence:
        snippet: We theorize that the potential reduction of glutamate and the excess of glutamine were
          a probable cause of the described physiological and structural abnormalities of the central
          nervous system.
        supports: SUPPORT
