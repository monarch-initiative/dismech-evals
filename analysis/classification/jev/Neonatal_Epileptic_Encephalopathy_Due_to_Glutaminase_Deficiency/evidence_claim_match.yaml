        status: EMERGING
        description: 'The alternative model holds that accumulated glutamine is itself the neurotoxic
          species, by the astrocytic-osmolyte route established in hepatic encephalopathy and urea cycle
          defects. In this entity it is supported by elevated cerebrospinal-fluid glutamine, a urea-cycle-like
          amino acid profile with normal ammonia, and brain MRI cystic lesions resembling those of urea
          cycle defects. It accounts for the cerebral edema that the glutamate-deficiency model does not.
          The two models are not mutually exclusive, and the original report invoked both.

          '
      selected_evidence:
        snippet: The biochemical and clinical findings in our patients support a key role for elevated
          glutamine in the neuropathogenesis
