      assertion:
        name: Complete Phosphate-Activated Glutaminase Deficiency
        biological_scale: MOLECULAR
        description: 'Biallelic loss-of-function alleles produce a complete deficiency of phosphate-activated
          glutaminase, the mitochondrial enzyme (EC 3.5.1.2) that hydrolyzes glutamine to glutamate and
          ammonia. This is the primary enzymatic defect. The completeness of the enzymatic block distinguishes
          this entity from the partial/relative deficiency of the repeat-expansion form and is the proximate
          reason for the far more severe, neonatal-onset phenotype.

          '
        molecular_functions:
        - preferred_term: glutaminase activity
          term:
            id: GO:0004359
            label: glutaminase activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: All 3 variants probably lead to a loss of function and thus glutaminase deficiency.
        supports: SUPPORT
