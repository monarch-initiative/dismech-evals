            id: hgnc:4331
            label: GLS
        relationship_type: CAUSATIVE
        notes: 'Biallelic coding loss-of-function lesions in GLS cause this entity. Reported alleles are
          the homozygous frameshift p.(Asp232Glufs*2); compound heterozygous p.(Gln81*) and p.(Arg272Lys);
          and the homozygous missense variants p.(Gly392Arg) (NM_014905.5:c.1174G>A) and p.(Leu344Pro)
          (NM_014905.5:c.1031T>C). GLS encodes phosphate-activated (kidney-type) glutaminase, EC 3.5.1.2.
          Contrast the milder allelic entity Global Developmental Delay, Progressive Ataxia, and Elevated
          Glutamine, caused by a noncoding 5'' untranslated region GCA-repeat expansion producing only
          a partial deficiency.

          '
      selected_evidence:
        snippet: We identified a homozygous frameshift variant p.(Asp232Glufs*2) in GLS in the first family,
          as well as compound heterozygous variants p.(Gln81*) and p.(Arg272Lys) in GLS in the second
          family.
