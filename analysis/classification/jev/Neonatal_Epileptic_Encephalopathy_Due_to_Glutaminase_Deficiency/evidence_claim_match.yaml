            term:
              id: MONDO:0032678
              label: developmental and epileptic encephalopathy, 71
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Organelle Stress and Mitochondrial Bioenergetic Failure
        biological_scale: CELLULAR
        description: 'Patient-derived fibroblasts show a broad cell-biological phenotype beyond the amino
          acid disturbance: nuclear dysmorphism, lysosomal dysfunction with glycogen accumulation, endoplasmic
          reticulum stress, Golgi disruption, and mitochondrial fragmentation, accompanied by impaired
