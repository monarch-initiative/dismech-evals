      assertion_type: Pathophysiology
      assertion:
        name: Glutamine Neurotoxicity
        biological_scale: CELLULAR
        description: 'Accumulated glutamine is held to be directly neurotoxic, by the same route that
          operates in hepatic encephalopathy and urea cycle defects, where glutamine taken up by astrocytes
          acts as an osmolyte and drives astrocytic swelling and cerebral edema. In glutaminase deficiency
          this model is supported by elevated cerebrospinal-fluid glutamine together with brain MRI cystic
          lesions that resemble those of urea cycle defects — and it explains the cerebral edema, which
          a pure glutamate-deficiency model does not.

          '
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: support a key role for elevated glutamine in the neuropathogenesis of both glutaminase-deficient
          patients and individuals with hepatic encephalopathy and/or urea cycle defects
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
