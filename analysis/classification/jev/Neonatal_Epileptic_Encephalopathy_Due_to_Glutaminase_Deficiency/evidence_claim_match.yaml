        biological_scale: MOLECULAR
        description: 'The primary genomic lesion is a biallelic (homozygous or compound heterozygous)
          coding loss-of-function lesion in GLS. Reported alleles include the frameshift p.(Asp232Glufs*2),
          the nonsense p.(Gln81*), the missense p.(Arg272Lys), and the homozygous missense variants p.(Gly392Arg)
          and p.(Leu344Pro). Unlike the noncoding 5'' untranslated region GCA-repeat expansion that causes
          the milder repeat-expansion form, these coding lesions are detectable by exome sequencing.

          '
      selected_evidence:
        snippet: Exome sequencing identified a homozygous, unreported missense variant in GLS
        supports: SUPPORT
