      assertion_type: Discussion
      assertion:
        discussion_id: neonatal-vs-gdpag-lump-split
        kind: INTERPRETATION
        status: RESOLVED
        prompt: Should the neonatal-onset lethal form of GLS glutaminase deficiency be a separate Disease
          entry from the milder repeat-expansion form (Global Developmental Delay, Progressive Ataxia,
          and Elevated Glutamine)?
        rationale: 'Recent literature frames GLS glutaminase deficiency as a single disorder with a broad
          phenotypic spectrum, from early-onset global developmental delay to lethal early neonatal encephalopathy.
          Against that, the two ends carry distinct OMIM and MONDO identities (618328 / MONDO:0032678
          versus 618412 / MONDO:0032733) and mechanistically distinct lesions: biallelic coding loss-of-function
          producing complete enzymatic deficiency (this entry) versus a noncoding 5'' untranslated region
          GCA-repeat expansion producing only a partial deficiency.'
        resolution_note: 'Curator decision: keep split, mirroring the decision already recorded on the
          repeat-expansion entry (raised by ai4c-reviewer on PR #7138). This entry is scoped to the biallelic
          coding loss-of-function form. The shared upstream mechanism is captured by both entries citing
          the same enzymatic chain, and the MONDO grouping class glutaminase deficiency (MONDO:0600001)
          is the natural anchor for a future dismech Grouping over the GLS entities.'
        posed_by: curator
        resolved_date: '2026-08-07T00:00:00Z'
      selected_evidence:
        snippet: Glutaminase deficiency has recently been identified as a novel inherited metabolic disorder
          with a broad phenotypic spectrum ranging from early-onset global developmental delay to lethal
          early neonatal encephalopathy
        supports: SUPPORT
