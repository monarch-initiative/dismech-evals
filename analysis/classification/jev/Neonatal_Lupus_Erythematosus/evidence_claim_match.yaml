      assertion_type: Treatment
      assertion:
        name: Maternal Fluorinated Corticosteroid Therapy
        description: 'Fluorinated corticosteroids, principally dexamethasone, given to the mother so that
          active drug reaches the fetus. This is the therapy behind the entry''s central asymmetry: it
          targets the inflammatory clearance step upstream of fibrosis, so it can act on block that is
          still evolving and cannot act on block that has already been replaced by scar. Modelled here
          because the entry states that conclusion in two places, and a conclusion about a therapy should
          name the therapy. Note the evidence is weak by design of the field rather than by omission -
          the source below describes only anecdotal and retrospective evidence with a trial then underway.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: dexamethasone
            term:
              id: CHEBI:41879
              label: dexamethasone
      selected_evidence:
        snippet: To date, only anecdotal and retrospective evidence guides in utero therapy of CHB. A
          prospective trial is currently underway to evaluate the efficacy of maternal oral dexamethasone
          in treating newly identified first, second or third degree block.
        supports: SUPPORT
