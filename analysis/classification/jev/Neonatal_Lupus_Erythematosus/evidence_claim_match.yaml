      assertion_type: Pathophysiology
      assertion:
        name: Diverted Clearance of Opsonised Apoptotic Cardiocytes to Macrophages
        biological_scale: CELLULAR
        description: Healthy cardiocytes normally phagocytose their apoptotic neighbours silently, a form
          of efferocytosis that produces no inflammation. Bound anti-Ro/La antibody blocks that uptake,
          so clearance is diverted to professional Fc-gamma-receptor-bearing phagocytes. The same apoptotic
          cell is then removed through an inflammatory route instead of a silent one. This diversion,
          rather than the antibody binding itself, is the step that converts a normal developmental process
          into tissue injury.
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: apoptotic cell clearance
          term:
            id: GO:0043277
            label: apoptotic cell clearance
          modifier: DECREASED
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: cardiocytes are capable of phagocytosing autologous apoptotic cardiocytes and anti-Ro/La
          antibodies inhibit this function
        supports: SUPPORT
    origin:
