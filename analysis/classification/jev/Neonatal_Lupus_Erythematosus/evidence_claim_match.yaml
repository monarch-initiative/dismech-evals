      assertion_type: Pathophysiology
      assertion:
        name: Surface Exposure of Ro/La Antigens on Apoptotic Fetal Cardiocytes
        biological_scale: CELLULAR
        description: Ro and La are normally intracellular ribonucleoproteins and are therefore invisible
          to circulating antibody. During the physiological apoptosis that accompanies remodelling of
          the developing atrioventricular conduction system, these antigens translocate to the surface
          of apoptotic cardiocytes, where the maternal antibodies can reach them. This developmentally
          timed unmasking is what confines cardiac injury to a narrow gestational window rather than occurring
          whenever antibody is present.
        cell_types:
        - preferred_term: apoptotic fetal cardiocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
        locations:
        - preferred_term: atrioventricular node
          term:
            id: UBERON:0002352
            label: atrioventricular node
      selected_evidence:
        snippet: Recent studies demonstrate that Ro/La ribonucleoproteins appear on the surface of apoptotic
          fetal cardiocytes and are recognized by their cognate antibodies, promoting an inflammatory
          response.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12139139
      reference_title: 'Congenital heart block in neonatal lupus: the pediatric cardiologist''s perspective.'
