      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: apoptosis_efferocytosis_fibrosis
        hypothesis_label: Diverted efferocytosis driving inflammatory fibrosis of the AV node
        status: CANONICAL
        description: 'The mechanism this entry models in full. Maternal antibody bound to surface-exposed
          Ro/La on apoptotic cardiocytes blocks their silent clearance by neighbouring cardiocytes, diverting
          uptake to Fc-gamma-receptor-bearing macrophages, whose pro-inflammatory and pro-fibrotic secretion
          drives TGF-beta-mediated fibrosis and permanent replacement of conduction tissue. It is treated
          as canonical because it is the account with direct human tissue support: fibrosis, TGF-beta
          expression and macrophage-myofibroblast crosstalk have been observed in fetuses dying with congenital
          heart block.'
      selected_evidence:
        snippet: The identification of exaggerated apoptosis, macrophage/myfibroblast crosstalk, TGF beta
          expression, and extensive fibrosis in the conducting system and in some cases surrounding myocardium
          in fetuses dying with CHB, provide in vivo support for several parallel lines of in vitro investigation.
        supports: SUPPORT
    origin:
