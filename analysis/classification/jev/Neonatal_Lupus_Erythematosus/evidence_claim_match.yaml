        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: direct_calcium_channel_blockade
        hypothesis_label: Direct antibody interference with cardiac calcium channels
        status: ALTERNATIVE
        description: 'A complementary account in which anti-Ro/La antibodies cross-react directly with
          cardiac L-type and T-type calcium channels, disturbing transmembrane calcium signalling in conduction
          tissue and impairing conduction without requiring inflammation. This is not a rival that would
          make the fibrosis account wrong: the two operate on different timescales, and a direct channel
          effect is the more natural explanation for the conduction abnormalities that are reversible,
          while fibrosis explains the ones that are not. It is recorded as ALTERNATIVE rather than modelled
          as its own node chain because no node in this entry currently rests on it, and inventing one
          would assert more than the cited sources do.'
      selected_evidence:
        snippet: These antibodies may induce a myocarditis, or interact directly with calcium channel
          proteins with disturbance of transmembrane signaling at the level of the conduction tissue,
          or interfere with apoptosis.
        supports: SUPPORT
    origin:
