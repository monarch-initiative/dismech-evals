      assertion_type: Pathophysiology
      assertion:
        name: Irreversible Complete Atrioventricular Block
        biological_scale: ORGANISM
        description: 'Fibrous replacement of the atrioventricular node produces third-degree block: atrial
          and ventricular activity become fully dissociated and ventricular rate falls to a junctional
          or ventricular escape rhythm. Most survivors require permanent pacing. Injury may extend beyond
          the node to the myocardium and endocardium, which is the origin of the late dilated cardiomyopathy
          and endocardial fibroelastosis seen in some survivors whose in-utero ventricular function was
          normal.'
      selected_evidence:
        snippet: The spectrum of conduction abnormalities includes second and third-degree block, but
          injury can extend to the myocardium and endocardium, in rare cases without AV nodal dysfunction.
        supports: SUPPORT
