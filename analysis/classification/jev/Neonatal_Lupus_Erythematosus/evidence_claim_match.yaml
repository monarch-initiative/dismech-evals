      assertion_type: Pathophysiology
      assertion:
        name: Maternal Anti-Ro/La IgG Transfer Across the Placenta
        biological_scale: ORGANISM
        description: Maternal IgG autoantibodies against the Ro/SSA (Ro52/TRIM21 and Ro60) and La/SSB
          ribonucleoproteins, or against U1-RNP, cross the placenta and enter the fetal circulation. Because
          placental IgG transport rises through the second and third trimesters, fetal antibody concentration
          climbs across exactly the gestational window in which the conduction system is vulnerable. This
          node is the disease's sole initiating event; everything downstream is a consequence of antibody
          presence in fetal tissue.
      selected_evidence:
        snippet: Neonatal lupus erythematosus is an autoimmune disease acquired during fetal life as a
          result of transplacental passage of maternal anti-Sjögren's-syndrome-related antigen A (anti-SSA/Ro),
          anti-Sjögren's-syndrome-related antigen B (anti-SSB/La) or anti-U1 ribonucleoprotein (anti-U1-RNP)
          antinuclear autoantibodies.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33470961
      reference_title: Neonatal lupus erythematosus - practical guidelines.
