      assertion_type: Pathophysiology
      assertion:
        name: Antibody-Mediated Injury of Skin, Liver and Blood Cells
        biological_scale: ORGANISM
        description: 'In parallel with the cardiac lesion and by a separate, reversible route, maternal
          antibody produces annular photosensitive skin lesions, cholestatic or transaminitic liver involvement,
          and peripheral cytopenias. These manifestations share the cardiac trigger but not its outcome:
          no fibrotic replacement occurs, so all resolve as maternal IgG is catabolised over the first
          6-12 months of life. Modelling them as a distinct node rather than as downstream of the cardiac
          chain is deliberate, since they occur in infants with entirely normal conduction.'
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
      selected_evidence:
        snippet: Clinical manifestations include skin lesions, congenital heart block, hepatobiliary involvement
          and cytopenias. Most of the disorders disappear spontaneously after clearance of maternal antibodies.
          Cardiac symptoms, however, are not self-resolving and often pacemaker implantation is required.
        supports: SUPPORT
