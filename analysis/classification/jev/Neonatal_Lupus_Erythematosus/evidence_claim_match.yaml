      assertion_type: Inheritance
      assertion:
        name: Not inherited (passively acquired)
        description: Neonatal lupus is not transmitted as a Mendelian trait. The determinant of risk is
          the mother's antibody status, which is why recurrence in a subsequent pregnancy is high (of
          the order of 15-20% after an affected child) while the general population risk is negligible.
          That recurrence figure is often misread as a segregation ratio; it is not one, and no inheritance_term
          is bound here because the HPO mode-of-inheritance subtree has no value that correctly describes
          maternal-antibody transmission.
      selected_evidence:
        snippet: CHB occurs in approximately 1-5% of pregnancies in mothers with anti-Ro/La antibodies,
          independent of the mother's disease status, and in approximately 15-20% of pregnancies following
          the birth of a child with NLS.
        supports: SUPPORT
    origin:
