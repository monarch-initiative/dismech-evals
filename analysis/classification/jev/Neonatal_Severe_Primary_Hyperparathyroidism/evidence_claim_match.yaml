        display_name: Biallelic (homozygous or compound heterozygous) NSHPT
        description: The classic and ClinGen-curated form. In a pooled analysis of 57 published cases,
          calcium and PTH were higher in homozygotes than in heterozygotes, and serum calcium above 4.5
          mmol/L occurred only in homozygotes, which the authors propose as a biomarker of biallelic dosage
          that supports early total parathyroidectomy.
      selected_evidence:
        snippet: Extreme hypercalcemia (above 4.5 mM; normal 2.2-2.6 mM) is a robust biomarker, occurring
          only in homozygotes (83% of that pairing).
