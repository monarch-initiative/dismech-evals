        context: []
      assertion_type: Subtype
      assertion:
        name: Monoallelic NSHPT
        display_name: Monoallelic (heterozygous, de novo or paternally inherited) neonatal hyperparathyroidism
        description: 'Reported in neonates carrying one inactivating CASR allele, usually de novo or paternally
          inherited, born to a normocalcaemic mother. Two mechanisms are proposed: a dominant-negative
          effect of the mutant receptor on the wild-type one, and fetal secondary hyperparathyroidism
          because the fetus reads the normal maternal calcium as low. These presentations are generally
          milder than biallelic disease and often improve over the first months. Whether they belong to
          this disease is contested: ClinGen excludes them from its AR curation because a dominant-negative
          mechanism has not been proven and a second variant in trans cannot be excluded.'
      selected_evidence:
        snippet: Homozygous and heterozygous NSHPT are 2 among a spectrum of 9 genotype/phenotype pairings
          relating to CASRs and NSHPT.
        supports: SUPPORT
    origin:
