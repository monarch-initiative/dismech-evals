      selected_evidence:
        snippet: Resistant hypertension (RH) is defined as above-goal elevated blood pressure (BP) in
          a patient despite the concurrent use of 3 antihypertensive drug classes...evaluation includes
          identification of contributing lifestyle issues, detection of drugs interfering with antihypertensive
          medication effectiveness, screening for secondary hypertension, and assessment of target organ
          damage. Management of RH includes maximization of lifestyle interventions, use of long-acting
          thiazide-like diuretics (chlorthalidone or indapamide), addition of a mineralocorticoid receptor
          antagonist (spironolactone or eplerenone), and, if BP remains elevated, stepwise addition of
          antihypertensive drugs with complementary mechanisms of action to lower BP.
        supports: NO_EVIDENCE
