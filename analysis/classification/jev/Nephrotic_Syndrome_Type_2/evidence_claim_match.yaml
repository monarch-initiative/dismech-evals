      assertion:
        name: Biallelic NPHS2 Loss of Function
        biological_scale: MOLECULAR
        description: Homozygous or compound heterozygous NPHS2 variants (nonsense, frameshift and missense)
          segregate with the disease. NPHS2 is expressed almost exclusively in glomerular podocytes. The
          p.Arg229Gln allele is an exception to plain recessive behaviour and is described under genetic.
          Podocin is a PHB-domain protein that binds cholesterol at the inner leaflet of the plasma membrane
          and, through it, regulates associated TRPC channel complexes; loss of functional podocin at
          the membrane removes that activity. Whether individual missense alleles abolish cholesterol
          binding itself has not been tested; the DECREASED modifier is inferred from the absence of functional
          podocin at the membrane, not measured.
        molecular_functions:
        - preferred_term: cholesterol binding
          modifier: DECREASED
          term:
            id: GO:0015485
            label: cholesterol binding
