        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Podocin Misfolding and Endoplasmic Reticulum Retention
        biological_scale: CELLULAR
        description: Mutant podocin is retained in the endoplasmic reticulum (p.Arg138Gln, p.Pro118Leu)
          or Golgi (p.Arg168His, p.Arg291Trp) and is present at reduced protein levels without reduced
          transcription. In iPSC-derived kidney organoids this mistrafficking is allele-specific, and
          all tested variants caused podocyte apoptosis that was not linked to ER stress. Earlier-onset
          disease is associated with alleles retained in the ER. Misfolded p.Arg138Gln podocin is held
          back by binding keratin 8.
        cell_types:
        - preferred_term: podocyte
          term:
            id: CL:0000653
            label: podocyte
        biological_processes:
        - preferred_term: protein localization to plasma membrane
          modifier: DECREASED
          term:
            id: GO:0072659
            label: protein localization to plasma membrane
      selected_evidence:
        snippet: we found that podocin mutants retained in the endoplasmic reticulum are associated with
          earlier onset of the disease than those correctly targeted to the cell membrane.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
