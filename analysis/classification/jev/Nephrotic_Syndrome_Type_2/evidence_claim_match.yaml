        gene_term:
          preferred_term: NPHS2
          term:
            id: hgnc:13394
            label: NPHS2
        relationship_type: CAUSATIVE
        notes: Biallelic germline NPHS2 variants are the cause. Mutation detection was 43% in familial
          autosomal recessive SRNS and 10.5% in sporadic SRNS in a French series of 272 families.
        variants:
        - name: c.413G>A p.Arg138Gln
          description: The most frequent podocin variant in European children. The protein misfolds and
            is retained in the ER through binding to keratin 8; it is associated with early onset.
        - name: c.686G>A p.Arg229Gln
          description: A common allele that is pathogenic only in trans to particular 3' NPHS2 variants,
            which exert a dominant-negative effect on it through altered heterodimerization and mislocalization;
            with other alleles, or homozygous, it does not cause the disease. Transmission ratios in carrier
            couples therefore depart from plain recessive expectations.
      selected_evidence:
        snippet: A causative gene for this disease, NPHS2, was mapped to 1q25-31 and we report here its
          identification by positional cloning.
        supports: SUPPORT
