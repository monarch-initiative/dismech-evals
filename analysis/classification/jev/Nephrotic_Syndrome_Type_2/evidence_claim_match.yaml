            label: slit diaphragm
        - preferred_term: membrane raft
          term:
            id: GO:0045121
            label: membrane raft
      selected_evidence:
        snippet: Here we show, by immunoelectron microscopy, that podocin localizes to the podocyte foot
          process membrane, at the insertion site of the slit diaphragm. Podocin accumulates in an oligomeric
          form in lipid rafts of the slit diaphragm.
        supports: SUPPORT
