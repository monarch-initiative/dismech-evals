            preferred_term: NPHS2
            term:
              id: hgnc:13394
              label: NPHS2
        cell_types:
        - preferred_term: podocyte
          term:
            id: CL:0000653
            label: podocyte
      selected_evidence:
        snippet: We found ten different NPHS2 mutations, comprising nonsense, frameshift and missense
          mutations, to segregate with the disease, demonstrating a crucial role for podocin in the function
          of the glomerular filtration barrier.
        supports: SUPPORT
