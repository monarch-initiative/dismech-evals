        description: Wild-type podocin sits at the insertion of the slit diaphragm in the foot-process
          membrane, forms high-order oligomers in lipid rafts and binds CD2AP and nephrin through its
          C-terminal domain. Raft association of podocin is a prerequisite for recruiting nephrin into
          rafts, which facilitates nephrin signalling. Mutant podocin fails to do this, either by not
          reaching the membrane or by failing to associate with rafts.
        cell_types:
