        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: plce1_immunosuppression_response
        prompt: Is PLCE1-related nephrotic syndrome genuinely more responsive to glucocorticoids or calcineurin
          inhibitors than other monogenic SRNS, and should a trial of therapy be offered?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - treatments#Calcineurin Inhibitor Trial
        - treatments#Glucocorticoids
        - phenotypes#Steroid-Resistant Nephrotic Syndrome
        rationale: 'The founding report described two treated patients who remitted, and the disease was
          presented as the first molecular cause of nephrotic syndrome that may resolve after therapy;
          a ciclosporin responder was reported soon after. These are a few cases, reported by the discovering
          group, without a denominator of treated non-responders. Other series point the other way: a
          genetically confirmed PLCE1 infant in a 20-year UK series did not remit, and current guidance
          advises avoiding ineffective steroids and generally withholding calcineurin inhibitors once
          genetic SRNS is confirmed, while leaving the decision to the individual case. Calcineurin inhibitors
          also have an antiproteinuric effect on podocytes independent of immunity, which could explain
          a response without implying immune pathogenesis. The question decides whether a PLCE1 result
          should end or start an immunosuppression trial, and no study has been powered to answer it.'
        proposed_experiments:
        - experiment_id: exp_plce1_treatment_registry
          name: Registry analysis of immunosuppression response in PLCE1 SRNS
          description: Query international SRNS registries for every genetically confirmed PLCE1 patient
            exposed to steroids or calcineurin inhibitors, record complete, partial or no remission against
            matched NPHS2 and WT1 patients, and test whether the remission rate differs. Stratify by variant
            class and histology.
      selected_evidence:
        snippet: Notably, two other affected individuals responded to therapy, making this the first report
          of a molecular cause of nephrotic syndrome that may resolve after therapy.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
