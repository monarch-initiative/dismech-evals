        notes: 'Biallelic germline loss-of-function variants. Truncating alleles predominate; missense
          alleles in the catalytic domain also occur. No clear genotype-histology correlation, though
          specific variants correlated with onset age in a 1,783-family SRNS study. Penetrance is incomplete:
          unaffected homozygous relatives are documented in several families. A homozygous intragenic
          deletion found only by CNV analysis shows that exome-negative cases can carry PLCE1 structural
          variants.'
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
