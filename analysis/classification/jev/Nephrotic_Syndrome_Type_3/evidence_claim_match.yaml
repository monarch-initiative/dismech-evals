      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: plce1_podocyte_developmental_arrest
        hypothesis_label: PLCE1 Loss / Podocyte Developmental Arrest Model
        status: CANONICAL
        description: Loss of PLCepsilon1 in podocytes disrupts signalling that podocytes need to mature,
          glomerular development arrests, and the immature glomeruli present as diffuse mesangial sclerosis
          with a leaky filtration barrier. Which signalling branch carries the developmental effect is
          not established (see discussion plce1_signalling_branch_responsible).
      selected_evidence:
        snippet: we found PLCepsilon1 expression in developing and mature glomerular podocytes and showed
          that DMS represents an arrest of normal glomerular development
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17086182
      reference_title: Positional cloning uncovers mutations in PLCE1 responsible for a nephrotic syndrome
        variant that may be reversible.
      evidence_source: HUMAN_CLINICAL
      explanation: The founding study's reading of the lesion as developmental arrest.
