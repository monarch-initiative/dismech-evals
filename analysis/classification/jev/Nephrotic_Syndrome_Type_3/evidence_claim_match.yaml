      assertion_type: Discussion
      assertion:
        discussion_id: plce1_dms_fsgs_spectrum
        prompt: What determines whether a PLCE1 patient shows diffuse mesangial sclerosis or focal segmental
          glomerulosclerosis, given that variant class does not predict it and the reported DMS:FSGS ratio
          has shifted across cohorts?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - phenotypes#Diffuse Mesangial Sclerosis
        - phenotypes#Focal Segmental Glomerulosclerosis
        rationale: 'Early reports tied PLCE1 almost entirely to diffuse mesangial sclerosis, with FSGS
          as a rarer, later-onset variant seen in one missense family. The discovering cohort found PLCE1
          in a third of DMS cases but only 8% of NPHS2-negative FSGS, and no genotype correlation: truncating
          and missense alleles gave either histology and similar outcomes. A 2025 literature review of
          biopsied patients instead found FSGS in 16 of 28, which is the opposite skew. Several things
          could reconcile this: the two lesions may be a time course, DMS in the youngest kidneys and
          FSGS where disease declares later; biopsy timing and the shift from DMS-ascertained to SRNS-ascertained
          cohorts may select different lesions; or a modifier may set the histology as it seems to set
          penetrance. Because histology does not change management, the question is mechanistic rather
          than clinical, but it bears on whether DMS is specifically the developmental-arrest lesion the
          canonical model names.'
      selected_evidence:
        snippet: No clear genotype-phenotype correlation was observed, with either truncating or missense
          mutations detected in both DMS and FSGS, and leading to a similar renal evolution.
        supports: SUPPORT
