  b2ba5b06f1eb0128696bc082e3d5690db4ae230e82d0befbc98c3aeafd9f9efe:
    claim:
      about:
        disease:
          name: Nephrotic Syndrome Type 3
          disease_term:
            preferred_term: nephrotic syndrome, type 3
            term:
              id: MONDO:0012546
              label: nephrotic syndrome, type 3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: plce1_incomplete_penetrance
        prompt: Why do some individuals homozygous for a familial PLCE1 truncating variant stay healthy,
          and what second factor converts PLCE1 deficiency into disease?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#PLCE1
        - pathophysiology#Biallelic PLCE1 Loss of Function
        - pathophysiology#Hypertensive Glomerular Stress
        - mechanistic_hypotheses#plce1_hemodynamic_second_hit
        rationale: 'Nonpenetrance is documented in at least four families: an asymptomatic homozygous
          father in a Pakistani kindred carrying a frameshift in exon 3, and three unaffected unrelated
          homozygotes in a French-led worldwide cohort. This is unusual for a recessive podocytopathy
          and has two consequences. Mechanistically, it means PLCE1 loss is necessary but not sufficient,
          so the canonical developmental-arrest model is incomplete. Clinically, a negative family history
          or a healthy homozygous sibling cannot be used to dismiss a variant, and recurrence counselling
          has to allow for reduced penetrance. Candidate modifiers have been screened without result (16
          other PLC genes, BRAF, IQGAP1 and NPHS1 in the 2010 cohort). The mouse data offer one concrete
          candidate, a hemodynamic second hit, but no human study has compared blood pressure, nephron
          endowment or birth weight between affected and unaffected homozygotes.'
        proposed_experiments:
        - experiment_id: exp_plce1_nonpenetrant_homozygote_comparison
          name: Affected versus unaffected PLCE1 homozygote comparison
          description: Assemble the published and registry families with discordant homozygotes. Compare
            genome sequences for second-site variants in SRNS and podocyte genes, and compare blood pressure
            history, birth weight and kidney size as proxies for the hemodynamic second hit. A clear modifier
            would support a two-locus model; a blood-pressure difference would support the mouse-derived
            model.
          would_support:
          - mechanistic_hypotheses#plce1_hemodynamic_second_hit
      selected_evidence:
        snippet: We conclude this nonpenetrance may be due to compensatory mutations at a second locus
          and that mutation within PLCE1 is not always sufficient to cause diffuse mesangial sclerosis.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19037252
      reference_title: Mutations in phospholipase C epsilon 1 are not sufficient to cause diffuse mesangial
        sclerosis.
      evidence_source: HUMAN_CLINICAL
      explanation: The first nonpenetrant homozygote and the two-locus proposal.
