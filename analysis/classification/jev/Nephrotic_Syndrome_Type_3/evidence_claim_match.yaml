        hypothesis_group_id: plce1_hemodynamic_second_hit
        hypothesis_label: PLCE1 Deficiency as Susceptibility to a Hemodynamic Second Hit
        status: EMERGING
        description: PLCE1 deficiency may not suffice on its own; a second stressor such as hypertension
          or hyperfiltration may be needed for podocyte loss and sclerosis. Supported in mice, where Plce1-deficient
          glomeruli are normal at baseline but sclerose after induced hypertension. Untested in patients.
      selected_evidence:
        snippet: Our data demonstrate that Plce1 deficiency in mice predisposes to glomerular damage secondary
          to hypertensive insults.
        supports: SUPPORT
