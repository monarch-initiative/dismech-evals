        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: plce1_mouse_baseline_mismatch
        prompt: Why do global Plce1-deficient mice have normal glomeruli at baseline when biallelic loss
          in humans causes infantile nephrotic syndrome?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - animal_models#Mouse
        - pathophysiology#Arrested Glomerular Development
        rationale: The mouse model exists and reproduces the human lesion only under an experimental second
          hit, so its fidelity to the spontaneous human disease is the open question rather than the absence
          of a model. Three readings fit the data. Mice may have more redundancy in podocyte phosphoinositide
          or Rho-GTPase signalling. Human glomerulogenesis may depend more on PLCepsilon1 during a developmental
          window the mouse passes through differently. Or the mouse resembles the nonpenetrant human homozygotes,
          in which case the mismatch and the penetrance gap are one problem. The zebrafish morphant does
          show edema, but morpholino phenotypes in this field often fail to reproduce in stable mutants.
          ClinGen counts the mouse data as supportive experimental evidence despite the normal baseline.
        proposed_experiments:
        - experiment_id: exp_plce1_human_kidney_organoid
          name: PLCE1-null human kidney organoids
          description: Generate isogenic PLCE1-null and patient-allele iPSC lines, differentiate to kidney
            organoids, and score podocyte maturation markers, foot-process formation and glomerular size
            against isogenic controls. A defect in human organoids with no defect in mouse would localise
            the mismatch to species biology rather than to a missing in vivo stressor.
      selected_evidence:
        snippet: Interestingly, PLCE1 knockout mice exhibited normal kidney structure and function
        supports: SUPPORT
