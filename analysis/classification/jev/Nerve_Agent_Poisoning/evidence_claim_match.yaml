      assertion_type: DifferentialDiagnosis
      assertion:
        name: Organophosphate (pesticide) poisoning
        disease_term:
          preferred_term: organophosphate poisoning
          term:
            id: MONDO:0800386
            label: organophosphate poisoning
        distinguishing_features:
        - 'Both are organophosphorus poisonings acting by acetylcholinesterase inhibition and share the
          cholinergic toxidrome, so they are not distinguished by a different mechanism. What separates
          them is pharmacodynamic: nerve agents are military-grade compounds of far greater potency, and
          their inhibited enzyme can age to an oxime-refractory state that collapses the therapeutic window
          for reactivators. The sibling entry Organophosphate_Poisoning models insecticidal organophosphorus
          poisoning, which already represents nerve-agent exposure as one environmental route into the
          same pathway; whether these should remain separate Disease entries, become a has_subtypes stratum,
          or be joined by a covering Grouping is a scope decision for a maintainer.'
      selected_evidence:
        snippet: The organic phosphorous compounds (OPC) include both the military grade nerve agents
          and the organic phosphorous pesticides.
        supports: SUPPORT
        directness: DIRECT
    origin:
