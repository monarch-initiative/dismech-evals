        biological_scale: MOLECULAR
        description: The phosphylated enzyme loses an alkyl group ("aging"), converting the inhibited
          AChE into an oxime-refractory form; once aging has occurred the inhibition is permanent. The
          aging rate is agent-specific, and this irreversibility is what limits the window during which
          oxime reactivators can work — the feature that most sharply separates nerve agents from most
          insecticidal organophosphates.
      selected_evidence:
        snippet: the covalent bond between the active site and the OP nerve agent stabilizes by removal
          of an alkyl group, a process called aging
        supports: SUPPORT
