        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Multifocal Inflammatory Attack on Peripheral Nerve
        description: 'Brachial plexus biopsy in affected patients shows florid multifocal mononuclear
          inflammatory cell infiltrates, which is the direct histopathological basis for calling the disorder
          immune-mediated. The infiltrate in the constricted segments is composed of CD8-positive T lymphocytes,
          and the lesion involves the perineurium with marked edema. "Multifocal" is doing real work here:
          the attack picks out individual nerves and even individual fascicles, which is why the resulting
          weakness is patchy rather than following a plexus territory.'
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: CD8-positive T lymphocyte
