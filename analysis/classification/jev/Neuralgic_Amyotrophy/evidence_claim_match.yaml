      assertion_type: Pathophysiology
      assertion:
        name: Reduced Nerve Endurance and Maladaptive Motor Pattern
        description: 'The distinctive claim of the modern literature on this disease: persisting symptoms
          are caused mainly by a combination of decreased endurance in the affected nerves and an altered
          posture and movement pattern, and not by the axonal damage itself. This is why the long-term
          treatment target is scapular coordination and energy distribution rather than nerve regeneration,
          and why rehabilitation here is disease-modifying rather than supportive.'
        biological_scale: ORGANISM
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: Long-term consequences are the rule, and persisting symptoms are mainly caused by a combination
          of decreased endurance in the affected nerves and an altered posture and movement pattern, not
          by the axonal damage itself.
        supports: SUPPORT
