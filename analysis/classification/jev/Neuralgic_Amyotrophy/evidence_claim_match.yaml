  bbd6bb54653cedecfe07b61b19afb3d91ab7be5451f3fa27ab478c5645481594:
    claim:
      about:
        disease:
          name: Neuralgic Amyotrophy
          disease_term:
            preferred_term: neuralgic amyotrophy
            term:
              id: MONDO:0017362
              label: neuralgic amyotrophy
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Paresis phase
        notes: As the initial pain subsides, patchy flaccid paresis and amyotrophy appear in the affected
          nerve distributions, most often upper and middle trunk.
      selected_evidence:
        snippet: We investigated the symptoms, course and prognosis of neuralgic amyotrophy (NA) in a
          large group of patients with idiopathic neuralgic amyotrophy (INA, n = 199) and hereditary neuralgic
          amyotrophy (HNA, n = 47) to gain more insight into the broad clinical spectrum of the disorder.
          ... Generally, the course of the pain manifests itself in three consecutive phases with an initial
          severe, continuous pain lasting for approximately 4 weeks on average. Sensory involvement was
          quite common and found in 78.4% of patients but was clinically less impairing than the initial
          pain and subsequent paresis. As a typically patchy disorder NA can affect almost any nerve in
          the brachial plexus, although damage in the upper and middle trunk distribution with involvement
          of the long thoracic and/or suprascapular nerve occurred most frequently (71.1%).
        supports: SUPPORT
    origin:
