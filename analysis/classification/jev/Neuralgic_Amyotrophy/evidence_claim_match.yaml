      assertion_type: Pathophysiology
      assertion:
        name: Focal Nerve Constriction and Torsion
        description: In a subset of patients the inflamed, swollen nerve develops a very focal constriction,
          with thickening proximal and distal to it, or frank torsion of the nerve or some of its fascicles.
          Ultrasound findings have been grouped as nerve swelling, swelling with incomplete constriction,
          swelling with complete constriction, and fascicular entwinement, which has been read as a continuum.
          The clinical importance is that these lesions do badly without surgery and well with it, so
          recognising them changes management.
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: the hourglass constriction, which is characterized by a very focal constriction of a
          nerve, or part of it, usually associated with nerve thickening proximally and distally to the
          constriction
        supports: SUPPORT
