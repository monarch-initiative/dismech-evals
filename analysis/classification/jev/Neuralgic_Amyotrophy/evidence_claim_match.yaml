      assertion_type: Environmental
      assertion:
        name: Antecedent infection or vaccination
        description: 'The general immune trigger the first pathophysiology node depends on. A prospective
          matched case-control study confirmed a microbiologically documented infectious trigger in 26.3%
          of patients and considered COVID-19 vaccination a potential trigger in a further 12.3%, giving
          a confirmed immune trigger in 38.6% overall. An acute viral infection was associated with bilateral
          brachial plexus involvement, which is the clinically useful part: the trigger is not just antecedent,
          it shapes the attack.

          This is the better-evidenced and more general trigger claim; the hepatitis E entry below is
          a specific, clinically distinctive instance of it rather than an alternative to it. Note that
          a confirmed trigger in 38.6% means the majority of attacks still have none identified, so this
          is a contributing precipitant in a susceptible individual and not a necessary cause.'
        exposure_term:
          preferred_term: antecedent infection or vaccination
          term:
            id: ECTO:3000001
            label: exposure to virus
      selected_evidence:
        snippet: NA onset was preceded by a symptomatic infectious trigger confirmed by microbiological
          tests in 15/57 (26.3%) patients.
        supports: SUPPORT
