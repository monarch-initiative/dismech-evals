      assertion_type: Diagnosis
      assertion:
        name: Hepatitis E serology in phrenic or diaphragmatic involvement
        description: 'Test for HEV IgM and IgG with serum HEV RNA when the phrenic nerve or diaphragm
          is involved. This is the action that follows from the observation curated in the environmental
          section: the reason HEV-associated cases are missed is that liver enzymes are normal by the
          time the neuropathy presents, so nothing prompts the serology unless it is asked for on the
          neurological picture alone.

          The recommendation is stated at a lower level of confidence than the imaging above. It rests
          on two small uncontrolled series, plus the case-control study''s suggestion to test acute-phase
          patients where there is bilateral involvement or hepatitis. No study has evaluated this as a
          diagnostic strategy, so its yield is unknown.'
      selected_evidence:
        snippet: Therefore, even in diaphragmatic dysfunction without NA symptoms and causative damaging
          event, HEV infection should be considered, as it may represent a subform of NA with only phrenic
          nerve involvement.
        supports: SUPPORT
