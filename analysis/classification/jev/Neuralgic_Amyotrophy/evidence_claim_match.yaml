      assertion:
        name: Multifactorial Susceptibility to Brachial Plexus Immune Attack
        description: Neuralgic amyotrophy is not attributed to a single initiating lesion. Genetic, biomechanical
          and immunologic factors are all implicated, and it is this multifactorial etiology - rather
          than a lack of study - that limits the ability to predict or prevent the recurrences that are
          common in this disease. The biomechanical component is what is thought to localise an otherwise
          systemic immune event to particular nerves.
        biological_scale: ORGANISM
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: Recurrences are common, yet the proposed multifactorial etiology, which includes genetic,
          biomechanical, and immunologic factors, limits our capacity to predict or prevent them.
        supports: SUPPORT
