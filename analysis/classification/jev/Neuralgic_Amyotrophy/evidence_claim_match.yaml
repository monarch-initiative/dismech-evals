              label: neuralgic amyotrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hourglass_constriction_same_disease_or_not
        kind: CONTROVERSY
        prompt: Are neuralgic amyotrophy, hourglass nerve constriction and nerve torsion different evolutions
          of one pathological process, or distinct entities that resemble each other?
        rationale: 'This is stated as an open question in the review literature rather than a settled
          point, and it has direct consequences for this entry''s structure. If they are one process,
          the constriction node belongs downstream of the inflammatory attack, which is how the pathograph
          currently draws it, and the ultrasound categories - swelling, swelling with incomplete constriction,
          swelling with complete constriction, fascicular entwinement - are stages of a continuum. If
          they are separate entities, that edge is wrong and the constriction cases are a different disease
          that happens to look similar. The node carries mechanism_confidence: PROVISIONAL for this reason
          - causal_link_type records directness, not confidence, so it is not the slot that expresses
          this. The practical stakes are not academic: the constriction subgroup has a poor prognosis
          without surgery and a good one with it, so which patients are considered to have "neuralgic
          amyotrophy" determines who gets referred.'
        attaches_to:
        - pathophysiology#Focal Nerve Constriction and Torsion
        - pathophysiology#Multifocal Inflammatory Attack on Peripheral Nerve
      selected_evidence:
        snippet: The pathophysiology of neuralgic amyotrophy, hourglass constriction and nerve torsion
          is still poorly understood, and a generic role of inflammation is proposed for all these conditions.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
