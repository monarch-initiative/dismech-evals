              from, and asks what stops it. Frog AVNA cells differentiate under transient Ascl1 expression;
              in neuroblastoma cells Ascl1 is instead persistently expressed and multiply phosphorylated.
              Introducing that phospho-state into the frog cells blocks their differentiation, and CDK
              or MYCN overexpression blocks it too — but not when Ascl1 cannot be phosphorylated, which
              places phosphorylation downstream of both. The model tests the differentiation-arrest hypothesis
              in a normal developmental context; it does not produce tumours and so says nothing about
              transformation, growth, or metastasis.
