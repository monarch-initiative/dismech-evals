        biological_scale: CELLULAR
        description: TM2D3 binds Notch1 outside its ligand-binding domain and increases Notch1 at the
          cell surface, which is a prerequisite for ligand-induced endocytosis and activating cleavage.
          Tm2d3-null mouse embryonic fibroblasts show less full-length and S1-processed Notch1 and less
          surface Notch1 and Notch2. In Drosophila, loss of the orthologue almondex impairs endocytosis
          of the Notch extracellular domain and Delta in early embryos. None of this has been examined
          in patient cells.
        cell_types:
        - preferred_term: embryonic fibroblast
