        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TM2D3 Biallelic Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic TM2D3 variants, including the recurrent missense allele c.503G>A (p.Gly168Asp).
          TM2D3 is a transmembrane protein expressed in many tissues and most abundant in the central
          nervous system, and in SNB75 cells it localizes to the endoplasmic reticulum. Loss of function
          is inferred from the similarity of patient fibroblasts to TM2D3-knockout cells. The missense
          alleles may be hypomorphic rather than null; that distinction is not resolved in the abstract.

          The bound molecular function, Notch binding, is the only activity shown experimentally for TM2D3:
          the wild-type protein physically associates with Notch1. That the disease alleles reduce it
          is inferred from the node, not measured. GO''s other function annotation for TM2D3, G protein-coupled
          receptor activity, rests on phylogenetic inference alone and is not bound.'
        genes:
        - preferred_term: TM2D3
          term:
            id: hgnc:24128
            label: TM2D3
        genetic_context:
          genes:
          - preferred_term: TM2D3
            term:
              id: hgnc:24128
              label: TM2D3
          allele_type: missense, nonsense, frameshift and intragenic deletion alleles in trans
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: Notch1 binding
          modifier: DECREASED
          term:
            id: GO:0005112
            label: Notch binding
        cellular_components:
        - preferred_term: endoplasmic reticulum
          term:
            id: GO:0005783
            label: endoplasmic reticulum
      selected_evidence:
        snippet: Here, by using chemical and genetically encoded probes in SNB75 cells, we show that TM2D3
          is an endoplasmic reticulum (ER) protein.
        supports: SUPPORT
    origin:
