      assertion_type: Discussion
      assertion:
        discussion_id: condca-human-neuropathology-spectrum
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How representative is the first human autopsy of the regional pathology across AGTPBP1
          genotypes and ages?
        attaches_to:
        - pathophysiology#Purkinje Neuron Degeneration
        rationale: The 2018 discovery series lacked postmortem examinations. The 2026 first autopsy now
          directly establishes Purkinje, granular and anterior horn-cell loss in one infant. It does not
          establish universal lobule X sparing, the complete mouse death pathway, or the same regional
          pathology in patients without cerebellar atrophy or lower motor-neuron signs. The remaining
          uncertainty concerns distribution and representativeness, not whether human Purkinje loss has
          ever been observed.
        proposed_experiments:
        - experiment_id: exp_condca_neuropathology
          experiment_design: DESCRIPTIVE_PROFILING
          name: Neuropathological examination of CONDCA cerebellum
          description: Compare additional genetically confirmed postmortem cases across ages and genotypes,
            quantifying regional neuronal loss and tubulin glutamylation against controls.
        - experiment_id: exp_condca_quantitative_mri
          name: Purkinje-layer-sensitive quantitative cerebellar MRI
          description: High-resolution cerebellar imaging in CONDCA patients to test whether the volume
            loss follows the lobular pattern of the mouse (near-complete loss with relative sparing of
            lobule X) rather than a diffuse pattern.
      selected_evidence:
        snippet: The cerebellum showed normal-sized folia with a marked loss of Purkinje cells. There
          was a prominence of Bergmann glial cells.
        supports: SUPPORT
