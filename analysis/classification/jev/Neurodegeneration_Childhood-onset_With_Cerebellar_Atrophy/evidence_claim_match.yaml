        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: condca-expanded-case-phenotypes
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which unusual findings recur in genetically secure cases?
        attaches_to:
        - phenotypes#Abnormal Eye Movements
        - phenotypes#Oculomotor Apraxia
        rationale: The 2024 likely-pathogenic p.Thr884Pro patient had coarse facies, narrow forehead,
          thick eyebrows, broad bulbous nose, short philtrum, thick lips and large ears; arachnodactyly,
          interphalangeal hyperextensibility, low-inserted thumbs, toe camptodactyly, prominent heels,
          scoliosis and joint contractures were also described. Table 2 additionally records brisk reflexes,
          hypometric saccades and poor eye contact, and ERG showed retinal dysfunction. The extensor plantar
          response in the 4.5-month-old autopsy case is not separately treated as a pathological Babinski
          sign because that response can be physiological at this age. These are preserved as a case expansion
          whose individual causal attribution and recurrence are unresolved. The second AGTPBP1 patient
          carried p.Thr512Ala classified as a VUS and had strabismus, oculomotor apraxia, optic-nerve
          dysfunction and contractures; that case is not pooled as equally established genetic evidence.
          Mouse retinal degeneration is not substituted for these human observations.
      selected_evidence:
        snippet: Patient 3 presented with GDD, dysmorphic facial features “course facies, narrow forehead,
          thick eyebrows, broad bulbous nose, short philtrum, thick lips, and large ears,” oculomotor
          apraxia, and seizures.
        supports: SUPPORT
