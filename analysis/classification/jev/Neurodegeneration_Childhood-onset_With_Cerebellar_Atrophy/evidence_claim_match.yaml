      assertion_type: AnimalModel
      assertion:
        name: Purkinje cell degeneration (pcd) mouse
        species: Mus musculus
        genotype: Agtpbp1 (Nna1) loss-of-function; spontaneous alleles pcd, pcd2J, pcd3J, plus engineered
          knockouts
        publication: PMID:11884758
        category: Spontaneous and engineered loss-of-function
        description: The pcd mouse is the established genetic model of CONDCA and predates the human disease
          by decades. Homozygotes have a histologically normal cerebellum at postnatal day 14 and then
          lose almost all Purkinje cells within weeks, with ataxia from around P20. Retinal photoreceptors,
          olfactory bulb mitral cells, selected thalamic neurons and alpha-motor neurons also degenerate,
          and males are infertile. Peripheral nerve and spinal motor neuron degeneration were recognised
          only after the human disease was described, and they are what make the model a genuine phenocopy
          rather than a cerebellum-only model.
        genes:
        - preferred_term: AGTPBP1
          term:
            id: hgnc:17258
            label: AGTPBP1
        modeled_mechanisms:
        - target: Purkinje Neuron Degeneration
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Near-complete Purkinje cell loss with the same molecular lesion (tubulin hyperglutamylation)
            as the human disease.
          limitations: Purkinje cell death in the mouse is temporally compressed into a few postnatal
            weeks, whereas human disease ranges from rapidly fatal infancy to survival into adolescence,
            so the therapeutic window observed in mice may not translate.
        - target: Lower Motor Neuron and Peripheral Motor Axon Degeneration
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Peripheral nerve and spinal motor neuron degeneration in pcd mice was shown to
            reproduce the human motor neuronopathy.
        notes: Mouse data must not be used as the sole support for any human phenotype in this entry.
          Every human phenotype recorded here carries at least one HUMAN_CLINICAL evidence item; MODEL_ORGANISM
          items are used for mechanism and for model fidelity only.
      selected_evidence:
        snippet: The classical recessive mouse mutant, Purkinje cell degeneration (pcd), exhibits adult-onset
          degeneration of cerebellar Purkinje neurons, retinal photoreceptors, olfactory bulb mitral neurons,
          and selected thalamic neurons, and has defective spermatogenesis.
        supports: SUPPORT
    origin:
