      assertion_type: Discussion
      assertion:
        discussion_id: condca-immune-attribution
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is thymic aplasia an AGTPBP1 manifestation?
        attaches_to:
        - pathophysiology#Absent Thymic Tissue
        - phenotypes#Thymic Aplasia
        - phenotypes#Lymphopenia
        rationale: A single homozygous nonsense case had absent thymus, persistent lymphopenia and fatal
          adenovirus infection. The authors report no other known immunodeficiency variants, but lymphocyte
          subsets were not obtained. The downstream thymic contribution to lymphopenia is represented
          provisionally; a causal gene-to-thymic-development pathway and recurrence in other patients
          remain unproven. Thymic aplasia names the same anatomical absence as the tissue node, so no
          causal arrow connects those two labels; the aplasia remains an explicitly unexplained clinical
          finding. Sepsis-associated hemophagocytosis, hepatic steatosis and pigment cast nephropathy
          are retained as terminal case findings rather than generalized primary CONDCA manifestations.
      selected_evidence:
        snippet: The lymphopenia suggests that the disorder may be causing a primary immunodeficiency
          (PID) in the affected children.
        supports: SUPPORT
