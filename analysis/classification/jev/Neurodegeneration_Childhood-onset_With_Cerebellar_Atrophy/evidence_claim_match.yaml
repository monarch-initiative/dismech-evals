  3724d5c33c8dcc856926686375bbcceb55aed66181e48902992424440bda51ae:
    claim:
      about:
        disease:
          name: Neurodegeneration Childhood-onset With Cerebellar Atrophy
          disease_term:
            preferred_term: Childhood-onset neurodegeneration with cerebellar atrophy
            term:
              id: MONDO:0032650
              label: neurodegeneration, childhood-onset, with cerebellar atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CCP1 Deglutamylase Deficiency
        description: Biallelic AGTPBP1 variants abolish functional cytosolic carboxypeptidase 1. Truncating
          alleles (nonsense, frameshift, canonical splice, multi-exon genomic deletion) eliminate the
          protein through nonsense-mediated decay or early truncation; tested missense alleles produce
          unstable protein that lacks detectable catalytic activity. CCP1 is a zinc metallocarboxypeptidase
          that shortens polyglutamate side chains on the tubulin C-terminal tail and converts detyrosinated
          alpha-tubulin into Delta2-tubulin, so its loss removes the eraser arm of the neuronal tubulin
          code.
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        conforms_to: cerebellar_purkinje_degeneration#Cerebellar Neuron Insult
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        molecular_functions:
        - preferred_term: tubulin metallocarboxypeptidase (deglutamylase) activity
          term:
            id: GO:0004181
            label: metallocarboxypeptidase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: tubulin side-chain deglutamylation
          term:
            id: GO:0035610
            label: protein side chain deglutamylation
          modifier: DECREASED
        - preferred_term: C-terminal deglutamylation generating Delta2-tubulin
          term:
            id: GO:0035609
            label: C-terminal protein deglutamylation
          modifier: DECREASED
        genes:
        - preferred_term: AGTPBP1
          term:
            id: hgnc:17258
            label: AGTPBP1
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'Biallelic germline AGTPBP1 alleles. Reported classes include nonsense, frameshift,
            canonical and intronic splice-site, multi-exon genomic deletion, and missense alleles; truncating
            alleles eliminate the protein and tested missense alleles produce unstable protein without
            detectable catalytic activity, so the category is loss of function rather than dominant-negative
            or gain of function. Zygosity is deliberately left unset: affected individuals are homozygous
            or compound heterozygous, and ZygosityEnum has no biallelic value that covers both without
            asserting one of them.'
      selected_evidence:
        snippet: Three enzymes (CCP1, CCP4, and CCP6) catalyze the shortening of polyglutamate chains
          and a fourth (CCP5) specifically removes the branching point glutamates.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21074048
      reference_title: A family of protein-deglutamylating enzymes associated with neurodegeneration.
      evidence_source: IN_VITRO
      explanation: Biochemical characterisation of the CCP family assigns CCP1 the polyglutamate side-chain
        shortening (deglutamylase) activity that is lost in CONDCA.
