      assertion:
        name: Cerebellar Ataxia and Movement Disorder
        description: 'Loss of Purkinje cell output disrupts the cerebellar contribution to motor coordination,
          producing ataxia. In the most severely affected infants profound weakness may mask the ataxia
          because the child never achieves independent ambulation. Spasticity and dystonia are also consistently
          reported in these patients and are curated as phenotypes, but they are NOT attributed to this
          node: spasticity is a pyramidal/upper-motor-neuron sign and dystonia is extrapyramidal, and
          neither follows from loss of cerebellar cortical output. A single p.Gln816Pro case now documents
          caudate and putaminal atrophy, but a causal relationship between those lesions and the movement
          disorder is unresolved. The affected descending motor pathways are also unestablished.'
        biological_scale: ORGANISM
        role: consequence
        mechanism_confidence: ESTABLISHED
        conforms_to: cerebellar_purkinje_degeneration#Cerebellar Ataxia
      selected_evidence:
        snippet: feeding difficulties, ataxia, spasticity, and dystonia
