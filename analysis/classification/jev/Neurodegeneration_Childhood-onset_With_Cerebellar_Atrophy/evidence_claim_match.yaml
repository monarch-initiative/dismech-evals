          a homozygous state in the Genome Aggregation (gnomAD; v2.1.1) database, identified by whole-exome
          sequencing in a patient with a seizure, dystonia, dilated cardiomyopathy (DCM), and accompanying
          atrophy of caudate nuclei, putamen, and cerebellum.'
