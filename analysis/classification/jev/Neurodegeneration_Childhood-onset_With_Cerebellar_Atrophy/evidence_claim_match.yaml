          cell degeneration and partially improved motor function in Ccp1-deficient mice. This is the
          most direct mechanistic rescue strategy for a recessive loss-of-function disorder, but no clinical
          trial, safety data, or human dosing information exists, and the mouse result required intervention
          before Purkinje cell loss.
