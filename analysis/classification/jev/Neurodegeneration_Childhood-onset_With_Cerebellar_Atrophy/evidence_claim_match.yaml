        notes: 'CONDCA is caused by biallelic damaging variants in AGTPBP1 (9q21.33), which encodes cytosolic
          carboxypeptidase 1. The reported allelic spectrum spans nonsense, frameshift, canonical and
          intronic splice-site, multi-exon genomic deletion, and missense alleles, most of which affect
          the conserved N-terminal region or the zinc-carboxypeptidase motifs. All reported disease alleles
          are germline; no somatic mechanism, repeat expansion or mitochondrial lesion is established.

          A genotype-severity trend has been noted - biallelic protein-truncating genotypes cluster among
          the fatal and severe cases and missense genotypes among the milder ones - but the original authors
          explicitly declined to call it a genotype-phenotype correlation, and exceptions exist in both
          directions. It should not be used prognostically. Because a multi-exon genomic deletion is part
          of the reported spectrum, copy-number-sensitive analysis is needed when sequencing finds only
          one variant.'
      selected_evidence:
        snippet: Patients with fatal and severe forms of the disease usually had biallelic protein-truncating
