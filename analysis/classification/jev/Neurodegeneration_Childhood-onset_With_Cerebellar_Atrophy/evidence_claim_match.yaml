        snippet: Expression of the N-terminally truncated form of Ccp1 (Ccp1Δ1), which retains deglutamylase
          activity, in neurons of Ccp1-deficient neonatal mice via a blood-brain barrier-penetrating AAV
          vector strongly prevented Purkinje cell degeneration during postnatal development.
        supports: SUPPORT
