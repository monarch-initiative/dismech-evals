        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cbll1_m6a_human_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does the CBLL1/m6A corticogenesis mechanism, defined in Ube3c-deficient mouse forebrain
          and human brain organoids, operate in the human patient brain?
        attaches_to:
        - pathophysiology#CBLL1 Stabilization and m6A Writer Hyperactivation
        - pathophysiology#Impaired Neural Progenitor Cell-Cycle Exit and Skewed Neurogenesis
        rationale: The mechanism is attractive and directly druggable in the model (STM2457 rescues the
          progenitor defect in vivo), but the mismatch is substantive in three ways. The mouse cortex
          lacks the expanded outer subventricular zone and outer radial glia that dominate human cortical
          expansion, precisely the compartment a progenitor cell-cycle-exit defect would act on. Brain
          organoids model fetal corticogenesis and cannot express speech, movement or behavioral phenotypes,
          which is the entire clinical endpoint. And no patient brain tissue, imaging correlate of cortical
          lamination, or human CBLL1/m6A measurement exists to test the chain. The source is additionally
          a preprint that had not completed peer review at the time of curation.
        proposed_experiments:
        - experiment_id: patient_organoid_m6a_profiling
          name: m6A and CBLL1 profiling in patient-derived cortical organoids
          description: Generate cortical organoids from NEDSMB patient iPSCs and isogenic corrected controls,
            and measure CBLL1 abundance, transcriptome-wide m6A (meRIP-seq), progenitor cell-cycle exit
            and laminar marker distribution, with and without METTL3 inhibition.
        - experiment_id: patient_cortical_lamination_mri
          name: Neuroimaging correlate of cortical lamination
          description: Review or acquire high-resolution structural MRI in the reported patients for gyral,
            laminar or heterotopia phenotypes predicted by the mouse lamination defect, given that cerebellar
            hypoplasia and thin corpus callosum are already recorded in the clinical synopsis.
      selected_evidence:
        snippet: with its loss favoring neurogenesis and suppressing glial fate
        supports: SUPPORT
