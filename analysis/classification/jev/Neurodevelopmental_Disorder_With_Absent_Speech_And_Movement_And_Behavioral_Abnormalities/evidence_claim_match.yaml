      assertion_type: Pathophysiology
      assertion:
        name: Neuronal Proteostatic Vulnerability
        biological_scale: CELLULAR
        description: Neurons are long-lived and post-mitotic and cannot dilute damaged proteins by division,
          so they are the cell type in which a chronic reduction in proteasomal processivity is expected
          to be limiting. The HECT-type UBE3 ligase family as a whole is required for cortical circuit
          assembly and higher cognitive function, which is the general reason a ligase-family defect presents
          as a neurodevelopmental syndrome. The specific neuronal consequence of UBE3C loss in human brain
          has not been measured, and this node is the inferential link in the canonical chain.
        cell_types:
