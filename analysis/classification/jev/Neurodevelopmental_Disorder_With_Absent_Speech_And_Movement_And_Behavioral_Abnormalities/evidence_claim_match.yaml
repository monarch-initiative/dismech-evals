        classification_value: NEUROLOGIC
        notes: 'Essentially all reported morbidity is neurological or neurobehavioral: global developmental
          delay, severe intellectual disability, absent speech, tremor, ataxia, limb dystonia and aggressive
          behavior, with seizures in the ascertainment cohort. The non-neurological findings recorded
          for the entity (hypodontia, mild dysmorphism) are minor by comparison.'
      selected_evidence:
        snippet: Chromosomal analysis and exome sequencing were used to identify the genetic causes in
          10 patients from 7 unrelated families with syndromic neurodevelopmental, seizure, and movement
          disorders and neurobehavioral phenotypes.
        supports: SUPPORT
