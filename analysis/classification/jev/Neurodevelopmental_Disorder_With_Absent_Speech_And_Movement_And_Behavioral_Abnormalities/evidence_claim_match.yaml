              id: MONDO:0859519
              label: neurodevelopmental disorder with absent speech and movement and behavioral abnormalities
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Proteasome-Associated HECT E3 Ligase Activity
        biological_scale: MOLECULAR
        description: UBE3C is a HECT-domain E3 ubiquitin ligase that binds the 19S regulatory particle
          of the 26S proteasome through its N-terminal domain and assembles Lys29- and Lys48-linked polyubiquitin
          chains through its C-terminal HECT domain. It cycles on and off the proteasome together with
          the deubiquitinase USP14, with substrate load driving the association. Biallelic loss of UBE3C
          removes this activity from the particle.
        molecular_functions:
        - preferred_term: HECT-type ubiquitin protein ligase activity
          term:
            id: GO:0061630
            label: ubiquitin protein ligase activity
          modifier: LOSS_OF_FUNCTION
        biological_processes:
        - preferred_term: K29-linked polyubiquitin chain assembly
          term:
            id: GO:0035519
            label: protein K29-linked ubiquitination
          modifier: DECREASED
        - preferred_term: K48-linked polyubiquitin chain assembly
          term:
            id: GO:0070936
            label: protein K48-linked ubiquitination
          modifier: DECREASED
      selected_evidence:
        snippet: Recombinant KIAA10 catalyzed the assembly of both Lys(29)- and Lys(48)-linked polyubiquitin
          chains.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11278995
      reference_title: A HECT domain E3 enzyme assembles novel polyubiquitin chains.
      evidence_source: IN_VITRO
      explanation: Establishes the chain-linkage specificity of UBE3C (originally cloned as KIAA10), the
        activity lost in this disorder.
