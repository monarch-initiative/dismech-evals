            label: ubiquitin-dependent protein catabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: we highlight that uninterrupted action of UBE3 ligases is a sine qua non for cortical
          circuit assembly and higher cognitive functions of the neocortex.
        supports: SUPPORT
