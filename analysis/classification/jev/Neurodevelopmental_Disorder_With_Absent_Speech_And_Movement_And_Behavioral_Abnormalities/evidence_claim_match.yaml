              abnormalities
            term:
              id: MONDO:0859519
              label: neurodevelopmental disorder with absent speech and movement and behavioral abnormalities
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ube3c_substrate_processivity_gap
        kind: KNOWLEDGE_GAP
        prompt: Which UBE3C substrates fail to be degraded in patient neurons, and does proteasomal processivity
          actually fall in UBE3C-null human cells?
        attaches_to:
        - pathophysiology#Impaired Proteasomal Processivity and Cytosolic Protein Quality Control
        - pathophysiology#Neuronal Proteostatic Vulnerability
        rationale: 'The processivity defect is established for UBE3C knockdown in immortalized cell lines
          and for the yeast ortholog, and the disorder''s causality is established genetically, but nothing
          connects the two: no measurement of proteasomal processivity, ubiquitin-conjugate load or substrate
          accumulation has been reported in cells from a NEDSMB patient. The neuronal step of the canonical
          model is therefore an inference, not a finding. The gap is wider than "which substrates", because
          UBE3C''s cell biology is not confined to proteasomal processivity: it also sets autophagic flux
          (K29/K48-branched ubiquitination of VPS34, and K33 ubiquitination of ATG4B) and contributes
          to ER-associated degradation of misfolded substrates. Any of those arms could be the disease-relevant
          one, none is disease-linked in the current literature, and the canonical chain here models only
          the proteasomal arm.'
        proposed_experiments:
        - experiment_id: patient_neuron_processivity_profiling
          name: Processivity and conjugate profiling in patient-derived neurons
          description: Differentiate iPSC-derived cortical neurons from the reported patients and isogenic
            controls, and measure proteasome-bound ubiquitin conjugate levels, accumulation of truncated
            degradation intermediates from a destabilizing-domain reporter, and sensitivity to proteotoxic
            stress (17-AAG, bortezomib).
      selected_evidence:
        snippet: Upon knockdown of UBE3C, an E3 ubiquitin ligase, a reporter protein consisting of a destabilizing
          domain fused to GFP is degraded more slowly and incompletely by the proteasome.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24158444
      reference_title: The E3 ubiquitin ligase UBE3C enhances proteasome processivity by ubiquitinating
        partially proteolyzed substrates.
      evidence_source: IN_VITRO
      explanation: Documents the one side of the gap that IS established - the processivity defect in
        a knockdown cell line - against which the absence of any patient-cell measurement is the gap.
