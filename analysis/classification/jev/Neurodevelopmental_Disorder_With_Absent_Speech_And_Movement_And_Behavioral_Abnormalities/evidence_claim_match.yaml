          set of unrelated neurodevelopmental genes. NEDSMB was discovered inside exactly this group.
          Anything on this list is therefore a live alternative for a patient in front of you, and the
          discriminator is the molecular result, not the phenotype.
        notes: The cited cohort (Aguilera et al. 2021) reports SYNGAP1, VAMP2, TBL1XR1, ASXL3, SATB2,
          SMARCE1, SPTAN1, KCNQ3, SLC6A1, LAS1L and candidate HSF2, and names Christianson (SLC9A6), Rett
          (MECP2), Pitt-Hopkins (TCF4), Kleefstra (EHMT1), Mowat-Wilson (ZEB2) and HERC2 deficiency as
          established AS differentials. Single-gene AS-like differentials reported separately elsewhere
          - MEF2C, ACTL6B, CTNNB1, KMT5B, SYT1 - are named here as pointers only; they are not asserted
          as curated content because each rests on its own primary report that has not been read for this
          entry. A PR reviewer proposed that second list; it does not come from the cited cohort and the
          two should not be conflated.
      selected_evidence:
        snippet: There is a 10-15% of patients with an AS phenotype whose genetic cause remains unknown
          (Angelman-like syndrome, AS-like).
        supports: SUPPORT
