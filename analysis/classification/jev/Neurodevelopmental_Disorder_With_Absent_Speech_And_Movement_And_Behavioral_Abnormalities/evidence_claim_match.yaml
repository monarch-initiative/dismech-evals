      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: epitranscriptomic_corticogenesis
        hypothesis_label: CBLL1/m6A epitranscriptomic corticogenesis model
        status: EMERGING
        description: 'Loss of UBE3C stabilizes its substrate CBLL1, hyperactivating m6A mRNA writers in
          neural progenitors, impairing cell-cycle exit and skewing the neurogenic/gliogenic balance with
          disrupted cortical lamination. Supported by mouse forebrain and human brain organoid data in
          a 2025 preprint, including in vivo rescue by the METTL3 inhibitor STM2457. Not confirmed in
          human patient tissue, and not peer reviewed at the time of curation. The two models are complementary
          rather than competing: the same ligase loss could act both through general proteostasis and
          through this specific substrate.'
      selected_evidence:
        snippet: impairs cell cycle exit, a defect reversible in vivo by the METTL3 inhibitor STM2457.
        supports: SUPPORT
