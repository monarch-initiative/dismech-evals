              label: neurodevelopmental disorder with absent speech and movement and behavioral abnormalities
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: proteostatic_neurodevelopment
        hypothesis_label: Proteasomal processivity failure model
        status: CANONICAL
        description: Loss of UBE3C removes the proteasome-docked ligase that re-ubiquitinates partially
          proteolyzed substrates, degrading proteasomal processivity and cytosolic protein quality control.
          Neurons, which cannot dilute damaged proteins by division, are the limiting cell type, and chronic
          proteostatic insufficiency during and after corticogenesis produces the neurodevelopmental syndrome.
          This is the mechanism that follows directly from the established biochemistry of the protein,
          but the neuronal step has not been measured in UBE3C-deficient human tissue.
      selected_evidence:
        snippet: Partial proteolysis is also observed when UBE3C is present but cannot ubiquitinate substrates
          because its active site has been mutated, it is unable to bind to the proteasome, or the substrate
          lacks lysine residues.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
