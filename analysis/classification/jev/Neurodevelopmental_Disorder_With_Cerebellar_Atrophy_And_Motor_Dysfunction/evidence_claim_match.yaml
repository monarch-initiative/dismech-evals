        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does loss of a ubiquitously expressed snRNP assembly factor damage the cerebellum
          and corticospinal tract selectively, and which mis-spliced or mistranslated transcripts link
          the molecular defect to cerebellar degeneration?
        rationale: The snRNP assembly and splicing defect is measured only in generic iPSC-derived neurons,
          and the transcriptomic changes there barely overlap those of SMA neurons. No cerebellar cell
          type has been studied, no patient neuropathology is published, and the edge from splicing dysregulation
          to cerebellar degeneration rests on analogy with other snRNP lesions.
        attaches_to:
        - pathophysiology#Neuronal Pre-mRNA Splicing Dysregulation
        - pathophysiology#Cerebellar Degeneration
      selected_evidence:
        snippet: mutations in GEMIN5 lead to an exclusive transcriptomic profile with little overlap to
          SMA
        supports: SUPPORT
