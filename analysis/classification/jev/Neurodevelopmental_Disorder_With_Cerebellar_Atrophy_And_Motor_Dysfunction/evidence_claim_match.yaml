          change the course of the disease?
        rationale: 'The evidence is one report: fibroblasts and uncontrolled treatment in two patients
          who both carry p.Arg1016Cys, with neurological improvement but unchanged MRI. Developmental
          gains are expected in children with a mostly static disorder regardless of treatment, so an
          uncontrolled report cannot separate a treatment effect from natural history. Replication in
          other genotypes and a controlled assessment are needed.'
