        prompt: How much of the disease is caused by loss of snRNP assembly and how much by loss of GEMIN5's
          ribosome-binding and translational functions?
        rationale: Dimerization-domain variants abolish ribosome association, but the consequences for
          neuronal protein synthesis have not been measured in patient cells, and the founding authors
          note that functions beyond snRNP biogenesis may explain why the phenotype differs from SMA.
        attaches_to:
        - pathophysiology#Loss of GEMIN5 Ribosome Association
        - mechanistic_hypotheses#translation_control_deficit
      selected_evidence:
        snippet: Molecular analyses of individual variants, which are defective in protein dimerization,
          display decreased levels of ribosome association, reinforcing the involvement of the protein
          in translation regulation.
        supports: SUPPORT
