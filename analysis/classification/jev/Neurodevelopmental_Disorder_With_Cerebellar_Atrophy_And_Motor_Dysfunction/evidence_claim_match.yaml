              label: neurodevelopmental disorder with cerebellar atrophy and motor dysfunction
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GEMIN5 Biallelic Loss of Function
        description: Biallelic GEMIN5 variants, truncating alleles and missense changes clustered in the
          WD40 snRNA-binding domain, the central TPR-like dimerization domain and the C-terminal noncanonical
          RNA-binding site 1 (RBS1), reduce the amount of functional GEMIN5. Patient iPSC-derived neurons
          and lymphoblastoid cells show markedly reduced GEMIN5 protein; TPR-like variants disrupt dimerization
          and the RBS1 variant destabilizes the protein.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: GEMIN5
          term:
            id: hgnc:20043
            label: GEMIN5
        molecular_functions:
        - preferred_term: snRNA binding
          modifier: DECREASED
          term:
            id: GO:0017069
            label: snRNA binding
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Homozygous or compound heterozygous; heterozygous carriers are unaffected.
      selected_evidence:
        snippet: We found that the levels of GEMIN5 were drastically reduced by ~70-80% in Leu1068Pro
          and His913Arg patient neurons as compared to controls
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
