          truncating alleles (p.Y65X, a recurrent c.828_831del frameshift). Variants weaken SHQ1 binding
          to dyskerin, and the R335C and A426V variants fail or only partly complement Shq1 loss in yeast.
          No ClinGen gene-disease validity record was found for SHQ1.
