          in infancy)
        notes: Some affected individuals exhibit prenatal or neonatal manifestations (intrauterine growth
          restriction, neonatal feeding/respiratory distress, or congenital facial dysmorphism), while
          global developmental and motor delays become universally apparent during infancy. Walking is
          typically acquired between 1.5 and 5 years of age with unsteady gait, whereas language remains
          absent or severely restricted into childhood and adolescence.
      selected_evidence:
        snippet: Gross and fine motor skills were impaired for all individuals, although less severe than
          language delay, as most children were ambulatory by 5 years of age.
        supports: SUPPORT
