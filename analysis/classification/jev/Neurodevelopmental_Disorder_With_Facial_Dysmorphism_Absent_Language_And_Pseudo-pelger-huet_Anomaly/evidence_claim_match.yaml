              label: neurodevelopmental disorder with facial dysmorphism, absent language, and pseudo-pelger-huet
                anomaly
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lbr_protein_stability_fibroblast_vs_hela_mismatch
        kind: KNOWLEDGE_GAP
        prompt: Why does TMEM147 loss cause diffuse intranuclear LBR mislocalization without decreased
          LBR protein levels in patient-derived primary fibroblasts, whereas acute TMEM147 RNAi knockdown
          in HeLa cells causes a sharp decline in LBR protein levels and ER mistargeting?
        attaches_to:
        - pathophysiology#Lamin B Receptor Mislocalization at the Inner Nuclear Membrane
        rationale: In HeLa cells, Christodoulou et al. (2020) reported that RNAi-mediated silencing of
          TMEM147 drastically reduced LBR protein levels at the inner nuclear membrane, decreased LBR
          and DHCR7 transcription, and caused mistargeting of LBR to the endoplasmic reticulum. By contrast,
          when Thomas et al. (2022) examined primary dermal fibroblasts from affected individuals harboring
          biallelic truncating (p.Tyr162* / p.Lys34Serfs*33) or homozygous missense (p.Arg166Trp) variants
          in TMEM147, LBR was redistributed evenly throughout the nucleoplasm rather than remaining anchored
          at the nuclear envelope, and this altered diffusional mobility was not accompanied by decreased
          total LBR protein levels. Furthermore, despite the chromatinopathy-like craniofacial appearance
          and LBR-mediated heterochromatin tethering role, peripheral blood DNA from affected individuals
          did not display a chromatinopathy episignature on EpiSign methylation profiling. Whether neurodevelopmental
          impairment in humans is driven primarily by defective ER multi-pass translocon biogenesis (via
          the Sec61-TMCO1-CCDC47-nicalin-TMEM147-NOMO complex and RTN4/CKAP4 upregulation), by nuclear
          envelope instability, or by impaired nicalin-NOMO modulation of Nodal signaling during early
          neural patterning remains an open mechanistic question.
      selected_evidence:
        snippet: Silencing of TMEM147 drastically reduces the level of lamin B receptor (LBR) at the inner
          nuclear membrane and results in mistargeting of LBR to the ER.
        supports: SUPPORT
    origin:
