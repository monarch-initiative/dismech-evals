      assertion:
        name: Granulocyte Nuclear Lobulation Defect (Pseudo-Pelger-Huët Anomaly)
        description: Because LBR anchoring at the inner nuclear membrane is required for normal nuclear
          lobulation and heterochromatin condensation during granulocyte maturation, biallelic TMEM147
          loss of function produces lobulation defects in approximately 15%–25% of peripheral blood polymorphonuclear
          neutrophils (and sparse eosinophils). Affected neutrophils exhibit hyposegmented or bilobed
          sack-like nuclei connected by a thin chromatin thread, chromatin clumping, and nuclear appendices
          (caryoschizes or drumsticks). Because the majority of mature granulocytes are not bilobed, this
          hematological finding is classified as pseudo-Pelger-Huët anomaly rather than classic Pelger-Huët
          anomaly.
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: eosinophil
          term:
            id: CL:0000771
            label: eosinophil
        - preferred_term: granulocyte
          term:
            id: CL:0000094
            label: granulocyte
        locations:
        - preferred_term: blood
          term:
            id: UBERON:0000178
            label: blood
        biological_processes:
        - preferred_term: granulocyte differentiation
          term:
            id: GO:0030851
            label: granulocyte differentiation
        - preferred_term: heterochromatin organization
          term:
            id: GO:0070828
            label: heterochromatin organization
      selected_evidence:
        snippet: Cytological examination of the blood smear frequently revealed lobulation defects of
          the neutrophils (Figures 5D and S3A), with forms of hyposegmentation similar to the Pelger-Huët
          anomaly, although with a lower proportion, bilobed aspects in the shape of a sack with two round
          or oval lobes connected by a thread of chromatin, rare chromatin clumping, and frequent nuclear
          appendices (caryoschizes or drumsticks), isolated or associated with the preceding abnormalities.
          These cytological abnormalities concerned about 15%–25% of neutrophils and were also identified
          in sparse eosinophils, indicating that the anomaly affects all granulocytes but is most evident
          in polymorphonuclear neutrophils (Figure S3B).
        supports: SUPPORT
