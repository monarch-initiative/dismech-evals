      assertion_type: Pathophysiology
      assertion:
        name: Endoplasmic Reticulum Translocon Accessory Complex Disruption
        description: At the endoplasmic reticulum membrane, TMEM147 is the core seven-transmembrane subunit
          of the nicalin-TMEM147-NOMO accessory complex, which assembles with the Sec61 protein-conducting
          channel, the Oxa1-family membrane insertase TMCO1, and CCDC47 at the ribosome exit tunnel to
          form a ~360 kDa translocon required for co-translational biogenesis of multi-pass membrane proteins.
