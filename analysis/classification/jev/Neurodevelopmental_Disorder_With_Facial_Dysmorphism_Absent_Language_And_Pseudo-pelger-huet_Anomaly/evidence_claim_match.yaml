              label: neurodevelopmental disorder with facial dysmorphism, absent language, and pseudo-pelger-huet
                anomaly
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Autophagy-Lysosomal Degradation of Destabilized TMEM147 Missense Variants
        description: Pathogenic missense variants in TMEM147 (p.Gly7Arg in transmembrane domain 1, p.Ile133Asn
          at the alpha-helix 5 loop facing nicalin, and p.Arg166Trp at alpha-helix 6) properly target
          to the endoplasmic reticulum but introduce steric clashes with TMCO1, nicalin, or adjacent TMEM147
          helices. As shown in transfected COS-1 cells, these substitutions severely reduce TMEM147 protein
          stability and trigger accelerated protein clearance through the autophagy-lysosomal pathway,
          which is rescued by bafilomycin treatment.
        genes:
        - preferred_term: TMEM147
          term:
            id: hgnc:30414
            label: TMEM147
        biological_processes:
        - preferred_term: autophagy
          term:
            id: GO:0006914
            label: autophagy
        - preferred_term: lysosomal protein catabolic process
          term:
            id: GO:1905146
            label: lysosomal protein catabolic process
        cellular_components:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
      selected_evidence:
        snippet: 'Considering the p.Gly7Arg substitution, the arginine extension was predicted to push
          into the TMCO1-facing amino terminal region, creating a steric conflict with the Phe96 (Figure
          3, insert 2, asterisks). Similarly, p.Ile133Asn generated tensions with the adjacent amino acids
          in TMEM147 (data not shown) and its extension towards nicalin, would cause potential clashes
          with three amino acids in nicalin: Phe524, Leu527, and Leu528 (Figure 3, insert 1, asterisks).'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
