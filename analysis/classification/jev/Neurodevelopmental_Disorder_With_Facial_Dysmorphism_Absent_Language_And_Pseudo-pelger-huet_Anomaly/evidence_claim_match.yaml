        name: Pelger-Huet anomaly
        description: Autosomal dominant or recessive laminopathy caused by pathogenic variants in LBR
          (which TMEM147 anchors at the inner nuclear membrane). Classic heterozygous Pelger-Huët anomaly
          is a benign hematological trait in which the vast majority of mature granulocytes have bilobed
          or hypolobulated nuclei without intellectual disability, whereas TMEM147 deficiency causes pseudo-Pelger-Huët
          anomaly affecting only ~15%–25% of neutrophils alongside severe syndromic neurodevelopmental
          impairment.
        disease_term:
          preferred_term: Pelger-Huet anomaly
          term:
            id: MONDO:0008214
            label: Pelger-Huet anomaly
        distinguishing_features:
        - Classic Pelger-Huët anomaly involves the majority of mature granulocytes and is caused by LBR
          variants, whereas TMEM147 deficiency affects 15%–25% of neutrophils (pseudo-Pelger-Huët anomaly)
          and consistently presents with severe to profound intellectual disability and coarse facial
          dysmorphism.
      selected_evidence:
        snippet: Formally, these hematological features could not be classified as a typical Pelger-Huët
          anomaly, but rather pseudo-Pelger-Huët anomaly because the majority of mature granulocytes were
          not bilobed, although they clearly belonged to the same phenotypic spectrum.
        supports: SUPPORT
