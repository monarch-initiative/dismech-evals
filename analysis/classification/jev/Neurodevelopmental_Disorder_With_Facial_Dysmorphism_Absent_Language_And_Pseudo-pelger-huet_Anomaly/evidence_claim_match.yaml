              label: neurodevelopmental disorder with facial dysmorphism, absent language, and pseudo-pelger-huet
                anomaly
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TMEM147 Loss of Function
        description: Biallelic truncating nonsense, frameshift, and canonical or near-canonical splice-site
          variants in TMEM147 (such as c.344+5G>A, which causes exon 4 skipping, and c.345-1G>T) alter
          the reading frame and trigger nonsense-mediated mRNA decay (except for late C-terminal frameshifts
          such as p.Val182Leufs*66 that replace the 6th and 7th transmembrane helices). Together with
          destabilizing missense variants that undergo accelerated degradation, these alleles abolish
          functional TMEM147 protein interactions at both the endoplasmic reticulum membrane and the inner
          nuclear membrane.
        genes:
        - preferred_term: TMEM147
          term:
            id: hgnc:30414
            label: TMEM147
        biological_processes:
        - preferred_term: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
          term:
            id: GO:0000184
            label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
        cellular_components:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
        - preferred_term: nuclear inner membrane
          term:
            id: GO:0005637
            label: nuclear inner membrane
      selected_evidence:
        snippet: Regarding the splice-site variants c.344+5G>A and c.345−1G>T, in silico analysis predicted
          them to suppress the activity of the donor splice-site of exon 4 (137 nt) and the acceptor splice-site
          of exon 5 (85 nt), respectively (Figures S2A–S2D). Both were predicted to alter the reading
          frame of the transcript (Figures S2A and S2C),38 eventually resulting in nonsense-mediated mRNA
          decay.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
