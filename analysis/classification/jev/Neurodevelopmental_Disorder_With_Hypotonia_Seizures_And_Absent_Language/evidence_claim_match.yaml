  b47e0870f0fb4f0311e49fbfba4e672c7b5209fe3da5ac3dccbbd5d96ad1ae07:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder With Hypotonia, Seizures, And Absent Language
          disease_term:
            preferred_term: neurodevelopmental disorder with hypotonia, seizures, and absent language
            term:
              id: MONDO:0014995
              label: neurodevelopmental disorder with hypotonia, seizures, and absent language
        context: []
      assertion_type: Genetic
      assertion:
        name: HECW2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: HECW2 (2q32.3) encodes HECT, C2 and WW domain containing E3 ubiquitin protein ligase 2
          (NEDL2). Causality for the dominant form rests on recurrent de novo missense variants in more
          than 30 unrelated patients, clustering of those variants in or near the HECT domain, constraint
          against variation in that region, and a consistent phenotype. ClinGen classifies HECW2 as Definitive
          for autosomal dominant and Limited for autosomal recessive complex neurodevelopmental disorder
          (MONDO:0100038). That is a broader disease concept than MONDO:0014995, so the tiers are cited
          as evidence but not recorded in gene_disease_validity. The recessive form rests on three consanguineous
          families, each with a different homozygous loss-of-function allele.
        gene_term:
          preferred_term: HECW2
          term:
            id: hgnc:29853
            label: HECW2
      selected_evidence:
        snippet: we performed whole exome sequencing on a large cohort of patients with ID or neurodevelopmental
          delay and identified four novel de novo predicted deleterious missense variants in HECW2 in
          six probands with ID/developmental delay and hypotonia.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27389779
      reference_title: De novo missense variants in HECW2 are associated with neurodevelopmental delay
        and hypotonia.
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: Defining clinical exome series, six probands.
