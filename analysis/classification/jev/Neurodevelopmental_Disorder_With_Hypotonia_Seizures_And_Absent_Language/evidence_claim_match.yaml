        biological_scale: MOLECULAR
        description: 'Heterozygous missense variants, almost always de novo, cluster in or next to the
          C-terminal HECT catalytic domain of HECW2, with recurrent hotspots at Arg1191 and Arg1330. No
          heterozygous truncating variant has been reported in a patient, and the heterozygous parents
          of recessive patients are unaffected, so simple haploinsufficiency does not explain the dominant
          form. A dominant-negative effect has been proposed but not tested.

          '
