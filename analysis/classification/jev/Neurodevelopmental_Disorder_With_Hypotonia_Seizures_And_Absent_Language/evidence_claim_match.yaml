        biological_scale: MOLECULAR
        description: 'HECW2 is a HECT-type E3 ligase whose WW domains bind PY motifs in its substrates.
          In cultured cells it ubiquitinates and stabilizes p73, enhancing p73-dependent transcription,
          and it targets PCNA, lamin B1 and HP1 alpha and beta for proteasomal degradation. In endothelial
          cells it stabilizes AMOTL1 by K63-linked ubiquitination, and in mice it promotes GDNF/RET/AKT
          signalling in enteric neural precursors through Nedd8 ligase activity. Which of these functions
          is lost or altered in patients, and in which cells, is not known.

          '
        genes:
        - preferred_term: HECW2
          term:
            id: hgnc:29853
            label: HECW2
        molecular_functions:
        - preferred_term: ubiquitin protein ligase activity
          term:
