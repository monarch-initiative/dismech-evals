            label: ubiquitin protein ligase activity
        biological_processes:
        - preferred_term: protein ubiquitination
          term:
            id: GO:0016567
            label: protein ubiquitination
      selected_evidence:
        snippet: HECW2 mediates their ubiquitination and targets them for proteasomal degradation.
        supports: SUPPORT
