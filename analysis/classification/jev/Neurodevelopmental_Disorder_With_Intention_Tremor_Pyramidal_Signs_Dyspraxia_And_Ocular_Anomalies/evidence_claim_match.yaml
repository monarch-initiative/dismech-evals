            target: Brain Reactive Oxygen Species and Acrolein Accumulation
            description: Measurement of smox and gpx3 mRNA levels, ROS and acrolein accumulation, and
              transmission electron microscopy of swollen and vacuolized neural mitochondria in smg9oi7/oi7
              zebrafish brains.
            direction: INCREASED
            interpretation: Significant elevation of Smox, ROS, acrolein, and damaged neural mitochondria
              establishes SMOX-driven oxidative and aldehyde toxicity as a key cellular lesion of SMG9
              deficiency.
        - target: Impaired Radial Glial Progenitor Proliferation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Demonstrates significantly fewer proliferating S100B+ PCNA+ radial glial progenitor
            cells in the dorsal telencephalon and reduced telencephalon size, rescued by MDL72527 or NAC
            treatment.
          limitations: Zebrafish larval assays cannot directly model higher-order human cognitive, expressive
            speech, oromotor praxis, or corticospinal tract pyramidal signs.
      selected_evidence:
        snippet: smg9oi7/oi7 zebrafish display congenital brain abnormalities and reduced cardiac contraction.
          Additionally, smg9oi7/oi7 zebrafish exhibit a premature aging phenotype. Analysis of NMD target
          mRNAs shows a trend toward increased mRNA levels in smg9oi7/oi7 zebrafish. Spermidine oxidase
          (Smox) is increased in smg9oi7/oi7 zebrafish, resulting in the accumulation of byproducts, reactive
          oxygen species, and acrolein.
        supports: SUPPORT
