          dysregulated genes include upregulated SMOX (logFC 2.1), OSBP2 (logFC 2.2), GPX3 (logFC 2.4),
          RAP1GAP (logFC 4.0), MAP1B (logFC 2.9), and HEY1 (logFC 2.0), as well as downregulated ZNF155
