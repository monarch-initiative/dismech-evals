      assertion_type: DifferentialDiagnosis
      assertion:
        name: Heart and Brain Malformation Syndrome (Classic Biallelic Loss-of-Function SMG9 Syndrome)
        disease_term:
          preferred_term: heart and brain malformation syndrome
          term:
            id: MONDO:0014833
            label: heart and brain malformation syndrome
        description: Heart and brain malformation syndrome (HBMS; OMIM:616920, MONDO:0014833) is the severe
          allelic SMG9 disorder caused by homozygous loss-of-function variants or compound heterozygous
          variants. Classic HBMS is characterized by congenital heart defects (such as ventricular septal
          defect), major structural brain abnormalities, severe intellectual disability, inability to
          walk, growth restriction, microcephaly, ocular malformations, and high infant/childhood mortality.
        distinguishing_features:
        - Homozygosity for the hypomorphic missense allele SMG9 c.551T>C p.(Val184Ala) versus biallelic
          loss-of-function SMG9 variants in classic HBMS.
        - Normal survival into adulthood (all 5 reported patients aged 24-56 years), independent ambulation,
          and spoken language in MONDO:0859274, whereas patients with homozygous loss-of-function mutations
          show severe intellectual disability (4/4) and inability to walk (3/3).
        - Low penetrance of congenital heart defects (1/5, 20%) and brain MRI malformations (1/5, 20%
          mild ventriculomegaly/white matter paucity) and normal growth (4/5) in MONDO:0859274 versus
          ventricular septal defect (6/6), brain abnormalities (5/5), microcephaly (5/5), and growth restriction
          (3/3) in homozygous loss-of-function SMG9 patients.
      selected_evidence:
        snippet: Of the 6 patients with homozygous missense variants, some milder phenotypes were observed,
          including independent walking (5/6), normal speech (5/6), mild to moderate intellectual disability
          (5/6), and normal growth (6/6). We also noticed that only one of these patients had a brain
          malformation, and two had congenital heart disease. While in patients with homozygous loss-of-function
          mutations, severe intellectual disability (4/4), inability to walk (3/3), ventricular septal
          defect (6/6), growth Restriction (3/3), microcephaly (5/5), and brain abnormalities (5/5) were
          observed.
        supports: SUPPORT
