              modifier: ABNORMAL
            - preferred_term: protein kinase binding
              term:
                id: GO:0019901
                label: protein kinase binding
              modifier: ABNORMAL
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Perturbed SMG1-SMG8-SMG9 Kinase Complex Regulation
        causal_link_type: DIRECT
        description: The structural defect in the SMG9 G-domain faces the active kinase site of SMG1 and
          is predicted to alter UPF1 binding and SMG1 kinase activity within the SMG1-SMG8-SMG9 complex.
