              label: neurodevelopmental disorder with intention tremor, pyramidal signs, dyspraxia, and
                ocular anomalies
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Infantile and early childhood onset with normal adult survival
        age_range: infancy to adulthood (first words at 2-3.5 years; intelligible speech at 6-8 years;
          evaluated at 24-56 years)
        notes: Developmental delay becomes apparent in infancy and early childhood, with mild motor delay,
          childhood hypotonia in a subset (2/5), markedly delayed expressive language (first words at
          2-3.5 years, intelligible speech at 6-8 years), childhood ataxia (4/5), and a universal tendency
          to fall during childhood (5/5). Unlike biallelic null SMG9 variants, survival into adulthood
          is normal (reported patients aged 24-56 years in good general health), with persistence of mild-to-moderate
          intellectual disability, intention tremor, slow diadochokinesis, and lower-limb pyramidal signs.
      selected_evidence:
        snippet: All patients were male, aged 24–56 years, and had either mild or moderate ID (N = 5/5,
          100%). Motor development was typically mildly delayed and two patients were reported to have
          had muscular hypotonia during childhood (N = 2/5, 40%). Language development was markedly delayed
          in all patients (N = 5/5, 100%). First words were delayed in all patients until 2 to 3.5 years,
          and expressive language increased slowly. The intelligible speech was typically acquired by
          the age of 6–8 years.
        supports: SUPPORT
