        snippet: The DGE analysis revealed that the expression of 112 genes was statistically significantly
          different (false discovery rate adjusted p-value, FDR padj < 0.05) between the patients and
          the healthy controls (Supplementary Table 7). This analysis revealed genes whose expression
          is affected by dysfunctional SMG9, which are also candidates possibly contributing to the disease
          pathogenesis. The overall pattern observed was an increased expression of genes in the patient
          group compared to the control group, including ~ 6.5 times more upregulated (97) than downregulated
