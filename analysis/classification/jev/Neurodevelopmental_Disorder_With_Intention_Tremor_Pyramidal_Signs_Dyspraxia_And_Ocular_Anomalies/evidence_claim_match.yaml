            name: SMG9 G-Domain Missense Structural Alteration
            biological_scale: MOLECULAR
            mechanism_confidence: PROVISIONAL
            description: The homozygous c.551T>C p.(Val184Ala) variant lies in exon 5 of SMG9 within the
              central nucleotide-binding G-domain of the SMG9 protein. Whole-blood RNA sequencing demonstrates
              that c.551T>C does not alter SMG9 mRNA expression or splicing. Homology modeling using SWISS-MODEL
              predicts that substituting Val184 with Ala results in non-conservation of the coordinated
              magnesium ion and a structural defect in the G-domain ATP/GTP-binding pocket that faces
              the active kinase site of SMG1. The node is marked provisional because the G-domain conformational
              change is based on in silico structural modeling.
            genes:
            - preferred_term: SMG9
              term:
                id: hgnc:25763
                label: SMG9
            molecular_functions:
            - preferred_term: nucleotide binding
              term:
