        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: smg9_val184ala_human_neural_progenitor_validation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the hypomorphic SMG9 p.(Val184Ala) missense variant directly impair UPF1 phosphorylation
          and trigger SMOX-dependent acrolein/ROS accumulation and radial glial progenitor depletion in
          human neural progenitor cells and cerebellar/corticospinal neurons?
        attaches_to:
        - pathophysiology#SMG9 G-Domain Missense Structural Alteration
        - pathophysiology#Perturbed SMG1-SMG8-SMG9 Kinase Complex Regulation
        - pathophysiology#Increased SMOX-Mediated Polyamine Catabolism
        - pathophysiology#Brain Reactive Oxygen Species and Acrolein Accumulation
        - pathophysiology#Neural Mitochondrial Structural Damage and Cellular Stress
        - pathophysiology#Impaired Radial Glial Progenitor Proliferation
        - pathophysiology#Aberrant Neurocognitive, Cerebellar, and Corticospinal Circuit Maturation
        rationale: In the defining human cohort (PMID:35087184), the impact of p.(Val184Ala) on Mg2+ binding
          and SMG1 kinase regulation was inferred by in silico SWISS-MODEL homology modeling, and transcriptomic
          upregulation of SMOX, OSBP2, GPX3, and HEY1 was measured in peripheral blood leukocytes rather
          than neural tissue and not yet confirmed by RT-qPCR. Conversely, the in vivo functional proof
          that SMOX upregulation causes brain ROS/acrolein accumulation, mitochondrial damage, and radial
          glial progenitor depletion was generated in smg9oi7/oi7 zebrafish (PMID:38806677). No patient-derived
          iPSC neural model or knock-in animal carrying p.(Val184Ala) has yet been assayed.
        proposed_experiments:
        - experiment_id: smg9_exp_ipsc_neural_organoids
          experiment_design: TARGETED_PERTURBATION
          name: Isogenic SMG9 p.(Val184Ala) human iPSC-derived neural progenitor and cerebellar organoid
            assay
          description: Generate patient-derived or CRISPR knock-in homozygous SMG9 c.551T>C p.(Val184Ala)
            human iPSCs differentiated into radial glial neural progenitors and cortical/cerebellar neurons;
            confirm SMOX, OSBP2, GPX3, HEY1, and ZNF155 expression by RT-qPCR, and quantify phospho-UPF1
            levels, intracellular acrolein and H2O2, mitochondrial ultrastructure, and progenitor proliferation
            with and without MDL72527 or N-acetyl-L-cysteine.
          decision_criterion: Statistically significant elevation of SMOX and acrolein/ROS and reduced
            progenitor proliferation in homozygous p.(Val184Ala) neural progenitors that is reversed by
            SMOX inhibition (MDL72527) or NAC.
          would_support:
          - pathophysiology#Increased SMOX-Mediated Polyamine Catabolism
          - pathophysiology#Brain Reactive Oxygen Species and Acrolein Accumulation
          - pathophysiology#Neural Mitochondrial Structural Damage and Cellular Stress
          - pathophysiology#Impaired Radial Glial Progenitor Proliferation
          would_refute:
          - pathophysiology#Increased SMOX-Mediated Polyamine Catabolism
          - pathophysiology#Brain Reactive Oxygen Species and Acrolein Accumulation
      selected_evidence:
        snippet: However, these results should be validated in future studies by confirming the findings
          using RT-qPCR.
        supports: SUPPORT
