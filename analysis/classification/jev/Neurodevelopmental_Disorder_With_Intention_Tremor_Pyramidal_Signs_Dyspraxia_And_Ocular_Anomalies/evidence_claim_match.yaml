      assertion_type: Discussion
      assertion:
        discussion_id: smg9_val184ala_missing_homozygotes_and_incomplete_ascertainment
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Why are fewer homozygous SMG9 c.551T>C p.(Val184Ala) individuals identified in Finland
          (5 patients) than the ~14 homozygotes predicted by the Finnish minor allele frequency (0.001598)?
        attaches_to:
        - pathophysiology#Aberrant Neurocognitive, Cerebellar, and Corticospinal Circuit Maturation
        - pathophysiology#Aberrant Cardiac Morphogenesis
        rationale: Given the Finnish MAF of 0.001598 in a population of 5.5 million, Hardy-Weinberg equilibrium
          predicts approximately 14 homozygous individuals in Finland, yet only five adult male patients
          from three families were identified and no homozygotes appear in gnomAD. This deficit could
          reflect either prenatal/perinatal loss in a subset of homozygotes who develop severe congenital
          heart defects (consistent with complex TGA/VSD/ASD/PDA in 1/5 surviving patients) or underascertainment
          of mildly affected adults without major congenital anomalies.
      selected_evidence:
        snippet: the allele frequency is 34 times higher in the Finns (0.001598) than in non-Finnish Europeans
          (0.00004644), and there are no homozygous individuals in the gnomAD. The expected number of
          SMG9 c.551T > C homozygous patients in Finland is (0.001598)2*5.5 million is approximately 14
          individuals.
        supports: SUPPORT
