          term:
            id: MONDO:0859136
            label: Alzahrani-Kuwahara syndrome
        description: Alzahrani-Kuwahara syndrome (MONDO:0859136; OMIM:619268) is caused by biallelic deleterious
          variants in SMG8, which encodes the direct binding partner of SMG9 within the SMG1-SMG8-SMG9
          complex. It presents with severe global developmental delay, microcephaly, facial dysmorphism,
          and variable congenital heart and eye malformations.
        distinguishing_features:
        - Biallelic pathogenic variants in SMG8 rather than SMG9 on molecular genetic testing.
        - Severe global developmental delay and microcephaly are characteristic of SMG8-related Alzahrani-Kuwahara
          syndrome, whereas SMG9 p.(Val184Ala) patients have normal head circumference, mild-to-moderate
          intellectual disability, and a characteristic motor syndrome of intention tremor, oral motor
          dyspraxia, and lower-limb pyramidal signs.
      selected_evidence:
        snippet: Here, we describe four consanguineous families with four different likely deleterious
          homozygous variants in SMG8, encoding a binding partner of SMG9. The observed phenotype greatly
          resembles that linked to SMG9 and comprises severe global developmental delay, microcephaly,
          facial dysmorphism, and variable congenital heart and eye malformations.
        supports: SUPPORT
