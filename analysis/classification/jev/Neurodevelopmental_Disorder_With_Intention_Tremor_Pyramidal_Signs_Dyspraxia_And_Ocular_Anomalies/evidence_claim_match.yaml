          SMG9 c.551T > C variant was not significantly associated with reduced life expectancy. The milder
          phenotype in patients with homozygous damaging SMG9 c.551T > C missense variant, compared to
          the phenotypes in the previously reported patients with biallelic loss-of-function variants,
          suggests that SMG9 c.551T > C could be a hypomorphic allele resulting in milder developmental
          outcome.
