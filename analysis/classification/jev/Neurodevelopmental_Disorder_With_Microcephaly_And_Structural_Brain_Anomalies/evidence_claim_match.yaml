        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Simplified Gyral Pattern
        - phenotypes#Corpus Callosum Hypoplasia
        - phenotypes#Intellectual Disability
        rationale: The only mechanistic data come from zebrafish larvae, which show spindle defects, apoptosis
          and reduced head size. No study in human cells or tissue has examined cortical folding, neuronal
          migration or callosal axon growth with DYNC1I2 loss, and no patient cells or organoids have
          been studied. The Perplexity report states that the 2019 full text describes axon-tract disorganization
          in dync1i2a morphants; that text is not cached here and could not be checked, so these phenotypes
          are not connected to a mechanism in this entry.
      selected_evidence:
        snippet: this finding offers initial insights into the cellular basis of microcephaly
        supports: SUPPORT
