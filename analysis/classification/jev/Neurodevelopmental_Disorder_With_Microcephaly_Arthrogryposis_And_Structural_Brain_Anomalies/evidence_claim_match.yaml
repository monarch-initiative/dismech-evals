      assertion:
        name: Impaired Mitotic Nuclear Envelope Remodelling and Nuclear Pore Insertion
        description: In SMPD4-depleted cells, nuclear envelope breakdown and reassembly during mitosis
          are abnormal and post-mitotic insertion of nuclear pore complexes is reduced; patient fibroblasts
          carry fewer nuclear pores per nuclear surface area. The proposed explanation is that SMPD4-generated
          ceramide is needed to bend the nuclear envelope for pore insertion.
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        biological_processes:
        - preferred_term: mitotic nuclear membrane disassembly
          modifier: ABNORMAL
