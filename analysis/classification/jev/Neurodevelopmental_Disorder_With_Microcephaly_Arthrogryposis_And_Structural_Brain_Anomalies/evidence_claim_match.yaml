        name: Deficient Neutral Sphingomyelinase-3 Activity at the ER and Nuclear Envelope
        description: SMPD4 localizes to the endoplasmic reticulum and outer nuclear envelope, where it
          hydrolyses sphingomyelin to ceramide at neutral pH and lies close to nuclear pore complex proteins,
          including NUP35. Patient fibroblasts lack SMPD4-specific neutral sphingomyelinase activity,
          yet whole-cell and subcellular lipidome fractions are unchanged, which suggests the enzyme acts
          locally on nuclear envelope membranes.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        molecular_functions:
        - preferred_term: neutral sphingomyelin phosphodiesterase activity
          modifier: DECREASED
