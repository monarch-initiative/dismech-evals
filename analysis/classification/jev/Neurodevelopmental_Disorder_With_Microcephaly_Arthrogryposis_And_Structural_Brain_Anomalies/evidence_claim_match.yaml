          term:
            id: GO:0005635
            label: nuclear envelope
        chemical_entities:
        - preferred_term: ceramide
          term:
            id: CHEBI:17761
            label: ceramide
      selected_evidence:
        snippet: Overexpression of human Myc-tagged SMPD4 showed localization both to the outer nuclear
