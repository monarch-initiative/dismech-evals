            label: spliceosomal snRNP assembly
        protein_complexes:
        - preferred_term: SMN complex
          term:
            id: GO:0032797
            label: SMN complex
      selected_evidence:
        snippet: Gemin4 is associated in vivo with the SMN complex through a direct interaction with Gemin3.
