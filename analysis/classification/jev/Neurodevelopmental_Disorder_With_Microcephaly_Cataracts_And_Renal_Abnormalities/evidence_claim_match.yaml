      assertion:
        discussion_id: nedmcr_smn_complex_link
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do the NEDMCR missense variants impair SMN complex function and snRNP assembly in patient
          cells, and does that explain the neurological, lens and renal phenotypes?
        attaches_to:
        - pathophysiology#Impaired SMN Complex Sm-Core snRNP Assembly
        - pathophysiology#Biallelic GEMIN4 Missense Variants
        rationale: GEMIN4 knockdown reduces Sm-core assembly in HeLa cells, but no study has measured
          GEMIN4 protein levels, SMN complex composition, snRNP assembly or splicing in NEDMCR patient
          cells, and the authors of the most detailed clinical report state that the link is unclear.
          The phenotype also differs from spinal muscular atrophy, so it cannot be assumed to follow the
          same route. The snRNP assembly node is therefore left unconnected to phenotypes.
        proposed_experiments:
        - experiment_id: nedmcr_patient_cell_snrnp_assembly
          name: snRNP assembly in patient-derived cells
          description: Measure GEMIN4 protein abundance, SMN complex integrity and in vitro Sm-core assembly
            activity in patient lymphoblastoid cell lines or fibroblasts carrying p.Trp818Arg, p.Pro105Leu
            or p.His147Arg.
        - experiment_id: nedmcr_splicing_transcriptome
          name: Transcriptome-wide splicing analysis
          description: RNA-seq of patient cells or patient-allele iPSC-derived neurons to test for intron
            retention and alternative splicing changes.
      selected_evidence:
        snippet: The exact relationship between GEMIN4 pathogenic variants and the syndrome, as well as
          its potential mediation by SMN complex disruption, are unclear
        supports: SUPPORT
