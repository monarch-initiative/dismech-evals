        name: Impaired SMN Complex Sm-Core snRNP Assembly
        description: GEMIN4 is a component of the SMN complex, binding it through a direct interaction
          with Gemin3 and contacting several Sm proteins, and is required for efficient assembly of the
          Sm core onto spliceosomal snRNAs. Reduced snRNP assembly is the best-supported cellular function
          of GEMIN4, but it has not been demonstrated in NEDMCR patient cells, and no downstream splicing
          defect has been linked to any NEDMCR phenotype. The node is therefore not connected to phenotypes;
          see the nedmcr_smn_complex_link discussion.
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        genes:
