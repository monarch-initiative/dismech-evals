  62ecebcb590bf738c3c3b9f3b9e714029817634c224f9237563ecf8d3ac636f3:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder With Microcephaly, Cataracts, And Renal Abnormalities
          disease_term:
            preferred_term: neurodevelopmental disorder with microcephaly, cataracts, and renal abnormalities
            term:
              id: MONDO:0060664
              label: neurodevelopmental disorder with microcephaly, cataracts, and renal abnormalities
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic GEMIN4 Missense Variants
        description: 'Homozygous missense variants in GEMIN4 initiate the disorder. Structural modelling
          places the three reported substitutions in the helical scaffold of the protein, where they are
          predicted to destabilise the fold and may impair the accessibility of a nuclear localisation
          signal. That the variants reduce rather than abolish GEMIN4 function is an inference: complete
          loss of Gemin4 is embryonic lethal in mice, whereas patients survive into childhood. No study
          has measured GEMIN4 protein abundance or SMN complex composition in patient cells.'
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        genes:
        - preferred_term: GEMIN4
          term:
            id: hgnc:15717
            label: GEMIN4
        molecular_functions:
        - preferred_term: ribonucleoprotein complex binding
          term:
            id: GO:0043021
            label: ribonucleoprotein complex binding
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          variant_type: single nucleotide variant
          functional_impact_category: LOSS_OF_FUNCTION
          description: Germline homozygous missense variants. The loss-of-function category is supported
            by fly knockdown and by predicted structural destabilisation, not by a direct assay of the
            patient alleles.
      selected_evidence:
        snippet: The resulting structural perturbations could hamper the capability of Gemin4 to bind
          certain ligands, may affect the accessibility of NLS2, and could lead to an unstable and more
          rapidly degradable protein.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
