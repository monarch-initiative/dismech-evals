        features: Gem nuclear organelle associated protein 4, a 1058-residue predicted all-helical scaffold
          protein of the SMN complex. All disease alleles reported so far are homozygous missense variants;
          no truncating or null allele has been reported in a patient, consistent with embryonic lethality
          of Gemin4 null mice.
        variants:
        - name: c.2452T>C p.(Trp818Arg)
          description: Homozygous founder missense variant (NM_015721) reported in the founding families;
            predicted to destabilise the hydrophobic core of the C-terminal half of the protein.
          variant_type: single nucleotide variant
        - name: c.314C>T p.(Pro105Leu)
          description: Homozygous founder missense variant (NM_015721.2) first reported in an independent
            pediatric cataract family and later in further Saudi patients.
          variant_type: single nucleotide variant
        - name: c.440A>G p.(His147Arg)
          description: Homozygous missense variant in exon 2 (NM_015721) reported in two siblings from
            one consanguineous Saudi family, absent from population databases and predicted damaging;
            segregation was complete.
          variant_type: single nucleotide variant
      selected_evidence:
        snippet: This prescreening step led to the identification of 69 recessive genes not previously
          associated with disease, of which 33 are here described (SPDL1, TUBA3E, INO80, NID1, TSEN15,
          DMBX1, CLHC1, C12orf4, WDR93, ST7, MATN4, SEC24D, PCDHB4, PTPN23, TAF6, TBCK, FAM177A1, KIAA1109,
