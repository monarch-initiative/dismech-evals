        status: EMERGING
        description: The NMD-escaping p.Arg913Ter transcript is predicted to yield ZSWIM6 lacking the
          Sin3-like domain, which may interfere with the wild-type protein's repressive chromatin function.
          The proposal rests on nonsense-mediated decay escape, on the absence of convincing ZSWIM6 loss-of-function
          alleles in controls or neurodevelopmental cohorts at the time, and on an allele-specific reporter
          effect; dominant-negative interference has not been demonstrated directly.
      selected_evidence:
        snippet: Available data suggest that a heterozygous loss of ZSWIM6 does not cause ID.
        supports: SUPPORT
