      assertion_type: Pathophysiology
      assertion:
        name: ZSWIM6 Repressive Chromatin Regulation Deficit
        description: ZSWIM6 is a nuclear protein that loosely associates with chromatin and co-immunoprecipitates
          with the repressive chromatin regulators SUZ12 and HDAC1 and with histone H3. Conditional deletion
          of Zswim6 in mouse ventral telencephalic progenitors broadly increases chromatin accessibility
          at promoters and enhancers in striatum and biases transcription toward up-regulation, consistent
          with a role in establishing repressive chromatin. The data are from heterologous cells and mouse
          knockouts; whether the human truncation produces the same deficit is untested.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: ZSWIM6
          term:
            id: hgnc:29316
            label: ZSWIM6
        molecular_functions:
        - preferred_term: chromatin binding
          term:
            id: GO:0003682
            label: chromatin binding
        biological_processes:
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: DYSREGULATED
        locations:
        - preferred_term: striatum
          term:
            id: UBERON:0002435
            label: striatum
      selected_evidence:
        snippet: We found that both SUZ12 and HDAC1 immunoprecipitated with Flag-tagged ZSWIM6 but were
          not detected in control immunoprecipitation (IPs) performed in mock-transfected cells
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
