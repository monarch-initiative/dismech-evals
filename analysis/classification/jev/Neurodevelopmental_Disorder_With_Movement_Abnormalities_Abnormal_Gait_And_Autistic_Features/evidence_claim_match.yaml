            description: The recurrent c.2737C>T (p.Arg913Ter) premature stop codon lies in penultimate
              exon 13, 48 bp upstream of the last exon junction. In lymphoblastoid cells from an affected
              individual the variant transcript is not degraded by nonsense-mediated decay and total ZSWIM6
              mRNA is not reduced. The predicted product is a ZSWIM6 protein lacking the C-terminal Sin3-like
              domain; the truncated protein itself could not be detected with the available antibody,
              so its existence is inferred from the transcript data.
            biological_scale: MOLECULAR
            genetic_context:
              variant_origin: DE_NOVO
              zygosity: HETEROZYGOUS
              description: Heterozygous de novo NM_020928 c.2737C>T, p.Arg913Ter, penultimate exon.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: ZSWIM6 Repressive Chromatin Regulation Deficit
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        hypothesis_groups:
        - truncated_zswim6_dominant_negative
        description: A Sin3-like-domain-deficient ZSWIM6 is proposed to interfere with ZSWIM6-dependent
          transcriptional repression. In a reporter assay the p.Arg913Ter protein derepressed the HECW2
          promoter, but no study has yet measured chromatin state in human cells carrying the variant.
      selected_evidence:
        snippet: This finding supports the existence of a truncated ZSWIM6 protein lacking the Sin3-like
          domain, which could have a dominant-negative effect.
        supports: SUPPORT
        directness: INDIRECT
