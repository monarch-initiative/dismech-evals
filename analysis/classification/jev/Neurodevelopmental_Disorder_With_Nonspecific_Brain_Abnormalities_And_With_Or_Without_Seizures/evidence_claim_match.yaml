      assertion_type: Pathophysiology
      assertion:
        name: DLL1 Haploinsufficiency
        description: Heterozygous loss-of-function variants in DLL1 (nonsense, splice-site, missense in
          the DSL domain, and whole-gene deletion) reduce the functional dosage of the Delta-like 1 Notch
          ligand. Premature stop codons are predicted to trigger nonsense-mediated decay, and DLL1 is
          strongly constrained against loss of function (gnomAD pLI = 1.0), indicating that one functional
          copy is insufficient.
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          zygosity: HETEROZYGOUS
        molecular_functions:
        - preferred_term: Notch ligand (Notch binding) activity
          modifier: DECREASED
          term:
            id: GO:0005112
            label: Notch binding
      selected_evidence:
        snippet: This method identified 15 individuals from 12 unrelated families with heterozygous pathogenic
          DLL1 variants (nonsense, missense, splice site, and one whole gene deletion).
        supports: SUPPORT
        directness: DIRECT
