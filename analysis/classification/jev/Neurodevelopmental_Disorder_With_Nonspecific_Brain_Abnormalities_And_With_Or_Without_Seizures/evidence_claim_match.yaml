      explanation: The structural brain malformations in a fetal 6q27-terminal-deletion series are consistent
        with a contribution of DLL1 loss. These are contiguous-gene deletions that remove many genes besides
        DLL1, so this is supporting context for the convergence of brain malformations on the 6q27/DLL1
        locus, not direct evidence that DLL1 loss alone drives them.
