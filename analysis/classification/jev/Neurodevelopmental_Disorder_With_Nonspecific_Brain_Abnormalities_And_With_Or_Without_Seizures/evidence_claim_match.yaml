            term:
              id: MONDO:0032877
              label: neurodevelopmental disorder with nonspecific brain abnormalities and with or without
                seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced DLL1 Notch Ligand Dosage
        description: 'The reduced amount of functional Delta-like 1 lowers the availability of this transmembrane
          ligand in the tissues where DLL1 drives Notch signaling: the neural progenitor compartment of
          the developing brain, and the presomitic mesoderm during somite segmentation. DLL1 is highly
          expressed in neuronal precursor cells during embryogenesis, and Notch output is highly sensitive
          to relative ligand dosage. This dosage reduction therefore feeds both a neural and a paraxial-mesoderm
          branch of the pathology.'
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: 'DLL1 (MIM: 606582) is highly expressed in neuronal precursor cells during embryogenesis.'
        supports: SUPPORT
        directness: INDIRECT
    origin:
