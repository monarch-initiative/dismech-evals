        gene_term:
          preferred_term: DLL1
          term:
            id: hgnc:2908
            label: DLL1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Heterozygous loss-of-function variants in DLL1 cause the disorder by haploinsufficiency.
          The spectrum comprises nonsense, canonical splice-site, and missense variants plus a whole-gene
          deletion; variants are de novo in some families and inherited from an affected parent in others.
          The single missense variant (p.Cys179Phe) affects a conserved cysteine of the DSL domain and
          is predicted to disrupt folding and Notch signaling. No external gene-disease validity classification
          (e.g. ClinGen) was located for this pair at curation time; evidence rests on the Fischer-Zirnsak
          cohort.
      selected_evidence:
        snippet: This method identified 15 individuals from 12 unrelated families with heterozygous pathogenic
          DLL1 variants (nonsense, missense, splice site, and one whole gene deletion).
