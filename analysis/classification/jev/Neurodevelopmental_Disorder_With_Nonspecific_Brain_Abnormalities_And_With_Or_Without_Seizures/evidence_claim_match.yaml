          term:
            id: GO:0007219
            label: Notch signaling pathway
      selected_evidence:
        snippet: Cell-cell contact-mediated Notch receptor-ligand interactions release the Notch intracellular
          domain (NICD), which enters the nucleus and stimulates transcription of target genes.
