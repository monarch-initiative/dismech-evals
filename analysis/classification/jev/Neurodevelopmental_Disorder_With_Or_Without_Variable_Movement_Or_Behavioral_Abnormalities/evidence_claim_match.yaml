          and missense) reduce SK2 channel activity. Five of six variants tested by patch clamp in the
          founding series caused loss of function. In HEK293 cells, channels carrying pathogenic missense
          changes give no measurable current, and pore-lining mutants also suppress co-expressed wild-type
          SK2, so a dominant-negative effect may add to haploinsufficiency for some missense alleles.
          In a C. elegans knock-in study most disease variants behaved as loss of function, but I359M
          behaved as gain of function, so the direction of effect is not settled for every allele.
