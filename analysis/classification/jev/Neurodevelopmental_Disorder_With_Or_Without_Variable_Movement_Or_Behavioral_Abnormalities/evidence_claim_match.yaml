              label: neurodevelopmental disorder with or without variable movement or behavioral abnormalities
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous KCNN2 Loss of Function
        description: Heterozygous KCNN2 variants (frameshift, nonsense, splice site, in-frame deletion
          and missense) reduce SK2 channel activity. Five of six variants tested by patch clamp in the
          founding series caused loss of function. In HEK293 cells, channels carrying pathogenic missense
          changes give no measurable current, and pore-lining mutants also suppress co-expressed wild-type
          SK2, so a dominant-negative effect may add to haploinsufficiency for some missense alleles.
          In a C. elegans knock-in study most disease variants behaved as loss of function, but I359M
          behaved as gain of function, so the direction of effect is not settled for every allele.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: KCNN2
          term:
            id: hgnc:6291
            label: KCNN2
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: small conductance calcium-activated potassium channel activity
          modifier: DECREASED
          term:
            id: GO:0016286
            label: small conductance calcium-activated potassium channel activity
      selected_evidence:
        snippet: No measurable current was detected from HEK293 cells heterologously expressing these
          pathogenic KCa2.2 mutants.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
