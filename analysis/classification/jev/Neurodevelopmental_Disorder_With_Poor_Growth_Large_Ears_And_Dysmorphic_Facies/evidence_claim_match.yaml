        description: ZNF668 is a nucleolar protein that binds MDM2 and p53 and limits MDM2-mediated ubiquitination
          and degradation of p53. Its loss lowers basal p53 and blunts p53 stabilization after DNA damage.
          This was characterized as a tumor-suppressor function in breast cancer cells; whether it contributes
          to the neurodevelopmental disorder is unknown.
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: Through MDM2 binding, ZNF668 regulated autoubiquitination of MDM2 and its ability to
          mediate p53 ubiquitination and degradation.
        supports: SUPPORT
