      assertion_type: Pathophysiology
      assertion:
        name: Biallelic EXOC7 Partial Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic hypomorphic EXOC7 variants reduce functional Exo70. The best characterised
          allele, c.809-2A>G, halves EXOC7 protein. Exo70 is the exocyst subunit that binds phosphatidylinositol
          4,5-bisphosphate at the plasma membrane, and its N-terminal region, where Ser48 lies, binds
          EXOC8. Both activities are reduced when the protein is reduced; which of them each missense
          or in-frame allele impairs has not been measured.

          '
        genes:
        - preferred_term: EXOC7
          term:
            id: hgnc:23214
            label: EXOC7
        molecular_functions:
        - preferred_term: phosphatidylinositol-4,5-bisphosphate binding
