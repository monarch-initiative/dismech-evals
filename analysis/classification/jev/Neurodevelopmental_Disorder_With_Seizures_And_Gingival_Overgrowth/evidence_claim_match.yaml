  5ddb5e2c491d59822ab0b3b1ea25cd08e85c64bd63693e2c1686409422cc41a1:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder With Seizures And Gingival Overgrowth
          disease_term:
            preferred_term: neurodevelopmental disorder with seizures and gingival overgrowth
            term:
              id: MONDO:0859148
              label: neurodevelopmental disorder with seizures and gingival overgrowth
        context: []
      assertion_type: Genetic
      assertion:
        name: TBC1D2B
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: TBC1D2B (15q24.3-q25.1) encodes TBC1 domain family member 2B. Causality rests on biallelic
          predicted or shown loss-of-function variants in more than ten unrelated families from several
          ancestries, affected siblings sharing the genotype in four families (with heterozygous parents
          shown in three), absent or reduced TBC1D2B protein in patient fibroblasts, and a consistent
          phenotype. This is strong human genetic evidence, but functional data come from patient fibroblasts
          and a knockout HeLa line only, and no animal model exists. No ClinGen gene-disease validity
          record for TBC1D2B was found in the local ClinGen cache (cache/clingen/gene_validity.csv, export
          of 2026-01-24), so gene_disease_validity is left absent. A heterozygous TBC1D2B missense variant
          (p.Tyr824Cys) co-segregating with a KREMEN2 variant in a Cambodian family with isolated hereditary
          gingival fibromatosis is a separate, unconfirmed observation and is not part of this recessive
          disease.
        gene_term:
          preferred_term: TBC1D2B
          term:
            id: hgnc:29183
            label: TBC1D2B
        variants:
        - name: c.360+1G>T
          description: 'Homozygous intron 1 splice-donor variant in two Turkish siblings. It activates
            a cryptic donor 33 bp upstream, and total TBC1D2B mRNA in leukocytes falls to 15-21% of control.

            '
        - name: p.Arg862Cys
          description: 'The only reported missense allele, in the RABGAP domain, found in trans with p.Arg920*.
            The missense protein appears stable, and the authors suggest it may have impaired GAP activity;
            this has not been measured.

            '
      selected_evidence:
        snippet: We report biallelic loss-of-function variants in TBC1D2B, encoding a member of the TBC/RABGAP
          family with yet unknown function, as the underlying cause of cognitive impairment, seizures,
          and/or gingival overgrowth in three individuals from unrelated families.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32623794
      reference_title: Biallelic loss-of-function variants in TBC1D2B cause a neurodevelopmental disorder
        with seizures and gingival overgrowth.
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: Defining report, three unrelated families.
