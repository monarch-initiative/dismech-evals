              label: neurodevelopmental disorder with seizures and gingival overgrowth
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide, cases reported in the literature
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'Published patients with biallelic TBC1D2B variants: three in the 2020 defining report,
          two brothers in 2022, five more in 2024 (the 2024 series pools these into ten subjects from
          eight families), one Thai girl reported under the label Ramon syndrome in 2024, four children
          from one consanguineous Turkish family in 2025, three patients from two families in 2026, and
          one further 2026 case report whose text was not retrievable. That is about 22 individuals from
          about 13 families. The 2025 Turkish family carries p.(Phe108Ter), not the c.360+1G>T splice
          variant of the Turkish siblings in the 2024 series, so it is a separate family; its abstract
          does not say whether any patient was reported before. No population estimate exists.'
      selected_evidence:
        snippet: Here, we report five new subjects with biallelic TBC1D2B variants, including two siblings,
          and delineate the molecular and clinical features in the ten subjects known to date.
        supports: SUPPORT
