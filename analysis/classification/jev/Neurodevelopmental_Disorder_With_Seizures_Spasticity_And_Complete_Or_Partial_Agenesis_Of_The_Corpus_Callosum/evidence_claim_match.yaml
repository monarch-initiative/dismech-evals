      assertion:
        name: Angelman syndrome
        description: The founding study screened patients with Angelman-like presentations and frames
          both HECTD4 and UBE3C disorders as overlapping with Angelman syndrome, which is caused by loss
          of the HECT E3 ligase UBE3A.
        disease_term:
          preferred_term: Angelman syndrome
          term:
            id: MONDO:0007113
            label: Angelman syndrome
        distinguishing_features:
        - Abnormal 15q11-q13 methylation or a UBE3A variant rather than biallelic HECTD4 variants.
        - Corpus callosum agenesis is not a characteristic Angelman finding.
      selected_evidence:
        snippet: HECTD4 and UBE3C are novel biallelic rare disease genes, expand the association of the
          other HECT E3 ligase group with neurodevelopmental syndromes, and could explain some of the
          missing heritability in patients with a suggestive clinical diagnosis of Angelman syndrome.
        supports: SUPPORT
