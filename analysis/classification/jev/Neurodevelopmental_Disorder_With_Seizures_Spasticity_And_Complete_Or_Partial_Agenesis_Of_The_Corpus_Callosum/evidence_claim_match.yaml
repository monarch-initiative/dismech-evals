      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: glun2b_excitability
        hypothesis_label: GluN2B hyperactivation after loss of HECTD4 ubiquitination
        status: EMERGING
        description: In cultured nerve cells HECTD4 knockdown lowers GluN2B and MALT1 ubiquitination and
          raises GluN2B phosphorylation and intracellular calcium. If the same happens in the developing
          brain of patients, excess GluN2B-containing NMDA receptor signalling could contribute to seizures
          or to abnormal circuit development. Neither step has been tested; the supporting data come from
          an ischemic injury model.
      selected_evidence:
        snippet: Reverse-phase nano-liquid chromatography-tandem mass spectrometry has revealed an interaction
          between GluN2B and HECT domain E3 ubiquitin protein ligase 4 (HECTD4), an E3 ubiquitin ligase
          highly expressed in the brain.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
