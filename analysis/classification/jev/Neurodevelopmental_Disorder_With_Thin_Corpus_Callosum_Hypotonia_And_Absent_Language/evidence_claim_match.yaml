        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic EEF1D Loss of Function
        description: Biallelic truncating, splice-site or missense variants in EEF1D. The first variants
          reported, in consanguineous families from Iran and Turkey, truncate the exon unique to the long
          isoform and so remove eEF1BdeltaL while sparing the short translation-factor isoforms. Variants
          reported later lie in the C-terminal guanine nucleotide exchange domain that all isoforms share.
          Most patients are homozygous; one Chinese patient was compound heterozygous for a splice variant
          and a long-isoform nonsense variant. The two activities bound below are those of the two EEF1D
          products, the exchange activity of the short isoforms and the DNA-binding transcription factor
          activity of eEF1BdeltaL; which one a given variant removes depends on where it lies, and the
          two downstream nodes carry that distinction.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: EEF1D
          term:
            id: hgnc:3211
            label: EEF1D
        molecular_functions:
        - preferred_term: eEF1B guanine nucleotide exchange activity for eEF1A
          term:
            id: GO:0005085
            label: guanyl-nucleotide exchange factor activity
        - preferred_term: eEF1BdeltaL heat-shock element binding transcription factor activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
      selected_evidence:
        snippet: Of these, 14 were homozygous and truncating in GRM7, STX1A, CCAR2, EEF1D, GALNT2, SLC44A1,
          LRRIQ3, AMZ2, CLMN, SEC23IP, INIP, NARG2, FAM234B, and TRAP1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
