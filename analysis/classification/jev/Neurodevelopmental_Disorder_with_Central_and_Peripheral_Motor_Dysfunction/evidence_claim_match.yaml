        context: []
      assertion_type: Genetic
      assertion:
        name: NFASC
        gene_term:
          preferred_term: NFASC
          term:
            id: hgnc:29866
            label: NFASC
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: NFASC (1q32.1) encodes neurofascin. Alternative splicing gives the glial isoform NF155
          (paranodal, with a third fibronectin type III repeat) and the neuronal isoforms NF186 and NF140
          (nodal and axon initial segment). Reported homozygous variants include p.Arg831Ter (NF155-specific),
          the frameshifts p.Pro939Ter and p.Pro924ArgfsTer35, the splice variant c.3020-1G>A (skips exon
          26, removing full-length NF186), and missense variants p.Asn130Asp, p.Arg359Pro, p.Pro694Thr,
          p.Ser820Pro, p.Val1077Ala and p.Val1122Glu.
      selected_evidence:
        snippet: The genetic disease caused by biallelic NFASC variants includes neurodevelopmental impairment
          and a spectrum of central and peripheral demyelination as part of its core clinical phenotype.
        supports: SUPPORT
