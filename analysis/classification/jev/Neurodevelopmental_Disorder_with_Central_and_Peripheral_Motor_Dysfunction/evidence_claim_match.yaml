              label: neurodevelopmental disorder with central and peripheral motor dysfunction
        context: []
      assertion_type: Subtype
      assertion:
        name: NF186-predominant
        display_name: NF186 (neuronal isoform)-predominant NFASC disease
        description: Variants that abolish full-length neuronal NF186 (the exon 26 splice acceptor variant
          c.3020-1G>A) or reduce total neurofascin through a transmembrane-domain missense variant (p.Val1122Glu).
          The presentation is a childhood-onset, progressive cerebellar ataxia with dysarthria, nystagmus
          and weakness, normal or near-normal cognition in some individuals, and normal or only mildly
          slowed nerve conduction.
      selected_evidence:
        snippet: identified a novel homozygous splice mutation (c.3020-1G > A) in neurofascin (NFASC).
          In RNA extracted from fibroblasts, we showed that the mutation resulted in inframe skipping
          of exon 26, with a deprived expression of the full-length transcript that corresponds to NFASC
          isoform NF186.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31608123
      reference_title: Ataxia in Patients With Bi-Allelic NFASC Mutations and Absence of Full-Length NF186.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Defines the neuronal-isoform genotype: selective loss of full-length NF186.'
