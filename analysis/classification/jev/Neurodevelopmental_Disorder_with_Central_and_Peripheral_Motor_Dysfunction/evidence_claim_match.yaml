              label: neurodevelopmental disorder with central and peripheral motor dysfunction
        context: []
      assertion_type: Subtype
      assertion:
        name: NF155-predominant
        display_name: NF155 (glial isoform)-predominant NFASC disease
        description: 'Variants that abolish or destabilise the glial NF155 isoform, including the NF155-specific
          nonsense variant p.Arg831Ter in the third fibronectin type III repeat, the frameshift p.Pro939Ter,
          and missense variants in the fibronectin type III repeats. Neuronal NF186 is preserved at the
          node. This is the common presentation: neonatal hypotonia, severe developmental delay, areflexia
          and demyelinating neuropathy with loss of the paranodal junction.'
      selected_evidence:
        snippet: The variant creates a premature stop codon in 3 out of four NFASC human transcripts and
          is predicted to specifically eliminate Nfasc155 leaving neuronal Neurofascin intact.
        supports: SUPPORT
