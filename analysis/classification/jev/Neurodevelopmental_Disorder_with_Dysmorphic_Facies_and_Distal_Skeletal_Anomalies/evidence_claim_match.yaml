        disease_term:
          preferred_term: OTUD6B-related intellectual developmental disorder
          term:
            id: MONDO:0044319
            label: intellectual developmental disorder with dysmorphic facies, seizures, and distal limb
              anomalies
        description: 'An autosomal recessive syndromic intellectual disability caused by biallelic OTUD6B
          variants, sharing facial dysmorphism, distal limb anomalies, and seizures with this disorder.
          Crucially, the two are not merely confusable: PMID:34680978 reports a single 5-year-old girl
          who genuinely carries disease-relevant variants at BOTH loci — a hemizygous OTUD6B c.873delA
          over a paternally inherited 8q21.3 whole-gene deletion, together with a heterozygous ZMIZ1 c.1491+2T>C
          splice variant shown by mRNA study to skip exon 14. Finding a ZMIZ1 variant therefore does not
          exclude OTUD6B disease, and vice versa.'
        distinguishing_features:
        - 'Inheritance: OTUD6B disease is autosomal recessive (biallelic), this disorder is autosomal
          dominant (heterozygous). This alone usually separates them on a trio exome.'
        - 'Molecular: OTUD6B is a deubiquitinase; ZMIZ1 is a transcriptional coactivator and SUMO E3 ligase.
          No shared mechanism, so evidence must not be pooled across the two entries.'
        notes: 'Attribution rule applied in this entry: no phenotype from the dual-genotype PMID:34680978
          proband is curated here, and every citation to that paper is marked with the confound explicitly.
          The reciprocal caveat is recorded in the dismech OTUD6B-Related Neurodevelopmental Disorder
          entry, which curates that proband''s Williams syndrome-like features (periorbital edema, hanging
          cheek, long and smooth philtrum) and polydactyly with the same dual-genotype confound recorded
          on its evidence.'
      selected_evidence:
        snippet: The OTUD6B and ZMIZ1 genes were recently identified as causes of syndromic intellectual
          disability (ID) with shared phenotypes of facial dysmorphism, distal limb anomalies, and seizure
          disorders.
        supports: SUPPORT
