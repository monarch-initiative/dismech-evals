          indicated rather than optional, because a transmitting parent may be only mildly affected and
          would otherwise be missed — the family reported with c.1310delC included an affected father
          identified only after his sons were diagnosed. Prenatal diagnosis by exome sequencing on amniotic
          fluid has been performed successfully.
