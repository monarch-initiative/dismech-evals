          intellectual disability and autism. Loss of ZMIZ1 function changes the transcriptional programs
          governing neurogenesis, neuronal differentiation, and synaptic signaling. In a forebrain-specific
          Zmiz1 knockout mouse, ZMIZ1 was shown by RNA-seq and ChIP-seq to regulate key neurodevelopmental
