            term:
              id: MONDO:0032855
              label: neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Developmental Transcriptional Programs
        description: ZMIZ1 is most highly expressed during embryonic brain development in both mouse and
          human and is enriched in cortex, hippocampus, and cerebellum — the regions most implicated in
          intellectual disability and autism. Loss of ZMIZ1 function changes the transcriptional programs
          governing neurogenesis, neuronal differentiation, and synaptic signaling. In a forebrain-specific
          Zmiz1 knockout mouse, ZMIZ1 was shown by RNA-seq and ChIP-seq to regulate key neurodevelopmental
          effectors including Lhx2, Auts2, and EfnB2, and the ZMIZ1 interaction network is enriched for
          autism-associated genes. Because the same coactivator serves NOTCH1, AR, p53, and SMAD3/4 in
          non-neural tissue, the same lesion perturbs craniofacial, skeletal, cardiac, and genitourinary
          developmental programs, which is why the disorder is syndromic rather than purely neurological.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: ABNORMAL
        - preferred_term: neurogenesis
          term:
            id: GO:0022008
            label: neurogenesis
          modifier: ABNORMAL
        - preferred_term: skeletal system development
          term:
            id: GO:0001501
            label: skeletal system development
          modifier: ABNORMAL
        - preferred_term: ephrin receptor signaling pathway
          term:
            id: GO:0048013
            label: ephrin receptor signaling pathway
          modifier: DECREASED
        mechanism_confidence: ESTABLISHED
        notes: 'Confidence calibration: the coactivator-to-transcriptional-output link is established
          biology and is reinforced in humans by the severe loss-of-function constraint on ZMIZ1, but
          every direct readout of the dysregulated programs cited here is model-organism data (mouse RNA-seq
          and ChIP-seq). No patient-derived transcriptomic or methylation signature has been published,
          so the human specificity of the affected programs is inferred rather than measured.'
      selected_evidence:
        snippet: Our analysis reveals that Zmiz1 regulates multiple developmental processes, including
          neurogenesis, neuron connectivity, and synaptic signaling.
        supports: SUPPORT
