            term:
              id: MONDO:0032855
              label: neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing
        description: 'Diagnosis rests on identification of a heterozygous pathogenic ZMIZ1 variant. In
          practice every reported diagnosis has come from exome sequencing or a broad multigene panel
          rather than from targeted single-gene testing, because the clinical gestalt is not specific
          enough to prompt a directed test. Chromosomal microarray and structural-variant analysis remain
          relevant because balanced translocations disrupting ZMIZ1 or its regulatory region also cause
          the disorder and are invisible to standard exome analysis. Trio testing is preferred: most variants
          are de novo, and where they are not, the transmitting parent may be only mildly affected and
          requires targeted testing to identify.'
      selected_evidence:
        snippet: parental testing to identify a mildly affected parent is needed
        supports: SUPPORT
