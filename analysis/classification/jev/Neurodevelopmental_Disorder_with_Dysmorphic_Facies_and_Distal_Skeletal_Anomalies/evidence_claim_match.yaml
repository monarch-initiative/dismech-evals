        gene_term:
          preferred_term: ZMIZ1
          term:
            id: hgnc:16493
            label: ZMIZ1
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        association: Heterozygous ZMIZ1 variants are the sole established cause of NEDDFSA. The gene lies
          at 10q22.3, spans 21 exons, and encodes a 1067-amino-acid PIAS-family transcriptional coactivator.
          Most pathogenic alleles arise de novo; germline transmission from a mildly affected parent is
          documented. ZMIZ1 is highly constrained against loss of function in population data (observed/expected
          0.13).
        notes: 'Reported allele classes: missense substitutions (e.g. c.2330G>A p.Gly777Glu in the SP-RING/MIZ
          zinc finger; c.881C>T p.Thr294Ile, c.899C>T p.Thr300Met, and c.910G>C p.Ala304Pro in the alanine-rich
          region), in-frame deletion (c.858_875del p.Val288_Ala293del), frameshifting truncations (c.1310delC
          p.Pro437ArgfsX84; c.2633dup p.Gly879ArgfsTer22), a canonical splice-site variant causing exon
          14 skipping (c.1491+2T>C), and balanced translocations disrupting ZMIZ1 or a ZMIZ1 regulatory
          region. Three caveats attach to the c.1491+2T>C splice allele and it should not be read as an
          established pathogenic class: it comes from the dual-genotype PMID:34680978 proband who also
          carries an OTUD6B frameshift over a paternally inherited 0.118 Mb 8q21.3 deletion involving
          OTUD6B; it was inherited from her father, whose phenotype that report does not characterize;
          and the 2025 domain-resolved re-analysis explicitly excluded splice donor/acceptor variants
          from its curated set. It is listed here as a molecular observation only.'
      selected_evidence:
        snippet: The zinc finger MIZ-type containing 1 gene (ZMIZ1) is a causative gene of NEDDFSA that
          encodes a protein inhibitor of the activated STAT-like family transcriptional regulator.
        supports: SUPPORT
