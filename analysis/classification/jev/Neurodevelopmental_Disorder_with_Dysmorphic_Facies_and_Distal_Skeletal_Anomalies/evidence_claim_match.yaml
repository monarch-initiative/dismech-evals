  ecded925285006247a31f085736a0e302929370fee3ad7e2342e7d4f7e42916e:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with Dysmorphic Facies and Distal Skeletal Anomalies
          disease_term:
            preferred_term: ZMIZ1-related neurodevelopmental disorder (NEDDFSA)
            term:
              id: MONDO:0032855
              label: neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous ZMIZ1 Variant
        description: 'A single heterozygous variant in ZMIZ1 (10q22.3) is the initiating lesion. Reported
          alleles are overwhelmingly de novo and are distributed across the coding sequence but cluster
          in functionally defined regions: the N-terminal tetratricopeptide repeat (TPR) that mediates
          NOTCH1 binding, the central intrinsically disordered alanine-rich motif, the proline-rich domains,
          the SP-RING/MIZ zinc finger, and the C-terminal transactivation domain. Both missense substitutions
          and frameshifting truncations occur, and structural lesions (balanced translocations disrupting
          ZMIZ1 or its regulatory region) have also been reported. ZMIZ1 is strongly constrained against
          loss-of-function variation in population data, consistent with dosage sensitivity. Functional
          consequences documented so far are nonetheless heterogeneous: an alanine-rich in-frame deletion
          reduced mutant protein abundance, whereas a different alanine-rich missense allele increased
          ZMIZ1 expression and mislocalized the protein, so a simple haploinsufficiency model does not
          account for every allele. The latter measurement comes from transfected constructs in skeletal
          muscle and HEK293T cells rather than endogenous patient cells, so it more plausibly reports
          altered protein stability than patient-level upregulation.'
        biological_scale: MOLECULAR
        gene:
          preferred_term: ZMIZ1
          term:
            id: hgnc:16493
            label: ZMIZ1
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: Of these 19, 14 unrelated subjects carried de novo heterozygous single-nucleotide variants
          (SNVs) or single-base insertions/deletions, 3 siblings harbored a heterozygous single-base insertion,
          and 2 subjects had a balanced translocation disrupting ZMIZ1 or involving a regulatory region
          of ZMIZ1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30639322
      reference_title: ZMIZ1 Variants Cause a Syndromic Neurodevelopmental Disorder.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the heterozygous, largely de novo allelic architecture and the existence
        of structural as well as point lesions.
