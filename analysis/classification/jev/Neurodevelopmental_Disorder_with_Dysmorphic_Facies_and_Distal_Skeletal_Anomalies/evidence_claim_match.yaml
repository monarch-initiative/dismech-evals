            term:
              id: MONDO:0032855
              label: neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        description: 'Disease results from a single heterozygous ZMIZ1 allele. The great majority of reported
          variants arose de novo, but vertical transmission is established: a father and his two sons
          all carry the same pathogenic frameshift allele c.1310delC (p.Pro437ArgfsX84). Expressivity
          within that family was markedly variable — severity of intellectual disability and eyelid ptosis
          differed between affected members and only one of the two children had sensorineural hearing
          loss — so a mildly affected transmitting parent can easily be missed without targeted parental
          testing.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        expressivity: VARIABLE
      selected_evidence:
        snippet: NEDDFSA is caused by heterozygous pathogenic variants in the ZMIZ1 gene on chromosome
          10q22.3 with autosomal dominant (AD) mode of inheritance.
        supports: SUPPORT
