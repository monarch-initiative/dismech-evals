            description: The cellular consequence in the developing cortex, comprising reduced progenitor
              output, impaired neuronal differentiation and dendritic outgrowth, and abnormal neuronal
              positioning. The two mouse paradigms disagree on the positioning component and that disagreement
              is curated explicitly rather than smoothed over. In utero electroporation of patient ZMIZ1
              mutant alleles into cortical progenitors produced abnormal pyramidal neuron morphology,
              polarization, and positioning, with mispositioned neurons accumulating in the ventricular,
              subventricular, and intermediate zones and depleted from the upper cortical plate. The complementary
              forebrain-specific Zmiz1 knockout reproduced cortical microcephaly, corpus callosum dysgenesis,
              and abnormal differentiation of upper-layer neurons, but its BrdU birthdating showed the
              surviving neurons were correctly positioned, so in that model microcephaly arises from reduced
              progenitor proliferation and neurogenesis rather than from a migration defect. The likeliest
              reconciliation is that the positioning phenotype is specific to the overexpression paradigm
              (see the neddfsa_allele_mechanism_direction discussion); note, however, that the human data
              independently support a positioning abnormality — cortical heterotopias were found at autopsy
              in one adult and on MRI in a majority of imaged patients. The dendritic outgrowth deficit
              in the knockout is rescued by reactivating the ephrin-B2 pathway, identifying a specific
