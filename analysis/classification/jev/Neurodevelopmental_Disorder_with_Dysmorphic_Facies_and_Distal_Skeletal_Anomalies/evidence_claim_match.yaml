  a2dcf99672f20c5ac5d94130410ca0ff255e372dc2c25935908561e9bc4883d4:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with Dysmorphic Facies and Distal Skeletal Anomalies
          disease_term:
