  8bfea0a664271a28596612b54cd2c58b81e97bab9a93584ce01df8cfed44bb36:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with Dysmorphic Facies and Distal Skeletal Anomalies
          disease_term:
            preferred_term: ZMIZ1-related neurodevelopmental disorder (NEDDFSA)
            term:
              id: MONDO:0032855
              label: neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Cortical Neurogenesis, Neuronal Differentiation, and Positioning
        description: The cellular consequence in the developing cortex, comprising reduced progenitor
          output, impaired neuronal differentiation and dendritic outgrowth, and abnormal neuronal positioning.
          The two mouse paradigms disagree on the positioning component and that disagreement is curated
          explicitly rather than smoothed over. In utero electroporation of patient ZMIZ1 mutant alleles
          into cortical progenitors produced abnormal pyramidal neuron morphology, polarization, and positioning,
          with mispositioned neurons accumulating in the ventricular, subventricular, and intermediate
          zones and depleted from the upper cortical plate. The complementary forebrain-specific Zmiz1
          knockout reproduced cortical microcephaly, corpus callosum dysgenesis, and abnormal differentiation
          of upper-layer neurons, but its BrdU birthdating showed the surviving neurons were correctly
          positioned, so in that model microcephaly arises from reduced progenitor proliferation and neurogenesis
          rather than from a migration defect. The likeliest reconciliation is that the positioning phenotype
          is specific to the overexpression paradigm (see the neddfsa_allele_mechanism_direction discussion);
          note, however, that the human data independently support a positioning abnormality — cortical
          heterotopias were found at autopsy in one adult and on MRI in a majority of imaged patients.
          The dendritic outgrowth deficit in the knockout is rescued by reactivating the ephrin-B2 pathway,
          identifying a specific and in principle tractable effector arm; transcriptomically the same
          model disrupts synaptic-signaling gene programs.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cortical pyramidal (projection) neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        - preferred_term: cortical neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        biological_processes:
        - preferred_term: regulation of neurogenesis
          term:
            id: GO:0050767
            label: regulation of neurogenesis
          modifier: DECREASED
        - preferred_term: neuron migration
          term:
            id: GO:0001764
            label: neuron migration
          modifier: ABNORMAL
        - preferred_term: neuron differentiation
          term:
            id: GO:0030182
            label: neuron differentiation
          modifier: ABNORMAL
        - preferred_term: dendrite development
          term:
            id: GO:0016358
            label: dendrite development
          modifier: DECREASED
        - preferred_term: cerebral cortex development
          term:
            id: GO:0021987
            label: cerebral cortex development
          modifier: ABNORMAL
        - preferred_term: corpus callosum development
          term:
            id: GO:0022038
            label: corpus callosum development
          modifier: ABNORMAL
        - preferred_term: synaptic signaling
          term:
            id: GO:0099536
            label: synaptic signaling
          modifier: ABNORMAL
        mechanism_confidence: ESTABLISHED
        notes: The neuron migration annotation on this node is deliberately retained but is contested
          in mouse. It is supported by the in utero electroporation overexpression paradigm and by the
          human cortical heterotopias, and is explicitly refuted by BrdU birthdating in the forebrain-specific
          knockout, where migration was intact and microcephaly was attributable to reduced progenitor
          output. Both directions are curated as evidence items on this node.
      selected_evidence:
        snippet: In vivo, overexpression of ZMIZ1 mutant alleles in developing mouse brains using in utero
          electroporation resulted in abnormal pyramidal neuron morphology, polarization, and positioning,
          underscoring the importance of ZMIZ1 in neural development
        supports: SUPPORT
