        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Craniofacial and Distal Skeletal Patterning
        description: The non-neural developmental arm that gives the syndrome its name. ZMIZ1 is expressed
          broadly in embryonic tissues beyond brain — including limb-forming mesoderm, heart, and kidney
          — and coactivates NOTCH1 and SMAD3/4, both central to craniofacial and appendicular skeletal
          morphogenesis. The clinical result is a recognizable dysmorphic facial pattern together with
          distal skeletal anomalies of the hands and feet, joint hypermobility, and hip dysplasia; prenatally
          the same program failure can present as short femur with intrauterine growth restriction. The
          specific ZMIZ1 target genes responsible have not been identified, and no skeletal-tissue model
          of the disorder exists, so this node is provisional relative to the well-worked cortical arm.
          The one direct functional study in a non-neural cell type (human skeletal muscle cells) showed
          a patient allele altering proliferation and migration and dysregulating TGF-beta1 pathway genes,
          which is suggestive but is muscle rather than cartilage or bone.
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: skeletal system development
          term:
            id: GO:0001501
            label: skeletal system development
          modifier: ABNORMAL
        - preferred_term: transforming growth factor beta receptor signaling pathway
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: ABNORMAL
        cell_types:
        - preferred_term: skeletal muscle cell
          term:
            id: CL:0000188
            label: cell of skeletal muscle
        mechanism_confidence: PROVISIONAL
        notes: Marked PROVISIONAL deliberately. The link from ZMIZ1 coactivator loss to the craniofacial
          and distal skeletal phenotype is inferred from the clinical pattern plus the known NOTCH1/SMAD
          partnership; unlike the cortical arm it has no dedicated in vivo skeletal model and no identified
          target genes. See the neddfsa_skeletal_arm_unmodeled discussion. The node also deliberately
          keeps the craniofacial (cranial-neural-crest) and appendicular (limb-mesenchyme) programs together,
          because no evidence yet distinguishes them in this disorder; splitting them should follow, not
          precede, the lineage-specific experiments proposed in that discussion.
      selected_evidence:
        snippet: Functional assays demonstrated enhanced proliferation and migration in HSkMCs expressing
          the mutant ZMIZ1.
        supports: SUPPORT
        directness: INDIRECT
