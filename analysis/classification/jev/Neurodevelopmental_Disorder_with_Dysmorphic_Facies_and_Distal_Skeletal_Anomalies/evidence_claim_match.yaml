          ZMIZ1 or its regulatory region) have also been reported. ZMIZ1 is strongly constrained against
          loss-of-function variation in population data, consistent with dosage sensitivity. Functional
          consequences documented so far are nonetheless heterogeneous: an alanine-rich in-frame deletion
          reduced mutant protein abundance, whereas a different alanine-rich missense allele increased
          ZMIZ1 expression and mislocalized the protein, so a simple haploinsufficiency model does not
          account for every allele. The latter measurement comes from transfected constructs in skeletal
          muscle and HEK293T cells rather than endogenous patient cells, so it more plausibly reports
          altered protein stability than patient-level upregulation.'
