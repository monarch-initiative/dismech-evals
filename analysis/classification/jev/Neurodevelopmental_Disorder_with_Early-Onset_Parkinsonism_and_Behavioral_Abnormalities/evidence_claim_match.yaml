              label: neurodevelopmental disorder with early-onset parkinsonism and behavioral abnormalities
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Ubiquitin-Proteasome Protein Quality Control
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        description: Hypothesized proximal consequence of PTRHD1 loss of function. The PTH2 domain family
          binds ubiquitin-like (UBL) domains and participates in the ubiquitin-proteasome pathway, and
          all reported disease alleles fall within that domain - although since PTH2 spans residues 25-139
          of a 140-amino-acid protein, that localization is a weak constraint. A secondary review adds
          that the parkinsonism-causing variants sit in the UBL-domain-binding site, but it was written
          before p.Arg122Gln, p.Arg122Trp and p.Tyr71* were reported and so cannot speak to the full allele
          set. Disturbed ubiquitin-dependent proteolysis would plausibly account for the double phenotype,
          since the ubiquitin-proteasome system is required for brain development, synaptic plasticity,
          and long-term memory formation, and its failure is a recognized route to both intellectual disability
          and early-onset parkinsonism. No proteasome-activity or polyubiquitinated-protein measurement
          has been reported in PTRHD1-deficient human neurons, so this node remains a hypothesis rather
          than a demonstrated step.
        biological_processes:
        - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
          modifier: DECREASED
        - preferred_term: ubiquitin-dependent protein catabolic process
          term:
            id: GO:0006511
            label: ubiquitin-dependent protein catabolic process
          modifier: DYSREGULATED
      selected_evidence:
        snippet: the role that the ubiquitin proteasome system plays in brain development, synaptic plasticity,
          and long-term memory formation
        supports: SUPPORT
