        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ptrhd1_no_neuropathology_or_dat_imaging
        kind: KNOWLEDGE_GAP
        prompt: Is the parkinsonism of PTRHD1 disease actually caused by nigrostriatal dopaminergic neurodegeneration?
          No neuropathological examination and no dopamine-transporter imaging study has ever been published
          for a PTRHD1-mutant individual.
        attaches_to:
        - pathophysiology#Nigrostriatal Dopaminergic Neuron Degeneration
        rationale: 'The Nigrostriatal Dopaminergic Neuron Degeneration node - and the conforms_to link
          to the parkinsonism_dopaminergic_degeneration module - is currently supported only indirectly,
          by levodopa responsiveness and by PTRHD1 expression in the substantia nigra, striatum and putamen.
          Brain MRI is grossly normal and DaTscan was explicitly unavailable in the one detailed report
          that mentions it. The distinction matters mechanistically: a genuinely degenerative nigral lesion
          would place this disorder alongside the other recessive early-onset parkinsonisms, whereas a
          developmental or functional dopaminergic deficit that becomes symptomatic with age would make
          it a different kind of entity - and this is exactly the neurodevelopment versus neurodegeneration
          question that makes the disorder interesting.'
        proposed_experiments:
        - experiment_id: ptrhd1_dat_imaging
          name: Presynaptic dopaminergic imaging in PTRHD1 carriers
          description: Perform dopamine transporter SPECT (DaT-SPECT) or 18F-DOPA PET in PTRHD1-mutant
            individuals before and after the emergence of parkinsonism, to test for presynaptic dopaminergic
            denervation and to date its onset relative to motor symptoms.
          decision_criterion: Reduced striatal tracer binding that worsens with motor progression would
            confirm presynaptic nigrostriatal degeneration; normal binding in symptomatic individuals
            would refute the degenerative model and point to a postsynaptic or circuit-level mechanism.
        - experiment_id: ptrhd1_neuropathology
          name: Post-mortem neuropathology of a PTRHD1 brain
          description: Obtain post-mortem neuropathological examination of a PTRHD1-mutant brain, assessing
            nigral neuronal counts, alpha-synuclein/Lewy pathology, tau, and ubiquitin-positive inclusions.
          decision_criterion: Nigral neuronal loss would establish the degeneration node; the presence
            or absence of ubiquitin-positive inclusions would additionally test the ubiquitin-proteasome
            hypothesis directly in human tissue.
      selected_evidence:
        snippet: Results of dopaminergic imaging and response to antiparkinsonian medication often supported
          the neurodegenerative nature of parkinsonism.
        supports: SUPPORT
    origin:
