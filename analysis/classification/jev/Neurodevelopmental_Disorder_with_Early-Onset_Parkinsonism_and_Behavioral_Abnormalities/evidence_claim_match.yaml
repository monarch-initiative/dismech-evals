          is recessive, levodopa-responsive, and third-decade in onset, and it also implicates the ubiquitin-proteasome
          system (parkin is an E3 ubiquitin ligase).
        distinguishing_features:
        - 'PRKN disease is a comparatively pure parkinsonism without a preceding static neurodevelopmental
          phase: intellectual development and childhood milestones are normal, and behavioral abnormalities
          are not a defining early feature. PTRHD1 disease is defined by the childhood cognitive/behavioral
          phase that precedes motor onset by decades.'
      selected_evidence:
        snippet: Among AR parkinsonisms, forms caused by biallelic pathogenic variants in the PRKN, PINK1,
          and DJ-1 genes are thus far considered pure forms of EOPD.
