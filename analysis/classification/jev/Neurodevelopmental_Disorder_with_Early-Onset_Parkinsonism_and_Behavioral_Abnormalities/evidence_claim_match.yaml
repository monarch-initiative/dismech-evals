  1c12dd37f86eb6ecb4035f503ebdcafc92b3e0861fb5ab268502bb83b57fe4f9:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with Early-Onset Parkinsonism and Behavioral Abnormalities
          disease_term:
            preferred_term: neurodevelopmental disorder with early-onset parkinsonism and behavioral abnormalities
            term:
              id: MONDO:0958323
              label: neurodevelopmental disorder with early-onset parkinsonism and behavioral abnormalities
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ptrhd1_no_animal_or_cellular_model
        kind: KNOWLEDGE_GAP
        prompt: No animal or human cellular model of PTRHD1 deficiency has been reported that reproduces
          either arm of the biphasic phenotype. Can a model recapitulate the neurodevelopmental phase,
          the later motor-degenerative phase, or the transition between them?
        attaches_to:
        - pathophysiology#PTRHD1 Biallelic Loss of Function
        rationale: All published PTRHD1 work is human genetic or descriptive; the only laboratory studies
          are a recombinant-protein biochemistry paper and patient-lymphocyte transcript/protein analyses.
          Without a model system, the causal chain from the genetic lesion to either phenotype cannot
          be tested, and no therapeutic hypothesis beyond symptomatic levodopa can be evaluated. The biphasic
          course makes this disorder an unusually informative potential model for how a single locus can
          produce a static developmental deficit and a later progressive degeneration, which raises the
          value of building one.
        proposed_experiments:
        - experiment_id: ptrhd1_ipsc_neurons
          name: Isogenic iPSC-derived cortical and dopaminergic neuron models
          description: Generate isogenic PTRHD1-null and patient-allele knock-in human iPSC lines and
            differentiate them to cortical neurons and midbrain dopaminergic neurons, phenotyping neurite
            development, synapse formation, proteasome function, and long-term survival under stress.
          decision_criterion: A developmental phenotype in cortical neurons together with a later-emerging
            survival deficit in dopaminergic neurons would reproduce the biphasic human course in vitro
            and validate the two-arm pathograph.
        - experiment_id: ptrhd1_vertebrate_model
          name: Aged vertebrate PTRHD1 loss-of-function model
          description: Create PTRHD1 knockout and knock-in vertebrate models (mouse and/or zebrafish)
            with longitudinal cognitive, behavioral, and motor phenotyping into aged animals to test whether
            a late motor phase emerges on a developmental background.
          decision_criterion: Emergence of a late motor phenotype on a background of early cognitive or
            behavioral abnormality would establish the first animal model of the neurodevelopment-to-neurodegeneration
            transition for this gene.
      selected_evidence:
        snippet: However, to date, functional studies of the reported variants and studies of patients'
          derived cells were not performed.
        supports: SUPPORT
