        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: All reported families carry biallelic (homozygous) PTRHD1 variants that segregate
          with disease in a recessive pattern. Parental consanguinity is documented in all ten families
          in the most recent published tally, and ascertainment has been mainly in consanguineous kindreds
          of Middle Eastern or African origin, but consanguinity is not reported for the Austrian singleton
          or the Italian family, so it is characteristic rather than universal. Heterozygous carriers,
          including obligate-carrier parents, are unaffected.
      selected_evidence:
        snippet: Mutations in PTRHD1 have recently been implicated in autosomal recessive neurodevelopmental
          syndromes characterized by intellectual disability, and variably penetrant early-onset parkinsonism,
          mainly in consanguineous families of Middle Eastern or African origin.
        supports: SUPPORT
    origin:
