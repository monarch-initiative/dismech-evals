          has ever been reported for a PTRHD1 patient, and no dopamine-transporter (DaT-SPECT) imaging
          result has been published - the Omani proband with parkinsonism explicitly had no DaTscan available.
          Conformance to the shared parkinsonism_dopaminergic_degeneration module is therefore asserted
          on pharmacological and expression grounds, not on direct demonstration of nigral cell loss in
          this disease.'
