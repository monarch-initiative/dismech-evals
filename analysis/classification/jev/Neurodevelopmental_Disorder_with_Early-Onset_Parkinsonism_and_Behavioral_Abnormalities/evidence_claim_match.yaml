              label: neurodevelopmental disorder with early-onset parkinsonism and behavioral abnormalities
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Escape of Nonsense-Mediated Decay with Stable Truncated Protein
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Functional work on the recurrent c.169_196del (p.Ala57Argfs*26) allele in primary
          cells from four affected members of an Omani family showed that, contrary to in-silico prediction,
          the premature-termination-codon transcript escapes nonsense-mediated mRNA decay and is in fact
          expressed at higher levels than wild type. Immunoblot and isoelectric focusing detected a stable
          truncated protein of roughly 8-9 kDa (isoelectric point ~11) instead of the 15 kDa wild-type
          product. The disease allele therefore produces an abnormal protein species rather than protein
          absence, which leaves open whether the pathogenic effect is pure loss of function or includes
          an aberrant activity of the truncated product.
      selected_evidence:
        snippet: Western blotting and isoelectric focusing identified a truncated, but stable mutant PTRHD1
          protein expressed in the patient
        supports: SUPPORT
