      explanation: 'Scopes the gap to the pre-2021 literature: at the time of this report no functional
        study of any PTRHD1 disease allele had been performed. This same paper then supplied the first
        patient-derived-cell data (NMD escape, stable truncated protein), but no animal model and no engineered
        cellular model of PTRHD1 deficiency has been reported before or since.'
