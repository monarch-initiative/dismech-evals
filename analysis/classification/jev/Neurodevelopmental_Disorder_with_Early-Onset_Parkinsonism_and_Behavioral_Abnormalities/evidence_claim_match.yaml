        biological_processes:
        - preferred_term: dopamine secretion
          term:
            id: GO:0014046
            label: dopamine secretion
          modifier: DECREASED
      selected_evidence:
        snippet: There was no muscle rigidity and postural instability, but there were unusual features
          of exotropia, pectus excavatum, and prominent clavicles.
        supports: SUPPORT
