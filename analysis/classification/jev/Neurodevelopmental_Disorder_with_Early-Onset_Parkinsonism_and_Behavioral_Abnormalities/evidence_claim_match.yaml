        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        conforms_to: parkinsonism_dopaminergic_degeneration#Striatal Dopamine Deficiency and Basal Ganglia
          Circuit Dysfunction
        description: 'Loss of nigrostriatal dopaminergic input unbalances the basal ganglia motor circuit,
          producing the clinical parkinsonian syndrome: bradykinesia with rest and postural tremor, muscle
          stiffness/rigidity, postural instability, and gait disturbance. The syndrome is levodopa-responsive
          in most reported patients, consistent with a dopamine-replaceable striatal deficit. It is also
          atypical in an important minority: one family developed bradykinesia, tremor and dementia in
          the fourth decade with neither muscle rigidity nor postural instability, and with a mildly ataxic
          rather than parkinsonian gait, widening the syndrome beyond pure parkinsonism.'
        locations:
        - preferred_term: striatum
          term:
            id: UBERON:0002435
