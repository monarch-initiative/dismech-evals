  1385d8150f5bc27188a2ef6609ae8f5dd6f5c9493ff9614fb19b9897a8a8fb47:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with Early-Onset Parkinsonism and Behavioral Abnormalities
          disease_term:
            preferred_term: neurodevelopmental disorder with early-onset parkinsonism and behavioral abnormalities
            term:
              id: MONDO:0958323
              label: neurodevelopmental disorder with early-onset parkinsonism and behavioral abnormalities
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ptrhd1_molecular_function_unknown
        kind: KNOWLEDGE_GAP
        prompt: What is the actual molecular function of human PTRHD1, given that the recombinant protein
          binds tRNA but has no peptidyl-tRNA hydrolase activity despite carrying the PTH2 domain that
          names the gene?
        attaches_to:
        - pathophysiology#Impaired Ubiquitin-Proteasome Protein Quality Control
        rationale: This is the central gap for the entire entry. The gene name and the ubiquitin-proteasome
          hypothesis both derive from the PTH2 domain, but the only direct biochemical characterization
          of the human protein found tRNA binding without hydrolase activity and concluded that PTRHD1
          is not a peptidyl-tRNA hydrolase. No enzymatic activity, physiological substrate, or binding
          partner has been established for the human protein, and no disease-specific proteasome-function
          assay has been reported in PTRHD1 patient neurons. Until this is resolved, every mechanistic
          node downstream of the genetic lesion is inferential, and the ubiquitin-proteasome model rests
          on yeast Pth2 homology rather than human data.
        proposed_experiments:
        - experiment_id: ptrhd1_interactome
          name: PTRHD1 neuronal interactome by AP-MS
          description: Determine binding partners of human PTRHD1 by affinity purification-mass spectrometry
            in neuronal cells, testing specifically for UBL-domain proteins (RAD23, UBQLN/DSK2 homologs)
            and proteasome subunits.
          decision_criterion: Recovery of UBL-domain proteins or proteasome subunits as reproducible specific
            interactors would support the ubiquitin-proteasome model; their absence alongside recovery
            of ribosome/tRNA-handling partners would favor a translation-associated quality-control function
            instead.
        - experiment_id: ptrhd1_proteasome_activity
          name: Proteasome function in patient-derived neurons
          description: Measure proteasome activity and steady-state polyubiquitinated-protein load in
            patient-derived fibroblasts and iPSC-derived cortical and midbrain dopaminergic neurons carrying
            p.Ala57Argfs*26 versus isogenic controls.
          decision_criterion: Reduced chymotrypsin-like proteasome activity or accumulation of polyubiquitinated
            protein in patient neurons would upgrade the Impaired Ubiquitin-Proteasome Protein Quality
            Control node from HYPOTHETICAL toward ESTABLISHED.
        - experiment_id: ptrhd1_null_vs_truncation
          name: Null versus stable-truncation allele comparison
          description: Test whether the stable truncated p.Ala57Argfs*26 protein acts as a null or exerts
            a distinct (dominant-negative or neomorphic) activity, by comparing a full knockout with a
            knock-in of the frameshift allele in the same isogenic background.
          decision_criterion: A phenotypic difference between full knockout and frameshift knock-in would
            show that the stable truncated protein is not simply a null, which would change how the Escape
            of Nonsense-Mediated Decay node is interpreted mechanistically.
      selected_evidence:
        snippet: Additionally, we report binding to tRNA but absence of peptidyl-tRNA hydrolase activity.
          Thus, PTRHD1 is not a Pth and the functional consequence of nucleotide binding remains undefined.
        supports: SUPPORT
    origin:
