            term:
              id: MONDO:0958323
              label: neurodevelopmental disorder with early-onset parkinsonism and behavioral abnormalities
        context: []
      assertion_type: Genetic
      assertion:
        name: PTRHD1
        gene_term:
          preferred_term: PTRHD1
          term:
            id: hgnc:33782
            label: PTRHD1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'PTRHD1 (peptidyl-tRNA hydrolase domain containing 1; formerly C2orf79) at 2p23.3 encodes
          a 140-amino-acid protein consisting essentially of a single PTH2 (peptidyl-tRNA hydrolase 2)
          domain spanning residues 25-139. All reported disease alleles are homozygous and fall within
          or truncate this domain: the missense alleles c.155G>A (p.Cys52Tyr, Iranian and Pakistani families),
          c.157C>T (p.His53Tyr, Iranian family), c.365G>A (p.Arg122Gln, a large Middle Eastern kinship
          and an Austrian individual) and p.Arg122Trp (Iranian family); the 28-nucleotide frameshift deletion
          c.169_196del (p.Ala57Argfs*26, South African and Omani families); and the nonsense c.213C>A
          (p.Tyr71*, Italian family). Loss of function is the accepted disease mechanism.'
      selected_evidence:
        snippet: The chromosome, 2p23.3, was identified as the disease-associated locus, and a homozygous
          PTRHD1 mutation (c.157C>T) was then established as the disease-causing mutation.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27753167
      reference_title: PTRHD1 (C2orf79) mutations lead to autosomal-recessive intellectual disability
        and parkinsonism.
      evidence_source: HUMAN_CLINICAL
      explanation: Original gene-disease assignment, mapping the locus to 2p23.3 and establishing PTRHD1
        c.157C>T as causal in an Iranian consanguineous family.
