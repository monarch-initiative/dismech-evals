      assertion_type: Pathophysiology
      assertion:
        name: PTRHD1 Biallelic Loss of Function
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Homozygous missense, frameshift, or nonsense variants in the single PTH2 domain of
          PTRHD1 (2p23.3) abolish or corrupt the function of the 140-amino-acid protein. Linkage-supported
          segregation in multiple unrelated consanguineous families, absence of the alleles from ethnically
          matched control chromosomes and population databases, and the presence of clearly truncating
          alleles together establish loss of function as the disease mechanism. PTRHD1 is widely expressed,
          including throughout the adult brain (cortex, cerebellum, brainstem, substantia nigra, pons,
          putamen, and spinal cord), which is consistent with a phenotype that spans cognitive, behavioral,
          pyramidal, and extrapyramidal domains.
        gene:
          preferred_term: PTRHD1
          term:
            id: hgnc:33782
            label: PTRHD1
      selected_evidence:
        snippet: Together with the previous reports, we provide conclusive evidence that loss-of-function
          mutations in PTRHD1 cause autosomal-recessive juvenile parkinsonism and intellectual disability.
        supports: SUPPORT
