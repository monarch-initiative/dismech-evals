            term:
              id: MONDO:0958323
              label: neurodevelopmental disorder with early-onset parkinsonism and behavioral abnormalities
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ptrhd1_parkinsonism_penetrance
        kind: OPEN_QUESTION
        prompt: Is the parkinsonian arm incompletely penetrant, or merely very late, so that all biallelic
          carriers would eventually develop it if followed long enough?
        attaches_to:
        - pathophysiology#Nigrostriatal Dopaminergic Neuron Degeneration
        rationale: Reports differ. Some describe parkinsonism as variably penetrant; in one Omani family
          only one of four affected siblings had developed mild parkinsonism by the fourth decade, and
          in an Iranian family the affected individuals were reported with intellectual disability manifestations.
          Yet the longest-followed kindred showed motor signs appearing only at ages 34-48, with the authors
          concluding that gait problems may not be evident until towards the end of the fourth decade.
          Distinguishing true incomplete penetrance from ascertainment at too young an age changes both
          counseling and the interpretation of the mechanism (a stochastic degenerative threshold versus
          an obligate but slow decline).
        proposed_experiments:
        - experiment_id: ptrhd1_penetrance_cohort
          name: Prospective re-examination of known PTRHD1 kindreds
          description: Systematic prospective re-examination of all reported PTRHD1 kindreds at 5-year
            intervals with standardized movement-disorder assessment, to establish age-specific penetrance
            curves for parkinsonism.
          decision_criterion: A penetrance curve approaching 100% by the fifth or sixth decade would support
            age-dependent rather than incomplete penetrance; a plateau well below 100% would establish
            genuinely incomplete penetrance and motivate a search for modifiers.
      selected_evidence:
        snippet: Our findings reveal that not all PTRHD1 mutations manifest with muscle rigidity and postural
          instability and confirm that gait problems may not be evident until towards the end of the fourth
          decade.
        supports: SUPPORT
