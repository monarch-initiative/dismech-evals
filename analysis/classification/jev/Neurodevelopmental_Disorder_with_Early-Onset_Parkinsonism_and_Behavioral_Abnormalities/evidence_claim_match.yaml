      assertion_type: DifferentialDiagnosis
      assertion:
        name: Kufor-Rakeb syndrome
        description: ATP13A2-related autosomal recessive juvenile parkinsonism with pyramidal signs, supranuclear
          gaze palsy, and cognitive decline - one of the closest clinical mimics of PTRHD1 disease among
          the atypical juvenile parkinsonisms.
        distinguishing_features:
        - Kufor-Rakeb typically shows supranuclear vertical gaze palsy, facial-faucial-finger mini-myoclonus,
