        name: PTRHD1 c.169_196del (p.Ala57Argfs*26)
        description: Recurrent homozygous 28-nucleotide frameshift deletion in PTRHD1 exon 1, reported
          independently in a South African and an Omani consanguineous family and, per the most recent
          tally, carried by three families in total. Functional work in patient primary cells showed that
          the mutant transcript escapes nonsense-mediated decay and that a truncated (~81 amino-acid)
          but stable protein is expressed, so the allele is not a simple null by transcript degradation.
        gene:
          preferred_term: PTRHD1
          term:
            id: hgnc:33782
            label: PTRHD1
        clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: A homozygous 28-nucleotide frameshift deletion introducing a premature stop codon in
          the PTRHD1 exon 1 was identified in the four affected members.
        supports: SUPPORT
