      assertion_type: Diagnosis
      assertion:
        name: Biallelic PTRHD1 variant on exome, genome, or movement-disorder panel sequencing
        diagnosis_term:
          preferred_term: Whole Exome Sequencing
          term:
            id: NCIT:C101295
            label: Whole Exome Sequencing
        description: Diagnosis is genomic. There are no consensus clinical criteria and no biochemical
          or imaging biomarker. Suspicion should be raised by impaired intellectual development with behavioral
          abnormalities followed by early-onset parkinsonism, particularly with affected siblings or parental
          consanguinity; confirmation is a biallelic PTRHD1 variant on exome, genome, or a movement-disorder/Parkinson
          gene panel, with segregation testing in the family. Because the parkinsonian arm can appear
          decades after the neurodevelopmental one, PTRHD1 belongs on panels used for both indications.
      selected_evidence:
        snippet: Using diagnostic exome sequencing, we identified a homozygous missense variant (c.365G
          > A, p.(Arg122Gln)) in PTRHD1 (NM_001013663).
