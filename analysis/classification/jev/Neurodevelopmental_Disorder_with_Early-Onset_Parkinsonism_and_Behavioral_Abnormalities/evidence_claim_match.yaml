            term:
              id: MONDO:0958323
              label: neurodevelopmental disorder with early-onset parkinsonism and behavioral abnormalities
        context: []
      assertion_type: Treatment
      assertion:
        name: Multidisciplinary Supportive and Rehabilitative Care
        description: 'No disease-modifying therapy exists. Management is symptom-directed and lifelong:
          special educational placement and behavioral support for the developmental and psychiatric manifestations,
          speech and language therapy for the marked language delay, physiotherapy and mobility aids for
          spasticity and later parkinsonian gait impairment, and standard treatment of epilepsy and sleep
          disturbance where present. Longitudinal movement-disorder surveillance is warranted into adulthood
          because parkinsonism may emerge decades after the neurodevelopmental diagnosis.'
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: 'Deep brain stimulation is deliberately NOT listed as a treatment. No PTRHD1 patient has
          been reported to undergo DBS, and its efficacy should not be assumed by analogy with PRKN- or
          PINK1-related parkinsonism: the motor syndrome here is frequently incomplete (rigidity and postural
          instability absent in at least one family), is accompanied by pyramidal signs and moderate-to-severe
          intellectual disability, and no dopaminergic imaging has ever confirmed a nigrostriatal deficit.
          This is recorded as a note rather than a treatment entry because there is no citable PTRHD1-specific
          source.'
      selected_evidence:
        snippet: and involvement of a movement disorder specialist may be considered
        supports: SUPPORT
