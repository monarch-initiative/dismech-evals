        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ptrhd1_ubiquitin_proteasome_model
        hypothesis_label: PTH2/UBL-Domain Link to Ubiquitin-Proteasome System Failure
        status: EMERGING
        description: The leading - but explicitly unproven - mechanistic model. PTRHD1 consists essentially
          of a PTH2 (peptidyl-tRNA hydrolase 2) domain, and every disease-associated allele lies within
          or truncates it. In yeast, the Pth2 protein is a ubiquitin-like (UBL) domain-binding protein
          that participates in the ubiquitin-proteasome pathway and retards ubiquitin-mediated degradation.
          Because the ubiquitin-proteasome system is independently implicated both in intellectual disability
          (UBE3A, UBE2A, CUL4B, BRWD3) and in early-onset parkinsonism (parkin/PRKN, FBXO7), the proposal
          is that PTRHD1 loss of function degrades proteostasis in a way that impairs brain development
          and later renders vulnerable neuronal populations degeneration-prone. The originating authors
          state this as speculation, no disease-specific proteasome assay has been reported in patient
          neurons, and the alternative that PTRHD1 acts in translation-associated RNA quality control
          is not excluded.
      selected_evidence:
        snippet: we speculated that PTRHD1 genetic variability might cause ID and parkinsonism through
          defects in the ubiquitin-proteasome system, as observed in other inherited forms of parkinsonism
          and ID.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
