            term:
              id: MONDO:0032894
              label: neurodevelopmental disorder with epilepsy, spasticity, and brain atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired RAB1 Guanine Nucleotide Exchange Factor Activity
        description: 'The TRAPP complexes are Rab guanine-nucleotide-exchange factors: TRAPPIII activates
          RAB1 (the master regulator of the early secretory pathway and of the first step of macroautophagy)
          and TRAPPII activates RAB11. TRAPPC4 and its yeast orthologue Trs23 are among the essential
          subunits for the RAB1 GEF activity, and structural work localizes the exchange site to a conserved
          surface spanning several core subunits, so a destabilized core lowers exchange activity rather
          than abolishing a discrete catalytic site. Reduced RAB1 activation leaves less RAB1-GTP available
          on donor and acceptor membranes to recruit long coiled-coil tethers.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        molecular_functions:
        - preferred_term: RAB1 guanyl-nucleotide exchange factor activity
          term:
            id: GO:0005085
            label: guanyl-nucleotide exchange factor activity
          modifier: DECREASED
        protein_complexes:
        - preferred_term: TRAPP complex
          term:
            id: GO:0030008
            label: TRAPP complex
      selected_evidence:
        snippet: TRAPP complexes comprise a core complex, TRAPPI, and the association of peripheral protein
          subunits to make two complexes, known as TRAPPII and TRAPPIII, which act as Guanine Nucleotide
          Exchange Factors (GEFs) of Rab11 and Rab1, respectively.
        supports: SUPPORT
