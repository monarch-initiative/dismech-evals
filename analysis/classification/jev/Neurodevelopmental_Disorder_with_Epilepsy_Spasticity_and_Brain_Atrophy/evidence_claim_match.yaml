      assertion:
        name: Brain Magnetic Resonance Imaging
        description: Cranial MRI is the principal phenotyping investigation. It is supportive rather than
          diagnostic, but the combination of progressive cortical (and usually cerebellar) atrophy with
          enlarged subarachnoid spaces in an infant with severe microcephaly and early seizures is what
          should prompt TRAPPC4 testing. Serial imaging is more informative than a single scan because
          it demonstrates progression.
        diagnosis_term:
          preferred_term: brain magnetic resonance imaging
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
        results: Progressive cerebral cortical atrophy, cerebellar atrophy in most, enlarged subarachnoid
          spaces, white-matter volume loss and delayed myelination, thin corpus callosum, ventriculomegaly.
      selected_evidence:
        snippet: In patients presenting with severe microcephaly, typical dysmorphic facial features,
          early-onset seizures with very low voltage, abnormal EEG and progressive cortical atrophy, a
          TRAPPC4-related neurodevelopmental disorder should be considered in the differential diagnosis
          of neurodegenerative diseases.
        supports: SUPPORT
