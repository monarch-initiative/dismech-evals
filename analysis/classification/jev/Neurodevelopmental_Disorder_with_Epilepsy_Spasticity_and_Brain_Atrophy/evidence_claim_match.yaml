          a recurrent mutational hotspot over a single ancient founder allele. A small number of families
          carry other biallelic alleles: novel missense variants c.191T>C p.(Leu64Pro) and c.278C>T p.(Pro93Leu)
          in two Indian families, and a biallelic in-frame deletion causing stop-loss in one family with
          a milder phenotype. Because the recurrent splice allele is leaky, residual correctly spliced
          transcript persists; complete loss of this essential core subunit is thought to be incompatible
          with survival.'
