          or speak, cannot feed themselves and develop feeding difficulties and failure to thrive, and
          remain profoundly dependent. Because the substrate is a degenerative process superimposed on
          a developmental one, the trajectory is one of stagnation followed by decline rather than of
          slow ongoing gains. Death in the first decade, most often from intercurrent infection, is reported
          in a minority.
        biological_scale: ORGANISM
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: Here, we report 23 patients from 17 independent families with an early-infantile-onset
          neurodegenerative presentation
