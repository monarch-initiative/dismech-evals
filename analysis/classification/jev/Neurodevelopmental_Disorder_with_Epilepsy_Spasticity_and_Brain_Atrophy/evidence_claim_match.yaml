      assertion_type: Diagnosis
      assertion:
        name: RNA Analysis of the Splice Variant
        description: Transcript analysis (RT-PCR or RNA sequencing of patient fibroblasts) is the functional
          test that establishes pathogenicity of the recurrent splice-region allele. It is diagnostically
          valuable because a non-canonical +3 intronic variant can be filtered out or deprioritized by
          standard exome pipelines.
        diagnosis_term:
          preferred_term: RNA sequencing
          term:
            id: NCIT:C124261
            label: Whole Transcriptome Sequencing
        results: Reduced full-length TRAPPC4 transcript with partial exon 3 skipping and use of a downstream
          cryptic splice donor, generating a premature termination codon subject to nonsense-mediated
          decay.
      selected_evidence:
        snippet: Based upon RNA sequencing, the variant resulted in partial exon 3 skipping and generation
          of an aberrant transcript owing to use of a downstream cryptic splice donor site, predicting
          a premature stop codon and nonsense mediated decay.
        supports: SUPPORT
