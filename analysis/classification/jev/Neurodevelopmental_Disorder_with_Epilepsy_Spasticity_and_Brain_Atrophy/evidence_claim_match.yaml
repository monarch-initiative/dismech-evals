        context: []
      assertion_type: Genetic
      assertion:
        name: TRAPPC4
        gene_term:
          preferred_term: TRAPPC4
          term:
            id: hgnc:19943
            label: TRAPPC4
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Biallelic pathogenic or likely pathogenic variants
        notes: 'TRAPPC4 (aliases SBDN, synbindin, TRS23) lies at 11q23.3 and encodes one of the small
          core subunits shared by the TRAPPII and TRAPPIII complexes. The allelic spectrum is unusually
          narrow. The recurrent non-canonical splice variant NM_016146.5:c.454+3A>G (hg19:chr11:g.118890966A>G;
          hg38:11:119020256 A>G; ClinVar VCV000812649.1) accounts for 31 of 33 reported individuals from
          21 of 22 families, almost always homozygous and usually in a consanguineous setting; a screen
          of over 10,000 patients with neurodevelopmental conditions found no other clinically relevant
          TRAPPC4 variant. The remaining reported alleles are two novel homozygous missense variants in
          Indian families, c.191T>C p.(Leu64Pro) and c.278C>T p.(Pro93Leu) (both predicted to destabilize
          the protein), and a biallelic in-frame deletion causing stop-loss in one family with a milder,
          later-onset phenotype and normal head circumference. All are hypomorphic: complete loss of this
          essential core subunit is thought to be incompatible with survival. Penetrance: every reported
          homozygote for c.454+3A>G has been clinically affected, so penetrance appears complete for that
          genotype; heterozygous carriers are unaffected. Penetrance across the wider (very small) allelic
          spectrum is not established, and no unaffected homozygote has been described. The residual level
          of correctly spliced transcript is the presumed determinant of both viability and severity,
          but this has not been measured against clinical severity in a patient series.'
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: This is the first report of a TRAPPC4 variant, and our findings add to the growing number
          of TRAPP-associated neurological disorders.
        supports: SUPPORT
