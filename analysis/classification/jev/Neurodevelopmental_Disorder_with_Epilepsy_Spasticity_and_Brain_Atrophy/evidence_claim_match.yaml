          more severe in older children, commonly accompanied by cerebellar atrophy, enlarged subarachnoid
          spaces, white-matter volume loss, ventriculomegaly and a thin corpus callosum. Delayed myelination
          is also reported on early infant imaging, but it is a developmental rather than degenerative
          finding and is deliberately not attributed to this node (see the knowledge-gap discussion).
          Serial imaging in individual patients documents the progression directly: repeat scans within
          months can show new severe cortical atrophy. The progressive brain volume loss is also the substrate
          for the progressive postnatal microcephaly.'
