      assertion_type: DifferentialDiagnosis
      assertion:
        name: TRAPPC6B-related neurodevelopmental disorder (NEDMEBA)
        description: Biallelic TRAPPC6B variants cause a neurodevelopmental disorder with microcephaly,
          epilepsy and autistic features, with cortical atrophy, thin corpus callosum and, in some, cerebellar
          and brainstem atrophy. Like NEDESBA it is a core-subunit TRAPPopathy caused by a founder splice
          mutation in a consanguineous population.
        disease_term:
          preferred_term: neurodevelopmental disorder with microcephaly, epilepsy, and brain atrophy
          term:
            id: MONDO:0060640
            label: neurodevelopmental disorder with microcephaly, epilepsy, and brain atrophy
        distinguishing_features:
        - 'Causal gene: TRAPPC6B, not TRAPPC4.'
        - The TRAPPC6B phenotype is substantially milder - affected individuals walk, have autistic features
          and ataxic gait, and survive into adulthood with only slow progression, whereas NEDESBA patients
          typically never walk or speak.
        - Zebrafish trappc6b morphants recapitulate the microcephaly and neuronal hyperexcitability; no
          comparable vertebrate model exists in the TRAPPC4 literature.
      selected_evidence:
        snippet: We identified six individuals from three unrelated families with a founder homozygous
          splice mutation in TRAPPC6B, encoding a core subunit of the complex TRAPP I. Patients manifested
          a neurodevelopmental disorder characterised by microcephaly, epilepsy and autistic features,
          and showed splicing defect.
        supports: SUPPORT
