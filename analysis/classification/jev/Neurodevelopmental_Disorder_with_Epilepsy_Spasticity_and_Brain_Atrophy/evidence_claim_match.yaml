              label: neurodevelopmental disorder with epilepsy, spasticity, and brain atrophy
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Early-infantile neurodegenerative and neurometabolic mimics
        description: Before molecular diagnosis, NEDESBA is routinely mistaken for a neurometabolic disease.
          The reported differential includes early-onset epileptic encephalopathies, lysosomal storage
          disorders such as neuronal ceroid lipofuscinosis, mitochondrial encephalopathies, and the leukodystrophies
          (metachromatic leukodystrophy, Krabbe disease). In one reported infant a low biotin level even
          suggested biotinidase deficiency before enzymatic testing excluded it.
        distinguishing_features:
        - A thorough metabolic workup (plasma amino acids, acylcarnitines, urine organic acids, lysosomal
          enzymes, neuronal ceroid lipofuscinosis enzymes) is normal in NEDESBA.
        - Grey- versus white-matter predominance on MRI helps triage the mimics, but the definitive discriminator
          is biallelic TRAPPC4 variants on sequencing.
      selected_evidence:
        snippet: Early-onset epileptic encephalopathies, lysosomal storage diseases, such as NCL, and
          mitochondrial encephalopathies present with prominent gray matter involvement, whereas white
          matter involvement occurs in disorders with demyelination, such as MLD and Krabbe disease.
        supports: SUPPORT
