          Muscle involvement is a recurring theme across the TRAPPopathies (episodic rhabdomyolysis in
          TRAPPC2L disease, limb-girdle muscular dystrophy in TRAPPC11 disease), so a shared trafficking-dependent
          vulnerability of muscle is plausible, but the route from reduced TRAPPC4 to muscle-fibre damage
          has not been studied and creatine kinase is normal in other reported patients.'
