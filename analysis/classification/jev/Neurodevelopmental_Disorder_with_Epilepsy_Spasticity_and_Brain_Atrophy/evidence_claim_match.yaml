  48467f30e229628876fd540a9a88ddadf4e4d23793b46291ec3a8f183f045f40:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with Epilepsy, Spasticity, and Brain Atrophy
          disease_term:
            preferred_term: neurodevelopmental disorder with epilepsy, spasticity, and brain atrophy
            term:
              id: MONDO:0032894
              label: neurodevelopmental disorder with epilepsy, spasticity, and brain atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuronal Secretory and Autophagic Failure
        description: 'The step from a fibroblast phenotype to a brain phenotype is the least directly
          evidenced link in the chain and is currently a well-motivated hypothesis rather than a demonstrated
          fact. The proposal, advanced by the discovery group, is that a chronic low-grade autophagy defect
          is especially harmful to neurons, which are post-mitotic, long-lived and unusually dependent
          on membrane trafficking and proteostasis. A second, neuron-specific route is suggested by TRAPPC4/synbindin
          biology: through its atypical PDZ-like domain synbindin binds the cytoplasmic tail of syndecan-2,
          and the synbindin/syndecan complex participates in synaptic membrane trafficking and dendritic
          spine morphogenesis, so reduced TRAPPC4 may also impair synapse formation and maturation directly.
          Neither route has been tested in patient-derived neurons.'
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: cortical pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        biological_processes:
        - preferred_term: regulation of dendritic spine development
          term:
            id: GO:0060998
            label: regulation of dendritic spine development
          modifier: ABNORMAL
        - preferred_term: intracellular protein transport
          term:
            id: GO:0006886
            label: intracellular protein transport
          modifier: DECREASED
      selected_evidence:
        snippet: Moreover, we hypothesize that low levels of the core TRAPP complex are more detrimental
          to autophagy than to secretion, and that the long-term autophagy defect is especially harmful
          to neuronal cells.
        supports: SUPPORT
