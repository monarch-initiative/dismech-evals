        notes: Almost no psychomotor progress is made, and the few milestones that were attained are lost.
          Head growth decelerates and the child becomes spastic and tetraplegic. This is the phase in
          which the disorder declares itself as neurodegenerative rather than static.
      selected_evidence:
        snippet: Affected individuals with the homozygous TRAPPC4 c.454+3A>G variant showed profound psychomotor
          delay, developmental regression, early-onset epilepsy, microcephaly and progressive spastic
          tetraplegia.
        supports: SUPPORT
