            term:
              id: MONDO:0859206
              label: neurodevelopmental disorder with hearing loss and spasticity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Global Protein Synthesis
        description: Failure of the late pre-60S maturation step reduces the supply of mature 60S subunits
          and lowers global translational capacity. This has been measured directly for the other 55LCC
          subunits (C1ORF109 and AFG2A/SPATA5), where loss impairs global protein synthesis; the equivalent
          measurement has not been made after loss of AFG2B itself, so the node is provisional for this
          disorder even though the complex-level logic is strong.
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        biological_processes:
        - preferred_term: cytoplasmic translation
          term:
            id: GO:0002181
            label: cytoplasmic translation
          modifier: DECREASED
        notes: Deliberately marked PROVISIONAL and PARTIAL. This is the single point in the chain where
          the evidence is about the paralogue AFG2A rather than about AFG2B, and the named-entity-confusion
          risk for this disorder makes it worth flagging explicitly rather than letting the complex-level
          argument stand unqualified. Note also that PMID:38554706 found the replication and genome-instability
          phenotype separable from the reported ribosomal function, so the two arms of 55LCC dysfunction
          are modelled here as parallel branches rather than as one linear chain.
      selected_evidence:
        snippet: Loss of either C1orf109 or SPATA5 impairs global protein synthesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
