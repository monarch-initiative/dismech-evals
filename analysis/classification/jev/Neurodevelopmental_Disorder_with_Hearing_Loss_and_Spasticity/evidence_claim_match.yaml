      assertion_type: DifferentialDiagnosis
      assertion:
        name: AFG2A-Related Encephalopathy
        description: The disorder caused by biallelic variants in the paralogous gene AFG2A (formerly
          SPATA5), whose protein is the obligate partner of AFG2B inside the same 55LCC complex. The clinical
          pictures overlap substantially, with intellectual disability, developmental delay, epilepsy,
          hearing loss and movement disorder in both, which is exactly why the pair is a named-entity
          confusion hazard. That disorder is curated in this repository as `AFG2A-Related_Encephalopathy`,
          and it in turn lists this disorder as one of its differentials.
        disease_term:
          preferred_term: AFG2A-related encephalopathy
          term:
            id: MONDO:0014698
            label: microcephaly-intellectual disability-sensorineural hearing loss-epilepsy-abnormal muscle
              tone syndrome
        distinguishing_features:
        - AFG2A-related encephalopathy typically has earlier seizure onset, more pronounced (congenital)
          microcephaly and more frequent movement disorders, and frequently presents as a developmental
          and epileptic encephalopathy.
        - AFG2B-related disease is dominated by sensorineural hearing loss, which is near-universal and
          can be the sole manifestation, with a more consistently spastic-dystonic motor pattern and a
          neurodevelopmental burden that affects only about half of individuals.
        - Only sequencing distinguishes the two reliably; the genes differ by one letter in both their
          current (AFG2A/AFG2B) and their legacy (SPATA5/SPATA5L1) symbols.
      selected_evidence:
        snippet: SPATA5-related disorder (NEDCAS) presents with earlier seizure onset, more pronounced
          microcephaly, and frequent movement disorders
        supports: SUPPORT
