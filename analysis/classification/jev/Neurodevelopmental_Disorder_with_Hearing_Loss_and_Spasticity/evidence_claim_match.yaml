  1f16704fdfb41540a74749b045e19cbab4ad9d8baa4ba0705eeaa9793a0c43fb:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with Hearing Loss and Spasticity
          disease_term:
            preferred_term: neurodevelopmental disorder with hearing loss and spasticity
            term:
              id: MONDO:0859206
              label: neurodevelopmental disorder with hearing loss and spasticity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cochlear Sensory Epithelium Involvement
        description: AFG2B is expressed in the neurosensory hair cells and supporting cells of the rodent
          inner ear - the founding report localised the protein to the hair cells and pillar cells of
          the rat organ of Corti and detected transcript in both inner and outer hair cells - and biallelic
          human variants produce sensorineural hearing loss, with bilateral involvement documented in
          individual reports. This makes the cochlear sensory epithelium a directly affected tissue and
          places the disorder at the generic trigger node of the conserved sensorineural hair-cell-loss
          module, a hereditary lesion whose vulnerable target is the mechanosensitive cochlear hair cell.
