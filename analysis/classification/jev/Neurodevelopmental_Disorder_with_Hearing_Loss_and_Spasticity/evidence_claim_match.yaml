              label: neurodevelopmental disorder with hearing loss and spasticity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Replisome Proteostasis Failure and Replication Stress
        description: The second established function of the 55LCC complex is to direct turnover of replisome
          components, a proteostasis job distinct from the ubiquitin-dependent VCP/p97 unfolding of the
          CMG helicase that terminates DNA replication. The complex acts as an unfoldase on chromatin-bound
          replisome proteins, and its deficiency produces ubiquitin-independent proteotoxicity, replication
          stress, and severe chromosome instability. Consistent with this, transcriptomic profiling of
          fibroblasts from affected individuals with biallelic AFG2B variants implicated DNA replication
          and mitosis alongside cell-surface adhesion and focal adhesion pathways.
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        biological_processes:
        - preferred_term: DNA replication
          term:
            id: GO:0006260
            label: DNA replication
          modifier: ABNORMAL
        - preferred_term: replication fork processing
          term:
            id: GO:0031297
            label: replication fork processing
          modifier: ABNORMAL
        notes: Marked PROVISIONAL because no causal link has been shown between replication stress and
          any specific clinical feature of this disorder. It is curated as a parallel arm of 55LCC dysfunction
          rather than as an established step on the path to the neurological phenotype. The downstream
          edge to neuronal and white matter development is the weakest edge in this pathograph and is
          the subject of the `afg2b_replication_stress_to_neural_gap` discussion.
      selected_evidence:
        snippet: Here, we identify replisome factor interactions with a protein complex composed of AAA+
          ATPases SPATA5-SPATA5L1 together with heterodimeric partners C1orf109-CINP (55LCC).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
