          showed no epileptiform activity, while an EEG at just over 2 years showed bilateral sharp waves
          and theta activity during wakefulness and sleep. EEG abnormality is therefore curated separately
          from Epilepsy rather than folded into it.
        phenotype_term:
          preferred_term: EEG abnormality
          term:
            id: HP:0002353
            label: EEG abnormality
        notes: Bound to HP:0002353 (EEG abnormality). The PR review suggested HP:0010848, but that term
          is "EEG with spike-wave complexes (2.5-3.5 Hz)", which the reported tracing (bilateral sharp
          waves, incomplete complexes and theta activity) does not describe, so it would have been a false
          match. Single-case evidence, so no frequency band is asserted.
      selected_evidence:
        snippet: Early EEG recordings were without significant changes, whereas abnormalities emerged
          later in the clinical course.
        supports: SUPPORT
