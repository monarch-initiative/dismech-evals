              label: neurodevelopmental disorder with hearing loss and spasticity
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: afg2b_mtor_rescue_untested
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the mTOR-activation rescue demonstrated for the AIRIM/C1orf109 subunit of the 55LCC
          complex generalise to AFG2B deficiency?
        attaches_to:
        - pathophysiology#Neuroepithelial Vulnerability During Differentiation
        rationale: Enhancing mTOR activity suppresses the growth and developmental defects caused by AIRIM/C1orf109
          variants in human cerebral organoids (PMID:40760247). AIRIM/C1orf109 is a subunit of the same
          55LCC complex as AFG2B, and the proposed mechanism, restoring translational output when ribosome
          availability falls during neuroepithelial differentiation, would apply equally to AFG2B loss
          on paper. But the experiment has never been done for AFG2B, the organoid system models early
          cortical development rather than the cochlea where this disorder's defining phenotype lies,
          and mTOR activation is not a benign intervention. The mismatch between an encouraging organoid
          result on one subunit and the complete absence of data on the subunit that causes this disease
          is exactly why the finding is curated as a pathophysiology observation and a discussion rather
          than as a treatment.
        proposed_experiments:
        - experiment_id: afg2b_organoid_mtor_rescue
          name: mTOR rescue in AFG2B-variant cerebral organoids
          description: Generate AFG2B-variant human cerebral organoids and test whether mTOR activation
            rescues growth and cell-fate commitment as it does for AIRIM/C1orf109 organoids.
        - experiment_id: afg2b_60s_translation_measurement
          name: 60S availability and translation in AFG2B-deficient neuroepithelia
          description: Measure 60S subunit availability and global translation in AFG2B-deficient neuroepithelia
            to confirm that the proximal defect assumed by the rescue rationale is actually present.
        - experiment_id: afg2b_inner_ear_organoid_rescue
          name: Inner-ear organoid rescue test
          description: Test whether any mTOR rescue extends to inner-ear organoids, since cortical rescue
            alone would not address the disorder's defining hearing loss.
      selected_evidence:
        snippet: Enhancing mTOR activity suppresses the growth and developmental defects associated with
          AIRIM/C1orf109 variants.
        supports: SUPPORT
