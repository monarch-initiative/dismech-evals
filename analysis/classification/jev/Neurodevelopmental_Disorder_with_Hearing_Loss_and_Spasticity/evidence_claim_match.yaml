      - /disease_term
    evidence_metadata:
      reference: PMID:37902276
      reference_title: A further case of AFG2B-related neurodevelopmental disorder with hearing loss and
        microcephaly allows further clarification of pathogenicity of the variant c.1313T>C, p.(Leu438Pro).
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      explanation: Names both OMIM phenotype numbers, attributes both to biallelic variants in the one
        gene, and cites the one founding report for both. This is the sentence that establishes DFNB119
        as the isolated-hearing-loss end of this entry's disorder rather than a separate gene-disease
        relationship. Quoted from the paper's introduction, where it restates the founding report, so
        the finding is not this paper's own.
