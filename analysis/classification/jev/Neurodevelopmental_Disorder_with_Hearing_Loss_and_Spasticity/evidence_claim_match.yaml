      assertion:
        name: Impaired Cytoplasmic Pre-60S Ribosomal Maturation
        description: The 55LCC complex, of which AFG2B is a subunit, executes a late cytoplasmic maturation
          step of the pre-60S large ribosomal subunit. AFG2A is the human homolog of yeast Drg1, which
          releases the assembly factor Rlp24 from newly exported pre-60S particles; in humans the reaction
          requires the whole four-protein complex, and recognition of the pre-60S particle is mediated
          by the human-specific subunit CINP. Loss of AFG2B is therefore expected to stall the final step
          of large-subunit biogenesis.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        biological_processes:
