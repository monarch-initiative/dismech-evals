  b01dde37eecddaaaf08c6457d54264e618e3c1a45eef38c9560798b5ff1ed645:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with Hearing Loss and Spasticity
          disease_term:
            preferred_term: neurodevelopmental disorder with hearing loss and spasticity
            term:
              id: MONDO:0859206
              label: neurodevelopmental disorder with hearing loss and spasticity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuroepithelial Vulnerability During Differentiation
        description: Ribosome levels fall physiologically as neuroepithelial cells differentiate during
          early human brain development, which makes precisely this window hypersensitive to any further
          reduction in ribosome biogenesis. Reduced ribosome availability preferentially impairs translation
          of specific transcripts and disrupts both survival and cell-fate commitment of transitioning
          neuroepithelia. This is the leading explanation for why a housekeeping defect in a ubiquitously
          required complex produces a predominantly neurodevelopmental disease.
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        cell_types:
        - preferred_term: neuroepithelial progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        biological_processes:
        - preferred_term: cerebral cortex development
          term:
            id: GO:0021987
            label: cerebral cortex development
          modifier: ABNORMAL
        notes: The `cell_types` binding uses CL:0011020 (neural progenitor cell), the closest existing
          CL class to the differentiating neuroepithelial progenitor population studied in the cerebral
          organoids; `preferred_term` records the intended, more specific meaning. CL:0000098 (sensory
          epithelial cell) was used in an earlier revision and was wrong - that class is the ear/eye/nose
          sensory-receptor lineage, not a neural progenitor - and is no longer used anywhere in this entry.
          The mTOR-rescue result in PMID:40760247 is NOT curated as a treatment here; see the entry notes
          and the `afg2b_mtor_rescue_untested` discussion.
      selected_evidence:
        snippet: We find that ribosome levels decrease during neuroepithelial differentiation, making
          differentiating cells particularly vulnerable to perturbations in ribosome biogenesis during
          this time.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40760247
      reference_title: A programmed decline in ribosome levels governs human early neurodevelopment.
      evidence_source: IN_VITRO
      explanation: Explains the tissue specificity of 55LCC-complex disease. PARTIAL because the human
        cerebral organoid work was done for the AIRIM/C1orf109 subunit, not for AFG2B; the argument generalises
        across the complex but has not been tested for this gene.
