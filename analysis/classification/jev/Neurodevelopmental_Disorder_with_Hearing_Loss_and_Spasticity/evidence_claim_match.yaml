        context: []
      assertion_type: Pathophysiology
      assertion:
        name: 55LCC ATPase Complex Dysfunction
        description: AFG2B does not act alone. It is an obligate subunit of the 55LCC complex, a 4:2:2:2
          assembly of AFG2A (SPATA5), AFG2B (SPATA5L1), C1orf109 and CINP in which the N-terminal domains
          of the two AAA+ ATPases interact with the C1orf109-CINP heterodimer to form a funnel-like ring
          sitting above a cylindrical stacked-ring ATPase motor. The assembled complex hydrolyses ATP
          several-fold faster than AFG2A alone, so loss of AFG2B compromises a multi-subunit machine rather
          than a single enzyme. That shared machine is the structural reason why AFG2A- and AFG2B-related
          diseases overlap clinically.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        molecular_functions:
        - preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          modifier: DECREASED
      selected_evidence:
        snippet: Here we reveal that SPATA5 forms a 4:2:2:2 complex with SPATA5L1, C1orf109, and CINP.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
