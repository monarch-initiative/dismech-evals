            term:
              id: MONDO:0859206
              label: neurodevelopmental disorder with hearing loss and spasticity
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Trio exome sequencing
        description: Diagnosis is molecular. The disorder has been identified exclusively by exome sequencing;
          trio testing establishes that the two variants are in trans and that each parent is a carrier.
          There is no biochemical marker and no disease-specific imaging finding, so a child with sensorineural
          hearing loss plus developmental delay, spasticity or dystonia should be offered sequencing rather
          than a metabolic workup, and AFG2B should be covered by neurodevelopmental and hearing-loss
          gene panels.
        notes: PMID:41375745 also reports an incidental de novo FRYL variant in the same proband that
          the authors could not exclude as a sequencing artefact. It is recorded here only as a reminder
          that incidental findings complicate interpretation in this ultra-rare disorder; it is not curated
          as a modifier.
      selected_evidence:
        snippet: We performed trio exome sequencing on the patient and her parents.
        supports: SUPPORT
