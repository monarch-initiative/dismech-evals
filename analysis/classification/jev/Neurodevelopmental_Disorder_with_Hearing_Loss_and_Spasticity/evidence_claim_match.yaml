  55e92085b2150d8d633e043f1ff35b739152ae1c077b73246c893b086de39d48:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with Hearing Loss and Spasticity
          disease_term:
            preferred_term: neurodevelopmental disorder with hearing loss and spasticity
            term:
              id: MONDO:0859206
              label: neurodevelopmental disorder with hearing loss and spasticity
        context: []
      assertion_type: Subtype
      assertion:
        name: DFNB119
        display_name: Isolated sensorineural hearing loss (DFNB119, OMIM:619615)
        classification: clinical_phenotype
        subtype_frequency: 22/47 (47%) of individuals in the founding cohort
        subtype_term:
          preferred_term: hearing loss, autosomal recessive 119
          term:
            id: MONDO:0030480
            label: hearing loss, autosomal recessive 119
        genes:
        - preferred_term: AFG2B
          term:
            id: hgnc:28762
            label: SPATA5L1
        description: 'DFNB119 is the presentation in which biallelic AFG2B variants produce sensorineural
          hearing loss and nothing else - no microcephaly, no developmental delay or impaired intellectual
          development, no spastic-dystonic motor phenotype and no epilepsy. OMIM gives it a separate phenotype
          number (OMIM:619615) from the syndromic presentation this entry is named for (NEDHLS, OMIM:619616),
          but both numbers were assigned from the same founding cohort and the same gene, and the separation
          is a description of how far the phenotype extends in a given individual rather than of a different
          lesion. It is modelled here as a subtype for three reasons, each of which is evidenced below.
          The founding report frames the disorder as a single entity with a variable extension ("with
          or without a nonprogressive mixed neurodevelopmental phenotype"). The same allele recurs on
          both sides of the split - c.527G>T, p.(Gly176Val) is reported in individuals with the full neurodevelopmental
          phenotype and repeatedly in individuals with isolated hearing loss - so no genotype partitions
          the two. And the hearing-loss mechanism curated in this entry''s pathophysiology is the mechanism
          of DFNB119: the divergence between the two presentations lies in whether the neural branch is
          also manifest, not in how the cochlear lesion arises.'
      selected_evidence:
        snippet: 'bi‐allelic variants in AFG2B have been associated with neurodevelopmental disorder with
          hearing loss and spasticity (OMIM #619616), as well as with isolated hearing loss (OMIM #619615)'
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
