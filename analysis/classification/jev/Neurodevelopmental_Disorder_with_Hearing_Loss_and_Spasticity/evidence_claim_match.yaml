          by `preferred_term` and `therapeutic_modality: DEVICE`. NCIT:C183182 (Hearing Aid) is also outside
          the cached enum expansion.'
      selected_evidence:
        snippet: In the 7th month of life audiological evaluation revealed bilateral sensorineural hearing
