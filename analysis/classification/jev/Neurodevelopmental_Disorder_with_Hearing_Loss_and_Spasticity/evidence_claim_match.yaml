            id: GO:0042254
            label: ribosome biogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: We provide evidence that these factors, together with CINP and SPATA5L1, control a late
          step of human pre-60S maturation in the cytoplasm.
        supports: SUPPORT
