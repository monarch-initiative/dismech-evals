        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Biallelic pathogenic or likely pathogenic variants
        notes: AFG2B is the current HGNC-approved symbol (HGNC:28762, OMIM:619578) for the gene published
          throughout the clinical literature as SPATA5L1. It encodes an AAA+ ATPase paralogous to AFG2A
          (SPATA5). The `term.label` reads SPATA5L1 because that is the label the cached HGNC adapter
          resolves; see entry note (1). Most reported alleles are private missense changes; nonsense alleles
          are also described. One recurrent allele, c.2066G>T (p.Gly689Val), was seen in four individuals
          of the founding cohort and again in a later unrelated case.
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        variants:
        - name: c.2066G>T (p.Gly689Val)
          description: A recurrent missense allele in the ATPase motor, reported in four individuals within
            the founding cohort of 25 patients and subsequently in an unrelated compound heterozygous
            case. It is predicted to disrupt ATP binding and hydrolysis and is reported as pathogenic
            in ClinVar.
          type: missense variant
          clinical_significance: LIKELY_PATHOGENIC
          gene:
            preferred_term: AFG2B
            term:
              id: hgnc:28762
              label: SPATA5L1
        - name: c.1918C>T (p.Arg640Ter)
          description: A rare nonsense allele introducing a premature stop codon, reported in trans with
            c.2066G>T. It meets PVS1 as a null allele in a gene where loss of function is an established
            mechanism, but was classified as of uncertain significance under ACMG rules in the report
            that described it.
          type: nonsense variant
          clinical_significance: UNCERTAIN_SIGNIFICANCE
          gene:
            preferred_term: AFG2B
            term:
              id: hgnc:28762
              label: SPATA5L1
        - name: c.1313T>C (p.Leu438Pro)
          description: A missense allele whose contribution was initially unclear because it was first
            observed as part of a complex disease allele alongside a second homozygous missense change.
            Observation in trans with an independent missense allele in a further patient supported its
            pathogenic relevance.
          type: missense variant
          clinical_significance: LIKELY_PATHOGENIC
          gene:
            preferred_term: AFG2B
            term:
              id: hgnc:28762
              label: SPATA5L1
        - name: c.527G>T (p.Gly176Val)
          description: A likely pathogenic missense allele identified by trio exome sequencing in trans
            with c.1313T>C in a girl with developmental delay, intellectual disability, sensorineural
            hearing loss, hypotonia and microcephaly.
          type: missense variant
          clinical_significance: LIKELY_PATHOGENIC
          gene:
            preferred_term: AFG2B
            term:
              id: hgnc:28762
              label: SPATA5L1
      selected_evidence:
        snippet: We report 28 bi-allelic variants in SPATA5L1 associated with sensorineural hearing loss
          in 47 individuals from 28 (26 unrelated) families.
