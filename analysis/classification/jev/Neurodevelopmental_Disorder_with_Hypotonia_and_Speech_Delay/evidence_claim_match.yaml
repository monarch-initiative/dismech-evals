      assertion_type: Discussion
      assertion:
        discussion_id: nedhss_lof_vs_gof_unresolved
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which specific EIF4A2 alleles act by loss of function and which by gain of function, and
          does the mechanism class predict the clinical phenotype?
        attaches_to:
        - pathophysiology#Impaired eIF4A2 Helicase and ATPase Function
        - pathophysiology#Rare EIF4A2 Variant
        rationale: The discovery paper concludes that both loss and gain of function operate, but the
          assignment rests on a Drosophila rescue assay scoring pupal lethality and variant-specific behavioural
          and developmental defects. No biochemical measurement of ATPase or helicase activity, RNA binding,
          or eIF4F/Ccr4-Not incorporation has been reported for any patient allele. Until that is done
          the direction of effect for a newly identified variant cannot be predicted, which blocks both
          variant interpretation and any dosage-based therapeutic reasoning. This is the load-bearing
          mechanistic uncertainty in the entry.
        proposed_experiments:
        - experiment_id: nedhss_exp_biochemistry
          name: Biochemical characterisation of patient eIF4A2 alleles
          description: Express and purify each reported patient eIF4A2 variant and measure RNA-stimulated
            ATPase activity, RNA duplex unwinding, and RNA binding affinity relative to wild-type protein.
          decision_criterion: Alleles clustering into a reduced-activity group and a normal-or-increased-activity
            group, matching the loss- versus gain-of-function assignment inferred from the fly assay.
          would_support:
          - pathophysiology#Impaired eIF4A2 Helicase and ATPase Function
          would_refute:
          - pathophysiology#Impaired eIF4A2 Helicase and ATPase Function
        - experiment_id: nedhss_exp_complex_incorporation
          name: eIF4F versus Ccr4-Not partitioning of variant eIF4A2
          description: Quantify incorporation of each variant eIF4A2 into eIF4F and into Ccr4-Not (CNOT1
            MA3/MIF4G binding) by co-immunoprecipitation, to test whether disease alleles shift the balance
            between the activating and the repressive arm.
          would_support:
          - pathophysiology#Loss of eIF4A2-Ccr4-Not-Mediated Translational Repression
      selected_evidence:
        snippet: Overall, our findings reveal that EIF4A2 variants cause a genetic neurodevelopmental
          syndrome with both LOF and gain of function as underlying mechanisms.
        supports: SUPPORT
