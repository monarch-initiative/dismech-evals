      assertion:
        name: EIF4A3-related Richieri-Costa-Pereira syndrome
        description: A named-entity trap rather than a clinical differential. EIF4A3 is a paralogue of
          EIF4A2 sharing 66% amino acid identity with eIF4A1, but it is a component of the exon junction
          complex rather than a translation-initiation factor, and biallelic EIF4A3 repeat expansions
          cause Richieri-Costa-Pereira syndrome, a craniofacial and limb malformation disorder with a
          completely different presentation. EIF4A1, the closest paralogue at 90% identity, has no established
          Mendelian disease. Literature searches on "EIF4A" must be disambiguated to the correct paralogue
          before evidence is used.
      selected_evidence:
        snippet: In humans, eIF4A1 and eIF4A2 are implicated in translation initiation and share 90% amino
          acid identity, while eIF4A3 is a component of the exon junction complex (EJC) and shares 66%
          amino acid identity with eIF4A1.
        supports: SUPPORT
