        presence: PRESENT
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        association: EIF4A2 (eukaryotic translation initiation factor 4A2, also known as DDX2B) is the
          single causal gene for NEDHSS. Both extremely rare de novo mono-allelic variants and inherited
          bi-allelic variants have been reported, across 15 individuals from 14 families, with a further
          mosaic proband described subsequently. Causality rests on the recurrence of ultra-rare variants
          across unrelated families, molecular modelling showing perturbation of key protein domains,
          and in vivo Drosophila rescue assays in which human EIF4A2 wild-type cDNA rescued eIF4A loss-of-function
          pupal lethality while the variant cDNAs failed or only incompletely rescued it. The evidence
          supports both loss- and gain-of-function as operating mechanisms across the allelic series,
          which is why the entry does not model a single directional dosage lesion.
        notes: '`variant_origin` is single-valued and is set to the predominant mode, DE_NOVO. It under-describes
          this gene: inherited bi-allelic variants and one mosaic proband are also reported. The full
          set of modes is curated in the three `inheritance` blocks (autosomal dominant de novo, autosomal
          recessive bi-allelic, somatic mosaicism), which is the authoritative statement for this entry.'
      selected_evidence:
        snippet: Here, we report on 15 individuals from 14 families presenting with global developmental
          delay, intellectual disability, hypotonia, epilepsy, and structural brain anomalies, all of
          whom have extremely rare de novo mono-allelic or inherited bi-allelic variants in EIF4A2
