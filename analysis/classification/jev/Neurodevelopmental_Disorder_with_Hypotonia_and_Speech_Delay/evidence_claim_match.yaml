        context: []
      assertion_type: Diagnosis
      assertion:
        name: Neuroimaging and EEG
        description: 'Brain MRI is indicated because structural brain anomalies are a defining feature.
          Dedicated high-resolution imaging of the internal auditory canal should be added when there
          is any hearing concern, because absent cochlear nerve has been reported in this disorder and
          cochlear nerve aplasia is the one hearing-loss aetiology in which a cochlear implant cannot
          work - so the imaging result, not the audiogram, determines whether implantation is even an
          option. EEG has a specific pitfall in this disorder: the epileptic spasms reported in both patients
          of the 2026 series were initially electrographically negative, so a normal early EEG does not
          exclude evolving infantile spasms and repeat or prolonged video-EEG is warranted when spells
          are described.'
      selected_evidence:
        snippet: Both cases presented here involve patients who developed subtle, initially electrographically
          negative, epileptic spasms before going on to develop characteristic findings of infantile spasms
          requiring hormonal treatment.
