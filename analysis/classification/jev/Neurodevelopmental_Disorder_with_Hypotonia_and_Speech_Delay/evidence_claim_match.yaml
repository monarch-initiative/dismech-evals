              seizures
            term:
              id: MONDO:0957541
              label: neurodevelopmental disorder with hypotonia and speech delay, with or without seizures
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Trio exome or genome sequencing
        description: NEDHSS has no pathognomonic clinical signature; every reported individual was ascertained
          through genomic testing for unexplained global developmental delay, intellectual disability,
          hypotonia and epilepsy. Trio-based exome or genome sequencing is the practical diagnostic route
          because it both finds the ultra-rare EIF4A2 variant and establishes whether it is de novo mono-allelic
          or inherited bi-allelic - a distinction that carries prognostic weight, since neurodegeneration
          predominates in the bi-allelic group, and determines recurrence counselling. The defining cohort
          was assembled from clinical and research sequencing programs including the Genomics England
          100,000 Genomes Project and a commercial diagnostic laboratory.
      selected_evidence:
        snippet: Here, we report on 15 individuals from 14 families presenting with global developmental
          delay, intellectual disability, hypotonia, epilepsy, and structural brain anomalies, all of
          whom have extremely rare de novo mono-allelic or inherited bi-allelic variants in EIF4A2
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36528028
      reference_title: Rare EIF4A2 variants are associated with a neurodevelopmental disorder characterized
        by intellectual disability, hypotonia, and epilepsy.
      evidence_source: HUMAN_CLINICAL
      explanation: Diagnosis rests on identifying an ultra-rare EIF4A2 variant and determining its zygosity
        and inheritance, which is what trio sequencing provides.
