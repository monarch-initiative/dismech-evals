              seizures
            term:
              id: MONDO:0957541
              label: neurodevelopmental disorder with hypotonia and speech delay, with or without seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deregulated Neurodevelopmental mRNA Translation Program
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: Because eIF4A2 both activates initiation on some transcripts and represses others
          via Ccr4-Not, its disruption reshapes a specific translational program rather than reducing
          protein output globally. In embryonic stem cells, eIF4A2 activates translation of pluripotency-factor
          and histone H3.3 mRNAs while restricting the totipotent two-cell program, and its knockdown
          disrupts the proteome and causes loss of cell identity - the clearest experimental demonstration
          that eIF4A2 dosage sets a developmental cell-fate program through translation. The disease-relevant
          claim, that the equivalent program in developing human neurons is what fails in NEDHSS, is an
          extension from stem-cell and invertebrate systems and is therefore provisional.
        cell_types:
        - preferred_term: neural stem cell
          term:
            id: CL:0000047
            label: neural stem cell
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: regulation of translation
          term:
            id: GO:0006417
            label: regulation of translation
          modifier: ABNORMAL
        - preferred_term: neuron differentiation
          term:
            id: GO:0030182
            label: neuron differentiation
          modifier: ABNORMAL
      selected_evidence:
        snippet: We identified eukaryotic translation initiation factor 4A2 (eIF4A2) and defined its mechanistic
          action through ribosomal protein S26-independent and -dependent ribosomes in translation initiation
          activation of messenger RNAs (mRNAs) encoding pluripotency factors and the histone variant H3.3
          with demonstrated roles in maintaining stem cell pluripotency.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
