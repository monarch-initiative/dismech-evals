      assertion:
        discussion_id: nedhss_cohort_too_small
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the full phenotypic spectrum, natural history and genotype-phenotype correlation
          of NEDHSS beyond the 15 individuals of the defining cohort?
        attaches_to:
        - pathophysiology#Global Neurodevelopmental Impairment
        rationale: The entity rests on a single 15-person cohort plus a two-patient series. Frequencies
          in this entry are therefore small-denominator estimates derived from a group-level presenting-features
          sentence; several features named in OMIM and MedGen (poor or absent speech, inability to walk,
          tube feeding) could not be given an independent numerator from any abstract-level source and
          are curated here without frequency bands. Adult outcomes are unknown, and whether the mono-allelic
          and bi-allelic arms differ in anything beyond neurodegeneration cannot be assessed.
        proposed_experiments:
        - experiment_id: nedhss_exp_international_cohort
          name: International EIF4A2 cohort with HPO-coded deep phenotyping
          description: Assemble additional EIF4A2 probands through GeneMatcher, DECIPHER and diagnostic
            laboratories and collect standardised HPO-coded phenotyping with per-feature counts, so that
            frequency bands can be derived rather than inferred.
          would_support:
          - pathophysiology#Global Neurodevelopmental Impairment
        - experiment_id: nedhss_exp_natural_history
          name: Longitudinal natural history of the mono-allelic and bi-allelic arms
          description: Follow mono-allelic and bi-allelic individuals prospectively for regression, seizure
            course, ambulation, feeding status and communication outcome, to characterise the degenerative
            arm.
          would_support:
          - pathophysiology#Progressive Neurodegeneration in Bi-allelic Disease
      selected_evidence:
        snippet: Here, we report on 15 individuals from 14 families presenting with global developmental
          delay, intellectual disability, hypotonia, epilepsy, and structural brain anomalies, all of
          whom have extremely rare de novo mono-allelic or inherited bi-allelic variants in EIF4A2
        supports: SUPPORT
