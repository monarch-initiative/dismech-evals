        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nedhss_epileptogenesis_mechanism_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what route does deregulated eIF4A2-dependent translation produce epileptic spasms,
          and is the epilepsy a consequence of the structural brain anomaly or an independent network
          effect?
        attaches_to:
        - pathophysiology#Cortical Network Hyperexcitability and Epileptogenesis
        rationale: Epilepsy is a defining feature and the reported semiology (electrographically negative
          spasms evolving to refractory infantile spasms) is specific enough to be mechanistically informative,
          yet nothing is known about how EIF4A2 dysfunction produces it. Neither the structural-lesion
          hypothesis nor an independent excitability hypothesis has been tested, and no electrophysiology
          in any EIF4A2 model has been reported. Resolving this would determine whether antiseizure choice
          should follow the structural-epilepsy playbook or something disorder-specific.
        proposed_experiments:
        - experiment_id: nedhss_exp_neuronal_excitability
          name: Excitability phenotyping of EIF4A2-variant neurons
          description: Measure intrinsic excitability and network burst behaviour of EIF4A2-variant iPSC-derived
            neurons on multielectrode arrays and by patch-clamp, with isogenic controls.
          decision_criterion: A reproducible hyperexcitable phenotype in variant neurons in the absence
            of any structural abnormality would support an independent network effect.
          would_support:
          - pathophysiology#Cortical Network Hyperexcitability and Epileptogenesis
          would_refute:
          - pathophysiology#Cortical Network Hyperexcitability and Epileptogenesis
        - experiment_id: nedhss_exp_imaging_epilepsy_correlation
          name: Imaging-epilepsy correlation across the reported cohort
          description: Correlate the specific structural brain anomaly with seizure type, onset age, and
            treatment refractoriness across all reported EIF4A2 individuals to test whether epilepsy tracks
            the structural lesion.
          would_support:
          - pathophysiology#Disrupted Brain Development with Structural Brain Anomalies
      selected_evidence:
        snippet: Both cases presented here involve patients who developed subtle, initially electrographically
          negative, epileptic spasms before going on to develop characteristic findings of infantile spasms
          requiring hormonal treatment.
        supports: SUPPORT
