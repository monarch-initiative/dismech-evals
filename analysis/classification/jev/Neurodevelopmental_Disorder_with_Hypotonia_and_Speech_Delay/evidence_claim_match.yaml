      assertion_type: Discussion
      assertion:
        discussion_id: nedhss_human_neuronal_translatome_missing
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the eIF4A2-dependent translation program characterised in mouse embryonic stem cells
          and Drosophila actually correspond to the program that fails in developing human neurons in
          NEDHSS?
        attaches_to:
        - pathophysiology#Deregulated Neurodevelopmental mRNA Translation Program
        - pathophysiology#Deregulated Cap-Dependent Translation Initiation and 43S Scanning
        rationale: 'Every functional characterisation of what eIF4A2 does to a developmental program comes
          from a non-human, non-neuronal system: mouse embryonic stem cells (pluripotency factors, histone
          H3.3, Zscan4) and Drosophila (dpp signalling, wing and eye morphogenesis). The one human-cell
          dataset is fibroblasts from the allelic dystonia families, assaying a single Ccr4-Not target.
          No human neuron, cortical organoid, or patient iPSC-derived neural model of EIF4A2 has been
          reported, and no neuronal translatome has been measured. This is a translational-validity question
          rather than a simple absence of evidence: the model data exist and are strong, but the mRNA
          targets that matter are cell-type-specific by the models'' own logic, so their transfer to human
          neurons is the open question. It matters because the identity of the mis-translated neuronal
          transcripts is what any mechanism-directed therapy would have to act on.'
        proposed_experiments:
        - experiment_id: nedhss_exp_ipsc_neurons
          name: Patient iPSC-derived cortical neuron translatome
          description: Derive iPSCs from EIF4A2-variant probands and isogenic controls, differentiate
            to cortical neurons, and profile the translatome by ribosome profiling with paired RNA-seq
            and proteomics.
          decision_criterion: Identification of a reproducible set of transcripts with altered translational
            efficiency in variant neurons, enriched for neurodevelopmental function.
          would_support:
          - pathophysiology#Deregulated Neurodevelopmental mRNA Translation Program
          would_refute:
          - pathophysiology#Deregulated Neurodevelopmental mRNA Translation Program
        - experiment_id: nedhss_exp_eclip_neurons
          name: eIF4A2 eCLIP in human neural cells
          description: Map eIF4A2 RNA-binding sites in human neural progenitors and neurons by eCLIP-seq
            and test whether the mouse ESC target set is conserved or whether a distinct neuronal target
            set is bound.
          would_support:
          - pathophysiology#Deregulated Cap-Dependent Translation Initiation and 43S Scanning
        - experiment_id: nedhss_exp_organoid_structure
          name: Cortical organoid model of the structural brain phenotype
          description: Test whether EIF4A2-variant cortical organoids reproduce a structural or progenitor-proliferation
            abnormality corresponding to the structural brain anomalies seen on patient imaging.
          would_support:
          - pathophysiology#Disrupted Brain Development with Structural Brain Anomalies
      selected_evidence:
        snippet: Accordingly, knockdown of eIF4A2 disrupts ESC proteome, causing the loss of ESC identity.
        supports: SUPPORT
    origin:
