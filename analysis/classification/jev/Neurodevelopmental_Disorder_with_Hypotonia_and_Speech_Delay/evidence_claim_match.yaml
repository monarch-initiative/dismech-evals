        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deregulated Cap-Dependent Translation Initiation and 43S Scanning
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: Within the eIF4F cap-binding complex, eIF4A resolves secondary structure in the 5'
          leader so that the 43S preinitiation complex can be loaded and can scan to the start codon;
          pharmacological clamping of eIF4A1/eIF4A2 onto RNA blocks exactly these steps. eIF4A2 recognises
          the 5' cap structure, permits mRNA loading onto the ribosome, and binds preferentially in the
          translation initiation region spanning the 5' UTR and the adjacent start of the coding sequence.
          Importantly, eIF4A2 loss does not collapse bulk protein synthesis - global translation rates
          are unchanged in eIF4A2-depleted cells - so the disease-relevant consequence is a shift in which
          mRNAs are efficiently initiated, not a general translational shutdown.
        molecular_functions:
        - preferred_term: mRNA cap binding
          term:
            id: GO:0098808
            label: mRNA cap binding
        biological_processes:
        - preferred_term: translational initiation
          term:
            id: GO:0006413
            label: translational initiation
          modifier: ABNORMAL
      selected_evidence:
        snippet: Eukaryotic initiation factor-4A2 (EIF4A2) is an ATP-dependent RNA helicase and a member
          of the DEAD-box protein family that recognizes the 5' cap structure of mRNAs, allows mRNA to
          bind to the ribosome, and plays an important role in microRNA-regulated gene repression.
        supports: SUPPORT
    origin:
