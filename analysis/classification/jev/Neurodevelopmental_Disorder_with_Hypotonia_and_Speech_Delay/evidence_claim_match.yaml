  060aee48e7e3a894cc53ef9404ff445f842c444b86e4d64396f34fcd733a0bf7:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with Hypotonia and Speech Delay, With or Without Seizures
          disease_term:
