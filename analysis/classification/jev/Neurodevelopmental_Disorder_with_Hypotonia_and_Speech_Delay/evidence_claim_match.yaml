      assertion_type: Pathophysiology
      assertion:
        name: Reduced eIF4A2 Protein Dosage
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Truncating EIF4A2 alleles reduce eIF4A2 protein abundance. In fibroblasts from carriers
          of the heterozygous frameshift deletion c.896_897del, eIF4A2 protein was reduced to approximately
          half of the normal level, establishing haploinsufficiency as a real, measurable consequence
          of truncating EIF4A2 alleles. The same study showed a dose-dependent relationship between eIF4A2
          functional dosage and the downstream Ccr4-Not target IMP1 by comparing heterozygous and bi-allelic
          patient fibroblasts. These fibroblasts derive from the allelic dystonia-tremor syndrome rather
          than from NEDHSS probands, so this node states what reduced EIF4A2 dosage does to the translational
          machinery, not that dystonia is a NEDHSS feature.
        genes:
        - preferred_term: EIF4A2
          term:
            id: hgnc:3284
            label: EIF4A2
      selected_evidence:
        snippet: In patient-derived fibroblasts, eIF4A2 production amounted to only 50% of the normal
          quantity.
        supports: SUPPORT
