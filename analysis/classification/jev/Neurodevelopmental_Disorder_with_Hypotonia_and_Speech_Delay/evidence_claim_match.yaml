              seizures
            term:
              id: MONDO:0957541
              label: neurodevelopmental disorder with hypotonia and speech delay, with or without seizures
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Drosophila eIF4A LOF rescue with human EIF4A2 variant cDNA
        species: Drosophila melanogaster
        genotype: eIF4A loss-of-function with transgenic human EIF4A2 wild-type or variant cDNA
        genes:
        - preferred_term: EIF4A2
          term:
            id: hgnc:3284
            label: EIF4A2
        description: The humanised fly assay used to establish pathogenicity of the mono-allelic EIF4A2
          variants. Loss of the fly orthologue eIF4A causes pupal lethality; this lethality is fully rescued
          by expression of human wild-type EIF4A2 cDNA, whereas the patient variant cDNAs failed or only
          incompletely rescued it. Expression of the variants also produced variant-specific behavioural
          and developmental defects, which is the observation that led the authors to invoke gain of function
          in addition to loss of function.
        associated_phenotypes:
        - Pupal lethality on eIF4A loss of function
        - Variant-specific behavioural defects
        - Variant-specific developmental defects
        publication: PMID:36528028
        modeled_mechanisms:
        - target: Rare EIF4A2 Variant
          relationship: PERTURBS
          fidelity: MODERATE
          description: Tests each human EIF4A2 patient allele for its ability to substitute for the endogenous
            fly orthologue, providing the in vivo pathogenicity assignment for the variants curated in
            this entry.
          limitations: The fly orthologue eIF4A is a single gene standing in for the human eIF4A1/eIF4A2
            pair, and the readouts (pupal lethality, wing and eye morphogenesis) are invertebrate developmental
            endpoints with no direct counterpart in human brain development.
        - target: Impaired eIF4A2 Helicase and ATPase Function
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Incomplete rescue by the variant cDNAs, relative to complete rescue by wild-type
            EIF4A2, is the in vivo evidence that the variants impair eIF4A2 function; variant-specific
            extra phenotypes are the evidence that some alleles do more than lose function.
          limitations: The assay scores organismal viability and morphology rather than helicase or ATPase
            biochemistry, so it reports that function is impaired without resolving which step of the
            helicase cycle fails.
        - target: Deregulated Neurodevelopmental mRNA Translation Program
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: The fly orthologue regulates a developmental signalling and stem-cell identity
            program, so the model shows that eIF4A dysfunction perturbs a developmental program - but
            the specific program is dpp signalling in fly tissues, not a human neuronal translation program.
          limitations: 'Fidelity is LOW for this node: decapentaplegic signalling, eye and wing morphogenesis
            have no human neurodevelopmental counterpart, and no neuronal translatome measurement was
            made in the model.'
        notes: A constitutive Eif4a2 knockout mouse exists and is viable, in contrast to the lethal Eif4a1
          knockout; it has not been reported as a NEDHSS model and is therefore not curated as one here.
      selected_evidence:
        snippet: Our loss-of-function (LOF) rescue assay demonstrated a pupal lethality phenotype induced
          by loss of eIF4A, which was fully rescued with human EIF4A2 wild-type (WT) cDNA expression.
        supports: SUPPORT
