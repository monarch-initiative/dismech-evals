        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: zebrafish_cannot_model_language_or_behaviour
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the zebrafish psmb1 model capture the disorder, when the two features that name it
          besides microcephaly — absent language and behavioural abnormality — have no zebrafish correlate?
        attaches_to:
        - pathophysiology#Impaired Brain Growth and Neurodevelopment
        rationale: The zebrafish model recapitulates reduced brain size convincingly, by two independent
          perturbations. But it is a complete loss-of-function model of a disease caused by a partial-loss-of-function
          missense allele, and it cannot report language, intellectual disability, or behaviour. Treating
          the model as validating the whole phenotype would overstate it; it validates the brain-growth
          arm only.
        proposed_experiments:
        - experiment_id: exp_nedmhal_knockin_tyr103his_zebrafish
          name: Generate a knock-in model carrying the orthologous Tyr103His
          description: Generate a knock-in model carrying the orthologous Tyr103His substitution and compare
            its brain phenotype and proteasome assembly with the null.
        - experiment_id: exp_nedmhal_ipsc_neural_progenitor_organoid
          name: Use human iPSC-derived neural progenitors and cortical organoids
          description: Use human iPSC-derived neural progenitors and cortical organoids from genotype-matched
            cells to test whether proliferation and neurogenesis are impaired at the reported partial
            reduction in proteasome activity.
      selected_evidence:
        snippet: CRISPR/Cas9 mutagenesis or morpholino knock-down of the single psmb1 zebrafish orthologue
          resulted in microcephaly, microphthalmia and reduced brain size.
        supports: SUPPORT
