        name: Destabilised beta6-alpha5 Interface of the 20S Core Particle
        biological_scale: MOLECULAR
        description: The 20S core particle is built from four stacked heptameric rings in the order alpha7-beta7-beta7-alpha7,
          so every beta subunit sits against defined neighbouring alpha and beta subunits. Weakening the
          beta6 (PSMB1) contact with alpha5 (PSMA5) destabilises the assembled core particle.
        cellular_components:
        - preferred_term: 20S proteasome core particle
          term:
            id: GO:0005839
            label: proteasome core complex
        - preferred_term: proteasome beta-ring
          term:
            id: GO:0019774
            label: proteasome core complex, beta-subunit complex
      selected_evidence:
        snippet: 'The 20S CP consists of stringently ordered heptameric α- and β-rings: α7-β7-β7-α7'
        supports: SUPPORT
