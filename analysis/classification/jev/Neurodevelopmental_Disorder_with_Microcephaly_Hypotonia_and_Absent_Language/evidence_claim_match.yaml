      assertion_type: MechanisticNosologyAssignment
      assertion:
        classification_value: proteotoxic disease
        notes: 'Assigned on the degradation side of proteostasis: the primary lesion is in the proteasome
          itself rather than in an aggregation-prone client protein, so this is proteostasis failure by
          loss of degradative capacity. No PSMB1-specific aggregation or interferon-signature data exist
          yet (see the knowledge-gap discussion), and the classification rests on the class-level characterisation
          of proteasomopathies.'
      selected_evidence:
        snippet: The concomitant proteasome impairment leads to imbalanced protein homeostasis by dysfunctional
          ubiquitin-mediated protein degradation.
        supports: SUPPORT
