            term:
              id: MONDO:0859287
              label: neurodevelopmental disorder with microcephaly, hypotonia, and absent language
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: core_particle_versus_regulatory_particle
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Are neurodevelopmental proteasomopathies essentially diseases of the 19S regulatory particle,
          and if so why does a 20S core-particle lesion produce the same phenotypic class?
        attaches_to:
        - pathophysiology#Destabilised beta6-alpha5 Interface of the 20S Core Particle
        rationale: 'PSMB1 p.(Tyr103His) is the lone 20S core-particle lesion among the variants identified
          in neurodevelopmental proteasomopathies, and it is also one of the few recessive ones — the
          rest are dominant, de novo, and in the 19S regulatory particle. Two reviews read the same fact
          in opposite directions: one treats the overwhelming 19S predominance as evidence that these
          are fundamentally 19S disorders, while the other treats PSMB1 as the case that breaks the subcomplex-determines-phenotype
          rule. The resolution matters for how the entity is grouped and for which proteasome genes should
          be searched in undiagnosed neurodevelopmental disorders.'
        proposed_experiments:
        - experiment_id: exp_nedmhal_20s_subunit_cohort_screen
          name: Systematically screen 20S core-particle subunit genes in large
          description: Systematically screen 20S core-particle subunit genes in large neurodevelopmental
            disorder cohorts to establish whether 20S lesions are genuinely rare or merely under-ascertained.
        - experiment_id: exp_nedmhal_matched_20s_19s_assembly_activity
          name: Compare proteasome assembly
          description: Compare proteasome assembly, activity and interferon output side by side between
            matched 20S and 19S proteasomopathy variants in a common cell background.
      selected_evidence:
        snippet: only one (i.e., p.Tyr103His in PSMB1/β6) of the forty-three lesions identified in individuals
          with neurodevelopmental proteasomopathies affect the 20S CP strongly suggests that these disorders
          are essentially diseases of the 19S RP
        supports: SUPPORT
