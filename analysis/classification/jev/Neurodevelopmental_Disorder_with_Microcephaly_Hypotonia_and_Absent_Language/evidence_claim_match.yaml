            term:
              id: MONDO:0859287
              label: neurodevelopmental disorder with microcephaly, hypotonia, and absent language
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: interferon_signature_untested_in_psmb1
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do PSMB1-deficient cells show the protein aggregation, stress-response activation and
          type I interferon dysregulation reported across other proteasomopathies?
        attaches_to:
        - pathophysiology#Impaired Ubiquitin-Dependent Protein Homeostasis
        rationale: 'Proteasomopathies as a class — both the autoinflammatory and the neurodevelopmental
          arm — converge on protein aggregation, activated stress responses and dysregulated type I interferon
          signalling, and interferon signatures are being explored as biomarkers for the class. None of
          this has been measured in PSMB1-mutant cells, so the downstream half of the mechanism chain
          in this entry is asserted at class level and inherited by analogy rather than demonstrated.
          The gap is sharper than mere absence of data: PSMB1 is explicitly named in the literature as
          the one 20S core-particle subunit whose pathogenic variants have not been shown to provoke immune
          dysregulation, while every other 20S lesion has. So the class-level interferon expectation may
          specifically fail to apply here, and importing it into this entry''s mechanism would be the
          wrong inference rather than merely an unverified one. This matters practically: a proteasome-activity
          or interferon-signature assay would otherwise be the natural functional test for candidate PSMB1
          variants of uncertain significance.'
        proposed_experiments:
        - experiment_id: exp_nedmhal_ubiquitin_load_and_ifn_signature
          name: Measure polyubiquitinated protein load
          description: Measure polyubiquitinated protein load, proteotoxic stress-response activation
            and a type I interferon signature in cells carrying PSMB1 p.(Tyr103His).
        - experiment_id: exp_nedmhal_20s_versus_19s_ifn_comparison
          name: Compare the magnitude of any interferon response
          description: Compare the magnitude of any interferon response with that of the 19S regulatory-particle
            proteasomopathies to test whether the 20S core-particle lesion behaves differently.
      selected_evidence:
        snippet: both syndromes show molecular similarities with protein aggregation, activated stress
          responses, metabolic imbalance and dysregulated type I interferon signalling
        supports: SUPPORT
