        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: single_kindred_phenotype_boundary
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which features of NEDMHAL are intrinsic to PSMB1 deficiency, and which are particular
          to the single consanguineous kindred in which it was described?
        attaches_to:
        - pathophysiology#Impaired Brain Growth and Neurodevelopment
        rationale: The entity rests on two affected sisters from one family plus functional validation.
          Every phenotype frequency available is a 2/2 or 1/2 count from that kindred, so no feature can
          currently be separated from the family's shared genetic background and consanguinity-associated
          homozygosity elsewhere in the genome. This is why no `frequency:` qualifier is asserted on any
          phenotype in this entry. The absence of epilepsy, autistic features and visceral malformations
          is likewise a statement about two people.
        proposed_experiments:
        - experiment_id: exp_nedmhal_matchmaking_additional_families
          name: Identify additional families
          description: Identify additional families with biallelic PSMB1 variants through international
            matchmaking (GeneMatcher, DECIPHER, Matchmaker Exchange) and determine which features recur.
        - experiment_id: exp_nedmhal_allelic_series_genotype_phenotype
          name: Determine whether other PSMB1 alleles
          description: Determine whether other PSMB1 alleles, particularly compound heterozygous or truncating
            combinations, produce the same phenotype or a distinct severity.
      selected_evidence:
        snippet: Notably, visceral malformations have not been reported in forms with PSMB1 or PSMC3 biallelic
          variants nor with PSMC1 deletions
        supports: SUPPORT
