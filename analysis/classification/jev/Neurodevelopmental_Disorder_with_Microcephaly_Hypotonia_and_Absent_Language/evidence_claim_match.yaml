        context: []
      assertion_type: Genetic
      assertion:
        name: PSMB1
        gene_term:
          preferred_term: PSMB1
          term:
            id: hgnc:9537
            label: PSMB1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: PSMB1 (6q27) encodes beta6, a non-catalytic beta-type subunit of the 20S proteasome core
          particle. A single pathogenic allele, the homozygous missense c.307T>C p.(Tyr103His), has been
          reported. PSMB1 is the only 20S core-particle gene implicated in a neurodevelopmental proteasomopathy;
          every other gene in the class encodes a 19S regulatory-particle subunit.
        variants:
        - name: PSMB1 c.307T>C p.(Tyr103His)
