        role: consequence
        mechanism_confidence: HYPOTHETICAL
        description: Scoliosis, hip dysplasia/acetabular dysplasia, coxa valga, pes cavus, hammertoe and
          distal arthrogryposis are recorded in the OMIM clinical synopsis for this disorder and give
          the entity its name. No cell-autonomous role for NRCAM in bone or cartilage has been reported,
          and NRCAM is characterized throughout the literature as a nervous-system adhesion molecule;
          the skeletal findings are therefore modeled here as secondary to chronic abnormal biomechanical
          loading from hypotonia, spasticity and neurogenic muscle weakness — the same route by which
          scoliosis, hip subluxation and cavus foot arise in other early-onset neuromuscular disorders.
          This is an inference, not a demonstrated mechanism; it is flagged as a KNOWLEDGE_GAP and the
          confidence is HYPOTHETICAL.
