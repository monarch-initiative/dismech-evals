          hearing impairment in some affected individuals.
        limitations: Transient cochlear phenotype with functional recovery by weaning; humans appear to
          lack the compensatory mechanism.
      selected_evidence:
        snippet: Neonatal Nrcam-null cochleae show errors in type II SGN fasciculation, reduced efferent
          innervation, and defects in the stereotyped packing of hair and supporting cells.
        supports: SUPPORT
