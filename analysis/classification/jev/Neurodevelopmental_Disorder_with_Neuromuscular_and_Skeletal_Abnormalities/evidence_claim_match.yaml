      assertion:
        name: Impaired Synaptogenesis and Dendritic Spine Remodeling
        biological_scale: CELLULAR
        role: intermediate
        mechanism_confidence: PROVISIONAL
        description: Beyond its presynaptic and axonal roles, NrCAM acts postsynaptically as an integral
          component of the Semaphorin 3F receptor complex with Neuropilin-2 and PlexinA3, and is required
          for Sema3F-induced dendritic spine pruning. NrCAM-null mice show elevated spine density, increased
          asymmetric synapse number and increased miniature EPSC frequency in visual cortex, i.e. a shift
          in excitatory/inhibitory balance. This arm is mechanistically well supported in the mouse but
          has not been demonstrated in tissue from affected individuals, hence the provisional confidence.
        biological_processes:
        - preferred_term: synapse assembly
          modifier: ABNORMAL
          term:
            id: GO:0007416
            label: synapse assembly
        - preferred_term: dendrite development
          modifier: ABNORMAL
          term:
            id: GO:0016358
            label: dendrite development
        cellular_components:
        - preferred_term: synapse
          term:
            id: GO:0045202
            label: synapse
      selected_evidence:
        snippet: These findings reveal NrCAM as a novel postnatal regulator of dendritic spine density
          in cortical pyramidal neurons, and an integral component of the Sema3F receptor complex.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
