  cb2ebdeb26bef130bba9132c1872b4f98aeb664af6b26efaa9daf0b2df84b33f:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with Neuromuscular and Skeletal Abnormalities
          disease_term:
            preferred_term: neurodevelopmental disorder with neuromuscular and skeletal abnormalities
            term:
              id: MONDO:0859236
              label: neurodevelopmental disorder with neuromuscular and skeletal abnormalities
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Nrcam knockout mouse
        species: Mouse
        genotype: Nrcam-null (homozygous knockout)
        description: Constitutive Nrcam-null mice reproduce the cellular defects of the disorder — delayed
          and abnormal node of Ranvier formation with delayed sodium channel clustering, failure of cerebellar
          granule cells to extend neurites on contactin-1, excess dendritic spines with increased mEPSC
          frequency in visual cortex, thalamic axon mistargeting with abnormal visual-evoked potentials,
          lens fibre disorganization with cataract, and transient cochlear innervation errors — yet do
          not develop a neuromuscular disorder and have only mildly reduced cerebellar size. The disconnect
          is the central translational caveat for this entry.
        publication: PMID:35108495
        modeled_mechanisms:
        - target: Defective Node of Ranvier Assembly and Maintenance
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Peripheral nerves of Nrcam-deficient mice show delayed or abnormal node formation
            with delayed nodal sodium channel clustering, the same lesion proposed to underlie the human
            peripheral neuropathy.
          limitations: Node formation is delayed rather than abolished, because gliomedin provides a partially
            redundant glial clustering signal; the severe nodal phenotype requires loss of both molecules.
        - target: Neuromuscular Dysfunction
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: Despite the nodal defect, Nrcam-null mice show no neuromuscular disorder, in contrast
            to the hypotonia, spasticity and neuropathy present in every reported affected individual.
          limitations: 'Probable compensation by other L1-family Ig-CAMs (L1cam, Chl1, Nfasc) in mouse,
            and possible transcriptional adaptation triggered by nonsense-mediated decay of the null allele.
            Species differences in the protein itself are also implicated: the KGE and RNRR motifs of
            the human third Fn-III domain are poorly conserved outside mammals.'
        - target: Impaired Synaptogenesis and Dendritic Spine Remodeling
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: NrCAM-null cortex shows elevated dendritic spine density, increased asymmetric
            synapses and increased mEPSC frequency, establishing NrCAM as a postnatal regulator of spine
            density within the Sema3F receptor complex.
          limitations: Measured in mouse primary visual cortex; no corresponding measurement exists in
            tissue from affected individuals, so the relevance to the human cognitive and behavioural
            phenotype is inferred.
          readouts:
          - name: Apical dendritic spine density on star pyramidal cells
            target: Impaired Synaptogenesis and Dendritic Spine Remodeling
            direction: INCREASED
            interpretation: Loss of NrCAM removes Sema3F-dependent spine pruning, raising spine density.
          - name: Miniature EPSC frequency in star pyramidal neurons
            target: Impaired Synaptogenesis and Dendritic Spine Remodeling
            direction: INCREASED
            interpretation: Functional correlate of the excess excitatory synapses.
        - target: Sensory Pathway Miswiring
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Nrcam-null mice reproduce the developmental miswiring — thalamic axon mistargeting
            to visual cortex with abnormal VEPs, and cochlear afferent and efferent innervation errors
            — but the cochlear defects self-correct and adult auditory acuity is normal, unlike the persistent
            hearing impairment in some affected individuals.
          limitations: Transient cochlear phenotype with functional recovery by weaning; humans appear
            to lack the compensatory mechanism.
      selected_evidence:
        snippet: In addition, while KO mice have delayed nodes of Ranvier formation and subsequently delayed
          sodium channel clustering at nodes, they do not exhibit signs of a neuromuscular disorder.
        supports: SUPPORT
