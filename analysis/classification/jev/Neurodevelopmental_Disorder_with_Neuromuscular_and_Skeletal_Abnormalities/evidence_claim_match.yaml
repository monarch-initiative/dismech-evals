          term:
            id: GO:0005886
            label: plasma membrane
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: Neurofascin, NrCAM, L1, and NgCAM are a family of Ig/FNIII cell adhesion molecules that
          share ankyrin-binding activity in their cytoplasmic domains
