        name: Autosomal recessive
        description: 'Disease requires bi-allelic NRCAM variants. Reported genotypes are homozygous (frequently
          in consanguineous or founder families) or compound heterozygous, and variants co-segregated
          with disease in all eight families of the founding cohort. Heterozygous carriers, including
          the parents, are unaffected. Expressivity is markedly variable, both between and within genotype
          classes: from hydrocephalus with failure to thrive and death in infancy, through developmental
          delay with hypotonia/neuropathy or spasticity, to isolated late-onset peripheral neuropathy
          with normal cognition.'
        inheritance_term:
          preferred_term: autosomal recessive inheritance
          term:
