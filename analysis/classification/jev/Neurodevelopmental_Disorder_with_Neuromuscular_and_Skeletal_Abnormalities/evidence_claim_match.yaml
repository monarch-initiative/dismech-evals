            the zebrafish counterpart of the mammalian pallium and of the commissural tracts abnormal
            on human MRI.
          limitations: The axonal differences were reported as trends and did not reach significance;
            the pallium is massively expanded in humans relative to zebrafish; and the KGE and RNRR motifs
            of the human third Fn-III domain are not conserved in zebrafish Nrcam (HGD and QDYD), so the
            deleted domain is not functionally equivalent.
      selected_evidence:
        snippet: Our studies on zebrafish nrcamaΔ mutants lacking the third Fn-III domain revealed that
          mutant larvae displayed significantly altered swimming behavior compared to wild-type larvae
          (p < 0.03).
