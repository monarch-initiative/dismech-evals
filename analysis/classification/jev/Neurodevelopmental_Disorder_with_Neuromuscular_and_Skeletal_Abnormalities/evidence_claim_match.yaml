            term:
              id: MONDO:0859236
              label: neurodevelopmental disorder with neuromuscular and skeletal abnormalities
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Gliomedin/NrCAM double knockout mouse
        species: Mouse
        genotype: Gldn-null; Nrcam-null double knockout
        description: Removing both glial nodal adhesion molecules abolishes the glial clustering signal
          entirely and, unlike either single knockout, produces progressive disintegration of established
          nodes — sequential loss of neurofascin-186, sodium channels, ankyrin-G and then βIV spectrin,
          binary node formation and dysregulated nodal gap length — with neurological abnormality and
          slowed nerve conduction. It is the model that isolates the consequences of losing NrCAM-dependent
          nodal contact from the redundancy that masks them in the single mutant.
        publication: PMID:24719088
        modeled_mechanisms:
        - target: Peripheral Nerve Conduction Failure and Axonal Degeneration
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Loss of the gliomedin/NrCAM clustering signal produces measurable slowing of nerve
            conduction and neurological abnormality.
          limitations: The double knockout removes a redundant partner that is intact in affected individuals,
            so the model overstates the nodal deficit expected from NRCAM loss alone; it establishes the
            direction of the mechanism rather than its magnitude in human disease.
          readouts:
          - name: Nerve conduction velocity
            target: Peripheral Nerve Conduction Failure and Axonal Degeneration
            direction: DECREASED
            interpretation: Functional consequence of nodal disassembly.
      selected_evidence:
        snippet: Here, we report that, in contrast to mice that lack either gliomedin or NrCAM, absence
          of both molecules (and hence the glial clustering signal) resulted in a gradual loss of Na(+)
          channels and other axonal components from the nodes, the formation of binary nodes, and dysregulation
          of nodal gap length.
        supports: SUPPORT
    origin:
