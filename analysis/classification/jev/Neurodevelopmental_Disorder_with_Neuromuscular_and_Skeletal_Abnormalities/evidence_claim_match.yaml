          type II spiral ganglion fasciculation errors and reduced efferent innervation. This is the proposed
          basis for the abnormal VEPs, optic atrophy, strabismus and auditory findings in affected individuals.
          A translational caveat applies: the cochlear defects in mice are transient and adult Nrcam-null
          mice hear normally, whereas some affected individuals have persistent hearing impairment.'
