            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            notes: 'NRCAM (7q31.1) encodes neuronal cell adhesion molecule, an L1-family Ig-superfamily
              transmembrane adhesion protein of the canonical 1,304-residue isoform with six Ig-like domains,
              five fibronectin type III repeats, a transmembrane segment and a short cytoplasmic tail.
              Reported disease alleles include nonsense (p.Glu111*, p.Arg929*, p.Gln25*), frameshift (p.Thr766Ilefs*4),
              canonical (c.2647-2A>G) and deep-intronic (c.230+824G>C) splice variants, and missense substitutions
              in Ig-like domains 1, 2 and 5 (p.Asp55Gly [see the provenance caveat below], p.Ser134Pro,
              p.Gly197Asp, p.Asn469Ser) and in the third Fn-III domain (p.Arg853Cys, p.Lys902Thr, p.Gly913Asp).
              Alleles cluster in the third Fn-III domain, whose KGE and RNRR motifs and predicted docking
              surface implicate it as a protein-protein interaction interface. Loss-of-function alleles
              trend toward greater severity, but the second reported family shows that a nonsense allele
              can produce a mild, neuropathy-only phenotype, so variant class alone is not predictive.
              Population constraint is consistent with the recessive mechanism: gnomAD reports pLI approximately
              0 (2.6e-11) with LOEUF 0.64 and observed/expected loss-of-function 0.53 (83 observed vs
              156.5 expected, LoF Z = 4.99), i.e. NRCAM is under selection against loss-of-function alleles
              but is not haploinsufficient - which is what unaffected heterozygous parents require. These
              figures were read directly from the gnomAD GraphQL API on 2026-08-18 (GRCh38) rather than
              from a publication, so they carry no evidence item. Note also that cDNA coordinates are
              deliberately not asserted for the missense alleles below: the paper''s narrative names the
              protein changes, but the per-individual cDNA mapping lives in its Table 2, which is not
              in the extractable text of the cached reference. Each variant is therefore keyed on the
              protein designation that is quotable, with cDNA given only for the three alleles whose narrative
              or abstract states it. One allele is an acknowledged exception to that rule: for p.Asp55Gly
              the narrative names only the residue Asp55, in the solvent-exposure list, and not the Gly
              substitution, the Ig-like domain 1 assignment, or the compound heterozygosity with c.230+824G>C.
              Those three details come from Table 2 as transcribed in the claude_code deep-research report,
              and are retained because they are internally consistent and independently checkable (c.164
              falls in codon 55; GAC to GGC is Asp to Gly; individual 3 is the genome-sequenced individual
              carrying the deep-intronic allele) - but they are DR-sourced, not narrative-sourced, and
              the attached evidence item is scoped to solvent exposure only. The other twelve alleles
              are keyed on designations the narrative or abstract states directly. ACMG/AMP clinical significance
              is likewise not asserted per allele, because the original reports'' per-variant classifications
              are table content rather than narrative.'
