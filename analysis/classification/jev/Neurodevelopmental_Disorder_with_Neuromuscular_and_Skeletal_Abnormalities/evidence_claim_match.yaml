      assertion:
        name: NRCAM
        gene_term:
          preferred_term: NRCAM
          term:
            id: hgnc:7994
            label: NRCAM
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'NRCAM (7q31.1) encodes neuronal cell adhesion molecule, an L1-family Ig-superfamily transmembrane
          adhesion protein of the canonical 1,304-residue isoform with six Ig-like domains, five fibronectin
          type III repeats, a transmembrane segment and a short cytoplasmic tail. Reported disease alleles
          include nonsense (p.Glu111*, p.Arg929*, p.Gln25*), frameshift (p.Thr766Ilefs*4), canonical (c.2647-2A>G)
          and deep-intronic (c.230+824G>C) splice variants, and missense substitutions in Ig-like domains
          1, 2 and 5 (p.Asp55Gly [see the provenance caveat below], p.Ser134Pro, p.Gly197Asp, p.Asn469Ser)
          and in the third Fn-III domain (p.Arg853Cys, p.Lys902Thr, p.Gly913Asp). Alleles cluster in the
          third Fn-III domain, whose KGE and RNRR motifs and predicted docking surface implicate it as
          a protein-protein interaction interface. Loss-of-function alleles trend toward greater severity,
          but the second reported family shows that a nonsense allele can produce a mild, neuropathy-only
          phenotype, so variant class alone is not predictive. Population constraint is consistent with
          the recessive mechanism: gnomAD reports pLI approximately 0 (2.6e-11) with LOEUF 0.64 and observed/expected
          loss-of-function 0.53 (83 observed vs 156.5 expected, LoF Z = 4.99), i.e. NRCAM is under selection
          against loss-of-function alleles but is not haploinsufficient - which is what unaffected heterozygous
          parents require. These figures were read directly from the gnomAD GraphQL API on 2026-08-18
          (GRCh38) rather than from a publication, so they carry no evidence item. Note also that cDNA
          coordinates are deliberately not asserted for the missense alleles below: the paper''s narrative
          names the protein changes, but the per-individual cDNA mapping lives in its Table 2, which is
          not in the extractable text of the cached reference. Each variant is therefore keyed on the
          protein designation that is quotable, with cDNA given only for the three alleles whose narrative
          or abstract states it. One allele is an acknowledged exception to that rule: for p.Asp55Gly
          the narrative names only the residue Asp55, in the solvent-exposure list, and not the Gly substitution,
          the Ig-like domain 1 assignment, or the compound heterozygosity with c.230+824G>C. Those three
          details come from Table 2 as transcribed in the claude_code deep-research report, and are retained
          because they are internally consistent and independently checkable (c.164 falls in codon 55;
          GAC to GGC is Asp to Gly; individual 3 is the genome-sequenced individual carrying the deep-intronic
          allele) - but they are DR-sourced, not narrative-sourced, and the attached evidence item is
          scoped to solvent exposure only. The other twelve alleles are keyed on designations the narrative
          or abstract states directly. ACMG/AMP clinical significance is likewise not asserted per allele,
          because the original reports'' per-variant classifications are table content rather than narrative.'
        variants:
        - name: p.Asp55Gly
          description: 'Missense substitution in the first Ig-like domain, found in compound heterozygosity
            with the deep-intronic c.230+824G>C allele. The residue is solvent-exposed. See the genetic
            notes: the substitution, domain assignment and pairing are transcribed from Table 2 via the
            deep-research report rather than from the paper''s narrative, which names only the residue
            Asp55.'
          gene:
            preferred_term: NRCAM
            term:
              id: hgnc:7994
              label: NRCAM
          type: missense
        - name: p.Ser134Pro
          description: Missense substitution in Ig-like domain 1. The residue is solvent-exposed and the
            substitution changes polarity and/or charge, so it is predicted to perturb the electrostatic
            surface and protein-protein interaction interfaces.
          gene:
            preferred_term: NRCAM
            term:
              id: hgnc:7994
              label: NRCAM
          type: missense
        - name: p.Gly197Asp
          description: Missense substitution in Ig-like domain 2. The residue is solvent-exposed and the
            substitution changes polarity and/or charge, so it is predicted to perturb the electrostatic
            surface and protein-protein interaction interfaces.
          gene:
            preferred_term: NRCAM
            term:
              id: hgnc:7994
              label: NRCAM
          type: missense
        - name: p.Asn469Ser
          description: 'Missense substitution in Ig-like domain 5. The residue is solvent-exposed, and
            the paper groups it with the other six under an aggregate electrostatic prediction - but that
            sentence hedges ("most of the amino acid substitutions change the polarity and/or charge"),
            and this substitution is the likeliest member of the excluded minority: asparagine and serine
            are both polar and both uncharged, so the change is one of side-chain size and hydrogen-bonding
            geometry (carboxamide to hydroxyl) rather than of polarity or charge. The predicted effect
            on this allele is therefore weaker than for its six counterparts.'
          gene:
            preferred_term: NRCAM
            term:
              id: hgnc:7994
              label: NRCAM
          type: missense
        - name: p.Arg853Cys
          description: Missense substitution in the third Fn-III domain. The residue is solvent-exposed
            and the substitution changes polarity and/or charge, so it is predicted to perturb the electrostatic
            surface and protein-protein interaction interfaces.
          gene:
            preferred_term: NRCAM
            term:
              id: hgnc:7994
              label: NRCAM
          type: missense
        - name: p.Lys902Thr
          description: Missense substitution in the third Fn-III domain. It sits close to the domain's
            KGE integrin-recognition and RNRR furin motifs, so it may specifically impair the protein-protein
            interactions of this domain. The residue is solvent-exposed and the substitution changes polarity
            and/or charge, so it is predicted to perturb the electrostatic surface and protein-protein
            interaction interfaces.
          gene:
            preferred_term: NRCAM
            term:
              id: hgnc:7994
              label: NRCAM
          type: missense
        - name: p.Gly913Asp
          description: Missense substitution in the third Fn-III domain. The residue is solvent-exposed
            and the substitution changes polarity and/or charge, so it is predicted to perturb the electrostatic
            surface and protein-protein interaction interfaces.
          gene:
            preferred_term: NRCAM
            term:
              id: hgnc:7994
              label: NRCAM
          type: missense
        - name: p.Glu111*
          description: Truncating (nonsense) allele producing a premature stop codon and a truncated,
            non-functional protein.
          gene:
            preferred_term: NRCAM
            term:
              id: hgnc:7994
              label: NRCAM
          type: nonsense
        - name: p.Arg929*
          description: Truncating (nonsense) allele producing a premature stop codon and a truncated,
            non-functional protein.
          gene:
            preferred_term: NRCAM
            term:
              id: hgnc:7994
              label: NRCAM
          type: nonsense
        - name: p.Thr766Ilefs*4
          description: Truncating (frameshift) allele producing a premature stop codon and a truncated,
            non-functional protein.
          gene:
            preferred_term: NRCAM
            term:
              id: hgnc:7994
              label: NRCAM
          type: frameshift
        - name: c.2647-2A>G (p.Ile883Serfs*8)
          description: Canonical splice-acceptor variant predicted to cause skipping of exon 22, producing
            a frameshift and a truncated protein.
          gene:
            preferred_term: NRCAM
            term:
              id: hgnc:7994
              label: NRCAM
          type: splice acceptor
        - name: c.230+824G>C
          description: Deep-intronic variant, invisible to exome sequencing and identified only by genome
            sequencing, predicted to disrupt a binding site for the splicing regulator SC35 and to activate
            a cryptic acceptor site generating a cryptic exon.
          gene:
            preferred_term: NRCAM
            term:
              id: hgnc:7994
              label: NRCAM
          type: deep intronic splice
        - name: c.73C>T (p.Gln25*)
          description: Homozygous nonsense allele in the N-terminal signal peptide, before the first Ig-like
            domain, reported in the second family. Notable because this loss-of-function allele produced
            the mildest phenotype described - isolated motor-predominant axonal polyneuropathy with normal
            cognition - which is what breaks the simple loss-of-function-equals-severe correlation.
          gene:
            preferred_term: NRCAM
            term:
              id: hgnc:7994
              label: NRCAM
          type: nonsense
      selected_evidence:
        snippet: Computational analyses of NRCAM variants, many of which cluster in the third fibronectin
          type III (Fn-III) domain, strongly suggest a deleterious effect on NRCAM structure and function,
          including possible disruption of its interactions with other proteins.
        supports: SUPPORT
