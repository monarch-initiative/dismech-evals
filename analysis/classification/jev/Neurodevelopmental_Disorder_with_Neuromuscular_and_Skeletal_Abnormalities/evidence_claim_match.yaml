        name: Impaired NrCAM-Mediated Neural Cell Adhesion
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: NrCAM is a type-I transmembrane L1-family Ig-CAM whose extracellular region comprises
          six immunoglobulin-like domains followed by five fibronectin type III repeats; the Ig domains
          mediate ligand recognition and homophilic and heterophilic trans-binding (contactin-1/TAG-1,
          neurofascin), while the Fn-III repeats mediate adhesion signaling, and the cytoplasmic tail
          binds ankyrin. Loss of NrCAM therefore removes an adhesion and signaling hub that is shared
          by the neuron-neuron, neuron-glia and axon-glia interfaces. Most disease variants fall in the
          third Fn-III domain, which carries a KGE integrin-recognition motif and an RNRR furin site and
          is predicted to form a protein-protein interaction surface.
        biological_processes:
        - preferred_term: cell adhesion
          modifier: DECREASED
          term:
            id: GO:0007155
            label: cell adhesion
        - preferred_term: neuron cell-cell adhesion
          modifier: DECREASED
          term:
            id: GO:0007158
            label: neuron cell-cell adhesion
        cellular_components:
