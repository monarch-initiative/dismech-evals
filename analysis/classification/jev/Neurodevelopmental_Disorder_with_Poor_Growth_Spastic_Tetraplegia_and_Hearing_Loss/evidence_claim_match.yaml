              26S function that the human allele is proposed to cause partially. The rescue arm then reads
              out how much function the patient allele retains.
            limitations: The perturbation is RNAi knockdown of the orthologue, not the missense allele
              in its native locus, and the readout tissue is the compound eye rather than neurons. Ommatidial
              fusion and depigmentation have no human counterpart, so the assay reports residual protein
              function and not the disease phenotype. Rescue was scored morphologically; no proteasome
              activity or ubiquitin-conjugate measurement was made in the rescued flies.
          role: ancestor
