        context: []
      assertion_type: Genetic
      assertion:
        name: PSMC1
        gene_term:
          preferred_term: PSMC1
          term:
            id: hgnc:9547
            label: PSMC1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: PSMC1 (14q32.11) encodes Rpt2, one of the six paralogous AAA+ ATPases forming the base
          of the 19S regulatory particle. A single pathogenic allele has been reported, the homozygous
          missense c.983T>C p.(Ile328Thr). The gene is highly intolerant of variation (pLI 1, missense
          Z 3.95) and no homozygous loss-of-function allele is recorded in gnomAD, consistent with a hypomorphic
          rather than a null mechanism in this disease.
        variants:
        - name: PSMC1 c.983T>C p.(Ile328Thr)
