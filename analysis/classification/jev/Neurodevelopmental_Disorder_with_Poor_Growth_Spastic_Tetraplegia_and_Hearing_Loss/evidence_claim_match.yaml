              loss
            term:
              id: MONDO:0859296
              label: neurodevelopmental disorder with poor growth, spastic tetraplegia, and hearing loss
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: single_kindred_phenotype_boundary
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which features of this syndrome are intrinsic to PSMC1 deficiency, and which belong to
          the single consanguineous kindred in which it was described?
        attaches_to:
        - pathophysiology#Neuronal Proteostasis Failure
        rationale: The entity rests on three affected siblings of one Bedouin Israeli family. Every available
          proportion is a 3/3 or 2/3 count from that sibship, so no feature can be separated from the
          shared genetic background or from consanguinity-associated homozygosity elsewhere in the genome.
          This is why no frequency band is asserted on any phenotype in this entry. The source itself
          flags two findings in one patient - a duplicated renal collecting system and a muscular ventricular
          septal defect - as possibly unrelated to the PSMC1 variant, and those are deliberately not curated
          as phenotypes here.
        proposed_experiments:
        - experiment_id: exp_psmc1_matchmaking_additional_families
          name: Identify additional PSMC1 families
          description: Identify further families with biallelic PSMC1 variants through international matchmaking
            (GeneMatcher, DECIPHER, Matchmaker Exchange) and determine which features recur outside this
            kindred - in particular the hypogonadism, the macrocytic anemia and the neonatal cholestasis.
        - experiment_id: exp_psmc1_allelic_series
          name: Test other PSMC1 alleles
          description: Determine whether other PSMC1 alleles, particularly compound heterozygous combinations
            with a truncating allele, produce the same phenotype or a distinct severity.
      selected_evidence:
        snippet: Three of the 10 offspring of healthy consanguineous parents of Bedouin Israeli ancestry
        supports: SUPPORT
