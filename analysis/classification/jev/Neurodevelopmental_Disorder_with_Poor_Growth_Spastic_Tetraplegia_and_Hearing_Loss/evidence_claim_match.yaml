        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hypogonadism_unique_to_psmc1
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does a 19S base ATPase lesion produce hypogonadotropic hypogonadism when no other
          proteasomopathy does?
        attaches_to:
        - phenotypes#Micropenis
        - phenotypes#Cryptorchidism
        rationale: Micropenis with undescended testes, low testosterone and low gonadotropins was present
          in all three patients, with normal pituitary structure, normal remaining anterior pituitary
          axes, and normal karyotype and SRY. The source states that this is unique within the proteasomopathies.
          It is therefore either a genuinely PSMC1-specific consequence, or a feature of this kindred's
          background - and with one family there is no way to tell. Both Micropenis and Cryptorchidism
          are left unwired in the pathograph for this reason.
        proposed_experiments:
        - experiment_id: exp_psmc1_hpg_axis_characterisation
          name: Characterise the hypothalamic-pituitary-gonadal axis
          description: Dynamic testing of the hypothalamic-pituitary-gonadal axis (GnRH stimulation, hCG
            stimulation, inhibin B, AMH) in any further patients identified, to establish whether the
            defect is central or gonadal.
      selected_evidence:
        snippet: The ambiguous genitalia with micropenis, undescended testes and low testosterone levels
          seen with the PSMC1 variant is unique and has not been reported in any of the diseases due to
          mutations in components of the proteasome.
        supports: SUPPORT
