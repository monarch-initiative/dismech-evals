    evidence_metadata:
      reference: PMID:42370079
      reference_title: Molecular mechanisms in rare proteasomopathies.
      evidence_source: OTHER
      explanation: Establishes that proteasomopathies as a class act through failure of ubiquitin-mediated
        protein homeostasis. The statement is class-level rather than PSMC1-specific.
