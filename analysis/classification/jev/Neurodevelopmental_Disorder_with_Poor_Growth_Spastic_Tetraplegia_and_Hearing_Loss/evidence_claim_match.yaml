              core intact, and is sufficient on its own to cause inclusion pathology and neurodegeneration
              - which is the claim this node makes about neuronal dependence on 26S function.
            limitations: 'Genotype mismatch in both direction and timing: a complete conditional null
              in defined postnatal neuronal populations, against a germline hypomorphic missense present
              in every cell from conception. The output is adult-onset neurodegeneration with Lewy-like
              inclusions - a Parkinson-disease phenotype - whereas the human disease is a static, congenital
              neurodevelopmental one with no reported neurodegeneration or parkinsonism. Nothing in the
              model addresses hearing, growth, genital development or the liver findings. It supports
              the neuronal-dependence step only.'
          role: ancestor
