        context:
        - path: /animal_models/1
          value:
            name: Psmc1 neuron-restricted conditional knockout mouse
            species: Mouse
            genotype: Psmc1 (Rpt2/S4) conditional knockout, Cre/loxP inactivation restricted to substantia
              nigra or forebrain neurons
            category: Conditional loss-of-function model
            publication: PMID:18701681
            description: A neuron-restricted conditional null generated to model Parkinson disease, not
              this syndrome. It is curated here because it is the only in vivo demonstration that neurons
              specifically require the 26S proteasome, and because the germline null is embryonic lethal,
              so it is the only mammalian route to the question.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Neuronal Proteostasis Failure
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        description: Removing Psmc1 from neurons depletes the 26S proteasome while leaving the 20S core
          intact, and is sufficient on its own to cause inclusion pathology and neurodegeneration - which
          is the claim this node makes about neuronal dependence on 26S function.
        limitations: 'Genotype mismatch in both direction and timing: a complete conditional null in defined
          postnatal neuronal populations, against a germline hypomorphic missense present in every cell
          from conception. The output is adult-onset neurodegeneration with Lewy-like inclusions - a Parkinson-disease
          phenotype - whereas the human disease is a static, congenital neurodevelopmental one with no
          reported neurodegeneration or parkinsonism. Nothing in the model addresses hearing, growth,
          genital development or the liver findings. It supports the neuronal-dependence step only.'
        readouts:
        - name: 26S proteasome content in targeted neurons
          target: Neuronal Proteostasis Failure
          direction: DECREASED
          interpretation: Confirms the intended lesion is specific to the 26S holoenzyme rather than to
            proteasome content generally.
        - name: Intraneuronal inclusion pathology and neurodegeneration
          target: Neuronal Proteostasis Failure
          direction: INCREASED
          interpretation: The consequence of losing neuronal 26S function in vivo. Note this is degenerative
            pathology, not a developmental phenotype.
      selected_evidence:
        snippet: The model demonstrates that 26S proteasomes are necessary for normal neuronal homeostasis
          and that 20S proteasome activity is insufficient for neuronal survival.
        supports: SUPPORT
