          value: {}
          role: ancestor
      assertion_type: MechanisticNosologyAssignment
      assertion:
        classification_value: proteotoxic disease
        notes: 'Assigned on the degradation side of proteostasis: the lesion is in the proteasome''s own
          unfolding motor, not in an aggregation-prone client protein. No aggregation, stress-response
          or interferon-signature data exist for PSMC1-mutant human cells, so the classification rests
          on the class-level characterisation of proteasomopathies plus the ubiquitinated-protein accumulation
          seen on Rpt2 knockdown in flies.'
      selected_evidence:
        snippet: The concomitant proteasome impairment leads to imbalanced protein homeostasis by dysfunctional
          ubiquitin-mediated protein degradation.
        supports: SUPPORT
    origin:
      assertion_path: /classifications/mechanistic_category/0
      evidence_path: /classifications/mechanistic_category/0/evidence/0
