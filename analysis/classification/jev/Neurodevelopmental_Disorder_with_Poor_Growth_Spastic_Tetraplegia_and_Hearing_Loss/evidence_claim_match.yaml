    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with Poor Growth, Spastic Tetraplegia, and Hearing Loss
          disease_term:
            preferred_term: neurodevelopmental disorder with poor growth, spastic tetraplegia, and hearing
              loss
            term:
              id: MONDO:0859296
              label: neurodevelopmental disorder with poor growth, spastic tetraplegia, and hearing loss
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fly_and_mouse_models_do_not_match_the_human_genotype
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the available models speak to this disease, when neither carries the human genotype
          and neither produces a neurodevelopmental phenotype?
        attaches_to:
        - pathophysiology#Reduced 26S Proteasome Proteolytic Capacity
        - pathophysiology#Neuronal Proteostasis Failure
        rationale: Two model systems support this entry and each is mismatched in a different way. The
          Drosophila assay is a knockdown of the orthologue read out in the compound eye; it establishes
          that p.I328T is hypomorphic, but says nothing about neurodevelopment. The mouse is a conditional
          null in defined postnatal neuronal populations that produces adult neurodegeneration with Lewy-like
          inclusions - a Parkinson-disease phenotype - whereas the human disease is congenital, static
          and not reported to be degenerative. Between them they support the molecular chain and the neuronal-dependence
          step; neither supports the developmental step, and the germline mouse null is embryonic lethal,
          so the disease genotype cannot simply be made in mouse by deletion.
        proposed_experiments:
        - experiment_id: exp_psmc1_knockin_mouse_i328t
          name: Generate a genotype-matched Psmc1 knock-in
          description: Generate a mouse carrying the orthologous I328T substitution in the endogenous
            locus and ask whether homozygotes are viable and, if so, whether they show developmental rather
            than degenerative brain phenotypes, plus hearing and gonadal phenotypes.
        - experiment_id: exp_psmc1_patient_ipsc_proteasome_assays
          name: Measure proteasome function in patient-derived cells
          description: Measure 26S assembly, ATPase activity, ubiquitin-conjugate load and chymotrypsin-like
            activity in patient fibroblasts or iPSC-derived neurons carrying p.I328T, alongside isogenic
            controls. No such measurement in human PSMC1-mutant material has been reported.
      selected_evidence:
        snippet: Knock‐out of the PSMC1 ortholog in mice was shown to be embryonic lethal.
        supports: SUPPORT
