      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other neurodevelopmental proteasomopathies
        description: 'The disorders caused by variants in PSMB1 (20S core beta6), PSMC3 (19S base Rpt5)
          and PSMD12 (19S lid Rpn5), plus the PSMD11 phenotype. They share developmental delay, intellectual
          disability, dysmorphism and hearing loss, which the founding report reads as a common molecular
          mechanism rather than coincidence. They are separated by gene, and clinically by which extra
          features are present: cataracts and subcutaneous deposits with PSMC3, congenital and ophthalmologic
          malformations with PSMD12, microcephaly with PSMB1. Hypogonadism separates PSMC1 from all of
          them. This is distinct from the proteasome-associated autoinflammatory syndromes (PRAAS/CANDLE),
          which arise from immunoproteasome and core-particle genes and present with fever, panniculitis
          and lipodystrophy rather than a neurodevelopmental phenotype.'
        distinguishing_features:
        - Causal gene and proteasome subcomplex (20S core, 19S base, 19S lid)
        - Micropenis with hypogonadotropic hypogonadism is reported only with PSMC1
        - Autoinflammatory proteasomopathies present with fever, panniculitis and lipodystrophy, not neurodevelopmental
          disability
      selected_evidence:
        snippet: The ambiguous genitalia with micropenis, undescended testes and low testosterone levels
          seen with the PSMC1 variant is unique and has not been reported in any of the diseases due to
          mutations in components of the proteasome.
        supports: SUPPORT
