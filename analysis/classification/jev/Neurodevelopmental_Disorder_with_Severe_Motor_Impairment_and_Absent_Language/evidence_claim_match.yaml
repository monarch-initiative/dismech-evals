              label: neurodevelopmental disorder with severe motor impairment and absent language
        context: []
      assertion_type: Genetic
      assertion:
        name: DHX30
        gene_term:
          preferred_term: DHX30
          term:
            id: hgnc:16716
            label: DHX30
        presence: PRESENT
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        association: DHX30 (DExH-box helicase 30) at 3p21.31 is the single causal gene. Two allelic classes
          with different functional consequences produce two clinically distinct subtypes. Heterozygous
          missense variants inside the conserved helicase core motifs cause the severe classic phenotype;
          recurrent alleles include p.(Arg493His), p.(His562Arg), p.(Arg782Trp), p.(Arg785Cys) and p.(Arg785His).
          These impair ATPase and RNA-unwinding activity and additionally confer a detrimental gain of
          function in stress-granule assembly. The severe phenotype therefore requires the mutant protein
          to be present rather than merely the wild-type dosage to be halved - a mosaic carrier and four
          haploinsufficient individuals were all mild. No functional_impact_category is recorded here
          because that slot belongs to a per-variant GeneticContext and this entry does not curate variant-level
          allele/zygosity detail; the two allelic classes are instead modelled as separate pathophysiology
          nodes and has_subtypes entries. Causality rests on de novo recurrence across unrelated families,
          absence from gnomAD v2.1.1, extreme constraint (pLI 1, LOEUF 0.04), biochemical assays of ATPase
          and helicase activity, stress-granule and puromycin-incorporation assays in cultured cells,
          and developmental defects in zebrafish embryos expressing the human variants.
      selected_evidence:
        snippet: DHX30 loss-of-function variants cause a milder phenotype whereas a severe phenotype is
          caused by HCM missense variants that, in addition to the loss of ATPase and helicase activity,
          lead to a detrimental gain-of-function with respect to SG formation.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
