        description: 'DHX30 is transcribed from two alternative promoters into a cytoplasmic form and
          a more abundant mitochondrially targeted form, and it associates with nuclear-encoded mitoribosome
          transcripts. Depleting both isoforms in colorectal carcinoma cells reduces the translational
          efficiency of mitoribosome mRNAs and lowers mitochondrial energy metabolism. This node is recorded
          as a plausible parallel arm rather than an established disease mechanism: every measurement
          supporting it was made in non-neural cancer cell lines under isoform depletion, which is the
          loss-of-function configuration, whereas the severe human phenotype is driven by a catalytically
          dead protein. No mitochondrial readout has been reported in NEDMIAL patient material.'
