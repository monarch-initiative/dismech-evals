      assertion_type: Definition
      assertion:
        definition_type: DIAGNOSTIC_CRITERIA
        name: Molecular diagnosis of DHX30-related neurodevelopmental disorder
        description: Diagnosis requires identification of a pathogenic or likely pathogenic DHX30 variant,
          in practice by trio exome or genome sequencing. Chromosomal microarray detects only the deletion
          alleles. Because variant class predicts the severity band, classifying the variant as a helicase-core-motif
          missense versus a loss-of-function allele is part of the diagnostic assessment, as is evaluating
          parents for mosaicism when a sibling is affected.
        derivation_basis: ESTABLISHED_CRITERIA
      selected_evidence:
        snippet: 'We performed whole-exome sequencing using genomic deoxyribonucleic acid isolated from
          buccal swabs, which revealed a heterozygous missense variant of DHX30: (c.2344C>T, p.Arg782Trp).'
        supports: SUPPORT
