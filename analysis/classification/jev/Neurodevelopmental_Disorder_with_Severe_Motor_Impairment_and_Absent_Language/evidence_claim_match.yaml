              label: neurodevelopmental disorder with severe motor impairment and absent language
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous DHX30 Helicase Core Motif Missense Variant
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: The severe form of the disorder is initiated by a heterozygous missense substitution
          in one of the eight highly conserved helicase core motifs of DHX30. These motifs sit within
          the two RecA-like domains that jointly form the ATP- and RNA-binding surface of an SF2 helicase,
          so a substitution there is positioned to disrupt ATP binding and hydrolysis, RNA recognition,
          or the coupling between them. Recurrent alleles include p.(Arg493His), p.(His562Arg), p.(Arg782Trp),
          p.(Arg785Cys) and p.(Arg785His). None of the reported alterations occurs in gnomAD v2.1.1, and
          DHX30 is among the most missense-intolerant genes in the human genome.
        genes:
        - preferred_term: DHX30
          term:
            id: hgnc:16716
            label: DHX30
      selected_evidence:
        snippet: All amino acid changes are located within highly conserved helicase motifs and were found
          to either impair ATPase activity or RNA recognition in different in vitro assays.
        supports: SUPPORT
