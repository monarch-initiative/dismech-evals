          HCM missense DHX30 protein nucleates cytoplasmic stress granules far more readily than wild-type
          protein, an acquired property that the authors classify as a detrimental gain of function layered
          on top of the catalytic loss. Wild-type DHX30 is itself an evolutionarily conserved factor in
          stress-granule assembly, and CRISPR DHX30-deficient HEK293T cells and zebrafish show impaired
          granule assembly - so the mutant proteins push a normal DHX30 function past its regulatory setpoint
          rather than doing something DHX30 never does.
