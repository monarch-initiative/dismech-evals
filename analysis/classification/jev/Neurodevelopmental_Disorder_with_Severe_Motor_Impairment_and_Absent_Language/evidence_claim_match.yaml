      assertion_type: Subtype
      assertion:
        name: HCM missense
        display_name: Helicase-core-motif missense subtype (severe)
        description: The classic, severe NEDMIAL phenotype, caused by a heterozygous missense variant
          within one of the highly conserved helicase core motifs. All 19 individuals of this class in
          the 2021 cohort had global developmental delay, intellectual disability, severe speech impairment
          and gait abnormalities; fewer than half achieved independent walking and most were non-verbal.
          The mechanism combines loss of ATPase/helicase activity with a detrimental gain of function
          in stress-granule assembly.
      selected_evidence:
        snippet: All 19 individuals harboring heterozygous missense variants within helicase core motifs
          (HCMs) have global developmental delay, intellectual disability, severe speech impairment, and
          gait abnormalities.
        supports: SUPPORT
