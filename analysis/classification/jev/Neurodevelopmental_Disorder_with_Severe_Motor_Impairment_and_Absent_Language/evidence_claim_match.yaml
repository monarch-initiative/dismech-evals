      assertion_type: Subtype
      assertion:
        name: Loss of function
        display_name: Haploinsufficiency / protein-truncating subtype (mild)
        description: A milder clinical course seen in individuals carrying alleles that reduce DHX30 dosage
          or truncate the protein - frameshift, nonsense, whole-gene deletion, or in-frame multi-exon
          deletion. These individuals walked in the second year of life, had only mild muscular hypotonia,
          and spoke at least 20 words by age three. A de novo mosaic HCM missense carrier fell into the
          same milder band, consistent with the severe phenotype requiring a sufficient burden of the
          mutant protein rather than merely reduced wild-type dosage.
      selected_evidence:
        snippet: Notably, 4 individuals harboring heterozygous variants resulting either in haploinsufficiency
          or truncated proteins presented with a milder clinical course, similar to an individual harboring
          a de novo mosaic HCM missense variant.
        supports: SUPPORT
