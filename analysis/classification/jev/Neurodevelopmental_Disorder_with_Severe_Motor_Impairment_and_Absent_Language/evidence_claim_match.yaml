          so a substitution there is positioned to disrupt ATP binding and hydrolysis, RNA recognition,
          or the coupling between them. Recurrent alleles include p.(Arg493His), p.(His562Arg), p.(Arg782Trp),
          p.(Arg785Cys) and p.(Arg785His). None of the reported alterations occurs in gnomAD v2.1.1, and
          DHX30 is among the most missense-intolerant genes in the human genome.
