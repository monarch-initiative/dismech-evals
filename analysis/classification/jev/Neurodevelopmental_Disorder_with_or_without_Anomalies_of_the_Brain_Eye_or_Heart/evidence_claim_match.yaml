  52adee90bf4076ad79d4da7f4253ee49b0c27560049751eb6a5fad0b326ed416:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with or without Anomalies of the Brain, Eye, or Heart
          disease_term:
