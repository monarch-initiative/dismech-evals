            term:
              id: MONDO:0014857
              label: neurodevelopmental disorder with or without anomalies of the brain, eye, or heart
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deregulated Developmental Morphogen Signaling
        biological_scale: CELLULAR
        description: 'RERE normally restrains sonic hedgehog (shh) and fgf8 signaling during patterning.
          NEDBEH-associated human RERE variants behave as hypomorphs in their ability to repress shh signaling,
          and some show abnormal nuclear localization. In the zebrafish rerea mutant this manifests as
          expanded fgf8 and pax2a expression domains in the optic stalk with reduced vax1, and in a patient-derived
          CRISPR knock-in cell line as downregulated SHH signaling with reciprocal upregulation of the
          Hippo pathway. The direction of the shh change differs between these systems, which is recorded
          as an open question rather than resolved here.

          '
        biological_processes:
        - preferred_term: smoothened signaling pathway
          term:
            id: GO:0007224
            label: smoothened signaling pathway
          modifier: DYSREGULATED
      selected_evidence:
        snippet: The SHH signaling pathway was found to be downregulated, and the Hippo pathway was upregulated
          in ReMut.
        supports: SUPPORT
