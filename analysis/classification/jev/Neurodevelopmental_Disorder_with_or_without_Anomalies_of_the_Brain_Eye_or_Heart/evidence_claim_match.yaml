              id: MONDO:0014857
              label: neurodevelopmental disorder with or without anomalies of the brain, eye, or heart
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Endocardial EMT in the Atrioventricular Cushions
        biological_scale: CELLULAR
        description: 'Atrioventricular septation depends on endocardial cells in the AV canal undergoing
          epithelial-to-mesenchymal transition and migrating into the cardiac jelly to populate the endocardial
          cushions. RERE-deficient mouse embryos have fewer mesenchymal cells in their AV endocardial
          cushions because both EMT and mesenchymal proliferation are reduced. In the endocardium RERE
          colocalizes with GATA4, positively regulates transcription from the Gata4 promoter, and Gata4
          levels fall in the AV canal of RERE-deficient embryos; Rere and Gata4 interact genetically in
          the development of congenital heart defects. Notably, endocardium-specific Rere ablation produces
          hypocellular cushions, defective EMT, and ventricular septal defects WITHOUT reducing GATA4,
          so the cell-autonomous endocardial role of RERE must be mediated by targets other than GATA4
          — the entry keeps both arms rather than collapsing them.

          '
        cell_types:
        - preferred_term: endocardial cell
          term:
            id: CL:0002350
            label: endocardial cell
        biological_processes:
        - preferred_term: epithelial to mesenchymal transition involved in endocardial cushion formation
          term:
            id: GO:0003198
            label: epithelial to mesenchymal transition involved in endocardial cushion formation
          modifier: DECREASED
        - preferred_term: endocardial cushion development
          term:
            id: GO:0003197
            label: endocardial cushion development
          modifier: DECREASED
      selected_evidence:
        snippet: RERE functions in the AV canal to positively regulate the expression of GATA4, and that
          deficiency of RERE leads to the development of VSDs through its effects on EMT and mesenchymal
          cell proliferation
        supports: SUPPORT
