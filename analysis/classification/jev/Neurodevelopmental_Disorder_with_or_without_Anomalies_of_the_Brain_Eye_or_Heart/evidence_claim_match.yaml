        description: 'The convergent consequence: a single lesion in a retinoic-acid co-regulator expressed
          across the developing embryo produces coordinated anomalies of brain, eye, heart, inner ear,
          kidney and genitourinary tract rather than an isolated organ defect. The mouse allelic series
          makes this concrete — one graded reduction in Rere dosage yields microphthalmia, growth deficiency,
          brain hypoplasia, hearing loss, cardiovascular malformations, and renal agenesis together. The
          allelic class determines how much of this field is affected in a given individual: loss-of-function
          alleles produce fewer multisystem anomalies, whereas HRR missense variants and in-frame HRR
          duplications produce more.

          '
      selected_evidence:
        snippet: These findings suggest that RERE plays a critical role in the development and function
          of multiple organs including the eye, brain, inner ear, heart and kidney.
        supports: SUPPORT
