  de1c095e432455e0f3e3059a096f9fdc6d7ae8eafed44b721217bea3c204825c:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with or without Anomalies of the Brain, Eye, or Heart
          disease_term:
            preferred_term: neurodevelopmental disorder with or without anomalies of the brain, eye, or
              heart
            term:
              id: MONDO:0014857
              label: neurodevelopmental disorder with or without anomalies of the brain, eye, or heart
        context: []
      assertion_type: Genetic
      assertion:
        name: RERE
        notes: 'RERE (arginine-glutamic acid dipeptide repeats; also known as atrophin-2) at 1p36.23 encodes
          a nuclear receptor co-regulator and is the sole established cause of NEDBEH. The ClinGen Intellectual
          Disability and Autism Gene Curation Expert Panel classified the gene-disease relationship as
          Definitive in March 2023. Two allelic classes are recognised. Loss-of-function alleles (nonsense,
          frameshift, canonical splice site, and whole- or partial-gene deletions) act by haploinsufficiency,
          produce fewer multisystem anomalies, and are the class in which inheritance from a mildly symptomatic
          or asymptomatic parent occurs. Missense variants and in-frame deletions/duplications in the
          histidine-rich region of the Atrophin-1 domain are structurally stabilizing, almost always arise
          de novo, and carry a heavier multisystem burden. Note that ClinGen''s 2023 curation recorded
          the mechanism as loss of function; the gain-of-function/dominant-negative interpretation of
          the HRR class comes from the later 2026 cohort and its protein modeling, and is not a correction
          ClinGen has adopted.

          '
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: RERE
          term:
            id: hgnc:9965
            label: RERE
        variants:
        - name: Atrophin-1 histidine-rich region missense and in-frame variants
          type: missense and in-frame indel
          clinical_significance: PATHOGENIC
          description: 'Missense variants and in-frame deletions/duplications clustering in the histidine-rich
            region (HRR) of the Atrophin-1 domain. Protein modeling in the 2026 cohort found these to
            be structurally stabilizing, which is why a gain-of-function or dominant-negative mechanism
            is proposed rather than loss of dosage. This class is associated with more multisystem phenotypes
            and usually arises de novo. Which of gain-of-function or dominant-negative applies is not
            resolved; that either/or is kept open in the discussions block rather than being decided here.

            '
        - name: Loss-of-function alleles causing haploinsufficiency
          type: nonsense, frameshift, splice-site, and gene deletion
          clinical_significance: PATHOGENIC
          description: 'Nonsense, frameshift, canonical splice-site, and whole- or partial-gene deletion
            alleles. These reduce RERE dosage — nonsense-mediated decay has been demonstrated for at least
            one frameshift allele — and produce a milder phenotype with fewer multisystem anomalies. This
            is the class in which transmission from a mildly symptomatic or asymptomatic parent occurs,
            so unlike the HRR class it is not exclusively de novo.

            '
        - name: Recurrent HRR duplication c.4313_4318dupTCCACC (CHARGE-like)
          type: in-frame duplication
          clinical_significance: PATHOGENIC
          description: 'A recurrent in-frame six-base-pair (two-amino-acid) duplication within the histidine-rich
            region. This specific allele is associated with a CHARGE-syndrome-like presentation including
            choanal atresia and coloboma, and is the basis for the recommendation to test RERE in CHD7-negative
            individuals meeting CHARGE criteria.

            '
      selected_evidence:
        snippet: The mechanism of pathogenicity is believed to be loss of function.
        supports: SUPPORT
