            preferred_term: neurodevelopmental disorder with or without anomalies of the brain, eye, or
              heart
            term:
              id: MONDO:0014857
              label: neurodevelopmental disorder with or without anomalies of the brain, eye, or heart
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Ocular Morphogenesis and Retinal Cell Loss
        biological_scale: TISSUE
        description: 'Two separable ocular mechanisms operate. First, a patterning defect: the zebrafish
          rerea (babyface) mutant recapitulates the optic fissure closure defect seen in humans, arising
          from expansion of the proximal retinal optic stalk and reduced expression of ventral retinal
          fate genes; inhibiting shh signaling with HPI-1 rescues the coloboma, establishing deregulated
          shh as causal in that model. Second, a cell-survival defect: RERE is expressed in a subset of
          retinal ganglion cells, the lens epithelium, and the ciliary body, and RERE-deficient mice show
          apoptosis of retinal cells in the ganglion cell layer from E17.5, reduced retinal ganglion cell
          numbers, and consequent retinal and optic nerve atrophy. Together these account for the coloboma,
          microphthalmia, and optic nerve findings of NEDBEH.

          '
        cell_types:
        - preferred_term: retinal ganglion cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
        biological_processes:
        - preferred_term: closure of optic fissure
          term:
            id: GO:0061386
            label: closure of optic fissure
          modifier: DECREASED
      selected_evidence:
        snippet: We show that the zebrafish rerea mutant (babyface) robustly recapitulates optic fissure
          closure defects resulting from loss of RERE function, as observed in humans.
        supports: SUPPORT
    origin:
