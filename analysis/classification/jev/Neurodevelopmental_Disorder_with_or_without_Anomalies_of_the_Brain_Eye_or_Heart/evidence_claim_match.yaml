  c95cd9c4f17a5279fc4d83f0eb874bebe631151b3a5ca00d9b4b0b4fbd984008:
    claim:
      about:
        disease:
          name: Neurodevelopmental Disorder with or without Anomalies of the Brain, Eye, or Heart
          disease_term:
            preferred_term: neurodevelopmental disorder with or without anomalies of the brain, eye, or
              heart
            term:
              id: MONDO:0014857
              label: neurodevelopmental disorder with or without anomalies of the brain, eye, or heart
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RERE Nuclear Receptor Co-regulator Dysfunction
        biological_scale: MOLECULAR
        description: 'The initiating lesion is a heterozygous pathogenic variant in RERE at 1p36.23. RERE
          encodes a large, widely expressed atrophin-family nuclear receptor co-regulator (atrophin-2)
          that scaffolds transcriptional complexes through its ELM2, SANT, and Atrophin-1 domains. Two
          mechanistically distinct allelic classes converge on this node. Nonsense, frameshift, canonical
          splice-site, and whole- or partial-gene deletion alleles reduce RERE dosage by haploinsufficiency,
          with nonsense-mediated decay demonstrated for at least one frameshift allele. Missense and in-frame
          variants clustering in a histidine-rich region (HRR) of the Atrophin-1 domain are instead structurally
          stabilizing, which is why they are proposed to act by a gain-of-function or dominant-negative
          mechanism rather than by simple loss of dosage — and why they carry a heavier multisystem burden.

          '
        molecular_functions:
        - preferred_term: transcription coactivator activity
          term:
            id: GO:0003713
            label: transcription coactivator activity
          modifier: DECREASED
        - preferred_term: transcription corepressor activity
          term:
            id: GO:0003714
            label: transcription corepressor activity
          modifier: DECREASED
      selected_evidence:
        snippet: HRR missense variants were structurally stabilizing, suggesting a gain-of-function or
          dominant-negative mechanism.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
