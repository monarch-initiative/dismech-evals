      assertion_type: Pathophysiology
      assertion:
        name: Tumor Microenvironment Remodeling
        description: 'Long after Nf1 loss, neurofibromas recruit and reprogram a complex microenvironment:
          in human plexiform neurofibromas immune and stromal cells comprise roughly 90% of the tumor,
          with monocyte recruitment, aberrant macrophage differentiation, fibroblast-driven collagen deposition,
          and deregulated cell-cell communication (e.g., MIF-CD74/NF-kB). This microenvironment supports
          tumor growth and immunosuppression and contributes to mass effect, pain, and disfigurement.'
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: mast cell
          term:
            id: CL:0000097
            label: mast cell
      selected_evidence:
        snippet: showed dramatic expansion of immune and stromal cell populations; in corresponding human
          PNs, the immune and stromal cells comprised 90% of cells
        supports: SUPPORT
