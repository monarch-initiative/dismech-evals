      assertion_type: Pathophysiology
      assertion:
        name: RAS Pathway Hyperactivation
        description: Neurofibromin is a RAS-GTPase-activating protein (RAS-GAP) that normally converts
          active RAS-GTP to inactive RAS-GDP. Its loss leaves RAS in the active GTP-bound state, producing
          constitutive RAS signal transduction that feeds the downstream RAF-MEK-ERK (MAPK) and PI3K-AKT-mTOR
          effector cascades.
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        biological_processes:
        - preferred_term: Ras protein signal transduction
          modifier: INCREASED
          term:
            id: GO:0007265
            label: Ras protein signal transduction
      selected_evidence:
        snippet: The NF1 gene encodes neurofibromin, a large protein with RAS GTP-ase activating (RAS-GAP)
          activity, and loss of NF1 results in increased RAS signaling.
        supports: SUPPORT
    origin:
