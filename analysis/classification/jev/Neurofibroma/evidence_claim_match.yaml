      assertion_type: Pathophysiology
      assertion:
        name: Biallelic NF1 Inactivation in Schwann Cell Lineage
        description: Neurofibroma initiation requires loss of both NF1 alleles in a Schwann cell lineage
          progenitor. In NF1 patients, one germline loss-of-function NF1 variant is inherited and a somatic
          second hit (loss of heterozygosity) inactivates the remaining wild-type allele, following the
          classic Knudson two-hit model. Sporadic solitary neurofibromas arise from two somatic NF1 hits
          in the absence of a germline variant.
        cell_types:
        - preferred_term: Schwann cell precursor
          term:
            id: CL:0002573
            label: Schwann cell
        genes:
        - preferred_term: NF1
          term:
            id: hgnc:7765
            label: NF1
        gene_products:
        - preferred_term: neurofibromin
          term:
            id: NCIT:C17412
            label: Neurofibromin
        locations:
        - preferred_term: peripheral nervous system
          term:
            id: UBERON:0000010
            label: peripheral nervous system
      selected_evidence:
        snippet: NF1-null SLCs formed bona fide neurofibromas with high levels of SOX10 expression
        supports: SUPPORT
    origin:
