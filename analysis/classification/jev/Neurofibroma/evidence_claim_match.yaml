      assertion_type: Pathophysiology
      assertion:
        name: Malignant Transformation to MPNST
        description: 'Plexiform neurofibromas are precursor lesions for malignant peripheral nerve sheath
          tumor. Transformation follows a stepwise molecular cascade: on the background of biallelic NF1
          loss, inactivation of CDKN2A/B yields an atypical neurofibromatous neoplasm of uncertain biological
          potential (ANNUBP), and subsequent disruption of the polycomb repressive complex 2 (PRC2; SUZ12/EED)
          with loss of H3K27me3 drives progression to high-grade MPNST.'
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        genes:
        - preferred_term: CDKN2A
          term:
            id: hgnc:1787
            label: CDKN2A
        - preferred_term: SUZ12
          term:
            id: hgnc:17101
            label: SUZ12
      selected_evidence:
        snippet: Plexiform neurofibroma (PN) and atypical neurofibromatous neoplasm of unknown biological
          potential (ANNUBP) are novel concepts of MPNST precancerous lesions, which revealed sequential
          mutations in MPNST development.
        supports: SUPPORT
