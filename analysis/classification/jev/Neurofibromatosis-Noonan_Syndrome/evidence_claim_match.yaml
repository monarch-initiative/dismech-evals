        description: Germline heterozygous NF1 loss-of-function variants reduce neurofibromin dosage.
          Neurofibromin is a RAS-GTPase activating protein (RAS-GAP) that accelerates hydrolysis of active
          RAS-GTP to inactive RAS-GDP. Reduced neurofibromin function removes this negative restraint
          on RAS, the shared initiating lesion of NFNS.
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        - preferred_term: melanocyte
          term:
