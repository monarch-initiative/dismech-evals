      assertion:
        name: NF1
        gene_term:
          preferred_term: NF1
          term:
            id: hgnc:7765
            label: NF1
        relationship_type: CAUSATIVE
        association: Germline Loss-of-Function Mutations
        notes: Heterozygous loss-of-function variants in NF1, which encodes the RAS-GTPase activating
          protein neurofibromin, are the major molecular cause of NFNS. A notable enrichment of in-frame
          defects affecting the GAP-related domain (exons 24-25 in older nomenclature) has been reported
          in NFNS cohorts. PTPN11 mutations, the most common cause of classic Noonan syndrome, are typically
          absent, indicating that NFNS and NS are genetically distinct.
      selected_evidence:
        snippet: Heterozygous NF1 defects were identified in 16 of the 17 unrelated subjects included
          in the study, which provides evidence that mutations in NF1 represent the major molecular event
          underlying this condition.
        supports: SUPPORT
