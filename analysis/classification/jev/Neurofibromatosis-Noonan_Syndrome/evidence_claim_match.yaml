        - preferred_term: regulation of Ras protein signal transduction
          modifier: DECREASED
          term:
            id: GO:0046578
            label: regulation of Ras protein signal transduction
        genes:
        - preferred_term: NF1
          term:
            id: hgnc:7765
            label: NF1
      selected_evidence:
        snippet: The NF1 gene encodes a RAS GTPase-activating protein called neurofibromin and is one
          of several genes that (when mutant) affect RAS-MAPK signalling, causing related diseases collectively
          known as RASopathies.
        supports: SUPPORT
