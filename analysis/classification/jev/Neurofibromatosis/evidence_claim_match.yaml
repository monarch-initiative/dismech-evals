      assertion:
        name: Merlin Loss and Hippo Dysregulation
        description: In NF2-related schwannomatosis, biallelic NF2 inactivation eliminates merlin/schwannomin.
          Merlin normally enforces contact-dependent growth inhibition by limiting delivery of growth-factor
          receptors to the Schwann-cell surface and by restraining Hippo/YAP-TAZ-TEAD transcriptional
          output; its loss de-represses mitogenic receptor signalling and YAP/TAZ-driven proliferation.
          The same merlin-loss lesion is the convergent driver of sporadic and schwannomatosis-associated
          schwannomas.
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        genes:
        - preferred_term: NF2
          term:
            id: hgnc:7773
            label: NF2
        biological_processes:
        - preferred_term: contact inhibition
          modifier: DECREASED
          term:
            id: GO:0060242
            label: contact inhibition
      selected_evidence:
        snippet: merlin regulates contact inhibition of proliferation by limiting the delivery of several
          growth factor receptors at the plasma membrane of primary SCs.
        supports: SUPPORT
