        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NF1 Tumor Suppressor Loss
        conforms_to: germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in
          a Susceptible Cell
        description: Germline heterozygous NF1 pathogenic variants reduce neurofibromin dosage across
          tissues. In focal lesions such as neurofibromas, cafe-au-lait macules, optic pathway gliomas,
          and tibial pseudoarthrosis, somatic loss or mutation of the remaining allele can create cell-specific
          biallelic NF1 inactivation. Loss of neurofibromin removes RAS-GAP restraint, allowing hyperactive
          RAS effector signaling and tissue-specific developmental or neoplastic outcomes.
        biological_processes:
        - preferred_term: regulation of Ras protein signal transduction
          modifier: DECREASED
          term:
            id: GO:0046578
            label: regulation of Ras protein signal transduction
        genes:
        - preferred_term: NF1
          term:
            id: hgnc:7765
            label: NF1
      selected_evidence:
        snippet: The NF1 gene encodes a RAS GTPase-activating protein called neurofibromin and is one
          of several genes that (when mutant) affect RAS-MAPK signalling, causing related diseases collectively
          known as RASopathies.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
