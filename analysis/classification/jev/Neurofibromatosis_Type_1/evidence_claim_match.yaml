      assertion_type: Pathophysiology
      assertion:
        name: RAS-MAPK Pathway Hyperactivation
        conforms_to: sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation
        description: Neurofibromin normally accelerates GTP hydrolysis on RAS proteins, promoting the
          inactive GDP-bound state. Loss of neurofibromin results in prolonged RAS-GTP accumulation and
          constitutive activation of the RAS-RAF-MEK-ERK cascade. In NF1, this branch drives Schwann-cell
          tumor initiation, melanocyte pigmentation programs, glial proliferation, skeletal remodeling
          defects, and neurodevelopmental plasticity abnormalities.
        biological_processes:
        - preferred_term: Ras protein signal transduction
          modifier: INCREASED
          term:
            id: GO:0007265
            label: Ras protein signal transduction
        - preferred_term: MAPK cascade
          modifier: INCREASED
          term:
            id: GO:0000165
            label: MAPK cascade
      selected_evidence:
        snippet: The NF1 gene encodes a RAS GTPase-activating protein called neurofibromin and is one
          of several genes that (when mutant) affect RAS-MAPK signalling, causing related diseases collectively
          known as RASopathies.
        supports: SUPPORT
