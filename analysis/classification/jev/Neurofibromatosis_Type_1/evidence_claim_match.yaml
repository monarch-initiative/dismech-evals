        association: Germline Loss-of-Function Mutations
        inheritance:
        - name: Autosomal Dominant
        notes: NF1 (17q11.2) encodes neurofibromin, a large protein with RAS-GAP domain that negatively
          regulates RAS signaling. Germline mutations include truncating variants, missense mutations
          in the GAP domain, splice site variants, and large deletions (5% of cases, associated with more
          severe phenotype). De novo mutation rate is approximately 50%. Penetrance is essentially complete
          but expressivity is highly variable, even within families.
      selected_evidence:
        snippet: NF1 | HGNC:7765 | neurofibromatosis type 1 | MONDO:0018975 | AD | Definitive
        supports: SUPPORT
