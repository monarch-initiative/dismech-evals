          value:
            name: Selective Failure of Neuromuscular and Sensory Tissues
            biological_scale: TISSUE
            role: Tissue-selectivity node, mechanism unresolved
            description: 'A node for the fact that a universal splicing defect produces a selective phenotype.
              Retina, cochlea, skeletal muscle and the developing CNS are consistently affected; most
              other tissues are not. This is not an oddity of this disease alone - it is the central puzzle
              of the spliceosomopathies as a class, where core spliceosome components produce retinitis
              pigmentosa or craniofacial disease rather than global collapse.

              Nothing curated here explains it, and the node exists to hold the gap rather than to assert
              a mechanism. Candidate explanations in the wider field - tissue differences in splicing-factor
              abundance, in transcript intron burden, or in the reserve capacity of the spliceosome -
              are not tested in DHX16 and are not asserted.'
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Autistic behavior
        description: The neurodevelopmental arm beyond delay itself, wired on the same footing as global
          developmental delay because both are developing-CNS phenotypes. Note this rests on longitudinal
          follow-up of a single patient and the source presents it as newly described.
      selected_evidence:
        snippet: Longitudinal clinical follow-up uncovered progressive multisystem involvement, including
          delayed gonadal development and autism spectrum disorder phenotypes not previously linked to
          DHX16.
        supports: SUPPORT
