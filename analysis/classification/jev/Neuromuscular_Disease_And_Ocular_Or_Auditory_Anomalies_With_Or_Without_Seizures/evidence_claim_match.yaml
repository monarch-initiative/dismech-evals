    claim:
      about:
        disease:
          name: Neuromuscular Disease And Ocular Or Auditory Anomalies With Or Without Seizures
          disease_term:
            preferred_term: neuromuscular disease and ocular or auditory anomalies with or without seizures
            term:
              id: MONDO:0032890
              label: neuromuscular disease and ocular or auditory anomalies with or without seizures
        context: []
      assertion_type: Genetic
      assertion:
        name: DHX16
        gene_term:
          preferred_term: DHX16
          term:
            id: hgnc:2739
            label: DHX16
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        association: De novo heterozygous missense variants, clustering in and around the helicase domain
        presence: Positive
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        notes: 'Two things about the variant spectrum are worth a curator''s attention and are easy to
          lose in prose. First, it is missense-only: no truncating allele has been reported in an affected
          individual, across a series now in double figures. For a gene this constrained that is unlikely
          to be chance, and it is the strongest argument that the mechanism is dominant-negative rather
          than haploinsufficiency. Second, codon 454 recurs with two different substitutions in unrelated
          patients - p.Arg454Trp (PMID:37574199, and again in PMID:41052356) and p.Arg454Gly (PMID:42562406).
          Distinct substitutions at one residue in unrelated people is the signature of a specific functional
          site rather than of a tolerant one.

          A caution on variant interpretation here: PMID:40326698 reports in-silico pathogenicity predictors
          positive for its allele while Missense3D shows no structural damage. For a helicase whose disease
          mechanism is probably an interaction defect rather than a folding defect, structural-damage
          prediction may be the wrong instrument, and a negative one should not be read as reassurance.'
      selected_evidence:
        snippet: 'We identified ten total individuals with missense variants in three other DDX/DHX paralogs:
          DHX16 (four individuals), DDX54 (three individuals), and DHX34 (three individuals).'
        supports: SUPPORT
