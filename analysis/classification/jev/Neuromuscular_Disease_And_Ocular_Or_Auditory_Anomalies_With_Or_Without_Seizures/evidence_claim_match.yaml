          does not block spliceosome assembly - the B complex still forms - it blocks the transition to
          catalysis. This is a precise step-level lesion, and it is why the disease is a spliceosomopathy
          of activation rather than of assembly.
        molecular_functions:
        - preferred_term: DHX16 RNA-dependent ATPase and helicase activity
          term:
            id: GO:0003724
            label: RNA helicase activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: precatalytic spliceosome
          term:
