      assertion_type: Pathophysiology
      assertion:
        name: Intron Retention and Nuclear Retention of Unspliced Transcripts
        biological_scale: CELLULAR
        role: Transcriptome-level consequence
        description: Affected transcripts retain introns and accumulate in the nucleus rather than being
          degraded by nonsense-mediated decay - which matters, because it means the cell neither makes
          the protein nor clears the failed message. Only a subset of intron-containing genes is affected
          in the dominant-negative experiments, and in the one assay performed on an actual patient allele
          the affected transcripts were HSPH1 and FOS. Which transcripts are sensitive, and why, is not
          known.
        biological_processes:
        - preferred_term: failure of intron removal
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: DECREASED
      selected_evidence:
        snippet: The unspliced RNAs were retained in the nucleus, and block of nonsense-mediated decay
          did not affect their accumulation.
        supports: SUPPORT
        directness: DIRECT
