  d3d1d04607568a2e11d4571a2965dea941db4b7e466eb8f1414909037f203f17:
    claim:
      about:
        disease:
          name: Neuromuscular Disease And Ocular Or Auditory Anomalies With Or Without Seizures
          disease_term:
            preferred_term: neuromuscular disease and ocular or auditory anomalies with or without seizures
            term:
              id: MONDO:0032890
              label: neuromuscular disease and ocular or auditory anomalies with or without seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Spliceosome Activation
        biological_scale: MOLECULAR
        role: Core molecular lesion
        description: DHX16 is the human Prp2 orthologue and acts after the pre-catalytic B complex has
          assembled, converting it to a catalytically competent spliceosome. A defective DHX16 therefore
          does not block spliceosome assembly - the B complex still forms - it blocks the transition to
          catalysis. This is a precise step-level lesion, and it is why the disease is a spliceosomopathy
          of activation rather than of assembly.
        molecular_functions:
        - preferred_term: DHX16 RNA-dependent ATPase and helicase activity
          term:
            id: GO:0003724
            label: RNA helicase activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: precatalytic spliceosome
          term:
            id: GO:0071011
            label: precatalytic spliceosome
        biological_processes:
        - preferred_term: mRNA splicing, via spliceosome
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: DECREASED
      selected_evidence:
        snippet: In the present study, we show that DHX16 is required for pre-mRNA splicing after the
          formation of a pre-catalytic spliceosome.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20423332
      reference_title: Contribution of DEAH-box protein DHX16 in human pre-mRNA splicing.
      evidence_source: IN_VITRO
      explanation: Places the requirement precisely at the activation step, after assembly.
