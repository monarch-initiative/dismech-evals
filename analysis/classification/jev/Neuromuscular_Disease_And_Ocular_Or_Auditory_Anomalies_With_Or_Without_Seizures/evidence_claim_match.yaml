        - path: /pathophysiology/0
          value:
            name: De Novo DHX16 Missense Variant
            biological_scale: MOLECULAR
            role: Initiating genetic lesion
            description: A heterozygous missense change in DHX16, arising de novo. The reported alleles
              cluster in and around the helicase domain; p.Arg231Pro is the one published variant upstream
              of it, and its describing authors note that little is known about the upstream domains.
              Codon 454 is hit recurrently by two different substitutions in unrelated patients.
            genetic_context:
              gene:
                preferred_term: DHX16
                term:
                  id: hgnc:2739
                  label: DHX16
              variant_origin: DE_NOVO
              allele_type: SNV
              zygosity: HETEROZYGOUS
              functional_impact_category: DOMINANT_NEGATIVE
              description: 'DOMINANT_NEGATIVE rather than LOSS_OF_FUNCTION on three converging grounds:
                every reported disease allele is missense and none is truncating, the cell-biology literature
                shows that mutant DHX16 added to wild-type nuclear extract actively inhibits splicing
                rather than merely failing to support it, and one residue is hit by two different substitutions.
                It is an inference from allele spectrum and from non-patient constructs, not a measurement
                on a patient allele in a patient cell, and is flagged as such in `discussions`.'
            genes:
            - preferred_term: DHX16
              term:
                id: hgnc:2739
                label: DHX16
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Impaired Spliceosome Activation
        description: The mutant helicase is incorporated into spliceosomes and impairs the activation
          step rather than being absent from it.
      selected_evidence:
        snippet: Adding extracts containing DHX16-G724N or DHX16-S552L mutant proteins to HeLa cell nuclear
          extracts resulted in reduced splicing, indicating that the mutant protein directly inhibited
          splicing in vitro.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0/downstream/0
      evidence_path: /pathophysiology/0/downstream/0/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /pathophysiology/0
    evidence_metadata:
      reference: PMID:20423332
      reference_title: Contribution of DEAH-box protein DHX16 in human pre-mRNA splicing.
      evidence_source: IN_VITRO
      explanation: 'The direct-inhibition result: mutant protein added to a competent extract reduces
        splicing, which is what a dominant-negative edge asserts.'
