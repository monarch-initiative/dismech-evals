            label: precatalytic spliceosome
        biological_processes:
        - preferred_term: mRNA splicing, via spliceosome
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: DECREASED
      selected_evidence:
        snippet: Nuclear extracts isolated from the dominant-negative DHX16-G724N-expressing cells formed
          splicing complex B, but were impaired in splicing.
        supports: SUPPORT
        directness: DIRECT
