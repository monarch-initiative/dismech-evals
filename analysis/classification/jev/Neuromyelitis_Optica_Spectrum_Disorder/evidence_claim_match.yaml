            term:
              id: MONDO:0019100
              label: neuromyelitis optica
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aquaporin-4 Autoimmunity
        description: 'Anti-AQP4 (NMO-IgG) antibodies bind to aquaporin-4 water channels predominantly
          expressed on astrocyte end-feet at the blood-brain barrier. This initiates complement-dependent
          cytotoxicity leading to astrocyte death, secondary oligodendrocyte damage, demyelination, and
          neuronal injury.

          '
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: complement activation
          term:
            id: GO:0006956
            label: complement activation
      selected_evidence:
        snippet: In NMOSD, the autoantibody (NMO-IgG) binds to the extracellular loops of AQP4 as expressed
          in perivascular astrocytic end-feet and disrupts astrocytes in a complement-dependent manner.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35454180
      reference_title: 'Aquaporin-4 in Neuromyelitis Optica Spectrum Disorders: A Target of Autoimmunity
        in the Central Nervous System.'
      explanation: This review confirms that NMO-IgG binds AQP4 on astrocyte end-feet and causes complement-dependent
        astrocyte destruction.
