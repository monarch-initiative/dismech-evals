      assertion:
        name: Complement-Mediated Astrocyte Destruction
        description: 'AQP4-IgG binding activates the classical complement cascade, leading to membrane
          attack complex formation and astrocyte lysis. This distinguishes NMOSD from MS where complement
          activation is less prominent.

          '
        biological_processes:
        - preferred_term: complement activation, classical pathway
          term:
            id: GO:0006958
            label: complement activation, classical pathway
      selected_evidence:
        snippet: At least two thirds of cases are associated with aquaporin-4 antibodies (AQP4-IgG) and
          complement-mediated damage to the central nervous system.
        supports: SUPPORT
