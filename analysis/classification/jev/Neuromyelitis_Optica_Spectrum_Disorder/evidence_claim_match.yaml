      assertion:
        name: Longitudinally Extensive Transverse Myelitis
        description: 'Longitudinally extensive transverse myelitis (LETM) affecting three or more vertebral
          segments is characteristic of NMOSD, distinguishing it from the shorter lesions typical of multiple
          sclerosis. Causes paraplegia, sensory loss, and bladder/bowel dysfunction. LETM is a core diagnostic
          criterion for NMOSD.

          '
        frequency: VERY_FREQUENT
        phenotype_term:
          preferred_term: longitudinally extensive transverse myelitis
          term:
            id: HP:0012486
            label: Myelitis
          spatial_extent: EXTENSIVE
        notes: 'HPO lacks a specific term for longitudinally extensive transverse myelitis, so the general
          HP:0012486 (Myelitis) is used together with the spatial_extent=EXTENSIVE qualifier (≥3 contiguous
          vertebral segments). A more specific preferred_term conveys the clinical concept.

          '
      selected_evidence:
        snippet: The core clinical characteristics required for patients with NMOSD with AQP4-IgG include
          clinical syndromes or MRI findings related to optic nerve, spinal cord, area postrema
        supports: SUPPORT
