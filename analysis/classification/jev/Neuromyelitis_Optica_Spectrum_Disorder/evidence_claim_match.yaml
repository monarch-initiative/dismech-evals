      assertion_type: Pathophysiology
      assertion:
        name: Blood-Brain Barrier Disruption
        description: 'Inflammatory infiltrates including neutrophils, eosinophils, and macrophages cross
          the disrupted blood-brain barrier. Granulocyte infiltration is a hallmark feature distinguishing
          NMOSD lesions from MS plaques.

          '
        locations:
        - preferred_term: blood brain barrier
          term:
            id: UBERON:0000120
            label: blood brain barrier
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: eosinophil
          term:
            id: CL:0000771
            label: eosinophil
      selected_evidence:
        snippet: The autoantibodies against AQP4 target the AQP4 channel at the blood–brain barrier (BBB)
          of the astrocyte end feet, which leads to high permeability or leakage of the BBB that causes
          more influx of AQP4-antibodies into the cerebrospinal fluid (CSF) of NMO patients.
        supports: SUPPORT
    origin:
