  0107c85f770f6650053bc72e7e8b52f46094e99d50b8cdd9f732253003ae392f:
    claim:
      about:
        disease:
          name: Neuronal Ceroid Lipofuscinosis
          disease_term:
            preferred_term: neuronal ceroid lipofuscinosis
            term:
              id: MONDO:0016295
              label: neuronal ceroid lipofuscinosis
        context: []
      assertion_type: Genetic
      assertion:
        name: CLN Genes
        association: Pathogenic Mutations
        presence: Positive
        notes: 'NCL is genetically heterogeneous, with multiple CLN genes encoding lysosomal enzymes,
          lysosomal transmembrane proteins, and related endomembrane-system proteins. This record is deliberately
          unbound: it names the locus family, not a gene, so there is no HGNC identifier for it. The individual
          genes are each curated as their own record below and are bound there.

          Some CLN numbers in the series are deliberately not curated on this umbrella. CLN4 (DNAJC5)
          and CLN13 (CTSF) are curated in Adult_Neuronal_Ceroid_Lipofuscinosis, which binds both genes
          and also binds CLN6. MONDO:0008768 ceroid lipofuscinosis, neuronal, 6B (Kufs type) therefore
          belongs to that entry rather than to this one; MONDO''s own annotation on the 6A term states
          that biallelic CLN6 variants can also cause juvenile or adult-onset disease known as Kufs disease,
          and it is the 6A form that is the has_subtypes row here.

          CLN14 (KCTD7) is the contested case and is not curated here. The 2015 genetics review cited
          on this record does list CLN14 among the NCL genes, as one of two cytoplasmic proteins that
          peripherally associate with membranes. Against that, ClinGen''s Epilepsy Gene Curation Expert
          Panel - the same panel that curated the nine genes below against neuronal ceroid lipofuscinosis
          (MONDO:0016295) - curated KCTD7 against progressive myoclonus epilepsy (MONDO:0020074) instead,
          Definitive and autosomal recessive, in assertion CGGV:assertion_e6068b08-413e-4105-b8dc-97426d64c6c4-2022-09-07T160000.000Z.
          MONDO reflects the same split: MONDO:0012721 progressive myoclonic epilepsy type 3 is defined
          as "Any progressive myoclonic epilepsy in which the cause of the disease is a mutation in the
          KCTD7 gene", and carries both MONDO:0020074 and MONDO:0016295 as parents, the latter sourced
          from OMIM:611726 and Orphanet:263516. The KCTD7 disease therefore belongs in its own entry under
          progressive myoclonus epilepsy rather than as a subtype row here, and no such entry exists in
          this knowledge base yet.

          '
      selected_evidence:
        snippet: To date, 13 autosomal recessive gene variants, as well as one autosomal dominant gene
          variant, of NCL have been described.
        supports: SUPPORT
