              label: neuronal ceroid lipofuscinosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CLN Endomembrane Protein Dysfunction
        description: 'NCL-causing genes encode proteins distributed across the endomembrane system, and
          convergent dysfunction of this intracellular network is thought to underlie the shared clinical
          manifestations across subtypes. This node carries the membrane-associated half of that set:
          the transmembrane proteins CLN3, CLN6, CLN7/MFSD8 and CLN8 - of which CLN6 and CLN8 sit in the
          endoplasmic reticulum rather than the lysosome - together with progranulin (CLN11/GRN), which
          resides in secretory-pathway compartments. Their primary functions in these compartments are
          largely unresolved, so the shared downstream storage phenotype is better established than the
          individual routes to it.

          '
        genes:
        - preferred_term: CLN3
          term:
            id: hgnc:2074
            label: CLN3
        - preferred_term: CLN6
          term:
            id: hgnc:2077
            label: CLN6
        - preferred_term: CLN8
          term:
            id: hgnc:2079
            label: CLN8
        - preferred_term: MFSD8
          term:
            id: hgnc:28486
            label: MFSD8
        - preferred_term: GRN
          term:
            id: hgnc:4601
            label: GRN
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: lysosomal transport
          modifier: DYSREGULATED
          term:
            id: GO:0007041
            label: lysosomal transport
      selected_evidence:
        snippet: However, the transmembrane proteins CLN6 and CLN8 both localize to the endoplasmic reticulum
          (ER), and progranulin, encoded by CLN11/GRN, is demonstrated to reside in compartments in the
          secretory pathway
        supports: SUPPORT
