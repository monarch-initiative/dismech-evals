      assertion:
        name: Soluble Lysosomal Enzyme and Protein Deficiency
        description: A second, biochemically distinct route into the same storage phenotype. CLN1/PPT1,
          CLN2/TPP1 and CLN10/CTSD encode soluble lysosomal enzymes - a palmitoyl-protein thioesterase,
          a tripeptidyl peptidase and an aspartic endopeptidase - and CLN5 encodes a soluble lysosomal
          protein. Loss of these activities removes a degradative step inside the lysosome, unlike the
          membrane-protein subtypes where the lesion is in compartment identity or transport. The in vivo
          substrates of these enzymes are incompletely defined, so what specifically fails to be degraded
          is not settled; what distinguishes this class clinically is that enzyme replacement and gene
          therapy are tractable for it.
        genes:
        - preferred_term: PPT1
