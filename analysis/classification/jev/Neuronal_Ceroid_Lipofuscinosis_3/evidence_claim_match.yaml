  26134d3220979eee3c04a23c9b3c94f006b8753d05a4a81336ae07c16e68a6b2:
    claim:
      about:
        disease:
          name: Neuronal Ceroid Lipofuscinosis 3
          disease_term:
            preferred_term: neuronal ceroid lipofuscinosis 3
            term:
              id: MONDO:0008767
              label: neuronal ceroid lipofuscinosis 3
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Late multisystem decline and mortality
        age_range: 18 years through the third decade
        notes: 'Cardiac conduction abnormalities, loss of independent walking, and enteral-feeding dependence
          cluster in the late second and third decade, shortly before death. These pooled weighted mean
          ages at onset are: 17.8 (± 4.4) years (N = 45) for cardiac manifestations, 19.5 (± 3.2) years
          (N = 70) for loss of independent walking, 22.0 (± 1.6) years (N = 35) for feeding difficulties
          requiring enteral feeding, and 22.4 (± 4.4) years (N = 95) for death. Cardiac manifestations
          and loss of independent walking occur at similar ages, but earlier than feeding difficulties
          and death, which occur together around 22 years. Life expectancy is reported as twenty to thirty
          years with a range of 20-39 years, so this phase is not bounded by the 22.4-year weighted mean
          age at death. These are weighted means pooled across heterogeneous studies, not a single prospective
          cohort: nine studies were screened into the meta-analysis, but each symptom''s weighted mean
          derives from only one to four of them, and per-symptom N ranges from 35 to 254 across the full
          13-symptom timeline, so confidence is uneven, and the late milestones here (cardiac N = 45,
          enteral feeding N = 35) rest on especially small subsets. Ages are age at reported onset, so
          they inherit ascertainment and diagnostic-delay bias from the source cohorts (see PMID:31926949
          on delayed diagnosis and ophthalmic masquerades).

          '
      selected_evidence:
        snippet: cardiac manifestations (17.8 ± 4.4,N= 45), loss of independent walking (19.5 ± 3.2,N= 70),
          feeding difficulties requiring enteral feeding tube (22.0 ± 1.6,N= 35), and death (22.4 ± 4.4,N= 95)
        supports: SUPPORT
