              preferred_term: DNAJB2
              term:
                id: hgnc:5228
                label: DNAJB2
            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            association: Biallelic loss-of-function variants in DNAJB2 are the only established cause.
              In a Spanish dHMN cohort DNAJB2 was the fourth most frequent cause, accounting for 6.7%
              of patients.
            notes: 'Missense alleles are rare: c.14A>G p.(Tyr5Cys) in the J domain was reported homozygous
              in a CMT2 family (labelled CMT2T in the original report), with a phenotype comparable to
              the null alleles but no functional data; a homozygous c.184C>T variant was reported with
              dHMN and rimmed-vacuolar myopathy. Two variants were deliberately not curated as alleles
              of this disease. A heterozygous c.823+6C>T variant in an adult with severe sensorimotor
              polyneuropathy (PMID:40423229) was studied in fibroblasts but is a single heterozygous allele
              in a recessive gene. A dominant stop-loss variant, c.832T>G p.(*278Glyext*83), extends the
              HSJ1a isoform and causes a late-onset neuromyopathy with a dominant-negative mechanism in
              one German family (PMID:37070754); it is a distinct allelic disorder rather than this recessive
              loss-of-function disease.'
          role: ancestor
      assertion_type: Variant
      assertion:
        name: 3.8 kb deletion of the 5' DNAJB2 exons
        description: 'Homozygous ~3.8 kb deletion removing the first coding exons, which encode the J
          domain, found by whole-genome sequencing in a consanguineous family with SMA-like distal motor
          neuropathy, axonal sensorimotor neuropathy in two siblings and juvenile parkinsonism in one.
          It most likely abolishes expression; it also overlaps a predicted TUBA4A isoform.

          '
        clinical_significance: PATHOGENIC
        gene:
          preferred_term: DNAJB2
          term:
            id: hgnc:5228
            label: DNAJB2
      selected_evidence:
        snippet: Moreover, the deletion also affects a predicted isoform of the TUBA4A gene, mutations
          in which are associated with ALS
        supports: SUPPORT
