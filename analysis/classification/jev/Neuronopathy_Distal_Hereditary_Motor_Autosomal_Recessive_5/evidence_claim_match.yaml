      assertion_type: Discussion
      assertion:
        discussion_id: dnajb2_axon_loss_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which HSJ1 client proteins and which downstream process link loss of HSJ1 to motor and
          sensory axon degeneration?
        attaches_to:
        - pathophysiology#Impaired Ubiquitin-Proteasome Targeting of HSP70 Client Proteins
        - pathophysiology#Accumulation of Aggregation-Prone Client Proteins
        - pathophysiology#Length-Dependent Degeneration of Lower Motor Neuron Axons
        rationale: 'Every functional study of HSJ1 is an overexpression or construct experiment in non-neuronal
          or cultured neuronal cells, and the only patient tissue examined is skin, lymphoblastoid cells
          and fibroblasts. Phospho-TDP-43 in patient skin is the one direct link to a client protein,
          but loss of HSJ1 from dermal axons was not accompanied by neurofilament impairment. The review
          literature leaves open whether the lesion is proteotoxic or a defect of HSJ1b-dependent trafficking
          and secretion. No patient-derived motor neuron model or Dnajb2-null animal phenotype has been
          reported.

          '
      selected_evidence:
        snippet: Consistent with these data, skin biopsy analysis showed a complete loss of DNAJB2 expression
          in patients that was not associated with an impairment of NF, leaving the pathomechanism of
          the axonal loss still unclear.
        supports: SUPPORT
