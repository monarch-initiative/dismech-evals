          promotes ER-associated degradation of membrane and secretory proteins. In cell and animal systems,
          HSJ1 overexpression increases client ubiquitylation and degradation and lowers inclusion formation
          by polyglutamine proteins and mutant SOD1. The disease-relevant client proteins are not known,
          and impaired degradation has been inferred rather than measured in patient tissue.

          '
