      assertion:
        name: Accumulation of Aggregation-Prone Client Proteins
        biological_scale: CELLULAR
        role: cellular consequence
        mechanism_confidence: PROVISIONAL
        description: 'In the one family studied, immunoblots of skin biopsies detected phospho-TDP-43
          in two affected siblings (II.1 and II.2) and not in a single control; this shows the presence
          of the phosphorylated protein, not aggregates. Immunohistochemistry found phospho-alpha-synuclein
          deposits along dermal nerve fibres in one patient, the proband with Parkinson disease, while
          an affected sibling without parkinsonism was negative. These are the only patient-tissue observations
          bearing on protein accumulation; whether the same proteins accumulate in motor neurons is not
          known.

          '
      selected_evidence:
        snippet: Consistent with these data, we demonstrated TDP-43 accumulation in patients' skin but
          not in the control, supporting the hypothesis that in our patients the loss of DNAJB2 impairs
          the removal of toxic protein aggregates.
        supports: SUPPORT
