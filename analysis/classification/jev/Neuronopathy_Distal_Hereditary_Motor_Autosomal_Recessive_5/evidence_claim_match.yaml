          modifier: ABSENT
        - preferred_term: HSJ1 ubiquitin-interacting motif binding to polyubiquitylated clients
          term:
            id: GO:0031593
            label: polyubiquitin modification-dependent protein binding
          modifier: ABSENT
        - preferred_term: HSJ1 ubiquitin-interacting motif binding to the proteasome
          term:
            id: GO:0070628
            label: proteasome binding
          modifier: ABSENT
      selected_evidence:
        snippet: both isoforms have been shown to stimulate the ATPase activity of HSPA8 and to modulate
          its client binding
        supports: SUPPORT
