    claim:
      about:
        disease:
          name: Neuronopathy, Distal Hereditary Motor, Autosomal Recessive 7
          disease_term:
            preferred_term: distal hereditary motor neuronopathy with myopathic features
            term:
              id: MONDO:0030977
              label: neuronopathy, distal hereditary motor, autosomal recessive 7
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: denervation_secondary_myopathy
        hypothesis_label: Myopathic change is secondary to chronic denervation
        status: CANONICAL
        description: 'On this model the only primary lesion is in the peripheral nerve: loss of WARP from
          the nerve basement membrane causes motor axon loss, and every muscle finding — raised creatine
          kinase, myopathic motor units on needle EMG, dystrophic features on biopsy, fatty replacement
          on MRI — is a downstream consequence of long-standing denervation and reinnervation. Pagnamenta
          et al. argued this explicitly, noting that the histological features classically attributed
          to myopathy are also found in chronically denervated muscle, and that collagen VI immunolabelling
          was normal in the patient biopsies where it was assessed.

          '
      selected_evidence:
        snippet: Where data were available, immunohistochemical labelling for collagen VI appeared normal.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33559681
      reference_title: An ancestral 10-bp repeat expansion in VWA1 causes recessive hereditary motor neuropathy.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The collagen VI partner of WARP is normally deposited in patient muscle, which is
        the observation the secondary-myopathy model leans on: the matrix abnormality expected of a primary
        muscle-matrix disease was not found.'
