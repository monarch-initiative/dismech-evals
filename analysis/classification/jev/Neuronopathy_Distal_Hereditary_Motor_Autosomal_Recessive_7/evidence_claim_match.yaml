              system and is most abundant, among human tissues surveyed, in tibial nerve. Its loss leaves
              the nerve basement membrane structurally abnormal: electron microscopy of WARP-deficient
              mouse sciatic nerve shows partial fusion of the basement membranes of neighbouring axons,
              and collagen VI is reduced in regions of the peripheral nerve matrix. WARP is co-expressed
              with collagen VI in the endomysium of muscle, so the same deficit exists on the muscle side,
