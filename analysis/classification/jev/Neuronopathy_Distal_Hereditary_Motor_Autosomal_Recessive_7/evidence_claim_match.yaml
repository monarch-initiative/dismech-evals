        name: Muscle Extracellular Matrix Remodeling
        biological_scale: TISSUE
        role: contested parallel lesion
        description: 'An abnormality of the muscle extracellular space itself in patients lacking WARP,
          independent of any denervation. Proteomic profiling of patient white blood cells, plasma and
          muscle reported increased C-reactive protein in the extracellular space of VWA1-mutant muscle
          and increased NEFM in cells within the muscle matrix of every patient biopsy examined, and the
          plasma signature was dominated by proteins related to antioxidative processes. This node exists
          only under the alternative hypothesis that the muscle is a primary target; it is not asserted
          under the canonical model.

          '
        mechanism_confidence: HYPOTHETICAL
        biological_processes:
        - preferred_term: extracellular matrix organization in skeletal muscle
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: ABNORMAL
        notes: Marked HYPOTHETICAL deliberately. The proteomic study states that there is no consensus
          on whether muscle involvement is primary, and it studied six patients from two families. Its
          own authors describe the work as a first biomarker study. Treat the node as a placeholder for
          the alternative model rather than as an established lesion.
      selected_evidence:
        snippet: Plasma proteomics unravelled dysregulation of 15 proteins serving as biomarker candidates
          among which a profound proportion of increased ones (6/11) are mostly related to antioxidative
          processes and have even partially been described as blood biomarkers for other entities of neuromuscular
          disorders before.
        supports: SUPPORT
