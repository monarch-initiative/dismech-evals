        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Non-Length-Dependent Motor Axon Loss
        biological_scale: TISSUE
        role: central effector step
        description: 'Loss of motor axons producing reduced or absent compound motor action potentials
          with preserved conduction velocities — an axonal, not demyelinating, motor neuropathy — and
          normal sensory studies in most patients. The distinguishing feature of this disease is that
          the loss is not graded by axon length: three-quarters of the first cohort had simultaneous proximal
          and distal lower limb weakness, and in almost half of those the proximal weakness was the more
          severe. That is the opposite of the distal-first gradient that defines most of the distal hereditary
          motor neuropathies, and it is why this entry does not conform to the length-dependent peripheral
          axonal degeneration module.

          '
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
      selected_evidence:
        snippet: Motor nerve action potentials from the lower limb nerves were reduced or undetectable
          with uniformly preserved conduction velocities. Sensory studies were overall normal.
        supports: SUPPORT
