              label: neuronopathy, distal hereditary motor, autosomal recessive 7
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: MODERATE
        rationale: 'Lifelong motor disability from early childhood, but rarely loss of ambulation and
          no reported cardiac, respiratory or cognitive involvement. The dominant burden is diagnostic
          rather than functional: the condition is described as going unnoticed for years to decades,
          is routinely mistaken for Charcot-Marie-Tooth disease, spinal muscular atrophy, hereditary spastic
          paraplegia or a muscular dystrophy, and the causal allele is systematically missed by standard
          sequencing pipelines because of its GC-rich repetitive context. Patients in the reported cohorts
          had already been tested for Duchenne muscular dystrophy, facioscapulohumeral dystrophy, SMA
          and dystonia panels before the right gene was found.

          '
      selected_evidence:
        snippet: Given the broad phenotypic presentation of the condition, several other patients received
          preceding genetic investigations including neuropathy/neuromuscular disorder panel, movement
          disorder/dystonia panel, testing for Duchenne muscle dystrophy, facioscapulohumeral muscular
          dystrophy and SMA.
        supports: SUPPORT
