            name: Vwa1 (WARP) knockout mouse
            species: Mouse
            genotype: Vwa1 global knockout by targeted gene replacement (WARP-null)
            publication: PMID:19279005
            description: 'The global WARP-null mouse predates the human disease and is what made VWA1
              a candidate gene. The mice are healthy, viable and fertile with no overt abnormality, but
              show a significantly delayed response to acute painful stimulus and impaired fine motor
              coordination; the collagen VI microfibrillar matrix is severely reduced and mislocalised
              in peripheral nerve, fibrillar collagen deposition in the nerve matrix is reduced, and adjacent
              Schwann cell basement membranes partially fuse. Articular cartilage, intervertebral disc
              and skeletal muscle showed no detectable abnormality and basement membranes formed normally,
              which is a point against the primary-muscle-lesion model. The delayed nociceptive response
              has no clear human counterpart: impaired nociception was not frequently seen in the patient
              series.

              '
            genes:
            - preferred_term: VWA1
              term:
                id: hgnc:30910
                label: VWA1
            notes: Curated from the primary knockout paper PMID:19279005 and the reporter-gene localisation
              paper PMID:18314316, both fetched into the reference cache for this entry. Where PMID:33559681
              restates those findings its quotes are marked BACKGROUND so the two roles stay distinguishable.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Depletion of WARP from Nerve and Muscle Basement Membrane
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: TISSUE
        description: The mouse supplies the ultrastructural nerve-matrix lesion that gives this node its
          content, since no human nerve has been examined this way.
        limitations: It recapitulates the nerve arm and fails the muscle arm — WARP-deficient mice showed
          no histological or behavioural muscle pathology, so the mouse cannot be used to argue for the
          muscle side of this node. It also shows impaired nociception that was not frequently seen in
          patients, so the species mismatch runs in both directions.
      selected_evidence:
        snippet: Our data demonstrate that although WARP is not essential for basement membrane formation
          or musculoskeletal development, it has critical roles in the structure and function of peripheral
          nerves.
        supports: SUPPORT
