        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic VWA1 Loss-of-Function Variants
        biological_scale: MOLECULAR
        role: initiating genetic lesion
        mechanism_confidence: ESTABLISHED
        description: 'Two loss-of-function alleles of VWA1, the gene encoding the extracellular matrix
          protein WARP. Reported alleles are predominantly frameshifts and stop-gains, with a small number
          of missense changes affecting proline residues; the disease-defining allele is the 10 bp exon
          1 duplication NM_022834.5:c.62_71dup p.(Gly25ArgfsTer74), which was present in 14 of 15 families
          in the first reported cohort and in 12 of 15 families in the 2024 cohort. Both homozygosity
          for that allele and compound heterozygosity for it in trans with a second truncating variant
          are common.

          '
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic germline loss of function; both homozygous and compound heterozygous
            genotypes are reported, the latter usually with the founder allele in trans.
        genes:
        - preferred_term: VWA1
          term:
            id: hgnc:30910
            label: VWA1
      selected_evidence:
        snippet: Exome sequencing led us to identify bi-allelic loss of function variants in VWA1 as the
          molecular cause underlying a so far genetically undefined neuromuscular disorder.
        supports: SUPPORT
