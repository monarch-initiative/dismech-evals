  0703ba4a437f9a526a8df5f3d0005ce37fb950bd755432291cd87d78af524108:
    claim:
      about:
        disease:
          name: Neuronopathy, Distal Hereditary Motor, Autosomal Recessive 7
          disease_term:
            preferred_term: distal hereditary motor neuronopathy with myopathic features
            term:
              id: MONDO:0030977
              label: neuronopathy, distal hereditary motor, autosomal recessive 7
        context: []
      assertion_type: Genetic
      assertion:
        name: VWA1
        gene_term:
          preferred_term: VWA1
          term:
            id: hgnc:30910
            label: VWA1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Biallelic loss-of-function variants in VWA1 are the sole established cause of this
          condition. The gene encodes the 445-amino-acid extracellular matrix protein WARP, whose highest
          expression among human tissues surveyed is in tibial nerve.
        variants:
        - name: NM_022834.5:c.62_71dup p.(Gly25ArgfsTer74)
          description: 'A 10 bp duplication in exon 1 of VWA1, expanding an existing 2-copy 10 bp repeat
            to 3 copies, producing a frameshift with a premature stop 74 codons downstream. It is the
            disease-defining allele: present in 14 of 15 families in the first reported cohort and 12
            of 15 in the second, and carried on a shared 220 kb European founder haplotype. Its GC-rich,
            repetitive context gives poor sequencing coverage, which is why the gene evaded discovery
            and why cases are still missed on standard exome pipelines. Maximum population allele frequency
            in gnomAD v4.0.0 is 0.093% in European non-Finnish and 0.118% in UK Biobank.

            '
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: VWA1
            term:
              id: hgnc:30910
              label: VWA1
        notes: Beyond the founder allele, the reported variant spectrum is dominated by truncating changes
          — stop-gains and frameshifts — with a small number of missense changes at proline residues.
          The second cohort reported 13 additional variants, 11 of them previously undescribed, 12 seen
          in compound heterozygosity and 8 of those in trans with the founder allele. A reciprocal 10
          bp deletion at the same locus (c.62_71del10, p.G21Afs*12) is more common than the duplication
          in a Middle Eastern-enriched commercial cohort and was speculated by Pagnamenta et al. to be
          a second founder allele, but no biallelic case carrying it has been reported; it is recorded
          here as a lead, not as an established disease allele.
      selected_evidence:
        snippet: We detected six different truncating variants in 15 affected individuals from six families
          of German, Arabic, and Roma descent.
        supports: SUPPORT
