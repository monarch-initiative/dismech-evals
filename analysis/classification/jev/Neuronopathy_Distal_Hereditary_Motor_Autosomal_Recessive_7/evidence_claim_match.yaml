  3e788a8a615772056d5ecb31a906591adf1738b7c1ac468e2a013eb4070ae728:
    claim:
      about:
        disease:
          name: Neuronopathy, Distal Hereditary Motor, Autosomal Recessive 7
          disease_term:
            preferred_term: distal hereditary motor neuronopathy with myopathic features
            term:
              id: MONDO:0030977
              label: neuronopathy, distal hereditary motor, autosomal recessive 7
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: primary_muscle_matrix_lesion
        hypothesis_label: The muscle is primarily affected through its own extracellular matrix
        status: ALTERNATIVE
        description: 'On this model WARP loss injures the muscle directly, because WARP is a constituent
          of the muscle extracellular matrix as well as of the nerve basement membrane, so the disease
          is a neuromyopathy with two primary targets rather than a neuropathy with a denervated muscle.
          The Deschauer cohort named the condition a neuromyopathy on combined myopathological and neurophysiological
          grounds; a proteomic study of patient white blood cells, plasma and muscle set out explicitly
          to test for primary muscle vulnerability and reported extracellular accumulation of C-reactive
          protein and of NEFM in patient muscle; and muscle MRI in two independent reports shows an outside-in
          vastus lateralis pattern of the kind seen in collagen VI-related myopathy rather than the pattern
          expected of denervation.

          '
      selected_evidence:
        snippet: Muscle magnetic resonance imaging showed a distinctive outside-in pattern of fatty replacement
          in the vastus lateralis, resembling that seen in type VI collagen-related myopathies.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41331965
      reference_title: A Distinctive MRI Pattern Resembling Type VI Collagen Myopathy in Novel VWA1-Related
        Distal Hereditary Motor Neuronopathy With Myopathic Features in a Patient From Spain.
      evidence_source: HUMAN_CLINICAL
      explanation: An imaging pattern characteristic of a primary matrix myopathy rather than of denervation,
        in a muscle that is also a target of the collagen VI disorders WARP partners with.
