        mechanism_confidence: ESTABLISHED
        description: 'Transcripts carrying the premature termination codon are partially degraded by nonsense-mediated
          decay, and no WARP protein is detectable in patient dermal fibroblasts in either the cell layer
          or the conditioned medium, whereas control fibroblasts secrete detectable protein. In the mouse
          the protein is abundant in sciatic nerve and is efficiently deposited into the matrix, so the
          human null state removes a protein that is normally present at the site of disease.

          '
        biological_processes:
        - preferred_term: nonsense-mediated decay of the mutant VWA1 transcript
          term:
            id: GO:0000184
            label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
          modifier: INCREASED
        molecular_functions:
        - preferred_term: WARP as a structural constituent of the extracellular matrix
          term:
            id: GO:0005201
            label: extracellular matrix structural constituent
          modifier: ABSENT
      selected_evidence:
        snippet: However, there was no detectable VWA1 in either the conditioned medium or cell layer
          of the patient’s fibroblast
        supports: SUPPORT
