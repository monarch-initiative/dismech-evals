      assertion_type: Discussion
      assertion:
        discussion_id: vwa1_upper_motor_neuron_signs
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do some patients with biallelic VWA1 variants have upper motor neuron signs, when
          the gene product is a peripheral nerve and muscle matrix protein and the largest cohort found
          none?
        attaches_to:
        - phenotypes#Hyperreflexia
        - phenotypes#Spasticity
        rationale: 'The first cohort recorded largely normal muscle tone and uniformly negative Babinski
          signs across its 17 patients. A subsequent two-child report made upper motor neuron signs its
          title finding, and the 20-patient cohort that followed recorded hyperreflexia, spasticity in
          two and upgoing plantars in two. No mechanism has been proposed. The possibilities are not distinguished
          by any published data: ascertainment drift as the phenotype widened, a genuine central component
          of a protein that is also expressed in the vasculature of neural tissues, or coincidence in
          a population where one causal allele is carried by roughly one person in 441 and so will sometimes
          be found alongside an unrelated condition. The third possibility is specifically worth testing
          for a disease whose defining allele is this common, and no report has excluded it.

          '
      selected_evidence:
        snippet: Here, we report two cases from nonconsanguineous families in North America that presented
          in early childhood with lower extremity weakness and prominent foot deformities, and were found
          to carry bi-allelic variants in VWA1.
        supports: SUPPORT
    origin:
