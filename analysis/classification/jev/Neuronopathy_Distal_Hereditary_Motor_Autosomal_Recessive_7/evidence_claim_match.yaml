              label: neuronopathy, distal hereditary motor, autosomal recessive 7
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: vwa1_primary_or_secondary_myopathy
        kind: CONTROVERSY
        status: OPEN
        prompt: Is the muscle involvement in VWA1-related disease a primary lesion of the muscle extracellular
          matrix, or a secondary consequence of chronic denervation?
        attaches_to:
        - pathophysiology#Myopathic Change in Skeletal Muscle
        - pathophysiology#Muscle Extracellular Matrix Remodeling
        - pathophysiology#Chronic Neurogenic Denervation of Skeletal Muscle
        - mechanistic_hypotheses#denervation_secondary_myopathy
        - mechanistic_hypotheses#primary_muscle_matrix_lesion
        rationale: 'The two cohorts that described the disease concurrently, in the same journal and the
          same year, named it differently, and the disagreement has not been resolved by any subsequent
          study. It is not a naming quibble: the answer determines whether the entity belongs with the
          motor neuropathies or with the muscular dystrophies for the purposes of gene-panel design, and
          it determines what a future therapy would have to reach.

          For a secondary process: needle EMG was neurogenic in 10 of 12 studies and myopathic in a minority;
          four of seven biopsies were purely neurogenic; collagen VI immunolabelling was normal wherever
          assessed; the WARP-null mouse has no detectable skeletal muscle abnormality at all; and the
          histological features attributed to myopathy are known to occur in chronically denervated muscle.

          For a primary process: WARP is expressed in skeletal muscle as well as nerve and binds collagen
          VI, whose own disorders are muscular dystrophies; creatine kinase is raised in most patients
          and reached 2400 U/L; muscle MRI in several patients shows an outside-in vastus lateralis pattern
          typical of collagen VI myopathy rather than of denervation; proteomics found increased C-reactive
          protein and NEFM in the extracellular space of patient muscle; and a whole-body MRI series in
          which gracilis and sartorius were spared in all five VWA1 patients reads that sparing as evidence
          for a direct muscle effect.

          What would settle it: WARP immunostaining of patient muscle and nerve alongside quantitative
          matrix analysis, in patients whose denervation burden is measured independently; or a conditional
          muscle-restricted Vwa1 knockout. Neither has been reported.

          '
      selected_evidence:
        snippet: Nevertheless, the true myopathic nature of the disease remained controversial, with some
          proposing a primarily neurogenic pathology and a secondary myopathic process.
        supports: SUPPORT
