      assertion_type: Diagnosis
      assertion:
        name: VWA1 sequencing with attention to the exon 1 repeat
        description: 'Molecular diagnosis rests on detecting biallelic VWA1 variants. The practical difficulty
          is specific and technical: the founder allele is a 10 bp duplication in a GC-rich 10 bp repeat
          in exon 1, a context that gives low coverage and defeats standard variant callers, so the diagnosis
          is missed on otherwise adequate exome data. Both original cohorts recommend re-analysis of unsolved
          neuropathy exomes at relaxed quality-control thresholds, and targeted Sanger sequencing of exon
          1 in a screening cohort of 1341 unsolved neuropathy patients yielded three further diagnoses.

          '
      selected_evidence:
        snippet: In an attempt to replicate the results obtained from genome/exome sequencing, 1341 DNA
          samples from two independent cohorts of patients (374 from UK, 967 from Germany) with unsolved
          neuropathies were tested for the p.G25Rfs*74 founder mutation by screening exon 1 using a Sanger
          sequencing approach. This yielded three additional diagnoses
        supports: SUPPORT
