  f5c9f3caf99163b806f29651e0c207e3775ac735bc1f1dc3263aa27e5ad803ac:
    claim:
      about:
        disease:
          name: Neuropathy Hereditary Motor And Sensory Type VIc With Optic Atrophy
          disease_term:
            preferred_term: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
            term:
              id: MONDO:0032792
              label: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
        context: []
      assertion_type: Biochemical
      assertion:
        name: Plasma Neurofilament Light Chain
        biomarker_term:
          preferred_term: Elevated plasma neurofilament light chain
        notes: No ontology term is bound here. HPO has only a cerebrospinal-fluid-specific neurofilament
          term (HP:0032928, Elevated CSF neurofilament light chain concentration) and no plasma equivalent,
          and the measurements in this disease were made in plasma; the available broader alternative
          (HP:0010876, Abnormal circulating protein concentration) would carry no information about which
          protein. Not diagnostic, but the most informative treatment-response marker reported for this
          disease. NfL is released from breaking-down axons, so it reports on the mechanism node directly
          rather than on symptoms. It is elevated before treatment into the range seen in other axonal
          Charcot-Marie-Tooth neuropathies, and falls to the normal control range on PLP replacement,
          reaching about 2.5-fold below the pretreatment value at 24 months.
        readouts:
        - target: Length-Dependent Axonal Degeneration of Peripheral Nerve
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: PHARMACODYNAMIC
          interpretation: Falling NfL on treatment is evidence that PLP replacement slows the ongoing
            axonal breakdown, not merely that patients feel better.
      selected_evidence:
        snippet: NFL, a major axonal cytoskeletal protein, is released into cerebrospinal fluid and blood
          during axonal breakdown,43 providing a dynamic biomarker of axonal damage in neurodegenerative
          disorders, including inherited neuropathies.
        supports: SUPPORT
