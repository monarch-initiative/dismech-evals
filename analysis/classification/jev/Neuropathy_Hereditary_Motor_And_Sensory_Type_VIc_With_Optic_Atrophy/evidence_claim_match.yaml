          name: Neuropathy Hereditary Motor And Sensory Type VIc With Optic Atrophy
          disease_term:
            preferred_term: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
            term:
              id: MONDO:0032792
              label: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pdxk_cns_sparing_versus_neonatal_seizures
        kind: CONTROVERSY
        status: OPEN
        prompt: Is pyridoxal kinase activity really preserved in the brain in PDXK deficiency, given that
          two reported patients had vitamin-B6-dependent neonatal seizures?
        attaches_to:
        - pathophysiology#Cofactor Insufficiency for PLP-Dependent Enzymes in Neurons
        rationale: 'A tissue-sparing account was offered to explain why a disease of a ubiquitous cofactor-producing
          enzyme presents as a peripheral neuropathy with no central features. Rat data show that in B6
          deficiency pyridoxal kinase activity falls in liver, muscle and plasma while brain activity
          and B6 supply are maintained, and reviews have generalized this to state that in PDXK-related
          Charcot-Marie-Tooth disease the impairment is limited to peripheral signalling. Two 2026 patients
          contradict that generalization: both had neonatal seizures that responded to pyridoxine, years
          before any neuropathy, and their older sibling died at six months of drug-resistant epilepsy
          without ever having had a pyridoxine trial. Either the sparing is partial and allele-dependent,
          or it holds in the mature brain but not the neonatal one, or it does not hold at all and earlier
          cohorts simply did not include neonates. The distinction is not academic: if central involvement
          is real, a neonate with B6-responsive seizures and no ALDH7A1 variant should be tested for PDXK,
          and the two 2026 patients waited years for that test.'
      selected_evidence:
        snippet: However, with the PDXK mutations leading to CMT disease, B6-dependent impairments are
          limited to peripheral signaling.
        supports: SUPPORT
