              label: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic PDXK Variants Impair Pyridoxal Kinase Catalysis
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'Pyridoxal kinase phosphorylates the dietary B6 vitamers pyridoxal, pyridoxine and
          pyridoxamine, and is the rate-limiting step of the vitamin B6 salvage pathway in humans, who
          cannot synthesize the vitamin de novo. Two routes to reduced catalysis are documented. In the
          missense alleles the protein is made in normal amounts but its catalytic pocket is misshapen:
          circular dichroism showed rearranged aromatic side-chains around the pocket, isothermal titration
          calorimetry showed the p.Ala228Thr mutant no longer binds ATP, and kinetics showed a roughly
          doubled Km for pyridoxal together with a fall in Vmax. In the more recently described splice-altering
          allele the enzyme is not misfolded at all; the transcript is aberrantly spliced and degraded,
          so less enzyme is made.'
        molecular_functions:
        - preferred_term: pyridoxal kinase activity
          term:
            id: GO:0008478
            label: pyridoxal kinase activity
          modifier: DECREASED
        genetic_context:
          gene:
            preferred_term: PDXK
            term:
              id: hgnc:8819
              label: PDXK
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: Biallelic germline PDXK variants, homozygous in most reported families and compound
            heterozygous in one. Residual enzyme activity is reduced rather than abolished, which is why
            raising substrate concentration is therapeutically useful.
      selected_evidence:
        snippet: We identified biallelic mutations in PDXK in 5 individuals from 2 unrelated families
          with primary axonal polyneuropathy and optic atrophy.
        supports: SUPPORT
