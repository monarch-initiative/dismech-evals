          tissues, which is the observation behind the argument that the periphery is affected while the
          brain is spared.
        limitations: 'Dietary deprivation in a wild-type animal is not the human lesion, which is a constitutive
          enzyme defect with normal dietary intake. It also does not settle the tissue-selectivity question:
          two 2026 patients had B6-dependent neonatal seizures, a central phenotype the sparing account
          does not accommodate. That conflict is recorded as a CONTROVERSY discussion on this entry.'
      selected_evidence:
        snippet: In rats, B6 deficiency leads to rapid decreases in PDXK activity in the peripheries (liver,
          muscle, and plasma), with maintained PDXK activity and B6 supply in the brain.
