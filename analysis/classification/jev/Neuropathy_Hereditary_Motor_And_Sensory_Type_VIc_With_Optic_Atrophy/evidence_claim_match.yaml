            term:
              id: MONDO:0032792
              label: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
        context: []
      assertion_type: Genetic
      assertion:
        name: PDXK
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: PDXK (pyridoxal kinase)
          term:
            id: hgnc:8819
            label: PDXK
        notes: The only gene attributed to this entity. Reported disease alleles are missense and cluster
          in or near residues that contact the ATP cosubstrate; one splice-altering missense allele acts
          instead by reducing transcript abundance. As of the most recent review, thirteen patients from
          six families had been reported worldwide, carrying four recurrent pathogenic missense variants,
          so the mutational spectrum should be read as provisional.
        variants:
        - name: PDXK c.682G>A p.Ala228Thr
          description: 'The founding allele, homozygous in a Cypriot family. The best characterized biophysically:
            normal protein expression in patient fibroblasts, a rearranged catalytic pocket, no detectable
            ATP analogue binding, an approximately doubled Km for pyridoxal and a reduced Vmax.'
          gene:
            preferred_term: PDXK
            term:
              id: hgnc:8819
              label: PDXK
          clinical_significance: PATHOGENIC
          type: missense
        - name: PDXK c.659G>A p.Arg220Gln
          description: The second founding allele, homozygous in a Scottish-Italian family, at another
            conserved ATP-contacting residue. Patient cells showed reduced pyridoxal kinase activity,
            which is what classified it as pathogenic.
          gene:
            preferred_term: PDXK
            term:
              id: hgnc:8819
              label: PDXK
          clinical_significance: PATHOGENIC
          type: missense
        - name: PDXK c.225T>A p.Asn75Lys
          description: 'Acts by a different route from the ATP-pocket alleles: it destabilizes the pyridoxal
            kinase dimer and increases protein degradation, so the enzyme is lost rather than made incompetent.'
          gene:
            preferred_term: PDXK
            term:
              id: hgnc:8819
              label: PDXK
          clinical_significance: PATHOGENIC
          type: missense
        - name: PDXK c.826G>C p.Ala276Pro
          description: A splice-altering missense variant at the last nucleotide of exon 10, found compound
            heterozygous with p.Arg220Gln. RNA from the patient showed intron retention, an 87-nucleotide
            exon extension, and allelic imbalance indicating reduced expression from this allele. It is
            the first PDXK disease allele to act on transcript abundance rather than on enzyme kinetics.
          gene:
            preferred_term: PDXK
            term:
              id: hgnc:8819
              label: PDXK
          clinical_significance: PATHOGENIC
          type: missense
        - name: PDXK c.443C>T p.Thr148Met
          description: Homozygous in a consanguineous Indian family in which both affected siblings had
            pyridoxine-responsive neonatal seizures years before the neuropathy appeared.
          gene:
            preferred_term: PDXK
            term:
              id: hgnc:8819
              label: PDXK
          clinical_significance: PATHOGENIC
          type: missense
      selected_evidence:
        snippet: The substituted amino acids Ala228 and Arg220 are evolutionary conserved residues participating
          in PDXK interaction with its substrate ATP.
        supports: SUPPORT
