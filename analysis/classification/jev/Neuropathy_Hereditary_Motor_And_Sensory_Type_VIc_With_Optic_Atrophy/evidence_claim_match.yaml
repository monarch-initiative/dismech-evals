  b5fa8862d9bd668949df3a3c66ed7d38d5fbcf0081f0655459cca4876c45dbdc:
    claim:
      about:
        disease:
          name: Neuropathy Hereditary Motor And Sensory Type VIc With Optic Atrophy
          disease_term:
            preferred_term: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
            term:
              id: MONDO:0032792
              label: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
        context: []
      assertion_type: Treatment
      assertion:
        name: Pyridoxal 5'-Phosphate Replacement
        description: 'The disease-directed treatment, and the reason this entity matters disproportionately
          to its rarity. The logic is kinetic rather than a simple bypass: the mutant enzyme has roughly
          twice the normal Km for pyridoxal, so giving oral PLP, which is hydrolysed to pyridoxal before
          cellular uptake, raises the substrate concentration the residual enzyme sees and forces flux
          through it. Fifty milligrams a day was enough to bring plasma PLP above the normal range within
          two weeks. Over 18 to 24 months the treated siblings gained 8 and 6 points on the MRC sum score,
          regained independent walking, reported less pain and fatigue, showed no further electrophysiological
          progression, and had plasma neurofilament light chain fall to the normal range. Sensory examination
          and vision did not improve, so this is arrested and partially reversed motor decline rather
          than cure, and the evidence is an uncontrolled observation in two patients.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: pyridoxal 5'-phosphate replacement
          term:
            id: NCIT:C15433
            label: Nutritional Support
          therapeutic_agent:
          - preferred_term: pyridoxal 5'-phosphate
            term:
              id: CHEBI:18405
              label: pyridoxal 5'-phosphate
        notes: 'Ontology note: `NCIT:C15433 Nutritional Support` is generic for what is in practice a
          pharmacological dose of a specific compound. NCIT was searched for a vitamin-therapy clinical-action
          term and none exists; the candidates returned (`NCIT:C210732` Vitamin Supplement, `NCIT:C1505`
          Dietary Supplement) are substance concepts, not procedures, and are not reachable from the Clinical
          Intervention or Procedure root the treatment enum requires. The specific agent is carried by
          `therapeutic_agent` (CHEBI:18405) and the platform by `therapeutic_modality: SMALL_MOLECULE`.


          Do not substitute pyridoxine. Pyridoxine is a substrate of the enzyme that is deficient, and
          high-dose pyridoxine independently causes a sensory peripheral neuropathy, so it carries a specific
          risk of worsening the presenting problem. The one situation in which pyridoxine has been reported
          to work is the neonatal seizure presentation, where it controlled seizures before the PDXK diagnosis
          was made and was then switched to PLP.'
      selected_evidence:
        snippet: We rescued the clinical and biochemical profile with PLP supplementation in 1 family,
          improvement in power, pain, and fatigue contributing to patients regaining their ability to
          walk independently during the first year of PLP normalization.
        supports: SUPPORT
