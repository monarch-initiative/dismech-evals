          establishes that the assay works and that reduced-activity PDXK alleles exist in the population;
          it says nothing directly about the disease alleles.
      selected_evidence:
        snippet: In Drosophila, mutations in the dPdxk gene cause chromosome aberrations (CABs) and increase
          glucose content in larval hemolymph. Both phenotypes are rescued by the expression of the wild
          type human PDXK counterpart.
        supports: SUPPORT
