          disease_term:
            preferred_term: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
            term:
              id: MONDO:0032792
              label: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pdxk_which_plp_enzyme_fails_first
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which PLP-dependent enzyme, among the hundred or more that exist, actually fails first
          in the axon and causes it to degenerate?
        attaches_to:
        - pathophysiology#Cofactor Insufficiency for PLP-Dependent Enzymes in Neurons
        - pathophysiology#Length-Dependent Axonal Degeneration of Peripheral Nerve
        rationale: The chain from PDXK variant to low PLP is measured in patients at every step. The chain
          from low PLP to a dying axon is not. The founding study said plainly that it could not fully
          explain the mechanism of clinical improvement, and a subsequent review said the mechanism behind
          PDXK-associated neuropathy is unknown. The leading candidate is GABA, because glutamate decarboxylase
          requires PLP and because pyridoxal kinase inhibitors cause convulsions and lower GABA, with
          excitotoxic injury to sensory neurons proposed as the route; but that is an inference from pharmacological
          inhibition, not a measurement in this disease. The gap matters practically, because it is why
          nobody can yet say whether the sensory and visual arms that failed to improve on PLP replacement
          were irreversibly lost or merely undertreated.
        proposed_experiments:
        - experiment_id: pdxk_plp_enzyme_flux_in_patient_neurons
          name: Identify the rate-limiting PLP-dependent reaction in patient-derived sensory neurons
          description: Differentiate sensory neurons from patient induced pluripotent stem cells carrying
            the founding alleles and profile PLP-dependent metabolic fluxes, including GABA and other
            transaminase and decarboxylase products, against isogenic corrected controls, with and without
            PLP supplementation, to find which reaction falls first and whether restoring it rescues axonal
            integrity.
      selected_evidence:
        snippet: The mechanism behind PDXK-induced neuropathy is unknown; however, there is reason to
          believe that it may be related to gamma-aminobutyric acid (GABA) neurotransmission.
        supports: SUPPORT
    origin:
