        name: Chronic Axonopathy Without Demyelination
        description: Sural nerve biopsy shows diffuse and severe depletion of myelinated axons of all
          calibres, with the surviving fibres small and regenerating clusters present, and no demyelinating
          change. This is the tissue-level confirmation that the disease is an axonopathy rather than
          a myelinopathy, which is what separates it from the demyelinating Charcot-Marie-Tooth neuropathies
          it resembles clinically.
      selected_evidence:
        snippet: There is diffuse and severe depletion of both small and large myelinated axons with most
          of the surviving axons being <5μm in diameter. There were no axonal ovoids, but there were regenerating
          clusters (arrows) consistent with longstanding indolent axonopathy. There was no demyelination
          process.
        supports: SUPPORT
