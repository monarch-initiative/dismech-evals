  c55af31b270508d21e9879b3faca3137fc98803e2b0e07bff2a26841759643af:
    claim:
      about:
        disease:
          name: Neuropathy Hereditary Motor And Sensory Type VIc With Optic Atrophy
          disease_term:
            preferred_term: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
            term:
              id: MONDO:0032792
              label: neuropathy, hereditary motor and sensory, type VIc, with optic atrophy
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Pyridoxine-Induced Sensory Neuropathy
        description: 'The most specific differential, and the one that turns on the same axis as the disease
          itself. Excessive pyridoxine intake causes a sensory peripheral neuropathy, and the proposed
          mechanism is inhibition of pyridoxal kinase, so high-dose vitamin B6 produces pharmacologically
          what PDXK variants produce genetically. It is not rare: reported prevalence in two neuropathy
          cohorts was between 2.5% and 12.4%, and cases have occurred at doses near or below the European
          tolerable upper intake level.'
        distinguishing_features:
        - Acquired, with an exposure history and no family history.
        - Predominantly or purely sensory and often small-fibre, whereas the genetic disease is sensorimotor
          with distal wasting and areflexia.
        - No optic atrophy.
        - Circulating B6 vitamers are high rather than low. This is the decisive laboratory discriminator,
          since plasma PLP is reduced in the genetic disease.
        - Improves on stopping the supplement.
      selected_evidence:
        snippet: Recent reports on hereditary neuropathy due to pyridoxal kinase (PDXK) mutations may
          provide some insight into the mechanism, as genetic deficiencies in PDXK lead to the development
          of axonal sensory neuropathy. High circulating concentrations of PN may lead to a similar condition
          via the inhibition of PDXK.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33912895
      reference_title: 'Vitamin B-6-Induced Neuropathy: Exploring the Mechanisms of Pyridoxine Toxicity.'
      evidence_source: OTHER
      explanation: 'States the mechanistic convergence explicitly: pyridoxine toxicity is proposed to
        act by inhibiting the same enzyme this disease disables genetically, which is why the two phenocopy
        each other.'
