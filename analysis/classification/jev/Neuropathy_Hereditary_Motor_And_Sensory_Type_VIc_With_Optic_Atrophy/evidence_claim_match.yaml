      assertion:
        target: Biallelic PDXK Variants Impair Pyridoxal Kinase Catalysis
        relationship: MEASURES
        fidelity: LOW
        description: 'Reads out residual human pyridoxal kinase activity by complementation: an allele
          that fails to rescue the fly phenotype has lost function.'
        limitations: Two limitations matter and neither is small. The readouts are chromosome aberrations
          and haemolymph glucose, not neuropathy, so the system reports on enzyme competence rather than
          on disease mechanism. And the four human alleles actually tested in this study (D87H, V128I,
          H246Q, A243G) are population variants and a gestational-diabetes variant, NOT the p.Ala228Thr,
