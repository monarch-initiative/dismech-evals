              label: central nervous system lupus
        context: []
      assertion_type: Subtype
      assertion:
        name: Inflammatory or autoimmune NPSLE
        description: NPSLE manifestations attributed primarily to lupus-driven inflammation or autoimmunity,
          including optic neuritis, transverse myelitis, peripheral neuropathy, refractory seizures, psychosis,
          and acute confusional state, especially when generalized lupus activity is present.
      selected_evidence:
        snippet: Glucocorticoids and immunosuppressive therapy are indicated when NPSLE is thought to
          reflect an inflammatory process (optic neuritis, transverse myelitis, peripheral neuropathy,
          refractory seizures, psychosis, ACS) and in the presence of generalised lupus activity.
        supports: SUPPORT
    origin:
