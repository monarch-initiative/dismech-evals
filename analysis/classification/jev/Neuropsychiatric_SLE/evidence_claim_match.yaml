    evidence_metadata:
      reference: PMID:25081016
      reference_title: 'Glutamate receptor antibodies in neurological diseases: anti-AMPA-GluR3 antibodies,
        anti-NMDA-NR1 antibodies, anti-NMDA-NR2A/B antibodies, anti-mGluR1 antibodies or anti-mGluR5 antibodies
        are present in subpopulations of patients with either: epilepsy, encephalitis, cerebellar ataxia,
        systemic lupus erythematosus (SLE) and neuropsychiatric SLE, Sjogren''s syndrome, schizophrenia,
        mania or stroke. These autoimmune anti-glutamate receptor antibodies can bind neurons in few brain
        regions, activate glutamate receptors, decrease glutamate receptor''s expression, impair glutamate-induced
        signaling and function, activate blood brain barrier endothelial cells, kill neurons, damage the
        brain, induce behavioral/psychiatric/cognitive abnormalities and ataxia in animal models, and
        can be removed or silenced in some patients by immunotherapy.'
      evidence_source: OTHER
      explanation: The review supports anti-NMDA-NR2A/B antibodies as a subset biomarker in SLE and NPSLE.
