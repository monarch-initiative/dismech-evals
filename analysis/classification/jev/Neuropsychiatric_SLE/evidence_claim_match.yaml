    claim:
      about:
        disease:
          name: Neuropsychiatric Systemic Lupus Erythematosus
          disease_term:
            preferred_term: neuropsychiatric systemic lupus erythematosus
            term:
              id: MONDO:0043985
              label: central nervous system lupus
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: npsle_mechanistic_interplay_heterogeneous_phenotypes
        prompt: How do the autoimmune-inflammatory and thrombo-ischemic pathways in NPSLE interplay to
          produce heterogeneous neuropsychiatric manifestations (cognitive impairment, mood disturbance,
          psychosis, seizures)? The current model captures both pathways—neuroinflammatory (complement,
          type I IFN, BBB disruption, NMDA excitotoxicity) and thrombotic (aPL, neurovascular prothrombotic
          mechanisms)—but their relative contributions to specific phenotypes and mechanistic convergence
          points remain incompletely characterized. Additionally, do non-stroke vascular-injury mechanisms
          (e.g., endothelial dysfunction, microvasculature inflammation) contribute broadly to psychiatric/cognitive
          symptoms independently of frank cerebrovascular accident?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Autoimmune Neuroinflammation
        - pathophysiology#Antiphospholipid-Associated Neurovascular Thrombosis
        rationale: NPSLE is mechanistically heterogeneous with two partially overlapping pathogenic pathways.
          Current evidence emphasizes the interplay but does not dissect how each pathway preferentially
          drives specific manifestations. Clarifying these links would enable more precise mechanistic
          subtyping, improve prognosis prediction, and inform targeted therapeutic strategies (e.g., immunosuppression
          vs. anticoagulation vs. combined approaches) tailored to the underlying mechanism(s) in individual
          patients.
        proposed_experiments:
        - experiment_id: npsle_mechanism_phenotype_cohort
          name: Neuroimaging-CSF stratification cohort for mechanism-phenotype mapping
          description: Stratify NPSLE patients by serological markers (anti-NR2, aPL, complement levels,
            type I IFN signature) and neuropsychiatric phenotype (cognitive vs. mood vs. psychotic), correlating
            to imaging biomarkers (BBB integrity, white-matter injury, microglial activation) and CSF
            cytokine/chemokine profiles to map pathway-to-phenotype associations.
        - experiment_id: npsle_biomarker_prediction_study
          name: Serial plasma biomarker prediction of incident psychiatric manifestations
          description: Longitudinal plasma biomarker studies (neurofilament, phospho-tau, endothelial
            markers, complement activation, type I IFN score) in NPSLE cohorts prospectively monitored
            for incident psychiatric/cognitive episodes to test whether biomarker patterns predict phenotype
            or pathway dominance.
      selected_evidence:
        snippet: 'Its pathogenesis remains incompletely understood and reflects the interplay among systemic
          immune dysregulation, vascular injury, blood-brain and blood-CSF barrier dysfunction, and local
          neuroinflammatory processes.Current evidence supports two partially overlapping pathogenic pathways:
          an autoimmune-inflammatory and a thrombo-ischemic pathway.'
        supports: SUPPORT
