              label: central nervous system lupus
        context: []
      assertion_type: Definition
      assertion:
        name: Attribution and exclusion-based diagnosis
        definition_type: DIAGNOSTIC_CRITERIA
        description: Suspected NPSLE is first evaluated like the same neurologic or psychiatric syndrome
          in a patient without SLE. Attribution to lupus follows exclusion of non-SLE causes and assessment
          for inflammatory, autoimmune, thrombotic, or mixed mechanisms.
        scope: Diagnostic workup of new neurologic or psychiatric events in patients with SLE.
        criteria_sets:
        - name: EULAR diagnostic workup
          description: Workup includes targeted studies such as CSF analysis, EEG, neuropsychological
            testing, nerve-conduction studies, and MRI according to the presenting syndrome.
          minimum_required: 1
      selected_evidence:
        snippet: Due to the lack of a gold standard, the attribution of NP symptoms to SLE represents
          a clinical challenge that obligates the strict exclusion of any other potential cause.
        supports: SUPPORT
    origin:
