      assertion_type: Pathophysiology
      assertion:
        name: SMPD1 Loss of Function and Acid Sphingomyelinase Deficiency
        conforms_to: lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency
        description: Biallelic loss-of-function variants in SMPD1 (sphingomyelin phosphodiesterase 1)
          abolish lysosomal acid sphingomyelinase activity. The enzyme normally hydrolyzes sphingomyelin
          to ceramide and phosphocholine; its near-complete loss is the primary biochemical lesion of
          NPD-A.
        gene:
          preferred_term: SMPD1
          term:
            id: hgnc:11120
            label: SMPD1
        molecular_functions:
        - preferred_term: acid sphingomyelin phosphodiesterase activity
          term:
            id: GO:0061750
            label: acid sphingomyelin phosphodiesterase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: sphingomyelin catabolic process
          modifier: DECREASED
          term:
            id: GO:0006685
            label: sphingomyelin catabolic process
      selected_evidence:
        snippet: NPD type A and B are caused by mutations in the gene SMPD1 coding for sphingomyelin phosphodiesterase
          1, with a consequent lack of acid sphingomyelinase activity.
        supports: SUPPORT
