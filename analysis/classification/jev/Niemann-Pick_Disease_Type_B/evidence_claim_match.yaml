            label: spleen
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
      selected_evidence:
        snippet: Type B patients also have hepatosplenomegaly and pathologic alterations of their lungs,
          but there are usually no CNS signs.
        supports: SUPPORT
