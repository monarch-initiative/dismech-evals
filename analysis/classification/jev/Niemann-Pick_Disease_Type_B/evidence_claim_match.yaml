      assertion_type: Pathophysiology
      assertion:
        name: Residual Acid Sphingomyelinase Activity from SMPD1 Variants
        conforms_to: lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency
        description: Biallelic SMPD1 variants reduce but do not abolish acid sphingomyelinase activity.
          The residual activity is generally sufficient to spare the CNS, so disease is dominated by visceral
          sphingomyelin storage rather than neurodegeneration.
        gene:
          preferred_term: SMPD1
          term:
            id: hgnc:11120
            label: SMPD1
        molecular_functions:
        - preferred_term: acid sphingomyelin phosphodiesterase activity
          term:
            id: GO:0061750
            label: acid sphingomyelin phosphodiesterase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: sphingomyelin catabolic process
          modifier: DECREASED
          term:
            id: GO:0006685
            label: sphingomyelin catabolic process
      selected_evidence:
        snippet: All patients with types A and B NPD have mutations in the gene encoding ASM (SMPD1),
          and thus the disease is more accurately referred to as ASM deficiency (ASMD).
        supports: SUPPORT
