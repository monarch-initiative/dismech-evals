        - preferred_term: sphingomyelin metabolic process
          modifier: ABNORMAL
          term:
            id: GO:0006684
            label: sphingomyelin metabolic process
      selected_evidence:
        snippet: These patients presented with hepatomegaly, foamy macrophage infiltration into tissues
          and bone marrow, partial deficiency of ASM activity, and moderate accumulation of sphingomyelin,
          but also exhibited chronic and often severe neurological deterioration. They were therefore
          classified as having types C, D or E NPD.
        supports: SUPPORT
