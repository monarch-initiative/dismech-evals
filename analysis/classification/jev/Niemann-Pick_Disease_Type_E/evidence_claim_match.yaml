        conforms_to: lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation
        description: Patients historically grouped under types C, D, or E Niemann-Pick disease showed
          partial acid sphingomyelinase deficiency with moderate sphingomyelin accumulation and foamy
          macrophage (foam cell) infiltration of tissues and bone marrow alongside chronic neurological
          deterioration. Later experimental and biochemical studies demonstrated that partial acid sphingomyelinase
          deficiency in this historical group was often secondary to a primary defect in intracellular
          cholesterol esterification rather than a primary SMPD1 defect. The "type E" label has no independent
          molecular basis and is now obsolete, with affected individuals reclassified to ASMD or Niemann-Pick
          disease type C.
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        cellular_components:
