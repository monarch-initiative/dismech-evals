        hypothesis_group_id: canonical_npc1_npc2_cholesterol_lysosomal_trafficking_model
        hypothesis_label: Canonical NPC1/NPC2 Cholesterol & Lipid Lysosomal Trafficking Model
        status: CANONICAL
        description: Niemann-Pick disease type C (NPC) is an autosomal recessive lysosomal cholesterol-trafficking
          disorder caused by loss-of-function variants in NPC1 (~95%) or NPC2 (~5%) encoding complementary
          late-endosomal / lysosomal membrane proteins that mediate egress of unesterified cholesterol
          from the lysosome. Loss of NPC1/NPC2 function produces lysosomal accumulation of unesterified
          cholesterol, sphingomyelin, glycosphingolipids, and sphingosine, dysregulating endolysosomal
          homeostasis, autophagy, calcium signaling, and synaptic function. The resulting phenotype is
          highly heterogeneous, including neonatal cholestatic hepatosplenomegaly, progressive neurologic
          regression (vertical supranuclear gaze palsy, cerebellar ataxia, dystonia, seizures, dementia),
          and psychiatric features. Miglustat (substrate reduction, EU/UK approved), arimoclomol, 2-hydroxypropyl-β-
          cyclodextrin (intrathecal), and acetyl-DL-leucine (Aqneursa, FDA-approved 2024) corroborate
          the cholesterol/sphingolipid-trafficking axis as the canonical pathogenic mechanism.
        notes: 'Retained as CANONICAL with important scope qualifiers. The 2026 falcon hypothesis-search
          report (kb/hypotheses/Niemann_Pick_Disease_Type_C/canonical_npc1_npc2_cholesterol_lysosomal_trafficking_model;
          openscientist timed out at 3600s) finds SUPPORTED. The canonical NPC1 (lysosomal membrane) /
          NPC2 (lysosomal lumen) chain → blocked LDL-derived cholesterol egress → lysosomal cholesterol/sphingolipid
          storage → multisystem dysfunction is strongly validated. Recent extensions: (1) NPC1 directly
          interacts with and mediates SPHINGOSINE export in addition to cholesterol, indicating multi-lipid
          export biology; (2) more explicit downstream causal links to neurodegeneration via organelle
          contact-site dysfunction, Ca²⁺ dysregulation, and cell-type-specific neuron/microglia vulnerabilities.
          Three caveats: (1) some downstream steps (autophagy impairment, Ca²⁺ defects, neuroinflammation)
          remain incompletely ordered causally in humans; (2) therapy-linked biomarker changes (cholesterol
          mobilization with 2-hydroxypropyl-β-cyclodextrin, miglustat) show target engagement but inconsistent
          linkage to neuronal-injury markers across small cohorts; (3) tissue specificity is substantial
          — e.g., lung-restricted cholesterol accumulation from TMEM241 perturbation — indicating modifiers/upstream
          dependencies beyond NPC1/NPC2 genotype alone. Acetyl-DL-leucine (Aqneursa, FDA 2024) and arimoclomol
          further validate the lipid-trafficking axis.'
      selected_evidence:
        snippet: Niemann-Pick disease type C (NP-C) is a rare inherited neurovisceral disease caused by
