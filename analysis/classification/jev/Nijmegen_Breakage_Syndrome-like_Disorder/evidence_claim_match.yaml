      assertion_type: Subtype
      assertion:
        name: Classic NBSLD
        display_name: Classic NBSLD (growth failure and microcephaly without immunodeficiency)
        description: 'The originally delineated presentation: severe pre- and postnatal growth restriction,
          microcephaly, "bird-like" facies, mild intellectual impairment, cellular radiosensitivity and
          radioresistant DNA synthesis, but without severe recurrent infection, immunoglobulin deficiency
          or lymphoid malignancy. The index patient remained free of malignancy to age 23 years.'
      selected_evidence:
        snippet: At variance with this diagnosis, she never had severe infections, had normal immunoglobulin
          levels, and did not develop lymphoid malignancy up to age 23 years.
        supports: SUPPORT
