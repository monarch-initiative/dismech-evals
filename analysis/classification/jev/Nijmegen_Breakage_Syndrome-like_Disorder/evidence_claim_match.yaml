      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: NBSLD is caused by biallelic (compound heterozygous or homozygous) hypomorphic RAD50
          variants and segregates as an autosomal recessive trait, in parallel with the other two MRN-complex
          disorders (NBN-related Nijmegen breakage syndrome and MRE11-related ataxia-telangiectasia-like
          disorder).
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Hypomorphic mutations in NBN (previously known as NBS1) and MRE11A give rise to the autosomal-recessive
          diseases Nijmegen breakage syndrome (NBS) and ataxia-telangiectasia-like disorder (ATLD), respectively.
        supports: SUPPORT
