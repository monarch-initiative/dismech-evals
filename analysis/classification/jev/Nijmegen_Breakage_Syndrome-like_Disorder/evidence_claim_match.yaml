        context: []
      assertion_type: Treatment
      assertion:
        name: Recombinant human growth hormone
        description: Somatropin has been used off-label for the short stature of NBSLD. In the single
          reported experience, 5 years 9 months of therapy improved height from -3.35 SD to -1.28 SD with
          no tumour at 5-year post-discontinuation follow-up. IMPORTANT SAFETY CAVEAT - in that case growth
          hormone was started by junior physicians before any genetic evaluation; the authors emphasise
          that genetic evaluation should precede growth-promoting therapy in syndromic short stature,
          because growth hormone/IGF-1 signalling is mitogenic and the underlying DNA repair deficiency
          may raise tumour risk. The evidence base is one patient.
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: somatropin
            term:
              id: NCIT:C837
              label: Somatropin
        target_phenotypes:
        - preferred_term: Short stature
          term:
            id: HP:0004322
            label: Short stature
      selected_evidence:
        snippet: Although recombinant human growth hormone significantly improved the patient's growth
          rate (from -3.35 SD to -1.28 SD), these variants may serve as a potential molecular basis for
          Nijmegen Breakage Syndrome-like disease and could also increase the risk of tumor formation.
        supports: SUPPORT
