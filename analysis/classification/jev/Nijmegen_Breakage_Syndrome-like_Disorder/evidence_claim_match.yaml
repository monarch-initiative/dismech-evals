      assertion_type: Discussion
      assertion:
        discussion_id: rad50_heterozygous_carrier_cancer_risk
        kind: INTERPRETATION
        status: OPEN
        prompt: What, if anything, should parents and other heterozygous RAD50 carriers identified through
          an NBSLD diagnosis be told about their own cancer risk?
        rationale: 'This is a carrier-level question, deliberately kept out of the disease''s genetic
          record because it is not evidence about NBSLD itself. Monoallelic RAD50 loss-of-function is
          studied as a breast-cancer susceptibility allele, but the risk is not uniform across alleles:
          a Northern Finnish population-based study classified the recurrent founder allele RAD50 c.687delT
          as a moderate-risk allele, whereas broader analyses of heterozygous RAD50 pathogenic variants
          have not shown a consistent overall breast-cancer excess. Cascade testing after an NBSLD diagnosis
          will identify obligate carrier parents, so the scope and limits of that risk statement matter
          practically. Nothing here implies a cancer risk statement for the biallelic disease.'
      selected_evidence:
        snippet: whereas CHEK2 c.1100delC, MCPH1 c.909_921del, and RAD50 c.687delT were moderate-risk
          alleles
        supports: SUPPORT
