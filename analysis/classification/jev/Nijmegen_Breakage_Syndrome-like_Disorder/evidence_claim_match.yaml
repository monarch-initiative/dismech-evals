            term:
              id: MONDO:0013118
              label: Nijmegen breakage syndrome-like disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of MRN damage-focus formation and DSB sensing
        biological_scale: MOLECULAR
        description: 'The MRN complex is among the first entities recruited to a double-strand break.
          In RAD50-deficient patient cells, damage-induced MRN nuclear focus formation fails. The defect
          is in damage-recruited focus formation and sensing, NOT necessarily in complex assembly: the
          RAD50 E1035del coiled-coil allele still assembles an MRN complex but impairs MRE11 nuclease
          function and end resection, and in the p.Arg83His/p.Glu485Ter patient RAD50 expression and complex
          formation were maintained while ATM signalling still failed. Cryo-EM shows why assembly and
          signalling are separable - NBS1''s ATM-recruitment motif is sequestered on the regulatory RAD50
          S site and must be released for ATM activation, so RAD50 lesions can block signalling from within
          an intact complex.'
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: double-strand break repair
          modifier: ABNORMAL
          term:
            id: GO:0006302
            label: double-strand break repair
        cellular_components:
        - preferred_term: site of double-strand break
          term:
            id: GO:0035861
            label: site of double-strand break
      selected_evidence:
        snippet: failure to form DNA damage-induced MRN foci
        supports: SUPPORT
