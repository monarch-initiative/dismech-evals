      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: allele_dependent_immunohematologic_arm
        hypothesis_label: Residual RAD50 function determines whether the immune/haematopoietic arm manifests
        status: EMERGING
        description: 'Reported RAD50 genotypes segregate into a "classic" arm with growth failure and
          microcephaly but preserved immunity, and an arm with bone marrow failure and B-cell immunodeficiency.
          The proposed explanation is that different alleles preserve different MRN sub-functions: the
          E1035del coiled-coil allele impairs end resection and replication while sparing ATM signalling,
          whereas the p.Arg83His/p.Glu485Ter genotype preserves complex assembly but abolishes ATM activation.
          Which sub-function is retained is hypothesised to determine whether the haematopoietic/B-cell
          compartment decompensates. This mapping is inferred from a handful of patients and has not been
          tested systematically.'
      selected_evidence:
        snippet: This mutation represents a human RAD50 separation-of-function mutation that impairs DNA
          repair, DNA replication, and DNA end resection without affecting ATM-dependent DNA damage response.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
