    claim:
      about:
        disease:
          name: Nijmegen Breakage Syndrome-like Disorder
          disease_term:
            preferred_term: Nijmegen breakage syndrome-like disorder
            term:
              id: MONDO:0013118
              label: Nijmegen breakage syndrome-like disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rad50_mouse_human_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the hypomorphic Rad50(S/S) mouse faithfully model classic human NBSLD, given that
          the mouse dies of bone marrow failure with cancer predisposition while classic human NBSLD patients
          have preserved immunity, no malignancy and a stable course?
        attaches_to:
        - pathophysiology#Genotoxic stress in proliferating progenitor pools
        rationale: The progenitor-attrition mechanism invoked for human growth failure and microcephaly
          is demonstrated principally in Rad50(S/S) mice, but that model's dominant outcomes - lethal
          haematopoietic failure and tumours - correspond to the minority bone-marrow-failure arm of the
          human spectrum, not the classic arm. Conversely, no mouse model reproduces the severe congenital
          microcephaly that defines human NBSLD. Because Rad50 nulls are embryonically lethal, viable
          models necessarily carry particular hypomorphic alleles whose residual activity may not correspond
          to any human genotype, so mechanistic inferences drawn from the mouse for the human neurodevelopmental
          phenotype have uncertain translational validity.
        proposed_experiments:
        - experiment_id: exp_rad50_humanised_allele_knockin_mice
          name: Knock-in mice carrying human NBSLD RAD50 alleles
          description: Generate mice bearing the specific human alleles (E1035del, p.Arg83His, the exon-15
            splice allele) and compare cortical progenitor dynamics, body growth, haematopoiesis and tumour
            incidence, to test whether particular human alleles reproduce the classic growth/microcephaly
            arm rather than the murine marrow-failure/cancer phenotype.
        - experiment_id: exp_rad50_cerebral_organoids
          name: RAD50-deficient human cerebral organoids
          description: Derive iPSC cerebral organoids from RAD50-deficient patients and quantify neural
            progenitor proliferation, premature differentiation and apoptosis, mirroring the organoid
            work already done for NBN-related Nijmegen breakage syndrome, to test the progenitor-attrition
            route to microcephaly directly in human tissue.
      selected_evidence:
        snippet: Rad50(S/S) mice died with complete bone marrow depletion as a result of progressive hematopoietic
          stem cell failure.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12208847
      reference_title: Cancer predisposition and hematopoietic failure in Rad50(S/S) mice.
      evidence_source: MODEL_ORGANISM
      explanation: The mouse's lethal marrow phenotype is the specific outcome that does not match classic
        human NBSLD.
