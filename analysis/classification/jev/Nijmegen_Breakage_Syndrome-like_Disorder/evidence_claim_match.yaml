        name: Dyskeratosis congenita
        description: Relevant specifically to the bone-marrow-failure arm. The E1035del patient presented
          with marrow failure plus the classic dyskeratosis congenita mucocutaneous triad - skin pigmentation,
          nail dysplasia and leukoplakia - which the authors read as suggesting a DNA repair and/or telomere
          maintenance defect. A telomere-biology disorder is therefore the leading alternative diagnosis
          in an NBSLD patient presenting this way.
        disease_term:
          preferred_term: dyskeratosis congenita
          term:
            id: MONDO:0015780
            label: dyskeratosis congenita
        distinguishing_features:
        - Severe congenital microcephaly with pre- and postnatal growth restriction is characteristic
          of NBSLD and not of dyskeratosis congenita.
        - Dyskeratosis congenita is caused by telomere-maintenance gene defects with short telomeres,
          whereas NBSLD is caused by biallelic RAD50 variants affecting DSB sensing.
        - Radioresistant DNA synthesis and impaired ATM activation point to NBSLD rather than a telomere-biology
          disorder.
      selected_evidence:
        snippet: Collectively, P1's clinical features were reminiscent of a defect in DNA repair and/or
          telomere maintenance
        supports: SUPPORT
