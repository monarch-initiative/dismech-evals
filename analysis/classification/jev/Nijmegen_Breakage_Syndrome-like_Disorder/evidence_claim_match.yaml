        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nbsld_cancer_risk_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does RAD50 deficiency confer a cancer predisposition comparable to that of NBN-related
          Nijmegen breakage syndrome, or is the apparent absence of malignancy in NBSLD real?
        attaches_to:
        - pathophysiology#Chromosomal instability and cellular radiosensitivity
        rationale: No malignancy has been reported in the longest-followed NBSLD patients (index patient
          malignancy-free at 23 years; a growth-hormone-treated patient tumour-free at 5-year follow-up).
          But the total published cohort is fewer than ten patients with variable follow-up, and both
          the paralogous human diseases (NBS, ATLD) and the hypomorphic Rad50(S/S) mouse show clear cancer
          predisposition. Absence of evidence here is not evidence of absence, and case-report authors
          explicitly flag increased tumour risk when considering mitogenic therapy.
        proposed_experiments:
        - experiment_id: exp_nbsld_prospective_oncologic_registry
          name: International RAD50-deficiency registry with prospective oncologic follow-up
          description: Assemble all molecularly confirmed RAD50-deficient patients into a shared registry
            with standardised, prospective, lifelong cancer surveillance and a defined minimum follow-up,
            so that malignancy incidence can be estimated rather than inferred from scattered case reports
            of varying duration.
        - experiment_id: exp_nbsld_genotype_stratified_cancer_risk
          name: Genotype-stratified analysis of cancer incidence against residual RAD50 function
          description: Measure residual RAD50 function for each patient allele using the established lentiviral
            complementation assays (damage response, mitotic progression), then test whether malignancy
            occurrence tracks residual function - which would explain why the classic arm appears cancer-free
            while the mouse model is cancer-prone.
      selected_evidence:
        snippet: 'due to the rarity of cases and the short follow-up period, we cannot

          rule out the possibility that patients with NBSLD caused by RAD50

          mutations are at an increased risk of malignancy. Patients with

          NBSLD caused by RAD50 mutations should be regularly monitored

          for tumor occurrence.'
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41798197
      reference_title: Novel RAD50 variants lead to Nijmegen Breakage Syndrome-like disorder and unplanned
        recombinant human growth hormone treatment response.
      evidence_source: HUMAN_CLINICAL
      explanation: States the knowledge gap directly in the authors' own words - rarity and short follow-up
        prevent excluding increased malignancy risk - and gives the resulting surveillance recommendation.
        This is the primary warrant for this discussion.
