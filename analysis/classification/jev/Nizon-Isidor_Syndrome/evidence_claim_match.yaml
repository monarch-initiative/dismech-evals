  00e674d7075dca83aba761fbbbf1669af3abf374295bebc71507335dbdf96dfe:
    claim:
      about:
        disease:
          name: Nizon-Isidor Syndrome
          disease_term:
            preferred_term: Nizon-Isidor syndrome
            term:
              id: MONDO:0030030
              label: Nizon-Isidor syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MED12L kinase-module haploinsufficiency
        description: 'MED12L is the autosomal paralog of the MED12 scaffold in the CDK8 kinase module
          (CKM) of the Mediator complex. Heterozygous, predominantly de novo variants act through haploinsufficiency
          to disrupt CKM-dependent transcription; patient fibroblasts show a transcriptional defect (impaired
          recovery of RNA synthesis after UV irradiation), similar to that seen in MED12 and milder than
          in MED13L cells. MED12L belongs to the group of CDK8-kinase module-associated disease genes.

          '
        genes:
        - preferred_term: MED12L
          term:
            id: hgnc:16050
            label: MED12L
        biological_processes:
        - preferred_term: transcription by RNA polymerase II
          term:
            id: GO:0006366
            label: transcription by RNA polymerase II
        - preferred_term: regulation of gene expression
          term:
            id: GO:0010468
            label: regulation of gene expression
          modifier: DYSREGULATED
      selected_evidence:
        snippet: MED12L fibroblasts for individual 1 and 2 show a defect in transcriptional activity as
          measured by recovery of RNA synthesis after UV irradiation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
