          name: Re-evaluation of questioned XLID genes against contemporary population databases
          description: Repeat the control-frequency reassessment against gnomAD-scale population data,
            which offers far more X chromosomes than the NHLBI cohort, and combine with independent replication
            cohorts and functional assays for the genes still flagged as requiring replication.
      selected_evidence:
        snippet: Of the 15 assignments in need of replication, additional cases with MAOA, HCFC1, CCDC22,
          CNKSR2, KIAA2022, NAA10 and SHROOM4 sequence variants have now been published, leaving 17 of
          the 25 challenged genes unresolved.
        supports: SUPPORT
