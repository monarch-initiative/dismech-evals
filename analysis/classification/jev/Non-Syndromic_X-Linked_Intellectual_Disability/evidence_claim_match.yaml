      assertion:
        name: Static Cognitive Impairment Without Structural Brain Malformation
        biological_scale: ORGANISM
        description: 'The endpoint of the class: non-progressive impairment of intellectual functioning
          and adaptive behaviour in a brain that is structurally normal on imaging and free of any consistently
          reproducible dysmorphic, metabolic, or systemic sign. This is a mis-tuned rather than a mis-built
          or damaged circuit, which is why brain MRI is characteristically unremarkable and why - in the
          absence of any distinguishing feature - molecular testing rather than clinical recognition is
          the only route to a specific diagnosis. The class is conventionally described as static and
          non-progressive, with developmental regression arguing against the diagnosis; note that none
          of the evidence cited on this node speaks to temporal course, so the staticity claim rests on
          clinical convention rather than on a source quoted here.'
        locations:
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: MRI analysis showed no gross defects in brain development.
        supports: SUPPORT
