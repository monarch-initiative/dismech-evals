            term:
              id: MONDO:0019181
              label: non-syndromic X-linked intellectual disability
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: syndromic_nonsyndromic_boundary_stability
        kind: KNOWLEDGE_GAP
        prompt: Is "non-syndromic" a stable property of a gene, or an artefact of limited phenotyping
          and allele sampling?
        attaches_to:
        - pathophysiology#Static Cognitive Impairment Without Structural Brain Malformation
        rationale: 'The class boundary moves in both directions and is explicitly described in the authoritative
          update as blurred, sometimes arbitrary, and difficult to defend biologically - retained mainly
          for historical continuity. IL1RAPL1 was reported as causing cognitive impairment only, but later
          families showed behavioural problems and mild dysmorphism. ARX shows the converse within a single
          gene: polyalanine expansions give a non-syndromic phenotype across nine numbered IDX families
          while other alleles cause lissencephaly with abnormal genitalia, Partington, West, and Ohtahara
          syndromes. Twenty-eight IDX genes are also associated with XLID syndromes. Whether a given gene
          stays in this class therefore depends on how many patients have been phenotyped, how deeply,
          and which alleles they carry - not on a fixed biological property. This matters for the KB because
          membership of this entry is provisional for several subtypes, and it is the reason FGD1, ZDHHC9,
          and OPHN1, which are named in older non-syndromic gene lists but map to explicitly syndromic
          MONDO entities, are excluded here.'
      selected_evidence:
        snippet: Even though the line dividing the two classes is blurred, sometimes arbitrary and difficult
          to defend from a biological standpoint, it has by now acquired quasi-historical value and deserves
          to be retained.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29696803
      reference_title: X-linked intellectual disability update 2017.
      evidence_source: HUMAN_CLINICAL
      explanation: The authoritative statement that the syndromic/non-syndromic distinction is retained
        for historical rather than biological reasons - the core of this knowledge gap.
