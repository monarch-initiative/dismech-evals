                label: intellectual disability, X-linked 72
            genes:
            - preferred_term: RAB39B
              term:
                id: hgnc:16499
                label: RAB39B
            description: 'Null alleles of RAB39B, a neuronal-specific small GTPase of the Golgi compartment,
              identified in two male patients - one of them in the MRX72 family, where a 5'' splice-site
              change abolished normal splicing. Its downregulation alters neurite growth cone number and
              morphology and reduces presynaptic boutons, placing the subtype in the vesicular trafficking
              theme. Intellectual disability was accompanied by autism spectrum disorder, epileptic seizures
              and macrocephaly in some, not all, affected family members, which is the variable-comorbidity
              pattern this class tolerates rather than a reproducible syndromic signature. The row carries
              a live caveat: the ClinGen Intellectual Disability and Autism Gene Curation Expert Panel
              curates RAB39B as Definitive against an early-onset parkinsonism-intellectual disability
              syndrome (MONDO:0010709), a separate MONDO term with no dismech entry, rather than against
              this one. Parkinsonism is not reported in the founding MRX72 publication, so the two entities
              are separated here by phenotype and age of onset rather than by allele, and this row should
              not be read as covering the parkinsonism entity.'
          role: subtype
      assertion_type: Genetic
      assertion:
        name: RAB39B
        gene_term:
          preferred_term: RAB39B
          term:
            id: hgnc:16499
            label: RAB39B
        relationship_type: CAUSATIVE
        subtype: MRX72
        notes: A neuronal-specific small GTPase of the RAB family localised to the Golgi compartment.
          Null alleles - a near-start stop codon in one family and a 5' splice-site change in the MRX72
          family - produce no protein, and downregulation reduces presynaptic boutons and disturbs neurite
          growth cones. The same gene is curated by ClinGen against an early-onset parkinsonism-intellectual
          disability syndrome (MONDO:0010709), a separate entity that is not curated here.
      selected_evidence:
        snippet: One mutation in family X (D-23) introduced a stop codon seven amino acids after the start
          codon (c.21C > A; p.Y7X). A second mutation, in the MRX72 family, altered the 5' splice site
          (c.215+1G > A) and normal splicing. Neither instance produced a protein.
        supports: SUPPORT
