            label: USP27X
        description: USP27X, encoding ubiquitin-specific peptidase 27, was identified in the same X-exome
          screen of 405 unresolved families as KLHL15 and FRMPD4, with a second unrelated family carrying
          a missense variant substituting a highly conserved tryptophan. The gene's function in neurons
          is largely uncharacterised - its only known interaction partner is USP22, required for glial
          and neuronal development in flies - so this subtype currently has a gene assignment without
          a worked-out mechanism, and the entry wires it to the class's shared convergent node rather
          than to a specific pathway. The ClinGen Intellectual Disability and Autism Gene Curation Expert
          Panel classifies USP27X as Moderate against "X-linked complex neurodevelopmental disorder".
