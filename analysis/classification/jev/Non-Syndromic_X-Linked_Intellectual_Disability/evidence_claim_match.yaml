        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hemizygous Male Expression of the Mutant Allele
        biological_scale: CELLULAR
        description: Males carry one X chromosome, so a loss-of-function allele is expressed in every
          cell with no second copy to buffer it. Heterozygous females are mosaic, because random X-chromosome
          inactivation silences one X per cell, so the mutant allele is expressed in only a subset of
          cells; such carriers are typically unaffected or mildly affected, and in several subtypes completely
          skewed X-inactivation silences the mutant X entirely. This dosage asymmetry is the mechanistic
          basis of the male excess observed among people with intellectual disability, and the mosaicism
          is the principal obstacle to studying the circuit pathophysiology in females.
      selected_evidence:
        snippet: Because of the unbalanced sex ratio (1.3-1.4 to 1) observed in intellectual disability
          (ID) and the identification of large ID-affected families showing X-linked segregation, much
          attention has been focused on the genetics of X-linked ID (XLID).
        supports: SUPPORT
