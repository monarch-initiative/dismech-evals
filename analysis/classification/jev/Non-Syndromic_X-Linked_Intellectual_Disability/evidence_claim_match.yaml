                label: IQSEC2
            description: 'The founding entity of the whole numbered series: MRX1 is the family mapped
              in 1988 that gave the series its first number, and its causal gene was not identified until
              X-chromosome exome resequencing reached it in 2010. IQSEC2 encodes a guanine nucleotide
              exchange factor for the ADP-ribosylation factor family of small GTPases, placing this subtype
              in the same small-GTPase-signalling theme as PAK3 and RAB39B rather than in a pathway of
              its own. Three further X-linked intellectual disability families carried IQSEC2 variants
              in the same study. Two cautions apply to this row. First, MONDO merges the former MRX78
              into this term and carries "IQSEC2-related syndromic intellectual disability" among its
              exact synonyms, so the label under which a given patient is reported varies. Second, the
              allelic spectrum reaches well beyond pure intellectual disability - the ClinGen Intellectual
              Disability and Autism Gene Curation Expert Panel curates IQSEC2 against "X-linked complex
              neurodevelopmental disorder" rather than against this class. This row records the non-syndromic
              arm that OMIM and MONDO still number as XLID1, exactly as the ARX row records one arm of
              a wider allelic series.'
          role: subtype
      assertion_type: Genetic
      assertion:
        name: IQSEC2
        gene_term:
          preferred_term: IQSEC2
          term:
            id: hgnc:29059
            label: IQSEC2
        relationship_type: CAUSATIVE
        subtype: MRX1
        notes: IQ motif and Sec7 domain ArfGEF 2, a guanine nucleotide exchange factor for the ADP-ribosylation
          factor family of small GTPases. It is the causal gene of MRX1, the index family of the numbered
          series, found by systematic X-chromosome exome resequencing more than two decades after that
          family was mapped. The allelic spectrum reaches beyond isolated intellectual disability - MONDO
          carries "IQSEC2-related syndromic intellectual disability" among this term's exact synonyms
          - and those presentations are not curated here.
      selected_evidence:
        snippet: The first family identified as having a nonsyndromic intellectual disability was mapped
          in 1988. Here we show that a mutation of IQSEC2, encoding a guanine nucleotide exchange factor
          for the ADP-ribosylation factor family of small GTPases, caused this disorder.
