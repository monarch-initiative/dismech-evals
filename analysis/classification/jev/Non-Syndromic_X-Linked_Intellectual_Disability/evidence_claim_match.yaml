        name: Fragile X (FMR1) repeat testing
        description: 'Sizing of the FMR1 CGG trinucleotide repeat, performed before or alongside sequencing.
          It is separated from the sequencing entry below because it is a mechanically distinct assay:
          a repeat expansion is not reliably called by exome or panel sequencing, so a normal sequencing
          result does not exclude fragile X syndrome. Fragile X is the most common single XLID entity,
          and excluding it is the conventional first step in a male with intellectual disability and a
          suggestive X-linked family history - in the Basque targeted-panel cohort, every one of the 61
          patients had already been referred for FMR1 testing and shown a normal repeat number before
          enrolment.'
        diagnosis_term:
          preferred_term: Molecular Analysis
          term:
            id: NCIT:C19770
            label: Molecular Analysis
