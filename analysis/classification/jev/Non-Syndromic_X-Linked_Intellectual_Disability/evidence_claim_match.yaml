        description: Protein-altering variants in ZMYM3, a transcriptional coregulator and component of
          the KDM1A-RCOR1 chromatin-modifying complex, in a MatchMaker Exchange cohort of 27 individuals
          - the largest cohort behind any row in this entry. Almost all variants are missense, several
          recurring at the same two residues, and a ChIP-seq experiment on one of them shows dramatically
          reduced genomic occupancy consistent with a hypomorphic effect. This places the subtype in the
          transcriptional-control theme alongside ARX and ZNF711 rather than at the synapse. The reported
          phenotype includes developmental delay, intellectual disability and behavioural abnormalities,
          with a specific facial gestalt in a subset of males only; the authors state that they cannot
          perform statistical evaluations to definitively support causation and rest the case on the totality
          of the evidence, and ZMYM3 has no ClinGen gene-disease validity curation.
