              term:
                id: hgnc:13128
                label: ZNF711
            description: ZNF711 was implicated by the same 208-family X-chromosome resequencing screen
              that reported SYP, and was subsequently confirmed in two large four-generation pedigrees
              with eleven affected males, bringing the total to four families. The consistent picture
              is mild to moderate intellectual disability with poor speech; autistic features and mild
              facial dysmorphisms occur in some patients but not reproducibly, which is why the reporting
              authors themselves conclude the phenotype is non-syndromic. Note that this subtype is distinct
              from contiguous-gene deletions at Xq21 that remove ZNF711 along with neighbouring genes,
              which dismech models elsewhere as Choroideremia-Deafness-Obesity_Syndrome.
          role: subtype
      assertion_type: Genetic
      assertion:
        name: ZNF711
        gene_term:
          preferred_term: ZNF711
          term:
            id: hgnc:13128
            label: ZNF711
        relationship_type: CAUSATIVE
        subtype: MRX97
        notes: ZNF711, a chromatin-associated transcription factor that interacts with the X-linked intellectual
          disability protein PHF8 and binds a subset of PHF8 target genes. Implicated by the 208-family
          X-chromosome resequencing screen and confirmed in two large four-generation pedigrees. Affected
          males have mild to moderate intellectual disability with poor speech; autistic features and
          mild facial dysmorphism occur in some but not all patients.
      selected_evidence:
        snippet: Furthermore, PHF8 interacts with another XMLR protein, ZNF711, which binds to a subset
          of PHF8 target genes, including the XLMR gene JARID1C.
        supports: SUPPORT
