          in all affected males and obligate carriers and absent from unaffected males and from 200 population
          controls. The variant abolishes the function of the protein's COS domain, and the mutant protein
          accumulates in the cytoplasm instead of binding the cytoskeleton. This row rests on a single
          large pedigree plus one further variant found by screening 480 unrelated individuals, and MID2
          has no ClinGen gene-disease validity curation, so the assignment is thinner than most in this
          entry and is recorded with that caveat. It is the ubiquitin-pathway theme's entry point in the
          class, and the authors emphasise that the MID2 phenotype differs from that reported for its
          paralogue MID1.
      selected_evidence:
        snippet: We report a novel missense mutation (c.1040G>A, p.Arg347Gln) in MID2, which encodes ubiquitin
          ligase E3, as the likely cause of X-linked mental retardation in a large kindred.
