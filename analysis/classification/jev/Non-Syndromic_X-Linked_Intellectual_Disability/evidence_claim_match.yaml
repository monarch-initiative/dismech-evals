              This row rests on a single large pedigree plus one further variant found by screening 480
              unrelated individuals, and MID2 has no ClinGen gene-disease validity curation, so the assignment
              is thinner than most in this entry and is recorded with that caveat. It is the ubiquitin-pathway
              theme's entry point in the class, and the authors emphasise that the MID2 phenotype differs
              from that reported for its paralogue MID1.
