        discussion_id: questioned_xlid_gene_assignments
        kind: KNOWLEDGE_GAP
        prompt: Which of the genes historically assigned to non-syndromic X-linked intellectual disability
          are genuinely causal, given that many were nominated from small families before large population
          control sets were available?
        attaches_to:
        - pathophysiology#X-Linked Gene Disruption
        rationale: 'Gene lists for this class carry an unusual historical liability. Genes were nominated
          by linkage in individual families at a time when systematic sequencing of control X chromosomes
          was not possible, so rare non-disease-causing variants could not be excluded. When 106 proposed
          XLID genes were reassessed against 10,563 control X chromosomes from the NHLBI Exome Sequencing
          Project, ten were specifically questioned because truncating or previously published variants
          occurred at appreciable frequency in controls, and a further fifteen were flagged as requiring
          replication. The 2017 authoritative update revisited those 25 challenged genes: none of the
          five highly questionable assignments has been confirmed, only ATP6AP2 of the five questionable
          ones has been confirmed, and additional cases have been published for seven of the fifteen needing
          replication - leaving 17 of the 25 still unresolved. This directly affects curation of this
          entry: AGTR2 in particular is frequently cited in older reviews as a non-syndromic XLID gene
          and is among the questioned set, so it is deliberately not modelled as a subtype here. Any gene
          list for this class drawn from literature predating the reassessment should be treated as provisional.'
