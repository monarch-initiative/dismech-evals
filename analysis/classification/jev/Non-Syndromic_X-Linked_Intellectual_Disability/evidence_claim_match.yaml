  da9c8e0807400c5ba3151d05c40294b152994bee3531608ad4f90b18f269d303:
    claim:
      about:
        disease:
          name: Non-Syndromic X-Linked Intellectual Disability
          disease_term:
            preferred_term: non-syndromic X-linked intellectual disability
            term:
              id: MONDO:0019181
              label: non-syndromic X-linked intellectual disability
        context:
        - path: /has_subtypes/17
          value:
            name: MRX104
            display_name: Intellectual disability, X-linked 104 (FRMPD4)
            classification: molecular
            subtype_term:
              preferred_term: intellectual disability, X-linked 104
              term:
                id: MONDO:0010509
                label: intellectual disability, X-linked 104
            genes:
            - preferred_term: FRMPD4
              term:
                id: hgnc:29007
                label: FRMPD4
            description: 'Deleterious FRMPD4 variants - an exon deletion, a nonsense change, a frameshift
              and a conserved-residue missense - in ten affected males from four unrelated families. FRMPD4
              is a neural scaffolding protein that binds PSD-95 to promote dendritic spine morphogenesis
              and regulates mGluR1/5 signalling through Homer, so this subtype sits at the postsynaptic
              scaffold alongside DLG3. The frameshift allele disrupts binding to both PSD-95 and HOMER1
              and fails to increase spine density in transfected hippocampal neurons, and knockout mice
              show hippocampus-dependent spatial learning deficits. Two qualifications belong on this
              row: the reporting authors describe the entity as a new X-linked intellectual disability
              syndrome, with language delay, seizures and behavioural or psychiatric disturbance alongside
              moderate-to-severe intellectual disability, and the ClinGen Intellectual Disability and
              Autism Gene Curation Expert Panel curates FRMPD4 as Definitive against "X-linked complex
              neurodevelopmental disorder" rather than against this class. OMIM and MONDO nonetheless
              number the entity within the non-syndromic series, and it is recorded here on that basis
              with the comorbidity stated rather than suppressed. A third point matters for the evidence
              audit this entry runs on itself: of the fourteen genes admitted in this enumeration pass,
              FRMPD4 is the only one named in either list that the 2013 reassessment against 10,563 control
              X chromosomes singles out, and it falls in the fifteen for which replication studies were
              warranted rather than in the ten whose involvement was questioned. Both reports cited on
              this row postdate that flag and supply the independent families it asked for.'
          role: subtype
      assertion_type: Genetic
      assertion:
        name: FRMPD4
        gene_term:
          preferred_term: FRMPD4
          term:
            id: hgnc:29007
            label: FRMPD4
        relationship_type: CAUSATIVE
        subtype: MRX104
        notes: FERM and PDZ domain containing 4, a neural scaffolding protein that interacts with PSD-95
          to promote dendritic spine morphogenesis and with mGluR1/5 and Homer to regulate mGluR1/5 signalling.
          Deleterious alleles include an exon deletion, a nonsense change, a frameshift and a conserved-residue
          missense variant.
      selected_evidence:
        snippet: Mutations include deletion of an entire coding exon, a nonsense mutation, a frame-shift
          mutation resulting in premature termination of translation, and a missense mutation involving
          a highly conserved amino acid residue neighboring FRMPD4-FERM domain.
        supports: SUPPORT
    origin:
