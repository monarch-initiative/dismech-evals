        context: []
      assertion_type: Subtype
      assertion:
        name: MRX72
        display_name: Intellectual disability, X-linked 72 (RAB39B)
        classification: molecular
        subtype_term:
          preferred_term: intellectual disability, X-linked 72
          term:
            id: MONDO:0010289
            label: intellectual disability, X-linked 72
        genes:
        - preferred_term: RAB39B
          term:
            id: hgnc:16499
            label: RAB39B
        description: 'Null alleles of RAB39B, a neuronal-specific small GTPase of the Golgi compartment,
          identified in two male patients - one of them in the MRX72 family, where a 5'' splice-site change
          abolished normal splicing. Its downregulation alters neurite growth cone number and morphology
          and reduces presynaptic boutons, placing the subtype in the vesicular trafficking theme. Intellectual
          disability was accompanied by autism spectrum disorder, epileptic seizures and macrocephaly
          in some, not all, affected family members, which is the variable-comorbidity pattern this class
          tolerates rather than a reproducible syndromic signature. The row carries a live caveat: the
          ClinGen Intellectual Disability and Autism Gene Curation Expert Panel curates RAB39B as Definitive
          against an early-onset parkinsonism-intellectual disability syndrome (MONDO:0010709), a separate
          MONDO term with no dismech entry, rather than against this one. Parkinsonism is not reported
          in the founding MRX72 publication, so the two entities are separated here by phenotype and age
          of onset rather than by allele, and this row should not be read as covering the parkinsonism
          entity.'
      selected_evidence:
        snippet: Its downregulation leads to an alteration in the number and morphology of neurite growth
          cones and a significant reduction in presynaptic buttons, suggesting that RAB39B is required
          for synapse formation and maintenance.
        supports: SUPPORT
