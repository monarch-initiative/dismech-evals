        context: []
      assertion_type: Subtype
      assertion:
        name: MRX90
        display_name: Intellectual disability, X-linked 90 (DLG3)
        classification: molecular
        subtype_term:
          preferred_term: intellectual disability, X-linked 90
          term:
            id: MONDO:0010452
            label: intellectual disability, X-linked 90
        genes:
        - preferred_term: DLG3
          term:
            id: hgnc:2902
            label: DLG3
        description: Truncating variants in DLG3, which encodes synapse-associated protein 102 (SAP102),
          found in 4 of 329 families screened for moderate to severe X-linked intellectual disability
          - among the higher per-gene yields in the class. SAP102 is a membrane-associated guanylate kinase
          localised to the postsynaptic density of excitatory synapses, whose PDZ domains bind the NR2
          subunits of the NMDA receptor. Every reported allele truncates within or before the third PDZ
          domain, so the proposed mechanism is loss of NMDA receptor targeting and downstream signalling,
          which is the most direct molecular route to the impaired synaptic plasticity this entry models
          as the shared endpoint. Together with SYP this is one of only two genes in the whole checklist
          that the ClinGen Intellectual Disability and Autism Gene Curation Expert Panel curates against
          this entry's own MONDO term rather than against a broader neurodevelopmental anchor, and it
          holds the Definitive classification.
      selected_evidence:
        snippet: The mutations identified in this study all introduce premature stop codons within or
          before the third PDZ domain, and it is likely that this impairs the ability of SAP102 to interact
          with the NMDA receptor and/or other proteins involved in downstream NMDA receptor signaling
          pathways.
        supports: SUPPORT
