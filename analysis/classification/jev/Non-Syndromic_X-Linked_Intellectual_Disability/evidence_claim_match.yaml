      assertion:
        name: Impaired Synaptic Plasticity in Learning and Memory Circuits
        biological_scale: TISSUE
        description: The convergent synaptic lesion degrades activity-dependent plasticity in the hippocampal
          and cortical circuits that support learning and memory. Several causal genes are selectively
          or highly expressed in exactly these structures - IL1RAPL1 in the postnatal hippocampal memory
          system, PAK3 in postmitotic neurons of developing and postnatal cerebral cortex and hippocampus,
          TSPAN7 in cerebral cortex and hippocampus - which is the anatomical reason a diffuse molecular
          lesion produces a circumscribed cognitive phenotype.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        locations:
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
        - preferred_term: hippocampus
          term:
            id: UBERON:0002421
            label: hippocampal formation
        biological_processes:
        - preferred_term: regulation of synaptic plasticity
          term:
            id: GO:0048167
            label: regulation of synaptic plasticity
          modifier: DECREASED
        - preferred_term: dendritic spine morphogenesis
          term:
            id: GO:0060997
            label: dendritic spine morphogenesis
          modifier: DECREASED
      selected_evidence:
        snippet: Immunofluorescence analysis showed that PAK3 protein is highly expressed in postmitotic
          neurons of the developing and postnatal cerebral cortex and hippocampus.
        supports: SUPPORT
