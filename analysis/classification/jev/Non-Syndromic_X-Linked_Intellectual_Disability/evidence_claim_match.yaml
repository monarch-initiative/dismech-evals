              The mechanism is translational rather than coding: the variant reduces FGF13 translation
              by weakening the interaction between the 5'' UTR and polypyrimidine-tract-binding protein
              2, and FGF13 protein stabilises microtubules in developing neurons. Mice carrying the homologous
              point mutation show delayed neuronal migration during cortical development and weakened
              learning and memory. This row rests on one report of three male children plus its mouse
              model, with no ClinGen gene-disease validity curation and no independent replicating family
              found by a PubMed title search on FGF13 combined with intellectual disability, mental retardation
              or neurodevelopmental (run 2026-09-23), which returns this report alone. It is therefore
              the thinnest gene assignment admitted to the entry and should be revisited when a second
              cohort is published.'
