      assertion_type: Discussion
      assertion:
        discussion_id: nonsyndromic_xlid_group_level_prevalence
        kind: KNOWLEDGE_GAP
        prompt: What is the population prevalence of non-syndromic X-linked intellectual disability as
          distinct from X-linked intellectual disability as a whole?
        attaches_to:
        - pathophysiology#X-Linked Gene Disruption
        rationale: The prevalence figures recorded on this entry - approximately 1 in 600 males, and 5-10%
          of intellectual disability in males - are for X-linked intellectual disability overall, syndromic
          and non-syndromic combined. No robust population prevalence or incidence exists for the non-syndromic
          class alone, because it aggregates many individually rare gene-defined disorders whose ascertainment
          has historically depended on the availability of large multiplex pedigrees. This is a genuine
          measurement gap rather than a curation omission, and the recorded rates should not be presented
          as if MONDO:0019181 were a uniform entity with its own prevalence.
        proposed_experiments:
        - experiment_id: population_scale_nsxlid_prevalence
          name: Population-scale sequencing estimate of non-syndromic XLID prevalence
          description: Estimate class prevalence from unselected population-scale exome or genome cohorts
            with linked phenotype data, ascertaining on validated causal variants in confirmed non-syndromic
            XLID genes rather than on pedigree structure, which avoids the multiplex-family ascertainment
            bias that inflates familial forms.
      selected_evidence:
        snippet: X-linked forms of mental retardation (MR) affect approximately 1 in 600 males and are
          likely to be highly heterogeneous.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
