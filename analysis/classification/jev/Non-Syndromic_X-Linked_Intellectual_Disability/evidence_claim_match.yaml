          FRMPD4 and USP27X in this entry. A protein-truncating variant was found in a large family, with
          further support from an unrelated family carrying a partial KLHL15 deletion. KLHL15 is a kelch-like
          protein that acts as a substrate adaptor for Cul3-based E3 ubiquitin ligases, targeting a brain-specific
          regulatory subunit of protein phosphatase 2A for proteasomal degradation, so like MID2 and USP27X
          it belongs to the ubiquitin-proteasome theme. The phenotype is not uniformly pure: the same
          report notes a KLHL15 partial deletion described in a proband with severe intellectual disability,
          epilepsy and cortical developmental anomalies, and KLHL15 has no ClinGen gene-disease validity
          curation.'
