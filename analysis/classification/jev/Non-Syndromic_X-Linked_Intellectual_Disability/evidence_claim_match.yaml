      assertion_type: Inheritance
      assertion:
        name: X-linked
        description: Causal variants lie on the X chromosome. Hemizygous males carry a single copy of
          the mutant allele with no second copy to compensate and are fully affected; heterozygous females
          are usually unaffected or only mildly affected, because random X-chromosome inactivation makes
          them mosaic for expression of the mutant allele. In several subtypes carrier females show completely
          skewed X-inactivation that silences the mutant X and confers additional protection. There is
          no male-to-male transmission. Large multiplex pedigrees showing this segregation pattern were
          the substrate for the linkage studies that defined the numbered MRX/IDX series, and the relative
          ease of ascertaining such families is why X-linked intellectual disability was delineated far
          ahead of its autosomal counterparts.
        inheritance_term:
          preferred_term: X-linked inheritance
          term:
            id: HP:0001417
            label: X-linked inheritance
        expressivity: VARIABLE
      selected_evidence:
        snippet: All carrier females with either point mutations or genomic deletions in FACL4 showed
          a completely skewed X-inactivation, suggesting that the gene influences survival advantage.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/1
      context_paths:
