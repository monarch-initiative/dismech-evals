            label: SLC9A7
        description: 'A recurrent missense variant (p.Leu515Phe) in the alkali cation/proton exchanger
          SLC9A7, segregating with multigenerational non-syndromic intellectual disability in two unrelated
          families. SLC9A7 resides in the trans-Golgi network and post-Golgi vesicles; the mutant protein
          is correctly targeted but alkalinises those compartments and impairs N-linked oligosaccharide
          maturation of exported cargo, which the authors read as a gain of function. Unusually for a
          class defined by the absence of biochemical features, it comes with a laboratory readout: patient
          sera show an abnormal transferrin N-glycosylation profile, the standard diagnostic marker for
          congenital disorders of glycosylation. SLC9A7 has no ClinGen gene-disease validity curation.'
      selected_evidence:
        snippet: We report two unrelated families with multigenerational nonsyndromic intellectual disability
          (ID) segregating with a recurrent de novo missense variant (c.1543C>T:p.Leu515Phe) in the alkali
          cation/proton exchanger gene SLC9A7 (also commonly referred to as NHE7).
        supports: SUPPORT
