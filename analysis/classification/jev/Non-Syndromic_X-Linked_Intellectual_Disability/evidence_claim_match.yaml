        biological_scale: CELLULAR
        description: 'Although the causal genes do not share a single pathway, their products fall repeatedly
          into a limited set of themes that converge on the same functional endpoint: Rho GTPase signalling
          to the actin cytoskeleton (PAK3), Rab-dependent synaptic vesicle recycling (GDI1), proposed
          roles in excitatory synapse formation and neurite outgrowth (IL1RAPL1, TSPAN7 - both inferred
          rather than directly demonstrated in the cited reports), tRNA anticodon-loop modification and
          translational fidelity (FTSJ1), fatty-acid metabolism (ACSL4), Golgi/trans-Golgi-network pH
          regulation and glycosylation (SLC9A7), transcriptional activation (AFF2, silenced by the FRAXE
          repeat expansion), and telencephalic transcriptional control (ARX). Most of these arms act on
          synapse formation, maintenance, and plasticity, and synaptic convergence is the field''s dominant
          framing of the class. It is not, however, established for all of them: the tRNA-modification
          (FTSJ1), fatty-acid (ACSL4), Golgi-pH (SLC9A7), and transcriptional (AFF2) arms have documented
          molecular and cellular consequences but no cited evidence of a synaptic endpoint, so the node
          is deliberately named for neuronal rather than synaptic function. What is shared across every
          arm is that convergence happens at the level of neuronal cell biology rather than through a
          common molecular pathway - which is why no single pathway-directed therapy addresses the class.
          Enumerating the rest of the numbered series adds further themes without disturbing that conclusion:
          postsynaptic scaffolding at the NMDA receptor and the dendritic spine (DLG3, FRMPD4), synaptic
          vesicle clustering, mobility and cargo retrieval (SYN1, SYP), presynaptic terminal formation
          and maintenance from the Golgi (RAB39B), ubiquitin-proteasome substrate handling (MID2, KLHL15,
          USP27X), chromatin and transcriptional coregulation (ZNF711, ZMYM3), Arf-family guanine-nucleotide
          exchange (IQSEC2), serine-threonine kinase signalling (RPS6KA3) and microtubule stabilisation
          in developing neurons (FGF13). The ubiquitin arm is the clearest illustration that convergence
          here is thematic rather than directional: MID2 and KLHL15 are ubiquitin-ligase pathway components
          whose loss impairs degradation of specific substrates, whereas USP27X is a deubiquitinase, so
          the arm has no single direction and its process annotation deliberately carries no modifier.
          USP27X is also the one gene admitted here with essentially no characterised neuronal function,
          so for that arm this node records convergence without a mechanism.'
