            term:
              id: MONDO:0019181
              label: non-syndromic X-linked intellectual disability
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing (exome or genome sequencing)
        description: 'Because affected individuals have no distinguishing clinical features, a specific
          diagnosis cannot be reached by examination and requires parallel molecular testing of all known
          intellectual-disability genes. The contemporary workup is clinical evaluation with a family
          pedigree, fragile X (FMR1) testing (recorded as its own entry above), chromosomal microarray,
          and exome or genome sequencing with segregation analysis; of these, only fragile X exclusion
          and panel sequencing with segregation are covered by the evidence cited here, the remainder
          - chromosomal microarray in particular - reflecting standard practice. Targeted XLID panels
          retain a role in pedigrees with suggestive X-linked family history: in one cohort of 61 unrelated
          males with suggestive non-syndromic XLID and negative fragile X testing, an 82-gene panel identified
          17 candidate variants in 16 patients.'
        diagnosis_term:
          preferred_term: Genetic Testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: Thus, this family not only broadens the spectrum of GDI1 mutations but also emphasizes
          the need for parallel testing of all known genes associated with ID in patients with an unspecific
          phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
