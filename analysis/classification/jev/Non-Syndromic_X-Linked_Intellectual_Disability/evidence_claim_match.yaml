            label: intellectual disability, X-linked 97
        genes:
        - preferred_term: ZNF711
          term:
            id: hgnc:13128
            label: ZNF711
        description: ZNF711 was implicated by the same 208-family X-chromosome resequencing screen that
          reported SYP, and was subsequently confirmed in two large four-generation pedigrees with eleven
          affected males, bringing the total to four families. The consistent picture is mild to moderate
          intellectual disability with poor speech; autistic features and mild facial dysmorphisms occur
          in some patients but not reproducibly, which is why the reporting authors themselves conclude
          the phenotype is non-syndromic. Note that this subtype is distinct from contiguous-gene deletions
          at Xq21 that remove ZNF711 along with neighbouring genes, which dismech models elsewhere as
          Choroideremia-Deafness-Obesity_Syndrome.
      selected_evidence:
        snippet: Here, we present two large four-generation families with a total of 11 males affected
          with ID caused by mutations in ZNF711, thereby expanding the total number of families with ID
          and a ZNF711 mutation to four.
        supports: SUPPORT
