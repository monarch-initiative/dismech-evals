          preferred_term: intellectual disability, X-linked 21
          term:
            id: MONDO:0010256
            label: intellectual disability, X-linked 21
        genes:
        - preferred_term: IL1RAPL1
          term:
            id: hgnc:5996
            label: IL1RAPL1
        description: Deletions and loss-of-function point variants in IL1RAPL1 at Xp22.1-21.3, encoding
          an interleukin-1 receptor accessory protein family member highly expressed in postnatal hippocampus.
          The founding report explicitly describes patients with cognitive impairment only, one of the
          clearest original descriptions in the class - though see the caveat below on later families.
          IL1RAPL1 is understood to act in excitatory synapse formation, though the cited primary report
          establishes only its hippocampal expression and infers a role in memory and learning. Later
          series identified behavioural problems and mild dysmorphism in some families, illustrating the
          instability of the non-syndromic label.
      selected_evidence:
        snippet: Non-overlapping deletions and a nonsense mutation in this gene were identified in patients
          with cognitive impairment only.
        supports: SUPPORT
