              - among the higher per-gene yields in the class. SAP102 is a membrane-associated guanylate
              kinase localised to the postsynaptic density of excitatory synapses, whose PDZ domains bind
              the NR2 subunits of the NMDA receptor. Every reported allele truncates within or before
              the third PDZ domain, so the proposed mechanism is loss of NMDA receptor targeting and downstream
              signalling, which is the most direct molecular route to the impaired synaptic plasticity
              this entry models as the shared endpoint. Together with SYP this is one of only two genes
