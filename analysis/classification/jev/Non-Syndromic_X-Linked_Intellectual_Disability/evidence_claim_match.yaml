          cells; such carriers are typically unaffected or mildly affected, and in several subtypes completely
          skewed X-inactivation silences the mutant X entirely. This dosage asymmetry is the mechanistic
          basis of the male excess observed among people with intellectual disability, and the mosaicism
          is the principal obstacle to studying the circuit pathophysiology in females.
      selected_evidence:
        snippet: This mosaic expression produces substantial complexity, especially when attempting to
          study the already complicated neural circuits that underly behavior, thus impeding the understanding
          of disease-related pathophysiology and the development of therapeutics.
        supports: SUPPORT
