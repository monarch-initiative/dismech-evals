      assertion_type: Prevalence
      assertion:
        population: Apparently healthy adults on Crete (778 medical-school and hospital employees and
          their families, aged 15-79)
        measure_type: POINT_PREVALENCE
        prevalence_class: ABOVE_1_IN_1000
        rate_per_100000: 8230.0
        rate_denominator: POPULATION
        notes: 'An earlier revision of this entry stated that no prevalence estimate exists. That was
          wrong: the group whose referral cohorts this entry''s pathophysiology is built on also screened
          a non-patient population, and 8.23 per cent of it met their diagnostic criteria. The figure
          needs reading carefully rather than discounting. The sample was not randomly selected - the
          authors say so themselves - it is one island and one occupational group, and the criteria are
          the department''s own rather than a consensus definition. More important for interpretation:
          none of the 64 had severe neutropenia, 6.81 per cent were mild and 1.41 per cent moderate, so
          what is 8.23 per cent common is a screen-detected laboratory phenotype, not the clinically significant
          disease that reaches a haematology clinic. That distinction is why no qualitative RARE/COMMON
          tier is recorded alongside the rate. The published clinical cohorts - 132 patients in the cytokine
          study, 131 in the prospective natural-history study, 37 in the telomere study - remain referral-based
          and give no denominator of their own. And the reference range for a normal neutrophil count
          differs by ancestry, so the threshold that produced this figure would not produce it everywhere.'
      selected_evidence:
        snippet: Among these there were 64 subjects (8.23%) who fulfilled the diagnostic criteria of CINA
          applied in our department.
        supports: SUPPORT
