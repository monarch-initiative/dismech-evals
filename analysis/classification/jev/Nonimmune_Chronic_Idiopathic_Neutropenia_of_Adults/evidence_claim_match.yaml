        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gfi1_relevance_to_the_adult_entity
        kind: KNOWLEDGE_GAP
        prompt: Does GFI1 belong on this disease at all?
        attaches_to:
        - genetic#GFI1
        rationale: 'OMIM attaches GFI1 to this concept and the curation stub inherited that association,
          but the primary report describes a congenital phenotype ascertained as ELANE-negative severe
          congenital neutropenia, with immunodeficient lymphocytes and circulating immature myeloid cells,
          acting by derepression of ELANE. None of that is the acquired adult disease whose mechanism
          the rest of this entry describes, and no GFI1 variant has been reported in a patient meeting
          the acquired-CIN definition. The gene is recorded with relationship_type SUSCEPTIBILITY and
          a note saying this, rather than being silently dropped or silently promoted to CAUSATIVE. Resolving
          it probably requires someone to decide whether the MONDO concept is the OMIM concept.

          A 2025 exome study of 25 non-remitting-neutropenia and adult-CIN patients is the first direct
          evidence on the question, and it points away from GFI1. The variants it retrieved sit in immune-regulation
          and autoimmunity genes, not in the myeloid differentiation programme GFI1 belongs to, and the
          paediatric and adult groups shared no genes with each other. That is the genetic shape this
          entry''s pathophysiology predicts, since the lesion it models is a T-cell-and-cytokine marrow
          microenvironment rather than a granulocyte differentiation block. It is 25 subjects with no
          replication cohort, so it is cited as a directional result rather than as a gene list, and no
          gene from it is added to the genetic section.'
      selected_evidence:
        snippet: the products of expression by the variants involved belong to the autoimmunity and immune
          regulation pathways (i.e., SPINK5, PTPN22 and PSMB9)
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
