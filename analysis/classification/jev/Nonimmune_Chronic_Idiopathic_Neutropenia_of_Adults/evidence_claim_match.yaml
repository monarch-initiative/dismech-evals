      assertion_type: Discussion
      assertion:
        discussion_id: nonimmune_boundary_with_autoimmune_neutropenia
        kind: KNOWLEDGE_GAP
        prompt: Is nonimmune chronic idiopathic neutropenia of adults separable from autoimmune neutropenia,
          and does the "nonimmune" qualifier still describe anything?
        attaches_to:
        - disease#Nonimmune Chronic Idiopathic Neutropenia of Adults
        - pathophysiology#Activation and Oligoclonal Expansion of Marrow T Lymphocytes
        rationale: 'The qualifier means "not antibody-mediated" and was coined to contrast with autoimmune
          neutropenia, but the mechanism curated here is T-cell driven, so the disease is immune in every
          sense except the serological one. Meanwhile the two are hard to separate in practice: the antineutrophil
          antibody assay is of uncertain value in both children and adults, the 2017 review calls them
          very similar and overlapping conditions, and the 2024 prospective cohort enrols CIN and autoimmune
          neutropenia together and describes the whole group as an immune attack on neutrophils. This
          entry is built on the cohorts that kept the distinction, and a reader should know that the most
          recent natural-history data do not. Whether MONDO should keep a separate nonimmune term is a
          real question, not a curation quibble.

          Two numbers sharpen this, and both are quotable from references already in this entry. In the
          2024 prospective cohort 56 per cent of patients carried anti-neutrophil autoantibodies at baseline
          and 31 per cent had an autoimmune comorbidity; in the earlier review 44 per cent of the registry
          patients had some evidence of thyroid disease. A majority-seropositive cohort is not what the
          word "nonimmune" leads a reader to expect, and the figures belong in the gap rather than only
          in the reviewer''s head.'
      selected_evidence:
        snippet: At baseline, 56% had anti-neutrophil autoantibodies and 31% had autoimmune comorbidities.
        supports: SUPPORT
