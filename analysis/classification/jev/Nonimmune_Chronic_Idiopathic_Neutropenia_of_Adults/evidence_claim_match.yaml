      explanation: 'The recommendation itself, including both halves of it - no prophylactic antibiotics
        and no growth factor - which is what this treatment record claims. An earlier revision quoted
        the converse sentence ("When neutropenia is severe, treatment with G-CSF is often beneficial")
        and justified it by asserting that this sentence could not be quoted because of a superscript.
        That was wrong: the cache stores the threshold as "0.5 x 10/l" with the superscript already stripped,
        and this sub-span is an exact substring. The claim about the cache was never checked against the
        cache.'
