      assertion:
        name: Structural Lung Disease Predisposition
        description: Although exposure to NTM is nearly universal, clinical disease is uncommon, implicating
          host susceptibility. NTM lung disease develops preferentially in hosts with structural airway
          disease — non-cystic fibrosis bronchiectasis, COPD, cystic fibrosis, primary ciliary dyskinesia,
          prior TB, and pneumoconiosis — in which impaired mucociliary clearance permits the organism
          to establish and persist.
        role: predisposing_factor
        biological_scale: TISSUE
      selected_evidence:
        snippet: NTM lung disease is more prevalent in patients with structural lung disease, such as
          cystic fibrosis, non-cystic fibrosis bronchiectasis, primary ciliary dyskinesia, chronic obstructive
          pulmonary disease (COPD), previous TB, and pneumoconiosis
        supports: SUPPORT
