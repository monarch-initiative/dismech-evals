      assertion:
        name: Hypertrophic Cardiomyopathy with Outflow Tract Obstruction
        description: The organ-level lesion that distinguishes NS11 within the Noonan spectrum. Reported
          patients have shown hypertrophic cardiomyopathy far more consistently than Noonan syndrome overall,
          in which HCM affects roughly 20-30%; the MRAS cases are additionally weighted towards early
          onset, outflow tract obstruction, and poor prognosis, with deaths in the neonatal and infant
          periods. The severity is nonetheless not invariant — an adult with the recurrent p.Thr68Ile
          substitution had only mild, late-onset left ventricular hypertrophy — so obligate early severe
          HCM is not a safe inference from genotype.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: This report reinforces the high frequency of HCM among individuals harboring MRAS variants,
          contrasting to the 20% overall prevalence of this cardiac anomaly in NS.
        supports: SUPPORT
