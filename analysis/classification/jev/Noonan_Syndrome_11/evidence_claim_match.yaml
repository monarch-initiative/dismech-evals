      assertion_type: Discussion
      assertion:
        discussion_id: ns11_unexplained_musculoskeletal_and_amniotic_features
        kind: KNOWLEDGE_GAP
        prompt: By what mechanism do activating MRAS variants produce the skeletal and connective-tissue
          findings (pectus excavatum, small-joint hypermobility, broad neck) and the polyhydramnios reported
          in NS11 patients?
        rationale: Each of these findings is documented in a single reported MRAS patient. Class-level
          RASopathy explanations exist — the broad or webbed neck is classically interpreted as the residuum
          of fetal nuchal lymphedema, and Noonan polyhydramnios is often attributed to impaired fetal
          swallowing — but none of these mechanisms has been examined in an MRAS patient, and the path
          from RAS/MAPK hyperactivation to chest-wall deformity or joint laxity is not characterized for
          any RASopathy gene. The reported cohort is too small and too cardiac-dominated for these features
          to be mechanistically resolved, so no causal edge is asserted for them.
        attaches_to:
        - phenotypes#Pectus Excavatum
        - phenotypes#Small Joint Hypermobility
        - phenotypes#Broad Neck
        - phenotypes#Polyhydramnios
      selected_evidence:
