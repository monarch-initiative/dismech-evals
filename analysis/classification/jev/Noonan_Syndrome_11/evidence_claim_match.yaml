      assertion:
        name: Enhanced MRAS-SHOC2-PP1 Holophosphatase Assembly
        description: M-Ras, the leucine-rich-repeat scaffold SHOC2 and protein phosphatase 1 assemble
          into a heterotrimeric holoenzyme in which M-Ras and SHOC2 act as regulatory subunits conferring
          specificity for RAF, and M-Ras additionally acts as the membrane-targeting subunit. Noonan-causing
          substitutions in any of the three components — MRAS, SHOC2 or PPP1CB — promote assembly of this
          complex, which is the shared biochemical lesion linking NS11 to SHOC2-related and PPP1CB-related
          Noonan-spectrum disease.
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: PP1 holoenzyme serine/threonine phosphatase activity
          term:
            id: GO:0004722
            label: protein serine/threonine phosphatase activity
          modifier: INCREASED
      selected_evidence:
        snippet: The MRAS GTPase, a close relative of RAS oncoproteins, interacts with SHOC2 and protein
          phosphatase 1 (PP1) to form a heterotrimeric holoenzyme that dephosphorylates this S259 RAF
          site.
        supports: SUPPORT
