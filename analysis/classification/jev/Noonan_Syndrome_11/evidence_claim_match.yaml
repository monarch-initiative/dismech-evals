  75199020c0381765063a2bfddec6d50b45fce1e3f9a3163e535835f7e6d37b79:
    claim:
      about:
        disease:
          name: Noonan Syndrome 11
          disease_term:
            preferred_term: Noonan syndrome 11
            description: The MRAS-related form of Noonan syndrome, caused by germline activating missense
              variants in MRAS and strongly associated with hypertrophic cardiomyopathy.
            term:
              id: MONDO:0032786
              label: Noonan syndrome 11
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ns11_no_whole_organism_model
        kind: KNOWLEDGE_GAP
        prompt: Would a germline Mras knock-in animal reproduce the NS11 phenotype, and in particular
          the early, obstructive cardiac hypertrophy that dominates the human disease?
        rationale: 'Every model system curated on this entry is an iPSC-derived cardiomyocyte preparation.
          No germline MRAS knock-in mouse, zebrafish or other whole-organism model has been reported,
          which is why this entry carries no `animal_models` section. The absence is specific to MRAS
          rather than to the approach: knock-in mice have been generated for other Noonan genes and do
          reproduce low birth weight, facial dysmorphism and cardiac hypertrophy. It matters here more
          than it would for most RASopathies, because the NS11 features that a dish cannot report are
          exactly the ones that define the disease - outflow tract obstruction, growth failure, craniofacial
          dysmorphism, and the neurodevelopmental phenotype. The developmental branch of this entry''s
          mechanism is currently extrapolated from the general RASopathy paradigm rather than demonstrated
          with MRAS-specific in vivo data. What such a model would be for is already demonstrated next
          door: in Raf1 knock-in mice, six weeks of rigosertib reversed established cardiac hypertrophy.
          That answers the reversal half of the question in a neighbouring Noonan gene and leaves the
          MRAS-specific half, and the prevention half, untestable for want of a model.'
        attaches_to:
        - experimental_models#
        - pathophysiology#RAS-MAPK and PI3K-AKT Pathway Hyperactivation
        proposed_experiments:
        - experiment_id: ns11_mras_knockin_mouse
          name: Germline Mras hotspot knock-in mouse with cardiac and developmental phenotyping
          description: Generate knock-in mice carrying the murine equivalents of the recurrent human substitutions
            p.Gly23Val, p.Thr68Ile and p.Gln71Arg, then phenotype serially for ventricular wall thickness
            and outflow gradient, birth weight and growth, craniofacial morphometry, and behaviour, following
            the design already used for the Lztr1 knock-in lines. A germline model would also provide
            the substrate for testing whether MEK inhibition prevents rather than merely reverses the
            cardiac phenotype.
          would_support:
          - pathophysiology#Cardiomyocyte Hypertrophy and Calcium Handling Abnormality
          - pathophysiology#Hypertrophic Cardiomyopathy with Outflow Tract Obstruction
          supporting_outcome:
          - Knock-in animals develop ventricular hypertrophy with an outflow gradient on serial echocardiography,
            together with the extracardiac growth and craniofacial features, reproducing the human phenotype
            in vivo.
          refuting_outcome:
          - Knock-in animals carrying the human-equivalent substitutions show no ventricular hypertrophy
            or outflow obstruction, which would place the cardiac lesion outside what the murine orthologue
            can model.
      selected_evidence:
        snippet: LZTR1-mutant male mice exhibit low birth weight, distinctive facial features, and cardiac
          hypertrophy.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/3
