              variants in MRAS and strongly associated with hypertrophic cardiomyopathy.
            term:
              id: MONDO:0032786
              label: Noonan syndrome 11
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ns11_complex_stabilized_activation
        hypothesis_label: Complex-Stabilized Conformational Activation Model
        status: EMERGING
        description: 'A refinement rather than a rival of the canonical account. All-atom molecular dynamics
          work argues that M-Ras is an atypical RAS switch: even when GTP-loaded, wild-type M-Ras predominantly
          occupies the inactive state I switch conformation, so nucleotide loading is necessary but not
          sufficient to produce an effector-competent protein. The active state II conformation is instead
          stabilized allosterically once M-Ras is bound within the SHOC2-M-Ras-PP1 holophosphatase. On
          this reading an NS11 substitution acts at two points rather than one: it raises the GTP-bound
          population, as the canonical model says, and it additionally drives the switch regions into
          the active conformation and binds the holophosphatase more tightly. The distinction is not academic
          for therapy, because it places a second druggable step at complex assembly rather than at nucleotide
          handling.'
        notes: Recorded as EMERGING because the conformational argument rests on simulation. The paper's
          own molecular dynamics contribution is the free-energy analysis of the M-Ras switch ensemble;
          the increased holophosphatase binding affinity it reports for Q71R is cited prior surface-plasmon-resonance
          biochemistry, not a new measurement here. The simulations cover Q71R only and do not test the
          NS11 substitutions at Gly23 or Thr68. This model does not displace the canonical one - the same
          paper finds Q71R to be predominantly GTP-loaded - it adds a second step at which the substitution
          acts.
      selected_evidence:
        snippet: The switch toward active GTP-bound M-Ras conformation takes place through its allosteric
          stabilization by the holophosphatase.
        supports: SUPPORT
    origin:
