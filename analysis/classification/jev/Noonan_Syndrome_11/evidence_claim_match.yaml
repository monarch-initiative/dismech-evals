      reference: PMID:39352760
      reference_title: Dysregulation of RAS proteostasis by autosomal-dominant LZTR1 mutation induces
        Noonan syndrome-like phenotypes in mice.
      evidence_source: MODEL_ORGANISM
      explanation: 'Establishes the premise of the gap rather than the gap itself: germline knock-in modelling
        of a Noonan gene does reproduce the multi-system human phenotype in vivo. Directness is INDIRECT
        because the gene is LZTR1, not MRAS - the paper is cited to show the approach works and has not
        been applied here, not to make any claim about M-Ras.'
