      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ns11_constitutive_gtp_loading
        hypothesis_label: Constitutive GTP-Loading Model
        status: CANONICAL
        description: 'The established account of NS11 treats the hotspot substitutions as conventional
          RAS-family activating mutations: they impair intrinsic GTPase activity, so mutant M-Ras accumulates
          in the GTP-bound active state, and that persistently active protein drives holophosphatase assembly,
          RAF activation and downstream RAS-MAPK and PI3K-AKT output. On this model the nucleotide state
          is the primary lesion and complex formation is its consequence.'
      selected_evidence:
        snippet: Subsequent ectopic expression experiments revealed a 40-fold increase in MRAS activation
          for p.Gly23Val-MRAS compared with WT-MRAS.
        supports: SUPPORT
