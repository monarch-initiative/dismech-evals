            term:
              id: MONDO:0032786
              label: Noonan syndrome 11
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ns11_smp_complex_druggability
        kind: KNOWLEDGE_GAP
        prompt: Can the MRAS-SHOC2-PP1 holophosphatase be targeted pharmacologically in NS11, given that
          the RAS inhibitors now in clinical use do not bind M-Ras?
        rationale: 'MRTX1133 and RMC-6236 block assembly of the canonical SHOC2-RAS-PP1C complex, but
          neither binds M-Ras, so neither would be expected to act on the SMP complex that NS11 variants
          drive. That is the specific gap: it is unremarkable that RAS-directed inhibitors miss most RASopathy
          proteins, but NS11''s lesion sits in the one RAS-family protein these drugs leave out of a complex
          they otherwise engage. An engineered M-Ras mutant has been shown to accept MRTX1133 and to have
          its complex assembly blocked by it, which establishes that the site is in principle addressable,
          but no compound that engages wild-type or NS11-mutant M-Ras has been reported. The gap matters
          because it separates NS11 from the RASopathies for which downstream MEK inhibition is the practical
          route.'
        attaches_to:
        - pathophysiology#Enhanced MRAS-SHOC2-PP1 Holophosphatase Assembly
        - treatments#
        proposed_experiments:
        - experiment_id: ns11_smp_assembly_inhibitor_screen
          name: Assembly-directed screen for M-Ras-binding SMP inhibitors
          description: Screen for compounds that engage the M-Ras switch surfaces and block SMP assembly,
            using the reported MRTX1133-binding M-Ras mutant as a positive-control chemotype, then counter-screen
            against NS11 hotspot substitutions to establish whether an activating variant remains druggable.
          would_support:
          - pathophysiology#Enhanced MRAS-SHOC2-PP1 Holophosphatase Assembly
          supporting_outcome:
          - A compound that engages M-Ras and measurably reduces SMP assembly, with a corresponding fall
            in RAF S259 dephosphorylation and ERK output in NS11 variant-bearing cells.
      selected_evidence:
        snippet: These RAS inhibitors do not affect SMP formation because they do not bind MRAS.
        supports: SUPPORT
