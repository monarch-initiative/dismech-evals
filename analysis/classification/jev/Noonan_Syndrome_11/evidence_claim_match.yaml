        description: Lymphatic vessel development is disturbed in MRAS-related Noonan syndrome, as across
          the wider Noonan spectrum. In the single antenatally diagnosed NS11 patient, histology showed
          dilated pulmonary lymphatic vessels lacking a muscular medial layer, and the prenatal picture
          of increased nuchal translucency, serosal effusions and hydrops is attributed in Noonan syndrome
          to disorders of lymphatic drainage. This tissue-level lesion accounts for the fluid-accumulation
          phenotypes that dominated the reported fetal course.
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: lymphatic vessel development
          term:
            id: GO:0001945
            label: lymph vessel development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Prenatal signs of Noonan syndrome as well as findings in fetal pathology are not specific,
          including increased nuchal translucency, cystic hygroma, serosal effusions or hydrops (consequences
          of lymphatic drainage disorders), polyhydramnios
        supports: SUPPORT
