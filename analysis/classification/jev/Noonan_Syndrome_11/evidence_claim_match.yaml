          missense variants at a narrow set of conserved hotspot codons. Reported pathogenic changes are
          c.68G>T (p.Gly23Val), c.67G>C (p.Gly23Arg), c.203C>T (p.Thr68Ile — the most frequently recurrent)
          and c.212A>G (p.Gln71Arg); all reported occurrences have been de novo.
