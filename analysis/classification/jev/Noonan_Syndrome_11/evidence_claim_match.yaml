              variants in MRAS and strongly associated with hypertrophic cardiomyopathy.
            term:
              id: MONDO:0032786
              label: Noonan syndrome 11
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MRAS Activating Missense Variant
        description: NS11 is initiated by a germline heterozygous missense substitution in MRAS, almost
          always at one of a narrow set of codons — Gly23 (p.Gly23Val, p.Gly23Arg), Thr68 (p.Thr68Ile)
          or Gln71 (p.Gln71Arg) — that correspond to known RASopathy and oncogenic hotspots in other RAS-family
          GTPases. The substitutions lie in or adjacent to the P-loop, switch regions and GTP-binding
          site, and are predicted to perturb effector-interaction surfaces and nucleotide handling.
        biological_scale: MOLECULAR
        role: trigger
        genes:
        - preferred_term: MRAS
          term:
            id: hgnc:7227
            label: MRAS
      selected_evidence:
        snippet: Gly23 and Thr68 are highly conserved residues, and the corresponding codons are known
          hotspots for RASopathy-associated mutations in other RAS proteins.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31108500
      reference_title: Activating MRAS mutations cause Noonan syndrome associated with hypertrophic cardiomyopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that the NS11 variant spectrum is confined to conserved RASopathy hotspot
        codons rather than being distributed across the gene.
