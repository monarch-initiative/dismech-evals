        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Developmental Lymphatic Dysfunction
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: Developmentally abnormal lymphatic channels and transport can impair lymph clearance,
          causing stasis, reflux and fluid accumulation. RAS-MAPK-driven lymphatic proliferation is established
          in other Noonan models; applying the route to NRAS disease is provisional. Prenatal lymphatic
          distension is also a published hypothesis for selected facial, neck and genital findings, rather
          than their proven universal cause.
      selected_evidence:
        snippet: A spectrum of complex anomalies such as enlargement of lymphatic channels (lymphangiectasia),
          dysmotility, or central conducting lymphatic anomaly (CCLA) cause inadequate clearing of lymph
          with resultant stasis and reflux, affecting various organ systems, and resulting in lymphedema,
          chylothorax, pericardial effusion, congenital pulmonary lymphangiectasia (CPL), exudative enteropathy,
          chylous ascites, cystic hygroma, hydrops and other manifestations, some of which are detectable
          as early as the second trimester of pregnancy and are potentially life-threatening in neonates
          (12–14).
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
