              in the NRAS gene.
            term:
              id: MONDO:0013186
              label: Noonan syndrome 6
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Somatic NRAS-mutant myeloid neoplasia
        description: 'The NRAS codons mutated in NS6 - Gly12 above all - are the same codons mutated somatically
          in juvenile myelomonocytic leukemia and related myeloid neoplasms, so an NRAS variant found
          in blood or bone marrow does not by itself distinguish a constitutional RASopathy from an acquired
          clonal lesion. The distinction is made by demonstrating the variant in a non-hematopoietic tissue,
          and it is not academic: the germline-versus-somatic call carries different prognosis and different
          management. NS6 is additionally the entity in which the two can coexist, because a germline
          oncogenic-codon allele is itself a myeloid tumor-predisposing state.'
        disease_term:
          preferred_term: juvenile myelomonocytic leukemia
          term:
            id: MONDO:0011908
            label: juvenile myelomonocytic leukemia
        distinguishing_features:
        - Demonstration of the NRAS variant in a non-hematopoietic tissue (skin fibroblasts, buccal cells)
          establishes constitutional origin and favors NS6.
        - Extra-hematopoietic Noonan features - characteristic facies, congenital heart disease, short
          stature - favor NS6 over an isolated somatic myeloid lesion.
      selected_evidence:
        snippet: The distinction between germline and somatic mutations profoundly influences prognosis
        supports: SUPPORT
        directness: INDIRECT
