            gene_term:
              preferred_term: NRAS
              term:
                id: hgnc:7989
                label: NRAS
            association: Pathogenic Variants
            relationship_type: CAUSATIVE
            frequency: VERY_RARE
            notes: NRAS encodes the canonical small GTPase N-Ras. NS6 is caused by heterozygous germline
              missense gain-of-function variants; reported residues include Ile24, Thr50, Thr58, Gly60
              and the classic somatic oncogenic codon Gly12. Cohort screens place NRAS at a very small
              share of molecularly solved Noonan syndrome (3/115 and 2/125 in two mutation-negative screening
              cohorts). ClinGen's RASopathy expert panel classifies the NRAS-Noonan syndrome relationship
              as Definitive with autosomal dominant inheritance. Constitutional status must be confirmed
              in non-hematopoietic tissue when an oncogenic-hotspot allele is found in blood during a
              myeloid-neoplasia workup.
          role: ancestor
      assertion_type: GeneCaseFraction
      assertion:
        population: French Noonan syndrome cohort negative for PTPN11, KRAS, SOS1, MEK1, MEK2, RAF1, BRAF
          and SHOC2
        case_fraction_percent: 1.6
        cohort_size: 125
        notes: The recurrent c.179G>A (p.G60E) allele found in 2 of 125 screened patients.
      selected_evidence:
        snippet: We report on the mutational analysis of NRAS in a cohort of 125 French patients with
          NS and no known mutation for PTPN11, KRAS, SOS1, MEK1, MEK2, RAF1, BRAF, and SHOC2. The c.179G>A
          (p.G60E) mutation was identified in two patients with typical NS, confirming that NRAS germline
          mutations are a rare cause of this syndrome.
        supports: SUPPORT
