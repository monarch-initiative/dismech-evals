            description: Developmentally abnormal lymphatic channels and transport can impair lymph clearance,
              causing stasis, reflux and fluid accumulation. RAS-MAPK-driven lymphatic proliferation is
              established in other Noonan models; applying the route to NRAS disease is provisional. Prenatal
              lymphatic distension is also a published hypothesis for selected facial, neck and genital
              findings, rather than their proven universal cause.
          role: ancestor
