            term:
              id: MONDO:0013186
              label: Noonan syndrome 6
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NRAS Germline Gain-of-Function Variant
        biological_scale: MOLECULAR
        description: Heterozygous germline NRAS variants increase signaling through allele-dependent mechanisms.
          Gly60Glu resists GAP stimulation and accumulates in the GTP-bound state; Thr50Ile enhances signaling
          without increased GTP loading, with altered membrane orientation proposed. Ile24Asn may alter
          nucleotide affinity, whereas Thr58Ile and oncogenic Gly12 variants can increase basal signaling.
          Thus increased nucleotide exchange and stimulus dependence are not universal. Constitutional
          origin should be assessed in non-hematopoietic tissue because NRAS is also a somatic oncogene.
        genes:
        - preferred_term: NRAS
          term:
            id: hgnc:7989
            label: NRAS
        molecular_functions:
        - preferred_term: N-Ras intrinsic GTP hydrolysis
          term:
            id: GO:0003924
            label: GTPase activity
          modifier: DECREASED
          description: Reduced intrinsic/GAP-stimulated hydrolysis is associated with oncogenic Gly12
            alleles, and Gly60Glu is resistant to GAP stimulation. Thr50Ile does not substantially alter
            measured hydrolysis or nucleotide release; increased GTP loading is not shared by every NS6
            variant.
        biological_processes:
        - preferred_term: positive regulation of Ras protein signal transduction
          term:
            id: GO:0046579
            label: positive regulation of Ras protein signal transduction
          modifier: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: Here, we report a mutation in NRAS, resulting in an I24N amino acid substitution, that
          we identified in an individual bearing typical Noonan syndrome features.
        supports: SUPPORT
