          cardiac, growth and tumor-predisposition axes with NS6. Cardiofaciocutaneous syndrome, Noonan
          syndrome with multiple lentigines, Legius syndrome and neurofibromatosis type 1 complete the
          germline RASopathy differential. These are separated by their distinctive cutaneous findings
