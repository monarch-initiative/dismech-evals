              id: MONDO:0013186
              label: Noonan syndrome 6
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Turner syndrome
        description: 'The classic non-RASopathy mimic, and the one differential here that is not a RAS-MAPK
          disorder at all. Turner syndrome shares the features that make the Noonan phenotype recognizable
          - short stature, webbed neck, lymphedema and congenital heart disease - so the resemblance is
          with the clinical gestalt rather than with the mechanism. The two are separated by karyotype
          or chromosomal microarray, not by a RASopathy gene panel, which is why a sequencing-first workflow
          can miss it: a panel that finds no pathogenic RASopathy variant does not exclude Turner syndrome,
          because it was never testing for it. Historical usage reflected the overlap, Noonan syndrome
          having once been described in Turner-like terms before its genetic basis was known.'
        disease_term:
          preferred_term: Turner syndrome
          term:
            id: MONDO:0019499
            label: Turner syndrome
        distinguishing_features:
        - Karyotype or chromosomal microarray showing 45,X or a structural X anomaly identifies Turner
          syndrome; NS6 has a normal karyotype.
        - Turner syndrome affects phenotypic females; NS6 is autosomal dominant and affects both sexes.
        - Left-sided obstructive lesions (bicuspid aortic valve, coarctation) typify Turner syndrome,
          whereas the Noonan spectrum is weighted toward pulmonic stenosis and hypertrophic cardiomyopathy.
      selected_evidence:
        snippet: Despite different genetic background, Noonan syndrome (NS) shares similar phenotype features
          to Turner syndrome (TS) such as short stature, webbed neck and congenital heart defects.
        supports: SUPPORT
        directness: INDIRECT
