          alleles or dosages stronger than the typical human constitutional lesion?
        rationale: The mouse model uses the oncogenic G12D allele expressed pan-embryonically and is lethal
          between E15.5 and E17.5, so it cannot model the postnatal NS6 course; the zebrafish model uses
          transient mRNA overexpression of human mutants rather than an endogenous heterozygous locus.
          Both give a clear MAPK-dependent developmental phenotype, but the quantitative relationship
          between their signalling gain and that of a human NS6 heterozygote is unknown - which matters
          directly for interpreting the MEK-inhibitor rescue as a therapeutic rationale.
        attaches_to:
        - pathophysiology#Disrupted Embryonic Cardiac Development
        - pathophysiology#Disrupted Early Developmental Patterning
        proposed_experiments:
        - experiment_id: ns6_endogenous_knockin_mouse
          name: Endogenous-locus heterozygous knock-in of a human NS6 allele
          description: Generate mice carrying a heterozygous knock-in of a non-hotspot human NS6 allele
            (e.g. Nras G60E) at the endogenous locus, and assess viability, cardiac phenotype, growth
            and craniofacial morphology against the G12D model.
      selected_evidence:
        snippet: Thus, oncogenic NrasG12D mutation may not be compatible with embryonic survival.
        supports: SUPPORT
