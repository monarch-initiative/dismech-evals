      assertion:
        name: 1p13.2 microdeletion (NRAS haploinsufficiency)
        notes: Deliberately carries no disease_term. MONDO was searched for a 1p13.2 deletion concept
          and has none - the nearest hit is MONDO:0014825 chromosome 11p13 deletion syndrome, distal,
          which is a different locus. Per the term contract, no term beats a wrong one.
        description: 'Contiguous-gene deletions at 1p13.2 that remove NRAS produce a phenotype overlapping
          Noonan syndrome, and are not NS6. The distinction matters because the two are mechanistically
          opposite: NS6 is caused by a gain-of-function missense allele, whereas the deletion leaves one
          functional copy. A sequencing-only workflow that finds no pathogenic NRAS variant will miss
          the deletion, so copy-number analysis is the test that separates them.'
        distinguishing_features:
        - A 1p13.2 copy-number loss with no pathogenic NRAS sequence variant identifies the deletion rather
          than NS6.
        - Deletion cases carry the phenotypes of the other genes in the deleted segment, so features outside
          the Noonan spectrum point away from NS6.
