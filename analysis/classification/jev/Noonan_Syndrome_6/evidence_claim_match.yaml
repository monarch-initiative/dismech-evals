      assertion:
        discussion_id: ns6_oncogenic_codon_tumor_risk
        kind: KNOWLEDGE_GAP
        prompt: Do germline NRAS alleles at the classic oncogenic codons (Gly12, and by extension Gly13/Gln61)
          carry a quantitatively higher tumor risk than the non-hotspot NS6 alleles, and how large is
          that risk?
        rationale: Published NRAS RASopathy series contain few tumor events with heterogeneous ages and
          follow-up. The 2015 familial literature review predates the expanded oncogenic-codon spectrum
          and cannot establish equal risk between NRAS and other Noonan genotypes. The 2017 brain mass
          was unbiopsied and possibly hamartomatous. Allele-stratified lifetime risk therefore remains
          unresolved.
        attaches_to:
        - pathophysiology#Oncogenic-Codon Germline Alleles and Tumor Predisposition
        proposed_experiments:
