        target: Hydrops Fetalis
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Impaired lymph drainage can produce this manifestation. The general Noonan mechanism
          is applied provisionally to NRAS cases, with possible additional cardiac contributions in hydrops.
      selected_evidence:
        snippet: A spectrum of complex anomalies such as enlargement of lymphatic channels (lymphangiectasia),
          dysmotility, or central conducting lymphatic anomaly (CCLA) cause inadequate clearing of lymph
          with resultant stasis and reflux, affecting various organ systems, and resulting in lymphedema,
          chylothorax, pericardial effusion, congenital pulmonary lymphangiectasia (CPL), exudative enteropathy,
          chylous ascites, cystic hygroma, hydrops and other manifestations, some of which are detectable
          as early as the second trimester of pregnancy and are potentially life-threatening in neonates
          (12–14).
        supports: SUPPORT
