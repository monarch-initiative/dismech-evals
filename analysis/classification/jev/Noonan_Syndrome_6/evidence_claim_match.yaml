  7bb783e147720f79fd83bfb290d78b79354a2a7e3310b795360c1d6f3be6fa40:
    claim:
      about:
        disease:
          name: Noonan Syndrome 6
          disease_term:
            preferred_term: Noonan syndrome 6
            description: Any Noonan syndrome in which the cause of the disease is a gain-of-function mutation
              in the NRAS gene.
            term:
              id: MONDO:0013186
              label: Noonan syndrome 6
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ns6_haploinsufficiency_versus_gain_of_function
        kind: KNOWLEDGE_GAP
        prompt: If NS6 is caused by gain-of-function NRAS alleles that raise RAS-MAPK flux, why do 1p13.2
          microdeletions that remove one NRAS copy produce an overlapping Noonan phenotype?
        rationale: 'The canonical MAPK interpretation of NS6 involves increased signal throughput into
          RAF-MEK-ERK. A loss-of-dosage lesion converging on a similar clinical picture challenges a simple
          monotonic MAPK model; it does not establish equivalence across the parallel effector responses,
          including AKT. Three readings are open and the published data do not separate them: the deletion
          phenotype may be driven by other genes in the deleted segment rather than by NRAS; reduced N-Ras
          may perturb pathway output non-monotonically, so that both raising and lowering it degrades
          developmental signalling; or the shared features may be non-specific enough that clinical overlap
          does not imply mechanistic convergence. The same loss-and-gain pattern is reported for MAP2K2
          and SHOC2, so this is a recurring question about RAS-MAPK dosage rather than an NRAS curiosity.
          Resolving it bears on whether MEK inhibition is a rational therapy for the deletion phenotype,
          where it could plausibly make matters worse.'
        attaches_to:
        - pathophysiology#NRAS Germline Gain-of-Function Variant
        - pathophysiology#RAS-MAPK Cascade Hyperactivation
        proposed_experiments:
        - experiment_id: ns6_nras_dosage_series
          name: NRAS dosage series against developmental RAS-MAPK output
          description: Compare ERK pathway output and developmental phenotype across an allelic dosage
            series - NRAS null/heterozygous-null, wild type, and a knock-in non-hotspot NS6 allele - in
            one system, to test whether pathway output responds non-monotonically to N-Ras dosage or whether
            the deletion phenotype is carried by neighbouring genes.
          perturbations:
          - name: Heterozygous NRAS loss versus knock-in NS6 gain-of-function allele
            target: pathophysiology#NRAS Germline Gain-of-Function Variant
            genes:
            - preferred_term: NRAS
              term:
                id: hgnc:7989
                label: NRAS
          readouts:
          - name: Phosphorylated ERK as developmental RAS-MAPK output
            target: pathophysiology#RAS-MAPK Cascade Hyperactivation
            biological_processes:
            - preferred_term: ERK1 and ERK2 cascade
              term:
                id: GO:0070371
                label: ERK1 and ERK2 cascade
            direction: ALTERED
            interpretation: A similar developmental phenotype arising from opposite directions of pathway
              output would support non-monotonic dosage sensitivity; output changing only in the gain-of-function
              arm would point to neighbouring genes carrying the deletion phenotype.
      selected_evidence:
        snippet: Thus, it is conceivable that NRAS haploinsufficiency and gain-of-function mutations may
          have similar clinical consequences.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27561113
      reference_title: 1p13.2 deletion displays clinical features overlapping Noonan syndrome, likely
        related to NRAS gene haploinsufficiency.
      evidence_source: OTHER
      explanation: The authors state the convergence as a conjecture ("it is conceivable"), which is precisely
        why it is recorded here as an open question rather than as a competing mechanism in the pathograph.
