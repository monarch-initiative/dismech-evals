      assertion_type: Pathophysiology
      assertion:
        name: CLN8 endoplasmic reticulum cargo-receptor dysfunction
        description: 'CLN8 encodes a multipass transmembrane protein of the TRAM-LAG1-CLN8 (TLC) domain
          family that resides in the endoplasmic reticulum and ER-Golgi intermediate compartment, where
          it functions as an ER-to-Golgi cargo receptor delivering soluble lysosomal enzymes and participates
          in membrane phospholipid remodeling. Loss of CLN8 function impairs lysosomal enzyme trafficking
          and lipid homeostasis, initiating the neuronal ceroid lipofuscinosis disease process.

          '
