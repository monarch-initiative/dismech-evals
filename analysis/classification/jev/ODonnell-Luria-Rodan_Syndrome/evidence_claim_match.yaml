        context: []
      assertion_type: Genetic
      assertion:
        name: KMT2E
        notes: Heterozygous KMT2E variants (NM_182931) cause the disorder; ClinGen classifies KMT2E and
          autosomal dominant complex neurodevelopmental disorder (the ODLURO phenotype) as Definitive
          with a loss-of-function mechanism. Reported variant classes are frameshift, nonsense, canonical
          splice, synonymous variants creating cryptic splice sites, complex structural variants disrupting
          the gene, 7q22.2-q22.3 deletions (0.052 to 3.2 Mb) and rare de novo missense variants. Frameshifts
          in the last exon that escape nonsense-mediated decay and extend the protein occur and are clinically
          indistinguishable from earlier truncations. The gene is constrained against truncating (pLI
          1.0) but not missense variation.
        gene_term:
          preferred_term: KMT2E
          term:
            id: hgnc:18541
            label: KMT2E
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: KMT2E | HGNC:18541 | complex neurodevelopmental disorder | MONDO:0100038 | AD | Definitive
        supports: SUPPORT
