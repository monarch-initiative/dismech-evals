      assertion_type: Discussion
      assertion:
        discussion_id: kmt2e_catalytic_activity
        kind: CONTROVERSY
        status: OPEN
        prompt: Does KMT2E have intrinsic histone methyltransferase activity, and does any such activity
          matter for ODLURO?
        attaches_to:
        - pathophysiology#KMT2E Haploinsufficiency
        - pathophysiology#Altered H3K4 Methylation and Transcriptional Regulation
        rationale: KMT2E is named as a lysine methyltransferase, but the crystal structure of its SET
          domain shows missing key residues and an obstructing loop, and the purified domain had no activity
          on histones or H3 peptides. An earlier study reported H3K4 mono- and di-methyltransferase activity
          dependent on O-GlcNAcylation of the SET domain in a myeloid cell line. The entry therefore binds
          the PHD-finger reader function rather than methyltransferase activity, and treats any H3K4 methylation
          change as indirect.
      selected_evidence:
        snippet: Accordingly, we show that MLL5 is devoid of any in vitro methyltransferase activity on
          full-length histones and histone H3 peptides.
        supports: SUPPORT
    origin:
