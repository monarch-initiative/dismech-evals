      assertion:
        name: Altered H3K4 Methylation and Transcriptional Regulation
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin
          State Imbalance
        role: amplifier
        mechanism_confidence: PROVISIONAL
        biological_scale: MOLECULAR
        description: KMT2E is recruited to H3K4me3-marked euchromatin through its PHD finger and acts
          as a chromatin-associated transcriptional regulator. Knockdown in myoblasts reduced H3K4 methylation
          globally and at a target promoter, not through intrinsic methyltransferase activity but by altering
          expression of other histone-modifying enzymes (LSD1, SET7/9). All of this evidence comes from
          non-neural cell systems; the chromatin and transcriptional consequences of heterozygous loss
          in developing human neurons are unknown, so this node is not connected to the neurodevelopmental
          phenotypes and the module's central transcriptional node is not declared.
        cellular_components:
        - preferred_term: chromatin
          term:
            id: GO:0000785
            label: chromatin
        biological_processes:
        - preferred_term: regulation of DNA-templated transcription
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
          modifier: DECREASED
      selected_evidence:
        snippet: MLL5 appears to lack intrinsic histone methyl transferase activity, but regulates expression
          of histone-modifying enzymes LSD1 and SET7/9, suggesting an indirect mechanism.
        supports: SUPPORT
