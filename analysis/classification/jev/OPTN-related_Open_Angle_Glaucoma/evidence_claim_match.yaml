        role: central_effector
        description: 'Retinal ganglion cells carrying mutant optineurin die by apoptosis. This is the
          node at which OPTN-related disease rejoins the conserved glaucomatous neurodegeneration captured
          by the `glaucoma_optic_neuropathy` module - but it is reached from a cell-autonomous proteostatic
          lesion rather than from the module''s trabecular-outflow and elevated-IOP arm, which does not
          apply to this entity. E50K knock-in mice show reduced numbers of viable ganglion cells and raised
          cleaved caspase-3 in the retina at intraocular pressures indistinguishable from wild type, and
          E50K-overexpressing retinal cells show an increased early apoptotic fraction.

          '
        cell_types:
        - preferred_term: Retinal Ganglion Cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
        biological_processes:
        - preferred_term: Neuron Apoptotic Process
