      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Rab8-Dependent Vesicle Trafficking
        biological_scale: CELLULAR
        role: modifier
        description: 'Beyond autophagy, optineurin acts as an effector and adaptor for the Rab8 GTPase,
          coupling Rab8 to myosin VI and to its GTPase-activating protein TBC1D17 to control Golgi-to-plasma-membrane
          vesicle transport and transferrin receptor recycling. The E50K substitution disrupts the Optn-Rab8
          interaction. This trafficking arm is curated as a modifier rather than a second central effector:
          it is well demonstrated biochemically and in transgenic mouse retina, but the pathway from disturbed
          vesicle transport to ganglion cell death is less directly evidenced than the autophagic route.

          '
        cell_types:
        - preferred_term: Retinal Ganglion Cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
        biological_processes:
        - preferred_term: Intracellular Protein Transport
          term:
            id: GO:0006886
            label: intracellular protein transport
          modifier: DYSREGULATED
      selected_evidence:
        snippet: At the molecular level, introduction of the E50K mutation disrupts the interaction between
          Optn and Rab8 GTPase, a protein involved in the regulation of vesicle transport from Golgi to
          plasma membrane.
        supports: SUPPORT
