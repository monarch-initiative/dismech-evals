      assertion:
        discussion_id: optn_allele_population_specificity
        prompt: 'Why do the causative and susceptibility OPTN alleles differ so sharply between populations,
          and what does that imply for genetic testing?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#OPTN Missense Variant and Optineurin Misfolding
        rationale: 'Of four OPTN alleles reported as risk-conferring or disease-causing in Caucasian patients,
          two were not detected in any Japanese glaucoma patient studied and the other two were present
          at similar frequencies in Japanese glaucoma patients and controls, while M98K shows a robust
          association with POAG and NTG in Japanese and other East Asian series and is not replicated
          in Caucasians. Normal-tension glaucoma is itself more prevalent in East Asian populations. Whether
          this reflects genuinely different allelic architecture, differing linkage disequilibrium around
          a shared functional variant, or ascertainment differences between cohorts is unresolved, and
          it directly affects how an OPTN result should be interpreted in a given patient.

          '
        proposed_experiments:
        - experiment_id: optn_cross_ancestry_sequencing
          name: Cross-ancestry OPTN sequencing with matched phenotyping
          description: 'Sequence OPTN in large, uniformly phenotyped normal-tension glaucoma cohorts across
            ancestries with shared IOP and disc-imaging protocols, to separate allelic architecture from
            ascertainment.

            '
      selected_evidence:
        snippet: The current results suggest that there may be certain racial differences between Japanese
          and Caucasians with respect to OPTN genotypes.
        supports: SUPPORT
