  a954ebb529129c965c18a4beb3a52ed7bbe49a81e9ffdeae51aaca32d05ead92:
    claim:
      about:
        disease:
          name: OPTN-related Open Angle Glaucoma
          disease_term:
            preferred_term: OPTN-related open angle glaucoma
            term:
              id: MONDO:0100553
              label: OPTN-related open angle glaucoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: OPTN Missense Variant and Optineurin Misfolding
        biological_scale: MOLECULAR
        role: trigger
        description: 'A heterozygous missense change in OPTN - most commonly p.Glu50Lys (E50K), the recurrent
          allele in normal-tension glaucoma pedigrees - alters the biophysical behaviour of optineurin.
          Mutant OPTN binds TANK-binding kinase 1 (TBK1) abnormally strongly, which blocks the normal
          oligomerization and solubility that optineurin needs for its intracellular transitions, and
          the insoluble protein accumulates in the endoplasmic reticulum. Independently, E50K drives formation
          of covalently cross-linked optineurin oligomers of the kind normally seen only under oxidative
          stress. This is a toxic gain-of-function lesion rather than simple haploinsufficiency, which
          is why heterozygosity suffices and why TBK1 is a tractable drug target one step downstream.

          '
        molecular_functions:
        - preferred_term: protein kinase binding
          term:
            id: GO:0019901
            label: protein kinase binding
          modifier: INCREASED
      selected_evidence:
        snippet: The E50K mutant strongly interacted with TANK-binding kinase 1 (TBK1), which prohibited
          the proper oligomerization and solubility of OPTN, both of which are important for OPTN intracellular
          transition.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
