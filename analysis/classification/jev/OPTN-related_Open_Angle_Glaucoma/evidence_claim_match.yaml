            term:
              id: MONDO:0100553
              label: OPTN-related open angle glaucoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: optn_mouse_overexpression_fidelity
        prompt: 'Do the optineurin mouse models, which all rely on mutant overexpression or homozygosity,
          faithfully represent a heterozygous human missense disease that spares the outer retina?

          '
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Retinal Ganglion Cell Apoptosis
        - pathophysiology#Progressive Glaucomatous Optic Neuropathy at Normal Intraocular Pressure
        rationale: 'Human OPTN-related glaucoma is a heterozygous, ganglion-cell-selective optic neuropathy.
          None of the three mouse models matches that genotype-phenotype pairing. The original transgenic
          line overexpresses mutant optineurin globally and degenerates panretinally, losing photoreceptors
          and non-RGC cells - features explicitly noted as not observed in human POAG. The BAC line was
          built to fix that, and does express near-physiologically, but its phenotype is an enhancement
          of an age-related decline detectable only at 18 months and still rests on a human transgene
          over an intact mouse Optn background. The knock-in line has the right allele at the right locus
          but is reported as homozygous. Mouse retina additionally has no macula and the mouse optic nerve
          head no lamina cribrosa, removing the biomechanical setting in which human glaucomatous cupping
          develops. The consequence is concrete: neuroprotection results and phenotype-selectivity claims
          from these lines should not be transferred to patients without independent corroboration.

          '
        proposed_experiments:
        - experiment_id: optn_heterozygous_knockin_comparison
          name: Heterozygous knock-in comparison
          description: 'Characterize heterozygous Optn E50K knock-in mice alongside homozygotes for ganglion
            cell survival, autophagic flux and outer retinal integrity, to establish whether the ganglion-cell
            selectivity of human disease is a dosage effect.

            '
        - experiment_id: optn_human_retina_validation
          name: Human retinal organoid and post-mortem tissue validation
          description: 'Test whether the autophagic-flux block and any outer-retinal involvement seen
            in mice are present in OPTN(E50K) human retinal organoids and in post-mortem retina from genotyped
            patients.

            '
      selected_evidence:
        snippet: This mouse improves the design and phenotype of currently available optineurin mice,
          which showed high global overexpression.
        supports: SUPPORT
    origin:
