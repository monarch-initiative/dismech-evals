        role: modifier
        description: 'Beyond autophagy, optineurin acts as an effector and adaptor for the Rab8 GTPase,
          coupling Rab8 to myosin VI and to its GTPase-activating protein TBC1D17 to control Golgi-to-plasma-membrane
          vesicle transport and transferrin receptor recycling. The E50K substitution disrupts the Optn-Rab8
          interaction. This trafficking arm is curated as a modifier rather than a second central effector:
          it is well demonstrated biochemically and in transgenic mouse retina, but the pathway from disturbed
          vesicle transport to ganglion cell death is less directly evidenced than the autophagic route.

          '
        cell_types:
