        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: optn_glaucoma_als_convergence
        prompt: 'Do OPTN-related glaucoma and OPTN-related ALS share one pathological mechanism differing
          only in the neuron affected, or are they distinct diseases that happen to involve the same gene?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Autophagic Flux in Retinal Ganglion Cells
        rationale: 'OPTN mutations cause both normal-tension glaucoma and ALS, and TBK1 lesions likewise
          cause both. In general the glaucoma-associated alleles are missense and the ALS-associated alleles
          include deletions and nonsense changes, with essentially no overlap - which argues for distinct
          molecular consequences. Against that, aged Optn E50K knock-in mice develop spinal cord TDP-43
          accumulation and motor dysfunction as well as retinal disease, and TDP-43 mishandling is the
          canonical ALS lesion. Resolving this matters for whether therapeutic results should be expected
          to transfer between the two diseases.

          '
      selected_evidence:
        snippet: In addition, we also observed increased cytoplasmic TDP-43 in the spinal cord and motor
          dysfunction in 24-month-old OPTN (E50K) mice, indicating that TDP-43 accumulation may be the
          common pathological mechanism of glaucoma and amyotrophic lateral sclerosis (ALS).
        supports: SUPPORT
