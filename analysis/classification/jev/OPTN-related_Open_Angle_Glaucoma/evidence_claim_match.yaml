        context: []
      assertion_type: Genetic
      assertion:
        name: OPTN p.Met98Lys (M98K)
        gene_term:
          preferred_term: OPTN
          term:
            id: hgnc:17142
            label: OPTN
        association: Risk Factor
        relationship_type: SUSCEPTIBILITY
        features: 'M98K is a common OPTN sequence variant repeatedly reported as associated with open-angle
          and normal-tension glaucoma in East Asian cohorts, with roughly threefold to fourfold odds ratios
          in a Japanese case-control series, but not replicated in Caucasian populations. It is curated
          as a susceptibility allele, explicitly NOT as a Mendelian cause of this entity: the causative-allele
          evidence in this entry rests on E50K. Mechanistic work reports that M98K perturbs autophagy
          in the opposite direction to E50K - enhancing it, with Rab12-dependent transferrin receptor
          degradation and apoptotic retinal cell death - so it is not a milder version of the same lesion.

          '
        notes: 'The population-specificity of this association cuts both ways and is recorded as an open
          discussion below: the Caucasian-derived causative alleles were themselves absent from Japanese
          glaucoma cohorts.

          '
      selected_evidence:
        snippet: The frequency of the missense Met98Lys variant was higher in the POAG and NTG groups
          than in the control group (16.9% versus 5%, 15.4% versus 5%; P = 0.009 and P = 0.029, and odds
          ratio 3.85 and 3.45, respectively, for the dominant effect of the OPTN A allele).
        supports: SUPPORT
    origin:
