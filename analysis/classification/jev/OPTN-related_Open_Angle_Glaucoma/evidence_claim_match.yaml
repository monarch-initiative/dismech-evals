      assertion_type: AnimalModel
      assertion:
        name: E50K optineurin transgenic mouse (global overexpression)
        species: Mouse
        genotype: Transgenic overexpression of E50K-mutated optineurin
        publication: PMID:20388642
        description: 'The first optineurin glaucoma mouse: transgenic global overexpression of E50K-mutant
          optineurin, alongside wild-type and other mutant constructs as controls. At 16 months, histological
          abnormalities were confined to the retina in the E50K line, with ganglion cell and synapse loss,
          nerve fibre layer thinning at the optic nerve head, and about a 28% reduction in retinal thickness
          - all at normal intraocular pressure. It is also the study that first showed E50K disrupts the
          Optn-Rab8 interaction.

          '
        modeled_mechanisms:
        - target: Progressive Glaucomatous Optic Neuropathy at Normal Intraocular Pressure
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: 'Reproduces the defining feature - retinal ganglion cell and nerve fibre layer
            loss occurring at normal intraocular pressure - in the correct tissue and with a progressive
            course.

            '
          limitations: 'The phenotype extends to massive apoptosis and degeneration of the entire retina
            with roughly 28% overall retinal thinning, which is a panretinal degeneration rather than
            the ganglion-cell-selective optic neuropathy seen in patients. A later study attributes this
            to the high global overexpression of the transgene and reports diffuse loss of photoreceptors
            and non-RGC cells, features not observed in human POAG. Selectivity claims should not be drawn
            from this line.

            '
          readouts:
          - name: Retinal nerve fiber layer thickness at the optic nerve head
            target: Progressive Glaucomatous Optic Neuropathy at Normal Intraocular Pressure
            direction: DECREASED
            interpretation: 'Structural correlate of ganglion cell axon loss, measured at normal intraocular
              pressure.

              '
        - target: Disrupted Rab8-Dependent Vesicle Trafficking
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: 'The study in which loss of the Optn-Rab8 interaction was first demonstrated as
            a molecular consequence of E50K.

            '
          limitations: 'The interaction data are biochemical and were obtained under the same overexpression
            conditions that produce the non-physiological retinal phenotype, so the quantitative degree
            of trafficking disruption at endogenous expression levels is not established.

            '
      selected_evidence:
        snippet: Here, we describe the phenotypic characteristics of transgenic mice overexpressing wild-type
          (Wt) or mutated optineurin (Optn).
        supports: SUPPORT
