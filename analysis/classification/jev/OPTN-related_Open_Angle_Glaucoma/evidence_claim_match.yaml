  1771309c2ca47f4e95e49a9f76bf109442726021602eb88e19f306ed08656a9e:
    claim:
      about:
        disease:
          name: OPTN-related Open Angle Glaucoma
          disease_term:
            preferred_term: OPTN-related open angle glaucoma
            term:
              id: MONDO:0100553
              label: OPTN-related open angle glaucoma
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Isogenic OPTN(E50K) human pluripotent stem cell-derived retinal ganglion cells
        experimental_model_type: IPSC_DERIVED_MODEL
        description: 'Human pluripotent stem cell lines in isogenic pairs - patient-derived iPSCs with
          the E50K mutation corrected, and an H7 embryonic line with E50K introduced by CRISPR/Cas9 -
          differentiated through retinal organoids into purified retinal ganglion cells. Because the comparison
          is isogenic, the phenotype is attributable to the OPTN genotype rather than to line background,
          and because the cells are human ganglion cells it addresses the species limitations of the mouse
          models directly. Mutant cells show impaired autophagic-lysosomal degradation, AMPK activation,
          reduced mTORC1 signalling and neurodegenerative features; mTOR-independent autophagy induction
          rescues neurite outgrowth.

          '
        modeled_mechanisms:
        - target: Impaired Autophagic Flux in Retinal Ganglion Cells
          relationship: RECAPITULATES
          fidelity: HIGH
          description: 'Human retinal ganglion cells with the disease genotype reproduce the autophagic-lysosomal
            degradation block, in an isogenic comparison.

            '
          limitations: 'hPSC-derived retinal ganglion cells are developmentally immature relative to the
            adult neurons that degenerate in a disease of middle age, and they are cultured without the
            optic nerve head, lamina cribrosa, glia and vasculature of the intact eye. The model therefore
            speaks to the cell-autonomous proteostatic lesion, not to the tissue-level neuropathy.

            '
          readouts:
          - name: Autophagic-lysosomal degradation and mTORC1 signalling
            target: Impaired Autophagic Flux in Retinal Ganglion Cells
            direction: DECREASED
            interpretation: 'Reduced degradative flux with concurrent AMPK activation and lowered mTORC1
              signalling in mutant human ganglion cells.

              '
          - name: Neurite outgrowth after mTOR-independent autophagy induction
            target: Impaired Autophagic Flux in Retinal Ganglion Cells
            direction: RESTORED
            interpretation: 'Rescue on forcing flux, which is what makes the flux block causal for the
              degenerative phenotype rather than merely correlated with it.

              '
      selected_evidence:
        snippet: we leveraged an isogenic hPSC model with a glaucoma-associated mutation in the Optineurin
          (OPTN) protein, which plays a prominent role in autophagy
        supports: SUPPORT
