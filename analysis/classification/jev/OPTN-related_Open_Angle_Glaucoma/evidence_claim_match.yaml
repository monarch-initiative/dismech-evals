              id: MONDO:0100553
              label: OPTN-related open angle glaucoma
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Glaucoma Workup with Documented Normal Intraocular Pressure
        description: 'The diagnosis is made the same way normal-tension glaucoma is: demonstrate a genuinely
          glaucomatous optic neuropathy, demonstrate an open anterior chamber angle, and demonstrate that
          intraocular pressure stays below 21 mmHg. Goldmann applanation tonometry (with diurnal assessment
          where peaks are suspected), gonioscopy, slit lamp biomicroscopy, optical coherence tomography
          of the peripapillary nerve fibre layer, and standard automated perimetry are the core investigations.
          Pachymetry matters because central corneal thickness is lower in normal-tension than in high-tension
          open-angle glaucoma, and a thin cornea causes applanation tonometry to read below the true pressure
          - the latter is a standard tonometry principle rather than a finding of the sources cited here
          - so an unmeasured thin cornea can manufacture an apparent normal-tension case.

          '
        diagnosis_term:
          preferred_term: Tonometry
          term:
            id: NCIT:C120543
            label: Tonometry
      selected_evidence:
        snippet: Normal tension glaucoma (NTG) is labelled when typical glaucomatous disc changes, visual
          field defects and open anterior chamber angles are associated with intraocular pressure (IOP)
          constantly below 21 mmHg.
        supports: SUPPORT
