        role: amplifier
        description: 'Optineurin is one of the principal mitophagy receptors of the PINK1/Parkin pathway,
          and it initiates mitophagy by an unconventional route: rather than recruiting FIP200 and the
          ULK1/2 complex as NDP52, TAX1BP1 and p62 do, OPTN uses TBK1 bound directly to the class III
          PI3K complex I. Because that initiation step runs through the very kinase whose interaction
          E50K perturbs, the mitophagy arm is not simply a special case of the general autophagy block
          but a mechanistically distinct point of vulnerability. Failure to clear damaged mitochondria
          leaves retinal ganglion cells - among the most energetically demanding neurons in the body,
          with long unmyelinated intraretinal axons - carrying a dysfunctional mitochondrial pool. This
          node is curated as an amplifier of, not a substitute for, the autophagic-flux lesion.

          '
