            label: neuron apoptotic process
          modifier: INCREASED
        locations:
        - preferred_term: Retina
          term:
            id: UBERON:0000966
            label: retina
      selected_evidence:
        snippet: A glaucoma-associated mutant of optineurin, E50K, impairs autophagy as well as vesicle
          trafficking, leading to death of retinal cells by apoptosis.
        supports: SUPPORT
