        name: BAC E50K optineurin transgenic mouse (near-physiological expression)
        species: Mouse
        genotype: BAC transgenic human optineurin locus carrying E50K
        publication: PMID:25818176
        description: 'A bacterial artificial chromosome transgenic line carrying the human optineurin
          locus with its own promoter, designed specifically to avoid the global overexpression that made
          the earlier transgenic line degenerate panretinally. At 18 months, mutant animals show enhanced
          axonal degeneration and reduced ganglion cell survival over the age-related decline seen in
          non-transgenic controls, with visual evoked potentials revealing a specific contrast-sensitivity
          deficit.

          '
        modeled_mechanisms:
        - target: Retinal Ganglion Cell Apoptosis
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: 'Mutant optineurin expression accelerates ganglion cell and axon loss above the
            age-related baseline at near-physiological expression levels.

            '
          limitations: 'The effect is an enhancement of an age-related decline that also occurs in controls
            rather than a discrete disease phenotype, and it is detected only at 18 months, so the model
            has a narrow window and a small dynamic range. Human transgene expression sits on an intact
            mouse Optn background, so this is an overexpression-of-mutant rather than a true heterozygous
            knock-in genotype.

            '
          readouts:
          - name: Healthy optic nerve axon and retinal ganglion cell counts
            target: Retinal Ganglion Cell Apoptosis
            direction: DECREASED
            interpretation: 'Mutant-specific excess loss of axons and ganglion cells over the age-matched
              non-transgenic decline.

              '
          - name: Contrast sensitivity by visual evoked potential
            target: Retinal Ganglion Cell Apoptosis
            direction: DECREASED
            interpretation: 'Functional correlate of ganglion cell loss in this model.

              '
      selected_evidence:
        snippet: To gain mechanistic insights, we developed a novel mouse model based on a mutation in
          human optineurin associated with hereditary, low-pressure POAG.
        supports: SUPPORT
