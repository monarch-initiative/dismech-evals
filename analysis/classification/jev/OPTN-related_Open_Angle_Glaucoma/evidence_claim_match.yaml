        name: Progressive Glaucomatous Optic Neuropathy at Normal Intraocular Pressure
        conforms_to: glaucoma_optic_neuropathy#Progressive Glaucomatous Optic Neuropathy
        biological_scale: ORGANISM
        role: consequence
        description: 'Cumulative ganglion cell and axon loss produces the clinical entity: deep optic
          disc cupping, retinal nerve fibre layer thinning, and progressive visual field loss, with an
          open and unremarkable drainage angle and intraocular pressures at or below 21 mmHg. The defining
          feature relative to the rest of the glaucoma family is that this endpoint is reached without
          the elevated-IOP step: E50K carriers in the Moorfields series had mean presenting and peak diurnal
          IOP of about 15 and 17 mmHg, and E50K mice develop retinal degeneration at intraocular pressures
          statistically indistinguishable from wild-type littermates. Relative to mutation-negative normal-tension
          glaucoma the course is more aggressive - younger age at presentation, deeper cupping and smaller
          rim area at diagnosis, and a much higher rate of filtration surgery for progressive field loss.

          '
        cell_types:
        - preferred_term: Retinal Ganglion Cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
        locations:
        - preferred_term: Optic Nerve
          term:
            id: UBERON:0000941
            label: cranial nerve II
        - preferred_term: Optic Disc
          term:
            id: UBERON:0001783
            label: optic disc
        notes: 'This node deliberately does NOT declare conformance to `glaucoma_optic_neuropathy#Elevated
          Intraocular Pressure` or to the module''s Trabecular Meshwork Outflow Dysfunction trigger. The
          module''s own notes flag normal-tension glaucoma as the partial exception in which ganglion
          cell loss occurs at statistically normal IOP, and this entity is that exception.

          '
      selected_evidence:
        snippet: All 11 subjects had normal tension glaucoma (NTG), with presenting and highest IOP of
          15.3 +/- 3.0 and 16.5 +/- 2.5 mm Hg (+/-SD) on diurnal testing.
        supports: SUPPORT
