          retinal ganglion cells in Optn E50K knock-in mice. INVESTIGATIONAL ONLY - this is preclinical
          cell and mouse data with no human trial evidence, and it must not be curated or read as established
          therapy.

          Only amlexanox is bound in therapeutic_agent. BX795 has no CHEBI or NCIT term, and it is deliberately
          NOT stood in for by a broad drug class: what matters mechanistically here is TBK1 selectivity,
          which a class covering every kinase inhibitor does not express. BX795''s identity is carried
          by this description and by the cited evidence instead.

          '
        treatment_term:
