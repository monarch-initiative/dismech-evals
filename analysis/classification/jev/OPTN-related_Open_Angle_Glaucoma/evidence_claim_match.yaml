      assertion_type: Genetic
      assertion:
        name: OPTN
        gene_term:
          preferred_term: OPTN
          term:
            id: hgnc:17142
            label: OPTN
        association: Causative
        relationship_type: CAUSATIVE
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        variants:
        - name: OPTN p.Glu50Lys (E50K)
          description: 'The recurrent missense allele of OPTN in normal-tension glaucoma, and the most
            common glaucoma-associated OPTN mutation. Acts by toxic gain of function: it strengthens the
            OPTN-TBK1 interaction, renders optineurin insoluble and covalently cross-linked, and blocks
            autophagic flux.

            '
          gene:
            preferred_term: OPTN
            term:
              id: hgnc:17142
              label: OPTN
          clinical_significance: PATHOGENIC
        variant_origin: GERMLINE
        notes: 'OPTN (optineurin) at the GLC1E locus on 10p14 is the causative gene for this entity. Glaucoma-associated
          OPTN changes are predominantly missense; the recurrent p.Glu50Lys (E50K) allele segregates with
          disease in large pedigrees and accounts for essentially all of the well-characterized mechanistic
          work. It is a heterozygous germline change acting by toxic gain of function rather than by haploinsufficiency
          - the mutant protein acquires abnormal TBK1 binding, insolubility and covalent cross-linking
          rather than merely losing wild-type activity - which is consistent with the dominant inheritance.
          Optineurin is expressed in retina as well as in trabecular meshwork and nonpigmented ciliary
          epithelium, but the disease-relevant lesion in this entity is the retinal one.

          The related Mendelian normal-tension glaucoma gene TBK1 is not curated as a gene of this entity.
          TBK1 copy-number gain causes its own normal-tension glaucoma and belongs to a separate disease
          concept; TBK1 appears here only as the interacting kinase through which mutant optineurin acts,
          and as a drug target.

          '
      selected_evidence:
        snippet: Optineurin is expressed in trabecular meshwork, nonpigmented ciliary epithelium, retina,
          and brain, and we speculate that it plays a neuroprotective role.
        supports: SUPPORT
