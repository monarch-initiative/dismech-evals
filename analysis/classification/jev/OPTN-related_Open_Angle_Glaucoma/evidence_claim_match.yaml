              id: MONDO:0100553
              label: OPTN-related open angle glaucoma
        context: []
      assertion_type: Treatment
      assertion:
        name: Intraocular Pressure Lowering
        description: 'All established glaucoma therapy works by lowering intraocular pressure, and that
          remains the only evidence-based intervention for OPTN-related disease even though the pressure
          is not elevated to begin with. In a four-generation Glu50Lys pedigree followed for a mean of
          17 years, visual field progression appeared to stabilize only once IOP was brought below 10
          mmHg, so the target pressure is substantially lower than in ordinary open-angle glaucoma. This
          is an observational pedigree finding, not a randomized result.

          '
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: prostaglandin analogue
            term:
              id: NCIT:C78568
              label: Prostaglandin Analogue
          - preferred_term: betaxolol
            term:
              id: CHEBI:3082
              label: betaxolol
          - preferred_term: brimonidine
            term:
              id: CHEBI:3175
              label: brimonidine
        therapeutic_modality: SMALL_MOLECULE
        notes: 'The agents bound here are the standard normal-tension glaucoma pharmacotherapy classes,
          carried because management of this entity follows NTG algorithms. None of them has OPTN-specific
          efficacy evidence, and none addresses the autophagy lesion; they lower pressure in an eye whose
          pressure was never high. That is the therapeutic gap the two investigational entries below are
          aimed at.

          '
      selected_evidence:
        snippet: progressive visual field loss which appeared to stabilize once an IOP of less than 10
          mm Hg was achieved
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
