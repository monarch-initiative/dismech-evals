      assertion_type: DifferentialDiagnosis
      assertion:
        name: Non-Mendelian normal tension glaucoma
        description: 'The great majority of normal-tension glaucoma has no single-gene cause. Vascular
          and haemodynamic factors dominate the proposed pathogenesis - chronic low ocular perfusion,
          Raynaud phenomenon, migraine, nocturnal systemic hypotension, and over-treated systemic hypertension.
          Because single-gene disease accounts for only about 2% of normal-tension glaucoma, this is by
          far the most likely diagnosis in an unselected patient, and it is what an OPTN-related diagnosis
          has to be positively distinguished from.

          '
        distinguishing_features:
        - 'Absence of a pathogenic OPTN, TBK1 or MYOC variant; typically older age at presentation than
          the E50K mean of about 41 years, less severe cupping at diagnosis, and a lower rate of progression
          to filtration surgery. Vasospastic and nocturnal-hypotension features are commonly present.

          '
      selected_evidence:
        snippet: Chronic low vascular perfusion, Raynaud's phenomenon, migraine, nocturnal systemic hypotension
          and over-treated systemic hypertension are the main causes of normal tension glaucoma.
