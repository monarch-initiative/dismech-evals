              label: OPTN-related open angle glaucoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Autophagic Flux in Retinal Ganglion Cells
        conforms_to: disabled_macroautophagy#Failure of Cytoplasmic Quality Control
        biological_scale: CELLULAR
        role: central_effector
        description: 'Optineurin is a selective autophagy receptor: it binds polyubiquitinated cargo through
          its ubiquitin-binding domain and delivers it to nascent autophagosomes through its LC3-interacting
          region, and it links autophagosomes to lysosomes via myosin VI. Retinal ganglion cells express
          optineurin highly and, as long-lived post-mitotic neurons with an exceptional axonal maintenance
          burden, depend heavily on autophagic quality control. Mutant optineurin blocks flux through
          this pathway. In OPTN(E50K) mice and in E50K-expressing retinal cells, LC3-II and p62/SQSTM1
          both accumulate - the signature of a downstream block rather than reduced initiation - and undegraded
          substrates including TDP-43 aggregate in the cytoplasm. In isogenic OPTN(E50K) human stem cell-derived
          retinal ganglion cells the same lesion is accompanied by AMPK activation and reduced mTORC1
          signalling, and mTOR-independent induction of autophagy restores neurite outgrowth, showing
          the block is the proximate cause of the neurodegenerative phenotype rather than a bystander.
          This node conforms to the `disabled_macroautophagy` module''s central effector: the failure
          point here is selective cargo recognition by the receptor itself, not the core ATG machinery,
          and it is genetic rather than age-associated, but the resulting loss of cytoplasmic quality
          control is the conserved state that module models.

          '
        cell_types:
        - preferred_term: Retinal Ganglion Cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
        biological_processes:
        - preferred_term: Macroautophagy
          term:
            id: GO:0016236
            label: macroautophagy
          modifier: DECREASED
        - preferred_term: Autophagosome-Lysosome Fusion
          term:
            id: GO:0061909
            label: autophagosome-lysosome fusion
          modifier: DECREASED
        - preferred_term: mTORC1 Signalling
          term:
            id: GO:0038202
            label: TORC1 signaling
          modifier: DECREASED
      selected_evidence:
        snippet: Increased p62/SQSTM1 and LC3-II levels indicated that autophagic flux was inhibited and
          contributed to TDP-43 aggregation in vivo and in vitro.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33723228
      reference_title: The E50K optineurin mutation impacts autophagy-mediated degradation of TDP-43 and
