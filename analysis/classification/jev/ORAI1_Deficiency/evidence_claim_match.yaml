      assertion:
        classification_value: combined immunodeficiency with syndromic features
        notes: 'A combined immunodeficiency accompanied by non-immune features — congenital myopathy and
          anhidrotic ectodermal dysplasia with enamel defects — which is the defining shape of the IUIS
          syndromic-CID group, and the same placement the KB gives IKBKG-related anhidrotic ectodermal
          dysplasia with immunodeficiency. Note this cuts against the MONDO placement of the sibling `immunodeficiency
          9` concept under severe combined immunodeficiency: lymphocyte development is normal here and
          the defect appears on stimulation.'
      selected_evidence:
        snippet: ORAI-1 deficiency ORAI1 AR 610277 Normal, defective TCR mediated activation
        supports: SUPPORT
