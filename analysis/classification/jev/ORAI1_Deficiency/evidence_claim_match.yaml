        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Calcineurin-NFAT Dependent Transcription
        biological_scale: CELLULAR
        description: 'NFAT is heavily phosphorylated and cytoplasmic in resting lymphocytes and enters
          the nucleus only when dephosphorylated by the calcium/calmodulin dependent phosphatase calcineurin.
          Without sustained calcium entry calcineurin is not activated, NFAT does not translocate, and
          the large NFAT-dependent transcriptional programme — cytokines, chemokines and many other genes
          required for a productive immune response — is not induced.

          '
        biological_processes:
        - preferred_term: calcineurin-NFAT signaling cascade
          modifier: DECREASED
          term:
            id: GO:0033173
            label: calcineurin-NFAT signaling cascade
      selected_evidence:
        snippet: the underlying defect in a family with a hereditary severe combined immune deficiency
          (SCID) syndrome is a defect in CRAC channel function, store-operated Ca(2+) entry, NFAT activation
          and transcription of cytokines, chemokines and many other NFAT target genes whose transcription
          is essential for productive immune defence
        supports: SUPPORT
