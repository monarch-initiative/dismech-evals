        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Autoimmunity
        biological_scale: ORGANISM
        description: 'Autoimmune cytopenias — haemolytic anaemia and thrombocytopenia — occur in ORAI1-deficient
          patients alongside the immunodeficiency, and where they occur they are attributed to loss of
          the regulatory T cell compartment rather than to the effector defect. How often they occur is
          disputed and the entry does not settle it. The published series up to 2015 record the same single
          autoimmune patient — 1 of 6 in the 2009 report, which states it covers every ORAI1 patient then
          known, and 1 of 7 in the 2015 review, whose denominator is those six plus one later patient
          — and the review calls autoimmunity less common in ORAI1 than in STIM1 deficiency on that basis.
          Lian 2018 then reported three affected patients in one series. So the disagreement is between
          an early near-complete census and a later series, not between two independent cohorts. The review
          itself notes that the small patient numbers and early mortality may censor the observation rather
          than establish a low rate. The node is retained because the phenomenon is real and mechanistically
          informative about the Treg compartment, not because it is a recurrent feature of every patient.

          '
      selected_evidence:
        snippet: ORAI1 null mutations are associated with reduced numbers of invariant natural killer
          T and Treg cells that likely contribute to the patients' immunodeficiency and autoimmunity.
        supports: SUPPORT
