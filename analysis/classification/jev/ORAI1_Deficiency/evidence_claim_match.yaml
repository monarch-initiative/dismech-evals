        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Abolished Store-Operated Calcium Entry
        biological_scale: CELLULAR
        description: 'Store-operated calcium entry is the dominant sustained calcium influx pathway in
          lymphocytes. Its loss is demonstrable in patient T cells, fibroblasts and other cell types,
          and is the single cellular lesion from which every downstream arm of the disease follows. Because
          ORAI1 is expressed almost ubiquitously, the lesion is present in far more tissues than are clinically
          affected — the restriction of the phenotype reflects where SOCE is non-redundant, not where
          ORAI1 is expressed.

          '
        biological_processes:
        - preferred_term: store-operated calcium entry
          modifier: DECREASED
          term:
            id: GO:0002115
            label: store-operated calcium entry
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: In contrast with the limited clinical phenotype, we found ORAI1 protein expression in
          a wide variety of cell types and organs.
        supports: SUPPORT
