      assertion:
        name: Loss of CRAC Channel Pore Function
        biological_scale: MOLECULAR
        description: 'ORAI1 is the pore-forming subunit of the CRAC channel. Without functional ORAI1,
          STIM1 has no pore to gate on store depletion, and the CRAC current (I_CRAC) is absent. That
          ORAI1 is the pore rather than a regulator is established by the rescue experiment: expressing
          wild-type Orai1 in patient SCID T cells restores both store-operated calcium influx and I_CRAC.

          '
        molecular_functions:
        - preferred_term: store-operated calcium channel activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0015279
            label: store-operated calcium channel activity
      selected_evidence:
        snippet: expression of wild-type Orai1 in SCID T cells restores store-operated Ca2+ influx and
          the CRAC current (I(CRAC))
        supports: SUPPORT
