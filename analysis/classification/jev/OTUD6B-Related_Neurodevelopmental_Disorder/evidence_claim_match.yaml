                limb anomalies
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: ZMIZ1-related neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies
        disease_term:
          preferred_term: ZMIZ1-related neurodevelopmental disorder (NEDDFSA)
          term:
            id: MONDO:0032855
            label: neurodevelopmental disorder with dysmorphic facies and distal skeletal anomalies
        description: 'A distinct autosomal dominant entity (MONDO:0032855, OMIM:618659) caused by heterozygous
          variants in ZMIZ1 (hgnc:16493). Its label differs from this disorder''s only in "skeletal" versus
          "limb". This is not only a label hazard: PMID:34680978 reports a proband who genuinely carries
          variants in both genes, so the two entities can co-occur in one patient.'
        distinguishing_features:
        - 'Molecular: ZMIZ1 (hgnc:16493) heterozygous and autosomal dominant, versus biallelic recessive
          OTUD6B. ZMIZ1 is a transcriptional coregulator, not a deubiquitinase, so there is no shared
          mechanism to justify pooling evidence.'
        - 'Co-occurrence, not just confusion: in PMID:34680978 the same 5-year-old girl carries a hemizygous
          OTUD6B c.873delA over a paternal 8q21.3 whole-gene deletion AND a heterozygous ZMIZ1 c.1491
          + 2T > C splice variant confirmed by mRNA study to skip exon 14. Her Williams syndrome-like
          facial features (periorbital edema, hanging cheek, long and smooth philtrum) and her polydactyly
          are curated in this entry with supports PARTIAL for exactly this reason. Finding a ZMIZ1 variant
          therefore does not exclude OTUD6B disease, and vice versa.'
        notes: 'Cross-reference: the phenotypes Periorbital Edema, Hanging Cheek, Long Philtrum, Smooth
          Philtrum, and Polydactyly in this entry all derive from the dual-locus PMID:34680978 proband
          and all name this differential in their attribution notes.'
      selected_evidence:
        snippet: The OTUD6B and ZMIZ1 genes were recently identified as causes of syndromic intellectual
          disability (ID) with shared phenotypes of facial dysmorphism, distal limb anomalies, and seizure
          disorders.
        supports: SUPPORT
