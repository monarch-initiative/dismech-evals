          against a cardiac-evaluated denominator of 6, giving atrial septal defect 3/6 (50 percent) and
          ventricular septal defect 2/6 (33 percent), both curated from PMID:28343629. Either maps to
          the FREQUENT band (30-79 percent), so FREQUENT is applied to the parent cardiac term. Note the
          denominator is 6, not the 12 used for the neurological terms, because only a subset of the founding
          cohort had cardiac assessment reported.'
