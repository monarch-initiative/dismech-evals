      assertion_type: Treatment
      assertion:
        name: Genetic Counseling and Carrier Testing
        description: Autosomal recessive inheritance gives a 25 percent sibling recurrence risk. Counseling
          should cover the recessive model, carrier testing of parents and at-risk relatives, and the
          option of prenatal or preimplantation testing once the familial variants are known. Consanguinity
          is common in reported families, and the RP1L1 experience in PMID:34354232 shows that a second
          independent recessive disorder can co-segregate and confound the phenotype, so exome or genome
          data should be reanalyzed in depth in consanguineous pedigrees.
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: demonstrating the need for in-depth analysis of WES data in consanguineous families to
          uncover simultaneous autosomal recessive disorders
        supports: SUPPORT
