      assertion:
        name: BPTF-related neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
        disease_term:
          preferred_term: BPTF-related neurodevelopmental disorder (NEDDFL)
          term:
            id: MONDO:0060596
            label: neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
        description: A distinct autosomal dominant entity (MONDO:0060596, OMIM:617755) caused by heterozygous
          variants in BPTF (hgnc:3581). Its MONDO label differs from this disorder's by two words, which
          makes it the single most likely entity to be conflated with OTUD6B disease in a text or label-based
          search.
        distinguishing_features:
        - 'Molecular: BPTF (hgnc:3581) heterozygous, autosomal dominant and typically de novo, versus
          OTUD6B (hgnc:24281) biallelic and autosomal recessive. The inheritance mode alone separates
          them in almost every family.'
        - 'Nomenclature: the near-identical MONDO labels are the hazard, not the phenotypes. Confirm the
          causative gene before importing any cohort data published under the "dysmorphic facies and distal
          limb anomalies" phrasing.'
        notes: PMID:33522091 is cited here, and only here. It is a 25-individual NEDDFL cohort and it
          is exactly the kind of paper a label-based search would sweep into this entry by mistake; recording
          it against the differential is the honest place for it, and none of its phenotype data is used
          anywhere in the OTUD6B sections.
      selected_evidence:
        snippet: Neurodevelopmental disorder with dysmorphic facies and distal limb anomalies (NEDDFL),
          defined primarily by developmental delay/intellectual disability, speech delay, postnatal microcephaly,
          and dysmorphic features, is a syndrome resulting from heterozygous variants in the dosage-sensitive
          bromodomain PHD finger chromatin remodeler transcription factor BPTF gene.
        supports: SUPPORT
