      assertion:
        name: Retinal Degeneration
        description: Retinal degeneration was initially observed in two brothers with homozygous OTUD6B
          variants, but exome reanalysis showed it was caused by a co-segregating homozygous RP1L1 nonsense
          variant causing autosomal recessive retinitis pigmentosa 88, not by OTUD6B. This entry records
          retinal degeneration as explicitly excluded from the OTUD6B phenotype. It is distinct from the
          optic disc hypoplasia and retinal abnormalities reported separately in PMID:41188742, which
          remain a single unreplicated observation.
        phenotype_term:
          preferred_term: Retinal degeneration
          term:
            id: HP:0000546
            label: Retinal degeneration
      selected_evidence:
        snippet: Retinal degeneration, albeit present in both patients from Family I, was shown to be
          unrelated to OTUD6B, demonstrating the need for in-depth analysis of WES data in consanguineous
          families to uncover simultaneous autosomal recessive disorders.
        supports: REFUTE
