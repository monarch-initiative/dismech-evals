      assertion_type: Diagnosis
      assertion:
        name: Trio Exome Sequencing
        description: 'There are no formal clinical diagnostic criteria; the diagnosis is molecular. Trio-based
          exome sequencing is the appropriate first-line test for a child with global developmental delay,
          seizures, the distal limb findings, and a dysmorphic facial gestalt, and it is how the reported
          cases were ascertained. The trio design matters specifically because the disorder is autosomal
          recessive: phasing the two candidate alleles across the parents is what establishes that they
          are in trans, and it is also what identifies each parent as a carrier for counseling.'
        diagnosis_term:
          preferred_term: trio exome sequencing
