                limb anomalies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Allele-Dependent Residual OTUD6B Function
        biological_scale: MOLECULAR
        description: The severity of the clinical phenotype tracks the predicted functional severity of
          the specific OTUD6B alleles. Truncating and splice alleles that trigger nonsense-mediated decay
          give little or no product, whereas some missense alleles only locally destabilize the protein
          and others distort the overall fold. Molecular dynamics modeling of two OTU-domain missense
          alleles predicted localized destabilization for the allele found in a mildly affected individual
          and gross fold distortion for the allele found in a severely affected individual. In one replication
          family, residual wild-type splicing of under one percent, together with alleles that spare the
          short OTUD6B-2 isoform, was proposed to explain an unusually mild presentation.
      selected_evidence:
        snippet: it is anticipated that Tyr216Cys in the earlier reported case with less severe IDDFSDA
          will lead to localized destabilization, whereas Ile274Arg in the presented index case with the
          severe IDDFSDA phenotype will lead to significant distortion in the overall fold of OTUD6B
        supports: SUPPORT
