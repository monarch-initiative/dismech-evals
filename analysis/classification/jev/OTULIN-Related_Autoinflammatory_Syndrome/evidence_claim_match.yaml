              label: autoinflammation, panniculitis, and dermatosis syndrome, autosomal recessive
        context: []
      assertion_type: Genetic
      assertion:
        name: OTULIN variants
        gene_term:
          preferred_term: OTULIN
          term:
            id: hgnc:25118
            label: OTULIN
        relationship_type: CAUSATIVE
        notes: Biallelic hypomorphic OTULIN variants cause ORAS. Reported classes are homozygous missense
          and frameshift variants (Zhou 2016, PMID:27559085), a canonical splice-site variant (Nabavi
          2019, PMID:30796585), and an atypical late-onset compound-heterozygous case (Zinngrebe 2022,
          PMID:35170849); the first report (Damgaard 2016, PMID:27523608) described a homozygous missense
          in a consanguineous family. Specific variant notations (for example p.L272P, p.Y244C, p.G174Dfs*2,
          p.G281R, c.864+2T>C, the compound-het p.M86I/p.W167S, and p.V185F) are catalogued in Table 1
          of PMID:40734169; the structured evidence here quotes the variant-class sentence rather than
          the table.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_ebcd5c52-5f40-45d1-bcab-3a6162c188d7-2026-05-19T160000.000Z
      selected_evidence:
        snippet: We identified two missense and one frameshift mutations in one Pakistani and two Turkish
          families with four affected patients.
        supports: SUPPORT
