  405a2c97116f55c1badf8b28882907fe0a4b24063540ac756bcbf9363bcc6a9d:
    claim:
      about:
        disease:
          name: OTULIN-Related Autoinflammatory Syndrome
          disease_term:
            preferred_term: OTULIN-related autoinflammatory syndrome
            term:
              id: MONDO:0014912
              label: autoinflammation, panniculitis, and dermatosis syndrome, autosomal recessive
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Fibroblast LUBAC Degradation and Reduced TNF Signaling
        biological_scale: CELLULAR
        description: In OTULIN-deficient fibroblasts LUBAC is degraded and its recruitment to the TNF
          receptor signaling complex falls, so the fibroblast TNF-mediated signaling response is reduced
          rather than increased. This cell-type-specific LUBAC degradation is the defining result of Damgaard
          et al. 2019 and is the mirror image of the increased NF-kappaB seen in monocytes.
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: tumor necrosis factor-mediated signaling pathway
          term:
            id: GO:0033209
            label: tumor necrosis factor-mediated signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: LUBAC recruitment and M1-linked Ub conjugation at the TNF-RSC are reduced, accompanied
          by impaired TNF signalling, decreased IL-8 secretion and sensitisation to TNF-induced cell death
          in the presence of CHX
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30804083
      reference_title: OTULIN deficiency in ORAS causes cell type-specific LUBAC degradation, dysregulated
        TNF signalling and cell death.
      evidence_source: IN_VITRO
      explanation: Documents reduced LUBAC recruitment and impaired (not increased) TNF signalling in
        patient fibroblasts, correcting the direction of the fibroblast TNF response.
