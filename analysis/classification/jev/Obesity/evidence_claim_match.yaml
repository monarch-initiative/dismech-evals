  a0e178342b1e068eaf89ad58c088d7ad9ca6da1b6ed9630daef685273437705a:
    claim:
      about:
        disease:
          name: Obesity
          disease_term:
            preferred_term: obesity disorder
            term:
              id: MONDO:0011122
              label: obesity disorder
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pgs_context_amplification
        hypothesis_label: Amplification of polygenic obesity risk in adverse contexts via shared energy-imbalance
          convergence
        status: EMERGING
        description: 'Polygenic-score-by-context (PGS×C) interactions reported for obesity in the UK Biobank
          appear to reflect amplification rather than context-specific causal variants: the same susceptibility
          loci (e.g. FTO, MC4R, and other appetite/CNS-acting variants) exert systematically larger effects
          in disease-promoting contexts. This entry proposes that the amplification arises because polygenic
          liability and adverse exposures — obesogenic diet, physical inactivity, alcohol intake and socioeconomic
          deprivation — converge on the shared Energy Imbalance node, so their joint effect on the liability-threshold
          scale is super-additive rather than additive. Nagpal & Gibson (Nat Genet 2026, PMID:42443528)
          show amplifying context pairs for BMI-defined obesity (e.g. glucose with omega-3 fatty acids,
          and walking pace with beer intake) and note that the major contexts differ between BMI- and
          waist-to-hip-ratio definitions, consistent with BMI polymorphisms acting on central appetite
          regulation versus WHR variants acting on peripheral metabolic traits.'
        notes: EMERGING hypothesis motivated by population-scale PGS×context analyses (primary source
          PMID:42443528; general amplification mechanism corroborated by PMID:37228747). The convergence
          claim (polygenic liability + adverse exposures → Energy Imbalance) is a mechanistic interpretation
          and is not itself established as causal — see the reverse-causation knowledge gap under discussions.
      selected_evidence:
        snippet: The predominant mechanism for PGS×C is the amplification of genetic effects in adverse
          contexts, such as low polyunsaturated fatty acids or social determinants of ill health
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42443528
      reference_title: Pervasive interactions between exposures and polygenic risk can inform more effective
        clinical and behavioral interventions.
      evidence_source: COMPUTATIONAL
      explanation: 'Direct source (Nagpal & Gibson 2026): across seven UK Biobank diseases and 75 contexts,
        amplification of genetic effects in adverse contexts is identified as the predominant mechanism
        of PGS×context interaction — the mechanism applied in this hypothesis.'
