      assertion_type: Pathophysiology
      assertion:
        name: Energy Imbalance
        description: 'Chronic positive energy balance from excess caloric intake relative to expenditure
          leads to fat accumulation. Multiple regulatory systems (leptin, ghrelin, insulin) fail to restore
          balance.

          '
        biological_processes:
        - preferred_term: Energy Homeostasis
          term:
            id: GO:0097009
            label: energy homeostasis
      selected_evidence:
        snippet: In obese subjects the circulating level of the anorexigenic hormone leptin is increased,
          whereas surprisingly, the level of the orexigenic hormone ghrelin is decreased. It is now established
          that obese patients are leptin-resistant.
        supports: SUPPORT
    origin:
