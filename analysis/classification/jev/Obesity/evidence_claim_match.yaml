              id: MONDO:0011122
              label: obesity disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Efficient Intestinal Energy Harvest
        biological_scale: ORGANISM
        description: 'The share of ingested energy that is absorbed rather than excreted in feces is a
          determinant of energy balance that sits upstream of adipose expansion. In diet-induced obese
          mice, pasteurized A. muciniphila lowers food energy efficiency and raises fecal energy excretion,
          apparently through reduced carbohydrate absorption and faster intestinal epithelial turnover,
          implying that the untreated state retains a correspondingly larger fraction of ingested energy.

          '
        biological_processes:
        - preferred_term: intestinal absorption
          modifier: INCREASED
          term:
            id: GO:0050892
            label: intestinal absorption
        notes: 'The human evidence for this node is weaker than the rodent evidence. In the weight-maintenance
          trial (PMID:42120725) the rise in fecal energy content under pasteurized MucT did not reach
          significance, and total daily fecal output was not measured; only the within-group inverse association
          between change in fecal energy and change in body weight pointed this way.

          '
      selected_evidence:
        snippet: we observed that treatment with pasteurized A. muciniphila increased energy excretion
          in the feces
        supports: SUPPORT
        directness: INDIRECT
