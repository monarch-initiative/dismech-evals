  5d8b4fc487622d9cdb7cba810f1a464c76587d2d0dc0931b1741c6ff0f4670f0:
    claim:
      about:
        disease:
          name: Obesity
          disease_term:
            preferred_term: obesity disorder
            term:
              id: MONDO:0011122
              label: obesity disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hypothalamic Dysregulation
        description: 'Central appetite regulation becomes impaired with leptin resistance and altered
          reward signaling, perpetuating overeating despite adequate energy stores. Hypothalamic neuroinflammation
          involves microglial and astrocyte activation that impairs melanocortin signaling. The genes
          bound to this node are the ones whose disruption is known to produce this state: leptin and
          its hypothalamic receptor LepRb set the afferent arm, and the melanocortin-4 receptor pathway
          downstream of it is the arm whose disruption produces hyperphagia. In common obesity these genes
          act as susceptibility rather than as sufficient causes; the monogenic diseases in which they
          are sufficient are curated separately (see notes).

          '
        genes:
        - preferred_term: LEP
          term:
            id: hgnc:6553
            label: LEP
        - preferred_term: LEPR
          term:
            id: hgnc:6554
            label: LEPR
        - preferred_term: POMC
          term:
            id: hgnc:9201
            label: POMC
        - preferred_term: MC4R
          term:
            id: hgnc:6932
            label: MC4R
        cell_types:
        - preferred_term: Hypothalamus Cell
          term:
            id: CL:2000030
            label: hypothalamus cell
        - preferred_term: Microglial Cell
          term:
            id: CL:0000129
            label: microglial cell
        biological_processes:
        - preferred_term: Feeding Behavior
          term:
            id: GO:0007631
            label: feeding behavior
      selected_evidence:
        snippet: However, the majority of patients with obesity presents elevated leptin production, suggesting
          that in this setting leptin is ineffective in the regulation of energy balance.
        supports: SUPPORT
    origin:
