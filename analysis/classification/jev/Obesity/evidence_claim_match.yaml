  e555daca68385dea423b154f604aa26ac86ec08af01e6e5453d3d84d56c317d1:
    claim:
      about:
        disease:
          name: Obesity
          disease_term:
            preferred_term: obesity disorder
            term:
              id: MONDO:0011122
              label: obesity disorder
        context: []
      assertion_type: Treatment
      assertion:
        name: Pasteurized Akkermansia muciniphila MucT Supplementation
        therapeutic_modality: OTHER
        description: 'Daily oral capsules of pasteurized Akkermansia muciniphila MucT (heat-treated 30
          minutes at 70 C; 3 x 10^10 inactivated cells per capsule) taken during the weight maintenance
          phase that follows a low-energy diet. Heat inactivation removes the oxygen sensitivity and manufacturing
          constraints of the live organism while preserving the thermostable outer-membrane protein Amuc_1100,
          and in rodents it increased rather than abolished the metabolic benefit. The indication tested
          is maintenance of weight already lost, not weight loss itself.

          '
        treatment_term:
          preferred_term: pasteurized Akkermansia muciniphila MucT supplementation
          term:
            id: NCIT:C15433
            label: Nutritional Support
          qualifiers:
          - predicate:
              preferred_term: dietary supplement
              term:
                id: NCIT:C1505
                label: Dietary Supplement
            value:
              preferred_term: pasteurized Akkermansia muciniphila MucT
              term:
                id: NCIT:C200541
                label: Akkermansia muciniphila Probiotic
        notes: 'The agent term NCIT:C200541 is carried as a qualifier rather than in therapeutic_agent
          because it sits under Dietary Supplement (NCIT:C1505) and is not reachable from NCIT:C1909 (Pharmacologic
          Substance), the root of the ChemicalEntityTerm enum that binds therapeutic_agent. Two limits
          on the claim: pasteurized cells are non-viable and do not colonize, so the effect is host-directed
          rather than a restoration of the endogenous Akkermansia population, and the trial found no between-group
          difference in fecal microbiota composition; and no arm received a MucT strain lacking Amuc_1100,
          so specificity to that protein is not established in humans.

          '
      selected_evidence:
        snippet: No serious adverse events related to the treatment were observed.
        supports: SUPPORT
    origin:
