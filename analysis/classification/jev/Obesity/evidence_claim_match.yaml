              label: obesity disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: akkermansia_baseline_abundance_responder
        prompt: Does baseline fecal Akkermansia muciniphila abundance decide who benefits from A. muciniphila
          supplementation, and if so, is the mechanism headroom for improvement or something about the
          resident community?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Pasteurized Akkermansia muciniphila MucT Supplementation
        - pathophysiology#Depletion of Mucosal Symbiont Akkermansia muciniphila
        rationale: 'Two independent trials of different preparations point the same way. In the weight-maintenance
          trial (PMID:42120725) participants stratified below the median fecal A. muciniphila level after
          weight loss regained less weight and improved more in insulin sensitivity, blood pressure and
          fecal energy content than those above it, with no such split in the placebo arm; that analysis
          was exploratory and post hoc. In a separate trial of live AKK-WST01 in overweight/obese type
          2 diabetes (PMID:39879980), benefit and colonization were likewise confined to the low-baseline
          group. If this holds prospectively it makes baseline abundance a pre-treatment stratifier rather
          than an incidental covariate, and it would change how a maintenance trial is powered and who
          is enrolled. The competing readings are not distinguished by the current data: greater room
          for improvement in depleted individuals, versus a resident community in high-abundance individuals
          that resists an added preparation. Note the mechanism cannot simply be colonization for the
          pasteurized product, which is non-viable.'
        proposed_experiments:
        - experiment_id: akkermansia_baseline_stratified_rct
          name: Prospectively stratified maintenance trial by baseline fecal A. muciniphila
          description: Randomize weight-loss-maintenance participants to pasteurized MucT or placebo within
            strata defined prospectively by quantitative fecal A. muciniphila measured before randomization,
            powered on the stratum-by-treatment interaction rather than on the marginal effect, with fecal
            energy excretion measured against total daily fecal output.
          decision_criterion: Baseline abundance is a genuine response modifier if the stratum-by-treatment
            interaction on weight regain is significant in a prospectively powered design; it is an artifact
            of the post hoc median split otherwise.
      selected_evidence:
        snippet: Initial Akkermansia spp. abundance was associated with cardiometabolic response to MucT.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
