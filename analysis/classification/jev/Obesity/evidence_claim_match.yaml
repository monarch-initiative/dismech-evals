        biological_scale: ORGANISM
        description: 'After energy restriction the body defends its previous mass through a coordinated
          set of responses: resting energy expenditure falls disproportionately to fat-free mass, anorexigenic
          signals fall while orexigenic signals rise, and shrinking adipocytes generate extracellular-matrix
          stress and immune activation in subcutaneous adipose tissue. Adipose tissue additionally retains
          a transcriptional and epigenetic memory of the prior obese state that primes it for accelerated
          regain. This node, rather than weight loss itself, is what maintenance therapy targets.

          '
        biological_processes:
        - preferred_term: defense of pre-diet body mass
          term:
            id: GO:0097009
            label: energy homeostasis
      selected_evidence:
        snippet: we show that weight loss-induced variations in cellular stress, extracellular matrix
          remodelling, inflammatory responses, adipokine secretion and lipolysis seem to be associated
          with the amount of weight that is regained after successful weight loss
        supports: SUPPORT
