              30 minutes at 70 C; 3 x 10^10 inactivated cells per capsule) taken during the weight maintenance
              phase that follows a low-energy diet. Heat inactivation removes the oxygen sensitivity and
              manufacturing constraints of the live organism while preserving the thermostable outer-membrane
              protein Amuc_1100, and in rodents it increased rather than abolished the metabolic benefit.
              The indication tested is maintenance of weight already lost, not weight loss itself.

              '
