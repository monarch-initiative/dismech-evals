  a1c3a34c7606c2a17a5662a13da917b0cec5e59918c267e22aeb2336ca9d66f6:
    claim:
      about:
        disease:
          name: Obesity
          disease_term:
            preferred_term: obesity disorder
            term:
              id: MONDO:0011122
              label: obesity disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Depletion of Mucosal Symbiont Akkermansia muciniphila
        description: 'Akkermansia muciniphila is a mucin-degrading symbiont of the colonic mucus layer
          that uses host-derived mucus as its primary carbon and nitrogen source, placing it directly
          at the host-microbe interface. Its relative abundance is reduced in obesity, type 2 diabetes
          and metabolic syndrome and correlates inversely with body weight in rodents and humans. Loss
          of this population removes a signal that supports mucus-layer thickness and epithelial barrier
          integrity, and is the state that A. muciniphila-directed interventions are designed to compensate
          for.

          '
        biological_processes:
        - preferred_term: mucus-layer maintenance at the colonic epithelium
          modifier: DECREASED
          term:
            id: GO:0030277
            label: maintenance of gastrointestinal epithelium
        notes: 'The taxon (Akkermansia muciniphila, phylum Verrucomicrobiota; 1-5% of the healthy adult
          fecal microbiome) is deliberately not bound in cell_types, which is CL-only and covers host
          cells. Depletion is consistently reported but the direction of causation in humans is not settled:
          the cohort associations are cross-sectional, and the causal evidence that restoring the organism
          improves metabolism is from rodents.

          '
      selected_evidence:
        snippet: This study demonstrated that the abundance of A. muciniphila decreased in obese and type
          2 diabetic mice.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
