  2302782470febe63ed42e8984a2bc42b075b1f9623eae7bac2aeb9d3f3321767:
    claim:
      about:
        disease:
          name: Obesity Due to MC4R Pathway Disruption
          disease_term:
            preferred_term: obesity due to MC4R pathway disruption
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Xiphophorus Y-linked mc4r copy-number polymorphism (P locus)
        species: Xiphophorus multilineatus and Xiphophorus nigrensis
        genotype: Variable copy number of Y-linked mc4r alleles, including non-signal-transducing copies
          that act dominant-negatively on the functional autosomal receptor
        publication: PMID:20869245
        description: 'Swordtails carry extra mc4r copies on the Y chromosome, and some of those copies
          encode receptors that bind ligand but do not transduce a signal. When a non-signalling copy
          is co-expressed with a functional one it suppresses output from the functional receptor, so
          the fish is a naturally occurring allelic series of graded MC4R signalling deficit rather than
          a single knockout. The graded deficit is read out as delayed puberty and continued somatic growth
          rather than as adiposity, which is what makes the model useful: it separates the melanocortin-4
          signalling lesion itself from the energy-storage phenotype that dominates the human presentation,
          and it was the system in which the dominant-negative mechanism of heterozygous MC4R variants
          was worked out on a natural allelic series.'
        genes:
        - preferred_term: MC4R
          term:
            id: hgnc:6932
            label: MC4R
        associated_phenotypes:
        - Delayed onset of sexual maturation in males carrying non-signalling mc4r copies
        - Large adult male body size from prolonged pre-pubertal growth
        - Male size classes with divergent mating behaviour
        notes: Fish do not develop an obesity phenotype, so this model speaks to the receptor-signalling
          node and the energy-balance/reproduction link, not to adipose accumulation. Adiposity claims
          for this entry should continue to rest on mammalian and human evidence.
        modeled_mechanisms:
        - target: MC4R pathway signaling failure
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Non-signalling Y-linked receptor copies suppress signalling from co-expressed functional
            receptor, reproducing the dominant-negative mechanism by which heterozygous human MC4R variants
            reduce pathway output below the level a simple gene-dosage model predicts.
          limitations: The downstream phenotype in fish is pubertal timing and body size, not hyperphagia
            or fat mass, so the model recapitulates the receptor-level lesion but not the clinical endpoint
            of this entry. The receptor copies are Y-linked and vary in number, an architecture with no
            human counterpart, and the fish central melanocortin circuitry has not been shown to match
            the human hypothalamic wiring. Do not transfer quantitative dose-response or pharmacological
            inferences without mammalian corroboration.
          readouts:
          - name: Onset of puberty in males carrying non-signalling mc4r copies
            target: MC4R pathway signaling failure
            description: Timing of sexual maturation compared across males differing in Y-linked mc4r
              copy composition.
            direction: ALTERED
            interpretation: Delayed maturation is the organismal consequence of reduced melanocortin-4
              signalling in this model, and is the measurement that established the dominant-negative
              effect.
      selected_evidence:
        snippet: We show that sequence polymorphisms of the melanocortin receptor 4 gene (mc4r) comprise
          both functional and non-signal-transducing versions and that variation in copy number of mc4r
          genes on the Y chromosome underlies the P locus polymorphism.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
