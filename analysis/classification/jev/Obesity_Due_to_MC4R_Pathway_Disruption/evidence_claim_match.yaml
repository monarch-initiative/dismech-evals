          value:
            name: SIM1
            display_name: SIM1-related monogenic obesity
            subtype_term:
              preferred_term: obesity due to SIM1 deficiency
              term:
                id: MONDO:0018244
                label: obesity due to SIM1 deficiency
            description: 'Severe obesity caused by loss-of-function variants in SIM1, a bHLH-PAS transcription
              factor with a key role in neuronal differentiation in the hypothalamic paraventricular nucleus,
              where MC4R is also expressed. Alleles with strong loss of function segregate with a high
              intra-family risk of obesity, and mouse Sim1 haploinsufficiency produces resistance to hypothalamic
              melanocortin signaling, which places this gene in the same pathway as the receptor-level
              and ligand-level subtypes rather than beside them. Severe obesity occurs both with and without
              Prader-Willi-like features. Contiguous 6q16 deletions that remove SIM1 together with neighbouring
              genes are a separate disease and are curated as 6q16_Deletion_Syndrome; this subtype is
              the intragenic form.

              '
            genes:
            - preferred_term: SIM1
              term:
                id: hgnc:10882
                label: SIM1
          role: subtype
      assertion_type: Genetic
      assertion:
        name: SIM1
        gene_term:
          preferred_term: SIM1
          term:
            id: hgnc:10882
            label: SIM1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        subtype: SIM1
        notes: 'SIM1 is a bHLH-PAS transcription factor with a key role in neuronal differentiation in
          the hypothalamic paraventricular nucleus, in which MC4R is also expressed, so SIM1 loss of function
          reaches obesity through the same melanocortin circuit as the ligand- and receptor-level subtypes
          rather than through a separate pathway. The obesity association tracks the degree of loss of
          function: alleles with strong loss of function segregated with high intra-family risk while
          alleles with mild or no functional effect did not.'
        inheritance:
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Three mutations showed strong loss-of-function effects (p.T46R, p.H323Y, and p.T714A)
          and were associated with high intra-family risk for obesity, while the variants with mild or
          no effects on SIM1 activity were not associated with obesity within families.
        supports: SUPPORT
