  65cef33c950c54bbaae33fe2d2832b987d3e4ccd2dcc57c9f5f7a7fbb3941b8c:
    claim:
      about:
        disease:
          name: Obesity Due to MC4R Pathway Disruption
          disease_term:
            preferred_term: obesity due to MC4R pathway disruption
        context: []
      assertion_type: Subtype
      assertion:
        name: SIM1
        display_name: SIM1-related monogenic obesity
        subtype_term:
          preferred_term: obesity due to SIM1 deficiency
          term:
            id: MONDO:0018244
            label: obesity due to SIM1 deficiency
        description: 'Severe obesity caused by loss-of-function variants in SIM1, a bHLH-PAS transcription
          factor with a key role in neuronal differentiation in the hypothalamic paraventricular nucleus,
          where MC4R is also expressed. Alleles with strong loss of function segregate with a high intra-family
          risk of obesity, and mouse Sim1 haploinsufficiency produces resistance to hypothalamic melanocortin
          signaling, which places this gene in the same pathway as the receptor-level and ligand-level
          subtypes rather than beside them. Severe obesity occurs both with and without Prader-Willi-like
          features. Contiguous 6q16 deletions that remove SIM1 together with neighbouring genes are a
          separate disease and are curated as 6q16_Deletion_Syndrome; this subtype is the intragenic form.

          '
        genes:
        - preferred_term: SIM1
          term:
            id: hgnc:10882
            label: SIM1
        inheritance:
        - name: Autosomal Dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Our genetic and functional studies demonstrate a firm link between SIM1 loss of function
          and severe obesity associated with, or independent of, Prader-Willi-like features.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/10
