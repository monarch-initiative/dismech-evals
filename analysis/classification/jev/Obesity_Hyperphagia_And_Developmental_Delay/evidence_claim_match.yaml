      assertion:
        discussion_id: ntrk2_missense_variant_interpretation
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#NTRK2 Heterozygous Loss of Function
        prompt: Which rare NTRK2 missense variants found in children with obesity and developmental delay
          reduce TrkB function, and how should a variant that signals normally in vitro be interpreted?
        rationale: Of four rare missense variants found in a cohort of severely obese children with developmental
          delay, only one impaired signaling in vitro. Missense variants in the transmembrane domain have
          the opposite effect and cause a different disorder. Classifying a new missense variant therefore
          depends on functional testing of its direction of effect.
        proposed_experiments:
        - experiment_id: ntrk2_variant_functional_panel
          name: Functional panel of NTRK2 missense variants
          description: Measure BDNF-stimulated TrkB autophosphorylation and downstream MAPK, PLC-gamma
            and Akt activation for reported NTRK2 missense variants from both phenotype groups, alongside
            wild type, to classify each variant's direction of effect.
          would_support:
          - pathophysiology#NTRK2 Heterozygous Loss of Function
      selected_evidence:
        snippet: However, the signaling properties of I98V, P660L and T821A were all indistinguishable
          from wild type.
        supports: SUPPORT
