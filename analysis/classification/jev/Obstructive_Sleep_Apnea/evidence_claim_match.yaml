      assertion:
        name: Sleep Fragmentation
        description: 'Frequent arousals to restore airway patency disrupt sleep architecture, reducing
          restorative sleep and causing daytime sleepiness. The arousal is simultaneously the corrective
          mechanism and a source of injury, which makes the arousal threshold genuinely double-edged rather
          than a severity marker: a low threshold is its own endotype, since patients who arouse too readily
          terminate events before dilator recruitment can stabilise the airway.

          '
        role: amplifier
        biological_scale: ORGANISM
        conforms_to: sleep_disordered_breathing_intermittent_hypoxia#Recurrent Apnoea-Hypopnoea with Arousal
          from Sleep
        biological_processes:
