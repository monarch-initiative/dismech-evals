  fa624e3513d8878b95487a428ea673c1a804f4e917c00f9288a313a08e61eba3:
    claim:
      about:
        disease:
          name: Obstructive Sleep Apnea
          disease_term:
            preferred_term: obstructive sleep apnea syndrome
            term:
              id: MONDO:0007147
              label: obstructive sleep apnea syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kgap_osa_pap_cardiovascular_mechanism
        prompt: Does positive airway pressure (PAP) therapy mechanistically interrupt the OSA-driven cardiovascular
          pathways (intermittent hypoxia → oxidative stress → sympathetic activation → inflammation) to
          prevent cardiovascular events, or do improved intermediate parameters not reliably translate
          to hard cardiovascular endpoints?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#CPAP
        - treatments#BiPAP
        rationale: 'Obstructive sleep apnea has well-established pathophysiological mechanisms linking
          it to cardiovascular disease (intermittent hypoxia, sympathetic activation, oxidative stress,
          systemic inflammation). However, randomized controlled trials of PAP therapy show inconsistent
          results for reducing cardiovascular events and mortality, despite improvements in intermediate
          markers (apnea-hypopnea index, oxygen saturation, daytime sleepiness) and intermediate cardiometabolic
          parameters. This suggests that either (1) mechanistic pathways are disrupted by PAP in animal
          models but less effectively in humans, (2) intermediate-parameter improvement alone does not
          guarantee hard-endpoint benefit, or (3) treatment efficacy is dependent on phenotype-specific
          or adherence-dependent factors not yet characterized. The gap is not at the OSA pathophysiology
          level but at the PAP-therapy-response level: which OSA endotypes truly benefit from PAP, through
          which mechanism, and under which adherence/severity conditions.'
        proposed_experiments:
        - experiment_id: exp_osa_pap_endotype_stratified_rct
          name: Endotype-stratified PAP randomized cardiovascular outcome trial
          description: Enroll OSA patients prospectively phenotyped for physiological endotypes (loop
            gain, arousal threshold, upper-airway collapsibility, pharyngeal muscle responsiveness) and
            the hypoxic burden, then randomize to PAP versus control with hard cardiovascular endpoints
            (MACE, cardiovascular mortality). Test whether high-hypoxic-burden or sympathetically driven
            endotypes derive cardiovascular benefit that is diluted in unselected cohorts, clarifying
            which OSA endotypes truly benefit mechanistically.
          experiment_type:
            preferred_term: endotype-stratified randomized controlled trial
        - experiment_id: exp_osa_pap_adherence_doseresponse_mace
          name: Adherence-threshold dose-response analysis of PAP and cardiovascular events
          description: Using telemonitored objective PAP usage, model the dose-response relationship between
            nightly adherence hours and incident major adverse cardiovascular events, testing for an adherence
            threshold above which cardiovascular risk reduction emerges. This separates true biological
            inefficacy from undertreatment as the explanation for inconsistent RCT results, since prior
            trials averaged ~3-4 hours nightly use.
          experiment_type:
            preferred_term: adherence dose-response cohort analysis
      selected_evidence:
        snippet: Although PAP therapy improves symptoms, apnea-hypopnea index, and intermediate cardiometabolic
          parameters-particularly among adherent patients-randomized controlled trials have yielded inconsistent
          results for reducing cardiovascular events and mortality.
        supports: SUPPORT
