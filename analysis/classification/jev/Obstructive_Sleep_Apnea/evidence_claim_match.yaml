      assertion_type: Pathophysiology
      assertion:
        name: TLR4 Upregulation
        description: 'Intermittent hypoxia and hypoxia-reoxygenation cycles trigger upregulation of Toll-like
          receptor 4 (TLR4), a pattern-recognition receptor that recognizes damage-associated molecular
          patterns (DAMPs) released by tissue injury. TLR4 upregulation in response to IH is observed
          across multiple tissues including the heart, liver, and central nervous system.

          '
        biological_processes:
        - preferred_term: Toll-like receptor 4 signaling pathway
          term:
            id: GO:0034142
            label: toll-like receptor 4 signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: In male rats and mice, chronic IH simulating the repeated apnea events of OSA increased
          TLR4 expression in the heart, liver, and hippocampus
        supports: SUPPORT
