          modifier: INCREASED
        - preferred_term: Meibomian Lipid Metabolism
          term:
            id: GO:0006629
            label: lipid metabolic process
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Tear film stability is disrupted by inflammation and lacrimal and meibomian glands dysfunction,
          which are caused by intermittent hypoxia and associated oxidative stress in OSA.
