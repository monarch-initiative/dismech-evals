          term:
            id: GO:0006937
            label: regulation of muscle contraction
          modifier: DECREASED
        locations:
        - preferred_term: pharynx
          term:
            id: UBERON:0001042
            label: chordate pharynx
      selected_evidence:
        snippet: Obstructive sleep apnea syndrome (OSAS) is characterized by intermittent hypoxia (IH)
