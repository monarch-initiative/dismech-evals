              label: obstructive sleep apnea syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intermittent Hypoxia
        description: 'Repeated cycles of oxygen desaturation followed by rapid reoxygenation. The cyclical
          character is the mechanistically important part: it is the reoxygenation phase, ischaemia-reperfusion-like,
          that generates the burst of reactive oxygen species driving oxidative stress, sympathetic activation
          and systemic inflammation. An equivalent time-averaged desaturation delivered continuously does
          not reproduce the phenotype, which is why this node - and not the apnoea count - is the causal
          quantity for the systemic sequelae.

          '
        role: central_effector
        biological_scale: ORGANISM
        conforms_to: sleep_disordered_breathing_intermittent_hypoxia#Chronic Intermittent Hypoxia and
          Reoxygenation
        biological_processes:
        - preferred_term: Response to Hypoxia
          term:
            id: GO:0001666
            label: response to hypoxia
          modifier: INCREASED
      selected_evidence:
        snippet: IH increases oxygen free radicals (ROS) and reduces antioxidant capacities.
        supports: SUPPORT
