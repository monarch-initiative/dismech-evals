      assertion_type: Pathophysiology
      assertion:
        name: Upper Airway Collapse
        description: 'During sleep the wakefulness-dependent tonic drive to the pharyngeal dilator muscles
          is withdrawn, and where the underlying airway is anatomically narrow or collapsible the soft
          tissues occlude, obstructing airflow against continued respiratory effort. Anatomical factors
          (retrognathia, adenotonsillar hypertrophy, obesity and parapharyngeal fat) set the collapsibility,
          but they are not the whole mechanism: whether an individual obstruction becomes a self-limited
          event or the start of a cycling pattern depends on the non-anatomic endotypic traits curated
          in the node below.

          '
        role: trigger
        biological_scale: TISSUE
        conforms_to: sleep_disordered_breathing_intermittent_hypoxia#Sleep-Related Loss of Upper Airway
          Dilator Compensation in a Collapsible Pharynx
