      assertion:
        name: MAPK Cascade Activation
        description: 'Downstream of TLR4/MyD88 signaling, and in parallel with rather than downstream
          of NF-κB, mitogen-activated protein kinase (MAPK) family members (p38, ERK1/2, JNK) undergo
          phosphorylation. These phosphorylated MAPK kinases activate additional transcription factors
          including AP-1, amplifying the pro-inflammatory response and driving robust production of cytokines
          such as TNF-α, IL-6, IL-8, and IL-1β.

          '
        biological_processes:
        - preferred_term: MAPK cascade
          term:
            id: GO:0000165
            label: MAPK cascade
          modifier: INCREASED
      selected_evidence:
        snippet: In male rats, chronic IH led to the increased phosphorylation of p38, extracellular signal-regulated
          kinases (ERKs), and c-Jun N-terminal kinase (JNK) in pancreatic tissue, which were associated
          with pancreatic inflammation
        supports: SUPPORT
