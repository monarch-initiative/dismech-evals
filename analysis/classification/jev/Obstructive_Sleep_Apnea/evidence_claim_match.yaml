        role: consequence
        biological_scale: TISSUE
        description: 'Intermittent hypoxia and the associated oxidative stress in OSA drive ocular surface
          and systemic inflammation together with lacrimal gland dysfunction (reduced aqueous tear production)
          and meibomian gland dysfunction (dysregulated meibum lipid secretion). The resulting tear film
          instability produces both aqueous-deficient and evaporative dry eye disease. Mechanical factors
          such as face-down sleeping positions, habitual eye rubbing, and CPAP airflow leakage or retrograde
          air movement further aggravate meibomian gland dysfunction and ocular surface drying.

          '
        cell_types:
