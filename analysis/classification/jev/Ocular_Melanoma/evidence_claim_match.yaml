      assertion_type: Pathophysiology
      assertion:
        name: Conjunctival Lymphatic and Regional Nodal Spread
        biological_scale: ORGANISM
        role: consequence
        mechanism_confidence: ESTABLISHED
        description: Unlike the uvea, the conjunctiva has a rich lymphatic network. Conjunctival melanoma
          therefore metastasises first and predominantly to the regional (preauricular, submandibular,
          cervical) lymph nodes, with distant spread to lung, liver and brain occurring later. Regional
          nodal metastasis is a substantial contributor to conjunctival melanoma mortality; specific nodal
          and disease-specific-mortality rates are not asserted here because no quotable figure could
          be verified against a cached source (see notes). This lymphatic-first route is the direct mechanistic
          opposite of uveal melanoma's lymphatic-free, liver-dominant haematogenous route, and it is why
          sentinel-node assessment is relevant in conjunctival but not uveal disease.
        locations:
        - preferred_term: conjunctiva
          term:
            id: UBERON:0001811
            label: conjunctiva
        biological_processes:
        - preferred_term: cell migration
          modifier: INCREASED
          term:
            id: GO:0016477
            label: cell migration
      selected_evidence:
        snippet: "Co-M is often \nmisdiagnosed or overlooked, leading to vision loss either from the destructive\
          \ \neffects of the tumour or side effects of therapy, facial disfigurement from \nradical surgery,\
          \ and death from metastases."
        supports: SUPPORT
