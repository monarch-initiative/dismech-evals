        description: 'Uveal melanoma is usually diagnosed clinically by an ocular oncologist, without
          biopsy, on dilated fundus examination (slit-lamp examination for anterior tumours) combined
          with A- and B-scan ultrasonography. Ultrasound is the workhorse: melanoma is characteristically
          low-reflective and acoustically "hollow", which separates it from the high-reflectivity of choroidal
          haemangioma and metastasis. Optical coherence tomography and fundus autofluorescence add subretinal-fluid
