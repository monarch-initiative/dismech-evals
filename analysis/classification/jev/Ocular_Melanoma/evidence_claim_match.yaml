      assertion_type: DifferentialDiagnosis
      assertion:
        name: Ocular Surface Squamous Neoplasia
        description: The main non-melanocytic differential for a limbal ocular-surface mass, spanning
          conjunctival intraepithelial neoplasia to invasive squamous cell carcinoma. Shares the UV-exposed
          limbal niche and the risk-factor profile (UV, fair skin, older age, immunosuppression, HPV)
          with conjunctival melanoma.
        distinguishing_features:
        - Gelatinous, papilliform or leukoplakic pink-to-white appearance rather than a pigmented lesion
        - Prominent feeder vessels at the limbus
        - Amelanotic conjunctival melanoma can look very similar and is a recognised source of misdiagnosis,
          so clinical appearance alone is not sufficient
        - Histology with melanocytic immunohistochemistry (SOX10, Melan-A, HMB45) is definitive
        disease_term:
          preferred_term: ocular surface squamous neoplasia
          term:
            id: MONDO:0971056
            label: ocular surface squamous neoplasia
      selected_evidence:
        snippet: "Co-M is often \nmisdiagnosed or overlooked, leading to vision loss either from the destructive\
          \ \neffects of the tumour or side effects of therapy"
