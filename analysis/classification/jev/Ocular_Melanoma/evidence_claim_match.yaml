              id: MONDO:0006325
              label: ocular melanoma
        context: []
      assertion_type: Treatment
      assertion:
        name: Tebentafusp
        description: 'A gp100 x CD3 bispecific ImmTAC (immune-mobilising monoclonal T-cell receptor against
          cancer): an affinity-enhanced soluble T-cell receptor that binds the gp100 peptide-HLA-A*02:01
          complex on melanoma cells, fused to an anti-CD3 arm that recruits polyclonal T cells to kill
          them. The first and only systemic agent with a randomised overall-survival benefit in metastatic
          uveal melanoma, sustained at three years. Restricted to HLA-A*02:01-positive patients (roughly
          half). Toxicity is dominated by early, self-limiting cytokine-mediated events and by on-target
          attack on normal melanocytes - rash in 83%, pyrexia in 76%, pruritus in 70% - but discontinuation
          for toxicity is rare (2%).'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: tebentafusp
            term:
              id: NCIT:C94208
              label: Tebentafusp
      selected_evidence:
        snippet: "CONCLUSIONS: Treatment with tebentafusp resulted in longer overall survival than \n\
          the control therapy among previously untreated patients with metastatic uveal \nmelanoma."
        supports: SUPPORT
