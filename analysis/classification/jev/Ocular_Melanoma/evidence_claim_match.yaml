      assertion:
        name: Haematogenous Dissemination Without Lymphatic Drainage
        biological_scale: ORGANISM
        role: effector
        conforms_to: invasion_and_metastasis#Circulatory Survival and Extravasation
        mechanism_confidence: ESTABLISHED
        description: The uveal tract has no lymphatic drainage, so uveal melanoma disseminates exclusively
          by the blood. Tumour cells intravasate directly into the dense choroidal vasculature and enter
          the systemic circulation, often long before the primary tumour is treated - which is why excellent
          local control does not prevent metastatic death. Dissemination is believed to be an early event,
          with occult micrometastases persisting in a dormant state for years to decades; fewer than 2%
          of patients have radiologically detectable metastases at diagnosis, yet a third to a half develop
          them over the following 15 years. This is the mechanistic point at which uveal and conjunctival
          melanoma diverge most sharply.
        locations:
        - preferred_term: uvea
          term:
            id: UBERON:0001768
            label: uvea
        biological_processes:
        - preferred_term: cell migration
          modifier: INCREASED
          term:
            id: GO:0016477
            label: cell migration
      selected_evidence:
        snippet: One category, uveal melanoma, arises from melanocytes within the choroidal plexus of
          the eye and is biologically distinct from cutaneous melanoma by characteristic cytogenetic alterations4
          and a very strong propensity to metastasize to the liver5.
        supports: SUPPORT
