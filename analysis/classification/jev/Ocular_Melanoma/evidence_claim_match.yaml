              This is NOT a uveal melanoma and must not be conflated with one: it is an ocular-surface
              mucosal melanoma whose driver landscape (BRAF, NRAS, NF1, TERT promoter, UV signature) resembles
              cutaneous rather than uveal melanoma, it usually arises from a conjunctival melanocytic
              intraepithelial precursor lesion, and it spreads first through conjunctival lymphatics to
              regional nodes rather than by the liver-dominant haematogenous route of uveal disease. Incidence
              is roughly 1 per million per year and rising.'
