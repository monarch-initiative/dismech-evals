        context: []
      assertion_type: Treatment
      assertion:
        name: Percutaneous Hepatic Perfusion with Melphalan
        description: 'Liver-directed regional chemotherapy: melphalan is infused into the hepatic artery
          while hepatic venous effluent is captured and filtered extracorporeally, delivering a hepatic
          dose far above what systemic administration would tolerate. This is the therapeutic answer to
          the hepatotropism modelled in this entry - the liver is the dominant and often only metastatic
          site, so treating it regionally is disease-appropriate rather than palliative. In a randomised
          study against best alternative care, all efficacy endpoints favoured melphalan/hepatic delivery
          system, though the trial converted to a single-arm design because of slow accrual and its comparative
          analyses are therefore exploratory. Other liver-directed options used in practice include resection
          or ablation of oligometastatic disease, and chemo-, radio- or immunoembolization.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: percutaneous hepatic perfusion
          term:
            id: NCIT:C148433
            label: Percutaneous Hepatic Perfusion
          therapeutic_agent:
          - preferred_term: melphalan
            term:
              id: CHEBI:28876
              label: melphalan
        notes: Only percutaneous hepatic perfusion is curated as a discrete treatment because it is the
          liver-directed modality with randomised comparative data. Resection or ablation of oligometastatic
          disease, chemoembolization, radioembolization and immunoembolization are all used in practice
          but are supported here only by the deep-research narrative, so they are described rather than
          asserted.
      selected_evidence:
        snippet: "Melphalan/Hepatic Delivery System (Melphalan/HDS) is a drug/medical device combination\
          \ used for \nliver-directed treatment of unresectable mUM patients."
        supports: SUPPORT
    origin:
      assertion_path: /treatments/6
      evidence_path: /treatments/6/evidence/0
