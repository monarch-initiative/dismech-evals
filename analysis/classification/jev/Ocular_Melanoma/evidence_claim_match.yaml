        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Gq/G11 Alpha Subunit Activating Mutation
        genetic_context:
          variant_origin: SOMATIC
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion
        mechanism_confidence: ESTABLISHED
        description: The initiating lesion of uveal melanoma is a somatic activating mutation in the heterotrimeric
          G-protein alpha subunits GNAQ or GNA11, occurring almost always at Q209 (in the Ras-like domain,
          the residue essential for GTP hydrolysis) and less often at R183. Loss of intrinsic GTPase activity
          locks the alpha subunit in its GTP-bound, constitutively active state, turning it into a dominant-acting
          oncogene. GNAQ and GNA11 mutations are mutually exclusive and together account for roughly 83%
          of primary uveal melanomas; the rare GNAQ/GNA11-wild-type tumours instead carry activating CYSLTR2
          p.Leu129 or PLCB4 p.Asp630 mutations, which enter the same pathway one step above or below.
          These are early events, present already in benign uveal naevi, and are not themselves prognostic.
        locations:
        - preferred_term: uvea
          term:
            id: UBERON:0001768
            label: uvea
        cell_types:
        - preferred_term: choroidal melanocyte
          term:
            id: CL:4030000
            label: choroidal melanocyte
        molecular_functions:
        - preferred_term: GTPase activity
          modifier: DECREASED
          term:
            id: GO:0003924
            label: GTPase activity
        biological_processes:
        - preferred_term: phospholipase C-activating G protein-coupled receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007200
            label: phospholipase C-activating G protein-coupled receptor signaling pathway
        genes:
        - preferred_term: GNAQ
          term:
            id: hgnc:4390
            label: GNAQ
        - preferred_term: GNA11
          term:
            id: hgnc:4379
            label: GNA11
        - preferred_term: CYSLTR2
          term:
            id: hgnc:18274
            label: CYSLTR2
        - preferred_term: PLCB4
          term:
            id: hgnc:9059
            label: PLCB4
      selected_evidence:
        snippet: "The mutations occur exclusively in codon 209 in the Ras-like domain and \nresult in\
          \ constitutive activation, turning GNAQ into a dominant acting oncogene."
        supports: SUPPORT
