      assertion_type: Pathophysiology
      assertion:
        name: gp100-Directed T-Cell Redirection
        biological_scale: CELLULAR
        role: therapeutic_vulnerability
        mechanism_confidence: ESTABLISHED
        description: 'Uveal melanoma cells retain melanocytic lineage antigen expression, including glycoprotein
          100 (gp100/PMEL). Tebentafusp is an immune-mobilising monoclonal T-cell receptor against cancer
          (ImmTAC): an affinity-enhanced soluble TCR that binds a gp100 peptide presented by HLA-A*02:01,
          fused to an anti-CD3 effector arm that recruits and activates any polyclonal T cell irrespective
          of its own specificity. This side-steps the low-neoantigen problem entirely, and it is the first
          mechanism to deliver a randomised overall-survival benefit in metastatic uveal melanoma. The
          obligatory dependence on HLA-A*02:01 presentation restricts eligibility to roughly half of patients,
          and the on-target/off-tumour attack on normal gp100-positive melanocytes produces the characteristic
          early rash and cytokine-mediated pyrexia.'
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
        - preferred_term: T cell mediated cytotoxicity
          modifier: INCREASED
          term:
            id: GO:0001913
            label: T cell mediated cytotoxicity
        genes:
        - preferred_term: PMEL
          term:
            id: hgnc:10880
            label: PMEL
      selected_evidence:
        snippet: Overall survival at 1 year was 73% in the tebentafusp group and 59% in the control group
        supports: SUPPORT
