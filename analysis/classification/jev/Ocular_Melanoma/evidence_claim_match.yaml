      assertion_type: Pathophysiology
      assertion:
        name: BAP1 Loss with Monosomy 3
        biological_scale: MOLECULAR
        role: driver
        mechanism_confidence: ESTABLISHED
        description: The single strongest determinant of metastatic risk in uveal melanoma is biallelic
          inactivation of BAP1, a nuclear deubiquitinase acting in chromatin regulation and the DNA-damage
          response, on chromosome 3p21.1. Inactivation typically combines a somatic truncating or ubiquitin-hydrolase-domain
          mutation on one allele with loss of the other chromosome 3 (monosomy 3). Integrative TCGA analysis
          showed that BAP1 loss follows monosomy 3 in the evolutionary sequence and imposes a globally
          distinct DNA methylation state, defining the class-2 / poor-prognosis phenotype with epithelioid
          morphology and early metastasis. A minority of patients carry a germline BAP1 variant (BAP1
          tumour-predisposition syndrome), which also raises risk of mesothelioma, cutaneous melanoma
          and clear-cell renal carcinoma.
        cell_types:
        - preferred_term: choroidal melanocyte
          term:
            id: CL:4030000
            label: choroidal melanocyte
        biological_processes:
        - preferred_term: protein deubiquitination
          modifier: DECREASED
          term:
            id: GO:0016579
            label: protein deubiquitination
        - preferred_term: chromatin organization
          modifier: ABNORMAL
          term:
            id: GO:0006325
            label: chromatin organization
        genes:
        - preferred_term: BAP1
          term:
            id: hgnc:950
            label: BAP1
      selected_evidence:
        snippet: "We show that BAP1 loss follows M3 occurrence and correlates with a global DNA \nmethylation\
          \ state that is distinct from D3-UM."
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/1
