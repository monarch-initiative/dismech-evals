        context: []
      assertion_type: Treatment
      assertion:
        name: BAP1 Carrier Ocular Surveillance and Genetic Counselling
        description: For individuals with a germline BAP1 pathogenic variant, GeneReviews recommends annual
          dilated eye examination from age 11-18 years (or puberty) with referral to an ocular oncologist
          for any pigmented lesion, alongside cascade genetic testing of at-risk relatives once a familial
          variant is known. Because BAP1-related uveal melanoma behaves like a class-2 / monosomy-3 tumour,
          treatment of a detected tumour should follow the more aggressive pathway rather than being de-escalated
          for early detection. This is a surveillance and counselling intervention, not a mechanism-directed
          therapy, so it deliberately carries no target_mechanisms link.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: "UM treatment should be the same as the more \naggressive class 2 or monosomy 3 tumors\
          \ because of the increased aggressiveness \nof BAP1-related UM."
        supports: SUPPORT
    origin:
      assertion_path: /treatments/7
      evidence_path: /treatments/7/evidence/1
      context_paths:
