            mechanism_confidence: ESTABLISHED
            description: Approximately half of uveal melanoma patients ultimately develop metastatic disease,
              and it is overwhelmingly hepatotropic - the liver is the first and dominant site in around
              90% of cases, with lung and bone distant seconds. Colonisation of the liver, not intravasation,
              is the rate-limiting step; dormant micrometastases must acquire an angiogenic and immune-evasive
              programme in the hepatic niche before becoming clinically detectable. Once liver metastasis
              is established, historical median survival is on the order of 6-12 months and hepatic tumour
              burden is the leading cause of death, which is why liver-directed therapy remains central
              to management.
