        biological_scale: TISSUE
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: The conjunctival arm of ocular melanoma begins in a fundamentally different compartment
          - the stratified squamous/mucosal epithelium of the conjunctival surface, which is UV-exposed
          and lymphatic-bearing. Most conjunctival melanomas arise from a precursor field of atypical
          intraepithelial melanocytic proliferation (conjunctival melanocytic intraepithelial lesion,
          formerly primary acquired melanosis with atypia); a minority arise in a pre-existing naevus
          or de novo. Because the precursor is a diffuse field rather than a discrete mass, incomplete
          excision leaves residual atypical epithelium and drives the high (roughly a third to a half)
          local recurrence rate that dominates conjunctival melanoma morbidity.
        locations:
        - preferred_term: conjunctiva
          term:
            id: UBERON:0001811
            label: conjunctiva
        cell_types:
