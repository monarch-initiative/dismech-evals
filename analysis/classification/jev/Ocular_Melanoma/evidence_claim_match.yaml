      assertion:
        name: Ultraviolet Radiation Exposure
        exposure_term:
          preferred_term: exposure to ultraviolet radiation
          term:
            id: ECTO:0000006
            label: exposure to ultraviolet radiation
        presence: PRESENT
        description: 'Ultraviolet exposure is a credible aetiological factor for conjunctival melanoma,
          which is an ocular-surface tumour carrying a UV mutational signature and cutaneous-type drivers.
          Its role in posterior uveal melanoma is far weaker and contested: the choroid is sun-shielded,
          uveal melanoma has a low mutational burden without a dominant UV signature, and the R183 mutations
          that do show C-to-T transitions are a small minority of drivers. This asymmetry should not be
          flattened into a single "UV causes ocular melanoma" claim.'
        effect: RISK_FACTOR
      selected_evidence:
        snippet: 'Conversely, conjunctival and

          eyelid melanoma exhibits greater molecular similarity to cutaneous melanoma,

          commonly involving BRAF, NRAS, NF1, and TERT promoter mutations.'
        supports: SUPPORT
