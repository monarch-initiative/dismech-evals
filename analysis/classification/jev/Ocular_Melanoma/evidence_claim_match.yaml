      assertion_type: Treatment
      assertion:
        name: Plaque Brachytherapy
        description: Episcleral radioactive plaque (typically iodine-125 or ruthenium-106) sutured over
          the tumour base. The globe-preserving first-line local therapy for most small and medium uveal
          melanomas, achieving high local control. Radiation retinopathy, maculopathy, optic neuropathy,
          cataract and neovascular glaucoma are the principal late toxicities. Local control does not
          reduce metastatic risk, because dissemination generally predates treatment.
        therapeutic_modality: RADIOTHERAPY
        treatment_term:
          preferred_term: episcleral plaque brachytherapy
          term:
            id: NCIT:C15195
            label: Brachytherapy
        notes: The SEER analysis also shows that this shift to globe-preserving radiation did not improve
          five-year relative survival, which is the clearest available demonstration that local therapy
          choice does not alter metastatic outcome.
      selected_evidence:
        snippet: "A corresponding increase \nwas observed in radiation as primary treatment selection\
          \ (1.3% from 1973 to 1975 \nvs. 68.3% from 2012 to 2013)."
        supports: SUPPORT
