      assertion:
        name: Retinoblastoma
        description: The commonest primary intraocular malignancy of childhood, and the key age-based
          differential for an intraocular mass. Arises from the retina via biallelic RB1 inactivation,
          not from melanocytes.
        distinguishing_features:
        - Presents in early childhood, about 95% before age 5, versus adult onset for uveal melanoma
        - Arises in the retina and is non-pigmented
        - Characteristic intralesional calcification on ultrasound or CT, which uveal melanoma does not
          show
        - Leukocoria or strabismus as presenting signs
        - Definitive on RB1 genetics and on histology (Flexner-Wintersteiner rosettes)
        disease_term:
          preferred_term: retinoblastoma
          term:
            id: MONDO:0008380
            label: retinoblastoma
      selected_evidence:
        snippet: Uveal melanoma (UM) is the most common intraocular malignancy in adults.
        supports: SUPPORT
