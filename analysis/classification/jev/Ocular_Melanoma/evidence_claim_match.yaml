  9521f673835e2ef1fc21fc9a1951a01e338be8ac5847208cc9a32477e8c09afb:
    claim:
      about:
        disease:
          name: Ocular Melanoma
          disease_term:
            preferred_term: ocular melanoma
            term:
              id: MONDO:0006325
              label: ocular melanoma
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Choroidal Naevus
        description: A benign choroidal melanocytic lesion, orders of magnitude commoner than choroidal
          melanoma and the single most frequent lesion to be distinguished from it. Naevi and melanomas
          share the same GNAQ/GNA11 initiating mutation, so the distinction is not molecular but clinical
          and morphological.
        distinguishing_features:
        - Flat or minimally elevated (under about 2 mm thickness) and under about 5 mm in basal diameter,
          whereas melanoma is thicker and larger
        - No subretinal fluid, orange lipofuscin pigment, or symptoms; each of these features shifts the
          diagnosis toward melanoma
        - Stable on serial imaging - documented growth is the decisive discriminator
        - Overlying drusen or a surrounding halo favour a naevus; ultrasonographic acoustic hollowness
          favours melanoma
        notes: Deliberately left with NO bound disease_term. MONDO has no distinct "choroidal naevus"
          class at the time of curation, and the nearest ocular melanocytic-naevus concept - nevus of
          Ota / oculodermal melanocytosis (MONDO:0016984) - is a periorbital-dermal and scleral melanocytosis,
          not a choroidal naevus; binding it here would be semantically wrong. Per the dismech review
          convention, no term is preferable to a misleading one. A dedicated choroidal-naevus MONDO term
          is a candidate new-term request. Nevus of Ota is separately (and correctly) curated in this
          entry as a uveal melanoma risk factor under environmental.
      selected_evidence:
        snippet: In our experiments, GNAQ behaves similar to the oncogenes, BRAF and NRAS, in that its
          mutation is insufficient for full progression to melanoma.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
