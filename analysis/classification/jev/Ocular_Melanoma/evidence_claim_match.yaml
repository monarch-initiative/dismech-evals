      assertion_type: Treatment
      assertion:
        name: Wide Local Excision with Adjuvant Cryotherapy
        description: 'The standard local treatment for conjunctival melanoma: a "no-touch" complete excision
          with wide margins and careful specimen orientation, combined with cryotherapy to the conjunctival
          margins to eradicate residual atypical intraepithelial melanocytes. Adjuvant topical mitomycin
          C or interferon, plaque or proton radiotherapy, and - for orbital invasion - exenteration are
          added according to margin status, multifocality and depth of invasion. Recurrence remains common
          because the precursor lesion is a field rather than a discrete mass.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: excision with adjuvant margin cryosurgery
          term:
            id: NCIT:C15215
            label: Cryosurgery
      selected_evidence:
        snippet: "Due to its rarity, there is limited \nevidence for diagnosis and management; hence,\
          \ there is no standardised treatment \nand not all cases are referred to a specialised ocular\
          \ oncology centre."
        supports: SUPPORT
