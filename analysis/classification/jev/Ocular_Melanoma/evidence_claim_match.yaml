      assertion:
        name: Hepatic metastatic surveillance imaging
        description: 'Because roughly half of uveal melanoma patients metastasise, almost always to the
          liver, and because local control does not change that risk, risk-adapted hepatic imaging (ultrasound,
          CT or MRI) is performed indefinitely after treatment, with interval set by the molecular risk
          group. A clinically important negative: normal liver function tests do NOT exclude hepatic metastasis
          and must not be used as a substitute for imaging.'
