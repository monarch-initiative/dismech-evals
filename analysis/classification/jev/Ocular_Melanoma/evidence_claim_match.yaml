              term:
                id: ECTO:0000006
                label: exposure to ultraviolet radiation
            presence: PRESENT
            description: 'Ultraviolet exposure is a credible aetiological factor for conjunctival melanoma,
              which is an ocular-surface tumour carrying a UV mutational signature and cutaneous-type
              drivers. Its role in posterior uveal melanoma is far weaker and contested: the choroid is
              sun-shielded, uveal melanoma has a low mutational burden without a dominant UV signature,
              and the R183 mutations that do show C-to-T transitions are a small minority of drivers.
              This asymmetry should not be flattened into a single "UV causes ocular melanoma" claim.'
            effect: RISK_FACTOR
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: UV-Associated BRAF/NRAS/NF1 Driver Activation
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: UV exposure is proposed to contribute to BRAF/NRAS/NF1-associated conjunctival melanoma,
          whose sun-exposed surface and cutaneous-type drivers differ from the sun-shielded choroid. The
          dominant uveal driver site lacks a UV signature, although a minority uveal site shows UV-type
          changes. The proposed relationship is restricted to the conjunctival arm; it does not establish
          a general UV cause for uveal melanoma.
      selected_evidence:
        snippet: These alterations are characteristic mutational patterns induced by ultraviolet light23,24
          and are found with markedly increased frequency in cutaneous melanomas arising on sun-exposed
          skin.
        supports: SUPPORT
