          and for essentially all primary intraocular melanoma in adults. Initiated by GNAQ/GNA11 (or
          CYSLTR2/PLCB4) activating mutations, stratified prognostically by BAP1/SF3B1/EIF1AX status and
          chromosome 3/8q copy number, and characterised by haematogenous liver-dominant metastasis. Curated
          in depth as its own dismech entry (Uveal_Melanoma).
        subtype_term:
          preferred_term: uveal melanoma
          term:
            id: MONDO:0006486
            label: uveal melanoma
