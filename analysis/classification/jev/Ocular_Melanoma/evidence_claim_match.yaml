        mechanism_confidence: ESTABLISHED
        description: 'Unlike UV-driven cutaneous melanoma, uveal melanoma carries a very low tumour mutational
          burden (of the order of 0.5 mutations per megabase) and therefore presents few neoantigens.
          Combined with the immune-privileged ocular environment, this yields an immunologically cold
          tumour in which PD-1 and CTLA-4 blockade - transformative in cutaneous melanoma - achieves only
          marginal response rates. This is an important negative mechanistic claim for this entry: the
          presence of a checkpoint axis is NOT the operative mechanism here, and the entry deliberately
          does not declare conformance to the immune_checkpoint_blockade module. The therapeutic solution
          instead bypasses neoantigen dependence altogether by redirecting T cells against a lineage antigen.'
        cell_types:
