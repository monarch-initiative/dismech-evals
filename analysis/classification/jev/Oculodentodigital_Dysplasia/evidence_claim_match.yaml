        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dominant-negative GJA1 mutations disrupt gap junction communication
        description: 'GJA1 encodes connexin 43 (Cx43), the most widely expressed gap junction protein.
          In the autosomal dominant form, missense mutations produce mutant Cx43 that co-assembles with
          wild-type Cx43 (and other connexins) into dysfunctional gap junction channels, exerting a dominant-negative
          effect. This impairs intercellular communication in tissues that critically depend on Cx43:
          craniofacial structures, limb buds, eyes, teeth, brain, and skin. Mutations occur across all
          nine domains of the Cx43 protein and may cause misassembly of channels or alter channel conduction
          properties. The tissue-specific phenotypic expression reflects the differential dependence of
          each tissue on Cx43-mediated gap junction intercellular communication (GJIC) during development
          and postnatal life.

          '
        gene:
          preferred_term: GJA1
          description: 'Gap junction protein alpha 1, encoding connexin 43 (Cx43), the most abundant and
            ubiquitously expressed gap junction protein. Cx43 forms hexameric connexons that dock between
            adjacent cells to create intercellular channels permitting passage of ions and small signaling
            molecules.

            '
          modifier: DECREASED
          term:
            id: hgnc:4274
            label: GJA1
