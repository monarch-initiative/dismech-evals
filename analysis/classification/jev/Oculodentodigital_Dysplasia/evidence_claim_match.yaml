        description: 'In autosomal recessive ODDD, homozygous mutations cause complete loss of Cx43 function
          rather than dominant-negative effects. The R33X truncation mutant fails to form functional channels
          and additionally exerts trans-dominant effects on co-expressed connexins (Cx43 and Cx40), potentially
          explaining the greater disease burden in some AR cases. The R76H mutant retains partial function
          with reduced conductance.

          '
        gene:
          preferred_term: GJA1
          description: Homozygous loss-of-function mutations in GJA1 causing complete or near-complete
            loss of Cx43 gap junction function.
          modifier: DECREASED
