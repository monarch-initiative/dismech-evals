        - preferred_term: Gap junction assembly
          term:
            id: GO:0016264
            label: gap junction assembly
          modifier: DECREASED
      selected_evidence:
        snippet: the R76H mutant trafficked to the plasma membrane to form gap junction-like plaques,
          whereas the R33X mutant remained diffusely localized throughout the cell, including the nucleus.
        supports: SUPPORT
