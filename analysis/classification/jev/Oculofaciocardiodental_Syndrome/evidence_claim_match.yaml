      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: bcor_bcl6_independent_mechanism
        hypothesis_label: Pathogenesis via BCL-6-independent BCOR functions
        status: EMERGING
        description: Ng et al. showed that OFCD-mutant BCOR retains the ability to bind BCL-6 and repress
          transcription in reporter assays, and concluded that OFCD must result from defects in BCOR functions
          other than BCL-6 corepression — most plausibly its scaffolding role in ncPRC1.1. The later periodontal-ligament
          work, however, found that mutant BCOR fails to be recruited to the BCL6-binding region of the
          ZFPM2 promoter, implicating a BCL-6-dependent step at least at that locus. These are not necessarily
          contradictory — generic reporter corepression and native promoter recruitment probe different
          things — but the relative contribution of ncPRC1.1 scaffolding versus locus-specific BCL-6-dependent
          recruitment to OFCD pathogenesis remains unresolved. Curated as an open question; the causal
          edges above are stated at the observation level rather than committing to either arm.
      selected_evidence:
        snippet: BCOR regulates downstream genes via BCL6 as a transcriptional corepressor.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35957990
      reference_title: Molecular mechanism of hyperactive tooth root formation in oculo-facio-cardio-dental
        syndrome.
      evidence_source: IN_VITRO
      explanation: 'Counterweight to the hypothesis: at the ZFPM2 locus the pathogenic mechanism is framed
