  435a1a06cc88ed13f4cf4b51cf2904e5a70bf51752cd4a23be5be782e3a9cc45:
    claim:
      about:
        disease:
          name: Oculofaciocardiodental Syndrome
          disease_term:
            preferred_term: oculofaciocardiodental syndrome
            term:
              id: MONDO:0010261
              label: microphthalmia, syndromic 2
        context: []
      assertion_type: Genetic
      assertion:
        name: BCOR
        gene_term:
          preferred_term: BCOR
          term:
            id: hgnc:20893
            label: BCOR
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: BCOR (Xp11.4) encodes the BCL-6 corepressor. OFCD-causing variants are null alleles — nonsense,
          frameshift, canonical splice-site, and partial or whole-gene deletions. Most are de novo; familial
          transmission and parental germline mosaicism are both documented. Truncating BCOR alleles are
          essentially absent from population databases, consistent with strong purifying selection given
