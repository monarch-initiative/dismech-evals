      assertion_type: Pathophysiology
      assertion:
        name: AP-2alpha Derepression and MSC Osteo-Dentinogenic Reprogramming
        biological_scale: CELLULAR
        description: A second, chromatin-level account of radiculomegaly. In mesenchymal stem cells isolated
          from an OFCD patient, BCOR mutation raises histone H3K4 and H3K36 methylation and reactivates
          silenced target genes, derepressing the transcription factor AP-2alpha (TFAP2A). AP-2alpha in
          turn mediates increased osteo-dentinogenic capacity, so the root continues to mineralize past
          the point at which it normally stops. This is mechanistically distinct from — and not obviously
          reducible to — the ZFPM2 account, and the two are curated as competing hypotheses (see mechanistic_hypotheses).
        cell_types:
        - preferred_term: mesenchymal stem cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
        biological_processes:
        - preferred_term: biomineral tissue development
          term:
            id: GO:0031214
            label: biomineral tissue development
          modifier: INCREASED
      selected_evidence:
        snippet: BCOR mutation increased histone H3K4 and H3K36 methylation in MSCs, thereby reactivating
          transcription of silenced target genes.
        supports: SUPPORT
