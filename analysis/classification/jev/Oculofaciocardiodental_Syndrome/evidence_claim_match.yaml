      assertion_type: Pathophysiology
      assertion:
        name: Mosaic BCOR Deficiency from X-Inactivation
        biological_scale: CELLULAR
        description: In heterozygous females, random X-chromosome inactivation produces a mosaic of cells
          expressing either the wild-type or the null BCOR allele. Which lineages happen to carry an active
          mutant allele determines which organ systems are affected and how severely, accounting for the
          marked variability in expressivity between and within families. In hemizygous males no wild-type
          allele exists in any lineage, and development fails outright.
      selected_evidence:
        snippet: Females heterozygous for Bcor exhibiting mosaic expression due to the X-linkage of the
          gene showed reduced postnatal viability and had OFCD-like defects.
        supports: SUPPORT
