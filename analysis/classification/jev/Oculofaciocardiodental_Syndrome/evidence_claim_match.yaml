              label: microphthalmia, syndromic 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ncPRC1.1 Corepressor Deficiency
        biological_scale: MOLECULAR
        description: BCOR is a defining scaffold subunit of the non-canonical Polycomb repressive complex
          1.1 (ncPRC1.1), which also contains RING1/RING1B, PCGF1/PCGF3/PCGF5, SKP1, and the CpG-island-binding
          demethylase KDM2B. Loss of BCOR therefore removes a Polycomb-mediated repressive input at developmental
          target genes, making OFCD fundamentally an epigenetic corepressor deficiency rather than a structural-protein
          defect. Notably, OFCD-mutant BCOR retains the ability to bind BCL-6 and repress transcription
          in reporter assays, indicating the pathogenic defect lies in BCOR functions beyond simple BCL-6
          corepression (see mechanistic_hypotheses).
        protein_complexes:
        - preferred_term: PRC1 complex
          term:
            id: GO:0035102
            label: PRC1 complex
          modifier: DECREASED
        biological_processes:
        - preferred_term: heterochromatin formation
          term:
            id: GO:0031507
            label: heterochromatin formation
          modifier: DECREASED
      selected_evidence:
        snippet: BCOR associates with Polycomb group proteins to form one subfamily of the diverse Polycomb
          repressive complex 1 (PRC1) complexes, designated PRC1.1.
        supports: SUPPORT
    origin:
