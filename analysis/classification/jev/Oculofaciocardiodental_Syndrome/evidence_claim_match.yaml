          value:
            name: Unrestrained Notch Signaling and Pitx2 Suppression
            biological_scale: CELLULAR
            description: A left-right patterning arm accounting for the cardiac and laterality features.
              The BCL6-BCOR complex normally occupies the promoters of selected Notch target genes and
              excludes the coactivator Mastermind-like1, restraining Notch output. When BCOR is lost,
              unrestrained Notch activity in the left lateral plate mesoderm drives the Notch effector
              ESR1 (enhancer of split related 1) to bind the left-side-specific ASE enhancer of Pitx2
              and recruit HDAC1, displacing p300 and silencing Pitx2 — the terminal effector of the left-right
              cascade. This offers a route to septal and laterality defects that is separate from the
              Isl1-lineage septation requirement.
            biological_processes:
            - preferred_term: Notch signaling pathway
              term:
                id: GO:0007219
                label: Notch signaling pathway
              modifier: INCREASED
            - preferred_term: determination of left/right symmetry
              term:
                id: GO:0007368
                label: determination of left/right symmetry
              modifier: ABNORMAL
          role: ancestor
      assertion_type: CausalEdge
      assertion:
