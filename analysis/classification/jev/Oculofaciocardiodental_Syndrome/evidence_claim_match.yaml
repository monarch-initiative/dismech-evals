      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: radiculomegaly_ap2alpha_route
        hypothesis_label: Radiculomegaly via chromatin-level AP-2alpha derepression in MSCs
        status: EMERGING
        description: Radiculomegaly results from BCOR loss raising H3K4/H3K36 methylation and reactivating
          silenced targets in dental mesenchymal stem cells, with AP-2alpha (TFAP2A) the key derepressed
          factor mediating increased osteo-dentinogenic capacity. This account is chromatin-level and
          BCL6-independent in emphasis, whereas the ZFPM2 account is promoter-specific and BCL6-dependent.
          Both derive from patient-derived cells but from different cell types (MSC versus periodontal
          ligament), and no study has yet tested them head to head or established whether they are two
          views of one cascade or genuinely separate routes to the same endpoint. Curated as parallel
          EMERGING hypotheses rather than ranked.
      selected_evidence:
        snippet: Gain- and loss-of-function assays suggest that AP-2alpha is a key factor that mediates
          the increased osteo-dentinogenic capacity of MSCs.
        supports: SUPPORT
