      assertion:
        name: Congenital Oculomotor Nerve Hypoplasia or Aplasia
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: In congenital palsy the nerve itself is maldeveloped rather than injured. High-resolution
          MRI shows thinning of the nerve along its whole course, thinning confined to its distal segment,
          or complete agenesis, with secondary atrophy of the extraocular muscles that the missing fibres
          would have supplied. The deficit is therefore a developmental one, present before any pupil-involving-versus-sparing
          logic applies, and in children pupillary signs lose their localizing value altogether.
        biological_processes:
        - preferred_term: oculomotor nerve development
          modifier: DECREASED
          term:
            id: GO:0021557
            label: oculomotor nerve development
        locations:
        - preferred_term: oculomotor nerve
          term:
            id: UBERON:0001643
            label: oculomotor nerve
      selected_evidence:
        snippet: One patient had complete nerve agenesis, two patients showed a diffuse thinning of the
          nerve, from the brainstem to the orbit and 3 patients showed a distal thinning of the oculomotor
          nerve, starting at the level of the cavernous sinus.
        supports: SUPPORT
