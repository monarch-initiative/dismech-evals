      assertion_type: Discussion
      assertion:
        discussion_id: pupil_rule_exceptions
        kind: CONTROVERSY
        attaches_to:
        - pathophysiology#Preserved Superficial Pupillomotor Function
        prompt: How far can the pupil-involving versus pupil-sparing distinction be trusted to separate
          compressive from ischaemic third nerve palsy?
        rationale: 'The anatomical premise is sound and the statistical association is strong: only 2%
          of aneurysmal palsies spare the pupil, and about three quarters of vasculopathic palsies do
          spare it. But the rule has documented failure modes in both directions. Pupil sparing occurs
          in a minority of compressive subarachnoid lesions and in a large proportion of cavernous sinus
          compressive lesions, and aberrant regeneration can manufacture apparent sparing. Conversely,
          about half of diabetic microvascular palsies in one large inpatient series did involve the pupil,
          which the author attributed to coexisting autonomic neuropathy. The rule should therefore be
          curated as a likelihood modifier, not a decision rule, and it does not transfer to children
          at all.'
        status: OPEN
      selected_evidence:
        snippet: Two case reports and a review of the literature disclose that pupil sparing occurs in
          a small proportion of intraaxial and compressive subarachnoid oculomotor nerve lesions and in
          a large proportion of compressive cavernous sinus oculomotor nerve lesions.
        supports: SUPPORT
    origin:
