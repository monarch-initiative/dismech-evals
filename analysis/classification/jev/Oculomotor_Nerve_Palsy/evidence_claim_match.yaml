          value:
            name: Traumatic Stretch Injury of the Oculomotor Nerve at Fixed Tether Points
            biological_scale: TISSUE
            mechanism_confidence: PROVISIONAL
            description: Head injury displaces the brain relative to the skull base while the nerve remains
              anchored where it passes the posterior petroclinoid ligament and the tentorial edge. The
              nerve is stretched or contused at those tether points. Because the injury is a longitudinal
              stretch rather than a focal external mass, it does not respect the superficial-to-deep gradient
              in the way compression does, and pupil-sparing traumatic palsies are described.
            locations:
            - preferred_term: oculomotor nerve
              term:
                id: UBERON:0001643
                label: oculomotor nerve
            biological_processes:
            - preferred_term: response to mechanical stimulus
              term:
                id: GO:0009612
                label: response to mechanical stimulus
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Aberrant Regeneration of the Oculomotor Nerve
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: Traumatic axonal disruption, like compression, is followed by regrowth that can reach
          the wrong target, so synkinesis after head injury is a late marker of the severity of the original
          axonal injury.
      selected_evidence:
        snippet: Careful examination is also necessary to separate examples of apparent pupil sparing
          in cases of aberrant regeneration and in some instances of cavernous sinus compression.
        supports: SUPPORT
    origin:
