        display_name: Traumatic oculomotor nerve palsy
        description: Third nerve palsy following head injury, from stretch, contusion, or avulsion of
          the nerve, classically where it is tethered against the posterior petroclinoid ligament or the
          tentorial edge. The leading cause in childhood inpatient series and a major cause in young adults.
      selected_evidence:
