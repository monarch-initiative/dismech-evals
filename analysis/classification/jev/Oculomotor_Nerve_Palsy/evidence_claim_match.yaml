      assertion_type: Pathophysiology
      assertion:
        name: Somatotopic Segregation of Pupillomotor and Somatic Motor Fibres
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: 'Cranial nerve III carries two functionally distinct fibre populations that are not
          intermingled. The preganglionic parasympathetic pupillomotor and accommodative fibres travel
          superficially, at the periphery of the nerve; the somatic motor fibres to levator palpebrae
          superioris and the four extraocular muscles travel deeper. This anatomical arrangement is the
          single fact from which the entire pupil-involving versus pupil-sparing clinical axis follows:
          an insult applied from outside the nerve reaches the superficial fibres first, whereas an insult
          arising within the nerve''s substance reaches the deeper fibres first. Nothing about the fibres
          themselves confers differential vulnerability - it is their position.'
        cell_types:
        - preferred_term: peripheral nervous system neuron
          term:
            id: CL:2000032
            label: peripheral nervous system neuron
        locations:
        - preferred_term: oculomotor nerve
          term:
            id: UBERON:0001643
            label: oculomotor nerve
        notes: The peripheral position of the pupillomotor fibres was established experimentally by Kerr
          and Hollowell (PMID:14213479) and by Sunderland and Hughes; neither has a retrievable abstract,
          so neither is cited as evidence here. The claim is instead anchored on contemporary reference
          sources whose text can be verified against the reference cache.
      selected_evidence:
        snippet: Somatic motor fibers, located deeper, innervate the levator palpebrae superioris, which
          elevates the upper eyelid, and 4 extraocular muscles
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30252368
      reference_title: Cranial Nerve III Palsy (Oculomotor Palsy).
      evidence_source: OTHER
      explanation: States the complementary deeper position of the somatic motor fibres, completing the
