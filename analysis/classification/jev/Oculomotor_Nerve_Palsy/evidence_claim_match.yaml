        kind: INTERPRETATION
        attaches_to:
        - pathophysiology#Congenital Oculomotor Nerve Hypoplasia or Aplasia
        prompt: Should congenital fibrosis of the extraocular muscles and the other congenital cranial
          dysinnervation disorders be curated inside this entry?
        rationale: They should not. CFEOM (KIF21A, TUBB3, TUBA1A, PHOX2A) and the wider CCDD group are
          distinct, separately named genetic entities with their own MONDO identifiers, and the large
          aetiological series that anchors this entry explicitly excluded congenital cranial dysinnervation
          disorders when assigning its congenital category. The congenital subtype curated here is isolated
          congenital oculomotor nerve palsy with imaging-demonstrated nerve hypoplasia, thinning, or agenesis.
          The distinction is recorded because a deep-research report generated for this entry did bundle
          CFEOM genetics into it, and that content was deliberately not imported.
        status: RESOLVED
        resolution_note: Scope fixed to acquired and isolated congenital oculomotor nerve palsy; CFEOM
          and CCDD genetics excluded and left to their own entries.
      selected_evidence:
        snippet: Congenital oculomotor nerve palsy was diagnosed when the patients had an infantile onset
          of ophthalmoplegia after excluding congenital cranial dysinnervation disorders, such as Duane
          syndrome and congenital Horner syndrome
        supports: SUPPORT
