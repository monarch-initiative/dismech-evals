        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: 'The counterpart node to pupillomotor injury: when the insult originates inside the
          nerve rather than outside it, the superficial parasympathetic fibres continue to conduct, the
          pupil reacts normally to light, and the palsy is described as pupil-sparing. Curated as a positive
          mechanistic state, not as the mere absence of a finding, because it is the observable consequence
          of where the insult was applied.'
        cell_types:
        - preferred_term: smooth muscle cell of sphincter of pupil
          term:
            id: CL:0002243
            label: smooth muscle cell of sphincter of pupil
        locations:
        - preferred_term: iris
          term:
            id: UBERON:0001769
            label: iris
        notes: Pupil sparing is a probabilistic localizing sign, not a rule. It occurs in a minority of
          compressive subarachnoid lesions and in a large proportion of cavernous sinus compressive lesions,
          and apparent sparing can be produced by aberrant regeneration. See the "Exceptions to the pupil
          rule" discussion.
      selected_evidence:
        snippet: Of 55 patients with vasculopathic 3NP, 42 (76%) had normal pupillary function.
        supports: SUPPORT
