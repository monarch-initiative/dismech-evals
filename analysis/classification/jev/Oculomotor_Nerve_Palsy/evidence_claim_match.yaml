        name: Congenital
        display_name: Congenital oculomotor nerve palsy
        description: Third nerve palsy present from infancy, usually unilateral and incomplete, associated
          on high-resolution MRI with hypoplasia, thinning, or frank agenesis of the oculomotor nerve
          and secondary atrophy of the muscles it supplies. A developmental nerve deficit, not an acquired
          lesion, and the most frequent presentation of third nerve palsy in childhood.
      selected_evidence:
        snippet: Congenital oculomotor nerve palsy was mostly incomplete and hypoplasia or aplasia of
          the oculomotor nerve was apparent in one third of patients showing variable degrees of extraocular
          muscle atrophy, mostly of the medial rectus and inferior rectus muscles.
        supports: SUPPORT
