      assertion_type: Definition
      assertion:
        name: Clinical syndrome definition for oculomotor nerve palsy
        definition_type: CASE_DEFINITION
        description: Oculomotor nerve palsy is diagnosed from weakness of the extraocular muscles supplied
          by cranial nerve III, with or without ptosis and pupillary involvement, after mimics such as
          myasthenia gravis, thyroid orbitopathy, and Horner syndrome have been excluded.
        scope: General clinical framing of third cranial nerve palsy
      selected_evidence:
        snippet: Typical presentation includes ptosis, ophthalmoplegia, diplopia, and variable pupillary
          involvement, resulting in the characteristic down-and-out eye position in complete palsy.
        supports: SUPPORT
