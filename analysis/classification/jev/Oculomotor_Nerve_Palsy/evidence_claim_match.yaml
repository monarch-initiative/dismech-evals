              label: oculomotor nerve paralysis
        context:
        - path: /pathophysiology/0
          value:
            name: Somatotopic Segregation of Pupillomotor and Somatic Motor Fibres
            biological_scale: TISSUE
            mechanism_confidence: ESTABLISHED
            description: 'Cranial nerve III carries two functionally distinct fibre populations that are
              not intermingled. The preganglionic parasympathetic pupillomotor and accommodative fibres
              travel superficially, at the periphery of the nerve; the somatic motor fibres to levator
              palpebrae superioris and the four extraocular muscles travel deeper. This anatomical arrangement
              is the single fact from which the entire pupil-involving versus pupil-sparing clinical axis
              follows: an insult applied from outside the nerve reaches the superficial fibres first,
              whereas an insult arising within the nerve''s substance reaches the deeper fibres first.
              Nothing about the fibres themselves confers differential vulnerability - it is their position.'
            cell_types:
            - preferred_term: peripheral nervous system neuron
              term:
                id: CL:2000032
                label: peripheral nervous system neuron
            locations:
            - preferred_term: oculomotor nerve
              term:
                id: UBERON:0001643
                label: oculomotor nerve
            notes: The peripheral position of the pupillomotor fibres was established experimentally by
              Kerr and Hollowell (PMID:14213479) and by Sunderland and Hughes; neither has a retrievable
              abstract, so neither is cited as evidence here. The claim is instead anchored on contemporary
              reference sources whose text can be verified against the reference cache.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Endoneurial Microvascular Ischaemia of the Oculomotor Nerve Core
        causal_link_type: DIRECT
        description: Because the somatic motor fibres occupy the core, an ischaemic insult to the nerve's
          internal blood supply damages them while the superficially placed pupillomotor fibres are relatively
          protected.
      selected_evidence:
        snippet: Pupillary sparing is a characteristic of third nerve palsy.
        supports: SUPPORT
