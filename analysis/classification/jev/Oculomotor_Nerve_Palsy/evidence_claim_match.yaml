          term:
            id: UBERON:0002623
            label: cerebral peduncle
      selected_evidence:
        snippet: Clinically, an uncal herniation is characterized by a predictable pattern of neuroanatomic
          compression, including ipsilateral third nerve palsy, contralateral motor deficits from compression
          of the cerebral peduncle, and progressive brainstem dysfunction.
        supports: SUPPORT
