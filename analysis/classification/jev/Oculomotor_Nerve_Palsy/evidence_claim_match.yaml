      assertion:
        discussion_id: rpon_mechanism_unresolved
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Focal Oculomotor Nerve Inflammation with Blood-Nerve Barrier Breakdown
        prompt: What is the primary lesion in recurrent painful ophthalmoplegic neuropathy - ischaemia,
          inflammation, demyelination, or compression?
        rationale: RPON was renamed away from "ophthalmoplegic migraine" precisely because the MRI appearance
          indicates a neuropathy, but the rename did not settle what causes the neuropathy. Competing
          hypotheses of nerve compression, ischaemia, and inflammation or demyelination are all still
          live, no histology is available, and treatment with corticosteroids has never been tested against
          the natural history of spontaneous remission. Because attacks are rare (5/633 in a large aetiological
          series) the gap is unlikely to close without a multicentre registry.
        status: OPEN
        proposed_experiments:
        - experiment_id: rpon_prospective_registry
          experiment_design: HUMAN_OBSERVATIONAL
          name: Prospective multicentre RPON registry with standardised acute imaging
          description: Enrol consecutive RPON attacks across centres with a fixed acute MRI protocol covering
            the cisternal nerve and root entry zone, repeated in remission, to establish whether enhancement
            resolves completely and whether it precedes or follows the ophthalmoplegia.
      selected_evidence:
        snippet: Several hypotheses have been proposed, including nerve compression, ischemia or inflammation/demyelination,
          but none has been completely accepted.
        supports: SUPPORT
