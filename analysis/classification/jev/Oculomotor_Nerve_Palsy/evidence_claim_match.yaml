      assertion:
        discussion_id: pattern_of_motor_paresis_as_a_second_axis
        kind: EMERGING_HYPOTHESIS
        attaches_to:
        - pathophysiology#Somatic Motor Fibre Conduction Failure
        prompt: Can the spatial pattern of extraocular muscle weakness discriminate vasculopathic from
          aneurysmal palsy when the pupil is uninformative?
        rationale: If the pupil rule fails in exactly the cases where it is most needed, a second discriminator
          would be valuable. One series proposed that incomplete pupil-sparing vasculopathic palsies show
          diffuse weakness across all cranial nerve III muscles, whereas pupil-sparing aneurysmal palsies
          show focal weakness confined to some of them. The proposal follows naturally from the mechanism
          - diffuse endoneurial ischaemia versus focal external contact - but the authors were explicit
          that it needs confirmation, and no larger validation has been curated here.
        status: OPEN
      selected_evidence:
        snippet: We propose that distinguishing these two patterns of EOM paresis may be helpful in differentiating
          between vasculopathic and aneurysmal 3NP. Future studies will be needed to confirm the clinical
          utility of this hypothesis.
        supports: SUPPORT
