      assertion_type: Subtype
      assertion:
        name: Microvascular
        display_name: Ischaemic microvascular oculomotor nerve palsy
        description: Acute painful third nerve palsy in an adult with vascular risk factors (diabetes
          mellitus, hypertension, dyslipidaemia, smoking), no causative lesion on imaging, and spontaneous
          recovery. Characteristically, though not invariably, pupil-sparing. The most common single aetiology
          in adults.
      selected_evidence:
        snippet: The most common etiology was microvascular (n = 168, 26.5%), followed by vascular anomalies
          (n = 110, 17.4%), neoplastic (n = 86, 13.6%), inflammatory (n = 79, 12.5%), idiopathic (n =
          60, 9.5%) and traumatic (n = 53, 8.4%).
        supports: SUPPORT
