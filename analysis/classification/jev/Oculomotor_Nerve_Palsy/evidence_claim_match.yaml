      assertion_type: Pathophysiology
      assertion:
        name: Traumatic Stretch Injury of the Oculomotor Nerve at Fixed Tether Points
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: Head injury displaces the brain relative to the skull base while the nerve remains
          anchored where it passes the posterior petroclinoid ligament and the tentorial edge. The nerve
          is stretched or contused at those tether points. Because the injury is a longitudinal stretch
          rather than a focal external mass, it does not respect the superficial-to-deep gradient in the
          way compression does, and pupil-sparing traumatic palsies are described.
        locations:
        - preferred_term: oculomotor nerve
          term:
            id: UBERON:0001643
            label: oculomotor nerve
        biological_processes:
        - preferred_term: response to mechanical stimulus
          term:
            id: GO:0009612
            label: response to mechanical stimulus
      selected_evidence:
        snippet: The suggested mechanism of the oculomotor nerve palsy with pupil sparing in this case
          is stretching of the oculomotor nerve at the posterior petroclinoid ligament, maintaining an
          intact pupillomotor nerve.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
