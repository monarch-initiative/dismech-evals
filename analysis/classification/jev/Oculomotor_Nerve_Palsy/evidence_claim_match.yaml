              label: oculomotor nerve paralysis
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Mimics of oculomotor nerve palsy
        description: 'Several conditions reproduce parts of the syndrome without a third nerve lesion,
          and each must be excluded before the diagnosis is assigned: myasthenia gravis (fatiguable ptosis
          and ophthalmoplegia, pupil always spared), thyroid-associated orbitopathy and orbital myositis
          (restrictive rather than paralytic), Horner syndrome and Adie tonic pupil (anisocoria of other
          origin), congenital ptosis, and Duane retraction syndrome.'
        distinguishing_features:
        - A true third nerve palsy weakens a defined muscle set while sparing the superior oblique and
          lateral rectus.
        - Thyroid-associated orbitopathy and orbital myositis limit movement mechanically rather than
          by denervation.
        - Myasthenia gravis fluctuates, is fatiguable, and never dilates the pupil.
        - Horner syndrome produces a small rather than a large pupil.
      selected_evidence:
        snippet: Particular attention was paid to exclude disorders that may mimic oculomotor nerve palsy,
          such as exotropia, blepharoptosis, congenital ptosis, anisocoria of other causes
        supports: SUPPORT
