        name: PABPN1 Misfolding and Intranuclear Aggregation
        description: Expanded PABPN1 misfolds and self-associates into insoluble, tubulofilamentous intranuclear
          inclusions roughly 8.5 nm in outer diameter within skeletal muscle fibre nuclei. These inclusions
          are the pathological hallmark of OPMD, are decorated by anti-PABPN1 antibodies, and contain
          a salt-extraction-resistant form of the protein. They appear in muscle biopsies of presymptomatic
          Ala-expanded PABPN1 carriers, placing aggregation upstream of clinical weakness.
        biological_scale: CELLULAR
        conforms_to: loss_of_proteostasis#Misfolded-Protein Aggregation
        cell_types:
        - preferred_term: skeletal muscle fibre
          term:
            id: CL:0008002
