      assertion_type: Pathophysiology
      assertion:
        name: PABPN1 Polyalanine Tract Expansion
        description: A short GCN (GCG) trinucleotide repeat in the first exon of PABPN1 expands from the
          normal (GCG)6 to (GCG)8-13, lengthening the N-terminal polyalanine tract of the nuclear poly(A)-binding
          protein. PABPN1 normally binds nascent poly(A) tails with high affinity and controls their extension
          and length, so the lesion falls on a protein with a defined nuclear RNA-processing role.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: PABPN1
          term:
            id: hgnc:8565
            label: PABPN1
        molecular_functions:
        - preferred_term: poly(A) binding
          term:
            id: GO:0008143
            label: poly(A) binding
        biological_processes:
        - preferred_term: mRNA 3'-end processing
          term:
            id: GO:0031124
            label: mRNA 3'-end processing
      selected_evidence:
        snippet: A (GCG)6 repeat encoding a polyalanine tract located at the N terminus of the protein
          was expanded to (GCG)8-13 in the 144 OPMD families screened.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
