            label: inclusion body assembly
          modifier: INCREASED
        cellular_components:
        - preferred_term: nuclear inclusion body
          term:
            id: GO:0042405
            label: nuclear inclusion body
      selected_evidence:
        snippet: This suggests that the polyalanine expansions in PABP2 induce a misfolding and aggregation
          of the protein into insoluble inclusions, similarly to events in neurodegenerative diseases
          caused by CAG/polyglutamine expansions.
        supports: SUPPORT
