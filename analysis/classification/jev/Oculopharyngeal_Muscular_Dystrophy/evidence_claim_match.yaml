      assertion_type: DifferentialDiagnosis
      assertion:
        name: Oculopharyngodistal Myopathy
        disease_term:
          preferred_term: oculopharyngodistal myopathy
          term:
            id: MONDO:0025193
            label: oculopharyngodistal myopathy
        description: The closest mimic and the one most often confused with OPMD in the literature. OPDM
          is caused by non-coding CGG repeat expansions in LRP12, GIPC1, NOTCH2NLC or RILPL1 rather than
          by a coding polyalanine expansion in PABPN1, and both diseases produce adult-onset ptosis, ophthalmoplegia,
          bulbar involvement, rimmed vacuoles and intranuclear inclusions. Three features separate them.
          Limb weakness is predominantly proximal in OPMD and distal in OPDM, although both distributions
          overlap in individual patients. p62-positive intranuclear inclusions occupy a far higher fraction
          of myonuclei in OPMD, and are PABPN1-positive only in OPMD. Inclusions in non-muscle cells such
          as blood vessels, peripheral nerve and muscle spindles occur in OPDM but were absent from every
          OPMD sample studied. Genetic testing is definitive.
      selected_evidence:
        snippet: These results indicate that OPMD can be differentiated from OPDM and other RVMs by the
          frequent presence of myo-INIs; and in OPDM, the presence of non-muscle-INIs in muscle pathology
          should be a diagnostic hallmark.
        supports: SUPPORT
