        description: The intranuclear inclusions trap poly(A) mRNA together with ubiquitin, proteasome
          subunits and the chaperones HSP40 and HSP70. Sequestering both the RNA cargo of PABPN1 and the
          machinery that would normally clear misfolded protein is the proposed route by which aggregation
          becomes toxic, potentially interfering with nuclear export of poly(A) RNA.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: skeletal muscle fibre
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        notes: The exact route from sequestration to muscle fibre loss remains unsettled. Brais 2003 (PMID:14526187)
          states that the mechanism responsible for polyalanine toxicity in OPMD is unknown and that both
          inclusion-dependent and inclusion-independent models have been proposed; this entry therefore
          does not assert a specific toxic effector downstream of sequestration.
      selected_evidence:
        snippet: The INIs also contain ubiquitin, proteasome subunits, HSP 40, HSP 70, SKIP, and abundant
          poly(A)-mRNA.
        supports: SUPPORT
    origin:
