        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Non-coding CGG-repeat expansion
        description: OPDM is caused by abnormally expanded non-coding CGG trinucleotide repeats in the
          5' untranslated/regulatory regions of LRP12 (OPDM1), GIPC1 (OPDM2), NOTCH2NLC (OPDM3), or RILPL1
          (OPDM4). Repeat length above a gene-specific threshold confers pathogenicity.
        genes:
        - preferred_term: LRP12
          term:
            id: hgnc:31708
            label: LRP12
        - preferred_term: GIPC1
          term:
            id: hgnc:1226
            label: GIPC1
        - preferred_term: NOTCH2NLC
          term:
            id: hgnc:53924
            label: NOTCH2NLC
        - preferred_term: RILPL1
          term:
            id: hgnc:26814
            label: RILPL1
      selected_evidence:
        snippet: Intriguingly, all four types of OPDM have been found to be associated with the CGG repeat
          expansions located in 5' UTRs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
