              label: oculopharyngodistal myopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RAN translation of toxic polyglycine protein
        description: The expanded CGG repeat undergoes repeat-associated non-AUG (RAN) translation, producing
          a toxic polyglycine-containing protein. This cap-independent, AUG-independent translation generates
          aggregation-prone polypeptides that accumulate in affected cells.
        biological_processes:
        - preferred_term: cap-independent translational initiation
          term:
            id: GO:0002190
            label: cap-independent translational initiation
          modifier: INCREASED
        notes: Subtype-specific RAN-translated polyglycine products have been described (e.g., uGIPpolyG
          from GIPC1, antisense asRILpolyG from RILPL1), supporting a shared toxic-polyglycine mechanism
          across OPDM genes; a parallel RNA gain-of-function contribution is also proposed.
      selected_evidence:
        snippet: expanded CGG repeat might be translated into a toxic poly-glycine protein that co-localizes
          with p62 in intranuclear inclusions.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
