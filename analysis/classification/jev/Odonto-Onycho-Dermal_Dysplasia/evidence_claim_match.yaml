          bossing, no saddle nose), whereas EDA1-related HED typically features frontal bossing, saddle
          nose, and periorbital hyperpigmentation. Together, EDA1, EDAR, EDARADD, and WNT10A account for
          approximately 90% of HED/EDA cases.

          '
      selected_evidence:
