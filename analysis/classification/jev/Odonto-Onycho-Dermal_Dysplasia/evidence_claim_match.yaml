      assertion_type: Genetic
      assertion:
        name: WNT10A pathogenic variants
        gene_term:
          preferred_term: WNT10A
          term:
            id: hgnc:13829
            label: WNT10A
        inheritance:
        - name: Autosomal recessive
        variants:
        - name: c.697G>T (p.Glu233X)
          description: 'First identified pathogenic WNT10A variant. Homozygous nonsense mutation found
            in consanguineous Lebanese families with OODD. Predicted to cause premature truncation at
            232 of 417 amino acids.

            '
        - name: c.682T>A (p.Phe228Ile)
          description: 'Most common pathogenic WNT10A allele in European populations. Allele frequency
            approximately 10 times higher in tooth agenesis cohorts than in general population databases.

            '
        - name: c.392C>T (p.Ala131Val)
          description: 'Missense mutation in a conserved alpha-helix domain of WNT10A. Identified in a
            consanguineous Pakistani family with complete OODD.

            '
        - name: c.321C>A (p.Cys107X)
          description: 'Nonsense mutation reported in both OODD and SSPS, illustrating allelic heterogeneity
            and phenotypic variability with the same mutation.

            '
        notes: 'About half of heterozygous carriers (53.8%) show phenotypic manifestations, primarily
          tooth and nail anomalies, with a sex-biased pattern showing significantly higher penetrance
          in males. WNT10A mutations are found in approximately 9% of unselected ectodermal dysplasia
          patients and cause 35-50% of selective tooth agenesis cases.

          '
      selected_evidence:
        snippet: 'Screening of candidate genes in this region led us to identify the same c.697G-->T (p.Glu233X)
          homozygous nonsense mutation in exon 3 of the WNT10A gene in all patients.

          '
        supports: SUPPORT
