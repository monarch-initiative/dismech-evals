          in dental agenesis panels dramatically improves the diagnostic yield. For oligodontia with ectodermal
          features, a gene panel covering WNT10A alongside EDA, EDAR, EDARADD, MSX1, and PAX9 is recommended.

          '
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
