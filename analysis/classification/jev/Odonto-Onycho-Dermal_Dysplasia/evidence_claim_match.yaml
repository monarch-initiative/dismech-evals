      assertion_type: Pathophysiology
      assertion:
        name: WNT10A Loss of Function
        description: 'WNT10A encodes a secreted glycoprotein ligand of the canonical WNT signaling pathway.
          Loss-of-function mutations abolish WNT10A binding to Frizzled receptors, preventing activation
          of the beta-catenin destruction complex inhibition and downstream TCF/LEF-mediated transcription.
          This disrupts ectodermal appendage morphogenesis including teeth, hair follicles, nails, and
          sweat glands.

          '
