          WNT10A loss-of-function mutations.

          '
      selected_evidence:
        snippet: 'Odonto-onycho-dermal dysplasia is a rare autosomal recessive syndrome in which the presenting
          phenotype is dry hair, severe hypodontia, smooth tongue with marked reduction of fungiform and
          filiform papillae, onychodysplasia, keratoderma and hyperhidrosis of palms and soles, and hyperkeratosis
          of the skin.

          '
        supports: SUPPORT
