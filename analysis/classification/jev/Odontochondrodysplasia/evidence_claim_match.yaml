      assertion:
        name: Extraskeletal Golgi-Related Organ Disease
        biological_scale: ORGANISM
        description: Pulmonary dysplasia, cystic renal disease, and nonobstructive hydrocephaly occur
          in ODCD and implicate GMAP-210 in renal and cerebral development beyond the skeleton. The authors
          could not attribute these to a ciliary mechanism — cilia in GMAP-210-deficient fibroblasts were
          of normal length and structure, and ciliary targeting of IFT20 was preserved — but note that
          conditional Ift20 deletion during renal development causes polycystic kidney disease in mice,
          so a cilium-based route to the late renal disease remains open.
      selected_evidence:
        snippet: Second, additional extraskeletal disease manifestations of ODCD included pulmonary dysplasia,
          cystic renal disease, and nonobstructive hydrocephaly.
        supports: SUPPORT
