  0a55a2d49ff74baa4da92d1eb557b56c03d11cc06ebea6371f2f3c446d2f105d:
    claim:
      about:
        disease:
          name: Odontochondrodysplasia
          disease_term:
            preferred_term: odontochondrodysplasia
            term:
              id: MONDO:0100325
              label: odontochondrodysplasia 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: odcd_splicing_penetrance_modifier
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - progression#Variable outcome from perinatal lethality to adult survival
        prompt: What determines the penetrance of TRIP11 mis-splicing between individuals, and could it
          be measured prenatally to predict outcome?
        rationale: Siblings carrying identical TRIP11 alleles have received radiographic diagnoses of
          achondrogenesis 1A and of ODCD respectively. The proposed explanation is that splicing of TRIP11
          is cell-type dependent and incompletely penetrant, so residual GMAP protein settles at constitutively
          different levels in different individuals. Nothing is known about what sets that level. If it
          were measurable in accessible fetal or neonatal material it would convert an unanswerable counselling
          question into a quantitative one, which is why this gap has direct clinical weight rather than
          only mechanistic interest.
        proposed_experiments:
        - experiment_id: exp_odcd_residual_gmap_quantification
          name: Quantify residual GMAP protein against clinical severity across the allelic series
          description: Measure TRIP11 transcript isoform ratios and GMAP protein levels in matched accessible
            tissue from patients across the full severity range, and test whether residual protein level
            predicts radiographic severity independently of genotype.
          would_support:
          - pathophysiology#Reduced GMAP-210 Abundance at the cis-Golgi
          supporting_outcome:
          - A monotonic relationship between residual GMAP protein and severity across individuals sharing
            alleles would confirm protein dose as the operative variable and make it a candidate prognostic
            measurement.
          would_refute:
          - pathophysiology#Reduced GMAP-210 Abundance at the cis-Golgi
          refuting_outcome:
          - Comparable residual GMAP levels in siblings with lethal and surviving disease would move the
            explanation to a modifier outside TRIP11 altogether.
      selected_evidence:
        snippet: A radiographic diagnosis of ACG1A and ODCD in different children originating from the
          same parents may be primarily due to variable penetrance ofTRIP11missplicing between individuals,
          resulting in constitutively different amounts of residual GMAP protein.
        supports: SUPPORT
