              id: MONDO:0100325
              label: odontochondrodysplasia 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: odcd_no_viable_animal_model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Extraskeletal Golgi-Related Organ Disease
        prompt: Can the late-onset renal, cerebral, and pulmonary disease of ODCD be studied at all, given
          that every existing Trip11 knockout mouse dies perinatally?
        rationale: The available Trip11-knockout models are null models, and nulls in humans are embryonic-lethal,
          so the mouse reproduces achondrogenesis 1A rather than ODCD. The authors state that perinatal
          lethality in these models precludes recognition and analysis of later-onset phenotypes — which
          is exactly the class the extraskeletal features of ODCD fall into. The cystic renal disease
          in particular emerged only on longitudinal clinical follow-up, and there is no system in which
          to test whether it arises through impaired ciliary export of IFT20 or through the Golgi defect
          directly.
        proposed_experiments:
        - experiment_id: exp_odcd_hypomorphic_knockin_model
          name: Hypomorphic Trip11 knock-in model reproducing the human splice allele
          description: Generate a knock-in mouse carrying the human exon-4-skipping allele rather than
            a null, so that residual GMAP protein permits postnatal survival, and follow the animals for
            renal cystic disease, hydrocephaly, and lung development. Compare against conditional Ift20
            deletion to separate a ciliary from a Golgi route to the renal phenotype.
          would_support:
          - pathophysiology#Extraskeletal Golgi-Related Organ Disease
          supporting_outcome:
          - Postnatally viable hypomorphic animals developing cystic kidneys and hydrocephaly would establish
            that the extraskeletal disease is a direct consequence of reduced GMAP dose rather than of
            an unrelated modifier.
          would_refute:
          - pathophysiology#Reduced GMAP-210 Abundance at the cis-Golgi
          refuting_outcome:
          - Normal kidneys and ventricles in animals with the same residual GMAP dose that causes human
            disease would argue that the human extraskeletal features require something beyond the Golgi
            lesion.
      selected_evidence:
        snippet: These models all bear the disadvantage of perinatal lethality, precluding the recognition
          and analysis of later-onset phenotypes
        supports: SUPPORT
