        name: MIA3/TANGO1-Related Odontochondrodysplasia
        description: 'Biallelic MIA3 (TANGO1) variants produce an odontochondrodysplasia phenotype that
          at its severe end closely resembles the TRIP11 disorder — MIA3 and TRIP11 act at consecutive
          steps of collagen and matrix export from the endoplasmic reticulum and Golgi. Extraskeletal
          features differ: the originally reported MIA3 family had insulin-dependent diabetes, hearing
          loss, obesity, and intellectual disability, none of which is typical of TRIP11 disease. MIA3-related
          ODCD is not listed in the 2023 ISDS nosology and is therefore not assigned an ISDS group here.'
      selected_evidence:
        snippet: However, they had more severe skeletal deformities closely resembling those observed
          in patients with TRIP11 variants.
