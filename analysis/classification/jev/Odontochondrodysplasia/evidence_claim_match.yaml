        context: []
      assertion_type: Genetic
      assertion:
        name: Biallelic Hypomorphic TRIP11 Variants
        gene_term:
          preferred_term: TRIP11
          term:
            id: hgnc:12305
            label: TRIP11
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'TRIP11 has 21 coding exons and encodes the 1,979-amino-acid GMAP-210 protein. ODCD
          patients are compound heterozygous for a null allele and a recurrent splice variant. The recurrent
          c.586C>T change is instructive: predicted to be a nonsense allele (p.Gln196*) subject to nonsense-mediated
          decay, it in fact abrogates a splice donor site and causes complete in-frame skipping of exon
          4, producing a shortened but partly functional protein. Splicing is cell-type dependent and
          not fully penetrant, which is the proposed source of the intrafamilial variability.'
      selected_evidence:
        snippet: Here, we show that ODCD is caused by hypomorphic TRIP11 mutations, and we identify ODCD
          as the nonlethal counterpart to achondrogenesis 1A (ACG1A), the known null phenotype in humans.
        supports: SUPPORT
    origin:
