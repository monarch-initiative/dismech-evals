          the cells that synthesise the key cartilage matrix proteins, COL10A1 among them. Histology in
          achondrogenesis 1A fetuses shows reduced total epiphyseal cartilage with absent columnar chondrocytes
          in the prehypertrophic and hypertrophic zones; ODCD is the attenuated version of the same lesion.
        cell_types:
        - preferred_term: chondrocyte
