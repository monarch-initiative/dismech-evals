        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_odcd_null_alleles_mild_phenotype
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does a reported adult with two potentially null TRIP11 alleles have the mildest odontochondrodysplasia
          phenotype described, when the residual-activity model predicts the most severe?
        attaches_to:
        - pathophysiology#Aberrant TRIP11 Splicing with a Null Allele in Trans
        - pathophysiology#Block in Hypertrophic Chondrocyte Differentiation
        rationale: 'The whole genotype-severity account of the TRIP11 series rests on residual GMAP-210
          activity: splice alleles leave some, nulls leave none, and that is offered as the reason patients
          have ODCD rather than achondrogenesis. One reported adult contradicts it directly. Either the
          alleles are not the nulls they appear to be - as already happened with the recurrent c.586C>T
          allele, which mRNA study showed produces an in-frame deletion - or something other than residual
          GMAP-210 abundance modifies severity. Resolving this would change how a TRIP11 genotype is counselled
          prenatally, which is the setting where the ODCD-versus-lethal distinction actually has to be
          made.'
      selected_evidence:
        snippet: However, adult patient 4 has two potentially null alleles and it remains unknown why
          she has very mild clinical features.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
