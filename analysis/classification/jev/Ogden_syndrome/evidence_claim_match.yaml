  3f9c2b3e1ab20748214654cb826d47e7c54fed962e7f743129eaf42846146849:
    claim:
      about:
        disease:
          name: Ogden syndrome
          disease_term:
            preferred_term: Ogden syndrome
            term:
              id: MONDO:0010457
              label: Ogden syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired NatA catalytic activity and complex assembly
        description: 'The recurrent NAA10 p.Ser37Pro variant disrupts the catalytic function of the NatA
          complex and weakens interactions between NAA10 and its binding partners NAA15 and NAA50. Because
          NatA is the major N-terminal acetyltransferase in human cells, this defect reduces co-translational
          N-terminal acetylation of selected substrates and establishes the primary molecular lesion in
          Ogden syndrome. This interpretation is variant-specific: the severe p.Ser37Pro phenotype reflects
          selective substrate hypoacetylation and NatA complex-assembly defects rather than a nonspecific
          collapse of all NAA10/NAA15-related acetylation biology.'
        gene:
          preferred_term: NAA10
          description: Catalytic subunit of the NatA N-terminal acetyltransferase complex.
          modifier: ABNORMAL
          term:
            id: hgnc:18704
            label: NAA10
        genes:
        - preferred_term: NAA10
          term:
            id: hgnc:18704
            label: NAA10
        molecular_functions:
        - preferred_term: protein N-terminal-serine acetyltransferase activity
          term:
            id: GO:1990189
            label: protein N-terminal-serine acetyltransferase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: Protein acetylation
          term:
            id: GO:0006473
            label: protein acetylation
      selected_evidence:
        snippet: Combined, these data provide strong support for the functional impairment of hNaa10 S37P
          in vivo and suggest that reduced Nt-acetylation of one or more target substrates contributes
          to the pathogenesis of the Ogden syndrome.
        supports: SUPPORT
    origin:
