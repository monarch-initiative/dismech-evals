      assertion_type: DifferentialDiagnosis
      assertion:
        name: NAA15-related neurodevelopmental disorder
        description: Primary pathogenic NAA15 variants cause a distinct autosomal dominant neurodevelopmental
          disorder with overlapping developmental and cardiac features. This should not be conflated with
          classic NAA10 p.Ser37Pro Ogden syndrome, even though the NAA15-binding interface is relevant
          to NatA complex biology and to severity of some NAA10 variants.
        distinguishing_features:
        - Primary NAA15 variants indicate an autosomal dominant NAA15-related neurodevelopmental disorder,
          not classic X-linked Ogden syndrome.
        - Classic Ogden syndrome is defined by hemizygous NAA10 p.Ser37Pro in affected males with early
          lethal progeroid/cardiac disease.
      selected_evidence:
        snippet: Variants in NAA15 have also been found in patients with congenital heart disease, intellectual
          disability, and/or autism20,56,57.
        supports: SUPPORT
