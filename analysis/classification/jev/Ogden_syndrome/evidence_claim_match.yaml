      assertion:
        name: NAA10-related syndrome
        description: Ogden syndrome represents the severe classic end of the broader NAA10-related syndrome
          spectrum and must be distinguished from milder NAA10-associated neurodevelopmental phenotypes
          in females and in individuals with non-Ser37Pro variants.
        distinguishing_features:
        - The recurrent hemizygous NAA10 p.Ser37Pro genotype with early lethality, progeroid appearance,
          and prominent cardiac disease favors classic Ogden syndrome.
        - Broader NAA10-related syndrome typically includes more variable and often milder developmental
          phenotypes across both sexes.
        disease_term:
          preferred_term: NAA10-related syndrome
          term:
            id: MONDO:0100124
            label: NAA10-related syndrome
      selected_evidence:
        snippet: NAA10-related syndrome is an X-linked condition with a broad spectrum of findings ranging
          from a severe phenotype in males with p.Ser37Pro in NAA10, originally described as Ogden syndrome,
          to the milder NAA10-related intellectual disability found with different variants in both males
          and females.
        supports: SUPPORT
