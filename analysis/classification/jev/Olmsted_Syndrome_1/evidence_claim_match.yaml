        name: Trpv3 G573S mouse on 129S1/SvImJ background (pathogen-free)
        species: Mouse
        genotype: Trpv3 G573S gain-of-function point mutation, re-derived and backcrossed onto 129S1/SvImJ
        background: 129S1/SvImJ
        genes:
        - preferred_term: TRPV3
          term:
            id: hgnc:18084
            label: TRPV3
        publication: PMID:35058747
        description: The Gly573Ser allele re-derived on a 129S1/SvImJ background and housed free of Staphylococcus
          aureus. Unlike DS-Nh mice, these animals develop neither dermatitis nor spontaneous scratching;
          pruritogen-evoked scratching, cold perception and acute mechanical pain are reduced, and the
          epidermis is hypoinnervated. The model shows that the dermatitis and itch of the variant depend
          on genetic background and skin microbiome.
        modeled_mechanisms:
        - target: Cutaneous Inflammation with Mast Cell Infiltration
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: TISSUE
          description: No dermatitis develops under S. aureus-free conditions despite the same gain-of-function
            allele.
          limitations: The negative result is conditional on pathogen-free housing and the 129S1/SvImJ
            background; it does not show that the allele cannot cause inflammation, only that it does
            not do so alone.
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: Staphylococcus aureus colonisation, on which the DS-Nh dermatitis depends, is
              excluded by the housing conditions, so a trigger that patients' skin carries is outside
              the model.
          readouts:
          - name: Spontaneous dermatitis
            target: Cutaneous Inflammation with Mast Cell Infiltration
            direction: UNCHANGED
            interpretation: No dermatitis in mutants or littermates under pathogen-free housing.
        - target: Keratinocyte-Driven Itch Signaling
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: No spontaneous itch, and pruritogen-evoked scratching is reduced rather than increased.
          limitations: Scratching behaviour is an organism-level proxy; the reduced pruritogen-evoked
            scratching is attributed by the authors to epidermal sensory hypoinnervation, a developmental
            consequence of the hyperactive channel that patients have not been examined for.
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: Scratching bouts and epidermal nerve fibre density stand in for the keratinocyte-to-neuron
              signalling the node describes.
          readouts:
          - name: Spontaneous scratching behaviour
            target: Keratinocyte-Driven Itch Signaling
            direction: UNCHANGED
            interpretation: No spontaneous scratching under pathogen-free housing.
          - name: Pruritogen-evoked scratching
            target: Keratinocyte-Driven Itch Signaling
            direction: DECREASED
            interpretation: Scratching in response to pruritogens is markedly reduced in mutants.
          - name: Epidermal sensory innervation
            target: Keratinocyte-Driven Itch Signaling
            direction: DECREASED
            interpretation: Epidermal sensory hypoinnervation, proposed by the authors to underlie the
              reduced itch and pain responses.
      selected_evidence:
        snippet: We re-derived the Trpv3G573S mutants using 129S1/SvlmJ eggs; the animals obtained were
          then backcrossed to 129S1/SvlmJ background for six-eight generations.
        supports: SUPPORT
