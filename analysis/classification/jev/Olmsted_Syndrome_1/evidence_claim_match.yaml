  a32e97d4471141a181da6a79badedc78f74014f10a950a5e9428e160f1758637:
    claim:
      about:
        disease:
          name: Olmsted Syndrome 1
          disease_term:
            preferred_term: Olmsted syndrome 1
            term:
              id: MONDO:0100296
              label: Olmsted syndrome 1
        context: []
      assertion_type: Genetic
      assertion:
        name: TRPV3
        gene_term:
          preferred_term: TRPV3
          term:
            id: hgnc:18084
            label: TRPV3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: Heterozygous missense variants in TRPV3, encoding the transient receptor potential vanilloid
          3 cation channel expressed in keratinocytes and hair follicles, cause Olmsted syndrome 1. Recurrent
          variants cluster at Gly573 (G573S, G573C), Gly568 (G568D, G568V), Leu673 (L673F) and Trp692
          (W692G, W692C, W692S); variants in the S4-S5 linker and TRP domain produce the strongest channel
          gain of function and the severest phenotypes, whereas other positions (for example R416Q) give
          milder disease. Most variants arise de novo. No ClinGen gene-disease validity assertion for
          TRPV3 was found in the committed ClinGen validity export (cache/clingen/gene_validity.csv),
          so no gene_disease_validity tier is recorded.
        variants:
        - name: p.Gly573Ser (G573S)
          description: The first and most recurrent Olmsted syndrome variant, identified de novo in the
            index trio and in three further patients; the same substitution occurs spontaneously in the
            hairless DS-Nh mouse.
          clinical_significance: PATHOGENIC
          variant_type: single nucleotide variant
        - name: p.Trp692Gly (W692G) and p.Trp692Cys (W692C)
          description: Substitutions of Trp692 in the TRP domain, each identified as a de novo heterozygous
            variant in a patient with the classic mutilating phenotype.
          clinical_significance: PATHOGENIC
          variant_type: single nucleotide variant
        - name: p.Leu673Phe (L673F)
          description: A recurrent S4-S5 linker variant associated with severe disease and erythromelalgia-like
            inflammatory flares.
          clinical_significance: PATHOGENIC
          variant_type: single nucleotide variant
        - name: p.Val306Met (V306M)
          description: An atypical variant in exon 8 reported in an adult with mutilating keratoderma
            who developed plantar squamous cell carcinoma.
          clinical_significance: LIKELY_PATHOGENIC
          variant_type: single nucleotide variant
        - name: p.Gly573Ala (G573A)
          description: A third substitution of the Gly573 hotspot, found in a patient whose immunological
            work-up showed hyper-IgE, eosinophilia and frequent skin infections.
          clinical_significance: LIKELY_PATHOGENIC
          variant_type: single nucleotide variant
        - name: p.Met672Ile (M672I)
          description: A familial variant segregating through three generations with a mild, partly nonpenetrant,
            atypical phenotype (sclerodactyly-like fingers in the proband, focal plantar plaques in the
            grandfather); it increases apoptosis of HaCaT keratinocytes but less than the classic hotspot
            variants.
          clinical_significance: LIKELY_PATHOGENIC
          variant_type: single nucleotide variant
        - name: p.Leu655Pro (L655P)
          description: A heterozygous variant in exon 15 found in a patient with classic Olmsted syndrome
            and in his father, treated with erlotinib. The source abstract calls c.1964T>C a frameshift
            mutation, but a single-nucleotide substitution producing p.Leu655Pro is a missense change,
            as the article title states; the same residue was reported as L655P in the genotype-phenotype
            series.
          clinical_significance: LIKELY_PATHOGENIC
          variant_type: single nucleotide variant
      selected_evidence:
        snippet: Nucleotide sequencing of five additional affected individuals also revealed missense
          mutations in TRPV3 (which produced p.Gly573Ser in three cases and p.Gly573Cys and p.Trp692Gly
          in one case each).
        supports: SUPPORT
