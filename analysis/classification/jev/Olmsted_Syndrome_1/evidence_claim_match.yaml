        context: []
      assertion_type: AnimalModel
      assertion:
        name: DS-Nh mouse (spontaneous Trpv3 Gly573Ser)
        species: Mouse
        genotype: Trpv3 Gly573Ser (Nh), heterozygous, autosomal dominant
        background: DS
        genes:
        - preferred_term: TRPV3
          term:
            id: hgnc:18084
            label: TRPV3
        publication: PMID:16858425
        description: Spontaneous hairless mutant carrying the same Gly573Ser substitution found in patients.
          Develops dominant hairlessness, spontaneous allergic and pruritic dermatitis with increased
          lesional mast cells, and scratching behaviour; it does not develop palmoplantar keratoderma.
        modeled_mechanisms:
        - target: Hair Follicle Dysfunction
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: The patient G573S variant causes dominant hairlessness.
          limitations: Rodent hairlessness is complete, whereas human alopecia is variable; the mouse
            lacks the palmoplantar and periorificial keratoderma that define the human disease.
          readouts:
          - name: Hair coat
            target: Hair Follicle Dysfunction
            direction: ABOLISHED
            interpretation: Spontaneous hairlessness inherited with the Trpv3 variant.
        - target: Cutaneous Inflammation with Mast Cell Infiltration
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Spontaneous dermatitis with increased lesional mast cells.
          limitations: 'The rodent dermatitis is allergic in character and depends on housing conditions
            and genetic background: the same variant re-derived on 129S1/SvImJ and kept Staphylococcus
            aureus-free develops no dermatitis (PMID:35058747). Its relation to the inflammatory flares
            of patients is inferred.'
          readouts:
          - name: Lesional mast cell count
            target: Cutaneous Inflammation with Mast Cell Infiltration
            direction: INCREASED
            interpretation: Increased mast cells in dermatitis lesions versus parental strains.
        - target: Keratinocyte-Driven Itch Signaling
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Mice carrying the Nh variant scratch spontaneously, independently of dermatitis.
          limitations: Scratching behaviour is an organism-level proxy for itch; the keratinocyte signalling
            step is inferred rather than measured in this strain.
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The readout is scratching bouts, standing in for keratinocyte-to-neuron itch
              signalling, which is the quantity the node describes.
          readouts:
          - name: Spontaneous scratching behaviour
            target: Keratinocyte-Driven Itch Signaling
            direction: INCREASED
            interpretation: Scratching develops separately from dermatitis in C57BL-Nh mice.
        notes: The WBN/Kob-Ht rat carries the paralogous Gly573Cys substitution (the patient G573C variant)
          with the same hairless and dermatitis phenotype (PMID:16858425); it is recorded here rather
          than as a separate model because the same publication characterises both strains together.
      selected_evidence:
        snippet: 'An amino-acid substitution at the same position in one gene was detected in DS-Nh mice
          and WBN/Kob-Ht rats: Gly573 to Ser (Nh mutation) or Gly573 to Cys (Ht mutation), located in
          the transient receptor potential (TRP) cation channel subfamily V member 3 (TRPV3) gene.'
        supports: SUPPORT
