      assertion:
        name: TRPV3 Gain-of-Function Channel Activation
        description: Missense variants in TRPV3 lock the thermosensitive, calcium-permeable cation channel
          into a constitutively open state. Expressed in HEK293 cells, Olmsted syndrome variants conduct
          much larger inward currents than wild-type channel, with elevated basal open probability and
          increased voltage sensitivity; the magnitude of the gain of function tracks clinical severity.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genetic_context:
          gene:
            preferred_term: TRPV3
            term:
              id: hgnc:18084
              label: TRPV3
          allele_type: missense
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: Heterozygous, mostly de novo, germline missense variants; the channel is constitutively
            active rather than merely more active, so the variant consequence is recorded as GAIN_OF_FUNCTION.
        genes:
        - preferred_term: TRPV3
          term:
            id: hgnc:18084
            label: TRPV3
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        molecular_functions:
        - preferred_term: TRPV3 calcium-permeable cation channel activity
          term:
            id: GO:0005262
            label: calcium channel activity
          modifier: GAIN_OF_FUNCTION
          description: The variant channel opens constitutively, outside its normal temperature and ligand
            gating, which is a qualitative loss of regulatory constraint rather than a quantitative increase
            in a regulated activity.
      selected_evidence:
        snippet: In transfected HEK293 cells expressing TRPV3 mutants, much larger inward currents were
          recorded, probably because of the constitutive opening of the mutants.
        supports: SUPPORT
