      assertion_type: ChannelopathyAssignment
      assertion:
        classification_value: epithelial channelopathy
        notes: TRPV3 is a calcium-permeable cation channel expressed in epidermal keratinocytes, an epithelial
          cell type, and the disease arises from its constitutive activation. ChannelopathyOrganSystemEnum
          has no skin-specific value; of the four values, epithelial channelopathy is the one that names
          the affected tissue type rather than an unaffected organ system.
      selected_evidence:
        snippet: We have previously shown that gain-of-function variations in transient receptor potential
          vanilloid-3 (TRPV3) underlay Olmsted syndrome, a rare hyperkeratotic skin channelopathy.
        supports: SUPPORT
