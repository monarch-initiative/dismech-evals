      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27754757
      reference_title: TRPV3 mutants causing Olmsted Syndrome induce impaired cell adhesion and nonfunctional
        lysosomes.
      evidence_source: IN_VITRO
      explanation: ER retention of the Olmsted syndrome variants in expression systems.
