  82b8f73127a2b2b8adbc9db887ae191439272a1e80d15b23a1f87f231ae4c19d:
    claim:
      about:
        disease:
          name: Olmsted Syndrome 1
          disease_term:
            preferred_term: Olmsted syndrome 1
            term:
              id: MONDO:0100296
              label: Olmsted syndrome 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: os1_immune_dysregulation_hypothesis
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        prompt: Is immune dysregulation (hyper-IgE, eosinophilia, recurrent skin infection) a primary
          consequence of TRPV3 gain of function, or secondary to barrier failure and infection of the
          keratotic skin?
        attaches_to:
        - pathophysiology#Cutaneous Inflammation with Mast Cell Infiltration
        - phenotypes#Increased circulating IgE concentration
        - phenotypes#Eosinophilia
        - phenotypes#Recurrent skin infections
        rationale: A single profiled G573A patient had hyper-IgE, persistent eosinophilia, elevated circulating
          follicular helper T cells and frequent dermal infections. TRPV3 is also expressed by Langerhans
          cells, so a primary immunological contribution cannot be excluded, but barrier failure in fissured
          keratotic skin would produce the same picture secondarily. No cohort has been immunophenotyped.
        posed_by: dismech curation
        posed_date: '2026-10-13T00:00:00Z'
      selected_evidence:
        snippet: The systemic phenotype of hyper IgE and persistent eosinophilia suggest a primary or
          secondary role of immunological processes in the pathogenesis of Olmsted syndrome, and have
          important clinical consequences with regard to the treatment of Olmsted syndrome patients.
        supports: SUPPORT
