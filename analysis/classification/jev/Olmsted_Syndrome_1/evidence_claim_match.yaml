              DS-Nh mice carrying the variant scratch spontaneously even without dermatitis. The output
              is conditional: the same Gly573Ser variant on a 129S1/SvImJ background under Staphylococcus
              aureus-free housing produces no spontaneous itch, reduced pruritogen-evoked scratching and
              epidermal sensory hypoinnervation, so hyperactive TRPV3 does not cause itch unconditionally.'
