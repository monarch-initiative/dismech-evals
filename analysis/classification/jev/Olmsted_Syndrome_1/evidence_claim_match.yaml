      assertion_type: Discussion
      assertion:
        discussion_id: os1_lysosomal_trafficking_hypothesis
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        prompt: Do Olmsted syndrome TRPV3 variants injure keratinocytes through impaired channel trafficking
          and lysosomal dysfunction in addition to plasma-membrane calcium overload?
        attaches_to:
        - pathophysiology#Keratinocyte Calcium Overload
        - pathophysiology#Keratinocyte Apoptosis
        rationale: In heterologous expression, G573A/S/C and W692G variants are largely retained in the
          endoplasmic reticulum, reduce surface delivery of other membrane proteins, impair cell adhesion
          and reduce lysosome number, and G568C/G568D variants leak calcium from lysosomes and disturb
          lysosomal pH. These findings come from transfected non-keratinocyte cell lines and have not
          been confirmed in patient keratinocytes or skin.
        posed_by: dismech curation
        posed_date: '2026-10-13T00:00:00Z'
      selected_evidence:
        snippet: Our qualitative and quantitative data suggests that these naturally occurring TRPV3 mutants
          are mainly restricted in the ER.
        supports: SUPPORT
    origin:
