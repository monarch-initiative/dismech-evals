          differ from the dominant gain-of-function variants?
        attaches_to:
        - inheritance#Autosomal recessive inheritance
        - pathophysiology#TRPV3 Gain-of-Function Channel Activation
        rationale: Dominant disease is explained by constitutively open heteromeric channels, but a recessive
          mode implies that one wild-type allele suffices to prevent disease, which the simple gain-of-function
          model does not predict. The recessive report (PMID:24606194) is a letter without an abstract,
          so the recessive claim is carried by the review only.
        posed_by: dismech curation
        posed_date: '2026-10-13T00:00:00Z'
      selected_evidence:
        snippet: Mutations in TRPV3 (Transient receptor potential vanilloid-3) gene have recently been
          identified as a cause of autosomal dominant (gain-of-function mutations) or recessive OS.
