          (its only molecular function annotations in QuickGO are generic protein binding, GO:0005515,
          from interaction assays), so no informative term is available to bind.'
        variants:
        - name: PERP p.Trp151*
          description: Nonsense variant in the terminal exon, reported with two different nucleotide changes
            (c.452G>A and c.453G>A) in unrelated families, including one transmitted from an affected
            father to his daughter.
          gene:
            preferred_term: PERP
            term:
              id: hgnc:17637
              label: PERP
          clinical_significance: PATHOGENIC
        - name: PERP p.Tyr153*
          description: Nonsense variant in the terminal exon (c.459C>G in the founding report), two residues
            downstream of p.Trp151*.
          gene:
            preferred_term: PERP
            term:
              id: hgnc:17637
              label: PERP
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Here we show that mutations in PERP, encoding a crucial component of desmosomes, cause
          both dominant and recessive human keratoderma.
        supports: SUPPORT
