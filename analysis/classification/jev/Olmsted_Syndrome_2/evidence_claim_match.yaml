      assertion_type: Pathophysiology
      assertion:
        name: Unstable Desmosomal Incorporation of Truncated PERP
        description: In keratinocytes from a p.Tyr153* patient the truncated PERP reaches the plasma membrane
          normally but is enriched in the Triton X-100 soluble fraction, the behavior of a protein not
          stably held in desmosomes. Other desmosomal proteins, E-cadherin and claudin 1 keep normal solubility
          profiles, and their localization in skin is normal, which distinguishes this disease from desmosomal
          disorders in which other junction components are mislocalized.
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        cellular_components:
