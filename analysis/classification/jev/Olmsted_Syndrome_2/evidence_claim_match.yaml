  863a68612238526fe7949c32431bbacde98b4c6c477eff627cb13242d40cbfed:
    claim:
      about:
        disease:
          name: Olmsted Syndrome 2
          disease_term:
            preferred_term: Olmsted syndrome 2
            term:
              id: MONDO:0030961
              label: Olmsted syndrome 2
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Perp-null mouse
        species: Mouse
        genotype: Perp-/- (constitutive null)
        publication: PMID:15797384
        description: Constitutive Perp knockout mice die postnatally with blistering of stratified epithelia
          and structural desmosome defects. The model is a null allele and so corresponds to the recessive
          loss-of-function PERP disease rather than to the dominant C-terminal truncation of this entry.
        modeled_mechanisms:
        - target: Immature Desmosomes Lacking the Electron-Dense Midline
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: CELLULAR
          description: Perp-deficient skin carries numerous structural desmosome defects.
          limitations: A null allele, not the dominant last-exon truncation; heterozygous Perp mice have
            no reported phenotype, so the dominant disease is not modeled.
          divergences:
          - divergence_type: CAUSE_UNREPRESENTED
            materiality: QUALIFYING
            description: The OLMS2 lesion is a truncated PERP protein made from one allele. The model
              removes PERP entirely from both alleles, so it shows what loss of PERP does to desmosomes,
              not what the truncated protein does.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: The desmosome observations are made in mouse stratified epithelia, not in the
              human palmoplantar and periorificial skin affected in OLMS2.
        - target: Impaired Keratinocyte Adhesion Under Mechanical Stress
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: TISSUE
          description: The null mouse blisters, a stronger adhesion failure than is seen clinically in
            OLMS2.
          limitations: Blistering is not reported in OLMS2 patients; the null allele produces a more severe
            adhesion failure than the dominant truncation.
          divergences:
          - divergence_type: CAUSE_UNREPRESENTED
            materiality: QUALIFYING
            description: Complete loss of PERP stands in for a truncated protein expressed from one allele,
              which changes the severity of the adhesion defect.
      selected_evidence:
        snippet: Perp-/- mice die postnatally, with dramatic blistering in stratified epithelia symptomatic
          of compromised adhesion.
        supports: SUPPORT
