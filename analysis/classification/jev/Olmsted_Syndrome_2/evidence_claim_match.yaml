  9633d8712290b316bb70f04902abe5b12d4609de21cc634a6c023b278926f522:
    claim:
      about:
        disease:
          name: Olmsted Syndrome 2
          disease_term:
            preferred_term: Olmsted syndrome 2
            term:
              id: MONDO:0030961
              label: Olmsted syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PERP Last-Exon Nonsense Variant
        description: 'Heterozygous nonsense variants in the third and last exon of PERP, p.Trp151* (c.452G>A
          or c.453G>A) and p.Tyr153* (c.459C>G), lie within two residues of each other. Because they sit
          in the terminal exon the mutant transcript escapes nonsense-mediated decay, and patient keratinocytes
          make a C-terminally truncated protein. The authors argue against haploinsufficiency: obligate
          heterozygous carriers of an N-terminal truncation are unaffected, PERP truncating alleles occur
          in control databases, and Perp heterozygous mice have no phenotype. Their favored model is a
          combined dominant-negative and neomorphic effect, which remains untested.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: PERP
          term:
            id: hgnc:17637
            label: PERP
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        genetic_context:
          allele_type: nonsense variant in the terminal exon
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: UNKNOWN
          description: The functional class is recorded as unknown because the reporting authors propose,
            but do not demonstrate, a dominant-negative and neomorphic mechanism.
      selected_evidence:
        snippet: it is highly unlikely that OS in subjects with the heterozygous p.Trp151* and p.Tyr153*
          mutations is due to haploinsufficiency
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
