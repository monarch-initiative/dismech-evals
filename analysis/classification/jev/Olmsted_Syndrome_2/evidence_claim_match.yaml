            id: GO:0030057
            label: desmosome
        genes:
        - preferred_term: PERP
          term:
            id: hgnc:17637
            label: PERP
      selected_evidence:
        snippet: Other desmosomal proteins showed normal solubility profiles consistent with stable incorporation
        supports: SUPPORT
