      assertion_type: DifferentialDiagnosis
      assertion:
        name: Gastroschisis
        description: Congenital paraumbilical abdominal wall defect with evisceration of bowel lacking
          a covering membranous sac and displaying a distinct pattern of associated anomalies (predominantly
          intestinal rather than cardiac or chromosomal).
        distinguishing_features:
        - Paraumbilical defect without a covering peritoneal/amniotic sac, whereas omphalocele occurs
          at the umbilical cord base with a sac.
