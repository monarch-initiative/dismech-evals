  73e6f81e2db6e80a880d828c5430d44ac3e7ce6a6875c86252511ba95c067518:
    claim:
      about:
        disease:
          name: Omphalocele
          disease_term:
            preferred_term: Omphalocele
            term:
              id: MONDO:0019015
              label: omphalocele
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pulmonary Hypoplasia and Pulmonary Hypertension
        description: In large/giant omphalocele the reduced intra-abdominal domain and abnormal thoraco-abdominal
          dynamics constrain fetal lung expansion, producing pulmonary hypoplasia with impaired pulmonary
          vascular development. This contributes to elevated pulmonary vascular resistance and pulmonary
          hypertension, a major driver of neonatal respiratory morbidity and mortality, and a key consideration
          when planning closure (avoiding increases in intra-abdominal pressure that worsen ventilation).
        cell_types:
        - preferred_term: Pulmonary artery endothelial cell
          term:
            id: CL:1001568
            label: pulmonary artery endothelial cell
        - preferred_term: Pulmonary arterial smooth muscle cell
          term:
            id: CL:0002591
            label: smooth muscle cell of the pulmonary artery
        biological_processes:
        - preferred_term: Lung development
          term:
            id: GO:0030324
            label: lung development
          modifier: DECREASED
        - preferred_term: Pulmonary vasculature development
          term:
            id: GO:0001944
            label: vasculature development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Among its most significant complications, pulmonary hypoplasia (PH) and pulmonary hypertension
          (PPH) have been shown to negatively impact neonatal prognosis. These conditions result from
          impaired pulmonary vascular development, leading to respiratory distress and hypoxemia.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40150018
      reference_title: 'Omphalocele and Associated Anomalies: Exploring Pulmonary Development and Genetic
        Correlations-A Literature Review.'
      evidence_source: HUMAN_CLINICAL
      explanation: Directly supports pulmonary hypoplasia and pulmonary hypertension arising from impaired
        pulmonary vascular development as major complications.
