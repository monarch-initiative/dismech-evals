        phase: Neonatal outcome (chromosome/anomaly dependent)
        notes: Omphalocele is congenital and frequently diagnosed prenatally by ultrasound. Prognosis
          is driven primarily by associated anomalies and chromosomal/ syndromic diagnoses rather than
          the abdominal wall defect alone; in the absence of chromosomal defects survival is reasonably
          good. In the Finnish cohort, 1-year survival was 80% for isolated omphalocele versus 17% for
          neonates with chromosomal defects.
      selected_evidence:
        snippet: Total 1-year survival rates for isolated omphalocele, cases with multiple anomalies and
          neonates with chromosomal defects were 80, 88, and 17%, respectively.
        supports: SUPPORT
