  d8a180c5b70a68f56a7daac404cb82e9164f849edbfb4b5bb87fa4e48d44d35a:
    claim:
      about:
        disease:
          name: Omphalocele
          disease_term:
            preferred_term: Omphalocele
            term:
              id: MONDO:0019015
              label: omphalocele
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ventral Body Wall Closure Failure
        description: The primary developmental lesion in omphalocele is failure to complete normal ventral
          body wall formation at the umbilical region. During normal embryogenesis the lateral, cephalic,
          and caudal body folds migrate ventrally and fuse at the umbilical ring; failure of this morphogenetic
          process leaves a central defect through which abdominal viscera herniate into the base of the
          umbilical cord, covered by a membranous (peritoneum/Wharton's jelly/amnion) sac. This distinguishes
          omphalocele from gastroschisis (a paraumbilical defect without a sac).
        locations:
        - preferred_term: abdominal wall
          term:
            id: UBERON:0003697
            label: abdominal wall
        - preferred_term: umbilical cord
          term:
            id: UBERON:0002331
            label: umbilical cord
        cell_types:
        - preferred_term: Body wall mesenchymal cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
        - preferred_term: Body wall fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: Embryonic body morphogenesis (ventral body wall closure)
