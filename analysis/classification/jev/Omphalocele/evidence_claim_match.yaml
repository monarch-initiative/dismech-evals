          anomalies predominate in omphalocele.
      selected_evidence:
        snippet: In patients with gastroschisis, intestinal anomalies were most identified (n = 13, 15.9%),
          whereas, in patients with omphalocele, cardiac anomalies were most identified (n = 15, 37.5%).
