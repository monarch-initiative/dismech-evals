        description: Abdominal viscera - intestine and, in large/giant defects, the liver - herniate through
          the body wall defect into the sac. In normal development a physiologic midgut herniation occurs
          at ~6-10 weeks' gestation and returns to the abdominal cavity; persistence/failure of this return
          contributes to the pathologic herniation. The resulting reduction in intra-abdominal domain
          produces viscero-abdominal disproportion, which both complicates surgical reduction (risk of
          abdominal compartment syndrome) and, in giant defects, constrains thoraco-abdominal development.
        locations:
