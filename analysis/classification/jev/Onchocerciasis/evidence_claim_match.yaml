        discussion_id: gap_onchocerciasis_associated_epilepsy_causality
        prompt: Does Onchocerca volvulus infection cause epilepsy, and if so by what mechanism, given
          that the evidence is epidemiological association and no causal pathway has been established?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Microfilarial Skin and Ocular Infiltration
        rationale: Cohort data link childhood microfilarial load to later epilepsy, and epilepsy clusters
          in highly endemic areas, but the entry has no neurological mechanism node because none is established.
          Co-endemic infections such as cysticercosis are a competing explanation in some areas, so the
          association cannot yet be read as causation.
      selected_evidence:
        snippet: Retrospective cohort studies in Cameroon found an association between Onchocerca volvulus
          microfilarial load in childhood (measured in 1991-1993) and risk of developing epilepsy later
          in life (measured in 2017).
        supports: SUPPORT
