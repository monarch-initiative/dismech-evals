      assertion_type: Pathophysiology
      assertion:
        name: Microfilarial Skin and Ocular Infiltration
        description: Onchocerca volvulus microfilariae migrate from subcutaneous nodules into the skin
          and anterior chamber of the eye. Their accumulation and death trigger host inflammatory responses
          causing dermatitis, hypopigmentation, and progressive ocular disease that can advance to blindness.
        biological_processes:
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: Onchocercal ocular disease covers a large spectrum of manifestations, which in severe
          cases, may lead to blindness.
        supports: SUPPORT
