        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Wolbachia Endosymbiont-Driven Filarial Pathogenesis
        description: Onchocerca volvulus harbors obligate Wolbachia endosymbionts that support filarial
          survival and reproduction and contribute to the severity of host inflammatory pathology. Targeting
          Wolbachia with doxycycline depletes adult worms and reduces progression of ocular disease.
      selected_evidence:
        snippet: chemotherapeutic approach that targets filarial Wolbachia symbionts in the treatment
          and control of onchocerciasis, however, suggests that 100 mg/d of doxycycline for 6 weeks might
          be effective in reducing the filarial load and preventing ocular symptoms
        supports: SUPPORT
    origin:
