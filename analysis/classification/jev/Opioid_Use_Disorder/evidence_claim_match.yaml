      evidence_source: MODEL_ORGANISM
      explanation: 'Contradicts transfer of this model from 18-MC to ibogaine: the congener carrying most
        of the in vivo alpha3beta4 evidence is stated not to share ibogaine''s mechanism or site of action.'
