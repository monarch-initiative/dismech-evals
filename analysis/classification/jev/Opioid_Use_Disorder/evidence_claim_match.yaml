      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ibogaine_kappa_biased_agonism_model
        hypothesis_label: Noribogaine G-protein-biased kappa-opioid agonism model
        status: EMERGING
        description: 'Proposes that the anti-opioid action of ibogaine is carried principally by noribogaine''s
          G-protein-biased agonism at the kappa-opioid receptor, with weak mu-opioid antagonism as a secondary
          contributor. Bias away from beta-arrestin recruitment is invoked to explain why the compound
          lacks the dysphoria of conventional kappa agonists, and functional inhibition of dynorphin-driven
          beta-arrestin signalling is invoked to explain relief of the hyperkatifeia/anti-reward state.
          The strongest support is structural rather than loss-of-function: iboga analogues engineered
          as potent kappa agonists retain long-lasting suppression of opioid intake and reverse opioid-induced
          hyperalgesia while shedding the cardiac liability. That establishes kappa agonism as sufficient
          in rodents, not that ibogaine itself acts through kappa.'
        notes: 'Distinguishing test: a selective kappa antagonist, or a kappa-receptor knockout, should
          abolish ibogaine''s suppression of opioid self-administration if this model holds. Note also
          that the micromolar affinities involved mean the model depends on brain concentrations actually
          reached at therapeutic doses, which is where the CYP2D6-driven exposure variability becomes
          mechanistically relevant rather than merely a safety issue.'
      selected_evidence:
        snippet: Noribogaine was a weak mu antagonist with a functional inhibition constants (Ke) of 20
          μM at the G-protein and β-arrestin signaling pathways
        supports: SUPPORT
