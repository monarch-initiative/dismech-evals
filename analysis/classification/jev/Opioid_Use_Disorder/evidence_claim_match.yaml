      - /disease_term
    evidence_metadata:
      reference: PMID:35513117
      reference_title: The G-protein biased kappa opioid agonists, triazole 1.1 and nalfurafine, produce
        non-uniform behavioral effects in male rhesus monkeys.
      evidence_source: MODEL_ORGANISM
      explanation: Questions whether G-protein bias is the reason biased kappa agonists have milder profiles,
        which is the explanatory device this hypothesis relies on.
