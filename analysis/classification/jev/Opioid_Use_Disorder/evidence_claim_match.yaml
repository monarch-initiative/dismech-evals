        description: The withdrawal/negative-affect stage combines a within-system reward deficit (reduced
          dopaminergic and opioid-peptide tone in ventral striatum) with between-system recruitment of
          extended-amygdala stress mediators — corticotropin-releasing factor, dynorphin, norepinephrine,
          hypocretin, glucocorticoids. The resulting dysphoria, anxiety, and anhedonia extend into protracted
          abstinence and drive relapse by negative reinforcement.
        locations:
        - preferred_term: central amygdala
          term:
            id: UBERON:0002883
            label: central amygdaloid nucleus
        - preferred_term: nucleus accumbens
          term:
            id: UBERON:0001882
            label: nucleus accumbens
        biological_processes:
        - preferred_term: dopamine secretion
          term:
            id: GO:0014046
            label: dopamine secretion
          modifier: DECREASED
      selected_evidence:
        snippet: Such negative emotional states that drive negative reinforcement are hypothesized to
          derive from the within-system dysregulation of key neurochemical circuits that mediate incentive-salience
          and/or reward systems (dopamine, opioid peptides) in the ventral striatum and from the between-system
          recruitment of brain stress systems (corticotropin-releasing factor, dynorphin, norepinephrine,
          hypocretin, vasopressin, glucocorticoids, and neuroimmune factors) in the extended amygdala.
        supports: SUPPORT
