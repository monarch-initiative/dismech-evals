  94aa2b6b18462d3d964d41ffa068dd3d80d1a9c7d4389375f0ebf0dd6c2aa6c2:
    claim:
      about:
        disease:
          name: Opioid Use Disorder
          disease_term:
            preferred_term: opioid use disorder
            term:
              id: MONDO:0005530
              label: opiate dependence
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: oud_iboga_preclinical_versus_randomized_human_divergence
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why do rodent models and uncontrolled human series report large anti-opioid effects for
          iboga alkaloids while the one randomized trial in opioid-dependent patients found non-significant
          reductions in withdrawal?
        attaches_to:
        - mechanistic_hypotheses#ibogaine_kappa_biased_agonism_model
        - mechanistic_hypotheses#ibogaine_gdnf_vta_neuroplasticity_model
        - mechanistic_hypotheses#ibogaine_alpha3beta4_habenular_model
        - pathophysiology#Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome
        rationale: 'The evidence supporting every mechanism here is rodent self-administration and uncontrolled
          human observation, and both are prone to the same inflation. Within the preclinical corpus itself
          the effect is not uniform: a systematic scoping review found seven of forty studies showed no
          improvement over controls, three of them on ibogaine. On the human side, the randomized comparison
          that does exist gave noribogaine to opioid-dependent patients and produced dose-dependent QTc
          prolongation with withdrawal reductions that did not reach significance. The mechanistic hypotheses
          are being fitted to an effect whose size in controlled human testing is not established, and
          the strongest recent preclinical result was obtained in male rats only. This is a translational-validity
          gap rather than an absence of evidence, which is why it is recorded as a model mismatch.'
        proposed_experiments:
        - experiment_id: exp_oud_iboga_preclinical_effect_size_replication
          name: Multi-site blinded replication of the iboga anti-opioid effect with both sexes
          description: Run a preregistered, blinded, multi-laboratory replication of single-dose iboga
            alkaloid effects on opioid self-administration and reinstatement, with randomization, adequate
            power, both sexes, and a common protocol. Report effect sizes rather than significance, and
            treat the published null studies as prior observations to be reconciled rather than excluded.
            The purpose is to establish the size of the effect the mechanistic hypotheses are competing
            to explain, before further mechanism studies are designed around it.
          experiment_type:
            preferred_term: preregistered multi-laboratory replication study
          controls:
          - name: Blinded vehicle arm at every site
            description: Blinding is the specific missing control, since the reported effects come from
              unblinded rodent work and uncontrolled human series.
          - name: Female cohorts at every site
            description: The strongest recent preclinical result was obtained in male rats only, and the
              metabolite's bioavailability differs by sex in rodents.
          readouts:
          - name: Effect size of the durable reduction in opioid intake
            target: pathophysiology#Compulsive Opioid Seeking and Loss of Control
            direction: DECREASED
            interpretation: A pooled effect size, with its heterogeneity across sites and sexes, replaces
              the current position in which single-laboratory results and published nulls sit side by
              side unreconciled.
          decision_criterion: A replicable effect of stated size establishes the phenomenon the mechanistic
            hypotheses must explain and calibrates how much mechanism each needs to account for. Heterogeneity
            that tracks sex, strain or site relocates the question from mechanism to moderator.
      selected_evidence:
        snippet: demonstrated dose-dependent heart rate-corrected QT interval (QTc) prolongation with
          non-significant reductions in withdrawal symptoms
        supports: REFUTE
    origin:
      assertion_path: /discussions/9
      evidence_path: /discussions/9/evidence/0
      context_paths:
