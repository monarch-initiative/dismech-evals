  14f6d77ffc3a0ca145aabe385409e59a370f0c8b4789275b2c4da3b476fb4967:
    claim:
      about:
        disease:
          name: Opioid Use Disorder
          disease_term:
            preferred_term: opioid use disorder
            term:
              id: MONDO:0005530
              label: opiate dependence
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: oud_ibogaine_durability_versus_depot_pharmacokinetics
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the persistence of ibogaine's anti-opioid effect require an induced change in the
          brain, or can it be explained by continued drug exposure from sequestration in fat and conversion
          to a long-lived metabolite?
        attaches_to:
        - mechanistic_hypotheses#ibogaine_gdnf_vta_neuroplasticity_model
        - mechanistic_hypotheses#ibogaine_kappa_biased_agonism_model
        - mechanistic_hypotheses#ibogaine_alpha3beta4_habenular_model
        - pathophysiology#Compulsive Opioid Seeking and Loss of Control
        rationale: 'Every mechanism proposed for ibogaine''s durability is pharmacodynamic, so the shared
          premise that a lasting change in the brain is required has never itself been tested. The competing
          explanation is on the record and was raised by the originating laboratory: both ibogaine and
          18-MC are sequestered in fat, and long-term effects may reflect slow release and conversion
          to noribogaine rather than any induced remodelling. Human pharmacokinetics argue against this
          for the parent compound, whose clearance is rapid and CYP2D6-dependent, but noribogaine persists
          for days and no study has correlated the magnitude of the aftereffect with concurrent brain
          or plasma exposure. Until that is done, a positive result for any pharmacodynamic mechanism
          is confounded with continued occupancy of the same target.'
        proposed_experiments:
        - experiment_id: exp_oud_ibogaine_aftereffect_exposure_time_course
          name: Aftereffect magnitude against concurrent brain and plasma exposure
          description: 'In rats with established opioid self-administration, give a single ibogaine dose
            and then sample brain, plasma and adipose ibogaine and noribogaine at intervals spanning the
            aftereffect, pairing every pharmacokinetic sample with a behavioural session in the same animals.
            Add two dissociating arms: a lipectomised or lean-versus-obese comparison that alters depot
            capacity without altering the administered dose, and a dosing regimen matched to reproduce
            the noribogaine concentration time-course without the parent compound.'
          experiment_type:
            preferred_term: paired pharmacokinetic and behavioural time-course experiment
          perturbations:
          - name: Single systemic ibogaine dose
            target: pathophysiology#Compulsive Opioid Seeking and Loss of Control
            description: The standard single-dose regimen whose aftereffect is the phenomenon in question.
          - name: Depot capacity manipulation
            target: pathophysiology#Compulsive Opioid Seeking and Loss of Control
            description: Alteration of adipose depot capacity, holding administered dose constant, to
              change the predicted release profile without changing the pharmacodynamic exposure at dosing.
          controls:
          - name: Noribogaine-matched infusion without ibogaine
            description: Reproduces the metabolite exposure curve directly, separating sustained occupancy
              from anything the parent drug initiated.
          readouts:
          - name: Opioid intake at each time point paired with concurrent brain noribogaine
            target: pathophysiology#Compulsive Opioid Seeking and Loss of Control
            direction: DECREASED
            interpretation: 'The shape of the relation is the result: an aftereffect that tracks concurrent
              exposure is sustained occupancy, one that outlasts it is an induced change.'
          decision_criterion: If the aftereffect tracks concurrent brain noribogaine and scales with depot
            capacity, durability is pharmacokinetic and no induced-plasticity mechanism is required to
            explain it. If the aftereffect persists after exposure has fallen below target-engaging concentrations,
            a pharmacodynamic mechanism is required and the three competing hypotheses remain live.
          would_support:
          - mechanistic_hypotheses#ibogaine_gdnf_vta_neuroplasticity_model
          supporting_outcome:
          - Reduced opioid intake persisting after brain noribogaine falls below concentrations that engage
            any candidate target.
          refuting_outcome:
          - Aftereffect magnitude tracks concurrent exposure and scales with adipose depot capacity.
      selected_evidence:
        snippet: Ibogaine's long-term effects may be mediated by slow release from fat tissue (where ibogaine
          is sequestered) and conversion to noribogaine
        supports: SUPPORT
