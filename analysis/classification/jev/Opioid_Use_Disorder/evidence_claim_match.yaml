  171c4f6e617465468b96fd1cecc9737fe07afd2ae5efacb01c1f194d901dbcbe:
    claim:
      about:
        disease:
          name: Opioid Use Disorder
          disease_term:
            preferred_term: opioid use disorder
            term:
              id: MONDO:0005530
              label: opiate dependence
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: oud_noribogaine_kappa_state_dependence_untested
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does noribogaine act as a kappa agonist or, in the elevated-dynorphin state of opioid
          withdrawal, as a functional antagonist, and is that difference what reconciles a kappa-agonist
          mechanism with an antidepressant clinical effect?
        attaches_to:
        - mechanistic_hypotheses#ibogaine_kappa_biased_agonism_model
        - pathophysiology#Reward-System Downregulation and Hyperkatifeia
        rationale: The kappa model proposes an agonist to relieve the state whose validated treatment
          is kappa antagonism, and ibogaine's reported antidepressant effect deepens the mismatch. The
          reconciliation is that noribogaine inhibits dynorphin-driven beta-arrestin recruitment more
          potently than it stimulates G-protein signalling, so in a high-dynorphin state it may behave
          as a normalizer rather than an agonist. Every measurement supporting that reading was made in
          heterologous systems under basal conditions, so the state-dependence the reconciliation requires
          has never been observed. Separately, a nonhuman-primate comparison of two biased kappa agonists
          attributed their milder profile to factors other than G-protein bias, which weakens the explanatory
          device the model leans on hardest.
        proposed_experiments:
        - experiment_id: exp_oud_noribogaine_kappa_state_dependence
          name: State-dependent kappa signalling and behaviour under high dynorphin tone
          description: Measure noribogaine's kappa signalling under basal and elevated dynorphin tone
            in the same preparation, then test whether the direction of its behavioural effect follows.
            In vitro, compare G-protein and beta-arrestin responses with and without a dynorphin background
            across the concentration range achievable in brain. In vivo, compare noribogaine's effect
            on intracranial self-stimulation thresholds and on conditioned place preference in opioid-naive
            animals against animals in spontaneous or precipitated withdrawal, where dynorphin tone is
            elevated.
          experiment_type:
            preferred_term: state-dependent receptor signalling and behavioural comparison
          perturbations:
          - name: Noribogaine under basal versus elevated dynorphin tone
            target: pathophysiology#Reward-System Downregulation and Hyperkatifeia
            description: The same compound and concentration range applied in two states, which is the
              comparison the normalization reading requires and that no existing study makes.
          controls:
          - name: Reference kappa agonist and reference kappa antagonist arms
            description: A conventional agonist and norbinaltorphimine, run in both states, to place noribogaine
              on a scale rather than describing it in isolation.
          readouts:
          - name: Direction of effect on reward threshold in each state
            target: pathophysiology#Reward-System Downregulation and Hyperkatifeia
            direction: ALTERED
            interpretation: A reversal of direction between the naive and withdrawal states is the signature
              of state-dependent normalization; the same direction in both states means noribogaine is
              simply an agonist.
          decision_criterion: Direction of effect reversing between basal and high-dynorphin states supports
            rewriting the hypothesis as kappa-signalling normalization rather than kappa agonism. A pro-dysphoric
            effect in both states means the hypothesis is running in the wrong pharmacological direction
            and should be demoted.
          would_support:
          - mechanistic_hypotheses#ibogaine_kappa_biased_agonism_model
          supporting_outcome:
          - Noribogaine lowers reward thresholds under elevated dynorphin tone while producing conventional
            kappa-agonist effects in naive animals.
          refuting_outcome:
          - Noribogaine is pro-dysphoric in both states.
      selected_evidence:
        snippet: the mechanisms conferring these benefits may be attributed to factors other than G-protein
          bias
        supports: REFUTE
    origin:
      assertion_path: /discussions/8
      evidence_path: /discussions/8/evidence/1
      context_paths:
