            term:
              id: MONDO:0005530
              label: opiate dependence
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Exogenous Mu-Opioid Receptor Agonism
        biological_scale: MOLECULAR
        description: Prescription opioids, heroin, and illicit synthetic opioids such as fentanyl act
          as agonists at the mu-opioid receptor, a Gi/Go-coupled GPCR. Receptor activation inhibits adenylyl
          cyclase and opens GIRK potassium channels, hyperpolarizing the target neuron. The same receptor
          event underlies analgesia, euphoria, tolerance, and — in the brainstem — respiratory depression,
          which is why the therapeutic and lethal effects of opioids cannot be pharmacologically separated
          at this node.
        biological_processes:
        - preferred_term: G protein-coupled opioid receptor signaling pathway
          term:
            id: GO:0038003
            label: G protein-coupled opioid receptor signaling pathway
          modifier: INCREASED
        - preferred_term: adenylate cyclase-inhibiting signaling
          term:
            id: GO:0007193
            label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
          modifier: INCREASED
        chemical_entities:
        - preferred_term: morphine
          term:
            id: CHEBI:17303
            label: morphine
        - preferred_term: heroin
          term:
            id: CHEBI:27808
            label: heroin
        - preferred_term: fentanyl
          term:
            id: CHEBI:119915
            label: fentanyl
        triggers:
        - preferred_term: exposure to mu-opioid receptor agonist
          term:
            id: ECTO:9001896
            label: exposure to mu-opioid receptor agonist
      selected_evidence:
        snippet: Opioids are powerful drugs that usurp and overpower the reward function of endogenous
          opioids and engage dramatic tolerance and withdrawal via molecular and neurocircuitry neuroadaptations
          within the same reward system.
        supports: SUPPORT
    origin:
