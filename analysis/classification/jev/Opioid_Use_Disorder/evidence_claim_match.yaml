          opioid use* (POU) — using prescription opioids "not as prescribed" — in 132,113 research participants.
          Read the phenotype carefully: POU is a self-report proxy, not a diagnosed OUD case definition,
          and this locus has not been reported at genome-wide significance in a GWAS of diagnosed OUD.
          It is curated as a susceptibility signal for the proxy phenotype, with the genetic correlation
          to OUD (rg = 0.64-0.80) as the bridge, rather than as an established OUD locus.'
      selected_evidence:
        snippet: As a surrogate (or proxy) for OUD, we explored the genetic basis of using prescription
          opioids 'not as prescribed'.
