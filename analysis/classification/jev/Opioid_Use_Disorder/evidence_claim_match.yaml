      reference_title: 'AT-1001: a high affinity and selective α3β4 nicotinic acetylcholine receptor antagonist
        blocks nicotine self-administration in rats.'
      evidence_source: MODEL_ORGANISM
      explanation: Establishes both the tool compound and the reinforcer-selective assay the proposed
        opioid experiment would reuse unchanged.
