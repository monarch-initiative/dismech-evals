  861d3f0804167e1f37c6144180975228c779c7dc6a208d6f640ea768f2cf350b:
    claim:
      about:
        disease:
          name: Opioid Use Disorder
          disease_term:
            preferred_term: opioid use disorder
            term:
              id: MONDO:0005530
              label: opiate dependence
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: oud_epigenetic_mechanism
        kind: KNOWLEDGE_GAP
        prompt: Do chronic-opioid-associated DNA methylation changes represent a causal mechanism in opioid
          use disorder, a durable biomarker of exposure, or neither?
        attaches_to:
        - pathophysiology#Polygenic Susceptibility to Opioid Addiction
        - pathophysiology#Mu-Opioid Receptor Desensitization and Tolerance
        rationale: 'An epigenetic arm is frequently asserted for opioid use disorder, and this entry deliberately
          does not model one, because the primary evidence does not currently support a mechanism node.
          The best-known positive finding is OPRM1 promoter hypermethylation at two CpG sites in *lymphocytes*
          of methadone-maintained former heroin addicts — a peripheral tissue, with the consequence for
          receptor expression stated by the authors only as a possibility. The one epigenome-wide study
          in the tissue that matters, postmortem dorsolateral prefrontal cortex, found no CpG site surviving
          false-discovery-rate correction. Direction of causation is also open: these are cross-sectional
          comparisons of people with long exposure histories, so a methylation difference is at least
          as easily read as a consequence of exposure as a cause of the disorder. Curating an epigenetic
          node from review-level synthesis would overstate all of this.'
        proposed_experiments:
        - experiment_id: exp_oud_ewas_powered_brain
          name: Adequately powered brain EWAS with cell-type deconvolution
          description: Repeat the epigenome-wide analysis in postmortem brain at a sample size powered
            to survive multiple-testing correction, with cell-type deconvolution, so that a null result
            is informative rather than underpowered.
        - experiment_id: exp_oud_longitudinal_methylation
          name: Longitudinal methylation sampling across exposure and abstinence
          description: Sample methylation before, during, and after sustained opioid exposure in the same
            individuals to distinguish a pre-existing risk mark from an exposure-induced change, which
            no cross-sectional case-control design can do.
        - experiment_id: exp_oud_methylation_expression_link
          name: Test whether the OPRM1 CpG marks actually alter receptor expression
          description: Directly measure OPRM1 expression against methylation at the -18 and +84 CpG sites,
            in both lymphocytes and brain, to test the mechanism the original study could only propose.
      selected_evidence:
        snippet: Methylation of these CpG sites may lead to reduced OPRM1 expression in the lymphocytes
          of these former heroin addicts.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18650805
      reference_title: Increased OPRM1 DNA methylation in lymphocytes of methadone-maintained former heroin
        addicts.
      evidence_source: HUMAN_CLINICAL
      explanation: The authors state the functional consequence as a possibility, not a measurement, which
        is exactly the step this gap records as missing.
