  ae233e6cf9b05ea31a7b6faffef595cfbb72a7588ecff3ad7c585c12de308f1a:
    claim:
      about:
        disease:
          name: Opioid Use Disorder
          disease_term:
            preferred_term: opioid use disorder
            term:
              id: MONDO:0005530
              label: opiate dependence
        context: []
      assertion_type: Treatment
      assertion:
        name: Ibogaine
        description: 'Investigational iboga alkaloid, not approved for opioid use disorder in any jurisdiction
          and given largely in unregulated clinics abroad. A single dose is reported to suppress withdrawal
          and craving for weeks to months, which is unlike any approved treatment for this disorder, but
          the supporting evidence is open-label case series and observational cohorts. The one randomized
          trial in opioid-dependent patients, using the metabolite noribogaine, found dose-dependent QTc
          prolongation and withdrawal reductions that did not reach significance. Its mechanism is genuinely
          unsettled: it is a mu-opioid antagonist rather than an agonist, so withdrawal relief cannot
          be agonist substitution, and three competing accounts of the durable effect are recorded as
          mechanistic hypotheses on this entry. Ibogaine carries a real risk of fatal ventricular arrhythmia,
          and deaths during treatment are documented.'
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: ibogaine
            term:
              id: CHEBI:5852
              label: ibogaine
        notes: Not approved for this indication anywhere, and included here because it is in real-world
          use and because its mechanism is an open scientific question, not because the evidence supports
          recommending it. Three points bear on any clinical reading. Patients must be transitioned off
          long-acting opioids before dosing, since ibogaine antagonizes the mu receptor and the combination
          is dangerous. Cardiac screening, monitoring and CYP2D6 genotyping are the interventions current
          reviews call for, and the same pharmacokinetic study that established the genotype dependence
          found that QTc and cerebellar effects tracked ibogaine concentration while neither tracked withdrawal
          severity, which is the argument for lower and individualized dosing. The safer-analogue programmes
          (18-MC, tabernanthalog, the oxa-iboga series) are attempts to keep the anti-opioid effect while
          dropping the hERG liability; they are not curated here as treatments because none has been tested
          in humans for this indication.
      selected_evidence:
        snippet: Fifty percent of subjects reached a QTc of over 500ms during the observation period
        supports: SUPPORT
