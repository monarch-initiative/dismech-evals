        hypothesis_label: Ibogaine GDNF/VTA induced-neuroplasticity model
        status: EMERGING
        description: 'Proposes that the durable anti-relapse component of a single ibogaine dose is an
          induced-neuroplasticity effect rather than sustained receptor occupancy: ibogaine and its long-lived
          metabolite noribogaine upregulate glial cell line-derived neurotrophic factor in the ventral
          tegmental area and activate Ret/ERK-MAPK signalling there, remodelling mesolimbic circuitry
          so that the behavioural effect outlasts drug exposure. The model predicts that the durable component
          is dissociable both from acute withdrawal suppression and from the subjective psychedelic experience.
          The direct causal chain (intra-VTA GDNF sufficiency and anti-GDNF antibody blockade) has been
          demonstrated for rat ethanol self-administration; the corresponding opioid experiment has not
          been reported, so extension to opioid use disorder is inference from a different reinforcer.'
        notes: 'Distinguishing test versus the competing kappa and alpha3beta4 models: an intra-VTA anti-GDNF
          neutralizing antibody should abolish ibogaine''s effect on opioid self-administration and relapse
          if this model holds, and should leave it intact if the effect is carried by kappa agonism or
          habenular alpha3beta4 blockade. The 18-MC dissociation is the existing evidence that the neurotrophic
          and nicotinic routes are separable.'
      selected_evidence:
        snippet: Both doses elicited a large increase in the expression of BDNF transcripts in the NAcc,
          SN and PFC
        supports: REFUTE
