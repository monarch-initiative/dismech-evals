  e34b193af82a003c422142d628c766e1d75b89c605c4e4ed132556bd3c488819:
    claim:
      about:
        disease:
          name: Opioid Use Disorder
          disease_term:
            preferred_term: opioid use disorder
            term:
              id: MONDO:0005530
              label: opiate dependence
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: oud_human_neurotrophin_response_to_ibogaine_unmeasured
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does ibogaine change GDNF or BDNF in treated patients, given that the only human neurotrophin
          data in opioid dependence are cross-sectional baselines in which GDNF is unchanged and BDNF,
          not GDNF, tracks craving?
        attaches_to:
        - mechanistic_hypotheses#ibogaine_gdnf_vta_neuroplasticity_model
        - pathophysiology#Reward-System Downregulation and Hyperkatifeia
        rationale: The neurotrophic hypothesis makes a human prediction it has never been asked to meet.
          In opiate-dependent patients, serum BDNF is elevated and correlates with heroin craving while
          serum GDNF is unchanged and uncorrelated. That is a negative for the GDNF-specific claim, but
          not a decisive one, because a cross-sectional baseline in maintenance patients does not test
          what the model predicts, which is a change in GDNF following a dose. Rodent ibogaine also raises
          BDNF broadly across nucleus accumbens, substantia nigra and prefrontal cortex, so even a positive
          human neurotrophin signal would need to distinguish a GDNF-specific response from a general
          one.
        proposed_experiments:
        - experiment_id: exp_oud_ibogaine_neurotrophin_response_cohort
          name: Serial neurotrophin response in ibogaine-treated patients
          description: In a jurisdiction where ibogaine treatment is legal, collect serial plasma and
            where feasible cerebrospinal fluid GDNF and BDNF from patients before dosing and at intervals
            through twelve weeks, alongside withdrawal, craving and abstinence measures and CYP2D6 genotype.
            The comparison that matters is within-subject change from each patient's own baseline, which
            is what the existing cross-sectional study could not provide.
          experiment_type:
            preferred_term: longitudinal clinical biomarker cohort study
          readouts:
          - name: Within-subject change in GDNF from pre-dose baseline
            target: pathophysiology#Reward-System Downregulation and Hyperkatifeia
            direction: INCREASED
            interpretation: The model predicts a GDNF rise after dosing; an unchanged GDNF alongside a
              clinical response would place the burden on a non-neurotrophic mechanism.
          - name: Within-subject change in BDNF from pre-dose baseline
            target: pathophysiology#Reward-System Downregulation and Hyperkatifeia
            interpretation: Measured in parallel to test whether any neurotrophin response is GDNF-specific,
              as the model requires, or general.
          decision_criterion: A GDNF rise that precedes and predicts the clinical response, and is larger
            than the concurrent BDNF change, supports the neurotrophic model in humans. An unchanged GDNF
            with a clinical response, or a BDNF-dominant response, argues that the human mechanism is
            not the one the rodent ethanol experiments identified.
          would_support:
          - mechanistic_hypotheses#ibogaine_gdnf_vta_neuroplasticity_model
          supporting_outcome:
          - GDNF rises from baseline after dosing and the rise predicts abstinence.
          refuting_outcome:
          - GDNF is unchanged after dosing in patients who nonetheless respond.
      selected_evidence:
        snippet: GDNF serum levels were not associated with psychometric dimensions of heroin craving
        supports: REFUTE
    origin:
