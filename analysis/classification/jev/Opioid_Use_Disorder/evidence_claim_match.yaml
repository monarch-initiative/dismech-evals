      assertion_type: Pathophysiology
      assertion:
        name: Fatal Opioid Overdose
        biological_scale: ORGANISM
        description: 'Death from ventilatory insufficiency. Risk is not a simple function of disorder
          severity: it is dominated by tolerance state (sharply elevated after detoxification or incarceration),
          by co-ingested sedatives, and by the potency of the illicit supply. This is why overdose risk
          can rise at precisely the moment a person stops using.'
      selected_evidence:
        snippet: Variability of responses to opioids and individual differences in physiological and neurological
          states (e.g., anesthesia, sleep-disordered breathing, concurrent drug administration) add to
          the risk.
        supports: SUPPORT
