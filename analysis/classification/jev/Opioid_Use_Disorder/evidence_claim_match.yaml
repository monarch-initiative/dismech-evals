            in rats, with a food-reinforced arm under a matched schedule, followed by cue-induced and
            stress-induced reinstatement tests. Include a progressive-ratio arm to distinguish a reduction
            in reinforcing efficacy from a rate effect, mirroring the downward dose-response shift reported
            for 18-MC against morphine.
          experiment_type:
            preferred_term: operant drug self-administration and reinstatement experiment
          perturbations:
          - name: Systemic AT-1001 pretreatment
            target: pathophysiology#Compulsive Opioid Seeking and Loss of Control
            description: Selective alpha3beta4 antagonism using a tool compound with no opioid, NMDA,
              sigma or serotonergic activity of its own.
          controls:
          - name: Food-reinforced responding
            description: Matched-schedule food arm; a compound that suppresses both is not reinforcer-selective
              and does not support the model.
          - name: Vehicle pretreatment
            description: Within-subject vehicle sessions.
          readouts:
          - name: Opioid infusions earned and progressive-ratio breakpoint
            target: pathophysiology#Compulsive Opioid Seeking and Loss of Control
            direction: DECREASED
            interpretation: A downward shift in the opioid dose-response curve without lateral displacement
              indicates reduced reinforcing efficacy rather than altered potency.
          decision_criterion: Reinforcer-selective reduction of opioid intake and reinstatement supports
            alpha3beta4 antagonism as sufficient for the anti-opioid phenotype in a molecule with none
            of ibogaine's other pharmacology. A null result, or suppression of food responding at the
            same doses, indicates the habenular route does not extend from withdrawal to opioid taking.
          would_support:
          - mechanistic_hypotheses#ibogaine_alpha3beta4_habenular_model
          supporting_outcome:
          - Dose-dependent reduction in opioid intake and reinstatement with food responding intact.
          refuting_outcome:
          - No effect on opioid intake, or equal suppression of food responding.
      selected_evidence:
        snippet: selective α3β4* nACh receptor antagonists, α-conotoxin AuIB and AT-1001, attenuated somatic
          signs of morphine withdrawal in a dose-related manner
        supports: SUPPORT
        directness: INDIRECT
