            while sparing the non-drug reinforcer localizes the mechanism. If intra-VTA ibogaine suffices,
            the neurotrophic route carries the effect; if intra-habenular ibogaine suffices, the nicotinic
            route does; if neither site reproduces it, the effect is systemic or distributed and none
            of the three site-based models is complete as stated.
