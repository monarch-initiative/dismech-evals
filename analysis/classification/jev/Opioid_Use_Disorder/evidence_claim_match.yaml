      assertion:
        name: Opioid-Induced TLR4 and Microglial Neuroimmune Activation
        biological_scale: CELLULAR
        description: 'A non-classical, non-opioid-receptor arm of opioid action: opioids and some of their
          metabolites activate the TLR4/MD-2 innate immune complex on microglia and other myeloid cells,
