  75c1d29b1c1f1182254898f25cf0f912d2cbde9b6aa72c37b08b5a7e58da960b:
    claim:
      about:
        disease:
          name: Opioid Use Disorder
          disease_term:
            preferred_term: opioid use disorder
            term:
              id: MONDO:0005530
              label: opiate dependence
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: oud_ibogaine_mechanism_necessity_untested
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which of the three candidate mechanisms for ibogaine's anti-opioid effect is actually
          necessary for it, given that no study has ever infused ibogaine itself into a candidate site,
          or blocked a candidate receptor, while measuring opioid self-administration?
        attaches_to:
        - mechanistic_hypotheses#ibogaine_gdnf_vta_neuroplasticity_model
        - mechanistic_hypotheses#ibogaine_kappa_biased_agonism_model
        - mechanistic_hypotheses#ibogaine_alpha3beta4_habenular_model
        - pathophysiology#VTA Disinhibition and Mesolimbic Dopamine Release
        - pathophysiology#Compulsive Opioid Seeking and Loss of Control
        rationale: Three mechanisms compete to explain the same phenotype, and each rests on a different
          molecule or a different reinforcer. The GDNF route has a sufficiency-and-necessity pair, but
          for ethanol. The habenular route has a site dissociation, but for the congener 18-MC, which
          does not share ibogaine's neurotrophic actions. The kappa route has sufficiency from engineered
          analogues, not necessity for the parent drug. Ibogaine itself has never been microinjected into
          any site with an opioid reinforcer, and the only reported loss-of-function test against ibogaine
          is a partial reversal by a kappa antagonist combined with an NMDA agonist, reported once by
          the originating laboratory without isolating either action. Because all three routes converge
          on the same behavioural endpoint, demonstrating sufficiency for any one of them cannot establish
          that ibogaine works through it.
        proposed_experiments:
        - experiment_id: exp_oud_intracerebral_ibogaine_site_dissociation
          name: Intracerebral ibogaine site dissociation against opioid self-administration
          description: Run the He 2005 and Glick 2006 designs on the parent drug rather than on a surrogate.
            Rats acquiring intravenous heroin or fentanyl self-administration receive ibogaine (or noribogaine)
            microinjected into the ventral tegmental area, the medial habenula, or the interpeduncular
            nucleus, with a sucrose or food arm run in parallel to test reinforcer selectivity. Measure
            intake acutely and at 24 hours and one week to separate the acute effect from the aftereffect,
            since the aftereffect is the property all three hypotheses were built to explain.
          experiment_type:
            preferred_term: intracerebral microinjection and operant self-administration experiment
          perturbations:
          - name: Intra-VTA ibogaine microinjection
            target: pathophysiology#VTA Disinhibition and Mesolimbic Dopamine Release
            description: Site arm testing the neurotrophic route, matching the site at which ibogaine
              reduces ethanol self-administration.
          - name: Intra-medial-habenula or intra-interpeduncular ibogaine microinjection
            target: pathophysiology#Compulsive Opioid Seeking and Loss of Control
            description: Site arm testing the habenulo-interpeduncular route, matching the site at which
              18-MC reduces morphine self-administration.
          controls:
          - name: Vehicle microinjection at each site
            description: Site-matched vehicle to separate cannula placement from drug effect.
          - name: Non-drug reinforcer arm
            description: Sucrose or food responding under the same schedule, to distinguish a selective
              anti-opioid effect from general response suppression.
          readouts:
          - name: Opioid infusions earned at 24 hours and one week after microinjection
            target: pathophysiology#Compulsive Opioid Seeking and Loss of Control
            direction: DECREASED
            interpretation: The aftereffect rather than the acute effect is the discriminating measurement,
              because acute suppression is not reinforcer-selective.
          decision_criterion: A site whose microinjection reproduces the durable reduction in opioid intake
            while sparing the non-drug reinforcer localizes the mechanism. If intra-VTA ibogaine suffices,
            the neurotrophic route carries the effect; if intra-habenular ibogaine suffices, the nicotinic
            route does; if neither site reproduces it, the effect is systemic or distributed and none
            of the three site-based models is complete as stated.
          would_support:
          - mechanistic_hypotheses#ibogaine_gdnf_vta_neuroplasticity_model
          - mechanistic_hypotheses#ibogaine_alpha3beta4_habenular_model
          supporting_outcome:
          - Durable, reinforcer-selective reduction in opioid intake after microinjection at one site
            and not the other.
          refuting_outcome:
          - No site reproduces the durable effect, or every site reproduces it non-selectively, indicating
            a systemic or pharmacokinetic explanation.
        - experiment_id: exp_oud_factorial_receptor_blockade_of_ibogaine_aftereffect
          name: Factorial receptor and neurotrophin blockade of the ibogaine aftereffect
          description: 'Give systemic ibogaine to rats with established heroin or fentanyl self-administration
            and attempt to abolish the aftereffect with each candidate mechanism blocked in turn: the
            long-acting kappa antagonist norbinaltorphimine or Oprk1 knockout, an intra-VTA anti-GDNF
            neutralizing antibody or AAV-shRNA knockdown of VTA GDNF, and an alpha3beta4 arm. Run the
            arms in one paradigm so their effect sizes are directly comparable rather than inferred across
            laboratories, reinforcers and decades.'
          experiment_type:
            preferred_term: factorial pharmacological and genetic blockade experiment
          perturbations:
          - name: Kappa-opioid receptor blockade during ibogaine treatment
            target: pathophysiology#Reward-System Downregulation and Hyperkatifeia
            description: Norbinaltorphimine pretreatment or Oprk1 knockout.
          - name: VTA GDNF blockade during ibogaine treatment
            target: pathophysiology#VTA Disinhibition and Mesolimbic Dopamine Release
            description: Intra-VTA anti-GDNF neutralizing antibody or AAV-shRNA knockdown, the design
              that established necessity in the ethanol experiments.
          controls:
          - name: Ibogaine plus inactive comparator
            description: IgG control for the antibody arm and vehicle for the antagonist arm.
          - name: Blockade without ibogaine
            description: Each blocking agent alone, to establish that it does not itself alter opioid
              intake.
          readouts:
          - name: Magnitude of the durable reduction in opioid intake
            target: pathophysiology#Compulsive Opioid Seeking and Loss of Control
            direction: ABOLISHED
            interpretation: Abolition of the aftereffect by one blockade identifies the necessary mechanism;
              partial attenuation across several arms indicates the effect is carried by more than one
              route.
          decision_criterion: The arm that abolishes the aftereffect identifies the necessary mechanism.
            If no single blockade abolishes it but two or more partially attenuate it, the polypharmacological
            reading is correct and no single-mechanism hypothesis should be promoted.
          would_refute:
          - mechanistic_hypotheses#ibogaine_kappa_biased_agonism_model
          - mechanistic_hypotheses#ibogaine_gdnf_vta_neuroplasticity_model
          refuting_outcome:
          - The aftereffect survives blockade of a mechanism its hypothesis claims is necessary.
      selected_evidence:
        snippet: Local administration of 18-MC into the ventral tegmental area had no effect on morphine
          self-administration
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/4
      evidence_path: /discussions/4/evidence/1
      context_paths:
