        prompt: Which of the three candidate mechanisms for ibogaine's anti-opioid effect is actually
          necessary for it, given that no study has ever infused ibogaine itself into a candidate site,
          or blocked a candidate receptor, while measuring opioid self-administration?
        attaches_to:
