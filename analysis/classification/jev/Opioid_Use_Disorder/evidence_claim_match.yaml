  48517cc8516fefc2cba270d357f66f62b5d8005b57aad7576ababd5e05c4a89c:
    claim:
      about:
        disease:
          name: Opioid Use Disorder
          disease_term:
            preferred_term: opioid use disorder
            term:
              id: MONDO:0005530
              label: opiate dependence
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: oud_alpha3beta4_antagonist_opioid_self_administration_untested
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does a selective alpha3beta4 nicotinic antagonist reduce opioid self-administration, as
          the habenular model predicts, given that such a compound exists and has been tested against
          nicotine and cocaine but never against opioid taking?
        attaches_to:
        - mechanistic_hypotheses#ibogaine_alpha3beta4_habenular_model
        - pathophysiology#Compulsive Opioid Seeking and Loss of Control
        rationale: 'The habenular model can be tested without any iboga compound at all. AT-1001 is a
          high-affinity alpha3beta4 antagonist that blocks nicotine self-administration while sparing
          food responding, poorly inhibits accumbal dopamine release, and attenuates somatic morphine
          withdrawal. The one endpoint it has never been run against is opioid self-administration, which
          is precisely the behaviour the model exists to explain. This is the cheapest outstanding test
          in the set: the tool compound, the assay, and the withdrawal precedent all already exist, and
          the result would be free of the congener confound that limits every 18-MC result.'
        proposed_experiments:
        - experiment_id: exp_oud_at1001_opioid_self_administration
          name: Selective alpha3beta4 antagonist against opioid self-administration
          description: Dose-response of AT-1001 on intravenous heroin or fentanyl self-administration
            in rats, with a food-reinforced arm under a matched schedule, followed by cue-induced and
            stress-induced reinstatement tests. Include a progressive-ratio arm to distinguish a reduction
            in reinforcing efficacy from a rate effect, mirroring the downward dose-response shift reported
            for 18-MC against morphine.
          experiment_type:
            preferred_term: operant drug self-administration and reinstatement experiment
          perturbations:
          - name: Systemic AT-1001 pretreatment
            target: pathophysiology#Compulsive Opioid Seeking and Loss of Control
            description: Selective alpha3beta4 antagonism using a tool compound with no opioid, NMDA,
              sigma or serotonergic activity of its own.
          controls:
          - name: Food-reinforced responding
            description: Matched-schedule food arm; a compound that suppresses both is not reinforcer-selective
              and does not support the model.
          - name: Vehicle pretreatment
            description: Within-subject vehicle sessions.
          readouts:
          - name: Opioid infusions earned and progressive-ratio breakpoint
            target: pathophysiology#Compulsive Opioid Seeking and Loss of Control
            direction: DECREASED
            interpretation: A downward shift in the opioid dose-response curve without lateral displacement
              indicates reduced reinforcing efficacy rather than altered potency.
          decision_criterion: Reinforcer-selective reduction of opioid intake and reinstatement supports
            alpha3beta4 antagonism as sufficient for the anti-opioid phenotype in a molecule with none
            of ibogaine's other pharmacology. A null result, or suppression of food responding at the
            same doses, indicates the habenular route does not extend from withdrawal to opioid taking.
          would_support:
          - mechanistic_hypotheses#ibogaine_alpha3beta4_habenular_model
          supporting_outcome:
          - Dose-dependent reduction in opioid intake and reinstatement with food responding intact.
          refuting_outcome:
          - No effect on opioid intake, or equal suppression of food responding.
      selected_evidence:
        snippet: AT-1001 potently and dose-dependently blocks nicotine self-administration in rats, without
          affecting food responding
        supports: SUPPORT
    origin:
      assertion_path: /discussions/5
