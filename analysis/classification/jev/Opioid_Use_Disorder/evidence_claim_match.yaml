  5fc21caa3ed63ffdb6f496ac76f3e3c741c4fa8cee6ec785c50e701a2dfb3abc:
    claim:
      about:
        disease:
          name: Opioid Use Disorder
          disease_term:
            preferred_term: opioid use disorder
            term:
              id: MONDO:0005530
              label: opiate dependence
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ibogaine_alpha3beta4_habenular_model
        hypothesis_label: Alpha3beta4 nicotinic blockade in the habenulo-interpeduncular pathway
        status: EMERGING
        description: 'Proposes that iboga alkaloids reduce opioid self-administration by noncompetitively
          blocking alpha3beta4 nicotinic acetylcholine receptors, which are concentrated in the medial
          habenula and interpeduncular nucleus rather than in the mesolimbic pathway, and thereby damping
          the sensitized accumbal dopamine response to repeated opioid exposure. The site specificity
          is the model''s strength: local infusion into the medial habenula or interpeduncular nucleus
          reduces morphine self-administration while the same infusion into the ventral tegmental area
          does not, and the effect spares responding for a non-drug reinforcer. Its weakness for ibogaine
          specifically is that the supporting in vivo work uses the congener 18-MC, which does not reproduce
          ibogaine''s neurotrophic actions, while noribogaine is a comparatively weak alpha3beta4 blocker.'
        notes: 'Distinguishing test: this model and the GDNF model predict opposite outcomes for a local-infusion
          dissociation - intra-habenular ibogaine should suffice if the nicotinic route carries the effect,
          intra-VTA ibogaine if the neurotrophic route does. The two are not mutually exclusive and may
          account for different time courses, with nicotinic blockade acting during drug exposure and
          neurotrophic remodelling accounting for persistence.'
      selected_evidence:
        snippet: our results suggest that noribogaine and 18-MC have different mechanisms and sites of
          action
        supports: REFUTE
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/4
