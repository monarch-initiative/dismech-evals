        context: []
      assertion_type: Diagnosis
      assertion:
        name: DSM-5 and ICD-11 clinical diagnostic criteria
        description: 'Diagnosis is clinical and behavioural: DSM-5 requires at least 2 of 11 criteria
          within 12 months, graded mild/moderate/severe by criterion count; ICD-11 codes opioid dependence
          at 6C43.2 using the dependence-syndrome framework. Physiological tolerance and withdrawal arising
          from appropriate medical opioid use do not by themselves establish the disorder — a distinction
          that matters for patients on long-term analgesia. There is no validated blood biomarker; urine
          immunoassay panels detect exposure, not the disorder, and frequently miss fentanyl and other
          synthetic opioids without an extended panel.'
      selected_evidence:
        snippet: Extended-release naltrexone (XR-NTX), an opioid antagonist, and sublingual buprenorphine-naloxone
          (BUP-NX), a partial opioid agonist, are pharmacologically and conceptually distinct interventions
          to prevent opioid relapse.
        supports: SUPPORT
