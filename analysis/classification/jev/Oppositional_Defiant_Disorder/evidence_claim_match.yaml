      assertion:
        name: Developmental Familial and Temperamental Risk
        description: ODD risk is modeled as emerging from early childhood temperament, inhibitory and
          emotional-control difficulties, ADHD/comorbidity burden, and family-context risk factors.
      selected_evidence:
        snippet: Subthreshold ODD, high scores in irritability and headstrong dimensions, attention deficit/hyperactivity
          disorder and other comorbidity, negative affectivity until age 7, difficulties in inhibit and
          emotional control, punitive parenting and maternal internalising problems were risk factors
          of a first episode of ODD during this 7-year period.
        supports: SUPPORT
