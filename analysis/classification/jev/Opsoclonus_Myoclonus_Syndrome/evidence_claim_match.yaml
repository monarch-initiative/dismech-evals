      assertion_type: Treatment
      assertion:
        name: Intravenous Immunoglobulin
        description: The only randomised prospective therapeutic trial in this disease. Children with
          neuroblastoma-associated opsoclonus-myoclonus-ataxia were randomised to prednisone and risk-adapted
          chemotherapy with or without intravenous immunoglobulin. Response was 21 of 26 (80.8 per cent)
          with it against 11 of 27 (40.7 per cent) without. Before this trial, treatment rested on case
          reports. Typical dosing is 2 g/kg over 2 to 5 days then 1 to 2 g/kg every 4 weeks for up to
          a year.
        action_category: THERAPEUTIC
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: pooled human immunoglobulin G for intravenous use
            term:
              id: NCIT:C80829
              label: Human Immunoglobulin G
      selected_evidence:
        snippet: 'Significantly higher rates of OMA response were observed in patients randomized to IVIG+
          compared to NO-IVIG [21/26=80.8% for IVIG+; 11/27=40.7% for NO-IVIG (odds ratio=6.1; 95% CI:
          (1.5, 25.9), p=0.0029)].'
        supports: SUPPORT
        directness: DIRECT
