      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Oligoclonal bands were found in one of the 21 children whose cerebrospinal fluid was
        tested (none of 12 with a tumour, one of 9 without), against 58 per cent in the 389-child cross-sectional
        cohort; the authors also cite United States data at 36 per cent. Oligoclonal IgG synthesis is
        therefore not a consistent finding across cohorts. The paper did not measure B-cell frequency,
        and it does not say when the samples were taken relative to treatment.
