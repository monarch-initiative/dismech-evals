          bands were present in 58 per cent and an expanded B-cell frequency in 93 per cent of untreated
          patients. Oligoclonal bands are not a consistent finding: a Chinese single-centre series found
          them in 1 of 21 children tested. The expansion is in cerebrospinal fluid and not blood, it correlates
          with neurological severity, and it persisted years after onset and conventional treatment. In
          children with neuroblastoma, resecting the tumour or giving chemotherapy did not alter the immunological
          abnormalities.'
        biological_scale: CELLULAR
