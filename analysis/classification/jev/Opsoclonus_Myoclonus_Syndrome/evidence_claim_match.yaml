            term:
              id: MONDO:0015247
              label: opsoclonus-myoclonus syndrome
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Long-term neurodevelopmental sequelae
        age_range: Follow-up spanning 1 to 50 years in the series the review draws on
        notes: 'Motor sequelae, including coordination deficits and impaired fine motor skills or tremor,
          are described in 20 to 60 per cent but usually do not severely affect everyday function. The
          cognitive and behavioural sequelae do. Against those historical figures sits the one prospectively
          treated cohort, in which cognitive and adaptive function was stable over ten years; 21 of its
          25 children received immunoglobulin, there was no statistical comparison, and the authors say
          the small sample limits the finding.

          A Chinese single-centre cohort assessed adaptive behaviour in 48 children after neurological
          remission, at a median follow-up of 8 years, and 42 per cent had a poor outcome. Myoclonus at
          onset was an independent risk factor, and having a neuroblastoma and receiving chemotherapy
          were independent protective factors, but chemotherapy was given predominantly to the tumour
          group and the sample was small. The protective association for a tumour differs from the consensus
          review''s statement that the presence or absence of a neuroblastoma does not associate with
          neurological outcome.'
      selected_evidence:
        snippet: impaired fine motor skills or tremor have been described in 20%–60% in follow-up spanning
          1–50 years4,12,31,56,57 but usually do not severely affect everyday function. In contrast, cognitive
          and behavioral deficits can severely affect function.
        supports: SUPPORT
        directness: DIRECT
