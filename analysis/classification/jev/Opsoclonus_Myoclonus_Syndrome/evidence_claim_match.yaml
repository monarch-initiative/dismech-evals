      assertion_type: Pathophysiology
      assertion:
        name: Parainfectious Immune Trigger
        description: 'In the children in whom no tumour is found, an infection often precedes onset. No
          single organism accounts for it: Mycoplasma, Streptococcus, Epstein-Barr virus, adenovirus,
          human immunodeficiency virus and dengue virus have all been reported. An infectious prodrome
          does not point away from a tumour, because it occurs in children who turn out to have one, which
          is why every child presenting with the syndrome is screened regardless. In a Chinese single-centre
          series parents reported a prodromal infection for 51 per cent of children without a tumour and
          37 per cent of those with one, a difference that was not significant, and testing found no consistent
          infectious agent.'
        biological_scale: ORGANISM
      selected_evidence:
        snippet: A variety of infections have been reported in association with OMAS, including Mycoplasma,
          Streptococcus, Epstein-Barr virus, adenovirus, HIV, and dengue virus, among others,16 suggesting
          that no single etiologic infectious agent exists.
        supports: SUPPORT
        directness: DIRECT
