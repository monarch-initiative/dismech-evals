      assertion_type: Discussion
      assertion:
        discussion_id: oms_antigen_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the antigen of the intrathecal humoral response in opsoclonus-myoclonus syndrome,
          and is the driving process humoral at all rather than T-cell mediated?
        attaches_to:
        - pathophysiology#Intrathecal B-Cell Expansion and Oligoclonal IgG Synthesis
        rationale: 'This is the gap that keeps the mechanism in this entry incomplete between its second
          and third nodes, and it is why both edges there are typed as indirect with unknown intermediates.
          The immune abnormality is well characterised and reproducible; its target is not. Commercial
          paraneoplastic antibody panels are negative, including the whole standard list, and no reproducible
          antigenic target has been established despite reports of patient immunoglobulin binding to Purkinje
          cells and cerebellar dendritic arborisations. The one exception is outside the paediatric disease:
          Ri/ANNA2 antibodies in opsoclonus-myoclonus with breast cancer. A pathogenic autoantibody would
          both explain the syndrome and give it a biomarker, and the alternative, that the driving process
          is T-cell mediated, is harder to pursue and is kept open here by the gammadelta T-cell expansion
          and altered CD4 to CD8 ratio reported alongside the B-cell findings. No current biomarker discriminates
          paraneoplastic from idiopathic cases.'
      selected_evidence:
        snippet: 'None of the following paraneoplastic antibodies were found: anti-neuronal nuclear (types-1,
          2, 3), anti-glial nuclear (type 1), Purkinje cell cytoplasmic (types 1, 2, and Tr), amphiphysin,
          NMDAR, AMPAR, GABA-B, CRMP-5, or calcium channel (N1 or P/Q-type).'
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
