          modifier: INCREASED
          term:
            id: GO:0002377
            label: immunoglobulin production
      selected_evidence:
        snippet: The cerebrospinal fluid (CSF) leukocyte count was minimally elevated in 14% (<=11/mm3)
          with normal differential, and commercially screened serum autoantibodies were negative, but
          CSF oligoclonal bands (OCB) and B cells frequency were positive (58 and 93%).
        supports: SUPPORT
        directness: DIRECT
