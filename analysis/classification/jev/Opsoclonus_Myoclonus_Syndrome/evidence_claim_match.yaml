  5b77e80e0205d999a13088af6ece6b84be7718850abcbfb16537e0af8e09fe05:
    claim:
      about:
        disease:
          name: Opsoclonus-Myoclonus Syndrome
          disease_term:
            preferred_term: opsoclonus-myoclonus syndrome
            term:
              id: MONDO:0015247
              label: opsoclonus-myoclonus syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Screening for a Peripheral Neuroblastic Tumour
        description: 'Every child presenting with the syndrome is screened for a peripheral neuroblastic
          tumour, whether or not an infection preceded onset. Whole body imaging from neck to pelvis,
          covering the sympathetic chain and the adrenals, is the gold standard; chest radiography and
          abdominal ultrasound alone are inadequate. Urine homovanillic and vanillylmandelic acid may
          be measured first but are very insensitive here, because the tumours associated with this syndrome
          are small and minimally secreting, with a yield as low as 24 per cent, so a negative urine result
          does not exclude a tumour. MIBG scintigraphy has a false-negative rate of about 8 per cent,
          higher in the more differentiated tumours that are the ones this syndrome tends to accompany.
          A negative first screen is not final: repeat imaging at about 6 months is practical and should
          find most of the tumours missed first time. In a Chinese single-centre series two of 30 tumours
          were missed on the first contrast CT and found 3 and 14 months later, and opsoclonus as the
          first sign was commoner in children with a tumour, which the authors offer as a possible predictor.'
        diagnosis_term:
          preferred_term: screening for an underlying neuroblastic tumour
          term:
            id: NCIT:C15406
            label: Cancer Screening
      selected_evidence:
        snippet: whole body imaging from the neck to pelvis, covering the wide range of possible tumor
          sites including the adrenals and the entire neural crest, has become the gold standard for detecting
          neuroblastic tumor in OMA.
        supports: SUPPORT
        directness: DIRECT
