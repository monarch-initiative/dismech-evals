        name: Corticosteroids or ACTH
        description: Corticosteroids or adrenocorticotropic hormone are first-line immunotherapy. Two
          common corticosteroid regimens are pulsed intravenous methylprednisolone followed by oral prednisolone,
          or pulsed oral dexamethasone, with several alternatives in use. The claim that ACTH is superior
          to corticosteroids is not well supported, though the expert panel notes some refractory patients
          respond to it; corticosteroids are oral and cheaper.
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: corticosteroid
            term:
              id: CHEBI:50858
              label: corticosteroid
          - preferred_term: adrenocorticotropic hormone
            term:
              id: CHEBI:3892
              label: corticotropin
        notes: 'No therapeutic_modality is set, deliberately. The row is one clinical decision - first-line
          immunotherapy with a corticosteroid or with corticotropin - but the two agents are different
          therapeutic platforms, a small molecule and a peptide hormone, and the slot takes a single value,
          so no value is true of the row. Both agents are bound, so the row stays queryable by drug. As
          of November 2026 the rest of the KB does not agree on this pair either: Developmental_And_Epileptic_Encephalopathy_19
          records PEPTIDE for corticotropin with prednisolone, and Early-Infantile_Developmental_and_Epileptic_Encephalopathy
          records SMALL_MOLECULE for the same two agents. Splitting the row in two would resolve it at
          the cost of presenting one clinical choice as two.'
      selected_evidence:
        snippet: Although some providers and studies have suggested that ACTH is superior to corticosteroids,
          little evidence supports this.
        supports: SUPPORT
        directness: DIRECT
