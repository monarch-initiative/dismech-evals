              label: opsoclonus-myoclonus syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuroblastic Tumour Trigger
        description: In about half of children a peripheral neuroblastic tumour is found, neuroblastoma
          in 73 per cent of those, ganglioneuroblastoma in 22 per cent and ganglioneuroma in 4 per cent.
          The tumours lie along the sympathetic chain or in the adrenals and are never intracranial, and
          93 per cent of the neuroblastomas are stage 1 or 2; in a Chinese single-centre series all 30
          tumours were localised, INRGSS stage L1 or L2, at diagnosis. In the other half no tumour is
          found; occult tumour with spontaneous regression has been proposed, and no clinical feature
          distinguishes the two groups. The parainfectious trigger below is the alternative route to the
          same immune node, and the two are not mutually exclusive.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: 'Neuroblastoma (73%) is the most common tumor type, followed by ganglioneuroblastoma
          (22%) and ganglioneuroma (4%). The tumors are never in the brain: all are located along the
          sympathetic chain or in the adrenals, including the neck, thoracic, abdominal, or pelvic cavities.9
          Notably, 93% of neuroblastoma is early stage (stage 1 or 2) in this population.9'
        supports: SUPPORT
        directness: DIRECT
