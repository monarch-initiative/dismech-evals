          were independent protective factors, but chemotherapy was given predominantly to the tumour
          group and the sample was small. The protective association for a tumour differs from the consensus
          review''s statement that the presence or absence of a neuroblastoma does not associate with
          neurological outcome.'
      selected_evidence:
        snippet: 48 patients with neurological remission underwent assessment of adaptive behavior. By
          the last follow-up, 28 (58%) patients had good adaptive behavior, and 20 (42%) patients had
          poor adaptive behavior.
