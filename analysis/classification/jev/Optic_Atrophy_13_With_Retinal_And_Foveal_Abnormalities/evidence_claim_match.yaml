  29d34b595af49f6ff9af12184eb392b99cb3e574d2b5783507260a20de3f7013:
    claim:
      about:
        disease:
          name: Optic Atrophy 13 With Retinal and Foveal Abnormalities
          disease_term:
            preferred_term: optic atrophy 13 with retinal and foveal abnormalities
            term:
              id: MONDO:0008135
              label: optic atrophy 13 with retinal and foveal abnormalities
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial DNA Depletion
        biological_scale: CELLULAR
        description: 'Reduced mtDNA copy number in patient cells. This places SSBP1 disease within the
          mtDNA maintenance disorders, whose other members generally cause severe multisystem neurological
          disease.

          A proposed reconciliation exists and is worth stating rather than treating the tissue distribution
          as simply unexplained: severity may be proportional to residual mtDNA levels, with different
          variants having different effects on tetramer abundance and activity and so producing a gradient
          of depletion, against a threshold that must be exceeded in an organ for it to be affected. On
          that account the predominantly ocular presentation of p.Arg38Gln is the mild end of one continuum
          rather than a categorically different disease from the syndromic alleles. The proposal has not
          been tested by measuring depletion across tissues.'
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: the R38Q variant destabilizes SSBP1 dimer/tetramer formation, affects mtDNA replication,
          and induces mtDNA depletion
        supports: SUPPORT
    origin:
