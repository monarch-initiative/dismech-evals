  a18e2a9f6405347456dca799c5242d49d716383265fa8ed24dcb79d4a8209eb1:
    claim:
      about:
        disease:
          name: Optic Atrophy 13 With Retinal and Foveal Abnormalities
          disease_term:
            preferred_term: optic atrophy 13 with retinal and foveal abnormalities
            term:
              id: MONDO:0008135
              label: optic atrophy 13 with retinal and foveal abnormalities
        context: []
      assertion_type: Genetic
      assertion:
        name: SSBP1
        gene_term:
          preferred_term: SSBP1
          term:
            id: hgnc:11317
            label: SSBP1
        relationship_type: CAUSATIVE
        notes: 'SSBP1 encodes the mitochondrial single-stranded DNA-binding protein, a component of the
          mtDNA replication machinery that works as a multimer. The recurrent p.Arg38Gln allele accounts
          for most reported patients and was the variant characterised in the largest phenotype series.

          Germline mosaicism has been documented in an unaffected transmitting mother, which is directly
          relevant to counselling: an apparently de novo variant in this gene cannot be assumed to carry
          negligible recurrence risk for subsequent pregnancies.'
        variants:
        - name: p.Arg38Gln
          description: 'NM_001256510.1:c.113G>A. The recurrent allele, and the one for which functional
            and phenotypic data are most complete: it destabilises dimer and tetramer formation in patient
            fibroblasts, and it is the variant carried by the 27-patient series that defined the foveopathy.'
          clinical_significance: PATHOGENIC
          functional_effects:
          - type: dominant-negative
            description: Replaces an arginine in the basic patch required for single-stranded DNA binding
              and destabilises the multimer. Dominance is attributed to interference with the shared complex
              rather than to loss of one allele's product.
        - name: p.Arg107Gln
          description: NM_001256510.1:c.320G>A. The second recurrent allele, affecting the other arginine
            of the same basic patch, and shown by structural analysis to affect dimer interactions in
            the same way.
          clinical_significance: PATHOGENIC
          functional_effects:
          - type: dominant-negative
            description: Loss of a positive charge in the single-stranded DNA-binding patch, with the
              same predicted effect on dimer interactions as p.Arg38Gln.
      selected_evidence:
        snippet: Our study showing that mutations in SSBP1 cause a form of dominant optic atrophy frequently
          accompanied with foveopathy brings insights into mtDNA maintenance disorders.
        supports: SUPPORT
