            description: A two-armed zebrafish experiment rather than a single model. One arm knocks the
              endogenous transcript down; the other administers mutant mRNA. Comparing them is what makes
              the design informative about mechanism rather than only about requirement.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Retinal Ganglion Cell Vulnerability and Optic Nerve Degeneration
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: 'Knockdown compromises retinal ganglion cell differentiation, identifying the cell
          type affected in patients as one whose development requires ssbp1. Graded PARTIALLY_RECAPITULATES
          rather than RECAPITULATES because the model reproduces involvement of the right cell type by
          the wrong route: failure of differentiation in an embryo, against degeneration of a differentiated
          cell in a child.'
        limitations: A developmental readout in a fish embryo against a childhood-onset human optic neuropathy;
          the assay reports failure of differentiation rather than degeneration of a differentiated cell,
          and the two need not share a mechanism. Antisense knockdown in zebrafish also carries well-known
          off-target liabilities that the report does not address with a genetic mutant.
        readouts:
        - name: Retinal ganglion cell differentiation
          target: Retinal Ganglion Cell Vulnerability and Optic Nerve Degeneration
          direction: DECREASED
          interpretation: Establishes an in vivo requirement for ssbp1 in the affected cell type.
      selected_evidence:
        snippet: These findings point toward an essential role of ssbp1 in retinal development
        supports: SUPPORT
