            term:
              id: MONDO:0008135
              label: optic atrophy 13 with retinal and foveal abnormalities
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Destabilised SSBP1 Dimer and Tetramer Assembly
        biological_scale: MOLECULAR
        description: 'SSBP1 works as a multimer. A revised crystal structure determined alongside the
          founding clinical report showed that both recurrent mutations affect dimer interactions and
          are predicted to distort the DNA-binding region, and patient fibroblasts confirmed that the
          R38Q variant destabilises dimer and tetramer formation.

          This node carries the dominant-negative claim, and it is the right place for it: a variant subunit
          that poisons a shared multimer explains dominance, whereas simple loss of one allele''s product
          would not. The zebrafish work supports the same conclusion from the opposite direction - injecting
          mutant mRNA reproduced the effect of knocking the endogenous transcript down, which is the signature
          of interference rather than of insufficiency.'
        molecular_functions:
        - preferred_term: single-stranded DNA binding
          modifier: DECREASED
          term:
            id: GO:0003697
            label: single-stranded DNA binding
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: Structural analysis suggested that both mutations affect dimer interactions and presumably
          distort the DNA-binding region.
        supports: SUPPORT
