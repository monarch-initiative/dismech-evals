      assertion_type: DifferentialDiagnosis
      assertion:
        name: OPA1-related dominant optic atrophy
        description: The main differential and the far commoner disease. The two share early childhood
          onset, incomplete penetrance, and the optic atrophy itself. The discriminator is the congenital
          foveopathy on macular OCT, which is present in about half of SSBP1 patients and absent in OPA1
          disease - and which is worth looking for precisely because it costs nothing in acuity and so
          will not announce itself in the visual history.
      selected_evidence:
        snippet: SSBP1-related DOA shares similarities with OPA1-related DOA with an incomplete penetrance
          and an early childhood visual impairment.
        supports: SUPPORT
