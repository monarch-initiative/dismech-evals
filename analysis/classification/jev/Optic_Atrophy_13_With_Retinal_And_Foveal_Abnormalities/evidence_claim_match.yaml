            gene_term:
              preferred_term: SSBP1
              term:
                id: hgnc:11317
                label: SSBP1
            relationship_type: CAUSATIVE
            notes: 'SSBP1 encodes the mitochondrial single-stranded DNA-binding protein, a component of
              the mtDNA replication machinery that works as a multimer. The recurrent p.Arg38Gln allele
              accounts for most reported patients and was the variant characterised in the largest phenotype
              series.

              Germline mosaicism has been documented in an unaffected transmitting mother, which is directly
              relevant to counselling: an apparently de novo variant in this gene cannot be assumed to
              carry negligible recurrence risk for subsequent pregnancies.'
          role: ancestor
      assertion_type: Variant
      assertion:
        name: p.Arg107Gln
        description: NM_001256510.1:c.320G>A. The second recurrent allele, affecting the other arginine
          of the same basic patch, and shown by structural analysis to affect dimer interactions in the
          same way.
        clinical_significance: PATHOGENIC
        functional_effects:
        - type: dominant-negative
          description: Loss of a positive charge in the single-stranded DNA-binding patch, with the same
            predicted effect on dimer interactions as p.Arg38Gln.
      selected_evidence:
        snippet: The loss of a positive charge at these positions is very likely to lower the affinity
          of SSBP1 for single-strand DNA.
        supports: SUPPORT
