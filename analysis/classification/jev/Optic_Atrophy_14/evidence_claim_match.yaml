  3befcd3f87a64d85a7357300f455307110d828db3297c96591296abbd6b7be51:
    claim:
      about:
        disease:
          name: Optic Atrophy 14
          disease_term:
            preferred_term: Optic atrophy 14
            term:
              id: MONDO:0957824
              label: optic atrophy 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired DRP1 Recruitment to the Outer Mitochondrial Membrane
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: PROVISIONAL
        description: 'The proposed molecular lesion. MID51''s job is to recruit DRP1, a dynamin-related
          GTPase that has no membrane-binding domain of its own, onto the outer mitochondrial membrane
          so that it can constrict and divide the organelle. The p.Y240 residue sits in the loop that
          binds DRP1, and independent work concludes that the p.Y240N variant disrupts DRP1 recruitment
          while leaving MID51 oligomerisation intact, with the downstream consequence of selectively inhibiting
          DRP1 GTP hydrolysis.

          Marked PROVISIONAL for a specific reason, not as a general hedge. The DRP1 recruitment claim
          is well evidenced for p.Y240N, whose position in the binding loop predicts it. It is *not* evidenced
          for p.R146W, which lies in a domain of unknown function outside the DRP1-binding region, and
          for which no DRP1 experiment has been reported. Both variants produce the same network phenotype
          at the node below, so either p.R146W reaches it by the same route for a reason nobody has identified,
          or the two alleles converge from different molecular starting points. Nothing published distinguishes
          these.'
        molecular_functions:
        - preferred_term: DRP1 recruitment activity of MID51
          term:
            id: GO:0030674
            label: protein-macromolecule adaptor activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: mitochondrial fission
          term:
            id: GO:0000266
            label: mitochondrial fission
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Mid51(Y240N) Drp1-binding domain mutant which is linked to dominant optic atrophy disrupts
          Drp1 recruitment but not Mid51 oligomerization, leading to the selective inhibition of Drp1
          GTP hydrolysis
        supports: SUPPORT
