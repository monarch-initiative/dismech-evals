      assertion_type: Genetic
      assertion:
        name: MIEF1
        gene_term:
          preferred_term: MIEF1
          term:
            id: hgnc:25979
            label: MIEF1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'MIEF1 encodes MID51, also written MiD51; the gene is sometimes referred to by the protein
          name, and its paralogue MIEF2 encodes MID49. Only two disease alleles are known: c.718T>A p.(Tyr240Asn),
          absent from databases, in exon 6; and c.436C>T p.(Arg146Trp), rs778124994, in exon 5, at a gnomAD
          frequency of 1.99e-5.

          A transcription error in the source, flagged so it is not propagated. The figure legend describing
          the second variant states that c.436C>T is "localized at position 416 of the MID51 protein"
          while naming the change p.R146W in the same sentence; 146 is the position consistent with the
          nucleotide change, the sequence alignment, and every other mention in the paper. Read 416 as
          a typographical error for 146.

          What is not known about this gene''s variants. There is no reported MIEF1 variant that is *not*
          disease-associated in a patient with optic neuropathy, no missense-constraint analysis, and
          no second family - so a new MIEF1 missense variant found in a patient with optic atrophy has
          essentially no gene-specific precedent to be interpreted against, beyond whether it falls in
          the DRP1-binding loop.'
      selected_evidence:
        snippet: The first individual harbored a c.718 T > A variant, not referenced in any database,
          and the second individual harbored a c.436C > T variant, referred to as rs778124994, with a
          frequency of 1.99e-5 in GnomAD database.
        supports: SUPPORT
