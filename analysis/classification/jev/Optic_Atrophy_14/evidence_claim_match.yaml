      assertion_type: Diagnosis
      assertion:
        name: Recognising the Reversed Visual Field Pattern and Sequencing MIEF1
        description: 'The practical content of this entity is a pattern-recognition rule. An adult with
          sudden painless bilateral visual loss, pale non-swollen optic discs, abnormal visual evoked
          potentials with normal electroretinograms, and a field defect that started at the *periphery*,
          who is negative for OPA1, OPA3, WFS1 and the LHON mitochondrial-DNA mutations, is the patient
          in whom MIEF1 should be sequenced. The defining paper makes exactly that recommendation.

          Two negatives are part of the workup and were done in both reported patients: glaucoma was excluded,
          and serology for anti-aquaporin-4 and anti-myelin-oligodendrocyte-glycoprotein antibodies was
          negative. Both are important because a sudden painless optic neuropathy in a middle-aged woman
          is more often an acquired inflammatory one than a genetic one.'
      selected_evidence:
        snippet: Together, our work should prompt the molecular screening of MIEF1 in ION individuals
          with severe alterations of the peripheral visual field
        supports: SUPPORT
