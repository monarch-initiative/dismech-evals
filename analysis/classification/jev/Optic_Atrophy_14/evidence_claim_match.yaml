            term:
              id: MONDO:0957824
              label: optic atrophy 14
        context: []
      assertion_type: Prevalence
      assertion:
        population: French inherited optic neuropathy cohort
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'Two patients, both women, from a cohort of 200 individuals in France with inherited optic
          neuropathy who had already been screened negative for OPA1, OPA3, WFS1 and the three primary
          LHON mitochondrial-DNA mutations. No further MIEF1 patient has been published.

          The fraction - two of two hundred, or one percent - is a diagnostic yield within an already-selected
          undiagnosed cohort, not a prevalence and not the share of inherited optic neuropathy attributable
          to MIEF1. The cohort was enriched for cases that the common genes had failed to explain, which
          inflates any rare gene''s apparent share, and the panel covered only 22 genes, which means an
          unknown fraction of those 200 remain undiagnosed for reasons the study could not see.

          A larger unselected series from the same French diagnostic service puts an upper bound on the
          gene''s importance. Sequencing 87 nuclear genes plus the Leber mitochondrial-DNA mutations in
          2,186 probands referred for suspected hereditary optic neuropathy reached a diagnosis in 30
          percent, and ten genes accounted for more than 96 percent of those diagnoses. MIEF1 is not among
          those ten. Eleven further genes, each under one percent of cases, together explained 17 individuals
          in the whole series - so whatever share MIEF1 holds lies inside that residue.

          Note what this does *not* add: patients. The 2023 series comes from the same Angers reference
          centre and shares five authors with the 2021 MIEF1 report, including its first author, so any
          MIEF1 case within it is presumptively one of the two already reported rather than a new one.
          This entry counts two patients in total.'
      selected_evidence:
        snippet: we identified two individuals (Fig. 1) harboring a MIEF1 heterozygous variant, which
          were confirmed by Sanger sequencing
        supports: SUPPORT
