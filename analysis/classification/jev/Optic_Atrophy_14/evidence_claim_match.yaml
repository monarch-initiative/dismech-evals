              HP:0003596 "Middle age onset", which HPO scopes to 40-60 years, and both patients fall inside
              it. `LATE` is HP:0003584, scoped to onset after 60, and would be wrong here. The paper is
              titled "late onset" in the ordinary sense - late relative to the first two decades, when
              other dominant optic atrophies declare themselves - not in HPO''s sense. Do not "correct"
              this to LATE on the strength of the title.'
      selected_evidence:
        snippet: In both individuals, the disease progressed to poor vision
