              to ophthalmological attention in adulthood. The paper''s own first discriminating criterion
              is that "the visual loss was noticed during adulthood, rather than during the first two
              decades, as commonly observed in other DOA". The ages recorded here are ages at study rather
              than ages at onset, which the source does not separate cleanly for patient 1 - she noticed
              a faint visual problem in 2002 and lost acuity in 2015 - so treat them as bounding the presentation
              rather than dating it.

