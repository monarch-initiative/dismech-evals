  67031e5341ba48db0b2aee622920655292514bb97a9a6df0a70e50efc3a55990:
    claim:
      about:
        disease:
          name: Optic Atrophy 14
          disease_term:
            preferred_term: Optic atrophy 14
            term:
              id: MONDO:0957824
              label: optic atrophy 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Mitochondrial Network Dynamics
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: ESTABLISHED
        description: 'The measured cellular phenotype, and the strongest evidence in the entity. Using
          a photoactivatable matrix probe to count fusion events between mitochondria in live cells, wild-type
          MID51 expression increased the rate of fusion, and both mutants significantly decreased it relative
          to wild-type.

          Read the direction carefully, because it is counterintuitive. MID51 is a *fission* adaptor,
          yet overexpressing wild-type MID51 increases *fusion* - the established explanation being that
