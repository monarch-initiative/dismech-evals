        context:
        - path: /experimental_models/0
          value:
            name: MID51 variant expression in HeLa cells
            experimental_model_type: CELL_LINE
            description: Transient expression of mCherry- or myc-tagged wild-type, p.Y240N and p.R146W
              MID51 in HeLa cells, assayed by live confocal microscopy for localisation, by immunoprecipitation
              and immunoblot for oligomerisation, and by photoactivatable matrix probe for fusion events.
              This is the entire functional evidence base for the disease, and it is the same system in
              which the independent group later mapped the DRP1-recruitment defect.
          role: ancestor
        - path: /experimental_models/0/modeled_mechanisms/0
          value:
            target: Disrupted Mitochondrial Network Dynamics
            relationship: RECAPITULATES
            fidelity: LOW
            description: The assay demonstrates that both patient variants abolish MID51's normal effect
              on mitochondrial network dynamics, which is the disease's proposed cellular lesion.
            limitations: Three limitations, and they compound. The cell is a cervical adenocarcinoma line,
              not a retinal ganglion cell, and the selective vulnerability of that neuron is the whole
              unexplained part of the disease. The variants are expressed transiently from a plasmid on
              top of endogenous wild-type MID51 rather than from the endogenous locus, and the cited review
              states explicitly that heterologous overexpression and increased endogenous MiD have opposite
              effects on the network - so the assay's baseline is a condition that does not occur in a
              patient. And the readout is a difference from overexpressed wild-type MID51, not from an
              untransfected cell, which measures loss of an overexpression artefact's effect rather than
              the variant's effect on a normal cell. Fidelity is graded LOW on that basis.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Mitochondrial fusion events after mito-PAGFP photoactivation
        target: Disrupted Mitochondrial Network Dynamics
        direction: DECREASED
        interpretation: Both mutants gave significantly fewer fusion events than wild-type MID51, which
          is the quantitative basis for the disease's cellular claim.
      selected_evidence:
        snippet: In contrast, both MID51 p.Y240N and p.R146W mutants resulted in significantly decreased
          mitochondrial fusion events and disrupted mitochondrial network dynamics, as compared to wild-type
          MID51 (Fig. 3j-m).
        supports: SUPPORT
