  e4eefd67706aff88a2cf6d3886853b8d606afd259c4db48dd4da8f8961f2a617:
    claim:
      about:
        disease:
          name: Optic Atrophy 14
          disease_term:
            preferred_term: Optic atrophy 14
            term:
              id: MONDO:0957824
              label: optic atrophy 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous MIEF1 Missense Variant
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: PROVISIONAL
        description: 'Two variants, one per patient. c.718T>A gives p.Y240N, which lies in MID51''s DRP1-binding
          region; c.436C>T gives p.R146W, in a domain conserved with MID49 but of no known function. Neither
          is in the transmembrane domain that anchors MID51 in the outer membrane, and neither is at a
          residue previously shown to mediate oligomerisation - which is what makes the functional results
          below interpretable rather than merely negative.

          Marked PROVISIONAL rather than ESTABLISHED because the pathogenicity argument is rarity plus
          in silico prediction plus an in vitro effect, in two unrelated singletons. The p.Y240N variant
          is absent from databases; p.R146W is rs778124994 at a gnomAD frequency of about 2 in 100,000,
          which is rare but not private.'
        genes:
        - preferred_term: MIEF1
          term:
            id: hgnc:25979
            label: MIEF1
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          zygosity: HETEROZYGOUS
          variant_origin: GERMLINE
          description: 'Curated as LOSS_OF_FUNCTION, and the choice needs its reasoning stated because
            the alternatives are live. The measured effect is that the mutants fail to do what wild-type
            MID51 does - wild-type expression increases fusion events, mutant expression does not - which
            is loss of a normal activity, and the follow-up work attributes it specifically to loss of
            DRP1 recruitment. DOMINANT_NEGATIVE is the obvious competing hypothesis for a heterozygous
            missense variant in an oligomeric adaptor, and it has not been excluded: no experiment reported
            here tests the mutant against wild-type MID51 in the same cell, and the assays are transient
            overexpression rather than expression from the endogenous locus. If a dominant-negative mechanism
            is later demonstrated, this slot should change.'
      selected_evidence:
        snippet: These variants lead to the p.Y240N and the p.R146W amino-acid changes in MID51, respectively,
          with p.Y240N located in a DRP1 binding domain, and p.R146W located in another domain conserved
          within MID49, but without known function
        supports: SUPPORT
