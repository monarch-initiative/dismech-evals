              label: optic atrophy 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Preserved MID51 Localisation and Oligomerisation
        biological_scale: MOLECULAR
        role: modifier
        mechanism_confidence: ESTABLISHED
        description: 'A node that records what the disease is not, because two obvious mechanisms were
          tested and excluded, and excluding them is what makes the positive finding meaningful.

          Both mutant proteins localise to the mitochondrial network in live cells just as wild-type MID51
          does, so this is not a mislocalisation disease. Both form dimers, tetramers and high-molecular-weight
          species in the same ratios as wild-type, so it is not an oligomerisation disease either. A curator
          adding to this entry should not later attach a mislocalisation or misassembly mechanism to it
          without new data; these were looked for and were not there.

          An independent group extended the second of those negatives one step downstream. MID51''s other
          job, in complex with Fis1, is to drive lysosomal untethering at mitochondria-lysosome contact
          sites, and that function depends on the oligomerisation interface rather than on DRP1 binding.
          The optic-atrophy variant p.Y240N leaves it intact: it still forms a Mid51/Fis1 complex and
          does not misregulate lysosomal untethering or lysosomal network dynamics. So the preservation
          established here is not an incidental in vitro observation - it has a measurable functional
          consequence, and it is what makes the disease''s lesion specific rather than general. Whether
          that specificity explains why the disease is confined to the optic nerve is an open question
          below.'
        cellular_components:
        - preferred_term: mitochondrial outer membrane
          term:
            id: GO:0005741
            label: mitochondrial outer membrane
      selected_evidence:
        snippet: This was also true for mutant MID51 p.Y240N and p.R146W proteins, which also localized
          to the mitochondrial network in live cells (Fig. 3a, b), demonstrating that these MIEF1 missense
          variants linked to optic neuropathy do not alter MID51's mitochondrial localization.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
