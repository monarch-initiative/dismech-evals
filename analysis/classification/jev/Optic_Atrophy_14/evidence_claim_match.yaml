            label: Autosomal dominant inheritance
        description: 'Both reported patients are heterozygous for a MIEF1 missense variant, and the disease
          is described throughout the defining paper as dominant.

          What that rests on should be stated plainly, because it is not a segregation analysis. The two
          patients are unrelated women ascertained separately from a 200-person cohort; no affected relative,
          no pedigree and no transmission is described in the accessible text. Dominance is inferred from
          heterozygosity plus rarity plus an in vitro functional effect - which is a reasonable inference
          and is not the same as a demonstration. The gene-disease validity question this raises is an
          open discussion below.'
      selected_evidence:
        snippet: In addition, SNP array analyses revealed no chromosomal abnormality, no copy number variation
          and no large region of homozygosity that might have indicated a consanguinity.
        supports: SUPPORT
