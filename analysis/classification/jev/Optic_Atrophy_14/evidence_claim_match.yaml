      assertion_type: DifferentialDiagnosis
      assertion:
        name: OPA1-related dominant optic atrophy and the other mitochondrial-dynamics optic neuropathies
        description: The genes are neighbours in mechanism and separable on presentation. OPA1 accounts
          for most dominant optic atrophy, with more than 400 pathogenic variants described, and typically
          declares itself in the first two decades with insidious central visual loss. MFN2 and OPA3 act
          on fusion; SPG7 and AFG3L2 act indirectly through OPA1 processing; DNM1L acts on fission from
          the other side of the balance. MIEF1 is distinguished from all of them by adult onset, sudden
          painless acuity loss, and peripheral-first field loss - and, if those fail, by sequencing.
      selected_evidence:
        snippet: In dominant optic atrophy (DOA, MIM165500), it is now well established that mutations
          in genes involved in mitochondrial dynamics such as OPA1 (MIM#605290) are the main cause of
          the disease. More than 400 distinct pathogenic variants have been described in OPA1
        supports: SUPPORT
