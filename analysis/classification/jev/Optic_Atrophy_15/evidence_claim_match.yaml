      assertion_type: Pathophysiology
      assertion:
        name: Impaired Respiratory-Chain Assembly and Combined OXPHOS Deficiency
        biological_scale: CELLULAR
        description: In the multisystem patient's fibroblasts and lymphoblasts, reduced MCAT produced
          a combined oxidative phosphorylation deficiency - reduced complex I (NDUFB8), II (SDHB) and
          IV (COXII) subunits with correspondingly decreased respiratory-chain enzyme activities - rescued
          by re-expressing wild-type MCAT. In that patient protein lipoylation was normal, and in a mutant
          myoblast line the p.Thr271Ile allele restored lipoylation but only partially restored respiration,
          implicating impaired respiratory-chain assembly rather than lipoylation as the relevant consequence.
          mtFAS's role here is the supply of acyl-ACP for complex assembly (via mitochondrial ACP/NDUFAB1),
          not fatty-acid synthesis as an end in itself.
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: lymphoblast
          term:
            id: CL:0017005
            label: lymphoblast
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex assembly
          term:
            id: GO:0033108
            label: mitochondrial respiratory chain complex assembly
          modifier: DECREASED
        - preferred_term: cellular respiration
          term:
            id: GO:0045333
            label: cellular respiration
          modifier: DECREASED
      selected_evidence:
        snippet: Protein levels for NDUFB8 and COXII, subunits of complex I and IV respectively, were
          markedly reduced in lymphoblasts and fibroblasts, as well as SDHB for complex II in fibroblasts.
          ETC enzyme activities were decreased in parallel.
        supports: SUPPORT
