        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Biallelic MCAT variants cause the disease. Reported genotypes are homozygous p.Leu81Arg
          plus p.Arg212Trp (consanguineous Chinese brothers), compound heterozygous c.424-2A>G (splice
          donor) plus p.Glu347Lys (sporadic French case), and homozygous p.Thr271Ile (boy with multisystem
          disease). The variants are hypomorphic rather than null - they destabilise the protein and reduce
          its expression - and no fully inactivating human genotype has been reported. The gene-disease
          assertion rests on three families, and MCAT is a recognised nuclear arLHON gene.
      selected_evidence:
        snippet: we identified two novel MCAT mutations in a female patient who presented with acute,
          sudden, bilateral, yet asymmetric, central visual loss at the age of 20
        supports: SUPPORT
