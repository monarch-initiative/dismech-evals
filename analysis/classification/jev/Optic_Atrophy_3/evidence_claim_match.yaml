    evidence_metadata:
      reference: PMID:20372962
      reference_title: Optic atrophy 3 as a protein of the mitochondrial outer membrane induces mitochondrial
        fragmentation.
      evidence_source: IN_VITRO
      explanation: The bidirectional dose-morphology relationship. It is the reason reduced steady-state
        protein is not by itself an explanation for the fragmented network seen in patient cells.
