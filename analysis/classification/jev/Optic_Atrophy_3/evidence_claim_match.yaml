          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'Heterozygous OPA3 variants segregate with disease in a dominant pattern. The entity
          was defined as such in 2004 in two unrelated French families, and dominant transmission has
          since been confirmed repeatedly, including a large pedigree in which a novel missense allele
          segregated with the phenotype and a documented de novo case.

          Dominance here is not the whole inheritance story for the gene. Biallelic OPA3 variants cause
          a different, recessive disease (Costeff syndrome), so "OPA3 inheritance" is ambiguous unless
          the allele count is stated. See the differential diagnoses and the discussion below.'
      selected_evidence:
        snippet: 'A new clinical entity is identified: autosomal dominant optic atrophy and cataract,
          due to a heterozygous mutation of the OPA3 gene, a nuclear gene encoding a mitochondrial protein.'
        supports: SUPPORT
