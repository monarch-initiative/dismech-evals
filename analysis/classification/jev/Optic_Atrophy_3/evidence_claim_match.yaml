              id: MONDO:0008133
              label: optic atrophy 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced OPA3 Steady-State Levels and Mitochondrial Network Fragmentation
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'In fibroblasts from a patient carrying the presequence-insertion allele the mitochondrial
          network is fragmented and mitochondrial mass is reduced, and the mutant protein is present at
          lower steady-state levels than wild type. Ultrastructural work in a separate ADOAC+ family instead
          found enlarged mitochondria with slightly fragmented cristae, so the morphological abnormality
          is consistent in kind - disturbed mitochondrial morphology - without being consistent in direction
          across alleles.

          Where OPA3 sits is better established than what it does. It is an integral protein of the mitochondrial
          outer membrane, with a cytosol-facing C-terminus and an N-terminal targeting domain, and its
          abundance sets network morphology bidirectionally: overexpression fragments mitochondria and
          knockdown elongates them. That bidirectionality is what makes the presequence allele interpretable
          - a variant that lowers steady-state protein should elongate the network, yet the patient fibroblasts
          fragment it, so reduced abundance alone does not account for the phenotype.

          What is deliberately absent from this node is a normal molecular function. OPA3 has no known
          homolog and no assigned biochemical activity, so this node stops at morphology rather than naming
          the step that the variant breaks.'
        biological_processes:
        - preferred_term: mitochondrial fission
          term:
            id: GO:0000266
            label: mitochondrial fission
          modifier: INCREASED
        - preferred_term: mitochondrion organization
          term:
            id: GO:0007005
            label: mitochondrion organization
          modifier: ABNORMAL
        cell_types:
        - preferred_term: dermal fibroblast (patient-derived)
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: By quantitative analysis, we demonstrated that overexpression of OPA3 significantly induced
          mitochondrial fragmentation, whereas OPA3 knockdown resulted in highly elongated mitochondria.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/4
      context_paths:
