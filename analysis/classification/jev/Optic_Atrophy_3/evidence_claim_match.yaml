  8ddd635acd4228d6559ebadc6b60c27457fc91245659967b73dc7dc447e7a6a3:
    claim:
      about:
        disease:
          name: Optic Atrophy 3
          disease_term:
            preferred_term: Optic atrophy 3
            term:
              id: MONDO:0008133
              label: optic atrophy 3
        context: []
      assertion_type: Genetic
      assertion:
        name: OPA3
        gene_term:
          preferred_term: OPA3
          term:
            id: hgnc:8142
            label: OPA3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'OPA3 is a small nuclear-encoded mitochondrial membrane protein on 19q13. It is the only
          gene implicated in this entity.

          Interpreting a new OPA3 variant means answering two questions in order, and the second is the
          one that is easy to skip. First, is it heterozygous or biallelic - that decides which of the
          two OPA3 diseases is in play. Second, is it missense or loss of function - missense alleles
          are enriched in the dominant optic-atrophy phenotype and loss-of-function alleles in the recessive
          aciduria phenotype, so a heterozygous truncating variant found in a patient with optic atrophy
          does not have the class of allele the dominant disease usually shows.

          The recurrent c.313C>G p.(Gln105Glu) allele carries a large share of the published dominant
          families; as of the 2015 series only six OPA3 dominant families had been reported in total.

          A caution about the founding reference. Reynier et al. 2004 (PMID:15342707) is the paper that
          established OPA3 as an ADOAC locus and is cited in the top-level references, but no abstract
          or full text could be cached for it, so nothing in this entry is quoted from it. Its content
          is instead represented through the 2005 Rev Neurol report on the Garcin family and through later
          series.'
      selected_evidence:
        snippet: Besides the known p.Q105E mutation, we observed a novel insertion, c.10_11insCGCCCG/p.V3_G4insAP
          which is located in the mitochondrial presequence.
        supports: SUPPORT
