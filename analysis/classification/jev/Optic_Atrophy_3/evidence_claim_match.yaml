        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Retinal Ganglion Cell Degeneration
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: 'Dominant optic atrophy of any genetic cause is a disease of the retinal ganglion
          cell and its axon, and the pattern in OPA3 disease is the one typical of mitochondrial optic
          neuropathy: the papillomacular bundle is affected first, producing central acuity loss and colour
          vision defects, with optic disc pallor on fundoscopy. Where OPA3 has been placed against OPA1
          mechanistically, the claim is that OPA1 variants disturb fusion, energy metabolism, apoptosis,
          calcium handling and mitochondrial genome maintenance, whereas OPA3 variants affect energy metabolism
          and the control of apoptosis only.'
        biological_processes:
        - preferred_term: neuron apoptotic process
          term:
            id: GO:0051402
            label: neuron apoptotic process
          modifier: INCREASED
        cell_types:
        - preferred_term: retinal ganglion cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
        locations:
        - preferred_term: optic nerve
          term:
            id: UBERON:0000941
            label: cranial nerve II
      selected_evidence:
        snippet: The disease affects primary the retinal ganglion cells (RGC) and their axons forming
          the optic nerve, which transfer the visual information from the photoreceptors to the lateral
          geniculus in the brain.
        supports: SUPPORT
