      assertion_type: DifferentialDiagnosis
      assertion:
        name: Costeff syndrome (3-methylglutaconic aciduria type III)
        description: 'The most important entry on this list, because it is caused by the same gene and
          is what a literature search on "OPA3" mostly returns. It is recessive, needs biallelic variants
          that are enriched for loss of function, begins before age ten with optic atrophy plus a choreoathetoid
          movement disorder, progresses to spastic paraparesis, and carries a urinary organic-acid marker
          that the dominant disease does not. A founder splice-site allele is prevalent in the Iraqi Jewish
          population.

          Practical separation: allele count and urinary organic acids. Neither 3-methylglutaconic nor
          3-methylglutaric aciduria is a feature of the dominant disease.'
      selected_evidence:
        snippet: Costeff syndrome is characterized by optic atrophy and/or choreoathetoid movement disorder
          with onset before age ten years.
        supports: SUPPORT
