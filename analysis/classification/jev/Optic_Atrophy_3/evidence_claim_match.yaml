  18b58b6d06c3c92ca0ff1379d8a03af0aedeff4b97d09da370fa188987de0f30:
    claim:
      about:
        disease:
          name: Optic Atrophy 3
          disease_term:
            preferred_term: Optic atrophy 3
            term:
              id: MONDO:0008133
              label: optic atrophy 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous OPA3 Missense Variant
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'The dominant phenotype is overwhelmingly associated with heterozygous missense variants.
          c.313C>G p.(Gln105Glu) is recurrent and had been reported in four dominant families before a
          further two were added in 2015; other reported alleles include an in-frame insertion in the
          mitochondrial presequence, c.10_11insCGCCCG p.(Val3_Gly4insAla_Pro), a de novo c.235C>G p.(Leu79Val),
          and c.30G>C p.(Lys10Asn).

          The allelic-class asymmetry is the substantive genetic content here. Missense variants are enriched
          in the dominant optic-atrophy phenotype while loss-of-function variants are enriched in the
          recessive 3-methylglutaconic-aciduria phenotype, which argues that the dominant disease is not
          simple haploinsufficiency.'
        genes:
        - preferred_term: OPA3
          term:
            id: hgnc:8142
            label: OPA3
        genetic_context:
          allele_type: SNV
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
      selected_evidence:
        snippet: Affected individuals from two families were found to harbour the c.313C > G, p.(Gln105Glu)
          change in heterozygous state; this genetic defect has been previously reported in four dominant
          optic atrophy families.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
