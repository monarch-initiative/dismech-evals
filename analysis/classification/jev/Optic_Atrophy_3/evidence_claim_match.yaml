          the mice appear uncompromised. Retinal ganglion cell loss and optic nerve degeneration appear
          only in homozygotes, which model the recessive human disease instead, together with cardiomyopathy,
          extrapyramidal dysfunction and death before four months.
        limitations: The genotype that models this entity produces no phenotype, so the model cannot be
          used to study dominant OPA3 optic neuropathy. Any retinal or optic nerve finding cited from
          this mouse is a homozygote finding and belongs to Costeff syndrome, not here. There is currently
          no published mouse carrying a human dominant OPA3 allele such as p.Q105E.
