  80094e324d2795e70c1582b7016d228ae82ee9c5ea7bf45c6cba68fff3d54241:
    claim:
      about:
        disease:
          name: Optic Atrophy 3
          disease_term:
            preferred_term: Optic atrophy 3
            term:
              id: MONDO:0008133
              label: optic atrophy 3
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Sequencing OPA3 after OPA1 and LHON have been excluded
        description: 'The practical rule is that OPA3 is a second-line gene. A patient with bilateral
          optic atrophy is screened for OPA1 and the primary Leber mitochondrial-DNA mutations first;
          OPA3 is worth sequencing when those are negative and the phenotype carries one of the pointers
          - cortical cataract, sensorineural hearing loss, or an axonal peripheral neuropathy.

          Two presentations invert the usual order and are the ones most likely to be missed. A child
          with bilateral infantile cataracts whose vision does not improve after lens surgery should have
          the optic nerve assessed rather than the surgery reviewed. And an adult worked up for a complex
          inherited peripheral neuropathy may carry an OPA3 variant even without clinically apparent optic
          atrophy.'
      selected_evidence:
        snippet: OPA3 mutations should be included in the differential diagnosis of complex inherited
          PN, even in the absence of clinically apparent optic atrophy.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
