      assertion_type: Diagnosis
      assertion:
        name: CRP, NLR, and abscess-volume surgical prediction
        description: Elevated C-reactive protein, leukocytosis, neutrophil-to-lymphocyte ratio, proptosis,
          and abscess volume are severity markers that help estimate the likelihood that a severe pediatric
          orbital infection will require surgery.
      selected_evidence:
        snippet: 'In the adjusted analysis, the risk of surgical intervention was associated with older
          age (age 9 to <14: aOR 3.9, 95% CI 2.3-6.6; and age 14 to ≤18 years: aOR 7.0, 95% CI 3.4-14.1),
          elevated C-reactive protein >120 mg/L (aOR 2.8, 95% CI 1.3-5.9), elevated white blood cell count
          of 12-20 000/μL (aOR 1.7, 95% CI 1.1-2.6), proptosis (aOR 2.6, 95% CI 1.7-4.0), and subperiosteal/orbital
          abscess (aOR 5.3, 95% CI 3.6-7.9).'
        supports: SUPPORT
