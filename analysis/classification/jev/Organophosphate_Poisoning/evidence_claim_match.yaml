      assertion_type: Pathophysiology
      assertion:
        name: Organophosphate bioactivation
        description: Many organophosphate insecticides are phosphorothioate (P=S, "thion") pro-toxicants
          that require hepatic cytochrome P450-mediated oxidative desulfuration to their active oxon (P=O)
          form, a far more potent cholinesterase inhibitor. Direct-acting oxons and nerve agents skip
          this step, and the speed of activation varies between compounds.
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: xenobiotic metabolic process
          modifier: INCREASED
          term:
            id: GO:0006805
            label: xenobiotic metabolic process
      selected_evidence:
        snippet: Variability between organophosphorus insecticides-in lipophilicity, speed of activation,
          speed and potency of acetylcholinesterase inhibition, and in the chemical groups attached to
          the phosphorus-results in variable speed of poisoning onset, severity, clinical toxidrome, and
          case fatality.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30230960
      reference_title: Novel Clinical Toxicology and Pharmacology of Organophosphorus Insecticide Self-Poisoning.
