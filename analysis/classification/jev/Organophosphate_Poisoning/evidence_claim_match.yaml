      assertion_type: Pathophysiology
      assertion:
        name: Aging of inhibited acetylcholinesterase
        description: After phosphorylation, the enzyme-organophosphate adduct can lose an alkyl group
          ("aging"), converting the initially reversible inhibition into an irreversible bond that oxime
          reactivators can no longer cleave; recovery then requires synthesis of new enzyme. The aging
          rate is compound-dependent and sets the therapeutic window for oxime therapy.
        biological_processes:
        - preferred_term: acetylcholine catabolic process
          modifier: DECREASED
          term:
            id: GO:0006581
            label: acetylcholine catabolic process
      selected_evidence:
        snippet: With OP insecticides (but not carbamates), "aging" may also occur by partial dealkylation
          of the serine group at the active site of AChE; recovery of AChE activity requires synthesis
          of new enzyme in the liver.
        supports: SUPPORT
    origin:
