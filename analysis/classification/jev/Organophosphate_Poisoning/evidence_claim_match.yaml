      assertion_type: Definition
      assertion:
        name: Clinical case definition for organophosphate poisoning
        definition_type: CASE_DEFINITION
        description: Organophosphate poisoning is a cholinergic toxic syndrome caused by organophosphorus
          compounds that inhibit acetylcholinesterase, leading to acetylcholine accumulation and overstimulation
          of muscarinic and nicotinic receptors, confirmed by depressed blood cholinesterase activity
          in a compatible exposure context.
        scope: Disease-level clinical framing across acute crisis and delayed syndromes
      selected_evidence:
        snippet: The primary mechanism, common among all OPs, that initiates their toxic effects is the
          inhibition of acetylcholinesterase.
        supports: SUPPORT
