        context: []
      assertion_type: Subtype
      assertion:
        name: Intermediate Syndrome
        description: A syndrome of proximal limb, neck flexor, cranial nerve, and respiratory muscle weakness
          appearing roughly 24-96 hours after the cholinergic crisis, attributed to prolonged neuromuscular-junction
          dysfunction; it can precipitate respiratory failure after the acute crisis has resolved and
          does not respond to atropine or oximes.
      selected_evidence:
        snippet: We observed 10 patients who had paralysis of proximal limb muscles, neck flexors, motor
          cranial nerves, and respiratory muscles 24 to 96 hours after poisoning, after a well-defined
          cholinergic phase.
        supports: SUPPORT
