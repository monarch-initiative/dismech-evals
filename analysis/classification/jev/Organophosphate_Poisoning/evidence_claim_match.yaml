      assertion_type: Pathophysiology
      assertion:
        name: Organophosphate exposure and absorption
        description: Organophosphorus compounds enter the body across the skin, respiratory tract, and
          gastrointestinal tract following agricultural, occupational, intentional, or chemical-warfare
          exposure, and are distributed systemically to reach their molecular targets; in high doses they
          are toxic or lethal. This shared entry point feeds both the acetylcholinesterase arm (via bioactivation)
          and the delayed neuropathy-target-esterase arm.
        biological_processes:
        - preferred_term: xenobiotic metabolic process
          modifier: INCREASED
          term:
            id: GO:0006805
            label: xenobiotic metabolic process
      selected_evidence:
        snippet: In high doses or chronic exposure, they can be toxic or lethal.
        supports: SUPPORT
