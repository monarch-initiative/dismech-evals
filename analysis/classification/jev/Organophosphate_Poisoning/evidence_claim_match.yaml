  97c921c795f2940e43dafc059fa5961b00f50b69af0d9160b8abb7fa813cfb76:
    claim:
      about:
        disease:
          name: Organophosphate Poisoning
          disease_term:
            preferred_term: organophosphate poisoning
            term:
              id: MONDO:0800386
              label: organophosphate poisoning
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Chlorpyrifos-exposed zebrafish larva (VAMR behaviour assay)
        species: Zebrafish
        background: UFZ-OBI/WIK
        publication: PMID:41780647
        description: 'Wild-type zebrafish larvae exposed by immersion to the organophosphate insecticide
          chlorpyrifos and tested at 5 days post-fertilization in the Visual and Acoustic Motor Response
          (VAMR) assay, which records movement across 26 sequential endpoints in response to light changes
          and tones. Two exposure paradigms were used: an acute 40-minute exposure at 5 days post-fertilization,
          and a single developmental exposure from 1 to 5 days post-fertilization. Chlorpyrifos was one
          of 12 developmental neurotoxicity reference chemicals tested.'
        modeled_mechanisms:
        - target: Central cholinergic overstimulation
          relationship: PERTURBS
          fidelity: UNKNOWN
          model_scale: ORGANISM
          description: 'Chlorpyrifos immersion is a chemical challenge to cholinergic transmission, and
            the larva''s locomotor behaviour is read as a whole-organism functional consequence of it.
            The direction of the effect depends on the exposure paradigm: more movement after acute exposure,
            less after developmental exposure.'
          limitations: The study measured behaviour only. It did not measure acetylcholinesterase activity
            or acetylcholine, and it does not attribute the behavioural effects to cholinesterase inhibition,
            so the tie to this node rests on the known pharmacology of chlorpyrifos and not on anything
            the assay observed. Acute and developmental exposure moved locomotion in opposite directions.
            The authors state that effects seen after the 40-minute exposure likely reflect short-term,
            receptor-mediated effects and that it is not clear whether they predict later developmental
            outcomes.
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The assay's quantity is larval movement, recorded as pixel change per second.
              The node's quantity is cholinergic synaptic transmission in the central nervous system.
              Altered movement after an organophosphate is consistent with cholinergic overstimulation
              but can also arise from effects on muscle, sensory input or general toxicity, none of which
              the assay separates.
          - divergence_type: SPECIES_MISMATCH
            materiality: UNKNOWN
            description: Larval zebrafish take up chlorpyrifos from the surrounding medium and must convert
              it to its active oxon themselves. How their absorption and metabolism compare with human
              oral, dermal or inhalational poisoning is not established for this compound, so concentrations
              in the medium cannot be read as human doses.
          readouts:
          - name: Locomotor activity in normally quiescent periods, acute exposure
            target: Central cholinergic overstimulation
            description: Movement during the light period, the intervals between acoustic stimuli, the
              intervals between endpoints and the intervals between habituation bouts, after a 40-minute
              exposure and compared with vehicle-treated larvae.
            direction: INCREASED
            interpretation: Larvae moved more in periods when untreated larvae are largely still. Half-maximal
              effect concentrations on the endpoints the authors report were in the low micromolar range.
          - name: Dark-period locomotor activity, acute exposure
            target: Central cholinergic overstimulation
            description: Movement during the dark periods of the assay, after a 40-minute exposure at
              5 days post-fertilization and compared with vehicle-treated larvae.
            direction: INCREASED
            interpretation: The acute increase was not confined to the quiescent intervals. The authors
              report it for some dark periods rather than all of them, and place the supporting panels
              in a supplementary figure.
          - name: Locomotor activity, developmental exposure
            target: Central cholinergic overstimulation
            description: Movement across the assay's endpoints at 5 days post-fertilization after exposure
              from 1 day post-fertilization, compared with vehicle-treated larvae.
            direction: DECREASED
            interpretation: Larvae moved less on most endpoints, the opposite of the acute effect, and
              at lower concentrations than in the acute paradigm.
          - name: Light-period locomotor activity, developmental exposure
            target: Central cholinergic overstimulation
            description: Movement during the 10-minute light period (endpoint VMR1) after developmental
              exposure, compared with vehicle-treated larvae.
            direction: UNCHANGED
            interpretation: The developmental reduction in movement did not extend to the light period,
              which is the period where acute exposure raised movement.
      selected_evidence:
        snippet: Zebrafish embryos or larvae were acutely (40 min) or developmentally (1-5 days post-fertilization)
          exposed to 12 DNT positive chemicals 5,5-diphenylhydantoin, BDE-99, chlorpyrifos
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
