        context: []
      assertion_type: Subtype
      assertion:
        name: Acute Cholinergic Crisis
        description: 'The immediate syndrome following organophosphate exposure, driven by acetylcholine
          accumulation: muscarinic features (miosis, hypersalivation, bronchorrhea, bradycardia, diarrhea),
          nicotinic features (fasciculations, muscle weakness), and central features (seizures, coma),
          with respiratory failure the principal cause of death.'
      selected_evidence:
        snippet: In acute OP exposure, the subsequent surge of acetylcholine in cholinergic synapses causes
          a peripheral cholinergic crisis and status epilepticus (SE), either of which can lead to death.
        supports: SUPPORT
