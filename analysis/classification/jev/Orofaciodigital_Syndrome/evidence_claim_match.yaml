          name: Orofaciodigital Syndrome
          disease_term:
            preferred_term: orofaciodigital syndrome
            term:
              id: MONDO:0015375
              label: orofaciodigital syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ofds_minor_spliceosome_route
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How does minor (U12-type) spliceosome dysfunction produce a specifically orofaciodigital
          phenotype rather than a generic multisystem disorder, and is ciliary transcript depletion the
          whole explanation?
        attaches_to:
        - pathophysiology#Minor Spliceosome Dysfunction and Ciliary Transcript Depletion
        rationale: Two subtypes (OFD 19, SCNM1; OFD 21, ZRSR2) are caused by loss of minor spliceosome
          components rather than of ciliary proteins, and both show minor-intron retention, depletion
          of ciliary transcripts including TMEM107, and abnormally elongated primary cilia. What is not
          established is whether ciliary transcript depletion is sufficient to account for the phenotype,
          or whether non-ciliary U12-dependent targets contribute; the SCNM1 study lists DERL2, ZC3H8
          and C17orf75 among the severely reduced transcripts alongside the ciliary ones, and the ZRSR2
          phenotype includes holoprosencephaly and pituitary anomaly, which are not typical of the ciliary
          subtypes. Note also that both reports describe cilia that are abnormally elongated, whereas
          several ciliary OFD genes give absent or short cilia, so the cellular phenotype is not simply
          a phenocopy. dismech separately curates minor-spliceosome disorders (RNU12-related_Minor_Spliceopathy,
          Roifman-syndrome) with no link to the ciliopathy tree; a shared minor-spliceosome module would
          be the structural place to resolve this.
        proposed_experiments:
        - experiment_id: ofds_u12_ciliary_transcript_rescue
          name: Rescue of the ciliary phenotype by restoring individual U12-dependent ciliary transcripts
          description: In SCNM1- or ZRSR2-deficient patient fibroblasts, re-express the depleted ciliary
            and basal-body transcripts (TMEM107, FAM92A) individually and in combination, and measure
            cilium length and Hedgehog reporter output. Full rescue would establish ciliary transcript
            depletion as sufficient; partial rescue would implicate non-ciliary U12 targets.
      selected_evidence:
        snippet: Notably, expression of TMEM107 and FAM92A encoding primary cilia and basal body proteins,
          respectively, and that of DERL2, ZC3H8, and C17orf75, were severely reduced in SCNM1-deficient
          cells.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36084634
      reference_title: Mutations in SCNM1 cause orofaciodigital syndrome due to minor intron splicing
        defects affecting primary cilia.
      evidence_source: IN_VITRO
      explanation: Shows that the depleted transcript set is not confined to ciliary genes, which is the
        open question this discussion records. Evidence source is IN_VITRO because the transcriptome comparison
        used patient fibroblasts and engineered cell lines.
