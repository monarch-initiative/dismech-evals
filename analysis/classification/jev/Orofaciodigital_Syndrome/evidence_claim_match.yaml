  bfebbdb55d459604a226c5b70052eb69bd69620d6168dab3d9f6d0ca206e056a:
    claim:
      about:
        disease:
          name: Orofaciodigital Syndrome
          disease_term:
            preferred_term: orofaciodigital syndrome
            term:
              id: MONDO:0015375
              label: orofaciodigital syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ofds_disease_versus_grouping
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Should the orofaciodigital syndromes be modeled as this Disease entry with has_subtypes,
          or as a Grouping over the already-standalone member entries?
        rationale: The case for a Grouping is real and should not be lost. Two members are already independent
          Disease entries with their own pathographs (Orofaciodigital_Syndrome_Type_I, Orofaciodigital_Syndrome_17)
          and a third OFD-spectrum disorder is curated under a non-OFD name (Heart_Defect_Tongue_Hamartoma_Polysyndactyly_Syndrome,
          WDPCP); the project convention is that a grouping sits over already-distinct entries. The subtypes
          are heterogeneous in inheritance (X-linked dominant male-lethal, X-linked recessive, autosomal
          recessive) and in ciliary subcompartment, and Bruel et al. state that the wide heterogeneity
          makes the initial classification obsolete, proposing a clinical classification restricted to
          three well-delineated subtypes with genotype-based classification for the rest, which is closer
          to a curated union with membership criteria than to a single blended graph. The case for the
          present Disease modeling is that the entry also has to carry a shared mechanism (ciliary Hedgehog
          derangement) that all members instantiate, that seventeen of the twenty numbered types have
          no standalone entry to group over, and that the MONDO term itself is a disease node with a curated
          pathophysiology to attach to. This entry takes the Disease form (the priority dashboard's CURATE_ROOT_WITH_SUBTYPES
          recommendation) and records the counter-argument here rather than deciding silently. If the
          per-subtype entry count grows, converting to a Grouping with NECESSARY criteria over an oral/facial
          arm, a digital arm and the ciliopathy_dysfunction basal-body/transition-zone node would be the
          natural migration.
      selected_evidence:
        snippet: A clinical classification restricted to the three frequent/well-delineated subtypes could
          be proposed, and for patients who do not fit one of these three main subtypes, a further classification
          could be based on the genotype.
        supports: SUPPORT
