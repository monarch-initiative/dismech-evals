      assertion_type: DifferentialDiagnosis
      assertion:
        name: Joubert syndrome
        description: The closest differential. OFD VI is formally a Joubert-syndrome-related disorder
          and shares the molar tooth sign and several genes (CPLANE1, TMEM216, TMEM107, OFD1), so the
          two are allelic rather than merely similar.
        distinguishing_features:
        - OFD VI requires oral-facial-digital findings (tongue hamartoma, additional frenula, mesoaxial
          polydactyly or hypothalamic hamartoma) in addition to the molar tooth sign; pure Joubert syndrome
          lacks them.
        - Joubert syndrome presents with hypotonia, ataxia, oculomotor apraxia and episodic hyperpnea
          as the leading features rather than a malformation triad.
        disease_term:
          preferred_term: Joubert syndrome
          term:
            id: MONDO:0018772
            label: Joubert syndrome
      selected_evidence:
        snippet: C5orf42 mutations have already been reported in Joubert syndrome confirming that OFD
          VI and JBS are allelic disorders, thus enhancing our knowledge of the complex, highly heterogeneous
          nature of ciliopathies.
        supports: SUPPORT
    origin:
