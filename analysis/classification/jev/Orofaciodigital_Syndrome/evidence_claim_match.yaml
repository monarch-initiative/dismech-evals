        conforms_to: limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification
        biological_scale: TISSUE
        role: intermediate
        description: Ciliary Hedgehog derangement in the limb bud perturbs the anteroposterior patterning
          gradient that specifies how many digits form and what identity each takes. In the orofaciodigital
          syndromes this typically adds digits, giving preaxial, postaxial or mesoaxial polydactyly, and
          also disturbs phalangeal segmentation, giving brachydactyly, syndactyly and clinodactyly. Because
          the autopod patterning programme is serially reused in fore- and hindlimb, the lesion is expressed
          in hands and feet alike.
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
