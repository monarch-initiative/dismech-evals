      assertion_type: Pathophysiology
      assertion:
        name: Cranial Neural Crest and Facial Midline Patterning Failure
        biological_scale: TISSUE
        role: intermediate
        description: The facial skeleton and the oral soft tissues derive from cranial neural crest cells
          populating the frontonasal and pharyngeal-arch prominences. Ciliary Hedgehog derangement in
          these cells broadens the domains of Hedgehog target gene expression and alters neural crest
          proliferation in the facial prominences, so the midline is patterned incorrectly. This is the
          tissue-level step that generates the oral and facial arms of the orofaciodigital triad.
        biological_processes:
        - preferred_term: embryonic cranial skeleton morphogenesis
          term:
            id: GO:0048701
            label: embryonic cranial skeleton morphogenesis
          modifier: ABNORMAL
        - preferred_term: roof of mouth development
          term:
            id: GO:0060021
            label: roof of mouth development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Elimination of the intraflagellar transport protein Kif3a leads to excessive Hedgehog
          responsiveness in facial mesenchyme, which is accompanied by broader expression domains of Gli1,
          Ptc and Shh, and reduced expression domains of Gli3.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
