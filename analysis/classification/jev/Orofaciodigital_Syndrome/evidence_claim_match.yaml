        description: A second, mechanistically distinct entry route operates in the two most recently
          delineated subtypes. SCNM1 (OFD 19) and ZRSR2 (OFD 21) encode components of the minor (U12-type)
          spliceosome. Loss of function causes retention or mis-splicing of the small set of U12-type
          introns, which are enriched in ciliary and basal-body genes, so ciliary transcripts such as
          TMEM107 are depleted without any primary defect in a ciliary protein itself. The convergence
          onto the ciliary phenotype is therefore indirect but experimentally demonstrated.
