  3ff906b66f94c4a0f3a1793bdedb197d5a98e27aafd7f4bf2e7311749f6c4baa:
    claim:
      about:
        disease:
          name: Orofaciodigital Syndrome
          disease_term:
            preferred_term: orofaciodigital syndrome
            term:
              id: MONDO:0015375
              label: orofaciodigital syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Minor Spliceosome Dysfunction and Ciliary Transcript Depletion
        genes:
        - preferred_term: SCNM1
          term:
            id: hgnc:23136
            label: SCNM1
        - preferred_term: ZRSR2
          term:
            id: hgnc:23019
            label: ZRSR2
        biological_scale: MOLECULAR
        role: trigger
        description: A second, mechanistically distinct entry route operates in the two most recently
          delineated subtypes. SCNM1 (OFD 19) and ZRSR2 (OFD 21) encode components of the minor (U12-type)
          spliceosome. Loss of function causes retention or mis-splicing of the small set of U12-type
          introns, which are enriched in ciliary and basal-body genes, so ciliary transcripts such as
          TMEM107 are depleted without any primary defect in a ciliary protein itself. The convergence
          onto the ciliary phenotype is therefore indirect but experimentally demonstrated.
        biological_processes:
        - preferred_term: minor (U12-type) pre-mRNA splicing
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: ABNORMAL
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: Notably, expression of TMEM107 and FAM92A encoding primary cilia and basal body proteins,
          respectively, and that of DERL2, ZC3H8, and C17orf75, were severely reduced in SCNM1-deficient
          cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
