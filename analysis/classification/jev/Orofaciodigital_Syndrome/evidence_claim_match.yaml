        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Hedgehog Signal Transduction and GLI Processing
        conforms_to: ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction
        biological_scale: CELLULAR
        role: central_effector
        description: Hedgehog pathway components traffic through the ciliary compartment, where full-length
          GLI2 and GLI3 are proteolytically processed into repressor forms. A defective cilium perturbs
          this processing and shifts the activator to repressor ratio, so Hedgehog output is not simply
          reduced but deranged, and can be excessive in tissues such as the facial mesenchyme. Because
          Hedgehog patterns both the cranial neural crest derivatives and the limb bud, this single signaling
          lesion generates the oral-facial and the digital arms of the phenotype together.
        biological_processes:
        - preferred_term: Hedgehog (smoothened) signaling pathway
          term:
            id: GO:0007224
            label: smoothened signaling pathway
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Our findings suggest that ciliopathic facial phenotypes are generated via loss of both
          GLI3R and GLI2R and that this pathology occurs via a de-repression mechanism.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27802276
      reference_title: Craniofacial Ciliopathies Reveal Specific Requirements for GLI Proteins during
        Development of the Facial Midline.
      evidence_source: MODEL_ORGANISM
      explanation: Identifies loss of GLI repressor forms, that is de-repression rather than simple pathway
