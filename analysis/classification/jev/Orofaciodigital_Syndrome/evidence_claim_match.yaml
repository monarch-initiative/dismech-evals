        conforms_to: ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction
        biological_scale: CELLULAR
        role: central_effector
        description: Hedgehog pathway components traffic through the ciliary compartment, where full-length
          GLI2 and GLI3 are proteolytically processed into repressor forms. A defective cilium perturbs
          this processing and shifts the activator to repressor ratio, so Hedgehog output is not simply
          reduced but deranged, and can be excessive in tissues such as the facial mesenchyme. Because
          Hedgehog patterns both the cranial neural crest derivatives and the limb bud, this single signaling
          lesion generates the oral-facial and the digital arms of the phenotype together.
        biological_processes:
        - preferred_term: Hedgehog (smoothened) signaling pathway
          term:
            id: GO:0007224
            label: smoothened signaling pathway
          modifier: DYSREGULATED
      selected_evidence:
        snippet: functional analysis in SCNM1-retrotransduced fibroblasts showed that SCNM1 is a positive
          mediator of Hedgehog (Hh) signaling
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
