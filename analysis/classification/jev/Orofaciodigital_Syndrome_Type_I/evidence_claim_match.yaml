          males with mosaic or hypomorphic variants have been reported.

          '
      selected_evidence:
        snippet: Oral-facial-digital syndrome type 1 (OFD1) is characterised by an X linked dominant mode
          of inheritance with lethality in males
        supports: SUPPORT
