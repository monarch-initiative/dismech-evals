              label: orofaciodigital syndrome I
        context: []
      assertion_type: Genetic
      assertion:
        name: OFD1 Hypomorphic Alleles (Isolated X-Linked Retinitis Pigmentosa, RP23)
        association: Allelic non-syndromic phenotype
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: OFD1
          term:
            id: hgnc:2567
            label: OFD1
        notes: The far end of the OFD1 allelic series, recorded here to keep the boundary of this entry
          explicit rather than to extend it. RP23 (MONDO:0010320, OMIM:300424) is isolated X-linked retinitis
          pigmentosa in hemizygous males, caused by a deep intronic OFD1 variant that activates a cryptic
          exon while still permitting substantial correctly spliced transcript. Because residual OFD1
          dosage is preserved the allele is not male-lethal, which is exactly what distinguishes it from
          the truncating alleles that cause the syndromic, male-lethal OFD I phenotype curated above.
          It is therefore a dosage-graded allelic phenotype, not an OFD I subtype, and is carried as a
          `skos:relatedMatch` mapping rather than a `has_subtypes` entry.
      selected_evidence:
        snippet: Correctly spliced OFD1 was also detected in patient-derived RNA, although at reduced
          levels (39%), hence the mutation is not male lethal.
        supports: SUPPORT
    origin:
