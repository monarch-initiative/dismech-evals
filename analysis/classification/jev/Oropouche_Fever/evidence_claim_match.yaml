      assertion_type: Pathophysiology
      assertion:
        name: OROV Genome Replication and Interferon Antagonism
        biological_scale: MOLECULAR
        description: The L-protein RdRp transcribes and replicates the genome in the cytoplasm using a
          cap-snatching mechanism, N encapsidates the segments, and the M-encoded glycoproteins assemble
          and bud at the Golgi. The non-structural NSs protein antagonizes the host type I interferon
          response, permitting early high-titre viraemia; a conserved motif at the NSs carboxy terminus
          is critical for this interferon-antagonistic activity.
        biological_processes:
        - preferred_term: viral genome replication
          term:
            id: GO:0019079
            label: viral genome replication
        - preferred_term: NSs-mediated suppression of the host type I interferon response
          term:
            id: GO:0052170
            label: symbiont-mediated suppression of host innate immune response
      selected_evidence:
        snippet: These viral protein-RNA complexes facilitate genome replication and transcription in
          the cytoplasm of infected cells. Translation occurs via a cap-snatching mechanism
        supports: SUPPORT
