      assertion_type: Pathophysiology
      assertion:
        name: Hepatotropic Infection
        biological_scale: TISSUE
        description: OROV infects the liver, producing necroinflammatory foci that progress to massive
          hepatic necrosis when the type I interferon response is lost. This hepatic injury underlies
          the rare severe and fatal human cases and raises circulating transaminases.
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: hepatocyte necrosis
          term:
            id: GO:0008219
            label: cell death
          modifier: INCREASED
        notes: Bound to the broad GO term cell death because GO:0070265 necrotic cell death is obsolete,
          GO:0097300 programmed necrotic cell death would assert regulated necroptosis that the OROV literature
          here does not establish, and GO:0006915 apoptotic process names a mechanism that the cited hepatic-necrosis
          evidence does not support.
      selected_evidence:
        snippet: In both models, OROV causes focal hepatic necrosis in mice, which progresses to massive
          necrosis and death when the Type I interferon receptor is antagonized.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
