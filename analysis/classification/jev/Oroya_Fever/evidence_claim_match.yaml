      assertion_type: Pathophysiology
      assertion:
        name: Bartonella Ribosomal Translation (Chloramphenicol Target)
        description: Bartonella bacilliformis depends on 70S-ribosome translation. Chloramphenicol binds
          the 50S subunit and blocks peptidyl transferase peptide-bond formation, arresting bacterial
          protein synthesis. This ribosomal target — shared with the alternative agent doxycycline (30S)
          — is why protein-synthesis inhibitors, not beta-lactams, anchor therapy.
        role: therapeutic_vulnerability
        conforms_to: bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome
        biological_processes:
        - preferred_term: Translation
          term:
            id: GO:0006412
            label: translation
      selected_evidence:
        snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
        supports: SUPPORT
    origin:
