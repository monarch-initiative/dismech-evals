      assertion_type: Pathophysiology
      assertion:
        name: Intracellular Niche in Erythrocytes and Endothelium (Cell-Penetrant Drug Requirement)
        description: B. bacilliformis is a facultative intracellular pathogen that invades and persists
          within erythrocytes and vascular endothelial cells. Effective therapy requires an antibiotic
          that reaches the intracellular organism; chloramphenicol and doxycycline penetrate host cells,
          whereas beta-lactams cannot — the lifestyle gating that constrains drug choice beyond the ribosomal
          target.
        role: intrinsic_resistance
        conforms_to: intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion
        biological_processes:
        - preferred_term: Biological Process Involved in Interaction with Host
          term:
            id: GO:0051701
            label: biological process involved in interaction with host
      selected_evidence:
        snippet: The intracellular location of some microorganisms allow them to resist antibiotics with
          poor ability to penetrate eukaryotic cell membranes, such as the beta-lactam compounds.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
