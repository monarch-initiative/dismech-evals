      assertion_type: Treatment
      assertion:
        name: Relowering of Serum Sodium After Overcorrection
        description: 'Rescue rather than prevention: if sodium has already been raised too fast, deliberately
          lowering it again - with desmopressin and hypotonic fluid - to bring the correction back inside
          the intended range.

          The evidence curated here is a single case report, and the entry says so rather than letting
          the mechanism''s plausibility stand in for data. A 79-year-old woman became comatose during
          overcorrection, recovered consciousness dramatically after relowering, and did not develop ODS.
          The authors relate it to rat models. One patient who did not develop a syndrome with a background
          rate under one percent cannot establish that the intervention prevented it.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Therapeutic Procedure
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
