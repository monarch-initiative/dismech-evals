  5c5ab2f47932b572c04c8b9cf8aa56430b54ef42a2a0e246fd2444e00416c39c:
    claim:
      about:
        disease:
          name: Osmotic Demyelination Syndrome
          disease_term:
            preferred_term: osmotic demyelination syndrome
            term:
              id: MONDO:0006692
              label: central pontine myelinolysis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ods_without_rapid_correction
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What causes osmotic demyelination in patients whose sodium was never corrected rapidly?
        attaches_to:
        - pathophysiology#Osmotic Stress from Asymmetric Osmolyte Reuptake
        - environmental#Rapid correction of chronic hyponatremia
        rationale: 'The meta-analysis that establishes the correction-rate association also reports that
          some patients develop ODS without rapid correction, and the absolute incidence without rapid
          correction is not zero but 0.10%. The entry''s central mechanism does not account for those
          cases.

          Several possibilities are consistent with what is curated here and are not distinguished by
          it. The osmolyte asymmetry may be steeper in some patients, so that a correction rate deemed
          safe by convention is fast for them - the review notes liver transplant recipients as a distinct
          risk group, and malnutrition and hypokalaemia are long-standing clinical associations. Alternatively
          the driver may not be sodium at all in those cases, since any osmotic shift acts on the same
          depleted cells. Or the thresholds themselves may be miscalibrated, which the 8-to-12 mmol/L
          spread across studies would be consistent with.

          A fourth possibility is named in the same meta-analysis and is the most concrete of them: the
          correction rate that is monitored may not be the correction rate that matters. Chloride is corrected
          faster than sodium in practice, because intravenous crystalloids carry a chloride concentration
          high relative to normal serum chloride, so a patient whose sodium rise stayed inside the limit
          may still have sustained a rapid chloride rise. The source is explicit that this is a hypothesis
          rather than a finding - the relationship between chloride correction and ODS risk has not been
          tested - but it is testable with data hospitals already hold, which the other three possibilities
          are not.

          Host risk factors are the other thing the rate-limit model does not accommodate. Liver disease,
          alcohol use, malnutrition, hypokalemia and hypovolemia are each overrepresented among ODS cases,
          and the first possibility above - that osmolyte asymmetry is steeper in some patients than others
          - is the natural way to read them, though nothing curated here establishes that.

          This matters beyond mechanism. Rate limits are the entire preventive strategy, and a patient
          who develops ODS inside the limit is currently unexplained by the model that sets it - while
          a third to a half of those who do develop it die or become permanently dependent.'
        proposed_experiments:
        - experiment_id: chloride_correction_rate_ods_association
          name: Retrospective association of chloride correction rate with ODS incidence
          description: Re-analyse existing hyponatremia cohorts using chloride correction rate alongside
            sodium correction rate as the exposure, to test whether cases arising inside the sodium limit
            are explained by a chloride rise outside it. The data required are already collected in routine
            care, which makes this the cheapest of the experiments proposed here and the one that would
            discriminate fastest.
        - experiment_id: osmolyte_kinetics_risk_stratification
          name: Direct measurement of brain osmolyte reuptake kinetics against correction rate
          description: Use magnetic resonance spectroscopy to track myo-inositol and other organic osmolytes
            during and after correction of chronic hyponatremia, in patients with and without the recognised
            risk factors, to test whether reuptake rate varies enough between individuals to explain cases
            arising inside the conventional limit.
      selected_evidence:
        snippet: In hyponatremia, chloride correction rate is often faster than sodium because of relatively
          higher chloride concentration in intravenous crystalloids than normal blood chloride and sodium
          concentration
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
