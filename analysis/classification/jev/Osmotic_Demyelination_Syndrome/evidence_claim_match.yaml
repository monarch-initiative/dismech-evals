        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Osmolyte Depletion in Adaptation to Chronic Hyponatremia
        biological_scale: CELLULAR
        description: 'Given time, the brain adapts to hyponatremia by losing organic osmolytes from its
          cells, and this adaptation is what permits survival at extraordinarily low serum sodium. It
          is protective, not pathological: without it, acute hyponatremia causes severe and sometimes
          fatal cerebral oedema.

          Curating the protective step as its own node is deliberate. The vulnerability that follows is
          not a separate disease process bolted on - it is this adaptation, seen from the other side.'
        cell_types:
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        biological_processes:
        - preferred_term: cellular response to osmotic stress
          term:
            id: GO:0071470
            label: cellular response to osmotic stress
      selected_evidence:
        snippet: Adaptation to severe hyponatremia is critically dependent on the loss of organic osmolytes
          from brain cells
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
