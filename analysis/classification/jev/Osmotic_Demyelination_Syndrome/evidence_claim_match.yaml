  acd56c2e0429aac358f51fd5167dae790ac3c0eb6b1c3e94cf2c40bbc953930a:
    claim:
      about:
        disease:
          name: Osmotic Demyelination Syndrome
          disease_term:
            preferred_term: osmotic demyelination syndrome
            term:
              id: MONDO:0006692
              label: central pontine myelinolysis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Osmotic Stress from Asymmetric Osmolyte Reuptake
        biological_scale: CELLULAR
        description: 'The rate-limiting asymmetry, and the mechanistic core of this disease: reuptake
          of organic osmolytes after correction is slower than their loss during adaptation. A correction
          faster than the reuptake leaves cells hypertonic relative to the restored extracellular compartment,
          and the brain areas that remain most depleted are the ones that go on to be injured.

          Note what this predicts and what it does not. It predicts that the danger scales with the rate
          of correction rather than the depth of the hyponatremia, and that chronicity is required, since
          an unadapted brain has nothing to re-accumulate. It does not predict that rapid correction is
          necessary for the syndrome.'
        biological_processes:
        - preferred_term: cellular response to osmotic stress
          term:
            id: GO:0071470
            label: cellular response to osmotic stress
          modifier: INCREASED
      selected_evidence:
        snippet: The reuptake of organic osmolytes after correction of hyponatremia is slower than the
          loss of organic osmolytes during the adaptation to hyponatremia
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
