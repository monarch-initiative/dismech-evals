      assertion:
        name: Rapid correction of chronic hyponatremia
        description: 'Iatrogenic exposure: raising serum sodium faster than the brain can re-accumulate
          organic osmolytes. Across the pooled studies, overly rapid correction was defined variously
          as more than 8 to 12 mmol/L within 24 hours.

          The association is real and it is the reason correction-rate limits exist, but the entry states
          it at the strength the evidence supports and no higher. Rapid correction roughly triples the
          odds; it is neither necessary nor sufficient.'
