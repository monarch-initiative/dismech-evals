  90a7eb3c02fa533e0e3ed479ad70d500770ea96a6b9effa55aa9f5c75c07cd30:
    claim:
      about:
        disease:
          name: Osmotic Demyelination Syndrome
          disease_term:
            preferred_term: osmotic demyelination syndrome
            term:
              id: MONDO:0006692
              label: central pontine myelinolysis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Astrocyte Death and Loss of Trophic Support for Oligodendrocytes
        role: central_effector
        biological_scale: CELLULAR
        description: 'The step that makes the rest of the chain make sense. Osmotic stress is not specific
          to oligodendrocytes, so an account that runs straight from osmotic stress to myelin loss leaves
          the cellular selectivity unexplained. In the rat model the astrocyte dies first: massive astrocyte
          death follows rapid correction and marks out the regions that will later demyelinate, before
          any myelin is lost. Oligodendrocyte injury follows from the loss of trophic communication across
          the disrupted astrocyte-oligodendrocyte network, together with the inflammation and microglial
          activation that astrocyte death triggers.

          The proximate cause of the astrocyte death has itself been characterised as a proteostasis failure
          - osmotic stress drives diffuse protein aggregation and ubiquitination, the unfolded protein
          response and ER stress, and apoptosis, occurring predominantly in astrocytes in exactly the
          regions that later demyelinate.

          Evidence tier matters here. The osmolyte asymmetry upstream and the epidemiology downstream
          are human; this cellular sequence is rat, and is curated as MODEL_ORGANISM throughout rather
          than presented as established human pathology.'
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
        - preferred_term: cellular response to osmotic stress
          term:
            id: GO:0071470
            label: cellular response to osmotic stress
          modifier: INCREASED
        locations:
        - preferred_term: pons
          term:
            id: UBERON:0000988
            label: pons
      selected_evidence:
        snippet: we found that massive astrocyte death occurred after rapid correction of hyponatremia,
          delineating the regions of future myelin loss
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
