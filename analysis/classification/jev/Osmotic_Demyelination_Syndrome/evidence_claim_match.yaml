  0c69fdb6c1c92f4df81e9e873f3a51f2951f9134761dbcfa24651b3ee5db385e:
    claim:
      about:
        disease:
          name: Osmotic Demyelination Syndrome
          disease_term:
            preferred_term: osmotic demyelination syndrome
            term:
              id: MONDO:0006692
              label: central pontine myelinolysis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Oligodendrocyte Death and Demyelination
        biological_scale: TISSUE
        description: 'Apoptosis and loss of myelin under osmotic stress, distributed by cell content rather
          than by vascular territory: the regions richest in oligodendrocytes and myelin are the ones
          most frequently affected. That distribution is why the central pons is the signature site and
          why extrapontine involvement accompanies it rather than competing with it - the two are the
          same lesion in different places, which is why the umbrella term exists.

          The demyelination is non-inflammatory. Neurons and axons are relatively spared, which is the
          histological basis for the observation that survivors can recover substantially despite dramatic
          acute imaging.'
        cell_types:
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        biological_processes:
        - preferred_term: central nervous system myelination
          term:
            id: GO:0022010
            label: central nervous system myelination
          modifier: DECREASED
      selected_evidence:
        snippet: The pathophysiology of ODS consists of cerebral apoptosis and loss of myelin due to osmotic
          stress. Accordingly, brain areas that are rich in oligodendrocytes and myelin tend to be the
          most frequently affected
        supports: SUPPORT
