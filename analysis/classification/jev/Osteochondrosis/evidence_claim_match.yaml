  0a99e2358d1bb98e9235f06528c3d85cc45fa5d9bf767f1e3044b29ccfae2f54:
    claim:
      about:
        disease:
          name: Osteochondrosis
          disease_term:
            preferred_term: osteochondrosis
            term:
              id: MONDO:0018381
              label: osteochondrosis
        context:
        - path: /has_subtypes/1
          value:
            name: Osgood-Schlatter Disease
            display_name: Osgood-Schlatter Disease (Tibial Tuberosity)
            subtype_term:
              preferred_term: Osgood-Schlatter disease
              term:
                id: MONDO:0004241
                label: Osgood-Schlatter disease
            description: 'Traction apophysitis of the tibial tuberosity, the prototypical member of the
              non-articular apophyseal osteochondrosis family. It is the most common knee osteochondrosis
              in sport-practicing children and adolescents, with reported prevalence around 9.8% and bilateral
              involvement in 20-30% of affected individuals. Onset coincides with appearance of the tibial
              tuberosity secondary ossification center and is linked to sports with an explosive/jumping
              component; the mechanism is repetitive tensile traction at the patellar tendon insertion
              rather than primary ischemia.

              '
          role: subtype
        - path: /has_subtypes/2
          value:
            name: Sever Disease
            display_name: Sever Disease (Calcaneal Apophysis)
            subtype_term:
              preferred_term: Sever disease (calcaneal apophysitis)
            description: 'Traction apophysitis of the calcaneal apophysis at the Achilles tendon insertion,
              the second member of the non-articular apophyseal family. No MONDO term currently exists
              for this concept (OLS/Ontobee search returns no MONDO hit), so this subtype is modeled with
              a free-text `subtype_term.preferred_term` only. It is a common cause of heel pain in children
              and young athletes aged 8 to 15 with immature skeletons, arising from repetitive microtrauma
              to the secondary ossification center by traction of the Achilles tendon insertion, often
              compounded by triceps-surae tightness from a growth-rate mismatch between bone and muscle-tendon
              length.

              '
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Repetitive Traction Apophysitis
        biological_scale: TISSUE
        subtypes:
        - Osgood-Schlatter Disease
        - Sever Disease
        description: 'In the non-articular apophyseal osteochondrosis family, the mechanism is NOT primary
          ischemia. A traction apophysis is a secondary ossification center at a tendon insertion (the
          tibial tuberosity for the patellar tendon in Osgood-Schlatter disease; the calcaneal apophysis
          for the Achilles tendon in Sever disease). Repetitive, forceful traction from running/jumping
          sports during a rapid growth spurt — often compounded by relative muscle-tendon tightness outpacing
          bone growth — causes chronic microtrauma, inflammation, and disordered ossification at the unfused
          apophysis, distinct from the ischemic mechanism of the articular family.

          '
        biological_processes:
        - preferred_term: Response to mechanical stimulus (tendon traction)
          term:
            id: GO:0009612
            label: response to mechanical stimulus
        - preferred_term: Endochondral ossification (secondary ossification center)
          modifier: DYSREGULATED
          term:
            id: GO:0001958
            label: endochondral ossification
        locations:
        - preferred_term: Tibial tuberosity
          term:
            id: UBERON:7500062
            label: tibial tuberosity
        - preferred_term: Calcaneal apophysis
          term:
            id: UBERON:0001450
            label: calcaneus
        - preferred_term: Calcaneal (Achilles) tendon insertion
          term:
            id: UBERON:0003701
            label: calcaneal tendon
      selected_evidence:
        snippet: It often results from acute or chronic overload during sports activity, causing inflammation
          of the patellar tendon insertion on the tibial tuberosity
        supports: SUPPORT
