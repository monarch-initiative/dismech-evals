              osteochondrosis family: failure of epiphyseal cartilage-canal blood supply causes focal
              chondronecrosis and a delay in endochondral ossification (osteochondrosis), which can subsequently
              progress to pathological cartilage fracture (osteochondritis dissecans).

              '
