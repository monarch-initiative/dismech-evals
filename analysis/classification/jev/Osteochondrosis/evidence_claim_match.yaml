        name: Scheuermann Kyphosis
        display_name: Scheuermann Kyphosis (Vertebral Ring Apophyses)
        subtype_term:
          preferred_term: Scheuermann kyphosis
          term:
            id: MONDO:0008410
            label: Scheuermann disease
        description: 'Structural thoracic kyphosis of the physeal/endplate osteochondrosis family, diagnosed
          radiographically by Sorensen''s criteria (at least three consecutive vertebrae wedged by five
          degrees or more at the apex of the deformity). Population prevalence is approximately 2.8% (2.1%
          in women, 3.6% in men), and a Danish twin-registry study estimated heritability at 74%, indicating
          a major genetic contribution distinct from the primarily biomechanical apophyseal family. Unlike
          Legg-Calve-Perthes disease, Osgood-Schlatter disease, and Sever disease, this subtype is not
          driven by vascular ischemia or tendon traction but by compressive failure of the cartilaginous
          vertebral endplate and ring apophysis.

          '
      selected_evidence:
        snippet: the overall prevalence of Scheuermann disease was 2.8%, with a prevalence of 2.1% among
          women and 3.6% among men
        supports: SUPPORT
