          organisms, generalize to all sites and severities of human articular osteochondrosis, or only
          to the specific predilection sites and ages examined so far?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Cartilage-Canal Ischemic Chondronecrosis
        rationale: The causal experiment for cartilage-canal vessel failure -> ischemic chondronecrosis
          -> osteochondrosis -> osteochondrosis dissecans was performed by surgically transecting vessels
          in the femoro-patellar joint of foals (PMID:23428601), an equine model with different growth-plate
          biology, cartilage-canal anatomy, and loading regime than the pediatric human knee/hip/foot.
          The strongest human bridging evidence (PMID:30248503) is limited to CT/histology of pediatric
          knee predilection sites in cadaveric/postmortem specimens (13 children, 1 month to 11 years
          old), not living-patient longitudinal data, and to the knee specifically rather than the hip
          (Perthes), navicular (Kohler), or metatarsal head (Freiberg) sites also attributed to this mechanism.
        proposed_experiments:
        - experiment_id: exp_osteochondrosis_multisite_human_histology
          name: Multi-site human cartilage-canal histology across the articular osteochondrosis family
          description: Extend the pediatric-knee CT/histology approach (PMID:30248503) to cadaveric or
            surgical specimens from the femoral head, tarsal navicular, and second metatarsal head predilection
            sites, at ages spanning the typical clinical onset for Perthes, Kohler, and Freiberg disease
            respectively, to test whether the same ischemic-chondronecrosis signature is present at each
            site.
      selected_evidence:
        snippet: There are several similarities between OCD in animals and JOCD in children. It should
          be investigated whether JOCD also occurs due to a focal failure in the cartilage canal blood
          supply, followed by ischaemic chondronecrosis.
        supports: SUPPORT
