                id: MONDO:0017178
                label: osteochondritis dissecans
            description: 'Acquired focal lesion of subchondral bone and overlying articular cartilage,
              most commonly of the knee, elbow, or ankle, that can progress to a detached osteochondral
              fragment (loose body) and secondary osteoarthritis. Experimental (foal) and human cadaveric/CT-histology
              studies support the same ischemic-chondronecrosis mechanism as the rest of the articular
              osteochondrosis family: failure of epiphyseal cartilage-canal blood supply causes focal
              chondronecrosis and a delay in endochondral ossification (osteochondrosis), which can subsequently
              progress to pathological cartilage fracture (osteochondritis dissecans).

              '
            genes:
            - preferred_term: ACAN
              description: 'Binds only the rare autosomal dominant familial form; most osteochondritis
                dissecans is sporadic and multifactorial.

                '
              term:
                id: hgnc:319
                label: ACAN
