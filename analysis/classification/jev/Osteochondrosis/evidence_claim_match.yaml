            label: Osgood-Schlatter disease
        description: 'Traction apophysitis of the tibial tuberosity, the prototypical member of the non-articular
          apophyseal osteochondrosis family. It is the most common knee osteochondrosis in sport-practicing
          children and adolescents, with reported prevalence around 9.8% and bilateral involvement in
          20-30% of affected individuals. Onset coincides with appearance of the tibial tuberosity secondary
          ossification center and is linked to sports with an explosive/jumping component; the mechanism
          is repetitive tensile traction at the patellar tendon insertion rather than primary ischemia.

          '
      selected_evidence:
        snippet: The prevalence of OD is 9.8%, and it can be bilateral in 20–30% of patients
        supports: SUPPORT
