      assertion_type: Subtype
      assertion:
        name: Osteochondritis Dissecans
        display_name: Osteochondritis Dissecans (Articular Surface)
        subtype_term:
          preferred_term: osteochondritis dissecans
          term:
            id: MONDO:0017178
            label: osteochondritis dissecans
        description: 'Acquired focal lesion of subchondral bone and overlying articular cartilage, most
          commonly of the knee, elbow, or ankle, that can progress to a detached osteochondral fragment
          (loose body) and secondary osteoarthritis. Experimental (foal) and human cadaveric/CT-histology
          studies support the same ischemic-chondronecrosis mechanism as the rest of the articular osteochondrosis
          family: failure of epiphyseal cartilage-canal blood supply causes focal chondronecrosis and
          a delay in endochondral ossification (osteochondrosis), which can subsequently progress to pathological
          cartilage fracture (osteochondritis dissecans).

          '
        genes:
        - preferred_term: ACAN
          description: 'Binds only the rare autosomal dominant familial form; most osteochondritis dissecans
            is sporadic and multifactorial.

            '
          term:
            id: hgnc:319
            label: ACAN
        inheritance:
        - name: Autosomal dominant ACAN familial OCD
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          description: The rare ACAN-associated familial osteochondritis dissecans subtype (OMIM 165800)
            is autosomal dominant; common sporadic OCD is multifactorial (ischemic, mechanical, and polygenic
            contributors) and is not Mendelian.
      selected_evidence:
        snippet: Osteochondritis dissecans occurs most frequently in the active pediatric and young adult
          populations, commonly affecting the knee, elbow, or ankle, and may lead to premature osteoarthritis.
        supports: SUPPORT
