        - Kohler Disease
        - Freiberg Infraction
        - Osteochondritis Dissecans
        description: 'The necrotic, unossified cartilage/subchondral bone segment fails to bear load normally.
          Continued mechanical loading of the affected epiphysis or subarticular bone (e.g., the immature
          femoral head in Perthes disease, or the second metatarsal head in Freiberg infraction) leads
          to increased bone resorption relative to delayed new bone formation, producing structural weakening,
          collapse, sclerosis, flattening, and fragmentation on imaging. In the most severe articular
          presentations this culminates in pathological cartilage fracture and, in osteochondritis dissecans,
          a detached osteochondral fragment (loose body).

