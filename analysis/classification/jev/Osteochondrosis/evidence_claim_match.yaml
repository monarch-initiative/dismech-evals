        - Freiberg Infraction
        - Osteochondritis Dissecans
        description: 'In the articular/epiphyseal osteochondrosis family, blood vessels running through
          cartilage canals supply the secondary (epiphyseal) ossification center during growth. Focal
          failure or transection of these vessels causes ischemic necrosis of chondrocytes and vascular
          endothelium in the epiphyseal cartilage, before any bone is yet mineralized at that site. This
          mechanism was reproduced experimentally by surgically transecting cartilage-canal vessels in
          foals, and morphologically identical lesions (confirmed by histology to represent cartilage-canal
          blood-supply failure and ischemic chondronecrosis) were subsequently identified at the predilection
          sites for juvenile osteochondritis dissecans in human pediatric knee specimens.

