        context: []
      assertion_type: Subtype
      assertion:
        name: Sever Disease
        display_name: Sever Disease (Calcaneal Apophysis)
        subtype_term:
          preferred_term: Sever disease (calcaneal apophysitis)
        description: 'Traction apophysitis of the calcaneal apophysis at the Achilles tendon insertion,
          the second member of the non-articular apophyseal family. No MONDO term currently exists for
          this concept (OLS/Ontobee search returns no MONDO hit), so this subtype is modeled with a free-text
          `subtype_term.preferred_term` only. It is a common cause of heel pain in children and young
          athletes aged 8 to 15 with immature skeletons, arising from repetitive microtrauma to the secondary
          ossification center by traction of the Achilles tendon insertion, often compounded by triceps-surae
          tightness from a growth-rate mismatch between bone and muscle-tendon length.

          '
      selected_evidence:
        snippet: Sever disease results from repetitive microtrauma to the secondary ossification center
          by traction of the Achilles tendon insertion on the calcaneus.
        supports: SUPPORT
