    claim:
      about:
        disease:
          name: Osteochondrosis
          disease_term:
            preferred_term: osteochondrosis
            term:
              id: MONDO:0018381
              label: osteochondrosis
        context:
        - path: /has_subtypes/6
          value:
            name: Osteochondritis Dissecans
            display_name: Osteochondritis Dissecans (Articular Surface)
            subtype_term:
              preferred_term: osteochondritis dissecans
              term:
                id: MONDO:0017178
                label: osteochondritis dissecans
            description: 'Acquired focal lesion of subchondral bone and overlying articular cartilage,
              most commonly of the knee, elbow, or ankle, that can progress to a detached osteochondral
              fragment (loose body) and secondary osteoarthritis. Experimental (foal) and human cadaveric/CT-histology
              studies support the same ischemic-chondronecrosis mechanism as the rest of the articular
              osteochondrosis family: failure of epiphyseal cartilage-canal blood supply causes focal
              chondronecrosis and a delay in endochondral ossification (osteochondrosis), which can subsequently
              progress to pathological cartilage fracture (osteochondritis dissecans).

              '
            genes:
            - preferred_term: ACAN
              description: 'Binds only the rare autosomal dominant familial form; most osteochondritis
                dissecans is sporadic and multifactorial.

                '
              term:
                id: hgnc:319
                label: ACAN
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Aggrecan G3-Domain Defect in Familial Osteochondritis Dissecans
        biological_scale: MOLECULAR
        subtypes:
        - Osteochondritis Dissecans
        description: 'A rare autosomal dominant form of osteochondritis dissecans is caused by missense
          variants clustered in the C-type lectin repeat of the aggrecan G3 domain. The variant proteoglycan
          is secreted less efficiently than wild-type and binds cartilage extracellular matrix ligands
          less well, so the initiating lesion is a defective matrix component rather than the cartilage-canal
          vascular failure that underlies the sporadic articular osteochondroses.

          '
        genes:
        - preferred_term: ACAN
          term:
            id: hgnc:319
            label: ACAN
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: Functional studies showed that neither recombinant variant proteins, nor full-length
          variant aggrecan proteoglycan from heterozygous patient cartilage, were secreted to the same
          level as wild-type aggrecan. The variant proteins also showed decreased binding to known cartilage
          extracellular matrix ligands.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
