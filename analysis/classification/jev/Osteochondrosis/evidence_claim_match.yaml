        snippet: the immature femoral head is mechanically weakened following ischemic necrosis. Increased
          bone resorption and delayed new bone formation, in combination with continued mechanical loading
          of the hip, contribute to the pathogenesis of the femoral head deformity.
        supports: SUPPORT
