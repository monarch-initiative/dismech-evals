      assertion:
        name: Cartilage-Canal Ischemic Chondronecrosis
        conforms_to: ischemic_bone_necrosis_and_repair#Epiphyseal Cartilage-Canal Ischemic Chondronecrosis
        biological_scale: CELLULAR
        subtypes:
        - Legg-Calve-Perthes Disease
        - Kohler Disease
        - Freiberg Infraction
        - Osteochondritis Dissecans
        description: 'In the articular/epiphyseal osteochondrosis family, blood vessels running through
          cartilage canals supply the secondary (epiphyseal) ossification center during growth. Focal
          failure or transection of these vessels causes ischemic necrosis of chondrocytes and vascular
          endothelium in the epiphyseal cartilage, before any bone is yet mineralized at that site. This
          mechanism was reproduced experimentally by surgically transecting cartilage-canal vessels in
          foals, and morphologically identical lesions (confirmed by histology to represent cartilage-canal
          blood-supply failure and ischemic chondronecrosis) were subsequently identified at the predilection
          sites for juvenile osteochondritis dissecans in human pediatric knee specimens.

          '
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        - preferred_term: Growth plate cartilage chondrocyte
          term:
            id: CL:1000217
            label: growth plate cartilage chondrocyte
        biological_processes:
        - preferred_term: Response to hypoxia (cartilage-canal ischemia)
          term:
            id: GO:0001666
            label: response to hypoxia
        - preferred_term: Chondrocyte and vascular endothelial cell death
          modifier: INCREASED
          term:
            id: GO:0008219
            label: cell death
        locations:
        - preferred_term: Epiphyseal cartilage canal
          term:
            id: UBERON:0001437
            label: epiphysis
        - preferred_term: Subchondral region of epiphysis
          term:
            id: UBERON:0035878
            label: subchondral region of epiphysis
      selected_evidence:
        snippet: Transection of blood vessels within epiphyseal cartilage canals resulted in necrosis
          of vessels and chondrocytes, i.e., ischaemic chondronecrosis, in foals.
        supports: SUPPORT
