              term:
                id: MONDO:0008410
                label: Scheuermann disease
            description: 'Structural thoracic kyphosis of the physeal/endplate osteochondrosis family,
              diagnosed radiographically by Sorensen''s criteria (at least three consecutive vertebrae
              wedged by five degrees or more at the apex of the deformity). Population prevalence is approximately
              2.8% (2.1% in women, 3.6% in men), and a Danish twin-registry study estimated heritability
              at 74%, indicating a major genetic contribution distinct from the primarily biomechanical
              apophyseal family. Unlike Legg-Calve-Perthes disease, Osgood-Schlatter disease, and Sever
              disease, this subtype is not driven by vascular ischemia or tendon traction but by compressive
              failure of the cartilaginous vertebral endplate and ring apophysis.

              '
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Compressive Vertebral Endplate Growth Failure
        biological_scale: TISSUE
        subtypes:
        - Scheuermann Kyphosis
        description: 'In the physeal/endplate osteochondrosis family, excessive mechanical (compressive)
          loading impairs growth of the cartilaginous vertebral endplate and ring apophysis at the thoracic
          spine, distinct from both the ischemic mechanism of the articular family and the tensile-traction
          mechanism of the apophyseal family. This is associated with Schmorl''s node formation (nucleus
          pulposus herniation through a weakened endplate), disruption of the ring apophysis, and compromised
          intervertebral disc integrity. A shortened sternum has also been proposed to increase anterior
          compressive force on the vertebral endplates, though this remains a single-study hypothesis.

          '
        biological_processes:
        - preferred_term: Growth plate cartilage development (vertebral endplate)
          modifier: DECREASED
          term:
            id: GO:0003417
            label: growth plate cartilage development
        - preferred_term: Response to mechanical stimulus (compressive loading)
          term:
            id: GO:0009612
            label: response to mechanical stimulus
        locations:
        - preferred_term: Vertebral ring apophysis / endplate
          term:
            id: UBERON:0002347
            label: thoracic vertebra
        - preferred_term: Vertebral growth plate cartilage
          term:
            id: UBERON:0004129
            label: growth plate cartilage
      selected_evidence:
        snippet: excessive mechanical loading as a major contributor to defective growth of the cartilaginous
          vertebral endplate. This is associated with the formation of Schmorl's nodes, disruption of
          the ring apophysis, and compromised intervertebral disc integrity
        supports: SUPPORT
