              for adolescent athletic females, though it has been reported across a wide age range. Like
              other members of the articular family it is generally self-limited when treated early, resolving
              with nonoperative management.

              '
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Revascularization and Remodeling under Mechanical Load
        conforms_to: ischemic_bone_necrosis_and_repair#Resorption-Dominant Revascularization and Creeping
          Substitution
        biological_scale: TISSUE
        subtypes:
        - Legg-Calve-Perthes Disease
        - Kohler Disease
        - Freiberg Infraction
        description: 'The articular osteochondrosis family is characteristically self-limited: revascularization
          delivers chondroclasts/osteoclasts and granulation tissue that remove necrotic tissue while
          new bone formation proceeds, under the influence of ongoing mechanical loading of the growing
          epiphysis. Outcome depends on the balance between repair and load — a spherical, congruent joint
          surface if repair keeps pace, or residual flattening/ deformity and premature secondary osteoarthritis
          if mechanical failure outpaces repair.

          '
        biological_processes:
        - preferred_term: Sprouting angiogenesis
          term:
            id: GO:0002040
            label: sprouting angiogenesis
        - preferred_term: Bone remodeling
          term:
            id: GO:0046849
            label: bone remodeling
      selected_evidence:
        snippet: If treated early, osteochondroses such as Freiberg disease are essentially self-limiting,
          often resolving with nonoperative management.
        supports: SUPPORT
