  da3174cce847cc0565d2d532b2f1c770a05ff72051d6b5c009be196c7319d7aa:
    claim:
      about:
        disease:
          name: Osteofibrous Dysplasia
          disease_term:
            preferred_term: osteofibrous dysplasia
            term:
              id: MONDO:0011806
              label: osteofibrous dysplasia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ofd_adamantinoma_progression_sequence
        prompt: Does osteofibrous dysplasia progress through an OFD-like adamantinoma intermediate to
          classic adamantinoma along a single histogenetic continuum, or are these diagnostically overlapping
          but biologically separate entities?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Osteogenic Differentiation of Skeletal Progenitors
        - histopathology#Scattered keratin-immunoreactive cells
        - differential_diagnoses#Classic adamantinoma
        rationale: 'The same question is recorded from the other side as adam_ofd_progression_sequence
          in Adamantinoma.yaml, and it is restated here so the gap is visible from both entries rather
          than only from the neoplasm.

          Evidence points both ways, and this entry''s scoping decision rests on the weaker-committing
          reading, so the counter-position is stated rather than omitted. For separation: a genomic study
          of all three entities found arm-level copy-number gains in the classic adamantinomas and none
          in the OFDs, and concluded they might be genetically distinct; and a 19-case series saw no progression
          over a median 51 months. For a continuum: OFD contains scattered keratin-immunoreactive cells,
          pan-keratin is positive in roughly 95% of both lesions, clonal chromosomal abnormalities including
          trisomies 7, 8, 12 and 22 have been reported in OFD and argued to indicate a clonal and possibly
          neoplastic origin, with trisomy 7 and 12 also reported in a clonally aberrant adamantinoma;
          and MONDO''s own definition of this term ends by noting that progression to adamantinoma has
          been reported in some cases.'
      selected_evidence:
        snippet: these findings demonstrate a clonal and possibly neoplastic origin for osteofibrous dysplasia
          of long bone
        supports: REFUTE
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8156503
      reference_title: Clonal chromosomal abnormalities in osteofibrous dysplasia. Implications for histopathogenesis
        and its relationship with adamantinoma.
      evidence_source: HUMAN_CLINICAL
      explanation: Recorded as REFUTE against this entry's framing of OFD as a developmental disorder
        rather than a neoplasm. Graded INDIRECT because clonality is evidence from which neoplastic origin
        is inferred, and the authors say "possibly". This is the strongest cited argument against the
        scoping decision and is curated rather than left out.
