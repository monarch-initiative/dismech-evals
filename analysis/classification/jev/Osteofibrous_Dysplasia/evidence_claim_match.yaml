    evidence_metadata:
      reference: PMID:36875508
      reference_title: A case of neonatal osteofibrous dysplasia with novel CDK12 and DDR2 mutations.
      evidence_source: HUMAN_CLINICAL
      explanation: Recorded against overreading the MET association. Outside the familial MET cases no
        other genetic cause is established, and the paper that identified MET itself describes OFD as
        typically sporadic, so MET explains the familial and bilateral minority rather than the disease
        in general. The same report describes novel CDK12 and DDR2 variants in a neonate, and PMID:42379271
        found single-case KMT2A, KMT2D, PHOX2B and RIF1 changes across five OFDs; none is curated as causal
        here.
