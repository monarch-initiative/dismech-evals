      assertion_type: Pathophysiology
      assertion:
        name: Stabilised METdeltaJMD Receptor with Ligand-Dependent Gain of Function
        biological_scale: MOLECULAR
        description: The juxtamembrane domain carries the signal for ubiquitin-mediated degradation. Without
          it the receptor escapes turnover, accumulates, and acquires a ligand-dependent gain of function.
          A somatic exon 14 mutation in unilateral disease substitutes a tyrosine residue critical for
          receptor turnover and has the same stabilising effect, which is what ties the two variant origins
          to one mechanism.
        genes:
        - preferred_term: MET
          term:
            id: hgnc:7029
            label: MET
        molecular_functions:
        - preferred_term: MET receptor tyrosine kinase activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0004714
            label: transmembrane receptor protein tyrosine kinase activity
      selected_evidence:
        snippet: MET gene mutations reducing ubiquitin-mediated protein degradation via loss of the juxtamembrane
          domain (METΔJMD) were previously identified in patients with OFD, resulting in ligand-dependent
          gain of function.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
