      assertion:
        name: MET Exon 14 Splice Exclusion
        biological_scale: MOLECULAR
        description: The causal lesion. Mutations abolish splice inclusion of MET exon 14, so the translated
          receptor lacks the cytoplasmic juxtamembrane domain. Exclusion of this exon occurs during normal
          embryonic development, so the mutation does not create a novel protein but makes a developmentally
          transient isoform permanent.
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: GAIN_OF_FUNCTION
        genes:
        - preferred_term: MET
          term:
            id: hgnc:7029
            label: MET
        biological_processes:
        - preferred_term: regulated inclusion of MET exon 14, abolished by the mutation
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0000381
            label: regulation of alternative mRNA splicing, via spliceosome
      selected_evidence:
        snippet: We identified germline mutations in MET, encoding a receptor tyrosine kinase, that segregate
          with an autosomal-dominant form of OFD in three families and a mutation in a fourth affected
          subject from a simplex family and with bilateral disease.
        supports: SUPPORT
