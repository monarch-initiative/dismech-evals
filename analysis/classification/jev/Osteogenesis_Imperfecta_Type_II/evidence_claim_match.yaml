        gene_term:
          preferred_term: COL1A1
          term:
            id: hgnc:2197
            label: COL1A1
        relationship_type: CAUSATIVE
        notes: 'Heterozygous glycine substitutions in the Gly-X-Y triple-helical domain of COL1A1 (encoding
          the pro-alpha1(I) chain, two copies of which assemble into each type I procollagen heterotrimer)
          are the predominant cause of perinatal lethal OI type II. Mutations closer to the C-terminus
          tend to be more severe due to C-to-N triple-helix propagation.

          '
      selected_evidence:
        snippet: Perinatal lethal osteogenesis imperfecta is the result of heterozygous mutations of the
          COL1A1 and COL1A2 genes that encode the alpha 1(I) and alpha 2(I) chains of type I collagen,
          respectively. Point mutations resulting in the substitution of Gly residues in Gly-X-Y amino
          acid triplets of the triple helical domain of the alpha 1(I) or alpha 2(I) chains are the most
          frequent mutations.
        supports: SUPPORT
