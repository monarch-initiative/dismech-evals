        name: Impaired Bone Mineralization
        description: 'Structurally abnormal collagen prevents proper mineral deposition in bone matrix.
          The disorganized collagen fibrils cannot support normal hydroxyapatite crystal nucleation and
          growth, resulting in severe skeletal hypomineralization — diffusely decreased bone density,
          multiple prenatal fractures, and crumpled long bones with beaded ribs. This skeletal fragility
          underlies the lethal phenotype.

          '
        cell_types:
        - preferred_term: Osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: Bone Mineralization
          term:
            id: GO:0030282
            label: bone mineralization
          modifier: DECREASED
      selected_evidence:
        snippet: The collagen fibres are abnormally organised and mineralisation is impaired.
        supports: SUPPORT
