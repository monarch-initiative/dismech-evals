      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative Collagen Disruption
        description: 'Glycine substitutions in the Gly-X-Y repeat of the collagen triple helical domain
          disrupt normal helix formation. The abnormal alpha chains are incorporated into trimers, producing
          structurally defective collagen that cannot form proper fibrils (dominant-negative effect).
          This results in severe deficiency of functional bone matrix.

          '
        genes:
        - preferred_term: COL1A1
          term:
            id: hgnc:2197
            label: COL1A1
        - preferred_term: COL1A2
          term:
            id: hgnc:2198
            label: COL1A2
        molecular_functions:
        - preferred_term: extracellular matrix structural constituent conferring tensile strength
          term:
            id: GO:0030020
            label: extracellular matrix structural constituent conferring tensile strength
          modifier: DECREASED
        cell_types:
        - preferred_term: Osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: Collagen Fibril Organization
          term:
            id: GO:0030199
            label: collagen fibril organization
        - preferred_term: Ossification
          term:
            id: GO:0001503
            label: ossification
      selected_evidence:
        snippet: The mutations act in a dominant negative manner as the mutant pro alpha chains are incorporated
          into type I procollagen molecules that also contain normal pro alpha chains. The abnormal molecules
          are poorly secreted, more susceptible to degradation, and impair the formation of the extracellular
          matrix.
        supports: SUPPORT
