        name: Defective Bone Matrix and Progressive Bone Fragility
        description: Abnormally assembled type I collagen fibrils reduce extracellular matrix integrity
          and impair mineralization, producing bone that is brittle and structurally weak. Osteoblasts
          incorporating mutant procollagen molecules secrete collagen fibres that are abnormally organised
          and where mineral deposition is impaired. Markedly reduced bone mineral density for age and
          thinned cortices underlie the severe bone fragility that manifests as recurrent fractures beginning
          at or near birth in type III OI.
        cell_types:
        - preferred_term: Osteoblast
          term:
