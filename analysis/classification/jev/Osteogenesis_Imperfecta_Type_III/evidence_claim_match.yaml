      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        description: Collagen I-related osteogenesis imperfecta is often autosomal dominant, with many
          severe cases arising from de novo variants.
      selected_evidence:
        snippet: Most babies have their own private de novo mutation. However, the recurrence rate is
          about 7% owing to germline mosaicism in one parent. The mutations act in a dominant negative
          manner as the mutant pro alpha chains are incorporated into type I procollagen molecules that
          also contain normal pro alpha chains.
        supports: SUPPORT
