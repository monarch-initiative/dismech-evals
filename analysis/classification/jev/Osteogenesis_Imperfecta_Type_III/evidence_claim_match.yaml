            label: COL1A1
        notes: Heterozygous structural variants in COL1A1, predominantly glycine substitutions in the
          Gly-X-Y triple-helical domain or exon-splicing defects, act in a dominant-negative manner as
          mutant pro-alpha chains are incorporated into type I procollagen molecules. Alterations in the
          alpha1(I) chain (COL1A1) tend to produce a more severe phenotype than equivalent alterations
          in COL1A2, and mutation type and location along the alpha chain influence clinical severity.
      selected_evidence:
        snippet: The severity of the clinical phenotype appears to be related to the type of mutation,
          its location in the alpha chain, the surrounding amino acid sequences, and the level of expression
          of the mutant allele.
        supports: SUPPORT
