        snippet: 'These patients underwent posterior spinal fusion between 2008 and 2020 and completed
          a minimum follow-up of 2 years. We measured radiographic parameters at each visit and reviewed
          the incidence of complications. A mixed-effects model was used to evaluate changes in radiographic
          parameters from preoperative measurements to the first and latest follow-ups. RESULTS: The patient
          cohort consisted of 2 individuals with type I OI, 20 with type III, 6 with type IV, and 2 with
          other types (types V and VIII). Surgical intervention led to a notable improvement in the major
          curve magnitude from 76° to 36°, with no notable correction loss.'
