      assertion:
        name: Autosomal Recessive Collagen Modification Osteogenesis Imperfecta (Types VII and VIII)
        description: Severe and lethal autosomal recessive forms of OI (types VII and VIII, estimated
          to cause 5% of OI in North America) result from null mutations in CRTAP or P3H1 affecting the
          endoplasmic reticulum collagen prolyl 3-hydroxylation modification complex. Because metaphyseal
          popcorn calcifications occur in both dominant collagen structural defects (type III) and recessive
          collagen modification defects (types VII and VIII), molecular genetic testing is required to
          distinguish them.
        distinguishing_features:
        - Null mutations in CRTAP (type VII) or P3H1 (type VIII) affecting the collagen prolyl 3-hydroxylation
          modification complex rather than heterozygous COL1A1/COL1A2 structural mutations
        - Autosomal recessive inheritance (estimated to cause 5% of OI in North America)
      selected_evidence:
        snippet: These data demonstrate that popcorn calcifications are a frequent feature of severe OI,
          but do not distinguish cases with defects in collagen structure (primarily dominant type III
          OI) or modification (recessive type VIII OI).
        supports: SUPPORT
