      assertion_type: Diagnosis
      assertion:
        name: Radiographic and Molecular Diagnosis
        description: Osteogenesis imperfecta type V is diagnosed from its distinctive radiographic hallmarks
          (calcification of the forearm interosseous membrane, radial head dislocation, a dense metaphyseal
          band, and hyperplastic callus) and confirmed by detection of the recurrent IFITM5 5'-UTR variant
          on molecular genetic testing. Unlike types I-IV, OI type V is not COL1A1/COL1A2-related. Hyperplastic
          callus should be evaluated in the OI type V context because it can mimic osteosarcoma; diagnostic
          decisions should integrate fracture history, imaging, IFITM5 testing, and longitudinal behavior
          before aggressive oncologic procedures.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: OI type V is an autosomal-dominant disease characterized by calcification of the forearm
          interosseous membrane, radial head dislocation, a subphyseal metaphyseal radiodense line, and
          hyperplastic callus formation
        supports: SUPPORT
