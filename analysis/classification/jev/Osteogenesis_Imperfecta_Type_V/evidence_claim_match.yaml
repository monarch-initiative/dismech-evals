        context: []
      assertion_type: Genetic
      assertion:
        name: IFITM5 c.-14C>T Mutation
        association: Causative
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: IFITM5
          term:
            id: hgnc:16644
            label: IFITM5
          modifier: GAIN_OF_FUNCTION
        notes: 'A single recurrent mutation (c.-14C>T) in the 5''UTR of IFITM5 causes all cases of OI
          type V. This creates an upstream AUG start codon, resulting in an extended protein with 5 additional
          N-terminal amino acids (MALEP). This is a gain-of-function mechanism distinct from the collagen
          defects in classical OI.

          '
      selected_evidence:
        snippet: Using linkage analysis in a four-generation family and whole-exome sequencing, we identified
          a heterozygous mutation of c.-14C>T in the 5'-untranslated region of a gene encoding interferon-induced
          transmembrane protein 5 (IFITM5). It completely cosegregated with the disease in three families
          and occurred de novo in five simplex individuals.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22863190
      reference_title: A single recurrent mutation in the 5'-UTR of IFITM5 causes osteogenesis imperfecta
        type V.
      evidence_source: HUMAN_CLINICAL
      explanation: Landmark paper identifying the single recurrent IFITM5 c.-14C>T mutation as the cause
        of all OI type V cases.
