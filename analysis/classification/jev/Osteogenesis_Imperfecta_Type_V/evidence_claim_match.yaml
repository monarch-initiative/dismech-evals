  8ef889562be9dcf027f2905cf0c8bc360c23b31c7e4e1706a9a4e844c7c090e3:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type V
          disease_term:
            preferred_term: Osteogenesis imperfecta type V
            term:
              id: MONDO:0012591
              label: osteogenesis imperfecta type 5
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: IFITM5 Gain-of-Function
        description: 'The c.-14C>T mutation creates an upstream start codon, producing an IFITM5 protein
          with 5 additional N-terminal amino acids. This altered protein disrupts normal bone mineralization
          and matrix organization, leading to the characteristic histological and clinical features. IFITM5
          (BRIL) is an osteoblast-specific protein involved in mineralization.

          '
        genes:
        - preferred_term: IFITM5
          term:
            id: hgnc:16644
            label: IFITM5
          modifier: GAIN_OF_FUNCTION
        cell_types:
        - preferred_term: Osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: Bone Mineralization
          term:
            id: GO:0030282
            label: bone mineralization
        - preferred_term: Osteoblast Differentiation
          term:
            id: GO:0001649
            label: osteoblast differentiation
      selected_evidence:
        snippet: Transfection of wild-type and mutant IFITM5 constructs revealed that the mutation added
          five amino acids (Met-Ala-Leu-Glu-Pro) to the N terminus of IFITM5. Given that IFITM5 expression
          and protein localization is restricted to the skeletal tissue and IFITM5 involvement in bone
          formation, we conclude that this recurrent mutation would have a specific effect on IFITM5 function.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
