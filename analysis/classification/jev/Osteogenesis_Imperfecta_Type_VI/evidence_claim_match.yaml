              id: MONDO:0013515
              label: osteogenesis imperfecta type 6
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical, Histological, and Molecular Diagnosis
        description: OI type VI is suspected from the OI phenotype combined with its distinguishing features
          — post-natal fracture onset, white or faintly blue sclerae, absent dentinogenesis imperfecta
          and hearing loss, and elevated childhood serum alkaline phosphatase. Historically the diagnosis
          rested on the "fish-scale" polarized-light pattern and hyperosteoidosis on iliac crest bone
          biopsy. Since 2011, confirmation is by demonstrating biallelic SERPINF1 variants (or undetectable
          serum PEDF), which distinguishes OI type VI from collagen-related and other recessive OI forms.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: Qualitative histology of iliac crest bone biopsy specimens showed an absence of the birefringent
          pattern of normal lamellar bone under polarized light, often with a "fish-scale" pattern.
        supports: SUPPORT
