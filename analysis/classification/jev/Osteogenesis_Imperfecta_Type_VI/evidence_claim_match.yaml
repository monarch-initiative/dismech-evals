  32d143ad5d057e89fc431eeb50372daeb94fcb0339c99683e33c095b963f014e:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type VI
          disease_term:
            preferred_term: Osteogenesis imperfecta type 6
            term:
              id: MONDO:0013515
              label: osteogenesis imperfecta type 6
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Osteoblast Function and Defective Matrix Mineralization
        description: PEDF suppresses osteocyte expression of sclerostin (SOST) and other osteocyte genes
          through ERK/GSK-3beta/beta-catenin signaling, supporting Wnt-dependent osteoblast function and
          orderly matrix mineralization. Without PEDF, sclerostin is derepressed and Wnt signaling is
          disturbed, osteoblasts fail to mineralize matrix normally, and unmineralized osteoid accumulates
          with a prolonged mineralization lag time. The disorganized lamellae produce the characteristic
          polarized-light "fish-scale" pattern.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: osteocyte
          term:
            id: CL:0000137
            label: osteocyte
        biological_processes:
        - preferred_term: regulation of osteoblast differentiation
          term:
            id: GO:0045667
            label: regulation of osteoblast differentiation
          modifier: DYSREGULATED
        - preferred_term: canonical Wnt signaling pathway
          term:
            id: GO:0060070
            label: canonical Wnt signaling pathway
          modifier: DECREASED
        - preferred_term: bone mineralization
          term:
            id: GO:0030282
            label: bone mineralization
          modifier: DECREASED
      selected_evidence:
        snippet: LTD cells synthesized Sclerostin, matrix extracellular phosphoglycoprotein (MEPE) and
          dentin matrix protein (DMP-1) and their synthesis was reduced by treatment with PEDF.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
