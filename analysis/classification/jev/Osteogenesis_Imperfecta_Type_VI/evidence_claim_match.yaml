      assertion_type: Genetic
      assertion:
        name: SERPINF1 Loss-of-Function Mutations
        association: Causative
        gene_term:
          preferred_term: SERPINF1 (PEDF)
          term:
            id: hgnc:8824
            label: SERPINF1
        notes: Biallelic loss-of-function variants in SERPINF1 (17p13.3), encoding pigment epithelium-derived
          factor (PEDF), cause OI type VI. Most are truncating (nonsense/frameshift) null alleles; rarer
          in-frame deletions/insertions cause ER retention of misfolded PEDF. SERPINF1-related OI is recessive
          with complete penetrance for biallelic null alleles.
      selected_evidence:
        snippet: Hence, loss of pigment epithelium-derived factor function constitutes a novel mechanism
          for OI and shows its involvement in bone mineralization.
        supports: SUPPORT
