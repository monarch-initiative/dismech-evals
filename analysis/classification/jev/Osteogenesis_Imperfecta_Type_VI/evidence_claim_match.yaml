              id: MONDO:0013515
              label: osteogenesis imperfecta type 6
        context: []
      assertion_type: Treatment
      assertion:
        name: Denosumab (Anti-RANKL Antibody)
        description: 'Denosumab, a monoclonal antibody against RANKL, directly targets the increased osteoclastic
          bone resorption that drives OI type VI, and is the mechanism-directed treatment of choice. In
          children with OI type VI, two years of denosumab increased bone mineral density, normalized
          vertebral shape, improved mobility, and reduced fracture rate. The short-acting, reversible
          anti-resorptive effect carries a rebound risk: abrupt discontinuation or end-of-interval offset
          can cause hyper-resorptive rebound with symptomatic hypercalcemia, which can be mitigated by
          alternating denosumab with a long-acting bisphosphonate (zoledronic acid).'
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: denosumab
            term:
              id: NCIT:C61313
              label: Denosumab
      selected_evidence:
        snippet: We now present the results after 2 years of treatment and demonstrate a long term benefit
          as well as an increase of bone mineral density, a normalization of vertebral shape, an increase
          of mobility, and a reduced fracture rate.
        supports: SUPPORT
    origin:
