  1b05ddb936f18606d48eda3bdfd468c2dac93f46cb8918c70e3e2aeca34b0b8d:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type VI
          disease_term:
            preferred_term: Osteogenesis imperfecta type 6
            term:
              id: MONDO:0013515
              label: osteogenesis imperfecta type 6
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SERPINF1 Loss of Function Abolishes PEDF Secretion
        description: Biallelic loss-of-function variants in SERPINF1 abolish secretion of pigment epithelium-derived
          factor (PEDF), a secreted serpin-family glycoprotein normally produced by osteoblasts and osteocytes.
          Most pathogenic alleles are truncating (nonsense/frameshift) and eliminate the protein; rarer
          in-frame deletions/insertions yield a misfolded PEDF that is retained in the endoplasmic reticulum,
          triggering a stress response in osteoblastic cells. Type I collagen is normal, distinguishing
          this from the collagen-related OI types.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: endoplasmic reticulum stress response (in-frame variants)
          term:
            id: GO:0034976
            label: response to endoplasmic reticulum stress
          modifier: INCREASED
      selected_evidence:
        snippet: We describe loss of function mutations in serpin peptidase inhibitor, clade F, member
          1 (SERPINF1) in two affected members of this family and in an additional unrelated patient with
          OI type VI. SERPINF1 encodes pigment epithelium-derived factor.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
