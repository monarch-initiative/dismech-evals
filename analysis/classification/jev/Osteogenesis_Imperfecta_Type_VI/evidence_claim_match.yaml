  50479c49320a146ca3471e5d588613c20c894a42bf8d16c6c0c8780bd98fe518:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type VI
          disease_term:
            preferred_term: Osteogenesis imperfecta type 6
            term:
              id: MONDO:0013515
              label: osteogenesis imperfecta type 6
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RANKL-Mediated Osteoclast Overactivation
        conforms_to: osteoporosis_bone_resorption#Increased Osteoclastic Bone Resorption
        description: PEDF normally upregulates osteoprotegerin (OPG) in osteoblasts and directly inhibits
          RANKL-mediated osteoclast differentiation, survival, and resorptive activity. In its absence
          the OPG:RANKL balance shifts toward RANKL, driving osteoclast overactivation and increased bone
          resorption. This resorptive arm is the rationale for the efficacy of the anti-RANKL antibody
          denosumab in OI type VI, and it conforms to the conserved increased-osteoclastic-resorption
          pattern.
        cell_types:
        - preferred_term: osteoclast
          term:
            id: CL:0000092
            label: osteoclast
        biological_processes:
        - preferred_term: osteoclast differentiation
          term:
            id: GO:0030316
            label: osteoclast differentiation
          modifier: INCREASED
      selected_evidence:
        snippet: OCL differentiation, RANKL-mediated survival and bone resorption activity were inhibited
          by PEDF in a dose-dependent manner. PEDF upregulated osteoprotegerin (OPG), which naturally
          blocks OCL maturation, in primary osteoblasts and OCL precursor cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19945427
      reference_title: PEDF regulates osteoclasts via osteoprotegerin and RANKL.
      evidence_source: IN_VITRO
      explanation: Demonstrates that PEDF restrains osteoclast differentiation and resorption via OPG
        upregulation and RANKL inhibition; loss of PEDF therefore increases osteoclastic resorption.
