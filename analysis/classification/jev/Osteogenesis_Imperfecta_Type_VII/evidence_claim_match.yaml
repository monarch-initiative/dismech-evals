            term:
              id: MONDO:0012536
              label: osteogenesis imperfecta type 7
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Collagen Proteotoxicity in Severe CRTAP Variants
        description: 'Some severe CRTAP variants can generate unstable CRTAP isoforms that cause loss
          of proline hydroxylation, type I collagen aggregation, autophagy, and cellular senescence. This
          captures a severe/lethal variant mechanism rather than a uniform mechanism for every CRTAP allele.

          '
        genes:
        - preferred_term: CRTAP
          description: 'Bound to this node as well as to the hydroxylation-deficiency node because the
            claim here is allele-specific: it concerns the severe variants that yield an unstable isoform,
            not every CRTAP allele.'
          term:
            id: hgnc:2379
            label: CRTAP
        biological_processes:
        - preferred_term: protein folding
          term:
            id: GO:0006457
            label: protein folding
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
      selected_evidence:
        snippet: Both mutant isoforms of CRTAP are unstable due to the presence of a unique 'GWxxI' degron,
          which finally leads to loss of proline hydroxylation and aggregation of type I collagen. Although
          type I collagen aggregates undergo autophagy, the overall proteotoxicity resulted in death of
          the proband cells by senescence.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37146916
      reference_title: Deep intronic mutation in CRTAP results in unstable isoforms of the protein to
