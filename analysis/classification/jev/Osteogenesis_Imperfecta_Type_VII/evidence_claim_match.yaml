      assertion_type: Pathophysiology
      assertion:
        name: Osteoblast Dysfunction and Impaired Bone Formation
        description: 'CRTAP deficiency in patient osteoblasts reduces CRTAP expression and prolyl 3-hydroxylation
          of type I collagen, with reduced osteoblast numbers, diminished osteoid volume, and markedly
          impaired active bone formation.

          '
        biological_processes:
        - preferred_term: Osteoblast differentiation
          term:
            id: GO:0001649
            label: osteoblast differentiation
        - preferred_term: Ossification
          term:
            id: GO:0001503
            label: ossification
      selected_evidence:
        snippet: In a patient with c.621 + 1G > A and c.1153-3C > G mutations in CRTAP, the mRNA and protein
          levels of CRTAP in osteoblasts were significantly decreased and the osteoid volume and osteoblast
          numbers were markedly reduced compared with those in the normal control individual. This was
          simultaneously accompanied by significantly reduced prolyl 3-hydroxylation at Pro986 in the
          α1 chain of type I collagen and invisible active bone formation in bone.
        supports: SUPPORT
