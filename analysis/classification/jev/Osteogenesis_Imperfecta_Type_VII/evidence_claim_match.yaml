      assertion_type: Pathophysiology
      assertion:
        name: Primary Lung Matrix Dysfunction
        description: 'Crtap knockout mouse data support a primary lung contribution in recessive OI, with
          altered collagen post-translational modification in lung fibroblasts, parenchymal changes, and
          impaired respiratory mechanics. This supports respiratory surveillance while remaining model-organism
          evidence.

          '
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
      selected_evidence:
        snippet: Here, we analyzed the lung phenotype of Crtap knockout (KO) mice, a mouse model of recessive
          OI. While we confirm changes in the lung parenchyma that are reminiscent of emphysema, we show
          that CrtapKO lung fibroblasts synthesize type I collagen with altered posttranslation modifications
          consistent with those observed in bone and skin.
        supports: SUPPORT
