      assertion_type: Pathophysiology
      assertion:
        name: Collagen 3-Hydroxylation Deficiency
        description: 'CRTAP is a component of the prolyl 3-hydroxylation complex that modifies Pro986
          in the alpha1(I) chain of type I collagen. Loss of this modification delays collagen folding,
          causing overmodification of the helix and altered collagen structure and cross-linking.

          '
        genes:
        - preferred_term: CRTAP
          term:
            id: hgnc:2379
            label: CRTAP
          modifier: LOSS_OF_FUNCTION
        cell_types:
        - preferred_term: Osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: Protein Hydroxylation
          term:
            id: GO:0018126
            label: protein hydroxylation
        - preferred_term: Collagen Fibril Organization
          term:
            id: GO:0030199
            label: collagen fibril organization
      selected_evidence:
        snippet: CRTAP can form a complex with P3H1 and cyclophilin B (CYPB), and Crtap-/- bone and cartilage
          collagens show decreased prolyl 3-hydroxylation. Moreover, mutant collagen shows evidence of
          overmodification, and collagen fibrils in mutant skin have increased diameter consistent with
          altered fibrillogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
