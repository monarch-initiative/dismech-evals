        association: Causative
        gene_term:
          preferred_term: P3H1 (prolyl 3-hydroxylase 1; formerly LEPRE1)
          term:
            id: hgnc:19316
            label: P3H1
        notes: Biallelic loss-of-function (null) variants in P3H1 (LEPRE1) on chromosome 1p34.1 cause
          OI type VIII. Pathogenic alleles are predominantly truncating (nonsense, frameshift, splice-site)
          and yield minimal mRNA and absent protein. A West African founder splice-site allele, c.1080+1G>T,
          accounts for a large share of mutant alleles and is the basis of the disorder's enrichment in
          West African and African American populations.
      selected_evidence:
        snippet: All proband LEPRE1 mutations led to premature termination codons and minimal mRNA and
          protein.
        supports: SUPPORT
