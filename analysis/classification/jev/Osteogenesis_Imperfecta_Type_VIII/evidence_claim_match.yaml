            id: GO:0001503
            label: ossification
          modifier: ABNORMAL
      selected_evidence:
        snippet: a recessive form of lethal or severe OI caused by null mutations in P3H1, which encodes
          prolyl 3-hydroxylase 1.
        supports: SUPPORT
