  c164a68495c5a986121202bdf15d83706a9f6c40d8a89a5d5f8568d50e43222c:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type VIII
          disease_term:
            preferred_term: Osteogenesis imperfecta type 8
            term:
              id: MONDO:0012581
              label: osteogenesis imperfecta type 8
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Pro986 3-Hydroxylation and Collagen Overmodification
        description: With the complex absent, alpha1(I)Pro986 3-hydroxylation is nearly abolished and
          CyPB can no longer efficiently catalyze the rate-limiting cis-trans isomerization of collagen
          folding. The resulting delay in helix folding prolongs exposure of the unfolded chain to lysyl
          hydroxylase and glycosyltransferases, producing collagen overmodification (excess lysyl hydroxylation
          and glycosylation). Collagen secretion is delayed yet total collagen output is paradoxically
          increased.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: collagen fibril organization
          term:
            id: GO:0030199
            label: collagen fibril organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: All proband LEPRE1 mutations led to premature termination codons and minimal mRNA and
          protein. Proband collagen had minimal 3-hydroxylation of alpha1(I)Pro986 but excess lysyl hydroxylation
          and glycosylation along the collagen helix.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17277775
      reference_title: Prolyl 3-hydroxylase 1 deficiency causes a recessive metabolic bone disorder resembling
        lethal/severe osteogenesis imperfecta.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents the loss of Pro986 3-hydroxylation and the compensatory collagen overmodification
        (excess lysyl hydroxylation and glycosylation).
