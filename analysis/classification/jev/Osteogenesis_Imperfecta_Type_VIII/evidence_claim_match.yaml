        name: Defective Bone Matrix, Undermineralization, and Skeletal Fragility
        description: The overmodified collagen forms structurally abnormal fibrils and a defective bone
          extracellular matrix, producing extreme skeletal undermineralization, very low bone mineral
          density, and severe bone fragility. Clinically this manifests as congenital/perinatal fractures,
          severe growth deficiency, rhizomelic limb shortening, and progressive deformity; the most severe
          (founder-allele homozygous) cases are perinatally lethal from respiratory failure.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
