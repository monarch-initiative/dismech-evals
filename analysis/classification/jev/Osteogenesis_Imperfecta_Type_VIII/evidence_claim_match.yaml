        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical, Biochemical, and Molecular Diagnosis
        description: OI type VIII is suspected in an infant with severe/lethal recessive OI, white (not
          blue) sclerae, rhizomelia, and extreme skeletal undermineralization, particularly in individuals
          of West African ancestry. Biochemical collagen analysis of cultured fibroblasts shows near-absent
          alpha1(I)Pro986 3-hydroxylation with collagen overmodification. Diagnosis is confirmed by identifying
          biallelic P3H1 (LEPRE1) variants — by single-gene testing (including the c.1080+1G>T founder
          allele in at-risk populations) or a recessive-OI gene panel / exome sequencing — distinguishing
          it from the closely similar CRTAP (type VII) and PPIB (type IX) forms.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: Proband collagen had minimal 3-hydroxylation of alpha1(I)Pro986 but excess lysyl hydroxylation
          and glycosylation along the collagen helix.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
