            term:
              id: MONDO:0012581
              label: osteogenesis imperfecta type 8
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: P3H1 Loss Disrupts the ER Collagen Prolyl 3-Hydroxylation Complex
        description: P3H1 (LEPRE1) forms a 1:1:1 endoplasmic-reticulum complex with cartilage-associated
          protein (CRTAP) and cyclophilin B (CyPB/PPIB). Biallelic null P3H1 variants eliminate the protein
          and, because P3H1 and CRTAP mutually stabilize one another, also deplete CRTAP — collapsing
          the complex that both 3-hydroxylates collagen and delivers the CyPB folding chaperone to the
          nascent chain. The same complex underlies the closely related recessive OI types VII (CRTAP)
          and IX (PPIB).
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: peptidyl-proline 3-hydroxylation of collagen
          term:
            id: GO:0019511
            label: peptidyl-proline hydroxylation
          modifier: DECREASED
      selected_evidence:
        snippet: CRTAP forms a complex with cyclophilin B and prolyl 3-hydroxylase 1, which is encoded
          by LEPRE1 and hydroxylates one residue in type I collagen, alpha1(I)Pro986.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
