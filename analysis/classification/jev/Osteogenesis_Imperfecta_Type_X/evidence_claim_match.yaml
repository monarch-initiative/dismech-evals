      assertion:
        name: Impaired Procollagen Quality Control and Defective Secretion
        description: HSP47 normally monitors the integrity of the type I procollagen triple helix at the
          ER/cis-Golgi boundary; in its absence the rate of transit from the ER to the Golgi is increased
          and helical structure is compromised. Type I procollagen accumulates abnormally in the Golgi
          of patient fibroblasts, and a fraction of the secreted type I procollagen is protease-sensitive,
          reflecting an improperly folded triple helix. The net result is secretion of structurally defective
          collagen.
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
