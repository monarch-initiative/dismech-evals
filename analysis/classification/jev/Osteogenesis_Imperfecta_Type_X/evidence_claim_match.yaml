      assertion_type: Genetic
      assertion:
        name: SERPINH1 (HSP47) Loss-of-Function Mutation
        association: Causative
        gene_term:
          preferred_term: SERPINH1 (HSP47, collagen-specific ER chaperone)
          term:
            id: hgnc:1546
            label: SERPINH1
        notes: 'OI type X is caused by a biallelic loss-of-function variant in SERPINH1, the gene encoding
          the collagen-specific ER chaperone HSP47. The defining human allele is a homozygous missense
          variant (c.233T>C, p.Leu78Pro) that destabilizes HSP47 and leads to its proteasomal degradation.
          The allelic spectrum is broader than this founding homozygous allele: a second, non-consanguineous
          patient carried compound heterozygous SERPINH1 variants (c.149T>G in exon 2 and c.1214G>A in
          exon 5), expanding the genotype of this extremely rare disorder beyond a single founder allele.
          A naturally occurring recessive SERPINH1 missense mutation (c.977C>T, p.L326P) causes an analogous
          OI in Dachshunds, establishing SERPINH1 as a conserved OI gene.'
      selected_evidence:
        snippet: We have identified an autosomal-recessive missense mutation (c.233T>C, p.Leu78Pro) in
          SERPINH1, which encodes the collagen chaperone-like protein HSP47, that leads to a severe OI
          phenotype.
        supports: SUPPORT
    origin:
