        description: The misfolded, abnormally processed type I collagen assembles into a defective bone
          extracellular matrix with abnormal collagen fibril formation and impaired mineralization, yielding
          very low bone mineral density and severe bone fragility. Clinically this manifests as recurrent
          congenital fractures, bone deformity, and growth deficiency. The pivotal chaperone role of HSP47
          in collagen matrix formation is underscored by the embryonic lethality of HSP47 gene disruption
          in mice from impaired collagen fibril formation.
