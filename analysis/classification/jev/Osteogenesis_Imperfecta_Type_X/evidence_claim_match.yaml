            id: GO:0032964
            label: collagen biosynthetic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: Type I procollagen accumulates in the Golgi of fibroblasts from the affected individual
          and a population of the secreted type I procollagen is protease sensitive.
        supports: SUPPORT
