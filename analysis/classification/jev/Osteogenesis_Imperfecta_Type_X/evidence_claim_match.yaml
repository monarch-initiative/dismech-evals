              label: osteogenesis imperfecta type 10
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SERPINH1 Loss Eliminates the ER Collagen-Specific Chaperone HSP47
        description: SERPINH1 encodes HSP47, an endoplasmic-reticulum-resident, collagen-specific molecular
          chaperone that binds collagenous (Gly-Xaa-Arg) repeats within triple-helical procollagen and
          is essential for its correct folding, accelerating and stabilizing triple-helix formation. The
          OI type X missense variant (p.Leu78Pro) destabilizes HSP47 and targets it for proteasomal degradation,
          so the chaperone is effectively absent from the ER. HSP47 acts downstream of the CRTAP/P3H1/CyPB
          prolyl 3-hydroxylation complex, functioning as a late ER folding chaperone and quality-control
          monitor rather than a collagen-modifying enzyme.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: protein folding (procollagen chaperoning by HSP47)
          term:
            id: GO:0006457
            label: protein folding
          modifier: DECREASED
      selected_evidence:
        snippet: The mutation results in degradation of the endoplasmic reticulum resident HSP47 via the
          proteasome.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
