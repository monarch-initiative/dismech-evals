            term:
              id: MONDO:0012592
              label: osteogenesis imperfecta type 11
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Diminished Telopeptide Lysyl Hydroxylation and Collagen Cross-Linking
        description: FKBP65 is required for hydroxylation of the telopeptide lysyl residues that form
          the intermolecular cross-links of bone collagen, acting through or alongside the lysyl hydroxylase
          LH2 (PLOD2) — possibly via its peptidyl-prolyl isomerase function granting LH2 access to the
          telopeptide lysines. In its absence, mass spectrometry shows near-absence of telopeptide lysine
          hydroxylation in secreted collagen, producing diminished intermolecular cross-linking. This
          shared telopeptide-cross-linking axis mechanistically links FKBP10-related OI to PLOD2-related
          Bruck syndrome type II.
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: peptidyl-lysine hydroxylation (collagen telopeptide lysines)
          term:
            id: GO:0017185
            label: peptidyl-lysine hydroxylation
          modifier: DECREASED
        - preferred_term: collagen biosynthetic process (post-translational maturation)
          term:
            id: GO:0032964
            label: collagen biosynthetic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: there is diminished hydroxylation of the telopeptide lysyl residues involved in intermolecular
          cross-link formation in bone. The phenotype overlaps with that seen with mutations in PLOD2
          (Bruck syndrome II), which encodes LH2, the enzyme that hydroxylates the telopeptide lysyl residues.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22949511
      reference_title: Mutations in FKBP10, which result in Bruck syndrome and recessive forms of osteogenesis
