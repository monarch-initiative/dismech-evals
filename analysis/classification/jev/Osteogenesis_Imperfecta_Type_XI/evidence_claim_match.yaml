              id: MONDO:0012592
              label: osteogenesis imperfecta type 11
        context: []
      assertion_type: Genetic
      assertion:
        name: FKBP10 (FKBP65) Loss-of-Function Mutation
        association: Causative
        gene_term:
          preferred_term: FKBP10 (FKBP65, ER peptidyl-prolyl isomerase/chaperone)
          term:
            id: hgnc:18169
            label: FKBP10
        notes: OI type XI is caused by biallelic loss-of-function variants in FKBP10, which encodes the
          65 kDa ER peptidyl-prolyl cis-trans isomerase/chaperone FKBP65. Most reported alleles introduce
          premature termination codons or frameshifts (e.g., the recurrent c.831_832insC) leading to mRNA
          instability, or are missense variants that cause loss of most of the protein. The same gene
          underlies both contracture-free recessive OI and Bruck-syndrome-like OI with congenital contractures
          (FKBP10-related Bruck syndrome, often designated Bruck syndrome type 1), reflecting a phenotypic
          continuum.
      selected_evidence:
        snippet: Here we describe five families with OI-like bone fragility in association with congenital
          contractures who all had FKBP10 mutations. Therefore, we conclude that FKBP10 mutations are
          a cause of recessive osteogenesis imperfecta and Bruck syndrome
        supports: SUPPORT
