      evidence_source: HUMAN_CLINICAL
      explanation: Documents diminished telopeptide lysyl hydroxylation and intermolecular cross-linking
        on FKBP65 loss, and the mechanistic overlap with PLOD2/LH2 Bruck syndrome type II.
