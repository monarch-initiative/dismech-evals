              label: osteogenesis imperfecta type 11
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FKBP10 Loss Eliminates the ER Chaperone/Isomerase FKBP65
        description: FKBP10 encodes FKBP65, a 65 kDa endoplasmic-reticulum-resident peptidyl-prolyl cis-trans
          isomerase and immunophilin that acts as a chaperone in type I procollagen folding and maturation.
          Biallelic loss-of-function FKBP10 variants (frameshifts and premature termination codons causing
          mRNA instability, or missense variants causing loss of most of the protein) eliminate FKBP65
          from the ER. In contrast to the prolyl 3-hydroxylation complex (CRTAP/P3H1/CyPB, deficient in
          OI types VII/VIII/IX), loss of FKBP65 leaves general collagen helical folding, chain incorporation
          and thermal stability largely intact, pointing to a more specialized role in collagen post-translational
          modification rather than bulk folding.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: protein folding (procollagen chaperoning by FKBP65)
          term:
            id: GO:0006457
            label: protein folding
          modifier: ABNORMAL
      selected_evidence:
        snippet: We identified mutations in FKBP10, which encodes the 65 kDa prolyl cis-trans isomerase,
          FKBP65, in 38 members of 21 families with OI.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
