        description: Deficient BMP1/mTLD activity causes delayed cleavage of the type I procollagen C-propeptide
          and also hampers processing of prodecorin, a small leucine-rich proteoglycan that regulates
          collagen fibrillogenesis. The combined defect impairs assembly of mature heterotypic type I/V
          collagen fibrils in the extracellular matrix, yielding a structurally abnormal bone collagen
          scaffold.
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
