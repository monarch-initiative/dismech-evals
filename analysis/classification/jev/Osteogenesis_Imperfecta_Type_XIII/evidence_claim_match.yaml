              id: MONDO:0013924
              label: osteogenesis imperfecta type 13
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Abnormally Mineralized Bone Matrix and Skeletal Fragility
        description: 'The abnormal collagen matrix in BMP1/mTLD deficiency mineralizes aberrantly: histomorphometry
          shows hyperosteoidosis with delayed onset of mineralization, yet the mineralized matrix becomes
          hypermineralized (high calcium content). The net result is bone that is paradoxically dense
          (high areal bone mineral density) but mechanically brittle, producing recurrent fractures, deformity,
          and short stature. This high-bone-mass fragility distinguishes OI type XIII from the typically
          low-density recessive OI types.'
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: bone mineralization
          term:
            id: GO:0030282
            label: bone mineralization
          modifier: ABNORMAL
        - preferred_term: ossification
          term:
            id: GO:0001503
            label: ossification
          modifier: ABNORMAL
      selected_evidence:
        snippet: Bmp1a is critically required for mature-collagen generation, downstream of osteoblast
          maturation, in bone.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22482805
      reference_title: Attenuated BMP1 function compromises osteogenesis, leading to bone fragility in
        humans and zebrafish.
      evidence_source: MODEL_ORGANISM
      explanation: Zebrafish bmp1a data establish that BMP1 is required downstream of osteoblast maturation
