        context: []
      assertion_type: Genetic
      assertion:
        name: BMP1 Loss-of-Function Mutation
        association: Causative
        gene_term:
          preferred_term: BMP1 (procollagen C-proteinase / mammalian Tolloid)
          term:
            id: hgnc:1067
            label: BMP1
        notes: OI type XIII is caused by biallelic (homozygous or compound heterozygous) loss-of-function
          variants in BMP1, encoding the procollagen C-proteinase BMP1 and its longer isoform mTLD. Reported
          alleles include the protease-domain p.Phe249Leu missense, signal-peptide variants (e.g., c.34G>C,
          p.Gly12Arg), and nonsense/frameshift variants. Fewer than 20 affected individuals have been
          reported, with a phenotype ranging from mild to severe/progressively deforming.
      selected_evidence:
        snippet: We conclude that BMP1 is an additional gene mutated in AR-OI.
        supports: SUPPORT
