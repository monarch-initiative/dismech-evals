            preferred_term: Osteogenesis imperfecta type 13
            term:
              id: MONDO:0013924
              label: osteogenesis imperfecta type 13
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BMP1/mTLD Loss Abolishes Procollagen C-Proteinase Activity
        description: BMP1 encodes the secreted astacin metalloprotease bone morphogenetic protein 1 and
          its longer isoform mammalian Tolloid (mTLD), which together constitute the principal procollagen
          C-terminal-propeptide (PICP) endopeptidase for type I procollagen. Biallelic loss-of-function
          BMP1 variants (e.g., the protease-domain p.Phe249Leu missense and signal-peptide variants) destroy
          or attenuate this proteolytic activity, so excess mutant BMP1/mTLD fails to enhance cleavage
          of the C-terminal propeptide of proalpha1(I). This is a proteolytic (enzymatic) lesion, mechanistically
          distinct from the chaperone and prolyl-3-hydroxylation defects of other recessive OI types.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: collagen biosynthetic process (procollagen C-propeptide proteolysis)
          term:
            id: GO:0032964
            label: collagen biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: we found a homozygous causative BMP1 mutation, c.34G>C, in a consanguineous family affected
          by increased bone mineral density and multiple recurrent fractures.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22482805
      reference_title: Attenuated BMP1 function compromises osteogenesis, leading to bone fragility in
        humans and zebrafish.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies a homozygous BMP1 mutation underlying bone fragility with increased bone
        mineral density, defining the disorder.
