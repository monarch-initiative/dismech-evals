      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Diagnosis
        description: OI type XIII is suspected in a child with severe recessive OI (recurrent fractures,
          deformity) particularly when bone fragility is accompanied by high rather than low bone mineral
          density and COL1A1/COL1A2 testing is negative. Diagnosis is confirmed by identifying biallelic
          BMP1 loss-of-function variants by gene-panel or exome sequencing; supportive findings include
          deficient procollagen C-propeptide processing in cultured fibroblasts. Reported patients characteristically
          have no dentinogenesis imperfecta, and extraskeletal connective-tissue features (umbilical hernia,
          joint hyperextensibility, variable blue sclerae) can further support the diagnosis.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: Mutation analysis identified both patients with a Phe249Leu homozygous missense change
          within the BMP1 protease domain
        supports: SUPPORT
