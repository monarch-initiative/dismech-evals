          term:
            id: GO:0030199
            label: collagen fibril organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: BMP1/mTLD-deficiency in humans not only results in delayed cleavage of the type I procollagen
          C-propeptide but also hampers the processing of the small leucine-rich proteoglycan prodecorin,
          a regulator of collagen fibrillogenesis.
        supports: SUPPORT
