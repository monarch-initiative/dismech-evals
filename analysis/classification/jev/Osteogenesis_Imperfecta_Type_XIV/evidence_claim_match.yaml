      assertion_type: Pathophysiology
      assertion:
        name: Insufficient Bone Matrix, Reduced Mineralization, and Skeletal Fragility
        description: Reduced collagen deposition and impaired osteoblast proliferation and function produce
          an insufficient bone extracellular matrix with poor mineralization, yielding low bone mineral
          density (osteopenia) and skeletal fragility. Clinically this manifests as recurrent fractures,
          growth deficiency, and long-bone bowing/deformity. Tric-b-knockout mice serve as an OI model
          in which deranged ER Ca2+ handling reduces ECM synthesis in osteoblasts, leading to poor mineralization.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: bone mineralization
          term:
            id: GO:0030282
            label: bone mineralization
          modifier: DECREASED
        - preferred_term: ossification
          term:
            id: GO:0001503
            label: ossification
          modifier: ABNORMAL
      selected_evidence:
        snippet: Serious mutations in the TRIC-B (also referred to as TMEM38B) locus cause autosomal recessive
          osteogenesis imperfecta (OI), which is characterized by insufficient bone mineralization.
        supports: SUPPORT
    origin:
