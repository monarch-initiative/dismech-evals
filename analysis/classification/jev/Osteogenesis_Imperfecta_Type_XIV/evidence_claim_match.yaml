        description: Dental abnormalities are a variable, inconsistently reported feature of OI type XIV.
          As with blue sclerae, they are not a constant finding across the aggregated TMEM38B cohort —
          many patients have normal dentition — so dental involvement is captured here as a variable finding.
          The generic dentition term is used because the systematic review reports "dental abnormalities"
          without specifying dentinogenesis imperfecta.
        phenotype_term:
          preferred_term: Dental abnormalities
          term:
            id: HP:0000164
            label: Abnormality of the dentition
      selected_evidence:
        snippet: This leads to severe bone fragility, early-onset fractures, skeletal deformities, low
          bone mass, scoliosis, and variable features like blue sclerae or dental abnormalities.
