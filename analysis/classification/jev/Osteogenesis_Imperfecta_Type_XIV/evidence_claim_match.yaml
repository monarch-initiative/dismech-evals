              label: osteogenesis imperfecta type 14
        context: []
      assertion_type: Genetic
      assertion:
        name: TMEM38B (TRIC-B) Loss-of-Function Mutations
        association: Causative
        gene_term:
          preferred_term: TMEM38B (TRIC-B, ER monovalent cation channel)
          term:
            id: hgnc:25535
            label: TMEM38B
        notes: OI type XIV is caused by biallelic null (loss-of-function) variants in TMEM38B on chromosome
          9q31, the gene encoding the ER cation channel TRIC-B. The originally reported alleles are a
          homozygous truncating deletion of exon 4 in consanguineous Arabian families (Shaheen et al.,
          2012) and an independent homozygous exon 4 deletion producing an early stop codon and low TMEM38B
          mRNA in Israeli Bedouin families (Volodarsky et al., 2013). TRIC-B protein is undetectable in
          patient fibroblasts and osteoblasts.
      selected_evidence:
        snippet: In three multiplex families, autozygosity and linkage analysis revealed a novel recessive
          OI locus on chromosome 9q31.1-31.3, and a novel truncating deletion of exon 4 of TMEM38B was
          identified within that interval.
        supports: SUPPORT
