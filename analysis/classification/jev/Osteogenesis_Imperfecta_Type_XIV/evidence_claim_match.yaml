            term:
              id: MONDO:0014029
              label: osteogenesis imperfecta type 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TMEM38B Loss Eliminates the ER Cation Channel TRIC-B and Disrupts ER Calcium Flux
        description: TMEM38B encodes TRIC-B, a trimeric intracellular cation channel of the endoplasmic-reticulum
          membrane that conducts monovalent cations (K+) and is proposed to counterbalance IP3R-mediated
          Ca2+ release from intracellular stores. Biallelic null mutations render TRIC-B protein undetectable
          in patient fibroblasts and osteoblasts. The loss impairs release of ER luminal Ca2+ and store-operated
          calcium entry; steady-state ER Ca2+ is unchanged, indicating that TRIC-B governs the kinetics
          of ER calcium depletion and recovery rather than the resting store level. The disturbed Ca2+
          flux triggers ER stress with increased BiP.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: endoplasmic reticulum calcium ion homeostasis
          term:
            id: GO:0032469
            label: endoplasmic reticulum calcium ion homeostasis
          modifier: ABNORMAL
        - preferred_term: calcium ion transport (ER Ca2+ release / store-operated entry)
          term:
            id: GO:0006816
            label: calcium ion transport
          modifier: DECREASED
      selected_evidence:
        snippet: TMEM38B encodes the ER membrane monovalent cation channel, TRIC-B, proposed to counterbalance
          IP3R-mediated Ca2+ release from intracellular stores.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27441836
      reference_title: Absence of the ER Cation Channel TMEM38B/TRIC-B Disrupts Intracellular Calcium
        Homeostasis and Dysregulates Collagen Synthesis in Recessive Osteogenesis Imperfecta.
      evidence_source: IN_VITRO
      explanation: Defines TRIC-B as the ER monovalent cation channel encoded by TMEM38B that counterbalances
        ER Ca2+ release, the protein lost in OI type XIV.
