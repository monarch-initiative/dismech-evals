  dc0577529ce16adba0920ca80c9c9d35284dd16fff553c67f8afc989e628f8f3:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type XIV
          disease_term:
            preferred_term: Osteogenesis imperfecta type 14
            term:
              id: MONDO:0014029
              label: osteogenesis imperfecta type 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Collagen Synthesis and Defective Secretion
        description: The disturbed Ca2+ flux dysregulates type I collagen synthesis at multiple steps.
          Collagen helical lysine hydroxylation is reduced while telopeptide hydroxylation is increased,
          reflecting altered activity of Ca2+-dependent collagen-modifying enzymes and chaperones (increased
          LH1, decreased FKBP65). Procollagen chain assembly is delayed and the resulting misfolded collagen
          is substantially retained intracellularly, producing a 50-70% reduction in secreted collagen.
          Lower-stability forms that escape proteasomal degradation are not incorporated into matrix,
          so collagen production — rather than collagen quality — is the primary deficit.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: collagen biosynthetic process
          term:
            id: GO:0032964
            label: collagen biosynthetic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: The resulting misfolded collagen is substantially retained in TRIC-B null cells, consistent
          with a 50-70% reduction in secreted collagen.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27441836
      reference_title: Absence of the ER Cation Channel TMEM38B/TRIC-B Disrupts Intracellular Calcium
