      assertion_type: Pathophysiology
      assertion:
        name: Mechanically Weak Bone Matrix, Low Bone Mass, and Skeletal Fragility
        description: The combination of reduced type I collagen secretion into bone matrix, impaired collagen
          crosslinking (reduced K87 hydroxylation, presumptively undermining bone strength), and defective
          osteoblast differentiation produces a mechanically weak, collagen-related bone defect with generalized
          osteopenia and low bone mineral density. Clinically this manifests in affected males as prenatal
          and childhood fractures, short stature, bowing of the long bones, scoliosis with anterior vertebral
          wedging, and pectal deformity in the moderate-to-severe OI range.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: bone mineralization
          term:
            id: GO:0030282
            label: bone mineralization
          modifier: DECREASED
        - preferred_term: ossification
          term:
            id: GO:0001503
            label: ossification
          modifier: ABNORMAL
      selected_evidence:
        snippet: Reduced collagen crosslinks presumptively undermine bone strength.
        supports: SUPPORT
