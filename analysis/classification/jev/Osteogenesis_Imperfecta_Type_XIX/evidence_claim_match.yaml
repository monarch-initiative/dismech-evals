            term:
              id: MONDO:0049223
              label: osteogenesis imperfecta, type 19
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective OASIS-Driven Osteoblast Transcription and Reduced Type I Collagen
        description: Fully processed OASIS/CREB3L1 normally activates Col1a1 transcription and complexes
          with SMAD4 to upregulate matrix genes. When S2P-mediated OASIS processing is impaired, OASIS
          (CREB3L1) and SMAD4 expression fall across osteoblast differentiation, alkaline phosphatase
          expression is reduced, and proband osteoblasts show a broad differentiation defect. Mutant cells
          secrete significantly less type I collagen (20-73% of control in fibroblasts). In parallel,
          hydroxylation of the collagen helical lysine K87 critical for crosslinking is reduced — associated
          with substantially decreased lysyl hydroxylase 1 (PLOD1/LH1) in proband osteoblasts — yielding
          collagen with fewer mature crosslinks.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: OASIS-dependent regulation of COL1A1 transcription
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DECREASED
        - preferred_term: type I collagen biosynthesis and secretion
          term:
            id: GO:0032964
            label: collagen biosynthetic process
          modifier: DECREASED
        - preferred_term: osteoblast differentiation (S2P/OASIS-dependent)
          term:
            id: GO:0001649
            label: osteoblast differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: Osteoblasts differentiated in culture revealed impaired expression of transcripts related
          to osteoblast maturation and RIP pathways
        supports: SUPPORT
