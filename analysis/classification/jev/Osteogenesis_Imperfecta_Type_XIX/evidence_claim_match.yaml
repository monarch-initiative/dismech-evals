              label: osteogenesis imperfecta, type 19
        context: []
      assertion_type: Genetic
      assertion:
        name: MBTPS2 (S2P) Hypomorphic Missense Mutations
        association: Causative
        gene_term:
          preferred_term: MBTPS2 (site-2 protease, S2P; RIP intramembrane metalloprotease)
          term:
            id: hgnc:15455
            label: MBTPS2
        notes: OI type XIX is caused by hemizygous hypomorphic missense variants in MBTPS2 at Xp22.12,
          encoding site-2 metalloprotease (S2P). The two founding alleles (p.N459S, at the first residue
          of the metal-ion-coordinating NPDG motif, and p.L505F) are highly conserved S2P substitutions
          that leave the protein stable but impair RIP of OASIS/ATF6/SREBP. MBTPS2 is also the cause of
          allelic X-linked dermatological disorders — IFAP/BRESHECK syndrome, keratosis follicularis spinulosa
          decalvans (KFSD), and Olmsted syndrome — but OI type XIX patients lack those skin/hair/eye features;
          this entry concerns the OI (bone-fragility) phenotype. Affected males are sons of unaffected
          obligate carriers.
      selected_evidence:
        snippet: 'Mutations previously reported to cause substitutions in S2P (Supplementary Fig. 8) underlie
          a spectrum of dermatological conditions: IFAP syndrome, characterized by a triad of ichthyosis
          follicularis, atrichia and photophobia'
        supports: SUPPORT
