  7fbf8a6849870ac0028b4b1fc59395188fc3ea20562aca61d613c7aeeaf5ab06:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type XIX
          disease_term:
            preferred_term: Osteogenesis imperfecta type 19
            term:
              id: MONDO:0049223
              label: osteogenesis imperfecta, type 19
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hypomorphic MBTPS2 Impairs Site-2 Protease (S2P) Regulated Intramembrane Proteolysis
        description: MBTPS2 encodes site-2 metalloprotease (S2P), an integral Golgi membrane protein that,
          with site-1 protease (S1P), sequentially cleaves membrane-spanning regulatory transcription
          factors (OASIS/CREB3L1, ATF6, SREBP) transported from the ER during ER stress or sterol restriction,
          releasing mature N-terminal fragments that enter the nucleus to activate transcription (regulated
          intramembrane proteolysis, RIP). OI-causing hemizygous missense substitutions at highly conserved
          S2P residues (p.N459S at the first residue of the metal-ion-coordinating NPDG motif; p.L505F)
          leave the protein stable and normally expressed but functionally impaired, so RIP cleavage/activation
          of OASIS, ATF6 and SREBP is reduced.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: regulated intramembrane proteolysis of OASIS/ATF6/SREBP (S2P-dependent)
          term:
            id: GO:0034976
            label: response to endoplasmic reticulum stress
          modifier: ABNORMAL
      selected_evidence:
        snippet: Mutant S2P has normal stability, but impaired functioning in regulated intramembrane
          proteolysis (RIP) of OASIS, ATF6 and SREBP transcription factors, consistent with decreased
          proband secretion of type I collagen.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
