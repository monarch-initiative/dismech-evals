  64315df6dfd08a8d37e965eba3c5e55a2c6ed1eb5b96bcdc47bb218ab77ffd03:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type XVI
          disease_term:
            preferred_term: Osteogenesis imperfecta type 16
            term:
              id: MONDO:0014544
              label: osteogenesis imperfecta type 16
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Transcriptional Activation of COL1A1 and Type I Collagen Synthesis
        description: OASIS directly activates transcription of the type I collagen gene COL1A1 through
          an unfolded protein response element (UPRE)-like sequence in the osteoblast-specific Col1a1
          promoter and contributes to the secretion of bone matrix proteins. When OASIS is lost or its
          DNA-binding/bZIP activity is impaired, COL1A1 transcriptional activation falls and osteoblasts
          synthesize markedly less type I collagen. In OASIS-deficient human osteoblasts, CREB3L1 mRNA
          and collagen I are reduced and the rough ER is ultrastructurally abnormal; in mice, OASIS-/-
          osteoblasts show decreased type I collagen in the bone matrix and an abnormally expanded rough
          ER engorged with bone matrix proteins, reflecting impaired collagen production and secretion.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: regulation of COL1A1 transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DECREASED
        - preferred_term: collagen biosynthetic process (type I collagen)
          term:
            id: GO:0032964
            label: collagen biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: Here we identify the gene for type 1 collagen, Col1a1, as a target of OASIS, and demonstrate
          that OASIS activates the transcription of Col1a1 through an unfolded protein response element
          (UPRE)-like sequence in the osteoblast-specific Col1a1 promoter region.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19767743
      reference_title: Signalling mediated by the endoplasmic reticulum stress transducer OASIS is involved
        in bone formation.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that OASIS transcriptionally activates COL1A1, the function whose loss
        reduces type I collagen synthesis in OI type XVI.
