  cf75b04fca04dc765e59412d7e3f5d79cba3f99bc599ec21084ff74485106550:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type XVI
          disease_term:
            preferred_term: Osteogenesis imperfecta type 16
            term:
              id: MONDO:0014544
              label: osteogenesis imperfecta type 16
        context: []
      assertion_type: Genetic
      assertion:
        name: CREB3L1 (OASIS) Loss-of-Function Mutations
        association: Causative
        gene_term:
          preferred_term: CREB3L1 (OASIS, ER-stress bZIP transcription factor)
          term:
            id: hgnc:18856
            label: CREB3L1
        notes: OI type XVI is caused by biallelic loss-of-function variants in CREB3L1, encoding the ER-stress
          transducer OASIS. The disorder was first defined by a homozygous 11p11.2 contiguous genomic
          deletion encompassing CREB3L1 in a family with severe OI. Subsequent reports established point-variant
          alleles, including a homozygous premature stop (nonsense) codon in the first patient to survive
