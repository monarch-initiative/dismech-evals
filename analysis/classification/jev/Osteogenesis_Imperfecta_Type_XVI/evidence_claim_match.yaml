            term:
              id: MONDO:0014544
              label: osteogenesis imperfecta type 16
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Collagen-Poor Bone Matrix, Low Bone Mass, and Skeletal Fragility
        description: Reduced osteoblast type I collagen production yields a defective, collagen-deficient
          bone extracellular matrix with low trabecular thickness, reduced mineral apposition, and impaired
          mechanical strength, producing very low bone mass and severe skeletal fragility. Clinically
          this manifests as recurrent prenatal and postnatal fractures, reduced bone mineral density,
          growth deficiency, and bone deformity. The OASIS-deficient (OASIS-/-) mouse recapitulates the
          disorder with severe osteopenia, decreased bone-matrix type I collagen, dysfunctional osteoblasts,
          and spontaneous fractures.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: bone mineralization
          term:
            id: GO:0030282
            label: bone mineralization
          modifier: DECREASED
        - preferred_term: ossification
          term:
            id: GO:0001503
            label: ossification
          modifier: ABNORMAL
      selected_evidence:
        snippet: Bone histomorphometry and qBEI were similar to collagen I OI, with low trabecular thickness
          and mineral apposition rate, and increased bone matrix mineralization.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
