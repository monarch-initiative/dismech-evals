      assertion:
        name: Bisphosphonate Therapy
        description: Intravenous bisphosphonates (e.g., pamidronate, zoledronic acid) are the pharmacological
          mainstay of severe OI, increasing bone mineral density and reducing fracture frequency; in OI
          type XVI, life-long bisphosphonate treatment steadily increased bone mineral density although
          fractures persisted. They are antiresorptive and do not correct the underlying transcriptional
          collagen defect. The OASIS-deficient mouse responds to risedronate with increased trabecular
          bone, supporting bisphosphonate efficacy in this disorder.
        treatment_term:
          preferred_term: Bisphosphonate Therapy
          term:
            id: NCIT:C198585
            label: Bisphosphonate Therapy
      selected_evidence:
        snippet: Clinical response to life-long bisphosphonate treatment was as expected in severe OI
          with steadily increasing bone mineral density, but despite this the boy suffered repeated childhood
          fractures.
