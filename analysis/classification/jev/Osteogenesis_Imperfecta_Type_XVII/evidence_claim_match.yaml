        notes: Biallelic loss-of-function variants in SPARC, the gene encoding osteonectin, cause OI type
          XVII (MONDO:0014672; OMIM:616507). The defining human alleles are two homozygous missense variants
          (c.497G>A, p.Arg166His and c.787G>A, p.Glu263Lys) that disrupt an intramolecular salt bridge
          essential for SPARC binding to collagen type I. SPARC secretion is reduced in some patients.
      selected_evidence:
        snippet: 'we identified two homozygous variants in SPARC (GenBank: NM_003118.3;'
        supports: SUPPORT
