              label: osteogenesis imperfecta type 17
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SPARC Loss-of-Function Disrupts Osteonectin Collagen Binding in the Bone ECM
        description: SPARC encodes osteonectin, a secreted collagen-binding matricellular glycoprotein
          and one of the most abundant noncollagenous proteins in bone. Osteonectin binds collagen type
          I and other extracellular-matrix proteins and regulates collagen fibril assembly and matrix
          maturation. The defining OI type XVII missense variants (p.Arg166His, p.Glu263Lys) substitute
          residues that form an intramolecular salt bridge essential for SPARC binding to collagen type
          I, so the proximal lesion is loss of the collagen-binding matricellular function of secreted
          osteonectin in the bone ECM — distinct from the intracellular collagen-folding/modification
          recessive OI types.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: extracellular matrix organization (osteonectin collagen binding)
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: Secreted protein, acidic, cysteine-rich (SPARC) is a glycoprotein that binds to collagen
          type I and other proteins in the extracellular matrix.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
