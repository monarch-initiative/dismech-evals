      assertion_type: Pathophysiology
      assertion:
        name: Impaired Bone Matrix Maturation and Osteoblast Function
        description: Osteonectin supports bone remodeling and the maintenance of bone mass; its loss compromises
          osteoblast formation, maturation, and survival and impairs collagen fibril organization within
          the bone extracellular matrix. In OI type XVII patient fibroblasts, SPARC secretion is reduced
          and collagen type I secretion is mildly delayed with some overmodification, reflecting disturbed
          matrix maturation. Osteonectin-null mice show decreased bone formation and decreased osteoblast
          number and surface, the cellular basis of the matrix defect.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: collagen fibril organization
          term:
            id: GO:0030199
            label: collagen fibril organization
          modifier: ABNORMAL
        - preferred_term: ossification (bone formation)
          term:
            id: GO:0001503
            label: ossification
          modifier: DECREASED
      selected_evidence:
        snippet: These data indicate that osteonectin is important for osteoblast formation, maturation,
          and survival.
        supports: SUPPORT
