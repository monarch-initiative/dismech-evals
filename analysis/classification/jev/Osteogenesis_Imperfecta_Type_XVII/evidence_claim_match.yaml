  37dd7925929eeb38d941e663fcb9b3293c9a628cc9f303989f7427b8ec70d232:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type XVII
          disease_term:
            preferred_term: Osteogenesis imperfecta type 17
            term:
              id: MONDO:0014672
              label: osteogenesis imperfecta type 17
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Bone Matrix, Reduced Bone Mineral Density, and Skeletal Fragility
        description: The disturbed osteonectin-dependent collagen matrix and impaired osteoblast function
          produce a defective bone extracellular matrix with abnormal mineralization. Although trabecular
          bone material can be hypermineralized at the material level, the overall result is reduced bone
          mass and mechanical strength with severe bone fragility. Osteonectin-null mice develop profound
          osteopenia from decreased bone formation, recapitulating the reduced bone mass of OI type XVII.
          Clinically this manifests as recurrent fractures, low bone mineral density, growth deficiency,
          vertebral compression, and bone deformity.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: bone mineralization
          term:
            id: GO:0030282
            label: bone mineralization
          modifier: ABNORMAL
        - preferred_term: ossification
          term:
            id: GO:0001503
            label: ossification
          modifier: DECREASED
      selected_evidence:
        snippet: We found that osteonectin-null mice have decreased bone formation and decreased osteoblast
          and osteoclast surface and number, leading to decreased bone remodeling with a negative bone
          balance and causing profound osteopenia.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10749571
      reference_title: Osteopenia and decreased bone formation in osteonectin-deficient mice.
      evidence_source: MODEL_ORGANISM
      explanation: The osteonectin-null mouse recapitulates the decreased bone formation and profound
