      assertion_type: Pathophysiology
      assertion:
        name: Reduced Canonical WNT/Beta-Catenin Signaling and Osteoblast Bone Formation
        description: 'With LRP5/LRP6 trafficking reduced, canonical WNT/beta-catenin signaling — the osteoanabolic
          axis essential for osteoblast differentiation and bone formation — is diminished. The phenotype
          mirrors the consequences of reduced LRP5 and LRP6 function: bone-mass accrual and dental patterning
          are inferred to be more sensitive to reduced canonical WNT signaling than other developmental
          processes, so the disease manifests predominantly as skeletal fragility (reduced LRP5) and oligodontia
          (reduced LRP6) without the eye, limb, or brain patterning defects of complete LRP5/LRP6 loss.'
