        context: []
      assertion_type: Genetic
      assertion:
        name: MESD Loss-of-Function (Hypomorphic) Mutations
        association: Causative
        gene_term:
          preferred_term: MESD (Mesoderm Development LRP Chaperone; prior symbol MESDC2)
          term:
            id: hgnc:13520
            label: MESD
        notes: OI type XX is caused by biallelic loss-of-function variants in MESD (prior gene symbol
          MESDC2), the gene encoding the ER chaperone for the WNT co-receptors LRP5/LRP6. Reported OI-associated
          alleles are truncating or frameshift variants (e.g., c.632dupA p.Lys212Glufs, c.676C>T p.Arg226*)
          located downstream of the chaperone activity domain but upstream of the ER-retention domain,
          behaving as hypomorphic alleles. More proximal, complete-loss-of-function alleles in the chaperone
          domain (e.g., exon 2 frameshifts) cause a neonatal-lethal form.
      selected_evidence:
        snippet: we identified four homozygous truncation or frameshift mutations in MESD.
        supports: SUPPORT
