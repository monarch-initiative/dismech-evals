      assertion_type: Phenotype
      assertion:
        name: Absent Eye Abnormalities (Distinguishing Hypomorphic MESD from Complete LRP5 Loss)
        description: 'Unlike individuals who completely lack LRP5 — in whom ocular abnormalities occur
          (as in osteoporosis-pseudoglioma syndrome) — persons with hypomorphic MESD alleles causing OI
          type XX have no eye abnormalities. Recorded here as an explicitly absent phenotype: the residual
          LRP5/LRP6 trafficking preserved by the hypomorphic alleles is sufficient for ocular development,
          so the disease is largely restricted to skeletal fragility (reduced LRP5) and oligodontia (reduced
          LRP6). This distinguishes OI type XX from complete LRP5 loss and is consistent with its WNT-signaling
          (rather than collagen-defect) mechanism.'
        phenotype_term:
