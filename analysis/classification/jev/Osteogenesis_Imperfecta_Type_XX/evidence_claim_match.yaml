              label: osteogenesis imperfecta, type 20
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MESD Loss Impairs ER Chaperoning and Trafficking of LRP5/LRP6
        description: MESD encodes an endoplasmic-reticulum chaperone protein for the canonical WNT signaling
          co-receptors LRP5 and LRP6, folding them and chaperoning their transit to the cell surface.
          The OI-associated MESD mutations are truncating/frameshift alleles located downstream of the
          chaperone activity domain but upstream of the ER-retention domain, so mutant MESD fails to be
          retained within the ER; this significantly reduces (but does not completely eliminate) LRP5/LRP6
          trafficking. The proximal lesion is thus failure of WNT co-receptor maturation rather than a
          defect in type I collagen, placing OI type XX mechanistically alongside WNT1-related OI type
          XV.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: protein folding (ER chaperoning of LRP5/LRP6 by MESD)
          term:
            id: GO:0006457
            label: protein folding
          modifier: DECREASED
      selected_evidence:
        snippet: MESD encodes an endoplasmic reticulum (ER) chaperone protein for the canonical Wingless-related
          integration site (WNT) signaling receptors LRP5 and LRP6.
        supports: SUPPORT
