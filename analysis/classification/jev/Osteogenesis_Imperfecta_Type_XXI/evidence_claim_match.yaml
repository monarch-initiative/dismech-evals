  a32d35714f8dc0d9f9a84314f120892f056522ad34d7357ee886d8578f230efe:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type XXI
          disease_term:
            preferred_term: Osteogenesis imperfecta type 21
            term:
              id: MONDO:0030861
              label: osteogenesis imperfecta, type 21
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired GSK3-beta/Beta-Catenin Osteoblast Differentiation Signaling
        biological_scale: CELLULAR
        description: 'A candidate second, collagen-independent arm of KDELR2 bone pathology, established
          so far only in mouse bone-marrow mesenchymal stromal cells (mBMSCs). Lentiviral KDELR2 knockdown
          inhibited osteogenic differentiation of mBMSCs while KDELR2 overexpression enhanced it, and
          the levels of active beta-catenin and inhibitory phospho-GSK3-beta (Ser9) tracked KDELR2 dose
          in the same direction; mBMSCs overexpressing KDELR2 promoted healing in a mouse fracture model.
          The authors conclude that KDELR2 promotes osteogenesis by regulating GSK3-beta/beta-catenin
          signaling. If it operates in patients, this arm would place OI type XXI alongside the WNT-pathway
          OI types (notably WNT1-related OI type XV and MESD-related OI type XX, in which LRP5/6-mediated
          canonical WNT signaling to the osteoblast is the primary lesion) rather than positioning it
          purely as a chaperone-recycling collagen-quality disorder. It is modeled here as an explicitly
          model-derived, parallel arm and NOT as an established human mechanism: no KDELR2-deficient patient
          cell or patient cohort study has tested osteoblast WNT signaling, and the defining human report
          attributes the disease to failed HSP47 release from collagen type I.'
        cell_types:
        - preferred_term: bone marrow mesenchymal stromal cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: canonical Wnt signaling pathway (GSK3-beta/beta-catenin)
          term:
            id: GO:0060070
            label: canonical Wnt signaling pathway
          modifier: DECREASED
        - preferred_term: osteoblast differentiation
          term:
            id: GO:0001649
            label: osteoblast differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: the levels of active-β-catenin and phospho-GSK3β (Ser9) were upregulated by KDELR2 overexpression
          and downregulated by KDELR2 knockdown.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38470494
      reference_title: KDELR2 promotes bone marrow mesenchymal stem cell osteogenic differentiation via
        GSK3β/β-catenin signaling pathway.
      evidence_source: IN_VITRO
      explanation: Identifies the GSK3-beta/beta-catenin axis as the signaling readout that tracks KDELR2
        dose, the proposed molecular link between KDELR2 loss and impaired osteoblast differentiation.
