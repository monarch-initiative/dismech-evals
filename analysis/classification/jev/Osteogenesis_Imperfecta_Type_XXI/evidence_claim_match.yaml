        name: KDELR2 Loss-of-Function Mutations
        association: Causative
        gene_term:
          preferred_term: KDELR2 (KDEL endoplasmic reticulum protein retention receptor 2)
          term:
            id: hgnc:6305
            label: KDELR2
        notes: OI type XXI is caused by biallelic (homozygous or compound heterozygous) loss-of-function
          variants in KDELR2. The defining report (van Dijk et al. 2020, PMID:33053334) identified bi-allelic
          pathogenic KDELR2 variants in four families; the variants map onto the KDELR2 structure as inactivating,
          abolishing receptor-mediated Golgi-to-ER retrograde transport. A second cohort (Efthymiou et
          al. 2021, PMID:33964184) reported two additional biallelic KDELR2 missense variants (a homozygous
          R5W substitution in two Pakistani siblings and a homozygous Y162C substitution in a Turkish
          boy) in children with progressively deforming recessive OI, expanding the phenotypic spectrum
          to include neurodevelopmental features (motor delay and speech delay) alongside the recessive
          OI signs (short stature, wormian bones, bowed limbs, chest deformity, hypotonia, joint hypermobility,
          blue sclerae, and dentinogenesis imperfecta). Those extended phenotype descriptors are recorded
          here as notes rather than as separately modeled phenotype evidence because the Efthymiou et
          al. 2021 report has no PubMed abstract and its phenotype detail resides only in the figures/full
          text, so an exact-quote snippet cannot be validated against the cached reference (per the CLAUDE.md
          evidence SOP).
      selected_evidence:
        snippet: We identified bi-allelic pathogenic KDELR2 variants as a cause of OI in four families.
        supports: SUPPORT
