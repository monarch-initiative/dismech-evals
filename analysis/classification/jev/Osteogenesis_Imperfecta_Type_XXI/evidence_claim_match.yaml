      assertion:
        name: KDELR2 Loss Disables Retrograde Recycling of ER-Resident Chaperones
        description: KDELR2 encodes KDEL endoplasmic reticulum protein retention receptor 2, a cis-Golgi/ERGIC
          receptor that binds ER-resident proteins carrying a KDEL-like C-terminal retrieval signal and
          recycles them back to the endoplasmic reticulum through COPI-mediated retrograde (Golgi-to-ER)
          transport. Biallelic loss-of-function KDELR2 variants map onto the receptor structure as inactivating,
          abolishing KDELR2-mediated Golgi-to-ER transport and the retrieval of ER-resident cargoes including
          the collagen-specific chaperone HSP47 (SERPINH1) and FKBP65.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum (KDEL
            retrieval)
          term:
            id: GO:0006890
            label: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
          modifier: DECREASED
      selected_evidence:
        snippet: KDELR2 encodes KDEL endoplasmic reticulum protein retention receptor 2, which recycles
          ER-resident proteins with a KDEL-like peptide from the cis-Golgi to the ER through COPI retrograde
          transport.
        supports: SUPPORT
