        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Bone Collagen Matrix and Skeletal Fragility
        description: Because HSP47 remains bound to collagen molecules extracellularly, normal fiber formation
          is disrupted and the secreted collagen is of abnormal quality. The resulting defective bone
          extracellular matrix fails to assemble and mineralize normally, producing low bone mineral density
          and severe bone fragility that manifests clinically as recurrent fractures, bone deformity,
          and growth deficiency. Cellular OI models confirm abnormal pro-alpha1(I) handling on KDELR2
          loss, with intracellular pro-alpha1(I) aggregation.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: bone mineralization
          term:
            id: GO:0030282
            label: bone mineralization
          modifier: DECREASED
        - preferred_term: ossification
          term:
            id: GO:0001503
            label: ossification
          modifier: ABNORMAL
      selected_evidence:
        snippet: Instead, HSP47 remains bound to collagen molecules extracellularly, disrupting fiber
          formation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33053334
      reference_title: Interaction between KDELR2 and HSP47 as a Key Determinant in Osteogenesis Imperfecta
