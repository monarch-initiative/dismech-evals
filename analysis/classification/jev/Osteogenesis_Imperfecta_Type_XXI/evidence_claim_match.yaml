  465d2f841cd58b52b224a98108a8f69454e6925a49a0188270d3681cbc425045:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type XXI
          disease_term:
            preferred_term: Osteogenesis imperfecta type 21
            term:
              id: MONDO:0030861
              label: osteogenesis imperfecta, type 21
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure to Release and Recycle HSP47 from Procollagen
        description: Normally HSP47 binds the type I procollagen triple helix in the ER and is released
          from procollagen in the lower-pH cis-Golgi/ERGIC, then retrieved to the ER by KDELR2 for reuse.
          When KDELR2 is inactive, HSP47 cannot bind KDELR2 and therefore cannot dissociate from collagen
          type I; it remains bound to monomeric and multimeric collagen molecules. Patient fibroblasts
          show an intracellular decrease of HSP47 (and FKBP65) with reduced procollagen type I in culture
          media, and electron microscopy shows abnormal secreted collagen fibrils with increased HSP47
          bound to collagen. This is the mechanistic mirror of OI type X, in which HSP47 (SERPINH1) is
          itself lost.
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: protein folding (HSP47 procollagen chaperoning/release)
          term:
            id: GO:0006457
            label: protein folding
          modifier: ABNORMAL
        - preferred_term: collagen biosynthetic process
          term:
            id: GO:0032964
            label: collagen biosynthetic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: in KDELR2-deficient individuals, OI most likely occurs because of the inability of HSP47
          to bind KDELR2 and dissociate from collagen type I.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33053334
      reference_title: Interaction between KDELR2 and HSP47 as a Key Determinant in Osteogenesis Imperfecta
        Caused by Bi-allelic Variants in KDELR2.
      evidence_source: IN_VITRO
      explanation: 'Establishes the core mechanism: loss of KDELR2 prevents HSP47 release from collagen
        type I, the defining pathophysiology of OI type XXI.'
