          term:
            id: GO:0001649
            label: osteoblast differentiation
          modifier: DECREASED
        - preferred_term: regulation of canonical Wnt signaling pathway
          term:
            id: GO:0060828
            label: regulation of canonical Wnt signaling pathway
          modifier: ABNORMAL
      selected_evidence:
        snippet: we demonstrated that CCDC134 mutations are associated with increased Erk1/2 phosphorylation,
          decreased OPN mRNA and COL1A1 expression and reduced mineralization in patient osteoblasts compared
          with controls.
        supports: SUPPORT
