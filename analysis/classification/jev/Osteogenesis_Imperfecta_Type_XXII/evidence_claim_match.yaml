        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Osteoblast Signaling and Impaired Bone Matrix Formation
        description: In CCDC134-deficient osteoblasts, ERK1/2 phosphorylation is increased while osteopontin
          (OPN) mRNA and COL1A1 expression and mineralization are reduced, indicating dysregulated osteoblast
          differentiation and bone-forming function. Independently, disruption of the CCDC134-HSP90B1-OST-A
          ER pathway impairs WNT and IGF1R receptor signaling, both osteogenic pathways, linking CCDC134
          loss to the LRP5/6-WNT and MAPK/ERK axes that govern bone formation.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
