              label: osteogenesis imperfecta, IIA 22
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CCDC134 Loss Eliminates a Secreted ER Regulator of Osteoblast Signaling
        description: CCDC134 encodes a secreted, endoplasmic-reticulum-resident protein that is widely
          expressed and regulates osteoblast differentiation and bone formation. It was originally implicated
          in the regulation of the MAPK/ERK signaling pathway, and is now understood as an ER luminal
          specificity factor that, with the oligosaccharyltransferase OST-A, protects the ER chaperone
          HSP90B1 (GRP94) during folding. The recurrent OI type XXII allele is a homozygous translation-start-site
          variant (c.2T>C) that abolishes CCDC134 protein, as confirmed by the absence of CCDC134 in patient
          cells.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: MAPK cascade (ERK1/2 signaling)
          term:
            id: GO:0000165
            label: MAPK cascade
          modifier: INCREASED
      selected_evidence:
        snippet: CCDC134 encodes a secreted protein widely expressed and implicated in the regulation
          of some mitogen-activated protein kinases (MAPK) signaling pathway.
        supports: SUPPORT
