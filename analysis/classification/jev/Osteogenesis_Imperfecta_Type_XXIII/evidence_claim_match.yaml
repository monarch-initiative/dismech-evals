  3129ec0c614df73e277f2654ac8eaa4a043fc7a8aed83cecd24d9720ead2f07c:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type XXIII
          disease_term:
            preferred_term: Osteogenesis imperfecta, type 23
            term:
              id: MONDO:0957988
              label: osteogenesis imperfecta, type 23
        context: []
      assertion_type: Genetic
      assertion:
        name: PHLDB1 Loss-of-Function (Frameshift) Variants
        association: Causative
        gene_term:
          preferred_term: PHLDB1 (pleckstrin homology-like domain family B member 1)
          term:
            id: hgnc:23697
            label: PHLDB1
        notes: OI type XXIII is caused by biallelic loss-of-function variants in PHLDB1. The defining
          report identified two frameshift alleles (NM_001144758.3:c.2392dup and NM_001144758.3:c.2690_2693del),
          each segregating as homozygous/biallelic within one of two unrelated families, with heterozygous
          unaffected parents. PHLDB1 is the only gene associated with this OI type to date and the molecular
          consequence is loss of PHLDB1 protein.
      selected_evidence:
        snippet: We identified biallelic NM_001144758.3:c.2392dup and NM_001144758.3:c.2690_2693del pathogenic
          variants in PHLDB1 in the affected patients, respectively, in the families; parents were heterozygous
          for these variants.
        supports: SUPPORT
    origin:
