            term:
              id: MONDO:0957988
              label: osteogenesis imperfecta, type 23
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic PHLDB1 Loss-of-Function Eliminates PHLDB1 Protein
        description: PHLDB1 encodes pleckstrin homology-like domain family B member 1, a protein with
          a reported role in insulin-dependent Akt phosphorylation. In OI type XXIII, biallelic frameshift
          variants reduce PHLDB1 mRNA expression in blood and skin fibroblasts and abolish the protein,
          as confirmed by western blot of cultured patient fibroblasts. This loss of PHLDB1 is the proximal
          molecular lesion; the downstream pathway by which it impairs bone is not yet established.
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: osteoblast differentiation
          term:
            id: GO:0001649
            label: osteoblast differentiation
          modifier: ABNORMAL
      selected_evidence:
        snippet: PHLDB1 encodes pleckstrin homology-like domain family B member-1 (PHLDB1) protein, which
          has a role in insulin-dependent Akt phosphorylation.
        supports: SUPPORT
    origin:
