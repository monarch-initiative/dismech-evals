      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Diagnosis
        description: OI type XXIII is suspected in a child with mild OI showing recurrent fractures and/or
          osteopenia together with regressive spondylometaphyseal changes (platyspondyly, short/bowed
          long bones, widened metaphyses). Because these features overlap other forms of OI and spondylometaphyseal
          dysplasia, diagnosis rests on identifying biallelic PHLDB1 loss-of-function variants by whole-exome
          or gene-panel sequencing; reduced PHLDB1 mRNA and loss of PHLDB1 protein in patient fibroblasts
          are supportive.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: Whole-exome sequencing and clinical evaluation were performed in five patients from two
          unrelated families.
        supports: SUPPORT
