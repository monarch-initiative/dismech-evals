  19717d5a0b141695bfe3b51f03307e8853061f039a51fb2aa94376baaec24fd0:
    claim:
      about:
        disease:
          name: Osteogenesis Imperfecta Type XXIII
          disease_term:
            preferred_term: Osteogenesis imperfecta, type 23
            term:
              id: MONDO:0957988
              label: osteogenesis imperfecta, type 23
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Bone Formation and Skeletal Fragility
        description: Loss of PHLDB1 produces a mild OI phenotype with recurrent fractures and/or osteopenia
          together with characteristic spondylometaphyseal changes (platyspondyly, short and bowed long
          bones, widened metaphyses). A distinctive feature is that the metaphyseal and vertebral changes
          regress after early childhood. Because the molecular link between PHLDB1 loss and the bone matrix
          defect has not been established, the mechanism connecting the proximal lesion to the skeletal
          phenotype remains tentative and is described here only at the level of the observed bone phenotype.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: ossification
          term:
            id: GO:0001503
            label: ossification
          modifier: ABNORMAL
        - preferred_term: bone mineralization
          term:
            id: GO:0030282
            label: bone mineralization
          modifier: DECREASED
      selected_evidence:
        snippet: Metaphyseal and vertebral changes regressed after early childhood, and no fractures occurred
          under bisphosphonate treatment.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
