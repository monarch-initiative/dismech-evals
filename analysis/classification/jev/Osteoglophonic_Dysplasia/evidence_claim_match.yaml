  60635179c3bfe5c3eecf5a055bf2e9e3696c97014a9a0955e00991728c96305f:
    claim:
      about:
        disease:
          name: Osteoglophonic Dysplasia
          disease_term:
            preferred_term: osteoglophonic dysplasia
            term:
              id: MONDO:0008150
              label: osteoglophonic dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FGF23 Excess and Renal Phosphate Wasting
        biological_scale: ORGANISM
        description: 'A subset of individuals with FGFR1-related OGD have elevated circulating FGF23 with
          consequent renal phosphate wasting and hypophosphatemia. FGF23 is produced chiefly by cells
          of the osteoblast/osteocyte lineage — the same lineage in which the activating FGFR1 allele
          is expressed — and acts on the proximal renal tubule to suppress phosphate reabsorption. This
          arm is biochemical rather than structural and is not part of the shared FGFR growth-plate/suture
          mechanism, so it is deliberately kept as a separate node with no `conforms_to` anchor: it is
          what makes OGD more than "Pfeiffer syndrome plus metaphyseal lesions".'
        cell_types:
        - preferred_term: Osteocyte
          term:
            id: CL:0000137
            label: osteocyte
        biological_processes:
        - preferred_term: phosphate ion homeostasis
          term:
            id: GO:0055062
            label: phosphate ion homeostasis
          modifier: DECREASED
      selected_evidence:
        snippet: Patients may have hypophosphatemia due to high FGF23 levels.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40260920
      reference_title: New Phenotypic Features in FGFR1-Related Osteoglophonic Dysplasia.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the FGF23-mediated route from the FGFR1 lesion to hypophosphatemia, the
        mechanistic step that the disease-level Hypophosphatemia phenotype otherwise had no node to hang
        from.
