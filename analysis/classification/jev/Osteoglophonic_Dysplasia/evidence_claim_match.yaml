              label: osteoglophonic dysplasia
        context: []
      assertion_type: Treatment
      assertion:
        name: Denosumab for aggressive central giant cell granuloma
        description: The metaphyseal/jaw fibro-osseous lesions of OGD can behave aggressively as recurrent
          central giant cell granulomas (CGCG). In a long-followed adult with molecularly characterized
          OGD whose maxillary CGCG recurred through repeated surgery and failed alendronate, switching
          to the anti-RANKL monoclonal antibody denosumab — which acts directly on the osteoclast-like
          giant cells of the lesion rather than indirectly on bone resorption — produced marked tumour
          regression. This is a single case, not a trial, and denosumab in a growing skeleton carries
          its own hazards (medication-related osteonecrosis of the jaw, hypocalcaemia, atypical fracture,
          post-treatment rebound), so it is recorded here as an emerging lesion-directed option rather
          than standard care.
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: denosumab
            term:
              id: NCIT:C61313
              label: Denosumab
      selected_evidence:
        snippet: The therapeutic switch resulted in marked tumor regression, effectively reducing surgical
          burden and improving quality of life.
        supports: SUPPORT
