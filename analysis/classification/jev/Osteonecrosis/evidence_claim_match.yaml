      assertion_type: Environmental
      assertion:
        name: Gut dysbiosis
        description: 'Intestinal dysbiosis is associated with avascular necrosis, particularly in glucocorticoid-
          and alcohol-associated forms. Dysbiosis relates to reduced short-chain fatty acid (SCFA) production,
          altered immune function, and vascular impairment. However, a causal mechanistic relationship
          has not been established in humans, and the pathway remains largely characterized through animal
          models and cross-sectional association.

          '
        effect: Contributing predisposing factor (hypothesis-based; requires confirmation)
        notes: 'Current evidence is primarily from animal models and cross-sectional human studies, with
          Mendelian randomization supporting causal contribution of selected microbial taxa. Well-designed
          longitudinal and interventional investigations are needed to clarify causality and therapeutic
          potential in human AVN.


          No exposure_term is bound. ECTO was searched for a dysbiosis concept and has no suitable term:
          dysbiosis is a host-microbiome state rather than an external exposure, and the ECTO exposure
          classes that come closest name an ingested agent or a diet rather than the resulting microbial
          community shift. The sibling dysbiosis models in Atopic_Dermatitis and Celiac_Disease are likewise
          unbound. This is recorded so environmental-term-audit''s UNBOUND classification here reads as
          a deliberate decision rather than an un-researched gap.


          Conformance to kb/modules/gut_dysbiosis.yaml was considered and rejected. That module frames
          microbiota drift as an age-associated aging hallmark, whereas the dysbiosis described here is
          glucocorticoid- and alcohol-associated, and there is no barrier-translocation evidence in AVN
