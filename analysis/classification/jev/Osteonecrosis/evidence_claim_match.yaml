          term:
            id: GO:0045444
            label: fat cell differentiation
          modifier: INCREASED
        - preferred_term: Lipid metabolic process
          term:
            id: GO:0006629
            label: lipid metabolic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: "The genes of Wnt/β-catenin pathway may have potential roles in fat accumulation \nof\
          \ Non-traumatic osteonecrosis of the femoral head (ONFH)"
        supports: SUPPORT
