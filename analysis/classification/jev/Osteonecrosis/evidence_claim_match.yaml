        name: Traumatic
        display_name: Traumatic (post-traumatic) osteonecrosis
        description: 'Osteonecrosis caused by mechanical disruption of the blood supply to bone, classically
          following femoral neck fracture or hip dislocation. In adolescents after femoral neck fracture
          surgery, ONFH incidence is high (approximately 24%). The vascular anatomy of the femoral head,
          dependent on retinacular vessels, makes it especially vulnerable to post-fracture ischemia.

          '
      selected_evidence:
        snippet: "the incidence of ONFH after FNF surgery in adolescents was 24.02% [95% CI \n(0.2118,\
          \ 0.2712)]"
        supports: SUPPORT
