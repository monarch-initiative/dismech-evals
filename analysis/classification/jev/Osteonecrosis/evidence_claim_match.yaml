      assertion_type: Pathophysiology
      assertion:
        name: Marrow adipogenesis and lipotoxicity
        description: 'Glucocorticoid- and alcohol-associated osteonecrosis is characterized by a shift
          of mesenchymal stem cell differentiation toward adipocytes at the expense of osteoblasts, with
          lipid accumulation in marrow. Increased marrow adipogenesis raises intraosseous pressure and
          produces lipotoxic injury, contributing to osteocyte death and impaired bone formation. Lipid
          metabolism disorder is an independent associated factor in steroid-induced ONFH, and Wnt/beta-catenin
          pathway variants linked to ONFH are associated with serum lipid disorder.

          '
        locations:
        - preferred_term: Bone marrow
          term:
            id: UBERON:0002371
            label: bone marrow
        cell_types:
        - preferred_term: Mesenchymal stem cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
        - preferred_term: Adipocyte
