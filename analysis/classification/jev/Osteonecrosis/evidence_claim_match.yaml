              id: MONDO:0005380
              label: osteonecrosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired angiogenesis-osteogenesis coupling
        description: 'The femoral head contains specialized H-type microvessels that couple angiogenesis
          to osteogenesis. Glucocorticoids inhibit H-type vessel formation by reducing expression of HIF-1-alpha,
          PDGF-BB, and VEGF, damaging the angiogenesis-osteogenesis coupling and reducing the capacity
          for necrosis reconstruction and repair of the femoral head. A 2024 mechanistic mouse study further
          linked glucocorticoid suppression of hypothalamic sympathetic tone to endothelial apoptosis
          and loss of H-type vessels in the femoral head.

          '
        locations:
        - preferred_term: Head of femur
          term:
            id: UBERON:0006767
            label: head of femur
        cell_types:
        - preferred_term: Endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        - preferred_term: Osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: Response to hypoxia
          term:
            id: GO:0001666
            label: response to hypoxia
        - preferred_term: Osteoblast differentiation
          term:
            id: GO:0001649
            label: osteoblast differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: "Glucocorticoids may inhibit the formation of H-type vessels by reducing the expression\
          \ of \nHIF-1α, PDGF-BB, VGEF and other factors, thus causing damage to the \n\"angiogenesis-osteogenesis\
          \ coupling\" and reducing the ability of necrosis \nreconstruction and repair of the femoral\
          \ head."
        supports: SUPPORT
