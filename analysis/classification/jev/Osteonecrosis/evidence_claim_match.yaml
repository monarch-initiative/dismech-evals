        display_name: Alcohol-associated osteonecrosis
        description: 'Non-traumatic osteonecrosis attributed to heavy alcohol consumption. The ARCO research
          classification uses a threshold of more than 320 g/week of alcohol with diagnosis within 1 year
          and no other major risk factor. Alcohol accounts for a large share (roughly one third to nearly
          half) of non-traumatic ONFH cases in Asia. Implicated mechanisms include alcohol metabolite
          toxicity, oxidative stress, and lipid dysregulation.

          '
      selected_evidence:
        snippet: "A description of the \nAssociation Research Circulation Osseous (ARCO) criteria for\
          \ classification of \nglucocorticoids- and alcohol-associated ONFH"
