  c1abedef069c93452777f9b8e844a90ccd2014302136b680b67560fa3219a963:
    claim:
      about:
        disease:
          name: Osteonecrosis
          disease_term:
            preferred_term: osteonecrosis
            term:
              id: MONDO:0005380
              label: osteonecrosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: disc_osteonecrosis_dysbiosis_axis
        prompt: Does dysbiosis-mediated immune and vascular dysfunction constitute a distinct pathogenic
          mechanism in osteonecrosis, or a modulating factor in established etiologies (glucocorticoid-
          and alcohol-associated disease) — or do dysbiosis and disease simply co-occur downstream of
          shared drivers such as glucocorticoid exposure and heavy alcohol?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Vascular supply disruption and microvascular injury
        - pathophysiology#Marrow adipogenesis and lipotoxicity
        - pathophysiology#Impaired angiogenesis-osteogenesis coupling
        - environmental#Gut dysbiosis
        rationale: The gut-bone axis in AVN is assembled entirely from indirect evidence. Human data are
          cross-sectional microbiota-metabolome signatures, which cannot order dysbiosis and disease in
          time; reversal of pathological change is shown in animals rather than patients; and the causal
          claim rests on Mendelian randomization, which supports a contribution of selected taxa without
          identifying the intermediate steps. The proposed route runs dysbiosis → reduced SCFA → epithelial
          barrier dysfunction → immune activation → vascular endothelial injury, feeding "Vascular supply
          disruption", with dysbiosis-mediated metabolic dysregulation potentially compounding lipotoxicity.
          Glucocorticoid exposure and heavy alcohol are established causes of AVN in this entry and are
          also causes of dysbiosis, so confounding by shared driver is the live alternative to a gut-bone
          pathway. Resolving this decides whether the two influences_mechanisms edges recorded here are
          mechanism or correlation, and whether microbiota-targeted intervention is worth pursuing in
          AVN at all.
        proposed_experiments:
        - experiment_id: exp_avn_longitudinal_microbiome_cohort
          name: Longitudinal microbiome cohort in at-risk glucocorticoid recipients
          description: Follow patients starting high-dose glucocorticoid therapy with serial stool metagenomics,
            SCFA metabolomics, and scheduled MRI, so that microbiota change can be ordered against the
            first appearance of osteonecrotic lesions rather than sampled after diagnosis. Stratify by
            etiology (glucocorticoid-associated, alcohol-associated, traumatic, idiopathic) against matched
            controls. Readouts include taxa abundance, SCFA-producing capacity, lipopolysaccharide production,
            biomarkers of intestinal barrier integrity (zonula occludens-1, lipopolysaccharide-binding
            protein), and systemic immune activation (C-reactive protein, cytokine panels).
          would_support:
          - pathophysiology#Vascular supply disruption and microvascular injury
          decision_criterion: Supports the gut-bone pathway if dysbiosis and falling SCFA levels precede
            the earliest MRI lesion and the magnitude of the shift tracks subsequent lesion burden after
            adjustment for cumulative steroid dose. Refutes it if microbiota composition changes only
            after lesions are established, or if the association disappears once cumulative glucocorticoid
            dose is adjusted for, which would indicate a shared driver rather than a gut-bone pathway.
        - experiment_id: exp_avn_microbiota_targeted_intervention
          name: Microbiota-targeted intervention trial in early AVN
          description: 'Randomize patients with early pre-collapse glucocorticoid- or alcohol-associated
            disease to a microbiota-targeted intervention (SCFA supplementation, a defined consortium,
            prebiotics, probiotics, or fecal microbiota transplant) versus standard care, to test the
            axis interventionally in humans rather than in animal models. Endpoints: radiographic progression
            to collapse by ARCO staging, MRI progression, pain scores, SCFA levels, and biomarkers of
            barrier function and systemic immune activation.'
          would_support:
          - pathophysiology#Impaired angiogenesis-osteogenesis coupling
          decision_criterion: Supports the axis if the intervention arm shows reduced lesion progression
            alongside restored SCFA levels. Refutes it if SCFA levels rise as intended but lesion progression
            is unchanged, separating the metabolic readout from the bone outcome.
        - experiment_id: exp_osteonecrosis_dysbiosis_mechanism
          name: Mechanistic studies of dysbiosis-derived metabolites on bone cells
          description: 'In vitro and ex vivo mechanistic studies using human primary or iPSC-derived intestinal
            epithelial and endothelial cells to test whether osteonecrosis-associated dysbiosis-derived
            metabolites (depleted SCFA, elevated lipopolysaccharide) impair epithelial barrier integrity,
            increase endothelial apoptosis, and activate pro-inflammatory immune responses comparable
            to those observed in patient serum. Co-culture of these cells with osteocytes and osteoblasts
            would determine whether barrier-derived soluble factors suppress osteogenic differentiation
            and promote ischemic sensitivity.

            '
        posed_date: '2026-08-19T00:00:00Z'
      selected_evidence:
        snippet: AVN, particularly glucocorticoid- and alcohol-associated forms, is consistently associated
          with intestinal dysbiosis, reduced production of short-chain fatty acids, immune activation,
          vascular impairment, and altered bone remodeling.
        supports: SUPPORT
