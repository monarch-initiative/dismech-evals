      assertion_type: Subtype
      assertion:
        name: Corticosteroid-induced
        display_name: Glucocorticoid-associated osteonecrosis
        description: 'The most common type of non-traumatic osteonecrosis, caused by glucocorticoid exposure.
          The ARCO research classification requires a history of glucocorticoid use greater than 2 g of
          prednisolone-equivalent within a 3-month period, with osteonecrosis diagnosed within 2 years
          and no other major risk factor. Risk is dose-dependent. Glucocorticoids promote marrow adipogenesis,
          lipotoxicity, endothelial dysfunction, and impaired H-type vessel formation.

          '
      selected_evidence:
        snippet: "patients should have a history of glucocorticoid use >2 g of \nprednisolone or its equivalent\
          \ within a 3-month period; (2) osteonecrosis should \nbe diagnosed within 2 years after glucocorticoid\
          \ usage, and (3) patients should \nnot have other risk factor(s) besides glucocorticoids."
        supports: SUPPORT
