        notes: 'Osteonecrosis is largely a complex (non-Mendelian) disease with susceptibility loci and
          pathway-level genetic architecture. In a Chinese Han case-control study (560 subjects), variants
          in the Wnt/beta-catenin pathway genes GSK3B (rs334558), SFRP4 (rs1052981), and LRP5 (rs312778)
          were significantly associated with ONFH risk and clinical traits, with paired variant interactions
          associated with bilateral hip lesions and stage IV disease. These variants were also linked
          to serum lipid disorder and abnormal platelet/coagulation function, consistent with the lipid
          and coagulation mechanisms of disease.

          '
