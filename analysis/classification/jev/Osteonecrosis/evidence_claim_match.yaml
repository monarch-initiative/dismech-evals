      assertion_type: Pathophysiology
      assertion:
        name: Vascular supply disruption and microvascular injury
        description: 'The initiating event in osteonecrosis is disruption of the blood supply to bone.
          This may be mechanical (traumatic vessel disruption after fracture/dislocation), occlusive (sickled
          erythrocytes, nitrogen gas emboli, thrombosis), or the result of glucocorticoid- and alcohol-induced
          endothelial dysfunction, coagulopathy, and hypofibrinolysis. Across non-traumatic etiologies,
          endothelial dysfunction within a chronic inflammatory milieu produces thrombosis, coagulopathy,
          and poor angiogenesis, preventing effective repair and revascularization of bone lesions.

          '
        locations:
