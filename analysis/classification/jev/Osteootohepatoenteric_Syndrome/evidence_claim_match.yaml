      assertion_type: Pathophysiology
      assertion:
        name: Loss of UNC45A Myosin Co-Chaperone Function
        biological_scale: MOLECULAR
        description: 'UNC45A is a UCS-family myosin co-chaperone with a three-domain architecture: the
          C-terminal UCS domain binds the myosin motor domain, the N-terminal tetratricopeptide-repeat
          domain binds Hsp90, and a central domain connects them. Vertebrates carry two non-redundant
          isoforms; UNC45B is confined to striated muscle and causes myopathy, while UNC45A is ubiquitous.
          That division is why this disease is not a myopathy.'
        molecular_functions:
        - preferred_term: myosin co-chaperone activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0044183
            label: protein folding chaperone
      selected_evidence:
        snippet: All UNC45 proteins share the same 3-domain organization, with a C-terminal UCS domain,
          which binds the motor domain of myosin, a less-conserved central domain of unknown function
          and an N-terminal tetratricopeptide repeat (TPR) domain that binds to Hsp90.
        supports: SUPPORT
