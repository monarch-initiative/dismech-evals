          export pump; it shifts the composition of the circulating bile acid pool towards a less cytotoxic
          species, so the hepatocyte tolerates the retained load better.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
