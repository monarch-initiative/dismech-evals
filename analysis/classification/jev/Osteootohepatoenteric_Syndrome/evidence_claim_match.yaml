      assertion:
        name: Biallelic UNC45A Loss of Function
        biological_scale: MOLECULAR
        description: 'Two mechanistic classes of allele converge on the same endpoint. Nonsense and frameshift
          alleles abolish the protein outright. Missense alleles are subtler and more informative: several
          are expressed at normal levels in transfected cells yet still fail to rescue, and for the p.Val423Asp
          allele the defect was shown to be protein instability rather than loss of a specific function.
          Thr230 and Leu237 both map to the third armadillo repeat of the central domain, the segment
          that connects the Hsp90-binding and myosin-binding ends.'
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: loss-of-function paradigm, wherein mutations attenuated or abolished protein activity
          with concomitant defects in gut development and function.
        supports: SUPPORT
