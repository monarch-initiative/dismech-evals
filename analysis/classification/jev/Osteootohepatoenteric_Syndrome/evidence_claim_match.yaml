          previously associated with microvillus inclusion disease - MYO5B, STX3, STXBP2 - were excluded
          in the patients, which is what makes UNC45A a distinct cause rather than a modifier. Two further
          points matter for interpreting a new variant. p.Leu237Pro is not a null: it retains chaperone
          activity and fails by trapping its client, so it is modelled as a separate NEOMORPHIC pathophysiology
          node rather than folded into the loss-of-function one. And UNC45A is allelic to a second disease
          - a 5''-UTR variant causes Aagenaes syndrome (lymphoedema cholestasis syndrome 1), which shares
          the neonatal cholestasis but adds lymphoedema and is not this entity.'
