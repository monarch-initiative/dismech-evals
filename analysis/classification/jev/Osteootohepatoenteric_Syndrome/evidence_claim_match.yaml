            term:
              id: MONDO:0859164
              label: osteootohepatoenteric syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: UNC45A
        gene_term:
          preferred_term: UNC45A
          term:
            id: hgnc:30594
            label: UNC45A
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'Biallelic variants; 23 exons encoding a 944-residue protein with TPR, armadillo, neck
          and UCS domains. Reported alleles include p.Arg241Ter and p.Asp484GlufsTer31 (no detectable
          protein), the missense alleles p.Thr230Arg, p.Leu237Pro, p.Glu728Lys and p.Ala838Pro (protein
          expressed at wild-type levels but non-functional in rescue), p.Val423Asp (destabilized), and
          the compound heterozygous p.Arg819Ter with p.Leu237Pro in a Chinese neonate. Variants in genes
          previously associated with microvillus inclusion disease - MYO5B, STX3, STXBP2 - were excluded
          in the patients, which is what makes UNC45A a distinct cause rather than a modifier. Two further
          points matter for interpreting a new variant. p.Leu237Pro is not a null: it retains chaperone
          activity and fails by trapping its client, so it is modelled as a separate NEOMORPHIC pathophysiology
          node rather than folded into the loss-of-function one. And UNC45A is allelic to a second disease
          - a 5''-UTR variant causes Aagenaes syndrome (lymphoedema cholestasis syndrome 1), which shares
          the neonatal cholestasis but adds lymphoedema and is not this entity.'
      selected_evidence:
        snippet: Whole-exome sequencing of all affected individuals and their parents identified biallelic
          mutations in Unc-45 Myosin Chaperone A (UNC45A) as a likely driver for this disorder.
        supports: SUPPORT
