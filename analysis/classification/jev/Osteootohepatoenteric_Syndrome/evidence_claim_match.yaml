  e6c268a05d3a6109444989db6687af73c9bdcfc13d732d7c6bab7f0e9a4c1ca9:
    claim:
      about:
        disease:
          name: Osteootohepatoenteric Syndrome
          disease_term:
            preferred_term: osteootohepatoenteric syndrome
            term:
              id: MONDO:0859164
              label: osteootohepatoenteric syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Chaperone-Myosin Complex Dissociation
        biological_scale: MOLECULAR
        description: 'The mechanism of the recurrent p.Leu237Pro allele, and the reason this entry does
          not treat every variant as a null. The mutant protein still chaperones: it prevents myosin aggregation
          and supports normal nonmuscle myosin II filament formation. What it cannot do is let go. It
          forms atypically stable oligomers that hold the chaperone-myosin complex together, and the trapped
          myosin is therefore unavailable, so the cellular consequence converges on the same trafficking
          failure as outright deficiency.'
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: NEOMORPHIC
        molecular_functions:
        - preferred_term: availability of nonmuscle myosin II released from the chaperone
          modifier: DECREASED
        notes: 'The molecular function here is deliberately unbound. An earlier revision used GO:0017022
          (myosin binding) with modifier DECREASED, which asserts the opposite of what this node describes:
          binding is not reduced, it is abnormally persistent, and what falls is the supply of myosin
          the complex has released. GO has no term for the released-and-usable fraction, and binding is
          the only nearby concept, so no term beats a term pointing the wrong way. A reader querying for
          decreased myosin binding would have got this node back and drawn the wrong conclusion from it.'
      selected_evidence:
        snippet: The UNC45A p.Leu237Pro mutant retained chaperone activity, prevented myosin aggregation,
          and supported proper nonmuscle myosin II (NMII) filament formation in patient fibroblasts and
          human osteosarcoma (U2OS) cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40125554
      reference_title: Altered chaperone-nonmuscle myosin II interactions drive pathogenicity of the UNC45A
        c.710T>C variant in osteo-oto-hepato-enteric syndrome.
      evidence_source: IN_VITRO
      explanation: Establishes that this allele is not a loss of chaperone activity, which is what rules
        out folding it into the loss-of-function node.
