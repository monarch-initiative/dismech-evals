          name: Osteootohepatoenteric Syndrome
          disease_term:
            preferred_term: osteootohepatoenteric syndrome
            term:
              id: MONDO:0859164
              label: osteootohepatoenteric syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: extraintestinal_mechanism_unknown
        kind: KNOWLEDGE_GAP
        prompt: What is the mechanism of the bone, ear and liver involvement, and does any of it run through
          myosin VB?
        attaches_to:
        - pathophysiology#Loss of UNC45A Myosin Co-Chaperone Function
        - phenotypes#Pathologic fracture
        - phenotypes#Sensorineural hearing impairment
        - phenotypes#Intrahepatic cholestasis
        rationale: 'Two of the four organs in the syndrome name have no mechanism in this entry, and that
          is a statement about the literature rather than about the curation. The enteropathy is traced
          to myosin VB, and the liver now has an observation of its own - reduced UNC45A with mislocalized
          BSEP in a patient biopsy - though which myosin client carries that defect is unknown, which
          is why that edge is indirect. For hearing and bone there is nothing: UNC45A folds nonmuscle
          myosin II and myosin IB as well as myosin VB, and myosin motors are central to both stereocilia
          function and osteoblast mechanics, so both are reasonable starting hypotheses and neither has
          been tested. The entry records them as phenotypes without upstream edges rather than inventing
          the chain.'
      selected_evidence:
        snippet: UNC45A is required for proper folding of MYO15A. MYO15A is necessary for elongation and
          maintenance of inner ear hair cell stereocilia
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36699472
      reference_title: 'Case report: Osteo-oto-hepato-enteric syndrome caused by UNC45A deficiency.'
      evidence_source: OTHER
      explanation: The most specific candidate mechanism anyone has put in print for the deafness, and
        the reason it is cited here rather than drawn as a pathograph edge. It appears in a case report's
        discussion as an inference from two separate literatures - that UNC45A folds MYO15A, and that
        MYO15A maintains stereocilia - and neither of the three UNC45A papers cited in this entry mentions
        MYO15A at all. evidence_source is OTHER because the passage is a review argument, not a result.
        Naming the hypothesis is what makes the gap testable; asserting it would make it look closed.
