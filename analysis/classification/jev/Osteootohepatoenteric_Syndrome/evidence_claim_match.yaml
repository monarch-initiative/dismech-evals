          term:
            id: HP:0001406
            label: Intrahepatic cholestasis
        notes: Deliberately not given a target_mechanisms link. Every mechanism node in this entry is
          a trafficking or folding defect, and ursodeoxycholic acid acts on none of them - it changes
          the bile acid pool the failing canalicular step has to handle. Attaching it to Bile Salt Export
          Pump Mislocalization would assert a mechanism of action the evidence does not carry, so the
          treatment is linked to the phenotype it relieves instead.
      selected_evidence:
        snippet: The patient was managed with ursodeoxycholic acid (UDCA)-based treatments, and the clinical
