      assertion_type: ProgressionInfo
      assertion:
        phase: Infantile remission of the hepatic and intestinal features
        age_range: first year of life
        notes: 'Recorded because the entry otherwise reads as uniformly severe, which the cohort does
          not support. Both defining visceral features have resolved in reported patients: the literature
          table records cholestasis resolving at 2.5 and 3 years in three of the earlier patients, and
          the 2022 Chinese case had diarrhoea and cholestasis both resolve by 6 months and was off all
          drugs and growing normally at 1 year. This is a single reported course and is not a prognosis;
          the same paper cautions that hearing loss and bone fragility can declare themselves years later
          in patients whose gut and liver have settled, so remission of two organs is not remission of
          the disease.'
      selected_evidence:
        snippet: In contrast, our patient only suffered with mild diarrhea (3–5 times/day) and recovered
          along with cholestasis relief at the age of 6 months.
        supports: SUPPORT
