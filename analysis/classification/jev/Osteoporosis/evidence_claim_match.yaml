          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Microarchitectural Deterioration
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: Aged mice lose cancellous bone, thin their cortices and gain cortical porosity as
          humans do, and the histologic cause is shared - resorption cavities that osteoblasts fail to
          refill.
        limitations: The murine skeleton keeps growing slowly after puberty and has no osteonal remodeling
          of cortical bone, so the human intracortical remodeling compartment has no counterpart in it.
          Cortical findings therefore arise through a different structural process than the one they are
          taken to model.
      selected_evidence:
        snippet: like humans, mice exhibit loss of cancellous bone, thinning of cortical bone, and increased
          cortical porosity with advancing age
        supports: SUPPORT
