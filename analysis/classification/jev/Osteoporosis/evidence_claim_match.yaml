      reference_title: 'Vertebral Fractures After Discontinuation of Denosumab: A Post Hoc Analysis of
        the Randomized Placebo-Controlled FREEDOM Trial and Its Extension.'
      evidence_source: HUMAN_CLINICAL
      explanation: Contradicts reading denosumab as a durable intervention. Unlike bisphosphonates, its
