  033dbd6cb128136d696e955263e501c1a2c20eec0890cd350d06fcbd16ecd838:
    claim:
      about:
        disease:
          name: Osteoporosis
          disease_term:
            preferred_term: osteoporosis
            term:
              id: MONDO:0005298
              label: osteoporosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_op_rodent_cortical_remodeling
        prompt: Almost everything known about the cellular mechanism of age-related bone loss comes from
          mice and rats, whose skeletons have no osteonal remodeling of cortical bone and continue growing
          slowly after puberty. Human cortical bone loss proceeds largely through intracortical Haversian
          remodeling, a compartment that does not exist in the rodent. When an aged mouse gains cortical
          porosity, is that the same process that produces cortical porosity in an ageing human, or a
          structurally different route to a phenotype that merely looks alike on microCT?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        rationale: 'This is not a general caveat about rodents; it is specific and consequential. The
          cortical compartment carries most of the fracture burden after age 65 - predominantly cortical
          non-vertebral sites account for 80% of all fractures in old age, 68% of radial bone loss between
          50 and 80 is cortical, and 84% of it occurs after 65 - and cortical porosity is the parameter
          that intervention studies in mice report. In humans that porosity arises specifically from intracortical
          remodeling adjacent to the marrow outrunning refill, which fragments the inner cortex into a
          trabecula-like structure. If the murine gain in porosity arises without Haversian remodeling,
          then the mechanistic step being modelled is absent from the model, and a treatment effect on
          murine cortical bone cannot be assumed to transfer. The same limitation constrains the OVX rat,
          which is the FDA-designated preclinical model, and it is why the same guidance requires a second
          non-rodent species alongside it - large-animal cortical bone does undergo Haversian remodeling.
          Note the mismatch is partial rather than total: the cancellous arm and the refilling defect
          are shared, and this entry records those links at moderate fidelity for that reason.'
        attaches_to:
        - pathophysiology#Microarchitectural Deterioration
        - animal_models#Aged mouse skeleton as a model of human age-related bone loss
        - animal_models#Ovariectomized rat
      selected_evidence:
        snippet: Knowledge of the causes of skeletal fragility in mice should therefore be applicable
          to humans if inherent limitations are recognized.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23689830
      reference_title: The relevance of mouse models for investigating age-related bone loss in humans.
      evidence_source: MODEL_ORGANISM
      explanation: The author's own conditional endorsement - the model is usable but only with the mismatch
        made explicit, which is what this record does.
