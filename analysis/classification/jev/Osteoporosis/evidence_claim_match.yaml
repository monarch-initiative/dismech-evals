      assertion:
        discussion_id: gap_op_senescent_burden_stratification
        prompt: 'Clearing senescent cells causally reverses age-related bone loss in old mice, yet a phase
          2 trial of intermittent dasatinib plus quercetin in postmenopausal women missed its primary
          endpoint: CTx did not differ from control at 20 weeks. Formation rose transiently, and in an
          exploratory subgroup with the highest T cell p16 burden both markers moved and radius BMD increased.
          Is senescent cell burden the effect modifier that decides who responds, and is there a measurable
          threshold below which senolytic therapy should not be expected to work?'
        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: The mouse work is unusually strong - genetic and pharmacological clearance agree, the
          effect is absent in young animals, and the in vitro SASP experiment supplies the mechanism -
          so a negative human primary endpoint is more likely to reflect patient selection, dose, or timing
          than a false preclinical result. Postmenopausal women shortly after menopause are oestrogen-deficient
          rather than necessarily senescence-burdened, so the trial may have been run in the population
          least likely to respond. The subgroup finding is exploratory and underpowered and must not be
          read as a positive result; it is a hypothesis about stratification. Resolving this decides whether
          senolytics are an osteoporosis therapy at all, or a therapy for a definable high-burden subset.
        attaches_to:
        - pathophysiology#Senescent Cell Accumulation in the Bone Microenvironment
        - pathophysiology#Osteocyte SASP Acquisition
      selected_evidence:
        snippet: In aged (20- to 22-month-old) mice with established bone loss, activation of the INK-ATTAC
          caspase 8 in senescent cells or treatment with senolytics or the JAKi for 2-4 months resulted
          in higher bone mass and strength and better bone microarchitecture than in vehicle-treated mice.
        supports: SUPPORT
