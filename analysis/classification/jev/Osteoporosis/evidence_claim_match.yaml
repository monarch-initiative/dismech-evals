      assertion:
        target: Bone Remodeling Imbalance
        causal_link_type: DIRECT
        description: Clearing senescent cells lowers resorption while maintaining trabecular and raising
          cortical formation, which is the remodeling imbalance running in reverse.
      selected_evidence:
        snippet: The beneficial effects of targeting senescent cells were due to lower bone resorption
          with either maintained (trabecular) or higher (cortical) bone formation as compared to vehicle-treated
