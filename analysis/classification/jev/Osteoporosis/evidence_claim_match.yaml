              id: MONDO:0005298
              label: osteoporosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_op_no_aging_capable_nam
        prompt: Every non-animal model recorded in this entry is either a murine immortalized cell line
          or a weeks-long human organoid built around a non-aging driver. No available NAM sustains a
          coupled remodeling unit long enough, or under enough mechanical loading, to express an aging
          phenotype. What would a human-cell-based system need in order to model age-related rather than
          tumour- or cytokine-driven bone loss?
        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: 'This is a tooling gap that propagates into every mechanistic claim in the aging arm
          of this entry. The senescence nodes rest on murine in vivo work plus conditioned-medium experiments;
          the marrow-lineage node rests on human biopsies with no functional system behind it. Because
          the rodent cortical mismatch recorded above limits what animal work can settle, the absence
          of an aging-capable human system is not a minor inconvenience - it is why two of this entry''s
          three aging nodes cannot currently be tested in human cells at all. Candidate requirements:
          human osteocytes embedded in mineralized matrix, an osteoclast compartment, a marrow adipocyte
          compartment, physiological loading, and culture durations long enough for senescence to accumulate.'
        attaches_to:
        - experimental_models#
        - pathophysiology#Osteocyte SASP Acquisition
        - pathophysiology#Marrow Stromal Lineage Shift Toward Adipogenesis
      selected_evidence:
        snippet: Recently, pre-clinical studies have linked the onset of age-related bone loss with an
          accumulation of senescent cells in the bone microenvironment.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
