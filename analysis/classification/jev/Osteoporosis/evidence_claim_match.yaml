          progenitor pool, supports osteoblast number and mineralization, and constrains adipogenic skewing,
          so loss of osteoblastic EGFR reduces trabecular bone mass. At the same time, EGFR activity can
          increase osteoclast number and influence the RANKL/OPG axis, meaning the receptor''s effect
          on net remodeling depends on which compartment is engaged. Because EGFR feeds multiple downstream
          branches (MAPK/ERK, PI3K/Akt, NF-kB) that diverge between formation and resorption programs,
          a nonselective EGFR inhibitor risks suppressing the anabolic osteoblastic arm while incompletely
          controlling resorption. The Wang et al. (2026) review explicitly identifies the cell-type-specific
          and spatiotemporal mapping of EGFR activation and the mechanisms of its allosteric modulation
          as open questions for skeletal disease. Resolving where and when EGFR is anabolic versus pro-resorptive
          in osteoporotic bone is a prerequisite for designing bone-targeted, pathway-selective EGFR modulators
          that protect bone mass and microarchitecture.'
        proposed_experiments:
        - experiment_id: exp_op_egfr_celltype_activation_mapping
          name: Cell-type-resolved mapping of EGFR activation in the osteoporotic bone-remodeling unit
          description: In ovariectomized and aged mouse models of bone loss (and in human iliac-crest
            or hip specimens), use single-cell/spatial transcriptomics with phospho-EGFR immunostaining
            to localize EGFR pathway activation (MAPK/ERK, PI3K/Akt, NF-kB) across mesenchymal progenitors,
            osteoblasts, osteocytes, and osteoclasts. Pair this with lineage-specific EGFR gain- and loss-of-function
            and an allosteric vs. ATP-competitive inhibitor comparison to determine whether EGFR modulation
            can preserve osteoblastic bone formation while limiting osteoclast-mediated resorption, with
            readouts on trabecular microarchitecture.
          experiment_type:
            preferred_term: spatial single-cell multi-omics with conditional perturbation
          readouts:
          - name: Lineage-resolved EGFR activation and remodeling balance
            target: pathophysiology#Bone Remodeling Imbalance
            description: 'Quantify phospho-EGFR and downstream pathway activity separately in osteoblast-lineage
              vs. osteoclast-lineage cells alongside formation (osteoblast number, mineral apposition)
              and resorption indices to map where EGFR drives anabolic vs. catabolic output.

              '
            assays:
            - preferred_term: phospho-EGFR immunohistochemistry
            - preferred_term: single-cell RNA sequencing
            direction: NEGATIVE
          - name: EGFR effect on the RANKL/OPG axis
            target: pathophysiology#RANKL/OPG Dysregulation
            description: 'Measure RANKL and OPG expression and osteoclast differentiation under cell-type-targeted
              EGFR perturbation to test whether EGFR activity in the osteoblast/stromal compartment shifts
              the RANKL/OPG ratio toward osteoclastogenesis.

              '
            assays:
            - preferred_term: RANKL and OPG quantification
            - preferred_term: osteoclast differentiation assay
            direction: POSITIVE
          - name: Trabecular microarchitecture response to EGFR modulation
            target: pathophysiology#Microarchitectural Deterioration
            description: 'Assess trabecular bone volume, number, thickness, and connectivity by micro-CT
              after lineage-specific EGFR loss/gain and after allosteric vs. pan-EGFR inhibition to detect
              protection or worsening of bone microarchitecture.

              '
            assays:
            - preferred_term: micro-computed tomography
            direction: NEGATIVE
          decision_criterion: The cell-type-specific dual-role model is supported if (1) phospho-EGFR
            mapping shows distinct activation between osteoblast- and osteoclast-lineage cells, (2) osteoblastic
            EGFR loss reduces bone formation and trabecular mass while (3) EGFR perturbation measurably
            shifts the RANKL/OPG axis, and (4) an allosteric/bone-targeted modulator preserves microarchitecture
            better than a pan-EGFR inhibitor.
          would_support:
          - pathophysiology#Bone Remodeling Imbalance
          - pathophysiology#RANKL/OPG Dysregulation
          - pathophysiology#Microarchitectural Deterioration
      selected_evidence:
        snippet: 'this review highlights several unresolved questions: the cell-type-specific and spatiotemporal
          mapping of EGFR activation, the precise mechanisms of its allosteric modulation, and the development
          of tissue-targeted, non-oncological EGFR delivery systems.'
        supports: SUPPORT
