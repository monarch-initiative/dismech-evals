      assertion:
        name: QCT-based finite element model of the proximal femur
        model_type: PHYSIOLOGICAL
        description: A patient-specific structural model built from a quantitative CT scan of the hip,
          solving for femoral strength and for the ratio of the load a fall would impose to the strength
          available to resist it. It is the computational counterpart of this entry's claim that microarchitecture
          and geometry carry fracture risk that areal BMD alone does not.
        modeled_mechanisms:
        - target: Microarchitectural Deterioration
          relationship: MEASURES
          fidelity: MODERATE
          description: Turns the structural deterioration this node describes into a mechanical quantity
            that prospectively predicts hip fracture, and the load-to-strength ratio stays predictive
            after adjustment for areal BMD.
          limitations: Resolves geometry and density at CT scale, so it does not represent trabecular
            connectivity or cortical porosity directly, and it says nothing about the cellular mechanisms
            upstream. Validated here in older men; the cohort is not the population most affected.
          readouts:
          - name: Load-to-strength ratio adjusted for areal BMD
            target: Microarchitectural Deterioration
            direction: INCREASED
            interpretation: Retained prediction after BMD adjustment is what shows the model captures
              structural information beyond density.
        publication: PMID:19049327
      selected_evidence:
        snippet: These results provide insight into hip fracture etiology and demonstrate the ability
          of FE-based biomechanical analysis of QCT scans to prospectively predict hip fractures in men.
        supports: SUPPORT
