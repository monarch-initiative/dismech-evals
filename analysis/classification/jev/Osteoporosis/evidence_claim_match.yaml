            category: TRANSGENIC
            description: A suicide transgene that lets p16INK4a-expressing senescent cells be killed on
              demand with AP20187. Applied to 20-22-month-old mice with bone loss already established,
              it is an interventional test of whether senescent cells cause age-related bone loss rather
              than merely accompany it.
            publication: PMID:28825716
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Senescent Cell Accumulation in the Bone Microenvironment
        relationship: RESCUES
        fidelity: MODERATE
        description: Clearing roughly 30% of senescent cells in old mice raises bone mass, microarchitecture
          and strength; the same treatment in 12-month-old mice changes nothing, which is the specificity
          control.
        limitations: Murine, and the transgene is not a therapy. The mouse skeleton lacks osteonal cortical
          remodeling, so the cortical arm of the result does not transfer directly. The human phase 2
          senolytic trial did not reproduce the resorption effect at its primary endpoint - see the discussions
          section.
        readouts:
        - name: Spine trabecular bone volume fraction after senescent-cell clearance
          target: Senescent Cell Accumulation in the Bone Microenvironment
          direction: RESTORED
          interpretation: Structural correlate of removing the senescent-cell burden in an already-osteopenic
            skeleton.
        - name: Senescent osteocyte burden
          target: Senescent Cell Accumulation in the Bone Microenvironment
          direction: DECREASED
          interpretation: Target engagement - confirms the transgene did what it was meant to before the
            bone effect is attributed to it.
      selected_evidence:
        snippet: treatment of young adult (12-month-old) INK-ATTAC mice with AP20187 did not alter bone
          parameters
        supports: SUPPORT
