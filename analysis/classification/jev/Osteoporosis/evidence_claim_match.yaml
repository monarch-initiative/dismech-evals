      assertion_type: Pathophysiology
      assertion:
        name: Osteocyte SASP Acquisition
        conforms_to: cellular_senescence#Senescence-Associated Secretory Phenotype
        biological_scale: CELLULAR
        description: 'With advancing age, osteocytes - the long-lived, terminally differentiated, non-dividing
          cells that orchestrate remodeling - upregulate p16INK4a and acquire a senescence-associated
          secretory phenotype. Osteocytes and myeloid cells are the two bone-resident populations that
          predominantly develop the SASP, and the secretome impairs osteoblast mineralization while enhancing
          osteoclast-progenitor survival. This is the aging arm of the entry: it is distinct from estrogen
          deficiency and operates in both sexes.'
        cell_types:
        - preferred_term: Osteocyte
          term:
            id: CL:0000137
            label: osteocyte
        biological_processes:
        - preferred_term: SASP cytokine production by senescent osteocytes
          modifier: INCREASED
          term:
            id: GO:0001816
            label: cytokine production
        - preferred_term: Inflammatory response in the bone microenvironment
          modifier: INCREASED
          term:
            id: GO:0006954
            label: inflammatory response
      selected_evidence:
        snippet: senescent myeloid cells and senescent osteocytes predominantly develop the SASP
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27341653
      reference_title: Identification of Senescent Cells in the Bone Microenvironment.
      evidence_source: MODEL_ORGANISM
      explanation: Identifies the osteocyte as one of the two SASP-developing populations in bone, which
        is why this node is scoped to osteocytes.
