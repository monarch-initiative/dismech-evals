  0788452d5ba3598cb2063cfc7ed1421189901c61fe5e9f5d5b54c3a944f60288:
    claim:
      about:
        disease:
          name: Osteoporosis
          disease_term:
            preferred_term: osteoporosis
            term:
              id: MONDO:0005298
              label: osteoporosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Marrow Stromal Lineage Shift Toward Adipogenesis
        conforms_to: stem_cell_exhaustion#Decline in Stem Cell Self-Renewal and Function
        biological_scale: CELLULAR
        description: Osteoblasts and marrow adipocytes derive from a shared mesenchymal precursor, and
          with age that precursor is allocated increasingly to the adipogenic rather than the osteogenic
          fate. Marrow adipose volume rises with age and is higher again in osteoporosis at matched age,
          and it is inversely correlated with trabecular bone volume - a decline in the regenerative output
          of the stromal compartment rather than a change in resorption.
        cell_types:
        - preferred_term: Bone marrow mesenchymal stromal cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
        - preferred_term: Marrow adipocyte
          term:
            id: CL:0000136
            label: adipocyte
        biological_processes:
        - preferred_term: Fat Cell Differentiation
          modifier: INCREASED
          term:
            id: GO:0045444
            label: fat cell differentiation
        - preferred_term: Osteoblast Differentiation
          modifier: DECREASED
          term:
            id: GO:0001649
            label: osteoblast differentiation
        notes: 'The direction of causation is not settled by the cited human data, which are cross-sectional
          biopsies; the correlation is consistent with lineage diversion but does not exclude marrow adiposity
          being a consequence of bone loss. See the discussions section. On the conformance: this node
          models the differentiation-potential aspect of stem cell exhaustion, not the pool-maintenance
          aspect, so the module''s GO:0019827 (stem cell population maintenance) is deliberately absent
          rather than overlooked - the claim is that the precursor is allocated differently, not that
          fewer precursors remain. GO:0045444 and GO:0001649 carry that allocation claim directly.'
      selected_evidence:
        snippet: There was an age-related inverse correlation between BV/TV and AV/TV (r = -0.58, P <
          0.001).
        supports: SUPPORT
