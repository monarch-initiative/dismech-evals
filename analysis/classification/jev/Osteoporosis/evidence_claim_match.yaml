        context: []
      assertion_type: Treatment
      assertion:
        name: Denosumab
        description: RANKL inhibitor, potent antiresorptive.
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: denosumab
            term:
              id: NCIT:C61313
              label: Denosumab
        notes: Effect is not retained after withdrawal. Discontinuation releases the suppressed resorption
          as a rebound that overshoots pre-treatment bone turnover, returning vertebral fracture rates
          to untreated levels and concentrating risk in multiple rather than single fractures, so stopping
          requires transition to another antiresorptive rather than simple cessation. This is a property
          of the RANKL/OPG node the drug acts on - it inhibits the pathway without altering the state
          that drives it - and is the mechanistic reason denosumab is not interchangeable with a bisphosphonate.
      selected_evidence:
        snippet: the vertebral fracture rate increased from 1.2 per 100 participant-years during the on-treatment
          period to 7.1, similar to participants who received and then discontinued placebo
        supports: REFUTE
