          compartment, and no aging or estrogen axis, so it cannot represent the senescence or marrow-lineage
          nodes in this entry. Its pathological regime was matched to Paget disease rather than to osteoporosis.
      selected_evidence:
        snippet: the mathematical model revealed that interactions among osteoblasts and osteoclasts result
          in complex, nonlinear system behavior, which cannot be deduced from studies of each cell type
          alone
        supports: SUPPORT
