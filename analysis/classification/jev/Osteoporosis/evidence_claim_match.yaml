      assertion_type: Discussion
      assertion:
        discussion_id: gap_op_marrow_adiposity_direction
        prompt: Marrow adipose volume rises with age, is higher again in osteoporosis at matched age,
          and is inversely correlated with trabecular bone volume. The shared osteoblast-adipocyte precursor
          makes lineage diversion the natural reading. But the human evidence is cross-sectional biopsy
          data, which cannot separate diversion of the precursor from passive filling of space vacated
          by lost bone. Which is it, and does marrow fat contribute causally to bone loss or merely mark
          it?
        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: The distinction changes what the marrow lineage node is for. If adipogenic diversion
          is causal, the precursor allocation step is a therapeutic target and marrow fat is a candidate
          biomarker of formation failure; if marrow fat is a space-filling consequence, it is neither.
          This entry currently asserts the lineage-shift reading in a pathophysiology node, so the uncertainty
          should be visible next to it rather than left implicit.
        attaches_to:
        - pathophysiology#Marrow Stromal Lineage Shift Toward Adipogenesis
      selected_evidence:
        snippet: The cellular and molecular mechanisms mediating these changes remain to be determined.
        supports: SUPPORT
