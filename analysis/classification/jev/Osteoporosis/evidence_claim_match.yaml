  baefd97b7804d5031027d1b2e9eae44bfcc27ed0409cac1b514d93cb789ea9ec:
    claim:
      about:
        disease:
          name: Osteoporosis
          disease_term:
            preferred_term: osteoporosis
            term:
              id: MONDO:0005298
              label: osteoporosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RANKL/OPG Dysregulation
        description: 'Increased RANKL and decreased osteoprotegerin (OPG) ratio promotes osteoclast differentiation
          and activation. Estrogen normally suppresses RANKL and increases OPG. Microgravity further exacerbates
          this imbalance by directly increasing the osteoblast RANKL/OPG ratio.

          '
        genes:
        - preferred_term: ESR1
          description: The gene encoding estrogen receptor alpha, the receptor through which estrogen
            suppresses RANKL expression in bone lining cells; it is the loss of that receptor-mediated
            suppression after estrogen withdrawal that this node models, not a variant in the gene. The
            entry's ESR1 susceptibility record is the common-variant counterpart of this mechanism.
          term:
            id: hgnc:3467
            label: ESR1
        molecular_functions:
        - preferred_term: nuclear estrogen receptor activity in bone lining cells
          modifier: DECREASED
          description: Receptor occupancy falls with circulating estrogen; the receptor itself is intact,
            so the activity is reduced rather than absent or altered.
          term:
            id: GO:0030284
            label: nuclear estrogen receptor activity
        biological_processes:
        - preferred_term: Osteoclast Differentiation
          term:
            id: GO:0030316
            label: osteoclast differentiation
        notes: 'ESR1 is bound here because this is the node the entry''s Estrogen Deficiency exposure
          triggers and the one whose description places estrogen''s restraint of RANKL. Estrogen receptor
          alpha also acts on bone through a second route not modelled on this node: its deletion from
          differentiated osteoclasts causes trabecular bone loss, and estrogen induces osteoclast apoptosis
          through Fas ligand only when osteoclast ERalpha is present (PMID:17803905). That is an osteoclast-lifespan
          mechanism rather than a RANKL/OPG one, and it belongs on the Bone Remodeling Imbalance node
          if a curator wires it. ESR2 is not bound: the cited work attributes the RANKL effect to the
          alpha receptor.

          No cell type is bound on this node, although the molecular-function descriptor names bone lining
          cells, because CL has no term for that cell. An exact OLS search of cl for "bone lining cell"
          returns nothing; a non-exact search for "bone lining" returns CL:0000092 osteoclast, CL:0020016
          osteochondral skeletal stem cell and CL:0002157 endosteal cell alongside unrelated haematopoietic
          terms; and a broader search for "lining" returns only lineage and lateral-line matches. Endosteal
          cell is the closest and is still wrong: CL defines it as the cell making up the vascular membrane
          lining the marrow cavity, and its extended description has it differentiating into osteoblasts,
          so it is an active osteogenic cell of the endosteum rather than the quiescent flattened cell
          that covers a quiet bone surface, which is what the descriptor means. No CL term request has
          been filed; if one is, link it here.'
      selected_evidence:
        snippet: Our data indicate that the increase in bone resorption observed in states of estrogen
          deficiency in mice is mainly caused by lack of ERα-mediated suppression of RANKL expression
          in bone lining cells.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28744019
      reference_title: Estrogen Regulates Bone Turnover by Targeting RANKL Expression in Bone Lining Cells.
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      explanation: 'Grounds the ESR1 descriptor on this node and its direction: selective deletion of
        estrogen receptor alpha in murine reconstitution models shows that the RANKL rise of estrogen
        deficiency is a loss of ERalpha-mediated suppression in bone lining cells. Graded INDIRECT because
        the finding is in ovariectomized mice rather than postmenopausal bone.'
