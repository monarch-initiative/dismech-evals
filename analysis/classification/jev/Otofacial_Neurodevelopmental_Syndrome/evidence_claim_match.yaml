        name: ZSCAN10 Bi-allelic Loss of Function
        description: Bi-allelic protein-truncating variants in ZSCAN10 remove the function of a SCAN-domain
          C2H2 zinc-finger transcription factor. All four reported disease alleles are protein-truncating
          variants located in the large terminal exon 6, which encodes 66% of the protein including all
          14 C2H2 zinc-finger motifs. Truncating alleles here are predicted to escape nonsense-mediated
          decay only partially; any translated product lacks a variable fraction of the zinc-finger array.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: ZSCAN10
          term:
            id: hgnc:12997
            label: ZSCAN10
        molecular_functions:
