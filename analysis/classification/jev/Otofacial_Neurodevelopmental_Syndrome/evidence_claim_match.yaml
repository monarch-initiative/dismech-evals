          qualifiers:
          - predicate:
              preferred_term: medical device
              term:
                id: NCIT:C16830
                label: Medical Device
            value:
              preferred_term: cochlear implant
              term:
                id: NCIT:C157820
                label: Cochlear Implant
        target_phenotypes:
        - preferred_term: Sensorineural hearing impairment
          term:
            id: HP:0000407
            label: Sensorineural hearing impairment
        notes: Inferred from the reported phenotype (uni- or bilateral hearing impairment up to profound
          bilateral sensorineural hearing loss) together with the documented semicircular canal and vestibular
          dysplasia. No implantation outcome has been reported in a ZSCAN10-deficient individual, and
