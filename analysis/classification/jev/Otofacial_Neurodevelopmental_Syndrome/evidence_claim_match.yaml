  3978be5c12e9d1385fdfc938bf69130039e479e20eebd03f412f638e2dd5e531:
    claim:
      about:
        disease:
          name: Otofacial Neurodevelopmental Syndrome
          disease_term:
            preferred_term: otofacial neurodevelopmental syndrome
            term:
              id: MONDO:0975705
              label: otofacial neurodevelopmental syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: zscan10_pluripotency_to_craniofacial_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How does loss of a transcription factor whose best-characterized role is maintenance of
          embryonic stem cell pluripotency produce a spatially specific oto-facial malformation phenotype
          rather than a global embryonic defect?
        attaches_to:
        - pathophysiology#Dysregulation of the Pluripotency Transcriptional Network
        - pathophysiology#Disturbed Craniofacial and Otic Morphogenesis
        rationale: ZSCAN10 expression is highest in embryonic stem cells and falls sharply with differentiation,
          yet the human phenotype is dominated by asymmetric craniofacial and otic malformations. The
          intervening cell populations (plausibly cranial neural crest and otic placode derivatives) and
          the developmental window in which ZSCAN10 loss becomes consequential have not been identified,
          which is why the causal edge from network dysregulation to craniofacial morphogenesis is curated
          with unknown intermediates.
        proposed_experiments:
        - experiment_id: zscan10_lineage_scrnaseq
          experiment_design: DESCRIPTIVE_PROFILING
          name: Lineage-resolved single-cell transcriptomics of Zscan10-null embryos
          description: Single-cell RNA-seq of Zscan10-/- and wild-type mouse embryos sampled across the
            otic placode and cranial neural crest stages, to identify which lineage first diverges transcriptionally.
          decision_criterion: A lineage showing significant divergence before overt morphological abnormality
            identifies the primary affected progenitor population.
        - experiment_id: zscan10_conditional_deletion
          name: Conditional tissue-restricted Zscan10 deletion
          description: Conditional Zscan10 deletion restricted to cranial neural crest or to otic epithelium,
            to test whether the malformation is cell-autonomous to either lineage.
          decision_criterion: Reproduction of the oto-facial malformation by a tissue-restricted deletion
            demonstrates a cell-autonomous requirement in that lineage.
        - experiment_id: zscan10_stage_specific_chipseq
          name: Stage-specific ZSCAN10 enhancer mapping
          description: ZSCAN10 ChIP-seq in human neural crest and otic organoid models to identify stage-specific
            enhancer targets beyond the pluripotency network.
          decision_criterion: Identification of craniofacial or otic developmental enhancers bound by
            ZSCAN10 outside the pluripotent state would supply the missing intermediate.
      selected_evidence:
        snippet: RNA-sequencing analyses in Zscan10-/- mESCs indicated dysregulation of genes related
          to stem cell pluripotency.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
