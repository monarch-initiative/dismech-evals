      assertion:
        name: Cochlear Implantation
        description: 'For profound bilateral sensorineural hearing loss, cochlear implantation bypasses
          the failed cochlear transduction by stimulating the auditory nerve directly. Candidacy assessment
          in this disorder is not routine: the labyrinthine malformation that causes the hearing loss
          also alters implant anatomy, so dedicated temporal bone imaging must precede implantation to
          define the cochlear lumen, the course of the facial nerve, and the risk of a perilymph gusher
          associated with vestibular and semicircular canal dysplasia. Malformed cochleae remain implantable,
          but electrode choice, surgical approach and counselling about expected outcome all depend on
          the imaging.'
        context: Profound bilateral sensorineural hearing loss with documented labyrinthine anatomy
        action_category: THERAPEUTIC
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: implantation
          term:
