        - CHARGE syndrome is autosomal dominant and usually caused by de novo CHD7 variants, whereas otofacial
          neurodevelopmental syndrome is autosomal recessive with bi-allelic ZSCAN10 variants.
        - Coloboma, choanal atresia, and genital hypoplasia with hypogonadotropic hypogonadism are cardinal
          CHARGE features but are not core features of ZSCAN10 deficiency.
