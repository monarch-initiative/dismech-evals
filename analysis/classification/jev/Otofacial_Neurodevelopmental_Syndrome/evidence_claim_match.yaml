  e57e62472ac5c7b7b9ff592c69cf58eb589e15f47bbdbf88558a90d15b23237b:
    claim:
      about:
        disease:
          name: Otofacial Neurodevelopmental Syndrome
          disease_term:
            preferred_term: otofacial neurodevelopmental syndrome
            term:
              id: MONDO:0975705
              label: otofacial neurodevelopmental syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: zscan10_mouse_human_phenotype_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the extra-craniofacial phenotypes of Zscan10 mutant mice (organ and eye malformations,
          reduced weight, spleen, heart and long bone hypoplasia) have human counterparts, or is the mouse
          model over-reporting relative to human ZSCAN10 deficiency?
        attaches_to:
        - pathophysiology#Disturbed Craniofacial and Otic Morphogenesis
        rationale: The earlier Zscan10 mutant mouse line shows reduced weight, mild spleen, heart and
          long bone hypoplasia, and a Sox2-hypomorph-like eye malformation. The original human study explicitly
          notes that these organ and eye malformations were not observed in its clinical cohort, while
          the facial and ear findings were strikingly concordant. With only seven reported individuals,
          absence of the extra-craniofacial features in humans may reflect ascertainment and cohort size
          rather than true species divergence. In addition, high embryonic lethality of the homozygous
          knockout in the newer line precluded adult mouse phenotyping, limiting comparison to the postnatal
          human phenotype.
        proposed_experiments:
        - experiment_id: zscan10_expanded_cohort_multisystem
          name: Systematic multisystem assessment of an expanded human cohort
          description: Systematic ophthalmological, splenic, cardiac and skeletal assessment in an expanded
            human ZSCAN10 cohort assembled through GeneMatcher.
          decision_criterion: Detection of eye or visceral hypoplasia at above-background frequency in
            a larger human cohort would resolve the apparent mismatch as ascertainment.
        - experiment_id: zscan10_adult_mouse_phenotyping
          name: Postnatal phenotyping of surviving Zscan10 mutant mice
          description: Deep phenotyping of surviving adult Zscan10 mutant mice on a permissive genetic
            background, including facial morphometry and inner ear imaging not performed in the original
            German Mouse Clinic pipeline.
          decision_criterion: Concordance of adult mouse and human postnatal phenotypes would establish
            the model's translational validity beyond the embryonic stage.
      selected_evidence:
        snippet: Mice homozygous for a Zscan10 mutation exhibit reduced weight, mild hypoplasia in the
          spleen, heart and long bones and phenocopy an eye malformation previously described for Sox2
          hypomorphs.
        supports: SUPPORT
