            label: semicircular canal
        - preferred_term: external ear
          term:
            id: UBERON:0001691
            label: external ear
        biological_processes:
        - preferred_term: semicircular canal morphogenesis
          term:
            id: GO:0048752
            label: semicircular canal morphogenesis
          modifier: ABNORMAL
        - preferred_term: outer ear morphogenesis
          term:
            id: GO:0042473
            label: outer ear morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: Deep phenotyping revealed global developmental delay, facial asymmetry and malformations
          of the outer ear as consistent clinical features.
        supports: SUPPORT
