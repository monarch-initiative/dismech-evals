        description: High-resolution imaging of the inner ear is the single most discriminating investigation.
          Cerebral MRI with dedicated temporal bone sequences (or high-resolution CT) demonstrates dysplasia
          or aplasia of the semicircular canals and vestibular dysplasia. In the reported cohort no other
          cerebral anomaly was found, so an otherwise normal brain MRI with isolated labyrinthine malformation
          is the expected pattern and should raise ZSCAN10 deficiency in a child with developmental delay
          and ear anomalies.
