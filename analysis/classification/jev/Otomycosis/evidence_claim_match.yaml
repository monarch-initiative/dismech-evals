      assertion:
        name: Aspergillus species
        infectious_agent_term:
          preferred_term: Aspergillus
          term:
            id: NCBITaxon:5052
            label: Aspergillus
        description: 'Aspergillus species are the most common causative agents of otomycosis worldwide.
          In a large Chinese series of 452 cases, A. terreus was the most common (62.83%), followed by
          A. flavus (20.35%) and A. niger (12.17%). In other geographic regions, A. niger predominates.
          Species-level identification is important because antifungal susceptibility varies significantly
          between species, with approximately 30% resistance to topical azoles (bifonazole and clotrimazole)
          reported for Aspergillus isolates. Azole resistance mechanisms include cyp51A mutations and
          overexpression of efflux pump genes (mdr1, mfs) in Aspergillus section Nigri.

          '
      selected_evidence:
        snippet: In the 452 clinical strains isolated from the external ear canal, 284 were identified
          as Aspergillus terreus (62.83%), 92 as Aspergillus flavus (20.35%), 55 as Aspergillus niger
          (12.17%).
        supports: SUPPORT
