      assertion_type: Definition
      assertion:
        name: Clinical diagnostic criteria for otomycosis
        definition_type: DIAGNOSTIC_CRITERIA
        description: 'Otomycosis is diagnosed clinically based on characteristic otoscopic findings combined
          with symptomatology and confirmed by mycological culture. No single internationally standardized
          diagnostic criteria set exists; diagnosis relies on the triad of compatible symptoms, characteristic
          otoscopic appearance, and positive fungal culture or microscopy.

          '
        scope: adults and children
        inclusion_criteria:
        - preferred_term: External ear canal irritation symptoms
          description: 'Symptoms of external ear canal irritation including pruritus, otalgia, otorrhea,
            or aural fullness.

            '
        - preferred_term: Characteristic otoscopic findings
          description: 'Characteristic otoscopic findings including fungal debris, hyphae, spores, or
            conidiophores visible in the external auditory canal.

            '
        - preferred_term: Positive fungal identification
          description: 'Positive fungal culture or direct microscopy showing fungal elements (KOH preparation
            or Gram stain).

            '
        exclusion_criteria:
        - preferred_term: Middle ear pathology as primary source
          description: 'Otitis media or middle ear pathology as the primary source of symptoms.

            '
        - preferred_term: Necrotizing otitis externa
          description: 'Malignant otitis externa (necrotizing otitis externa) with bone involvement.

            '
      selected_evidence:
        snippet: Otomycosis is a chronic or subacute fungal infection of external ear accounting to 5
          to 20% of external ear infection worldwide.
        supports: SUPPORT
