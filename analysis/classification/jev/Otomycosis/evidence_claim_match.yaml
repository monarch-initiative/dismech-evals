        description: 'Aspergillus-caused otomycosis carries a fixed species-level treatment gate: Aspergillus
          species are intrinsically resistant to fluconazole, so organism identification excludes that
          agent before isolate-level susceptibility results. This node is deliberately separate from the
          existing biofilm-resistance node and from acquired cyp51A or efflux-mediated azole resistance;
          neither of those isolate- or exposure-dependent mechanisms is sufficient for conformance to
          the module''s intrinsic-resistance arm.'
