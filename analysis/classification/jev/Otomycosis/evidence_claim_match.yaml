        description: 'The Aspergillus and Candida agents that cause otomycosis retain fungal sterol 14-alpha-demethylase
          activity in their ergosterol pathways. This normal Cyp51/Erg11 activity is the disease-local
          therapeutic vulnerability inhibited by viable imidazole and triazole agents. Its presence does
          not imply that every azole inhibits every organism: the Aspergillus fluconazole-specific intrinsic
          resistance gate and isolate-level susceptibility remain separate constraints.'
