      assertion_type: DifferentialDiagnosis
      assertion:
        name: Acute bacterial otitis externa
        description: 'Bacterial otitis externa presents with similar symptoms of ear pain, discharge,
          and canal edema. It is typically caused by Pseudomonas aeruginosa or Staphylococcus aureus and
          produces purulent rather than fungal debris. Bacterial infection tends to cause more severe
          pain and canal edema than otomycosis.

          '
        disease_term:
          preferred_term: acute otitis externa
          term:
            id: MONDO:0001051
            label: acute otitis externa
        distinguishing_features:
        - Purulent discharge rather than fungal debris (hyphae, spores)
        - More severe pain and canal edema
        - Responds to topical antibiotics rather than antifungals
