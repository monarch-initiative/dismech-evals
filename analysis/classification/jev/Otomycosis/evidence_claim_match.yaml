      assertion_type: Pathophysiology
      assertion:
        name: Disruption of cerumen antimicrobial barrier
        description: 'The external auditory canal is normally protected by cerumen, which maintains an
          acidic pH (mean ~3.95), contains antimicrobial peptides (defensins hBD1-3, cathelicidin LL-37,
          lysozyme, lactoferrin, BPI), and supports colonization resistance by resident microbiota. Physical
          or chemical disruption of this barrier by excessive ear cleaning, moisture exposure, or other
          trauma removes the primary antimicrobial defense.

          '
        cell_types:
        - preferred_term: Epithelial cell of external acoustic meatus
          term:
            id: CL:1000434
            label: epithelial cell of external acoustic meatus
        biological_processes:
        - preferred_term: Antimicrobial humoral response
          modifier: DECREASED
          term:
            id: GO:0019730
            label: antimicrobial humoral response
        locations:
        - preferred_term: External acoustic meatus
          term:
            id: UBERON:0001352
            label: external acoustic meatus
      selected_evidence:
        snippet: All ten antimicrobial peptides are present in ear wax. Some of these proteins seem to
          be merelycell-bound in ear wax. Antimicrobial peptides in ear wax prevent bacteria and fungi
          from causing infections inthe external auditory canal.
        supports: SUPPORT
