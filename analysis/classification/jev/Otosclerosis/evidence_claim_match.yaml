  23fff2893c1c6989063e19a39bd4bea387ccce69c5e3f6d790478d3500b346cb:
    claim:
      about:
        disease:
          name: Otosclerosis
          disease_term:
            preferred_term: otosclerosis
            term:
              id: MONDO:0005349
              label: otosclerosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Osteoprotegerin Restraint of Osteoclastogenesis
        description: In health the otic capsule is protected from remodeling by osteoprotegerin, secreted
          in large amounts by the spiral ligament, which acts as a decoy receptor for RANKL and suppresses
          osteoclast recruitment and activation. Osteoprotegerin transcript is significantly reduced in
          otosclerotic stapes footplates relative to normal stapes, releasing that restraint.
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        biological_processes:
        - preferred_term: negative regulation of osteoclast differentiation
          term:
            id: GO:0045671
            label: negative regulation of osteoclast differentiation
          modifier: DECREASED
        genes:
        - preferred_term: TNFRSF11B
          description: Encodes osteoprotegerin (OPG).
          term:
            id: hgnc:11909
            label: TNFRSF11B
        locations:
        - preferred_term: bony otic capsule
          term:
            id: UBERON:0005411
            label: bony otic capsule
        notes: Deliberately not declared conformant to osteoporosis_bone_resorption#RANKL-Driven Osteoclastogenesis.
          That module scopes itself to the osteoporoses and its chain terminates in net bone loss and
          skeletal fragility; otosclerosis is focal, confined to one bone that is normally not remodeled
          at all, and ends in net sclerosis rather than fragility. The RANKL/osteoprotegerin step is a
          parallel use of the same axis, not a conforming instance of that module's chain.
      selected_evidence:
        snippet: The OPG expression level was significantly lower in otosclerotic tissues comparing to
          controls.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24676726
      reference_title: Expression of TNF-α, OPG, IL-1β and the presence of the measles virus RNA in the
        stapes of the patients with otosclerosis.
      evidence_source: HUMAN_CLINICAL
      explanation: Measures the loss of that restraint directly in otosclerotic stapes versus cadaveric
        control stapes.
