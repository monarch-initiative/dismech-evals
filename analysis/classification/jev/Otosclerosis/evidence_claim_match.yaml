            name: Dysregulated TGF-beta Signaling in the Otic Capsule
            description: TGF-beta1 regulates both osteoblast and osteoclast lineages and is produced within
              the otic capsule and by inner-ear tissues from which it can diffuse. An intronic TGFB1 variant
              is genome-wide significant for otosclerosis, and several further risk loci (SMAD3, CD109,
              LTBP3, AHSG, and a haplotype overlapping RUNX2) lie on the same pathway, making TGF-beta
              signalling the most consistently implicated molecular axis.
            biological_scale: MOLECULAR
            mechanism_confidence: PROVISIONAL
            biological_processes:
            - preferred_term: transforming growth factor beta receptor signaling pathway
              term:
                id: GO:0007179
                label: transforming growth factor beta receptor signaling pathway
              modifier: DYSREGULATED
            genes:
            - preferred_term: TGFB1
              term:
                id: hgnc:11766
                label: TGFB1
            - preferred_term: SMAD3
              term:
                id: hgnc:6769
                label: SMAD3
            - preferred_term: CD109
              term:
                id: hgnc:21685
                label: CD109
            - preferred_term: LTBP3
              term:
                id: hgnc:6716
                label: LTBP3
            - preferred_term: AHSG
              term:
                id: hgnc:349
                label: AHSG
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Loss of Otic Capsule Remodeling Quiescence
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: TGF-beta1 is proposed to reach the otic capsule paracrine from inner-ear tissue and
          regulate its remodeling; the step from altered signalling to loss of quiescence is inferred
          from the genetics rather than demonstrated in human otic capsule.
      selected_evidence:
        snippet: As a secreted molecule, TGFβ1 could diffuse from these cells into the surrounding otic
          capsule to regulate its remodeling in a paracrine fashion.
        supports: SUPPORT
        directness: INDIRECT
