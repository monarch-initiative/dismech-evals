  5d9e89d94a36191e6de722c5710e4898f2f9baf72d63e80e9dd30a4c49e14c1b:
    claim:
      about:
        disease:
          name: Otosclerosis
          disease_term:
            preferred_term: otosclerosis
            term:
              id: MONDO:0005349
              label: otosclerosis
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Pure-tone audiometry with Carhart notch and absent acoustic reflexes
        description: 'The diagnostic core: a conductive or mixed loss with an air-bone gap, a Carhart
          notch (an artefactual bone-conduction dip around 2 kHz produced by the fixed ossicular chain),
          absent stapedial reflexes and a type A or As tympanogram. In a typical case this constellation
          makes imaging largely unnecessary.'
        measurements:
        - preferred_term: pure-tone air-conduction threshold audiometry
          term:
            id: LOINC:100653-5
            label: Pure tone air conduction threshold audiometry panel
        - preferred_term: pure-tone bone-conduction threshold audiometry
          term:
            id: LOINC:100652-7
            label: Pure tone bone conduction threshold audiometry panel
        notes: The air-bone gap is the difference between the air-conduction and bone-conduction thresholds
          at each frequency, so the two panels are bound and the gap is computed from them. Monarch KG
          searches for air bone gap, air-bone and bone conduction returned no code for the gap itself.
          No reference range is recorded. The only numeric air-bone gap criterion in the cached Brazilian
          Society of Otology task force text (PMID:37647735) is a treatment indication, stapes surgery
          for conductive loss with mean pure-tone thresholds of 25 dB or more at 250, 500, 1000 and 2000
          Hz and an air-bone gap of 20 dB or more, not a diagnostic cut-off. The WHO hearing-loss grades
