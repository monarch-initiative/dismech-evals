          in the decades after mass measles vaccination. Other series using comparable RT-PCR methods
          have detected nothing at all. The hypothesis is therefore recorded here with both a supporting
          and a refuting primary study rather than as a settled cause.
        effect: Proposed trigger of otic-capsule remodeling; contested
        notes: No `exposure_term:` is bound. ECTO was searched (`runoak -i sqlite:obo:ecto`) for measles,
          virus and viral-exposure terms and returned nothing suitable; the ECTO virus-exposure branch
          does not carry a measles term, and no term beats a wrong term.
      selected_evidence:
        snippet: The majority of the current literature supported the presence of the measles virus component
          in the otosclerotic stapes samples and its role in the etiopathogenesis of otosclerosis.
        supports: SUPPORT
