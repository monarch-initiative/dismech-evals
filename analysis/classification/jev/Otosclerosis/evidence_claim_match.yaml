      assertion_type: Stage
      assertion:
        name: Histologic otosclerosis
        description: An otic-capsule focus that has not reached a site where it fixes the stapes or the
          round window, and so causes no symptoms. It is found only by sectioning temporal bones at autopsy,
          in roughly an order of magnitude more people than have clinical disease. Only some 12-15% of
          temporal bones with histologic otosclerosis show stapedial fixation.
      selected_evidence:
        snippet: Histologic otosclerosis is a disease process without clinical symptoms or manifestations
          that can be discovered only by sectioning of the temporal bone at autopsy.
        supports: SUPPORT
