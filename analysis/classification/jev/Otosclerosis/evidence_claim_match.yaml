                    label: Prosthesis
            target_phenotypes:
            - preferred_term: Progressive conductive hearing impairment
              term:
                id: HP:0008607
                label: Progressive conductive hearing impairment
            notes: The device is carried as a `qualifiers` predicate-value pair because `TreatmentTerm`
              is rooted at NCIT:C25218 (Clinical Intervention or Procedure) and a device term cannot sit
              in that slot. NCIT has no term for a stapes prosthesis specifically, so the generic NCIT:C17598
              (Prosthesis) is bound and the specificity is carried in `preferred_term`.
