      assertion:
        name: Stapedotomy
        description: The definitive treatment for fenestral otosclerosis with preserved cochlear reserve.
          A fenestra is made in the fixed footplate and a prosthesis is placed between the incus and the
          vestibule, bypassing the ankylosed stapes. Failure rate is around 6% and sensorineural loss
          is uncommon. Contraindications include an only-hearing ear, active Meniere disease, a persistent
          stapedial artery and tympanic membrane perforation.
        action_category: THERAPEUTIC
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: stapedotomy with stapes prosthesis placement
          term:
            id: NCIT:C15329
            label: Surgical Procedure
          qualifiers:
          - predicate:
              preferred_term: medical device
              term:
                id: NCIT:C16830
                label: Medical Device
            value:
              preferred_term: stapes prosthesis
              term:
                id: NCIT:C17598
                label: Prosthesis
        target_phenotypes:
        - preferred_term: Progressive conductive hearing impairment
          term:
            id: HP:0008607
            label: Progressive conductive hearing impairment
        notes: The device is carried as a `qualifiers` predicate-value pair because `TreatmentTerm` is
          rooted at NCIT:C25218 (Clinical Intervention or Procedure) and a device term cannot sit in that
          slot. NCIT has no term for a stapes prosthesis specifically, so the generic NCIT:C17598 (Prosthesis)
          is bound and the specificity is carried in `preferred_term`.
      selected_evidence:
        snippet: Stapedotomy is currently the most accepted surgical treatment for fenestral otosclerosis
          with good cochlear reserve.
        supports: SUPPORT
