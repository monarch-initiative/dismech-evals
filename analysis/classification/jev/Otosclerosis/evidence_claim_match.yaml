      assertion_type: AnimalModel
      assertion:
        name: Smarca4 E1548K knock-in mouse
        species: Mouse
        genotype: Smarca4+/E1548K (CRISPR-Cas9 knock-in of the orthologue of the human SMARCA4 p.E1548K
          variant)
        publication: PMID:37399313
        description: The only animal model of otosclerosis. Mice carrying the mouse orthologue of the
          human kindred's SMARCA4 variant are hearing-impaired on acoustic startle and auditory brainstem
          response testing, and micro-CT shows a highly irregular incus disrupting the ossicular chain.
        modeled_mechanisms:
        - target: Progressive Conductive Hearing Loss
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: The mouse reproduces conductive-type hearing impairment arising from abnormal ossicular
            bone, from the same allele that causes the human disease.
          limitations: The murine lesion is an irregular incus interrupting the ossicular chain, not otosclerotic
            fixation of the stapes footplate at the oval window, and the paper reports no otic-capsule
            focus. Otosclerosis is elsewhere described as an exclusively human disorder, so this model
            reproduces the ossicular consequence rather than the otic-capsule dystrophy that defines the
            disease.
          readouts:
          - name: Auditory brainstem response and acoustic startle threshold
            target: Progressive Conductive Hearing Loss
            direction: DECREASED
            interpretation: Functional hearing loss in the mutant mice, the model's counterpart of the
              audiometric phenotype.
          - name: Micro-CT incus morphology and ossicular chain continuity
            target: Progressive Conductive Hearing Loss
            direction: ALTERED
            interpretation: 'Structural correlate: abnormal ossicular bone interrupting sound conduction.'
      selected_evidence:
        snippet: We generated CRISPR-Cas9 transgenic mice carrying the human mutation in the mouse SMARCA4
          orthologue.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
