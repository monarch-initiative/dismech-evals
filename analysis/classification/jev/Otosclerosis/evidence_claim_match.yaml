      assertion_type: DifferentialDiagnosis
      assertion:
        name: Superior semicircular canal dehiscence
        description: A third-window lesion that produces an air-bone gap with an intact tympanic membrane
          and can be mistaken for otosclerosis. It is also an explicit contraindication to stapedotomy,
          so distinguishing it changes management.
        distinguishing_features:
        - Supranormal bone conduction thresholds and abnormal VEMP responses despite the air-bone gap.
        - Sound- and pressure-evoked vestibular symptoms, with dehiscence visible on CT.
      selected_evidence:
        snippet: Ménière’s disease or superior semicircular canal dehiscence are contraindications to
          stapedotomy (Insufficient evidence).
        supports: SUPPORT
