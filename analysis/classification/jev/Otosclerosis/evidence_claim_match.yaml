          value:
            name: Stapedotomy
            description: The definitive treatment for fenestral otosclerosis with preserved cochlear reserve.
              A fenestra is made in the fixed footplate and a prosthesis is placed between the incus and
              the vestibule, bypassing the ankylosed stapes. Failure rate is around 6% and sensorineural
              loss is uncommon. Contraindications include an only-hearing ear, active Meniere disease,
              a persistent stapedial artery and tympanic membrane perforation.
            action_category: THERAPEUTIC
            therapeutic_modality: SURGERY
            treatment_term:
              preferred_term: stapedotomy with stapes prosthesis placement
              term:
