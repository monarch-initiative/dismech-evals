      assertion_type: DifferentialDiagnosis
      assertion:
        name: Meniere disease
        description: Overlaps otosclerosis in vestibular symptoms and fluctuating hearing, and is a relative
          contraindication to stapedotomy. Endolymphatic hydrops is itself seen in some patients with
          otosclerosis involving the spiral ligament, which blurs the boundary.
        distinguishing_features:
        - Episodic vertigo with fluctuating low-frequency sensorineural loss and aural fullness, rather
          than a stable air-bone gap.
      selected_evidence:
        snippet: Vestibular complaints should be investigated during clinical evaluation, as misdiagnosis
          can have significant implications on treatment outcomes, especially in patients with Ménière’s
          disease, an enlarged vestibular aqueduct, or superior semicircular canal dehiscence.
        supports: SUPPORT
