      assertion_type: Pathophysiology
      assertion:
        name: Third-Space Fluid Shift and Intravascular Volume Depletion
        biological_scale: ORGANISM
        role: consequence
        mechanism_confidence: ESTABLISHED
        description: 'The systemic pivot of the illness. Protein-rich fluid leaving the permeable vasculature
          accumulates as ascites and pleural effusion while the intravascular compartment is simultaneously
          depleted, so the patient is fluid-overloaded and hypovolaemic at once. That paradox is the whole
          management problem: the visible fluid must not be treated as excess. The accompanying picture
          is rapid weight gain, haemoconcentration, leukocytosis, hyponatraemia and hyperkalaemia.'
      selected_evidence:
        snippet: 'Clinical signs may include any or all of the following: rapid weight gain, ascites,
          oliguria, hemoconcentration, leukocytosis, along with intravascular hypovolemia, hyponatremia,
          and hyperkalemia.'
        supports: SUPPORT
