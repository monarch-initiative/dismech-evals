      assertion_type: ProgressionInfo
      assertion:
        phase: Early OHSS
        notes: Early OHSS begins in the days after the hCG trigger and oocyte retrieval and reflects the
          preovulatory response to stimulation - it is the arm that peak oestradiol and oocyte number
          predict, and the arm that protocol choice, coasting and trigger substitution can pre-empt. Women
          with early OHSS have significantly higher serum oestradiol and lower gonadotropin requirements
          than either late-OHSS or unaffected women, which is the signature of an ovary that responded
          excessively to a modest dose.
      selected_evidence:
        snippet: Early OHSS relates to "excessive" preovulatory response to stimulation, whereas late
          OHSS depends on the occurrence of pregnancy, is likelier to be severe, and is only poorly related
          to preovulatory events.
        supports: SUPPORT
