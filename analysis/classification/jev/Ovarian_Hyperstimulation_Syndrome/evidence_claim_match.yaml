        context: []
      assertion_type: Treatment
      assertion:
        name: Elective Embryo or Oocyte Cryopreservation (Freeze-All)
        description: 'Curated separately from the grouped secondary-prevention entry because it is the
          only one of the three that is a distinct laboratory procedure with its own NCIT identity, and
          because its mechanism is specifically temporal: it does not prevent early OHSS at all, since
          the trigger is still given and the oocytes still retrieved. What it prevents is the late form,
          by removing the implanting pregnancy whose endogenous hCG would otherwise sustain the luteinizing
          stimulus for weeks. It is the reason the GnRH-agonist trigger is so effective in donor and freeze-all
          cycles specifically and less clearly so in fresh-transfer cycles.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Cryopreservation
          term:
            id: NCIT:C16475
            label: Cryopreservation
      selected_evidence:
        snippet: The use of GnRH agonist (GnRHa) for final oocyte maturation trigger in oocyte donation
          and elective frozen embryo transfer cycles is well established due to lower ovarian hyperstimulation
          syndrome (OHSS) rates as compared to hCG trigger.
        supports: SUPPORT
