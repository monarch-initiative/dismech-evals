          problem. Sustained FSH receptor signalling rescues from atresia a large cohort of antral follicles
          that a natural cycle would have discarded in favour of one dominant follicle. Nothing pathological
          has happened yet - this is the intended effect of controlled ovarian stimulation, and an exaggerated
          version of it in the spontaneous forms. Follicle number and oestradiol level predict OHSS risk
          precisely because they measure this node, which is why it and not the later steps is what protocol
          individualisation, anti-Mullerian hormone and antral follicle count are aimed at.
        biological_processes:
