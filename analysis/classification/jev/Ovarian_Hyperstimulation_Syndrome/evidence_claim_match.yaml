      assertion_type: Phenotype
      assertion:
        category: Hematologic
        name: Hemoconcentration
        description: 'A rising haematocrit as plasma leaves the intravascular compartment for the peritoneum
          and pleura. Operationally this is the most important single laboratory finding in the syndrome:
          it is a formal severity criterion, it is what converts a patient from outpatient observation
          to admission and intravenous rehydration, and it is the same measurement that makes the thrombotic
          risk legible. Note the direction of causation runs opposite to intuition - the haematocrit rises
          because plasma is lost, not because red cell mass increases.'
