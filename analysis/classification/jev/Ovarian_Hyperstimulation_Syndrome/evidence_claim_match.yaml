            granulosa cells.
        - name: Histological progression of OHSS after Tie1 knockdown
          target: EGR1-TIE1 Amplification of Granulosa VEGF Output
          direction: DECREASED
          interpretation: Interrupting the proposed amplifier attenuates the disease in vivo, which is
            the strongest claim available for this node.
      selected_evidence:
        snippet: Ovaries harvested from control and experimentally induced OHSS rats, as well as those
          from OHSS rats subjected to Tie1 or nontargeting silencing, were used for histological analysis.
