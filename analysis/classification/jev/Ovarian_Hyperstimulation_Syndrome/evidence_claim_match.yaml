        context: []
      assertion_type: Treatment
      assertion:
        name: Hydroxyethyl Starch for OHSS Prophylaxis
        description: 'Intravenous hydroxyethyl starch, a plasma volume expander given around retrieval.
          Both network meta-analyses find it effective (RR 0.25 and RR 0.26) and one grades the evidence
          high. Its rationale is the one intervention on this entry that acts on the consequence rather
          than the cause: it counters the intravascular volume depletion produced by the capillary leak
          instead of reducing the leak itself, which is why it is linked to the third-space node and not
          to a VEGF node.

          A note on the binding: NCIT''s own "Hydroxyethyl Starch" concept (NCIT:C102744) is retired and
          is not reachable from Pharmacologic Substance, so `just validate-terms` rejects it. The live
          term is NCIT:C559 Hetastarch, which is what the agent is bound to; `preferred_term` keeps the
          name the trials use.

          Curators should note the context this evidence sits in: hydroxyethyl starch carries regulatory
          restrictions in critical care for renal and mortality concerns, and the cited meta-analyses
          assess OHSS outcomes only. This entry records the OHSS efficacy finding, not a recommendation.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: hydroxyethyl starch
            term:
              id: NCIT:C559
              label: Hetastarch
      selected_evidence:
        snippet: Calcium, HES, and cabergoline could effectively and safely prevent moderate-to-severe
          OHSS, with calcium as the most effective intervention.
        supports: SUPPORT
