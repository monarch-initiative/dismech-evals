          name: Ovarian Hyperstimulation Syndrome
          disease_term:
            preferred_term: ovarian hyperstimulation syndrome
            term:
              id: MONDO:0011972
              label: ovarian hyperstimulation syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Supportive Care of Established OHSS
        description: 'The surrounding management: rehydration to correct the intravascular deficit rather
          than the total-body excess - fluid resuscitation, not diuresis - monitoring of fluid balance,
          oxygen, and non-invasive ventilation when hypoxaemia is severe. Most cases are managed as outpatients;
          hospitalisation is reserved for the severe and critical end.

          The candid limitation, stated by the reviews themselves, is that this rests on consensus rather
          than trial evidence. The syndrome is self-limiting once the hCG stimulus falls, so the aim is
          to support the patient across that interval - which is also why the evidence base has never
          been built.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: When OHSS occurs, it can usually be managed as outpatient care.
        supports: SUPPORT
