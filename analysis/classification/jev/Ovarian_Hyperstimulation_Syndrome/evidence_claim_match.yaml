        context: []
      assertion_type: Subtype
      assertion:
        name: Familial Spontaneous OHSS
        display_name: Familial gestational spontaneous OHSS (FSHR-activating)
        description: A rare autosomal dominant form in which activating germline FSHR variants make the
          FSH receptor respond to hormones it should ignore. Affected women develop OHSS during spontaneous
          pregnancy, typically in the first trimester, with no fertility drug involved, and the syndrome
          recurs in successive pregnancies. This is the arm that gives MONDO:0011972 its hereditary-disease
          parent and its FSHR gene association.
      selected_evidence:
        snippet: Since 2003, only six different activating FSHr gene mutations have been reported in cases
          of familial or habitual sOHSS.
        supports: SUPPORT
