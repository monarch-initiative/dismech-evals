  1ff207adea8ac39bc8a32a20933e9344539c0eca06ff423b8ccb87329444095d:
    claim:
      about:
        disease:
          name: Ovarian Hyperstimulation Syndrome
          disease_term:
            preferred_term: ovarian hyperstimulation syndrome
            term:
              id: MONDO:0011972
              label: ovarian hyperstimulation syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Low-Dose Aspirin for OHSS Prophylaxis
        description: 'The agent with the largest point estimate in either network meta-analysis - RR 0.07
          in Guo 2016, ranked first at 36% rank probability, ahead of intravenous calcium - and simultaneously
          the agent those two analyses disagree about most sharply. Wu 2022 grades the aspirin evidence
          LOW and places it among the agents that could not prevent moderate-to-severe OHSS.

          It is curated because leaving it out was distorting this entry. The calcium treatment previously
          opened by calling calcium "the most effective prophylaxis available", while the snippet directly
          beneath it ranked aspirin above calcium in one of the two analyses. Curating aspirin lets both
          facts stand and makes the discordance the entry''s subject rather than its blind spot.

          Unlike calcium, it has a concrete and non-speculative proposed mechanism: aspirin inhibits platelet
          COX-1, and platelet activation with release of vasoactive mediators is one of the proposed amplifiers
          of the capillary leak. That arm is not curated as a node here - no primary source in this entry''s
          reference set demonstrates it in OHSS - so the treatment carries no target_mechanisms link,
          for the same reason and with the same discipline applied to calcium before the ovarian RAS node
          was added.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: aspirin
            term:
              id: CHEBI:15365
              label: acetylsalicylic acid
      selected_evidence:
        snippet: 'Five pharmacologic interventions were superior to placebo in decreasing OHSS incidence:
          aspirin [relative risk (RR) 0.07, 95% credible interval (CrI) 0.01-0.30, p < 0.05], intravenous
          (IV) calcium [RR 0.11, 95% CrI 0.02-0.54, p < 0.05], cabergoline [RR 0.17, 95% CrI 0.06-0.43,
          p < 0.05], metformin [RR 0.20, 95% CrI 0.07-0.59, p < 0.05] and IV hydroxyethyl starch (HES)
          [RR 0.26, 95% CrI 0.05-0.99, p < 0.05].'
        supports: SUPPORT
