  87b5bfe0a5b998917da9611688512b5f22264c93c864f137a85379970f305272:
    claim:
      about:
        disease:
          name: Ovarian Hyperstimulation Syndrome
          disease_term:
            preferred_term: ovarian hyperstimulation syndrome
            term:
              id: MONDO:0011972
              label: ovarian hyperstimulation syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: EGR1-TIE1 Amplification of Granulosa VEGF Output
        biological_scale: MOLECULAR
        role: modifier
        mechanism_confidence: PROVISIONAL
        description: 'A proposed amplifier sitting between the hCG signal and the VEGF surge, and the
          most substantial recent addition to the mechanism. Tie1 is an endothelial receptor tyrosine
          kinase, but it is also expressed in granulosa cells, where hCG raises it through PI3K/AKT signalling
          and through EGR1 binding directly to the Tie1 promoter. The functional claim is the informative
          one: silencing Tie1 abolished the hCG-induced rise in VEGF in a human granulosa-lutein cell
          line and attenuated OHSS in rats. If that holds in humans it identifies a target upstream of
          VEGF itself, which would avoid the problem that blocking VEGFR-2 also blocks the angiogenesis
          a pregnancy needs. It is curated as PROVISIONAL and as a modifier rather than a required step
          because the evidence is entirely from patient-derived cultured cells, a granulosa-lutein cell
          line and a rat model; the authors state explicitly that clinical relevance is not yet addressed.'
        genes:
        - preferred_term: TIE1
          term:
            id: hgnc:11809
            label: TIE1
        - preferred_term: EGR1
          term:
            id: hgnc:3238
            label: EGR1
        biological_processes:
        - preferred_term: phosphatidylinositol 3-kinase/protein kinase B signal transduction
          modifier: INCREASED
          term:
            id: GO:0043491
            label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
        cell_types:
        - preferred_term: Granulosa-lutein cell
          term:
            id: CL:0000501
            label: granulosa cell
      selected_evidence:
        snippet: Here, we report significantly increased Tie1 and vascular endothelial growth factor (VEGF)
          expression in cultured granulosa cells from OHSS patients, as well as ovaries from rats with
          experimentally established OHSS, compared to controls
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35079118
      reference_title: Tie1 contributes to the development of ovarian hyperstimulation syndrome under
        the regulation of EGR1 in granulosa cells.
      evidence_source: IN_VITRO
      explanation: Establishes the association of Tie1 with VEGF in patient-derived granulosa cells and
        in the rat model.
