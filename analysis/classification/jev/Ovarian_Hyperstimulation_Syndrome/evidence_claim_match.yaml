            term:
              id: MONDO:0011972
              label: ovarian hyperstimulation syndrome
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Late OHSS
        notes: 'Late OHSS begins later and depends on pregnancy: the endogenous hCG of an implanting conceptus
          sustains the luteinizing stimulus for weeks rather than days. Three consequences follow and
          all are clinically important. It is likelier to be severe than the early form. It cannot be
          predicted from preovulatory measurements - serum oestradiol and oocyte number, which work for
          early OHSS, do not identify who will develop it. And it is the arm that freeze-all abolishes,
          since deferring transfer removes the pregnancy entirely. In one series clinical pregnancies
          occurred in every late-OHSS cycle, and in another 77.8% of late-onset cases had a concurrent
          positive pregnancy test.'
      selected_evidence:
        snippet: Serum E(2) and oocyte numbers did not accurately predict the risk of developing late
          OHSS.
        supports: SUPPORT
    origin:
      assertion_path: /progression/1
      evidence_path: /progression/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10785214
      reference_title: Distinction between early and late ovarian hyperstimulation syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that the predictors used for early OHSS fail for the late form, which is
        why prevention of late OHSS is structural (freeze-all) rather than predictive.
