  41216dcb13cb2048d6d8b8cb1d59abf9dbe44ebb16a54102b6e3591f3489ad48:
    claim:
      about:
        disease:
          name: Ovarian Hyperstimulation Syndrome
          disease_term:
            preferred_term: ovarian hyperstimulation syndrome
            term:
              id: MONDO:0011972
              label: ovarian hyperstimulation syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Secondary Prevention by Coasting or Cycle Cancellation
        description: 'Two of the manoeuvres available once a cycle is already over-responding, both of
          which work by denying the recruited follicular cohort its luteinizing stimulus rather than by
          treating the leak. Coasting withholds further gonadotropin while continuing pituitary suppression,
          allowing the smaller follicles to undergo atresia before the trigger. Cycle cancellation withholds
          the trigger altogether.

          They are grouped because they are one decision made at one point in the cycle, graded by how
          much of the cycle the clinician is willing to sacrifice. The third manoeuvre named in the same
          source - elective cryopreservation of all oocytes or embryos - is curated as its own treatment
          rather than folded in here, because it acts at a different time and on a different arm: it permits
          the trigger and the retrieval, and prevents only the LATE form driven by the endogenous hCG
          of an implanting pregnancy. All of these are distinct from primary prevention, which is the
          choice of stimulation protocol before the response is known.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Preventive Intervention
          term:
            id: NCIT:C15843
            label: Preventive Intervention
        notes: The same source distinguishes primary prevention - "personalized stimulation protocols
          in order to suit patients' characteristics (individually tailored COS, use of GnRH antagonist
          stimulation protocols, in vitro maturation)" - which happens before the ovarian response is
          known and is therefore a different decision from the three curated here.
      selected_evidence:
        snippet: Nowadays OHSS can easily be avoided by several prevention methods, ranging from identification
          of high-risk patients, choice of a correct protocol stimulation, trigger with gonadotropin-releasing
          hormone (GnRH) agonists or, finally, the freeze-all strategy.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/7
      evidence_path: /treatments/7/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34644798
