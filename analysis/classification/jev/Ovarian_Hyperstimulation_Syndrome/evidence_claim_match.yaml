    claim:
      about:
        disease:
          name: Ovarian Hyperstimulation Syndrome
          disease_term:
            preferred_term: ovarian hyperstimulation syndrome
            term:
              id: MONDO:0011972
              label: ovarian hyperstimulation syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ohss_tie1_human_relevance
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the EGR1-Tie1 axis that is required for hCG-induced VEGF in a granulosa-lutein cell
          line and in the rat model operate in intact human ovarian tissue, and is Tie1 therefore a usable
          therapeutic target?
        attaches_to:
        - pathophysiology#EGR1-TIE1 Amplification of Granulosa VEGF Output
        rationale: 'The Tie1 result is unusually well constructed for a mechanism at this stage: an association
          in granulosa cells taken from actual OHSS patients, a loss-of-function experiment abolishing
          the hCG-VEGF link in a human granulosa-lutein line, attenuation of the syndrome in rats, and
          an identified transcriptional route via EGR1. What it does not have is any demonstration in
          intact human ovary or any clinical exposure. The mismatch is mechanistically meaningful because
          the therapeutic argument for targeting Tie1 rests entirely on it sitting upstream of VEGF: an
          agent acting there would in principle spare the VEGFR-2-dependent luteal angiogenesis that a
          direct VEGFR-2 antagonist destroys, which is the specific reason SU5416 was abandoned. If the
          axis turns out to be a cell-line and rodent phenomenon, that argument disappears and the field
          is back to dose-separating a dopamine agonist. The reporting authors say as much themselves.'
        proposed_experiments:
        - experiment_id: ohss_tie1_egr1_human_ovarian_tissue
          name: Tie1 and EGR1 expression in human ovarian tissue across OHSS risk strata
          description: Quantify Tie1 and EGR1 in ovarian tissue or aspirated granulosa cells from women
            stratified by OHSS risk and by trigger type (hCG versus GnRH agonist), testing whether the
            induction predicted by the cell-line work is present in vivo and whether it tracks trigger
            exposure.
      selected_evidence:
        snippet: Taken together, our results indicate that Tie1 may be a therapeutic target in cases of
          moderate-to-severe OHSS. Further studies are needed to address its clinical relevance.
        supports: SUPPORT
