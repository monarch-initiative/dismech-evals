              label: ovarian hyperstimulation syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Promiscuous Activation of the Wild-Type FSH Receptor
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: A third, non-genetic and non-iatrogenic entry point that the same receptor biology
          predicts. The wild-type FSH receptor is not perfectly specific either; it is simply that the
          physiological concentrations of hCG and TSH never reach the threshold at which cross-activation
          matters. When they do — the very high hCG of a multiple or hydatidiform-molar pregnancy, the
          very high TSH of untreated hypothyroidism, or autonomous FSH secretion from a pituitary adenoma
          — the syndrome can occur sporadically in a woman with a normal FSHR. This is why an FSHR variant
          should not be assumed in every spontaneous case.
        biological_processes:
        - preferred_term: follicle-stimulating hormone signaling pathway
          modifier: INCREASED
          term:
            id: GO:0042699
            label: follicle-stimulating hormone signaling pathway
      selected_evidence:
        snippet: The syndrome has been previously reported in rare instances of increased production of
          human chorionic gonadotrophin (hCG) such as multiple pregnancies, hydatiforme mole, polycystic
          ovary disease and elevated concentrations of thyroid-stimulating hormone (TSH) in hypothyreoidism.
        supports: SUPPORT
