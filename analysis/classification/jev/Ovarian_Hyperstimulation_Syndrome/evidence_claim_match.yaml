        - path: /has_subtypes/1
          value:
            name: Familial Spontaneous OHSS
            display_name: Familial gestational spontaneous OHSS (FSHR-activating)
            description: A rare autosomal dominant form in which activating germline FSHR variants make
              the FSH receptor respond to hormones it should ignore. Affected women develop OHSS during
              spontaneous pregnancy, typically in the first trimester, with no fertility drug involved,
              and the syndrome recurs in successive pregnancies. This is the arm that gives MONDO:0011972
              its hereditary-disease parent and its FSHR gene association.
          role: subtype
      assertion_type: Genetic
      assertion:
        name: FSHR
        gene_term:
          preferred_term: FSHR
          term:
            id: hgnc:3969
            label: FSHR
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        subtype: Familial Spontaneous OHSS
        notes: 'FSHR (2p16.3) encodes the follitropin receptor, one of the three glycoprotein hormone
          receptors. Activating germline missense variants cause the familial gestational spontaneous
          form, and this is the gene MONDO records as causally associated with MONDO:0011972. Two structurally
          distinct mutation classes have been reported: transmembrane-helix variants (p.Thr449Ile, p.Thr449Ala,
          p.Asp567Asn, p.Asp567Gly, p.Ile545Thr) that lower the receptor''s intramolecular activation
          barrier, giving hCG and TSH responsiveness plus constitutive activity; and a single extracellular-domain
          variant (c.383C>A, p.Ser128Tyr) that instead raises hCG binding affinity with no constitutive
          activity and no TSH cross-reactivity. Both classes are heterozygous in the reported families.
          Note that FSHR variants explain the *familial* spontaneous cases only — sporadic spontaneous
          OHSS occurs with a normal receptor when hCG or TSH is high enough.'
      selected_evidence:
        snippet: All five mutants were abnormally activated by TSH and normal levels of hCG while displaying
          constitutive activity.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
