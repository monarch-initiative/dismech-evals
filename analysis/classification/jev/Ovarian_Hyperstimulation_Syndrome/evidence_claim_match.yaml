          requires a prolactin-responsive background that human OHSS does not have. The dose that separates
          permeability from angiogenesis was found in this species; the human prophylactic dose was chosen
          by extrapolation, and the clinical result reported alongside it is an uncontrolled comparison
          in oocyte donors rather than a randomised trial.
