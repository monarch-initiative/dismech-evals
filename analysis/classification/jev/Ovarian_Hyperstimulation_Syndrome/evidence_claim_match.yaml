      assertion:
        name: Iatrogenic OHSS
        display_name: Iatrogenic OHSS (complication of controlled ovarian stimulation)
        description: The common form, and effectively the whole clinical burden of the syndrome. Exogenous
          gonadotropins given for assisted reproduction recruit a large cohort of follicles, and the hCG
          used to trigger final oocyte maturation — or the endogenous hCG of an implanting pregnancy —
          drives the VEGF surge that produces the capillary leak. Because both the stimulation and the
          trigger are under the clinician's control, this form is substantially preventable.
      selected_evidence:
        snippet: Ovarian hyperstimulation syndrome (OHSS) occurs mainly after excessive stimulation of
          the ovaries by exogenous gonadotropins administrated in the context of in vitro fertilization
          procedures (iatrogenic OHSS).
