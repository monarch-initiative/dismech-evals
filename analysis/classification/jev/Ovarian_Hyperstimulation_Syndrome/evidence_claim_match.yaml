      assertion_type: Treatment
      assertion:
        name: Therapeutic Paracentesis and Thoracentesis
        description: 'Drainage of tense ascites, and of pleural fluid when the respiratory arm dominates.
          It is the one manoeuvre in established disease with an immediate, mechanically obvious effect:
          removing the fluid relieves the intra-abdominal pressure and the diaphragmatic splinting, which
          is why breathlessness often improves within minutes of a paracentesis that has changed nothing
          about the underlying leak.

          Curated separately from general supportive care because it is a procedure with its own NCIT
          identity and its own mechanistic target, whereas supportive care is the surrounding fluid and
          monitoring strategy.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Paracentesis
          term:
            id: NCIT:C15310
            label: Paracentesis
      selected_evidence:
        snippet: Only if severe/critical cases are diagnosed hospitalization is necessary for appropriate
          rehydration, monitoring of fluid balance and eventual drainage of ascitic fluid.
        supports: SUPPORT
