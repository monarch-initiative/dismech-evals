        context:
        - path: /treatments/2
          value:
            name: Intravenous Calcium for OHSS Prophylaxis
            description: 'Intravenous calcium given around oocyte retrieval, and on the current network
              meta-analytic evidence the best-supported prophylaxis in this entry - ranked above cabergoline
              in both published network meta-analyses, with a risk ratio of 0.14 for moderate-to-severe
              OHSS at high GRADE and a SUCRA of 92.4% in Wu 2022.

              "Best-supported" rather than "most effective", deliberately. In Guo 2016 the largest point
              estimate belongs to ASPIRIN (RR 0.07, rank probability 36% against calcium''s 35%), so calcium
              is not the top-ranked agent in both analyses. What distinguishes it is consistency: it is
              effective in both, at high GRADE in both, whereas aspirin is graded LOW in Wu 2022 and placed
              among the agents that could not prevent moderate-to-severe OHSS. Aspirin is curated separately
              with that discordance recorded.

              Its proposed mechanism is now curated as a node rather than waved at: calcium is thought
              to inhibit cyclic-AMP-stimulated renin secretion, damping the intra-ovarian renin-angiotensin
              system that gonadotropin stimulation activates, and so lowering VEGF expression in luteinized
              granulosa cells. An earlier revision of this entry claimed no verifiable source for that
              arm existed; that was wrong, and both network meta-analyses cited here state it.

              The caveat that remains is about strength, not existence. Both sources hedge ("could be
              by inhibiting"), neither cites a primary demonstration in an OHSS cohort, and the node is
              curated PROVISIONAL for that reason. This is still the entry''s clearest example of a therapy
              whose efficacy evidence outruns its mechanistic evidence - it just is not a therapy with
              no mechanism on record.'
