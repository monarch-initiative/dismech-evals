  513dc0ab0246597bcc43e3db36c16f9a06ed4b9a9858818b3506c9dade1f8c78:
    claim:
      about:
        disease:
          name: Ovarian Hyperstimulation Syndrome
          disease_term:
            preferred_term: ovarian hyperstimulation syndrome
            term:
              id: MONDO:0011972
              label: ovarian hyperstimulation syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Cabergoline
        description: 'A dopamine D2 receptor agonist given prophylactically to women identified as high
          risk. Its mechanism in this setting is specific and dose-dependent: at low dose it partially
          dephosphorylates ovarian VEGFR-2, which is enough to abolish the permeability response while
          leaving the VEGFR-2-dependent luteal angiogenesis a pregnancy requires intact. That separation
          is the reason a dopamine agonist is usable here where a direct VEGFR-2 antagonist such as SU5416
          is not — SU5416 prevented the leak in the rodent model but is thromboembolic and disrupts angiogenesis
          needed for pregnancy.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: cabergoline
            term:
              id: CHEBI:3286
              label: cabergoline
      selected_evidence:
        snippet: Prophylactic administration of cabergoline (5-10 microg/kg x d) decreased the occurrence
          of OHSS from 65% (controls) to 25% (treatment).
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
