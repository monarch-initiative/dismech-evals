  dadc647a8e84de812030b7ec807fbcd15d522d322f6c3b0dc8e963d7824b9893:
    claim:
      about:
        disease:
          name: Ovarian Hyperstimulation Syndrome
          disease_term:
            preferred_term: ovarian hyperstimulation syndrome
            term:
              id: MONDO:0011972
              label: ovarian hyperstimulation syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Thromboprophylaxis
        description: 'Anticoagulant prophylaxis in severe OHSS, aimed at the haemoconcentrated, stasis-prone
          state rather than at the capillary leak that produces it. It is described as cost-effective
          and widely used, and is one of the few interventions in established disease with any claim to
          a benefit.

          The size of the risk it addresses is worth stating precisely, because it is smaller and less
          certain than the syndrome''s reputation suggests. A systematic review of thromboembolism after
          assisted reproduction found the frequency of venous thromboembolism specifically related to
          OHSS to be under 0.001%, and the increase in risk conferred by OHSS on top of ART did not reach
          statistical significance, with a confidence interval spanning two orders of magnitude. The practice
          is therefore standard on the basis of consequence severity and low cost, not on a demonstrated
          effect size. Low dose aspirin, by contrast, remains contested.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Anticoagulation Therapy
          term:
            id: NCIT:C63341
            label: Anticoagulation Therapy
      selected_evidence:
        snippet: 'The risk of VTE after ART complicated by OHSS, as compared to ART without OHSS, was
          higher but not statistically significant (RR: 14.83; 95% CI: 0.86-255.62).'
        supports: SUPPORT
    origin:
      assertion_path: /treatments/9
