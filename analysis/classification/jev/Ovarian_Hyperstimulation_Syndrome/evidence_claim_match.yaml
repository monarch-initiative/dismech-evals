          counterpart of the abolished VEGF rise seen in the cell line.
        limitations: 'Rat ovarian physiology differs from human in cycle length and in the relative roles
          of FSH and hCG, and an experimentally induced OHSS model compresses the stimulus into a schedule
          no patient experiences. The histological attenuation is also a structural rather than a functional
          readout: no measurement of vascular permeability or third-space fluid in the treated animals
          is reported.'
        readouts:
        - name: Ovarian Tie1 and VEGF expression in induced OHSS
          target: EGR1-TIE1 Amplification of Granulosa VEGF Output
