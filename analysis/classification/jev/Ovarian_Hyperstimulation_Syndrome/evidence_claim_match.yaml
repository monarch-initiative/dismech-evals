            label: endothelial cell of vascular tree
      selected_evidence:
        snippet: OHSS is caused by increased vascular permeability (VP) through ovarian hypersecretion
          of vascular endothelial growth factor (VEGF)-activating VEGF receptor 2 (VEGFR-2).
