  cbf0bfaa3c7dbdaa5baca75fc7eb502f230f7814abd0c8a88a0dcb7b13c058ef:
    claim:
      about:
        disease:
          name: Ovarian Hyperstimulation Syndrome
          disease_term:
            preferred_term: ovarian hyperstimulation syndrome
            term:
              id: MONDO:0011972
              label: ovarian hyperstimulation syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ohss_established_disease_evidence_base
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is there any intervention that shortens or attenuates established OHSS, rather than preventing
          it?
        attaches_to:
        - pathophysiology#Third-Space Fluid Shift and Intravascular Volume Depletion
        rationale: Almost the entire evidence base for this syndrome sits on the preventive side of the
          hCG trigger — protocol choice, trigger substitution, freeze-all, prophylactic cabergoline. Once
          the capillary leak is established, management is supportive and, by the reviewing authors' own
          account, based on consensus rather than evidence. That asymmetry is defensible while prevention
          keeps working, but it leaves the women who develop severe disease anyway with no treatment aimed
          at the mechanism. Whether the VEGFR-2 node remains modifiable after the leak has started — that
          is, whether cabergoline has any therapeutic as opposed to prophylactic effect — is the specific
          unanswered question, and the cabergoline evidence cited here is prophylactic only.
        proposed_experiments:
        - experiment_id: ohss_cabergoline_established_disease_rct
          experiment_design: INTERVENTIONAL_TRIAL
          name: Randomised trial of cabergoline in established moderate-to-severe OHSS
          description: Randomise women hospitalised with established moderate-to-severe OHSS to cabergoline
            or placebo on top of standard supportive care, with time to resolution of ascites, haematocrit
            trajectory and length of stay as outcomes, to test whether the VEGFR-2 node is still modifiable
            once the leak is established.
      selected_evidence:
        snippet: Treatment is largely supportive and is based mainly on consensus statements rather than
          evidence.
        supports: SUPPORT
