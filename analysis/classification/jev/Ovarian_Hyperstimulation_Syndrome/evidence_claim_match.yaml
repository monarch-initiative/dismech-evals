  554dbaa9933425c02b3fadbbcdaf0b5a6f3a46c515297a10844269ccc72bb39a:
    claim:
      about:
        disease:
          name: Ovarian Hyperstimulation Syndrome
          disease_term:
            preferred_term: ovarian hyperstimulation syndrome
            term:
              id: MONDO:0011972
              label: ovarian hyperstimulation syndrome
        context:
        - path: /has_subtypes/1
          value:
            name: Familial Spontaneous OHSS
            display_name: Familial gestational spontaneous OHSS (FSHR-activating)
            description: A rare autosomal dominant form in which activating germline FSHR variants make
              the FSH receptor respond to hormones it should ignore. Affected women develop OHSS during
              spontaneous pregnancy, typically in the first trimester, with no fertility drug involved,
              and the syndrome recurs in successive pregnancies. This is the arm that gives MONDO:0011972
              its hereditary-disease parent and its FSHR gene association.
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Promiscuous FSH Receptor Activation by hCG or TSH
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        subtypes:
        - Familial Spontaneous OHSS
        description: 'The hereditary entry point, and the reason MONDO:0011972 carries an FSHR gene association.
          The glycoprotein hormone receptors share a common architecture, and their ligand specificity
          is maintained by an intramolecular activation barrier rather than by binding affinity alone.
          Activating germline FSHR variants lower that barrier: the receptor becomes abnormally sensitive
          to hCG, in most reported mutants also to TSH, and shows ligand-independent basal activity. The
          consequence is that the hCG of an ordinary first trimester stimulates the FSH receptor as though
          it were FSH. The p.Ser128Tyr allele in the extracellular domain is the mechanistic exception
          that proves the rule — it raises hCG affinity without conferring constitutive activity or TSH
          responsiveness, so more than one molecular route reaches the same phenotype.'
        genes:
        - preferred_term: FSHR
          term:
            id: hgnc:3969
            label: FSHR
        genetic_context:
          functional_impact_category: GAIN_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: Heterozygous germline missense variants in FSHR. Reported alleles include p.Thr449Ile,
            p.Thr449Ala, p.Asp567Asn, p.Asp567Gly and p.Ile545Thr in the transmembrane helices, and p.Ser128Tyr
            in the extracellular domain.
        biological_processes:
        - preferred_term: follicle-stimulating hormone signaling pathway
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0042699
            label: follicle-stimulating hormone signaling pathway
      selected_evidence:
        snippet: The two mutant FSHr (T449I, D567N) harbor aminoacid substitutions in the serpentine portion
          of the receptor and display abnormally high sensitivity to the pregnancy hormone hCG, thus providing
          a satisfactory explanation to the phenotype.
        supports: SUPPORT
    origin:
