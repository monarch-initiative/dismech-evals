  0ee82625d6504a78bca4497bdb7900be5bb6a5d24fe3eb60c78acb4c5354cd49:
    claim:
      about:
        disease:
          name: Ovarian Hyperstimulation Syndrome
          disease_term:
            preferred_term: ovarian hyperstimulation syndrome
            term:
              id: MONDO:0011972
              label: ovarian hyperstimulation syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ovarian Renin-Angiotensin System Activation
        biological_scale: MOLECULAR
        role: modifier
        mechanism_confidence: PROVISIONAL
        description: 'A second proposed route from the stimulated ovary to VEGF, running in parallel with
          the direct hCG-driven secretion rather than replacing it. The stimulated ovary contains its
          own renin-angiotensin system: prorenin and renin were reported in the follicular fluid of gonadotropin-stimulated
          ovaries at significantly higher levels than in unstimulated ovaries as far back as 1987. Renin
          secretion is cyclic-AMP-stimulated, and the resulting angiotensin signalling is proposed to
          raise VEGF expression in human luteinized granulosa cells.

          Its practical importance is that it is the only mechanistic account of why intravenous calcium
          - the agent that ranks ABOVE cabergoline in both network meta-analyses of OHSS prophylaxis -
          should work at all: calcium is proposed to inhibit cAMP-stimulated renin secretion and so reduce
          VEGF.

          Curated as a modifier rather than a required step, and as PROVISIONAL. The two sources that
          describe the calcium mechanism hedge it in their own wording ("could be by inhibiting"), and
          no primary demonstration in an OHSS cohort is cited anywhere in this entry''s reference set.
          A third source in the reference set is notably NOT hedged - PMID:18956797 calls the ovarian
          RAS "clearly central to the pathogenesis" - but it asserts that in a single background sentence
          without supporting data of its own, so it is curated as PARTIAL and does not by itself lift
          the node above PROVISIONAL. Recording both is the point: the disagreement about how settled
          this mechanism is exists in the literature, not just in this entry.

          A note on the process term. This node is deliberately left with a free-text `preferred_term`
          and NO `term:` binding. The obvious candidate, GO:0002001 "renin secretion into blood stream",
          is defined as release of renin into the blood by JUXTAGLOMERULAR cells - a systemic, kidney-specific
          process. What is modelled here is local, intra-ovarian renin acting on granulosa cells, so that
          term would contradict both the compartment and the cell type recorded in the same node. GO has
          a precedent for a local RAS (GO:0002035, brain renin-angiotensin system) but no ovarian analogue,
          which makes this a legitimate new-term request rather than a gap in the search. No term beats
          a bad one.'
        biological_processes:
        - preferred_term: intra-ovarian renin secretion
          modifier: INCREASED
        cell_types:
        - preferred_term: Luteinized granulosa cell
          term:
            id: CL:0000501
            label: granulosa cell
      selected_evidence:
        snippet: As far back as 1987, there was evidence that a significantly higher level of prerenin
          and renin were in the ovarian follicular fluid of Gn-stimulated ovaries compared with ovaries
          without Gn stimulation
        supports: SUPPORT
