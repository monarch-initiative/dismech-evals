      assertion_type: Pathophysiology
      assertion:
        name: Adnexal Torsion and Ovarian Infarction
        biological_scale: TISSUE
        role: consequence
        mechanism_confidence: PROVISIONAL
        description: 'A surgical complication of the enlarged ovary, distinct from the capillary-leak
          arm of the disease and not dependent on it. It is presented here as provisional because the
          direct evidence is a single reported case in an FSHR variant carrier rather than a series; the
          general association between ovarian enlargement and torsion is not in dispute, but its frequency
          in OHSS specifically is not quantified in the cited literature. The case is instructive for
          a second reason: it occurred while the woman was neither pregnant nor receiving fertility treatment,
          showing that the ovarian risk of an activating FSHR allele is not confined to gestation.'
      selected_evidence:
        snippet: She underwent laparoscopy with unilateral adnexectomy for ovarian ischemic necrosis due
          to adnexal torsion.
        supports: SUPPORT
