  536e9549c1f760944b6290ebff3a153cccd4bc607aae6e9790a7263290b9d698:
    claim:
      about:
        disease:
          name: Ovarian Hyperstimulation Syndrome
          disease_term:
            preferred_term: ovarian hyperstimulation syndrome
            term:
              id: MONDO:0011972
              label: ovarian hyperstimulation syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Albumin for OHSS Prophylaxis
        description: 'Intravenous albumin around oocyte retrieval, curated here specifically BECAUSE the
          signal is unfavourable rather than despite it. Albumin has been widely used on the colloid rationale,
          but the earlier network meta-analysis found it associated with a lower pregnancy rate than placebo
          (RR 0.85, 95% CI 0.74-0.97), and the later one does not include it among the effective preventive
          agents.

          A prophylaxis that may cost the pregnancy the whole treatment cycle exists to achieve is a different
          kind of intervention from one that merely fails, and an entry that curated only the drugs that
          work would misrepresent the decision a clinician is actually making.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: human albumin
        notes: 'The `therapeutic_agent` is deliberately UNBOUND. The suggested `NCIT:C65218 Albumin (Human)`
          exists and has the right label, but `runoak ancestors -p i` places it under `NCIT:C17021 Protein`
          / `NCIT:C26548 Gene Product` - not under `NCIT:C1909 Pharmacologic Substance` - so it is not
          reachable from either root of the `ChemicalEntityTerm` enum and `just validate-terms` rejects
          it. Searching further found no live substitute: the NCIT albumin concepts are measurements (`NCIT:C61015`),
          radiolabelled imaging agents (`NCIT:C2557`, `NCIT:C29127`), or non-human (`NCIT:C85253`), and
          CHEBI offers only the class term `CHEBI:166964 albumin type`. Free-text `preferred_term` with
          the search recorded is the honest outcome; no term beats a bad one.

          `therapeutic_modality: OTHER`, not `PROTEIN_REPLACEMENT`. Albumin is used here as a colloid
          volume expander opposing the third-space shift, not to replace a protein the patient is congenitally
          missing - which is what PROTEIN_REPLACEMENT denotes elsewhere in the schema (enzyme and factor
          replacement in inborn errors). The same reasoning puts hydroxyethyl starch, a polysaccharide
          colloid, on OTHER rather than SMALL_MOLECULE.'
      selected_evidence:
        snippet: Additionally, albumin might decrease the pregnancy rate when compared with placebo [RR
          0.85, 95% CI 0.74-0.97, p < 0.05].
        supports: REFUTE
    origin:
      assertion_path: /treatments/6
      evidence_path: /treatments/6/evidence/0
