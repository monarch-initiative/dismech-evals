          - the hCG trigger, or the endogenous hCG of an implanting pregnancy - luteinizes the whole recruited
          cohort at once, so the ovary comes to contain many simultaneously luteinized follicles instead
          of one corpus luteum. That expanded mass of luteinized granulosa tissue is the secretory organ
          of the syndrome.

