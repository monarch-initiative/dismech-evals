              label: ovarian hyperstimulation syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: GnRH Agonist Trigger in a GnRH Antagonist Cycle
        description: The single most effective preventive change to the stimulation protocol. Substituting
          a GnRH agonist for hCG to trigger final oocyte maturation removes the long-acting hCG stimulus
          that drives ovarian VEGF secretion, replacing it with a short endogenous LH surge. The trade-off
          is a deficient luteal phase, which is why the strategy is paired with luteal support or with
          elective freezing of all embryos; a meta-analysis of five randomised trials found live birth
          rates comparable to an hCG trigger when LH activity luteal support was individualised.
        therapeutic_modality: PEPTIDE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: OHSS was reported in a total of 4/413 cases in the GnRHa group compared to 7/413 in the
          hCG group (OR 0.48, 95% CI 0.15, 1.60).
        supports: SUPPORT
