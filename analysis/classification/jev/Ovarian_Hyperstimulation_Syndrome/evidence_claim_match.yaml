      assertion_type: Discussion
      assertion:
        discussion_id: ohss_hcg_not_obligate
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is human chorionic gonadotropin actually necessary for OHSS to develop, and if not, what
          supplies the VEGF stimulus in the cases that occur without it?
        attaches_to:
        - pathophysiology#Ovarian VEGF Hypersecretion
        - pathophysiology#hCG-Driven Luteinization of the Recruited Cohort
        rationale: The whole preventive strategy of modern assisted reproduction — substituting a GnRH
          agonist trigger for hCG, freezing all embryos to avoid endogenous pregnancy hCG — is built on
          hCG being the obligatory driver of the VEGF surge. A 2016 review states that recent case reports
          have shown OHSS occurring without it. If that is right, then either the luteinized ovary can
          reach the VEGF threshold on LH activity alone in some women, or a second stimulus exists that
          current protocols do not remove, and the residual OHSS seen in agonist-trigger cycles is explained
          rather than anomalous. The entry's causal chain is drawn with hCG as the principal but not the
          sole stimulus for that reason.
        proposed_experiments:
        - experiment_id: ohss_vegf_in_agonist_trigger_cases
          name: Serial serum VEGF in agonist-trigger cycles complicated by OHSS
          description: Measure circulating VEGF serially in women who develop OHSS after a GnRH agonist
            trigger with no hCG exposure, comparing against hCG-triggered cases matched for follicle count,
            to establish whether the VEGF surge occurs at comparable magnitude without hCG.
      selected_evidence:
        snippet: Human chorionic gonadotropin was previously thought to be necessary for OHSS to occur;
          however, recent case reports have proven otherwise.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27273307
      reference_title: Pathophysiology, treatment and prevention of ovarian hyperstimulation syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: States directly that the assumed obligate role of hCG has been contradicted by case
        reports.
