      assertion_type: Pathophysiology
      assertion:
        name: Increased Systemic Vascular Permeability
        biological_scale: TISSUE
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'The endothelial-barrier consequence: capillary beds throughout the body, not only
          in the ovary, become permeable to protein and water. That the permeability is systemic rather
          than local is the whole reason an ovarian problem produces pleural effusion, renal hypoperfusion
          and thrombosis, and it is why the syndrome is a capillary-leak illness rather than a gynaecological
          one.

          The mediator is not regarded as settled. VEGF is the leading candidate and the only one with
          interventional evidence, but a clinical review is explicit that the pathophysiology is incompletely
          understood, and an anti-Mullerian-hormone/dendritic-cell/interleukin arm has been proposed alongside
          it.'
        biological_processes:
        - preferred_term: positive regulation of vascular permeability
          modifier: INCREASED
          term:
            id: GO:0043117
            label: positive regulation of vascular permeability
        cell_types:
        - preferred_term: Vascular endothelial cell
          term:
            id: CL:0002139
            label: endothelial cell of vascular tree
      selected_evidence:
        snippet: Pathogenesis of the disease is based on massive transudation of protein-rich fluid from
          the vascular compartment into the peritoneal, pleural and pericardial spaces, with a variable
          picture of clinical manifestations depending on its severity.
        supports: SUPPORT
