            id: UBERON:0000992
            label: ovary
        - preferred_term: peritoneum
          term:
            id: UBERON:0002358
            label: peritoneum
      selected_evidence:
        snippet: advanced mEOC (Stage III/IV) has a very dismal one, with a median overall survival (OS)
          of 12–14 months, well below the 37–42 months OS observed in patients with non-mucinous epithelial
          ovarian cancer
        supports: SUPPORT
