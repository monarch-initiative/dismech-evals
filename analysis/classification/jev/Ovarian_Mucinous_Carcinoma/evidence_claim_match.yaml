      assertion_type: Pathophysiology
      assertion:
        name: MAPK Pathway Activation
        description: Constitutive MAPK (RAS-RAF-MEK-ERK) signaling is the convergent proliferative engine
          of mucinous ovarian carcinoma, driven by mutant KRAS and reinforced by HER2 amplification (and
          occasional BRAF mutation). Sustained MAPK output promotes uncontrolled proliferation and contributes
          to the intrinsic chemoresistance of this histotype.
        cell_types:
        - preferred_term: epithelial cell
          term:
            id: CL:0000066
            label: epithelial cell
        biological_processes:
        - preferred_term: MAPK cascade
          modifier: INCREASED
          term:
            id: GO:0000165
            label: MAPK cascade
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: mutations in genes that activate the mitogen activated protein kinase (MAPK) pathways
          (such as BRAF, AKT1 and PI3K)
        supports: SUPPORT
