      assertion:
        name: Immunohistochemical Profiling (CK7/CK20/CDX2/SATB2)
        diagnosis_term:
          preferred_term: immunohistochemical test
          term:
            id: NCIT:C51944
            label: Immunohistochemical Test
        description: Immunohistochemistry using CK7, CK20, SATB2, CDX2, WT1, ER, and PR helps distinguish
          primary ovarian mucinous carcinoma (typically diffuse strong CK7 positivity with variable/non-diffuse
          CK20 and negative SATB2 in non-teratoma-associated primaries) from metastatic lower gastrointestinal
          mucinous adenocarcinoma, while CDX2 expression and absence of WT1, ER, and PR help separate
          mucinous carcinoma from endometrioid (ER+) and serous (WT1+/ER+) ovarian carcinomas.
        results: Diffuse strong CK7 positivity, variable/non-diffuse CK20 expression, and negative SATB2
          (in non-teratoma-associated primary tumors) support primary ovarian mucinous carcinoma over
          lower gastrointestinal metastasis, while CDX2 positivity with absent WT1, ER, and PR distinguishes
          it from serous and endometrioid ovarian carcinomas.
      selected_evidence:
        snippet: MC immunoprofile is characterized by diffuse and strong positivity for CK7 with variable,
          negative to irregular, but generally not diffuse expression of CK20, although teratoma-associated
          mucinous tumors are often CK7 negative/CK20 positive.
        supports: SUPPORT
