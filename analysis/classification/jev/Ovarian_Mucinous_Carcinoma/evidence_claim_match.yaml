      assertion_type: Pathophysiology
      assertion:
        name: Stepwise Mucinous Tumor Progression
        description: Primary ovarian mucinous carcinoma develops through a morphologic and molecular continuum
          from benign mucinous cystadenoma through atypical proliferative (borderline) tumor to invasive
          carcinoma, often coexisting within the same tumor mass. This stepwise sequence anchors the disease
          as a progression-driven epithelial malignancy.
        cell_types:
