        name: Secondary Erythrocyte Stomatin Deficiency
        biological_scale: MOLECULAR
        description: OHSt red cells are near-completely deficient in the 32 kDa membrane protein stomatin
          (band 7.2b), the finding after which the protein was originally named. No mutation in the stomatin
          gene is found; the protein is mis-trafficked and lost on erythroid maturation. This is a secondary
          correlate of the primary RhAG defect, a dead-end branch that does not drive the haemolysis.
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
        cellular_components:
        - preferred_term: erythrocyte plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
      selected_evidence:
        snippet: The 32 kD lipid-raft-associated membrane protein 'stomatin' is deficient from the erythrocyte
          membrane in the Na+-K+ leaky haemolytic anaemia, overhydrated hereditary stomatocytosis (OHSt).
        supports: SUPPORT
