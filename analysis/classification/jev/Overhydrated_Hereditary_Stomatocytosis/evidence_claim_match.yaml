      assertion_type: Pathophysiology
      assertion:
        name: Net Erythrocyte Cation Gain
        biological_scale: CELLULAR
        description: Because sodium influx through the leak exceeds potassium efflux, the cell gains monovalent
          cations overall. Net intracellular cation content, not any single ion, sets erythrocyte volume,
          so a net gain commits the cell to swelling.
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
        biological_processes:
        - preferred_term: sodium ion import across plasma membrane
          modifier: INCREASED
          term:
            id: GO:0098719
            label: sodium ion import across plasma membrane
      selected_evidence:
        snippet: Erythrocytes swell when the inward sodium leak exceeds the potassium leak out and shrink
          when the potassium leak out exceeds the inward sodium leak.
        supports: SUPPORT
    origin:
