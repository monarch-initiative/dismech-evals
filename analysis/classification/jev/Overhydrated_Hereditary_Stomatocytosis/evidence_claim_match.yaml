        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RhAG Nonselective Cation Pore Formation
        biological_scale: MOLECULAR
        description: RhAG belongs to the ammonium-transporter family, whose members form pore-like structures.
          Molecular modelling on the homologous Nitrosomonas europaea Rh50 protein indicates that the
          OHSt substitutions widen the central channel and convert it into a non-selective cation pore,
          a qualitative gain of a conductance the wild-type protein does not normally provide.
        molecular_functions:
        - preferred_term: monovalent cation pore activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0008324
            label: monoatomic cation transmembrane transporter activity
      selected_evidence:
        snippet: We have modeled RhAG on the homologous Nitrosomonas europaea Rh50 protein and shown that
          these mutations are likely to lead to an opening of the pore.
        supports: SUPPORT
