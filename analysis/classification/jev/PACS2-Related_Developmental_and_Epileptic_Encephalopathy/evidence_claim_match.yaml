            term:
              id: MONDO:0054845
              label: developmental and epileptic encephalopathy, 66
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_why_the_epilepsy_improves_with_age
        prompt: Seizures in DEE66 are difficult to control in the first year and then frequently improve
          or remit in early childhood. What changes? And does the underlying mechanism remit with them,
          or does it persist and re-emerge?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Neonatal-Onset Epilepsy with Age-Dependent Improvement
        - pathophysiology#Cortical Network Hyperexcitability
        rationale: 'Age-dependent improvement sets DEE66 apart from most developmental and epileptic encephalopathies,
          where drug resistance persists, and it is a clinically consequential difference: it changes
          what families are told and how aggressively early polytherapy is pursued. Yet nothing explains
          it. The cerebellar dysgenesis is a fixed malformation and cannot remit, so whatever improves
          is not the structural lesion. No electrophysiological work in any PACS2 system has characterised
          cortical excitability at any age, so there is no measurement of the thing that is supposed to
          be changing. The question is sharpened by the small adult literature, which describes progressive
          decline rather than continued improvement - only four adults have been reported, so this is
          a signal rather than an established biphasic course, but if real it would mean the early remission
          masks an ongoing process rather than reflecting a resolved one.'
        proposed_experiments:
        - experiment_id: exp_longitudinal_excitability_across_development
          name: Developmental time course of cortical excitability in an E209K model
          description: In a validated in vivo or organoid E209K model, record cortical network excitability
            at neonatal, juvenile and adult equivalent stages, and ask whether excitability normalises
            on the same schedule as the clinical seizures. A model whose excitability normalises would
            locate the remission in the cortex; one whose excitability persists unchanged while seizures
            stop would point instead to a compensatory change elsewhere and would support the concern
            that the improvement is symptomatic rather than mechanistic.
      selected_evidence:
        snippet: Mixed focal and generalized epilepsy occurred in the neonatal period, controlled with
          difficulty in the first year, but many improved in early childhood.
        supports: SUPPORT
    origin:
