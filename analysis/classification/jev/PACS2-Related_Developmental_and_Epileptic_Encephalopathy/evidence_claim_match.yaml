  cb15f5bfcd6f22a0cf6fff61cf0222f1ace9a0ffed5067c258f0902ab8fff903:
    claim:
      about:
        disease:
          name: PACS2-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 66
            term:
              id: MONDO:0054845
              label: developmental and epileptic encephalopathy, 66
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mam_role_asserted_but_not_measured_for_e209k
        prompt: PACS2's role at mitochondria-associated ER membranes is routinely invoked to explain DEE66.
          Has any study actually measured a MAM defect for the E209K variant?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired PACS2 Autoregulatory Domain Function
        - pathophysiology#Increased Susceptibility to Stress-Induced Apoptosis
        rationale: 'PACS2 is well established in the general cell-biology literature as a regulator of
          ER-mitochondria contact sites, and reviews of this disorder frequently carry that role forward
          as the mechanism. The gap is that the step from "PACS2 does this" to "the E209K variant breaks
          this" was not evidenced in any source verified for this entry. This entry therefore curates
          only what was measured - autoregulatory-domain impairment, slowed turnover, increased 14-3-3-epsilon
          association, increased stress-induced apoptosis - and deliberately does not carry a MAM node,
          because doing so would import a plausible mechanism as though it were a finding. That matters
          beyond bookkeeping: a MAM-centred model predicts calcium-handling and mitochondrial-energetics
          phenotypes and suggests quite different therapeutic targets from a trafficking-centred or proteostasis-centred
          model, and the three are currently not distinguished by evidence.'
        proposed_experiments:
        - experiment_id: exp_mam_integrity_in_e209k_neurons
          name: Direct measurement of ER-mitochondria contact in E209K neurons
          description: In isogenic patient-derived neurons, quantify ER-mitochondria contact site number
            and width by electron microscopy or split-fluorophore reporter, together with ER-to-mitochondria
            calcium transfer and mitochondrial membrane potential. This would either substantiate the
            MAM model in the correct cell type or exclude it, and in either case it would tell curators
            whether the widely repeated MAM account belongs in the pathograph.
      selected_evidence:
        snippet: Functional studies demonstrated that the PACS2 recurrent variant reduces the ability
          of the predicted autoregulatory domain to modulate the interaction between the PACS2 FBR and
          client proteins, which may disturb cellular function.
        supports: SUPPORT
