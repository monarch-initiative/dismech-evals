        biological_scale: MOLECULAR
        description: A heterozygous de novo missense variant, in nearly all reported individuals the recurrent
          c.625G>A p.(Glu209Lys) change. This node records the lesion only. Note the disorder is defined
          by one recurrent substitution rather than by a spectrum of loss-of-function alleles, which is
          why the downstream arms are all consequences of a single specific protein change rather than
          of absent protein.
