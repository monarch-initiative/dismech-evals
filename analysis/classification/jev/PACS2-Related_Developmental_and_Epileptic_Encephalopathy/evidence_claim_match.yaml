  f69023cb1d807019bb83cb93ce6edce0cb25e69070b2e5d15950f3a57d764145:
    claim:
      about:
        disease:
          name: PACS2-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 66
            term:
              id: MONDO:0054845
              label: developmental and epileptic encephalopathy, 66
        context: []
      assertion_type: Genetic
      assertion:
        name: PACS2
        gene_term:
          preferred_term: PACS2
          term:
            id: hgnc:23794
            label: PACS2
        relationship_type: CAUSATIVE
        association: A heterozygous de novo missense variant in PACS2, in nearly all reported individuals
          the recurrent c.625G>A p.(Glu209Lys) change, causes DEE66.
        notes: 'PACS2 encodes a multifunctional sorting protein that traffics cargo between the endoplasmic
          reticulum, Golgi, mitochondria, lysosomes and plasma membrane, working through an N-terminal
          furin-binding region that engages cargo together with adaptor proteins. Unlike most developmental
          and epileptic encephalopathy genes, the disorder is defined by one recurrent substitution rather
          than a spectrum of loss-of-function alleles, so the mechanism curated here is the consequence
          of a specific protein change and not of absent protein. Deliberate scope note: PACS2''s role
          at mitochondria-associated ER membranes is well described in the general cell biology literature
          and is frequently invoked for this disorder, but no source verified for this entry measures
          a MAM-integrity defect for the E209K variant itself. The entry therefore curates what was measured
          - autoregulatory-domain impairment, slowed turnover, increased 14-3-3-epsilon association and
          increased stress-induced apoptosis - and does not assert a MAM defect. PACS1, the paralog, causes
          Schuurs-Hoeijmakers syndrome through its own recurrent variant, and the two disorders were explicitly
          compared when DEE66 was delineated. A second recurrent allele, p.(Glu211Lys), is reported in
          a single case and sits two residues from the main hotspot in the same regulatory region; the
          mechanism curated here is derived from E209K and this entry does not assume the two behave identically.
          The c.625G>A allele is absent from population databases and classified pathogenic or likely
          pathogenic in ClinVar, which is what makes a single heterozygous finding diagnostic in the right
          clinical context.'
      selected_evidence:
        snippet: PACS2 is an important PACS1 paralog and encodes a multifunctional sorting protein involved
          in nuclear gene expression and pathway traffic regulation.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
