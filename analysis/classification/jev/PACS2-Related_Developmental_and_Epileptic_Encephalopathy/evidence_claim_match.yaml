  a62d1acde184fede1b19f8924cdab3c2372a914cad4badb67e7d3bb7ff49f0fd:
    claim:
      about:
        disease:
          name: PACS2-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 66
            term:
              id: MONDO:0054845
              label: developmental and epileptic encephalopathy, 66
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_heterologous_cell_line_versus_neural_disease
        prompt: The entire molecular mechanism of DEE66 - altered proteostasis, 14-3-3-epsilon binding,
          apoptotic susceptibility - was measured in colorectal carcinoma and 293T cells. Does any of
          it hold in a neuron, a cerebellum, or a developing brain?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Increased Susceptibility to Stress-Induced Apoptosis
        - pathophysiology#Altered PACS2 Proteostasis
        - pathophysiology#Cerebellar Dysgenesis
        rationale: 'This is the sharpest limitation in the entry, and it is structural rather than incidental.
          Every mechanistic measurement supporting the apoptosis arm comes from transfected transformed
          cell lines, and the apoptosis readout additionally requires an applied stressor rather than
          reporting spontaneous death. The disease phenotype, meanwhile, is a cerebellar malformation
          and a neonatal cortical epilepsy - neither of which is a cell-autonomous stress-death phenotype,
          and neither of which has been reproduced in any published in vivo model. A mouse carrying the
          variant has been reported to exist but no peer-reviewed phenotypic characterisation is available,
          and patient-derived iPSC neurons are in progress without published data. So the causal edge
          from apoptotic susceptibility to cerebellar dysgenesis is typed as having unknown intermediates
          for a reason: it is the field''s working hypothesis, not a demonstrated route. The alternative
          possibility, that the developmental malformation arises from disturbed cargo trafficking during
          cerebellar morphogenesis with apoptosis playing little part, is equally consistent with everything
          currently published, and the same systematic review names candidate intermediates for it - neuronal
          migration, neurogenesis, cerebellum development and dendritic arborization - none of which requires
          cell death.'
        proposed_experiments:
        - experiment_id: exp_isogenic_ipsc_cerebellar_organoid_e209k
          name: Isogenic E209K cerebellar organoids with apoptosis and trafficking readouts
          description: Differentiate patient-derived and CRISPR-corrected isogenic iPSC lines into cerebellar
            organoids and measure, side by side, baseline and stressed apoptosis in Purkinje and granule
            lineages, foliation and vermis morphology, and cargo trafficking through the PACS2 furin-binding
            region. If dysgenesis appears without a baseline apoptosis difference, the trafficking route
            is implicated and the apoptosis arm is an artefact of the heterologous system.
      selected_evidence:
        snippet: we found that PACS-2 E209K increased susceptibility to staurosporine-induced apoptosis
          in HCT 116 cells
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36188273
      reference_title: The Phosphofurin Acidic Cluster Sorting Protein 2 (PACS-2) E209K Mutation Responsible
        for PACS-2 Syndrome Increases Susceptibility to Apoptosis.
      evidence_source: IN_VITRO
      explanation: 'Names both the effect and the cell line, which is precisely the mismatch: HCT116 is
        a colorectal carcinoma line, not neural tissue.'
