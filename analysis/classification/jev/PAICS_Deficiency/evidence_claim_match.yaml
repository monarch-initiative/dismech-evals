              label: PAICS deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired De Novo Purine Synthesis
        description: Reduced flux through de novo purine nucleotide synthesis. The expected corollary
          — accumulation of the blocked substrates aminoimidazole ribotide (AIR) and aminoimidazole riboside
          (AIr) — was looked for and not found in patient fibroblasts, which is why no diagnostic metabolite
          exists for this disorder. AIr is cytotoxic to cell lines, so substrate toxicity remains a plausible
          but undemonstrated contributor in patients.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: '''de novo'' IMP biosynthetic process'
          term:
            id: GO:0006189
            label: '''de novo'' IMP biosynthetic process'
          modifier: DECREASED
      selected_evidence:
        snippet: Although aminoimidazole ribotide (AIR) and aminoimidazole riboside (AIr), the enzyme
          substrates that are predicted to accumulate in PAICS deficiency, were not detected in patient's
          fibroblasts, the cytotoxic effect of AIr on various cell lines was demonstrated.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31600779
      reference_title: PAICS deficiency, a new defect of de novo purine synthesis resulting in multiple
