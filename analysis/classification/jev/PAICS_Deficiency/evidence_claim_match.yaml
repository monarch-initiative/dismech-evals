              id: MONDO:0859003
              label: PAICS deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Purinosome Assembly
        description: The purinosome is the transient multienzyme complex in which the ten de novo purine
          synthesis enzymes are co-localized for substrate channelling. Patient fibroblasts fail to form
          it, and this is corrected by wild-type but not mutant PAICS. The same failure occurs in adenylosuccinate
          lyase deficiency and AICA-ribosiduria, the two previously known DNPS defects, which makes disrupted
          purinosome assembly the shared cellular lesion of this disease group.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: skin fibroblast
          term:
            id: CL:0002620
            label: skin fibroblast
        biological_processes:
        - preferred_term: purine nucleotide biosynthetic process
          term:
            id: GO:0006164
            label: purine nucleotide biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: Similar to other two known DNPS defects-adenylosuccinate lyase deficiency and AICA-ribosiduria-the
          PAICS mutation prevented purinosome formation in the patient's skin fibroblasts
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
