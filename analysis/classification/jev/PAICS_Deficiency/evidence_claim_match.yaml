              id: MONDO:0859003
              label: PAICS deficiency
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'At least six reported individuals: three with the malformation syndrome and no neurologic
          involvement, a separately reported sibpair with neurodevelopmental regression and no malformations,
          and a sixth compound heterozygous patient combining features of both. One antenatally suspected
          sibling could not be confirmed molecularly. No population-based prevalence estimate exists.'
      selected_evidence:
        snippet: Phosphoribosylaminoimidazole carboxylase (PAICS) deficiency, caused by biallelic variants
          in PAICS gene, is an inborn error of de novo purine synthesis. Only two patients from a consanguineous
          family have been reported, with multiple congenital malformations, resulting in early neonatal
          death. Molecular analysis identified a homozygous p.(Lys53Arg) missense variant. We report the
          third case of PAICS deficiency in a 7 years old boy, presenting with polymalformative syndrome,
          but normal neurodevelopment. ... A probable recurrence of PAICS deficiency occurred in a sibling,
          with a similar polymalformative syndrome antenatally diagnosed, but could not be confirmed molecularly.
        supports: SUPPORT
