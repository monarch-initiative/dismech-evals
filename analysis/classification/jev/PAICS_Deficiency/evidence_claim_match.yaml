              id: MONDO:0859003
              label: PAICS deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PAICS Bifunctional Enzyme Deficiency
        description: 'The recurrent p.(Lys53Arg) missense variant alters the structure of the catalytic
          site of the bifunctional AIRC/SAICARS enzyme. The deficit is graded and dose-dependent: about
          50% of control activity in heterozygous carrier fibroblasts, about 10% in patient fibroblasts,
          and about 25% for the purified recombinant mutant protein. So this is a severe hypomorph rather
          than a null, which may be why any patient survives at all.'
        biological_scale: MOLECULAR
        genetic_context:
          zygosity: HOMOZYGOUS
          variant_origin: GERMLINE
          allele_type: missense
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: 'A severe hypomorph rather than a null: roughly 10% residual catalytic activity
            in patient fibroblasts, about 25% for the purified recombinant p.(Lys53Arg) protein, and about
            50% in heterozygous carriers. The recurrent allele is homozygous in two unrelated families;
            a fourth patient is compound heterozygous for p.Ser35Phe and p.Cys281Ter.'
        molecular_functions:
        - preferred_term: phosphoribosylaminoimidazole carboxylase activity
          term:
            id: GO:0004638
            label: phosphoribosylaminoimidazole carboxylase activity
          modifier: DECREASED
        - preferred_term: phosphoribosylaminoimidazolesuccinocarboxamide synthase activity
          term:
            id: GO:0004639
            label: phosphoribosylaminoimidazolesuccinocarboxamide synthase activity
          modifier: DECREASED
      selected_evidence:
        snippet: The mutation reduced the catalytic activity of PAICS in heterozygous carrier and patient
          skin fibroblasts to approximately 50 and 10% of control levels, respectively.
        supports: SUPPORT
