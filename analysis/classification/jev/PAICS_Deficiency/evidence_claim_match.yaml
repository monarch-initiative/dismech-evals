  c9e435c250c175d55da62878829e318805f2a60993a9ba568d9a580b8a90fe81:
    claim:
      about:
        disease:
          name: PAICS Deficiency
          disease_term:
            preferred_term: PAICS deficiency
            term:
              id: MONDO:0859003
              label: PAICS deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: missing_toxic_metabolite
        kind: KNOWLEDGE_GAP
        prompt: If AIR and AIr do not accumulate detectably in patient cells, what actually mediates the
          tissue damage in PAICS deficiency?
        attaches_to:
        - pathophysiology#Impaired De Novo Purine Synthesis
        - pathophysiology#Disrupted Embryonic Organogenesis
        rationale: 'The substrate-accumulation model, which works for the sibling DNPS disorders, was
          tested here and failed: the predicted metabolites were sought in patient fibroblasts and not
          found, even though AIr is demonstrably cytotoxic to cell lines. That leaves purine insufficiency,
          purinosome-dependent channelling failure, or accumulation confined to a tissue or developmental
          window that fibroblasts do not sample. The absence also means there is no diagnostic metabolite
          and no substrate-reduction therapeutic target.

          A CRISPR-Cas9 PAICS-knockout HeLa line sharpens the question rather than settling it: there,
          intermediates immediately upstream of the deficient enzyme were the most strongly changed metabolites
          in the profile. So accumulation does happen in at least one human cell system. Whether the difference
          from patient fibroblasts is cell type, or complete knockout versus hypomorphic missense, is
          open.'
      selected_evidence:
        snippet: Statistical significance of PDNS intermediates preceding deficient enzymes was the highest
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35323684
      reference_title: Combined Targeted and Untargeted Profiling of HeLa Cells Deficient in Purine De
        Novo Synthesis.
      evidence_source: IN_VITRO
      explanation: Shows substrate accumulation behind the block in an engineered knockout, which is the
        counterpoint to its non-detection in patient fibroblasts. Indirect because the model is a cancer
        line with a complete knockout rather than the patient genotype.
