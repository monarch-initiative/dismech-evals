            name: Loss of PSTPIP1-PTP-PEST Binding
            description: PAPA-associated missense variants (p.A230T, p.E250Q) in the coiled-coil domain
              of PSTPIP1 severely reduce binding to the regulatory phosphatase PTP-PEST, releasing PSTPIP1
              from dephosphorylation so that mutant protein accumulates in a hyperphosphorylated state.
              This loss of phosphatase engagement is the initiating molecular lesion; the resulting gain
              of function (enhanced pyrin binding) is modeled as the downstream node.
