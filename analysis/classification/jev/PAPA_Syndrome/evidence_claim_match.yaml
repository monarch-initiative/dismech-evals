        context: []
      assertion_type: Genetic
      assertion:
        name: PSTPIP1
        association: Causative
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: PSTPIP1
          term:
            id: hgnc:9580
            label: PSTPIP1
        notes: Heterozygous missense variants in the coiled-coil domain of PSTPIP1 (also known as CD2BP1)
          cause PAPA syndrome. The two classic, functionally validated variants are p.A230T and p.E250Q;
          both severely reduce binding to PTP-PEST, leaving PSTPIP1 hyperphosphorylated with markedly
          increased avidity for pyrin. (Distinct PSTPIP1 variants such as p.E250K underlie the more severe
          PAMI phenotype and are outside the scope of this classic-PAPA entry.)
      selected_evidence:
        snippet: E250Q or A230T amino acid substitutions occur within a domain highly homologous to yeast
          cleavage furrow-associated protein CDC15.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
