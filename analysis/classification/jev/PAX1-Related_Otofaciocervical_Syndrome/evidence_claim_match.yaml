            about that family: the comparison table in PMID:37924468 records its immune status as no data,
            while the same paper''s discussion reports it as free of SCID with no history of immunodeficiency.
            Neither statement is a documented negative from immune testing; the documented negative is
            the c.1212dup family below.'
        - name: PAX1 c.1212dup (p.Gly405Argfs*51)
          description: Frameshift null allele, homozygous in a consanguineous family. Reported with facial
            dysmorphism, hearing loss, intellectual disability and delayed language but without immunodeficiency,
            which is the clearest evidence that immune severity is not predictable from allele class alone.
        notes: Biallelic PAX1 variants cause otofaciocervical syndrome type 2. Reported alleles include
          the hypofunctional paired-box missense p.G166V, nonsense alleles and frameshift insertions.
          PAX1 lies at 20p11.22 and encodes a 534-amino-acid paired-box transcription factor whose conserved
          128-residue paired domain carries the DNA-binding activity.
      selected_evidence:
        snippet: We identified rare biallelic PAX1 rare variants in all patients.
        supports: SUPPORT
