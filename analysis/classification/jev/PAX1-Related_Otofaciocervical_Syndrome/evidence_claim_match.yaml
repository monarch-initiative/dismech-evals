  b218ec8225fed0cf43e5b7a6e9242ba3689b6cfab5f28f03c3bc5661d65f499d:
    claim:
      about:
        disease:
          name: PAX1-Related Otofaciocervical Syndrome
          disease_term:
            preferred_term: otofaciocervical syndrome 2
            term:
              id: MONDO:0014254
              label: otofaciocervical syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of PAX1 Transcription Factor Function
        biological_scale: MOLECULAR
        description: 'Biallelic PAX1 variants abolish or reduce the DNA-binding and transcriptional activity
          of a paired-box transcription factor. Both mechanisms are documented: hypofunctional missense
          alleles in the conserved paired-box domain reduce transactivation of PAX1 target promoters,
          while frameshift and nonsense alleles remove the protein. PAX1 sits within the PAX-SIX-EYA-DACH
          network that also contains EYA1 and SIX1, which is why the PAX1 and EYA1 disorders share a branchial-arch
          phenotype despite differing in inheritance and in the thymic component.'
        genes:
        - preferred_term: PAX1
          term:
            id: hgnc:8615
            label: PAX1
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'Biallelic germline PAX1 alleles, typically homozygous in consanguineous families.
            Two classes are reported and they are not equivalent: the hypofunctional paired-box missense
            c.497G>T (p.G166V), which retains partial transactivation, and null alleles such as the frameshift
            c.1212dup (p.Gly405Argfs*51). A heterozygous PAX1 null allele causes a milder, dominantly
            inherited oculo-auriculo-vertebral phenotype rather than this syndrome.'
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: PAX1-mediated repression of canonical Wnt signaling
          term:
            id: GO:0090090
            label: negative regulation of canonical Wnt signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Taken together, our results show that the strategy of pooling DNA is a powerful, cost-effective
          application for WES in consanguineous families and establish PAX1 as a new disease-causing gene
          for OFCS and as part of the EYA-DACH-SIX-PAX network, important in early embryogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23851939
      reference_title: A hypofunctional PAX1 mutation causes autosomal recessively inherited otofaciocervical
        syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes PAX1 causality and places it in the PAX-SIX-EYA-DACH network shared with
        EYA1.
