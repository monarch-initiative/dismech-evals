        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Thymic T Cell Development
        biological_scale: CELLULAR
        description: 'Absent or severely reduced T cell output producing a syndromic severe combined immunodeficiency.
          The stromal locus of the defect is therapeutically decisive: allogeneic haematopoietic stem
          cell transplantation supplies progenitors but not the epithelial niche they require, so T cell
          reconstitution fails even after successful engraftment.'
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
        - preferred_term: T cell differentiation in thymus
          term:
            id: GO:0033077
            label: T cell differentiation in thymus
          modifier: DECREASED
        notes: 'Immunological severity is variable across reported families and is not predictable from
          genotype: a biallelic truncating PAX1 variant has been reported in a patient without immunodeficiency.
          Do not infer SCID from a PAX1 genotype alone.'
      selected_evidence:
        snippet: We investigated the molecular and cellular basis of severe combined immunodeficiency
          (SCID) in six patients with otofaciocervical syndrome type 2 who failed to attain T cell reconstitution
          after allogeneic hematopoietic stem cell transplantation, despite successful engraftment in
          three of them.
        supports: SUPPORT
