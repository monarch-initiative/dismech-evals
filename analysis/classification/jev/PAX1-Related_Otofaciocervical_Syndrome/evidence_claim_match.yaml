            name: Loss of PAX1 Transcription Factor Function
            biological_scale: MOLECULAR
            description: 'Biallelic PAX1 variants abolish or reduce the DNA-binding and transcriptional
              activity of a paired-box transcription factor. Both mechanisms are documented: hypofunctional
              missense alleles in the conserved paired-box domain reduce transactivation of PAX1 target
              promoters, while frameshift and nonsense alleles remove the protein. PAX1 sits within the
              PAX-SIX-EYA-DACH network that also contains EYA1 and SIX1, which is why the PAX1 and EYA1
              disorders share a branchial-arch phenotype despite differing in inheritance and in the thymic
              component.'
            genes:
            - preferred_term: PAX1
              term:
                id: hgnc:8615
                label: PAX1
            genetic_context:
              variant_origin: GERMLINE
              zygosity: HOMOZYGOUS
              functional_impact_category: LOSS_OF_FUNCTION
              description: 'Biallelic germline PAX1 alleles, typically homozygous in consanguineous families.
                Two classes are reported and they are not equivalent: the hypofunctional paired-box missense
                c.497G>T (p.G166V), which retains partial transactivation, and null alleles such as the
                frameshift c.1212dup (p.Gly405Argfs*51). A heterozygous PAX1 null allele causes a milder,
                dominantly inherited oculo-auriculo-vertebral phenotype rather than this syndrome.'
            molecular_functions:
            - preferred_term: DNA-binding transcription factor activity
              term:
