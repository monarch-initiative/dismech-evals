        description: PAX3 is required for the delamination and migration of hypaxial muscle progenitors
          from the dermomyotome into the limb bud. Severe (biallelic or dominant-negative) PAX3 loss impairs
          this process, producing the upper-limb muscle hypoplasia and contractures of Klein-Waardenburg
          syndrome (WS3). Murine Pax3 (Splotch) loss recapitulates this with limb muscle deficiency and
          dermomyotomal apoptosis.
        cell_types:
        - preferred_term: hypaxial dermomyotomal muscle precursor
          term:
            id: CL:0000680
            label: muscle precursor cell
        biological_processes:
        - preferred_term: skeletal muscle tissue development
          term:
            id: GO:0007519
            label: skeletal muscle tissue development
          modifier: DECREASED
      selected_evidence:
        snippet: Several loss-of-function mutations are correlated with the Splotch phenotype in mice
          and Waardenburg syndrome in humans. Malformations include a lack of muscle in the limb, a failure
          of neural tube closure and dysgenesis of numerous neural crest derivatives
        supports: SUPPORT
