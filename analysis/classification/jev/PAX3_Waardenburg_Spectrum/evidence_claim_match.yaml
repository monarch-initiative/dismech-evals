            both are folded into one Normal hearing band. Its Unilateral category (below 20.0 dB in the
            better ear, 35.0 dB or greater in the worse ear) needs both ears and is not representable
            as a band, which matters here since WS1 hearing loss is reported as unilateral in some affected
            individuals. Severity is set only where the grade name is mild, moderate or severe. GeneReviews
            (PMID:20301703) states WS1 hearing loss, present in approximately 60% of affected individuals,
            is "most commonly" bilateral and profound at >100 dB, which lands in this scheme's top, open-ended
