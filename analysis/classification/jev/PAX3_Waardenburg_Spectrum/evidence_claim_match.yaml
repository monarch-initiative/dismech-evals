        subtype_term:
          preferred_term: Waardenburg syndrome type 3
          term:
            id: MONDO:0007862
            label: Waardenburg syndrome type 3
        description: 'Severe form representing an extreme presentation of WS1 that additionally involves
          upper-limb musculoskeletal abnormalities (flexion contractures, muscle hypoplasia). Most often
          results from biallelic (homozygous or compound heterozygous) PAX3 loss, but heterozygous dominant-negative
          alleles and unlinked modifiers have also been implicated. Best understood as the high-dose end
          of a PAX3 dosage continuum rather than a mechanistically separate disorder.

          '
        genes:
        - preferred_term: PAX3
          term:
            id: hgnc:8617
            label: PAX3
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Klein-Waardenburg syndrome (WS-III) is a very rare condition and represents an extreme
          presentation of WS-I, additionally associated with musculoskeletal abnormalities
        supports: SUPPORT
