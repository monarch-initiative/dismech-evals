          male instead has a uniform, all-negative population. This node captures the single concept of
          the mosaic cell-population state that is necessary for disease.
        role: mediator
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: mosaic expression of Pcdh19 in heterozygous female mice leads to striking sorting between
          cells expressing wild-type (WT) PCDH19 and null PCDH19 in the developing cortex, correlating
          with altered network activity.
        supports: SUPPORT
