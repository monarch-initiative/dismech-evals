      assertion_type: Discussion
      assertion:
        discussion_id: gap_pcdh19_allopregnanolone_neurosteroid_hypothesis
        prompt: Does PCDH19-associated allopregnanolone (neurosteroid) deficiency causally contribute
          to seizures via reduced GABA-A inhibition, and does it predict response to neurosteroid therapy
          such as ganaxolone?
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        attaches_to:
        - pathophysiology#Neuronal Network Hyperexcitability
        rationale: Transcriptomic work in patient cells links PCDH19 dysfunction to reduced synthesis
          of allopregnanolone, a potent positive allosteric modulator of GABA-A receptors, suggesting
          a neurosteroid-deficiency arm that lowers inhibitory tone and could underlie the fever sensitivity.
          This motivated a ganaxolone trial, in which the seizure reduction versus placebo was larger
          but did not reach statistical significance. Whether allopregnanolone deficiency is causal (versus
          a bystander transcriptomic change) and whether a neurosteroid biomarker can select responders
          is the open question that determines the future of neurosteroid therapy in this disorder.
        proposed_experiments:
        - experiment_id: exp_pcdh19_neurosteroid_biomarker_response
          name: Allopregnanolone biomarker and neurosteroid-therapy response
          description: In a prospective PCDH19 cohort, relate baseline serum allopregnanolone to seizure
            burden and to response to neurosteroid therapy, testing whether the biomarker identifies a
            neurosteroid-responsive subgroup.
          experiment_type:
            preferred_term: biomarker-stratified treatment-response experiment
          readouts:
          - name: Seizure response by neurosteroid biomarker
            target: pathophysiology#Neuronal Network Hyperexcitability
            assays:
            - preferred_term: electroencephalography
            direction: NEGATIVE
          controls:
          - name: Biomarker-normal patients
            description: Patients without measurable allopregnanolone deficiency.
          decision_criterion: The hypothesis is supported if lower baseline allopregnanolone predicts
            greater seizure reduction with neurosteroid therapy.
          would_support:
          - pathophysiology#Neuronal Network Hyperexcitability
      selected_evidence:
        snippet: deficiency of neurosteroid allopregnanolone, one of the most potent GABA
        supports: SUPPORT
