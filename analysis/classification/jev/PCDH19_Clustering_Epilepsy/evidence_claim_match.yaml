      assertion:
        name: Cellular Interference and Impaired Homophilic Adhesion
        description: Protocadherin-19 mediates calcium-dependent homophilic cell-cell adhesion. In a mosaic
          brain, protocadherin-19-positive and protocadherin-19-negative neurons cannot engage in normal
          homophilic interactions at their shared boundaries, so the mismatch itself (cellular interference),
          rather than simple loss of the protein, disrupts neuronal communication. This explains why uniform
          loss in hemizygous males is tolerated. This node captures the single concept of the cellular-interference
          mechanism.
        role: mediator
        cell_types:
