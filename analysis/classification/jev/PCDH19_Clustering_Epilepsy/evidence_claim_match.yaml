    claim:
      about:
        disease:
          name: PCDH19 Clustering Epilepsy
          disease_term:
            preferred_term: PCDH19 clustering epilepsy
            term:
              id: MONDO:0010246
              label: developmental and epileptic encephalopathy, 9
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_pcdh19_cellular_interference_completeness
        prompt: Is cellular interference (pathological mis-sorting between protocadherin-19-positive and
          protocadherin-19-negative neurons in a mosaic brain) the complete explanation for PCDH19 clustering
          epilepsy, or do mosaicism-independent mechanisms such as altered neurogenesis and mitotic-spindle
          defects also contribute?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Cellular Interference and Impaired Homophilic Adhesion
        - pathophysiology#Disrupted Neuronal Network Assembly
        rationale: 'The cellular-interference model elegantly explains the female-limited, male-sparing
          inheritance: mosaic mice show abnormal cell sorting that is abolished by uniform deletion. But
          patient iPSC and organoid work points to additional, potentially mosaicism-independent phenotypes
          (precocious neurogenesis, mitotic-spindle and centrosome abnormalities), and some model data
          suggest phenotypes that do not require mosaicism. How much of the human disease is cellular
          interference versus a parallel cell-autonomous developmental defect is unresolved, and it shapes
          which mechanism a therapy should target.'
        proposed_experiments:
        - experiment_id: exp_pcdh19_interference_vs_cell_autonomous
          name: Dissecting cellular interference from cell-autonomous defects
          description: Compare mosaic and uniform PCDH19-null human cortical organoids and mouse cortex
            for network excitability and developmental phenotypes, to partition which deficits require
            mosaicism (interference) and which persist in a uniform-genotype (cell-autonomous) context.
          experiment_type:
            preferred_term: mosaic versus uniform comparison experiment
          readouts:
          - name: Interference-dependent versus cell-autonomous phenotypes
            target: pathophysiology#Disrupted Neuronal Network Assembly
            assays:
            - preferred_term: multielectrode array recording
            - preferred_term: immunostaining
            direction: POSITIVE
          controls:
          - name: Wild-type uniform organoids
            description: PCDH19-normal uniform organoids as the reference.
          decision_criterion: A phenotype is interference-dependent if it appears in mosaic but not uniform-null
            tissue; it is cell-autonomous if it persists in uniform-null tissue.
          would_support:
          - pathophysiology#Cellular Interference and Impaired Homophilic Adhesion
          datasets:
          - accession: geo:GSE229366
            title: PCDH19 regulation of neural progenitor cell differentiation suggests asynchrony of
              neurogenesis as a mechanism contributing to PCDH19 Girls Clustering Epilepsy
            description: 'Existing data that already runs part of this comparison, at the progenitor rather
              than the network level: neurospheres from Pcdh19 knockout, wild-type, and a mosaic mix of
              the two, arrayed at day 0 and day 4 of differentiation. It is the mouse, in vitro, transcriptomic
              precedent for the mosaic-versus-uniform contrast this experiment proposes to make in human
              organoids with electrophysiological readouts.'
            organism:
              preferred_term: house mouse
              term:
                id: NCBITaxon:10090
                label: Mus musculus
            data_type: MICROARRAY
            sample_count: 18
            publication: PMID:29763708
            notes: 'Same series as the entry-level datasets record; listed here because its three-genotype
              design directly prefigures this experiment''s decision criterion. That design is the load-bearing
              reason for the attachment, so it is sourced rather than asserted: GEO''s "Overall design"
              field states that the series compares "Pcdh19 knock out, wild type or a mosaic mix of cells",
              and GEO''s sample titles name a wild-type arm (GSM7159328-30), a Pcdh19-knockout arm (GSM7159331-33),
              and a "mosaic_wild_type-Pcdh19_knockout" arm (GSM7159334-36), each repeated after differentiation
              (GSM7159337-45). The contrast of mosaic against uniform-null tissue that this experiment''s
              decision criterion turns on is therefore already present in the series, at the progenitor
              level.'
      selected_evidence:
        snippet: Complete deletion of PCDH19 in heterozygous mice abolishes abnormal cell sorting and
          restores normal network activity.
        supports: SUPPORT
