        context: []
      assertion_type: Treatment
      assertion:
        name: Avoidance of PDE5 Inhibitors (Counseling Caution)
        therapeutic_modality: OTHER
        description: PDE5 inhibitors (sildenafil, vardenafil) have only 10- to 15-fold lower specificity
          for retinal PDE6 than for PDE5, owing to close structural and kinetic similarity between the
          two enzyme families. This cross-reactivity can cause transient visual disturbances in the general
          population, and regulatory agencies including the FDA specifically caution about the lack of
          controlled safety data for these drugs in patients with retinitis pigmentosa or a family history
          of the disease. Animal evidence suggests carriers of some recessive retinal-dystrophy alleles
          may be more sensitive to sildenafil toxicity, making this a relevant counseling point for PDE6A-RP
          patients and carriers.
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Important regulatory agencies such as the U.S. Food and Drug Administration (FDA, www.fda.gov,
          accessed on 20 December 2020) and the European Medicines Agency (EMA, www.ema.europa.eu, accessed
          on 20 December 2020), and associations of eye physicians and surgeons such as the American Academy
          of Ophthalmology (www.aao.org, accessed on 20 December 2020) warn about the lack of controlled
          clinical data on the safety of sildenafil in patients with retinitis pigmentosa or with a family
          history of the disease.
        supports: SUPPORT
