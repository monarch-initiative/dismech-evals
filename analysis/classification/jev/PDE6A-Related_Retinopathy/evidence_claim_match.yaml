          model both showed favorable structural and functional rescue. However, a subsequent non-randomised
          controlled Phase I/IIa human trial in adults with biallelic PDE6A variants did NOT improve visual
          function over 1 year and showed a safety signal (central retinal thinning and visual acuity
          decline in a subset of treated eyes), a notably more cautionary outcome than the preclinical
          data predicted.
