        conforms_to: phototransduction_cascade_dysfunction#Loss of Outer-Segment cGMP and Calcium Set-Point
          Control
        biological_scale: CELLULAR
        description: 'Excessive accumulation of cGMP in photoreceptors is a common downstream mechanism
          shared by many inherited retinal degeneration genes, including PDE6A. Elevated cGMP keeps cyclic-nucleotide-gated
          channels open, sustaining Na+/Ca2+ influx into the outer segment; protein kinase G is the other
          proposed extra-phototransduction target of excess cGMP in photoreceptor death, and this entry
          models the CNG-channel arm only. Plasma cGMP was about twice control levels in one PDE6A family,
          which the authors report as indicating a possible role for cGMP as a diagnostic measure, not
          as a measurement of retinal cGMP: it is a single pedigree (seven homozygous siblings), seven
          family members also carry an ABCA4 variant, and no cited source proposes a route by which photoreceptor
          cGMP would raise plasma levels. It is treated here as a candidate biomarker observation rather
          than human confirmation of the retinal mechanism.'
        cell_types:
