          term:
            id: CL:0000604
            label: retinal rod cell
      selected_evidence:
        snippet: Additionally, patients showed increased plasma levels of cGMP, indicating a possible
          role for cGMP measurements as part of the clinical tests for this and, after further investigations,
          maybe other forms of RP.
