      assertion_type: Pathophysiology
      assertion:
        name: PDE6C Catalytic Deficiency
        conforms_to: phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect
        description: Biallelic PDE6C variants abolish or reduce the catalytic activity of the cone-specific
          alpha-prime subunit of cGMP phosphodiesterase 6. PDE6 is the effector that hydrolyses cGMP to
          5'-GMP during the cone light response, so a catalytic-subunit lesion is the initiating, cone-autonomous
          defect in the phototransduction cascade.
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: PDE6C
          term:
            id: hgnc:8787
            label: PDE6C
        cell_types:
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        cellular_components:
        - preferred_term: photoreceptor outer segment
          term:
            id: GO:0001750
            label: photoreceptor outer segment
        molecular_functions:
        - preferred_term: 3',5'-cyclic-GMP phosphodiesterase activity
          term:
            id: GO:0047555
            label: 3',5'-cyclic-GMP phosphodiesterase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: phototransduction, visible light
          term:
            id: GO:0007603
            label: phototransduction, visible light
          modifier: DECREASED
      selected_evidence:
        snippet: The PDE6C gene encodes the cone alpha subunit of cyclic guanosine monophosphate (cGMP)
          phosphodiesterase, which converts cGMP to 5'-GMP, and thereby plays an essential role in cone
          phototransduction.
        supports: SUPPORT
