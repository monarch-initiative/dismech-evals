        context: []
      assertion_type: Genetic
      assertion:
        name: PDE6C
        gene_term:
          preferred_term: PDE6C
          term:
            id: hgnc:8787
            label: PDE6C
        relationship_type: CAUSATIVE
        features: Biallelic PDE6C variants reported to date include missense, nonsense, frameshift and
          splice-site changes; the gene-discovery cohort reported the homozygous missense alleles p.R29W
          and p.Y323N and a compound-heterozygous missense allele p.M455V. The mechanism of pathogenicity
          is loss of PDE6C catalytic function.
        case_fractions:
        - population: ACHM cohort (1074 independent families; Weisschuh et al., cited by Georgiou 2019)
          case_fraction_percent: 2.4
          notes: PDE6C is a low-prevalence achromatopsia genotype.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_73ed48ac-bdd6-4608-953d-773da6ade759-2023-11-02T160000.000Z
        variants:
        - name: p.R29W
          description: Homozygous missense allele reported in one of two sibling pairs (early-onset arCD
            and incomplete ACHM) in the gene-discovery study.
        - name: p.Y323N
          description: Homozygous missense allele reported in one of two sibling pairs (early-onset arCD
            and incomplete ACHM); recombinant p.Y323N retains only ~20% of wild-type PDE activity.
        - name: p.M455V
          description: Compound-heterozygous missense allele reported with a splice defect in a complete-achromatopsia
            patient.
      selected_evidence:
        snippet: Our findings identify PDE6C as a gene for cone photoreceptor disorders and show that
          arCD and ACHM constitute genetically and clinically overlapping phenotypes.
        supports: SUPPORT
