          into the graded hyperpolarisation that signals light. Cone-driven (photopic) light responses
          are reduced or abolished while rod-driven (scotopic) responses are preserved, the electrophysiological
          signature of a cone-autonomous cascade defect.
        role: central_effector
        biological_scale: CELLULAR
