  f41ba7b82367578a2f0280c5296bfc0566714f8d561d0c5e785d4867e1667f86:
    claim:
      about:
        disease:
          name: PET117-Related COX Deficiency
          disease_term:
            preferred_term: PET117-related COX deficiency (MC4DN19)
            term:
              id: MONDO:0033654
              label: mitochondrial complex IV deficiency, nuclear type 19
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PET117 Assembly-Factor Loss and Failed Complex IV Assembly
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'Biallelic loss-of-function variants in PET117 abolish functional Pet117, a small
          mitochondrial protein predicted to act as a Complex IV assembly factor. Without Pet117, cytochrome
          c oxidase fails to assemble correctly and the steady-state levels of individual Complex IV subunits
          fall, producing an isolated Complex IV biogenesis failure. Lentiviral complementation of patient
          fibroblasts with wild-type PET117 restores Complex IV, situating the lesion in the nuclear-encoded
          assembly arm of the COX biogenesis pathway.

          '
        genes:
        - preferred_term: PET117
          term:
            id: hgnc:40045
            label: PET117
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Whole exome sequencing revealed a homozygous nonsense mutation resulting in a premature
          stop codon in the gene encoding Pet117, a small protein that has previously been predicted to
          be a complex IV assembly factor
        supports: SUPPORT
