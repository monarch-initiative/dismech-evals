  0174734a509e5694cf49a59c389a401bfa1e98c1edaba43b6d36a599e34f61d9:
    claim:
      about:
        disease:
          name: PGM1-congenital disorder of glycosylation
          disease_term:
            preferred_term: PGM1-congenital disorder of glycosylation
            term:
              id: MONDO:0013968
              label: PGM1-congenital disorder of glycosylation
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: PGM1-deficient patient-derived iPSC-cardiomyocytes
        description: Induced pluripotent stem cell-derived cardiomyocytes reprogrammed from PGM1-deficient
          patient fibroblasts, characterized by multielectrode-array recording, untargeted (glyco)proteomics,
          tracer metabolomics, and mitochondrial respiration assays. This is the first human cardiomyocyte
          model of PGM1-CDG; the cardiac arm of the disease had previously been studied in cardiomyocyte-specific
          Pgm2 knockout mice and in PGM1-null skeletal-muscle cells, neither of which is a human cardiomyocyte.
        experimental_model_type: IPSC_DERIVED_MODEL
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        cell_source: Fibroblasts from PGM1-deficient patients, reprogrammed to iPSC
        culture_system: iPSC-derived cardiomyocyte monolayer on multielectrode arrays
        publication: PMID:41723528
        modeled_mechanisms:
        - target: Z-Disk Destabilization via Loss of PGM1-LDB3 Interaction
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The model is where the Z-disk lesion was discovered, so it recapitulates it by
            construction.
          limitations: iPSC-derived cardiomyocytes are immature relative to adult myocardium, with fetal-like
            sarcomere organization and a glycolytic rather than oxidative metabolic profile - both of
            which are the very properties this model is used to measure. The PGM1-LDB3 interaction rests
            on an AlphaFold3 prediction confirmed in vitro, not on structural data from cardiac tissue.
          readouts:
          - name: Z-disk component abundance, LDB3 included
            target: Z-Disk Destabilization via Loss of PGM1-LDB3 Interaction
            direction: DECREASED
            interpretation: Proteomic depletion of Z-disk proteins is the primary measurement behind this
              node.
          - name: Contractile function by multielectrode array
            target: Z-Disk Destabilization via Loss of PGM1-LDB3 Interaction
            direction: DECREASED
            interpretation: Reduced beating frequency and impaired contractility are the functional consequence
              of the sarcomeric lesion in this model.
        - target: Cardiomyocyte Energetic and Mitochondrial Failure
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Extends the mitochondrial arm from mouse heart and PGM1-null skeletal muscle cells
            into human cardiomyocytes.
          limitations: iPSC-cardiomyocyte metabolism is fetal-like and predominantly glycolytic, so a
            measured respiration deficit may understate or overstate what an adult myocardium would show.
            No galactose-rescue arm was reported in this model, so it does not itself test the treatment-resistance
            claim.
          readouts:
          - name: Mitochondrial respiration
            target: Cardiomyocyte Energetic and Mitochondrial Failure
            direction: DECREASED
            interpretation: Respirometry is the direct functional measurement of the energetic failure
              node.
      selected_evidence:
        snippet: Multielectrode array (MEA) recordings, untargeted (glyco)proteomics, and pathway analysis
          were performed to assess functional and molecular changes.
        supports: SUPPORT
