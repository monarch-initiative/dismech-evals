        description: 'This is the type II (Golgi) arm. PGM1 deficiency stalls the Leloir pathway and lowers
          the UDP-galactose available to Golgi galactosyltransferases, so N-glycans that are transferred
          to protein cannot be completed: they lack terminal galactose and, consequently, the sialic acid
          that caps it. The UDP-galactose to UDP-glucose ratio is reduced in patient cells, and the resulting
          glycans are truncated rather than absent. This is the arm that oral D-galactose therapy targets
          directly.'
        chemical_entities:
        - preferred_term: UDP-galactose
          modifier: DECREASED
