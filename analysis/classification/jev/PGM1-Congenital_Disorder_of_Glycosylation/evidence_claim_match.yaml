      assertion_type: Pathophysiology
      assertion:
        name: Biallelic PGM1 Loss of Function
        biological_scale: MOLECULAR
        role: trigger
        description: Biallelic pathogenic variants in PGM1 (1p31.3) abolish or severely reduce phosphoglucomutase-1
          activity. PGM1 supplies the large majority of phosphoglucomutase activity in most tissues, and
          residual activity in patient fibroblasts or leukocytes is severely reduced (the 2021 consensus
          guideline, PMID:32681750, reports a range from undetectable to 20% of controls). Most reported
          alleles are missense and act by loss of function, often through catalytic impairment or local
          structural destabilization of the enzyme.
        genes:
        - preferred_term: PGM1
          term:
            id: hgnc:8905
            label: PGM1
        molecular_functions:
        - preferred_term: phosphoglucomutase activity
          modifier: DECREASED
          term:
            id: GO:0004614
            label: phosphoglucomutase activity
      selected_evidence:
        snippet: Phosphoglucomutase 1 enzyme activity was markedly diminished in all patients.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
