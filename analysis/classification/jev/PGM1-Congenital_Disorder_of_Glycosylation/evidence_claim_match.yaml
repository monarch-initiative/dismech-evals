        name: Fasting Hypoglycemia and Hepatic Metabolic Stress
        biological_scale: ORGANISM
        description: Because hepatic glycogen cannot be released as glucose through the PGM1 step, fasting,
          intercurrent illness, or vomiting precipitate ketotic hypoglycemia, frequently the presenting
          problem in infancy. Conversely, after a glucose load, accumulating glucose-6-phosphate that
          cannot be stored as glycogen is diverted toward lactate and lipogenesis, contributing to transaminase
          elevation and hepatic steatosis. In young patients, hypoglycemia is primarily hyperinsulinemic,
          whereas starvation- or febrile-illness-associated ketotic hypoglycemia is also reported and
          becomes more relevant at other ages. Secondary ACTH/cortisol deficiency can further compound
          the hypoglycemia.
        cell_types:
        - preferred_term: Hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: glucose homeostasis
          modifier: ABNORMAL
          term:
            id: GO:0042593
            label: glucose homeostasis
      selected_evidence:
        snippet: After a dietary glucose load, large amounts of glucose-6-phosphate are generated, which
          cannot be converted into glycogen.
        supports: SUPPORT
