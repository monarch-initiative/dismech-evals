      reference_title: In Vitro Skeletal Muscle Model of PGM1 Deficiency Reveals Altered Energy Homeostasis.
      evidence_source: IN_VITRO
      explanation: 'Supports arm (a): a galactose-resistant energetic deficit exists in PGM1-deficient
        striated muscle cells.'
