  fec1cbaac13a6df78c79fb33a6b92579434b2df4d872e70f8214af7afbf264bf:
    claim:
      about:
        disease:
          name: PGM1-congenital disorder of glycosylation
          disease_term:
            preferred_term: PGM1-congenital disorder of glycosylation
            term:
              id: MONDO:0013968
              label: PGM1-congenital disorder of glycosylation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pgm1_aav_cardiac_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the AAV9-PGM1 rescue of dilated cardiomyopathy in the cardiomyocyte-specific Pgm2
          knockout mouse predict benefit in human PGM1-CDG cardiomyopathy?
        attaches_to:
        - pathophysiology#Cardiomyocyte Energetic and Mitochondrial Failure
        - pathophysiology#Cardiomyocyte Sarcolemmal Glycoprotein Hypoglycosylation
        - pathophysiology#Dilated Cardiomyopathy and Progressive Heart Failure
        rationale: The constitutive Pgm2 knockout is embryonic lethal before E9.5 and produces no live
          homozygotes, so the only tractable in vivo cardiac model is a tamoxifen-inducible cardiomyocyte-restricted
          knockout in an otherwise PGM1-sufficient animal. That model necessarily lacks the systemic hypoglycemia,
          hepatic, endocrine and craniofacial disease of human PGM1-CDG, and the acute post-natal onset
          of the lesion differs from the lifelong hypomorphic state of human patients, most of whom carry
          missense alleles with residual activity rather than a null. Whether the striking AAV9 rescue
          translates to human hearts that have remodeled over years is therefore an open translational
          question, not an established result.
        proposed_experiments:
        - experiment_id: exp_pgm1_cardiac_natural_history
          name: Genotype-stratified longitudinal cardiac natural history study
          description: Track cardiac structure and function longitudinally in genotype-stratified human
            PGM1-CDG cohorts to define the window before ventricular remodeling becomes irreversible,
            which determines whether a gene-replacement approach could plausibly benefit already-affected
            hearts.
        - experiment_id: exp_pgm1_hypomorphic_aav_trial
          name: AAV9-PGM1 in a hypomorphic knock-in mouse with established cardiomyopathy
          description: Test AAV9-PGM1 in a missense knock-in (hypomorphic) rather than null model, and
            after cardiomyopathy is already established rather than preemptively, to better match the
            human therapeutic setting.
      selected_evidence:
        snippet: In this study, we demonstrated that homozygosity for Pgm2-KO mutations leads to embryonic
          lethality in mice
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
