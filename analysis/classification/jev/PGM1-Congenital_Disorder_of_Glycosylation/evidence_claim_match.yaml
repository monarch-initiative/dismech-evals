      assertion_type: Discussion
      assertion:
        discussion_id: pgm1_neurodevelopmental_mechanism_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does PGM1 deficiency produce intellectual disability, motor delay and
          primary (non-hypoglycemic) seizures?
        attaches_to:
        - phenotypes#Intellectual Disability
        - phenotypes#Motor Delay
        - phenotypes#Seizure
        rationale: Neurologic involvement in PGM1-CDG was long assumed to be a sequela of hypoglycemic
          brain injury, but a systematic review found significant neurologic involvement in 17 of 41 reported
          patients, several of whom had no severe or recurrent hypoglycemia and one of whom had no reported
          hypoglycemic episodes at all. The consensus guideline likewise states that seizures can be primary
          and that the relationship between hypoglycemia and CNS involvement is unclear. Hypoglycemic
          seizures are therefore modeled as a causal edge, while the mechanism of the primary neurodevelopmental
          involvement is deliberately left unmodeled.
      selected_evidence:
        snippet: We suggest that neurological symptoms are frequent in PGM1-CDG and could present even
          in the absence of hypoglycemia.
        supports: SUPPORT
