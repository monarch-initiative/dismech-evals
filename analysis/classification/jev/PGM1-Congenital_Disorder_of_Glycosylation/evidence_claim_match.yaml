          than half of one well-characterized family and should be actively sought in any PGM1-deficient
          patient with hypoglycemia. The consensus guideline separately reports hypocortisolism with raised
          ACTH in most affected patients across the literature, so the site of the axis defect is not
          uniform and the general adrenal insufficiency term is deliberately retained over a secondary-specific
          one.
