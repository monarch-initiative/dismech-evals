      assertion:
        name: Skeletal Muscle Energy Failure
        biological_scale: CELLULAR
        description: Skeletal muscle cannot mobilize glycogen for rapid anaerobic ATP production, so exercise
          depends abnormally on fat oxidation and carbohydrate oxidation is blocked; forearm exercise
          produces no lactate rise but an exaggerated ammonia rise, and patients show the McArdle-like
          second wind. Beyond the glycogenolytic block, PGM1-null myoblasts and myotubes have reduced
          basal respiration and reduced mitochondrial ATP-production capacity that D-galactose does not
          correct, which is the leading explanation for why myopathy and rhabdomyolysis respond less completely
          to therapy than the glycosylation abnormalities do.
