          term:
            id: GO:0005794
            label: Golgi apparatus
      selected_evidence:
        snippet: The ratio of UDP-galactose to UDP-glucose was decreased, suggesting that UDP-galactose
          is limiting for N-glycan biosynthesis
        supports: SUPPORT
