  9ed0093eb46a98442e29f82ff5522f1ddb8ba647a277dd59d543a59cdf24230a:
    claim:
      about:
        disease:
          name: PGM1-congenital disorder of glycosylation
          disease_term:
            preferred_term: PGM1-congenital disorder of glycosylation
            term:
              id: MONDO:0013968
              label: PGM1-congenital disorder of glycosylation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Glucose-1-Phosphate and Glucose-6-Phosphate Interconversion
        biological_scale: MOLECULAR
        description: 'Phosphoglucomutase-1 reversibly interconverts glucose-1-phosphate and glucose-6-phosphate,
          the metabolic node that connects glycogen (via glucose-1-phosphate) to glycolysis and to the
          hexose-phosphate pool used for nucleotide-sugar synthesis. When this step is blocked, flux is
          disrupted in both directions: glucose-6-phosphate generated from a dietary glucose load cannot
          be routed into glycogen, and glucose-1-phosphate released from glycogen cannot enter glycolysis
          or gluconeogenic output.'
        chemical_entities:
        - preferred_term: glucose-1-phosphate
          modifier: ABNORMAL
          term:
            id: CHEBI:29042
            label: alpha-D-glucose 1-phosphate
        - preferred_term: glucose-6-phosphate
          modifier: ABNORMAL
          term:
            id: CHEBI:4170
            label: D-glucopyranose 6-phosphate
        biological_processes:
        - preferred_term: glucose metabolic process
          modifier: ABNORMAL
          term:
            id: GO:0006006
            label: glucose metabolic process
      selected_evidence:
        snippet: Phosphoglucomutase 1 (PGM1) is a key enzyme for the regulation of energy metabolism from
          glycogen and glycolysis, as it catalyzes the interconversion of glucose 1-phosphate and glucose
          6-phosphate.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37175952
      reference_title: In Vitro Skeletal Muscle Model of PGM1 Deficiency Reveals Altered Energy Homeostasis.
