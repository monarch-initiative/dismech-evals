              label: PGM1-congenital disorder of glycosylation
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: galactose_resistant_cardiomyopathy
        hypothesis_label: Cardiomyopathy is driven by energetic failure rather than by hypoglycosylation
          alone
        status: EMERGING
        description: 'D-galactose reliably corrects transferrin glycosylation, liver enzymes and coagulation
          factors, yet consistently fails to improve cardiac function. Two non-exclusive explanations
          are under active investigation: (a) the cardiomyopathy is driven principally by a mitochondrial/energetic
          defect that nucleotide-sugar repletion cannot address, paralleling the galactose-resistant respiratory
          deficit demonstrated in PGM1-null muscle cells; or (b) it is driven by hypoglycosylation of
          sarcolemmal and extracellular-matrix glycoproteins (laminin-211) in a compartment that oral
          galactose does not adequately reach or reverse once structural remodeling is established. A
          third arm (c) was added in 2026: PGM1 binds the Z-disk protein LDB3 (ZASP/Cypher), and patient-derived
          iPSC-cardiomyocytes lose Z-disk components together with mitochondrial proteins, implying a
          structural role for PGM1 that is independent of its enzymatic output altogether. Arm (c) is
          not a competitor to arm (a) so much as a candidate cause of it - the proposal is that Z-disk
          destabilization uncouples the sarcomere from mitochondrial metabolism. The distinction matters
          because it determines whether cardiac-directed therapy should target energetics, sarcomeric
          integrity, or PGM1 protein restoration (e.g. AAV9-PGM1 gene replacement); only the last addresses
          all three arms, and it is the only one of the three arms so far evidenced in human patient cardiomyocytes
          rather than mouse heart or skeletal-muscle surrogates.'
      selected_evidence:
        snippet: In conclusion, an in vitro mouse muscle cell model has been established to study the
          muscle-specific metabolic mechanisms in PGM1 deficiency, which suggested that galactose was
          unable to restore the reduced energy production capacity.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
