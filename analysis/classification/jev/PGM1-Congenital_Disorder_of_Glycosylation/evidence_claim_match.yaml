        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: McArdle disease
        description: Myophosphorylase (PYGM) deficiency produces an almost identical muscle physiology,
          including a flat lactate response to ischemic forearm exercise and the second-wind phenomenon,
          which was long considered pathognomonic for McArdle disease. PGM1-CDG is distinguished by the
          multisystem features (palatal malformation, hepatopathy, coagulopathy, cardiomyopathy) and the
          abnormal transferrin glycosylation.
      selected_evidence:
        snippet: The second wind phenomenon has been considered to be pathognomonic for McArdle disease,
          but we demonstrate that it can also be present in PGM1 deficiency.
        supports: SUPPORT
