        name: Mixed type I and type II serum transferrin isoform pattern
        presence: ABNORMAL
        context: The diagnostic biochemical signature. Intact-transferrin mass spectrometry (MALDI-TOF,
          ESI-MS/QTOF or LC-MS) shows both loss of complete N-glycans (the type I component) and truncated
          glycans lacking galactose and terminal sialic acid (the type II component). Transferrin isoelectric
          focusing, HPLC or capillary electrophoresis can screen for carbohydrate-deficient transferrin
          but resolve the mixed structural signature less well. Transferrin glycosylation normalizes substantially
          on D-galactose and is used as a treatment-response readout.
        biomarker_term:
          preferred_term: carbohydrate-deficient transferrin measurement
          term:
            id: NCIT:C101016
            label: Carbohydrate-Deficient Transferrin Measurement
      selected_evidence:
        snippet: Mass spectrometry revealed the presence of a variety of transferrin glycoforms, including
          forms lacking one or both glycans as well as forms with truncated glycans
