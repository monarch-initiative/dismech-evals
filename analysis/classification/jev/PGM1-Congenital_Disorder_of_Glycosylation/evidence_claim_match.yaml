      assertion:
        discussion_id: pgm1_hyperinsulinism_mechanism_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does PGM1 deficiency cause hyperinsulinemic hypoglycemia in young patients?
        attaches_to:
        - phenotypes#Hyperinsulinemic Hypoglycemia
        rationale: Hyperinsulinism is the primary mechanism of hypoglycemia in young PGM1-CDG patients,
          yet no mechanism linking loss of phosphoglucomutase-1 to inappropriate insulin secretion has
          been established, and the coexistence of ketotic, starvation-associated episodes at other ages
          argues against a single route. The hepatic glycogenolysis block modeled in this entry explains
          fasting hypoglycemia but does not account for inappropriate insulin secretion, so no causal
          edge is drawn to the hyperinsulinemic phenotype.
      selected_evidence:
        snippet: Ketotic hypoglycemic episodes secondary to starvation and/or febrile events have also
          been reported8,18 which suggests complexity underlying the origins of hypoglycemia at different
          ages.
        supports: SUPPORT
