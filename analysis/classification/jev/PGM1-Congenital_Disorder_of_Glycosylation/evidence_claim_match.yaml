        description: 'The two arms converge on the diagnostic hallmark of PGM1-CDG: a mixed glycosylation
          defect in which serum transferrin simultaneously shows loss of complete N-glycans (type I, reduced
          site occupancy) and truncated glycans lacking galactose and terminal sialic acid (type II, incomplete
          processing). Very few CDG produce both patterns in one patient, and this combined signature
          on intact-transferrin mass spectrometry is the single most useful biochemical clue to the diagnosis.
          Because glycosylation modifies a large fraction of secreted and membrane proteins, the lesion
          degrades many unrelated client glycoproteins at once.'
        cell_types:
