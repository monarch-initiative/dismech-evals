        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Glycogen Synthesis and Glycogenolysis
        biological_scale: CELLULAR
        description: Loss of the PGM1 step blocks both arms of glycogen handling. In liver, stored glycogen
          cannot be converted to glucose during fasting; in skeletal muscle, glycogen cannot be rapidly
          mobilized for anaerobic glycolysis during exertion. The muscle physiology closely mimics McArdle
          disease, including a flat lactate response to ischemic forearm exercise and a second-wind phenomenon.
        cell_types:
        - preferred_term: Hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        - preferred_term: Skeletal muscle cell
          term:
            id: CL:0000188
            label: cell of skeletal muscle
        biological_processes:
        - preferred_term: glycogen catabolic process
          modifier: DECREASED
          term:
            id: GO:0005980
            label: glycogen catabolic process
        - preferred_term: glycogen biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0005978
            label: glycogen biosynthetic process
        - preferred_term: glycolytic process
          modifier: DECREASED
          term:
            id: GO:0006096
            label: glycolytic process
        chemical_entities:
        - preferred_term: glycogen
          modifier: ABNORMAL
          term:
            id: CHEBI:28087
            label: glycogen
      selected_evidence:
        snippet: We show that severe loss of PGM1 activity causes blocked muscle glycogenolysis that mimics
          McArdle disease, but may also limit glycogen synthesis, which broadens the phenotypic spectrum
          of this disorder.
        supports: SUPPORT
    origin:
