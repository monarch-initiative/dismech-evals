        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pgm1_craniofacial_mechanism_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does PGM1 deficiency cause bifid uvula, cleft palate and Pierre Robin
          sequence, and why is this the only manifestation present at birth?
        attaches_to:
        - pathophysiology#Multisystem Glycoprotein Dysfunction
        - phenotypes#Bifid Uvula
        - phenotypes#Cleft Palate
        - phenotypes#Pierre Robin Sequence
        rationale: Midline palatal malformation is the earliest and one of the most consistent features
          of PGM1-CDG, and is the clinical clue that most often triggers diagnosis, yet no specific glycoprotein
          client or developmental pathway has been linked to it. Palatal shelf fusion depends on glycosylated
          extracellular matrix and adhesion molecules, but this remains an inference rather than a demonstrated
          mechanism in PGM1-CDG.
        proposed_experiments:
        - experiment_id: exp_pgm1_conditional_neural_crest_knockout
          name: Tissue-restricted Pgm2 knockout in cranial neural crest or palatal shelf mesenchyme
          description: Because the constitutive knockout is embryonic lethal before E9.5 and yields no
            live homozygotes, palatal development must be studied with a conditional allele restricted
            to cranial neural crest or palatal shelf mesenchyme, assessing shelf elevation and fusion
            together with matrix glycoprotein glycosylation.
        - experiment_id: exp_pgm1_palatal_glycoproteomics
          name: Glycoproteomic profiling of palatal tissue and craniofacial organoids
          description: Profile palatal shelf tissue or patient-derived craniofacial organoids to identify
            which adhesion and extracellular-matrix client glycoproteins are hypoglycosylated, in order
            to nominate a specific developmental mechanism.
      selected_evidence:
        snippet: We did not attempt to show experimentally the mechanisms that account for the clinical
          phenotypes of phosphoglucomutase 1 deficiency.
        supports: SUPPORT
    origin:
