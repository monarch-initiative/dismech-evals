            variant_origin: DE_NOVO
            gene_term:
              preferred_term: PHF21A
              term:
                id: hgnc:24156
                label: PHF21A
            notes: 'Heterozygous loss of function, overwhelmingly de novo. Reported variant classes are
              frameshift, nonsense, and a missense change in the AT-hook domain; six of seven in the defining
              cohort truncate a C-terminal intrinsically disordered region, which the authors take as
              evidence that the region is functionally important.

              Two distinct lesion types support the same conclusion and should not be conflated: balanced
              translocations that disrupt the gene without deleting neighbours, and intragenic point mutations.
              Both isolate PHF21A from the Potocki-Shaffer interval, which is why this entry can attribute
              the phenotype to one gene.

              Not curated: gnomAD loss-of-function constraint. The deep-research report gives pLI 1.00,
              LOEUF 0.221 and 11 observed against 82.5 expected LoF alleles, which would be independent
              population-scale support for haploinsufficiency. It is left out because no cited publication
              in this entry states those figures, so there is nothing to attach an exact-quote snippet
              to; importing them from a research report would be asserting a number from an uncitable
              source. A curator with access to a gnomAD release citation should add it.'
          role: ancestor
      assertion_type: Variant
      assertion:
        name: p.Arg580* recurrent variant
        type: Nonsense
        clinical_significance: PATHOGENIC
        description: 'A recurrent nonsense change carried by a quarter of reported patients, and by two
          of the seven in the defining cohort. It is the one place a genotype-phenotype correlation could
          have been tested in this disease, and the answer was negative: patients with the same variant
          differ phenotypically. That is recorded because it is informative - it argues against variant
          identity being the main driver of severity - and not because the correlation is still open.'
      selected_evidence:
        snippet: Genotype-phenotype relationships for IDDBCS were uncertain, as phenotypic variability
          was observed among patients with the same variant (p.Arg580*)
        supports: SUPPORT
