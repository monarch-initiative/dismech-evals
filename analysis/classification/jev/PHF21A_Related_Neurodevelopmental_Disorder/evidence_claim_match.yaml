        name: Neurodevelopmental and Craniofacial Consequences
        biological_scale: ORGANISM
        description: 'The clinical syndrome: intellectual disability with behavioural abnormalities and
          craniofacial dysmorphism, with seizures, hypotonia and autism in a substantial share of patients.

          Two groups of phenotypes hang off this node with a weaker claim than the neurological ones,
          and the node does not pretend otherwise. Postnatal overgrowth and the digital anomalies are
          established as features of the disorder and are attributable to PHF21A by the same translocation
          and point-mutation logic as the rest, but nothing cited connects either to the transcriptional
          mechanism upstream. Their edges assert that they are part of the syndrome, not that this pathograph
          explains them.'
      selected_evidence:
        snippet: Our results extend the phenotypic spectrum of PHF21A mutations by adding autism spectrum
          disorder, epilepsy, hypotonia, and neurobehavioral problems
        supports: SUPPORT
