  15616c09c16074892b0a0e78610ae305374441986442b36190b5b12eec6695fa:
    claim:
      about:
        disease:
          name: PHF21A Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: intellectual developmental disorder with behavioral abnormalities and craniofacial
              dysmorphism with or without seizures
            term:
              id: MONDO:0032883
              label: intellectual developmental disorder with behavioral abnormalities and craniofacial
                dysmorphism with or without seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: De-repression of LSD1-CoREST Target Genes
        biological_scale: CELLULAR
        description: 'Genes normally repressed by the LSD1 complex are expressed when BHC80 is reduced.
          In fetal brain, where PHF21A is highly expressed, that is the transcriptional insult the neurodevelopmental
          phenotype is attributed to.

          The claim is directional, so the annotation is: repression is reduced (GO:0000122, DECREASED)
          rather than transcription being unspecifically dysregulated.

          A named target exists and it is a neuronal one. In lymphoblastoid lines from two translocation
          patients, SCN3A is de-repressed and LSD1 occupancy at its promoter is reduced - the failure
          measured at the promoter of the gene, in cells from people who have the disease, rather than
          only in a knockdown. SCN3A is a neuronal sodium channel, which is the closest the cited evidence
          comes to connecting this node to the seizure phenotype; the entry stops at noting the identity
          of the gene rather than asserting the connection, because nothing cited measures SCN3A in patient
          neurons or relates its expression to seizures in these individuals.'
        biological_processes:
        - preferred_term: negative regulation of transcription by RNA polymerase II
          term:
            id: GO:0000122
            label: negative regulation of transcription by RNA polymerase II
          modifier: DECREASED
      selected_evidence:
        snippet: Knockdown of BHC80 by RNA inhibition results in the de-repression of LSD1 target genes
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
