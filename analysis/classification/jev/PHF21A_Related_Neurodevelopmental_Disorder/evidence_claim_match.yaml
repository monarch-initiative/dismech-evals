  de3417c8854fac3c7d4d1121c07c1268126c892b941c4ccc756a9390f0eb000c:
    claim:
      about:
        disease:
          name: PHF21A Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: intellectual developmental disorder with behavioral abnormalities and craniofacial
              dysmorphism with or without seizures
            term:
              id: MONDO:0032883
              label: intellectual developmental disorder with behavioral abnormalities and craniofacial
                dysmorphism with or without seizures
        context: []
      assertion_type: Genetic
      assertion:
        name: PHF21A
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        gene_term:
          preferred_term: PHF21A
          term:
            id: hgnc:24156
            label: PHF21A
        notes: 'Heterozygous loss of function, overwhelmingly de novo. Reported variant classes are frameshift,
          nonsense, and a missense change in the AT-hook domain; six of seven in the defining cohort truncate
          a C-terminal intrinsically disordered region, which the authors take as evidence that the region
          is functionally important.

          Two distinct lesion types support the same conclusion and should not be conflated: balanced
          translocations that disrupt the gene without deleting neighbours, and intragenic point mutations.
          Both isolate PHF21A from the Potocki-Shaffer interval, which is why this entry can attribute
          the phenotype to one gene.

          Not curated: gnomAD loss-of-function constraint. The deep-research report gives pLI 1.00, LOEUF
          0.221 and 11 observed against 82.5 expected LoF alleles, which would be independent population-scale
          support for haploinsufficiency. It is left out because no cited publication in this entry states
          those figures, so there is nothing to attach an exact-quote snippet to; importing them from
          a research report would be asserting a number from an uncitable source. A curator with access
          to a gnomAD release citation should add it.'
        variants:
        - name: Variant class distribution across the reported cohort
          type: Frameshift, nonsense and missense
          clinical_significance: PATHOGENIC
          description: 'Truncating variants dominate. Across twelve patients: frameshift 7, nonsense 4,
            missense 1. Every variant reported so far is de novo and heterozygous, which is the population-level
            form of the haploinsufficiency claim the whole entry rests on.'
        - name: p.Arg580* recurrent variant
          type: Nonsense
          clinical_significance: PATHOGENIC
          description: 'A recurrent nonsense change carried by a quarter of reported patients, and by
            two of the seven in the defining cohort. It is the one place a genotype-phenotype correlation
            could have been tested in this disease, and the answer was negative: patients with the same
            variant differ phenotypically. That is recorded because it is informative - it argues against
            variant identity being the main driver of severity - and not because the correlation is still
            open.'
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: We have identified seven heterozygous coding mutations, among which six are de novo
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31649809
      reference_title: Disruption of PHF21A causes syndromic intellectual disability with craniofacial
        anomalies, epilepsy, hypotonia, and neurobehavioral problems including autism.
      evidence_source: HUMAN_CLINICAL
      explanation: The cohort and its inheritance pattern.
