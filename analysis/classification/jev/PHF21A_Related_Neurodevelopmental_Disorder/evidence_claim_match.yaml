                dysmorphism with or without seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Reading of Unmethylated H3K4
        biological_scale: MOLECULAR
        description: 'BHC80''s PHD finger binds histone H3 only when lysine 4 is unmethylated, and methylation
          of H3K4 abolishes that binding. The protein is a reader of an absence, which is what makes its
          dosage sensitivity interesting: half as much reader means the unmodified state is recognised
          less reliably.

          This node is graded IN_VITRO throughout. The binding, the structure and the knockdown are all
          cell and crystal work; no cited source demonstrates any of it in patient cells.

          No cell type is annotated, deliberately. Both evidence items are HeLa and crystal work, so a
          neuron annotation here would assert a cell-type scope the evidence does not reach. The downstream
          node carries the neuronal claim, where the patient lymphoblastoid data and the fetal-brain expression
          give it a basis.'
      selected_evidence:
        snippet: the PHD finger of BHC80 binds unmethylated H3K4 (H3K4me0), and this interaction is specifically
          abrogated by methylation of H3K4
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
