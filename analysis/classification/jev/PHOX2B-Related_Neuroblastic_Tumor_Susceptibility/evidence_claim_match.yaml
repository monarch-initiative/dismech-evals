  e5fdd3cf4d19e50a8f7b8385433a6f2887e4bad67467af23507ec04a15e180a7:
    claim:
      about:
        disease:
          name: PHOX2B-Related Neuroblastic Tumor Susceptibility
          disease_term:
            preferred_term: neuroblastoma, susceptibility to, 2
            term:
              id: MONDO:0700041
              label: neuroblastoma, susceptibility to, 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Autonomic Neuroblast Differentiation
        description: 'The tumours arising in PHOX2B carriers are of the sympathetic nervous system lineage,
          and are predominantly differentiated: ganglioneuroma and ganglioneuroblastoma more often than
          neuroblastoma. That skew towards maturation is the clearest clue that what the variant disturbs
          is the differentiation programme of autonomic neuroblasts rather than proliferation alone. The
          entry does not claim more than that, because no cited source establishes the mechanism.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: migratory neural crest cell
          term:
            id: CL:0000333
            label: migratory neural crest cell
        biological_processes:
        - preferred_term: noradrenergic neuron differentiation
          modifier: ABNORMAL
          term:
            id: GO:0003357
            label: noradrenergic neuron differentiation
        notes: 'The process term is noradrenergic neuron differentiation rather than a fate-commitment
          term, because what the tumour spectrum suggests is disturbed differentiation and maturation
          rather than a fate decision, and PHOX2B governs the noradrenergic programme specifically. The
          cell type is bound at migratory neural crest cell, which is upstream of the sympathoadrenal
          progenitor these tumours arise from, because CL has no sympathoadrenal or sympathetic neuroblast
          term: searches of CL through the OLS4 API on 30 October 2026 for sympathoadrenal and for sympathetic
          neuroblast returned nothing, and CL:3000002 sympathetic noradrenergic neuron is a mature neuron
          rather than a progenitor. The functional work on PHOX2B mutants that would let this node rest
          on experimental evidence rather than on inference from tumour histology is the entry''s main
          outstanding gap.'
      selected_evidence:
        snippet: Four tumours were "poorly differentiated," and nine were differentiated, including five
          ganglioneuromas, three ganglioneuroblastomas, and one differentiating neuroblastoma, hence illustrating
          that PHOX2B NPARM are predominantly associated with differentiating tumors.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26375764
      reference_title: Oncologic Phenotype of Peripheral Neuroblastic Tumors Associated With PHOX2B Non-Polyalanine
