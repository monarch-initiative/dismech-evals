              id: MONDO:0700041
              label: neuroblastoma, susceptibility to, 2
        context: []
      assertion_type: Subtype
      assertion:
        name: PARM
        display_name: Polyalanine repeat mutation carriers
        description: In-frame expansions of the 20-alanine repeat tract, which account for most congenital
          central hypoventilation syndrome. Tumour risk is about 1 to 2 per cent and rises with the length
          of the expansion; essentially all reported tumours were in carriers of the largest expansions,
          30 to 33 repeats, and the tumours were typically maturing ganglioneuroblastomas and ganglioneuromas
          rather than neuroblastoma.
      selected_evidence:
        snippet: The majority of PHOX2B mutations in CCHS insert 5 to 13 alanines in the 20 polyalanine
          repeat domain, and larger polyalanine expansions are associated with worse hypoventilation and
          with NB or related tumors, including maturing ganglioneuroblastomas (GNB) and GNs.
        supports: SUPPORT
        directness: DIRECT
