              id: MONDO:0700041
              label: neuroblastoma, susceptibility to, 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Germline PHOX2B Variant
        description: 'A heterozygous germline variant in PHOX2B, the paired-like homeobox gene that is
          the master regulator of autonomic nervous system development. Two variant classes behave differently:
          polyalanine repeat expansions, and non-polyalanine repeat missense, frameshift or truncating
          variants. The difference in tumour risk between them is roughly thirty-fold, which is the central
          fact of this predisposition.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: PHOX2B
          term:
            id: hgnc:9143
            label: PHOX2B
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          modifier: ABNORMAL
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
        notes: The molecular function is marked ABNORMAL rather than LOSS_OF_FUNCTION because the two
          variant classes do not have the same effect, and the sources cited here characterise them by
          tumour risk and phenotype rather than by a measured change in transcriptional activity. Asserting
          loss of function for both would go beyond what is quoted.
      selected_evidence:
        snippet: PHOX2B, therefore, stands as the first gene for which germline mutations predispose to
          NB.
        supports: SUPPORT
        directness: DIRECT
    origin:
