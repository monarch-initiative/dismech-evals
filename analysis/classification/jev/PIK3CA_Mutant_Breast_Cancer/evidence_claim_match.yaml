      assertion_type: Pathophysiology
      assertion:
        name: Endocrine Resistance
        description: In ER+ breast cancer, PIK3CA mutations confer partial resistance to endocrine therapy
          through crosstalk between PI3K and ER signaling. PI3K pathway activation can maintain tumor
          growth despite estrogen deprivation.
        biological_processes:
        - preferred_term: intracellular estrogen receptor signaling pathway
          modifier: ABNORMAL
          term:
            id: GO:0030520
            label: estrogen receptor signaling pathway
        notes: Endocrine resistance in this entry arises from PIK3CA-driven PI3K-ER crosstalk, so the
          estrogen receptor is the pathway the mutant kinase acts on rather than the altered gene, and
          no receptor gene is bound on this node. That is the opposite arrangement from the ESR1 Mutation-Driven
          Endocrine Resistance node in ER_Positive_Breast_Cancer, where ligand-binding-domain mutations
          in ESR1 itself produce ligand-independent receptor activity and drive the resistance.
      selected_evidence:
        snippet: ESR1 and PIK3CA codon variants, together with alterations in specific oncogenic pathways,
          can differentially impact the biology and clinical phenotype of luminal-like MBC.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
