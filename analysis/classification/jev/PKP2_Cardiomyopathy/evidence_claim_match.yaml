      assertion:
        name: Wnt/Beta-Catenin Signaling Suppression
        description: Desmosomal disruption causes nuclear translocation of plakoglobin, which competitively
          inhibits beta-catenin-mediated canonical Wnt signaling through Tcf/Lef1 transcription factors.
          Suppression of Wnt signaling upregulates adipogenic and fibrogenic gene expression programs,
          driving the characteristic fibrofatty replacement of myocardium.
        biological_processes:
        - preferred_term: Wnt signaling pathway
          term:
            id: GO:0016055
            label: Wnt signaling pathway
          modifier: DECREASED
        - preferred_term: fat cell differentiation
          term:
            id: GO:0045444
            label: fat cell differentiation
          modifier: INCREASED
      selected_evidence:
        snippet: suppression of DP expression leads to nuclear localization of the desmosomal protein
          plakoglobin and a 2-fold reduction in canonical Wnt/beta-catenin signaling through Tcf/Lef1
          transcription factors. The ensuing phenotype is increased expression of adipogenic and fibrogenic
          genes and accumulation of fat droplets.
        supports: SUPPORT
