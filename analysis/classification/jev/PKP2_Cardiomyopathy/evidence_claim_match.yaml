          term:
            id: UBERON:0002080
            label: heart right ventricle
        - preferred_term: myocardium
          term:
            id: UBERON:0002349
            label: myocardium
      selected_evidence:
        snippet: Heterozygous DP-deficient mice exhibited excess adipocytes and fibrosis in the myocardium,
          increased myocyte apoptosis, cardiac dysfunction, and ventricular arrhythmias, thus recapitulating
          the phenotype of human ARVC.
        supports: SUPPORT
