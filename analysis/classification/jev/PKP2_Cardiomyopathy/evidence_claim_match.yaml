      assertion:
        name: Fibrofatty Replacement
        description: Progressive replacement of right ventricular myocardium with fibroadipocytic tissue
          is the pathological hallmark of PKP2-related ARVC. This results from cardiomyocyte death due
          to mechanical uncoupling, combined with Wnt-suppression-driven adipogenic differentiation of
          cardiac progenitor cells. The right ventricle is preferentially affected due to its thinner
          wall and greater mechanical stress.
        cell_types:
        - preferred_term: fibroblast of cardiac tissue
          term:
            id: CL:0002548
            label: fibroblast of cardiac tissue
        - preferred_term: adipocyte
          term:
            id: CL:0000136
            label: adipocyte
        locations:
