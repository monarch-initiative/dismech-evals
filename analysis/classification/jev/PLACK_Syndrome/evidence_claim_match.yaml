      assertion:
        name: Cardiomyocyte Calpain Overactivity
        description: 'Proposed mechanism for the dilated cardiomyopathy seen in several PLACK families:
          calpastatin loss raises calpain activity in cardiomyocytes, degrading cytoskeletal and sarcomeric
          proteins and causing cardiomyocyte loss and fibrosis. Transgenic mice with cardiomyocyte-restricted
          calpain-1 or calpain-2 overexpression develop dilated cardiomyopathy. No patient myocardium
          has been examined for calpain activity, and the explanted-heart histology reported so far (hypertrophied
          cardiomyocytes, bizarre nuclei, fibrosis) is nonspecific.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        molecular_functions:
