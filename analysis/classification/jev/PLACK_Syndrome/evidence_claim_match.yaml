        hypothesis_group_id: calpain_driven_cardiomyopathy
        hypothesis_label: Unopposed cardiomyocyte calpain activity causes the dilated cardiomyopathy of
          PLACK syndrome
        status: EMERGING
        description: Dilated cardiomyopathy segregates with biallelic CAST loss in several families, with
          no other cardiomyopathy gene found in the best-studied one. The proposed link is unopposed calpain
          proteolysis in cardiomyocytes, which is supported only by mouse calpain-overexpression models.
          It has not been tested in patient tissue or in a CAST-deficient animal, and penetrance appears
          incomplete and age-dependent.
      selected_evidence:
        snippet: Our findings expand the phenotypic spectrum of PLACK syndrome to include severe DCM and
          suggest CAST deficiency as a novel cause of recessively inherited cardiomyopathy.
        supports: SUPPORT
