          term:
            id: GO:0004198
            label: calcium-dependent cysteine-type endopeptidase activity
      selected_evidence:
        snippet: Excessive calpain activity may also lead to the degradation of key cytoskeletal proteins
          such as desmin and titin in myocardial fibers, leading to myocardial fibrosis and impaired contractility.
        supports: SUPPORT
        directness: INDIRECT
