  87f00e95e81c2f36f826a93b3e17df25c5b08a48088f14505f75b7b74e6bffcb:
    claim:
      about:
        disease:
          name: PLS3-Related X-Linked Osteoporosis
          disease_term:
            preferred_term: X-linked osteoporosis with fractures
            term:
              id: MONDO:0018315
              label: X-linked osteoporosis with fractures
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pls3_mouse_human_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Do the available Pls3 animal models reproduce human PLS3 osteoporosis well enough to support
          mechanistic inference, given that they are cortical-selective while the human disease is dominated
          by trabecular and vertebral collapse?
        attaches_to:
        - animal_models#Pls3-null mouse (cortical-restricted phenotype)
        - animal_models#PLS3 E10-16del rat
        - pathophysiology#Cortical and Trabecular Bone Deficit
        rationale: 'Deep-phenotyped Pls3-null mice show reduced cortical thickness at every age but no
          trabecular bone loss and no histomorphometric abnormality at 12 weeks; the patient-allele rat
          is likewise cortical and explicitly milder than the human disease. Patients, by contrast, present
          with severe vertebral compression from early childhood, and HR-pQCT finds the largest deviations
          in trabecular number and separation as well as cortical thickness. Two Pls3-null mouse studies
          also disagree with each other on osteoclasts. This is not a general caveat about mouse models:
          it means that the compartment where the human disease does its damage is the one the models
          do not reproduce, so any mechanism inferred from a mouse trabecular readout - including the
          osteoclast NFATc1 arm - is not anchored in the human phenotype.'
        proposed_experiments:
        - experiment_id: pls3_vertebral_phenotyping
          name: Vertebral and site-matched phenotyping of Pls3 models
          description: Phenotype the vertebral bodies, not only long bones, in the Pls3-null mouse and
            the PLS3 E10-16del rat, using micro-CT trabecular morphometry and dynamic histomorphometry
            at the same skeletal site sampled in human transiliac and vertebral studies, with sex as an
            explicit variable.
          decision_criterion: Model fidelity is supported if vertebral trabecular number and mineral apposition
            rate are reduced in the models, and the mismatch stands if vertebral bone is spared as long
            bone trabecular bone was.
          would_support:
          - pathophysiology#Cortical and Trabecular Bone Deficit
          would_refute:
          - pathophysiology#Dysregulated Osteoclast NFATc1 Signaling
          supporting_outcome:
          - Vertebral trabecular deficits appear in both models, making them usable for mechanistic inference
            about the human spinal disease.
          refuting_outcome:
          - Vertebral bone is spared in both models, confining them to cortical bone acquisition and leaving
            the dominant human lesion without an animal model.
      selected_evidence:
        snippet: Pls3-deficiency in mice only recapitulates the cortical bone phenotype of individuals
          with X-linked osteoporosis by negatively affecting the early stage of cortical bone acquisition
        supports: SUPPORT
    origin:
