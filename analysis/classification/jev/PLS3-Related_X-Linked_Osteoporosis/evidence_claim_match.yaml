        description: The structural end state, and one with a distinctive geometry. HR-pQCT in adults
          with PLS3 variants shows a large total bone area driven by an enlarged trabecular compartment
          with a small, thin cortex, low volumetric bone mineral density in both compartments, fewer and
          more widely separated trabeculae with normal trabecular thickness, and low failure load. Cortical
          porosity is normal, so the cortical deficit is one of thickness rather than of intracortical
          remodeling. Women deviate less from reference data than men.
        locations:
        - preferred_term: compact bone tissue
          term:
            id: UBERON:0001439
            label: compact bone tissue
        - preferred_term: trabecular bone tissue
          term:
            id: UBERON:0002483
