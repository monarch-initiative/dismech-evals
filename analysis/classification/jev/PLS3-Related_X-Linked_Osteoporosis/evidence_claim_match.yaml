  ddb8bf38c82a7cfb48e6e2b0217e3509123aaf15352d66bcbd926d04743fbee1:
    claim:
      about:
        disease:
          name: PLS3-Related X-Linked Osteoporosis
          disease_term:
            preferred_term: X-linked osteoporosis with fractures
            term:
              id: MONDO:0018315
              label: X-linked osteoporosis with fractures
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pls3_primary_cell_type
        kind: KNOWLEDGE_GAP
        prompt: Which bone cell type carries the primary lesion in PLS3-related osteoporosis - the osteoblast,
          the osteocyte, the osteoclast, or the endosteal vascular cell?
        attaches_to:
        - pathophysiology#PLS3 Loss of Actin-Bundling Function
        - pathophysiology#Impaired Osteoblast Mechanosensation
        - pathophysiology#Dysregulated Osteoclast NFATc1 Signaling
        - pathophysiology#Endosteal Vascular Niche Dysfunction
        rationale: PLS3 is expressed in osteoblasts, osteocytes and osteoclasts, and in bone endothelial
          and vascular smooth muscle cells, so expression cannot adjudicate. Each candidate arm has a
          study behind it and none has a conditional knockout. The four arms make different predictions
          - an osteoclast-primary mechanism predicts high turnover, which human biopsies contradict; an
          osteocyte-primary mechanism predicts altered sclerostin or DMP1, which the one human immunohistochemistry
          study did not find; the vascular arm predicts a bone vascular abnormality that has never been
          looked for in a patient. The resolving experiment is cell-type-conditional deletion, which has
          not been published for any lineage.
        proposed_experiments:
        - experiment_id: pls3_conditional_knockouts
          name: Lineage-restricted conditional Pls3 deletion series
          description: Generate osteoblast (Col1a1-Cre or Osx-Cre), osteocyte (Dmp1-Cre), osteoclast (Ctsk-Cre
            or LysM-Cre) and endothelial (Cdh5-CreERT2) conditional Pls3 knockouts on one background,
            phenotyped with the same undecalcified histology, dynamic histomorphometry, micro-CT and CD31
            bone vascular imaging.
          decision_criterion: An arm is supported if its conditional deletion reproduces reduced mineral
            apposition rate and cortical thinning at a magnitude comparable to the germline null, and
            refuted if that lineage's deletion is indistinguishable from wild-type.
          would_support:
          - pathophysiology#Impaired Osteoblast Mechanosensation
          - pathophysiology#Endosteal Vascular Niche Dysfunction
          would_refute:
          - pathophysiology#Dysregulated Osteoclast NFATc1 Signaling
          supporting_outcome:
          - Osteoblast- or osteocyte-restricted deletion reproduces the low mineral apposition rate and
            cortical deficit; endothelial deletion reproduces the small-vessel phenotype and a bone deficit.
          refuting_outcome:
          - Only osteoclast-restricted deletion produces a bone phenotype, and it is resorption-dominant,
            which would overturn the low-turnover model built from human biopsies.
      selected_evidence:
        snippet: the exact pathomechanisms of impaired PLS3 function in bone are still unknown
        supports: SUPPORT
