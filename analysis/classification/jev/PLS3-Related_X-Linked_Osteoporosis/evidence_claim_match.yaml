      assertion:
        name: PLS3 Loss of Actin-Bundling Function
        role: trigger
        biological_scale: MOLECULAR
        description: Loss-of-function variants in PLS3 remove or disable plastin 3, a calcium-regulated
          F-actin bundling protein expressed in osteoblasts, osteocytes and osteoclasts and, in bone,
          also in vascular endothelial and smooth muscle cells. Patient-derived missense alleles retain
          protein but have aberrant calcium-sensitive actin-bundling activity, so the shared molecular
          lesion across nonsense, frameshift, deletion and missense alleles is loss of F-actin crosslinking
          rather than loss of the transcript alone.
        genetic_context:
          gene:
            preferred_term: PLS3
            term:
              id: hgnc:9091
              label: PLS3
          variant_origin: GERMLINE
          zygosity: HEMIZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Hemizygous in affected males; heterozygous in females, where the phenotype is variable
            rather than absent.
        molecular_functions:
        - preferred_term: F-actin binding by plastin 3
          term:
            id: GO:0051015
            label: actin filament binding
          modifier: DECREASED
        biological_processes:
        - preferred_term: Actin filament bundling
          term:
            id: GO:0051017
            label: actin filament bundle assembly
          modifier: DECREASED
      selected_evidence:
