        biological_processes:
        - preferred_term: Bone remodeling
          term:
            id: GO:0046849
            label: bone remodeling
          modifier: DYSREGULATED
      selected_evidence:
        snippet: 'In men, total bone area was large (median Z-score: 1.33 radius; 1.46 tibia) due to a
          large trabecular area (+1.73 radius; +1.87 tibia), while the cortical area was small (-2.61
          radius; -2.84 tibia).'
        supports: SUPPORT
