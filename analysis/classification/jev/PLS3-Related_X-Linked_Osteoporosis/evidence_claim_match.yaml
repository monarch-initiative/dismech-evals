            publication: PMID:42432248
            description: Male hemizygous Pls3-null mice used in the endosteal single-cell mapping study
              to ask which cell type Pls3 acts through. The reported phenotype is vascular rather than
              osteoblast-intrinsic. The same model is curated in the osteoporosis_bone_resorption module
              against the generic module node; here it is linked to this disease's own vascular node.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Endosteal Vascular Niche Dysfunction
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Loss of the gene that causes this disease produces abnormal bone vasculature in mice,
          which is the entire observational basis of the vascular arm.
        limitations: No human study has examined bone vasculature in PLS3 variant carriers, so the translational
          step is untested; the authors state it as "might result from". Pls3 is expressed in osteoblast
          lineage cells as well as in the vasculature, so the model does not isolate the vascular contribution.
          Male hemizygous only, giving no information about heterozygous carriers.
        readouts:
        - name: Bone blood vessel size
          target: Endosteal Vascular Niche Dysfunction
          description: Anti-CD31 immunohistochemistry of mid-femur sections, confirmed by backscattered
            scanning electron microscopy and micro-CT.
          direction: DECREASED
          interpretation: Smaller bone blood vessels are the structural correlate of the vascular node.
      selected_evidence:
        snippet: These data suggest that X-linked osteoporosis might result from abnormalities in bone
          vasculature.
