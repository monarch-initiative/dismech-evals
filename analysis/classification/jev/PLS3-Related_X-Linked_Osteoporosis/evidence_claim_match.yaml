              label: X-linked osteoporosis with fractures
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pls3_bone_vasculature_in_humans
        kind: KNOWLEDGE_GAP
        prompt: Is bone vasculature abnormal in humans carrying PLS3 loss-of-function variants, as it
          is in Pls3-deficient mice?
        attaches_to:
        - pathophysiology#Endosteal Vascular Niche Dysfunction
        - mechanistic_hypotheses#endosteal_vascular_niche_model
        rationale: The entire vascular arm rests on mouse and zebrafish observations plus a computationally
          predicted endothelial-to-osteoblast interaction. Transiliac bone biopsy is already part of the
          diagnostic workup in this disease, so vascular assessment could be added to material that is
          being collected anyway rather than requiring a new invasive procedure. Until it is done, the
          arm stays EMERGING and no human-anchored causal claim can be made from it.
        proposed_experiments:
        - experiment_id: pls3_human_bone_vascular_imaging
          name: Bone vascular assessment in PLS3 variant carriers
          description: Assess vessel density and calibre by CD31 immunohistochemistry on archived and
            prospectively collected transiliac biopsies from PLS3 variant carriers against age- and sex-matched
            controls, with dynamic contrast-enhanced MRI of marrow perfusion as a non-invasive comparator.
          decision_criterion: The vascular arm is supported if vessel calibre or density is reduced relative
            to matched controls, and weakened if bone vasculature is indistinguishable while the mineralization
            defect is present in the same biopsy.
          would_support:
          - pathophysiology#Endosteal Vascular Niche Dysfunction
          would_refute:
          - mechanistic_hypotheses#endosteal_vascular_niche_model
          supporting_outcome:
          - Reduced bone vessel calibre or density in carriers, matching the murine finding.
          refuting_outcome:
          - Normal bone vasculature alongside the expected osteoid and mineralization abnormalities, confining
            the vascular phenotype to the mouse.
      selected_evidence:
        snippet: These data suggest that X-linked osteoporosis might result from abnormalities in bone
          vasculature.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
