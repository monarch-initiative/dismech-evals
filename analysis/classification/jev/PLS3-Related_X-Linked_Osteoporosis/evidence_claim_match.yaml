              label: X-linked osteoporosis with fractures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Osteoclast NFATc1 Signaling
        role: amplifier
        biological_scale: CELLULAR
        description: 'A competing, mouse-derived arm in which the primary lesion is in the osteoclast.
          PLS3 binds NFkB repressing factor (NKRF); in Pls3-null osteoclasts less NKRF reaches the nucleus,
          Nfatc1 - the master regulator of osteoclastogenesis - is de-repressed, and resorption is augmented.
          The reciprocal experiment supports the axis: PLS3-overexpressing mice show increased nuclear
          NKRF, suppressed osteoclast function and thicker, stronger cortical bone. This arm is deliberately
          not conformed to the module''s RANKL-Driven Osteoclastogenesis node, because human PLS3 bone
          biopsies show the opposite phenotype - reduced osteoclast number and low turnover.'
        cell_types:
        - preferred_term: Osteoclast
          term:
            id: CL:0000092
            label: osteoclast
        biological_processes:
        - preferred_term: Osteoclast differentiation
          term:
            id: GO:0030316
            label: osteoclast differentiation
          modifier: INCREASED
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: while Pls3 knockout mice exhibit osteoporosis, PLS3 overexpressing mice show thickening
          of cortical bone and increased bone strength
        supports: SUPPORT
