      assertion_type: Discussion
      assertion:
        discussion_id: pls3_antiresorptive_mechanism_mismatch
        kind: OPEN_QUESTION
        prompt: Why do antiresorptives raise bone mineral density in a disease whose tissue lesion is
          a formation and mineralization defect with low turnover, and do they reduce fractures?
        attaches_to:
        - treatments#Bisphosphonate Therapy
        - pathophysiology#Low-Turnover Bone Remodeling
        rationale: 'Bisphosphonates are first-line here and reliably raise densitometric measures, yet
          they suppress a resorption limb that histomorphometry shows is already low. Densitometric gain
          under an antiresorptive can reflect secondary mineralization of retained matrix rather than
          restored bone formation, which in a disease of defective mineralization is not obviously the
          same as improved strength. No study has reported fracture outcomes, and the one anabolic trial
          reported a cortical volumetric density loss at the radius. The question is practical, not academic:
          it determines whether antiresorptive or anabolic therapy should be first-line.'
      selected_evidence:
        snippet: Future studies are needed to evaluate whether observed changes translate to fracture
          resistance.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/1
