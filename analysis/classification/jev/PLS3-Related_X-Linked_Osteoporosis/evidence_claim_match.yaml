  64011346a55846f175c778937fa96460440adc941348a6553e9afe6062e1bea7:
    claim:
      about:
        disease:
          name: PLS3-Related X-Linked Osteoporosis
          disease_term:
            preferred_term: X-linked osteoporosis with fractures
            term:
              id: MONDO:0018315
              label: X-linked osteoporosis with fractures
        context: []
      assertion_type: Genetic
      assertion:
        name: PLS3 loss-of-function variants
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: PLS3 (plastin 3, T-plastin)
          term:
            id: hgnc:9091
            label: PLS3
        notes: PLS3 (Xq23) encodes plastin 3, a calcium-regulated F-actin bundling protein of the plastin/fimbrin
          family with two N-terminal EF-hand domains and two tandem actin-binding domains. Reported disease
          alleles span nonsense, frameshift, splice, missense and whole- or partial-gene deletions, and
          each reported family typically carries a private variant. Missense alleles cluster in the actin-binding
          domains and have been shown biochemically to disturb calcium-sensitive actin bundling. No consistent
          genotype-phenotype rule has been established, although frameshift/nonsense alleles trend toward
          more deviant microarchitecture than missense alleles.
      selected_evidence:
        snippet: Plastin 3 (PLS3), a protein involved in the formation of filamentous actin (F-actin)
          bundles, appears to be important in human bone health, on the basis of pathogenic variants in
          PLS3 in five families with X-linked osteoporosis and osteoporotic fractures that we report here.
        supports: SUPPORT
    origin:
