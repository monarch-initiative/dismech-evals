      assertion_type: Inheritance
      assertion:
        name: X-linked
        description: X-linked inheritance with a dose-dependent, non-strictly-recessive phenotype. Hemizygous
          males are consistently and more severely affected; heterozygous females range from normal bone
          mineral density through osteopenia to overt osteoporosis with fractures, so carrier status is
          not clinically silent. PLS3 is at Xq23.
        inheritance_term:
          preferred_term: X-linked inheritance
          term:
            id: HP:0001417
            label: X-linked inheritance
        expressivity: VARIABLE
      selected_evidence:
        snippet: Osteoporosis had its onset in childhood and was characterized by recurrent peripheral
          fractures, low bone mineral density (BMD), vertebral compression fractures, and significant
          height loss in adulthood. Males were in general more severely affected than females.
        supports: SUPPORT
    origin:
