            distinguishes this allele from R141H functionally, and what the enzyme-activator approach
            depends on.
      selected_evidence:
        snippet: Epalrestat increased PMM2 enzymatic activity in four PMM2-CDG patient fibroblast lines
          with genotypes R141H/F119L, R141H/E139K, R141H/N216I and R141H/F183S
        supports: SUPPORT
