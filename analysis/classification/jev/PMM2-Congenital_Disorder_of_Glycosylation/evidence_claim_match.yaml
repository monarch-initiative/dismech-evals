      assertion_type: Variant
      assertion:
        name: c.357C>A (p.Phe119Leu)
        clinical_significance: PATHOGENIC
        description: 'The partial-activity allele that most often sits opposite R141H. The source that
          makes that pairing claim ties it to Scandinavia, where F119L is most prevalent, so R141H/F119L
          is reported as the commonest genotype there rather than established as the commonest worldwide.
          Its interest is that it is the substrate the only enzyme-directed therapy needs: an activator
          can raise residual activity but cannot create it, so a genotype pairing a null with a hypomorph
          is precisely where such a drug has something to act on. R141H/F119L fibroblasts were one of
          the four lines in which epalrestat was shown to raise PMM2 activity.'
