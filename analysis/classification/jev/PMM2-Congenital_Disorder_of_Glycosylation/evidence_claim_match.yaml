              null such as R141H is never seen homozygous. Per-allele residual activity is what places
              a patient on the severity spectrum; the two alleles that carry most of that argument, R141H
              and F119L, are curated as structured variants above rather than named only in this paragraph.'
          role: ancestor
      assertion_type: Variant
      assertion:
        name: c.422G>A (p.Arg141His)
        clinical_significance: PATHOGENIC
        description: 'The commonest allele in the disease, carried by more than 60% of patients, and the
          one that defines its genetic architecture. R141H has never been reported homozygous in a living
          patient: it is a functional null, and two nulls appear not to be compatible with live birth.
          Every patient therefore carries something else on the other chromosome, and it is that second
          allele''s residual activity - not R141H - that sets where they fall on the severity spectrum.
          This is why the commonest genotype is a compound heterozygote rather than a homozygote, and
          why an allele-frequency-derived prevalence ceiling exceeds the diagnosed rate.'
        functional_effects:
        - function: phosphomannomutase activity
          type: loss-of-function
          description: Effectively complete loss in the homozygous state, inferred from its absence among
            living patients rather than from a direct assay quoted here. In trans with a hypomorph it
            still permits measurable residual activity, which is the basis of the enzyme-activator approach.
      selected_evidence:
        snippet: R141H, a human pathogenic variant carried by more than 60% of PMM2-CDG patients
