            gene_term:
              preferred_term: PMM2
              term:
                id: hgnc:9115
                label: PMM2
            relationship_type: CAUSATIVE
            notes: 'At least one hypomorphic allele is required: biallelic complete loss of activity is
              not compatible with survival, which is why missense alleles predominate and why a functional
              null such as R141H is never seen homozygous. Per-allele residual activity is what places
              a patient on the severity spectrum; the two alleles that carry most of that argument, R141H
              and F119L, are curated as structured variants above rather than named only in this paragraph.'
          role: ancestor
      assertion_type: Variant
      assertion:
        name: c.357C>A (p.Phe119Leu)
        clinical_significance: PATHOGENIC
        description: 'The partial-activity allele that most often sits opposite R141H. The source that
          makes that pairing claim ties it to Scandinavia, where F119L is most prevalent, so R141H/F119L
          is reported as the commonest genotype there rather than established as the commonest worldwide.
          Its interest is that it is the substrate the only enzyme-directed therapy needs: an activator
          can raise residual activity but cannot create it, so a genotype pairing a null with a hypomorph
          is precisely where such a drug has something to act on. R141H/F119L fibroblasts were one of
          the four lines in which epalrestat was shown to raise PMM2 activity.'
        functional_effects:
        - function: phosphomannomutase activity
          type: loss-of-function
          description: Partial rather than complete - a hypomorph. The activity that survives is what
            distinguishes this allele from R141H functionally, and what the enzyme-activator approach
            depends on.
      selected_evidence:
        snippet: the two most prevalent human pathogenic variants R141H (NM_000303.2:c.422G>A (p.Arg141His),
          ClinVar 7706) and F119L (NM_000303.2:c.357C>A (p.Phe119Leu), ClinVar 7711)
        supports: SUPPORT
