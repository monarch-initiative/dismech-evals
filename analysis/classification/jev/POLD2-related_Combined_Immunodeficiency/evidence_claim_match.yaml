      assertion_type: Genetic
      assertion:
        name: POLD2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: POLD2
          term:
            id: hgnc:9176
            label: POLD2
        notes: The causal gene, encoding the non-catalytic scaffold subunit of DNA polymerase delta. One
          homozygous missense allele (p.Asp293Asn) is published, and it destabilises the protein and its
          complex partners. The authors note that no POLD2 variant had previously been associated with
          human disease and that functionally validated somatic POLD2 variants are absent from COSMIC.
          POLD2 therefore lacks the dominant cancer-predisposition and MDPL allele classes that POLD1
          has. The causal assignment rests on one family plus functional rescue (wild-type POLD2 restored
          the complex and cleared the DNA lesions in patient fibroblasts). No ClinGen gene-disease validity
          classification was found, so gene_disease_validity is left unset.
      selected_evidence:
        snippet: Overexpression of POLD2 in P1 fibroblasts led to stabilization of the polymerase δ subunits
          POLD1 and POLD3 (Supplemental Figure 5B) and rescued the G1 53BP1 foci
        supports: SUPPORT
        directness: DIRECT
