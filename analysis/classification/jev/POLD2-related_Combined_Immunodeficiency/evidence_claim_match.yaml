          modifier: INCREASED
        - preferred_term: DNA damage response
          term:
            id: GO:0006974
            label: DNA damage response
          modifier: INCREASED
      selected_evidence:
        snippet: CHK1 phosphorylation on Ser345 could be strongly induced by the replication inhibitor
          hydroxyurea, but it was already apparent under basal conditions in P1 primary fibroblasts (Figure
          4A), indicating persistent replication stress and checkpoint activation in P1 cells at steady
          state.
        supports: SUPPORT
        directness: DIRECT
