              id: hgnc:9176
              label: POLD2
          allele_type: missense variant (p.Asp293Asn) in the phosphodiesterase domain
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          notes: 'PARTIAL_LOSS_OF_FUNCTION because the mutant protein is unstable and binds its partners
            poorly but is not catalytically dead: a complex assembled with it in vitro retained normal
            polymerase activity.'
      selected_evidence:
        snippet: The POLD2Asp293Asn mutation lies in the phosphodiesterase (PDE) domain (Figure 1E) and
          is absent from the ExAC and 1,000 Genomes Project public databases.
        supports: SUPPORT
        directness: DIRECT
