        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Syndromic Growth and Neurodevelopmental Features
        biological_scale: ORGANISM
        mechanism_confidence: HYPOTHETICAL
        description: The patient has short stature and severe intellectual disability with speech impairment,
          attention deficit and hyperactivity. The authors propose that the same replication-stress mechanism
          behind the immunodeficiency also explains the neurodevelopmental abnormalities, since polymerase
          delta is needed by every dividing progenitor. No non-haematopoietic tissue was examined, and
          with one patient from a consanguineous family a second recessive cause cannot be excluded. The
          link is therefore recorded as HYPOTHETICAL. The POLD1 patient of the same series has short stature,
          microcephaly and low IQ, so the developmental features recur across the polymerase delta deficiencies.
      selected_evidence:
        snippet: Our results suggest that loss of polymerase δ leads to replication stress–associated
          immunodeficiency and neurodevelopmental abnormalities in this syndrome.
        supports: SUPPORT
        directness: INDIRECT
    origin:
