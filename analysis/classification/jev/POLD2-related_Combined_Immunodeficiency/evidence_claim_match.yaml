      assertion_type: Discussion
      assertion:
        discussion_id: pold2_cid_single_patient_syndrome
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do the short stature and severe intellectual disability belong to POLD2 deficiency itself,
          or do they need another explanation, given that the entity rests on one patient from a consanguineous
          family?
        rationale: 'The immune half of the phenotype has functional support in the patient''s own cells:
          reduced complex, slowed S phase, replication lesions and poor T-cell proliferation, all reversed
          by wild-type POLD2 where rescue was tested. The developmental half has none. No neural or growth
          tissue was studied. A consanguineous family carries other homozygous regions, any of which could
          hold a second recessive cause. The argument for attribution is that the POLD1 patient of the
          same series also has short stature and intellectual impairment, and that the POLD3 deficiency
          carries neurodevelopmental delay. A second POLD2 family, or a hypomorphic Pold2 animal model,
          is what would settle it.'
        attaches_to:
        - pathophysiology#Syndromic Growth and Neurodevelopmental Features
        - phenotypes#Short Stature
        - phenotypes#Severe Intellectual Disability
      selected_evidence:
        snippet: Our results suggest that loss of polymerase δ leads to replication stress–associated
          immunodeficiency and neurodevelopmental abnormalities in this syndrome.
        supports: SUPPORT
        directness: INDIRECT
