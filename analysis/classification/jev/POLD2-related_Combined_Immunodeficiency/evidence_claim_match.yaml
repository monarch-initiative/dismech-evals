      assertion_type: Pathophysiology
      assertion:
        name: Combined Cellular and Humoral Immune Deficiency
        biological_scale: ORGANISM
        mechanism_confidence: PROVISIONAL
        description: 'The patient has low CD4+ T, B and NK cell counts, and his infections improved on
          immunoglobulin replacement, so both arms of adaptive immunity are affected. B-cell numbers are
          low but maturation looks largely intact, with class-switched B cells present and normal somatic
          hypermutation in IgA and IgG. The humoral deficit is therefore one of numbers, with likely loss
          of T-cell help, rather than a block in B-cell differentiation. The infection spectrum fits a
          combined defect: recurrent sinopulmonary bacterial infection with bronchiectasis, recurrent
          skin abscesses, and chronic molluscum contagiosum, a viral skin infection that needs T cells
          to clear it. PROVISIONAL because the step from lymphopenia to each infection is inferred from
          one patient, not measured.'
        cell_types:
        - preferred_term: lymphocyte
          term:
            id: CL:0000542
            label: lymphocyte
      selected_evidence:
        snippet: Here, we report on 2 patients with biallelic mutations affecting the POLD1 and POLD2
          subunits of polymerase δ, who presented with developmental defects and combined immunodeficiency
          (CID).
        supports: SUPPORT
        directness: DIRECT
