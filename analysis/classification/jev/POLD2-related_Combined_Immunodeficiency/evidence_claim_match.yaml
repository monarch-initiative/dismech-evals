            term:
              id: MONDO:1010175
              label: POLD2-related combined immunodeficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Destabilisation of the Polymerase Delta Complex
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'POLD2 is the structural hub of polymerase delta, contacting both POLD1 and POLD3.
          The p.Asp293Asn protein is turned over faster than wild type, and the patient''s stimulated
          lymphocytes and fibroblasts carry markedly reduced POLD1, POLD2 and POLD3 protein despite normal
          mRNA. The loss is in the amount of enzyme, not its quality: a complex assembled with the mutant
          subunit kept normal polymerase activity in a primer-extension assay. The cell therefore has
          less polymerase delta activity in total, which is what the decreased DNA-directed DNA polymerase
          activity below records. Re-expressing wild-type POLD2 in the patient''s fibroblasts restored
          POLD1 and POLD3 levels, which places the instability on the POLD2 variant.'
        genes:
        - preferred_term: POLD2
          term:
            id: hgnc:9176
            label: POLD2
        cellular_components:
        - preferred_term: DNA polymerase delta complex
          term:
            id: GO:0043625
            label: delta DNA polymerase complex
          modifier: DECREASED
        molecular_functions:
        - preferred_term: DNA-directed DNA polymerase activity (total cellular, through reduced complex
            amount)
          term:
            id: GO:0003887
            label: DNA-directed DNA polymerase activity
          modifier: DECREASED
      selected_evidence:
        snippet: We observed markedly reduced expression of all 3 subunits (Figure 1F), despite mRNA levels
          of the corresponding subunits that were comparable to those of healthy controls
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
