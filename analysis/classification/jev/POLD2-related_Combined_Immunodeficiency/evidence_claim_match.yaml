      assertion_type: Pathophysiology
      assertion:
        name: Replication Stress and Replication-Associated DNA Lesions
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: Under unchallenged conditions the patient's fibroblasts show ATR checkpoint activation
          (CHK1 Ser345 and RPA Ser33 phosphorylation), about three times as many gamma-H2AX foci as controls,
          more RAD51 foci, and more 53BP1 nuclear bodies in G1. The G1 bodies mark under-replicated DNA
          carried into the next cell cycle. Re-expressing wild-type POLD2 cleared the G1 53BP1 bodies,
          which establishes that the POLD2 variant causes them. This is replication-derived damage. When
          the fibroblasts were challenged with a panel of genotoxic agents they were not hypersensitive,
          so the repair functions of polymerase delta are preserved at the reduced dose.
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
