      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Hypomorphic POLD2 Variant
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'One genotype is published: homozygous missense p.Asp293Asn (NM_006230) in the POLD2
          phosphodiesterase domain, absent from ExAC and 1000 Genomes. Structural modelling on the POLD2-POLD3
          crystal structure predicts loss of a polar contact with Arg240. No null allele has been seen,
          and none is expected: POLD2 is essential in yeast and in mammalian cell screens, so a viable
          patient''s allele must be hypomorphic.'
        genes:
        - preferred_term: POLD2
          term:
            id: hgnc:9176
            label: POLD2
        genetic_context:
          genes:
          - preferred_term: POLD2
