      assertion_type: Genetic
      assertion:
        name: POT1
        gene_term:
          preferred_term: POT1
          term:
            id: hgnc:17284
            label: POT1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Heterozygous germline loss of function variants in POT1 cause POT1 tumor predisposition
          syndrome.
        notes: 'Reported alleles include missense (p.Arg117Cys, p.Tyr36Cys, p.Gln376Arg), nonsense, frameshift
          (p.Gln358SerfsTer13) and splice site (c.1164-1G>A) changes, distributed across the reading frame.
          They fall into two mechanistic classes: those that disrupt POT1 binding to the single stranded
          telomeric overhang, and those that disrupt the POT1 to ACD/TPP1 interface within shelterin.
          Germline variants in other shelterin components, ACD and TERF2IP, have been found in comparable
          families, so a POT1-negative pedigree of this shape is not necessarily shelterin-negative.'
      selected_evidence:
        snippet: The c.1164-1G>A splice-site, p.Gln358SerfsTer13 frameshift, and p.Gln376Arg missense
          mutations are likely to impact the interaction between POT1 and adrenocortical dysplasia homolog
          (ACD), which is a part of the telomere-capping shelterin complex.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
