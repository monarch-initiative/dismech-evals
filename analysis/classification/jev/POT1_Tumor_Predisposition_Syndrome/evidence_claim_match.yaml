  acf5bac5ab3fa8a3b6af80b88ccfb5a5034e9d9a155fe580d49796a551476764:
    claim:
      about:
        disease:
          name: POT1 Tumor Predisposition Syndrome
          disease_term:
            preferred_term: POT1 tumor predisposition
            term:
              id: MONDO:0014368
              label: tumor predisposition syndrome 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Unrestrained Telomerase Access and Telomere Elongation
        biological_scale: CELLULAR
        description: POT1 normally limits telomerase access to the 3' overhang. Losing that restraint
          lets telomerase extend the telomere, so POT1-TPD telomeres are abnormally long. This is the
          mechanistic inversion that separates this syndrome from the short telomere biology disorders.
        biological_processes:
        - preferred_term: negative regulation of telomere maintenance via telomerase
          term:
            id: GO:0032211
            label: negative regulation of telomere maintenance via telomerase
          modifier: DECREASED
      selected_evidence:
        snippet: Furthermore, hESC lines with caPOT1 mutations showed no detectable telomere damage response
          while showing consistent telomere elongation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33934394
      reference_title: Cancer-associated POT1 mutations lead to telomere elongation without induction
        of a DNA damage response.
      evidence_source: IN_VITRO
      explanation: Engineered human stem cell lines show consistent elongation, isolating elongation as
        a direct and reproducible consequence of the POT1 lesion.
