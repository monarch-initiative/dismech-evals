            name: Pot1a R117C knock-in mouse
            species: Mouse
            genotype: Pot1a p.R117C knock-in, heterozygous (Pot1a+/ki)
            publication: PMID:35727838
            description: 'The discovery allele from the human cardiac angiosarcoma families, knocked into
              the endogenous Pot1a locus in the heterozygous state that matches the human syndrome. It
              is the model that ties this entry''s three central claims together: telomere elongation,
              telomerase dependence of that elongation, and dominant-negative action of the allele.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Unrestrained Telomerase Access and Telomere Elongation
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Heterozygous knock-in fibroblasts and tissues carry longer telomeres than wild type,
          and the elongation disappears on a telomerase-null background, which is direct evidence that
          the mechanism runs through telomerase access rather than through some other route to long telomeres.
        limitations: Mice carry two paralogues, Pot1a and Pot1b, which split the functions of the single
          human POT1 protein, so the mapping from mouse Pot1a to human POT1 is not one to one and quantitative
          extrapolation is bounded.
        readouts:
        - name: Telomere length in MEFs and tissues
          target: Unrestrained Telomerase Access and Telomere Elongation
          direction: INCREASED
          interpretation: Elongation is the measured correlate of the lost shelterin brake.
        - name: Telomerase dependence of the elongation
          target: Unrestrained Telomerase Access and Telomere Elongation
          direction: ABOLISHED
          interpretation: Removing telomerase abolishes the elongation, establishing that the long telomeres
            are made by telomerase rather than by an alternative pathway. Note this readout is measured
            in Pot1a+/ki Tert-/- double mutant fibroblasts rather than in the Pot1a+/ki genotype this
            model entry declares; the comparison is the point of the experiment.
      selected_evidence:
        snippet: By using complementation assays we further show that POT1a pR117C exerts dominant-negative
          effects at telomeres.
        supports: SUPPORT
