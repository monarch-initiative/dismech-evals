          share: A140V accounts for approximately 0.6% of all reported MeCP2 variants, ranking 21st by
          frequency. The Orphanet prevalence class for ORPHA:3077 could not be cited because that record
          is not present in `references_cache/` and refreshing Orphadata currently fails on a MANIFEST
