          be fully symptomatic. Carrier mothers have a 50% risk of transmitting the allele to each child;
          sons who inherit it will be affected, daughters who inherit it may be mildly affected. Because
          the disorder is caused by one recurrent allele, targeted testing of at-risk relatives is straightforward
          once the proband is diagnosed. The reported pedigrees are multiplex three- and four-generation
          families, so the recurrence risk conversation is often not hypothetical.

          '
