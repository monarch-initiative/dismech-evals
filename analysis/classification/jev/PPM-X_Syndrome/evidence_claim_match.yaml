  4bbbe0283706b0bbf3eee793c51b1612d446e71627ea364a31a9fb0768e3b68f:
    claim:
      about:
        disease:
          name: PPM-X Syndrome
          disease_term:
            preferred_term: X-linked intellectual disability-psychosis-macroorchidism syndrome
            term:
              id: MONDO:0010235
              label: X-linked intellectual disability-psychosis-macroorchidism syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ppmx_mouse_model_translational_validity
        prompt: 'Does the Mecp2 A140V knock-in mouse model PPM-X syndrome, or does it model the mild end
          of Rett syndrome? Neither of the two features that define PPM-X clinically - psychosis and macroorchidism
          - has been demonstrated in it, and ATRX localisation, the proposed mechanism, has never been
          assayed in it.

          '
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Disrupted Neuronal Maturation and Dendritic Arborization
        - pathophysiology#Hippocampal Network Hyperexcitability and Impaired Synaptic Plasticity
        rationale: 'All cellular and circuit-level evidence in this entry comes from one mouse line, and
          that line is consistently framed by its own creators as a model of "Rett syndrome/X-linked mental
          retardation", with PPM-X mentioned only as one of the human phenotypes the allele can produce.
          The reported phenotypes - increased cell packing density, reduced dendritic complexity, reduced
          soma size, hippocampal hyperexcitability, aged-onset LTP deficits - are generic MeCP2-dysfunction
          readouts shared with null models, not PPM-X-specific ones. No published work has looked for
          a behavioural correlate of affective psychosis in the line, nor for a testicular phenotype,
          and its spastic-paraparesis status is not reported either. The mismatch is mechanistically meaningful
          rather than pedantic: the whole argument that PPM-X is separable from Rett rests on the ATRX-recruitment
          selectivity of the allele, which has been demonstrated only in vitro and in fibroblasts, and
          the mouse work does not test whether ATRX mislocalisation is what produces the phenotypes observed.
          Any claim in this entry sourced from the mouse is therefore marked MODEL_ORGANISM and is not
          used to support a human phenotype on its own.

          '
        proposed_experiments:
        - experiment_id: exp_ppmx_atrx_localisation_in_vivo
          name: ATRX subnuclear localisation in Mecp2 A140V knock-in brain
          description: Assay ATRX localisation to pericentric heterochromatin in neurons from Mecp2 A140V
            knock-in mouse brain by immunofluorescence and chromatin fractionation, versus wild-type littermates.
            This tests whether the in vitro and cultured-fibroblast recruitment defect that the entire
            mechanistic model rests on actually holds in vivo in the allele-matched animal.
          readouts:
          - name: Fraction of neurons with ATRX at heterochromatic foci
            target: pathophysiology#Selective Loss of ATRX Recruitment with Preserved Methyl-CpG Binding
            biological_processes:
            - preferred_term: heterochromatin organization
              term:
                id: GO:0070828
                label: heterochromatin organization
              modifier: ABNORMAL
            direction: NEGATIVE
        - experiment_id: exp_ppmx_mouse_neurobehavioural_battery
          name: Psychosis-relevant and motor phenotyping of the Mecp2 A140V line
          description: Run a neurobehavioural battery on the A140V line covering (a) psychosis-relevant
            endophenotypes - prepulse inhibition, amphetamine sensitivity, circadian activity cycling
            - which have never been reported for this model, and (b) corticospinal motor function - rotarod,
            gait analysis, hindlimb clasping, with corticospinal tract histology - to test whether the
            mouse reproduces the most robustly replicated human feature, progressive spastic paraparesis.
            Together these determine whether the line is a PPM-X model or only a generic mild MeCP2 model.
          readouts:
          - name: Prepulse inhibition and amphetamine-induced hyperlocomotion
            target: pathophysiology#Cognitive and Neuropsychiatric Dysfunction
            direction: NEGATIVE
          - name: Age-dependent gait and hindlimb motor decline
            target: pathophysiology#Progressive Corticospinal and Extrapyramidal Dysfunction
            phenotype_term:
              preferred_term: Spastic paraparesis
              term:
                id: HP:0002313
                label: Spastic paraparesis
            direction: POSITIVE
      selected_evidence:
        snippet: We have identified various neurological abnormalities in this mouse model of Rett syndrome/X-linked
          mental retardation which may help to elucidate the manner in which MECP2 mutations cause neuronal
          changes resulting in mental retardation without the confounding effects of seizures, chronic
          hypoventilation, or other Rett syndrome associated symptoms.
        supports: SUPPORT
        directness: INDIRECT
