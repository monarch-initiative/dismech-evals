  37cdb237be93ba92f5f873440aac8907d90eaf1d7342af681516b7aea167c7ae:
    claim:
      about:
        disease:
          name: PPM-X Syndrome
          disease_term:
            preferred_term: X-linked intellectual disability-psychosis-macroorchidism syndrome
            term:
              id: MONDO:0010235
              label: X-linked intellectual disability-psychosis-macroorchidism syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Neuronal Maturation and Dendritic Arborization
        biological_scale: CELLULAR
        description: 'Downstream of the chromatin lesion the affected cell type is the neuron, and the
          defect is one of maturation rather than survival. In the A140V knock-in mouse, cortical and
          hippocampal neurons are packed more densely and their dendritic trees are significantly less
          complex than wild type. Cultured hippocampal and cerebellar granule neurons from the same model
          have smaller somata, and this size deficit is cell-autonomous: in heterozygous females carrying
          a wild-type allele marked with eGFP, only the neurons expressing the mutant allele are small.
          The size phenotype tracks with down-regulation of mTOR signalling and is rescued in vitro by
          IGF-1.

          Note that all of the cellular evidence at this node is from the mouse knock-in or from cultures
          derived from it. No human neuropathology or patient-derived neuronal model of p.Ala140Val has
          been published, and the mouse is described by its makers as a Rett syndrome / XLMR model rather
          than a PPM-X model - see the HUMAN_MODEL_MISMATCH discussion.

          '
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: hippocampal pyramidal neuron
          term:
            id: CL:1001571
            label: hippocampal pyramidal neuron
        - preferred_term: cerebellar granule cell
          term:
            id: CL:0001031
            label: cerebellar granule cell
        biological_processes:
        - preferred_term: dendrite development
          term:
            id: GO:0016358
            label: dendrite development
          modifier: DECREASED
        - preferred_term: TOR signaling
          term:
            id: GO:0031929
            label: TOR signaling
          modifier: DECREASED
      selected_evidence:
        snippet: The abnormalities found include increases in cell packing density in the brain and a
          significant reduction in the complexity of neuronal dendritic branching.
        supports: SUPPORT
