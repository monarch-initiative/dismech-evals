  58538765c15690f2f4961c3542c2adb8712e6b77930bf9d9fae5b193ae389e3a:
    claim:
      about:
        disease:
          name: PPM-X Syndrome
          disease_term:
            preferred_term: X-linked intellectual disability-psychosis-macroorchidism syndrome
            term:
              id: MONDO:0010235
              label: X-linked intellectual disability-psychosis-macroorchidism syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ppmx_entity_boundary_vs_nonsyndromic_xlid
        prompt: 'Is PPM-X a distinct syndrome, or simply the most fully ascertained end of a single MECP2
          p.Ala140Val phenotype that is otherwise reported as nonsyndromic X-linked intellectual disability?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Cognitive and Neuropsychiatric Dysfunction
        rationale: 'The same allele has been reported under three different nosological labels: PPM-X
          (a named syndrome), MRX79 (nonsyndromic X-linked intellectual disability), and "X-linked intellectual
          disability with spasticity". MONDO has already folded MRX79 into MONDO:0010235 as a synonym,
          which implicitly settles the question by lumping - but the lumping was nomenclatural rather
          than the result of a systematic phenotypic reassessment.

          A caution on the MONDO synonym list, which is itself a same-gene blending trap: MONDO:0010235
          also carries "mental retardation, X-linked 16" (MRX16), but the MRX16 family does NOT carry
          A140V - Couvert and colleagues identified a different MECP2 allele, E137G, in that family (PMID:11309367).
          MRX16 was merged into this MONDO entity by nomenclature, not on allelic grounds, and it is deliberately
          excluded from the A140V pedigree counts and from the proposed experiments below. The defining
          psychiatric and testicular features come almost entirely from the single founding pedigree,
          while the motor phenotype replicates robustly across families. It is therefore unresolved whether
          psychosis and macroorchidism are allele-level features that were simply not looked for in the
          families ascertained as nonsyndromic, or genuine family-specific modifiers. This is a live curation
          question, because if the former is true the entity is well defined and underdiagnosed, and if
          the latter is true the honest entity is "MECP2 p.Ala140Val-related X-linked intellectual disability
          with spasticity" and PPM-X is a historically privileged pedigree.

          '
        proposed_experiments:
        - experiment_id: exp_ppmx_blinded_psychiatric_reassessment
          name: Protocolised psychiatric reassessment of A140V pedigrees ascertained as nonsyndromic
          description: Apply a structured diagnostic interview for affective and psychotic episodes, adapted
            for intellectual disability, to all adult carriers in the MRX79 family and in other A140V
            pedigrees originally ascertained as nonsyndromic, with raters blind to the historical syndrome
            label. If psychosis is found at rates comparable to the founding family, the entity is confirmed
            as underdiagnosed rather than pedigree-specific.
          readouts:
          - name: Lifetime prevalence of affective psychotic episodes
            target: pathophysiology#Cognitive and Neuropsychiatric Dysfunction
            phenotype_term:
              preferred_term: Psychosis
              term:
                id: HP:0000709
                label: Psychosis
            direction: POSITIVE
        - experiment_id: exp_ppmx_genotype_first_biobank_phenotyping
          name: Genotype-first ascertainment of MECP2 A140V carriers from sequencing biobanks
          description: Identify MECP2 c.419C>T carriers in large population and clinical sequencing biobanks
            and phenotype them prospectively, blind to the PPM-X literature. Genotype-first ascertainment
            removes the referral bias that produced the original syndrome definition and is the only design
            that can estimate the true penetrance of the psychiatric and testicular features.
          readouts:
          - name: Penetrance of psychosis, macroorchidism and spastic paraparesis in unselected carriers
            target: pathophysiology#Cognitive and Neuropsychiatric Dysfunction
            direction: POSITIVE
      selected_evidence:
        snippet: We mapped a new non-syndromic X-linked family (MRX79) to the chromosomal region Xq27.3-Xq28
          and identified an A140V mutation in the MEPC2 gene in all patients with the disease haplotype.
        supports: SUPPORT
