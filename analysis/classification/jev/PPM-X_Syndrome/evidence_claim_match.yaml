  0aa40b80354663f86d806c24c4eac212d1a00a9a37a98e4561b48b53b405959c:
    claim:
      about:
        disease:
          name: PPM-X Syndrome
          disease_term:
            preferred_term: X-linked intellectual disability-psychosis-macroorchidism syndrome
            term:
              id: MONDO:0010235
              label: X-linked intellectual disability-psychosis-macroorchidism syndrome
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mus musculus
        genotype: Mecp2 A140V knock-in (Jentarra et al. 2010 line)
        category: KNOCKIN
        genes:
        - preferred_term: MECP2
          term:
            id: hgnc:6990
            label: MECP2
        description: 'The only animal model of this disorder, and an allele-matched one - it carries the
          same A140V substitution found in patients rather than a null allele. This matters, because Mecp2-null
          mice model the severe end of the MECP2 spectrum while the A140V knock-in has a normal lifespan,
          normal weight gain, and none of the seizures, tremors, breathing difficulties or kyphosis that
          confound interpretation of the null models. It therefore isolates the cognitive and structural
          consequences of the allele.

          Three phenotypes have been characterised: increased cell packing density with reduced dendritic
          complexity; reduced neuronal soma size that is cell-autonomous, tracks with down-regulated mTOR
          signalling, and is rescued in vitro by IGF-1; and an age-dependent electrophysiological progression
          from hippocampal hyperexcitability in young mice to combined hyperexcitability plus short- and
          long-term potentiation deficits in aged mice.

          Translational caveat: the model''s authors describe it as a Rett syndrome/X-linked mental retardation
          model, and it has not been shown to reproduce the two features that define PPM-X clinically
          - psychosis and macroorchidism. See the HUMAN_MODEL_MISMATCH discussion.

          '
      selected_evidence:
        snippet: We report the construction and initial characterization of a mouse model expressing the
          A140V MeCP2 mutation.
        supports: SUPPORT
