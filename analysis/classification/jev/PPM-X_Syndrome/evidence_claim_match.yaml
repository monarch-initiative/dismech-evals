          term:
            id: MONDO:0010383
            label: fragile X syndrome
        description: 'The single most important differential for this entry, and the reason the curation
          of this disorder requires deliberate care. Intellectual disability plus macroorchidism in a
          male with an X-linked family history is the classic fragile X presentation, fragile X is orders
          of magnitude commoner, and any literature search on "X-linked intellectual disability" plus
          "macroorchidism" returns overwhelmingly fragile X material. The two are nevertheless unambiguously
          distinct: fragile X is caused by CGG repeat expansion and methylation silencing of FMR1 at Xq27.3,
          PPM-X by a point mutation in MECP2 at Xq28. The founding PPM-X paper anticipated the confusion
          and excluded fragile X formally before naming the syndrome, testing both for cytogenetic fragile
          sites and for repeat expansion at FRAXA, FRAXE and FRAXF. Clinically, PPM-X adds progressive
          spastic paraparesis, parkinsonism and affective psychosis, and lacks the characteristic fragile
          X facial gestalt of a long face with prominent ears. Fragile X testing is normal in PPM-X and
          must not be treated as excluding this diagnosis.

          '
      selected_evidence:
        snippet: Affected males do not show fragile sites at distal Xq on cytogenetic analysis, nor do
          they have expansions of the CGG repeats at the FRAXA, FRAXE, or FRAXF loci.
        supports: SUPPORT
