            label: X-linked inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
        description: 'The pattern is X-linked but is best described as semidominant rather than cleanly
          recessive or dominant, and the sources genuinely disagree on the label. Hemizygous males are
          consistently and more severely affected; carrier females are frequently not normal but mildly
          affected, with mild cognitive impairment and speech difficulties, and at least one heterozygous
          female has developed the full neuropsychiatric picture with regression, pyramidal signs and
          parkinsonism. Dotti and colleagues therefore described the index family as X-linked semidominant.
          OMIM/MedGen annotate MONDO:0010235 as X-linked dominant, while the MONDO synonym list also carries
          an X-linked recessive designation inherited from the MRXS13 nomenclature. The generic HP:0001417
          term is used here deliberately rather than forcing a choice between HP:0001419 and HP:0001423,
          with the semidominant reality described in prose. Expressivity is recorded as VARIABLE on the
          strength of the explicit intrafamilial variability reported in the Belgian family, and penetrance
          as INCOMPLETE because carrier females range from unaffected to fully symptomatic.

          '
      selected_evidence:
        snippet: The neurologic disorder associated with A140V MECP2 mutation is not necessarily lethal
          in men, but they are more severely affected than women of the same family.
