      assertion:
        name: MECP2 c.419C>T p.(Ala140Val)
        description: 'The single recurrent allele of this disorder. It substitutes valine for alanine
          at codon 140, in the alpha-1 helix of the methyl-CpG-binding domain, within a region where the
          MBD and the ATRX-interacting domain overlap. It is the defining separation-of-function allele
          of MeCP2: methylated-DNA binding and heterochromatic targeting are preserved, ATRX recruitment
          is lost. It has been reported in multiple unrelated multiplex X-linked pedigrees (the Newcastle
          PPM-X family, the Siena family, MRX79, and a Belgian four-generation family) as well as in sporadic
          males, and it accounts for approximately 0.6% of all reported MeCP2 variants. It is not a Rett
          syndrome allele.

          '
        gene:
          preferred_term: MECP2
          term:
