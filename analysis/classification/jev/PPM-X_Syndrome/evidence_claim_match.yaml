      reference: PMID:20163734
      reference_title: Abnormalities of cell packing density and dendritic complexity in the MeCP2 A140V
        mouse model of Rett syndrome/X-linked mental retardation.
      evidence_source: MODEL_ORGANISM
      explanation: 'Documents the mild, survivable character of the model, which parallels the survivable
        human male phenotype and is what makes it informative.

        '
