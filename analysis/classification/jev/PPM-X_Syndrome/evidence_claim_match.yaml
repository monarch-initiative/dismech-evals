  585cb374f9f8062d1b06215361012ce9aacdbd4ca9a3313e082504b186850f8e:
    claim:
      about:
        disease:
          name: PPM-X Syndrome
          disease_term:
            preferred_term: X-linked intellectual disability-psychosis-macroorchidism syndrome
            term:
              id: MONDO:0010235
              label: X-linked intellectual disability-psychosis-macroorchidism syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ppmx_macroorchidism_mechanism
        prompt: 'What causes macroorchidism in PPM-X syndrome, and is it actually a consistent feature
          of the MECP2 p.Ala140Val phenotype?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#MECP2 p.Ala140Val Methyl-CpG-Binding Domain Variant
        - phenotypes#Macroorchidism
        rationale: 'Macroorchidism is one of the four letters of the syndrome acronym, but it is the weakest-evidenced
          component of the entity. It appears in the 1996 founding description and is retained in the
          GeneReviews characterisation, yet none of the four subsequently reported A140V families - Siena,
          MRX79, the Belgian four-generation family, or the sporadic cases - reports testicular volumes
          or counts affected males with macroorchidism, and the allele-matched mouse model has not been
          examined for a testicular phenotype. No mechanism has been proposed linking loss of MeCP2-ATRX
          recruitment to testicular enlargement. Because macroorchidism is simultaneously the feature
          that names the syndrome and the feature that drives confusion with fragile X, the gap matters
          for both entity definition and differential diagnosis. It is the reason no frequency band is
          asserted for this phenotype.

          '
        proposed_experiments:
        - experiment_id: exp_ppmx_orchidometry_pedigree_survey
          name: Systematic testicular volume survey across MECP2 A140V pedigrees
          description: Measure testicular volume by orchidometry or ultrasound in all postpubertal males
            from the known MECP2 p.Ala140Val pedigrees (Newcastle PPM-X, Siena, MRX79, Belgian four-generation
            family) and in reported sporadic carriers, reporting against age- and ancestry-matched normative
            data. This converts the qualitative founding observation into a countable phenotype with a
            denominator, which is what a frequency band would require.
          readouts:
          - name: Testicular volume relative to age-matched norms
            target: pathophysiology#MECP2 p.Ala140Val Methyl-CpG-Binding Domain Variant
            phenotype_term:
              preferred_term: Macroorchidism
              term:
                id: HP:0000053
                label: Macroorchidism
            assays:
            - preferred_term: orchidometry
            - preferred_term: scrotal ultrasonography
            direction: POSITIVE
        - experiment_id: exp_ppmx_mouse_testicular_phenotype
          name: Testicular phenotyping of the Mecp2 A140V knock-in mouse
          description: Compare testis weight, seminiferous tubule histology and Sertoli-cell counts in
            adult male Mecp2 A140V knock-in mice against wild-type littermates. The line has a normal
            lifespan, so adult reproductive phenotyping is feasible; no testicular readout has been reported
            for it.
          readouts:
          - name: Testis weight and seminiferous tubule histology
            target: pathophysiology#MECP2 p.Ala140Val Methyl-CpG-Binding Domain Variant
            phenotype_term:
              preferred_term: Macroorchidism
              term:
                id: HP:0000053
                label: Macroorchidism
            assays:
            - preferred_term: histopathology
            direction: POSITIVE
      selected_evidence:
        snippet: The phenotype also includes pyramidal signs, Parkinsonian features, and macroorchidism,
          but there are no characteristic dysmorphic facial features.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
