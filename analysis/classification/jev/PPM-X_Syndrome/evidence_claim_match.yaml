      assertion_type: Pathophysiology
      assertion:
        name: MECP2 p.Ala140Val Methyl-CpG-Binding Domain Variant
        biological_scale: MOLECULAR
        description: 'The lesion is a single recurrent missense allele, c.419C>T p.(Ala140Val), in the
          MECP2 gene at Xq28. Unlike most Mendelian entries this disorder has effectively an allele series
          of one: every reported PPM-X or A140V family carries the same substitution, which sits in the
          alpha-1 helix of the methyl-CpG-binding domain. It is a genuine recurrent mutation rather than
          a rare polymorphism - it segregates with the disease haplotype in multiple unrelated multiplex
          pedigrees and is enriched in male intellectual-disability cohorts - and it accounts for roughly
          0.6% of all reported MeCP2 variants. Hemizygous males are affected; heterozygous females are
          normal or mildly affected.

          '
        gene:
          preferred_term: MECP2
          term:
            id: hgnc:6990
            label: MECP2
      selected_evidence:
        snippet: We report here the genetic cause of the X-linked syndrome of psychosis, pyramidal signs,
          and macro-orchidism (PPM-X) in a three-generation family manifesting the disorder as a mutation
          in the methyl-CpG binding-protein 2 (MECP2) gene in Xq28.
        supports: SUPPORT
