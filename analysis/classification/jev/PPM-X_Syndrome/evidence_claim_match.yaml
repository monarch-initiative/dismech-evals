        disease_term:
          preferred_term: severe neonatal-onset encephalopathy with microcephaly
          term:
            id: MONDO:0010397
            label: severe neonatal-onset encephalopathy with microcephaly
        description: 'The other male MECP2 phenotype, and the one that makes PPM-X surprising. Most hemizygous
          males with a Rett-causing MECP2 variant develop a relentless neonatal-onset encephalopathy with
          abnormal tone, involuntary movements, severe seizures and breathing abnormalities, and die before
          age two. PPM-X males survive into adulthood with moderate intellectual disability. The distinction
          is allelic: it is the specific separation-of-function character of p.Ala140Val, which spares
          methyl-CpG binding, that permits survival. A male with a MECP2 variant and a survivable, slowly
          progressive phenotype should prompt attention to which variant it is.

          '
      selected_evidence:
        snippet: Severe neonatal-onset encephalopathy, the most common phenotype in affected males, is
          characterized by a relentless clinical course that follows a metabolic-degenerative type of
          pattern, abnormal tone, involuntary movements, severe seizures, and breathing abnormalities.
