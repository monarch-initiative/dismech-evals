  637229c592db46909f8d0c3cd909e56594eb6e42efcd5ca2143964de28f0b967:
    claim:
      about:
        disease:
          name: PPM-X Syndrome
          disease_term:
            preferred_term: X-linked intellectual disability-psychosis-macroorchidism syndrome
            term:
              id: MONDO:0010235
              label: X-linked intellectual disability-psychosis-macroorchidism syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Progressive Corticospinal and Extrapyramidal Dysfunction
        biological_scale: ORGANISM
        description: 'The motor arm of the syndrome and the "PP" of the acronym. All six symptomatic relatives
          in the Siena A140V family - four men AND two women - had slowly progressive spastic paraparesis/pyramidal
          signs together with distal atrophy of the legs, with ataxia and postural hand tremor in a subset
          and dysarthria in the oldest affected brothers. That the two heterozygous women were also affected
          motorically is important: the motor syndrome is not male-restricted, only male-predominant in
          severity. The independently ascertained Belgian four-generation family reproduced the same picture
          - slowly progressive spastic paraparesis with dystonic hand movements - which is the strongest
          available evidence that the motor syndrome is an allele property and not a single-family peculiarity.
          Parkinsonian features were part of the founding description and remain in the syndrome definition,
          though they are less consistently reported in the later families than the pyramidal findings.

          '
        biological_processes:
        - preferred_term: neuromuscular process controlling posture
          term:
            id: GO:0050884
            label: neuromuscular process controlling posture
          modifier: ABNORMAL
      selected_evidence:
        snippet: Males have moderate intellectual disability, impaired language development, friendly
          behavior, slowly progressive spastic paraparesis and dystonic movements of the hands.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/1
      context_paths:
