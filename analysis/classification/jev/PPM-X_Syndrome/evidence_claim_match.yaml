          syndrome is caused by mutation of ATRX itself - the very protein that MeCP2 p.Ala140Val fails
          to recruit - so the two disorders are predicted to converge on a shared chromatin defect approached
          from opposite sides of one interaction. They share intellectual disability, microcephaly, spasticity
          and mild dysmorphism. They are separated by the features unique to ATR-X: alpha-thalassemia,
          genital and urogenital anomalies, and growth deficiency, none of which are part of PPM-X. The
          overlap is the empirical basis of the ATRX-mislocalisation hypothesis recorded in `mechanistic_hypotheses`,
          and the non-overlap is why that hypothesis is at best a partial phenocopy model.

          '
      selected_evidence:
        snippet: We report that MeCP2 interacts with ATRX, a SWI2/SNF2 DNA helicase/ATPase that is mutated
          in ATRX syndrome (alpha-thalassemia/mental retardation, X-linked).
        supports: SUPPORT
