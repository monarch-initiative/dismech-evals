          is age-dependent. Young A140V mice already show intrinsic hyperexcitability of CA1 pyramidal
          neurons - depolarised resting membrane potential, higher firing rates, broader action potentials,
          smaller afterhyperpolarisation - together with a synaptic signature pointing the same way: fewer
          spontaneous inhibitory postsynaptic currents and a higher probability of evoked glutamate release.
          Long-term potentiation at CA3-CA1 synapses is intact at this stage. Only in aged mice does plasticity
          fail, with deficits in both short-term and long-term potentiation appearing on top of the persisting
          hyperexcitability.

