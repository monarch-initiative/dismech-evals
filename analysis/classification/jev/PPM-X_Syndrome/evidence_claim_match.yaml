            term:
              id: MONDO:0010235
              label: X-linked intellectual disability-psychosis-macroorchidism syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: MECP2 Sequencing
        description: 'There is no clinical gestalt for this disorder - there are no characteristic dysmorphic
          facial features - so the diagnosis is molecular. Targeted MECP2 sequencing, an X-linked intellectual
          disability gene panel, or exome/genome sequencing is the appropriate route in a male with unexplained
          intellectual disability plus spastic paraparesis, particularly with an X-linked family history.
          Because the entity is a single recurrent allele, targeted A140V testing is unusually informative:
          the gene-assignment paper reported a simple PCR prescreen for exactly this purpose. The same
          testing should be considered in females with non-classic Rett phenotypes and intellectual disability
          with neuropsychiatric features.

          '
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: A simple and reliable PCR approach has been developed for detection of the hot spot A140V
          mutation to prescreen any other unexplained cases of MR before further extensive mutation analyses.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
