  91cd4d9261c11d11cb0d8ca5f6fc435faf707f75433a8ca53fde82c0d75ca548:
    claim:
      about:
        disease:
          name: PPM-X Syndrome
          disease_term:
            preferred_term: X-linked intellectual disability-psychosis-macroorchidism syndrome
            term:
              id: MONDO:0010235
              label: X-linked intellectual disability-psychosis-macroorchidism syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Selective Loss of ATRX Recruitment with Preserved Methyl-CpG Binding
        biological_scale: MOLECULAR
        description: 'This is the discriminating node of the entry and the reason PPM-X is mechanistically
          separable from Rett syndrome despite sharing a gene. MeCP2 normally binds methylated CpG dinucleotides
          and, in a DNA-methylation-dependent manner, recruits ATRX - a SWI2/SNF2 helicase/ATPase chromatin
          remodeller, itself the ATR-X syndrome gene - to heterochromatic foci. The ATRX-interacting domain
          of MeCP2 overlaps the methyl-CpG-binding domain, and MBD point mutations causing either Rett
          syndrome or X-linked intellectual disability inhibit the ATRX interaction. What is distinctive
          about p.Ala140Val is not that it spares methyl-CpG binding - the Rett allele R133C does that
          too - but that loss of the ATRX interaction is its ONLY measurably altered property: it binds
          methylated DNA normally, targets heterochromatin efficiently, and, unlike R133C, does not acquire
          aberrant binding to non-methylated DNA. That makes it the cleanest natural separation-of-function
          allele in MeCP2.

          Two consequences follow. Mechanistically, the phenotype of PPM-X can be attributed largely to
          mislocalised ATRX rather than to failed methyl-CpG reading. Clinically, this hypomorphic, function-selective
          character is the most plausible explanation for the sex-reversed severity pattern relative to
          Rett syndrome - hemizygous males survive with moderate intellectual disability instead of dying
          of neonatal encephalopathy, while heterozygous females are normal or only mildly affected instead
          of having classic Rett syndrome.

          '
        gene:
          preferred_term: MECP2
          term:
            id: hgnc:6990
            label: MECP2
        genes:
        - preferred_term: MECP2
          term:
            id: hgnc:6990
            label: MECP2
        - preferred_term: ATRX
          term:
            id: hgnc:886
            label: ATRX
        molecular_functions:
        - preferred_term: methyl-CpG binding
          term:
            id: GO:0008327
            label: methyl-CpG binding
        biological_processes:
        - preferred_term: heterochromatin organization
          term:
            id: GO:0070828
            label: heterochromatin organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: We report that MeCP2 interacts with ATRX, a SWI2/SNF2 DNA helicase/ATPase that is mutated
          in ATRX syndrome (alpha-thalassemia/mental retardation, X-linked).
        supports: SUPPORT
