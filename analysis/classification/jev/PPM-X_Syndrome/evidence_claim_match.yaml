  db50da8cc07d4660fd5431a65458ed80db0b4e15e5c7d12ced129ae7c1839dd2:
    claim:
      about:
        disease:
          name: PPM-X Syndrome
          disease_term:
            preferred_term: X-linked intellectual disability-psychosis-macroorchidism syndrome
            term:
              id: MONDO:0010235
              label: X-linked intellectual disability-psychosis-macroorchidism syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: MECP2
        association: Causative
        variant_origin: GERMLINE
        gene_term:
          preferred_term: MECP2
          term:
            id: hgnc:6990
            label: MECP2
        notes: 'MECP2 (Xq28) encodes methyl-CpG-binding protein 2, a methylated-DNA reader that couples
          DNA methylation to chromatin state, in part by recruiting the SWI2/SNF2 remodeller ATRX to methylated
          heterochromatin. For this entity the allele spectrum is a single recurrent missense substitution,
          c.419C>T p.(Ala140Val), in the alpha-1 helix of the methyl-CpG-binding domain.

          Scope caution. MECP2 is a highly pleiotropic disease gene and this is only one of several distinct
          MECP2 entities curated in dismech - Rett syndrome (`Rett_Syndrome`), MECP2 duplication syndrome
          (`MECP2_Duplication_Syndrome`), and X-linked autism susceptibility 3 (`Autism_Susceptibility_to_X-Linked_3`).
          Evidence must not be pooled across them. In particular the mechanism of PPM-X is a loss of a
          specific protein-protein interaction, whereas Rett-causing MBD substitutions typically abolish
          methyl-CpG binding itself and duplication syndrome is a dosage-gain mechanism. Screening studies
          also matter for scope: A140V is recurrent in male intellectual-disability pedigrees but was
          not found at all in a Brazilian series of 363 males ascertained for intellectual disability
          or psychiatric disease, so it is a recurrent but numerically minor cause of X-linked intellectual
          disability.

          '
      selected_evidence:
        snippet: The A140V mutation was found in all affected males and all carrier females in the family.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
