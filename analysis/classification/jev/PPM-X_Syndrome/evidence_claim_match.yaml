      assertion_type: Treatment
      assertion:
        name: Psychotropic Management of Psychosis and Affective Symptoms
        description: 'The psychiatric component is the most treatable part of this syndrome and the one
          most likely to be missed, because it emerges in adolescence or adult life against a stable background
          of developmental disability. Management is symptomatic and follows general practice for affective
          psychosis in intellectual disability; GeneReviews notes risperidone for agitation in MECP2 disorders.
          There is no PPM-X-specific trial evidence and no disease-modifying therapy. One important safety
          constraint carries over from the MECP2 disorders literature: drugs known to prolong the QT interval
          should be avoided, which is directly relevant here because several antipsychotics do exactly
          that.

          '
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: risperidone
            term:
              id: CHEBI:8871
              label: risperidone
        therapeutic_modality: SMALL_MOLECULE
        target_phenotypes:
        - preferred_term: Psychosis
          term:
            id: HP:0000709
            label: Psychosis
        - preferred_term: Bipolar affective disorder
          term:
            id: HP:0007302
            label: Bipolar affective disorder
        notes: 'Deliberate mismatch flagged for future curation: the only agent with a citable source
          in this disorder group is an antipsychotic (risperidone, from GeneReviews, and directed at agitation),
          whereas the psychiatric phenotype actually reported in PPM-X is manic-depressive, which would
          ordinarily call for mood stabilisation. No mood stabiliser has been reported in any A140V pedigree,
          so none is curated here rather than inventing one; both psychosis and bipolar affective disorder
          are listed as target phenotypes to make the gap visible.

          '
      selected_evidence:
        snippet: Risperidone may help in treating agitation; melatonin can ameliorate sleep disturbances.
