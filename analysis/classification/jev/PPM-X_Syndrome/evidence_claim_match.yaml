            label: MECP2
        type: MISSENSE
      selected_evidence:
        snippet: To date, descriptions have been published of two patients with independent familial mental
          retardation (MR) and two patients with sporadic MR who harbor this specific mutation in the
          MECP2 gene.
        supports: SUPPORT
