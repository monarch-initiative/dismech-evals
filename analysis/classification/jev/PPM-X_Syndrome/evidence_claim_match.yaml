        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: atrx_mislocalization_model
        hypothesis_label: ATRX mislocalisation as the proximate cause of the PPM-X phenotype
        status: EMERGING
        description: 'The dominant mechanistic model for this disorder is that PPM-X is, at the chromatin
          level, a partial phenocopy of ATR-X syndrome produced from the MeCP2 side of the interaction.
          Because p.Ala140Val leaves methyl-CpG reading and heterochromatic targeting intact and its only
          measurable defect is failure to recruit ATRX, the neurological consequences should follow from
          ATRX being in the wrong place rather than from loss of MeCP2 transcriptional function. The model
          is supported by biochemistry and by the observed clinical overlap between the two syndromes
          (intellectual disability, microcephaly, spasticity, dysmorphism), but it has not been tested
          directly: no study has asked whether restoring ATRX targeting rescues the A140V phenotype, ATRX
          localisation has not been reported in the allele-matched mouse, and the alpha-thalassemia and
          urogenital features of ATR-X syndrome are absent from PPM-X, so the phenocopy is at best partial.

          '
      selected_evidence:
        snippet: We propose that disruption of the MeCP2-ATRX interaction leads to pathological changes
          that contribute to mental retardation.
        supports: SUPPORT
    origin:
