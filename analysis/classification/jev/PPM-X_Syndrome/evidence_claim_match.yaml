      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12325019
      reference_title: 'Identification of a family with nonspecific mental retardation (MRX79) with the
        A140V mutation in the MECP2 gene: is there a need for routine screening?'
      evidence_source: HUMAN_CLINICAL
      explanation: 'The same allele described as causing explicitly non-syndromic intellectual disability,
        which is the crux of the boundary question.

        '
