  4649891af2906120f1041ef3afe6cdcff99bf5e2b1d8ae197f46f68502718903:
    claim:
      about:
        disease:
          name: PPP2R3C-Related Gonadal Dysgenesis Syndrome
          disease_term:
            preferred_term: gonadal dysgenesis, dysmorphic facies, retinal dystrophy, and myopathy
            term:
              id: MONDO:0032738
              label: gonadal dysgenesis, dysmorphic facies, retinal dystrophy, and myopathy
        context: []
      assertion_type: Genetic
      assertion:
        name: PPP2R3C
        gene_term:
          preferred_term: PPP2R3C
          term:
            id: hgnc:17485
            label: PPP2R3C
        relationship_type: CAUSATIVE
        notes: PPP2R3C (14q13.2) encodes the B''gamma (also called G5PR) regulatory subunit of protein
          phosphatase 2A. Reported disease alleles are missense or in-frame changes rather than clear
          nulls — p.Leu103Pro, p.Leu193Ser, p.Phe350Ser, p.Ser216_Tyr218dup, and the compound-heterozygous
          p.Phe229del/p.Gly417Glu. The absence of biallelic truncating alleles in humans is consistent
          with the mouse data showing that complete loss of Ppp2r3c is embryonic lethal.
        case_fractions:
        - population: Chinese 46,XY disorders-of-sex-development cohort
          case_fraction_percent: 1.4
          cohort_size: 70
          notes: PPP2R3C was the causal gene in one proband of a 70-patient 46,XY DSD series, which resolves
            to 1.4%. This quantifies how small a share of unselected 46,XY DSD is attributable to PPP2R3C,
            in contrast to AR, SRD5A2 and NR5A1, which dominate the same series. The cohort was sequenced
            for 46,XY DSD specifically, so this fraction says nothing about 46,XX presentations of PPP2R3C
            disease.
      selected_evidence:
        snippet: caused by homozygous variants in PPP2R3C gene.
        supports: SUPPORT
