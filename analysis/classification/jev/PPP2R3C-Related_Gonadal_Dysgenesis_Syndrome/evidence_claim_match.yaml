          term:
            id: MONDO:0010765
            label: 46,XY complete gonadal dysgenesis
        description: 'The classic nonsyndromic form, in which a 46,XY individual has female external genitalia,
          Mullerian structures and streak gonads with no extragonadal syndrome. This is the single most
          important distinction for this entry: the dismech entry 46,XY complete gonadal dysgenesis is
          deliberately restricted to nonsyndromic disease and explicitly places PPP2R3C-related disease
          outside its scope, so the two entries partition rather than overlap.'
        distinguishing_features:
        - Absence of a recognizable facial gestalt
        - Absence of the extragonadal syndrome (delayed bone age, developmental delay, renal agenesis,
          hearing loss, retinal dystrophy, myopathy)
        - Restricted to 46,XY individuals, whereas PPP2R3C-related disease also affects 46,XX individuals
        - Typically caused by SRY, NR5A1, MAP3K1, DHX37 or other nonsyndromic-DSD genes rather than PPP2R3C
      selected_evidence:
        snippet: 'Patients also manifested a unique syndrome of extragonadal

          anomalies, including typical facial gestalt'
        supports: SUPPORT
