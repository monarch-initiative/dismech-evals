  c6925f310a4b836064a28f4568555281bc19c837a2aafb08131e0a5ddf504c27:
    claim:
      about:
        disease:
          name: PPP2R3C-Related Gonadal Dysgenesis Syndrome
          disease_term:
            preferred_term: gonadal dysgenesis, dysmorphic facies, retinal dystrophy, and myopathy
            term:
              id: MONDO:0032738
              label: gonadal dysgenesis, dysmorphic facies, retinal dystrophy, and myopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ppp2r3c_immunodeficiency_n_of_1
        prompt: Is lymphocyte depletion (reduced CD19+ B cells and CD4+ T cells) a genuine component of
          PPP2R3C-related gonadal dysgenesis syndrome, or an incidental finding in one patient?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Decreased total B cell count
        - phenotypes#Decreased CD4+ T cell proportion
        rationale: Only one reported patient has had T/B subsets measured at all, and that patient had
          a normal total white cell count, normal haemoglobin and normal total lymphocyte count and proportion
          — the abnormality appears only on subset analysis. The finding is mechanistically plausible
          because PPP2R3C (G5PR) is highly expressed in lymphocytes and conditional CD19-Cre knockout
          mice show a B-cell survival deficit, but plausibility is not frequency. No infection history
          is reported for the patient, so the clinical significance is unknown. Until subsets are measured
          systematically in a series, this should not be promoted to an established feature of the syndrome.
        proposed_experiments:
        - experiment_id: exp_ppp2r3c_prospective_lymphocyte_subsets
          name: Prospective lymphocyte subset phenotyping in biallelic PPP2R3C carriers
          description: Measure T and B lymphocyte subsets prospectively in every newly ascertained individual
            with biallelic PPP2R3C variants, paired with infection history and immunoglobulin levels,
            to establish whether the single reported subset abnormality recurs and whether it is clinically
            consequential.
        - experiment_id: exp_ppp2r3c_retrospective_immunophenotyping
          name: Retrospective immunophenotyping of previously reported patients
          description: Re-test the previously published PPP2R3C cohorts, which were characterized before
            immunophenotyping was considered relevant to this syndrome, to convert the current n=1 observation
            into a real numerator and denominator.
      selected_evidence:
        snippet: normal hemoglobin concentration, and normal lymphocyte
        supports: SUPPORT
