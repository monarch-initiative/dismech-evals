      assertion_type: Pathophysiology
      assertion:
        name: PPP2R3C-MAP3K1 Centrosomal Phospho-Regulatory Imbalance
        biological_scale: CELLULAR
        description: Cell-biological work identifies PPP2R3C as a distal centriole protein and functional
          partner of the centriolar proteins CEP350 and FOP, whose key job is to counteract the kinase
          MAP3K1. A syndromic PPP2R3C variant fails to localize to the centriole and to bind FOP. Because
          activating MAP3K1 variants cause a separate gonadal dysgenesis syndrome, the proposal is that
          an imbalanced centrosomal kinase-phosphatase pair is the shared cause of both disorders. This
          is a mechanistic proposal from cultured human cells; it has not been demonstrated in patient
          gonadal tissue.
        cellular_components:
        - preferred_term: distal centriole
          term:
            id: GO:0005814
            label: centriole
        biological_processes:
        - preferred_term: JNK cascade
          term:
            id: GO:0007254
            label: JNK cascade
          modifier: ABNORMAL
        notes: Recorded as an emerging mechanism. The centrosomal module is attractive because it unifies
          PPP2R3C loss-of-function with MAP3K1 gain-of-function gonadal dysgenesis, but no patient-derived
          gonadal tissue has been shown to carry a centriolar defect, and the relationship between the
          centrosomal module and the reduced gonadal SOX9 phosphorylation seen in patients has not been
          tested.
      selected_evidence:
        snippet: a key function of PPP2R3C is to counteract the kinase activity of MAP3K1
        supports: SUPPORT
