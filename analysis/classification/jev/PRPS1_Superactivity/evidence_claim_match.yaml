          with no detectable PRPS1 coding variant. PRPS1 variant-positive disease is inherited in an X-linked
          manner, and heterozygous females can be clinically affected.
        variants:
        - name: PRPS1 missense gain-of-function variants
          description: Missense variants alter PRS-I allosteric regulation, including reduced inhibition
            by purine nucleotides such as ADP/GDP.
        - name: PRPS1 transcriptional overactivity with structurally normal PRS1
          description: Some affected males have increased PRPS1 transcription and PRS1 overexpression
            without a detectable PRPS1 coding variant.
      selected_evidence:
        snippet: Study of the two X-linked PRS isoforms (PRS1 and PRS2) in cells from certain affected
          individuals has shown selectively increased concentrations of structurally normal PRS1 transcript
          and isoform, suggesting that this form of the disorder involves pretranslational dysregulation
          of PRPS1 expression and might be more appropriately termed overactivity of normal PRS.
        supports: SUPPORT
