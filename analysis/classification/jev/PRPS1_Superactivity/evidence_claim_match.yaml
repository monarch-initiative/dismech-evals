      assertion_type: Subtype
      assertion:
        name: Mild
        display_name: PRS-I superactivity, mild phenotype
        classification: clinical_phenotype
        subtype_frequency: ~75% of affected males
        description: Later-onset phenotype, typically presenting in the second or third decade and usually
          limited to hyperuricemia and hyperuricosuria with urinary crystalluria or stones and later gout
          if serum urate is not controlled.
      selected_evidence:
        snippet: The mild phenotype (~75% of affected males) with onset in the second or third decade
          of life is typically limited to these biochemical findings, whereas the severe phenotype (~25%
          of affected males) with onset in the first decade of life has in addition to these biochemical
          findings variable combinations of developmental delay (DD) / intellectual disability (ID), sensorineural
          hearing loss, hypotonia, and ataxia.
        supports: SUPPORT
