  d8b449e728869599d271c0df00e397fb6d4ac026d011b6f397d0f95b2d9c295c:
    claim:
      about:
        disease:
          name: PUM1-Associated Developmental Disability, Ataxia, and Seizure Syndrome
          disease_term:
            preferred_term: PUM1-associated developmental disability, ataxia, and seizure syndrome
            term:
              id: MONDO:0958231
              label: neurodevelopmental disorder with motor abnormalities, seizures, and facial dysmorphism
        context: []
      assertion_type: Genetic
      assertion:
        name: PUM1
        gene_term:
          preferred_term: PUM1
          term:
            id: hgnc:14957
            label: PUM1
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: PUM1 at 1p35.2 encodes Pumilio1, a PUF-family sequence-specific RNA-binding protein that
          binds Pumilio response elements in the 3' untranslated regions of target mRNAs and represses
          their translation and stability. Disease-causing lesions are heterozygous whole-gene deletions,
          de novo missense variants inside or immediately adjacent to the Pumilio homology domain (recurrently
          p.Arg1139Trp and p.Arg1147Trp), at least one de novo frameshift allele, and a de novo nonsense
          allele (p.Arg837Ter) listed in the case table of PMID:35386260. The founding paper's text gives
          the nine deletions in its cohort as 0.6 to 5.60 Mb, with PUM1 the only gene inside the minimal
          region of overlap. The case table in PMID:35386260 lists a smaller copy-number loss of about
          0.28 Mb (chr1:31442430-31720099), so the lower bound of the size range is below the founding
          paper's stated 0.6 Mb.
      selected_evidence:
        snippet: we did identify nine patients with heterozygous deletions ranging in size from 0.6 to
          5.60 Mb, where the minimal region of overlap included only PUM1
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29474920
      reference_title: A Mild PUM1 Mutation Is Associated with Adult-Onset Ataxia, whereas Haploinsufficiency
        Causes Developmental Delay and Seizures.
      evidence_source: HUMAN_CLINICAL
      explanation: Narrows the deleted interval to PUM1 alone, which is what makes the deletion cases
        evidence about this gene rather than about a contiguous gene syndrome.
