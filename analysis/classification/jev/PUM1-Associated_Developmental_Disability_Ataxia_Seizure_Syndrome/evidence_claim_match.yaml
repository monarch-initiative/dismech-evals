          in all affected members and absent from the supposedly non-penetrant relative.
        distinguishing_features:
        - SCA27B is an adult-onset ataxia caused by an FGF14 GAA repeat expansion, detected by repeat-targeted
          testing rather than by exome sequencing. It has no relationship to the infantile PADDAS phenotype
          other than that a PUM1 variant was once wrongly credited for it, which is a reason to test for
          FGF14 expansions rather than to attribute an adult ataxia to a PUM1 variant of uncertain significance.
