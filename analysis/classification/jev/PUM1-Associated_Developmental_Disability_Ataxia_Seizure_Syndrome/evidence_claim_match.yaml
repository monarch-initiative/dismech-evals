    claim:
      about:
        disease:
          name: PUM1-Associated Developmental Disability, Ataxia, and Seizure Syndrome
          disease_term:
            preferred_term: PUM1-associated developmental disability, ataxia, and seizure syndrome
            term:
              id: MONDO:0958231
              label: neurodevelopmental disorder with motor abnormalities, seizures, and facial dysmorphism
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Pum1 heterozygous mouse
        species: Mouse
        genotype: Pum1+/- (heterozygous null)
        publication: PMID:25768905
        description: 'The mouse counterpart of PUM1 haploinsufficiency, and the model that prompted the
          search for human PUM1 patients. Pum1+/- mice develop progressive motor dysfunction with Purkinje
          cell degeneration, and the phenotype is driven by raised wild-type Ataxin1: crossing to Atxn1+/-
          normalises Ataxin1 levels and largely rescues it, while crossing to an SCA1 model worsens it.
          Roughly two thirds of heterozygotes also develop spontaneous seizures, so the model captures
          both the ataxia and the epilepsy arms of the human disorder.'
        modeled_mechanisms:
        - target: Elevated Wild-Type Ataxin-1 in Purkinje Cells
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: Raised Ataxin1 in the haploinsufficient mouse, shown to be the mediator of the
            phenotype by bidirectional genetic rescue and exacerbation. The observation is Ataxin1 accumulation
            in cerebellar Purkinje cells, at the same scale as the node.
          limitations: The rescue experiments alter Atxn1 gene dosage genetically from conception, which
            is not available as an intervention in humans and says nothing about whether lowering ataxin-1
            after symptom onset would help. No equivalent measurement of ataxin-1 in human PADDAS neural
            tissue has been reported.
        - target: Cerebellar Purkinje Cell Degeneration
          relationship: RECAPITULATES
          fidelity: MODERATE
