      assertion_type: Discussion
      assertion:
        discussion_id: paddas_natural_history
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the neurological course of PADDAS static, as in a developmental encephalopathy, or
          progressive, as the mouse degeneration and the ataxia in some probands suggest?
        attaches_to:
        - pathophysiology#Cerebellar Purkinje Cell Degeneration
        - phenotypes#Ataxia
        rationale: 'The answer changes what is said to families at diagnosis and whether serial neurological
          and imaging follow-up is warranted beyond routine developmental review. The mechanism points
          at progression: the mouse model degenerates, and two founding probands were documented as having
          progressive features. The human evidence does not settle it, because no longitudinal cohort
          has been followed. With the adult-onset PUM1 ataxia phenotype withdrawn, there is also no longer
          a late-onset human counterpart from which to infer a degenerative trajectory.'
      selected_evidence:
        snippet: She developed early-onset, progressive ataxia with hypotonicity in her lower limbs
        supports: SUPPORT
