              id: MONDO:0958231
              label: neurodevelopmental disorder with motor abnormalities, seizures, and facial dysmorphism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neuronal Dendritic Arborization
        biological_scale: CELLULAR
        description: 'PUM1 dosage influences dendritic complexity in neurons. The loss-of-function observation
          is in Pum1+/- mice, where Purkinje cells lose dendritic arborization by 10 weeks; the authors
          attribute this to neurodegeneration rather than to a developmental defect. In dissociated mouse
          hippocampal neurons, overexpressing wild-type PUM1 at about twice normal levels impaired branching,
          and overexpressing PADDAS-associated mutants suppressed it less, which shows that the mutants
          keep partial activity rather than directly showing that reduced PUM1 reduces branching. The
          edges from this node to developmental delay and intellectual disability are therefore inferential:
          no study has measured dendritic development in human PADDAS neurons.'
        biological_processes:
        - preferred_term: dendrite morphogenesis
          modifier: DECREASED
          term:
            id: GO:0048813
            label: dendrite morphogenesis
      selected_evidence:
        snippet: Overexpression of each mutant suppressed dendritic arborization somewhat compared to
          empty vector
        supports: SUPPORT
        directness: INDIRECT
