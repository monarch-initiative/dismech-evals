      assertion_type: Discussion
      assertion:
        discussion_id: paddas_atxn1_lowering
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        prompt: If raised wild-type ataxin-1 mediates the cerebellar phenotype, would lowering ATXN1 benefit
          PADDAS?
        attaches_to:
        - pathophysiology#Elevated Wild-Type Ataxin-1 in Purkinje Cells
        rationale: 'Genetically halving Atxn1 largely rescues the Pum1 heterozygous mouse, which is a
          direct demonstration that the step is tractable in principle. No PUM1 or PADDAS preclinical
          rescue study using an ATXN1-lowering agent has been published, and none is claimed here. Two
          limits are worth stating alongside the hypothesis: ataxin-1 de-repression is only one arm of
          the mechanism, since the severe alleles act partly by disrupting PUM1 partner complexes rather
          than by raising canonical targets; and the developmental features of PADDAS are established
          before any postnatal intervention could begin.'
      selected_evidence:
        snippet: the severe mutation disrupts interactions with several RNA-binding proteins and the regulation
          of their targets
        supports: SUPPORT
