        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disruption of PUM1 Partner RNA-Binding Protein Complexes
        biological_scale: MOLECULAR
        description: The severe PADDAS missense allele p.Arg1147Trp lies outside the RNA-binding domain
          and leaves canonical target repression intact, yet produces a far more severe phenotype than
          the alleles that impair RNA binding. In mouse brain proteomics and patient cell lines the severe
          allele instead disrupts PUM1's interactions with partner RNA-binding proteins, dysregulating
          their targets as well. This is why phenotype severity in PUM1 disease is not a linear function
          of PUM1 abundance.
      selected_evidence:
        snippet: Our results demonstrate that dosage sensitivity does not always signify a linear relationship
          with protein abundance but can involve distinct mechanisms.
        supports: SUPPORT
