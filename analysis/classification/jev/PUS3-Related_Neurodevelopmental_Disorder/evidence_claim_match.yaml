  dbfc1567c3c660588d248882e93fb2cd6b10faae6494c7bf167e0c8cc0fa2ffb:
    claim:
      about:
        disease:
          name: PUS3-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: PUS3-related neurodevelopmental disorder (NEDMIGS)
            term:
              id: MONDO:0014886
              label: severe growth deficiency-strabismus-extensive dermal melanocytosis-intellectual disability
                syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pus3_translation_step_unmeasured
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does loss of pseudouridine at tRNA positions 38 and 39 actually degrade translational
          fidelity or efficiency in human neural cells, and if so which transcripts or codons are most
          affected?
        attaches_to:
        - pathophysiology#Impaired Translational Fidelity and Efficiency
        rationale: This is the weakest link in the causal chain. Every step from the PUS3 genotype to
          depleted pseudouridine at positions 38 and 39 has been measured directly in patient cells by
          two independent groups. The step from there to impaired translation is inferred from tRNA structural
          chemistry and from bacterial truA and yeast pus3 orthologue phenotypes, and the step from impaired
          translation to selective vulnerability of the developing brain is inferred from the pattern
          shared across the tRNA-modification intellectual disability disorders. No ribosome profiling,
          proteomics or reporter-fidelity measurement has been reported in a human PUS3-deficient neural
          cell. Until that measurement exists, the mechanistic explanation for why a housekeeping tRNA
          modification produces a brain-predominant phenotype remains a hypothesis rather than a finding.
        proposed_experiments:
        - experiment_id: exp_pus3_ribosome_profiling_neurons
          name: Ribosome profiling and proteomics in patient iPSC-derived neurons
          description: Perform ribosome profiling and quantitative proteomics in patient-derived iPSC
            neural progenitors and neurons versus isogenic corrected controls, testing for codon-specific
            ribosome pausing at codons decoded by the tRNAs that normally carry pseudouridine at positions
            38 and 39.
        - experiment_id: exp_pus3_fidelity_reporters
          name: Translational fidelity reporter assays in patient cells
          description: Use dual-luciferase or fluorescent reporter assays of frameshifting and stop-codon
            readthrough in patient fibroblasts and iPSC-derived neurons, the human counterpart of the
            reduced minus-one frameshifting reported in yeast pus3 mutants.
        - experiment_id: exp_pus3_cerebral_organoids
