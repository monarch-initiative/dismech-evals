      assertion:
        name: Impaired Translational Fidelity and Efficiency
        biological_scale: CELLULAR
        description: 'Reduced anticodon-loop pseudouridylation is expected to degrade the accuracy and
          efficiency of protein synthesis. In lower organisms loss of the orthologous enzyme is clearly
          consequential: bacterial truA mutants grow poorly and yeast pus3-delta mutants are slow-growing
          and temperature-sensitive with reduced frameshifting fidelity. The corresponding measurement
          has not been made in human patient neurons.'
        biological_processes:
        - preferred_term: translation
          term:
            id: GO:0006412
            label: translation
          modifier: DECREASED
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        notes: PMID:38996458 mapped transcriptome-wide pseudouridine sites in PUS3-deleted HEK293 cells
          and found no evidence that human PUS3 modifies mRNAs. The proposed translational mechanism concerns
          tRNA hypomodification.
      selected_evidence:
        snippet: Our work provides the molecular basis for PUS3-mediated tRNA modification in humans and
          explains how its tRNA modification activity is linked to intellectual disabilities.
        supports: SUPPORT
