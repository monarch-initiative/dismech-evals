          child with severe developmental delay risks amblyopia that further limits an already constrained
          visual and communicative repertoire. Scoped and named as surveillance to match its NCIT action
          term: the entry asserts case detection through formal eye examination, not any specific corrective
          intervention, because no strabismus or retinal treatment outcome has been reported in this disorder.'
