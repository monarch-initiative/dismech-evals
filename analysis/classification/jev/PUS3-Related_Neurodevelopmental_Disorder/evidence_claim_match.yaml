      assertion_type: DifferentialDiagnosis
      assertion:
        name: PUS7-Related Neurodevelopmental Disorder
        disease_term:
          preferred_term: PUS7-related neurodevelopmental disorder (IDDABS)
          term:
            id: MONDO:0032687
            label: intellectual developmental disorder with abnormal behavior, microcephaly, and short
              stature
        description: The closest mechanistic relative and the sibling entry in this knowledge base. PUS7
          (hgnc:26033) is another stand-alone pseudouridine synthase whose biallelic loss causes intellectual
          disability with microcephaly and short stature. Both disorders are described in the literature
          as caused by "impaired pseudouridylation", so a gene-agnostic reading of that phrase will merge
          them.
        distinguishing_features:
        - 'Molecular: PUS3 (hgnc:25461) versus PUS7 (hgnc:26033). Different genes, different MONDO entities,
          different OMIM numbers (617051 versus 618342).'
        - 'Substrate position: PUS3 isomerises uridine at tRNA anticodon positions 38 and 39, whereas
          PUS7 acts at position 13 and at position 35 of pre-tRNA-Tyr. A tRNA modification assay distinguishes
          them biochemically and is the cleanest functional discriminator.'
        - 'Clinical: grey sclerae and extensive dermal melanocytosis are part of the PUS3 picture and
          have never been reported in PUS7 deficiency, while the PUS7 behavioural signature of very-early-onset
          aggression is not part of the PUS3 phenotype.'
      selected_evidence:
        snippet: Consistent with the known role of Pus3 in isomerizing uracil to pseudouridine at positions
          38 and 39 in tRNA, we found a significant reduction in this post-transcriptional modification
          of tRNA in patient cells.
        supports: SUPPORT
