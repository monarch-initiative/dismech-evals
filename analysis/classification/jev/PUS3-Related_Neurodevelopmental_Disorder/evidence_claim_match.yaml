          numerator and denominator. The Nostvik abstract explicitly warns that the feature is less characteristic
          than previously suggested, so its absence must not be used to exclude the diagnosis. The HPO
          term used is Pigmentation of the sclera, NOT Blue sclerae (HP:0000592) as the deep-research
          report suggested; blue sclerae denote the thin collagen-deficient sclerae of osteogenesis imperfecta
          and related connective tissue disorders, which is a mechanistically different sign from the
          melanocytic grey discoloration seen here.'
        phenotype_term:
          preferred_term: Grey sclerae
