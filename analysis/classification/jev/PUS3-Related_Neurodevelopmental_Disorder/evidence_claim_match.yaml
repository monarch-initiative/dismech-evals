                syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: tRNA pseudouridine assay for variant interpretation
        description: Measuring PUS3-dependent pseudouridine in patient-derived cells is the direct functional
          readout of the enzyme defect and is the assay that resolves a PUS3 variant of uncertain significance.
          It is essential for missense alleles, because p.Tyr71Cys demonstrates that a variant can look
          catalytically normal in a purified enzyme assay while being a functional null in the cell -
          so protein-level and pseudouridine-level measurement in patient cells, not in vitro catalysis,
          is the informative test. This remains a research-level assay rather than routine diagnostics.
        diagnosis_term:
          preferred_term: molecular analysis
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: we observe that the PUS3 protein levels as well as the level of PUS3-dependent Ψ levels
          are strongly reduced in fibroblasts derived from all three patients.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/0
      context_paths:
