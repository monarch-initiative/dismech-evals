    evidence_metadata:
      reference: PMID:36125428
      reference_title: Destabilization of mutated human PUS3 protein causes intellectual disability.
      evidence_source: IN_VITRO
      explanation: Establishes reduced PUS3 protein and pseudouridine in patient fibroblasts as the functional
