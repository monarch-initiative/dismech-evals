  819b4abdf54cf53a4af13a28d38f2a71fc1663d068a65b5ac22eeae30eeb26ac:
    claim:
      about:
        disease:
          name: PUS3-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: PUS3-related neurodevelopmental disorder (NEDMIGS)
            term:
              id: MONDO:0014886
              label: severe growth deficiency-strabismus-extensive dermal melanocytosis-intellectual disability
                syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pus3_somatic_features_mechanism_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does loss of tRNA pseudouridine at positions 38 and 39 produce the extra-neurological
          features of the syndrome - postnatal growth failure, coarse facies, the ocular findings, the
          single-case renal and cardiac malformations, and scoliosis?
        attaches_to:
        - phenotypes#Severe Short Stature and Growth Failure
        - phenotypes#Failure to Thrive
        - phenotypes#Coarse Facial Features
        - phenotypes#Strabismus
        - phenotypes#Grey Sclerae
        - phenotypes#Retinal Dystrophy
        - phenotypes#Renal Hypoplasia
        - phenotypes#Congenital Heart Defect
        - phenotypes#Scoliosis
        rationale: The pathograph explains the brain-predominant core of the disorder through the tRNA
          hypomodification chain, and the terminal node carries manifestation edges only for the neurological
          features. The somatic features are deliberately left unwired. The founding paper's own proposal
          - that the brain is simply the tissue most sensitive to reduced translational efficiency - predicts
          a brain-limited phenotype and therefore does not account for growth failure, coarse facies,
          strabismus, grey sclerae, retinal dystrophy, renal hypoplasia, a congenital heart defect or
          scoliosis, and no published study has connected any of these features to the tRNA defect. For
          scoliosis specifically it is additionally unresolved whether it is a primary skeletal feature
          at all or secondary to hypotonia and limited mobility, which would route it through the neurological
          arm. Wiring these phenotypes into the pathograph now would manufacture edges the literature
          cannot support; the honest representation is this recorded gap. The related but distinct question
          of whether extensive dermal melanocytosis is a disease feature at all is tracked separately
          in pus3_dermal_melanocytosis_generalisability.
        proposed_experiments:
        - experiment_id: exp_pus3_somatic_tissue_pseudouridylation
          name: Tissue survey of PUS3-dependent pseudouridylation outside the brain
          description: Measure PUS3 expression and position 38/39 tRNA pseudouridine levels in growth-plate,
            ocular, renal and cardiac tissues or corresponding iPSC-derived lineages, to test whether
            the somatic features track tissues with high PUS3 dependence - something the brain-sensitivity
            hypothesis as stated does not predict.
      selected_evidence:
        snippet: This patient further expands the phenotypic spectrum of PUS3-related disorders to include
          a more severe syndromic presentation.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34713961
      reference_title: 'PUS3-related disorder: Report of a novel patient and delineation of the phenotypic
