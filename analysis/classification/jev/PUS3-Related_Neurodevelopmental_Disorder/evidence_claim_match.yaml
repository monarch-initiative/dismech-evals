  ce94856fb8d70f300f6762c897d752bfcb6d65218ee3b89ee106d79894166b80:
    claim:
      about:
        disease:
          name: PUS3-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: PUS3-related neurodevelopmental disorder (NEDMIGS)
            term:
              id: MONDO:0014886
              label: severe growth deficiency-strabismus-extensive dermal melanocytosis-intellectual disability
                syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of PUS3 Pseudouridine Synthase Activity
        biological_scale: MOLECULAR
        description: 'PUS3 is a stand-alone, guide-RNA-independent pseudouridine synthase of the TruA/Pus3
          family that isomerises uridine to pseudouridine in the anticodon stem loop of cytosolic tRNAs.
          Cryo-EM shows it acts as a symmetric homodimer that clamps the tRNA and presents the target
          uridine to its active site. Two distinct routes destroy that activity in patients: outright
          absence of the protein from truncating alleles, and post-translational depletion from missense
          alleles that impair thermostability (p.Tyr71Cys) or promote aggregation (p.Ile299Thr).'
        molecular_functions:
        - preferred_term: tRNA pseudouridine synthase activity
