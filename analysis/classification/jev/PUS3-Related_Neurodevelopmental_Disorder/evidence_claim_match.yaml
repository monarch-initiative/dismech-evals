                syndrome
        context: []
      assertion_type: Phenotype
      assertion:
        name: Extensive Dermal Melanocytosis
        category: Dermatologic
        description: Widespread, extensive Mongolian spots - congenital deep dermal melanocytosis extending
          well beyond the usual sacral distribution - were present in all three sisters of the founding
          Saudi family and supply the "extensive dermal melanocytosis" element of the Orphanet and MONDO
          label for this disorder. This is the single most distinctive external sign of the founding phenotype
          and is the handle by which the descriptive label can be recognised.
        notes: 'Frequency deliberately omitted. Extensive dermal melanocytosis is documented in 3/3 individuals
          of the founding family but is not reported at all in the abstract of the 21-individual pooled
          cohort, which lists only gray sclera among pigmentary findings, nor in the 2022 Italian, 2022
          Polish or 2026 Turkish reports. The honest position is that its disease-wide frequency is unknown
          and may be low or may reflect ascertainment in a single ancestry, so no band is asserted. This
          is also the feature that makes the MONDO label a named-entity-confusion hazard: extensive dermal
          melanocytosis with coarse facies and developmental delay is the classic presentation of GM1
          gangliosidosis and the mucopolysaccharidoses, which are recorded in differential_diagnoses and
          which were excluded biochemically in the founding family.'
        phenotype_term:
          preferred_term: Extensive Mongolian spots (dermal melanocytosis)
          term:
            id: HP:0011369
            label: Mongolian blue spot
      selected_evidence:
        snippet: She has coarse facial features, bilateral strabismus, grey sclera and extensive Mongolian
          spots
        supports: SUPPORT
