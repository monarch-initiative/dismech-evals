  af09beb892c964ba1b6336b58b422d9b44b33a6761988a9fac0d7812dc93cecc:
    claim:
      about:
        disease:
          name: PUS3-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: PUS3-related neurodevelopmental disorder (NEDMIGS)
            term:
              id: MONDO:0014886
              label: severe growth deficiency-strabismus-extensive dermal melanocytosis-intellectual disability
                syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: PUS3
        gene_term:
          preferred_term: PUS3
          term:
            id: hgnc:25461
            label: PUS3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'PUS3 (11q24.2, gene MIM 616283) encodes a 481-amino-acid, guide-RNA-independent pseudouridine
          synthase of the TruA/Pus3 family that isomerises uridine to pseudouridine at positions 38 and
          39 of the tRNA anticodon stem loop. The orthologous enzyme acts at U38/U39/U40 in bacteria (TruA),
          at U38 and U39 in S. cerevisiae, and preferentially at U39 in mouse. The reference transcript
          used in the clinical literature is NM_031307.

          Gene identity was verified against the MONDO gene-association relation (`RO:0004003 HGNC:25461
          ! PUS3`) and against the HGNC record `hgnc:25461`, whose definition "pseudouridine synthase
          3" cites PMID:27055666. This is deliberately distinct from the family members PUS1 (hgnc:15508),
          which causes myopathy with lactic acidosis and sideroblastic anaemia, and PUS7 (hgnc:26033),
          which causes a separate intellectual disability syndrome already curated in this knowledge base;
          see differential_diagnoses. Note also that MIM 616283 is the PUS3 GENE entry whereas MIM 617051
          is the DISEASE entry that MONDO:0014886 cross-references.

          Reported allelic spectrum comprises roughly 17 distinct variants across the published cohort:
          eight missense, seven protein-truncating (three nonsense, two single-base deletions, two single-base
          duplications), one splice-region variant and one initiation-codon substitution. Both homozygous
          and compound heterozygous genotypes occur in approximately equal numbers.'
        variants:
        - name: c.1303C>T (p.Arg435*)
          type: NONSENSE
          clinical_significance: PATHOGENIC
          description: The founding allele, homozygous in three affected Saudi sisters. It truncates the
            final 46 residues plus the end of a conserved region and behaves as a near-complete null in
            patient lymphoblastoid cells.
        - name: c.212A>G (p.Tyr71Cys)
          type: MISSENSE
          clinical_significance: LIKELY_PATHOGENIC
          description: 'A recurrent missense allele, found homozygous or in trans with p.Ile299Thr, and
            carried by five of the fewer than thirty reported individuals. Mechanistically instructive:
            the purified protein retains normal tRNA binding and pseudouridylation activity, but its thermostability
            is strongly impaired and it is nearly absent from patient fibroblasts, so it is a functional
            null despite normal in vitro catalysis.'
        - name: c.896T>C (p.Ile299Thr)
          type: MISSENSE
          clinical_significance: LIKELY_PATHOGENIC
          description: Found in trans with p.Tyr71Cys in a compound heterozygous patient. Unlike p.Tyr71Cys
            it acts by promoting aggregation of the recombinant protein, a second distinct route to loss
            of available enzyme.
      selected_evidence:
        snippet: Our findings provide additional evidence to establish loss of PUS3 function as a cause
          of intellectual disability.
        supports: SUPPORT
