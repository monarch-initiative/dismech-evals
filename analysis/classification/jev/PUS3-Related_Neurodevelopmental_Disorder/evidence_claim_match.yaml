          giving the "severe growth deficiency" element of the Orphanet label. Growth failure is also
          a recurrent feature outside that family.
        frequency: FREQUENT
        notes: 'Derivation: short stature in 10/17 assessed (59 percent) in the Nostvik full text, within
          the FREQUENT band. The severity is variable - "severe growth deficiency" in the founding family,
          but plain short stature or growth failure elsewhere - so the generic Short stature term is used
          rather than Severe short stature (HP:0003510). Note that growth was normal at birth in all three
          founding sisters, so this is postnatal growth failure, not intrauterine growth restriction.'
        phenotype_term:
          preferred_term: Short stature
          term:
            id: HP:0004322
            label: Short stature
      selected_evidence:
        snippet: Examination revealed coarse facies but less striking compared to the sister, severe growth
          deficiency with borderline microcephaly
