            term:
              id: MONDO:0014886
              label: severe growth deficiency-strabismus-extensive dermal melanocytosis-intellectual disability
                syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Metabolic screening to exclude storage-disorder mimics
        description: Because extensive dermal melanocytosis with coarse facies and developmental delay
          is the classic presentation of GM1 gangliosidosis and the mucopolysaccharidoses/mucolipidoses,
          the diagnostic workup should include urine glycosaminoglycans and organic acids, tandem mass
          spectrometry, plasma lactate and congenital disorders of glycosylation screening. In the founding
          family all of these were negative, and that negative panel is what separated this disorder from
          the storage mimics before the gene was known.
        notes: 'Term choice. An earlier revision bound this to NCIT:C19770 Molecular Analysis, which is
          wrong: urine glycosaminoglycans and organic acids, tandem mass spectrometry and plasma lactate
          are biochemical assays on body fluids, not molecular-genetic analysis. NCIT:C25294 Laboratory
          Procedure, verified with OAK as "Any procedure that involves testing or manipulating a sample
          of blood, urine, or other body substance in a laboratory setting", is the correct action term.
          The genuinely molecular assay in this entry - the tRNA pseudouridine measurement - correctly
          keeps NCIT:C19770.'
        diagnosis_term:
          preferred_term: biochemical laboratory screening
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
      selected_evidence:
        snippet: Negative results include urine organic acids and GAGs, Tandem MS, plasma lactate, uric
          acid, lipid profile, CDG screening, and molecular karyotyping.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/2
      evidence_path: /diagnosis/2/evidence/0
