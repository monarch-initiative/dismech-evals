  b6308499427e19cff7603f67eda28d861d1a24605d4ca1a916d26fb865b86912:
    claim:
      about:
        disease:
          name: PUS3-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: PUS3-related neurodevelopmental disorder (NEDMIGS)
            term:
              id: MONDO:0014886
              label: severe growth deficiency-strabismus-extensive dermal melanocytosis-intellectual disability
                syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pus3_dermal_melanocytosis_generalisability
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is extensive dermal melanocytosis a real, mechanistically meaningful feature of PUS3 deficiency,
          or an ancestry-linked incidental finding in the single founding family that has been fossilised
          into the Orphanet and MONDO label?
        attaches_to:
        - phenotypes#Extensive Dermal Melanocytosis
        rationale: Extensive Mongolian spots appear in all three sisters of the founding Saudi family
          and are prominent enough to have named the disorder in Orphanet and MONDO. Yet the feature is
          absent from the abstract of the 21-individual pooled cohort, which enumerates gray sclera among
          pigmentary findings but not dermal melanocytosis, and it is not mentioned in the Italian, Polish
          or Turkish reports. Congenital dermal melanocytosis is also common in the general population
          of several ancestries, including the one the founding family belongs to, which makes a coincidental
          co-occurrence within one consanguineous sibship entirely plausible. Two things hinge on the
          answer. If the association is real, then PUS3 loss must perturb dermal melanocyte migration
          or retention and the pathograph is missing a node. If it is not, the MONDO label is actively
          misleading and steers curators and clinicians towards the lysosomal storage disorders. Grey
          sclerae, which is plausibly the ocular counterpart of the same melanocytic process, went from
          "characteristic" to 7/21 once a real cohort was assembled - the same deflation may await dermal
          melanocytosis.
        proposed_experiments:
        - experiment_id: exp_pus3_melanocytosis_rephenotyping
          name: Standardised re-phenotyping of the published cohort for dermal melanocytosis
          description: Systematically re-phenotype the existing molecularly confirmed cohort for dermal
            melanocytosis using standardised photographic documentation and HPO coding, with the extent
            and distribution recorded rather than a simple present/absent flag.
        - experiment_id: exp_pus3_melanocytosis_ancestry_control
          name: Ancestry-matched control comparison for dermal melanocytosis
          description: Compare dermal melanocytosis prevalence and extent between PUS3-affected individuals
            and ancestry-matched unaffected relatives or population controls, which is the only design
            that can separate a genuine disease association from an ancestry-linked background rate.
        - experiment_id: exp_pus3_melanocyte_biology
          name: PUS3 function in dermal melanocytes
          description: Assess PUS3 expression and pseudouridine levels in dermal melanocytes, and melanocyte
            migration in a PUS3-depleted model, to test whether a plausible cellular mechanism for the
            pigmentary phenotype exists at all.
      selected_evidence:
        snippet: Gray sclera, which has previously been suggested to be a characteristic feature of PUS3-associated
          phenotypes, was reported in only seven individuals.
        supports: SUPPORT
    origin:
