        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Depletion of tRNA Pseudouridine at Anticodon Positions 38 and 39
        biological_scale: MOLECULAR
        description: Pseudouridine at positions 38 and 39 sits in the anticodon stem loop, the part of
          the tRNA that pairs with the codon. Its extra imino group provides additional hydrogen bonding
          and rigidifies the loop, so its absence is expected to destabilise anticodon stem loop architecture.
          In the founding family the deficit was quantified as almost exactly one missing mole of pseudouridine
          per mole of tRNA-Phe, while every other measured modification of the same tRNA was unchanged,
          establishing that the lesion is specific to the PUS3 site rather than a general collapse of
          tRNA modification.
        biological_processes:
        - preferred_term: tRNA pseudouridine synthesis
          term:
            id: GO:0031119
            label: tRNA pseudouridine synthesis
          modifier: DECREASED
        - preferred_term: tRNA modification
          term:
            id: GO:0006400
            label: tRNA modification
          modifier: DECREASED
      selected_evidence:
        snippet: Since tRNAPhe from LCLs with the Arg435* allele of PUS3 had almost exactly 1 mole/mole
          less Ψ than control LCLs, we infer that the Arg435* allele nearly completely knocks out PUS3
          function due to truncation of the conserved domain and the last 45 amino acids
        supports: SUPPORT
    origin:
