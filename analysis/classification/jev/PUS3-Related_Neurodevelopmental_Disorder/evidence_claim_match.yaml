            term:
              id: MONDO:0014886
              label: severe growth deficiency-strabismus-extensive dermal melanocytosis-intellectual disability
                syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic PUS3 Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: 'The disorder is initiated by inheritance of two damaging PUS3 alleles. The reported
          allelic spectrum is broad and includes nonsense alleles that truncate the protein (the founding
          p.Arg435* allele), frameshift alleles, a splice-region allele, an initiation-codon substitution,
          and missense alleles. Critically, the missense alleles are not a milder mechanistic class: p.Tyr71Cys
          retains essentially normal tRNA binding and catalytic activity when the purified protein is
          assayed, yet behaves as a functional null in cells, so the allelic spectrum converges on one
          outcome rather than producing a hypomorph gradient.'
        genes:
        - preferred_term: PUS3
          term:
            id: hgnc:25461
            label: PUS3
        molecular_functions:
        - preferred_term: tRNA pseudouridine(38/39) synthase activity
          term:
            id: GO:0160154
            label: tRNA pseudouridine(38/39) synthase activity
          modifier: DECREASED
      selected_evidence:
        snippet: 'we identified a homozygous nonsense variant in PUS3; Chr11(GRCh37):g.125763823G>A; NM_031307.3:
          c.1303C>T: p.(Arg435*) that fully segregated with the phenotype in the family as confirmed by
          Sanger sequencing'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
