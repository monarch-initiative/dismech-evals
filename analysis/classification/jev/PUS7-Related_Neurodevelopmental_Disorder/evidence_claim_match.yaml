        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pus7_no_mouse_model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does germline Pus7 loss in the mouse reproduce the human neurodevelopmental phenotype
          at all, and if not, why?
        attaches_to:
        - pathophysiology#Impaired Neuronal Development and Function
        rationale: 'The only in vivo evidence that PUS7 loss produces the behavioural phenotype comes
          from Drosophila, and the only mammalian in vivo evidence is a region-specific adult knockdown
          in mouse infralimbic prefrontal cortex, which models plasticity rather than development. No
          published Pus7-null mouse has been characterised for brain size, growth, or behaviour, even
          though mouse alleles exist. The mismatch matters because the two headline human features, progressive
          microcephaly and growth retardation, have no described animal counterpart at all: Drosophila
          cannot model them, and the mouse has not been asked. Without a mammalian germline model the
          causal step from deregulated translation to failed postnatal brain growth remains an inference.'
        proposed_experiments:
        - experiment_id: exp_pus7_germline_mouse_phenotyping
          name: Deep phenotyping of a germline Pus7-null mouse
          description: Characterise a germline Pus7-null mouse for serial head and brain volume, body
            growth, cortical progenitor dynamics, and home-cage aggression, rather than relying on the
            existing high-throughput phenotyping-pipeline summary, which reports systems that do not obviously
            map onto the human phenotype.
        - experiment_id: exp_pus7_conditional_neural_deletion
          name: Conditional Pus7 deletion to test neuron autonomy of brain growth failure
          description: Delete Pus7 conditionally in neural progenitors versus post-mitotic neurons and
            compare brain-growth outcomes, to determine whether any mammalian brain-size phenotype is
            neuron-autonomous or secondary to systemic growth failure.
      selected_evidence:
        snippet: Crucially, PUS7 knockdown in the ILPFC selectively impaired fear extinction memory formation
          without altering baseline fear expression, establishing a causal link between Ψ-dependent RNA
          processing and activity-dependent synaptic structural remodeling in this microcircuit.
        supports: SUPPORT
