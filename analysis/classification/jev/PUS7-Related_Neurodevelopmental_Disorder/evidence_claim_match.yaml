        biological_scale: MOLECULAR
        description: The disorder is initiated by inheritance of two damaging PUS7 alleles. The reported
          allelic spectrum includes frameshift alleles, nonsense alleles, a deletion of the penultimate
          exon that escapes nonsense-mediated decay but removes the C-terminal catalytic region, and missense
          alleles. Missense alleles appear to behave as hypomorphs, producing a milder phenotype without
          microcephaly or short stature.
        genes:
        - preferred_term: PUS7
          term:
