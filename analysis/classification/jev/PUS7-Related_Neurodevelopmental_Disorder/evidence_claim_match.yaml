      assertion_type: Discussion
      assertion:
        discussion_id: pus7_haematopoietic_discrepancy
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why do PUS7-depleted human haematopoietic stem and progenitor cells show a severe commitment
          defect while PUS7-deficient patients have no reported haematological disease?
        attaches_to:
        - pathophysiology#Failure of tRF-Mediated Restraint of Translation Initiation
        rationale: The tRF arm of PUS7 biology was discovered in haematopoiesis, and PUS7 depletion impairs
          stem cell commitment and is implicated in aggressive myelodysplastic syndrome. Yet no PUS7-deficient
          patient has been reported with cytopenia, marrow failure, or a myeloid neoplasm. Either the
          human requirement is dosage- or context-dependent in a way the depletion experiments do not
          capture, or the haematological phenotype exists and has never been looked for because the patients
          present to neurology and clinical genetics. Resolving this affects how much weight the tRF arm
          should carry in the disease model.
        proposed_experiments:
        - experiment_id: exp_pus7_haematology_ascertainment
          name: Systematic haematological assessment of published PUS7 cohorts
          description: Report full blood counts and, where justified, marrow morphology across the existing
            PUS7 patient cohorts. This distinguishes a genuine absence of haematological phenotype from
            an absence of ascertainment, which is the first thing that must be settled before the discrepancy
            can be interpreted.
        - experiment_id: exp_pus7_tissue_specific_trf_compensation
          name: Tissue-specific comparison of tRF pseudouridylation and TOP mRNA translation
          description: Compare tRNA-derived-fragment pseudouridine levels and translation of 5-prime terminal
            oligopyrimidine mRNAs between patient-derived haematopoietic cells and patient fibroblasts,
            to test whether the haematopoietic compartment compensates for PUS7 loss in a way that fibroblasts
            do not.
      selected_evidence:
        snippet: Remarkably, dysregulation of this posttranscriptional regulatory circuitry impairs hematopoietic
          stem cell commitment and is common to aggressive subtypes of human myelodysplastic syndromes.
        supports: SUPPORT
