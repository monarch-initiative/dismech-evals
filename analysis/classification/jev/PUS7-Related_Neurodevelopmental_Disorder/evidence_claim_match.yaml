      assertion:
        name: PUS1-related myopathy, lactic acidosis and sideroblastic anaemia (MLASA1)
        disease_term:
          preferred_term: MLASA1 (PUS1-related)
          term:
            id: MONDO:0024553
            label: myopathy, lactic acidosis, and sideroblastic anemia 1
        description: 'The first pseudouridine synthase disease described in humans, caused by biallelic
          PUS1 variants (hgnc:15508). Despite sharing the "deficient pseudouridylation" mechanism language
          with PUS7 disease, the phenotype is almost disjoint: a mitochondrial oxidative-phosphorylation
          disorder restricted to skeletal muscle and bone marrow.'
        distinguishing_features:
        - 'Molecular: PUS1 (hgnc:15508) versus PUS7 (hgnc:26033); MONDO:0024553 versus MONDO:0032687.'
        - 'Compartment: PUS1 deficiency is proposed to act through deficient pseudouridylation of MITOCHONDRIAL
          tRNAs, whereas PUS7 acts on cytosolic tRNAs, mRNAs and tRNA-derived fragments. This is the mechanistic
          reason the two phenotypes barely overlap.'
        - 'Clinical: MLASA1 presents with exercise intolerance, myopathy, lactic acidosis and sideroblastic
          anaemia. Intellectual disability, microcephaly and aggression are not part of it, and conversely
          myopathy, lactic acidosis and sideroblastic anaemia have never been reported in PUS7 deficiency.
          A patient with anaemia and a raised lactate is not a PUS7 candidate.'
      selected_evidence:
        snippet: We propose deficient pseudouridylation of mitochondrial tRNAs as an etiology of MLASA.
        supports: SUPPORT
