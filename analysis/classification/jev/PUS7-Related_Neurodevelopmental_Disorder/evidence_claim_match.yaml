      assertion:
        name: Loss of 7SK snRNA Pseudouridylation and Enhanced Pol II Elongation
        biological_scale: MOLECULAR
        description: 'Loss of PUS7 leaves 7SK snRNA hypo-pseudouridylated, which releases the positive
          transcription elongation factor b complex from 7SK, raises serine-2 phosphorylation of the RNA
          polymerase II C-terminal domain, and enhances transcription elongation. This is a transcription-level
          rather than a translation-level consequence of the same enzymatic deficit. It is included because
          it is mechanistically established for PUS7 loss, but its relevance to the neurodevelopmental
          phenotype is entirely untested: the work was done in colorectal cancer cells, and no patient
          tissue has been examined.'
        biological_processes:
        - preferred_term: regulation of transcription elongation by RNA polymerase II
          term:
            id: GO:0034243
            label: regulation of transcription elongation by RNA polymerase II
          modifier: INCREASED
      selected_evidence:
        snippet: PUS7 loss leads to hypo-pseudouridylation of 7SK, which promotes dissociation of the
          positive transcription elongation factor b (P-TEFb) complex from 7SK. The release of P-TEFb
          from 7SK increases serine 2 phosphorylation (Ser2P) in the RNA Pol II C-terminal domain and
          enhances transcription elongation.
        supports: SUPPORT
