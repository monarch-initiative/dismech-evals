        status: CANONICAL
        description: The default explanatory model. Loss of PUS7 removes pseudouridine from cytosolic
          tRNAs, from PUS7-dependent mRNAs, and from the tRNA-derived fragments that hold the translation
          initiation complex in check. The convergent consequence is loss of translational homeostasis,
          demonstrated directly in PUS7-deficient patient fibroblasts, and the developing brain is the
          tissue least able to tolerate it. Every edge in this entry that is not explicitly assigned to
          another hypothesis group belongs to this model.
