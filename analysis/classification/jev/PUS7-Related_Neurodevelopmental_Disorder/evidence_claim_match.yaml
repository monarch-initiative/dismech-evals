            growth, audiometry, behavioural, and adaptive-function measures on genotype-confirmed individuals,
            with the explicit aim of extending observation past adolescence.
        - experiment_id: exp_pus7_family_recontact
          name: Recontact of previously published PUS7 families
          description: Recontact the published families, several of which were reported five or more years
            ago, to obtain adolescent and adult follow-up. This is the fastest available route to any
            adult data at all and requires no new ascertainment.
      selected_evidence:
        snippet: nine patients ranged in age from 2 to 18 years old
        supports: SUPPORT
