              label: intellectual developmental disorder with abnormal behavior, microcephaly, and short
                stature
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Activity-Dependent Synaptic Remodelling
        biological_scale: CELLULAR
        description: A distinct, more disease-proximal neuronal mechanism than the developmental one.
          In mouse infralimbic prefrontal cortex, learning drives pseudouridine deposition on exons of
          synaptic regulatory genes and upregulation of synaptogenic transcripts, and PUS7 is required
          for this. Knocking PUS7 down in that region selectively blocks extinction learning while leaving
          baseline behaviour intact, which shows the requirement is for plasticity rather than for maintenance.
          This provides a candidate substrate for the cognitive and behavioural phenotype that is separable
          from the growth phenotype. It is mouse knockdown in adult cortex, not a germline model of the
          human disorder, so it is a mechanistic analogy and not a demonstration.
        biological_processes:
        - preferred_term: regulation of synapse structure or activity
          term:
            id: GO:0050803
            label: regulation of synapse structure or activity
          modifier: DECREASED
        - preferred_term: learning
          term:
            id: GO:0007612
            label: learning
          modifier: DECREASED
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: Crucially, PUS7 knockdown in the ILPFC selectively impaired fear extinction memory formation
          without altering baseline fear expression, establishing a causal link between Ψ-dependent RNA
          processing and activity-dependent synaptic structural remodeling in this microcircuit.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/12
      evidence_path: /pathophysiology/12/evidence/0
      context_paths:
