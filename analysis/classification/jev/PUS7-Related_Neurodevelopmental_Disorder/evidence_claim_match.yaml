                stature
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pus7_microcephaly_causal_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what cellular route does deregulated translation reduce postnatal brain growth in PUS7
          deficiency?
        attaches_to:
        - pathophysiology#Impaired Postnatal Brain Growth
        rationale: The molecular defect and the clinical endpoint are both well established, but the step
          between them is entirely inferred. There is no evidence in any human or model system for neural
          progenitor pool depletion, altered cell cycle exit, increased apoptosis, or reduced neuronal
          arborisation in PUS7 deficiency. The published framing of the link is explicitly hedged, using
          the word "presumably". Because brain MRI architecture is normal in most patients, the deficit
          is one of growth rather than malformation, which narrows the candidate mechanisms but does not
          identify them. No iPSC-derived neural or organoid model of PUS7 deficiency exists.
        proposed_experiments:
        - experiment_id: exp_pus7_ipsc_neural_organoid
          name: PUS7-null iPSC-derived neural progenitors and cortical organoids
          description: Generate PUS7-null induced pluripotent stem cell lines and differentiate them to
            neural progenitors and cortical organoids, measuring progenitor proliferation, cell-cycle
            exit, apoptosis, and organoid size against isogenic controls. No such model currently exists,
            and it is the most direct test of whether the microcephaly reflects progenitor pool depletion.
        - experiment_id: exp_pus7_neural_ribosome_profiling
          name: Ribosome profiling in PUS7-null neural progenitors
          description: Perform ribosome profiling in PUS7-null neural progenitors to identify which transcripts
            change translational efficiency, and test specifically whether any are established microcephaly
            genes. This would convert the inferred translation-to-brain-growth link into a named set of
            effectors.
      selected_evidence:
        snippet: We and others have previously emphasized the predilection of Mendelian diseases caused
          by tRNA modification genes to CNS involvement and how this suggests the vulnerability of the
          brain to any perturbation of tRNA modification, presumably through its deleterious effect on
          protein synthesis
        supports: SUPPORT
    origin:
