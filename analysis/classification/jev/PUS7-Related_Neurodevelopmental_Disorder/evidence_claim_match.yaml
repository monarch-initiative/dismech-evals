          disease_term:
            preferred_term: PUS7-related neurodevelopmental disorder
            term:
              id: MONDO:0032687
              label: intellectual developmental disorder with abnormal behavior, microcephaly, and short
                stature
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: PUS7L-related neurodevelopmental disorder
        description: PUS7L (hgnc:25276) is the paralogue of PUS7 and is a separate gene. A patient with
          severe global developmental delay and epilepsy carrying a homozygous truncating PUS7L variant
          was noted in passing by the same group that characterised PUS7 disease. Because the gene symbols
          differ by a single trailing character, this is a high-risk symbol-level confusion, distinct
          from the mechanism-level confusion posed by PUS1 and PUS3.
        distinguishing_features:
        - 'Molecular: PUS7L is hgnc:25276, PUS7 is hgnc:26033. They are distinct paralogous genes at distinct
          loci, and PUS7L has its own tRNA targets, mapped in PMID:41136621.'
        - 'Clinical: the reported PUS7L phenotype prominently included epilepsy, whereas PMID:30778726
          positively asserts the LACK of epilepsy as a consistent feature of PUS7 deficiency. Seizures
          should therefore push a differential toward PUS7L, not PUS7.'
        notes: Deliberately left UNBOUND. `runoak -i sqlite:obo:mondo relationships --direction down HGNC:25276`
          returns no rows, and a MONDO label search for PUS7L returns nothing, so there is no MONDO disease
          term for a PUS7L-related disorder to bind to. Binding a generic neurodevelopmental-disorder
          term here would assert an entity that does not exist in the ontology. The gene identity is instead
          carried in the description and distinguishing features. When MONDO mints a PUS7L disease class
          this record should be bound.
      selected_evidence:
        snippet: Through this approach, we uncovered previously unknown targets of several PUS enzymes,
          including RPUSD1, RPUSD2, PUS3, PUSL1 and PUS7L.
        supports: SUPPORT
