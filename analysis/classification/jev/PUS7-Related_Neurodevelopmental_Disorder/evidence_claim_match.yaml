        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide reported literature
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: No population-based prevalence study exists. The published case count is the only defensible
          measure. PMID:42226002 (2026) states that only 16 patients had been described since the first
          report in 2018 and reviews 17 cases including its own; PMID:42249560 (2026) adds 13 further
          patients carrying 15 new variants. The cumulative published total is therefore about 30 individuals
          worldwide, which places the disorder in the ultra-rare band. No Orphanet prevalence class is
          adopted, because no Orphanet entity for this disorder exists to adopt one from. An earlier revision
          of this note asserted "Orphanet codes the disorder as ORPHA:544510"; that identifier was unsourced
          and is retracted here. It appears nowhere in the deep-research report or its citations sidecar,
          and MONDO:0032687 carries no ORPHA xref at all - its cross-references are DOID:0081265, GARD:0018516,
          MEDGEN:1675423, OMIM:618342 and UMLS:C5193039. This matches the entry-level notes, which record
          that an OLS4 search of ORDO for PUS7 returns zero hits. Because the claim sat in prose rather
          than in a snippet, the reference validator could not have caught it.
      selected_evidence:
        snippet: Since the first report in 2018, only 16 patients have been described.
        supports: SUPPORT
