              label: intellectual developmental disorder with abnormal behavior, microcephaly, and short
                stature
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Smith-Magenis syndrome
        disease_term:
          preferred_term: Smith-Magenis syndrome
          term:
            id: MONDO:0008434
            label: Smith-Magenis syndrome
        description: The closest non-genetic-family phenocopy on behavioural grounds. Smith-Magenis syndrome,
          caused by the recurrent 17p11.2 deletion or by intragenic RAI1 variants, combines intellectual
          disability, sleep disturbance, aggression, self-injurious behaviour, motor stereotypies and
          short stature. That is a near-complete overlap with the "less common but more peculiar" cluster
          that PMID:42226002 proposes as the discriminating signature of PUS7 deficiency, which means
          the very features that are supposed to raise suspicion of PUS7 disease also describe Smith-Magenis.
          This differential exists because the behavioural gestalt collides, not because the genes or
          mechanisms are related.
        distinguishing_features:
        - 'Molecular: a 17p11.2 microdeletion or heterozygous RAI1 variant, autosomal dominant and usually
          de novo, versus biallelic recessive PUS7. Chromosomal microarray detects the common deletion
          and will be normal in PUS7 disease.'
        - 'Sleep: Smith-Magenis has a characteristic inverted circadian melatonin rhythm with the classic
          phenotype of daytime sleepiness and night waking. The sleep disturbance reported in PUS7 deficiency
          is a single-case observation with no described circadian signature.'
        - 'Head size: progressive postnatal microcephaly is a core PUS7 feature and is not characteristic
          of Smith-Magenis, so serial head-circumference plotting is a cheap discriminator.'
        - 'Visceral involvement: Smith-Magenis includes craniofacial, skeletal and visceral anomalies.
          PUS7 deficiency has mild non-specific facial dysmorphism and no visceral anomalies.'
      selected_evidence:
        snippet: Smith-Magenis syndrome (SMS) is a complex syndrome involving intellectual disabilities,
          sleep disturbance, behavioural problems, and a variety of craniofacial, skeletal, and visceral
          anomalies.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/5
      evidence_path: /differential_diagnoses/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20932317
      reference_title: 'Frameshift mutation hotspot identified in Smith-Magenis syndrome: case report
        and review of literature.'
      evidence_source: HUMAN_CLINICAL
      explanation: States the overlapping triad of intellectual disability, sleep disturbance and behavioural
        problems that makes this a genuine clinical differential, and the visceral involvement that separates
        it.
