        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: PUS3-related intellectual disability and microcephaly syndrome
        disease_term:
          preferred_term: PUS3-related intellectual disability syndrome (MRT55)
          term:
            id: MONDO:0014886
            label: severe growth deficiency-strabismus-extensive dermal melanocytosis-intellectual disability
              syndrome
        description: The single most confusable entity. PUS3 (hgnc:25461) is another stand-alone pseudouridine
          synthase whose loss causes an autosomal recessive intellectual disability and microcephaly syndrome
          (MONDO:0014886, OMIM:617051, also known as MRT55). Both disorders are described in the literature
          as caused by "impaired pseudouridylation" and both were characterised by overlapping author
          groups, so gene-agnostic reading of that phrase will merge them.
        distinguishing_features:
        - 'Molecular: PUS3 (hgnc:25461) versus PUS7 (hgnc:26033). Different genes, different MONDO entities,
          different OMIM numbers (617051 versus 618342).'
        - 'Substrate position: PUS3 isomerises uridine at tRNA positions 38 and 39, whereas PUS7 acts
          at position 13 (and at position 35 of pre-tRNA-Tyr). A tRNA modification assay therefore distinguishes
          them biochemically, and this is the cleanest functional discriminator.'
        - 'Clinical: the PUS3 MONDO entity carries severe growth deficiency, strabismus and extensive
          dermal melanocytosis as label-level features. Dermal melanocytosis has never been reported in
          PUS7 deficiency, and the PUS7 behavioural signature of very-early-onset aggression is not part
          of the PUS3 label.'
      selected_evidence:
        snippet: Consistent with the known role of Pus3 in isomerizing uracil to pseudouridine at positions
          38 and 39 in tRNA, we found a significant reduction in this post-transcriptional modification
          of tRNA in patient cells.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27055666
      reference_title: A homozygous truncating mutation in PUS3 expands the role of tRNA modification
        in normal cognition.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the position-38/39 substrate specificity that biochemically separates PUS3
        disease from the position-13 defect of PUS7 disease.
