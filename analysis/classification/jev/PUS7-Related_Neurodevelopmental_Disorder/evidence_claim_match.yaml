          name: PUS7-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: PUS7-related neurodevelopmental disorder
            term:
              id: MONDO:0032687
              label: intellectual developmental disorder with abnormal behavior, microcephaly, and short
                stature
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pus7_genotype_phenotype_unresolved
        kind: CONTROVERSY
        status: OPEN
        prompt: Do PUS7 missense alleles behave as hypomorphs that spare growth and head circumference,
          or as complete loss of function indistinguishable from truncating alleles?
        attaches_to:
        - pathophysiology#Biallelic PUS7 Loss-of-Function Variants
        rationale: Two published positions conflict. Darvish and colleagues propose that their missense
          family's milder phenotype, without microcephaly or short stature, reflects a hypomorphic allele
          in contrast to the null truncating alleles. Against that, the missense allele in the Shaheen
          cohort produced severe microcephaly and behaved as a complete loss of function in yeast complementation.
          A truncating-versus-missense severity rule therefore cannot currently be given to families.
          The 13-patient, 15-variant cohort of PMID:42249560 is framed by its own authors as improving
          genotype-phenotype correlation and is the priority source for resolving this, but its full text
          was not accessible during this curation pass.
        proposed_experiments:
        - experiment_id: exp_pus7_uniform_missense_functional_assay
          name: Uniform functional assay of all reported PUS7 missense alleles
          description: Assay every reported PUS7 missense allele in the same yeast complementation and
            tRNA pseudouridine-13 systems, so that residual catalytic activity is measured on one scale
            rather than being inferred backwards from clinical severity. This is the only way to test
            the hypomorph hypothesis independently of the phenotype it is meant to explain.
        - experiment_id: exp_pus7_pooled_genotype_phenotype_analysis
          name: Pooled genotype-phenotype analysis including the 2026 cohort
          description: Extract per-variant phenotype data from the 13-patient, 15-variant cohort of PMID:42249560
            once full text is accessible, pool it with the earlier cohorts, and test the missense-versus-truncating
            severity hypothesis across the combined series.
      selected_evidence:
        snippet: The absence of highly extreme phenotypes such as short stature or microcephaly in this
          family might reflect genotype–phenotype correlation, since this family presented with a PUS7
          missense mutation that may be hypomorphic, while previously reported families carried nonsense
          or frameshift mutations that may cause loss of function.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/4
