        - 'Biochemical nuance: HPRT1 protein was mildly REDUCED in the PUS7 siblings despite a normal
          HPRT1 gene, attributed to deregulated translation. A protein-level or enzyme-activity assay
          may therefore be mildly abnormal in PUS7 disease and should not be read as confirming Lesch-Nyhan.'
        - 'Clinical: microcephaly, short stature and early-onset aggression point to PUS7; the dystonia,
