  acbb3df8b2227cb0114812dafcc5cf23ae4729b542b2b00b95846142106b4aad:
    claim:
      about:
        disease:
          name: PUS7-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: PUS7-related neurodevelopmental disorder
            term:
              id: MONDO:0032687
              label: intellectual developmental disorder with abnormal behavior, microcephaly, and short
                stature
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other tRNA-modification intellectual disability syndromes
        disease_term:
          preferred_term: ADAT3-related intellectual disability-strabismus syndrome
          term:
            id: MONDO:0014119
            label: intellectual disability-strabismus syndrome
        description: PUS7 disease sits inside a growing class of autosomal recessive intellectual disability
          syndromes caused by loss of a single tRNA modification, all of which share intellectual disability
          with variable microcephaly and short stature and are therefore clinically indistinguishable
          without sequencing. The record is bound to the ADAT3 entity (MONDO:0014119, adenosine-to-inosine
          editing at wobble position 34), which is the most common cause of autosomal recessive intellectual
          disability in Arabia and is therefore the highest-prior alternative in the very populations
          where PUS7 families have been ascertained.
        distinguishing_features:
        - 'Molecular: ADAT3 (hgnc:25151) wobble-position inosine editing, NSUN2 (hgnc:25994, MONDO:0012613)
          5-methylcytosine, TRMT10A 1-methylguanosine at position 9, WDR4 7-methylguanosine at position
          46, THUMPD1 tRNA acetylation. None of these is a pseudouridine synthase, and none produces a
          position-13 pseudouridine defect.'
        - 'Assay: the discriminating test is which modification is missing. PUS7 disease shows loss of
          pseudouridine at tRNA position 13 with other pseudouridine positions in the same tRNAs intact.'
        - 'Clinical: strabismus is a label-level feature of the ADAT3 entity and is not reported in PUS7
          deficiency; conversely very-early-onset aggression is the PUS7 signature.'
        notes: One record is used for the class rather than one per gene, because the shared diagnostic
          logic (sequence the child; identify which tRNA modification is absent) is identical for all
          of them and duplicating it per gene would add length without adding discrimination. The bound
          term is the ADAT3 entity; NSUN2 disease is MONDO:0012613, and dismech already carries a separate
          entry for the THUMPD1-related disorder. The class-level point is supported by the quoted sentences,
          which name the class explicitly.
      selected_evidence:
        snippet: For example, the most common form of autosomal recessive ID in Arabia was found to be
          due to mutation of ADAT3, which edits adenosine to inosine at the wobble position 34 of mature
          tRNA
        supports: SUPPORT
    origin:
