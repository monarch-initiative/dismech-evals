          neurodevelopmental disorder?
        attaches_to:
        - pathophysiology#Cognitive and Behavioural Dysfunction
        rationale: Roughly 30 patients have been published and the oldest are adolescents; one cohort
          states its patients ranged from 2 to 18 years. No adult patient has been described, no natural-history
          study or registry exists, and no deaths have been reported. Two features are documented as progressive
          into adolescence, head circumference and hearing, and behaviour worsens over the same period,
          so extrapolating a stable adult course from paediatric cross-sections is not safe. Families
          cannot currently be given prognostic information beyond childhood.
        proposed_experiments:
