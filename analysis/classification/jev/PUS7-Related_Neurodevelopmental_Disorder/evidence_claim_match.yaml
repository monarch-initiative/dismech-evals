            variant_origin: GERMLINE
            notes: 'PUS7 (7q22.3, MIM 616261) encodes the RNA-independent pseudouridine synthase 7, a
              stand-alone TruD-family enzyme that isomerises uridine to pseudouridine without a guide
              RNA. The protein contains an N-terminal R3H domain and a C-terminal TruD (PseudoU_synth_ScPUS7)
              catalytic domain spanning approximately residues 370 to 580. All reported disease alleles
              are biallelic and either truncate the protein before the catalytic domain, delete the C-terminus,
              or substitute conserved residues within or near the TruD domain. Inheritance is autosomal
              recessive; the structured Inheritance record is at disease level.

              Gene identity was verified against the MONDO gene-association relation (`RO:0004003 HGNC:26033
              ! PUS7`) and against the HGNC record (`hgnc:26033`, omim:616261). This is deliberately distinct
              from the paralogue PUS7L (hgnc:25276) and from the family members PUS1 (hgnc:15508) and
              PUS3 (hgnc:25461), each of which causes a separate disease; see differential_diagnoses.
              Note that MIM 616261 is the PUS7 GENE entry, whereas MIM 618342 is the DISEASE entry (IDDABS)
              that MONDO:0032687 cross-references; PMID:33100873 quotes both numbers.'
