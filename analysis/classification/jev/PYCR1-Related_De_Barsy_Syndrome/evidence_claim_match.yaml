  899941ee8b94d4e80efcb402be4e4a17ffb06d0680425947f6f9b74318b228dc:
    claim:
      about:
        disease:
          name: PYCR1-Related De Barsy Syndrome
          disease_term:
            preferred_term: PYCR1-related de Barsy syndrome
            term:
              id: MONDO:0013755
              label: PYCR1-related de Barsy syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: PYCR1
        gene_term:
          preferred_term: PYCR1
          term:
            id: hgnc:9721
            label: PYCR1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: PYCR1 (17q25.3) encodes mitochondrial pyrroline-5-carboxylate reductase 1, which reduces
          delta-1-pyrroline-5-carboxylate to proline with oxidation of NAD(P)H. Reported disease alleles
          include missense, splice-site, nonsense, frameshift and whole-gene deletion variants; most cluster
          in exons 4 to 6. Missense alleles reduce protein abundance or catalytic activity, and some are
          predicted to interfere with PYCR1 multimerization. Patients with variants in the first two exons
          had lower average clinical scores and absent or mild intellectual disability, but the correlation
          is imperfect.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_ca242cd8-1f57-4c7b-ba97-5ec0c97b425b-2020-05-21T191607.864Z
          subtype: ARCL2B
          notes: ClinGen classified PYCR1 for autosomal recessive cutis laxa type 2B (MONDO:0013051),
            the has_subtypes row of this entry. No ClinGen record names MONDO:0013755 itself.
        variants:
        - name: c.797G>A (p.Arg266Gln)
          description: Homozygous missense variant at the last nucleotide of exon 6 found in ARCL2 families
            from an eastern Canadian subpopulation isolate. It causes skipping of exon 6, deleting the
            reductase functional domain and shifting the downstream reading frame.
        - name: c.559G>A (p.Ala187Thr)
          description: Homozygous missense variant in a Chinese child with severe developmental delay.
            In transfected HEK293T cells the mutant protein was less abundant and had about half the wild-type
            reductase activity.
      selected_evidence:
        snippet: Homozygosity mapping in several kindreds with ARCL identified a candidate region on chromosome
          17q25. By high-throughput sequencing of the entire candidate region, we detected disease-causing
          mutations in the gene PYCR1.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19648921
      reference_title: Mutations in PYCR1 cause cutis laxa with progeroid features.
      evidence_source: HUMAN_CLINICAL
      explanation: The founding gene-discovery study identifies PYCR1 mutations in ARCL kindreds.
