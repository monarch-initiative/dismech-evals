            id: MONDO:0013051
            label: autosomal recessive cutis laxa type 2B
        description: The ARCL2B label covers PYCR1-related patients described as having cutis laxa of
          variable severity, intrauterine growth restriction, congenital hip dislocation, joint hyperlaxity,
          wrinkling of the dorsum of the hands and feet and progeroid facial features, with frequent hypotonia
          and developmental delay. It overlaps clinically and genetically with de Barsy syndrome (ARCL3B);
          the same PYCR1 genotypes have received either diagnosis.
      selected_evidence:
        snippet: Here we describe 33 patients with PYCR1-related ARCL from 27 families with initial diagnoses
          varying between wrinkly skin syndrome, gerodermia osteodysplastica, De Barsy syndrome or more
          severe progeria syndromes.
        supports: SUPPORT
