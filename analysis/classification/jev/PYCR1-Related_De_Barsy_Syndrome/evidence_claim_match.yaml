        description: ATP6V0A2-related cutis laxa shares neonatal skin laxity, hypotonia and developmental
          delay. It has abnormal glycosylation and cobblestone brain malformation, where PYCR1 disease
          has normal biochemistry and callosal dysgenesis.
        distinguishing_features:
        - Abnormal glycosylation biochemistry supports ARCL2A; it is uninformative for PYCR1 disease.
        - Cobblestone cortical dysgenesis on MRI favours ARCL2A; corpus-callosum dysgenesis or agenesis
          favours PYCR1 disease.
