          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Biallelic PYCR1 pathogenic variants, homozygous or compound heterozygous, cause the
          disorder. Heterozygous parents and sibs are asymptomatic; when both parents are heterozygous
          each sib has a 25% chance of being affected.
      selected_evidence:
        snippet: If both parents are known to be heterozygous for a pathogenic variant, each sib of an
          individual with PYCR1- or ALDH18A1-related ARCL has at conception a 25% chance of being affected,
          a 50% chance of being heterozygous, and a 25% chance of being unaffected and not a carrier.
          Heterozygous sibs of a proband with PYCR1-related ARCL are asymptomatic.
        supports: SUPPORT
