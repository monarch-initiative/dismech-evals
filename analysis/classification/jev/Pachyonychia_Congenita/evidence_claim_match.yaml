      assertion:
        name: Loss of Keratinocyte Mechanical Resilience
        conforms_to: keratin_intermediate_filament_fragility#Loss of Keratinocyte Mechanical Resilience
        biological_scale: CELLULAR
        description: 'Palmoplantar keratinocytes carrying a disrupted keratin network tolerate friction,
          pressure and shear poorly, so lesions form precisely at weight-bearing pressure points. Importantly,
          and unlike the KRT1/KRT10 and KRT9 keratinopathies, PC-associated keratoderma is non-epidermolytic:
          frank cytolysis of the differentiating epidermis is not the histological hallmark, and the mechanism
          is better described as reduced mechanical resilience plus derailed stress signalling than as
          simple cell lysis. Blistering can occur beneath the callus but is not the defining lesion.'
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        locations:
        - preferred_term: skin of sole of pes
          term:
            id: UBERON:0013778
            label: skin of sole of pes
        - preferred_term: nail bed
          term:
            id: UBERON:0005273
            label: nail bed
        mechanism_confidence: PROVISIONAL
        notes: The non-epidermolytic character of PC keratoderma is why this node is kept distinct from
          the downstream hyperproliferation/barrier node, following the node structure used in KRT1_Keratinopathies.yaml
          and the point raised in dismech#3401 that keratin network collapse and downstream hyperproliferation
          are separate mechanistic claims.
      selected_evidence:
        snippet: 'PC is diagnosed clinically alongside identification of a heterozygous pathogenic mutation
          in one of five keratin genes: KRT6A, KRT6B, KRT6C, KRT16, or KRT17.'
        supports: SUPPORT
