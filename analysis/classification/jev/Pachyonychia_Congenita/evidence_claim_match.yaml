      assertion_type: AnimalModel
      assertion:
        name: Krt16-null mouse
        species: Mouse
        genotype: Krt16-/- (null)
        background: C57BL/6; also transferred to FVB/N
        genes:
        - preferred_term: KRT16
          term:
            id: hgnc:6423
            label: KRT16
        publication: PMID:22336941
        description: The principal animal model of PC-associated palmoplantar keratoderma. Mice null for
          Krt16 spontaneously develop oral lesions and PPK-like hyperkeratotic calluses on fore and hind
          paws that impair walking, and reproduce the sequence of pre-lesional differentiation failure,
          oxidative stress with hypoactive Keap1-Nrf2 signalling, and lesional loss of epidermal homeostasis.
        modeled_mechanisms:
        - target: Loss of Keratinocyte Mechanical Resilience
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Loss of the K16 filament subunit produces weight-bearing-site callus and compromised
            ambulation, mirroring the human lesion distribution.
          limitations: The mouse phenotype arises from complete loss of function inherited recessively,
            whereas human PC is a dominant-negative disease in heterozygotes — so the model tests the
            consequence of losing functional K16 filaments, not the consequence of a poisoned filament
            network.
        - target: Defective Terminal Differentiation of Volar Keratinocytes
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Pre-lesional loss of Krt9 and pleiotropic terminal differentiation defects in footpad
            keratinocytes, mirrored in published human PC PPK expression data.
          limitations: Demonstrated in the null background; whether human dominant-negative alleles produce
            the same magnitude of KRT9 loss is not established.
        - target: Oxidative Stress and Hypoactive Keap1-NRF2 Signalling
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Oxidative stress and failure of NRF2-dependent glutathione synthesis precede lesion
            onset; Nrf2 ablation accelerates and topical NRF2 activation prevents the keratoderma, and
            hypophosphorylated NRF2 is confirmed in human PC lesional skin.
          limitations: The preventive effect of sulforaphane is shown in mice only; it has not been shown
            to prevent or reverse keratoderma in people with PC.
      selected_evidence:
        snippet: We reviewed the relevant literature with a particular focus on the Krt16 null mouse,
          which spontaneously develops footpad lesions that mimic several aspects of PC-associated PPK.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
