      assertion_type: Treatment
      assertion:
        name: Oral Statin Therapy
        description: 'Off-label oral statins, proposed to downregulate KRT6A expression via STAT1. Case
          reports suggested benefit in KRT6A-associated disease, but a subsequent series of six adults
          with KRT16 or KRT17 variants found no significant improvement in plantar calluses or pain, and
          all patients discontinued for insufficient efficacy. Recorded here as a genotype-limited strategy
          with negative evidence outside KRT6A. No `target_mechanisms` link is asserted: the only quotable
          clinical evidence is negative, and the TreatmentEffectEnum has no value for "no effect", so
          claiming an INHIBITS edge would overstate the case.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: Our findings indicate that oral statin therapy may offer limited benefit in KRT16/KRT17-pEDD-PC
          and suggest the potential importance of early intervention and genotype-specific therapeutic
          strategies.
        supports: SUPPORT
