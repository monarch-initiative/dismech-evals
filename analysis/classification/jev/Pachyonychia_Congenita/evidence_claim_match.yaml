          name: Pachyonychia Congenita
          disease_term:
            preferred_term: pachyonychia congenita
            term:
              id: MONDO:0016471
              label: pachyonychia congenita
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pc_nosology_genotypic_supersedes_eponymous
        kind: OPEN_QUESTION
        status: RESOLVED
        prompt: Should pachyonychia congenita be subtyped by the eponymous PC-1 (Jadassohn-Lewandowsky)
          / PC-2 (Jackson-Lawler) split or by causal keratin gene?
        rationale: 'Registry data showed that most keratin subgroups express a mixed constellation of
          the findings historically assigned to PC-1 and PC-2, so the eponymous categories cut across
          the causal genes and mislead on prognosis. Both large genotyped cohorts (n = 254 and n = 815)
          concluded in favour of a genotypic classification, and dismech follows that: has_subtypes is
          organised as PC-K6a/PC-K6b/PC-K6c/PC-K16/PC-K17. The eponyms are retained only as synonyms on
          the disease entry.'
        resolution_note: Resolved in favour of the genotypic classification. Note that MONDO's numbered
          children still attach "Jadassohn-Lewandowsky" to the KRT16 class (MONDO:0008173) alone, which
          is a simplification of the historical usage (PC-1 spanned KRT6A and KRT16; PC-2 spanned KRT6B
          and KRT17). The MONDO terms are bound on their single-gene definitions, not on the eponyms.
      selected_evidence:
        snippet: We propose a new classification for PC based on the specific keratin gene affected to
          help clinicians improve their diagnostic and prognostic accuracy, correct spurious associations,
          and improve therapeutic development.
        supports: SUPPORT
