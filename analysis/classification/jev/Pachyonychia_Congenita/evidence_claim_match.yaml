              label: pachyonychia congenita
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pc_pain_not_proportional_to_keratoderma
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What determines plantar pain severity in pachyonychia congenita, given that it is not
          proportional to the extent of hyperkeratosis?
        attaches_to:
        - pathophysiology#Plantar Nociceptive and Neuropathic Pain
        rationale: Plantar pain is the dominant disability in PC and dictates treatment goals, yet its
          severity tracks poorly with callus extent. Candidate contributors include subepidermal blistering
          beneath the callus, nociceptive input from tissue damage, neuropathic change in cutaneous sensory
          afferents, neurovascular structures within the callus, and TRPV3/EGFR-driven sensitisation.
          Quantitative sensory testing supports a neuropathic component but does not identify its cause,
          and the sensory phenotype does not differ by causal gene. Until this is resolved, dismech deliberately
          keeps pain as its own mechanism node rather than as a severity qualifier on the keratoderma
          node, since a therapy that thins the callus is not thereby predicted to relieve the pain.
        proposed_experiments:
        - experiment_id: pc_ienfd_lesional_vs_nonlesional
          name: Intraepidermal nerve fibre quantification in PC lesional vs non-lesional plantar skin
          description: Skin biopsy with PGP9.5 immunostaining to test whether small-fibre density or morphology
            in lesional plantar skin correlates with pain scores independently of callus thickness.
        - experiment_id: pc_neurovascular_structures_vs_qst
          name: Correlation of neurovascular structure burden with quantitative sensory testing
          description: Prospective study relating the number and distribution of intracallus neurovascular
            structures to mechanical hyperalgesia thresholds and DN4 scores.
      selected_evidence:
        snippet: Mechanisms leading to pain and painful palmoplantar keratoderma in PC remain elusive.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
