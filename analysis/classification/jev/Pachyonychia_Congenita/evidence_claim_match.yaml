            term:
              id: MONDO:0016471
              label: pachyonychia congenita
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pc_krt16_null_mouse_dominant_negative_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the recessively inherited Krt16-null mouse model the same disease mechanism as dominant-negative
          keratin variants in human pachyonychia congenita?
        attaches_to:
        - pathophysiology#Loss of Keratinocyte Mechanical Resilience
        - pathophysiology#Keratin Intermediate Filament Network Disruption
        rationale: Nearly all mechanistic insight into PC keratoderma — the pre-lesional differentiation
          defect, the KRT9 loss, the NRF2/oxidative-stress axis and the sulforaphane rescue — comes from
          mice lacking Krt16 entirely, a recessive loss-of-function state. Human PC is caused by heterozygous,
          dominant-negative alleles in which a mutant subunit is present and poisons the network. The
          model's own authors note that their findings call into question a purely gain-of-function view
          of PC keratoderma and emphasise the role of genetic modifiers. Whether the differentiation/redox
          cascade is equally engaged when a poisoned filament network is present, rather than no K16 at
          all, is unresolved, and it matters directly for whether NRF2-directed therapy will translate.
          Partial reassurance exists — hypophosphorylated NRF2 was confirmed in human PC lesional skin
          — but the rescue arm remains mouse-only.
        proposed_experiments:
        - experiment_id: pc_krt16_dominant_negative_knockin_mouse
          name: Knock-in mouse carrying a human dominant-negative Krt16 allele
          description: Generate a heterozygous knock-in of a recurrent human KRT16 PC allele and test
            whether the pre-lesional KRT9 loss and NRF2 hypoactivity of the null model are reproduced.
        - experiment_id: pc_krt9_nrf2_readouts_human_biopsies
          name: KRT9 and NRF2 pathway readouts in genotyped human PC plantar biopsies
          description: Compare KRT9 expression and NRF2 phosphorylation state across PC-K6a, PC-K16 and
            PC-K17 lesional skin to test whether the mouse cascade is genotype-independent in humans.
      selected_evidence:
        snippet: Our findings call into question the view that PC-related PPK arises exclusively as a
          gain-of-function on account of dominantly acting mutated keratins, and highlight the key role
          of modifiers in the clinical heterogeneity of PC symptoms.
        supports: SUPPORT
