  e6ddaf15e0a1eb9fa1b6fdeef1f9186e43036360ecd63bc885cf1b8cd528de09:
    claim:
      about:
        disease:
          name: Pachyonychia Congenita
          disease_term:
            preferred_term: pachyonychia congenita
            term:
              id: MONDO:0016471
              label: pachyonychia congenita
        context: []
      assertion_type: Treatment
      assertion:
        name: TD101 Mutation-Specific siRNA
        description: 'TD101 (K6a_513a.12) is an allele-specific small interfering RNA designed to silence
          the KRT6A N171K mutant transcript while sparing wild-type K6a mRNA — the therapeutic embodiment
          of the dominant-negative mechanism. It was tested by intradermal injection into plantar calluses
          in a 17-week, prospective, double-blind, split-body (opposite feet), vehicle-controlled, dose-escalation
          phase Ib trial. IMPORTANT EVIDENCE CAVEAT: that trial enrolled a SINGLE PATIENT (n = 1). Callus
          regression was reported on the siRNA-treated foot only and no adverse events occurred, and the
          study is historically notable as the first clinical use of siRNA in human skin and the first
          targeting a dominant-negative mutant allele — but it is an n-of-1 observation and must not be
          read as established efficacy. The authors themselves framed the result as warranting further
          study. Development did not proceed to a larger trial, in part because intradermal needle administration
          to PC lesions is intensely painful.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        therapeutic_modality: SIRNA
        oligonucleotide_details:
          oligonucleotide_mechanism: RNAI_KNOCKDOWN
          target_gene:
            preferred_term: KRT6A
            term:
              id: hgnc:6443
              label: KRT6A
          target_transcript: KRT6A mRNA carrying the N171K (c.513A>G) mutant allele
          conjugation: UNCONJUGATED
          delivery_platform: UNFORMULATED
        notes: 'TD101 is the canonical dismech example of an allele-specific silencing therapy anchored
          to a dominant-negative mechanism node. Its evidence base is deliberately recorded as PARTIAL:
          the human data are a single-patient trial (PMID:19935778), supported by IN_VITRO allele-selectivity
          data (PMID:17914454, PMID:17145926, PMID:21248764) and by molecular endpoint development (PMID:21191405).'
      selected_evidence:
        snippet: Subjective patient assessment and physician clinical efficacy measures revealed regression
          of callus on the siRNA-treated, but not on the vehicle-treated foot.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/4
      evidence_path: /treatments/4/evidence/1
