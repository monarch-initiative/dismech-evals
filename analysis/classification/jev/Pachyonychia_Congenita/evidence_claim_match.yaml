      assertion:
        name: Dominant-Negative Keratin Variant
        conforms_to: keratin_intermediate_filament_fragility#Dominant-Negative Keratin Variant in a Filament
          Assembly Domain
        biological_scale: MOLECULAR
        description: A heterozygous variant — usually a missense change or a small in-frame insertion/deletion
          within one of the helix boundary (helix initiation or helix termination) motifs — in KRT6A,
          KRT6B, KRT6C, KRT16 or KRT17. These motifs are the regions of the keratin polypeptide most critical
          for filament assembly, so the mutant protein acts in a dominant-negative fashion on the network
          built by the wild-type allele. The five genes encode the wound- and stress-inducible keratins
          whose expression domain (palmar and plantar epidermis, nail bed, oral mucosa, pilosebaceous
          unit) predicts the tissue distribution of disease.
        genes:
        - preferred_term: KRT6A
