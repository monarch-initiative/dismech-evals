      assertion:
        name: Mechanical Callus Debridement and Friction Reduction
        description: 'The mainstay of care: paring, filing, grinding or clipping the plantar callus, together
          with lifestyle measures that reduce friction and trauma (comfortable footwear and orthotics,
          wicking socks and ventilated footwear, limiting standing and walking, maintaining ideal body
          weight, walking aids when needed). Benefit is variable and over-trimming can paradoxically worsen
          plantar pain, so paring frequency is set by patient preference.'
        treatment_term:
          preferred_term: therapeutic procedure
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
        therapeutic_modality: BEHAVIORAL
      selected_evidence:
        snippet: Pain from the palmoplantar keratoderma may be reduced somewhat by limiting friction and
          trauma to the feet by minimizing walking or standing, reducing hydration of the stratum corneum
          by using wicking socks and ventilated footwear, selecting comfortable shoes, and maintaining
          ideal body weight.
        supports: SUPPORT
