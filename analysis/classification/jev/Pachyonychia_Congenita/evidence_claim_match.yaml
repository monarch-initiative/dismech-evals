              label: pachyonychia congenita
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Oxidative Stress and Hypoactive Keap1-NRF2 Signalling
        biological_scale: CELLULAR
        description: At the time of keratoderma onset, palmoplantar keratinocytes show elevated oxidative
          stress with an inability to sustain NRF2-dependent synthesis of glutathione. High levels of
          hypophosphorylated (hypoactive) NRF2 have been confirmed in lesional plantar skin biopsies from
          people with PC, not just in the mouse model. Genetic ablation of Nrf2 accelerates keratoderma
          in Krt16-null mice, and topical NRF2 activation prevents it — making this a causal node rather
          than a correlate.
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        biological_processes:
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: ABNORMAL
      selected_evidence:
        snippet: Here, we have shown that PPK onset is preceded by oxidative stress in footpad skin of
          Krt16-/- mice and correlates with an inability of keratinocytes to sustain nuclear factor erythroid-derived
          2 related factor 2-dependent (NRF2-dependent) synthesis of the cellular antioxidant glutathione
          (GSH).
        supports: SUPPORT
    origin:
