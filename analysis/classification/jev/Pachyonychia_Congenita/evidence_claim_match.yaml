        - experiment_id: pc_neurovascular_structures_vs_qst
          name: Correlation of neurovascular structure burden with quantitative sensory testing
          description: Prospective study relating the number and distribution of intracallus neurovascular
            structures to mechanical hyperalgesia thresholds and DN4 scores.
      selected_evidence:
        snippet: Although thermal and mechanical hypoaesthesia may result from thicker skin, its presentation
          in painful regions, along with mechanical hyperalgesia and allodynia, point towards the possibility
          of neuropathic changes occurring in PC.
        supports: SUPPORT
