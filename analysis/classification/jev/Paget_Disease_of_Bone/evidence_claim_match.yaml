  0d703469d4ea7b4a53ccc95f03cf3ded8a477a343295f4a5d56b95e558572a09:
    claim:
      about:
        disease:
          name: Paget Disease of Bone
          disease_term:
            preferred_term: bone Paget disease
            term:
              id: MONDO:0005382
              label: bone Paget disease
        context: []
      assertion_type: Environmental
      assertion:
        name: Unidentified declining environmental exposure
        description: 'Something environmental is strongly implicated, and it is going away. Standardised
          UK incidence fell from 0.75 to 0.20 per 10,000 person-years between 1999 and 2015 - far too
          fast to be genetic drift - and the same decline has been reported in other countries. Together
          with the focality of lesions and the incomplete penetrance within families, that is the case
          for an environmental co-factor acting on a genetically susceptible osteoclast lineage. Its identity
          is unknown.


          This entry says "strongly implicated" rather than "required" on purpose. The P394L Sqstm1 knock-in
          mouse develops a PDB-like focal skeletal disorder with no additional trigger, which is direct
          evidence against strict necessity. The human epidemiology and the mouse disagree, and the disagreement
          is recorded as a HUMAN_MODEL_MISMATCH discussion rather than resolved in favour of either. The
          long-standing paramyxovirus hypothesis is discussed separately and is not currently supported.'
        notes: No exposure_term is bound because the exposure is not identified. ECTO cannot represent
          "an unknown environmental determinant", and binding a speculative term (a paramyxovirus exposure,
          coal smoke, livestock contact) would assert something the evidence does not support.
      selected_evidence:
        snippet: The reason for the decline in incidence remains unknown, although the rapidity of change
          points to an alteration in one or more environmental determinants.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
