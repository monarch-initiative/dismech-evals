  e3dba433031dcacf522674729b2eadd430a86d7ae3dafc2fb731547904112d3c:
    claim:
      about:
        disease:
          name: Paget Disease of Bone
          disease_term:
            preferred_term: bone Paget disease
            term:
              id: MONDO:0005382
              label: bone Paget disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Osteoclast Precursor Hypersensitivity to RANKL
        biological_scale: CELLULAR
        genes:
        - preferred_term: TNFRSF11A
          description: RANK. Bound here because both the common susceptibility signal and the rare germline
            variants act on this differentiation step.
          term:
            id: hgnc:11908
            label: TNFRSF11A
        mechanism_confidence: ESTABLISHED
        description: 'Osteoclast differentiation is governed by the RANK-RANKL-OPG triad: RANKL from osteoblasts
          and marrow stroma drives differentiation through RANK on precursors, and OPG restrains it as
          a decoy receptor. Pagetic precursors are hypersensitive to RANKL, and the susceptibility loci
          that emerged from association studies sit largely in this pathway - RANK itself, CSF1, and DCSTAMP,
          which mediates precursor fusion. The most direct evidence that this axis is the disease''s centre
          of gravity comes from a different disease: loss of OPG causes juvenile Paget disease, a generalised
          recessive disorder of the same remodelling machinery.'
        biological_processes:
        - preferred_term: positive regulation of osteoclast differentiation
          modifier: INCREASED
          term:
            id: GO:0045672
            label: positive regulation of osteoclast differentiation
        cell_types:
        - preferred_term: osteoclast precursor
          term:
            id: CL:0000092
            label: osteoclast
      selected_evidence:
        snippet: OPG, a decoy receptor, binds to RANKL to prevent RANK binding. Thereby, OPG suppresses
          the differentiation of osteoclasts.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
