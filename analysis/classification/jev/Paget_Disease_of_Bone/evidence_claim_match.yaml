              label: bone Paget disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SQSTM1 UBA-Domain Variant Impairs Selective Autophagy
        biological_scale: MOLECULAR
        genes:
        - preferred_term: SQSTM1
          term:
            id: hgnc:11280
            label: SQSTM1
        mechanism_confidence: ESTABLISHED
        description: p62/sequestosome-1 uses its UBA domain to bind ubiquitinated cargo, which is how
          it links that cargo both to autophagic degradation and to NF-kB signalling. UBA-domain variants
          impair ubiquitin binding, so damaged protein is cleared less efficiently and the NF-kB arm loses
          a regulator. The consequence is a corruption of two coupled housekeeping functions rather than
          the loss of a single enzyme activity, which is part of why the resulting disease is focal and
          late rather than congenital and generalised.
        genetic_context:
          gene:
            preferred_term: SQSTM1
            term:
              id: hgnc:11280
              label: SQSTM1
        biological_processes:
        - preferred_term: autophagy
          modifier: ABNORMAL
          term:
            id: GO:0006914
            label: autophagy
        - preferred_term: positive regulation of canonical NF-kappaB signal transduction
          modifier: INCREASED
          term:
            id: GO:0043123
            label: positive regulation of canonical NF-kappaB signal transduction
        cell_types:
        - preferred_term: osteoclast precursor
          term:
            id: CL:0000092
            label: osteoclast
      selected_evidence:
        snippet: The p62 protein plays a crucial role in autophagy, a process involved in removing damaged
          cellular components. When this function is compromised, it can lead to the accumulation of damaged
          proteins in bone cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37180975
      reference_title: 'Paget''s disease: a review of the epidemiology, etiology, genetics, and treatment.'
      evidence_source: HUMAN_CLINICAL
      explanation: States the autophagic function of p62 and the consequence of losing it in bone cells.
