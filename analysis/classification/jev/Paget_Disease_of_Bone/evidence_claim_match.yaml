      assertion_type: Inheritance
      assertion:
        name: Complex polygenic susceptibility
        description: Beyond the monogenic families, common variants at seven loci - CSF1, OPTN, TNFRSF11A,
          TM7SF4/DCSTAMP, PML, RIN3 and NUP205 - contribute to risk. Most act on osteoclast differentiation
          or fusion, which is the same pathway the monogenic causes reach by a different route.
      selected_evidence:
        snippet: Here we extended this study, identified three new loci and confirmed their association
          with PDB in 2,215 affected individuals (cases) and 4,370 controls from seven independent populations.
        supports: SUPPORT
