  22dcba9b02795d6d44806c398363885827286c718de16dd794ed320670fc8f30:
    claim:
      about:
        disease:
          name: Paget Disease of Bone
          disease_term:
            preferred_term: bone Paget disease
            term:
              id: MONDO:0005382
              label: bone Paget disease
        context: []
      assertion_type: AnimalModel
      assertion:
        name: P394L Sqstm1 knock-in mouse
        species: Mouse
        genotype: Sqstm1 p.Pro394Leu knock-in, heterozygous and homozygous
        publication: PMID:21515589
        description: 'The murine equivalent of the human SQSTM1 p.Pro392Leu allele, and the model that
          carries most of the mechanistic weight in this disease. It reproduces the focal, asymmetric,
          age-accumulating lesions of human PDB, the giant hypernucleated osteoclasts with nuclear inclusions,
          the RANKL hypersensitivity of osteoclast precursors, and the autophagy dysregulation - four
          of this entry''s six nodes, in one model.


          It is also the source of this entry''s most awkward evidence. Human PDB is focal and its incidence
          is falling, which argues for an environmental co-factor; this mouse develops the disease with
          no trigger at all. See the HUMAN_MODEL_MISMATCH discussion.'
        modeled_mechanisms:
        - target: Osteoclast Precursor Hypersensitivity to RANKL
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Osteoclast precursors from mutant mice are measurably more sensitive to RANKL than
            wild-type, and the sensitivity increases further with age - which is what makes this model
            an explanation for the age-dependence of human penetrance rather than only a phenocopy.
          limitations: The sensitivity is measured in vitro on precursors from the mouse, so it establishes
            a cell-autonomous property of the mutant lineage rather than the in vivo trigger sequence.
          readouts:
          - name: Osteoclastogenesis from precursors at fixed RANKL
            target: Osteoclast Precursor Hypersensitivity to RANKL
            direction: INCREASED
            interpretation: Increased relative to wild-type and increasing with age in both genotypes,
              which is the age-penetrance link.
        - target: Giant Hypernucleated Hyperactive Osteoclasts
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Osteoclasts within murine lesions are larger and more nucleated than normal and
            some carry the nuclear inclusion bodies seen in human pagetic osteoclasts - the cellular signature
            of the disease reproduced in full.
          limitations: Inclusion bodies are reported in some but not all lesional osteoclasts, as in humans;
            the model does not resolve what they are.
        - target: Focal Accelerated Bone Resorption
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Focal lesions accumulate with age - 77% of heterozygotes and 95% of homozygotes
            by 12 months against none in wild-type littermates - and predominantly affect the lower limbs
            asymmetrically, reproducing the focality and asymmetry that a germline allele does not obviously
            explain.
          limitations: Penetrance is far higher than in human heterozygotes, and the lesion distribution
            is limb-predominant rather than matching the human axial preference for pelvis, spine and
            skull.
          readouts:
          - name: Proportion of animals with focal bone lesions at 12 months
            target: Focal Accelerated Bone Resorption
            direction: INCREASED
            interpretation: Genotype-dependent and age-dependent lesion development against a zero wild-type
              baseline.
      selected_evidence:
        snippet: ZA prevented the development of pagetic-like lesions, and increased trabecular bone volume
          tenfold compared with vehicle by 12 months of age (P<0.01).
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30154079
      reference_title: Zoledronic acid prevents pagetic-like lesions and accelerated bone loss in the
        p62(P394L) mouse model of Paget's disease.
      evidence_source: MODEL_ORGANISM
      explanation: 'A treatment result in the model that joins the pathograph to the treatment section:
        zoledronic acid prevents lesion development, which is the mechanistic counterpart of its biochemical
        effect in humans.'
