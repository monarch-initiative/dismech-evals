          lamellar organisation. The result is the mosaic of woven and lamellar bone with irregular cement
          lines that is the pathological signature. The osteoblast is behaving normally here - it is coupling
          to resorption as it should - which is why the disease is properly described as osteoclast-driven
          rather than as a disorder of formation.
