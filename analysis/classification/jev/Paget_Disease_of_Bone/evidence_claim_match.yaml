            id: HP:0000006
            label: Autosomal dominant inheritance
        description: Familial clustering is common and SQSTM1-linked families segregate the variant dominantly,
          but penetrance is incomplete and rises with age, and expressivity varies within families. That
          variable expressivity is itself part of the argument for an environmental co-factor, since relatives
          sharing the same allele do not share the same disease.
      selected_evidence:
        snippet: the focal nature of lesions, the decline in prevalence rates, and the incomplete penetrance
          of the disease among family members suggest that one or more environmental triggers may play
          a role in the pathophysiology of PDB
        supports: SUPPORT
