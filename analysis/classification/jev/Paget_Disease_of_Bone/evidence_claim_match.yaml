              label: bone Paget disease
        context: []
      assertion_type: Treatment
      assertion:
        name: Symptom-Directed Rather Than Turnover-Directed Management
        therapeutic_modality: OTHER
        description: This is a treatment-strategy entry rather than an agent, because the strategy question
          has been answered directly and the answer is counterintuitive. The PRISM-EZ trial randomised
          502 patients to intensive bisphosphonate therapy aimed at normalising bone turnover versus bisphosphonates
          given only for pain. Intensive treatment achieved markedly better biochemistry and produced
          no reduction in fracture, no fewer orthopaedic procedures, and no better quality of life - with
          a non-significant increase in fractures, orthopaedic events and serious adverse events. In established
          disease, therefore, the target is symptoms, not the ALP.
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: The results of this study suggest that in patients with established PDB, bisphosphonate
          therapy should focus on control of symptoms rather than suppression of bone turnover.
        supports: SUPPORT
