        mechanism_confidence: ESTABLISHED
        description: 'The remodelled bone is enlarged in diameter, mechanically inferior and highly vascular.
          That combination generates the entire clinical burden: pain, bowing deformity of weight-bearing
          long bones, secondary osteoarthritis at adjacent joints, pathological fracture, cranial nerve
          compression with hearing loss where the skull is involved, and - in extensive polyostotic disease
          - a high-output cardiac state from the vascularity. Rarely the same site undergoes neoplastic
          transformation.'
        locations:
        - preferred_term: bony pelvis
          term:
            id: UBERON:0001270
