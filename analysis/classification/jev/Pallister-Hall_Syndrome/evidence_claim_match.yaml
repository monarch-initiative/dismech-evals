      assertion_type: Pathophysiology
      assertion:
        name: GLI3 Constitutive Repressor from Truncating Mutations
        description: 'Truncating mutations in the middle third of GLI3 (ORF nt 1998-3481) produce a protein
          that retains the N-terminal zinc finger DNA-binding domain and repressor domain but lacks the
          C-terminal transactivation domain. This truncated protein functions as a constitutive repressor
          of Hedgehog target genes, independent of Hedgehog signaling input.

          '
        genes:
        - preferred_term: GLI3
          term:
            id: hgnc:4319
            label: GLI3
        genetic_context:
          gene:
            preferred_term: GLI3
            term:
              id: hgnc:4319
              label: GLI3
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: 'Heterozygous frameshift, nonsense and splicing variants in the middle third of
            the GLI3 ORF yield a C-terminally truncated protein. No `functional_impact_category` is recorded:
            the cited sources establish the variant classes and their positional correlation with phenotype,
            but none of them labels the mechanism as dominant-negative, neomorphic or gain-of-function,
            and this entry''s contrast with GCPS haploinsufficiency is argued from the node evidence rather
            than from such a label.'
        biological_processes:
        - preferred_term: Hedgehog Signaling Pathway
          term:
            id: GO:0007224
            label: smoothened signaling pathway
      selected_evidence:
        snippet: C-terminal sequences are required for positive inducing activity
        supports: SUPPORT
