        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        description: 'Autosomal dominant with variable expressivity. Unlike GCPS which results from GLI3
          haploinsufficiency, PHS is caused specifically by frameshift/nonsense mutations in the middle
          third of GLI3 that produce a truncated constitutive repressor protein.

          '
      selected_evidence:
        snippet: GLI3 mutations that predict a truncated functional repressor protein cause PHS and that
          functional haploinsufficiency of GLI3 causes GCPS
        supports: SUPPORT
    origin:
