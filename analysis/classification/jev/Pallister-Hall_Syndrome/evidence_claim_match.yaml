            term:
              id: MONDO:0007804
              label: Pallister-Hall syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: GLI3 Mutations (Truncating, Middle Third)
        gene_term:
          preferred_term: GLI3
          term:
            id: hgnc:4319
            label: GLI3
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'Frameshift and nonsense mutations in the middle third of GLI3 (ORF nt 1998-3481) on chromosome
          7p14.1 specifically cause PHS. These produce a truncated protein that functions as a constitutive
          repressor of Hedgehog signaling targets. This is in contrast to GCPS, where mutations throughout
          the gene cause haploinsufficiency. The genotype-phenotype correlation is robust across multiple
          large cohort studies.

          Positional rule for disease classification: mutations in the first third (nt 1-1997) or final
          third (nt 3482-end) of the ORF cause GCPS only; mutations in the middle third (nt 1998-3481)
          cause PHS. An important mechanistic requirement is that PHS-causing truncated proteins must
          escape nonsense-mediated mRNA decay (NMD) to produce the constitutive repressor. If NMD degrades
          the transcript, haploinsufficiency results and the phenotype shifts toward GCPS. This NMD-escape
          requirement explains why not all middle-third nonsense variants produce the PHS phenotype (e.g.,
          c.2374C>T p.Arg792Ter maps to the middle-third position but causes GCPS).

          Approximately 25% of individuals have a de novo pathogenic variant; de novo cases tend to be
          more severely affected than those with an inherited variant.

          '
      selected_evidence:
        snippet: Mutations in the GLI3 zinc-finger transcription factor gene cause Greig cephalopolysyndactyly
          syndrome (GCPS) and Pallister-Hall syndrome (PHS), which are variable but distinct clinical
          entities
        supports: SUPPORT
