  eef60700ae461ccd4866112f257a5b946d4845a944d0f586d1c46e831d213a5b:
    claim:
      about:
        disease:
          name: Palmoplantar Keratoderma-Esophageal Carcinoma Syndrome
          disease_term:
            preferred_term: palmoplantar keratoderma-esophageal carcinoma syndrome
            term:
              id: MONDO:0007856
              label: palmoplantar keratoderma-esophageal carcinoma syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Germline RHBDF2 Gain-of-Function Variant
        biological_scale: MOLECULAR
        description: 'A heterozygous germline missense variant in the cytoplasmic N-terminus of RHBDF2.
          The first variants found were p.Ile186Thr (UK and US families) and p.Pro189Leu (a German family),
          followed by p.Asp188Asn in a Finnish family, which lies between the two; the Finnish authors
          suggested that TOC-associated variants may be specific to this site. The variants act as gain
          of function: N-terminal mutations make iRhom2 more stable, and loss of iRhom2 in mice thins
          the footpad epidermis instead of thickening it.'
        gene:
          preferred_term: RHBDF2
          modifier: INCREASED
          term:
            id: hgnc:20788
            label: RHBDF2
        genetic_context:
          gene:
            preferred_term: RHBDF2
            term:
              id: hgnc:20788
              label: RHBDF2
          variant_origin: GERMLINE
          allelic_events:
          - PATHOGENIC_VARIANT
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: Heterozygous missense variants at codons 186 to 189 of RHBDF2 (p.Ile186Thr, p.Asp188Asn,
            p.Pro189Leu in the papers cited here).
        molecular_functions:
        - preferred_term: keratin 16 binding
          modifier: INCREASED
          term:
            id: GO:1990254
            label: keratin filament binding
      selected_evidence:
        snippet: we have now identified missense mutations (c.557T>C ... and c.566C>T ... in RHBDF2, which
          encodes the inactive rhomboid protease RHBDF2 (also known as iRhom2), as the underlying cause
          of TOC
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22265016
      reference_title: RHBDF2 mutations are associated with tylosis, a familial esophageal cancer syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Gene discovery by targeted capture and sequencing of the linked 17q25 interval in TOC
        families.
