      assertion_type: Discussion
      assertion:
        discussion_id: gap_adam17_catalytic_requirement
        prompt: Does the TOC form of iRHOM2 need ADAM17 catalytic activity to increase EGF-family ligand
          release, or does it act partly independently of ADAM17?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Increased ADAM17 Maturation and Ectodomain Shedding in Keratinocytes
        - pathophysiology#Amphiregulin-Driven EGFR Hyperactivation
        rationale: Patient keratinocytes show increased ADAM17 maturation and shedding, and the toc knock-in
          mouse phenotype depends on Adam17 dosage. One mouse and cell study reports amphiregulin secretion
          increased independently of ADAM17 activity, and another finds that the toc mutation changes
          ADAM17 function substrate-selectively without lowering mature ADAM17, while the related cub
          allele needs ADAM17 protein but not its catalytic activity.
      selected_evidence:
        snippet: In turn, these stable variants function to augment the secretion of EGF family ligands,
          including amphiregulin, independent of metalloprotease a disintegrin and metalloproteinase 17
          (ADAM17) activity.
        supports: SUPPORT
