        variants:
        - name: SERPINB7 c.796C>T (p.Arg266*)
          type: NONSENSE
          clinical_significance: PATHOGENIC
          description: East Asian founder variant, the most frequent NPPK allele in Japan and China.
        - name: SERPINB7 c.522_523insT
          type: FRAMESHIFT
          clinical_significance: PATHOGENIC
          description: Second most frequent hotspot variant in Chinese patients.
      selected_evidence:
        snippet: We performed whole-exome and/or Sanger sequencing analyses of 13 unrelated NPPK individuals
          and identified biallelic putative loss-of-function mutations in SERPINB7, which encodes a cytoplasmic
          member of the serine protease inhibitor superfamily.
        supports: SUPPORT
