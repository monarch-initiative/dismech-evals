      assertion_type: Discussion
      assertion:
        discussion_id: fryl_molecular_mechanism_gap
        prompt: What does FRYL do in mammalian neurons and developing organs, and does it act through
          NDR kinases or NOTCH1 signaling?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#FRYL Haploinsufficiency
        - pathophysiology#Impaired Neuronal Development
        - pathophysiology#Disrupted Organ Morphogenesis
        rationale: The disease mechanism is established only to the level of gene dosage. Furry proteins
          activate or scaffold NDR kinases in yeast, worms and flies. In human epithelial and colorectal
          cancer cells FRYL binds Homer scaffolds and modulates YAP and Wnt/beta-catenin signaling downstream
          of the Crumbs polarity complex, and FRYL has also been reported to bind the active NOTCH1 intracellular
          domain. None of these routes has been tested for FRYL in a mammalian neurodevelopmental or organogenesis
          model.
      selected_evidence:
        snippet: However, it is not known whether FRYL interacts with NDR kinases.
        supports: SUPPORT
