        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neuronal Development
        description: 'The neurodevelopmental features are thought to reflect a requirement for FRYL in
          neuronal development. Direct evidence comes only from Drosophila: furry is expressed in neurons
          but not glia, is required for neuronal communication in the retina, and together with the NDR
          kinase Tricornered limits dendritic branching and enforces dendritic tiling. Whether FRYL acts
          through NDR kinases in human neurons is untested.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: dendrite morphogenesis
          term:
            id: GO:0048813
            label: dendrite morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: We find that the fly FRYL ortholog, furry (fry), is expressed in multiple tissues, including
          the central nervous system where it is present in neurons but not in glia.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
