        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Organ Morphogenesis
        description: Congenital anomalies of the heart, left-right patterning, genitourinary tract, gastrointestinal
          tract, diaphragm, chest wall and face indicate that FRYL dosage matters for morphogenesis in
          several organ systems. Fryl-null mice die soon after birth with renal tubular defects, and morpholino
          knockdown of fryl in zebrafish causes cardiac and craniofacial defects. The developmental pathway
          through which FRYL acts in these tissues is unknown.
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: animal organ morphogenesis
          term:
            id: GO:0009887
            label: animal organ morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: Other features include neurobehavioral differences, autism spectrum disorder, hypotonia,
          and seizures, as well as congenital anomalies in cardiovascular, skeletal, gastrointestinal,
          renal, and urogenital systems.
        supports: SUPPORT
