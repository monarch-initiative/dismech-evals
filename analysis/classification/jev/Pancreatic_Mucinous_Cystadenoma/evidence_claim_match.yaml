      assertion_type: Treatment
      assertion:
        name: Surgical Resection
        description: Surgical resection (typically distal pancreatectomy) is the standard treatment for
          MCNs >=40 mm or those with risk features (mural nodule) or symptoms, per 2018 European guidelines.
          Complete resection is curative for non-invasive MCNs. Partial resection should be avoided due
          to the risk of adenoma-carcinoma progression. MCNs <40 mm without risk features may be safely
          surveilled.
        treatment_term:
          preferred_term: surgical resection
          term:
            id: NCIT:C158758
            label: Resection
      selected_evidence:
        snippet: Completely removed mucinous cystadenomas, borderline mucinous cystic neoplasms, and mucinous
          cystic neoplasms with in situ carcinoma follow benign courses. Partial resection should be avoided
          as evidence suggests that mucinous cystic neoplasms can progress from adenomas to borderline
          lesions to carcinomas in situ to invasive carcinomas over time; partial resection should be
          avoided if possible.
        supports: SUPPORT
