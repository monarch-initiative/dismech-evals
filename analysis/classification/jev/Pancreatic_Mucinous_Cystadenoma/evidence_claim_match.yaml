              label: pancreatic mucinous cystadenoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ovarian-Type Stromal Differentiation
        description: MCNs are uniquely characterized by a distinctive ovarian-type stroma underlying the
          mucinous epithelial lining. The stromal cells express FOXL2, estrogen receptor, and progesterone
          receptor, which may drive tumor growth and explain the strong female predominance. This aberrant
          ovarian-type differentiation is the defining diagnostic criterion distinguishing MCNs from other
          pancreatic cystic neoplasms.
        cell_types:
        - preferred_term: ovarian-type stromal cell
          term:
            id: CL:0002574
            label: stromal cell of pancreas
      selected_evidence:
        snippet: All cases of PMC and HBC demonstrated nuclear reactivity for FOXL2 in the subepithelial
          stromal cells. Ninety percent of MEST demonstrated nuclear FOXL2 positivity. Estrogen receptor
          nuclear positivity was demonstrated in 57% of PMC, 77% of HBC, and 80% of MEST. Progesterone
          receptor nuclear positivity was present in 67% of PMC, 100% of HBC, and 90% of MEST.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
