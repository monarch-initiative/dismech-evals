      assertion:
        name: KRAS-Driven Oncogenesis via MAPK Cascade
        description: KRAS activating mutations are the primary initiating driver in pancreatic MCNs, with
          frequency that is grade-dependent (50% in LG, 100% in HG/INV lesions). Identical KRAS mutations
          present in both low-grade and higher-grade areas of individual tumors indicate clonal progression.
          KRAS mutations are also associated with increased mucin expression (MUC1, MUC2, MUC5AC) and
          multilocular cystic appearance.
        biological_processes:
        - preferred_term: MAPK cascade
          term:
            id: GO:0000165
            label: MAPK cascade
      selected_evidence:
        snippet: KRAS mutations appear to be major driver genetic alterations in both liver and pancreatic
          MCNs. As identical KRAS mutations were present in low-grade and higher-grade areas in individual
          cases, KRAS mutations occurring in low-grade MCNs may lead to tumour progression.
        supports: SUPPORT
