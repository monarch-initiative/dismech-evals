          MCNs <40mm without risk features, surveillance with MRI every 6 months for the first year then
          annually is recommended.
        treatment_term:
          preferred_term: surveillance for malignancies
          term:
            id: NCIT:C15406
            label: Cancer Screening
      selected_evidence:
        snippet: Surveillance is recommended every 6 months for the first year, then annually if no changes
          are observed. Patients with an MCN measuring <40 mm and with no concerning features or symptoms
          should have lifelong surveillance as long as they are fit for surgery
