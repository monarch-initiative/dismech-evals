          invasive mucinous cystadenocarcinoma. This progression is driven by accumulation of oncogene
          activation and tumor suppressor inactivation.
        biological_processes:
        - preferred_term: cell population proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: Partial resection should be avoided as evidence suggests that mucinous cystic neoplasms
          can progress from adenomas to borderline lesions to carcinomas in situ to invasive carcinomas
          over time; partial resection should be avoided if possible.
        supports: SUPPORT
