      assertion_type: Genetic
      assertion:
        name: KRAS Mutations
        gene_term:
          preferred_term: KRAS
          term:
            id: hgnc:6407
            label: KRAS
        presence: SOMATIC
        association: PREDISPOSING
        notes: KRAS oncogene mutations are the primary driver genetic alterations in pancreatic MCNs.
          Frequency is grade-dependent, with 50% in LG lesions and 100% in HG/INV lesions in a large study
          of 106 cases. A smaller series of 25 cases found 20% overall (5% LG, 80% higher-grade). KRAS
          mutations are associated with increased mucin expression and multilocular appearance.
      selected_evidence:
        snippet: KRAS mutations were identified in five cases (20%), whereas GNAS, RNF43 and PIK3CA were
          wild-type in all cases. KRAS mutations were uncommon in cases of low-grade dysplasia (1/20,
          5%), whereas KRAS was mutated in all cases of higher grades, except for one liver MCN with intermediate-grade
          dysplasia (4/5, 80%; P = 0.002).
        supports: SUPPORT
