      assertion_type: Pathophysiology
      assertion:
        name: RNF43 Loss and Wnt Pathway Dysregulation
        description: RNF43 loss-of-function mutations are found in MCNs and are significantly associated
          with malignant transformation. RNF43 normally acts as a negative regulator of Wnt signaling
          by promoting degradation of Wnt receptors. Loss of RNF43 leads to reduced protein expression
          and aberrant beta-catenin nuclear localization, activating the Wnt pathway. In contrast to IPMNs,
          GNAS mutations are rare or absent in MCNs.
        biological_processes:
        - preferred_term: Wnt signaling pathway
          term:
            id: GO:0016055
            label: Wnt signaling pathway
      selected_evidence:
        snippet: The frequency of RNF43 mutations was significantly higher in HG/INV cases than in LG
          cases. Furthermore, HG/INV lesions (56%) and LG lesions (33%) of HG/INV cases possessed RNF43
          mutation, whereas no such mutation was detected in any LG cases.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35066614
      reference_title: RNF43 as a predictor of malignant transformation of pancreatic mucinous cystic
        neoplasm.
      evidence_source: HUMAN_CLINICAL
      explanation: Study of 106 MCN cases directly demonstrates RNF43 mutations are enriched in high-grade/invasive
        lesions, supporting RNF43 loss as a driver of Wnt pathway dysregulation in MCN progression.
