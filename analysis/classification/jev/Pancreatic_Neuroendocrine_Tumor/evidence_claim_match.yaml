        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MEN1 Tumor Suppressor Inactivation
        description: Loss-of-function mutations in the MEN1 gene (encoding menin) occur in approximately
          44% of sporadic pNETs and are the hallmark of hereditary MEN1 syndrome. Menin is a chromatin-modifying
          protein that acts as a scaffold for the MLL/SET1-like histone methyltransferase complex, regulating
          H3K4 methylation. Loss of menin disrupts epigenetic regulation of cell cycle genes, leading
          to uncontrolled proliferation of islet cells. Clinically, MEN1 mutations are paradoxically associated
          with better prognosis.
        cell_types:
        - preferred_term: pancreatic endocrine cell
          term:
            id: CL:0008024
            label: pancreatic endocrine cell
        biological_processes:
        - preferred_term: chromatin organization
          modifier: DYSREGULATED
          term:
            id: GO:0006325
            label: chromatin organization
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: 44% of the tumors had somatic inactivating mutations in MEN1, which encodes menin, a
          component of a histone methyltransferase complex
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21252315
      reference_title: DAXX/ATRX, MEN1, and mTOR pathway genes are frequently altered in pancreatic neuroendocrine
        tumors.
      evidence_source: HUMAN_CLINICAL
      explanation: Jiao et al. whole-exome sequencing study established MEN1 mutation frequency at 44%
        in sporadic pNETs and identified its role in chromatin remodeling.
