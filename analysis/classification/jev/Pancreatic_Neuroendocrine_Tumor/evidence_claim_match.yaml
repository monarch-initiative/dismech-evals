      assertion:
        name: mTOR Pathway Activation
        description: Mutations in mTOR pathway genes (PTEN, TSC2, PIK3CA) occur in approximately 14% of
          pNETs, leading to constitutive activation of the PI3K/AKT/mTOR signaling cascade. This drives
          cell growth, proliferation, and angiogenesis, and represents a key therapeutic target. The mTOR
          inhibitor everolimus is approved for progressive pNETs.
        biological_processes:
        - preferred_term: TORC1 signaling
          modifier: INCREASED
          term:
            id: GO:0038202
            label: TORC1 signaling
        - preferred_term: PI3K/AKT signaling
          modifier: INCREASED
          term:
            id: GO:0043491
            label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: We also found mutations in genes in the mTOR (mammalian target of rapamycin) pathway
          in 14% of the tumors, a finding that could potentially be used to stratify patients for treatment
          with mTOR inhibitors.
        supports: SUPPORT
