      assertion_type: IUISAssignment
      assertion:
        classification_value: bone marrow failure
        notes: 'IUIS 2022 phenotypic classification of inborn errors of immunity (Tangye et al., PMID:35748970),
          Table 9 "Bone marrow failure", the row entered as "BMFS2". One row, one gene: ERCC6L2, autosomal
          recessive, OMIM 615667, which is the phenotype number this entry is curated against. The row''s
          associated-features cell reads "Bone marrow failure, learning difficulties, microcephaly", matching
          the three features this entry''s name and phenotypes carry. The table records the lymphocyte
          columns as NA rather than reporting a T-cell or B-cell defect, so the IEI status here rests
          on the failure of the stem and progenitor compartment itself, which is precisely what Table
          9 exists to collect.'
      selected_evidence:
        snippet: BMFS2 ERCC6L2 AR 615667 NA NA Bone marrow failure, learning difficulties, microcephaly
        supports: SUPPORT
