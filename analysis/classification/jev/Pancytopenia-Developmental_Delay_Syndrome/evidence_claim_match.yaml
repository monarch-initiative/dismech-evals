        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: 'The neurodevelopmental features are drawn from the germline lesion itself rather
          than from any step in the haematopoietic chain, because that is what the evidence supports and
          no more: ERCC6L2 is ubiquitously expressed and the same repair deficiency is present in neural
          tissue, but no study has shown which step produces the delay, and it is not a consequence of
          marrow failure. The tissue-level mechanism is genuinely unknown.

          Note the penetrance caveat already recorded on the phenotype: the 2018 six-patient series found
          developmental delay in all of them, but across the pooled 31-patient literature the combined
          microcephaly/developmental-delay figure is 6 of 31.'
      selected_evidence:
        snippet: All patients displayed bone marrow failure, learning or developmental delay and microcephaly.
        supports: SUPPORT
