        kind: KNOWLEDGE_GAP
        prompt: Why does loss of a ubiquitously expressed transcription-coupled repair factor produce
          a phenotype dominated by haematopoiesis?
        attaches_to:
        - pathophysiology#Replication Stress and DNA Damage in Haematopoietic Stem and Progenitor Cells
        rationale: The molecular lesion is a general transcription-coupled repair defect demonstrated
          in lymphoblastoid cell lines, but the clinical disease is a marrow failure syndrome. The candidate
          explanations -- high HSPC replication demand, particular sensitivity of erythroid commitment,
          a remodelled stromal niche -- are each supported by one experiment and none has been tested
          against the others.
        status: OPEN
      selected_evidence:
        snippet: While germline mutations in the DNA repair factor ERCC excision repair 6 like 2 (ERCC6L2)
          give rise to bone marrow failure and acute myeloid leukaemia, their consequences on normal haematopoiesis
          remain unclear.
        supports: SUPPORT
