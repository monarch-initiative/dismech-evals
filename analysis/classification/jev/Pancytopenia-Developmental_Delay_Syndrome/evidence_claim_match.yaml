      assertion_type: Discussion
      assertion:
        discussion_id: ercc6l2_name_understates_disease
        kind: KNOWLEDGE_GAP
        prompt: Is "pancytopenia-developmental delay syndrome" the right name for a disease whose cytopenias
          are mild, whose developmental delay is inconstant, and whose defining feature is TP53-mutant
          leukaemic transformation?
        attaches_to:
        - disease#Pancytopenia-Developmental Delay Syndrome
        - phenotypes#Developmental delay
        rationale: 'Both features in the MONDO label are the weaker ones. Counts are mild relative to
          marrow hypoplasia, and patients have been reported with unremarkable histories and normal physical
          findings. The literature has largely moved to "ERCC6L2 disease". This matters practically, not
          just terminologically: a clinician who expects pancytopenia and developmental delay will not
          think of the diagnosis in an otherwise well adolescent with bicytopenia, which is the presentation
          the Croatian report was written to highlight.'
        status: OPEN
      selected_evidence:
        snippet: We present two unrelated adolescent females with unexplained prolonged bicytopenia, unremarkable
          medical history and normal physical findings who were diagnosed with a rare non-classical ERCC6L2-associatedIBMFS.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
