      selected_evidence:
        snippet: 'Pooled ORs are: overall 2.2, CI (1.82–2.58), sexual abuse 1.92, CI (1.37–2.46), physical
          abuse 1.71, CI (1.37–2.05), emotional abuse 1.61, CI (0.868–2.35), emotional neglect 1.53, CI
          (0.756–2.31), parental alcoholism 1.83, CI (1.24–2.43), and parental separation/loss 1.82, CI
          (1.14–2.50).'
        supports: SUPPORT
