        relationship_type: RISK_FACTOR
        association: MHC class I risk alleles (including HLA-B*51 in Behcet-associated panuveitis and
          HLA-B27 in spondyloarthritis-associated uveitis)
        notes: Polymorphisms in HLA-B shape ocular peptide presentation to T cells and modify uveitis
          susceptibility across anatomical and syndromic subtypes, including HLA-B*51 in Behcet disease
          and HLA-B27 in acute anterior and spondyloarthritis-associated uveitis.
      selected_evidence:
