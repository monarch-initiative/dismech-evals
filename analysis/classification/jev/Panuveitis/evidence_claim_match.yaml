      assertion_type: DifferentialDiagnosis
      assertion:
        name: Posterior uveitis
        disease_term:
          preferred_term: posterior uveitis
        description: Anatomic class of uveitis in which primary intraocular inflammation is restricted
          to the retina and/or choroid without predominant simultaneous involvement of the anterior chamber
          and vitreous cavity.
        distinguishing_features:
        - Primary inflammation confined to the choroid and/or retina (17%-23% of uveitis cases) rather
          than involving all uveal layers simultaneously
      selected_evidence:
        snippet: Anterior uveitis affects the iris and ciliary body (41%-60% of cases); intermediate uveitis
          affects the pars plana (attachment point of vitreous humor) and peripheral retina (9%-15%);
          posterior uveitis involves the choroid and/or retina (17%-23%); and panuveitis involves all
          uveal layers (7%-32%).
        supports: SUPPORT
