      assertion_type: Pathophysiology
      assertion:
        name: Immunogenetic susceptibility
        description: Polymorphisms in MHC class I and II molecules (such as HLA-B*51 and HLA-B27) alter
          ocular peptide presentation to T lymphocytes, while susceptibility variants in the Th17-pathway
          receptor IL23R and haploinsufficiency of the NF-kappaB negative regulator TNFAIP3 (A20) dysregulate
          adaptive and innate immune signaling, lowering activation thresholds for intraocular autoimmunity.
        genes:
        - preferred_term: HLA-B
          term:
            id: hgnc:4932
            label: HLA-B
        - preferred_term: IL23R
          term:
            id: hgnc:19100
            label: IL23R
        - preferred_term: TNFAIP3
          term:
            id: hgnc:11896
            label: TNFAIP3
        molecular_functions:
        - preferred_term: peptide antigen binding
          modifier: ABNORMAL
          term:
            id: GO:0042605
            label: peptide antigen binding
        - preferred_term: cytokine receptor activity
          term:
            id: GO:0004896
            label: cytokine receptor activity
        - preferred_term: K63-linked deubiquitinase activity
          modifier: DECREASED
          term:
            id: GO:0061578
            label: K63-linked deubiquitinase activity
        biological_processes:
        - preferred_term: antigen processing and presentation of peptide antigen via MHC class I
          modifier: ABNORMAL
          term:
            id: GO:0002474
            label: antigen processing and presentation of peptide antigen via MHC class I
        - preferred_term: activation of immune response
          modifier: INCREASED
          term:
            id: GO:0002253
            label: activation of immune response
      selected_evidence:
        snippet: As outlined above, HLA polymorphisms shape which ocular peptides are displayed to T-cells
          and modify risk; prominent examples include HLA-B27 with acute anterior uveitis, HLA-A29 with
          birdshot chorioretinopathy, and HLA-B*51 with Behçet’s disease (Table 2) (221).
        supports: SUPPORT
