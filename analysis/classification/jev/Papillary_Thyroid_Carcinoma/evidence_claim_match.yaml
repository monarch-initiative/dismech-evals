          70% of all thyroid cancers. Global incidence has been rising substantially over recent decades,
          driven in part by increased use of thyroid ultrasound and detection of small, clinically occult
          tumors. Incidence varies markedly by region, with higher rates in countries with widespread
          thyroid imaging programs (e.g., the United States, South Korea) and lower rates in lower-resource
          settings. Note: this entry shares MONDO:0005075 with the BRAF_Mutant_Thyroid_Cancer and RET_Fusion_Thyroid_Cancer
          molecular-subtype sibling entries; these subtypes collectively represent a large proportion
          of the overall PTC incidence.'
