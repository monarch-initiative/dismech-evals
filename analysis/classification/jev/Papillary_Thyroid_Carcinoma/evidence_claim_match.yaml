        and clinical study.'
      evidence_source: HUMAN_CLINICAL
      explanation: Multicenter pathological analysis of papillary thyroid microcarcinomas identifies nuclear
        grooves and optically clear nuclei as characteristic microscopic features correlated with BRAF
