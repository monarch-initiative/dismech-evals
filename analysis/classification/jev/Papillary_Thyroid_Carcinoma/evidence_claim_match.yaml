          setting for radioiodine-refractory differentiated thyroid cancer that has progressed during
          or after lenvatinib or sorafenib. This VEGFR-TKI-refractory population previously had no standard
          of care; the randomised placebo-controlled COSMIC-311 trial met its progression-free survival
          endpoint at interim analysis, at the cost of substantially more grade 3-4 toxicity (palmar-plantar
          erythrodysaesthesia, hypertension, fatigue).
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
