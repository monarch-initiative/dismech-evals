        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Papillary-Type Nuclear Features
        frequency: VERY_FREQUENT
        diagnostic: true
        description: The hallmark diagnostic nuclear features of papillary thyroid carcinoma include nuclear
          enlargement with optically clear (ground-glass) chromatin ("Orphan-Annie eye" nuclei), longitudinal
          nuclear grooves, and intranuclear cytoplasmic pseudoinclusions. These papillary-type nuclear
          changes are required criteria for histological and cytological diagnosis, distinguishing PTC
          from benign follicular lesions. Their frequency correlates with BRAF V600E mutation in classical
          and tall-cell subtypes.
      selected_evidence:
        snippet: nuclear grooves, optically clear nuclei, tall cells within the tumor
        supports: SUPPORT
    origin:
      assertion_path: /histopathology/1
      evidence_path: /histopathology/1/evidence/0
      context_paths:
