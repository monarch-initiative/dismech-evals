  9bc8ca39e94e7e5dc0ca6ab2d3f8e59c35a2a2c71137a17fcfbd491240dacddb:
    claim:
      about:
        disease:
          name: Papillary Thyroid Carcinoma
          disease_term:
            preferred_term: papillary thyroid carcinoma
            term:
              id: MONDO:0005075
              label: thyroid gland papillary carcinoma
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Psammoma Bodies
        finding_term:
          preferred_term: psammoma body formation
          term:
            id: NCIT:C27709
            label: Psammoma Body Formation
        description: Psammoma bodies are concentrically laminated calcified structures that form by dystrophic
          calcification of infarcted papillae or necrotic neoplastic cells. They are a diagnostically
          useful but non-universal finding in papillary thyroid carcinoma. Although their sensitivity
          is low (they are absent in a substantial minority of PTCs), their presence is highly specific
          for malignancy and for PTC in particular, especially when encountered in cervical lymph node
          tissue. Identification of psammoma bodies alone in a cervical lymph node is considered evidence
          of metastatic PTC even when viable tumor cells are absent.
        notes: Psammoma bodies are sufficiently specific for PTC that their incidental finding in cervical
          lymph nodes warrants a diligent search for a primary papillary thyroid carcinoma. They are absent
          or sparse in follicular and anaplastic thyroid carcinoma.
      selected_evidence:
        snippet: Although the sensitivity of psammoma bodies (PBs) was low, the specificity was 100%.
        supports: SUPPORT
    origin:
      assertion_path: /histopathology/2
      evidence_path: /histopathology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37181946
      reference_title: The Accurate Interpretation and Clinical Significance of Morphological Features
        of Fine Needle Aspiration Cells in Papillary Thyroid Carcinoma.
      evidence_source: HUMAN_CLINICAL
      explanation: Retrospective study of 337 PTC patients confirms psammoma bodies as perfectly specific
        for PTC on FNA cytology despite lower sensitivity, supporting their role as a high-value diagnostically
        specific feature.
