      assertion_type: Subtype
      assertion:
        name: HMS
        display_name: Haim-Munk syndrome (allelic CTSC disease)
        description: 'Allelic to PLS - the same gene, and in the defining study a mutation in the same
          CTSC codon as a classical PLS family. It adds arachnodactyly, acro-osteolysis, atrophic nail
          changes and a radiographic finger deformity to the shared keratoderma and periodontitis, and
          has been described only among descendants of a religious isolate originally from Cochin, India.

          Curated as a subtype rather than a separate entry because the causal gene, the protease-activation
          lesion and both cardinal features are shared; what differs is an additional skeletal phenotype
          whose mechanistic relation to cathepsin C loss is not established.'
      selected_evidence:
        snippet: a number of additional findings are reported in HMS including arachnodactyly, acro-osteolysis,
          atrophic changes of the nails, and a radiographic deformity of the fingers
        supports: SUPPORT
