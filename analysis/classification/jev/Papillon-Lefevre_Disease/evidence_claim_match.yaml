  b2a83811af85059fc1f84b82424ec14af8b5898685221cebcae15256abd94258:
    claim:
      about:
        disease:
          name: Papillon-Lefevre Disease
          disease_term:
            preferred_term: Papillon-Lefevre syndrome
            term:
              id: MONDO:0009490
              label: Papillon-Lefevre disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Granzyme Activation in Cytotoxic Lymphocytes
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: HYPOTHETICAL
        description: 'The second protease arm cathepsin C serves, and - unlike the neutrophil arm - a
          contested one in humans. Curated as a node so the disagreement is visible rather than resolved
          in one direction.

          The premise is not in doubt: cathepsin C activates granzymes A and B in the lytic granules of
          cytotoxic lymphocytes and NK cells by the same N-terminal dipeptide removal it performs on the
          neutrophil serine proteases. In DPPI-null mice the consequence is exactly what that predicts
          - granzymes A and B are present in normal amounts but retain their prodipeptide domains and
          are inactive, and cytotoxic assays show severe defects in target-cell apoptosis comparable to
          perforin-null or granzyme A/B double-null effectors.

          Humans with PLS do not follow. Direct measurement in patients found retained significant granzyme
          activity in the lymphokine-activated killer compartment and normal LAK-mediated cytotoxicity
          against K562 targets - a result the authors offered as the molecular explanation for the absence
          of a generalised T cell immunodeficiency phenotype in PLS. Against that, clinical reviews describe
          impaired NK cytotoxic function as the first consistent immune dysfunction reported in these
          patients, and propose it as a contributor to the periodontitis.

          Graded HYPOTHETICAL, and carrying no directional modifier, because a direct measurement in patients
          outranks a narrative review''s summary of prior reports, and the measurement points the other
          way. What is well supported is that this is a real disagreement worth resolving, not that the
          arm fails.'
        biological_processes:
        - preferred_term: natural killer cell mediated cytotoxicity
          term:
            id: GO:0042267
            label: natural killer cell mediated cytotoxicity
        cell_types:
        - preferred_term: natural killer cell
          term:
            id: CL:0000623
            label: natural killer cell
      selected_evidence:
        snippet: It plays a key role in the activation of serine proteases in cytotoxic T cells, natural
          killer cells (granzymes A and B), mast cells (chymase and tryptase) and neutrophils (cathepsin
          G, neutrophil elastase, proteinase 3)
        supports: SUPPORT
