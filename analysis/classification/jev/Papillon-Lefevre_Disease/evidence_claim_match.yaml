      assertion_type: IUISAssignment
      assertion:
        classification_value: phagocyte defect
        notes: 'IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970), Table 5 "Congenital
          defects of phagocyte number or function", section 2 (Defects of Motility): row "Papillon-Lefevre
          Syndrome CTSC AR 602365", affected cells N + M, affected function chemotaxis, associated features
          periodontitis and palmoplantar hyperkeratosis in some patients.

          The assignment is on the FUNCTIONAL axis of the table, not the quantitative one: cathepsin C
          loss leaves neutrophil numbers normal and disables the neutrophil serine-protease arm. That
          is consistent with the way this entry is curated — as a tissue-selective failure of oxygen-independent
          antimicrobial defence in the periodontal pocket rather than a systemic immunodeficiency — and
          the narrow IUIS affected-function cell (chemotaxis only) should be read as bounding the claim
          rather than asserting a broad phagocyte-killing defect.'
      selected_evidence:
        snippet: Papillon-Lefèvre Syndrome CTSC AR 602365
        supports: SUPPORT
