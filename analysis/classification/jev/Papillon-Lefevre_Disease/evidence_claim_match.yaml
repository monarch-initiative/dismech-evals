        context: []
      assertion_type: Genetic
      assertion:
        name: CTSC
        gene_term:
          preferred_term: CTSC
          term:
            id: hgnc:2528
            label: CTSC
        relationship_type: CAUSATIVE
        notes: 'The only established PLS gene. It lies on chromosome 11q14 and encodes cathepsin C / dipeptidyl
          peptidase I. Reported disease alleles include nonsense, frameshift, splice-site and missense
          changes; the active-site missense p.H405N and the p.Y168C substitution both abolish enzyme activity
          entirely, so allele class is a poor predictor of residual function here.

          A functional caveat that matters for diagnostics: a small number of patients with a PLS-like
          phenotype have normal urinary cathepsin C and no CTSC loss-of-function variant, so a clinical
          diagnosis of PLS is not by itself evidence of a CTSC lesion.'
      selected_evidence:
        snippet: The PLS locus has been mapped to chromosome 11q14-q21 (refs 7, 8, 9). Using homozygosity
          mapping in eight small consanguineous families, we have narrowed the candidate region to a 1.2-cM
          interval
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
