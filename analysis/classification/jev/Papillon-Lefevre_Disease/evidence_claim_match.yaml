      assertion_type: Pathophysiology
      assertion:
        name: Dysbiotic Subgingival Colonisation
        biological_scale: TISSUE
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'Subgingival plaque in PLS is dominated by Aggregatibacter actinomycetemcomitans,
          the organism whose leukotoxin PLS neutrophils cannot degrade and whose killing depends on the
          LL-37 they cannot generate. Other recognised periodontal pathogens - Porphyromonas gingivalis,
          Fusobacterium nucleatum, Treponema denticola, Prevotella intermedia - are also implicated.

          The direction of causation here is the standard periodontal one and is worth stating rather
          than assuming: the protease defect is what permits the colonisation, and the colonisation is
          what drives the inflammation. What is not established is whether A. actinomycetemcomitans is
          required - PLS-like periodontitis has not been shown to resolve when it is eradicated.'
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        locations:
        - preferred_term: gingiva
          term:
            id: UBERON:0001828
            label: gingiva
      selected_evidence:
        snippet: Subgingival plaque samples from periodontal pockets of PLS cases contain primarily Actinobacillus
          actinomycetemcomitans.
        supports: SUPPORT
