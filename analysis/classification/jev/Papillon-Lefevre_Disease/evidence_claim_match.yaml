      assertion_type: Pathophysiology
      assertion:
        name: Palmoplantar Epidermal Hyperkeratosis
        biological_scale: TISSUE
        role: consequence
        mechanism_confidence: HYPOTHETICAL
        description: 'The keratoderma itself, curated as a node with an honest confidence grade because
          the mechanism is not known. Cathepsin C is expressed in palmoplantar and gingival keratinocytes,
          and the standard proposal is that its loss impairs proteolytic turnover of corneodesmosomes
          so corneocytes are retained and the stratum corneum thickens. That proposal has not been demonstrated
          - no cathepsin C substrate in the epidermal desquamation pathway has been identified.

          Two observations argue against simply treating the keratoderma as a downstream consequence of
          the periodontal or immune phenotype. Skin and periodontal severity are uncorrelated in the largest
          cohort; and the skin changes appear in the first three years of life, before the deciduous dentition
          is destroyed.'
        biological_processes:
        - preferred_term: cornification
          term:
            id: GO:0070268
            label: cornification
          modifier: INCREASED
        - preferred_term: keratinocyte differentiation
