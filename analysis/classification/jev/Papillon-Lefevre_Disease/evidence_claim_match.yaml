  514ac6ebfbed9f1c48ff7754da55ec225e17ed53b6c32c04454ae3f8b3cce953:
    claim:
      about:
        disease:
          name: Papillon-Lefevre Disease
          disease_term:
            preferred_term: Papillon-Lefevre syndrome
            term:
              id: MONDO:0009490
              label: Papillon-Lefevre disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Oxygen-Independent Antimicrobial Defence
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'The mechanism that best explains why the periodontal pocket, of all sites, is where
          PLS neutrophils fail. Two protease-dependent, oxygen-independent functions are lost together.
          First, the proteases convert the neutrophil precursor hCAP-18 into the antimicrobial peptide
          LL-37, which is active against Aggregatibacter (formerly Actinobacillus) actinomycetemcomitans;
          PLS neutrophils release less LL-37 and cannot process hCAP-18 on ionomycin stimulation. Second,
          cathepsin G and elastase normally degrade the pore-forming leukotoxin that A. actinomycetemcomitans
          uses against phagocytes, and PLS neutrophils cannot, so they take more damage from it.

          The periodontal pocket has low oxygen tension, so defence there leans on exactly the oxygen-independent
          machinery that is missing. Graded PROVISIONAL rather than ESTABLISHED: the individual biochemical
          steps are demonstrated in patient cells, but the inference that this is *the* reason for the
          site selectivity is the authors'' hypothesis, not a tested one.'
        biological_processes:
        - preferred_term: antibacterial peptide production
          term:
            id: GO:0002778
            label: antibacterial peptide production
          modifier: DECREASED
        - preferred_term: defense response to bacterium
          term:
            id: GO:0042742
            label: defense response to bacterium
          modifier: DECREASED
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
      selected_evidence:
        snippet: We found that the PMNs of PLS patients released lower levels of LL-37. Furthermore, because
          of their deficiency in serine proteases, the PMNs of PLS patients were incapable of neutralizing
          the leukotoxin produced by this pathogen, which resulted in increased cell damage.
        supports: SUPPORT
