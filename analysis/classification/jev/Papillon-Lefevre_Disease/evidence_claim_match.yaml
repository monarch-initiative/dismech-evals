  26fa9c8e8e16a76455577549cff3612001a082d397d16cbf491bc82759444d48:
    claim:
      about:
        disease:
          name: Papillon-Lefevre Disease
          disease_term:
            preferred_term: Papillon-Lefevre syndrome
            term:
              id: MONDO:0009490
              label: Papillon-Lefevre disease
        context: []
      assertion_type: AnimalModel
      assertion:
        name: DPPI-null (Ctsc-/-) mouse
        species: Mouse
        genotype: DPPI-/- (cathepsin C / dipeptidyl peptidase I null)
        publication: PMID:10411926
        description: 'The model behind most of what is assumed about cathepsin C''s role in immune effector
          function, and - on the granzyme arm - the model human patients do not match.

          In DPPI-null cytotoxic lymphocytes, granzymes A and B are present in normal amounts but retain
          their prodipeptide domains and are inactive, and target cell apoptosis is severely defective
          at both early and late time points, to a degree comparable with perforin-null or granzyme A/B
          double-null effectors. That is a clean, strong result and it is what the biochemistry predicts.

          Humans with the same enzyme loss retain significant granzyme activity in the lymphokine-activated
          killer compartment and have normal LAK-mediated cytotoxicity. So this model is faithful to the
          activation chemistry and not to the human cellular outcome.'
        modeled_mechanisms:
        - target: Failure of Neutrophil Serine Protease Zymogen Activation
          relationship: RECAPITULATES
          fidelity: HIGH
          description: The neutrophil arm, measured directly in this model rather than inferred from the
            granzyme work. The DPPI-null mouse was made to test the role of the neutrophil serine proteases
            in inflammation, and it established that DPPI is required for the full activation of cathepsin
            G, neutrophil elastase and proteinase 3 - the same three enzymes, in the same compartment,
            as the human node.
          limitations: '"Full activation" is the paper''s own wording, and it leaves open whether residual
            activity remains in the mouse where human patients have none measurable. The functional consequences
            the model shows are inflammatory rather than infective - protection from antibody-induced
            arthritis, reduced response to zymosan and immune complexes - so it speaks to the proteases''
            role in driving inflammation rather than to host defence.'
          readouts:
          - name: Cathepsin G, neutrophil elastase and proteinase 3 activation
            target: Failure of Neutrophil Serine Protease Zymogen Activation
            direction: DECREASED
            interpretation: The three neutrophil serine proteases fail to reach full activity without
              DPPI - the direct murine counterpart of the human measurement.
        - target: Loss of Neutrophil Serine Proteases from Azurophil Granules
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: 'The divergence on the neutrophil arm, and arguably the more interesting one than
            the granzyme divergence. In the mouse the proteases are present and unprocessed - that is
            what "not fully activated" means, and it is what the granzyme work in the same model showed
            explicitly for granzymes A and B. In human PLS neutrophils they are not present at all: proteomic
            analysis found elastase, cathepsin G and proteinase 3 absent from azurophil granules, and
            bone-marrow work localised the loss to degradation in mature cells after normal synthesis
            and sorting.

            So cathepsin C''s second, chaperone-like role - protecting these proteases from degradation,
            separate from activating them - is a human finding that this model does not show. A therapy
            that restored the activating cleavage would be sufficient in the mouse and insufficient in
            the patient.'
          limitations: 'The divergence is inferred from a comparison across two studies rather than measured
            head to head: no cached reference reports protease abundance in DPPI-null mouse neutrophils.
            What the mouse work establishes is unprocessed granzymes at normal abundance in cytotoxic
            lymphocytes; the neutrophil compartment is assumed to behave the same way. Graded LOW fidelity
            for that reason as much as for the divergence itself.'
          readouts:
          - name: Neutrophil serine protease abundance
            target: Loss of Neutrophil Serine Proteases from Azurophil Granules
            direction: UNCHANGED
            interpretation: Zymogen abundance is preserved in the model - normal amounts of unprocessed
              enzyme - against complete absence of the mature proteases in human patients.
        - target: Granzyme Activation in Cytotoxic Lymphocytes
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: The mouse has a severe cytotoxic defect; human patients do not. This is the specific
            place where model and disease diverge, and it is why the human node it points at is graded
            HYPOTHETICAL.
          limitations: The divergence is in the functional outcome rather than in the enzymology. Mouse
            cytotoxic lymphocytes lose granzyme activity and target-cell killing; PLS patients retain
            both in the lymphokine-activated killer compartment. Any inference from this model to human
            cytotoxic function is therefore unsupported - including inferences about the safety of cathepsin
            C inhibition, which cut in the opposite direction to the mouse.
          readouts:
          - name: Cytotoxic lymphocyte target-cell apoptosis
            target: Granzyme Activation in Cytotoxic Lymphocytes
            direction: DECREASED
            interpretation: Severe defect in the mouse, against normal LAK-mediated cytotoxicity in human
              patients.
      selected_evidence:
        snippet: Although mice deficient in DPPI have defects in serine protease activation in multiple
          cellular compartments, the role of DPPI for human serine protease activation is largely undefined.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15585850
      reference_title: 'Papillon-Lefèvre syndrome: correlating the molecular, cellular, and clinical consequences
        of cathepsin C/dipeptidyl peptidase I deficiency in humans.'
      evidence_source: HUMAN_CLINICAL
      explanation: The framing that motivated the human study, and the scope of the model. Graded PARTIAL
        because it establishes both what the model shows and the limit of what could be inferred from
        it.
