            description: 'The divergence on the neutrophil arm, and arguably the more interesting one
              than the granzyme divergence. In the mouse the proteases are present and unprocessed - that
              is what "not fully activated" means, and it is what the granzyme work in the same model
              showed explicitly for granzymes A and B. In human PLS neutrophils they are not present at
