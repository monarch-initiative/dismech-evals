      assertion_type: Pathophysiology
      assertion:
        name: Lysosomal Permeabilisation and Autophagic Flux Failure
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'A second, non-neutrophil consequence of cathepsin C loss, and currently the only
          mechanistic proposal that could reach the skin. In fibroblasts cultured from PLS patients, autophagic
          flux is blocked with autophagosomes accumulating, oxidative status and oxygen consumption are
          altered, lysosomes become permeable, cathepsin B is released into the cytosol and the NLRP3
          inflammasome is activated. Recombinant cathepsin C added to the mutant fibroblasts improved
          growth and autophagic flux and partially restored lysosomal integrity, which is the rescue that
          makes the causal direction credible.

          Graded PROVISIONAL: this is a single study in cultured skin fibroblasts, not keratinocytes,
          and no one has shown that it is what produces the hyperkeratosis. It is included because it
          is the best available candidate and because the rescue experiment gives it a therapeutic reading.'
        biological_processes:
        - preferred_term: autophagosome maturation
          term:
            id: GO:0097352
            label: autophagosome maturation
          modifier: DECREASED
        - preferred_term: pyroptotic inflammatory response
          term:
            id: GO:0070269
            label: pyroptotic inflammatory response
          modifier: INCREASED
        cell_types:
        - preferred_term: dermal fibroblast
          term:
            id: CL:0002551
            label: fibroblast of dermis
      selected_evidence:
        snippet: Mutant fibroblasts from patients with PLS showed alterations in oxidative/antioxidative
          status, reduced oxygen consumption, and a marked autophagic dysfunction associated with autophagosome
          accumulation. These alterations were accompanied by lysosomal permeabilization, cathepsin B
          release, and NLR family pyrin domain containing 3 (NLRP3) inflammasome activation.
        supports: SUPPORT
