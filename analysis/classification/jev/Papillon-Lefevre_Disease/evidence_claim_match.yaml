          is destroyed rather than merely infected. PLS neutrophils are not quiescent: they release more
          proinflammatory cytokine both unstimulated and stimulated, generate more reactive oxygen species,
          and the chemoattractants MIP-1-alpha and CXCL8 are elevated in them and in plasma. Combined
          with impaired directional chemotaxis - cells that move but not accurately, so spend longer in
          transit through the tissue - this gives continuous recruitment of hyperreactive neutrophils
          into a site they cannot sterilise.

          Graded PROVISIONAL: the cellular measurements are from a single five-patient cohort, and the
          destructive-cycle model built on them is the authors'' proposal.'
