      assertion_type: Biochemical
      assertion:
        name: Urinary Cathepsin C
        notes: Proteolytically active cathepsin C and its proform are constitutively excreted in the urine
          of healthy people across the age range, and are absent in PLS. This makes urine a low-cost diagnostic
          matrix where genetic testing is unavailable.
      selected_evidence:
        snippet: All 75 urine samples from healthy control subjects (aged 3 months to 80 years) contained
          proteolytically active CatC and its proform, as revealed by kinetic analysis and immunochemical
          detection. Of the urine samples of 31 patients with a PLS phenotype, 29 contained neither proteolytically
          active CatC nor the CatC antigen
        supports: SUPPORT
