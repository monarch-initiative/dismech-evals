  49a946194297463eb6eeccfb0203e09d51c0897a761cb043f9dbf90fe1bfd09c:
    claim:
      about:
        disease:
          name: Papillon-Lefevre Disease
          disease_term:
            preferred_term: Papillon-Lefevre syndrome
            term:
              id: MONDO:0009490
              label: Papillon-Lefevre disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pls_nsp_dispensable_in_humans
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why are neutrophil serine proteases essential for antimicrobial defence in mouse knockouts
          but apparently dispensable in humans who lack all three?
        attaches_to:
        - pathophysiology#Loss of Neutrophil Serine Proteases from Azurophil Granules
        - pathophysiology#Failure of Oxygen-Independent Antimicrobial Defence
        - pathophysiology#Granzyme Activation in Cytotoxic Lymphocytes
        - animal_models#DPPI-null (Ctsc-/-) mouse
        rationale: 'Curated as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the evidence exists
          on both sides and disagrees. Mouse knockout studies assign elastase, cathepsin G and proteinase
          3 a crucial role in defence against Staphylococcus aureus, Escherichia coli, Candida albicans
          and Klebsiella pneumoniae. Humans who lack the activity of all three - which is what PLS is
          - are not correspondingly infection-prone: they do not get Pneumocystis or disseminated fungal
          disease, their neutrophil counts, morphology, priming, radical production and apoptosis regulation
          are within the control range, and PLS neutrophils have been reported to kill bacteria in vitro
          about as well as control cells.

          The authors of the proteomic study state the conclusion in its strongest form - that neutrophil
          serine proteases are dispensable for human immunoprotection. That is the claim this discussion
          exists to flag rather than to endorse: it rests on the clinical phenotype of a small number
          of patients, and PLS patients do have a distinctive and severe infection-linked pathology, just
          one confined to the periodontium and, occasionally, the liver. A more careful reading is that
          the requirement is site-specific rather than absent, and that mouse challenge models - systemic
          inoculation of a defined pathogen - are not built to detect a defect that manifests as chronic
          destruction in an anaerobic mucosal pocket.

          The granzyme arm makes the same point twice over, and it is the sharper version of it. In DPPI-null
          mice granzymes A and B are present but unprocessed and inactive, with a cytotoxic defect as
          severe as a perforin-null. In PLS patients granzyme activity in the lymphokine-activated killer
          compartment is retained and LAK-mediated cytotoxicity is normal - which the authors offered
          as the molecular explanation for the absence of a generalised T cell immunodeficiency in PLS.
          So on the arm where the mouse prediction is strongest and cleanest, the human result is the
          opposite.

          There is also a direct measurement on the bacterial-killing question, which is worth having
          because it separates two claims that are easy to run together: neutrophils from PLS patients
          do not uniformly have a defect in killing Staphylococcus aureus and Escherichia coli, suggesting
          that serine proteases are not the major mechanism human neutrophils use against common bacteria.
          That is a statement about human neutrophil biology, not about disease severity, and it is what
          makes the mouse-to-human extrapolation unsafe rather than merely imprecise.

          Resolving it matters practically, because cathepsin C inhibitors are in clinical development
          for neutrophil-driven inflammatory disease, and PLS is the natural experiment those programmes
          cite for their safety case. The direction of the error matters there too: the mouse over-predicts
          harm, so a safety case built on it is conservative, while a mechanistic case for efficacy built
          on it is not.'
        proposed_experiments:
        - experiment_id: pls_ctsc_null_oral_challenge
          name: Oral-cavity challenge in a Ctsc-null mouse
          description: Compare periodontal bone loss and subgingival microbiota in Ctsc-null and wild-type
            mice after oral colonisation with Aggregatibacter actinomycetemcomitans, rather than by systemic
            challenge. Tests whether the species difference is in the protease requirement itself or in
            which compartment the assay interrogates.
          would_support:
          - pathophysiology#Failure of Oxygen-Independent Antimicrobial Defence
          supporting_outcome:
          - Ctsc-null mice develop accelerated alveolar bone loss with A. actinomycetemcomitans colonisation
            while remaining resistant to systemic challenge with the same organism.
          refuting_outcome:
          - Ctsc-null mice show no more periodontal bone loss than wild-type after oral colonisation,
            which would place the site selectivity in human-specific tissue biology rather than in the
            protease requirement.
      selected_evidence:
        snippet: Despite serine protease-deficient immune cell populations, PLS patients do not exhibit
          marked immunodeficiency.
        supports: SUPPORT
