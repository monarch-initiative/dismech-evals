            label: keratinocyte
        locations:
        - preferred_term: skin of palm and sole
          term:
            id: UBERON:0013776
            label: skin of palmar/plantar part of autopod
      selected_evidence:
        snippet: No significant correlation could be demonstrated between the level of periodontal infection
          and severity of skin affections, supporting the concept that these 2 major components of Papillon-Lefèvre
          syndrome are unrelated to each other.
