      assertion_type: Transmission
      assertion:
        name: Faecal-oral and oral-oral spread
        description: Poliovirus is shed in stool and pharyngeal secretions and passes between people by
          the faecal-oral route, with oral-oral spread also recognised. Transmission is therefore highest
          where water, sanitation and hygiene infrastructure is poor. Most transmission is from people
          with no symptoms, since only a small minority of infections become paralytic.
      selected_evidence:
        snippet: Poliomyelitis, or polio, is an infection transmitted via the fecal-oral and oral-oral
          routes by the poliovirus.
        supports: SUPPORT
