  4d7e8c0904515404af8d8765d841b83042d7d4fe438afbd97c46eb2232d05a73:
    claim:
      about:
        disease:
          name: Paralytic Poliomyelitis
          disease_term:
            preferred_term: paralytic poliomyelitis
            term:
              id: MONDO:0000341
              label: paralytic poliomyelitis
        context: []
      assertion_type: InfectiousAgent
      assertion:
        name: Poliovirus
        infectious_agent_term:
          preferred_term: Poliovirus
          description: 'Left unbound deliberately. NCBITaxon has no species-level "Poliovirus" node: it
            carries only serotype terms (NCBITaxon:12080 Poliovirus 1, NCBITaxon:12083 Poliovirus 2, NCBITaxon:12086
            Poliovirus 3) plus strain-level descendants, and the species-level parent NCBITaxon:138950
            "Enterovirus C" also contains the coxsackie A viruses and is therefore too broad. Because
            paralytic poliomyelitis is caused by all three serotypes, no single serotype term fits either.
            The has_subtypes entries below divide the agent on the WPV-versus-VDPV origin axis rather
            than by serotype, so the serotype terms do not fit there either and are deliberately left
            unbound throughout.'
        description: 'Poliovirus circulates as two epidemiologically distinct forms relevant to global
          eradication. Wild poliovirus (WPV, serotypes 1-3) is the naturally circulating virus targeted
          for eradication. Vaccine-derived poliovirus (VDPV) instead arises when the live attenuated oral
          poliovirus vaccine (OPV) replicates for a prolonged period in an under-vaccinated community
          and reverts toward wild-type neurovirulence and transmissibility, producing paralytic disease
          clinically indistinguishable from WPV infection. VDPVs are further divided by the setting in
          which that reversion occurred: circulating VDPV (cVDPV) sustains person-to-person transmission
          in an under-vaccinated community, immunodeficiency-associated VDPV (iVDPV) arises from prolonged
          replication in a person with a B-cell immunodeficiency, and ambiguous VDPV (aVDPV) covers isolates
          that fit neither. cVDPV is the form that drives outbreaks and is the target of monovalent OPV2
          response campaigns.'
        has_subtypes:
        - name: WPV
          display_name: Wild poliovirus (WPV, serotypes 1-3)
          description: The naturally circulating, non-vaccine-derived virus targeted for global eradication.
            Wild serotypes 2 and 3 have been certified eradicated; WPV1 remains endemic in Afghanistan
            and Pakistan.
        - name: VDPV
          display_name: Vaccine-derived poliovirus (VDPV), including circulating VDPV (cVDPV)
          description: Virus descended from the live attenuated OPV strains that has reverted toward wild-type
            neurovirulence and transmissibility during prolonged replication. Genetically identified by
            divergence from the parent Sabin strain in the VP1 capsid-coding region. The circulating subform
            (cVDPV) is the outbreak-driving form; VDPV2 is the serotype responsible for the majority of
            contemporary cVDPV outbreaks.
      selected_evidence:
        snippet: VDPVs can emerge when live, attenuated OPV is administered in a community with low vaccination
          coverage. Replication of OPV in a person who was recently vaccinated can result in viral reversion
          to neurovirulence, which can cause paralytic poliomyelitis in unvaccinated persons who are exposed
          to the vaccine-derived virus.
        supports: SUPPORT
    origin:
      assertion_path: /infectious_agent/0
      evidence_path: /infectious_agent/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35980868
      reference_title: Public Health Response to a Case of Paralytic Poliomyelitis in an Unvaccinated
        Person and Detection of Poliovirus in Wastewater - New York, June-August 2022.
      evidence_source: HUMAN_CLINICAL
      explanation: Describes the mechanism by which vaccine-derived poliovirus (VDPV) emerges from OPV
        and causes paralytic disease, distinguishing it from wild poliovirus.
