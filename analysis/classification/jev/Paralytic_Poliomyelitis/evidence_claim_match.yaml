          become paralytic, environmental surveillance detects community transmission that clinical surveillance
          misses, and can do so before and after any paralytic case presents. Sequencing links wastewater
          isolates genetically to a known case and distinguishes vaccine-derived from wild virus on the
          same VP1 criterion used for clinical specimens.
        diagnosis_term:
