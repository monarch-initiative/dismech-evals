      assertion_type: Environmental
      assertion:
        name: Tobacco Smoking
        description: Tobacco smoke exposes sinonasal squamous epithelium to carcinogens that promote DNA
          damage and malignant transformation.
        exposure_term:
          preferred_term: exposure to tobacco smoking
          term:
            id: ECTO:6000029
            label: exposure to tobacco smoking
        notes: Deliberately left unlinked to a pathophysiology node, despite the cited case-control association.
          Tobacco carries no pooled sinonasal-specific risk estimate in the occupational meta-analysis
          this entry's other exposures are drawn from, so an `influences_mechanisms` edge would rest on
          a single study of a different design from the ones supporting the wood-dust and nickel edges.
          The exposure is retained and cited because tobacco is a recognized cofactor for the keratinizing
          subtype; what is withheld is the mechanism edge, not the association.
      selected_evidence:
        snippet: The association was strongest for squamous cell carcinoma among recent users of tobacco
          (RR = 3.1, P less than 0.05, one-sided)
        supports: SUPPORT
