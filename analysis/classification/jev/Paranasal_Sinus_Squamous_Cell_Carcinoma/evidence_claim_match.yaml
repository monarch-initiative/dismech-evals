        - preferred_term: apoptotic process
          modifier: DECREASED
          term:
            id: GO:0006915
            label: apoptotic process
      selected_evidence:
        snippet: highly recurrent TP53 mutations, CDKN2A mutations, and/or CDKN2A copy-number losses were
          detected; overall, nearly all tumors (n = 28/29; 96.6%) harbored at least one TP53 or CDKN2A
          alteration.
        supports: SUPPORT
