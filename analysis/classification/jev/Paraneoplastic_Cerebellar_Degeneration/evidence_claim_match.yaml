      assertion:
        name: Immune checkpoint inhibitor therapy
        description: 'Anti-PD-1, anti-PD-L1 and anti-CTLA-4 therapy can trigger a cerebellar syndrome
          that is clinically and immunologically continuous with spontaneous paraneoplastic cerebellar
          degeneration. It is the one exposure in this disease with a mechanism that is not merely plausible
          but by design: checkpoint inhibitors work by removing the restraint on an antitumour T-cell
          response, and this entry''s trigger node is an antitumour response that has become cross-reactive
          with Purkinje cells.

          Curated as an exposure rather than as a subtype because the resulting syndrome is not clearly
          the same disease - see the discussion pcd_ici_triggered_same_disease.'
        exposure_term:
          preferred_term: exposure to an immune checkpoint inhibitor
