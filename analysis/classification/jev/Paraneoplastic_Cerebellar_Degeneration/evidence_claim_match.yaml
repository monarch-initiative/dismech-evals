      assertion_type: Diagnosis
      assertion:
        name: Antibody-guided imaging search for the primary tumour
        description: 'Which antibody is found determines where and how hard to look. Current guidance
          is that the antibody, more than the clinical syndrome, sets the risk and type of the underlying
          malignancy, and prescribes a modality sequence per body region rather than a single scan. It
          also sets a duration: a negative first search is repeated at 3 to 6 months and then six-monthly
          for up to four years, because the neurological syndrome almost always precedes the cancer.'
      selected_evidence:
        snippet: the nature of antibody, and to a lesser extent the clinical syndrome, determines the
          risk and type of an underlying malignancy.
        supports: SUPPORT
