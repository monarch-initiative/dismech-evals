      evidence_source: MODEL_ORGANISM
      explanation: 'Names the antigen and states its cytoplasmic location, the fact the canonical hypothesis
        rests on, and states that both antibodies and cytotoxic T cells against it are present in patients
        - which is why the effector question is a controversy here rather than a settled point.

        Regraded MODEL_ORGANISM in review. The cited paper is a BALB/c mouse DNA-immunisation study, and
        evidence_source classifies the publication rather than the quoted sentence, even where that sentence
        is itself reporting a human observation. Graded INDIRECT for the same reason. The claim it supports
        is not species-contingent and is independently supported by PMID:27606347 elsewhere in this entry.'
