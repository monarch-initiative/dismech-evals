      assertion_type: Treatment
      assertion:
        name: B-Cell Depletion
        therapeutic_modality: MONOCLONAL_ANTIBODY
        description: 'Anti-CD20 monoclonal antibodies - rituximab, and more recently ofatumumab - as second-line
          treatment when first-line immunotherapy fails. It is the most mechanistically targeted option
          available, and like plasma exchange its rationale depends on the antibody arm mattering.

          The evidence available for this record is two single cases and it is deliberately not presented
          as more than that. Both are reported as favourable outcomes, and favourable single cases are
          the ones that get published. Note also that the mGluR1 case is a surface-antigen disease with
          a much better baseline prognosis, so it should not be read as evidence for B-cell depletion
          in anti-Yo disease.'
        treatment_term:
          preferred_term: Pharmacotherapy
