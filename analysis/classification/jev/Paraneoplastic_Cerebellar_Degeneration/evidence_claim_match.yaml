              label: Ofatumumab
          - preferred_term: rituximab
            term:
              id: NCIT:C1702
              label: Rituximab
      selected_evidence:
        snippet: As the initial treatment was insufficient, rituximab was administered, leading to significant
          improvement, including the ability to walk unaided.
