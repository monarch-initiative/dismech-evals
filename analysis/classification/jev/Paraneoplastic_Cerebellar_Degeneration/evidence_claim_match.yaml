        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Antibody-Mediated Purkinje Cell Dysfunction
        role: central_effector
        biological_scale: TISSUE
        description: The surface-antigen arm, seen with anti-P/Q-VGCC. Purkinje cell loss is focal rather
          than diffuse, predominantly affecting the upper vermis while caudal regions and lateral hemispheres
          are spared. There is no MHC class I upregulation and no complement deposition, so this is not
          a cytotoxic attack. The channel itself is downregulated and synaptophysin reduced, and axonal
          spheroids with accumulated amyloid precursor protein and GRP78 indicate endoplasmic reticulum
          stress and failing axonal transport - a picture of neuronal dysfunction preceding neuronal death.
        cell_types:
        - preferred_term: Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        locations:
        - preferred_term: cerebellar cortex
          term:
            id: UBERON:0002129
            label: cerebellar cortex
      selected_evidence:
        snippet: In contrast, PC loss in anti-P/Q-VGCC-PCD was focal and predominantly affected the upper
          vermis, whereas caudal regions and lateral hemispheres were spared.
        supports: SUPPORT
