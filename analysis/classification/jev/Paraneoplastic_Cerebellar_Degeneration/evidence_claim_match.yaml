        measure_type: ANNUAL_INCIDENCE
        prevalence_class: BAND_1_9_PER_100000
        rate_per_100000: 0.89
        rate_denominator: PERSON_YEARS
        notes: 'This figure is for paraneoplastic neurological syndromes as a class, not for cerebellar
          degeneration specifically. It is curated because it is the only population-based estimate available
          anywhere near this disease, and because a reader otherwise has nothing but the qualitative "rare"
          above. It must not be read as a PCD incidence.

          The study does report what share is cerebellar degeneration: 28% of its PNS cases, second to
          limbic encephalitis at 31%. Multiplying gives roughly 0.25 per 100,000 person-years, but that
          product is not curated as its own record because no source states it - the 28% is a share of
          cases, not of incidence, and treating the two as interchangeable assumes a uniform detection
          rate across syndromes that the study does not establish. The arithmetic is recorded here so
          a reader can weigh it without it being presented as a finding.

          The population string and the fraction claim on this record were both corrected in review; the
          history record for that round carries what changed and why.'
      selected_evidence:
        snippet: The incidence of PNS was 0.89/100,000 person-years.
        supports: SUPPORT
        directness: INDIRECT
