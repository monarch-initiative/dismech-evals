      assertion_type: Genetic
      assertion:
        name: CDR2
        gene_term:
          preferred_term: CDR2
          term:
            id: hgnc:1799
            label: CDR2
        relationship_type: BIOMARKER
        association: The onconeural antigen itself. CDR2 is a cytoplasmic Purkinje cell protein ectopically
          expressed by the tumour and is the target of the anti-Yo response.
        notes: 'This is not a disease gene and is deliberately not typed as one. Nobody inherits paraneoplastic
          cerebellar degeneration, and no germline CDR2 variant causes it. CDR2 is curated here because
          the entry''s central mechanistic claim is about a specific antigen, and an entry that names
          an antigen in prose without giving it an identifier is not queryable by that antigen.

          relationship_type is BIOMARKER rather than CAUSATIVE, RISK_FACTOR or SUSCEPTIBILITY. None of
          those fits: the gene is not mutated, not a risk allele, and not a susceptibility locus. What
          CDR2 is, is the molecular identity of the thing the immune system attacks. BIOMARKER is the
          closest available value and it is still an imperfect fit - see the entry-level notes.

          The antigen''s intracellular location is the mechanical argument behind the CANONICAL hypothesis,
          so getting the identifier right matters. Note that the deep-research report and the round-1
          review both proposed hgnc:1802 for CDR2; hgnc:1802 is CDSN (corneodesmosin), an unrelated skin
          gene. The correct identifier is hgnc:1799, confirmed against the ontology.'
      selected_evidence:
        snippet: Paraneoplastic cerebellar degeneration associated with gynecological and breast malignancies
          (PCD) is known to develop autoantibodies and autoreactive cytotoxic T lymphocytes (CTLs) specific
          for a cytoplasmic protein of Purkinje cells PCD17/cdr2, in the blood of patients.
        supports: SUPPORT
        directness: INDIRECT
