  c6cd0b846ddda05649a73fe33415234aca9e9cd087ce6c6904f7e6968b9570c7:
    claim:
      about:
        disease:
          name: Paraneoplastic Cerebellar Degeneration
          disease_term:
            preferred_term: paraneoplastic cerebellar degeneration
            term:
              id: MONDO:0044877
              label: paraneoplastic cerebellar degeneration
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pcd_ici_triggered_same_disease
        kind: INTERPRETATION
        prompt: Is checkpoint-inhibitor-triggered cerebellar ataxia the same disease as spontaneous paraneoplastic
          cerebellar degeneration, or a distinct drug toxicity that resembles it?
        attaches_to:
        - environmental#Immune checkpoint inhibitor therapy
        - pathophysiology#Antitumour Immune Response Cross-Reactive with Purkinje Cells
        rationale: 'The case for one disease is mechanistic and strong. Checkpoint inhibitors act by removing
          restraint from an antitumour T-cell response, which is exactly the response this entry''s trigger
          node describes; about half of affected patients carry a neuronal antibody; and the syndrome
          is cerebellar. If the spontaneous disease is a failure of tolerance in an antitumour response,
          the drug version is that failure induced deliberately.

          The case against is empirical and also strong. The one study that compares the two directly
          finds them significantly different on four axes at once - sex, tumour type, whether the ataxia
          is isolated, and outcome. Male predominance and lung cancer are the inverse of the anti-Yo picture,
          which is female and gynaecological. A better outcome is the difference that matters clinically,
          and it is not a small one.

          The entry does not resolve this. It curates the exposure and its mechanism link, and does not
          create a subtype, because a subtype would assert sameness that the comparative data do not support.
          Nor is it excluded, because excluding it would assert difference on the strength of one retrospective
          comparison of 35 against 15 patients.

          Worth stating what would settle it: whether the antibody-defined subgroup of checkpoint-inhibitor
          cases behaves like its spontaneous counterpart. The comparison available pools antibody-positive
          and antibody-negative cases together, so the better outcome could belong entirely to the antibody-negative
          half and tell us nothing about whether anti-Yo disease triggered by a drug differs from anti-Yo
          disease arising on its own.'
      selected_evidence:
        snippet: When compared with a series of PCA (n = 15), the cerebellar irAE group was significantly
          more associated with male sex, lung cancer (rather than gynecological/breast cancers), isolated
          ataxia, and a better outcome.
        supports: SUPPORT
