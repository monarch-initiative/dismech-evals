  75dd642bf1e2cb842969bc7c159dc7b410c3abcf61e879dde0fa117d6cc822cc:
    claim:
      about:
        disease:
          name: Paraneoplastic Cerebellar Degeneration
          disease_term:
            preferred_term: paraneoplastic cerebellar degeneration
            term:
              id: MONDO:0044877
              label: paraneoplastic cerebellar degeneration
        context:
        - path: /animal_models/2
          value:
            name: DNA immunization raising both anti-Yo antibodies and CDR2-specific cytotoxic T cells
            species: Mouse
            genotype: Wild-type BALB/c immunized with naked pcd17 (CDR2) cDNA
            description: 'The most demanding of the four transfer and immunization experiments, and the
              one this entry treats as most informative. DNA immunization generated both arms of the human
              immune response at once - anti-Purkinje cell autoantibodies and CDR2-specific cytotoxic
              T lymphocytes able to lyse peptide-pulsed targets - and still produced no clinical or pathological
              cerebellar degeneration.

              It is curated because it does not favour either hypothesis in this entry. The other three
              experiments fail to transfer antibody-mediated disease and so support the T-cell reading
              by elimination. This one raises the T cells too, and still fails.'
            publication: PMID:11771954
            notes: 'Read together with the two transfer experiments above, these four studies say something
              the entry''s two hypotheses do not: no experimental reconstruction of either arm of the
              human immune response has produced the disease in an animal. That is recorded as a knowledge
              gap rather than resolved, and it is the reason the canonical hypothesis is argued from human
              neuropathology and from the antigen''s compartment rather than from a model.'
          role: ancestor
        - path: /animal_models/2/modeled_mechanisms/0
          value:
            target: Cytotoxic T Cell-Mediated Purkinje Cell Destruction
            relationship: FAILS_TO_RECAPITULATE
            fidelity: MODERATE
            model_scale: ORGANISM
            description: A CDR2-specific cytotoxic T-cell response demonstrably capable of lysing peptide-pulsed
              targets does not, on its own, produce cerebellar degeneration in vivo.
            limitations: The T cells were shown to lyse syngeneic myeloma cells pulsed with peptide -
              an artificial target presenting the epitope at high density. That is not evidence they could
              recognise a Purkinje cell, which presents endogenous antigen and which upregulates MHC class
              I in human disease but need not do so in an unmanipulated mouse. So the experiment shows
              that raising CDR2-specific CTLs is not sufficient; it does not show that the CTLs generated
              were the same effector population as in patients.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Cerebellar degeneration after CDR2 DNA immunization
        target: Cytotoxic T Cell-Mediated Purkinje Cell Destruction
        direction: UNCHANGED
        interpretation: No degeneration, despite both effector arms being present. This is the strongest
          single argument in the entry that the mechanism is not yet fully accounted for by either hypothesis.
      selected_evidence:
        snippet: In spite of the generation of anti-Purkinje cell antibodies and PCD17-specific CTLs in
          vivo, neither clinical nor pathological changes consistent with significant cerebellar degeneration
          have been detected.
        supports: REFUTE
