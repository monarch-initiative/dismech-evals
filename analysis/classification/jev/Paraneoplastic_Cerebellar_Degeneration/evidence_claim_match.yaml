  cc0ea4b8468ca2b17918c08d73fe88dcfd4d2e15473f9b8aee2d8c34267167d4:
    claim:
      about:
        disease:
          name: Paraneoplastic Cerebellar Degeneration
          disease_term:
            preferred_term: paraneoplastic cerebellar degeneration
            term:
              id: MONDO:0044877
              label: paraneoplastic cerebellar degeneration
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pcd_antibody_mediated_surface
        hypothesis_label: Direct antibody-mediated Purkinje cell dysfunction against a surface antigen
        status: ALTERNATIVE
        description: 'In surface-antigen forms the autoantibody plausibly causes the disease directly,
          by acting on a target it can physically reach in a living cell. In anti-P/Q-VGCC disease that
          is altered synaptic transmission at the channel, producing calcium dysregulation and eventual
          Purkinje cell death. It is curated as ALTERNATIVE rather than as a competing account of the
          same disease, because it describes a different antigen class - the two hypotheses are not rivals
          for one mechanism so much as two mechanisms sharing a syndrome.

          The compartment rule is not built on the anti-P/Q-VGCC case. Anti-Tr/DNER and anti-mGluR1 are
          the other well-characterised surface-antigen cerebellar syndromes, and they behave as the rule
          predicts: anti-Tr binds the extracellular domain of DNER, and anti-mGluR1 disease responds to
          immunotherapy in most patients where anti-Yo disease does not. What rests on the single case
          is the neuropathological contrast - MHC class I, complement deposition, topography of cell loss
          - and that narrower claim is where the knowledge gap in this entry is scoped.'
      selected_evidence:
        snippet: Anti-Tr antibodies bind to the extracellular domain of DNER and can be detected by RC-IFA
          using HEK293 cells expressing the recombinant receptor.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25745634
      reference_title: Standardized test for anti-Tr/DNER in patients with paraneoplastic cerebellar degeneration.
      evidence_source: IN_VITRO
      explanation: Establishes that a second onconeural antibody in this syndrome targets an extracellular
        domain, which is the physical precondition this hypothesis rests on. Graded IN_VITRO because the
        localisation is established by a recombinant cell-based assay, not in patients.
