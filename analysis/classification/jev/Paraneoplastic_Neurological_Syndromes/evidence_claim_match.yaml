              are found to have a tumour, and in those the tumour is neuroblastic, most often neuroblastoma.
              The tumours of affected children carry a distinctive immune infiltrate - diffuse and extensive
              lymphocytic infiltration with lymphoid follicles, which matched controls do not show - and
              that infiltrate is a polyclonal expansion of both B and T cells organised into tertiary
              lymphoid structures, with no single antigenic stimulus identified. Commercially screened
              serum autoantibodies are negative in this setting while cerebrospinal fluid oligoclonal
              bands and B cells are present, so the humoral signal is intrathecal rather than a serum
              antibody. Which arm of the response injures the brain is unsettled; see the knowledge gap
              in discussions.'
