  5c82f35d049ae0e03e41e83fea70278fd5858d9392af2b2bcfb243f85a467571:
    claim:
      about:
        disease:
          name: Paraneoplastic Neurological Syndromes
          disease_term:
            preferred_term: paraneoplastic neurologic syndrome
            term:
              id: MONDO:0018215
              label: paraneoplastic neurologic syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Tumor-Infiltrating Polyclonal Lymphoid Response
        biological_scale: TISSUE
        description: 'A third mechanism arm, and the one that fits neither of this entry''s two antibody-defined
          subtypes. In children, opsoclonus-myoclonus syndrome is the paraneoplastic syndrome characteristic
          of neuroblastic tumours: about half of children presenting with OMS in referral cohorts are
          found to have a tumour, and in those the tumour is neuroblastic, most often neuroblastoma. The
          tumours of affected children carry a distinctive immune infiltrate - diffuse and extensive lymphocytic
          infiltration with lymphoid follicles, which matched controls do not show - and that infiltrate
          is a polyclonal expansion of both B and T cells organised into tertiary lymphoid structures,
          with no single antigenic stimulus identified. Commercially screened serum autoantibodies are
          negative in this setting while cerebrospinal fluid oligoclonal bands and B cells are present,
          so the humoral signal is intrathecal rather than a serum antibody. Which arm of the response
          injures the brain is unsettled; see the knowledge gap in discussions.'
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
        - preferred_term: B cell activation
          modifier: INCREASED
          term:
            id: GO:0042113
            label: B cell activation
        - preferred_term: T cell proliferation
          modifier: INCREASED
          term:
            id: GO:0042098
            label: T cell proliferation
      selected_evidence:
        snippet: Pathology slides from a total of 54 neuroblastoma tumors were reviewed blindly. They
          included 13 tumors associated with opsoclonus-myoclonus and 41 age- and stage-matched controls.
          ... Twelve of 13 cases had diffuse (found in every section prepared from the multiple portions
          of the primary tumor) and extensive (occupying more than 50% of a single of multiple microscopic
          fields with x 100 magnification) lymphocytic infiltration with lymphoid follicles. Of the 41
          control cases (27 FH and 14 UH tumors), 18 had focal areas of lymphocytic infiltration and six
          showed lymphoid follicles, but none had diffuse or extensive infiltration in their primary tumors.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11344493
      reference_title: 'Opsoclonus-myoclonus-ataxia syndrome in neuroblastoma: histopathologic features-a
        report from the Children''s Cancer Group.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'The controlled histology this node rests on: 13 OMS-associated tumours against 41
        age- and stage-matched controls, read blind, with 12 of 13 showing diffuse and extensive lymphocytic
        infiltration with lymphoid follicles and none of the 41 controls showing it. The quote carries
        the authors'' own definitions of diffuse and extensive, which is why they are not paraphrased
        here.'
