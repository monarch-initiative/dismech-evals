      assertion_type: Definition
      assertion:
        name: Opsoclonus-myoclonus exception to the antibody requirement
        definition_type: CASE_DEFINITION
        description: 'Opsoclonus-myoclonus syndrome is the one named exception in the 2021 PNS-Care criteria.
          Definite PNS otherwise requires a high- or intermediate-risk antibody; OMS occurring with neuroblastoma
          or small-cell lung cancer is accepted as definite PNS without one, because the syndrome has
          no specific antibody association in either setting. In children that matters for a practical
          reason: a negative commercial autoantibody panel does not argue against neuroblastoma-associated
          OMS, and should not delay the tumour search.'
      selected_evidence:
        snippet: Another example is OMS in children with neuroblastoma (in this case, patients do not
          have a specific antibody).
        supports: SUPPORT
