      assertion_type: Subtype
      assertion:
        name: Opsoclonus-Myoclonus Syndrome
        description: 'A pointer row rather than a disease modelled here. Opsoclonus-myoclonus syndrome
          is curated as its own entry, Opsoclonus_Myoclonus_Syndrome, which is bound to MONDO:0015247;
          no subtype_term is bound here so that the same MONDO class is not bound twice. It is listed
          because the 2021 PNS-Care criteria name it as the one syndrome accepted as definite PNS without
          a high- or intermediate-risk antibody, which this entry already records as the Opsoclonus-myoclonus
          exception to the antibody requirement case definition. Unlike the two rows above, which divide
          paraneoplastic neurological syndromes by antigen compartment, this row names a single clinical
          syndrome, so it cuts across them rather than adding a third compartment. What this entry keeps
          is the paraneoplastic side: the rate within children with neuroblastoma, that case definition,
          and the tumour-infiltrating lymphoid response behind it. The syndrome''s own phenotypes, treatment
          and course are in the separate entry.'
        curated_in: Opsoclonus_Myoclonus_Syndrome
      selected_evidence:
        snippet: Opsoclonus-myoclonus-ataxia (OMA) is a paraneoplastic neurologic syndrome affecting 2-3%
          of children with neuroblastoma.
        supports: SUPPORT
        directness: DIRECT
