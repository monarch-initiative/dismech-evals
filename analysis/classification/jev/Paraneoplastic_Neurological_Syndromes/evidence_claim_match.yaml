            term:
              id: MONDO:0018215
              label: paraneoplastic neurologic syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pns_omas_humoral_versus_t_cell_effector
        kind: KNOWLEDGE_GAP
        prompt: In neuroblastoma-associated opsoclonus-myoclonus-ataxia, is the arm that injures the brain
          humoral or T-cell mediated?
        attaches_to:
        - pathophysiology#Tumor-Infiltrating Polyclonal Lymphoid Response
        - treatments#Rituximab
        rationale: 'This entry sorts its other syndromes by effector arm - a cytotoxic T-cell subtype
          for intracellular antigens and a pathogenic-autoantibody subtype for surface antigens - and
          neuroblastoma-associated OMAS cannot be placed in either. The humoral case is circumstantial
          but consistent: CSF B-cell expansion tracking severity and response to B-cell depletion, oligoclonal
          bands, cytokines of B-cell activation, and IgG binding neuronal surfaces in a minority. Against
          it, no pathogenic autoantibody has been found, the tumour infiltrate is polyclonal in both lineages
          with no unifying antigen, and commercial serum panels are negative. The alternative, a T-cell-driven
          process, is harder to test, which is itself a reason the question stays open rather than evidence
          either way. It is not an academic point: the preference for rituximab over cyclophosphamide
          rests partly on the B-cell premise, so settling it would bear on first-line choice.'
        status: OPEN
        posed_by: 'dismech curation (neuroblastoma project, issue #14976)'
      selected_evidence:
        snippet: The elevation of cytokines and chemokines involved in B-cell activation, alongside CSF
          oligoclonal bands, may argue for a role for a pathogenic humoral autoimmune process in OMAS
          ... and discovery of a pathogenic autoantibody would advance the field substantially. This is
          supported by evidence of IgG binding to the cell surface of neurones in a minority of patients
          with OMAS. ... An alternate explanation is that the driving autoimmune process is T cell mediated,
          resulting in greater challenges from a discovery and biomarker perspective.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
