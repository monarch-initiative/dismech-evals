          ends of the prognosis.

          The mechanistic claim here is stronger than association. Tumour cells from Castleman disease
          occurring with paraneoplastic pemphigus were shown to secrete antibodies against plakin family
          proteins, and those antibodies caused detachment of cultured keratinocytes. That makes the tumour
          an antibody source rather than merely the stimulus for one - which is the mechanistic difference
          between this disease and the cross-reactivity paraneoplastic syndromes.'
