      assertion_type: ProgressionInfo
      assertion:
        phase: Survival and prognostic determinants
        notes: 'A systematic review of 290 articles covering 504 patients, with survival data on 281,
          is the largest synthesis available and the source of what is known about prognosis. Older age,
          circulating bullous pemphigoid 230 autoantibodies, non-Hodgkin lymphoma and a possible history
          of causative drugs predicted shorter survival; initial oral mucosal involvement, lichenoid or
          interface dermatitis, Castleman disease and epithelial-derived tumours predicted longer survival.
          Only two survived multivariable adjustment: non-Hodgkin lymphoma as a hazard, and lichenoid/interface
          dermatitis as a protective factor.

          The tumour type is therefore the dominant prognostic variable, which is consistent with the
          entry''s framing of the neoplasm as the driver rather than the setting.'
      selected_evidence:
        snippet: After drawing the Kaplan-Meier survival curves for 281 patients with available survival
          information, it was found that older age, circulating bullous pemphigoid 230 autoantibodies,
          non-Hodgkin lymphoma, and possible history of causative drugs were associated with shorter survival
          time.
        supports: SUPPORT
