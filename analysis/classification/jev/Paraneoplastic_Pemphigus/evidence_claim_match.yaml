  870091383cecda45c870d82da05e8cf2875b1d444f9ee7d44ecbbfcf236841a7:
    claim:
      about:
        disease:
          name: Paraneoplastic Pemphigus
          disease_term:
            preferred_term: paraneoplastic pemphigus
            term:
              id: MONDO:0018974
              label: paraneoplastic pemphigus
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Desmosome Disruption and Keratinocyte Acantholysis
        conforms_to: desmosomal_adhesion_failure#Acantholysis and Mechanical Failure of Desmosome-Dependent
          Tissues
        role: central_effector
        biological_scale: CELLULAR
        description: 'The rate-limiting lesion, and the one with direct experimental support. Passive
          transfer of purified anti-desmoplakin C-terminus IgG into neonatal mice produced blisters and
          acantholysis in a dose-dependent way. Electron microscopy showed what the antibody actually
          does: keratin intermediate filaments disconnect from the desmosome, so the junction loses its
          cytoskeletal anchorage rather than being dissolved. Keratinocyte apoptosis followed on TUNEL
          staining.

          Anti-desmoglein 3 antibodies from patient sera had already been shown to cause acantholysis
          in the same model, so at least two distinct autoantibody specificities are independently pathogenic.'
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
