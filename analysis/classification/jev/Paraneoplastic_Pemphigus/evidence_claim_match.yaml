  d5bbaa7c7a1bd99b2ea3d0da64049a91ef6777d2bc1e0fbe965096b417524f52:
    claim:
      about:
        disease:
          name: Paraneoplastic Pemphigus
          disease_term:
            preferred_term: paraneoplastic pemphigus
            term:
              id: MONDO:0018974
              label: paraneoplastic pemphigus
        context: []
      assertion_type: Treatment
      assertion:
        name: Rituximab
        description: 'Anti-CD20 B-cell depletion, and the treatment whose rationale fits this disease''s
          mechanism most exactly: in lymphoproliferative-associated disease the same drug depletes the
          neoplastic B cells and the autoreactive ones, which in the tumour-as-factory model are largely
          the same cells. The guideline calls it the preferred strategy in that setting for precisely
