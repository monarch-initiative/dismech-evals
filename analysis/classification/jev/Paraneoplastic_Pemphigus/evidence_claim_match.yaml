      assertion_type: Treatment
      assertion:
        name: Intravenous Immunoglobulin
        description: 'Curated at the strength the guideline states it, which is low: high doses have "also
          been employed", with no efficacy claim and no comparison. It is listed here rather than omitted
          because a reader looking for what has been tried should find it, and because the alternative
          - leaving it out - would imply it has not been.

          Deliberately carries no target_mechanisms. IVIG in autoantibody-mediated disease is usually
          rationalised as accelerating IgG catabolism and blocking Fc receptors, but nothing cited here
          says which node it acts on in this disease, and inventing an edge would assert a mechanism the
          sources do not.

          A peri-operative rationale - giving IVIG around tumour resection to blunt antibody-mediated
          bronchiolar injury at the moment of tumour lysis - was raised by the deep-research report and
          is NOT curated. It would bear directly on this entry''s second knowledge gap, which is exactly
          why it needs a primary source; the EADV guideline does not make the claim, and a PubMed search
          for it did not surface one. Recorded so the lead is not lost.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: intravenous immunoglobulin therapy
