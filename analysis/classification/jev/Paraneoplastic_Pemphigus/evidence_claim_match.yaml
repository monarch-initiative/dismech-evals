        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cell-Mediated Interface Mucositis
        role: amplifier
        biological_scale: TISSUE
        description: 'The cellular arm, which the humoral account alone does not cover. Biopsies show
          intraepithelial clefting together with interface mucositis - a lichenoid, T-cell-mediated pattern
          of injury at the epithelial-stromal junction that antibody deposition does not explain.

          Its prognostic behaviour is counterintuitive and worth curating for that reason: lichenoid or
          interface dermatitis is associated with *longer* survival, and remains so in multivariable analysis.
          A histological pattern that indicates more immune attack predicts a better outcome, which is
          the kind of finding a purely antibody-centred model of this disease would not anticipate.'
      selected_evidence:
        snippet: Both humoral and cell-mediated immunities contribute to the pathogenesis, and autoantibodies
          against plakin family proteins are characteristic.
        supports: SUPPORT
