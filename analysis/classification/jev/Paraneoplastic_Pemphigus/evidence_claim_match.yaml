      assertion:
        target: Autoantibody Binding to Desmosomal Plakins and Desmogleins
        relationship: FAILS_TO_RECAPITULATE
        fidelity: MODERATE
        description: 'Purified anti-envoplakin and anti-periplakin patient antibodies produced no pathological
          change. The model therefore does not support these specificities as pathogenic effectors, while
          supporting anti-desmoplakin and anti-desmoglein 3 in the same system.

          This is the structural form of the entry''s sharpest open question: the marker that predicts
          mortality is not the one that reproduces disease. Either it reports on something else that kills,
          or the model misses how it acts.'
        limitations: A negative passive-transfer result cannot distinguish a non-pathogenic antibody from
          one whose pathogenicity requires a cofactor the model lacks - a second specificity, a cell-mediated
          arm, a target the neonatal mouse does not express in the same form, or a duration longer than
          the assay. The result constrains the claim; it does not settle it.
      selected_evidence:
        snippet: Still, our previous study failed in observing any phenotype in mouse skin to prove the
          pathogenesis of antibodies against envoplakin and periplakin.
        supports: REFUTE
