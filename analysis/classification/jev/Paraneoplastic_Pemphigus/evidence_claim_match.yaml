  fadf4db16d9d06d1f20eef340b4d0b1f3c997a50eed01dc66cc012750b8321c2:
    claim:
      about:
        disease:
          name: Paraneoplastic Pemphigus
          disease_term:
            preferred_term: paraneoplastic pemphigus
            term:
              id: MONDO:0018974
              label: paraneoplastic pemphigus
        context:
        - path: /treatments/0
          value:
            name: Treatment of the Underlying Neoplasm
            description: 'The move that follows from the mechanism: if the tumour is producing the autoantibody,
              removing it removes the source. In the worked Castleman case the paratracheal mass was resected.

              That reasoning holds much less often than the mechanism suggests, and the entry now says
              so rather than letting the inference stand. The EADV guideline states that treatment of
              the underlying neoplasia *rarely* has a favourable impact on the clinical course - while
              also stating, in a later section, that treating the malignancy is always recommended because
              it can result in improvement. Those two sentences are in tension within one document, and
              the reconciliation the guideline implies is anatomical rather than immunological: a *resectable*
              tumour, such as Castleman disease or thymoma, can be removed outright and remission follows
              in up to half of such patients, whereas a disseminated haematological malignancy is controlled
              rather than eliminated and the antibody source persists.

              So the tumour-as-factory model predicts the outcome of surgery, not the outcome of chemotherapy.
              The entry curates the distinction because a reader who took the mechanism at face value
              would over-predict benefit.

              A second limit is mechanistic in the other direction. Tumour control does not reverse established
              airway scarring, so even when it works it treats the cause without treating the complication
              that determines survival.'
            therapeutic_modality: OTHER
            treatment_term:
              preferred_term: tumour-directed therapy
              term:
                id: NCIT:C49236
                label: Therapeutic Procedure
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Underlying Neoplasm with Autoantibody Production
        treatment_effect: INHIBITS
        description: Removes or controls the source of the pathogenic autoantibodies. Acts on the trigger
          node, which is why it is the only treatment here that is disease-modifying rather than suppressive.
      selected_evidence:
        snippet: Bronchiolitis obliterans, in particular, has been identified as a marker of poor prognosis
          in patients with PAMS and lung transplantation often represents the only viable treatment option
          once the underlying neoplasm has been controlled.
        supports: SUPPORT
    origin:
