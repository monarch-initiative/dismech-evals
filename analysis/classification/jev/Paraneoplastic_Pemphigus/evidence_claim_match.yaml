        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_which_autoantibody_is_pathogenic
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which of the many autoantibodies in paraneoplastic pemphigus actually cause the disease,
          given that the most reliably detected ones are not the demonstrably pathogenic ones?
        attaches_to:
        - pathophysiology#Autoantibody Binding to Desmosomal Plakins and Desmogleins
        - pathophysiology#Desmosome Disruption and Keratinocyte Acantholysis
        rationale: 'Patients carry autoantibodies against desmoglein 1 and 3, alpha-2-macroglobulin-like-1,
          and a long list of plakins - epiplakin, plectin, desmoplakin, bullous pemphigoid antigen 1,
          envoplakin and periplakin. Detectability and pathogenicity do not line up.

          Envoplakin and periplakin are almost universally detected by immunoblotting, and their major
          epitopes have been mapped - yet patient antibodies purified against those two proteins failed
          to produce any pathological change in animal models. Anti-desmoglein 3 antibodies are demonstrably
          pathogenic by passive transfer, but a significant proportion of patients have low or absent
          anti-desmoglein 3, so they cannot be the general explanation. Anti-desmoplakin C-terminus antibodies
          were shown pathogenic only in 2022, and desmoplakin is the plakin most frequently detected by
          immunoprecipitation.

          So the serological profile that defines the disease diagnostically is not the profile that explains
          it mechanistically, and the entry curates the antibody node without claiming to know which specificity
          drives which lesion. This matters for treatment: a therapy targeting one specificity would be
          expected to work only in the subset it explains, and there is currently no way to identify that
          subset prospectively.'
        proposed_experiments:
        - experiment_id: specificity_resolved_passive_transfer_panel
          name: Passive transfer of individually purified autoantibody specificities from stratified patient
            sera
          description: Purify each major specificity separately from sera of patients stratified by anti-desmoglein
            3 status, and passively transfer each into the neonatal mouse model with the dose-response
            and electron-microscopy readouts already validated for desmoplakin. The question is not whether
            any antibody is pathogenic but which ones account for disease in the anti-desmoglein-3-negative
            subset.
      selected_evidence:
        snippet: the animal model has demonstrated the pathogenetic role of anti-desmoglein 3 antibodies
        supports: SUPPORT
