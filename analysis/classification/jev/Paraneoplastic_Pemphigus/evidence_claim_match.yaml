          of causative drugs predicted shorter survival; initial oral mucosal involvement, lichenoid or
          interface dermatitis, Castleman disease and epithelial-derived tumours predicted longer survival.
          Only two survived multivariable adjustment: non-Hodgkin lymphoma as a hazard, and lichenoid/interface
          dermatitis as a protective factor.

          The tumour type is therefore the dominant prognostic variable, which is consistent with the
          entry''s framing of the neoplasm as the driver rather than the setting.'
      selected_evidence:
        snippet: Initial oral mucosal involvement, lichenoid/interface dermatitis, Castleman disease,
          and epithelial-derived tumors were associated with longer survival time.
        supports: SUPPORT
