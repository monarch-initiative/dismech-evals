        name: Consensus diagnostic characteristics (EADV S2k)
        description: 'There is no validated diagnostic criterion set for this disease, and the guideline
          that proposes one says so about its own proposal. What most patients share is a combination:
          severe chronic stomatitis with multi-site mucosal involvement and variable skin lesions, an
          underlying neoplasm known or later found, a mixed histology, immunoreactant deposits on direct
          immunofluorescence, rat-bladder reactivity on indirect immunofluorescence, and binding to a
          variable set of autoantigens.

