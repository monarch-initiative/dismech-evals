      assertion_type: ProgressionInfo
      assertion:
        phase: Mortality
        notes: 'Three independent estimates, and they do not agree - which is itself the finding, since
          all three are syntheses of case reports rather than cohorts.

          The earliest review put mortality at 90% of 33 patients within two years. A French multicentre
          series of 53 patients gave one-year and five-year overall survival of 49% and 38%. A systematic
          review restricted to haematologic-malignancy-associated disease (144 patients) gave 57%, with
          most deaths in the first year.

          What is consistent across them is the timing rather than the rate: death is concentrated early,
          and the causes named are infection under immunosuppression, bronchiolitis obliterans-related
          respiratory failure, and progression of the underlying malignancy - in that order in the French
          series. So the disease, its treatment and its tumour each kill a share of patients, which is
          why no single node in the pathograph carries the prognosis.'
      selected_evidence:
        snippet: In the latter study, the main cause of death was severe infection due to the immunosuppressive
          treatment, followed by bronchiolitis obliterans-related respiratory failure and progression
          of the underlying malignancy
        supports: SUPPORT
