      assertion:
        name: Bronchiolar Epithelial Injury and Obliterative Airway Scarring
        role: consequence
        biological_scale: TISSUE
        description: 'The complication that determines survival. Small airways scar and obliterate, producing
          progressive dyspnoea and respiratory failure.

          It is curated as a node rather than only as a phenotype because of what it implies for treatment.
          The scarring is structural and does not reverse when the antibody source is removed, so controlling
          the neoplasm - which is otherwise the definitive move in this disease - leaves this arm behind.
          Lung transplantation is often the only option once the tumour is controlled.'
      selected_evidence:
        snippet: Bronchiolitis obliterans (BO) is a frequent complication which contributes to the high
          mortality rate of PNP/PAMS.
        supports: SUPPORT
