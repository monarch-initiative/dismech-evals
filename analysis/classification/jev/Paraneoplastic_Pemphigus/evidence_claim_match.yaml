        - path: /animal_models/0
          value:
            name: Neonatal mouse passive transfer (anti-desmoplakin C-terminus IgG)
            species: Mouse
            genotype: Wild-type neonatal mouse; passive transfer of patient IgG purified against the desmoplakin
              C-terminus
            background: Neonatal mice
            publication: PMID:35911677
            description: 'The experiment this entry''s central effector rests on. Serum was obtained by
              plasmapheresis from a 16-year-old patient with paraneoplastic pemphigus, the anti-desmoplakin
              C-terminus IgG purified from it, and injected into neonatal mice.

              The donor''s tumour was never characterised, and the entry does not claim otherwise. She
              met the study''s inclusion criterion of an underlying lymphoproliferative neoplasm on the
              strength of a 5 x 4 cm mediastinal mass, and died of sepsis while being prepared for surgery,
              so no histology was obtained. A mediastinal mass in an adolescent with this disease is suggestive
              of Castleman disease, but that is an inference, not the reported diagnosis - and the distinction
              matters here, because this entry''s organising thesis is that Castleman tumour cells are
              the antibody factory. That thesis rests on the group''s separate earlier work on Castleman
              tumour cells, not on this donor.

              It is also a passive-transfer model rather than a disease model: it reproduces the effector
              step, not the disease. There is no tumour, no antibody production, and no airway involvement
              - so it speaks to whether an antibody specificity is pathogenic and to nothing else.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Desmosome Disruption and Keratinocyte Acantholysis
        relationship: RECAPITULATES
        fidelity: HIGH
        description: Reproduces the node's three curated components - blistering, ultrastructural loss
          of keratin anchorage, and keratinocyte apoptosis - from purified antibody alone, with a dose-response.
        limitations: Neonatal mouse skin, a single donor patient, and an effector step isolated from its
          cause. The model cannot address the airway arm, which is where this disease's mortality sits,
          and it says nothing about which specificities dominate in unselected patients.
        readouts:
        - name: Blister formation and acantholysis in skin
          target: Desmosome Disruption and Keratinocyte Acantholysis
          direction: INCREASED
          interpretation: Dose-dependence is what raises this from association to causation for this specificity.
        - name: Keratin intermediate filament attachment to desmosomes on electron microscopy
          target: Desmosome Disruption and Keratinocyte Acantholysis
          direction: DECREASED
          interpretation: Identifies the lesion as loss of cytoskeletal anchorage rather than dissolution
            of the junction itself.
        - name: Keratinocyte apoptosis by TUNEL assay
          target: Desmosome Disruption and Keratinocyte Acantholysis
          direction: INCREASED
          interpretation: The apoptotic component, which is why the node carries an apoptosis annotation
            alongside the adhesion one.
      selected_evidence:
        snippet: Autoantibodies against desmoglein 3 in sera of patients with PNP have been proven to
          cause acantholysis in vivo in neonatal mice.
        supports: SUPPORT
