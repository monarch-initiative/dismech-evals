          and destroys alveolar epithelium at the site of deposition, without the systemic distribution
          step that ingestion requires. Note this is a shortcut in DELIVERY, not a bypass of transport:
          the same source says absorption then proceeds through epithelial active transport mechanisms,
          so the uptake machinery is still involved and the link is not curated as circumventing it.'
      selected_evidence:
        snippet: This localized deposition causes immediate alveolar epithelial cell destruction and massive
          pulmonary accumulation while bypassing hepatic first pass metabolism.
        supports: SUPPORT
