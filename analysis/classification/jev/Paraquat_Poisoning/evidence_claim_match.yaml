        context:
        - path: /treatments/5
          value:
            name: Lung Transplantation
            description: 'The only intervention that addresses the lesion that kills survivors. Once fibrosis
              is established it is irreversible, so transplantation is the definitive rather than the
              supportive option, with ECMO as a bridge to a donor lung. Reported successfully after paraquat
              poisoning, including a double-lung transplant on ECMO support 34 days after ingestion with
              a good outcome. Its limiting factors in the cited cases were not medical: one patient reached
              transplantation only through publicly raised funds, and in another it was abandoned for
              want of money.'
            therapeutic_modality: SURGERY
            treatment_term:
              preferred_term: lung transplantation
              term:
                id: NCIT:C15289
                label: Organ Transplantation
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Progressive Pulmonary Fibrosis
        treatment_effect: BYPASSES
        description: Replaces the fibrotic organ rather than modifying the fibrotic process - the one
          place in this entry where BYPASSES is the accurate enum, since the graft supplies gas exchange
          by an entirely different route while the injured lung is removed.
      selected_evidence:
        snippet: Lung transplantation is currently the most effective treatment for pulmonary fibrosis,
          and mass media campaigns can provide economic support, influence potential organ donation, and
          provide such patients more chances to survive.
        supports: SUPPORT
