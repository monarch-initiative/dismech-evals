      assertion_type: Pathophysiology
      assertion:
        name: Polyamine-Transporter-Mediated Pulmonary Accumulation
        biological_scale: CELLULAR
        description: The reason the lung is the target organ. Paraquat is a substrate of the polyamine
          transport system, which is abundantly expressed in the membranes of alveolar type I and type
          II cells and Clara (club) cells. Transport is against the concentration gradient, so pulmonary
          concentrations reach six to ten times plasma levels, and - critically for treatment timing -
          paraquat is retained in lung even once blood levels begin to fall. This is why measures that
          lower the plasma level late have limited effect on the lung burden already established.
        cell_types:
        - preferred_term: alveolar type I cell
          term:
            id: CL:0002062
            label: pulmonary alveolar type 1 cell
        - preferred_term: alveolar type II cell
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        - preferred_term: Clara (club) cell
          term:
            id: CL:0000158
            label: club cell
        biological_processes:
        - preferred_term: polyamine transport system-mediated uptake of paraquat
          modifier: INCREASED
          term:
            id: GO:1902047
            label: polyamine transmembrane transport
        molecular_functions:
        - preferred_term: polyamine transporter accepting paraquat as a substrate
          term:
            id: GO:0015203
            label: polyamine transmembrane transporter activity
      selected_evidence:
        snippet: PQ mainly accumulates in the lung (pulmonary concentrations can be 6 to 10 times higher
          than those in the plasma), where it is retained even when blood levels start to decrease.
        supports: SUPPORT
