  53546180af60214644e921fa4bb634f529772cb4df70e9f6e5e98aee2d97d8b8:
    claim:
      about:
        disease:
          name: Paraquat Poisoning
          disease_term:
            preferred_term: paraquat poisoning
            term:
              id: MONDO:0017862
              label: paraquat poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TGF-beta-Driven Mesenchymal Transition of Alveolar Epithelium
        biological_scale: CELLULAR
        description: The step that converts injury into fibrosis, and it is dose-dependent in a way that
          matters clinically. In alveolar epithelial cells, short high-dose paraquat causes apoptotic
          death, whereas prolonged low-dose exposure instead drives transformation into spindle-shaped
          mesenchymal-like cells that lose E-cadherin, gain alpha-smooth muscle actin and secrete fibronectin.
          The transformation is TGF-beta1-dependent - a receptor antagonist abolishes it - and it confers
          resistance to cell death, so the cells that survive are precisely the ones that make matrix.
          This is why subacute, lower-dose poisoning produces the delayed fibrotic course rather than
          simply a milder version of the fulminant one.
        conforms_to: fibrotic_response#Mesenchymal Cell Activation
        cell_types:
        - preferred_term: alveolar epithelial cell undergoing mesenchymal transition
          term:
            id: CL:0000322
            label: pulmonary alveolar epithelial cell
        - preferred_term: myofibroblast-like cell
          term:
            id: CL:0000186
            label: myofibroblast cell
        biological_processes:
        - preferred_term: EMT-like transformation of alveolar epithelium
          modifier: INCREASED
          term:
            id: GO:0001837
            label: epithelial to mesenchymal transition
        - preferred_term: TGF-beta1 signalling driving the transition
          modifier: INCREASED
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
        notes: 'Entirely in-vitro: A549 and normal human bronchial epithelial cells. It is wired into
          the human causal chain nonetheless - unlike the rodent arms declined in other entries - because
          the dose-and-duration dependence it demonstrates is what explains the biphasic clinical course
          this entry curates, and the authors state the model reflects the etiology of human poisoning.
          A curator who disagrees with that judgement should detach the edge rather than delete the node.'
      selected_evidence:
        snippet: In contrast, long-term (6-12 days) low-dose (30 μM) treatments with PQ resulted in a
          transformation into spindle-shaped mesenchymal-like cells with a decrease of E-cadherin as well
          as an increase of α-smooth muscle actin
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25799450
      reference_title: Paraquat induces epithelial-mesenchymal transition-like cellular response resulting
        in fibrogenesis and the prevention of apoptosis in human pulmonary epithelial cells.
      evidence_source: IN_VITRO
      explanation: States the mesenchymal transformation and its marker shift, and pins it to the low-dose
