      assertion_type: Pathophysiology
      assertion:
        name: Redox Cycling and Catalytic Superoxide Generation
        biological_scale: MOLECULAR
        description: 'The rate-limiting molecular lesion. Paraquat undergoes one-electron reduction to
          a cation radical, which is reoxidised by molecular oxygen; the reoxidation regenerates the parent
          paraquat cation and releases superoxide. Because the toxicant is regenerated, one paraquat molecule
          generates reactive oxygen species catalytically rather than being consumed, which is why very
          small intracellular quantities are lethal and why no stoichiometric scavenger has succeeded
          as an antidote. The cycle also consumes reducing equivalents, compounding oxidative injury with
          a loss of antioxidant reserve. The reduction is localised: paraquat is carried into the mitochondrial
          matrix in a membrane-potential-dependent manner as the dication rather than the radical, and
          is there reduced principally by complex I in mammalian mitochondria.'
        notes: 'The node name is deliberately cofactor-agnostic. An earlier draft called it "NADPH-Dependent",
          which was wrong twice over: mammalian complex I is NADH:ubiquinone oxidoreductase (`GO:0008137`
          NADH dehydrogenase (ubiquinone) activity), and the cited abstract puts NADPH on the *yeast*
          side of the same sentence - "reduced by complex I (mammals) or by NADPH dehydrogenases (yeast)".
          The name therefore asserted the one cofactor this entry declines to curate and mislabelled the
          one it does. Two reduction sites are reported and they are complementary rather than competing:
          mitochondrial complex I, localised experimentally in isolated mitochondria, and NADPH oxidase,
          emphasised in the clinical literature. This entry curates complex I on the node because that
          is where the direct experimental evidence sits, and records the NADPH oxidase claim here rather
          than binding it, since the source asserting it is a two-patient case report citing secondary
          literature.'
