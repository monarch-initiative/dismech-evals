  e82f1d60691a918c7d9851f8ca8a640c3b8a58dfcd3aa0ba055f24a4bd824f7c:
    claim:
      about:
        disease:
          name: Paraquat Poisoning
          disease_term:
            preferred_term: paraquat poisoning
            term:
              id: MONDO:0017862
              label: paraquat poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Proximal Tubular Injury and Acute Kidney Injury
        biological_scale: TISSUE
        description: 'Necrosis of the proximal convoluted tubule, where paraquat distribution is high.
          The kidney concentrates paraquat by an active transport route of its own, distinct from the
          lung''s: the organic cation transporter hOCT2 (SLC22A2) and the extrusion transporter hMATE1
          both carry paraquat, and expressing either in cells raises both uptake and cytotoxicity by an
          order of magnitude. Renal failure therefore matters three times over - as organ injury, as the
          route by which most of an absorbed dose leaves the body, and because the very transporters that
          clear paraquat are what load the tubular cell with it.'
        cell_types:
        - preferred_term: proximal convoluted tubule epithelial cell
          term:
            id: CL:1000838
            label: kidney proximal convoluted tubule epithelial cell
        biological_processes:
        - preferred_term: hOCT2- and hMATE1-mediated tubular transport of paraquat
          modifier: INCREASED
          term:
            id: GO:0055085
            label: transmembrane transport
        notes: 'Two ontology limitations, both recorded so a later curator does not read them as oversights.
          First, no molecular_function descriptor is bound for the transporter itself: every GO organic-cation-transmembrane-transporter-activity
          term is obsolete (`GO:0015101`, `GO:0008513`). Second, the natural process term `GO:0015695`
          organic cation transport is ALSO obsolete in current GO - OLS returns its label as `obsolete
          organic cation transport` - so the dynamic enum was right to reject it, and `GO:0055085` transmembrane
          transport is bound instead with a specific preferred_term. Recorded because the local `sqlite:obo:go`
          build used for lookups here is stale: it still reports `GO:0015695` as live, with an `is_a GO:0006810`
          parent and no deprecation axiom. An earlier draft of this note trusted that build and wrongly
          blamed a gap in the enum''s membership cache. One local OAK build is not sufficient evidence
          that a term is live - cross-check obsoletion against OLS or against the label the term validator
          itself writes into `cache/`, which is what caught this.'
      selected_evidence:
        snippet: Kidney failure occurs due to necrosis in the proximal convoluted tubule whereas acute
          liver injury occurs due to damage to the smooth endoplasmic reticulum and mitochondria, the
          distribution being high in these two organs.
        supports: SUPPORT
