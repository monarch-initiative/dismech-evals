              label: paraquat poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cardiac Involvement
        biological_scale: TISSUE
        description: 'A real but poorly characterised arm, curated at the strength the evidence actually
          supports. Paraquat causes multiorgan injury including the heart, and dose-dependent falls in
          heart rate, blood pressure and cardiac contractility are documented in anaesthetised rodents.
          In humans the picture is thin: the source curated here states plainly that little to no evidence
          exists on the haemodynamic and cardiac electromechanical effects of acute poisoning, and reports
          severe bradycardia refractory to anticholinergics as an unusual manifestation.'
        notes: The deep-research report for this entry asserts that cardiogenic or circulatory collapse
          is "the dominant fatal mechanism in the fulminant form". That claim is NOT curated, and the
          node is deliberately not placed on a fatal path. No source located for this entry supports it,
          and the one human source that addresses the question directly says the opposite - that the cardiac
          effects of acute paraquat poisoning are close to uncharacterised. Treating a deep-research assertion
          as evidence is exactly what the DR SOP warns against; see the accompanying KNOWLEDGE_GAP.
      selected_evidence:
        snippet: Decreases in heart rate, blood pressure, and cardiac contractility have been noted in
          a dose-dependent manner in anesthetized rodents [7].
        supports: SUPPORT
    origin:
