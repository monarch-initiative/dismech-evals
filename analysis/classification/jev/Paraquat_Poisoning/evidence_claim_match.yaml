  8c3fcc58b976c07c2385ba72e84e965294dca72f406753025787275e7c1370f2:
    claim:
      about:
        disease:
          name: Paraquat Poisoning
          disease_term:
            preferred_term: paraquat poisoning
            term:
              id: MONDO:0017862
              label: paraquat poisoning
        context:
        - path: /treatments/6
          value:
            name: Restrictive Oxygen Strategy
            description: 'The counterintuitive one, and the clearest clinical corollary of this entry''s
              redox node: supplemental oxygen is the substrate that reoxidises the paraquat radical, so
              high inspired oxygen fuels the cycle that is doing the damage. Oxygen is therefore restricted
              rather than given liberally. It is a genuine trade-off rather than a rule - withholding
              oxygen delays radical generation at the cost of tissue hypoxia - and the cited source frames
              it as a ventilator-setting judgement in patients already on ECMO, not as a blanket prohibition.'
            treatment_term:
              preferred_term: restrictive inspired-oxygen strategy
              term:
                id: NCIT:C49236
                label: Therapeutic Procedure
            notes: 'Bound to the generic `NCIT:C49236` - NCIT has no restrictive-oxygen or permissive-hypoxaemia
              term, and `NCIT:C171507` Extracorporeal Membrane Oxygenation names a different intervention.
              No `therapeutic_modality` is set for the same reason it is omitted on supportive care: a
              ventilator-setting strategy is not a platform.'
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Redox Cycling and Catalytic Superoxide Generation
        treatment_effect: INHIBITS
        description: Limiting inspired oxygen limits the substrate for reoxidation of the paraquat radical,
          and so the rate of the cycle itself. This is the only intervention curated here that acts on
          the redox mechanism rather than on its consequences.
      selected_evidence:
        snippet: 'Although both patients received ECMO support, mechanical ventilation parameter settings
          need to be carefully weighed: high‐concentration oxygen therapy may exacerbate oxidative stress
          injury, whereas hypoxic strategies, while delaying ROS generation, may exacerbate tissue hypoxia.'
        supports: SUPPORT
    origin:
      assertion_path: /treatments/6/target_mechanisms/0
      evidence_path: /treatments/6/target_mechanisms/0/evidence/0
      context_paths:
