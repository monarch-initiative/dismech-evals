      assertion_type: Discussion
      assertion:
        discussion_id: controversy_paraquat_parkinson_association
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Redox Cycling and Catalytic Superoxide Generation
        prompt: Is the epidemiological association between chronic low-dose paraquat exposure and Parkinson
          disease causal, and does it share a mechanism with the acute poisoning curated here?
        rationale: 'This entry curates acute high-dose poisoning; the paraquat-Parkinson question concerns
          chronic low-dose exposure and is a different exposure regime with a different target organ.
          They are linked here rather than merged because they share the redox-cycling node: paraquat
          is structurally similar to MPP+, is taken up by cation transporters, and is used experimentally
          to model nigrostriatal degeneration - and this knowledge base already treats paraquat as an
          environmental complex I toxin in `Parkinsons_Disease` and in the `parkinsonism_dopaminergic_degeneration`
          module. The association is meta-analytically supported but is not curated as established causation
          here, because the acute-poisoning literature cannot speak to it and this entry has not assessed
          the chronic-exposure evidence. Recorded so the relationship between these entries is explicit
          rather than implied by a shared substance name.'
      selected_evidence:
        snippet: There is a statistically significant association between paraquat exposure and PD.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30474499
      reference_title: 'Paraquat exposure and Parkinson''s disease: A systematic review and meta-analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: PARTIAL - the meta-analysis (13 case-control studies, OR 1.64, 95% CI 1.27-2.13) establishes
        a statistically significant association, which is not the same as causation and says nothing about
        whether it shares a mechanism with the acute poisoning curated here. That is precisely the open
        question this discussion records.
