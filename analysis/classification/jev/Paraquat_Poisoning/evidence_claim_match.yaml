            label: exposure to paraquat
        description: 'A rare and diagnostically treacherous route: paraquat solution delivered by a personal
          nebulisation device. It is curated because it breaks the assumptions the usual diagnostic pathway
          rests on - there is no caustic oral injury to see, the exposure history is denied or absent,
          and an initial urine paraquat test can be negative. The diagnosis in the cited case was made
          only by analysing residue from the device itself.'
        notes: Bound to the same route-agnostic `ECTO:9000395` as the ingestion entry, since ECTO has
          no inhalational paraquat term either; `ECTO:0090011` exposure to paraquat in air denotes ambient
          air, not deliberate nebulisation, and would misdescribe this route.
      selected_evidence:
        snippet: Analysis of the residual solution from his nebulization device confirmed the presence
          of methyl viologen, the active component of paraquat, establishing the diagnosis of inhaled
          paraquat poisoning via nebulization.
        supports: SUPPORT
