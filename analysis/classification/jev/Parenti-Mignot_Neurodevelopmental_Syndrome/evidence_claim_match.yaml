            term:
              id: MONDO:0859249
              label: parenti-mignot neurodevelopmental syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CHD5-related NuRD complex dysfunction
        description: Pathogenic CHD5 variants disrupt chromodomain helicase DNA-binding protein 5 function
          within the nucleosome remodeling and deacetylation (NuRD) complex, impairing chromatin remodeling
          programs required for neuronal development.
        notes: The patient cohort strongly supports heterozygous CHD5 variation as the cause of this syndrome.
          The more detailed NuRD and cortical-development mechanism remains a biologically plausible interpretation
          of CHD5 function from the clinical paper and should be refined with model-organism or molecular
          evidence when such sources are curated.
        genes:
        - preferred_term: CHD5
          term:
            id: hgnc:16816
            label: CHD5
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        molecular_functions:
        - preferred_term: ATP-dependent chromatin remodeler activity
          term:
            id: GO:0140658
            label: ATP-dependent chromatin remodeler activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: chromatin remodeling
          term:
            id: GO:0006338
            label: chromatin remodeling
      selected_evidence:
        snippet: Located in the critical 1p36 microdeletion region, the chromodomain helicase DNA-binding
          protein 5 (CHD5) gene encodes a subunit of the nucleosome remodeling and deacetylation (NuRD)
          complex required for neuronal development.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
