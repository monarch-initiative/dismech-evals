      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant, predominantly de novo
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        de_novo_rate: 12 of 16 individuals in the founding cohort
        description: CHD5-related Parenti-Mignot neurodevelopmental syndrome is autosomal dominant. Most
          reported affected individuals have de novo heterozygous CHD5 variants, but familial transmission
          with variable expressivity has been reported, so recurrence-risk counseling should include parental
          testing and assessment of potentially mildly affected relatives.
      selected_evidence:
        snippet: Twelve patients had de novo CHD5 variants, including ten missense and two splice site
          variants. Three familial cases had nonsense or missense variants segregating with speech delay,
          learning disabilities, and/or craniosynostosis.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
