      reference: PMID:33944996
      reference_title: Missense and truncating variants in CHD5 in a dominant neurodevelopmental disorder
        with intellectual disability, behavioral disturbances, and epilepsy.
      evidence_source: HUMAN_CLINICAL
      explanation: The founding cohort supports autosomal dominant inheritance with a predominantly de
        novo pattern and a minority of familial cases.
