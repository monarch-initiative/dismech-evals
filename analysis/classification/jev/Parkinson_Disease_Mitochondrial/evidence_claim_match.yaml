    evidence_metadata:
      reference: PMID:26979109
      reference_title: Mitochondrial DNA homeostasis is essential for nigrostriatal integrity.
      evidence_source: HUMAN_CLINICAL
      explanation: Direct counter-evidence to this node as stated. DAT imaging across 21 patients with
        mitochondrial disease found nigrostriatal degeneration only where mtDNA replication/maintenance
        was defective, and none in carriers of primary mtDNA point mutations — the class m.T1095C belongs
        to. It does not refute the levodopa-responsive parkinsonism observed in the pedigree, but it does
        argue that a primary point mutation is not by itself sufficient to produce nigral degeneration,
        so the inferred route from OXPHOS deficiency to the motor phenotype here remains unconfirmed.
        Recorded as REFUTE rather than removed so the tension stays visible; see the mtrnr1_t1095c_nigral_mechanism
        discussion.
