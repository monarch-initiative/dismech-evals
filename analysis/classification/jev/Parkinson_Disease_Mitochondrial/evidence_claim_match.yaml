      assertion:
        name: Mitochondrial inheritance
        inheritance_term:
          preferred_term: Mitochondrial inheritance
          term:
            id: HP:0001427
            label: Mitochondrial inheritance
        description: Maternal (mitochondrial DNA) transmission of the heteroplasmic MT-RNR1 m.T1095C variant
          is the defining feature of this entity, distinguishing it from the nuclear-gene Mendelian forms
          of Parkinson disease. Heteroplasmy — the coexistence of mutant and wild-type mtDNA within one
          individual, with allele frequency able to shift between generations — underlies the variable
          expressivity characteristic of mitochondrial disease.
      selected_evidence:
        snippet: The presence of both mutated and wild-type variant alleles within the same individual
          (heteroplasmy) and rapid shifts in allele frequency can lead to offspring with variable severity
          of disease.
        supports: SUPPORT
