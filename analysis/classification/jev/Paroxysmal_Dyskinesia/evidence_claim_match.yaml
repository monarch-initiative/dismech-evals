        name: Striatal Indirect-Pathway Medium Spiny Neuron Hypoactivity
        description: In PNKD transgenic mice, caffeine and alcohol provoke dyskinetic attacks that coincide
          with a loss of firing in optically identified indirect-pathway striatal medium spiny neurons
          (iMSNs). Chemogenetic silencing of iMSNs is sufficient to trigger attacks, and the firing loss
          is attributable to aberrant endocannabinoid-mediated suppression of glutamatergic input. This
          inverts the classical dyskinesia model (direct-pathway hyperactivity) and places the causal
          lesion in indirect-pathway hypoactivity. The evidence is mouse-only; no human biomarker corresponds
          to it (see the discussions block).
