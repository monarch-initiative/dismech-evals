      assertion_type: Pathophysiology
      assertion:
        name: PNKD (MR-1) Dysfunction and Impaired Methylglyoxal Detoxification
        description: The recurrent p.Ala7Val and p.Ala9Val variants alter the N-terminal alpha helix of
          the brain-specific long isoform of PNKD (myofibrillogenesis regulator 1, MR-1), which is membrane-localised
          and homologous to hydroxyacylglutathione hydrolase. The homologous enzyme detoxifies methylglyoxal,
          a reactive dicarbonyl present in coffee and alcoholic drinks and generated as a by-product of
          oxidative stress — which supplies a direct chemical rationale for why exactly those exposures,
          plus stress and fatigue, precipitate PNKD attacks. Note this remains an inference from sequence
          homology plus trigger pharmacology; direct enzymatic proof in human neurons is not established.
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: PROVISIONAL
        genes:
        - preferred_term: PNKD
          term:
            id: hgnc:9153
            label: PNKD
        biological_processes:
        - preferred_term: methylglyoxal catabolic process
          term:
            id: GO:0051596
            label: methylglyoxal catabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: We report mutations in the myofibrillogenesis regulator 1 (MR-1) gene causing PNKD in
          50 individuals from eight families.
        supports: SUPPORT
