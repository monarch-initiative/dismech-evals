      assertion_type: Subtype
      assertion:
        name: PED
        display_name: Paroxysmal exercise-induced dyskinesia (SLC2A1/GLUT1 deficiency)
        subtype_term:
          preferred_term: childhood onset GLUT1 deficiency syndrome 2
          term:
            id: MONDO:0012805
            label: childhood onset GLUT1 deficiency syndrome 2
        description: 'Attacks of leg-predominant dystonia and choreoathetosis provoked by prolonged exertion
          (and sometimes by fasting), relieved by rest or carbohydrate. The critical genotype is heterozygous
          SLC2A1 loss of function causing GLUT1 deficiency, which frequently co-segregates with generalised
          epilepsy. This is the treatable cause of paroxysmal dyskinesia: the ketogenic diet supplies
          ketone bodies that bypass the defective blood-brain-barrier glucose transporter. The biochemical
          clue is hypoglycorrhachia with a reduced CSF:blood glucose ratio in a normoglycaemic patient.
          The broader SLC2A1 phenotype is curated in GLUT1_Deficiency_Syndrome; only the paroxysmal-dyskinesia
          presentation is modelled here.'
        genes:
        - preferred_term: SLC2A1
          term:
            id: hgnc:11005
            label: SLC2A1
      selected_evidence:
        snippet: When first diagnosed in later childhood to adulthood (occasionally in a parent following
          the diagnosis of an affected child), the predominant clinical findings of Glut1DS are usually
          complex paroxysmal movement disorders, spasticity, ataxia, dystonia, speech difficulty, and
          intellectual disability.
        supports: SUPPORT
    origin:
