        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cerebellar_origin_of_pkd
        hypothesis_label: Cerebellar rather than basal-ganglia origin of the PKD attack
        status: EMERGING
        description: The traditional assumption that paroxysmal dyskinesia is a basal-ganglia disorder
          is under revision for PKD specifically. Work in PRRT2-deficient models points to the cerebellum
          as the pivotal generator, with dyskinetic episodes tightly coupled to spreading depolarization
          in cerebellar cortex, while the contribution of cortex, thalamus and striatum is comparatively
          unresolved. The competing and complementary view remains that the basal-ganglia-thalamo-cortical
          loop generates the motor output. This matters practically because it predicts different neuromodulation
          targets.
        applies_to_subtypes:
        - PKD
      selected_evidence:
        snippet: Whereas, in PKD, other than the cerebellum, the role of the cerebrum including the cortex
          and thalamus needs to be further investigated.
