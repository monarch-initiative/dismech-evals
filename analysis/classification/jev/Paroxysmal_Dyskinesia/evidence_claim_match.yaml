      assertion_type: Discussion
      assertion:
        discussion_id: pnkd_imsn_human_translation
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does the striatal indirect-pathway (iMSN) hypoactivity that causes dyskinetic attacks
          in PNKD mice actually occur in human PNKD?
        status: OPEN
        attaches_to:
        - pathophysiology#Striatal Indirect-Pathway Medium Spiny Neuron Hypoactivity
        rationale: The iMSN mechanism is unusually strong causal evidence — optically identified single-unit
          recordings during spontaneous attacks, chemogenetic sufficiency, and an identified endocannabinoid
          synaptic substrate — but all of it is mouse. It also runs against the classical model in which
          dyskinesia arises from direct-pathway hyperactivity, so it is not simply a confirmation of expectation.
          There is no human biomarker, imaging correlate or post-mortem finding that indexes iMSN firing
          in PNKD patients, and no human tissue or iPSC-derived striatal system has tested it. Until that
          gap is closed the node should be read as a well-supported model-organism mechanism whose translational
          validity is untested, not as established human pathophysiology.
        proposed_experiments:
        - experiment_id: pnkd_cb1_pharmacology_trial
          name: Endocannabinoid-system pharmacology in human PNKD
          description: Test whether CB1-directed pharmacology modifies attack frequency in patients with
            genetically confirmed PNKD, as the mouse endocannabinoid mechanism predicts.
          decision_criterion: A reduction in attack frequency with CB1 antagonism would be the first human
            evidence that the mouse endocannabinoid-iMSN mechanism operates in patients.
        - experiment_id: pnkd_ipsc_striatal_model
          name: Patient-derived iPSC striatal system carrying PNKD p.Ala7Val or p.Ala9Val
          description: Build iPSC-derived striatal organoid or corticostriatal co-culture systems from
            PNKD patients and assay endocannabinoid-dependent suppression of glutamatergic input onto
            D2 or indirect-pathway neurons.
        - experiment_id: pnkd_attack_locked_imaging
          name: Attack-locked functional imaging in PNKD patients
          description: Use task-based or attack-locked functional imaging in PNKD patients to seek an
            indirect-pathway signature during provoked attacks.
      selected_evidence:
        snippet: These data show that striatal iMSN dysfunction contributes to the etiology of dyskinesia
          in PNKD, and suggest that indirect pathway hypoactivity may be a key mechanism for the generation
          of involuntary movements in other disorders.
        supports: SUPPORT
