        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: diagnostic_delay
        kind: KNOWLEDGE_GAP
        prompt: What is the actual magnitude of diagnostic delay in paroxysmal dyskinesia, and how much
          of it is attributable to misdiagnosis as epilepsy, tics, or a functional disorder?
        status: OPEN
        attaches_to:
        - pathophysiology#Trigger-Dependent Breach of the Motor Network Attack Threshold
        rationale: Diagnostic delay in this group is repeatedly described qualitatively — PKD is often
          misdiagnosed clinically as epilepsy, individual patients carry Tourette or functional labels
          for years, and GLUT1 deficiency may be missed entirely despite being diet-responsive — but no
          cohort study quantifies the interval from first attack to correct diagnosis, its distribution
          across PKD, PNKD and PED, or the proportion of that interval attributable to each incorrect
          label. The gap matters because the delay is the principal preventable harm in an otherwise treatable
          and non-progressive group of disorders, and because a quantified delay is what would justify
          including paroxysmal dyskinesia in movement-disorder and epilepsy diagnostic pathways.
        proposed_experiments:
        - experiment_id: pxd_diagnostic_delay_cohort
          name: Multi-centre retrospective diagnostic-delay cohort
          description: Measure time from first attack to molecular or clinical diagnosis, stratified by
            subtype and by whether the patient first presented to epilepsy, movement-disorder, paediatric
            or psychiatric services, and record every incorrect label applied in the interval.
        - experiment_id: glut1_delayed_keto_outcome
          name: Outcome consequences of delayed ketogenic therapy in GLUT1-related PED
          description: Quantify the subset of GLUT1-related PED in which ketogenic therapy was started
            more than five years after symptom onset, and test whether delay correlates with residual
            cognitive or motor outcome.
      selected_evidence:
        snippet: Paroxysmal kinesigenic dyskinesia is the most common type of paroxysmal movement disorder
          and is often misdiagnosed clinically as epilepsy.
        supports: SUPPORT
