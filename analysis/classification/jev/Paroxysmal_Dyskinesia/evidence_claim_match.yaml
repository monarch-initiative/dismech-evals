      assertion_type: Diagnosis
      assertion:
        name: Multigene panel or exome sequencing
        description: Because treatment is genotype-directed rather than phenomenology-directed, molecular
          testing is not merely confirmatory. A paroxysmal movement disorder panel should include at minimum
          PRRT2, TMEM151A, PNKD, SLC2A1, KCNMA1, ADCY5, GNAO1, SCN8A, KCNA1, CACNA1A and ATP1A3, with
          deletion/duplication analysis covering 16p11.2 and SLC2A1. Trio exome or genome sequencing is
          appropriate for panel-negative or developmentally complex cases. Reported diagnostic yields
          vary widely with ascertainment.
        presence: PRESENT
      selected_evidence:
        snippet: In patients with paroxysmal movement disorders 68 families had mutations (47%) out of
          145 patients.
        supports: SUPPORT
