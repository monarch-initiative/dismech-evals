  1a20488d0fc9ee039bfbaf360a792da6dc31c912a6d7b3f4ded8a366c4f42c02:
    claim:
      about:
        disease:
          name: Paroxysmal Dyskinesia
          disease_term:
            preferred_term: paroxysmal dyskinesia
            term:
              id: MONDO:0015427
              label: paroxysmal dyskinesia
        context:
        - path: /has_subtypes/2
          value:
            name: PED
            display_name: Paroxysmal exercise-induced dyskinesia (SLC2A1/GLUT1 deficiency)
            subtype_term:
              preferred_term: childhood onset GLUT1 deficiency syndrome 2
              term:
                id: MONDO:0012805
                label: childhood onset GLUT1 deficiency syndrome 2
            description: 'Attacks of leg-predominant dystonia and choreoathetosis provoked by prolonged
              exertion (and sometimes by fasting), relieved by rest or carbohydrate. The critical genotype
              is heterozygous SLC2A1 loss of function causing GLUT1 deficiency, which frequently co-segregates
              with generalised epilepsy. This is the treatable cause of paroxysmal dyskinesia: the ketogenic
              diet supplies ketone bodies that bypass the defective blood-brain-barrier glucose transporter.
              The biochemical clue is hypoglycorrhachia with a reduced CSF:blood glucose ratio in a normoglycaemic
              patient. The broader SLC2A1 phenotype is curated in GLUT1_Deficiency_Syndrome; only the
              paroxysmal-dyskinesia presentation is modelled here.'
            genes:
            - preferred_term: SLC2A1
              term:
                id: hgnc:11005
                label: SLC2A1
          role: subtype
      assertion_type: Biochemical
      assertion:
        name: Hypoglycorrhachia
        subtype: PED
        notes: Low cerebrospinal fluid glucose with a reduced CSF:blood glucose ratio measured after a
          fast, in the presence of normal blood glucose, is the biochemical fingerprint of GLUT1 deficiency
          and therefore the single most important bedside test for the treatable cause of paroxysmal dyskinesia.
          In PED cohorts the median CSF/blood glucose ratio is around 0.52 against a normal lower limit
          above 0.60; note that the reduction can be subtle in mild GLUT1 phenotypes (ratios of 0.54 have
          been reported in genetically confirmed cases), so a borderline ratio does not exclude the diagnosis
          and SLC2A1 sequencing should follow clinical suspicion.
        presence: PRESENT
        biomarker_term:
          preferred_term: Hypoglycorrhachia
          term:
            id: HP:0011972
            label: Hypoglycorrhachia
        specificity: Highly specific for GLUT1 deficiency among the paroxysmal dyskinesias; not a feature
          of PRRT2, PNKD, KCNMA1 or ADCY5 disease. Must be interpreted against a simultaneous normal blood
          glucose to exclude systemic hypoglycaemia and against CSF pleocytosis to exclude meningitis.
      selected_evidence:
        snippet: A median CSF/blood glucose ratio of 0.52 (normal >0.60) in the patients and a reduced
          glucose uptake by mutated transporters compared with the wild-type as determined in Xenopus
          oocytes confirmed a pathogenic role of these mutations.
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/0
      evidence_path: /biochemical/0/evidence/0
      context_paths:
      - /name
