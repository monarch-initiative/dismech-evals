      assertion_type: Discussion
      assertion:
        discussion_id: trigger_genotype_mapping_breakdown
        kind: OPEN_QUESTION
        prompt: How far can the trigger-based classification (PKD, PNKD, PED) still be trusted as a guide
          to genotype and therefore to treatment?
        status: OPEN
        attaches_to:
        - pathophysiology#Trigger-Dependent Breach of the Motor Network Attack Threshold
        rationale: The trigger-to-gene-to-treatment mapping is the practical value of this entry, and
          it is under strain. SLC2A1 variants have been found in patients phenotyped as PKD and as PNKD,
          not only PED; PRRT2 variants appear in hemiplegic migraine and episodic ataxia; ADCY5 alone
          can produce kinesigenic, exertional, non-kinesigenic and nocturnal attacks. Whether the correct
          response is to keep trigger-based syndromes as a first-pass heuristic that gates a broad panel,
          or to move to genotype-first testing in all cases, is unresolved and has direct cost-effectiveness
          consequences.
      selected_evidence:
        snippet: SLC2A1 mutations were associated with variable phenotypes including paroxysmal kinesigenic
          dyskinesia, paroxysmal non-kinesigenic dyskinesia, episodic ataxia and myotonia
        supports: SUPPORT
