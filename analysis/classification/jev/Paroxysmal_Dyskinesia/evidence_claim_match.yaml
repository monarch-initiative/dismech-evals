      assertion_type: Definition
      assertion:
        name: Bruno diagnostic criteria for idiopathic paroxysmal kinesigenic dyskinesia
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'The consensus clinical criteria for idiopathic PKD, derived from review of 121 affected
          individuals: an identified kinesigenic trigger (sudden movements); short attack duration, under
          one minute; no loss of consciousness and no pain during attacks; responsiveness to antiepileptic
          drugs; exclusion of other organic disease, with a normal neurological examination; and age at
          onset between 1 and 20 years where there is no family history (applied less stringently in familial
          cases).'
        scope: Clinical recognition of idiopathic PKD; the criteria were designed to homogenise cohorts
          for gene discovery and remain the reference case definition.
        inclusion_criteria:
        - preferred_term: Identified kinesigenic trigger (sudden voluntary movement)
          term:
            id: HP:0025228
            label: Triggered by sudden movement
        - preferred_term: Attack duration under one minute
        - preferred_term: Preserved consciousness and absence of pain during attacks
        - preferred_term: Responsiveness to antiepileptic drugs
        - preferred_term: Age at onset between 1 and 20 years when there is no family history
        exclusion_criteria:
        - preferred_term: Other organic disease accounting for the attacks
        notes: 'The authors themselves note that these criteria are not universally satisfied: a clear
          kinesigenic trigger was not elicited in every case, antiepileptic response was not universal,
          and some infants had attacks during sleep. A separate infantile-onset group with different characteristics
          was identified.'
      selected_evidence:
        snippet: 'The authors propose the following diagnostic criteria for idiopathic PKD based on this
          phenotype: identified trigger for the attacks (sudden movements), short duration of attacks
          (<1 minute), lack of loss of consciousness or pain during attacks, antiepileptic drug responsiveness,
          exclusion of other organic diseases, and age at onset between 1 and 20 years if there is no
          family history'
        supports: SUPPORT
