          convulsions are also counted. Expressivity is highly variable within a single kindred — the
          same PRRT2 allele may produce isolated infantile seizures, isolated kinesigenic dyskinesia,
          both sequentially (ICCA), hemiplegic migraine, episodic ataxia, or nothing at all. Autosomal
          recessive and de novo mechanisms occur, particularly for SLC2A1 (frequently de novo), biallelic
          PRRT2, and the metabolic PED mimics.'
