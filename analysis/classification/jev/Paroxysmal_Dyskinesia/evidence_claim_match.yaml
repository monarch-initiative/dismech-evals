        subtype: PKD
        gene_term:
          preferred_term: PRRT2
          term:
            id: hgnc:30500
            label: PRRT2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        notes: Heterozygous loss-of-function variants at 16p11.2; the recurrent c.649dupC (p.Arg217Profs*8)
          frameshift dominates. Biallelic variants produce a more severe phenotype with epilepsy, ataxia
          and intellectual disability, and 16p11.2 deletions encompassing PRRT2 are a structural cause.
          Detection rate is far higher in familial than sporadic PKD.
        case_fractions:
