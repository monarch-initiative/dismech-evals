        context: []
      assertion_type: Diagnosis
      assertion:
        name: Paired fasting CSF and blood glucose
        description: In any patient with exercise- or fasting-triggered attacks, or with paroxysmal dyskinesia
          plus epilepsy, measure CSF glucose with a simultaneous blood glucose after a fast and calculate
          the CSF:blood ratio. A ratio below about 0.60 in a normoglycaemic patient indicates GLUT1 deficiency
          and should be followed by SLC2A1 sequencing plus deletion/duplication analysis. This is the
          highest-value targeted test in the whole group because it identifies the ketogenic-diet-responsive
          cause.
        presence: PRESENT
      selected_evidence:
        snippet: A median CSF/blood glucose ratio of 0.52 (normal >0.60) in the patients
        supports: SUPPORT
