        - preferred_term: Responsiveness to antiepileptic drugs
        - preferred_term: Age at onset between 1 and 20 years when there is no family history
        exclusion_criteria:
        - preferred_term: Other organic disease accounting for the attacks
        notes: 'The authors themselves note that these criteria are not universally satisfied: a clear
          kinesigenic trigger was not elicited in every case, antiepileptic response was not universal,
          and some infants had attacks during sleep. A separate infantile-onset group with different characteristics
          was identified.'
      selected_evidence:
        snippet: A clear kinesigenic trigger was not elicited in all cases, antiepileptic response was
          not universal, and some infants had attacks while asleep.
