      assertion_type: Diagnosis
      assertion:
        name: Interictal EEG and brain MRI
        description: Interictal EEG and brain MRI are typically normal in primary paroxysmal dyskinesia
          and are performed to exclude alternatives rather than to confirm the diagnosis. Video-EEG is
          specifically indicated where awareness is impaired, where attacks are sleep-related (to separate
          paroxysmal dyskinesia from sleep-related hypermotor epilepsy), or where the semiology is atypical.
          MRI is mandatory for adult onset, focal deficit, progressive course or any interictal abnormality.
        presence: ABSENT
      selected_evidence:
        snippet: Epilepsy was suspected first; however, repeat investigations with electroencephalography
          and neuroimaging were normal.
        supports: SUPPORT
