          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: Using whole-exome sequencing followed by Sanger sequencing, we identified three truncating
          mutations within PRRT2 (NM_145239.2) in eight Han Chinese families with histories of paroxysmal
          kinesigenic dyskinesia
        supports: SUPPORT
