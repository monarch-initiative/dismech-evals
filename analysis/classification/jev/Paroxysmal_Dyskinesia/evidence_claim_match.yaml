      assertion_type: Pathophysiology
      assertion:
        name: Trigger-Dependent Breach of the Motor Network Attack Threshold
        description: 'The convergence node of the entry. Whatever the upstream lesion — presynaptic release
          failure, striatal indirect-pathway hypoactivity, corticostriatal energy failure, BK or cAMP
          dysregulation, or an acquired structural insult — the result is the same: a basal-ganglia-thalamo-cortical
          and cerebello-thalamic motor network that behaves normally at baseline but has a reduced margin
          before a discrete, self-limited episode of aberrant motor output. The trigger (sudden movement,
          stimulant, stress, exertion, sleep state) supplies the perturbation that breaches the margin.
          This trigger-threshold architecture is what explains the two defining features of the group:
          attacks are stereotyped and provoked, and the examination between them is normal.'
        biological_scale: TISSUE
        role: central_effector
        locations:
        - preferred_term: striatum
          term:
            id: UBERON:0002435
            label: striatum
        - preferred_term: cerebellum
          term:
            id: UBERON:0002037
            label: cerebellum
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
        biological_processes:
        - preferred_term: regulation of membrane potential
          term:
            id: GO:0042391
            label: regulation of membrane potential
          modifier: ABNORMAL
      selected_evidence:
        snippet: Classically, PxD have been categorised according to their triggers and duration of the
          attacks, but increasing evidence suggests that there is a certain degree of clinical and genetic
          overlap and challenges the concept that one phenotype is attributable to one single aetiology.
        supports: SUPPORT
