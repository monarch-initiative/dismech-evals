        context: []
      assertion_type: Diagnosis
      assertion:
        name: Attack history with video documentation
        description: Diagnosis is fundamentally historical. Document attack phenomenology, preservation
          of awareness, the trigger, duration, frequency, body distribution, presence of a sensory aura,
          family history, the interictal examination, and treatment response. Because attacks are brief
          and almost never occur in clinic, smartphone video recorded by the family is the highest-yield
          single investigation and is what most often converts a suspected functional disorder into a
          recognised paroxysmal dyskinesia.
        presence: PRESENT
      selected_evidence:
        snippet: The diagnosis of idiopathic paroxysmal kinesigenic dyskinesia (PKD) can be made based
          on historical features.
        supports: SUPPORT
