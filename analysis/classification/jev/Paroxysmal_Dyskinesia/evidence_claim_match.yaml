      assertion_type: Subtype
      assertion:
        name: PKD
        display_name: Paroxysmal kinesigenic dyskinesia (PRRT2, TMEM151A)
        subtype_term:
          preferred_term: episodic kinesigenic dyskinesia
          term:
            id: MONDO:0044202
            label: episodic kinesigenic dyskinesia
        description: The commonest paroxysmal dyskinesia. Attacks of dystonia and/or choreoathetosis are
          triggered by sudden voluntary movement (rising from a chair, starting to walk, startle), typically
          last under one minute, and may occur many times a day, often preceded by a sensory aura in the
          affected limb. Onset is in childhood or early adolescence with a 2-4:1 male excess, and attacks
          usually decline in the third decade. Most cases carry heterozygous loss-of-function PRRT2 variants
          (recurrent c.649dupC); TMEM151A is a second locus in PRRT2-negative cases. Low-dose carbamazepine
          or oxcarbazepine is dramatically effective.
        genes:
        - preferred_term: PRRT2
          term:
            id: hgnc:30500
            label: PRRT2
        - preferred_term: TMEM151A
          term:
            id: hgnc:28497
            label: TMEM151A
      selected_evidence:
        snippet: Paroxysmal kinesigenic dyskinesia (PKD), the most common type of paroxysmal movement
          disorder, is characterized by sudden and brief attacks of choreoathetosis or dystonia triggered
          by sudden voluntary movements. PKD is mainly caused by mutations in the PRRT2 or TMEM151A gene.
        supports: SUPPORT
