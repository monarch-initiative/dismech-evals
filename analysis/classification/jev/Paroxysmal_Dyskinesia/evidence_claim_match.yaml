              and correspondingly less frequent, sometimes only a few per year. Classic autosomal dominant
              PNKD is caused by the recurrent N-terminal p.Ala7Val and p.Ala9Val variants in PNKD (myofibrillogenesis
              regulator 1, MR-1). Pharmacological response is unreliable, so trigger avoidance is the
