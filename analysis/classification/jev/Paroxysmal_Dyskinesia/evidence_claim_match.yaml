      assertion:
        name: Trigger Avoidance and Lifestyle Modification
        description: 'The mainstay in PNKD, where drug response is unreliable: systematic avoidance of
          coffee, tea, alcohol, sleep deprivation and, so far as possible, emotional stress. In PED, pacing
          of exertion and avoidance of fasting reduce attack burden alongside the ketogenic diet. Structured
          counselling about identified personal triggers, together with fall precautions and school or
          workplace accommodation, addresses much of the disability even when no drug is effective.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Lifestyle Therapy
          term:
            id: NCIT:C15900
            label: Lifestyle Therapy
        notes: 'Term-binding note: MAXO:0000053 (therapeutic avoidance of environmental exposure) is the
          semantically exact term, but the TreatmentActionTerm dynamic enum is rooted at NCIT:C25218 and
          rejects MAXO identifiers (dismech issue #7524), so the NCIT Lifestyle Therapy term is used instead.
          Its NCIT definition explicitly covers "behavioral and dietary modifications, exercise, stress
          management, and addiction control", which matches the intervention curated here.'
      selected_evidence:
        snippet: Paroxysmal non-kinesigenic dyskinesia (PNKD) is characterized by spontaneous hyperkinetic
          attacks that are precipitated by alcohol, coffee, stress and fatigue.
        supports: SUPPORT
