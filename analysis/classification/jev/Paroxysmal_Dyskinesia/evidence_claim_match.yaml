            term:
              id: MONDO:0015427
              label: paroxysmal dyskinesia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Presynaptic Release Failure and Neuronal Hyperexcitability
        description: 'PRRT2 is enriched at presynaptic terminals, where it interacts with the SNARE proteins
          SNAP-25 and syntaxin-1A, with synaptotagmin 1/2 calcium sensors, and with Nav1.2/Nav1.6 sodium
          channels and the Na+/K+ ATPase. Loss of PRRT2 desynchronises calcium-triggered vesicle fusion
          (reduced release probability and calcium sensitivity, increased asynchronous release, more docked
          vesicles at rest) while simultaneously increasing sodium-current density and lowering the action-potential
          threshold. PKD is therefore simultaneously a synaptopathy and a channelopathy: the lesion does
          not produce continuous dysfunction but a network that is stable at baseline and unstable when
          abruptly perturbed.'
        biological_scale: CELLULAR
        role: central_effector
        conforms_to: epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: chemical synaptic transmission
          term:
            id: GO:0007268
            label: chemical synaptic transmission
          modifier: ABNORMAL
        - preferred_term: calcium-ion regulated exocytosis
          term:
            id: GO:0017156
            label: calcium-ion regulated exocytosis
          modifier: DECREASED
        - preferred_term: regulation of membrane potential
          term:
            id: GO:0042391
            label: regulation of membrane potential
          modifier: ABNORMAL
        - preferred_term: sodium ion transport
          term:
            id: GO:0006814
            label: sodium ion transport
          modifier: INCREASED
        notes: 'Conformance rationale: this node declares epilepsy_excitation_inhibition_imbalance#Ion
          Channel and Synaptic Dysfunction because the PRRT2 lesion is literally an ion-channel-plus-synaptic-protein
          abnormality and because the very same PRRT2 alleles cause benign familial infantile epilepsy,
          so the excitation/inhibition-imbalance chain is not a metaphor here. The SLC2A1/GLUT1 arm of
          this entry deliberately does NOT declare module conformance: its lesion is a metabolic substrate-supply
          failure, not a primary channel or synaptic defect, even though epilepsy is a downstream consequence.'
      selected_evidence:
        snippet: PRRT2-silenced neurons exhibit a severe impairment of synchronous release, attributable
          to a sharp decrease in release probability and Ca(2+) sensitivity and associated with a marked
          increase of the asynchronous/synchronous release ratio. PRRT2 interacts with the synaptic proteins
          SNAP-25 and synaptotagmin 1/2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
