      assertion_type: Pathophysiology
      assertion:
        name: Exertion- and Fasting-Unmasked Corticostriatal Energy Failure
        description: A partially reduced glucose-transport reserve is sufficient at rest but becomes limiting
          when cerebral demand rises with sustained exertion or when substrate supply falls with fasting.
          Functional imaging in SLC2A1-related PED implicates altered glucose metabolism specifically
          in the corticostriate pathways (and in frontal cortex for the accompanying seizures), giving
          an energetic rather than a channel-based explanation for why the trigger is prolonged exercise
          and why rest or carbohydrate terminates the attack. This is the node the ketogenic diet targets,
          by supplying ketone bodies as a GLUT1-independent fuel.
        biological_scale: TISSUE
        role: mediator
        locations:
        - preferred_term: striatum
          term:
            id: UBERON:0002435
            label: striatum
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
        notes: Deliberately NOT declared as conforming to epilepsy_excitation_inhibition_imbalance. Although
          GLUT1 deficiency causes epilepsy, the primary lesion here is a metabolic substrate-transport
          failure, not an ion-channel or synaptic-protein abnormality, so claiming conformance to the
          module's ion-channel/synaptic trigger node would misrepresent the mechanism.
      selected_evidence:
        snippet: Functional imaging studies implicated alterations in glucose metabolism in the corticostriate
          pathways in the pathophysiology of PED and in the frontal lobe cortex in the pathophysiology
          of epileptic seizures.
        supports: SUPPORT
