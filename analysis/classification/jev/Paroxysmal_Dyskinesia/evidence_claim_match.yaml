        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: phd_nosology
        kind: CONTROVERSY
        prompt: Is paroxysmal hypnogenic dyskinesia (PHD) a genuine fourth subtype of paroxysmal dyskinesia,
          or is it entirely subsumed by sleep-related hypermotor epilepsy?
        status: OPEN
        attaches_to:
        - pathophysiology#Trigger-Dependent Breach of the Motor Network Attack Threshold
        rationale: 'The dominant position, formalised by the 2016 consensus that renamed nocturnal frontal
          lobe epilepsy as sleep-related hypermotor epilepsy, is that sleep-related dyskinetic attacks
          are epileptic seizures with hypermotor semiology. This entry follows that position and does
          not curate PHD as a mechanistically distinct dyskinesia. However, a 2016 screening study of
          11 PHD patients found PRRT2 variants in 2 patients with typical (short-attack) PHD and no variants
          in any of the epilepsy genes screened, and its authors concluded the opposite — that PHD is
          a subtype of paroxysmal dyskinesia rather than NFLE. The honest reading is that the PHD label
          historically pooled two populations: a majority with genetic focal epilepsy and a minority with
          short-attack PRRT2-related dyskinesia occurring in sleep. Video-EEG is the discriminator, and
          the label itself should be retired in favour of the specific diagnosis.'
        proposed_experiments:
        - experiment_id: phd_video_eeg_genotype_cohort
          name: Prospective video-EEG plus broad panel sequencing in sleep-related paroxysmal motor attacks
          description: Recruit an unselected cohort of patients with sleep-related paroxysmal motor attacks,
            obtain video-EEG on all, and sequence PRRT2, TMEM151A, CHRNA4, CHRNB2, CHRNA2, KCNT1 and DEPDC5.
            Report the proportion with an ictal epileptiform correlate, stratified by genotype and by
            attack duration.
          decision_criterion: If PRRT2-positive sleep-related cases consistently lack an ictal epileptiform
            correlate, a residual non-epileptic PHD population is supported; if they show one, PHD is
            fully subsumed by SHE.
        - experiment_id: phd_prrt2_treatment_profile
          name: Treatment-response and semiology profiling of PRRT2-positive sleep-related attacks
          description: Determine whether PRRT2-positive sleep-related cases show the carbamazepine-responsive,
            aura-preceded, short-attack profile of waking PKD or the clustered hypermotor profile of SHE.
      selected_evidence:
        snippet: It was recommended that the name be changed to sleep-related hypermotor epilepsy (SHE),
          reflecting evidence that the attacks are associated with sleep rather than time of day, the
          seizures may arise from extrafrontal sites, and the motor aspects of the seizures are characteristic.
        supports: REFUTE
