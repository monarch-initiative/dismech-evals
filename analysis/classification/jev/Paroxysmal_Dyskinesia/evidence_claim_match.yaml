      assertion:
        name: Deep Brain Stimulation
        description: Reserved for severe, medication-refractory hyperkinetic disease, principally in the
          pleiotropic genotypes (ADCY5, GNAO1) rather than in classic PKD, PNKD or PED. Globus pallidus
          internus is the usual target. Evidence is limited to case reports and small series, so this
          is recorded as a practice-level option rather than an established standard.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: Deep Brain Stimulation
          term:
            id: NCIT:C21024
            label: Deep Brain Stimulation
        notes: 'Deliberately curated without an efficacy evidence item because no controlled or cohort
          evidence for deep brain stimulation in paroxysmal dyskinesia was identified during curation;
          the supporting citation below only establishes the clinical severity that motivates considering
          it. Term-binding caveat: NCIT:C21024 is the only Deep Brain Stimulation term in NCIT and is
          reachable from NCIT:C25218, but its NCIT definition frames DBS as electroanalgesia for chronic
          pain. The intervention curated here is pallidal DBS for refractory hyperkinesia; the identifier
          is used for its label, not its definition.'
      selected_evidence:
        snippet: In one family, a p.M1029K mutation in the C2 domain causes severe dystonia, hypotonia,
          and chorea.
