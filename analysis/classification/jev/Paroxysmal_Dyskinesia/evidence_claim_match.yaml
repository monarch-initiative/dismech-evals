      assertion_type: Pathophysiology
      assertion:
        name: KCNMA1 BK-Channel Gain of Function
        description: 'Gain-of-function variants in KCNMA1 (p.Asp434Gly, p.Asn999Ser) increase calcium-activated
          BK potassium current, accelerating action-potential repolarisation and thereby permitting faster
          repetitive firing. In the D434G knock-in mouse this produces hyperexcitability of cortical pyramidal
          neurons and cerebellar Purkinje cells, and the animals recapitulate the human combination of
          absence epilepsy with dyskinesia; BK blockade with paxilline reverses both. Variant direction
          of effect, not merely the gene name, determines the mechanism: in heterologous cells p.Asn999Ser
          and p.Asp434Gly are gain-of-function while p.His444Gln is loss-of-function.'
        biological_scale: MOLECULAR
        role: trigger
        genes:
        - preferred_term: KCNMA1
          term:
            id: hgnc:6284
            label: KCNMA1
        molecular_functions:
        - preferred_term: calcium-activated potassium channel activity
          term:
            id: GO:0015269
            label: calcium-activated potassium channel activity
          modifier: INCREASED
        cell_types:
        - preferred_term: Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
      selected_evidence:
        snippet: The cortical pyramidal neurons and cerebellar Purkinje cells from the BK-D434G mice show
          hyperexcitability, which likely contributes to the pathogenesis of absence seizures and paroxysmal
          dyskinesia.
        supports: SUPPORT
