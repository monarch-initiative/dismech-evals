          term:
            id: MONDO:0700088
            label: paroxysmal nonkinesigenic dyskinesia
        description: Attacks of dystonia and choreoathetosis that arise spontaneously at rest or are precipitated
          by alcohol, coffee or tea, emotional stress, excitement and fatigue, but never by sudden movement.
          Attacks are much longer than in PKD (typically tens of minutes to hours) and correspondingly
          less frequent, sometimes only a few per year. Classic autosomal dominant PNKD is caused by the
          recurrent N-terminal p.Ala7Val and p.Ala9Val variants in PNKD (myofibrillogenesis regulator
          1, MR-1). Pharmacological response is unreliable, so trigger avoidance is the mainstay.
        genes:
        - preferred_term: PNKD
          term:
            id: hgnc:9153
            label: PNKD
      selected_evidence:
        snippet: Paroxysmal non-kinesigenic dyskinesia (PNKD) is characterized by spontaneous hyperkinetic
