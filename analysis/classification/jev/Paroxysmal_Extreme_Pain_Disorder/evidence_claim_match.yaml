              label: paroxysmal extreme pain disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nociceptor and Autonomic Neuron Hyperexcitability
        description: Nav1.7 is expressed in sympathetic and trigeminal ganglion neurons as well as in
          dorsal root ganglion nociceptors, and PEPD variants render both classes hyperexcitable. This
          dual distribution is what makes PEPD an autonomic as well as a pain disorder, and explains why
          the autonomic manifestations — flushing, harlequin colour change, bradycardic syncope — dominate
          the neonatal presentation before the pain paroxysms declare themselves.
        role: central_effector
        biological_scale: CELLULAR
        conforms_to: nociceptor_sodium_channel_excitability#Nociceptor Action Potential Threshold and
          Firing
        cell_types:
        - preferred_term: nociceptor
          term:
            id: CL:0000198
            label: pain receptor cell
        - preferred_term: autonomic neuron
          term:
            id: CL:0000107
            label: autonomic neuron
        biological_processes:
        - preferred_term: action potential
          term:
            id: GO:0001508
            label: action potential
          modifier: INCREASED
      selected_evidence:
        snippet: Using current clamp, we show that A1632E renders dorsal root ganglion (DRG) and trigeminal
          ganglion neurons hyperexcitable.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
