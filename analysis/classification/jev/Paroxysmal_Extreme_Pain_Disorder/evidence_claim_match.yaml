        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Persistent Non-Inactivating Nav1.7 Sodium Current
        description: Patch-clamp analysis of PEPD mutant channels shows reduced fast inactivation and
          a resulting persistent inward sodium current. Because this current flows during and after depolarization
          rather than lowering the threshold for depolarization, it produces sustained rather than merely
          facilitated firing — the biophysical signature that distinguishes PEPD from inherited erythromelalgia
          and that predicts its selective carbamazepine response.
        role: amplifier
        biological_scale: MOLECULAR
        conforms_to: nociceptor_sodium_channel_excitability#Enhanced or Persistent Nociceptor Sodium Current
        cell_types:
        - preferred_term: nociceptor
          term:
            id: CL:0000198
            label: pain receptor cell
        molecular_functions:
        - preferred_term: voltage-gated sodium channel activity
          term:
            id: GO:0005248
            label: voltage-gated sodium channel activity
          modifier: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: Functional analysis in vitro of three of these mutant Na(v)1.7 channels revealed a reduction
          in fast inactivation, leading to persistent sodium current.
        supports: SUPPORT
