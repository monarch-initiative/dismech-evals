              label: paroxysmal extreme pain disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SCN9A Missense Variant Impairing Nav1.7 Fast Inactivation
        description: 'A heterozygous missense variant in SCN9A alters residues governing fast inactivation
          of Nav1.7. Eight such variants were identified across 11 families and two sporadic cases in
          the founding genetic study. The lesion is mechanistically specific: it is not a generic gain
          of function but a selective failure of the channel to close after opening, which is what separates
          PEPD from the allelic erythromelalgia variants that instead shift the activation threshold.'
        role: trigger
        biological_scale: MOLECULAR
        conforms_to: nociceptor_sodium_channel_excitability#Nociceptor Voltage-Gated Sodium Channel Variant
        cell_types:
        - preferred_term: nociceptor
          term:
            id: CL:0000198
            label: pain receptor cell
        molecular_functions:
        - preferred_term: voltage-gated sodium channel activity
          term:
            id: GO:0005248
            label: voltage-gated sodium channel activity
          modifier: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: A genome-wide linkage search followed by mutational analysis of the candidate gene SCN9A,
          which encodes hNa(v)1.7, identified eight missense mutations in 11 families and 2 sporadic cases.
        supports: SUPPORT
