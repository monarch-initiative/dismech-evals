              inactivation-impaired PEPD channels and is effective in almost all patients who try it,
              although the response is usually incomplete. The selectivity is mechanistic rather than
              empirical: the same drug does not correct the hyperpolarized activation threshold of erythromelalgia
              variants and is not effective in that allelic disorder.'
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: carbamazepine
                term:
                  id: CHEBI:3387
                  label: carbamazepine
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Persistent Non-Inactivating Nav1.7 Sodium Current
        treatment_effect: INHIBITS
        description: Selective block of the non-inactivating component of the mutant Nav1.7 current.
      selected_evidence:
        snippet: Carbamazepine, a drug that is effective in PEPD, but not PE, showed selective block of
          persistent current associated with PEPD mutants, but did not affect the negative activation
          threshold of a PE mutant.
        supports: SUPPORT
