      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pepd_iem_continuum
        hypothesis_label: PEPD and inherited erythromelalgia as a biophysical continuum
        status: EMERGING
        description: The two syndromes are conventionally treated as non-overlapping, defined by impaired
          inactivation (PEPD) versus enhanced activation (IEM). A variant has been reported that produces
          both defects in the same channel and a mixed clinical phenotype, arguing that PEPD and IEM are
          ends of a physiological continuum rather than discrete entities. If correct, the clinical separation
          is a consequence of which biophysical parameter a given variant perturbs most strongly, not
          of two distinct disease mechanisms — and mixed phenotypes should be curated as such rather than
          forced into one syndrome.
      selected_evidence:
        snippet: These observations indicate that IEM and PEPD mutants are part of a physiological continuum
          that can produce a continuum of clinical phenotypes.
        supports: SUPPORT
