              label: paroxysmal familial ventricular fibrillation
        context: []
      assertion_type: Subtype
      assertion:
        name: Type 2
        display_name: Ventricular fibrillation, paroxysmal familial, 2 (DPP6)
        subtype_term:
          preferred_term: Ventricular fibrillation, paroxysmal familial, 2
          term:
            id: MONDO:0013063
            label: ventricular fibrillation, paroxysmal familial, 2
        description: DPP6-associated form, caused by a chromosome 7q36 risk haplotype that drives cardiac
          overexpression of DPP6, an accessory subunit of the transient outward potassium current (Ito).
          DPP6 gain of function selectively enhances Purkinje-fiber Ito and accelerates Purkinje repolarization,
          producing a Purkinje-system early-repolarization substrate for ventricular fibrillation. Arrhythmic
          events characteristically occur at rest in a structurally normal heart with high penetrance.
        genes:
        - preferred_term: DPP6
          term:
            id: hgnc:3010
            label: DPP6
      selected_evidence:
        snippet: We propose DPP6 as a gene for IVF and increased DPP6 expression as the likely pathogenetic
          mechanism.
        supports: SUPPORT
