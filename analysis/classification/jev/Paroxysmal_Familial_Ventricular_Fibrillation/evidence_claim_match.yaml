      assertion:
        name: Accelerated Purkinje Repolarization and Altered Excitability
        conforms_to: cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling
        role: amplifier
        description: The molecular lesion is translated into altered cellular electrophysiology. In the
          DPP6 (type 2) form, DPP6 overexpression selectively augments Purkinje-fiber transient outward
          current, accelerating Purkinje repolarization and producing a Purkinje-system early-repolarization
          phenotype; in the SCN5A (type 1) form, altered sodium-channel gating changes excitability and
          recovery. The result is regional heterogeneity of action-potential repolarization that destabilizes
          the ventricle.
        cell_types:
        - preferred_term: cardiac Purkinje fiber cell
          term:
            id: CL:0002068
            label: Purkinje myocyte
        - preferred_term: ventricular cardiomyocyte
          term:
            id: CL:2000046
            label: ventricular cardiac muscle cell
        biological_processes:
        - preferred_term: membrane repolarization
          term:
            id: GO:0086009
            label: membrane repolarization
          modifier: INCREASED
        - preferred_term: cardiac muscle cell action potential
          term:
            id: GO:0086001
            label: cardiac muscle cell action potential
          modifier: ABNORMAL
      selected_evidence:
        snippet: A mathematical model of cardiac PF action potentials showed that I(to) enhancement can
          greatly accelerate PF repolarization.
        supports: SUPPORT
