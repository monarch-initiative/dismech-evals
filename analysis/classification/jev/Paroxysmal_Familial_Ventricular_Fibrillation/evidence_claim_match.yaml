      assertion_type: Subtype
      assertion:
        name: Type 1
        display_name: Ventricular fibrillation, paroxysmal familial, type 1 (SCN5A)
        subtype_term:
          preferred_term: Ventricular fibrillation, paroxysmal familial, type 1
          term:
            id: MONDO:0011376
            label: ventricular fibrillation, paroxysmal familial, type 1
        description: SCN5A-associated form, the first molecularly defined familial idiopathic ventricular
          fibrillation locus. Cardiac sodium-channel (NaV1.5) dysfunction alters channel gating and inward
          sodium current, contributing to the arrhythmogenic substrate in a structurally normal heart.
          This locus overlaps the broader SCN5A-related cardiac rhythm disorder spectrum (including Brugada
          syndrome), and clinical/genetic boundaries between these SCN5A phenotypes are not always sharp.
        genes:
        - preferred_term: SCN5A
          term:
            id: hgnc:10593
            label: SCN5A
      selected_evidence:
        snippet: We have now identified a missense mutation, a splice-donor mutation, and a frameshift
          mutation in the coding region of SCN5A in three IVF families.
        supports: SUPPORT
