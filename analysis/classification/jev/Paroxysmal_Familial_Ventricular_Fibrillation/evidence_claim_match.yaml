        features: Pathogenic SCN5A variants alter cardiac sodium-channel (NaV1.5) gating and current.
          The original report identified missense, splice-donor, and frameshift variants in idiopathic
          ventricular fibrillation families, with one missense variant accelerating recovery from inactivation
          and the frameshift abolishing channel function. This locus overlaps the broader SCN5A-related
