            id: hgnc:3010
            label: DPP6
        conforms_to: cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant
        role: trigger
        description: Paroxysmal familial ventricular fibrillation originates in an inherited cardiac ion-channel
          defect in a structurally normal heart. In the type 1 form, SCN5A variants perturb the cardiac
          sodium channel (NaV1.5) and inward sodium current; in the type 2 form, a 7q36 risk haplotype
          drives a large increase in DPP6, an accessory subunit of the transient outward potassium current.
          Both converge on an inherited primary electrical (channelopathy) lesion rather than a structural
          cardiomyopathy.
        cell_types:
