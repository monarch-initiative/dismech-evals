          term:
            id: GO:0006813
            label: potassium ion transport
          modifier: ABNORMAL
        - preferred_term: sodium ion transport
          term:
            id: GO:0006814
            label: sodium ion transport
          modifier: ABNORMAL
      selected_evidence:
        snippet: The shared chromosomal segment harbors part of the DPP6 gene, which encodes a putative
          component of the transient outward current in the heart.
        supports: SUPPORT
