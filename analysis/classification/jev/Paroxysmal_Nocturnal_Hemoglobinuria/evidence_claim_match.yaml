        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nitric Oxide Depletion and Smooth Muscle Dystonia
        description: Cell-free plasma hemoglobin released during intravascular hemolysis scavenges nitric
          oxide. Regional nitric-oxide deficiency causes smooth-muscle dystonia manifesting as dysphagia,
          esophageal spasm, abdominal pain, and erectile dysfunction, and contributes to platelet activation
          and the prothrombotic state.
        biological_processes:
        - preferred_term: Nitric Oxide Metabolic Process
          term:
            id: GO:0046209
            label: nitric oxide metabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: With decreased or a lack of CD55 and CD59 expression on their membranes, PNH red blood
          cells become susceptible to complement-mediated hemolysis (symptoms of which include anemia,
          dysphagia, abdominal pain, and fatigue), leading to thrombosis.
        supports: SUPPORT
