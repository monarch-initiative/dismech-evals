              label: paroxysmal nocturnal hemoglobinuria
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of CD55 and CD59 Complement Regulation
        conforms_to: complement_dysregulation#Loss of Complement Regulatory Control
        description: CD55 (decay-accelerating factor) accelerates decay of the C3 and C5 convertases,
          while CD59 (membrane inhibitor of reactive lysis) blocks assembly of the terminal C5b-9 membrane
          attack complex. Their absence on PNH erythrocytes permits unrestrained amplification of the
          alternative complement pathway on the cell surface and unchecked membrane attack complex formation.
        biological_processes:
        - preferred_term: Regulation of Complement Activation
          term:
            id: GO:0030449
            label: regulation of complement activation
          modifier: DECREASED
        - preferred_term: Complement Activation, Alternative Pathway
          term:
            id: GO:0006957
            label: complement activation, alternative pathway
          modifier: INCREASED
      selected_evidence:
        snippet: The loss of two GPI-anchored surface proteins, CD55 and CD59, from red blood cells causes
          unregulated complement activation and hemolysis in classical PNH disease.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
