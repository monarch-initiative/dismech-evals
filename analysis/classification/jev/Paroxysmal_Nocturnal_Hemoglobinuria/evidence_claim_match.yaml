      assertion_type: Pathophysiology
      assertion:
        name: Clonal Expansion and Bone Marrow Failure
        description: PNH clones arise in the setting of bone marrow failure and are closely linked to
          aplastic anemia. A prevailing model holds that immune-mediated selective pressure against normal
          GPI-positive hematopoietic stem cells provides a relative survival advantage to GPI-deficient
          PIGA-mutant clones, allowing their expansion to clinically significant size.
        cell_types:
        - preferred_term: Hematopoietic Stem Cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        biological_processes:
        - preferred_term: Hematopoietic Stem Cell Proliferation
          term:
            id: GO:0071425
            label: hematopoietic stem cell proliferation
          modifier: DYSREGULATED
      selected_evidence:
        snippet: This defect arises from an acquired somatic mutation in the X-linked phosphatidylinositol
          glycan class A gene, with subsequent clonal expansion of the mutated HSCs as a result of a concomitant,
          likely immune-mediated, selective pressure.
        supports: SUPPORT
