      assertion_type: Genetic
      assertion:
        name: PIGA Somatic Mutation
        gene_term:
          preferred_term: PIGA
          term:
            id: hgnc:8957
            label: PIGA
        features: Acquired somatic loss-of-function mutations in the X-linked PIGA gene within a hematopoietic
          stem cell are the invariable cause of PNH. Because PIGA is on the X chromosome and only one
          allele is active per cell, a single inactivating mutation abolishes GPI-anchor biosynthesis.
          Mutations are diverse (frameshift, nonsense, missense, splice) and distributed throughout the
          gene, and are somatic rather than germline, so PNH is not inherited.
        frequency: OBLIGATE
      selected_evidence:
        snippet: This defect arises from an acquired somatic mutation in the X-linked phosphatidylinositol
          glycan class A gene, with subsequent clonal expansion of the mutated HSCs as a result of a concomitant,
          likely immune-mediated, selective pressure.
        supports: SUPPORT
