              label: paroxysmal nocturnal hemoglobinuria
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PIGA Mutation and GPI-Anchor Deficiency
        description: PNH originates from an acquired somatic loss-of-function mutation in the X-linked
          PIGA gene in a hematopoietic stem cell. PIGA encodes a subunit of the enzyme complex that catalyzes
          the first committed step of GPI-anchor biosynthesis. Because PIGA is X-linked and only one allele
          is active per cell, a single inactivating mutation abolishes GPI-anchor assembly, and GPI-anchor-deficient
          progeny cannot display the roughly 150 GPI-linked surface proteins, including the complement
          regulators CD55 and CD59.
        genes:
        - preferred_term: PIGA
          term:
            id: hgnc:8957
            label: PIGA
        cell_types:
        - preferred_term: Hematopoietic Stem Cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        molecular_functions:
        - preferred_term: phosphatidylinositol N-acetylglucosaminyltransferase activity
          term:
            id: GO:0017176
            label: phosphatidylinositol N-acetylglucosaminyltransferase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: GPI Anchor Biosynthetic Process
          term:
            id: GO:0006506
            label: GPI anchor biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: PNH patients develop somatic loss-of-function mutations in phosphatidylinositol N-acetylglucosaminyltransferase
          subunit A gene (PIGA), required for the biosynthesis of glycosylphosphatidylinositol (GPI) anchors.
        supports: SUPPORT
