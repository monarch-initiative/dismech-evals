      assertion_type: DifferentialDiagnosis
      assertion:
        name: Birdshot Retinochoroiditis
        description: Retinal vasculitis with HLA-A29 positivity can mimic intermediate uveitis but has
          a distinct angiographic signature.
        distinguishing_features:
        - Scoring of retinal vasculitis features such as disc hyperfluorescence and profuse posterior
          leakage separates birdshot retinochoroiditis from pars planitis.
        - Confirmation of HLA-A29 antigen supports birdshot retinochoroiditis, whereas pars planitis has
          no HLA antigen requirement.
        disease_term:
          preferred_term: birdshot chorioretinopathy
          term:
            id: MONDO:0011599
            label: birdshot chorioretinopathy
      selected_evidence:
        snippet: The control group included nine cases of sarcoidosis chorioretinitis, six cases of intermediate
          uveitis of the pars planitis type, two cases of Behçet uveitis, and one case of tuberculosis
          chorioretinitis. The mean scores for the BRC group were 10.5 ± 1.7, while in the control group,
          it was 3.9 ± 2.8 (P < 0.0001, t-test).
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
