        description: Fetal ductal patency is maintained by vasoactive signaling, including prostaglandin-mediated
          relaxation. The postnatal fall in prostaglandin tone and rise in oxygen tension normally shift
          the ductus arteriosus toward functional constriction; persistent pro-patency signaling contributes
          to PDA.
        cell_types:
        - preferred_term: vascular smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        biological_processes:
        - preferred_term: prostaglandin biosynthetic process
          modifier: INCREASED
