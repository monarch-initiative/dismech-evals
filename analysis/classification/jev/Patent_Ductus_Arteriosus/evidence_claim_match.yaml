            id: GO:0001516
            label: prostaglandin biosynthetic process
        - preferred_term: response to oxygen levels
          modifier: ABNORMAL
          term:
            id: GO:0070482
            label: response to oxygen levels
      selected_evidence:
        snippet: Normal physiologic mechanisms contributing to closure - oxygen tension and decreased
          prostaglandins-are altered in prematurity.
        supports: SUPPORT
