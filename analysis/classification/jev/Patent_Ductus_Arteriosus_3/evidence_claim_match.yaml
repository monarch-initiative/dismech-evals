      assertion_type: AnimalModel
      assertion:
        name: Prdm6fl/fl SM22-Cre mouse
        species: Mouse
        genotype: Prdm6fl/fl SM22-Cre (smooth-muscle-restricted conditional Prdm6 deletion)
        publication: PMID:35108221
        description: 'Deleting Prdm6 in smooth muscle rather than in the neural crest lineage still gives
          a completely penetrant patent duct, with contractile genes as the most downregulated transcripts
          and proliferation unchanged. This is the model that carries the most weight in the crest-versus-contractility
          disagreement: Prdm6 is lost here only after crest migration and differentiation are complete,
          so a patent duct in this cross cannot be explained by failed crest migration.'
        modeled_mechanisms:
        - target: Loss of Ductal Smooth Muscle Contractile Identity
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Contractile transcripts are the genes most reduced in this duct, which is the claim
            the identity node makes, obtained without touching the crest lineage.
          limitations: A homozygous conditional null, whereas human PDA3 is heterozygous; and the duct
            is smaller than in the crest-restricted cross, so the two lineages are not fully interchangeable.
          readouts:
          - name: Ductal contractile gene expression
            target: Loss of Ductal Smooth Muscle Contractile Identity
            direction: DECREASED
            interpretation: Tagln and Myh11 as the top downregulated genes is the transcriptional signature
              of lost contractile identity.
          - name: Ductal smooth muscle proliferation by Ki67
            target: Loss of Ductal Smooth Muscle Contractile Identity
            direction: UNCHANGED
            interpretation: 'A negative result that matters: the duct fails with a normal proliferative
              index, so the lesion is differentiation, not cell supply.'
        - target: Failure of Postnatal Ductal Closure
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Completely penetrant ductal patency in both sexes.
          limitations: Homozygous conditional null and perinatally lethal, unlike the human heterozygous
            condition.
      selected_evidence:
        snippet: Gross anatomical examination of the cardiovascular system showed a PDA, albeit with a
          smaller diameter compared with Prdm6fl/fl Wnt1-Cre2 ZsGreen1 mice
        supports: SUPPORT
