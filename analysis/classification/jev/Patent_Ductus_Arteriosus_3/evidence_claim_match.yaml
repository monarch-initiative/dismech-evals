        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: prdm6_premature_differentiation
        hypothesis_label: PRDM6 loss releases ductal smooth muscle from a proliferative, undifferentiated
          state
        status: ALTERNATIVE
        description: In the model proposed with the original human genetic finding, PRDM6 keeps ductal
          vascular smooth muscle cells undifferentiated so that they proliferate and populate the ductal
          media; PRDM6 falls postnatally as contraction-competent cells accumulate. On this view loss
          of PRDM6 activity causes premature differentiation and a shortage of the smooth muscle needed
          for the remodeling that permanently occludes the duct.
        notes: The developmental expression time course underpinning this model is reported in the paper's
          abstract without naming the species. It is graded MODEL_ORGANISM because a time course sampling
          the ductus arteriosus before and after birth is only practicable in an animal, and the deep-research
          report for this entry records it as mouse immunofluorescence at E14.5, E17.5 and P0.5.
      selected_evidence:
        snippet: This dynamic change suggests that PRDM6 plays a key role in maintaining VSMCs in an undifferentiated
          stage in order to promote their proliferation and that its loss of activity results in premature
          differentiation and impaired remodeling of the DA.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
