  cd75886d749bff4af828c95db3e0c5afc305000d68f52cbbfa1b3e748b83a0c5:
    claim:
      about:
        disease:
          name: Patent Ductus Arteriosus 3
          disease_term:
            preferred_term: patent ductus arteriosus 3
            term:
              id: MONDO:0024266
              label: patent ductus arteriosus 3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: prdm6_crest_versus_contractility
        kind: CONTROVERSY
        status: OPEN
        prompt: Does the Prdm6-null duct stay open because neural crest cells never populate its media,
          or because the smooth muscle that does populate it cannot contract?
        attaches_to:
        - pathophysiology#Impaired Cardiac Neural Crest Cell Specification and Migration
        - pathophysiology#Loss of Ductal Smooth Muscle Contractile Identity
        - mechanistic_hypotheses#prdm6_cncc_specification
        - mechanistic_hypotheses#prdm6_smc_identity
        rationale: 'Two labs ran the same Wnt1-Cre2 Prdm6fl/fl cross and disagree on the finding the crest
          model rests on. One reports the ductal media dramatically depleted of neural-crest-derived cells
          by E17.5; the other reports investment and medial morphology indistinguishable from controls,
          finds no migration defect in outflow-tract smooth muscle culture, and points out that the same
          study''s SM22-Cre model, in which Prdm6 goes only after crest migration is complete, also gives
          a patent duct. The two groups used different reporters and detection methods, which is the explanation
          offered for the discrepancy but has not been tested. This is a sharper disagreement than the
          direction-of-effect one, because the two positions predict different treatable steps: a cell-supply
          failure fixed before birth, or a contractile failure present in a normally built wall.'
        proposed_experiments:
        - experiment_id: prdm6_crest_investment_replication
          name: Reporter-matched replication of ductal neural crest investment
          description: Quantify neural-crest-derived cells in the ductal media of Wnt1-Cre2 Prdm6fl/fl
            embryos at a fixed stage, with both reporters and both detection methods run side by side
            on the same litters, so the discrepancy is tested rather than attributed to methodology.
          readouts:
          - name: Neural-crest-derived cell fraction in the ductal tunica media
            target: pathophysiology#Impaired Cardiac Neural Crest Cell Specification and Migration
            interpretation: A deficit reproduced under both detection methods would settle the question
              for the crest model; a deficit visible under only one would locate the disagreement in the
              assay.
          would_support:
          - pathophysiology#Impaired Cardiac Neural Crest Cell Specification and Migration
          would_refute:
          - pathophysiology#Loss of Ductal Smooth Muscle Contractile Identity
          supporting_outcome:
          - Neural-crest-derived cells are reduced in the mutant ductal media under both reporters and
            both detection methods.
          refuting_outcome:
          - Investment is normal under both methods, leaving the contractile defect as the operative lesion.
      selected_evidence:
        snippet: The examination of the DA of Prdm6fl/fl Wnt1-Cre2 ZsGreen1 mice at E17.5 showed dramatically
          reduced ZsGreen1-positive (NCC-derived) cells in the tunica media compared with those of the
          WT littermates
        supports: SUPPORT
