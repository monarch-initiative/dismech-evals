      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: prdm6_cncc_specification
        hypothesis_label: PRDM6 acts earlier, on cardiac neural crest specification and migration
        status: EMERGING
        description: A separate mouse study places Prdm6 upstream of the smooth muscle program altogether,
          as a regulator of cardiac neural crest cell specification, delamination, and migration acting
          through Wnt1, Tfap2b, and Sox9 and through H4K20 monomethylation. Patent ductus arteriosus in
          that model is one outcome of a broader neural crest defect that also produces ventricular noncompaction.
      selected_evidence:
        snippet: we showed that disruption of Prdm6 was associated with impaired CNCC differentiation,
          delamination, and migration and led to patent ductus arteriosus (DA) and ventricular noncompaction
        supports: SUPPORT
