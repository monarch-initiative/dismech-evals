      assertion_type: Treatment
      assertion:
        name: Cyclooxygenase-inhibitor pharmacologic closure
        description: 'Indomethacin and ibuprofen close the duct in preterm infants by suppressing the
          prostaglandin E2 tone that maintains patency. They are recorded here for contrast rather than
          as a treatment for this disease: PDA3 is a defect of the ductal smooth muscle program rather
          than of the prostaglandin signal, and in the Prdm6-deficient mouse duct the same prostaglandin-inhibition
          manoeuvre that closes control ducts does nothing. No trial of pharmacologic closure in a PRDM6
          variant carrier has been reported.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: indomethacin
            term:
              id: CHEBI:49662
              label: indometacin
          - preferred_term: ibuprofen
            term:
              id: CHEBI:5855
              label: ibuprofen
        notes: The refuting evidence is from a homozygous conditional mouse null, not from human PRDM6
          variant carriers, so it constrains the expected mechanism rather than reporting a failed human
          treatment.
      selected_evidence:
        snippet: Pharmacologic closure can be achieved via administration of intravenous indomethacin
          or ibuprofen lysine.
        supports: SUPPORT
