  017c1e33e8dec3528cc4f811e92e69f251cd70ee279640e534f55af8ab51babd:
    claim:
      about:
        disease:
          name: Patent Ductus Arteriosus 3
          disease_term:
            preferred_term: patent ductus arteriosus 3
            term:
              id: MONDO:0024266
              label: patent ductus arteriosus 3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: prdm6_human_tissue_gap
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the mouse ductal and neural crest phenotypes reflect what heterozygous PRDM6 variants
          do in the human ductus arteriosus?
        attaches_to:
        - pathophysiology#Impaired Cardiac Neural Crest Cell Specification and Migration
        - pathophysiology#Impaired Ductal Contractile Tone
        rationale: 'Every mechanistic step below the variant itself rests on mouse models that delete
          Prdm6 homozygously in a lineage-restricted way and are perinatally lethal, while human PDA3
          is a viable heterozygous condition. One of those models also produces ventricular noncompaction,
          which is not reported in PRDM6 variant carriers, so the models are not simply milder or stronger
          versions of the human disease. No human ductal tissue from a PRDM6 variant carrier has been
          profiled. The dosage mismatch is not merely quantitative: in the mouse, losing one copy of Prdm6
          leaves ductal closure intact, whereas in humans a single altered copy is sufficient to cause
          disease.'
        proposed_experiments:
        - experiment_id: prdm6_human_ductal_tissue
          name: Molecular profiling of ductal tissue from PRDM6 variant carriers
          description: Collect ductal tissue at the time of surgical ligation from patients with a confirmed
            heterozygous PRDM6 variant and profile smooth muscle contractile gene expression, medial cellularity,
            and intimal cushion formation against duct tissue from term infants closing without a PRDM6
            variant.
          readouts:
          - name: Ductal medial smooth muscle contractile marker expression
            target: pathophysiology#Impaired Ductal Contractile Tone
            interpretation: Reduced contractile marker expression in human carrier tissue would carry
              the mouse finding across to the human duct.
          would_support:
          - pathophysiology#Impaired Ductal Contractile Tone
          supporting_outcome:
          - Carrier ductal tissue shows reduced contractile marker expression and absent intimal cushion
            formation relative to non-carrier term ductal tissue.
          refuting_outcome:
          - Carrier ductal tissue is indistinguishable from non-carrier term ductal tissue in contractile
            marker expression and medial structure.
      selected_evidence:
        snippet: Taken together these data indicated that PRDM6 expression was absolutely required for
          DA closure, that Cre expression alone or deletion of 1 copy of PRDM6 had no effect on ductus
          closure, and that the floxed PRDM6 allele behaved in a manner similar to the WT allele.
        supports: SUPPORT
