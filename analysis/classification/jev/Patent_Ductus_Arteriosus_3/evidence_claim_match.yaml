          description: The model is the sole source of the neural-crest route in this entry, with lineage
            tracing and single-cell transcriptomics supporting the migration defect.
          limitations: The crest defect has not been demonstrated in human PDA3 tissue, and this model
            also produces ventricular noncompaction, which is not a reported feature of the human PRDM6-related
            phenotype.
          readouts:
          - name: Retention of neural crest cells in the dorsal neural tube
            target: Impaired Cardiac Neural Crest Cell Specification and Migration
            direction: INCREASED
            interpretation: Failure to leave the neural tube is the cellular correlate of the migration
              defect this node asserts.
        - target: Failure of Postnatal Ductal Closure
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: The model produces patent ductus arteriosus, but as one element of a broader neural
            crest phenotype that includes ventricular noncompaction.
          limitations: Human PDA3 is by definition isolated and nonsyndromic, so a model whose ductal
            lesion comes packaged with ventricular noncompaction departs from the human entity in exactly
            the feature that defines it.
      selected_evidence:
        snippet: Here, we identified Prdm6 as an epigenetic modifier that temporally and spatially regulates
          the expression of NCC specifiers and determines the fate of a subset of migrating cardiac NCCs
          (CNCCs).
        supports: SUPPORT
