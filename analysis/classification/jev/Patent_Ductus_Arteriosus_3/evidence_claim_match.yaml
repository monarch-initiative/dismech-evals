        expressivity: VARIABLE
        description: 'PDA3 segregates as an autosomal dominant trait: heterozygous PRDM6 variants were
          identified by combined linkage analysis and whole-exome sequencing in families with isolated
          nonsyndromic patent ductus arteriosus, and heterozygous variants have since been reported in
          further probands with PDA with or without coarctation of the aorta. Penetrance is incomplete:
          obligate carriers in the index kindred are reported unaffected. Expressivity is variable, ranging
          from isolated patent ductus arteriosus to patent ductus arteriosus with coarctation of the aorta
          among carriers.'
