        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: prdm6_direction_of_effect
        kind: CONTROVERSY
        status: OPEN
        prompt: Does PRDM6 loss cause patent ductus arteriosus by releasing ductal smooth muscle cells
          into premature differentiation, or by failing to build their contractile identity in the first
          place?
        attaches_to:
        - pathophysiology#Deregulated Ductal Smooth Muscle Transcriptional Program
        - pathophysiology#Loss of Ductal Smooth Muscle Contractile Identity
        - pathophysiology#Premature Ductal Smooth Muscle Differentiation
        - mechanistic_hypotheses#prdm6_premature_differentiation
        - mechanistic_hypotheses#prdm6_smc_identity
        rationale: 'The two published models assign opposite signs to the same molecule. The human genetic
          study describes PRDM6 as a transcriptional suppressor of contractile proteins that holds ductal
          smooth muscle cells undifferentiated, so that loss of function produces premature differentiation.
          The conditional knockout study finds that loss of Prdm6 downregulates a ductus-enriched contractile
          gene program and reduces ductal tone, which is what a positive, identity-building role predicts.
          Both are supported by direct data, though not symmetrically: two independent conditional-knockout
          datasets report reduced contractile gene expression on Prdm6 loss, while the premature-differentiation
          model rests on an expression time course plus in vitro assays, and its reduced-proliferation
          corollary was subsequently refuted by Ki67 measurement. The entry carries both rather than silently
          retiring one. Resolving the direction of effect matters because it determines whether a therapeutic
          aimed at the ductal smooth muscle program would need to promote or restrain contractile differentiation.'
        proposed_experiments:
        - experiment_id: prdm6_dose_matched_contractile_program
          name: Contractile gene program in dose-matched PRDM6 loss
          description: Profile the contractile gene program and the proliferative index of ductal smooth
            muscle across a PRDM6 dosage series (heterozygous patient-variant knock-in, heterozygous null,
            homozygous null) in the same ductal tissue and at matched developmental stages, so that the
            direction of effect is read from one comparable experiment rather than across two study designs.
          readouts:
          - name: Ductal contractile gene expression
            target: pathophysiology#Loss of Ductal Smooth Muscle Contractile Identity
            interpretation: Downregulation across the dosage series favors the identity-building model.
          - name: Ductal smooth muscle proliferative index
            target: pathophysiology#Premature Ductal Smooth Muscle Differentiation
            interpretation: An early fall in proliferation with early contractile marker gain favors the
              premature-differentiation model.
          would_support:
          - pathophysiology#Loss of Ductal Smooth Muscle Contractile Identity
          would_refute:
          - pathophysiology#Premature Ductal Smooth Muscle Differentiation
          supporting_outcome:
          - Ductal contractile gene expression falls with reducing PRDM6 dose while the proliferative
            index is unchanged or increased.
          refuting_outcome:
          - Contractile markers appear earlier than in wild-type ducts and the proliferative index falls,
            with medial cellularity reduced at term.
      selected_evidence:
        snippet: This dynamic change suggests that PRDM6 plays a key role in maintaining VSMCs in an undifferentiated
          stage in order to promote their proliferation and that its loss of activity results in premature
          differentiation and impaired remodeling of the DA.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27181681
      reference_title: Mutations in the Histone Modifier PRDM6 Are Associated with Isolated Nonsyndromic
        Patent Ductus Arteriosus.
      evidence_source: MODEL_ORGANISM
      explanation: 'One side of the disagreement: PRDM6 restrains differentiation, so its loss causes
        premature differentiation.'
