      assertion:
        name: Premature Ductal Smooth Muscle Differentiation
        description: Ductal smooth muscle cells exit the proliferative, undifferentiated state too early,
          so the ductal wall is differentiated on the wrong schedule when the postnatal remodeling window
          opens. The originally proposed corollary, that the medial cell population is thereby depleted,
          is refuted by the Ki67 evidence recorded on this node.
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        cell_types:
        - preferred_term: ductal vascular smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        biological_processes:
        - preferred_term: smooth muscle cell proliferation
          modifier: ABNORMAL
          term:
            id: GO:0048659
            label: smooth muscle cell proliferation
        notes: 'The proliferation arm of this model is contradicted by direct measurement: the original
          human paper inferred reduced proliferation from a developmental expression time course, while
          the conditional knockout that tested it with Ki67 found none. What survives is the claim about
          differentiation timing, not about medial cell number.'
      selected_evidence:
        snippet: Taken together, these findings indicated that the patency of the DA in Prdm6fl/fl Wnt1-Cre2
          ZsGreen1 mice was not caused by impaired proliferation of NCC-derived SMCs.
        supports: REFUTE
