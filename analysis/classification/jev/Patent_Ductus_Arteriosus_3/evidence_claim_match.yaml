  faf79d133aa167bdb70ec45e15ef6fda084a1c366721f08eef5870e98035db27:
    claim:
      about:
        disease:
          name: Patent Ductus Arteriosus 3
          disease_term:
            preferred_term: patent ductus arteriosus 3
            term:
              id: MONDO:0024266
              label: patent ductus arteriosus 3
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: prdm6_smc_identity
        hypothesis_label: PRDM6 is required to build ductal smooth muscle contractile identity
        status: ALTERNATIVE
        description: Conditional deletion of Prdm6 in the neural-crest lineage gives a fully penetrant
          patent ductus arteriosus in which the duct is normally invested with smooth muscle but is hypocontractile,
          and a ductus-enriched contractile gene program is downregulated. On this view PRDM6 is needed
          to establish, rather than to restrain, the contractile program, and PDA follows from failure
          of active constriction.
        notes: This runs in the opposite direction to the premature-differentiation model with respect
          to whether PRDM6 represses or promotes contractile gene expression; the discrepancy is recorded
          as an open discussion in this entry.
      selected_evidence:
        snippet: RNA-Seq analyses on DA and ascending aorta samples at E18.5 identified a DA-enriched
          gene program that included many SMC-selective contractile associated proteins that was downregulated
          by Prdm6 depletion.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
