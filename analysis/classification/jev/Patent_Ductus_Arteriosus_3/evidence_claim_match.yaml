        variant_origin: GERMLINE
        gene_term:
          preferred_term: PRDM6
          term:
            id: hgnc:9350
            label: PRDM6
        notes: PRDM6 encodes a nuclear PR/SET-domain protein restricted to vascular smooth muscle cells,
          with histone methyltransferase activity. The discovery paper describes it as a transcriptional
          suppressor of contractile proteins; the conditional knockout work reads the same gene as required
          to build that contractile program, and the entry carries the disagreement rather than settling
          it. Heterozygous variants cause isolated nonsyndromic patent ductus arteriosus. The parent entry
          Patent_Ductus_Arteriosus curates PRDM6 as a developmental susceptibility locus for PDA generally
          and explicitly does not curate it there as a deterministic Mendelian cause; this entry is where
          the Mendelian PRDM6-caused form is curated. The three variants listed carry ClinVar accessions,
          each classified Pathogenic for patent ductus arteriosus 3; their domain assignments come from
          the primary article's body, which is not in the reference cache, so they are described rather
          than cited to a snippet.
        variants:
        - name: c.1646G>A (p.Arg549Gln)
          description: Missense variant in the fourth zinc-finger region. Reported in the index kindred
            and characterized in vitro as loss of function through cytoplasmic mislocalization of the
            protein.
          clinical_significance: PATHOGENIC
          regulatory_category: LOF
          type: missense_variant
          identifiers:
          - ClinVar:VCV000243049
        - name: c.788G>C (p.Cys263Ser)
          description: Missense variant in the SET (PR) domain, the catalytic region, reported in a proband
            with affected mother and maternal grandfather.
          clinical_significance: PATHOGENIC
          regulatory_category: LOF
          type: missense_variant
          identifiers:
          - ClinVar:VCV000243050
        - name: c.1385A>G (p.Gln462Arg)
          description: Missense variant reported in an affected mother and daughter.
          clinical_significance: PATHOGENIC
          regulatory_category: LOF
          type: missense_variant
          identifiers:
          - ClinVar:VCV000243051
      selected_evidence:
        snippet: Our findings identify PRDM6 mutations as underlying genetic causes of nonsyndromic isolated
          PDA in humans and implicates the wild-type protein in epigenetic regulation of ductus remodeling.
        supports: SUPPORT
