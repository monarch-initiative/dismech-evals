      assertion_type: Discussion
      assertion:
        discussion_id: pans_no_confirmatory_biomarker
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - diagnosis#Clinical diagnostic criteria
        prompt: Is there any laboratory or imaging measurement that confirms PANS, rather than only excluding
          alternatives?
        rationale: PANS is defined entirely by clinical phenotype and time course. The entry's own pathophysiology
          nodes propose a post-infectious immune-mediated basal ganglia process, but the sequencing study
          cited here says in as many words that direct evidence of autoimmunity is often lacking, and
          no cited source offers a confirmatory test. Until one exists, every mechanistic node in this
          entry rests on a diagnosis that cannot be independently verified, which bounds what the entry
          can claim.
      selected_evidence:
        snippet: Although several biomarkers (particularly those related to the post-infectious and auto-immune
          mechanism response) are regularly used in PANS diagnostic process, more information is needed
          about their correlation with specific clinical features and with PANS symptoms severity.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
