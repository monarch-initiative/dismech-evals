              label: pediatric acute-onset neuropsychiatric syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Post-infectious / immune-mediated basal ganglia neuroinflammation
        description: PANS is hypothesized to arise when an infectious or immune trigger provokes a dysregulated
          immune response that, via molecular mimicry and/or neuroinflammation, targets the basal ganglia,
          disrupting cortico-striato-thalamo-cortical circuits and producing acute-onset obsessive-compulsive
          and neuropsychiatric symptoms. Unlike PANDAS, PANS does not require a demonstrated streptococcal
          trigger and may follow other infections (e.g., Mycoplasma, viral) or non-infectious immune activation.
        biological_scale: TISSUE
      selected_evidence:
        snippet: Symptom onset is often temporally associated with infections, suggesting an underlying
          autoimmune/autoinflammatory etiology, although direct evidence is often lacking.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
