      assertion_type: Pathophysiology
      assertion:
        name: Broadened diagnostic construct beyond streptococcus
        notes: Deliberately carries no `biological_scale` and no `downstream` edges. This node records
          how the diagnostic category was drawn, not a process or state in a patient, so no scale applies
          to it and it has nothing mechanistic to be upstream of. It is kept in `pathophysiology` rather
          than moved to `description` or `discussions` because the trigger-agnostic boundary is what separates
          this entry from the PANDAS one, and it carries its own cited evidence; a reviewer who would
          prefer nosology out of the pathograph should read this as the decision rather than an oversight.
        description: PANS was defined to capture children with an abrupt-onset PANDAS-like presentation
          in whom a streptococcal trigger cannot be established, reframing the condition around its acute
          neuropsychiatric phenotype and time course rather than a specific pathogen. PANDAS is the subset
          in which group A streptococcal infection is the identified precipitant.
      selected_evidence:
        snippet: Unlike PANDAS, PANS is not strictly linked to group A streptococcal infections but can
          be triggered by various infectious or environmental factors.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39512340
      reference_title: 'Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric
        disorder associated with streptococcal infections: a delphi study and consensus document about
        definition, diagnostic criteria, treatment and follow-up'
      evidence_source: OTHER
      explanation: The 2024 Delphi consensus states that PANS, unlike PANDAS, is not restricted to streptococcal
        triggers, supporting the broadened construct.
