            term:
              id: MONDO:1060178
              label: pediatric acute-onset neuropsychiatric syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Candidate susceptibility genes converging on immune and synaptic pathways
        biological_scale: MOLECULAR
        description: PANS has no established causal gene. A 2022 exome/genome sequencing study of a US
          cohort (386 cases) plus 10 severe European cases identified de novo or ultra-rare candidate
          variants in 11 genes (PPM1D, SGCE, PLCG2, NLRC4, CACNA1B, SHANK3, CHEK2, GRIN2A, RAG1, GABRG2,
          SYNGAP1) in 21 cases, partitioning into peripheral-immune/microglial and neuronal/synaptic functional
          categories. These are hypothesis-generating susceptibility candidates rather than diagnostic
          markers, and many cases arose on a pre-existing neurodevelopmental disorder.
      selected_evidence:
        snippet: genetic variation in PANS candidate genes may function by disrupting peripheral and central
          immune functions, neurotransmission, and/or the blood-CSF/brain barriers following stressors
          such as infection
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
