              label: PANDAS
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Th17-mediated CNS entry and blood-brain barrier breakdown
        biological_scale: CELLULAR
        description: A second, cellular arm of the post-streptococcal mechanism, separate from the humoral
          one. Repeated intranasal group A streptococcal challenge in mice drives streptococcus-specific
          Th17 cells from nasal-associated lymphoid tissue into the brain, with blood-brain barrier breakdown,
          serum IgG deposition, microglial activation and loss of excitatory synaptic proteins - and with
          no viable bacteria recoverable from CNS tissue. The affected regions are the olfactory bulb
          and its direct projection targets. This offers a route by which the cross-reactive antibodies
          of the mimicry node could reach their neuronal targets at all.
        notes: Entirely mouse-derived. No cited source demonstrates Th17 CNS infiltration or barrier breakdown
          in a child with PANDAS, so this node states a proposed route rather than an observed one, and
          its downstream edge is marked indirect with unknown intermediates for that reason. It is included
          because the humoral arm on its own does not explain how antibodies reach neurons.
      selected_evidence:
        snippet: Intranasal challenge of repeatedly GAS-inoculated mice promoted migration of GAS-specific
          Th17 cells from NALT into the brain, BBB breakdown, serum IgG deposition, microglial activation,
          and loss of excitatory synaptic proteins under conditions in which no viable bacteria were detected
          in CNS tissue.
        supports: SUPPORT
