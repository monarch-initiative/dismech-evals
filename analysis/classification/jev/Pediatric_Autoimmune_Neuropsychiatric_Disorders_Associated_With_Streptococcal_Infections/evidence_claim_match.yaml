    evidence_metadata:
      reference: PMID:39325550
      reference_title: Dopamine receptor autoantibody signaling in infectious sequelae differentiates
        movement versus neuropsychiatric disorders
      evidence_source: IN_VITRO
      explanation: States the molecular mimicry hypothesis and the experimental result that supports it
        - microbial antigens competed away autoantibody reactivity with the dopamine receptors. This is
