      assertion_type: Pathophysiology
      assertion:
        name: Post-streptococcal molecular mimicry
        biological_scale: MOLECULAR
        description: In a subset of children, group A streptococcal infection elicits antibodies that
          cross-react with neuronal antigens, proposed to reflect molecular mimicry between streptococcal
          epitopes and host brain proteins. This is the defining etiologic feature distinguishing PANDAS
          from the broader, trigger-agnostic PANS construct.
      selected_evidence:
        snippet: Furthermore, the molecular mimicry hypothesis whereby microbes share antigens with host
          tissues such as the brain and lead to autoimmune sequelae is supported by our data in that microbial
          antigens were sufficient to remove AAb reactivity with D1R and D2R
        supports: SUPPORT
    origin:
