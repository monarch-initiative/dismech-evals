        context:
        - path: /animal_models/0
          value:
            name: GAS-antigen-exposed Lewis rat model of streptococcal neuropsychiatric disease
            species: Rat
            genotype: wild-type
            background: Male Lewis rat
            publication: PMID:22534626
            description: Male Lewis rats immunised with group A streptococcal antigen develop compulsive-like
              grooming and motor abnormalities, striatal, thalamic and frontal-cortical IgG deposition,
              and altered dopamine and glutamate levels. Serum IgG reacts with tubulin and raises CaMKII
              signalling in neuronal cells, and the behavioural abnormalities respond to a D2 blocker
              and to an SSRI. It was built as a model of Sydenham chorea and related streptococcus-associated
              neuropsychiatric disorders.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Anti-neuronal antibody targeting of the basal ganglia
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: ORGANISM
        description: 'Reproduces the core claim of this node in an animal: streptococcal exposure alone
          produces antibody deposition in basal ganglia and related structures, with the CaMKII signalling
          and D1/D2 receptor autoantibodies the node describes, and with behavioural consequences.'
        limitations: Immunisation with streptococcal antigen plus adjuvant is not natural infection, and
          a rat's induced grooming is a behavioural analogue of compulsion rather than obsessive-compulsive
          disorder. The model was developed for Sydenham chorea, which shares the mechanism but not the
          PANDAS diagnostic criteria, and it says nothing about the prepubertal onset or streptococcal
          temporal association those criteria require.
