      assertion:
        name: Crosslinking-enzyme deficiency in acral PSS
        description: In acral PSS, loss of TGM5 (transglutaminase 5) impairs crosslinking of cornified
          envelope structural proteins (loricrin, involucrin, small proline-rich proteins) via gamma-glutamyl-epsilon-lysine
          isopeptide bonds. The resulting defective cornified envelope assembly weakens corneocyte cohesion
          at the stratum corneum-granulosum interface, producing superficial acral peeling.
        genes:
        - preferred_term: TGM5
          term:
            id: hgnc:11781
            label: TGM5
        cell_types:
        - preferred_term: Keratinocyte
          term:
            id: CL:0000312
