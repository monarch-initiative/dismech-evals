      assertion_type: Pathophysiology
      assertion:
        name: Protease-inhibitor imbalance and corneocyte over-desquamation
        description: Epidermal desquamation is normally a tightly regulated balance between proteases
          (e.g., kallikrein-related peptidases, calpain) that degrade corneodesmosomes and their endogenous
          inhibitors. In protease-inhibitor PSS subtypes, loss of CSTA (cystatin A), CAST (calpastatin),
          or SERPINB8 removes this brake, leading to unregulated proteolytic cleavage of corneodesmosomal
          adhesion proteins and premature/over-desquamation of corneocytes. Elevated tissue kallikrein
          activity has been reported in type B PSS stratum corneum and serum.
        genes:
        - preferred_term: CSTA
