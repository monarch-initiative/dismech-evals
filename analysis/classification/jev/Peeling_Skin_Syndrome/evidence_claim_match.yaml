          term:
            id: GO:1903575
            label: cornified envelope assembly
          modifier: ABNORMAL
      selected_evidence:
        snippet: TGM5 is involved in cross-linking structural proteins for the formation of the cornified
          envelope, by catalyzing the formation of γ-glutamyl-ε-lysine isopeptide bonds between differentiation-specific
          proteins expressed mainly in corneocytes, including loricrin, involucrin and small proline-rich
          proteins
        supports: SUPPORT
