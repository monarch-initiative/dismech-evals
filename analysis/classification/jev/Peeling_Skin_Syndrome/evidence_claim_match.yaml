              label: peeling skin syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Filaggrin-2 deficiency with secondary corneodesmosin reduction
        description: In FLG2-related generalized peeling skin syndrome, a homozygous nonsense variant
          leaves almost no filaggrin-2 in the epidermis. Filaggrin-2 is an S100 fused-type protein expressed
          throughout the cornified cell layers, where it sits in close proximity to corneodesmosin. Filaggrin-2
          loss lowers corneodesmosin expression in patient epidermis, and silencing FLG2 in keratinocytes
          reduces cell-cell adhesion, an effect that worsens at elevated temperature and so tracks the
          heat-exacerbated clinical peeling. Restoring corneodesmosin rescues the adhesion defect, placing
          reduced corneodesmosin between filaggrin-2 deficiency and the corneodesmosome cohesion failure
          shared with the other subtypes. The authors note that heterozygous carriers of CDSN null variants
          are typically asymptomatic, so reduced corneodesmosin contributes to but does not fully explain
          the adhesion defect.
        genes:
        - preferred_term: FLG2
          term:
            id: hgnc:33276
            label: FLG2
        cell_types:
        - preferred_term: Keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        biological_processes:
        - preferred_term: Keratinocyte cell-cell adhesion in the cornified layers
          term:
            id: GO:0098609
            label: cell-cell adhesion
          modifier: DECREASED
        locations:
        - preferred_term: Cornified cell layers of the epidermis
          term:
            id: UBERON:0002027
            label: stratum corneum of epidermis
      selected_evidence:
        snippet: The absence of filaggrin 2 in the patient skin was associated with markedly decreased
          corneodesmosin expression, which may contribute to the peeling phenotype displayed by the patients.
        supports: SUPPORT
    origin:
