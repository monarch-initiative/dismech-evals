            term:
              id: MONDO:0019347
              label: peeling skin syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective corneodesmosome-mediated corneocyte cohesion
        description: Across PSS subtypes, the unifying defect is impaired cohesion of corneocytes in the
          stratum corneum. Corneodesmosomes are the modified desmosomes that hold corneocytes together;
          corneodesmosin (CDSN), together with desmoglein-1 and desmocollin-1, is a central adhesive component.
          Loss of corneodesmosin or related structural proteins weakens intercellular adhesion at the
          granular-to-cornified transition, producing superficial cleavage and visible peeling.
        cell_types:
        - preferred_term: Keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        biological_processes:
        - preferred_term: Cell-cell adhesion
          term:
            id: GO:0098609
            label: cell-cell adhesion
          modifier: DECREASED
        - preferred_term: Keratinocyte differentiation
          term:
            id: GO:0030216
            label: keratinocyte differentiation
        locations:
        - preferred_term: Stratum corneum of epidermis
          term:
            id: UBERON:0002027
            label: stratum corneum of epidermis
      selected_evidence:
        snippet: The corneodesmosome, a modified form of desmosome found in the stratum corneum and inner
          root sheath of the hair follicles, differs ultrastructurally from the desmosome and is shown
          to play an important role in intercellular adhesion between corneocytes in the cornified cell
          layer
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25473393
      reference_title: A Case of Inflammatory Generalized Type of Peeling Skin Syndrome Possibly Caused
        by a Homozygous Missense Mutation of CDSN.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the corneodesmosome and its constituent corneodesmosin as the adhesive
        structure whose disruption underlies corneocyte detachment in PSS.
