      assertion_type: Pathophysiology
      assertion:
        name: Loss of corneodesmosin and epidermal barrier breakdown
        genes:
        - preferred_term: CDSN
          term:
            id: hgnc:1802
            label: CDSN
        conforms_to: epidermal_cornification_failure#Stratum Corneum Permeability Barrier Failure
        description: In CDSN-related inflammatory generalized PSS (PSS1/peeling skin disease), complete
          loss of corneodesmosin abolishes corneodesmosome adhesion, causing superficial cleavage above
          the stratum granulosum and a severe epidermal barrier defect. Barrier failure increases transepidermal
          water loss and antigen penetration, predisposing to pruritus and atopic disease (elevated IgE,
          food allergies). The murine Cdsn knockout dies postnatally from barrier breakdown, confirming
          corneodesmosin's essential barrier role.
        cell_types:
        - preferred_term: Keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        biological_processes:
        - preferred_term: Establishment of skin barrier
          term:
            id: GO:0061436
            label: establishment of skin barrier
          modifier: DECREASED
        locations:
        - preferred_term: Skin epidermis
          term:
            id: UBERON:0001003
            label: skin epidermis
      selected_evidence:
        snippet: we have identified a homozygous nonsense mutation in CDSN in a large consanguineous family
          with generalized peeling skin, pruritus, and food allergies, which leads to a complete loss
          of corneodesmosin
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
