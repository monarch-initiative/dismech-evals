        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lbr_domain_attribution
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Heterochromatin Redistribution in the Granulocyte Nucleus
        - pathophysiology#Reduced LBR Sterol C14-Reductase Activity
        prompt: Does Pelger-Huet anomaly arise from loss of LBR's heterochromatin-tethering function,
          from loss of its sterol C14-reductase function, or from neither individually?
        rationale: 'Three positions are defended in the literature and they are not reconcilable by emphasis.

          The structural reading is that less LBR means less heterochromatin tethered at the nuclear periphery
          and therefore no lobulation. It is the intuitive one, and the quantitative human dose-response
          result cited below is what it is usually taken to rest on: across 26 subjects carrying zero
          to three wild-type LBR alleles, about 65 per cent of the variance in nuclear segmentation tracks
          allele count. Note that this establishes dose-dependence on LBR quantity, not which of LBR''s
          two domains does the work - so on its own it is equally consistent with the third position below.

          The metabolic reading is that the mutations causing both Pelger-Huet anomaly and Greenberg dysplasia
          lie in the transmembrane segments and act through cholesterol synthesis, and that no harmful
          mutation of the anchoring function has been reported at all.

          Against the metabolic reading there is a direct mouse experiment, and it is the strongest single
          piece of evidence here. DHCR14 encodes a second sterol delta-14-reductase, so LBR is not the
          only one. Disrupting Dhcr14 in mice produces essentially normal animals, Lbr-null mice do not
          resemble the Dhcr14 mutants, and no sterol abnormalities were detected in liver or kidney of
          either. On that basis the authors argue these disorders are laminopathies rather than inborn
          errors of cholesterol synthesis. Note this cuts against the metabolic account for the LBR disorders
          as a class, which includes Greenberg dysplasia, where a separate line of yeast-complementation
          evidence supports the enzymatic reading - so the contradiction is live rather than settled.

          A third possibility, consistent with the truncation-instability finding, is that the operative
          variable is total LBR protein quantity and neither domain function is separately causal for
          the nuclear phenotype.

          One experiment does bear on the domain question directly, and it favours the metabolic reading:
          in the EML ic/ic line, expressing the C-terminal sterol reductase domain alone rescued nuclear
          lobulation as well as growth arrest, lipid production and the respiratory burst. Two things
          keep this from settling the argument. It is a cultured myeloid line rather than an animal or
          a patient, so it inherits the in-vitro caveat recorded on the same system elsewhere in this
          entry; and a domain that is sufficient in a rescue construct is not thereby the domain whose
          loss causes the human disease, since an over-expressed fragment can restore a phenotype by a
          route the endogenous protein does not take.

          The distinction is not academic: it determines whether the anomaly belongs with the laminopathies
          or with the inborn errors of sterol metabolism, and this entry lists both as parents rather
          than choosing.'
      selected_evidence:
        snippet: Mutations within the transmembrane segments result in defects in cholesterol synthesis
          and are associated with diseases such as the Pelger-Huët anomaly and Greenberg skeletal dysplasia,
          whereas no such harmful mutations related to the anchoring properties of LBR have been reported
          so far.
        supports: REFUTE
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
