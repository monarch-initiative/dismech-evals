      assertion_type: DifferentialDiagnosis
      assertion:
        name: Pseudo-Pelger-Huet anomaly
        description: 'Acquired hyposegmentation of neutrophil nuclei, seen in myelodysplastic syndromes,
          acute leukaemia, severe infection and as a drug effect. Morphologically it can be indistinguishable
          from the inherited trait on a single film, which is the whole clinical problem: here the finding
          is a marker of dysplasia and demands a haematological work-up, whereas in the inherited trait
          it demands nothing.'
        distinguishing_features:
        - Acquired rather than lifelong, so an earlier normal film settles it where one exists
        - Typically affects a proportion of neutrophils rather than nearly all of them
        - Accompanied by other dysplastic features and by cytopenias
        - No LBR germline variant, and no affected first-degree relatives
      selected_evidence:
        snippet: Guidance is given for distinguishing PHA from other hematologic disorders in which granulocytes
          may show similar changes.
        supports: SUPPORT
        directness: DIRECT
