  587be8b1d006648eb30a54522ebcad05502efc8ac69c8a9aa3893b73354c059f:
    claim:
      about:
        disease:
          name: Pelger-Huet Anomaly
          disease_term:
            preferred_term: Pelger-Huet anomaly
            term:
              id: MONDO:0008214
              label: Pelger-Huet anomaly
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lobulation_function_without_burden
        kind: KNOWLEDGE_GAP
        attaches_to:
        - phenotypes#Hyposegmentation of Neutrophil Nuclei
        prompt: If the lobulated granulocyte nucleus exists to make the cell deformable enough to migrate
          through tight tissue spaces, why are Pelger-Huet carriers not measurably more susceptible to
          infection?
        rationale: 'The functional rationale for nuclear lobulation is migration through constricted spaces,
          and the anomaly abolishes lobulation in essentially every granulocyte for life. The trait is
          nonetheless described as asymptomatic.

          Two murine studies have asked the question directly and they disagree. A gene-trap Lbr mouse
          whose granulocytes lack a segmented nucleus kills Staphylococcus aureus normally, and its authors
          conclude LBR is needed for morphological but not functional granulocyte maturation. Neutrophils
          derived from the ichthyosis allele, by contrast, show abnormal chemotaxis and a deficient respiratory
          burst.

          The sharpest asymmetry between them is not the allele but the system. The gene-trap result is
          measured in granulocytes taken from a living animal; the ichthyosis result is measured in an
          EML progenitor cell line derived from an ic/ic mouse and induced to mature in culture, with
          no in vivo arm. A cultured line induced to a neutrophil-like state is not obliged to reproduce
          the proliferative and respiratory-burst competence of a marrow-matured cell, so a candidate
          adjudication does exist and is not the one this entry previously implied: repeat the chemotaxis
          and respiratory-burst assays on primary granulocytes from the same animal. Different alleles
          and different assays remain confounded on top of that.

          The human question is untouched either way, and the source itself says why. Both experiments
          are homozygous, and the human trait called asymptomatic is the heterozygous one, where far more
          LBR remains - the same paper notes that every prior human PHA functional study used heterozygous
          neutrophils. Carriers are ascertained incidentally, so no cohort has been assembled to look
          for a mild susceptibility with adequate power. This entry records the absence of an infection-susceptibility
          clinical burden as a claim about the literature rather than about the biology. It is a separate
          claim from the diagnostic hazard, which is documented and is curated in diagnosis:.'
      selected_evidence:
        snippet: This deformable nucleus enhances rapid migration.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17245605
      reference_title: 'The granulocyte nucleus and lamin B receptor: avoiding the ovoid.'
      evidence_source: OTHER
      explanation: 'States the functional claim that makes the absence of a clinical phenotype surprising.
        INDIRECT: it describes normal physiology, and the tension with the asymptomatic trait is an inference
        from it.'
