  a5dc6210570d1410963cd05eb743691d79d0ff9887b91f97f55874cf6d67013b:
    claim:
      about:
        disease:
          name: Pelger-Huet Anomaly
          disease_term:
            preferred_term: Pelger-Huet anomaly
            term:
              id: MONDO:0008214
              label: Pelger-Huet anomaly
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Granulocyte Nuclear Lobulation
        biological_scale: CELLULAR
        description: 'The maturing granulocyte nucleus does not undergo the segmentation that normally
          converts it from a round to a multi-lobed shape. In the heterozygous state it stops at two lobes
          joined by a filament; with essentially no LBR it stays ovoid. The lobulated shape is thought
          to serve deformability during migration through tight tissue spaces, which is why the failure
          is a plausible candidate for functional consequence - and why the absence of one in carriers
          is itself worth recording.

          Why a ubiquitously expressed nuclear-envelope protein produces a granulocyte-restricted phenotype
          is answered at this node rather than upstream: LBR is transcriptionally upregulated by C/EBPepsilon
          during terminal granulopoiesis, against a reciprocal downregulation of lamins, so the granulocyte
          is the lineage that depends on a rising LBR level at exactly the point where a halved gene dosage
          cannot supply it. That reading is what the HL-60 knockdown''s lineage-specificity readout probes:
          macrophage forms induced from the same knockdown cells were indistinguishable from the parent.'
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: granulocyte
          term:
            id: CL:0000094
            label: granulocyte
        biological_processes:
        - preferred_term: granulocyte differentiation
          term:
            id: GO:0030851
            label: granulocyte differentiation
      selected_evidence:
        snippet: This deformable nucleus enhances rapid migration.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/3
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17245605
      reference_title: 'The granulocyte nucleus and lamin B receptor: avoiding the ovoid.'
      evidence_source: OTHER
      explanation: 'Supplies the functional rationale for why nuclear lobulation exists at all. Marked
        INDIRECT: it is a statement about normal physiology, from which the significance of the failure
        follows by inference rather than by measurement in carriers.'
