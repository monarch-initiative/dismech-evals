      assertion_type: Diagnosis
      assertion:
        name: Spurious Band-Form Count on the Automated Differential
        description: 'The one consequence the anomaly reliably has. Hyposegmented neutrophils are counted
          as band forms, so an untroubled carrier''s differential shows a marked left shift with a normal
          total white cell count - a picture that reads as bacterial infection and can trigger an infection
          work-up, or, in the acquired mimic, as myelodysplasia. The hazard is iatrogenic rather than
          a feature of the disease, which is why it is curated here as a diagnostic pitfall and not as
          clinical burden: nothing happens to the patient because of their neutrophils, only because of
          what is inferred from them. The remedy is the blood-film entry above.'
      selected_evidence:
        snippet: It does not cause neutrophilia, but it can cause a false increase in band forms.
        supports: SUPPORT
        directness: DIRECT
