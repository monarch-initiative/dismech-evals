        description: 'Biallelic loss of function in TMEM147, which anchors LBR to the inner nuclear membrane,
          causes moderate to profound intellectual disability with coarse facies and abnormal nuclear
          segmentation in about a fifth of neutrophils. Mechanistically this is the closest of the differentials
          to the entry itself: it reaches the same nuclear phenotype by removing LBR''s anchor rather
          than LBR, which is why it produces a partial rather than a near-universal neutrophil picture.'
        distinguishing_features:
