      assertion_type: Pathophysiology
      assertion:
        name: Reduced LBR Sterol C14-Reductase Activity
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        description: LBR's transmembrane segments carry the 3-beta-hydroxysterol delta-14-reductase step
          of post-squalene cholesterol synthesis, and a variant that lowers LBR level or stability lowers
          that activity too. Whether this arm contributes to the granulocyte nuclear phenotype, or is
          simply the arm that produces the skeletal end of the allelic series, is unresolved - which is
          why the node is marked HYPOTHETICAL and carries no downstream edge to the nuclear nodes. It
          is recorded because one authoritative review places Pelger-Huet anomaly on the cholesterol-synthesis
          side, against the reading that the trait is a pure heterochromatin-tethering defect.
        molecular_functions:
        - preferred_term: 3-beta-hydroxysterol delta-14-reductase activity
          modifier: DECREASED
          term:
            id: GO:0050613
            label: Delta14-sterol reductase activity
      selected_evidence:
        snippet: The study furthermore determined that disease-associated LBR point mutations reduce sterol
          C14 reductase activity by decreasing the affinity of LBR for the reducing agent NADPH.
        supports: SUPPORT
        directness: INDIRECT
    origin:
