      assertion_type: DifferentialDiagnosis
      assertion:
        name: Non-LBR hyposegmentation of granulocytes in animals
        description: Hyposegmented granulocytes occur in domestic animals and are often called Pelger-Huet
          anomaly by analogy. That analogy should not be assumed to extend to the gene. In Australian
          Shepherd Dogs with an autosomal recessive hyposegmentation phenotype, linkage analysis excluded
          LBR and implicated LMBR1L instead. The row is here because a veterinary report of "Pelger-Huet
          anomaly" is not evidence about LBR, and a curator reaching for cross-species support should
          check which gene was actually mapped.
        distinguishing_features:
        - LBR excluded by linkage in the reported canine phenotype
        - Autosomal recessive with stillbirth in the affected litter, unlike the benign human heterozygous
          trait
      selected_evidence:
        snippet: HG phenotypes have also been described in domestic animals and homology to human PHA
          has been claimed in the literature.
        supports: REFUTE
        directness: DIRECT
