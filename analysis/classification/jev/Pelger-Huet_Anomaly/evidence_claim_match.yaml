      assertion_type: AnimalModel
      assertion:
        name: Ichthyosis (ic) mouse
        species: Mouse
        genotype: Lbr(ic/ic), Lbr(icJ/icJ), Lbr(ic4J/ic4J) - nonsense and frameshift alleles
        publication: PMID:12490533
        description: The classical mouse counterpart, and a case where the mouse locus was known long
          before the gene. Mice homozygous at the ichthyosis locus have a blood phenotype like Pelger-Huet
          anomaly, and the causal mutations were shown to lie in Lbr. Note the mouse is homozygous where
          the human trait is heterozygous, and carries extra features - alopecia, variable syndactyly,
          hydrocephalus - that the human heterozygous trait does not.
        modeled_mechanisms:
        - target: Failure of Granulocyte Nuclear Lobulation
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Reproduces the granulocyte nuclear phenotype from an Lbr lesion, in vivo and across
            three independent alleles.
          limitations: Homozygous, where the defining human trait is heterozygous, so the model corresponds
            to the Homozygous PHA subtype rather than to the common presentation. It also carries alopecia,
            syndactyly and hydrocephalus, which are not features of the human heterozygous trait, so the
            model is not phenotypically clean.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: The extra murine features (alopecia, syndactyly, hydrocephalus) have no counterpart
              in human heterozygous Pelger-Huet anomaly, so the allele's consequences are not equivalent
              across species.
          - divergence_type: POPULATION_MISMATCH
            materiality: INVALIDATING
            description: The model is homozygous and the human trait this entry is named for is heterozygous.
              For a dosage-dependent phenotype that is the difference between the two bands of the allelic
              series, not a matter of degree.
          readouts:
          - name: Granulocyte nuclear morphology
            target: Failure of Granulocyte Nuclear Lobulation
            direction: ALTERED
            interpretation: A blood phenotype resembling the human anomaly.
      selected_evidence:
        snippet: In this study, we identified one nonsense (815ins) and two frameshift mutations (1088insCC
          and 1884insGGAA) within the Lbr gene of mice homozygous for either of three independent mutations
          (ic, ic(J) and ic(4J), respectively) at the ichthyosis locus.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
