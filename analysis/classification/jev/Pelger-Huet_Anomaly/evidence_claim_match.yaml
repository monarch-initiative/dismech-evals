      assertion:
        name: Homozygous PHA
        display_name: Homozygous Pelger-Huet anomaly (ovoid nuclei with systemic features)
        description: Two LBR loss-of-function alleles, with only trace amounts of the protein. Granulocyte
          nuclei are frankly ovoid rather than merely hypolobulated, and the reported individuals also
          carry developmental delay, epilepsy and skeletal abnormalities in varying degree - so the biallelic
          state is not simply a more marked version of the same benign trait. This is a distinct band
          of the LBR allelic series from Greenberg dysplasia, which is prenatally lethal and is curated
          separately.
      selected_evidence:
        snippet: Presumed homozygous individuals have ovoid neutrophil nuclei, as well as varying degrees
          of developmental delay, epilepsy and skeletal abnormalities.
        supports: SUPPORT
        directness: DIRECT
