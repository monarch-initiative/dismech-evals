            label: leukodystrophy, hypomyelinating, 2
        description: Autosomal recessive hypomyelinating leukodystrophy caused by biallelic pathogenic
          variants in GJC2 (GJA12) with clinical and neuroradiologic features closely resembling Pelizaeus-Merzbacher
          disease.
        distinguishing_features:
        - Autosomal recessive inheritance due to GJC2 (GJA12) variants rather than X-linked PLP1 variants
        - Preserved waves III-V on brainstem auditory evoked potentials in most patients, whereas waves
          III-V are absent in Pelizaeus-Merzbacher disease
      selected_evidence:
        snippet: Among the hypomyelinating leukoencephalopathies with onset in childhood, Pelizaeus-Merzbacher
          disease (PMD) and Pelizaeus-Merzbacher-like disease (PMLD) constitute a large subgroup with
          almost indistinguishable clinical and neuroradiologic features. Whereas PMD is due to X-linked
          PLP1 mutations, PMLD is genetically heterogeneous, with about 8% of patients carrying autosomal
          recessive GJA12/GJC2 mutations.
        supports: SUPPORT
