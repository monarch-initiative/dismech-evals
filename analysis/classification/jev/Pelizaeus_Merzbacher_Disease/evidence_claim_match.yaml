  1cc0ab84e8f54ef245351a6044673f2fe41645931058142f50ce42d3e3135a1d:
    claim:
      about:
        disease:
          name: Pelizaeus-Merzbacher Disease
          disease_term:
            preferred_term: Pelizaeus-Merzbacher disease
            term:
              id: MONDO:0010714
              label: Pelizaeus-Merzbacher spectrum disorder
        context: []
      assertion_type: Genetic
      assertion:
        name: PLP1
        association: Causative
        gene_term:
          preferred_term: PLP1
          term:
            id: hgnc:9086
            label: PLP1
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_c1a44c5f-744e-4d02-a08f-e7c687531b21-2018-03-07T110000.000Z
        notes: 'PMD is caused by mutations in the PLP1 gene (Xq22.2), which encodes proteolipid protein
          1, the major protein component of CNS myelin. PLP1 duplications account for 50-75% of cases,
          point mutations for about 20%, and deletions for less than 5%. The PMD OMIM identifier is 312080.

          '
        variants:
        - name: PLP1 duplication
          description: 'Genomic duplication of the PLP1 locus, the most common mutation type (50-75% of
            cases). Leads to PLP1 overexpression and often the classic PMD phenotype; higher-order and
            complex copy-number gains may increase severity.

            '
        - name: PLP1 point mutations
          description: 'Missense mutations causing protein misfolding. Severity depends on specific residue;
            some cause severe connatal form, others milder phenotypes.

            '
        - name: PLP1 splice-altering variants
          description: 'Non-coding intronic splice donor, acceptor, branch-site, and splice regulatory
            variants can disrupt PLP1/DM20 precursor RNA splicing. These variants contribute to clinically
            heterogeneous PMD presentations.

            '
        - name: PLP1 deletion
          description: 'Complete loss of PLP1 expression. Paradoxically causes milder CNS disease but
            with added peripheral neuropathy and axonal injury, defining the PLP1 null syndrome branch
            of the PLP1-related disorder spectrum.

            '
      selected_evidence:
        snippet: Both PMD and SPG2 are caused by mutations in the proteolipid protein 1 (PLP1) gene, which
          encodes a major component of CNS myelin proteins
        supports: SUPPORT
    origin:
