      assertion_type: Transmission
      assertion:
        name: Canalicular ascent from the endocervix to the upper genital tract
        description: 'The second step, and the one specific to this disease: organisms already present
          at the endocervix travel up the lumen into the endometrium and fallopian tubes. Nothing is acquired
          at this step, so it is a route within the host rather than an exposure, and the interval before
          it is interrupted is what determines tubal outcome.'
      selected_evidence:
        snippet: Ascension of sexually transmitted pathogens from the endocervix to the uterus and/or
          fallopian tubes can result in pelvic inflammatory disease (PID).
        supports: SUPPORT
