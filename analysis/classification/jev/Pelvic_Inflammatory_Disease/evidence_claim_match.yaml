      assertion_type: Pathophysiology
      assertion:
        name: Loss of Vaginal Lactobacillus Dominance
        biological_scale: TISSUE
        description: 'Replacement of a lactobacillus-dominated vaginal community by a diverse anaerobic
          consortium (Gardnerella vaginalis, Megasphaera, Atopobium). This is the bacterial vaginosis
          arm of PID: it supplies organisms that can themselves ascend, and it is the reason anaerobic
          coverage is part of the regimen. It is curated as a parallel entry route rather than as a step
          in the sexually transmitted chain, because it does not require acquisition of a classical STI
          pathogen.

          '
        biological_processes:
        - preferred_term: biological process involved in interaction with host
          term:
            id: GO:0051701
            label: biological process involved in interaction with host
          modifier: ABNORMAL
        locations:
        - preferred_term: vagina
          term:
            id: UBERON:0000996
            label: vagina
      selected_evidence:
        snippet: Bacterial vaginosis is characterized by a lower prevalence of lactobacilli and a higher
          prevalence of anaerobic bacteria, including Gardnerella vaginalis, Megasphaera spp., and Atopobium
          vaginae.
        supports: SUPPORT
