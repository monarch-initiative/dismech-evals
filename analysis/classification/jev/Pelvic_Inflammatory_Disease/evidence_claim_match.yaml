      assertion:
        discussion_id: pid_chronic_pain_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'What mechanism connects a resolved episode of upper genital tract inflammation to persistent
          pelvic pain years later?

          '
        attaches_to:
        - pathophysiology#Chronic Pelvic Pain
        rationale: 'Chronic pelvic pain is one of the three canonical sequelae of PID and is the most
          common long-term complaint, yet unlike infertility and ectopic pregnancy it has no structural
          correlate in this pathograph. Post-inflammatory adhesions are the usual explanation, but the
          pain frequently persists in women whose acute infection was treated and cleared, and no cited
          source here demonstrates the adhesion-to-pain step. The edge from tubal fibrosis to chronic
          pain in this entry is deliberately typed INDIRECT_UNKNOWN_INTERMEDIATES for that reason: naming
          adhesions as the mechanism would assert more than the cited literature supports.

          '
      selected_evidence:
        snippet: Rates of sequelae, including infertility (22%), recurrent PID (31%) and chronic pelvic
          pain (42%), were high among women testing positive for endometrial M genitalium at baseline.
        supports: SUPPORT
