      assertion_type: Pathophysiology
      assertion:
        name: TNF-Mediated Sloughing of Ciliated Tubal Epithelium
        biological_scale: CELLULAR
        description: 'Detachment and loss of the multiciliated cells lining the tubal mucosa, the lesion
          that converts a transient infection into permanent transport failure. The classical human fallopian
          tube organ culture work established that this is not direct bacterial cytotoxicity: purified
          gonococcal peptidoglycan monomers reproduce the damage in the absence of live organisms, and
          recombinant TNF-alpha alone is sufficient. Because the ciliated epithelium does not regenerate
          its function, this node is the point at which the disease becomes irreversible.

          '
        cell_types:
        - preferred_term: fallopian tube multiciliated epithelial cell
          term:
            id: CL:4030007
            label: fallopian tube multiciliated epithelial cell
          modifier: DECREASED
        biological_processes:
