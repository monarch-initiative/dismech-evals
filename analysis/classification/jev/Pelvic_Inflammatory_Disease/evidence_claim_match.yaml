      assertion_type: Diagnosis
      assertion:
        name: Clinical diagnosis with a low empiric-treatment threshold
        description: 'PID is diagnosed on clinical suspicion. Because the clinical picture is nonspecific
          and the cost of missing the diagnosis is irreversible tubal damage, guidelines set the treatment
          threshold deliberately low: pelvic or lower abdominal pain plus cervical motion, uterine or
          adnexal tenderness in a woman at risk is sufficient. The consequence is that the diagnosed population
          is not the same as the true-disease population in either direction, which is the main obstacle
          to interpreting PID epidemiology.

          '
      selected_evidence:
        snippet: The clinical diagnosis of PID is nonspecific, creating an urgent need to develop noninvasive
          tests to diagnose PID.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
