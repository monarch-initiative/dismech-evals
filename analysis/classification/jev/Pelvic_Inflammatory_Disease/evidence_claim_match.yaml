  8b815fc9b92e2db727ad4a95a109e49a6e40718ccf52bb3482c1a4d0d6d64662:
    claim:
      about:
        disease:
          name: Pelvic Inflammatory Disease
          disease_term:
            preferred_term: pelvic inflammatory disease
            term:
              id: MONDO:0000922
              label: pelvic inflammatory disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pid_subclinical_treatment_failure
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Why does treating gonococcal, chlamydial and bacterial-vaginosis infection fail to restore
          fertility in women who already have subclinical endometritis, and what would an intervention
          that does work have to target?

          '
        attaches_to:
        - pathophysiology#Subclinical Upper Genital Tract Inflammation
        - pathophysiology#Tubal Factor Infertility
        rationale: 'This is the most consequential gap in the entry, and it is awkward for the whole prevention
          model. In a prospective cohort, women who had biopsy-defined subclinical PID at enrollment had
          a 40% lower subsequent pregnancy incidence even though they received treatment for their gonococcal,
          chlamydial or bacterial-vaginosis infection — while women with those same infections but without
          subclinical PID were not at increased risk. The dividing line is therefore the presence of upper
          tract inflammation, not the presence of the organism, and antimicrobial therapy directed at
          the organism does not undo it. Either the damage is already fixed by the time endometritis is
          detectable, or the inflammation persists after the organism is cleared. The two possibilities
          imply completely different interventions — earlier detection versus anti-inflammatory adjunctive
          therapy — and nothing in the current evidence distinguishes them.

          '
        proposed_experiments:
        - experiment_id: pid_endometritis_resolution_cohort
          experiment_design: HUMAN_OBSERVATIONAL
          name: Serial endometrial sampling after treatment of subclinical PID
          description: 'Follow women with biopsy-confirmed subclinical endometritis through and after
            standard antimicrobial therapy with repeat endometrial biopsy and organism testing, and relate
            persistence of histologic inflammation (as opposed to persistence of the organism) to subsequent
            tubal patency and fertility. A dissociation — organism cleared, inflammation persisting, fertility
            reduced — would identify the residual inflammation as the target and justify testing an anti-inflammatory
            adjunct.

            '
          experiment_type:
            preferred_term: prospective cohort with serial endometrial biopsy
          would_support:
          - pathophysiology#Subclinical Upper Genital Tract Inflammation
      selected_evidence:
        snippet: Subclinical PID decreases subsequent fertility despite provision of treatment for sexually
          transmitted diseases.
        supports: SUPPORT
