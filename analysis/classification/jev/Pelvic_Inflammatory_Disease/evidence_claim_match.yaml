          term:
            id: GO:0003341
            label: cilium movement
          modifier: DECREASED
        locations:
        - preferred_term: fallopian tube
          term:
            id: UBERON:0003889
            label: fallopian tube
      selected_evidence:
        snippet: Gonococcal infection of human fallopian tube mucosa in organ culture results in the sloughing
          of ciliated epithelial cells from the mucosa.
        supports: SUPPORT
