              label: pelvic inflammatory disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pid_etiology_regimen_mismatch
        kind: OPEN_QUESTION
        status: OPEN
        prompt: 'If fewer than half of PID cases involve gonorrhoea or chlamydia, is a regimen designed
          around those two organisms still the right one?

          '
        attaches_to:
        - pathophysiology#Lower Genital Tract Infection and Cervical Colonization
        - pathophysiology#Loss of Vaginal Lactobacillus Dominance
        rationale: 'The recommended regimen was built around N. gonorrhoeae and C. trachomatis, but contemporary
          series find neither organism in more than half of diagnosed cases, with M. genitalium, respiratory
          pathogens and the bacterial-vaginosis consortium accounting for a substantial share. The metronidazole
          trial is the first piece of that gap to be closed with randomised evidence, and it closed it
          in the direction of the anaerobes. The M. genitalium share remains uncovered: a PEACH substudy
          showed that cefoxitin plus doxycycline does not eradicate endometrial M. genitalium and that
          carriage predicted short-term treatment failure. Whether that translates into a change of regimen
          depends on evidence that does not yet exist, since no trial has shown that treating M. genitalium
          prevents PID or its sequelae.

          '
      selected_evidence:
        snippet: Recent studies of women with PID have reported that fewer than half of women receiving
          a diagnosis of PID have gonococcal or chlamydial infection, while Mycoplasma genitalium, respiratory
          pathogens, and the constellation of bacteria associated with bacterial vaginosis may account
          for a substantial fraction of PID cases.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
