      assertion_type: Pathophysiology
      assertion:
        name: Oxidative Stress in Pelvic Floor Connective Tissue
        biological_scale: CELLULAR
        description: 'Accumulation of oxidative damage in the fibroblasts and matrix of the uterosacral
          ligament, evidenced by raised 8-hydroxyguanosine and 4-hydroxynonenal in prolapsed tissue. Its
          interest is not the marker but the dose-dependence found when uterosacral ligament fibroblasts
          are exposed to peroxide directly: low-level oxidative stress stimulates collagen synthesis while
          higher levels flip the cell into net catabolism. That non-monotonic response is a plausible
          account of why an ageing, mechanically loaded tissue could pass from compensated remodelling
          into net loss without any change in the insult itself.

          '
        cell_types:
        - preferred_term: uterosacral ligament fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
      selected_evidence:
        snippet: the immunoreactivity of 8-OHdG in the POP group was significantly higher, compared with
          that in the control group
        supports: SUPPORT
