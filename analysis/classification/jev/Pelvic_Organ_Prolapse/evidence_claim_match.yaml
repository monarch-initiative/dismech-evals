        context: []
      assertion_type: Diagnosis
      assertion:
        name: POP-Q Staged Pelvic Examination
        description: 'Diagnosis is clinical, and the measurement standard is the Pelvic Organ Prolapse
          Quantification (POP-Q) system agreed in 1996 by the International Continence Society, the American
          Urogynecologic Society and the Society of Gynecologic Surgeons. It records the position of defined
          vaginal points relative to the hymen under maximal Valsalva and stages the result, which is
          what makes prolapse severity comparable between examiners and between studies - almost every
          cohort cited in this entry is staged this way, including the avulsion series behind the compartment
          edges. Two entries in the pathophysiology above are POP-Q measurements rather than research
          constructs: the genital hiatus (gh) that the recurrence node is built on, and the hymen that
          defines the descent node. Because the system quantifies anatomy and the disease''s central oddity
          is that anatomy and symptoms correlate poorly, a POP-Q stage is not on its own an indication
          to treat.

          '
        diagnosis_term:
          preferred_term: POP-Q staged pelvic examination
          term:
            id: NCIT:C214455
            label: Pelvic Organ Prolapse Exam
      selected_evidence:
        snippet: An objective site-specific system for describing, quantitating, and staging pelvic support
          in women is included.
