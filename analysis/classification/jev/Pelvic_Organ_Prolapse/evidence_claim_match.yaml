      assertion_type: Treatment
      assertion:
        name: Pelvic Floor Muscle Training
        description: 'An individualised, supervised programme of pelvic floor muscle exercise. In the
          POPPY trial, 447 women with symptomatic stage I-III prolapse were randomised to one-to-one training
          or a lifestyle advice leaflet, and the trained group reported a significantly greater reduction
          in prolapse symptom score at 12 months. What the trial establishes and what it does not is worth
          stating plainly: the endpoint was self-reported symptoms, not anatomic stage, and training cannot
          reattach an avulsed levator.

          '
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: pelvic floor physical therapy
          term:
            id: NCIT:C15302
            label: Physical Therapy
      selected_evidence:
        snippet: Female outpatients with newly-diagnosed, symptomatic stage I, II, or III prolapse were
          randomly assigned
        supports: SUPPORT
