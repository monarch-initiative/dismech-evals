      assertion:
        name: Descent of the Pelvic Organs Beyond the Hymen
        biological_scale: ORGANISM
        description: 'The disease-defining lesion: bladder, uterus, post-hysterectomy vaginal cuff or
          bowel descending so that the vaginal walls or uterus protrude toward and past the hymen. Everything
          clinically recognisable follows from here, and so does the entry''s central epidemiological
          oddity - descent on examination is far commoner than the complaint, the two correlate poorly,
          and of the many symptoms attributed to prolapse only the sensation of a vaginal bulge is actually
          specific to it.

          '
        locations:
        - preferred_term: vagina
          term:
            id: UBERON:0000996
            label: vagina
        - preferred_term: uterus
          term:
            id: UBERON:0000995
            label: uterus
        - preferred_term: urinary bladder
          term:
            id: UBERON:0001255
            label: urinary bladder
      selected_evidence:
        snippet: Pelvic organ prolapse is downward descent of female pelvic organs, including the bladder,
          uterus or post-hysterectomy vaginal cuff, and the small or large bowel, resulting in protrusion
          of the vagina, uterus, or both.
        supports: SUPPORT
