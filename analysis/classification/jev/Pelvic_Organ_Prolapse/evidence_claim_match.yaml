  d7441a806c6fc4b642ee19b03b6a17049c376cf91fbb8764fc5a52ac1b4d239c:
    claim:
      about:
        disease:
          name: Pelvic Organ Prolapse
          disease_term:
            preferred_term: pelvic organ prolapse
            term:
              id: MONDO:0000082
              label: pelvic organ prolapse
        context: []
      assertion_type: Treatment
      assertion:
        name: Vaginal Pessary
        description: 'A passive intravaginal device that mechanically supports the vaginal walls and holds
          the descended organs in position. It treats the mechanics without altering any of the upstream
          biology, which makes it the cleanest illustration in this entry of how far the disease is a
          structural problem. The Cochrane evidence is thinner than its ubiquity suggests: pessary versus
          no treatment and pessary versus training are both uncertain, and only pessary added to training
          reaches moderate certainty. The same review reports that pessaries may cause a large increase
          in adverse events relative to training, so the comparison against training is not cost-free
          on either side.

          '
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: vaginal pessary placement
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
      selected_evidence:
        snippet: We are uncertain if pessaries improve pelvic organ prolapse symptoms for women compared
          with no treatment or PFMT but pessaries in addition to PFMT probably improve women's pelvic
          organ prolapse symptoms and prolapse-specific quality of life.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33207004
