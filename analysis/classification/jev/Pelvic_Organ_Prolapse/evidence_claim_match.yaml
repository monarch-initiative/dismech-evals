        target: Collagen and MMP-TIMP Remodelling Imbalance
        causal_link_type: UNKNOWN
        description: 'Whether constitutional variation is what produces the observed collagen and protease-inhibitor
          imbalance in prolapsed tissue is not established; the edge is typed UNKNOWN rather than omitted
          because the genetic and the biochemical observations are usually invoked together.

          '
      selected_evidence:
        snippet: Several risk factors have been associated with pelvic organ prolapse, all contribute
          to weakening of the pelvic floor connective tissue/collagen, allowing the pelvic organs to prolapse
          through the vaginal walls.
