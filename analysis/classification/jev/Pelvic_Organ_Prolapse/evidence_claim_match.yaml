      assertion:
        name: Chronically Increased Intra-Abdominal Load
        biological_scale: ORGANISM
        description: 'Sustained or repeated rises in intra-abdominal pressure from obesity, chronic straining
          at stool, chronic cough or heavy lifting, transmitted onto an already weakened pelvic floor.
          Rising body-mass index is one of the three most consistent risk factors and is the one most
          obviously modifiable, but the occupational and exercise literature does not support a general
          "strain causes prolapse" story: women recruited from the community with prolapse on examination
          report the same lifetime strenuous activity as women without it, and the association with heavy
          work appears mainly in surgical series, where referral is itself selected on symptoms. This
          node is therefore curated as a genuine load with a deliberately weak causal edge.

          '
        biological_processes:
        - preferred_term: response to mechanical stimulus
          term:
            id: GO:0009612
            label: response to mechanical stimulus
          modifier: INCREASED
