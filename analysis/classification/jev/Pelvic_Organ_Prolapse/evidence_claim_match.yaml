      assertion_type: Discussion
      assertion:
        discussion_id: interpretation_no_emphysema_module_conformance
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Collagen and MMP-TIMP Remodelling Imbalance
        prompt: 'Should the matrix node conform to emphysema_protease_antiprotease_imbalance#Protease-Antiprotease
          Imbalance?

          '
        rationale: 'The temptation is real and is worth recording rather than leaving as a silent omission.
          Prolapse shows raised MMP-1/-2/-9 with reduced TIMP-1, and the Loxl1 mouse develops enlarged
          pulmonary airspaces alongside its prolapse from the same elastogenesis defect, so the two diseases
          genuinely share an elastin-loss biology. Conformance was nonetheless withheld on three grounds.
          First, the module is scoped to the alveolus throughout: its trigger node is inhaled oxidants
          and particulates and every downstream node is alveolar, so a conforming pelvic node would inherit
          claims about airway inflammation that are false here. Second, the module''s imbalance is driven
          by proteases released from recruited neutrophils and macrophages, and no such phagocyte infiltrate
          is evidenced in prolapsed pelvic tissue in any source used here; the cellular source of the
          MMPs is presumed to be the resident fibroblast. Third, and decisively, the module asserts its
          imbalance node as causal, whereas the causal direction of the same signature in prolapse is
          an open gap in this very entry. Declaring conformance would launder an unresolved question into
          an asserted mechanism. A genuinely disease-agnostic module for load-bearing soft tissue matrix
          failure, which would also serve hernia, where the human genetics here overlaps, may be worth
          proposing separately.

          '
      selected_evidence:
        snippet: Failure to maintain elastic fibers is explained by a theory of antielastase-elastase
          imbalance, but little is known about the role of renewal.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/3
