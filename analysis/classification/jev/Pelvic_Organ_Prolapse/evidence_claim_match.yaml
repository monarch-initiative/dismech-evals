          term:
            id: UBERON:0007136
            label: rectouterine fold
        - preferred_term: uterus
          term:
            id: UBERON:0000995
            label: uterus
      selected_evidence:
        snippet: Failure of the lateral connective tissue attachments between the uterus and vagina to
          the pelvic wall (cardinal, uterosacral, and paravaginal) are strongly related with prolapse
