          value:
            name: Constitutional Connective Tissue Susceptibility
            biological_scale: MOLECULAR
            description: 'Inherited variation in the composition and turnover of pelvic connective tissue,
              which sets how much obstetric and gravitational load a woman''s support system tolerates
              before it fails. The evidence is of two kinds and they agree. Common-variant association
              studies return loci whose nearest genes are connective tissue and oestrogen-pathway genes
              rather than muscle genes, and they replicate across ancestries. At the other end of the
              allelic spectrum, monogenic heritable connective tissue disorders carry a strikingly high
              prolapse burden at low parity. Neither is a deterministic cause; both make this a susceptibility
              node feeding the matrix and elastogenesis arms rather than a trigger in its own right.

              '
            biological_processes:
            - preferred_term: extracellular matrix organization
              term:
                id: GO:0030198
                label: extracellular matrix organization
              modifier: ABNORMAL
          role: ancestor
