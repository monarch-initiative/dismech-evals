        discussion_id: gap_anatomy_symptom_discordance
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Descent of the Pelvic Organs Beyond the Hymen
        prompt: 'Why does anatomic descent correspond so poorly to symptoms, and what determines which
          women with the same POP-Q stage are bothered?

          '
        rationale: 'Prolapse is one of the few conditions where the defining anatomic lesion and the clinical
          complaint are close to uncoupled. Symptomatic prolapse affects about 3% of US women, while descent
          on examination is far commoner; of the symptoms attributed to prolapse only vaginal bulging
          is specific. This has practical consequences throughout the entry: prevalence figures are not
          comparable unless the ascertainment is stated, the mechanistic chain ends at an anatomic node
          rather than at a symptom, and surgical trials that report anatomic success are not reporting
          what patients came for. Nothing in the sources used here explains the discordance.

          '
      selected_evidence:
        snippet: The anatomical changes do not always consist with the severity or the symptoms associated
          with prolapse.
        supports: SUPPORT
