      assertion:
        name: Urogenital Hiatus Enlargement and Loss of Levator Closure
        biological_scale: TISSUE
        description: 'Widening of the levator hiatus, so that the pelvic floor no longer closes. This
          is the hinge of the whole entry. With the hiatus closed, pressures above and below the vaginal
          wall are equal and cancel; once it is open and vaginal wall descends below the hymen, that wall
          lies between abdominal and atmospheric pressure and a net downward force appears where none
          existed. The node therefore has two distinct outputs: it permits descent directly, and it converts
          intra-abdominal pressure into abnormal tension on the suspensory attachments. It is also the
          lesion that prolapse surgery does not address, which is why it reappears below as a predictor
          of recurrence.

          '
        biological_processes:
