      reference: PMID:27517338
      reference_title: What's new in the functional anatomy of pelvic organ prolapse?
      evidence_source: HUMAN_CLINICAL
      explanation: 'The review''s own summary statement, which both asserts the muscular primacy and explicitly
        demotes the vaginal wall fascial arm.

        '
