      assertion_type: Prevalence
      assertion:
        population: United States, non-pregnant women aged 20 years and over
        measure_type: POINT_PREVALENCE
        prevalence_class: ABOVE_1_IN_1000
        rate_per_100000: 2900.0
        rate_low: 2100.0
        rate_high: 3700.0
        notes: 'NHANES 2005-2006. This is prevalence of the symptom (seeing or feeling a bulge in or outside
          the vagina), not of anatomic descent on examination, which is far more common. The two are not
          interchangeable and the discordance between them is itself curated as a knowledge gap in this
          entry.

          '
      selected_evidence:
        snippet: A cross-sectional analysis of 1961 nonpregnant women (>or=20 years) who participated
          in the 2005-2006 National Health and Nutrition Examination Survey, a nationally representative
          survey of the US noninstitutionalized population. ... pelvic organ prolapse (seeing/feeling
          a bulge in or outside the vagina) symptoms were assessed. ... 2.9% of women (95% CI, 2.1%-3.7%)
          experiencing pelvic organ prolapse. ... The specificity of vaginal bulge symptoms for predicting
          prolapse beyond the hymen is high in low-prevalence populations (99%–100%); however, the sensitivity
          is low (16%–35%), because some women with even advanced prolapse deny symptoms.7,25 Thus, prolapse
          prevalence in studies using symptom-based screening such as this one underestimate the true
          prevalence of anatomic disease.
        supports: SUPPORT
