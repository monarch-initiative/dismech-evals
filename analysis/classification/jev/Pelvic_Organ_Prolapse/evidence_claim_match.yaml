  e931cf54b088e611610944eeecdcdcff6355dfc3a08abe3859e827ab8a69bdb9:
    claim:
      about:
        disease:
          name: Pelvic Organ Prolapse
          disease_term:
            preferred_term: pelvic organ prolapse
            term:
              id: MONDO:0000082
              label: pelvic organ prolapse
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_matrix_cause_or_consequence
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Collagen and MMP-TIMP Remodelling Imbalance
        prompt: 'Is the collagen and MMP/TIMP signature of prolapsed tissue a cause of the mechanical
          failure or a response to it?

          '
        rationale: 'Every human study behind this node is cross-sectional and takes tissue from women
          who already have prolapse, usually at the time of surgery for it. That design cannot order cause
          and effect, and one observation actively points the wrong way: the study that sampled both compartments
          found the changes larger in vaginal tissue, the tissue being stretched, than in the uterosacral
          ligament, where the differences were not significant at all. The distinction is not academic.
          If the matrix lesion is causal, it is a target and a screening opportunity; if it is reactive,
          then a large fraction of the prolapse literature is measuring a consequence and calling it a
          mechanism, and interventions aimed at collagen turnover are aimed at the wrong thing. The edge
          from this node is typed INDIRECT_UNKNOWN_INTERMEDIATES for exactly this reason.

          '
        proposed_experiments:
        - experiment_id: prospective_matrix_profiling_nulliparous_cohort
          experiment_design: HUMAN_OBSERVATIONAL
          name: Prospective matrix profiling in a nulliparous cohort followed through first delivery
          description: 'Sample accessible connective tissue and measure collagen I/III ratio and MMP/TIMP
            profile before first pregnancy in a cohort followed with serial pelvic floor imaging. A pre-existing
            matrix signature in women who later prolapse would establish antecedence; a signature that
            appears only after descent would settle the question the other way.

            '
        - experiment_id: site_paired_loaded_unloaded_sampling
          name: Site-paired sampling of loaded and unloaded tissue within the same woman
          description: 'Within individual prolapse cases, compare matrix markers between mechanically
            loaded vaginal wall and an unloaded connective tissue site from the same patient. A difference
            confined to the loaded site argues for a mechanoresponsive, and therefore reactive, change.

            '
      selected_evidence:
        snippet: The changes which are more pronounced in vaginal tissue may be as a result of prolapse
          rather than cause.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
