    evidence_metadata:
      reference: PMID:14745449
      reference_title: Elastic fiber homeostasis requires lysyl oxidase-like 1 protein.
      evidence_source: MODEL_ORGANISM
      explanation: 'Names the protease-antiprotease framing and, in the same sentence, sets renewal against
        it as the mechanism this paper actually demonstrates. The conclusion drawn here - that the prolapse
        node is a renewal failure rather than a protease imbalance, so conformance is withheld - is an
        inference from that contrast.

        '
