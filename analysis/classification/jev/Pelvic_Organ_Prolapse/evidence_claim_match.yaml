          disease_term:
            preferred_term: pelvic organ prolapse
            term:
              id: MONDO:0000082
              label: pelvic organ prolapse
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_elastogenesis_knockout_mice
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Elastic Fiber Assembly and Postpartum Elastogenesis
        prompt: 'Does the elastogenesis-failure mechanism established in Loxl1- and Fbln5-null mice operate
          in human pelvic organ prolapse?

          '
        rationale: 'The entire mechanistic case that a matrix lesion is sufficient to cause prolapse rests
          on two mouse knockouts, and the translational distance is larger than it first appears. Neither
          gene is returned by the human association studies curated here, which instead implicate WNT4,
          EFEMP1, WT1 and FGFR2; both are germline nulls rather than the common regulatory variants human
          genetics finds; and a quadruped loads its pelvic floor differently from a biped, so the same
          molecular lesion need not produce the same mechanical failure. The Fbln5 paper''s own comparison
          is to prolapse in primates rather than in women. This is a mismatch and not merely a gap because
          the evidence exists and is strong; it is its applicability to human disease that is unresolved.

          '
        proposed_experiments:
        - experiment_id: human_postpartum_elastogenesis_profiling
          name: Elastic fiber and elastogenic enzyme profiling in human postpartum vaginal tissue
          description: 'Measure desmosine content, tropoelastin, LOXL1 and fibulin-5 in human vaginal
            tissue across the postpartum period, to test whether the elastogenic burst the mouse studies
            identified exists in women at all, and whether it is attenuated in those with levator injury
            or later prolapse.

            '
        - experiment_id: elastogenesis_rare_variant_burden
          name: Rare-variant burden testing of elastogenesis genes in prolapse cases
          description: 'Sequence LOXL1, FBLN5 and related elastogenesis genes in a large prolapse cohort
            and test for rare loss-of-function burden. A positive result would connect the murine mechanism
            to human disease; a clean negative would confine these models to demonstrating sufficiency
            in principle.

            '
      selected_evidence:
        snippet: disordered elastic fiber homeostasis is a primary event in the pathogenesis of pelvic
          organ prolapse in mice
        supports: SUPPORT
        directness: INDIRECT
