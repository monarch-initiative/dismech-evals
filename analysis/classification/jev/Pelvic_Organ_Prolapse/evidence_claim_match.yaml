      assertion_type: Pathophysiology
      assertion:
        name: Vaginal Wall Smooth Muscle Depletion
        biological_scale: CELLULAR
        description: 'Reduction in the fractional area of nonvascular smooth muscle in the muscularis
          of the anterior vaginal wall. The vaginal wall is not a passive membrane; its muscularis contributes
          actively to wall mechanics, and losing it reduces the wall''s own contribution to support. The
          finding is independent of age and of prolapse stage, which argues against it being a simple
          function of severity, and it is present in premenopausal women too - but it is most marked in
          postmenopausal women not taking oestrogen, which is the observation linking this node to the
          hormonal arm.

          '
        cell_types:
        - preferred_term: vaginal wall smooth muscle cell
          term:
            id: CL:0000192
            label: smooth muscle cell
        locations:
        - preferred_term: vagina
          term:
            id: UBERON:0000996
            label: vagina
      selected_evidence:
        snippet: The fractional area of nonvascular vaginal smooth muscle in the muscularis of women with
          prolapse was significantly decreased compared with that of control subjects.
        supports: SUPPORT
