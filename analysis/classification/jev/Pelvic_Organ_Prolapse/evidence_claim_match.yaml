      assertion:
        name: Failure of Apical and Lateral Connective Tissue Attachment
        biological_scale: TISSUE
        description: 'Loss of effective suspension of the uterus and upper vagina from the pelvic sidewall
          by the cardinal, uterosacral and paravaginal attachments. Measured in living women under maximal
          Valsalva, these three are strongly related to prolapse and are strongly correlated with one
          another, which is the evidence that they fail as one system rather than as separable "defects".
          The character of the failure is informative: what differs between women with and without prolapse
          is ligament length, not ligament stiffness - the tissue has lengthened rather than become intrinsically
          floppier, which fits accumulated mechanical failure better than it fits a pure material defect.

          '
        biological_processes:
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: ABNORMAL
