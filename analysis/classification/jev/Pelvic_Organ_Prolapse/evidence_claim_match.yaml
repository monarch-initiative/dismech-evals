      assertion_type: Pathophysiology
      assertion:
        name: Impaired Elastic Fiber Assembly and Postpartum Elastogenesis
        biological_scale: MOLECULAR
        description: 'Failure of the LOXL1- and fibulin-5-dependent programme that deposits and cross-links
          new elastic fibers in the vaginal wall after delivery. Elastic fibers were long assumed to be
          laid down once and left alone; the reproductive tract is the exception, and pelvic support turns
          out to depend on that exception. In mice, deleting either LOXL1 or fibulin-5 produces prolapse,
          and the two do so by different routes - Loxl1-null animals fail to repair after birth, Fbln5-null
          animals prolapse with age - which is why this node has both an obstetric and an ageing input.

          '
        molecular_functions:
        - preferred_term: protein-lysine 6-oxidase activity
          term:
            id: GO:0004720
            label: protein-lysine 6-oxidase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: elastic fiber assembly
          term:
            id: GO:0048251
            label: elastic fiber assembly
          modifier: DECREASED
        locations:
        - preferred_term: vagina
          term:
            id: UBERON:0000996
            label: vagina
      selected_evidence:
        snippet: Here we show that mice lacking the protein lysyl oxidase-like 1 (LOXL1) do not deposit
          normal elastic fibers in the uterine tract post partum and develop pelvic organ prolapse, enlarged
          airspaces of the lung, loose skin and vascular abnormalities with concomitant tropoelastin accumulation.
        supports: SUPPORT
