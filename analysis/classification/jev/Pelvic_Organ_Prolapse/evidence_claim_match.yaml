  b3f11fc5ade5489c929165a975ce71ce58226a1d98472d61c1d60ff514f9f5ae:
    claim:
      about:
        disease:
          name: Pelvic Organ Prolapse
          disease_term:
            preferred_term: pelvic organ prolapse
            term:
              id: MONDO:0000082
              label: pelvic organ prolapse
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Recurrence After Reconstructive Surgery
        biological_scale: ORGANISM
        description: 'Anatomic or symptomatic failure of a prolapse repair. It is curated as a node rather
          than as a treatment outcome because it is mechanistically informative: reconstructive surgery
          restores the suspensory attachments and does not restore the levator, so a wide genital hiatus
          persists across the operation, and it is that persisting hiatus that predicts failure. Recurrence
          is thus the clinical readout of the part of the mechanism that current surgery leaves untouched,
          and it explains why apical suspensions differ in durability while none abolishes recurrence.

          '
        locations:
        - preferred_term: vagina
          term:
            id: UBERON:0000996
            label: vagina
      selected_evidence:
        snippet: For upper vaginal prolapse (uterine or vault) abdominal sacral colpopexy was associated
          with a lower rate of recurrent vault prolapse on examination and painful intercourse than with
          vaginal sacrospinous colpopexy.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/12
      evidence_path: /pathophysiology/12/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23633316
      reference_title: Surgical management of pelvic organ prolapse in women.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Establishes that recurrence rates differ by procedure, which is what makes this a
        node with a variable rate rather than a fixed property of the disease.

        '
