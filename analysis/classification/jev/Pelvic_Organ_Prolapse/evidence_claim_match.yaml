      assertion:
        name: Pelvic Floor Transperineal Ultrasound
        description: 'Three- or four-dimensional transperineal (translabial) ultrasound is how the levator
          lesion at the head of this entry''s canonical arm is actually seen in a living woman: it identifies
          levator ani avulsion and measures hiatal dimensions. It is what makes the muscular arm clinically
          observable rather than inferred, and every avulsion cohort cited here rests on it. It is not
          a routine diagnostic requirement - prolapse is diagnosed on examination - so it is curated as
          the mechanism-resolving investigation rather than as a diagnostic standard.

          '
        diagnosis_term:
          preferred_term: pelvic floor transperineal ultrasound
          term:
            id: NCIT:C17230
