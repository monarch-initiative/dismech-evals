      assertion_type: Pathophysiology
      assertion:
        name: Vaginal Childbirth Mechanical Overload
        biological_scale: TISSUE
        description: 'Passage of the fetal head requires the levator ani and the soft tissues of the birth
          canal to stretch to more than three times their resting length. This is the single largest modifiable
          risk factor for prolapse, and the mechanism of damage is specifically overstretch rather than
          compression ischaemia or pudendal neuropathy - a distinction that matters because it identifies
          the tissue at risk (the vulnerable muscle origin) and the obstetric variables that load it.
          It is a normal physiological event that most women recover from; the disease begins where recovery
          fails.

          '
        biological_processes:
        - preferred_term: response to mechanical stimulus
          term:
            id: GO:0009612
            label: response to mechanical stimulus
          modifier: INCREASED
        locations:
        - preferred_term: levator ani muscle
          term:
            id: UBERON:0001326
            label: levator ani muscle
        - preferred_term: vagina
          term:
            id: UBERON:0000996
            label: vagina
      selected_evidence:
        snippet: During birth, the levator muscle and birth canal tissues must stretch to more than 3
          times their original length; it is this overstretching that is responsible for the muscle tear
          visible on imaging rather than compression or neuropathy.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
