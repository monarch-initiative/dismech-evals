      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: levator_muscle_failure_primary
        hypothesis_label: Birth injury to the levator ani is the primary lesion, with connective tissue
          failure secondary to the resulting pressure differential
        status: CANONICAL
        description: 'The dominant contemporary model, built on imaging of living women rather than on
          cadaveric or operative inference. Normal support is a load-sharing system: the levator ani holds
          the hiatus closed so that pressures above and below the vaginal wall balance and cancel. Birth
          overstretch tears the pubococcygeal origin; the hiatus opens; vaginal wall descending below
          the hymen now sits between abdominal and atmospheric pressure, and the resulting differential
          loads the cardinal, uterosacral and paravaginal attachments abnormally until they too fail.
          On this model the connective tissue lesion is real and measurable but downstream, and the vaginal
          wall fascia contributes least of all.

          '
      selected_evidence:
        snippet: Pelvic organ prolapse occurs because of injury to the levator ani muscles and failure
          of the lateral connections between the pelvic organs to the pelvic sidewall. Abnormalities of
          the vaginal wall fascial tissues may play a minor role.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
