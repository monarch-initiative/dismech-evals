        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Oestrogen Withdrawal and Ageing of the Pelvic Support Tissues
        biological_scale: ORGANISM
        description: 'Advancing age and the menopausal fall in oestrogen, consistently among the strongest
          epidemiological risk factors for prolapse. The mechanistic reading of this node has to be handled
          carefully, because the obvious therapeutic inference from it is wrong. Oestrogen-pathway loci
          come out of GWAS, vaginal smooth muscle is most depleted in postmenopausal women not taking
          oestrogen, and the Fbln5-null mouse prolapses with ageing - yet in 1443 postmenopausal women,
          past hormone therapy, its duration, and current vaginal oestrogen were all unassociated with
          pelvic organ support, and current systemic therapy was if anything associated with slightly
          worse support. Both edges out of this node are therefore typed conservatively.

          '
        biological_processes:
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: DECREASED
      selected_evidence:
        snippet: Vaginal delivery, hysterectomy, chronic straining, normal ageing, and abnormalities of
          connective tissue or connective-tissue repair predispose some women to disruption, stretching,
          or dysfunction of the levator ani complex, connective-tissue attachments of the vagina, or both,
          resulting in prolapse.
        supports: SUPPORT
