      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: connective_tissue_matrix_primary
        hypothesis_label: A constitutional extracellular matrix defect is the primary lesion, with childbirth
          acting as the unmasking load
        status: ALTERNATIVE
        description: 'The older and still-live account, in which the initiating abnormality is in the
          connective tissue itself: reduced load-bearing type I collagen, a shift toward type III, excess
          matrix metalloproteinase activity with insufficient inhibition, and impaired elastic fiber renewal.
          Its strongest support is not the human tissue comparisons, which are cross-sectional and cannot
          order cause and effect, but the mouse knockouts, where deleting a single elastogenesis gene
          produces prolapse with no obstetric injury required, and the human genetic signal at connective
          tissue loci. Its weakness is that the human tissue changes may be reactive: the one study that
          compared uterosacral ligament with vaginal tissue found the changes larger in the vagina, the
          tissue actually being stretched.

          '
      selected_evidence:
        snippet: Patients with POP have lower expression of COLI and TIMP-1 and higher expression of COLIII
          and MMPs compared with non-POP cases, but further studies are required to investigate in specified
          anatomical sites.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
