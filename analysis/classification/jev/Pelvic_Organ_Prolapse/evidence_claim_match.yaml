          apical compartments, and the study that quantified it attributes the overall association to
          those two; no comparable quantified route from either the muscular or the connective-tissue
          arm to the posterior compartment was found. Wiring rectocele off the levator node anyway would
          assert an attribution the source specifically does not make. The mechanism of posterior compartment
          descent is a real gap in this entry rather than an omission.

          '
