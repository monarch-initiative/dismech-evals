              label: pemphigus erythematosus
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Desmosomal Autoantibody-Mediated Acantholysis
        conforms_to: desmosomal_adhesion_failure#Acantholysis and Mechanical Failure of Desmosome-Dependent
          Tissues
        description: Autoantibodies against desmosomal adhesion proteins in keratinocytes, especially
          desmoglein 1 and sometimes desmoglein 3, disrupt epidermal cell-cell adhesion. The resulting
          acantholysis produces superficial intraepidermal fluid collections and fragile bullae or erosions.
        cell_types:
        - preferred_term: Keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        biological_processes:
        - preferred_term: Cell Adhesion
          term:
            id: GO:0007155
            label: cell adhesion
          modifier: DECREASED
        - preferred_term: Immunoglobulin Production
          term:
            id: GO:0002377
            label: immunoglobulin production
          modifier: INCREASED
      selected_evidence:
        snippet: The autoantigens are desmoglein 3, desmoglein 1, and desmosomal adhesion proteins in
          keratinocytes. When these bonds are disrupted, it causes acantholysis of keratinocytes, leading
          to the fluid collection between layers.
        supports: SUPPORT
    origin:
