        category: Dermatological
        phenotype_term:
          preferred_term: Atypical Scarring of Skin
          term:
            id: HP:0000987
            label: Atypical scarring of skin
        notes: Frequency band deliberately omitted. Orphanet records atypical scarring as very frequent
          (99-80%), but pemphigus vulgaris is an intraepidermal (suprabasal) blistering disease that characteristically
          heals WITHOUT scarring - absence of scarring is a standard discriminator from subepidermal bullous
          diseases such as mucous membrane pemphigoid and epidermolysis bullosa acquisita. What is common
          after PV erosions is post-inflammatory hyperpigmentation, which the earlier note conflated with
          scarring. The Orphanet row is retained below as provenance for the discrepancy; do not reinstate
          the band without a primary source.
      selected_evidence:
        snippet: HP:0000987 | Atypical scarring of skin | Very frequent (99-80%)
        supports: SUPPORT
