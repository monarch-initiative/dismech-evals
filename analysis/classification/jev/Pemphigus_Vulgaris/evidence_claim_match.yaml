      assertion_type: Pathophysiology
      assertion:
        name: Immune Dysregulation and Th2/Th17 Skewing
        description: Pemphigus vulgaris is characterized by a shift toward Th2 and Th17 cytokine profiles
          with elevated IL-4, IL-6, and IL-17A, along with a marked reduction in regulatory T cells (Tregs).
          This imbalance promotes autoreactive B cell activation and pathogenic autoantibody production.
        biological_processes:
        - preferred_term: T Cell Differentiation
          term:
            id: GO:0030217
            label: T cell differentiation
        - preferred_term: Cytokine Production
          term:
            id: GO:0001816
            label: cytokine production
      selected_evidence:
        snippet: All patients with PV and PF showed significantly (p < 0.000) elevated levels of T(H)2
          cytokines (IL-10 and IL-4) as compared with healthy controls. However, the mean concentration
          of T(H)1 cytokines (IL-2 and IFN-gamma) was significantly decreased in patients as compared
          to healthy individuals.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
