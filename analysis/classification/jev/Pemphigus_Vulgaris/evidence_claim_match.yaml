      assertion:
        name: Acantholysis and Blister Formation
        conforms_to: desmosomal_adhesion_failure#Acantholysis and Mechanical Failure of Desmosome-Dependent
          Tissues
        description: Loss of desmosomal adhesion causes keratinocytes to detach from each other (acantholysis).
          Suprabasal clefting occurs as basal keratinocytes remain attached to the basement membrane while
          upper layers separate.
        biological_processes:
        - preferred_term: Cell Adhesion
          term:
            id: GO:0007155
            label: cell adhesion
      selected_evidence:
        snippet: Vesicles were seen in 149 cases (88%), the level of which was suprabasal in 91(61%) and
          both suprabasal and intraepidermal in 50 cases (33.5%). Acantholytic cells were present in 142
          cases (95%).
        supports: SUPPORT
