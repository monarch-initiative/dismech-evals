      assertion_type: Pathophysiology
      assertion:
        name: Desmoglein Compensation and Lesion Distribution
        description: 'The anatomic distribution of desmoglein 1 (superficial epidermis) versus desmoglein
          3 (mucosa and deeper epidermal layers) explains the clinical phenotype under the desmoglein
          compensation theory: mucosal-dominant PV (anti-Dsg3 only) produces mucosal erosions, whereas
          mucocutaneous PV (anti-Dsg3 plus anti-Dsg1) additionally produces cutaneous blistering.'
        cell_types:
        - preferred_term: Keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        biological_processes:
        - preferred_term: Cell Adhesion
          term:
            id: GO:0007155
            label: cell adhesion
      selected_evidence:
        snippet: Dsg1 is mainly expressed on the surface of the epidermis, while Dsg3 accumulates predominantly
          in the mucous membranes and deeper epidermal layers
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34630689
      reference_title: Comprehensive review on the pathophysiology, clinical variants and management of
        pemphigus (Review).
      explanation: Differential desmoglein expression (Dsg1 superficial epidermis, Dsg3 mucosa and deep
        epidermis) underlies the desmoglein compensation theory of lesion distribution in pemphigus vulgaris.
