      assertion_type: Pathophysiology
      assertion:
        name: HPV E6/E7 Oncoprotein-Driven Transformation
        conforms_to: viral_oncogenesis#Host Tumor Suppressor Inactivation and Signaling Hijack
        description: In the HPV-associated pathway, persistent high-risk HPV infection of penile squamous
          epithelium expresses the E6 and E7 oncoproteins. E6 targets p53 for ubiquitin-mediated degradation
          and E7 inactivates the Rb tumor suppressor, abrogating cell-cycle checkpoints and producing
          compensatory p16INK4a overexpression. These viral oncoproteins substitute for the somatic driver
          mutations seen in HPV-independent tumors.
        cell_types:
        - preferred_term: penile squamous epithelial cell
          term:
            id: CL:0000076
            label: squamous epithelial cell
        locations:
