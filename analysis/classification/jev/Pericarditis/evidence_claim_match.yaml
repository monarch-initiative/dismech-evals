  35d8d9015b53e84a133817e92780a56d0b937326032be79adde7e7e0b1dec4b6:
    claim:
      about:
        disease:
          name: Pericarditis
          disease_term:
            preferred_term: pericarditis
            term:
              id: MONDO:0005904
              label: pericarditis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: interleukin_1_blockade_controls_but_does_not_cure
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'What sustains the interleukin-1 loop between relapses, and is there a point at which
          interleukin-1 blockade can be stopped without the disease returning?

          '
        rationale: 'Both randomised trials of interleukin-1 blockade used a withdrawal design, and both
          showed the disease returning promptly when the drug was stopped. That is what establishes the
          mechanism, and it is also the problem, because it means the treatment is suppressive rather
          than curative and patients face indefinite injections. What holds the loop primed between clinically
          silent intervals is unknown. Candidate explanations include a persistent stimulus in the pericardium,
          an epigenetically trained innate immune state, and an underlying autoinflammatory genotype in
          the subset who carry one, but none has been shown to predict who can stop treatment.

          '
        attaches_to:
        - pathophysiology#Autoinflammatory recurrence loop
        - pathophysiology#Interleukin-1 release and cytokine amplification
        proposed_experiments:
        - experiment_id: exp_biomarker_guided_il1_withdrawal
          name: Biomarker-guided withdrawal of interleukin-1 blockade
          description: 'In patients in sustained remission on interleukin-1 blockade, randomise withdrawal
            guided by pericardial late gadolinium enhancement and C-reactive protein against fixed-duration
            continuation, with autoinflammatory-gene genotype as a prespecified stratifier, to test whether
            residual pericardial inflammation or genotype identifies who can stop.

            '
      selected_evidence:
        snippet: Median flare-free survival (time to flare) was 72 (interquartile range, 64-150) days
          after randomization in the placebo group and was not reached in the anakinra group (P <.001).
        supports: SUPPORT
