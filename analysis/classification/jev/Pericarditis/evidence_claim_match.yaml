        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pericardial injury from a heterogeneous trigger
        biological_scale: TISSUE
        conforms_to: fibrotic_response#Tissue Injury
        description: 'Viral infection, mycobacterial or pyogenic infection, uraemic toxin accumulation,
          myocardial or surgical injury, irradiation, malignant infiltration, or systemic autoimmune disease
          injures the pericardial mesothelium. The list is long and the downstream response is not, which
          is the central structural feature of this disease. Trigger identity determines the probability
          of progression to constriction and determines what treats the cause, but it barely determines
          the acute syndrome. Curating one trigger node rather than a separate chain per aetiology reflects
          that convergence.

          '
        cell_types:
        - preferred_term: pericardial mesothelial cell
          term:
            id: CL:0000077
            label: mesothelial cell
        locations:
        - preferred_term: pericardium
          term:
            id: UBERON:0002407
            label: pericardium
      selected_evidence:
        snippet: Pericarditis refers to the inflammation of the pericardial layers, resulting from a variety
          of stimuli triggering a stereotyped immune response
        supports: SUPPORT
