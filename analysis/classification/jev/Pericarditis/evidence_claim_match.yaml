        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: why_do_corticosteroids_make_recurrence_more_likely
        kind: OPEN_QUESTION
        status: OPEN
        prompt: 'Is the association between corticosteroid use and recurrence causal, and if so does it
          act by leaving the innate loop untouched, by prolonging viral persistence, or by selecting patients
          whose pain is not inflammatory?

          '
        rationale: 'The finding is robust enough to have changed guidelines, since corticosteroid use
          was an independent risk factor for recurrence in multivariable analysis of a randomised trial.
          Its interpretation is not settled. The mechanistic reading offered by this entry, that suppressing
          adaptive immunity does nothing to an innate interleukin-1 loop, is consistent with the drug
          response pattern but is not directly demonstrated. A competing reading is confounding by indication,
          since sicker patients receive steroids. A third possibility is raised by the observation that
          corticosteroid dependence in a recurrent-pericarditis cohort was associated with chronic pain,
          which would mean part of what is treated as steroid-dependent inflammatory disease is a pain
          syndrome that steroids cannot fix and that no anti-inflammatory endpoint will capture. These
          have different consequences for how refractory disease should be managed.

          '
        attaches_to:
        - pathophysiology#Autoinflammatory recurrence loop
      selected_evidence:
        snippet: After multivariate analysis, corticosteroid use (OR 4.30, 95% CI 1.21 to 15.25; P=0.024)
          was an independent risk factor for recurrences.
        supports: SUPPORT
