              id: MONDO:0005904
              label: pericarditis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Autoinflammatory recurrence loop
        biological_scale: ORGANISM
        description: 'In a substantial minority the inflammation does not settle after the trigger has
          gone, and the disease relapses after symptom-free intervals. The loop is innate rather than
          adaptive, and three independent lines of evidence say so. Interleukin-1 blockade suppresses
          it and withdrawal releases it. A minority of patients carry variants in the genes that cause
          hereditary periodic fever syndromes, and pericarditis is itself a recognised feature of those
          syndromes. And corticosteroids, which act mainly on the adaptive arm, make recurrence more likely
          rather than less. This node is why recurrent pericarditis is curated as its own subtype rather
          than as repetition of the acute one.

          '
      selected_evidence:
        snippet: During this period, 2 of 30 patients (7%) in the rilonacept group had a pericarditis
          recurrence, as compared with 23 of 31 patients (74%) in the placebo group.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33200890
      reference_title: Phase 3 Trial of Interleukin-1 Trap Rilonacept in Recurrent Pericarditis.
      evidence_source: HUMAN_CLINICAL
      explanation: A randomised-withdrawal design turns the recurrence rate into a direct measurement
        of how much of the ongoing disease depends on interleukin-1 signalling, which is the claim this
        node makes.
