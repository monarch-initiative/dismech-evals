      assertion_type: ExperimentalModel
      assertion:
        name: Interferon-gamma knockout mouse constrictive pericarditis model
        description: 'Cardiac myosin-induced experimental autoimmune myocarditis in interferon-gamma-deficient
          mice, which develop grossly visible pericarditis with pericardial inflammation and fibrosis
          and a haemodynamic phenotype reproducing human constriction, including the square-root sign
          on pressure tracing. Its value is that it solves an attribution problem. Because the model also
          produces myocarditis, the authors matched animals for myocardial disease severity and showed
          the constrictive haemodynamics tracked the pericardial disease and not the myocardial disease,
          which is the confound that makes restrictive and constrictive physiology hard to separate in
          patients. Its limitation is that constriction arises here from an autoimmune myocarditis protocol
          in a cytokine-deficient animal, which is not how human constriction arises.

          '
        experimental_model_type: OTHER
        organism:
          preferred_term: house mouse
          term:
            id: NCBITaxon:10090
            label: Mus musculus
        modeled_mechanisms:
        - target: Constrictive physiology
          description: 'The model reproduces the constrictive haemodynamic phenotype and attributes it
            to the pericardial rather than the myocardial disease.

            '
        - target: Fibrotic organization of the pericardium
          description: 'Pericardial inflammation and fibrosis are the lesion that produces the phenotype
            in this model.

            '
        publication: PMID:15505106
      selected_evidence:
        snippet: Constrictive pericarditis represents a serious hemodynamic syndrome that may lead to
          heart failure. Studies of its pathophysiological mechanisms have been impeded by the lack of
          an animal model.
        supports: SUPPORT
