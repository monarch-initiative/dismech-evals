        biological_scale: ORGANISM
        description: 'Intrapericardial pressure rises to equal and then exceed cardiac filling pressures,
          so the chambers cannot fill in diastole and cardiac output falls. The physiology is compressive
          rather than contractile, which is what it shares with constriction and with the obstructive
          shock of pulmonary embolism, and it produces the inspiratory fall in systolic pressure known
          as pulsus paradoxus through exaggerated ventricular interdependence within a fixed total volume.

          '
        locations:
        - preferred_term: pericardial sac
          term:
            id: UBERON:0002406
            label: pericardial sac
      selected_evidence:
        snippet: Exaggerated swings of intrapleural pressure, bi-ventricular interactions and increase
          afterload of the left ventricle are few of the pathophysiological mechanisms involved in the
          causation of pulsus paradoxus.
        supports: SUPPORT
