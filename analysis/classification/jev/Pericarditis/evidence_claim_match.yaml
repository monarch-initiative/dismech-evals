      assertion_type: Pathophysiology
      assertion:
        name: Acute pericardial inflammatory exudate
        biological_scale: TISSUE
        description: 'Neutrophils arrive first and are followed by lymphocytes and macrophages, microvascular
          permeability rises, and fibrin is deposited on the serosal surfaces. Every feature of the acute
          clinical syndrome comes from this node. The friction rub is the sound of fibrin-roughened layers
          moving on each other, the pain is irritation of the pain-sensitive parietal layer, the effusion
          is the permeability change, and the diffuse rather than territorial electrocardiographic change
          follows from the fact that the inflamed surface wraps the whole heart instead of following a
          coronary territory.

          '
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        locations:
        - preferred_term: pericardial sac
          term:
            id: UBERON:0002406
            label: pericardial sac
      selected_evidence:
        snippet: 'Diagnosis of pericarditis requires at least two of the following criteria: new or worsening
          pericardial effusion, characteristic pleuritic chest pain, pericardial friction rub, or electrocardiographic
          changes, including new, widespread ST elevations or PR depressions.'
        supports: SUPPORT
        directness: INDIRECT
