  ebe20ed638d3e5238ab49dbc1eb424d79e7bebfa236043d3b7fa79f275f96110:
    claim:
      about:
        disease:
          name: Pericarditis
          disease_term:
            preferred_term: pericarditis
            term:
              id: MONDO:0005904
              label: pericarditis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: constriction_model_fidelity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: 'Does constrictive pericarditis produced by autoimmune myocarditis in a cytokine-deficient
          mouse model the fibrotic organisation that follows tuberculous, purulent, or radiation pericarditis
          in patients?

          '
        rationale: 'The only established animal model of constriction arises from cardiac-myosin-induced
          autoimmune myocarditis in interferon-gamma-knockout mice. It reproduces the haemodynamics convincingly
          and, by matching animals for myocarditis severity, it settles that the physiology is pericardial.
          But the route to it is a route human patients do not take. Human constriction follows chronic
          granulomatous infection, purulent infection, cardiac surgery, or irradiation, and the absence
          of interferon-gamma in the model is not incidental, since interferon-gamma is central to the
          Th1 response that drives tuberculous pericarditis, the commonest cause of constriction worldwide.
          A model that removes the cytokine most implicated in the dominant human aetiology may be modelling
          the phenotype rather than the mechanism. This is a fidelity question, not an absence of evidence,
          which is why it is recorded as a model mismatch rather than a knowledge gap.

          '
        attaches_to:
        - pathophysiology#Fibrotic organization of the pericardium
        - pathophysiology#Constrictive physiology
        proposed_experiments:
        - experiment_id: exp_infection_driven_constriction_model
          name: Infection-driven model of pericardial constriction
          description: 'Develop and characterise a constriction model driven by intrapericardial mycobacterial
            antigen or by a purulent infectious challenge in immunocompetent animals, and compare its
            pericardial transcriptome and fibrotic architecture against both the interferon-gamma knockout
            model and human pericardiectomy specimens, to determine which model the human lesion resembles.

            '
      selected_evidence:
        snippet: Cardiac myosin-induced experimental autoimmune myocarditis in interferon (IFN)-gamma-knockout
          (KO) mice results in increased cardiac inflammation and development of severe grossly detectable
          pericarditis.
        supports: SUPPORT
