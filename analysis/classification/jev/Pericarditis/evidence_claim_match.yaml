          for the reservation is not toxicity alone. Corticosteroid use was an independent risk factor
          for recurrence in multivariable analysis of a randomised trial, so the intuitive treatment for
          an inflamed serosa makes the natural history worse. A plausible reading is that suppressing
          the adaptive arm does not touch the innate loop that drives relapse, and a separate cohort observation
          that steroid dependence tracks chronic pain suggests some of what appears to be steroid-dependent
          disease is not inflammatory at all.

