            term:
              id: MONDO:0005904
              label: pericarditis
        context: []
      assertion_type: Subtype
      assertion:
        name: Recurrent pericarditis
        display_name: Recurrent pericarditis
        description: 'Relapse after a documented symptom-free interval, and the commonest complication
          of the disease rather than an unusual outcome. This is the mechanistically distinctive subtype,
          because it behaves like an autoinflammatory disease rather than like a resolving response to
          an injury, and because it is the population in which interleukin-1 blockade was tested and approved.
          A minority of these patients carry variants in genes that cause hereditary periodic fever syndromes.
          No subtype_term is bound here, because this subtype covers recurrence of any cause and is therefore
          broader than MONDO:0016662, which is bound to the idiopathic subtype below.

          '
      selected_evidence:
        snippet: Recurrence is the most common complication of pericarditis, affecting 10% to 50% of patients.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21873705
      reference_title: 'Colchicine for recurrent pericarditis (CORP): a randomized trial.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes recurrence as the dominant complication rather than an uncommon one, which
        is what justifies curating it as a subtype and what makes prevention from the first episode the
        standard of care rather than a response to relapse.
