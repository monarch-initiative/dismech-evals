      assertion_type: Treatment
      assertion:
        name: Rilonacept
        description: 'A soluble interleukin-1 receptor fusion protein that traps both interleukin-1 alpha
          and interleukin-1 beta, given weekly by subcutaneous injection, and the first agent approved
          specifically for recurrent pericarditis. Its trial design is what makes it mechanistically informative.
          Patients were brought into remission on drug and then randomised to continue or withdraw, so
          the recurrence rate on placebo measures how much of the ongoing disease depends on interleukin-1
          rather than how much a drug relieves symptoms.

          '
        therapeutic_modality: PEPTIDE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: rilonacept
            term:
              id: NCIT:C84137
              label: Rilonacept
      selected_evidence:
        snippet: During the run-in period, the median time to resolution or near-resolution of pain was
          5 days, and the median time to normalization of the CRP level was 7 days.
        supports: SUPPORT
