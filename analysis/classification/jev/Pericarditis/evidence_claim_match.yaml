          intervention in the disease. Its effect is on recurrence rather than on the acute episode alone,
          which fits a drug acting on the inflammasome-driven loop rather than on the injury that started
          it. That it improves pericardial inflammation only partially in experimental models, while interleukin-1
          blockade improves it substantially, is consistent with its clinical position as an agent that
          reduces recurrence without abolishing it.

          '
