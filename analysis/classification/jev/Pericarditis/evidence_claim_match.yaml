              id: MONDO:0005904
              label: pericarditis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Constrictive physiology
        biological_scale: ORGANISM
        description: 'A rigid pericardium caps total cardiac volume, so diastolic pressures equalise across
          chambers, filling stops abruptly in early diastole, and the ventricles compete for a fixed space.
          The result is a right-heart-failure syndrome with raised venous pressure, ascites, and oedema
          in a patient whose ventricular contraction is normal, which is the reason it is routinely mistaken
          for liver or renal disease. It is not necessarily irreversible. A transient form associated
          with ongoing inflammation resolves with anti-inflammatory therapy, so the choice between drugs
          and pericardiectomy turns on distinguishing active inflammation from established fibrosis.

          '
        locations:
        - preferred_term: pericardium
          term:
            id: UBERON:0002407
            label: pericardium
      selected_evidence:
        snippet: Comparison of IFN-gamma-KO and wild-type mice matched for the severity of myocardial
          disease further confirmed that pericarditis, and not myocarditis, was responsible for smaller
          LV volumes, reduced cardiac output, increased cardiac stiffness, and increased peak filling
          rate adjusted for end-diastolic volumes in KO mice.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/0
      context_paths:
