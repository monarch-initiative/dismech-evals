        description: 'The arm of the disease that the founding reports missed. Patient T cells accumulate
          atypical actin structures at the immunological synapse, with reduced calcium flux and mildly
          impaired proliferation on T-cell receptor stimulation. The B-cell compartment is affected more
          severely still: peripheral B lymphopenia, few marrow B-cell progenitors, no switched memory
          B cells, reduced clonal diversity, abnormal spreading, and increased apoptosis on receptor stimulation.
          So the immunodeficiency in PFIT is not only a neutrophil delivery problem; it has an adaptive
          component with its own mechanism at the same molecular step.'
        cell_types:
