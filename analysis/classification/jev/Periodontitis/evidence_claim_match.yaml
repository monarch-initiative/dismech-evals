      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: oral_gut_translocation_model
        hypothesis_label: Oral-to-Gut Pathobiont Translocation Model
        status: EMERGING
        description: 'Periodontitis expands oral pathobionts (Klebsiella, Enterobacter) that are ingested
          and ectopically colonise the intestine, where they activate the inflammasome in colonic mononuclear
          phagocytes; in parallel, oral pathobiont-reactive Th17 cells generated in the mouth are imprinted
          with gut tropism and migrate to the intestine. This supplies an enteral, non-haematogenous route
          by which oral inflammation aggravates extra-oral disease. The causal chain is established in
          gnotobiotic and murine models; direct human causal verification is the open question (see the
          HUMAN_MODEL_MISMATCH discussion).

          '
      selected_evidence:
        snippet: Thus, oral inflammation, such as periodontitis, exacerbates gut inflammation by supplying
          the gut with both colitogenic pathobionts and pathogenic T cells.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32758418
      reference_title: The Intermucosal Connection between the Mouth and Gut in Commensal Pathobiont-Driven
        Colitis.
      evidence_source: MODEL_ORGANISM
      explanation: 'States the model''s central claim as the study''s own conclusion, in a murine periodontitis-colitis
