  6a3a57e8087cac101cf7fc7fe0c92a19c41f4d04d0bb9dd2a4274d366e7febae:
    claim:
      about:
        disease:
          name: Periodontitis
          disease_term:
            preferred_term: periodontitis
            term:
              id: MONDO:0005076
              label: periodontitis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: oral_gut_axis_human_causality
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Expansion and Ingestion of Oral Pathobionts
        - pathophysiology#Ectopic Intestinal Colonisation by Oral Pathobionts
        - pathophysiology#Gut-Homing Oral-Pathobiont-Reactive T Cell Induction
        prompt: 'Does the oral-to-gut pathobiont translocation chain established in murine and gnotobiotic
          models operate causally in humans with periodontitis, or is the human oral-gut association confounded
          by shared risk factors (smoking, diet, glycaemic state) and by the fact that both niches are
          sampled from the same individual?

          '
        rationale: 'Every step of the chain modelled here — periodontitis-driven expansion of Klebsiella
          and Enterobacter, ingestion and gut translocation, inflammasome activation in colonic mononuclear
          phagocytes, and gut-tropic imprinting of oral pathobiont-reactive Th17 cells — rests on murine
          periodontitis-colitis models and gnotobiotic colonisation of germ-free mice. Human data are
          largely cross-sectional co-detection of oral taxa in stool. The review that motivated this curation
          names causal verification as the field''s primary open challenge. This is a HUMAN_MODEL_MISMATCH
          rather than a KNOWLEDGE_GAP: the evidence exists and is mechanistically detailed, but its translational
          validity to human periodontitis is unresolved.

          '
        proposed_experiments:
        - experiment_id: exp_perio_oral_gut_strain_tracking
          name: Paired oral-faecal strain-resolved metagenomics through periodontal therapy
          description: 'Longitudinally sample saliva/subgingival plaque and stool from patients with stage
            III-IV periodontitis before and after a full course of subgingival instrumentation, and use
            strain-resolved metagenomics to test whether oral-origin Klebsiella/Enterobacter strains detectable
            in stool decline as the periodontal lesion resolves. Untreated periodontitis patients and
            periodontally healthy controls serve as comparators.

            '
          experiment_type:
            preferred_term: longitudinal human strain-resolved metagenomic cohort study
          decision_criterion: 'A treatment-associated fall in gut carriage of oral-origin strains, absent
            in untreated controls, would support directional oral-to-gut seeding in humans.

            '
          would_support:
          - pathophysiology#Ectopic Intestinal Colonisation by Oral Pathobionts
          - pathophysiology#Expansion and Ingestion of Oral Pathobionts
          supporting_outcome:
          - 'Oral pathobionts seed the human gut and the mouth is the upstream reservoir.

            '
          would_refute:
          - pathophysiology#Ectopic Intestinal Colonisation by Oral Pathobionts
          refuting_outcome:
          - 'Gut carriage of oral-type strains is unchanged by periodontal resolution, indicating shared
            exposure or independent gut colonisation rather than seeding.

            '
        - experiment_id: exp_perio_therapy_ibd_endpoint_trial
          name: Periodontal therapy trial in inflammatory bowel disease with gut endpoints
          description: 'Randomised trial of intensive versus standard periodontal therapy in patients
            with both periodontitis and inflammatory bowel disease, powered on intestinal inflammatory
            endpoints (faecal calprotectin, endoscopic activity) rather than on periodontal outcomes.

            '
          experiment_type:
            preferred_term: randomised interventional clinical trial
          decision_criterion: 'A significant reduction in intestinal inflammatory activity in the intensive
            arm would establish a causal oral-to-gut contribution in humans.

            '
          would_support:
          - mechanistic_hypotheses#oral_gut_translocation_model
          supporting_outcome:
          - 'Oral inflammation causally aggravates human intestinal inflammation.

            '
          would_refute:
          - mechanistic_hypotheses#oral_gut_translocation_model
          refuting_outcome:
          - 'No gut benefit despite periodontal resolution, indicating the murine intermucosal connection
            does not dominate in human disease.

            '
        - experiment_id: exp_perio_gut_homing_t_cell_tracking
          name: Antigen-specific tracking of oral pathobiont-reactive T cells in humans
          description: 'Identify oral pathobiont-reactive T cells in blood and paired gut biopsies from
            patients with periodontitis, and test whether they carry gut-homing integrin and chemokine-receptor
            imprints, as reported in mice.

            '
          experiment_type:
            preferred_term: human antigen-specific T cell phenotyping study
          decision_criterion: 'Detection of oral pathobiont-reactive, gut-homing-imprinted T cells in
            human gut tissue would translate the murine T cell arm.

            '
          would_support:
          - pathophysiology#Gut-Homing Oral-Pathobiont-Reactive T Cell Induction
          supporting_outcome:
          - 'The cellular arm of the oral-gut axis operates in humans.

            '
          would_refute:
          - pathophysiology#Gut-Homing Oral-Pathobiont-Reactive T Cell Induction
          refuting_outcome:
          - 'No such population is detectable, leaving only the microbial arm as a candidate human mechanism.

            '
      selected_evidence:
        snippet: Current challenges include difficulties in causal verification, substantial interindividual
          variability in intervention efficacy
        supports: SUPPORT
