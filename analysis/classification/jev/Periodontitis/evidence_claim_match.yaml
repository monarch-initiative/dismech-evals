      assertion_type: Pathophysiology
      assertion:
        name: Th17 Expansion and Neutrophil-Rich Periodontal Inflammation
        role: mechanism
        biological_scale: CELLULAR
        description: 'The dysbiotic community drives local proliferation of resident memory Th17 cells
          in the gingiva in an IL-6- and IL-23-dependent manner, with accompanying neutrophil accumulation.
          This IL-17-polarised infiltrate — not bacterial burden per se — is the proximate effector of
          periodontal tissue destruction. Human genetic experiments of nature run in both directions:
          individuals with defective Th17 differentiation show diminished periodontal inflammation and
          bone loss, while individuals with defective neutrophil recruitment (leukocyte adhesion deficiency
          type I) show excessive local IL-17 and severe bone loss.

          '
        cell_types:
        - preferred_term: T-helper 17 cell
          term:
            id: CL:0000899
            label: T-helper 17 cell
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: gingival epithelial cell
          term:
            id: CL:0002621
            label: gingival epithelial cell
        biological_processes:
        - preferred_term: T-helper 17 cell differentiation
          term:
            id: GO:0072539
            label: T-helper 17 cell differentiation
          modifier: INCREASED
        - preferred_term: interleukin-17 production
          term:
            id: GO:0032620
            label: interleukin-17 production
          modifier: INCREASED
        - preferred_term: neutrophil chemotaxis
          term:
            id: GO:0030593
            label: neutrophil chemotaxis
          modifier: INCREASED
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: periodontitis-associated expansion of TH17 cells was dependent on the local dysbiotic
          microbiome and required both IL-6 and IL-23
        supports: SUPPORT
