        hypothesis_label: Keystone-Pathogen / Polymicrobial Synergy and Dysbiosis Model
        status: CANONICAL
        description: 'The prevailing model: a low-abundance keystone organism (P. gingivalis) elevates
          the virulence of the whole subgingival community by subverting complement and innate immune
          surveillance, converting a commensal biofilm into a dysbiotic one that the host then over-responds
          to. Disease severity tracks the dysregulated host response rather than total bacterial load.

          '
      selected_evidence:
        snippet: The keystone-pathogen hypothesis holds that certain low-abundance microbial pathogens
          can orchestrate inflammatory disease by remodelling a normally benign microbiota into a dysbiotic
          one.
        supports: SUPPORT
