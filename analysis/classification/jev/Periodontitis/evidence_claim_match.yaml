  b8d678e8f9208517c6b774b9614238c8a9ff63342f094ed1b9c4a43e7c1ec25f:
    claim:
      about:
        disease:
          name: Periodontitis
          disease_term:
            preferred_term: periodontitis
            term:
              id: MONDO:0005076
              label: periodontitis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: periodontal_therapy_comorbidity_outcomes
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Chronic Systemic Inflammatory Burden and Comorbidity Risk
        prompt: 'Does treating periodontitis improve hard clinical outcomes in the associated comorbidities,
          or only surrogate markers?

          '
        rationale: 'The interventional evidence base for the periodontal-systemic link is largely built
          on surrogate endpoints. The one quantified outcome curated here is a roughly 0.4% HbA1c reduction
          in diabetes; for cardiovascular disease the joint EFP/WHF consensus stops at independent association.
          Without event-driven trials the direction and magnitude of any causal benefit remain open, and
          the comorbidity node should not be read as asserting that periodontitis causes its associated
          diseases.

          '
        proposed_experiments:
        - experiment_id: exp_perio_mace_outcome_trial
          name: Event-driven periodontal therapy trial with cardiovascular endpoints
          description: 'Randomised trial of intensive versus standard periodontal therapy in patients
            at elevated cardiovascular risk, with major adverse cardiovascular events as the primary endpoint
            rather than surrogate markers such as endothelial function or C-reactive protein.

            '
          experiment_type:
            preferred_term: event-driven randomised outcome trial
          decision_criterion: 'A significant reduction in major adverse cardiovascular events in the intensive
            arm.

            '
          would_support:
          - pathophysiology#Chronic Systemic Inflammatory Burden and Comorbidity Risk
          supporting_outcome:
          - 'Periodontal inflammation causally contributes to cardiovascular events.

            '
          would_refute:
          - pathophysiology#Chronic Systemic Inflammatory Burden and Comorbidity Risk
          refuting_outcome:
          - 'Surrogate-marker improvement without event reduction, indicating the association is largely
            confounded or non-causal.

            '
        - experiment_id: exp_perio_mendelian_randomisation
          name: Mendelian randomisation of periodontitis against cardio-metabolic outcomes
          description: 'Use periodontitis-associated germline variants as instruments to estimate the
            causal effect of periodontitis liability on cardio-metabolic outcomes, separating association
            from shared-risk-factor confounding.

            '
          experiment_type:
            preferred_term: Mendelian randomisation analysis
          decision_criterion: 'A significant instrumented effect surviving pleiotropy-robust sensitivity
            analyses.

            '
          would_support:
          - pathophysiology#Chronic Systemic Inflammatory Burden and Comorbidity Risk
          supporting_outcome:
          - 'A causal contribution of periodontitis liability to cardio-metabolic disease.

            '
          would_refute:
          - pathophysiology#Chronic Systemic Inflammatory Burden and Comorbidity Risk
          refuting_outcome:
          - 'A null instrumented effect, favouring confounding by smoking and metabolic state.

            '
      selected_evidence:
        snippet: Emerging evidence from interventional studies indicates that local treatment of periodontitis
          ameliorates surrogate markers of comorbid conditions.
        supports: SUPPORT
