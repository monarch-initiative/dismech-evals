        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Keystone-Pathogen Remodelling and Complement Subversion
        role: mechanism
        biological_scale: CELLULAR
        description: 'Porphyromonas gingivalis, present at very low abundance, disproportionately raises
          the pathogenicity of the whole community by manipulating complement receptor signalling (C3a/C5a
          receptors) and innate immune surveillance. In experimental periodontitis both an intact commensal
          microbiota and an intact complement system are required for P. gingivalis to cause bone loss,
          establishing that the organism acts through the community and the host rather than by direct
          tissue damage.

          '
        biological_processes:
        - preferred_term: complement activation
          term:
            id: GO:0006956
            label: complement activation
          modifier: INCREASED
        notes: 'Both supporting experiments are murine; the complement requirement has not been demonstrated
          by genetic ablation in humans.

          '
      selected_evidence:
        snippet: Here we show that P. gingivalis, at very low colonization levels, triggers changes to
          the amount and composition of the oral commensal microbiota leading to inflammatory periodontal
          bone loss.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22036469
      reference_title: Low-abundance biofilm species orchestrates inflammatory periodontal disease through
        the commensal microbiota and complement.
      evidence_source: MODEL_ORGANISM
      explanation: 'Demonstrates the keystone effect in mice: a low-abundance species remodels the community
        and causes bone loss.

        '
