            term:
              id: MONDO:0018920
              label: peripartum cardiomyopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Angiogenic imbalance and sFlt1-mediated vascular dysfunction
        description: The late-pregnant and early postpartum state is characterized by elevated levels
          of soluble fms-like tyrosine kinase 1 (sFlt1), an anti-angiogenic factor released by the placenta.
          sFlt1 antagonizes VEGF and PlGF signaling, leading to endothelial dysfunction and impaired cardiac
          angiogenesis. In susceptible women, this anti-angiogenic state triggers cardiomyocyte damage
          and systolic dysfunction.
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: negative regulation of angiogenesis
          term:
            id: GO:0016525
            label: negative regulation of angiogenesis
          modifier: INCREASED
        - preferred_term: vascular endothelial growth factor receptor signaling pathway
          term:
            id: GO:0048010
            label: vascular endothelial growth factor receptor signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: plasma samples from women with PPCM contained abnormally high levels of sFLT1. These
          data indicate that PPCM is mainly a vascular disease, caused by excess anti-angiogenic signalling
          in the peripartum period
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
