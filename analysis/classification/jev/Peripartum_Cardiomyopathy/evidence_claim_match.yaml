      reference: PMID:22596155
      reference_title: Cardiac angiogenic imbalance leads to peripartum cardiomyopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: The Nature 2012 study measured sFLT1 in human PPCM plasma samples, demonstrating elevated
        anti-angiogenic signaling as the core vascular mechanism underlying PPCM.
