  fa0aee5e49a47e552d75097c020221df0044b0f40c1cf736d177dbcf5fbe3fee:
    claim:
      about:
        disease:
          name: Peripartum Cardiomyopathy
          disease_term:
            preferred_term: peripartum cardiomyopathy
            term:
              id: MONDO:0018920
              label: peripartum cardiomyopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Oxidative stress and 16-kDa prolactin generation
        description: Oxidative stress in the peripartum myocardium activates cathepsin D, which cleaves
          full-length prolactin into a 16-kDa N-terminal fragment. This 16-kDa prolactin fragment is strongly
          anti-angiogenic and pro-apoptotic, damaging the cardiac microvasculature and promoting cardiomyocyte
          death. This mechanism provided the rationale for bromocriptine therapy in PPCM.
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
        - preferred_term: proteolysis
          term:
            id: GO:0006508
            label: proteolysis
      selected_evidence:
        snippet: female mice with a cardiomyocyte-specific deletion of stat3 develop PPCM. In these mice,
          cardiac cathepsin D (CD) expression and activity is enhanced and associated with the generation
          of a cleaved antiangiogenic and proapoptotic 16 kDa form of the nursing hormone prolactin
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17289576
      reference_title: A cathepsin D-cleaved 16 kDa form of prolactin mediates postpartum cardiomyopathy.
      evidence_source: MODEL_ORGANISM
      explanation: Seminal Cell 2007 paper establishing the STAT3/cathepsin D/16-kDa prolactin axis as
        a key pathogenic mechanism in PPCM, demonstrated in a mouse model.
