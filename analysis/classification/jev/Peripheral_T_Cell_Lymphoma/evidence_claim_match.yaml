        description: Secondary PTCL can arise clonally from an infused CAR-T product. In the single reported
          case that anchors this node, the reconstructed multistep oncogenic process combined a pre-existing
          germline driver mutation (BLM) with somatic TET2 mutations and genomic instability. Clonal CAR
          vector integration events in cancer-associated genes were also found, but the authors treat
          them as markers of clonal expansion rather than as established drivers, and note that the case
          lies on a spectrum between clonal lymphoproliferative disorder and overt PTCL.
        cell_types:
