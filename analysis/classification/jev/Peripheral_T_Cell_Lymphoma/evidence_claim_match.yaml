        - preferred_term: positive regulation of cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008284
            label: positive regulation of cell population proliferation
      selected_evidence:
        snippet: We describe a case of secondary peripheral T-cell lymphoma (PTCL) arising from infused
          CD19/CD22-4-1BB-CD3ζ-lenti bispecific chimeric antigen receptor (CAR)-T cells in a patient with
