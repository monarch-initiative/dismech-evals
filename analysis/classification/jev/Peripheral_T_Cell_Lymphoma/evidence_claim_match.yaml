        gene_term:
          preferred_term: BLM
          term:
            id: hgnc:1058
            label: BLM
        notes: Germline BLM mutations predispose to genomic instability and clonal evolution, and can
          contribute to secondary PTCL transformation in patients receiving CAR-T cell therapy. In the
          single reported case, BLM deficiency combined with somatic TET2 mutations and genomic instability
          in a multistep process leading to malignant progression of the therapeutic T-cell product; clonal
          CAR vector integration events were markers of that expansion rather than demonstrated drivers.
      selected_evidence:
        snippet: We describe a case of secondary peripheral T-cell lymphoma (PTCL) arising from infused
          CD19/CD22-4-1BB-CD3ζ-lenti bispecific chimeric antigen receptor (CAR)-T cells in a patient with
          relapsed or refractory B-cell lymphoma who carried a pathogenic germline BLM p.L107Ffs*36 variant.
