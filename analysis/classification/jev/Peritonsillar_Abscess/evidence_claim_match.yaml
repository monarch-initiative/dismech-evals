      assertion_type: Transmission
      assertion:
        name: Endogenous spread through the tonsillar-salivary duct system
        description: Peritonsillar abscess is a contiguous infection of resident oropharyngeal flora rather
          than a separate person-to-person transmission syndrome. Bacteria infect the tonsillar mucosa,
          tonsillar crypts, or Weber minor salivary glands and spread through salivary ducts into the
          potential space around the palatine tonsil.
      selected_evidence:
        snippet: We propose a unified hypothesis whereby bacteria initially infect the tonsillar mucosa
          and spread via the salivary duct system to the peritonsillar space, where an abscess is formed.
        supports: SUPPORT
