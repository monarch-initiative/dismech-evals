      assertion_type: Pathophysiology
      assertion:
        name: Radial Glial Apical Attachment and Vesicle-Trafficking Failure
        conforms_to: apical_neuroependyma_integrity_failure#Apical Junction, Ciliary, and Vesicle-Trafficking
          Perturbation
        description: Beyond the classical FLNA migration framing, several PVNH genes converge on the radial-glial
          apical apparatus at the ventricular surface, where apical adherens junctions, cadherin/catenin
          adhesion, and Golgi/endosomal vesicle trafficking maintain neuroependymal integrity. The autosomal
          recessive, microcephaly-associated gene ARFGEF2 encodes BIG2, a brefeldin A-inhibited GEF required
          for vesicle trafficking from the trans-Golgi network and for surface delivery of adhesion molecules
          such as E-cadherin and beta-catenin. The Dachsous-Fat protocadherin receptor-ligand pair DCHS1/FAT4
          mediates cell-cell adhesion and planar polarity. Disruption of these apical junction/trafficking
          programs weakens the ventricular lining and apical radial-glial attachment, an upstream lesion
          that culminates in mislocalized progenitors and ectopic periventricular neurons.
        genes:
        - preferred_term: ARFGEF2
          term:
            id: hgnc:15853
            label: ARFGEF2
        - preferred_term: FAT4
          term:
            id: hgnc:23109
            label: FAT4
        - preferred_term: DCHS1
          term:
            id: hgnc:13681
            label: DCHS1
        cell_types:
        - preferred_term: Radial glial cell
          term:
            id: CL:0000681
            label: radial glial cell
        - preferred_term: Neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        biological_processes:
