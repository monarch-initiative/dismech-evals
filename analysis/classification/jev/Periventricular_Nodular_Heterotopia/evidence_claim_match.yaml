          term:
            id: GO:0034332
            label: adherens junction organization
          modifier: DYSREGULATED
        locations:
        - preferred_term: Ventricular zone
          term:
            id: UBERON:0003053
            label: ventricular zone
        - preferred_term: Lateral ventricle
          term:
            id: UBERON:0002285
            label: telencephalic ventricle
      selected_evidence:
        snippet: ARFGEF2 encodes the large (>200 kDa) brefeldin A (BFA)-inhibited GEF2 protein (BIG2),
          which is required for vesicle and membrane trafficking from the trans-Golgi network (TGN).
        supports: SUPPORT
