          Defects
        description: Filamin A (FLNA) is a large actin-cross-linking phosphoprotein that transduces ligand-receptor
          binding into actin reorganization and is required for locomotion of many cell types. In the
          developing cerebral cortex, FLNA shows high-level expression and is required for neuronal migration
          from the ventricular zone to the cortical plate. Loss-of-function variants in FLNA disrupt actin
          cytoskeletal dynamics, preventing neurons from migrating to the cortex. These neurons persist
          as nodules lining the ventricular surface.
