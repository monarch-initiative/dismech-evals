      assertion:
        name: NEDD4L AKT-mTOR Dysregulation
        conforms_to: apical_neuroependyma_integrity_failure#NEDD4L AKT-mTOR Signaling Branch
        description: Heterozygous missense variants in the HECT domain of the E3 ubiquitin ligase NEDD4L
          cause an autosomal dominant PVNH branch, frequently with overlying polymicrogyria, toe syndactyly,
          and cleft palate. PVNH-related NEDD4L mutants deregulate mTORC1 and AKT signaling and, in in
          utero electroporation models, perturb neurogenesis, neuronal positioning, and terminal translocation,
          linking PVNH to the broader PI3K-AKT-mTOR cortical malformation spectrum while remaining anchored
          to apical/periventricular positioning.
        genes:
        - preferred_term: NEDD4L
