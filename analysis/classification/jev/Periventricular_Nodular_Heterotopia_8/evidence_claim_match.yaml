          value:
            name: ARF1
            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            gene_term:
              preferred_term: ARF1
              term:
                id: hgnc:652
                label: ARF1
            notes: Heterozygous ARF1 variants cause the autosomal dominant ARF1-related disorder, of which
              PVNH8 is the periventricular nodular heterotopia presentation. Most variants are de novo
              missense; the recurrent c.296G>A p.R99H substitution has been identified in multiple unrelated
              individuals. ARF1 encodes ADP-ribosylation factor 1, activated by the GEF ARFGEF2, whose
              biallelic loss causes the autosomal recessive form of periventricular heterotopia.
          role: ancestor
      assertion_type: Variant
      assertion:
        name: p.Arg99His
        description: 'Recurrent de novo missense variant (c.296G>A; p.R99H) identified in multiple unrelated
          individuals, and the variant carrying the most functional data. Those data conflict: some studies
          report increased GDP/GTP exchange, tighter binding to the effector GGA3 and constitutive activation,
          while another reports a decreased level of steady-state active ARF1 (the mechanism controversy
          recorded in discussions). They agree it disrupts the Golgi and causes a neuronal migration defect;
          notably one R99H individual did not have periventricular nodular heterotopia.'
        clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: we report a pediatric patient with an ARF1-related disorder because of a monoallelic
          de novo missense variant (c.296 G > A; p.R99H) in the ARF1 gene, associated with developmental
          delay, hypotonia, intellectual disability and motor stereotypies.
        supports: SUPPORT
