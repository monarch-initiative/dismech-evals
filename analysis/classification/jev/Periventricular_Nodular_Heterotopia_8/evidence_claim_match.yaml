          disease_term:
            preferred_term: periventricular nodular heterotopia 8
            term:
              id: MONDO:0032588
              label: periventricular nodular heterotopia 8
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_arf1_haploinsufficiency_vs_constitutive_activation
        prompt: Does the ARF1-related disorder arise from ARF1 haploinsufficiency (loss of function) or
          from constitutive activation (gain of function) of the ARF1 GTPase?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#ARF1 GTPase Cycle Dysregulation
        rationale: 'The first clinical report framed the mechanism as haploinsufficiency, citing an inherited
          loss-type variant with variable expressivity. The functional data are directly contradictory
          for the recurrent p.R99H variant: one group''s GST-GGA3 pulldown found that the patient variants
          caused a significant decrease in active ARF1 (a loss-of-function reading), whereas another group
          found the same variant has increased GDP/GTP exchange, tighter effector binding, resistance
          to brefeldin A, and Golgi swelling - the signature of constitutive activation. Both readings
          converge on Golgi disruption and impaired neuronal migration, so the downstream pathograph is
          unaffected, but the allele-level mechanism (and therefore the expected effect of truncating
          versus missense variants) is unresolved.'
      selected_evidence:
        snippet: haploinsufficiency of this gene causes a recognisable neurological disorder with abnormal
          neuronal migration and variable clinical expressivity.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34353862
