        - path: /pathophysiology/0
          value:
            name: ARF1 GTPase Cycle Dysregulation
            biological_scale: MOLECULAR
            description: 'ARF1 is a small GTPase that acts as a molecular switch at the Golgi, inactive
              when bound to GDP and active when bound to GTP. Heterozygous disease variants disrupt this
              cycle, but the direction of the functional effect is contested: for the same recurrent p.R99H
              variant one study found a decreased level of steady-state active (GTP-bound) ARF1, while
              others found increased GDP/GTP exchange and constitutive activation. The readings converge
              on Golgi disruption regardless (see the mechanism controversy in discussions).'
            genetic_context:
              variant_origin: GERMLINE
            molecular_functions:
            - preferred_term: GTPase activity
              term:
                id: GO:0003924
                label: GTPase activity
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Golgi Vesicular Trafficking Failure
        causal_link_type: DIRECT
      selected_evidence:
        snippet: indicating that the pathogenetic mechanism of the R99H-ARF1 variant involves constitutive
          activation with resultant Golgi and endosomal alterations.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0/downstream/0
      evidence_path: /pathophysiology/0/downstream/0/evidence/0
      context_paths:
