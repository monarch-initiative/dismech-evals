            term:
              id: MONDO:0032588
              label: periventricular nodular heterotopia 8
        context: []
      assertion_type: Genetic
      assertion:
        name: ARF1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: ARF1
          term:
            id: hgnc:652
            label: ARF1
        notes: Heterozygous ARF1 variants cause the autosomal dominant ARF1-related disorder, of which
          PVNH8 is the periventricular nodular heterotopia presentation. Most variants are de novo missense;
          the recurrent c.296G>A p.R99H substitution has been identified in multiple unrelated individuals.
          ARF1 encodes ADP-ribosylation factor 1, activated by the GEF ARFGEF2, whose biallelic loss causes
          the autosomal recessive form of periventricular heterotopia.
        variants:
        - name: p.Arg99His
          description: 'Recurrent de novo missense variant (c.296G>A; p.R99H) identified in multiple unrelated
            individuals, and the variant carrying the most functional data. Those data conflict: some
            studies report increased GDP/GTP exchange, tighter binding to the effector GGA3 and constitutive
            activation, while another reports a decreased level of steady-state active ARF1 (the mechanism
            controversy recorded in discussions). They agree it disrupts the Golgi and causes a neuronal
            migration defect; notably one R99H individual did not have periventricular nodular heterotopia.'
          clinical_significance: PATHOGENIC
        - name: p.Leu170Pro
          description: De novo missense variant (c.509T>C; p.Leu170Pro) reported in the first Chinese
            individual with ARF1-related disease, who presented with drug-refractory focal epilepsy and
            mild developmental delay but no periventricular nodular heterotopia. Molecular modelling and
            co-immunoprecipitation indicate it weakens the ARF1-GGA3 effector interaction, reinforcing
            that PVNH is not an obligate feature.
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: We confirm the role of ARF1 in an autosomal dominant syndrome with a phenotypic spectrum
          including severe ID, microcephaly, seizures and PVNH due to impaired neuronal migration.
        supports: SUPPORT
