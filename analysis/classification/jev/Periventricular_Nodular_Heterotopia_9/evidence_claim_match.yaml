              label: periventricular nodular heterotopia 9
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: FLNA-associated classic bilateral frontocentral PVNH (PVNH1)
        description: 'The commonest and best-known genetic PVNH, and the main reason this entry exists
          separately. FLNA disease is an actin-crosslinker lesion at the neuroependyma, not a microtubule
          lesion, which is why this entry conforms to the microtubule migration module and FLNA disease
          does not. The distinguishing pattern is radiological: classical heterotopia is bilateral frontal
          and body, where MAP1B PVNH is anteriorly predominant and reported with focal epilepsy.

          The sporadic series below describes that CLASSICAL group as a radiological class of 41 patients,
          and found FLNA variants in only 8 of the 100 patients it sequenced, so its female predominance,
          arachnoid cysts, cardiac abnormalities and low seizure burden are properties of an imaging class
          rather than of the FLNA genotype. This entry deliberately does not carry "mostly seizure-free"
          as an FLNA property: in the familial FLNA literature epilepsy is common, so doing so would steer
          a clinician wrong. An earlier draft of this description did exactly that.

          Note also that FLNA has a GeneReviews chapter (FLNA Deficiency, NBK1213) where MAP1B has none,
          so the two are not equally served by review literature. That chapter is matched by `just check-genereviews`
          as CITED_UNTAGGED: it is named here because it belongs to a differential, not to this disease,
          and MAP1B still has no chapter.'
      selected_evidence:
        snippet: FLNA mutations were identified in 8 patients.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/1
      context_paths:
