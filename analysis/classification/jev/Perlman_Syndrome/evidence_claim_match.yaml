      assertion_type: Pathophysiology
      assertion:
        name: DIS3L2 Biallelic Loss of Function
        description: Biallelic germline DIS3L2 variants (nonsense, frameshift, missense, and an exon 9
          deletion generated by LINE-1 non-allelic homologous recombination) remove the 3'-5' exoribonuclease
          activity of DIS3L2. Unlike DIS3 and DIS3L1, DIS3L2 lacks the PIN domain and has a different
          intracellular localization.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: DIS3L2
          term:
            id: hgnc:28648
            label: DIS3L2
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: 3'-5' exoribonuclease activity
          modifier: DECREASED
          term:
            id: GO:0000175
            label: 3'-5'-RNA exonuclease activity
      selected_evidence:
        snippet: We mapped a previously unknown susceptibility locus to 2q37.1 and identified germline
          mutations in DIS3L2, a homolog of the Schizosaccharomyces pombe dis3 gene, in individuals with
          Perlman syndrome.
        supports: SUPPORT
