  2e697a4278cef843415afec91fd2e55e49c5c0973f6e81f4606fba9b3c3ab077:
    claim:
      about:
        disease:
          name: Perlman Syndrome
          disease_term:
            preferred_term: Perlman syndrome
            term:
              id: MONDO:0009965
              label: Perlman syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of DIS3L2-Mediated Decay of Uridylated RNAs
        description: DIS3L2 degrades 3'-oligouridylated RNAs after uridylation by terminal uridylyl transferases.
          Its substrates include LIN28-directed uridylated pre-let-7 and a broad set of aberrantly processed,
          highly structured noncoding RNAs (7SL, RMRP, rRNA, snRNA, tRNA, Y RNAs). Loss of DIS3L2 stabilizes
          these substrates. Mature let-7 levels are not changed by DIS3L2 loss, so the disease mechanism
          is not thought to run through let-7 depletion.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: DIS3L2
          term:
            id: hgnc:28648
            label: DIS3L2
        biological_processes:
        - preferred_term: cytoplasmic RNA surveillance of uridylated noncoding RNAs
          modifier: DECREASED
          term:
            id: GO:0071025
            label: RNA surveillance
        - preferred_term: decay of uridylated pre-let-7
          modifier: DECREASED
          term:
            id: GO:0010587
            label: miRNA catabolic process
      selected_evidence:
        snippet: Here, we identify the Perlman syndrome-associated protein DIS3L2 as an oligo(U)-binding
          and processing exoribonuclease that specifically targets uridylated pre-let-7 in vivo.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24141620
      reference_title: Mammalian DIS3L2 exoribonuclease targets the uridylated precursors of let-7 miRNAs.
      evidence_source: IN_VITRO
      explanation: DIS3L2 is the nuclease for uridylated pre-let-7.
