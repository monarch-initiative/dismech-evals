        discussion_id: pbd11a_ab_boundary
        kind: KNOWLEDGE_GAP
        attaches_to:
        - genetic#PEX13
        - disease#
        prompt: What separates PBD11A from PBD11B, given how few PEX13 patients exist?
        rationale: 'At PEX1 and PEX12 the A/B severity split tracks residual function reasonably well,
          and there are enough patients to see the correlation. At PEX13 there are not. Roughly twenty
          variants are reported worldwide, and the assignment of a given case to 11A or 11B rests on the
          clinical description rather than on a measured level of residual import. Variant class does
          not settle it either: a homozygous missense allele produced a severe, fatal presentation, while
          the first patient assigned to this complementation group at all - the one from whom the locus
          was defined - had neonatal adrenoleukodystrophy, the milder phenotype. The boundary this entry
          sits on is therefore a clinical convention with thin genotypic support, and should be read that
          way.'
      selected_evidence:
        snippet: Here, we characterize the sole representative of complementation group 13 of the PBDs,
          a patient with NALD (patient PBD222).
        supports: SUPPORT
