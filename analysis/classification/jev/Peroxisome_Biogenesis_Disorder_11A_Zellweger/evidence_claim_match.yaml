            term:
              id: MONDO:0013949
              label: peroxisome biogenesis disorder 11A (Zellweger)
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Pex13-null mouse (ubiquitous Cre)
        species: Mouse
        genotype: Pex13 conditional (loxP) allele, ubiquitous Cre-mediated inactivation, homozygous
        publication: PMID:12897163
        description: 'The definitive whole-animal model of this disease: the orthologous gene, disrupted
          in every tissue. Unlike the Pex2-null mouse curated on the PBD3A entry, this is a same-gene
          model rather than a paralogous one.'
        modeled_mechanisms:
        - target: Failure of PTS1 and PTS2 Receptor Docking
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Reproduces the import block for both cargo classes, confirming that the docking
            peroxin is required for PTS1 and PTS2 routes alike.
          limitations: The model is a null. Most human PEX13 alleles - including the recurrent p.Arg294Trp
            - are missense and may retain partial docking function, so the null does not model the residual-function
            biology that separates 11A from 11B.
          readouts:
          - name: Import of PTS1- and PTS2-tagged matrix proteins
            target: Failure of PTS1 and PTS2 Receptor Docking
            direction: DECREASED
            interpretation: Loss of import for both targeting-signal classes is the direct readout of
              a failed docking complex.
        - target: Severe Neurodevelopmental Impairment
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Reproduces the clinical syndrome, including the perinatal lethality that defines
            the severe end of the spectrum.
          limitations: Death is neonatal, so the postnatal course seen in longer-surviving human infants
            - the sensory loss, the progressive white-matter disease, the developmental regression - cannot
            be observed in this model. The brain-restricted conditional was made for that reason.
          readouts:
          - name: Perinatal clinical phenotype and survival
            target: Severe Neurodevelopmental Impairment
            direction: DECREASED
            interpretation: Growth restriction, hypotonia, feeding failure and neonatal death recapitulate
              the severe human presentation.
        - target: Impaired Neuronal Migration and Neurogenesis
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Reproduces the cortical migration defect that is otherwise inferred from human
            neuropathology.
          limitations: Mouse cortical development is lissencephalic, so the polymicrogyria seen in human
            ZSD has no direct counterpart; disordered lamination is the closest available readout.
          readouts:
          - name: Cortical lamination
            target: Impaired Neuronal Migration and Neurogenesis
            direction: ALTERED
            interpretation: Disordered lamination is the expected signature of arrested radial migration.
      selected_evidence:
        snippet: Thus, Pex13(-/-) mice reproduce many of the features of Zellweger syndrome and PEX13
          deficiency in humans.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
