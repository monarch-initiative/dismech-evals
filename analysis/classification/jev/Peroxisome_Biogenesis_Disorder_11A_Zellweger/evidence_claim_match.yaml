              id: MONDO:0013949
              label: peroxisome biogenesis disorder 11A (Zellweger)
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pbd11a_docking_versus_recycling
        kind: INTERPRETATION
        attaches_to:
        - pathophysiology#Failure of PTS1 and PTS2 Receptor Docking
        - pathophysiology#Disrupted PEX13-PEX14 Docking Complex
        prompt: Does it matter mechanistically that PEX13 fails at docking rather than at receptor recycling?
        rationale: 'The KB now curates four PEX loci, and three of them - PEX1, PEX6, PEX12 - break the
          same half of the import cycle: the receptor docks and unloads, but is not exported back to the
          cytosol for reuse. PEX13 breaks the other half. The clinical convergence is nearly complete,
          which is the honest headline: a child with PBD11A is not distinguishable at the bedside from
          a child with PBD3A, and the biochemical screen does not separate them either.

          Two things do differ, and both are cell-biological rather than clinical. First, cargo selectivity:
          disrupting PEX13 self-association blocks PTS1 import specifically while leaving PTS2 routes
          and the PEX13-PEX14 interaction intact, so particular PEX13 alleles can produce a partial import
          defect of a kind the retrotranslocation mutants do not. Second, the fate of PEX5. In a recycling
          defect PEX5 accumulates at or in the membrane; in a docking defect it should not arrive there
          at all. That difference has not been used diagnostically and is recorded here as a mechanistic
          distinction rather than a clinical one.'
      selected_evidence:
        snippet: We demonstrate that the import of PTS1 (peroxisomal targeting signal 1) proteins is specifically
          disrupted when homooligomerization of PEX13 is interrupted.
        supports: SUPPORT
    origin:
