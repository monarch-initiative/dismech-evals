      assertion_type: Treatment
      assertion:
        name: Cholic Acid
        therapeutic_modality: SMALL_MOLECULE
        description: Oral cholic acid restores feedback inhibition of endogenous bile acid synthesis,
          so the hepatotoxic C27 intermediates that peroxisome-deficient hepatocytes cannot process stop
          accumulating. It is the only FDA-approved therapy for Zellweger spectrum disease and the only
          intervention in this entry that acts on a curated mechanism node rather than on a consequence.
          The trial evidence is spectrum-wide; no PEX13 patient has been reported on it, so its use here
          is by extension from the shared biochemical lesion.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: cholic acid
            term:
              id: CHEBI:16359
              label: cholic acid
      selected_evidence:
        snippet: Cholic acid significantly improved urine bile acid metabolite scores (P < 0.0001) and
          serum aspartate aminotransferase and alanine aminotransferase (P < 0.0001) in patients with
          SED and ZSD.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
      context_paths:
