        context: []
      assertion_type: Genetic
      assertion:
        name: PEX13
        gene_term:
          preferred_term: PEX13
          term:
            id: hgnc:8855
            label: PEX13
        relationship_type: CAUSATIVE
        notes: 'The complementation group 13 (group H) gene, encoding the SH3-domain docking peroxin.
          PEX13 is one of the rarest causes of Zellweger spectrum disease - roughly twenty variants reported
          worldwide - so the allelic spectrum is small and genotype-phenotype correlation is correspondingly
          weaker than at PEX1 or PEX12. A recurrent p.Arg294Trp allele accounts for three of the five
          families in the largest reported series. Note that the first patient assigned to this group
          presented at the milder, NALD end rather than with classical Zellweger syndrome, so the locus
          was defined by a phenotype closer to 11B than to the 11A presentation this entry curates.

          The published alleles sort into three functional tiers rather than two: null alleles (p.Trp234Ter,
          the whole-gene deletion, the 14-bp frameshift) leave no docking complex at all; SH3-domain missense
          alleles that break self-association (p.Trp313Gly) leave a complex that is present but non-functional
          for PTS1 import; and hypomorphic or temperature-sensitive missense alleles (p.Ile326Thr, p.Arg294Trp)
          leave residual import. The first two tiers present as 11A, the third as 11B.'
      selected_evidence:
        snippet: PEX13 encodes a peroxisomal membrane protein with a cytoplasmically exposed SH3 domain,
          and we find that expression of human PEX13 restores peroxisomal matrix-protein import in cells
          from patient PBD222.
        supports: SUPPORT
