            term:
              id: MONDO:0013949
              label: peroxisome biogenesis disorder 11A (Zellweger)
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted PEX13-PEX14 Docking Complex
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'PEX13 and PEX14 together form the docking complex of the peroxisomal membrane, the
          module that receives cargo-loaded PEX5 and PEX7. PEX13 also self-associates within peroxisomes,
          and modelling of the recurrent p.Arg294Trp allele predicts that it destabilises the dimer and
          with it the whole PEX13/PEX14 translocation module. Loss of self-association is not the same
          lesion as loss of PEX14 binding: the conserved SH3 tryptophan W313 is required for PEX13 homooligomerisation
          but dispensable for the PEX14 interaction, so an allele can break one and spare the other.

          The human module is not simply the yeast one. In yeast the Pex13 SH3 domain binds a polyproline
          PxxP motif in Pex14; in humans that surface does not recognise PEX14 PxxP motifs at all. Instead
          PEX14 binding is mediated by an FxxxF motif C-terminal to the SH3 domain, and the same FxxxF
          motif folds back onto the SH3 domain intramolecularly and regulates how PEX5 WxxxF/Y motifs
          bind there. So the docking module carries its own autoregulatory switch, and the textbook yeast
          model should not be carried across.'
        cellular_components:
        - preferred_term: peroxisomal membrane
          term:
            id: GO:0005778
            label: peroxisomal membrane
        molecular_functions:
        - preferred_term: SH3 domain binding
          modifier: DECREASED
          term:
            id: GO:0017124
            label: SH3 domain binding
        biological_processes:
        - preferred_term: protein homooligomerization
          modifier: DECREASED
          term:
            id: GO:0051260
            label: protein homooligomerization
      selected_evidence:
        snippet: Strikingly, intramolecular interaction of the PEX13 FxxxF motif regulates binding of
          PEX5 WxxxF/Y motifs to the PEX13 SH3 domain.
        supports: SUPPORT
    origin:
