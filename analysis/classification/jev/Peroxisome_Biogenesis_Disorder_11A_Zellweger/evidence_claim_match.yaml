  9e2512fd9902d3a21b01c26aeaf629ec1eb0a88125c5dccf2328182e8a418a40:
    claim:
      about:
        disease:
          name: Peroxisome Biogenesis Disorder 11A (Zellweger)
          disease_term:
            preferred_term: peroxisome biogenesis disorder 11A (Zellweger)
            term:
              id: MONDO:0013949
              label: peroxisome biogenesis disorder 11A (Zellweger)
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Brain-restricted Pex13 conditional mouse (Nestin-Cre)
        species: Mouse
        genotype: Pex13 conditional (loxP) allele, brain-restricted Cre-mediated inactivation
        publication: PMID:20959636
        description: Built to escape the neonatal lethality of the ubiquitous null. Most animals survive
          to about 35 days, which opens the postnatal cerebellar and glial phenotype to study. It is also
          the model that dissociates the two arms of the biochemical lesion.
        modeled_mechanisms:
        - target: Impaired Neuronal Migration and Neurogenesis
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Reproduces impaired cerebellar development - fissure and cortical layer formation,
            granule cell migration, Purkinje cell layer development - with astrogliosis and microgliosis,
            and separately impaired proliferation and maturation of neural progenitors from E12.5.
          limitations: Peroxisomal function is intact outside the brain, so this model cannot address
            the hepatic, adrenal or renal disease, and the systemic metabolic milieu of a real patient
            is absent. Notably VLCFA are normal in the mutant brain, so any phenotype here is attributable
            to the plasmalogen arm and to local peroxisomal failure rather than to circulating VLCFA.
          readouts:
          - name: Cerebellar layer formation and granule cell migration
            target: Impaired Neuronal Migration and Neurogenesis
            direction: ALTERED
            interpretation: Disrupted cerebellar cytoarchitecture reports failed migration and maturation
              in a peroxisome-deficient brain.
          - name: Neural progenitor proliferation and maturation
            target: Impaired Neuronal Migration and Neurogenesis
            direction: DECREASED
            interpretation: Reduced progenitor output is an earlier lesion than migration failure alone
              and helps explain the brain anatomy.
        - target: Secondary Mitochondrial Dysfunction
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Cerebellar neurons from this line show mitochondrial dysfunction with elevated
            reactive oxygen species and MnSOD, together with increased apoptosis. The same line also shows
            an expanded and morphologically altered mitochondrial population in the intact brain, with
            oxidative damage to neuronal lipid and DNA, so the finding is not confined to culture.
          limitations: What the model does not settle is direction. Antioxidant treatment rescues mitochondrial
            superoxide and membrane depolarization in PEX13-deficient fibroblasts, but that rescue has
            not been run in neurons and carries no survival endpoint, so nothing yet shows that correcting
            the mitochondrial phenotype prevents the neuronal death.
          readouts:
          - name: Reactive oxygen species and MnSOD in cultured cerebellar neurons
            target: Secondary Mitochondrial Dysfunction
            direction: INCREASED
            interpretation: Elevated ROS and the compensatory MnSOD rise report mitochondrial oxidative
              stress in peroxisome-deficient neurons.
          - name: Brain mitochondrial population and neuronal oxidative damage
            target: Secondary Mitochondrial Dysfunction
            direction: ALTERED
            interpretation: An expanded, morphologically modified mitochondrial population with lipid
              and DNA oxidation products reports the phenotype in the intact brain rather than in culture.
        - target: Plasmalogen Deficiency
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Plasmalogens fall in the mutant brain, so the deficiency arm is reproduced.
          limitations: Only one arm of the biochemical signature is present - VLCFA are normal - so this
            model reproduces the plasmalogen lesion without the accumulation lesion that accompanies it
            in patients.
          readouts:
          - name: Brain plasmalogen content
            target: Plasmalogen Deficiency
            direction: DECREASED
            interpretation: Reduced brain plasmalogen reports failed peroxisomal ether lipid synthesis
              in situ.
      selected_evidence:
        snippet: Thus, PEX13-deficient mice provide a valuable animal model for investigating the molecular
          basis and treatment of ZS cerebellar pathology.
        supports: SUPPORT
