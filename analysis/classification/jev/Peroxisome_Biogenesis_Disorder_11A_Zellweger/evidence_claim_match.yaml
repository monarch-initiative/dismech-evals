    evidence_metadata:
      reference: PMID:36541703
      reference_title: PEX13 prevents pexophagy by regulating ubiquitinated PEX5 and peroxisomal ROS.
      evidence_source: MODEL_ORGANISM
      explanation: Graded MODEL_ORGANISM because the sentence names a zebrafish model, which is in vivo
        animal data, and that is the more probative half for a translational-validity question; the cell-line
        half of the same paper is cited separately as IN_VITRO on the pathophysiology node. PARTIAL because
        it names exactly the systems the finding rests on, which is the mismatch this discussion records.
