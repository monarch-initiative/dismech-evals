      assertion_type: Discussion
      assertion:
        discussion_id: pbd11a_pexophagy_translational_validity
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Pexophagy of Import-Incompetent Peroxisomes
        prompt: Does the pexophagy released by PEX13 loss contribute to disease in patients, or is it
          a property of edited cell lines and zebrafish?
        rationale: 'The mechanism is clean where it has been measured: PEX13 loss lets ubiquitinated PEX5
          accumulate and peroxisomal reactive oxygen species rise, and the two together drive otherwise
          healthy peroxisomes into autophagic degradation. It was shown by gene editing and quantitative
          microscopy in cultured cells and in a zebrafish model, and PEX13 protein level is itself downregulated
          during amino acid starvation as part of normal pexophagy induction.

          The gap is between that and a patient. The one human observation that points the same way -
          a reduced peroxisome count in PEX13 patient fibroblasts - is equally compatible with impaired
          organelle proliferation, and nothing has measured autophagic flux in patient material. This
          matters because the two readings imply opposite therapeutic logic. If excess pexophagy is clearing
          a residual peroxisome population that still has partial function, then inhibiting autophagy
          preserves it, which is the rationale behind trials of hydroxychloroquine in other peroxisome
          biogenesis disorders. If the peroxisomes being cleared are import-dead anyway, preserving them
          achieves nothing. Note that those trials exclude PEX13, so the question has not been asked at
          this locus even indirectly.'
      selected_evidence:
        snippet: Using gene editing and quantitative fluorescence microscopy on culture cells and a zebrafish
          model system, we found that PEX13, a component of the peroxisomal matrix import system, is required
          to prevent the degradation of otherwise healthy peroxisomes.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
