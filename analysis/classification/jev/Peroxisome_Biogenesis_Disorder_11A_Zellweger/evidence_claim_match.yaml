        context: []
      assertion_type: Treatment
      assertion:
        name: Docosahexaenoic Acid Supplementation
        therapeutic_modality: SMALL_MOLECULE
        description: 'DHA is one of the lipids peroxisome-deficient cells cannot make, so replacing it
          is a mechanistically obvious idea. It does not work. A randomised, double-blind, placebo-controlled
          trial in peroxisome assembly disorders found no benefit in biochemistry, electroretinogram or
          growth. It is curated here as a refuted therapy rather than omitted, because the rationale is
          intuitive enough that it keeps being proposed. It carries no `target_mechanisms` link deliberately:
          every available `treatment_effect` value asserts an effect on the node, and the trial''s finding
          is that there is none.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: docosahexaenoic acid
            term:
              id: CHEBI:28125
              label: all-cis-docosa-4,7,10,13,16,19-hexaenoic acid
      selected_evidence:
        snippet: There was no difference in the outcomes between the treated and untreated groups in biochemical
          function, electroretinogram, or growth.
        supports: REFUTE
