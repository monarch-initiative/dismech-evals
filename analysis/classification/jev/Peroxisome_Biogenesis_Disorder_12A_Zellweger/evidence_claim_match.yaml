    evidence_metadata:
      reference: PMID:10051604
      reference_title: 'Human PEX19: cDNA cloning by functional complementation, mutation analysis in
        a patient with Zellweger syndrome, and potential role in peroxisomal membrane assembly.'
      evidence_source: IN_VITRO
      explanation: The complementation result in patient cells, which is the basis for treating matrix-import
        failure as a consequence of the PEX19 lesion.
