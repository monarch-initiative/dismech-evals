        description: Punctate calcific stippling of the infantile cartilaginous skeleton, classically
          of the patellae and the long bones, and one of the defining radiographic findings of the severe
          Zellweger phenotype. Not reported in either of the two PEX19 probands described in 2023 and
          2025, neither of whom had a skeletal survey reported.
        phenotype_term:
          preferred_term: Chondrodysplasia punctata of the patellae and long bones
          term:
            id: HP:0005841
            label: Calcific stippling of infantile cartilaginous skeleton
        notes: 'HPO carries no term labelled "chondrodysplasia punctata": an OLS search of hp for that
          string returns nothing bearing the name, and a search for "calcific stippling" returns site-specific
          terms (shoulder, humeral epiphyses, elbow, carpal bones) plus this one and HP:0002832 "Calcific
          stippling". HP:0002832 is defined as calcification "in soft tissues within or surrounding bones",
          which is not what chondrodysplasia punctata is; HP:0010655 "Epiphyseal stippling" is restricted
          to epiphyses and so does not cover the patella, which is cartilaginous at birth. This term covers
          the infantile cartilaginous skeleton as a whole, which is what the source describes.'
      selected_evidence:
        snippet: They have distinctive facies, congenital malformations (neuronal migration defects associated
          with neonatal-onset seizures, renal cysts, and bony stippling
        supports: SUPPORT
