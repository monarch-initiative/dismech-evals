      about:
        disease:
          name: Peroxisome Biogenesis Disorder 12A (Zellweger)
          disease_term:
            preferred_term: peroxisome biogenesis disorder 12A (Zellweger)
            term:
              id: MONDO:0013951
              label: peroxisome biogenesis disorder 12A (Zellweger)
        context:
        - path: /experimental_models/1
          value:
            name: PBDJ-01 patient fibroblasts (complementation group J)
            experimental_model_type: PRIMARY_CELL_CULTURE
            description: Skin fibroblasts from the original complementation-group-J Zellweger patient,
              who is homozygous for a 1-base insertion at A764 that frameshifts the C-terminal CAAX region.
              Transfection with human PEX19 restores peroxisomal protein import in these cells and in
              no other complementation group, which is the experiment that made PEX19 the causative gene
              for this disorder.
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            cell_source: patient-derived primary culture
            culture_system: 2D monolayer
            publication: PMID:10051604
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Collapse of Peroxisomal Matrix Protein Import
        relationship: RESCUES
        fidelity: HIGH
        model_scale: CELLULAR
        description: Human PEX19 expression restores matrix protein import in cells carrying a patient's
          own PEX19 allele, establishing that the import collapse is downstream of the PEX19 lesion and
          not a separate defect.
        limitations: A cultured skin fibroblast reports the cellular arm of the disorder only. It carries
          one allele from one patient, so it says nothing about the allelic series, and nothing about
          why the same cellular defect produces phenotypes ranging from neonatal death to long-term survival.
      selected_evidence:
        snippet: HsPEX19 expression also restored peroxisomal protein import in fibroblasts from a patient
          (PBDJ-01) with Zellweger syndrome of CG-J.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/1/modeled_mechanisms/0
      evidence_path: /experimental_models/1/modeled_mechanisms/0/evidence/0
      context_paths:
