              label: peroxisome biogenesis disorder 12A (Zellweger)
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Peroxisomal functional studies in cultured fibroblasts
        description: 'The fibroblast panel that establishes a peroxisome biogenesis defect and then localises
          it: plasmalogen biosynthesis and peroxisomal fatty acid alpha- and beta-oxidation to confirm
          the disorder, catalase and peroxisomal-membrane-protein immunofluorescence to ask whether any
          peroxisomal structure remains, and complementation assay or PEX cDNA transfection to assign
          the gene. The immunofluorescence step is the one that discriminates this entry''s gene: absent
          membrane remnants point at PEX3, PEX16 or PEX19, whereas the matrix-import disorders leave stainable
          ghosts. This is the route by which the 2010 PEX19 patient was diagnosed, and it remains usable
          where plasma screening is normal.'
      selected_evidence:
        snippet: Immunofluoresence microscopy revealed the absence of peroxisomes in fibroblasts.
        supports: SUPPORT
