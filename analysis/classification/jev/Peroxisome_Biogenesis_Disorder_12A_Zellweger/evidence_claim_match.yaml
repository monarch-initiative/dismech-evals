      assertion:
        target: Absence of Peroxisomal Membrane Compartments
        causal_link_type: DIRECT
        description: With no route for membrane proteins to reach a peroxisomal membrane, no such membrane
          is assembled. Kept DIRECT deliberately. Pex19p hands its cargo off at the membrane in partnership
          with Pex3p, so a named intermediate could be written in here - but which step that partnership
          performs is genuinely unsettled, with direct insertion into the peroxisomal membrane and budding
          of PMP-containing vesicles from the ER both still live models. Naming one would assert a mechanism
          the field has not agreed on; the edge records the dependency and this note records the dispute.
      selected_evidence:
        snippet: Although these peroxins have been extensively studied, no consensus has been reached
          yet on how they operate.
        supports: SUPPORT
