      assertion_type: Diagnosis
      assertion:
        name: Carrier and prenatal testing
        description: Once the two pathogenic variants are known in an affected family member, at-risk
          relatives can be carrier tested and a subsequent pregnancy can be tested by DNA analysis. Where
          the variants are not known but the biochemical defect has been confirmed in cultured fibroblasts
          from the affected family member, prenatal biochemical testing is the alternative route - which
          matters in this gene, because the plasma screen can be normal while the fibroblast studies are
          not.
        notes: No PEX19-specific prenatal or carrier-testing series exists; this record is the spectrum-level
          standard applied to a gene whose reported case base is a handful of families. The 2025 Saudi
          report is the only one here that tested parents, and it did so to confirm segregation rather
          than for reproductive counselling.
      selected_evidence:
        snippet: Carrier testing for at-risk relatives is possible if the pathogenic variants have been
          identified in an affected family member.
        supports: SUPPORT
