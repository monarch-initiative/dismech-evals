  57baceae59daaf7bcb44c25ad2547697c6fbe3dcd21db90faaeac83b2e1a9d7e:
    claim:
      about:
        disease:
          name: Peroxisome Biogenesis Disorder 12A (Zellweger)
          disease_term:
            preferred_term: peroxisome biogenesis disorder 12A (Zellweger)
            term:
              id: MONDO:0013951
              label: peroxisome biogenesis disorder 12A (Zellweger)
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic PEX19 Loss of Function
        biological_scale: MOLECULAR
        description: 'Both PEX19 alleles carry variants that abolish or severely reduce functional Pex19p.
          Reported severe alleles are truncating: the original complementation-group-J patient was homozygous
          for a single-base insertion that frameshifts the codon for Met255 and replaces the C-terminus,
          including the CAAX box required for function, with an unrelated 24-residue tail; the most recent
          family was homozygous for a nonsense change in exon 4 predicted to trigger nonsense-mediated
          decay.'
        genes:
        - preferred_term: PEX19
          term:
            id: hgnc:9713
            label: PEX19
