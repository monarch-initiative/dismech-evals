            term:
              id: MONDO:0011101
              label: peroxisome biogenesis disorder 1B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hypomorphic PEX1 Variants with Residual Peroxin-1 Protein
        biological_scale: MOLECULAR
        description: PBD1B is defined at the protein level by PEX1 genotypes that reduce but do not abolish
          peroxin-1. The common p.Gly843Asp (G843D) missense allele yields a conformationally unstable,
          misfolding-prone protein that is present at reduced steady-state levels, in contrast to the
          complete absence of PEX1 protein that underlies classic Zellweger syndrome (PBD1A). Culturing
          G843D fibroblasts at 30 degrees C raises PEX1 protein levels and restores peroxisomal function,
          establishing that the lesion is folding/stability rather than a loss of the catalytic residue
          itself.
        genes:
        - preferred_term: PEX1
          term:
            id: hgnc:8850
            label: PEX1
        molecular_functions:
        - preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          modifier: DECREASED
      selected_evidence:
        snippet: This suggests that the G843D missense mutation results in a misfolded protein, which
          is more stable at lower temperatures.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11389485
      reference_title: 'Disorders of peroxisome biogenesis due to mutations in PEX1: phenotypes and PEX1
        protein levels.'
      evidence_source: IN_VITRO
      explanation: Temperature-dependent rescue in patient fibroblasts identifies the common PBD1B allele
