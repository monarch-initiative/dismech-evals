      assertion:
        name: Partial Peroxisomal Matrix Protein Import Failure
        biological_scale: CELLULAR
        description: Unlike the near-complete import block of classic Zellweger syndrome, PBD1B cells
          show partial and heterogeneous import. Fibroblasts carrying mild missense PEX1 alleles display
          peroxisomal mosaicism - a mixed population of import-competent and import-deficient cells -
          whose proportion of peroxisome-positive cells improves at reduced temperature or with a chemical
          chaperone. This residual, conformation-dependent import capacity is the cellular signature of
          the non-classic end of the spectrum.
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: protein import into peroxisome matrix
          term:
            id: GO:0016558
            label: protein import into peroxisome matrix
          modifier: DECREASED
        - preferred_term: peroxisome organization
          term:
            id: GO:0007031
            label: peroxisome organization
          modifier: DECREASED
      selected_evidence:
        snippet: In cell lines displaying peroxisomal mosaicism, peroxisome biogenesis can be improved
          when these are cultured at 30°C.
        supports: SUPPORT
