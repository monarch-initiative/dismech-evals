              label: peroxisome biogenesis disorder 1B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Receptor Export Module Insufficiency
        biological_scale: MOLECULAR
        description: PEX1 and PEX6 assemble into a heterohexameric AAA-ATPase motor that extracts monoubiquitinated
          PEX5 from the peroxisomal membrane docking/translocation module by processive threading and
          unfolding, so that PEX5 can be reused for another round of matrix protein import. In PBD1B the
          motor is present but functionally insufficient, so receptor recycling is slowed rather than
          abolished.
        molecular_functions:
        - preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          modifier: DECREASED
      selected_evidence:
        snippet: Their role is to extract monoubiquitinated PEX5, the peroxisomal protein-shuttling receptor,
          from the peroxisomal membrane docking/translocation module (DTM), so that a new cycle of protein
          transportation can start.
        supports: SUPPORT
