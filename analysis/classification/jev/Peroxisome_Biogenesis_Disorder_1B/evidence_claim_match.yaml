      assertion_type: Genetic
      assertion:
        name: PEX1
        gene_term:
          preferred_term: PEX1
          term:
            id: hgnc:8850
            label: PEX1
        association: 'Biallelic PEX1 pathogenic variants cause the whole PEX1 complementation group (CG1);
          PBD1B specifically requires at least one allele that preserves residual peroxin-1 protein and
          function. PEX1 is the most common cause of Zellweger spectrum disease overall. The two commonest
          alleles, the hypomorphic missense c.2528G>A (p.Gly843Asp) and the null frameshift c.2097insT
          (p.Ile700TyrfsX42), together account for the great majority of abnormal PEX1 alleles, and their
          combination determines where a patient falls on the severity spectrum: G843D homozygosity gives
          the mildest (PBD1B) outcomes, G843D in trans with a null allele an intermediate phenotype, and
          two null alleles classic Zellweger syndrome (PBD1A).'
      selected_evidence:
        snippet: The gene affected in CG1 is PEX1. Approximately 65% of the patients with PBD harbor mutations
          in PEX1.
        supports: SUPPORT
