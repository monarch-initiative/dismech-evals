  a5536e4672ff5cae9f174fd2ffe5d3a94c9e5e3c26545ee1809acd3e7f4fdc7d:
    claim:
      about:
        disease:
          name: Peroxisome Biogenesis Disorder 2B
          disease_term:
            preferred_term: peroxisome biogenesis disorder 2B
            term:
              id: MONDO:0008736
              label: peroxisome biogenesis disorder 2B
        context: []
      assertion_type: Biochemical
      assertion:
        name: Peroxisomal Matrix Protein Import in Patient Fibroblasts
        notes: 'The assay that defines this entity at the cellular level, and the one that distinguishes
          PBD2B from PBD2A. Import of PTS1 and PTS2 reporters is scored separately in cultured fibroblasts,
          and complementation with wild-type PEX5 is what establishes that a candidate variant is causal.

          Two refinements specific to PEX5 disease. First, the PTS1 arm should not be scored with a single
          reporter: the cargo-selectivity result means a receptor can import a -SKL protein normally while
          failing -AKL and -KANL proteins, so a normal acyl-CoA oxidase import does not exclude the disorder.
          Second, PTS2 import status is informative rather than redundant - in the three characterised
          patients it separated the Zellweger allele, which lost both arms, from the non-classic alleles.

          Temperature is the third variable. Culturing mild-phenotype PBD fibroblasts at 30 degrees C
          restores peroxisomal biogenesis and metabolic function, which is both a severity predictor and
          a way of demonstrating that residual peroxin function exists. It has not been reported in a
          PEX5 patient''s cells; see the pathophysiology node of that name.'
      selected_evidence:
        snippet: we analyzed peroxisome matrix protein import in fibroblasts from three patients with
          peroxisome biogenesis disorders, all with different mutations in the PEX5 gene
        supports: SUPPORT
        directness: DIRECT
