        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Partial Loss of the PEX5L-Dependent PTS2 Arm
        biological_scale: MOLECULAR
        role: effector
        mechanism_confidence: ESTABLISHED
        description: 'PEX5 is transcribed as two isoforms. The long one, PEX5L, carries an extra internal
          exon and additionally acts as the co-receptor through which PEX7 delivers PTS2-tagged cargo;
          the short one does PTS1 import only. Transfection experiments separate the two arms cleanly:
          PEX5S restores PTS1 import but not PTS2 import, PEX5L restores both.

          That architecture is why a PEX5 patient''s PTS2 arm may or may not be involved, and the involvement
          tracks severity. The Zellweger patient''s nonsense allele lost both arms; the neonatal adrenoleukodystrophy
          patient''s N489K receptor was severely defective in PTS1 import with PTS2 import preserved;
          the infantile Refsum patient retained function on both. So in PBD2B the PTS2 arm is *relatively*
          spared, and that sparing is part of why the disease is milder.

          A caution against over-reading this. It rests on three patients, one per phenotype, and the
          alleles differ in kind as well as in position - so the correlation between "how many arms fail"
          and "how severe the disease" is a pattern across three points, not a demonstrated dose-response.'
        biological_processes:
        - preferred_term: protein import into peroxisome matrix
          modifier: DECREASED
          term:
            id: GO:0016558
            label: protein import into peroxisome matrix
      selected_evidence:
        snippet: Transfection of PBD005 cells with PEX5S cDNA restores PTS1 but not PTS2 import; transfection
          with PXR5L cDNA restores both PTS1 and PTS2 protein import.
        supports: SUPPORT
        directness: DIRECT
    origin:
