      assertion_type: Phenotype
      assertion:
        name: Postnatal Growth Failure
        category: Growth
        description: 'Growth deficiency emerging after birth, reported in many patients in the prolonged-survival
          cohort. It matters clinically because it is the manifestation gastrostomy feeding addresses,
