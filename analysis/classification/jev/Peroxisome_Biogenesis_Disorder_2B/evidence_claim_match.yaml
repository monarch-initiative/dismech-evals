  d8da3d1e8bad9d4391cc24e906d036a30bf59c1ad6c05e747d8054d76bd77714:
    claim:
      about:
        disease:
          name: Peroxisome Biogenesis Disorder 2B
          disease_term:
            preferred_term: peroxisome biogenesis disorder 2B
            term:
              id: MONDO:0008736
              label: peroxisome biogenesis disorder 2B
        context: []
      assertion_type: Treatment
      assertion:
        name: Scheduled Multisystem Surveillance
        action_category: MONITORING
        description: 'GeneReviews gives surveillance its own labelled sub-section, separate from treatment
          of manifestations, and the distinction is worth keeping: the manifestations that most reward
          early detection here - adrenal insufficiency, hyperoxaluria, hearing and vision loss - are the
          ones with treatments that work, and they are progressive rather than present at diagnosis. So
          the schedule is what converts a treatable complication into a treated one.

          Annual audiology and ophthalmology; annual liver function, coagulation factors and hepatic imaging;
          ACTH and cortisol by age one year and annually thereafter; annual urine oxalate-to-creatinine
          ratio with kidney imaging taken alongside liver imaging; six-monthly dental examination; growth
          and nutrition at every visit; and head MRI when cognitive or motor ability changes.'
        treatment_term:
          preferred_term: scheduled multisystem disease surveillance
        notes: 'No `term:` on the treatment_term. NCIT has no clinical-action term for scheduled disease
          surveillance reachable from NCIT:C25218 (Clinical Intervention or Procedure) - NCIT:C61256 Monitoring
          is not in that subtree - so this follows the documented free-text fallback, with the MONITORING
          `action_category` carrying the machine-queryable intent. The same disposition is recorded on
          the surveillance entry in MPI-Congenital_Disorder_of_Glycosylation.

          No `target_mechanisms:` and no `target_phenotypes:`, because surveillance detects rather than
          modifies, and the schema''s MONITORING category says those slots should not be used.'
      selected_evidence:
        snippet: Dental examinations every six months.
        supports: SUPPORT
        directness: DIRECT
    origin:
