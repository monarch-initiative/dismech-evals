        name: Rhizomelic chondrodysplasia punctata type 5
        description: The other PEX5 disease, and the reason a PEX5 variant cannot be interpreted without
          knowing which isoform it hits. RCDP5 is caused by an allele in the long-isoform-specific exon,
          which removes the PTS2 co-receptor function while leaving PTS1 import intact - the mirror image
          of the lesion in this entry. It is curated separately in this knowledge base and presents as
          rhizomelic chondrodysplasia punctata, not as Zellweger spectrum disease.
      selected_evidence:
        snippet: Taken together, these data provide an explanation for the different protein import defects
          in CG2 patients and show that the long isoform of the Pex5 protein is required for peroxisomal
          import of PTS2 proteins.
        supports: SUPPORT
