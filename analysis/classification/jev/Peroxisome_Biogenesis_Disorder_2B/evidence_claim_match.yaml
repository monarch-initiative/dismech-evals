      assertion_type: Genetic
      assertion:
        name: PEX5
        gene_term:
          preferred_term: PEX5
          term:
            id: hgnc:9719
            label: PEX5
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'PEX5 encodes the cytosolic PTS1 receptor and defines complementation group 2 of the peroxisome
          biogenesis disorders. ClinGen classifies the gene-disease relationship as definitive with autosomal
          recessive inheritance.

          Three alleles anchor the severity range and are quoted on the evidence items in this entry:
          R390X (nonsense) in classic Zellweger syndrome, N489K (missense) in neonatal adrenoleukodystrophy,
          and S563W (missense) in infantile Refsum disease. The two missense alleles are the PBD2B end.

          Two things a curator adding PEX5 variants here needs to know. First, the isoform matters: an
          allele in the long-isoform-specific exon 9 does not give Zellweger spectrum disease at all -
          it gives rhizomelic chondrodysplasia punctata type 5, curated separately, by knocking out the
          PTS2 arm while sparing PTS1. Second, residue numbering in the PEX5 literature is reported against
          both isoforms, and the older Chinese hamster work states its positions in both (for example
          Gly485Glu of the short isoform is G522E of the long one). Check which isoform a paper is numbering
          against before matching an allele.

          PEX5 is a rare cause within the peroxisome biogenesis disorders. In a 14-patient Iranian series,
          PEX1 accounted for five patients and PEX5 for one - a proportion consistent with the older complementation-group
          data, in which group 1 (PEX1) dominates.'
      selected_evidence:
        snippet: PEX5 | HGNC:9719 | peroxisome biogenesis disorder | MONDO:0019234 | AR | Definitive
        supports: SUPPORT
        directness: DIRECT
