        name: Biochemical Screening Followed by ZSD-PEX Gene Sequencing
        description: 'The diagnosis is established by biallelic pathogenic variants in one of the thirteen
          ZSD-PEX genes in a proband with suggestive clinical and biochemical findings. In practice a
          raised very-long-chain fatty acid profile brings the patient to genetic testing, and a panel
          or exome then identifies the gene; PEX5 is one of the rarer answers, so it is found by broad
          sequencing rather than by being suspected.

          The non-classic phenotype is the one that gets missed. These children have no congenital malformations,
          so a child with progressive hearing and vision loss, ataxia and abnormal enamel may be carried
          for years under another label before a peroxisomal screen is sent.'
      selected_evidence:
        snippet: The diagnosis of ZSD is established in a proband with the suggestive clinical and biochemical
          findings above by identification of biallelic pathogenic variants in one of the 13 known ZSD-PEX
          genes.
