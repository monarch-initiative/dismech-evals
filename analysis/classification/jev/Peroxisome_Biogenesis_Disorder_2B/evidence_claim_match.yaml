            term:
              id: MONDO:0008736
              label: peroxisome biogenesis disorder 2B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cargo-Selective Failure of PTS1 Recognition
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'The mechanism that is specific to this entity rather than borrowed from the spectrum.
          PEX5 recognises matrix enzymes by their C-terminal PTS1 tripeptide, but real PTS1 signals are
          not equally good matches. The canonical -SKL of acyl-CoA oxidase is a strong signal; -AKL (D-bifunctional
          protein, sterol carrier protein 2) and -KANL (catalase) are weaker variants.

          A mildly damaged receptor therefore fails asymmetrically. In the infantile Refsum patient''s
          fibroblasts the S563W receptor still imported the -SKL cargo and had little or no function for
          -AKL and -KANL. The authors draw the general conclusion: the poorer PTS1 variants are the ones
          most susceptible to a receptor mutation.

          Two consequences worth holding on to. First, this predicts that the biochemical profile of a
          PBD2B patient should be uneven across peroxisomal pathways rather than uniformly depressed,
          because which enzymes reach the organelle depends on their targeting signals. Second, it means
          "residual receptor function" in this disorder is not a single number - two patients with the
          same residual import of one reporter could differ in which enzymes they actually import.'
        biological_processes:
        - preferred_term: protein targeting to peroxisome
          modifier: DECREASED
          term:
            id: GO:0006625
            label: protein targeting to peroxisome
      selected_evidence:
        snippet: The PTS1 receptor in 2-03 is functional for only the C-terminal -SKL sequence (acyl-CoA
          oxidase) and had little or no function for C-terminal -AKL (D-bifunctional protein and sterol
          carrier protein 2) and -KANL (catalase) sequences, respectively.
        supports: SUPPORT
        directness: DIRECT
    origin:
