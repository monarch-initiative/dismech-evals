      assertion_type: Pathophysiology
      assertion:
        name: Hypomorphic PEX5 Variants with Residual PTS1 Receptor Function
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'The initiating lesion, and the point at which PBD2B separates from classic PEX5
          Zellweger syndrome. PEX5 mutations define complementation group 2 of the peroxisome biogenesis
          disorders, and expressing wild-type PEX5 rescues the PTS1 import defect in patient fibroblasts
          - which is what makes the variants causal rather than incidental.

          The three PEX5 patients analysed together in 1999 span the group''s whole severity range and
          correlate it with allele type: a nonsense allele (R390X) in the Zellweger patient, and missense
          alleles in the two non-classic patients (N489K in neonatal adrenoleukodystrophy, S563W in infantile
          Refsum disease). PBD2B is the missense, residual-function half of that picture.'
        genes:
        - preferred_term: PEX5
          term:
            id: hgnc:9719
            label: PEX5
        genetic_context:
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          description: 'Curated as partial rather than complete loss of function on the strength of the
            measured import phenotypes: the non-classic alleles retain demonstrable PTS1 or PTS2 receptor
            activity in patient fibroblasts, where the nonsense allele associated with classic Zellweger
            syndrome does not. This is the slot''s intended use - the claim is about the consequence of
            a variant, not about the activity level of a pathway.'
      selected_evidence:
        snippet: The patients 2-01 (Zellweger syndrome) and 2-05 (neonatal adrenoleukodystrophy) have
          the reported mutations, R390X and N489K, and patient 2-03 (infantile Refsum disease) has a newly
          identified mutation, S563W.
        supports: SUPPORT
        directness: DIRECT
