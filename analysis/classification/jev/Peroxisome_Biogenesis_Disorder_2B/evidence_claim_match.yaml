        context: []
      assertion_type: Treatment
      assertion:
        name: Symptomatic and Supportive Management
        description: 'There is no treatment that restores peroxisomal import. Management of the non-classic
          Zellweger spectrum is symptomatic and organ-directed, and several of its components matter because
          the manifestations they address are themselves treatable: hearing aids, cataract removal and
          refractive correction, fat-soluble vitamin supplementation, cholic acid, gastrostomy for caloric
          intake, adrenal replacement, vitamin D with consideration of bisphosphonates for osteopenia,
          dental care for the amelogenesis imperfecta, and hydration, lithotripsy or surgery for renal
          oxalate stones.

          Curated as one treatment rather than split into a dozen, because the source presents it as one
          management approach and splitting it would create treatment entries with no evidence of their
          own.'
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: The focus is on symptomatic therapy and may include gastrostomy to provide adequate calories,
          hearing aids, cataract removal, glasses to correct refractive errors, supplementation of fat-soluble
          vitamins, and cholic acid supplementation
        supports: SUPPORT
        directness: DIRECT
