            term:
              id: MONDO:0008736
              label: peroxisome biogenesis disorder 2B
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Import-Arm Phenotyping to Interpret a Novel PEX5 Variant
        description: 'Because so few pathogenic PEX5 alleles have been reported, a new PEX5 variant found
          in a patient with a peroxisomal phenotype will usually be one of uncertain significance. Fibroblast
          import phenotyping is the assay with the most PEX5-specific precedent: scoring PTS1 and PTS2
          import separately, and scoring PTS1 import with more than one cargo, distinguishes the classic
          from the non-classic pattern and would separate a Zellweger-spectrum allele from an RCDP5-type
          isoform allele.'
      selected_evidence:
        snippet: Fibroblasts from 2-03 (S563W) were detected in both PTS1 and PTS2 imports despite the
          PEX5 defect, findings in contrast with fibroblasts from 2-05 (N489K) severely defective in PTS1
          import and those from 2-01 (R390X) severely defective in both PTS1 and PTS2.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/0
      context_paths:
