        context: []
      assertion_type: Prevalence
      assertion:
        population: Reported patients
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'PEX5 is one of the rarest causes of Zellweger spectrum disease. The complementation-group
          literature describes group 2 with a handful of patients, three of whom carry the characterised
          alleles cited in this entry, and a contemporary 14-patient Iranian peroxisomal series found
          one PEX5 patient against five with PEX1.

          No population estimate exists for PBD2B, and none should be constructed from those numbers:
          both are ascertainment series, not denominators, and neither separates the "A" from the "B"
          end. Zellweger spectrum disorder as a whole is the denominator a reader will want, and it is
          curated on that entry.'
      selected_evidence:
        snippet: PEX1 variants were detected in five patients. PEX2, PEX5, PEX6 and PEX7 variants were
          detected in three, one, one, and two cases, respectively.
        supports: SUPPORT
        directness: INDIRECT
