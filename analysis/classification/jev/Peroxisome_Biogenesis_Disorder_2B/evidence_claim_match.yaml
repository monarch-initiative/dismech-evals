      assertion_type: Pathophysiology
      assertion:
        name: Attenuated Peroxisomal Metabolic Block
        biological_scale: ORGANISM
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'Peroxisomes are essential for beta-oxidation of fatty acids, for ether-lipid (plasmalogen)
          synthesis and for redox homeostasis, so incompletely loaded peroxisomes produce a metabolic
          block across all of these. In the non-classic phenotypes that block is attenuated rather than
          complete, which is why the disease is degenerative over years instead of lethal in infancy.

          Marked PROVISIONAL for this entity specifically. The metabolic consequences of peroxisomal import
          failure are not in doubt, and they are curated in detail on the Zellweger Spectrum Disorders
          entry; what is not established here is the *quantitative* profile in a PEX5 non-classic patient.
          The cargo-selectivity result upstream predicts that the profile should be uneven - catalase
          and D-bifunctional protein import failing before acyl-CoA oxidase import does - and no one has
          measured that in a PBD2B patient.'
        biological_processes:
        - preferred_term: fatty acid beta-oxidation
          modifier: DECREASED
          term:
            id: GO:0006635
            label: fatty acid beta-oxidation
        - preferred_term: ether lipid biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0008611
            label: ether lipid biosynthetic process
      selected_evidence:
        snippet: Peroxisomes are single-membrane organelles essential for cell metabolism including the
          β-oxidation of fatty acids, synthesis of etherlipid plasmalogens, and redox homeostasis.
        supports: SUPPORT
        directness: INDIRECT
