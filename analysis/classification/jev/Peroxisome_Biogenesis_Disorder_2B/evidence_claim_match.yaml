        description: 'A property of the mild end of the peroxisome biogenesis disorders generally, recorded
          here because it is the clearest available demonstration that a non-classic phenotype reflects
          a conformationally marginal peroxin rather than a missing one: in cells from patients with mild
          phenotypes, peroxisomal biogenesis and metabolic function are restored by culturing at 30 degrees
          C.

          Marked PROVISIONAL, and the reason is specific rather than generic. The source states the phenomenon
          for PBD mild phenotypes as a class, and this knowledge base''s PEX1 entry carries the equivalent
          observation for the G843D allele directly. Nothing cited here shows temperature rescue in a
          PEX5 patient''s cells. The node is curated because it is the mechanistic basis on which "residual
          function" is claimed for non-classic alleles across this spectrum, and because it is a directly
          testable prediction for PBD2B fibroblasts, not because it has been tested in them.'
      selected_evidence:
        snippet: Temperature-sensitivity, whereby peroxisomal biogenesis and metabolic dysfunctions are
          restored at 30 degrees C in cells from mild phenotypes, is a useful event for predicting the
          clinical severity and for elucidation of peroxisome biogenesis.
