      assertion_type: Discussion
      assertion:
        discussion_id: pbd3a_internal_aug_reinitiation
        kind: INTERPRETATION
        attaches_to:
        - genetic#PEX12
        - pathophysiology#Biallelic PEX12 Loss of Function
        prompt: Why does a patient with two apparently severe PEX12 alleles present mildly?
        rationale: 'Genotype predicts phenotype well in complementation group 3 - less PEX12 function,
          worse disease - with one documented exception that turns out to be informative rather than noise.
          A compound heterozygote carrying two seemingly null alleles was mildly affected. The explanation
          was that the expressed allele, a 2-bp deletion eight codons into the reading frame, still produced
          a functional protein because translation reinitiated at a downstream AUG.

          The general lesson is that "predicted truncating" is a statement about the reading frame, not
          about the protein. An early frameshift can be rescued by internal initiation, so severity prediction
          from variant class alone will occasionally be wrong in the direction of over-calling severity.
          Curated here because this entry is defined by being the severe end of its locus, and the boundary
          between 3A and the milder presentations is exactly what such an allele blurs.'
      selected_evidence:
        snippet: this mutant PEX12 cDNA displayed significant PEX12 activity in a functional complementation
          assay
        supports: SUPPORT
