      assertion:
        name: Biallelic Null PEX6 Genotype
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: PEX6 is a 17-exon gene encoding an AAA-ATPase with two tandem AAA cassettes; pathogenic
          variants are scattered across all exons and the allelic series is wide. PBD4A is the subset
          of that series in which both alleles are null or severely truncating, so no functional peroxin-6
          is produced. This is the single variable that separates this entry from PBD4B at the identical
          locus, which is why the entry is curated on residual function rather than on gene identity.
        genes:
        - preferred_term: PEX6
          term:
            id: hgnc:8859
            label: PEX6
        genetic_context:
          genes:
          - preferred_term: PEX6
            term:
              id: hgnc:8859
              label: PEX6
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          complementation_group: '4'
          notes: Recorded as complete loss of function because it is the biallelic null or severely truncating
            genotypes, rather than PEX6 involvement as such, that define this entry against PBD4B. Compound
            heterozygosity for two severe alleles produces the same phenotype; HOMOZYGOUS is recorded
            as the commonest reported configuration in consanguineous pedigrees rather than as a requirement.
        molecular_functions:
        - preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          modifier: DECREASED
      selected_evidence:
        snippet: The encoded protein PEX6 belongs to the AAA ATPase family and contains two AAA cassettes
          and an AAA protein family signature.
        supports: SUPPORT
