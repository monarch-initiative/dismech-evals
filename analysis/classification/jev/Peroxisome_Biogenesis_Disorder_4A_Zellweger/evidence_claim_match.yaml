              label: peroxisome biogenesis disorder 4A (Zellweger)
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pbd4a_migration_defect_proximate_cause
        kind: KNOWLEDGE_GAP
        prompt: Is the neuronal migration defect in classic Zellweger syndrome driven by plasmalogen deficiency,
          by VLCFA accumulation, or by loss of a peroxisomal function not yet identified?
        attaches_to:
        - pathophysiology#Defective Neuronal Migration in the Developing Cortex
        rationale: The link from the import collapse to the cortical malformation is recorded as INDIRECT_UNKNOWN_INTERMEDIATES
          precisely because the intervening step is unknown, and the best experiment on the question makes
          the gap wider rather than narrower. Selectively restoring peroxisomes in the liver of Pex5 knockout
          mice corrected the neuronal migration defect without changing brain VLCFA, DHA or plasmalogen
          levels at all. So the migration defect is not a straightforward consequence of the brain's own
          lipid abnormality, and an extraneuronal - probably hepatic - contribution is doing part of the
          work. Assigning the responsible factor would change what a prenatal intervention would have
          to target and in which tissue, so the gap is mechanistically load-bearing rather than academic.
      selected_evidence:
        snippet: In liver-rescued mice, the improvement of the neuronal migration was not accompanied
          by changes in very long chain fatty acid, docosahexaenoic acid, or plasmalogen levels in brain,
          indicating that other metabolic factors can influence the neuronal migration process.
        supports: SUPPORT
