  c873e59803c2ad95a0fa8d2066eb299594d5cf8d2f91bf1532105825a13986e9:
    claim:
      about:
        disease:
          name: Peroxisome Biogenesis Disorder 4A (Zellweger)
          disease_term:
            preferred_term: peroxisome biogenesis disorder 4A (Zellweger)
            term:
              id: MONDO:0013930
              label: peroxisome biogenesis disorder 4A (Zellweger)
        context: []
      assertion_type: Genetic
      assertion:
        name: PEX6
        gene_term:
          preferred_term: PEX6
          term:
            id: hgnc:8859
            label: PEX6
        relationship_type: CAUSATIVE
        notes: 'The complementation group 4 (group C) gene, and the second most common cause of Zellweger
          spectrum disease after PEX1. The gene alone does not determine which end of the spectrum a patient
          sits at; the residual function left by the genotype does. Note that this locus also carries
          a documented exception to simple recessive transmission - the p.Arg860Trp allele can cause disease
          in the heterozygous state through allelic expression imbalance - but that mechanism produces
          milder disease and is curated on the PBD4B entry, not here.

          A PEX6-specific mechanism worth watching but not yet modelled as a node: recent work implicates
          dysregulated pexophagy - targeted autophagic degradation of peroxisomes - when the AAA-ATPase
          complex is disrupted. It is recorded here rather than as a pathophysiology node because no measurement
          in a PBD4A genotype was found, so a node would assert more than the evidence carries.'
      selected_evidence:
        snippet: Defects in the PEX6 gene are the second most common cause for ZSS disorders.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
