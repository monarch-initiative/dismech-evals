            term:
              id: MONDO:0013930
              label: peroxisome biogenesis disorder 4A (Zellweger)
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Collapse of Peroxisomal Matrix Protein Import
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: Without receptor recycling, PTS1- and PTS2-targeted matrix enzymes are not delivered.
          The peroxisomal membrane compartment is still assembled, because membrane protein import uses
          PEX19/PEX3 and is independent of the PEX5 cycle; what results is an empty organelle - the "peroxisomal
          ghost" seen in patient fibroblasts. This is the defining cellular lesion of a biogenesis disorder
          and the reason the biochemical phenotype is multi-pathway rather than single-enzyme.
        biological_processes:
        - preferred_term: protein import into peroxisome matrix
          term:
            id: GO:0016558
            label: protein import into peroxisome matrix
          modifier: DECREASED
        - preferred_term: peroxisome organization
          term:
            id: GO:0007031
            label: peroxisome organization
          modifier: DECREASED
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: Because of the defect in peroxisome formation, multiple metabolic (both catabolic and
          anabolic) pathways are impaired resulting in metabolic abnormalities.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26627182
      reference_title: 'Zellweger spectrum disorders: clinical overview and management approach.'
      evidence_source: HUMAN_CLINICAL
      explanation: States the central consequence of the import collapse - that the defect is at the level
        of the organelle and therefore hits many pathways at once.
