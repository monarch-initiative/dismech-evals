          with heterotopia - is a prenatal neuronal migration defect. It is the single most consequential
          node in this entry for prognosis, because it is fixed at birth: no post-natal intervention can
          undo it, which is why no therapy in the treatments section - cholic acid included - changes
          the neurological outcome. It is also the node that most cleanly separates PBD4A from PBD4B,
          where congenital malformations are absent and the neurological course is degenerative rather
          than developmental.'
        biological_processes:
        - preferred_term: cerebral cortex cell migration
          term:
