      assertion_type: Pathophysiology
      assertion:
        name: Receptor Export Module Failure
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: The PEX1-PEX6 heterohexamer is the ATP-driven motor that extracts monoubiquitinated
          PEX5 from the peroxisomal membrane by processive threading and unfolding, returning it to the
          cytosol for reuse. Because PEX1 and PEX6 are obligate partners, a PEX6 null and a PEX1 null
          converge on the same rate-limiting step - which is why PBD4A and PBD1A are phenotypically indistinguishable
          at the bedside despite different genes.
        cellular_components:
        - preferred_term: peroxisomal membrane
          term:
            id: GO:0005778
            label: peroxisomal membrane
        molecular_functions:
        - preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          modifier: DECREASED
      selected_evidence:
        snippet: PEX1 and PEX6 are two members of the ATPases associated with diverse cellular activities
          (AAA) family and the core components of the receptor export module of the peroxisomal matrix
          protein import machinery.
        supports: SUPPORT
