        - path: /animal_models/0
          value:
            name: Pex5 knockout mouse with tissue-selective peroxisome reconstitution
            species: Mouse
            genotype: Pex5 knockout, with Pex5p re-expressed selectively in brain or in liver
            publication: PMID:14586000
            description: Not a PEX6 model, and cited here for what it rules out rather than what it reproduces.
              Peroxisomes were restored selectively in either brain or liver of Pex5 knockout mice, a
              model of Zellweger syndrome, to ask which tissue's peroxisomal metabolism the cortical migration
              defect depends on. Both single rescues partly corrected migration; rescuing both gave a
              migration pattern indistinguishable from wild-type.
          role: ancestor
        - path: /animal_models/0/modeled_mechanisms/0
          value:
            target: Defective Neuronal Migration in the Developing Cortex
            relationship: RECAPITULATES
            fidelity: MODERATE
            description: The knockout reproduces the migration defect, and the tissue-selective rescues
              make it experimentally addressable rather than merely observed.
            limitations: The disrupted gene is PEX5, the receptor itself, not PEX6, the ATPase that recycles
              it. Both lesions abolish matrix import, so the downstream phenotype is shared, but nothing
              PEX6-specific is modelled. The mouse also does not address the severity split that defines
              PBD4A against PBD4B, since it is a null rather than a hypomorph.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Brain VLCFA, DHA and plasmalogen after liver-selective rescue
        target: Defective Neuronal Migration in the Developing Cortex
        direction: UNCHANGED
        interpretation: The negative readout, and the load-bearing one. Migration improved while the three
          lipid species usually invoked to explain it did not move, so the migration defect is not a straightforward
          consequence of the brain's own lipid abnormality.
      selected_evidence:
        snippet: In liver-rescued mice, the improvement of the neuronal migration was not accompanied
          by changes in very long chain fatty acid, docosahexaenoic acid, or plasmalogen levels in brain,
          indicating that other metabolic factors can influence the neuronal migration process.
        supports: SUPPORT
