            label: neuron migration
          modifier: DECREASED
      selected_evidence:
        snippet: Neuropathological changes include abnormal neuronal migration affecting the cerebral
          hemispheres, cerebellum and inferior olivary complex, abnormal Purkinje cell arborisation, demyelination
          and post-developmental neuronal degeneration.
        supports: SUPPORT
