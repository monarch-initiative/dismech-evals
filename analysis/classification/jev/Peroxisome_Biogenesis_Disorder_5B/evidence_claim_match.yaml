          Patient Monitoring and NCIT:C61256 Monitoring; asking the local NCIT build for each one's is-a
          ancestors returns no NCIT:C25218 among them, so none is a legal value for this slot. NCIT:C15419
          Disease Screening is reachable from that root and is what this repository uses for screening
          treatments elsewhere, but it names screening an unselected population for an undiagnosed disease,
