        description: 'The organ-level consequences the peroxisomal lesion produces outside the nervous
          system - liver disease, adrenal insufficiency, renal oxalate stones, enamel and bone involvement.
          This node is curated at spectrum level rather than at PEX2 level, and the distinction is deliberate:
          the liver, adrenal, renal, enamel and bone features are not reported in a PEX2 mild-band patient
          in any source cited here, and the reason they belong in this entry is that GeneReviews describes
          them for the intermediate and milder band and builds its surveillance schedule around them.
          The sensory losses are different - hypoacusia and early retinopathy were both observed in the
          Italian PEX2 adult - so for those two downstream targets the node records an observed phenotype.
          For the rest, a reader should treat it as the expected organ set to watch for.'
      selected_evidence:
        snippet: Individuals with intermediate/milder ZSD do not have congenital malformations, but rather
          progressive peroxisome dysfunction variably manifest as sensory loss (secondary to retinal dystrophy
          and sensorineural hearing loss), neurologic involvement (ataxia, polyneuropathy, and leukodystrophy),
          liver dysfunction, adrenal insufficiency, and renal oxalate stones.
        supports: SUPPORT
