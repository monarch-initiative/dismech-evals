            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Biallelic PEX2 variants, and specifically genotypes leaving residual peroxin-2 function
          on at least one allele. The reported mild-band patients are either homozygous for a C-terminal
          frameshift that spares most of the protein, or compound heterozygous for a residual-function
          missense allele opposite a null allele that is itself known from classic Zellweger syndrome.
      selected_evidence:
        snippet: No mutation was found in P1 and P2 asymptomatic siblings, who had normal peroxisomal
          parameters in plasma and no neurologic symptoms.
        supports: SUPPORT
