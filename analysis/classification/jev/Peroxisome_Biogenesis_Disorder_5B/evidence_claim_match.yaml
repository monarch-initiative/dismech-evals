              id: MONDO:0013933
              label: peroxisome biogenesis disorder 5B
        context: []
      assertion_type: Treatment
      assertion:
        name: Dietary phytanic acid restriction
        description: 'Restriction of dietary phytanic acid, on the reasoning that phytanic acid is exclusively
          of dietary origin and is one of the two branched-chain species that accumulate in this entry.
          The Zellweger spectrum management literature does not recommend it generally: it is reserved
          for extremely high phytanic acid levels and is explicitly advised against when levels are only
          moderately raised, because maintaining caloric intake matters more. The PEX2 patients cited
          here are reported only as having increased branched-chain fatty acids, with no statement that
          phytanic acid reaches the extreme level at which the review indicates restriction, and no outcome
          of this intervention is reported in any of them. For this entry it is therefore a conditional
          option rather than a therapy of demonstrated benefit.'
        treatment_term:
          preferred_term: Dietary Intervention
          term:
            id: NCIT:C15447
            label: Dietary Intervention
        therapeutic_modality: BEHAVIORAL
      selected_evidence:
        snippet: A phytanic acid restricted diet is only necessary when levels of phytanic acid are extremely
          high and is not recommended when levels are moderately increased
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /treatments/3
