      assertion_type: ProgressionInfo
      assertion:
        phase: Childhood or adolescent onset, slow progression, survival to middle age
        notes: The prognostic fact that separates this entry from peroxisome biogenesis disorder 5A, where
          infants typically die in the first year. In the ataxic form first symptoms appear between about
          two and a half and eighteen years, progression is slow, and the oldest reported patient was
          ambulant and independent at fifty-one. That trajectory is drawn from three patients in two families
          and should be read as the reported experience, not as a prognosis that can be quoted to a family.
      selected_evidence:
        snippet: The patient, born at term with normal birth weight and Apgar scores, developed normally
          until 3 years of age, when unsteady walking and frequent falls were noticed.
        supports: SUPPORT
