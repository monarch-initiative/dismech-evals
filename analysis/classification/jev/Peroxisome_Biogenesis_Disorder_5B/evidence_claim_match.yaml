      assertion:
        name: Zellweger spectrum disorders of other complementation groups
        description: The other twelve ZSD-PEX genes produce overlapping phenotypes across the same severity
          range, and mild bands with cerebellar ataxia are described at PEX10, PEX12 and PEX16 as well
          as here. The distinction is molecular and does not change management.
        distinguishing_features:
        - Different causal PEX gene on sequencing
        - Clinically and biochemically overlapping at the same point on the severity range
        - PEX16 mild disease additionally reported with spastic paraparesis, leukodystrophy and cataract
      selected_evidence:
        snippet: However, these patients displayed additional neurological symptoms including axonal motor
          neuropathy and decreased vibration sense in PEX10- mutated patients and spastic paraparesia,
          leukodystrophy peripheral neuropathy and cataracts in patients with PEX16 mutation.
        supports: SUPPORT
