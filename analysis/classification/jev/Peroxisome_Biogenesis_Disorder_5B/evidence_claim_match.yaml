        context: []
      assertion_type: Subtype
      assertion:
        name: NALD-IRD
        display_name: Neonatal adrenoleukodystrophy / infantile Refsum disease presentation
        description: 'The older phenotype labels for the intermediate and mild bands of the Zellweger
          spectrum: progressive peroxisomal failure with sensory loss, liver disease and developmental
          delay, without the congenital malformations of classic Zellweger syndrome. At the PEX2 locus
          this presentation rests on individually reported patients - the infantile Refsum disease patient
          carrying E55K opposite a nonsense allele, and the mildly affected homozygous W223X patient in
          the four-patient complementation group 10 series - rather than on any assembled cohort.'
        genes:
        - preferred_term: PEX2
          term:
            id: hgnc:9717
            label: PEX2
      selected_evidence:
        snippet: We identified a mutation in the PEX2 gene in an IRD patient with compound heterozygosity
          for a missense mutation and the known nonsense mutation detected in ZS patients.
        supports: SUPPORT
