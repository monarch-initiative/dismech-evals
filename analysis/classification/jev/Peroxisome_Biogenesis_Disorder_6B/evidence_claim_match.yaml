          eight years of age, progression is slow, and affected individuals reach adulthood - the founding
          report describes an adult patient, and an independent family contributed three adults.
      selected_evidence:
        snippet: A literature search yielded 14 similar patients from nine families with PEX10-related
          cerebellar ataxia, most of them presenting their first symptoms between 3 and 8 years of age.
        supports: SUPPORT
