          March 2015 as adjunctive treatment - and the reported benefit is hepatic: improved liver chemistries
          and reduced toxic bile acid intermediates. Two limits belong on that claim. The evidence is
          spectrum-wide rather than PEX10-specific, and in the founding PEX10 ataxia report the drug was
          started alongside dietary phytanic acid restriction with no outcome reported, so nothing here
          says it alters the cerebellar disease that defines this band.'
