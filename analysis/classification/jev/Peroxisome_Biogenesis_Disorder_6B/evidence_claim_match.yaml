        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: normal_biochemistry_at_the_mild_end
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Partial Failure of Peroxisomal Matrix Protein Import
        - biochemical#Very-long-chain fatty acid ratios
        prompt: How often is every standard peroxisomal test - plasma very-long-chain fatty acids and
          cultured-fibroblast assays - normal in a patient who nevertheless has biallelic PEX10 variants
          and disease?
        rationale: 'Two independent observations say the standard screen can be silent at this end of
          the allelic series: the absolute very-long-chain fatty acid concentration is normal in several
          of the reported ataxic patients, and one PEX10 patient with clearly abnormal blood metabolites
          had normal results across multiple peroxisomal pathways in cultured fibroblasts. Neither observation
          comes with a denominator for false negatives, because both come from patients who were eventually
          diagnosed. Nobody has counted the patients in whom the screen was normal and the diagnosis was
          therefore never made, so the true sensitivity of a peroxisomal screen in unexplained recessive
          ataxia is unknown. That is the number a clinician deciding whether to sequence needs.'
      selected_evidence:
        snippet: Despite the abnormal metabolites detected in blood (phytanate, bile acid intermediates
          and pipecolate), analysis of multiple peroxisomal pathways in fibroblasts yielded normal results.
        supports: SUPPORT
