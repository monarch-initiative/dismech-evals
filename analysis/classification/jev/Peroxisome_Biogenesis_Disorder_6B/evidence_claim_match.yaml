        mechanism_confidence: ESTABLISHED
        description: Both PEX10 alleles carry variants, but at least one retains partial peroxin-10 function.
          In the reported ataxic patients these are missense changes, several of them in or adjacent to
          the C-terminal RING finger, carried opposite a second allele that may itself be severe. The
          residual-function threshold, not gene identity, is what separates this entry from PBD6A.
        genetic_context:
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: COMPOUND_HETEROZYGOUS
          gene:
            preferred_term: PEX10
            term:
              id: hgnc:8851
              label: PEX10
          description: Missense alleles predominate. Homozygous missense genotypes are also reported at
            the mild end, so COMPOUND_HETEROZYGOUS records the commoner reported configuration rather
            than a requirement.
        cellular_components:
        - preferred_term: peroxisomal membrane
          term:
            id: GO:0005778
            label: peroxisomal membrane
      selected_evidence:
        snippet: These results support the hypothesis that severe, loss-of-function mutations in PEX genes
          cause more severe clinical phenotypes, whereas mildly affected PBD patients have PEX gene mutations
          that retain residual function.
        supports: SUPPORT
