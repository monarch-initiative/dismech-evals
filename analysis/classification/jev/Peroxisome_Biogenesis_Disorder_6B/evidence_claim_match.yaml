            term:
              id: MONDO:0013937
              label: peroxisome biogenesis disorder 6B
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: where_the_ataxic_form_belongs
        kind: CONTROVERSY
        attaches_to:
        - disease#
        - has_subtypes#Ataxic form
        prompt: Is the PEX10 ataxic form part of peroxisome biogenesis disorder 6B, or a third band distinct
          from both 6A and the neonatal adrenoleukodystrophy presentation?
        rationale: 'The literature says both things. One group describes PEX10 as causing three subtypes
          - Zellweger syndrome, neonatal adrenoleukodystrophy and an ataxic form - which reads as a third
          band alongside, not inside, the 6B concept; the existing dismech entry for peroxisome biogenesis
          disorder 6A follows that reading and carries the ataxic form as a differential diagnosis. Against
          that, a published ataxic patient is labelled peroxisome biogenesis disorder 6B by the authors
          reporting him, and the OMIM concept that MONDO:0013937 maps to covers the milder PEX10 phenotypes
          generally. This entry takes the second reading, because the A/B pair is a severity split with
          only two members and an ataxic form that sat outside both would have no ontology class to live
          in. The consequence is recorded rather than hidden: the ataxic form is curated here as a subtype,
          and the peroxisome biogenesis disorder 6A entry''s differential row describing it now overlaps
          this entry.'
      selected_evidence:
        snippet: the mutation of this gene causes 3 subtypes of peroxisome biogenesis disorders, namely
          Zellweger syndrome (severe), neonatal adrenoleukodystrophy (moderate) and an ataxic form (mild)
        supports: SUPPORT
