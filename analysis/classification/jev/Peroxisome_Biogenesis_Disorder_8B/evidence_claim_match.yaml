        description: The whole-organism metabolic consequence, and it is attenuated to the point of being
          unreliable as a diagnostic signal. Plasma analysis in the founding cohort showed abnormalities
          suggesting a peroxisomal disorder, but biochemical variables in the same patients' fibroblasts
          were only mildly abnormal or within the normal range. A later kindred had only subtle elevations
          of C26 and the C26/C22 ratio, and the whole-genome-sequencing patient had frankly normal plasma
          very-long-chain fatty acids. The specific peroxisomal functions curated on the Zellweger Spectrum
          Disorders entry - beta-oxidation of very-long-chain fatty acids and ether-lipid synthesis -
          are the ones at issue, and the point here is the degree of block rather than a different set
          of pathways.
        biological_processes:
