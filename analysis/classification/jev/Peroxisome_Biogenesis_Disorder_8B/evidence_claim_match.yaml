              label: peroxisome biogenesis disorder 8B
        context: []
      assertion_type: Genetic
      assertion:
        name: PEX16
        gene_term:
          preferred_term: PEX16
          term:
            id: hgnc:8857
            label: PEX16
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Biallelic pathogenic or likely pathogenic variants
        notes: 'PEX16 (HGNC:8857, OMIM 603360) is at 11p11.2 and encodes a 336-amino-acid integral peroxisomal
          membrane peroxin, Pex16p. Reported PBD8B genotypes are private and scattered: five novel apparent
          homozygous mutations across the six founding patients, a homozygous c.859C>T in a consanguineous
          kindred, compound heterozygous c.658G>A p.(Ala220Thr) and c.830G>A p.(Arg277Gln) in a whole-genome-sequencing
          patient, and four further novel alleles in the case series. No recurrent founder allele is described,
          and no genotype-phenotype rule is asserted here - the humanised Drosophila work grades alleles
          by rescue rather than by clinical prediction. The severe-end allele that anchors the contrast
          is the nonsense R176X of the original complementation group D patient.'
      selected_evidence:
        snippet: These results demonstrate that mutation in PEX16 is the genetic cause of CG-D PBDs.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
