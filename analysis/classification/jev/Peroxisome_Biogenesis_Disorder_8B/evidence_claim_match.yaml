      assertion_type: DifferentialDiagnosis
      assertion:
        name: Peroxisome biogenesis disorder 8A (classic PEX16 Zellweger syndrome)
        description: The same gene at the severe pole. PBD8A presents in the newborn period with the full
          Zellweger picture and has no peroxisomal remnants in fibroblasts and no detectable PEX16 protein
          on immunoblot. It has no entry in this knowledge base yet.
        distinguishing_features:
        - Severity and age of onset - PBD8A presents as neonatal Zellweger syndrome, PBD8B in the preschool
          years with spastic paraparesis and ataxia.
        - Cellular phenotype is the discriminator that actually works - total absence of peroxisomal remnants
          in PBD8A against enlarged, import-competent peroxisomes in PBD8B.
        - Residual PEX16 protein is detectable on immunoblot in the atypical presentation and absent in
          the severe one.
      selected_evidence:
        snippet: We demonstrated residual PEX16 protein amounts by immunoblotting in fibroblasts available
          from 5 patients with this atypical PEX16 disease (3 from this series, 2 previously reported),
          in contrast to the absence of PEX16 protein in fibroblasts from a patient with the severe ZSD
          presentation.
        supports: SUPPORT
        directness: DIRECT
