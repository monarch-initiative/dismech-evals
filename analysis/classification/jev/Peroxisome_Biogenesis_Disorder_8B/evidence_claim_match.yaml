      assertion_type: Pathophysiology
      assertion:
        name: Reduced Peroxisome Number with Compensatory Enlargement
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: ESTABLISHED
        description: The cellular signature of PBD8B, and the finding that makes it hard to diagnose.
          Fibroblasts from the founding cohort contained peroxisomes that were import-competent and increased
