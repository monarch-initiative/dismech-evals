              label: peroxisome biogenesis disorder 8B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Partially Preserved Peroxisomal Membrane Assembly
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'PEX16 is an integral peroxisomal membrane protein that functions in membrane assembly,
          upstream of Pex3p, and is required for peroxisome formation in the absence of a pre-existing
          peroxisome: the cell line in which PEX16 was identified could not import peroxisomal membrane
          proteins at all, and expressing PEX16 restored the formation of new peroxisomes. In current
          models, PEX16 arrives on endoplasmic-reticulum-derived vesicles that fuse with Pex3- and Pex14-bearing
          pre-peroxisomal structures to confer full import competence. This is the step PBD8B leaves partly
          intact and classic PEX16 disease does not, and it is why the lesion here is upstream of the
          matrix import machinery affected in PBD1B, PBD2B and PBD4B.'
        biological_processes:
        - preferred_term: peroxisome membrane biogenesis
          term:
            id: GO:0016557
            label: peroxisome membrane biogenesis
          modifier: DECREASED
        - preferred_term: protein import into peroxisome membrane
          term:
            id: GO:0045046
            label: protein import into peroxisome membrane
          modifier: DECREASED
      selected_evidence:
        snippet: we report here a Zellweger syndrome patient (PBD061) with an unusual cellular phenotype,
          an inability to import peroxisomal membrane proteins. We also identified human PEX16, a novel
          integral peroxisomal membrane protein, and found that PBD061 had inactivating mutations in the
          PEX16 gene.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9922452
      reference_title: Peroxisome synthesis in the absence of preexisting peroxisomes.
      evidence_source: IN_VITRO
      explanation: 'Establishes that PEX16 acts on peroxisomal membrane protein import rather than matrix
        import. Indirect: the cell line carries inactivating mutations, so it defines the complete-loss
        pole against which the partial preservation in PBD8B is described.'
