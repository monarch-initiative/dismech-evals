        notes: The cellular assay that actually identifies this entity, and the one whose result is counterintuitive.
          Immunofluorescence for a peroxisomal marker shows peroxisomes that are import-competent, larger,
          and fewer - not absent as in severe PEX16 disease, and not import-incompetent as in the matrix
          import disorders. Reported with PEX14 and with catalase/PMP70 as markers, and quantified as
          density and size by automated image analysis in one study. A laboratory scoring only matrix
          protein import can therefore call these cells normal.
