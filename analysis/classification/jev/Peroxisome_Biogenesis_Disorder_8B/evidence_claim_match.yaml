      assertion:
        name: Reduced Peroxisomal Catalase Activity
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'Catalase activity was lower in patient-derived neural stem cells than in controls,
          and the reporting authors attribute it to the reduced peroxisome number rather than to a separate
          lesion. The oxidative-stress consequence did not follow: challenged with hydrogen peroxide,
          patient cells showed lower rather than higher signal on an oxidative-stress indicator, which
          the authors read as compensation by non-catalase peroxide-metabolising enzymes. Marked PROVISIONAL
          deliberately. It rests on one patient cell line; the authors themselves note that total cellular
          catalase deficiency does not prove peroxisomal catalase was mistargeted, and that particulate
          catalase was not measured. No link from this node to the white-matter phenotype has been demonstrated
          in PEX16 disease, and none is asserted below beyond a PROVISIONAL edge.'
        molecular_functions:
        - preferred_term: catalase activity
          term:
            id: GO:0004096
            label: catalase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: hydrogen peroxide catabolic process
          term:
            id: GO:0042744
            label: hydrogen peroxide catabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: Along with alterations in peroxisome morphology, patient cells also had impaired peroxisome
          function with reduced catalase activity.
        supports: SUPPORT
        directness: DIRECT
