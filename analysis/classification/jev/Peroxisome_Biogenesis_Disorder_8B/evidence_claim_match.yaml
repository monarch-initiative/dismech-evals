            label: peroxisome biogenesis disorder
        description: The non-classic ends of the other PEX genes - PEX1 (PBD1B), PEX5 (PBD2B), PEX6 (PBD4B)
          and others - share the biochemical screen and are distinguished only by sequencing. The PEX16
          presentation is nonetheless atypical for the group, and the differences are usable at the bedside.
        distinguishing_features:
        - Sensory loss from retinal dystrophy and sensorineural hearing loss, and amelogenesis imperfecta
          in the secondary teeth, are characteristic of intermediate/milder ZSD generally but were absent
          in all seven patients of the PEX16 case series.
        - Cognition is often preserved in PEX16 disease and survival is prolonged, where hypotonia and
          developmental delay are the typical ZSD picture.
        - The cellular lesion is membrane assembly rather than matrix protein import, so an import-scored
          fibroblast assay may read normal in PEX16 disease and abnormal in the others.
