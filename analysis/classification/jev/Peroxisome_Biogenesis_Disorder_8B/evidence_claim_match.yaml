      assertion_type: Discussion
      assertion:
        discussion_id: pex16_catalase_to_white_matter_link
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does reduced peroxisomal catalase activity contribute to the white-matter lesion in PEX16
          disease, or is the metabolic block the whole story?
        attaches_to:
        - pathophysiology#Reduced Peroxisomal Catalase Activity
        - pathophysiology#Progressive Central White Matter and Long Tract Degeneration
        rationale: 'The edge between these two nodes is the weakest in this entry and is marked PROVISIONAL
          for a reason. Catalase activity is reduced in one patient cell line, but the expected oxidative-stress
          consequence did not appear: on hydrogen peroxide challenge the patient cells showed less signal
          on an oxidative-stress indicator, not more, which the reporting authors attribute to compensation
          by other peroxide-metabolising enzymes. The measurement was also whole-cell rather than particulate,
          so it does not establish that peroxisomal catalase specifically was lost. Until the question
          is settled, the white-matter lesion in this entry should be read as following from the attenuated
          metabolic block, with the catalase branch an open possibility rather than a second established
          route.'
        proposed_experiments:
        - experiment_id: pex16_particulate_catalase
          name: Particulate versus cytosolic catalase in PEX16 patient cells
          description: Fractionate patient and control cells and measure catalase activity in the peroxisomal
            versus the cytosolic fraction, in several genetically confirmed PEX16 lines, to establish
            whether catalase is mislocalised or simply reduced in proportion to peroxisome number.
          would_support:
          - pathophysiology#Reduced Peroxisomal Catalase Activity
        - experiment_id: pex16_oligodendrocyte_model
          name: Redox and lipid phenotype in a PEX16 oligodendrocyte model
          description: Differentiate patient-derived induced pluripotent stem cells to oligodendrocytes
            and measure peroxisome number, catalase activity, peroxide handling, and myelin lipid composition,
            to test whether the cell type that fails in vivo shows the redox phenotype that fibroblasts
            and neural stem cells do not.
          would_support:
          - pathophysiology#Progressive Central White Matter and Long Tract Degeneration
      selected_evidence:
        snippet: Furthermore, patient cells had reduced oxidative stress levels after exposure to hydrogen-peroxide
          (H2O2), which may be a result of compensation by H2O2 metabolising enzymes other than catalase
          to preserve peroxisome-related cell functions.
        supports: SUPPORT
        directness: DIRECT
