        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pex16_enlarged_peroxisome_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do the peroxisomes that survive a partial PEX16 defect become enlarged rather than
          simply fewer?
        attaches_to:
        - pathophysiology#Reduced Peroxisome Number with Compensatory Enlargement
        rationale: 'Reduced number and increased size have now been observed together in three independent
          patient materials - fibroblasts from six founding patients, olfactory-neurosphere neural stem
          cells from an unrelated patient, and fibroblasts from a consanguineous kindred - so the morphology
          is reproducible. No mechanism for the enlargement has been established. The obvious candidate,
          a shift in the balance between PEX11-mediated division of existing peroxisomes and PEX16-dependent
          de novo formation, has not been tested in PBD8B cells. The authors who quantified the morphology
          state explicitly that the mechanism is unclear. This matters beyond curiosity: whether the enlarged
          organelles are functionally adequate per unit membrane determines whether the cellular deficit
          is one of total peroxisomal capacity or of peroxisome distribution.'
        proposed_experiments:
        - experiment_id: pex16_division_vs_de_novo
          name: Separate division from de novo formation in PBD8B cells
          description: In patient-derived cells carrying hypomorphic PEX16 alleles, measure peroxisome
            fission and de novo formation independently - PEX11-beta knockdown and rescue, and pulse labelling
            of newly formed peroxisomes - to determine whether the enlargement reflects impaired division
            of a reduced founder population or an altered division-to-formation balance.
          would_support:
          - pathophysiology#Reduced Peroxisome Number with Compensatory Enlargement
        - experiment_id: pex16_per_peroxisome_capacity
          name: Metabolic capacity per unit peroxisome membrane
          description: Normalise beta-oxidation flux and plasmalogen synthesis to total peroxisomal membrane
            area rather than to cell number in patient and control cells, to test whether the enlarged
            peroxisomes are functionally equivalent to a larger number of normal ones.
          would_support:
          - pathophysiology#Attenuated Peroxisomal Metabolic Block
      selected_evidence:
        snippet: as well as putative novel features observed in this study including reduced catalase
          activity, is currently unclear
        supports: SUPPORT
        directness: DIRECT
