      assertion_type: Pathophysiology
      assertion:
        name: Hypomorphic PEX16 Variants with Residual Peroxin Function
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'The initiating lesion, and the point at which PBD8B separates from classic PEX16
          Zellweger syndrome. PEX16 mutations define complementation group D of the peroxisome biogenesis
          disorders, established by the observation that expressing wild-type PEX16 restores peroxisome
          biogenesis in CG-D fibroblasts and in no other group. What distinguishes the non-classic end
          is that the variant protein survives: residual PEX16 is detectable by immunoblot in fibroblasts
          from atypical patients and is absent in a patient with the severe presentation. The allele series
          has been tested directly in a humanised Drosophila model, where alleles from mild disease partially
          rescued a Pex16 null and alleles from atypical ataxia rescued it fully - a graded residual function
          that is specific to the allele rather than an all-or-nothing loss.'
        genes:
        - preferred_term: PEX16
          term:
            id: hgnc:8857
            label: PEX16
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
      selected_evidence:
        snippet: HsPEX16 expression morphologically and biochemically restored peroxisome biogenesis only
          in fibroblasts from a CG-D patient with ZS in Japan
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9837814
      reference_title: Mutation in PEX16 is causal in the peroxisome-deficient Zellweger syndrome of complementation
