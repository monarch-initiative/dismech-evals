        description: Unlike classic Zellweger-spectrum disease, PBD8B is usually reached by sequencing
          rather than by biochemistry. Of the four clinical reports behind this entry, one identified
          the gene only after sequencing all known PEX genes, one by whole-exome sequencing, and one by
          whole-genome sequencing in a patient whose plasma very-long-chain fatty acids were normal and
          who had already had targeted hereditary-spastic-paraplegia and leukodystrophy genes excluded.
          The practical rule is that PEX16 should be on the gene list for unexplained childhood-onset
          spastic ataxia with leukodystrophy, whatever the peroxisomal biochemistry shows.
      selected_evidence:
        snippet: This paper highlights the diagnostic challenge of PEX16 patients due to the widely variable
          clinical and biochemical phenotypes.
        supports: SUPPORT
