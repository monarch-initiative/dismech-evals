      assertion:
        name: 46,XX gonadal dysgenesis
        disease_term:
          preferred_term: 46,XX gonadal dysgenesis
          term:
            id: MONDO:0009299
            label: 46 XX gonadal dysgenesis
        description: The closest ovarian-side boundary and the most important one to draw correctly. Both
          present with hypergonadotropic ovarian failure in a 46,XX individual, and the dismech entry
          for 46,XX gonadal dysgenesis already lists Perrault syndrome as a differential; the two entries
          are deliberately kept separate rather than merged.
        distinguishing_features:
        - Sensorineural hearing loss is required for Perrault syndrome and is absent in isolated 46,XX
          gonadal dysgenesis.
        - 46,XX gonadal dysgenesis is confined to the gonad; Perrault syndrome is a multisystem mitochondrial
          disorder that may add ataxia, neuropathy, renal or muscular disease.
        - The numbered ovarian-dysgenesis gene series is distinct from the Perrault gene set, and NR5A1-related
          disease belongs with neither.
        - Male relatives are unaffected in 46,XX gonadal dysgenesis but have hearing loss in Perrault
          syndrome, so a deaf brother is a strong pointer to Perrault syndrome.
      selected_evidence:
        snippet: Perrault syndrome is inherited as an autosomal recessive disorder characterized by bilateral
          mild to severe childhood sensorineural hearing loss with variable age of onset in both sexes
          and ovarian dysfunction in females who have a 46, XX karyotype.
