      assertion:
        name: Combined Oxidative Phosphorylation Deficiency and Bioenergetic Stress
        biological_scale: CELLULAR
        role: central_effector
        description: The convergence point of the mitochondrial arms. Reduced synthesis, maturation or
          quality control of mtDNA-encoded subunits produces a combined respiratory chain deficiency,
          most consistently affecting complexes I and IV, with reduced cellular respiration, elevated
          reactive oxygen species and proteostatic stress. Cell types with high and sustained oxidative
          demand and little regenerative capacity — cochlear hair cells, oocytes and long peripheral and
          cerebellar neurons — are selectively vulnerable, which is why a defect in a ubiquitously expressed
          housekeeping gene produces an organ-selective syndrome.
        biological_processes:
        - preferred_term: oxidative phosphorylation
