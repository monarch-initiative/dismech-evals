      assertion:
        name: Turner syndrome
        disease_term:
          preferred_term: Turner syndrome
          term:
            id: MONDO:0019499
            label: Turner syndrome
        description: The commonest cause of hypergonadotropic ovarian failure and a genuine mimic, because
          a majority of adults with Turner syndrome also develop progressive high-tone sensorineural hearing
          loss, reproducing both cardinal Perrault features in one individual.
        distinguishing_features:
        - Karyotype is 45,X or a structural X abnormality, not 46,XX; karyotype or chromosomal microarray
          settles the distinction.
        - Short stature, lymphoedema, webbed neck, coarctation and bicuspid aortic valve are Turner features
          not seen in Perrault syndrome.
        - Turner syndrome is a chromosomal disorder and is generally sporadic; Perrault syndrome is autosomal
          recessive with a 25 per cent sibling recurrence risk.
        - Male relatives cannot be affected in Turner syndrome, whereas Perrault syndrome affects 46,XY
          relatives with hearing loss.
      selected_evidence:
        snippet: Perrault syndrome is a genetically and clinically diverse autosomal recessive disorder
          characterized by sensorineural hearing loss in both sexes and primary ovarian insufficiency
          in females.
