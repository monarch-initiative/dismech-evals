        context: []
      assertion_type: Phenotype
      assertion:
        category: Reproductive
        name: Male Infertility
        description: Male reproductive impairment, including azoospermia and undervirilisation, is occasionally
          reported and is under-ascertained because affected 46,XY individuals are rarely investigated
          for it. Model-organism data are strongest for CLPP, where null mice show meiotic arrest and
          azoospermia. In contrast to the female phenotype, most 46,XY individuals with a Perrault genotype
          are fertile.
        phenotype_term:
          preferred_term: Male infertility
          term:
            id: HP:0003251
            label: Male infertility
        notes: Male infertility is a real but genotype-restricted and uncommon finding. A human CLPP case
          documents non-obstructive azoospermia, while CLPP-null mouse data provide mechanistic evidence
          for meiotic arrest. Do not generalise male infertility to Perrault syndrome as a whole.
      selected_evidence:
        snippet: Non-obstructive azoospermia (NOS, the complete absence of sperm from the ejaculate, due
          to a failure in spermatogenesis, leading to complete infertility) was observed so far in one
          of the few male individuals with a biallelic missense mutation in the gene encoding the mitochondrial
          matrix peptidase CLPP
        supports: SUPPORT
