            label: autoimmune polyendocrine syndrome type 1
        description: The principal autoimmune cause of premature ovarian insufficiency, caused by biallelic
          AIRE variants. Like Perrault syndrome it is recessive and multisystem, so it is not excluded
          by inheritance pattern alone.
        distinguishing_features:
        - Chronic mucocutaneous candidiasis and hypoparathyroidism with adrenal insufficiency form the
          defining triad; none occurs in Perrault syndrome.
        - Ovarian failure is autoimmune, with detectable steroid-cell and 21-hydroxylase autoantibodies,
          rather than a primary germ-cell energetic defect.
        - Sensorineural hearing loss is not a feature.
      selected_evidence:
        snippet: Here we describe a patient with POI, sensorineural hearing loss and Hashimoto's disease.
          The co-occurrence of POI with sensorineural hearing loss indicates Perrault syndrome.
        supports: SUPPORT
