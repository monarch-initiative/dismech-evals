          term:
            id: UBERON:0000992
            label: ovary
        biological_processes:
        - preferred_term: ovarian follicle development
          term:
            id: GO:0001541
            label: ovarian follicle development
          modifier: DECREASED
        - preferred_term: oocyte development
          term:
            id: GO:0048599
            label: oocyte development
          modifier: DECREASED
