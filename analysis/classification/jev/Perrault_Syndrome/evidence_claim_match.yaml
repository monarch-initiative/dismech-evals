        name: Ovarian Germ Cell Depletion and Follicular Failure
        biological_scale: CELLULAR
        role: effector
        description: 'Oogonia, oocytes and their granulosa support cells fail to survive or to sustain
          folliculogenesis. The severity of the germ cell deficit sets the clinical severity: near-complete
          prenatal or early postnatal germ cell loss yields streak or absent ovaries and primary amenorrhoea,
          whereas partial depletion leaves a reduced follicle pool that is exhausted prematurely and presents
          as secondary amenorrhoea after normal menarche. Because the human follicle pool is fixed before
          birth and not renewed, the loss is irreversible. Cross-species data support the requirement:
          RNAi knockdown of the C. elegans ERAL1 orthologue almost abolishes egg production.'
        cell_types:
        - preferred_term: oocyte
          term:
            id: CL:0000023
            label: oocyte
        - preferred_term: granulosa cell
          term:
            id: CL:0000501
            label: granulosa cell
        locations:
