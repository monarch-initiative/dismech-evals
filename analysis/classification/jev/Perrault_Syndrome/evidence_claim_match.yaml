        description: The commonest syndromic form of recessive sensorineural hearing loss and therefore
          a routine alternative when a deaf proband is investigated, particularly before any ovarian phenotype
          has declared itself.
        distinguishing_features:
        - Progressive retinitis pigmentosa with night blindness and visual field loss is the defining
          second feature; retinal disease is not part of Perrault syndrome.
        - Vestibular areflexia is characteristic of Usher type 1 and is not a Perrault feature.
        - Gonadal function is normal in Usher syndrome, so ovarian assessment discriminates once a 46,XX
          proband reaches puberty.
      selected_evidence:
        snippet: In the families reported here a diagnosis of SNHL revealed variants in a Perrault syndrome
          related gene, which would not have been suspected based on clinical presentation alone.
        supports: SUPPORT
