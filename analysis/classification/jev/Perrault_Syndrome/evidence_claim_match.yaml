              encodes Twinkle, the mitochondrial DNA primase-helicase. Essentially all reported individuals
              have neurological involvement, making this subtype prototypically type II, and auditory
              neuropathy rather than pure cochlear loss has been documented. IMPORTANT NOSOLOGICAL NOTE
              — TWNK is pleiotropic: dominant missense variants cause progressive external ophthalmoplegia
              type 3, and a different set of recessive variants causes mitochondrial DNA depletion syndrome
              7. Only the biallelic Perrault presentation belongs to this entry.'
            mappings:
              mondo_mappings:
