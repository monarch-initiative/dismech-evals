      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Matrix Proteostasis Failure
        biological_scale: MOLECULAR
        role: mediator
        description: CLPP encodes the peptidase subunit of the CLPXP complex, the principal ATP-dependent
          protease of the mitochondrial matrix and an effector arm of the mitochondrial unfolded protein
          response. Perrault-associated substitutions cluster in a short region and are predicted to distort
          the barrel chamber that captures unfolded substrates. Loss of proteolysis allows damaged and
          unassembled matrix proteins to accumulate, and in Clpp-null mice the other Perrault proteins
          ERAL1, Twinkle and HARS2 themselves accumulate, indicating that the proteostatic and translational
          arms of the disease are mechanistically coupled rather than independent.
        biological_processes:
        - preferred_term: mitochondrial unfolded protein response
          term:
            id: GO:0034514
            label: mitochondrial unfolded protein response
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: mitochondrial matrix
          term:
            id: GO:0005759
            label: mitochondrial matrix
      selected_evidence:
        snippet: Together with the previous identification of mutations in HARS2, encoding mitochondrial
          histidyl-tRNA synthetase, mutations in CLPP expose dysfunction of mitochondrial protein homeostasis
          as a cause of Perrault syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
