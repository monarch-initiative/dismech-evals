        biological_scale: MOLECULAR
        role: mediator
        description: The second metabolic exception, mechanistically unrelated to the peroxisomal arm.
          GGPS1 encodes geranylgeranyl diphosphate synthase in the mevalonate/isoprenoid pathway; its
          product geranylgeranyl pyrophosphate is the lipid anchor required to prenylate small GTPases
          and is separately required for murine folliculogenesis. Loss of prenylation therefore produces
          a distinctive triad of muscular dystrophy with sensorineural hearing loss and ovarian insufficiency,
          the muscle component being unique to this arm.
