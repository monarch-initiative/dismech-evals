      assertion:
        name: Autosomal dominant progressive external ophthalmoplegia type 3
        disease_term:
          preferred_term: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
            dominant 3
          term:
            id: MONDO:0012241
            label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal dominant
              3
        description: The TWNK allelic boundary, and the most important nosological trap in this entry.
          The same gene that causes Perrault syndrome 5 when biallelic hypomorphic variants are present
          also causes autosomal DOMINANT progressive external ophthalmoplegia type 3, and, with a different
          set of recessive variants, mitochondrial DNA depletion syndrome 7. These are separate disorders
          and their literature must not be imported into the Perrault entry.
        distinguishing_features:
        - Inheritance is autosomal DOMINANT with a single heterozygous missense variant; Perrault syndrome
          5 requires two variants in trans.
        - Ptosis and progressive ophthalmoparesis are the presenting features; ophthalmoplegia is not
          a cardinal Perrault feature.
        - Ovarian insufficiency in a 46,XX individual, the defining sex-limited Perrault feature, is not
          part of the PEOA3 phenotype.
        - The third TWNK phenotype, mitochondrial DNA depletion syndrome 7, presents as infantile-onset
          spinocerebellar ataxia with epilepsy rather than as hearing loss with ovarian insufficiency.
      selected_evidence:
        snippet: Twinkle is known also to harbor multiple mutations, nearly all missenses, leading to
          dominant progressive external ophthalmoplegia type 3 and to recessive mitochondrial DNA depletion
          syndrome 7, also known as infantile-onset spinocerebellar ataxia.
        supports: SUPPORT
