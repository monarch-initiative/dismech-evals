          defect and is what makes the hypogonadism hypergonadotropic. Repeated measurement of FSH with
          oestradiol, supported by anti-Mullerian hormone and antral follicle count, is the standard means
          of establishing premature ovarian insufficiency.
      selected_evidence:
        snippet: POI is a common cause of infertility, characterised by elevated follicle-stimulating
          hormone and amenorrhea in women under the age of 40.
