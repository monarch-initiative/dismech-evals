      assertion_type: Subtype
      assertion:
        name: PRLTS1
        display_name: Perrault syndrome 1 (HSD17B4)
        subtype_term:
          preferred_term: Perrault syndrome 1
          term:
            id: MONDO:0009300
            label: Perrault syndrome 1
        description: Perrault syndrome caused by biallelic HSD17B4 variants. HSD17B4 encodes 17-beta-hydroxysteroid
          dehydrogenase type 4, also called D-bifunctional protein, a peroxisomal enzyme of fatty acid
          beta-oxidation. This was the first Perrault syndrome gene identified and is the principal peroxisomal
          exception among predominantly mitochondrial causes. Hypomorphic alleles give the Perrault phenotype
          whereas severe alleles give D-bifunctional protein deficiency, an allelic disorder curated separately;
          neurological features are characteristic of the HSD17B4 Perrault presentations reported to date.
        mappings:
          mondo_mappings:
          - term:
              id: MONDO:0009300
              label: Perrault syndrome 1
            mapping_predicate: skos:exactMatch
            mapping_source: MONDO
            mapping_justification: MONDO defines Perrault syndrome 1 as Perrault syndrome caused by mutation
              in HSD17B4 (verified with OAK).
        genes:
        - preferred_term: HSD17B4
          term:
            id: hgnc:5213
            label: HSD17B4
      selected_evidence:
        snippet: 'Whole-exome sequencing of genomic DNA from one of these sisters revealed exactly one
          gene with two rare functional variants: HSD17B4, which encodes 17beta-hydroxysteroid dehydrogenase
          type 4 (HSD17B4), also known as D-bifunctional protein (DBP).'
        supports: SUPPORT
