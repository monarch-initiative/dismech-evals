              id: MONDO:0017312
              label: Perrault syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        expressivity: VARIABLE
        penetrance: UNKNOWN
        description: 'All established Perrault syndrome genes act recessively; affected individuals carry
          two pathogenic alleles, most often as compound heterozygotes or, in consanguineous families,
          as homozygotes. Biallelic complete loss of function has not been observed for the mitochondrial
          translation genes, consistent with those genes being essential, so genotypes combine hypomorphic
          alleles with each other or with a null allele. Expressivity is markedly variable between and
          within families: hearing-loss severity, age of onset, degree of ovarian failure and the presence
          of neurological features differ even among siblings sharing a genotype. Sex modifies expression
          but not transmission: hearing loss occurs in both sexes, whereas the ovarian phenotype is confined
          to 46,XX individuals.'
      selected_evidence:
        snippet: Perrault syndrome is inherited as an autosomal recessive disorder characterized by bilateral
          mild to severe childhood sensorineural hearing loss with variable age of onset in both sexes
          and ovarian dysfunction in females who have a 46, XX karyotype.
        supports: SUPPORT
    origin:
