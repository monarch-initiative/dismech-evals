        name: D-bifunctional protein deficiency
        disease_term:
          preferred_term: d-bifunctional protein deficiency
          term:
            id: MONDO:0009855
            label: d-bifunctional protein deficiency
        description: 'An allelic disorder rather than an unrelated mimic: severe biallelic HSD17B4 variants
          cause D-bifunctional protein deficiency while hypomorphic variants in the same gene cause Perrault
          syndrome. Curated as a separate dismech entry; the relationship is one of allelic severity,
          not of coincidental resemblance.'
        distinguishing_features:
        - Neonatal hypotonia, intractable seizures and failure to thrive with death usually within the
          first two years, versus a chronic disorder compatible with normal lifespan.
        - Elevated very-long-chain fatty acids are consistently abnormal in D-bifunctional protein deficiency
          and may be normal or only mildly abnormal in HSD17B4 Perrault syndrome.
        - No female with D-bifunctional protein deficiency has survived past puberty, so the ovarian phenotype
          cannot be assessed in that disorder.
      selected_evidence:
        snippet: Mutations in HSD17B4 are known to cause DBP deficiency, an autosomal-recessive disorder
          of peroxisomal fatty acid beta-oxidation that is generally fatal within the first two years
          of life. No females with DBP deficiency surviving past puberty have been reported, and ovarian
          dysgenesis has not previously been associated with this illness.
        supports: SUPPORT
