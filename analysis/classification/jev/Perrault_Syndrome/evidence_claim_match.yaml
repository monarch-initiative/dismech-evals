            label: TFAM
        relationship_type: UNKNOWN
        notes: Mitochondrial transcription factor A, required for mtDNA transcription, replication and
          nucleoid packaging. Deliberately curated at a LOWER evidence tier than the other genes in this
          section. Tucker et al. 2020 name TFAM among "candidate genes" in patients who remained unsolved
          after the confirmed diagnoses, whereas the same paper states positively that PEX6 variants "can
          present clinically as Perrault syndrome" with supporting serum biochemistry. TFAM is therefore
          mechanistically plausible - it sits in the same mtDNA-maintenance arm as TWNK - and is listed
          among Perrault genes by review articles, but it has not been established with the segregation
          and functional evidence available for the numbered subtypes, and it carries no PRLTS designation.
          relationship_type is UNKNOWN rather than CAUSATIVE to record that distinction rather than flatten
          it. MRPL49 and MRPL50, which appear in the same review gene list, are omitted for the same reason
          and with less supporting evidence still.
      selected_evidence:
        snippet: The remaining patients had variants in candidate genes such as TFAM, involved in mtDNA
          transcription, replication, and packaging, and GGPS1 involved in mevalonate/coenzyme Q10 biosynthesis
