        conforms_to: sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death
        description: 'Cochlear inner and outer hair cells accumulate morphologically abnormal mitochondria,
          generate excess reactive oxygen species and activate the mitochondrial apoptotic pathway. Synaptic
          function deteriorates before frank cell loss: in conditional Hars2-knockout mice, inner hair
          cells show reduced calcium influx and compromised sustained exocytosis at postnatal day 30,
          weeks before hair cell death, and outer hair cells ultimately suffer the greater loss. In some
          genotypes, notably TWNK, the deficit is retrocochlear or synaptic rather than purely sensory,
          presenting as auditory neuropathy with preserved otoacoustic emissions but absent auditory brainstem
          responses.'
