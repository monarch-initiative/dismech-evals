              label: Perrault syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hypergonadotropic Ovarian Failure
        biological_scale: ORGANISM
        role: outcome
        description: 'The 46,XX-restricted cardinal manifestation. Loss of ovarian follicular function
          removes oestradiol and inhibin feedback, so pituitary FSH and LH rise, producing hypergonadotropic
          hypogonadism. The clinical presentation depends on how much ovarian tissue was ever functional:
          absent spontaneous puberty with primary amenorrhoea and streak or absent ovaries at the severe
          end, or normal menarche followed by irregular menses and secondary amenorrhoea before age 40
          at the milder end. Consequences beyond infertility are those of untreated hypo-oestrogenism
          — reduced bone density and osteoporosis, and adverse cardiovascular and urogenital outcomes.'
      selected_evidence:
        snippet: The literature review showed that the phenotype for PRLTS4 varies widely, but the sensorineural
          hearing loss, increased gonadotropin levels, and amenorrhea occurred frequently.
        supports: SUPPORT
