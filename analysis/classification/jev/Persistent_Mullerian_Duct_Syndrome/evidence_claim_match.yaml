            term:
              id: MONDO:0009857
              label: persistent Mullerian duct syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failed AMH Receptor Signaling in Mullerian Duct Mesenchyme
        biological_scale: MOLECULAR
        description: AMHR2 is expressed on the mesenchyme surrounding the Mullerian duct epithelium. Ligand
          binding to AMHR2 recruits a shared type I BMP receptor (BMPR1A/ALK3, with ACVR1 also implicated)
          and activates receptor-regulated SMADs. Loss of ligand or receptor collapses the whole cascade
          at its first step, so the downstream SMAD-dependent transcriptional program that dismantles
          the duct is never run.
        cell_types:
        - preferred_term: Mullerian duct mesenchymal cell
          term:
            id: CL:0008019
            label: mesenchymal cell
        biological_processes:
        - preferred_term: anti-Mullerian hormone receptor signaling pathway
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:1990262
            label: anti-Mullerian hormone receptor signaling pathway
        - preferred_term: SMAD protein signal transduction
          modifier: DECREASED
          term:
            id: GO:0060395
            label: SMAD protein signal transduction
      selected_evidence:
        snippet: AMHR2 is expressed in mesenchyme adjacent to the Müllerian ducts, and in Sertoli, Leydig,
          and granulosa cells.
        supports: SUPPORT
    origin:
