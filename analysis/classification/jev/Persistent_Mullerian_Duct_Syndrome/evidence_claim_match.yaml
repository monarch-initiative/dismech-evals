      assertion:
        name: Pelvic Magnetic Resonance Imaging
        description: 'Cross-sectional imaging to map the retained uterus, tubes and upper vagina and to
          locate the testes before an operation is planned. The reported failure mode is not the scan
          but the request: in a series in which pelvic MRI was performed before surgery, the uterus went
          unreported in two of three patients, and the recommendation that follows is to tell the reporting
          radiologist that Mullerian remnants are suspected.'
