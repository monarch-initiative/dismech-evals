  e9269b2e815ce4d3f51464d62670a9773f2e11810e857de890be546b41fe92f1:
    claim:
      about:
        disease:
          name: Persistent Mullerian Duct Syndrome
          disease_term:
            preferred_term: persistent Mullerian duct syndrome
            term:
              id: MONDO:0009857
              label: persistent Mullerian duct syndrome
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Canine AMHR2 p.Arg81Ter Miniature Schnauzer (naturally occurring PMDS)
        species: Dog
        genotype: AMHR2 c.241C>T (p.Arg81Ter) homozygous, sex-limited autosomal recessive
        background: Miniature Schnauzer (Canis lupus familiaris, NCBITaxon:9615)
        publication: PMID:29194807
        description: 'Naturally occurring, breed-enriched PMDS in the Miniature Schnauzer, caused by a
          nonsense variant in the third exon of AMHR2 that abolishes receptor expression. Affected males
          retain oviducts, uterus, uterine body, cervix and a cranial vagina, and about half are unilaterally
          or bilaterally cryptorchid. This is the point of the model: it reproduces the retained Mullerian
          derivatives that the mouse also reproduces, and in addition the failure of testicular descent
          that the mouse does not, so it is the only available whole-organism system in which the tethering
          step can be observed rather than inferred. It is a spontaneous, outbred, population-level model
          rather than an engineered one - the variant was found at an allele frequency of 0.16 among 216
          North American Miniature Schnauzers, with 27 percent carriers.'
        notes: Curated in response to the HUMAN_MODEL_MISMATCH discussion in this entry, which argues
          that the dog is the better model for the mechanical-tethering step and proposes canine descent
          phenotyping as the resolving experiment. Sertoli-cell tumours are reported in canine PMDS in
          the wider veterinary literature, but no exactly quotable statement of that was found in the
          references cached for this entry, so the tumour claim here is kept at the level the sources
          support - increased risk of testicular tumours.
        modeled_mechanisms:
        - target: Mechanical Tethering of the Testis by Retained Mullerian Structures
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Affected dogs carry the retained Mullerian derivatives and, unlike the Amh-null
            and Amhr2-null mouse, present with cryptorchidism, so retention and failed descent co-occur
            in one animal as they do in human PMDS.
          limitations: 'Cryptorchidism is reported in roughly half of affected dogs rather than in all
            of them, and canine testicular descent is not on the human schedule, so the co-occurrence
            establishes that retention and failed descent travel together in this species without demonstrating
            the tether itself. The allele is breed-restricted: the same study sequenced AMH and AMHR2
            in a PMDS-affected Belgian Malinois and found no causal variant, so canine PMDS is not one
            genetic entity. The cohort is a genotyping survey, not a gubernacular or cord-anatomy study,
            and no measurement of the attachment between remnant and testis was made.'
          readouts:
          - name: Proportion of PMDS-affected dogs that are cryptorchid
            target: Mechanical Tethering of the Testis by Retained Mullerian Structures
            direction: INCREASED
            interpretation: Failure of descent in about half of affected animals, against a low breed
              background rate, is the observation that distinguishes this model from the rodent models
              of the same pathway.
          - name: Mullerian derivatives retained in affected males
            target: Mechanical Tethering of the Testis by Retained Mullerian Structures
            direction: INCREASED
            interpretation: The retained structures are present and anatomically continuous with the male
              tract, which is the substrate the tether requires.
      selected_evidence:
        snippet: The genetic basis for PMDS in Miniature Schnauzers is a sex-limited autosomal recessive
          C to T transition (c.241C>T; p.R81*) nonsense mutation in the third exon of the AMHR2 gene
        supports: SUPPORT
