              label: persistent Mullerian duct syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Preservation of Mullerian Remnants and the Vas Deferens
        description: The vasa deferentia and their blood supply run in the wall of the retained Mullerian
          structures, so aggressive excision of the remnant risks sterilizing the patient and devascularizing
          the testis. The recommended default is therefore to leave the uterus and tubes in situ, or to
          split the remnant sagittally to gain length for descent, rather than to excise it. This trades
          a small ongoing malignancy risk in the remnant, managed by surveillance, against a large and
          immediate iatrogenic fertility risk. Where excision is unavoidable, subtotal hysterectomy with
          deliberate preservation of the vasa is the compromise.
        action_category: THERAPEUTIC
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Mullerian-remnant-sparing surgical technique
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: Meticulous proximal salpingectomy and hysterectomy is indicated only in patients whose
          müllerian structures limit intrascrotal placement of the tests.
        supports: SUPPORT
