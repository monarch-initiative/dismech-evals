        context: []
      assertion_type: Diagnosis
      assertion:
        name: Diagnostic Laparoscopy
        description: Laparoscopy for impalpable or bilaterally undescended testes is the point at which
          most cases are recognized, because it is the only investigation that directly visualizes the
          retained uterus and tubes alongside the gonads. It is therefore both the commonest route to
          diagnosis and, when the finding is not recognized for what it is, the commonest route to a reflexive
          excision. Finding Mullerian and Wolffian derivatives together should stop the operation and
          prompt gonadal biopsy and karyotype, since other 46,XY differences of sex development can present
          the same way.
        diagnosis_term:
          preferred_term: diagnostic laparoscopy for impalpable testes
          term:
            id: NCIT:C16969
            label: Laparoscopy
      selected_evidence:
        snippet: With investigative laparoscopy for impalpable testes now commonplace, the recognition
          of FT PMDS in infancy has increased
        supports: SUPPORT
