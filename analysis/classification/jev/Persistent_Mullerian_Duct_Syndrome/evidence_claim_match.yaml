  cded241454fdbe44e486f9bd7d0b180b59356e0e3be245968b70593368fc1263:
    claim:
      about:
        disease:
          name: Persistent Mullerian Duct Syndrome
          disease_term:
            preferred_term: persistent Mullerian duct syndrome
            term:
              id: MONDO:0009857
              label: persistent Mullerian duct syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: Unexplained PMDS (no AMH or AMHR2 variant identified)
        relationship_type: UNKNOWN
        notes: 'Roughly one case in eight has no identified variant in either AMH or AMHR2 despite a clinically
          unambiguous phenotype. These cases are labelled idiopathic; the implication is that at least
          one further component of the Mullerian regression pathway remains to be identified in humans.

          Two kinds of candidate should be kept apart. PPP1R12A is the only one with a reported human
          PMDS finding - truncating variants in five of twenty-four patients screened after AMH and AMHR2
          were excluded - and it has its own record in this section, typed UNKNOWN because the finding
          is unvalidated. The shared type I receptors and the SMADs are a different class of candidate:
          established in mouse, biologically obvious, and not yet reported as a human PMDS cause at all.
          Before this entry carried the PPP1R12A record, only the second class was named here, which understated
          where the field actually is.'
      selected_evidence:
        snippet: In 12% of cases, no mutation of AMH or AMHR2 has been detected, suggesting a disruption
          of other pathways involved in Müllerian regression.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/2
