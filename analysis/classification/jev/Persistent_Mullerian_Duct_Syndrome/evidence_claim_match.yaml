        notes: In PMDS type II the Sertoli cells make AMH normally but the target mesenchyme cannot respond,
          so serum AMH is normal for age or at the upper limit of normal. A normal AMH therefore does
          not exclude PMDS - it reclassifies it. This discrepancy between the two subtypes is the biochemical
          signature that separates them before sequencing.
