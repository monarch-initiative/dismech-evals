        context: []
      assertion_type: Diagnosis
      assertion:
        name: AMH and AMHR2 Sequencing with Copy-Number Analysis
        description: Sequence and deletion/duplication analysis of both genes. Copy-number detection is
          specified rather than assumed because AMHR2 microdeletions occur, and a whole-gene deletion
          in trans with a point variant makes that variant look homozygous on Sanger sequencing alone
          - so a sequencing-only result can be both wrong about zygosity and wrong about which parent
          is a carrier. A wider disorder-of-sex-development panel or exome is appropriate when first-line
          testing is negative, and a negative result does not exclude the pathway. After a molecular diagnosis,
          cascade testing is offered to siblings.
        diagnosis_term:
          preferred_term: AMH and AMHR2 sequencing with deletion/duplication analysis
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: Three of the 11 patients had biallelic mutations in AMH or AMHR2.
        supports: SUPPORT
