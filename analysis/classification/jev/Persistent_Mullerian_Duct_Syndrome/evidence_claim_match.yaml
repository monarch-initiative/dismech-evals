        description: Loss of testicular volume in the malpositioned gonad. The ectopic testis sits outside
          the scrotum for as long as it remains undescended, and repeated attempts at fixation add ischaemic
          insult to that exposure, so a testis that is viable at first presentation can be atrophic by
          the time of a later operation. This is the finding that converts the management decision from
          orchidopexy to orchidectomy, and it is the mechanism by which delayed diagnosis translates into
          permanent loss of gonadal tissue.
        phenotype_term:
          preferred_term: Testicular atrophy
          term:
            id: HP:0008734
            label: Decreased testicular size
        notes: No frequency is recorded. The cached sources document the finding in individual patients
          but none reports a proportion, and a frequency band is a separate quantitative claim that would
          need its own evidence.
      selected_evidence:
        snippet: In September 2021, at the age of 12, surgery was repeated on the left hemiscrotum, and
          a small atrophic left testicle was discovered, for which an orchidectomy was performed, taking
          into account the risk of malignancy.
        supports: SUPPORT
