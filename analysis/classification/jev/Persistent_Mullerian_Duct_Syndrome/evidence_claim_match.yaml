        name: Impaired Spermatogenesis and Excurrent Duct Compromise
        biological_scale: TISSUE
        description: 'Fertility is impaired through several converging routes: prolonged cryptorchidism
          damages the germinal epithelium, the excurrent ducts are distorted or detached from the testis,
          and excision of Mullerian remnants can injure the vasa deferentia and their blood supply. Because
          the last of these is iatrogenic, the surgical strategy chosen has a direct bearing on reproductive
          outcome.'
      selected_evidence:
        snippet: It is not clear what contributes, and to what degree, to the reported fertility impairment—it
          may be due to uncorrected cryptorchidism, or due to coexisting congenital gonadal and Wolffian
          duct anomalies, or due to ischemic and structural damage to the vas and testis secondary to
          excision of Müllerian remnants.
        supports: SUPPORT
