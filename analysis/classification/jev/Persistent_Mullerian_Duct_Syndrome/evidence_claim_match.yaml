        context: []
      assertion_type: Diagnosis
      assertion:
        name: Serum Anti-Mullerian Hormone with Gonadotropin and Androgen Panel
        description: 'Serum AMH, measured alongside inhibin B, testosterone, LH and FSH. AMH partitions
          the two genetic subtypes rather than establishing the diagnosis: a low or undetectable value
          points to the ligand gene and a normal or elevated value to the receptor gene. A normal AMH
          therefore does not exclude PMDS, and reading it that way is one of the routes to a missed diagnosis.
          Tumour markers are added when a mass is present.'
        diagnosis_term:
          preferred_term: serum anti-Mullerian hormone measurement
          term:
            id: NCIT:C120625
            label: Anti-Mullerian Hormone Measurement
        results: Low or undetectable serum AMH in PMDS type I; normal or elevated serum AMH in PMDS type
          II.
        notes: The two directions are curated as separate subtype-attributed records in the biochemical
          section, where the discrepancy between them is the informative content.
      selected_evidence:
        snippet: Serum AMH and inhibin B were normal.
        supports: SUPPORT
