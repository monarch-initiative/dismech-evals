          term:
            id: GO:0009636
            label: response to toxic substance
      selected_evidence:
        snippet: Adenylate cyclase toxin targets Cd11b-positive professional phagocytes, including dendritic
          cells, macrophages, and neutrophils by forming cation-selective pores to permeabilize the cell
          membrane
        supports: SUPPORT
