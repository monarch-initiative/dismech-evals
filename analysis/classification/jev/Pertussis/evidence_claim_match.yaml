      assertion_type: Pathophysiology
      assertion:
        name: Type III Secretion System-Mediated Immune Evasion
        role: effector
        description: 'B. pertussis (and the classical Bordetella) use a type III secretion system (T3SS)
          to manipulate host vasoactive intestinal peptide (VIP)/VPAC2 signaling, promoting colonization
          and persistence in the lower respiratory tract. In mouse models, VPAC2-deficient hosts show
          reduced bacterial burden and VPAC2 antagonists reduce lung pathology, identifying this axis
          as a candidate host-directed therapeutic target.

          '
        biological_processes:
        - preferred_term: response to host immune response
          term:
            id: GO:0052572
            label: response to host immune response
      selected_evidence:
        snippet: the ability of Bordetella spp. to manipulate VIP/VPAC signaling pathway appears to be
          mediated by the type 3 secretion system (T3SS)
        supports: SUPPORT
