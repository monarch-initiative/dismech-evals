        role: effector
        description: 'Pertussis toxin, an AB5-type exotoxin, uses its enzymatic A subunit to ADP-ribosylate
          the alpha-subunit of inhibitory G proteins (Gαi), preventing receptor-induced inhibition of
          adenylyl cyclase and causing unrestrained cAMP accumulation in host cells — a canonical mechanism
          underlying many pertussis disease manifestations.

          '
        biological_processes:
        - preferred_term: response to toxic substance
          term:
            id: GO:0009636
            label: response to toxic substance
      selected_evidence:
        snippet: Its enzymatic A subunit ADP-ribosylates the α-subunit of inhibitory G proteins (Gαi),
          preventing them from mediating receptor-induced inhibition of adenylyl cyclase (AC). This leads
          to unrestrained cAMP accumulation in host cells
        supports: SUPPORT
