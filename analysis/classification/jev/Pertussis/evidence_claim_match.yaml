      assertion:
        name: Bacterial Ribosomal Translation (Macrolide Target)
        role: therapeutic_vulnerability
        conforms_to: bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome
        description: 'B. pertussis depends on its bacterial ribosome for protein synthesis. Macrolides
          (e.g., azithromycin), the conventional antibiotics for pertussis, bind the 50S ribosomal subunit
          and block bacterial protein synthesis — the molecular target underlying antibiotic therapy (which
          reduces transmissibility more than it alters the toxin-driven cough once established).

          '
        biological_processes:
        - preferred_term: translation
          term:
            id: GO:0006412
            label: translation
      selected_evidence:
        snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
        supports: SUPPORT
