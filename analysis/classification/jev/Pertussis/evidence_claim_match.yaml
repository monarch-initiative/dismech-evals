        name: Adenylate Cyclase Toxin-Mediated Phagocyte Subversion
        role: effector
        description: 'Adenylate cyclase toxin (ACT/CyaA), a second major B. pertussis toxin, targets CD11b-bearing
          professional phagocytes (macrophages, neutrophils, dendritic cells), forming cation-selective
          pores and elevating intracellular cAMP to impair phagocytosis, dendritic-cell maturation, and
          cytokine secretion. This disarms innate immunity and, together with pertussis toxin, allows
          the organism to persist on the airway epithelium.

          '
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: dendritic cell
          term:
            id: CL:0000451
            label: dendritic cell
        biological_processes:
