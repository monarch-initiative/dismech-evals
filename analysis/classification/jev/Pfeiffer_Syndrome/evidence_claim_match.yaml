  82654f1de8814d26738a31ff2e3beefa42db87f7e0397631c4bbd5f02113b1d9:
    claim:
      about:
        disease:
          name: Pfeiffer Syndrome
          disease_term:
            preferred_term: Pfeiffer syndrome
            term:
              id: MONDO:0007043
              label: Pfeiffer syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Midface advancement surgery
        description: 'Le Fort III or monobloc osteotomy to advance the midface, improving airway, proptosis,
          and facial appearance. Repeat midface surgery is common in FGFR-related syndromic craniosynostosis,
          and the scarring left by earlier procedures is itself a risk factor: the first reported paediatric
          case of bilateral posterior ischaemic optic neuropathy after craniofacial surgery occurred in
          a 13-year-old with Pfeiffer syndrome undergoing Le Fort II advancement, attributed to bicoronal
          flap tightness from prior Le Fort III surgery combined with permissive hypotension and anaemia.
          This is a single case and does not establish a rate, but it identifies a mechanism — cumulative
          operative scarring plus intraoperative hypoperfusion — specific to the repeatedly operated syndromic
          craniosynostosis patient.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Midface advancement
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: It was determined on institutional review that his vision loss was attributed to the
          tightness of the bicoronal flap due to scarring from past Le Fort III procedures in combination
          with permissive hypotension and anemia.
        supports: SUPPORT
