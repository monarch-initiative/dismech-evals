  b91a12b222cc3b3125618bb0a17397ec075039daa6e014f6870ce06c20563fd8:
    claim:
      about:
        disease:
          name: Pfeiffer Syndrome
          disease_term:
            preferred_term: Pfeiffer syndrome
            term:
              id: MONDO:0007043
              label: Pfeiffer syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: FGFR1-related
        display_name: FGFR1-related Pfeiffer syndrome
        subtype_term:
          preferred_term: FGFR1-related Pfeiffer syndrome
          term:
            id: MONDO:1060146
            label: FGFR1-related Pfeiffer syndrome
        genes:
        - preferred_term: FGFR1
          term:
            id: hgnc:3688
            label: FGFR1
        inheritance:
        - name: Autosomal dominant (FGFR1-related)
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        description: Pfeiffer syndrome caused by a mutation in FGFR1 on chromosome 8, the minority locus.
          The recurrent exon 5 change predicting a proline-to-arginine substitution in the extracellular
          domain was the mutation carried by all affected members of the five families in which FGFR1
          was identified as a Pfeiffer locus, and that allele, p.Pro252Arg, is associated with mild clinical
          signs, though within one reported family its expression ranged from characteristic brachycephaly
          and digital anomalies to an apparently normal skull and limbs. This is a molecular grouping
          rather than a clinical one, so it is not disjoint from the type 1/2/3 severity subtypes above;
          it overlaps type 1 in particular, the mild presentation with which p.Pro252Arg is associated.
      selected_evidence:
        snippet: Here we present evidence that mutations in the fibroblast growth factor receptor-1 (FGFR1)
          gene, which maps to 8p, cause one form of familial Pfeiffer syndrome.
        supports: SUPPORT
    origin:
