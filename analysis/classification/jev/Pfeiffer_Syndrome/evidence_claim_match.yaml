            the clinical subtypes were described.
        description: 'Similar to type 2 but without cloverleaf skull, with severe ocular proptosis and
          a markedly short anterior cranial base. Recognizing it matters diagnostically: extreme proptosis
          without a cloverleaf skull, accompanied by visceral anomalies, has led to patients being labelled
          as undiagnosed or as a new entity.'
      selected_evidence:
        snippet: Recognition of type 3 is particularly important because extreme ocular proptosis in the
          absence of cloverleaf skull but with various visceral anomalies can result in failure to diagnose
          Pfeiffer syndrome
        supports: SUPPORT
