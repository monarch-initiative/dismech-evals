  61dd540cca8b771e7cba9772ed07ed292bcf27f81926f3856f7efb31c3ae19b2:
    claim:
      about:
        disease:
          name: Pfeiffer Syndrome
          disease_term:
            preferred_term: Pfeiffer syndrome
            term:
              id: MONDO:0007043
              label: Pfeiffer syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: FGFR1 gain-of-function mutations
        association: Causative
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: FGFR1
          term:
            id: hgnc:3688
            label: FGFR1
        notes: 'FGFR1 is the minority Pfeiffer locus and the recurrent p.Pro252Arg allele it carries is
          associated with mild clinical signs, while FGFR2 accounts for the majority of cases. Neither
          the clinical severity types nor the gene-defined forms is a relabelling of the other, and no
          source found supports a one-to-one mapping between them: an FGFR2 variant is reported in a patient
          classified as the mild type 1, and a hospital series describes severe FGFR2-associated disease,
          so FGFR2 spans the severity range. The two axes are therefore curated as overlapping has_subtypes
          rows rather than as a mapping. The Europe PMC queries behind that were TITLE:"Pfeiffer syndrome"
          AND (FGFR2 OR FGFR1); ABSTRACT:"Pfeiffer" AND ABSTRACT:"FGFR1" AND ABSTRACT:"FGFR2" AND (ABSTRACT:"severe"
          OR ABSTRACT:"mild"); and "Pfeiffer syndrome" AND FGFR1 AND "type 1" AND ABSTRACT:FGFR2. ClinGen''s
          own grade for the FGFR1-Pfeiffer relationship is not stated here: the repository''s committed
          ClinGen caches carry the FGFR2 assertion only, and the gene-validity CSV those caches are built
          from is not part of the repository.'
      selected_evidence:
        snippet: A C to G transversion in exon 5, predicting a proline to arginine substitution in the
          putative extracellular domain, was identified in all affected members of five unrelated PS families
          but not in any unaffected individuals.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:7874169
      reference_title: A common mutation in the fibroblast growth factor receptor 1 gene in Pfeiffer syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Gives the recurrent allele and its segregation: present in every affected family member
        and in no unaffected individual across five families.'
