      assertion_type: ProgressionInfo
      assertion:
        phase: Childhood and age-dependent clinical evolution
        age_range: Childhood through adulthood
        notes: 'With increasing age, hypotonia and joint laxity often become less prominent and developmental
          abilities may modestly improve, whereas the prevalence of autism spectrum disorder diagnoses,
          seizures, cellulitis, and lymphedema increases in older cohorts.

          '
      selected_evidence:
        snippet: Considering different age groups, in older patients, behavioral problems tended to subside,
          developmental abilities improved, and some features such as large or fleshy hands, full or puffy
          eyelids, hypotonia, lax ligaments, and hyperextensible joints were less frequent. However, the
          proportion reporting an autism spectrum disorder, seizures, and cellulitis, or presenting with
          lymphedema or abnormal reflexes increased with age.
        supports: SUPPORT
