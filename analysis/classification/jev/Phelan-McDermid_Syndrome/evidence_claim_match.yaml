      assertion_type: Diagnosis
      assertion:
        name: Chromosomal microarray (array CGH)
        description: 'First-tier diagnostic test for detecting terminal and interstitial 22q13.3 deletions
          encompassing SHANK3 (<50 kb to >9 Mb), which account for the majority of Phelan-McDermid syndrome
          cases. Detection of a terminal 22q13.3 deletion by microarray requires follow-up karyotyping
          to screen for ring chromosome 22.

          '
        diagnosis_term:
          preferred_term: chromosomal microarray analysis (array CGH)
          term:
            id: NCIT:C198497
            label: Array-based Comparative Genomic Hybridization
        results: 'Detection of heterozygous deletion at chromosome 22q13.3 (ranging from <50 kb to >9
          Mb) encompassing at least part of SHANK3.

          '
      selected_evidence:
        snippet: The diagnosis of PMS-SHANK3 related is established in a proband with suggestive findings
          and either (1) a <50-kb to >9-Mb heterozygous deletion at chromosome 22q13.3 with involvement
          of at least part of SHANK3; (2) a heterozygous pathogenic variant in SHANK3; OR (3) a chromosomal
          rearrangement with breakpoints disrupting SHANK3 identified by molecular genetic testing.
        supports: SUPPORT
