              label: Phelan-McDermid syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: Ring chromosome 22
        genes:
        - preferred_term: SHANK3
          term:
            id: hgnc:14294
            label: SHANK3
        description: 'Caused by formation of ring chromosome 22 with loss of distal 22q material including
          SHANK3. Individuals with ring chromosome 22 also have a high risk of developing features of
          NF2-related schwannomatosis. Karyotype screening for a ring chromosome 22 is required whenever
          a terminal 22q13.3 deletion is detected by chromosomal microarray, which is how this mechanism
          is separated from a simple terminal deletion in practice.

          '
      selected_evidence:
        snippet: Those who have PMS-SHANK3 related due to a ring chromosome 22 also have a high risk of
          developing features of NF2-related schwannomatosis (NF2).
        supports: SUPPORT
