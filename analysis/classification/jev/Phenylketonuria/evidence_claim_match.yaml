      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_pah_deficiency_phenylalanine_neurotoxicity_model
        hypothesis_label: Canonical PAH Deficiency and Phenylalanine Neurotoxicity Model
        status: CANONICAL
        description: Biallelic loss-of-function variants in PAH reduce hepatic phenylalanine hydroxylase
          activity, blocking conversion of phenylalanine to tyrosine. The resulting hyperphenylalaninemia
          exposes the developing and adult brain to neurotoxic phenylalanine levels, with downstream perturbation
          of large-neutral-amino-acid (LNAA) transport across the blood-brain barrier, depletion of cerebral
          tyrosine, tryptophan, and dopamine/serotonin neurotransmitter pools, impaired myelination, and
          oxidative stress. Severity is graded by residual PAH activity (classic PKU vs mild PKU vs non-PKU
          hyperphenylalaninemia) and the BH4-responsive subset; phenylalanine restriction, BH4 sapropterin,
          and pegvaliase (phenylalanine ammonia lyase) all act on this canonical axis.
        notes: 'Retained as CANONICAL. The 2026 falcon hypothesis-search report (kb/hypotheses/Phenylketonuria/canonical_pah_deficiency_phenylalanine_neurotoxicity_model;
          openscientist timed out) confirms biallelic PAH loss-of-function → hyperphenylalaninemia → neurotoxicity
          as the core mechanism, supported by phenylalanine-restricted diet efficacy, BH4 sapropterin
          response in cofactor-responsive variants, and pegvaliase (PAL enzyme substitution) approval.
          Three refinements: (1) the BBB neurotoxicity mechanism is multifactorial — LNAA transporter
          competition, depletion of cerebral tyrosine/tryptophan, reduced dopamine/serotonin synthesis,
          impaired myelin lipid composition, and oxidative stress all contribute, rather than direct Phe-toxicity
          alone; (2) maternal PKU teratogenicity (embryonic Phe exposure causing microcephaly, congenital
          heart disease, intellectual disability in offspring) operates through a distinct developmental
          mechanism; (3) executive dysfunction, attention deficits, and mood disorders persist in early-treated
          PKU adults even with good metabolic control, suggesting subtle developmental neurotoxicity beyond
          what current Phe targets capture.'
      selected_evidence:
        snippet: PKU, an autosomal recessive disease, is an inborn error of phenylalanine (Phe) metabolism
        supports: SUPPORT
