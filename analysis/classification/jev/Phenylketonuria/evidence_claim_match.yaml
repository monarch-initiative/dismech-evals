      selected_evidence:
        snippet: Phenylketonuria is a disease caused by congenital defects in phenylalanine metabolism
          that leads to irreversible nerve cell damage. The present study aimed to determine the worldwide
          prevalence of classic phenylketonuria using the data of neonatal screening studies. The highest
          prevalence (38.13) was reported in Turkey, while the lowest (0.3) in Thailand. A total of 46
          studies were entered into the meta-analysis for pooled prevalence estimation. The overall worldwide
          prevalence of the disease is 6.002 per 100,000 neonates (95% confidence interval, 5.07-6.93).
