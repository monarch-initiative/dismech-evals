        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Noradrenergic and Dopaminergic Secretory Phenotype
        biological_scale: CELLULAR
        role: effector
        description: SDHx-related and other Cluster 1 tumors, and parasympathetic head-and-neck paragangliomas,
          lack or downregulate phenylethanolamine N-methyltransferase (PNMT), the cortisol-dependent enzyme
          that converts norepinephrine to epinephrine and which requires the adrenal cortical microenvironment.
          They therefore secrete norepinephrine (measured as normetanephrine) and sometimes dopamine (measured
          as 3-methoxytyramine) rather than epinephrine. Many head-and-neck parasympathetic paragangliomas
          are biochemically silent altogether and present as a painless neck mass or with cranial-nerve
          palsy, not with catecholamine symptoms - which is precisely why a normal metanephrine panel
          cannot exclude them.
        biological_processes:
        - preferred_term: catecholamine biosynthetic process
          modifier: ABNORMAL
          term:
            id: GO:0042423
            label: catecholamine biosynthetic process
      selected_evidence:
        snippet: Almost all tumors with mutations in cluster 1 are tumors with a noradrenergic biochemical
          phenotype. These produce norepinephrine and dopamine, not epinephrine.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/0
