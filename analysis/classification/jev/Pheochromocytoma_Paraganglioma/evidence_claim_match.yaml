      assertion_type: Pathophysiology
      assertion:
        name: Adrenergic Secretory Phenotype
        biological_scale: CELLULAR
        role: effector
        description: 'Cluster 2 (RET/NF1/TMEM127) and other adrenal tumors retain PNMT expression and
          secrete epinephrine, measured as metanephrine. The adrenergic versus noradrenergic split is
          the basis on which a fractionated metanephrine panel becomes genotype-informative rather than
          merely diagnostic: a metanephrine-predominant pattern points toward RET/NF1, a normetanephrine-predominant
          pattern toward VHL/SDHx, and a 3-methoxytyramine elevation toward SDHx and dopaminergic, often
          metastatic, disease.'
        biological_processes:
        - preferred_term: catecholamine biosynthetic process
          modifier: INCREASED
          term:
            id: GO:0042423
            label: catecholamine biosynthetic process
      selected_evidence:
        snippet: Many of the cluster 2 mutations have adrenergic biochemical phenotype and are associated
          with increased epinephrine production as a result of high PNMT expression.
        supports: SUPPORT
