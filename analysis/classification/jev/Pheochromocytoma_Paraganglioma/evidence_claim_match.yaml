      - /disease_term
    evidence_metadata:
      reference: PMID:36531507
      reference_title: Low number of neurosecretory vesicles in neuroblastoma impairs massive catecholamine
        release and prevents hypertension.
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      explanation: 'Background in the introduction of a study comparing catecholamine synthesis, storage
        and release in neuroblastoma and pheochromocytoma. It restates earlier work, not this study''s
        own data: the first two sentences cite earlier references, and the age figures are given without
        a citation. It supports the row''s points: pheochromocytoma, paraganglioma and neuroblastoma arise
        from the adrenal medulla and sympathetic ganglia and typically produce catecholamines; pheochromocytoma
        and paraganglioma typically occur in adults and are composed of differentiated cells, whereas
        neuroblastoma is a pediatric neoplasm resulting from abnormal differentiation and maturation of
        sympathetic progenitors; neuroblastoma can occur anywhere in the sympathetic chain but most commonly
        in the abdomen and adrenal medulla, the site overlap that puts it in the differential of pheochromocytoma
        and sympathetic paraganglioma; and 50% of neuroblastomas are diagnosed before age 2 years and
        90% before age 5 years. The quote treats paraganglioma as a sympathetic tumor, so the row limits
        the shared-origin statement to sympathetic paraganglioma; the parasympathetic head-and-neck paragangliomas
        this entry also covers are mostly non-secretory (PMID:20301715). The source pairs paraganglioma
        with sympathetic neurons rather than chromaffin cells, so the chromaffin-cell origin of paraganglioma
        rests on PMID:32617052 at the Chromaffin Cell Tumorigenesis node, not on this quote.'
