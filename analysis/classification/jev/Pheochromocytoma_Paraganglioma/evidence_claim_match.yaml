        context: []
      assertion_type: Subtype
      assertion:
        name: Composite Paraganglioma
        display_name: Composite paraganglioma (extra-adrenal)
        description: 'The extra-adrenal counterpart of composite pheochromocytoma: a paraganglioma outside
          the adrenal gland that also contains a second, separate tumor component. As elsewhere in this
          entry, paraganglioma here means an extra-adrenal tumor. Counting adrenal and extra-adrenal composite
          tumors together, the second component is usually a ganglioneuroma and most reported cases are
          adrenal; extra-adrenal cases are reported only occasionally, and a 2022 literature review counted
          17 extra-adrenal cases reported before its own case. NCIT has no extra-adrenal-only composite
          term, so this row is bound to the general class, under which NCIT also files the adrenal form
          (NCIT:C48306, the Composite Pheochromocytoma row).'
        subtype_term:
          preferred_term: extra-adrenal composite paraganglioma
          term:
            id: NCIT:C157246
            label: Composite Paraganglioma
      selected_evidence:
        snippet: Seventeen cases of extra-adrenal composite paraganglioma have been reported in the international
          literature so far. ... Regarding composite paragangliomas, they are considered to be rare tumors.
          In about 70% of them, paraganglioma coexists with a ganglioneuroma component. ... Fewer than
          70 cases have been reported in the medical literature, most of which are located in the adrenal
          glands, while the extra-adrenal composite tumors have been reported only occasionally
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /has_subtypes/4
      evidence_path: /has_subtypes/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35273997
      reference_title: 'Composite Paraganglioma of the Celiac Trunk: A Case Report and a Comprehensive
        Review of the Literature.'
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      explanation: 'Tzikos et al. 2022 combine a case report with a literature review, and count adrenal
        and extra-adrenal composite tumors together as composite paragangliomas. The abstract gives the
        review''s tally of 17 extra-adrenal composite paragangliomas reported before the authors'' own
        celiac-trunk case. The discussion says paraganglioma coexists with a ganglioneuroma component
        in about 70% of composite paragangliomas, and that most of the fewer than 70 reported cases are
        adrenal while extra-adrenal ones have been reported only occasionally. The fewer-than-70 figure
        is not this review''s own count: the paper attributes it to its reference 14, and it is lower
        than the 94 published patients with composite pheochromocytoma that Dhanasekar et al. 2022 pooled
        from studies published up to 2017 (PMID:33651160, the Composite Pheochromocytoma row). It is used
        here only for the statement that most reported cases are adrenal, not as a count. The 17 is the
        review''s own count (its Table 2), not a complete census: Table 2 omits the retroperitoneal case
        reported by Gupta et al. 2017 (PMID:28752484), and the same paper''s introduction names the mediastinum
        as a reported site although Table 2 lists no mediastinal case. The tally also includes a cauda
        equina lesion and a filum terminale lesion. The 2022 WHO classification now classifies the tumor
        formerly known as cauda equina paraganglioma as cauda equina neuroendocrine tumor (PMID:35285002),
        so part of the count reflects older nomenclature.'
