      assertion_type: Treatment
      assertion:
        name: Cyclophosphamide-Vincristine-Dacarbazine (CVD) Chemotherapy
        description: The conventional cytotoxic backbone for rapidly progressive or high-burden metastatic
          PPGL, and the comparator against which every newer systemic option is judged. A meta-analysis
          of four studies (50 patients) found a partial tumor-volume response in about 37% and a partial
          catecholamine response in about 40%. The authors are explicit that the studies did not define
          when treatment should start, so part of the apparent benefit may reflect the indolent natural
          history of PPGL - which is precisely why CVD is reserved for documented progression rather than
          used on diagnosis of metastatic disease.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: chemotherapy
          term:
            id: NCIT:C15632
            label: Chemotherapy
          therapeutic_agent:
          - preferred_term: cyclophosphamide
            term:
              id: CHEBI:4027
              label: cyclophosphamide
          - preferred_term: vincristine
            term:
              id: CHEBI:28445
              label: vincristine
          - preferred_term: dacarbazine
            term:
              id: CHEBI:4305
              label: dacarbazine
      selected_evidence:
        snippet: Data on the effects of a combination of CVD chemotherapy on malignant paraganglioma/pheochromocytoma
          suggest that a partial response concerning tumour volume can be achieved in about 37% of patients
          and a partial response on catecholamine excess in about 40% of patients.
        supports: SUPPORT
