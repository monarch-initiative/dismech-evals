        biological_scale: CELLULAR
        role: mediator
        description: 'The mechanistic explanation for the SDHD/SDHAF2 parent-of-origin effect. Both genes
          lie on chromosome 11 (SDHD at 11q23, SDHAF2 at 11q13). Tumorigenesis requires loss of the wild-type
          maternal allele, and in SDHD-linked tumors the event is loss of the entire maternal chromosome
          11 rather than a focal second hit. Because that single event must remove the wild-type copy,
          a mutation inherited from the mother is not usually unmasked, and disease is expressed almost
          exclusively after paternal transmission. Note that this is not simple classical imprinting:
          SDHD shows biallelic expression in several normal tissues, and the loss of the co-deleted imprinted
          11p15 region is thought to contribute.'
        locations:
        - preferred_term: adrenal medulla
          term:
            id: UBERON:0001236
            label: adrenal medulla
      selected_evidence:
        snippet: Here we demonstrate exclusive loss of the entire maternal chromosome 11 in SDHD-linked
          paragangliomas and phaeochromocytomas
