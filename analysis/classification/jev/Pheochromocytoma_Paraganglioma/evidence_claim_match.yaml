      assertion:
        name: Lifelong Surveillance for Carriers
        description: Asymptomatic pathogenic-variant carriers enter risk-adapted lifelong surveillance,
          typically combining periodic plasma free metanephrines with whole-body MRI at intervals set
          by genotype. SDHB carriers receive the most intensive imaging because of their metastatic risk,
          while SDHD carriers need dedicated head-and-neck coverage for multifocal parasympathetic tumors
          that may be biochemically silent and therefore invisible to metanephrine testing alone.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: surveillance for hereditary PPGL
          term:
            id: NCIT:C15406
            label: Cancer Screening
      selected_evidence:
        snippet: Individuals at risk for hereditary PGL/PCC syndromes should have annual clinical assessment
          for manifestations of PGL/PCCs and GISTs, plasma-free fractionated metanephrines or 24-hour
          urine fractionated metanephrines every two years in childhood and then annually in adults, and
          whole-body MRI every two to three years.
        supports: SUPPORT
