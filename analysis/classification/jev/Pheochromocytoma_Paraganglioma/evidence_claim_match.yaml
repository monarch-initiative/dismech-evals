              label: pheochromocytoma-paraganglioma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Metastatic Progression
        biological_scale: ORGANISM
        role: outcome
        description: 'Metastatic PPGL is defined by the presence of tumor at sites where chromaffin tissue
          is not normally found (bone, liver, lung, lymph node) - the WHO 2022 endocrine classification
          retired the benign/malignant dichotomy because all PPGL carry some metastatic potential. Risk
          is dominated by genotype: SDHB is the strongest predictor, with FH close behind, and both share
          the severe hypermethylator phenotype. Extra-adrenal primary site, larger tumor size and a dopaminergic
          (3-methoxytyramine-producing) biochemical profile add further risk. This node is the reason
          SDHB carriers receive the most intensive lifelong imaging surveillance. Germline risk is compounded
          by acquired somatic events: loss-of-function ATRX mutations recur specifically in SDHB-mutant
          tumors and are an independent outcome marker, and the resulting alternative lengthening of telomeres
          is a candidate therapeutic vulnerability. Somatic ATRX/TERT lesions are modeled here as a modifier
          of this node rather than as separate pathophysiology nodes, because they are acquired and not
          part of the germline predisposition axis this entry scopes.'
      selected_evidence:
        snippet: our analysis confirmed SDHB germline mutations, ATRX somatic mutations and Ki-67 expression
          as clinical outcome markers
        supports: SUPPORT
    origin:
