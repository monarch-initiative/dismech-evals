    evidence_metadata:
      reference: PMID:36531507
      reference_title: Low number of neurosecretory vesicles in neuroblastoma impairs massive catecholamine
        release and prevents hypertension.
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      explanation: 'Two contiguous sentences from the introduction of this study''s structured abstract
        state both halves of the claim: plasma catecholamine concentrations generally remain normal in
        children with neuroblastoma, and, unlike in pheochromocytoma and paraganglioma, hypertension is
        not part of the usual clinical picture of neuroblastoma. The authors give both points without
        a citation, as the premise of the study rather than as one of its results. The study measured
        no blood pressure, and its own plasma measurements compared neuroblastoma with pheochromocytoma
        and paraganglioma (finding lower catecholamines in neuroblastoma) rather than with healthy controls
        or a reference interval, so it does not itself test the statement that the concentrations remain
        normal. ''Generally'' and ''usual'' leave room for exceptions: the paper''s discussion refers
        to rare patients with neuroblastoma diagnosed with tumor-induced hypertension without renal artery
        compression. The contrast is with pheochromocytoma and paraganglioma as a group; the source does
        not single out the head-and-neck parasympathetic paragangliomas, which this entry records as usually
        non-secreting.'
