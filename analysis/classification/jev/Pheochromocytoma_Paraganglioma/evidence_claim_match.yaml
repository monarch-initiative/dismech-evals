    evidence_metadata:
      reference: PMID:36531507
      reference_title: Low number of neurosecretory vesicles in neuroblastoma impairs massive catecholamine
        release and prevents hypertension.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'Abstract result of a study that measured plasma catecholamines and metanephrines by
        UHPLC-MS/MS in patients with neuroblastoma at diagnosis and in patients with pheochromocytoma
        or paraganglioma, on samples taken as part of diagnostic testing for either tumor. The abstract
        sentence says PHEO, but the plasma comparison group in the methods and figure legend is PHEO/PGL.
        Summed plasma metanephrines (methoxytyramine, normetanephrine and metanephrine) were comparable
        between the groups (neuroblastoma n=41, PHEO/PGL n=57), and summed plasma catecholamines were
        3.5-fold lower in neuroblastoma (neuroblastoma n=31, PHEO/PGL n=47). This directly supports the
        claim''s two group-level comparisons. It does not test whether either measure separates individual
        patients: the paper compares group geometric means with a Mann-Whitney test and reports no cut-off,
        sensitivity or specificity. Plasma metanephrines were measured as total (free plus sulfate-conjugated)
        forms, not as the plasma free metanephrines this entry uses for diagnosis. The neuroblastoma plasma
        cohort covered all stages and ages, the paper reports no age matching with the PHEO/PGL group,
        and its discussion calls the plasma catecholamine difference slight.'
