    evidence_metadata:
      reference: PMID:33651160
      reference_title: Composite phaeochromocytomas-a systematic review of published literature.
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      explanation: 'Systematic review of composite pheochromocytoma case reports. Medline was searched
        on 16 April 2020, and reports not written in English were excluded, giving 62 studies (51 of them
        single-case reports) and 94 patients; the authors'' own two cases are reported separately. The
        abstract names ganglioneuroma as the most common tumor component with pheochromocytoma and lists
        ganglioneuroblastoma, neuroblastoma and malignant peripheral nerve sheath tumors among the others.
        Table 2 gives the counts for all 94 patients: ganglioneuroma 61 (65%), ganglioneuroblastoma 15
        (16%) and neuroblastoma 10 (11%). These are counts of published cases, not population frequencies:
        they reflect what has been reported, not how often each component occurs.'
