        name: Composite Pheochromocytoma
        description: A composite pheochromocytoma is a tumor that contains a second, separate tumor of
          neuronal origin in addition to the pheochromocytoma (chromaffin-cell tumor) component. NCIT
          files it under both adrenal gland pheochromocytoma and composite paraganglioma, so it is a form
          of the Pheochromocytoma subtype above. The component combined with the pheochromocytoma is most
          often a ganglioneuroma; ganglioneuroblastoma, neuroblastoma and malignant peripheral nerve sheath
          tumor components also occur. Across 94 published patients from 62 studies pooled in one systematic
          review, that component was ganglioneuroma in 61 (65%), ganglioneuroblastoma in 15 (16%) and
          neuroblastoma in 10 (11%). In the same review the genetic predisposition syndromes recorded
          were NF1 in 18 (19%), MEN 2A in 4 (4%) and von Hippel-Lindau syndrome in 2 (2%), and no syndrome
          was recorded for 68. The review's table of underlying genetic syndromes also lists WDHA (watery
          diarrhea, hypokalemia and achlorhydria) syndrome for the remaining 2 (2%), and the authors count
          it among the genetic syndromes in their figure of a genetic cause in at least 28% of patients.
          These are counts of published case reports, not population frequencies.
        subtype_term:
          preferred_term: composite pheochromocytoma
          term:
            id: NCIT:C48306
            label: Adrenal Gland Composite Pheochromocytoma
      selected_evidence:
        snippet: Composite phaeochromocytoma is a tumour containing a separate tumour of neuronal origin
          in addition to a chromaffin cell tumour.
        supports: SUPPORT
        directness: DIRECT
