        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Testing and Cascade Screening
        description: Germline testing is recommended for all patients with PPGL, not only those with a
          family history, because roughly 40% carry a germline variant and a substantial minority of apparently
          sporadic presentations are hereditary. A positive result changes surveillance intensity, informs
          the site and biochemical phenotype to expect, predicts metastatic risk (SDHB highest), and enables
          cascade testing of relatives. SDHB immunohistochemistry on resected tumor is a cost-effective
          way to triage which patients need SDHx sequencing. For SDHD and SDHAF2, the parent-of-origin
          effect must be explained carefully during counselling.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: The diagnosis is established in a proband with a personal or family history of paraganglioma
          or pheochromocytoma and a germline heterozygous pathogenic variant in MAX, SDHA, SDHAF2, SDHB,
          SDHC, SDHD, or TMEM127 identified by molecular genetic testing.
        supports: SUPPORT
