      explanation: 'Results text of the same plasma comparison. Its first clause repeats that summed plasma
        metanephrines were at similar concentrations in neuroblastoma and pheochromocytoma; the plasma
        comparison group in the methods and figure legend is pheochromocytoma or paraganglioma. Its second
        clause directly supports the claim''s profile clause: within that total, methoxytyramine was higher
        and metanephrine lower in neuroblastoma, which the discussion describes as expected from the noradrenergic
        phenotype of neuroblastoma. It says nothing about catecholamines. These are group-level comparisons,
        and the paper''s main text gives no statistic or cut-off for the individual plasma metabolites.
        A raised methoxytyramine does not by itself point to neuroblastoma: this entry also records dopamine
        production, measured as 3-methoxytyramine, by Cluster 1 PPGL (the Noradrenergic and Dopaminergic
        Secretory Phenotype node).'
