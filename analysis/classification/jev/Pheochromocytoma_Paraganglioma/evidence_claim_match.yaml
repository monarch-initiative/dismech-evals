      assertion_type: Treatment
      assertion:
        name: Peptide Receptor Radionuclide Therapy (177Lu-DOTATATE)
        description: 'Somatostatin-receptor-targeted radionuclide therapy for progressive metastatic PPGL,
          exploiting the high SSTR2 expression of these tumors that also underlies 68Ga-DOTATATE PET imaging.
          A phase 2 trial showed a 6-month progression-free survival rate of 0.861 overall, but with a
          clinically important genotype split: SDHx-mutated patients did significantly worse than apparently
          sporadic patients. A distinctive hazard is catecholamine release syndrome from radiation-induced
          tumor lysis, seen at grade 3 or above in 17%, which is why pretreatment alpha-blockade and sometimes
          planned intensive-care monitoring are used.'
        therapeutic_modality: RADIOTHERAPY
        treatment_term:
