    evidence_metadata:
      reference: PMID:28752484
      reference_title: 'Composite Pheochromocytoma/Paraganglioma-Ganglioneuroma: A Clinicopathologic Study
        of Eight Cases with Analysis of Succinate Dehydrogenase.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'Gupta et al. 2017 report their own series of eight composite pheochromocytoma/paraganglioma-ganglioneuromas:
        seven were adrenal pheochromocytomas and one was an extra-adrenal paraganglioma, in the retroperitoneum.
        This is primary case data for adrenal predominance; the second sentence is quoted to place the
        extra-adrenal case, not for its neurofibromatosis type 1 association. The support is indirect
        because the statement that most composite tumors are adrenal generalizes from this single series
        of eight cases. The series gives no literature count, and its retroperitoneal case is not among
        the 17 in the Tzikos et al. 2022 review (Table 2), so that count is a review''s tally rather than
        a census. The series cannot show how often the second component is a ganglioneuroma, because every
        case was selected for having one.'
