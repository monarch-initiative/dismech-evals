      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant with maternal imprinting (SDHD, SDHAF2)
        inheritance_term:
          preferred_term: Autosomal dominant inheritance with maternal imprinting
          term:
            id: HP:0012275
            label: Autosomal dominant inheritance with maternal imprinting
        penetrance: INCOMPLETE
        penetrance_percentage: 'Paternally inherited SDHD: 43.2% by age 60 (Kaplan-Meier analysis of non-probands).
          Maternally inherited SDHD carriers have a tumour risk approaching that of the general population.'
        parent_of_origin_effect: Paternal transmission required for expression in SDHD and SDHAF2 (and
          possibly MAX); a strong bias rather than an absolute rule, since exceptions after maternal transmission
          are documented.
        description: 'SDHD- and SDHAF2-related disease shows a striking parent-of-origin effect: carriers
          who inherit the variant from their father are at high risk, while those who inherit the same
          variant from their mother very rarely develop tumors. Stated precisely, this is a strong bias
          and not an absolute law - rare, well-documented cases of disease after maternal transmission
          exist, so maternally inheriting carriers should still be counselled and offered surveillance
          rather than discharged. The HPO term ''maternal imprinting'' denotes silencing of the maternally
          inherited copy, which is the correct orientation here; the underlying somatic event is loss
          of the entire maternal chromosome 11, so the phenomenon is not classical imprinting alone.'
      selected_evidence:
        snippet: In SDHD (11q23)-linked families, the disease phenotype is expressed only upon paternal
          transmission of the mutation, consistent with maternal imprinting.
        supports: SUPPORT
