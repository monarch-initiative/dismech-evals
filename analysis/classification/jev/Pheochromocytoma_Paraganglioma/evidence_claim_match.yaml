    evidence_metadata:
      reference: PMID:33651160
      reference_title: Composite phaeochromocytomas-a systematic review of published literature.
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      explanation: 'Table 2 of this systematic review lists, under the heading Underlying genetic syndrome,
        the syndrome recorded for each of the 94 patients it pooled from published reports (the authors''
        own two cases are tabulated separately, in Table 1). The block''s five rows cover all 94: none
        recorded in 68, NF-1 in 18 (19%), MEN 2A in 4 (4%), von Hippel-Lindau syndrome in 2 (2%) and WDHA
        (watery diarrhea, hypokalemia and achlorhydria) syndrome in 2 (2%). The authors list WDHA syndrome
        under this heading and count it in their 28% genetic-cause figure (abstract and discussion), so
        that figure is not a total of NF1, MEN 2A and von Hippel-Lindau syndrome. These are syndromes
        recorded in published case reports, not a germline-testing yield: the abstract says a genetic
        cause was identified in at least 28%, so None means that no syndrome was recorded, not that one
        was excluded. The table prints 73% for the None row, which with the 28% figure sums to more than
        100%, so only the count is used for that row.'
