      assertion_type: Pathophysiology
      assertion:
        name: Succinate Accumulation and Oncometabolite Signaling
        conforms_to: oncometabolite_dioxygenase_inhibition#Competitive Inhibition of 2-Oxoglutarate-Dependent
          Dioxygenases
        biological_scale: MOLECULAR
        role: central_effector
        description: 'Succinate accumulating behind the complex II block acts as an oncometabolite. Because
          succinate is a structural analog of 2-oxoglutarate (alpha-ketoglutarate), it competitively inhibits
          the large family of 2-oxoglutarate-dependent dioxygenases. This single biochemical event is
          the branch point from which both arms of Cluster 1A pathology derive: inhibition of the TET
          DNA 5-methylcytosine dioxygenases and JmjC histone demethylases produces the hypermethylator
          phenotype, while inhibition of the HIF prolyl hydroxylases (PHDs) produces pseudohypoxia. The
          same logic applies to fumarate in FH-mutant tumors, which display an ''SDH-like'' epigenetic
          phenotype.'
        molecular_functions:
        - preferred_term: 2-oxoglutarate-dependent dioxygenase activity
          modifier: DECREASED
          term:
            id: GO:0016706
            label: 2-oxoglutarate-dependent dioxygenase activity
        cell_types:
        - preferred_term: chromaffin cell
          term:
            id: CL:0000166
            label: chromaffin cell
      selected_evidence:
        snippet: SDHx mutations lead to the accumulation of succinate, which acts as an oncometabolite
          by inhibiting iron(II) and alpha-ketoglutarate-dependent dioxygenases thereby regulating the
          cell's hypoxic response and epigenetic processes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
