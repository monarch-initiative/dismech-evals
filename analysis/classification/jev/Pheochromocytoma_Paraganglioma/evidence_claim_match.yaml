              label: pheochromocytoma-paraganglioma
        context: []
      assertion_type: Treatment
      assertion:
        name: MIBG Therapy
        description: 131I-MIBG (metaiodobenzylguanidine) is a targeted radiotherapy for MIBG-avid metastatic
          PPGL. MIBG is a guanethidine analogue taken up by the noradrenaline transporter, which is what
          makes it selective for chromaffin tumors; roughly half of metastatic PPGLs are avid enough to
          be treatable. High-specific-activity 131I-MIBG (iobenguane I-131) is FDA-approved on the strength
          of a single-arm phase 2 trial in 68 patients whose primary endpoint was a durable halving of
          antihypertensive requirement - an unusual endpoint chosen because it measures the secretory
          burden rather than tumor bulk, which is why this treatment is modeled as acting on both the
          metastatic and the secretory nodes.
        therapeutic_modality: RADIOTHERAPY
        treatment_term:
          preferred_term: radiopharmaceutical therapy
          term:
            id: NCIT:C192439
            label: Radiopharmaceutical Therapy
          therapeutic_agent:
          - preferred_term: iobenguane I-131
            term:
              id: NCIT:C970
              label: Iobenguane I-131
      selected_evidence:
        snippet: Of the 68 patients who received at least 1 therapeutic dose of HSA 131I-MIBG, 17 (25%;
          95% confidence interval, 16%-37%) had a durable reduction in baseline antihypertensive medication
          use.
        supports: SUPPORT
