      assertion:
        name: Neuroblastoma
        description: 'Pheochromocytoma, sympathetic paraganglioma and neuroblastoma arise from the adrenal
          medulla or sympathetic ganglia and typically produce catecholamines, and neuroblastoma can occur
          anywhere along the sympathetic chain, most often in the abdomen and adrenal medulla, so their
          sites overlap. Pheochromocytoma and paraganglioma typically occur in adults and are composed
          of differentiated cells, whereas neuroblastoma is a pediatric tumor resulting from abnormal
          differentiation and maturation of sympathetic progenitors. The two can also occur in one tumor:
          neuroblastoma is one of the recorded second components of a composite pheochromocytoma (see
          the Composite Pheochromocytoma subtype).'
        distinguishing_features:
        - 'Age: 50% of neuroblastoma cases are diagnosed before 2 years of age and 90% before 5 years,
          whereas PPGL peaks between the third and fifth decades of life, although approximately 20% of
          PPGL cases are pediatric.'
        - 'Unlike in pheochromocytoma and paraganglioma, hypertension is not part of the usual clinical
          picture of neuroblastoma, in which plasma catecholamine concentrations generally remain normal.
          Hypertension does occur in a minority of patients with neuroblastoma, however: two reports put
          its prevalence at 2.2% to 10%, and it is attributed mainly to renal artery compression.'
        - In one study comparing patients with neuroblastoma at diagnosis with patients with pheochromocytoma
          or paraganglioma, summed total plasma metanephrines (free plus sulfate-conjugated methoxytyramine,
          normetanephrine and metanephrine) were comparable in the two groups, while plasma catecholamines
          were 3.5-fold lower in neuroblastoma; within the summed metanephrines, methoxytyramine was higher
          and metanephrine lower in neuroblastoma.
        disease_term:
          preferred_term: neuroblastoma
          term:
            id: MONDO:0005072
            label: neuroblastoma
        notes: Curated in full as a separate entry (Neuroblastoma).
      selected_evidence:
        snippet: Plasma levels of metanephrines were comparable between NB and PHEO patients, while catecholamines
          were 3.5-fold lower in NB vs PHEO affected individuals.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /differential_diagnoses/8
      evidence_path: /differential_diagnoses/8/evidence/4
