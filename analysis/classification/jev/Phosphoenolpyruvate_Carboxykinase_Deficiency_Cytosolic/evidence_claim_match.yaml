      assertion_type: Pathophysiology
      assertion:
        name: PCK1 Cytosolic PEPCK Deficiency
        biological_scale: MOLECULAR
        role: trigger
        description: Biallelic loss-of-function PCK1 variants deplete cytosolic phosphoenolpyruvate carboxykinase
          (PEPCK-C) activity. The enzyme catalyzes the GTP-dependent decarboxylation and phosphorylation
          of oxaloacetate to phosphoenolpyruvate, the first committed and rate-limiting cytosolic step
          of gluconeogenesis. Expression of a mutant allele in COS-1 cells produced an enzyme incapable
          of normal function, confirming the variants as loss-of-function.
        genes:
        - preferred_term: PCK1
          term:
            id: hgnc:8724
            label: PCK1
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: phosphoenolpyruvate carboxykinase (GTP) activity
          term:
            id: GO:0004613
            label: phosphoenolpyruvate carboxykinase (GTP) activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: The COS-1 transfected cells showed the mutant gene to be incapable of producing a normally
          functioning cytosolic phosphoenolpyruvate carboxykinase (PEPCK) enzyme.
        supports: SUPPORT
