      assertion_type: Discussion
      assertion:
        discussion_id: gap_pgk1_tissue_selectivity
        prompt: Why do variants in a ubiquitously expressed enzyme produce hemolysis alone, myopathy alone,
          or central nervous system disease in different patients, and why does the same variant (p.Thr378Pro)
          cause isolated myopathy in one man and myopathy with parkinsonism in another?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced Glycolytic ATP Generation
        - pathophysiology#Neuronal Energy Failure
        - mechanistic_hypotheses#pgk1_residual_glycolytic_capacity_model
        rationale: Molecular stability and catalytic data correlate with tissue pattern for some variant
          classes but not others, and the authors of the largest study point to environmental, genetic
          and epigenetic modifiers. A co-inherited NUBPL disruption worsened one PGK1 phenotype, which
          shows that modifiers exist. Resolving this decides whether a patient's neurological prognosis
          can be predicted from genotype.
      selected_evidence:
        snippet: The reason for different clinical manifestations of mutations of the same gene remains
          unknown.
        supports: SUPPORT
