        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pgk1_residual_glycolytic_capacity_model
        hypothesis_label: Residual glycolytic capacity determines tissue involvement
        status: EMERGING
        description: 'The degree to which glycolytic flux is lost, set by the combined effect of a variant
          on catalytic efficiency and on protein stability, determines which tissues fail. In a case series,
          the lowest residual activity accompanied multisystem disease and the smallest ischemic lactate
          rise. The model does not account for every genotype: some variants with mild molecular defects
          produce broad phenotypes, and one recurrent variant has produced both isolated myopathy and
          myopathy with parkinsonism.'
      selected_evidence:
        snippet: Lower glycolytic capacity in PGK1 deficiency seems to result in multisystem involvement
          and increased susceptibility to exertional rhabdomyolysis.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
