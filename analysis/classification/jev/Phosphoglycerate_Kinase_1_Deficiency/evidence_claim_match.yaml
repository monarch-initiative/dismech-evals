        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PGK1 Enzyme Instability and Catalytic Deficiency
        description: Hemizygous PGK1 variants in males reduce phosphoglycerate kinase activity, most often
          by lowering the kinetic stability of the enzyme so that it denatures quickly at body temperature,
          and to a variable extent by impairing catalysis. Residual activity is retained in every reported
          patient; complete loss-of-function alleles have not been observed, which suggests that some
          PGK1 function is needed for male viability.
        role: trigger
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HEMIZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
        genes:
        - preferred_term: PGK1
          term:
            id: hgnc:8896
            label: PGK1
        molecular_functions:
        - preferred_term: phosphoglycerate kinase activity
          term:
            id: GO:0004618
            label: phosphoglycerate kinase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Most mutations heavily affect thermal stability and to a different extent catalytic efficiency,
          in line with the remarkably low PGK activity clinically observed in the patients.
        supports: SUPPORT
