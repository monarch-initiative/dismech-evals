      assertion:
        name: Reduced Glycolytic ATP Generation
        description: 'Reduced PGK1 activity lowers flux through the lower half of glycolysis and the ATP
          it yields. Tissues differ in how much this matters: mature erythrocytes have no mitochondria
          and depend on glycolysis entirely, skeletal muscle depends on it during brief intense or ischemic
          exertion, and neurons may fail to replace unstable enzyme fast enough. How severe the loss of
          flux is in a given patient is associated with which tissues are affected.'
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        biological_processes:
        - preferred_term: glycolytic process
          term:
            id: GO:0006096
            label: glycolytic process
          modifier: DECREASED
        chemical_entities:
        - preferred_term: ATP
          term:
            id: CHEBI:15422
            label: ATP
          modifier: DECREASED
      selected_evidence:
        snippet: Thus, an increased degradation rate of such variants leads to a decreased PGK1 content
          which primarily accounts for the enzyme deficiency and in turn for a reduced ATP production.
        supports: SUPPORT
