      assertion_type: Pathophysiology
      assertion:
        name: Neuronal Energy Failure
        description: The neurological syndrome is attributed to inadequate glycolytic ATP supply in the
          central nervous system, possibly because neural tissue does not replace the unstable enzyme
          quickly enough. This is supported by a Drosophila PGK mutant with reduced brain ATP, seizures
          and a later loss of synaptic transmission. Brain ATP has not been measured in patients, and
          neurological disease is associated with unstable variants that are only mildly impaired catalytically.
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        chemical_entities:
        - preferred_term: ATP
          term:
            id: CHEBI:15422
            label: ATP
          modifier: DECREASED
      selected_evidence:
        snippet: Disruption of ATP generation in nubian animals is accompanied by temperature-dependent
          defects in neuronal activity, with initial seizure activity, followed by an activity-dependent
          loss of synaptic transmission.
        supports: SUPPORT
        directness: INDIRECT
