  bc1d13b970b575b4038709f10cb01c60d07e255a21f1a2a8493fa4b1d66bcbca:
    claim:
      about:
        disease:
          name: Photosensitive Epilepsy
          disease_term:
            preferred_term: photosensitive epilepsy
            term:
              id: MONDO:0015643
              label: photosensitive epilepsy
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Fepi (Fayoumi) photosensitive chicken line
        species: Gallus gallus (Fayoumi-derived Fepi chicken strain)
        genotype: Recessive autosomal mutation in the acceptor site of SV2A intron 2 (synaptic vesicle
          glycoprotein 2A, the levetiracetam binding target), homozygous
        publication: PMID:22046416
        description: A heritable avian model of photic and audiogenic reflex epilepsy in which a splice-site
          mutation in SV2A produces spontaneous, photically triggered seizures, providing a genetically
          defined counterpoint to the still-genetically-unresolved Papio papio model. Brain-chimera transfer
          experiments in this same strain, however, localize its seizure generator to the brain stem rather
          than to visual cortex, which is why this model is scored FAILS_TO_RECAPITULATE below rather
          than PARTIALLY_RECAPITULATES.
        modeled_mechanisms:
        - target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: Reproduces heritable photic (and audiogenic) seizure susceptibility linked to a
            defined synaptic gene, but living neural-chimera experiments in this strain -- replacing specific
            embryonic brain vesicles with their Fepi-donor equivalents -- localize the seizure generator
            to the brain stem (prosencephalon and mesencephalon), not to the visual cortex this entry's
            pathophysiology chain describes.
          limitations: 'The original authors'' own conclusion places the Fepi seizure generator in the
            brain stem: substituting only the mesencephalon transfers the motor seizure, substituting
            only the prosencephalon transfers interictal paroxysmal activity, and total transfer requires
            substituting both. This is a fundamentally different anatomical locus from the visual-cortex
            and thalamocortical mechanism this entry establishes for human photosensitive epilepsy (see
            the Reduced Alpha-Rhythm Network Inhibition and Visual Cortical Hyperexcitability nodes above),
            not merely a difference of degree from avian brain architecture. It is recorded here as a
            documented negative result rather than omitted, so a future curator does not re-propose the
            Fepi line as a cortical model of human photosensitive epilepsy. SV2A is also not among the
            genes implicated in human photosensitive epilepsy -- CHD2, the best-established human risk
            gene curated in this entry, is unrelated to SV2A.'
      selected_evidence:
        snippet: we report that a mutation in the acceptor site of the second intron of SV2A (the gene
          encoding synaptic vesicle glycoprotein 2A) is causing photosensitive reflex epilepsy in a unique
          vertebrate model, the Fepi chicken strain, a spontaneous model where the neurological disorder
          is inherited as an autosomal recessive mutation.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1
      evidence_path: /animal_models/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22046416
