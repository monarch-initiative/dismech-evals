      assertion_type: Pathophysiology
      assertion:
        name: Photoparoxysmal EEG Response
        biological_scale: TISSUE
        description: 'The electrographic signature elicited by intermittent photic stimulation: spike,
          polyspike, or spike-wave discharges appearing during or immediately after the stimulus train,
          usually with a generalized or bilateral field in the syndromes modeled by this entry (in contrast
          to the occipitally confined response of the separately curated photosensitive occipital lobe
          epilepsy subtype). The physiological rule governing elicitation differs by underlying syndrome:
          some patients'' responses depend on stimulus wavelength, while others'', notably in Dravet syndrome,
          depend instead on the total quantity of light delivered.'
      selected_evidence:
        snippet: The authors found two types of pathophysiologic mechanisms of PPRs (wavelength-dependent
          PPRs and quantity-of-light-dependent PPRs) in patients with idiopathic generalized epilepsy
          and hereditary dentatorubral-pallidoluysian atrophy.
        supports: SUPPORT
