          of the resting-state networks that generate the posterior alpha rhythm, the brain''s normal
          idling rhythm, compared with both non-photosensitive epilepsy patients and healthy controls.
          This is a baseline network-level abnormality, present outside of stimulation, and is the excitation-inhibition-imbalance
          amplifier step that this entry''s pathophysiology chain was previously missing: the acute hyperexcitable
          response to flickering light described in the next node is superimposed on a cortex whose inhibitory
          network tone is already reduced.'
        notes: This node deliberately does not carry the module's usual Excitation-Inhibition Imbalance
          annotations, cell_types CL:0000617 (GABAergic neuron) and biological_processes GO:0007214 (GABA
          signaling, DECREASED). The Vaudano et al. finding modeled here is a network-level alpha-rhythm
          inhibition abnormality measured by resting-state EEG-fMRI, not a cellular or molecular claim
          about GABAergic neurotransmission specifically, so binding those GABA-specific terms here would
          overstate what the cited evidence establishes. Recorded here so a future conformance audit reads
          this as a deliberate scope choice rather than an incomplete annotation.
      selected_evidence:
        snippet: This difference consists of a decreased alpha-related inhibition of the visual cortex
          and sensory-motor networks at rest.
