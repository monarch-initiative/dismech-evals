      assertion_type: Genetic
      assertion:
        name: CHD2
        gene_term:
          preferred_term: CHD2
          term:
            id: hgnc:1917
            label: CHD2
        relationship_type: RISK_FACTOR
        association: Unique (singleton) CHD2 variants are significantly over-represented in people with
          photosensitive epilepsies compared to population controls, and are the strongest single-gene
          contributor identified to date. CHD2 encodes an ATP-dependent chromodomain-helicase-DNA-binding
          chromatin remodeler rather than an ion channel, which is notable because nearly every other
          established photosensitive/generalized epilepsy gene encodes a channel or a direct synaptic
          protein; how chromatin remodeling during neurodevelopment produces an acutely provokable cortical
          hyperexcitability is not established. Severe, fully penetrant loss-of-function CHD2 variants
          instead cause a distinct, separately curated developmental and epileptic encephalopathy (kb/disorders/CHD2-Related_Developmental_and_Epileptic_Encephalopathy.yaml);
          the risk-factor association modeled here is the milder, incompletely penetrant end of the same
          gene's phenotypic spectrum, seen in people whose epilepsy is not a fully expressed encephalopathy.
        case_fractions:
        - population: 580 individuals with photosensitive seizures and/or abnormal photoparoxysmal response
            (EuroEPINOMICS CoGIE consortium)
          case_fraction_percent: 1.9
          cohort_size: 580
          notes: 11 of 580 individuals carried a unique CHD2 variant (11/580 ≈ 1.9%), a statistically
            significant excess over the 128/34427 rate in unselected population controls (P = 2.17 x 10^-5),
            but still a minority of cases overall.
        - population: Eyelid myoclonia with absences (Jeavons syndrome) subgroup, n=36
          case_fraction_percent: 8.3
          cohort_size: 36
          notes: 3 of 36 Jeavons syndrome cases carried a unique CHD2 variant.
      selected_evidence:
        snippet: Chd2 knockdown markedly enhanced mild innate zebrafish larval photosensitivity.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
