      assertion:
        name: Antiseizure Pharmacotherapy
        description: 'Valproate is the conventional first-line agent for photosensitive epilepsy and reliably
          suppresses the photoparoxysmal response; levetiracetam is a common alternative, particularly
          favored in girls and young women given valproate''s teratogenicity and other reproductive-health
          concerns. A separate, purely pharmacodynamic sex difference has also been reported: in a within-patient
          retrospective cohort, males showed a significantly greater reduction in the standardized photosensitivity
          range on valproate than females, a finding distinct from (and not explained by) the prescribing
          pattern driven by teratogenicity risk.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
