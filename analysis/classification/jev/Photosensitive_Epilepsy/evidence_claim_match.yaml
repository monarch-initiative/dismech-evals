      assertion_type: Inheritance
      assertion:
        name: Genetically complex, polygenic trait with identified contributing loci
        description: Photosensitivity itself is a heritable EEG trait most consistent with complex, polygenic
          inheritance rather than a single Mendelian pattern. CHD2 is the best-established single-gene
          risk-factor contributor identified to date (see genetic section), but unique CHD2 variants explain
          only a minority of photosensitive-epilepsy cases, and the condition as a whole is genetically
          heterogeneous. Individual named subtypes carry their own, separately curated inheritance patterns
          in their own entries.
      selected_evidence:
        snippet: 'We identified 11 unique variants in the 580 individuals with photosensitive epilepsies
          and 128 unique variants in the 34 427 controls: unique CHD2 variation is over-represented in
          cases overall (P = 2.17 × 10(-5))'
        supports: SUPPORT
