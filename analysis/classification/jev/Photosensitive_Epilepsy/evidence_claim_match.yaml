        context: []
      assertion_type: Subtype
      assertion:
        name: Pure Photosensitive Epilepsy
        display_name: Pure (Isolated) Photosensitive Epilepsy
        description: 'Photically triggered seizures with no other spontaneous epilepsy syndrome: intermittent
          photic stimulation, and often a specific flicker-frequency range, is the only identified seizure
          trigger, and seizures do not occur in its absence. This is the reflex-epilepsy end of the spectrum.
          No dedicated MONDO identifier is bound for this subtype beyond the root MONDO:0015643 concept
          itself: MONDO''s own children of photosensitive epilepsy (photoparoxysmal response 1-3, part
          of OMIM phenotypic series PS132100) are genetic-linkage loci mapped from family studies of the
          photoparoxysmal EEG trait, not a distinct clinical entity matching this description, so binding
          one of them here would overstate what they represent.'
      selected_evidence:
        snippet: Epilepsy with seizures provoked by intermittent light stimulation is a distinct group
          of epilepsies
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35807051
      reference_title: Photo-Dependent Reflex Seizures-A Scoping Review with Proposal of Classification.
      evidence_source: OTHER
      explanation: A recent scoping review treats photically provoked epilepsy as its own distinct group,
        supporting a pure reflex form separate from photosensitivity riding along with another syndrome.
