  f8327692128bc1020eb4e197871ae77ff3024615d4ebd5362ae8a423fc5bc997:
    claim:
      about:
        disease:
          name: Photosensitive Epilepsy
          disease_term:
            preferred_term: photosensitive epilepsy
            term:
              id: MONDO:0015643
              label: photosensitive epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chd2_chromatin_to_hyperexcitability_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does CHD2, a chromatin remodeler with no known direct role in ion transport
          or synaptic transmission, produce an acutely provokable cortical hyperexcitability, and does
          that mechanism converge on the same excitation-inhibition imbalance this entry's pathophysiology
          chain describes for the channelopathy-driven photosensitive syndromes?
        attaches_to:
        - genetic#CHD2
        - pathophysiology#Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
        rationale: 'Every other well-established photosensitive or generalized epilepsy gene referenced
          across this entry''s subtypes and elsewhere in the knowledge base encodes an ion channel or
          a direct synaptic protein, fitting naturally into the excitation-inhibition imbalance framework
          this entry conforms to. CHD2 is different by the original authors'' own framing: it is a chromatin
          remodeler, and how altering chromatin state during neurodevelopment produces a cortex that overreacts
          to a stimulus delivered in real time, rather than a fixed developmental malformation, is not
          established. The zebrafish knockdown result shows the effect is causal, not merely correlational,
          but does not by itself identify the intermediate steps between chromatin remodeling and acute
          photic-response hyperexcitability, so this is recorded as a knowledge gap rather than folded
          into the pathophysiology chain as an established mechanism.'
        proposed_experiments:
        - experiment_id: chd2_downstream_expression_profiling
          name: Transcriptomic profiling of visual-cortex neurons in a Chd2-deficient model
          description: Single-cell or bulk transcriptomic and chromatin-accessibility profiling of visual-cortex
            neurons in a Chd2-deficient animal model, testing whether loss of Chd2 dysregulates expression
            of ion-channel or synaptic genes already implicated in the excitation-inhibition imbalance
            module, which would identify a convergent downstream pathway.
          decision_criterion: Dysregulation of known excitability genes would support convergence on the
            module's existing framework; a distinct or absent transcriptional signature in relevant excitability
            genes would indicate CHD2 acts through a genuinely separate mechanism not yet captured by
            the module.
      selected_evidence:
        snippet: CHD2 does not encode an ion channel, opening new avenues for research into human cortical
          excitability.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25783594
      reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
      evidence_source: HUMAN_CLINICAL
      explanation: The authors' own statement of the mechanistic gap this discussion records.
