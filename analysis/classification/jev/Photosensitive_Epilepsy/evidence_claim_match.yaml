  d6a98060005095b54061dfee0ea94167cc499849b6272ce4b64b50d5ce1a86bb:
    claim:
      about:
        disease:
          name: Photosensitive Epilepsy
          disease_term:
            preferred_term: photosensitive epilepsy
            term:
              id: MONDO:0015643
              label: photosensitive epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pse_provoked_seizure_module_boundary
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Should photosensitive epilepsy conform to the epilepsy_excitation_inhibition_imbalance
          module's terminal node, Recurrent Unprovoked Seizures, given that its defining feature is a
          reproducibly provoked seizure, and how should that boundary be recorded when a subtype (JME,
          Dravet, the PMEs) genuinely has both provoked and unprovoked seizures?
        attaches_to:
        - pathophysiology#Recurrent Visually Provoked Seizures
        rationale: 'This entry declares conformance to epilepsy_excitation_inhibition_imbalance at the
          Neuronal Hyperexcitability and Hypersynchrony node and stops there, for the same reason already
          recorded in kb/disorders/Photosensitive_Occipital_Lobe_Epilepsy.yaml: the module''s terminal
          node is Recurrent Unprovoked Seizures, and reflex seizures are elicited by definition, so declaring
          conformance there would assert the negation of the defining property of the reflex component
          this entry models. The complication specific to this root entry, and not shared by POLE, is
          that most of its named subtypes (JME, Jeavons syndrome, Dravet syndrome, the PMEs) are not purely
          reflex: they also have genuinely spontaneous, unprovoked seizures, and those subtypes'' own
          separately curated entries may correctly conform to the terminal node for that reason. This
          entry''s photosensitivity-scoped pathophysiology chain should not be read as contradicting that;
          it describes only the reflex component common to the whole family, deliberately leaving the
          unprovoked-seizure question to each subtype''s own full entry.'
        proposed_experiments:
        - experiment_id: pse_module_node_audit
          name: Audit of reflex-epilepsy and mixed-trigger entries against the module terminal node
          description: Extending the audit already proposed in the Photosensitive_Occipital_Lobe_Epilepsy
            entry, specifically compare how the terminal node is (or is not) declared across purely reflex
            entries versus mixed entries like this one that have both a reflex-scoped root and unprovoked-seizure-capable
            subtypes.
          decision_criterion: If curators consistently split conformance the way this entry does (reflex
            root stops short, individual mixed subtype entries conform separately), that confirms the
            current approach as the intended pattern rather than an ad hoc choice, and the module documentation
            should say so explicitly.
      selected_evidence:
        snippet: Reflex seizures (RS) are epileptic events that are objectively and consistently elicited
          in response to a specific afferent stimulus or by an activity of the patient.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34221545
      reference_title: Reflex Epilepsy.
      evidence_source: OTHER
      explanation: Establishes reflex seizures as provoked by definition, creating the conflict with the
        module's unprovoked terminal node that this discussion is about. Evidence source is OTHER because
