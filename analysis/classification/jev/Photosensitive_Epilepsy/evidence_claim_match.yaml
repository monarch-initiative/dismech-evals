            relationship_type: RISK_FACTOR
            association: Unique (singleton) CHD2 variants are significantly over-represented in people
              with photosensitive epilepsies compared to population controls, and are the strongest single-gene
              contributor identified to date. CHD2 encodes an ATP-dependent chromodomain-helicase-DNA-binding
              chromatin remodeler rather than an ion channel, which is notable because nearly every other
              established photosensitive/generalized epilepsy gene encodes a channel or a direct synaptic
              protein; how chromatin remodeling during neurodevelopment produces an acutely provokable
              cortical hyperexcitability is not established. Severe, fully penetrant loss-of-function
              CHD2 variants instead cause a distinct, separately curated developmental and epileptic encephalopathy
              (kb/disorders/CHD2-Related_Developmental_and_Epileptic_Encephalopathy.yaml); the risk-factor
              association modeled here is the milder, incompletely penetrant end of the same gene's phenotypic
              spectrum, seen in people whose epilepsy is not a fully expressed encephalopathy.
