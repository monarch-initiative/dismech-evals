            term:
              id: MONDO:0015643
              label: photosensitive epilepsy
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Fixation-Off Sensitivity Epilepsies
        description: 'Epilepsies, such as childhood occipital visual epilepsy, in which removing central
          visual fixation (eye closure in darkness, or convergence) rather than photic stimulation itself
          is the gating electrographic phenomenon. Distinguished by the opposite manipulation: photosensitive
          epilepsy''s photoparoxysmal response requires a light stimulus, while fixation-off sensitivity
          requires the absence of structured foveal vision.'
        distinguishing_features:
        - The gating manipulation is loss of central fixation, not delivery of a light or pattern stimulus.
        - Seizures occur spontaneously rather than being elicited by an external visual trigger.
      selected_evidence:
        snippet: 'Epilepsy syndromes beginning in childhood have been divided into three categories: (1)
          self-limited focal epilepsies, comprising four syndromes: self-limited epilepsy with centrotemporal
          spikes, self-limited epilepsy with autonomic seizures, childhood occipital visual epilepsy,
          and photosensitive occipital lobe epilepsy'
        supports: SUPPORT
    origin:
