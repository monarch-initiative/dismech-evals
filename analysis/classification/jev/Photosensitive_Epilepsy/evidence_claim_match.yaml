          rather than omitted, so a future curator does not re-propose the Fepi line as a cortical model
          of human photosensitive epilepsy. SV2A is also not among the genes implicated in human photosensitive
          epilepsy -- CHD2, the best-established human risk gene curated in this entry, is unrelated to
          SV2A.'
      selected_evidence:
        snippet: We conclude that the Fepi is a good model of brain stem reflex epilepsy and suggest that
          the brain stem is a generator of some other animal and human genetic reflex "epileptic syndromes".
        supports: SUPPORT
