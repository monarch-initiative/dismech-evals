      assertion_type: Subtype
      assertion:
        name: Photosensitivity in Dravet Syndrome
        subtype_term:
          preferred_term: Dravet syndrome
          term:
            id: MONDO:0100135
            label: Dravet syndrome
        description: 'Dravet syndrome is fully curated as its own dismech entry (kb/disorders/Dravet_syndrome.yaml);
          this subtype block scopes only the photosensitivity trait within it. Photosensitivity in Dravet
          syndrome (historically described under the older name severe myoclonic epilepsy in infancy,
          SMEI) has been shown to follow a different physiological rule from most other photosensitive
          epilepsies: the photoparoxysmal response tends to depend on the total quantity of light delivered
          rather than on its wavelength, unlike the wavelength-dependent pattern more typical of localization-related
          and symptomatic generalized epilepsies.'
      selected_evidence:
        snippet: Four of the six photosensitive SMEI patients had quantity-of-light-dependent PPRs.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/4
      evidence_path: /has_subtypes/4/evidence/0
      context_paths:
