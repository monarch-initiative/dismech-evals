      assertion:
        name: Papio papio photosensitive baboon
        species: Papio papio (baboon)
        genotype: Naturally occurring, heritable generalized photosensitivity trait; no causal mutation
          has yet been identified.
        publication: PMID:26875109
        description: 'The classic naturally occurring primate model of generalized photosensitive epilepsy:
          colonies of Papio papio baboons show a heritable predisposition to generalized epileptiform
          discharges and motor seizures on intermittent photic stimulation, closely paralleling the human
          photoparoxysmal response, and have been used for decades to study visual-network propagation
          and antiseizure pharmacology.'
        modeled_mechanisms:
        - target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Reproduces the core trait this entry's pathophysiology chain begins with -- a heritable
            cortical hyperexcitability to flickering light -- in a species phylogenetically closer to
            humans than the rodent and avian models available for this trait.
          limitations: No causal genetic lesion has been identified in Papio papio despite a presumed
            genetic etiology, so the model cannot yet be used to test any specific human candidate variant
            (including CHD2), and primate colony availability sharply limits its use relative to zebrafish
            or mouse models.
          readouts:
          - name: Ictal and Interictal Epileptiform EEG Discharges During Intermittent Light Stimulation
            target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
            interpretation: 'The electrographic readout by which photosensitive, epileptic (PS) baboon
              colonies are distinguished from asymptomatic control (CTL) animals: ictal and interictal
              epileptiform EEG discharges occurring during intermittent light stimulation. Renamed from
              an earlier, more specific "motor seizure response" framing after the cited source was found
              to establish the electrographic discharge readout directly but not a separately quantified
              motor-seizure measurement.'
      selected_evidence:
        snippet: our group utilized functional positron emission tomography (PET) to compare cerebral
          blood flow (CBF) changes occurring during intermittent light stimulation (ILS) and rest between
          baboons photosensitive, epileptic (PS) and asymptomatic, control (CTL) animals.
        supports: SUPPORT
