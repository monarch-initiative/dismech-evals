      assertion_type: DifferentialDiagnosis
      assertion:
        name: Self-Induced (Sunflower) Photosensitive Epilepsy
        description: A behaviorally distinct entity in which the patient deliberately elicits the photoparoxysmal
          response by waving fingers in front of the eyes in bright light, rather than passively encountering
          an environmental trigger. Not modeled as a subtype here (see notes); no MONDO disease_term is
          bound in this differential-diagnosis block because it names a related concept (MONDO:0100529,
          Sunflower syndrome) that this entry does not itself curate.
        distinguishing_features:
        - The stimulus is self-generated by hand-waving rather than encountered environmentally.
        - Behavior is often compulsive and difficult to interrupt, with a described self-reinforcing quality.
      selected_evidence:
        snippet: Epilepsy with seizures provoked by intermittent light stimulation is a distinct group
          of epilepsies
        supports: SUPPORT
