  af68076f1b3d64985a72072beeb6359b3fc20b91db8e72b58eca7436114747e6:
    claim:
      about:
        disease:
          name: Photosensitive Occipital Lobe Epilepsy
          disease_term:
            preferred_term: photosensitive occipital lobe epilepsy
            term:
              id: MONDO:0100021
              label: photosensitive occipital lobe epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pole_after_discharge_threshold_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What determines whether a photoparoxysmal response remains an electrographic event or
          crosses into a clinically experienced seizure, and is after-discharge amplitude the mechanism
          of that transition or only its correlate?
        attaches_to:
        - pathophysiology#Self-Sustaining Cortical After-Discharge
        rationale: 'This syndrome offers something rare in epilepsy: a threshold that can be approached
          repeatedly under controlled conditions in the same patient. The evoked response amplitude is
          elevated in photosensitive patients, the after-discharge is larger in those who have reflex
          seizures, and the after-discharge is larger still when the paroxysmal response actually becomes
          a seizure. That is a clean graded relationship. What it does not establish is direction. A larger
          after-discharge may be what recruits enough cortex to produce a symptom, in which case it is
          the mechanism of the transition and anything that suppresses it should raise the seizure threshold.
          Or the after-discharge may be a readout of some other state variable, such as the momentary
          level of inhibitory tone or the extent of cortex already engaged, in which case suppressing
          it would change the number without changing the risk. The distinction is directly actionable,
          because after-discharge amplitude is a candidate surrogate endpoint for trials in reflex epilepsy
          and would only be a valid one under the first reading.'
        proposed_experiments:
        - experiment_id: pole_ad_suppression_intervention
          name: Interventional suppression of after-discharge amplitude
          description: Within-patient crossover in which after-discharge amplitude is reduced pharmacologically
            at doses chosen for their effect on that measure, with seizure occurrence under standardized
            provocative stimulation as the outcome, testing whether the amplitude change carries the change
            in clinical risk.
          decision_criterion: If reduction in after-discharge amplitude tracks reduction in provoked seizure
            occurrence within patients, the amplitude is on the causal path. If seizures fall without
            amplitude change, or amplitude falls without a fall in seizures, it is a correlate.
        - experiment_id: pole_trial_level_threshold_modelling
          name: Trial-level modelling of the electrographic-to-clinical transition
          description: Trial-by-trial analysis across repeated stimulation in individual patients, modelling
            whether after-discharge amplitude predicts clinical expression once prior trial history, time
            since last event, and stimulus parameters are accounted for.
          decision_criterion: Retained predictive power after adjustment supports amplitude as an independent
            determinant. Loss of predictive power would indicate it indexes a state variable such as refractoriness
            rather than driving the transition.
      selected_evidence:
        snippet: Thirty-seven of these patients had one or more RS during the procedure of stimulation
          for a total of 66 episodes.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
      context_paths:
      - /name
