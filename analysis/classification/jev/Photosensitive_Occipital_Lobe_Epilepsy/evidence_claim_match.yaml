  3706b63515e29f144a3b509c40cf8c152ac05ea60173a4f8b3d65592e9e3445f:
    claim:
      about:
        disease:
          name: Photosensitive Occipital Lobe Epilepsy
          disease_term:
            preferred_term: photosensitive occipital lobe epilepsy
            term:
              id: MONDO:0100021
              label: photosensitive occipital lobe epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pole_focal_generalized_boundary
        kind: CONTROVERSY
        status: UNDER_DISCUSSION
        prompt: Is photosensitive occipital lobe epilepsy a focal epilepsy that happens to be photosensitive,
          or the focal end of a continuum with photosensitive generalized epilepsy, in which the occipital
          onset is the visible beginning of an event that is generalized from the start?
        attaches_to:
        - pathophysiology#Photoparoxysmal Response
        rationale: Photosensitivity has traditionally belonged to the idiopathic generalized epilepsies,
          and partial seizures with visual symptoms are rarely reported within photosensitive epilepsy
          at all. Yet in this syndrome the first symptom is visual and the discharge is occipital, which
          is focal by any standard reading. The complication is that a majority of patients in the defining
          cohort also showed generalized epileptiform activity on photic stimulation, so the same child
          produces both focal and generalized electrographic responses to the same stimulus. Two readings
          follow. On the first, this is a genuinely focal epilepsy whose occipital focus can secondarily
          engage generalized networks, which is the reading the current nosology takes by placing it among
          the self-limited focal epilepsies. On the second, reflex seizures in general are better understood
          as focal events with rapid secondary generalization through cortico-cortical and cortico-reticular
          pathways, which would make the focal-generalized distinction less fundamental here than the
          classification implies. The original description explicitly proposed that these benign partial
          epilepsies may overlap with one another rather than being cleanly separable.
        proposed_experiments:
        - experiment_id: pole_source_localization_of_generalized_response
          name: Source localization of the generalized photoparoxysmal response
          description: High-density electroencephalography with source modelling during intermittent photic
            stimulation in patients who show both occipital and generalized responses, testing whether
            the generalized discharge has an occipital origin that spreads or arises without a demonstrable
            focal onset.
          decision_criterion: A consistent occipital onset preceding the generalized field would support
            the focal reading with secondary generalization. Generalized onset without demonstrable occipital
            lead would support the continuum reading.
        - experiment_id: pole_stimulus_parameter_dissociation
          name: Dissociation of focal and generalized responses by stimulus parameter
          description: Systematic variation of stimulus parameters, including flash frequency, pattern
            spatial frequency and field size, testing whether the occipital and generalized responses
            are elicited by different parameter ranges within the same patient.
          decision_criterion: Dissociable parameter ranges would indicate two mechanistically separable
            responses rather than one event seen at two scales. Identical thresholds would support a single
            graded phenomenon.
      selected_evidence:
        snippet: Photosensitivity is a typical feature of photosensitive epilepsy which is usually considered
          a form of idiopathic generalized epilepsy. Partial seizures featuring visual symptoms are rarely
          reported in photosensitive epilepsy.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10986003
      reference_title: Reflex occipital lobe epilepsy.
      evidence_source: HUMAN_CLINICAL
      explanation: 'States the classificatory tension precisely: photosensitivity belongs to the generalized
        epilepsies by convention, and focal visual seizures within it are rare.'
