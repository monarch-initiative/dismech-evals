  c9a2ebd292007e55392a3b62655118b2968848891ba33345339b53ba3f3cdec3:
    claim:
      about:
        disease:
          name: Photosensitive Occipital Lobe Epilepsy
          disease_term:
            preferred_term: photosensitive occipital lobe epilepsy
            term:
              id: MONDO:0100021
              label: photosensitive occipital lobe epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pole_provoked_seizure_module_boundary
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Should a syndrome whose seizures are by definition provoked conform to a mechanism module
          whose terminal node is recurrent unprovoked seizures, and if not, what does the module need
          in order to accommodate reflex epilepsy?
        attaches_to:
        - pathophysiology#Recurrent Visually Provoked Reflex Seizures
        rationale: This entry declares conformance to epilepsy_excitation_inhibition_imbalance at the
          hyperexcitability node and deliberately stops there. The module's terminal node is Recurrent
          Unprovoked Seizures, and the seizures of this syndrome are elicited consistently by a specific
          afferent stimulus, which is the definition of provoked. Declaring conformance would assert the
          negation of the syndrome's defining property, and silently omitting the node without explanation
          would leave a future curator to read the omission as an oversight. The underlying question is
          whether the unprovoked qualifier in the module is doing mechanistic work or clinical-definitional
          work. If it is mechanistic, then reflex epilepsy really does diverge from the module at that
          point and needs its own terminal node. If it is definitional, inherited from the clinical definition
          of epilepsy rather than from the excitation-inhibition mechanism, then the module node is misnamed
          and reflex epilepsies conform perfectly well. This is a schema question as much as a biological
          one, and it is recorded here because this syndrome is where it surfaces.
        proposed_experiments:
        - experiment_id: pole_module_node_audit
          name: Audit of reflex epilepsy entries against the module terminal node
          description: A curation audit across all reflex epilepsy syndromes in the knowledge base, recording
            for each whether the terminal module node was declared, omitted, or declared with a caveat,
            to establish whether the boundary is being handled consistently and how often it arises.
          decision_criterion: If several reflex entries independently stop short of the terminal node,
            the module needs either a provoked-seizure terminal node or a rename of the existing one.
            If this entry is the only case, a local note suffices.
        - experiment_id: pole_spontaneous_seizure_prevalence
          name: Prevalence of genuinely spontaneous seizures within the syndrome
          description: Prospective ascertainment, with seizure diaries and ambulatory recording, of what
            fraction of seizures in this syndrome occur without any identifiable visual trigger, including
            the nocturnal events already reported.
          decision_criterion: A substantial fraction of genuinely unprovoked seizures would mean the syndrome
            does reach the module's terminal node and the conformance should be declared. A near-total
            dependence on trigger exposure would confirm the divergence.
      selected_evidence:
        snippet: Reflex seizures (RS) are epileptic events that are objectively and consistently elicited
          in response to a specific afferent stimulus or by an activity of the patient.
        supports: SUPPORT
