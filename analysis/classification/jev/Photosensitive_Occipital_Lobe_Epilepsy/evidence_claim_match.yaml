      assertion:
        name: Photosensitive Idiopathic Generalized Epilepsy
        description: Photosensitivity occurring as a trait within a generalized epilepsy, classically
          juvenile myoclonic epilepsy. Here the photoparoxysmal response accompanies a different syndrome
          rather than defining one, and the seizures it provokes are myoclonic or generalized tonic-clonic
          rather than visual. No MONDO disease_term is bound because this names a trait-plus-syndrome
          combination rather than a single entity.
        distinguishing_features:
        - Provoked seizures are myoclonic or generalized tonic-clonic without a visual opening symptom.
        - Photoparoxysmal response is generalized rather than occipitally confined.
        - Spontaneous generalized seizures and generalized spike-wave dominate the clinical picture.
      selected_evidence:
        snippet: Photosensitivity is a typical feature of photosensitive epilepsy which is usually considered
          a form of idiopathic generalized epilepsy.
