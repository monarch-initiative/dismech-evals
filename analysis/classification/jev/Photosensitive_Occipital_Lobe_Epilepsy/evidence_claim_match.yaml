      assertion_type: Inheritance
      assertion:
        name: Presumed genetic, no established locus
        description: The syndrome is grouped with the self-limited focal epilepsies of childhood, whose
          inheritance is generally regarded as complex rather than Mendelian. Photosensitivity as a laboratory
          trait is separately known to run in families, but no locus has been established for this syndrome,
          and no inheritance_term is bound because the mode of inheritance is not known.
      selected_evidence:
        snippet: 'Epilepsy syndromes beginning in childhood have been divided into three categories: (1)
          self-limited focal epilepsies, comprising four syndromes: self-limited epilepsy with centrotemporal
          spikes, self-limited epilepsy with autonomic seizures, childhood occipital visual epilepsy,
          and photosensitive occipital lobe epilepsy'
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35503717
      reference_title: 'International League Against Epilepsy classification and definition of epilepsy
        syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions.'
      evidence_source: OTHER
      explanation: Places the syndrome among the self-limited focal epilepsies, the family whose inheritance
        is treated as complex, which is the basis for the presumption without a locus.
