              label: photosensitive occipital lobe epilepsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Photoparoxysmal Response
        biological_scale: TISSUE
        description: 'The electrographic event evoked by the stimulus: spikes, polyspikes or spike-wave
          appearing during intermittent photic stimulation, confined to the occipital regions in this
          syndrome or, in a substantial minority, spreading to a generalized field. The photoparoxysmal
          response is the laboratory correlate of the trigger and is what makes the diagnosis reproducible
          on demand. Importantly it is not itself a seizure: most photoparoxysmal responses are electrical
          events the patient does not experience.'
        locations:
        - preferred_term: occipital lobe
          term:
            id: UBERON:0002021
            label: occipital lobe
      selected_evidence:
        snippet: EEG features included normal background activity and occipital spikes or spike-waves
          in all but two patients. Eight patients also showed generalized epileptiform activity during
          intermittent photic stimulation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10986003
      reference_title: Reflex occipital lobe epilepsy.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents the occipital electrographic abnormality against a normal background, and
        records that a majority also showed generalized activity on stimulation, which is the observation
        the focal-versus-generalized discussion is about.
