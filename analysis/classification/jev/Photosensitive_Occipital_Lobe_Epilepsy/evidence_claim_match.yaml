  f3c6c1cb0f50520aa6b756ed19523eafa04e9d8e38ff865a76a47acd473bb6cf:
    claim:
      about:
        disease:
          name: Photosensitive Occipital Lobe Epilepsy
          disease_term:
            preferred_term: photosensitive occipital lobe epilepsy
            term:
              id: MONDO:0100021
              label: photosensitive occipital lobe epilepsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Self-Sustaining Cortical After-Discharge
        biological_scale: TISSUE
        description: 'The node that decides whether anything clinical happens. After the evoked response,
          cortical activity may run on by itself as an after-discharge, and the size of that after-discharge
          is what separates an electrical event from an experienced seizure: it is larger in photosensitive
          patients with reflex seizures than in those without, larger when a photoparoxysmal response
          occurs, and larger still when that response goes on to produce a clinical seizure. This is an
          unusually direct look at the threshold problem in epilepsy, because the same stimulus is delivered
          repeatedly and the graded variable can be measured on each trial.'
        locations:
        - preferred_term: occipital lobe
          term:
            id: UBERON:0002021
            label: occipital lobe
        cell_types:
        - preferred_term: cortical neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: neuronal action potential
          term:
            id: GO:0019228
            label: neuronal action potential
          modifier: INCREASED
      selected_evidence:
        snippet: The increase in amplitude of the AD was higher when PPR was associated with seizures.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32388124
      reference_title: Characteristics of visual evoked potentials related to the electro-clinical expression
        of reflex seizures in photosensitive patients with idiopathic occipital lobe epilepsy.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The core graded finding: after-discharge amplitude scales with whether the electrographic
        response becomes a clinical seizure, which is what makes this a threshold node rather than a descriptive
        one.'
