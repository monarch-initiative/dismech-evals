              label: photosensitive occipital lobe epilepsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Abnormal Visual Cortical Response to Photic and Pattern Stimulation
        biological_scale: TISSUE
        conforms_to: epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony
        description: The root of the syndrome is a visual cortex that overreacts to its normal input.
          This is not inferred from the seizures alone; it is measurable directly. When light or a structured
          pattern is delivered under recording, the early visual evoked response is abnormally large in
          these patients, while its timing is normal. That combination, normal latency with excessive
          amplitude, is the signature of a cortex whose conduction is intact but whose gain is set too
          high. Photosensitivity and pattern sensitivity are treated here as two faces of the same abnormal
          responsiveness, since both stimuli provoke the same electrographic and clinical events.
        locations:
        - preferred_term: primary visual cortex
          term:
            id: UBERON:0002436
            label: primary visual cortex
        cell_types:
        - preferred_term: cortical pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        biological_processes:
        - preferred_term: detection of light stimulus involved in visual perception
          term:
            id: GO:0050908
            label: detection of light stimulus involved in visual perception
          modifier: ABNORMAL
      selected_evidence:
        snippet: Comparisons among groups showed no significant differences for P100 latency. Higher P100
          amplitude as well as higher after-discharge (AD) were found in photosensitive patients with
          RS.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32388124
      reference_title: Characteristics of visual evoked potentials related to the electro-clinical expression
        of reflex seizures in photosensitive patients with idiopathic occipital lobe epilepsy.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The direct measurement behind this node: timing of the visual response is normal,
        its amplitude is not, which is what licenses describing the abnormality as excessive cortical
        gain rather than altered conduction.'
