      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: luminal_iron_sequestration
        hypothesis_label: Pica-Substance Luminal Iron Sequestration
        status: EMERGING
        description: The proposal that ingested geophagia substances (clay/kaolin) themselves worsen iron
          status by binding iron in the gut lumen or otherwise inhibiting its absorption, closing a self-reinforcing
          loop with the iron-deficiency route to pica. The direction of causality between pica and iron
          deficiency is genuinely unsettled, and the specific binding mechanism is contested.
        notes: The same scoping review notes that many researchers and clinicians instead hold that iron
          deficiency itself induces pica - i.e. the opposite causal direction, already modeled by the
          "Iron Deficiency and CNS Dopaminergic Dysregulation" node. Both directions are retained because
          the review does not settle between them.
      selected_evidence:
        snippet: Some authors have suggested that pica may be inducing iron deficiency by replacing dietary
          iron sources or inhibiting the absorption of iron
        supports: SUPPORT
