        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Rodent Kaolin-Intake Emesis Analogue
        description: In rats and mice — species incapable of vomiting — emetogenic agents induce kaolin
          (clay) consumption ("pica") as a compensatory illness-response behavior. This rodent behavior
          is mediated by dopamine D2 receptors in the chemoreceptor trigger zone and 5-HT3 receptors on
          gastric vagal afferents and is used as an emesis surrogate. It is a mechanistic analogue relevant
          to the pregnancy-nausea association, but is a model of emesis rather than of human craving-driven
          pica (a human-model mismatch).
        biological_scale: ORGANISM
      selected_evidence:
        snippet: pica in rats was induced through 1) dopamine D2 receptors in the chemoreceptor trigger
          zone, and 2) the stomach, partly via 5-HT3 receptors in the visceral afferents in the stomach
          wall
        supports: SUPPORT
    origin:
