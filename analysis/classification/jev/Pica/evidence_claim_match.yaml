        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Gut Luminal Iron Sequestration
        description: 'Clay/kaolin ingested as pica has been proposed to adsorb free iron in the intestinal
          lumen, reducing bioavailable iron in the duodenum and paradoxically deepening the iron deficiency
          that helped drive the behavior — a self-reinforcing loop. This binding mechanism is contested:
          Seim et al. report that geophagia substances do not bind bioavailable iron and are not responsible
          for reduced absorption, so the node is retained as an EMERGING hypothesis rather than an established
          mechanism.'
        mechanism_confidence: PROVISIONAL
        biological_scale: TISSUE
        cell_types:
        - preferred_term: Duodenal enterocyte
          term:
            id: CL:0000584
            label: enterocyte
      selected_evidence:
        snippet: Some authors have suggested that pica may be inducing iron deficiency by replacing dietary
          iron sources or inhibiting the absorption of iron
        supports: SUPPORT
