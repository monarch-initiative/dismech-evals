      assertion:
        name: Iron Deficiency and CNS Dopaminergic Dysregulation
        description: Iron deficiency (dietary insufficiency, GI blood loss, pregnancy demand, malabsorption)
          reduces CNS iron availability. Because iron is a cofactor for tyrosine hydroxylase, the rate-limiting
          enzyme of dopamine synthesis, iron deficiency is hypothesized to disrupt central dopaminergic
          neurotransmission and drive aberrant craving directed at non-nutritive substances.
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: Midbrain dopaminergic neuron
          term:
            id: CL:0000700
            label: dopaminergic neuron
        biological_processes:
        - preferred_term: Dopamine biosynthesis
          term:
            id: GO:0042416
            label: dopamine biosynthetic process
          modifier: DECREASED
        - preferred_term: Iron ion transport
          term:
            id: GO:0006826
            label: iron ion transport
          modifier: DECREASED
      selected_evidence:
        snippet: the strong association of pica with iron deficiency anemia (IDA) lends credence to the
          hypothesis that dopamine transmission may be disrupted in this disorder
        supports: SUPPORT
