      assertion_type: Discussion
      assertion:
        discussion_id: disc_pid_hippocampal_dg_vulnerability
        prompt: Why is the hippocampal dentate gyrus disproportionately burdened with Pick bodies in both
          behavioral and aphasic Pick disease, despite neocortical pathology being clinicopathologically
          concordant with phenotype?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Neuronal Loss
        rationale: Stereological work shows that neocortical Pick body distribution tracks the clinical
          syndrome (frontal-predominant in bvFTD, anterior-temporal in PPA), yet the dentate gyrus is
          heavily and consistently affected regardless of phenotype. The molecular basis for this selective
          limbic vulnerability to 3R-tau is unknown and bears on why episodic-memory circuits are involved
          even when memory is relatively spared clinically.
        posed_date: '2026-05-30T00:00:00Z'
      selected_evidence:
        snippet: raising intriguing questions about the selective vulnerability of the hippocampus to
          3R-tauopathies
        supports: SUPPORT
