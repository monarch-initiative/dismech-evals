      assertion_type: Discussion
      assertion:
        discussion_id: disc_pid_population_prevalence
        prompt: What is the true population-level prevalence and incidence of Pick disease, as distinct
          from clinical frontotemporal dementia and from other FTLD-tau subtypes?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - prevalence#General Population
        rationale: Pick disease is a histopathologically defined 3R-tauopathy that can only be diagnosed
          definitively at autopsy, and it underlies only a fraction of clinical FTD cases (many of which
          are TDP-43 or FUS proteinopathies). Published epidemiology quantifies clinical FTD, not autopsy-confirmed
          Pick disease, so the population prevalence cited here is poorly constrained and likely an estimate
          rather than a measured value.
        posed_date: '2026-05-30T00:00:00Z'
        notes: The deep-research literature scan likewise flagged that population-level prevalence of
          Pick disease within FTLD was not captured in current PiD-focused sources.
      selected_evidence:
        snippet: Less than half of the cases are tauopathies, the majority has been discovered to have
          a TDP-43 and most recently a FUS proteinopathy, shared with ALS, opening potential opportunities
          for pharmacological approaches to treatment
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20420119
      reference_title: Frontotemporal dementia, Pick's disease.
      evidence_source: HUMAN_CLINICAL
      explanation: Because only a minority of clinical FTD cases have tau pathology (and only some of
        those are Pick disease), clinical-FTD epidemiology cannot be directly equated with Pick disease
        prevalence.
