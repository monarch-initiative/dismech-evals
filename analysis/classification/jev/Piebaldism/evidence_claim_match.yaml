          substitution at the module's trigger node, where Waardenburg-spectrum disorders instead substitute
          PAX3, SOX10, MITF or the endothelin axis.
        cell_types:
        - preferred_term: melanoblast
          term:
            id: CL:0000541
            label: melanoblast
        molecular_functions:
        - preferred_term: transmembrane receptor protein tyrosine kinase activity
          term:
            id: GO:0004714
            label: transmembrane receptor protein tyrosine kinase activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
