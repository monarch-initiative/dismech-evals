  7be2f4eb35aa467bb3f2812e25939dcb180ac8ae0a595a4c77ff9280124fad5d:
    claim:
      about:
        disease:
          name: Piebaldism
          disease_term:
            preferred_term: piebaldism
            term:
              id: MONDO:0008244
              label: piebaldism
        context: []
      assertion_type: Treatment
      assertion:
        name: Autologous Melanocyte Transplantation with Laser or Dermabrasive Resurfacing
        description: 'The one intervention that restores pigment. Because piebald skin lacks melanocytes
          entirely rather than having damaged ones, repigmentation requires physically transferring melanocytes
          into the lesion: the achromic epidermis is removed by laser resurfacing or dermabrasion and
          replaced with an autologous graft carrying melanocytes, either cultured epidermis or a non-cultured
          cell suspension. Cellular grafting is preferred for large lesions because a small donor site
          can be expanded to cover a much larger recipient area.'
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: Surgical procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: Stabilized vitiligo resistant to conventional therapy (e.g. segmental vitiligo) and piebaldism
          lesions can be treated with autologous cellular grafting techniques, such as non-cultured cell
          suspension transplantation (NCST) and cultured melanocyte transplantation (CMT).
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33428279
      reference_title: 'Donor to recipient ratios in the surgical treatment of vitiligo and piebaldism:
        a systematic review.'
      evidence_source: HUMAN_CLINICAL
      explanation: Confirms cellular grafting as an established option in piebaldism specifically, and
        names the two techniques in use.
