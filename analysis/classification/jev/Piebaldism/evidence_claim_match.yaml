      assertion_type: Treatment
      assertion:
        name: Photoprotection and Camouflage
        description: Depigmented skin has no melanin photoprotection, so sun protection is advised, and
          cosmetic camouflage is used where the distribution is conspicuous. No medical or pharmacological
          therapy repopulates the affected regions with melanocytes - unlike vitiligo, there are no melanocytes
          present to be reactivated - so non-surgical management is protective and cosmetic. Surgical
          melanocyte transfer is the exception and is curated separately below.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: We present the case of a 14-year-old adolescent girl with piebaldism, along with a review
          of the pathogenesis, diagnosis, and management of this disease entity.
        supports: SUPPORT
