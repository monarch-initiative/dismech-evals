      assertion_type: EpidemiologyInfo
      assertion:
        name: Formerly endemic across tropical Latin America
        description: Pinta was endemic across Mexico, Central America and northern South America, and
          persisted longest in remote forested communities. It is now rare, with residual foci reported
          in remote regions of Mexico and among Amazonian communities in Brazil, Colombia and Peru.
        factors:
        - rural and remote residence
        - warm humid tropical climate
        - poverty and limited health-system access
      selected_evidence:
        snippet: The World Health Organization lists 15 countries in Latin America where pinta was previously
          endemic.
        supports: SUPPORT
