        diagnosis_term:
          preferred_term: serologic testing
          term:
            id: NCIT:C217458
            label: Diagnostic Serology Testing
        measurements:
        - preferred_term: Treponema pallidum antibody
          term:
            id: LOINC:22587-0
            label: Treponema pallidum Ab [Presence] in Serum
        - preferred_term: Nontreponemal (reagin) antibody, qualitative
          term:
            id: LOINC:22461-8
            label: Reagin Ab [Presence] in Serum
        notes: LOINC:22587-0 identifies the treponemal-confirmation arm (TPHA/TPPA/FTA-Abs) named here,
          which the row's own description says is positive in every treponematosis. LOINC:22461-8 identifies
          the nontreponemal (RPR/VDRL) arm as a presence/absence result rather than a titer, because this
          row's own description speaks of "a reactive result" -- a qualitative outcome -- and does not
          name a quantitative or treatment-response use as the Yaws row does.
      selected_evidence:
        snippet: treponemal tests TPHA, TPPA, and FTA-Abs are more specific, but remain positive for life
