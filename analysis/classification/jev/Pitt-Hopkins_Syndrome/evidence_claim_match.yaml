      assertion_type: Pathophysiology
      assertion:
        name: SCN10A / Nav1.8 Channel Dysregulation
        description: SCN10A, encoding the voltage-gated sodium channel Nav1.8, is a downstream target
          of TCF4 that is consistently upregulated in PTHS mouse models. Aberrant Nav1.8 activity alters
          neuronal excitability and circuit function, and Nav1.8 inhibition normalizes neuron function,
          brain-circuit activity, and behavioral abnormalities in models, nominating Nav1.8 as a therapeutic
          target.
      selected_evidence:
        snippet: is critical for neurodevelopment and brain function through its binding to cis-regulatory
          elements of target genes. One potential therapeutic strategy for PTHS is to identify dysregulated
          target genes and normalize their dysfunction.
        supports: SUPPORT
    origin:
