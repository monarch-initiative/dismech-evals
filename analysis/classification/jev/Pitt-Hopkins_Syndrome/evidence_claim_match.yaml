        name: Autosomal dominant inheritance, usually de novo
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: PTHS is autosomal dominant and essentially always results from a de novo heterozygous
          TCF4 pathogenic variant; the recurrence risk for future pregnancies is low but greater than
          the general population owing to the possibility of parental germline mosaicism. Rare familial
          transmission and mosaicism have been reported.
      selected_evidence:
        snippet: TCF4 haploinsufficiency by deletions, truncating variants or loss‐of‐function missense
          variants within the DNA‐binding and protein interacting bHLH domain causes Pitt‐Hopkins syndrome
          (PTHS).
        supports: SUPPORT
