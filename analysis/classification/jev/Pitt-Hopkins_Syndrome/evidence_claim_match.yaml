      assertion_type: Pathophysiology
      assertion:
        name: TCF4 Haploinsufficiency
        description: Heterozygous loss-of-function variants (nonsense, frameshift, splice-site, whole/partial
          gene deletions) and dominant-negative missense variants in the bHLH domain reduce functional
          TCF4 dosage. TCF4 is a class I bHLH E-protein that obligately heterodimerizes with tissue-specific
          class II bHLH factors; a ~50% reduction in functional protein is sufficient to disrupt transcriptional
          programs in the developing nervous system.
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: Transcription factor 4 (TCF4, also known as ITF2 or E2-2) is a type I basic helix-loop-helix
          transcription factor. Autosomal dominant mutations in TCF4 cause Pitt-Hopkins syndrome (PTHS),
          a rare syndromic form of autism spectrum disorder.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1159/000516666
      reference_title: Molecular and Cellular Function of Transcription Factor 4 in Pitt-Hopkins Syndrome
      evidence_source: OTHER
      explanation: Review establishing TCF4 as a class I bHLH transcription factor whose dominant mutations
