              label: Pitt-Hopkins syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted bHLH-Dependent Neuronal Differentiation
        description: TCF4 partners with proneural factors (e.g., ASCL1, NEUROD2, NEUROG2) to drive neuronal
          specification, migration, and differentiation. Reduced TCF4 activity impairs proneural transcriptional
          output, perturbing cortical neurogenesis and synaptic gene expression and contributing to intellectual
          disability and the broader neurodevelopmental phenotype.
      selected_evidence:
        snippet: TCF4 is a basic helix-loop-helix transcription factor that is critical for neurodevelopment
          and brain function through its binding to cis-regulatory elements of target genes.
        supports: SUPPORT
