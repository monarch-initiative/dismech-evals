            term:
              id: MONDO:0012589
              label: Pitt-Hopkins syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Autonomic / Brainstem Respiratory Dysregulation
        description: The hallmark episodic hyperventilation-apnea breathing pattern is thought to reflect
          dysregulation of brainstem respiratory control networks during wakefulness, consistent with
          TCF4 expression in hindbrain and autonomic circuits. The episodes are typically absent during
          sleep. In a Tcf4 truncation mouse model, disordered breathing is associated with selective loss
          of Phox2b-expressing parafacial neurons and compromised CO2/H+ chemosensitivity of the retrotrapezoid
          nucleus, and is improved by pharmacological targeting of aberrantly upregulated Nav1.8 channels.
      selected_evidence:
        snippet: We also show that central Nav1.8 channels can be targeted pharmacologically to improve
          respiratory function at the cellular and behavioral levels in Tcf4tr/+ mice, thus establishing
          Nav1.8 as a high priority target with therapeutic potential in PTHS.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1038/s41467-021-26263-2
      reference_title: Disordered breathing in a Pitt-Hopkins syndrome model involves Phox2b-expressing
        parafacial neurons and aberrant Nav1.8 expression
      evidence_source: MODEL_ORGANISM
      explanation: Identifies aberrant central Nav1.8 channel activity as a druggable mechanism of respiratory
        dysregulation in the PTHS model.
