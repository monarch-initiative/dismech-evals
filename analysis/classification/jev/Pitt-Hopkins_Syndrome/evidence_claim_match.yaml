        association: Pathogenic Mutations
        presence: Positive
        notes: Heterozygous, predominantly de novo pathogenic variants in TCF4 (18q21.2) cause PTHS. The
          variant spectrum includes whole- and partial-gene deletions, nonsense and frameshift loss-of-function
          variants, splice-site variants, and missense variants clustering in the C-terminal bHLH DNA-binding/dimerization
          domain (the latter often acting through loss of function or dominant-negative mechanisms). Haploinsufficiency
          is the unifying mechanism.
      selected_evidence:
        snippet: TCF4 haploinsufficiency by deletions, truncating variants or loss‐of‐function missense
          variants within the DNA‐binding and protein interacting bHLH domain causes Pitt‐Hopkins syndrome
          (PTHS).
        supports: SUPPORT
