        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pitnet_benign_malignant_boundary
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Clonal Expansion of an Adenohypophyseal Cell Lineage
        prompt: How should a tumor that is histologically benign, frequently locally invasive, and only
          rarely metastatic be represented — and what predicts which one a given tumor is?
        rationale: Pituitary adenomas are overwhelmingly benign yet a substantial minority invade the
          cavernous sinus or recur after resection, while true carcinoma is defined only retrospectively
          by metastasis. The 2017 WHO revision eliminated the "atypical adenoma" category, which had been
          the attempt to predict aggressive behaviour from proliferative markers, on the explicit grounds
          that the evidence did not support it — so the field currently has no validated prospective predictor.
          The renaming to PitNET is itself an argument about this boundary rather than a cosmetic change.
          For dismech this determines whether aggressive-but-non-metastatic disease is a subtype, a severity
          qualifier, or a separate entity; none of the three is asserted here.
      selected_evidence:
        snippet: One is that the term "atypical adenoma," which was characterized based on highly proliferative
          properties to predict adenomas that carry a poor prognosis, was completely eliminated due to
          the lack of definitive evidence.
        supports: SUPPORT
