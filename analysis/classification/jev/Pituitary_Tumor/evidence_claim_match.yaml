      assertion_type: Pathophysiology
      assertion:
        name: Clonal Expansion of an Adenohypophyseal Cell Lineage
        biological_scale: CELLULAR
        role: trigger
        description: 'A pituitary tumor begins as a monoclonal expansion of one adenohypophyseal cell
          type, and which type it is determines nearly everything downstream. Lineage is specified by
          transcription factors — PIT1 for the somatotroph, lactotroph and thyrotroph lineages, TPIT for
          corticotroph, SF-1 for gonadotroph — and the tumor retains the identity of its cell of origin,
          including its secretory programme. Drivers differ by lineage: somatic GNAS activating variants
          and germline AIP or GPR101 lesions in somatotroph tumors, somatic USP8 variants in corticotroph
          tumors. Posterior pituitary tumors arise from pituicytes instead and fall outside this scheme.'
        locations:
        - preferred_term: adenohypophysis
          term:
            id: UBERON:0002196
            label: adenohypophysis
        genes:
