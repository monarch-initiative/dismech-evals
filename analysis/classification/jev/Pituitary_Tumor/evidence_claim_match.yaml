        biological_scale: ORGANISM
        role: central_effector
        description: 'Unregulated secretion of the lineage''s hormone produces a defined endocrine syndrome:
          prolactin gives galactorrhoea, amenorrhoea and infertility; growth hormone gives acromegaly
          or gigantism; ACTH gives Cushing disease; TSH gives central hyperthyroidism. The syndrome, not
          the tumor size, is usually what brings the patient to attention, and prolactinomas are the commonest.'
        biological_processes:
        - preferred_term: hormone secretion
          term:
            id: GO:0046879
            label: hormone secretion
          modifier: INCREASED
      selected_evidence:
        snippet: Nearly half (51; 45.5%) of adenomas were prolactinomas while 46 (41.1%) were non-functioning
          adenomas, and seven (6.3%) were growth hormone-secreting adenomas while six (5.4%) were adrenocorticotropic
          hormone secreting adenomas.
        supports: SUPPORT
