        name: Planned Cesarean Delivery
        description: 'The definitive management, and the intervention that turned placenta previa from
          a major cause of maternal death into a manageable condition. A covering placenta mandates it;
          a low-lying placenta more than 2 cm from the os may allow a trial of vaginal delivery. Scheduling
          is a deliberate trade: 36-37 weeks for an uncomplicated complete previa balances the bleeding
          risk of waiting against the neonatal risk of delivering early. Delivery should be at an institution
          able to transfuse.'
