          modifier: DECREASED
          term:
            id: GO:0046697
            label: decidualization
        locations:
        - preferred_term: endometrium
          term:
            id: UBERON:0001295
            label: endometrium
      selected_evidence:
        snippet: 'smoking (OR 1·42, 95% CI 1·30, 1·54) (RR 1·27, 95% CI: 1·18, 1·35) advanced maternal
