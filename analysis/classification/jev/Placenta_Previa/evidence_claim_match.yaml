      assertion_type: Subtype
      assertion:
        name: Previa
        display_name: Placenta previa (placenta covering the internal cervical os)
        description: The placental edge overlies the internal os. This is the form that persists into
          the third trimester far more often than a merely low-lying placenta does, and it is the form
          that mandates abdominal delivery.
      selected_evidence:
        snippet: Low-positioned placenta included placenta previa, defined as a placenta covering the
          internal os of the cervix, and a low-lying placenta, defined as a placenta lying near to (within
          20 mm) but not overlying the internal os.
        supports: SUPPORT
