      assertion_type: DifferentialDiagnosis
      assertion:
        name: Placental Abruption
        description: The other major cause of second-half antepartum haemorrhage, and the one the painlessness
          of previa is meant to exclude. Curated separately.
        distinguishing_features:
        - Abruption bleeds with pain and uterine tenderness because blood accumulates behind an attached
          placenta; previa bleeds painlessly because the blood escapes freely through the cervix.
        - Ultrasound localises the placenta away from the internal os in abruption, and abruption is a
          clinical rather than a sonographic diagnosis.
      selected_evidence:
        snippet: Placental abruption complicates about 1% of pregnancies and is a leading cause of vaginal
          bleeding in the latter half of pregnancy.
        supports: SUPPORT
    origin:
