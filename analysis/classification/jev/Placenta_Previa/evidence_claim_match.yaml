        biological_scale: TISSUE
        description: 'As term approaches, the lower uterine segment forms and the cervix softens, shortens
          and effaces. The placenta cannot accommodate that change, so the utero-placental interface at
          the placental edge is disrupted. The clinical signature of this being a maternal-tissue event
          rather than a fetal one is that the bleeding is bright red, painless, and of maternal origin.
          The evidence that cervical change specifically drives the bleeding is mixed and is recorded
          that way: a short cervix predicts the severe, early, emergency-delivery haemorrhage, but in
          the same cohort it did not distinguish women who bled at all from those who did not.'
