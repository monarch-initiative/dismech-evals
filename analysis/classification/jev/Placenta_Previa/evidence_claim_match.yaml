      assertion:
        name: Low-Lying
        display_name: Low-lying placenta (edge within 20 mm of the internal os, not covering)
        description: 'The placental edge lies within 20 mm of the internal os without overlying it. It
          is worth separating rather than treating as a milder grade of the same thing: in the second
          trimester it persists to the third in about 1 in 70 cases against 1 in 5 for a covering placenta,
          and above a 2 cm placenta-to-os distance vaginal delivery may be safe.'
      selected_evidence:
        snippet: Women with placenta previa in the second trimester had a higher risk of a low-positioned
          placenta in the third trimester than did those with a low-lying placenta in the second trimester
          (37/181 (20.4%) vs 11/777 (1.4%); relative risk (RR), 17.9 (95% CI, 8.9-36.0)).
        supports: SUPPORT
