        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Vasa Previa
        description: Fetal rather than maternal vessels crossing the os, most often arising when a second-trimester
          previa resolves and leaves velamentous vessels behind - so the two conditions share the trophotropic
          mechanism of this entry's migration node and are not merely look-alikes. Not currently a dismech
          entry.
        distinguishing_features:
        - The bleeding is fetal and small in volume but rapidly lethal to the fetus, whereas previa bleeding
          is maternal and threatens the mother.
        - Colour Doppler shows fetal vessels crossing over the cervix with no overlying placental tissue.
      selected_evidence:
        snippet: Vasa previa refers to fetal vessels (arterial or venous) unprotected by placental tissue
          or umbilical cord running through the membranes over or in close proximity to the internal cervical
          os.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37590981
      reference_title: Vasa Previa.
      evidence_source: OTHER
      explanation: 'The definition that separates the two: the same anatomical location, but fetal vessels
        without placental tissue rather than placental tissue itself.'
