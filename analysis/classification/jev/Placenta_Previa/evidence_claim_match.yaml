  c7703e30dd1d094154d6a780f5527b770a19b9a28abffa7b7bacc7aef5548dc8:
    claim:
      about:
        disease:
          name: Placenta Previa
          disease_term:
            preferred_term: placenta praevia
            term:
              id: MONDO:0005918
              label: placenta praevia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Trophotropic Migration Away from the Internal Os
        biological_scale: TISSUE
        description: 'Placental migration is not movement. The placenta grows preferentially toward the
          better-vascularised fundus while the tissue lying over the poorly vascularised cervix and lower
          segment atrophies, so the placental edge retreats from the os at roughly 5 mm per week and the
          great majority of second-trimester diagnoses resolve. Persistent placenta previa is the failure
          of this process - which is the reason the disease is defined by a third-trimester finding and
          why a covering placenta and a merely low-lying one behave so differently. The same process,
          running to completion over a velamentous cord, is the accepted explanation for vasa previa:
          the placental tissue atrophies and leaves the fetal vessels behind.'
        locations:
        - preferred_term: placenta
          term:
            id: UBERON:0001987
            label: placenta
        notes: The resolution rate quoted for this node is strongly dependent on gestational age at first
          detection, on how much the placental edge overlaps the os, and on case definition. Second-trimester
          series report over 98% resolution; a cohort already persisting at 28 weeks reports 62.5% still
          previa at 36 weeks. Both are cited above, as a SUPPORT and a REFUTE item, rather than reconciled
          into a single number.
      selected_evidence:
        snippet: It has been proposed that the placenta grows preferentially toward the better-vascularized
          fundus of the uterus with advancing gestational age, and then the placental tissue overlying
          the less well-vascularized cervix and lower uterine segment undergoes atrophy, leaving behind
          exposed fetal vessels.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
