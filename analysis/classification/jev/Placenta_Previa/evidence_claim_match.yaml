              label: placenta praevia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Endometrial and Decidual Damage at the Lower Uterine Segment
        biological_scale: TISSUE
        description: Every well-replicated risk factor for placenta previa - prior caesarean, uterine
          curettage after induced or spontaneous abortion, intrauterine surgery, endometriosis, advancing
          maternal age - is a cause of endometrial injury. The proposed common step is that injury alters
          decidualisation and drives excessive vascular remodelling, so the scarred region no longer supports
          normal implantation and the blastocyst implants elsewhere, including low in the uterus. This
          is a mechanism inferred from a consistent epidemiology rather than one demonstrated at the implantation
          site in humans, and it is recorded at that strength.
        cell_types:
        - preferred_term: endometrial stromal cell
          term:
            id: CL:0002255
            label: stromal cell of endometrium
        - preferred_term: decidual cell
          term:
            id: CL:2000002
            label: decidual cell
        biological_processes:
        - preferred_term: decidualization
          modifier: DECREASED
          term:
            id: GO:0046697
            label: decidualization
        locations:
        - preferred_term: endometrium
          term:
            id: UBERON:0001295
            label: endometrium
      selected_evidence:
        snippet: These factors imply some degree of tissue damage, which can modify the decidualisation
          process, and produce excessive vascular remodelling.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
