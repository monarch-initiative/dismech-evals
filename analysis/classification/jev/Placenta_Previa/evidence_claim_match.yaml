        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Poorly Contractile Placental Bed in the Lower Uterine Segment
        biological_scale: TISSUE
        description: 'After any delivery, haemostasis at the placental bed is mechanical: myometrial contraction
          occludes the spiral arteries. The lower uterine segment is a poorly contractile part of the
          uterus, so a placental bed sited there does not get that closure, and the newly formed vessels
          of the abnormally remodelled bed keep bleeding. This is why postpartum haemorrhage in previa
          happens even when the placenta separates normally and there is no accreta - it is a separate
          mechanism from the one above, converging on the same phenotype.'
        locations:
        - preferred_term: myometrium
          term:
            id: UBERON:0001296
            label: myometrium
      selected_evidence:
        snippet: Placenta praevia and accreta are mainly located in the lower segment, a place that predisposes
          to persistent uterine bleeding because of the development of new vessels and because it is a
          poorly contractile area of the uterus.
        supports: SUPPORT
