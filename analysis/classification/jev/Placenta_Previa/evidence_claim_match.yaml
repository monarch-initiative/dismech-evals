            term:
              id: MONDO:0005918
              label: placenta praevia
        context: []
      assertion_type: Treatment
      assertion:
        name: Uterotonic Therapy
        description: First pharmacological step once the placenta is delivered and the bed is bleeding.
          Oxytocin and the prostaglandin analogue misoprostol drive myometrial contraction to close the
          spiral arteries mechanically. The important qualification in previa is that the bleeding bed
          is the lower uterine segment, which is thin and comparatively fibrous, so it contracts poorly
          by comparison with the fundus; uterotonics therefore work less well here than in atonic post-partum
          haemorrhage from a normally sited placenta, and are the first rung of an escalation ladder rather
          than a definitive answer. This entry records the intervention and its mechanism; no efficacy
          figure is recorded because the cited trial registration carries no results.
        treatment_term:
          preferred_term: uterotonic pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: oxytocin
            term:
              id: CHEBI:7872
              label: oxytocin
          - preferred_term: misoprostol
            term:
              id: CHEBI:63610
              label: misoprostol
        notes: therapeutic_modality is deliberately left unset. The slot is single-valued and this treatment
          bundles a nonapeptide (oxytocin, PEPTIDE) with a small-molecule prostaglandin analogue (misoprostol,
          SMALL_MOLECULE); either value would be wrong for half the entry.
      selected_evidence:
        snippet: To compare the efficacy and safety profile of intravenous tranexamic acid versus intrauterine
          misoprostol in reducing the blood loss during and after cesarean delivery in pregnant women
          diagnosed with placenta previa
        supports: SUPPORT
