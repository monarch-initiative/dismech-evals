      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: chronic_ischemic_placental_disease
        hypothesis_label: Abruption as the end-stage of chronic ischemic placental disease
        status: CANONICAL
        description: 'Under this model abruption is not an acute accident but the terminal event of a
          chronic uteroplacental vascular disease that begins with failed spiral artery transformation
          early in pregnancy. Supporting evidence includes the excess of chronic decidual lesions in abruption
          placentas, the elevated abruption risk conferred by bleeding earlier in pregnancy, and the co-clustering
          of abruption with preeclampsia and fetal growth restriction.

          '
      selected_evidence:
        snippet: the increased risk associated with placental lesions, especially chronic inflammatory
          lesions, even in the absence of early vaginal bleeding, suggests that prolonged inflammation
          may be implicated in placental abruption
        supports: SUPPORT
