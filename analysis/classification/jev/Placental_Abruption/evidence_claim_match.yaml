        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Decidual Hemorrhage and Retroplacental Hematoma Formation
        role: central_effector
        biological_scale: TISSUE
        description: 'Rupture of a diseased decidual vessel bleeds into the decidua basalis. The accumulating
          blood dissects along the plane between the placental basal plate and the uterine wall, forming
          a retroplacental hematoma whose expansion progressively levers the placenta away from its attachment.
          The same process occurring in the decidua parietalis produces a retrochorionic hematoma. Bleeding
          may track down to the cervix and present as vaginal bleeding, or remain concealed behind the
          placenta.

          '
        cell_types:
        - preferred_term: decidual cell
          term:
            id: CL:2000002
            label: decidual cell
        locations:
        - preferred_term: decidua basalis
          term:
            id: UBERON:0000453
            label: decidua basalis
      selected_evidence:
        snippet: Chronic, subacute decidual hemorrhage (ie, abruptio placenta and retrochorionic hematoma
          formation) is an important contributor to preterm parturition.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
