        description: 'Uteroplacental apoplexy: in the most severe abruptions blood extravasates into and
          through the myometrium and out to the broad ligament or peritoneum, giving the uterus a blue-purple
          discoloration. The clinical significance is that a myometrium infiltrated with blood contracts
          poorly, which is how a placental problem becomes intractable postpartum hemorrhage and, sometimes,
          the reason for emergency hysterectomy.

          '
      selected_evidence:
        snippet: Clinical abruption represents a spectrum from mild to the most severe form, in which
          blood can extravasate into or through the myometrium, the broad ligament, or the peritoneum,
          causing the uterus and surrounding structures to take on a blue discoloration.
        supports: SUPPORT
