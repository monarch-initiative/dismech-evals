      assertion_type: Genetic
      assertion:
        name: No Mendelian gene
        notes: 'Stated affirmatively rather than left blank: placental abruption has no Mendelian form,
          no OMIM phenotype entry, and no gene with definitive ClinGen gene-disease validity. Susceptibility
          is polygenic and, unusually, involves two genomes, since maternal and fetal/placental genotypes
          both contribute. An empty genetic block would otherwise read as an uncurated section rather
          than a real negative finding.

          '
        relationship_type: UNKNOWN
      selected_evidence:
        snippet: Accumulating epidemiological evidence points to strong genetic susceptibility to placental
          abruption (PA). However, characterization of genes associated with PA remains incomplete.
        supports: SUPPORT
