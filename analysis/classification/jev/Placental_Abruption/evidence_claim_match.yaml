      assertion_type: Pathophysiology
      assertion:
        name: Decidual Vasculopathy and Spiral Artery Failure
        conforms_to: deep_placentation_defect#Failure of Spiral Artery Physiological Transformation
        role: trigger
        biological_scale: TISSUE
        description: 'Shallow extravillous trophoblast invasion leaves the maternal spiral arteries incompletely
          converted into low-resistance, high-capacity vessels. The retained muscular, high-resistance
          vasculature produces chronic uteroplacental ischemia and predisposes the decidual vascular bed
          to atherosis, thrombosis and necrosis. This is the shared upstream lesion of ischemic placental
          disease, which is why abruption, preeclampsia and fetal growth restriction cluster in the same
          pregnancies.

          '
        cell_types:
        - preferred_term: extravillous trophoblast
          term:
            id: CL:0008036
            label: extravillous trophoblast
        - preferred_term: decidual cell
          term:
            id: CL:2000002
            label: decidual cell
        biological_processes:
        - preferred_term: spiral artery remodeling
          term:
            id: GO:0001974
            label: blood vessel remodeling
          modifier: DECREASED
          description: The module's defining process for this conformance target. GO has no spiral-artery-specific
            remodeling term, so the specificity is carried in preferred_term.
        - preferred_term: response to hypoxia
          term:
            id: GO:0001666
            label: response to hypoxia
          modifier: INCREASED
        locations:
        - preferred_term: uterine spiral artery
          term:
            id: UBERON:0015171
            label: uterine spiral artery
      selected_evidence:
        snippet: The unifying pathophysiological mechanism that precedes all 3 complications is uteroplacental
          ischemia as a consequence of inadequate (or failure of) physiological transformation of the
          maternal uterine spiral arteries, endothelial cell dysfunction, and increased oxidative stress.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39641171
      reference_title: 'Ischemic Placental Disease: Epidemiology and Impact on Maternal and Offspring
        Health Along the Life Course.'
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies failed spiral artery transformation as the shared upstream mechanism of
        abruption within ischemic placental disease.
