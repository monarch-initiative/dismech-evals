      assertion_type: Pathophysiology
      assertion:
        name: Consumptive Coagulopathy and Maternal Hemorrhagic Shock
        role: consequence
        biological_scale: ORGANISM
        description: 'Sustained thrombin generation plus release of placental procoagulant material consumes
          fibrinogen, platelets and clotting factors faster than they are replaced, producing disseminated
          intravascular coagulation. This converts a local placental problem into systemic maternal hemorrhage.
          Because a substantial share of the blood loss can be concealed behind the placenta, visible
          bleeding underestimates the true deficit and the degree of shock is often out of proportion
          to what is seen.

          '
        biological_processes:
        - preferred_term: blood coagulation
          term:
            id: GO:0007596
            label: blood coagulation
          modifier: INCREASED
      selected_evidence:
        snippet: Maternal risks include obstetric hemorrhage, need for blood transfusions, emergency hysterectomy,
          disseminated intravascular coagulopathy and renal failure.
        supports: SUPPORT
