        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Thrombin-Driven Myometrial Contraction and Membrane Weakening
        role: amplifier
        biological_scale: CELLULAR
        description: 'Thrombin generated by the hematoma is a direct uterotonic. It activates PAR1 on
          myometrial cells, driving contraction both by direct myosin light chain phosphorylation and
          indirectly by inducing prostaglandin synthesis. In parallel, thrombin upregulates decidual matrix
          metalloproteinases and interleukin-8, recruiting neutrophils whose proteases degrade the collagen-rich
          amnion and choriodecidua. The two arms together explain the painful uterine hypertonus of acute
          abruption and the strong association of abruption with preterm labor and preterm premature rupture
          of membranes.

          '
        cell_types:
        - preferred_term: myometrial cell
          term:
            id: CL:0002366
            label: myometrial cell
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        biological_processes:
        - preferred_term: uterine smooth muscle contraction
          term:
            id: GO:0070471
            label: uterine smooth muscle contraction
          modifier: INCREASED
        - preferred_term: prostaglandin biosynthetic process
          term:
            id: GO:0001516
            label: prostaglandin biosynthetic process
          modifier: INCREASED
        - preferred_term: extracellular matrix disassembly
          term:
            id: GO:0022617
            label: extracellular matrix disassembly
          modifier: INCREASED
        locations:
        - preferred_term: myometrium
          term:
            id: UBERON:0001296
            label: myometrium
      selected_evidence:
        snippet: thrombin induces myometrial contractions by two mechanisms, including direct activation
          of myosin and indirect increases in prostaglandin synthesis
        supports: SUPPORT
