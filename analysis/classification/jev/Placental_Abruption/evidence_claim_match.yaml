      assertion_type: Genetic
      assertion:
        name: F5
        notes: 'Factor V Leiden. Heterozygous FVL is significantly associated with placental abruption
          in the TREATS meta-analysis (Figure 9, z = 2.12, p = 0.03). The homozygous subgroup is not significant,
          but that estimate rests on three cases and is not evidence against the heterozygous association.
          Screening caveat, which is about clinical utility rather than about the validity of the association:
          thrombophilia panels are not recommended for placenta-mediated pregnancy complications, so this
          entry records FVL as a susceptibility factor without implying that testing for it is indicated.

          '
        gene_term:
