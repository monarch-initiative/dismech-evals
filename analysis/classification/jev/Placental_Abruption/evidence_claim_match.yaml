      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_abruption_no_animal_model_of_trophoblast_invasion
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Can the decidual mechanism of abruption be modelled in any non-human species, given that
          the depth of extravillous trophoblast invasion and the extent of the decidualization reaction
          seen in humans are not reproduced in standard laboratory animals?
        rationale: The upstream lesion of this entry is failure of deep trophoblast-mediated spiral artery
          conversion, a process whose human form is unusually extensive among species with hemochorial
          placentation. Model organisms therefore cannot reproduce the trigger node, which is why essentially
          all mechanistic evidence in this entry comes from human tissue and human decidual cell culture
          rather than in vivo models. A separate constraint is that mice lack a CXCL8/IL-8 ortholog, so
          the thrombin to IL-8 to neutrophil arm of membrane weakening cannot be modelled directly in
          mouse.
        attaches_to:
        - pathophysiology#Decidual Vasculopathy and Spiral Artery Failure
        - pathophysiology#Thrombin-Driven Myometrial Contraction and Membrane Weakening
      selected_evidence:
        snippet: Among species with a hemochorial placenta, human endometrium exhibits the most extensive
          DZ reaction and human EVT are the most intrinsically invasive
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
