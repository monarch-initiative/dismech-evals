        notes: 'One-sided by design: the clinically meaningful question in obstetric hemorrhage is how
          far fibrinogen has fallen, not whether it is elevated.

          Boundary caveat. The source states its thresholds as strictly greater than 4 g/L and less than
          or equal to 2 g/L, whereas interpretation_bands use half-open intervals with an inclusive lower
          bound and an exclusive upper bound. The conventions therefore disagree at exactly two values:
          as encoded, 4.0 falls in the reassuring band and 2.0 falls in the middle band, whereas the source
          would place 4.0 outside its high-NPV group and 2.0 inside its 100%-PPV group. At those two exact
          values follow the source, not the band edge. The bands are deliberately not nudged to force
          agreement, since that would require boundary numbers that appear nowhere in the literature.

          No loinc_term is bound because this project has no configured LOINC adapter, so a LOINC code
          could not be verified against an authoritative source. Per the guidance that a precise descriptor
          with no term beats a plausible but unverified one, the code is omitted rather than guessed;
          adding a LOINC adapter to conf/oak_config.yaml would let this be filled in properly.

          '
        interpretation_bands:
        - name: Reassuring
          lower_bound: 4.0
          unit: g/L
          abnormal_flag: NORMAL
          interpretation: 'Severe hemorrhage unlikely; negative predictive value about 79% in the source
            cohort.

            '
        - name: Falling, consumption underway
          lower_bound: 2.0
          upper_bound: 4.0
          unit: g/L
          abnormal_flag: LOW
          severity: MODERATE
          interpretation: 'Within or below the non-pregnant reference interval and therefore inappropriately
            low for pregnancy; indicates active consumption and rising risk of severe hemorrhage.

            '
        - name: Critical consumptive coagulopathy
          upper_bound: 2.0
          unit: g/L
          abnormal_flag: CRITICAL_LOW
          severity: SEVERE
          interpretation: 'Positive predictive value for severe postpartum hemorrhage was 100% at or below
            this level in the source cohort; mandates immediate fibrinogen replacement.

            '
      selected_evidence:
        snippet: The negative predictive value of a fibrinogen concentration >4 gL(-1) was 79% and the
          positive predictive value of a concentration <or=2 gL(-1) was 100%.
        supports: SUPPORT
