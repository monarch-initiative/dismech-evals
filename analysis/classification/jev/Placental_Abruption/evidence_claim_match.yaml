      assertion_type: Discussion
      assertion:
        discussion_id: gap_abruption_no_high_quality_risk_factor_evidence
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Can any risk factor for placental abruption be established at class I or II evidence,
          given that a formal umbrella review of the entire meta-analytic literature graded every candidate
          as class III or weaker?
        rationale: This is the single most important epistemic caveat attached to this entry. The effect
          sizes curated in the environmental section are real and reproducible, but the umbrella review
          that formally graded them found no factor reaching high-quality evidence. Every risk-factor
          estimate here should therefore be read as suggestive rather than established. A contributing
          cause is the absence of a uniform case definition across the epidemiological literature, which
          makes cohorts non-comparable.
        attaches_to:
        - pathophysiology#Decidual Vasculopathy and Spiral Artery Failure
      selected_evidence:
        snippet: the current meta-analytic associations cannot disentangle the complex etiology of placental
          abruption mainly due to their low quality of evidence
        supports: SUPPORT
