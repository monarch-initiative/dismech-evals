        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Placenta Previa
        description: 'The other major cause of antepartum hemorrhage. Previa classically produces painless
          bright red bleeding with a soft uterus, whereas abruption produces painful bleeding with a tender,
          hypertonic uterus. The decisive practical difference is imaging: previa is reliably identified
          by transvaginal ultrasound, whereas ultrasound has roughly 24% sensitivity for abruption, so
          a normal scan effectively rules out previa but not abruption. Note that previa is also a risk
          factor for abruption, so the two are not mutually exclusive.

          '
      selected_evidence:
        snippet: The diagnostic modality of choice for placenta previa is transvaginal ultrasonography
        supports: SUPPORT
