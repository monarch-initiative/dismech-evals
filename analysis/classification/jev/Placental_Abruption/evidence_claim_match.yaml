      assertion_type: Discussion
      assertion:
        discussion_id: gap_abruption_no_antenatal_diagnostic_test
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Can any antenatal test identify placental abruption reliably enough to change management,
          given that ultrasound has roughly 24% sensitivity and no externally validated prediction model
          exists?
        rationale: Abruption remains a clinical diagnosis of exclusion in real time. The consequence is
          that the condition is frequently recognised only once fetal compromise is already present, which
          places a hard ceiling on how much outcome improvement is achievable through earlier intervention.
          A sensitive antenatal test would be the highest-value advance in this disease.
        attaches_to:
        - pathophysiology#Decidual Hemorrhage and Retroplacental Hematoma Formation
      selected_evidence:
        snippet: Sonography is not sensitive for detection of placental abruption, but a positive finding
          is associated with more aggressive management and worse neonatal outcome.
        supports: SUPPORT
