          stronger than heterozygous Factor V Leiden. Mechanistically coherent given that this entry''s
          central axis is decidual thrombin generation, though the meta-analytic cell counts are small.
          Same screening caveat as F5: the association is not in question, but thrombophilia panels are
          not recommended in placenta-mediated complications.

          '
        gene_term:
          preferred_term: F2
          term:
            id: hgnc:3535
            label: F2
        relationship_type: SUSCEPTIBILITY
      selected_evidence:
        snippet: Significant risks for individual thrombophilic defects were also established for early,
          recurrent and late pregnancy loss; preeclampsia; placental abruption; and intrauterine growth
          restriction.
        supports: SUPPORT
