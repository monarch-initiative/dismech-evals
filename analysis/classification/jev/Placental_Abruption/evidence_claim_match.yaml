      assertion_type: Pathophysiology
      assertion:
        name: Decidual Tissue Factor Exposure and Thrombin Generation
        role: amplifier
        biological_scale: MOLECULAR
        description: 'Decidual cells express the highest levels of tissue factor of any cell type at the
          maternal-fetal interface, a constitutive hemostatic envelope that normally protects against
          bleeding during trophoblast invasion and delivery. When hemorrhage occurs, that same tissue
          factor binds plasma factor VII and generates thrombin in large excess. Thrombin then acts through
          protease-activated receptors as a signaling molecule rather than only as a clotting enzyme,
          which is what converts a local bleed into preterm labor, membrane rupture, and systemic coagulopathy.

          '
        cell_types:
        - preferred_term: decidual cell
          term:
            id: CL:2000002
            label: decidual cell
        biological_processes:
        - preferred_term: blood coagulation, extrinsic pathway
          term:
            id: GO:0007598
            label: blood coagulation, extrinsic pathway
          modifier: INCREASED
        - preferred_term: thrombin-activated receptor signaling pathway
          term:
            id: GO:0070493
            label: thrombin-activated receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: Among the cell types at the maternal fetal interface at term, TF expression is highest
          in decidual cells indicating that this TF meets the hemostatic demands of labor and delivery.
        supports: SUPPORT
