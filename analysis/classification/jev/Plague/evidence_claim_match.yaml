      assertion_type: Pathophysiology
      assertion:
        name: Yop Effector Injection and Immune Subversion
        description: 'Individual Yop effector proteins target distinct immune cell functions. YopH dephosphorylates
          focal adhesion proteins to block phagocytosis. YopE and YopT inactivate Rho GTPases controlling
          cytoskeleton dynamics. YopJ/YopP prevents NF-kappaB activation, suppressing pro-inflammatory
          cytokine production.

          '
        biological_processes:
        - preferred_term: Phagocytosis
          term:
            id: GO:0006909
            label: phagocytosis
          modifier: DECREASED
        - preferred_term: Innate immune response
          term:
            id: GO:0045087
            label: innate immune response
          modifier: DECREASED
      selected_evidence:
        snippet: YopH is a powerful phosphotyrosine phosphatase playing an antiphagocytic role by dephosphorylating
          several focal adhesion proteins. YopE and YopT contribute to antiphagocytic effects by inactivating
          GTPases controlling cytoskeleton dynamics. YopP/YopJ plays an anti-inflammatory role by preventing
          the activation of the transcription factor NF-kappaB.
        supports: SUPPORT
    origin:
