          colonizes the flea midgut and forms a biofilm that blocks the proventriculus, causing the flea
          to regurgitate bacteria into the bite wound during feeding attempts.

          '
        locations:
        - preferred_term: Skin
          term:
            id: UBERON:0002097
            label: skin of body
      selected_evidence:
        snippet: Plague is a vector-borne disease caused by Yersinia pestis. Transmitted by fleas from
          rodent reservoirs, Y. pestis emerged <6000 years ago from an enteric bacterial ancestor through
          events of gene gain and genome reduction.
        supports: SUPPORT
