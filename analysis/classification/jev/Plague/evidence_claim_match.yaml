        display_name: Bubonic Plague
        description: 'Most common form, resulting from flea bite inoculation. Y. pestis travels to regional
          lymph nodes, causing painful swollen lymph nodes (buboes), fever, and prostration. Without treatment,
          case fatality is approximately 40-60%. Curated as a standalone entry, Bubonic_Plague (MONDO:0001112),
          which carries the flea-mediated inoculation to lymph-node colonization to bubo mechanism.

          '
      selected_evidence:
        snippet: Most patients had primary bubonic (63%), pneumonic (21%), or septicemic (5%) plague,
          with associated case fatality rates of 17%, 27%, and 38%, respectively.
        supports: SUPPORT
