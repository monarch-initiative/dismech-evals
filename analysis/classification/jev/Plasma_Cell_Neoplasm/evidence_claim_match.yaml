      assertion:
        name: Immune Evasion and T-Cell Exhaustion
        conforms_to: immune_checkpoint_blockade#Adaptive Immune Resistance
        description: MYC-linked progression remodels marrow T-cell immunity, altering the balance of CD8-positive
          T cells and regulatory T cells and producing immune-evasion states that shape checkpoint and
          T-cell-redirection responses.
        cell_types:
        - preferred_term: CD8-positive, alpha-beta T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        - preferred_term: regulatory T cell
          term:
            id: CL:0000815
            label: regulatory T cell
        biological_processes:
        - preferred_term: negative regulation of T cell mediated immunity
          modifier: INCREASED
          term:
            id: GO:0002710
            label: negative regulation of T cell mediated immunity
      selected_evidence:
        snippet: MYC-dependent time to progression conditioned immune evasion mechanisms that remodeled
          the BM microenvironment differently. Rapid MYC-driven progressors exhibited a high number of
          activated/exhausted CD8+ T cells with reduced immunosuppressive regulatory T (Treg) cells, while
          late MYC acquisition in slow progressors was associated with lower CD8+ T cell infiltration
          and more abundant Treg cells.
        supports: SUPPORT
