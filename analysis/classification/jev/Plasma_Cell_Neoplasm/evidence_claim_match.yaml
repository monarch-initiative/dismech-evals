      assertion_type: Definition
      assertion:
        name: Pathologic definition of plasma cell neoplasm
        definition_type: CASE_DEFINITION
        description: Plasma cell neoplasms are terminally differentiated B-cell neoplasms characterized
          by monoclonal immunoglobulin secretion and stepwise development from a preneoplastic clonal
          B-cell or plasma-cell proliferation such as MGUS.
        scope: General category definition spanning precursor and malignant plasma-cell disorders.
      selected_evidence:
        snippet: Plasma cell neoplasms including multiple myeloma (MM) and related terminally differentiated
          B-cell neoplasms are characterized by secretion of monoclonal immunoglobulin and stepwise development
          from a preneoplastic clonal B and/or plasma cell proliferation called monoclonal gammopathy
          of undetermined significance (MGUS).
        supports: SUPPORT
