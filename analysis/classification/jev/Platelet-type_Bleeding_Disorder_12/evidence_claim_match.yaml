      assertion_type: Genetic
      assertion:
        name: PTGS1
        notes: 'The gene for this disorder, at 9q33.2, encoding cyclooxygenase-1 (prostaglandin-endoperoxide
          synthase 1, historically PGHS-1). The protein is a heme-dependent, endoplasmic-reticulum-membrane
          enzyme with both cyclooxygenase and peroxidase activities that works as a homodimer, and it
          is the target aspirin acetylates. The genetic evidence base for this disease is thin: reported
          alleles are largely private, and no recurrent pathogenic variant is established, so the causal
          case rests on enzymology and platelet function testing rather than on recurrence.

          '
        gene_term:
          preferred_term: PTGS1
          term:
            id: hgnc:9604
            label: PTGS1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: To date, only a few cases with uncommon genetic variants in PTGS1, the gene encoding
          COX-1, have been reported, without detailed study of their associated platelet phenotype.
        supports: SUPPORT
