  31b5285ae59f696a9e46c7c3ce86322a7616b253618e6865a3fe087eb53b58f2:
    claim:
      about:
        disease:
          name: Platelet-type Bleeding Disorder 12
          disease_term:
            preferred_term: platelet-type bleeding disorder 12
            term:
              id: MONDO:0011588
              label: platelet-type bleeding disorder 12
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deficient Platelet COX-1 Protein or Catalytic Activity
        biological_scale: MOLECULAR
        description: 'The protein-level lesion, and it comes in two forms that the founding biochemical
          study separated by western blot in three patients from one series. In two, the 70 kDa COX-1
          band was undetectable - a type 1 defect, absent protein. In the third the protein was present
          in normal amount and the enzyme did not work - a type 2 defect, impaired catalytic activity.
          Thromboxane synthase was normal in all three, which is what excludes the next enzyme in the
          pathway.

          Both forms give the same functional result, which is why this entry treats them as two routes
          into one node rather than as two diseases.

          '
        molecular_functions:
        - preferred_term: prostaglandin-endoperoxide synthase activity
          modifier: DECREASED
          term:
            id: GO:0004666
            label: prostaglandin-endoperoxide synthase activity
        cellular_components:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        - preferred_term: megakaryocyte
          term:
            id: CL:0000556
            label: megakaryocyte
      selected_evidence:
        snippet: 'These findings indicate that human platelet PGHS-1 deficiency is due to two types of
          enzyme defects: type 1 defect is manifested by an undetectable PGHS-1 protein in platelets whereas
          the type 2 defect is manifested by a normal quantity of PGHS-1 protein which has an impaired
          catalytic activity.'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
