      assertion:
        name: Loss of Thromboxane-Dependent Secondary Aggregation and Granule Secretion
        role: effector
        biological_scale: CELLULAR
        conforms_to: primary_hemostatic_plug_failure#Impaired Platelet Activation, Granule Secretion,
          and Integrin Inside-Out Signalling
        description: 'The cellular endpoint, and the arm of primary haemostasis this disorder breaks.
          Thromboxane A2 released by an activated platelet acts back on that platelet and on its neighbours
          to sustain aggregation and to drive granule secretion. Without it, aggregation begins and then
          fails to consolidate: the aggregometry signature is subnormal responses to ADP, collagen and
          adrenaline characterised specifically by an abnormal second wave and a tendency to disaggregate,
          with the arachidonate response absent.

          What is preserved matters as much as what is lost, because it is what keeps this disorder off
          the other arms of the module. Adhesion machinery and integrin alphaIIbbeta3 are untouched, ristocetin
          agglutination is normal, and a strong agonist can still aggregate the platelet. The lesion is
          in amplification.

          '
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: platelet aggregation
          modifier: DECREASED
          term:
            id: GO:0070527
            label: platelet aggregation
        - preferred_term: platelet degranulation
          modifier: DECREASED
          term:
            id: GO:0002576
            label: platelet degranulation
      selected_evidence:
        snippet: Platelet aggregation in response to adenosine diphosphate (ADP), collagen and epinephrine
          were subnormal, characterized by an abnormal second-wave aggregation and propensity for disaggregation.
        supports: SUPPORT
