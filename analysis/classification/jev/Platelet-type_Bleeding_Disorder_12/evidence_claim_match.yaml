  5570360a7194b41480a25c5b2120d5b7f18151a475c89705b2a01444f05dff49:
    claim:
      about:
        disease:
          name: Platelet-type Bleeding Disorder 12
          disease_term:
            preferred_term: platelet-type bleeding disorder 12
            term:
              id: MONDO:0011588
              label: platelet-type bleeding disorder 12
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Arachidonate Conversion to Prostaglandin Endoperoxides
        biological_scale: MOLECULAR
        description: 'The blocked step, and the one the disease is defined by. Arachidonic acid released
          from membrane phospholipids on platelet activation should be converted by COX-1 to prostaglandin
          G2 and then H2. In these patients it is not: arachidonate-induced aggregation and arachidonate-driven
          thromboxane production are both defective.

