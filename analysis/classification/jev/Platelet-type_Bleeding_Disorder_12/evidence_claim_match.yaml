      assertion_type: Pathophysiology
      assertion:
        name: PTGS1 Loss-of-Function Variants
        role: trigger
        biological_scale: MOLECULAR
        conforms_to: primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component
        description: 'Germline variants in PTGS1, on chromosome 9q33.2, encoding cyclooxygenase-1 (prostaglandin
          G/H synthase 1). Reported disease alleles are individually rare and mostly private to a family
          or a case, which is why no recurrent pathogenic variant is established for this trait. The best-characterised
          is a variant disrupting N-glycosylation of COX-1, shown to act dominant-negatively on platelet
          function - a mechanism that fits the enzyme''s biology, since COX-1 is functionally active as
          a homodimer and a defective subunit can therefore compromise a dimer containing a normal one.

          '
        genes:
        - preferred_term: PTGS1
          term:
            id: hgnc:9604
            label: PTGS1
          modifier: DECREASED
        genetic_context:
          description: 'Germline PTGS1 variants. This block describes the dominant allele class, which
            accounts for most reported families: heterozygous, with a dominant-negative effect demonstrated
            for an N-glycosylation-disrupting variant. It is a deliberately partial description. The schema
            takes one zygosity and one functional-impact value, and this disease has both modes - the
            recessive p.Trp322Ser allele cited in this node''s own evidence abrogates COX-1 expression
            in a homozygote and is a straightforward loss of function, not a dominant-negative one. Read
            the values here as "the modal allele class", not as a claim about every patient.'
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
      selected_evidence:
        snippet: Recently, the BRIDGE Consortium reported a pedigree with an autosomal recessive variant
          c.965G>C (p.Trp322Ser) that abrogated COX-1 expression resulting in aspirin-like platelet dysfunction.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33326144
      reference_title: A novel genetic variant in PTGS1 affects N-glycosylation of cyclooxygenase-1 causing
        a dominant-negative effect on platelet function and bleeding diathesis.
      evidence_source: HUMAN_CLINICAL
      explanation: A recessive allele in the same gene, recorded because it shows the dominant pattern
        in this entry's inheritance block is the usual case and not the only one.
