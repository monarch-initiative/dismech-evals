          value:
            name: Arachidonate-stimulated platelet thromboxane B2
            presence: DECREASED
            context: 'The confirmatory biochemical assay, and the one that distinguishes this disorder
              from a thromboxane receptor defect. Thromboxane A2 is unstable, so the stable hydrolysis
              product thromboxane B2 is what is measured. Platelets are stimulated with arachidonic acid;
              in COX-1 deficiency the output is grossly low. The three patients in the founding series
              produced 11.7, 4.6 and 4.4 ng TXB2 per 3 x 10^8 platelets against a stated normal range
              of 49 to 81.

              The paired measurement is what makes the assay diagnostic rather than merely abnormal: stimulating
              the same platelets with exogenous prostaglandin H2 - the product COX-1 should have made
              - gives normal thromboxane output, 71.4, 56.6 and 48.9 against a normal range of 49 to 85.
              Low on substrate, normal on product, is the signature of a block at the COX-1 step specifically.'
            cell_types:
            - preferred_term: platelet
              term:
                id: CL:0000233
                label: platelet
            notes: Urinary 11-dehydro-thromboxane B2 is described in the deep-research report as the other
              biochemical confirmation route, and it is the standard non-invasive index of in vivo thromboxane
              generation. It is not curated here because none of the cached references states it for this
              disorder, and an assay this entry cannot quote is not one it should assert.
          role: ancestor
      assertion_type: BiomarkerReadout
      assertion:
        target: Loss of Platelet Thromboxane A2 Generation
