      assertion_type: Diagnosis
      assertion:
        name: PTGS1 sequencing
        description: 'Confirms the diagnosis, usually within a hereditary platelet disorder panel rather
          than as single-gene testing. Its yield is limited by the same thing that limits the genetic
          evidence base: reported alleles are largely private, and most catalogued PTGS1 variants are
          benign or of uncertain significance for this trait, so a negative panel does not exclude the
          functional diagnosis made on aggregometry.

          '
      selected_evidence:
        snippet: To date, only a few cases with uncommon genetic variants in PTGS1, the gene encoding
          COX-1, have been reported, without detailed study of their associated platelet phenotype.
        supports: SUPPORT
