      assertion:
        name: Loss of Platelet Thromboxane A2 Generation
        biological_scale: MOLECULAR
        description: 'Thromboxane synthase is intact but has nothing to work on, so thromboxane A2 output
          falls. The quantitative loss is large: in the founding series, arachidonate-stimulated thromboxane
          B2 was 4.4 to 11.7 ng per 3 x 10^8 platelets against a normal range of 49 to 81.

          Thromboxane A2 is the platelet''s autocrine and paracrine amplifier rather than an initiator,
          which is the whole reason this disease is mild. Its loss is also exactly what low-dose aspirin
          achieves therapeutically, which is why the phenotype is called the aspirin-like defect and why
          concurrent aspirin or NSAID use compounds it.

          '
        biological_processes:
