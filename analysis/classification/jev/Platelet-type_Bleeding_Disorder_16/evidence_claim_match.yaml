          unaffected, and plasma thrombopoietin is not raised. What fails is the terminal step. Proplatelets
          extend with fewer branches and abnormally large tips, and transduced murine megakaryocytes additionally
          form asymmetric barbell proplatelets, so each megakaryocyte yields fewer and larger platelets.
          This is the quantitative arm of the disorder, which the primary_hemostatic_plug_failure module
          deliberately does not model, so no node here conforms to it.

          '
