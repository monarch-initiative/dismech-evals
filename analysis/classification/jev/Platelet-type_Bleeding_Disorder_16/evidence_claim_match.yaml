              label: platelet-type bleeding disorder 16
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ITGA2B Membrane-Proximal Activating Variants
        role: trigger
        biological_scale: MOLECULAR
        conforms_to: primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component
        description: 'Heterozygous germline missense variants and small in-frame deletions in ITGA2B,
          clustered at the membrane-proximal part of alphaIIb: the cytoplasmic GFFKR motif (R995W, R995Q,
          G991C and F993del in legacy numbering) and, less often, the transmembrane domain, where p.Gly1007Val
          substitutes one of the glycines of the outer membrane clasp. R995W is the recurrent allele and
          has arisen at least twice independently, on Japanese and European haplotypes. The conformance
          target is the module''s component-loss node read in its "dysfunctional" sense: the receptor
          is present and it is the wrong shape, which is also why a compound heterozygote carrying G991C
          opposite a nonsense allele sits at the severe, thrombasthenia-like end of the spectrum.

          The molecular function the lesion acts on is the receptor''s own ligand binding: alphaIIbbeta3
          binds fibrinogen, and the membrane-proximal region these variants sit in is what couples that
          binding to inside-out signalling rather than what performs it. The modifier is DYSREGULATED
          rather than INCREASED or GAIN_OF_FUNCTION because the evidence cuts both ways in the same patients.
          Fibrinogen binds resting platelets that have not been activated, which it should not; and binding
          induced by ADP or TRAP-6 is lower than normal, because less receptor is left on the surface.
          Neither half alone describes the function, and asserting only the first would also overstate
          the activation evidence, which is refuted for one allele and undetectable in most patients tested.

          '
        molecular_functions:
        - preferred_term: integrin alphaIIbbeta3 fibrinogen binding
          modifier: DYSREGULATED
          term:
            id: GO:0070051
            label: fibrinogen binding
        genes:
        - preferred_term: ITGA2B
          term:
            id: hgnc:6138
            label: ITGA2B
          modifier: GAIN_OF_FUNCTION
        genetic_context:
          description: Heterozygous germline activating variants in ITGA2B. The functional category is
            gain of function because the variant raises the activation state of the receptor rather than
            removing it, which is the mechanistic inverse of the biallelic loss-of-function variants that
            cause classic Glanzmann thrombasthenia in the same gene.
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: We identified a novel, conserved heterozygous ITGA2B R995W mutation in 4 unrelated families.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
