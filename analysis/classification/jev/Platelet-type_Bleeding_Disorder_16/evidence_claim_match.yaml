  dd1da299f4ce7800c65136272b4bd2b6d7cc8c7d15b299b378c3fb026671b345:
    claim:
      about:
        disease:
          name: Platelet-type Bleeding Disorder 16
          disease_term:
            preferred_term: platelet-type bleeding disorder 16
            term:
              id: MONDO:0008552
              label: platelet-type bleeding disorder 16
        context: []
      assertion_type: Genetic
      assertion:
        name: ITGA2B
        gene_term:
          preferred_term: ITGA2B
          term:
            id: hgnc:6138
            label: ITGA2B
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'ITGA2B, at 17q21.31, encodes the alphaIIb subunit of integrin alphaIIbbeta3, the platelet
          fibrinogen and von Willebrand factor receptor. The same gene causes two mechanistically opposite
          diseases: biallelic loss-of-function variants cause Glanzmann thrombasthenia, while the heterozygous
          variants of this disorder raise the activation state of the receptor. Reported alleles cluster
          in the membrane-proximal region, with p.Arg1026Trp (legacy R995W) recurrent on at least two
          haplotypes and p.Arg1026Gln (legacy R995Q) the first identified. No ClinGen Gene-Disease Validity
          assertion for this gene-disease pair is cached in this repository, so no gene_disease_validity
          tier is recorded.

          '
        variants:
        - name: ITGA2B p.Arg1026Trp
          description: The recurrent allele, legacy name R995W. Reported in four unrelated Japanese families
            in the first molecular series, in further Japanese, French and Portuguese families, and in
            one European-ancestry family in which it arose on a different haplotype. The substitution
            is a C to T transition at a CpG site.
          variant_type: single nucleotide variant
          clinical_significance: PATHOGENIC
        - name: ITGA2B p.Arg1026Gln
          description: Legacy name R995Q, the first natural variant found in the alphaIIb GFFKR motif,
            in the patient described in 1992 with giant platelets and a mild thrombasthenia-like syndrome,
            and found again in one Portuguese family. The transfected receptor was not constitutively
            active in that first study, which is the main exception to the activation mechanism.
          variant_type: single nucleotide variant
          clinical_significance: PATHOGENIC
        - name: ITGA2B p.Gly991Cys
          description: A GFFKR-motif substitution in legacy numbering, identified in a Japanese patient
            who also carried the nonsense allele p.Arg422* in trans and had the most severe reported phenotype,
            with surface alphaIIbbeta3 at 3 to 11 per cent of control.
          clinical_significance: PATHOGENIC
        - name: ITGA2B p.Phe993del
          description: An in-frame single-residue deletion in the GFFKR motif in legacy numbering, heterozygous,
            in a Japanese family with macrothrombocytopenia and no bleeding history in the index case.
          variant_type: deletion
          clinical_significance: PATHOGENIC
        - name: ITGA2B p.Gly1007Val
          description: A transmembrane-domain substitution reported as new in the largest series, at one
            of the glycines of the outer membrane clasp rather than in the cytoplasmic inner clasp, and
            classified there as a variant of uncertain significance.
          variant_type: single nucleotide variant
          clinical_significance: UNCERTAIN_SIGNIFICANCE
      selected_evidence:
        snippet: Homozygous or compound heterozygous loss of function mutations in ITGA2B result in Glanzmann
          thrombasthenia, a bleeding disorder characterized by normal platelet count but abnormal platelet
          function.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
