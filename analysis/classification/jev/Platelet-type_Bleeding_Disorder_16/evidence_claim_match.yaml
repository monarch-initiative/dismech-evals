          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'Heterozygous ITGA2B variants segregating with macrothrombocytopenia across generations.
          The dominance follows from the mechanism: one activating allele is enough to put part of the
          integrin pool into a constitutively active conformation, and what that state then does to megakaryocyte
          cytoskeletal signalling does not require the second allele to be affected. Penetrance for the
          platelet phenotype is high within reported families, while bleeding severity varies and some
          carriers report no bleeding at all.

          '
      selected_evidence:
        snippet: Here we report three new families with autosomal dominant (AD) MTP, two harboring the
          same mutation of ITGA2B, αIIbR995W, and a third family with an ITGB3 mutation, β3D723H.
        supports: SUPPORT
