          Aggregation
        description: 'Aggregation and dense-granule ATP release in response to ADP, collagen, epinephrine
          and arachidonic acid are reduced, while ristocetin agglutination is preserved, so the lesion
          is in aggregation and not in adhesion. The reduction is partial, which is what separates this
          disorder from classic Glanzmann thrombasthenia at the bench: aggregation is diminished rather
          than absent, and the platelet function analyser closure times, although prolonged, never reach
          the values typical of thrombasthenia. Conformance is at the module''s aggregation arm because
          the lesion is in alphaIIbbeta3 itself, with reduced surface receptor and reduced fibrinogen
          binding, rather than in an upstream arm reading out through aggregometry.

          '
        biological_processes:
        - preferred_term: platelet aggregation
          modifier: DECREASED
          term:
            id: GO:0070527
            label: platelet aggregation
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
      selected_evidence:
        snippet: Patients had absent to moderate bleeding, macrothrombocytopenia, low αIIbβ3 expression,
          impaired platelet aggregation/ATP release to physiological agonists and low expression of activation-induced
          binding sites on αIIbβ3 (PAC-1) and receptor-induced binding sites on its ligand (bound fibrinogen),
          upon stimulation with TRAP-6 and ADP.
        supports: SUPPORT
