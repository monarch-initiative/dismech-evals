      assertion:
        name: Arrested Platelet Cytoskeletal Remodelling
        biological_scale: CELLULAR
        description: 'Aggregation and spreading require actin to be turned over, not merely polymerised.
          Under permanent outside-in signalling actin turnover halts at the polymerisation stage, and
          the authors who showed this reproduced the patients'' functional defect in normal platelets
          with jasplakinolide, a toxin that promotes nucleation and prevents depolymerisation. That pharmacological
          phenocopy is what makes the arrested cytoskeleton, rather than the reduced receptor number alone,
          the proximate cause of the platelet dysfunction.

          '
        biological_processes:
