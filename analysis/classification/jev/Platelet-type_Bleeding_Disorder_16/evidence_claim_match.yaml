            description: 'Megakaryocytes differentiated from mouse fetal liver cells after transduction
              with the human alphaIIb R995W allele together with beta3. This is the model that connects
              the receptor lesion to the platelet count: it puts the patient''s allele into a cell that
              actually makes platelets, and asks what the proplatelets look like.

              '
          role: ancestor
        - path: /experimental_models/0/modeled_mechanisms/0
          value:
            target: Abnormal Proplatelet Formation by Megakaryocytes
            relationship: RECAPITULATES
            fidelity: MODERATE
            model_scale: CELLULAR
            description: Transduced megakaryocytes form proplatelets with fewer and larger tips, which
              is the cellular defect this node asserts.
            limitations: The human allele is expressed in a mouse megakaryocyte alongside the endogenous
              mouse integrin and at a transduced rather than heterozygous level, so the gene dosage is
              not the patient's. Proplatelet tips in culture are a surrogate for platelet release in the
              marrow, and no platelet count or bleeding phenotype is measured.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Proplatelet tip number and size
        target: Abnormal Proplatelet Formation by Megakaryocytes
        direction: ALTERED
        interpretation: Fewer tips of larger size is the culture correlate of releasing fewer and larger
          platelets.
      selected_evidence:
        snippet: The increased size and decreased number of proplatelet tips in αIIb-W995/β3-transduced
          mouse fetal liver-derived megakaryocytes indicate defective pro-platelet formation.
