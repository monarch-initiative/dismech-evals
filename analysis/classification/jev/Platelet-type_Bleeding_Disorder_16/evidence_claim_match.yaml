        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disruption of the alphaIIb-beta3 Inner Membrane Clasp
        biological_scale: MOLECULAR
        description: 'In a resting platelet alphaIIbbeta3 is held bent and closed by two inter-subunit
          constraints, the transmembrane outer membrane clasp and the cytoplasmic inner membrane clasp,
          whose key contact is the salt bridge between alphaIIb Arg995 and beta3 Asp723. Physiological
          activation requires that clasp to open, so a variant that weakens it lowers the threshold for
          the conformational change rather than adding a new activity.

          '
        cellular_components:
        - preferred_term: integrin alphaIIb-beta3 complex
          term:
            id: GO:0070442
            label: integrin alphaIIb-beta3 complex
      selected_evidence:
        snippet: Significantly, Arg995 and Asp723 form a salt linkage binding the cytoplasmic tails of
          αIIbβ3 together keeping the integrin in a bent resting state.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
