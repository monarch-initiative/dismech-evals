        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'No population estimate exists for this disorder. ITGA2B-related macrothrombocytopenia
          is known from a small number of families: four unrelated Japanese families carrying R995W in
          the first molecular series, three further families in a Japanese series of novel alleles, a
          later series of three families of which two carry R995W, one European-ancestry family in which
          the same allele arose on a different haplotype, and five Portuguese families in the largest
          single-centre series. Because the bleeding is mild and the platelet count often only moderately
          reduced, affected families are readily misclassified as immune thrombocytopenia or left undiagnosed.'
      selected_evidence:
        snippet: 'We identified 7 missense variants: 3 in ITGA2B (5 families), and 4 in ITGB3 (5 families).'
        supports: SUPPORT
