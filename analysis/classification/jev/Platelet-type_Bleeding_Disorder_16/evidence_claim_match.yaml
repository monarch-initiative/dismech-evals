          work in, because a heterozygous variant in either gene has to be interpreted against the platelet
          count, the platelet size and the surface receptor level before it means this disease rather
          than Glanzmann thrombasthenia carriership or nothing.

          '
      selected_evidence:
        snippet: Genetic analysis of ITGA2B and ITGB3 genes was performed by NGS in selected patients
          from families with novel variants, using a commercially available gene panel for hematologic
          diseases
        supports: SUPPORT
