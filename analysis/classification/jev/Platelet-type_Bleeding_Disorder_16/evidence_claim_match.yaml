              pathway in megakaryocytes and platelets: focal adhesion kinase is spontaneously phosphorylated,
              and RhoA activity falls, which is the arm that couples the receptor to the cytoskeleton.
              In transfected non-haematopoietic cells the same signal produces membrane ruffling and abnormal
              cytoplasmic protrusions resembling the extensions a megakaryocyte makes when it forms proplatelets.

              '
