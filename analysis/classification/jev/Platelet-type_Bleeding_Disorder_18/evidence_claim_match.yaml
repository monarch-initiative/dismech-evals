      assertion_type: Pathophysiology
      assertion:
        name: Residual PKC- and ADP-Dependent Platelet Activation
        role: adaptive_escape
        biological_scale: CELLULAR
        description: 'The compensating pathway, and a real one rather than a theoretical possibility.
          PKC- and ADP-dependent signalling allows residual platelet activation in the absence of functional
          CalDAG-GEFI, which is why the aggregation defect is severe but not absolute and why the disorder''s
          severity varies. Its existence is also what makes CalDAG-GEFI a plausible antithrombotic target:
          a pathway with a backup can be blocked without abolishing haemostasis outright.'
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: platelet activation
          term:
            id: GO:0030168
            label: platelet activation
          modifier: DECREASED
      selected_evidence:
        snippet: Nevertheless, the PKC- and ADP-dependent pathways allow residual platelet activation
          in the absence of functional CalDAG-GEFI.
        supports: SUPPORT
