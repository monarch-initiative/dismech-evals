        context: []
      assertion_type: Genetic
      assertion:
        name: RASGRP2
        gene_term:
          preferred_term: RASGRP2
          term:
            id: hgnc:9879
            label: RASGRP2
        relationship_type: CAUSATIVE
        notes: Encodes CalDAG-GEFI. Biallelic loss of function causes the disorder; reported alleles include
          c.G742T, c.706C>T (p.Q236X) and c.887G>A (p.C296Y). The gene is expressed in neutrophils as
          well as platelets and CalDAG-GEFI is described as critical for integrin signalling in both,
          yet the clinical phenotype is platelet-restricted - patient neutrophils show normal integrin
          expression, with the abnormality detectable only as impaired manganese-induced fibrinogen binding
          in vitro. This dissociation, not the gene's expression pattern, is what distinguishes the disorder
          from leukocyte adhesion deficiency III.
      selected_evidence:
        snippet: Functional deficiencies were confined to platelets and megakaryocytes with no leukocyte
          alteration. This contrasts with the phenotype seen in type III leukocyte adhesion deficiency
          caused by the absence of kindlin-3.
        supports: SUPPORT
    origin:
