      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Loss of Function in RASGRP2
        role: trigger
        biological_scale: MOLECULAR
        conforms_to: primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component
        description: Biallelic RASGRP2 variants abolish CalDAG-GEFI. The index family carried c.G742T,
          identified by whole-exome sequencing in three siblings with severe bleeding; nonsense (p.Q236X)
          and missense (p.C296Y) alleles have since been reported homozygously with no detectable CalDAG-GEFI
          protein in platelet lysates. Both null and expressed-but-dysfunctional alleles occur, so protein
          absence is not a requirement for the diagnosis.
        genetic_context:
          allele_type: SNV
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        - preferred_term: megakaryocyte
          term:
            id: CL:0000556
            label: megakaryocyte
      selected_evidence:
        snippet: Using whole-exome sequencing, we identified the culprit mutation (cG742T) in the RAS
          guanyl-releasing protein-2 (RASGRP2) gene coding for calcium- and DAG-regulated guanine exchange
          factor-1 (CalDAG-GEFI).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
