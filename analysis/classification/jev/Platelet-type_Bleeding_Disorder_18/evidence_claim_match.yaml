      assertion_type: Diagnosis
      assertion:
        name: Aggregometry with a Phorbol-Ester Arm, Plus Receptor Quantitation
        description: 'The disorder imitates Glanzmann thrombasthenia on a standard workup, and two additions
          separate them. First, quantify surface alphaIIbbeta3 - it is normal here and deficient there.
          Second, include a phorbol ester (PMA) arm on the aggregometry panel: PMA activates protein kinase
          C downstream of the missing exchange factor, so aggregation is preserved with PMA while failing
          to ADP, collagen and the other physiological agonists. Prolonged PFA-100 closure times with
          a normal platelet count and morphology complete the picture, and sequencing confirms. Without
          the PMA arm the two disorders are not distinguishable by aggregometry alone.'
      selected_evidence:
        snippet: 'Platelet phenotyping showed: prolonged PFA-100 closure times; normal expression of major
          glycoprotein receptors'
        supports: SUPPORT
