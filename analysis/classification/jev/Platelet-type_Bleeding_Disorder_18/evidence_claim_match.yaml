      assertion_type: Pathophysiology
      assertion:
        name: Impaired Rac1-Dependent Platelet Spreading and Adhesion Under Flow
        role: effector
        biological_scale: CELLULAR
        description: 'A cytoskeletal arm separate from integrin activation: patient platelets fail to
          form thrombi under flow and fail to spread normally, and this is attributed to reduced Rac1
          GTP-binding rather than to the Rap1-integrin route. It is the more sensitive readout of the
          two - heterozygotes, who do not bleed and whose platelet aggregation is normal, nonetheless
          fail to adhere under flow and to spread like their homozygous relatives, so this arm detects
          a defect that the aggregation arm does not.'
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: actin cytoskeleton organization
          term:
            id: GO:0030036
            label: actin cytoskeleton organization
          modifier: DECREASED
      selected_evidence:
        snippet: The mutation impairs the platelet's ability to form thrombi under flow and spread normally
          as a consequence of reduced Rac1 GTP-binding.
        supports: SUPPORT
