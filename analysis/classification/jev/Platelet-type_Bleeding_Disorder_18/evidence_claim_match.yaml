      assertion:
        name: Glanzmann Thrombasthenia
        description: The disorder this one imitates. Both give absent or severely reduced aggregation
          with a normal platelet count and morphology; here the integrin is expressed normally and PMA-induced
          aggregation is preserved, whereas in Glanzmann thrombasthenia the receptor itself is deficient
          or non-functional and no agonist works. Flow cytometry for alphaIIbbeta3 plus a PMA arm on aggregometry
          separates them.
      selected_evidence:
        snippet: normal expression of major glycoprotein receptors; severely reduced platelet aggregation
          response to ADP and collagen (both patients); aggregation response to PAR1 and arachidonic acid
          markedly impaired in one patient; PMA-induced aggregation unaffected
