        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Integrin alphaIIbbeta3 Inside-Out Activation
        role: effector
        biological_scale: CELLULAR
        conforms_to: primary_hemostatic_plug_failure#Impaired Platelet Activation, Granule Secretion,
          and Integrin Inside-Out Signalling
        description: 'The integrin is expressed normally - major glycoprotein receptor levels are normal
          in patients - but fibrinogen binding is greatly impaired in response to every agonist tested
          except phorbol ester. That single exception is mechanistically the most informative result in
          the disorder: phorbol ester activates protein kinase C directly, downstream of the missing exchange
          factor, and it restores aggregation, which localizes the block precisely to the CalDAG-GEFI
          step and demonstrates that a parallel PKC route to the same integrin exists and is intact.'
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: integrin inside-out activation
          term:
            id: GO:0033622
            label: integrin activation
          modifier: DECREASED
      selected_evidence:
        snippet: platelet αIIbβ3 activation, as assessed by fibrinogen binding, was greatly impaired in
          response to all agonists except PMA
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
