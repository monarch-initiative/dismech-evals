              label: platelet-type bleeding disorder 18
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of CalDAG-GEFI-Dependent Rap1 Activation
        role: central_effector
        biological_scale: MOLECULAR
        description: The rate-limiting lesion. CalDAG-GEFI is activated by rising cytoplasmic calcium
          downstream of phospholipase-C-coupled agonist receptors, and its main target is Rap1, the small
          GTPase that regulates integrin-mediated adhesion. Patient platelets show reduced ability to
          activate Rap1, and expressing the mutant protein in HEK293T cells abolishes Rap1 activation
          on stimulation - a heterologous confirmation that separates the molecular defect from anything
          else in the patient's platelet.
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        molecular_functions:
        - preferred_term: CalDAG-GEFI guanine nucleotide exchange factor activity
          term:
            id: GO:0005085
            label: guanyl-nucleotide exchange factor activity
          modifier: LOSS_OF_FUNCTION
        biological_processes:
        - preferred_term: Rap protein signal transduction
          term:
            id: GO:0032486
            label: Rap protein signal transduction
          modifier: DECREASED
      selected_evidence:
        snippet: Platelets from individuals carrying the mutation present a reduced ability to activate
          Rap1 and to perform proper αIIbβ3 integrin inside-out signaling.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
