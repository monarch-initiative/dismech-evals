      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous SLFN14 Variant
        role: trigger
        biological_scale: MOLECULAR
        description: 'A single SLFN14 allele carries a missense variant. The reported variants cluster
          tightly: K218E, K219N and V220D lie in three consecutive residues of the AAA domain, and R223W
          sits four residues further along, so the recurrent lesion is a small patch of the RNA-binding
          cleft rather than a scatter across the protein.

          Later reports have added variants in the C-terminal helicase domain, which is a different part
          of the protein and appears to act differently; those are noted on the gene entry rather than
          folded into this node.'
        genetic_context:
          gene:
            preferred_term: SLFN14
            term:
              id: hgnc:32689
              label: SLFN14
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: 'Heterozygous missense variants segregating dominantly. Deliberately carries no
            `functional_impact_category`: the two competing mechanistic accounts below disagree on whether
            these alleles are loss-of-function or neomorphic, and choosing a value here would silently
            settle a question the literature has not.'
      selected_evidence:
        snippet: Three heterozygous missense mutations were identified in affected family members and
          predicted to encode substitutions (K218E, K219N, and V220D) within an ATPase-AAA-4, GTP/ATP-binding
          region of SLFN14.
        supports: SUPPORT
