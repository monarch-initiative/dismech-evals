      assertion_type: Treatment
      assertion:
        name: Genetic Counselling
        therapeutic_modality: BEHAVIORAL
        description: 'Autosomal dominant inheritance with a 50% recurrence risk per pregnancy. Two points
          are worth raising specifically. First, bleeding severity is not predicted by the platelet count
          - the cited pedigree was followed for bleeding disproportionate to the degree of thrombocytopenia.
          Second, an apparently de novo case does not exclude parental transmission: maternal gonosomal
          mosaicism has been reported in SLFN14 (PMID:36237120, listed in references). No evidence item
          is attached to that second point because only the title of that report is retrievable, and a
          title is not a finding.'
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: Heterozygous missense mutations in SLFN14 cause an autosomal dominant form of IT, characterized
          by defective platelet function and excessive bleeding
        supports: SUPPORT
