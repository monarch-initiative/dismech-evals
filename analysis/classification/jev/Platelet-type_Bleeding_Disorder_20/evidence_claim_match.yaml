        mechanism_confidence: ESTABLISHED
        description: 'SLFN14 protein is markedly reduced in patient platelets and in cells transfected
          with the mutant construct. The reduction is post-translational: the variants partially misfold
          and are degraded, and because the mutant protein also oligomerises, the wild-type product made
          from the normal allele is dragged down with it. That is the proposed basis of dominance.

          Curated as ESTABLISHED because the measurement itself - less protein in patient platelets -
          is reproduced across reports. What is contested is whether losing protein is the whole story,
          which is the point of the competing node below.'
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
      selected_evidence:
        snippet: Compared to SLFN14 WT, expression of mutants is dramatically reduced as a result of post-translational
          degradation due to partial misfolding of the protein.
        supports: SUPPORT
