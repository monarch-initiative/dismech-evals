        context: []
      assertion_type: Diagnosis
      assertion:
        name: Platelet Function Testing with Lumiaggregometry
        description: Aggregation and ATP-release testing is what separates this disease from an isolated
          thrombocytopenia. The pattern is reduced aggregation to ADP, collagen and PAR1 peptide together
          with reduced ATP secretion; electron microscopy showing a reduced dense-granule count supports
          it. The abnormalities are mild, so a normal-looking screen in a patient who bleeds should not
          close the question.
      selected_evidence:
        snippet: Electron microscopy revealed a reduced number of dense granules in affected patients
          platelets, correlating with a decreased ATP secretion observed in lumiaggregometry studies.
        supports: SUPPORT
    origin:
