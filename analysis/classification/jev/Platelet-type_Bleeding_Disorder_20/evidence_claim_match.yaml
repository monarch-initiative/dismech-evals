          value:
            name: Global Slfn14 K208N knockin mouse
            species: Mouse
            genotype: Slfn14 K208N knockin (mouse homologue of human K219N), global
            publication: PMID:40794453
            description: 'The obvious model - a knockin of the mouse equivalent of the commonest patient
              variant, in every cell, matching the human genotype in kind. It does not model the human
              disease. Homozygotes have an erythroid phenotype with microcytic erythrocytosis and die
              in utero; heterozygotes have anaemia and splenomegaly. The platelet and bleeding phenotype
              that defines the human condition is absent.

              Curated because a negative result of this size constrains how the rest of the model evidence
              should be read, and because it is the reason the conditional knockout above exists.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Mucocutaneous Bleeding Diathesis
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: The genotype-matched model produces an erythroid disease rather than a bleeding disease.
        limitations: The divergence is attributed to species differences in which lineage depends most
          on SLFN14, but that explanation has not been tested. Until it is, the mouse cannot be used to
          argue either for or against a mechanism of the human bleeding phenotype, and no therapeutic
          inference should be drawn from it.
      selected_evidence:
        snippet: Unlike the human SLFN14 K219N mutation, mice did not present with a major bleeding or
          platelet defect
        supports: REFUTE
