      assertion_type: Genetic
      assertion:
        name: SLFN14
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: SLFN14
          term:
            id: hgnc:32689
            label: SLFN14
        association: 'Heterozygous SLFN14 variants cause this disease. The gene was established by exome
          sequencing of a national platelet-genotyping cohort, which found variants in 12 patients across
          3 unrelated families with a shared and distinctive platelet phenotype - a strong founding design,
          because the families were ascertained on bleeding rather than on the gene.

          The variant spectrum is unusually concentrated. K218E, K219N and V220D occupy three consecutive
          residues; R223W is four residues away. All four sit in the RNA-binding cleft of the RNase domain.
          Variants have since been reported in the C-terminal helicase domain, which is a different region
          and appears to produce its effects by a different route; whether helicase-domain disease is
          the same entity as AAA-domain disease is not settled, and this entry does not assume it is.

          SLFN14 is expressed in megakaryocyte and erythroid precursors, which is what makes a general
          RNA-handling enzyme into a lineage-restricted disease gene.'
      selected_evidence:
        snippet: We performed platelet phenotyping and whole-exome sequencing (WES) on all patients and
          identified mutations in schlafen 14 (SLFN14) in 12 patients from 3 unrelated families.
        supports: SUPPORT
