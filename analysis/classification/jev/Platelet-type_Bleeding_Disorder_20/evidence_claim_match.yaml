  ba62704535cfd2debc496dc5da10699872b1e83ab8c90441777eb5bdb366f1d7:
    claim:
      about:
        disease:
          name: Platelet-type Bleeding Disorder 20
          disease_term:
            preferred_term: platelet-type bleeding disorder 20
            term:
              id: MONDO:0014830
              label: platelet-type bleeding disorder 20
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Redirected Endoribonuclease Substrate Specificity
        role: mechanism
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: 'The competing account. Rather than simply having less enzyme, patient variants have
          an enzyme that prefers different substrates: depletion of type II tRNAs is enhanced while cleavage
          of ribosomal RNA is reduced. That is a change in what the enzyme does, not only in how much
          of it there is.

          The distinction matters because the two accounts point opposite ways therapeutically. If the
          lesion is loss of SLFN14, restoring or stabilising the protein is the goal. If the lesion is
          redirected activity, restoring the protein would deliver more of the wrong enzymatic activity,
          and inhibiting it would be closer to right.

          PROVISIONAL: the work is in an overexpression cell system rather than in megakaryocytes or patient
          cells, and no experiment has yet distinguished the two accounts in the lineage that actually
          fails.'
        molecular_functions:
        - preferred_term: RNA endonuclease activity
          term:
            id: GO:0004521
            label: RNA endonuclease activity
          modifier: ABNORMAL
      selected_evidence:
        snippet: IT-linked mutations alter SLFN14 RNA substrate specificity, enhancing depletion of type
          II tRNAs while reducing rRNA cleavage.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
