              label: bleeding disorder, platelet-type, 22
        context: []
      assertion_type: Treatment
      assertion:
        name: Extrapolated inherited-platelet-disorder haemostatic management
        description: 'No EPHB2-directed therapy exists and no interventional trial has been run in this
          disorder, so bleeding is managed with the general inherited-platelet-disorder repertoire: local
          haemostatic measures, an antifibrinolytic such as tranexamic acid, selected use of desmopressin,
          platelet concentrates when simpler measures are insufficient, and recombinant activated factor
          VII in refractory bleeding. This is class-level guidance applied to a disorder in which none
          of it has been tested, and it is curated as such rather than as a disease-specific recommendation.
          The alloimmunisation hazard of platelet transfusion applies here as it does across the group.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: supportive haemostatic care
          term:
            id: NCIT:C15747
            label: Supportive Care
          therapeutic_agent:
          - preferred_term: tranexamic acid
            term:
              id: CHEBI:48669
              label: tranexamic acid
          - preferred_term: desmopressin
            term:
              id: CHEBI:4450
              label: desmopressin
        target_phenotypes:
        - preferred_term: Abnormal bleeding
          term:
            id: HP:0001892
            label: Abnormal bleeding
        notes: Extrapolated, not disease-specific. Neither cited source reports any of these measures
          being used in an EPHB2 patient; the falcon deep-research report for this entry reached the same
          conclusion after searching for BDPLT22-specific therapy, response-rate data and trial registrations
          and finding none.
      selected_evidence:
        snippet: Established treatment options of IPDs include local hemostatic treatment, tranexamic
          acid, desmopressin, platelet concentrates, and recombinant activated factor VII.
        supports: SUPPORT
