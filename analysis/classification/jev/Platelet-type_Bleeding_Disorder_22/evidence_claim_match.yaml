      assertion_type: DifferentialDiagnosis
      assertion:
        name: Bernard-Soulier syndrome
        description: Both cause mucocutaneous bleeding from a platelet defect, but they separate on the
          ristocetin response and on the platelet count. Bernard-Soulier syndrome is a defect of the GPIb-IX-V
          adhesion receptor, so ristocetin-induced agglutination fails and the platelets are large and
          reduced in number. Here the ristocetin response is specifically the one spared, and the count
          is normal at presentation.
      selected_evidence:
        snippet: Platelet function tests revealed decreased responses to various agonists except ristocetin
        supports: SUPPORT
