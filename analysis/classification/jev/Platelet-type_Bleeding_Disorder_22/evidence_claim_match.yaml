        - path: /animal_models/0
          value:
            name: EphB2 cytoplasmic-domain truncation mouse
            species: Mouse
            genotype: EphB2 cytoplasmic-domain truncation
            publication: PMID:25370417
            description: A mouse genetic model that removes signalling from the EphB2 cytoplasmic domain
              while leaving the extracellular receptor in place. It predates the human disorder and was
              designed to separate Eph kinase signalling from Eph-ephrin ligation, which is the same dissociation
              the human p.Arg745Cys allele produces.
          role: ancestor
        - path: /animal_models/0/modeled_mechanisms/0
          value:
            target: Impaired EPHB2 Autophosphorylation with Preserved Ephrin Clustering
            relationship: PARTIALLY_RECAPITULATES
            fidelity: MODERATE
            description: Removes EphB2 cytoplasmic signalling in the platelet, and shows that doing so
              impairs platelet activation without requiring Eph-ephrin ligation between platelets - the
              contact-independent role the human variant disrupts.
            limitations: A truncation of the whole cytoplasmic domain in mouse, not the human p.Arg745Cys
              missense allele, so it models loss of EphB2 signalling in general rather than the partial
              kinase defect of the patients. It also reports clot retraction as EphB2-dependent, whereas
              clot retraction was only mildly affected in the human patients, so the two do not agree
              on every readout.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
