        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Glanzmann thrombasthenia
        description: Both present with defective aggregation and a normal platelet count, but Glanzmann
          thrombasthenia is a structural defect of integrin alphaIIbbeta3 itself and abolishes clot retraction,
          whereas here alphaIIbbeta3 outside-in functions - clot retraction and spreading on fibrinogen
          - are only mildly affected and the lesion is upstream, in inside-out signalling.
      selected_evidence:
        snippet: In contrast, clot retraction, flow-dependent platelet adhesion, and spreading on fibrinogen
          were only mildly affected, indicating limited effects on αIIbβ3 outside-in signaling.
        supports: SUPPORT
    origin:
