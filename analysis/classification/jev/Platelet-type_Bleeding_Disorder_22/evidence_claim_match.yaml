      assertion_type: Phenotype
      assertion:
        category: Hematologic
        name: Normal Platelet Count at Presentation, with a Later Mild Decrease
        description: The platelet count is normal at presentation, which is what places this disorder
          among the inherited platelet disorders with a normal count rather than among the thrombocytopenias.
          ClinGen's summary adds that a mild decrease in count was observed later in life. Both statements
          are curated because the normal count is diagnostically load-bearing and the later drift would
          otherwise look like a contradiction.
        phenotype_term:
          preferred_term: Normal platelet count at presentation, with a mild later decrease
        notes: 'Deliberately carries no `term:`. The HPO has no class for a normal count that later drifts
          mildly downward, and binding `HP:0001873 Thrombocytopenia` would assert a thrombocytopenia the
          founding report explicitly excludes. Following the same reasoning recorded on the equivalent
          node in `Platelet-type_Bleeding_Disorder_18`, no term is bound rather than a misleading one.
          This phenotype is also deliberately left unwired to the pathograph: it is a negative finding
          that constrains the differential rather than a consequence of any node in the causal chain,
          so no incoming edge would be truthful.'
      selected_evidence:
        snippet: a mild decrease in platelet count observed later in life
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/5
      evidence_path: /phenotypes/5/evidence/1
