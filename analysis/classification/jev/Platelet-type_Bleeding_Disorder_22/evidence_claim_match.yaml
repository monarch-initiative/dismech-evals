              id: MONDO:0032765
              label: bleeding disorder, platelet-type, 22
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Proximal GPVI Signalling
        role: central_effector
        biological_scale: MOLECULAR
        description: Phosphorylation of Lyn, Syk and FcR gamma - the first steps of signalling from the
          collagen receptor GPVI - is drastically impaired, and it is impaired in the absence of platelet-platelet
          contact. That last clause is what separates this disorder from the classical contact-dependent
          Eph-ephrin model of platelet Eph receptor function.
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: collagen receptor GPVI signalling
          term:
            id: GO:0038065
            label: collagen-activated signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Most importantly, Lyn, Syk, and FcRγ phosphorylation, the initial steps in glycoprotein
          VI (GPVI) platelet signaling were drastically impaired in the absence of platelet-platelet contact,
          indicating a positive role for EPHB2 in GPVI activation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
