        target: Impaired EPHB2 Autophosphorylation with Preserved Ephrin Clustering
        direction: DECREASED
        interpretation: Establishes EphB2 cytoplasmic signalling as a regulator of thrombus formation
          in vivo.
      selected_evidence:
        snippet: We conclude that EphB2 signaling is involved in the regulation of thrombus formation
