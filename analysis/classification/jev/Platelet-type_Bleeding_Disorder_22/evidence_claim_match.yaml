  e68348e3d3ed8fca7ffd840980bd4ed4d01de98118a60e9804e77ffc78e55cf9:
    claim:
      about:
        disease:
          name: Platelet-type Bleeding Disorder 22
          disease_term:
            preferred_term: bleeding disorder, platelet-type, 22
            term:
              id: MONDO:0032765
              label: bleeding disorder, platelet-type, 22
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired EPHB2 Autophosphorylation with Preserved Ephrin Clustering
        role: central_effector
        biological_scale: MOLECULAR
        description: 'The variant halves EPHB2 autophosphorylation but leaves ephrin-ligand-induced receptor
          clustering unaffected. This dissociation is the mechanistic pivot of the disorder: the defect
          is in the receptor''s kinase output, not in its ability to engage ephrin on a neighbouring cell,
          so the lesion is not a contact-dependent one.'
        biological_processes:
        - preferred_term: EPHB2 autophosphorylation
          term:
            id: GO:0046777
            label: protein autophosphorylation
          modifier: DECREASED
      selected_evidence:
        snippet: Overexpression of wild-type and R745C EPHB2 variant in RBL-2H3 (rat basophilic leukemia)
          cells stably expressing human GPVI confirmed that EPHB2 R745C mutation impaired EPHB2 autophosphorylation
          but had no effect on ephrin ligand-induced EPHB2 clustering, suggesting it did not interfere
          with EPHB2-ephrin-mediated cell-to-cell contact.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30213874
      reference_title: A mutation of the human EPHB2 gene leads to a major platelet functional defect.
      evidence_source: IN_VITRO
      explanation: Heterologous-cell experiment separating the autophosphorylation defect from ephrin-induced
        clustering, which is the dissociation this node asserts.
