        name: P2Y12 Antagonist Therapy (Acquired Phenocopy)
        description: 'Clopidogrel, prasugrel and ticagrelor block the same receptor, so a treated patient
          has an acquired form of this disorder and is laboratory-identical to one who inherited it. This
          is the single most common cause of the phenotype by a wide margin and must be excluded first.
          The reverse observation is also informative: roughly a third of clopidogrel-treated patients
          fail to inhibit P2Y12 adequately, so the drug does not reliably produce the phenocopy either.'
      selected_evidence:
        snippet: The most important drawback of clopidogrel is its inability to inhibit adequately P2Y₁₂-dependent
          platelet function in approximately one-third of patients who are therefore not protected from
          major cardiovascular events.
        supports: SUPPORT
