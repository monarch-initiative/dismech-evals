      assertion:
        name: Failure of Primary Hemostatic Plug Formation
        role: effector
        biological_scale: TISSUE
        conforms_to: primary_hemostatic_plug_failure#Failure of Primary Hemostatic Plug Formation
        description: 'A partial rather than a total failure, which is why the bleeding is milder than
          in the receptor and integrin disorders: adhesion, shape change, the initial aggregation wave
          and the integrin itself are all intact, and what is lost is the amplification that consolidates
          the plug. The clearest evidence that this step matters haemostatically is pharmacological -
          blocking the same receptor in healthy people is potently antithrombotic and does increase major
          bleeding.'
        biological_processes:
        - preferred_term: primary hemostasis
          term:
            id: GO:0007599
            label: hemostasis
          modifier: DECREASED
      selected_evidence:
        snippet: Drugs that inhibit P2Y₁₂ are potent antithrombotic drugs, attesting the central role
          played by P2Y₁₂ in platelet thrombus formation.
        supports: SUPPORT
