  1c5e19e64df5924ef01216c7fb5567db44f436979cb907e8e7af6de721444b3c:
    claim:
      about:
        disease:
          name: Platelet-type bleeding disorder 8
          disease_term:
            preferred_term: platelet-type bleeding disorder 8
            term:
              id: MONDO:0012354
              label: platelet-type bleeding disorder 8
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Gi-Coupled ADP Signalling
        role: central_effector
        biological_scale: MOLECULAR
        description: 'The rate-limiting lesion. P2Y12 is negatively coupled to adenylyl cyclase through
          Gi, and the functional test that confirms the diagnosis is exactly this step: in cells expressing
          wild-type receptor, ADP strongly inhibits the forskolin-induced rise in cyclic AMP across the
          full concentration range, whereas the mutant receptors are only partially inhibitory. Because
          cyclic AMP restrains platelet activation, failure to lower it leaves the platelet partially
          braked at the moment it should be committing to aggregation.'
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        molecular_functions:
        - preferred_term: P2Y12 ADP receptor activity
          term:
            id: GO:0001621
            label: G protein-coupled ADP receptor activity
          modifier: LOSS_OF_FUNCTION
        biological_processes:
        - preferred_term: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
          term:
            id: GO:0007193
            label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: The other ADP receptor, P2Y (12), is negatively coupled to adenylyl cyclase through Gi
          and mediates a progressive and sustained ADP-induced aggregation not preceded by shape change.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15852220
      reference_title: The P2 receptors and congenital platelet function defects.
      evidence_source: HUMAN_CLINICAL
      explanation: States the receptor's coupling and the specific aggregation component it mediates,
        which is what this node records as lost.
