            term:
              id: MONDO:0012354
              label: platelet-type bleeding disorder 8
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Sustained Aggregation and Agonist-Induced Secretion Potentiation
        role: effector
        biological_scale: CELLULAR
        conforms_to: primary_hemostatic_plug_failure#Impaired Platelet Activation, Granule Secretion,
          and Integrin Inside-Out Signalling
        description: The functional consequence has two parts, and the second is easy to overlook. The
          obvious one is that the sustained, irreversible phase of ADP aggregation is lost while the P2Y1-dependent
          shape change and initial reversible wave remain, so aggregation to ADP is incomplete and reverses
          even at high agonist concentrations - the diagnostic signature. The less obvious one is that
          P2Y12 also potentiates secretion induced by several other agonists, so the defect degrades the
          amplification loop generally rather than only the response to ADP.
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: platelet aggregation
          term:
            id: GO:0070527
            label: platelet aggregation
          modifier: DECREASED
        - preferred_term: platelet degranulation
          term:
            id: GO:0002576
            label: platelet degranulation
          modifier: DECREASED
      selected_evidence:
        snippet: In addition, this receptor plays an important role in the potentiation of platelet secretion
          induced by several platelet agonists. The combined action of P2Y (1) and P2Y (12) is necessary
          for the full platelet aggregation response to ADP.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15852220
      reference_title: The P2 receptors and congenital platelet function defects.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports both halves of this node - the secretion-potentiation role and the requirement
        for both receptors for a full ADP response.
