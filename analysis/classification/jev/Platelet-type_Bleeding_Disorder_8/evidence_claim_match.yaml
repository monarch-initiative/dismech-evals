        name: Aggregometry Plus Adenylyl Cyclase Inhibition Testing
        description: Screening is by aggregometry - incomplete, reversible aggregation to high ADP - but
          that pattern alone is not confirmatory. Confirmation requires tests that evaluate the degree
          of inhibition of adenylyl cyclase by ADP, which interrogate the Gi coupling directly. The practical
          trap is that P2Y12 antagonist drugs reproduce the laboratory picture exactly, so excluding recent
          clopidogrel, prasugrel or ticagrelor exposure is part of the diagnosis rather than an afterthought.
      selected_evidence:
        snippet: Tests that evaluate the degree of inhibition of adenylyl cyclase by ADP should be used
