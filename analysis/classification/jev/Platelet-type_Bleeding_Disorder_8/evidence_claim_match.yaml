        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Function in P2RY12
        role: trigger
        biological_scale: MOLECULAR
        conforms_to: primary_hemostatic_plug_failure#Loss of a Platelet Primary-Hemostatic Component
        description: 'Variants in P2RY12 cause the disorder by two distinct routes, both documented. In
          the severe-deficiency families the alleles are frameshifts with premature truncation of the
          protein, so no receptor reaches the surface. In at least one compound heterozygote the receptor
          is expressed and trafficked normally but is dysfunctional: p.Arg256Gln in transmembrane helix
          6 and p.Arg265Trp in extracellular loop 3 both reach the cell surface in transfected cells and
          both fail to transduce properly, which identifies that region as structurally and functionally
          critical. A quantitative assay of receptor expression would therefore miss the second class
          entirely.'
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
      selected_evidence:
        snippet: Sequence analysis of the P2Y (12) locus of three of these patients revealed homozygous
          mutations that produced a frame shift mutation and premature truncation of the protein.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15852220
      reference_title: The P2 receptors and congenital platelet function defects.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents the null allele class in the originally described severe-deficiency patients.
