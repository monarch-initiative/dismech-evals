          name: Platelet-type bleeding disorder 8
          disease_term:
            preferred_term: platelet-type bleeding disorder 8
            term:
              id: MONDO:0012354
              label: platelet-type bleeding disorder 8
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_congenital_vs_pharmacological_p2y12_loss
        kind: KNOWLEDGE_GAP
        prompt: Why is lifelong congenital P2Y12 loss only mildly to moderately haemorrhagic when acute
          pharmacological P2Y12 blockade measurably increases major bleeding?
        attaches_to:
        - pathophysiology#Failure of Primary Hemostatic Plug Formation
        - pathophysiology#Mild to Moderate Mucocutaneous Bleeding Diathesis
        rationale: 'The same receptor is lost in both cases, yet the clinical weight differs. Patients
          with congenital defects are described as mildly to moderately affected, while the newer antagonists,
          which inhibit P2Y12 effectively in most patients, increase the incidence of major bleeding.
          Several explanations are possible and are not distinguished by the available evidence: lifelong
          developmental compensation absent in an acutely treated patient; the fact that treated patients
          are older, comorbid and usually also taking aspirin; ascertainment bias, since mildly affected
          congenital cases are the ones that come to attention; or a genuinely more complete blockade
          by drug than by the reported hypomorphic alleles. The question is not academic - it determines
          whether these patients can be counselled using the much larger evidence base from antiplatelet
          trials, which would otherwise be the obvious source of guidance for a disorder with only a handful
          of reported cases.'
        proposed_experiments:
        - experiment_id: exp_p2y12_congenital_vs_treated_matched_comparison
          name: Matched comparison of residual P2Y12 function and bleeding phenotype
          description: Quantify residual ADP-induced adenylyl cyclase inhibition in congenital P2Y12-defect
            patients and in ticagrelor-treated volunteers, and pair each with a standardized bleeding-assessment
            tool score. If congenital patients retain more residual signalling than fully inhibited treated
            subjects, the difference is one of degree; if they do not, the explanation lies in compensation
            or comorbidity rather than in the receptor.
      selected_evidence:
        snippet: Although they increase the incidence of major bleedings, the net clinical benefit is
          in favor of the new P2Y₁₂ inhibitors.
        supports: SUPPORT
