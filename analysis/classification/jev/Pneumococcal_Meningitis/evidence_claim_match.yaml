          cells, amplifying complement and neutrophil recruitment in the subarachnoid space. Human CSF
          C5 fragments track with poor prognostic indicators, and C5a-receptor loss reduces CSF leukocytosis
          and brain damage in mouse pneumococcal meningitis, implicating terminal-complement signaling
          in inflammatory injury rather than as a human Mendelian cause of infection.
        cell_types:
