      assertion_type: Transmission
      assertion:
        name: Direct entry through a cerebrospinal fluid leak
        description: Where a dural defect connects the subarachnoid space to a colonised air-filled cavity,
          carriage organisms enter the cerebrospinal fluid directly. This is the route behind recurrent
          pneumococcal meningitis in an immunologically normal patient, and it is why an anatomical defect
          is sought when episodes repeat.
      selected_evidence:
        snippet: The authors report a case of pneumococcal meningitis which recurred 3 times in a Taiwanese
          boy due to spontaneous cerebrospinal fluid (CSF) fistulas.
        supports: SUPPORT
