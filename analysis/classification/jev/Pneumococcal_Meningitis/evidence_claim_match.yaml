            id: GO:0006956
            label: complement activation
          modifier: INCREASED
      selected_evidence:
        snippet: The resulting massive inflammation leads to further neutrophil recruitment and inflammation,
          resulting in the well-known features of bacterial meningitis, including cerebrospinal fluid
          pleocytosis, cochlear damage, cerebral edema, hydrocephalus, and cerebrovascular complications.
