      assertion_type: Transmission
      assertion:
        name: Respiratory droplet acquisition of nasopharyngeal carriage
        description: What is transmitted between people is carriage, not meningitis. Streptococcus pneumoniae
          passes by respiratory droplet and colonises the nasopharynx, where carriage rates are high in
          children; meningitis is an uncommon downstream outcome in a minority of those colonised.
      selected_evidence:
        snippet: Both are encapsulated bacteria with high nasopharyngeal carriage rates in children and
          adolescents, and their polysaccharide capsules facilitate immune evasion, promoting colonization,
          bloodstream invasion, and entry into the central nervous system by crossing the blood-brain
          barrier.
        supports: SUPPORT
