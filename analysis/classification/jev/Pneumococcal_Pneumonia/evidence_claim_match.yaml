        description: Pneumococci escape beta-lactams by remodeling the PBP target.
      selected_evidence:
        snippet: Data on high-level penicillin-resistant invasive pneumococci have been found in Brazil
          (42.8%) and Japan (77%). The resistance is caused by mutations in genes that encode penicillin-binding
