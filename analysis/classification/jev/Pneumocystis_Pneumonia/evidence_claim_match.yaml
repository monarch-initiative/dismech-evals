          disease_term:
            preferred_term: Pneumocystis pneumonia
            term:
              id: MONDO:0019121
              label: pneumocystosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Opportunistic Infection in Cell-Mediated Immunodeficiency
        role: trigger
        description: 'Pneumocystis jirovecii is an opportunistic fungal pathogen that causes severe pneumonia
          in immunocompromised hosts. Disease requires impaired cell-mediated immunity — HIV (where CD4+
          T-cell depletion <200 cells/µL is the classic marker), organ transplantation, malignancy, and
          inflammatory/rheumatologic conditions and their immunosuppressive therapies (which impair broader
          cell-mediated immunity beyond CD4 count alone) — permitting uncontrolled alveolar replication.

          '
        cell_types:
        - preferred_term: CD4-positive, alpha-beta T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
        biological_processes:
        - preferred_term: symbiont entry into host cell
          term:
            id: GO:0046718
            label: symbiont entry into host cell
      selected_evidence:
        snippet: CD4+ lymphocyte count <200 cells/µL is the primary risk factor for PJP presentation in
          these patients.
        supports: SUPPORT
