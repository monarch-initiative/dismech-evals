      assertion:
        name: Folate Synthesis (Antifolate Target)
        role: therapeutic_vulnerability
        description: 'P. jirovecii depends on de novo folate synthesis. Trimethoprim-sulfamethoxazole
          inhibits this pathway (sulfamethoxazole inhibits dihydropteroate synthase; trimethoprim inhibits
          dihydrofolate reductase), and is the first-line treatment and prophylaxis. (This antifolate
          target is analogous to the bacterial folate pathway but is not modeled here as conforming to
          the bacterial folate module, since Pneumocystis is a fungus.)

          '
        biological_processes:
        - preferred_term: folic acid biosynthetic process
          term:
            id: GO:0046656
            label: folic acid biosynthetic process
      selected_evidence:
        snippet: First-line therapy for prophylaxis and treatment remains trimethoprim-sulfamethoxazole
        supports: SUPPORT
