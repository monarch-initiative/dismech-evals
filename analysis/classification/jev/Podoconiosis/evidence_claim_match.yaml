          value:
            name: Long-term barefoot contact with red-clay soil derived from alkalic volcanic rock
            description: The necessary environmental cause. Exposure is transdermal rather than inhalational,
              occurs over years of subsistence farming without footwear, and is determined by soil geochemistry
              - endemic areas sit on alkalic volcanic bedrock at high altitude with high rainfall, the
              conditions that weather it into the implicated clays.
            exposure_term:
              preferred_term: barefoot contact with alkalic volcanic red-clay soil
              term:
                id: ECTO:7000012
                label: exposure to soil
            exposure_classifications:
              hazard_agent_type:
              - classification_value: CHEMICAL
                notes: Classified chemical on the same basis as the mineral-dust exposures in silicosis
                  and coal workers' pneumoconiosis - the operative agent is a silicate particle, not a
                  living organism. The secondary bacterial infection that drives acute attacks is a consequence
                  of the skin breakdown, not the exposure being classified here.
              exposure_route:
              - classification_value: DERMAL
                notes: 'The distinguishing feature against the other mineral-dust entries in this knowledge
                  base that carry `exposure_classifications` - silicosis, coal workers'' pneumoconiosis
                  and asbestosis all record INHALATION. Note that dermal routes are not unique to podoconiosis
                  across the KB as a whole: `Chronic_Beryllium_Disease` curates a "Dermal beryllium exposure"
                  entry as a second route to sensitization, though that file carries no `exposure_classifications`
                  block to compare against.'
              exposure_duration:
              - classification_value: CHRONIC
              exposome_domain:
              - classification_value: SPECIFIC_EXTERNAL
            notes: 'No IARC group is recorded. IARC has not classified this soil exposure, and podoconiosis
              is not a neoplastic outcome. No GHS class is recorded either: the exposure is a natural
              soil rather than a classified substance.'
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Transdermal Entry of Silicate Mineral Particles
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: Barefoot soil contact is the route by which the mineral particles reach the skin
