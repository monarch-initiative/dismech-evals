            label: HLA-DQA1
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        frequency: common susceptibility variants, lead SNP odds ratio approximately 1.5-2.4
        notes: Curated as a susceptibility locus, not a causative gene. `gene_term` carries HLA-DQA1 because
          the slot is single-valued and the first genome-wide significant SNP sits 5.8 kb from it; the
          replication study's lead SNP lies near HLA-DRB1, and DQB1 is implicated by the risk haplotype.
          All three are bound on the pathophysiology node. Heritability is estimated at 63% and the sibling
          recurrence risk ratio at 5.07, so the genetic contribution is substantial - but no variant is
          sufficient without the soil exposure, and no locus outside HLA class II reached significance
          in a better-powered second genome-wide study.
      selected_evidence:
        snippet: 'We found a genomewide significant association of podoconiosis with the single-nucleotide
          polymorphism (SNP) rs17612858, located 5.8 kb from the HLA-DQA1 locus (in the allelic model:
          odds ratio, 2.44; 95% confidence interval [CI], 1.82 to 3.26; P=1.42×10(-9); and in the additive
          model: odds ratio, 2.19; 95% CI, 1.66 to 2.90; P=3.44×10(-8))'
        supports: SUPPORT
