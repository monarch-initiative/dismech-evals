      assertion_type: Treatment
      assertion:
        name: Lymphoedema Self-Care Package
        description: Foot hygiene, skin care, bandaging, exercise, elevation, and consistent use of socks
          and shoes, delivered through lay community agents. This is the mainstay and the only management
          with randomised evidence in this disease. Its measured effect is on acute attacks rather than
