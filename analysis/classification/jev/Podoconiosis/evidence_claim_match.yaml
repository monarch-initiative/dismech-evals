      assertion_type: EpidemiologyInfo
      assertion:
        name: Exposure-Dependent Distribution Set by Bedrock and Climate
        description: The disease occurs where alkalic volcanic bedrock weathers under high altitude and
          high rainfall into the implicated clays, and where people farm that soil barefoot. Both conditions
          are required, which is why podoconiosis is absent from equally volcanic areas where footwear
          is universal.
      selected_evidence:
        snippet: Nine studies found a correlation between podoconiosis occurrence and regions with underlying
          alkalic volcanic bedrock, and six linked pedogenic factors (altitude and rainfall) with disease
          occurrence. Several studies linked specific soil mineralogy and geochemistry with endemic regions,
          including an abundance of phyllosilicate clay minerals, quartz, and trace elements, notably
          iron, beryllium and zirconium.
        supports: SUPPORT
