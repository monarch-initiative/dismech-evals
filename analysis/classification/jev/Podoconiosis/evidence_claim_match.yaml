      assertion_type: Pathophysiology
      assertion:
        name: Chronic Barefoot Contact with Alkalic Volcanic Clay Soil
        description: 'The necessary exposure. Subsistence farmers working barefoot on red clay weathered
          from alkalic volcanic bedrock accumulate contact over years to decades. The soil is the operative
          agent, not the terrain: endemicity tracks bedrock geochemistry and the pedogenic conditions
          that produce these clays - high altitude and high rainfall - rather than any vector distribution.'
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Podoconiosis is a tropical lymphedema resulting from long-term barefoot exposure to red-clay
          soil derived from volcanic rock. The World Health Organization recently designated it as a neglected
          tropical disease. Podoconiosis develops in only a subgroup of exposed people, and studies have
          shown familial clustering with high heritability (63%).
        supports: SUPPORT
    origin:
