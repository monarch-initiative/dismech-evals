        - path: /animal_models/0
          value:
            name: Intralymphatic silica injection model
            species: Rabbit
            genotype: Wild type
            description: Fine silica particles injected directly into lymphatic vessels, designed to test
              whether the mineral alone can produce the obstructive lesion and to locate its main site
              of action. It bypasses the skin and the adaptive immune system entirely, which is both its
              power and its limit. The species is taken from the record's MeSH indexing (Rabbits); the
              abstract itself says only "animal experiments".
            publication: PMID:3006293
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Endolymphangitis
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: TISSUE
        description: Silica provoked immediate intense macrophage reaction and later fibrosis within lymph
          vessels, with lymphographic obstruction attributable more to the vessels than to the nodes.
        limitations: 'Direct intralymphatic injection is not the human exposure route: it skips transdermal
          entry, delivers a bolus rather than a decades-long trickle, and uses silica rather than the
          kaolinite that predominates in human lymph node microanalysis. It also cannot model the HLA
          class II susceptibility, since the animals are not selected for it - so the model shows the
          mineral is sufficient for the vessel lesion in an unselected host, which is a different claim
          from the human one.'
        divergences:
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: The plantar skin barrier and the whole transdermal entry step are outside the model.
            Everything this entry curates upstream of the lymphatic is untested by it.
        - divergence_type: PROXY_QUANTITY
          materiality: QUALIFYING
          description: The injected material is fine silica; the quantity the human node concerns is chronic
            kaolinite-dominant silicate deposition arriving via macrophage transport. Same mineral class,
            different species and different delivery.
        - divergence_type: POPULATION_MISMATCH
          materiality: INVALIDATING
          description: Human disease occurs in the subset of exposed people carrying HLA class II risk
            haplotypes. The experimental animals are unselected, so the model cannot speak to the susceptibility
            step that decides who gets the disease.
      selected_evidence:
        snippet: Intralymphatic silica provoked an immediate and intense macrophage reaction with later
          fibrosis both within lymph vessels and to a lesser extent within lymph nodes. Lymphography indicated
          that the consequent obstruction resulted more from the effects of silica on vessels than on
          nodes.
        supports: SUPPORT
