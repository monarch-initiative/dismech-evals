        description: 'Colloid-sized silicate particles cross the plantar and dorsal skin of the foot and
          lodge in the dermis. Their identity is partly known and partly not: kaolinite predominates in
          lymph node microanalysis at 0.2-2 micrometres, and endemic soils are enriched in smectite, mica,
          quartz, iron oxides, beryllium and zirconium - but which constituent is the operative trigger
          has never been established.'
        biological_scale: TISSUE
        locations:
        - preferred_term: dermis of the foot
          term:
            id: UBERON:0002067
            label: dermis
      selected_evidence:
        snippet: The presence of microparticles of clay is demonstrated in the dermis of the foot in a
          patient with endemic elephantiasis. The particles are seen to be in the phagosomes of macrophages
          or in the cytoplasm of other cells.
        supports: SUPPORT
