      assertion_type: DifferentialDiagnosis
      assertion:
        name: Lymphatic Filariasis
        description: 'The principal differential and the reason a filarial antigen test is part of every
          case definition. The distinction this entry curates is mechanistic rather than a bedside rule
          of thumb: in filariasis the lymphatic disruption is proximal, at worm nests in the groin or
          armpits, whereas in podoconiosis the insult enters at the feet and the disease stays localised
          to the legs. The two are co-endemic in a number of countries, so geography does not settle it
          either.'
      selected_evidence:
        snippet: Dermatologists performed a patient history, physical examination, filariasis test strip,
          and skin biopsy for histopathologic examination.
        supports: SUPPORT
