              label: podoconiosis
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Mast Cell and Macrophage Infiltrate with Elastic Fibre Loss
        description: 'A second biopsy series adds the cellular detail: a moderate lymphoplasmacytic infiltrate
          joined by mast cells and scattered macrophages, with neutrophils and eosinophils sparse, dramatically
          reduced elastic fibres, and lymphatics that are reduced in number and mostly not dilated. The
          cell mix is that of a chronic sterile inflammatory process, not an acute infective one.'
        finding_term:
          preferred_term: lymphoplasmacytic infiltrate with mast cells and elastic fibre loss
      selected_evidence:
        snippet: All specimens showed verrucous acanthosis and papillomatosis. Eccrine ducts demonstrated
          hyperplasia, syringofibroadenomatous changes and miliaria. Dermal collagen bundles were thickened,
          and elastic fibers were dramatically reduced. A moderate lymphoplasmacytic infiltrate was joined
          by mast cells and scattered macrophages; neutrophils and eosinophils were sparse. Blood vessels
          were increased, dilated, and often sclerotic while lymphatics were reduced and largely not dilated.
        supports: SUPPORT
