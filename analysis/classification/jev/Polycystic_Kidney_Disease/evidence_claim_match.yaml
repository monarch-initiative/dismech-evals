            description: 'The DZIP1L-defined form of autosomal recessive polycystic kidney disease. DZIP1L
              localizes to centrioles and to the distal ends of basal bodies and interacts with septin2,
              which maintains the periciliary diffusion barrier at the ciliary transition zone. So this
              form reaches the same ciliary endpoint as the PKHD1 form by a different route: translocation
              of polycystin-1 and polycystin-2 into the ciliary membrane is compromised. Reported patients
              had polycystic, enlarged kidneys with reduced cortico-medullary differentiation, arterial
              hypertension and end-stage renal disease, and there was limited evidence for a liver phenotype
              in the reported cohort.'
            genes:
            - preferred_term: DZIP1L
              term:
                id: hgnc:26551
                label: DZIP1L
          role: subtype
      assertion_type: Genetic
      assertion:
        name: DZIP1L Mutations
        gene_term:
          preferred_term: DZIP1L
          term:
