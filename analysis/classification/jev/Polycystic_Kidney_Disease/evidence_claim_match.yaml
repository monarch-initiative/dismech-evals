            label: DZIP1L
        relationship_type: CAUSATIVE
        subtype: PKD5
        association: Causative
        notes: Encodes DAZ interacting zinc finger protein 1 like, a ciliary transition-zone protein;
          the second gene of the autosomal recessive form, acting on ciliary entry of the polycystins
          rather than on fibrocystin.
