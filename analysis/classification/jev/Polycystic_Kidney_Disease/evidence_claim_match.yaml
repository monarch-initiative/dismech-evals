              label: polycystic kidney disease
        context: []
      assertion_type: Subtype
      assertion:
        name: PKD5
        display_name: Polycystic kidney disease 5 (DZIP1L)
        subtype_term:
          preferred_term: polycystic kidney disease 5
          term:
            id: MONDO:0033281
            label: polycystic kidney disease 5
        description: 'The DZIP1L-defined form of autosomal recessive polycystic kidney disease. DZIP1L
          localizes to centrioles and to the distal ends of basal bodies and interacts with septin2, which
          maintains the periciliary diffusion barrier at the ciliary transition zone. So this form reaches
          the same ciliary endpoint as the PKHD1 form by a different route: translocation of polycystin-1
          and polycystin-2 into the ciliary membrane is compromised. Reported patients had polycystic,
          enlarged kidneys with reduced cortico-medullary differentiation, arterial hypertension and end-stage
          renal disease, and there was limited evidence for a liver phenotype in the reported cohort.'
        genes:
        - preferred_term: DZIP1L
          term:
            id: hgnc:26551
            label: DZIP1L
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Here, we describe mutations in DZIP1L, which encodes DAZ interacting protein 1-like,
          in patients with ARPKD.
        supports: SUPPORT
