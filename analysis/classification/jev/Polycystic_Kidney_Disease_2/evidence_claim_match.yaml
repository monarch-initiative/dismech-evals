          name: Polycystic Kidney Disease 2
          disease_term:
            preferred_term: polycystic kidney disease 2
            term:
              id: MONDO:0013131
              label: polycystic kidney disease 2
        context:
        - path: /pathophysiology/1
          value:
            name: Somatic second hit and clonal cyst initiation
            biological_scale: CELLULAR
            description: 'Cyst formation in PKD2 is focal and sporadic, not uniform across the nephron
              population, and the germline heterozygous state alone does not explain that. The conventional
              account is cellular-recessive: an individual tubular epithelial cell acquires a somatic
              inactivating hit on its remaining wild-type allele, loses polycystin function outright,
              and clonally expands into a cyst. This is what reconciles a dominant disease with a focal
              lesion, and it is also the most plausible explanation for the large variability between
              individuals carrying the same PKD2 variant.'
            cell_types:
            - preferred_term: kidney epithelial cell
              term:
                id: CL:0002518
                label: kidney epithelial cell
            biological_processes:
            - preferred_term: cell population proliferation
              term:
                id: GO:0008283
                label: cell population proliferation
              modifier: INCREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Cilium-dependent cAMP elevation in tubular epithelium
        description: A cell that has lost both polycystin alleles has no ciliary calcium signal at all,
          so the cAMP disinhibition below is complete in that clone rather than partial.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: provides growth advantages for it to proliferate clonally into a cyst
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1/downstream/0
      evidence_path: /pathophysiology/1/downstream/0/evidence/0
