        description: The unified criteria exist because of PKD2. The older ultrasound criteria were derived
          from PKD1 families and performed suboptimally in PKD2 patients through reduced sensitivity -
          the milder, later-forming cysts simply were not there yet in a young at-risk PKD2 individual.
          The unified criteria for families of unknown genotype are three or more cysts, unilateral or
          bilateral, at ages 15 to 39; two or more in each kidney at 40 to 59; four or more in each kidney
          at 60 or above. Fewer than two cysts at age 40 or above excludes the disease. This is a genotype-driven
          difference in diagnostic threshold, which is exactly the kind of PKD2-specific fact this entry
          exists to carry.
      selected_evidence:
        snippet: The diagnostic criteria currently in use performed suboptimally for individuals with
          mutations in PKD2 as a result of reduced test sensitivity.
