      assertion_type: Pathophysiology
      assertion:
        name: Somatic second hit and clonal cyst initiation
        biological_scale: CELLULAR
        description: 'Cyst formation in PKD2 is focal and sporadic, not uniform across the nephron population,
          and the germline heterozygous state alone does not explain that. The conventional account is
          cellular-recessive: an individual tubular epithelial cell acquires a somatic inactivating hit
          on its remaining wild-type allele, loses polycystin function outright, and clonally expands
          into a cyst. This is what reconciles a dominant disease with a focal lesion, and it is also
          the most plausible explanation for the large variability between individuals carrying the same
          PKD2 variant.'
        cell_types:
        - preferred_term: kidney epithelial cell
          term:
            id: CL:0002518
            label: kidney epithelial cell
        biological_processes:
        - preferred_term: cell population proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
          modifier: INCREASED
      selected_evidence:
        snippet: inactivation of both copies of a polycystic kidney disease gene by germline and somatic
          mutations within an epithelial cell provides growth advantages for it to proliferate clonally
          into a cyst
        supports: SUPPORT
    origin:
