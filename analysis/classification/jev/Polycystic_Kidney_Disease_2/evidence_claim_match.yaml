      assertion:
        discussion_id: pkd2_tolvaptan_transportability
        kind: KNOWLEDGE_GAP
        attaches_to:
        - treatments#Tolvaptan vasopressin V2 receptor antagonist therapy
        prompt: Does tolvaptan slow progression in PKD2-related ADPKD specifically, and which PKD2 patients
          meet a rapid-progression threshold that justifies it?
        rationale: The pivotal tolvaptan trial enrolled ADPKD patients and did not report a PKD2-stratified
          result. Because PKD2 progresses about two decades more slowly, the absolute benefit over a fixed
          treatment horizon could differ substantially from the ADPKD-wide estimate, and the rapid-progression
          criteria used to select candidates were calibrated on a largely PKD1 population. This is the
          single most consequential open question for managing a PKD2 patient today, and it is an evidence-transportability
          question rather than a mechanistic one.
      selected_evidence:
        snippet: In our PKD2 cohort, only 25 patients, including 12 patients younger than 30 years, had
          a CKD stage and age class matching these criteria.
        supports: SUPPORT
