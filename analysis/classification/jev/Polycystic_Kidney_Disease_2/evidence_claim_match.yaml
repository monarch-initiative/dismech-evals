      assertion_type: AnimalModel
      assertion:
        name: Pkd2 conditional knockout mouse
        species: Mouse
        genotype: Conditional Pkd2 inactivation at defined postnatal stages
        publication: PMID:41077129
        description: Germline Pkd2 deletion is embryonic lethal, so conditional inactivation is the only
          route to an adult model. Inactivating Pkd2 at or beyond postnatal day 14 gives delayed cyst
          formation, mirroring the developmental switch seen in Pkd1 models.
        modeled_mechanisms:
        - target: Somatic second hit and clonal cyst initiation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Conditional inactivation reproduces the consequence of losing both alleles in adult
            tubular epithelium, and the postnatal-day-14 switch shows the cystogenic response depends
            on developmental timing.
          limitations: The model deletes Pkd2 by design rather than by stochastic somatic mutation, so
            it reproduces the outcome of a second hit but not the process that produces one. Rodent Pkd1
            and Pkd2 loci also escape the recurrent somatic mutagenesis seen at the human locus, so spontaneous
            two-hit cystogenesis is not modelled at all.
      selected_evidence:
        snippet: We confirm that sex is a key modifier of ADPKD progression with differences in disease
          severity occurring in the context of significant transcriptional differences between males and
          females that are independent of the Pkd2 genotype
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
