          variants associated with lower age-adjusted eGFR, while the earlier international cohort found
          no effect of mutation position and only a modest advantage for splice-site variants. Both studies
          agree that variability between individuals carrying the same PKD2 variant is large, so PKD2
          genotype should not be used to predict an individual''s renal trajectory.'
