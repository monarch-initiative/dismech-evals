        context: []
      assertion_type: Phenotype
      assertion:
        category: Renal
        name: Decreased glomerular filtration rate
        frequency: FREQUENT
        description: 'GFR declines late in PKD2 but in most patients who live long enough. The grading
          is lifetime, not cross-sectional, which matters here because the two give opposite answers:
          at diagnosis 81.4% still have an eGFR above 60 mL/min/1.73 m2, yet the proportion above 30 mL/min/1.73
          m2 falls to 73.1%, 58.8% and 43.5% across the sixth, seventh and eighth decades. FREQUENT is
          also the only grading consistent with Stage 5 chronic kidney disease being FREQUENT below, since
          stage 5 is a subset of reduced GFR and a subset cannot be commoner than the set that contains
          it. Men have lower kidney function than women at equivalent age, without a corresponding difference
          in renal survival.'
        phenotype_term:
          preferred_term: Decreased glomerular filtration rate
          term:
            id: HP:0012213
            label: Decreased glomerular filtration rate
      selected_evidence:
        snippet: analysis of past eGFR values when available (n = 226) showed that 81.4% of patients had
          eGFRs > 60 mL/min/1.73 m2 at diagnosis
        supports: SUPPORT
