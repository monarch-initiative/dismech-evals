        description: 'Cysts keep enlarging after they detach from the parent nephron, and the growing
          cyst burden raises total kidney volume. Kidney size and its growth rate are the standard imaging
          measures of ADPKD severity: patients with larger, faster-growing kidneys reach kidney replacement
          therapy earlier. In PKD2 the corollary runs the other way too: the Genkyst authors read the
          absence of massive kidney enlargement in patients with early ESRD as a sign that a concomitant
          nephropathy, not the cystic disease, drove their kidney failure.'
