      assertion:
        discussion_id: pkd3_mildness_is_modal_not_guaranteed
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What determines whether a GANAB carrier follows the expected mild renal course or progresses
          rapidly?
        attaches_to:
        - pathophysiology#Renal Cystogenesis
        - phenotypes#Multiple Renal Cysts
        rationale: 'Mild kidney disease is the characterisation from the discovery cohort and is the basis
          on which a GANAB result would reassure a patient. But a reported 18-year-old carrier fell into
          Mayo imaging class 1E, the class predicting rapid progression to end-stage renal disease, and
          the report was written specifically to question the mildness assumption. With around twenty
          published carriers there is no basis for a modifier analysis, and no genotype-phenotype rule
          separates the two courses. The clinical consequence is concrete: mildness governs surveillance
          intervals and whether disease-modifying therapy is considered at all, and a counselling message
          built on the cohort description will occasionally be wrong.'
      selected_evidence:
        snippet: The GANAB gene mutation found in this patient is typically associated with mild kidney
          disease; however, according to the Mayo Clinic Imaging Classification (MIC) for ADPKD, our patient
          falls under Classification 1E, which is predictive of rapid progression to end-stage renal disease
          (ESRD).
        supports: SUPPORT
