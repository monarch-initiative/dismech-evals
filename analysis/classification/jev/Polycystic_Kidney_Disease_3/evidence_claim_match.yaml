            preferred_term: polycystic kidney disease 3 with or without polycystic liver disease
            term:
              id: MONDO:0010916
              label: polycystic kidney disease 3 with or without polycystic liver disease
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing
        description: A GANAB variant is what distinguishes this entry from ADPKD generally, and imaging
          cannot make that call. GeneReviews establishes the ADPKD diagnosis on age-specific kidney imaging
          criteria plus either an affected first-degree relative or a heterozygous pathogenic variant,
          and lists GANAB among the less common associated genes that satisfy the molecular arm. Because
          the renal phenotype here is mild and may be atypical in distribution, a patient can fail imaging
          criteria built around the PKD1 picture and still carry the diagnosis.
        diagnosis_term:
          preferred_term: Genetic Testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        notes: 'Modality matters here. Single-gene GANAB testing is a cascade test only, because reaching
          GANAB as a hypothesis already requires PKD1 and PKD2 to have been excluded; the primary test
          is a multigene cystic kidney and liver panel. That panel must include deletion and duplication
          analysis: large GANAB deletions are a reported cause, and exome sequencing is structurally poor
          at detecting them because its short reads and PCR-based amplification give uneven coverage.

          There is no biochemical test. Glucosidase II activity is not measured clinically, so the enzyme
          defect that defines the disorder is inferred from the genotype rather than assayed.'
        results: A heterozygous GANAB loss-of-function variant, or a whole- or partial-gene deletion,
          in a patient in whom PKD1 and PKD2 have been excluded.
      selected_evidence:
        snippet: a heterozygous pathogenic variant in PKD1, PKD2, or one of the less common associated
          genes (ALG5, ALG9, DNAJB11, GANAB, IFT140)
        supports: SUPPORT
