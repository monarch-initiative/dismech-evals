            term:
              id: MONDO:0010916
              label: polycystic kidney disease 3 with or without polycystic liver disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Polycystin-1 Maturation and Trafficking
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'Polycystin-1 requires glucosidase II alpha to complete its endoplasmic-reticulum
          maturation and reach the cell surface and the primary cilium. Without it, the protein does not
          mature; with one functional copy, less mature protein is made. Rescue is allele-specific: wild-type
          glucosidase II alpha restores polycystin-1 surface localisation in null cells and mutant protein
          does not, which ties the cellular defect to the patient alleles rather than to the knockout
          alone.

          This is the step that distinguishes the disorder from PKD1 and PKD2. Those lesions remove or
          alter the polycystin complex itself; this one leaves the complex intact and starves it of correctly
          folded polycystin-1.'
        biological_processes:
        - preferred_term: protein maturation
          term:
            id: GO:0051604
            label: protein maturation
          modifier: DECREASED
        - preferred_term: protein folding in endoplasmic reticulum
          term:
            id: GO:0034975
            label: protein folding in endoplasmic reticulum
          modifier: DECREASED
        cellular_components:
        - preferred_term: ciliary membrane
          term:
            id: GO:0060170
            label: ciliary membrane
      selected_evidence:
        snippet: PC1 surface localization in GANAB(-/-) cells was rescued by wild-type, but not mutant,
          GIIa.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
