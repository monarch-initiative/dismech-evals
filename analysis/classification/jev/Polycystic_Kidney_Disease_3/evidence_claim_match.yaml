        disease:
          name: Polycystic Kidney Disease 3
          disease_term:
            preferred_term: polycystic kidney disease 3 with or without polycystic liver disease
            term:
              id: MONDO:0010916
              label: polycystic kidney disease 3 with or without polycystic liver disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pkd3_mouse_contradicts_human_pc1_defect
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why does polycystin-1 remain unaffected in the Ganab heterozygous mouse kidney when it
          is reduced in human GANAB heterozygous cells, and which result describes the patient?
        attaches_to:
        - pathophysiology#Impaired Polycystin-1 Maturation and Trafficking
        - animal_models#Ganab heterozygous knockout mouse
        rationale: 'The two experiments disagree on the readout that the whole mechanism rests on. Human
          GANAB(+/-) cells show reduced mature polycystin-1, and that is the evidence connecting the gene
          to cystogenesis. The mouse heterozygote achieves the intended halving of Ganab protein and reports
          polycystin-1 and polycystin-2 expression unaffected, with no cysts anywhere. The mouse authors
          draw the strong conclusion, that Ganab may not be causative at all.

          Several things could reconcile them and none has been tested. The human work measured mature
          glycoform specifically while the mouse measured expression, which are different quantities.
          Mouse cyst models across the ADPKD genes generally need a second hit or prolonged time, so an
          unstressed young heterozygote may simply be below threshold. Species differences in glucosidase
          II dependence are plausible given that the human phenotype is itself mild. Until this is resolved,
          the entry''s central mechanism rests on human cell work and human genetics, with the only whole-animal
          test of it returning negative, and that should be visible rather than smoothed over.'
      selected_evidence:
        snippet: Homozygous Ganab mutations are lethal in the fetal stage, and Ganab haploinsufficiency
          does not cause kidney or liver cysts in mice, suggesting that it may not be the causative gene
          in polycystic kidney disease.
        supports: REFUTE
