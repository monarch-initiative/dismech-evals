        discussion_id: gap_pcos_population_specific_therapeutics
        prompt: Given the distinct population-stratified molecular phenotypes of PCOS (metabolic-dominant
          in East Asian populations, inflammatory-dominant in European populations), are currently approved
          therapies (metformin, oral contraceptives, spironolactone) equally effective across ancestry
          groups? Should therapeutic prioritization differ by population-specific mechanism, with metabolic
          pathway inhibitors favored in East Asian PCOS and immunomodulatory or anti-inflammatory agents
          in European PCOS?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Intrinsic Post-Receptor Insulin Signaling Defect
        - pathophysiology#Adiposity-Amplified Insulin Resistance
        - pathophysiology#Chronic Low-Grade Inflammation
        rationale: Population-stratified mechanistic analyses reveal that East Asian PCOS is enriched
          for metabolic dysregulation pathways while European PCOS exhibits stronger inflammatory and
          immune signatures. The heterogeneous molecular architecture suggests that therapeutic responses
          may vary by ancestry, yet current PCOS treatment guidelines do not account for mechanistic diversity.
          Whether therapies targeting the predominant mechanism in each population (e.g., metabolic pathway
          inhibitors for East Asian PCOS, anti-inflammatory agents for European PCOS) would improve clinical
          outcomes relative to universal treatment remains untested.
      selected_evidence:
        snippet: integration of genetic evidence with a network-based approach enabled the identification
          of druggable targets lacking direct genetic cues
        supports: SUPPORT
