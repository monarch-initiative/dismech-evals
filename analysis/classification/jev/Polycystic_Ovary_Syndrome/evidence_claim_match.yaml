          hub, the gut-ovarian amplification arm, the circadian/epigenetic entrenchment arm, and the PCSK9-lipid
          apoptotic arm are each modeled as their own nodes, and their GO terms and evidence live there.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Granulosa cell
