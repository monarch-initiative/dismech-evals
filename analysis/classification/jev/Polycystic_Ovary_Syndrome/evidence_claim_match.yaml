              id: MONDO:0008487
              label: polycystic ovary syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_pcos_androgen_to_insulin_resistance_directness
        prompt: Does androgen excess in PCOS impair insulin action directly at insulin target tissues,
          or only indirectly — by promoting visceral and android fat deposition, and through androgen-receptor
          signalling in neurons? The entry asserts both an androgen-to-intrinsic-insulin-defect edge and
          an androgen-to-adiposity-amplified-insulin-resistance edge; is the first of those a distinct
          mechanism, or the second one seen at a different scale?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Hyperandrogenism
        - pathophysiology#Intrinsic Post-Receptor Insulin Signaling Defect
        - pathophysiology#Adiposity-Amplified Insulin Resistance
        rationale: Both androgen-to-insulin edges on the Hyperandrogenism node are already typed INDIRECT_KNOWN_INTERMEDIATES,
          but their intermediates differ (androgen receptor action in muscle and adipose tissue versus
          visceral fat deposition and adipokine change) and nothing in the entry distinguishes them experimentally.
          The mouse data locate the critical androgen-receptor target for the metabolic phenotype outside
          the ovary, in neurons, which is a mediated rather than a direct tissue-level route; but the
          mediation itself — hypothalamic androgen receptor to gonadotropin output to metabolic regulation
          — has not been tested by any experiment cited here. The nearest human evidence of prolonged
          androgen exposure comes from testosterone-treated transmasculine adults, where body composition
          and lipids deteriorate while fasting glucose and insulin do not measurably change; that is a
          different population with a different developmental history and an exogenously controlled gonadal
          axis, so it constrains a simple pharmacological androgen-to-insulin-resistance claim without
          settling the question in PCOS. Resolving this matters for whether antiandrogen therapy should
          be expected to improve metabolic endpoints at all, or only those that follow fat redistribution.
      selected_evidence:
        snippet: Neuron-specific AR signaling was required for the development of dysfunctional ovulation,
          classic polycystic ovaries, reduced large antral follicle health, and several metabolic traits
          including obesity and dyslipidemia.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/4
      evidence_path: /discussions/4/evidence/0
