            label: granulosa cell
        biological_processes:
        - preferred_term: Ferroptosis
          term:
            id: GO:0097707
            label: ferroptosis
          modifier: INCREASED
        - preferred_term: Autophagy
          term:
            id: GO:0006914
            label: autophagy
          modifier: INCREASED
      selected_evidence:
        snippet: The dysfunction of GCs in PCOS is not an isolated event involving a single mode of cell
          death, but rather a pathological crosstalk arising from the disruption of the dynamic equilibrium
          between autophagy and ferroptosis.
        supports: SUPPORT
