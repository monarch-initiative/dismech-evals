      assertion:
        name: Mesenchymal Stem Cell and Exosome-Based Regenerative Therapy
        description: 'Investigational, preclinical regenerative and cell-based disease-modifying strategy
          for PCOS. Mesenchymal stem cells (MSCs) and their secreted derivatives (including exosomes),
          together with gene-edited induced pluripotent stem cell (iPSC) platforms, are being explored
          to move beyond symptom-focused management toward mechanism-directed intervention. In preclinical
          models these approaches modulate ovarian inflammation, restore ovarian structure, and improve
          metabolic parameters, while iPSC-based models support patient-specific investigation of steroidogenic
          and metabolic abnormalities. Not clinically validated in PCOS; translational barriers include
          targeted delivery, off-target effects, and phenotypic heterogeneity.

          '
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: Mesenchymal stem cell and exosome therapy
          term:
            id: NCIT:C70601
            label: Cellular Therapy
        notes: 'PMOS ("polyendocrine metabolic ovarian syndrome") is a proposed renaming of polycystic
          ovary syndrome used by this review, whose search terms pair the two names explicitly ("polycystic
          ovarian syndrome/polyendocrine metabolic ovarian syndrome"); curated here under the established
          PCOS identity rather than as a distinct disorder.

          '
      selected_evidence:
        snippet: Preclinical studies demonstrate that MSCs and their derivatives modulate inflammation,
          restore ovarian structure, and improve metabolic parameters
        supports: SUPPORT
