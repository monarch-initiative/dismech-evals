  018dbcea0caa31a5c4673f7b11e2be1522dbafb6ad77fd2255bbcf963b330b11:
    claim:
      about:
        disease:
          name: Polycystic Ovary Syndrome
          disease_term:
            preferred_term: polycystic ovary syndrome
            term:
              id: MONDO:0008487
              label: polycystic ovary syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: androgen_first_feedback_model
        hypothesis_label: Androgen-First Feedback Model
        status: ALTERNATIVE
        applies_to_subtypes:
        - Lean PCOS
        - Obese PCOS
        description: 'Intrinsic ovarian/adrenal androgen excess, potentially reinforced by heightened
          LH action and theca-cell steroidogenic machinery, is the initiating lesion. Androgen excess
          then promotes insulin resistance and hyperinsulinemia, disrupts hypothalamic steroid feedback,
          and contributes to visceral adiposity, closing an androgen-insulin-adiposity feedback loop.

          '
        notes: 'OpenScientist deep-research verdict (see kb/hypotheses/Polycystic_Ovary_Syndrome/androgen_first_feedback_model):
          PARTIALLY SUPPORTED. The androgen-sensitive ovarian and neuroendocrine components are supported
          — global and neuron-specific androgen-receptor knockout in the DHT mouse model shows that androgen-receptor
          signalling is required for the PCOS-like phenotype and that its critical locus is extraovarian
          (PMID:28320971) — but temporal primacy of androgen excess is not demonstrated in humans, so
          `status:` stays ALTERNATIVE rather than being promoted. Three qualifications from the assessment
          (assessments/openscientist-assessment-by-codex.yaml) are carried here. (1) The report''s central
          argument that androgen reduction leaves insulin resistance unchanged was rejected on source
          check: it reads a 12-month placebo-controlled flutamide trial that reported *improved* insulin
          sensitivity as null, so no claim of a purely indirect androgen-to-insulin route is curated here;
          see the discussion gap_pcos_androgen_to_insulin_resistance_directness. (2) Long-term testosterone
          exposure in transmasculine adults is a non-PCOS setting and cannot adjudicate PCOS-specific
          causality. (3) The model is strongest for the "reproductive" cluster of PCOS (21-23% of NIH-defined
          European-ancestry cases, enriched for rare DENND1A variants), but that cluster is a cross-sectional
          phenotype grouping, not a demonstrated androgen-first subtype, and its subtype GWAS was small
          and unreplicated (PMID:32574161).

          '
      selected_evidence:
        snippet: Compelling evidence suggests that hyperandrogenism is not just a primary feature of PCOS.
          Instead, it may be a causative factor for this condition.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
