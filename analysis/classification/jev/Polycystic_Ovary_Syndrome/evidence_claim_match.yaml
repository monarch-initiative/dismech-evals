        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: insulin_hyperinsulinemia_first_model
        hypothesis_label: Insulin/Hyperinsulinemia-First Model
        status: ALTERNATIVE
        applies_to_subtypes:
        - Lean PCOS
        - Obese PCOS
        description: 'Primary insulin resistance or primary hyperinsulinemia initiates the endocrine-metabolic
          loop. High insulin acts as a co-gonadotropin in the ovary and lowers hepatic SHBG, increasing
          bioactive androgen exposure; the resulting hyperandrogenism can then worsen insulin resistance
          and adiposity.

          '
        notes: 'OpenScientist deep-research verdict (see kb/hypotheses/Polycystic_Ovary_Syndrome/insulin_hyperinsulinemia_first_model):
          PARTIALLY SUPPORTED — a co-driving parallel pathway rather than a universal primary cause, so
          `status:` stays ALTERNATIVE. What survives source check: suppressing insulin secretion with
          diazoxide lowers androgens and raises SHBG even in lean PCOS women with normal metabolic insulin
          sensitivity (PMID:17559844); insulin drives adipose androgen generation through AKR1C3 (PMID:26312838);
          and Mendelian randomization infers a causal effect of higher insulin resistance on PCOS risk
          (PMID:26416764). What does not: the report''s claim that PCOS GWAS do not implicate insulin
          genes and that no insulin-specific Mendelian-randomization work exists is contradicted by that
          same 2015 analysis and by the INSR locus already curated in `genetic:`; its claimed insulin-independent
          28-52% testosterone contrast across two NK3-antagonist trials misreports those endpoints (52%
          was the LH area-under-curve reduction in the AZD4901 trial); and average null gonadotropin effects
          in a heterogeneous metformin meta-analysis do not prove parallel causal pathways. Note also
          that metformin lowers LH-stimulated testosterone within days, before any insulin-sensitising
          effect (PMID:25304843), so therapeutic response to an insulin sensitiser is not on its own evidence
          for the insulin-first ordering.

          '
      selected_evidence:
        snippet: Hyperinsulinemia (i.e., elevated insulin without hypoglycemia) is a common metabolic
          feature of PCOS that worsens its reproductive symptoms by exacerbating pituitary hormone imbalances
          and increasing levels of bioactive androgens.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
