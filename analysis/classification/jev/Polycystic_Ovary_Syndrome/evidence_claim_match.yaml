              id: MONDO:0008487
              label: polycystic ovary syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_pcos_11_oxygenated_androgen_causality
        prompt: Are the elevated 11-oxygenated androgens of PCOS a driver of the hyperandrogenic phenotype,
          or a marker of adrenal and adipose androgen handling that tracks it? And is their production
          insulin-dependent in common PCOS, as insulin-receptor signalling makes it in syndromes of severe
          insulin resistance?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - biochemical#11-Oxygenated Androgens
        - pathophysiology#Hyperandrogenism
        - pathophysiology#Adiposity-Amplified Insulin Resistance
        rationale: '11-oxygenated C19 steroids discriminate PCOS from controls better than total testosterone
          does, which is why they are curated as a biochemical marker here. Diagnostic discrimination
          is not mechanism, however, and the entry deliberately does not give them a pathophysiology node.
          Two lines of work make an insulin-dependent route plausible without establishing it for common
          PCOS: in women with syndromes of severe insulin resistance, 11-oxygenated androgens are raised
          in lipodystrophy but not in insulin receptoropathy, implying that intact insulin-receptor signalling
          is required for the adrenal excess; and in an adipocyte model, insulin-induced AKR1C3 converts
          11-oxygenated precursors to potent androgens. The first is 18 women with rare monogenic disease,
          the second is a cell model, and neither measures the route in ordinary PCOS. The question is
          also directional: if 11-oxygenated androgens are largely adrenal and insulin-driven, they sit
          downstream of hyperinsulinemia rather than upstream of it, which would make the classical ovarian
          and the 11-oxygenated arms separate contributors rather than one androgen pool.'
      selected_evidence:
        snippet: We conclude that the 11-oxygenated androgens formed in adipocytes may contribute to the
          hyperandrogenic profile of PCOS women and that AKR1C3 is a potential therapeutic target to mitigate
          the AE of PCOS.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/5
      evidence_path: /discussions/5/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35560164
      reference_title: Conversion of Classical and 11-Oxygenated Androgens by Insulin-Induced AKR1C3 in
        a Model of Human PCOS Adipocytes.
      evidence_source: IN_VITRO
      explanation: 'Supplies the candidate peripheral mechanism — insulin-induced AKR1C3 activating 11-oxygenated
        precursors in adipocytes — while stating it at the level this gap records: the authors write that
        these androgens "may contribute", from recombinant-enzyme kinetics and a differentiated adipocyte
        line rather than from PCOS tissue.'
