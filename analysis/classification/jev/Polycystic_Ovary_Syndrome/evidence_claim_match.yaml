  719b5b75a5bd580bfeb18d22c24e5eb160633187c6096c4a9f692ed9ff20b62a:
    claim:
      about:
        disease:
          name: Polycystic Ovary Syndrome
          disease_term:
            preferred_term: polycystic ovary syndrome
            term:
              id: MONDO:0008487
              label: polycystic ovary syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_pcos_granulosa_apoptosis_pcsk9
        prompt: Granulosa cell apoptosis is a primary driver of follicular arrest and impaired oocyte
          maturation in PCOS, but the upstream triggers of that apoptosis remain unclear. Is a PCSK9 ->
          lipid metabolism abnormality -> AMPK/GSK-3beta -> apoptosis cascade a primary, translatable
          mechanism in human PCOS, and how does it relate to the parallel ferroptosis-autophagy and ER/oxidative-stress
          death programs already described in granulosa cells?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Granulosa Cell Apoptosis via PCSK9-Lipid Dysregulation
        - pathophysiology#Ovulatory Dysfunction
        - pathophysiology#Chronic Low-Grade Inflammation
        rationale: Granulosa cell death is recognized as one of the primary factors impairing follicular
          growth, development, and oocyte maturation in PCOS, yet its upstream pathological triggers have
          been poorly defined. Teng et al. (2026) propose a specific cascade in which elevated proprotein
          convertase subtilisin/kexin type-9 (PCSK9) drives lipid metabolism abnormalities that activate
          AMP-activated protein kinase (AMPK) and glycogen synthase kinase 3beta (GSK-3beta) within follicles,
          triggering granulosa cell apoptosis and impairing ovarian function. Several questions remain
          unresolved. First, the cascade was established in PCOS model mice and primary follicles, so
          whether elevated PCSK9 is a primary driver in human PCOS rather than a species- or model-specific
          finding is unknown. Second, the proximal mechanism by which PCSK9-driven lipid abnormalities
          impair granulosa cell survival (intracellular lipid-droplet accumulation versus altered membrane
          lipid composition versus lipotoxic oxidative stress) is undefined. Third, it is unclear whether
          AMPK/GSK-3beta is the dominant death pathway or whether it operates in parallel with the previously
          modeled ferroptosis-autophagy crosstalk and ER/oxidative-stress programs that also drive granulosa
          cell loss. Resolving the relative contribution and translatability of these death pathways would
          clarify whether PCSK9 inhibition is a viable PCOS-directed therapeutic target.
        proposed_experiments:
        - experiment_id: exp_pcos_pcsk9_granulosa_apoptosis_human_vs_model
          name: PCSK9-lipid-AMPK/GSK-3beta apoptosis cascade in human granulosa cells with model comparison
          description: Compare PCSK9 expression, follicular-fluid and intracellular lipid profiles, AMPK/GSK-3beta
            activation status, and apoptosis markers in granulosa cells from PCOS patients versus controls,
            alongside PCSK9 gain- and loss-of-function in primary granulosa cells and PCOS model mice.
            Use pharmacologic PCSK9 inhibition and AMPK/GSK-3beta blockade to test whether interrupting
            the cascade rescues granulosa cell survival and follicular development, and assay ferroptosis/autophagy
            and ER-stress markers in parallel to determine pathway dominance versus redundancy.
          experiment_type:
            preferred_term: mechanistic intervention study with human-tissue and animal-model arms
          readouts:
          - name: Granulosa cell apoptosis after PCSK9 modulation
            target: pathophysiology#Granulosa Cell Apoptosis via PCSK9-Lipid Dysregulation
            description: Quantify granulosa cell apoptosis (caspase-3 activity, TUNEL, annexin V) in response
              to PCSK9 overexpression, PCSK9 inhibition, and AMPK/GSK-3beta blockade in human and mouse
              granulosa cells.
            assays:
            - preferred_term: TUNEL apoptosis assay
            - preferred_term: caspase-3 activity assay
            direction: POSITIVE
          - name: Lipid handling and AMPK/GSK-3beta signaling
            target: pathophysiology#Granulosa Cell Apoptosis via PCSK9-Lipid Dysregulation
            description: Measure intracellular lipid-droplet content, membrane lipid composition, and
              phosphorylation of AMPK and GSK-3beta to map the proximal lipotoxic-to-apoptotic signaling
              link.
            assays:
            - preferred_term: intracellular lipid quantification
            - preferred_term: phospho-protein immunoblotting
            direction: POSITIVE
          - name: Follicular development and ovulatory rescue
            target: pathophysiology#Ovulatory Dysfunction
            description: Assess antral follicle counts, dominant follicle selection, ovulation rate, and
              oocyte maturation after cascade interruption in PCOS model mice to test functional reversibility.
            assays:
            - preferred_term: ovarian histomorphometry
            - preferred_term: oocyte maturation scoring
            direction: NEGATIVE
          decision_criterion: The PCSK9-lipid-AMPK/GSK-3beta cascade is supported as a primary, translatable
            apoptosis driver if elevated PCSK9 and AMPK/GSK-3beta activation are reproducibly associated
            with increased granulosa cell apoptosis in human PCOS tissue, PCSK9 or AMPK/GSK-3beta inhibition
            reduces apoptosis and restores follicular development in models, and the effect is at least
            partially independent of the ferroptosis-autophagy and ER-stress death programs.
          would_support:
          - pathophysiology#Granulosa Cell Apoptosis via PCSK9-Lipid Dysregulation
          - pathophysiology#Ovulatory Dysfunction
      selected_evidence:
        snippet: Results demonstrated that elevated PCSK9 levels induce lipid metabolism abnormalities
          in PCOS mice, subsequently activating AMP-activated protein kinase and glycogen synthase kinase
          3β within follicles.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42093080
      reference_title: Lipid metabolism abnormalities induced by elevated PCSK9 in polycystic ovary syndrome
        mice lead to ovarian granulosa cell apoptosis via AMPK and GSK-3β.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the proposed PCSK9 -> lipid abnormality -> AMPK/GSK-3beta cascade in PCOS
        model mice that the gap and proposed experiments interrogate for human translatability.
