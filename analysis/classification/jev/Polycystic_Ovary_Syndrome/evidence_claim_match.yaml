      assertion:
        hypothesis_group_id: population_stratified_mechanistic_heterogeneity
        hypothesis_label: Population-Stratified Mechanistic Heterogeneity
        status: EMERGING
        description: 'PCOS pathophysiology exhibits significant population-specific molecular phenotypes.
          East Asian populations show a predominant enrichment of metabolic dysregulation-associated pathways
          (insulin receptor signaling, GLUT4 translocation, metabolic syndrome), whereas European populations
          exhibit a stronger inflammatory and immune-related signature (NF-kB signaling, innate immunity,
          and interleukin/cytokine and inflammasome pathways). These population-specific mechanistic differences
          may drive differential therapeutic responsiveness and clinical phenotypes across ancestry groups.

          '
      selected_evidence:
        snippet: our analyses reveal a predominant enrichment of metabolic dysregulation-associated pathways
          in East Asian PCOS, whereas European PCOS exhibits a stronger inflammatory and immune-related
          signature
