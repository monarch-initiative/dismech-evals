  21e713f1455a6d6c69e262c8eab97974f3f2043304d7200b3bdc087e5c7bc977:
    claim:
      about:
        disease:
          name: Polymyalgia Rheumatica
          disease_term:
            preferred_term: polymyalgia rheumatica
            term:
              id: MONDO:0019735
              label: polymyalgia rheumatica
        context: []
      assertion_type: Treatment
      assertion:
        name: Methotrexate
        description: The conventional steroid-sparing DMARD, and the option that predates IL-6 blockade.
          In a randomised placebo-controlled trial added to tapering prednisone, more patients were off
          prednisone at 76 weeks, fewer had a flare, and the cumulative prednisone dose was lower. Unlike
          tocilizumab it is not directed at a specific node of the mechanism; it is included because presenting
          IL-6 blockade as the only steroid-sparing route would misstate the therapeutic landscape, and
          the EULAR/ACR recommendations cover DMARDs explicitly.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: methotrexate
            term:
              id: CHEBI:44185
              label: methotrexate
        target_phenotypes:
        - preferred_term: Arthralgia
          term:
            id: HP:0002829
            label: Arthralgia
        notes: No target_mechanisms link. Methotrexate's mechanism in PMR is not resolved to a node in
          this pathograph, and asserting one would overstate what the trial shows -- the endpoints are
          steroid sparing and relapse, not a measured mechanistic effect.
      selected_evidence:
        snippet: Twenty-eight of 32 patients in the methotrexate group and 16 of 30 patients in the placebo
          group were no longer taking prednisone at 76 weeks (P = 0.003).
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
