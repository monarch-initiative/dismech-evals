        name: Age-Associated Inflammatory Susceptibility
        biological_scale: ORGANISM
        description: Polymyalgia rheumatica is essentially confined to people aged 50 and over, and is
          one of the most common inflammatory rheumatic diseases in that age group. Age is therefore not
          merely an epidemiological association but the permissive condition for the disease, which is
          why it sits at the head of the causal chain. It shares this age restriction, and much of its
          immunopathophysiology, with giant cell arteritis and rheumatoid arthritis.
        biological_processes:
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: Polymyalgia rheumatica (PMR) is one of the most common inflammatory rheumatic diseases
          in people aged ≥50 years
        supports: SUPPORT
