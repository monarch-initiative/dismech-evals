      assertion_type: Genetic
      assertion:
        name: HLA-DRB1
        gene_term:
          preferred_term: HLA-DRB1
          term:
            id: hgnc:4948
            label: HLA-DRB1
        relationship_type: MODIFIER
        notes: 'Recorded as a MODIFIER, not a susceptibility locus, and that is the point of this block.
          It would be easy to carry HLA-DRB1 across from Giant_Cell_ Arteritis, which does have susceptibility
          alleles, but the PMR data do not support it: in a Spanish cohort the DRB1 allele distribution
          in PMR was very similar to controls, while DRB1*0401 and *0404 were overrepresented in GCA,
          and the authors conclude the susceptibility alleles for the two diseases are different. What
          DRB1 does appear to do in PMR is predict relapse, with DRB1*09 more frequent in relapsing patients.

          This is a second, independent line of evidence for the lump/split call made in notes: PMR and
          GCA do not share their HLA associations.'
      selected_evidence:
        snippet: The distribution of DRB1 alleles was very similar between PMR patients and controls.
        supports: REFUTE
