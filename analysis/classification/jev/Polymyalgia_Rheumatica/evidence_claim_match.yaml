            term:
              id: MONDO:0019735
              label: polymyalgia rheumatica
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: IL-6 Amplification Loop
        biological_scale: MOLECULAR
        description: The cytokine circuit is self-reinforcing rather than linear. Proinflammatory cytokines
          activate fibroblast-like synoviocytes, which then secrete IL-6, and that IL-6 in turn promotes
          further synoviocyte proliferation. This feed-forward structure explains why the disease is sustained
          rather than self-limiting, and why interrupting IL-6 receptor signalling is disproportionately
          effective compared with blocking any single upstream cytokine.
        cell_types:
        - preferred_term: fibroblast-like synoviocyte
          term:
            id: CL:0002301
            label: type B synovial cell
        biological_processes:
        - preferred_term: positive regulation of interleukin-6 production
          term:
            id: GO:0032755
            label: positive regulation of interleukin-6 production
          modifier: INCREASED
      selected_evidence:
        snippet: Proinflammatory cytokines, including IL-1, IL-6, IL-17, and tumour necrosis factor-alpha,
          activate FLS which then secrete IL-6 that can further promote FLS proliferation.
        supports: SUPPORT
