  17bba73ca4d481eb3bb7c81ff0f19bdedf403cee65bcaf6e8997087598410bd7:
    claim:
      about:
        disease:
          name: Polymyalgia Rheumatica
          disease_term:
            preferred_term: polymyalgia rheumatica
            term:
              id: MONDO:0019735
              label: polymyalgia rheumatica
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bursal Macrophage and Synoviocyte Activation
        biological_scale: CELLULAR
        description: Immunohistological study of subacromial bursal biopsies places the cellular lesion
          in the bursa rather than in muscle. Macrophages and fibroblast-like synoviocytes accumulate
          there, and proinflammatory cytokines including IL-1, IL-6, IL-17 and TNF-alpha activate the
          synoviocytes. This is the point at which a systemic age-associated susceptibility becomes a
          localised, biopsy-visible inflammatory lesion in specific peri-articular structures.
        cell_types:
        - preferred_term: fibroblast-like synoviocyte
          term:
            id: CL:0002301
            label: type B synovial cell
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        locations:
        - preferred_term: subacromial bursa
          term:
            id: UBERON:0003668
            label: synovial bursa
        biological_processes:
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: Immunohistological studies using biopsies from subacromial bursae have indicated that
          various cytokines and cells, including macrophages, interleukin-6 (IL-6), and fibroblast-like
          synoviocytes (FLS), play an integral role in the immunopathophysiology of PMR.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41107118
