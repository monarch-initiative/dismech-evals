        description: The conventional steroid-sparing DMARD, and the option that predates IL-6 blockade.
          In a randomised placebo-controlled trial added to tapering prednisone, more patients were off
          prednisone at 76 weeks, fewer had a flare, and the cumulative prednisone dose was lower. Unlike
          tocilizumab it is not directed at a specific node of the mechanism; it is included because presenting
          IL-6 blockade as the only steroid-sparing route would misstate the therapeutic landscape, and
          the EULAR/ACR recommendations cover DMARDs explicitly.
