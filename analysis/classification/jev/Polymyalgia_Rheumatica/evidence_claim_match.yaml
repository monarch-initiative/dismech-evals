      assertion:
        name: Diagnosis of exclusion
        description: There is no specific diagnostic test. Diagnosis requires excluding other conditions
          presenting similarly, with imaging used to support the clinical diagnosis and to detect coexistent
          giant cell arteritis. Assessing disease activity is separately difficult, because pain from
          common comorbidities such as osteoarthritis and tendinopathy returns as glucocorticoids are
          reduced and can be mistaken for relapse.
