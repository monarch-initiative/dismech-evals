        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Peri-Articular Bursitis and Tenosynovitis
        biological_scale: TISSUE
        description: The anatomical substrate of the girdle pain, established by ultrasound, MRI and PET
          rather than by muscle pathology. The consistent findings are bilateral subacromial bursitis,
          biceps long-head tenosynovitis and trochanteric bursitis, with interspinous bursitis on MRI
          and PET. This node is why the disease presents as shoulder and hip girdle pain and stiffness
          despite normal muscle, and it is the direct generator of the musculoskeletal phenotype.
        locations:
        - preferred_term: subacromial and trochanteric synovial bursa
          term:
            id: UBERON:0003668
            label: synovial bursa
        - preferred_term: shoulder joint
          term:
            id: UBERON:0016884
            label: shoulder joint
      selected_evidence:
        snippet: Bilateral subacromial bursitis, biceps long head tenosynovitis and trochanteric bursitis
          were particularly consistent findings.
        supports: SUPPORT
