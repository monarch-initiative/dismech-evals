      assertion_type: Pathophysiology
      assertion:
        name: IL-6-Mediated Constitutional Symptoms
        biological_scale: ORGANISM
        description: Beyond driving inflammation, IL-6 acts on the hypothalamic-pituitary-adrenal axis
          and on peripheral and central pain pathways, producing sleep disturbance, mood disturbance,
          pain amplification and fatigue. This is a separate causal route from the bursal lesion and explains
          symptoms that pain from bursitis alone would not account for — worth modelling separately because
          it predicts that IL-6 blockade should improve fatigue and mood, not only joint symptoms.
        biological_processes:
        - preferred_term: interleukin-6-mediated signaling pathway
          term:
            id: GO:0070102
            label: interleukin-6-mediated signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: IL-6 also plays a role in sleep disturbances, mood disorders, pain, and fatigue; it is
          often seen in PMR, via disruption of the hypothalamic-pituitary-adrenal axis, and actions on
          the peripheral and central pain pathways.
        supports: SUPPORT
