        name: Systemic Acute-Phase Response
        biological_scale: ORGANISM
        description: 'IL-6 released from inflamed bursae drives hepatic acute-phase protein synthesis,
          so erythrocyte sedimentation rate and C-reactive protein are typically elevated. This is a useful
          but imperfect disease marker: acute phase reactants rise less during flares in treated patients,
          and can rise for unrelated reasons, which is part of why assessing disease activity is difficult.'
        biological_processes:
        - preferred_term: acute-phase response
          term:
            id: GO:0006953
            label: acute-phase response
          modifier: INCREASED
      selected_evidence:
        snippet: Activation of synoviocytes in bursae may result in bursitis which can lead to a high
          concentration of acute-phase reactants and systemic inflammation.
        supports: SUPPORT
