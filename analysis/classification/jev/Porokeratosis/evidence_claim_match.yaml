            id: MONDO:0019212
            label: disseminated superficial actinic porokeratosis
        description: The commonest variant. Multiple small annular macules and papules with a fine keratotic
          rim, distributed symmetrically on sun-exposed extensor limbs, usually appearing in the third
          to fifth decades and often worsening in summer. Each lesion carries its own independent postnatal
          second hit, frequently bearing a UV mutational signature, which is why sun protection is a preventive
          measure.
        genes:
        - preferred_term: MVK
          term:
            id: hgnc:7530
            label: MVK
        - preferred_term: MVD
          term:
            id: hgnc:7529
