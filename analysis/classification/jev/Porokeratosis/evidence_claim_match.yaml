      assertion_type: Pathophysiology
      assertion:
        name: Clonal Expansion of Second-Hit Keratinocytes
        biological_scale: CELLULAR
        role: amplifier
        description: The single second-hit keratinocyte and its descendants expand laterally within the
          epidermis. Sampling across an annular DSAP lesion shows that the central epidermis is composed
          almost entirely of second-hit cells while the peripheral annular ring is a mixture of second-hit
          and naive (single-mutant) keratinocytes - the spatial signature of an outwardly expanding clone.
          Kubo and colleagues therefore classify DSAP as a benign intraepidermal neoplasia explicable
          by Knudson's two-hit hypothesis.
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        - preferred_term: basal cell of epidermis
          term:
            id: CL:0002187
            label: basal cell of epidermis
        locations:
        - preferred_term: skin epidermis
          term:
            id: UBERON:0001003
            label: skin epidermis
      selected_evidence:
        snippet: In the characteristic annular skin lesions of DSAP, the central epidermis featured mostly
          second hit keratinocytes, and that of the annular ring featured a mixture of such cells and
          naïve keratinocytes, implying that each lesion reflects the clonal expansion of single second
          hit keratinocytes.
        supports: SUPPORT
