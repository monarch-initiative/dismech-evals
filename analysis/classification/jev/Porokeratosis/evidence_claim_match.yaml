            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
        description: 'Familial porokeratosis segregates as an autosomal dominant trait, with affected
          individuals carrying a monoallelic germline loss-of-function variant in MVK, PMVK, MVD or FDPS.
          The germline variant alone is not sufficient: clinically apparent lesions require an additional
          somatic event, which explains the incomplete, age-dependent penetrance. Expressivity is highly
          variable even within families, and several clinical variants can coexist in one individual.'
      selected_evidence:
        snippet: Disseminated superficial actinic porokeratosis (DSAP) is an autosomal dominantly inherited
          epidermal keratinization disorder whose etiology remains unclear.
