        context: []
      assertion_type: Inheritance
      assertion:
        name: Somatic mosaicism of the second hit
        inheritance_term:
          preferred_term: Typified by somatic mosaicism
          term:
            id: HP:0001442
            label: Typified by somatic mosaicism
        description: Lesional skin is genetically mosaic. In linear porokeratosis a single post-zygotic
          second hit occurring in the embryonic period produces a Blaschko-linear clone; in DSAP each
          lesion carries its own independent postnatal second hit. Non-hereditary localized porokeratosis
          can arise from purely somatic biallelic FDFT1 promoter hypermethylation with no germline variant
          at all.
      selected_evidence:
        snippet: Because linear porokeratosis manifests in the lines of Blaschko representing the dorsoventral
          migration patterns of keratinocyte precursors, it has been suggested that postzygotic somatic
          mutation underlies the disease.
        supports: SUPPORT
    origin:
