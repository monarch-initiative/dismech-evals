      assertion_type: HistopathologyFinding
      assertion:
        name: Cornoid Lamella
        finding_term:
          preferred_term: Cornoid lamella (vertical parakeratotic column)
          term:
            id: NCIT:C34892
            label: Parakeratosis
        description: The pathognomonic finding. A tightly stacked, vertically oriented column of parakeratotic
          corneocytes traverses the stratum corneum, angled outward from the lesion centre. It sits in
          a small epidermal invagination and corresponds exactly to the raised clinical rim. Biopsy must
          therefore sample the raised border, not the atrophic centre.
        diagnostic: true
        frequency: VERY_FREQUENT
        notes: NCIT has no dedicated cornoid-lamella class; the closest reachable histopathology-branch
          term is Parakeratosis (NCIT:C34892), the specific keratinizing abnormality the lamella is composed
          of, so preferred_term carries the more specific clinical name. Multiple cornoid lamellae in
          a single specimen are common in linear and verrucous porokeratosis, and the number varies between
          samples even within one variant.
      selected_evidence:
        snippet: Porokeratosis is a phenotypically heterogeneous disorder characterized by the histopathological
          feature cornoid lamella, which is a vertical column of parakeratosis situated above dyskeratotic
          cells within the granular layer
        supports: SUPPORT
