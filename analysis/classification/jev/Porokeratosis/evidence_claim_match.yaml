      assertion_type: Treatment
      assertion:
        name: Genetic Counseling
        description: Counseling should explain autosomal dominant transmission of the germline variant,
          the requirement for a somatic second hit (and therefore the incomplete, age-dependent penetrance
          and variable expressivity), the mosaic basis of linear disease, and the lifelong but generally
          non-life-limiting course. Molecular diagnosis by an MVK/PMVK/MVD/FDPS panel, with FDFT1 considered,
          enables cascade testing of relatives.
        action_category: COUNSELING_INFORMATIONAL
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: In 69 Chinese patients with porokeratosis, 22 pathogenic variants were detected in MVK,
          PMVK, MVD and FDPS, including 7 novel variants, 4 of which were validated via the 'second-hit'
          mechanism.
        supports: SUPPORT
