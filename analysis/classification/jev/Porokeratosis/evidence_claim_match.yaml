      assertion:
        name: Impaired Protein Prenylation and Geranylgeranylation
        biological_scale: MOLECULAR
        role: mediator
        description: Depletion of FPP and GGPP reduces post-translational lipid modification of small
          GTPases (RAS, RHOA, RHOB, RAC1, CDC42) and of nuclear lamin A. Because these proteins require
          prenylation for correct membrane or nuclear-envelope localization and act as switches in growth,
          differentiation and cytoskeletal signalling, their mislocalization is the proximate molecular
          explanation for the disordered epidermal maturation seen in porokeratosis.
        biological_processes:
        - preferred_term: protein geranylgeranylation
          term:
            id: GO:0018344
            label: protein geranylgeranylation
          modifier: DECREASED
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
      selected_evidence:
        snippet: MVK interference decreases the expression of differentiation markers, increases apoptosis,
          and decreases protein prenylation and geranylgeranylation levels in keratinocytes.
        supports: SUPPORT
