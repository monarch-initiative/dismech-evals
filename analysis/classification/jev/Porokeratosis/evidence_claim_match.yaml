        name: Eruptive
        display_name: Eruptive / immunosuppression-associated porokeratosis
        description: Sudden appearance of numerous inflammatory, often pruritic porokeratotic lesions
          in the setting of iatrogenic or disease-related immunosuppression - solid-organ or haematopoietic
          stem cell transplantation, HIV infection, haematologic malignancy, or immunosuppressive drug
          therapy. Lesions may partially regress when the immunosuppressive state is corrected. This is
          an acquired, immunologically gated presentation rather than a distinct genetic entity.
      selected_evidence:
        snippet: Here, we discuss a single-institution case series of three children who developed porokeratosis
          following hematopoietic stem cell transplantation for acute leukemia, and we propose that this
          presentation be termed localized eruptive porokeratosis (LEP).
