      assertion_type: Pathophysiology
      assertion:
        name: Perilesional Inflammatory Infiltrate
        biological_scale: TISSUE
        role: consequence
        description: A band-like lymphocytic infiltrate sits in the papillary dermis beneath the cornoid
          lamella and throughout lesional skin. It has been proposed both as a reaction induced by the
          cornoid lamella and as a constraint limiting further lateral expansion of the mutant clone;
