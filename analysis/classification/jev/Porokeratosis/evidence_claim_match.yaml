        description: In DSAP, lesions are concentrated on sun-exposed extensor surfaces of the arms and
          legs and often flare in summer, reflecting UV-signature second hits and the loss of MVK-mediated
          protection from UVA-induced keratinocyte apoptosis.
        subtype: DSAP
        notes: 'Deliberately left without an HPO binding. HP:0000992 Cutaneous photosensitivity was considered
          and rejected: its definition is an increased sensitivity of the skin to light diagnosable by
