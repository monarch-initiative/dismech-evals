          node. Intermediates upstream of the enzymatic block - mevalonate above an MVK block, and the
          corresponding proximal species for the other enzymes - build up and are potentially toxic and
          pro-inflammatory. Because inhibiting HMG-CoA reductase with a topical statin shuts off the supply
          of these intermediates without replacing any end-product, the observation that statin monotherapy
          is as effective as the cholesterol combination argues that this arm, not the depletion arm,
          is the dominant driver of the lesion.
        chemical_entities:
        - preferred_term: mevalonate
          term:
            id: CHEBI:25350
            label: mevalonate
          modifier: INCREASED
