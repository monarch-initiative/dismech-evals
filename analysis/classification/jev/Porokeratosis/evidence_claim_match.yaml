  bfc870dd07271fbf689a8357f9845a119ed8efa08b066d48b51463173a94f66e:
    claim:
      about:
        disease:
          name: Porokeratosis
          disease_term:
            preferred_term: porokeratosis
            term:
              id: MONDO:0006602
              label: porokeratosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic Second Hit in Lesional Keratinocytes
        biological_scale: MOLECULAR
        role: driver
        description: 'A somatic event inactivates the remaining wild-type allele within a single epidermal
          keratinocyte, converting the heterozygous state to biallelic deficiency. The two dominant mechanisms
          are copy-neutral loss of heterozygosity from somatic mitotic (homologous) recombination and
          C>T transition point mutations bearing a UV signature. Somatic second hits were detected in
          81% of patients in a large contemporary cohort, with gene-specific patterns (chromosome 12-wide
          copy-neutral LOH in MVK disease, 16q in MVD disease). Timing determines the clinical variant:
          an embryonic second hit gives a single Blaschko-linear clone (linear porokeratosis) whereas
          many independent postnatal second hits give the disseminated lesions of DSAP.'
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        - preferred_term: keratinocyte stem cell
          term:
            id: CL:0002337
            label: keratinocyte stem cell
        biological_processes:
        - preferred_term: response to UV
          term:
            id: GO:0009411
            label: response to UV
      selected_evidence:
        snippet: we showed that each skin lesion of DSAP exhibited an individual second hit genetic change
          in the wild-type allele of the corresponding gene specifically in the epidermis, indicating
          that a postnatal second hit triggering biallelic deficiency of the gene is required for porokeratosis
          to develop
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31207227
      reference_title: Clonal Expansion of Second-Hit Cells with Somatic Recombinations or C>T Transitions
