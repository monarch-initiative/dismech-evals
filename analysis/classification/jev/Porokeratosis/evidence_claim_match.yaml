        context: []
      assertion_type: Genetic
      assertion:
        name: FDFT1
        gene_term:
          preferred_term: FDFT1
          term:
            id: hgnc:3629
            label: FDFT1
        presence: PRESENT
        relationship_type: CAUSATIVE
        variant_origin: SOMATIC
        notes: 'Squalene synthase, the first committed step of sterol-specific cholesterol synthesis downstream
          of FDPS. A fifth mevalonate-pathway gene, added in 2024, that reaches biallelic inactivation
          by a distinct route: somatic promoter hypermethylation. Localized, non-hereditary porokeratosis
          can be caused by somatic biallelic FDFT1 promoter hypermethylation, or mono-allelic hypermethylation
          plus a somatic variant in trans, with no germline lesion. Gene-specific hypermethylation detectable
          in adjacent normal-appearing epidermis suggests an asymptomatic epigenetically mosaic field
          that predisposes to lesions. A germline-plus-somatic FDFT1 hereditary form was also identified.'
      selected_evidence:
        snippet: In some individuals with the localized form, gene-specific promoter hypermethylation
          of FDFT1 was detected in morphologically normal epidermis adjacent to methylation-related lesions
          but not distal to these lesions, suggesting that asymptomatic somatic epigenetic mosaicism of
          FDFT1 predisposes certain skin areas to the disease.
        supports: SUPPORT
    origin:
