  3c60811f8d91a0989ce333307f1785e2c9b923d2dbfd3575be7dad4d6a590e34:
    claim:
      about:
        disease:
          name: Porokeratosis
          disease_term:
            preferred_term: porokeratosis
            term:
              id: MONDO:0006602
              label: porokeratosis
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Skin biopsy of the raised lesional border
        description: The confirmatory test. The biopsy must sample the raised keratotic rim, not the atrophic
          centre, because the cornoid lamella - the diagnostic structure - sits within the rim; a punch
          taken from the centre will show only atrophic epidermis and miss the diagnosis. Histology should
          demonstrate a vertical column of parakeratosis over a diminished or absent granular layer with
          dyskeratotic keratinocytes beneath. Biopsy is mandatory whenever a lesion becomes nodular, indurated,
          ulcerated, bleeding or painful, in order to exclude keratinocyte carcinoma arising within it.
        diagnosis_term:
          preferred_term: skin biopsy
          term:
            id: NCIT:C51692
            label: Skin Biopsy
        results: A cornoid lamella establishes the diagnosis of porokeratosis; the clinical variant is
          then assigned on lesion morphology and distribution.
      selected_evidence:
        snippet: Porokeratosis is a phenotypically heterogeneous disorder characterized by the histopathological
          feature cornoid lamella, which is a vertical column of parakeratosis situated above dyskeratotic
          cells within the granular layer
        supports: SUPPORT
