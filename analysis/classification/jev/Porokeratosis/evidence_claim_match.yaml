        description: Porokeratosis is a premalignant condition. In a review of 281 reported cases, 7.5%
          harboured a malignancy arising within a porokeratotic lesion, most commonly cutaneous squamous
          cell carcinoma, with basal cell carcinoma next. Large lesions, lesions of long standing and
          the linear variant carry the greatest risk; in a contemporary genotype-phenotype cohort every
          patient with porokeratosis plus non-melanoma skin cancer carried an MVD variant. Because transformation
          can occur decades after onset, long-term surveillance rather than short-term clearance is the
          central management principle.
        cell_types:
