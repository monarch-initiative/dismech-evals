              id: MONDO:0006602
              label: porokeratosis
        context: []
      assertion_type: Treatment
      assertion:
        name: Conventional Topical and Systemic Agents
        description: The pre-statin therapeutic repertoire, still widely used and still supported only
          by case reports and small series. Topical options include 5-fluorouracil, imiquimod, retinoids,
          vitamin D analogues, diclofenac and corticosteroids; systemic acitretin is used for extensive
          or hyperkeratotic disease but relapses after withdrawal and carries mucocutaneous and metabolic
          toxicity. A 2025 systematic review of 61 DSAP studies concluded that these options vary widely
          in their efficacy-toxicity balance and that high-quality trial data are lacking.
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        notes: The individual agent names (5-fluorouracil, imiquimod, acitretin, diclofenac, vitamin D
          analogues) are drawn from the deep-research synthesis and standard dermatologic practice; the
          cited systematic review abstract groups them as "topical and systemic agents" without naming
          each, so no agent-level therapeutic_agent bindings are asserted here.
      selected_evidence:
        snippet: Of 923 citations, 61 studies were included, predominantly comprising case reports and
          retrospective case series.
        supports: SUPPORT
