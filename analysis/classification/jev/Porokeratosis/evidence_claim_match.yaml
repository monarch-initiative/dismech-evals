      assertion_type: Diagnosis
      assertion:
        name: Paired lesional and blood sequencing for the somatic second hit
        description: 'A research-grade but diagnostically decisive test in mosaic and non-hereditary disease:
          whole-exome sequencing of microdissected lesional epidermis alongside blood or saliva. It demonstrates
          the second hit - a copy-neutral loss of heterozygosity, a point mutation in trans, or, for FDFT1,
          promoter hypermethylation - that is confined to lesional skin. This is the only test that can
          confirm the two-hit mechanism in an individual patient and the only route to a molecular diagnosis
          in the germline-negative localized form.'
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        results: A lesion-restricted somatic event on the allele opposite the germline variant, or biallelic
          somatic FDFT1 promoter hypermethylation in the absence of any germline variant.
      selected_evidence:
        snippet: Paired whole-exome sequencing of affected skin and blood/saliva samples from 3 participants
          from 3 academic medical centers with clinical and histologic diagnoses of linear porokeratosis.
        supports: SUPPORT
