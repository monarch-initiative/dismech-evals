          sharply defined peripheral white-to-yellow keratotic track running around the lesion, the dermoscopic
          correlate of the cornoid lamella and often called the "Great Wall" sign. It is the feature that
          separates porokeratosis from actinic keratosis and other annular dermatoses at the bedside and
          guides where to place a confirmatory biopsy. Reflectance confocal microscopy and line-field
          confocal optical coherence tomography can add further non-invasive discrimination, but histopathology
          remains necessary whenever transformation is suspected.
