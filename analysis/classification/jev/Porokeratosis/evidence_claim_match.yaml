  cb75cc9964155fc210533a405482e01508ed6918d86b532675ce1abc409dc1a0:
    claim:
      about:
        disease:
          name: Porokeratosis
          disease_term:
            preferred_term: porokeratosis
            term:
              id: MONDO:0006602
              label: porokeratosis
        context: []
      assertion_type: Treatment
      assertion:
        name: Topical Cholesterol Plus Lovastatin
        description: 'The pathogenesis-directed therapy for porokeratosis, and a direct read-out of the
          mechanism. Compounded 2% cholesterol plus 2% lovastatin cream applied twice daily simultaneously
          addresses both arms of the metabolic lesion: lovastatin inhibits HMG-CoA reductase upstream
          of the enzymatic block, preventing accumulation of potentially toxic mevalonate-pathway intermediates,
          while cholesterol replaces the missing pathway end-product. In the original case series, cholesterol/lovastatin
          but not cholesterol alone produced near-complete clearance of DSAP lesions within four weeks,
          with moderate improvement in PPPD and linear porokeratosis. The strategy is borrowed from CHILD
          syndrome, another disorder of distal cholesterol metabolism.'
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: lovastatin
            term:
              id: CHEBI:40303
              label: lovastatin
          - preferred_term: cholesterol
            term:
              id: CHEBI:16113
              label: cholesterol
        notes: There is no FDA-approved therapy for porokeratosis; these are off-label compounded formulations
          with attendant variability in quality and potency.
      selected_evidence:
        snippet: Treatment with topical cholesterol/lovastatin (but not cholesterol alone) resulted in
          near complete clearance of disseminated superficial actinic porokeratosis lesions after 4 weeks
          of therapy and moderate improvement of porokeratosis palmaris et plantaris disseminata lesions
          and linear porokeratosis lesions.
        supports: SUPPORT
