              id: MONDO:0958226
              label: leukoencephalopathy, porphyria-related
        context:
        - path: /pathophysiology/0
          value:
            name: Biallelic HMBS Deficiency
            description: Biallelic HMBS variants reduce hydroxymethylbilane synthase (porphobilinogen
              deaminase) activity, and the reported range is wide. The index kindred had a 50% to 66%
              decrease, so 34-50% residual activity — overlapping what heterozygous AIP carriers have.
              A separate adult kindred had 18% residual erythrocyte activity against 50% in an unaffected
              heterozygous sibling, and the infantile-onset cases are markedly reduced. So residual activity
              is not uniformly below the heterozygous range, and the severity gradient tracks the specific
              allele pair rather than biallelic status alone. This is the third enzyme of heme biosynthesis,
              converting porphobilinogen to hydroxymethylbilane.
            biological_scale: MOLECULAR
            molecular_functions:
            - preferred_term: hydroxymethylbilane synthase activity
              term:
                id: GO:0004418
                label: hydroxymethylbilane synthase activity
              modifier: DECREASED
            biological_processes:
            - preferred_term: heme biosynthetic process
              term:
                id: GO:0006783
                label: heme biosynthetic process
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Porphyrin Precursor Accumulation
        causal_link_type: DIRECT
        description: Blocking the PBG-to-hydroxymethylbilane step backs up the pathway, accumulating porphobilinogen
          and, through secondary inhibition of ALAD, 5-aminolevulinic acid.
      selected_evidence:
        snippet: Impaired conversion of PBG to hydroxymethylbilane leads to the accumulation of the precursors,
          PBG and ALA.
        supports: SUPPORT
    origin:
