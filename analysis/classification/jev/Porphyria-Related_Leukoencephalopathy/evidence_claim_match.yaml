        kind: KNOWLEDGE_GAP
        prompt: Can any agent lower porphyrin precursors in the central compartment, given that hepatically
          directed therapy demonstrably cannot?
        attaches_to:
        - treatments#Liver Transplantation
        - treatments#Intravenous Haem Therapy
        rationale: Givosiran, the ALAS1 siRNA that prevents attacks in AIP, is hepatically targeted, and
          access was declined for one post-transplant patient on exactly that ground. Since CSF precursors
          do not fall after liver transplantation, there is no reason to expect a liver-directed siRNA
          to reach the relevant compartment either. A CNS-penetrant strategy is what this disorder needs
          and none has been reported.
      selected_evidence:
        snippet: However, parenterally administered heme, which is effective in acute intermittent porphyria,
          does not reach the central nervous system.
        supports: SUPPORT
