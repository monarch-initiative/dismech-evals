      assertion_type: Treatment
      assertion:
        name: Antiseizure Therapy with Non-Porphyrinogenic Agents
        description: 'Seizures in the infantile-onset form require antiseizure drugs, and the choice is
          constrained by porphyria pharmacology: many older anticonvulsants induce hepatic heme synthesis
          and are avoided in porphyria. Levetiracetam does not appear to exacerbate AIP and was used in
          the reported infant, who was also started on phenobarbital and then tapered off it precisely
          because barbiturates induce hepatic ALAS1. Note that the rationale is inherited from AIP practice
          rather than demonstrated in this disorder, where hepatic induction is not the driver - which
          makes the case for avoiding barbiturates here weaker in principle than in AIP, though it was
          acted on.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: levetiracetam
            term:
              id: CHEBI:6437
              label: levetiracetam
      selected_evidence:
        snippet: Levetiracetam, which does not appear to exacerbate AIP, has been a welcome recent addition
          to the pharmacopoeia.
        supports: SUPPORT
