        context: []
      assertion_type: Diagnosis
      assertion:
        name: Sequencing with explicit zygosity determination
        description: The diagnosis turns on zygosity, not on finding an HMBS variant. A single pathogenic
          HMBS allele is acute intermittent porphyria; two are this disease, with a different inheritance
          pattern, a different clinical syndrome and - critically - different treatment expectations.
          Several of the alleles seen in biallelic patients are themselves known AIP alleles, so a report
          naming a familiar AIP variant does not settle which disorder is present. Confirming biallelic
          status, and segregation where family members are available, is the diagnostic step.
      selected_evidence:
        snippet: Whole-exome sequencing revealed compound heterozygous missense variants in the HMBS gene
        supports: SUPPORT
