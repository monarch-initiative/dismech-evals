      assertion_type: ModelMechanismLink
      assertion:
        target: Cerebral White Matter Degeneration
        relationship: FAILS_TO_RECAPITULATE
        description: 'The closest genetic model of the human disease does not reproduce its defining lesion.
          CNS histopathology is normal in the biallelic R167Q mouse and brain haem content is about 80%
          of wild type, despite the constitutive central precursor elevation the same animal shows. That
          is a reported negative result rather than absent data, and it cuts against the simplest version
          of both competing hypotheses: neither the precursor burden nor a central haem deficit was sufficient
          to produce white matter pathology in this mouse.'
        limitations: A mouse CNS is not a human one and the reported observation is histopathology at
          whatever age it was assessed, not a lifelong neuroimaging course; the human disease is slowly
          progressive over decades. So this constrains the mechanism rather than excluding either hypothesis.
      selected_evidence:
        snippet: in the biallelic R167Q mouse, brain haem content was ~80% that of the wild‐type mice
