              label: leukoencephalopathy, porphyria-related
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: precursor_toxicity_vs_cns_heme_deficit
        kind: KNOWLEDGE_GAP
        prompt: Is the white matter injury caused by accumulated porphyrin precursors (ALA/PBG) acting
          in the CNS, or by an absolute deficit of heme within the central nervous system?
        attaches_to:
        - pathophysiology#Constitutive CNS Porphyrin Precursor Exposure
        - pathophysiology#Cerebral White Matter Degeneration
        rationale: 'These are the two standing hypotheses and they are not equivalent therapeutically:
          precursor toxicity would motivate an agent that lowers ALA/PBG inside the CNS, whereas a central
          heme deficit would require heme or a heme surrogate that crosses into the brain, which parenteral
          heme does not. The failure of both liver transplantation and haem arginate to alter CSF precursor
          levels or the clinical course is consistent with either, so the therapeutic failures do not
          discriminate between them. The edge from central precursor exposure to white matter degeneration
          is recorded as INDIRECT for this reason.

          Two natural experiments narrow it without closing it. Doss porphyria, caused by biallelic ALAD
          variants, raises ALA but not PBG and produces severe peripheral polyneuropathy with no CNS involvement
          - so ALA elevation alone appears insufficient for white matter disease, and PBG becomes the
          likelier candidate of the two precursors. Separately, the PBGD-deficient mouse develops a chronic
          progressive neuropathy while ALA is normal or only twofold raised, which its authors read as
          implicating heme deficiency. The two point in different directions, which is why the gap stays
          open.'
      selected_evidence:
        snippet: the heme precursors 5-aminolevulinic acid or porphobilinogen originating from the liver
          or central nervous system could be causative, and absolute heme deficiency in the central nervous
          system is another hypothesis
        supports: SUPPORT
