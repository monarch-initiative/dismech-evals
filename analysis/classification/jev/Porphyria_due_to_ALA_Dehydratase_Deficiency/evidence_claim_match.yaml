          producing unstable or low-activity mutant proteins. The result is profound residual ALAD activity
          loss in affected patients.

          '
        genes:
        - preferred_term: ALAD
          term:
            id: hgnc:395
            label: ALAD
          modifier: DECREASED
        molecular_functions:
        - preferred_term: porphobilinogen synthase activity
          term:
            id: GO:0004655
            label: porphobilinogen synthase activity
          modifier: DECREASED
      selected_evidence:
        snippet: 'Thus, all porphyria-associated human PBGS variants are found to shift the morpheein
          equilibrium for PBGS toward the less active hexamer.

          '
        supports: SUPPORT
