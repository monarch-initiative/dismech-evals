  ae7921bcc63d5501670cb9cceb07843ff2e4e9824d652d0a40c612d63dbafaa5:
    claim:
      about:
        disease:
          name: Post-Traumatic Epilepsy
          disease_term:
            preferred_term: post-traumatic epilepsy
            term:
              id: MONDO:0043264
              label: post-traumatic epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pte_prophylaxis_does_not_prevent_epileptogenesis
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Antiseizure prophylaxis after head injury abolishes early seizures but does nothing to
          the late epilepsy. Why does suppressing seizure expression during the acute phase leave epileptogenesis
          untouched, and what does that tell us about which node the drug is actually acting on?
        attaches_to:
        - pathophysiology#Epileptogenesis During the Latent Period
        - pathophysiology#Traumatic Brain Injury
        rationale: 'This is the central negative result of the field and it has a clean mechanistic reading
          that the entry encodes structurally. The pivotal randomized trial showed phenytoin cutting first-week
          seizures from 14.2 to 3.6 percent, then no benefit at all from day eight onward, with late rates
          numerically higher on drug at both one and two years. That dissociation is why this entry attaches
          prophylaxis to the injury node with MODULATES rather than to the epileptogenesis node: the drug
          raises seizure threshold in an acutely injured brain, and seizure threshold is simply not the
          same variable as the network reorganization that produces epilepsy. Three implications follow.
          First, an anticonvulsant screen will never find an antiepileptogenic drug, because the two are
          different endpoints. Second, the finding argues against early seizures being a major causal
          driver of epileptogenesis, since abolishing them changes nothing downstream, though it does
          not exclude a small effect. Third, any genuine prevention trial has to target one of the mechanism
          nodes upstream, the inflammasome, barrier, glial, or plasticity arms, rather than seizure expression.
          The gap is that no such trial has succeeded, so the causal sufficiency of any single upstream
          node remains unestablished in humans.'
        proposed_experiments:
        - experiment_id: exp_pte_mechanism_targeted_prevention_trial
          name: Mechanism-targeted post-traumatic epilepsy prevention trial
          description: A randomized prevention trial in high-risk traumatic brain injury patients using
            an agent directed at an upstream mechanism node rather than at seizure threshold, such as
            an IL-1 receptor antagonist or an mTOR inhibitor, with late unprovoked seizures over at least
            two years as the primary endpoint.
          decision_criterion: A reduction in late unprovoked seizures without a corresponding anticonvulsant
            effect would establish that the targeted node is causally necessary for epileptogenesis in
            humans and would separate antiepileptogenesis from anticonvulsant action as endpoints.
        - experiment_id: exp_pte_early_seizure_causal_contribution
          name: Test whether early seizures causally contribute to later epilepsy
          description: Pooled or individual-participant analysis of prophylaxis trials asking whether
            patients whose early seizures were successfully suppressed differ in late epilepsy risk from
            those who had breakthrough early seizures, adjusted for injury severity.
          decision_criterion: Equivalent late risk regardless of early-seizure suppression would confirm
            early seizures as a severity marker rather than a causal step and would justify removing them
            from causal models entirely.
      selected_evidence:
        snippet: Between day 8 and the end of year 1, 21.5 percent of the phenytoin group and 15.7 percent
          of the placebo group had seizures; at the end of year 2, the rates were 27.5 percent and 21.1
          percent, respectively
        supports: SUPPORT
