  acf1cbf001ce6f44bda0f3cbd5237dd84a0f53da3a95fa9068599795d2ab061c:
    claim:
      about:
        disease:
          name: Post-Traumatic Epilepsy
          disease_term:
            preferred_term: post-traumatic epilepsy
            term:
              id: MONDO:0043264
              label: post-traumatic epilepsy
        context: []
      assertion_type: ClinicalTrial
      assertion:
        name: NCT01048138
        status: COMPLETED
        description: 'A placebo-controlled randomized double-blind trial of biperiden, a muscarinic antagonist,
          as a disease-modifying agent after traumatic brain injury. It targets a mechanism rather than
          seizure threshold, which is the strategy this entry''s prophylaxis discussion argues is required,
          and it is therefore the closest thing to a direct test of that argument.

          It completed, and it was negative. Analysis showed no evidence of benefit for either the incidence
          of post-traumatic epilepsy or mortality.

          The paper also reports more late post-traumatic seizures in the biperiden arm. The figure is
          a count-regression coefficient on the log scale, a difference in the logs of expected counts
          of 2.03 with a 95 percent confidence interval of 0.912 to 3.1597; the null for such a coefficient
          is zero, not one, so the interval excludes it and the reported p below 0.001 is consistent.
          The estimate also survives adjustment for the on-scene Glasgow Coma Scale score, falling only
          to 1.857.

          The reason not to read that as drug harm is allocation imbalance, and the authors say so themselves:
          the biperiden arm tended toward more severe injuries by on-scene GCS and had more frequent bilateral
          brain lesions, both established risk factors for post-traumatic epilepsy. Their own conclusion
          names the unbalanced distribution of those variables as the reason larger studies are needed.
          The trial was additionally halted early for the COVID-19 pandemic and under-enrolled against
          its planned 132 participants. Taken together it is a mechanism-targeted intervention, tested
          as the prophylaxis discussion prescribes, that failed to show benefit in an underpowered and
          imbalanced sample.'
        target_phenotypes:
        - preferred_term: Focal-onset seizure
          term:
            id: HP:0007359
            label: Focal-onset seizure
      selected_evidence:
        snippet: There is no AED or medication that has been demonstrated to affect the development of
          post-traumatic epilepsy.
        supports: SUPPORT
