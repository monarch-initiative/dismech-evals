  b1b609f8ec731adb3e63b08d24316fff920437bab35ca0dd26b47f933ceecc9a:
    claim:
      about:
        disease:
          name: Post-Traumatic Epilepsy
          disease_term:
            preferred_term: post-traumatic epilepsy
            term:
              id: MONDO:0043264
              label: post-traumatic epilepsy
        context: []
      assertion_type: Environmental
      assertion:
        name: Traumatic Brain Injury
        presence: PRESENT
        description: 'Head trauma is the necessary environmental cause of this disorder, and it is what
          makes post-traumatic epilepsy unusual among epilepsies: the exposure is discrete, dated, and
          in principle preventable. Risk is graded by severity rather than binary. Mild injury confers
          only a small excess risk that disappears within five years; moderate injury roughly triples
          it; and severe injury, defined by loss of consciousness or amnesia beyond 24 hours, subdural
          haematoma, or brain contusion, raises it seventeen-fold and keeps it elevated for decades. Age
          over 65 at the time of injury is an independent risk factor. Penetrating injury is conventionally
          held to carry higher risk than closed head injury, but no source cited here demonstrates that,
          so it is not asserted as a modelled risk factor.'
        effect: Increases risk of later unprovoked seizures in proportion to injury severity, with the
          excess risk persisting for decades after severe injury.
      selected_evidence:
        snippet: Injuries were classified as mild (loss of consciousness or amnesia lasting less than
          30 minutes), moderate (loss of consciousness for 30 minutes to 24 hours or a skull fracture),
          or severe (loss of consciousness or amnesia for more than 24 hours, subdural hematoma, or brain
          contusion).
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9414327
      reference_title: A population-based study of seizures after traumatic brain injuries.
      evidence_source: HUMAN_CLINICAL
      explanation: Gives the operational severity definitions on which the graded exposure response in
        this entry rests.
