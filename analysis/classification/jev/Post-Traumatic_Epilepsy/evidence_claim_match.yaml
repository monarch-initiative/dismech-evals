  ac212311f414767de466d491fe58646292e500373e230d8bb85396b24e052137:
    claim:
      about:
        disease:
          name: Post-Traumatic Epilepsy
          disease_term:
            preferred_term: post-traumatic epilepsy
            term:
              id: MONDO:0043264
              label: post-traumatic epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pte_no_validated_epileptogenesis_biomarker
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Post-traumatic epilepsy has the one thing every other epilepsy lacks, a dated initiating
          insult and an identifiable at-risk population, yet no prevention trial has succeeded. Is the
          missing ingredient a biomarker that identifies who is actually undergoing epileptogenesis?
        attaches_to:
        - pathophysiology#Epileptogenesis During the Latent Period
        rationale: 'Most patients with traumatic brain injury never develop epilepsy, so a prevention
          trial enrolling on injury severity alone dilutes any true effect into a population that was
          mostly never going to convert. Even after severe injury the standardized incidence ratio of
          17 corresponds to a minority of patients converting. That forces either impractically large
          trials or long follow-up, and it means a genuinely effective agent could fail for statistical
          rather than biological reasons. Candidate enrichment markers exist across several modalities,
          including neuroimaging, EEG signatures, circulating cytokines, and microRNAs, but none is validated
          for the purpose. There is a second, subtler problem: the latent period is defined by the absence
          of seizures, so it is currently a diagnosis of exclusion made retrospectively once seizures
          appear. Without a positive marker there is no way to confirm that a treated patient was ever
          undergoing epileptogenesis, which makes a negative trial uninterpretable.'
        proposed_experiments:
        - experiment_id: exp_pte_prospective_biomarker_validation
          name: Prospective multimodal biomarker validation cohort
          description: A prospective cohort of patients with moderate to severe traumatic brain injury
            with serial imaging, EEG, and blood sampling from the acute phase onward, followed for at
            least five years, testing whether any single or combined marker predicts conversion to late
            unprovoked seizures with enough discrimination to enrich a trial.
          decision_criterion: A marker or panel achieving sufficient positive predictive value to reduce
            required trial size by a meaningful factor would unblock prevention trials; failure of all
            candidates would indicate that enrichment must come from injury phenotyping instead.
        - experiment_id: exp_pte_latent_period_positive_marker
          name: Search for a positive marker of ongoing epileptogenesis
          description: Test whether any candidate marker changes dynamically during the latent period
            in converters but not non-converters, so that epileptogenesis can be identified while it is
            happening rather than inferred after the first seizure.
          decision_criterion: A marker that tracks the process rather than the eventual outcome would
            make the latent period a positively defined state and would allow treatment response to be
            measured before seizures occur.
      selected_evidence:
        snippet: Predictive biomarkers (neuroimaging, EEG, cytokines, microRNAs) are essential for risk
          stratification in prophylactic trials.
        supports: SUPPORT
