      assertion_type: Treatment
      assertion:
        name: Short-Term Antiseizure Prophylaxis
        description: Phenytoin or, in current practice, levetiracetam given for approximately seven days
          after severe traumatic brain injury. This reliably reduces early provoked seizures. It does
          not reduce late unprovoked seizures, and in the pivotal randomized trial the late-seizure rates
          were numerically higher in the treated arm. The correct reading is that this is seizure suppression
          during the acute phase, not disease prevention, and it should not be continued in the hope of
          preventing epilepsy.
        therapeutic_modality: SMALL_MOLECULE
