        biological_scale: TISSUE
        conforms_to: epilepsy_excitation_inhibition_imbalance#Seizure Generation and Epileptogenesis
        description: 'The convergence node. Over weeks to years the injured network reorganizes: aberrant
          plasticity, including mTOR-dependent circuit remodelling, combines with the inflammatory, glial,
          and inhibitory changes upstream to convert a normal brain into one that generates spontaneous
          hypersynchronous activity. This is the process, not the seizures, and it is the only therapeutic
          window in which the disease could in principle be prevented rather than suppressed. No treatment
          is currently known to act on it.'
