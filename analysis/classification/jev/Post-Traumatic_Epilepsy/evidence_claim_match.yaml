          alpha-B, and their normal housekeeping fails: glutamate clearance is impaired and calcium signalling
          becomes aberrant. Because astrocytes are what keep extracellular glutamate low between synapses,
          losing that function shifts the tissue toward excitation independently of any change in the
          neurons themselves. These changes have been identified in contused human tissue, not only in
          animal models.'
        cell_types:
