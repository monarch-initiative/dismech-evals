      assertion:
        name: Early Provoked Post-Traumatic Seizures
        description: Acute symptomatic seizures within seven days of injury. These are not epilepsy and
          do not by themselves establish the diagnosis, but they are routinely conflated with it, including
          in older literature. Distinguishing them matters because only these respond to prophylaxis.
        distinguishing_features:
        - Onset within the first seven days after the injury.
        - Provoked by the acute injury rather than by an established epileptic network.
        - Suppressible by short-term antiseizure prophylaxis.
      selected_evidence:
        snippet: Short-term antiseizure prophylaxis reduces early provoked seizures, but no interventions
          prevent late unprovoked seizures or PTE.
