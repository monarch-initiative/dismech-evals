            term:
              id: MONDO:0043264
              label: post-traumatic epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pte_preclinical_to_human_translation_failure
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Several agents reduce seizure burden in rodent models of post-traumatic epilepsy, yet
          none has prevented epilepsy in humans. Is that a failure of the compounds, of trial design,
          or of the models themselves?
        attaches_to:
        - pathophysiology#Neuroinflammation and Inflammasome Activation
        - pathophysiology#Epileptogenesis During the Latent Period
        rationale: The candidate antiepileptogenic agents most often named, IL-1 receptor antagonists,
          mTOR inhibitors, and glutamate modulators such as ceftriaxone, rest on preclinical data showing
          reduced seizure burden. The mismatch is recorded as a human-model problem rather than a knowledge
          gap because the evidence exists and is positive; what is unestablished is whether it transfers.
          Several structural differences are candidates. Rodent models compress a latent period that in
          humans can run for years into weeks, so a treatment window that looks adequate in a mouse may
          be wrong by an order of magnitude in a patient. Model injuries are stereotyped and delivered
          to young healthy animals, whereas human traumatic brain injury is heterogeneous in mechanism,
          location, and severity, and its highest-risk group includes patients over 65. Most importantly,
          preclinical endpoints are usually seizure burden or frequency, which is an anticonvulsant readout,
          not the binary conversion-to-epilepsy endpoint a human prevention trial must use. Given that
          the field already knows anticonvulsant action dissociates from antiepileptogenesis in this disorder,
          a preclinical seizure-burden reduction may be measuring precisely the wrong thing.
        proposed_experiments:
        - experiment_id: exp_pte_model_endpoint_alignment
          name: Realign preclinical endpoints to conversion rather than burden
          description: Evaluate candidate antiepileptogenic agents in animal models using proportion of
            animals developing spontaneous recurrent seizures as the primary endpoint, with treatment
            withdrawn well before assessment so that residual anticonvulsant action cannot mask the result.
          decision_criterion: Agents that reduce conversion rate after washout are genuinely antiepileptogenic
            candidates; agents that only reduce seizure burden on drug are anticonvulsants and should
            not enter prevention trials.
        - experiment_id: exp_pte_model_human_injury_correspondence
          name: Correspondence of model injury to high-risk human injury phenotypes
          description: Systematic comparison of the histopathological and imaging features of standard
            rodent post-traumatic epilepsy models against the human injury features that actually carry
            risk, namely contusion with subdural haematoma, penetrating injury, and older age.
          decision_criterion: Poor correspondence, particularly on the lesion types that dominate human
            risk, would indicate the models are testing a different disease and would justify developing
            models built around those features.
      selected_evidence:
        snippet: Promising repurposed agents include IL-1 receptor antagonists (anakinra), mTOR inhibitors
          (rapamycin), and glutamate modulators (ceftriaxone), with preclinical data showing reduced seizure
          burden.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
