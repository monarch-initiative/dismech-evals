        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Traumatic Brain Injury
        biological_scale: TISSUE
        description: 'Mechanical injury to the brain is the initiating and dated event. The injury itself,
          including its acute secondary cascade, is curated in full as Traumatic_Brain_Injury; this node
          stands for it here. Risk of subsequent epilepsy scales steeply with severity: after mild injury
          the excess risk is small and disappears within five years, whereas after severe injury with
          contusion, subdural haematoma, skull fracture, or prolonged loss of consciousness it rises many-fold
          and persists for decades.'
      selected_evidence:
        snippet: The standardized incidence ratio was 1.5 (95 percent confidence interval, 1.0 to 2.2)
          after mild injuries but with no increase over the expected number after five years, 2.9 (95
          percent confidence interval, 1.9 to 4.1) after moderate injuries, and 17.0 (95 percent confidence
          interval, 12.3 to 23.6) after severe injuries.
        supports: SUPPORT
