      assertion_type: Pathophysiology
      assertion:
        name: Blood-Brain Barrier Disruption and Albumin Extravasation
        conforms_to: blood_brain_barrier_breakdown#Extravasation of Plasma Proteins into the Brain Parenchyma
        biological_scale: CELLULAR
        description: Trauma breaches the blood-brain barrier, allowing serum albumin into the neuropil
          where it is taken up by astrocytes and triggers TGF-beta receptor signalling. The downstream
          consequence is loss of astrocytic potassium and glutamate buffering capacity, which lowers the
          seizure threshold of the surrounding tissue. Barrier dysfunction after trauma is long-lasting
          rather than transient, which is what makes it a plausible driver of a process unfolding over
          months.
        biological_processes:
        - preferred_term: maintenance of blood-brain barrier
          term:
            id: GO:0035633
            label: maintenance of blood-brain barrier
          modifier: DECREASED
      selected_evidence:
        snippet: involving chronic neuroinflammation (e.g., IL-1β, NLRP3 pathways), blood-brain barrier
          dysfunction, maladaptive gliosis with glutamate dysregulation, and aberrant plasticity
        supports: SUPPORT
