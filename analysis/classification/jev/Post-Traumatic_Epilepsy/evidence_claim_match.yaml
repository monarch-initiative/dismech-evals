          node, not a step toward epilepsy, and that is the point: it is modelled as a separate branch
          off the injury rather than upstream of epileptogenesis, because abolishing it pharmacologically
          leaves late epilepsy unchanged. Whether it contributes causally at all, or is purely a marker
          of injury severity, is recorded as a discussion.'
