      assertion:
        name: Polygenic Susceptibility to PTSD after Trauma
        description: Common-variant genetic liability increases the probability of probable PTSD after
          traumatic injury, but does not by itself cause PTSD without a trauma context. PTSD genetic liability
          is also genetically correlated with isolated REM sleep behavior disorder (an early synucleinopathy
          marker); this association is explicitly non-causal and does not establish a shared disease mechanism.
      selected_evidence:
        snippet: We used data from individuals of European ancestry with mTBI enrolled in TRACK-TBI (n
          = 714), a prospective longitudinal study of level 1 trauma center patients.
        supports: SUPPORT
