      assertion_type: Diagnosis
      assertion:
        name: PTSD Checklist for DSM-5 (PCL-5)
        presence: Self-report measure of the DSM-5 PTSD symptoms used to identify probable PTSD and to
          track symptom severity. Its veteran validation study defined a diagnostic cut-off range against
          the Clinician-Administered PTSD Scale for DSM-5 as the reference standard. A score indicates
          probable PTSD; the diagnosis itself rests on the clinical assessment.
        notes: The instrument is bound at its LOINC panel code and the cut-off at its total-score code.
          Neither code carries a third-party copyright notice in the LOINC 2.83 table (the Tuva Project
          release pinned in data/loinc/MANIFEST.yaml). The instrument's items are not reproduced in this
          entry; only published thresholds are recorded. The diagnosis_term is the NCIT term for the PCL-5
          itself rather than the Clinical Evaluation term on the sibling rows, because NCIT carries this
          instrument and the term is reachable from Clinical Intervention or Procedure.
        diagnosis_term:
          preferred_term: PCL-5
          term:
            id: NCIT:C135741
            label: The PTSD Checklist for DSM-5 Questionnaire
        measurements:
        - preferred_term: PCL-5
          term:
            id: LOINC:101697-1
            label: Post traumatic stress disorder checklist - civilian version DSM-5 [PCL-5]
        reference_ranges:
        - loinc_term:
            id: LOINC:101698-9
            label: PTSD PCL-5 score [PCL-5]
          unit: '{score}'
          population: PCL-5 validation in two samples of veterans receiving care at a Veterans Affairs
            Medical Center (N = 468), with the cut-off defined in a subsample (n = 140) against the CAPS-5
          notes: 'The abstract states that "PCL-5 scores of 31 to 33 were optimally efficient for diagnosing
            PTSD", a range rather than a single cut point. The bands carry that range as its own tier:
            below 31, 31 to 33, and 34 or above. The abstract does not say which single value within the
            range a screening programme should use as its positive threshold. The range was derived in
            veterans.'
          interpretation_bands:
          - name: Below the optimally efficient cut-off range
            upper_bound: 31
            unit: '{score}'
            abnormal_flag: NORMAL
          - name: Within the optimally efficient cut-off range (31 to 33)
            lower_bound: 31
            upper_bound: 34
            unit: '{score}'
            abnormal_flag: HIGH
          - name: Above the optimally efficient cut-off range
            lower_bound: 34
            unit: '{score}'
            abnormal_flag: HIGH
      selected_evidence:
        snippet: Further, by determining a valid cutoff score using the CAPS-5, the PCL-5 can now be used
          to identify veterans with probable PTSD.
        supports: SUPPORT
