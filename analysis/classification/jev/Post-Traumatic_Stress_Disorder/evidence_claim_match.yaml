      explanation: 'In the WHO World Mental Health surveys (34,676 respondents in 20 countries), DSM-IV
        PTSD followed about 4% of randomly selected traumatic experiences. This is a population-level
        estimate across all trauma types, so it supports the description''s statement that most exposed
        people do not develop PTSD without the brain-injury confound of the TRACK-TBI cohort. The figure
        is a risk per traumatic event, not per person: one randomly selected event was assessed for each
        respondent, and a person''s risk across all of their lifetime events is somewhat higher, though
        it remains a minority.'
