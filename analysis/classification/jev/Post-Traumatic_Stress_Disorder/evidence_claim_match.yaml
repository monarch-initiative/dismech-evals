        presence: Brief primary-care screen for DSM-5 PTSD. Its development study compared it with a brief
          psychiatric interview for PTSD in veterans attending primary care and reported cut scores that
          maximized sensitivity, efficiency and specificity. A positive screen prompts assessment rather
          than establishing the diagnosis.
        notes: 'The instrument is bound at its LOINC panel code and the cut-off at its score code. Neither
          code carries a third-party copyright notice in the LOINC 2.83 table (the Tuva Project release
          pinned in data/loinc/MANIFEST.yaml). The instrument''s items are not reproduced in this entry;
          only published thresholds are recorded. No diagnosis_term is bound: NCIT label searches for
          "Primary Care PTSD" and "PC-PTSD" return no term for this screen.'
        measurements:
        - preferred_term: PC-PTSD-5
          term:
            id: LOINC:102010-6
            label: The Primary Care PTSD Screen for DSM-5 [PC-PTSD-5]
        reference_ranges:
        - loinc_term:
            id: LOINC:102017-1
            label: PC-PTSD-5 score [PC-PTSD-5]
          unit: '{score}'
          population: PC-PTSD-5 development study, convenience sample of 398 Veterans in Veterans Affairs
            primary care, with a modified PTSD module of the MINI-International Neuropsychiatric Interview
            as the reference standard
          notes: 'The abstract reports three cut scores from one analysis: "a cut score of 3 maximized
            sensitivity", "a cut score of 4 maximized efficiency", and "a cut score of 5 maximized specificity".
            The bands use the efficiency cut score of 4 and place a score of 4 in the positive tier; the
            abstract does not itself state whether a cut score is inclusive. The sensitivity and specificity
            cut scores are recorded here rather than as separate ranges.'
          interpretation_bands:
          - name: Below the efficiency cut score (screen negative)
            upper_bound: 4
            unit: '{score}'
            abnormal_flag: NORMAL
          - name: At or above the efficiency cut score (screen positive)
            lower_bound: 4
            unit: '{score}'
            abnormal_flag: HIGH
