      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: emerging_ketamine_eeg_signature
        hypothesis_label: Emerging Ketamine-Sensitive EEG Signature of Threat-Circuit Modulation
        status: EMERGING
        description: Resting frontal EEG power changes following low-dose intramuscular ketamine are proposed
          to index a disorder-specific neural system in treatment-resistant PTSD, distinguishing it from
          treatment-resistant major depression. In a small controlled study using fentanyl as an active
          comparator, TR-PTSD patients showed dose- and band-dependent EEG power changes, notably in the
          alpha band, while TR-MDD patients did not; power change correlated with symptom-scale change
          at differing bands and electrodes across diagnoses. The authors interpret this as evidence that
          ketamine engages the disorder-specific systems that conventional treatments target. The hypothesis
          rests on a single study of 22 TR-PTSD patients (20F, 2M), is not yet independently replicated,
          and the direction of causality between EEG change and symptom change is unresolved.
      selected_evidence:
        snippet: TR-PTSD patients showed dose- and band frequency-dependent EEG power changes (particularly
          alpha at 0.05 mg/kg), while TR-MDD patients did not.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
