        name: Posterior myocardial ischemic cell death
        conforms_to: thrombogenesis#Thrombotic Vascular Occlusion and Ischemic Tissue Injury
        description: Coronary occlusion reduces oxygen delivery to posterior left ventricular myocardium.
          This node specializes Thrombotic Vascular Occlusion and Ischemic Tissue Injury; it does not
          represent embolization and does not imply unsupported conformance to upstream module stages.
          Ischemia disrupts calcium handling and mitochondrial function in cardiomyocytes; reperfusion
          is essential for tissue salvage but can add ROS and ionic imbalance, with necrosis and apoptosis
          contributing to infarcted myocardium.
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: response to hypoxia
          modifier: INCREASED
