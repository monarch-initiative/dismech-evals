        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Coronary thrombosis and occlusion
        conforms_to: thrombogenesis#Pathological Fibrin-Platelet Thrombus Formation
        description: After plaque disruption, platelet deposition and coagulation cascade activation form
          a platelet-fibrin thrombus. This node maps that directly evidenced formation event to the module's
          formed-thrombus output. Its coronary-occlusion component is represented through the direct edge
          to the local ischemic-injury node; the mapping does not separately assert conformance to the
          module's upstream context, platelet-amplifier, or thrombin-generation nodes. When the thrombus
          obstructs a posterior-wall supplying coronary artery, such as the circumflex or right coronary
          artery, it causes posterior myocardial ischemia or infarction.
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: platelet activation
          modifier: INCREASED
          term:
            id: GO:0030168
            label: platelet activation
        - preferred_term: blood coagulation
          modifier: INCREASED
          term:
