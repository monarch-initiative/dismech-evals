          term:
            id: UBERON:0002349
            label: myocardium
        - preferred_term: heart left ventricle
          term:
            id: UBERON:0002084
            label: heart left ventricle
      selected_evidence:
        snippet: Acute myocardial infarction causes lethal injury to cardiomyocytes during both ischaemia
          and reperfusion (IR).
        supports: SUPPORT
