            label: blood coagulation
        - preferred_term: blood coagulation, fibrin clot formation
          modifier: INCREASED
          term:
            id: GO:0072378
            label: blood coagulation, fibrin clot formation
        - preferred_term: inflammatory response
          modifier: INCREASED
          term:
            id: GO:0006954
            label: inflammatory response
        locations:
        - preferred_term: coronary artery
          term:
            id: UBERON:0001621
            label: coronary artery
      selected_evidence:
        snippet: Platelet deposition and activation of the blood coagulation cascade in response to plaque
          disruption lead to the formation of a platelet-fibrin thrombus, which can grow rapidly, obstruct
          coronary blood flow, and cause myocardial ischemia and/or infarction.
        supports: SUPPORT
    origin:
