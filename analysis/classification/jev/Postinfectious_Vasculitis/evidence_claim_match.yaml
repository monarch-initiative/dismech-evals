        disease_term:
          preferred_term: infective endocarditis
          term:
            id: MONDO:0000565
            label: infective endocarditis
        description: Subacute bacterial endocarditis, meningococcemia, disseminated gonococcal infection,
          and rickettsial infections can present with palpable or nonpalpable purpura, septic emboli,
          and ANCA positivity, mimicking primary or postinfectious immune vasculitis.
        distinguishing_features:
        - Positive blood cultures, cardiac vegetations on echocardiography, or microvascular septic thrombi
          on biopsy identify infectious pseudovasculitis.
        - Inadvertent immunosuppression without antimicrobial therapy can be fatal in septic embolic mimics.
      selected_evidence:
        snippet: Pseudovasculitis, presenting both as palpable or nonpalpable purpura, include several
          potentially severe dis- eases, such as infectious emboli (e.g., from endocarditis), acute meningococcemia,
          disseminated gonococcal infection, Rocky mountain spotted fever, disseminated intravascular
          coagulation, monoclonal paraproteinemias or Waldenstrom’s disease, thrombotic thrombocytopenic
          purpura (Moskow - itz’s disease), emboli due to cardiac myxoma and cholesterol emboli.
        supports: SUPPORT
