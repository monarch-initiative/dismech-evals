        diagnosis_term:
          preferred_term: Skin Biopsy
          term:
            id: NCIT:C51692
            label: Skin Biopsy
        description: Punch or excisional biopsy of a fresh purpuric lesion for routine histopathology
          and unfixed direct immunofluorescence (evaluating IgA, IgG, IgM, and complement C3 deposition)
          is the gold-standard diagnostic procedure to confirm leukocytoclastic vasculitis and identify
          IgA vasculitis or immune-complex subtypes.
        results: Neutrophilic infiltration of small dermal vessels with fibrinoid necrosis and nuclear
          fragmentation (leukocytoclasia) on light microscopy, with vascular IgA or complement C3 deposits
          on direct immunofluorescence.
      selected_evidence:
        snippet: Skin biopsy is of paramount importance and should be performed whenever possible to confirm
          the diagnosis of LCV.
        supports: SUPPORT
