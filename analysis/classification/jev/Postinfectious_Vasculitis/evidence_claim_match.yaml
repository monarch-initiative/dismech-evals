      assertion:
        name: Granulomatosis with polyangiitis and primary ANCA-associated vasculitis
        disease_term:
          preferred_term: granulomatosis with polyangiitis
          term:
            id: MONDO:0012105
            label: granulomatosis with polyangiitis
        description: Infections can induce circulating ANCA via molecular mimicry and produce small-vessel
          necrotizing vasculitis that mimics primary ANCA-associated vasculitides such as granulomatosis
          with polyangiitis or microscopic polyangiitis.
        distinguishing_features:
        - Active or antecedent infection on microbiological culture, PCR, or serology favors postinfectious
          vasculitis.
        - Immune-complex and complement or IgA deposition on direct immunofluorescence contrasts with
          classic pauci-immune staining in primary ANCA-associated vasculitis.
        - Resolution after antimicrobial clearance without prolonged maintenance immunosuppression favors
          infection-associated vasculitis.
      selected_evidence:
        snippet: Infections can produce autoantibodies such as Anti-neutrophil cytoplasmic antibody through
          molecular mimicry and could confound clinical judgement.
        supports: SUPPORT
