        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: neurosteroid_withdrawal_model
        hypothesis_label: Neurosteroid (allopregnanolone) withdrawal and GABA-A receptor plasticity failure
        status: CANONICAL
        description: The dominant model holds that PPD is triggered by the precipitous fall in progesterone-derived
          neurosteroids at parturition, acting on GABA-A receptors whose subunit composition has been
          remodeled across pregnancy. Women who fail to re-adapt receptor stoichiometry to the new neurosteroid
          milieu experience a loss of inhibitory tone and depressive symptoms. The model is supported
          by an experimental human hormone-withdrawal paradigm, by a genetic mouse model of failed GABA-A
          delta-subunit regulation, and — most persuasively — by the efficacy of two neuroactive-steroid
          GABA-A positive allosteric modulators developed directly from it.
      selected_evidence:
        snippet: The data provide direct evidence in support of the involvement of the reproductive hormones
          estrogen and progesterone in the development of postpartum depression in a subgroup of women
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
