    evidence_metadata:
      reference: PMID:10831472
      reference_title: Effects of gonadal steroids in women with a history of postpartum depression.
      evidence_source: HUMAN_CLINICAL
      explanation: Experimental simulation of pregnancy-level steroids followed by blinded withdrawal
