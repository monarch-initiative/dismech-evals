  3ff40e52c8ae9c0e2145ca146308cddd6fd368ab52078af379540f276c197570:
    claim:
      about:
        disease:
          name: Postpartum Depression
          disease_term:
            preferred_term: postpartum depression
            term:
              id: MONDO:0005929
              label: postpartum depression
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ppd_gabab_versus_gabaa_inhibitory_axis
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of GABAergic Inhibitory Tone
        - genetic#KCTD16
        prompt: Postpartum depression risk shares a genome-wide significant locus with premenstrual disorder
          at KCTD16, an auxiliary subunit of the metabotropic GABA-B receptor, yet every mechanistic and
          therapeutic strand in this entry runs through the ionotropic GABA-A receptor. Does GABA-B signalling
          contribute to the loss of inhibitory tone in postpartum depression, or is the KCTD16 association
          acting through something other than the receptor complex its protein belongs to?
        rationale: 'The two claims are not in conflict, but nothing currently connects them. The curated
          chain is neurosteroid withdrawal acting on GABA-A receptors, and it is supported by the efficacy
          of two GABA-A positive allosteric modulators. Allopregnanolone has no comparable action at GABA-B
          receptors, so a genuine GABA-B contribution would have to be a parallel route to reduced inhibitory
          tone rather than a step in the neurosteroid pathway. Resolving this matters for two reasons.
          First, it determines whether the shared premenstrual-disorder and postpartum-depression liability
          is hormone-response machinery or general inhibitory tone, which is what makes the two disorders
          cross-inherited. Second, it is the difference between a treatment landscape confined to neuroactive
          steroids and one that includes GABA-B-directed agents. The evidence is currently thin on both
          sides: the locus is a single unreplicated preprint finding whose functional consequence for
          KCTD16 expression is unmeasured, and the KCTD16 to GABA-B link, while solid, comes from rodent
          brain proteomics with no postpartum context.'
        proposed_experiments:
        - experiment_id: exp_ppd_kctd16_replication_and_expression
          name: Replication of the KCTD16 shared locus and its effect on KCTD16 expression
          description: Replicate the cross-trait premenstrual-disorder and postpartum-depression association
            at the KCTD16 3' UTR locus in an independent, ideally non-European-ancestry cohort, and determine
            the direction of effect on hippocampal KCTD16 expression. A peer-reviewed replication with
            a measured expression direction is the precondition for treating GABA-B signalling as a mechanism
            here rather than as an unexplained association.
        - experiment_id: exp_ppd_gabab_tone_in_withdrawal_model
          name: GABA-B contribution to inhibitory tone in a neurosteroid-withdrawal model
          description: In the pseudopregnancy or Gabrd model, test whether GABA-B receptor signalling
            changes across the peripartum transition independently of GABA-A subunit remodeling, and whether
            manipulating Kctd16 alters the postpartum depression-like phenotype. A phenotype that moves
            with Kctd16 but not with GABA-A subunit composition would establish GABA-B as a parallel route
            to loss of inhibitory tone; no effect would argue the human locus acts elsewhere.
      selected_evidence:
        snippet: locus implicates GABAB–mediated inhibitory signaling in both disorders
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PPR:PPR1293935
      reference_title: 'Shared Genetic Architecture of Premenstrual Disorder and Postpartum Depression:
