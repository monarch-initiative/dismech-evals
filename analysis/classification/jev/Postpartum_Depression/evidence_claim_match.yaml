      assertion_type: Discussion
      assertion:
        discussion_id: ppd_hormone_concentration_null_findings
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Precipitous Postpartum Neurosteroid Withdrawal
        prompt: If PPD is caused by perinatal reproductive hormone change, why do many studies fail to
          find any difference in hormone concentrations between women who develop PPD and those who do
          not?
        rationale: The withdrawal model is not a claim about hormone levels but about differential sensitivity
          to a hormone change that all postpartum women experience. Correlational studies comparing absolute
          concentrations are therefore underpowered to detect the mechanism by construction, and their
          null results have repeatedly been misread as refuting the model. Resolving this requires sensitivity-stratified
          rather than concentration-stratified designs — the logic of the experimental withdrawal paradigm
          and of the estrogen-responsive methylation biomarker work.
      selected_evidence:
        snippet: Although a number of human and nonhuman animal studies support the role of reproductive
          hormones in PPD, several studies have failed to detect an association between hormone concentrations
          and PPD.
        supports: SUPPORT
