      assertion:
        name: Estrogen-Sensitive Epigenetic Reprogramming in Susceptible Women
        biological_scale: MOLECULAR
        description: Susceptibility to PPD appears to reside partly in how a woman's genome responds epigenetically
          to the perinatal estrogen excursion, rather than in the size of the excursion itself. Antenatal
          blood DNA methylation at estrogen-responsive loci — identified by cross-referencing human prospective
          profiles with hippocampal methylation changes induced by 17-beta-estradiol in mice — discriminates
          women who will develop PPD, with HP1BP3 and TTC9B as the two replicated biomarker loci. This
          provides a molecular correlate for the differential steroid sensitivity demonstrated experimentally.
        cell_types:
        - preferred_term: hippocampal neuron
          term:
