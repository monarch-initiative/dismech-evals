            label: cellular response to estrogen stimulus
          modifier: ABNORMAL
      selected_evidence:
        snippet: DNA methylation associated with PPD risk correlated significantly with E2-induced DNA
          methylation change, suggesting an enhanced sensitivity to estrogen-based DNA methylation reprogramming
          exists in those at risk for PPD
        supports: SUPPORT
