              label: postpartum depression
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ppd_gabrd_mouse_translation
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Failure of GABA-A Receptor Subunit Plasticity
        prompt: Does the Gabrd mouse model's failed GABA-A delta-subunit plasticity correspond to a demonstrable
          receptor-remodeling defect in women with postpartum depression?
        rationale: 'The subunit-plasticity step is the mechanistic core of the canonical model, yet the
          direct evidence for it is entirely murine: delta and gamma2 downregulation across pregnancy
          with postpartum rebound, and a depression-like phenotype in Gabrd heterozygotes and nulls. Human
          support is indirect, inferred from the therapeutic efficacy of GABA-A positive allosteric modulators,
          which would also be expected if the receptor population were normal and only the ligand were
          withdrawn. Distinguishing failed receptor plasticity from simple ligand withdrawal matters because
          it determines whether PPD susceptibility is a receptor trait or a steroid-metabolism trait,
          and hence whether prophylaxis should target receptor adaptation or neurosteroid maintenance.'
        proposed_experiments:
        - experiment_id: exp_ppd_human_gabaa_subunit_trajectory
          name: Human GABA-A delta/gamma2 subunit trajectory across pregnancy and postpartum
          description: Quantify GABA-A delta- and gamma2-subunit expression or availability across late
            pregnancy and the early postpartum in women with and without postpartum depression, using
            PET ligands sensitive to receptor subtype availability and, where obtainable, postmortem or
            biopsy tissue. The mouse model predicts downregulation across pregnancy with immediate postpartum
            rebound; failure of that rebound in affected women would establish the plasticity step in
            humans.
        - experiment_id: exp_ppd_gabrd_variant_treatment_response
          name: GABRD variant stratification of neuroactive-steroid treatment response
          description: Test whether GABRD variants stratify response to brexanolone or zuranolone in the
            completed phase 2/3 trial cohorts. If failed delta-subunit plasticity is the human lesion,
            GABRD genotype should modify the magnitude of response to delta-subunit-active neuroactive
            steroids; if the lesion is purely ligand withdrawal, it should not.
      selected_evidence:
        snippet: We suggest that Gabrd(+/-) and Gabrd(-/-) mice constitute a mouse model of postpartum
          depression that may be useful for evaluating potential therapeutic interventions.
        supports: SUPPORT
