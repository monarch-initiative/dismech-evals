      assertion_type: Pathophysiology
      assertion:
        name: Gestational Neurosteroid Surge
        biological_scale: ORGANISM
        description: Across pregnancy, placental and ovarian steroidogenesis raises circulating progesterone
          and its 5-alpha-reduced neurosteroid metabolite allopregnanolone to supraphysiologic levels.
          This is the rising limb, and it is a normal feature of every pregnancy — it is pathogenic only
          as the setup for the fall that follows, by remodeling GABA-A receptors to a high-neurosteroid
          environment that will not persist.
        biological_processes:
        - preferred_term: steroid biosynthetic process
          term:
            id: GO:0006694
            label: steroid biosynthetic process
          modifier: INCREASED
      selected_evidence:
        snippet: The large increase in progesterone-derived neurosteroids during pregnancy and their precipitous
          decline at parturition may have considerable effects on GABA(A)Rs during pregnancy and postpartum.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18667149
      reference_title: 'GABA(A)R plasticity during pregnancy: relevance to postpartum depression.'
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the gestational rise in progesterone-derived neurosteroids as the first
