      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: hpa_axis_crh_model
        hypothesis_label: Placental CRH-driven HPA axis dysregulation
        status: ALTERNATIVE
        description: A complementary model attributes PPD risk to dysregulation of the hypothalamic-pituitary-adrenal
          axis. Placental corticotropin-releasing hormone rises exponentially across gestation and suppresses
          hypothalamic CRH; its abrupt withdrawal after delivery leaves a transiently hyporesponsive axis.
          Accelerated mid-gestation pCRH trajectories predict postpartum depressive symptoms independently
          of prenatal mood, and notably without parallel cortisol or ACTH signals, suggesting a placental
          rather than adrenal locus.
      selected_evidence:
        snippet: Growth curve analyses indicated that the trajectories of pCRH in women with PPD symptoms
          are significantly accelerated from 23 to 26 weeks' GA.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19188538
      reference_title: Risk of postpartum depressive symptoms with elevated corticotropin-releasing hormone
        in human pregnancy.
      evidence_source: HUMAN_CLINICAL
      explanation: Longitudinal cohort evidence that a placental CRH trajectory, not a cortisol/ACTH signal,
        marks women who develop postpartum depressive symptoms.
