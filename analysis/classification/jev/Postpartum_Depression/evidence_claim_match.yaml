  b6c5feda64c4404d1fbe9e174623a10cda98fb9ffb527eee0b2ba73327efb829:
    claim:
      about:
        disease:
          name: Postpartum Depression
          disease_term:
            preferred_term: postpartum depression
            term:
              id: MONDO:0005929
              label: postpartum depression
        context: []
      assertion_type: Treatment
      assertion:
        name: Brexanolone
        description: 'Brexanolone is an intravenous formulation of allopregnanolone, the progesterone-derived
          neurosteroid whose postpartum withdrawal is the proposed trigger of PPD. Administered as a single
          60-hour continuous infusion, it acts as a positive allosteric modulator of synaptic and extrasynaptic
          GABA-A receptors, directly replacing the withdrawn endogenous modulator. It was the first drug
          approved specifically for postpartum depression (FDA 2019) and remains the archetypal mechanism-matched
          therapy in this entry — the trial evidence below is what established the neurosteroid-replacement
          principle that zuranolone now delivers orally.

          WITHDRAWN FROM MARKET: brexanolone is no longer commercially available. Sage Therapeutics notified
          FDA that the product was no longer marketed and requested withdrawal; FDA withdrew approval
          of NDA 211371 as of 2025-04-14. The 60-hour monitored intravenous infusion, the REMS requirement
          arising from a boxed warning for excessive sedation and sudden loss of consciousness, and the
          drug''s cost are the widely cited practical reasons the product did not survive commercially.
          It is retained in this entry because its trial data remain the primary human evidence for the
          causal role of the inhibitory-tone node, not because it is a current treatment option.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: brexanolone
            term:
              id: CHEBI:50169
              label: brexanolone
      selected_evidence:
        snippet: At 60 h, mean reduction in HAM-D total score from baseline was 21·0 points (SE 2·9) in
          the brexanolone group compared with 8·8 points (SE 2·8) in the placebo group
        supports: SUPPORT
