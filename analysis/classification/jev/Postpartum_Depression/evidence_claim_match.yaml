              label: postpartum depression
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of GABA-A Receptor Subunit Plasticity
        biological_scale: CELLULAR
        description: GABA-A receptors normally adapt to the pregnancy neurosteroid environment by downregulating
          delta and gamma2 subunits, then rebounding immediately postpartum as neurosteroid levels fall.
          Delta-subunit-containing extrasynaptic receptors mediate tonic inhibition and are the principal
          neurosteroid-sensitive population, while gamma2-containing synaptic receptors mediate phasic
          inhibition. Mice genetically unable to perform the delta-subunit adaptation develop depression-like
          and abnormal maternal behavior, identifying failed receptor plasticity — rather than the hormone
          change itself — as the pathogenic step.
        cell_types:
        - preferred_term: GABAergic neuron
          term:
            id: CL:0000617
            label: GABAergic neuron
        - preferred_term: hippocampal neuron
          term:
            id: CL:0002608
            label: hippocampal neuron
        biological_processes:
        - preferred_term: regulation of postsynaptic membrane neurotransmitter receptor levels
          term:
            id: GO:0099072
            label: regulation of postsynaptic membrane neurotransmitter receptor levels
          modifier: ABNORMAL
        - preferred_term: gamma-aminobutyric acid signaling pathway
          term:
            id: GO:0007214
            label: gamma-aminobutyric acid signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Here we show a significant decrease in tonic and phasic inhibitions in pregnant mice,
          mediated by a downregulation of GABA(A)R delta and gamma2 subunits, respectively, which rebounds
          immediately postpartum.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
