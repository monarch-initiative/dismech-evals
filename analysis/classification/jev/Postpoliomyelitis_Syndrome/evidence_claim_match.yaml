        description: 'Progressive degeneration of the distal terminal sprouts of the enlarged post-polio
          motor units produces ongoing denervation of muscle fibers. Because reinnervation by the same
          overburdened motor neurons can no longer fully compensate, denervation outpaces reinnervation,
          leading to net loss of functioning motor units. Electrophysiologically this is reflected by
          increased jitter, blocking, increased fiber density, and spontaneous activity in newly weakened
          muscles, and clinically by new weakness and atrophy.

          '
