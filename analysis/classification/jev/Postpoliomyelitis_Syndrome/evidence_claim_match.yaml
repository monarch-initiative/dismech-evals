      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: distal_motor_unit_degeneration_overload_model
        hypothesis_label: Distal Degeneration of Enlarged, Overloaded Motor Units
        status: CANONICAL
        description: The prevailing model of PPS attributes new weakness to distal degeneration of the
          enlarged post-poliomyelitis motor units that were created during recovery from acute polio.
          Surviving anterior-horn motor neurons reinnervated orphaned muscle fibers by terminal and collateral
          axonal sprouting, expanding individual motor units up to several fold. Decades of metabolic
          stress on these overextended motor neurons and their distal axons cause progressive degeneration
          of terminal sprouts, so that denervation eventually exceeds compensatory reinnervation. Aging-related
          motor neuron loss, overuse, disuse, and a possible low-grade inflammatory process are proposed
          contributors rather than poliovirus reactivation.
      selected_evidence:
        snippet: "The cause of \nPPS remains unclear, but is likely due to a distal degeneration of enlarged\
          \ \npost-poliomyelitis motor units."
        supports: SUPPORT
