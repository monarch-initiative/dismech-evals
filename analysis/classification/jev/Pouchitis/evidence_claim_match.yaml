            term:
              id: MONDO:0005312
              label: pouchitis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NOD2 Genetic Susceptibility
        description: 'Genetic polymorphisms in NOD2 (nucleotide-binding oligomerization domain-containing
          protein 2), particularly the NOD2insC variant (rs2066847), are strongly associated with increased
          risk of chronic pouchitis and Crohn''s disease-like pouch phenotypes. NOD2 normally functions
          as an intracellular bacterial sensor that regulates autophagy and antimicrobial responses; loss-of-function
          variants impair bacterial clearance and increase susceptibility to inflammation.

          '
        genes:
        - preferred_term: NOD2
          term:
            id: hgnc:5331
            label: NOD2
      selected_evidence:
        snippet: 'The NOD2insC (rs2066847) risk variant was the single nucleotide polymorphism (SNP) most
          significantly associated with pouch outcome (p=7.4×10(-5)). Specifically, it was associated
          with both CP and CDL in comparison with NCP (OR=3.2 and 4.3, respectively).

          '
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
