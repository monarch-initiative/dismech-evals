              label: Prader-Willi syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Gene Reactivation Strategies
        description: 'Potentially curative approaches aiming to unsilence the maternal (imprinted-off)
          copy of SNORD116 and other paternally expressed PWS-region genes. Strategies target the repressive
          machinery that keeps the maternal PWS locus silent — for example inhibition of SETDB1, EHMT2/G9a,
          or the ZNF274/SETDB1 complex — together with CRISPR epigenome editing (dCas9 fused to transcriptional
          activators) and small-molecule epigenetic modulators. (Note: silencing UBE3A-ATS is the Angelman-syndrome
          reactivation strategy and is not applicable to PWS.) Currently in preclinical or early-phase
          development.

          '
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: Genetic advances have illuminated the role of imprinted genes, such as SNORD116, in driving
          the syndrome's core features, offering insights into its variability and severity.
        supports: SUPPORT
