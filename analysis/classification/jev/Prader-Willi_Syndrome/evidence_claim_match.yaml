      assertion_type: Subtype
      assertion:
        name: Type I Deletion
        display_name: Type I Deletion (BP1-BP3)
        description: 'Paternal 15q11-q13 deletion spanning the larger BP1-BP3 interval. Beyond the imprinted
          PWS critical region it also removes the four non-imprinted 15q11.2 BP1-BP2 genes (TUBGCP5, CYFIP1,
          NIPA1, NIPA2) that a Type II deletion leaves intact; this is the molecular difference between
          the two deletion classes. In a consecutive microarray-typed series of 154 individuals with PWS,
          Type I accounted for 35 of 87 deletions (40.2%), so roughly a fifth to a quarter of all PWS.
          During rhGH therapy no significant longitudinal change in total or obstructive apnea-hypopnea
          index (AHI) was detected in this subtype over the first 3-6 months of treatment. That absent
          signal is not evidence of respiratory safety: the longitudinal polysomnography subgroup is small
          (Type I n = 12 against Type II n = 10), the Type I obstructive-AHI change is a non-significant
          trend rather than a flat result (p = 0.093), and baseline obstructive AHI was significantly
          higher in Type I than in Type II (1.47 +/- 0.54 against 0.26 +/- 0.20 events/h, p = 0.001),
          so Type II''s rise starts from a much lower floor. The contrast is between a high-baseline group
          that did not move detectably and a low-baseline group that did.'
        genes:
