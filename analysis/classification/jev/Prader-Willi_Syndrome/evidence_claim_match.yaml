  360c862a423bc5f053db70d41987a93cbb941f57b68cdbfe6743931810ab3526:
    claim:
      about:
        disease:
          name: Prader-Willi Syndrome
          disease_term:
            preferred_term: Prader-Willi syndrome
            term:
              id: MONDO:0008300
              label: Prader-Willi syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_pws_imprinted_15q_loss_hypothalamic_model
        hypothesis_label: Canonical 15q11.2-q13 Paternal Imprinted Locus Loss / Hypothalamic Dysfunction
          Model
        status: CANONICAL
        description: 'Prader-Willi syndrome is caused by loss of paternally-expressed imprinted genes
          in the 15q11.2-q13 region — most commonly by paternal deletion (~70%), maternal uniparental
          disomy (~25%), or imprinting center defect (~3%). Loss of paternal expression of SNRPN, MAGEL2,
          MKRN3, NDN, and the SNORD116 snoRNA cluster disrupts hypothalamic neurodevelopment and function,
          producing the characteristic biphasic phenotype: neonatal hypotonia and failure to thrive followed
          in early childhood by hyperphagia, morbid obesity, hypogonadotropic hypogonadism, short stature,
          intellectual disability, and behavioral/psychiatric features. SNORD116 paternal deletion alone
          is sufficient to produce the core PWS phenotype, identifying it as the critical region. Growth
          hormone therapy improves body composition and stature; oxytocin and MC4R-targeted setmelanotide
          therapies are in trials; MAGEL2-knockout mice recapitulate hypothalamic dysfunction and validate
          the imprinted-locus / hypothalamic-axis model.'
        notes: 'Retained as CANONICAL with major qualifications. The 2026 falcon hypothesis-search report
          (kb/hypotheses/Prader-Willi_Syndrome/canonical_pws_imprinted_15q_loss_hypothalamic_model; openscientist
          timed out at 3600s) finds PARTIALLY SUPPORTED. The core 15q11.2-q13 paternal-imprinted-locus
          loss with hypothalamic dysfunction explaining major phenotypes is strongly supported by convergent
          human genetics and mechanistic data. Three qualifications: (1) classic PWS phenotypes have been
          reported with ATYPICAL DELETIONS SPARING SNORD116 expression, indicating that non-SNORD116 mechanisms
          (e.g., SNURF-SNRPN / host transcript regulation) can be sufficient in at least some cases —
          the ''SNORD116-only'' minimal model is incomplete; (2) SNORD116-only mouse and tissue-specific
          deletion models show INCONSISTENT hyperphagia/obesity penetrance, implying additional locus
          elements, developmental timing, environment/ diet, or modifier genes contribute; (3) deletion
          SUBTYPE (Type I vs Type II) introduces additional hypothalamic GLIAL / WHITE-MATTER / SYNAPTIC
          pathology not captured by a minimal SNORD116-centric model — Type I shows microglial phagolysosome
          dysfunction (elevated CD68/Iba1, reduced CTSS/ LAMP1), increased AQP4 glymphatic signatures,
          compromised fornix myelin, and reduced synaptophysin; this is linked to CYFIP1 haploinsufficiency
          (Type I includes CYFIP1) and may explain Type-I severity. Growth hormone replacement (FDA-approved),
          oxytocin, and MC4R-pathway setmelanotide trials address specific axis phenotypes but no curative
          therapy exists. The canonical model holds at the imprinted-locus / hypothalamic-axis level but
          the molecular mechanism is multi-component.'
      selected_evidence:
        snippet: Prader-Willi syndrome (PWS) is a rare, genetic neurobehavioral and metabolic disorder
          marked by hyperphagia, behavioral challenges, and significant comorbidities, requiring a multidisciplinary
          approach for effective management.
        supports: SUPPORT
