  fbc7317b1686ecf8927912773b7e614dddb81d4c7b43aacb35db24cd5ae89d1f:
    claim:
      about:
        disease:
          name: Prader-Willi Syndrome
          disease_term:
            preferred_term: Prader-Willi syndrome
            term:
              id: MONDO:0008300
              label: Prader-Willi syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: Type I Deletion
        display_name: Type I Deletion (BP1-BP3)
        description: 'Paternal 15q11-q13 deletion spanning the larger BP1-BP3 interval. Beyond the imprinted
          PWS critical region it also removes the four non-imprinted 15q11.2 BP1-BP2 genes (TUBGCP5, CYFIP1,
          NIPA1, NIPA2) that a Type II deletion leaves intact; this is the molecular difference between
          the two deletion classes. In a consecutive microarray-typed series of 154 individuals with PWS,
          Type I accounted for 35 of 87 deletions (40.2%), so roughly a fifth to a quarter of all PWS.
          During rhGH therapy no significant longitudinal change in total or obstructive apnea-hypopnea
          index (AHI) was detected in this subtype over the first 3-6 months of treatment. That absent
          signal is not evidence of respiratory safety: the longitudinal polysomnography subgroup is small
          (Type I n = 12 against Type II n = 10), the Type I obstructive-AHI change is a non-significant
          trend rather than a flat result (p = 0.093), and baseline obstructive AHI was significantly
          higher in Type I than in Type II (1.47 +/- 0.54 against 0.26 +/- 0.20 events/h, p = 0.001),
          so Type II''s rise starts from a much lower floor. The contrast is between a high-baseline group
          that did not move detectably and a low-baseline group that did.'
        genes:
        - preferred_term: SNRPN
          term:
            id: hgnc:11164
            label: SNRPN
        - preferred_term: MAGEL2
          term:
            id: hgnc:6814
            label: MAGEL2
        - preferred_term: TUBGCP5
          term:
            id: hgnc:18600
            label: TUBGCP5
        - preferred_term: CYFIP1
          term:
            id: hgnc:13759
            label: CYFIP1
        - preferred_term: NIPA1
          term:
            id: hgnc:17043
            label: NIPA1
        - preferred_term: NIPA2
          term:
            id: hgnc:17044
            label: NIPA2
        subtype_frequency: OCCASIONAL
      selected_evidence:
        snippet: Those with the larger 15q11-q13 Type I deletion with the absence of four non-imprinted
          genes (NIPA1, NIPA2, CYFIP1, TUBGCP5) from the 15q11.2 BP1-BP2 region are more severely affected
          compared with those with PWS having a smaller Type II deletion.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36901699
      reference_title: 'Prader-Willi Syndrome and Chromosome 15q11.2 BP1-BP2 Region: A Review.'
      evidence_source: HUMAN_CLINICAL
      explanation: States the molecular definition this subtype records - Type I is the larger deletion,
        and is the one that additionally removes TUBGCP5, CYFIP1, NIPA1 and NIPA2 - which is why those
        four genes are listed here and not on Type II.
