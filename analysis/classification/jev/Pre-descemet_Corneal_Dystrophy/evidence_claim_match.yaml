      assertion_type: DifferentialDiagnosis
      assertion:
        name: Cornea farinata
        description: An age-related degeneration producing many fine, dust-like grey-brown to white opacities
          bilaterally in the posterior stroma near Descemet membrane, best seen on retroillumination.
          IC3D includes it in the same template as PDCD, and the distinction from isolated PDCD is not
          sharp - the IC3D text treats "cornea farinata" as a name applied to the same finding.
        distinguishing_features:
        - Opacities are finer and more dust-like than those of PDCD, and are best seen on retroillumination;
          confocal shows highly reflective particles in the cytoplasm of some keratocytes but only in
          the deep stroma, whereas in PDCD hyperreflective inclusions are both intracellular and extracellular.
      selected_evidence:
        snippet: In the degenerative condition, cornea farinata, many fine, dust-like gray-brown to white
          opacities are best seen on retroillumination and are located bilaterally in the posterior stroma
          near Descemet membrane.
        supports: SUPPORT
