        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pdcd_entity_boundary_xli
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Should the deep corneal deposits of X-linked ichthyosis be classified as pre-Descemet
          corneal dystrophy at all, or as a corneal manifestation of a systemic disease?
        attaches_to:
        - pathophysiology#Loss of Steroid Sulfatase Function
        - pathophysiology#Intracellular Deposition in Posterior Keratocytes
        rationale: 'This is a live disagreement between two authorities that this entry deliberately does
          not resolve. The primary ophthalmological literature - every case series cited here, from 2013
          through 2023 - labels these cases "pre-Descemet corneal dystrophy associated with X-linked ichthyosis".
          IC3D edition 3 explicitly refuses that label, describing the deposits as merely similar to PDCD
          and stating that XLI is a systemic disease with corneal manifestations and therefore not a corneal
          dystrophy. MONDO:0017392 carries the generic name and no gene, so it does not settle the question
          either way.

          It matters for what this record is. If IC3D is right, the STS arm belongs to an X-linked ichthyosis
          entry and this concept should shrink to the isolated category-4 finding; if the clinical literature
          is right, STS is the only identified genetic cause of anything called PDCD and the concept''s
          centre of gravity is the STS arm. The empirical question underneath the nomenclature is the
          deposit-identity one recorded separately: if the two arms store different material, IC3D''s
          separation is vindicated on mechanism and not merely on classification convention.'
        proposed_experiments:
        - experiment_id: pdcd_xli_corneal_survey
          name: Systematic corneal survey of a genotyped X-linked ichthyosis cohort
          description: Examine an STS-genotyped XLI cohort with slit lamp, AS-OCT and confocal microscopy
            against age-matched controls, quantifying the prevalence, depth distribution and morphology
            of pre-Descemet opacities, to establish whether the XLI corneal phenotype is quantitatively
            distinguishable from isolated PDCD rather than only nominally separated from it.
      selected_evidence:
        snippet: Pre-Descemet corneal dystrophy (PDCD) with X-linked ichthyosis (XLI) is associated with
          mutations in or deletions of the steroid sulfatase gene (STS).
        supports: REFUTE
