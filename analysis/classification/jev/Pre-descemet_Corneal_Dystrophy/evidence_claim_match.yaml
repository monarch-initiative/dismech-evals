  ff0ebb192b97eea47e55b7b24ac8a163e96c1897a3f3fa73c84e3b58df8d8790:
    claim:
      about:
        disease:
          name: Pre-Descemet Corneal Dystrophy
          disease_term:
            preferred_term: pre-descemet corneal dystrophy
            term:
              id: MONDO:0017392
              label: pre-descemet corneal dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intracellular Deposition in Posterior Keratocytes
        biological_scale: CELLULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'The shared cellular lesion, and the observation that most sharply separates this
          entity from the classical stromal dystrophies. In vivo confocal microscopy shows enlarged, hyperreflective
          keratocytes in the posterior stroma carrying intracellular dots, with activated keratocytes
          as far forward as the very anterior stroma; the same is seen in the STS-deficient arm, where
          hyperreflective particles sit inside enlarged and activated posterior keratocytes. The stromal
          dystrophies in the same MONDO branch - macular, Schnyder, congenital stromal, the TGFBI forms
          - deposit abnormal material in the extracellular matrix and progressively opacify the cornea.
          Here the cell is the affected compartment, the cells are enlarged and activated rather than
          lost, and the epithelium and endothelium are spared.

          The extracellular contribution is not nil, and the entry does not pretend otherwise: diffuse
          small extracellular stromal deposits are described in vivo, even though transmission electron
          microscopy of PDCD reports none. That is one of the inconsistencies IC3D flags in the histopathology.'
        cell_types:
        - preferred_term: Posterior stromal keratocyte
          term:
            id: CL:0002363
            label: keratocyte
        locations:
        - preferred_term: Corneal stroma
          term:
            id: UBERON:0001777
            label: substantia propria of cornea
      selected_evidence:
        snippet: Diffuse small extracellular stromal deposits, presence of enlarged hyperreflective keratocytes
          in the posterior stroma with either hyperreflective or hyporeflective intracellular dots, and
          presence of activated keratocytes in the very anterior stroma were observed in all corneas with
          in vivo confocal microscopy.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31298040
      reference_title: Multimodal imaging of pre-Descemet corneal dystrophy.
