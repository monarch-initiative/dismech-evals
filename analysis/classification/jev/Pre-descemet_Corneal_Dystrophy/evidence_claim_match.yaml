        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Membrane-Bound Vacuoles with Lipofuscin-Like Lipoprotein on Electron Microscopy
        description: Transmission electron microscopy resolves the vacuoles as membrane-bound structures
          containing electron-dense material with the appearance of secondary lysosomes, plus inclusions
          of a lipofuscin-like lipoprotein - a pattern the reporting authors read as degenerative. No
          extracellular deposits are seen. That is the ultrastructural point on which PDCD parts company
          with the classical stromal dystrophies, every one of which is defined by extracellular accumulation.
      selected_evidence:
        snippet: Membrane-bound intracellular vacuoles containing electron-dense material suggestive of
          secondary lysosomes and inclusions of a lipofuscin-like lipoprotein consistent with a degenerative
          process are seen in PDCD. No extracellular deposits are noted.
        supports: SUPPORT
