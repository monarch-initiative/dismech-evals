        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deep Stromal Punctate Opacification Anterior to Descemet Membrane
        biological_scale: TISSUE
        role: consequence
        mechanism_confidence: ESTABLISHED
        description: 'The tissue-level endpoint and the diagnostic finding: focal, fine, polymorphic grey
          opacities - central, annular or diffuse - confined to the deep stroma immediately anterior to
          Descemet membrane, bilaterally. Cross-sectional imaging resolves the same thing as a hyperreflective
          line running limbus to limbus just anterior to Descemet''s membrane, and Scheimpflug tomography
          shows a second, posterior light-scattering peak that does not belong in a normal cornea.

          The name is a slight misdescription that is worth stating explicitly: the opacities are visible
          pre-Descemet, but multimodal imaging finds fine hyperreflective particles through the posterior,
          mid and anterior stroma. The disorder affects the whole stroma; the pre-Descemet location is
          where the damage is maximal, not where it is confined.'
        locations:
        - preferred_term: Descemet's membrane
          term:
            id: UBERON:0004367
            label: Descemet's membrane
      selected_evidence:
        snippet: Focal, fine, polymorphic gray opacities that may be central, annular, or diffuse are
          visible in the deep stroma immediately anterior to Descemet membrane
        supports: SUPPORT
