  9d42e145dcf95802a1cad8188e2982f82919b5d92531787e71de12b5fab56df0:
    claim:
      about:
        disease:
          name: Pre-Descemet Corneal Dystrophy
          disease_term:
            preferred_term: pre-descemet corneal dystrophy
            term:
              id: MONDO:0017392
              label: pre-descemet corneal dystrophy
        context: []
      assertion_type: Subtype
      assertion:
        name: XLI-Associated Deep Corneal Deposits
        display_name: Deep corneal deposits of X-linked ichthyosis (STS)
        description: 'The genetically characterised arm, and the contested one. Affected men have bilateral
          punctate posterior stromal opacities anterior to Descemet membrane together with the dry, coarse,
          scaly skin of X-linked ichthyosis, and STS analysis shows a point mutation, a partial deletion
          of the coding exons, or a complete deletion of the locus at Xp22.31. That three different classes
          of lesion produce an indistinguishable corneal phenotype is itself the argument that they all
          act through loss of steroid sulfatase function.

          It is named "deep corneal deposits" rather than "PDCD" deliberately. Much of the ophthalmological
          literature - including every primary report cited here - calls these cases PDCD, but IC3D expressly
          refuses the label because XLI is a systemic disease with corneal manifestations. The subtype
          is retained under this MONDO concept because that is how the clinical literature indexes it,
          with the dissent recorded as evidence rather than suppressed.'
        genes:
        - preferred_term: STS
          term:
            id: hgnc:11425
            label: STS
      selected_evidence:
        snippet: The slit-lamp examination of three affected men (two of whom were brothers) from two
          families revealed bilateral punctate posterior corneal stromal opacities anterior to the Descemet
          membrane.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/0
      context_paths:
