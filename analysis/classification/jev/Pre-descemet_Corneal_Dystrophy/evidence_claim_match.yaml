  8a3f0e151d535574e43f30ce1bff5d0005b638b0f45e63b5c3b36a64323dea23:
    claim:
      about:
        disease:
          name: Pre-Descemet Corneal Dystrophy
          disease_term:
            preferred_term: pre-descemet corneal dystrophy
            term:
              id: MONDO:0017392
              label: pre-descemet corneal dystrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pdcd_deposit_identity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do the two arms of this entity store the same material - and specifically, is the deposit
          in the STS-deficient cornea cholesterol sulfate, or the same lipofuscin-like lipoprotein described
          in isolated PDCD?
        attaches_to:
        - pathophysiology#Cholesterol Sulfate Accumulation
        - pathophysiology#Keratocyte Lysosomal Lipofuscin-Like Lipoprotein Accumulation
        - pathophysiology#Intracellular Deposition in Posterior Keratocytes
        rationale: 'The two arms of this entry converge on an identical-looking cellular lesion from two
          different proposed substrates, and neither has been measured where it matters. In the STS-deficient
          arm, cholesterol sulfate is the natural candidate, but the accumulation has only ever been demonstrated
          in the stratum corneum; no chemical or metabolomic characterisation of an STS-deficient cornea
          exists. In the isolated arm, the material that has actually been characterised ultrastructurally
          is a lipofuscin-like lipoprotein in secondary lysosomes - not a sulfated sterol - and IC3D warns
          that even those studies are inconsistent.

          Three outcomes are possible and they are not equivalent. If both arms store cholesterol sulfate,
          the isolated cases become candidates for occult sulfatase pathway defects. If both store lipofuscin-like
          lipoprotein, the STS lesion is acting through a general lysosomal-degradation failure rather
          than through its own substrate, and the entity is a degeneration with a genetic accelerator.
          If they store different things, the resemblance is coincidental and the two should not share
          a MONDO concept at all - which is close to IC3D''s position.'
        proposed_experiments:
        - experiment_id: pdcd_deposit_lipidomics
          name: Comparative lipidomics and electron microscopy of PDCD and STS-deficient corneas
          description: Apply mass-spectrometry lipidomics and transmission electron microscopy to corneal
            tissue from an STS-deleted donor and from a donor with isolated PDCD, comparing sulfated sterol
            and lipofuscin content of posterior versus anterior stroma against age-matched controls, to
            establish whether the two arms store the same material.
      selected_evidence:
        snippet: Membrane-bound intracellular vacuoles containing electron-dense material suggestive of
          secondary lysosomes and inclusions of a lipofuscin-like lipoprotein consistent with a degenerative
          process are seen in PDCD.
        supports: SUPPORT
