              MIM number, no locus and no gene, and describes it as neither well defined nor clearly hereditary
              or degenerative. The countervailing observation is that it has been reported in families
              across two to four generations, so a purely degenerative reading is not settled either.
              Onset is usually after age 30, which distinguishes it from the XLI-associated deposits of
              the other subtype.
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Keratocyte Lysosomal Lipofuscin-Like Lipoprotein Accumulation
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: PROVISIONAL
        subtypes:
        - Isolated PDCD
        description: 'The proposed initiating lesion of the isolated arm, and the reason that arm reads
          as a degeneration. Transmission electron microscopy of PDCD corneas shows membrane-bound intracellular
          vacuoles containing electron-dense material that has the appearance of secondary lysosomes,
          together with inclusions of a lipofuscin-like lipoprotein. Lipofuscin is the classic marker
          of accumulated, incompletely degraded material in long-lived post-mitotic cells, and its presence
          is what the reporting authors read as evidence of a degenerative process rather than of a genetically
          determined storage product. Consistent with that, onset is usually after age 30.

          It is curated PROVISIONAL rather than established because IC3D itself reports that the histopathological
          studies of PDCD are not consistent, and because no gene, locus or metabolic defect has been
          assigned that would explain why the material accumulates.'
