  460f997d549221a05c8c08c090d614c611638e26d7a8fd284e4d1049985fe9f3:
    claim:
      about:
        disease:
          name: Pre-Descemet Corneal Dystrophy
          disease_term:
            preferred_term: pre-descemet corneal dystrophy
            term:
              id: MONDO:0017392
              label: pre-descemet corneal dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Visually Silent Corneal Finding
        biological_scale: ORGANISM
        role: consequence
        mechanism_confidence: ESTABLISHED
        description: 'The organism-level outcome, unusual in being an absence of disability. Vision is
          usually unaffected and patients are typically asymptomatic, so PDCD requires no treatment; IC3D
          lists it among the dystrophies that are typically asymptomatic and need none. The qualifier
          "usually" is theirs and is kept here, because one adult in a recently described pedigree did
          complain of glare.

          The clinical value of the finding is therefore diagnostic rather than therapeutic, and it runs
          in both directions: pre-Descemet opacities in a male - especially a child, since the XLI-associated
          deposits appear in the first decade - are a reason to examine the skin and consider copy-number
          analysis of STS, and known ichthyosis is a reason to look at the cornea.'
      selected_evidence:
        snippet: Vision is usually unaffected, and patients are typically asymptomatic. One adult member
          of a recently described pedigree complained of glare.
        supports: SUPPORT
