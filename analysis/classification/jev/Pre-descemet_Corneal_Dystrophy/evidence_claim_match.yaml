      assertion_type: Inheritance
      assertion:
        name: X-linked recessive inheritance
        inheritance_term:
          preferred_term: X-linked recessive inheritance
          term:
            id: HP:0001419
            label: X-linked recessive inheritance
        description: In the XLI-associated subtype the lesion is at Xp22.3 and the reported affected individuals
          are men, including two brothers in one family. The corneal finding therefore segregates with
          X-linked ichthyosis itself, whose causative gene STS lies at that locus. This inheritance block
          describes the XLI-associated arm only; isolated PDCD has no established mode of inheritance,
          which is part of why IC3D rates it category 4.
      selected_evidence:
        snippet: Genetic examination of the STS locus on the X chromosome in Case 1 revealed a deletion
          that spanned across DNA markers DXS1130-DXS237, which includes all the coding exons (exons 1-10)
          of STS.
        supports: SUPPORT
