      assertion:
        name: Isolated PDCD
        display_name: Isolated PDCD (IC3D category 4)
        description: PDCD occurring without ichthyosis and without an identified gene - the entity MONDO
          and Orphanet actually define, and the one IC3D rates category 4. IC3D assigns it no MIM number,
          no locus and no gene, and describes it as neither well defined nor clearly hereditary or degenerative.
          The countervailing observation is that it has been reported in families across two to four generations,
          so a purely degenerative reading is not settled either. Onset is usually after age 30, which
          distinguishes it from the XLI-associated deposits of the other subtype.
      selected_evidence:
        snippet: Isolated pre-Descemet corneal dystrophy (PDCD) is neither a well-defined entity nor is
          it clearly a hereditary or degenerative disorder (known as cornea farinata, "flour-like cornea").
