        context:
        - path: /has_subtypes/1
          value:
            name: XLI-Associated Deep Corneal Deposits
            display_name: Deep corneal deposits of X-linked ichthyosis (STS)
            description: 'The genetically characterised arm, and the contested one. Affected men have
              bilateral punctate posterior stromal opacities anterior to Descemet membrane together with
              the dry, coarse, scaly skin of X-linked ichthyosis, and STS analysis shows a point mutation,
              a partial deletion of the coding exons, or a complete deletion of the locus at Xp22.31.
              That three different classes of lesion produce an indistinguishable corneal phenotype is
              itself the argument that they all act through loss of steroid sulfatase function.

              It is named "deep corneal deposits" rather than "PDCD" deliberately. Much of the ophthalmological
              literature - including every primary report cited here - calls these cases PDCD, but IC3D
              expressly refuses the label because XLI is a systemic disease with corneal manifestations.
              The subtype is retained under this MONDO concept because that is how the clinical literature
              indexes it, with the dissent recorded as evidence rather than suppressed.'
            genes:
            - preferred_term: STS
              term:
                id: hgnc:11425
                label: STS
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Steroid Sulfatase Function
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        subtypes:
        - XLI-Associated Deep Corneal Deposits
        description: The trigger of the genetically characterised arm. STS at Xp22.31 encodes steroid
          sulfatase, the enzyme that hydrolyses cholesterol sulfate, dehydroepiandrosterone sulfate and
          estrone sulfate. Three classes of lesion have been found in families with pre-Descemet deposits
          and X-linked ichthyosis - point mutations, partial deletions removing some of the ten coding
          exons, and complete deletion of the locus, in one case a 4.4 Mb hemizygous deletion taking three
          further genes with it. The informative observation is that the corneal phenotype does not differ
          between these classes, which is the argument that all of them converge on loss of enzyme function
          rather than on some deletion-size-dependent contiguous-gene effect.
        genes:
        - preferred_term: STS
          term:
            id: hgnc:11425
            label: STS
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HEMIZYGOUS
          description: Hemizygous point mutations, partial deletions (exons 1-7 reported) and complete
            deletions of STS at Xp22.31 in affected males.
        molecular_functions:
        - preferred_term: steryl-sulfatase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0004773
            label: steryl-sulfatase activity
      selected_evidence:
        snippet: Genetic screening of Cases 2 and 3 revealed a partial deletion of the STS locus involving
          exons 1-7 and flanking DNA marker DXS1130 on the X chromosome.
        supports: SUPPORT
