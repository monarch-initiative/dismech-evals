        context: []
      assertion_type: Phenotype
      assertion:
        category: Ophthalmologic
        name: Glare
        description: 'Vision is usually unaffected in this entity, but not invariably: one adult member
          of a recently described pedigree complained of glare. Recorded because "asymptomatic" is the
          entity''s defining clinical claim, and a single documented exception to it is worth carrying
          rather than rounding away.'
        phenotype_term:
          preferred_term: Glare
        notes: 'Left unbound deliberately. HPO has no term for glare - light scatter degrading image quality
          - and the nearest candidate, Photophobia (HP:0000613), is defined as "Excessive sensitivity
          to light with the sensation of discomfort or pain in the eyes due to exposure to bright light",
          which is a different complaint from glare produced by a light-scattering cornea. `sqlite:obo:hp`
          was searched for "glare" and for the Photophobia and abnormal-visual-function neighbourhoods;
          no suitable term exists. `frequency` is likewise omitted: the source describes a single adult
          in one pedigree, which is below the resolution of any FrequencyEnum band.'
      selected_evidence:
        snippet: Vision is usually unaffected, and patients are typically asymptomatic. One adult member
          of a recently described pedigree complained of glare.
        supports: SUPPORT
