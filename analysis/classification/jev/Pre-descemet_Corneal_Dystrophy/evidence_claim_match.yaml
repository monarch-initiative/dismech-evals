        context: []
      assertion_type: Phenotype
      assertion:
        category: Ophthalmologic
        name: Abnormal Posterior Corneal Stroma
        description: 'The structural abnormality underlying the visible opacities: enlarged, activated
          keratocytes in the posterior stroma laden with hyperreflective intracellular particles.'
        notes: 'Carried alongside the punctate-opacity phenotype (HP:0007856) on purpose, even though
          HP:0011492 is that term''s generic ancestor. The two record different observations at different
          resolutions: HP:0007856 is what the slit lamp sees (discrete grey punctae at a defined depth),
          while this entry is what confocal microscopy sees (enlarged, activated, particle-laden keratocytes).
          HPO has no term for the latter, so the generic parent is the closest available anchor and the
          specificity lives in the description. If a keratocyte-inclusion term is ever added, this binding
          should move to it.'
        phenotype_term:
          preferred_term: Abnormal corneal stroma morphology
          term:
            id: HP:0011492
            label: Abnormal corneal stroma morphology
      selected_evidence:
        snippet: Slit-lamp biomicroscopy showed the presence of tiny and pleomorphic opacities in the
          posterior stroma immediately anterior to Descemet membrane bilaterally.
