              label: pre-descemet corneal dystrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pdcd_is_it_a_dystrophy
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is isolated PDCD a corneal dystrophy at all, or an age-related degeneration that has been
          classified with the dystrophies by appearance alone?
        attaches_to:
        - pathophysiology#Keratocyte Lysosomal Lipofuscin-Like Lipoprotein Accumulation
        - pathophysiology#Deep Stromal Punctate Opacification Anterior to Descemet Membrane
        rationale: 'IC3D assigns PDCD to category 4, the tier reserved for entities with the least evidence
          for being a corneal dystrophy, and assigns it no MIM number, no locus and no gene. The ultrastructure
          - lipofuscin-like lipoprotein in secondary lysosomes - is read by the reporting authors as degenerative,
          an independent in vivo imaging series reached the same conclusion, and onset after age 30 fits
          a degeneration better than a dystrophy.

          What keeps the question open rather than closed is that the same source reports PDCD in families
          across two to four generations, and that some forms progress. A purely age-related degeneration
          should not cluster in pedigrees. The contrast with the neighbouring entity is instructive: PPPCD
          occupies the same corneal layer, has autosomal dominant pedigrees and a gene (PRDX3), and is
          rated category 1 - so the classification machinery is capable of recognising a dystrophy here
          when the evidence supports one, and has declined to for PDCD.'
        proposed_experiments:
        - experiment_id: pdcd_age_stratified_prevalence
          name: Age-stratified prevalence of pre-Descemet opacities in an unselected population
          description: Determine the prevalence of pre-Descemet punctate opacities by decade in an unselected
            adult population with slit-lamp and AS-OCT, with STS copy-number analysis and dermatological
            examination in those affected. A prevalence rising steadily with age in individuals without
            STS lesions would support degeneration; familial clustering beyond chance would support dystrophy.
      selected_evidence:
        snippet: PDCD has historically been described as having several subgroups, many of which may represent
          sporadic, age-related degenerative and secondary changes.
        supports: SUPPORT
