        description: 'Tightly controlled hypoxia guides normal trophoblast differentiation and vascular
          remodeling in early gestation. When hypoxia becomes persistent or excessive, hypoxia-inducible
          factor 1-alpha (HIF-1alpha) is stabilized rather than degraded, and sustained HIF-1alpha activity
          becomes the transcriptional link between placental ischemia and the antiangiogenic shift: it
          drives mitochondrial dysfunction and oxidative stress that amplify placental injury, and it
          promotes antiangiogenic transcriptional programs including sFlt-1 upregulation. This node is
          curated from review-level synthesis; no HIF-1alpha perturbation experiment has been performed
          in human placental tissue, so the edge to antiangiogenic factor release is mechanistically motivated
          rather than directly demonstrated in humans. It is distinct from the HIF-1alpha/TFRC ferroptosis
          axis modelled under microplastic exposure, which is a rodent finding about a specific exposure
          rather than the endogenous ischemic response described here.

          '
        cell_types:
