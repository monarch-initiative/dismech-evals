              label: acetylsalicylic acid
      selected_evidence:
        snippet: Preterm preeclampsia occurred in 13 participants (1.6%) in the aspirin group, as compared
          with 35 (4.3%) in the placebo group (odds ratio in the aspirin group, 0.38; 95% confidence interval,
          0.20 to 0.74; P=0.004).
        supports: SUPPORT
