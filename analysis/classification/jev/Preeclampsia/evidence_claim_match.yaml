      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/4
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22103497
      reference_title: Is inflammation the cause of pre-eclampsia?
      evidence_source: HUMAN_CLINICAL
      explanation: 'The review-level claim that the reversibility criterion is already satisfied. It is
        included because it is the position this gap qualifies: the criterion is asserted at review level
        on the strength of the pilot series alone.'
