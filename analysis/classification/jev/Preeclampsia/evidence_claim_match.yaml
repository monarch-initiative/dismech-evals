              in preeclamptic placentas and activates the TGF-β/Smad3 signaling pathway in extravillous
              trophoblasts. This placental-derived mechanism cell-autonomously suppresses trophoblast
              epithelial-to-mesenchymal transition (EMT) and downregulates matrix metalloproteinases (MMP2/MMP9),
              thereby reducing trophoblast proliferation, migration, and invasion capacity. This is distinct
              from the sEng-mediated inhibition of endothelial TGF-beta signaling modeled downstream in
              the maternal circulation.

              '
            cell_types:
            - preferred_term: extravillous trophoblast
              term:
                id: CL:0008036
                label: extravillous trophoblast
