        notes: 'Encodes fms-like tyrosine kinase 1 (VEGFR1). Alternative splicing produces the soluble
          isoform sFlt-1, which is overexpressed by the preeclamptic placenta and acts as a decoy receptor
          sequestering VEGF and PlGF. Polymorphisms in FLT1 are associated with preeclampsia susceptibility.
          The risk variant is carried in the fetal rather than the maternal genome, which is the strongest
          genetic argument that placental sFlt-1 overproduction is causal rather than reactive. Note the
          association reported for that locus was strongest in late-gestation preeclampsia with normally
          grown offspring, so it is evidence for the antiangiogenic axis in preeclampsia generally and
          not specifically for the early-onset subtype.

          '
      selected_evidence:
        snippet: we confirm that placental soluble fms-like tyrosine kinase 1 (sFlt1), an antagonist of
          VEGF and placental growth factor (PlGF), is upregulated in preeclampsia
        supports: SUPPORT
