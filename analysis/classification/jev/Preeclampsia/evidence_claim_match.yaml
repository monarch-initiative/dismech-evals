      assertion:
        name: Micro- and nanoplastic particle exposure
        exposure_term:
          preferred_term: exposure to microplastic particle
          term:
            id: ECTO:7000061
            label: exposure to microplastic particle
        description: 'Polystyrene microplastics reproduce a preeclampsia-like syndrome in pregnant rats
          - hypertension, proteinuria, and shifted angiogenic factor expression - through a defined trophoblast
          mechanism. There is no human counterpart: no study has related the plastic burden measurable
          in human placentas to preeclampsia risk, so this exposure rests entirely on a rodent model at
          experimental doses. Listed because the mechanism it names, ferroptotic trophoblast injury upstream
          of failed spiral artery remodeling, is testable in human tissue and would matter if it held;
          see the human-model mismatch discussion.'
      selected_evidence:
        snippet: Pregnant rats were exposed to PS-MP, which induced PE-like symptoms including elevated
          blood pressure, increased proteinuria, and altered expression of angiogenic factors.
        supports: SUPPORT
