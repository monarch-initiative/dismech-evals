  933436e5688d310f50786ab260689b0f833caf75d087511bbab351628bb24178:
    claim:
      about:
        disease:
          name: Preeclampsia
          disease_term:
            preferred_term: preeclampsia
            term:
              id: MONDO:0005081
              label: preeclampsia
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: early_onset_placenta_dominant
        hypothesis_label: Early-Onset Placenta-Dominant Antiangiogenic Model
        status: CANONICAL
        applies_to_subtypes:
        - Early-onset
        - HELLP
        description: 'In early-onset preeclampsia, immune maladaptation at the maternal-fetal interface
          and defective trophoblast invasion produce severe placental malperfusion before clinical disease.
          Placental hypoxia and stress drive a marked antiangiogenic shift, especially excess sFlt-1 and
          soluble endoglin with reduced free PlGF, causing maternal endothelial dysfunction and organ-specific
          renal, hepatic, CNS, and uteroplacental manifestations.

          '
        notes: 'The 2026 OpenScientist hypothesis-search report (kb/hypotheses/Preeclampsia/early_onset_placenta_dominant/openscientist.md)
          retained this model as strongly supported after reviewing 98 papers. It emphasized convergent
          support for the antiangiogenic cascade and KIR/HLA-C upstream trigger, while flagging three
          boundaries: late-onset disease is not primarily explained by this model, HELLP may include a
          parallel complement microangiopathy branch, and definitive Phase III interventional evidence
          for targeted sFlt-1 reduction is still missing.

          The 2026 assessment of that report (assessments/openscientist-assessment-by-claude-opus-5.yaml
          in the same directory) confirmed the central chain and the subtype boundary but rejected three
          of the report''s supporting arguments. Two of those bear directly on how strongly this model
          can be scoped to early-onset disease. First, the fetal FLT1 GWAS is not early-onset-specific
          evidence: the locus is real, but the source reports its association as strongest in late-gestation
          preeclampsia with normally grown babies, and the report''s contrary claim that no subtype-stratified
          analysis exists is incorrect. Second, the interventional argument rests on one uncontrolled
          apheresis series rather than two, because the second apheresis study prolonged pregnancy without
          lowering sFlt-1 at all. Both points are curated as evidence and as a knowledge gap below rather
          than as a change of status, which remains CANONICAL.

          '
      selected_evidence:
        snippet: Early-onset preeclampsia has many features in common with atherosclerosis, whereas late-onset
          preeclampsia seems to result from a mismatch of fetal demands and maternal supply, that is,
          a metabolic crisis.
        supports: SUPPORT
    origin:
