  0c6b4a273f096a55c95cf2964683e6f297f1461b37cb0deb8981cdd41d6448e8:
    claim:
      about:
        disease:
          name: Preeclampsia
          disease_term:
            preferred_term: preeclampsia
            term:
              id: MONDO:0005081
              label: preeclampsia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: preeclampsia_complement_independence_in_hellp
        prompt: Is complement activation in HELLP syndrome an effector pathway independent of the antiangiogenic
          shift, or is it downstream of it?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Hepatic Sinusoidal Obstruction and HELLP
        - pathophysiology#Maternal Endothelial Dysfunction
        - mechanistic_hypotheses#early_onset_placenta_dominant
        rationale: 'This entry models HELLP as a liver-specific amplification of the systemic endothelial
          injury caused by the antiangiogenic shift, and the canonical hypothesis claims HELLP among the
          subtypes it explains. Complement is the main candidate for a branch that would sit outside that
          account. The activation itself is not in doubt: a systematic review of 41 studies reports consistent
          consumption of C3, C4 and factor H alongside raised C4d, Bb, factor D, C3a, C5a and C5b-9 in
          preeclampsia. What is unresolved is dependence. The only interventional evidence is a single
          case in which C5 inhibition normalised laboratory parameters and prolonged pregnancy by 17 days,
          and that report measured no angiogenic factors at all, so it cannot show that the benefit was
          independent of sFlt-1. Resolving this decides whether complement inhibition belongs alongside
          or instead of antiangiogenic approaches in HELLP, and whether this entry needs a separate complement
          branch rather than a note.'
        notes: Recorded from the 2026 assessment of the OpenScientist hypothesis report in kb/hypotheses/Preeclampsia/early_onset_placenta_dominant/.
          The report graded the claim SPECULATIVE in its own classification table but described it in
          its evidence matrix as improvement independent of sFlt-1, which the case report does not establish.
          The systematic review also warns that complement measurements across this literature suffer
          from a lack of experimental uniformity and biased cohort selection, so the biomarker signal
          should not be read as a settled quantitative baseline either.
        proposed_experiments:
        - experiment_id: preeclampsia_hellp_complement_inhibition_with_angiogenic_monitoring
          name: Complement inhibition in HELLP with serial complement and angiogenic monitoring
          description: 'Treat HELLP syndrome with C5 inhibition against standard care, measuring C3a,
            C5a and sC5b-9 alongside sFlt-1, free PlGF and their ratio on the same schedule. The design
            point is that both pathways are tracked in the same patients, so a clinical response can be
            assigned to one of them rather than inferred. The existing case report failed precisely here:
            it recorded the clinical result and no angiogenic measurement.'
          would_support:
          - pathophysiology#Hepatic Sinusoidal Obstruction and HELLP
          supporting_outcome:
          - Clinical and laboratory improvement following complement inhibition while sFlt-1 and the sFlt-1/PlGF
            ratio remain unchanged, which would establish a complement branch acting in parallel to the
            antiangiogenic shift.
          refuting_outcome:
          - Improvement accompanied by a fall in sFlt-1, or no improvement despite complement blockade,
            either of which would keep complement activation downstream of the antiangiogenic mechanism
            this entry already models.
      selected_evidence:
        snippet: Retrieved results consistently reported C4, C3, and factor H reduction, and increased
          circulating levels of C4d, Bb, factor D, C3a, C5a, and C5b-9 in PE compared to normal pregnancies,
          depicting an overall scenario of excessive C activation and aberrant C regulation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38983853
      reference_title: 'Systematic review of the complement components as potential biomarkers of pre-eclampsia:
        pitfalls and opportunities.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that complement activation is a consistent finding in preeclampsia across
        41 studies, which is what makes the independence question worth asking rather than dismissing.
