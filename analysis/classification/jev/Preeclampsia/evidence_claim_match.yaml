              label: preeclampsia
        context: []
      assertion_type: Biochemical
      assertion:
        name: Elevated senescence-associated secretory phenotype factors
        presence: Elevated
        context: early predictive biomarker
        notes: 'Syncytiotrophoblast nuclei in early-onset preeclampsia carry senescent transcriptomic
          states with a senescence-associated secretory phenotype, and two of the secreted factors, PAI-1
          and activin A, are already raised in maternal blood in the first trimester, well before clinical
          diagnosis. This is curated as a measurement rather than as a mechanism node: the source establishes
          that placental senescence occurs and that its secreted markers are predictive, but not that
          SASP secretion causes the maternal syndrome.

          '
      selected_evidence:
        snippet: We verified the secreted senescence markers, PAI-1 (plasminogen activator inhibitor 1)
          and activin A, as identified in our single-nucleus RNA sequencing model as predictive markers
          before clinical preeclampsia diagnosis.
        supports: SUPPORT
