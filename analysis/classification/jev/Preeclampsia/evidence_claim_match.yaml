        description: 'Systemic pro-inflammatory cytokines from placental ischemia and NLRP3 inflammasome
          activation (TNF-α, IL-6, IL-1β, IL-17, IFN-γ) stimulate tissue factor expression on endothelial
          cells and monocytes, triggering the extrinsic coagulation cascade. Impaired anticoagulant pathways
          (reduced protein C, antithrombin) and suppression of fibrinolysis (elevated plasminogen activator
          inhibitor-1) hold the resulting thrombin generation and fibrin deposition unopposed. This is
          the initiating limb of immunothrombosis - the bidirectional interaction in which inflammatory
          activation promotes thrombosis and thrombotic processes amplify inflammation. Conformance to
          the thrombogenesis module is supported here because the cited review describes an explicit tissue
          factor to thrombin to fibrin branch rather than the TTP-type microangiopathy the module''s scope
          note excludes.

          '
