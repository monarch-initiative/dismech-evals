      assertion:
        discussion_id: preeclampsia_gdf15_pathogenic_or_compensatory_gap
        prompt: Is circulating GDF-15 elevation in preeclampsia a pathogenic driver of the disease, or
          a compensatory response to placental stress?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Placental Anti-Angiogenic Factor Release
        - pathophysiology#Maternal Endothelial Dysfunction
        rationale: GDF-15 is highly expressed in the placenta and rises in the maternal circulation through
          gestation, and it is elevated in affected women, particularly in early-onset disease. Whether
          that elevation drives the placental and endothelial injury or reflects an adaptive response
          to it determines whether GDF-15 belongs in this entry as a pathophysiology node or only as a
          biomarker, and how it relates to the angiogenic pathway already modelled here.
        notes: Added for monarch-initiative/dismech issue 13414. The source is a review, so the quoted
          sentence is the review's own statement of an open question, not a primary finding. No node is
          added for GDF-15 until a primary study addresses the direction of the association.
      selected_evidence:
        snippet: key unresolved questions are identified, including whether GDF-15 elevation is pathogenic
          or compensatory
        supports: SUPPORT
