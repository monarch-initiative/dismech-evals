        exposure_term:
          preferred_term: exposure to bisphenol A
          term:
            id: ECTO:9000057
            label: exposure to bisphenol A
        description: Bisphenol A, the polycarbonate and epoxy-resin monomer that shares a source pathway
          with phthalates, showed a comparable association with preeclampsia onset in the same cohort.
          It is curated as a distinct exposure because the two chemicals have different sources and different
          modes of action, and because BPA's obstetric evidence base is inconsistent across endpoints
          - the analogous meta-analysis for gestational diabetes is null. No mechanism exists at the level
          of the angiogenic factors that define the maternal syndrome, and that is where its single edge
          is drawn.
      selected_evidence:
        snippet: 'an interquartile range increase of urinary concentrations of BPA (1.53; 95% CI: 1.04,
          2.25) and MEP (monoethyl phthalate) (1.72; 95% CI: 1.28, 2.30) at 10 weeks gestation was associated
          with onset of preeclampsia'
        supports: SUPPORT
