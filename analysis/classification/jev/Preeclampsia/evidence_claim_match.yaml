        description: 'The ischemic placenta releases excess anti-angiogenic factors, primarily soluble
          fms-like tyrosine kinase 1 (sFlt-1) and soluble endoglin (sEng), into the maternal circulation.
          sFlt-1 acts as a decoy receptor that sequesters VEGF and PlGF, while sEng inhibits TGF-beta
          signaling. Together, these factors create a systemic anti-angiogenic state that disrupts normal
          endothelial function. Levels of sFlt-1 rise and PlGF fall weeks before clinical onset.

          '
