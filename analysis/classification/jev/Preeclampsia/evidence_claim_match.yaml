  2fe5738f64118f6c4f0cc99d1b39b15882c8d14c6dbd488358634052df67840a:
    claim:
      about:
        disease:
          name: Preeclampsia
          disease_term:
            preferred_term: preeclampsia
            term:
              id: MONDO:0005081
              label: preeclampsia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: preeclampsia_sflt1_removal_interventional_gap
        prompt: Does removing circulating sFlt-1 improve early-onset preeclampsia because sFlt-1 was removed,
          or do the apheresis modalities that prolong pregnancy work through something else?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Placental Anti-Angiogenic Factor Release
        - pathophysiology#Maternal Endothelial Dysfunction
        - mechanistic_hypotheses#early_onset_placenta_dominant
        rationale: Interventional reversibility is the strongest argument that sFlt-1 excess is causal
          rather than reactive, and it is the argument this entry's canonical hypothesis leans on hardest.
          The evidence for it is thinner than it is usually presented. One pilot series of eight women
          showed that dextran sulfate cellulose apheresis lowers sFlt-1 dose-dependently, reduces proteinuria,
          stabilises blood pressure, and prolongs pregnancy by 15 to 23 days, but it is uncontrolled and
          its own authors call for further studies. The second apheresis study, using heparin-mediated
          extracorporeal LDL precipitation, prolonged pregnancy against historic controls yet did not
          lower sFlt-1 below baseline and left the sFlt-1/PlGF ratio unaffected, so its authors concluded
          that lipid lowering or undefined factors mattered more than sFlt-1 reduction. Read together,
          the two studies establish that apheresis helps and leave open whether sFlt-1 removal is why.
          No Phase III trial of a targeted sFlt-1 reduction has been completed. This matters for the entry
          because it sets how much causal weight the antiangiogenic node can carry, and because a therapy
          chosen on the strength of the wrong mechanism would be optimised against the wrong endpoint.
        notes: Recorded from the 2026 assessment of the OpenScientist hypothesis report in kb/hypotheses/Preeclampsia/early_onset_placenta_dominant/.
          The report cited both apheresis studies as convergent support for sFlt-1 removal and stated
          that a systematic search found no failed sFlt-1-targeted therapy trials; the second of its own
          citations is the counterexample.
        proposed_experiments:
        - experiment_id: preeclampsia_targeted_sflt1_reduction_rct
          experiment_design: INTERVENTIONAL_TRIAL
          name: Randomised trial of a selective sFlt-1-lowering intervention with paired angiogenic and
            lipid monitoring
          description: 'Randomise women with early-onset preeclampsia and a high sFlt-1/PlGF ratio to
            a selective sFlt-1-lowering intervention or to standard care, with time from randomisation
            to delivery as the primary outcome. The discriminating feature is the monitoring, not the
            endpoint: measure sFlt-1, free PlGF, the ratio, and the lipid fractions that the heparin-mediated
            apheresis study implicated, so that any prolongation can be attributed to the analyte that
            actually moved. A trial that reports only the clinical outcome would reproduce the present
            ambiguity.'
          would_support:
          - pathophysiology#Placental Anti-Angiogenic Factor Release
          - mechanistic_hypotheses#early_onset_placenta_dominant
          supporting_outcome:
          - Pregnancy prolongation that tracks the fall in circulating sFlt-1 and in the sFlt-1/PlGF ratio,
            without a comparable change in the lipid fractions.
          refuting_outcome:
          - Prolongation without a sustained fall in sFlt-1, or prolongation that tracks lipid change
            instead, which would place the benefit of apheresis outside the antiangiogenic mechanism this
            entry models.
      selected_evidence:
        snippet: Dextran sulfate apheresis lowered circulating sFlt-1, reduced proteinuria, and stabilized
          blood pressure without apparent adverse events to mother and fetus.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21810665
      reference_title: Pilot study of extracorporeal removal of soluble fms-like tyrosine kinase 1 in
        preeclampsia.
      evidence_source: HUMAN_CLINICAL
      explanation: The positive half of the interventional argument, in which the analyte fell and the
        syndrome improved together.
