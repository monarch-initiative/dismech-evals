    claim:
      about:
        disease:
          name: Preeclampsia
          disease_term:
            preferred_term: preeclampsia
            term:
              id: MONDO:0005081
              label: preeclampsia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: preeclampsia_microplastic_human_evidence_gap
        prompt: Does micro- and nanoplastic exposure contribute to human preeclampsia, or is the HIF-1alpha/TFRC
          trophoblast ferroptosis mechanism a property of the rat model that produced it?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Defective Trophoblast Invasion and Spiral Artery Remodeling
        - environmental#Micro- and nanoplastic particle exposure
        rationale: 'Every element of the microplastic-preeclampsia claim except the human endpoint is
          in place. Plastic particles are demonstrably present in human placental tissue; a rodent model
          reproduces the maternal syndrome and names an interventionally supported trophoblast mechanism.
          What no study has done is relate measured placental or maternal plastic burden to preeclampsia
          in people, and a 2024 systematic review found the human outcome literature essentially empty.
          The exposure is therefore modelled here with an explicit species caveat rather than as an established
          contributor. Note the two entries for plastic-derived chemistry in this file sit on opposite
          footings: the phthalate and bisphenol A entries have human risk estimates but no mechanism,
          while this one has a mechanism but no human endpoint. Neither gap is filled by the other.'
        proposed_experiments:
        - experiment_id: preeclampsia_placental_polymer_burden_case_control
          name: Placental polymer burden and ferroptosis markers in preeclamptic versus normotensive placentas
          description: Quantify polymer burden by pyrolysis GC-MS in placentas from preeclamptic and normotensive
            pregnancies matched for gestational age and delivery mode, paired with the TFRC, iron-handling
            and lipid-peroxidation readouts the rat model identifies. Matching on gestational age matters
            because preeclamptic delivery is earlier, and burden may simply track exposure duration.
          would_support:
          - pathophysiology#Defective Trophoblast Invasion and Spiral Artery Remodeling
          supporting_outcome:
          - Higher polymer burden in preeclamptic placentas, accompanied by the predicted TFRC and lipid-peroxidation
            shift, in gestational-age-matched comparisons.
          refuting_outcome:
          - No burden difference after matching, or a burden difference without the predicted ferroptotic
            markers, which would place the rat mechanism outside human disease.
      selected_evidence:
        snippet: Cell culture and animal studies have demonstrated potential reproductive toxicity of
          these particles; however, their association with adverse fertility or pregnancy outcomes in
          humans is not known.
        supports: SUPPORT
