            label: PSG2
        biological_processes:
        - preferred_term: transforming growth factor beta receptor signaling pathway
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
        - preferred_term: SMAD protein signal transduction
          term:
            id: GO:0060395
            label: SMAD protein signal transduction
          modifier: INCREASED
      selected_evidence:
        snippet: Highly expressed PSG2 in PE placentas contributes to PE pathogenesis by activating the
          TGF-β/Smad3 pathway, thereby inhibiting EMT and MMPs expression and attenuating trophoblast
          proliferation, migration, and invasion.
