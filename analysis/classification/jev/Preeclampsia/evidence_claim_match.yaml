        description: 'Activated platelets release pro-inflammatory mediators that amplify endothelial
          activation and leukocyte recruitment. Neutrophil extracellular traps provide a structural scaffold
          that enhances platelet aggregation and fibrin deposition, while circulating extracellular vesicles
          carry tissue factor and inflammatory cytokines to distant vascular sites. Together these make
          the process self-perpetuating rather than self-limiting, which is what distinguishes immunothrombosis
          from ordinary hemostasis.

          '
