            name: NLRP3 Inflammasome Activation and Inflammatory Cascade
            description: 'Dysregulated NOD-like receptor (NLR) signaling, particularly NLRP3 inflammasome
              activation, contributes to placental and systemic inflammation in preeclampsia. Placental
              stress from ischemia and poor trophoblast invasion triggers pattern recognition receptors
              that activate the NLRP3 inflammasome complex (NLRP3, ASC, and pro-caspase-1). Active caspase-1
              processes pro-IL-1β and pro-IL-18 into their mature, secreted forms, driving excessive IL-1β
              and IL-18 release from placental macrophages, trophoblasts, and maternal immune cells. This
              inflammasome-mediated inflammatory cascade amplifies oxidative stress, endothelial dysfunction,
              and systemic inflammation, contributing to hypertension and multi-organ involvement in preeclampsia.

              '
