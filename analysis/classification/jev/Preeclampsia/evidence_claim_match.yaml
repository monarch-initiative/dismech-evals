          name: Preeclampsia
          disease_term:
            preferred_term: preeclampsia
            term:
              id: MONDO:0005081
              label: preeclampsia
        context: []
      assertion_type: Biochemical
      assertion:
        name: Elevated sFlt-1/PlGF ratio
        presence: Elevated
        context: diagnostic biomarker
        notes: 'The ratio of circulating sFlt-1 to free PlGF is the form in which the angiogenic imbalance
          is measured clinically, and it behaves differently from either analyte alone: it is far better
          at excluding preeclampsia than at predicting it. At a cutoff of 38, the negative predictive
          value for ruling out preeclampsia within one week is about 99%, while the positive predictive
          value for ruling it in within four weeks is only about 30%, so a low ratio is informative and
          a high ratio mostly identifies a group worth watching. Within established preeclampsia the ratio
          also tracks with which organ system is involved, being highest in renal-dominant disease, though
          that gradient comes from one retrospective cohort and discriminates the renal phenotype only
          moderately.

          '
      selected_evidence:
        snippet: An sFlt-1/PlGF ratio of ≤38 had a negative predictive value of 98.6% (95% CI, 97.2%-99.4%)
          for ruling out preeclampsia within 1 week, with 76.5% sensitivity and 82.1% specificity.
        supports: SUPPORT
