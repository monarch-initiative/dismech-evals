              id: MONDO:0005081
              label: preeclampsia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NLRP3 Inflammasome Activation and Inflammatory Cascade
        description: 'Dysregulated NOD-like receptor (NLR) signaling, particularly NLRP3 inflammasome
          activation, contributes to placental and systemic inflammation in preeclampsia. Placental stress
          from ischemia and poor trophoblast invasion triggers pattern recognition receptors that activate
          the NLRP3 inflammasome complex (NLRP3, ASC, and pro-caspase-1). Active caspase-1 processes pro-IL-1β
          and pro-IL-18 into their mature, secreted forms, driving excessive IL-1β and IL-18 release from
          placental macrophages, trophoblasts, and maternal immune cells. This inflammasome-mediated inflammatory
          cascade amplifies oxidative stress, endothelial dysfunction, and systemic inflammation, contributing
          to hypertension and multi-organ involvement in preeclampsia.

          '
        cell_types:
        - preferred_term: placental macrophage
          term:
            id: CL:0000235
            label: macrophage
        - preferred_term: extravillous trophoblast
          term:
            id: CL:0008036
            label: extravillous trophoblast
        - preferred_term: blood vessel endothelial cell
          term:
            id: CL:0000071
            label: blood vessel endothelial cell
        biological_processes:
        - preferred_term: NLRP3 inflammasome complex assembly
          term:
            id: GO:0044546
            label: NLRP3 inflammasome complex assembly
          modifier: INCREASED
        - preferred_term: interleukin-1 beta production
          term:
            id: GO:0032611
            label: interleukin-1 beta production
          modifier: INCREASED
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
      selected_evidence:
        snippet: This review synthesizes the most recent data on NLRs in PE, focusing on their role in
          disease genesis, pathogenic processes, biomarker potential, and therapeutic consequences.
        supports: SUPPORT
