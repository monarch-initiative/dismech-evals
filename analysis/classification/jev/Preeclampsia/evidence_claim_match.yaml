        association is with *higher* MMP1 and MMP2, whereas this entry models defective trophoblast invasion
        as MMP2/MMP9 *suppression* (the PSG2 node). Whether a systemic rise in circulating metalloproteinases
        is compatible with local suppression at the invading trophoblast front is not addressed by either
        source.'
