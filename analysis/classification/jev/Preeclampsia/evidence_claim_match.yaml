        description: 'Phthalate plasticisers are detected in the urine of nearly all pregnant women, and
          higher gestational concentrations track with a higher rate of preeclampsia. What the human data
          do not supply is a step: the association is with onset of the syndrome, not with any measured
          placental or endothelial intermediate, and the strongest series is a nested case-control sample
          of 50 cases drawn from a preterm-birth study rather than a preeclampsia cohort. A candidate
          mediator exists - phthalate metabolites track with circulating matrix metalloproteinases, the
          enzymes that execute spiral artery remodeling - but that was measured in a different cohort
          with no preeclampsia endpoint, so it supports plausibility rather than the chain.'
      selected_evidence:
        snippet: Urinary concentrations of BPA and several phthalate metabolites were significantly associated
          with increased risk of preeclampsia.
        supports: SUPPORT
