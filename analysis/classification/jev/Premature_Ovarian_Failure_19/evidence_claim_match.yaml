      assertion_type: Pathophysiology
      assertion:
        name: HSF2BP Partial Loss of Function
        description: The disease alleles reduce HSF2BP function without abolishing it. p.Ser167Leu lowers
          the protein level of HSF2BP and of its stabilizing partner BRME1, and p.Cys128Arg and p.Leu186Pro
          reduce its nuclear localization. HSF2BP binds a conserved region of BRCA2 between the BRC repeats
          and the DNA-binding domain, and the HSF2BP-BRME1 complex brings BRCA2 to meiotic double-strand
          breaks.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: HSF2BP
          term:
            id: hgnc:5226
            label: HSF2BP
        molecular_functions:
        - preferred_term: BRCA2 binding
          term:
            id: GO:0005515
            label: protein binding
          modifier: DECREASED
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
        notes: Protein binding is the only molecular function GO annotates HSF2BP with (IPI, including
          PMID:31242413); GO has no BRCA2-binding term, so the partner is named in preferred_term. The
          modifier reflects less HSF2BP protein available to bind, not a measured loss of binding affinity.
      selected_evidence:
        snippet: The S167L human recessive POI variant behave as a hypomorphic allele in mice, which results
          in a reduction of the protein expression/stability of itself and of its partner BRME1 in vivo
          and in transfected cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
