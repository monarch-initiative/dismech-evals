      assertion:
        name: HSF2BP
        gene_term:
          preferred_term: HSF2BP
          term:
            id: hgnc:5226
            label: HSF2BP
        association: Causal
        relationship_type: CAUSATIVE
        notes: 'Three homozygous missense variants are reported (NM_007031.2): c.500C>T p.Ser167Leu, c.382T>C
          p.Cys128Arg and c.557T>C p.Leu186Pro. Six other HSF2BP variants found in the same sporadic cohort
          were not biallelic and were not reported as causal.'
        variants:
        - name: p.Ser167Leu
          description: c.500C>T (rs200655253), homozygous in three sisters of Israeli Arab origin born
            to first-cousin parents. Very rare in gnomAD and never seen homozygous in public databases.
            A knock-in mouse shows it is a hypomorphic allele that lowers HSF2BP and BRME1 protein levels.
        - name: p.Cys128Arg
          description: 'c.382T>C, homozygous in a sporadic Chinese patient (POI-1) with amenorrhea at
            24. The source is internally inconsistent on ACMG class: its text calls both of its variants
            VUS, while its Table 1 lists them as likely pathogenic. The mutant protein is less nuclear
            in transfected cells.'
        - name: p.Leu186Pro
          description: c.557T>C, homozygous in a second sporadic Chinese patient (POI-2) whose irregular
            menses stopped in her late teens (at 18 in the text, 16 in Table 1). ACMG class is given as
            VUS in the text and likely pathogenic in Table 1. The mutant protein is less nuclear in transfected
            cells.
      selected_evidence:
        snippet: In this study, through the largest in-house WES database of 1,030 patients with sporadic
          POI, we identified two novel homozygous variations in HSF2BP (c.382T>C, p.C128R; c.557T>C, p.L186P).
        supports: SUPPORT
