              label: premature ovarian failure 20
        context: []
      assertion_type: Genetic
      assertion:
        name: MSH4
        gene_term:
          preferred_term: MSH4
          term:
            id: hgnc:7327
            label: MSH4
        association: Causal
        relationship_type: CAUSATIVE
        notes: Biallelic loss-of-function MSH4 variants. Reported alleles include a donor splice-site
          variant that skips exon 17 and deletes the Walker B motif (p.Ile743_Lys785del), the missense
          p.Ser754Leu in the MutS signature motif, the nonsense c.118C>T at residue 40, and the frameshift
          c.2220_2223del found in trans with p.Thr792Ala (PMID:36793102, which names it p.M740fs) or with
          the nonsense p.Arg910Ter. PMID:37620942 reports what appears to be the same four-base deletion
          as c.2222_2225delAAGA (p.Lys741Argfs*2), also with p.Thr792Ala; the two names are kept as the
          sources give them.
        variants:
        - name: Exon 17 donor splice-site variant (p.Ile743_Lys785del)
          description: Homozygous donor splice-site variant in a Colombian family; exon 17 skipping removes
            the Walker B motif of the ATPase domain.
        - name: p.Ser754Leu
          description: Homozygous missense in the MutS signature motif adjacent to the Walker B motif,
            found in a consanguineous Iranian family with both POI and NOA.
        - name: c.118C>T
          description: Homozygous nonsense variant creating a stop codon at residue 40, in an Iranian
            family with affected siblings of both sexes.
        - name: c.2220_2223del (p.M740fs) with p.T792A
          description: Compound heterozygous genotype in a woman with menarche at 19 and POI diagnosed
            at 31, with the two alleles inherited from different parents.
      selected_evidence:
        snippet: Our study describes the first MSH4 mutation associated with POI and increases the number
          of meiotic/DNA repair genes formally implicated as being responsible for this condition.
        supports: SUPPORT
    origin:
