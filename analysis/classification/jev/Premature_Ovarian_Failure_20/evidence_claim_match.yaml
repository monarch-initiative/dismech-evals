      assertion:
        name: Hormone replacement therapy
        description: There is no MSH4-directed therapy. As for other causes of POI, estrogen with progestogen
          replaces ovarian hormones to limit the bone, cardiovascular and other consequences of early
          estrogen loss; it does not restore fertility, for which donor oocytes are the usual option.
          The progestogen is bound as progesterone because the ChEBI progestogen class is a role term
          that the agent slot does not admit; other progestogens are equally used.
