        limitations: The mouse loses nearly all oocytes within days of birth and has no adult ovarian
          structure, whereas affected women usually have a spontaneous menarche and lose ovarian function
          in young adulthood. The authors describe this ovarian dysgenesis as specific to Msh4 and Msh5
          knockout mice.
        divergences:
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: Mouse oocytes are lost perinatally, so the model cannot show the years of residual
            ovarian function seen in women before POI.
      selected_evidence:
        snippet: Such ovarian dysgenesis after germ cell loss is specific to mice lacking MSH5 and MSH4,
          as other mutations that result in germ cell depletion do not give rise to such a severe alteration
          in ovarian development.
        supports: SUPPORT
