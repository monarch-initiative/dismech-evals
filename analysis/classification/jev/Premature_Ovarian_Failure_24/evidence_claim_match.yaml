      assertion:
        name: SYCP2L
        gene_term:
          preferred_term: SYCP2L
          term:
            id: hgnc:21537
            label: SYCP2L
        association: Causal
        relationship_type: CAUSATIVE
        notes: 'Two homozygous variants are reported on NM_001040274: c.150_151del p.Ser52Profs*7 and
          c.999A>G p.Ile333Met (PMID:32303603). A third homozygous nonsense variant was found in an Iranian
          family (PMID:38521400). Its nomenclature is not in the cached abstract and is not recorded here.
          No other rare SYCP2L variant was found in the remaining 108 patients of the 110-woman Chinese
          cohort.'
        variants:
        - name: p.Ser52Profs*7
          description: c.150_151del, homozygous in the proband of Chinese family P0001, born to first-cousin
            parents. The truncated protein was not detectable by western blot in transfected cells. The
            authors expect the transcript to undergo nonsense-mediated decay, and classify the variant
            as a complete loss of function.
        - name: p.Ile333Met
          description: c.999A>G, homozygous in the proband of Chinese family P0005, born to first-cousin
            parents. Isoleucine 333 is conserved from Xenopus to human. The mutant protein is stable but
            does not localize specifically to centromeres in transfected cells. MutationTaster called
            it a polymorphism, although the other prediction tools called it deleterious. The authors
            regard it as a partial loss of function.
      selected_evidence:
        snippet: 'We identified two homozygous variants (NM_001040274: c.150_151del (p.Ser52Profs*7),
          c.999A>G (p.Ile333Met)) in SYCP2L in two patients, which had co-segregated with POI in these
          families.'
        supports: SUPPORT
