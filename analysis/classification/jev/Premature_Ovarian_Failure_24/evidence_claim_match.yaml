        limitations: Knockout females stay fertile, with accelerated reproductive aging, while homozygous
          women lose ovarian function by about 30. The cached abstract does not report whether knockout
          females ever reach complete ovarian failure.
        divergences:
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: A full null in mice gives subfertility and early reproductive aging, not the ovarian
            insufficiency seen in women with the frameshift allele. So the mouse shows the direction of
            the follicle loss but not its clinical severity.
      selected_evidence:
        snippet: with aging, fewer oocytes undergo maturation in developing follicles
        supports: SUPPORT
