    claim:
      about:
        disease:
          name: Premature Ovarian Failure 24
          disease_term:
            preferred_term: premature ovarian failure 24
            term:
              id: MONDO:0970995
              label: premature ovarian failure 24
        context:
        - path: /pathophysiology/1
          value:
            name: Reduced Primordial Oocyte Survival
            description: 'Without SYCP2L, oocytes still form and enter the primordial pool, but the arrested
              dictyate oocytes are lost faster than normal as the female ages. SYCP2L acts late in prophase
              I: it joins the synaptonemal complex in late diplotene and stays on the centromeres of dictyate
              oocytes. No synapsis or recombination defect has been reported in Sycp2l-null oocytes. What
              the knockout shows is faster loss of the arrested pool, not the early prophase arrest seen
              with most meiotic POI genes. The cause of the faster loss is not known.'
            biological_scale: CELLULAR
            cell_types:
            - preferred_term: primordial oocyte
              term:
                id: CL:0000023
                label: oocyte
            notes: No apoptosis or checkpoint assay has been reported in Sycp2l-deficient oocytes. The
              node records the loss of oocytes, so no cell-death term is bound, and the node does not
              conform to the meiotic_prophase_failure checkpoint node. PMID:38521400 describes its Iranian
              SYCP2L nonsense variant as impacting synaptonemal complex assembly. Its abstract reports
              no synapsis assay, so this reads as a statement of the gene's general role, not a measured
              defect, and it is not recorded as a mechanism here.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Ovarian Follicle Depletion
        causal_link_type: DIRECT
      selected_evidence:
        snippet: the pool of primordial oocytes becomes more rapidly depleted in SYCP2L-deficient than
          in wild-type females, such that with aging, fewer oocytes undergo maturation in developing follicles
        supports: SUPPORT
