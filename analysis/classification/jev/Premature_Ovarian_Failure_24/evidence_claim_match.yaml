      assertion_type: Pathophysiology
      assertion:
        name: SYCP2L Loss of Function
        description: The disease alleles remove SYCP2L or stop it reaching the centromere. Wild-type SYCP2L
          localizes to centromeres, both in dictyate oocytes and when expressed in somatic cells. This
          localization needs the C-terminal part of the protein, which the truncating alleles lack.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: SYCP2L
          term:
            id: hgnc:21537
            label: SYCP2L
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        notes: GO records only cellular-component annotations for SYCP2L (centromeric region of a condensed
          chromosome, lateral element), and no molecular function, so none is bound here. The frameshift
          allele is a complete loss of function. The authors call the missense allele partial, which is
          recorded on the variant rather than here.
      selected_evidence:
        snippet: in vitro functional analysis showed that mutant SYCP2L proteins exhibited mislocalisation
          and loss of function
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
