            term:
              id: MONDO:1010182
              label: premenstrual dysphoric disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Abnormal Sensitivity to Cyclic Ovarian Steroids
        description: 'The proximate cause of PMDD is an abnormal central nervous system response to the
          normal luteal-phase fluctuation of ovarian steroids, not abnormal hormone levels. In the landmark
          NIMH experiment, suppressing ovarian function with the GnRH agonist leuprolide abolished symptoms
          in affected individuals, and adding back estradiol or progesterone reintroduced them, whereas
          unaffected individuals showed no mood change to the identical manipulation. This differential
          sensitivity is the unifying mechanistic frame for the disorder.

          '
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Response to Progesterone
          term:
            id: GO:0032570
            label: response to progesterone
        - preferred_term: Steroid Hormone Receptor Signaling
          term:
            id: GO:0043401
            label: steroid hormone receptor signaling pathway
      selected_evidence:
        snippet: In women with premenstrual syndrome, the occurrence of symptoms represents an abnormal
          response to normal hormonal changes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
