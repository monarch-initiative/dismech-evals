  b13a20367d5f7744493d889b2399067f0c49782e82d7e772446ec79372371a0d:
    claim:
      about:
        disease:
          name: Premenstrual Dysphoric Disorder
          disease_term:
            preferred_term: premenstrual dysphoric disorder
            term:
              id: MONDO:1010182
              label: premenstrual dysphoric disorder
        context: []
      assertion_type: AnimalModel
      assertion:
        name: BDNF Val66Met heterozygous mouse with ovariectomy and estradiol add-back
        species: Mouse
        genotype: Heterozygous for the BDNF Met66 allele (Het-Met), compared with matched wild-type mice.
          The engineering of the allele is not described in the abstract.
        genes:
        - preferred_term: BDNF
          term:
            id: hgnc:1033
            label: BDNF
        category: Genetic susceptibility model tested with ovariectomy and estradiol add-back
        publication: PMID:30356121
        description: Ovariectomized Het-Met mice and wild-type littermates were given 17beta-estradiol
          or vehicle in drinking water for six weeks. Estradiol produced anxiety-like and depression-like
          behaviour in Het-Met mice but not in wild-type mice, and estradiol-dependent gene expression
          in the ventral hippocampus differed between the genotypes. Comparing that hippocampal transcriptome
          with lymphoblastoid cell lines from women with and without PMDD identified shared genes, including
          modifiers of the ESC/E(Z) complex. Ovariectomy and estradiol add-back are procedures applied
          to the animals and are recorded in prose because AnimalModel has no slot for a non-genetic perturbation
          (#13768).
        associated_phenotypes:
        - Estradiol-induced anxiety-like behaviour in the open field, in Het-Met but not wild-type mice
        - Estradiol-induced depression-like behaviour in the splash test, in Het-Met but not wild-type
          mice
        - Genotype-dependent estradiol response of the ventral hippocampal transcriptome
        modeled_mechanisms:
        - target: Abnormal Sensitivity to Cyclic Ovarian Steroids
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: 'Reproduces the core of the node in outline: the same hormone exposure produces
            negative affect in one group of animals and not in another, with a genetic difference separating
            the two.'
          limitations: The node describes a mood response to the normal luteal-phase fluctuation of ovarian
            steroids. The model gives constant estradiol for six weeks after ovariectomy, so it tests
            sensitivity to estradiol, not to its fluctuation, and does not test progesterone. BDNF Val66Met
            is not an established PMDD risk variant, and the authors themselves attribute the overlap
            with PMDD to shared epigenetic factors rather than to the genotype.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Ovariectomized mice stand in for women with an intact menstrual cycle; the mouse
              oestrous cycle and its hormone profile differ from the human luteal phase.
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: Open-field and splash-test behaviour stand in for the irritability, low mood
              and anxiety that define PMDD symptoms.
          - divergence_type: TEMPORAL_SCOPE
            materiality: QUALIFYING
            description: Six weeks of continuous estradiol in drinking water stands in for the node's
              cyclic rise and fall of ovarian steroids across the luteal phase.
          readouts:
          - name: Anxiety-like and depression-like behaviour after estradiol add-back
            target: Abnormal Sensitivity to Cyclic Ovarian Steroids
            direction: INCREASED
            interpretation: Increased in Het-Met mice given estradiol; absent in wild-type mice given
              the same treatment.
        - target: ESC/E(Z) Epigenetic Dysregulation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: TISSUE
          description: The ventral hippocampal transcriptome shares genes with the PMDD lymphoblastoid
            transcriptome, including ESC/E(Z) complex modifiers. This is the only evidence in the entry
            that the ESC/E(Z) signal found in peripheral cells has any counterpart in brain tissue.
          limitations: The overlap comes from a cross-species comparison of gene lists. The abstract does
            not give the direction of change for the shared genes or show that ESC/E(Z) complex activity
            is altered in the mouse brain, and it is not human brain.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Mouse ventral hippocampus stands in for human corticolimbic tissue, where ESC/E(Z)
              expression in PMDD has not been measured.
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: Shared differentially expressed genes stand in for altered ESC/E(Z) gene-silencing
              function, which the comparison does not measure.
          readouts:
          - name: ESC/E(Z) complex modifier genes among cross-species shared transcripts
            target: ESC/E(Z) Epigenetic Dysregulation
            direction: ALTERED
            interpretation: ESC/E(Z) modifiers are among the genes shared between the estradiol response
              in mouse ventral hippocampus and the PMDD lymphoblastoid transcriptome; the direction is
              not given in the abstract.
        notes: genes records the human gene, by KB convention (#11140). The same paper supports the BDNF
          row in genetic. The paper's own conclusion is that the BDNF genotype intersects PMDD traits
          but that the similarities reflect epigenetic mechanisms of ovarian-steroid action, so the model
          is better read as a probe of steroid sensitivity than as evidence that BDNF Val66Met confers
          PMDD risk.
      selected_evidence:
        snippet: Ovariectomized mice heterozygous for the BDNF Met allele (Het-Met) and their matched
          wild-type (WT) mice were administered estradiol or vehicle in drinking water for 6 weeks.
        supports: SUPPORT
        directness: DIRECT
