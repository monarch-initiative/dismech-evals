            term:
              id: MONDO:1010182
              label: premenstrual dysphoric disorder
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Bipolar Disorder
        description: 'People with bipolar disorder frequently experience premenstrual mood worsening,
          which can be confused with or co-occur with PMDD. Distinguishing the two is clinically important
          because the first-line PMDD treatment (SSRIs) can provoke treatment-emergent manic symptoms
          in bipolar disorder.

          '
        distinguishing_features:
        - Bipolar mood episodes are not confined to the luteal phase and do not fully remit after menses,
          unlike PMDD.
        - SSRIs, first-line for PMDD, carry a risk of treatment-emergent mania in bipolar disorder, so
          the distinction changes management.
      selected_evidence:
        snippet: a substantial percentage of females with BD experience premenstrual mood worsening of
          varying degrees of severity
        supports: SUPPORT
