      assertion_type: DifferentialDiagnosis
      assertion:
        name: Premenstrual Exacerbation (PME) of an Underlying Disorder
        description: 'Premenstrual worsening of an underlying mood, anxiety, or personality disorder (e.g.,
          major depression, bipolar disorder, generalized anxiety). Unlike PMDD, symptoms persist through
          the follicular phase rather than fully remitting after menses; this is the key discriminator
          and the reason prospective charting is required.

          '
        distinguishing_features:
        - In PMDD symptoms remit after menses and the follicular phase is symptom-free; in PME the underlying
          disorder persists across the whole cycle.
      selected_evidence:
        snippet: the pattern of predictable symptom onset and offset with phases of the menstrual cycle
          remains a key feature distinguishing premenstrual dysphoric disorder from other cyclic mood
          disorders
        supports: SUPPORT
