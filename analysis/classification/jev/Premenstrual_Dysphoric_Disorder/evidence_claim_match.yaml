  1affbfec6ec090d9933c7a646a0f3f3253f2d1bb7cad3cd8f53d30edf0daa918:
    claim:
      about:
        disease:
          name: Premenstrual Dysphoric Disorder
          disease_term:
            preferred_term: premenstrual dysphoric disorder
            term:
              id: MONDO:1010182
              label: premenstrual dysphoric disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_pmdd_escez_brain_translation
        prompt: Does the intrinsic ESC/E(Z) epigenetic dysregulation observed in patient-derived lymphoblastoid
          cell lines causally drive the abnormal ovarian-steroid sensitivity of brain mood circuitry in
          PMDD, or is it a peripheral correlate without a direct role in the central pathophysiology?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#ESC/E(Z) Epigenetic Dysregulation
        - pathophysiology#Abnormal Sensitivity to Cyclic Ovarian Steroids
        - experimental_models#PMDD patient lymphoblastoid cell lines
        - animal_models#BDNF Val66Met heterozygous mouse with ovariectomy and estradiol add-back
        rationale: The ESC/E(Z) finding is the strongest molecular lead for the heritable steroid-sensitivity
          trait, but it was discovered in peripheral lymphoblastoid cells. Whether the same epigenetic
          difference operates in the corticolimbic neurons that generate mood symptoms, and whether it
          mechanistically sets the GABA-A/allopregnanolone sensitivity defect, is unknown. Resolving this
          would determine whether ESC/E(Z) is a tractable central target or a biomarker.
      selected_evidence:
        snippet: These findings demonstrate that LCLs from women with PMDD manifest a cellular difference
          in ESC/E(Z) complex function both in the untreated condition and in response to ovarian hormones.
        supports: SUPPORT
