  668f17ec27d0c2910515cd73fef6c20daa871db7f41c6ce8ba30d65efad43975:
    claim:
      about:
        disease:
          name: Premenstrual Dysphoric Disorder
          disease_term:
            preferred_term: premenstrual dysphoric disorder
            term:
              id: MONDO:1010182
              label: premenstrual dysphoric disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Allopregnanolone-GABA-A Receptor Sensitivity
        description: 'Allopregnanolone (ALLO), a neuroactive metabolite of progesterone, is a potent positive
          allosteric modulator of the GABA-A receptor, the major inhibitory ionotropic receptor in the
          brain. In PMDD, the GABA-A receptor''s adaptation to the cyclical swing in allopregnanolone
          is impaired. A rapid decrease in ALLO reduces GABA-A receptor sensitivity and chloride influx,
          weakening GABAergic inhibition of pyramidal neurons and increasing their excitability, which
          is proposed to drive the negative-affect symptoms of the disorder.

          '
        cell_types:
        - preferred_term: GABAergic Neuron
          term:
            id: CL:0000617
            label: GABAergic neuron
        - preferred_term: Pyramidal Neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        biological_processes:
        - preferred_term: GABA-A Receptor Signaling
          term:
            id: GO:0007214
            label: gamma-aminobutyric acid signaling pathway
        - preferred_term: Chloride Transmembrane Transport
          term:
            id: GO:1902476
            label: chloride transmembrane transport
        cellular_components:
        - preferred_term: GABA-A Receptor (Chloride Channel Complex)
          term:
            id: GO:0034707
            label: chloride channel complex
      selected_evidence:
        snippet: A rapid decrease in ALLO reduces the sensitivity of GABAA receptor, and reduces the chloride
          influx, hindered the inhibitory effect of GABAergic neurons on pyramidal neurons, and then increased
          the excitability of pyramidal neurons, resulting in PMDD-like behavior.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36937732
      reference_title: 'Role of allopregnanolone-mediated γ-aminobutyric acid A receptor sensitivity in
        the pathogenesis of premenstrual dysphoric disorder: Toward precise targets for translational
        medicine and drug development.'
      evidence_source: OTHER
      explanation: Provides the mechanistic causal chain from allopregnanolone change through GABA-A/chloride
        signaling to pyramidal-neuron hyperexcitability.
