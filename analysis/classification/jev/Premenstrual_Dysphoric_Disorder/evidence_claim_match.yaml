      assertion_type: Diagnosis
      assertion:
        name: Prospective Daily Symptom Ratings
        description: 'Diagnosis requires prospective daily symptom ratings over at least two cycles (commonly
          with the Daily Record of Severity of Problems, DRSP); retrospective report is an unreliable
          predictor. The Carolina Premenstrual Assessment Scoring System (C-PASS) operationalizes the
          DSM-5 criteria for reliable diagnosis. DSM-5 requires at least five symptoms in the final luteal
          week, including at least one core affective symptom, with postmenstrual remission and clinically
          significant impairment. There is no diagnostic blood test, biomarker, or imaging study.

          '
      selected_evidence:
        snippet: valid diagnosis requires evaluation of prospective daily symptom ratings
        supports: SUPPORT
