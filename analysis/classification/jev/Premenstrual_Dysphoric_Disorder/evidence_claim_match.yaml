          term:
            id: UBERON:0009834
            label: dorsolateral prefrontal cortex
      selected_evidence:
        snippet: during the late luteal phase, women with PMDD had hypoactivation in right dorsolateral
          prefrontal cortex (dlPFC) during all conditions of the emotion-regulation task
        supports: SUPPORT
