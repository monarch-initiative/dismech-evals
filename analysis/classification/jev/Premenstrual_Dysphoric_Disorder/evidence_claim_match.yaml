            term:
              id: MONDO:1010182
              label: premenstrual dysphoric disorder
        context: []
      assertion_type: Genetic
      assertion:
        name: ESR1
        gene_term:
          preferred_term: ESR1
          term:
            id: hgnc:3467
            label: ESR1
        association: Risk Factor
        relationship_type: SUSCEPTIBILITY
        notes: Estrogen receptor alpha gene; intron-4 SNPs differ between cases and controls. This record
          is deliberately not wired to a pathophysiology node. The association is a case-control genotype
          finding in 91 patients and 56 controls, described by its authors as preliminary, and none of
          the records the searches below returned shows an ESR1 variant altering the neural response to
          ovarian steroids that the Abnormal Sensitivity to Cyclic Ovarian Steroids node describes. That
          node's own experiment implicates estradiol and progesterone alike, and it binds the generic
          steroid hormone receptor signaling pathway for that reason, so a receptor gene on it would name
          one receptor for a sensitivity the evidence does not resolve to one. A PubMed search for premenstrual
          dysphoric disorder with ESR1 or estrogen receptor alpha in the title or abstract returned eight
          records, all genotype-association or genotype-moderation studies of ESR1 polymorphisms (PMID:17599809,
          PMID:29146473 and others), none reporting a receptor-level mechanism. The same holds for the
          broader search on premenstrual syndrome, whose ESR1 records (PMID:33577472, PMID:32759446, PMID:25416214)
          are polymorphism associations. A gene-to-mechanism edge here would assert more than the literature
          supports.
      selected_evidence:
        snippet: Four SNPs in intron 4 of ESR1 showed significantly different genotype and allele distributions
          between patients and control subjects.
        supports: SUPPORT
