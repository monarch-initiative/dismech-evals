      assertion_type: Pathophysiology
      assertion:
        name: Serotonergic Involvement
        description: 'Serotonergic neurotransmission is implicated by the distinctive treatment response
          of PMDD: symptoms respond preferentially to serotonin reuptake inhibitors over noradrenergic
          agents, and the response occurs within days rather than the weeks required in major depression.
          The rapid, luteal-phase efficacy suggests a mechanism partly distinct from monoamine theories
          of depression, plausibly involving serotonergic modulation of neurosteroid synthesis.

          '
        cell_types:
        - preferred_term: Serotonergic Neuron
          term:
            id: CL:0000850
            label: serotonergic neuron
        biological_processes:
        - preferred_term: Serotonin Signaling
          term:
            id: GO:0007210
            label: serotonin receptor signaling pathway
      selected_evidence:
        snippet: symptom response is better with serotonin reuptake inhibitors (SRIs) than with noradrenergic
          agents
        supports: SUPPORT
