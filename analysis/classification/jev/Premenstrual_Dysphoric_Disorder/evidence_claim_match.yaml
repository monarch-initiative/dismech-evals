              id: MONDO:1010182
              label: premenstrual dysphoric disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ESC/E(Z) Epigenetic Dysregulation
        description: 'The strongest molecular lead for the heritable steroid-sensitivity trait is the
          ESC/E(Z) gene-silencing complex (a PRC2-related chromatin/histone-methylation complex that includes
          EZH2 and partners). Lymphoblastoid cell lines derived from people with PMDD show intrinsic dysregulation
          of ESC/E(Z) complex genes, both in untreated (steroid-free) conditions and in their transcriptional
          response to estradiol and progesterone, providing a cellular correlate of the abnormal hormone
          sensitivity.

          '
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Steroid Hormone Receptor Signaling
          term:
            id: GO:0043401
            label: steroid hormone receptor signaling pathway
      selected_evidence:
        snippet: over-expression of ESC/E(Z) complex genes (an ovarian steroid-regulated gene silencing
          complex) in untreated LCLs from women with PMDD
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
