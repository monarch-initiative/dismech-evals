  32a3aef498ded106563f0df233b51373e6dc43be13339605786874884c6d9ad1:
    claim:
      about:
        disease:
          name: Primary Aldosteronism
          disease_term:
            preferred_term: primary aldosteronism
            term:
              id: MONDO:0001422
              label: primary aldosteronism
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: 'Untreated primary aldosteronism carries a two- to three-fold excess of stroke, atrial
          fibrillation and heart failure over essential hypertension at matched blood pressure, and an
          excess of albuminuria and glomerular filtration decline. The burden is compounded by the diagnostic
          gap: the disease is markedly underdiagnosed, so most affected people accrue that excess risk
          while being treated as though they had essential hypertension. It is graded HIGH rather than
          VARIABLE because the excess risk is present in both the surgically curable and the medically
          managed subtypes, with no difference between them in the pooled analysis.

          '
      selected_evidence:
        snippet: Despite effective methods for diagnosing and treating PA, it remains markedly underdiagnosed
          and undertreated.
        supports: SUPPORT
