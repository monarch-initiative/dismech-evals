      assertion:
        name: Zona Glomerulosa Cell Depolarization and Calcium Entry
        description: 'Aberrant sodium influx, failed sodium and calcium extrusion, or a lowered activation
          threshold of CaV1.3 depolarize the glomerulosa cell membrane and open voltage-gated calcium
          channels. Sustained cytosolic calcium elevation is the convergence point at which every common
          driver class meets, and is the proximate signal for aldosterone synthesis and for proliferation.

          '
        biological_scale: CELLULAR
