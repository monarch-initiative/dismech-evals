  96921b432a03a2a1c4cbf9df01d56253e1839189e2ffd7e95b140a8624c62786:
    claim:
      about:
        disease:
          name: Primary Aldosteronism
          disease_term:
            preferred_term: primary aldosteronism
            term:
              id: MONDO:0001422
              label: primary aldosteronism
        context: []
      assertion_type: Phenotype
      assertion:
        category: Biochemical
        name: Hypokalemia
        description: 'Hypokalemia is NOT required for the diagnosis and is absent in most patients. Historically
          it was treated as a prerequisite for testing, which is a principal reason the disease is underdiagnosed.
          Series that screen systematically find hypokalemia in roughly 9-46% of confirmed cases, and
          normokalemic hypertension is the prevailing phenotype. When hypokalemia is present it is a marker
          of severity: among hypertensive patients with spontaneous potassium below 2.5 mmol/L, most have
          primary aldosteronism.

          No frequency band is asserted. The reported range spans roughly 9-46% across series, which straddles
          the OCCASIONAL (5-29%) and FREQUENT (30-79%) boundary, and the spread reflects how each cohort
          was ascertained rather than sampling error: series that screen every hypertensive patient report
          far less hypokalemia than referral series do. Choosing either band would assert a precision
          the literature does not support.

          '
        phenotype_term:
          preferred_term: Hypokalemia
          term:
            id: HP:0002900
            label: Hypokalemia
      selected_evidence:
        snippet: Hypokalemia was considered a prerequisite for pursuing diagnostic tests for PA.
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/5
      evidence_path: /phenotypes/5/evidence/0
