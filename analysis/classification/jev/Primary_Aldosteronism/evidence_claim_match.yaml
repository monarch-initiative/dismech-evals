              label: primary aldosteronism
        context: []
      assertion_type: Definition
      assertion:
        name: Scope of this entry
        definition_type: OTHER
        description: 'This entry curates primary aldosteronism as a single disease with one pathophysiology:
          renin-independent aldosterone secretion from the adrenal zona glomerulosa and the mineralocorticoid
          receptor overactivation that follows. The lateralization axis (aldosterone-producing adenoma,
          unilateral adrenal hyperplasia, bilateral idiopathic hyperaldosteronism) is modelled in has_subtypes
          because it determines surgical curability. The inherited forms (familial hyperaldosteronism
          types I-IV) are curated separately in kb/disorders/Familial_Hyperaldosteronism.yaml and kb/disorders/Familial_Hyperaldosteronism_Type_I.yaml
          and are deliberately not restated here; the germline channel mechanisms described there converge
          on the same glomerulosa depolarization and calcium entry step modelled in this entry.

          '
      selected_evidence:
        snippet: a primary adrenal disorder leading to excessive aldosterone production by one or both
          adrenal glands
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40658480
      reference_title: 'Primary Aldosteronism: An Endocrine Society Clinical Practice Guideline.'
      evidence_source: HUMAN_CLINICAL
      explanation: The guideline defines primary aldosteronism as one adrenal disorder that may involve
        either or both glands, which is the unified disease concept this entry curates.
