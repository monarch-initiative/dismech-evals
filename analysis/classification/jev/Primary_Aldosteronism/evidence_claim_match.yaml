      assertion_type: Diagnosis
      assertion:
        name: Confirmatory aldosterone suppression testing
        diagnosis_term:
          preferred_term: aldosterone suppression testing
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        measurements:
        - preferred_term: plasma aldosterone before the suppression manoeuvre
          term:
            id: LOINC:57581-1
            label: Aldosterone [Mass/volume] in Serum or Plasma --pre XXX challenge
        - preferred_term: plasma aldosterone after the suppression manoeuvre
          term:
            id: LOINC:57580-3
            label: Aldosterone [Mass/volume] in Serum or Plasma --post XXX challenge
        notes: 'The challenge-unspecified pre and post pair is bound because this row covers four alternative
          protocols and LOINC 2.83 names only one of them. Of the 73 aldosterone-component codes in that
          release, ten are qualified by a 25 milligram oral captopril challenge, and none is qualified
          by a saline infusion, by fludrocortisone, or by an oral sodium load; the release''s only fludrocortisone
          codes measure the drug''s own concentration, which is therapeutic drug monitoring rather than
          this test. Binding the captopril pair, LOINC:57582-9 and LOINC:57579-5, would narrow the row
          to one of its four protocols, so the substrate-unspecified pair is used instead. No reference
          range is bound: neither cited source states a post-suppression aldosterone cutoff.'
        description: 'Demonstration that aldosterone is not suppressed by sodium loading or volume expansion,
          using an oral sodium loading, saline infusion, fludrocortisone suppression, or captopril challenge
          protocol. The 2025 guideline restricts confirmatory testing to intermediate-probability cases
          rather than requiring it of everyone who screens positive.

          '
      selected_evidence:
        snippet: aldosterone suppression testing in situations when screening results indicate an intermediate
          probability for lateralizing PA and individualized decision making confirms a desire to pursue
          eligibility for surgical therapy
        supports: SUPPORT
