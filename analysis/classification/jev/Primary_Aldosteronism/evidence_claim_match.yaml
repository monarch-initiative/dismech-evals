        name: Mineralocorticoid Receptor Antagonist Therapy
        description: 'Spironolactone or eplerenone is the disease-specific medical therapy, used for bilateral
          disease and for patients who are not surgical candidates. Spironolactone is preferred on cost
          and availability, and lowers blood pressure more than eplerenone at the doses compared in a
          randomized trial, at the price of antiandrogenic effects. The dose should be titrated until
          renin is no longer suppressed: the excess cardiovascular risk in medically treated patients
          is concentrated in those whose renin stays suppressed.

          '
        therapeutic_modality: SMALL_MOLECULE
