        context: []
      assertion_type: Diagnosis
      assertion:
        name: Aldosterone-to-renin ratio screening
        diagnosis_term:
          preferred_term: aldosterone-to-renin ratio measurement
          term:
            id: NCIT:C124338
            label: Aldosterone to Renin Activity Ratio Measurement
        measurements:
        - preferred_term: aldosterone-to-renin ratio
          term:
            id: LOINC:30894-0
            label: Aldosterone/Renin [Ratio] in Plasma
        notes: 'The ratio itself is bound rather than its two component analytes, because the ratio is
          what this screening test reports and what the guideline threshold applies to. LOINC 2.83 gives
          the ratio in plasma and in serum or plasma; the plasma code is bound to match the specimen the
          guideline and this entry''s markers specify. The release also has two panels that order aldosterone
          with renin, differing in whether renin is measured as activity or as concentration, and neither
          is bound because this row does not fix that choice. No reference range is bound: neither cited
          guideline states a numeric ratio cutoff in the quoted recommendations.'
        description: 'Measurement of plasma aldosterone and renin with calculation of their ratio. The
          2025 Endocrine Society guideline extends this to all individuals with hypertension, replacing
          the earlier risk-stratified approach that reserved testing for resistant hypertension, hypokalemia,
          an adrenal incidentaloma, or a suggestive family history.

          '
      selected_evidence:
        snippet: We suggest that all individuals with hypertension be screened for PA by measuring aldosterone
          and renin and determining the aldosterone to renin ratio
        supports: SUPPORT
