            term:
              id: MONDO:0000290
              label: primary amebic meningoencephalitis
        context: []
      assertion_type: AgentLifeCycle
      assertion:
        description: Naegleria fowleri alternates among trophozoite, cyst, and transitory flagellate forms
          in the environment. Trophozoites are the only reproductive, feeding, and infective form; humans
          are incidental clinical hosts after nasal exposure, with no recognized insect vector or human
          carrier state.
        hosts:
        - preferred_term: Homo sapiens
          role: incidental clinical host
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        life_cycle_stages:
        - name: Trophozoite stage
          life_cycle_stage_term:
            preferred_term: trophozoite stage
            term:
              id: OPL:0000057
              label: trophozoite stage
          description: The motile, feeding trophozoite is the active environmental and host-entry form
            of N. fowleri and is the only stage documented to reproduce and cause infection.
        - name: Environmental cyst stage
          description: Dormant cysts allow N. fowleri to persist through hostile environmental conditions
            and reseed trophozoites when conditions become favorable.
        - name: Transitory flagellate stage
          description: N. fowleri can transform into a short-lived flagellate in water under non-nutritive
            conditions.
      selected_evidence:
        snippet: These ameba are unique from other protozoa in that they are free-living, have no known
          insect vector, do not result in a human carrier state, and are typically unassociated with poor
          sanitation.
        supports: SUPPORT
