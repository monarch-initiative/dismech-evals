        context: []
      assertion_type: Transmission
      assertion:
        name: Nasal exposure to warm fresh water
        description: PAM follows contaminated water entering the nose during swimming, diving, bathing,
          water sports, or nasal irrigation; trophozoites then attach to the nasal mucosa and enter the
          olfactory route to the brain.
      selected_evidence:
        snippet: Of the 247 cases with reported water activities thought to result in N. fowleri exposure,
          the most common activities were swimming/diving (58%), bathing (16%), water sports (eg, waterskiing,
          wakeboarding, jet skiing; 10%), and nasal irrigation (9%; Table 1).
        supports: SUPPORT
