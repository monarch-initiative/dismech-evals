          offers generic exposure to water and exposure to contaminated water terms, but no term for freshwater
          entering the nasal cavity during recreation, bathing, or nasal irrigation. The exposure is deliberately
          left unbound until ECTO has a more specific nasal-water exposure class.
      selected_evidence:
