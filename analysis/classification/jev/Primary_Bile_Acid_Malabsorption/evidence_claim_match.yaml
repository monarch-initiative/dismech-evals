              label: bile acid malabsorption, primary, 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Colonic Bile Acid Spillover and Diarrhoea
        biological_scale: ORGANISM
        description: Unabsorbed bile acids pass into the colon and watery diarrhoea follows from birth.
          The colonic secretagogue mechanism - bile acids driving water and electrolyte secretion through
          cAMP, TGR5 and aquaporin changes - is the standard textbook account, but neither citation on
          this node establishes it, so the node claims only the delivery and the diarrhoea and leaves
          the secretory mechanism to be evidenced by a curator who has a source for it. The rat pelvic-irradiation
          model, in which ileal Asbt is downregulated by radiation rather than by mutation, shows the
          same redistribution - ileal bile acids fall, colonic and faecal bile acids rise, diarrhoea follows
          - and is included here as convergent evidence for the mechanism from a different cause of the
          same transporter loss.
        locations:
        - preferred_term: colon
          term:
            id: UBERON:0001155
            label: colon
      selected_evidence:
        snippet: Primary bile acid malabsorption (PBAM) is an idiopathic intestinal disorder associated
          with congenital diarrhea, steatorrhea, interruption of the enterohepatic circulation of bile
          acids, and reduced plasma cholesterol levels.
        supports: SUPPORT
