            term:
              id: MONDO:0013214
              label: bile acid malabsorption, primary, 1
        context: []
      assertion_type: Treatment
      assertion:
        name: Bile Acid Sequestrant Therapy
        description: 'Cholestyramine and colesevelam are the standard therapy for bile acid diarrhoea.
          There is no controlled-trial evidence in the Mendelian form - the placebo-controlled colesevelam
          data come from the common acquired condition - but there is genotype-confirmed case evidence,
          and it points both ways depending on which arm of the disease dominates.

          In an infant with the diarrhoeal presentation, colestyramine resolved the diarrhoea and catch-up
          growth followed. In the patient whose presentation was fat-soluble vitamin deficiency with no
          diarrhoea, a sequestrant was tried on the strength of that first report and was discontinued
          for side effects with no effect on vitamin uptake.

          Both outcomes follow from the same mechanism. A sequestrant binds luminal bile acids, so it
          acts on the colonic spillover arm and does nothing for the contracted pool - which is why it
          helps the diarrhoea and not the vitamin malabsorption. The evidence below is deliberately not
          one-sided.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: cholestyramine
            term:
              id: NCIT:C28929
              label: Cholestyramine
      selected_evidence:
        snippet: Following the confirmation of a BAD diagnosis, colestyramine was administered in small
          doses of 0.5 g twice daily. Subsequently, the manifestation of diarrhea subsided.
        supports: SUPPORT
