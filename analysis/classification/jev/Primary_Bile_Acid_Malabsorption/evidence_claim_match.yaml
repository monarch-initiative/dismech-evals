  734f86e50f5f1f8283f971c351a85e788830e4f9e143cb87f28bd423e793df04:
    claim:
      about:
        disease:
          name: Primary Bile Acid Malabsorption
          disease_term:
            preferred_term: bile acid malabsorption, primary, 1
            term:
              id: MONDO:0013214
              label: bile acid malabsorption, primary, 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Contracted Bile Acid Pool
        biological_scale: ORGANISM
        description: 'Bile acids lost to the colon are not returned to the liver, so the circulating pool
          contracts. In the mouse this is quantified: faecal excretion rises 10- to 20-fold and the pool
          falls by 80% even though synthesis has increased, and the residue is selectively enriched in
          cholic acid. Pool contraction is an organism-level state while the compensatory synthetic response
          is a hepatocyte process, so they are separate nodes with the regulatory step that connects them
          modelled between them.'
      selected_evidence:
        snippet: In the Slc10a2-/- mice, fecal bile acid excretion was elevated 10- to 20-fold and was
          not further increased by feeding a bile acid binding resin. Despite increased bile acid synthesis,
          the bile acid pool size was decreased by 80% and selectively enriched in cholic acid in the
          Slc10a2-/- mice.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12819193
