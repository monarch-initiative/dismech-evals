      assertion_type: Pathophysiology
      assertion:
        name: Loss of ASBT Bile Acid Transport Function
        biological_scale: MOLECULAR
        description: 'Biallelic SLC10A2 variants abolish sodium-coupled bile acid uptake. The 1997 transfection
          work is unusually informative about how: the L243P and T262M mutant proteins were expressed
          normally and trafficked normally to the plasma membrane, yet transported no taurocholate. The
          lesion is therefore in transport function itself, not in protein folding, stability or membrane
          delivery, which is why it is modelled as a molecular functional defect rather than as a protein-loss
          node.'
        genes:
        - preferred_term: SLC10A2
          term:
            id: hgnc:10906
            label: SLC10A2
        molecular_functions:
