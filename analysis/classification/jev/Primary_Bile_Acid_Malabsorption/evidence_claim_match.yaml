      assertion_type: Discussion
      assertion:
        discussion_id: slc10a2_mouse_human_malabsorption_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Why does the Slc10a2-null mouse reproduce the bile acid transport defect almost completely
          while failing to reproduce the steatorrhoea and reduced plasma cholesterol that define the human
          disease?
        attaches_to:
        - pathophysiology#Steatorrhoea and Fat Malabsorption
        - pathophysiology#Reduced Plasma Cholesterol
        rationale: This is a mismatch of the kind worth recording structurally rather than as prose, because
          it changes what the model can be used to argue. The mouse loses 10- to 20-fold more bile acid
