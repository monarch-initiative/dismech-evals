          term:
            id: CL:1000334
            label: enterocyte of epithelium of small intestine
        locations:
        - preferred_term: ileum
          term:
            id: UBERON:0002116
            label: ileum
      selected_evidence:
        snippet: In transfected COS cells, the L243P, T262M, and double mutant (L243P/T262M) did not affect
