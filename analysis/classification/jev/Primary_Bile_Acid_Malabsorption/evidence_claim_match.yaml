  d741b1153d1c232fc50bddcee55a49475190576dd21778b9a2e522e8aa3c702a:
    claim:
      about:
        disease:
          name: Primary Bile Acid Malabsorption
          disease_term:
            preferred_term: bile acid malabsorption, primary, 1
            term:
              id: MONDO:0013214
              label: bile acid malabsorption, primary, 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of FXR-FGF19 Signalling from the Ileum
        biological_scale: CELLULAR
        description: 'The regulatory step that explains why synthesis rises, and the reason the pool and
          synthesis nodes needed separating. Bile acids taken up by ileal enterocytes normally activate
          the nuclear receptor FXR, which drives FGF19 production; FGF19 travels in the portal circulation
          to the hepatocyte and suppresses CYP7A1, the rate-limiting enzyme of bile acid synthesis. When
          ASBT cannot bring bile acids into the enterocyte, intracellular concentrations never rise, FXR
          is not activated, FGF19 output collapses, and CYP7A1 is released from inhibition. This is also
          why the two main diagnostic biomarkers work: low serum FGF19 reads the failed signal directly,
          and serum C4 is an intermediate of the CYP7A1 reaction that the signal would have suppressed.'
        cell_types:
        - preferred_term: terminal ileal enterocyte
          term:
            id: CL:1000334
            label: enterocyte of epithelium of small intestine
        biological_processes:
        - preferred_term: fibroblast growth factor receptor signaling pathway
          term:
            id: GO:0008543
            label: fibroblast growth factor receptor signaling pathway
          modifier: DECREASED
        genes:
        - preferred_term: NR1H4
          term:
            id: hgnc:7967
            label: NR1H4
        - preferred_term: FGF19
          term:
            id: hgnc:3675
            label: FGF19
      selected_evidence:
        snippet: In the ileocytes, BAs have an entero-hormonal role. Indeed, high BAs intracellular levels
          stimulate the production of fibroblast growth factor 19 (FGF19) acting on the nuclear Farnesoid
          X factor (FXR)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35683489
