        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Anti-Mitochondrial Antibody Response
        description: Autoantibodies against the E2 subunit of pyruvate dehydrogenase complex (PDC-E2)
          are highly specific for PBC. These antibodies may directly contribute to biliary epithelial
          cell damage through immune complex formation and complement activation. The origin and maintenance
          of AMA production involves complex interactions between genetic predisposition, environmental
          triggers, and dysregulated B- and T-cell responses.
        biological_processes:
        - preferred_term: Immunoglobulin Production
          term:
            id: GO:0002377
            label: immunoglobulin production
      selected_evidence:
        snippet: Primary biliary cholangitis (PBC) is an autoimmune hepatobiliary disease characterized
          by immune mediated destruction of the intrahepatic small bile ducts and the presence of antimitochondrial
          antibodies (AMAs). The mitochondrial autoantigens have been identified as the E2 subunits of
          the 2-oxo-acid dehydrogenase complex, including the E2 subunits of pyruvate dehydrogenase, branched-chain
          2-oxo acid dehydrogenase complex, oxoglutarate dehydrogenase complex, E3 binding protein and
          PDC E1 alpha subunit.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26953925
      reference_title: A contemporary perspective on the molecular characteristics of mitochondrial autoantigens
        and diagnosis in primary biliary cholangitis.
      explanation: This paper confirms that AMAs targeting PDC-E2 and related E2 subunits are characteristic
        of PBC and are associated with immune-mediated bile duct destruction.
