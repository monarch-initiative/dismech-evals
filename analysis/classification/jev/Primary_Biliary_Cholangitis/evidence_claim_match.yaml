        notes: Transplantation is not curative. PMID:32275981, a multicentre cohort of 780 transplanted
          PBC patients, reports that recurrence after liver transplantation is frequent and can impair
          graft and patient survival. In that same cohort, preventive post-transplant UDCA (10-15 mg/kg/day)
          reduced the risk of PBC recurrence (aHR 0.41), graft loss, and all-cause death. Both are post-transplant
          management findings rather than evidence bearing on the indication, which is why they sit here
          rather than in `evidence:`.
