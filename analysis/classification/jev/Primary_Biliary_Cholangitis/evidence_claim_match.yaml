        name: Progressive Ductopenia and Cholestasis
        conforms_to: cholestatic_liver_injury#Impaired Bile Formation and Secretion
        description: Destruction of bile ducts leads to ductopenia, impaired bile flow, and accumulation
          of toxic bile acids. Retained bile acids cause further hepatocyte damage and promote fibrosis.
        biological_processes:
        - preferred_term: Bile Acid Metabolic Process
          term:
            id: GO:0008206
            label: bile acid metabolic process
      selected_evidence:
        snippet: In recent years, several studies have shown that, in case of a change in gut bacterial
          homeostasis or impairment of intestinal barrier functions, cholangiocytes, which are the epithelial
          cells lining the bile ducts, activate innate immune responses against gut-derived microorganisms
          or bacterial products that reach the liver via enterohepatic circulation. Intestinal dysbiosis
          or impaired intestinal barrier functions cause cholangiocytes to be exposed to an increasing
          amount of microorganisms that can reactivate inflammatory responses, thus inducing the onset
          of liver fibrosis.
        supports: SUPPORT
