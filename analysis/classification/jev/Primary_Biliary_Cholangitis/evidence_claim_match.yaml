        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biliary Epithelial Cell Targeting
        description: CD4+ and CD8+ T cells infiltrate portal tracts and specifically target small bile
          duct epithelial cells. Aberrant PDC-E2 expression on apoptotic cholangiocytes may initiate the
          autoimmune response.
        cell_types:
        - preferred_term: Cholangiocyte
          term:
            id: CL:0002538
            label: intrahepatic cholangiocyte
        - preferred_term: CD8+ T Cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: T Cell Cytotoxicity
          term:
            id: GO:0001913
            label: T cell mediated cytotoxicity
      selected_evidence:
        snippet: In vitro cholangiocyte cytotoxicity assays demonstrated significantly increased numbers
          of cytotoxic hepatic dnTGFβRII KLRG1(+) CD8 cells compared to B6. Protection from disease by
          B6 Tregs was associated with elimination of hepatic dnTGFβRII CD8 mediated cholangiocyte cytotoxicity.
          These results emphasize that autoimmune cholangitis requires defects in both the T effector
          and regulatory compartments.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24556277
      reference_title: 'Murine autoimmune cholangitis requires two hits: cytotoxic KLRG1(+) CD8 effector
        cells and defective T regulatory cells.'
      evidence_source: MODEL_ORGANISM
      explanation: Cytotoxic CD8+ T cells directly target and destroy cholangiocytes in the dnTGFbetaRII
        mouse model of autoimmune cholangitis, supporting T cell-mediated cytotoxicity as the mechanism
        of bile duct epithelial cell destruction. The demonstration is in mice, so the human claim follows
        by extrapolation from the model.
