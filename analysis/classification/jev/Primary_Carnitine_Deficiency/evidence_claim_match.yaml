  7115b99dd3c1aa4e34e191108274803c08eaca1cc3c9cc3412dfba811ca16498:
    claim:
      about:
        disease:
          name: Primary Carnitine Deficiency
          disease_term:
            preferred_term: systemic primary carnitine deficiency disease
            term:
              id: MONDO:0008919
              label: systemic primary carnitine deficiency disease
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC22A5 (OCTN2) pathogenic variants
        gene_term:
          preferred_term: SLC22A5
          term:
            id: hgnc:10969
            label: SLC22A5
        inheritance:
        - name: Autosomal recessive
        variants:
        - name: SLC22A5 - c.1400C>G (p.Ser467Cys)
          description: 'The most common pathogenic variant in Chinese PCD patients, accounting for approximately
            45% of alleles. Regional variation exists with lower frequency in southern China.

            '
        - name: SLC22A5 - c.51C>G (p.Phe17Leu)
          description: 'Second most common variant in Chinese PCD, accounting for approximately 26% of
            alleles.

            '
        - name: SLC22A5 - c.760C>T (p.Arg254*)
          description: 'Nonsense variant accounting for approximately 14% of alleles in Chinese PCD. Homozygous
            c.760C>T carriers are more likely to present with cardiomyopathy.

            '
        - name: SLC22A5 - c.821G>A (p.Trp274Ter)
          description: 'Novel nonsense variant identified in an Iranian family, associated with hypertrophic
            cardiomyopathy. Docking analysis demonstrated reduced carnitine binding affinity.

            '
        features: 'Biallelic pathogenic variants in SLC22A5 abolish or severely reduce OCTN2-mediated
          carnitine transport. Common variants in Chinese cohorts include c.1400C>G, c.51C>G, and c.760C>T,
          with regional variation. Genotype-phenotype correlations exist, with homozygous c.760C>T and
          c.844C>T more likely to cause cardiomyopathy, while homozygous c.1400C>G tends toward asymptomatic
          presentation. Broader OCTN reviews note many additional missense variants of uncertain clinical
          significance.

          '
      selected_evidence:
        snippet: "A \nplethora of missense variants with uncertain clinical significance are reported\
          \ \nboth in the dbSNP and the Catalogue of Somatic Mutations in Cancer (COSMIC) \ndatabases\
          \ for both genes."
        supports: SUPPORT
    origin:
