      assertion:
        name: Genetic counseling
        description: 'Genetic counseling is essential for affected families, including discussion of autosomal
          recessive inheritance, 25% recurrence risk for each pregnancy, carrier testing for family members,
          and prenatal or preimplantation genetic testing options. NBS may also detect maternal PCD through
          low C0 in the infant.

          '
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: PCD is inherited in an autosomal recessive manner. If both parents are known to be heterozygous
          for an SLC22A5 pathogenic variant, each sib of an affected individual has at conception a 25%
          chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of
          being unaffected and not a carrier. Once the SLC22A5 pathogenic variants have been identified
          in an affected family member, molecular genetic carrier testing for at-risk relatives and prenatal/preimplantation
          genetic testing are possible.
        supports: SUPPORT
