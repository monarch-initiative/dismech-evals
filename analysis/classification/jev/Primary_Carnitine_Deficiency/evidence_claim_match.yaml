  550c35e4619a5ed1ebb0bc4429efa93e4d3443c4d6be20116c89d33c4ebd0db1:
    claim:
      about:
        disease:
          name: Primary Carnitine Deficiency
          disease_term:
            preferred_term: systemic primary carnitine deficiency disease
            term:
              id: MONDO:0008919
              label: systemic primary carnitine deficiency disease
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Newborn screening for low free carnitine
        description: Tandem mass spectrometry on the dried blood spot reports free carnitine (C0); a low
          C0 is the screening signal for primary carnitine deficiency. Programmes recall the newborn and
          the mother, because a low infant C0 is also the presentation of undiagnosed maternal disease,
          and several add a second-tier SLC22A5 genetic test to the low-C0 samples.
        diagnosis_term:
          preferred_term: newborn screening
          term:
            id: NCIT:C81178
            label: Newborn Screening
        measurements:
        - preferred_term: free carnitine (C0), DBS
          term:
            id: LOINC:38481-8
            label: Carnitine free (C0) [Moles/volume] in DBS
        - preferred_term: propionylcarnitine plus palmitoylcarnitine (C3+C16), DBS
          term:
            id: LOINC:75211-3
            label: Propionylcarnitine (C3)+Palmitoylcarnitine (C16) [Moles/volume] in DBS
        reference_ranges:
        - loinc_term:
            id: LOINC:38481-8
            label: Carnitine free (C0) [Moles/volume] in DBS
          unit: umol/L
          population: newborn screening, Quanzhou (Fujian, China) programme, March-December 2020
          notes: 'The programme states the rule as C0 "below 8.5 μmol/L", so exactly 8.5 is screen negative
            there, which the half-open band convention reproduces (the negative band is [8.5, ∞)). The
            direction is low: the abnormal tier is the open-below band. The same programme reported, for
            2021-2022, selecting neonates with C0 below 12 μmol/L for second-tier genetic screening, so
            the second-tier trigger moved while the disease itself did not; the 8.5 figure is recorded
            as the cited period''s value, not as a property of the analyte.'
          interpretation_bands:
          - name: Second-tier genetic testing triggered
            upper_bound: 8.5
            unit: umol/L
            abnormal_flag: LOW
            interpretation: In this programme a C0 below the cut-off sends the sample to second-tier SLC22A5
              genetic testing; a low C0 is not yet a diagnosis and is also produced by maternal primary
              carnitine deficiency.
          - name: Not selected for second-tier testing
            lower_bound: 8.5
            unit: umol/L
            abnormal_flag: NORMAL
        - loinc_term:
            id: LOINC:38481-8
            label: Carnitine free (C0) [Moles/volume] in DBS
          unit: umol/L
          population: newborn screening, Guangzhou (China) programme, 2015-2019
          notes: The programme defines a positive screen as C0 "less than 10 μmol/L with decreased acylcarnitine
            species", so exactly 10 is negative there, which the half-open band reproduces. The qualitative
            "decreased acylcarnitine species" condition is part of the rule and has no band of its own;
            the paper's retrospective proposal to quantify it as (C3+C16) below 2 μmol/L for samples with
            C0 between 8.5 and 9.9 μmol/L is a modelled refinement, not the programme's operating rule,
            and is therefore not recorded as a band on the C3+C16 code.
          interpretation_bands:
          - name: Screen positive
            upper_bound: 10.0
            unit: umol/L
            abnormal_flag: LOW
            interpretation: Positive only together with decreased acylcarnitine species on the same profile;
              recall of the newborn and the mother for a second dried blood spot.
          - name: Screen negative
            lower_bound: 10.0
            unit: umol/L
            abnormal_flag: NORMAL
        notes: Measurements bind the method-less quantitative DBS codes; the specimen is intrinsic to
          a newborn screen, so the DBS code is the test's identity here rather than a method-specific
          variant. C3+C16 is bound because the Guangzhou programme evaluated it as the quantitative form
          of its "decreased acylcarnitine species" condition; it carries no band for the reason given
          on the Guangzhou range. Cut-offs are programme-specific and the two cited programmes differ
          (8.5 and 10 μmol/L); neither is recorded as a universal threshold.
      selected_evidence:
        snippet: The diagnosis of PCD is established in a proband with consistent biochemical analyte
          findings and/or suggestive clinical and laboratory features by identification of biallelic pathogenic
          variants in SLC22A5 on molecular genetic testing. In individuals with suspected PCD and negative
          molecular testing, a carnitine transport assay using cultured skin fibroblasts may be available.
        supports: SUPPORT
