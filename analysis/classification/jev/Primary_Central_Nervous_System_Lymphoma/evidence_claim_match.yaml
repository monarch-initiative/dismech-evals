        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of EBV-Specific T-Cell Surveillance
        description: A separate route into the same tumour, and the reason this entry is not purely a
          story about MYD88. In HIV infection, transplant immunosuppression and congenital immunodeficiency,
          failure of EBV-specific T-cell control permits outgrowth of an EBV-transformed B-cell clone
          without the same dependence on the somatic driver mutations above. The resulting disease is
          EBV-positive and is regarded as biologically distinct from the sporadic immunocompetent form,
          while converging on the same infiltrative endpoint.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Younger age, SOT or autoimmune disease, and immunosuppressive treatment correlated highly
          with EBV-positivity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/10
      evidence_path: /pathophysiology/10/evidence/1
