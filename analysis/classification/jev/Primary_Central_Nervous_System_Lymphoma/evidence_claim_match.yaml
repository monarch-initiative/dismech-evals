  837319cf9c033d203726a799103d79bfdf05c6f82465dad8ca5eaaa61ea4ad52:
    claim:
      about:
        disease:
          name: Primary Central Nervous System Lymphoma
          disease_term:
            preferred_term: primary central nervous system lymphoma
            term:
              id: MONDO:0002571
              label: primary central nervous system lymphoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cns_tropism_unresolved
        kind: KNOWLEDGE_GAP
        prompt: Does the transforming B cell acquire its lesions inside the CNS, or transform systemically
          and then home there?
        attaches_to:
        - pathophysiology#Acquisition of MYD88 and CD79B Driver Mutations
        - pathophysiology#Perivascular Infiltration of CNS Parenchyma
        rationale: 'The disease is defined by a location whose origin is not established. Two accounts
          are current and are not mutually exclusive: that the clone is selected and retained in the CNS
          by chronic B-cell-receptor engagement with CNS self-proteins, or that transformation happens
          outside the CNS and the clone homes in afterwards via chemokine gradients. The clonal-evolution
          data complicate rather than settle it, because a common progenitor in a memory B-cell state
          implies a systemic reservoir while the immune-escape lesions that arise late look like adaptation
          to a compartment the tumour is already in. Until this is resolved, the entry''s chain deliberately
          does not commit to an anatomical location for the initiating lesion.'
      selected_evidence:
        snippet: Pathophysiology is incompletely understood, although a central role seems to comprise
          immunoglobulins binding to self-proteins expressed in the central nervous system (CNS) and alterations
          of genes involved in B cell receptor, Toll-like receptor and NF-κB signalling.
        supports: SUPPORT
