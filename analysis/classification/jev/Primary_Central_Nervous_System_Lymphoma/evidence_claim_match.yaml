  ac691b4d351ff32936856b75c041b1c9d550c367f1fc0f5be4ea243790682e48:
    claim:
      about:
        disease:
          name: Primary Central Nervous System Lymphoma
          disease_term:
            preferred_term: primary central nervous system lymphoma
            term:
              id: MONDO:0002571
              label: primary central nervous system lymphoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Acquisition of Immune-Escape Lesions
        description: The genetically distinctive arm of this disease, and the one that separates it from
          nodal DLBCL. Loss of the HLA locus at 6p21 by deletion or copy-neutral loss of heterozygosity,
          B2M mutation, and gain or rearrangement of the PD-L1/PD-L2 locus at 9p24.1 remove the tumour
          from both MHC-restricted recognition and T-cell effector function. Clonal-evolution analysis
          places these as late events, arising independently in primary and relapse samples rather than
          being inherited from the common progenitor.
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: SOMATIC
          functional_impact_category: LOSS_OF_FUNCTION
        cellular_components:
        - preferred_term: MHC class II protein complex
          modifier: DECREASED
          term:
            id: GO:0042613
            label: MHC class II protein complex
      selected_evidence:
        snippet: Genetic alterations in genes involved in immune escape (HLA, CD274/PDCD1LG2) were predominantly
          unique in primary and relapse samples and thus considered late genetic events.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
