        description: The convergence point. Continuous signalling through both receptors, with CARD11
          mutation and 3q12.3 gain driving NFKBIZ in a subset, holds canonical NF-kB transcriptionally
          active and sustains the survival and proliferation programme the tumour depends on. It is also
          the node the BTK inhibitors act on, which is why they work in a disease with no other targeted
          option.
