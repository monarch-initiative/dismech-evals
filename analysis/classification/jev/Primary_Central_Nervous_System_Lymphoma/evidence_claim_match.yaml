              label: primary central nervous system lymphoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Acquisition of MYD88 and CD79B Driver Mutations
        description: 'The initiating lesion, and an unusually stereotyped one. MYD88 L265P and CD79B ITAM
          mutations occur together in most cases, and clonal-evolution analysis of paired primary and
          relapse specimens places them, alongside TBL1XR1 mutation and BCL6 rearrangement, in a common
          progenitor cell that is held in a memory B-cell state before germinal-centre re-entry. This
          is the origin node: the transforming event is somatic, and the cell it happens in is bound as
          a memory B cell rather than as a generic B cell, because that is the state the cited clonal-evolution
          analysis places the common progenitor in. A single cell type is bound deliberately: binding
          both the generic and the specific term would make the cell-of-origin derivation report two origins,
          which would be an artefact of granularity rather than the genuine lump/split signal that report
          is for.'
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: SOMATIC
          functional_impact_category: GAIN_OF_FUNCTION
        cell_types:
        - preferred_term: memory-state common progenitor B cell
          term:
            id: CL:0000787
            label: memory B cell
      selected_evidence:
        snippet: Phylogenetic analysis of paired primary and relapsed specimens identified MYD88 mutation
          and CDKN2A loss as early clonal events.
        supports: SUPPORT
