              label: primary central nervous system lymphoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Somatic Hypermutation and CDKN2A Loss
        description: 'A parallel arm rather than a downstream consequence: off-target activation-induced
          cytidine deaminase activity mutates PIM1, BTG1, BTG2 and other loci, while CDKN2A is lost by
          9p21.3 deletion, mutation or promoter methylation. The result is loss of the p16INK4a/p14ARF
          brake on the cell cycle on top of the signalling lesions, and progressive genomic instability.'
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: SOMATIC
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The most common mutations were identified in IGLL5 (68%), PIM1 (63%), MYD88 (55%), CD79B
          (42%), BTG2 (39%), PCLO (39%), KMT2D (34%), and BTG1 (29%) genes.
        supports: SUPPORT
