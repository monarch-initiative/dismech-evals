      assertion_type: Genetic
      assertion:
        name: CARD11
        notes: 'Gain-of-function mutation activates NF-kB below the receptor, which makes it a route to
          the same output that does not depend on the receptor being engaged. That position is why it
          also confers resistance to BTK inhibition: the drug acts upstream of the lesion.

          Identifier note: the deep-research report for this entry gave hgnc:16412 for CARD11, which is
          NLRC4. The correct value used here was taken from the HGNC API.'
        gene_term:
          preferred_term: CARD11
          term:
            id: hgnc:16393
            label: CARD11
        relationship_type: CAUSATIVE
        variant_origin: SOMATIC
      selected_evidence:
        snippet: The only PCNSL with complete ibrutinib resistance harbored a mutation within the coiled-coil
          domain of CARD11, a known ibrutinib resistance mechanism.
        supports: SUPPORT
