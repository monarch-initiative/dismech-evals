              id: MONDO:0002571
              label: primary central nervous system lymphoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ligand-Independent BCR and Toll-Like Receptor Signaling
        description: MYD88 L265P allows the myddosome to assemble without receptor ligation, and mutation
          of the CD79B ITAM tyrosine removes the negative-feedback step that normally terminates B-cell
          receptor signalling. Both convert a transient, antigen-gated signal into a continuous one. This
          is a qualitative change in regulation rather than a quantitative increase, which is why the
          pathway modifiers here are GAIN_OF_FUNCTION rather than INCREASED.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: B cell receptor signaling pathway
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0050853
            label: B cell receptor signaling pathway
        - preferred_term: toll-like receptor signaling pathway
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0002224
            label: toll-like receptor signaling pathway
      selected_evidence:
        snippet: Pathophysiology is incompletely understood, although a central role seems to comprise
          immunoglobulins binding to self-proteins expressed in the central nervous system (CNS) and alterations
          of genes involved in B cell receptor, Toll-like receptor and NF-κB signalling.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37322012
      reference_title: Primary central nervous system lymphoma.
      evidence_source: OTHER
      explanation: Names the three pathways this node and the next sit on, and is candid that the overall
        mechanism is not fully worked out.
