        context: []
      assertion_type: Biochemical
      assertion:
        name: Cerebrospinal fluid interleukin-10
        notes: A diagnostic biomarker rather than a disease mechanism, and an unusually good one for a
          compartment that is hard to sample. Raised CSF IL-10 separates PCNSL from other CNS disease
          with high sensitivity and specificity, and the IL-10/IL-6 ratio improves the separation from
          CNS infection specifically. It also carries prognostic information, which a purely diagnostic
          marker would not.
      selected_evidence:
        snippet: Using a CSF IL-10 cutoff value of 8.2 pg/ml, the diagnostic sensitivity and specificity
          were 95.5% and 96.1%, respectively
        supports: SUPPORT
