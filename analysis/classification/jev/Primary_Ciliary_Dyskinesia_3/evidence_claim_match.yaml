              id: MONDO:0012085
              label: primary ciliary dyskinesia 3
        context: []
      assertion_type: Treatment
      assertion:
        name: Airway Clearance and Chronic Infection Management
        description: 'There is no treatment that restores ciliary function. Management is the supportive
          care used across primary ciliary dyskinesia: airway clearance, prompt treatment of respiratory
          infections, and macrolide prophylaxis, for which a randomized trial of azithromycin in PCD reduced
          pulmonary exacerbations. Nothing in it is specific to DNAH5.

          Curated as a single scoping entry rather than an itemised regimen, because no trial has enrolled
          by genotype and the umbrella Primary_Ciliary_Dyskinesia entry holds the detailed management
          block. What is DNAH5-specific is prognostic: lung function is on average better than in the
          CCDC39/CCDC40 class, which is curated on the bronchiectasis phenotype.'
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Though there are no PCD-specific approved therapies that restore ciliary function, routine
          airway clearance and aggressive management of infections are important to preserve lung health
          and minimize complications
        supports: SUPPORT
        directness: INDIRECT
