              label: ciliary dyskinesia, primary, 40
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Distal Type 2 Outer Dynein Arms
        biological_scale: CELLULAR
        role: central_effector
        description: DNAH9 is needed to assemble the distal outer dynein arms. Without it, DNAH5, DNAI1
          and DNAI2 are also missing from the distal cilium, while proximal DNAH11-containing arms remain.
        cell_types:
        - preferred_term: multiciliated respiratory epithelial cell
          term:
            id: CL:0005012
            label: multiciliated epithelial cell
        cellular_components:
        - preferred_term: outer dynein arm
          term:
            id: GO:0036157
            label: outer dynein arm
        biological_processes:
        - preferred_term: outer dynein arm assembly
          modifier: DECREASED
          term:
            id: GO:0036158
            label: outer dynein arm assembly
      selected_evidence:
        snippet: DNAH9-deficient cilia also lack other ODA components such as DNAH5, DNAI1, and DNAI2
          from the distal axonemal compartment, demonstrating an essential role of DNAH9 for distal axonemal
          assembly of ODAs type 2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
