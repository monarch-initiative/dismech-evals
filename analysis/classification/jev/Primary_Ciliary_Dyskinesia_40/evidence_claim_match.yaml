        context: []
      assertion_type: Treatment
      assertion:
        name: Airway Clearance and Chronic Infection Management
        description: 'There is no treatment that restores ciliary function. For patients with respiratory
          symptoms, management is the supportive care used across primary ciliary dyskinesia: airway clearance
          and prompt treatment of respiratory infections. Nothing in it is specific to DNAH9.

          In DNAH9 disease, respiratory signs are mild or absent in most reported patients, and the clinical
          picture is dominated by laterality defects and complex congenital heart disease. Airway care
          therefore applies to a minority of patients. The cardiac and laterality problems are managed
          as in other causes of heterotaxy and congenital heart disease, and that management is not curated
          here.'
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Though there are no PCD-specific approved therapies that restore ciliary function, routine
          airway clearance and aggressive management of infections are important to preserve lung health
          and minimize complications
        supports: SUPPORT
        directness: INDIRECT
