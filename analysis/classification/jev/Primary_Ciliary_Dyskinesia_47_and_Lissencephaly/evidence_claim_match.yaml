            term:
              id: MONDO:0030346
              label: ciliary dyskinesia, primary, 47, and lissencephaly
        context: []
      assertion_type: Genetic
      assertion:
        name: TP73
        gene_term:
          preferred_term: TP73
          term:
            id: hgnc:12003
            label: TP73
        relationship_type: CAUSATIVE
        notes: 'Biallelic loss-of-function variants in TP73 (tumor protein p73), a member of the TP53
          transcription-factor family, are the cause of CILD47. TP73 is the master transcriptional regulator
          of multiciliated cell differentiation and is also required for normal corticogenesis. Variant
          spectrum (Wallmeier et al. 2021, full text): all reported alleles are null / loss-of-function
          and were homozygous — a multi-exon deletion, a canonical splice-donor variant, and frameshift
          and nonsense variants across the five families; all disrupt both the TAp73 and the DeltaNp73
          isoform classes. Penetrance is complete in reported homozygotes, consanguinity is the dominant
          ascertainment factor, and no genetic modifiers have been established. Exact cDNA/protein coordinates
          live in the primary full text and are not quotable from the indexed abstract, so they are summarized
          here at the variant-class level rather than asserted as snippet-verified evidence.'
      selected_evidence:
        snippet: Our data demonstrate that autosomal-recessive deleterious variants in the TP53 family
          member TP73 cause a mucociliary clearance disorder due to a defect in MCC differentiation.
        supports: SUPPORT
