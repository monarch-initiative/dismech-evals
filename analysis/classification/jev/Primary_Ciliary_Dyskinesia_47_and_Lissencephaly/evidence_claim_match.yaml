      assertion_type: Diagnosis
      assertion:
        name: Ciliary Cell-Biology Workup (immunofluorescence, HSVM, TEM)
        description: 'The airway phenotype is characterized with high-speed video microscopy, immunofluorescence,
          and transmission electron microscopy of respiratory epithelial cells to assess ciliary function,
          ciliary length, and the number of multiciliated cells (MCCs). CRITICAL PITFALL: unlike classic
          axonemal PCD, the axonemal ultrastructure on TEM is essentially normal in CILD47, so standard
          TEM-based PCD screening is falsely reassuring; the diagnostic signal is a reduced number and
          length of MCCs by immunofluorescence, not an axonemal defect.'
        notes: The normal-axonemal-ultrastructure ("normal TEM") pitfall is detailed in the Wallmeier
          et al. 2021 full text; it is the key point distinguishing this RGMC disorder from axonemal PCD
          and is summarized here rather than snippet-quoted from the abstract.
      selected_evidence:
        snippet: We performed high-speed video microscopy, immunofluorescence analyses, and transmission
          electron microscopy in respiratory epithelial cells after spheroid or air liquid interface culture
          to analyze ciliary function, ciliary length, and number of multiciliated cells (MCCs).
