  80d089fce09ba340487023367a458521a179aae9d8a715a925e4c2d5325008be:
    claim:
      about:
        disease:
          name: Primary Ciliary Dyskinesia 47 and Lissencephaly
          disease_term:
            preferred_term: ciliary dyskinesia, primary, 47, and lissencephaly
            term:
              id: MONDO:0030346
              label: ciliary dyskinesia, primary, 47, and lissencephaly
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Cortical Neuronal Migration
        biological_scale: TISSUE
        description: 'Beyond the airway, TP73 is expressed in Cajal-Retzius neurons of the developing
          cortex, where it is coexpressed with reelin, the glycoprotein that is crucial for radial neuronal
          migration and cortical lamination. The mechanism linking TP73 loss to lissencephaly is not established;
          two non-exclusive hypotheses are proposed. (1) A Cajal-Retzius/Reelin arm: loss of TP73 in Reelin-coexpressing
          Cajal-Retzius neurons disrupts Reelin-dependent radial migration. (2) A unifying cilia/cytoskeletal
          arm: the same TAp73-driven multiciliogenesis/cytoskeletal program that builds airway and ependymal
          motile cilia also underlies neuronal migration, so its loss provides a single mechanism for
          the airway, ependymal, and cortical phenotypes of p73-null mice (which show hydrocephalus and
          hippocampal dysgenesis). Either route disrupts radial neuronal migration, producing the cortical
          malformation (lissencephaly / agyria-pachygyria, anterior-predominant, often with a corpus callosum
          abnormality) seen in affected individuals.'
        cell_types:
        - preferred_term: Cajal-Retzius cell
          term:
            id: CL:0000695
            label: Cajal-Retzius cell
        - preferred_term: radial glial cell
          term:
            id: CL:0000681
            label: radial glial cell
        biological_processes:
        - preferred_term: neuron migration
          term:
            id: GO:0001764
            label: neuron migration
          modifier: ABNORMAL
        - preferred_term: cerebral cortex radially oriented cell migration
          term:
            id: GO:0021799
            label: cerebral cortex radially oriented cell migration
          modifier: ABNORMAL
      selected_evidence:
        snippet: In the fetal human hippocampus, Cajal-Retzius (CR) cells coexpress p73, a p53-family
          member involved in cell survival and apoptosis, and the glycoprotein reelin, crucial for radial
          migration.
        supports: SUPPORT
