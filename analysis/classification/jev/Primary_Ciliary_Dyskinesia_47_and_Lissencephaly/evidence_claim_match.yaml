        description: 'TP73-deficient respiratory epithelial cells display reduced ciliary length and basal
          bodies that are mislocalized within the cytoplasm rather than docked at the apical membrane,
          together with a severely reduced number of multiciliated cells. This is a motile-cilia-arm ciliopathy
          mechanism, but distinct from classic PCD: the defect is a failure to generate normal numbers
          of motile cilia (a differentiation/docking defect) rather than an axonemal dynein-arm defect
          in an otherwise assembled cilium.'
