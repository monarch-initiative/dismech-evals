      assertion:
        discussion_id: cild47-mouse-hydrocephalus-mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Defective Cortical Neuronal Migration
        prompt: Does the p73-null mouse ependymal/hydrocephalus phenotype faithfully model the human cortical
          malformation, given that overt hydrocephalus is largely absent in the reported human cohort
          (only transient prenatal ventriculomegaly in one individual)?
        rationale: The unifying cilia/cytoskeletal hypothesis for the human lissencephaly rests substantially
          on the p73-null mouse CNS phenotype, which is dominated by hydrocephalus. Because overt hydrocephalus
          is largely absent in humans, the translational validity of the mouse ependymal phenotype to
          the human cortical malformation is an open question.
      selected_evidence:
        snippet: Loss of ciliary biogenesis provides a unifying mechanism for many phenotypes observed
          in p73 knockout mice including hydrocephalus; hippocampal dysgenesis; sterility; and chronic
          inflammation/infection of lung, middle ear, and sinus.
        supports: SUPPORT
