        status: EMERGING
        description: An alternative, non-exclusive model holds that the single TAp73-driven multiciliogenesis/cytoskeletal
          transcriptional program that builds airway and ependymal motile cilia also underlies neuronal
          migration, so its loss provides one unifying mechanism for the airway, ependymal (hydrocephalus),
          and cortical (lissencephaly, hippocampal dysgenesis) phenotypes seen in p73-null mice and in
          affected individuals. The two models are not mutually exclusive.
      selected_evidence:
        snippet: Loss of ciliary biogenesis provides a unifying mechanism for many phenotypes observed
          in p73 knockout mice including hydrocephalus; hippocampal dysgenesis; sterility; and chronic
          inflammation/infection of lung, middle ear, and sinus.
        supports: SUPPORT
