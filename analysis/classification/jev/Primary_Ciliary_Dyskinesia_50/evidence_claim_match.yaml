              label: ciliary dyskinesia, primary, 50
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Inner Dynein Arm Loss in Respiratory Cilia
        description: In one PCD patient whose respiratory cilia lacked inner dynein arms and moved abnormally,
          DNAH7 was made in the cell but missing from the cilia. That patient was not genotyped, so the
          lesion may have been in another gene. The only patient with biallelic DNAH7 variants whose airway
          cilia were examined, a man homozygous for a frameshift, had normal ciliary ultrastructure on
          electron microscopy. An inner-arm defect in airway cilia is therefore expected from DNAH7's
          location but has not been shown in a genotyped CILD50 patient.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Respiratory tract multiciliated cell
          term:
            id: CL:4030034
            label: respiratory tract multiciliated cell
        cellular_components:
        - preferred_term: Inner dynein arm
          term:
            id: GO:0036156
            label: inner dynein arm
        biological_processes:
        - preferred_term: Cilium movement
          modifier: DECREASED
          term:
            id: GO:0003341
            label: cilium movement
      selected_evidence:
        snippet: In cilia from PCD cells, DNAH7 was undetectable, whereas intracellular DNAH7 was clearly
          present.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
