              label: primary ciliary dyskinesia 9
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Outer Dynein Arm Assembly Failure
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'The step that defines the disease. DNAI2 protein is absent from mutant respiratory
          cells, and with it the outer-arm heavy chains DNAH5 and DNAH9 - both of them, from all mutant
          axonemes. That double loss is the specific claim, because outer dynein arms are not uniform
          along the cilium: proximal and distal complexes differ in heavy-chain composition, and the three
          intermediate- and heavy-chain genes are not interchangeable in what they take down with them.
          DNAI2 and DNAH5 loss disrupts assembly of both proximal and distal complexes; DNAI1 loss mainly
          disrupts the proximal ones.

          The assembly hierarchy runs the other way too. In patients with DNAH5 mutations DNAI2 is completely
          absent from the axoneme, and in patients with DNAI1 mutations it is absent distally - so DNAI2
          is a dependent of those genes as well as a requirement for them, which is what makes the outer
          arm a co-assembling complex rather than a chain of separable steps.'
        biological_processes:
        - preferred_term: axonemal dynein complex assembly
          term:
            id: GO:0070286
            label: axonemal dynein complex assembly
          modifier: DECREASED
        cell_types:
        - preferred_term: multiciliated respiratory epithelial cell
          term:
            id: CL:0005012
            label: multiciliated epithelial cell
      selected_evidence:
        snippet: Thus, DNAI2 and DNAH5 mutations affect assembly of proximal and distal ODA complexes,
          whereas DNAI1 mutations mainly disrupt assembly of proximal ODA complexes.
        supports: SUPPORT
