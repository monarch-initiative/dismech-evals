      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other outer dynein arm and ODA-docking deficiencies
        description: DNAI1, DNAH5, DNAH9, and the outer dynein arm docking complex genes ODAD1 to ODAD4
          all produce outer dynein arm defects on electron microscopy, so ultrastructure alone cannot
          separate them from DNAI2 disease. Immunofluorescence narrows it further - DNAI2 loss removes
          DNAI2 plus both outer-arm heavy chains along the whole axoneme, DNAI1 loss removes DNAI2 only
          distally - but sequencing is what completes the diagnosis.
      selected_evidence:
        snippet: Thus, DNAI2 and DNAH5 mutations affect assembly of proximal and distal ODA complexes,
          whereas DNAI1 mutations mainly disrupt assembly of proximal ODA complexes.
        supports: SUPPORT
