            term:
              id: MONDO:0012906
              label: primary ciliary dyskinesia 9
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic DNAI2 Loss of Function
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'The initiating lesion. DNAI2 sits at 17q25 in fourteen exons and is highly expressed
          in trachea and testis - the two tissues whose motile axonemes carry the clinical phenotype.
          It is the human relative of Chlamydomonas IC69, and it was cloned and mapped as a PCD candidate
          on that basis eight years before any patient mutation was found; the first screen of twelve
          outer-dynein-arm PCD patients found none, which is a fair indication of how rare the genotype
          is.

          The three reported alleles are all loss of function and two of the three are splice variants:
          a canonical splice-donor change, a nonsense change, and a splice-acceptor change producing out-of-frame
          transcripts. A 6.9 kb intragenic microdeletion has since been reported. No missense allele has
          been described, so there is no worked example of a DNAI2 change that alters the protein without
          abolishing it, and nothing against which to calibrate a novel missense variant.'
        genes:
        - preferred_term: DNAI2
          term:
            id: hgnc:18744
            label: DNAI2
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          description: Loss of function established both by allele class and by the measured consequence
            - DNAI2 protein is absent from patients' respiratory cells. Zygosity is recorded as homozygous
            because every reported family is, which reflects the consanguineous ascertainment of the defining
            study rather than any biological requirement; a compound heterozygote would be expected to
            have the same disease.
      selected_evidence:
        snippet: including a nonsense (c.787C > T) and a splicing mutation (IVS3-3T > G) resulting in
          out-of-frame transcripts
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
