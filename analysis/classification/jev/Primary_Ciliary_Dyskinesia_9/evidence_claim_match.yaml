      assertion_type: AnimalModel
      assertion:
        name: medaka jaodori (joi) dnai2 mutant
        species: Japanese medaka
        genotype: dnai2 disrupted by Tol1 transposon insertion (jaodori allele)
        publication: PMID:20709053
        description: 'A forward-genetic medaka mutant in which a Tol1 transposon insertion disrupts dnai2.
          Kupffer''s vesicle - the fish equivalent of the mouse node for left-right specification - generates
          cilia normally but they do not beat, and ultrastructure shows severe reduction of the outer
          dynein arms. That is the same lesion as the human disease, in the same order: arms lost, motility
          lost, laterality randomised.

          One finding limits how far the model transfers, and it is the model''s own: medaka has a second
          dnai2 gene, and the two act redundantly in some ciliated tissues and distinctly in others. Humans
          have one. A tissue-by-tissue comparison of which cilia are affected therefore cannot be carried
          across, even though the core mechanism can.'
        modeled_mechanisms:
        - target: Absence of Outer Dynein Arms from the Axoneme
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Severe outer dynein arm reduction in Kupffer's vesicle cilia, from disruption of
            the orthologous gene.
          limitations: Measured in Kupffer's vesicle rather than respiratory epithelium, and the medaka
            genome carries a second dnai2 whose redundancy has no human counterpart.
          readouts:
          - name: Outer dynein arm content of Kupffer's vesicle cilia
            target: Absence of Outer Dynein Arms from the Axoneme
            direction: DECREASED
            interpretation: The ultrastructural correlate of the human outer-arm loss, in the organ where
              this model's laterality phenotype arises.
        - target: Randomised Left-Right Body Asymmetry
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Cilia in Kupffer's vesicle are generated but immotile, and laterality is disrupted
            - the same causal order as the human node.
          limitations: Kupffer's vesicle is functionally equivalent to the mouse node for left-right specification
            but is not the same structure, and the second medaka dnai2 gene has no human counterpart.
          readouts:
          - name: Left-right axis specification
            target: Randomised Left-Right Body Asymmetry
            direction: ALTERED
            interpretation: Laterality defect arising from immotile nodal-equivalent cilia.
      selected_evidence:
        snippet: We also found the other dnai2 gene in the medaka genome. These two dnai2 genes function
          either redundantly or distinctly in tissues possessing motile cilia.
        supports: SUPPORT
