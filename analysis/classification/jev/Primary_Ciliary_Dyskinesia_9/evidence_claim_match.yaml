          basis. Four alleles are reported: a canonical splice-donor variant IVS11+1G>A, a nonsense variant
          c.787C>T, a splice-acceptor variant IVS3-3T>G producing out-of-frame transcripts, and a 6.9
          kb intragenic microdeletion.

          All four are loss of function and none is missense, which is a real limitation for variant interpretation:
          a laboratory encountering a novel DNAI2 missense change has no comparable reported allele to
          reason from.'
