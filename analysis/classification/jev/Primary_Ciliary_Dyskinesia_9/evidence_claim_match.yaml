      assertion_type: Treatment
      assertion:
        name: Airway Clearance and Chronic Infection Management
        description: 'There is no treatment for the ciliary defect. Management is the supportive airway
          care used across primary ciliary dyskinesia - physiotherapy and airway clearance, antibiotics
          for exacerbations and chronic infection, surveillance of lung function and structure - and nothing
          in it is DNAI2-specific.

          Curated as a single scoping entry rather than an itemised regimen, and the reason is recorded
          rather than left implicit: no trial has enrolled by genotype, and the umbrella entry Primary_Ciliary_Dyskinesia
          holds the detailed management block. Duplicating it here would create two places to maintain
          the same evidence and imply a genotype-specific practice that does not exist. What is DNAI2-specific
          is prognostic rather than therapeutic - outer dynein arm defects carry milder airway disease
          than the inner-arm and microtubular-disorganisation classes - and that is curated on the airway
          damage node.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Primary ciliary dyskinesia (PCD) is a rare, genetically heterogeneous, motile ciliopathy,
          characterized by neonatal respiratory distress, recurrent upper and lower respiratory tract
          infections, subfertility, and laterality defects.
        supports: SUPPORT
