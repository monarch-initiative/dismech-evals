      assertion:
        name: Immunofluorescence Staining of Respiratory Cilia
        description: 'The test that comes closest to naming this genotype before sequencing, and the reason
          it is curated separately from electron microscopy. In DNAI2 disease immunofluorescence shows
          DNAI2 absent from the axoneme together with both outer-arm heavy chains, DNAH5 and DNAH9 - a
          whole-length outer-arm picture. DNAI1 disease loses DNAI2 only distally, and DNAH11 disease
          has normal ultrastructure with a partial outer-arm reduction confined to the proximal region
          that conventional electron microscopy misses entirely.

          So immunofluorescence resolves distinctions the ultrastructure alone does not. It still does
          not complete the diagnosis: sequencing does.'
      selected_evidence:
        snippet: In addition, we demonstrated complete or distal absence of DNAI2 from ciliary axonemes
          in respiratory cells of patients with mutations in genes encoding the ODA chains DNAH5 and DNAI1,
          respectively.
