        category: Respiratory
        name: Bronchiectasis
        description: 'Irreversible airway dilatation, the structural endpoint of repeated infection and
          retained secretions. In the paediatric cohort the median was three affected lobes across all
          PCD, and children in the outer dynein arm group - which is where DNAI2 patients fall - had fewer
          affected lobes than the inner-arm and microtubular-disorganisation group.

          Curated FREQUENT, against Orphanet''s Occasional (29-5%) for primary ciliary dyskinesia as a
          class. The disagreement is real and is resolved in favour of the cohort data rather than averaged:
          the prospective paediatric series imaged every participant by CT and found a median of three
          affected lobes across all 118, which is not compatible with a sub-30 per cent rate. Orphanet''s
          grade plausibly reflects clinically diagnosed bronchiectasis across all ages and ascertainment
          settings, where the cohort figure reflects systematic imaging in a referral population. Both
          are recorded.'
        phenotype_term:
          preferred_term: Bronchiectasis
          term:
            id: HP:0002110
            label: Bronchiectasis
          clinical_course: PROGRESSIVE
        frequency: FREQUENT
      selected_evidence:
        snippet: For all 118 subjects, median number of lobes with bronchiectasis was three and alveolar
          consolidation was two.
        supports: SUPPORT
