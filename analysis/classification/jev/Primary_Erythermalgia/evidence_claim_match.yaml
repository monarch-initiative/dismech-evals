        status: OPEN
        attaches_to:
        - pathophysiology#Nociceptor Hyperexcitability
        rationale: Human iPSC-derived sensory neurons carrying Nav1.7 gain-of-function mutations reproduce
          hyperexcitability, and CRISPR correction reverses it while introducing the mutation confers
          it (PMID:40279376), validating the human cellular model. By contrast, two independent knock-in
          mouse lines carrying a Nav1.7 gain-of-function variant (I228M — a variant found in idiopathic
          small-fiber neuropathy, a sibling Nav1.7 channelopathy rather than an IEM-specific allele) reproduce
          DRG neuron hyperexcitability but do NOT display mechanical/thermal hyperalgesia or intraepidermal
          nerve fiber loss (PMID:33323889). This dissociation — cellular hyperexcitability without an
          overt behavioral pain phenotype in mice — is a translational caveat for modeling Nav1.7 gain-of-function
          pain disorders, including IEM.
      selected_evidence:
        snippet: robust, scalable and relevant model to study the effects of gain-of-function mutations
          in ion channels in pain-related disorders
        supports: SUPPORT
