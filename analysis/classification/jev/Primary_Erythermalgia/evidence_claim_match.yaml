      assertion:
        name: Sympathetic Neuron Dysregulation
        biological_scale: CELLULAR
        description: Nav1.7 is also expressed in sympathetic ganglion neurons. The same gain-of-function
          variant that renders sensory neurons hyperexcitable paradoxically renders sympathetic neurons
          hypoexcitable (because sympathetic neurons lack Nav1.8, which keeps sensory neurons firing at
          depolarized potentials), providing a molecular basis for the abnormal vasomotor control and
          the warm, erythematous flares.
        cell_types:
        - preferred_term: sympathetic noradrenergic neuron
          term:
            id: CL:0011103
            label: sympathetic neuron
      selected_evidence:
        snippet: These results provide a molecular basis for the sympathetic dysfunction that has been
          observed in erythermalgia.
        supports: SUPPORT
