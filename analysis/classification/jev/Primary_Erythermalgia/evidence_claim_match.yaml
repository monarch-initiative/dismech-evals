          or polycythemia vera), where the mechanism is platelet-mediated arteriolar inflammation and
          thrombotic occlusion of acral arterioles rather than the Nav1.7 nociceptor channelopathy modeled
          here. Distinguishing features: later onset, frequently asymmetric or unilateral attacks, an
          accompanying thrombocytosis, and — the key discriminator — dramatic relief with aspirin, which
          primary erythermalgia characteristically lacks.'
