      assertion:
        name: SCN9A Gain-of-Function Variant (Nav1.7)
        biological_scale: MOLECULAR
        conforms_to: nociceptor_sodium_channel_excitability#Enhanced or Persistent Nociceptor Sodium Current
        description: Heterozygous missense gain-of-function variants in SCN9A alter the biophysical properties
          of the Nav1.7 voltage-gated sodium channel. Characteristic changes include a hyperpolarizing
          shift in the voltage-dependence of activation, slowed deactivation, and enhanced ramp currents,
          which lower the threshold for channel opening and increase the channel's response to small,
          slow depolarizations.
        molecular_functions:
        - preferred_term: voltage-gated sodium channel activity
          term:
            id: GO:0005248
            label: voltage-gated sodium channel activity
          modifier: INCREASED
        genes:
        - preferred_term: SCN9A
          term:
            id: hgnc:10597
            label: SCN9A
      selected_evidence:
        snippet: Here we show that these mutations in Na(v)1.7 produce a hyperpolarizing shift in activation
          and slow deactivation. We also show that these mutations cause an increase in amplitude of the
          current produced by Na(v)1.7 in response to slow, small depolarizations.
        supports: SUPPORT
