      assertion:
        name: Oxygen-Sensing and High-Oxygen-Affinity Erythrocytoses
        description: The other congenital erythrocytoses - VHL (Chuvash), EGLN1/PHD2, EPAS1/HIF2A, high-oxygen-affinity
          haemoglobin variants, 2,3-bisphosphoglycerate deficiency - are secondary, EPO-driven, and have
          inappropriately normal or elevated erythropoietin. EPOR-related disease is the one with uniquely
          subnormal erythropoietin.
        distinguishing_features:
        - Subnormal erythropoietin in EPOR disease; normal-to-elevated in the others
        - Primary (erythroid-intrinsic) lesion versus secondary EPO-driven mechanism
        - High-affinity haemoglobinopathy and BPGM deficiency give a left-shifted p50
      selected_evidence:
        snippet: causes include EPOR mutations (subnormal Epo), high oxygen affinity hemoglobin variants,
          PIEZO1 mutations, 2,3-bisphosphoglycerate deficiency, methemoglobinemia, and germline oxygen
          sensing pathway mutations (HIF2A-PHD2-VHL)
