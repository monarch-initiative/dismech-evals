        gene_term:
          preferred_term: EPOR
          term:
            id: hgnc:3416
            label: EPOR
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: Heterozygous germline truncating variants in EPOR, almost all nonsense or frameshift
          changes in the last exon (exon 8), which encodes the negative regulatory region of the cytoplasmic
          tail. The net effect is gain of function through loss of negative regulation. Among the roughly
          35 reported variants, most are classified pathogenic or likely pathogenic. EPOR mutations are
          found in only about 1% of JAK2-negative erythrocytosis cases.
        notes: The specific negative regulator removed by the truncation is often summarised as the SHP-1
          (PTPN6) docking tyrosine, with loss of internalization and degradation signals, but the abstracts
          cited here establish only the loss of the C-terminal negative regulatory domain and the escape
          from PI3K/p85-mediated internalization and ubiquitin-proteasomal degradation (PMID:20096014),
          not the SHP-1 identity, so SHP-1 is named here as context rather than curated as a node.
        variants:
        - name: W439X (G6002A)
          description: 'The sentinel allele from the original large kindred: a G-to-A transition at nucleotide
            6002 creating a premature stop and truncating the 70 C-terminal amino acids.'
        - name: 5974insG
          description: A heterozygous G insertion at EPOR nucleotide 5975 that shifts the reading frame
            at codon 430 and truncates the last 64 amino acids; erythroid progenitors showed increased
            EPO sensitivity.
        - name: C5964G (Y426X)
          description: An exon 8 nonsense variant changing tyrosine codon 426 to a stop, truncating the
            receptor by 83 amino acids; reported in a family with one mutation carrier who did not develop
            polycythemia despite progenitor hypersensitivity.
        - name: p.Gln434Profs*11
          description: A frameshift allele whose hypersensitivity depends on a novel C-terminal tail rather
            than on truncation alone, defining the frameshift-specific mechanism.
        - name: c.1293del (p.Ser432Alafs*21)
          description: A frameshift allele observed exclusively in patients from New Caledonia, a founder
            variant underlying a regional cluster.
      selected_evidence:
        snippet: A heterozygous insertion of G at EPOR nucleotide 5975 was identified in genomic DNA from
          polycythemic members of family no. 2. 5974insG shifts the reading frame at codon 430, predicting
          amino acid substitutions and truncation of the last 64 amino acids.
        supports: SUPPORT
