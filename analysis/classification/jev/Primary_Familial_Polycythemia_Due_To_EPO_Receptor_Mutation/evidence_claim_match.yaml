        - preferred_term: erythropoietin receptor activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0004900
            label: erythropoietin receptor activity
        description: For frameshift variants, the phenotype is not explained by truncation alone but requires
          a novel C-terminal peptide generated by the frameshift. This new tail increases receptor dimerization,
          stability and cell-surface localization and pre-activates the receptor, a mechanism distinct
          from simple loss of the negative regulatory domain and proposed to be common to EPOR frameshift
          mutations.
      selected_evidence:
        snippet: by the appearance of a new C-terminal tail. The latter, by increasing erythropoietin
          receptor dimerization, stability and cell-surface localization, causes pre-activation of erythropoietin
          receptor and JAK2, constitutive signaling and hypersensitivity to erythropoietin.
        supports: SUPPORT
