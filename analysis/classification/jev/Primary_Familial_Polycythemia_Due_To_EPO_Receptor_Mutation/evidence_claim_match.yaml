      assertion:
        name: EPOR C-Terminal Cytoplasmic Truncation
        biological_scale: MOLECULAR
        description: A heterozygous germline nonsense or frameshift variant, almost always in the last
          exon (exon 8) of EPOR, truncates the cytoplasmic C-terminus of the erythropoietin receptor.
          The classic example is a G-to-A transition at nucleotide 6002 that converts a tryptophan codon
          to a stop codon, truncating the 70 C-terminal amino acids; frameshift insertions and deletions
          in the same region act similarly.
        genes:
        - preferred_term: EPOR
          term:
            id: hgnc:3416
            label: EPOR
        molecular_functions:
        - preferred_term: erythropoietin receptor activity
          term:
            id: GO:0004900
            label: erythropoietin receptor activity
          modifier: GAIN_OF_FUNCTION
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: Here we describe a G to A transition in nucleotide 6002 of the EPOR gene that converts
          a TGG codon for tryptophan into a TAG stop codon, predicting the truncation of the 70 C-terminal
          amino acids of the EPOR molecule.
        supports: SUPPORT
    origin:
