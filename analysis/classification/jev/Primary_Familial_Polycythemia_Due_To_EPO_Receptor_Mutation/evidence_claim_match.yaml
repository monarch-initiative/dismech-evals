      assertion_type: DifferentialDiagnosis
      assertion:
        name: Polycythemia Vera
        description: The principal differential. Polycythemia vera is an acquired JAK2-mutated myeloproliferative
          neoplasm with trilineage expansion and low erythropoietin and adult onset. PFCP is congenital,
          JAK2-negative, confined to the erythroid lineage (normal white cell and platelet counts), and
          also has subnormal erythropoietin - so the discriminators are JAK2 status, lineage involvement
          and age of onset rather than the erythropoietin level alone.
        distinguishing_features:
        - JAK2 V617F or exon 12 mutation present in polycythemia vera, absent here
        - Trilineage expansion in polycythemia vera; isolated erythrocytosis here
        - Acquired adult onset versus congenital lifelong erythrocytosis
      selected_evidence:
        snippet: The foremost step is excluding polycythemia vera (PV) with JAK2 mutation screening (exons
          12-15).
        supports: SUPPORT
