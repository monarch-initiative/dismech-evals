          endogenous oxalate production increases in PH3. The leading proposed mechanism is that accumulated
          4-hydroxy-2-oxoglutarate is exported to the cytosol and cleaved by a non-HOGA1 cytosolic aldolase
          to glyoxylate, which is oxidized to oxalate; accumulated substrate may additionally inhibit
          glyoxylate reductase. The precise pathomechanism remains uncertain.
        role: central_effector
