      assertion_type: Pathophysiology
      assertion:
        name: Cytokine-Mediated Marrow Fibrosis
        description: Atypical megakaryocytes release profibrotic cytokines including TGF-beta, PDGF, and
          bFGF, stimulating marrow stromal cells to deposit reticulin and collagen fibers. Progressive
          fibrosis replaces normal hematopoietic tissue.
        biological_processes:
        - preferred_term: extracellular matrix organization
          modifier: INCREASED
          term:
            id: GO:0030198
            label: extracellular matrix organization
      selected_evidence:
        snippet: Primary myelofibrosis (PMF) is a Philadelphia chromosome (Ph)-negative myeloproliferative
          neoplasm (MPN) that features clonal proliferation of atypical megakaryocytes and myeloid cells,
          fibrosis of the bone marrow, extramedullary hematopoiesis, and increased risk of leukemic transformation
          to acute myeloid leukemia (AML).
        supports: SUPPORT
