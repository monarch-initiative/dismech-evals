      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        description: PRKAR1A-related PPNAD, whether isolated or in the context of Carney complex, is inherited
          in an autosomal dominant manner. PRKAR1A behaves as a tumor suppressor, with inactivating germline
          variants and frequently a somatic second hit at the tissue level. Some cases arise de novo,
          and PRKACA copy-number gain has been reported as a de novo (non-heritable) event.
      selected_evidence:
        snippet: Inactivating mutations in PRKAR1A, a gene encoding the type 1 alpha-regulatory subunit
          (R1alpha) of the cAMP-dependent protein kinase (PKA) have been found in 80% of CNC patients
          with Cushing's syndrome.
        supports: SUPPORT
