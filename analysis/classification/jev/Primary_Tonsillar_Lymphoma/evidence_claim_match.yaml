      assertion_type: Stage
      assertion:
        name: Stage I
        description: Cancer is found in a single region of lymph nodes or a single extralymphatic organ.
        substages:
        - name: Stage IA
          description: A single lymph node region is involved, without B symptoms.
        - name: Stage IB
          description: A single lymph node region is involved, with B symptoms.
        - name: Stage IE
          description: A single extralymphatic organ is involved (e.g., the tonsil).
        pathophysiology:
        - name: Localized Lymphocyte Proliferation
          description: Abnormal growth and accumulation of malignant lymphocytes confined to a single
            site.
          cell_types:
          - preferred_term: B-cell Lymphocyte
            term:
              id: CL:0000236
              label: B cell
          - preferred_term: T-cell Lymphocyte
            term:
              id: CL:0000084
              label: T cell
        - name: Minimal Tissue Disruption
          description: Limited alteration of surrounding tissue architecture due to localized nature of
            the disease.
        - name: Systemic Effects in IB
          description: Presence of B symptoms in IB indicates more aggressive disease biology with systemic
            effects.
      selected_evidence:
        snippet: All cases were non-Hodgkin's lymphomas, with the majority being diffuse large cell lymphoma
          (85%). Initial therapy was radiotherapy alone in 54 patients, radiotherapy combined with chemotherapy
          in 8 patients, and chemotherapy alone in 3 patients. Stage was the most important prognostic
          factor, with 86% and 41% 5-year survivals for Stages IE and IIE, respectively (P = 0.006).
        supports: SUPPORT
