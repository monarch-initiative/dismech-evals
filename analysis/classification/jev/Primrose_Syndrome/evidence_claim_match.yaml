        - name: Autosomal dominant
          description: Primrose syndrome is an autosomal dominant disorder caused by de novo heterozygous
            ZBTB20 variants.
        features: Primrose syndrome is caused by de novo heterozygous pathogenic variants in ZBTB20. The
          recurrent variants are missense changes affecting the first and second C2H2 zinc-finger motifs,
          which disrupt DNA binding; rare truncating and small-deletion alleles have also been reported.
          Functional studies support a dominant-negative mechanism. ZBTB20 lies within the 3q13.31 microdeletion
          syndrome critical region, explaining clinical overlap between the two disorders.
      selected_evidence:
        snippet: In all patients in whom one or both parents were available (n = 26), the variant was
          found to be de novo.
        supports: SUPPORT
