  b8973f944d77666a23fc9e769e8412f764efda8b76ea43bb73cfa27862818643:
    claim:
      about:
        disease:
          name: Primrose Syndrome
          disease_term:
            preferred_term: Primrose Syndrome
            term:
              id: MONDO:0009798
              label: Primrose syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Neurodevelopmental Gene Expression
        description: ZBTB20 is a key regulator of neurogenesis, cortical lamination, and hippocampal development.
          Neurodevelopmental-disorder-associated ZBTB20 variants alter dendritic spine morphology, dendritic
          arborization, and dendritic length in cultured cortical pyramidal neurons, providing a plausible
          cellular substrate for the intellectual disability, autistic behavior, and behavioral phenotype
          of Primrose syndrome. Brain MRI commonly shows corpus callosum anomalies, particularly in patients
          with missense variants.
        cell_types:
        - preferred_term: Cortical pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        - preferred_term: Hippocampal neuron
          term:
            id: CL:0002608
            label: hippocampal neuron
        biological_processes:
        - preferred_term: Neurogenesis
          term:
            id: GO:0022008
            label: neurogenesis
          modifier: ABNORMAL
        - preferred_term: Negative regulation of neuron differentiation
          term:
            id: GO:0045665
            label: negative regulation of neuron differentiation
          modifier: ABNORMAL
      selected_evidence:
        snippet: a single nucleotide variant identified in patients with intellectual disability and located
          at the C-terminus of ZBTB20 affected dendritic arborization and dendritic length but had no
          effect on dendritic spine morphology.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30281617
      reference_title: Neurodevelopmental disorder-associated ZBTB20 gene variants affect dendritic and
        synaptic structure.
      evidence_source: IN_VITRO
      explanation: Demonstrates that ZBTB20 variants perturb dendritic architecture in cortical pyramidal
        neurons, a substrate for the cognitive phenotype.
