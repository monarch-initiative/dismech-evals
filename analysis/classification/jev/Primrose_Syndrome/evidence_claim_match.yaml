  c2b94cc34b6e44ae6996ae633ce8656249273d1b15eca942870655af9c100759:
    claim:
      about:
        disease:
          name: Primrose Syndrome
          disease_term:
            preferred_term: Primrose Syndrome
            term:
              id: MONDO:0009798
              label: Primrose syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disturbed Growth and Energy Metabolism
        description: ZBTB20 acts as a regulator of somatic growth, fetal liver development, detoxification,
          and glucose metabolism. Its dysregulation in Primrose syndrome is linked to postnatal overgrowth
          (macrocephaly, with variable tall stature), disturbed glucose metabolism with insulin-resistant
          diabetes, and a metabolic signature suggesting disturbed mitochondrial fatty-acid oxidation
          (abnormal acylcarnitines and urine organic acids). ZBTB20 normally represses hepatic alpha-fetoprotein
          expression, and loss of this repression is proposed to underlie the characteristically elevated
          serum AFP.
        cell_types:
        - preferred_term: Pancreatic beta cell
          term:
            id: CL:0000169
            label: type B pancreatic cell
        - preferred_term: Hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: Regulation of glucose metabolic process
          term:
            id: GO:0010906
            label: regulation of glucose metabolic process
          modifier: ABNORMAL
        - preferred_term: Glucose homeostasis
          term:
            id: GO:0042593
            label: glucose homeostasis
          modifier: ABNORMAL
      selected_evidence:
        snippet: ZBTB20 acts as a regulator of neurogenesis, fetal liver development, somatic growth,
          detoxification and glucose metabolism.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
