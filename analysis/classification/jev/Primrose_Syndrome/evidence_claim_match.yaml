              label: Primrose syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ZBTB20 Transcriptional Repressor Dysfunction
        description: ZBTB20 is a BTB-zinc finger (BTB-ZF) transcriptional repressor with an N-terminal
          BTB domain mediating protein-protein interactions and five C-terminal C2H2 zinc fingers mediating
          sequence-specific DNA binding to promoters of target genes. Most Primrose syndrome variants
          are de novo missense changes affecting the first and second zinc-finger motifs, which disrupt
          DNA binding. Functional studies show that both missense and truncating Primrose-causing variants
          exert a dominant-negative impact on wild-type ZBTB20, interfering with normal transcriptional
          repression and dysregulating downstream developmental, growth, and metabolic gene programs.
        cell_types:
        - preferred_term: Pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        biological_processes:
        - preferred_term: Negative regulation of transcription by RNA polymerase II
          term:
            id: GO:0000122
            label: negative regulation of transcription by RNA polymerase II
          modifier: DECREASED
      selected_evidence:
        snippet: The protein is a member of the broad complex tramtrack bric‐a‐brac (BTB) zinc‐finger
          (ZnF) family and is characterized by an N‐terminal BTB domain that is involved in protein‐protein
          interaction, and five C2H2 zinc fingers at the C‐terminus mediating protein binding to regulatory
          sites within promoters of target genes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
