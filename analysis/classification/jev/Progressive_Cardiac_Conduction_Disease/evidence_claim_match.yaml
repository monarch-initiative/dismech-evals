        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Sodium Current and Conduction Slowing
        biological_scale: CELLULAR
        role: effector
        description: Reduced Nav1.5 sodium current slows the rate of rise of the cardiac action potential,
          which slows impulse propagation through the His-Purkinje system and atrioventricular node. On
          the surface ECG this manifests as progressive lengthening of the P-wave and the PR and QRS intervals,
          the electrocardiographic signature of conduction slowing.
        cell_types:
        - preferred_term: Cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Cardiac Conduction
          term:
            id: GO:0061337
            label: cardiac conduction
          modifier: DECREASED
      selected_evidence:
        snippet: Scn5a+/- mice showed extensive fibrosis of their ventricular myocardium
        supports: SUPPORT
    origin:
