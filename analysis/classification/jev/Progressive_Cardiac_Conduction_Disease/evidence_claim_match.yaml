      assertion:
        name: Autosomal dominant
        description: PCCD is inherited as an autosomal dominant trait; a single loss-of-function SCN5A
          allele produces disease in affected families, with conduction impairment that progresses with
          age. Allelic overlap with Brugada syndrome means the same SCN5A variant can produce either or
          both phenotypes within a family.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
      selected_evidence:
        snippet: Loss-of-function mutations in the SCN5A gene encoding the cardiac sodium channel are
          responsible for Brugada syndrome (BS) and also for progressive cardiac conduction disease (inherited
          Lenègre disease)
        supports: SUPPORT
