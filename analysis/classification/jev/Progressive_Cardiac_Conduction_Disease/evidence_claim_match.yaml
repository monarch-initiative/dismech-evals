        biological_scale: TISSUE
        role: amplifier
        description: 'A distinctive feature of SCN5A-linked PCCD is that a monogenic ion-channel defect
          progressively produces structural change: with aging the ventricular myocardium and conduction
          system develop extensive fibrosis, which further degrades conduction and accounts for the relentless,
          age-dependent progression of block. This was the first demonstration that a primary channelopathy
          can drive myocardial structural anomalies.'
