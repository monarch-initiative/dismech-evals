        description: The prototypical initiating lesion in PCCD is a loss-of-function variant in SCN5A,
          encoding the alpha subunit of the cardiac voltage-gated sodium channel Nav1.5 that carries the
          depolarizing sodium current (INa) responsible for rapid impulse conduction. The same loss-of-function
          SCN5A alleles underlie Brugada syndrome, so PCCD sits within the sodium-channel-disease spectrum;
          other PCCD genes include TRPM4.
