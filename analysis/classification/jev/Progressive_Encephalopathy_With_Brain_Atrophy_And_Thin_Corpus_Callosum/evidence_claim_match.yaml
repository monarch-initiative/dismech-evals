        variants:
        - name: p.Asn1033Lys (c.3099C>G)
          description: Faroese founder missense allele; all eight Faroese patients were homozygous, with
            a homogeneous severe course and much shorter survival than previously reported patients.
          clinical_significance: PATHOGENIC
        - name: p.Ala475Thr (c.1423G>A)
          description: Recurrent missense allele in families of Cochin Jewish and south Indian origin;
            patient fibroblasts retain about 10% of control TBCD abundance. Found homozygous in an Indian
            child who also carried a homozygous FGG truncating allele.
          clinical_significance: PATHOGENIC
        - name: p.His77Arg (c.230A>G)
          description: 'Missense allele associated with milder disease: homozygous in a child with absence
            seizures and slight developmental delay, and in trans with an exon 28-39 deletion in a boy
            with refractory migrating focal seizures and regression.'
          clinical_significance: LIKELY_PATHOGENIC
        - name: p.Arg772Cys (c.2314C>T)
          description: Recurrent missense allele reported in the original Japanese series and homozygous
            in two Turkish siblings with severe regression, spastic tetraplegia, seizures and brain atrophy.
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: We report that biallelic mutations in TBCD, encoding one of the five co-chaperones required
          for assembly and disassembly of the αβ-tubulin heterodimer, the structural unit of microtubules,
          cause a disease with neurodevelopmental and neurodegenerative features characterized by early-onset
          cortical atrophy, secondary hypomyelination, microcephaly, thin corpus callosum, developmental
          delay, intellectual disability, seizures, optic atrophy, and spastic quadriplegia.
        supports: SUPPORT
