  c3cc3e27eebc79a6125699729c7ea2e52c5744bb0e86ce09442144356748b79c:
    claim:
      about:
        disease:
          name: Progressive Encephalopathy With Brain Atrophy And Thin Corpus Callosum
          disease_term:
            preferred_term: Progressive encephalopathy with brain atrophy and thin corpus callosum
            term:
              id: MONDO:0044646
              label: early-onset progressive diffuse brain atrophy-microcephaly-muscle weakness-optic
                atrophy syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: TBCD
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: TBCD
          term:
            id: hgnc:11581
            label: TBCD
        notes: TBCD (17q25.3) encodes tubulin-folding cofactor D, a HEAT-repeat protein that binds beta-tubulin
          and the GTPase ARL2 and, with TBCE and TBCC, assembles and disassembles the alpha/beta-tubulin
          heterodimer. Reported alleles are mostly missense, with a few nonsense, splice and intragenic
          deletion alleles; no patient has been reported with two null alleles, which together with the
          fibroblast data (residual TBCD at roughly 10-40% of control) supports a hypomorphic mechanism.
          Reported variants include p.Met387Arg, p.Tyr760*, p.Arg772Cys, p.Ala921Thr, p.Pro937Arg, p.Pro1122Leu,
          p.Leu229Arg, p.Thr374Met, p.Arg377Gln, p.Ala626Thr, p.Thr994Met, p.Val1105Met, p.Ala475Thr,
          p.Ala586Val, p.Asn1033Lys, p.Ala447Val, p.His77Arg and p.Arg294Gln.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_d1ac5fbd-0d8e-4b6e-a8c4-d21f966a350f-2025-03-13T190000.000Z
        variants:
        - name: p.Asn1033Lys (c.3099C>G)
          description: Faroese founder missense allele; all eight Faroese patients were homozygous, with
            a homogeneous severe course and much shorter survival than previously reported patients.
          clinical_significance: PATHOGENIC
        - name: p.Ala475Thr (c.1423G>A)
          description: Recurrent missense allele in families of Cochin Jewish and south Indian origin;
            patient fibroblasts retain about 10% of control TBCD abundance. Found homozygous in an Indian
            child who also carried a homozygous FGG truncating allele.
          clinical_significance: PATHOGENIC
        - name: p.His77Arg (c.230A>G)
          description: 'Missense allele associated with milder disease: homozygous in a child with absence
            seizures and slight developmental delay, and in trans with an exon 28-39 deletion in a boy
            with refractory migrating focal seizures and regression.'
          clinical_significance: LIKELY_PATHOGENIC
        - name: p.Arg772Cys (c.2314C>T)
          description: Recurrent missense allele reported in the original Japanese series and homozygous
            in two Turkish siblings with severe regression, spastic tetraplegia, seizures and brain atrophy.
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: By whole-exome sequencing, we identified biallelic TBCD mutations in eight affected individuals
          from the four families.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
