            label: TBCD
        notes: TBCD (17q25.3) encodes tubulin-folding cofactor D, a HEAT-repeat protein that binds beta-tubulin
          and the GTPase ARL2 and, with TBCE and TBCC, assembles and disassembles the alpha/beta-tubulin
          heterodimer. Reported alleles are mostly missense, with a few nonsense, splice and intragenic
