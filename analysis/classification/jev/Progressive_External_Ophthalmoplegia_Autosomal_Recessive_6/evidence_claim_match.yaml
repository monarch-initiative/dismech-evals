        context: []
      assertion_type: Genetic
      assertion:
        name: RRM1
        gene_term:
          preferred_term: RRM1
          term:
            id: hgnc:10451
            label: RRM1
        relationship_type: CAUSATIVE
        notes: RRM1 is the catalytic subunit of ribonucleotide reductase, which makes deoxyribonucleotides
          for mtDNA replication. The two recessive alleles are p.R381H (c.1142G>A) and p.R381C (c.1141C>T).
          The dominant p.N427K catalytic-site variant causes a separate dominant disease and is excluded.
        variants:
        - name: R381H
          description: c.1142G>A; recessive loss-of-function; the consanguineous family 1 (MNGIE-like
            picture).
        - name: R381C
          description: c.1141C>T; recessive loss-of-function; affects the same residue as R381H, found
            in family 2 and proband 4.
      selected_evidence:
        snippet: 'We identified 3 RRM1 loss-of-function variants, including a dominant catalytic site
          variant (NP_001024.1: p.N427K) and 2 homozygous recessive variants at p.R381'
        supports: SUPPORT
