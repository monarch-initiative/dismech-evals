      assertion:
        name: Muscle mtDNA deletion analysis followed by nuclear gene sequencing
        description: 'The diagnostic route that defined this entity, and the one it recommends. Multiple
          mtDNA deletions in a muscle biopsy establish a nuclear mtDNA-maintenance defect but not which
          gene; targeted or exome sequencing then names it. Before 2012, DGUOK was not on the candidate
          list for an adult with muscle mtDNA deletions - it was an infantile liver gene - and the defining
          paper''s practical conclusion is precisely that it should be added.

          Note the ascertainment asymmetry this creates: every reported PEOB4 patient was found because
          someone had already demonstrated mtDNA deletions in their muscle. A DGUOK patient without a
          muscle biopsy is invisible to this route.'
      selected_evidence:
        snippet: These findings reinforce the concept that mutations in genes involved in deoxyribonucleotide
          metabolism can cause diverse clinical phenotypes and suggest that DGUOK should be screened in
          patients harbouring mitochondrial DNA deletions in skeletal muscle.
