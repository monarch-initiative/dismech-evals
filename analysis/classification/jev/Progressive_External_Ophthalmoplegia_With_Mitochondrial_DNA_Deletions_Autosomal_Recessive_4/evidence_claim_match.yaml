      assertion_type: DifferentialDiagnosis
      assertion:
        name: Autosomal recessive progressive external ophthalmoplegia 1 (POLG)
        description: PEOB1, caused by biallelic POLG variants, is the commonest recessive cause of adult
          PEO with multiple mtDNA deletions and presents in the same way - ptosis and ophthalmoplegia
          with a mitochondrial myopathy and multiple deletions in muscle. It is separated from PEOB4 only
          by sequencing, and it is curated in dismech as its own entry (`Autosomal_Recessive_Progressive_External_Ophthalmoplegia_1`).
          The distinction matters clinically because POLG disease carries an absolute contraindication
          to valproic acid that DGUOK disease does not.
      selected_evidence:
        snippet: Mutations in several nuclear genes (i.e., POLG, POLG2, TWNK, OPA1, DGUOK, MPV17, TYMP)
          impair mtDNA maintenance, leading to clinical syndromes characterized by mtDNA depletion and/or
          deletions in affected tissues.
        supports: SUPPORT
