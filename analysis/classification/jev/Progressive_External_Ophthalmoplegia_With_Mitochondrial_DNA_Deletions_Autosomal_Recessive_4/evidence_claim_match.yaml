                recessive 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Mitochondrial Purine Deoxyribonucleoside Salvage
        biological_scale: MOLECULAR
        description: The mitochondrial salvage pathway is how a post-mitotic cell obtains deoxyribonucleotides
          for mtDNA synthesis. A dividing cell makes dNTPs in the cytosol through ribonucleotide reductase,
          coupled to nuclear S phase; a neuron or a muscle fibre has no S phase, and depends on salvaging
          deoxyribonucleosides inside the matrix. Deoxyguanosine kinase supplies the purine half of that
          route. This is the standing explanation for why defects of mitochondrial nucleotide supply strike
          post-mitotic tissue hardest, and it is stated here as the accepted account rather than as something
          demonstrated in these patients.
        biological_processes:
        - preferred_term: purine nucleotide salvage
          modifier: DECREASED
          term:
            id: GO:0032261
            label: purine nucleotide salvage
      selected_evidence:
        snippet: Deoxyguanosine kinase (dGK) is an essential rate-limiting component of the mitochondrial
          purine nucleotide salvage pathway, encoded by the nuclear gene encoding deoxyguanosine kinase
          (DGUOK).
        supports: SUPPORT
