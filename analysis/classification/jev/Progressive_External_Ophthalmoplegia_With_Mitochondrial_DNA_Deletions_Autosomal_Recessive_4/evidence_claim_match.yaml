        name: DGUOK-related hepatocerebral mitochondrial DNA depletion syndrome
        description: 'The infantile form of the same enzyme deficiency, OMIM 251880: liver failure with
          neurological deterioration in the first days or weeks of life, with mtDNA depletion rather than
          deletions, and a generally poor prognosis. It is curated in dismech as `Mitochondrial_DNA_Depletion_Syndrome_3_Hepatocerebral_Type`.
          It is a differential only in the sense that it is the same gene at a different age - a family
          history of an infant death from liver failure is a diagnostic clue in an adult with unexplained
          mtDNA deletions, and one patient in the defining series had this phenotype herself before developing
          the adult one.'
      selected_evidence:
        snippet: The majority of affected individuals have the multisystem illness with hepatic disease
          (jaundice, cholestasis, hepatomegaly, and elevated transaminases) and neurologic manifestations
          (hypotonia, nystagmus, and developmental delay) evident within weeks of birth.
        supports: SUPPORT
