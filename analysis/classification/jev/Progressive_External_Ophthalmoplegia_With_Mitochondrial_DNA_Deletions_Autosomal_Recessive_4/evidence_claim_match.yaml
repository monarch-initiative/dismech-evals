          Brain letter whose full text could not be retrieved for this entry and which therefore cannot
          be quoted. What is citable here is weaker and is stated as such: parkinsonism is a recognised
          and prominent feature of the mtDNA-instability syndromes as a class, of which DGUOK-related
          disease is one, and multiple mtDNA deletions accumulate in nigral dopaminergic neurons with
          age and more so in Parkinson disease.'
        frequency: OCCASIONAL
        phenotype_term:
          preferred_term: Parkinsonism
          term:
            id: HP:0001300
            label: Parkinsonism
        notes: 'Graded OCCASIONAL, and the band is a judgement rather than a count: no source retrievable
          for this entry gives a numerator for parkinsonism in DGUOK-related disease. It is absent from
          the 2012 series'' description of its five subjects, which is itself informative. The DGUOK-specific
          report is PMID:29228108 (Caporali et al., Brain 2018, a Letter to the Editor); neither its PubMed
          record nor its DOI returned retrievable text, so it is deliberately not cited as evidence rather
          than cited without a verifiable quote. If a curator can obtain that text, it should replace
          the class-level evidence below.'
      selected_evidence:
        snippet: Moreover, parkinsonism has been frequently described as a prominent clinical feature
          in mtDNA instability syndromes.
