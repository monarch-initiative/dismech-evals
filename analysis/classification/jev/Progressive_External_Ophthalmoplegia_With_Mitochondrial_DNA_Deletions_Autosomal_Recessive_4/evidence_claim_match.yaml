            label: skeletal muscle fiber
      selected_evidence:
        snippet: Syndromes associated with mitochondrial DNA multiple deletions are caused by different
          molecular defects resulting in a wide spectrum of predominantly adult-onset clinical presentations,
          ranging from progressive external ophthalmoplegia to multi-systemic disorders of variable severity.
