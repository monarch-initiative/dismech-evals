        - path: /animal_models/0
          value:
            name: dguok-null zebrafish
            species: Zebrafish
            genotype: dguok-/- (CRISPR/Cas9 mutagenesis)
            publication: PMID:30428046
            description: 'A CRISPR/Cas9 dguok-knockout zebrafish line. It reproduces the mtDNA-depletion
              arm of the DGUOK phenotype - mutant fish have significantly reduced mtDNA levels - and was
              built to test nucleoside supplementation, which is the only mechanistically motivated therapeutic
              idea for this gene. The result was informative and unwelcome: supplementing juveniles with
              a single purine nucleoside reduced mtDNA copy number in mutants *and* in wild-type fish,
              contradicting earlier cell-culture work, while supplementing adult mutants with both purine
              nucleosides raised liver mtDNA copy number.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired and Error-Prone mtDNA Replication
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: A whole-animal demonstration that losing deoxyguanosine kinase reduces mtDNA content,
          which establishes the link from the enzyme to mtDNA maintenance in vivo.
        limitations: 'It models mtDNA *depletion*, which is the infantile hepatic phenotype, and not the
          multiple large-scale mtDNA *deletions* in skeletal muscle that define this entity - the copy-number
          readout says nothing about deletion burden, and the reported effect is in liver. A complete
          null in a fish also does not correspond to the human recessive alleles here, and the lifespan
          of the model cannot accommodate the decades of clonal expansion that make the human disease
          adult-onset. This is the most important caveat in the entry: the only animal model of the gene
          addresses the other end of its spectrum.'
        readouts:
        - name: mtDNA copy number in dguok-/- fish
          target: Impaired and Error-Prone mtDNA Replication
          direction: DECREASED
          interpretation: Mutant fish carry significantly less mtDNA than wild-type, establishing the
            enzyme's role in mtDNA maintenance in a whole animal.
      selected_evidence:
        snippet: In this study we developed a mutant dguok zebrafish (Danio rerio) line using CRISPR/Cas9
          mediated mutagenesis; dguok-/- fish have significantly reduced mtDNA levels compared with wild-type
          (wt) fish.
        supports: SUPPORT
    origin:
