      assertion_type: Pathophysiology
      assertion:
        name: Imbalanced Mitochondrial dNTP Pool
        biological_scale: MOLECULAR
        description: 'Losing one arm of matrix nucleotide supply does not simply lower every dNTP equally;
          it skews the pool, and a skewed pool is what damages replication. The zebrafish work makes that
          point from the other direction: supplementing juvenile fish with a single purine nucleoside
          *reduced* mtDNA copy number in both mutant and wild-type animals, which the authors attribute
          to nucleotide pool imbalance, while supplementing adult mutants with both purine nucleosides
          increased liver mtDNA copy number. Balance, not absolute supply, is the variable.

          No direct measurement of the mitochondrial dNTP pool in a PEOB4 patient is reported in the sources
          cited here; this node rests on the salvage-pathway biology above and on the model system below.'
      selected_evidence:
        snippet: When supplemented with only one purine nucleoside (dGuo), mtDNA copy number in both mutant
          and wt juvenile animals was significantly reduced, contrasting with previous cell culture studies,
          possibly because of nucleotide pool imbalance.
        supports: SUPPORT
        directness: INDIRECT
