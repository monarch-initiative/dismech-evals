      assertion:
        name: DGUOK
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: DGUOK
          term:
            id: hgnc:2858
            label: DGUOK
        notes: 'DGUOK encodes mitochondrial deoxyguanosine kinase. The gene-disease relationship is ClinGen-Definitive
          - much stronger than for most entities of this size - but the strength attaches to DGUOK-related
          mitochondrial disease as a whole rather than to this presentation specifically.

          The allelic series is the thing to understand before extending this entry. DGUOK carries three
          OMIM phenotype numbers, all recessive and all this gene: 251880, the classic infantile hepatocerebral
          mtDNA depletion syndrome; 617068, noncirrhotic portal hypertension 1; and 617070, this entity.
          The infantile form has its own entry, `Mitochondrial_DNA_Depletion_Syndrome_3_Hepatocerebral_Type`;
          the portal-hypertension form is curated only as a differential inside `Portal_Hypertension_Noncirrhotic_2`,
          which is a GIMAP5 disease.

          ClinGen has explicitly decided against that split. Its 2024 curation states that the various
          names given to DGUOK-related disease describe one primary mitochondrial disease and that the
          phenotype has been lumped into a single entity under its Lumping and Splitting Framework. This
          entry does not follow that decision, and the reason is recorded in the entry notes rather than
          left implicit.'
      selected_evidence:
        snippet: These findings reinforce the concept that mutations in genes involved in deoxyribonucleotide
          metabolism can cause diverse clinical phenotypes and suggest that DGUOK should be screened in
          patients harbouring mitochondrial DNA deletions in skeletal muscle.
        supports: SUPPORT
