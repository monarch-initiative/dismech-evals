          post-mitotic fibres before enough of them cross the biochemical threshold to produce symptoms,
          which takes decades - the same reasoning that applies across the multiple-mtDNA-deletion syndromes.
          Age at onset per subject is not given in the source available here.
      selected_evidence:
        snippet: Syndromes associated with mitochondrial DNA multiple deletions are caused by different
