        description: Recessive in all reported subjects. The 2012 series identified autosomal recessive
          DGUOK mutations in five independent adults, and ClinGen's expert panel independently classifies
          the DGUOK gene-disease relationship as autosomal recessive. DGUOK is nuclear-encoded and autosomal,
          so although the disease is expressed as mitochondrial DNA damage it segregates as an ordinary
          recessive trait, with a 25 percent sibling recurrence risk and no maternal transmission - which
          is the point that separates it from the primary mtDNA-deletion syndromes it phenocopies.
