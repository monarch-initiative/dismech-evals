  d22f1d707e2438e0f2e8d44eaf7658623bca1456c8e46343639685ac35a45e5d:
    claim:
      about:
        disease:
          name: Progressive External Ophthalmoplegia with Mitochondrial DNA Deletions, Autosomal Recessive
            4
          disease_term:
            preferred_term: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
              recessive 4
            term:
              id: MONDO:0014899
              label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
                recessive 4
        context: []
      assertion_type: Treatment
      assertion:
        name: Purine nucleoside supplementation
        description: 'Supplying deoxyribonucleosides to bypass the missing kinase step is the one mechanistically
          motivated therapeutic idea for DGUOK deficiency, and it remains preclinical. In the dguok-null
          zebrafish, supplementing adults with both purine nucleosides raised liver mtDNA copy number,
          but supplementing juveniles with deoxyguanosine alone *reduced* copy number in mutant and wild-type
          fish alike - a result that contradicted earlier cell-culture work and that the authors attribute
          to nucleotide pool imbalance.

          Two things follow, and both argue against reading this as an emerging therapy for PEOB4. The
          tested benefit is a liver copy-number readout in a depletion model, whereas this entity is a
          muscle deletion disorder; and the direction of effect depends on which nucleosides are given,
          so a partial regimen may be worse than none.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: purine deoxyribonucleoside supplementation
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: deoxyguanosine
            term:
              id: CHEBI:17172
              label: 2'-deoxyguanosine
          - preferred_term: deoxyadenosine
            term:
              id: CHEBI:17256
              label: 2'-deoxyadenosine
        notes: Preclinical only - no human trial, and no report of its use in a PEOB4 patient. No target_mechanisms
          link is declared even though the mechanism is clear, because a link would assert an effect on
          this entity's pathograph and the only evidence is a zebrafish liver readout in the depletion
          arm of the phenotype. The supporting and contradicting results are curated in full on the animal
          model above rather than summarised optimistically here.
      selected_evidence:
        snippet: However, in adult dguok-/- fish we detected a significant increase in liver mtDNA copy
          number when supplemented with both purine nucleosides.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
