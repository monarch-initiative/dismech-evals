  cf336fa31fc369f6a68e7a5bb0362186222e30bc428ead967acc7c9508eec91e:
    claim:
      about:
        disease:
          name: Progressive Familial Heart Block
          disease_term:
            preferred_term: Progressive familial heart block
            term:
              id: MONDO:0019490
              label: progressive familial heart block
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Inherited Conduction-System Ion-Channel Defect
        genes:
        - preferred_term: SCN5A
          term:
            id: hgnc:10593
            label: SCN5A
        - preferred_term: TRPM4
          term:
            id: hgnc:17993
            label: TRPM4
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant
        description: Progressive familial heart block originates in an inherited defect of a cardiac ion
          channel expressed in the conduction system. In the SCN5A (type 1A) form, loss-of-function variants
          cause haploinsufficiency for the cardiac sodium channel NaV1.5, reducing peak inward sodium
          current that drives the action-potential upstroke. In the TRPM4 (type 1B) form, gain-of-function
          variants impair channel endocytosis and increase surface density of the Ca2+-activated nonselective
          cation channel TRPM4, which is most highly expressed in Purkinje fibers. Both lesions perturb
          the excitability of conduction-system myocytes rather than producing a structural cardiomyopathy
          at onset.
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        - preferred_term: cardiac Purkinje fiber cell
          term:
            id: CL:0002068
            label: Purkinje myocyte
        - preferred_term: atrioventricular bundle (His) cell
          term:
            id: CL:0010005
            label: atrioventricular bundle cell
        molecular_functions:
        - preferred_term: voltage-gated sodium channel activity
          term:
            id: GO:0005248
            label: voltage-gated sodium channel activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: membrane depolarization during action potential
          term:
            id: GO:0086010
            label: membrane depolarization during action potential
          modifier: ABNORMAL
      selected_evidence:
        snippet: Functional studies show that the IVS.22+2 T-->C SCN5A mutation lead to exon 22 skipping
          and to a complete loss of function of the affected allele, but to a normal trafficking of the
          mutated gene product.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12598077
      reference_title: Haploinsufficiency in combination with aging causes SCN5A-linked hereditary Lenègre
        disease.
      evidence_source: IN_VITRO
      explanation: Demonstrates that the SCN5A variant produces a complete loss of function of the affected
        allele (haploinsufficiency), the molecular lesion of the type 1A form.
