      assertion_type: Genetic
      assertion:
        name: TRPM4 gain-of-function variants
        association: Causative
        relationship_type: CAUSATIVE
        subtype: Type 1B
        features: Gain-of-function TRPM4 variants increase cell-surface density of the Ca2+-activated
          nonselective cation channel TRPM4 through impaired endocytosis (constitutive SUMOylation), raising
          background cation current in the His-Purkinje system. The founding mutation (c.19G>A, p.E7K)
          was identified in a South African Afrikaner pedigree, and additional TRPM4 variants have since
          been reported in PCCD families.
        gene_term:
          preferred_term: TRPM4
          term:
            id: hgnc:17993
            label: TRPM4
      selected_evidence:
        snippet: Variations in TRPM4 have been shown to cause an increase in cell surface current density,
