      assertion:
        name: Type 1A
        display_name: Progressive familial heart block, type 1A (SCN5A)
        subtype_term:
          preferred_term: Progressive familial heart block, type 1A
          term:
            id: MONDO:0007240
            label: progressive familial heart block, type 1A
        description: SCN5A-associated form (hereditary Lenègre disease), caused by loss-of-function variants
          in SCN5A producing haploinsufficiency for the cardiac sodium channel NaV1.5. Reduced peak inward
          sodium current slows conduction, and in combination with aging leads to progressive conduction
          impairment and myocardial fibrosis of the His-Purkinje system. This locus overlaps the broader
          SCN5A-related cardiac rhythm disorder spectrum (including Brugada syndrome and the cardiac sodium-channel
          overlap syndrome).
        genes:
        - preferred_term: SCN5A
          term:
            id: hgnc:10593
            label: SCN5A
      selected_evidence:
        snippet: In a French family, we have identified a splicing mutation in the SCN5A gene leading
          to hereditary progressive cardiac conduction defect.
        supports: SUPPORT
