              a Ca2+-activated nonselective cation channel most highly expressed in Purkinje fibers. Impaired
              channel endocytosis raises TRPM4 density at the cardiomyocyte surface, producing a His-Purkinje
              bundle-branch conduction disease with autosomal-dominant inheritance.
            genes:
            - preferred_term: TRPM4
              term:
                id: hgnc:17993
