      assertion_type: Pathophysiology
      assertion:
        name: Syncope and Sudden Cardiac Death
        role: outcome
        description: High-grade and complete atrioventricular block produce bradyarrhythmia and ventricular
          asystole, causing syncope and Stokes-Adams attacks and, when the bradyarrhythmia is not corrected
          by pacing, sudden cardiac death. These endpoints define the clinical severity of progressive
          familial heart block and may be the sentinel manifestation.
      selected_evidence:
        snippet: whose younger brother died at 25 years of unexplained sudden cardiac death.
