        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Slowed His-Purkinje and Atrioventricular Conduction
        role: amplifier
        description: The ion-channel lesion is translated into slowed cardiac impulse conduction. Reduced
          sodium current (type 1A) lowers conduction velocity in the His-Purkinje system, while increased
          TRPM4-mediated background cation current (type 1B) disturbs Purkinje-fiber excitability. The
          cellular result is progressive prolongation of conduction intervals (P-wave, PR, and QRS) that
          worsens with age.
        cell_types:
        - preferred_term: cardiac Purkinje fiber cell
          term:
            id: CL:0002068
            label: Purkinje myocyte
        - preferred_term: atrioventricular bundle (His) cell
          term:
            id: CL:0010005
            label: atrioventricular bundle cell
        biological_processes:
        - preferred_term: cardiac conduction
          term:
            id: GO:0061337
            label: cardiac conduction
          modifier: DECREASED
        - preferred_term: regulation of cardiac conduction
          term:
            id: GO:1903779
            label: regulation of cardiac conduction
          modifier: DYSREGULATED
      selected_evidence:
        snippet: In Scn5a+/- mice, surface ECG recordings showed age-related lengthening of the P-wave
          and PR- and QRS-interval duration, coinciding with previous observations in patients with Lenègre's
          disease.
        supports: SUPPORT
    origin:
