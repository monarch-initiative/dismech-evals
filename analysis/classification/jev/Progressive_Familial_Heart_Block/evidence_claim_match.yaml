      assertion_type: Pathophysiology
      assertion:
        name: Progressive His-Purkinje Fibrosis and Degeneration
        role: amplifier
        description: In the Lenègre (SCN5A) form, the primary ion-channel defect, combined with aging,
          leads to progressive fibrosis and degeneration of the His bundle and its branches — the structural
          correlate that converts a subclinical conduction defect into advancing heart block. Mouse models
          demonstrate that a monogenic sodium-channel defect is sufficient to drive age-dependent myocardial
          fibrosis, establishing a channel-to-structure pathomechanism.
        cell_types:
        - preferred_term: cardiac fibroblast
          term:
            id: CL:0002548
            label: fibroblast of cardiac tissue
        - preferred_term: atrioventricular bundle (His) cell
          term:
            id: CL:0010005
            label: atrioventricular bundle cell
        biological_processes:
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: INCREASED
      selected_evidence:
        snippet: Progressive cardiac conduction defect is a frequent disease commonly attributed to degeneration
          and fibrosis of the His bundle and its branches.
        supports: SUPPORT
