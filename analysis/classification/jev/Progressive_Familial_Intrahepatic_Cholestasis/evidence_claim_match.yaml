  78a79ef9ceafc7127fc89ed55abb4ece53abe7b6ce3de442a561cf62d4fbc13a:
    claim:
      about:
        disease:
          name: Progressive Familial Intrahepatic Cholestasis
          disease_term:
            preferred_term: progressive familial intrahepatic cholestasis
            term:
              id: MONDO:0015762
              label: progressive familial intrahepatic cholestasis
        context: []
      assertion_type: Biochemical
      assertion:
        name: Serum gamma-glutamyltransferase
        presence: Variable by subtype - low or normal in ATP8B1, ABCB11, TJP2, NR1H4, USP53 and MYO5B
          disease, elevated in ABCB4 disease and in KIF12- and ZFYVE19-related disease
        context: The central diagnostic axis of PFIC. GGT is a GPI-anchored ectoenzyme of the cholangiocyte
          apical membrane and of the hepatocyte canalicular membrane; its appearance in serum during cholestasis
          requires bile-salt-mediated solubilization of that membrane. In ABCB4/MDR3 deficiency, bile
          lacks the phosphatidylcholine needed to sequester bile salts into mixed micelles, so free detergent
          bile salts strip the biliary epithelium and GGT rises. In the canalicular transport, tight junction,
          nuclear receptor and trafficking defects the biliary epithelium is not the primary target and
          GGT stays low or normal despite profound cholestasis. A low or normal GGT in a cholestatic infant
          is therefore a strongly informative positive finding, not a reassuring one.
        specificity: High for subtype triage within genetic cholestasis, but not for PFIC versus other
          causes - biliary atresia and other obstructive cholangiopathies are also high-GGT, and bile
          acid synthesis defects are also low-GGT.
        biomarker_term:
          preferred_term: Gamma-Glutamyl Transpeptidase
          term:
            id: NCIT:C37959
            label: Gamma-Glutamyl Transpeptidase
        mappings_list:
        - preferred_term: Gamma glutamyl transferase [Enzymatic activity/volume] in Serum or Plasma
          term:
            id: LOINC:2324-2
            label: Gamma glutamyl transferase [Enzymatic activity/volume] in Serum or Plasma
        reference_ranges:
        - loinc_term:
            id: LOINC:2324-2
            label: Gamma glutamyl transferase [Enzymatic activity/volume] in Serum or Plasma
          upper_bound: 50.0
          unit: U/L
          population: children beyond the neonatal period
          notes: 'Provenance: general clinical laboratory convention for paediatric serum GGT beyond the
            neonatal period, not a PFIC-specific published interval; no citable numeric interval was available
            in the sources used for this entry, so no evidence item is attached. Neonatal GGT is physiologically
            higher. The bands below encode the pragmatic cholestasis-clinic split rather than an assay
            reference interval.'
          interpretation_bands:
          - name: Low/normal-GGT cholestasis pattern
            upper_bound: 100.0
            unit: U/L
            abnormal_flag: NORMAL
            interpretation: A GGT below roughly 100 U/L in a cholestatic child directs testing to ATP8B1,
              ABCB11, TJP2, NR1H4, USP53 and MYO5B (and to bile acid synthesis defects as the main non-PFIC
              alternative).
          - name: High-GGT cholestasis pattern
            lower_bound: 100.0
            unit: U/L
            abnormal_flag: HIGH
            phenotype_term:
              preferred_term: Elevated gamma-glutamyltransferase level
              term:
                id: HP:0030948
                label: Elevated gamma-glutamyltransferase level
            interpretation: A GGT above roughly 100 U/L in a cholestatic child directs testing to ABCB4,
              and to the newer KIF12 and ZFYVE19 cholestases, after biliary obstruction and biliary atresia
              have been excluded.
        readouts:
        - target: Unbuffered Bile Salt Injury to the Cholangiocyte
          relationship: READOUT_OF
          endpoint_context: DIAGNOSTIC
          description: Serum GGT reports on whether the biliary epithelium is being attacked by unbuffered
            bile salts, which is exactly what separates ABCB4 disease from the hepatocyte-restricted subtypes.
      selected_evidence:
        snippet: "cholestatic \nliver disease with high GGT in 3 previously undiagnosed children"
        supports: SUPPORT
