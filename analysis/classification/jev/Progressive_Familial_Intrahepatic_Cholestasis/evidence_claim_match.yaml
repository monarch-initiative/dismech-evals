  d40d63d19a27c3e9f89606c483d5f325901542ea4e2592e9f92d8660c8852ea1:
    claim:
      about:
        disease:
          name: Progressive Familial Intrahepatic Cholestasis
          disease_term:
            preferred_term: progressive familial intrahepatic cholestasis
            term:
              id: MONDO:0015762
              label: progressive familial intrahepatic cholestasis
        context: []
      assertion_type: Treatment
      assertion:
        name: Liver transplantation
        description: 'Definitive therapy for end-stage liver disease, unresectable hepatocellular carcinoma,
          severe portal hypertension, or pruritus and growth failure refractory to diversion and IBAT
          inhibition. Two subtype-specific caveats matter. In ATP8B1 disease, transplantation replaces
          only the hepatic compartment: secretory diarrhoea persists or worsens and is associated with
          allograft steatosis and fibrosis that can require re-transplantation, and hearing loss is unaffected
          - so PFIC1 is the one subtype where transplantation can make an extrahepatic manifestation worse.
          In ABCB11 disease, alloantibodies against the BSEP extracellular loop can produce an immune-mediated
          functional recurrence of BSEP deficiency in the graft. In MYO5B disease with microvillus inclusion
          disease, combined liver-intestinal transplantation or intestinal transplantation with biliary
          diversion is preferred.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Liver Transplantation
          term:
            id: NCIT:C15271
            label: Liver Transplantation
      selected_evidence:
        snippet: "However, most PFIC patients are ultimately candidates \nfor liver transplantation."
        supports: SUPPORT
    origin:
      assertion_path: /treatments/8
      evidence_path: /treatments/8/evidence/0
