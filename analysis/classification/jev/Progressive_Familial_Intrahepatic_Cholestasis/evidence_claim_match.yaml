              term:
                id: hgnc:42
                label: ABCB11
            notes: The authors state that despite these limitations there are currently no better alternatives,
              which is why the model is recorded as PARTIALLY_RECAPITULATES with MODERATE fidelity rather
              than being discounted.
          role: ancestor
        - path: /animal_models/0/modeled_mechanisms/0
          value:
            target: BSEP-Mediated Bile Salt Export Failure
            relationship: PARTIALLY_RECAPITULATES
            fidelity: MODERATE
            description: Loss of Abcb11 abolishes canalicular BSEP, reproducing the export failure that
              defines PFIC2, with a drastic reduction of bile acids in bile and intestine.
            limitations: 'Three limitations bound what this model can say about human PFIC2. First, serum
              bile acids are not a usable readout: the authors report very high variability and no difference
              between knockout and wild-type animals, and they name this a limitation of the model because
              serum bile acid is a clinically significant PFIC2 biomarker in patients - this entry curates
              "Total serum bile acids" as a biochemical marker, so the model is silent on it. Second,
              C57BL/6 knockouts show strong sex differences with clearer onset in females, and only female
              animals were studied. Third, AAV8 transduction is not homogeneous and spares periportal
              hepatocytes, the very cells that take up bile salts from the enterohepatic circulation,
              which the authors link to the merely partial reversion of hepatomegaly. Fibrosis in the
              model is mild, variable, and regional, so the null fibrosis result is uninformative rather
              than negative.'
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Bile acid concentration in gallbladder bile and small intestine
        target: BSEP-Mediated Bile Salt Export Failure
        direction: RESTORED
        interpretation: Functional readout of canalicular bile salt export. Restored to more than 55%
          of wild-type levels at the highest vector dose, and the measure through which this model reports
