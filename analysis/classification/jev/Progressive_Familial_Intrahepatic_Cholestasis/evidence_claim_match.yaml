        description: BSEP and MDR3 immunohistochemistry on liver biopsy supports but does not replace
          genetic diagnosis. Immunohistochemically detectable BSEP is typically absent or much reduced
          in severe ABCB11 disease; MDR3 staining is absent, decreased or - where the defect is functional
          rather than expressive - normal in ABCB4 disease; in MYO5B disease BSEP and MDR3 are present
          but abnormally localized, which is the diagnostic signature of a trafficking rather than a transporter
          lesion.
