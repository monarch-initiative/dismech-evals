            term:
              id: MONDO:0015762
              label: progressive familial intrahepatic cholestasis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Enterohepatic Bile Acid Recirculation
        biological_scale: ORGANISM
        role: therapeutic_vulnerability
        description: 'Roughly 95% of secreted bile acids are reclaimed from the terminal ileum by the
          apical sodium-dependent ileal bile acid transporter (IBAT/ASBT, SLC10A2) and returned to the
          liver in the portal blood. In PFIC this recycling loop continuously re-delivers a bile acid
          load that the diseased hepatocyte cannot handle, sustaining hepatocellular bile salt retention
          - so within the pathograph it acts as an amplifier of the central effector node. That also makes
          it the single most exploitable therapeutic node in PFIC: interrupting it - surgically by partial
          external or internal biliary diversion or ileal exclusion, or pharmacologically by IBAT inhibition
          with odevixibat or maralixibat - diverts bile acids into the faeces, lowers serum bile acids,
          and relieves pruritus. Response is genotype-dependent: reducing enterohepatic return cannot
          help when canalicular export is completely absent, so patients with complete BSEP loss respond
          poorly.'
        biological_processes:
        - preferred_term: bile acid and bile salt transport
          term:
            id: GO:0015721
            label: bile acid and bile salt transport
          modifier: INCREASED
        gene:
          preferred_term: SLC10A2
          term:
            id: hgnc:10906
            label: SLC10A2
        cell_types:
        - preferred_term: enterocyte
          term:
            id: CL:0000584
            label: enterocyte
        locations:
        - preferred_term: ileum
          term:
            id: UBERON:0002116
            label: ileum
      selected_evidence:
        snippet: "Odevixibat, administered as once a day oral capsules, is a non-surgical, \npharmacological\
          \ option to interrupt the enterohepatic circulation in patients \nwith PFIC."
        supports: SUPPORT
