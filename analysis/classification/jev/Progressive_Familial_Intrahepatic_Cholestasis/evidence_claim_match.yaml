              label: progressive familial intrahepatic cholestasis
        context: []
      assertion_type: Treatment
      assertion:
        name: Surgical biliary diversion
        description: 'Partial external biliary diversion (a cholecystojejunal cutaneous stoma), partial
          internal biliary diversion (a gallbladder-to-colon neo-conduit) or ileal exclusion, all of which
          interrupt the enterohepatic circulation surgically. The oldest disease-modifying therapy in
          PFIC: it reduces pruritus and serum bile acids and can slow or even reverse fibrosis, allowing
          many patients to keep their native liver. Response is genotype-dependent in the same way as
          IBAT inhibition - patients retaining residual transporter function do better - and complications
          include stoma problems, diarrhoea, malabsorption and recurrent pruritus. In PFIC1 patients coming
          to transplant, ileal diversion is sometimes performed at the same operation to protect the graft
          from steatosis.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Surgical Procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        target_phenotypes:
        - preferred_term: Pruritus
          term:
            id: HP:0000989
            label: Pruritus
      selected_evidence:
        snippet: "In \nsome PFIC1 and PFIC2 patients, biliary diversion may also relieve pruritus and\
          \ \nslow disease progression."
        supports: SUPPORT
