            publication: PMID:42579774
            description: Constitutive Abcb11 knockout on a C57BL/6 background, the model in which VTX-802
              liver-directed gene therapy was evaluated. It reproduces impaired bile acid secretion into
              gallbladder bile and small intestine, chronic liver damage, and hepatomegaly, but not the
