  cfff423d0d60614db86564b921c966e8ab4a6a48b04ce7bd9e6ff2170667f59f:
    claim:
      about:
        disease:
          name: Progressive Familial Intrahepatic Cholestasis
          disease_term:
            preferred_term: progressive familial intrahepatic cholestasis
            term:
              id: MONDO:0015762
              label: progressive familial intrahepatic cholestasis
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Benign recurrent intrahepatic cholestasis
        disease_term:
          preferred_term: benign recurrent intrahepatic cholestasis
          term:
            id: MONDO:0019008
            label: benign recurrent intrahepatic cholestasis
        description: The allelic neighbour, not merely a look-alike. BRIC1 and BRIC2 are caused by variants
          in the SAME genes as PFIC1 and PFIC2 (ATP8B1 and ABCB11), so a genetic result alone does not
          distinguish them. They sit at opposite ends of one continuum, and the distinction is made phenotypically
          and mechanistically rather than by gene.
        distinguishing_features:
        - BRIC causes episodic, self-limiting attacks of cholestasis with complete symptomatic resolution
          between episodes, whereas PFIC is persistent and progresses to end-stage liver disease.
        - The molecular basis of the split is residual canalicular protein - PFIC1 missense mutants are
          entirely absent from the canalicular membrane, whereas BRIC1 and ICP mutants retain canalicular
          expression.
        - The boundary is permeable in both directions; some BRIC cases transition to persistent progressive
          disease, and individuals with ATP8B1 deficiency can shift over time from the episodic to the
          persistent end of the spectrum, so the label "benign" is not a guarantee.
        - Hepatic fibrosis can be present early even at the mild end of the ATP8B1 spectrum.
        notes: Because BRIC is allelic rather than merely phenotypically similar, a low-GGT cholestasis
          panel result naming ATP8B1 or ABCB11 must be interpreted together with the clinical course;
          the gene alone does not assign the PFIC versus BRIC label.
      selected_evidence:
        snippet: "Whereas PFIC1 is a progressive, endstage liver \ndisease, BRIC1 patients suffer from\
          \ episodic periods of cholestasis that resolve \nspontaneously."
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/2
      evidence_path: /differential_diagnoses/2/evidence/1
