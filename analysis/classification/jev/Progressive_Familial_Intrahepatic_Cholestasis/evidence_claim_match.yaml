      assertion:
        name: Alagille syndrome
        disease_term:
          preferred_term: Alagille syndrome
          term:
            id: MONDO:0007318
            label: Alagille syndrome
        description: The principal syndromic cholestatic differential. Alagille syndrome shares early-onset
          cholestasis, intractable pruritus and IBAT-inhibitor responsiveness with PFIC, and the dismech
          Alagille entry already lists PFIC as a differential in the reciprocal direction.
        distinguishing_features:
        - Autosomal dominant (JAG1, less often NOTCH2) versus autosomal recessive in PFIC.
        - A multisystem Notch developmental disorder in which cholestasis arises from paucity of interlobular
          bile ducts, accompanied by peripheral pulmonary artery stenosis or other congenital heart disease,
          posterior embryotoxon, butterfly vertebrae, characteristic facies and renal anomalies.
        - PFIC is a hepatocellular bile-formation disorder with a normal biliary tree and no developmental
          extrahepatic syndrome; the extrahepatic features of PFIC1 are functional consequences of FIC1
          loss in other tissues, not malformations.
        - Serum GGT is characteristically elevated in Alagille syndrome, which separates it from the low-GGT
          PFIC subtypes though not from PFIC3.
      selected_evidence:
        snippet: "Diagnosis is based on \nclinical manifestations, liver ultrasonography, cholangiography\
          \ and liver \nhistology, as well as on specific tests to exclude other causes of childhood \n\
          cholestasis."
        supports: SUPPORT
