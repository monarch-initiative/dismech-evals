      assertion:
        name: Unbuffered Bile Salt Injury to the Cholangiocyte
        conforms_to: cholestatic_liver_injury#Bile Acid-Mediated Hepatocyte and Cholangiocyte Injury
        biological_scale: CELLULAR
        role: effector
        description: This node is the mechanistic pivot of the GGT split. In health, biliary phosphatidylcholine
          sequesters bile salts into mixed micelles that are non-toxic to the biliary epithelium. When
          MDR3 is absent (and in the newer high-GGT forms KIF12 and ZFYVE19), free bile salts strip the
          cholangiocyte apical membrane, on which gamma-glutamyltransferase is a GPI-anchored ectoenzyme;
          membrane damage releases GGT into bile and serum. In the low-GGT subtypes (ATP8B1, ABCB11, TJP2,
          NR1H4, USP53, MYO5B) the cholangiocyte is not the primary target, biliary GGT is not shed, and
          serum GGT stays low or normal despite profound cholestasis. Cholangiocyte injury also drives
          the ductular reaction, portal fibrosis and bile duct proliferation seen on PFIC3 biopsy.
        cell_types:
        - preferred_term: intrahepatic cholangiocyte
