        display_name: USP53-related low-GGT cholestasis (PFIC7)
        subtype_term:
          preferred_term: cholestasis, progressive familial intrahepatic, 7, with or without hearing loss
          term:
            id: MONDO:0030503
            label: cholestasis, progressive familial intrahepatic, 7, with or without hearing loss
        description: Biallelic USP53 variants cause low-GGT cholestasis; USP53 co-localizes with the TJP2-associated
          tight junction complex, placing it mechanistically alongside PFIC4. Cholestasis tends to be
          biochemically milder and intermittent and to respond to medication, but liver fibrosis and splenomegaly
          are common on follow-up, so this is not a benign entity. The OMIM/MONDO series numbers this
          PFIC7 and notes that a subset of patients develop childhood-onset hearing loss - a second route
          to sensorineural deafness in PFIC distinct from the ATP8B1 mechanism. Subtype numbering for
          the newer genes is not standardized across the clinical literature, so gene-first naming is
          used here deliberately with the series number carried in `display_name` and `subtype_term`.
        genes:
        - preferred_term: USP53
          term:
            id: hgnc:29255
            label: USP53
      selected_evidence:
        snippet: "We have now identified biallelic mutation in USP53 in 7 \nfurther patients with cholestasis,\
          \ from 5 families."
        supports: SUPPORT
