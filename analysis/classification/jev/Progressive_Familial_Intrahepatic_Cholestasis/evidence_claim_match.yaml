        snippet: "Although mild-to-moderate ATP8B1 deficiency initially was \nthought to involve intermittent\
          \ symptomatic cholestasis with a lack of hepatic \nfibrosis, it is now known that hepatic fibrosis\
          \ may be present early in the \ndisease course."
        supports: SUPPORT
