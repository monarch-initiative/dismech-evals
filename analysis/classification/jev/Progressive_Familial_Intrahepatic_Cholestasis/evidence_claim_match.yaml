        description: The most urgent differential in a cholestatic neonate, because the Kasai portoenterostomy
          is time-critical.
        distinguishing_features:
        - An acquired obliterative extrahepatic cholangiopathy with a high GGT, acholic stools, an absent
          or abnormal gallbladder on ultrasound and an abnormal intraoperative cholangiogram.
        - PFIC has a patent biliary tree with a normal cholangiogram, and the low-GGT PFIC subtypes are
          separated biochemically at the bedside.
        - A normal cholangiogram was precisely what excluded biliary atresia in the reported ZFYVE19 high-GGT
          case, showing that GGT alone cannot make this distinction.
      selected_evidence:
        snippet: "Despite fibrosis/cirrhosis and biliary ducts proliferation \non liver biopsy suggested\
