          term:
            id: MONDO:0011214
            label: progressive familial intrahepatic cholestasis type 3
        description: Biallelic ABCB4 variants impair the MDR3 phosphatidylcholine floppase, so bile is
          phospholipid-poor. This is the one classical PFIC subtype with a HIGH serum GGT, because unbuffered
          bile salts injure the biliary epithelium. Onset is typically later than PFIC1/PFIC2 - late infancy
          through young adulthood - with portal fibrosis, bile duct proliferation and cholelithiasis,
          and it is the subtype most likely to respond to ursodeoxycholic acid.
        genes:
        - preferred_term: ABCB4
          term:
            id: hgnc:45
            label: ABCB4
      selected_evidence:
        snippet: "Several ABCB4 mutations have been identified in \nchildren with PFIC3 and are associated\
          \ with low level of phospholipids in bile \nleading to a high biliary cholesterol saturation\
          \ index."
        supports: SUPPORT
