      assertion_type: DifferentialDiagnosis
      assertion:
        name: Inborn errors of bile acid synthesis
        disease_term:
          preferred_term: inborn disorder of bile acid synthesis
          term:
            id: MONDO:0019218
            label: inborn disorder of bile acid synthesis
        description: The other major cause of LOW-GGT neonatal cholestasis, and therefore the differential
          that the GGT split cannot resolve.
        distinguishing_features:
        - Bile acid synthesis defects produce low-GGT cholestasis with characteristically low or normal
          serum bile acids, because the defect is in making bile acids rather than in exporting them -
          the opposite of the markedly elevated serum bile acids of PFIC.
        - Urinary bile acid mass spectrometry identifies the accumulating atypical intermediates and is
          the discriminating test.
        - The distinction is therapeutically decisive because bile acid synthesis defects respond to primary
          bile acid replacement.
      selected_evidence:
        snippet: "MDR3 and BSEP liver immunostaining, and analysis of biliary lipid \ncomposition should\
          \ help to select PFIC candidates for whom genotyping could be \nproposed to confirm the diagnosis."
        supports: SUPPORT
