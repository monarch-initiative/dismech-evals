        description: A routine part of the neonatal cholestasis work-up and one of the commonest genetic
          causes of childhood liver disease.
        distinguishing_features:
        - SERPINA1 Pi*ZZ disease with a low serum alpha-1-antitrypsin level and a characteristic Pi phenotype
          on protease inhibitor typing.
        - PAS-positive diastase-resistant hepatocyte inclusions on liver biopsy.
        - An associated adult pulmonary emphysema risk that is absent from PFIC.
        - The liver injury mechanism is retained-polymer proteotoxicity in the hepatocyte endoplasmic
          reticulum rather than a bile transport defect, and pruritus is not the dominant symptom.
      selected_evidence:
