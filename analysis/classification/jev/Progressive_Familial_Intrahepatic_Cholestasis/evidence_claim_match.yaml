      assertion_type: Treatment
      assertion:
        name: Liver-directed gene therapy (AAV-ABCB11)
        description: 'AAV-mediated gene supplementation restoring hepatic BSEP (ABCB11 product) expression
          in PFIC2. VTX-802, an AAV8 vector carrying a codon-optimized human ABCB11 cDNA under a liver-specific
          constitutive promoter, showed sustained BSEP expression and partial disease correction in a
          PFIC2 mouse model. A single intravenous injection of VTX-802 (at doses of 6×10¹³ to 1.8×10¹⁴
          vector genomes/kg) produced dose-dependent improvements in serum transaminase levels (ALT and
          AST approaching normal range at the highest dose), increased bile acid secretion into gallbladder
          bile (reaching >55% of wild-type levels at the highest dose), increased intestinal bile acid
          levels, and a significant but only partial correction of hepatomegaly. Transgene expression
          and BSEP functionality were sustained through the study endpoint at 15 weeks post-treatment
          (about 4 months). Liver fibrosis did not improve: Sirius Red staining showed no major difference
          in overall fibrosis at any dose, with only a trend to reduction in some treated groups. That
          null result is load-bearing for this entry, because it is fibrosis progressing to cirrhosis
          - not transaminase elevation - that drives PFIC2 patients to transplantation, and the entry
          curates "Hepatic Stellate Cell Activation and Biliary Fibrosis" as a mechanism. The authors
          attribute the null to the model rather than to the therapy: fibrosis in these mice is very mild,
          highly variable, and regional. All efficacy data are preclinical, from female knockout mice
          only; unlike the other agents curated in this section, VTX-802 has no human efficacy data and
          no regulatory approval. See the "Abcb11-/- (BSEP knockout) mouse" entry under `animal_models`
          and discussion `pfic2_mouse_model_fidelity` for the model''s limitations. VTX-802 represents
          the first gene therapy approach for PFIC2, potentially benefiting patients with BSEP-deficiency
          who have limited treatment options (particularly those with truncating mutations unresponsive
          to IBAT inhibitors) and offering the possibility of combination therapy with IBAT inhibition.'
