      assertion_type: Pathophysiology
      assertion:
        name: Reduced Intestinal Bile Acid Delivery and Fat Malabsorption
        biological_scale: ORGANISM
        role: consequence
        description: Bile that never reaches the duodenum cannot form the mixed micelles needed to solubilize
          dietary long-chain triglyceride and the fat-soluble vitamins A, D, E and K. The result is steatorrhoea,
          energy deficit despite adequate intake, growth failure and short stature, and fat-soluble vitamin
          deficiency with rickets and coagulopathy. This is why nutritional management uses medium-chain
          triglyceride formulas, which are absorbed without micellar solubilization, alongside aggressive
          fat-soluble vitamin replacement.
        locations:
        - preferred_term: small intestine
          term:
            id: UBERON:0002108
            label: small intestine
      selected_evidence:
        snippet: "Poor \ngrowth may require medium-chain triglyceride-based formulas; fat-soluble vitamin\
          \ \ndeficiencies are treated symptomatically."
        supports: SUPPORT
