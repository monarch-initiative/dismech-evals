  9f0a851749ad73fe2759a93c4ffc4e937f7e6abe00838c4d7fd4bc8d1c2cd4d4:
    claim:
      about:
        disease:
          name: Progressive Familial Intrahepatic Cholestasis
          disease_term:
            preferred_term: progressive familial intrahepatic cholestasis
            term:
              id: MONDO:0015762
              label: progressive familial intrahepatic cholestasis
        context: []
      assertion_type: Biochemical
      assertion:
        name: Serum conjugated (direct) bilirubin
        presence: Elevated
        context: 'The laboratory definition of cholestasis and the gateway test for the whole PFIC differential.
          Unlike the GGT reference range, this one has a genuinely citable consensus threshold: cholestasis
          in infancy is defined as a conjugated/direct bilirubin above 1 mg/dL and more than 20% of total
          bilirubin, a threshold recently lowered from the historical arbitrary 2 mg/dL. In the first
          days of life even lower values (>0.3-0.5 mg/dL, or >10% of total) are treated as abnormal.'
        specificity: Sensitive for cholestasis but not specific for PFIC - it is shared with biliary atresia
          and the whole neonatal cholestasis differential. Its role here is to trigger the work-up, after
          which serum GGT performs the subtype triage.
        biomarker_term:
          preferred_term: Direct Bilirubin Measurement
          term:
            id: NCIT:C64481
