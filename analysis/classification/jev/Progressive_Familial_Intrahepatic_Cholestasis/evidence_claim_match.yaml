        biological_scale: TISSUE
        role: consequence
        conforms_to: fibrotic_response#Mesenchymal Cell Activation
        description: Sustained bile-salt-mediated hepatocyte injury (low-GGT subtypes) and cholangiocyte
          injury with ductular reaction (high-GGT subtypes) both converge on activation of hepatic stellate
          cells into collagen-secreting myofibroblasts. Progressive portal and lobular fibrosis becomes
          biliary cirrhosis with portal hypertension and synthetic failure, typically before adulthood
          in untreated disease. Fibrosis may be present early even in phenotypically mild ATP8B1 disease,
          which is why the historical assumption that intermittent cholestasis is non-fibrotic has been
          abandoned.
        cell_types:
