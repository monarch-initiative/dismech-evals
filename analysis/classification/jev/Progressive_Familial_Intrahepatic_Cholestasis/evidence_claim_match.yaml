      assertion_type: Pathophysiology
      assertion:
        name: Canalicular Tight Junction Failure and Paracellular Bile Reflux
        biological_scale: CELLULAR
        role: trigger
        description: TJP2 (ZO-2) is a cytosolic scaffold that anchors claudins at the tight junctions
          sealing the bile canaliculus. Biallelic protein-truncating TJP2 variants abolish the protein;
          claudin-1 is expressed at normal levels but fails to localize to the junction, and tight junctions
          appear elongated and lose their densest zonula occludens material. The seal that normally confines
          detergent bile salts to the canalicular lumen is lost, permitting paracellular reflux of toxic
          bile constituents into the hepatocyte and the space of Disse.
        genes:
        - preferred_term: TJP2
          term:
            id: hgnc:11828
            label: TJP2
        biological_processes:
        - preferred_term: tight junction assembly
          term:
            id: GO:0120192
            label: tight junction assembly
          modifier: DECREASED
        cellular_components:
        - preferred_term: bicellular tight junction
          term:
            id: GO:0005923
            label: bicellular tight junction
          modifier: ABNORMAL
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        subtypes:
        - PFIC4
      selected_evidence:
        snippet: In the unusually hostile environment of the canalicular and cholangiocytic membranes,
          exposed as these are to high concentrations of detergent bile acids, expression of TJP2 may
          be essential for hepatobiliary integrity
        supports: SUPPORT
