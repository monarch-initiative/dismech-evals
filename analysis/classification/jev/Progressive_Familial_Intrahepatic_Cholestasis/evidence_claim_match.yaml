            term:
              id: MONDO:0015762
              label: progressive familial intrahepatic cholestasis
        context: []
      assertion_type: Treatment
      assertion:
        name: Odevixibat
        description: Once-daily oral inhibitor of the ileal bile acid transporter (IBAT/ASBT, SLC10A2)
          that blocks reabsorption of bile acids in the terminal ileum, diverting them into the faeces
          and lowering the bile acid load returned to the liver - a pharmacological equivalent of surgical
          biliary diversion. In the PEDFIC 1 phase 3 trial in PFIC1 and PFIC2, odevixibat significantly
          improved pruritus (55% vs 30% positive pruritus assessments) and serum bile acid response (33%
          vs 0%). Approved in 2021 in the EU for PFIC and in the US for PFIC-associated pruritus. Response
          is genotype-dependent - patients with complete loss of BSEP protein do not respond consistently,
          because reducing enterohepatic return cannot compensate for absent canalicular export. Diarrhoea
          and frequent bowel movements are the characteristic class effect, reported in 31% of odevixibat-treated
          versus 10% of placebo-treated patients in PEDFIC 1.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: odevixibat
            term:
              id: NCIT:C166598
              label: Odevixibat
        target_phenotypes:
        - preferred_term: Pruritus
          term:
            id: HP:0000989
            label: Pruritus
        - preferred_term: Increased serum bile acid concentration
          term:
            id: HP:0012202
            label: Increased serum bile acid concentration
      selected_evidence:
        snippet: "The most common treatment-emergent adverse events (TEAEs) \nwere diarrhoea or frequent\
          \ bowel movements"
        supports: SUPPORT
    origin:
