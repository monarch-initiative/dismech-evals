        - path: /treatments/6
          value:
            name: AAV-ABCB11 Gene Therapy
            description: 'Liver-directed adeno-associated virus (AAV) vector delivery of the ABCB11 gene
              encoding the bile salt export pump (BSEP). VTX-802, which uses a constitutive promoter for
              ABCB11 expression, was evaluated in a PFIC2 mouse model and showed sustained, dose-dependent
              improvement: treated mice displayed significant correction of serum transaminase elevation
              and significant, but partial, correction of hepatomegaly, with increased bile acid levels
              in bile and small intestine. This represents an emerging gene-therapy approach that directly
              restores the deficient transporter function in monogenic BSEP-deficiency disease. As a preclinical
              proof-of-concept, the work provides mechanistic evidence for in vivo BSEP restoration and
              primes the platform for clinical translation.'
            therapeutic_modality: GENE_THERAPY
            treatment_term:
              preferred_term: Gene Therapy
