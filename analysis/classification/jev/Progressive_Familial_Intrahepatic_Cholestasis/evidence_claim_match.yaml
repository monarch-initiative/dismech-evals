          term:
            id: MONDO:0008892
            label: progressive familial intrahepatic cholestasis type 1
        description: Biallelic ATP8B1 variants abolish the canalicular FIC1 aminophospholipid flippase.
          Low/normal-GGT cholestasis presents in the first months of life. Because FIC1 is broadly expressed
          outside the liver, PFIC1 is distinguished by extrahepatic features - secretory diarrhoea, pancreatic
          insufficiency, elevated sweat chloride, short stature and sensorineural hearing loss - none
          of which is corrected by liver transplantation.
        genes:
        - preferred_term: ATP8B1
          term:
            id: hgnc:3706
            label: ATP8B1
      selected_evidence:
        snippet: Affected children frequently exhibit profound diarrhea, poor growth, short stature, pancreatic
          insufficiency, elevated sweat chloride, and sensorineural deafness
        supports: SUPPORT
