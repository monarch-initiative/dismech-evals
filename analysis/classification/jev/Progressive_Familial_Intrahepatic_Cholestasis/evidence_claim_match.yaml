      assertion:
        name: Serum GGT-based subtype triage in cholestatic infants
        description: In an infant with confirmed cholestasis and no biliary obstruction, the serum GGT
          partitions the differential and directs genetic testing. A low or normal GGT despite marked
          cholestasis points to ATP8B1, ABCB11, TJP2, NR1H4, USP53 or MYO5B; a high GGT points to ABCB4
          and to the newer KIF12 and ZFYVE19 cholestases, once biliary atresia, choledochal cyst and other
          obstructive cholangiopathies have been excluded by ultrasound and, where indicated, cholangiography.
      selected_evidence:
        snippet: "Serum gamma-glutamyltransferase (GGT) activity is normal in PFIC1 and \nPFIC2 patients,\
          \ but is elevated in PFIC3 patients."
        supports: SUPPORT
