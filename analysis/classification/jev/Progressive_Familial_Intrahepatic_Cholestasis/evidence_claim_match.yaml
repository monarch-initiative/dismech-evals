  3de609e93a2426b39b04390d66e4947ac7ab78ad980fd6d1537454042ff3d172:
    claim:
      about:
        disease:
          name: Progressive Familial Intrahepatic Cholestasis
          disease_term:
            preferred_term: progressive familial intrahepatic cholestasis
            term:
              id: MONDO:0015762
              label: progressive familial intrahepatic cholestasis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pfic2_mouse_model_fidelity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does bile-acid secretion restored in the Abcb11-/- female C57BL/6 mouse predict clinical
          benefit in human PFIC2, given that the model cannot report the serum bile acid biomarker and
          its fibrosis is too mild and regional to change?
        attaches_to:
        - pathophysiology#BSEP-Mediated Bile Salt Export Failure
        - pathophysiology#Hepatic Stellate Cell Activation and Biliary Fibrosis
        - biochemical#Total serum bile acids
        - treatments#Liver-directed gene therapy (AAV-ABCB11)
        rationale: 'Evidence for VTX-802 exists and is internally consistent, so this is not an absence
          of evidence; the open question is whether it transfers. The two endpoints that decide clinical
          benefit in patients - serum bile acid and progression of fibrosis to cirrhosis - are exactly
          the two the model cannot measure. Serum bile acid is so variable in C57BL/6 Abcb11-/- animals
          that it does not separate knockout from wild-type, and fibrosis is mild, variable, and regional,
          so the flat fibrosis result is uninformative rather than a negative finding. What the model
          does show well, biliary and intestinal bile acid recovery, is a proximal measure of the corrected
          transporter rather than of the outcome that sends patients to transplantation. Two further constraints
          narrow the inference: only female animals were dosed, and AAV8 spares periportal hepatocytes,
          which are the cells responsible for bile salt uptake and re-secretion. A serotype giving homogeneous
          lobular transduction, or a model with an assessable fibrosis and serum bile acid readout, would
          resolve this.'
      selected_evidence:
        snippet: C57BL/6 KO mice show strong gender differences, with a clearer disease onset in females
        supports: SUPPORT
