          term:
            id: CL:0000182
            label: hepatocyte
        subtypes:
        - PFIC3
      selected_evidence:
        snippet: "Defects in ABCB4, encoding multidrug resistance 3 protein (MDR3), \nimpair biliary phospholipid\
          \ secretion, resulting in PFIC3."
        supports: SUPPORT
