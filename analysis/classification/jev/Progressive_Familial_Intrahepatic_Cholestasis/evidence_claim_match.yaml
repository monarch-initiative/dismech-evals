            id: HP:0000007
            label: Autosomal recessive inheritance
        description: All established PFIC subtypes are caused by biallelic germline loss-of-function variants
          and segregate as autosomal recessive traits, with a 25% recurrence risk per pregnancy for carrier
          couples. Consanguinity is over-represented in reported cohorts. Monoallelic (heterozygous) ABCB4,
          ABCB11 and ATP8B1 variants are not causes of PFIC but predispose to milder adult cholestatic
          phenotypes such as intrahepatic cholestasis of pregnancy, low-phospholipid-associated cholelithiasis
          and drug-induced cholestasis.
      selected_evidence:
        snippet: "Progressive familial intrahepatic cholestasis (PFIC) refers to a heterogeneous \ngroup\
          \ of autosomal-recessive disorders of childhood that disrupt bile formation \nand present with\
          \ cholestasis of hepatocellular origin."
        supports: SUPPORT
