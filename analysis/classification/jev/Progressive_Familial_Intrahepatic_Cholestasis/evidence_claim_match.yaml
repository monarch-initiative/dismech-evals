        biological_scale: MOLECULAR
        role: trigger
        description: ABCB4 encodes MDR3, the canalicular floppase that translocates phosphatidylcholine
          into the outer leaflet of the canalicular membrane for extraction into bile. Biallelic loss
          makes bile phospholipid-poor. Because phosphatidylcholine is what sequesters bile salts into
          mixed micelles, its absence leaves free, monomeric bile salts at detergent concentrations in
          the biliary tree - the mechanistic reason PFIC3 behaves as a cholangiopathy rather than a purely
          hepatocellular disease, and consequently the reason its serum GGT is high.
        genes:
        - preferred_term: ABCB4
          term:
            id: hgnc:45
            label: ABCB4
