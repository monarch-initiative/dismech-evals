        biological_scale: ORGANISM
        role: consequence
        description: 'ATP8B1 is expressed well beyond the hepatocyte, so PFIC1 alone among the classical
          subtypes has an extrahepatic disease burden: secretory diarrhoea, exocrine pancreatic insufficiency,
          elevated sweat chloride, short stature and sensorineural hearing loss. This is clinically decisive
          because liver transplantation replaces only the hepatic compartment: the diarrhoea persists
          or worsens after transplant and is associated with allograft steatosis and fibrosis that can
          require re-transplantation, and audiological surveillance must continue lifelong regardless
          of hepatic outcome.'
        subtypes:
        - PFIC1
      selected_evidence:
        snippet: "Notably for some, secretory diarrhea can continue or worsen following liver \ntransplantation."
        supports: SUPPORT
