  324ed294feaf63cd776f129f7e14eebbee0fafdb269c9df8cb72472b469bcfe9:
    claim:
      about:
        disease:
          name: Progressive Muscular Atrophy
          disease_term:
            preferred_term: progressive muscular atrophy
            term:
              id: MONDO:0018687
              label: progressive muscular atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TDP-43 Proteinopathy
        description: 'Despite clinical restriction to the lower motor neuron, PMA shares the molecular
          neuropathology of ALS: widespread neuronal and glial accumulation of pathological, cytoplasmic
          43 kDa transactive response DNA-binding protein (TDP-43) inclusions across the central nervous
          system. TDP-43 is an RNA-binding protein, and its nuclear depletion and cytoplasmic aggregation
          disrupt RNA processing in vulnerable motor neurons. This places PMA, isolated lower-motor-neuron
          disease, ALS, and FTLD-TDP on a single TDP-43 proteinopathy continuum. A minority of slowly
          progressive lower-motor-neuron-predominant cases lack TDP-43 inclusions at autopsy, indicating
          molecular heterogeneity within the clinical syndrome.

          '
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        genes:
        - preferred_term: TARDBP
          term:
            id: hgnc:11571
            label: TARDBP
        molecular_functions:
        - preferred_term: RNA binding
          term:
            id: GO:0003723
            label: RNA binding
          modifier: LOSS_OF_FUNCTION
        biological_processes:
        - preferred_term: TDP-43 inclusion body assembly
          term:
            id: GO:0070841
            label: inclusion body assembly
          modifier: INCREASED
        - preferred_term: RNA processing
          term:
            id: GO:0006397
            label: mRNA processing
          modifier: ABNORMAL
      selected_evidence:
        snippet: we suggest that the next revision of the El Escorial criteria for the diagnosis of ALS
          include MND patients with disease clinically limited to the LMN and PMA as variants of ALS,
          which like classical ALS, are TDP-43 proteinopathies
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
