      assertion_type: Pathophysiology
      assertion:
        name: Stable Truncated SEMA6B Lacking the Intracellular Domain
        biological_scale: MOLECULAR
        description: The exon 17 variants remove the intracellular domain while leaving the extracellular
          sema domain, plexin-semaphorin-integrin domain and transmembrane segment encoded. When one truncating
          variant was expressed in cultured cells, the truncated protein accumulated to higher levels
          than wild-type SEMA6B and failed to reach the plasma membrane, and a truncating variant tested
          in a second study was likewise mislocalized.
      selected_evidence:
        snippet: All four variants occurred in the last exon of SEMA6B and lead to truncation of the intracellular
          domain (ICD), the region closer to the C terminus than the transmembrane domain
        supports: SUPPORT
