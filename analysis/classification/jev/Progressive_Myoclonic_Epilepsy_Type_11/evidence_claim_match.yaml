      assertion:
        discussion_id: sema6b_progression_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'What drives the regression in EPM11: ongoing neurodegeneration, the cumulative effect
          of seizures and myoclonus, or a developmental lesion that becomes symptomatic with age?'
        attaches_to:
        - phenotypes#Developmental Regression
        - phenotypes#Loss of Speech
        - phenotypes#Spasticity
        rationale: Patients lose motor and language skills, often in the second decade, yet brain MRI
          is normal in most and neither neuropathology nor a model has shown neuronal loss. One appraisal
          attributes motor regression partly to worsening myoclonus, and treating myoclonus improved gait
          in one patient, but cognitive regression and pyramidal signs have no explanation. These phenotypes
          are therefore left without a causal edge in this entry.
      selected_evidence:
        snippet: Repeated MRIs (from the age of 3 to 25 years) were normal.
        supports: SUPPORT
