  c6774145ac32852d7fd86b58c06a8a6dcf251e3b3ec78f5d147e2c32d890e7eb:
    claim:
      about:
        disease:
          name: Progressive Myoclonic Epilepsy Type 11
          disease_term:
            preferred_term: epilepsy, progressive myoclonic, 11
            term:
              id: MONDO:0030034
              label: epilepsy, progressive myoclonic, 11
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SEMA6B Last-Exon Truncating Variant Escaping NMD
        biological_scale: MOLECULAR
        description: Disease-causing variants are heterozygous nonsense and frameshift variants clustered
          in exon 17, the last exon of SEMA6B, where a premature stop codon does not trigger nonsense-mediated
          mRNA decay. In lymphoblastoid cells from an affected individual the mutant transcript was present
          at a level comparable to the wild-type transcript. Truncating variants upstream of this region,
          which would be degraded, are seen in the general population, and SEMA6B is tolerant of loss-of-function
          variation; the pathogenic variant class is therefore defined by its position, not by truncation
          as such.
        genetic_context:
          gene:
            preferred_term: SEMA6B
            term:
              id: hgnc:10739
              label: SEMA6B
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: UNKNOWN
          description: Frameshift and nonsense variants in the nonsense-mediated decay escape region (exon
            17). functional_impact_category is left UNKNOWN because dominant-negative, gain-of-function
            and loss-of-function readings of the truncated protein have each been proposed and none has
            been shown in a mammalian system; see the discussion sema6b_truncation_mechanism.
      selected_evidence:
        snippet: RNA analysis of lymphoblastoid cells established from an affected individual showed that
          the mutant allele escaped NMD, indicating stable production of the truncated protein.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32169168
      reference_title: De Novo Truncating Variants in the Last Exon of SEMA6B Cause Progressive Myoclonic
        Epilepsy.
      evidence_source: HUMAN_CLINICAL
      explanation: Patient-derived cells show the mutant transcript escapes nonsense-mediated decay.
