            term:
              id: MONDO:0030034
              label: epilepsy, progressive myoclonic, 11
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sema6b_truncation_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do last-exon SEMA6B truncations cause disease by a dominant-negative effect on wild-type
          SEMA6B, by a new toxic function of the truncated protein, or by loss of function of the mutant
          allele that population data say is not sufficient on its own?
        attaches_to:
        - pathophysiology#SEMA6B Last-Exon Truncating Variant Escaping NMD
        - pathophysiology#Stable Truncated SEMA6B Lacking the Intracellular Domain
        - pathophysiology#Disrupted SEMA6B-Plexin Signalling
        rationale: 'The discovery study inferred a dominant-negative or gain-of-function mechanism from
          three facts: the variants escape decay, upstream truncating variants are tolerated, and zebrafish
          last-exon crispants were more severely affected than start-codon crispants. Later papers state
          the mechanism in different directions: one review calls it a toxic gain of function, while the
          neuronal study calls the tested variant loss-of-function and found that knockdown of wild-type
          Sema6b reproduced the spine defect. The truncated protein is overexpressed and mislocalized
          in transfected cells, which fits either retention of wild-type partners or a new activity. None
          of the experiments tested the variant at physiological heterozygous dosage in a mammalian neuron,
          and the zebrafish crispants were mosaic, so the field has a consistent observation (position
          matters) without a demonstrated mechanism. This is why functional_impact_category is UNKNOWN.'
        proposed_experiments:
        - experiment_id: sema6b_heterozygous_knockin_vs_null
          experiment_design: TARGETED_PERTURBATION
          name: Heterozygous exon 17 truncation knock-in compared with a heterozygous null
          description: Generate mice or human iPSC-derived cortical neurons heterozygous for a recurrent
            exon 17 truncation, and in parallel heterozygous and homozygous null alleles, then compare
            spine density, axon targeting, network excitability and, in mice, seizure susceptibility.
            Co-express wild-type and truncated SEMA6B to test whether the truncated protein retains wild-type
            SEMA6B or plexin-A2 intracellularly.
          would_support:
          - pathophysiology#Disrupted SEMA6B-Plexin Signalling
          supporting_outcome:
          - The heterozygous knock-in has a phenotype that the heterozygous null lacks, and the truncated
            protein retains wild-type SEMA6B or plexin-A2 away from the membrane, favouring a dominant-negative
            effect.
          refuting_outcome:
          - Heterozygous knock-in and heterozygous null neurons are indistinguishable, which would argue
            against a dominant mechanism of the truncated protein.
      selected_evidence:
        snippet: Collectively, these results indicate that the pathomechanism of truncating DNVs in the
          NMD(−) region of SEMA6B was most likely dominant-negative or gain-of-function, but not haploinsufficiency.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
