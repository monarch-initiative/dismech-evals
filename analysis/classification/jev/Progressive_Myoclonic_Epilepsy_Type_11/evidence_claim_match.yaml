  e0e39cd042ab934f076258314b7ce23ab2949530e8ac1da5365c6bd03685a7f2:
    claim:
      about:
        disease:
          name: Progressive Myoclonic Epilepsy Type 11
          disease_term:
            preferred_term: epilepsy, progressive myoclonic, 11
            term:
              id: MONDO:0030034
              label: epilepsy, progressive myoclonic, 11
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sema6b_spectrum_lump
        kind: INTERPRETATION
        status: OPEN
        prompt: Are SEMA6B-related developmental and epileptic encephalopathy and intellectual disability
          without epilepsy the same disease as EPM11?
        attaches_to:
        - disease#Progressive Myoclonic Epilepsy Type 11
        rationale: This entry lumps them. All presentations arise from the same heterozygous de novo variants,
          mostly the same exon 17 truncations, and recurrent variants appear in patients classed in different
          groups. No genotype correlates with the progressive myoclonic versus encephalopathy presentation,
          MONDO and OMIM carry only the EPM11 concept, and several patients first diagnosed with an encephalopathy
          later developed the progressive myoclonic course. Age at last examination may explain part of
          the difference, since progressive myoclonus usually becomes evident in the second decade. The
          lump should be revisited if a genotype-phenotype correlation emerges or if missense variants
          prove to cause a distinct disorder.
      selected_evidence:
        snippet: In conclusion, although SEMA6B has been associated with PME, it may actually cause a
          much broader phenotypic spectrum.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39419291
      reference_title: 'Progressive Myoclonus Epilepsy and Beyond: A Systematic Review of SEMA6B-related
        Disorders.'
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      explanation: Systematic review conclusion that SEMA6B disease is a spectrum broader than PME.
