              label: epilepsy, progressive myoclonic, 11
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing
        description: Diagnosis rests on a heterozygous pathogenic SEMA6B variant, usually a de novo truncating
          variant in exon 17, found by exome sequencing or a multigene epilepsy panel. Because SEMA6B
          truncating variants outside the decay-escape region are tolerated, the position of a truncating
          variant is central to its interpretation. Supportive findings are giant or enlarged somatosensory
          evoked potentials, an enhanced C reflex and cortical myoclonus on polygraphy; brain MRI is usually
          normal.
        notes: Differential diagnosis includes the other progressive myoclonus epilepsies with developmental
          delay and the developmental and epileptic encephalopathies, notably Lennox-Gastaut syndrome
          and epilepsy with myoclonic-atonic seizures, which several SEMA6B patients were first diagnosed
          with. One reported patient's presentation was initially taken for Angelman syndrome.
      selected_evidence:
        snippet: Truncating variants in the NMD(−) region of SEMA6B were not observed in general populations
          (i.e., the “non-neuro” subset of gnomAD), except for one at the extreme C terminus, whreas truncating
          variants were observed in the NMD(+) region
        supports: SUPPORT
    origin:
