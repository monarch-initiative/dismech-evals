        biological_scale: TISSUE
        description: SEMA6B is expressed broadly in the developing and mature brain, most strongly in
          cortical excitatory neurons and cerebellar Purkinje cells. In zebrafish, mosaic truncation of
          the last coding exon of both sema6b orthologs caused small heads, a smaller optic tectum and
          defective neuronal development, whereas truncation near the start codon caused only a mild phenotype.
          The developmental timing of the human disease, with delay before seizure onset, fits a disorder
          of circuit formation, but which circuits are miswired in patients has not been shown.
        cell_types:
