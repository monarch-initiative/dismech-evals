          name: Progressive Myoclonic Epilepsy Type 11
          disease_term:
            preferred_term: epilepsy, progressive myoclonic, 11
            term:
              id: MONDO:0030034
              label: epilepsy, progressive myoclonic, 11
        context: []
      assertion_type: Genetic
      assertion:
        name: SEMA6B
        gene_term:
          preferred_term: SEMA6B
          term:
            id: hgnc:10739
            label: SEMA6B
        association: De Novo Variant
        presence: Positive
        variant_origin: DE_NOVO
        relationship_type: CAUSATIVE
        notes: Nearly all pathogenic variants are frameshift or nonsense variants in exon 17 (NM_032108),
          the last exon, where they escape nonsense-mediated decay. Missense variants, a splice-site variant
          and one upstream nonsense variant have also been reported, the last in a mildly affected patient
          with unavailable paternal DNA whose variant was also seen in unaffected adults; the pathogenicity
          of these non-truncating and upstream classes is less secure. ClinGen classifies SEMA6B in autosomal
          dominant progressive myoclonus epilepsy (MONDO:0020074) as Definitive; that record is filed
          against the parent class, so it is not copied into gene_disease_validity for this entry.
        variants:
        - name: SEMA6B c.1991del (p.Gly664Alafs*21)
          description: Recurrent exon 17 frameshift, found in two unrelated families in the discovery
            study and again in a later intellectual-disability cohort.
          clinical_significance: PATHOGENIC
        - name: SEMA6B c.2066G>A (p.Trp689*)
          description: Recurrent exon 17 nonsense variant, reported in a patient with zonisamide-responsive
            progressive myoclonic epilepsy and in the intellectual-disability cohort, and the variant
            used in neuronal and chick functional studies.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Second, we independently validate SEMA6B as a dominant PME gene in two unrelated individuals.
        supports: SUPPORT
