      assertion_type: Pathophysiology
      assertion:
        name: KCNC1 (Kv3.1) Dominant-Negative Loss of Function
        biological_scale: MOLECULAR
        conforms_to: epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction
        description: 'The recurrent heterozygous KCNC1 variant c.959G>A (p.Arg320His) lies in the S4 voltage-sensor
          segment of the Kv3.1 channel and acts through a dominant-negative mechanism: because Kv3 subunits
          assemble as tetramers, mutant subunits co-assemble with wild-type subunits and strongly suppress
          the fast, high-threshold delayed-rectifier potassium current normally carried by Kv3.1, chiefly
          by slowing channel activation.'
        genetic_context:
          gene:
            preferred_term: KCNC1
            term:
              id: hgnc:6233
              label: KCNC1
          functional_impact_category: DOMINANT_NEGATIVE
        molecular_functions:
        - preferred_term: voltage-gated potassium channel activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0005249
            label: voltage-gated potassium channel activity
      selected_evidence:
        snippet: Functional analysis of the Arg320His mutant channel showed a dominant-negative loss-of-function
          effect.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
