      assertion_type: Pathophysiology
      assertion:
        name: Impaired Interneuron Dendritic Development and Viability
        biological_scale: CELLULAR
        description: 'Beyond its role in fast repolarization, the R320H mutant channel has an unexpected
          developmental toxicity: in cortical interneurons it severely impairs neurite (dendrite) development
          and reduces interneuron viability, an effect not rescued by pharmacologically blocking Kv3 channels.
          This nominates a developmental "dendritopathy" component to MEAK distinct from the acute conduction
          defect.'
        biological_processes:
        - preferred_term: neuron projection development
          modifier: DECREASED
          term:
            id: GO:0031175
            label: neuron projection development
      selected_evidence:
        snippet: The mutant channel also had an unexpected effect on morphology, severely impairing neurite
          development and interneuron viability, an effect that could not be rescued by blocking KV 3
          channels.
        supports: SUPPORT
