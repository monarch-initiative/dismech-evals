            term:
              id: MONDO:0014521
              label: progressive myoclonic epilepsy type 7
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: meak_fever_improvement
        kind: INTERPRETATION
        prompt: Why does fever paradoxically and transiently improve MEAK symptoms, and can the underlying
          temperature dependence of Kv3.1 be exploited therapeutically?
        attaches_to:
        - pathophysiology#KCNC1 (Kv3.1) Dominant-Negative Loss of Function
        rationale: Unlike most epilepsies, several MEAK patients transiently improve with fever. In vitro,
          elevated temperature produces a leftward (hyperpolarizing) shift in the activation of wild-type
          Kv3.1, increasing channel availability and partially countering the mutant channel's loss of
          function. This nominates Kv3.1 potentiation as a precision-therapeutic strategy for MEAK.
      selected_evidence:
        snippet: A remarkable improvement with fever may be explained by the temperature-dependent leftward
          shift in activation of wild-type KV 3.1 subunit-containing channels, which would counter the
          loss of function observed for mutant channels, highlighting KCNC1 as a potential target for
          precision therapeutics.
        supports: SUPPORT
