              id: MONDO:0014521
              label: progressive myoclonic epilepsy type 7
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Diagnosis of KCNC1-Related Disorder
        description: The diagnosis is established by identifying a heterozygous pathogenic KCNC1 variant
          (the recurrent c.959G>A p.Arg320His in MEAK) in a proband with suggestive findings. Because
          PME is genetically heterogeneous, a multigene epilepsy/PME panel or exome/genome sequencing
          is the appropriate first-tier test rather than single-gene analysis. Supportive investigations
          include EEG (generalized spike/polyspike-wave discharges with a photoparoxysmal response) and
          brain MRI (progressive symmetrical cerebellar atrophy).
        notes: 'Differential diagnosis (the other progressive myoclonic epilepsies): EPM1 (Unverricht-Lundborg
          disease, CSTB), Lafora disease (EPM2A/NHLRC1), the neuronal ceroid lipofuscinoses, MERRF, POLG-related
          disorders, sialidosis type 1, dentatorubral-pallidoluysian atrophy (DRPLA), and PRICKLE1- and
          KCTD7-related PME.'
      selected_evidence:
        snippet: The diagnosis of KCNC1-related disorders is established in a proband with suggestive
          findings and a heterozygous pathogenic variant in KCNC1 identified by molecular genetic testing.
        supports: SUPPORT
