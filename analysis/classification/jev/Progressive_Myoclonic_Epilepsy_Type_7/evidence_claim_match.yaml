      assertion_type: Genetic
      assertion:
        name: KCNC1
        gene_term:
          preferred_term: KCNC1
          term:
            id: hgnc:6233
            label: KCNC1
        association: De Novo Variant
        presence: Positive
        variant_origin: GERMLINE
        relationship_type: CAUSATIVE
        notes: EPM7/MEAK is caused almost exclusively by the recurrent heterozygous p.Arg320His (R320H)
          KCNC1 variant, which exerts a dominant-negative effect on the tetrameric Kv3.1 channel. In the
          discovery cohort this single variant explained ~13% of unexplained PME. The variant is highly
          penetrant and produces a specific, relatively homogeneous MEAK phenotype.
        variants:
        - name: KCNC1 c.959G>A (p.Arg320His)
          description: Recurrent de novo variant substituting histidine for arginine at codon 320 in the
            S4 voltage-sensor segment; the dominant-negative disease allele in essentially all MEAK/EPM7
            patients.
      selected_evidence:
        snippet: The Arg320His variant, which occurs in the voltage-sensing domain of the channel, causes
          a highly penetrant and specific form of progressive myoclonus epilepsy with severe ataxia, designated
          myoclonus epilepsy and ataxia due to potassium channel mutation (MEAK).
        supports: SUPPORT
