        relationship_type: CAUSATIVE
        association: Biallelic CERS1 variants cause progressive myoclonic epilepsy type 8. The founding
          variant is a homozygous nonsynonymous change identified in four affected siblings, shown to
          decrease C18-ceramide levels. CERS1 is one of six mammalian ceramide synthases, each with a
          distinct fatty acyl-CoA chain-length preference; CerS1 is the neuronal enzyme and makes C18-ceramide,
          which is what confines the disease to the nervous system.
        notes: The gene has been known under two names and both appear in the literature cited here. The
          mouse study calls it Lass1, for longevity assurance homolog 1; the human study calls it CERS1.
          They are the same gene, and a curator meeting the older name in a search should not treat it
          as a separate locus. The HGNC record carries LASS1 as a previous symbol.
      selected_evidence:
        snippet: We identified a homozygous nonsynonymous mutation in CERS1, the gene encoding ceramide
          synthase 1
        supports: SUPPORT
