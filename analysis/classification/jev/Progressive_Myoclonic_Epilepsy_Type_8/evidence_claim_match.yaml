  b2869891182c20a37a16d8e58397f4305b1d15fdff7428a7458d77972a9f7de3:
    claim:
      about:
        disease:
          name: Progressive Myoclonic Epilepsy Type 8
          disease_term:
            preferred_term: progressive myoclonic epilepsy type 8
            term:
              id: MONDO:0014545
              label: progressive myoclonic epilepsy type 8
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: sphingolipid_membrane_homeostasis_model
        status: ALTERNATIVE
        description: 'The primary defect is a broader failure of neuronal sphingolipid homeostasis rather
          than an ER stress response specifically: brain sphingolipid biosynthesis falls and steady-state
          sphingolipid and sphingoid base levels shift dramatically, and it is that altered membrane and
          signalling lipid composition - evidenced by the lipofuscin and ubiquitylated protein accumulation
          - that degrades neurons over time. The mouse data speak more directly to this account than to
          the ER stress one, since they measure brain lipids and show a storage phenotype rather than
          showing an unfolded protein response. The two are not exclusive and may be sequential.'
      selected_evidence:
        snippet: a reduction in sphingolipid biosynthesis in the brain and dramatic changes in steady-state
          levels of sphingolipids and sphingoid bases
        supports: SUPPORT
