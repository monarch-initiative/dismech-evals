      assertion:
        name: Other progressive myoclonus epilepsies
        description: Unverricht-Lundborg disease, Lafora disease, the neuronal ceroid lipofuscinoses,
          MERRF and sialidosis all present with the same triad of myoclonus, seizures and cognitive decline.
