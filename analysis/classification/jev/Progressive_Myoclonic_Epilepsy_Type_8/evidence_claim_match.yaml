      assertion_type: Pathophysiology
      assertion:
        name: Lipofuscin Accumulation with Ubiquitylated Proteins
        biological_scale: CELLULAR
        description: 'In CerS1-deficient mice, lipofuscin accumulates together with ubiquitylated proteins
          across many brain regions - a storage-disease-like picture in what is otherwise a biosynthetic
          defect. This matters for the differential: lipofuscin accumulation is the defining feature of
          the neuronal ceroid lipofuscinoses, several of which also present as progressive myoclonus epilepsy.
          Whether the same accumulation occurs in human CERS1 disease is not established.'
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: In addition to Purkinje cell death, deficiency of CerS1 function also induced accumulation
          of lipofuscin with ubiquitylated proteins in many brain regions
        supports: SUPPORT
