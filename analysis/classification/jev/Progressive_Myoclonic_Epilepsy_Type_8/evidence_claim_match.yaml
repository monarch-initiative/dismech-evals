          enough that testing is gene-agnostic.
        distinguishing_features:
        - Distinguished by molecular genetic testing rather than by clinical features; over 70 percent
          of progressive myoclonus epilepsy cases are now molecularly solved.
        - Age at onset between 6 and 16 years overlaps with Unverricht-Lundborg and Lafora disease and
          does not discriminate.
      selected_evidence:
        snippet: Progressive myoclonus epilepsies (PMEs) comprise a group of clinically and genetically
          heterogeneous rare diseases
