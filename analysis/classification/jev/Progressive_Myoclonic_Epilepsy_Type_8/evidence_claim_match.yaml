      assertion_type: Pathophysiology
      assertion:
        name: CERS1 Loss of Function
        biological_scale: MOLECULAR
        description: 'The initiating lesion. CerS1 is a transmembrane protein of the endoplasmic reticulum
          that catalyzes the biosynthesis of C18-ceramides. Of the six mammalian ceramide synthases, CerS1
          is the neuronal one, and its acyl-chain specificity is what makes the disorder neurological
          rather than systemic: the enzyme is not making ceramide in general, it is making one chain length
          that neurons depend on.'
        genes:
        - preferred_term: CERS1
          term:
            id: hgnc:14253
            label: CERS1
        molecular_functions:
        - preferred_term: sphingosine N-acyltransferase activity
          term:
