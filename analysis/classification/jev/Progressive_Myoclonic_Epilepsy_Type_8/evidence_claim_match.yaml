  ac86516b4ff2d4154e4dedf00356d0d4920eec62a4820d6c7199318a345cc2f0:
    claim:
      about:
        disease:
          name: Progressive Myoclonic Epilepsy Type 8
          disease_term:
            preferred_term: progressive myoclonic epilepsy type 8
            term:
              id: MONDO:0014545
              label: progressive myoclonic epilepsy type 8
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: SMA-PME (ASAH1-related)
        description: 'Spinal muscular atrophy with progressive myoclonic epilepsy, caused by ASAH1 variants.
          It is the closest mechanistic neighbour rather than merely another entry on the list: ASAH1
          encodes acid ceramidase, which degrades ceramide, while CERS1 synthesizes it. Two opposite lesions
          in the same lipid produce overlapping progressive myoclonus epilepsy - which is an argument
          that ceramide homeostasis rather than ceramide abundance is what neurons require.'
        distinguishing_features:
        - Lower motor neuron disease with muscle weakness and denervation is a defining feature of SMA-PME
          and is not described in CERS1-related disease.
      selected_evidence:
