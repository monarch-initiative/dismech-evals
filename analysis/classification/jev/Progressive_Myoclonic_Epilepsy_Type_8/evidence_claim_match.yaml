          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
      selected_evidence:
        snippet: CerS1, a transmembrane protein of the endoplasmic reticulum (ER), catalyzes the biosynthesis
          of C18-ceramides
        supports: SUPPORT
