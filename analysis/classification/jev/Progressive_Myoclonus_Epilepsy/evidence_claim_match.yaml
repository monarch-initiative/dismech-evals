              label: progressive myoclonus epilepsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Lysosomal Storage (NCL and Sialidosis)
        description: 'Two PME subtypes are lysosomal storage disorders. In the neuronal ceroid lipofuscinoses
          (subtype NCL), genetically heterogeneous lysosomal defects cause toxic endo-lysosomal accumulation
          of autofluorescent ceroid lipopigment. In sialidosis type 1 (subtype Sialidosis Type 1), deficiency
          of NEU1 (alpha-N-acetyl neuraminidase 1) impairs catabolism of sialylated glycoconjugates, causing
          storage and the cherry-red spot myoclonus phenotype. Both converge on neuronal storage, autophagic-lysosomal
          dysfunction, and progressive degeneration with myoclonus and seizures.

          '
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: lysosomal transport
          modifier: DYSREGULATED
          term:
            id: GO:0007041
            label: lysosomal transport
        - preferred_term: glycoprotein catabolic process
          modifier: DECREASED
          term:
            id: GO:0006516
            label: glycoprotein catabolic process
      selected_evidence:
        snippet: These are genetic diseases associated with the formation of toxic endo-lysosomal storage.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
