      assertion_type: Pathophysiology
      assertion:
        name: Cortical Reflex Myoclonus and Progressive Neurodegeneration
        description: 'The progressive myoclonic epilepsies are a group of symptomatic generalized epilepsies
          caused by rare, mostly genetic disorders with a debilitating course and poor outcome. Across
          etiologies the shared output is cortical (reflex) myoclonus arising from sensorimotor cortical
          hyperexcitability, superimposed on progressive degeneration of cortical and cerebellar neurons
          that drives worsening seizures, ataxia, and cognitive decline.

          '
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        biological_processes:
        - preferred_term: neuron apoptotic process
          modifier: INCREASED
          term:
            id: GO:0051402
            label: neuron apoptotic process
      selected_evidence:
        snippet: The progressive myoclonic epilepsies (PMEs) are a group of symptomatic generalised epilepsies
          caused by rare disorders, most of which have a genetic component, a debilitating course, and
          a poor outcome.
        supports: SUPPORT
