  dd5f4d948e54e577359d87e7419dcfe4411ea2ba52b47a66dedaaa2450c3e8aa:
    claim:
      about:
        disease:
          name: Progressive Myoclonus Epilepsy
          disease_term:
            preferred_term: progressive myoclonus epilepsy
            term:
              id: MONDO:0020074
              label: progressive myoclonus epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_pme_lafora_body_driver_versus_bystander
        prompt: Are Lafora bodies (polyglucosan inclusions) the causal driver of neurodegeneration in
          EPM2, or a downstream biomarker of the underlying glycogen-handling defect? Does reducing brain
          glycogen synthesis prevent the disease because it removes the inclusions, or because it corrects
          the upstream metabolic abnormality independent of visible aggregates?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Defective Glycogen Handling and Lafora Body Formation (EPM2)
        rationale: The entry states that Lafora bodies are a principal driver of neurodegeneration, but
          whether the inclusions themselves are pathogenic or are a marker of the underlying poorly branched,
          hyperphosphorylated glycogen remains genuinely contested. Glycogen-synthesis-reduction strategies
          (e.g., glycogen synthase downregulation) that both eliminate Lafora bodies and rescue the phenotype
          cannot on their own separate the two hypotheses, because they remove the aggregate and the upstream
          metabolic defect simultaneously. Distinguishing driver from bystander determines whether aggregate
          clearance or metabolic normalization is the correct therapeutic target.
        proposed_experiments:
        - experiment_id: exp_pme_lafora_body_uncoupling
          name: Uncoupling Lafora body burden from glycogen-metabolic defect
          description: In Lafora disease mouse models, use graded glycogen synthase (Gys1) reduction and
            alternative interventions that dissociate inclusion burden from upstream glycogen abnormality,
            then correlate quantitative Lafora body load, glycogen phosphorylation/branching, neuroinflammation,
            and neurological/electrographic phenotype to test whether phenotype tracks inclusion burden
            or the upstream metabolic state.
          experiment_type:
            preferred_term: aggregate-uncoupling experiment
          readouts:
          - name: Phenotype versus inclusion-burden correlation
            target: pathophysiology#Defective Glycogen Handling and Lafora Body Formation (EPM2)
            biological_processes:
            - preferred_term: glycogen metabolic process
              term:
                id: GO:0005977
                label: glycogen metabolic process
              modifier: DYSREGULATED
            assays:
            - preferred_term: histopathology
            - preferred_term: electroencephalography
            direction: POSITIVE
          controls:
          - name: Untreated Lafora model and wild-type
            description: Untreated EPM2A/NHLRC1-null and wild-type littermate controls.
          decision_criterion: Lafora bodies act as drivers if neurological phenotype tracks residual inclusion
            burden at matched levels of upstream glycogen abnormality; they act as bystanders if phenotype
            tracks the metabolic defect while inclusion load is dissociated from outcome.
          would_support:
          - pathophysiology#Defective Glycogen Handling and Lafora Body Formation (EPM2)
      selected_evidence:
        snippet: Evidence from Lafora disease genetic mouse models indicates that these intracellular
          inclusions are a principal driver of neurodegeneration and neurological disease.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
