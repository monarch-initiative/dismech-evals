      assertion_type: Pathophysiology
      assertion:
        name: Cystatin B Loss (EPM1 / Unverricht-Lundborg)
        description: 'In Unverricht-Lundborg disease (EPM1; subtype EPM1 in this entry), loss-of-function
          reduction of cystatin B - an inhibitor of lysosomal cysteine proteases (cathepsins) - causes
          progressive myoclonus epilepsy. Decreased cystatin B is thought to permit unrestrained cysteine-protease
          activity, with downstream neuronal apoptosis (notably of cerebellar granule and Purkinje cells
          in model organisms) underlying the action myoclonus and ataxia.

          '
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: cysteine protease (cathepsin) inhibition by cystatin B
          modifier: DECREASED
          term:
            id: GO:0045861
            label: negative regulation of proteolysis
      selected_evidence:
        snippet: These results provide evidence that mutations in the gene encoding cystatin B are responsible
          for the primary defect in patients with EPM1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8596935
      reference_title: Mutations in the gene encoding cystatin B in progressive myoclonus epilepsy (EPM1).
      evidence_source: HUMAN_CLINICAL
      explanation: 'The original gene-discovery paper establishes loss-of-function cystatin B mutations
        as the primary defect in EPM1 / Unverricht-Lundborg type PME.

        '
