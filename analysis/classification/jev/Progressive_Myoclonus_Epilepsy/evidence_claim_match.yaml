            term:
              id: MONDO:0020074
              label: progressive myoclonus epilepsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Glycogen Handling and Lafora Body Formation (EPM2)
        description: 'In Lafora disease (subtype EPM2 in this entry), loss of the laforin glycogen phosphatase
          (EPM2A) or the malin E3 ubiquitin ligase (NHLRC1/EPM2B) produces poorly branched, hyperphosphorylated
          glycogen that precipitates and aggregates into intracellular Lafora bodies. These polyglucosan
          inclusions are a principal driver of neurodegeneration and the rapidly progressive myoclonus,
          seizures, and dementia of this PME subtype.

          '
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: glycogen metabolic process
          modifier: DYSREGULATED
          term:
            id: GO:0005977
            label: glycogen metabolic process
      selected_evidence:
        snippet: Approximately 90% of cases of Lafora disease, a fatal teenage-onset progressive myoclonus
          epilepsy, are caused by mutations in either the EPM2A or the EPM2B genes that encode, respectively,
          a glycogen phosphatase called laforin and an E3 ubiquitin ligase called malin.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20538597
      reference_title: Genetic depletion of the malin E3 ubiquitin ligase in mice leads to lafora bodies
        and the accumulation of insoluble laforin.
      evidence_source: MODEL_ORGANISM
      explanation: 'Establishes EPM2A/EPM2B as the genetic basis of Lafora disease in a malin-knockout
        mouse study that recapitulates Lafora body formation.

        '
