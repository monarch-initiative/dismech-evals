  0df08d47cfb604fee2d0e3277e3f74b48fe6f28ed5acec479e6ce749a7bce9f1:
    claim:
      about:
        disease:
          name: Progressive Myoclonus Epilepsy
          disease_term:
            preferred_term: progressive myoclonus epilepsy
            term:
              id: MONDO:0020074
              label: progressive myoclonus epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_pme_myoclonus_versus_neurodegeneration_dissociability
        prompt: Is the cortical hyperexcitability that generates PME myoclonus the same process as the
          progressive neurodegeneration, or are they dissociable therapeutic targets? Why is PME myoclonus
          characteristically pharmacoresistant, and why do sodium-channel-blocking and GABAergic antiseizure
          medications (e.g., phenytoin, carbamazepine, vigabatrin, tiagabine) often aggravate myoclonus
          rather than control it?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Cortical Reflex Myoclonus and Progressive Neurodegeneration
        rationale: The entry couples cortical reflex myoclonus and progressive neurodegeneration in a
          single node, but it is unresolved whether myoclonic cortical hyperexcitability and the degenerative
          process are mechanistically the same or separable. This matters clinically because PME myoclonus
          is notoriously drug-resistant and several standard antiseizure medications paradoxically worsen
          it, implying the myoclonogenic network state is not a simple readout of neuron loss. Whether
          symptomatic control of hyperexcitability can be achieved independently of halting degeneration
          determines whether these should be pursued as one target or two.
        proposed_experiments:
        - experiment_id: exp_pme_hyperexcitability_versus_degeneration
          name: Temporal dissociation of cortical hyperexcitability and neurodegeneration
          description: In a PME model with quantifiable progression, longitudinally track cortical network
            hyperexcitability (giant somatosensory-evoked-potential analog, cortical excitability measures)
            and neurodegeneration (neuron loss, biomarkers) while separately modulating excitability (targeting
            cortical circuit hyperexcitability) and the degenerative driver, to test whether myoclonus
            severity can be altered independently of degeneration and whether sodium-channel-blocker/GABAergic
            exposure aggravates the hyperexcitable state.
          experiment_type:
            preferred_term: longitudinal dissociation experiment
          readouts:
          - name: Excitability and degeneration trajectories
            target: pathophysiology#Cortical Reflex Myoclonus and Progressive Neurodegeneration
            biological_processes:
            - preferred_term: neuron apoptotic process
              term:
                id: GO:0051402
                label: neuron apoptotic process
              modifier: INCREASED
            assays:
            - preferred_term: electrophysiology
            - preferred_term: histopathology
            direction: POSITIVE
          controls:
          - name: Vehicle and non-PME controls
            description: Vehicle-treated PME model and non-PME epilepsy controls.
          decision_criterion: Myoclonus and neurodegeneration are dissociable targets if an intervention
            reduces cortical hyperexcitability and myoclonus without changing the degeneration trajectory
            (or vice versa); they are unified if the two measures move together under all interventions.
          would_support:
          - pathophysiology#Cortical Reflex Myoclonus and Progressive Neurodegeneration
      selected_evidence:
        snippet: Challenges with PME arise from difficulty with diagnosis, especially in the early stages
          of the illness, and further problems of management and drug treatment.
        supports: SUPPORT
