        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Spinal involvement and loss of ambulation
        age_range: Late childhood and adolescence
        notes: Spine involvement develops in late childhood and adolescence, producing a short trunk with
          thoracolumbar kyphosis; adult height is usually below the third centile. Platyspondyly develops
          late and can be the first radiographic clue. Nearly half of patients lose independent walking.
      selected_evidence:
        snippet: A total of 47.7% lost independent walking ability at the median age of 12 years.
        supports: SUPPORT
