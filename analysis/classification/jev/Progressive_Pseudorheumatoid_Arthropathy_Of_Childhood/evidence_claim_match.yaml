      assertion_type: Pathophysiology
      assertion:
        name: Failure of Articular Chondrocyte Matrix Homeostasis
        biological_scale: CELLULAR
        description: WISP-3 acts on chondrocytes as an autocrine and paracrine ligand, upregulating type
          II collagen and aggrecan and promoting superoxide dismutase activity, so its loss removes both
