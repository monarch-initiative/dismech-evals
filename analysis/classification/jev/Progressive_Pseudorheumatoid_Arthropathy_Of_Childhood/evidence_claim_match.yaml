      assertion:
        name: Total Hip Arthroplasty
        description: 'The one intervention in PPRD with substantial outcome data. In four genetically
          confirmed patients undergoing one-stage bilateral total hip arthroplasty, Harris Hip Score rose
          from 39.67 to 91.67 and SF-36 from 19.67 to 71.33 over a mean 47.9 months, with no aseptic loosening.
          Named for the hip rather than for joint replacement generally: GeneReviews recommends arthroplasty
          for severe joint pain from advanced osteoarthritis without naming a joint, but every outcome
          figure quoted here is from hip series, so the broader name would claim a scope the evidence
          does not cover.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: total hip arthroplasty
          term:
            id: NCIT:C51691
            label: Arthroplasty
