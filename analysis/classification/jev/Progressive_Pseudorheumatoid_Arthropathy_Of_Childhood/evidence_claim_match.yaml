  5be689955a520d663d89b64f4920208589ea7d4b940438ed0a4b1604cdc382e6:
    claim:
      about:
        disease:
          name: Progressive Pseudorheumatoid Arthropathy of Childhood
          disease_term:
            preferred_term: progressive pseudorheumatoid arthropathy of childhood
            term:
              id: MONDO:0008827
              label: progressive pseudorheumatoid arthropathy of childhood
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bmp_wnt_to_cartilage_loss_intermediates
        kind: KNOWLEDGE_GAP
        prompt: What are the intermediate steps between deregulated BMP/Wnt signalling and progressive
          loss of human articular cartilage in PPRD?
        attaches_to:
        - pathophysiology#Failure of Articular Chondrocyte Matrix Homeostasis
        rationale: Both ends of this chain are well supported and the middle is not. CCN6's inhibition
          of BMP and Wnt signalling is demonstrated by gain-of-function in zebrafish; progressive articular
          cartilage loss is documented radiographically in patients. Between them sit at least three competing
          proposals — loss of matrix-synthetic drive on type II collagen and aggrecan, loss of superoxide
          dismutase-dependent antioxidant protection, and increased chondrocyte IGF-1 sensitivity driving
          hypertrophic differentiation — none demonstrated in human articular cartilage. They are not
          mutually exclusive, which is part of why none has been excluded. The edge in this entry is typed
          INDIRECT_UNKNOWN_INTERMEDIATES for exactly this reason.
      selected_evidence:
        snippet: WISP-3 may also promote superoxide dismutase expression and activity in chondrocytes
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
