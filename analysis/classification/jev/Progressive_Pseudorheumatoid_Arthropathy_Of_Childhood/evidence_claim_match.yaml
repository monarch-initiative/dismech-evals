      assertion_type: EpidemiologyInfo
      assertion:
        name: Rare and systematically under-ascertained
        description: Prevalence is put at roughly one per million, but that figure is explicitly described
          as an underestimate because cases are undiagnosed or carried as juvenile idiopathic arthritis.
          The largest cohorts come from consanguineous or endemic populations — India, China, Turkey,
          Egypt — each with its own founder or hotspot allele.
      selected_evidence:
        snippet: Prevalence underestimated as one per million and most of the cases remain undiagnosed
          or treated as Juvenile Idiopathic Arthritis (JIA).
        supports: SUPPORT
