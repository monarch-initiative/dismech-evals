        snippet: Harris Hip Score increased from 39.67 ± 9.73 points preoperatively to 91.67 ± 4.32 points
          postoperatively (p < 0.05); Short Form 36 increased from 19.67 ± 1.53 points preoperatively
          to 71.33 ± 3.06 postoperatively (p < 0.05).
        supports: SUPPORT
