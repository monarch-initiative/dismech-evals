        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: no_mouse_model_for_ccn6_loss
        kind: HUMAN_MODEL_MISMATCH
        prompt: Wisp3-deficient mice have no apparent phenotype. What does a species with no disease tell
          us about the human mechanism, and what model should replace the mouse for preclinical work?
        attaches_to:
        - pathophysiology#Loss of CCN6 Modulation of BMP and Wnt Signaling
        rationale: This is a translational block rather than a gap in evidence. Loss of Wisp3 in the mouse
          produces no apparent phenotype, and neither does overexpression — so the standard preclinical
          species is uninformative for a disease that is fully penetrant in humans. Two readings are open.
          Either mouse cartilage has a redundancy that human articular cartilage lacks, in which case
          the interesting biology is what compensates; or the human phenotype depends on mechanical loading
          histories, growth duration or joint geometry that a mouse does not reproduce. The zebrafish
          work is currently the only in vivo system where CCN6 loss does something, and it reports pharyngeal
          cartilage morphology rather than progressive articular degeneration. Until this is resolved
          there is no animal system in which a disease-modifying therapy could be tested, which is a plausible
          part of why none exists.
      selected_evidence:
        snippet: in mice there is no apparent phenotype caused by Wisp3 deficiency or overexpression
        supports: SUPPORT
