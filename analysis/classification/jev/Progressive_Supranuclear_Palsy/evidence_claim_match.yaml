      assertion_type: Pathophysiology
      assertion:
        name: 4R-Tau Aggregation in Neurons and Glia
        description: PSP is neuropathologically defined by accumulation of hyperphosphorylated, aggregated
          four-repeat (4R) tau in neurons, astrocytes (tufted astrocytes), and oligodendrocytes (coiled
          bodies). Tau inclusions disrupt microtubule biology and proteostasis. MAPT expression is preserved
          in all three cell types harboring tau aggregates, supporting ongoing local tau production that
          can feed continued aggregation and cell-to-cell seeding. This is the upstream initiating lesion
          of PSP pathology.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: tufted astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        - preferred_term: oligodendrocyte (coiled body)
          term:
            id: CL:0000128
            label: oligodendrocyte
        biological_processes:
        - preferred_term: Tau (amyloid) fibril formation
          term:
            id: GO:1990000
            label: amyloid fibril formation
          modifier: INCREASED
        - preferred_term: Disrupted microtubule cytoskeleton organization
          term:
            id: GO:0000226
            label: microtubule cytoskeleton organization
          modifier: ABNORMAL
        - preferred_term: Tau hyperphosphorylation
          term:
            id: GO:0006468
            label: protein phosphorylation
          modifier: INCREASED
      selected_evidence:
        snippet: Progressive supranuclear palsy (PSP) is a rare neurodegenerative disease characterized
          by the accumulation of aggregated tau proteins in astrocytes, neurons, and oligodendrocytes.
        supports: SUPPORT
