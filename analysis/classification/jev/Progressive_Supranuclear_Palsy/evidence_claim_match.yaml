              label: progressive supranuclear palsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MAPT H1 Haplotype and 4R Tau Splicing Imbalance
        description: 'The MAPT 17q21.31 locus contains low-copy repeats flanking a recurrent genomic inversion,
          giving rise to two dominant haplotypes (H1 and H2). The H1 haplotype is the strongest common
          genetic risk factor for PSP. Haplotype-dependent regulation biases tau pre-mRNA splicing and
          expression toward the 4R isoform: post-mortem bulk RNA-seq shows increased total tau mRNA and
          an increased proportion of 4R tau transcripts in PSP brain, with 4R tau mRNA significantly associated
          with the H1 haplotype, supporting an upstream splicing/expression mechanism feeding tau aggregation.'
        genes:
        - preferred_term: MAPT
          term:
            id: hgnc:6893
            label: MAPT
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Regulation of mRNA splicing toward 4R tau
          term:
            id: GO:0048024
            label: regulation of mRNA splicing, via spliceosome
          modifier: ABNORMAL
        - preferred_term: Increased tau gene expression
          term:
            id: GO:0010468
            label: regulation of gene expression
          modifier: INCREASED
      selected_evidence:
        snippet: 4R tau mRNA levels were significantly associated with the H1 haplotype in the temporal
          cortex.
        supports: SUPPORT
