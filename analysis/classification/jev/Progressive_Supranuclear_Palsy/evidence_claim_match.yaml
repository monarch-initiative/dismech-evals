  70c2e96d120c395d34c4e0791bdbfe1b4d04553e4379c81c30997809d499e42f:
    claim:
      about:
        disease:
          name: Progressive Supranuclear Palsy
          disease_term:
            preferred_term: Progressive Supranuclear Palsy
            term:
              id: MONDO:0019037
              label: progressive supranuclear palsy
        context: []
      assertion_type: ClinicalTrial
      assertion:
        name: ChiCTR2100045397
        phase: PHASE_II
        status: COMPLETED
        description: A single-centre, randomized, placebo-controlled, parallel-group phase 2 trial of
          faecal microbiota transplantation (FMT) in newly diagnosed, treatment-naive PSP-RS patients.
          The primary endpoint (PSP Rating Scale change at week 16) was met with a significant treatment
          benefit, and nonmotor symptoms (constipation, depression, anxiety) also improved. This is the
          only positive disease-relevant treatment signal reported in PSP to date and requires multicentre
          replication.
        target_phenotypes:
        - preferred_term: Constipation
          term:
            id: HP:0002019
            label: Constipation
        - preferred_term: Depression
          term:
            id: HP:0000716
            label: Depression
        notes: 'Registry identifier caveat. The publication prints "Clinicaltrials.gov identifier: ChiCTR-2100045397",
          which is wrong twice over: ChiCTR is not ClinicalTrials.gov, and no registry holds a hyphenated
          "ChiCTR-2100045397" — the canonical form is ChiCTR2100045397, curated here and citable as ICTRP:ChiCTR2100045397.
          The registration is matched to this publication on sponsor (First Affiliated Hospital of Zhengzhou
          University), investigators (Liu H, Teng J appear as both registry contacts and authors), intervention
          (faecal microbiota transplantation), and registration date (2021-04-14, before the reported
          enrolment). The registered record and the published report do NOT agree on design: ChiCTR describes
          a single-arm phase 0 study of "movement disorders" with a healthy control group and a 79 + 79
          target, while the paper reports a randomised, placebo-controlled phase 2 trial confined to PSP-RS.
          The phase/status curated here follow the publication; the discrepancy is recorded rather than
          resolved, and is a further reason the single-centre result needs replication.'
      selected_evidence:
        snippet: At week 16, the mean PSP Rating Scale (PSPRS) scores (the primary outcome) improved from
          40.1 (SD 7.6) to 36.9 (SD 5.9) in the FMT group
        supports: SUPPORT
