      assertion_type: Pathophysiology
      assertion:
        name: Retinal Break and RPE Cell Dispersion into Vitreous
        description: A full-thickness retinal break, detachment, or surgical/traumatic injury breaches
          the retina and the retinal pigment epithelial monolayer. RPE cells lose contact with Bruch's
          membrane and disperse into the vitreous cavity and subretinal space, where local injury triggers
          an inflammatory response that induces the formation of multilayered groups of migratory RPE
          cells.
        role: trigger
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
        - preferred_term: vitreous body
          term:
            id: UBERON:0001798
            label: vitreous body
        cell_types:
        - preferred_term: Retinal Pigment Epithelial Cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        biological_processes:
        - preferred_term: Cell Migration
          term:
            id: GO:0016477
            label: cell migration
          modifier: INCREASED
      selected_evidence:
        snippet: injury of the retina induces an inflammatory response that upregulates HGF expression
          inducing the formation of multilayered groups of migratory retinal pigment epithelial cells
          (RPE)
        supports: SUPPORT
