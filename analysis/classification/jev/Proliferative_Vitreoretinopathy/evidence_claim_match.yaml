      assertion:
        name: Tractional Retinal Redetachment
        description: Contraction of the fibrocellular membranes exerts traction on the underlying retina,
          producing fixed retinal folds and epiretinal/subretinal membranes that progress to tractional
          (re)detachment. Severity is staged clinically by the 1991 Retina Society classification (Grades
          A-C, subdivided anterior/posterior and by clock hour extent), which remains the basis for current
          OCT-correlated staging.
        role: outcome
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
      selected_evidence:
        snippet: A more detailed description of posterior and anterior contractions has been made possible
          by adding contraction types such as focal, diffuse, subretinal, circumferential contraction,
          and anterior displacement.
        supports: SUPPORT
