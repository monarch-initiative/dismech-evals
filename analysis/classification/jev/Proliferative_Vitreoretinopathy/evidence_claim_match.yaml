              label: proliferative vitreoretinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RPE Epithelial-Mesenchymal Transition
        conforms_to: fibrotic_response#Mesenchymal Cell Activation
        description: Dispersed RPE cells lose epithelial cell-cell contacts and undergo epithelial-mesenchymal
          transition (EMT) into matrix-producing, contractile myofibroblast-like cells. TGF-beta activated
          in the vitreous upregulates connective tissue growth factor (CTGF), and under the combined influence
          of TGF-beta and CTGF, RPE cells become myofibroblastic.
        role: central_effector
        cell_types:
        - preferred_term: Retinal Pigment Epithelial Cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        - preferred_term: Myofibroblast
          term:
            id: CL:0000186
            label: myofibroblast cell
        biological_processes:
        - preferred_term: Epithelial to Mesenchymal Transition
          term:
            id: GO:0001837
            label: epithelial to mesenchymal transition
          modifier: INCREASED
        - preferred_term: TGF-beta Receptor Signaling
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: RPE cells undergo a process named epithelial-mesenchymal transition (EMT), by which differentiated
          epithelial cells go through a phenotypic conversion that gives rise to the matrix-producing
          fibroblasts and myofibroblasts
        supports: SUPPORT
