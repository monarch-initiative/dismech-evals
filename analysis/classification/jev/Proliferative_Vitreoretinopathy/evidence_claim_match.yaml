      assertion:
        name: Contractile Fibrocellular Membrane Formation
        description: Myofibroblast-like RPE cells, together with glial cells (notably Muller cells) recruited
          from the retina, proliferate and deposit extracellular matrix, forming contractile fibrocellular
          membranes on the retinal surfaces and posterior vitreous cortex. Vitreous TGF-beta2 levels rise
          in proportion to the degree of intraocular fibrosis, and elevated vitreous cytokines are predictive
          of membrane formation.
        role: amplifier
        cell_types:
        - preferred_term: Retinal Pigment Epithelial Cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        - preferred_term: Muller Cell
          term:
            id: CL:0000636
            label: Mueller cell
        biological_processes:
        - preferred_term: Extracellular Matrix Organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: INCREASED
      selected_evidence:
        snippet: vitreous aspirates from eyes with intraocular fibrosis associated with PVR have more
          than three times the amount of TGF-beta
        supports: SUPPORT
