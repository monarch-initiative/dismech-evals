  65ef3ea8bb30fab3b91f6d80cd9c37bf2e8a73d3fd02e98bef2d8283590ba4a8:
    claim:
      about:
        disease:
          name: Propofol Infusion Syndrome
        context: []
      assertion_type: Definition
      assertion:
        name: Classic PRIS case definition
        definition_type: CASE_DEFINITION
        derivation_basis: ESTABLISHED_CRITERIA
        description: Acute refractory bradycardia progressing to asystole, together with at least one
          of metabolic acidosis with a base deficit above 10 mmol/L, rhabdomyolysis, hyperlipidemia, or
          an enlarged or fatty liver, in a patient receiving propofol.
        notes: Recorded as a case definition rather than consensus diagnostic criteria, because the structured
          review of 153 published cases states that no widely accepted definition exists and that reported
          cases describe varying combinations of features.
      selected_evidence:
        snippet: 'The clinical features of propofol infusion syndrome (PRIS) are acute refractory bradycardia
          leading to asystole, in the presence of one or more of the following: metabolic acidosis (base
          deficit > 10 mmol.l(-1)), rhabdomyolysis, hyperlipidaemia, and enlarged or fatty liver.'
        supports: SUPPORT
