        discussion_id: q_pris_genetic_susceptibility
        kind: KNOWLEDGE_GAP
        prompt: Does an inherited susceptibility determine which patients receiving high-dose prolonged
          propofol develop propofol infusion syndrome?
        rationale: The syndrome is rare relative to how widely propofol is used for intensive-care sedation,
          which implies host susceptibility rather than dose alone. Subclinical mitochondrial disease
          is listed among the predisposing factors, and a fatty-acid-oxidation defect is one of the two
          proposed mechanisms, so an inherited partial defect in either pathway is a plausible determinant.
          The question has been open since the syndrome was named and no cited source here resolves it.
        attaches_to:
        - pathophysiology#Impaired Mitochondrial Fatty Acid Oxidation
        - pathophysiology#Mitochondrial Respiratory Chain Inhibition by Propofol
      selected_evidence:
        snippet: Uncertainty remains as to whether a genetic susceptibility exists.
