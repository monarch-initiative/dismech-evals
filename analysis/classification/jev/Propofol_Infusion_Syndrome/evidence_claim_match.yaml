  9b567612132f6a8f174c169f6ba6854e24ca85420565452467287ff25925f306:
    claim:
      about:
        disease:
          name: Propofol Infusion Syndrome
        context: []
      assertion_type: EpidemiologyInfo
      assertion:
        name: Incidence in critically ill adults on propofol for more than 24 hours
        description: In a prospective multicenter cohort of 1,017 critically ill adults prescribed propofol,
          the syndrome developed in 11, slightly exceeding 1%, under a conservative definition requiring
          metabolic acidosis plus cardiac dysfunction plus one of rhabdomyolysis, hypertriglyceridemia
          or renal failure. This is the only prospective incidence estimate; every other figure in this
          entry comes from pooled case reports, where the denominator is unknown.
        unit: proportion of a prospective ICU cohort
      selected_evidence:
        snippet: 'CONCLUSIONS: Despite using a conservative definition for PRIS, and only considering
          new-onset PRIS clinical manifestations, the incidence of PRIS slightly exceeds 1%.'
        supports: SUPPORT
    origin:
