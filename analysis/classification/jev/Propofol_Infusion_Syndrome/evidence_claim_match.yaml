        name: Impaired Mitochondrial Fatty Acid Oxidation
        biological_scale: MOLECULAR
        description: Propofol also produces a defect of fatty acid oxidation, evidenced in children with
          PRIS by accumulation of acylcarnitine species that normalised once the infusion stopped. Free
          fatty acids rise at the same time, because critical illness shifts the energy source toward
          lipolysis and the lipid vehicle of propofol adds further substrate.
        biological_processes:
        - preferred_term: fatty acid beta-oxidation
          modifier: DECREASED
          term:
            id: GO:0006635
            label: fatty acid beta-oxidation
      selected_evidence:
        snippet: increased plasma concentrations of acyl derivatives of carnitine in children with PRIS,
          which normalised after cessation of propofol infusion, suggesting a propofol-induced defect
          of fatty acid oxidation
        supports: SUPPORT
