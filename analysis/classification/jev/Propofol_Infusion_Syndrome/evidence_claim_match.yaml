      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Respiratory Chain Inhibition by Propofol
        biological_scale: MOLECULAR
        description: Propofol inhibits electron transport, with complex I more sensitive than complex
          II, and additionally permits a proton leak across the inner mitochondrial membrane. The result
          is reduced oxidative phosphorylation capacity with a dissipated proton-motive force.
        biological_processes:
        - preferred_term: mitochondrial electron transport, NADH to ubiquinone
          modifier: DECREASED
          term:
            id: GO:0006120
            label: mitochondrial electron transport, NADH to ubiquinone
        - preferred_term: proton leak across the inner mitochondrial membrane
          modifier: INCREASED
          term:
            id: GO:1902600
            label: proton transmembrane transport
      selected_evidence:
        snippet: Complex I in isolated rat liver mitochondria is more sensitive to inhibition by propofol
          than complex II
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
