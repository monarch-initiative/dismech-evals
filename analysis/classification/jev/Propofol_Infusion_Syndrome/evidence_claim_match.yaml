          the right precordial leads, which is the Brugada type 1 pattern, so the tracing alone does not
          separate the two. What separates them is the clinical setting, the accompanying metabolic and
          muscle findings, and resolution once the infusion stops. Whether the pattern here should be
          called a Brugada phenocopy is contested, and the dispute matters because this syndrome is where
          the term was coined; see notes.
        phenotypes:
        - name: Coved type ST segment elevation
          phenotype_term:
            preferred_term: Coved type ST segment elevation
            term:
              id: HP:6000984
              label: Coved type ST segment elevation
        distinguishing_features:
        - A high-dose, prolonged propofol infusion is running when the pattern appears
        - Accompanying metabolic acidosis, rhabdomyolysis, hyperkalemia or hepatomegaly, which congenital
          Brugada syndrome does not produce
        - Resolution of the pattern after the infusion is stopped
        - Right bundle branch block accompanying the coved ST elevation as an early sign
        notes: Whether the electrocardiographic change in this syndrome is a Brugada phenocopy is unsettled,
          and the tension sits inside a single paper. PMID:23094876 credits Riera and colleagues with
          introducing the term for propofol infusion syndrome, and in the same text lists propofol among
          its Group 1 agents, states that nearly all of those act via sodium channel blockade, and concludes
          that Group 1 drugs for the most part cannot be considered Brugada phenocopies. The entry records
          both statements rather than choosing between them. Brugada_Syndrome carries the reciprocal differential.
          No sodium-channel mechanism is asserted for propofol in this entry's pathophysiology, because
          the reviews cited here attribute the syndrome to mitochondrial impairment and do not establish
          a channel-blocking mechanism for the ECG change.
      selected_evidence:
        snippet: This anesthetic drug may cause a rare condition named propofol infusion syndrome, characterized
          by unexplained lactic acidosis, lipemia, rhabdomyolysis, cardiovascular collapse and Brugada-like
          electrocardiographic pattern or Brugada electrocardiographic phenocopy changes following high-dose
          propofol infusion over prolonged periods of time.
        supports: SUPPORT
