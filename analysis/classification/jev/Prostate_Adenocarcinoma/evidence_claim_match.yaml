  92eb3e8c5e382ab849648152445cd2fb2d3a3851d523d5f6bdb82e03ce66b18f:
    claim:
      about:
        disease:
          name: Prostate Adenocarcinoma
          disease_term:
            preferred_term: prostate adenocarcinoma
            term:
              id: MONDO:0005082
              label: prostate adenocarcinoma
        context: []
      assertion_type: Definition
      assertion:
        name: 13-CMB AI morphometric predictor of neoadjuvant ADT response
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'A computable, image-derived predictor that classifies a prostate adenocarcinoma
          needle biopsy as a likely responder or non-responder to neoadjuvant androgen deprivation therapy
          (NADT) — the terminology used in the source publication. Inputs are the abundance levels of
          13 cellular morphometric biomarkers (CMBs) — unsupervised, machine-learned cell-appearance prototypes
          extracted from H&E whole-slide images by the CMB-ML pipeline (stacked predictive sparse decomposition),
          NOT named histopathology findings — combined by a LASSO regression into a continuous treatment-resistance
          score that is dichotomized into responder versus non-responder. The predictor operationalizes
          the split that this entry''s "Signaling Bypass and Castration Resistance" node captures: the
          non-responder state it flags converges on PI3K/AKT/mTORC1-hyperactive adaptive resistance (see
          conforms_to on that node, mtor_androgen_deprivation_resistance), which is why it also predicts
          potential benefit from adding an mTOR inhibitor in non-responders.'
        scope: Research-grade, imaging-derived treatment-response predictor from routine H&E needle-biopsy
          whole-slide images. This is NOT an OHDSI/OMOP EHR case-finding query and NOT a consensus/validated
          clinical phenotype; it is a published AI biomarker validated retrospectively across independent
          cohorts. The 13 CMBs are latent learned features (cluster prototypes), so they are not individually
          ontology-mappable to NCIT histopathology terms; the biological correlates and the mTOR-resistance
          mechanism are what carry ontology grounding (on the pathophysiology nodes and the conformed
          module).
        attaches_to:
        - pathophysiology#Signaling Bypass and Castration Resistance
        validation_status:
          status: UNVALIDATED
          rationale: 'Executed and evaluated against treatment-response and outcome reference standards
            across four cohorts, but not against a prospective/consensus gold standard, so it is beyond
            PROPOSED yet short of VALIDATED_AGAINST_GOLD_STANDARD. Reported performance: AUC 0.981 for
            NADT-plus-enzalutamide response in the NCT02430480 training cohort (n = 37); significant stratification
            of pathologic complete response (p = 0.0005) and biochemical recurrence-free survival (p =
            0.024) in an independent hospital cohort (n = 122); BCRFS (p = 0.031) in a second hospital
            cohort (n = 60); and progression-free survival (p = 0.0017) in TCGA-PRAD (n = 396), remaining
            significant and independent after adjustment for established clinical factors and the Decipher
            and Oncotype DX genomic biomarkers. Key limitations that keep it UNVALIDATED as a clinical
            assay: small training cohort (n = 37); validation confined to two independent hospital cohorts
            plus a public genomic cohort; and no prospective evaluation reported, the publication positioning
            the model as one that "could potentially serve as a robust solution for precision management".'
        notes: 'Schema-fit caveat (design-register item): dismech''s derivation_basis enum has no value
          for an empirically-derived AI/imaging predictor. ESTABLISHED_CRITERIA is used here under its
          "validated computable phenotype" clause because the model is a published, cohort-validated computable
          predictor; its research-grade, not-yet-gold-standard maturity is carried separately (and honestly)
          by validation_status: UNVALIDATED. definition_type PHENOTYPE_ALGORITHM is likewise the closest
          available bucket — the model is a computable predictive algorithm, but on H&E whole-slide-image
          features rather than OMOP/EHR case-finding logic, so it cannot be expressed as inline criteria_sets.
          Provenance: Yan et al., Cancer Letters 647 (2026) 218447, doi:10.1016/j.canlet.2026.218447,
          trial NCT02430480. A dedicated imaging/ML-biomarker definition_type and an EMPIRICAL_MODEL derivation_basis
          are proposed follow-ups for the design register.'
      selected_evidence:
        snippet: we identified 13 cellular morphometric biomarkers (CMBs), as a New Approach Methodology
          (NAM), from whole slide images of needle biopsies in clinical trial specimens (NCT02430480,
          n = 37) that accurately predicted response to neoadjuvant androgen deprivation therapy (NADT)
          plus enzalutamide
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41887393
      reference_title: AI-discovered cellular morphometric biomarkers in needle biopsy of prostate cancer
        predict neoadjuvant androgen deprivation therapy response and enable therapeutic targeting of
        mTOR in androgen deprivation therapy-resistant tumors.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the 13-CMB LASSO model as an AI predictor of NADT response derived from
        H&E whole-slide images of needle biopsies in the trial cohort.
