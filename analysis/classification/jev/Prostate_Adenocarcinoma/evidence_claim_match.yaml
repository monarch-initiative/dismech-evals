        description: A distinct integrated footprint attributes part of the mutation burden to oxidative
          DNA damage handled by a faulty base-excision repair pathway, marked by the substitution signature
          SBS18 and concentrated in late-replicating regions. It is anti-correlated with tumor hypoxia
          score, so it reads as an oxygen-dependent damage process rather than as a consequence of the
          hypoxic niche. Among the footprints that carry prognostic weight, this is one of the four associated
          with shorter time to metastasis, which makes oxidative mutagenesis a candidate risk axis independent
          of Gleason grade group and tumor mutational burden.
