        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TMPRSS2:ERG Fusion-Driven ETS Activation
        genetic_context:
          variant_origin: SOMATIC
        description: In approximately half of prostate adenocarcinomas an androgen-responsive TMPRSS2
          promoter is fused to the ETS transcription factor ERG, placing ERG under androgen control and
          driving its aberrant overexpression. The resulting ETS transcriptional program promotes an invasion-associated,
          less-differentiated phenotype and defines the predominant molecular subtype of the disease.
        cell_types:
        - preferred_term: epithelial cell of prostate
          term:
            id: CL:0002231
            label: epithelial cell of prostate
        biological_processes:
        - preferred_term: ETS (ERG) target gene transcriptional activation
          modifier: INCREASED
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
        locations:
        - preferred_term: prostate gland
          term:
            id: UBERON:0002367
            label: prostate gland
      selected_evidence:
        snippet: Cell line experiments suggest that the androgen-responsive promoter elements of TMPRSS2
          mediate the overexpression of ETS family members in prostate cancer.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16254181
      reference_title: Recurrent fusion of TMPRSS2 and ETS transcription factor genes in prostate cancer.
      evidence_source: IN_VITRO
      explanation: This identifies the androgen-driven TMPRSS2 promoter as the mechanism placing ETS factors
