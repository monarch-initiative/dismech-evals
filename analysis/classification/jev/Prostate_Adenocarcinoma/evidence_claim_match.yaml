      assertion:
        name: Mismatch Repair Deficiency and Microsatellite Instability
        biological_scale: MOLECULAR
        conforms_to: genome_instability_mutation#Genome-Maintenance Defect or Replication Stress
        description: 'Loss of DNA mismatch repair, most often through MSH2 alteration, produces the replicative-slippage
          footprint that combines the MMR-associated substitution signatures with the characteristic indel
          signature, and yields microsatellite instability. Its topographical behaviour is diagnostic:
          where the other mutational processes are strongly biased by replication timing and chromatin
          state, mismatch-repair-deficient tumors mutate at a near-uniform rate across the genome, consistent
          with replication-coupled repair normally being most efficient in early-replicating regions.
          Unlike the other footprints curated here it is also detectable in chromosomally stable tumors.
          This is the mechanism behind the entry''s biomarker-selected checkpoint-blockade indication.'
        cell_types:
        - preferred_term: epithelial cell of prostate
          term:
            id: CL:0002231
            label: epithelial cell of prostate
        biological_processes:
        - preferred_term: mismatch repair
          modifier: DECREASED
          term:
            id: GO:0006298
            label: mismatch repair
      selected_evidence:
        snippet: IMF1 (MMRd) activity correlated with MMRd-related mutational signatures SBS15, SBS21
          and ID2
