      assertion:
        name: APOBEC Cytidine Deaminase Mutagenesis
        biological_scale: MOLECULAR
        description: 'APOBEC-family cytidine deaminase activity contributes a separate footprint carrying
          the APOBEC substitution signatures. Its regional behaviour links it to structural catastrophe
          rather than to replication timing: APOBEC-signature mutations cluster around complex structural-variant
          breakpoints, consistent with single-stranded DNA exposed during chromothripsis being edited
          by the deaminase. Clonality analysis places APOBEC mutations early in tumor evolution while
          the impaired-recombination signatures accompanying this footprint appear subclonally, which
          is the argument for reading APOBEC editing as the driving aetiology here and the recombination
          signatures as a later, separate process.'
