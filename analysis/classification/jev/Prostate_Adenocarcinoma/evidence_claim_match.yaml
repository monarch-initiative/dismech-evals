        biological_scale: CELLULAR
        description: A mechanism located in the tumor stroma rather than in the tumor cell. The RasGAP
          gene RASAL3 is epigenetically silenced in prostatic cancer-associated fibroblasts, by promoter
          and exon 2 hypermethylation, which raises Ras activity in those fibroblasts. Androgen deprivation
          therapy increases the silencing. Because the lesion is in the fibroblast and is epigenetic,
          it is not a tumor-cell genetic alteration and no RASAL3 variant is implied.
        genes:
        - preferred_term: RASAL3
          description: RasGAP silenced by promoter and exon 2 hypermethylation in prostatic cancer-associated
            fibroblasts.
          term:
            id: hgnc:26129
            label: RASAL3
        cell_types:
        - preferred_term: prostatic cancer-associated fibroblast
          description: Cancer-associated fibroblasts from human prostate; the Cell Ontology has no cancer-associated
            fibroblast term, so the prostatic connective-tissue fibroblast is bound and the cancer-associated
            state is carried in preferred_term.
          term:
            id: CL:1000299
            label: fibroblast of connective tissue of prostate
        biological_processes:
        - preferred_term: Ras protein signal transduction
          modifier: INCREASED
          term:
            id: GO:0007265
            label: Ras protein signal transduction
      selected_evidence:
        snippet: Bisulfite sequencing of exon 2 demonstrated 73.3% CpG dinucleotide methylation of RASAL3
