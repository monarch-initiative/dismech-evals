              id: MONDO:0005082
              label: prostate adenocarcinoma
        context: []
      assertion_type: Stage
      assertion:
        name: Metastatic
        description: Advanced prostate adenocarcinoma that has spread beyond the prostate and regional
          lymph nodes, most commonly to bone, lymph node, liver, and lung. The metastatic state is sustained
          by persistent androgen receptor signaling, lineage plasticity under treatment pressure, osteoblastic
          bone tropism, and progressive emergence of castration resistance.
        notes: Folded in from the former Metastatic_Prostate_Cancer entry (cancer granularity ladder,
          design decisions §3a). Bone metastasis is the defining metastatic phenotype, but liver and lung
          involvement become more common in late castration-resistant disease; the central biologic transition
          is continued AR dependence followed by adaptive AR-independent escape. The Osteoblastic Bone
          Tropism and Clonal Evolution and Lineage Plasticity pathophysiology nodes carry the stage-specific
          mechanism content.
      selected_evidence:
        snippet: Approximately 10% of patients present with metastatic prostate cancer, which has a 5-year
          survival rate of 37%.
        supports: SUPPORT
    origin:
