  854032e4e5e070752a0d7de17221e31f93744d39e1b0b0782d1b8f1576ee4db0:
    claim:
      about:
        disease:
          name: Prostate Adenocarcinoma
          disease_term:
            preferred_term: prostate adenocarcinoma
            term:
              id: MONDO:0005082
              label: prostate adenocarcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: AR-Mediated Mutagenesis at Androgen Receptor Binding Sites
        biological_scale: MOLECULAR
        description: 'Androgen receptor binding is a mutagenic event and not only a transcriptional one.
          Whole-genome analysis of the Pan Prostate Cancer Group cohort identifies AR-mediated mutagenesis
          as the most recurrent integrated mutational footprint in chromosomally unstable primary tumors,
          raising the local mutation rate at tumor-specific AR binding sites (TARBSs) and concentrating
          chromoplexy - chains of interchromosomal complex rearrangements - specifically and uniquely
          at those sites. Chromoplexy is an established generator of ERG fusions, and it is concentrated
          at AR binding sites, so this process is the most likely origin of the androgen-driven fusion
          events this entry already models - but the step that AR binding is what localizes the chromoplexy
          remains an inference from co-localization, not a demonstrated one. Its intensity tracks the
          epigenetic state of the site rather than AR occupancy alone: TARBSs are enriched for unmethylated
          CpGs, which places the process in early-replicating, transcriptionally active chromatin and
          accounts for the local depletion of the 5-methylcytosine-deamination signature SBS1 there.'
        cell_types:
        - preferred_term: epithelial cell of prostate
          term:
            id: CL:0002231
            label: epithelial cell of prostate
        biological_processes:
        - preferred_term: androgen receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0030521
            label: androgen receptor signaling pathway
        - preferred_term: chromoplexy (chained interchromosomal rearrangement) at AR binding sites
          modifier: INCREASED
          term:
            id: GO:0006310
            label: DNA recombination
        locations:
        - preferred_term: prostate gland
          term:
            id: UBERON:0002367
            label: prostate gland
        notes: 'Deliberately carries no genetic_context block. The lesion here is a process-level bias
          in where mutations land, not a single somatic variant, and a SOMATIC variant_origin on this
          node would be read by the cancer-cell-of-origin derivation as a second transforming lesion alongside
          the ETS fusion node.


          Two limits on the edge into the ETS-fusion node, both of which the sources state themselves.
          First, the AR attribution is inferential: the PPCG cohort shows chromoplexy enriched at AR binding
          sites, and the chromoplexy paper says of the same link that "this hypothesis awaits experimental
          validation". The experimental arm - androgen-induced double-strand breaks at translocation partners
          - exists in the earlier TOP2B and AID literature, which this entry does not yet cite; citing
          it is the obvious next step. Second, the association the PPCG paper reports between this footprint
          and ETS-fusion status (Cohen''s d = 0.75) is directionally ambiguous on its own, since a fusion
          raises AR-pathway output. The direction of this edge rests on the clonal ordering in PMID:23622249,
          not on that correlation.'
      selected_evidence:
        snippet: IMFs were strongly influenced by regional biases in the genome, most prevalently androgen
          receptor-mediated mutagenesis and replication stress.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/12
      evidence_path: /pathophysiology/12/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42717097
      reference_title: Integrated signatures define mutational processes in prostate cancer.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies AR-mediated mutagenesis as one of the two dominant regional influences shaping
        mutational processes across primary prostate cancer genomes, which is the claim this node makes.
