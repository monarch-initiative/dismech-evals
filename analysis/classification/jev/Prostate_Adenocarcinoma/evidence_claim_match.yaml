          BRCA-driven one by both its driver and its damage pattern. It is associated with CDK12 mutation,
          which phenocopies impaired homologous recombination without BRCA1/2 loss, and its structural
          signature is dominated by tandem duplications rather than by microhomology-mediated deletion.
          It is enriched in patients of African ancestry and confers a high risk of progression to metastasis.
          Curating it separately matters clinically, because a tumor can carry a homologous-recombination-like
          footprint while being negative for the BRCA alterations that current PARP-inhibitor eligibility
          is written around.
