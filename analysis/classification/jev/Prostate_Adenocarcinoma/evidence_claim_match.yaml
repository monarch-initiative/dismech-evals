      assertion_type: Pathophysiology
      assertion:
        name: EZH2-Mediated DAB2IP Silencing
        biological_scale: MOLECULAR
        description: The RasGAP gene DAB2IP is epigenetically silenced in prostate cancer, with the polycomb
          histone methyltransferase EZH2 binding the DAB2IP promoter in prostate cancer cells and suppressing
          its expression. Because DAB2IP acts as a scaffold restraining both Ras and NF-kappaB through
          separate domains, its loss releases the two pathways together, promoting tumor growth and metastasis
          in orthotopic mouse models. DAB2IP expression falls with increasing tumor grade in human prostate
          cancer. This is a loss of expression through chromatin regulation rather than a recurrent mutation
          of DAB2IP itself.
        genes:
        - preferred_term: DAB2IP
          description: The silenced RasGAP scaffold whose loss releases Ras and NF-kappaB signaling.
          term:
            id: hgnc:17294
            label: DAB2IP
        - preferred_term: EZH2
          description: Polycomb histone methyltransferase that represses the DAB2IP promoter in prostate
            cancer cells.
          term:
            id: hgnc:3527
            label: EZH2
        cell_types:
        - preferred_term: prostate epithelial cell
          term:
            id: CL:0002231
            label: epithelial cell of prostate
        biological_processes:
        - preferred_term: Ras protein signal transduction
          modifier: INCREASED
          term:
            id: GO:0007265
            label: Ras protein signal transduction
        - preferred_term: canonical NF-kappaB signal transduction
          modifier: INCREASED
          term:
            id: GO:0007249
            label: canonical NF-kappaB signal transduction
      selected_evidence:
        snippet: we have demonstrated that an increased Ezh2 expression in normal prostatic epithelial
          cells can suppress hDAB2IP gene expression
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
      evidence_path: /pathophysiology/9/evidence/0
      context_paths:
