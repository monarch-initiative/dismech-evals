        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Replication Stress-Driven Chromosomal Instability
        biological_scale: CELLULAR
        conforms_to: genome_instability_mutation#Genome-Maintenance Defect or Replication Stress
        description: 'Dysfunctional DNA replication is the dominant mutational process in roughly a quarter
          of chromosomally unstable primary prostate cancers, resolving into two integrated footprints:
          one combining mitotic-machinery defects with replication stress, and one linked to SPOP and
          WNT-pathway alterations. Faulty replicated DNA persisting into mitosis yields copy-number and
          complex structural change rather than a distinctive base-substitution spectrum, which is why
          the process was only resolved by integrating substitution, indel, copy-number and complex structural-variant
          signatures. Clinically this footprint separates from the metastasis-associated processes in
          two ways: it predominates in late-onset disease, and higher activity of the SPOP-associated
          footprint marked tumors that failed later on AR pathway inhibitors than on taxanes.'
        cell_types:
        - preferred_term: epithelial cell of prostate
          term:
            id: CL:0002231
            label: epithelial cell of prostate
        biological_processes:
        - preferred_term: DNA replication under replication stress
          modifier: ABNORMAL
          term:
            id: GO:0006260
            label: DNA replication
        - preferred_term: chromosome organization
          modifier: ABNORMAL
          term:
            id: GO:0051276
            label: chromosome organization
      selected_evidence:
        snippet: Our study also identified a pervasive role for replication stress in prostate cancer,
          with dysfunctional DNA replication as the dominant mutational process in 28% of prostate cancers
          with CIN
        supports: SUPPORT
