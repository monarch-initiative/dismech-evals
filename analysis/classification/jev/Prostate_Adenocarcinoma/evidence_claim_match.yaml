  47786e3c03389be8b05d4f3c65164e366f884a23a6fd1db9f50c15fd4802ed49:
    claim:
      about:
        disease:
          name: Prostate Adenocarcinoma
          disease_term:
            preferred_term: prostate adenocarcinoma
            term:
              id: MONDO:0005082
              label: prostate adenocarcinoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kg_prostate_integrated_mutational_footprint_biomarker_validation
        prompt: Integrated mutational footprints stratify metastasis risk in primary prostate cancer and,
          in one footprint, separate men who fail later on an AR pathway inhibitor than on a taxane. Both
          results come from retrospective cohorts - the treatment result from a target trial emulation
          over real-world metastatic whole-genome data with small subgroups. Does an integrated footprint
          add risk or treatment-selection information beyond Gleason grade group, stage, tumour mutational
          burden and the single-gene biomarkers already in use, when measured prospectively?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Replication Stress-Driven Chromosomal Instability
        - pathophysiology#Reactive Oxygen Species-Driven Mutagenesis
        - pathophysiology#CDK12-Associated Non-Canonical Homologous Recombination Impairment
        - pathophysiology#Homologous Recombination Deficiency
        - treatments#Androgen Deprivation plus AR Pathway Inhibition
        rationale: 'The gap is not whether these mutational processes exist - the footprints are derived
          from whole-genome data and each carries a driver-gene and signature-level aetiology, which is
          why they are curated as mechanism nodes in this entry. It is whether they are usable. Two of
          the claims that would matter clinically rest on designs that cannot settle the question. The
          metastasis-risk associations are from a multivariate model on an observational cohort, so they
          establish independence from the recorded covariates rather than incremental value over the decision
          rule a clinician actually applies. The treatment-selection result is a trial emulation, and
          its authors are explicit that it is hypothesis generating with limited subgroup sizes; only
          seven patients in that cohort carried the single-gene alteration the footprint is thought to
          generalize. There is also an ascertainment asymmetry worth stating: the footprints were defined
          on tumours with chromosomal instability and quantified in whole-genome sequencing, so a prospective
          test has to specify how a tumour with low purity, low variant burden, or targeted-panel-only
          sequencing is classified, since roughly a sixth of the discovery cohort could not be assigned
          any mutational process at all.'
      selected_evidence:
        snippet: As our trial emulation analyses are retrospective and observational, with limited subgroup
          sizes, these findings should be viewed as hypothesis generating
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42717097
      reference_title: Integrated signatures define mutational processes in prostate cancer.
      evidence_source: HUMAN_CLINICAL
      explanation: The authors' own characterization of the treatment-selection result as hypothesis generating
        is the basis for curating this as an open gap rather than as a predictive biomarker.
