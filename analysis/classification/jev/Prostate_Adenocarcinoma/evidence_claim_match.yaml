  d22979ff919485cf32742a89c891aebbf51b01b11b50a585cf7f45a526a8ff44:
    claim:
      about:
        disease:
          name: Prostate Adenocarcinoma
          disease_term:
            preferred_term: prostate adenocarcinoma
            term:
              id: MONDO:0005082
              label: prostate adenocarcinoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hmm_prostate_microbial_androgen_biosynthesis_castration_resistance
        prompt: 'In mice, gut commensals expand under androgen deprivation and supply an alternative source
          of active androgens: antibiotic ablation of the gut microbiota delays the emergence of castration
          resistance, and fecal transplant from castration-resistant donors confers it. In humans the
          same axis is so far only an association - the intestinal community of patients with castration-resistant
          prostate cancer is enriched for androgen-converting species, with no interventional human evidence.
          Does microbial androgen biosynthesis contribute to castration resistance in human prostate cancer,
          or is the mouse dependency amplified by a host in which adrenal androgen production is negligible?'
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Androgen Receptor Signaling Dependence
        - pathophysiology#Signaling Bypass and Castration Resistance
        - treatments#Androgen Deprivation Therapy
        rationale: 'This entry curates castration resistance as a tumor-intrinsic bypass - AR amplification,
          AR splice variants, and intratumoral steroidogenesis. The mouse evidence adds a host-external
          route the pathograph does not represent: the gut community itself converting circulating androgen
          precursors into active androgens, restoring ligand to the receptor the therapy was meant to
          starve. What keeps this from being curated as a mechanism node is a species difference that
          is mechanistically load-bearing rather than incidental. Mice produce little adrenal androgen,
          so a microbial precursor-conversion route faces little host competition there; in castrated
          men, adrenal DHEA and androstenedione remain a substantial precursor pool that intratumoral
          steroidogenesis already exploits, which is the rationale for abiraterone. A microbial contribution
          in humans therefore has to be shown to be non-redundant with a pathway this entry already models,
          not merely present. The human data reported alongside the mouse experiments are observational,
          and the cross-disease review that prompted this discussion still describes microbial metabolism
          of host hormonal precursors as hypothesized rather than established for endocrine-therapy resistance.
          Until a human intervention separates the two sources, an edge from a microbial node into castration
          resistance would assert translational validity that the evidence does not yet carry.'
        proposed_experiments:
        - experiment_id: exp_prostate_microbial_androgen_conversion_human_intervention
          name: Human test of whether gut microbial androgen conversion is non-redundant with adrenal
            precursor supply
          description: In men starting androgen deprivation therapy, serially profile the fecal metagenome
            for androgen-converting gene content alongside serum and fecal steroid metabolomics, and test
            whether microbial conversion capacity predicts time to castration resistance independently
            of adrenal precursor levels. Nest a randomized microbiota-directed intervention (a narrow-spectrum
            antimicrobial or defined live biotherapeutic selected against the converting taxa) within
            the cohort, stratified by baseline adrenal androgen level, so that a microbial effect can
            be distinguished from the adrenal-precursor route that abiraterone already targets.
          experiment_type:
            preferred_term: randomized microbiota-directed intervention nested in a prospective cohort
          readouts:
          - name: Microbial androgen-conversion capacity and time to castration resistance
            target: pathophysiology#Signaling Bypass and Castration Resistance
            description: Association between baseline and on-treatment fecal androgen-converting gene
              content and time to biochemical castration resistance, adjusted for serum adrenal androgen
              precursors.
            assays:
            - preferred_term: shotgun metagenomic sequencing
            - preferred_term: targeted steroid mass spectrometry
          - name: Circulating active androgen after microbiota-directed intervention
            target: pathophysiology#Androgen Receptor Signaling Dependence
            description: Change in serum testosterone and dihydrotestosterone in the intervention arm
              relative to control, within adrenal-androgen strata.
            assays:
            - preferred_term: targeted steroid mass spectrometry
            direction: DECREASED
          decision_criterion: Translational validity is supported if microbial androgen-conversion capacity
            predicts earlier castration resistance independently of adrenal precursor levels AND the microbiota-directed
            intervention lowers active androgen and delays resistance in men with low adrenal androgen
            output. It is not supported if the association disappears after adjustment for adrenal precursors,
            or if the intervention alters community composition without changing androgen levels or outcome
            - in which case the mouse result should stay flagged as model-specific.
          would_support:
          - pathophysiology#Signaling Bypass and Castration Resistance
        notes: 'Recorded from monarch-initiative/dismech#6383. Typed HUMAN_MODEL_MISMATCH rather than
          KNOWLEDGE_GAP because the evidence is not absent - it is strong and causal in mice, and the
          open question is whether it transfers to human castration resistance. The PMID:42426614 item
          carries `evidence_source: OTHER` because that publication is a narrative review making a field-level
          synthesis claim rather than reporting primary data; see monarch-initiative/dismech#8184.'
      selected_evidence:
        snippet: Ablation of the gut microbiota by antibiotic therapy delayed the emergence of castration
          resistance even in immunodeficient mice.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34618582
      reference_title: Commensal bacteria promote endocrine resistance in prostate cancer through androgen
        biosynthesis.
      evidence_source: MODEL_ORGANISM
      explanation: 'The causal arm of the claim, and it is entirely murine: removing the microbiota changes
        the timing of castration resistance in mice.'
