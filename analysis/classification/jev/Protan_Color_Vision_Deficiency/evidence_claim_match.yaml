      assertion_type: Subtype
      assertion:
        name: Protanomaly
        display_name: Protanomaly (protanomalous trichromacy)
        description: Anomalous trichromatic form. The array lacks a normal L gene and its first two genes
          encode two M-class pigments that differ slightly in spectral peak, for example a 5'L-3'M hybrid
          together with a normal M gene. The two M-class cone populations support a weak red-green signal.
          Because M-class pigments can be separated by only a few nanometres, protanomalous observers
          as a group discriminate colours somewhat worse than deuteranomalous observers.
        genes:
        - preferred_term: OPN1LW
          term:
            id: hgnc:9936
            label: OPN1LW
      selected_evidence:
        snippet: This can explain why, as a group, protanomalous observers have somewhat poorer color
          discrimination than deuteranomalous observers.
        supports: SUPPORT
