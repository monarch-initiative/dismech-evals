      assertion_type: Pathophysiology
      assertion:
        name: Absence of an Expressed L-Class Opsin Gene
        description: 'Only the first two genes of the X-linked array are expressed in the retina. In protans
          neither expressed gene encodes an L-class pigment: the expressed genes are normal OPN1MW copies
          or 5''L-3''M hybrids. Spectral tuning is dominated by exon 5, which accounts for a shift of
          roughly 15 to 25 nm, so a hybrid carrying M-type exon 5 encodes an M-class pigment whatever
          its 5'' exons.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: OPN1LW
          term:
            id: hgnc:9936
            label: OPN1LW
        molecular_functions:
