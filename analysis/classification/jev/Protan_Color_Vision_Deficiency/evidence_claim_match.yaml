            label: G protein-coupled photoreceptor activity
          modifier: ABNORMAL
      selected_evidence:
        snippet: Most genotypes (92%) included hybrid genes whose sequence and position and whose encoded
          pigment correlated exactly with the phenotype.
        supports: SUPPORT
