          term:
            id: HP:0000642
            label: Red-green dyschromatopsia
      selected_evidence:
        snippet: The dichromatic individuals showed minimal improvement, with none of the participants
          with protanopia passing any of the tests using any ChromaGen lens.
        supports: REFUTE
