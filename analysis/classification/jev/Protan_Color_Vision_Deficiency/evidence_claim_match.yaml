      assertion_type: Treatment
      assertion:
        name: Colour-enhancing filter glasses
        description: Commercial notch-filter (EnChroma) and other colour-enhancing (VINO) spectacles alter
          the relative stimulation of the remaining cones. They do not restore the missing L cone class.
          A controlled study found no overall improvement on clinical colour tests with EnChroma lenses;
          another found a functionally meaningful change on the CAD test only with VINO glasses. Tinted
          ChromaGen lenses reduced plate-test errors without reducing severity, and no protanope passed
          any test with them.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: colour-enhancing spectacles
          term:
            id: NCIT:C15747
