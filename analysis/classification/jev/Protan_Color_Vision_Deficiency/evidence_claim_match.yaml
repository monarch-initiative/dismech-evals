              id: MONDO:0010565
              label: red color blindness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Unequal Recombination in the Xq28 L/M Opsin Gene Array
        description: The L and M pigments share 96% amino acid identity and their genes sit in a head-to-tail
          tandem array. Misalignment of the arrays in female meiosis followed by an intergenic or intragenic
          crossover (unequal homologous recombination, with gene conversion as a further route) yields
          arrays that have lost OPN1LW or carry a 5'L-3'M hybrid gene in its place. This germline rearrangement
          is the initiating lesion for most protan defects; rarer routes include inactivating OPN1LW exon
          3 haplotypes and truncating variants.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: OPN1LW
          term:
            id: hgnc:9936
            label: OPN1LW
        - preferred_term: OPN1MW
          term:
            id: hgnc:4206
            label: OPN1MW
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The hypothesis that red-green "color blindness" is caused by alterations in the genes
          encoding red and green visual pigments has been tested and shown to be correct.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
