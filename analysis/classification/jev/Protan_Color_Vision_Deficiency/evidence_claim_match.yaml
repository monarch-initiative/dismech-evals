      assertion_type: Pathophysiology
      assertion:
        name: Loss of L-versus-M Cone Opponent Signal
        description: 'Red-green colour discrimination depends on comparing signals from two cone classes
          in the middle-to-long wavelength range. When both expressed pigments are spectrally identical
          (protanopia) the comparison is impossible and vision is dichromatic; when they differ by a few
          nanometres (protanomaly) a weak signal remains. Severity is inversely related to the spectral
          separation between the two expressed pigments. Left unbound to GO: the nearest process term,
          GO:0007601 visual perception, is broader than red-green opponent comparison and an OLS label/synonym
          search of GO for "color vision", "colour vision", "color discrimination" and "color perception"
          returned no terms.'
        biological_scale: ORGANISM
      selected_evidence:
        snippet: The severity of red-green color vision defects is inversely proportional to the difference
          between the wavelengths of maximal absorption of the photopigments encoded by the first two
          genes of the array.
        supports: SUPPORT
