              label: proteosome-associated autoinflammatory syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Digenic (inducible plus constitutive subunit)
        inheritance_term:
          preferred_term: Digenic inheritance
          term:
            id: HP:0010984
            label: Digenic inheritance
        description: 'A distinct and mechanistically specific two-locus architecture: six patients from
          four families each carried a heterozygous missense variant in an INDUCIBLE proteasome subunit
          together with a variant in a CONSTITUTIVE subunit. The two lesions are not interchangeable partners
          drawn from one gene set - they hit the two different proteasome populations, which is the sense
          in which the discovery study titled the mechanism additive loss of function. Its functional
          work showed the mutations converging, by varied routes, on proteasome activity; the abstract
          does not decompose the digenic phenotype against either subunit class alone, so no such comparison
          is asserted here. Because the Inheritance class has no genes slot, the genes in which that study
          reported mutations are named: PSMA3, PSMB4, PSMB9, PSMB8 and POMP - the inducible subunits among
          them being PSMB8 and PSMB9 and the constitutive ones PSMA3 and PSMB4. Note the abstract does
          not say which pairs occurred in which digenic family, so the per-family combinations are deliberately
          not stated. A 2026 report extends the pattern to PSMA6 (PMID:41205671), which is not curated
          here because no abstract is available to quote.'
      selected_evidence:
        snippet: 6 patients from 4 families were heterozygous for a missense mutation in 1 inducible proteasome
          subunit and a mutation in a constitutive proteasome subunit
        supports: SUPPORT
