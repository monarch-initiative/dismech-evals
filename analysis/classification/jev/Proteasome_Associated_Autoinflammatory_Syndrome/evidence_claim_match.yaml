            preferred_term: proteasome-associated autoinflammatory syndrome
            term:
              id: MONDO:0009726
              label: proteosome-associated autoinflammatory syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: PRAAS2
        display_name: PRAAS2 (POMP)
        subtype_term:
          preferred_term: proteasome-associated autoinflammatory syndrome 2
          term:
            id: MONDO:0054700
            label: proteasome-associated autoinflammatory syndrome 2
        genes:
        - preferred_term: POMP
          description: Encodes proteasome maturation protein, a chaperone for proteasome assembly that
            is critical for incorporating the catalytic subunits. The reported disease variants are frameshifts
            in the penultimate exon that escape nonsense-mediated decay and act by a dominant-negative
            mechanism, so this is an assembly-chaperone defect rather than a proteasome-subunit defect.
          term:
            id: hgnc:20330
            label: POMP
        description: The POMP-associated form, distinguished by early-onset combined immunodeficiency
          alongside the inflammatory neutrophilic dermatosis and autoimmunity. Its discovery study named
          it POMP-related autoinflammation and immune dysregulation disease (PRAID). PRAAS2 is the name
          MONDO:0054700 carries as a synonym, mapped to OMIM:618048.
        inheritance:
        - name: Autosomal dominant, de novo
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          description: A single heterozygous POMP variant is sufficient, acting by a dominant-negative
            mechanism on proteasome assembly.
      selected_evidence:
        snippet: Proteasome-associated autoinflammatory syndrome-2 (PRAAS2) is characterized by early
          onset combined immunodeficiency, inflammatory neutrophilic dermatosis, and autoimmunity.
        supports: SUPPORT
