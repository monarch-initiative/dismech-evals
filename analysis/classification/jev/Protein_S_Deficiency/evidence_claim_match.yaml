      assertion_type: Treatment
      assertion:
        name: Long-Term Anticoagulation with Heparin-Bridged Initiation
        description: Anticoagulation (a vitamin K antagonist such as warfarin, or a direct oral anticoagulant
          such as rivaroxaban) reduces the risk of recurrent venous thromboembolism; duration is individualized
          to recurrence versus bleeding risk. When warfarin is used, initiation should be bridged with
          heparin and avoid high loading doses, because unbridged warfarin can precipitate warfarin-induced
          skin necrosis in protein S (or protein C) deficiency. Direct oral anticoagulants avoid this
          mechanism and are an alternative, including in severe deficiency with recurrent warfarin necrosis.
        treatment_term:
          preferred_term: anticoagulation therapy
          term:
