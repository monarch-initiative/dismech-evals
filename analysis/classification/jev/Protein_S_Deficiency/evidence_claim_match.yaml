        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Protein S Cofactor Activity
        role: trigger
        biological_scale: MOLECULAR
        description: Loss-of-function PROS1 variants reduce the level or function of protein S, a hepatocyte-synthesized
          vitamin K-dependent glycoprotein that is a non-enzymatic cofactor for activated protein C (APC)
          in the inactivation of factors Va and VIIIa and, independently, for tissue factor pathway inhibitor
          (TFPI). Reduced free/functional protein S diminishes this anticoagulant cofactor activity.
        genes:
        - preferred_term: PROS1
          term:
            id: hgnc:9456
            label: PROS1
        genetic_context:
          gene:
            preferred_term: PROS1
            term:
              id: hgnc:9456
              label: PROS1
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'Loss-of-function PROS1 variants. Zygosity is deliberately not recorded on this
            node because it is what separates the two clinical forms this entry models: heterozygous variants
            give the common, incompletely penetrant autosomal dominant deficiency, and biallelic variants
            give the severe neonatal recessive form (Severe AR subtype).'
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: negative regulation of blood coagulation
          term:
            id: GO:0030195
            label: negative regulation of blood coagulation
          modifier: DECREASED
        molecular_functions:
        - preferred_term: APC anticoagulant cofactor (enzyme activator) activity
          term:
            id: GO:0008047
            label: enzyme activator activity
          modifier: DECREASED
      selected_evidence:
        snippet: Protein S enhances the anticoagulant effect of protein C by serving as its cofactor;
          thus, deficiency in either protein leads to impaired inactivation of factors Va and VIIIa, fostering
          a prothrombotic state
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
