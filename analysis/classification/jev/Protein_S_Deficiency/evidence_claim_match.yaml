              label: rivaroxaban
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: Rivaroxaban may be considered as a valid anticoagulant alternative in patients with severe
          inherited protein S deficiency and warfarin-induced skin necrosis.
