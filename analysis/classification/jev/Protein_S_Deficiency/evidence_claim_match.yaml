      assertion_type: AnimalModel
      assertion:
        name: Platelet-specific Pros1 knockout mouse (Pros1lox/loxPf4-Cre+)
        species: Mouse
        genotype: Pros1lox/loxPf4-Cre+ (platelet lineage-restricted Pros1 deletion via Platelet factor
          4-Cre)
        publication: DOI:10.1182/blood.2019003630
        description: A conditional knockout that eliminates protein S expression specifically in platelets
          (and their megakaryocyte precursors) while sparing the systemic, largely hepatocyte-derived
          plasma protein S pool.
        modeled_mechanisms:
        - target: Reduced Protein S Cofactor Activity
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Loss of platelet-derived protein S increases venous thrombus propensity by impairing
            its cofactor role for APC and TFPI, limiting factor X activation and thrombin generation within
            the growing thrombus at low shear rates. It does not increase arterial thrombosis propensity,
            unlike systemic human deficiency.
          limitations: This model isolates only the platelet-derived pool of protein S via a platelet-lineage-restricted
            knockout; it does not reproduce the systemic (predominantly hepatocyte-synthesized) protein
            S deficiency that defines the human hereditary disorder, so its venous-versus-arterial selectivity
            may not generalize to human global protein S deficiency.
          readouts:
          - name: Venous (vena cava) thrombus propensity
            target: Reduced Protein S Cofactor Activity
            direction: INCREASED
            interpretation: Platelet protein S loss increases thrombus formation at low shear (vena cava)
              but not at high shear (carotid artery), consistent with a cofactor role for APC/TFPI-mediated
              factor X control within the growing venous thrombus.
      selected_evidence:
        snippet: At a low shear rate, PSplt functions as a cofactor for both activated protein C and tissue
          factor pathway inhibitor, thereby limiting factor X activation and thrombin generation within
          the growing thrombus
        supports: SUPPORT
        directness: INDIRECT
