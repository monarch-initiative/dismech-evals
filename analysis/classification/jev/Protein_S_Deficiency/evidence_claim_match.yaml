      assertion_type: Diagnosis
      assertion:
        name: PROS1 Molecular Genetic Testing
        description: 'After a functional/antigen abnormality is confirmed and acquired causes are excluded,
          PROS1 sequencing confirms hereditary deficiency; the ISTH maintains a registry of documented
          PROS1 mutations. Because many acquired and physiologic states lower protein S, laboratory testing
          must be repeated in stable conditions before a hereditary diagnosis is made. (Note: the exact
          ISTH-SSC criterion of two abnormal results >=4 weeks apart, and large-deletion detection by
          MLPA, are standard practice but are not stated in this entry''s cited review and are therefore
          not asserted here with a snippet.)'
        diagnosis_term:
          preferred_term: PROS1 genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        results: A pathogenic or likely-pathogenic PROS1 variant confirms hereditary protein S deficiency.
      selected_evidence:
        snippet: Thus, repeat testing in stable conditions is recommended.
        supports: SUPPORT
