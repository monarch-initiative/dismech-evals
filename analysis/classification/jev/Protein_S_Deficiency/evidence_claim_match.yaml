        context: []
      assertion_type: Genetic
      assertion:
        name: F5
        gene_term:
          preferred_term: F5
          term:
            id: hgnc:3542
            label: F5
        relationship_type: MODIFIER
        association: Co-inheritance of the factor V Leiden variant (F5 c.1601G>A, p.Arg534Gln; legacy
          R506Q) is a common second thrombophilic hit in PROS1-deficient families and sharply raises thrombotic
          risk and lowers age at first event. Factor V Leiden was present in 29-38% of symptomatic protein
          S-deficient probands across two family studies; in sibships co-segregating both defects, 80%
          of double-carriers were symptomatic; and mean age at first thrombosis was 18.4 years in combined-defect
          carriers versus 32.6 years with a single defect.
        notes: The co-inheritance effect-size magnitudes (co-segregation rate, age at first event) are
          carried in the association text and the evidence snippets rather than a structured numeric field,
          because the Genetic class has no dedicated per-modifier odds-ratio / effect-size slot.
      selected_evidence:
        snippet: In sibships where both abnormalities were segregating, the percentage of symptomatic
          individuals with both abnormalities was 80%.
        supports: SUPPORT
