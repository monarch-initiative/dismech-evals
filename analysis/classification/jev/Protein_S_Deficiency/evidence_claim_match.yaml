  7b18547f10aed171a183eacb1a44d6d0f509ad75c471f9928b1965f9326f791f:
    claim:
      about:
        disease:
          name: Protein S Deficiency
          disease_term:
            preferred_term: hereditary protein S deficiency
            term:
              id: MONDO:0012868
              label: thrombophilia due to protein S deficiency, autosomal dominant
        context: []
      assertion_type: Diagnosis
      assertion:
        name: 'Protein S Deficiency: Free Antigen and Functional Activity Assay'
        description: Protein S functional activity is assessed by its ability to act as an APC cofactor
          in inactivating factors Va and VIIIa; free and total protein S antigen are measured separately
          by immunoassay. Free protein S antigen is the most reliable screen because it reflects the functionally
          active, non-C4BP-bound fraction; total antigen detects Type I but not Type II or III. Reference
          ranges are sex-, age-, and pregnancy-dependent (women have lower total and free protein S than
          men; total protein S rises with age), so results must be interpreted against stratified ranges
          and repeated outside pregnancy, hormonal therapy, acute thrombosis, and anticoagulation. Factor
          V Leiden can cause falsely low functional protein S in older clot-based assays.
        diagnosis_term:
          preferred_term: coagulation study
          term:
            id: NCIT:C62662
            label: Coagulation Study
        results: Reduced free and/or total protein S antigen, or reduced protein S functional activity
          with normal antigen (Type II/III).
      selected_evidence:
        snippet: PS functional activity assays measure the biological activity of PS by assessing its
          ability to function as a cofactor for APC in the inactivation of FVa and FVIIIa.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
