  8356f19b1e80002c43287af9d3832a8babc132f680a2f7de9ce74ba1cb7a775e:
    claim:
      about:
        disease:
          name: Proteus syndrome
          disease_term:
            preferred_term: Proteus syndrome
            term:
              id: MONDO:0008318
              label: Proteus syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_proteus_vascular_organoid_preprint_fidelity
        prompt: Do the endothelial hyperconnectivity and PDGFRβ+ mural-cell dysfunction seen in mosaic-AKT1
          iPSC vascular organoids reproduce the mechanism of human Proteus syndrome vascular malformations,
          given that the supporting data are from a preprint organoid model?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#AKT overactivation induces excessive vasculogenesis
        - pathophysiology#Mural cell dysfunction destabilizes vascular connections
        rationale: The endothelial/mural vascular branch is supported by an iPSC-derived vascular-organoid
          study available only as a bioRxiv preprint (DOI:10.1101/2024.01.26.577324). Organoids recapitulate
          PS-like network hyperconnectivity and mural-cell abnormalities and respond to AKT inhibitors,
          but the model's fidelity to human Proteus vascular malformation biology is unconfirmed and the
          data are not yet peer-reviewed. It is a useful mechanistic hypothesis, not established human
          pathophysiology.
        proposed_experiments:
        - experiment_id: exp_proteus_human_vascular_malformation_mural
          name: Mural-cell coverage and endothelial junction stability in human Proteus vascular malformations
          description: Characterize PDGFRβ+ mural-cell coverage and endothelial junction stability in
            resected human Proteus vascular malformations and compare with the organoid phenotype.
      selected_evidence:
        snippet: Additionally, a notable increase in dysfunctional PDGFRβ + mural cells, impaired in matrix
          secretion, was observed in these AKT-overactivated organoids.
        supports: SUPPORT
