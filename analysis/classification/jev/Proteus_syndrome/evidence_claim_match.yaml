            term:
              id: MONDO:0008318
              label: Proteus syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_proteus_non_cell_autonomous_mouse_fidelity
        prompt: Does the non-cell-autonomous (paracrine) spread of pAKT activation from AKT1 p.E17K clones
          into adjacent mutation-negative cells, observed in Akt1E17K mouse chimeras, also operate in
          human Proteus syndrome lesions, or is lesion formation in humans predominantly cell-autonomous?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Non-cell-autonomous pAKT activation in adjacent cells
        rationale: The non-cell-autonomous branch is supported chiefly by mouse-chimera data (DOI:10.1093/hmg/ddz116),
          where hyperplastic mammary epithelium contained mutation-negative cells with increased pAKT.
          Whether the same paracrine amplification drives human overgrowth lesions is unconfirmed; the
          well-established human causal chain is somatic AKT1 p.E17K driving cell-autonomous PI3K/AKT
          activation. The distinction matters for lesion-margin behavior and for how completely a clone-directed
          therapy would need to reach mutation-negative cells.
        proposed_experiments:
        - experiment_id: exp_proteus_human_lesion_paracrine_pakt
          name: Single-cell pAKT versus AKT1 allele fraction across human Proteus lesion margins
          description: Quantify pAKT and AKT1 variant allele fraction at single-cell resolution across
            human Proteus lesion margins to test whether mutation-negative cells show elevated pAKT.
      selected_evidence:
        snippet: However, hyperplastic mammary epithelium was a mixture of GFP/Akt1E17K-positive and negative
          cells with some GFP/Akt1E17K-negative cells also having increased pAKT signal suggesting that
          the variant-positive cells can induce lesion formation in a non-cell autonomous manner.
        supports: SUPPORT
