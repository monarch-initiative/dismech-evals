      assertion_type: Diagnosis
      assertion:
        name: Clinical diagnostic criteria
        diagnosis_term:
          preferred_term: physical examination
          term:
            id: NCIT:C20989
            label: Physical Examination
        description: Proteus syndrome is a clinical diagnosis requiring all three general criteria — mosaic
          (patchy) distribution of lesions, sporadic occurrence, and a progressive course — plus a threshold
          clinical score from specific positive/negative criteria. Hallmark specific features include
          the cerebriform connective tissue nevus and disproportionate, progressive, segmental/asymmetric
          overgrowth of skeleton, skin, and adipose tissue with vascular malformations.
        results: Meeting all three general criteria plus the specific clinical-score threshold establishes
          the diagnosis; fewer points are required when a mosaic AKT1 variant is confirmed.
      selected_evidence:
        snippet: The diagnosis of PS is established in a proband with all three general criteria (mosaic
          distribution of lesions, sporadic occurrence, progressive course) and a clinical score based
          on positive and negative criteria of at least ten points in an individual with a mosaic AKT1
          pathogenic variant or at least 15 points in an individual without a mosaic AKT1 pathogenic variant
          identified by molecular genetic testing.
        supports: SUPPORT
