      assertion_type: Diagnosis
      assertion:
        name: Mosaic AKT1 molecular testing on affected tissue
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        description: Molecular confirmation targets the somatic AKT1 c.49G>A (p.Glu17Lys) variant. Because
          the variant is post-zygotic and mosaic, testing should prioritize DNA from clinically affected
          (lesional) tissue using a sensitive variant-detection method; peripheral blood is frequently
          negative, so a negative blood result does not exclude the diagnosis. A confirmed mosaic AKT1
          variant lowers the clinical-score threshold required for diagnosis.
        results: Detection of a mosaic AKT1 p.Glu17Lys variant in affected tissue confirms the molecular
          diagnosis; its absence in blood does not exclude Proteus syndrome.
      selected_evidence:
        snippet: A somatic activating mutation in AKT1, c.49G>A, pGlu17Lys, that results in elevated AKT
          signaling in mutation-positive cells, is responsible for the mosaic overgrowth condition, Proteus
          syndrome.
        supports: SUPPORT
