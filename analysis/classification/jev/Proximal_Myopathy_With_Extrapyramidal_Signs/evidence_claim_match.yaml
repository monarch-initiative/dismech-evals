            in 12 of 13 patients in one series. Reports name the protein change differently (p.Gln185*
            in the founder series, p.Arg185* in later reports).
        - name: Exon 1 deletion
          description: A homozygous 2,755 bp deletion removing exon 1, detected from exome read depth
            in two cousins with episodic fatigue and lethargy.
