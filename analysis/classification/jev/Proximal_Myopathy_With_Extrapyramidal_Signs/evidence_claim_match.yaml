            term:
              id: MONDO:0014300
              label: proximal myopathy with extrapyramidal signs
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Uniporter Calcium Threshold and Cooperative Activation
        biological_scale: MOLECULAR
        description: MICU1 normally sets a cytosolic calcium threshold below which the uniporter stays
          closed and cooperatively boosts uptake once calcium rises. Its loss makes uptake inappropriately
          active at resting and low cytosolic calcium, while blunting the rise in uptake during large
          cytosolic calcium transients. Cytosolic calcium signals are correspondingly reduced in patient
          cells.
        genes:
        - preferred_term: MICU1
          term:
            id: hgnc:1530
            label: MICU1
        biological_processes:
        - preferred_term: calcium import into the mitochondrion
          term:
            id: GO:0036444
            label: calcium import into the mitochondrion
          modifier: DYSREGULATED
      selected_evidence:
        snippet: In fibroblasts from subjects with MICU1 mutations, agonist-induced mitochondrial Ca(2+)
          uptake at low cytosolic Ca(2+) concentrations was increased, and cytosolic Ca(2+) signals were
          reduced.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
