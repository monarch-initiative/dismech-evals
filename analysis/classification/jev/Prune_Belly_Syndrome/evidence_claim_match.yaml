      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: urethral_obstruction_theory
        hypothesis_label: Urethral obstruction / bladder-distension theory
        status: EMERGING
        description: 'Transient fetal urethral obstruction (or functional lower urinary tract obstruction)
          causes massive bladder distension and ascites, which secondarily damages the developing abdominal
          wall musculature, prevents testicular descent, and produces upper-tract dilation and renal dysplasia.
          This is one of the two long-standing competing explanations for the triad.

          '
      selected_evidence:
        snippet: In the second theory, involving in utero bladder obstruction, a hypoplastic/dysplastic
          prostate or abnormal urethra prevents urine passage. This obstruction of urine flow causes bladder,
          ureteral and renal distention with secondary abdominal wall and urinary muscle maldevelopment.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
