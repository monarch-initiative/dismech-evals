      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mesodermal_defect_theory
        hypothesis_label: Primary mesodermal developmental defect theory
        status: EMERGING
        description: 'A primary defect of intermediate/lateral-plate mesoderm between the 6th and 10th
          weeks of gestation simultaneously impairs abdominal wall muscle, the genitourinary smooth muscle
          and urinary tract, and gonadal descent, accounting for the triad without requiring mechanical
          obstruction. Recent identification of variants in genes regulating genitourinary myogenesis
          supports a primary developmental-myopathic mechanism.

          '
      selected_evidence:
        snippet: In the first theory, known as the theory of mesodermal arrest, an unknown primary defect
          in the development of the lateral plate mesoderm between 6 and 10 weeks of gestation produces
          primary maldevelopment of the abdominal wall and urinary tract musculature.
        supports: SUPPORT
