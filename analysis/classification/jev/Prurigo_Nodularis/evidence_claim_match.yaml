        description: Atopic dermatitis frequently coexists with prurigo nodularis (present or predisposed
          in approximately half of patients) and shares type 2 immune activation, but prurigo nodularis
          represents a distinct clinical and transcriptomic entity.
        distinguishing_features:
        - Prurigo nodularis is distinguished histologically and transcriptomically from atopic dermatitis
          by prominent papillary dermal fibrosis driven by COL11A1+ fibroblasts, stromal remodeling, and
          neurovascular dysregulation rather than the strong type 2 epidermal response typical of atopic
          dermatitis.
      selected_evidence:
        snippet: Although AD and PN are both type 2 inﬂammatory diseases, recent transcriptomic studies
          have clearly revealed that PN is separated from AD. PN does not harbor the strong type 2 response
          pattern that is typically found in AD but is rather characterized by stromal remodeling and
          neurovascular dysregulation (6– 11).
        supports: SUPPORT
