        title: Neuroimmune gene signature of prurigo nodularis compared to psoriasis and atopic ​​dermatitis​​
        description: Prurigo nodularis (PN) is a debilitating neuroimmune skin disease characterized by
          pruritic, raised, nodular lesions. Psoriasis and AD are classically characterized by Th1/Th17
          and Th2 polarization, respectively, but the neuroinflammatory profile of PN remains poorly defined.
          We characterized the neuroimmune phenotype of PN compared to AD, psoriasis, and healthy controls
          (HC), through transcriptomic analysis of lesional and nonlesional skin biopsies from 25 PN patients,
          27 AD patients, 15 psoriasis patients, and 12 HC using a custom neuroinflammation-focused NanoString
          panel of 770 genes.
