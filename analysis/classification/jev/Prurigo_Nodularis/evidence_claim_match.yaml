        description: Prurigo nodularis (PN) is a chronic neuroimmune skin disease characterized by bilaterally
          distributed pruritic hyperkeratotic nodules on extremities and trunk. Neuroimmune dysregulation
          and chronic scratching are believed to both induce and maintain the characteristic lesions.
          This study sought to provide a comprehensive view of the molecular pathogenesis of PN at the
          single-cell level to identify and outline key pathologic processes and the cell types involved.
          Features that distinguish PN skin from the skin of patients with atopic dermatitis were of particular
          interest.
