      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hyperkalemic renal tubular acidosis from aldosterone deficiency or resistance
        description: 'Hyperkalemic distal renal tubular acidosis from true hypoaldosteronism or from mineralocorticoid
          resistance gives a similar potassium and acid-base picture. Renin and aldosterone separate them:
          both are raised in the salt-wasting pseudohypoaldosteronism type 1 disorders and in aldosterone
          deficiency, and both are suppressed here. A response to fludrocortisone can mislead, since it
          improved the biochemistry of a PHA2D patient being treated for presumed mineralocorticoid deficiency.'
        distinguishing_features:
        - Suppressed renin and aldosterone, where salt-wasting and aldosterone-deficient states have both
          raised
        - Volume expansion with hypertension, rather than salt wasting with hypovolemia and hyponatremia
        - Sustained correction by a thiazide, which addresses the overactive cotransporter
      selected_evidence:
        snippet: Due to an initial clinical suspicion of isolated mineralocorticoid deficiency, a diagnostic
          trial of fludrocortisone was initiated while awaiting definitive results.
        supports: SUPPORT
