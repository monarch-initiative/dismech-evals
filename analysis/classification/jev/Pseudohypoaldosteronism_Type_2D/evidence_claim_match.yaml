        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Calcineurin inhibitor nephrotoxicity
        description: Tacrolimus and ciclosporin produce an acquired phenocopy. Calcineurin is the phosphatase
          that removes the KLHL3 serine 433 phosphate, so inhibiting it locks the adaptor in its non-binding
          state and reproduces the whole cascade. Hypertension and hyperkalemia are common adverse effects
          of these drugs for this reason.
        distinguishing_features:
        - Temporal relation to starting a calcineurin inhibitor, and no family history
        - Reversible on withdrawal or dose reduction, where the genetic disease is not
      selected_evidence:
        snippet: The renal effects of CNIs mimic the hypertension and hyperkalemia that result from germ-line
          mutations in with-no-lysine (WNK) kinases and the Kelch-like 3 (KLHL3)-CUL3 ubiquitin ligase
          complex.
        supports: SUPPORT
