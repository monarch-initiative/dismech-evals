      assertion_type: Treatment
      assertion:
        name: Thiazide diuretic therapy
        description: 'Thiazides inhibit NCC, the transporter the disease makes overactive, so this is
          mechanism-directed therapy rather than symptomatic treatment, and it corrects the hyperkalemia,
          the acidosis and the hypertension together. Dosing needs individual titration: a normotensive
          child given 0.5 mg/kg/day of hydrochlorothiazide developed symptomatic hypotension and was stabilised
          on 0.25 mg/kg on alternate days. Chronic use carries class side effects and provokes compensatory
          adaptation in the nephron, which is what motivates work on direct inhibitors of the cascade
          upstream.'
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
