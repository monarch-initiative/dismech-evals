      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        description: 'Heterozygous missense KLHL3 variants clustered in the Kelch propeller and BTB domains
          segregate with the trait under a dominant model. They are inferred to act as dominant negatives
          because they phenocopy recessive loss of function, and because mice heterozygous for a KLHL3
          null allele are unaffected while a heterozygous R528H knock-in is not. KLHL3 dimerization supplies
          the mechanism: a mutant subunit disables the heterodimer it joins.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Sixteen kindreds have heterozygous mutations that co-segregate with the trait under a
          dominant model
        supports: SUPPORT
