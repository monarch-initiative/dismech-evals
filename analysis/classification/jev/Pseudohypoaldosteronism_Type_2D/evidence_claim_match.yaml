      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: Biallelic KLHL3 variants, homozygous or compound heterozygous, cause the same disease
          in kindreds where affected members are confined to siblings who inherited both alleles while
          relatives carrying none or one are unaffected. Recessive alleles are distributed throughout
          the protein rather than clustered, and consanguinity underlies several of the reported families.
          Recessive transmission was unknown for pseudohypoaldosteronism type II before KLHL3 was identified,
          and KLHL3 remains the only familial hyperkalemic hypertension gene with a recessive form.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Recessive transmission has not been previously described for PHAII.
        supports: SUPPORT
