        description: Phosphorylation of KLHL3 at serine 433, inside the Kelch domain, prevents WNK4 from
          binding and so prevents its degradation. This is the physiological switch by which angiotensin
          II, dietary potassium restriction, insulin and vasopressin signalling raise WNK levels, and
          calcineurin reverses it. The disease alleles S433G and S433N occupy that residue, so PHA2D includes
          a genetic lock of a normally regulated switch. The same node explains why calcineurin inhibitors
          produce an acquired phenocopy.
