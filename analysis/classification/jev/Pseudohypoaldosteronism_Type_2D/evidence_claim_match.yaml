  966f564a71e18b06dc829b8cd1c061b9bc337c8e204f1b00f2e05a8a31b63658:
    claim:
      about:
        disease:
          name: Pseudohypoaldosteronism Type 2D
          disease_term:
            preferred_term: pseudohypoaldosteronism type 2D
            term:
              id: MONDO:0013781
              label: pseudohypoaldosteronism type 2D
        context: []
      assertion_type: Phenotype
      assertion:
        category: Metabolic/Laboratory
        name: Aldosterone inappropriately low for the degree of hyperkalemia
        description: 'The feature the disease is named for, and a differential-diagnosis discriminator
          against the salt-wasting pseudohypoaldosteronism type 1 disorders and against aldosterone deficiency,
          where renin and aldosterone move together. Hyperkalemia is normally a potent stimulus to aldosterone
          secretion, so a level that is merely unremarkable is already inappropriate here.

          The binding is deliberately the umbrella HPO term rather than `HP:0004319` Decreased circulating
          aldosterone concentration, because the sources disagree on the absolute direction and HPO has
          no term for a level inappropriate to its own stimulus. GeneReviews calls aldosterone variable
          but relatively low for the potassium; Orphanet''s definition says normal or elevated; the two
          reported pseudohypoaldosteronism type 2 cases cited here both describe it as suppressed alongside
          renin. Binding a directional term would assert one of those readings over the others, so the
          specificity is carried in `preferred_term` and in this description instead.'
        phenotype_term:
          preferred_term: Aldosterone inappropriately low for the degree of hyperkalemia
          term:
            id: HP:0040085
            label: Abnormal circulating aldosterone concentration
      selected_evidence:
        snippet: normal or elevated aldosterone, low renin
        supports: SUPPORT
    origin:
