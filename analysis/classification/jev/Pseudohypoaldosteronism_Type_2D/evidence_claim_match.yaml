          - preferred_term: hydrochlorothiazide
            term:
              id: CHEBI:5778
              label: hydrochlorothiazide
      selected_evidence:
        snippet: Electrolyte and blood pressure abnormalities of PHAII in children and adults are often
          corrected with thiazide diuretics.
        supports: SUPPORT
