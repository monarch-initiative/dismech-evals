  329056380d7f415cab5b4059f3ef6b6e7c7508693d0528c6fc6ba0b76932597f:
    claim:
      about:
        disease:
          name: Pseudohypoaldosteronism Type 2D
          disease_term:
            preferred_term: pseudohypoaldosteronism type 2D
            term:
              id: MONDO:0013781
              label: pseudohypoaldosteronism type 2D
        context: []
      assertion_type: Genetic
      assertion:
        name: KLHL3
        association: Causative, autosomal dominant (dominant negative) or autosomal recessive (biallelic
          loss of function)
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: KLHL3
          term:
            id: hgnc:6354
            label: KLHL3
        notes: 'KLHL3 encodes a BTB-BACK-Kelch protein serving as the substrate adaptor of a CUL3-RING
          E3 ubiquitin ligase. Two allele classes behave differently. Recessive alleles are spread through
          the protein and include a nonsense allele (W470X), a compound heterozygous missense pair (F322C
          with S410L), a homozygous splice-site allele, and homozygous S553L. Dominant alleles cluster:
          nine of sixteen in the Boyden series alter the d-a loops of the Kelch propeller and three sit
          in the BTB domain at sites implicated in cullin binding. S410L is mechanistically distinctive
          in combining reduced protein stability with reduced WNK4 affinity. S433G and S433N substitute
          the serine whose physiological phosphorylation normally switches WNK binding off, so those alleles
          mimic a constitutively phosphorylated adaptor.'
        variants:
        - name: R528H
          description: Recurrent heterozygous Kelch-domain missense allele, the one modelled in knock-in
            mice. Mutant KLHL3 R528H binds neither WNK1 nor WNK4, and a CUL3-KLHL3 R528H complex fails
            to ubiquitylate WNK1 in vitro. Reported in dominant kindreds.
        - name: S410L
          description: Kelch-domain allele reported as one half of a compound heterozygous recessive genotype
            with F322C. It is distinctive in lowering KLHL3 protein stability as well as WNK4 binding
            affinity.
        - name: W470X
          description: Homozygous nonsense allele in the kindred that first established recessive transmission
            of pseudohypoaldosteronism type II.
          variant_type: single nucleotide variant
        - name: S433G and S433N
          description: Kelch-domain alleles substituting serine 433, the residue whose phosphorylation
            by protein kinase C, protein kinase A or Akt normally prevents WNK binding. A molecular dynamics
            study shows the phosphate makes the acidic-motif binding pocket more electronegative and dismantles
            the hydrogen bond network holding WNK4 there, which is why these alleles are read as mimicking
            the phosphorylated adaptor rather than simply disabling it.
        - name: S553L
          description: Homozygous allele in a consanguineous Jewish family of Yemenite origin, one of
            the few reported recessive KLHL3 genotypes outside the original series. Its biochemistry has
            not been characterised.
        - name: Q309R
          description: Recurrent heterozygous Kelch-domain allele reported in dominant kindreds, including
            the family in which raised urinary exosomal NCC abundance was first shown, and one of the
            two families in which hypercalciuria was quantified.
      selected_evidence:
        snippet: While recessive KLHL3 mutations are distributed throughout the encoded protein, dominant
          KLHL3 mutations show striking clustering
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
