      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative Poisoning of KLHL3 Dimers
        description: 'Heterozygous KLHL3 missense alleles in the Kelch propeller and BTB domains do not
          merely halve adaptor dose. KLHL3 dimerizes, so a mutant subunit disables the heterodimer it
          joins and only wild-type homodimers remain functional. The genetic evidence is an asymmetry
          in mice: heterozygotes for a KLHL3 null allele are unaffected and accumulate no renal WNK, whereas
          heterozygous human missense carriers and heterozygous R528H knock-in mice have the full phenotype.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: KLHL3
          term:
            id: hgnc:6354
            label: KLHL3
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: DOMINANT_NEGATIVE
      selected_evidence:
        snippet: This clearly demonstrates that the heterozygous deletion of KLHL3 was not sufficient
          to cause PHAII, indicating that autosomal dominant type PHAII is caused by the dominant negative
          effect of mutant KLHL3.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
