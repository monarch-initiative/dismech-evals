            term:
              id: MONDO:0013782
              label: pseudohypoaldosteronism type 2E
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pha2e_hyperkalemia_origin
        kind: KNOWLEDGE_GAP
        status: OPEN
        posed_by: dismech curation
        prompt: What accounts for the part of the hyperkalaemia in PHA2E that NCC activation does not
          explain, given that reduced ROMK expression was tested in the knock-in mouse and not found?
        rationale: 'The hypertension in this disease follows cleanly from NCC activation, but the hyperkalaemia
          does not. Two sources state that the electrolyte abnormalities are only partly driven by NCC.
          The obvious candidate was reduced expression of the distal secretory potassium channel ROMK,
          and that was the explicit target of a dedicated study: CUL3-delta9 did fail to prevent WNK4
          suppression of ROMK currents in oocytes and did not support ROMK surface expression in collecting
          duct cells, yet in the knock-in mouse no change in ROMK expression could be shown by western
          blotting or confocal microscopy. So the in vitro result did not transfer to the animal, and
          the residual mechanism is unidentified. This is a gap rather than a controversy because no competing
          positive account has been offered.'
        attaches_to:
        - phenotypes#Hyperkalemia
        - pathophysiology#Increased Distal Nephron Salt Reabsorption
      selected_evidence:
        snippet: This accounts for the hypertension in FHHt but the origin of the hyperkalemia is less
          clear.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
