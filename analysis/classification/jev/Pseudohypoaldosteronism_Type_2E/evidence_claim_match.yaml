      assertion_type: DifferentialDiagnosis
      assertion:
        name: Neurodevelopmental disorder with or without autism or seizures (CUL3-related)
        disease_term:
          preferred_term: neurodevelopmental disorder with or without autism or seizures
          term:
            id: MONDO:0030994
            label: neurodevelopmental disorder with or without autism or seizures
        description: 'The same gene and the same inheritance, separated by variant class rather than by
          dose. Loss-of-function CUL3 variants distributed across the gene cause a neurodevelopmental
          disorder with no electrolyte abnormality, while the variants here converge on exon 9 skipping
          and produce a stable mutant protein. ClinGen split the two concepts explicitly on the grounds
          of differing molecular mechanism and clinical phenotype, and curated them in separate expert
          panels. A CUL3 variant report therefore has to be read for variant class before it is read for
          gene identity. The boundary is not absolute: the largest neurodevelopmental cohort noted individuals
          with early or juvenile-onset hypertension without electrolyte abnormalities.'
        distinguishing_features:
        - Convergence of all alleles on exon 9 skipping, versus truncating, splice and missense alleles
          distributed across the gene
        - Hyperkalaemia and hyperchloraemic metabolic acidosis, absent in the neurodevelopmental disorder
        - Thiazide-responsive hypertension as the presenting problem rather than developmental delay
        - No intellectual disability, speech delay or autism
      selected_evidence:
        snippet: Per criteria outlined by the ClinGen Lumping and Splitting Working Group, although both
          conditions have an AD inheritance, there is a difference in molecular mechanism and in clinical
          phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
