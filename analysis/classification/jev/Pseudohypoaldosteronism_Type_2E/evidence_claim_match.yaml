          2 is a normal or high aldosterone alongside the low renin, which is the paradox the disease
          name obscures: the kidney behaves as though aldosterone were absent while it is not. One CUL3
          patient had aldosterone suppressed along with renin and was treated with fludrocortisone for
          a presumed aldosterone deficiency. Both readings are cited here, and no frequency is assigned
          because the two sources disagree on direction.'
