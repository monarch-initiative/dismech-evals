      assertion:
        name: Nephron-specific Cul3 knockout mouse
        species: Mouse
        genotype: Nephron-specific Cul3 deletion
        publication: PMID:25250572
        description: 'A conditional deletion used to test whether losing cullin-3 activity in the nephron
          phenocopies the disease. It reproduces the proximal part of the mechanism, raising WNK kinase
          levels and phosphorylated NCC, but then diverges: over time the mice develop hypochloraemic
          alkalosis, diabetes insipidus, salt-sensitive hypotension, renal inflammation and fibrosis.
          The divergence is informative rather than a failure of the model, because it is what shows that
          the human disease is not a simple nephron loss of cullin-3 function.'
        genes:
        - preferred_term: CUL3
          term:
            id: hgnc:2553
            label: CUL3
        modeled_mechanisms:
        - target: WNK Kinase Accumulation
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          limitations: A complete nephron deletion, not the in-frame deletion patients carry, and patients
            retain one wild-type allele. The same paper shows WNK4 degradation is restored when wild-type
            cullin-3 is present, so the heterozygous human state is not reproduced by the null.
        - target: Increased Distal Nephron Salt Reabsorption
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          limitations: Instead of the salt retention and hypertension of the human disease, these mice
            end up with salt-sensitive hypotension, hypochloraemic alkalosis and diabetes insipidus, with
            renal inflammation and fibrosis. Removing cullin-3 entirely from the nephron is toxic in ways
            the patient allele is not, so this model cannot stand in for the disease at the physiological
            level.
      selected_evidence:
        snippet: whereas general loss of CUL3 activity - while also impairing WNK degradation - has widespread
          toxic effects in the kidney.
        supports: SUPPORT
