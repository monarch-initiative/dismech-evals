            term:
              id: MONDO:0013782
              label: pseudohypoaldosteronism type 2E
        context: []
      assertion_type: Genetic
      assertion:
        name: CUL3
        association: Causative, heterozygous and predominantly de novo
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: CUL3
          term:
            id: hgnc:2553
            label: CUL3
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_f697fb5e-72de-4116-9cad-706e2d651268-2021-12-01T013000.000Z
          notes: The same ClinGen record calls the mechanism of pathogenicity loss of function. The cell-based
            literature describes dominant-negative action on the wild-type allele instead, so the two
            are recorded separately rather than reconciled here.
        notes: The disease alleles are heterogeneous as sequence changes and homogeneous in consequence.
          ClinGen's curation includes nine variants described as intronic, canonical splice, splice donor,
          splice acceptor and splice enhancer across eight probands in four publications.
        variants:
        - name: c.1377+1G>C
          variant_type: single nucleotide variant
          clinical_significance: PATHOGENIC
          description: De novo intron 9 splice donor variant reported in a 7-year-old boy whose hypertension,
            hyperkalaemia and metabolic acidosis were found during evaluation of short stature.
        - name: c.1207-2A>C
          variant_type: single nucleotide variant
          clinical_significance: PATHOGENIC
          description: De novo splice acceptor variant reported in a child who presented at 2 years 7
            months with recurrent vomiting and was initially misdiagnosed as an aldosterone deficiency
            state.
        - name: c.1221A>G (p.Glu407Glu)
          variant_type: single nucleotide variant
          clinical_significance: PATHOGENIC
          description: Synonymous exonic variant in a Chinese kindred that nonetheless causes complete
            exon 9 skipping, apparently by reducing the ratio of exonic splicing enhancer to silencer
            sequence. A synonymous change is the case that makes protein-level variant interpretation
            fail for this gene.
      selected_evidence:
        snippet: Here we used exome sequencing to identify mutations in kelch-like 3 (KLHL3) or cullin
          3 (CUL3) in PHAII patients from 41 unrelated families.
        supports: SUPPORT
