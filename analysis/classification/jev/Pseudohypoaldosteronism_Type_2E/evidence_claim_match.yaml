              label: pseudohypoaldosteronism type 2E
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of CUL3-delta9 Interaction with Cullin Regulators
        biological_scale: MOLECULAR
        description: CUL3-delta9 loses its interaction with the COP9 signalosome, which deneddylates cullins,
          and with CAND1, which exchanges substrate adaptors. Cullin-RING ligase activity depends on cycling
          between neddylated and deneddylated states rather than on neddylation alone, so losing both
          regulators dysregulates the cycle. The direction of the resulting neddylation change is disputed
          in the literature and is recorded as an open question rather than asserted here.
        biological_processes:
        - preferred_term: protein neddylation
          term:
            id: GO:0045116
            label: protein neddylation
        cellular_components:
        - preferred_term: Cul3-RING ubiquitin ligase complex
          term:
            id: GO:0031463
            label: Cul3-RING ubiquitin ligase complex
      selected_evidence:
        snippet: While neddylation is required for efficient ubiquitylation, studies show that the cycling
          between a neddylated and deneddylated state is crucial in a cellular context
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26286618
      reference_title: Characterisation of the Cullin-3 mutation that causes a severe form of familial
        hypertension and hyperkalaemia.
      evidence_source: IN_VITRO
      explanation: Supports the claim that it is the neddylation cycle rather than neddylation level alone
        that activity depends on, which is why losing the deneddylase complex matters.
