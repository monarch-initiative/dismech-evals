              label: pseudohypoaldosteronism type 2E
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cul3_delta9_neddylation_direction
        kind: CONTROVERSY
        status: OPEN
        posed_by: dismech curation
        prompt: Is CUL3-delta9 hyperneddylated and over-activated, or under-neddylated and under-activated,
          and does the answer change what the dominant mechanism in patients is?
        rationale: 'Two cell-based studies report opposite directions for the same modification on the
          same mutant protein. McCormick et al. report that CUL3-delta9 is more heavily neddylated and
          more activated than wild-type, with the disease arising because that over-active ligase destroys
          its own adaptor KLHL3. Ibeawuchi et al. report that neddylation of the same mutant and its binding
          to RBX1 are both significantly impaired, with the disease arising because the mutant sequesters
          adaptors and poisons wild-type dimers. Cornelius et al. set out to resolve it, name hyperneddylation
          as one of several postulated mechanisms, and conclude for a protein that is itself ligase-defective
          while driving autophagic KLHL3 degradation. The two accounts are not merely different emphases:
          they disagree on the sign of the measured modification. Both are compatible with the clinical
          phenotype because both end in failed WNK degradation, which is why the disagreement has persisted
          without being decisive for diagnosis or treatment. It matters for anything that would target
          the pathway pharmacologically, since a neddylation inhibitor would be expected to act in opposite
          directions under the two models.'
        attaches_to:
        - pathophysiology#Loss of CUL3-delta9 Interaction with Cullin Regulators
        - pathophysiology#CUL3-delta9 Ubiquitin Ligase Dysfunction
      selected_evidence:
        snippet: Here, we demonstrated that an FHHt-causing CUL3 mutant (CUL3 Δ403-459) not only retains
          the ability to bind and ubiquitylate WNK kinases and KLHL3 in cells, but is also more heavily
          neddylated and activated than WT CUL3.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25250572
      reference_title: Hyperkalemic hypertension-associated cullin 3 promotes WNK signaling by degrading
        KLHL3.
      evidence_source: IN_VITRO
      explanation: One side of the disagreement, that the mutant is more heavily neddylated and more active
        than wild-type.
