        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Airway epithelial sodium absorption failure
        prompt: Why do alphaENaC-null mice die from retained lung liquid at birth when a preterm infant
          homozygous for an SCNN1A loss-of-function variant adapted to air breathing normally?
        rationale: The mouse knockout made ENaC look essential for clearing fetal lung liquid, but the
          human SCNN1A case shows that postnatal alveolar fluid clearance does not critically depend on
          ENaC in humans. Airway ENaC loss in patients instead shows up later as excess airway surface
          liquid and recurrent chest symptoms. The mouse is therefore a poor guide to the timing and severity
          of the respiratory phenotype, and the species difference in fetal lung liquid clearance is unexplained.
      selected_evidence:
        snippet: Alpha-ENaC(-/-) neonates developed respiratory distress and died within 40 h of birth
          from failure to clear their lungs of liquid.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
