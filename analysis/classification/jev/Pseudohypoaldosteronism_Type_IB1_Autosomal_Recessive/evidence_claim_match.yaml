        description: In principal cells of the aldosterone-sensitive distal nephron and collecting duct,
          ENaC provides the rate-limiting apical step of sodium reabsorption. Without it aldosterone cannot
          drive sodium reabsorption, producing end-organ mineralocorticoid resistance and urinary salt
          wasting. Adult nephron-specific alphaENaC deletion in mice reproduces the syndrome, which no
          other transporter compensates except under a high-sodium, low-potassium diet.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: kidney collecting duct principal cell
          term:
            id: CL:1001431
            label: kidney collecting duct principal cell
