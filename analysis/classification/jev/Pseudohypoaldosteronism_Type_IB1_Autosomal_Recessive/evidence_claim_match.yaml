        biological_processes:
        - preferred_term: renal sodium ion absorption
          modifier: DECREASED
          term:
            id: GO:0070294
            label: renal sodium ion absorption
      selected_evidence:
        snippet: We generated adult inducible nephron-specific αENaC-knockout mice (Scnn1a(Pax8/LC1))
          that exhibit hyperkalemia and body weight loss when kept on a regular-salt diet, thus mimicking
          PHA-1.
        supports: SUPPORT
