      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_imprinting_model
        hypothesis_label: Canonical GNAS Imprinting Model
        status: CANONICAL
        description: 'Parent-of-origin-specific GNAS expression explains subtype stratification: maternal
          alterations more often produce hormone resistance, while paternal coding variants favor AHO-predominant
          phenotypes.'
        notes: 'Retained as CANONICAL per the 2026 falcon hypothesis-search report (kb/hypotheses/Pseudohypoparathyroidism/canonical_imprinting_model;
          openscientist timed out on this hypothesis). The parent-of-origin framework is robustly supported
          by tissue-specific Gnas knockout mouse models and the molecular control region (1A DMR). Key
          refinements: (1) the STX16-ICR boundary establishes imprinting via OCT4-dependent chromatin
          conformation during embryogenesis; (2) the iPPSD nomenclature integrates GNAS-imprinting disorders
          with other cAMP-pathway disorders (acrodysostosis via PRKAR1A/PDE4D; PTHLH; TRPS1) sharing brachydactyly
          phenotypes; (3) tissue distribution of imprinting (renal proximal tubule, thyroid, pituitary,
          ovary, DMH hypothalamus) underlies the PHP1A-specific endocrine resistance and obesity pattern
          absent in PPHP.'
        applies_to_subtypes:
        - PHP1A
        - PHP1B
      selected_evidence:
        snippet: Thus, genomic imprinting plays a key role in the phenotypes associated with GNAS alterations.
        supports: SUPPORT
    origin:
