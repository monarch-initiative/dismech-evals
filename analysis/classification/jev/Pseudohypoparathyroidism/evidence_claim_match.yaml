        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cerebral_gsalpha_imprinting_model
        hypothesis_label: Cerebral Gsalpha Imprinting Model
        status: EMERGING
        description: Tissue-specific paternal imprinting of GNAS is proposed to extend to the brain, so
          maternally inherited (PHP1A) but not paternally inherited (PPHP) Gsalpha-inactivating variants
          cause CNS Gsalpha haploinsufficiency and neurodevelopmental/cognitive impairment, distinct from
          the AHO mesenchymal and neurohypocalcemia mechanisms.
        notes: 'Added to close a gap flagged in issue #6980: the "Developmental Delay" causal edge previously
          carried no hypothesis_groups value because cognitive impairment in PHP1A is attributed to early-onset
          CNS Gsalpha haploinsufficiency, which fit neither aho_mesenchymal_model (bone/ mesenchymal differentiation)
          nor neurohypocalcemia_model (acute hypocalcemic symptoms). A single-family case series pooled
          with the published literature (PMID:17803690) found cognitive impairment in 79% of PHP1A subjects
          versus 10% of PPHP subjects sharing the same GNAS mutations within affected kindreds (P < 1e-6),
          and excluded concurrent (mild, promptly treated) hypothyroidism as the cause — consistent with
          the neurohypocalcemia_model note that cognitive impairment is "partly dissociable from calcium
          status." Marked EMERGING rather than CANONICAL: the source infers cerebral imprinting from the
