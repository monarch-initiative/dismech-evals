          status and may reflect chronic phosphate-calcium dysregulation. Cognitive impairment in PHP1A
          is partly dissociable from calcium status — linked to early-onset Gsα haploinsufficiency in
          CNS development rather than acute neurohypocalcemia alone.'
        applies_to_subtypes:
