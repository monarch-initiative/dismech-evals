        status: EMERGING
        description: Early-onset obesity may reflect disrupted Gs alpha-dependent GPCR signaling in energy-homeostasis
          pathways, superimposed on classic PHP endocrine and skeletal mechanisms.
        notes: 'Retained as EMERGING per the 2026 falcon hypothesis-search report (kb/hypotheses/Pseudohypoparathyroidism/neuroendocrine_obesity_model;
          openscientist timed out). The most rigorous mechanistic finding (PMID:27991864) demonstrates
          that maternal Gsα loss in the dorsomedial nucleus of the hypothalamus (DMH) impairs MC4R/Gsα
          signaling, reducing energy expenditure and BAT activation without causing hyperphagia. This
          DMH-imprinting model explains why obesity is specific to PHP1A (maternal mutations) and absent
          in PPHP (paternal mutations). Additional candidate contributions: TSH/GH resistance contributing
          to metabolic-rate suppression, and melanocortin/PCSK1 pathway dysregulation.'
        applies_to_subtypes:
        - PHP1A
        - PHP1B
      selected_evidence:
        snippet: Genetic or epigenetic alterations in GNAS are known to cause pseudohypoparathyroidism
          in its different subtypes and have been recently associated with isolated, early-onset, severe
          obesity.
        supports: SUPPORT
