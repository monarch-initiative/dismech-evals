  3d2c6b0d8f554258997b03b6fa104066d559dc666a8a630a23fa1c8aa6507198:
    claim:
      about:
        disease:
          name: Pseudomyxoma Peritonei
          disease_term:
            preferred_term: pseudomyxoma peritonei
            term:
              id: MONDO:0017048
              label: pseudomyxoma peritonei
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Constitutive Ras-MAPK and Gs-cAMP Signalling
        role: mechanism
        biological_scale: MOLECULAR
        description: 'The two drivers act on different pathways and converge on the same cell. Mutant
          KRAS holds Ras-MAPK signalling on, supporting proliferation and survival of the neoplastic epithelium.
          Mutant GNAS locks the stimulatory G protein on, raising cAMP.

          The cAMP arm is the one that matters for what this disease does. Elevated cAMP is a recognised
          driver of mucin transcription and secretion, so the second driver acts directly on the hypersecretory
          phenotype rather than simply adding proliferative drive - which is the mechanistic reason a
          mostly low-grade neoplasm produces a lethal syndrome.'
        biological_processes:
        - preferred_term: Ras protein signal transduction
          term:
            id: GO:0007265
            label: Ras protein signal transduction
          modifier: INCREASED
        - preferred_term: adenylate cyclase-activating G protein-coupled receptor signaling pathway
          term:
            id: GO:0007189
            label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: High frequencies of KRAS and GNAS mutations support the proposed role as driver mutations
          and as potential therapy targets.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41868810
      reference_title: High prevalence of KRAS and GNAS mutations in pseudomyxoma peritonei underscores
        opportunities for targeted therapeutic strategies.
      evidence_source: HUMAN_CLINICAL
      explanation: INDIRECT because it establishes that these are the drivers without demonstrating the
