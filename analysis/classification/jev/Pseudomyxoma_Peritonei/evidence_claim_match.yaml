        context:
        - path: /animal_models/0
          value:
            name: PMP patient-derived xenograft (PDX) mouse
            species: Mouse
            publication: PMID:26833741
            description: 'Serial engraftment of patient PMP tumour into immunocompromised mice. Both low-grade
              and high-grade donors were engrafted, and the resulting tumours were histopathologically
              similar to human PMP.

              The model''s declared purpose is the tumour-stroma interface rather than the tumour cells
              alone, and its design makes that tractable in an unusual way: the tumour is human and the
              stroma is murine, so the species of a given cytokine identifies its cellular source.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Progressive Intraperitoneal Mucin Accumulation and Sclerosis
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: Reproduces the peritoneal mucinous tumour and its inflammatory microenvironment,
          which is the compartment where this node's fibrosis and sclerosis develop.
        limitations: 'The inflammatory environment is reproduced but not faithfully: IL-6 and IL-8/KC/MIP2
          differed significantly between human and PDX ascites, and the cytokines were secreted mostly
          by murine stromal cells rather than by the human tumour cells. Any inference about human tumour-cell
          signalling drawn from this model is therefore indirect.'
        readouts:
        - name: Ascites cytokine profile
          target: Progressive Intraperitoneal Mucin Accumulation and Sclerosis
          direction: ALTERED
          interpretation: Cytokines elevated in human PMP were also elevated in PDX ascites, establishing
            the model's inflammatory phenotype while the species differences bound its fidelity.
      selected_evidence:
        snippet: PDX mouse models of low- and high-grade PMP were generated and were of a similar histopathology
          as human PMP.
        supports: SUPPORT
