      assertion_type: Genetic
      assertion:
        name: GNAS
        relationship_type: SOMATIC_DRIVER
        variant_origin: SOMATIC
        gene_term:
          preferred_term: GNAS
          term:
            id: hgnc:4392
            label: GNAS
        association: 'Activating somatic GNAS mutations at codon 201 are present in 139 of 167 cases (83%)
          in the same series, and co-occur with KRAS far more often than chance.

          GNAS is the mechanistically interesting driver: locking Gs on raises cAMP, and cAMP drives mucin
          secretion. A high GNAS mutation rate in a disease whose lethal agent is secreted mucin is not
          a coincidence, and it is the strongest argument that the hypersecretory phenotype is genetically
          driven rather than incidental.

          Its high frequency in PMP against a low frequency in colorectal adenocarcinoma also makes it
          useful for assigning appendiceal origin.'
      selected_evidence:
        snippet: The frequency of KRAS and GNAS mutations was analyzed in tumor samples from 167 patients
          with verified PMP using targeted DNA sequencing and/or droplet digital polymerase chain reaction.
        supports: SUPPORT
