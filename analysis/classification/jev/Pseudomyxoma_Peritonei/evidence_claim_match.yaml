            term:
              id: MONDO:0017048
              label: pseudomyxoma peritonei
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: KRAS and GNAS Driver Mutations in Appendiceal Mucinous Epithelium
        role: trigger
        biological_scale: MOLECULAR
        description: 'The initiating lesion is a somatic driver pair in the epithelium of an appendiceal
          mucinous neoplasm. In the largest systematically sequenced series - 167 verified PMP patients
          analysed by targeted sequencing and droplet digital PCR - KRAS was mutated in 148 cases and
          GNAS in 139, that is 89% and 83%.

          Two features make this genotype notable. It is far more consistent than most solid tumours manage,
          which is what supports treating these as true drivers rather than passengers. And it differs
          sharply from colorectal adenocarcinoma, where GNAS mutation is uncommon - so the molecular profile
          distinguishes an appendiceal origin from a colorectal one, which is a question the pathology
          often has to answer.'
        genes:
        - preferred_term: KRAS
          term:
            id: hgnc:6407
            label: KRAS
        - preferred_term: GNAS
          term:
            id: hgnc:4392
            label: GNAS
      selected_evidence:
        snippet: The frequency of KRAS and GNAS mutations was analyzed in tumor samples from 167 patients
          with verified PMP using targeted DNA sequencing and/or droplet digital polymerase chain reaction.
        supports: SUPPORT
