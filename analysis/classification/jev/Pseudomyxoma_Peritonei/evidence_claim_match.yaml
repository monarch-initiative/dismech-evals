      assertion_type: Pathophysiology
      assertion:
        name: Appendiceal Distension and Perforation
        role: mechanism
        biological_scale: TISSUE
        description: 'The mechanical event that converts a confined neoplasm into a peritoneal disease.
          Mucin distends the obstructed appendix until it perforates, releasing both mucin and viable
          mucin-secreting cells into the peritoneal cavity.

          Perforation is the single step that determines whether a patient has an appendiceal neoplasm
          or this disease. It is also the only point at which the disease is straightforwardly preventable,
          by resecting the neoplasm intact beforehand.'
        locations:
        - preferred_term: vermiform appendix
          term:
            id: UBERON:0001154
            label: vermiform appendix
      selected_evidence:
        snippet: Pseudomyxoma peritonei (PMP) is a clinical syndrome of malignant tumors, which is caused
          by a primary mucinous tumor that breaks through the primary organ, following spread and implantation
          in the peritoneum.
        supports: SUPPORT
