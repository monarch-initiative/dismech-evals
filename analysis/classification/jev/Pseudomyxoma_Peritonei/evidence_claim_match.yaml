      assertion_type: Diagnosis
      assertion:
        name: KRAS and GNAS Mutation Testing
        description: 'Molecular testing serves two purposes. It supports appendiceal origin, since the
          KRAS-plus-GNAS pattern is uncommon in colorectal adenocarcinoma. And it identifies targetable
          drivers as agents against them become available.

          There is a practical trap: peritoneal tumour samples have low cellularity, which is the main
          reason reported mutation frequencies have varied so widely. Testing the primary appendiceal
          tumour instead raises the detection rate.'
      selected_evidence:
        snippet: The frequency of KRAS and GNAS mutations was analyzed in tumor samples from 167 patients
          with verified PMP using targeted DNA sequencing and/or droplet digital polymerase chain reaction.
        supports: SUPPORT
