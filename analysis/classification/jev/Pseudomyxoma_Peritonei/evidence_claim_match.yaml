      assertion_type: Treatment
      assertion:
        name: Mucolytic Therapy (investigational)
        therapeutic_modality: OTHER
        description: 'Dissolving mucin directly, rather than resecting it or killing the cells that make
          it. The rationale follows from this entry''s central claim: if the secreted product is what
          kills, then degrading it is a rational target in its own right.

          Approaches under investigation act on mucin O-glycosylation - the glycan that carries most of
          the molecule''s mass and all of its viscoelasticity - including inhibitors of the glycosyltransferases
          that build it and nucleotide-sugar analogues that starve them of substrate.

          Investigational. No clinical outcome data exist; the literature to date is review and preclinical.'
      selected_evidence:
        snippet: Effective mucolytic therapy can greatly improve the efficacy of cytoreductive surgery
          + hyperthermic intraperitoneal chemotherapy, alleviate symptoms and improve prognosis for pseudomyxoma
          peritonei (PMP) patients.
        supports: SUPPORT
