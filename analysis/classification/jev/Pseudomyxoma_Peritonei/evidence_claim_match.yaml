        name: Mucinous Epithelium in Extracellular Mucin Pools
        description: 'Histological grade is what the classification turns on, and in a 155-case series
          it was the only independent prognostic factor for overall survival on multivariate analysis
          - outperforming lymph node metastasis, angiolymphatic invasion, Ki67 index and p53 status, all
          of which looked prognostic on univariate testing.

          The grades run from acellular mucin, through low-grade mucinous carcinoma peritonei, to high-grade,
          to high-grade with signet ring cells. Roughly two thirds of cases are low-grade.'
      selected_evidence:
        snippet: But Multivariate analysis identified only histologic grade was the independent prognostic
          factor for OS.
        supports: SUPPORT
