        therapeutic_modality: SMALL_MOLECULE
        description: 'Oxaliplatin/5-fluorouracil/leucovorin-type regimens given systemically, for disease
          that cannot be completely cytoreduced or that has recurred beyond further surgery.

          This is second-line by necessity rather than by preference. The compartment argument that makes
          intraperitoneal delivery attractive works against systemic delivery: a poorly vascularised mucin
          lake is a difficult target for a drug arriving through the blood, and response rates in this
          histology are correspondingly modest. It is curated here because it is what patients with unresectable
          disease actually receive.'
        treatment_term:
