              label: pseudomyxoma peritonei
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intratumoral Hypoxia
        role: amplifier
        biological_scale: TISSUE
        description: 'Mucinous nodules that grow beyond their diffusion limit become hypoxic, and hypoxia
          is not a passive endpoint here: HIF-1alpha binds the MUC2 promoter directly and raises MUC2
          transcription.

          That closes a loop. Secreted mucin drives the tissue expansion that creates the hypoxia, and
          the hypoxia drives more mucin. It is the one place in this entry where the chain stops being
          a chain, and it matters practically as well as descriptively - it makes HIF-1alpha a target
          whose inhibition reduces mucinous tumour growth in a xenograft model, which is a therapeutic
          entry point aimed at the secreted product rather than at proliferation.'
        biological_processes:
        - preferred_term: response to hypoxia
          term:
            id: GO:0001666
            label: response to hypoxia
          modifier: INCREASED
      selected_evidence:
        snippet: In vitro exposure of LS174T cells to hypoxia increased MUC2 messenger RNA (mRNA) and
          protein expression and increased HIF-1α binding to the MUC2 promoter.
        supports: SUPPORT
