      assertion_type: Diagnosis
      assertion:
        name: Histopathological Grading by PSOGI Classification
        description: 'Grading is the diagnostic act that matters, because it is the only independent predictor
          of survival. The scheme separates acellular mucin, low-grade PMP, high-grade PMP and PMP with
          signet ring cells, and the survival separation between those groups is wide.

          Grade of the peritoneal disease is not always the grade of the primary: in 13% of a contemporary
          series the appendiceal neoplasm and its matching PMP were graded differently, so the peritoneal
          disease has to be graded on its own material.'
      selected_evidence:
        snippet: Median OS was 13.8 years, and 5-year OS rates were 100%, 74.4%, 44.4%, and 20% for acellular
          mucin, low-grade PMP, high-grade PMP and PMP-SRC, respectively
