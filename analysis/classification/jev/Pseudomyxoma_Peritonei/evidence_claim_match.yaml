  37af22b8c88e78524ce7aefef85e4bf6e9b0a3235bc3581d7bb9efacfae35744:
    claim:
      about:
        disease:
          name: Pseudomyxoma Peritonei
          disease_term:
            preferred_term: pseudomyxoma peritonei
            term:
              id: MONDO:0017048
              label: pseudomyxoma peritonei
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Peritoneal Redistribution and Implantation
        role: mechanism
        biological_scale: TISSUE
        description: 'Released cells are not invasive in the ordinary sense. They are carried passively
          on peritoneal fluid currents and settle where fluid is resorbed or where it pools - the greater
          omentum, the paracolic gutters, the pelvis, the undersurface of the diaphragm and, in women,
          the ovaries. Surfaces swept by peristalsis, particularly the small bowel serosa, are relatively
          spared.

          That distribution is the clinical signature of the disease and the reason cytoreductive surgery
          is feasible at all: the deposits sit on surfaces rather than infiltrating through them.

          Ovarian involvement is common enough to be a diagnostic trap - two thirds of women in a contemporary
          series - and historically led to these tumours being called primary ovarian.'
        locations:
        - preferred_term: peritoneum
          term:
            id: UBERON:0002358
            label: peritoneum
        - preferred_term: omentum
          term:
            id: UBERON:0003688
            label: omentum
        - preferred_term: ovary
          term:
            id: UBERON:0000992
            label: ovary
      selected_evidence:
        snippet: Ovarian involvement was observed in 43/65 females (66.2%).
        supports: SUPPORT
