  5e588518c281d6347f968cd0043d672ab324d52a1a747d19fc4ca4e15459750f:
    claim:
      about:
        disease:
          name: Pseudopseudohypoparathyroidism
          disease_term:
            preferred_term: pseudopseudohypoparathyroidism
            term:
              id: MONDO:0012912
              label: pseudopseudohypoparathyroidism
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: aho_developmental_model
        hypothesis_label: AHO Developmental Tissue Model
        status: CANONICAL
        description: Reduced Gs-alpha signaling disrupts growth-plate maturation and mesenchymal osteogenic
          programs. Separate growth and ectopic-ossification pathways explain core AHO skeletal features,
          while selective digit involvement and human lesion-cell mechanisms remain incompletely resolved.
        notes: Canonical core with qualified experimental branches after OpenScientist assessment. Heterozygous
          chimera evidence is distinguished from complete conditional knockouts. Mouse dermal-sheath lineage
          tracing is not human lineage proof. Hedgehog, YAP-SHH and microenvironment studies in POH models
          add mechanisms beyond a simple adipogenic-to-osteogenic switch. The 2025 study includes a small
          mixed PPHP/PHP1A/POH fibroblast microarray, contrary to the report omics-absence claim. SFRP2
          deletion worsens ossification in male AHO mice, indicating a protective modifier; recombinant
          SFRP2 did not rescue explants. Somatic second hits remain hypothetical. No established PPHP
          skeletal disease-modifying therapy follows from these studies.
      selected_evidence:
        snippet: Hypertrophy of Gnas(+/E2-) chondrocytes was modestly but significantly premature in chimeric
          growth plates of mice containing wild-type and Gnas(+/E2-) cells.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15459318
      reference_title: Stimulatory G protein directly regulates hypertrophic differentiation of growth
        plate cartilage in vivo.
      evidence_source: MODEL_ORGANISM
      explanation: The heterozygous chimera shows modest premature hypertrophy; it does not establish
        human digit selectivity.
