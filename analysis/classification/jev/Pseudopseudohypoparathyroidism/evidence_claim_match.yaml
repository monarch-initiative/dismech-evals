      assertion_type: ExperimentalModel
      assertion:
        name: Patient-derived dermal fibroblast microarrays
        experimental_model_type: PRIMARY_CELL_CULTURE
        cell_source: Dermal fibroblast cultures from three PPHP, one PHP1A and one POH participant
        description: Affymetrix U133 Plus 2.0 comparisons across five participants identified 23 shared
          differentially expressed genes, including SFRP2. P2 contributes to two contrasts and is the
          mother of P3; age, sex, subtype, relatedness and lesion burden can confound expression. This
          is patient-cell omics, but not fresh-lesion single-cell lineage proof. No raw accession was
          identified in the inspected paper.
        modeled_mechanisms:
        - target: Dermal and subcutaneous ectopic bone formation
          relationship: MEASURES
          description: Expression correlates with lesion burden but does not isolate causal human progenitors.
          limitations: Cultured dermal fibroblasts may differ from fresh lesion progenitors. The five-person
            comparisons mix PPHP, PHP1A and POH and are confounded by age, sex, relatedness, lesion burden
            and repeated use of one participant.
      selected_evidence:
        snippet: In all 3 comparisons (P1 × P2, P3 × P2, and P4 × P5), a participant with the greater
          number (and size as well) of SCOs was compared to a participant with fewer or no ossifications.
        supports: SUPPORT
