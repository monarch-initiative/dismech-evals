        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pphp_parent_of_origin_model
        hypothesis_label: Paternal GNAS Loss-of-Function Model
        status: CANONICAL
        description: A paternal GNAS coding loss-of-function variant reduces Gs-alpha dosage in biallelic
          tissues, producing AHO skeletal and soft-tissue features while usually sparing classic renal
          PTH resistance because of pre-existing tissue-specific imprinting.
        notes: Canonical after review of the OpenScientist synthesis. Renal imprinting context is distinct
          from the PPHP mutation-driven causal path; STX16 imprinting-establishment experiments concern
          PHP1B. Human thyroid imprinting is incomplete and fetal bulk renal cortex can show biallelic
          expression, so mouse tissue results cannot be made universal across human cells and ages. Rare
          paternal-variant hormone-resistance cases exist. Severe early obesity is typically maternal-variant
          associated, but universal PPHP leanness is not established. Shared-exon XL-alpha-s effects are
          variant-dependent modifiers, and PPHP, POH and osteoma cutis remain distinguishable phenotypes.
      selected_evidence:
        snippet: Gsalpha expression in the renal cortex (the site of PTH action) is markedly reduced in
          m-/+ but not in +/p- mice
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
