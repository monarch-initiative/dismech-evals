        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gnas_mixed_function_variant_scope
        prompt: Should GNAS missense variants with mixed receptor-specific gain- and loss-of-function
          behaviour be curated inside the PPHP parent-of-origin model, or as a separate entity?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - mechanistic_hypotheses#pphp_parent_of_origin_model
        - genetic#GNAS
        rationale: A small number of germline GNAS missense variants act as constitutive, ligand-independent
          activators at one receptor while blunting ligand-dependent signaling at another. Carriers present
          with nephrogenic syndrome of inappropriate antidiuresis, precocious puberty, or osteolytic metaphyseal
          bone disease rather than with AHO, and at least two reported variants sat on the paternal allele.
          These are not counterexamples to the parent-of-origin model, which is stated for coding loss-of-function
          variants, but they do mean a paternal GNAS missense finding cannot be assumed loss-of-function
          from its position alone. The practical question for this entry is whether the scope sentence
          already carried in the genetic notes is enough, or whether the mixed-function phenotypes need
          their own entry; the frequency of such variants among GNAS missense findings has never been
          measured, which is what makes the question hard to settle.
      selected_evidence:
        snippet: In vitro studies demonstrated that Gαs-F376V enhanced ligand-independent signaling at
          the PTH1R, LHCGR, and V2R and, at the same time, blunted ligand-dependent responses.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30312418
      reference_title: A New Multisystem Disorder Caused by the Gαs Mutation p.F376V.
      evidence_source: IN_VITRO
      explanation: The original demonstration that one GNAS missense variant can be activating and inactivating
        at once, depending on receptor and on whether ligand is present. This variant was maternal, so
        it establishes the phenomenon rather than the paternal-allele case.
