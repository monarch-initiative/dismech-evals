        name: Chlamydial Ribosomal Translation (Tetracycline Target)
        role: therapeutic_vulnerability
        conforms_to: bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome
        description: 'C. psittaci depends on its bacterial ribosome for protein synthesis. Doxycycline,
          a tetracycline with good intracellular bioavailability, binds the 30S ribosomal subunit and
          arrests bacterial protein synthesis — combining the ribosomal target with the intracellular
          penetration needed to reach the organism, which is why a tetracycline rather than a beta-lactam
          is first-line.

          '
        biological_processes:
        - preferred_term: translation
          term:
            id: GO:0006412
            label: translation
      selected_evidence:
        snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
        supports: SUPPORT
