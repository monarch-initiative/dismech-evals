  2d5b96f41339cedec6c7c86e6f15febb43f7371f3cc5b0144212d8eb7c8d0363:
    claim:
      about:
        disease:
          name: Pulmonary Alveolar Microlithiasis
          disease_term:
            preferred_term: Pulmonary Alveolar Microlithiasis
            term:
              id: MONDO:0009928
              label: pulmonary alveolar microlithiasis
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC34A2
        gene_term:
          preferred_term: SLC34A2
          term:
            id: hgnc:11020
            label: SLC34A2
        relationship_type: CAUSATIVE
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'Encodes NaPi-IIb, the type IIb sodium-dependent phosphate cotransporter. Biallelic loss-of-function
          variants cause the disease, and were identified independently by two groups in 2006. Loss of
          transport does not require loss of protein: some variants reach the membrane but cannot move
          phosphate, which the 2026 cryo-EM structures rationalise by showing that transport depends on
          sodium-driven conformational transitions rather than on the transporter merely being present.
          Sibling transporters SLC34A1 and SLC34A3 cause renal phosphate-wasting disease, so the same
          protein family produces very different disease depending on which epithelium expresses it.'
      selected_evidence:
        snippet: From this region, we have identified a gene that has mutations in all patients with pulmonary
          alveolar microlithiasis.
        supports: SUPPORT
