      selected_evidence:
        snippet: Microliths introduced by adoptive transfer into the lungs of wild-type mice produce marked
          macrophage-rich inflammation and elevation of serum MCP-1 that peaks at 1 week and resolves
          at 1 month, concomitant with clearance of stones.
