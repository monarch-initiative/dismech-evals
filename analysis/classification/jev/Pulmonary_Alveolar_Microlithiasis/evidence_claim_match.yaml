      assertion_type: Pathophysiology
      assertion:
        name: Loss of Phosphate Reuptake from Alveolar Lining Fluid
        biological_scale: MOLECULAR
        description: NaPi-IIb normally sits on the apical, air-facing membrane of the alveolar type II
          cell and uses the sodium gradient to haul phosphate out of the lining fluid and back into the
          cell. Structural work has since shown the transporter works by an elevator mechanism, in which
          the phosphate-binding site rides through the membrane and sodium binding drives the transition
          between states, which explains how a variant can disable transport without removing the protein.
        cell_types:
        - preferred_term: alveolar type II cell
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        biological_processes:
        - preferred_term: phosphate ion transmembrane transport
          modifier: DECREASED
          term:
            id: GO:0035435
            label: phosphate ion transmembrane transport
      selected_evidence:
        snippet: Normally, phosphate will be cleared from the alveolar space by transport via NaPi-2b
          located in the apical membrane of the alveolar type II cell.
        supports: SUPPORT
