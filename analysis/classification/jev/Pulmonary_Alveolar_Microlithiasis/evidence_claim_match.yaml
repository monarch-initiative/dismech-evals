              label: pulmonary alveolar microlithiasis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic SLC34A2 Loss of Function
        biological_scale: MOLECULAR
        description: 'Homozygous or compound heterozygous loss-of-function variants in SLC34A2, identified
          independently by two groups in 2006 in unrelated families. Some variants abolish the protein
          outright. Others reduce transport without abolishing production: in oocyte expression studies
          the Thr468del protein was synthesised and detected in the membrane while moving no more phosphate
          than uninjected controls. The authors of that work decline to claim a clean membrane-resident-but-transport-dead
          mechanism, concluding instead that the mutant either does not function properly or is not sufficiently
          expressed in the membrane, or both, and that hedge is preserved here. Either way the practical
          consequence holds: detecting the transporter protein does not establish that it works.'
        molecular_functions:
        - preferred_term: NaPi-IIb sodium-dependent phosphate transport
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0005436
            label: sodium:phosphate symporter activity
      selected_evidence:
        snippet: We identified six homozygous exonic mutations in the seven unrelated patients with PAM
          we studied.
        supports: SUPPORT
    origin:
