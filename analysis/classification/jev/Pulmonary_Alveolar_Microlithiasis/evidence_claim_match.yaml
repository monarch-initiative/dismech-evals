        name: Whole-Lung Saline Lavage
        description: 'Therapeutic lavage, borrowed from the management of pulmonary alveolar proteinosis
          where it is genuinely effective. It does not work here, and the reason is instructive rather
          than incidental: proteinosis fills the alveoli with material that can be washed out, whereas
          the stones of this disease are frequently larger than the airway lumen and simply will not come.
          Recovering some microliths in the effluent is not the same as clearing the burden.'
