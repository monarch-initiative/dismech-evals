            relationship: RECAPITULATES
            fidelity: HIGH
            description: The model demonstrates the causal direction between stones and inflammation by
              adoptive transfer into wild-type lungs, with resolution as the stones clear. That design
              distinguishes consequence from coincidence in a way no human observation can.
            limitations: The transfer experiment introduces a bolus of pre-formed stones rather than the
              slow accumulation of decades, so the kinetics of inflammation and resolution need not match
              the chronic human course.
          role: ancestor
