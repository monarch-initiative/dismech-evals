            adoptive transfer into wild-type lungs, with resolution as the stones clear. That design distinguishes
            consequence from coincidence in a way no human observation can.
          limitations: The transfer experiment introduces a bolus of pre-formed stones rather than the
            slow accumulation of decades, so the kinetics of inflammation and resolution need not match
            the chronic human course.
          readouts:
          - name: Serum MCP-1 following microlith transfer
            target: Microlith-Driven Macrophage Inflammation
            direction: INCREASED
            interpretation: Rise and subsequent fall of serum MCP-1 tracks the inflammatory response to
              stone burden and its resolution with clearance.
