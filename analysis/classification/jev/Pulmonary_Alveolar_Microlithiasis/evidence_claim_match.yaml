        publication: PMID:26560359
        description: Conditional deletion of the transporter in lung epithelium reproduces the human disease
          closely, and is the system in which the causal role of the stones and the two most promising
          therapeutic leads were established. Its most valuable feature is that it supports intervention
          experiments the human disease cannot.
        modeled_mechanisms:
