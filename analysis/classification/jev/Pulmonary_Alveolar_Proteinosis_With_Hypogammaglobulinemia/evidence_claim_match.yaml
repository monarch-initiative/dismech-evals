        description: The four disease variants (A76V, C109Y, V121G, L198V) lie in different parts of the
          enzyme but share a loss of the constraints that hold OAS1 inactive in the absence of double-stranded
          RNA, so the variant enzyme produces 2'-5'-oligoadenylate (2-5A) without its ligand. In the presence
          of dsRNA most variants are less active than wild type, so the defect is a qualitative escape
          from regulation rather than greater maximal activity.
        biological_scale: MOLECULAR
