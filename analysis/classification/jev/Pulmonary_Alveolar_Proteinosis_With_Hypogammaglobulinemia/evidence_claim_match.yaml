      assertion_type: Genetic
      assertion:
        name: OAS1
        gene_term:
          preferred_term: OAS1
          term:
            id: hgnc:8086
            label: OAS1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: 'Four recurrent heterozygous missense variants are reported (NM_016816.3): c.227C>T p.Ala76Val,
          c.326G>A p.Cys109Tyr, p.Val121Gly and c.592C>G p.Leu198Val. The first series predicted them
          as tolerated or benign by several in-silico tools, so pathogenicity rests on segregation, de
          novo occurrence and the functional gain-of-function assays. The 2026 review writes p.Ala76Val
          as A72V in one sentence; the primary reports give A76V. No ClinGen gene-disease validity record
          for OAS1 was found in the local reference cache.'
      selected_evidence:
        snippet: We identified two additional de novo heterozygous missense variations of OAS1 in two
          unrelated simplex individuals also manifesting infantile-onset PAP with hypogammaglobulinemia.
        supports: SUPPORT
