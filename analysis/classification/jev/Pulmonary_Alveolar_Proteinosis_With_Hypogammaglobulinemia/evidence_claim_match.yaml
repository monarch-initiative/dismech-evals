          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0001730
            label: 2'-5'-oligoadenylate synthetase activity
      selected_evidence:
        snippet: We observed 2–5A synthesis in a protein concentration- and time-dependent manner for
