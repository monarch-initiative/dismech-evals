  7874f7b779927e275d8348d1fd931a1988b8976952311a47ae7fa58784dc6fc7:
    claim:
      about:
        disease:
          name: Pulmonary Embolism
          disease_term:
            preferred_term: pulmonary embolism
            term:
              id: MONDO:0005279
              label: pulmonary embolism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Right ventricular ischaemia and contractile failure
        biological_scale: TISSUE
        description: 'Right ventricular myocardium becomes ischaemic in the absence of any coronary disease.
          Demand rises with wall stress while supply falls, because right coronary perfusion depends on
          the gradient between systemic pressure and right ventricular cavity pressure, and pulmonary
          embolism moves both in the wrong direction. The resulting myocardial injury is measurable as
          troponin release, which is why a biomarker of myocyte necrosis is a risk-stratification tool
          in a disease of the lungs. Once contractile failure is established the cascade is self-reinforcing,
          and this is the mechanism behind the observation that a large share of deaths occur within the
          first hour.

          '
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        locations:
        - preferred_term: heart right ventricle
          term:
            id: UBERON:0002080
            label: heart right ventricle
      selected_evidence:
        snippet: In either case, the presence of shock defines a threefold to sevenfold increase in mortality,
          with a majority of deaths occurring within 1 h of presentation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
