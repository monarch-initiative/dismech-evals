  51db6fabd0cdea4493faf147338084e774ec7dffa18a59664d2fcc4112940b02:
    claim:
      about:
        disease:
          name: Pulmonary Embolism
          disease_term:
            preferred_term: pulmonary embolism
            term:
              id: MONDO:0005279
              label: pulmonary embolism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ventricular interdependence and impaired left ventricular filling
        biological_scale: ORGANISM
        description: 'The two ventricles share a septum and a pericardium, so right ventricular dilation
          and pressure overload bow the septum leftwards and physically restrict left ventricular diastolic
          filling. Cardiac output falls even though the left ventricle is contracting normally, producing
          obstructive shock. The causal direction has been demonstrated by intervention rather than only
          inferred from imaging. Relieving the pulmonary arterial obstruction mechanically reduces septal
          bowing and simultaneously increases left ventricular volume and improves transmitral filling,
          and septal curvature tracks both pulmonary pressure and left ventricular filling pressure.

          '
        locations:
        - preferred_term: heart right ventricle
          term:
            id: UBERON:0002080
            label: heart right ventricle
      selected_evidence:
        snippet: Right ventricular (RV) volumes and septal bowing decreased, whereas left ventricular
          (LV) volumes and transmitral filling parameters improved (E/e', p = 0.0002).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41984155
      reference_title: 'Mechanical thrombectomy improves left ventricular filling in intermediate-high
        risk pulmonary embolism: the role of ventricular interdependence.'
      evidence_source: HUMAN_CLINICAL
      explanation: Shows the interdependence relationship reversing when the upstream obstruction is removed,
        which is stronger evidence for the causal direction than a cross-sectional association between
        septal position and low output.
