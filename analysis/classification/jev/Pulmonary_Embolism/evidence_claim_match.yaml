              id: MONDO:0005279
              label: pulmonary embolism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Right ventricular afterload mismatch and dilation
        biological_scale: TISSUE
        description: 'The right ventricle is a thin-walled chamber adapted to a low-resistance circuit,
          and it cannot acutely generate the pressures a hypertrophied chamber can. Faced with an afterload
          that appears over minutes it dilates, and wall stress rises. Dilation is a compensatory response
          before it is a failure state, and the same porcine model shows the sequence directly. Dilation
          occurs from the earliest emboli while ejection fraction is preserved, and only with further
          embolic burden does contractile performance fall. This is why a dilated right ventricle on imaging
          is a risk marker rather than a diagnosis of shock.

          '
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        locations:
        - preferred_term: heart right ventricle
          term:
            id: UBERON:0002080
            label: heart right ventricle
      selected_evidence:
        snippet: RV dilatation occurred following initial PEs, while RV ejection fraction declined after
          the third PE (p = 0.004).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38745282
      reference_title: 'Immediate cardiopulmonary responses to consecutive pulmonary embolism: a randomized,
