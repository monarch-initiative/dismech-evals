              label: pulmonary embolism
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: reperfusion_in_intermediate_risk_disease
        kind: CONTROVERSY
        status: OPEN
        prompt: 'Which patients with a strained but compensating right ventricle should have the obstruction
          removed?

          '
        rationale: 'The intermediate-risk stratum is defined by demonstrable right ventricular injury
          without systemic hypotension, so by the mechanistic account in this entry it is the group in
          which intervening before the cascade becomes self-reinforcing should pay off most. The randomised
          test of systemic fibrinolysis in exactly this group found the expected benefit and an offsetting
          harm, leaving no net mortality difference. Catheter-directed approaches are proposed as the
          way to get the mechanical benefit without the systemic bleeding, and the haemodynamic evidence
          that they reverse ventricular interdependence is encouraging, but it comes from small uncontrolled
          series. The controversy is therefore not about the mechanism, which is well supported, but about
          whether any currently available way of acting on it improves outcomes.

          '
        attaches_to:
        - pathophysiology#Right ventricular afterload mismatch and dilation
        - pathophysiology#Ventricular interdependence and impaired left ventricular filling
        proposed_experiments:
        - experiment_id: exp_catheter_reperfusion_randomised_outcome
          name: Randomised outcome trial of catheter-directed reperfusion
          description: 'Randomise normotensive patients with right ventricular dysfunction and biomarker
            elevation to catheter-directed reperfusion plus anticoagulation versus anticoagulation alone,
            powered for death or haemodynamic decompensation with bleeding as a co-primary safety outcome,
            to test whether the mechanical benefit demonstrated haemodynamically translates into outcome
            benefit without the bleeding cost of systemic lysis.

            '
      selected_evidence:
        snippet: By day 30, a total of 12 patients (2.4%) in the tenecteplase group and 16 patients (3.2%)
          in the placebo group had died (P=0.42).
        supports: SUPPORT
