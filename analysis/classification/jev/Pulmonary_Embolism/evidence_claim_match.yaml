      assertion_type: Discussion
      assertion:
        discussion_id: polygenic_background_modifies_monogenic_thrombophilia
        kind: OPEN_QUESTION
        status: OPEN
        prompt: 'Should thrombophilia risk be assessed as a polygenic quantity rather than as carrier
          status for a small number of named variants?

          '
        rationale: 'Thrombophilia testing in practice asks whether a patient carries one of a handful
          of variants. A large genome-wide meta-analysis found that the extremes of a polygenic score
          reach the risk conferred by those variants, and, more consequentially, that carriers of the
          classical variants who sit in the low tail of the polygenic distribution have risk indistinguishable
          from the general population. If that is confirmed prospectively it means carrier status alone
          is not the right unit of risk, and that some patients currently counselled as thrombophilic
          are not. The open question is whether this changes management decisions, principally the duration
          of anticoagulation, rather than merely improving risk estimation.

          '
        attaches_to:
        - pathophysiology#Prothrombotic venous context
      selected_evidence:
        snippet: We also document that F2 and F5 mutation carriers in the bottom 10% of the PRS distribution
          had a risk similar to that of the general population.
        supports: SUPPORT
