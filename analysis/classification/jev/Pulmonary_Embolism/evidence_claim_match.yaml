        notes: 'Factor V Leiden, the commonest inherited thrombophilia in European-ancestry populations,
          removes an activated protein C cleavage site so that activated factor V persists. It raises
          the risk of venous thrombosis several-fold and interacts strongly with oestrogen exposure. Its
          relationship to pulmonary embolism specifically is more complicated than its relationship to
          venous thrombosis, since it is relatively less frequent among embolic than among non-embolic
          presentations.

