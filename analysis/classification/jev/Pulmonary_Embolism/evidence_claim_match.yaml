      assertion:
        name: Thrombus resolution versus fibrotic organization
        biological_scale: TISSUE
        description: 'Most emboli resolve. Endogenous fibrinolysis, assisted by anticoagulation preventing
          further accretion, clears the pulmonary arterial bed over weeks to months. In a minority the
          material is not cleared but organises into fibrotic tissue incorporated into the vessel wall,
          giving fixed obstruction and chronic thromboembolic pulmonary hypertension. The risk is concentrated
          early and is higher after an unprovoked event, and it does not accumulate indefinitely.

          '
        biological_processes:
        - preferred_term: fibrinolysis
          term:
            id: GO:0042730
            label: fibrinolysis
          modifier: DECREASED
        locations:
        - preferred_term: pulmonary artery
          term:
            id: UBERON:0002012
            label: pulmonary artery
        notes: 'No conformance is declared to the pulmonary_vascular_remodeling module. That module''s
          central effector node describes obstruction produced by pulmonary artery smooth muscle cell
          proliferation, neointima formation, and plexiform lesions. The obstruction curated here is organised
          fibrotic thromboembolic material, which is a different lesion arrived at by a different route.
          Chronic thromboembolic pulmonary hypertension is also reported to carry a small-vessel arteriopathy
          in territories that were never occluded, and if that arm were curated with its own evidence
          it would be a legitimate conformance target. This entry does not cite evidence for it and therefore
          does not assert it.

          '
      selected_evidence:
        snippet: No cases occurred after two years among the patients with more than two years of follow-up
          data.
