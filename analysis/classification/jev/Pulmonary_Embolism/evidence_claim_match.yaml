              id: MONDO:0005279
              label: pulmonary embolism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Acute rise in pulmonary vascular resistance
        biological_scale: ORGANISM
        description: 'Loss of pulmonary arterial cross-sectional area raises pulmonary arterial pressure
          immediately. Pressure and resistance do not rise together, which matters because they are often
          treated as interchangeable. In a controlled porcine model of successive emboli, pulmonary pressure
          rose after the very first embolus while pulmonary vascular resistance and right ventricular
          arterial elastance did not rise until the third, so early pressure elevation reflects obstruction
          being absorbed by a still-compensating circuit rather than the afterload burden the right ventricle
          ultimately faces. A humoral contribution from platelet-derived vasoconstrictors is widely proposed
          as an amplifier of the mechanical obstruction. This entry does not cite evidence for that component
          and does not assert it.

          '
        locations:
        - preferred_term: pulmonary artery
          term:
            id: UBERON:0002012
            label: pulmonary artery
      selected_evidence:
        snippet: Pulmonary pressures increased after the initial PE administration
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38745282
      reference_title: 'Immediate cardiopulmonary responses to consecutive pulmonary embolism: a randomized,
        controlled, experimental study.'
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that pulmonary arterial pressure rises from the first embolic insult. Evidence
