        context: []
      assertion_type: Treatment
      assertion:
        name: Systemic fibrinolysis
        description: 'Plasminogen activators given systemically to lyse the embolus and unload the right
          ventricle. This is the one treatment that acts on the obstruction itself, and it is curated
          with its harm attached, because the trial that tested it in the intermediate-risk stratum found
          it prevented haemodynamic decompensation while causing major bleeding and stroke. That result
          is the reason fibrinolysis is reserved for patients already in shock rather than given to everyone
          with a strained right ventricle.

          '
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: tenecteplase
            term:
              id: CHEBI:753718
              label: tenecteplase
      selected_evidence:
        snippet: Stroke occurred in 12 patients (2.4%) in the tenecteplase group and was hemorrhagic in
          10 patients; 1 patient (0.2%) in the placebo group had a stroke, which was hemorrhagic (P=0.003).
        supports: REFUTE
    origin:
      assertion_path: /treatments/3
      evidence_path: /treatments/3/evidence/1
      context_paths:
