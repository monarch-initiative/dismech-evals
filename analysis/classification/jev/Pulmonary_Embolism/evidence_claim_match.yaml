      assertion_type: Pathophysiology
      assertion:
        name: Pulmonary infarction
        biological_scale: TISSUE
        description: 'Necrosis of lung distal to an occluded pulmonary artery. It is the exception rather
          than the rule, because the lung receives a second arterial supply from the bronchial circulation
          that can sustain the tissue when the pulmonary supply is lost. Infarction is accordingly associated
          with smaller, more distal emboli and with conditions that limit bronchial collateral flow, and
          it produces the pleuritic pain and haemoptysis that the classical description of the disease
          was built around. Its true frequency is uncertain, and is higher in post-mortem series than
          in series of survivors, which is itself informative about ascertainment.

          '
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
      selected_evidence:
        snippet: The real incidence of PI could be underestimated considering only non-fatal PE presentation.
          However, following postmortem examination, the prevalence of PI is considerably higher.
        supports: SUPPORT
    origin:
