              id: MONDO:0005279
              label: pulmonary embolism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Embolization to the pulmonary arterial tree
        biological_scale: ORGANISM
        conforms_to: thrombogenesis#Venous Thrombus Embolization to Pulmonary Arteries
        description: 'A thrombus fragment detaches and travels through the inferior vena cava, right atrium,
          and right ventricle to lodge in the pulmonary arteries, at a level determined by its size. This
          is the step that converts a limb disease into a cardiopulmonary emergency, and it is mechanistically
          distinct from thrombus formation rather than a continuation of it. Which thrombi embolise is
          not simply a function of how prothrombotic the patient is, and one pooled analysis found the
          commonest inherited thrombophilia to be relatively less frequent among patients presenting with
          pulmonary embolism than among those with deep vein thrombosis alone.

          '
        locations:
        - preferred_term: pulmonary artery
          term:
            id: UBERON:0002012
            label: pulmonary artery
      selected_evidence:
        snippet: we also confirmed that the frequency of factor V Leiden was lower in patients with pulmonary
          embolism than in patients with deep vein thrombosis without PE (odds ratio 0.69). Conversely,
          factor II G20210A mutation was equally balanced in both patient groups.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11583312
      reference_title: Combined effect of factor V Leiden and prothrombin 20210A on the risk of venous
        thromboembolism--pooled analysis of 8 case-control studies including 2310 cases and 3204 controls.
        Study Group for Pooled-Analysis in Venous Thromboembolism.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the claim that embolization is a step with its own determinants rather than
        a simple function of thrombotic tendency, since two thrombophilias with similar effects on thrombosis
        risk are distributed differently between embolic and non-embolic presentations. Graded PARTIAL
        because the observation establishes that the propensities differ without identifying what makes
        a thrombus embolise.
