      assertion_type: Treatment
      assertion:
        name: Pulmonary endarterectomy and balloon pulmonary angioplasty
        description: 'Mechanical removal or dilation of organised fibrotic thromboembolic material in
          chronic thromboembolic pulmonary hypertension. Endarterectomy is the treatment of choice where
          the disease is surgically accessible and balloon angioplasty is the alternative where it is
          not. Both produce right ventricular reverse remodelling, which is the point mechanistically,
          since it shows the chronic right ventricular changes are load-dependent and reversible rather
          than a fixed cardiomyopathy. This is the treatment that makes recognising chronic thromboembolic
          disease consequential rather than merely prognostic.

          '
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Surgical Procedure
          term:
            id: NCIT:C15329
