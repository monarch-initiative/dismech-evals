      assertion_type: Discussion
      assertion:
        discussion_id: what_makes_a_thrombus_embolise
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Why do some deep venous thrombi embolise while most do not, and can that propensity be
          predicted or modified?

          '
        rationale: 'Every treatment in this disease acts either on thrombus formation or on the consequences
          of an embolus that has already lodged. Nothing acts on embolisation itself, and the step is
          treated clinically as a stochastic event. There is evidence that it is not purely stochastic,
          since two inherited thrombophilias with comparable effects on thrombosis risk are distributed
          differently between embolic and non-embolic presentations, which implies thrombus properties
          or location influence the propensity. What those determinants are is not established, and the
          model systems that could address it are precisely the ones that fail, since rodent venous thrombosis
          models do not embolise and the porcine models that reproduce the haemodynamics deliver emboli
          directly and so bypass the question.

          '
        attaches_to:
        - pathophysiology#Embolization to the pulmonary arterial tree
        proposed_experiments:
        - experiment_id: exp_embolic_propensity_thrombus_composition
          name: Thrombus composition and embolic propensity
          description: 'Compare the composition, age, and anatomical origin of retrieved thrombi from
            patients undergoing mechanical thrombectomy for pulmonary embolism against thrombi retrieved
            or imaged in patients with deep vein thrombosis that did not embolise, testing whether fibrin
            content, platelet content, or degree of organisation predicts embolisation.

            '
      selected_evidence:
        snippet: we also confirmed that the frequency of factor V Leiden was lower in patients with pulmonary
          embolism than in patients with deep vein thrombosis without PE (odds ratio 0.69).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
