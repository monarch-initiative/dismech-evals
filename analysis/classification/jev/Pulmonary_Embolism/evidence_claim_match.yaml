      assertion:
        name: Prolonged immobilisation
        description: 'Prolonged immobility, whether from hospital or nursing-home confinement, paresis,
          or a plaster cast, is the other archetypal acquired provoking factor. It acts through venous
          stasis rather than through coagulation activation, which is why mechanical prophylaxis is a
          coherent intervention against it and not merely an adjunct to anticoagulation.

          '
        notes: 'No ECTO term is bound. The exposure hierarchy has no term for immobilisation or bed rest;
          ECTO:6000004 (exposure to sedentary lifestyle) was considered and rejected, because it names
          a habitual behaviour rather than the acute, externally imposed immobility that matters here.

          '
      selected_evidence:
        snippet: hospital or nursing home confinement (OR, 8.0; 95% CI, 4.5-14.2)
        supports: SUPPORT
