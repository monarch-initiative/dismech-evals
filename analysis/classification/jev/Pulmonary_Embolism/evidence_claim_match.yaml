      assertion_type: ExperimentalModel
      assertion:
        name: Porcine consecutive pulmonary embolism model
        description: 'Anaesthetised pigs receiving repeated catheter-delivered emboli at fixed intervals,
          with pressure-volume loops and invasive pressures recorded after each. The model exists because
          rodent venous thrombosis models reproduce thrombus formation well but do not reliably produce
          pulmonary embolism, so the haemodynamic half of the disease has to be studied by delivering
          emboli directly. Its value here is that it separates events that are simultaneous in patients.
          It shows pulmonary pressure rising from the first embolus, resistance and afterload only from
          the third, and dilation preceding the fall in ejection fraction. Its limitation is that bypassing
          spontaneous embolisation makes it useless for studying why thrombi embolise.

          '
        experimental_model_type: OTHER
        organism:
          preferred_term: pig
          term:
            id: NCBITaxon:9823
            label: Sus scrofa
        modeled_mechanisms:
        - target: Acute rise in pulmonary vascular resistance
          description: 'Serial embolisation reproduces the rise in pulmonary pressure and, with greater
            burden, in pulmonary vascular resistance.

            '
        - target: Right ventricular afterload mismatch and dilation
          description: 'The model reproduces right ventricular dilation and the later decline in ejection
            fraction.

            '
        publication: PMID:38745282
      selected_evidence:
        snippet: In an experimental model of consecutive PE, RV afterload elevation and dysfunction manifested
          after the third PE, in contrast to pulmonary pressure that increased after the first PE.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
      evidence_path: /experimental_models/0/evidence/1
