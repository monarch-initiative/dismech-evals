      reference_title: Genome-wide meta-analysis identifies 93 risk loci and enables risk prediction equivalent
        to monogenic forms of venous thromboembolism.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the other half of the argument, that common-variant background alone can
        reach monogenic-equivalent risk.
