        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ventilation-perfusion mismatch and increased dead space
        biological_scale: ORGANISM
        description: 'Occluded segments continue to be ventilated but are no longer perfused, so they
          become alveolar dead space, while blood is redistributed to the remaining vasculature at higher
          flow per unit of alveolus. The result is hypoxaemia with hypocapnia, since the patient hyperventilates
          in response. This arm runs in parallel with the haemodynamic arm rather than downstream of it,
          and it is the source of the presenting symptoms. It is not, however, what determines survival,
          which is the central asymmetry of the disease.

          '
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
      selected_evidence:
        snippet: Acute pulmonary embolism (PE) induces ventilation-perfusion mismatch and hypoxia and
          increases pulmonary pressure and right ventricular (RV) afterload, entailing potentially fatal
          RV failure within a short timeframe.
        supports: SUPPORT
