  5445aab5bf4873cd928bca2d8e9f95be99f0504a4f50c1edaa6953304d02357d:
    claim:
      about:
        disease:
          name: Pulmonary Embolism
          disease_term:
            preferred_term: pulmonary embolism
            term:
              id: MONDO:0005279
              label: pulmonary embolism
        context: []
      assertion_type: Phenotype
      assertion:
        category: Cardiovascular
        name: Post-pulmonary embolism syndrome
        description: 'Persistent breathlessness, exercise intolerance, and impaired quality of life after
          an apparently treated pulmonary embolism, frequently without pulmonary hypertension or right
          ventricular abnormality to account for it. It is far commoner than chronic thromboembolic pulmonary
          hypertension and is the outcome most survivors actually live with, yet it has no single diagnostic
          test, which is why it was long treated as a complaint rather than a syndrome. A measurable subset
          does have persistent right ventricular dysfunction, and that subset carries excess recurrence
          and mortality, so the label spans a functional complaint and a haemodynamic finding that are
          not the same thing.

          '
        phenotype_term:
          preferred_term: Dyspnea
          term:
            id: HP:0002094
            label: Dyspnea
          temporality: CHRONIC
        notes: 'The binding is to Dyspnea with a CHRONIC qualifier. HPO has no term for post-pulmonary
          embolism syndrome as an entity, and the syndrome is a composite of persistent breathlessness,
          exercise intolerance, and psychological impairment that no single HPO term covers, so the dominant
          symptom carries the binding and the composite is described in prose.

          '
      selected_evidence:
        snippet: Post-pulmonary embolism syndrome (PPES) describes the spectrum of long-term sequelae
          following acute pulmonary embolism (PE), including persistent dyspnea, exercise intolerance,
          and psychological impairment, often in the absence of pulmonary hypertension (PH) or right ventricular
          (RV) abnormalities.
        supports: SUPPORT
    origin:
