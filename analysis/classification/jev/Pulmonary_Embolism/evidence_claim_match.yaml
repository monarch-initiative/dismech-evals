        context: []
      assertion_type: Treatment
      assertion:
        name: Inferior vena cava filter
        description: 'A mechanical device intended to trap embolising thrombus before it reaches the lungs,
          so in principle the only treatment that acts on the embolization node itself. It is curated
          with its negative trial attached, because when tested against anticoagulation alone in patients
          at high risk of recurrence it did not reduce recurrent pulmonary embolism, and recurrences were
          numerically more frequent in the filter arm. Its remaining role is confined to patients who
          cannot be anticoagulated at all, which is a role defined by the absence of an alternative rather
          than by demonstrated benefit.

          '
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: Therapeutic Procedure
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
      selected_evidence:
        snippet: By 3 months, recurrent pulmonary embolism had occurred in 6 patients (3.0%; all fatal)
          in the filter group and in 3 patients (1.5%; 2 fatal) in the control group
        supports: REFUTE
