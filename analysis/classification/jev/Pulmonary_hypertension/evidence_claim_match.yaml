      assertion_type: Discussion
      assertion:
        discussion_id: openq_ph_glp1_direct_mechanism
        prompt: 'Do GLP-1 receptor agonists act directly on the pulmonary vasculature to produce any benefit
          in pulmonary hypertension, and if so through which pathway: inflammatory signalling, endothelial
          nitric oxide, endothelin-1, or mitochondrial regulation?'
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#
        rationale: GLP-1 receptor expression in pulmonary arterial smooth muscle is shown in human and
          non-human primate tissue, but available studies do not establish that it is higher there than
          in systemic vascular smooth muscle. The four candidate pathways in the prompt come from the
          review's general synthesis of GLP-1 receptor signalling, not from PH-specific data. Liraglutide
          reduced right ventricular pressures and remodelling in monocrotaline- and hypoxia-induced models
          that mainly resemble Group 1 PAH, and semaglutide improved right ventricular mitochondrial measures
          in a pressure-overload model. Human evidence is observational or indirect from HFpEF studies,
          enriched for Group 2 or unclassified PH, and lacks catheterization-confirmed PH endpoints. The
          authors conclude the evidence supports a mechanistic hypothesis and a preclinical signal, not
          clinical efficacy in PH.
      selected_evidence:
        snippet: available studies do not establish greater expression in pulmonary than systemic vascular
          smooth muscle
        supports: SUPPORT
