        snippet: In 18 families with autosomal dominant punctate PPK, we report heterozygous loss-of-function
          mutations in AAGAB, encoding α- and γ-adaptin-binding protein p34, located at a previously linked
          locus at 15q22.
        supports: SUPPORT
