  6fc9c95f98d322306f5e9851701af365c112c642728051a099ac4852a5c9bfca:
    claim:
      about:
        disease:
          name: Punctate Palmoplantar Keratoderma
          disease_term:
            preferred_term: punctate palmoplantar keratoderma
            term:
              id: MONDO:0017675
              label: punctate palmoplantar keratoderma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Growth Factor Receptor Signaling Increase
        description: 'Impaired receptor endocytosis and turnover increases growth-factor receptor signaling
          in keratinocytes. This mechanism is best supported for EGFR in AAGAB-knockdown keratinocyte
          models, which also show elevated levels of the receptor tyrosine kinase Axl, indicating a broader
