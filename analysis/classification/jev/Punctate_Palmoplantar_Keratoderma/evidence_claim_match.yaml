      assertion_type: Discussion
      assertion:
        discussion_id: gap_pppk1_focal_distribution_mechanism
        prompt: Why is hyperkeratosis in punctate palmoplantar keratoderma so sharply focal on palmar
          skin when the causative AAGAB haploinsufficiency is expressed throughout the epidermis, and
          is a somatic second hit required to trigger each lesion?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Keratinocyte Hyperproliferation
        rationale: AAGAB loss of function is constitutional and expressed across palmoplantar epidermis,
          yet lesions arise as discrete punctate foci rather than diffuse keratoderma. A somatic second-hit
          model has been proposed but was not identified by microdissection and sequencing, leaving the
          focal patterning mechanism undefined and mechanistically important for understanding p34 control
          of keratinocyte proliferation.
      selected_evidence:
        snippet: the extremely focal distribution of hyperkeratosis on the palmar skin in the disorder
          is striking. The mechanism(s) responsible for producing this very focal disease on the background
          of a mutation expressed throughout the palmar skin are likely to be of clinical relevance, but
          they remain to be defined.
        supports: SUPPORT
