      assertion:
        discussion_id: controversy_pppk1_malignancy_association
        prompt: Does punctate palmoplantar keratoderma type 1 confer an increased risk of malignancy that
          would justify cancer surveillance, or is the long-proposed association unconfirmed?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Growth Factor Receptor Signaling Increase
        rationale: A cancer association has been proposed for decades and some authors recommend malignancy
          surveillance, with a mechanistic rationale that EGFR and related receptor tyrosine kinase signaling
          is dysregulated in AAGAB-deficient keratinocytes and is also a feature of neoplasia. Primary
          family studies did not observe co-segregation of cancer with AAGAB variants, and a PRISMA systematic
          review of 45 studies covering more than 800 individuals judged the evidence too poor in quality
          to confirm an association and questioned routine surveillance. The competing published positions
          leave the clinical counseling question unresolved.
      selected_evidence:
        snippet: In some families there appears to be an association with cancer.
        supports: SUPPORT
