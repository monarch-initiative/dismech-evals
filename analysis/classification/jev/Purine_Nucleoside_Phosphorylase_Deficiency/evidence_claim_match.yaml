        biological_scale: MOLECULAR
        role: biomarker
        description: 'Because uric acid is the end product of the interrupted pathway, serum urate is
          characteristically low - often strikingly so - and unmetabolised PNP substrates appear in the
          urine. This pairing is the cheap, widely available diagnostic clue that distinguishes PNP deficiency
          from other combined immunodeficiencies, and low uric acid in a lymphopenic infant should prompt
          the specific enzyme assay. Notably, urinary substrate elevation is the more sensitive of the
          two: partial-deficiency patients had entirely normal blood uric acid yet still excreted increased
          PNP substrates.'
      selected_evidence:
