          which is the reason a ubiquitously expressed enzyme defect produces a predominantly lymphoid
          disease.
      selected_evidence:
        snippet: The gene for PNP has been cloned; it is located on the long arm of chromosome 14. Studies
          of a mutant PNP gene isolated from one patient showed that a point mutation resulting in an
          amino acid substitution was responsible for PNP deficiency.
