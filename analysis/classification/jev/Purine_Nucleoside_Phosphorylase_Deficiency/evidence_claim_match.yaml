      assertion:
        name: Accumulation of Deoxyguanosine and Other PNP Substrates
        biological_scale: MOLECULAR
        role: central_effector
        description: 'Inosine, guanosine, deoxyinosine and above all deoxyguanosine accumulate behind
          the enzymatic block. Deoxyguanosine is the toxic species: unlike the ribonucleosides it can
          be phosphorylated onward to a deoxynucleotide triphosphate, and it is this conversion that converts
          a metabolic block into cell death.'
      selected_evidence:
        snippet: The elevated dGTP found in PNP deficiency is thought to inhibit ribonucleotide reductase
          and, thus, impede cell division.
        supports: SUPPORT
