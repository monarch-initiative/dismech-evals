      assertion_type: Diagnosis
      assertion:
        name: Purine nucleoside phosphorylase enzyme activity assay
        description: 'Demonstration of absent or severely reduced PNP catalytic activity, conventionally
          measured by conversion of labelled inosine in erythrocyte haemolysates, mononuclear cells or
          lymphoblastoid cells, is the confirmatory biochemical test. Quantitation rather than a simple
          present/absent result matters here, because residual activity predicts phenotype: 8-11% of normal
          was compatible with survival into the third decade and normal neurological development.'
        diagnosis_term:
          preferred_term: enzyme activity assay
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
        results: Absent or severely reduced PNP activity confirms the diagnosis; residual activity should
          be quantified because it predicts severity.
      selected_evidence:
        snippet: PNP protein expression was determined by Western Blotting in lymphoblastoid B cells.
          DNA repair was quantified by measuring viability of lymphoblastoid B cells following ionizing
          irradiation.
        supports: SUPPORT
