          triphosphohydrolase SAMHD1 - the enzyme that would otherwise dispose of excess dNTPs. Developing
          thymocytes physiologically downregulate SAMHD1, so they lose the very safeguard that would protect
          them from an accumulating dNTP load, which is a second and more specific explanation for why
          the disease targets the developing T-cell compartment. The interaction requires deoxycytidine
          kinase activity and is antagonised by microenvironmental deoxycytidine, so it is in principle
          a modifiable dependency.
        cell_types:
        - preferred_term: thymocyte
          term:
            id: CL:0000893
            label: thymocyte
      selected_evidence:
        snippet: This interaction requires deoxycytidine kinase activity and is antagonized by microenvironmental
          deoxycytidine.
        supports: SUPPORT
