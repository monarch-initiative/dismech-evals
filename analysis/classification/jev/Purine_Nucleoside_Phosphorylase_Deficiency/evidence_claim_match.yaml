            term:
              id: MONDO:0013171
              label: purine nucleoside phosphorylase deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pnp-dual-checkpoint-human-validation
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Unrestrained TLR7 Signalling by Guanosine Nucleoside Ligands
        - pathophysiology#SAMHD1-Dependent Synthetic Lethality in Developing T Cells
        prompt: The dual-checkpoint model - a SAMHD1-dependent synthetic lethality in developing T cells
          and a TLR7-ligand checkpoint in B cells and macrophages - elegantly explains why one metabolic
          gene produces both immunodeficiency and autoimmunity. It rests on mouse and cellular experiments.
          Do both checkpoints operate in human PNP deficiency, and does the TLR7 arm account for the autoimmunity
          seen in roughly a third of patients?
        rationale: Evidence for this model exists and is mechanistically strong, so the open question
          is translational validity rather than absence of data - which is what makes this a HUMAN_MODEL_MISMATCH
          rather than a knowledge gap. It matters for two reasons. If the human autoimmunity is TLR7-driven,
          then TLR7-directed or nucleoside-lowering therapy is a rational adjunct in patients awaiting
          transplant, whereas conventional immunosuppression in a patient who is already immunodeficient
          is an unattractive option. And if the T-cell arm genuinely depends on deoxycytidine kinase and
          is antagonised by microenvironmental deoxycytidine, that is a pharmacologically approachable
          dependency rather than an inevitability of the enzyme defect.
        proposed_experiments:
        - experiment_id: pnp-human-tlr7-checkpoint
          name: TLR7 pathway activity in human PNP-deficient B cells and macrophages
          description: In patients with PNP deficiency, measure TLR7 pathway activation and interferon
            signatures in primary B cells and monocyte-derived macrophages, correlate with (deoxy)guanosine
            nucleoside levels and with the presence of autoimmune manifestations, and test whether ex
            vivo TLR7 blockade or nucleoside depletion normalises the signature.
          readouts:
          - name: TLR7 pathway activation versus nucleoside levels and autoimmune status
            target: pathophysiology#Unrestrained TLR7 Signalling by Guanosine Nucleoside Ligands
          would_support:
          - pathophysiology#Unrestrained TLR7 Signalling by Guanosine Nucleoside Ligands
      selected_evidence:
        snippet: PNP insufficiency in humans is paradoxically associated with both immunodeficiency and
          autoimmunity, but the mechanistic basis for these outcomes is incompletely understood.
        supports: SUPPORT
