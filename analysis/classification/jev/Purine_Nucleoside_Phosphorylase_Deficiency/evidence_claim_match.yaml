            term:
              id: MONDO:0013171
              label: purine nucleoside phosphorylase deficiency
        context:
        - path: /animal_models/1
          value:
            name: B6-NPE / B6-NPF ENU-induced PNP-deficient mouse strains
            species: Mouse
            genotype: Pnp hypomorphic ENU-induced point mutants (B6-NPE, B6-NPF); residual PNP activity
              with a secondary deficiency of deoxyguanosine kinase
            publication: PMID:7918681
            description: 'Chemically induced hypomorphic Pnp mutants, predating the Arpaia knockout by
              six years and carrying residual enzyme activity rather than a null allele. They are curated
              as a separate model precisely because the negative result below is theirs and not the knockout''s:
              a hypomorph failing to accumulate dGTP is a materially weaker negative than a null failing
              to, and attaching that claim to the field''s principal model would overstate it.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Intracellular dGTP Pooling in Lymphoid Cells
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: This is the honest negative result, and it is the structural counterpart of the HUMAN_MODEL_MISMATCH
          discussion. In the B6-NPE and B6-NPF PNP-deficient mouse lines, the dGTP accumulation that the
          whole human mechanism is built on was not detectable in thymocytes, spleen leucocytes or erythrocytes,
          and there were no changes in purine or pyrimidine ribonucleotide pools. The lines instead showed
          a secondary deficiency of deoxyguanosine kinase, which would prevent the toxic phosphorylation
          step from running - so the mouse partly protects itself from the very lesion the model is meant
          to represent.
        limitations: This failure is line-specific rather than a property of murine PNP deficiency in
          general, and it does not overturn the mitochondrial hypothesis; it does mean that a murine failure
          to accumulate dGTP cannot be read as evidence about the human metabolic phenotype, and that
          dGTP-pooling claims must rest on human data.
        readouts:
        - name: dGTP concentration in thymocytes, spleen leucocytes and erythrocytes
          target: Intracellular dGTP Pooling in Lymphoid Cells
          direction: UNCHANGED
          interpretation: No detectable dGTP accumulation in the very compartments where the human mechanism
            predicts it - a genuine negative measurement, not an absence of testing.
      selected_evidence:
        snippet: We found no evidence for dGTP accumulation in thymocytes or spleen leucocytes, < 1 nmol/10(9)
          cells, nor in erythrocytes, < 0.05 nmol/10(9) cells, of the B6-NPE- or B6-NPF PNP-deficient
          mice strains.
        supports: REFUTE
