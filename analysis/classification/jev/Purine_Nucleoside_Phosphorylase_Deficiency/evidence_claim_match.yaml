              label: purine nucleoside phosphorylase deficiency
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Newborn screening by TREC/KREC and dried-blood-spot tandem mass spectrometry
        description: Two complementary newborn-screening routes exist and the distinction matters. Tandem
          mass spectrometry on dried blood spots detects the purine metabolite signature directly and
          was the original route; TREC/KREC analysis detects the downstream T-cell lymphopenia and can
          also pick the disease up, as first reported in 2021. Because transplantation is curative but
          its success depends on being early - and because EBV-driven lymphoma before transplant is a
          documented cause of death - presymptomatic detection is unusually consequential here. A TREC-based
          screen may still miss milder or evolving disease, since it detects the consequence rather than
          the metabolic defect.
        diagnosis_term:
          preferred_term: newborn screening
          term:
            id: NCIT:C81178
            label: Newborn Screening
        results: Reduced TREC/KREC copy number and/or an abnormal dried-blood-spot purine profile prompt
          confirmatory enzyme and molecular testing.
      selected_evidence:
        snippet: Treatments are available and curative for PNP deficiency, but their efficacy depends
          on the early approach. PNP-combined immunodeficiency complies with the criteria for inclusion
          in a newborn screening program.
        supports: SUPPORT
