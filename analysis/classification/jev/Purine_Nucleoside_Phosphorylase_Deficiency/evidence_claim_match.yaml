        role: central_effector
        description: 'A distinct and more specific mechanism, established in PNP-knockout mice: dGTP accumulating
          within mitochondria inhibits mitochondrial DNA repair, so T cells become hypersensitive to the
          spontaneous mitochondrial DNA damage they would ordinarily tolerate. The knockout mice reproduce
          the human pattern - T lymphocytes affected more severely than B, impaired thymocyte differentiation,
          reduced peripheral T cells - and their T cells show increased apoptosis in vivo and heightened
          sensitivity to gamma irradiation in vitro. The irradiation-sensitivity phenotype is directly
          corroborated in human cells: lymphoblastoid B cells from a patient with absent PNP activity
          survived irradiation markedly less well than cells from partial-deficiency patients or healthy
          controls.'
