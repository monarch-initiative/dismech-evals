          name: Purine nucleoside phosphorylase deficiency
          disease_term:
            preferred_term: purine nucleoside phosphorylase deficiency
            term:
              id: MONDO:0013171
              label: purine nucleoside phosphorylase deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pnp-neurological-mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#CNS Purine Nucleotide Imbalance
        - pathophysiology#Neurological Dysfunction
        prompt: What causes the neurological disease in PNP deficiency? About two thirds of patients have
          spasticity, developmental delay or intellectual disability, and about a quarter present neurologically
          rather than with infection, yet no established mechanism links the enzymatic defect to neuronal
          dysfunction. The only mechanistic proposal in the literature - that depressed GTP levels may
          correlate with neurologic dysfunction - is offered as a possible correlation rather than a demonstrated
          pathway.
        rationale: 'Three observations make this a real gap rather than a missing citation. The neurological
          arm dissociates from the immunological one: patients are described with full immunodeficiency
          and autoimmunity but no neurological impairment. It is not corrected by the treatment that cures
          the immunodeficiency, since transplantation halts progression but does not reverse established
          disease. And the partial-deficiency siblings, with 8-11% residual activity, had entirely normal
          neurological development, which implies a threshold effect but says nothing about the mechanism
          below it. The clinical stake is direct: if the neurological injury is a prenatal or early-postnatal
          process, then newborn screening and very early transplantation would be the intervention, whereas
          if it is an ongoing metabolic toxicity then enzyme- or substrate-directed therapy able to cross
          the blood-brain barrier would be needed, since donor haematopoietic cells largely do not.'
        proposed_experiments:
        - experiment_id: pnp-cns-purine-timing
          name: CSF purine profiling and neuroimaging across the PNP activity range
          description: Measure CSF purine nucleoside and nucleotide profiles alongside serial neuroimaging
            in patients spanning the full range of residual PNP activity, including pre- and post-transplant
            timepoints, to establish whether CNS purine imbalance tracks neurological severity, whether
            it is corrected by transplantation, and at what developmental stage the injury is established.
          readouts:
          - name: CSF purine metabolite levels versus neurological severity and PNP activity
            target: pathophysiology#CNS Purine Nucleotide Imbalance
          would_support:
          - pathophysiology#CNS Purine Nucleotide Imbalance
          - pathophysiology#Neurological Dysfunction
      selected_evidence:
        snippet: Depressed GTP levels may correlate with neurologic dysfunction.
        supports: SUPPORT
