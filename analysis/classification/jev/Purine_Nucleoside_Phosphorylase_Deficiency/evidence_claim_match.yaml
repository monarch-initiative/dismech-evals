        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SAMHD1-Dependent Synthetic Lethality in Developing T Cells
        biological_scale: MOLECULAR
        role: modifier
        description: The T-cell arm is not simply dGTP toxicity but a gene-interaction effect. During
          T-cell development, PNP inactivation is synthetically lethal with downregulation of the dNTP
          triphosphohydrolase SAMHD1 - the enzyme that would otherwise dispose of excess dNTPs. Developing
          thymocytes physiologically downregulate SAMHD1, so they lose the very safeguard that would protect
          them from an accumulating dNTP load, which is a second and more specific explanation for why
          the disease targets the developing T-cell compartment. The interaction requires deoxycytidine
          kinase activity and is antagonised by microenvironmental deoxycytidine, so it is in principle
          a modifiable dependency.
        cell_types:
        - preferred_term: thymocyte
          term:
            id: CL:0000893
            label: thymocyte
      selected_evidence:
        snippet: During T cell development, PNP inactivation is synthetically lethal with downregulation
          of the dNTP triphosphohydrolase SAMHD1.
        supports: SUPPORT
