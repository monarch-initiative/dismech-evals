      assertion_type: Pathophysiology
      assertion:
        name: Loss of Purine Nucleoside Phosphorolysis
        biological_scale: MOLECULAR
        role: central_effector
        description: PNP catalyses the phosphorolysis of inosine, guanosine, deoxyinosine and deoxyguanosine
          in the purine salvage pathway. Losing that step blocks the route from these nucleosides onward
          to hypoxanthine, xanthine and ultimately uric acid, and leaves the substrates to accumulate.
          The disease is therefore driven by what builds up behind the block rather than by any product
          the cell fails to make.
        molecular_functions:
        - preferred_term: purine-nucleoside phosphorylase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0004731
            label: purine-nucleoside phosphorylase activity
        biological_processes:
        - preferred_term: purine nucleoside catabolic process
          modifier: DECREASED
          term:
            id: GO:0006152
            label: purine nucleoside catabolic process
      selected_evidence:
        snippet: Purine nucleoside phosphorylase (PNP) is a key enzyme in the purine salvage pathway.
        supports: SUPPORT
