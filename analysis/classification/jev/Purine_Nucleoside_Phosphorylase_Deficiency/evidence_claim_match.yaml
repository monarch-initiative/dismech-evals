        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intracellular dGTP Pooling in Lymphoid Cells
        biological_scale: MOLECULAR
        role: central_effector
        description: 'Deoxyguanosine is phosphorylated to dGTP, which pools to toxic concentrations preferentially
          in lymphoid cells. The tissue selectivity is the crux of the disease and has a simple explanation:
          PNP is expressed in most tissues but at its highest levels in lymphoid tissue, so lymphoid cells
          carry the largest flux through the missing step and the largest substrate burden when it fails.
