      assertion_type: Diagnosis
      assertion:
        name: Lymphocyte subset enumeration and immune function testing
        description: T, B and NK cell counts with immunoglobulins and proliferation responses. Two traps
          are worth recording. Serum immunoglobulins are frequently normal or only slightly reduced, so
          normal immunoglobulins do not exclude the diagnosis. And T-cell counts may be normal at birth
          and decline with time or fluctuate, because the defect is progressive attritional apoptosis
          rather than a developmental block - so a single normal result is not exclusionary either.
        diagnosis_term:
          preferred_term: immunophenotyping
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
