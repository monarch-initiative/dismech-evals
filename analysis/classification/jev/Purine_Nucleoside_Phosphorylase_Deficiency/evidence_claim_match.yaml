      assertion_type: Pathophysiology
      assertion:
        name: Unrestrained TLR7 Signalling by Guanosine Nucleoside Ligands
        biological_scale: MOLECULAR
        role: central_effector
        description: 'This node resolves what would otherwise be the central paradox of the disease: how
          a profound T-cell immunodeficiency produces autoimmunity in a third of patients. PNP does not
          have one immunological job but two, in different lineages. In B lymphocytes and macrophages
          it controls the levels of the (deoxy)guanosine nucleosides that are the ligands of Toll-like
          receptor 7, so losing PNP removes a brake on innate nucleic-acid sensing. Overriding that brake
          drives germinal centre formation in the absence of any exogenous antigen and accelerates disease
          in a mouse autoimmunity model. Autoimmunity in PNP deficiency is therefore not merely the passive
          consequence of failed T-cell regulation - it has its own positive, lineage-specific mechanism
          running in parallel.'
        biological_processes:
        - preferred_term: toll-like receptor 7 signaling pathway
          modifier: INCREASED
          term:
            id: GO:0034154
            label: toll-like receptor 7 signaling pathway
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
      selected_evidence:
        snippet: In B lymphocytes and macrophages, PNP regulates Toll-like receptor 7 signaling by controlling
          the levels of its (deoxy)guanosine nucleoside ligands.
        supports: SUPPORT
