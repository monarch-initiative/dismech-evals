        biological_scale: CELLULAR
        role: central_effector
        description: Elevated dGTP allosterically inhibits ribonucleotide reductase, the enzyme that supplies
          deoxyribonucleotides for DNA synthesis. The consequence is distorted dNTP pools and impeded
          cell division, which falls hardest on the rapidly proliferating thymocyte compartment. This
          is the classical explanation for the immunodeficiency and the direct mechanistic parallel with
          adenosine deaminase deficiency, where accumulated dATP acts on the same enzyme.
        biological_processes:
        - preferred_term: DNA replication
          modifier: DECREASED
          term:
