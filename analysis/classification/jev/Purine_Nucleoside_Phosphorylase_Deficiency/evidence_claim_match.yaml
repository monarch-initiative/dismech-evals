              label: purine nucleoside phosphorylase deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Allogeneic haematopoietic stem cell transplantation
        description: 'The only available cure. Replacing the patient''s haematopoietic system with PNP-competent
          donor cells restores enzyme activity in the lymphoid compartment where the substrate burden
          is greatest, giving durable immune reconstitution. Reported outcomes are good when transplantation
          is performed in time - three of four patients in one Israeli series achieved good immune reconstitution
          over 8 to 108 months of follow-up with excellent neurological outcomes - but the qualifier matters:
          the fourth patient died of EBV-related lymphoma before transplant, and in a Turkish series a
          patient was lost to veno-occlusive disease after transplant. Neurological disease already established
          is not reliably reversed, though post-transplant series report no further deterioration.'
        treatment_term:
          preferred_term: Hematopoietic Cell Transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
        therapeutic_modality: CELL_THERAPY
      selected_evidence:
        snippet: HSCT offers a good treatment option, with excellent clinical outcomes, when preformed
          in a timely manner.
        supports: SUPPORT
