      assertion_type: Pathophysiology
      assertion:
        name: GSDMD-Dependent NETosis
        biological_scale: CELLULAR
        description: 'Activated neutrophils release neutrophil extracellular traps (NETs) — decondensed
          chromatin studded with granule proteins — by a process regulated by gasdermin D (GSDMD), whose
          pores release neutrophil elastase and myeloperoxidase during early NETosis. Serum NET levels
          (MPO-DNA complexes) are elevated in PG patients versus healthy controls and fall after effective
          treatment. This is the effector cell-death programme of the neutrophilic arm and the node the
          only available PG animal model addresses: GSDMD-knockout mice develop significantly less severe
          ulcers in the PG-serum transfer model. It amplifies the surrounding cytokine milieu, feeding
          back on the inflammatory response.'
        cell_types:
        - preferred_term: Neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        biological_processes:
        - preferred_term: Neutrophil extracellular trap formation
          term:
            id: GO:0140645
            label: neutrophil extracellular trap formation
          modifier: INCREASED
      selected_evidence:
        snippet: Neutrophil extracellular traps (NETs) represent one of the mechanisms of neutrophils
          activation, and gasdermin D (GSDMD) plays a regulatory role in NETs.
        supports: SUPPORT
