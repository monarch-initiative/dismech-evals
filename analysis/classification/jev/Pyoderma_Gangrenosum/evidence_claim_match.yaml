        description: 'The classic and by far most common variant: a deep, rapidly enlarging, exquisitely
          painful ulcer with an undermined, irregular, erythematous-violaceous border, most often on the
          lower leg, healing with a cribriform ("wrinkled paper") scar. This is the variant for which
          the Delphi consensus diagnostic criteria and the PARACELSUS score were developed and validated.
          MONDO:0035235 carries "Ulcerative pyoderma gangrenosum" as an exact synonym, which is why this
          subtype is named Ulcerative here.'
        subtype_frequency: 'Predominant variant: 62 of 67 patients (93%) in a Japanese multicentre adalimumab
          cohort had ulcerative PG.'
      selected_evidence:
        snippet: The PG subtypes among the enrolled patients were ulcerative (n = 62), pustular (n = 2),
          vegetative (n = 2), and bullous (n = 1).
