              label: pyoderma gangrenosum
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: JAK-STAT Pathway Overactivation
        biological_scale: MOLECULAR
        description: The JAK/STAT pathway is the common downstream transducer for most of the cytokines
          this entry already models (IL-6, IL-12, IL-23, interferons), and single-cell RNA sequencing
          with multiplex immunohistochemistry shows it significantly overactivated in PG lesions — particularly
          in advanced-stage lesions — driven chiefly by myeloid cells and T cells. The activation is associated
          with enhanced NET formation in myeloid cells and with aberrant Th17 / Th17.1 differentiation
          and plasticity, so it converges on two nodes already in this pathograph. Independent multi-omics
          work identifies JAK2 and STAT3 as the network hubs of an inflammatory module conserved between
          PG skin and IBD gut, which is the molecular candidate for the gut-skin axis behind PG's commonest
          systemic association. This node is the rationale for JAK inhibition (tofacitinib, baricitinib),
          which remains investigational.
        cell_types:
        - preferred_term: Myeloid cell
          term:
            id: CL:0000763
            label: myeloid cell
        - preferred_term: T-helper 17 cell
          term:
            id: CL:0000899
            label: T-helper 17 cell
        biological_processes:
        - preferred_term: JAK-STAT cascade
          term:
            id: GO:0007259
            label: cell surface receptor signaling pathway via JAK-STAT
          modifier: INCREASED
      selected_evidence:
        snippet: We identified significant overactivation of the JAK/STAT pathway in PG lesions-particularly
          in advanced stages-which, in terms of immune inflammation, is primarily driven by myeloid cells
          and T cells.
        supports: SUPPORT
