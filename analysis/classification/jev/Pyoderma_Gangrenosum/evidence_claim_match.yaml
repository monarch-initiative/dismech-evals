        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pg_trial_attrition
        kind: INTERPRETATION
        status: OPEN
        prompt: Why has every late-phase targeted trial in pyoderma gangrenosum failed or been terminated,
          and what does that imply for how this entry's mechanism nodes should be read?
        rationale: 'The curated trial record is dominated by attrition, and that negative pattern is itself
          the curated fact rather than an absence of data. Of the nine trials in this entry, five are
          terminated: all three gevokizumab (anti-IL-1beta) registrations (NCT02315417, NCT02326740, NCT02318914),
          the vilobelimab (anti-C5a) Phase III NCT05964413 — explicitly stopped for futility — and the
          spesolimab Phase II NCT06092216, which is the one non-futility termination (the sponsor redirected
          to a multicentre trial). Only infliximab (placebo-controlled, positive) and STOP GAP (prednisolone
          versus ciclosporin, no difference) reached informative completion, and adalimumab is approved
          on an open-label single-arm Phase 3.

          Three non-exclusive readings are worth holding open. (1) Mechanistic redundancy: the pathograph
          has multiple parallel neutrophil-recruiting inputs (C5a, IL-8/CXCL8, CXCL1/2/3, IL-36), so blocking
          any single one may be insufficient — the C5a primary paper anticipates exactly this. (2) Trial-design
          difficulty: PG had no validated diagnostic criteria until 2018 and still has no validated response
          criteria, so cohorts may be heterogeneous and endpoints insensitive; the Delphi authors give
          patient selection for trials as an explicit motivation for their criteria. (3) The mechanism
          nodes may be correct as descriptions of the inflammatory state while being wrong as rate-limiting
          therapeutic targets — a node can be genuinely active in disease and still not be the lever.

          Curation consequence: no targeted agent in this entry may be presented as established therapy
          on mechanistic grounds alone. The IL-1 blockade and C5a blockade treatments both carry explicit
          negative qualifiers for this reason.'
        attaches_to:
        - pathophysiology#Complement C5a Generation and C5aR1 Signalling
        - pathophysiology#Inflammasome Activation and IL-1 Overproduction
      selected_evidence:
        snippet: Low-evidence studies and a lack of validated diagnostic and response criteria have hindered
          the discovery and validation of new effective treatments for pyoderma gangrenosum.
        supports: SUPPORT
