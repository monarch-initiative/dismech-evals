      assertion_type: Definition
      assertion:
        name: Delphi consensus diagnostic criteria for ulcerative pyoderma gangrenosum
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        validation_status:
          status: VALIDATED_AGAINST_GOLD_STANDARD
          rationale: Criteria were validated against peer-reviewed established cases of pyoderma gangrenosum
            and mimickers using k-fold cross-validation with multiple imputation. Receiver operating characteristic
            analysis showed that requiring 4 of 8 minor criteria maximized discrimination, giving sensitivity
            86% and specificity 90%.
        description: 'An international Delphi consensus (RAND/UCLA Appropriateness Method) yielding one
          major criterion — biopsy of the ulcer edge demonstrating a neutrophilic infiltrate — plus eight
          minor criteria: exclusion of infection; pathergy; history of inflammatory bowel disease or inflammatory
          arthritis; history of a papule, pustule, or vesicle ulcerating within 4 days of appearing; peripheral
          erythema, undermining border, and tenderness at the ulceration site; multiple ulcerations with
          at least one on an anterior lower leg; cribriform or "wrinkled paper" scars at healed ulcer
          sites; and decreased ulcer size within 1 month of starting immunosuppressive therapy. The major
          criterion plus at least 4 minor criteria supports the diagnosis. Scope is explicitly the ULCERATIVE
          variant; it is not validated for bullous, pustular, or vegetative PG.'
        scope: Ulcerative pyoderma gangrenosum
        criteria_sets:
        - name: Major criterion
          minimum_required: 1
          description: Biopsy of the ulcer edge demonstrating a neutrophilic infiltrate.
        - name: Minor criteria
          minimum_required: 4
          description: Four or more of the eight minor criteria are required alongside the major criterion.
      selected_evidence:
        snippet: '8 minor criteria: (1) exclusion of infection; (2) pathergy; (3) history of inflammatory
          bowel disease or inflammatory arthritis'
        supports: SUPPORT
