      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: infectious_etiology
        hypothesis_label: Infectious etiology (historical, refuted)
        status: DEPRECATED
        description: The name "pyoderma gangrenosum" encodes a historical hypothesis that the disease
          is a pyogenic infection producing gangrene. Both halves are wrong. PG was initially thought
          to be an infectious disease and was subsequently reclassified as an inflammatory one; the lesion
          is sterile, culture is negative, exclusion of infection is a formal minor criterion of the validated
          Delphi definition, and the disease responds to immunosuppression rather than to antibiotics.
          This hypothesis is curated explicitly, rather than silently omitted, because the misnomer actively
          misleads — it is why PG ulcers are debrided as though infected, which triggers pathergy.
      selected_evidence:
        snippet: Initially, PG was thought to be an infectious disease and was later corrected to be an
          inflammatory skin disease.
        supports: REFUTE
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/0
