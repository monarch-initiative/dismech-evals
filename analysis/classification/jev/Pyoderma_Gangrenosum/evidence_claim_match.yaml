            term:
              id: MONDO:0018824
              label: pyoderma gangrenosum
        context: []
      assertion_type: Genetic
      assertion:
        name: JAK2
        notes: 'JAK2 appears in the PG genetic literature from two independent directions. A systematic
          review of 208 articles describing 823 PG cases found two patients with JAK2 mutations (and two
          with MTHFR) — a very small share, so this is curated as a rare reported association, not a common
          determinant. Separately, computational multi-omics analysis identifies JAK2 (with STAT3) as
          a network hub of the inflammatory module shared between PG and IBD, and JAK2 is the target of
          the JAK inhibitors curated as investigational treatment. SCOPE CAUTION: the systematic review
          reports "mutations in JAK2" without specifying the allele or its somatic/germline origin, so
          this entry deliberately does NOT assert JAK2 V617F or a SOMATIC `variant_origin`, despite V617F
          being the canonical JAK2 allele in the myeloproliferative neoplasms that constitute part of
          PG''s hematologic association. Asserting it would go beyond the cited sources.'
        gene_term:
          preferred_term: JAK2
          term:
            id: hgnc:6192
            label: JAK2
        relationship_type: SUSCEPTIBILITY
      selected_evidence:
        snippet: Two patients had mutations in MTHFR and two had mutations in JAK2.
        supports: SUPPORT
