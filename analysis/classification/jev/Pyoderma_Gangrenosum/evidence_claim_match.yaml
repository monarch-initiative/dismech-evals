      assertion:
        name: Exclusion of mimickers and the misdiagnosis rate
        description: 'Rigorous exclusion of alternative causes of severe cutaneous ulceration is the substance
          of the diagnosis, and the cost of getting it wrong is measurable: in a consecutive series, 15
          of 157 patients (10%) treated for presumed PG had another diagnosis — vascular occlusive or
          venous disease, vasculitis, cancer, primary infection, drug-induced or exogenous tissue injury,
          or another inflammatory disorder. Among misdiagnosed patients whose course was documented, 12%
          had ulcers actively exacerbated by PG-directed treatment, which is the clinical harm this exclusion
          step exists to prevent.'
      selected_evidence:
        snippet: These 64 included 15 of the 157 consecutive patients treated for pyoderma gangrenosum
          at our institution (10 percent).
        supports: SUPPORT
