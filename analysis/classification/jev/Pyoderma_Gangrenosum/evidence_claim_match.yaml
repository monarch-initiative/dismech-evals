          therapeutic_agent:
          - preferred_term: clobetasol propionate
            term:
              id: CHEBI:31414
              label: clobetasol propionate
      selected_evidence:
        snippet: Topical therapy is potentially an effective first-line treatment for PG that avoids the
          possible side effects associated with systemic therapy.
        supports: SUPPORT
