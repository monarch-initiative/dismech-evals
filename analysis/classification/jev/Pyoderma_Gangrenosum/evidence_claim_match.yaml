          follicular-based onset of lesions as papules or pustules that then ulcerate, and the overlap
          of PG with other follicular neutrophilic diseases (acne, hidradenitis suppurativa) in the PASH/PAPASH
          spectrum. This is presented in the literature as increasingly recognized rather than established.
