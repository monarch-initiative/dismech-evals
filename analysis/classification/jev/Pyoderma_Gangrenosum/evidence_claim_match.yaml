      assertion_type: DifferentialDiagnosis
      assertion:
        name: Cutaneous infection and necrotizing soft tissue infection
        description: 'Infective ulceration is the critical exclusion, and misdiagnosis runs in both directions:
          an infected ulcer treated as PG with immunosuppression, or PG debrided as though it were necrotizing
          infection, which triggers pathergy. Exclusion of infection is a formal minor criterion in the
          Delphi definition; PG lesions are culture-negative and do not respond to antibiotics.'
        distinguishing_features:
        - 'Pyoderma gangrenosum: sterile/culture-negative, no response to antibiotics, worsens with debridement
          (pathergy), responds to immunosuppression'
        - 'Cutaneous/necrotizing infection: positive cultures, responds to antibiotics, requires surgical
          debridement'
      selected_evidence:
        snippet: '8 minor criteria: (1) exclusion of infection; (2) pathergy'
        supports: SUPPORT
