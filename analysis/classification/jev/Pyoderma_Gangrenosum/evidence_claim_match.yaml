      assertion_type: Phenotype
      assertion:
        category: Clinical
        name: Pathergy
        description: New lesions or marked enlargement of existing lesions at sites of minor trauma. Pathergy
          is a minor criterion in the Delphi consensus definition of ulcerative PG, is scored in the PARACELSUS
          instrument as localization of the lesion at a site of trauma, and underlies the clinical caution
          against debridement. A systematic review and meta-analysis of 21 studies (2611 patients) attributed
          PG onset to the pathergy phenomenon in 16.3% of cases.
        phenotype_term:
          preferred_term: Pathergy (new or enlarging lesion induced at a site of minor trauma)
        frequency: OCCASIONAL
        notes: 'Deliberately NOT bound to an ontology term. Pathergy is trauma-induced lesion INITIATION,
          not a lesion morphology; HPO has no term for it, and the nearest candidates are all misleading.
          This phenotype previously carried HP:0200042 (Skin ulcer), which discarded the semantic content
          and made it indistinguishable from the three other Skin ulcer annotations in this file. Per
          the dismech-terms rule that no term beats a misleading or too-general one, the free-text `preferred_term`
          stands alone. NEEDS TERM / candidate HPO new-term request (NTR): pathergy is a formal scored
          criterion in both the Delphi consensus definition and the PARACELSUS score, and also occurs
          in Behcet disease, so a dedicated HP term would be reused. Raised in the PR #9115 review.'
      selected_evidence:
        snippet: '8 minor criteria: (1) exclusion of infection; (2) pathergy; (3) history of inflammatory
          bowel disease or inflammatory arthritis'
        supports: SUPPORT
