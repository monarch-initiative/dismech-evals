      assertion_type: Treatment
      assertion:
        name: Topical corticosteroid therapy (clobetasol propionate)
        description: Topical therapy — most commonly clobetasol propionate 0.05%, sometimes topical tacrolimus
          — is a genuine first-line option for limited disease, not merely an adjunct. In a prospective
          cohort of 66 UK patients whose PG was judged suitable for topical treatment, 43.8% of ulcers
          healed by 6 months with a median time to healing of 145 days. It avoids the adverse effects
          of systemic immunosuppression, though whether more severe disease responds adequately to topical
          therapy alone remains unclear, and the study had no randomized comparator.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
