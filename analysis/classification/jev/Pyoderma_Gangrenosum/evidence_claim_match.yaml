  0ac59b93fc8e83d548a0e8381f64a2fb9b1f0b4f784f10ac3fc70377394664f4:
    claim:
      about:
        disease:
          name: Pyoderma Gangrenosum
          disease_term:
            preferred_term: Pyoderma gangrenosum
            term:
              id: MONDO:0018824
              label: pyoderma gangrenosum
        context: []
      assertion_type: Treatment
      assertion:
        name: Wound care, pain control and avoidance of debridement
        description: 'Concomitant topical therapy, wound management and pain control should always be
          addressed alongside systemic treatment. Critically, because of pathergy, surgical debridement
          and defect closure may exacerbate the injury, so aggressive debridement of an active PG ulcer
          is generally avoided and surgery — where required for reconstruction — is undertaken only under
          adequate immunosuppression. Note that the peristomal cohort reported high resolution rates with
          surgical intervention (80%), so the caution is against reflexive debridement of misdiagnosed
          active disease rather than an absolute prohibition on surgery. A retrospective inpatient series
          makes the same point from the other direction: all three patients who underwent split skin grafting
          under immunosuppressive cover had no postoperative graft failure or pathergy, and the authors
          conclude surgery should be considered alongside immunosuppressive (and hyperbaric) therapy once
          disease is quiescent. The operative principle is therefore "not on active disease without cover",
          not "never".'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: In addition, concomitant topical pharmacologic therapy, wound management and pain control
          should always be addressed.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/8
      evidence_path: /treatments/8/evidence/0
