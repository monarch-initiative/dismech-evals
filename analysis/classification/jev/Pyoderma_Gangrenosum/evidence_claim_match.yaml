      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: autoinflammatory_neutrophil_model
        hypothesis_label: Autoinflammatory inflammasome/IL-1-driven neutrophil recruitment
        status: CANONICAL
        description: Pyoderma gangrenosum is modeled as an autoinflammatory disease of the innate immune
          system rather than an infection or a classical autoantibody-mediated autoimmune disease. Exaggerated
          inflammasome activation in genetically predisposed individuals drives interleukin-1 overproduction,
          which — amplified by a T helper 17/T helper 1-skewed adaptive layer supplying TNF, IL-8, IL-17,
          IL-23 and IL-36 — recruits and activates neutrophils into the dermis, producing the sterile
          neutrophil-dominant infiltrate that destroys tissue and yields the characteristic ulcer. Direct
          protein-array measurement in PG lesional skin supports the framework, but the primary literature
          is explicit that the exact pathogenesis is not yet fully understood.
      selected_evidence:
        snippet: Over-expression of cytokines/chemokines and molecules amplifying the inflammatory network
          supports the view that PG and SS are autoinflammatory diseases.
        supports: SUPPORT
