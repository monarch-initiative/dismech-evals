      assertion_type: Pathophysiology
      assertion:
        name: Pathergy - Trauma-Induced Lesion Initiation
        biological_scale: TISSUE
        description: 'Pathergy is the induction of new lesions, or the marked enlargement of existing
          ones, at sites of minor cutaneous trauma — needle sticks, biopsies, surgical incisions, or chronic
          mechanical irritation such as an ostomy appliance. Mechanistically it represents a lowered threshold
          for triggering the neutrophilic inflammatory cascade in already primed skin, so trauma locally
          initiates the same pathway rather than causing a distinct process. This node is clinically load-bearing
          rather than merely descriptive: it is why surgical debridement and defect closure can exacerbate
          the injury, and why postsurgical pyoderma gangrenosum is a recognized entity. Pathergy is a
          minor criterion in the Delphi consensus definition and appears in the PARACELSUS score as localization
          of the lesion at a site of trauma.'
      selected_evidence:
        snippet: extreme pain > 4/10 on a visual analogue scale and localization of lesion at the site
          of the trauma
        supports: SUPPORT
