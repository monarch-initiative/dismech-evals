          modifier: INCREASED
        - preferred_term: Complement component C5a signaling pathway
          term:
            id: GO:0038178
            label: complement component C5a signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: The average C5a level in PG wound fluid (8.5 ng/mg, n=32) was more than 6-fold higher
          (P=0.0001) than the average level of C5a in wound fluid from traumatic wounds (1.3 ng/mg, n=13)
        supports: SUPPORT
