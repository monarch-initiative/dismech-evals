      assertion_type: Diagnosis
      assertion:
        name: Positive diagnosis using validated scoring systems
        description: 'Pyoderma gangrenosum was historically a diagnosis of exclusion, a status explicitly
          criticized as incompatible with clinical decision making and trial recruitment. Two validated
          instruments now permit a positive diagnosis: the Delphi consensus criteria for ulcerative PG
          (one major criterion plus at least 4 of 8 minor criteria) and the PARACELSUS score (a 10-criterion
          score, with 10 or more points indicating high likelihood). Exclusion of infection and consideration
          of relevant differential diagnoses remain formal components of both instruments rather than
          being superseded by them.'
      selected_evidence:
        snippet: Despite the limited understanding of the pathogenesis, it is no longer a diagnosis of
          exclusion, as it can now be made on the basis of validated scoring systems.
        supports: SUPPORT
