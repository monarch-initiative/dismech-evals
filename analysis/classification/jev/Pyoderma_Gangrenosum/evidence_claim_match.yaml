        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pg_papa_entity_boundary
        kind: INTERPRETATION
        status: OPEN
        prompt: How should the boundary between sporadic pyoderma gangrenosum and the monogenic PAPA/PASH/PAPASH
          spectrum be modeled?
        rationale: PSTPIP1-driven PAPA syndrome (MONDO:0011462) provides the clean Mendelian demonstration
          that inflammasome-dependent IL-1beta overproduction can cause pyoderma gangrenosum, and PG is
          PAPA's cutaneous hallmark. But common sporadic PG is not a Mendelian disease and no causal gene
          is asserted for it here. This entry therefore curates PSTPIP1 as a mechanism-anchoring MODIFIER-typed
          gene rather than a causal gene of sporadic PG, and models the monogenic arm as an upstream pathophysiology
          node feeding the shared IL-1 node. PAPA syndrome itself remains an open curation stub and should
          be curated as its own Disease entry rather than folded in here; the PASH (PG, acne, suppurative
          hidradenitis) and PAPASH extensions overlap the existing Hidradenitis_Suppurativa entry and
          are likewise out of scope.
        attaches_to:
        - pathophysiology#PSTPIP1 Dysfunction (Monogenic PAPA Arm)
      selected_evidence:
        snippet: is a clear molecular feature of PAPA syndrome
        supports: SUPPORT
