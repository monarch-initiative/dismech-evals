        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pg_pathogenesis_knowledge_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the initiating trigger of sporadic pyoderma gangrenosum, and is there an animal
          model that reproduces the integrated disease rather than one effector arm?
        rationale: 'Contemporary reviews state explicitly that the exact pathogenesis of pyoderma gangrenosum
          is not yet fully understood. The upstream trigger of sporadic disease is unknown and the follicular
          unit is only "increasingly recognized" as a putative initial target. An animal model now exists
          and is curated here (the PG-serum transfer mouse), but it reproduces the NETosis effector arm
          rather than the integrated syndrome: ulcers are induced by passive serum transfer, and the model
          shows neither pathergy, the undermined violaceous border, cribriform scarring, the associated
          systemic diseases, nor corticosteroid/ciclosporin responsiveness. So the gap is narrower than
          it was but not closed. Mechanistic understanding otherwise rests on human cohort, tissue and
          cytokine studies plus extrapolation from the monogenic PAPA arm. The low-evidence base is itself
          called out in the literature as having hindered discovery and validation of new treatments.
          The complement C5a/C5aR1 and MMP-2/MMP-9 effector arms previously tracked here as uncurated
          enrichment targets have since been curated as full nodes from primary sources, so they are no
          longer gaps. What remains genuinely open is upstream and therapeutic rather than descriptive:
          what initiates complement activation and inflammasome priming in sporadic PG in the first place,
          and why a pathograph this well characterized has yielded no successful targeted therapy — see
          `pg_trial_attrition`.'
        attaches_to:
        - pathophysiology#Inflammasome Activation and IL-1 Overproduction
      selected_evidence:
        snippet: Low-evidence studies and a lack of validated diagnostic and response criteria have hindered
          the discovery and validation of new effective treatments for pyoderma gangrenosum.
        supports: SUPPORT
