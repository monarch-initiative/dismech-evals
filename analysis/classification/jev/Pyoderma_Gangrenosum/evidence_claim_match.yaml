            name: Vegetative
            display_name: Vegetative (superficial granulomatous) pyoderma gangrenosum
            subtype_term:
              preferred_term: Vegetative (superficial granulomatous) pyoderma gangrenosum
              term:
                id: MONDO:0035238
                label: vegetative pyoderma gangrenosum
            description: 'A localized, superficial and more indolent variant, recognized both by MONDO
              as a distinct child concept and in clinical cohorts alongside the ulcerative, bullous and
              pustular forms, where it is uncommon (2 of 67 patients in a prospective multicentre series).
              Its milder course has a measured mechanistic correlate: myeloperoxidase, IL-8 and MMP-9
              are expressed significantly less in vegetative PG than in the ulcerative and bullous variants,
              i.e. less neutrophil-effector and MMP-mediated matrix destruction.'
            subtype_frequency: 'Uncommon: 2 of 67 patients (3%) in a Japanese multicentre adalimumab cohort.'
          role: subtype
      assertion_type: Phenotype
      assertion:
        category: Clinical
        name: Superficial less-destructive vegetative lesion
        subtype: Vegetative
        description: 'The vegetative variant produces a more superficial, indolent and less destructive
          lesion than classic ulcerative or bullous PG. This is not only a clinical impression: immunohistochemistry
          shows myeloperoxidase, IL-8 and MMP-9 — the neutrophil marker, the neutrophil chemoattractant,
          and the tissue-damaging proteinase respectively — expressed significantly less in vegetative
          PG than in ulcerative and bullous PG, giving the milder phenotype a measured mechanistic correlate
          in reduced MMP-mediated matrix destruction.'
        phenotype_term:
          preferred_term: Superficial vegetative cutaneous lesion
          term:
            id: HP:0200042
            label: Skin ulcer
      selected_evidence:
        snippet: Myeloperoxidase (neutrophil marker), IL-8 (cytokine chemotactic for neutrophils) and
          MMP-9 (proteinase-mediating tissue damage) were expressed more significantly in both ulcerative
          and bullous PG than in vegetative PG as well as in Sweet's syndrome
        supports: SUPPORT
