      assertion:
        name: PARACELSUS score
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        validation_status:
          status: VALIDATED_AGAINST_GOLD_STANDARD
          rationale: Developed and assessed retrospectively against 60 participants with previously confirmed
            PG of the lower extremity and a control cohort of 50 patients with venous leg ulcers, evaluated
            by expert teams at two tertiary wound-care centres. A total score of 10 or more points indicates
            high likelihood of PG and discriminates PG from venous leg ulcers. The control group was venous
            leg ulcers specifically, so discrimination against other mimickers is not established by this
            study.
        description: 'A 10-criterion diagnostic score whose criteria initials form the acronym PARACELSUS.
          Three major criteria: rapidly progressing disease, assessment of relevant differential diagnoses,
          and a reddish-violaceous wound border (present in 98% of PG patients). Four minor criteria (evident
          in 61-95% of patients): amelioration by immunosuppressant drugs, characteristically irregular
          ulcer shape, extreme pain above 4/10 on a visual analogue scale, and localization of the lesion
          at the site of trauma (pathergy). Three additional criteria (up to 60% of patients): suppurative
          inflammation on histopathology, undermined wound borders, and an associated systemic disease.
          Unlike the Delphi criteria it does not require a biopsy, which is useful when biopsy itself
          risks pathergy.'
        criteria_sets:
        - name: Major criteria
          description: Rapidly progressing disease; assessment of relevant differential diagnoses; reddish-violaceous
            wound border.
        - name: Minor criteria
          description: Amelioration by immunosuppressant drugs; irregular ulcer shape; extreme pain >
            4/10 on a visual analogue scale; localization at a site of trauma.
        - name: Additional criteria
          description: Suppurative inflammation on histopathology; undermined wound borders; associated
            systemic disease.
      selected_evidence:
        snippet: The three major diagnostic criteria are rapidly progressing disease, assessment of relevant
          differential diagnoses and a reddish-violaceous wound border (prevalent in 98% of patients with
          PG).
        supports: SUPPORT
