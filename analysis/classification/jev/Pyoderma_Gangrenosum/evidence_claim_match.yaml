          gangrenosum is the cutaneous hallmark, by disrupting binding to PEST-type protein tyrosine phosphatase
          and dysregulating inflammasome-dependent IL-1beta production. PSTPIP1 is the causal gene of
          the monogenic PAPA/PASH/PAPASH spectrum rather than of common sporadic pyoderma gangrenosum,
          which is not a Mendelian disease; it is curated here because it anchors the IL-1 mechanism,
          not as a cause of sporadic PG. Typed MODIFIER for that reason.
