        description: 'A localized, superficial and more indolent variant, recognized both by MONDO as
          a distinct child concept and in clinical cohorts alongside the ulcerative, bullous and pustular
          forms, where it is uncommon (2 of 67 patients in a prospective multicentre series). Its milder
          course has a measured mechanistic correlate: myeloperoxidase, IL-8 and MMP-9 are expressed significantly
          less in vegetative PG than in the ulcerative and bullous variants, i.e. less neutrophil-effector
          and MMP-mediated matrix destruction.'
        subtype_frequency: 'Uncommon: 2 of 67 patients (3%) in a Japanese multicentre adalimumab cohort.'
