          most conspicuously at the advancing ulcer edge, and destroys dermal tissue. Over-expressed Fas/Fas
          ligand and CD40/CD40 ligand systems contribute to that tissue damage in PG. The absence of a
          causative organism is central: the inflammation is aseptic, which is why antibiotics do not
          resolve the lesion and why exclusion of infection is a formal diagnostic criterion. Biopsy of
          the ulcer edge demonstrating a neutrophilic infiltrate is the single major criterion in the
          Delphi consensus definition.'
