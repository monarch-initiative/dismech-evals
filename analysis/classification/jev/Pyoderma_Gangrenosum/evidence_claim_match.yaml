      assertion_type: Treatment
      assertion:
        name: Complement C5a blockade (vilobelimab)
        description: 'Vilobelimab is a C5a-neutralizing monoclonal antibody targeting the complement node
          this entry models as the proximal driver of NETosis, and is the most direct test of that mechanism
          to date. IMPORTANT NEGATIVE QUALIFIER: the exploratory open-label Phase IIa trial (NCT03971643,
          OPTIMA) completed, but the subsequent randomised, double-blind, placebo-controlled Phase III
          trial in ulcerative PG (NCT05964413) was TERMINATED and the registry records the reason as futility.
          This treatment is curated because the target is mechanistically well evidenced in human PG wound
          fluid, NOT because efficacy is established — on current evidence it is a failed Phase III. Note
          the primary mechanistic paper itself anticipated a reason this might happen: C5a blockade alone
          may not suffice, because other neutrophil chemokines (IL-8, CXCL2) are independently over-expressed
          in PG lesional skin.'
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
