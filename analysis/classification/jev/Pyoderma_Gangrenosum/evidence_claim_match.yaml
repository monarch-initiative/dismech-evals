              label: pyoderma gangrenosum
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pg_biopsy_diagnostic_utility
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is biopsy of the ulcer edge genuinely required for the diagnosis of pyoderma gangrenosum,
          given that it is the sole major Delphi criterion yet is nonspecific, insensitive, and itself
          risks pathergy?
        rationale: 'This entry curates the ulcer-edge neutrophilic infiltrate as `diagnostic: true` histopathology
          because it is the single MAJOR criterion of the validated Delphi definition. That position is
          genuinely contested and the tension is recorded here rather than silently resolved in favour
          of either side. Against it: histological findings in PG are nonspecific, a retrospective cohort
          found that of 58 patients only 26 (45%) were biopsied and only 10 of those (38%) had a biopsy
          that contributed to the diagnosis, and the biopsy procedure itself can trigger pathergy — the
          mechanism this entry models as a causal edge. The PARACELSUS score was deliberately designed
          not to require biopsy, which is part of its practical appeal. For it: exclusion of infection
          and of the many mimickers is essential, and 10% of patients treated for PG in a consecutive
          series turned out to have something else. The open question is not whether tissue is ever useful
          but whether a mandatory biopsy criterion improves or degrades net diagnostic accuracy once pathergy
          risk is priced in.'
        attaches_to:
        - pathophysiology#Pathergy - Trauma-Induced Lesion Initiation
      selected_evidence:
        snippet: Given risk of pathergy, nonspecific histopathological findings and low sensitivity, in
          our opinion, based on this small sample size, biopsies have limited diagnostic value for PG.
        supports: SUPPORT
