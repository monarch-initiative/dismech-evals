        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Sweet syndrome
        description: Sweet syndrome is the other prototypic neutrophilic dermatosis and shares the sterile
          dermal neutrophilic infiltrate, pathergy, and paraneoplastic potential, but produces abrupt
          tender edematous erythematous plaques and nodules that heal without scarring, rather than the
          deep, undermined, violaceous, cribriform-scarring ulcers of pyoderma gangrenosum. The two are
          kept as distinct dismech entities. Comparative protein-array profiling of the two diseases found
          chemokine-mediated signals lower in Sweet syndrome than in PG, which the authors propose explains
          PG's stronger local aggressiveness.
        distinguishing_features:
        - 'Pyoderma gangrenosum: painful ulcers with undermined violaceous borders, cribriform scarring,
          strong pathergy'
        - 'Sweet syndrome: abrupt tender edematous plaques/nodules with fever and neutrophilia, heal without
          scarring'
        disease_term:
          preferred_term: Sweet syndrome
          term:
            id: MONDO:0011959
            label: sweet syndrome
      selected_evidence:
        snippet: The differences in expression profile of inflammatory effectors between these two disorders
          may explain the stronger local aggressiveness in PG than SS.
        supports: SUPPORT
