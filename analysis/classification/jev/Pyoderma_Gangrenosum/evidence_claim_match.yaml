      assertion_type: Treatment
      assertion:
        name: JAK inhibition (tofacitinib, baricitinib)
        description: 'JAK inhibitors target the JAK/STAT node overactivated in PG lesions. In vitro, tofacitinib
          suppresses STAT phosphorylation in myeloid and T cells, myeloid NETosis, and IL-17A production
          — hitting three processes this pathograph models. Computational multi-omics work nominates baricitinib
          for the PG-IBD comorbid setting via the shared JAK2/STAT3 hub. EVIDENCE LEVEL: investigational
          only. Support is in vitro plus case reports and small series; the authors of the tofacitinib
          work describe their own evidence as preliminary, and the baricitinib nomination is a docking
          and systems-modelling prediction with no experimental validation. No controlled trial is curated,
          and no JAK inhibitor is approved for PG.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
