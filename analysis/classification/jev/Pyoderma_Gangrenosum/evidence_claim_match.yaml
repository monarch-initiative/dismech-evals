      assertion_type: Treatment
      assertion:
        name: Interleukin-1 blockade
        description: 'IL-1 inhibition (anakinra, an IL-1 receptor antagonist; canakinumab and gevokizumab,
          anti-IL-1beta antibodies) is a mechanism-directed therapy targeting the inflammasome/IL-1 node
          that is the proximal lesion in PG — IL-1 beta and its receptor I are directly over-expressed
          in PG lesional skin — and the proven molecular defect in PSTPIP1-driven PAPA syndrome. IMPORTANT
          NEGATIVE QUALIFIER: mechanistic rationale has not translated into demonstrated efficacy. All
          three registered gevokizumab (anti-IL-1beta) trials in PG were terminated (NCT02315417, NCT02326740
          and the open-label safety extension NCT02318914, all Phase 3), and the canakinumab study (NCT01302795)
          was an open-label Phase 2 pilot with no control arm. No randomised controlled trial has shown
          IL-1 blockade to be effective in PG. This treatment is therefore curated as a mechanistically
          motivated but unproven option, NOT as established therapy — see the `pg_trial_attrition` discussion.'
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: anakinra
            term:
              id: CHEBI:231683
              label: Anakinra
      selected_evidence:
        snippet: an increasing number of studies on the positive effects of biologic therapies such as
          inhibitors of tumour necrosis factor-α; interleukin-1, interleukin-17, interleukin-23 or complement
          factor C5a.
        supports: SUPPORT
        directness: INDIRECT
