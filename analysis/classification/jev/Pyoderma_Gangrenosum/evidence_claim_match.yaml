      assertion_type: Pathophysiology
      assertion:
        name: Complement C5a Generation and C5aR1 Signalling
        biological_scale: MOLECULAR
        description: 'Complement activation generates the anaphylatoxin C5a, which signals through its
          receptor C5aR1 on neutrophils. In pyoderma gangrenosum this is the named proximal driver of
          NET release: among the candidate inducers expressed in PG (IL-1 beta, IL-6, IL-8 and C5aR1),
          C5a is the most potent inducer of NETosis, acting dose-dependently within 30 minutes and specifically
          through C5aR1 and ERK — C5aR blockade with avacopan and ERK inhibition each abolish it. The
          axis is active in human disease, not only in culture: C5a in PG wound fluid is more than 6-fold
          higher than in traumatic wound fluid, at concentrations sufficient to induce NETosis, and correlates
          with neutrophil elastase levels. C5a is also a classical neutrophil chemoattractant, so it plausibly
          contributes to recruitment as well as to NET release; only the NETosis arm is modeled as a causal
          edge here.'
        cell_types:
        - preferred_term: Neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        biological_processes:
        - preferred_term: Complement activation
          term:
