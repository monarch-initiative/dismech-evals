      assertion:
        name: Solid malignancy is not an associated risk
        description: 'Despite solid malignancies appearing at 7.4% in the meta-analytic breakdown, a dedicated
          population-based cohort and case-control study found no association in either direction: the
          prevalence of preexisting solid malignancy was comparable in PG patients and matched controls,
          the odds of PG after a solid malignancy diagnosis were not increased, and PG patients were not
          more likely to develop one. The authors conclude that routine solid-malignancy screening in
          new-onset PG is unnecessary. This is curated as an explicit negative because the hematologic
          association is real and is easily over-generalized to malignancy as a whole.'
      selected_evidence:
        snippet: SM is not associated with provoking PG, and patients with PG are not at an increased
          risk of developing SM.
        supports: REFUTE
