      assertion:
        name: Adalimumab (anti-TNF biologic therapy)
        description: Adalimumab is a TNF-alpha inhibitor approved for pyoderma gangrenosum in Japan on
          the basis of the Phase 3 open-label trial NCT03311464. A 52-week multicentre prospective postmarketing
          observational study of 67 patients reported Physician Global Assessment (total lesions) scores
          of 0/1 in 36.0% at week 12, 46.2% at week 26 and 57.7% at week 52, with infections reported
          as adverse drug reactions in 14.9% and serious ADRs in 9.0%. Effectiveness was seen across PG
          subtypes and in patients on concomitant systemic steroids.
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
