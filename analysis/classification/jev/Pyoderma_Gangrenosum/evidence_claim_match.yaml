      assertion_type: Discussion
      assertion:
        discussion_id: pg_ibd_comorbidity_edge
        kind: INTERPRETATION
        status: OPEN
        prompt: Should the pyoderma gangrenosum-inflammatory bowel disease association be promoted to
          a structured comorbidity entry linking this entry to the existing Crohn_Disease and Ulcerative_Colitis
          entries?
        rationale: 'Inflammatory bowel disease is the single commonest systemic association of pyoderma
          gangrenosum (20.2% of patients in a UK population-based cohort), and PG appears reciprocally
          as an extraintestinal manifestation of IBD (1.2% of Crohn disease patients in a population-based
          study). PG is already curated as a phenotype inside Crohn_Disease.yaml. The Disease class has
          no comorbidities slot, so the relationship is recorded here rather than inline; a dedicated
          kb/comorbidities/ entry carrying the directional association and its EHR/cohort statistics is
          the natural follow-up, and is deliberately left out of scope of this entry''s creation PR.

          The mechanistic content of that future edge is now partly specified. A multi-omics study reports
          Mendelian-randomization evidence that IBD is a causal risk factor for PG (not merely correlated),
          identifies six shared genetic loci, and finds a cross-tissue conserved inflammatory module centred
          on JAK-STAT with JAK2 and STAT3 as hubs — giving the gut-skin axis a candidate molecular substrate
          and a shared druggable target. That study is entirely computational and says so, so the causal
          direction is curated here as a computational finding rather than as settled fact; it is the
          strongest available specification of what a PG-IBD comorbidity entry should assert, and the
          reason the `JAK-STAT Pathway Overactivation` node exists in this entry.'
      selected_evidence:
        snippet: The results revealed that genetic analysis confirmed IBD as a causal risk factor for
          PG, precisely identifying six shared genetic loci.
        supports: SUPPORT
