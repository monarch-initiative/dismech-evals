  782ab339ea3ca69d0048899fa1a7c94c88f486ca4ed758c308c8c65c9af3367e:
    claim:
      about:
        disease:
          name: Pyomyositis
          disease_term:
            term:
              id: MONDO:0019168
              label: pyomyositis
            preferred_term: Pyomyositis
        context: []
      assertion_type: Transmission
      assertion:
        name: Haematogenous seeding of skeletal muscle during transient bacteraemia
        description: 'Pyomyositis is a blood-borne infection of muscle, not a wound infection: by definition
          no adjacent skin, soft tissue or bone focus is present. Transient bacteraemia, usually staphylococcal,
          seeds muscle that has been recently injured, and the organism then grows there to form an abscess.
          The same route accounts for the disease in both the settings it is described in, the tropics
          and temperate high-income countries; where the two differ is in who is susceptible, which is
          recorded under `environmental:` and in the pathophysiology rather than here.'
      selected_evidence:
        snippet: Primary pyomyositis was defined as an intramuscular infection involving one or more of
          the skeletal muscle groups in the absence of adjacent skin, soft tissue, or bone infection
        supports: SUPPORT
    origin:
      assertion_path: /transmission/0
      evidence_path: /transmission/0/evidence/1
      context_paths:
