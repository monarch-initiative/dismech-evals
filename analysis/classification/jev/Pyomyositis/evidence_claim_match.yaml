      - /disease_term
    evidence_metadata:
      reference: PMID:29338140
      reference_title: 'Primary pyomyositis in North India: a clinical, microbiological, and outcome study.'
      evidence_source: HUMAN_CLINICAL
      explanation: The absence of a contiguous focus is part of the case definition, which is what leaves
