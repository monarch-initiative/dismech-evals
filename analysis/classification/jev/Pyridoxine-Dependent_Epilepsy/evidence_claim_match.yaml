          disease_term:
            preferred_term: pyridoxine-dependent epilepsy (ALDH7A1)
            term:
              id: MONDO:0020741
              label: pyridoxine-dependent epilepsy caused by ALDH7A1 mutant
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_pde_neurodevelopment_vs_seizure_dissociation
        prompt: Why do most individuals with pyridoxine-dependent epilepsy have persistent intellectual
          disability despite good seizure control on pyridoxine, and is the residual impairment caused
          by ongoing (or prenatal) toxic-metabolite exposure rather than by the seizures themselves?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Neurodevelopmental Impairment
        - pathophysiology#Accumulation of Alpha-AASA and P6C
        rationale: Pyridoxine reliably controls the seizures, yet about three-quarters of individuals
          have significant developmental delay or intellectual disability, a striking dissociation between
          seizure control and cognitive outcome. If the residual impairment is driven by continued accumulation
          of alpha-AASA and P6C (which pyridoxine does not lower), then adding metabolite-lowering therapy
          could improve development; if it reflects fixed prenatal injury, it would be largely irreducible.
          Resolving the driver is central to whether and how aggressively to pursue lysine-lowering treatment.
        proposed_experiments:
        - experiment_id: exp_pde_metabolite_vs_outcome
          name: Metabolite burden versus neurodevelopmental outcome
          description: In a PDE cohort, relate longitudinal alpha-AASA/P6C levels (on pyridoxine alone
            versus on added lysine-lowering therapy) to neurodevelopmental trajectory, testing whether
            lowering metabolites improves cognition.
          experiment_type:
            preferred_term: biomarker-outcome correlation experiment
          readouts:
          - name: Cognitive trajectory versus metabolite level
            target: pathophysiology#Neurodevelopmental Impairment
            assays:
            - preferred_term: neuropsychological assessment
            direction: POSITIVE
          controls:
          - name: Pyridoxine-only comparator
            description: Individuals on pyridoxine without metabolite-lowering therapy.
          decision_criterion: A metabolite-toxicity driver is supported if lower metabolite levels track
            with better neurodevelopmental outcome within the cohort.
          would_support:
          - pathophysiology#Accumulation of Alpha-AASA and P6C
      selected_evidence:
        snippet: 75% of individuals with PDE have significant developmental delay and intellectual disability
        supports: SUPPORT
    origin:
