            term:
              id: MONDO:0020741
              label: pyridoxine-dependent epilepsy caused by ALDH7A1 mutant
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_pde_triple_therapy_neurodevelopmental_benefit
        prompt: Does adjunct lysine-lowering therapy (dietary lysine restriction plus arginine supplementation
          added to pyridoxine) improve neurodevelopmental outcome, and which patients benefit most?
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        attaches_to:
        - pathophysiology#Accumulation of Alpha-AASA and P6C
        - pathophysiology#Neurodevelopmental Impairment
        rationale: Because pyridoxine does not reduce the accumulating lysine-pathway metabolites, a combined
          approach that lowers substrate flux (lysine restriction) and competes lysine transport (arginine)
          has been proposed to reduce alpha-AASA and P6C and thereby protect the developing brain. Early
          case series are encouraging but small and uncontrolled, so whether triple therapy meaningfully
          improves development, and the optimal timing and intensity, remains an open, actively investigated
          question.
        proposed_experiments:
        - experiment_id: exp_pde_triple_therapy_trial
          name: Controlled evaluation of triple therapy timing and intensity
          description: In a prospective, ideally controlled study, compare neurodevelopmental outcomes
            of pyridoxine alone versus pyridoxine plus lysine restriction and arginine, stratified by
            age at initiation, to define benefit and the treatment window.
          experiment_type:
            preferred_term: controlled treatment-comparison experiment
          readouts:
          - name: Developmental outcome by regimen and timing
            target: pathophysiology#Neurodevelopmental Impairment
            assays:
            - preferred_term: neuropsychological assessment
            direction: POSITIVE
          controls:
          - name: Pyridoxine-only arm
            description: Standard pyridoxine monotherapy as comparator.
          decision_criterion: The hypothesis is supported if adding lysine-lowering therapy improves developmental
            outcome versus pyridoxine alone, especially with earlier initiation.
          would_support:
          - pathophysiology#Neurodevelopmental Impairment
      selected_evidence:
        snippet: We describe a new combined therapeutic approach to reduce putative toxic metabolites
          from impaired lysine metabolism.
        supports: SUPPORT
