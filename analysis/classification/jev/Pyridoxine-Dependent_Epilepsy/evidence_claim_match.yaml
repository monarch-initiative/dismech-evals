          name: Pyridoxine-Dependent Epilepsy
          disease_term:
            preferred_term: pyridoxine-dependent epilepsy (ALDH7A1)
            term:
              id: MONDO:0020741
              label: pyridoxine-dependent epilepsy caused by ALDH7A1 mutant
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_pde_prenatal_onset_treatment_window
        prompt: Given the prenatal footprint of the disorder (fetal ventriculomegaly and abnormal fetal
          movements), is a substantial part of the neurodevelopmental injury incurred before birth, and
          could prenatal or immediate postnatal metabolite-lowering treatment prevent it?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Neurodevelopmental Impairment
        rationale: The phenotype can begin in utero, implying that toxic-metabolite exposure and cofactor
          deficiency may injure the brain before treatment can begin postnatally. If a meaningful fraction
          of the developmental deficit is prenatal, then the achievable benefit of any postnatal therapy
          is bounded, and prenatal or immediate-postnatal intervention (in known at-risk pregnancies)
          becomes the logical target. How much injury is prenatal versus postnatal, and whether early
          intervention changes outcome, is unresolved.
        proposed_experiments:
        - experiment_id: exp_pde_prenatal_injury_partition
          name: Partitioning prenatal versus postnatal injury
          description: Combine fetal/neonatal imaging and metabolite measurement with long-term outcome,
            and in at-risk pregnancies evaluate early (including prenatal maternal) lysine-lowering strategies,
            to estimate the prenatal injury fraction and whether early treatment alters outcome.
          experiment_type:
            preferred_term: prenatal-versus-postnatal injury partition experiment
          readouts:
          - name: Outcome by injury timing and early treatment
            target: pathophysiology#Neurodevelopmental Impairment
            assays:
            - preferred_term: neuropsychological assessment
            - preferred_term: magnetic resonance imaging assay
            direction: POSITIVE
          controls:
          - name: Postnatally-treated comparator
            description: Individuals treated only after birth.
          decision_criterion: A substantial prenatal-injury contribution is supported if outcome correlates
            with prenatal imaging/metabolite burden and is not fully rescued by postnatal treatment.
          would_support:
          - pathophysiology#Neurodevelopmental Impairment
      selected_evidence:
        snippet: from ventriculomegaly detected on foetal ultrasound, through abnormal foetal movements
          and a multisystem neonatal disorder, to the onset of seizures and autistic features after the
          first year of life.
        supports: SUPPORT
