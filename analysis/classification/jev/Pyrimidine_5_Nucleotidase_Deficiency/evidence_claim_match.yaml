      assertion:
        name: Lead poisoning
        disease_term:
          preferred_term: lead poisoning
          term:
            id: MONDO:0018019
            label: lead poisoning
        description: The acquired phenocopy, and the differential that matters most because it is treatable
          and preventable. Lead inhibits the same enzyme, so the film, the hemolysis and the enzyme assay
          all look the same.
        distinguishing_features:
        - A blood lead level, which is normal in the inherited disease.
        - Lead-induced enzyme deficiency is partial (about 25 percent of normal activity reported) where
          the inherited deficiency is usually under 10 percent.
        - Biallelic NT5C3A variants are present in the inherited disease and absent in lead poisoning.
      selected_evidence:
        snippet: Nucleotidase activity was about 25% that in normal erythrocytes and 15% or less of that
          expected in comparable reticulocyte-rich blood.
        supports: SUPPORT
