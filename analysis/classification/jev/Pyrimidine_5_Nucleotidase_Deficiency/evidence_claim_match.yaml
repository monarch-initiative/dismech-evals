  cbca9e53514f8c51c19f18c68f957814fc325f08354451180ee91abb8997de3c:
    claim:
      about:
        disease:
          name: Pyrimidine 5-Nucleotidase Deficiency
          disease_term:
            preferred_term: hemolytic anemia due to pyrimidine 5' nucleotidase deficiency
            term:
              id: MONDO:0009946
              label: hemolytic anemia due to pyrimidine 5' nucleotidase deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: NT5C3A
        association: Causal biallelic variant
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: NT5C3A
          term:
            id: hgnc:17820
            label: NT5C3A
        notes: 'Encodes cytosolic 5-nucleotidase III-A (cN-IIIA, P5N-1), on chromosome 7. Formerly written
          P5''N-1 or UMPH1 in the older literature.

          Two practical points about sequencing this gene. P5N pseudogenes on chromosomes 4 and 7 complicated
          the original mutation analysis and are still a source of mapping artefact. And at least one
          reported family shows a genotype that does not read as straightforwardly biallelic: two brothers
          carried a heterozygous in-frame deletion yet expressed only the mutant transcript, so the authors
          proposed negative regulation of the normal allele rather than a second coding variant. A heterozygous
          NT5C3A finding in a patient with the biochemical phenotype should therefore not be dismissed
          without transcript-level work.

          NT5C3A also has a function outside the red cell that is not part of this disease: it is interferon-inducible
          in many cell types and represses NF-kB driven cytokine transcription. No immunological phenotype
          has been reported in P5N-deficient patients, and this entry makes no claim that one exists.'
      selected_evidence:
        snippet: The enzyme pyrimidine 5'-nucleotidase (NT5C3A), which mediates nucleotide catabolism,
          was previously thought to be restricted to blood cells.
        supports: NO_EVIDENCE
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/2
      context_paths:
