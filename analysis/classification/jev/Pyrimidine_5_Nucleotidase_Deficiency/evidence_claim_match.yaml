        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic NT5C3A Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: Missense, nonsense, splice-site and in-frame deletion variants on both NT5C3A alleles.
          The gene sits on chromosome 7, has 10 exons with alternative splicing of exon 2, and encodes
          proteins of 286 and 297 amino acids. Molecular diagnosis was delayed by nearly three decades
          after the clinical description, partly because P5N pseudogenes on chromosomes 4 and 7 complicate
          the sequencing.
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: 'Three homozygous mutations were identified in this gene in 4 subjects with P5''N-1 deficiency:
          codon 98 GAT-->GTT, Asp-->Val (linked to a silent polymorphism codon 92, TAC-->TAT), codon 177,
          CAA-->TAA, Gln-->termination, and IVS9-1, G-->T.'
        supports: SUPPORT
    origin:
