          term:
            id: hgnc:4827
            label: HBB
        notes: 'Co-inheritance of hemoglobin E converts this from a mild disorder into a severe one, and
          the direction of the interaction is the informative part: it is not additive. In the reported
          Bangladeshi family, individuals homozygous for Hb E alone were asymptomatic and those homozygous
          for the enzyme deficiency alone had the usual mild anemia, while the doubly homozygous individual
          had severe hemolytic anemia. Globin-chain work traced this to marked instability of Hb E specifically
          in enzyme-deficient red cells, with free alpha-chains accumulating on the membrane. This is
          the observation behind the oxidative-vulnerability candidate recorded on the hemolysis node.'
      selected_evidence:
        snippet: An individual homozygous for both these conditions has a severe hemolytic anemia, whereas
          family members who are homozygous for Hb E are asymptomatic and those homozygous for pyrimidine
          5' nucleotidase deficiency have the mild hemolytic anemia that is characteristic of this disorder.
        supports: SUPPORT
