        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Erythrocyte Pyrimidine 5-Nucleotidase Activity
        biological_scale: MOLECULAR
        description: 'Enzyme activity in affected red cells falls to under 14 percent, usually under 10
          percent, of normal. The deficit is larger than it looks on a raw assay: the enzyme is normally
          enriched in reticulocytes, so a reticulocyte-rich hemolytic sample should read high, and reading
          low against that expectation means the true deficit is greater than the ratio to normal whole
          blood suggests. In one severe case Western blot showed no detectable protein at all.'
        molecular_functions:
        - preferred_term: pyrimidine 5-nucleotidase activity
          modifier: DECREASED
          term:
            id: GO:0008253
            label: 5'-nucleotidase activity
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
      selected_evidence:
        snippet: The nucleotidase activity in deficient red cells assayed less than 14%, and usually less
          than 10%, of normal and much less in terms of reticulocyte-rich blood, where it was consistently
          found to be increased.
        supports: SUPPORT
