          of the pool is pyrimidine, where a normal red cell is 97 percent or more adenine. A screening
          proxy exists and needs no enzyme assay: the ultraviolet absorbance maximum of a deproteinized
          extract shifts from 256-257 nm to about 266-270 nm.'
