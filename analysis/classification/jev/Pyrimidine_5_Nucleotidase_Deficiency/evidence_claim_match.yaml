    evidence_metadata:
      reference: PMID:29463777
      reference_title: The intracellular pyrimidine 5'-nucleotidase NT5C3A is a negative epigenetic factor
        in interferon and cytokine signaling.
      evidence_source: IN_VITRO
      explanation: Recorded as NO_EVIDENCE deliberately. The paper establishes a real non-erythroid function
        for the gene, but says nothing about the hemolytic disease, and no immunological phenotype has
        been reported in patients. It is cited so that a reader who finds this literature is not left
