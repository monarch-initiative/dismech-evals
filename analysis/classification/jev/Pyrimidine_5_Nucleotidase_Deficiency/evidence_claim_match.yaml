  04917c5201a094347e6c9a0d1a06fdf2ccaf4b4a481afde96ce82d38b17f8cca:
    claim:
      about:
        disease:
          name: Pyrimidine 5-Nucleotidase Deficiency
          disease_term:
            preferred_term: hemolytic anemia due to pyrimidine 5' nucleotidase deficiency
            term:
              id: MONDO:0009946
              label: hemolytic anemia due to pyrimidine 5' nucleotidase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intraerythrocytic Pyrimidine Nucleotide Accumulation
        biological_scale: CELLULAR
        description: Pyrimidine nucleotides released by ribosomal RNA breakdown during reticulocyte maturation
          carry a phosphate and cannot cross the membrane. Undephosphorylated, they are trapped. Total
          nucleotide rises three- to six-fold and roughly 80 percent of the pool becomes pyrimidine, against
          97 percent or more adenine in a normal red cell - a compositional inversion, not merely an excess.
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
        biological_processes:
        - preferred_term: erythrocyte pyrimidine nucleotide catabolism
          modifier: DECREASED
          term:
            id: GO:0006244
            label: pyrimidine nucleotide catabolic process
      selected_evidence:
        snippet: Total nucleotides in patient cells were present in amounts 3-6 times greater than normal,
          and approximately 80% contained pyrimidine.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
