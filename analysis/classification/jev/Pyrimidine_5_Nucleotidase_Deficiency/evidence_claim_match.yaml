            term:
              id: MONDO:0009946
              label: hemolytic anemia due to pyrimidine 5' nucleotidase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Shortened Erythrocyte Survival
        biological_scale: ORGANISM
        mechanism_confidence: HYPOTHETICAL
        description: 'Chronic extravascular hemolysis, ranging from fully compensated to transfusion-requiring.
          The step from the loaded, stippled cell to its premature clearance is the least well understood
          part of the chain: reviews describe the hemolytic mechanism as still unclear, and the raised
          reduced glutathione seen in patient cells has never been explained. The entry therefore records
          this edge as indirect with unknown intermediates rather than asserting a mechanism.

          One candidate has real support and is worth naming rather than leaving out. Beyond the nucleotide
          load itself, inhibition of hexose monophosphate shunt activity in young erythrocytes has been
          proposed as a second contributor, which would make the cells oxidant-vulnerable. The evidence
          for it is indirect and comes from a co-inheritance experiment: in a family segregating both
          this deficiency and hemoglobin E, the doubly homozygous individual had severe hemolysis while
          each single homozygote was mild or asymptomatic, and globin-chain work traced that to marked
          instability of Hb E specifically in enzyme-deficient cells, with free alpha-chains accumulating
          on the membrane. Note the tension with the raised glutathione: an oxidative account has to accommodate
          a finding that points the other way, and no cited source reconciles them.'
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
      selected_evidence:
        snippet: cN-III was first linked to a genetic defect , hereditary pyrimidine nucleotidase deficiency,
          associated to a nonspherocyt ic hemolytic anemia disorder of still unclear mechanism but metabolically
          characterized by abnormally high levels of pyrimidine compounds and ribonucleoproteins in erythrocytes,
          as evidenced by occurrence of basophilic stippling on blood smearings.
        supports: SUPPORT
    origin:
