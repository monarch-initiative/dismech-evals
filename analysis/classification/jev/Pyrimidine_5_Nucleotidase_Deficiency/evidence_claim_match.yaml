      assertion_type: Genetic
      assertion:
        name: UGT1A1
        association: Modifier of the hyperbilirubinemia
        relationship_type: MODIFIER
        gene_term:
          preferred_term: UGT1A1
          term:
            id: hgnc:12530
            label: UGT1A1
        notes: 'Co-inherited Gilbert-type UGT1A1 alleles do not cause the hemolysis but change how it
          presents. UGT1A1 conjugates bilirubin; a reduced-activity allele on top of a chronic hemolytic
          load raises unconjugated bilirubin further, deepening the jaundice and, plausibly, the gallstone
          risk. In the father-and-daughter pair below the father was homozygous and the daughter heterozygous
          for the TA7 promoter allele, and the reporting paper''s own title states that Gilbert syndrome
          influences clinical expression here. This is a modifier of clinical expression, not of the enzymopathy.

          A second, independent series reports the same co-inheritance - both patients carrying UGT1A1
          c.211G>A (p.G71R) - and concludes that establishing the UGT1A1 genotype is necessary to read
          the NT5C3A genotype-phenotype relationship accurately. That report (PMID:34547876) is not cited
          with an evidence item, for a tooling reason recorded in this entry''s notes rather than because
          the finding is in doubt.'
      selected_evidence:
        snippet: Investigation of the promoter polymorphism of the uridine diphospho glucuronosyl transferase
          1A (UGT1A) gene revealed that the father was homozygous for the allele (TA7) and the daughter
          heterozygous (TA6/TA7).
        supports: SUPPORT
