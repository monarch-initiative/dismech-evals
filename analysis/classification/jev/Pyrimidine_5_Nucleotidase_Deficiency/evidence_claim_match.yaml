            term:
              id: MONDO:0009946
              label: hemolytic anemia due to pyrimidine 5' nucleotidase deficiency
        context: []
      assertion_type: Environmental
      assertion:
        name: Lead exposure
        description: Lead inhibits erythrocyte pyrimidine 5-nucleotidase, producing an acquired copy of
          the inherited enzyme defect. In a patient with lead intoxication, nucleotidase activity fell
          to about 25 percent of normal and 12 percent of erythrocyte nucleotides contained cytidine,
          where pyrimidine nucleotides are virtually absent from normal red cells. This is the mechanistic
          reason lead poisoning shows the same hemolysis and the same basophilic stippling, and it is
          why an acquired cause has to be excluded before the inherited disease is diagnosed.
        notes: No ECTO exposure term is bound. ECTO was searched for a lead-exposure term matching this
          claim and the candidates found describe route-specific exposures rather than the systemic lead
          intoxication the cited work reports, so the field is left unbound rather than approximated.
      selected_evidence:
        snippet: The present report documents that lead-induced deficiency when sufficiently severe gives
          rise to findings similar to the hereditary disorder.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
