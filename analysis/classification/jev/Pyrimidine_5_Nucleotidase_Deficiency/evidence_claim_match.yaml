        context: []
      assertion_type: Treatment
      assertion:
        name: Splenectomy
        description: 'Reported in patients with this disease, not established as effective, and with a
          documented harm. The 65-year-old case had undergone splenectomy and was nonetheless admitted
          for persistent hemolytic crises, so the entry records splenectomy as something that is done
          rather than something that works.

          The harm is worth stating alongside the absent benefit. In one reported patient, splenectomy
          was followed by extreme sustained thrombocytosis and extensive portal, splenic and mesenteric
          vein thrombosis, despite standard antithrombotic prophylaxis. Post-splenectomy thrombocytosis
          is common and usually transient; this was neither. On the evidence in this entry the procedure
          has no demonstrated benefit in this disease and one severe reported complication, which is an
          unfavourable balance rather than an open question.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Splenectomy
          term:
            id: NCIT:C15328
            label: Splenectomy
      selected_evidence:
        snippet: We report a case of a 65-year-old female patient with systemic lupus erythematosus and
          a history of splenectomy, who was admitted for evaluation of persistent hemolytic crises.
