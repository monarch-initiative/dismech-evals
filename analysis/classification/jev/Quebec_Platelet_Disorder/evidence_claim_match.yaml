        fidelity: MODERATE
        model_scale: ORGANISM
        description: Reproduces the downstream consequence - platelet uPA overexpression with a bleeding
          phenotype - and so establishes that ectopic platelet uPA is sufficient to cause the disorder.
        limitations: The model does not carry the tandem duplication and does not reproduce the enhancer
          adoption that causes lineage-restricted overexpression in humans; the transgene supplies the
          endpoint directly. Its reproductive phenotype is also more severe than the human disease, with
          fetal loss and fatal postpartum hemorrhage reported, whereas all nine pregnancies among five
          affected women in the founder-family study were successful.
      selected_evidence:
        snippet: Mice that selectively overexpress PLAU in megakaryocytes have a QPD-like bleeding disorder.
