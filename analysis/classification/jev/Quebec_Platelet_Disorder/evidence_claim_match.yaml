          variant_origin: GERMLINE
          functional_impact_category: GAIN_OF_FUNCTION
          zygosity: HETEROZYGOUS
          description: A heterozygous ~78-kb direct tandem duplication. The gain of function is regulatory
            and lineage-restricted rather than a change in uPA structure or catalytic activity.
      selected_evidence:
        snippet: All 38 subjects with QPD had a direct tandem duplication of a 78-kb genomic segment that
          includes PLAU.
        supports: SUPPORT
        directness: DIRECT
