  6c5ab02e1a4b8ca8ad905cb3270b873f7a2d300495aa5884718ebd6a57388c4c:
    claim:
      about:
        disease:
          name: Quebec Platelet Disorder
          disease_term:
            preferred_term: Quebec platelet disorder
            term:
              id: MONDO:0011136
              label: Quebec platelet disorder
        context: []
      assertion_type: Treatment
      assertion:
        name: Tranexamic Acid
        description: Antifibrinolytic therapy is the only treatment shown to control QPD bleeding, and
          it is used both to treat an established bleed and as prophylaxis around a planned hemostatic
          challenge. Because the bleeding is delayed, cover must continue for days after the challenge
          rather than stopping once immediate hemostasis is achieved - reported schedules run from three
          to four days for minor procedures up to ten to fourteen days after intracranial bleeding. Epsilon-aminocaproic
          acid is a less potent alternative requiring higher doses; it is deliberately left without an
          ontology binding here because no CHEBI term for it was resolved during curation.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: tranexamic acid
            term:
              id: CHEBI:48669
              label: tranexamic acid
        notes: 'Platelet transfusion, plasma and desmopressin have been reported ineffective for typical
          QPD bleeding, because none of them suppresses local uPA and plasmin activity at the site of
          the plug. That negative is diagnostically useful: a bleeding disorder that fails to respond
          to platelet transfusion but responds to an antifibrinolytic is behaving as QPD does. These agents
          are not curated as treatments here precisely because the cited sources report them as not working.'
      selected_evidence:
        snippet: Individuals with QPD and exposure(s) to hemostatic challenges had experienced excessive
          bleeding only when fibrinolytic inhibitors had not been used.
        supports: SUPPORT
        directness: DIRECT
