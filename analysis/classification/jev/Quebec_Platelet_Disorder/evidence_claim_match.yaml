      assertion_type: Genetic
      assertion:
        name: PLAU
        gene_term:
          preferred_term: PLAU
          term:
            id: hgnc:9052
            label: PLAU
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'PLAU encodes urokinase plasminogen activator. The causal lesion is a ~78-kb germline tandem
          duplication on chromosome 10q22 spanning PLAU and C10orf55, not a sequence variant: the transcript
          and protein are structurally normal and the pathogenic effect is entirely at the level of expression.
          Because the lesion is a non-coding structural variant, exome sequencing can miss it, and breakpoint-specific
          PCR remains the preferred confirmatory test in a family with a known duplication. The duplicated
          interval is chr10:75,659,017-75,736,956 on GRCh37/hg19.'
      selected_evidence:
        snippet: QPD is the first bleeding disorder to be associated with a gene duplication event and
          a PLAU mutation.
        supports: SUPPORT
        directness: DIRECT
