        name: Accelerated Platelet-Localized Clot Lysis
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: Activated QPD platelets release uPA into the clot they have just helped build, and
          the plug is lysed prematurely. Primary hemostasis succeeds and then fails, which is why bleeding
          is delayed rather than immediate and why it is refractory to platelet transfusion, which adds
          platelets without suppressing local plasmin generation. Because systemic fibrinolysis is normal,
          the effect is confined to the site of the plug. This node is deliberately not marked as conforming
          to primary_hemostatic_plug_failure - that module models a plug that never forms, whereas the
          defining QPD lesion destroys a plug that did.
        biological_processes:
        - preferred_term: fibrinolysis
          modifier: INCREASED
          term:
            id: GO:0042730
            label: fibrinolysis
      selected_evidence:
        snippet: the activation of QPD platelets leads to release of uPA from α-granules and accelerated
          clot lysis
        supports: SUPPORT
