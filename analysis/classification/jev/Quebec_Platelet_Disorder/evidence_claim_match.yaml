          testing. The important caveat is technical rather than clinical: the lesion is a non-coding
          structural variant, so exome sequencing can miss it entirely and a negative exome does not exclude
          QPD. CNV-aware genome sequencing or a bleeding-disorder panel may detect it depending on probe
          coverage.'
