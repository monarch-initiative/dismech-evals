      assertion_type: Diagnosis
      assertion:
        name: Global Coagulation and Fibrinolysis Testing
        description: A negative that matters diagnostically. Routine coagulation times are normal and
          thromboelastography is not sensitive to the raised platelet uPA, because the defect is localized
          to the platelet and its clot rather than present in plasma. A QPD patient can therefore pass
          every global haemostasis screen while bleeding severely after surgery, which is a large part
          of why the disorder is missed or misattributed. Samples also need appropriate handling, since
          platelet factor V can be proteolysed ex vivo and confound results.
        diagnosis_term:
          preferred_term: global coagulation and fibrinolysis testing
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
        presence: ABSENT
      selected_evidence:
        snippet: Thromboelastography was not sensitive to the increased u-PA in QPD blood.
        supports: SUPPORT
        directness: DIRECT
