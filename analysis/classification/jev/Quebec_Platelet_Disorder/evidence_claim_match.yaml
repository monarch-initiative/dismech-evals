  ca325235d47e8d4ba2a1c3180a6f389f3242575124eb929b9f4c712ae8b71cc7:
    claim:
      about:
        disease:
          name: Quebec Platelet Disorder
          disease_term:
            preferred_term: Quebec platelet disorder
            term:
              id: MONDO:0011136
              label: Quebec platelet disorder
        context:
        - path: /treatments/0
          value:
            name: Tranexamic Acid
            description: Antifibrinolytic therapy is the only treatment shown to control QPD bleeding,
              and it is used both to treat an established bleed and as prophylaxis around a planned hemostatic
              challenge. Because the bleeding is delayed, cover must continue for days after the challenge
              rather than stopping once immediate hemostasis is achieved - reported schedules run from
              three to four days for minor procedures up to ten to fourteen days after intracranial bleeding.
              Epsilon-aminocaproic acid is a less potent alternative requiring higher doses; it is deliberately
              left without an ontology binding here because no CHEBI term for it was resolved during curation.
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: tranexamic acid
                term:
                  id: CHEBI:48669
                  label: tranexamic acid
            notes: 'Platelet transfusion, plasma and desmopressin have been reported ineffective for typical
              QPD bleeding, because none of them suppresses local uPA and plasmin activity at the site
              of the plug. That negative is diagnostically useful: a bleeding disorder that fails to respond
              to platelet transfusion but responds to an antifibrinolytic is behaving as QPD does. These
              agents are not curated as treatments here precisely because the cited sources report them
              as not working.'
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Accelerated Platelet-Localized Clot Lysis
        description: Tranexamic acid blocks plasminogen binding to fibrin, opposing the plasmin-mediated
          lysis that dissolves the formed plug. It does not correct the PLAU overexpression, so it suppresses
          episodes without altering the underlying lesion.
      selected_evidence:
        snippet: The incorporation of QPD platelets into a forming clot led to progressive disruption
          of fibrin and platelet aggregates unless drugs were added to inhibit plasmin.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /treatments/0/target_mechanisms/0
      evidence_path: /treatments/0/target_mechanisms/0/evidence/1
      context_paths:
      - /name
      - /disease_term
      - /treatments/0
    evidence_metadata:
      reference: PMID:16689763
      reference_title: Insights into abnormal hemostasis in the Quebec platelet disorder from analyses
        of clot lysis.
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      explanation: 'The ex vivo counterpart of the clinical observation: inhibiting plasmin prevents the
        clot disruption, which is the step antifibrinolytic therapy targets.'
