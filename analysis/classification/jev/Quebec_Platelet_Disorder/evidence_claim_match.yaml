          of chromosome 10q22 containing PLAU and C10orf55. It is a copy-number gain, not a sequence change:
          the uPA coding sequence and the transcripts produced from it are structurally normal, which
          is why the disorder is a regulatory gain of function rather than an altered protein. C10orf55
          lies inside the duplicated interval but is not the causal effector.'
        genes:
        - preferred_term: PLAU
