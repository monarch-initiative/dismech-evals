      assertion:
        phase: Usually mild acute illness with rare severe adult progression
        notes: QTT is usually mild, but North Queensland adult SFG/QTT hospital cohorts document a severe
          minority that can require ICU care, progress to multi-organ failure, cause purpura fulminans
          with digital amputation, or end in death or permanent disability. Pediatric rickettsial infections
          in the same tropical-Australia setting appeared more benign in a small retrospective series.
      selected_evidence:
        snippet: Queensland tick typhus and scrub typhus can cause multi-organ failure requiring ICU care
          in otherwise well individuals.
        supports: SUPPORT
