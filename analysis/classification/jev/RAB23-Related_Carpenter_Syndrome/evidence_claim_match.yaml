            term:
              id: MONDO:0008710
              label: RAB23-related Carpenter syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rab23_mouse_human_viability_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why is homozygous RAB23 nonsense mutation embryonic lethal with neural tube defects in
          mouse but compatible with survival and a postnatal skeletal syndrome in humans, and what does
          that divergence imply for using mouse Rab23 models to study Carpenter syndrome?
        attaches_to:
        - pathophysiology#RAB23 Loss of Function
        - animal_models#open brain (opb) spontaneous Rab23 nonsense mouse
        rationale: 'This is not a difference of severity but of outcome: the same class of allele kills
          the mouse embryo and produces a viable developmental syndrome in humans. It has a direct methodological
          consequence, which the field has already had to work around - the mouse used to establish the
          FGF10-pERK1/2 suture mechanism had to be engineered specifically to survive to skeletal stages,
          because the classical null does not. Any claim carried from that model into the human disease
          therefore rests on a system that has been modified precisely at the point where the species
          diverge. Nothing in the cited literature explains the divergence; the original description labels
          it a species difference in the developmental requirement for RAB23, which names the problem
          without resolving it.'
        proposed_experiments:
        - experiment_id: rab23_cross_species_neurulation
          name: Compare RAB23 dependence in human and mouse neurulation-stage models
          description: Determine whether the divergence lies in RAB23 itself or in pathway redundancy,
            by comparing Hedgehog pathway output and neural tube closure between human iPSC-derived neural
            models carrying patient RAB23 null alleles and the equivalent mouse system.
          perturbations:
          - name: Biallelic RAB23 null allele
            target: pathophysiology#RAB23 Loss of Function
            description: Introduce a patient-equivalent RAB23 null genotype in both species' models.
          readouts:
          - name: Hedgehog pathway output
            target: pathophysiology#Hedgehog Signalling Dysregulation
            interpretation: Comparable de-repression in both species with divergent morphological outcome
              would locate the difference downstream of Hedgehog rather than in RAB23 itself.
          would_support:
          - pathophysiology#Hedgehog Signalling Dysregulation
      selected_evidence:
        snippet: Surprisingly, nonsense mutations of Rab23 in open brain mice cause recessive embryonic
          lethality with neural-tube defects
        supports: SUPPORT
