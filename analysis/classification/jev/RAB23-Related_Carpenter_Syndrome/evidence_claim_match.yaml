        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical recognition with RAB23 sequencing
        description: 'Carpenter syndrome is recognised clinically from craniosynostosis with polysyndactyly.
          Distinguishing CRPT1 from CRPT2 requires gene testing, but two clinical features shift the prior
          towards RAB23: multi-suture rather than single midline suture craniosynostosis, and the absence
          of laterality defects, which are common in CRPT2 and rare in CRPT1.'
      selected_evidence:
        snippet: However, laterality defects are present in nearly half of those with MEGF8-associated
          CRPT2, but are rare in RAB23-associated CRPT1.
        supports: SUPPORT
