          name: RAB23-related Carpenter Syndrome
          disease_term:
            preferred_term: RAB23-related Carpenter syndrome
            term:
              id: MONDO:0008710
              label: RAB23-related Carpenter syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Prenatal ultrasound recognition
        description: 'Carpenter syndrome is hard to see before birth, and the cited experience says so
          plainly: in one fetus with a complex prenatal picture the diagnosis was still only made at birth,
          and it had been suggested on ultrasound in just one prior patient. Craniosynostosis and preaxial
          hexadactyly of the feet were visible on fetal CT only in retrospect.

          What the case yields is a prompt rather than a test. Bowed femora and a cardiac defect are both
          rare postnatal findings in this syndrome, so their appearance on a prenatal scan alongside an
          abnormal skull shape is a specific reason to consider the diagnosis. Cystic hygroma was also
          present in this fetus.'
      selected_evidence:
        snippet: The diagnosis of Carpenter syndrome should therefore be considered on prenatal imaging
          in cases of bowed femora and/or cardiac defect associated with abnormal skull shape.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
