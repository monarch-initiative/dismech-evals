        context:
        - path: /experimental_models/0
          value:
            name: Carpenter syndrome patient-derived iPSC neural lineage
            experimental_model_type: IPSC_DERIVED_MODEL
            description: 'Induced pluripotent stem cells from Carpenter syndrome patients, differentiated
              down the neural lineage. This is the only human-cell system in the entry, and it is what
              turns "Carpenter syndrome resembles a ciliopathy" into a measurement in patient cells rather
              than an inference from mouse work.

              Its most useful result is a dissociation within one genotype. Neurons differentiated from
              these lines show a marked drop in the proportion of ciliated cells, while the same patients''
              fibroblasts, undifferentiated iPSCs and neural progenitors keep a normal ciliation rate
              and show only shortened cilia. A study that had sampled fibroblasts alone would have concluded
              the ciliary defect was mild.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Ciliary Protein Trafficking
        relationship: RECAPITULATES
        fidelity: HIGH
        description: Patient cells carrying patient alleles, assayed for the ciliary phenotype this node
          asserts, with the cell-type dependence measured rather than assumed.
        limitations: Differentiated cells in culture, not developing tissue. The lineages assayed are
          neural, so nothing here speaks to the cranial suture or limb bud, which are where the defining
          features of the disease arise.
        readouts:
        - name: Ciliation frequency in iPSC-derived neurons
          target: Impaired Ciliary Protein Trafficking
          direction: DECREASED
          interpretation: The proportion of ciliated cells falls in patient-derived neurons specifically.
        - name: Cilium length in patient fibroblasts and neural progenitors
          target: Impaired Ciliary Protein Trafficking
          direction: DECREASED
          interpretation: In the non-neuronal patient cells the defect is a shorter cilium at a normal
            ciliation rate, which is a milder and qualitatively different abnormality.
      selected_evidence:
        snippet: Through the use of patient-derived iPSCs differentiated cells, we present direct evidence
          of primary cilia anomalies in CS, thereby confirming CS as a ciliopathy disorder.
        supports: SUPPORT
    origin:
