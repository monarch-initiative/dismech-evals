  a0dcb354b35a8c6bc7cba6003a8d00b97105ee8851443e1c4f54b0181e626861:
    claim:
      about:
        disease:
          name: RAB23-related Carpenter Syndrome
          disease_term:
            preferred_term: RAB23-related Carpenter syndrome
            term:
              id: MONDO:0008710
              label: RAB23-related Carpenter syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hedgehog Signalling Dysregulation
        conforms_to: ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction
        biological_scale: CELLULAR
        description: 'RAB23 antagonises Sonic hedgehog signalling, so its loss releases the pathway from
          negative regulation. This was the first mechanism proposed for Carpenter syndrome and was itself
          surprising, because craniosynostosis is not typically caused by variants in other Hedgehog pathway
          components. Mouse work later showed that the Hedgehog change in the suture is one arm of a broader
          signalling imbalance rather than the whole story.

          The classical genetics says de-repression, and the cell biology does not straightforwardly agree.
          Two results point the other way: depleting RAB23 lowers ciliary Smoothened, and RAB23-knockout
          neural progenitors are desensitized to cilium-dependent Hedgehog activation. Smoothened is the
          pathway''s transducer, so less of it in the cilium and a blunted response to ligand are reduced
          output, not release from repression. This node is named for the dysregulation rather than for
          a direction because of that: an earlier name asserting de-repression would have contradicted
          the node''s own modifier.

          The proposed reconciliation is that RAB23 does two separable things. It represses basal pathway
          activity, and it also facilitates activation by ligand through the cilium. Both were measured
          in one cell population: Rab23-depleted cerebellar granule cell precursors have a raised basal
          Shh signal and a blunted response to Shh ligand and to a Smoothened agonist. Losing RAB23 therefore
          raises the floor and lowers the ceiling, and the classical genetics and the trafficking work
          are each reporting one of those.

          This is why the pathway modifier is DYSREGULATED rather than INCREASED. On the dual-function
          reading that is not a refusal to commit but the accurate description: the pathway is deranged
          in two directions at once, and which one dominates in the cranial suture has not been measured.'
        biological_processes:
        - preferred_term: negative regulation of smoothened signaling pathway
          term:
            id: GO:0045879
            label: negative regulation of smoothened signaling pathway
          modifier: DECREASED
        - preferred_term: smoothened signaling pathway
          term:
            id: GO:0007224
            label: smoothened signaling pathway
          modifier: DYSREGULATED
      selected_evidence:
        snippet: The discovery of RAB23 mutations in patients with Carpenter syndrome implicates HH signaling
          in cranial-suture biogenesis--an unexpected finding, given that craniosynostosis is not usually
          associated with mutations of other HH-pathway components
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17503333
      reference_title: RAB23 mutations in Carpenter syndrome imply an unexpected role for hedgehog signaling
        in cranial-suture development and obesity.
      evidence_source: HUMAN_CLINICAL
      explanation: The original inference, together with the authors' own reason for treating it as unexpected.
        That reservation is part of why a purely Hedgehog account of the craniosynostosis was later refined.
