  33f586fa96904d3360944a486f141a8f31c04ec19d59638c0abfe32739d3a82b:
    claim:
      about:
        disease:
          name: RAB23-related Carpenter Syndrome
          disease_term:
            preferred_term: RAB23-related Carpenter syndrome
            term:
              id: MONDO:0008710
              label: RAB23-related Carpenter syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hedgehog_direction_of_effect
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Does RAB23 loss raise or lower Hedgehog pathway output, and is the answer different in
          different cell types?
        attaches_to:
        - pathophysiology#Hedgehog Signalling Dysregulation
        - pathophysiology#Impaired Ciliary Protein Trafficking
        rationale: 'The classical genetics points one way: RAB23 is a Sonic hedgehog antagonist, mouse
          nulls have a ventralised neural tube, and losing an antagonist should de-repress the pathway.
          Two cell-biological results point the other way. Depleting RAB23 selectively lowers ciliary
          Smoothened - the transducer - while leaving control ciliary proteins alone. And RAB23-knockout
          neural progenitors respond less to cilium-dependent Hedgehog activation, not more.

          There is a proposed resolution, and it is better supported than "it depends on the cell type".
          Both directions were measured in the same cells: Rab23-depleted cerebellar granule cell precursors
          show a raised basal level of Shh pathway activity and, at the same time, a blunted response
          to Shh ligand and to a Smoothened agonist, together with reduced agonist-driven Smoothened localisation
          to the cilium. On that account RAB23 has two separable jobs - it represses basal pathway activity,
          and it facilitates cilium-dependent activation by ligand - so losing it raises the floor and
          lowers the ceiling. The classical genetics reports the floor; the ciliary trafficking work reports
          the ceiling; neither is wrong.

          Two things keep this open rather than settled. It rests on one study in one cell type, and that
          cell type is one where a second study found no ciliary abnormality at all - a discrepancy the
          two papers do not address, and which may come down to the different conditional drivers used.
          And no Hedgehog measurement of either kind has been made in a Carpenter suture or limb bud,
          so the direction is asserted in the tissues that define the disease and measured only in tissues
          that do not.

          Until that gap closes the node carries DYSREGULATED rather than a direction, which on the dual-function
          reading is not a hedge but the accurate description: the pathway is deranged in two directions
          at once.'
      selected_evidence:
        snippet: Loss of Rab23 in mice recapitulates the HH phenotype but its function in HH signaling
          is unknown.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20375059
      reference_title: 'Differential role of Rab proteins in ciliary trafficking: Rab23 regulates smoothened
        levels.'
      evidence_source: IN_VITRO
      explanation: 'The authors state the gap this question is about: the genetic phenotype is established
        and the molecular direction of effect is not.'
