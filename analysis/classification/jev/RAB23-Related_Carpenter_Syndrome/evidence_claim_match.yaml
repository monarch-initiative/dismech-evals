          in a patient with a novel missense allele, and attributes them to that allele. Another reports
          chronic kidney disease and calls the association unusual.

          None of these is curated as a phenotype here. Each rests on a single case; the overgrowth report
          explicitly contrasts its patient with a typical second patient from the same study, so the authors
          themselves treat it as atypical; and the disorder has no reported genotype-phenotype correlation,
          which makes attributing new features to a particular novel allele hard to sustain. Against that,
          the syndrome is rare enough that genuine features may only ever appear in single reports, so
          absence of replication is weak evidence of coincidence.

          What would settle it is systematic ascertainment - bone age, EEG and renal function in the assembled
          RAB23 cohort - rather than further case reports.'
      selected_evidence:
        snippet: overgrowth with advanced bone age, epileptogenic changes on electroencephalogram and
          autistic features
        supports: SUPPORT
