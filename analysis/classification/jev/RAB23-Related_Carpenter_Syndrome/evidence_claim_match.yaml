  ef62c3d3d56f3f0c9b30e9c802969084c7d9ab0136023f2e0469ef0f8fcb970a:
    claim:
      about:
        disease:
          name: RAB23-related Carpenter Syndrome
          disease_term:
            preferred_term: RAB23-related Carpenter syndrome
            term:
              id: MONDO:0008710
              label: RAB23-related Carpenter syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: RAB23 pathogenic variants
        gene_term:
          preferred_term: RAB23
          term:
            id: hgnc:14263
            label: RAB23
        association: Causative
        relationship_type: CAUSATIVE
        notes: Biallelic variants, predominantly truncating. The original mapping study found five distinct
          alleles across fifteen families, four truncating and one missense, with the nonsense allele
          L145X homozygous in ten patients on a shared haplotype - a founder effect in individuals of
          northern European descent. Point mutations characterised since (M12K, C85R, Y79del) fall within
          the GTPase domain. Y79del has been solved crystallographically and distorts the switch II region,
          supporting loss of function as the mechanism for missense and in-frame alleles as well as for
          the truncating ones. No `functional_impact_category` is recorded on this entry because the schema
          places that slot on variant-level genetic context rather than on the gene-level record; the
          loss-of-function conclusion is stated here and evidenced below.
        variants:
        - name: RAB23 p.Leu145X
          description: The founder nonsense allele, homozygous in ten of the patients in the original
            mapping study and carried on a shared haplotype, indicating a founder effect in individuals
            of northern European descent. It is the single commonest cause of Carpenter syndrome.
          gene:
            preferred_term: RAB23
            term:
              id: hgnc:14263
              label: RAB23
          type: NONSENSE
          clinical_significance: PATHOGENIC
        - name: RAB23 p.Tyr79del
          description: An in-frame deletion within the GTPase domain and the only clinical allele solved
            crystallographically. It distorts the switch II region, the surface through which an activated
            Rab engages its effectors, which is how a single-residue deletion produces loss of function
            without removing the protein.
          gene:
            preferred_term: RAB23
            term:
              id: hgnc:14263
              label: RAB23
          type: DELETION
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: RAB23 effector binding
            description: Structural distortion of the switch II region, predicted to disrupt binding to
              interacting partners.
        - name: RAB23 c.482-1G>A (p.Val161LeufsX3)
          description: 'A splice-acceptor variant that activates a cryptic site inside exon 5, deleting
            eight nucleotides and shifting the frame. It is curated because of where the resulting stop
            falls: late enough that the transcript is not simply degraded, but early enough to remove
            the C-terminal prenylatable cysteine. The protein is made and cannot be lipid-anchored to
            the membranes a Rab GTPase works on, which is a different route to loss of function from the
            nonsense alleles.'
          gene:
            preferred_term: RAB23
            term:
              id: hgnc:14263
              label: RAB23
          type: SPLICE_SITE
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: RAB23 membrane association
            description: Loss of the C-terminal prenylation site, so the truncated protein is predicted
              not to associate with target membranes.
        - name: RAB23 c.481G>C (p.Val161Leufs*16)
          description: A substitution at the last base of exon 6 that causes the exon to be skipped, shifting
            the frame and creating a premature stop. It is curated as the allele of the one case with
            a documented prenatal picture, and as a second example of a coding substitution whose real
            consequence is on splicing rather than on the amino acid it appears to change.
          gene:
            preferred_term: RAB23
            term:
              id: hgnc:14263
              label: RAB23
          type: FRAMESHIFT
          clinical_significance: PATHOGENIC
        - name: RAB23 c.82C>T (p.Arg28*)
          description: A nonsense allele reported homozygous in the first molecularly confirmed case of
            Carpenter syndrome from continental Africa, with both parents shown to be carriers. It is
            curated as evidence that the disorder is not confined to the populations the founder allele
            comes from.
          gene:
            preferred_term: RAB23
            term:
              id: hgnc:14263
              label: RAB23
          type: NONSENSE
          clinical_significance: PATHOGENIC
        - name: RAB23 c.86dupA
          description: 'A frameshift allele homozygous in four affected children of one Comorian family.
            This is the entry''s clearest evidence that genotype does not fix phenotype here: with one
            allele held constant within a single family, craniosynostosis ranged from a cloverleaf skull
            to an isolated metopic ridge, hydrocephalus was present in two of four, and mental development
            was normal in all four.'
