  74d2dea6abaf7ab15ec13025c23742d298d48ba6e6a35c1c83a68fa51864bef7:
    claim:
      about:
        disease:
          name: RAB23-related Carpenter Syndrome
          disease_term:
            preferred_term: RAB23-related Carpenter syndrome
            term:
              id: MONDO:0008710
              label: RAB23-related Carpenter syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Craniofacial surgical management
        description: 'Surgical management of the craniosynostosis. No disease-modifying therapy exists
          for the underlying signalling defect, so this is the treatment of the disease in practice.

          There is no established management algorithm - the disorder is too rare for one - but two things
          are agreed. Early release of the fused sutures with fronto-orbital advancement is indicated,
          and particularly so where intracranial pressure is raised. And correction is usually safe within
          the first 6 to 12 months, which is early by the standards of craniofacial surgery generally.

          The operative planning carries a specific hazard worth recording as part of the treatment rather
          than as a complication of it: abnormal venous drainage and ectatic emissary veins can cause
          serious bleeding, and the skull may be weak enough to fragment when cranial flaps are raised.
          Both are why imaging before operating - 3D CT for the bone, MR angiography for the veins - changes
          what the surgeon does.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Surgical Procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        target_phenotypes:
        - preferred_term: Craniosynostosis
          term:
            id: HP:0001363
            label: Craniosynostosis
        - preferred_term: Cutaneous syndactyly
          term:
            id: HP:0012725
            label: Cutaneous syndactyly
      selected_evidence:
        snippet: He had presented during infancy with polysyndactyly and craniosynostosis, both treated
          surgically, and had a clinical diagnosis of CRPTS.
        supports: SUPPORT
        directness: INDIRECT
