        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hedgehog_versus_fgf_arm
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Is the craniosynostosis of Carpenter syndrome primarily a Hedgehog de-repression phenotype,
          as inferred at gene discovery, or primarily an FGFR-ERK phenotype, as the interventional mouse
          work suggests?
        attaches_to:
        - pathophysiology#Hedgehog Signalling Dysregulation
        - pathophysiology#Elevated FGF10-FGFR1-ERK Signalling in the Cranial Suture
        rationale: 'The original inference from human genetics was that Hedgehog signalling must be involved
          in suture biogenesis, and the authors flagged this as unexpected because craniosynostosis is
          not usually caused by other Hedgehog pathway components. The later mouse work supplies a different
          emphasis: FGF10-FGFR1-pERK1/2 is elevated, and inhibiting it prevents the craniosynostosis,
          while Hedgehog appears as one arm of a broader imbalance. The two are not exclusive - RAB23
          is proposed to restrain both pathways, and to regulate GLI1 non-canonically through pERK1/2
          - but the pathograph currently records the FGF-ERK arm as the better-evidenced route to the
          suture phenotype, on the strength of the rescue experiment. That ordering rests on a single
          mouse study and should be revisited if the Hedgehog arm is tested by intervention.'
      selected_evidence:
        snippet: a novel role for RAB23 as an upstream negative regulator of both FGFR and canonical Hh-GLI1
          signaling, and additionally in the non-canonical regulation of GLI1 through pERK1/2
        supports: SUPPORT
