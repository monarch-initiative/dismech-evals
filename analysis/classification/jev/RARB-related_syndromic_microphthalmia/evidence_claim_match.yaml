      assertion_type: Pathophysiology
      assertion:
        name: RARB Receptor Dysfunction
        biological_scale: MOLECULAR
        description: Pathogenic variants in RARB alter the retinoic acid receptor beta protein, a ligand-activated
          nuclear receptor. De novo dominant missense variants in and around the ligand-binding domain
          increase ligand-induced transcriptional activity (gain-of-function), biallelic nonsense and
          frameshift variants abolish receptor activity (recessive loss-of-function), and some heterozygous
          loss-of-function variants disrupt wild-type receptor function through a dominant-negative effect.
          Missense variants in the highly conserved DNA-binding domain form a further loss-of-function
          class, reducing steady-state protein levels and impairing nuclear localization of the receptor.
        genes:
        - preferred_term: RARB
          term:
            id: hgnc:9865
            label: RARB
        molecular_functions:
        - preferred_term: nuclear receptor activity
          modifier: ABNORMAL
          term:
            id: GO:0004879
            label: nuclear receptor activity
        - preferred_term: retinoic acid binding
          modifier: ABNORMAL
          term:
            id: GO:0001972
            label: retinoic acid binding
      selected_evidence:
        snippet: altered RARB had no transcriptional activity in response to ligands, confirming that
          the mutations induced a loss of function
        supports: SUPPORT
