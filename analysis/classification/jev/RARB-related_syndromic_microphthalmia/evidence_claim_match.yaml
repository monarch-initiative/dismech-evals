              label: microphthalmia, syndromic 12
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dg_dominant_recessive_lof_paradox
        kind: KNOWLEDGE_GAP
        prompt: Why do near-identical RARB loss-of-function variants manifest as dominantly inherited
          disease in some individuals but segregate as recessive alleles with asymptomatic heterozygous
          carriers in other families?
        attaches_to:
        - pathophysiology#RARB Receptor Dysfunction
        rationale: A de novo dominant nonsense RARB variant and recessive biallelic loss-of-function variants
          in asymptomatic-carrier families imply that loss-of-function dosage alone does not determine
          manifestation; dominant-negative effects, genetic background, or allelic context may modulate
          whether one mutant allele suffices.
        proposed_experiments:
        - experiment_id: exp_rarb_allelic_series_transcriptional_assay
          name: Standardized transcriptional assay across the RARB allelic series
          description: Measure ligand-induced transcriptional activity of every reported pathogenic RARB
            allele in a shared assay and correlate residual or excess activity with inheritance mode and
            clinical phenotype.
        - experiment_id: exp_rarb_dominant_negative_interaction
          name: Allele-specific interaction study of dominant-negative versus recessive RARB variants
          description: Compare protein stability, ligand binding, RXR heterodimerization, and coactivator
            recruitment of dominant-negative versus recessive loss-of-function RARB variants to identify
            the molecular property that determines single-allele manifestation.
        - experiment_id: exp_mcops12_registry
          name: MCOPS12 patient registry
          description: Assemble a formal registry of individuals with RARB-related disease to derive quantitative
            phenotype frequencies, penetrance, and genotype-phenotype correlations across variant classes
            (dominant gain-of-function, dominant-negative, and biallelic loss-of-function).
      selected_evidence:
        snippet: the data suggest manifestation and non-manifestation of disease in relation to almost
          identical RARB loss-of-function variations, an apparent paradox that is seen in a growing number
          of human genetic conditions associated with both recessive and dominant inheritance patterns.
        supports: SUPPORT
