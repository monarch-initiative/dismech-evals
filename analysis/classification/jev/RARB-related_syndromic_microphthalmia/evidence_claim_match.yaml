          in both directions (gain-of-function and loss-of-function), and the same convergence is seen
          environmentally: fetal vitamin A deficiency (too little retinoic acid) and retinoic acid embryopathy
          from gestational isotretinoin exposure (too much) produce overlapping malformation spectra.
          Exaggerated neural crest cell apoptosis via p53 upregulation is a proposed cellular mechanism
          of retinoid-excess teratogenicity.'
