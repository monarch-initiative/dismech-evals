        name: Dysregulated Retinoic Acid Target Gene Transcription
        biological_scale: MOLECULAR
        description: Dysfunctional RARB perturbs transcription of retinoic acid target genes. Dominant
          gain-of-function variants increase ligand-induced transcriptional activity two- to threefold
          over the wild-type receptor, loss-of-function alleles eliminate target gene activation, and
          overexpression of RARB elevates downstream effectors such as FOXC1. In the developing eye, the
          homeodomain transcription factor Pitx2 is a key retinoic-acid-responsive target gene in neural
          crest cells.
        biological_processes:
        - preferred_term: retinoic acid receptor signaling pathway
          modifier: ABNORMAL
