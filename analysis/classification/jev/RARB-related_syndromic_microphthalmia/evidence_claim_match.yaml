      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ra_dosage_window_phenocopy
        hypothesis_label: A narrow retinoic acid dosage window unifies genetic and environmental disruption
        status: CANONICAL
        description: 'Embryonic retinoic acid signaling must remain within a narrow dosage window for
          normal eye, diaphragm, heart, and brain morphogenesis. Genetic RARB variants breach this window
          in both directions (gain-of-function and loss-of-function), and the same convergence is seen
          environmentally: fetal vitamin A deficiency (too little retinoic acid) and retinoic acid embryopathy
          from gestational isotretinoin exposure (too much) produce overlapping malformation spectra.
          Exaggerated neural crest cell apoptosis via p53 upregulation is a proposed cellular mechanism
          of retinoid-excess teratogenicity.'
      selected_evidence:
        snippet: A majority of these abnormalities recapitulate those observed in the fetal VAD syndrome
        supports: SUPPORT
