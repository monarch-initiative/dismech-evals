      assertion_type: Discussion
      assertion:
        discussion_id: dg_motor_disorder_mechanism
        kind: KNOWLEDGE_GAP
        prompt: How does developmental disruption of RARB signaling produce the progressive postnatal
          movement disorder (spasticity, dystonia, chorea) of survivors, and through which brain regions
          and cell types?
        attaches_to:
        - pathophysiology#Abnormal Brain Development and Function
        rationale: The progressive motor impairment emerges postnatally, yet RARB acts transcriptionally
          during embryogenesis. The link between developmental retinoic acid dysregulation and later basal
          ganglia and motor pathology is inferred rather than demonstrated, and no current animal model
          recapitulates the movement disorder.
        proposed_experiments:
        - experiment_id: exp_rarb_gof_knockin_mouse
          name: Gain-of-function RARB knock-in mouse model
          description: Generate knock-in mice carrying a recurrent human codon-387 gain-of-function variant
            to test whether the progressive motor disorder is recapitulated and to define the developmental
            window of vulnerability.
        - experiment_id: exp_rarb_ipsc_organoid_ra_response
          name: Patient iPSC and organoid retinoic acid response profiling
          description: Compare transcriptomic responses to retinoic acid in patient-derived iPSC models
            and optic-cup or cerebral organoids carrying gain-of-function and biallelic loss-of-function
            variants to identify dysregulated target genes such as PITX2.
      selected_evidence:
        snippet: All subjects who survived the neonatal period (n = 10) displayed severe global developmental
          delay with progressive motor impairment due to spasticity and/or dystonia (with or without chorea).
        supports: SUPPORT
