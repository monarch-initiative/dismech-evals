      assertion:
        name: Progressive Photoreceptor and RPE Degeneration
        conforms_to: photoreceptor_degeneration#Rod Photoreceptor Apoptosis
        description: 'Among the downregulated NFE2L2 target genes, RXRA is notable because its product
          (retinoid X receptor alpha) is present in the rod photoreceptor inner segment and its activation
          is known to prevent oxidative-stress-induced photoreceptor apoptosis, mechanistically linking
          reduced NFE2L2 pathway activity to rod photoreceptor loss. Clinically, this manifests as a spectrum
          from classic rod-cone dystrophy (early-onset subtype) to a progressive disease with central
          chorioretinal atrophy and peripheral reticular pigmentary degeneration (later-onset, macula-predominant
          subtype), with secondary RPE involvement in both.

          '
        cell_types:
        - preferred_term: Retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: Retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        - preferred_term: Retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
      selected_evidence:
        snippet: retinoid X receptor alpha (RXRalpha), encoded by RXRA, is known to be present in the
          rod inner segment layer, and activation of RXRs prevents photoreceptor oxidative stress-induced
          apoptosis
        supports: SUPPORT
