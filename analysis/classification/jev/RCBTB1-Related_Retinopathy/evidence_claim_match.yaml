  2cd695171eb63de72f2fd607a8d2b9235e4c5fa243d6458bddfc769fc87dee37:
    claim:
      about:
        disease:
          name: RCBTB1-Related Retinopathy
          disease_term:
            preferred_term: RCBTB1-related retinopathy
            term:
              id: MONDO:0014955
              label: RCBTB1-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired NFE2L2 (NRF2)-Mediated Oxidative Stress Response
        description: 'UBE2E3 regulates the localization and activity of NFE2L2 (NRF2), a stress-response
          transcription factor, in concert with CRL3 complex components. In peripheral-blood mononuclear
          cells from affected individuals, mRNA expression of CUL3, NFE2L2, and three NFE2L2 target genes
          (RXRA, IDH1, SLC25A25) was significantly decreased relative to controls, consistent with impaired
          NFE2L2 pathway activity downstream of the RCBTB1/CUL3 defect. This has since been directly confirmed
          in patient-derived retinal tissue: control iPSC-derived RPE cells upregulate RCBTB1 and NFE2L2
          expression in response to oxidative-stress induction (tert-butyl hydroperoxide, tBHP), but this
          protective upregulation is markedly blunted in RCBTB1-deficient patient RPE cells. The retina
          is considered particularly sensitive to oxidative stress, and NFE2L2 is a central regulator
          that protects retinal tissue from oxidative injury.

          '
        biological_processes:
        - preferred_term: Response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: DECREASED
      selected_evidence:
        snippet: we observed significantly lower expression in affected individuals than in control individuals
          for CUL3, NFE2L2, and three NFE2L2 target genes
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
