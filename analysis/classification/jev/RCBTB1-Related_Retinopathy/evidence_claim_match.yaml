              label: RCBTB1-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RCBTB1 Loss of CUL3 Substrate-Adaptor Function
        description: 'Biallelic missense variants cluster in either the sixth repeat of the RCC1-like
          domain (RLD) or the first BTB domain (BTB1) of RCBTB1, both highly conserved protein-interaction
          regions. RCBTB1 normally acts as a substrate adaptor for cullin 3 (CUL3), the core component
          of CUL3-RING E3 ubiquitin ligase (CRL3) complexes, and interacts with the E2 conjugating enzyme
          UBE2E3, which is abundant in the retina. Missense variants at these conserved residues are predicted
          to disrupt RCBTB1''s protein-protein interactions within the CRL3 complex.

          '
        cell_types:
        - preferred_term: Retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: Retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        - preferred_term: Retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        biological_processes:
        - preferred_term: Protein ubiquitination
          term:
            id: GO:0016567
            label: protein ubiquitination
          modifier: DECREASED
      selected_evidence:
        snippet: RCBTB1 was identified as a putative substrate adaptor for cullin 3 (CUL3). CUL3 is the
          major component of the CULLIN3-RING ubiquitin ligases (CRL3)
        supports: SUPPORT
