        disease_term:
          preferred_term: familial exudative vitreoretinopathy
          term:
            id: MONDO:0019516
            label: exudative vitreoretinopathy
        description: 'Heterozygous RCBTB1 haploinsufficiency (frameshift variants reducing RCBTB1 protein
          to approximately half of normal levels — a distinct zygosity and molecular mechanism from the
          biallelic variants modeled in this entry) has separately been shown to cause Coats disease and
          familial exudative vitreoretinopathy through impaired Norrin/FZD4-dependent Wnt/beta-catenin
          retinal-angiogenesis signaling, rather than through the CUL3/NFE2L2 photoreceptor- and RPE-oxidative-stress
          mechanism modeled here. The two RCBTB1-associated phenotypes are genetically (heterozygous vs.
          biallelic) and mechanistically (angiogenesis vs. oxidative-stress-driven degeneration) distinct
          and are not curated as the same entry.

          '
        distinguishing_features:
        - Heterozygous (haploinsufficiency) rather than biallelic RCBTB1 variants
        - Retinal vascular/angiogenesis defect (Norrin/FZD4-Wnt/beta-catenin signaling) rather than photoreceptor/RPE
          oxidative-stress-driven degeneration
        - Preserved electroretinogram and absence of night blindness reported in the one overlapping proband
          assessed for both conditions
      selected_evidence:
        snippet: transgenic fli1:EGFP zebrafish with rcbtb1 knockdown exhibited anomalies in intersegmental
          and intraocular vessels
        supports: SUPPORT
