          the rapid photoreceptor death: deleting GCAPs preserves most rd3 photoreceptors, and RD3 fragments
          that still inhibit the cyclase but cannot traffic it prevent degeneration without restoring
          function. Whether the toxicity comes from the misplaced cyclase activity itself or from a cyclase-independent
          action of calcium-free GCAPs is not settled.'
