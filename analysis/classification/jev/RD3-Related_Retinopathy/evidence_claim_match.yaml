      assertion_type: Genetic
      assertion:
        name: RD3
        gene_term:
          preferred_term: RD3
          term:
            id: hgnc:19689
            label: RD3
        relationship_type: CAUSATIVE
        association: Causative
        inheritance:
        - name: Autosomal recessive
        features: The LCA-causing alleles are predicted to truncate the protein (nonsense, small frameshift
          and canonical splice-site variants). The c.112C>T (p.Arg38Ter) allele recurs in families from
          the southern Mediterranean as an ancient founder allele. One homozygous missense variant (p.Lys87Glu)
          has been reported in a family with retinitis pigmentosa, on in-silico evidence only.
        variants:
        - name: c.112C>T (p.Arg38Ter)
          variant_type: single nucleotide variant
          clinical_significance: PATHOGENIC
          description: Nonsense founder allele shared by five families from the southern shores of the
            Mediterranean; also reported homozygous in an infant with RD3-related LCA.
        - name: c.180C>A
          variant_type: single nucleotide variant
          clinical_significance: PATHOGENIC
          description: Homozygous nonsense variant in a consanguineous Kurdish family.
        - name: c.259A>G (p.Lys87Glu)
          variant_type: single nucleotide variant
          description: Homozygous missense variant reported in one Spanish family with retinitis pigmentosa
            rather than LCA. Pathogenicity rests on in-silico prediction; no segregation or functional
            data are given. Lys87 lies in the Lys87-Leu122 region that binds the cyclase.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_67c894eb-2c16-4598-8e92-8345e562d91c-2022-01-06T050000.000Z
          notes: Retina Gene Curation Expert Panel, autosomal recessive, SOP8, approved January 2022.
      selected_evidence:
        snippet: We identified three RD3 mutations in seven unrelated consanguineous LCA families - i.e.,
          a 2 bp deletion and two nonsense mutations - predicted to cause complete loss of function.
        supports: SUPPORT
