      assertion_type: Treatment
      assertion:
        name: RD3 Gene Augmentation (preclinical)
        description: Subretinal AAV delivery of RD3 to photoreceptors is the only disease-directed approach
          and has been tested only in mice. In two rd3 strains, AAV8(Y733F) carrying Rd3 under the rhodopsin
          kinase promoter moved guanylyl cyclase from the endoplasmic reticulum to rod and cone outer
          segments, kept photoreceptors alive for at least 7 months, and restored ERG responses. Transgenic
          RD3 expression in rods likewise restored cyclase levels and photoresponses. No human trial has
          been reported; care for patients is supportive.
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene augmentation therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
        delivery_system:
          delivery_platform: VIRAL_VECTOR
          target_cell_types:
          - preferred_term: photoreceptor cell
            term:
              id: CL:0000210
              label: photoreceptor cell
      selected_evidence:
        snippet: Strong RD3 transgene expression led to the translocation of guanylate cyclase from the
          endoplasmic reticulum (ER) to rod and cone outer segments (OSs) as visualized by immunofluorescence
          microscopy.
        supports: SUPPORT
