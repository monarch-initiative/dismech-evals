      assertion:
        name: RD3 Biallelic Loss of Function
        conforms_to: phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect
        biological_scale: MOLECULAR
        description: Biallelic truncating RD3 variants (nonsense, frameshift and splice-site alleles,
          including the Mediterranean founder p.Arg38Ter) produce unstable, non-functional C-terminally
          truncated protein or none at all. RD3 is a 195-residue four-helix-bundle protein expressed in
          rods and cones; it binds RetGC1 and RetGC2 through a central helical interface and needs its
          C-terminal region to couple the cyclase to intracellular trafficking.
        genes:
        - preferred_term: RD3
          term:
            id: hgnc:19689
            label: RD3
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        cell_types:
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        molecular_functions:
        - preferred_term: guanylate cyclase inhibitor activity
          modifier: DECREASED
          term:
            id: GO:0030251
            label: guanylate cyclase inhibitor activity
      selected_evidence:
        snippet: The RD3 mutant lacking the carboxy-terminal half of the protein and associated with Leber
          congenital amaurosis type 12 (LCA12) is unable to suppress the activity of the RetGC1/GCAP complex.
        supports: SUPPORT
