        hypothesis_label: Haploinsufficiency
        status: DEPRECATED
        description: 'Loss of one functional RDH12 allele is not sufficient for disease: heterozygous
          parents of LCA13 patients are unaffected, heterozygous Rdh12 mice have no retinal phenotype,
          and other truncating variants that also escape NMD but do not create the shared C-terminal peptide
          have not been linked to dominant disease. No causal edge in this entry belongs to this hypothesis;
          it is recorded so that the reason for excluding it is visible.'
      selected_evidence:
        snippet: Most individuals with heterozygous RDH12 variants were disease-free, indicating that
          a single allele was sufficient to maintain the activity of retinol dehydrogenase, except for
          patients with RDH12-associated adRP.
        supports: REFUTE
