          peptide.
        variant_origin: GERMLINE
        notes: relationship_type is deliberately left unset. The schema defines CAUSATIVE as corresponding
          to ClinGen Definitive or Strong, and ClinGen rates this pair Moderate (three variants in four
          probands); no other GeneDiseaseRelationshipEnum value describes a defining gene with moderate
          validity. Two further heterozygous variants reported in single RP patients, c.680_684delinsT
          p.(Ala227Valfs*50) and c.121G>T p.(Val41Leu), lack segregation data and are not curated here.
        gene_disease_validity:
        - validity_classification: MODERATE
          classified_by: CLINGEN
          external_id: CGGV:assertion_958d5e41-ea0c-4497-af02-56d6ed3cd341-2023-03-02T170000.000Z
        variants:
        - name: c.778del p.(Glu260Argfs*18)
          synonyms:
          - 776delG
          - c.778delG
          description: The founding dominant allele, segregating in a six-generation American family with
            19 affected members; first annotated as 776delG.
        - name: c.759del p.(Phe254Leufs*24)
          description: Found heterozygous in two unrelated families (an Israeli family of Tunisian paternal
            descent and an English family); absent from gnomAD.
        - name: c.763del p.(Val255Serfs*23)
          synonyms:
          - c.763delG
          description: Segregating in a four-generation British family with eight affected carriers, including
            one carrier identified only by adaptive optics imaging.
      selected_evidence:
        snippet: 'This curation includes three frameshift variants that have been reported in 4 probands
          in 3 publications (PMIDs: 18779497, 32322264, 34031043).'
        supports: SUPPORT
