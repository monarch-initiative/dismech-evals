          further downstream, such as c.806_810del, also escape NMD but do not create this peptide and
          are not dominant, which is why the peptide rather than truncation itself is suspected. In patient-derived
          organoids the mutant mRNA is present while total RDH12 expression is reduced by about 45 per
          cent, suggesting partial degradation; the mutant protein itself has not been detected separately
          from the wild-type protein.
