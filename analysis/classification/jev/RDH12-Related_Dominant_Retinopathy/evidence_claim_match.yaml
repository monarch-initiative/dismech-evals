            term:
              id: MONDO:0800100
              label: RDH12-related dominant retinopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rdh12_ad_gain_vs_dominant_negative
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#NMD-Escaping Transcript Encoding RDH12 With a Novel C-Terminus
        - pathophysiology#Toxic Gain of Function of the Aberrant C-Terminal Peptide
        - pathophysiology#Dominant-Negative Interference With Wild-Type RDH12
        prompt: Does the shared C-terminal peptide of the dominant RDH12 frameshift protein act through
          a toxic gain of function or by interfering with wild-type RDH12?
        rationale: 'Both mechanisms are proposed in the same small literature and neither has been tested:
          the mutant protein has not been detected separately from wild type, RDH12 dimerisation is inferred
          from a Drosophila ortholog, and the organoid transcriptome cannot separate the two. The answer
          decides the therapy. Allele-specific silencing of the mutant transcript, proposed by the British
          family''s authors, would suffice under a toxic gain of function, because one normal allele is
          enough; under a dominant-negative mechanism silencing would also help, but gene supplementation
          could too.'
        proposed_experiments:
        - experiment_id: rdh12_ad_isogenic_organoid_coexpression
          experiment_design: TARGETED_PERTURBATION
          name: Isogenic organoids and co-expression assays for the dominant RDH12 allele
          description: Correct c.759del in the patient iPSC line, and introduce it into a control line,
            then compare photoreceptor number, retinoid reductase activity and mutant protein level in
            the organoids. In parallel, co-express wild-type and frameshift RDH12 in cells to test whether
            the mutant protein binds wild-type RDH12 or reduces its activity, and whether the C-terminal
            peptide is toxic when fused to an unrelated protein.
          would_support:
          - pathophysiology#Dominant-Negative Interference With Wild-Type RDH12
          would_refute:
          - pathophysiology#Toxic Gain of Function of the Aberrant C-Terminal Peptide
          supporting_outcome:
          - The frameshift protein binds wild-type RDH12 and lowers its activity, while the peptide alone
            is not toxic, and correction restores photoreceptor number.
          refuting_outcome:
          - The peptide is toxic on its own and wild-type activity is unchanged by co-expression, favouring
            a gain of function.
      selected_evidence:
        snippet: being able to switch off the dominant gain-of-function mutant allele using AON targeting
          would leave affected patients expressing 50% of normal RDH12 like an unaffected parent of an
          RDH12 LCA child.
        supports: SUPPORT
    origin:
