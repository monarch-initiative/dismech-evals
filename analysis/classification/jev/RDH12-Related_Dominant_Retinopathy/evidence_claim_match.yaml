        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NMD-Escaping Transcript Encoding RDH12 With a Novel C-Terminus
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: PROVISIONAL
        description: The premature stop codon falls within about 20 nucleotides of the last exon-exon
          junction, so the mutant transcript is predicted to escape nonsense-mediated decay. All three
          dominant frameshifts enter the same alternative reading frame and end in an identical novel
          C-terminal peptide (RGRRPACTAPWLRAWSP), replacing roughly 60 wild-type residues. Recessive truncations
          further downstream, such as c.806_810del, also escape NMD but do not create this peptide and
          are not dominant, which is why the peptide rather than truncation itself is suspected. In patient-derived
          organoids the mutant mRNA is present while total RDH12 expression is reduced by about 45 per
          cent, suggesting partial degradation; the mutant protein itself has not been detected separately
          from the wild-type protein.
        genes:
        - preferred_term: RDH12
          term:
            id: hgnc:19977
            label: RDH12
        molecular_functions:
        - preferred_term: all-trans-retinol dehydrogenase (NADP+) activity
          term:
            id: GO:0052650
            label: all-trans-retinol dehydrogenase (NADP+) activity
          modifier: ABNORMAL
        locations:
        - preferred_term: photoreceptor inner segment layer
          term:
            id: UBERON:0003925
            label: photoreceptor inner segment layer
      selected_evidence:
        snippet: RDH12-AD RO exhibited correct localization of RDH12 to the photoreceptor inner segments
          up to week 44
        supports: SUPPORT
