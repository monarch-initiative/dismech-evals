      assertion:
        name: Progressive Cone Dystrophy and Macular Atrophy
        biological_scale: TISSUE
        description: In the vulnerable subset, cone dysfunction and macular atrophy progress over years
          to decades, with significant measurable macular volume loss, declining photopic (cone) ERG amplitudes,
          and in the most advanced cases fading of the classic white flecks and reduced central visual
          acuity. This represents a materially different prognosis and monitoring need than the typical
          stationary course. Unlike the photoreceptor_degeneration module's rod-first apoptosis followed
          by non-cell-autonomous secondary cone loss, RDH5 cone dysfunction arises directly from the same
          chronic RPE chromophore-supply defect that affects rods, not as a bystander effect of rod death,
          so this node does not declare conforms_to either module node.
        cell_types:
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
      selected_evidence:
        snippet: we found a significant annual rate of macular volume loss, estimated at -0.007 mm3/y
          (95% CI, -0.012 to -0.001; P = .02), without any significant difference between the two genotypes
        supports: SUPPORT
