      assertion:
        name: Progressive Cone Dystrophy
        display_name: Progressive Cone Dystrophy and Macular Atrophy
        description: 'A subset of RDH5 patients, most frequently over age 40, develop progressive cone
          dysfunction and/or macular atrophy superimposed on the flecked fundus, with declining photopic
          ERG amplitudes, reduced visual acuity, and in some cases fading of the classic white dots over
          decades. Genotype-phenotype correlation is incomplete: siblings homozygous for the identical
          RDH5 variant have been reported with discordant macular involvement, suggesting unidentified
          genetic or environmental modifiers.'
      selected_evidence:
        snippet: Cone dystrophy was most frequently seen in patients over 40 years old.
        supports: SUPPORT
