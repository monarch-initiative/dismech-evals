        name: Impaired Repair of Topoisomerase-Associated DNA Breaks
        description: Patient fibroblasts lacking functional RECQL1 retain more 53BP1 foci for 24 hours
          after camptothecin or etoposide and have more spontaneous foci. ATM-dependent damage signaling
          is robustly activated in patient cells, so the defect lies in repair or replication through
          the lesion rather than in damage sensing. Breakage and translocation at the MLL locus after
