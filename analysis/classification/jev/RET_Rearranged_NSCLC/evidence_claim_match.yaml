        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RET Gene Rearrangement
        genetic_context:
          variant_origin: SOMATIC
        description: RET rearrangements result from chromosomal inversions or translocations that fuse
          the RET kinase domain (10q11.21) to an N-terminal partner gene. The partner gene provides a
          dimerization domain, causing constitutive RET kinase activation independent of ligand. RET normally
          signals through GDNF family ligands and GFR-alpha co-receptors.
        cell_types:
        - preferred_term: type II pneumocyte
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        biological_processes:
        - preferred_term: protein phosphorylation
          modifier: INCREASED
          term:
            id: GO:0006468
            label: protein phosphorylation
      selected_evidence:
        snippet: Nearly 1% to 2% of NSCLCs harbor RET fusions, and this patient population may not respond
          well to traditional treatments like chemotherapy or radiation therapy.
        supports: SUPPORT
    origin:
