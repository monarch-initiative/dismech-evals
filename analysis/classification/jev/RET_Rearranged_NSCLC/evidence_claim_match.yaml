      assertion_type: Genetic
      assertion:
        name: RET
        gene_term:
          preferred_term: RET
          term:
            id: hgnc:9967
            label: RET
        association: Somatic Rearrangement
        inheritance:
        - name: Somatic
        notes: RET (10q11.21) encodes the rearranged during transfection receptor tyrosine kinase. Gene
          rearrangements occur somatically. Common fusion partners in NSCLC include KIF5B (~70-90%), CCDC6
          (~15-20%), and NCOA4. Germline RET mutations cause MEN2 syndrome; somatic RET fusions drive
          lung and thyroid cancers. Resistance mutations include G810R/S/C (solvent front) and V804L/M
          (gatekeeper).
      selected_evidence:
        snippet: Approximately 1-2% of non-small cell lung cancer (NSCLC) patients harbor RET (rearranged
          during transfection) fusions.
        supports: SUPPORT
