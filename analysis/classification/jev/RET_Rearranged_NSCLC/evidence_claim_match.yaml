      assertion_type: Pathophysiology
      assertion:
        name: RET Inhibitor Resistance
        description: Resistance to selective RET inhibitors can develop through secondary RET kinase mutations
          (G810R/S/C solvent front mutations, V804L/M gatekeeper), RET amplification, or bypass pathway
          activation (MET, KRAS, BRAF, SRC). RET-independent bypass resistance such as acquired MET or
          KRAS amplification is common, so post-progression molecular profiling is important.
        biological_processes:
        - preferred_term: response to drug
          modifier: ABNORMAL
          term:
            id: GO:0009410
            label: response to xenobiotic stimulus
      selected_evidence:
        snippet: Three resistant cases (15%) harbored acquired MET amplification
        supports: SUPPORT
