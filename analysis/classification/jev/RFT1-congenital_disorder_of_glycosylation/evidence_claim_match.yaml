        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Block in Transbilayer Completion of the Lipid-Linked Oligosaccharide
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'Assembly of the N-glycosylation donor is a two-compartment process: the Man5GlcNAc2-PP-dolichol
          intermediate is built on the cytosolic face of the ER and must reach the lumen for the remaining
          mannose and glucose residues to be added. In RFT1 deficiency this transition fails, and the
          pathway stalls at the Man5 intermediate. The step itself is not in doubt; what RFT1 actually
          does at this step is, and the two readings are curated as competing hypotheses below.'
        biological_processes:
        - preferred_term: dolichol-linked oligosaccharide biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0006488
            label: dolichol-linked oligosaccharide biosynthetic process
        locations:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
      selected_evidence:
        snippet: The substrate of N-linked glycosylation, dolichol pyrophosphate (DolPP)-GlcNAc(2)Man(9)Glc(3),
          is assembled through a complex series of ordered reactions requiring the translocation of the
          intermediate DolPP-GlcNAc(2)Man(5) structure across the endoplasmic-reticulum membrane.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
