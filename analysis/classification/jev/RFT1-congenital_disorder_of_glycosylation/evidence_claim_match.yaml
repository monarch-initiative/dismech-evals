      assertion:
        name: RFT1 Loss of Function
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: Biallelic pathogenic RFT1 variants reduce or abolish the function of RFT1, a multispanning
          ER membrane protein whose N and C termini both face the cytoplasm. The index allele, c.199C>T
          (p.Arg67Cys), was shown to be functionally deleterious by complementation assay in RFT1-null
          yeast, and most RFT1-CDG alleles reported since fall in regions of the protein that are highly
          conserved across eukaryotes.
        genes:
        - preferred_term: RFT1
          term:
            id: hgnc:30220
            label: RFT1
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          description: 'Reported genotypes are biallelic germline RFT1 variants, homozygous in the index
            case. Loss of function is established functionally: the index allele failed to complement
            RFT1-null yeast, and wild-type RFT1 cDNA restored normal glycosylation in patient fibroblasts.'
        locations:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
        cell_types:
        - preferred_term: Fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: Despite the low sequence similarity between the yeast and the human RFT1 proteins, we
          demonstrated both their functional orthology and the pathologic effect of the human p.R67C mutation
          by complementation assay in Deltarft1 yeast cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
