      assertion_type: Pathophysiology
      assertion:
        name: Multisystem Neurological and Sensory Disease
        biological_scale: ORGANISM
        role: consequence
        mechanism_confidence: ESTABLISHED
        description: 'Because N-glycosylation is required by a very large and functionally diverse set
          of secreted and membrane proteins, hypoglycosylation produces disease in many organs at once.
          In RFT1-CDG the burden falls most heavily on the nervous system and the ear: drug-resistant
          early-onset epilepsy, profound developmental impairment and visual failure, together with the
          sensorineural deafness that distinguishes this CDG from the others. Coagulation-factor hypoglycosylation
          adds a bleeding-and-thrombosis diathesis that proved fatal in the index case.'
      selected_evidence:
        snippet: Remarkably, all six patients with RFT1-CDG show sensorineural deafness as part of a severe
          neurological syndrome.
        supports: SUPPORT
