      reference_title: 'Congenital disorders of glycosylation: an update on defects affecting the biosynthesis
        of dolichol-linked oligosaccharides.'
      evidence_source: OTHER
      explanation: Explains why a precursor-assembly defect such as RFT1-CDG produces reduced site occupancy,
