      assertion:
        hypothesis_group_id: rft1_non_flippase_essential_role
        hypothesis_label: RFT1-Essential-But-Not-The-Flippase Model
        status: ALTERNATIVE
        description: 'Reconstitution work argues against RFT1 being the flippase itself: heptasaccharide
          lipid flipping proceeds in microsomes and in proteoliposomes reconstituted from ER membrane
          proteins without a requirement for RFT1, and at least one eukaryote does not need RFT1 for viability.
          On this reading RFT1 is genuinely essential for N-glycosylation in yeast and mammalian cells,
          and RFT1-CDG alleles are genuinely damaging, but the molecular activity being lost is something
          other than direct transbilayer transport — and has not yet been identified.'
      selected_evidence:
        snippet: However, other studies indicated that Rft1 is not required for heptasaccharide lipid
          flipping in microsomes or unilamellar vesicles reconstituted with ER membrane proteins, nor
          is it required for the viability of at least one eukaryote.
        supports: SUPPORT
