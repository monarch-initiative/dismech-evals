        context: []
      assertion_type: Genetic
      assertion:
        name: RFT1
        gene_term:
          preferred_term: RFT1
          term:
            id: hgnc:30220
            label: RFT1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        frequency: All reported patients (biallelic in every case)
        notes: 'RFT1 (3p21.1) encodes a multispanning ER membrane protein with cytoplasmic N and C termini.
          The index allele is the homozygous missense c.199C>T (p.Arg67Cys); most RFT1-CDG alleles reported
          since map to regions of the protein conserved across eukaryotes, consistent with damage to a
          shared functional core. Note that human and yeast RFT1 share only about 22% sequence identity,
          so functional orthology had to be demonstrated experimentally by complementation rather than
          assumed from sequence.

          Variant class and spectrum. Every RFT1-CDG allele reported is missense and biallelic; no null
          allele has been described, which is consistent with complete loss of RFT1 being incompatible
          with life. Alleles reported across the series include p.R67C (the index and recurrent allele),
          p.K152E and p.E298K (PMID:19701946), p.M408V and p.R442Q (PMID:23111317), and p.G276D, p.R25W
          and p.C70R (PMID:29923091), plus p.G340S (PMID:30071302).

          Where the alleles fall. The three earliest-characterised alleles all sit in hydrophilic loops
          predicted to face the ER lumen, which is the structural observation behind reading these as
          damaging a shared translocation-relevant surface rather than being scattered. Later work identified
          p.G340S in a transmembrane helix instead, so luminal-loop localisation is a strong tendency
          and not a rule — a variant outside the loops is not thereby benign. The same structural point
          is used diagnostically and is curated in the `diagnosis` section as well.

          Recurrence. p.R67C has been found homozygously in unrelated patients of British origin with
          no known relationship, which the reporting authors read as a possible founder effect rather
          than a mutational hotspot.'
      selected_evidence:
        snippet: The c.199C-->T mutation introduced the amino acid substitution p.R67C.
        supports: SUPPORT
