          group of CDG but does not identify the gene. Important caveat: it was normal in a genetically
          confirmed, lethally affected neonate, so a normal result does not exclude RFT1-CDG and should
          not stop a sequencing work-up when the clinical picture fits.'
      selected_evidence:
        snippet: Defects in the biosynthesis of the oligosaccharide precursor for N-glycosylation lead
          to decreased occupancy of glycosylation sites and thereby to diseases known as congenital disorders
          of glycosylation (CDG).
        supports: SUPPORT
