            term:
              id: MONDO:0012783
              label: RFT1-congenital disorder of glycosylation
        context: []
      assertion_type: Biochemical
      assertion:
        name: Transferrin Isoelectric Focusing Type I Pattern
        presence: PRESENT
        notes: RFT1-CDG is a defect of lipid-linked oligosaccharide assembly, so serum transferrin isoelectric
          focusing shows a CDG type I pattern (loss of whole N-glycans, and hence of glycosylation-site
          occupancy, rather than altered glycan processing). This is the standard first-line CDG screen
          and is what places a patient in the type I group before the gene is known.
      selected_evidence:
        snippet: Defects in the biosynthesis of the oligosaccharide precursor for N-glycosylation lead
          to decreased occupancy of glycosylation sites and thereby to diseases known as congenital disorders
          of glycosylation (CDG).
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/0
