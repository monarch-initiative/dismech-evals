      reference: PMID:33669941
      reference_title: Stationary and Progressive Phenotypes Caused by the p.G90D Mutation in Rhodopsin
        Gene.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Qualifies the "without retinal degeneration" clause of this description at the genotype
        level rather than supporting it. In this cohort of 15 p.G90D carriers only 20% were classified
        as CSNB while 53.3% had classic RP, so the authors advise against a CSNB diagnosis in p.G90D without
        long follow-up. Graded PARTIAL because CSNBAD1 as an entity remains defined as non-progressive
        (the same paper states "CSNB is considered a non-progressive rod dysfunction without retinal degeneration"
        and notes that other RHO-CSNB variants have not been associated with degeneration) — progressors
        are reclassified as RP rather than counted as degenerating CSNBAD1. The tension is between the
        nosological category and the genotype''s real range, and both halves are recorded here rather
        than one being dropped.

        '
