      assertion_type: Subtype
      assertion:
        name: CSNBAD1
        display_name: Congenital Stationary Night Blindness Autosomal Dominant 1
        subtype_term:
          preferred_term: congenital stationary night blindness autosomal dominant 1
          term:
            id: MONDO:0012498
            label: congenital stationary night blindness autosomal dominant 1
        description: 'Rare gain-of-function RHO branch (G90D, T94I) causing congenital, non-progressive
          night blindness without retinal degeneration. Constitutive rhodopsin activation generates dark
          continuous noise that saturates rod phototransduction in the absence of light. The absence of
          degeneration is definitional for CSNBAD1 as an entity rather than a prediction for every carrier
          of the variants named: in the largest p.G90D cohort characterized to date only 20% were classified
          as CSNB while 53.3% had classic retinitis pigmentosa, so p.G90D carriers specifically may progress
          and be reclassified (see the evidence below and the caveat on the Congenital night blindness
          phenotype). T94I, A292E, and A295V have not been associated with degeneration.

          '
      selected_evidence:
        snippet: Mutations in rhodopsin are also associated with dominant congenital stationary night
          blindness (adCSNB) and, less frequently, recessive RP (arRP).
        supports: SUPPORT
    origin:
