      assertion:
        name: Increased RHOBTB2 Protein Abundance
        biological_scale: MOLECULAR
        description: 'Mutant RHOBTB2 accumulates above wild-type levels. This is the node that makes the
          disorder a gain rather than a loss, and it is the reason a knockout is not a model of it. Later
          work adds subcellular detail: hotspot mutants accumulate specifically in the nucleus and mitochondria,
          and GTPase-domain mutants do not accumulate at all.'
      selected_evidence:
        snippet: Upon transfection of HEK293 cells, we found that mutant RHOBTB2 was more abundant than
          the wild-type, most likely because of impaired degradation in the proteasome
        supports: SUPPORT
