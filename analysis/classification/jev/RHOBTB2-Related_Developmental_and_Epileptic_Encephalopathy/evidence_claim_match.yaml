            term:
              id: MONDO:0033373
              label: developmental and epileptic encephalopathy, 64
        context: []
      assertion_type: Treatment
      assertion:
        name: Antiseizure Medication
        description: 'Management is symptomatic, with antiseizure drugs the mainstay. Response is genuinely
          variable rather than uniformly poor: 4 of the 7 patients with epilepsy in the movement-disorder
          series achieved seizure freedom, one infant remained seizure-free on oral sodium valproate over
          three months of follow-up, and valproate, carbamazepine and pyridoxine are each reported to
          work well in some patients - while another patient retained only partial control on triple therapy.
          No agent has disease-specific efficacy evidence, and no trial exists, so the agents named here
          are those reported to have helped rather than a recommended sequence.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: valproic acid
            term:
              id: CHEBI:39867
              label: valproic acid
          - preferred_term: carbamazepine
            term:
              id: CHEBI:3387
              label: carbamazepine
          - preferred_term: pyridoxine
            term:
              id: CHEBI:16709
              label: pyridoxine
        notes: 'An earlier draft of this entry described patients as achieving "at best partial control
          on multi-drug regimens". That was contradicted by the entry''s own cited sources and has been
          corrected: seizure freedom is reported both at cohort level (4 of 7) and in a single-patient
          report on valproate monotherapy. The drug-resistant-epilepsy phenotype curated above remains
          accurate for the patients in whom it is reported; the two coexist because response varies across
          the reported population, and neither generalizes. The accumulation mechanism suggests lowering
          mutant protein abundance as a rational target, but no such approach has been tested, and the
          dosage discussion records why the therapeutic window is not yet defined.'
      selected_evidence:
        snippet: The treatment of epilepsy-related encephalopathy associated with RHOBTB2 variants primarily
          relies on symptomatic treatment, with antiepileptic drugs (AEDs) being the mainstay
        supports: SUPPORT
