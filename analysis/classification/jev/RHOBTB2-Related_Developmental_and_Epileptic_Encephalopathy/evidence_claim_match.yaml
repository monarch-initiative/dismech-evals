              label: developmental and epileptic encephalopathy, 64
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Proteasomal Degradation of RHOBTB2
        biological_scale: MOLECULAR
        description: RHOBTB2 binds the CUL3 ubiquitin ligase scaffold through its first BTB domain and
          is itself a substrate of that complex, so a BTB-domain variant disrupts the protein's own destruction
          rather than only its adaptor function. This node is the turnover defect; the resulting abundance
          change is curated separately below because they are measured separately and, in the GTPase-domain
          variants, they come apart.
        biological_processes:
        - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
          modifier: DECREASED
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
        cellular_components:
        - preferred_term: cullin-RING ubiquitin ligase complex
          term:
            id: GO:0031461
            label: cullin-RING ubiquitin ligase complex
      selected_evidence:
        snippet: we demonstrate that RhoBTB2 binds to the ubiquitin ligase scaffold, Cul3, via its first
          BTB domain and show in vitro and in vivo that RhoBTB2 is a substrate for a Cul3-based ubiquitin
          ligase complex
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15107402
      reference_title: RhoBTB2 is a substrate of the mammalian Cul3 ubiquitin ligase complex.
      evidence_source: IN_VITRO
      explanation: Establishes the baseline biology this disorder subverts - RHOBTB2 is both adaptor and
        substrate, and the BTB domain is the CUL3-binding interface.
