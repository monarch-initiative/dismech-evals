        context: []
      assertion_type: Genetic
      assertion:
        name: RHOBTB2
        gene_term:
          preferred_term: RHOBTB2
          term:
            id: hgnc:18756
            label: RHOBTB2
        relationship_type: CAUSATIVE
        association: Heterozygous de novo missense variants in the BTB-domain-encoding region of RHOBTB2
          cause DEE64 by impairing the protein's own proteasomal degradation, so that mutant RHOBTB2 accumulates.
          The variant spectrum is dominated by two arginine hotspots within the BTB domain, Arg483 and
          Arg511, which together account for roughly half of the ~30 reported variants across ~60 reported
          cases; p.Arg511Gln, p.Arg483His and p.Arg511Trp each individually exceed a 10 percent incidence
          rate. Both hotspot residues are non-conserved across species, which is one reason the mechanism
          could not be read off conservation alone.
        notes: 'Variant residue numbering differs between publications - the founding cohort and the 2026
          inducible-cell study use different numbering for the hotspot residues - and each is quoted here
          as published rather than reconciled to one convention, since no source available to this entry
          states the mapping. RHOBTB2 has a separate identity as a candidate tumour suppressor, where
          loss of function rather than accumulation is the disease-relevant direction. That literature
          is not curated here, but it is the reason the dosage argument in the discussions matters: the
          same gene is reported to be pathogenic when there is too little of it and when there is too
          much.'
      selected_evidence:
        snippet: We have established missense variants in the BTB-domain-encoding region of RHOBTB2 as
          causative for a developmental and epileptic encephalopathy
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
