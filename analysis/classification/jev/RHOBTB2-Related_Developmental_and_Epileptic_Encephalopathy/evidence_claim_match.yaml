      assertion_type: Pathophysiology
      assertion:
        name: Deregulated Ion Channel Gene Expression
        biological_scale: CELLULAR
        description: Transcriptomic work in flies overexpressing RhoBTB found ion channel genes enriched
          among the differentially expressed set, and the enriched molecular functions among downregulated
          genes are receptor, channel and transporter activities. An independent inducible cell model
          found the R489Q hotspot mutant robustly downregulates ion-channel-related genes.
        notes: 'Term binding: the measurement here is on ion-channel gene EXPRESSION, not on transporter
          activity, so the node binds GO:0010468 regulation of gene expression with a more specific free-text
          preferred_term. The obvious ion-channel-flavoured alternatives do not work. GO:0032413 is negative
          regulation of ion transmembrane transporter activity, whose baked-in direction contradicts a
          DYSREGULATED modifier and whose subject is activity rather than expression; its non-directional
          parent GO:0032412 is obsolete. There is no GO term for regulation of ion-channel gene expression
          specifically, so the specificity is carried by preferred_term rather than by a worse-fitting
          bound term.'
        biological_processes:
        - preferred_term: regulation of ion channel gene expression
          modifier: DYSREGULATED
          term:
            id: GO:0010468
            label: regulation of gene expression
      selected_evidence:
        snippet: We now found enrichment for ion channels among the differentially expressed genes from
          RNA-Seq on fly heads overexpressing RhoBTB
        supports: SUPPORT
