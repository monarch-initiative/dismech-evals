      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Basal Body Positioning and Epithelial Branching Morphogenesis
        biological_scale: TISSUE
        description: 'Tmem67-knockout mice show basal body and kinocilium positioning defects with the
          basal body complex uncoupled from the hair bundle, together with failed epithelial branching
          morphogenesis, pulmonary hypoplasia, axial shortening and limb abnormalities. Notably, planar
          cell polarity and apical planar asymmetry in the organ of Corti were normal, so the defect is
          basal body migration rather than polarity establishment. None of this corresponds to the RHYNS
          phenotype, which is the point of the model mismatch recorded below; it is the developmental
          mechanism the gene is known to serve.

          '
        biological_processes:
        - preferred_term: branching morphogenesis of an epithelial tube
          term:
            id: GO:0048754
            label: branching morphogenesis of an epithelial tube
          modifier: DECREASED
      selected_evidence:
        snippet: The basal body/kinocilium complex was often uncoupled from the hair bundle, suggesting
          aberrant basal body migration, although planar cell polarity and apical planar asymmetry in
          the organ of Corti were normal.
        supports: SUPPORT
