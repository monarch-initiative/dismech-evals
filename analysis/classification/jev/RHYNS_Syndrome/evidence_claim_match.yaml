      about:
        disease:
          name: RHYNS Syndrome
          disease_term:
            preferred_term: RHYNS syndrome
            term:
              id: MONDO:0011202
              label: RHYNS syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular diagnosis by exome sequencing or a ciliopathy gene panel
        description: 'RHYNS is diagnosed clinically on the phenotype combination and confirmed molecularly
          by finding biallelic TMEM67 variants. The genetic basis was unknown for twenty-one years and
          was solved by whole-exome sequencing of the originally described family, which is the practical
          point: a targeted single-gene approach would not have found it, because nobody knew which gene
          to target. With four reported patients and a gene whose allelic series spans eight clinical
          conditions, a broad ciliopathy panel or exome is the appropriate test rather than a RHYNS-specific
          one.

          '
      selected_evidence:
        snippet: Here we applied whole-exome sequencing in the originally described family with RHYNS
          to identify compound heterozygous variants in the ciliary gene TMEM67.
