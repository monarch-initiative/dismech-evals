        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: 'Autosomal recessive, established molecularly by compound heterozygosity in the original
          family: a paternally inherited nonsense allele and a maternally inherited missense allele. Before
          the gene was known, recessive inheritance was inferred from two affected brothers, with the
          caveat that X-linkage could not be excluded because all four reported patients were male. The
          molecular finding resolves that in favour of autosomal recessive.

          '
      selected_evidence:
        snippet: The presence of RHYNS in two siblings supports an autosomal recessive mode of inheritance;
          however, since all four known cases were male, an X-linked mode of inheritance cannot be excluded.
        supports: SUPPORT
        directness: INDIRECT
