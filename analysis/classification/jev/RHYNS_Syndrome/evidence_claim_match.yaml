        context: []
      assertion_type: Genetic
      assertion:
        name: TMEM67
        gene_term:
          preferred_term: TMEM67
          term:
            id: hgnc:28396
            label: TMEM67
        association: CAUSATIVE
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Biallelic TMEM67 variants, identified by whole-exome sequencing of the originally described
          family. TMEM67 encodes meckelin, a ciliary transition zone protein, and carries one of the widest
          allelic series in the ciliopathies; RHYNS was the eighth distinguishable clinical condition
          attributed to it. The RHYNS genotype in the index family pairs a truncating allele with a missense
          allele that acts through mis-splicing rather than through amino acid substitution alone, which
          is consistent with a hypomorphic combination at the mild end of the series.

          '
        variants:
        - name: c.622A>T (p.Arg208*)
          description: Paternally inherited nonsense allele.
          clinical_significance: PATHOGENIC
        - name: c.1289A>G (p.Asp430Gly)
          description: Maternally inherited missense allele that perturbs correct splicing of exon 13,
            so its consequence is a splicing defect rather than the substitution itself.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Here we applied whole-exome sequencing in the originally described family with RHYNS
          to identify compound heterozygous variants in the ciliary gene TMEM67.
        supports: SUPPORT
