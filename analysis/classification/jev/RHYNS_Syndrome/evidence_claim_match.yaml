              label: RHYNS syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: Oligogenic contribution from other ciliopathy genes
        association: MODIFIER
        relationship_type: MODIFIER
        variant_origin: GERMLINE
        features: 'An open possibility rather than a finding in RHYNS. Oligogenic inheritance is documented
          in the transition zone ciliopathies, where a second variant in another ciliopathy gene has been
          proposed to modify the phenotype. That is relevant here because the entry''s central inference
          is that the RHYNS genotype sits at the hypomorphic end of the TMEM67 series, and a modifier
          is one of the ways a genotype ends up there. No second-locus variant has been reported in a
          RHYNS patient; the original family was solved by exome sequencing, which would have had the
          opportunity to find one.

          '
      selected_evidence:
        snippet: The fetus inherited an additional likely pathogenic novel missense change to a second
          MKS gene, CEP290; p.R2210C, suggesting oligogenic inheritance in this disorder.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /genetic/1
      evidence_path: /genetic/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
