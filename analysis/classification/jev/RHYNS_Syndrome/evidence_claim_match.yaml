  6f5068a31cd0291828219cf3b30d89a6c6e6a33da1e63eaa4f32f5cfbe485064:
    claim:
      about:
        disease:
          name: RHYNS Syndrome
          disease_term:
            preferred_term: RHYNS syndrome
            term:
              id: MONDO:0011202
              label: RHYNS syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Photoreceptor Degeneration
        biological_scale: TISSUE
        description: 'Retinal photoreceptor degeneration giving retinitis pigmentosa, present in all four
          reported patients and the first letter of the acronym. The mechanism is assumed rather than
          shown: the photoreceptor connecting cilium is a specialised transition zone, which is where
          meckelin sits, so a transition zone defect is the obvious candidate route. No source curated
          here demonstrates it in TMEM67 disease.

          What the sources do show cuts the other way and makes this node the most anomalous thing in
          the entry. In a prospectively evaluated cohort of 100 patients with Joubert syndrome and related
          disorders, retinal degeneration was *absent* in TMEM67 patients as a genotype-phenotype correlation.
          So retinitis pigmentosa is not merely unexplained in RHYNS, it runs against the established
          pattern for the gene, which is recorded as a knowledge gap below and which strengthens rather
          than weakens the case for RHYNS as a distinct entity.

          '
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
      selected_evidence:
        snippet: TMEM67 was frequently associated with kidney disease.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/1
      context_paths:
