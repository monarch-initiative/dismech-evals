              label: RIN2 syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: RIN2
        gene_term:
          preferred_term: RIN2
          term:
            id: hgnc:18750
            label: RIN2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_7427a25e-68a1-4e1b-b951-f1a1d7b1e52b-2023-12-04T170000.000Z
        notes: Biallelic loss-of-function variants in RIN2 (Ras and Rab interactor 2) cause RIN2 syndrome;
          reported variants are frameshift/truncating and act through nonsense-mediated decay. RIN2 is
          a Rab5-interacting protein that regulates early endocytic membrane trafficking; it carries a
          VPS9 domain that confers Rab5 guanyl-nucleotide exchange factor activity, so it acts as both
          a Rab5 GEF and effector. The cited abstracts describe the trafficking role ("interacts with
          Rab5"/"regulation of Rab5-mediated early endocytosis"); the GEF activity bound at the pathophysiology
          node is supported by the VPS9 domain rather than by those quoted sentences. ClinGen classifies
          the RIN2-RIN2 syndrome relationship as Definitive (autosomal recessive, Lysosomal Diseases GCEP).
      selected_evidence:
        snippet: a homozygous frameshift mutation in RIN2 was found to segregate with the disease phenotype
          in a large consanguineous kindred
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /genetic/0
