            term:
              id: MONDO:0014656
              label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
                recessive 2
        context: []
      assertion_type: Genetic
      assertion:
        name: RNASEH1
        notes: RNASEH1 (2p25.3) encodes ribonuclease H1, whose longer isoform carries a mitochondrial
          targeting sequence. Reported pathogenic variants include the recurrent catalytic-domain missense
          c.424G>A p.Val142Ile, c.487T>C, the in-frame c.258_260del in the connection domain, the splice
          variant c.129-3C>G (exon 2 skipping in muscle RNA), and c.86A>G p.Tyr29Cys in the hybrid-binding
          domain. Most tested variants reduce enzyme activity; p.Tyr29Cys is the documented exception,
          increasing hybrid-cleaving activity while impairing primer formation.
        gene_term:
          preferred_term: RNASEH1
          term:
            id: hgnc:18466
            label: RNASEH1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Next-generation sequencing led to the identification of compound-heterozygous RNASEH1
          mutations in two singleton subjects and a homozygous mutation in four siblings.
        supports: SUPPORT
