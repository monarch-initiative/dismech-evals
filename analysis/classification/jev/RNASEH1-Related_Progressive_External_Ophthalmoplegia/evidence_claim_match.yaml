      assertion_type: Pathophysiology
      assertion:
        name: Pathogenic RNASEH1 Variants Disrupt RNase H1 Function
        biological_scale: MOLECULAR
        description: 'Biallelic RNASEH1 variants disrupt ribonuclease H1. For most alleles this is loss
          of function: RNase H1 protein is virtually absent from mutant fibroblasts, and the altered enzymes
          remove RNA from RNA:DNA hybrids less efficiently. One hybrid-binding-domain allele (p.Tyr29Cys)
          instead increases hybrid-cleaving activity while impairing primer formation, so the shared lesion
          is loss of correctly regulated RNase H1 function rather than uniformly reduced activity.'
        genes:
        - preferred_term: RNASEH1
          term:
            id: hgnc:18466
            label: RNASEH1
        molecular_functions:
        - preferred_term: RNA-DNA hybrid ribonuclease activity
          modifier: DECREASED
          term:
            id: GO:0004523
            label: RNA-DNA hybrid ribonuclease activity
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: By an in vitro assay, we demonstrated that altered RNase H1 has a reduced capability
          to remove the RNA from RNA-DNA hybrids, confirming their pathogenic role.
        supports: SUPPORT
