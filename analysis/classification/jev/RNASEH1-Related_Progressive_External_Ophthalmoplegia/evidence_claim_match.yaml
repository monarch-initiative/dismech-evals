      assertion:
        name: Rnaseh1 null mouse
        species: Mouse
        genotype: Rnaseh1-/- (constitutive knockout of the catalytic-domain exons)
        publication: PMID:12667461
        description: Constitutive Rnaseh1 knockout mice arrest at embryonic day 8.5 with reduced mtDNA
          content and apoptosis. This established RNase H1 as required for mtDNA generation, but a null
          embryonic lethal cannot model an adult-onset disease caused by hypomorphic or dysregulating
          alleles.
        modeled_mechanisms:
        - target: Stalled and Incomplete mtDNA Replication
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: Loss of mtDNA content in vivo when RNase H1 is absent.
          limitations: A complete null that is lethal at E8.5 shows mtDNA depletion in embryos, not the
            multiple deletions in adult post-mitotic muscle that define the human disease, and human alleles
            are not nulls.
      selected_evidence:
        snippet: A fraction of the mainly nuclear RNase H1 was targeted to mitochondria, and its absence
          in embryos resulted in a significant decrease in mitochondrial DNA content, leading to apoptotic
          cell death.
        supports: SUPPORT
