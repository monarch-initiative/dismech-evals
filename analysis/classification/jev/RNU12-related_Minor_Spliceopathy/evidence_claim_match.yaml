              id: MONDO:1060223
              label: RNU12-related minor spliceopathy disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: U12-type intron retention and transcriptome dysregulation
        description: Loss of normal minor spliceosome activity causes selective disruption of U12-type
          intron splicing with downstream transcriptome-wide dysregulation in minor intron-containing
          genes. Tissue-specific sensitivity to this shared splicing lesion likely determines whether
          the dominant presentation is cranio-cutaneous malformation or cerebellar neurodegeneration.
        biological_processes:
        - preferred_term: U12-type intron splicing
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: DECREASED
      selected_evidence:
        snippet: Reverse transcriptase PCR demonstrated minor intron retention in all of 9 randomly selected
          RNAs from this group, and RNAseq showed splicing disruption specific to all U12-type introns
          detected in blood monocytes from affected individuals.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27863452
      reference_title: Mutation in noncoding RNA RNU12 causes early onset cerebellar ataxia.
      evidence_source: HUMAN_CLINICAL
      explanation: Demonstrates selective U12-type intron retention in the ataxia presentation.
