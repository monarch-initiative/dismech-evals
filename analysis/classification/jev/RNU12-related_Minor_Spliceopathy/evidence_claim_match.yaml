            mapping_predicate: skos:exactMatch
            mapping_source: Orphanet ORPHA:512260
            mapping_justification: MONDO:0033717 is the Orphanet-derived term (ORPHA:512260) and MONDO:0859360
              the OMIM-derived term (OMIM:620208) for the same disease. Orphanet lists both MONDO:0033717
              and OMIM:620208 as exact cross-references of ORPHA:512260, and both rest on the single consanguineous
              family reported in PMID:27863452.
      selected_evidence:
        snippet: WGS revealed a point mutation in noncoding RNA RNU12 that was associated with early onset
