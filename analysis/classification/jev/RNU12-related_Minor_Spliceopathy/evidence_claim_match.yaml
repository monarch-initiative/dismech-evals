        description: Early-onset neurologic presentation characterized by autosomal recessively inherited
          cerebellar ataxia manifesting before 2 years of age, with differential expression of minor intron-containing
          RNAs including genes associated with cerebellar neurodegeneration. Orphanet names the same disease
          congenital cerebellar ataxia due to RNU12 mutation (ORPHA:512260; MONDO:0033717) and describes
          infantile delayed motor milestones, hypotonia, intention tremor, nystagmus, dysarthria, and
          mixed cerebellar hypoplasia and vermian degeneration on imaging. It differs from the CDAGS subtype
          in being a purely neurologic presentation caused by a homozygous RNU12 point mutation rather
          than compound heterozygous alleles.
        subtype_term:
          preferred_term: spinocerebellar ataxia, autosomal recessive 33
          term:
            id: MONDO:0859360
            label: spinocerebellar ataxia, autosomal recessive 33
