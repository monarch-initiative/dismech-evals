      assertion_type: Pathophysiology
      assertion:
        name: Minor spliceosome dysfunction from RNU12 variants
        description: Biallelic RNU12 variants disrupt the U12 small nuclear RNA, a core RNA component
          of the minor spliceosome. This compromises minor spliceosome stability and function and impairs
          normal processing of U12-type introns.
        genes:
        - preferred_term: RNU12
          term:
            id: hgnc:19380
            label: RNU12
        biological_processes:
        - preferred_term: U12-type intron splicing
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: DECREASED
      selected_evidence:
        snippet: RNU12 encodes a small nuclear RNA that is a component of the minor spliceosome and is
          essential for minor intron splicing.
        supports: SUPPORT
