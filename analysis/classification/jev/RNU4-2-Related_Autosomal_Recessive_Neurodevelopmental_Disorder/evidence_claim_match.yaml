      assertion:
        discussion_id: recessive_rnu4_2_splicing_defect_undetected
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced RNU4-2 U4 snRNA Level
        - pathophysiology#Impaired Brain Development
        prompt: What splicing defect, if any, links the reduction in U4 snRNA to the neurodevelopmental
          and white matter phenotype?
        rationale: Blood RNA sequencing from biallelic individuals shows neither the ReNU 5' splice site
          signature nor the intron retention that equivalent RNU4ATAC variants cause, so no splicing consequence
          is in this entry's pathograph and the entry does not conform to the module's mis-splicing node.
          The authors suggest the defect is subtle because a global defect in U2-type introns would not
          be viable, and that it may only be visible with deeper sequencing or in brain-relevant cells.
          Whether RNU4-1 upregulation compensates in blood but not in brain is part of the same question.
      selected_evidence:
        snippet: we found no significant intron retention events in either individuals with biallelic
          variants in RNU4-2 or individuals with ReNU syndrome
        supports: SUPPORT
