      assertion:
        name: Genome sequencing with RNU4-2 interrogation
        description: RNU4-2 is a short snRNA gene found by genome sequencing. The marked periventricular
          perivascular space dilation on MRI should prompt analysis of RNU4-2. Because saturation editing
          scores are less sensitive for recessive variants, a normal score is not evidence of benignity
          in this setting, and the authors recommend only supporting-level weight for significant scores.
          A reduced RNU4-2 to RNU4-1 expression ratio in blood RNA sequencing is a candidate diagnostic
          biomarker that still needs validation.
        diagnosis_term:
          preferred_term: clinical whole genome sequencing
          term:
            id: NCIT:C101294
            label: Whole Genome Sequencing
      selected_evidence:
        snippet: The presence of these changes on MRI, particularly the marked periventricular perivascular
          space dilation, should prompt sequencing and analysis of variants in RNU4-2.
