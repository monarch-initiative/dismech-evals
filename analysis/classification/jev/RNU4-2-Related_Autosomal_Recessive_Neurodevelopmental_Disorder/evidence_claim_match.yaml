        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Affected individuals carry two RNU4-2 variants, either homozygous or compound heterozygous.
          In the expanded cohort of 43 individuals, 15 from 11 families were homozygous and 27 from 22
          families compound heterozygous, and all eight individuals with consanguineous parents were homozygous.
          Heterozygous carriers of variants with significant saturation editing scores are unaffected
          parents, and UK Biobank participants carrying biallelic variants, almost all with weak function
          scores, had no neurodevelopmental phenotype. No parent-of-origin bias was found among compound
          heterozygous variants.
      selected_evidence:
        snippet: Here we describe a new recessive NDD associated with homozygous and compound heterozygous
          variants in RNU4-2.
        supports: SUPPORT
