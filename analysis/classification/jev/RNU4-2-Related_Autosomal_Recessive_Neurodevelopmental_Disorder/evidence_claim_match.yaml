  760da6b161df9de161df58bd3838360a8b65f50f90ac59eea392ea910fc50d1d:
    claim:
      about:
        disease:
          name: RNU4-2-Related Autosomal Recessive Neurodevelopmental Disorder
          disease_term:
            preferred_term: RNU4-2-related autosomal recessive neurodevelopmental disorder
        context: []
      assertion_type: Genetic
      assertion:
        name: RNU4-2
        gene_term:
          preferred_term: RNU4-2
          term:
            id: hgnc:10193
            label: RNU4-2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'RNU4-2 encodes U4 snRNA of the major spliceosome. The 38 characterized individuals carried
          35 unique variants: seven homozygous in 13 individuals and 31 in the compound heterozygous state
          in 25. Only 20 of the 35 scored significantly in saturation genome editing, which measures fitness
          in haploid HAP1 cells and is less sensitive for recessive variants than for ReNU variants; the
          rest lie in the same structural elements. Under ACMG/AMP criteria one variant was pathogenic,
          eight likely pathogenic and the rest of uncertain significance, and only 10 of 38 individuals
          had two pathogenic or likely pathogenic alleles, so some cohort members may prove to be false
          positives. The authors use the region boundaries stem II n.3-n.16, 5'' stem loop n.20-n.52 with
          the k-turn at n.27-n.35 and n.41-n.46, Sm site n.118-n.126 and terminal stem loop n.127-n.144.
          No ClinGen gene-disease validity record exists for this pair. RNU4-2 is a non-coding gene, so
          the snRNA has no protein molecular function.'
        variants:
        - name: n.7G>C
          variant_type: single nucleotide variant
          description: In stem II (n.3-n.16), the region of U4 that pairs with U6. Seen both homozygous
            and compound heterozygous.
        - name: n.119A>G
          variant_type: single nucleotide variant
          description: In the Sm protein binding site (n.118-n.126), needed for snRNA biogenesis and stability.
            Seen both homozygous and compound heterozygous.
        - name: n.127C>T
          variant_type: single nucleotide variant
          description: At the first nucleotide of the terminal stem loop (n.127-n.144), next to the Sm
            site. Seen both homozygous and compound heterozygous.
      selected_evidence:
        snippet: we identified biallelic RNU4-2 variants in six of 5,386 trios with undiagnosed NDD, compared
          to zero of 4,776 trios with non-NDD phenotypes
        supports: SUPPORT
