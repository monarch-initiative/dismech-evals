  aba89268a35c0c100e40ca878f153106f6a15436ec182638c7bafe158dee3dbf:
    claim:
      about:
        disease:
          name: RNU4-2-Related Autosomal Recessive Neurodevelopmental Disorder
          disease_term:
            preferred_term: RNU4-2-related autosomal recessive neurodevelopmental disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced RNU4-2 U4 snRNA Level
        description: In blood RNA sequencing from the Genomics England National Genomic Research Library,
          three individuals with biallelic variants had RNU4-2 expression about one fifth of controls
          (mean 314 versus 1,645 TPM), and heterozygous carriers of significant variants a more moderate
          reduction. Individuals with ReNU syndrome instead had raised RNU4-2. The authors read this as
          loss of function. Whether the reduction comes from impaired Sm ring loading and snRNP assembly,
          consistent with where the variants lie, or from another step in U4 biogenesis or decay has not
          been tested. Evidence is from patient blood transcriptomes.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: RNU4-2
          term:
            id: hgnc:10193
            label: RNU4-2
        cellular_components:
        - preferred_term: U4 snRNP
          term:
            id: GO:0005687
            label: U4 snRNP
      selected_evidence:
        snippet: Using RNA-seq data, we show that individuals with biallelic variants in RNU4-2 have dramatically
          reduced levels of RNU4-2 RNA, which is consistent with a loss-of-function mechanism.
        supports: SUPPORT
