  ce921fdf1f56c3b923b512505a6bf9a5264ba6835956865429eb1458e1bae077:
    claim:
      about:
        disease:
          name: RNU4-2-Related Autosomal Recessive Neurodevelopmental Disorder
          disease_term:
            preferred_term: RNU4-2-related autosomal recessive neurodevelopmental disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic RNU4-2 Stem II, K-Turn or Sm-Site Variants
        conforms_to: spliceosome_component_dysfunction#Germline Spliceosome Component Variant
        description: 'Two germline RNU4-2 variants, one on each allele, alter U4 snRNA outside the ReNU
          critical region, in the elements that bind other spliceosome components: stem II, which pairs
          with U6; the k-turn in the 5'' stem loop, which binds SNU13 (15.5K); and the Sm protein binding
          site, which is needed for snRNA biogenesis and stability. Variants also occur in the terminal
          stem loop. UK Biobank biallelic variants sit elsewhere, half of them in the 3'' stem loop, where
          no case variant was found. For about a third of case variants the equivalent nucleotide in RNU4ATAC
          carries a pathogenic variant causing a recessive RNU4atac-opathy. Evidence for the variant spectrum
          and its structural mapping is from human genetic cohorts; the function scores come from saturation
          genome editing in haploid HAP1 cells.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: RNU4-2
          term:
            id: hgnc:10193
            label: RNU4-2
        cellular_components:
        - preferred_term: U4/U6 snRNP
          term:
            id: GO:0071001
            label: U4/U6 snRNP
      selected_evidence:
        snippet: 'We identify 38 individuals with biallelic variants outside the 18-nucleotide ReNU syndrome
          region that cluster within other functionally important elements of U4: Stem II, the k-turn
          and the Sm protein binding site.'
        supports: SUPPORT
    origin:
