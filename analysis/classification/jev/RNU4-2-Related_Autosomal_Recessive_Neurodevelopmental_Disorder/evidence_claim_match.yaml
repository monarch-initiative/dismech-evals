      assertion_type: DifferentialDiagnosis
      assertion:
        name: ReNU syndrome
        description: The dominant RNU4-2 disorder, caused by usually de novo heterozygous variants in
          the 18-nucleotide critical region (T-loop and stem III). It shares developmental delay, language
          impairment and seizures, but differs in facial gestalt, lacks the confluent microcystic perivascular
          space pattern and cerebellar atrophy, shows raised rather than reduced RNU4-2 levels, and has
          a systematic 5' splice site signature that the recessive disorder lacks.
        disease_term:
          preferred_term: ReNU syndrome
          term:
            id: MONDO:0971172
            label: neurodevelopmental disorder with hypotonia, brain anomalies, distinctive facies, and
              absent language
        distinguishing_features:
        - Dominant, usually de novo heterozygous rather than biallelic
        - Variants inside the 18-nucleotide critical region
        - Raised rather than reduced RNU4-2 transcript
        - Systematic 5' splice site changes on blood RNA sequencing
        - No confluent microcystic perivascular space pattern and no cerebellar atrophy
      selected_evidence:
        snippet: We showed that the recessive NDD is distinct from dominant ReNU syndrome at the genetic,
          phenotypic and mechanistic levels.
        supports: SUPPORT
