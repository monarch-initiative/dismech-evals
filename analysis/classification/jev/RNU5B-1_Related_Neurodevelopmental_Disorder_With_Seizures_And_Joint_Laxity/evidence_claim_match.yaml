  2dd12286170347c8907af3154a21600acf9ee5c8fedc781ce39bd3b0bef6d462:
    claim:
      about:
        disease:
          name: RNU5B-1 Related Neurodevelopmental Disorder With Seizures And Joint Laxity
          disease_term:
            preferred_term: RNU5B-1 related neurodevelopmental disorder with seizures and joint laxity
            term:
              id: MONDO:1060179
              label: RNU5B-1 related neurodevelopmental disorder with seizures and joint laxity
        context:
        - path: /discussions/0
          value:
            discussion_id: rnu5b1_which_splicing_errors_cause_phenotype
            kind: KNOWLEDGE_GAP
            status: OPEN
            attaches_to:
            - pathophysiology#Variant-Specific Altered Splice Site Usage
            - pathophysiology#Reduced or Aberrant U5B snRNP Pool
            - pathophysiology#Abnormal Brain Development
            prompt: Which splicing errors caused by RNU5B-1 loop I variants produce the neurodevelopmental
              phenotype?
            rationale: 'The only patient splicing data come from cultured lymphocytes of four RNU5B-1
              carriers. These showed no shared 5'' or 3'' splice-site signature, unlike ReNU syndrome,
              and the two recurrent variants appeared to act differently: n.39C>G mainly on 5'' splice
              sites, n.44A>G mainly on 3'' splice sites. No affected transcript has been tied to a neurodevelopmental
              gene, there are no neural RNA data, and the clinical picture may differ by variant (macrocephaly
              in two n.39C>G carriers, acquired microcephaly in three n.44A>G carriers). Whether the mutant
              U5 acts by dominant negative or altered-function effect has not been tested. A loop I model
              predicts that each variant re-weights splice sites whose upstream-exon sequence pairs with
              the mutant loop, which would make the target set variant-specific and could explain the
              clinical heterogeneity; that prediction is untested. A competing model holds that quality
              control degrades the mutant snRNA or that a stabilized mutant poisons spliceosomes broadly,
              which predicts diffuse rather than variant-specific disruption; measuring the level and
              spliceosome incorporation of mutant U5B-1 separates the two.'
          role: ancestor
      assertion_type: Experiment
      assertion:
        experiment_id: rnu5b1_mutant_u5_fate
        experiment_design: TARGETED_PERTURBATION
        name: Level and spliceosome incorporation of mutant U5B-1
        description: In patient lymphoblastoid cells and in the isogenic iPSC-derived neurons above, measure
          mature U5B-1 by allele-specific small RNA-seq or primer extension, compare with RNU5A-1 and
          total U5, and test whether mutant U5B-1 is found in U5 snRNP, tri-snRNP and spliceosome fractions
          by affinity purification or glycerol-gradient fractionation followed by allele-specific sequencing.
          Repeat with quality-control factors such as the NEXT-exosome or TUT4/7 depleted to see whether
          mutant U5B-1 is being degraded.
        would_support:
        - mechanistic_hypotheses#rnu5b1_snrna_qc_loss_or_poisoning
        would_refute:
        - mechanistic_hypotheses#rnu5b1_snrna_qc_loss_or_poisoning
        supporting_outcome:
        - Mutant U5B-1 is depleted relative to the wild-type allele and recovers when quality control
          is inhibited, or it is incorporated but splicing changes are broad rather than variant-specific.
        refuting_outcome:
        - Mutant U5B-1 accumulates at wild-type levels and is incorporated into spliceosomes, which leaves
          altered splice-site selection by the mutant loop as the more likely mechanism.
      selected_evidence:
        snippet: These pathways also repress mutant snRNAs associated with human developmental disorders.
        supports: SUPPORT
