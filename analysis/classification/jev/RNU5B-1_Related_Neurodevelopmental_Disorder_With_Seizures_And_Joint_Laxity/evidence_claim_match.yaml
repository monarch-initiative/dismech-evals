  92704c9d56bc5c95e459889230e3e383b303a2c3f9c28837bf549ba4f97b8cdc:
    claim:
      about:
        disease:
          name: RNU5B-1 Related Neurodevelopmental Disorder With Seizures And Joint Laxity
          disease_term:
            preferred_term: RNU5B-1 related neurodevelopmental disorder with seizures and joint laxity
            term:
              id: MONDO:1060179
              label: RNU5B-1 related neurodevelopmental disorder with seizures and joint laxity
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rnu5b1_which_splicing_errors_cause_phenotype
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Variant-Specific Altered Splice Site Usage
        - pathophysiology#Reduced or Aberrant U5B snRNP Pool
        - pathophysiology#Abnormal Brain Development
        prompt: Which splicing errors caused by RNU5B-1 loop I variants produce the neurodevelopmental
          phenotype?
        rationale: 'The only patient splicing data come from cultured lymphocytes of four RNU5B-1 carriers.
          These showed no shared 5'' or 3'' splice-site signature, unlike ReNU syndrome, and the two recurrent
          variants appeared to act differently: n.39C>G mainly on 5'' splice sites, n.44A>G mainly on
          3'' splice sites. No affected transcript has been tied to a neurodevelopmental gene, there are
          no neural RNA data, and the clinical picture may differ by variant (macrocephaly in two n.39C>G
          carriers, acquired microcephaly in three n.44A>G carriers). Whether the mutant U5 acts by dominant
          negative or altered-function effect has not been tested. A loop I model predicts that each variant
          re-weights splice sites whose upstream-exon sequence pairs with the mutant loop, which would
          make the target set variant-specific and could explain the clinical heterogeneity; that prediction
          is untested. A competing model holds that quality control degrades the mutant snRNA or that
          a stabilized mutant poisons spliceosomes broadly, which predicts diffuse rather than variant-specific
          disruption; measuring the level and spliceosome incorporation of mutant U5B-1 separates the
          two.'
        proposed_experiments:
        - experiment_id: rnu5b1_neuronal_splicing_by_variant
          experiment_design: TARGETED_PERTURBATION
          name: Splicing profiles of RNU5B-1 variants in human neural cells
          description: Introduce n.39C>G, n.42_43insA, n.44A>G and n.37G>C, each heterozygous, into an
            isogenic human iPSC line, differentiate to neural progenitors and cortical neurons, and profile
            splicing by deep RNA-seq with and without NMD inhibition. Compare each variant against the
            isogenic control and against each other, and test whether altered 5' splice sites are enriched
            for upstream-exon sequences predicted to pair differently with the mutant loop I. Because
            U5 is encoded by several genes, first confirm by allele-specific small RNA-seq that the mutant
            U5B-1 is expressed in neurons and incorporated into spliceosomes.
          would_support:
          - mechanistic_hypotheses#rnu5b1_missplicing_drives_brain_phenotype
          would_refute:
          - mechanistic_hypotheses#rnu5b1_missplicing_drives_brain_phenotype
          supporting_outcome:
          - Each variant produces a reproducible, variant-specific set of altered splice sites in neural
            cells, enriched for loop I pairing changes and for genes with established roles in brain development.
          refuting_outcome:
          - No reproducible splicing change beyond control variability in neural cells, or changes unrelated
            to loop I pairing, which would point to another mechanism such as altered snRNP biogenesis.
        - experiment_id: rnu5b1_mutant_u5_fate
          experiment_design: TARGETED_PERTURBATION
          name: Level and spliceosome incorporation of mutant U5B-1
          description: In patient lymphoblastoid cells and in the isogenic iPSC-derived neurons above,
            measure mature U5B-1 by allele-specific small RNA-seq or primer extension, compare with RNU5A-1
            and total U5, and test whether mutant U5B-1 is found in U5 snRNP, tri-snRNP and spliceosome
            fractions by affinity purification or glycerol-gradient fractionation followed by allele-specific
            sequencing. Repeat with quality-control factors such as the NEXT-exosome or TUT4/7 depleted
            to see whether mutant U5B-1 is being degraded.
          would_support:
          - mechanistic_hypotheses#rnu5b1_snrna_qc_loss_or_poisoning
          would_refute:
          - mechanistic_hypotheses#rnu5b1_snrna_qc_loss_or_poisoning
          supporting_outcome:
          - Mutant U5B-1 is depleted relative to the wild-type allele and recovers when quality control
            is inhibited, or it is incorporated but splicing changes are broad rather than variant-specific.
          refuting_outcome:
          - Mutant U5B-1 accumulates at wild-type levels and is incorporated into spliceosomes, which
            leaves altered splice-site selection by the mutant loop as the more likely mechanism.
      selected_evidence:
        snippet: These results, although obtained from a limited number of patients, may underline the
          clinical variability observed for patients with RNU5 variants.
        supports: SUPPORT
