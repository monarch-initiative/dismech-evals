      assertion_type: Pathophysiology
      assertion:
        name: Reduced or Aberrant U5B snRNP Pool
        description: Alternative to target-specific mis-splicing. Cellular quality-control pathways degrade
          defective snRNAs, including disease-mutant snRNAs, before they assemble into spliceosomes; when
          that control fails, defective snRNAs form aberrant spliceosomes that alter splicing. Applied
          to RNU5B-1, a loop I variant could either lower the amount of functional U5B snRNP or, if it
          escapes degradation, impair spliceosomes broadly rather than redirect them to a defined target
          set. This has been shown for U4-2 mutants, not for U5 variants, and neither the level nor the
          spliceosome incorporation of mutant U5B-1 has been measured.
        biological_scale: MOLECULAR
        cellular_components:
        - preferred_term: U5 snRNP
          term:
            id: GO:0005682
            label: U5 snRNP
      selected_evidence:
        snippet: Impeding snRNA quality control causes formation of aberrant spliceosomes and altered
          pre-mRNA splicing.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/1
      context_paths:
