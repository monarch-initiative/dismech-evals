        experiment_design: TARGETED_PERTURBATION
        name: Splicing profiles of RNU5B-1 variants in human neural cells
        description: Introduce n.39C>G, n.42_43insA, n.44A>G and n.37G>C, each heterozygous, into an isogenic
          human iPSC line, differentiate to neural progenitors and cortical neurons, and profile splicing
          by deep RNA-seq with and without NMD inhibition. Compare each variant against the isogenic control
          and against each other, and test whether altered 5' splice sites are enriched for upstream-exon
          sequences predicted to pair differently with the mutant loop I. Because U5 is encoded by several
          genes, first confirm by allele-specific small RNA-seq that the mutant U5B-1 is expressed in
          neurons and incorporated into spliceosomes.
        would_support:
        - mechanistic_hypotheses#rnu5b1_missplicing_drives_brain_phenotype
        would_refute:
        - mechanistic_hypotheses#rnu5b1_missplicing_drives_brain_phenotype
        supporting_outcome:
        - Each variant produces a reproducible, variant-specific set of altered splice sites in neural
          cells, enriched for loop I pairing changes and for genes with established roles in brain development.
        refuting_outcome:
        - No reproducible splicing change beyond control variability in neural cells, or changes unrelated
          to loop I pairing, which would point to another mechanism such as altered snRNP biogenesis.
      selected_evidence:
        snippet: In a patient-derived induced pluripotent stem cell (iPSC) model of the recurrent RNU4-2
          n.64_64insT variant, the splicing signature was fully recapitulated across all stages of differentiation
          into cortical neuron-like cells.
        supports: SUPPORT
