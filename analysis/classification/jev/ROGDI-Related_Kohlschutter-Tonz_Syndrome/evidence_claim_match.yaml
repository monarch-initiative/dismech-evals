      assertion:
        name: Neuronal Presynaptic Dysfunction
        description: ROGDI is enriched at presynaptic sites, where it colocalizes with Bassoon and synaptic
          vesicle markers. Synaptic vesicles are loaded with neurotransmitter using the proton gradient
          generated by the V-ATPase, so loss of ROGDI is proposed to impair vesicle acidification and
          transmitter release. Rogdi-null mice have a lowered seizure threshold, hyperactivity and memory
          deficits. The precise synaptic defect has not been measured, and brain MRI is often normal early
          in the disease.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: synaptic vesicle lumen acidification
          term:
            id: GO:0097401
            label: synaptic vesicle lumen acidification
          modifier: DECREASED
      selected_evidence:
        snippet: Thus, the neurological symptoms associated with Kohlschütter-Tönz syndrome may arise
          from presynaptic dysfunction.
        supports: SUPPORT
        directness: INDIRECT
