              label: amelocerebrohypohidrotic syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rogdi_vatpase_acidification_untested_in_mammalian_cells
        prompt: Does loss of ROGDI reduce V-ATPase assembly and the acidification of synaptic vesicles,
          ameloblast compartments and renal intercalated cells in mammalian cells?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Rabconnectin-3-Dependent V-ATPase Assembly
        - pathophysiology#Neuronal Presynaptic Dysfunction
        rationale: ROGDI's role in V-ATPase assembly rests on yeast Rav2 complementation and interaction
          studies, and the acidification defect has been observed only in Rogdi-null mouse enamel. Neither
          V-ATPase assembly nor synaptic vesicle pH has been measured in ROGDI-deficient neurons, so the
          neurological branch of the pathograph and the explanation for the rare renal findings remain
