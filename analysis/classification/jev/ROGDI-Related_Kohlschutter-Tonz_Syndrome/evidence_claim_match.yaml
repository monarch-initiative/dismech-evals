            description: ROGDI is the human homolog of yeast Rav2 and binds the N-terminal domains of
              both Rabconnectin-3 alpha (DMXL1/DMXL2) and beta (WDR7), probably bridging the two subunits.
              Rabconnectin-3 drives reassociation of the V1 and V0 sectors of the V-ATPase, which reactivates
              proton pumping and organelle acidification. Loss of ROGDI is therefore expected to reduce
              V-ATPase assembly; this has been shown by complementation in yeast and by interaction studies,
              not yet by direct measurement in patient cells.
