      assertion_type: Pathophysiology
      assertion:
        name: ROS1 Inhibitor Resistance
        description: Resistance to ROS1 inhibitors develops through ROS1-dependent mechanisms (secondary
          mutations like G2032R, D2033N, L2026M, and L2086F) or ROS1-independent bypass pathways (MET
          amplification, HGF-MET signaling, KRAS mutations, EGFR activation). The G2032R solvent front
          mutation is common, while L2086F can require type-switching approaches; serial profiling helps
          distinguish on-target from bypass resistance.
        biological_processes:
        - preferred_term: response to xenobiotic stimulus
          modifier: ABNORMAL
          term:
            id: GO:0009410
            label: response to xenobiotic stimulus
      selected_evidence:
        snippet: ROS1 L2086F mutant kinase is resistant to type I TKI
        supports: SUPPORT
