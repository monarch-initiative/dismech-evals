        variants:
        - name: p.Thr237Met (c.710C>T)
          description: Recurrent pathogenic variant in the N-terminal ADP-heptose-binding domain, carried
            by most known families.
        - name: p.Tyr254Cys (c.761A>G)
          description: Variant in the ligand-binding domain, found in a single sporadic patient. It gives
            higher NF-kappaB activity than T237M in reporter assays.
        - name: p.Ser277Phe
          description: Variant found in one family of six affected members, all with ocular inflammation
            and optic nerve elevation. It is activated by UDP-mannose and ADP-ribose more strongly than
            T237M, and also by GDP-mannose.
        - name: p.Thr237Ala
          description: A different substitution at the recurrent residue, with a milder, predominantly
            ocular phenotype in one family.
      selected_evidence:
        snippet: Heterozygosity for ALPK1, p.Thr237Met leads to ROSAH syndrome, an autosomal dominant
          ocular systemic disorder.
