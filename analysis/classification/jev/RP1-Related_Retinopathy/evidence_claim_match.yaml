      assertion:
        name: RP1 pathogenic variants
        gene_term:
          preferred_term: RP1
          term:
            id: hgnc:10263
            label: RP1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: Nearly all known pathogenic variants are nonsense or frameshift changes clustered in
          RP1's coding exons, predominantly exon 4 (which alone encodes more than 85% of the 2,156-amino-acid
          protein despite RP1 having four exons total), predicted to truncate the protein by approximately
          50-70%. Variants located in the middle portion of exon 4 act as heterozygous dominant-negative
          alleles causing autosomal dominant RP; variants toward the N- or C-terminal ends of exon 4 require
          biallelic inheritance to cause the generally more severe autosomal recessive form (with exon-2
          missense variants forming a later-onset exception). Studies have excluded simple haploinsufficiency
          as the causative mechanism for the dominant form.
        inheritance:
        - name: Autosomal dominant
        - name: Autosomal recessive
      selected_evidence:
        snippet: RP1 is a MAP. Given the specific expression of RP1 in photoreceptors, RP1 is thus the
          first photoreceptor-specific MAP to be identified.
