        name: Photoreceptor Axoneme Disorganization
        description: RP1 is a photoreceptor-specific microtubule-associated protein located in the connecting
          cilium and axoneme, where it controls the length and stability of the axoneme and is required
          for correct orientation and higher-order stacking of outer segment discs. Loss of functional
          RP1 (via either the dominant-negative or recessive loss-of-function mechanism) disrupts this
          scaffolding role, producing misoriented, disorganized outer segment discs.
        cellular_components:
        - preferred_term: ciliary transition zone
          term:
            id: GO:0035869
            label: ciliary transition zone
        cell_types:
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        biological_processes:
        - preferred_term: cilium assembly
          modifier: ABNORMAL
          term:
            id: GO:0060271
            label: cilium assembly
      selected_evidence:
        snippet: Disruption of the Rp1 gene in mice causes misorientation of outer segment discs, suggesting
          a role for RP1 in outer segment organization.
        supports: SUPPORT
    origin:
