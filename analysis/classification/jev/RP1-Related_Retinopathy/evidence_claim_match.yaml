            term:
              id: MONDO:0800400
              label: RP1-related dominant retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous RP1 Dominant-Negative Truncation
        description: Heterozygous truncating (nonsense/frameshift) variants clustered in the middle portion
          of RP1 exon 4 - which alone encodes more than 85% of the protein despite RP1 having four exons
          total - produce a stable, partially functional truncated protein that retains the N-terminal
          doublecortin (DCX) domain but loses distal sequence needed for normal regulation. This truncated
          product co-assembles with wild-type RP1 at the photoreceptor axoneme and interferes with normal
          microtubule/axoneme organization, a dominant-negative mechanism rather than simple haploinsufficiency.
          This is the more common RP1 disease mechanism and underlies the majority of RP1-related autosomal
          dominant RP.
        gene:
          preferred_term: RP1
          modifier: ABNORMAL
          term:
            id: hgnc:10263
            label: RP1
        genetic_context:
          gene:
            preferred_term: RP1
            term:
              id: hgnc:10263
              label: RP1
          functional_impact_category: DOMINANT_NEGATIVE
          description: Heterozygous middle-exon-4 truncating variants retain the BIF domain and produce
            an interfering truncated product rather than simply haploinsufficient loss of RP1 protein.
        cell_types:
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
      selected_evidence:
        snippet: the heterozygous variants will cause retinal degeneration with preserved BIF domain but
          loss of the unrecognized domain
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
