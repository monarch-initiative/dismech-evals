      assertion_type: Pathophysiology
      assertion:
        name: RPE65 Isomerohydrolase Deficiency
        conforms_to: retinoid_visual_cycle_disruption#Visual Cycle Enzyme or Transporter Defect
        description: Pathogenic variants in RPE65 reduce or abolish the enzymatic activity of all-trans-retinyl
          ester isomerohydrolase in RPE cells. RPE65 normally catalyzes the conversion of all-trans-retinyl
          esters to 11-cis-retinol in the retinoid (visual) cycle; loss of this activity depletes the
          supply of 11-cis-retinal available for photopigment regeneration in adjacent rod and cone photoreceptors.
          The RPE cell is the primary site of defect; photoreceptors themselves do not express RPE65.
        gene:
          preferred_term: RPE65
          modifier: DECREASED
          term:
            id: hgnc:10294
            label: RPE65
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        molecular_functions:
        - preferred_term: all-trans-retinyl-ester hydrolase, 11-cis retinol forming activity
          term:
            id: GO:0052885
            label: all-trans-retinyl-ester hydrolase, 11-cis retinol forming activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: retinol metabolic process
          modifier: DECREASED
          term:
            id: GO:0042572
            label: retinol metabolic process
        - preferred_term: retinoid metabolic process
          modifier: DECREASED
          term:
            id: GO:0001523
            label: retinoid metabolic process
      selected_evidence:
        snippet: The RPE65 gene encodes all-trans retinyl ester isomerase, an enzyme crucial to the retinoid
          cycle.
        supports: SUPPORT
