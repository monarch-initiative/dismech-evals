      reference: PMID:28689169
      reference_title: 'Leber congenital amaurosis/early-onset severe retinal dystrophy: clinical features,
        molecular genetics and therapeutic interventions.'
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      explanation: Recorded as a REFUTE against any reading of this treatment as arresting the degeneration.
        Reviewing the four phase 1 RPE65 gene therapy trials, this paper reports that most later follow-up
        showed a lack of durability of the functional improvements, with retinal degeneration continuing
        even in eyes whose retinal function had improved. Gene supplementation restores chromophore regeneration;
        on this evidence it does not demonstrably stop the photoreceptor loss, which is why treating while
        photoreceptors remain is the operative clinical point. Graded INDIRECT because the cohorts quoted
        are the phase 1 trials rather than the approved product's own programme.
