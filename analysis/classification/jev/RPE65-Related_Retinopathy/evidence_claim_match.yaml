        diagnosis_term:
          preferred_term: diagnostic procedure
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        description: Full-field light sensitivity threshold (FST) testing, Goldmann visual field perimetry,
          electroretinography (ERG), and optical coherence tomography (OCT) together characterize the
          degree of photoreceptor dysfunction and remaining viable retinal tissue, both for diagnosis
          and for assessing gene therapy eligibility (minimum retinal thickness on OCT is required).
        results: Dark-adapted ERG shows severely reduced or absent rod responses; light-adapted ERG is
          also impaired. FST demonstrates markedly elevated light sensitivity thresholds. OCT shows outer
          retinal layer preservation in gene-therapy-eligible patients. Improvement in FST after voretigene
          neparvovec is an established biomarker of restored RPE65 enzymatic activity.
