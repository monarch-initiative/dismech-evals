              poorly reactive pupils and an undetectable or severely abnormal full-field electroretinogram.
              The oculodigital sign (eye poking) is a characteristic infant finding, and high hyperopia
              is common, suggesting impaired emmetropisation. LCA2 is separated from early-onset severe
              retinal dystrophy, which presents after infancy and usually before age five, by age at onset
              and by the amount of residual photoreceptor function rather than by a different mechanism.
              Because the degeneration is slow, a therapeutic window for subretinal RPE65 gene supplementation
              persists through childhood, which is why molecular diagnosis in an infant with nystagmus
              and an extinguished ERG is time-critical.'
