      assertion_type: Treatment
      assertion:
        name: Voretigene Neparvovec Gene Therapy
        therapeutic_modality: GENE_THERAPY
        description: Subretinal AAV2-mediated gene supplementation therapy delivering a codon-optimized
          human RPE65 cDNA under control of a hybrid promoter, administered bilaterally by subretinal
          injection. Indicated for biallelic RPE65 mutation-associated retinal dystrophy in patients aged
          12 months or older with sufficient viable retina. FDA approved December 2017 (Luxturna, Spark
          Therapeutics) — the first FDA-approved gene therapy for an inherited disease. Perioperative
          oral prednisone is used to attenuate immune responses.
        treatment_term:
          preferred_term: subretinal AAV2 RPE65 gene supplementation
          term:
            id: NCIT:C15238
            label: Gene Therapy
        delivery_system:
          delivery_platform: VIRAL_VECTOR
          target_cell_types:
          - preferred_term: retinal pigment epithelial cell
            term:
              id: CL:0002586
              label: retinal pigment epithelial cell
          description: 'The carrier is a recombinant adeno-associated virus serotype 2 (AAV2) containing
            human RPE65 cDNA under a hybrid chicken beta-actin promoter with a cytomegalovirus enhancer,
            delivered by subretinal injection under general anaesthesia, one eye at a time. Route is the
            substance of the design rather than a detail: the target cell is the retinal pigment epithelial
