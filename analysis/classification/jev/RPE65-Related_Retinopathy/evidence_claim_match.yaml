        context: []
      assertion_type: Subtype
      assertion:
        name: RPE65-related dominant retinopathy
        genes:
        - preferred_term: RPE65
          term:
            id: hgnc:10294
            label: RPE65
        subtype_term:
          preferred_term: RPE65-related dominant retinopathy
          term:
            id: MONDO:0100452
            label: RPE65-related dominant retinopathy
        description: Rare heterozygous dominant-acting RPE65 variants produce a retinitis pigmentosa phenotype
          that is generally milder and later in onset than the recessive LCA2/EOSRD form. Night blindness
          and progressive peripheral visual field loss are the predominant features; onset may extend
          into adulthood. Whether the dominant mechanism reflects dominant-negative interference with
          RPE65 enzyme complex assembly, gain-of-function toxicity, or haploinsufficiency is not fully
          resolved for most reported families.
      selected_evidence:
        snippet: Biallelic mutations in this gene, which disrupt the visual cyde, can be described as
          Leber congenital amaurosis type 2, retinitis pigmentosa type 20, early-onset retinal dystrophy,
          and other clinical labels for severe rod-mediated inherited retinal dystrophies, which all eventually
          progress to complete blindness.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28712537
      reference_title: 'Efficacy and safety of voretigene neparvovec (AAV2-hRPE65v2) in patients with
        RPE65-mediated inherited retinal dystrophy: a randomised, controlled, open-label, phase 3 trial.'
      evidence_source: HUMAN_CLINICAL
      explanation: The phase 3 trial paper contextualizes the RPE65 mutation phenotypic spectrum. Retinitis
        pigmentosa type 20 (RP20) reflects the less severe, adult-onset end of RPE65-related disease;
        the dominant retinopathy subtype (MONDO:0100452) represents this rarer inheritance context alongside
        the biallelic recessive forms.
