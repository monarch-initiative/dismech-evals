        context: []
      assertion_type: Subtype
      assertion:
        name: LCA2
        display_name: Leber congenital amaurosis 2 (LCA2)
        genes:
        - preferred_term: RPE65
          term:
            id: hgnc:10294
            label: RPE65
        subtype_term:
          preferred_term: Leber congenital amaurosis 2
          term:
            id: MONDO:0008765
            label: Leber congenital amaurosis 2
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
          description: LCA2 arises from biallelic (homozygous or compound heterozygous) RPE65 loss-of-function
            variants, the severe end of the same recessive allelic series that produces EOSRD and juvenile
            retinitis pigmentosa.
        description: 'LCA2 is the most severe presentation of biallelic RPE65 deficiency: visual manifestations
          begin in the first year of life, with profound nyctalopia, severely reduced acuity, nystagmus,
          poorly reactive pupils and an undetectable or severely abnormal full-field electroretinogram.
          The oculodigital sign (eye poking) is a characteristic infant finding, and high hyperopia is
          common, suggesting impaired emmetropisation. LCA2 is separated from early-onset severe retinal
          dystrophy, which presents after infancy and usually before age five, by age at onset and by
          the amount of residual photoreceptor function rather than by a different mechanism. Because
          the degeneration is slow, a therapeutic window for subretinal RPE65 gene supplementation persists
          through childhood, which is why molecular diagnosis in an infant with nystagmus and an extinguished
          ERG is time-critical.'
      selected_evidence:
        snippet: Whereas LCA is congenital or presents within the first few months of life, is associated
          with nystagmus, poor pupil responses and in most instances an undetectable full-field electroretinogram
          (ERG)
        supports: SUPPORT
    origin:
