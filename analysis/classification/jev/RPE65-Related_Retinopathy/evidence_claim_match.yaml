        description: Rod photoreceptors depend entirely on the RPE65-dependent visual cycle for 11-cis-retinal,
          so chromophore depletion silences rod phototransduction before any photoreceptor is lost. This
          is the functional, pre-degenerative step that produces night blindness from the first year of
          life, and it is why rescuing the enzyme can restore light sensitivity in a retina that is structurally
          still present.
      selected_evidence:
