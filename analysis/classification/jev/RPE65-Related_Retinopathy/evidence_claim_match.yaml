      reference_title: 'Leber congenital amaurosis/early-onset severe retinal dystrophy: clinical features,
        molecular genetics and therapeutic interventions.'
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      explanation: 'This review defines the clinical boundary this subtype records: LCA is congenital
        or presents within the first few months of life with nystagmus, poor pupil responses and an undetectable
        ERG, whereas EOSRD presents after infancy. That boundary is what separates LCA2 from the EOSRD
        end of the same RPE65 spectrum.'
