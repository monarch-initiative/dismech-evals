        age_range: Infancy to age 10
        notes: In the LCA2 form, visual manifestations arise in infancy or the first year. Children aged
          4–10 have severe mean visual acuity (20/126). Vision is relatively stable through the first
          decade but already severely impaired.
      selected_evidence:
        snippet: 'In RPE65-related LCA, onset of visual manifestations frequently occurs in infancy during
          the first year of life. Central vision can be variable, but children ages four to ten years
          in the largest case series had severe visual impairment (mean visual acuity: 20/126). While
          vision is relatively stable in the first decade of life, it begins to decline again starting
          in the teens'
        supports: SUPPORT
