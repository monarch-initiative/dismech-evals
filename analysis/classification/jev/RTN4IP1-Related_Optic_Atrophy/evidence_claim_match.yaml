      assertion:
        name: Coenzyme Q10 Supplementation
        description: Because RTN4IP1 deficiency impairs coenzyme Q biosynthesis, CoQ10 supplementation
          is a mechanistically rational, experimental therapy. Evidence in RTN4IP1 disease is limited
          to a single case report of symptomatic (musculoskeletal) improvement, supported by rescue of
          the CoQ defect by CoQ supplementation in a Drosophila model; it is not an established disease-modifying
          treatment for the optic neuropathy.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: coenzyme Q10
            term:
              id: CHEBI:46245
              label: coenzyme Q10
      selected_evidence:
        snippet: after six months of daily 200 mg CoQ10, the patient showed marked reductions in pain
          (BPI 4 → 0.8; -80%) and muscle-damage markers (CPK 254 → 110 U/L) together with gains in grip
          strength (+49%) and lower-extremity function (LEFS 31 → 60; +94%)
        supports: SUPPORT
