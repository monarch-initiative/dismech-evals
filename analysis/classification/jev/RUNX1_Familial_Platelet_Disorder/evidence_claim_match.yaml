        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        description: 'Germline confirmation should be performed on a non-haematopoietic tissue, typically
          cultured skin fibroblasts, rather than on blood or marrow. Acquired uniparental disomy of chromosome
          21 in the haematopoietic compartment can cause preferential loss of the variant-bearing chromosome
          and a false negative result on blood-derived DNA. The converse error also occurs: a somatic
          RUNX1 variant in a sporadic myeloid malignancy can be misread as germline.'
        results: A heterozygous germline pathogenic RUNX1 variant confirmed in a non-haematopoietic tissue
          establishes the diagnosis.
      selected_evidence:
        snippet: If the RUNX1 pathogenic variant identified in the proband is not detected in parental
          DNA, the recurrence risk to sibs is slightly greater than that of the general population because
          of the possibility either of a false negative result in a parent (due to preferential loss of
          the chromosome with the RUNX1 pathogenic variant), or of parental germline mosaicism.
        supports: SUPPORT
