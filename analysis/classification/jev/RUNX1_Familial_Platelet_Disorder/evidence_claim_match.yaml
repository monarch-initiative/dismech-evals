      assertion_type: Genetic
      assertion:
        name: RUNX1
        notes: Heterozygous germline RUNX1 variants cause the disorder. Whole-gene and intragenic deletions
          and truncating alleles act by haploinsufficiency; RUNT-domain missense alleles retain CBFB binding
          but cannot transactivate target promoters and behave as dominant negatives. Somatic second hits
          in TET2, DNMT3A, ASXL1, or the second RUNX1 allele, often via acquired uniparental disomy of
          chromosome 21, accompany malignant progression.
        gene_term:
          preferred_term: RUNX1
          term:
            id: hgnc:10471
            label: RUNX1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Most individuals diagnosed with RUNX1-FPDMM inherited the causative pathogenic variant
          from a parent who may or may not have recognized manifestations of the disorder.
        supports: SUPPORT
