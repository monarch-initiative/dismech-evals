          but cannot transactivate target promoters and behave as dominant negatives. Somatic second hits
          in TET2, DNMT3A, ASXL1, or the second RUNX1 allele, often via acquired uniparental disomy of
          chromosome 21, accompany malignant progression.
        gene_term:
