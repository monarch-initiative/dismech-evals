          to transplant preemptively, before overt malignancy, remains unsettled and is approached through
          shared decision-making that weighs clonal evolution, family history and bleeding burden against
          transplant risk.
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: hematopoietic cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
      selected_evidence:
        snippet: RUNX1 familial platelet disorder (RUNX1-FPD) is associated with a 35% to 50% lifetime
          risk of hematologic malignancy (HM), and like all germline HM predisposition syndromes, can
          only be cured with allogeneic hematopoietic stem cell transplantation (HSCT).
        supports: SUPPORT
