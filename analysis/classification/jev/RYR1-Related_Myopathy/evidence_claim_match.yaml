        name: NCT04141670
        phase: PHASE_I
        status: COMPLETED
        description: Phase 1, open-label, dose-escalation, first-in-patient trial of the RyR-stabilizing
          "Rycal" small molecule S48168 (ARM210) in ambulatory adults with genetically confirmed RYR1-related
          myopathy, directly targeting the dominant leaky-channel/gain-of-function mechanism. The compound
          was well tolerated with a dose-dependent pharmacokinetic profile; most participants on the higher
          (200 mg/day) dose reported reduced fatigue and showed improved proximal muscle strength on exam,
          setting the foundation for a subsequent placebo-controlled trial.
        target_phenotypes:
        - preferred_term: Proximal muscle weakness
          term:
            id: HP:0003701
            label: Proximal muscle weakness
      selected_evidence:
        snippet: S48168 (ARM210) was well-tolerated, did not cause any serious adverse events, and exhibited
          a dose-dependent PK profile. Three of four participants who received the 200 mg/day dose reported
          improvements in PROMIS-fatigue at 28 days post-dosing, and also demonstrated improved proximal
          muscle strength on physical examination.
        supports: SUPPORT
