      assertion_type: Genetic
      assertion:
        name: INSR
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: INSR
          term:
            id: hgnc:6091
            label: INSR
        notes: Biallelic (homozygous or compound heterozygous) INSR variants are necessary and sufficient;
          the functional consequence is loss/partial loss of function (captured as functional_impact_category
          on the Biallelic INSR Loss-of-Function pathophysiology node). In the largest pooled series (55
          distinct variants across 42 patients), missense substitutions predominated (72.7%), with deletions
          (10.9%), insertions (1.8%), and nonsense (1.8%) variants also observed; the most recurrent variant
          was p.Glu238Lys and exon 2 was most frequently affected. No genotype-phenotype correlation was
          established. RMS occupies a hypomorphic position relative to Donohue syndrome (near-complete
          loss of receptor function).
      selected_evidence:
        snippet: Rabson-Mendenhall syndrome (RMS) is a rare autosomal recessive disorder caused by mutations
          in the insulin receptor gene (INSR), leading to severe insulin resistance.
        supports: SUPPORT
