      assertion_type: Discussion
      assertion:
        discussion_id: rms_renal_insr_mouse_human_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Renal Insulin Receptor Dysfunction
        prompt: Does the renal phenotype of kidney-specific Insr-knockout mice faithfully model the human
          renal consequences of INSR loss in Rabson-Mendenhall syndrome?
        rationale: Genetically modified mice with kidney-specific Insr deletion show elevated blood pressure
          and progressive diabetic nephropathy, whereas patients with biallelic INSR mutations are normotensive
          with stable glomerular function and only moderate proteinuria, their renal phenotype dominated
          instead by hypercalciuria and nephrocalcinosis. This suggests species-specific differences in
          renal INSR function and cautions against extrapolating the mouse renal phenotype to human disease.
      selected_evidence:
        snippet: Normotension and stable glomerular function with only moderate proteinuria is in contrast
          to genetically modified mice who have elevated BP and progressive diabetic nephropathy.
        supports: SUPPORT
