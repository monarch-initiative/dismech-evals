      assertion_type: Pathophysiology
      assertion:
        name: Translation Failure Under Phenylalanine Limitation
        biological_scale: CELLULAR
        description: 'With a crippled synthetase, cytoplasmic translation becomes conditional on phenylalanine
          supply. Patient fibroblasts grow normally when phenylalanine is plentiful and fail dose-dependently
          as it falls, whereas control cells do not - so the cellular lesion is not a fixed translational
          deficit but a loss of reserve. Tissues with the highest secretory protein throughput and the
          fastest growth would therefore be expected to fail first. That last sentence is an inference
          from the conditional-reserve result, not a finding: none of the cited sources reports tissue
          tropism directly.'
        mechanism_confidence: ESTABLISHED
        biological_processes:
        - preferred_term: cytoplasmic translation
          term:
            id: GO:0002181
            label: cytoplasmic translation
          modifier: DECREASED
      selected_evidence:
        snippet: patient fibroblast proliferation was normal at high concentrations, but decreased in
          a dose-dependent manner at lower concentrations of isoleucine for PIARS and PIARS-2, leucine
          for PLARS, and phenylalanine for PFARSB
        supports: SUPPORT
