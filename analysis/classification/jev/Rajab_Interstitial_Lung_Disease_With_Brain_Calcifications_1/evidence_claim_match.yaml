      assertion:
        classification_value: RESPIRATORY
        notes: Assigned on the organ system that determines outcome rather than the one that names the
          disease. Interstitial lung disease is near-universal in FARSB deficiency and is the usual cause
          of death, while the intracranial calcification which gives the disease its name is an imaging
          finding whose clinical weight is much lower. This differs from the sibling cytoplasmic-ARS entry
          Neurodevelopmental_Disorder_with_Microcephaly_Seizures_and_Cortical_Atrophy (VARS1), which is
          NEUROLOGIC because its presentation is essentially confined to the CNS; here the CNS findings
          coexist with a dominant pulmonary and hepatic picture.
      selected_evidence:
