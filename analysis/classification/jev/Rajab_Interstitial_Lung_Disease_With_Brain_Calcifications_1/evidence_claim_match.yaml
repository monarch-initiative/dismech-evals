            term:
              id: MONDO:0100215
              label: Rajab interstitial lung disease with brain calcifications 1
        context: []
      assertion_type: Treatment
      assertion:
        name: L-Phenylalanine Supplementation
        description: 'Supplementation with the cognate amino acid, the rationale being that the hypomorphic
          synthetase is substrate-limited rather than absent, so raising phenylalanine availability should
          recover aminoacylation flux. Patient fibroblasts supply the direct rationale: they fail dose-dependently
          as phenylalanine falls. The evidence in patients is early and must not be overstated - the reported
          FARSB patient received 40-100 mg/kg/day and died soon after starting, of complications of liver
          failure that predated treatment. The cohort-level reports of improvement pool several ARS1 genotypes
          and are not FARSB-specific outcome data.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: cognate amino acid supplementation
          term:
            id: NCIT:C15433
            label: Nutritional Support
          therapeutic_agent:
          - preferred_term: L-phenylalanine
            term:
              id: CHEBI:17295
              label: L-phenylalanine
      selected_evidence:
        snippet: Patients were subsequently treated with the amino acid (l‐isoleucine, l‐leucine, l‐phenylalanine
          or l‐serine) cognate to the defective aaRS, and all patients improved over the course of the
          treatment, with noticeable improvements in growth, head circumference, development, and oxygen
          dependency
        supports: SUPPORT
        directness: INDIRECT
