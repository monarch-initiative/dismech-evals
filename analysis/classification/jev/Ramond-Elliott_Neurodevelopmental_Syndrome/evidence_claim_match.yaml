              modifier: DYSREGULATED
              term:
                id: GO:0036002
                label: pre-mRNA binding
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Disrupted Tra2-beta-Dependent Exon Inclusion
        causal_link_type: DIRECT
      selected_evidence:
        snippet: Increased expression of Tra2β-3-GFP were shown to interfere with the incorporation of
          CHEK1 exon 3 into its mature transcript, normally incorporated by Tra2β-1.
