        name: Cortical Neural Precursor Apoptosis
        biological_scale: CELLULAR
        description: In Nestin-Cre neural-specific Tra2b knockout mice, neural and glial precursors in
          the cortical ventricular layers undergo massive apoptosis, with p21 (Cdkn1a) upregulation, and
          cortical development is severely abnormal. Shown only for complete loss of Tra2b in mice; whether
          the human dominant-negative alleles cause precursor loss is not known.
        biological_processes:
        - preferred_term: apoptotic process
          modifier: INCREASED
          term:
            id: GO:0006915
            label: apoptotic process
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
      selected_evidence:
        snippet: Neuronal-specific Tra2b knock-out mice die immediately after birth and show severe abnormalities
          in cortical development, which are caused by massive apoptotic events in the ventricular layers
          of the cortex, demonstrating a pivotal role of Tra2b for the developing central nervous system.
        supports: SUPPORT
