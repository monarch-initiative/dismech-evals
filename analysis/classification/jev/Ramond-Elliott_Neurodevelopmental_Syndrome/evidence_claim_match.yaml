          value:
            name: TRA2B 5' Variant Isoform Switch
            biological_scale: MOLECULAR
            description: The truncating variants all lie in the 5' part of TRA2B, upstream of an alternative
              translation start site. In patient-derived cells they lower the canonical full-length Tra2-beta-1
              isoform and raise the noncanonical Tra2-beta-3 isoform, which starts downstream and lacks
              the N-terminal RS1 domain. Tra2-beta is a sequence-specific splicing regulator that binds
              GAA-rich motifs in pre-mRNA; the bound molecular function is marked dysregulated because
              the binding-and-activating canonical protein is replaced by a shorter repressive form. RNA
              binding by Tra2-beta-3 was not measured.
            genetic_context:
              variant_origin: GERMLINE
              functional_impact_category: DOMINANT_NEGATIVE
            genes:
            - preferred_term: TRA2B
              term:
                id: hgnc:10781
                label: TRA2B
            molecular_functions:
