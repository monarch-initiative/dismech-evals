        description: 'Impaired endothelium-dependent vasodilation with reduced nitric oxide (NO) and prostacyclin
          bioavailability and increased production of endothelin-1 (ET-1). The imbalance between vasoconstrictors
          and vasodilators favors persistent vasoconstriction, platelet activation, and intimal proliferation.
          In secondary RP associated with systemic sclerosis, endothelial damage leads to defective angiogenesis,
          endothelial-to-mesenchymal transition, and progressive capillary loss.

          '
        cell_types:
        - preferred_term: Endothelial Cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: Vasodilation
          term:
            id: GO:0042311
            label: vasodilation
        - preferred_term: Nitric Oxide Biosynthesis
          term:
            id: GO:0006809
            label: nitric oxide biosynthetic process
      selected_evidence:
        snippet: once damaged, endothelial cells can be dysfunctionally activated, thus becoming unable
          to undergo angiogenesis and promoting perivascular inflammation. They can also undergo apoptosis,
          transdifferentiate into profibrotic myofibroblasts
        supports: SUPPORT
