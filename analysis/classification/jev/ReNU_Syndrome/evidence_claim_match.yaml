              label: neurodevelopmental disorder with hypotonia, brain anomalies, distinctive facies,
                and absent language
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: renu_mechanism_is_not_loss_of_function
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#RNU4-2 Critical-Region Variant Disrupts U4 snRNA / Spliceosome Function
        prompt: If ReNU syndrome is not caused by loss of RNU4-2 function, what does the dominant critical-region
          variant actually do to the spliceosome?
        rationale: 'The discovery of a recessive RNU4-2 disorder settles what ReNU syndrome is not. Biallelic
          variants outside the critical region reduce RNU4-2 transcript levels and cause a clinically
          distinct disease by loss of function; the authors state explicitly that this mechanism differs
          from the one underlying ReNU syndrome. The dominant critical-region variants must therefore
          act by some other route — a dominant-negative or altered-function effect on U4/U6 pairing and
          spliceosome activation — but which of these, and whether the mutant U4 is incorporated into
          tri-snRNPs and poisons them or acts before assembly, is not established. This matters for therapy:
          an antisense or allele-specific strategy is only coherent if the mutant transcript is doing
          something, rather than simply failing to.'
      selected_evidence:
        snippet: we find reduced RNU4-2 transcript levels in individuals with the recessive disorder,
          suggesting a loss-of-function disease mechanism that is distinct from the mechanism underlying
          ReNU syndrome
        supports: SUPPORT
