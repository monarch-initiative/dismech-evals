        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Increased Bone Turnover and Reduced Bone Mineral Density
        prompt: Is the skeletal fragility of ReNU syndrome caused by a splicing defect intrinsic to bone
          cells, or is it disuse osteoporosis secondary to hypotonia and limited ambulation?
        rationale: 'The distinction is not academic: it determines whether bone in ReNU syndrome should
          be managed as a primary skeletal disease with early surveillance and anti-resorptive therapy,
          or as a preventable consequence of immobility. One observation currently favours an intrinsic
          effect — a tibia biopsy showed increased numbers of both osteoclasts and osteoblasts with enlarged
          eroded surfaces, an activated high-turnover state, whereas disuse osteoporosis is typically
          low-turnover. But that is a single biopsy in a single patient who was also non-ambulatory, so
          disuse is not excluded, and the authors themselves call for the bone pathology to be defined.
          Resolving it needs histomorphometry in several patients stratified by ambulatory status.'
      selected_evidence:
        snippet: Although skeletal abnormalities have been reported in individuals with ReNU syndrome,1,2,4–10
          the underlying bone cell pathologies still need to be defined in order to prevent fractures
          by specific treatment strategies.
        supports: SUPPORT
