      assertion_type: Treatment
      assertion:
        name: Structured surveillance and avoidance of bone-toxic agents
        therapeutic_modality: OTHER
        description: GeneReviews recommends scheduled follow-up to monitor existing manifestations and
          detect new ones, across developmental, seizure, feeding, kidney, urinary tract, bone-health
          and sleep domains, and specifically advises weighing the bone consequences of any medication
          considered. That advice matters more here than in most neurodevelopmental disorders given the
          42% frequency of bone abnormality and the demonstrated occurrence of vertebral fractures that
          were silent until imaged.
        treatment_term:
          preferred_term: scheduled multi-system clinical surveillance
        notes: treatment_term is deliberately left unbound. NCIT:C15719 (Surveillance) is not reachable
          from NCIT:C25218 (Clinical Intervention or Procedure) and so fails the TreatmentActionTerm enum,
          and no NCIT clinical-action term was found that means scheduled multi-system surveillance. Per
          the project rule that no term beats a bad one, a free-text preferred_term is used rather than
          forcing a generic Therapeutic Procedure or reusing Supportive Care, which already labels a different
          treatment in this entry.
      selected_evidence:
        snippet: Consider avoiding or limiting any substance or medication that may affect bone health
          (e.g., steroids).
        supports: SUPPORT
