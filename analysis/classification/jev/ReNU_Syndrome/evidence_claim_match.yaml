                and absent language
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Genome sequencing (exome-negative work-up)
        description: The signature diagnostic feature of ReNU syndrome is that RNU4-2, as a short non-coding
          U4 snRNA gene, is not captured by conventional exome sequencing; affected individuals are therefore
          typically exome-negative and remain undiagnosed until clinical genome sequencing is performed
          and the RNU4-2 critical-region variant (most often the recurrent n.64_65insT insertion) is identified.
          Genome sequencing of exome-negative NDD cohorts is the actionable route to diagnosis and, given
          the recognizable lip-and-philtrum facial gestalt, RNU4-2 should be specifically interrogated
          in undiagnosed NDD.
        diagnosis_term:
          preferred_term: clinical whole genome sequencing
          term:
            id: NCIT:C101294
            label: Whole Genome Sequencing
      selected_evidence:
        snippet: RNU4-2 is not captured by conventional exome sequencing (ES), often leaving affected
          individuals undiagnosed.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
