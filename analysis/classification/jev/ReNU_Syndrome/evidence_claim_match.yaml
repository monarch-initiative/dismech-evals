        biological_scale: MOLECULAR
        description: 'RNA sequencing of individuals with RNU4-2 variants shows systematically disrupted
          5'' splice-site usage — notably increased use of unannotated 5'' splice sites — consistent with
          the known role of the affected region during spliceosome activation. This global splicing dysregulation
          during neurodevelopment is the proposed convergence point linking the RNA-level defect to the
          neurodevelopmental phenotype, placing ReNU syndrome among the spliceosomopathies. Because the
          spliceosome is used by essentially every transcript, the downstream consequences are not confined
          to brain: skeletal and, in at least one report, glomerular involvement are part of the phenotype.
          Which downstream transcripts actually mediate each organ phenotype is not known, so the edges
          below are curated as indirect with unknown intermediates.'
