          patient across a 3-to-29-year age span, most never acquire meaningful speech, only about half
          walk independently, and neuroradiological abnormality was universal in a consecutive series.
          Epilepsy affects about 60%, and 42% of those assessed have bone abnormality with fractures that
          may go unrecognized. The milder Stem III genotype is the one real source of variability, and
          it is a minority of cases; it is captured as a subtype rather than by softening the overall
          burden level.'
      selected_evidence:
        snippet: bone abnormalities have been described previously and were present in 72 out of 173 individuals
          (42%) with ReNU syndrome who underwent bone assessment
