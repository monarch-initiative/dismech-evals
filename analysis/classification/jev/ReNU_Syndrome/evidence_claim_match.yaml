  9300d7c5424cb55cc025271d41f78da109f6b2ca4ee9fa550742034804f4eac9:
    claim:
      about:
        disease:
          name: ReNU Syndrome
          disease_term:
            preferred_term: ReNU syndrome
            term:
              id: MONDO:0971172
              label: neurodevelopmental disorder with hypotonia, brain anomalies, distinctive facies,
                and absent language
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RNU4-2 Critical-Region Variant Disrupts U4 snRNA / Spliceosome Function
        biological_scale: MOLECULAR
        description: 'RNU4-2 encodes the U4 small nuclear RNA, which base-pairs extensively with U6 snRNA
          within the U4/U6.U5 tri-snRNP of the major spliceosome. The 18-bp critical region harboring
          the recurrent n.64_65insT insertion maps to the T-loop and stem III structural elements that
          stabilize U4/U6 pairing and help position the U6 ACAGAGA sequence to receive the 5'' splice
          site during initial spliceosome activation. Variants in this region perturb U4 structure and
          the U4/U6 duplex, compromising accurate spliceosome assembly/activation. RNU4-2 is highly expressed
          in the developing human brain (in contrast to the paralog RNU4-1), consistent with a developmental,
          brain-predominant impact. Saturation genome editing across the whole gene has since resolved
          this critical region to single-nucleotide resolution and shown that the severity of a variant''s
          functional effect tracks with clinical severity. Note that this is not a loss-of-function mechanism:
          biallelic variants elsewhere in RNU4-2 reduce transcript levels and cause a separate recessive
          disorder, which is what distinguishes ReNU syndrome mechanistically from simple haploinsufficiency.'
        genes:
        - preferred_term: RNU4-2
          term:
            id: hgnc:10193
            label: RNU4-2
        biological_processes:
        - preferred_term: U4/U6.U5 tri-snRNP spliceosome assembly
          term:
            id: GO:0000387
            label: spliceosomal snRNP assembly
          modifier: ABNORMAL
        - preferred_term: mRNA splicing via the major spliceosome
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: ABNORMAL
      selected_evidence:
        snippet: we redefine the ReNU syndrome critical region at single-nucleotide resolution, resolve
          variant pathogenicity for variants of uncertain significance and show that SGE function scores
          delineate variants by phenotypic severity and the extent of observed splicing disruption
        supports: SUPPORT
