                and absent language
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: renu_rnu4_2_pleiotropy_ndd_versus_retinopathy
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - genetic#RNU4-2 critical-region variants
        - pathophysiology#Systematic Disruption of 5' Splice-Site Usage
        prompt: Why do variants in one 76-nucleotide non-coding gene produce either a severe neurodevelopmental
          syndrome or an isolated retinal degeneration, depending only on which structural element is
          affected?
        rationale: 'RNU4-2 now has at least three distinct variant-position-to-disease mappings: the 18-bp
          T-loop/stem III critical region gives dominant ReNU syndrome; the three-way junction of the
          U4/U6 duplex gives dominant non-syndromic retinitis pigmentosa; and Stem II, the k-turn and
          the Sm site give a recessive neurodevelopmental disorder when biallelic. A single housekeeping
          snRNA used by essentially every transcript thus yields strikingly tissue-restricted and non-overlapping
          phenotypes. The retinal variants appear to act on snRNP biogenesis via tri-snRNP factor binding,
          echoing the PRPF-gene retinitis pigmentosas, which suggests the determinant is which spliceosome
          sub-process is perturbed rather than how much splicing is disturbed overall. Testing that would
          require comparing splicing outcomes across variant classes in the same cell system.'
      selected_evidence:
        snippet: reveals pleiotropy in RNU4-2, where distinct variants underlie neurodevelopmental disorder
          and retinal degeneration
        supports: SUPPORT
