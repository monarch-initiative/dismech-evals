  a4b846c7519461fa9e24dcfa643b5a164e697b41e46bd50dcf589615d69fba86:
    claim:
      about:
        disease:
          name: ReNU Syndrome
          disease_term:
            preferred_term: ReNU syndrome
            term:
              id: MONDO:0971172
              label: neurodevelopmental disorder with hypotonia, brain anomalies, distinctive facies,
                and absent language
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cortical Network Hyperexcitability
        biological_scale: TISSUE
        description: 'Epilepsy affects roughly 60% of individuals with ReNU syndrome. The seizure disorder
          is notable for what is absent as much as what is present: dedicated epilepsy-cohort imaging
          found no structural epileptogenic lesion, so the seizures are attributed to a functional network
          abnormality rather than to the malformations visible on MRI. Focal impaired-consciousness seizures
          predominate across all ages, onset is in early childhood, and the course is comparatively favourable,
          with seizure freedom achievable in about half of patients. The cellular substrate linking the
          splicing defect to network hyperexcitability is not known, which is why this node deliberately
          carries no biological_process or cell_type binding: no source examined identifies the channel,
          synapse or cell population involved, and a generic nervous-system-development term would assert
          nothing about excitability.'
      selected_evidence:
        snippet: The mean age at epilepsy onset was 2.8 ±2.1 years.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
