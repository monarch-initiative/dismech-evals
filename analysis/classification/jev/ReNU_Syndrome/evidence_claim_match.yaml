    claim:
      about:
        disease:
          name: ReNU Syndrome
          disease_term:
            preferred_term: ReNU syndrome
            term:
              id: MONDO:0971172
              label: neurodevelopmental disorder with hypotonia, brain anomalies, distinctive facies,
                and absent language
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Targeted Sanger sequencing of the RNU4-2 hotspot
        description: 'Where genome sequencing is unavailable or slow, the recognisability of the syndrome
          makes a targeted approach viable: because the pathogenic variants cluster into a short region,
          direct Sanger sequencing of the 18-base-pair critical region is a reasonable first test in a
          clinically suspected case. This is how a nine-patient series was assembled from previously undiagnosed
          individuals, and how the diagnosis was reached in a patient whose trio exome had been uninformative.
          The facial gestalt — hooded upper eyelids, full cheeks, a tented philtrum, and a slightly open
          mouth with an everted lower lip vermilion — is the practical trigger for testing.'
        diagnosis_term:
          preferred_term: DNA sequence analysis
          term:
            id: NCIT:C153598
            label: DNA Sequencing
      selected_evidence:
        snippet: All patients showed a distinctive pattern of dysmorphic features, including hooded upper
          eyelids, full cheeks, a tented philtrum, and a mouth constantly slightly open with an everted
          lower lip vermilion.
        supports: SUPPORT
