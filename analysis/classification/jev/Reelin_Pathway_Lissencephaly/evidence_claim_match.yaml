  da19bc81932ed25ae49d4dc3c8df911c9a366bd04de13215dc942204e24a316d:
    claim:
      about:
        disease:
          name: Reelin Pathway Lissencephaly
          disease_term:
            preferred_term: Reelin-pathway lissencephaly with cerebellar hypoplasia
            term:
              id: MONDO:0019450
              label: lissencephaly with cerebellar hypoplasia
        context:
        - path: /has_subtypes/1
          value:
            name: VLDLR-related
            display_name: VLDLR-associated cerebellar hypoplasia with gyral simplification
            description: 'Homozygous VLDLR loss (classically a 199-kb deletion in the Hutterite "cerebellar
              hypoplasia and dysequilibrium" / CAMRQ1 syndrome) removes one of the Reelin receptors, producing
              a generally milder phenotype: nonprogressive cerebellar ataxia and intellectual disability
              with inferior cerebellar hypoplasia and mild cerebral gyral simplification rather than frank
              lissencephaly.'
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: VLDLR Receptor Deficiency
        description: Homozygous loss-of-function variants or whole-gene deletion of VLDLR abolish the
          cell-surface very low-density lipoprotein receptor on migrating cortical and cerebellar neuroblasts,
          including migrating Purkinje cells. Because VLDLR serves as one of the two core Reelin receptors
          (alongside ApoER2/LRP8), receptor loss impairs Reelin-guided neuroblast migration in the cerebral
          cortex and cerebellum while leaving partial ApoER2-mediated signaling intact, explaining the
          milder gyral-simplification and inferior cerebellar hypoplasia phenotype of the VLDLR subtype
          branch.
        role: trigger
        subtypes:
        - VLDLR-related
        genes:
        - preferred_term: VLDLR
          term:
            id: hgnc:12698
            label: VLDLR
        molecular_functions:
