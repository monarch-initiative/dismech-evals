  0501c18db3156a26fd4862c48aa581cefc84a0ee52d8e5748f1d3f9f22e7fa3c:
    claim:
      about:
        disease:
          name: Reelin Pathway Lissencephaly
          disease_term:
            preferred_term: Reelin-pathway lissencephaly with cerebellar hypoplasia
            term:
              id: MONDO:0019450
              label: lissencephaly with cerebellar hypoplasia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_reelin_reeler_mouse_gyrencephaly_mismatch
        prompt: Does the reeler (Reln-null) mouse — the principal animal model of Reelin-pathway disruption
          — faithfully recapitulate the human RELN/VLDLR lissencephaly-with-cerebellar-hypoplasia (LCH)
          phenotype, or does the fact that the mouse is a natively lissencephalic (agyric) species, lacking
          the expanded outer subventricular zone (OSVZ) and outer radial glia (oRG) that drive gyrencephalic
          cortical expansion in humans, mean that the model captures the inside-out lamination and cerebellar
          defects but cannot reproduce the human gyral-simplification/pachygyria component of the malformation?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Cajal-Retzius Reelin Ligand Deficiency
        - pathophysiology#Cortical Lamination and Gyral Simplification
        rationale: 'The reeler mouse establishes the molecular logic of this entry: loss of Reelin causes
          inverted (outside-in) cortical lamination, cerebellar hypoplasia, and abnormal axonal connectivity,
          paralleling the human LCH syndrome that defines RELN-related disease. However, the human RELN/VLDLR
          phenotype additionally includes lissencephaly with markedly simplified gyration (pachygyria),
          a feature that a baseline-agyric rodent cortex cannot phenocopy because mouse cortical development
          lacks the human-enriched OSVZ/oRG amplification tier responsible for gyrencephalic surface expansion.
          Mouse data therefore robustly validate the Reelin-DAB1 signaling lesion and the lamination/terminal-translocation
          defect, but they systematically underdetermine the severity and gyral pattern of the human cortical
          malformation. Resolving whether the human gyral-simplification arm is a distinct, human-specific
          consequence of Reelin loss (versus a quantitative extension of the same lamination defect) is
          mechanistically meaningful for interpreting model-derived evidence and for module conformance.'
        proposed_experiments:
        - experiment_id: exp_reelin_human_cortical_organoid
          experiment_design: TARGETED_PERTURBATION
          name: RELN- or VLDLR-null human cortical organoid lamination and oRG analysis
          description: Generate isogenic RELN-null or VLDLR-null human iPSC-derived cortical organoids
            and quantify radial-glia/oRG composition, terminal somal translocation, and inside-out laminar
            positioning relative to controls, testing whether human-specific outer radial glia behave
            differently from the apical-progenitor-dominated reeler mouse cortex and whether gyrencephalic
            surface-area phenotypes emerge only in the human model.
          experiment_type:
            preferred_term: iPSC organoid perturbation assay
          model_systems:
          - name: Human iPSC-derived cortical organoid
            description: Cortical organoid differentiated from gene-edited human iPSCs, preserving human-specific
              outer radial glia and OSVZ biology absent from the mouse.
            experimental_model_type: ORGANOID
        - experiment_id: exp_reelin_gyrencephalic_ferret
          name: Reelin-pathway perturbation in a gyrencephalic ferret cortex
          description: Disrupt Reelin signaling (RELN or VLDLR) in the developing ferret cortex, a gyrencephalic
            carnivore model possessing an OSVZ with oRG-like cells, to test whether Reelin loss produces
            gyral simplification closer to the human LCH phenotype than is seen in the lissencephalic
            reeler mouse.
          experiment_type:
