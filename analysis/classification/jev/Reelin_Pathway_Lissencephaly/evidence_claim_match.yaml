            term:
              id: MONDO:0019450
              label: lissencephaly with cerebellar hypoplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: VLDLR-ApoER2-DAB1 Signal Transduction Failure
        conforms_to: reelin_terminal_translocation_lamination_failure#VLDLR-ApoER2-DAB1 Signal Transduction
          Failure
        description: Reelin binding to the transmembrane lipoprotein receptors VLDLR and ApoER2 (LRP8)
          recruits the cytoplasmic adaptor protein DAB1 to their intracellular NPxY motif and induces
          DAB1 phosphorylation, initiating the intracellular signaling cascade required for neuronal positioning.
          Loss of either secreted Reelin ligand or cell-surface VLDLR receptor prevents DAB1 recruitment
          and phosphorylation, uncoupling extracellular Reelin cues from downstream migration and lamination
          effectors.
        role: central_effector
        genes:
        - preferred_term: RELN
          term:
            id: hgnc:9957
            label: RELN
        - preferred_term: VLDLR
          term:
            id: hgnc:12698
            label: VLDLR
        - preferred_term: LRP8
          term:
            id: hgnc:6700
            label: LRP8
        - preferred_term: DAB1
          term:
            id: hgnc:2661
            label: DAB1
        molecular_functions:
        - preferred_term: reelin receptor activity
          term:
            id: GO:0038025
            label: reelin receptor activity
          modifier: DECREASED
        cell_types:
        - preferred_term: migrating cerebral cortex neuron
          term:
            id: CL:0010012
            label: cerebral cortex neuron
        - preferred_term: Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        biological_processes:
        - preferred_term: reelin-mediated signaling pathway
          term:
            id: GO:0038026
            label: reelin-mediated signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: With reelin binding, the cytoplasmic adaptor protein disabled-1 (Dab1) docks to the NPxY
          sequence in the intracellular region of VLDLR and ApoER2 and becomes phosphorylated (Howell
          et al. 1997; Trommsdorff et al. 1999), which triggers an intracellular signaling cascade that
          allows neuroblasts to complete migration and adopt their ultimate positions in laminar structures
          in the CNS.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
