            id: CL:1001611
            label: cerebellar neuron
        biological_processes:
        - preferred_term: reelin-mediated signaling pathway
          term:
            id: GO:0038026
            label: reelin-mediated signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: A 199-kb homozygous deletion encompassing the entire very low density lipoprotein receptor
          (VLDLR) gene was present in all affected individuals.
        supports: SUPPORT
