            label: reelin receptor activity
          modifier: LOSS_OF_FUNCTION
        cellular_components:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        cell_types:
        - preferred_term: migrating cerebral cortex neuron
          term:
            id: CL:0010012
            label: cerebral cortex neuron
        - preferred_term: Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        - preferred_term: cerebellar neuron
