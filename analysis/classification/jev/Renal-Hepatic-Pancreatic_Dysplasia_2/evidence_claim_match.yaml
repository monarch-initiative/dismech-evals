            label: protein serine/threonine kinase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Together, these data reveal the crucial role of NEK8 kinase activation within the IC,
          promoting proper left-right patterning, cardiopulmonary development and renal morphogenesis.
        supports: SUPPORT
