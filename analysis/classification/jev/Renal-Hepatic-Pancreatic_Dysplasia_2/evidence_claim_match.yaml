              label: renal-hepatic-pancreatic dysplasia 2
        context: []
      assertion_type: Genetic
      assertion:
        name: NEK8
        gene_term:
          preferred_term: NEK8
          term:
            id: hgnc:13387
            label: NEK8
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_6888a91a-6589-42a9-9622-553b4918bed6-2021-09-08T160000.000Z
        notes: Reported alleles include a homozygous nonsense variant with complete loss of NEK8 expression
          through nonsense-mediated decay (Frank et al. 2013), missense, nonsense and splice variants
          in five cases from a ciliopathy sequencing cohort (Grampa et al. 2016), and a compound heterozygous
          c.2069_2070insC (p.Ter693LeufsTer86) / c.1043C>T (p.Thr348Met) genotype in two brothers (Rajagopalan
          et al. 2016). Grampa et al. report a genotype-phenotype correlation in which missense alleles
          associate with hypodysplasia and nonsense alleles with enlarged cystic organs, and propose a
          likely gain-of-function effect for some missense alleles. The ClinGen curation lumps NEK8 nephronophthisis
          (NPHP9) into this disease entity and states the mechanism as biallelic loss of function.
      selected_evidence:
        snippet: The mutations included a c.2069_2070insC variant (p.Ter693LeufsTer86), and a c.1043C>T
          variant (p.Thr348Met) in the highly conserved RCC1 (Regulation of Chromosome Condensation 1)
          domain.
        supports: SUPPORT
