              id: HP:0000007
              label: Autosomal recessive inheritance
          description: Both ITGA8 alleles must be affected; the discovery families were consanguineous
            with recessive segregation.
      selected_evidence:
        snippet: Renal hypodysplasia (RHD) is a heterogeneous condition encompassing a spectrum of kidney
          development defects including renal agenesis, hypoplasia, and (cystic) dysplasia.
        supports: SUPPORT
