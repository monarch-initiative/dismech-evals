      assertion:
        name: GDNF receptor complex failure at the Wolffian duct
        description: GDNF secreted by the metanephric mesenchyme acts on the Wolffian duct through GFRA1,
          a member of the GDNF receptor family, together with the RET receptor tyrosine kinase. Loss of
          GFRA1 removes that receptor, so the duct no longer receives the outgrowth signal and the ureteric
          bud is not induced.
        biological_scale: MOLECULAR
        genes:
