              label: renal agenesis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Oligohydramnios and Potter sequence
        description: 'Fetal urine is the major source of amniotic fluid in the second half of gestation.
          In bilateral renal agenesis the absence of urine output produces severe oligohydramnios, which
          mechanically compresses the fetus. The resulting deformation cascade is the Potter sequence:
          pulmonary hypoplasia (the usual cause of neonatal death), Potter facies, and limb contractures.'
        biological_processes:
        - preferred_term: lung development
          modifier: ABNORMAL
          term:
            id: GO:0030324
            label: lung development
      selected_evidence:
        snippet: Bilateral renal agenesis (BRA) is a lethal diagnosis, specifically meaning that natural
          survival beyond birth is not expected secondary to pulmonary hypoplasia.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32516788
      reference_title: Contemporary Outcomes of Patients with Isolated Bilateral Renal Agenesis with and
        without Fetal Intervention.
      evidence_source: HUMAN_CLINICAL
      explanation: Directly links bilateral renal agenesis (via oligohydramnios) to lethal pulmonary hypoplasia,
