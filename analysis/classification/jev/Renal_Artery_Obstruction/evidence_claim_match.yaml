      assertion_type: Pathophysiology
      assertion:
        name: Other rare stenotic and nonstenotic renal artery obstruction
        description: Dissection, segmental arterial mediolysis, aneurysm-related pulsatility, arteriovenous
          shunting, and extrinsic compression are sparse but recognized rare mechanisms that can impair
          renal arterial perfusion.
      selected_evidence:
        snippet: For didactic reasons, we have grouped these different entities into stenotic lesions
          (neurofibromatosis type 1 and other rare syndromes, dissection, arteritis, and segmental arterial
          mediolysis) often associated with aortic coarctation and other arterial abnormalities, and nonstenotic
          lesions, where hypertension is secondary to compression of adjacent arteries and changes in
          arterial pulsatility (aneurysm) or to the formation of a shunt, leading to kidney ischemia (arteriovenous
          fistula).
        supports: SUPPORT
