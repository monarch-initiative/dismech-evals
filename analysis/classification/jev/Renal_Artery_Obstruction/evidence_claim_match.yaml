          modifier: ABNORMAL
          term:
            id: GO:0030198
            label: extracellular matrix organization
      selected_evidence:
        snippet: Atherosclerotic renovascular disease is the most frequent cause of renovascular hypertension
          and its prevalence increases with age and in specific subset of patients, such as those with
          end-stage chronic kidney disease, heart failure, and coronary artery disease.
