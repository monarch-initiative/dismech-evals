      assertion_type: Stage
      assertion:
        name: Metastatic
        description: Advanced RCC with dissemination most commonly to lung, bone, liver, and brain. Clear
          cell biology predominates and is driven by VHL loss, HIF stabilization, intense angiogenesis,
          and context-dependent immune responsiveness that has made checkpoint blockade a core therapy
          in modern metastatic RCC.
        notes: Folded in from the former Metastatic_Renal_Cell_Carcinoma entry (cancer granularity ladder,
          design decisions §3a). Lung and bone are common metastatic destinations, but the dominant mechanistic
          theme is still VHL-HIF-driven angiogenic biology layered with heterogeneous immune responsiveness;
          the Tumor Cell Invasion and Hematogenous Dissemination pathophysiology nodes carry the stage-specific
          mechanism content.
      selected_evidence:
        snippet: The 1-, 3-, and 5-year OS rate was 49.4%, 18.9%, and 8.2%, respectively.
        supports: SUPPORT
