  71698ded6ed3a006222cb24841a011e85687fb3d90d13fb810a077f4c4b273e7:
    claim:
      about:
        disease:
          name: Renal Cell Carcinoma
          disease_term:
            preferred_term: renal cell carcinoma
            term:
              id: MONDO:0005086
              label: renal cell carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Cuproptosis via PRR15/NF-κB/FDX1 Axis
        description: Cuproptosis is a copper-dependent form of regulated cell death that acts as a tumor
          suppressor in RCC. Ferredoxin 1 (FDX1) serves as a core regulator of cuproptosis and its associated
          mitochondrial dysfunction. PRR15 (Proline-rich 15) promotes cuproptosis through a regulatory
          axis, but during RCC development, PRR15 is silenced. This silencing activates NF-κB signaling,
          which represses FDX1 expression, blocking cuproptosis and promoting tumor invasiveness and metastasis.
          The evasion of cuproptosis contributes to RCC progression by allowing tumor cells to escape
          this cell-death pathway while maintaining enhanced lipid metabolism and altered oxidative stress
          regulation in the tumor microenvironment.
        genes:
        - preferred_term: PRR15
          term:
            id: hgnc:22310
            label: PRR15
          modifier: DECREASED
        - preferred_term: FDX1
          term:
            id: hgnc:3638
            label: FDX1
          modifier: DECREASED
        cell_types:
        - preferred_term: renal carcinoma cell
          term:
            id: CL:0002518
            label: kidney epithelial cell
        biological_processes:
        - preferred_term: cuproptosis
          term:
            id: GO:0160119
            label: cuproptosis
          modifier: DECREASED
        - preferred_term: canonical NF-kappaB signal transduction
          term:
            id: GO:0007249
            label: canonical NF-kappaB signal transduction
          modifier: INCREASED
      selected_evidence:
        snippet: PRR15 promotes cuproptosis and mitochondrial damage in RCC cells and inhibits tumor proliferation
          and metastasis, as demonstrated in vivo and in vitro. When RCC develops, PRR15 silencing activates
          the nuclear factor kappa-B (NF-κB) signaling pathway, which inhibits FDX1 expression, ultimately
          blocking the cuproptosis process and increasing tumor invasiveness.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41673093
      reference_title: PRR15 suppresses renal cell carcinoma progression via the NF-κB/FDX1 axis to induce
        cuproptosis and mitochondrial dysfunction.
      evidence_source: IN_VITRO
      explanation: The study demonstrates that PRR15 loss leads to NF-κB activation and FDX1 suppression,
        blocking cuproptosis and promoting RCC progression.
