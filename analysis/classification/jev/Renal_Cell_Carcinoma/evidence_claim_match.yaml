  daec68806330b99bc253adaf1d1b80d5e84b3b73bee9fdbc5b4a18c8e84cbc2c:
    claim:
      about:
        disease:
          name: Renal Cell Carcinoma
          disease_term:
            preferred_term: renal cell carcinoma
            term:
              id: MONDO:0005086
              label: renal cell carcinoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mrcc_gut_microbiota_checkpoint_response
        prompt: Does gut microbiota composition causally determine immune checkpoint inhibitor response
          in metastatic renal cell carcinoma, or does it track a host immune state set by something else?
          In the only randomized test to date, adding the live biotherapeutic CBM588 to nivolumab-ipilimumab
          was followed by a large progression-free survival difference while the trial's microbiome primary
          endpoint went unmet, so no measured microbial change currently explains the clinical effect,
          and the taxa, metabolites, and immune steps that would connect a gut community to intratumoral
          checkpoint sensitivity remain unidentified.
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Immune Microenvironment and Checkpoint Sensitivity
        - pathophysiology#Immune Evasion
        - treatments#Immune Checkpoint Inhibitor Combination Therapy
        rationale: 'This entry models checkpoint sensitivity as a property of the tumor immune microenvironment
          with no host-external input. A candidate input exists: gut microbiota composition is repeatedly
          reported as a correlate of checkpoint inhibitor efficacy across tumor types, and in metastatic
          renal cell carcinoma specifically, a randomized phase 1 trial of nivolumab-ipilimumab with or
          without CBM588 reported a median progression-free survival of 12.7 versus 2.5 months favouring
          the supplemented arm. The mechanistic problem is that the same trial detected no significant
          change in Bifidobacterium spp. or in Shannon diversity - the measurement that was supposed to
          carry the mechanism. A benefit whose proposed mediator did not move leaves three live possibilities
          the current data cannot separate: an unmeasured microbial or metabolite change, a microbiota-independent
          effect of the product, or a chance result in a 30-patient open-label study. Until one is established,
          curating a gut-microbiota node upstream of checkpoint sensitivity would assert a causal edge
          the evidence does not support. The cross-disease review that prompted this discussion makes
          the same point structurally: gut composition is emerging as a predictive marker, but the field''s
          primary obstacle is a lack of methodological standardization that generates observational inconsistency
          and complicates causal inference.'
        proposed_experiments:
        - experiment_id: exp_mrcc_microbiota_checkpoint_mediation_trial
          experiment_design: INTERVENTIONAL_TRIAL
          name: Mediation-powered randomized live-biotherapeutic trial with paired stool and tumor immune
            profiling
          description: Repeat the CBM588 randomization at a sample size powered for mediation rather than
            for a single-taxon abundance endpoint, in treatment-naive metastatic renal cell carcinoma
            receiving nivolumab-ipilimumab. Collect paired longitudinal stool shotgun metagenomes and
            fecal metabolomes together with on-treatment tumor biopsies, and test formally whether any
            microbial or metabolite feature mediates the progression-free survival difference. Include
            a heat-inactivated product arm to separate live colonization from formulation and placebo
            effects.
          experiment_type:
            preferred_term: randomized controlled trial with causal mediation analysis
          readouts:
          - name: Microbial or metabolite mediator of the progression-free survival difference
            target: pathophysiology#Immune Microenvironment and Checkpoint Sensitivity
            description: Fraction of the progression-free survival difference attributable to a prespecified
              microbial taxon or fecal metabolite, estimated by causal mediation analysis over paired
              longitudinal samples.
            assays:
            - preferred_term: shotgun metagenomic sequencing
            - preferred_term: untargeted fecal metabolomics
          - name: Intratumoral effector T cell infiltration on treatment
            target: pathophysiology#Immune Evasion
            description: Change in CD8-positive effector T cell density and exhaustion-marker expression
              in on-treatment biopsies, compared between the supplemented and control arms.
            assays:
            - preferred_term: multiplex immunofluorescence
            - preferred_term: single-cell RNA sequencing
            direction: INCREASED
          decision_criterion: A gut-microbiota input to checkpoint sensitivity is supported if a microbial
            or metabolite feature significantly mediates the progression-free survival difference AND
            that feature tracks with increased intratumoral effector T cell infiltration. It is not supported
            if the clinical benefit reproduces in the heat-inactivated arm, or if no measured microbial
            feature mediates it - in which case the effect belongs outside the microbiota axis and the
            trial result should be treated as unexplained.
          would_support:
          - pathophysiology#Immune Microenvironment and Checkpoint Sensitivity
        notes: 'Recorded from monarch-initiative/dismech#6383. Originally attached to the former Metastatic_Renal_Cell_Carcinoma
          entry (folded into this entry per design decisions §3a) because checkpoint sensitivity and checkpoint-inhibitor
          combination therapy are modeled on those nodes, and the randomized evidence is in treatment-naive
          metastatic disease. The two PMID:42426614 items carry `evidence_source: OTHER` because that
          publication is a narrative review making a field-level synthesis claim rather than reporting
          primary data; see monarch-initiative/dismech#8184.'
      selected_evidence:
        snippet: The composition of the gut microbiota is emerging as a potential predictive marker for
          ICI efficacy, as the enrichment of certain beneficial taxa has been linked to favorable outcomes.
        supports: SUPPORT
