  ee4d302778a28165c75b26f145a990dcd24a5560a1c53ae807f9e0b01edb5041:
    claim:
      about:
        disease:
          name: Renal Cell Carcinoma
          disease_term:
            preferred_term: renal cell carcinoma
            term:
              id: MONDO:0005086
              label: renal cell carcinoma
        context:
        - path: /computational_models/0
          value:
            name: RCC 3D Agent-Based Learning Model
            description: Spatial three-dimensional agent-based simulation of established renal cell carcinoma,
              immune-cell populations, sex-hormone effects, and ICI or TKI treatment rules. A genetic
              algorithm evolves synthetic tumor-cell genotypes, while Optuna tunes model parameters against
              overall-survival and survival-status outcomes from selected ARON registry cases.
            model_type: AGENT_BASED
            repository_url: https://github.com/marco-caputo/RCC-agent-learning-model/tree/40220d6c398d90b41971f102acb9f84838982601
            model_id: GitHub:marco-caputo/RCC-agent-learning-model@40220d6c398d90b41971f102acb9f84838982601
            base_model: OncoAgent RCC obesity-paradox agent-based learning model (PMID:33996779)
            model_software: Python 3.13; Mesa 3.2.0; Optuna; Solara 1.48.0; pythreejs 2.4.2
            model_format: Custom imperative Python/Mesa source (not SBML or CellML); Jupyter Notebook
              (IPYNB); CSV patient input
            publication: PMID:42064045
            variables:
            - name: Patient sex
              dataset_identifier: sex
              description: Biological-sex input used to initialize hormone and immune-cell rules.
            - name: Treatment regimen
              dataset_identifier: treatment
              description: Model input selecting ICI, TKI, combined ICI plus TKI, or no treatment.
            - name: Treatment start
              dataset_identifier: treatment_start
              description: Simulation step at which the selected treatment begins.
              unit: simulation step
            - name: Tumor-cell count
              dataset_identifier: Tumor Cells
              description: Number of spatial tumor-cell agents collected during a simulation.
              unit: cells
            - name: Simulated overall survival
              dataset_identifier: steps
              description: Number of simulation steps before the modeled stopping outcome.
              unit: simulation steps
            - name: Mean tumor mutation mask
              dataset_identifier: average_mutation_mask
              description: Mean binary mutation profile across the simulated tumor-cell population, used
                to summarize within-model genetic adaptation.
              unit: fraction
            notes: 'The GitHub repository is pinned at unsigned commit 40220d6c398d90b41971f102acb9f84838982601
              (tree acfe9582f716869dc965aad04c11f279a5c13470) and has no tags or releases. Zenodo record
              10.5281/zenodo.18727138 archives software version 1.0.0 as RCC-ALM.zip (SHA-256 4e7c38b570916555fac9fd422f0e5b8d52c5ebd2f8c93a708f3b0dedf4745358),
              although pyproject.toml calls the package 0.1.0; all 72 archived files are byte-identical
              to the pinned Git tree. Software Heritage directory swh:1:dir:570c82c75e1f417940762d4d66706f3467df706c
              contains the matching inner Git-tree directory, but no revision object for the commit resolves,
              so it preserves deposited content rather than Git history. The repository LICENSE and Zenodo
              software record are MIT. The upstream ARON-1 dataset is Zenodo DOI 10.5281/zenodo.13353313
              under CC BY 4.0. The repository contains three byte-identical copies of a derived seven-row,
              19-column CSV (SHA-256 aef040b2d21069fcdb58aca45a3331fa03c85c2dfadf6b9d5e8bc713cbf1d585),
              but does not cite that DOI, state data-specific attribution or licensing, or provide the
              manual selection and conversion procedure. Curator smoke testing installed the requirements
              under Python 3.13.9, constructed and advanced the 643-agent default model, exercised a small
              data pipeline, and completed the documented 100-step non-GUI command. That command emits
              only console traces and does not reproduce a paper result. Reproducibility remains partial:
              dependencies are not fully pinned or locked; the documented Solara interface fails with
              the resolved unbounded Starlette version; the built wheel omits required package data and
              uses incompatible src.* imports outside the checkout; and the analysis notebook has no executed
              outputs or reference results. There are 83 tuned weights for seven non-held-out cases. The
              MSE result-loading code mistakenly reloads CI parameters, repeat-count handling is defective,
              stochastic antigen selection depends on Python hash ordering, and a class-global tumor blood-source
