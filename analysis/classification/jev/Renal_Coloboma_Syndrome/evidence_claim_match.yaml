          never begins - the extreme of the branching defect rather than the graded reduction seen in
          patients.
        limitations: Human disease is heterozygous and produces a small maldeveloped kidney, not agenesis;
          the homozygous model overshoots the human lesion.
      selected_evidence:
        snippet: We report here that Pax-2 homozygous mutant newborn mice lack kidneys, ureters and genital
          tracts.
        supports: SUPPORT
