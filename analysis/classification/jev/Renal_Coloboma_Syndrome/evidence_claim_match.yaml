        description: With too few nephrons for body size, single-nephron filtration rises, the remaining
          glomeruli hypertrophy, and the resulting haemodynamic stress drives proteinuria, hypertension
          and a steady loss of the nephrons that are left. This is the route by which a congenital, non-progressive
          malformation becomes progressive chronic kidney disease.
        role: consequence
        biological_scale: ORGANISM
        biological_processes:
        - preferred_term: glomerular filtration
          term:
            id: GO:0003094
            label: glomerular filtration
          modifier: INCREASED
        locations:
        - preferred_term: renal glomerulus
          term:
            id: UBERON:0000074
            label: renal glomerulus
      selected_evidence:
        snippet: During kidney development, PAX2 suppresses apoptosis in the developing ureteric bud;
          therefore, PAX2 pathogenic variants increase apoptosis during the development of the kidneys
          and urinary tract, which may underlie the decreased nephron number, hypertrophy of the remaining
          nephrons, and RHD
        supports: SUPPORT
