  a0a130fa09a6058fea7195e55483e3253a94c52a47cf77ef13547f5e5d583f62:
    claim:
      about:
        disease:
          name: Renal Coloboma Syndrome
          disease_term:
            preferred_term: PAX2-related disorder
            term:
              id: MONDO:0007352
              label: renal coloboma syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PAX2 Haploinsufficiency
        description: 'A heterozygous loss-of-function variant in PAX2 - most often a frameshift, nonsense
          or canonical splice-site change, with the recurrent c.76dupG (p.Val26Glyfs*28) in exon 2 the
          commonest single allele - halves the dose of a paired-box transcription factor that is required
          in the nephric duct, ureteric bud, metanephric mesenchyme, optic stalk and otic vesicle. The
          resulting phenotypes are dosage effects in tissues where PAX2 is transcriptionally rate-limiting,
          which is why one gene produces an apparently unrelated kidney-plus-eye combination. Mechanistically
          PAX2 does not act alone: it recruits a PTIP-MLL H3K4 methyltransferase complex to its target
          loci, so halving PAX2 halves the delivery of an activating chromatin mark to the developmental
          programmes it licenses.'
        role: trigger
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: PAX2 paired-domain DNA-binding transcription factor activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
          modifier: DECREASED
        genetic_context:
          gene:
            preferred_term: PAX2
            term:
              id: hgnc:8616
              label: PAX2
          zygosity: HETEROZYGOUS
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Most pathogenic alleles are predicted loss of function. A dominant-negative contribution
            has been proposed for the recurrent c.76dupG allele, whose transcript escapes nonsense-mediated
            decay, and for some FSGS-associated missense alleles that enhance PAX2 repressor activity.
      selected_evidence:
        snippet: We have conducted a mutational analysis of PAX2 in a family with optic nerve colobomas,
          renal hypoplasia, mild proteinuria and vesicoureteral reflux. We report a single nucleotide
          deletion in exon five, causing a frame-shift of the PAX2 coding region in the octapeptide domain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:7795640
      reference_title: Mutation of the PAX2 gene in a family with optic nerve colobomas, renal anomalies
        and vesicoureteral reflux.
      evidence_source: HUMAN_CLINICAL
      explanation: The founding report linking a truncating PAX2 allele to the combined ocular and renal
        phenotype in a segregating family.
