      assertion_type: Pathophysiology
      assertion:
        name: Reduced Podocyte Fitness
        description: A second mechanistic arm, distinct from the developmental one. PAX2 is normally silenced
          in the mature podocyte, and variant carriers whose nephrons formed normally still show podocytes
          that are unusually vulnerable to injury, together with disturbed nuclear maintenance in parietal
          epithelial cells and reduced regenerative capacity under stress. This arm explains the albuminuria
          that is disproportionate to the CKD stage, and the families in whom adult-onset FSGS is the
          whole phenotype.
        role: mechanism
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: podocyte
          term:
            id: CL:0000653
            label: podocyte
        - preferred_term: parietal epithelial cell
          term:
            id: CL:1000452
            label: parietal epithelial cell
        locations:
        - preferred_term: renal glomerulus
          term:
            id: UBERON:0000074
            label: renal glomerulus
      selected_evidence:
        snippet: Thus, mutations in PAX2 may contribute to adult-onset FSGS in the absence of overt extrarenal
          manifestations.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/1
      context_paths:
