        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: podocyte_fitness_pathway
        hypothesis_label: PAX2 nephropathy as a second, postnatal podocyte disease
        status: EMERGING
        description: 'The conventional model treats PAX2 kidney disease as purely developmental: fewer
          nephrons, then hyperfiltration, then chronic kidney disease. An emerging model adds a second
          arm in which PAX2 variants reduce the resilience of mature podocytes and parietal epithelial
          cells, producing albuminuria out of proportion to the structural lesion and, in some families,
          FSGS with no malformation at all. The clinical observation that motivates it is the excess albuminuria
          in PAX2 carriers relative to stage-matched CAKUT controls; the experimental support is patient-derived
          iPSC podocytes whose vulnerability to injury is corrected by repairing the variant. It matters
          therapeutically because the developmental arm is fixed at birth while podocyte injury might
          be modifiable.'
      selected_evidence:
        snippet: PAX2 nephropathy may be an exception, because podocyte injury might be partially modifiable,
          raising the prospect of prolonging nephron survival in patients with milder dysplasia.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
