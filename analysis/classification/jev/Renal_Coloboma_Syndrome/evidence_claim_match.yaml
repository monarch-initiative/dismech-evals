        context: []
      assertion_type: Genetic
      assertion:
        name: PAX2
        presence: Positive
        relationship_type: CAUSATIVE
        association: Renal coloboma syndrome / PAX2-related disorder
        gene_term:
          preferred_term: PAX2
          term:
            id: hgnc:8616
            label: PAX2
        notes: PAX2 (10q24.31) encodes a paired-box transcription factor expressed in the nephric duct,
          ureteric bud, metanephric mesenchyme, optic stalk, otic vesicle and CNS during development.
          Pathogenic alleles are overwhelmingly predicted loss of function and cluster in the paired domain
          encoded by exons 2-4; the recurrent c.76dupG (p.Val26Glyfs*28) is the single commonest allele,
          arising in a seven-guanine homopolymer tract that appears mutationally unstable, which is why
          unrelated families share it rather than descending from a founder. Whole-gene deletions account
          for roughly 3% of cases; exon-level rearrangements appear not to contribute further.
      selected_evidence:
        snippet: Mutations in the paired-box gene, PAX2, have been identified in approximately half of
          individuals with classic findings of renal hypoplasia/dysplasia and abnormalities of the optic
          nerve.
        supports: SUPPORT
