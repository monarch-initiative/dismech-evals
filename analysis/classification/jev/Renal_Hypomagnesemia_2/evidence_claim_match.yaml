      assertion_type: Discussion
      assertion:
        discussion_id: no_in_vivo_model_of_fxyd2_g41r
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced DCT Transcellular Magnesium Reabsorption
        prompt: Does a whole-animal FXYD2 defect reproduce the renal magnesium wasting of human HOMG2?
        rationale: 'There is no reported G41R knock-in animal. The available model is the Fxyd2-null mouse,
          which is a loss-of-one-function model rather than the human dominant-negative one, and it does
          not show overt hypomagnesemia: FXYD2-deficient mice kept urine electrolytes in the normal range
          (PMID:25472608). A later reanalysis of the same data argues that urinary magnesium was in fact
          moderately but significantly raised (PMID:30175537), so whether the mouse is even a partial
          model is disputed. Because the human disease is dominant-negative and the mouse is a null, the
          mouse may not test the human mechanism at all.'
        proposed_experiments:
        - experiment_id: fxyd2_g41r_knockin_mouse
          experiment_design: TARGETED_PERTURBATION
          name: Fxyd2 p.Gly41Arg knock-in mouse
          description: Knock the patient variant into mouse Fxyd2 and measure serum magnesium, fractional
            magnesium excretion and DCT magnesium transport, alongside an Fxyd2-null line, to separate
            the dominant-negative mechanism from simple loss of the subunit.
          would_support:
          - pathophysiology#Reduced DCT Transcellular Magnesium Reabsorption
          supporting_outcome:
          - Knock-in mice waste magnesium in the urine and become hypomagnesemic while null mice do not.
          refuting_outcome:
          - Knock-in mice keep normal serum magnesium and fractional magnesium excretion.
      selected_evidence:
        snippet: no obvious renal phenotype was detected in mice with global deletion of FXYD2
        supports: SUPPORT
    origin:
