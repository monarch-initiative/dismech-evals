            publication: PMID:18448590
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Loss of FXYD2 Regulation of the DCT Na,K-ATPase
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: MOLECULAR
        description: The oocyte and MDCK assays show that G41R changes FXYD2 ion-handling and abolishes
          a basolateral magnesium current carried by wild-type FXYD2.
        limitations: Xenopus oocytes and canine MDCK cells are heterologous systems, not DCT cells, and
          the G41R gain-of-function cation current they report is one of two competing mechanisms and
          is not shown in patients.
        divergences:
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: The systems are amphibian oocyte and canine kidney epithelium, not human DCT, so
            the magnesium-handling context of the human segment is not reproduced.
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: The assays observe a single transfected protein's currents and do not contain the
            intact DCT pump, the apical TRPM6 channel, or the tubular magnesium gradient that set reabsorption
            in the patient.
      selected_evidence:
        snippet: in contrast to the wild-type FXYD2 currents, inward rectifying cation currents were induced
          by hyperpolarization pulses in oocytes expressing the G41R mutant.
        supports: SUPPORT
