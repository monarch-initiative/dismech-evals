          FXYD2. When the two are co-expressed, processing of the wild-type protein (read out as artificial
          glycosylation) is reduced, which suggests the mutant holds wild-type subunits back from the
          plasma membrane. Haploinsufficiency is unlikely to explain the disease, because people lacking
          one FXYD2 copy have normal serum magnesium. A study of isolated transmembrane peptides found
          the opposite result for oligomerization, so the physical basis of the interference is not fully
          settled.
