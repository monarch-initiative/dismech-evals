          One holds that the pump is destabilized and inactivated, so the cell cannot sustain the intracellular
          potassium that sets the apical membrane potential driving TRPM6 magnesium entry. The other holds
          that FXYD2 itself mediates basolateral magnesium exit, which the mutant cannot do. The step
          is not demonstrated in patient tissue.
        intermediate_mechanisms:
        - Na,K-ATPase destabilization with loss of apical driving force for TRPM6
        - loss of FXYD2-mediated basolateral magnesium extrusion
      selected_evidence:
        snippet: Renal Mg wasting associated with impaired Na,K-ATPase/FXYD2 interactions is explained
          simply by destabilization and inactivation of Na,K-ATPase.
