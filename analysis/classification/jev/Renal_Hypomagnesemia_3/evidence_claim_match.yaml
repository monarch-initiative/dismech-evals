      assertion_type: Pathophysiology
      assertion:
        name: Loss of Cation-Selective TAL Tight Junction Pathway
        biological_scale: CELLULAR
        description: In the TAL, magnesium and calcium are reabsorbed between cells, driven by a lumen-positive
          voltage. Claudin-16 behaves as a non-selective cation channel rather than a dedicated magnesium
          channel, and its interaction with claudin-19 gives the tight junction its cation selectivity.
          Without it the junction loses cation selectivity, so the driving force and pathway for divalent
          cation reabsorption are lost.
        cell_types:
        - preferred_term: TAL epithelial cell
          term:
            id: CL:1001106
            label: kidney loop of Henle thick ascending limb epithelial cell
        cellular_components:
        - preferred_term: tight junction
          term:
            id: GO:0005923
            label: bicellular tight junction
        locations:
        - preferred_term: thick ascending limb of loop of Henle
          term:
            id: UBERON:0001291
            label: thick ascending limb of loop of Henle
      selected_evidence:
        snippet: PCLN-1 is located in tight junctions of the TAL and is related to the claudin family
          of tight junction proteins.
        supports: SUPPORT
