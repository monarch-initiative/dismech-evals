  70f8c1f0f60e56f0da1dac8c467e8a0b04f8f21afa6fafdcfeb34b2081e0a08d:
    claim:
      about:
        disease:
          name: Renal Hypomagnesemia 4
          disease_term:
            preferred_term: renal hypomagnesemia 4
            term:
              id: MONDO:0012717
              label: renal hypomagnesemia 4
        context: []
      assertion_type: Biochemical
      assertion:
        name: Fractional excretion of magnesium
        presence: INCREASED
        loinc_term:
          id: LOINC:80958-2
          label: Fractional excretion of magnesium [Ratio] in Urine and Serum or Plasma
        notes: 'Fractional magnesium excretion was inappropriately high for the low serum magnesium in
          both sisters: 4.8% in V3 and 3.6% in V4, with serum magnesium 0.53-0.66 mM. A fractional excretion
          above 2% during hypomagnesemia indicates renal magnesium loss.

          The bound code is the one fractional excretion code for magnesium in LOINC release 2.83, and
          it is specific: the release carries seven fractional excretion codes covering sodium, potassium,
          calcium, phosphate, urea and magnesium, and only this one names magnesium. It spans both specimens,
          which matches the quantity, a ratio computed from paired urine and serum results rather than
          a urinary concentration. A Part also exists for this quantity - LOINC:LP207800-6, readable in
          the Monarch KG rather than in the release table, which carries no Part codes - and it is recorded
          here rather than bound, because this slot names the measurement that quantifies the marker and
          the Part carries neither the specimen pair nor the ratio property. The 2 per cent threshold
          is not carried as a reference-range band: the source states it as an excretion above 2 per cent,
          a strict inequality, and a band''s lower bound is inclusive, so the only available bound would
          place exactly 2 per cent inside the abnormal range when the source places it outside.'
      selected_evidence:
        snippet: Two affected sisters, V3 and V4 (Figure 1A), displayed low serum Mg2+ levels (0.53-0.66
          mM) in combination with urinary fractional excretion (FE) values of Mg2+ of 4.8% and 3.6%, respectively.
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/1
      evidence_path: /biochemical/1/evidence/0
