              term:
                id: GO:0007173
                label: epidermal growth factor receptor signaling pathway
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Insufficient TRPM6 Activation
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: EGFR stimulation activates TRPM6 through Src-family kinases and Rac1, which move
          TRPM6 from intracellular stores to the plasma membrane, and through ERK/AP-1, which raises TRPM6
          transcription.
        intermediate_mechanisms:
        - Src-family kinase and Rac1 signaling
        - ERK/AP-1 transcriptional activation
      selected_evidence:
        snippet: In summary, EGF-mediated stimulation of TRPM6 occurs via signaling through Src kinases
          and Rac1, thereby redistributing endomembrane TRPM6 to the plasma membrane.
        supports: SUPPORT
