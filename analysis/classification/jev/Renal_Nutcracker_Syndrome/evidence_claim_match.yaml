      assertion:
        name: Glomerular haematuria
        description: The commonest and most consequential differential. Nutcracker syndrome is a non-glomerular
          cause of haematuria and is a recognised consideration in haematuria of unknown origin, so patients
          are frequently investigated for glomerulonephritis, and some undergo renal biopsy, before the
          vein is looked at.
        distinguishing_features:
        - Nutcracker haematuria is left-sided and non-glomerular, with normal red cell morphology and
          no casts.
        - Glomerular haematuria shows dysmorphic red cells and red cell casts, and is not lateralised.
      selected_evidence:
        snippet: Nutcracker syndrome is worth considering especially in differential diagnosis of haematuria
          of unknown origin.
        supports: SUPPORT
