      assertion_type: Prevalence
      assertion:
        population: General population, asymptomatic left renal vein compression on imaging
        measure_type: POINT_PREVALENCE
        prevalence_class: COMMON
        rate_per_100000: 23000.0
        notes: 'This is the prevalence of the nutcracker PHENOMENON, not the syndrome, and it is recorded
          here precisely because the gap between the two is the central problem of the disease. Published
          estimates of the phenomenon range from about 10% to about 30% depending on the imaging criterion
          applied - the 250-patient consortium paper cited elsewhere in this entry puts it near 10%. That
          spread is itself the point: a finding whose measured frequency triples with the threshold used
          cannot carry a diagnosis on its own. Only a small minority of those with the finding have attributable
          symptoms, and no reliable prevalence figure exists for the syndrome itself.'
      selected_evidence:
        snippet: studies suggest ~23% of the population may have evidence of asymptomatic LRV compression
          on imaging
        supports: SUPPORT
