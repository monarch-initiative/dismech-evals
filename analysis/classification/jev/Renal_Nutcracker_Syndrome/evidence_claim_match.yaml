        name: Venous collateral formation
        biological_scale: TISSUE
        description: 'Collateral drainage through the left gonadal vein and the communicating lumbar veins
          is the most significant structural effect. It is also clinically double-edged: it decompresses
          the kidney, which is why some patients remain asymptomatic, but it is itself the cause of the
          varicocele and pelvic congestion symptoms. It further matters surgically, because unrecognised
          collaterals complicate retroperitoneal and vascular procedures.'
        locations:
        - preferred_term: Vein
          term:
            id: UBERON:0001638
            label: vein
      selected_evidence:
        snippet: Undiagnosed NCS may affect retroperitoneal surgery and other radiological and vascular
          procedures.
        supports: SUPPORT
