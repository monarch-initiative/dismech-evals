              id: MONDO:0019105
              label: renal nutcracker syndrome
        context:
        - path: /pathophysiology/1
          value:
            name: Left renal vein hypertension
            biological_scale: TISSUE
            description: Obstructed outflow raises pressure in the left renal vein. This is the one node
              in the pathograph that is directly measurable in patients, as the renocaval pressure gradient
              at venography, and it is the measurement used to select patients for intervention rather
              than to make the initial diagnosis.
            locations:
            - preferred_term: Left renal vein
              term:
                id: UBERON:0001142
                label: left renal vein
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Glomerular capillary hypertension and orthostatic proteinuria
        description: 'The conventional explanation is that impaired venous outflow raises pressure upstream
          through the renal microcirculation, increasing glomerular capillary pressure and protein filtration,
          and that the postural dependence of the compression makes the proteinuria orthostatic. The route
          is unconfirmed: a 2024 Delphi panel given this theory did not endorse it (see ncs_symptom_mechanisms_unresolved).'
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        intermediate_mechanisms:
        - Transmission of renal venous pressure to the glomerular capillaries (suspected)
        - Angiotensin II and norepinephrine release driven by renal vein pressure (suspected)
      selected_evidence:
        snippet: which can induce mesangial changes and be improved by ACE inhibitor treatment
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1/downstream/1
      evidence_path: /pathophysiology/1/downstream/1/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /pathophysiology/1
    evidence_metadata:
      reference: PMID:16902785
      reference_title: ACE inhibition can improve orthostatic proteinuria associated with nutcracker syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that the venous lesion drives a glomerular process with histological consequences,
        not merely a urinary finding.
