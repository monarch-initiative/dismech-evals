        - diagnosis#Stepwise diagnostic workup for nutcracker syndrome
        prompt: What renocaval pressure gradient or degree of left renal vein stenosis actually discriminates
          symptomatic nutcracker syndrome from the asymptomatic nutcracker phenomenon?
        rationale: This is the central unresolved problem of the disease and it is a measurement-validity
          problem, not a mechanistic one. Left renal vein compression is common and usually asymptomatic,
          so no imaging threshold can be diagnostic on its own. The thresholds in use were identified
          by counting what published studies did, across 14 studies and 384 patients, rather than by testing
          any threshold against a clinical outcome; the systematic review that assembled them describes
          the broad spectrum of clinical presentations and radiologic findings as the reason diagnosis
          is challenging. Until a threshold is validated prospectively against symptom resolution after
          intervention, the diagnosis rests on a clinical judgement that the imaging is being used to
          support rather than to make.
      selected_evidence:
        snippet: Radiographic evidence must be accompanied by serious symptoms to initiate the treatment
          of nutcracker syndrome
