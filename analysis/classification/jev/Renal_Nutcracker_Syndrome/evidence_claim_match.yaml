        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ncs_intervention_comparative_efficacy
        kind: KNOWLEDGE_GAP
        attaches_to:
        - treatments#Left renal vein transposition
        - treatments#Endovascular stenting of the left renal vein
        - treatments#Extravascular stenting of the left renal vein
        prompt: Given that open transposition outperforms stenting overall, is there a patient subgroup
          for whom an endovascular approach is nonetheless the right choice, and how durable is it in
          them?
        rationale: 'The first-line question is settled and this entry previously got it wrong. A 250-patient
          multi-institutional comparison found endovascular therapy worse on all outcomes and not appropriate
          as initial treatment, and a Delphi panel of 20 international experts reached consensus for transposition
          first; the statement that endovascular stenting is preferred over open procedures was rejected
          at 80% consensus. What remains genuinely open is narrower and more useful: no randomised comparison
          exists, the endovascular arms in the published series are small and non-randomised - typically
          offered to patients who declined surgery, which selects for a different population - and nobody
          has characterised which patients, if any, do well with a stent. Durability is the second half
          of the question, since a stent leaves the aortomesenteric geometry unchanged and migration is
          its characteristic failure mode. A 2025 systematic review of 24 studies and 578 patients puts
          numbers on the options without settling the question: transposition had the highest symptom
          resolution (92%) and also the highest reintervention rate (28.5%), and extravascular stenting
          resolved symptoms in 80% with no reported reintervention. These are pooled rates from non-randomised
          series, confounded by which patients were offered which treatment, and the review does not stratify
          by patient characteristics, so it quantifies the gap rather than closing it.'
      selected_evidence:
        snippet: The highest reintervention rate was observed after LRV transposition (28.5%), followed
          by endovascular stenting (11.3%) and RAT (7.2%)
        supports: SUPPORT
