        name: Glomerular capillary hypertension and orthostatic proteinuria
        biological_scale: TISSUE
        description: The third downstream limb of renal venous hypertension. Raised outflow pressure is
          conventionally held to be transmitted to the glomerular capillaries, increasing filtration of
          protein, with the effect postural because the compression itself is; that route is not established
          (see ncs_symptom_mechanisms_unresolved). It is not a benign urinary finding - sustained congestion
          has been shown to induce mesangial change on biopsy - and it is the one limb with a pharmacological
          treatment, since efferent arteriolar dilatation by ACE inhibition lowers intraglomerular pressure
          directly.
        locations:
        - preferred_term: Kidney
          term:
            id: UBERON:0002113
            label: kidney
      selected_evidence:
        snippet: Because of continuous proteinuria we performed a left renal biopsy which showed moderate
          mesangial hypercellularity.
        supports: SUPPORT
