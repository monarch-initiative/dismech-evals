      assertion_type: DifferentialDiagnosis
      assertion:
        name: Superior Mesenteric Artery Syndrome
        description: The other clinical consequence of a narrowed aortomesenteric angle. The same geometry
          that traps the left renal vein traps the third part of the duodenum, so the two share an anatomic
          substrate and can coexist in one patient. They are distinct diseases with distinct compressed
          structures and distinct presentations.
        distinguishing_features:
        - Nutcracker syndrome compresses the LEFT RENAL VEIN and presents with haematuria, orthostatic
          proteinuria, left flank pain, pelvic congestion and left varicocele.
        - SMA syndrome compresses the THIRD PART OF THE DUODENUM and presents with postprandial pain,
          vomiting and weight loss.
      selected_evidence:
        snippet: Nutcracker syndrome NCS is the most common term for compression of the left renal vein
          between the superior mesenteric artery and the abdominal aorta.
        supports: SUPPORT
