        description: An external stent placed around the left renal vein, by open, laparoscopic or robotic
          surgery, holds the aortomesenteric space open from outside rather than supporting the lumen
          from within. Unlike endovascular stenting it widens the aortomesenteric angle and leaves nothing
          in the venous lumen to migrate. A 2025 systematic review pooled 132 patients treated this way,
          the third-largest group after endovascular stenting and renal autotransplantation; its outcomes
          come from non-randomised series, so they are not a head-to-head comparison with transposition.
        treatment_term:
