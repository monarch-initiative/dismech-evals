              label: renal nutcracker syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mesoaortic compression of the left renal vein
        biological_scale: TISSUE
        description: 'The left renal vein crosses the midline between the superior mesenteric artery and
          the abdominal aorta. An abnormally narrow take-off angle of the superior mesenteric artery from
          the aorta narrows that corridor and compresses the vein. The predisposing anatomy is developmental:
          the left renal vein forms from the aortic collar in the sixth to eighth week of gestation. This
          is a geometric lesion - the vein itself is structurally normal, and there is no thrombosis,
          stenosis of the vessel wall, or inflammatory process.'
        locations:
        - preferred_term: Left renal vein
          term:
            id: UBERON:0001142
            label: left renal vein
        - preferred_term: Superior mesenteric artery
          term:
            id: UBERON:0001182
            label: superior mesenteric artery
        - preferred_term: Abdominal aorta
          term:
            id: UBERON:0001516
            label: abdominal aorta
      selected_evidence:
        snippet: The development of NCS is associated with the formation of the left renal vein LRV from
          the aortic collar during the sixth to eighth week of gestation and abnormal angulation of the
          superior mesenteric artery from the aorta.
        supports: SUPPORT
    origin:
