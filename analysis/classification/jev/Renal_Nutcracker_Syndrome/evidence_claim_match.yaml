      assertion_type: Environmental
      assertion:
        name: Low body mass index or rapid weight loss
        description: The aortomesenteric angle is held open by a retroperitoneal and perivascular fat
          pad. Anything that depletes it - rapid weight loss, an asthenic habitus, a catabolic illness
          or major surgery - narrows the angle and can convert an asymptomatic anatomy into a symptomatic
          one. This is the principal modifiable risk factor, and the only one, which is why weight restoration
          is a first-line management step rather than general advice.
      selected_evidence:
        snippet: After three months, the BMI was 18 Kg/m2.The patient was operated on, he had a hepaticojejunal
          anastomosis on the left hepatic duct.
        supports: SUPPORT
