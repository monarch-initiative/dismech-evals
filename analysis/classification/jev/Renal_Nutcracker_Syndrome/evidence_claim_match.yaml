        attaches_to:
        - pathophysiology#Renal fornix varices and haematuria
        - pathophysiology#Glomerular capillary hypertension and orthostatic proteinuria
        prompt: By what mechanism does left renal vein hypertension actually produce haematuria and proteinuria?
        rationale: 'The fornix-varix rupture route for haematuria and the glomerular-pressure route for
          proteinuria are the conventional explanations, and are often stated as though they were settled.
          They are not, and this is the least secure part of the pathograph rather than the most: the
          two edges into these nodes are typed INDIRECT_UNKNOWN_INTERMEDIATES, with the candidate routes
          listed as suspected intermediate_mechanisms. The 2024 Delphi panel put both propositions to
          20 international experts and neither reached the 70% threshold: haematuria via rupture of the
          thin-walled septum reached 60%, and proteinuria via renal vein pressure acting through angiotensin
          II and norepinephrine reached 45%. The panel''s own summary of the mechanistic literature is
          blunt. Note the shape of what the field agrees on: consensus was reached on imaging and on transposition
          as first-line treatment, and withheld on both mechanisms - the reverse of what a reader might
          assume from how confidently the mechanisms are usually stated.'
      selected_evidence:
        snippet: No consensus was reached on the pathological cause of hematuria and proteinuria in NCS,
          despite supplying the panel with known theories. The mechanism is unknown.
        supports: SUPPORT
