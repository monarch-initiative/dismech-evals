        role: trigger
        biological_scale: MOLECULAR
        description: Loss of the B1 subunit of the V1 cytosolic domain of the vacuolar H+-ATPase. B1 is
          one of the few V-ATPase subunits whose expression is essentially restricted to kidney and inner
          ear, which is precisely why a defect in it produces a two-organ disease rather than a systemic
          one - the ubiquitous pumps elsewhere use a different B isoform and are unaffected.
        genetic_context:
          gene:
            preferred_term: ATP6V1B1
