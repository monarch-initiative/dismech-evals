          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: The diagnosis of hereditary dRTA is established in a proband with dRTA and biallelic
          pathogenic variants in ATP6V0A4, ATP6V1B1, FOXI1, or WDR72, a heterozygous or biallelic pathogenic
          variants in SLC4A1, or specific heterozygous pathogenic variants in ATP6V1B1 (affecting codon
          p.Arg394) identified by molecular genetic testing.
        supports: SUPPORT
