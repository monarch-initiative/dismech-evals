  d98fa0b856ff62dd8175f7b87c2da09c95b24fcbda5d77dcd6f6f869f9e8ac91:
    claim:
      about:
        disease:
          name: Renal Tubular Acidosis, Distal, 3, With or Without Sensorineural Hearing Loss
          disease_term:
            preferred_term: renal tubular acidosis, distal, 3, with or without sensorineural hearing loss
            term:
              id: MONDO:0011268
              label: renal tubular acidosis, distal, 3, with or without sensorineural hearing loss
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: atp6v0a4_hearing_onset_variability
        kind: KNOWLEDGE_GAP
        prompt: What determines whether and when an ATP6V0A4 patient loses hearing, given that biallelic
          loss of function produces severe hearing loss from two months of age in some patients and preserved
          hearing into adulthood in others, and given that genetic background is a demonstrated modifier
          in the sibling subunit's mouse?
        attaches_to:
        - pathophysiology#Cochlear Endolymph Acid-Base Homeostasis Failure
        - phenotypes#Sensorineural hearing loss
        rationale: 'This is the open question of the entry, and it is not a gap in whether the mechanism
          is real - the mouse null settles that with an abolished endocochlear potential. It is a gap
          in what modifies it. Four candidate explanations are on the table, and they are not equally
          evidenced.

          Genetic background is the best evidenced of the four, and it is the one an ATP6V0A4-only reading
          of the literature misses. In Atp6v1b1 mice the auditory phenotype depends on strain: MRL mutants
          are profoundly deaf, the same mutation on a C57BL/6 background is not, and a backcross maps
          a Chr 13 locus accounting for about 20% of hearing-threshold variance. That is a demonstrated
          modifier effect on dRTA-related hearing loss, and it is the reason this discussion does not
          claim the variability is unexplained.

          It is evidence about a different subunit, though, and the entry does not paper over that. No
          modifier mapping has been done for ATP6V0A4, in mice or in humans, so transferring the finding
          is an inference from one V-ATPase subunit to another - which is why the evidence item carries
          directness INDIRECT.

          The other three remain candidates with no study discriminating between them: residual a4 function
          differing by allele, enlarged vestibular aqueduct acting as a structural modifier, and ascertainment,
          since a cohort recruited through nephrology will not audiometrically test everyone at the same
          age. The two human series cited on the hearing phenotype point in opposite directions - seven
          early-onset probands in one, one affected of six in another - without either being wrong.'
        proposed_experiments:
        - experiment_id: atp6v0a4_longitudinal_audiometry
          name: Genotype-stratified longitudinal audiometry with inner-ear imaging
          description: Serial audiometry from infancy in a genotyped ATP6V0A4 cohort, with vestibular
            aqueduct measurement on imaging, so that allele, inner-ear structure and age at testing are
            separated rather than confounded.
          readouts:
          - name: Age at onset of measurable sensorineural hearing loss
            target: phenotypes#Sensorineural hearing loss
            direction: INCREASED
            interpretation: If onset age tracks vestibular aqueduct size independently of allele, the
              structural modifier explanation is supported over the residual-function one.
      selected_evidence:
        snippet: The abnormal inner ear phenotype of MRL- Atp6v1b1vtx/vtx mice was lost when the mutation
          was transferred onto the C57BL/6J (B6) background, indicating the influence of strain-specific
          genetic modifiers.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28934385
      reference_title: Hearing loss without overt metabolic acidosis in ATP6V1B1 deficient MRL mice, a
        new genetic model for non-syndromic deafness with enlarged vestibular aqueducts.
      evidence_source: MODEL_ORGANISM
      explanation: The strain-swap experiment, which is the cleaner demonstration - the same mutation
        produces deafness or not depending only on background. Same INDIRECT caveat as above.
