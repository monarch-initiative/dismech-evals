            term:
              id: MONDO:0011268
              label: renal tubular acidosis, distal, 3, with or without sensorineural hearing loss
        context: []
      assertion_type: Treatment
      assertion:
        name: Oral Alkali Replacement
        therapeutic_modality: SMALL_MOLECULE
        description: 'Bicarbonate and citrate salts given to replace the buffer the kidney cannot regenerate.
          Citrate preparations do double duty, since urinary citrate is itself the depleted inhibitor
          of calcium precipitation in this disease.

          It treats the consequence and not the cause. The pump stays defective and the urine stays inappropriately
          alkaline. Critically, it does not act on the ear: the auditory arm is parallel to the acidosis
          rather than downstream of it, so correcting blood pH has no mechanistic reason to change hearing
          outcome.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: sodium bicarbonate
            term:
              id: CHEBI:32139
              label: sodium hydrogencarbonate
          - preferred_term: potassium citrate
            term:
              id: CHEBI:64733
              label: potassium citrate (anhydrous)
      selected_evidence:
        snippet: The medical treatment is simple and involves an alkali load which allows curing the metabolic
          acidosis.
        supports: SUPPORT
