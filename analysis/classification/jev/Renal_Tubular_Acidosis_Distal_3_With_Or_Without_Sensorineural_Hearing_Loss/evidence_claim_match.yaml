      assertion_type: AnimalModel
      assertion:
        name: Atp6v0a4 knockout mouse
        species: Mouse
        genotype: Atp6v0a4 null (homozygous knockout)
        publication: PMID:22872862
        description: A germline null that reproduces both arms of the human disease. It is the model that
          turns the auditory arm from an expression-and-inference argument into a measured one, and it
          also shows an extrarenal, extra-auditory phenotype - impaired olfaction - that has no established
          human counterpart.
        modeled_mechanisms:
        - target: Cochlear Endolymph Acid-Base Homeostasis Failure
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: The null abolishes the endocochlear potential, which is the direct physiological
            readout of endolymph homeostasis failure.
          limitations: The human auditory phenotype is variable in onset and sometimes absent, whereas
            the null mouse is uniformly and severely affected. The model therefore describes the mechanism
            faithfully while overstating its penetrance, so it cannot be used to reason about which ATP6V0A4
            patients will lose hearing.
          readouts:
          - name: Endocochlear potential
            target: Cochlear Endolymph Acid-Base Homeostasis Failure
            direction: ABOLISHED
            interpretation: Direct measurement of the endolymphatic driving potential the pump maintains.
          - name: Auditory brainstem response threshold
            target: Cochlear Endolymph Acid-Base Homeostasis Failure
            direction: INCREASED
            interpretation: Functional hearing readout; an elevated threshold means worse hearing.
        - target: Hyperchloraemic Normal-Anion-Gap Metabolic Acidosis
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: Severe metabolic acidosis with hypokalaemia by weaning, lethal without alkali,
            matching the untreated human course.
          readouts:
          - name: Plasma acid-base and potassium status
            target: Hyperchloraemic Normal-Anion-Gap Metabolic Acidosis
            direction: ALTERED
            interpretation: Severe acidosis with hypokalaemia - the human biochemical signature.
        - target: Hypercalciuria with Hypocitraturia
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The null reproduces the hypocitraturia but not the hypercalciuria, so it dissociates
            the two halves of this node rather than reproducing it whole.
          limitations: Hypercalciuria is absent in the mouse and present in most human patients. Inferences
            from this model about calcium handling or stone risk in the human disease therefore do not
            hold, even though the model does develop nephrocalcinosis.
          readouts:
          - name: Urinary citrate and calcium
            target: Hypercalciuria with Hypocitraturia
            direction: ALTERED
            interpretation: Citrate low as in humans; calcium not raised, unlike humans.
      selected_evidence:
        snippet: This mouse model recapitulates the loss of H(+)-ATPase function seen in human disease
          and can provide additional insights into dRTA and the physiology of the a4 subunit.
        supports: SUPPORT
