            preferred_term: renal tubular acidosis, distal, 3, with or without sensorineural hearing loss
            term:
              id: MONDO:0011268
              label: renal tubular acidosis, distal, 3, with or without sensorineural hearing loss
        context: []
      assertion_type: Treatment
      assertion:
        name: Prolonged-Release Potassium Citrate and Potassium Bicarbonate (ADV7103)
        therapeutic_modality: SMALL_MOLECULE
        description: 'A prolonged-release combination developed specifically for dRTA, addressing the
          thing that determines outcome in this disease - adherence to a frequently dosed, unpalatable
          alkali. Over 24 months it held plasma bicarbonate and potassium in range in most patients, and
          spine bone mineral density z-score rose.

          Best read as a better treatment of the acidosis rather than a treatment of the disease. It acts
          on the same node the older alkali salts do; nothing in the reported outcomes bears on the auditory
          arm.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: potassium citrate
            term:
              id: CHEBI:64733
              label: potassium citrate (anhydrous)
        notes: The studied cohort is dRTA of mixed genotype rather than ATP6V0A4 specifically, and both
          studies are open-label extensions without a control arm. Neither fact is visible from the effect
          sizes, and both limit what this treatment record can claim.
      selected_evidence:
        snippet: Plasma bicarbonate and potassium levels were in the normal ranges at the different visits,
          respectively, in 69-86% and 83-93% of patients.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
