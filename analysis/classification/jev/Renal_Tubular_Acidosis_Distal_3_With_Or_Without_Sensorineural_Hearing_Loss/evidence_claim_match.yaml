  0fe8270da5b947fe6a51b28a714628efb9f43fbbc329c0e17f4bdeae71e90315:
    claim:
      about:
        disease:
          name: Renal Tubular Acidosis, Distal, 3, With or Without Sensorineural Hearing Loss
