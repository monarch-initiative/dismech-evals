        therapeutic_modality: OTHER
        description: GeneReviews lists potassium-sparing diuretics among the agents to use with caution
          or avoid. This is counterintuitive, because the disease runs with hypokalaemia and a potassium-sparing
          agent looks corrective - but these drugs act on the same distal segment whose proton secretion
          is already failing, so the acidosis is worsened while the potassium is being chased.
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: The mechanistic rationale in the description is the curator's reading of why this class
          is listed. GeneReviews states the avoidance without giving a reason.
