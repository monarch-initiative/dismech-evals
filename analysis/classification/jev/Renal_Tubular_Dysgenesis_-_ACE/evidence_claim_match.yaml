              label: renal tubular dysgenesis - ACE
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Cell-Surface ACE
        description: 'Disease-causing ACE variants leave no enzyme at the cell surface. Some missense
          proteins, such as Q1069R, are retained in the endoplasmic reticulum and degraded by the proteasome;
          the truncated R762X protein is catalytically active but secreted rather than membrane-anchored.
          Tissue-bound rather than circulating ACE is what matters: a variant that still reaches the membrane
          (R1180P) was compatible with survival after transient neonatal renal insufficiency.'
        biological_scale: CELLULAR
      selected_evidence:
        snippet: ACE Q1069R is found sequestered in the endoplasmic reticulum and is also subject to increased
          proteasomal degradation, preventing its transport to the cell surface and extracellular fluids.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21695262
      reference_title: Impaired proteostasis contributes to renal tubular dysgenesis.
      evidence_source: IN_VITRO
      explanation: A patient missense variant causes endoplasmic reticulum retention and degradation rather
        than loss of catalysis.
