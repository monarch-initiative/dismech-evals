        context:
        - path: /pathophysiology/0
          value:
            name: ACE Loss of Function
            description: Biallelic nonsense, frameshift, canonical splice, missense and exon deletion
              variants leave no functional membrane-bound ACE. Some lethal variants still encode a catalytically
              active protein (the truncated R762X protein is secreted, and Q1069R retains catalytic properties
              when it can be rescued to the cell surface), so the loss is of tissue-bound enzyme rather
              than uniformly of catalytic activity. ACE variants account for about two-thirds of families
              with renal tubular dysgenesis.
            biological_scale: MOLECULAR
            genes:
            - preferred_term: ACE
              term:
                id: hgnc:2707
                label: ACE
            molecular_functions:
            - preferred_term: tissue-bound peptidyl-dipeptidase activity
              term:
                id: GO:0008241
                label: peptidyl-dipeptidase activity
              modifier: DECREASED
            genetic_context:
              variant_origin: GERMLINE
              functional_impact_category: LOSS_OF_FUNCTION
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Loss of Cell-Surface ACE
        causal_link_type: DIRECT
        description: Truncating variants that remove the membrane anchor, and missense variants that misfold,
          both prevent ACE from reaching the plasma membrane.
      selected_evidence:
        snippet: two missense mutants (W594R and R828H) and two truncated mutants (Q1136X and G1145AX)
          were also studied. These mutants were neither inserted in the plasma membrane nor secreted.
        supports: SUPPORT
