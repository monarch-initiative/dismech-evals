      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: delayed_angiogenesis
        hypothesis_label: Delayed angiogenesis starves developing proximal tubules
        status: EMERGING
        description: Kidney organoid work suggests that proximal tubule dysgenesis is not a cell-autonomous
          failure of tubular epithelium but a consequence of delayed, VEGF-A-dependent angiogenesis that
          deprives developing proximal tubules of vascular supply at a critical stage. The engraftment
          experiments were done in AGTR1-null organoids; ACE-null organoids were shown only to form normal
          proximal tubules in vitro, so the angiogenesis step is extrapolated to ACE deficiency rather
          than shown for it.
      selected_evidence:
        snippet: We propose that PT dysgenesis in AR-RTD is primarily a non-autonomous consequence of
          delayed angiogenesis, starving PT at a critical time in their development.
        supports: SUPPORT
    origin:
