        biological_processes:
        - preferred_term: mRNA 3'-end processing
          modifier: ABNORMAL
          term:
            id: GO:0031124
            label: mRNA 3'-end processing
      selected_evidence:
        snippet: Unexpectedly, the Y65C mutation also induces a gain-of-function that interferes with
          the transition from apical to basal progenitors by enhancing interactions with the core components
          of the mRNA 3' end processing machinery, thereby preserving proliferative alternative polyadenylation
          (APA) profiles.
        supports: SUPPORT
