          the clinic, we selected 82 X-linked intellectual disability genes based on the available literature
          at the moment. The selected gene panel includes genes that can lead to either non-syndromic
          XLID or high phenotypic variability in males and candidate genes that have been reported in
          XLID but have not yet been established as XLID genes (see Table S1).
        supports: SUPPORT
