        description: In addition to partial loss-of-function from protein misfolding, the pathogenic PQBP1
          p.Tyr65Cys (Y65C) missense variant exerts a gain-of-function effect by enhancing interactions
          with core components of the mRNA 3'-end processing machinery, preserving proliferative alternative
          polyadenylation (APA) profiles and impeding apical-to-basal neural progenitor transition; the
          net directional effect on mRNA binding across PQBP1 alleles is marked abnormal rather than strictly
          increased or decreased.
        genes:
        - preferred_term: PQBP1
          term:
            id: hgnc:9330
            label: PQBP1
        molecular_functions:
        - preferred_term: mRNA binding
          modifier: ABNORMAL
