              label: congenital nongoitrous hypothyroidism 6
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Generalized resistance to thyroid hormone (RTH-beta)
        description: The same class of lesion in the other receptor isoform, and biochemically its mirror
          image. Because TR-beta carries pituitary feedback, a THRB dominant-negative variant breaks the
          feedback loop and produces elevated free T4 and free T3 with a non-suppressed TSH - the opposite
          laboratory picture from RTH-alpha, where the loop is intact and TSH is simply normal.
        disease_term:
          preferred_term: generalized resistance to thyroid hormone
          term:
            id: MONDO:0009043
            label: generalized resistance to thyroid hormone
        distinguishing_features:
        - RTH-beta has raised free T4 and free T3 with a non-suppressed TSH; RTH-alpha has low or low-normal
          free T4, high-normal or high free T3, and a normal TSH. The TSH in RTH-beta is inappropriate
          for the elevated hormone levels, whereas in RTH-alpha it is simply normal.
        - RTH-beta commonly presents with goiter and tachycardia; RTH-alpha is nongoitrous and if anything
