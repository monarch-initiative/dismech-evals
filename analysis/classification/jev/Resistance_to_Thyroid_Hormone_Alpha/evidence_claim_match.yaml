      assertion:
        name: Autosomal dominant
        inheritance_term:
          preferred_term: autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: Heterozygous THRA variants are sufficient to cause disease because the mutant receptor
          acts dominant-negatively on the wild-type allele rather than merely reducing receptor dose.
          Both de novo occurrence and parent-to-child transmission are documented; the index cases of
          2012 and several later reports were de novo, while a four-member first-degree related kindred
          sharing p.Ala263Val has been described.
      selected_evidence:
        snippet: Heterozygous pathogenic variants in THRA are associated with resistance to thyroid hormone
          alpha (RTHα), causing autosomal dominant nongoitrous congenital hypothyroidism.
        supports: SUPPORT
    origin:
