        prevalence_class: ULTRA_RARE
        notes: As of the 2021 review of all published cases, 40 affected individuals from 28 families
          carrying 25 distinct THRA variants had been reported. Counted cases rather than an estimated
          population prevalence, because no population-based ascertainment exists and the biochemical
          profile is near-normal, so the published count is a floor rather than an estimate. Orphanet's
          own epidemiology entry for ORPHA:566231 records a worldwide point prevalence of <1/1,000,000
          and 35 reported cases, but the Orphanet bulk XML is not present in this checkout, so no ORPHA
          snippet is cited here.
      selected_evidence:
        snippet: To date, 40 cases (13 adults, 27 children) from 28 different families with 25 different
          variants inTHRAgene have been published
