        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Transcriptional Silencing of T3 Target Genes in TR-alpha-Expressing Tissues
        biological_scale: CELLULAR
        description: In every cell whose thyroid hormone response is carried mainly by TR-alpha1, T3-responsive
          genes are held repressed despite normal intracellular hormone. The resulting state is a cell-autonomous
          hypothyroidism that is refractory to circulating hormone, which is why the phenotype is tissue-patterned
          rather than generalized.
        mechanism_confidence: ESTABLISHED
        biological_processes:
        - preferred_term: TR-alpha1-mediated thyroid hormone receptor signaling
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0002154
            label: thyroid hormone receptor signaling pathway
        notes: 'modifier is LOSS_OF_FUNCTION rather than DECREASED deliberately. The claim is qualitative,
          not quantitative: the pathway is not running below its normal level in response to a normal
          signal, it has been taken outside ligand control, so increasing the hormone concentration does
          not simply scale the response back up. That is also why levothyroxine is only partially effective.'
      selected_evidence:
        snippet: TRβ predominates in the hypothalamic-pituitary-thyroid axis, liver, and kidney, whereas
          TRα transduces much of the thyroid hormone signaling in the heart, skeletal muscle, central
          nervous system, bone, and intestines
        supports: SUPPORT
    origin:
