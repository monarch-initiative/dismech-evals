        biological_processes:
        - preferred_term: repression of T3-responsive target gene transcription
          modifier: INCREASED
          term:
            id: GO:0000122
            label: negative regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: Receptor occupancy by a ligand (T3) promotes the dissociation of this corepressor complex
          with the relief of transcriptional repression
        supports: SUPPORT
