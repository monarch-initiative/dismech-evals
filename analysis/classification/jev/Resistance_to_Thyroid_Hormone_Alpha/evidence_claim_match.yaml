  7bab0dc2d555651236b902acce2328a9a038574875d98be44d0370a1f9b79e70:
    claim:
      about:
        disease:
          name: Resistance to Thyroid Hormone Alpha
          disease_term:
            preferred_term: resistance to thyroid hormone alpha
            term:
              id: MONDO:0013757
              label: congenital nongoitrous hypothyroidism 6
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rtha_ncor1_targeting_translational_validity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: The mouse work shows that preventing NCOR1 recruitment by mutant TR-alpha1 reverses growth,
          bone and erythroid phenotypes. Is the TR-alpha1-NCOR1 interaction a tractable target in human
          RTH-alpha, or is the rescue an artifact of a genetic manipulation with no pharmacological counterpart?
        attaches_to:
        - pathophysiology#Persistent Corepressor Occupancy at Thyroid Hormone Response Elements
        rationale: The evidence here is not absent - it is strong, and it is in a mouse. The Thra1PV/+
          by Ncor1-delta-ID cross is the cleanest mechanistic experiment in the field, and it establishes
          corepressor recruitment as causal rather than correlated. But the intervention is a germline-engineered
          corepressor that cannot be recruited, present from conception, which is not a drug and has no
          obvious human equivalent. Two things make the translational question live rather than academic.
          First, the rescue is explicitly partial even in the mouse. Second, the one finding in this disorder
          that directly addresses reversibility in the other direction - the cardiac work - found that
          several heart-rate genes are irreversibly down-regulated and that restoring them required raising
          T3 in utero, which implies some consequences are developmentally fixed before any postnatal
          intervention could reach them. A structure-guided ligand analogue, ES08, that dissociates corepressor
          from mutant TR-alpha more efficiently than T3 is the first candidate with a plausible route
          to patients, but its in vivo evidence is in zebrafish and its human evidence is in patient-derived
          cells, not in patients. Recorded as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the
          model evidence exists and is good; what is unknown is whether it transfers.
      selected_evidence:
        snippet: Our observations provide proof of principle for developing synthetic ligands that can
          relieve transcriptional repression by the mutant TRα-corepressor complex for treatment of RTHα.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34871063
      reference_title: Structure-Guided Approach to Relieving Transcriptional Repression in Resistance
        to Thyroid Hormone α.
      evidence_source: IN_VITRO
      explanation: Describes the corepressor-dissociating ligand as proof of principle, which is the current
        ceiling of the translational claim.
