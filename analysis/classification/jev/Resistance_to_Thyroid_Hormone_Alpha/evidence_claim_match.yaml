  660d3515600db9e1e1998e0d00c4c2078835f086e67aa566ea0af3c3a5e046a8:
    claim:
      about:
        disease:
          name: Resistance to Thyroid Hormone Alpha
          disease_term:
            preferred_term: resistance to thyroid hormone alpha
            term:
              id: MONDO:0013757
              label: congenital nongoitrous hypothyroidism 6
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Allan-Herndon-Dudley syndrome (MCT8 deficiency)
        description: 'The closest biochemical mimic, and the one that matters most because the lesion
          is in the opposite part of the pathway: MCT8 is a transporter, so hormone cannot reach the cell,
          whereas in RTH-alpha hormone reaches the cell normally and the receptor cannot act on it. Both
          produce a discordant thyroid panel with a non-suppressed TSH and neurodevelopmental impairment.'
        disease_term:
          preferred_term: Allan-Herndon-Dudley syndrome
          term:
            id: MONDO:0010354
            label: Allan-Herndon-Dudley syndrome
        distinguishing_features:
        - AHDS has markedly elevated T3 with an elevated T3/T4 ratio and prominent peripheral thyrotoxic
          features - resting tachycardia, progressive weight loss, muscle wasting, failure to thrive.
          RTH-alpha has only high-normal to mildly raised T3, a subnormal T4/T3 ratio, and bradycardia
          rather than tachycardia in the minority with a rate abnormality.
        - AHDS is X-linked and the neurological picture is far more severe - spastic quadriplegia, absent
          speech, dystonia - whereas RTH-alpha is autosomal dominant with mild-to-moderate impairment.
        - Reverse T3 is low in both, so it does not separate them. Definitive separation is by sequencing
          SLC16A2 versus THRA.
      selected_evidence:
        snippet: individuals with developmental delay and genetically confirmed thyroid hormone resistance,
          carrying defects in Monocarboxylate Transporter 8 (MCT8), Thyroid Hormone Receptor alpha (THRα),
          and Selenocysteine Insertion Sequence-Binding Protein 2 (SECISBP2)
        supports: SUPPORT
    origin:
