      assertion_type: Definition
      assertion:
        name: fT3/fT4 ratio centile screening in children with developmental delay
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: ESTABLISHED_CRITERIA
        scope: Children and young adults (0-29 years) with developmental delay
        description: 'Plot the free T3 to free T4 ratio on sex-specific centile charts derived from 23,522
          measurements in children and young adults, and treat an outlying ratio as an indication to investigate
          for a thyroid hormone resistance syndrome - MCT8 deficiency, THRA-related RTH-alpha, or SECISBP2
          deficiency. The rationale is mechanistic but the mechanism is established, not hypothesized:
          each analyte may be within its reference interval while the ratio is not.'
        inclusion_criteria:
        - preferred_term: Developmental delay under investigation
        - preferred_term: fT3/fT4 ratio outside the sex-specific reference centiles for age
        validation_status:
          status: PROPOSED
          rationale: Derived on a large normative cohort and shown to separate genetically confirmed MCT8,
            THRA and SECISBP2 patients from both normal children and children with severe cerebral palsy.
            That is a demonstration of separation in known cases, not a prospective case-finding evaluation,
            so no positive predictive value in an unselected developmental-delay population has been established
            and no THRA-specific cut-off is defined.
      selected_evidence:
        snippet: we were able to demonstrate a clear separation of patient values for the fT3/fT4 ratio
          from normal and pathological controls
        supports: SUPPORT
