      assertion_type: Pathophysiology
      assertion:
        name: Persistent Corepressor Occupancy at Thyroid Hormone Response Elements
        biological_scale: MOLECULAR
        description: 'In the unliganded state a thyroid hormone receptor recruits a corepressor complex
          containing NCoR or SMRT together with histone deacetylase, which represses target gene transcription;
          T3 binding normally dissociates this complex and allows coactivator recruitment. The RTH-alpha
          mutant receptor fails to make that switch, so the repressive complex stays bound. This is the
          step that distinguishes RTH-alpha from a loss of receptor: the promoter is not merely unactivated,
          it is actively silenced, and the wild-type receptor on the same response element is held hostage.'
        mechanism_confidence: ESTABLISHED
        molecular_functions:
        - preferred_term: persistent NCoR/SMRT corepressor binding by mutant TR-alpha1
          modifier: INCREASED
          term:
            id: GO:0001222
