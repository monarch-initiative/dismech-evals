  ecf03861805b2eeb109dc86e31bffa0d2869bbe9d7c1fd053ef7922a272d97e4:
    claim:
      about:
        disease:
          name: Resistance to Thyroid Hormone Alpha
          disease_term:
            preferred_term: resistance to thyroid hormone alpha
            term:
              id: MONDO:0013757
              label: congenital nongoitrous hypothyroidism 6
        context:
        - path: /treatments/0
          value:
            name: Levothyroxine
            description: 'Levothyroxine is the only treatment in routine use and there is no RTH-alpha-specific
              therapy. It is partial and tissue-selective for the same reason the disorder exists: raising
              circulating hormone can partly overcome resistance in tissues whose mutant receptor retains
              some T3 responsiveness, does nothing where the mutant is transcriptionally inert, and has
              no target to act on in TR-beta tissues that were never resistant. In practice it relieves
              constipation, lowers creatine kinase, and improves growth, body composition and dyspraxia
              in some patients, while anaemia commonly persists. Response tracks variant class: in a paired
              two-patient study the patient carrying the partially responsive A263V mutant improved in
              growth, body composition, dyspraxia and constipation, while the patient carrying the transcriptionally
              inert L274P mutant showed no change in growth retardation or constipation. The theoretical
              worry about inducing thyrotoxicosis in TR-beta tissues is not borne out for heart rate:
              thyroxine does not raise heart rate in RTH-alpha patients, because the cardiac defect is
              intrinsic to the heart and is not reversed by hormone given after birth, which is what makes
              higher dosing tolerable. (In the mouse the relevant gene expression could be restored by
              raising maternal T3 in utero, so "irreversible" here means irreversible postnatally, not
              in principle.)'
            treatment_term:
              preferred_term: levothyroxine pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: levothyroxine
                term:
                  id: CHEBI:18332
                  label: L-thyroxine
            therapeutic_modality: SMALL_MOLECULE
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Impaired Central Nervous System Thyroid Hormone Action
        description: Partial and apparently age-dependent. IQ improved in most treated children, with
          the exception being the child diagnosed latest, at 9.5 years - which is the practical argument
          for early ascertainment rather than for the drug.
      selected_evidence:
        snippet: Normal mental functions were achieved and IQ scores improved in most children except
          one (age at diagnosis, 9.5 years).
        supports: SUPPORT
    origin:
