            term:
              id: MONDO:0013757
              label: congenital nongoitrous hypothyroidism 6
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Terminal Erythroid Differentiation
        biological_scale: CELLULAR
        description: 'Mutant TR-alpha1 directly represses key erythroid genes, impairing the differentiation
          potential of erythroid progenitors and terminal erythropoiesis. In primary erythroid progenitors
          cultured from RTH-alpha patients the defect presents as a shifted balance rather than an outright
          block: cells differentiate, but more slowly, staying larger and more c-Kit-positive and becoming
          glycophorin-A-positive later. Notably the degree of abnormality did not track the severity of
          the underlying TR-alpha defect, and induced differentiation and T3 exposure worked normally
          - so the lesion is in spontaneous maturation, not in the capacity to mature. The clinical correlate
          is the normocytic or macrocytic anaemia that is among the most consistent findings in RTH-alpha
          and, unlike constipation, is not reliably corrected by levothyroxine.'
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: erythroid progenitor cell
          term:
            id: CL:0000038
            label: erythroid progenitor cell
        biological_processes:
        - preferred_term: terminal erythroid differentiation
          modifier: DECREASED
          term:
            id: GO:0030218
            label: erythrocyte differentiation
      selected_evidence:
        snippet: The expression of NCOR1ΔID ameliorated abnormalities in the peripheral blood indices,
          and corrected the defective differentiation potential of progenitors in the erythroid lineage.
        supports: SUPPORT
