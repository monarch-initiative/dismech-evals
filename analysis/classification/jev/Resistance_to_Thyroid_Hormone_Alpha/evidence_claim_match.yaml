        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Infancy and early childhood
        notes: 'Presentation is in the first years of life, and almost always for something other than
          thyroid disease: growth faltering, delayed motor and speech milestones, or severe constipation.
          Delayed bone age, epiphyseal dysgenesis, wormian bones, delayed dentition and late fontanelle
          closure are childhood-specific skeletal findings. Newborn screening has already missed the diagnosis
          by this point, because it is TSH-based.'
      selected_evidence:
        snippet: In infants with RTHα, delayed milestones for motor and speech abilities are the most
          common symptoms, noted in 34 among 40 cases (85%)
        supports: SUPPORT
