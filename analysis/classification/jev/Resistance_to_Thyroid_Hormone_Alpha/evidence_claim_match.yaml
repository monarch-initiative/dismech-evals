  7adc8f50f095d94c5cea407e91a237461ad07053be0cef94e4063dfd488f616f:
    claim:
      about:
        disease:
          name: Resistance to Thyroid Hormone Alpha
          disease_term:
            preferred_term: resistance to thyroid hormone alpha
            term:
              id: MONDO:0013757
              label: congenital nongoitrous hypothyroidism 6
        context:
        - path: /definitions/1
          value:
            name: Anaemia-based paediatric screening filter for RTH-alpha
            definition_type: PHENOTYPE_ALGORITHM
            derivation_basis: ESTABLISHED_CRITERIA
            scope: Children attending paediatric neurology with anaemia and no specific neurological aetiology
            description: 'A computable case-finding filter applied to children seen in paediatric neurology:
              complete blood count and thyroid function tests in all, then select those with normocytic
              or macrocytic anaemia, a normal TSH, free T3 in the upper half of the reference range or
              high, and free T4 in the lower half of the reference range or low, excluding children with
              an identified neurological aetiology. Selected children proceed to THRA sequencing. The
              filter is built entirely from the established biochemical and haematological signature rather
              than from an unproven mechanism, hence ESTABLISHED_CRITERIA.'
            inclusion_criteria:
            - preferred_term: Attending paediatric neurology with no specific underlying neurological
                aetiology
            - preferred_term: Normocytic or macrocytic anaemia on complete blood count
            - preferred_term: Normal TSH
            - preferred_term: Free T3 in the upper half of the reference range or high
            - preferred_term: Free T4 in the lower half of the reference range or low
          role: ancestor
      assertion_type: AlgorithmValidationStatus
      assertion:
        status: UNVALIDATED
        rationale: Prospectively applied to 6,540 children evaluated in paediatric neurology outpatient
          clinics over two years. 432 had anaemia; 42 met the full filter; 32 were sequenced. No new THRA
          variant was found, and the only RTH-alpha patient recovered was one already known. The filter
          therefore has no demonstrated positive predictive value in this setting. The authors' own conclusion
          is that the filter should be tightened with clinical features rather than used on laboratory
          criteria alone, because nearly half the screened children's anaemia did not persist on reassessment.
          Recorded as UNVALIDATED rather than PROPOSED because it has actually been run, and not as VALIDATED_AGAINST_GOLD_STANDARD
          because the run was negative.
      selected_evidence:
        snippet: A screening strategy that takes clinical findings and prominent laboratory features suggestive
          of RTH-α into account could lower unnecessary genetic analysis of THRA in patients presenting
          with neurological problems.
        supports: SUPPORT
    origin:
