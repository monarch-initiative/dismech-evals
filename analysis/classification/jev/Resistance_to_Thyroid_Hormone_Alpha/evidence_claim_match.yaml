      assertion_type: AnimalModel
      assertion:
        name: thraa / thrab CRISPR dominant-negative zebrafish
        species: Zebrafish
        genotype: thrab 1-bp insertion and thraa 8-bp insertion dominant-negative alleles
        publication: PMID:31952464
        description: Germline-transmissible CRISPR/Cas9 dominant-negative alleles in the two duplicated
          zebrafish thra genes. Homozygous thrab mutants show severe growth retardation with markedly
          suppressed growth hormone and IGF1 expression, while homozygous thraa mutants are only mildly
          affected. The same species is the model in which the corepressor-dissociating ligand analogue
          ES08 rescued developmental anomalies.
        modeled_mechanisms:
        - target: Impaired Skeletal Maturation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: Reproduces severe postlarval growth retardation and identifies suppressed gh1 and
            igf1 expression as a proximate cause.
          limitations: Zebrafish have two thra paralogues where humans have one, and the phenotype partitions
            unequally between them, so the genotype is not comparable to a human heterozygote. The informative
            alleles are homozygous, whereas human RTH-alpha is heterozygous and dominant-negative. Zebrafish
            also have no growth plate, so endochondral ossification - the mechanism this node names -
            is not what is being observed.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: The thra locus is duplicated in zebrafish into thraa and thrab, and the growth
              phenotype is carried almost entirely by thrab. There is no single ortholog whose disruption
              corresponds to a human THRA heterozygote, so allele dosage and gene identity both diverge.
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The measured quantity is body growth with gh1 and igf1 transcript levels. The
              node's quantity is growth plate chondrocyte maturation and endochondral ossification, which
              zebrafish do not have.
      selected_evidence:
