  5d8b9395c77b1f6348db2a32bb303030589cf1b43eb36e746b67934934bd79b7:
    claim:
      about:
        disease:
          name: Resistance to Thyroid Hormone Alpha
          disease_term:
            preferred_term: resistance to thyroid hormone alpha
            term:
              id: MONDO:0013757
              label: congenital nongoitrous hypothyroidism 6
        context: []
      assertion_type: Treatment
      assertion:
        name: Levothyroxine
        description: 'Levothyroxine is the only treatment in routine use and there is no RTH-alpha-specific
          therapy. It is partial and tissue-selective for the same reason the disorder exists: raising
          circulating hormone can partly overcome resistance in tissues whose mutant receptor retains
          some T3 responsiveness, does nothing where the mutant is transcriptionally inert, and has no
          target to act on in TR-beta tissues that were never resistant. In practice it relieves constipation,
          lowers creatine kinase, and improves growth, body composition and dyspraxia in some patients,
          while anaemia commonly persists. Response tracks variant class: in a paired two-patient study
          the patient carrying the partially responsive A263V mutant improved in growth, body composition,
          dyspraxia and constipation, while the patient carrying the transcriptionally inert L274P mutant
          showed no change in growth retardation or constipation. The theoretical worry about inducing
          thyrotoxicosis in TR-beta tissues is not borne out for heart rate: thyroxine does not raise
          heart rate in RTH-alpha patients, because the cardiac defect is intrinsic to the heart and is
          not reversed by hormone given after birth, which is what makes higher dosing tolerable. (In
          the mouse the relevant gene expression could be restored by raising maternal T3 in utero, so
          "irreversible" here means irreversible postnatally, not in principle.)'
        treatment_term:
          preferred_term: levothyroxine pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: levothyroxine
            term:
              id: CHEBI:18332
              label: L-thyroxine
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: We demonstrated that constipation was ameliorated, neuromotor development of some children
          was improved, and creatine kinase levels were diminished with levothyroxine treatment in patients
          with RTHα, while some features including anemia did not resolve.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36821077
      reference_title: Long-term follow-up results and treatment outcomes of children and adults with
        resistance to thyroid hormone alpha.
      evidence_source: HUMAN_CLINICAL
      explanation: The single best summary of what levothyroxine does and does not do in this disorder,
        including the explicit negative for anaemia.
