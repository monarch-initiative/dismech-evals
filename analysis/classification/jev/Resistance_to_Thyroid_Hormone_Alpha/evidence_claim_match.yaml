            term:
              id: MONDO:0013757
              label: congenital nongoitrous hypothyroidism 6
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Adulthood
        notes: 'The phenotype attenuates rather than progresses, which is itself a diagnostic hazard:
          epiphyseal dysgenesis present in childhood is absent on adult imaging, and the biochemical abnormalities
          become subtler, so an adult relative of an index case can look near-normal on thyroid function
          tests. What persists is anaemia, constipation, and the cognitive and motor phenotype; hepatic
          steatosis and raised LDL/HDL are reported in adults. Untreated adults show a more pronounced
          phenotype than patients treated from childhood.'
      selected_evidence:
        snippet: This report adds novel insight by documenting intrafamilial variability and age-related
          attenuation of biochemical abnormalities in a family carrying a previously described THRA variant.
        supports: SUPPORT
    origin:
      assertion_path: /progression/1
      evidence_path: /progression/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42301959
      reference_title: 'Intrafamilial and Age-Dependent Variability in Resistance to Thyroid Hormone Alpha:
        A Case Report.'
      evidence_source: HUMAN_CLINICAL
      explanation: Independent documentation of age-related attenuation, in a kindred where the mother
        carried the same variant as her affected daughters.
