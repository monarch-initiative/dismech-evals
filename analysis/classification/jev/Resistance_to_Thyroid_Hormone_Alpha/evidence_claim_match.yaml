        context:
        - path: /pathophysiology/0
          value:
            name: THRA Dominant-Negative Receptor Variant
            biological_scale: MOLECULAR
            role: trigger
            description: 'A heterozygous THRA variant, usually in the C-terminal ligand-binding domain,
              produces a TR-alpha1 protein that has lost ligand-dependent transcriptional activation.
              Critically, the mutant is not simply inert: it retains DNA binding and retinoid X receptor
              heterodimerization, and crystal structures show that several mutants devoid of transactivation
              function still bind T3. The defect is therefore downstream of ligand occupancy, in the conformational
              change that should convert the receptor from a repressor into an activator.'
            mechanism_confidence: ESTABLISHED
            genes:
            - preferred_term: THRA
              term:
                id: hgnc:11796
                label: THRA
            molecular_functions:
            - preferred_term: TR-alpha1 ligand-dependent nuclear receptor activity
              modifier: LOSS_OF_FUNCTION
              term:
                id: GO:0004879
                label: nuclear receptor activity
            genetic_context:
              gene:
                preferred_term: THRA
                term:
                  id: hgnc:11796
                  label: THRA
              variant_origin: GERMLINE
              zygosity: HETEROZYGOUS
              functional_impact_category: DOMINANT_NEGATIVE
              description: The functional impact is recorded as DOMINANT_NEGATIVE rather than LOSS_OF_FUNCTION
                or PARTIAL_LOSS_OF_FUNCTION because the mutant receptor inhibits the function of the co-expressed
                wild-type receptor, which is what makes a heterozygous variant pathogenic and makes the
                phenotype more severe than THRA haploinsufficiency would be.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Persistent Corepressor Occupancy at Thyroid Hormone Response Elements
        causal_link_type: DIRECT
        description: Because the mutant cannot undergo the T3-induced conformational change that dissociates
          corepressor, the receptor-corepressor complex remains assembled on target gene promoters.
      selected_evidence:
        snippet: RTHα-associated TRα mutants devoid of ligand-dependent transcription activation function
          unexpectedly retain the ability to bind thyroid hormone.
        supports: SUPPORT
