          TR-beta-dependent readout that is nonetheless abnormal here, which is worth noting because it
          complicates the otherwise clean TR-alpha/TR-beta division. No pathophysiology node is claimed
          upstream of this phenotype: cholesterol handling is hepatic and therefore TR-beta territory,
          so the route by which a THRA variant raises it is not accounted for by any node here, and nothing
          located explains it. Left deliberately unconnected rather than attached to a node it does not
          follow from.'
        phenotype_term:
          preferred_term: Elevated cholesterol with raised LDL/HDL ratio
          term:
            id: HP:0003124
            label: Hypercholesterolemia
      selected_evidence:
        snippet: Other main features were low hemoglobin and high LDL/HDL ratio.
