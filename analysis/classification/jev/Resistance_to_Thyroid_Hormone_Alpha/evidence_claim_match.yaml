  981703e8218d4f151c46289b9f842efa6180d94882b6981ea7da5e945bd613db:
    claim:
      about:
        disease:
          name: Resistance to Thyroid Hormone Alpha
          disease_term:
            preferred_term: resistance to thyroid hormone alpha
            term:
              id: MONDO:0013757
              label: congenital nongoitrous hypothyroidism 6
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rtha_levothyroxine_outcome_benefit
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does levothyroxine improve long-term outcomes in RTH-alpha, and does starting it in adulthood
          help at all?
        attaches_to:
        - treatments#Levothyroxine
        rationale: "Everything known about treatment benefit in RTH-alpha comes from case series of single-digit\
          \ size with no control arm and no randomization, in a disorder with fewer than fifty published\
          \ patients. The largest follow-up study enrolled seven patients from two families. Within that\
          \ evidence base the short-term biochemical and symptomatic effects are reasonably clear (constipation\
          \ relieved, creatine kinase lowered, anaemia not), but the questions that matter clinically\
          \ are not answered: whether final height, adult cognitive outcome or cardiovascular risk differ\
          \ with treatment, and whether initiating thyroxine in an adult diagnosed late does anything.\
          \ The untreated adult series raises the possibility that the window is early childhood, since\
          \ untreated adults had a more pronounced phenotype than patients treated from childhood - but\
          \ that is a between-cohort comparison, not evidence of effect. The 2024 European Thyroid Association\
          \ guideline describes the whole family of these disorders as managed on a limited evidence base.\
          \ This will not be resolved by a trial at this prevalence; a prospective international registry\
          \ with a common outcome set is the realistic route.\n\n  One experimental result bears on it\
          \ directly and cuts both ways. In a\n  low-T3-affinity TR-alpha1 knock-in mouse, anxiety and\
          \ recognition-memory\n  deficits were rescued by high-dose thyroid hormone given in adulthood,\
          \ while\n  the locomotor deficit required post-natal treatment and was tied to cerebellar\n\
          \  development. If that separation holds in humans, \"does adult treatment help\"\n  has no\
          \ single answer - it depends which deficit is asked about, and this\n  entry's observation that\
          \ IQ improved in every treated child except the one\n  diagnosed at 9.5 years is consistent\
          \ with a graded rather than an absolute\n  window. The caveat is that the mouse lesion is reduced\
          \ ligand affinity, not\n  dominant-negative corepressor retention, so hormone dose should work\
          \ better\n  there than in a patient whose mutant receptor is transcriptionally inert."
      selected_evidence:
        snippet: However, it is not clear if treatment has beneficial effects if started in adulthood.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
