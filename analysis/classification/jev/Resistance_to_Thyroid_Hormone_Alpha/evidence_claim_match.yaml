        name: RTH-alpha biochemical and clinical suspicion criteria
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        scope: Children and adults under investigation for unexplained hypothyroid features
        description: RTH-alpha should be suspected when even mild clinical features of hypothyroidism
          coexist with high or high-normal free T3, low or low-normal free T4, and a normal TSH, and confirmed
          by THRA sequencing. Low reverse T3, normocytic or macrocytic anaemia, and a mildly raised creatine
          kinase - particularly in a child - each independently justify sequencing even when the thyroid
          panel looks unremarkable.
        inclusion_criteria:
        - preferred_term: Clinical features of hypothyroidism, even mild
        - preferred_term: Free T3 high or high-normal
        - preferred_term: Free T4 low or low-normal
        - preferred_term: TSH normal or at most mildly raised
        - preferred_term: Pathogenic heterozygous THRA variant on sequencing
      selected_evidence:
        snippet: In such patients, low reverse T3 levels, normo- or macrocytic anemia or, particularly
          in children, mildly elevated creatine kinase levels would warrant THRA sequencing.
        supports: SUPPORT
