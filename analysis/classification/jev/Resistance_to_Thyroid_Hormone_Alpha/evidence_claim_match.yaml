      assertion:
        name: THRA Dominant-Negative Receptor Variant
        biological_scale: MOLECULAR
        role: trigger
        description: 'A heterozygous THRA variant, usually in the C-terminal ligand-binding domain, produces
          a TR-alpha1 protein that has lost ligand-dependent transcriptional activation. Critically, the
          mutant is not simply inert: it retains DNA binding and retinoid X receptor heterodimerization,
          and crystal structures show that several mutants devoid of transactivation function still bind
          T3. The defect is therefore downstream of ligand occupancy, in the conformational change that
          should convert the receptor from a repressor into an activator.'
        mechanism_confidence: ESTABLISHED
        genes:
        - preferred_term: THRA
          term:
            id: hgnc:11796
            label: THRA
        molecular_functions:
