            term:
              id: CHEBI:68840
              label: gabapentin enacarbil
      selected_evidence:
        snippet: Pregabalin, gabapentin enacarbil, and oxycodone/naloxone, which did not appear in the
          previous review, have accrued data to be considered efficacious.
        supports: SUPPORT
