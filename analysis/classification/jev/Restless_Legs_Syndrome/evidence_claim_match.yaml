  a0c7bc36fecab2852a21e9b94b8fbdab0d190f6fc6ca6c98e8cadc86b8ea5642:
    claim:
      about:
        disease:
          name: Restless Legs Syndrome
          disease_term:
            preferred_term: restless legs syndrome
            term:
              id: MONDO:0005391
              label: restless legs syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Dopaminergic Signalling with Relative Dopamine Excess
        description: The dopaminergic abnormality, curated in the direction the evidence supports. The
          iron-deficient regions show a state of relative dopamine excess, not deficiency, with presynaptic
          upregulation and postsynaptic receptor downregulation; tyrosine hydroxylase staining is normal
          and there is no cell loss. This reading is what makes sense of the disorder's two most distinctive
          pharmacological facts. Dopamine agonists relieve symptoms immediately, at doses far below those
          used in Parkinson disease, because they act on a downregulated postsynaptic system at its circadian
          trough. And sustained agonist exposure produces augmentation - earlier onset, greater intensity,
          and spread to the arms - which is what a chronically overdriven system that is already in relative
          excess would be expected to do, and which a deficiency model does not predict at all.
        role: amplifier
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: dopaminergic synaptic transmission
          term:
            id: GO:0001963
            label: synaptic transmission, dopaminergic
          modifier: ABNORMAL
        locations:
        - preferred_term: substantia nigra
          term:
            id: UBERON:0002038
            label: substantia nigra
      selected_evidence:
        snippet: While it is not known how these changes in dopamine or iron produce the symptoms of RLS
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28236139
      reference_title: Iron, dopamine, genetics, and hormones in the pathophysiology of restless legs
        syndrome.
      evidence_source: OTHER
      explanation: 'Cited as PARTIAL because it records the limit of the account: the iron-dopamine relationship
        is established but the step from it to the sensory symptom is not, which is why the downstream
        edge is curated with unknown intermediates.'
