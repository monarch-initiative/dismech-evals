  cc373ae2c8240d02b59580182cfb712a9f28499c0f5ef6eaf91ddcf3d183ed05:
    claim:
      about:
        disease:
          name: Restless Legs Syndrome
          disease_term:
            preferred_term: restless legs syndrome
            term:
              id: MONDO:0005391
              label: restless legs syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sensorimotor Network Hyperexcitability
        description: 'The convergence node: a state of increased excitability in spinal and supraspinal
          sensorimotor circuits, expressed as an aversive sensory urge at rest and as involuntary periodic
          limb movements during sleep. Beyond the dopaminergic arm, the leading candidate contributors
          are reduced adenosinergic tone (adenosine is inhibitory, and brain iron deficiency has been
          proposed to downregulate A1 receptors) and increased glutamatergic transmission - which would
          explain why alpha-2-delta ligands, which reduce glutamate release and have no dopaminergic action
          at all, are as effective as dopamine agonists. That equivalence is a strong constraint on any
          mechanistic account, and it is the reason this node is curated as a convergence point rather
          than as a dopaminergic effector.'
        role: central_effector
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: glutamatergic synaptic transmission
          term:
            id: GO:0035249
            label: synaptic transmission, glutamatergic
          modifier: INCREASED
      selected_evidence:
        snippet: Network meta-analysis of mean changes in IRLS data from 35 studies with 7333 participants
          showed that all treatments, in specific gabapentin enacarbil, followed by pregabalin and rotigotine
          were superior to placebo
        supports: SUPPORT
    origin:
