      assertion_type: Treatment
      assertion:
        name: Alpha-2-Delta Ligand (Gabapentin Enacarbil, Pregabalin)
        description: Ligands of the alpha-2-delta subunit of the voltage-gated calcium channel, which
          reduce presynaptic neurotransmitter release including glutamate. They are as effective as a
          dopamine agonist in head-to-head meta-analysis while carrying substantially less augmentation
          risk, and are increasingly preferred first-line for that reason. Their efficacy is also the
          strongest single argument that the disorder's effector node is not purely dopaminergic - a drug
          with no dopaminergic action should not work as well as one that has it, if the mechanism were
          dopaminergic.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
