              id: MONDO:0005391
              label: restless legs syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Periodic Limb Movements of Sleep
        description: 'Stereotyped, repetitive limb movements during sleep, present in most patients with
          restless legs syndrome and quantifiable on polysomnography. Curated as its own node because
          the genetics show it is partly separable: the BTBD9 variant is associated with periodic limb
          movements both with and without the restless legs phenotype, and NOT with restless legs in the
          absence of periodic limb movements - which identifies it as a genetic determinant of the movement
          trait rather than of the sensory disorder. Treating the two as one entity would discard that
          dissociation.'
        role: effector
        biological_scale: ORGANISM
      selected_evidence:
        snippet: An association between the variant and periodic limb movements in sleep without RLS (and
          the absence of such an association for RLS without periodic limb movements) suggests that we
          have identified a genetic determinant of periodic limb movements in sleep
        supports: SUPPORT
