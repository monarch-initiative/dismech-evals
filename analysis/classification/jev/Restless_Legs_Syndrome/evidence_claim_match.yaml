            term:
              id: MONDO:0005391
              label: restless legs syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Genetic Susceptibility at Iron-Linked Regulatory Loci
        description: Restless legs syndrome is highly heritable, and its common risk variants are unusual
          in two respects that are mechanistically informative. First, they are almost all non-coding
          and regulatory rather than protein-altering - the strongest signal is a linkage-disequilibrium
          block within intron 8 of MEIS1 - so the disease mechanism runs through altered expression of
          developmental transcription factors, not through altered protein function. Second, the effect
          sizes are among the largest reported for any common disease, and yet identified variants explain
          under 10% of heritability. MEIS1 risk haplotype carriers show lower MEIS1 mRNA and protein in
          blood and thalamus, and the MEIS1 orthologue is linked to iron homeostasis in C. elegans - which
          is the connection that ties the genetic arm back to the iron trigger rather than leaving it
          a separate story.
        role: trigger
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: Each genetic variant was associated with a more than 50% increase in risk for RLS, with
          the combined allelic variants conferring more than half of the risk.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
