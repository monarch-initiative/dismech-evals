        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Regional Brain Iron Deficiency
        description: 'The best-established abnormality, and the trigger node. Iron content is reduced
          in specific brain regions - most consistently the substantia nigra, also the thalamus - while
          systemic iron stores may be entirely normal. This is a compartment-specific deficiency, not
          a systemic one, which is why serum ferritin is an unreliable guide and why oral iron is ineffective
          in iron-sufficient patients. Neuropathologically the lesion is one of acquisition rather than
          of loss: H-ferritin and iron staining are markedly reduced, transferrin receptor staining on
          neuromelanin-containing cells is decreased while transferrin itself is increased - the signature
          of cells that are iron starved but failing to upregulate their uptake machinery, i.e. a regulatory
          defect at the transferrin receptor. Crucially there is no neurodegeneration: the RLS brain shows
          no histopathological abnormality unique to it and normal tyrosine hydroxylase staining, which
          distinguishes this disorder from the dopaminergic degenerations at the level of tissue.'
        role: trigger
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: iron ion transport
          term:
            id: GO:0006826
            label: iron ion transport
          modifier: DECREASED
        locations:
        - preferred_term: substantia nigra
          term:
            id: UBERON:0002038
            label: substantia nigra
      selected_evidence:
        snippet: Iron staining and H-ferritin staining was markedly decreased in the RLS substantia nigra.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
