      assertion_type: Pathophysiology
      assertion:
        name: Rest-Dependent Urge to Move with Circadian Timing
        description: 'The defining clinical phenomenon, and its two modulations are diagnostic rather
          than incidental. It is rest-dependent: the urge appears during inactivity and is relieved, immediately
          and completely, by movement - a relief pattern no other sensory symptom shares. And it is circadian:
          symptoms appear in the evening and night, following the endogenous rhythm rather than time awake,
          which is why they persist at the same clock time after a shifted schedule and why sleep onset
          is the point of maximal impairment.'
        role: effector
        biological_scale: ORGANISM
        biological_processes:
        - preferred_term: circadian rhythm
          term:
            id: GO:0007623
            label: circadian rhythm
      selected_evidence:
        snippet: Restless legs syndrome (RLS) is a common sensorimotor disorder characterized by an urge
          to move that appears during rest or is exacerbated by rest, that occurs in the evening or night
          and that disappears during movement or is improved by movement.
        supports: SUPPORT
