    claim:
      about:
        disease:
          name: Restless Legs Syndrome
          disease_term:
            preferred_term: restless legs syndrome
            term:
              id: MONDO:0005391
              label: restless legs syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Intravenous Ferric Carboxymaltose
        description: 'Iron repletion is the only treatment directed at the entry''s trigger node rather
          than at its downstream consequences, and it is the mechanistically most interesting: a single
          intravenous dose can produce prolonged benefit, consistent with correcting a compartment rather
          than maintaining a drug level. Two caveats are curated deliberately. The effect is slow - in
          a randomised trial in iron-deficient non-anaemic patients the difference from placebo was not
          significant at 4 weeks and became significant only by 12 weeks - which means a 4-week endpoint
          will call it a failure. And oral iron is not a substitute: it is non-efficacious in iron-sufficient
          patients, which is what a compartment-specific rather than systemic deficiency predicts.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: ferric carboxymaltose
            term:
              id: NCIT:C166915
              label: Ferric Carboxymaltose
      selected_evidence:
        snippet: Ferric carboxymaltose treatment (n = 59) led to nonsignificant improvement over placebo
          (n = 51) in International Restless Legs Syndrome Severity Scale score at week 4
        supports: SUPPORT
