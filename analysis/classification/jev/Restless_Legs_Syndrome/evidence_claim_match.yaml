      reference_title: 'Gabapentin enacarbil, pregabalin and rotigotine are equally effective in restless
        legs syndrome: a comparative meta-analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'The meta-analytic finding itself: two alpha-2-delta ligands and a dopamine agonist
        all beat placebo, with the alpha-2-delta ligands leading. Since the alpha-2-delta ligands have
        no dopaminergic action, their equivalence is the pharmacological constraint requiring a convergence
        node here rather than a purely dopaminergic effector.'
