              label: restless legs syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Dopamine Agonist (Pramipexole)
        description: 'Immediately and reliably effective at doses well below those used in Parkinson disease,
          and for many years first-line - but curated here with its principal harm attached, because the
          harm is mechanistically informative rather than incidental. Sustained dopaminergic treatment
          causes augmentation: the disease itself worsens, with symptoms starting earlier in the day,
          becoming more intense, and spreading to previously unaffected limbs. The evidence-based review
          identifies augmentation as more frequent with pramipexole than pregabalin and possibly with
          all dopaminergic agents more than alpha-2-delta ligands, and requires special monitoring for
          every dopaminergic drug. A treatment that reverses into an exacerbation of the disorder is exactly
          what a relative-dopamine-excess model predicts and a deficiency model does not.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: pramipexole
            term:
              id: CHEBI:8356
              label: pramipexole
      selected_evidence:
        snippet: 'The following interventions continue to be considered efficacious as in 2008: levodopa,
          ropinirole, pramipexole, cabergoline, pergolide, and gabapentin.'
        supports: SUPPORT
