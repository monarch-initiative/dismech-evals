      assertion:
        name: Absent Adaptive Cellular Immunity
        role: consequence
        biological_scale: ORGANISM
        description: With no circulating T cells there is no cellular adaptive immunity and no T-cell
          help for antibody production, so humoral immunity fails whether or not B cells are present.
          The thymus and secondary lymphoid organs are hypoplastic. Without immune reconstitution the
          condition is uniformly fatal in infancy.
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: It is characterized by absence of granulocytes and almost complete deficiency of lymphocytes
          in peripheral blood, hypoplasia of the thymus and secondary lymphoid organs, and lack of innate
          and adaptive humoral and cellular immune functions, leading to fatal septicemia within days
          after birth.
        supports: SUPPORT
