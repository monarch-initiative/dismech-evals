    claim:
      about:
        disease:
          name: Reticular Dysgenesis
          disease_term:
            preferred_term: reticular dysgenesis
            term:
              id: MONDO:0009973
              label: reticular dysgenesis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Granulocytic Maturation Arrest at the Promyelocyte Stage
        role: mechanism
        biological_scale: CELLULAR
        description: 'Granulopoiesis in RD marrow stops early: promyelocytes and earlier forms are present
          but maturation beyond them fails, so no mature neutrophils reach the circulation. The arrest
          is cell-intrinsic and correctable in vitro - lentiviral restoration of AK2 in patient bone-marrow
          CD34+ cells restores neutrophil maturation - and it is reproduced in AK2-deficient patient-derived
          iPSC. Because the block is downstream of G-CSF receptor engagement rather than in the receptor
          itself, the neutropenia is characteristically refractory to G-CSF.'
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: promyelocyte
          term:
            id: CL:0000836
            label: promyelocyte
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        biological_processes:
        - preferred_term: granulocyte differentiation
          term:
            id: GO:0030851
            label: granulocyte differentiation
          modifier: DECREASED
        notes: The original AK2 report described the marrow block as showing "no detectable cells beyond
          the myelocyte stage" (PMID:19043416), one stage later than the promyelocyte arrest reported
          by PMID:19043417 and by subsequent cohorts. The promyelocyte description is the one that has
          been reproduced (patient marrow, patient-derived iPSC, contemporary cohorts) and is used here;
          the discrepancy is a matter of where a morphologically continuous arrest is scored, not a disagreement
          about the lineage.
      selected_evidence:
        snippet: In bone marrow of individuals with reticular dysgenesis, myeloid differentiation is blocked
          at the promyelocytic stage, whereas erythro- and megakaryocytic maturation is generally normal.
        supports: SUPPORT
