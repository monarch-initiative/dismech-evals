          from a cached reference here, so the band is left at OCCASIONAL rather than raised on an unquotable
          proportion. Treat it as a floor, not a measurement.

          An earlier version of this note said no cohort had published a numerator. That is no longer
          accurate now that the PMID:42112325 full text is cached, and it has been corrected.'
