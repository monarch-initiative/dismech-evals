      assertion_type: Pathophysiology
      assertion:
        name: Oxidative Stress and Apoptosis in Haematopoietic Progenitors
        role: mechanism
        biological_scale: CELLULAR
        description: 'Differentiating haematopoietic stem and progenitor cells depend on a step-up in
          oxidative phosphorylation, and in AK2 deficiency that demand cannot be met. Progenitors entering
          differentiation show mitochondrial membrane depolarisation, accumulation of oxidative stress
          markers, reduced proliferation and increased apoptosis. The defect is one of energy supply during
          differentiation rather than a failure to produce progenitors: multilymphoid progenitor populations
          are still present in RD patient marrow, and antioxidant treatment rescues the phenotype in both
          zebrafish and patient-derived iPSC.

          Note the cell-type binding is narrower than the claim. The population this node is about is
          haematopoietic stem and progenitor cells, including the multipotent and downstream progenitors
          where the energy demand actually bites; CL:0000037 hematopoietic stem cell is the closest available
          term and covers only the stem compartment. The wider claim is carried in preferred_term.'
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: haematopoietic stem and progenitor cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        biological_processes:
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
        - preferred_term: hematopoietic progenitor cell differentiation
          term:
            id: GO:0002244
            label: hematopoietic progenitor cell differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: In zebrafish, Ak2 deficiency affected hematopoietic stem and progenitor cell (HSPC) development
          with increased oxidative stress and apoptosis.
        supports: SUPPORT
