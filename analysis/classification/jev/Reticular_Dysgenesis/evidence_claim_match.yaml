            term:
              id: NCIT:C1287
              label: Recombinant Granulocyte Colony-Stimulating Factor
        notes: 'Curated as a treatment that does not work, because the non-response is a real negative
          result and a mechanistic constraint, not an omission. The in vitro counterpart is in the original
          AK2 report: patient CD34+ cells cultured with G-CSF produced four-fold fewer CD15+CD11b+ neutrophils
          than control cord blood (PMID:19043416).

