      assertion:
        name: AK2
        gene_term:
          preferred_term: AK2
          term:
            id: hgnc:362
            label: AK2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Biallelic loss-of-function variants in AK2 (adenylate kinase 2) are the sole known
          cause of reticular dysgenesis. Reported alleles include missense changes in conserved catalytic
          domains, frameshifting deletions, nonsense variants and a start-loss variant; most abolish or
          strongly reduce AK2 protein while leaving AK2 mRNA intact. A recurrent homozygous missense allele
          (NM_001625.4:c.524G>C, p.Arg175Pro) accounted for nine of ten patients in a Saudi single-centre
          cohort with high consanguinity.
      selected_evidence:
        snippet: Here we identify biallelic mutations in AK2 (adenylate kinase 2) in seven individuals
          affected with reticular dysgenesis.
        supports: SUPPORT
