      assertion_type: AnimalModel
      assertion:
        name: ak2 mutant and morphant zebrafish
        species: Zebrafish
        genotype: ak2 loss of function (mutant and morpholino knockdown)
        description: Zebrafish carrying ak2 loss-of-function alleles or ak2 morpholino knockdown reproduce
          the haematopoietic and sensory arms of RD. Haematopoietic stem and progenitor cell development
          is impaired with increased oxidative stress and apoptosis, leukocyte development is aberrant,
          and antioxidant treatment rescues the haematopoietic phenotype. In the sensory organs, Ak2 deficiency
          raises oxidative stress markers, increases hair-cell death and impairs hair-cell development
          and regeneration.
        publication: PMID:26150473
        genes:
        - preferred_term: AK2
          term:
            id: hgnc:362
            label: AK2
        modeled_mechanisms:
        - target: Oxidative Stress and Apoptosis in Haematopoietic Progenitors
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: Ak2-deficient zebrafish show the oxidative stress and progenitor apoptosis this
            node describes, in vivo and during development.
        - target: Cochlear Hair Cell Death and Sensory Organ Developmental Failure
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: TISSUE
          description: Ak2-deficient zebrafish show hair-cell death and impaired sensory organ development,
            but the readout is lateral-line and inner-ear hair cells in a species that regenerates them,
            not the mammalian stria vascularis where AK2 is expressed.
          limitations: Zebrafish hair cells regenerate and mammalian cochlear hair cells do not, so the
            regeneration defect this model reports has no human counterpart. The model also does not address
            the stria vascularis, which is where AK2 expression is restricted in the mammalian cochlea
            and which is the mechanism proposed for the human deafness. Fidelity to the human cochlear
            lesion is therefore unestablished.
      selected_evidence:
        snippet: Knockdown of zebrafish ak2 also leads to aberrant leukocyte development, stressing the
          evolutionarily conserved role of AK2.
        supports: SUPPORT
