          places the block downstream of G-CSF receptor engagement rather than in the receptor or its
          ligand. Single-cell profiling of treated and untreated RD marrow found only a moderate increase
          in stem, progenitor and granulocyte-monocyte progenitor fractions, with no correction of the
          maturation arrest. Refractory neutropenia is part of the clinical case definition of RD.
        treatment_term:
