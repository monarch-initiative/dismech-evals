        - path: /pathophysiology/3
          value:
            name: Lineage-Restricted Vulnerability of Myeloid and Lymphoid Progenitors
            role: mechanism
            biological_scale: CELLULAR
            description: 'The requirement for AK2 is not uniform across haematopoiesis. Granulocytic and
              lymphoid differentiation fail while erythroid and megakaryocytic maturation proceeds essentially
              normally, and monocyte counts are normal or raised. This selectivity is the mechanistic
              constraint that distinguishes RD from a global bone marrow failure syndrome: it excludes
              a defect in the haematopoietic stem cell itself and points at a lineage-restricted, differentiation-stage-specific
              energy requirement. Single-cell work in patient samples and CRISPR-edited primary human
              HSPC supplies a candidate explanation - metabolic checkpoints that hold anabolic demand
              down are engaged effectively in stem and early progenitor cells but fail in late granulopoiesis.'
            mechanism_confidence: ESTABLISHED
            cell_types:
            - preferred_term: granulocyte monocyte progenitor cell
              term:
                id: CL:0000557
                label: granulocyte monocyte progenitor cell
            - preferred_term: common lymphoid progenitor
              term:
                id: CL:0000051
                label: common lymphoid progenitor
            biological_processes:
            - preferred_term: myeloid cell differentiation
              term:
                id: GO:0030099
                label: myeloid cell differentiation
              modifier: DECREASED
            - preferred_term: lymphocyte differentiation
              term:
                id: GO:0030098
                label: lymphocyte differentiation
              modifier: DECREASED
            - preferred_term: TOR signaling
              term:
                id: GO:0031929
                label: TOR signaling
              modifier: DYSREGULATED
            notes: 'B-cell involvement is variable rather than obligate, and monocytes are spared, so
              "myelo-lymphoid" here means the granulocytic, T- and NK-cell arms in particular. The metabolic-checkpoint
              account (PMID:39378586) is the leading explanation for the stage- and lineage-restriction
              but has been reported once; it is recorded here as mechanism rather than as an established
              explanation of the erythroid and megakaryocytic sparing, which that study did not address.

              The sparing claim is about marrow maturation. Peripheral red-cell and platelet counts in
              RD patients are described as normal or only slightly diminished (PMID:19043416), and secondary
              anaemia or thrombocytopenia can arise from sepsis, prematurity and transfusion history;
              those are not evidence against the marrow finding.'
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Granulocytic Maturation Arrest at the Promyelocyte Stage
        causal_link_type: DIRECT
        description: In the granulocytic arm the failure is expressed as a marrow maturation arrest early
          in granulopoiesis.
      selected_evidence:
        snippet: This caused nucleotide imbalance, including highly elevated adenosine monophosphate and
          inosine monophosphate levels, the depletion of essential substrates such as NAD+ and aspartate,
          and ultimately resulted in proliferation arrest and demise of the granulocyte lineage.
        supports: SUPPORT
