      assertion_type: Pathophysiology
      assertion:
        name: Stria Vascularis AK2 Requirement and Cochlear Ionic Homeostasis Failure
        role: mechanism
        biological_scale: TISSUE
        conforms_to: sensorineural_hair_cell_loss#Cochlear Ionic Homeostasis Disruption and Oxidative
          Stress
        description: 'AK2 is expressed in the cochlea in a strikingly restricted pattern: in the mouse
          inner ear it is detectable only in the stria vascularis, within the lumen of the strial capillaries,
          and is absent from the vestibule, the spiral ligament and the organ of Corti. The stria vascularis
          generates the endocochlear potential and secretes potassium into the endolymph, and failure
          of either function causes hearing impairment - which is the account the original authors gave
          for the deafness of AK2-deficient patients. In zebrafish, Ak2 deficiency raises oxidative stress
          markers in the sensory organs, placing the same redox failure seen in the marrow in the inner
          ear as well. This node is the RD-specific instance of the cochlear ionic-homeostasis and oxidative-stress
          step of the sensorineural_hair_cell_loss module, with the strial energy defect standing in for
          the connexin-26 potassium-recycling defect of the module''s worked example.'
        mechanism_confidence: PROVISIONAL
        locations:
        - preferred_term: stria vascularis
          term:
            id: UBERON:0002282
            label: stria vascularis of cochlear duct
        cell_types:
        - preferred_term: sensory hair cell
          term:
            id: CL:0000855
            label: sensory hair cell
        biological_processes:
        - preferred_term: potassium ion homeostasis
          term:
            id: GO:0055075
            label: potassium ion homeostasis
          modifier: DYSREGULATED
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
        notes: Marked PROVISIONAL. The restricted strial expression of AK2 is solid, and it is the explanation
          offered by the groups that identified the gene, but no study has measured the endocochlear potential
          or endolymph potassium in AK2-deficient cochlea. The competing possibility - that the human
          deficit is driven by an intrinsic hair-cell requirement, as the zebrafish data suggest - is
          recorded as a HUMAN_MODEL_MISMATCH discussion on this entry.
      selected_evidence:
        snippet: In contrast, the assesment of the cochlea revealed an intense AK2 staining observed uniquely
          in the stria vascularis (SV) at post-natal day 7 but not at birth
        supports: SUPPORT
    origin:
