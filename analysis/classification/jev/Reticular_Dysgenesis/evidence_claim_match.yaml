        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: RD-cochlear-mechanism-human-vs-zebrafish
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Is the sensorineural deafness of AK2 deficiency caused by failure of the stria vascularis,
          as the human and mouse expression data suggest, or by a hair-cell-autonomous requirement for
          AK2, as the zebrafish model shows - and does the zebrafish hair-cell regeneration defect have
          any human counterpart at all?
        attaches_to:
        - pathophysiology#Stria Vascularis AK2 Requirement and Cochlear Ionic Homeostasis Failure
        - pathophysiology#Cochlear Hair Cell Death and Sensory Organ Developmental Failure
        rationale: The two lines of evidence point at different cochlear compartments. In the mouse inner
          ear AK2 protein is confined to the stria vascularis and is absent from the organ of Corti, which
          is the basis for the strial account of the human deafness; but no study has measured the endocochlear
          potential or endolymph potassium in AK2-deficient cochlea, so that account rests on an expression
          pattern. The zebrafish model instead shows a hair-cell-autonomous phenotype, including a regeneration
          defect - and mammalian cochlear hair cells do not regenerate, so that half of the zebrafish
          result can have no human counterpart. Which compartment carries the human lesion matters practically,
          because it determines whether the antioxidant strategy that rescues the zebrafish hair cells
          could plausibly protect hearing in patients, a use the zebrafish authors explicitly propose
          as an adjunct to transplantation.
      selected_evidence:
        snippet: In contrast, the assesment of the cochlea revealed an intense AK2 staining observed uniquely
          in the stria vascularis (SV) at post-natal day 7 but not at birth
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19043416
      reference_title: Human adenylate kinase 2 deficiency causes a profound hematopoietic defect associated
        with sensorineural deafness.
      evidence_source: MODEL_ORGANISM
      explanation: The strial side of the mismatch - AK2 is confined to the stria vascularis in the mouse
        cochlea.
