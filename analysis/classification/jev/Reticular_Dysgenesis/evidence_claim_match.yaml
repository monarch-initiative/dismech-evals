              id: MONDO:0009973
              label: reticular dysgenesis
        context: []
      assertion_type: Treatment
      assertion:
        name: Allogeneic haematopoietic stem cell transplantation with myeloablative conditioning
        description: 'Allogeneic HSCT is the only curative treatment. Unlike most other SCIDs, RD requires
          myeloablative conditioning: an unconditioned graft may restore lymphoid immunity without correcting
          the agranulocytosis, and persistent or recurrent agranulocytosis from failed donor myeloid engraftment
          accounted for every death beyond six months after transplant in the international survey. Contemporary
          series report durable full donor myeloid and lymphoid engraftment with early transplantation.
          HSCT does not restore hearing.'
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: allogeneic haematopoietic stem cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
        notes: Deliberately, this treatment has NO target_mechanisms link to "Stria Vascularis AK2 Requirement
          and Cochlear Ionic Homeostasis Failure" or to "Cochlear Hair Cell Death and Sensory Organ Developmental
          Failure". HSCT replaces the haematopoietic compartment only; the cochlear tissue that requires
          AK2 is not of donor origin, so the deafness is untouched. Transplanted patients go on to need
          cochlear implants or hearing aids (PMID:42112325). The absence of those two links is the modelling
          claim, not an omission.
      selected_evidence:
        snippet: Hematopoietic stem cell transplantation (HSCT) is the only option to cure this otherwise
          fatal disease.
        supports: SUPPORT
