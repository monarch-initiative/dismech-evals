        context: []
      assertion_type: Pathophysiology
      assertion:
        name: AK2 Loss of Function in the Mitochondrial Intermembrane Space
        role: trigger
        biological_scale: MOLECULAR
        description: Biallelic AK2 variants abolish or strongly reduce adenylate kinase 2, the phosphotransferase
          that interconverts adenine nucleotides (ATP + AMP <-> 2 ADP) inside the mitochondrial intermembrane
          space. AK2 is the only adenylate kinase isoform resident in that compartment - AK1, AK5, AK7
          and AK8 are cytosolic, AK6 is nuclear, and AK3 and AK4 sit in the mitochondrial matrix - so
          there is no isoform available to compensate locally, which is why the loss is not buffered.
        mechanism_confidence: ESTABLISHED
        molecular_functions:
        - preferred_term: adenylate kinase activity
          term:
            id: GO:0004017
            label: AMP kinase activity
          modifier: LOSS_OF_FUNCTION
        cellular_components:
        - preferred_term: mitochondrial intermembrane space
          term:
            id: GO:0005758
            label: mitochondrial intermembrane space
        genetic_context:
          genes:
          - preferred_term: AK2
            term:
              id: hgnc:362
              label: AK2
          description: Biallelic germline AK2 variants; most reported patients are homozygous, and compound
            heterozygotes are also described.
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The AK2 protein is located in the intermembrane space of mitochondria, whereas other
          members of the AK family are cytoplasmic (AK1, 5, 7 and 8), nuclear (AK6) or located in the
          mitochondrial matrix (AK3 and AK4).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
