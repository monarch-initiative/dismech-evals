      assertion_type: Pathophysiology
      assertion:
        name: Impaired Notch Receptor Processing in Epidermis
        description: Reduced ADAM10-mediated cleavage of Notch receptors is the proposed link between
          ADAM10 variants and the pigmentary phenotype. Epidermal deletion of Adam10 in mice strongly
          reduces Notch processing and Notch signaling, but the defect has not been measured in patient
          skin, where only one ADAM10 copy is affected. It would connect this disorder to Dowling-Degos
          disease, whose POFUT1, POGLUT1 and PSENEN forms also act on Notch processing.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: Notch receptor processing
          term:
            id: GO:0007220
            label: Notch receptor processing
          modifier: DECREASED
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
      selected_evidence:
        snippet: We speculate that the pathogenesis of RAK and Dowling-Degos disease (DDD, a pigmentary
          disease similar to RAK) is associated with the Notch signaling pathway.
        supports: SUPPORT
        directness: INDIRECT
