              id: MONDO:0014234
              label: reticulate acropigmentation of Kitamura
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Dowling-Degos disease
        description: Reticulate pigmentary genodermatosis with flexural rather than acral predominance,
          caused by KRT5, POFUT1, POGLUT1 or PSENEN variants. Overlap cases with features of both disorders
          are reported, and the two were once considered one disease, but ADAM10-positive patients lack
          KRT5 variants.
        disease_term:
          preferred_term: Dowling-Degos disease
          term:
            id: MONDO:0008371
            label: Dowling-Degos disease
        distinguishing_features:
        - Acral (dorsal hands and feet) rather than flexural distribution.
        - Palmoplantar pits and breaks in dermatoglyphics.
        - Different causal genes (ADAM10 versus KRT5 or Notch-glycosylation genes).
      selected_evidence:
        snippet: Rebora and Crovato in 1983 first suspected that DDD and RAK were different phenotypic
          expressions of the same disease on the basis of their striking clinical and histopathological
          similarities.
        supports: SUPPORT
