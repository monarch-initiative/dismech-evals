      assertion_type: Pathophysiology
      assertion:
        name: DHDDS Cis-Prenyltransferase Partial Loss of Function
        description: DHDDS forms the catalytic subunit of the heterotetrameric cis-prenyltransferase with
          the NgBR (NUS1) subunit, which condenses isopentenyl diphosphate onto farnesyl diphosphate to
          build the polyprenyl diphosphate backbone of dolichol. The RP59 K42E substitution destabilizes
          the active site, raises the Km for farnesyl diphosphate and lowers kcat, leaving substantial
          residual activity. DHDDS is expressed ubiquitously and is concentrated in rod and cone inner
          segments in the human retina.
        biological_scale: MOLECULAR
        conforms_to: photoreceptor_degeneration#Photoreceptor Gene Defect
        genes:
        - preferred_term: DHDDS
          term:
            id: hgnc:20603
            label: DHDDS
        - preferred_term: NUS1 (NgBR)
          term:
            id: hgnc:21042
            label: NUS1
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: Biallelic missense variants (K42E homozygous; K42E/T206A; K42E/R98W).
        molecular_functions:
        - preferred_term: dehydrodolichyl diphosphate synthase activity
          modifier: DECREASED
          term:
            id: GO:0045547
            label: ditrans,polycis-polyprenyl diphosphate synthase [(2E,6E)-farnesyl diphosphate specific]
              activity
        cellular_components:
        - preferred_term: dehydrodolichyl diphosphate synthase complex
          term:
            id: GO:1904423
            label: dehydrodolichyl diphosphate synthase complex
        cell_types:
        - preferred_term: rod photoreceptor cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: cone photoreceptor cell
          term:
            id: CL:0000573
            label: retinal cone cell
      selected_evidence:
        snippet: The identified mutation changes the highly conserved residue Lys42 to Glu, resulting
          in lower catalytic efficiency.
        supports: SUPPORT
