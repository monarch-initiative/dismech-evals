      assertion:
        discussion_id: rp59_nonsyndromic_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does a partial loss of a ubiquitously required dolichol-synthesis enzyme cause disease
          confined to the retina in almost all patients?
        attaches_to:
        - pathophysiology#DHDDS Cis-Prenyltransferase Partial Loss of Function
        - pathophysiology#Systemic Protein Hypoglycosylation
        rationale: DHDDS is expressed in every tissue tested and dolichol chain shortening is measurable
          in blood, urine, liver and brain, yet systemic involvement has been reported only once. Candidate
          explanations include photoreceptor demand for dolichol in outer-segment membrane renewal, cell-type
          differences in residual activity, and genetic modifiers such as ALG6.
      selected_evidence:
        snippet: RT-PCR analysis in 21 human tissues revealed ubiquitous expression of DHDDS.
        supports: SUPPORT
