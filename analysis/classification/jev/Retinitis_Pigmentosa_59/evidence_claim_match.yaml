        discussion_id: rp59_k42e_mouse_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the K42E knock-in mouse, which develops inner-retinal synaptic dysfunction without
          photoreceptor loss, model the human rod-cone degeneration, or is the photoreceptor phenotype
          species-specific?
        attaches_to:
        - pathophysiology#Rod Photoreceptor Degeneration
        - pathophysiology#Photoreceptor-to-Bipolar Cell Synaptic Transmission Defect
        - animal_models#Dhdds K42E knock-in mouse
        rationale: The patient allele in mice reproduces the dolichol shortening but not the defining
          photoreceptor degeneration, while the human disease is a rod-cone dystrophy with early macular
          involvement. Mice lack a macula, and a b-wave-selective defect has not been sought in early-stage
          patients, so the synaptic mechanism may be a mouse feature or an early human feature that is
          masked by the time ERGs are recorded.
      selected_evidence:
        snippet: Additionally, unlike the human or nonhuman primate retina, the mouse retina lacks a cone-rich
          macula or fovea.
        supports: SUPPORT
