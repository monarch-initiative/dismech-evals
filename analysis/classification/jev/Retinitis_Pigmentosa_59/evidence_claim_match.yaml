      assertion_type: Genetic
      assertion:
        name: DHDDS
        gene_term:
          preferred_term: DHDDS
          term:
            id: hgnc:20603
            label: DHDDS
        relationship_type: CAUSATIVE
        association: Causative
        variant_origin: GERMLINE
        features: Biallelic hypomorphic missense variants. The founder c.124A>G (p.Lys42Glu) lies near
          the active site and lowers catalytic efficiency; p.Thr206Ala has been found only in trans with
          K42E in patients, and its pathogenicity is supported by the dolichol profile of K42E/T206A patients
          and by knock-in mice. p.Arg98Trp has been reported in trans with K42E in a single patient.
        case_fractions:
        - population: Ashkenazi Jewish families with RP and a known genetic cause (Israel)
          case_fraction_percent: 33.0
          notes: Share of genetically solved families in a cohort of 230 Ashkenazi Jewish RP families,
            of which 37% were solved; DHDDS K42E was second only to the MAK Alu insertion.
        - population: North American recessive or isolate RP patients reporting Jewish ancestry
          case_fraction_percent: 8.6
          cohort_size: 35
        - population: North American recessive or isolate RP patients of mixed ethnicity
          case_fraction_percent: 0.8
          cohort_size: 240
      selected_evidence:
        snippet: Sequence analysis revealed a founder homozygous missense mutation, c.124A>G (p.Lys42Glu),
          in the dehydrodolichyl diphosphate synthase gene (DHDDS) in 20 AJ patients with RP of 15 unrelated
          families.
        supports: SUPPORT
