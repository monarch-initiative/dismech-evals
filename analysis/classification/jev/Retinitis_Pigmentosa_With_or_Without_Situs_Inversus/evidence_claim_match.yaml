  a5289b9c104a0cc4410c3164f7d91060ee00ea8a63e8917ffce435cbadff66c5:
    claim:
      about:
        disease:
          name: Retinitis Pigmentosa With or Without Situs Inversus
          disease_term:
            preferred_term: retinitis pigmentosa with or without situs inversus
            term:
              id: MONDO:0014186
              label: retinitis pigmentosa with or without situs inversus
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Recessive
        description: 'Autosomal recessive. Every reported family is consanguineous with a homozygous ARL2BP
          variant.

          Penetrance and expressivity pull apart by organ, which is why they are recorded separately here.
          The retinal disease is present in every reported biallelic patient, so penetrance is COMPLETE
          for the feature that defines the disease. The extra-ocular features are not: two sisters carrying
          a homozygous ARL2BP splice variant and affected by rod-cone dystrophy had no situs inversus
          on chest radiography. Recording a single INCOMPLETE value would understate the retinal arm and
          a single COMPLETE value would overstate the rest, so the disease-defining feature sets `penetrance`
          and the organ-to-organ variability sets `expressivity`.'
        penetrance: COMPLETE
        expressivity: VARIABLE
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Here, we used a combination of homozygosity mapping and exome sequencing to identify
          mutations in ARL2BP, which encodes an effector protein of the small GTPases ARL2 and ARL3, as
          causative for autosomal-recessive RP (RP66).
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23849777
      reference_title: Mutations in ARL2BP, encoding ADP-ribosylation-factor-like 2 binding protein, cause
        autosomal-recessive retinitis pigmentosa.
      evidence_source: HUMAN_CLINICAL
      explanation: States the inheritance mode, the gene, and the RP66 designation this entry uses as
        a synonym.
