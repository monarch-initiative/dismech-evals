          subtype; the figure below is a diagnostic yield within one consanguineous inherited-retinal-dystrophy
          cohort, not a population rate, which is why this record stays CASES_IN_LITERATURE rather than
          carrying a `rate_per_100000`.
      selected_evidence:
        snippet: Causative variants in previously reported syndromic IRDs genes were detected in 13/72
          (18%) IRD families, including 5/72 (6.94%), 4/72 (5.55%), 2/72 (2.8%), 1/72(1.38%) and 1/72
          (1.38%) in Usher syndrome, Bardet-Biedl syndrome, Batten disease, retinitis pigmentosa with
          situs inversus and Stickler syndrome segregated families, respectively.
        supports: SUPPORT
