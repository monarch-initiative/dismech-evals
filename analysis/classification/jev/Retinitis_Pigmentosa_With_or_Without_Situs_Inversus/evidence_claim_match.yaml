        kind: KNOWLEDGE_GAP
        attaches_to:
        - treatments#
        prompt: Is there any therapy that alters the course of ARL2BP-related retinal degeneration, and
          what should be curated when the honest answer is no?
        rationale: 'This entry has an empty `treatments:` section, and that is a finding rather than an
          omission. No therapy has been shown to modify the course of retinitis pigmentosa of any genotype,
          so there is nothing RP66-specific to curate; the best available statement is a Cochrane review''s,
          and it is about RP as a class rather than about this gene. What patients receive is supportive
          care, which is not documented for RP66 anywhere in the cited literature. Curating it from general
          practice would manufacture disease-specific claims. If a heritable-retinal-dystrophy management
          guideline is added to the KB later, the supportive measures can be curated against it at `directness:
          INDIRECT`.'
