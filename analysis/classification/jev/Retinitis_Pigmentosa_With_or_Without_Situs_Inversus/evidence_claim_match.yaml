        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of ARL2BP from the Photoreceptor Basal Body and Connecting Cilium
        biological_scale: MOLECULAR
        description: 'ARL2BP normally localises to the basal body, the cilium-associated centriole and
          the periciliary extension of the photoreceptor inner segment. ARL2, not ARL3, is what recruits
          or anchors it there: depleting ARL2 displaces ARL2BP from the basal body while depleting ARL3
          does not. That asymmetry is the reason this node names ARL2 specifically.'
        cell_types:
        - preferred_term: Photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        - preferred_term: Retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
      selected_evidence:
        snippet: In the mouse retina, ARL2BP localized to the basal body and cilium-associated centriole
          of photoreceptors and the periciliary extension of the inner segment.
        supports: SUPPORT
        directness: INDIRECT
