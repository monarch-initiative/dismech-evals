  e406cf30a76104b7e55d110db31686947b6a3a63e73514202b37c5bc0be03d74:
    claim:
      about:
        disease:
          name: Retinitis Pigmentosa With or Without Situs Inversus
          disease_term:
            preferred_term: retinitis pigmentosa with or without situs inversus
            term:
              id: MONDO:0014186
              label: retinitis pigmentosa with or without situs inversus
        context: []
      assertion_type: Genetic
      assertion:
        name: ARL2BP
        gene_term:
          preferred_term: ARL2BP
          term:
            id: hgnc:17146
            label: ARL2BP
        relationship_type: CAUSATIVE
        notes: 'ARL2BP is an effector of ARL2 and ARL3. Functionally it is ARL2 that anchors it at the
          ciliary base: ARL3 depletion does not displace it. That matters when reading the wider ARL2/ARL3
          photoreceptor-trafficking literature, much of which concerns ARL3 and its GAP RP2 in a different
          disease.'
        variants:
        - name: c.101-1G>C (splice acceptor)
          description: Homozygous splice-acceptor variant in the founding RP-plus-situs-inversus family,
            shown to alter pre-mRNA splicing in blood RNA.
          gene:
            preferred_term: ARL2BP
            term:
              id: hgnc:17146
              label: ARL2BP
          clinical_significance: PATHOGENIC
        - name: c.134T>G (p.Met45Arg)
          description: 'The one missense allele, and the only one with a published mechanism at protein
            level: it reduces ARL2 binding and abolishes basal-body localisation, which is what ties the
            missense class to the same mislocalisation mechanism as the truncating alleles.'
          gene:
            preferred_term: ARL2BP
            term:
              id: hgnc:17146
              label: ARL2BP
          clinical_significance: PATHOGENIC
        - name: c.22_23delAG (p.S8Lfs*10)
          description: Frameshift allele in a Chinese consanguineous family, reported with the RP, situs
            inversus and male-infertility triad.
          gene:
            preferred_term: ARL2BP
            term:
              id: hgnc:17146
              label: ARL2BP
          clinical_significance: PATHOGENIC
        - name: c.294-1G>C (splice acceptor, intron 4)
          description: Splice-acceptor allele in the case with the longest published follow-up, and the
            one that added renal agenesis and microcysts to the phenotype.
          gene:
            preferred_term: ARL2BP
            term:
              id: hgnc:17146
              label: ARL2BP
          clinical_significance: LIKELY_PATHOGENIC
        - name: c.100+1G>T (splice donor)
          description: Novel splice-donor allele from a consanguineous Pakistani family, absent from gnomAD
            and ClinVar, with SpliceAI supporting loss of both the acceptor and the donor site.
          gene:
            preferred_term: ARL2BP
            term:
              id: hgnc:17146
