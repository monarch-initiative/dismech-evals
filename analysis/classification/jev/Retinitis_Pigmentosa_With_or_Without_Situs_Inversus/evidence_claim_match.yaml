        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Ciliary Axoneme and Doublet Microtubule Assembly
        biological_scale: CELLULAR
        description: The structural lesion. Depleting ARL2BP shortens cilia. In the knockout mouse retina,
          photoreceptor axonemes are shortened and the ciliary doublet microtubules are malformed, with
          open B-tubules and loss of the singlet microtubules. This is a defect in building the ciliary
          skeleton, not merely in cargo delivery along it.
        biological_processes:
        - preferred_term: axoneme assembly
          term:
            id: GO:0035082
            label: axoneme assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Interestingly, ciliary doublet microtubule (MT) structure was also impaired, displaying
          open B-tubule doublets, paired with loss of singlet MTs.
        supports: SUPPORT
