          (p.Met45Arg) that reduces ARL2 binding. All converge on loss of ARL2BP function at the ciliary
          base.'
        genetic_context:
          gene:
            preferred_term: ARL2BP
            term:
              id: hgnc:17146
              label: ARL2BP
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: This hypothesis is supported by the finding that the p.Met45Arg amino acid substitution
          reduced binding to ARL2 and caused the loss of ARL2BP localization at the basal body in ciliated
          nasal epithelial cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
