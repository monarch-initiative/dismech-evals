    evidence_metadata:
      reference: PMID:39524166
      reference_title: 'Recurrence of Retinopathy of Prematurity Following Anti-vascular Endothelial Growth
        Factor (Anti-VEGF) Therapy: A Systematic Review and Meta-Analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Meta-analysis of 21 studies (6,152 eyes). The quoted result is a trade-off rather
        than an efficacy measure: it reports a roughly two-fold HIGHER recurrence risk for anti-VEGF than
        for laser photocoagulation. It therefore establishes that anti-VEGF is an established, studied
        treatment modality for ROP and characterises its principal drawback, but it does not evidence
        anti-VEGF efficacy.

        '
