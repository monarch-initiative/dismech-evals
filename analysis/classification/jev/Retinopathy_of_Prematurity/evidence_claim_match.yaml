      assertion:
        name: Intravitreal Anti-VEGF Therapy
        description: 'Intravitreal injection of anti-VEGF agents (bevacizumab or ranibizumab) to suppress
          pathological neovascularization. Preferred over laser for Zone I and posterior Zone II ROP due
          to better structural outcomes and preservation of peripheral retinal function. Bevacizumab is
          widely used off-label; ranibizumab (RAINBOW trial) has a pediatric indication in some jurisdictions.
          Risk of reactivation requires careful follow-up.

          '
