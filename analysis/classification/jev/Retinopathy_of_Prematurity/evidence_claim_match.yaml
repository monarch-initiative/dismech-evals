              label: retinopathy of prematurity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hyperoxia-Induced Retinal Vessel Arrest
        description: 'After premature birth and exposure to supplemental oxygen, retinal oxygen tension
          rises above normal fetal levels. Elevated oxygen tension downregulates hypoxia-inducible factor
          1-alpha (HIF-1alpha), suppressing transcription of VEGF-A in Muller glia and astrocytes. The
          resulting lack of VEGF leads to obliteration or arrest of the normally developing retinal vasculature,
          leaving the peripheral retina avascular. This phase corresponds to the first weeks after birth.

          '
        cell_types:
        - preferred_term: Muller cell
          term:
            id: CL:0000636
            label: Mueller cell
        - preferred_term: retinal astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: VEGF production suppression by hyperoxia
          term:
            id: GO:0001525
            label: angiogenesis
          modifier: DECREASED
        - preferred_term: retinal vessel development arrest
          term:
            id: GO:0001569
            label: branching involved in blood vessel morphogenesis
          modifier: DECREASED
      selected_evidence:
        snippet: reports suggest that premature birth leads to the exposure of immature ocular tissues
          to high levels of exogenous oxygen and hyperoxia, which increase the synthesis of reactive oxygen
          species and inhibit HIF expression
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
