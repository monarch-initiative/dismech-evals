  622a67a280824af0ae6a671adff639e602a7f1f9af887b79a551d5a200767fd8:
    claim:
      about:
        disease:
          name: Retinopathy of Prematurity
          disease_term:
            preferred_term: Retinopathy of Prematurity
            term:
              id: MONDO:0006952
              label: retinopathy of prematurity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hypoxia-Driven Pathological Neovascularization
        description: 'As the premature infant matures, the incompletely vascularized retina develops increasing
          metabolic demand. The avascular peripheral retina becomes hypoxic, stabilizing HIF-1alpha and
          driving strong upregulation of VEGF-A, erythropoietin, IGF-1, and angiopoietin-2. Excess VEGF
          triggers pathological neovascularization: new vessels grow beyond the inner limiting membrane
          into the vitreous. These abnormal vessels are fragile and prone to vitreous hemorrhage. Fibrovascular
          membrane contraction may cause tractional or exudative retinal detachment. The Norrin/FZD4/LRP5
          pathway, which normally guides retinal vessel development, is also disrupted in this context.

          '
        cell_types:
        - preferred_term: retinal vascular endothelial cell
          term:
            id: CL:0000071
            label: blood vessel endothelial cell
        - preferred_term: Muller cell
          term:
            id: CL:0000636
            label: Mueller cell
        biological_processes:
        - preferred_term: VEGF-driven pathological angiogenesis
          term:
            id: GO:0001525
            label: angiogenesis
          modifier: INCREASED
        - preferred_term: retinal hypoxia response via HIF-1alpha
          term:
            id: GO:0001666
            label: response to hypoxia
          modifier: INCREASED
      selected_evidence:
        snippet: the oxygen-induced retinopathy (OIR) mouse model has gained the most popularity and critically
          contributed to our current understanding of pathological retinal angiogenesis and the discovery
          of potential anti-angiogenic therapies
        supports: SUPPORT
