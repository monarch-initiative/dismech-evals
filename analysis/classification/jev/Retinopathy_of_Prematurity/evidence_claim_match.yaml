          rate nor the treatment-independent scope the description previously asserted ("regardless of
          treatment outcome"). Per docs/frequency-evidence-guidelines.md, omit the band rather than justify
          it. Restoring a band needs a source giving the incidence of myopia after ROP; the untreated-versus-treated
          comparison would also need its own source. Same disposition, and same reason, as the band dropped
          on the Retinopathy of Prematurity phenotype above.

          '
        phenotype_term:
