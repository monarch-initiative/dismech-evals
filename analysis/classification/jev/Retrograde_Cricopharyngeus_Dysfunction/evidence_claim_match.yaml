      assertion:
        name: Antegrade Cricopharyngeus Dysfunction
        description: Deglutitive cricopharyngeus muscle dysfunction occurring predominantly in older adults
          and presenting with oropharyngeal dysphagia due to impaired upper esophageal sphincter opening
          during swallowing.
        distinguishing_features:
        - Presents with swallowing difficulty (oropharyngeal dysphagia) in older adults rather than inability
          to belch in young adults.
        - Deglutitive upper esophageal sphincter relaxation is impaired in antegrade cricopharyngeus dysfunction
          but preserved in R-CPD.
      selected_evidence:
        snippet: 'BT injection into the CPM has been previously reported for a different condition: a
          swallowing problem seen mostly in older persons caused by antegrade CPD (A-CPD).5-7 In the senior
          author’s extensive experience with that condition, A-CPD is much better treated with cricopharyngeus
          myotomy, and none of the patients with R-CPD reported here had any symptoms or findings of A-CPD.'
        supports: SUPPORT
