      assertion_type: Diagnosis
      assertion:
        name: High-Resolution Impedance Manometry
        description: High-resolution impedance manometry (HRIM) with a provocative carbonated water challenge
          (e.g., 500 mL) objectively demonstrates increased esophageal pressure equilibrating with gastric
          pressure, absence of upper esophageal sphincter relaxation with no air venting across the UES,
          and repetitive secondary peristalsis, alongside elevated basal UES pressure and increased UES
          length.
        measurements:
        - preferred_term: high-resolution impedance manometry of the upper esophageal sphincter
          term:
            id: LOINC:51393-7
            label: Esophageal manometry study
        notes: 'LOINC codes esophageal manometry once, as a study whose result is a report, and that single
          record is what is bound: one match in the full LOINC 2.83 table and one in the Monarch KG, paginated
          to its stated total, with no Part. Two things it does not capture, recorded so the binding is
          not read as more than it is. The release has no high-resolution or impedance variant, so the
          modality this row specifies is not in the code. And it has no code for the provocative carbonated-water
          challenge that makes the test diagnostic here. The release''s one quantitative esophageal pressure
          code, LOINC:60738-2, is a single intraluminal pressure rather than a manometry study and is
          not bound. No reference range is bound: the row''s finding is failure of relaxation during distension,
          not a pressure threshold.'
      selected_evidence:
        snippet: The field has now further advanced with the publication in this issue of the Journal
          by Oude Nijhuis et al. of 8 cases of R-UESD demonstrated by high-resolution impedance manometry
          (HRIM) with a provocative challenge of carbonated water.
        supports: SUPPORT
