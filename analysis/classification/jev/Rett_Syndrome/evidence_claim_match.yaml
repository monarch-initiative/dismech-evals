  0765e4f103456bb948b469c4bb46be13092041dc1dc15a3834f29a959649b3fc:
    claim:
      about:
        disease:
          name: Rett Syndrome
          disease_term:
            preferred_term: Rett syndrome
            term:
              id: MONDO:0010726
              label: Rett syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rett_prenatal_versus_postnatal_contribution
        prompt: How much of the Rett phenotype is already set before birth, given that this entry models
          the disease as a failure of postnatal maturation following a period of apparently normal early
          development?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Dysregulated Neuronal Gene Expression
        - progression#Onset
        rationale: 'Human iPSC-derived cerebral organoids carrying the MECP2 T203M variant show disrupted
          neurogenesis with chromatin opening at AT-rich enhancers, pushing cells toward proliferation
          and away from neuronal differentiation. That is a prenatal-stage proxy, and it sits awkwardly
          with the clinical picture of normal development to 6-18 months that the progression section
          records. The stakes are practical rather than taxonomic: if a substantial share of the phenotype
          is fixed prenatally, postnatal gene replacement has a lower efficacy ceiling than the adult
          mouse reactivation experiments imply, and the three AAV-MECP2 trials curated here are the ones
          that would run into it. What is missing is any human in vivo measurement. One organoid line
          carrying one point mutation cannot establish that prenatal disruption occurs in patients, still
          less quantify its share.'
        proposed_experiments:
        - experiment_id: rett_timed_conditional_mecp2_deletion
          name: Timed conditional Mecp2 deletion across prenatal and postnatal windows
          description: Delete Mecp2 in inducible conditional mice at embryonic day 14, postnatal day 0,
            postnatal day 14, and postnatal day 28, then assess behaviour, dendritic morphology, transcriptome,
            and electrophysiology at matched ages. A prenatal contribution predicts that embryonic deletion
            yields an earlier and more severe phenotype than the postnatal deletions; a purely postnatal
            mechanism predicts that embryonic and early postnatal deletion converge on the same endpoint.
          would_support:
          - pathophysiology#Dysregulated Neuronal Gene Expression
          supporting_outcome:
          - Embryonic deletion produces earlier onset and greater severity than matched postnatal deletion,
            establishing a prenatal contribution to the final phenotype.
          refuting_outcome:
          - Embryonic and early postnatal deletion produce indistinguishable phenotypes, confining the
            pathogenic window to postnatal maturation.
      selected_evidence:
        snippet: Our findings revealed a notably open chromatin state in the organoids with a mutated
          MECP2, particularly in the enhancer regions with a high proportion of adenine (A) and thymine
          (T) bases. This alteration induced the expression of genes related to proliferation but suppressed
          those associated with neuronal differentiation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
