          name: Rett Syndrome
          disease_term:
            preferred_term: Rett syndrome
            term:
              id: MONDO:0010726
              label: Rett syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_mecp2_loss_transcriptional_synaptic_dysregulation_model
        hypothesis_label: Canonical MECP2 Loss / Transcriptional & Synaptic Dysregulation Model
        status: CANONICAL
        description: Rett syndrome is caused predominantly by de novo loss-of-function variants in MECP2
          on Xq28 in heterozygous females (hemizygous males are typically neonatally lethal). MeCP2 is
          a methyl-CpG-binding nuclear protein that functions as a context-dependent transcriptional regulator
          (predominantly repressor of long, methylated genes) and a chromatin modifier, with highest expression
          in postmitotic neurons. MeCP2 loss disrupts the normal repression of long neuronal genes, dysregulates
          BDNF and other neurotrophin expression, and produces failure of postnatal synaptic and dendritic
          maturation. The resulting circuit dysfunction — affecting GABAergic interneurons, monoaminergic
          systems, and excitatory/inhibitory balance — drives the apparent developmental regression, loss
