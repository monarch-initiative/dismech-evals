      assertion_type: Pathophysiology
      assertion:
        name: Cortical Excitation/Inhibition Imbalance
        description: Cortical circuits in Rett syndrome sit shifted toward excitation, and the shift is
          measurable in patients rather than only inferred from models. Paired-pulse transcranial magnetic
          stimulation of primary motor cortex in typical Rett patients shows a raised excitation index,
          driven by reduced short-interval intracortical inhibition and increased intracortical facilitation,
          which the investigators read as GABAergic dysfunction. Long-interval intracortical inhibition
          is likewise reduced, and LTP-like plasticity is abolished and scales with motor disability.
          The GABAergic attribution is the study authors' interpretation of the neurophysiology, not a
          direct measurement of interneuron function in these patients.
        biological_scale: TISSUE
        cell_types:
        - preferred_term: GABAergic interneuron
          term:
