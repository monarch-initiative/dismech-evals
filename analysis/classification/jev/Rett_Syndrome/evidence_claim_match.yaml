    evidence_metadata:
      reference: PMID:41182667
      reference_title: MECP2(T203M) mutation disrupts neurogenesis in human cerebral organoids by altering
        chromatin dynamics and transcriptional regulation.
      evidence_source: IN_VITRO
      explanation: The only direct evidence for prenatal-stage disruption in a human system, and the reason
        the gap is worth recording; it is a single organoid model of a single variant and does not establish
        that the same occurs in patients.
