        description: 'Breathing disturbances arise from MeCP2-dependent dysfunction in respiratory control
          networks, including ventrolateral medulla and pontine circuits. Within the pons the lesion has
          been localised to the Koelliker-Fuse area, which drives post-inspiration and can reset the respiratory
          oscillator: Mecp2 heterozygous mice lose GABAergic perisomatic boutons there, and the link is
          bidirectional, since boosting local GABA reuptake blockade reduces breathing irregularity in
          mutant mice while blocking GABA-A receptors in the same area of healthy rats reproduces the
          Rett respiratory phenotype.

          '
        cell_types:
