  6ce70e1541c52584a1868b38f5de1b0cea23c8c2240f18193e7a0e5afe6a06d5:
    claim:
      about:
        disease:
          name: Rett Syndrome
          disease_term:
            preferred_term: Rett syndrome
            term:
              id: MONDO:0010726
              label: Rett syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Non-Cell-Autonomous Glial Injury of Neurons
        description: 'MeCP2 loss is not confined to neurons, and MeCP2-deficient glia actively injure
          neighbouring neurons rather than merely failing to support them. Conditioned medium from Mecp2-null
          microglia carries a fivefold excess of glutamate that stunts and beads dendrites and damages
          postsynaptic glutamatergic components within a day, an effect abolished by blocking microglial
          glutamate synthesis or release or by antagonising neuronal glutamate receptors. Oligodendrocyte
          lineage cells contribute separately: deleting MeCP2 from them alone produces hindlimb clasping,
          and restoring it to them alone in otherwise null mice improves locomotion and clasping. Both
          results are from mouse systems and the corresponding experiment cannot be done in human brain,
          so this node is model-derived.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: microglial cell
          term:
            id: CL:0000129
            label: microglial cell
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        biological_processes:
        - preferred_term: dendrite morphogenesis
          term:
            id: GO:0048813
            label: dendrite morphogenesis
          modifier: DECREASED
      selected_evidence:
        snippet: Hippocampal neurons treated with CM from Mecp2-null microglia showed an abnormal stunted
          and beaded dendritic morphology, and signs of microtubule disruption and damage of postsynaptic
          glutamatergic components within 24 h.
        supports: SUPPORT
