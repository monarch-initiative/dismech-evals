        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rett_mecp2_phase_separation_species_mismatch
        prompt: Does MeCP2 organise chromatin through liquid-liquid phase separation in human neurons,
          or is that mechanism an artefact of mouse chromocentre biology that humans do not share?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of MeCP2 Epigenetic Regulation
        rationale: 'Two lines of evidence point in opposite directions, and the disagreement is not merely
          about interpretation. In vitro, MeCP2 drives phase separation of nucleosomal arrays, methylation
          enhances it, and Rett-causing mutations compromise it while benign variants do not, which is
          a striking genotype-phenotype correspondence. In live cells, MeCP2 foci persist when heterochromatin
          is disrupted and lack the hallmarks of phase separation, and the prominent foci that made the
          model attractive turn out to be a mouse peculiarity: MeCP2 is diffusely distributed in most
          mammals including humans, and the foci are absent in a mouse subspecies lacking methylated satellite
          repeats. The question is therefore translational, not just contested. Resolving it matters because
          a condensate-forming mechanism would be therapeutically targetable in ways that simple methyl-DNA
          binding is not. Nothing here is curated as a pathophysiology node; the entry commits only to
          the methylation-dependent chromatin regulation that both sides accept.'
      selected_evidence:
        snippet: we found that MeCP2 can induce compaction and liquid-liquid phase separation of nucleosomal
          arrays in vitro, and DNA methylation further enhances formation of chromatin condensates by
          MeCP2
        supports: SUPPORT
    origin:
