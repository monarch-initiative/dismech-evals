  ba66edaa951e00ee04d376d5f6a002a3deb60265ad7a5f7ba023452a80fae70f:
    claim:
      about:
        disease:
          name: Rett Syndrome
          disease_term:
            preferred_term: Rett syndrome
            term:
              id: MONDO:0010726
              label: Rett syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rett_peripheral_tissue_autonomous_pathology
        prompt: Which peripheral features of Rett syndrome are tissue-autonomous consequences of MeCP2
          loss in that organ rather than downstream of brain dysfunction, and how much do they contribute
          to clinical burden?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of MeCP2 Epigenetic Regulation
        - phenotypes#
        rationale: 'MECP2 is expressed ubiquitously, and two lines of evidence show peripheral pathology
          that is not secondary to the brain. Liver-targeted Mecp2 deletion in mice causes fatty liver
          and dyslipidemia with no neuronal deletion involved, and patient peripheral blood mononuclear
          cells carry a constitutively activated TLR4-IRAK1-NF-kB axis with NLRP3 inflammasome assembly
          from the earliest disease stages, correlating with mutation severity. This entry curates Rett
          syndrome as a brain disorder: every pathophysiology node is neural, and the phenotype list carries
          no hepatic, metabolic, or immune entry for these findings to attach to. That is a deliberate
          gap statement rather than a curation oversight, because the contribution of peripheral pathology
          to the clinical picture has not been quantified, and because the hepatic result is a mouse tissue-specific
          deletion whose human counterpart is limited to reported dyslipidemia.'
      selected_evidence:
        snippet: we find that liver targeted deletion of Mecp2 causes fatty liver disease and dyslipidemia
          similar to HDAC3 liver-specific deletion
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27288453
      reference_title: MeCP2 co-ordinates liver lipid metabolism with the NCoR1/HDAC3 corepressor complex.
      evidence_source: MODEL_ORGANISM
      explanation: A tissue-specific deletion design, so the hepatic phenotype cannot be downstream of
        neuronal MeCP2 loss; the same study places MeCP2 as the anchor for the NCoR1/HDAC3 repressor complex
        at hepatic lipogenesis targets.
