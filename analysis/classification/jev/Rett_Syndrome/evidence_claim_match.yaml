        description: 'MeCP2 normally binds methylated CpG dinucleotides and participates in transcriptional
          repression and activation. Loss or altered dosage of MeCP2 changes neuronal gene-expression
          programs, providing the proximal molecular bridge from MECP2 mutation to downstream neurodevelopmental
          defects. The regulatory function lost here is broader than gene-specific repression. MeCP2 is
          present in neuronal nuclei at near histone-octamer abundance, so its removal changes chromatin
          state globally rather than at a defined target set; most of its protein partners are mRNA splicing
          factors, and it also loads the Super Elongation Complex scaffold AFF4 onto synaptic-plasticity
          genes. Chromatin architecture, alternative splicing, and transcription elongation are therefore
          all disrupted alongside transcriptional output.

          '
