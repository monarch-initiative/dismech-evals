          term:
            id: GO:0051932
            label: synaptic transmission, GABAergic
          modifier: DECREASED
        - preferred_term: regulation of synaptic plasticity
          term:
            id: GO:0048167
            label: regulation of synaptic plasticity
          modifier: DECREASED
      selected_evidence:
        snippet: RTT patients displayed a significant increase of the excitation index (p = 0.003), as
          demonstrated by the reduction of short-interval intracortical inhibition and increase of intracortical
          facilitation, suggesting a shift toward cortical excitation likely due to GABAergic dysfunction.
