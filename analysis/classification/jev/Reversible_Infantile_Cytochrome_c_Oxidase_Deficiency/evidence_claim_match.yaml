        description: 'A maternally inherited, homoplasmic m.14674T>C (or m.14674T>G) mutation in the mitochondrial
          DNA-encoded tRNA for glutamate (MT-TE) reduces steady-state levels of mt-tRNA(Glu) and impairs
          intramitochondrial protein synthesis. The severity of the translation defect is further modulated
          by mt-tRNA(Glu) 2-thiouridylation, which depends on the nuclear modifier TRMU; reduced 2-thiouridylation
          exacerbates the effect of the tRNA(Glu) mutation on mitochondrial translation. This is a mitochondrial-DNA
          tRNA / translation lesion, mechanistically distinct from the nuclear assembly-factor defects
          classified alongside it under Complex IV deficiency.

          '
