      assertion_type: Inheritance
      assertion:
        name: Maternal mitochondrial inheritance (homoplasmic)
        description: The m.14674T>C and m.14674T>G MT-TE variants are carried on mitochondrial DNA and
          transmitted maternally. Unusually for an mtDNA disease they are homoplasmic rather than heteroplasmic,
          so there is no heteroplasmy threshold; penetrance is instead incomplete, and the reversible
          course reflects developmental compensation rather than a shifting mutant load.
        inheritance_term:
          preferred_term: Mitochondrial inheritance
          term:
            id: HP:0001427
            label: Mitochondrial inheritance
      selected_evidence:
        snippet: Homoplasmic maternally inherited, m.14674T>C or m. 14674T>G mt-tRNA(Glu) mutations have
          recently been identified in reversible infantile cytochrome c oxidase deficiency (or 'benign
          COX deficiency').
        supports: SUPPORT
