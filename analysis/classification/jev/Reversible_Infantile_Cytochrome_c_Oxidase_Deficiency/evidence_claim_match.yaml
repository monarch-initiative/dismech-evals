  3a2cac399e94a1cf502a12d60349c1df364f719db9e33dacfcc0490f5e241cbf:
    claim:
      about:
        disease:
          name: Reversible Infantile Cytochrome c Oxidase Deficiency
          disease_term:
            preferred_term: Reversible infantile cytochrome c oxidase deficiency (RIRCD)
            term:
              id: MONDO:0957524
              label: COX deficiency, benign infantile mitochondrial myopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Developmental Compensation and Spontaneous Recovery
        description: 'The hallmark of RIRCD is spontaneous clinical and biochemical recovery over the
          first one to three years of life. Recovery is attributed to tissue-specific, largely nuclear-encoded
          compensatory mechanisms rather than change in the homoplasmic mtDNA mutation load. One proposed
          mechanism — a developmental isoform switch of nuclear-encoded cytochrome c oxidase subunits
          (COX6A, COX7A) toward the heart/muscle isoforms around three months of age — was formally tested
          and refuted by Boczonadi et al. (2015): patient follow-up biopsies showed that the isoform switch
          does not contribute to disease manifestation or spontaneous recovery. The primary active mechanism
          is TRMU-dependent restoration of mt-tRNA 2-thiouridylation, which modulates the severity of
          the translation defect and drives age-dependent recovery in skeletal muscle. A mild residual
          myopathy may persist into adulthood.

          '
      selected_evidence:
        snippet: Normal respiratory chain enzyme activities in naive myoblasts suggested the compensatory
          influence of nuclear factors
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
