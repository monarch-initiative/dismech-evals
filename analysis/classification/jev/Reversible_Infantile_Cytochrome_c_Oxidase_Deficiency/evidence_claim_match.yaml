            term:
              id: MONDO:0957524
              label: COX deficiency, benign infantile mitochondrial myopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Respiratory Chain (Complex IV) Deficiency in Skeletal Muscle
        description: 'The mitochondrial translation defect lowers production of mtDNA-encoded cytochrome
          c oxidase subunits, producing a respiratory chain deficiency that affects predominantly Complex
          IV and variably Complexes I and III in skeletal muscle and patient-derived cybrids. The deficiency
          is tissue- and differentiation-dependent: it is seen in mature muscle and cybrids but not in
          naive myoblasts, indicating that nuclear-encoded factors can compensate.

          '
        cell_types:
        - preferred_term: skeletal muscle cell
          term:
            id: CL:0000188
            label: cell of skeletal muscle
        biological_processes:
        - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
          term:
            id: GO:0006123
            label: mitochondrial electron transport, cytochrome c to oxygen
          modifier: DECREASED
        - preferred_term: mitochondrial ATP synthesis coupled electron transport
          term:
            id: GO:0042775
            label: mitochondrial ATP synthesis coupled electron transport
          modifier: DECREASED
      selected_evidence:
        snippet: cybrids derived from patients showed decreased activity of respiratory complexes IV,
          and/or I, III; however, this was normal in naive myoblasts
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
