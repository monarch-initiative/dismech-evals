            term:
              id: MONDO:0957524
              label: COX deficiency, benign infantile mitochondrial myopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Homoplasmic mt-tRNA(Glu) Mutation and Impaired Mitochondrial Translation
        description: 'A maternally inherited, homoplasmic m.14674T>C (or m.14674T>G) mutation in the mitochondrial
          DNA-encoded tRNA for glutamate (MT-TE) reduces steady-state levels of mt-tRNA(Glu) and impairs
          intramitochondrial protein synthesis. The severity of the translation defect is further modulated
          by mt-tRNA(Glu) 2-thiouridylation, which depends on the nuclear modifier TRMU; reduced 2-thiouridylation
          exacerbates the effect of the tRNA(Glu) mutation on mitochondrial translation. This is a mitochondrial-DNA
          tRNA / translation lesion, mechanistically distinct from the nuclear assembly-factor defects
          classified alongside it under Complex IV deficiency.

          '
        genes:
        - preferred_term: MT-TE
          term:
            id: hgnc:7479
            label: MT-TE
        biological_processes:
        - preferred_term: mitochondrial translation
          term:
            id: GO:0032543
            label: mitochondrial translation
          modifier: DECREASED
        - preferred_term: mt-tRNA(Glu) 2-thiouridylation (wobble uridine thiolation)
          term:
            id: GO:0002143
            label: tRNA wobble position uridine thiolation
          modifier: DECREASED
      selected_evidence:
        snippet: identifying a maternally inherited, homoplasmic m.14674T>C mt-tRNA(Glu) mutation in 17
          patients from 12 families
        supports: SUPPORT
