      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hoyeraal-Hreidarsson Syndrome
        description: The other severe infantile variant of dyskeratosis congenita, and the closest relative.
          Shares cerebellar hypoplasia, intrauterine growth restriction and early marrow failure with
          Revesz syndrome, and was lumped with it into the same TINF2 entity by ClinGen. Distinguished
          clinically by microcephaly, progressive immunodeficiency and more severe cognitive impairment,
          and by the absence of the exudative retinopathy - although proliferative retinopathy has been
          reported in Hoyeraal-Hreidarsson too, which weakens that boundary as well.
        distinguishing_features:
        - Microcephaly and progressive immunodeficiency, which are not features of Revesz syndrome.
        - Not confined to TINF2 - Hoyeraal-Hreidarsson syndrome also arises from RTEL1, TERT, ACD, PARN
          and DKC1 variants.
      selected_evidence:
        snippet: Hoyeraal-Hreidarsson syndrome, on the other hand, shares some signs of Revesz syndrome
          such as cerebellar hypoplasia and intrauterine growth restriction, but can also present with
          progressive immunodeficiency, microcephaly, and moderate to severe mental retardation.
        supports: SUPPORT
