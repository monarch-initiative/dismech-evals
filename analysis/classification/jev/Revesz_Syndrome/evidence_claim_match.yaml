      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tin2_telomerase_recruitment_defect
        hypothesis_label: DC-cluster TIN2 variants shorten telomeres by impairing telomerase recruitment
        status: ALTERNATIVE
        description: 'Ectopically expressed TIN2 carrying dyskeratosis congenita missense mutations shortens
          telomeres in human cells, and the mutants are specifically defective in associating with the
          telomerase RNA component and with telomerase activity, while leaving total cellular telomerase
          activity, TIN2 localisation and telomere end protection intact. On this account the lesion is
          a failure to deliver telomerase to the telomere through TPP1, not a failure of the enzyme or
          of end protection.

          This is the more widely cited of the two models and fits the clinical observation that telomerase
          RNA levels are normal in TINF2 patients. It is nevertheless recorded as ALTERNATIVE rather than
          CANONICAL, because the mouse work below shows the defect is not solely telomerase-dependent,
          and no experiment has apportioned the two.'
      selected_evidence:
        snippet: we found TIN2 to participate in the TPP1-dependent recruitment of telomerase activity.
          Furthermore, DC mutations in TIN2 led to its decreased ability to associate with TERC and telomerase
          activity.
        supports: SUPPORT
    origin:
