  22ebdd1d0a5afdab4cbcef50b6c47b22a5ea2a34ee0aa9fbf9dddace3b6b99f4:
    claim:
      about:
        disease:
          name: Revesz Syndrome
          disease_term:
            preferred_term: Revesz syndrome
            term:
              id: MONDO:0009990
              label: Revesz syndrome
        context: []
      assertion_type: AnimalModel
      assertion:
        name: TIN2(DC) knock-in mouse (K280E equivalent)
        species: Mouse
        genotype: Tinf2 knock-in, equivalent of human TIN2 K280E dyskeratosis congenita allele, heterozygous
        publication: PMID:24449270
        genes:
        - preferred_term: TINF2
          term:
            id: hgnc:11824
            label: TINF2
        description: 'A gene-targeted mouse carrying the murine equivalent of TIN2 K280E, a dyskeratosis
          congenita cluster allele that falls inside the same 280-289 window as every reported Revesz
          variant. Homozygotes are inviable; heterozygotes are healthy in the first generation and develop
          mild pancytopenia and reduced fecundity only in the second and third, as bone marrow telomeres
          shorten across generations.

          It is the only in vivo model of a Revesz-window TINF2 allele. It is emphatically not a model
          of Revesz syndrome.'
        modeled_mechanisms:
        - target: Extreme Telomere Shortening
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Reproduces the central molecular consequence - progressive telomere attrition from
            a heterozygous DC-cluster TIN2 allele - and reproduces a mild haematopoietic phenotype downstream
            of it. It also produced the finding that the attrition is not solely telomerase-dependent,
            which the human system could not have shown.
          limitations: Laboratory mice begin with telomeres several times longer than human telomeres,
            so a single generation cannot reach a pathogenic length; the phenotype only appears after
            successive intercrosses, which is a breeding artefact with no human counterpart. The haematopoietic
            phenotype is mild pancytopenia in adult mice rather than the fatal infantile marrow failure
            of this disease. Neither the retinal nor the cerebral branch of the human pathograph was assessed
            - the paper reports no ophthalmic or neuroimaging examination - so this model says nothing
            about the two features that define Revesz syndrome, and its silence on them is untested rather
            than negative.
          readouts:
          - name: Bone marrow telomere length across successive generations
            target: Extreme Telomere Shortening
            direction: DECREASED
            interpretation: 'The core readout: telomeres in the haematopoietic compartment shorten progressively
              over generations in heterozygotes, the murine counterpart of the very short telomeres measured
              in patients.'
          - name: Peripheral blood counts in second- and third-generation heterozygotes
            target: Extreme Telomere Shortening
            direction: DECREASED
            interpretation: 'The haematopoietic consequence, and the point at which the model''s severity
              diverges sharply from the human disease: mild pancytopenia in later generations of adult
              mice versus universal marrow failure by age six in children.'
      selected_evidence:
        snippet: we generated mice with the equivalent of the TIN2 K280E DC allele (TIN2(DC)) by gene
          targeting
        supports: SUPPORT
