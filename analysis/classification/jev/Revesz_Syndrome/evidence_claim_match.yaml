      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant, usually de novo
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'Heterozygous TINF2 variants, dominant in mechanism but almost never inherited: every
          genetically characterised Revesz patient reported so far has arisen de novo from unaffected
          parents. That is a consequence of the disease rather than a property of the gene - children
          who die before six do not reproduce - and it distinguishes this presentation from TINF2 dyskeratosis
          congenita generally, which is transmitted through families.

          No de_novo_rate is recorded. Only twelve of the eighteen assembled patients were genotyped,
          parental testing is not documented for all of them, and a percentage computed on that basis
          would give a precision the source does not have.'
      selected_evidence:
        snippet: In contrast to classical DKC, all cases of RS represented de novo mutations with unaffected
          parents, reflecting the severe course and early death in this disease.
        supports: SUPPORT
