  da0ce00136e80a9f5b8b65b8c23b8d5713ea0d1e7a8d0c682c63d0fbfbf2ceb9:
    claim:
      about:
        disease:
          name: Revesz Syndrome
          disease_term:
            preferred_term: Revesz syndrome
            term:
              id: MONDO:0009990
              label: Revesz syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intracranial Calcification and Cerebrovascular Fragility
        biological_scale: TISSUE
        mechanism_confidence: HYPOTHETICAL
        description: 'Progressive intracranial calcification, most often in the basal ganglia and thalami,
          together with cerebellar hypoplasia and white matter change, and in a minority intracranial
          haemorrhage. Calcification was present in 85% of the Revesz patients imaged and cerebellar hypoplasia
          in 76%.

          The mechanism is inferred rather than shown, and the inference is drawn from a neighbour disease.
          Cerebroretinal microangiopathy with calcifications and cysts - Coats plus, caused by CTC1 -
          produces an almost identical combination of exudative retinopathy and intracranial calcification
          through a small-vessel angiopathy, which is the main reason calcification here is read as a
          microvascular rather than a metabolic process. The haemorrhages reported in three Revesz children
          point the same way. Nothing in the Revesz literature demonstrates it: there is no neuropathology
          series and no vascular study, so this node is tagged HYPOTHETICAL and names the imaging finding
          rather than a cell mechanism.

          Cerebellar hypoplasia is grouped here for anatomical convenience but is probably not the same
          process. It is present from the earliest imaging rather than progressive, which makes it a developmental
          consequence of the telomere defect rather than an acquired vascular one.'
        locations:
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: cerebellar hypoplasia (76%, n = 13/17) and intracranial calcifications (85%, n = 11/13)
          were common features
        supports: SUPPORT
