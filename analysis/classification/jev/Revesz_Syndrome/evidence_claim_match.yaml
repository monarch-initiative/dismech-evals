        name: Pulmonary Involvement and Respiratory Failure
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: 'Lung disease as the third organ consequence of the telomere defect. Pulmonary fibrosis
          is a well-established feature of the telomere biology disorders as a class - GeneReviews names
          it among the risks of DC/TBD and recommends annual pulmonary function testing from around age
          eight - and its mechanism, replicative failure of the alveolar epithelial progenitor compartment,
          is the same one that empties the marrow.

          What is documented in Revesz syndrome specifically is narrower and more acute: refractory lung
          failure was a cause of death in some of the assembled patients, including after transplantation,
          and the index case died of aspiration pneumonia with refractory lung failure. No pulmonary function
          series, imaging series or histology exists for this disease, so the node is tagged PROVISIONAL
          and is careful not to assert established fibrosis in children who mostly die before eight. It
          is curated because it is a cause of death and because it is the branch that survives a successful
          transplant.'
        locations:
