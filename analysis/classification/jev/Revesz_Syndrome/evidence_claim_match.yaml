  c6ef9673d63ec152719462dc3738235845c45f64baac105d34112cec8a9caa58:
    claim:
      about:
        disease:
          name: Revesz Syndrome
          disease_term:
            preferred_term: Revesz syndrome
            term:
              id: MONDO:0009990
              label: Revesz syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: revesz_is_a_severity_band_not_a_disease
        kind: CONTROVERSY
        status: OPEN
        prompt: Is Revesz syndrome a disease, or a severity band on TINF2 dyskeratosis congenita that
          two authorities have already voted to retire?
        attaches_to:
        - disease#Revesz Syndrome
        - phenotypes#Bilateral Exudative Retinopathy
        - genetic#TINF2
        rationale: 'The case for retiring the eponym is strong and comes from two independent directions.
          ClinGen''s Interstitial Lung Disease Gene Curation Expert Panel applied the Lumping and Splitting
          Working Group criteria in 2024 and merged Revesz syndrome into TINF2-related short telomere
          syndrome, finding no difference in molecular mechanism or inheritance from classical dyskeratosis
          congenita. Independently, a 2026 widefield angiography series found retinovascular abnormality
          in every eye of every telomere biology disorder patient examined, most of them asymptomatic,
          and proposed replacing the eponym with Short Telomere Associated Retinopathy. Add the Karremann
          review''s finding that genotype cannot define the syndrome, and the entity has no mechanistic,
          genetic or now even phenotypic boundary.

          The case for keeping a record is narrower but real. The natural history is categorically different
          - median survival 6.5 years against survival into adulthood in classical dyskeratosis congenita
          - and the retinal and cerebral branches of the pathograph are absent from the dismech Dyskeratosis
          Congenita entry, whose subtype list is keyed by gene and whose Subtype records cannot hold pathophysiology
          in any case. MONDO, OMIM and Orphanet all still carry the term, so a clinician or a pipeline
          will keep encountering it.

          This entry takes the position that curating the concept with the dispute attached is more useful
          than deleting it: a reader who arrives at MONDO:0009990 should find the lumping decision and
          the STAR proposal, not silence. If dismech later curates TINF2-related short telomere syndrome
          as an entity, this file should be reconsidered as a subtype of it.'
      selected_evidence:
        snippet: Patients with retinopathy have been termed Revesz syndrome until now, but with the advent
          of WF-FA, we show that the retinopathy is likely more prevalent than previously thought.
        supports: REFUTE
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42617951
      reference_title: 'Retinopathy in Dyskeratosis Congenita and Related Telomere Biology Disorders:
        Short Telomere Associated Retinopathy (STAR).'
      evidence_source: HUMAN_CLINICAL
      explanation: 'The ophthalmological argument against the eponym: the feature that defines it is not
        distinctive once imaged properly.'
