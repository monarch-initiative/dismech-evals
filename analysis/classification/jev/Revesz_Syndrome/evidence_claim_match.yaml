      assertion_type: Discussion
      assertion:
        discussion_id: tin2_dc_mechanism_dispute
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Do DC-cluster TIN2 variants shorten telomeres by failing to recruit telomerase, by causing
          a telomerase-independent replication defect, or by both?
        attaches_to:
        - pathophysiology#Impaired Shelterin-Mediated Telomere Maintenance
        - mechanistic_hypotheses#tin2_telomerase_recruitment_defect
        - mechanistic_hypotheses#tin2_telomere_replication_defect
        rationale: 'Two well-executed studies reach different answers, and the disagreement is real rather
          than apparent. Human-cell work shows DC-cluster TIN2 mutants losing telomerase association while
          end protection is intact, which is a recruitment defect. Mouse knock-in work shows the same
          class of allele accelerating telomere shortening with telomerase RNA deleted entirely, which
          a recruitment defect cannot produce, together with ATR signalling and fragile telomeres.

          The most likely resolution is that both operate, in different compartments - recruitment failure
          in telomerase-positive stem cells, replication failure in telomerase-negative somatic tissue
          - which is what the mouse authors themselves propose. If that is right it has a consequence
          for this disease specifically: a replication defect in telomerase-negative tissue would predict
          damage in slowly renewing compartments such as retinal endothelium, which is exactly where this
          syndrome differs from classical marrow-limited disease. Nobody has tested that prediction.'
      selected_evidence:
        snippet: These data suggest that this TIN2-DC mutation could induce telomeric dysfunction phenotypes
          in telomerase-negative somatic cells and tissues that further exacerbate the telomere maintenance
          problems in telomerase-positive stem cell compartments.
        supports: SUPPORT
