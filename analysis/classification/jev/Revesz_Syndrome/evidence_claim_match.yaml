  84c0fcd3fc1a2a33f6bc3d066db04e13bd22a7967e663c5641c2e6bbfd9fe023:
    claim:
      about:
        disease:
          name: Revesz Syndrome
          disease_term:
            preferred_term: Revesz syndrome
            term:
              id: MONDO:0009990
              label: Revesz syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Coats Plus Syndrome
        description: 'Cerebroretinal microangiopathy with calcifications and cysts, caused by biallelic
          CTC1 variants. It reproduces the Revesz combination of bilateral exudative retinopathy and intracranial
          calcification through a different telomere-maintenance gene, and the two were described in the
          literature as having key similarities before either gene was known.

          It is the most instructive differential in this file, because it shows the Revesz phenotype
          is reachable from a different lesion in the same pathway - which argues that the retinal and
          CNS branches are a property of severe telomere dysfunction rather than of TINF2. dismech does
          not yet curate Coats plus; the two entities should be decided together.'
        distinguishing_features:
        - Autosomal recessive CTC1 variants rather than dominant TINF2, and intracranial cysts and leukodystrophy
          in addition to calcification.
        - Telomere length is not necessarily reduced, which limits the value of telomere-length screening
          in distinguishing it.
        - Bone marrow failure, when it occurs, is later - adolescence or early adulthood rather than infancy
          - and gastrointestinal bleeding is prominent.
      selected_evidence:
        snippet: Early severe pediatric forms of TBDs with often characteristic underlying genetic variants
          are the Revesz syndrome, the Hoyeraal-Hreidarsson syndrome, and the Coats plus syndrome
        supports: SUPPORT
