      assertion_type: Pathophysiology
      assertion:
        name: Extreme Telomere Shortening
        biological_scale: CELLULAR
        description: 'Telomeres far below the first age-adjusted percentile - shorter, as a group, than
          in any other genetic subtype of dyskeratosis congenita. In the assembled Revesz cohort every
          patient with a measurement had a very short result, and in a large TINF2 series the telomere
          lengths were the shortest of all dyskeratosis congenita subtypes while telomerase RNA levels
          were normal, which localises the defect to the telomere rather than to the enzyme.

          This is the quantitative link between the genotype and the severity, and the reason telomere
          length by flow-FISH is the functional screening test for the disease. Below some threshold,
          replication-limited tissues stop being replenished; which tissues fail first is what the branches
          below describe.'
        biological_processes:
        - preferred_term: replicative senescence
          term:
            id: GO:0090399
            label: replicative senescence
          modifier: INCREASED
        - preferred_term: telomere maintenance via telomerase
          term:
            id: GO:0007004
            label: telomere maintenance via telomerase
          modifier: DECREASED
      selected_evidence:
        snippet: Telomere lengths in patients with TINF2 mutations were the shortest compared with other
          DC subtypes, but TERC levels were normal.
        supports: SUPPORT
