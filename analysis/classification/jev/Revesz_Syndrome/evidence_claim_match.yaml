      assertion:
        category: Respiratory
        name: Respiratory Failure
        description: 'Refractory respiratory failure, reported as a cause of death in some of the assembled
          patients including after transplantation, and the terminal event in the index case following
          aspiration pneumonia. No frequency band is assigned: the source says "some cases" without a
          count, and no pulmonary function or imaging data exist for this disease.

          Pulmonary fibrosis is the mechanism this represents in the telomere biology disorders generally,
          and GeneReviews recommends annual pulmonary function testing from around age eight. Whether
          these children live long enough to develop established fibrosis is not documented, so the phenotype
          is bound to respiratory failure rather than to fibrosis.'
        phenotype_term:
          preferred_term: Respiratory failure
          term:
