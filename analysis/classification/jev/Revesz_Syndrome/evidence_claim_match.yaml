        discussion_id: revesz_mouse_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Can any current model reproduce the retinal and CNS phenotypes that define Revesz syndrome?
        attaches_to:
        - animal_models#Mouse
        - pathophysiology#Retinal Peripheral Non-Perfusion and Exudative Vasculopathy
        rationale: 'The only in vivo model of a Revesz-window TINF2 allele is the TIN2(DC) knock-in mouse,
          and it models the wrong part of the disease. Its phenotype is mild pancytopenia appearing only
          in the second and third generations, because laboratory mice start with far longer telomeres
          than humans; first-generation heterozygotes are healthy and fertile. No ophthalmic or neuroimaging
          assessment is reported, so the model is silent rather than negative on the retinal and CNS branches.

          This is a HUMAN_MODEL_MISMATCH rather than a plain gap because a model does exist and is informative
          - it produced the telomerase-independent finding that the human system could not have - while
          being structurally unable to address the features that define the disease. Any model that could
          would need a short-telomere background, such as a late-generation telomerase-null mouse, or
          a human iPSC-derived retinal vascular system.'
      selected_evidence:
        snippet: Whereas homozygous TIN2(DC/DC) mice were not viable, first-generation TIN2(+/DC) mice
          were healthy and fertile.
        supports: SUPPORT
