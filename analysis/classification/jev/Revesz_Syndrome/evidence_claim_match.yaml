          The clinical genetics supports that reading rather than contradicting it. The recurrent R282H
          allele appears across probands with classical dyskeratosis congenita, with Revesz syndrome and
          with overlapping presentations, and the Karremann review states plainly that genotype alone
          cannot define Revesz syndrome. No modifier locus, second hit or environmental factor explaining
          who develops the retinal and CNS phenotype has been identified.'
      selected_evidence:
        snippet: Nevertheless, the same mutations in TINF2 may be found in classical DKC patients presenting
          clinically without the distinct RS phenotype, hence, the genotype alone is not able to define
          RS
        supports: SUPPORT
