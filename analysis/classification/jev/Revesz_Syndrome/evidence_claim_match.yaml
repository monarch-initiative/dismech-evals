  ef7a71a3fa412ebf827c3c7bf66525da1532877de9f8aa2dbae8cd17eaada035:
    claim:
      about:
        disease:
          name: Revesz Syndrome
          disease_term:
            preferred_term: Revesz syndrome
            term:
              id: MONDO:0009990
              label: Revesz syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TINF2 Exon 6 Cluster Variant
        biological_scale: MOLECULAR
        role: trigger
        description: 'A heterozygous germline TINF2 variant in a strikingly narrow window: every variant
          in genotyped Revesz patients has fallen in exon 6, between amino acids 280 and 289 of TIN2.
          The recurrent allele is c.845G>A, and the same residue - 282 - accounts for the majority of
          TINF2 dyskeratosis congenita variants generally. Frameshift alleles producing truncated TIN2
          occur in the same window.

          That window is the "dyskeratosis congenita cluster" of TIN2, and its constancy is the single
          most distinctive genetic fact about this disease. It is also the fact that most undermines Revesz
          as a separate entity: the identical variants are found in patients with classical dyskeratosis
          congenita who never develop the retinopathy. The founding TINF2 paper makes the point in its
          own data, reporting R282H across three unrelated probands of whom only one had Revesz syndrome.
          Genotype therefore cannot define this disease, and no modifier that does has been identified.'
        genes:
        - preferred_term: TINF2
          term:
            id: hgnc:11824
            label: TINF2
        genetic_context:
          gene:
            preferred_term: TINF2
            term:
              id: hgnc:11824
              label: TINF2
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: 'Heterozygous germline TINF2 variants confined to exon 6, amino acids 280-289;
            missense substitutions predominate, with frameshift alleles also reported. Almost always de
            novo. No functional_impact_category is recorded: the DC-cluster alleles are neither a clean
            loss of function nor a clean gain, and the two published mechanistic accounts of what they
            do to TIN2 disagree - see the mechanistic hypotheses below.'
      selected_evidence:
        snippet: Hence, all mutations were located between amino acid 280 and 289.
        supports: SUPPORT
    origin:
