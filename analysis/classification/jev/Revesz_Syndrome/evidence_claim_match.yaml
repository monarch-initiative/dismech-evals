  7d60906554a116f391ad07e6b60c05b650f397b9560f9737db61bf687b36bbfb:
    claim:
      about:
        disease:
          name: Revesz Syndrome
          disease_term:
            preferred_term: Revesz syndrome
            term:
              id: MONDO:0009990
              label: Revesz syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: TINF2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: TINF2
          term:
            id: hgnc:11824
            label: TINF2
        association: 'TINF2 encodes TIN2, the structural hub of the shelterin complex. Its link to this
          disease was established in the same 2008 paper that first connected shelterin to human disease
          at all, which reported TINF2 variants in classical dyskeratosis congenita probands and, for
          the first time, in a patient with Revesz syndrome. Every genotyped Revesz patient published
          since 2010 has carried a TINF2 variant in exon 6.

          The gene-disease relationship is not in doubt: ClinGen''s Interstitial Lung Disease Gene Curation
          Expert Panel rates TINF2 Definitive, having reached the maximum genetic evidence score. What
          is in doubt is the disease boundary. That same curation applied the ClinGen Lumping and Splitting
          Working Group criteria and lumped Revesz syndrome with autosomal dominant dyskeratosis congenita
          3, Hoyeraal-Hreidarsson syndrome and pulmonary fibrosis into one entity, TINF2-related short
          telomere syndrome, finding no difference in molecular mechanism or inheritance between them.

          The clinical genetics supports that reading rather than contradicting it. The recurrent R282H
          allele appears across probands with classical dyskeratosis congenita, with Revesz syndrome and
          with overlapping presentations, and the Karremann review states plainly that genotype alone
          cannot define Revesz syndrome. No modifier locus, second hit or environmental factor explaining
          who develops the retinal and CNS phenotype has been identified.'
      selected_evidence:
        snippet: TINF2 R282H in three additional unrelated DC probands, including one with Revesz syndrome
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
