      assertion_type: Treatment
      assertion:
        name: Allogeneic Hematopoietic Stem Cell Transplantation
        therapeutic_modality: CELL_THERAPY
        description: 'The only potentially curative treatment for the marrow failure, and the only intervention
          that has demonstrably changed survival in this disease. Eight of the eighteen assembled children
          were transplanted and four were alive at last follow-up, a median of 22 months afterwards.

          Conditioning matters more here than in most transplant indications. Alkylators and radiation
          damage the same DNA-repair-limited tissues the disease already compromises, so reduced-intensity,
          radiation-sparing regimens are used; the children in this series who received fludarabine, cyclophosphamide
          and anti-thymocyte globulin tolerated transplant without severe early toxicity. Transplantation
          corrects the haematopoietic branch of the pathograph and nothing else: the retinal, pulmonary
          and CNS branches continue, and refractory lung failure remains a cause of death after transplant.'
        treatment_term:
          preferred_term: hematopoietic cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
      selected_evidence:
        snippet: Stem cell transplantation (SCT) was performed in eight children, and after a median of
          22 months from SCT four of these patients were alive at the last follow up visit.
        supports: SUPPORT
