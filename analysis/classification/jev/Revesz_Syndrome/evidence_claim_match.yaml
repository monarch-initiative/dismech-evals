  5d2aa7ef611e908b78524c427b3cc2ae99610243048a44a80f076be07845c2b0:
    claim:
      about:
        disease:
          name: Revesz Syndrome
          disease_term:
            preferred_term: Revesz syndrome
            term:
              id: MONDO:0009990
              label: Revesz syndrome
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: IUISAssignment
      assertion:
        classification_value: bone marrow failure
        notes: 'IUIS 2022 phenotypic classification of inborn errors of immunity (Tangye et al., PMID:35748970),
          Table 9 "Bone marrow failure", the DKCA5 row of the dyskeratosis congenita block. The table
          gives that row as "DKCA5 TINF2 AD 268130". It names no eponym, so the identification runs through
          the OMIM number: 268130 is Revesz syndrome, and this entry carries both "DKCA5" and "dyskeratosis
          congenita, autosomal dominant 5" in its synonym list for exactly that reason. The row is therefore
          this disease under its OMIM-keyed label, not a separate entity. Two things this assignment does
          not claim. It does not claim IUIS treats Revesz as distinct from dyskeratosis congenita, since
          the row sits inside the DC block and shares its category cell; the parent entry Dyskeratosis
          Congenita carries the same value against the block as a whole. And it does not resolve the lumping
          question described in this entry''s description, where ClinGen would fold Revesz into TINF2-related
          short telomere syndrome; IUIS 2022 predates that call and lists the OMIM row as it stood.'
      selected_evidence:
        snippet: DKCA4 RTEL1 AD 616373 DKCA5 TINF2 AD 268130 DKCA6 ACD AD 616553
        supports: SUPPORT
    origin:
      assertion_path: /classifications/iuis_category
      evidence_path: /classifications/iuis_category/evidence/0
      context_paths:
