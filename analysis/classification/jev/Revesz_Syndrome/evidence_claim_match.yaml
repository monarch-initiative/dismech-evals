            term:
              id: MONDO:0009990
              label: Revesz syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Retinopathy of Prematurity
        description: Included because it is the misdiagnosis that has actually happened. Revesz syndrome
          presents with bilateral peripheral retinal non-perfusion in an infant, frequently one born preterm
          or small for gestational age, which is precisely the setting in which retinopathy of prematurity
          is expected. At least one child was treated with bilateral laser for presumed retinopathy of
          prematurity before the systemic diagnosis emerged, and others were managed as Coats disease
          or familial exudative vitreoretinopathy.
        distinguishing_features:
        - Cytopenias, growth restriction and nail or skin change accompanying the retinopathy, none of
          which belong to retinopathy of prematurity.
        - Progression or new exudative change after the window in which retinopathy of prematurity would
          be expected to stabilise.
      selected_evidence:
        snippet: We report the case of a 2-year-old male child, initially treated with bilateral laser
          photocoagulation for retinopathy of prematurity. He developed exudative changes in the right
          eye, presumed to be Coats disease.
        supports: SUPPORT
