  28229ce156f493be363d4fdf6696628ab5556a40a003abaff150409c88ab0ae0:
    claim:
      about:
        disease:
          name: Revesz Syndrome
          disease_term:
            preferred_term: Revesz syndrome
            term:
              id: MONDO:0009990
              label: Revesz syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: revesz_tissue_selectivity_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do the retina and the cerebral microvasculature fail catastrophically in these children
          when other carriers of the identical TINF2 variant develop classical dyskeratosis congenita?
        attaches_to:
        - pathophysiology#Retinal Peripheral Non-Perfusion and Exudative Vasculopathy
        - pathophysiology#Intracranial Calcification and Cerebrovascular Fragility
        - pathophysiology#TINF2 Exon 6 Cluster Variant
        rationale: 'This is the central unexplained fact of the disease. R282H appears in unrelated probands
          with classical dyskeratosis congenita, with Revesz syndrome, and with overlapping presentations,
          and the review that assembled the cohort states that genotype alone cannot define the syndrome.
          Something other than the TINF2 allele determines whether a child develops sight-destroying retinopathy
          and intracranial calcification in infancy.

          No candidate has been tested. Parentally inherited telomere length, a modifier locus, a second
          variant, and stochastic variation in how short telomeres are at conception are all plausible
          and none has been examined in a Revesz cohort - which, at eighteen patients across the whole
          literature, may be too small to examine any of them. The STAR finding partially dissolves the
          question for the retina by making retinopathy universal, but it does not touch the CNS branch,
          and it does not explain the difference in severity and age of onset.'
        proposed_experiments:
        - experiment_id: revesz_modifier_and_telomere_setpoint
          name: Parental telomere-length and modifier analysis across TINF2 carriers stratified by ocular
            phenotype
          description: Assemble TINF2 exon-6 carriers with and without early exudative retinopathy, measure
            telomere length in the probands and both parents, and sequence for modifier variants in telomere-maintenance
            and retinal-vascular genes. The design tests whether the Revesz phenotype tracks a shorter
            inherited telomere set point rather than a distinct lesion.
          would_support:
          - pathophysiology#Extreme Telomere Shortening
          supporting_outcome:
          - Carriers with the Revesz phenotype have shorter telomeres, or shorter parental telomeres,
            than genotype-matched carriers without it, in a dose-dependent relation to age of ocular onset.
          would_refute:
          - pathophysiology#Extreme Telomere Shortening
          refuting_outcome:
          - Telomere length is indistinguishable between carriers with and without the Revesz phenotype,
            which would place the determinant outside telomere length altogether.
        - experiment_id: revesz_retinal_endothelial_senescence
          name: Senescence and telomere phenotyping of retinal microvascular endothelium in telomere biology
            disorders
          description: Measure telomere length and senescence markers in retinal microvascular endothelial
            cells - from donor eyes, or from patient iPSC-derived retinal microvascular endothelium -
            and compare against a matched non-retinal endothelial bed, to test whether the retinal periphery
            is intrinsically more vulnerable to short telomeres than other vascular beds.
          would_support:
          - pathophysiology#Retinal Peripheral Non-Perfusion and Exudative Vasculopathy
          supporting_outcome:
          - Retinal microvascular endothelium shows shorter telomeres and higher senescence-marker burden
            than the comparator bed in the same patients, with peripheral retina worse than posterior
            pole.
          would_refute:
          - pathophysiology#Retinal Peripheral Non-Perfusion and Exudative Vasculopathy
          refuting_outcome:
          - No difference in telomere length or senescence between retinal and comparator endothelium,
            which would make peripheral non-perfusion a consequence of something other than endothelial
            replicative failure.
      selected_evidence:
        snippet: Nevertheless, the same mutations in TINF2 may be found in classical DKC patients presenting
          clinically without the distinct RS phenotype, hence, the genotype alone is not able to define
          RS
        supports: SUPPORT
