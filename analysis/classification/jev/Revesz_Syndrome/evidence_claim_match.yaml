        status: ALTERNATIVE
        description: 'A knock-in mouse carrying the equivalent of the TIN2 K280E dyskeratosis congenita
          allele shortens telomeres faster than controls even when telomerase RNA is deleted entirely,
          which is a result the recruitment model cannot produce: if the only defect were telomerase delivery,
          removing telomerase from both genotypes should abolish the difference. The same allele induces
          ATR signalling and a fragile-telomere phenotype, the signature of a replication problem at telomeric
          DNA.

          The authors'' own reading is that the two mechanisms compose - a replication defect in telomerase-negative
          somatic tissue on top of impaired telomerase action in stem cell compartments - which if correct
          would explain why so many different tissues fail. Recorded as ALTERNATIVE alongside the recruitment
          model rather than in place of it.'
