        context: []
      assertion_type: Treatment
      assertion:
        name: Retinal Laser Photocoagulation
        therapeutic_modality: DEVICE
        description: 'Ablation of the non-perfused peripheral retina to remove the ischaemic drive to
          neovascularisation. It is the primary ophthalmic treatment proposed in the only systematic series
          of telomere-disorder retinopathy, with anti-VEGF reserved for angiographically active eyes.

          The evidence is a case series with a proposed staging system, not a trial, and in the assembled
          Revesz cohort retinopathy still led to severe visual loss in most children despite treatment.
          What laser can plausibly do is preserve some vision if applied before the exudative and tractional
          stages, which is the argument for angiographic screening rather than for treating established
          disease.'
        treatment_term:
          preferred_term: laser photocoagulation
          term:
            id: NCIT:C217424
            label: Laser Photocoagulation
      selected_evidence:
        snippet: We propose a staging system and discuss management strategies, including laser photocoagulation
          as the primary treatment, with adjunctive anti-VEGF agents for vascularly active eyes and vitreoretinal
          surgery for vitreous hemorrhage and retinal detachment.
        supports: SUPPORT
