  bd69078f13c7ae401a1bc8858d0aadb801a1cfab02c3336322b7ea7996bfe173:
    claim:
      about:
        disease:
          name: Revesz Syndrome
          disease_term:
            preferred_term: Revesz syndrome
            term:
              id: MONDO:0009990
              label: Revesz syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Retinal Peripheral Non-Perfusion and Exudative Vasculopathy
        biological_scale: TISSUE
        mechanism_confidence: HYPOTHETICAL
        description: 'The lesion that gives the syndrome its name: a bilateral peripheral retinal vasculopathy
          - avascular peripheral retina, telangiectasia, microaneurysms and fluorescein leakage - progressing
          to exudation, neovascularisation, vitreous haemorrhage and tractional retinal detachment. Angiographically
          it is indistinguishable from familial exudative vitreoretinopathy, Coats disease and cicatricial
          retinopathy of prematurity, and children with Revesz syndrome have been treated for all three
          before the systemic diagnosis was made.

          The cellular mechanism is not established. The plausible account is that the retinal microvascular
          endothelium, a slowly renewing compartment, reaches replicative failure at the extremely short
          telomeres these patients carry, so peripheral capillaries drop out and the resulting ischaemia
          drives the exudative and neovascular sequence. No study has demonstrated that step - there is
          no telomere measurement, senescence marker or endothelial study in Revesz retina - so the node
          is tagged HYPOTHETICAL and describes the observed vascular lesion rather than the inferred cell
          biology.

          A 2026 widefield angiography series changed how this node should be read. Peripheral non-perfusion
          was present in 100% of 44 eyes across 22 telomere biology disorder patients, most of whom were
          asymptomatic and none of whom would previously have been called Revesz syndrome. On that evidence
          the retinal branch is not a Revesz-specific limb of the pathograph at all; it is a universal
          telomere-disorder limb that becomes symptomatic earliest and most severely in these children.'
        cell_types:
        - preferred_term: Retinal microvascular endothelial cell
          term:
            id: CL:0002585
            label: retinal blood vessel endothelial cell
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
      selected_evidence:
        snippet: For posterior segment findings, all eyes had some combination of peripheral non-perfusion
          (100%), microaneurysmal changes (63.6%), telangiectasias (54.5%), fluorescein leakage (54.5%),
          sclerotic vessels (40.1%), retinal hemorrhages (36.3%), exudates (27.3%), retinal neovascularization
          (13.6%), and tractional retinal detachment (9.1%).
        supports: SUPPORT
    origin:
