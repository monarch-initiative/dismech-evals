  4cddf250fb16481c5aae928afa861f4a0656aa9dded3f763c6807b24172f46e6:
    claim:
      about:
        disease:
          name: Reynolds Syndrome
          disease_term:
            preferred_term: Reynolds syndrome
            term:
              id: MONDO:0013276
              label: Reynolds syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: shared_upstream_mechanism_unknown
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Loss of Immune Tolerance to Pyruvate Dehydrogenase Complex E2
        - pathophysiology#Loss of Immune Tolerance to Centromere Protein B
        prompt: What shared upstream mechanism causes anti-PDC-E2 and anti-CENP-B autoimmunity to co-occur
          so much more often than chance?
        rationale: Candidate shared mechanisms exist and none is established as causal for the overlap.
          Shared HLA alleles (HLA-DQB1, HLA-DRB1, HLA-DQA1) and the non-HLA loci IRF5 and STAT4 are reported
          in both diseases, both are marked by elevated TGF-beta and IL-6, and antibodies in the overlap
          preferentially recognise CENP-C rather than CENP-B alone. But the HLA associations are explicitly
          not exclusive to either disease, and none of these has been shown to explain why the two diseases
          co-occur rather than simply being features each has separately. The pathograph therefore stops
          at two parallel arms rather than asserting a common upstream node. Establishing one is the main
          thing that would distinguish this entity from the coincidence of two common autoimmune diseases
          in a predisposed host.
      selected_evidence:
        snippet: The overlap group predominantly included patients with limited cutaneous SSc and had
          a higher prevalence of extrahepatic autoimmune diseases, particularly Sjögren's syndrome and
          Hashimoto's thyroiditis.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42256626
      reference_title: 'Systemic sclerosis and primary biliary cholangitis: a systematic review of case-control
        studies comparing isolated and overlapping disease phenotypes.'
      evidence_source: HUMAN_CLINICAL
      explanation: Documents the broader autoimmune excess that a shared upstream mechanism would need
        to account for.
