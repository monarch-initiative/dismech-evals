          thing that would distinguish this entity from the coincidence of two common autoimmune diseases
          in a predisposed host.
      selected_evidence:
        snippet: Both diseases are marked by elevated TGF-β (transforming growth factor-beta) and IL-6
          (Interleukin-6)
        supports: SUPPORT
