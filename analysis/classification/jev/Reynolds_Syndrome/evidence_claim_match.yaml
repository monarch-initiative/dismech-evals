  ec7c0769d1ba34fda5fe68e9bd3c9f2bc8183136efc25e6ddac934b47fa2d0b5:
    claim:
      about:
        disease:
          name: Reynolds Syndrome
          disease_term:
            preferred_term: Reynolds syndrome
            term:
              id: MONDO:0013276
              label: Reynolds syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lbr_causality_unresolved
        kind: KNOWLEDGE_GAP
        attaches_to:
        - genetic#LBR
        - mechanistic_hypotheses#lbr_laminopathy_model
        prompt: Is Reynolds syndrome a genetic laminopathy caused by LBR variants, or an autoimmune overlap
          in which the reported LBR variant is incidental?
        rationale: MONDO classifies Reynolds syndrome as a hereditary disease and OMIM (MIM#613471) attributes
          it to LBR, but the entire genetic claim rests on one patient with one heterozygous missense
          variant. The functional work in that report was done on patient fibroblasts and lymphoblastoid
          lines, not on the affected liver, and contemporaneous commentary in the same year stated explicitly
          that the pathogenicity claim remained to be demonstrated and that larger PBC and SSc series
          were needed. No replication has been reported. This matters for curation because it decides
          whether the entry's root cause is a nuclear-envelope defect or a break in immune tolerance.
      selected_evidence:
        snippet: It remains to be shown, however, that this is really the case by testing directly the
          liver and skin fibroblasts of the patient.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20800400
