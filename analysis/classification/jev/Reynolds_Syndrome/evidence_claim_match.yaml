      assertion_type: Phenotype
      assertion:
        category: Constitutional
        name: Milder systemic involvement than isolated systemic sclerosis
        description: 'Taken as a profile rather than a single finding: interstitial lung disease, digital
          ulcers, gastro-oesophageal reflux and musculoskeletal involvement are all less frequent than
          in SSc alone. This is not the same as a better prognosis -- some cohorts report more SSc-related
          mortality and more oesophageal varices -- so it is curated as an organ-involvement profile,
          not as a severity or outcome claim.'
      selected_evidence:
        snippet: Clinical manifestations such as ILD, digital ulcers, GERD and musculoskeletal involvement
          were less common in overlap patients compared with patients with SSc, supporting the notion
          of a milder systemic phenotype.
        supports: SUPPORT
