          term:
            id: CL:0000232
            label: erythrocyte
      selected_evidence:
        snippet: Rh(null) is a rare autosomal recessive disorder characterized by an absence of Rh antigens
          and a varying degree of hemolytic anemia and spherostomatocytosis.
        supports: SUPPORT
