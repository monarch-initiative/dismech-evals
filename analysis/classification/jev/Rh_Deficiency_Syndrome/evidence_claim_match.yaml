      assertion:
        name: Silent RH Haplotype (Amorph Type)
        biological_scale: MOLECULAR
        description: The rarer route, and a different kind of failure. A silent RHCE inherited in cis
          with a deleted RHD means the Rh polypeptides are simply never produced. Nothing is mis-assembled
          because there is nothing to assemble. Reported families are consanguineous, as expected for
          a phenotype this rare.
      selected_evidence:
        snippet: The deficiency of Rh proteins on red blood cells (RBCs) from individuals of the Rh(null)
          amorph type are the result of homozygosity for a silent RHCE in cis with a deleted RHD.
        supports: SUPPORT
    origin:
