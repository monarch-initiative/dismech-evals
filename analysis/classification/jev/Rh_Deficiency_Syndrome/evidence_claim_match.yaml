              label: Rh deficiency syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RHAG Loss of Function (Regulator Type)
        biological_scale: MOLECULAR
        description: The commoner route. Biallelic loss-of-function variants in RHAG remove the glycoprotein
          required to assemble and traffic the Rh complex, so the Rh antigens disappear even though the
          RH genes themselves are intact and their transcripts are made. This is a failure of assembly,
          and it is the route the RHAG-knockdown experimental model reproduces.
        molecular_functions:
        - preferred_term: ammonium channel activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0008519
            label: ammonium channel activity
      selected_evidence:
        snippet: Most frequently, Rhnull phenotypes are caused by homozygosity of an autosomal suppressor
          gene unlinked to the RH locus (Rhnull regulator or Rhmod types).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8563755
      reference_title: Candidate gene acting as a suppressor of the RH locus in most cases of Rh-deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the regulator type as the commoner route and that the responsible gene
        is unlinked to the RH locus, which is why Rh antigens can vanish while the RH genes are intact.
        It does not name the gene; the next item does.
