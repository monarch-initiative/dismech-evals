        notes: 'Encodes the Rh-associated glycoprotein, required for assembly and surface expression of
          the Rh complex. Biallelic loss of function causes the regulator type, the commoner form, in
          which Rh antigens are absent despite intact RH genes. Reported variants include missense changes
          in transmembrane segments and splice-site changes. Note the identifier: hgnc:10006, verified
          against the ontology. The source deep-research report gave HGNC:9881 for this gene, which does
          not resolve.

          Distinguish carefully from RHAG gain-of-function variants, which cause autosomal dominant overhydrated
          hereditary stomatocytosis. Same gene, opposite direction of effect, different inheritance, different
          disease.'
      selected_evidence:
        snippet: We report studies of two Japanese Rh(null) cases and describe three new missense mutations
          of RHAG, the locus that encodes Rh50 glycoprotein and modulates Rh antigen expression.
