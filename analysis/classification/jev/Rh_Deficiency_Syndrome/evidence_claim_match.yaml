            preferred_term: Rh Deficiency Syndrome
            term:
              id: MONDO:0019107
              label: Rh deficiency syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Absent or Severely Reduced Rh Membrane Complex
        biological_scale: MOLECULAR
        description: The convergence point. The Rh complex is not a single antigen but a multi-subunit
          assembly of Rh polypeptides with RhAG, CD47, LW, and glycophorin B, and in this disease the
          whole assembly is missing or greatly reduced. That the associated proteins disappear together
          with the Rh polypeptides is what makes this a membrane structural defect rather than a serological
          curiosity, and it has been shown experimentally that removing RhAG alone is sufficient to drag
          the associated proteins off the surface with it.
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
        biological_processes:
        - preferred_term: ammonium transmembrane transport by the Rh complex
          modifier: DECREASED
          term:
            id: GO:0072488
            label: ammonium transmembrane transport
      selected_evidence:
        snippet: The cultured red cells generated recapitulate the major alterations of native Rh(null)
          cells regarding antigen expression, membrane deformability, and gas transport function, providing
          the proof of principle for their use as model of Rh(null) syndrome and to investigate Rh complex
          biogenesis in human primary erythroid cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23417980
      reference_title: 'In vitro generated Rh(null) red cells recapitulate the in vivo deficiency: a model
        for rare blood group phenotypes and erythroid membrane disorders.'
      evidence_source: IN_VITRO
      explanation: PARTIAL, and the gap is worth naming rather than glossing. The source reports loss
        of GAS transport function, while the annotation on this node is ammonium transmembrane transport.
        RhAG carries both, so the observation is consistent with the annotation without being a measurement
        of it. Graded accordingly rather than asserted at full strength.
