      assertion_type: Pathophysiology
      assertion:
        name: SWI/SNF Chromatin Remodelling Complex Dysfunction
        conforms_to: germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in
          a Susceptible Cell
        biological_scale: MOLECULAR
        description: 'Loss of the SMARCB1 core subunit does not dismantle the BAF complex, which still
          assembles without it. What it destabilises is the complex''s chromatin occupancy: targeting
          to promoters and typical enhancers is impaired and the complex is redistributed away from the
          sites it normally maintains. The distinction matters, because it makes rhabdoid tumorigenesis
          an epigenetic mislocalisation defect rather than a loss of remodelling capacity.'
      selected_evidence:
        snippet: SMARCB1 (INI1/SNF5/BAF47), a core subunit of the SWI/SNF (BAF) chromatin-remodeling complex,
          is inactivated in the large majority of rhabdoid tumors, and germline heterozygous SMARCB1 mutations
          form the basis for rhabdoid predisposition syndrome.
        supports: SUPPORT
