            term:
              id: MONDO:0012252
              label: rhabdoid tumor predisposition syndrome 1
        context: []
      assertion_type: Genetic
      assertion:
        name: SMARCB1
        notes: Germline SMARCB1 alleles causing RTPS1 are predominantly truncating point and frameshift
          variants, intragenic deletions and duplications, and larger 22q11.2 deletions. Constitutional
          balanced translocations disrupting SMARCB1 are a rare cause that standard copy-number and sequencing
          panels miss, so structural variant analysis is warranted when those are negative. Allele position
          and type separate the rhabdoid and schwannomatosis phenotypes.
        gene_term:
          preferred_term: SMARCB1
          term:
            id: hgnc:11103
            label: SMARCB1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Comparison with germline SMARCB1 mutations in patients with rhabdoid tumors showed that
          the schwannomatosis mutations were significantly more likely to occur at either end of the gene
          and be nontruncating mutations (P < 0.0001).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/2
      context_paths:
      - /name
