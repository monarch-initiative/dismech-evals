      assertion_type: Pathophysiology
      assertion:
        name: Loss of BAF Complex ATPase Activity
        conforms_to: germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in
          a Susceptible Cell
        biological_scale: MOLECULAR
        description: SMARCA4 supplies the ATP hydrolysis that drives nucleosome repositioning. Its loss
          leaves an assembled but catalytically dead complex, a different molecular lesion from the complex
          destabilisation seen when the SMARCB1 core subunit is lost.
      selected_evidence:
        snippet: The complex consists of 10–15 subunits, including core subunits present in all variants
          of the complex, SMARCB1 (SNF5), SMARCC1 (BAF155), SMARCC2 (BAF170), and two mutually exclusive
          ATPase subunits, SMARCA4 (also known as BRG1) or SMARCA2 (also known as BRM).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
