      assertion:
        name: Failure of Enhancer-Mediated Differentiation
        biological_scale: CELLULAR
        description: Without ATP-dependent remodelling, lineage-specifying enhancers cannot be opened,
          and progenitor cells remain undifferentiated and proliferative.
      selected_evidence:
        snippet: Given the absence of genomic instability despite the rapidity by which SMARCB1 deficient
          cancers arise both in humans and mice, these findings collectively suggest that the initiation
          and progression of aggressive cancers caused by SMARCB1 loss may not arise due to effects upon
          genome integrity, but rather epigenetically via perturbation of transcriptional regulation.
        supports: SUPPORT
