        notes: Germline loss-of-function SMARCA4 alleles cause RTPS2. Tumours complete biallelic inactivation
          either by a somatic mutation or by loss of the wild-type allele, including loss of heterozygosity
          through uniparental disomy. Loss of SMARCA4 protein on immunohistochemistry is the practical
          diagnostic marker, since these tumours retain SMARCB1 staining and are otherwise indistinguishable
          from the SMARCB1-driven form.
        gene_term:
          preferred_term: SMARCA4
