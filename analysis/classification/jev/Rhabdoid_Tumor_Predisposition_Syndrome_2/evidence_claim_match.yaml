      - /disease_term
    evidence_metadata:
      reference: PMID:24853101
      reference_title: Mechanisms by which SMARCB1 loss drives rhabdoid tumor growth.
      evidence_source: OTHER
      explanation: Establishes SMARCA4 as one of the complex's two mutually exclusive ATPase subunits,
        distinct from the SMARCB1 core subunit. This is the structural basis for treating its loss as
        a catalytic defect rather than the targeting defect SMARCB1 loss produces.
