      assertion_type: Pathophysiology
      assertion:
        name: Sarcolemmal Fragility
        description: Obscurin targets ankyrin-B to the M-band. Without it, dystrophin is mislocalized
          at costameres, the subsarcolemmal microtubule network is disrupted, and the sarcolemma becomes
          fragile, so exercise damages the membrane more than in wild-type muscle. Shown in knockout mice;
          patient muscle shows reduced ankyrin-1 and ankyrin-2 by proteomics.
        biological_scale: CELLULAR
        conforms_to: sarcolemmal_fragility_myofiber_necrosis#Sarcolemmal Mechanical Fragility
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        notes: The two mouse studies disagree on how much a single Obscn knockout shows. PMID:23420875
          reports marked sarcolemmal fragility in obscurin knockouts, while PMID:31098411 describes the
          single knockout as benign and needed an Obsl1 co-deletion to reveal the membrane defect. OBSL1
          redundancy may also explain why patients are well between episodes.
      selected_evidence:
        snippet: In contrast, the decreased proteins impact extrasarcomeric cytoskeleton processes (ANK1
          and ANK2)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
