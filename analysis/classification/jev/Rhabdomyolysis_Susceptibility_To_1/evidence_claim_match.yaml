      assertion:
        name: Longitudinal Sarcoplasmic Reticulum Disorganization
        description: Without its obscurin anchor, sAnk1.5 is lost or mislocalized and the longitudinal
          sarcoplasmic reticulum around the myofibril is disorganized. In patient myoblasts the reticulum
          holds less calcium than control cells under starvation, which the authors attribute to less
          efficient calcium re-uptake or storage when metabolism is limited.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: calcium ion import into sarcoplasmic reticulum
          modifier: DECREASED
          term:
            id: GO:1990036
            label: calcium ion import into sarcoplasmic reticulum
        notes: The calcium-uptake binding records the authors' interpretation of a reduced reticulum calcium
          content in starved patient myoblasts. Uptake was not measured directly, so the decrease is inferred.
      selected_evidence:
        snippet: Patient cultured myoblasts appear more susceptible to starvation as evidenced by a greater
          decreased in sarcoplasmic reticulum Ca2+ content compared to control myoblasts.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
