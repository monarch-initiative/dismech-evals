              label: rhabdomyolysis, susceptibility to, 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rhabdo1_mouse_model_mismatch
        prompt: Why does obscurin loss cause trigger-dependent recurrent rhabdomyolysis in people, when
          obscurin-knockout mice show at most mild, mainly diaphragmatic exercise injury and no frank
          rhabdomyolysis?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Sarcolemmal Fragility
        - pathophysiology#Exercise-Induced Myofiber Breakdown
        - animal_models#Obscurin knockout mouse
        rationale: The membrane and sarcoplasmic reticulum defects proposed for the human disease come
          mainly from mice, where the paralog Obsl1 compensates for obscurin loss and the single knockout
          is mild. The only human functional readout is reduced sarcoplasmic reticulum calcium in starved
          patient myoblasts. Whether OBSL1 compensates less in human skeletal muscle, or the human trigger
          load is simply larger, is untested.
      selected_evidence:
        snippet: skeletal muscle-specific Obsl1 knockouts show a benign phenotype similar to obscurin
          knockouts
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
