              label: rhizomelic chondrodysplasia punctata
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Plasmalogen-Synthesis Enzyme Deficiency
        conforms_to: peroxisomal_metabolic_failure#Peroxisomal Biogenesis or Enzyme Defect
        description: Loss-of-function of a single ether-lipid biosynthetic enzyme — FAR1 (rate-limiting
          fatty-alcohol supply), GNPAT/DHAPAT (first acyltransferase step), or AGPS/alkyl-DHAP synthase
          (ether-bond formation) — blocks plasmalogen synthesis at a discrete step. Unlike RCDP1, the
          peroxisomal PTS2 import machinery is intact, so only the affected enzyme is lost and other PTS2-dependent
          functions (notably phytanic acid alpha-oxidation by phytanoyl-CoA hydroxylase) are preserved.
        genes:
        - preferred_term: FAR1
          term:
            id: hgnc:26222
            label: FAR1
        - preferred_term: GNPAT
          term:
            id: hgnc:4416
            label: GNPAT
        - preferred_term: AGPS
          term:
            id: hgnc:327
            label: AGPS
        biological_processes:
        - preferred_term: ether lipid biosynthetic process
          term:
            id: GO:0008611
            label: ether lipid biosynthetic process
          modifier: DECREASED
        cellular_components:
        - preferred_term: peroxisome
          term:
            id: GO:0005777
            label: peroxisome
      selected_evidence:
        snippet: Patients in the two other subgroups have been reported to be either deficient in the
          activity of DHAPAT (RCDP type 2) or alkyl-DHAP synthase (RCDP type 3) while no other abnormalities
          could be observed.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
