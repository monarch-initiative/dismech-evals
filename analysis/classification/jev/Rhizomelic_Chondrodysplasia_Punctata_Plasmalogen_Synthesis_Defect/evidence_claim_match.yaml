        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Preserved Phytanic Acid Alpha-Oxidation
        description: Because the lesion is a single ether-lipid enzyme downstream of peroxisomal matrix
          import, the PTS2 enzyme phytanoyl-CoA hydroxylase is still imported and functional, so phytanic
          acid alpha-oxidation is preserved and plasma phytanic acid is normal. This is the key biochemical
          fork distinguishing the single-enzyme forms (RCDP2/3/4) from the import-receptor forms RCDP1
          (PEX7) and RCDP5 (PEX5), in which loss of the PTS2 receptor knocks out both plasmalogen synthesis
          and phytanic alpha-oxidation.
        biological_processes:
        - preferred_term: fatty acid alpha-oxidation
          term:
            id: GO:0001561
            label: fatty acid alpha-oxidation
        chemical_entities:
        - preferred_term: phytanic acid
          term:
            id: CHEBI:16285
            label: phytanic acid
      selected_evidence:
        snippet: Patients in the two other subgroups have been reported to be either deficient in the
          activity of DHAPAT (RCDP type 2) or alkyl-DHAP synthase (RCDP type 3) while no other abnormalities
          could be observed.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
