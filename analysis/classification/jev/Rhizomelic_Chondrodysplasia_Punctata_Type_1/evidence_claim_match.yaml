              label: rhizomelic chondrodysplasia punctata type 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Selective PTS2 Import Failure
        conforms_to: peroxisomal_metabolic_failure#Peroxisomal Biogenesis or Enzyme Defect
        description: Loss of functional peroxin 7 (PEX7), the cytosolic PTS2 receptor, prevents import
          of the subset of peroxisomal matrix enzymes that carry the type-2 targeting signal. These enzymes
          are mislocalized to the cytosol and rendered non-functional, while PTS1-dependent import (mediated
          by PEX5) — including very-long-chain fatty acid beta-oxidation — remains largely intact. This
          selective import lesion distinguishes RCDP1 from the generalized matrix-import failure of the
          Zellweger spectrum.
        genes:
        - preferred_term: PEX7
          term:
            id: hgnc:8860
            label: PEX7
        molecular_functions:
        - preferred_term: peroxisome signal sequence receptor activity
          term:
            id: GO:0000268
            label: peroxisome signal sequence receptor activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: protein targeting to peroxisome
          term:
            id: GO:0006625
            label: protein targeting to peroxisome
          modifier: DECREASED
        cellular_components:
        - preferred_term: peroxisome
          term:
            id: GO:0005777
            label: peroxisome
      selected_evidence:
        snippet: PEX7, a candidate gene for RCDP identified in yeast, encodes the receptor for peroxisomal
          matrix proteins with the type-2 peroxisome targeting signal (PTS2).
        supports: SUPPORT
