              label: rhizomelic chondrodysplasia punctata type 5
        context:
        - path: /pathophysiology/1
          value:
            name: Selective PTS2 Import Failure
            conforms_to: peroxisomal_metabolic_failure#Peroxisomal Biogenesis or Enzyme Defect
            biological_scale: CELLULAR
            description: 'An isolated failure to import the three known PTS2-tagged peroxisomal matrix
              proteins: alkyl-DHAP synthase (AGPS), which makes the ether bond in plasmalogens; phytanoyl-CoA
              2-hydroxylase (PHYH), which performs phytanic-acid alpha-oxidation; and acetyl-CoA acyltransferase
              1 (ACAA1). Peroxisomes are otherwise assembled and PTS1 import is normal, so this is a targeted
              functional lesion rather than a general peroxisome biogenesis failure - which is why the
              disorder is an RCDP and not a Zellweger spectrum disorder. The node is deliberately named
              to match the corresponding node in the RCDP1 entry, since the two disorders converge on
              it from opposite sides of the same receptor pair.'
            cellular_components:
            - preferred_term: peroxisome
              term:
                id: GO:0005777
                label: peroxisome
            biological_processes:
            - preferred_term: protein targeting to peroxisome
              modifier: DECREASED
              term:
                id: GO:0006625
                label: protein targeting to peroxisome
            - preferred_term: protein import into peroxisome matrix
              modifier: DECREASED
              term:
                id: GO:0016558
                label: protein import into peroxisome matrix
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Plasmalogen (Ether Lipid) Deficiency
        description: Failure to import AGPS impairs ether-phospholipid synthesis. Notably the reduction
          is described as mild in these patients, and the surrogate marker GNPAT activity was also reduced
          - the pattern expected when the PTS2-targeted AGPS fails to reach the matrix.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: All RCDP types are characterized by low levels of plasmalogens
        supports: SUPPORT
