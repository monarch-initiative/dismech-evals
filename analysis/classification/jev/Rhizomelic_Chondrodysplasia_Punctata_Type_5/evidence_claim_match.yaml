            term:
              id: MONDO:0014743
              label: rhizomelic chondrodysplasia punctata type 5
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the PEX5 Long Isoform
        biological_scale: MOLECULAR
        description: PEX5 is transcribed as two isoforms. Both PEX5L and PEX5S recognize PTS1-tagged cargo,
          but only PEX5L serves as the co-receptor for PEX7-mediated import of PTS2-tagged cargo. The
          RCDP5 frameshift lies in exon 9, which is present only in the long transcript, so it removes
          PEX5L and leaves PEX5S intact. This is the whole mechanism of the disorder and the reason it
          is not a Zellweger spectrum disorder.
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          gene:
            preferred_term: PEX5
            term:
              id: hgnc:9719
              label: PEX5
          description: 'Homozygous frameshift in the PEX5L-specific exon 9 in all four reported patients
            from two independent families. The functional impact is isoform-selective rather than whole-gene:
            PEX5S is unaffected, which is why PTS1 import is preserved.'
        biological_processes:
        - preferred_term: protein import into peroxisome matrix
          modifier: DECREASED
          term:
            id: GO:0016558
            label: protein import into peroxisome matrix
      selected_evidence:
        snippet: PEX5 encodes two isoforms, PEX5L and PEX5S, and we show that the c.722dupA mutation,
          located in the PEX5L-specific exon 9, results in loss of PEX5L only.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26220973
      reference_title: A novel type of rhizomelic chondrodysplasia punctata, RCDP5, is caused by loss
        of the PEX5 long isoform.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the isoform-selective consequence of the variant.
