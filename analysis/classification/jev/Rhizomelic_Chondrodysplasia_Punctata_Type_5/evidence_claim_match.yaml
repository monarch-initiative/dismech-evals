      assertion_type: Discussion
      assertion:
        discussion_id: rcdp5_phenotypic_boundary
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Skeletal Dysplasia
        - disease#Rhizomelic Chondrodysplasia Punctata Type 5
        prompt: Is the milder, less consistently rhizomelic skeletal phenotype of RCDP5 a real property
          of the disorder, or an artefact of the single allele on which the entity was defined?
        rationale: 'All four described patients are homozygous for one frameshift in two families, so
          the entity''s clinical description and its genotype are entirely confounded. The reported phenotype
          - chondrodysplasia punctata in only two of four, mild humeral shortening in three, survival
          into the second decade - is milder than classic RCDP1 and would fit the nonclassic RCDP pattern.
          Whether that reflects the isoform lesion, this particular allele, or the two families is untestable
          on the published cohort. It matters for ascertainment: if RCDP5 is genuinely milder, patients
          are being missed, since a plasmalogen screen showing only mild reduction in a child without
          striking rhizomelia is unlikely to prompt PEX5 exon 9 sequencing.'
        proposed_experiments:
        - experiment_id: rcdp5_allelic_series
          name: Broader ascertainment of PEX5L-selective alleles
          description: Targeted analysis of PEX5 exon 9 in cohorts with a selective PTS2 import defect
            and no PEX7 variant, to determine whether other PEX5L-selective alleles exist and whether
            they reproduce the attenuated skeletal phenotype.
      selected_evidence:
        snippet: mild shortening of humeri in three patients, and chondrodysplasia punctata in two patients,
        supports: SUPPORT
