        relationship_type: CAUSATIVE
        presence: Present
        gene_term:
          preferred_term: PEX5
          term:
            id: hgnc:9719
            label: PEX5
        notes: PEX5 is the striking case of one gene giving two unrelated diseases according to which
          isoform an allele affects. Variants hitting both isoforms remove PTS1 import and cause a Zellweger
