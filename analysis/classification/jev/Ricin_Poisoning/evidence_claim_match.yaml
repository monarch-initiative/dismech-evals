      assertion_type: Diagnosis
      assertion:
        name: Ricinine measurement in blood, urine or postmortem tissue
        description: Ricinine is a minor pyridone alkaloid of the castor bean that is co-extracted with
          ricin and is measurable by LC-MS/MS. It is the workhorse confirmatory analyte, detected consistently
          in blood, urine and postmortem tissue in fatal cases. Two limits matter. It marks exposure to
          castor bean *product*, not to ricin, so a highly purified preparation may carry little or none;
          and its concentration does not track severity.
      selected_evidence:
        snippet: Ricinine was consistently detected in blood, urine, and postmortem tissues, supporting
          its role as a reliable biomarker of ricin exposure, although current evidence is insufficient
          to establish definitive correlations with poisoning severity or toxicokinetics.
        supports: SUPPORT
