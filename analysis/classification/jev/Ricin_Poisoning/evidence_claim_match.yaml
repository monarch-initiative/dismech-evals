            term:
              id: MONDO:0035511
              label: ricin poisoning
        context: []
      assertion_type: Treatment
      assertion:
        name: Early gastrointestinal decontamination
        description: Activated charcoal and gastric lavage within a day of ingestion, to reduce the toxin
          that is absorbed. Restricted by definition to the oral route and to the latent interval before
          symptoms establish. In the collected human series this was reported as very effective when given
          early, which is the strongest treatment claim anywhere in the human ricin literature - though
          it comes from an uncontrolled case collection, not a trial.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: gastrointestinal decontamination with activated charcoal and gastric lavage
          term:
            id: NCIT:C49236
