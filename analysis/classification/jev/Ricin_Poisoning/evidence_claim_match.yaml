  fecf570519f3298e1ec4c281bb970b576545a9d2e82cb304a8952237d94d6087:
    claim:
      about:
        disease:
          name: Ricin Poisoning
          disease_term:
            preferred_term: ricin poisoning
            term:
              id: MONDO:0035511
              label: ricin poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: host_genetic_modifiers_of_cellular_susceptibility
        kind: KNOWLEDGE_GAP
        prompt: Do the host genetic factors that determine cellular susceptibility to ricin translate
          into any difference in human clinical susceptibility?
        attaches_to:
        - pathophysiology#RTB Lectin Binding to Cell-Surface Galactosylated Glycoconjugates
        - pathophysiology#Retrograde Transport from the Golgi to the Endoplasmic Reticulum
        rationale: 'Cellular susceptibility to ricin has a real, mapped genetic architecture. Fucosylation
          controls it: losing the Golgi GDP-fucose transporter SLC35C1 or the fucosyltransferase FUT9
          makes diverse cell types resistant, and cells from a patient with inherited SLC35C1 deficiency
          are resistant too. Sialylation of Lewis X structures runs the same axis in the opposite direction
          - inactivating the responsible sialyltransferase sensitises cells, overexpressing it protects
          them. The retrograde-transport machinery is a second axis, with STX5 and its ER-targeting factor
          ASNA1 among the top hits conferring resistance in genome-wide screens.

          Every one of those results is a statement about cells. Whether any of it shifts the dose of
          ricin a person survives is untested, and probably untestable by design - human exposure is rare,
          accidental or deliberate, and the delivered dose is never known. The gap is worth recording
          precisely because the cell-level evidence is strong enough to be mistaken for a susceptibility
          claim. It is also the reason this entry has no `genetic:` section: these are modifiers of a
          toxicological process, not disease genes.'
        notes: The SLC35C1-deficient patient result is the closest thing to human data in this area, and
          it is an ex vivo cellular phenotype from a person with a congenital disorder of glycosylation,
          not an observation of ricin exposure in a person.
      selected_evidence:
        snippet: Inactivation of the sialyltransferase responsible for modifications of Lewis X (St3Gal4)
          increases the sensitivity of cells to ricin, whereas its overexpression renders cells more resistant
          to the toxin.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28925387
      reference_title: A vital sugar code for ricin toxicity.
      evidence_source: IN_VITRO
      explanation: The sialylation axis, in both directions.
