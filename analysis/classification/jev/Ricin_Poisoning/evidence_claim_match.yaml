      assertion_type: Discussion
      assertion:
        discussion_id: inhalational_syndrome_known_only_from_animals
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does the animal picture of inhalational ricinosis describe human inhalational ricin poisoning,
          given that no human case series exists to compare it against?
        attaches_to:
        - pathophysiology#Acute Lung Injury with Interstitial Pneumonia and Alveolar Edema
        - pathophysiology#Residual Pulmonary Fibrosis in Survivors
        rationale: 'Everything this entry records about the inhalational syndrome - the interstitial pneumonia,
          the neutrophil influx, the proteinaceous oedema, the progression to ARDS, the residual fibrosis
          in survivors - comes from mice, rabbits, rhesus macaques and swine. This is not the ordinary
          situation where an animal model stands in for a well-described human disease; there is no human
          description to stand in for.

          Two things make the mismatch substantive rather than formal. The models disagree among themselves:
          exposure method, breathing parameters, aerosol characteristics, ricin cultivar and purity, challenge
          dose and study duration all vary, and so do the species'' anatomy, cell biology and immunology,
          which is why the comparative review calls the pathology broadly similar rather than the same.
          And the chronic endpoint is the one most exposed to species choice - susceptibility to pulmonary
          fibrosis and the character of the fibrosis that develops are themselves properties of the strain,
          so "survivors may be left with fibrosis" is a claim whose truth may depend on which animal was
          asked.'
        notes: 'Recorded as `HUMAN_MODEL_MISMATCH` rather than `KNOWLEDGE_GAP` because the evidence is
          not absent - it is abundant, and its translational validity is the open question. Resolving
          it does not require a human challenge study: a harmonised multi-species protocol, or a documented
          human exposure with imaging and follow-up, would both narrow it.'
      selected_evidence:
        snippet: Methodological variation is evident, including method of exposure, breathing parameters
          during exposure, aerosol characteristics, sampling protocols, ricin cultivar, purity and challenge
          dose and study duration.
        supports: SUPPORT
    origin:
