      assertion_type: Environmental
      assertion:
        name: Ingestion of chewed or crushed castor seeds
        description: The commonest route in the published record, and the only one with a real human clinical
          literature. Castor is a widely grown ornamental and industrial crop, so seeds are freely available;
          toxicity requires the seed coat to be broken, because intact seeds resist digestion and can
          pass through unchanged. Exposure is usually accidental, sometimes self-harm.
        exposure_term:
          preferred_term: ingestion of ricin in castor seed
          term:
            id: ECTO:9001524
            label: exposure to Ricin
        food_source:
          preferred_term: castor bean
          term:
            id: FOODON:03310303
            label: castor bean
        exposure_classifications:
          hazard_agent_type:
          - classification_value: BIOLOGICAL
          exposure_route:
          - classification_value: ORAL
          exposure_duration:
          - classification_value: ACUTE
        notes: Bound to `ECTO:9001524` exposure to Ricin - an exact class, which all three route entries
          share. The route is carried by `exposure_classifications.exposure_route` rather than by the
          term, because ECTO's route-specific classes do not descend to ricin. An earlier draft of this
          entry bound `ECTO:0000537` exposure to toxin and recorded in this slot that no ricin class existed;
          that was wrong. `ECTO:9001524` is live, sits under exposure to organic compound, and reaches
          `ExO:0000002` exposure event, so it satisfies the `ExposureTerm` enum. It was missing from `cache/ecto/terms.csv`
          only because nothing in `kb/` had ever bound it - which is exactly why an absent cache row is
          not evidence that a term does not exist. `food_source` is the FOODON castor bean class, which
          is genuinely a class for the seed rather than for a prepared food, and correct here because
          the exposure is to the raw seed.
      selected_evidence:
        snippet: The questioning of patients and family made it possible to retrieve an history of castor
          seeds or castor oil ingestion
        supports: SUPPORT
