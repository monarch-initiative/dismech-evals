      assertion_type: Pathophysiology
      assertion:
        name: Pro-inflammatory Cytokine Release
        biological_scale: ORGANISM
        description: Stress-kinase activation in intoxicated cells, and in macrophages in particular,
          drives release of pro-inflammatory cytokines. Tumour necrosis factor alpha rises first, within
          hours and before any metabolic abnormality is measurable; over the following day the response
          broadens into a storm containing both pro- and anti-inflammatory mediators. This is the step
          that turns local cell death into systemic illness, and it accounts for fever, neutrophil recruitment
          and the vascular consequences below.
        biological_processes:
        - preferred_term: tumor necrosis factor production after ricin intoxication
          modifier: INCREASED
          term:
            id: GO:0032760
            label: positive regulation of tumor necrosis factor production
        - preferred_term: systemic inflammatory response to ricin
          modifier: INCREASED
          term:
            id: GO:0006954
            label: inflammatory response
        cell_types:
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
      selected_evidence:
        snippet: Within the first hours following injection, while still normoglycemic, lymphopenia and
          pro-inflammatory cytokine secretion were observed, particularly tumor necrosis factor (TNF)-α.
          The cytokine response evolved over the next day into a complex storm of both pro- and anti-inflammatory
          cytokines.
        supports: SUPPORT
