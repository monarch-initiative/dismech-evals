  4e957c72b1eb2e712c4fac2ffcc07e54b238c4b2107a49f1608a3b20ee43b2d3:
    claim:
      about:
        disease:
          name: Ricin Poisoning
          disease_term:
            preferred_term: ricin poisoning
            term:
              id: MONDO:0035511
              label: ricin poisoning
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Direct identification of ricin in serum or body fluid by LC-MS/MS
        description: Ricinine reports castor bean exposure; this reports the toxin itself. A lactose-agarose
          lectin capture followed by tryptic digestion and targeted LC-MS/MS identifies ricin down to
          5 ng/mL in serum within about two and a half hours, without antibodies. It has been run on a
          real case, finding toxin in abdominal fluid 72 hours after self-injection of a castor bean extract
          - a wider window than previously documented. A faster, field-deployable ambient-MS screen detects
          the co-extracted small molecules ricinoleic acid and ricinine instead, in about two minutes,
          and so answers the same question as the ricinine assay rather than this one.
        notes: 'A third confirmatory route is deliberately absent. A reverse transcription-ligase-PCR
          assay reads out the depurinated 28S rRNA itself (`DOI:10.1007/s11419-017-0377-6`, Forensic Toxicology
          2018), which would be the one diagnostic that measures this entry''s own central pathophysiology
          node rather than a surrogate. It is not curated because it cannot be: the paper has no PubMed
          record, and its cached entry carries `content_type: unavailable` with no retrievable abstract,
          so no exact quote exists to support an evidence item. Adding it with a paraphrased snippet would
          be the fabrication the evidence rules exist to prevent. It should be added the moment a quotable
          record becomes available.'
      selected_evidence:
        snippet: This enables ricin identification down to 5 ng/mL in serum samples in 2.5 h.
        supports: SUPPORT
    origin:
