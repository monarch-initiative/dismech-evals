              id: MONDO:0035511
              label: ricin poisoning
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: VARIABLE
        rationale: The route of exposure, not the severity of the illness, is what this level records.
          Most ingestion cases recover fully with supportive care, and only six of fifty published cases
          died; inhalational and parenteral exposures have lethal doses roughly three orders of magnitude
          lower, and untreated severe exposure by any route reaches shock and multi-organ failure within
          one to three days with no antidote available. No single low, moderate or high level is representative
          of that spread, which is what `VARIABLE` is for.
        notes: '`HIGH` is defensible on the strength of the mortality-risk clause in its own definition,
          and an earlier draft used it. It was changed because the route-dependence here is the clinically
          important fact rather than a complication of stating one, and because the rest of this entry
          works to preserve that distinction - three separately stratified `environmental:` entries and
          a `HUMAN_MODEL_MISMATCH` discussion about the inhalational syndrome being known only from animals.
          A single level would flatten the one thing the entry is most careful about.'
      selected_evidence:
        snippet: The available evidence suggests a relatively consistent clinical course, characterized
          by rapid progression from mild, nonspecific gastrointestinal symptoms to hypovolemic shock,
          multi-organ failure, and refractory cardiovascular collapse.
        supports: SUPPORT
    origin:
      assertion_path: /clinical_burden
      evidence_path: /clinical_burden/evidence/0
