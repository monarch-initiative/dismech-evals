        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Toxin-induced wide-complex tachycardia
        description: 'A patient presenting with a wide-complex tachycardia and no structural heart disease
          will be worked up as a primary arrhythmia. Ricin belongs in that differential: the one reported
          case converted only after prolonged supportive care, having failed cardioversion and amiodarone,
          and the authors liken the mechanism to digitalis intoxication and catecholaminergic polymorphic
          ventricular tachycardia.'
        distinguishing_features:
        - A preceding gastrointestinal prodrome - severe nausea, vomiting and diarrhoea - rather than
          an arrhythmia arising without warning.
        - Failure of electrical cardioversion and amiodarone, in a heart with no structural disease.
      selected_evidence:
        snippet: This case underscores the importance of recognizing rare toxin-induced arrhythmias in
          the differential diagnosis of wide-complex tachycardias
        supports: SUPPORT
