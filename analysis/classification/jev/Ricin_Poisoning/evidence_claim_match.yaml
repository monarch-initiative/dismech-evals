  6484b39a832094cef59349132a3109ce30cb9a5c4fd8258b75c100521f748de1:
    claim:
      about:
        disease:
          name: Ricin Poisoning
          disease_term:
            preferred_term: ricin poisoning
            term:
              id: MONDO:0035511
              label: ricin poisoning
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Infectious gastroenteritis and sepsis
        description: The ingestion syndrome is an acute gastroenteritis progressing to shock, which is
          exactly how Salmonella or Shigella enteritis and septic shock of any cause present. Without
          an exposure history there is nothing in the early clinical picture to separate them.
        distinguishing_features:
        - Ricinine detectable in blood or urine establishes castor bean exposure and is not produced by
          any infection.
        - A history of chewing castor seeds, or of handling castor mash, has no counterpart in enteric
          infection.
        notes: 'Deliberately short, and covering the shock-like syndromes as one group rather than contrasting
          ricin with each named infection individually. The systematic review names the differential at
          that level of generality and no reference cited here makes the pairwise comparisons, so making
          them would be asserting clinical teaching without a source.

          The biothreat differential that toxicology references usually list alongside ricin - tularemia,
          Q fever, staphylococcal enterotoxin B, phosgene - is not recorded here for the same reason.
          It reaches this entry only through a StatPearls chapter, and PubMed searches for a peer-reviewed
          source that makes those comparisons for ricin specifically returned nothing usable. It is a
          genuine gap rather than a considered exclusion, and closing it needs a source, not a rewrite.'
      selected_evidence:
        snippet: the differential diagnosis with other septic shock-like syndromes
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
