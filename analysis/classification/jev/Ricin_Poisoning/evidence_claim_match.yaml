      assertion:
        name: Anti-ricin antibody passive immunotherapy
        description: 'Investigational, and the only post-exposure approach with efficacy shown in a large
          animal model at clinically relevant times. Equine F(ab'')2 antitoxin protected more than 80%
          of swine given it eighteen hours after lethal intratracheal or intramuscular exposure. High-affinity
          monoclonal antibodies against both ricin isoforms are the newer generation: RicE5 gave over
          90% survival in mice treated six hours after an intranasal challenge and 35% at twenty-four
          hours. Nothing in this class is approved for human use.'
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: passive immunization with anti-ricin antibody
          term:
            id: NCIT:C15259
            label: Passive Immunization
          therapeutic_agent:
          - preferred_term: anti-ricin monoclonal antibody
            term:
              id: NCIT:C20401
              label: Monoclonal Antibody
      selected_evidence:
        snippet: While administration of the antitoxin at 18 h post-exposure protected more than 80% of
          both intratracheally and intramuscularly ricin-intoxicated swine, treatment at 24 h post-exposure
          protected 58% of the intramuscular-exposed swine, as opposed to 26% of the intratracheally exposed
          animals.
        supports: SUPPORT
