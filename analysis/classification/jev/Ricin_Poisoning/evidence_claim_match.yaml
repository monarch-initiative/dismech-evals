      assertion_type: Pathophysiology
      assertion:
        name: Cytokine-Mediated Suppression of Hepatic Glucose-6-Phosphatase
        biological_scale: MOLECULAR
        description: A separate lethal mechanism layered on top of direct cytotoxicity, described only
          in parenterally exposed mice. Hepatic glucose-6-phosphatase RNA and protein fall rapidly and
          persistently, glucose-6-phosphate drops and glycogen accumulates - the biochemical signature
          of blocked glucose output - and the animals become profoundly hypoglycaemic before any other
          laboratory abnormality appears. Blood glucose fell even in animals whose beta cells had been
          destroyed with streptozotocin, which argues against an insulin-driven explanation.
        notes: Model-organism only, and deliberately not promoted to a human phenotype. The paper notes
          hypoglycaemia has been observed but not commented on in porcine and human intoxication, which
          is an observation about the literature rather than a human finding, so the phenotype below is
          graded `MODEL_ORGANISM` and carries no human frequency.
      selected_evidence:
        snippet: In the liver, we observed a rapid and persistent decrease in the expression of glucose-6-phosphatase
          (G6Pase) RNA and protein levels, accompanied by a drop in glucose-6-phosphate and increase in
          glycogen.
        supports: SUPPORT
    origin:
