      assertion_type: Discussion
      assertion:
        discussion_id: hypoglycemia_human_status
        kind: KNOWLEDGE_GAP
        prompt: Is ricin-induced hypoglycaemia a feature of human poisoning, or an artefact of the murine
          parenteral model?
        attaches_to:
        - pathophysiology#Cytokine-Mediated Suppression of Hepatic Glucose-6-Phosphatase
        - phenotypes#Hypoglycemia
        rationale: 'In mice, parenteral ricin causes profound hypoglycaemia that is the only laboratory
          abnormality for hours, and the mechanism has been worked out to the level of hepatic glucose-6-phosphatase
          suppression with a streptozotocin control ruling out an insulin-mediated route. That is a more
          complete mechanistic account than most of this entry carries.

          The positive human evidence is one clinical report that mentions hypoglycaemia without indicating
          whether anything was done about it. If the finding is real in humans it would be a cheap early
          marker of systemic exposure in exactly the situation - suspected deliberate poisoning, no exposure
          history - where the diagnosis is hardest. If it is murine, the phenotype recorded here should
          eventually be retired. Retrospective review of glucose values in published human cases would
          settle it without any new exposure, and the authors report that their own follow-up with those
          papers'' authors failed.

          The mouse result is not unopposed. The same authors did not see hypoglycaemia in macaques exposed
          to aerosolised ricin, and note that inflammatory responses in mice and humans broadly differ.
          That negative changes both species and route at once, so it isolates neither - but it is why
          this reads as an open question rather than as a human finding awaiting measurement.'
      selected_evidence:
        snippet: At least one clinical report of ricin toxicosis describes hypoglycemia, but does not
          indicate whether specific measures were taken to control the low blood glucose in this patient
        supports: SUPPORT
        directness: INDIRECT
