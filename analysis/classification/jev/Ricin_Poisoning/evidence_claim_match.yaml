      assertion_type: Pathophysiology
      assertion:
        name: Residual Pulmonary Fibrosis in Survivors
        biological_scale: TISSUE
        description: Survivors of pulmonary ricin exposure do not necessarily return to normal. Mice that
          recovered from a sublethal challenge carried lasting fibrotic lesions, and mice rescued from
          a lethal challenge by antitoxin showed moderate fibrosis, increased lung hyperpermeability and
          decreased lung compliance a month later. Whether the same holds in human survivors is unknown
          - no human follow-up data exist.
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
      selected_evidence:
        snippet: Significant pulmonary sequelae were demonstrated in surviving antitoxin-treated mice,
          as reflected by prominent histopathological changes, moderate fibrosis, increased lung hyperpermeability,
          and decreased lung compliance.
        supports: SUPPORT
