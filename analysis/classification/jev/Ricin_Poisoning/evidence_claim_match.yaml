      assertion_type: AnimalModel
      assertion:
        name: Murine intramuscular ricin intoxication
        species: Mouse
        publication: PMID:31208156
        description: Lethal intramuscular ricin in mice, used to characterise the systemic rather than
          the mucosal face of the disease. It reproduces the coagulopathy, thrombocytopenia and multi-organ
          haemorrhage of parenteral human poisoning and adds structural cardiac injury with measurable
          functional impairment.
        modeled_mechanisms:
        - target: Endothelial Glycocalyx Shedding and Microvascular Hyperpermeability
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The model is where the glycocalyx-shedding account of systemic ricin poisoning
            was established, alongside swine.
          limitations: Mouse, and a single lethal bolus dose by a route that in humans is documented in
            essentially one case. Whether human parenteral poisoning shows the same glycocalyx kinetics
            is untested.
          readouts:
          - name: Circulating heparan sulfate, hyaluronic acid and syndecan-1
            target: Endothelial Glycocalyx Shedding and Microvascular Hyperpermeability
            direction: INCREASED
            interpretation: Shed glycocalyx components measured in blood as the direct readout of the
              node.
      selected_evidence:
        snippet: The present study applies various biochemical, hematological, histopathological, molecular,
          and functional approaches to broadly investigate the systemic effects of parenteral intoxication
          by a lethal dose of ricin in a murine model.
        supports: SUPPORT
