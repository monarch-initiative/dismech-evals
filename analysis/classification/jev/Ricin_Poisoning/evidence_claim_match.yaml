              id: MONDO:0035511
              label: ricin poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Acute Lung Injury with Interstitial Pneumonia and Alveolar Edema
        biological_scale: TISSUE
        description: The inhalational lesion. Airway and alveolar epithelium and alveolar macrophages
          die, a local cytokine storm recruits neutrophils in large numbers, the vasculature becomes hyperpermeable,
          and proteinaceous fluid fills the alveoli and pleural space. The picture is acute lung injury
          and can progress to acute respiratory distress syndrome; in lethal animal exposures the damage
          stays largely confined to the lung and death is from respiratory insufficiency rather than from
          distant organ failure.
        notes: Human inhalational ricin poisoning has essentially no clinical literature - no case series
          exists - so this node is supported entirely by rodent, non-human-primate and swine work and
          is graded `MODEL_ORGANISM` throughout. That is a real limitation of the evidence, not a curation
          shortcut.
        cell_types:
        - preferred_term: pulmonary alveolar type 2 cell
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
        - preferred_term: infiltrating neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
      selected_evidence:
        snippet: We show that in the short-term, sublethal exposure of mice to ricin resulted in acute
          lung injury, including interstitial pneumonia, cytokine storm, neutrophil influx, edema and
          cellular death.
        supports: SUPPORT
