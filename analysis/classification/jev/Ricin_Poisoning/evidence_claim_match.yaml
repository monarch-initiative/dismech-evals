      assertion_type: Pathophysiology
      assertion:
        name: Depurination of the Sarcin-Ricin Loop of 28S rRNA
        biological_scale: MOLECULAR
        description: The catalytic lesion. The A chain is an rRNA N-glycosidase (EC 3.2.2.22) that hydrolyses
          the N-glycosidic bond of one universally conserved adenine - A4324 in the rat numbering - in
          the sarcin-ricin loop of 28S rRNA within the 60S subunit. The phosphodiester backbone is left
          intact; a single base is removed. Because the enzyme turns over rather than being consumed,
          one molecule inactivates ribosomes at a rate estimated above 1,500 per minute, and the lesion
          is irreversible for the affected ribosome.
        molecular_functions:
        - preferred_term: rRNA N-glycosidase activity of the ricin A chain
          term:
            id: GO:0030598
            label: rRNA N-glycosylase activity
      selected_evidence:
        snippet: Ribosome-inactivating proteins (RIPs) including ricin, Shiga toxin, and trichosanthin,
          are RNA N-glycosidases that depurinate a specific adenine residue (A-4324 in rat 28S ribosomal
          RNA, rRNA) in the conserved α-sarcin/ricin loop (α-SRL) of rRNA.
        supports: SUPPORT
