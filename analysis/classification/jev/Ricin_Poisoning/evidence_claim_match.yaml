              label: ricin poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ricin Delivery to Host Tissue
        biological_scale: ORGANISM
        description: The exposure event. Ricin-containing material reaches host tissue by one of four
          routes - ingestion of chewed or crushed castor seeds, inhalation of aerosolised toxin or seed
          dust, parenteral injection, and rarely ocular or abraded-skin contact. The molecular mechanism
          that follows is identical whichever route delivers the toxin; what differs is the dose that
          reaches the circulation and the tissue that receives the highest local burden, which is why
          lethal doses by inhalation and injection are roughly a thousandfold lower than by mouth.
        notes: 'Carries no ontology-bound process descriptor: the node denotes an exposure event rather
          than a host biological process. The exposures themselves are grounded in the `environmental:`
          block, which splits them by route.'
        chemical_entities:
        - preferred_term: ricin holotoxin
          term:
            id: CHEBI:8852
            label: Ricin
      selected_evidence:
        snippet: Exposure to ricin can occur by oral ingestion, inhalation or parenteral intoxication,
          while the features and severity of ricin toxicity vary markedly with the route of exposure.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
