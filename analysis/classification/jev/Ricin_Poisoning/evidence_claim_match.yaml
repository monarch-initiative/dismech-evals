      assertion_type: AnimalModel
      assertion:
        name: Murine pulmonary ricinosis
        species: Mouse
        publication: PMID:38773158
        description: Intranasal or aerosolised ricin in mice, at sublethal or lethal doses. This is the
          principal model for the inhalational syndrome, and essentially the only source of information
          about it, since human inhalational poisoning has no published case series.
        modeled_mechanisms:
        - target: Acute Lung Injury with Interstitial Pneumonia and Alveolar Edema
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Reproduces the full lesion - interstitial pneumonia, local cytokine storm, neutrophil
            influx, oedema and epithelial death - with measurable loss of lung function.
          limitations: 'Fidelity to the human disease cannot be assessed, because there is no human inhalational
            case series to compare it against. The inhalation models also differ among themselves: exposure
            method, aerosol characteristics, ricin cultivar and purity, dose and species all vary, and
            the review of them says the resulting pathology is broadly similar rather than identical.'
          readouts:
          - name: Lung histopathology and physiological function
            target: Acute Lung Injury with Interstitial Pneumonia and Alveolar Edema
            direction: ALTERED
            interpretation: Paired structural and functional readout of the acute lung injury node.
        - target: Residual Pulmonary Fibrosis in Survivors
          relationship: RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: The only evidence anywhere that survivors of pulmonary ricin exposure carry long-term
            damage.
          limitations: Fidelity is marked LOW because susceptibility to pulmonary fibrosis, and the character
            of the fibrosis that develops, differ by species and strain - which the inhalation-model review
            names explicitly as a reason to choose the model carefully for chronic work. There is no human
            counterpart at all.
      selected_evidence:
        snippet: the purpose of current study was to assess short- and long-term effects on physiological
          parameters and function following sublethal pulmonary exposure
        supports: SUPPORT
