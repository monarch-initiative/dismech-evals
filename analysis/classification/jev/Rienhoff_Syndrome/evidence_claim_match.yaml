    evidence_metadata:
      reference: PMID:23824657
      reference_title: A mutation in TGFB3 associated with a syndrome of low muscle mass, growth retardation,
        distal arthrogryposis and clinical features overlapping with Marfan and Loeys-Dietz syndrome.
      evidence_source: HUMAN_CLINICAL
