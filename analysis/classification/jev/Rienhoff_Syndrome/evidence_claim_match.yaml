          ARVD1.'
        distinguishing_features:
        - ARVD1 is caused by regulatory (untranslated-region) TGFB3 variants that increase promoter/UTR
          activity, whereas Rienhoff syndrome is caused by coding-region variants altering the ligand
          itself.
        - ARVD1 presents with right ventricular fibrofatty replacement, ventricular arrhythmia and sudden
          death, without the craniofacial, skeletal or aortic-aneurysm features of Rienhoff syndrome.
      selected_evidence:
        snippet: We identified TGFbeta3 as the disease gene involved in ARVD1.
        supports: SUPPORT
