              label: Rienhoff syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TGFB3 Ligand Variant
        biological_scale: MOLECULAR
        description: Heterozygous variants in TGFB3 alter the transforming growth factor beta 3 ligand.
          The index p.Cys409Tyr substitution removes the penultimate cysteine of the mature ligand, a
          residue conserved across the whole TGF-beta family that forms the cysteine knot required for
          ligand activity. Other reported alleles cluster in the latency-associated peptide domain (p.Arg300Gln,
          p.Arg300Gly). This is the conserved genetic trigger for the syndrome.
        biological_processes:
        - preferred_term: transforming growth factor beta receptor signaling pathway
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: ABNORMAL
        genetic_context:
          gene:
            preferred_term: TGFB3
            term:
              id: hgnc:11769
              label: TGFB3
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: 'Heterozygous TGFB3 ligand alleles. Recorded as PARTIAL_LOSS_OF_FUNCTION: the founding
            allele is hypomorphic, reducing canonical and non-canonical TGF-beta signalling. Co-expression
            with wild-type ligand in Xenopus also showed a dominant-negative effect, so some alleles may
            act by more than one mechanism; the hypomorphic reading is the one the authors adopt for the
            phenotype.'
      selected_evidence:
        snippet: A de novo mutation in TGFB3 was identified by exome sequencing.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
