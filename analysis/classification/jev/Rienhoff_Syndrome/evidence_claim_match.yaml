        status: ALTERNATIVE
        description: In the index patient the TGFB3 p.Cys409Tyr allele encoded a signalling-dead ligand
          that acted as a dominant negative, reducing canonical and non-canonical TGF-beta signalling.
          Under this model the phenotype (hypomyoplasia, growth retardation, distal arthrogryposis, bifid
          uvula, no vascular disease) follows from insufficient TGFB3 activity during mesenchymal development.
          Recorded as ALTERNATIVE relative to the aortopathy model not because the evidence is weaker
          - it is direct functional evidence - but because it is the minority explanatory model within
          the Loeys-Dietz framing and applies to a different allele class and tissue compartment.
      selected_evidence:
        snippet: We conclude that the mutant allele encodes a TGFB3 ligand that is not functional.
        supports: SUPPORT
