        name: Gene dosage effect (homozygous state)
        inheritance_term:
          preferred_term: Semidominant inheritance
          term:
            id: HP:0032113
            label: Semidominant inheritance
        description: Although the disorder is autosomal dominant, a single reported homozygous patient
          had a more severe phenotype than her heterozygous relatives, indicating a gene-dosage effect
          rather than a strictly dominant all-or-none mechanism. A separate homozygous exon 2-7 deletion
          patient likewise presented with severe disease including cleft palate. Both are single observations
          and should not be treated as an established recessive form.
      selected_evidence:
        snippet: Our cohort included the first described homozygous patient, who presented with a more
          severe phenotype compared to her heterozygous relatives.
        supports: SUPPORT
