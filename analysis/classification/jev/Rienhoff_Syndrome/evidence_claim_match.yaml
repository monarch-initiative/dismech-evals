        description: 'A mechanistically and clinically distinct disease caused by variants in the same
          gene. ARVD1 arises from TGFB3 *regulatory* variants in the untranslated regions that increase
          TGFB3 expression, and manifests as fibrofatty replacement of right ventricular myocardium with
          arrhythmia and sudden-death risk - not as a connective tissue or aortic disorder. Included here
          as a curation guard: TGFB3 gene-disease assertions must be attributed to the correct entity,
