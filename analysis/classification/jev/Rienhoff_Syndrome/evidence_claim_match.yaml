  2908dbfd22be92f262a40785ce72488ed272b444e984ff2ee50aea80095a646b:
    claim:
      about:
        disease:
          name: Rienhoff Syndrome
          disease_term:
            preferred_term: Rienhoff syndrome
            term:
              id: MONDO:0014262
              label: Rienhoff syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tgfb3_mouse_null_vs_human_heterozygote
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the homozygous Tgfb3-null mouse, the only well-characterised model for this disease,
          faithfully model a human disorder in which essentially every patient is heterozygous and many
          alleles are hypomorphic or motif-specific rather than complete nulls?
        attaches_to:
        - pathophysiology#Impaired Mesenchymal Development
        - pathophysiology#Palatal and Craniofacial Malformation
        rationale: 'The dose mismatch is the core issue: the mouse evidence for the palatal mechanism
          comes from biallelic nulls, whereas human Rienhoff syndrome is autosomal dominant and heterozygous.
          Human alleles are also mechanistically varied (cysteine-knot disruption, RKKR furin-cleavage-motif
          disruption, latency-associated peptide domain substitutions), so a complete null is not an obvious
          surrogate for any of them. The direction of effect diverges too: the mouse null is a pure loss
          of ligand, while human loss-of-function alleles are associated with increased pSMAD2 in the
          aortic media. The mouse is nonetheless the strongest available support for the palatogenesis
          mechanism, and the congenic-background series offers a real mechanistic parallel to human reduced
          penetrance - so this is a translational-validity caveat on an otherwise well-evidenced node,
          not an absence of evidence.'
        proposed_experiments:
        - experiment_id: exp_tgfb3_heterozygous_knockin_mouse
          name: Allele-matched heterozygous Tgfb3 knock-in mouse series
          description: Generate heterozygous mouse lines carrying the orthologous human alleles (cysteine-knot
            p.Cys409Tyr, an RKKR-motif variant, and a latency-associated peptide domain variant) rather
            than a null, and phenotype palate, skeletal muscle mass and aortic wall in parallel. Compare
            each line's SMAD2 phosphorylation in palate, muscle and aorta to test whether one genotype
            can reproduce both the muscular and the vascular arms of the human disease.
