      assertion:
        name: Molecular and clinical diagnosis
        definition_type: DIAGNOSTIC_CRITERIA
        description: The diagnosis is established clinically and/or by identification of a heterozygous
          pathogenic variant in a Loeys-Dietz gene; TGFB3 is the causal gene for Rienhoff syndrome (Loeys-Dietz
          syndrome type 5). Because the non-vascular presentation lacks aortic findings entirely, molecular
          testing rather than the clinical aortic criteria is what establishes the diagnosis at that pole
          of the spectrum.
      selected_evidence:
        snippet: The diagnosis of LDS is established in (1) a proband with characteristic clinical findings
          or (2) by the identification of a heterozygous pathogenic variant in SMAD2, SMAD3, TGFB2, TGFB3,
          TGFBR1, or TGFBR2
        supports: SUPPORT
