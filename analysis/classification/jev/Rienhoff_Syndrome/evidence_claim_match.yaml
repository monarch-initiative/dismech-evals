  a985122615365e034288550bef8aef8cf8eed8bac824dcea9ec44689ab6640bd:
    claim:
      about:
        disease:
          name: Rienhoff Syndrome
          disease_term:
            preferred_term: Rienhoff syndrome
            term:
              id: MONDO:0014262
              label: Rienhoff syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered TGF-beta Signal Transduction
        biological_scale: MOLECULAR
        conforms_to: aortopathy_tgfbeta_dysregulation#TGF-beta Signaling Dysregulation
        description: TGFB3 variants perturb canonical (SMAD2/3) and non-canonical (ERK1/2) TGF-beta signal
          transduction. The direction of the perturbation is allele- and tissue-dependent and is the central
          unresolved issue of the syndrome. In the index case the mutant ligand was signalling-dead and
          behaved as a dominant negative, reducing SMAD2 and ERK1/2 phosphorylation to roughly 40% and
          60% of wild-type levels. In contrast, aortic wall tissue from patients with TGFB3-related aortic
          aneurysm shows paradoxical up-regulation of both canonical and non-canonical TGF-beta signalling,
          exactly as seen for variants in TGFBR1/2, SMAD3 and TGFB2.
        biological_processes:
        - preferred_term: SMAD protein signal transduction
          term:
            id: GO:0060395
            label: SMAD protein signal transduction
          modifier: ABNORMAL
      selected_evidence:
        snippet: A 1:1 ratio of mutant-to-wild-type TGFB3 RNA diminished the pSMAD2 and pERK1/2 signals
          to approximately 40% and 60%, respectively, of that generated by the w-t TGFB3 RNA alone.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
