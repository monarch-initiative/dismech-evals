  84df5d447a526e7043123f14e7227a99e6e022c07bbe0b274951d8cc8c7147d0:
    claim:
      about:
        disease:
          name: Rienhoff Syndrome
          disease_term:
            preferred_term: Rienhoff syndrome
            term:
              id: MONDO:0014262
              label: Rienhoff syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tgfb3_signaling_direction
        kind: CONTROVERSY
        status: OPEN
        prompt: How can a single gene, TGFB3, produce both a reduced-signalling phenotype with no vascular
          disease and an aortopathy characterised by paradoxically increased TGF-beta signalling - is
          the difference allele-specific, tissue-specific, or both?
        attaches_to:
        - pathophysiology#Altered TGF-beta Signal Transduction
        rationale: The two anchor papers for this syndrome reach opposite conclusions about the direction
          of the signalling defect. Rienhoff et al. showed a signalling-dead, dominant negative p.Cys409Tyr
          ligand that reduced pSMAD2 and pERK1/2, in a patient with normal echocardiograms through age
          8 and no aortic disease. Bertoli-Avella et al. found paradoxical up-regulation of canonical
          and non-canonical TGF-beta signalling in aortic tissue of TGFB3-variant patients with aneurysms
          and dissections. A third report notes that the codon 300 (latency-associated peptide domain)
          variants presumably lead to increased TGF-beta signalling and are associated with tall stature,
          whereas the Cys409Tyr loss-of-function allele produced growth retardation - suggesting that
          stature itself may read out the direction of the signalling change. Whether allele class, tissue
          context, or the well-described paradoxical aortic response to upstream TGF-beta pathway loss
          reconciles these findings is unresolved, and it directly determines whether TGF-beta-directed
          therapy would be expected to help or harm a given patient. The strongest reconciling datum so
          far is that loss-of-function TGFB3 alleles are themselves associated with increased pSMAD2 and
          CTGF in the aortic media, which points to a tissue-compartment-specific rather than an allele-direction
          explanation - but that observation has not been paired with matched skeletal-muscle data from
          the same patients, so it does not close the question.
        proposed_experiments:
        - experiment_id: exp_tgfb3_allele_class_signalling_panel
          name: Allele-class by cell-type signalling panel for TGFB3 variants
          description: Assay canonical (pSMAD2/3) and non-canonical (pERK1/2) signalling output for a
            panel of TGFB3 alleles - cysteine-knot (p.Cys409Tyr), LAP-domain (p.Arg300Gln, p.Arg300Gly)
            and haploinsufficiency - in matched primary aortic smooth muscle cells and skeletal myoblasts
            derived from patient induced pluripotent stem cells, to test whether the direction of effect
            tracks with allele class, with cell type, or with both.
        - experiment_id: exp_tgfb3_genotype_phenotype_stratification
          name: Allele-stratified genotype-phenotype survey of the TGFB3 cohort
          description: Systematically collect aortic imaging and stature data across the reported TGFB3
            cohort stratified by allele class, to test the prediction that LAP-domain variants associate
            with tall stature and aortopathy while cysteine-knot loss-of-function alleles associate with
            growth retardation and spared vasculature.
      selected_evidence:
        snippet: increased pSMAD2 and CTGF expression was observed in the aortic media of patients with
          either loss‐of‐function TGFB2 or TGFB3 mutations, further confirming the paradoxical observation
          of increased TGF‐β signaling in vivo
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
