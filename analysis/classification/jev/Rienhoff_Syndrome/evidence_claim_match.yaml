      assertion_type: AnimalModel
      assertion:
        species: Mouse (Mus musculus)
        genotype: Homozygous Tgfb3 null (Tgfb3-/-)
        category: Knockout
        genes:
        - preferred_term: Tgfb3
          term:
            id: hgnc:11769
            label: TGFB3
        associated_phenotypes:
        - Cleft palate
        - Failure of palatal shelf fusion
        description: The Tgfb3-null mouse is the primary model for the palatal arm of the syndrome. It
          shows an incompletely penetrant failure of palatal shelf fusion producing cleft palate, caused
          by impaired adhesion of the apposing medial edge epithelia and failure to eliminate the mid-line
          epithelial seam. Critically, no other craniofacial abnormalities accompany it, establishing
          that TGF-beta 3 acts on palatal fusion by an intrinsic, primary mechanism rather than secondarily
          to a craniofacial malformation - the model-organism support for the "Palatal and Craniofacial
          Malformation" node. Note the model is a complete biallelic null, whereas human patients are
          heterozygous; see discussion `tgfb3_mouse_null_vs_human_heterozygote`.
      selected_evidence:
        snippet: Mice lacking TGF-beta 3 exhibit an incompletely penetrant failure of the palatal shelves
          to fuse leading to cleft palate. The defect appears to result from impaired adhesion of the
          apposing medial edge epithelia of the palatal shelves and subsequent elimination of the mid-line
          epithelial seam.
        supports: SUPPORT
