          mechanistic classes. The index de novo c.1226G>A (p.Cys409Tyr) variant lies in the last exon
          and destroys the cysteine knot of the mature ligand, producing a signalling-dead protein that
          acts as a dominant negative. A second class of variants affects codon 300 of the latency-associated
          peptide domain (p.Arg300Gln, p.Arg300Gly) and is proposed to increase TGF-beta signalling; these
          have been associated with overgrowth and tall stature rather than growth retardation. Additional
          variants were identified across 11 families with syndromic aortic aneurysms.
