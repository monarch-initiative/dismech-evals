        discussion_id: tgfb3_vascular_risk_in_nonvascular_presentation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the lifetime aortic risk for an individual carrying a loss-of-function TGFB3 allele
          who presents with the muscular and skeletal phenotype and has normal aortic imaging in childhood?
        attaches_to:
        - pathophysiology#Progressive Aortic Dilation and Aneurysm
        rationale: The index patient had yearly echocardiograms from 18 months with normal aortic root
          dimensions at 6.5 years, and uncertainty about her vascular risk was explicitly named as a principal
          clinical concern. Because the same gene causes aneurysms and dissections in other families,
          it is not known whether childhood-normal imaging in a loss-of-function carrier predicts lifelong
          freedom from aortopathy or merely later onset. This gap has direct surveillance consequences
          for a rare disorder in which no natural-history cohort spanning both presentations exists.
        proposed_experiments:
        - experiment_id: exp_tgfb3_natural_history_registry
          name: International TGFB3 natural-history registry with protocolised imaging
          description: Establish an international TGFB3 registry with protocolised aortic imaging (echocardiography
            plus whole-arterial-tree magnetic resonance or computed tomography angiography) and longitudinal
            follow-up, stratified by allele class, to derive age-specific cumulative aortic-event risk
            for carriers who are imaging-normal in childhood.
      selected_evidence:
        snippet: The full phenotypic spectrum and natural history of TGFB3 mutations must await other
          cases
        supports: SUPPORT
