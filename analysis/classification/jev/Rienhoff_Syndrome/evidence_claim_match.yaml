              label: Rienhoff syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: TGFB3
        gene_term:
          preferred_term: TGFB3
          term:
            id: hgnc:11769
            label: TGFB3
        association: Causative
        relationship_type: CAUSATIVE
        notes: Heterozygous variants in TGFB3, encoding the transforming growth factor beta 3 ligand,
          cause Rienhoff syndrome (Loeys-Dietz syndrome type 5). Reported alleles fall into at least two
          mechanistic classes. The index de novo c.1226G>A (p.Cys409Tyr) variant lies in the last exon
          and destroys the cysteine knot of the mature ligand, producing a signalling-dead protein that
          acts as a dominant negative. A second class of variants affects codon 300 of the latency-associated
          peptide domain (p.Arg300Gln, p.Arg300Gly) and is proposed to increase TGF-beta signalling; these
          have been associated with overgrowth and tall stature rather than growth retardation. Additional
          variants were identified across 11 families with syndromic aortic aneurysms.
      selected_evidence:
        snippet: A second de novo mutation was found in TGFB3 (c.1226G>A; pC409Y). Validation by Sanger
          sequencing confirmed that this mutation was de novo in the proband.
        supports: SUPPORT
    origin:
