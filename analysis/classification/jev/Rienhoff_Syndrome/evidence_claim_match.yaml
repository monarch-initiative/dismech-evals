      assertion_type: Discussion
      assertion:
        discussion_id: lds_wide_features_not_confirmed_for_tgfb3
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which of the Loeys-Dietz syndrome features catalogued gene-agnostically by GeneReviews
          - cerebral aneurysm, craniosynostosis, strabismus, the cutaneous triad of velvety translucent
          skin, easy bruising and dystrophic scars, and the allergic/inflammatory and gastrointestinal
          predisposition - actually occur in TGFB3-related disease?
        attaches_to:
        - pathophysiology#Palatal and Craniofacial Malformation
        rationale: The only GeneReviews chapter covering this disorder is the gene-agnostic Loeys-Dietz
          syndrome chapter, which pools findings across SMAD2, SMAD3, TGFB2, TGFB3, TGFBR1, TGFBR2 and
          IPO8. The two TGFB3-specific primary sources do not report cerebral aneurysm, craniosynostosis
          or the allergic/inflammatory phenotype, and the index patient is explicitly described as having
          skin of normal texture, tension and wound healing - a direct contrast with the LDS cutaneous
          triad. Arterial tortuosity, a hallmark of other LDS subtypes, is likewise absent from the TGFB3
          phenotype. This entry therefore curates only features with TGFB3-specific evidence and does
          not import the remaining LDS-wide features, but whether their absence reflects genuine gene-specific
          sparing or merely the small published cohort is unresolved. It matters because gene-agnostic
          LDS surveillance protocols (for example cerebrovascular imaging) may be either over- or under-inclusive
          for TGFB3 carriers.
        proposed_experiments:
        - experiment_id: exp_tgfb3_gene_specific_feature_audit
          name: Gene-stratified feature audit across the Loeys-Dietz gene panel
          description: Re-analyse existing multicentre Loeys-Dietz cohorts with per-gene stratification
            and protocolised ascertainment of cerebrovascular imaging, dermatological examination, and
            allergic/gastrointestinal history, to determine which LDS features are genuinely shared across
            all causal genes and which are gene-specific. Report TGFB3 carriers separately rather than
            pooled.
      selected_evidence:
        snippet: Wide variation in the distribution and severity of clinical features can be seen in individuals
          with LDS, even among affected individuals within a family who have the same pathogenic variant.
        supports: SUPPORT
