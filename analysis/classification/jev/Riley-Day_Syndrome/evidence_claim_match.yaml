      assertion_type: Pathophysiology
      assertion:
        name: Postnatal Proprioceptive Neuron Loss
        biological_scale: TISSUE
        description: Muscle-spindle afferents are lost after birth, removing proprioceptive feedback.
          This is the mechanistic origin of three features that look unrelated clinically — areflexia,
          gait ataxia, and kyphoscoliosis — since the stretch reflex arc, balance, and the postural control
          of the growing spine all depend on the same afferent signal. Because these neurons are present
          at birth and lost later, they are the population most plausibly rescuable by a postnatal splice-modulating
          drug.
        cell_types:
        - preferred_term: Proprioceptive dorsal root ganglion neuron
          term:
            id: CL:1001451
            label: sensory neuron of dorsal root ganglion
      selected_evidence:
        snippet: Clinically, many of the debilitating aspects of the disease are related to a progressive
          loss of proprioception; this loss leads to severe gait ataxia, spinal deformities, and respiratory
          insufficiency due to neuromuscular incoordination.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/1
