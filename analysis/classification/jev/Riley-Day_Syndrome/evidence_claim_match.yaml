      assertion_type: Phenotype
      assertion:
        category: Renal
        name: Chronic Kidney Disease
        description: 'Progressive loss of renal function is a frequent problem and is named alongside
          baroreflex failure and dysphagia in this disease''s cardinal clinical picture, so it is a defining
          organ complication rather than an incidental one. Two contributions are described and they are
          not mutually exclusive: the blood-pressure lability itself, since paroxysmal hypertension from
          birth tracks with faster renal damage, and a developmental component, since renal patterning
          defects are over-represented and suggest ELP1 deficiency also affects kidney development. The
          relationship then runs both ways, because sustained supine hypertension is usual once chronic
          kidney disease is advanced. Two management consequences follow: creatinine understates the glomerular
          filtration rate because muscle mass is low, and high-dose fludrocortisone given for orthostatic
          hypotension accelerates the renal decline.'
        phenotype_term:
          preferred_term: Chronic kidney disease
          term:
            id: HP:0012622
            label: Chronic kidney disease
          clinical_course: PROGRESSIVE
        frequency: FREQUENT
      selected_evidence:
        snippet: Patients have dramatic blood pressure instability due to baroreflex failure, chronic
          kidney disease, and impaired swallowing leading to recurrent aspiration pneumonia, which results
          in chronic lung disease.
        supports: SUPPORT
