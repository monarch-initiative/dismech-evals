              label: Riley-Day syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuronal Elongator Complex Deficiency
        biological_scale: MOLECULAR
        description: ELP1 is the scaffolding subunit of the six-subunit Elongator complex. Its depletion
          in neurons compromises the complex's known activities — transcriptional elongation, acetylation
          of cytoskeletal alpha-tubulin, and tRNA wobble-uridine modification. Which of these is the proximate
          cause of neuronal death is not settled; tRNA modification is the best-characterized activity
          and is tagged here as the representative process, but the cytoskeletal and trafficking roles
          are equally implicated and the field has not resolved whether Elongator has genuinely distinct
          functions or whether one primary defect produces the rest.
        genes:
        - preferred_term: ELP1 (formerly IKBKAP)
          term:
            id: hgnc:5959
            label: ELP1
        biological_processes:
        - preferred_term: tRNA wobble uridine modification
          term:
            id: GO:0002098
            label: tRNA wobble uridine modification
          modifier: DECREASED
        molecular_functions:
        - preferred_term: Elongator complex tRNA-modifying activity
          description: 'The activity is the assembled complex''s, not ELP1''s own: ELP1 is the scaffolding
            subunit and carries no catalytic site, so depleting it lowers the amount of assembled Elongator
            and with it the complex''s tRNA-modifying catalysis. GO has no molecular-function term for
            the wobble-uridine chemistry specifically — the wobble terms are all biological processes,
            and the available tRNA-modifying activities name acetyl- or methyltransferase chemistries
            Elongator does not perform — so the broader tRNA-acting catalytic activity is bound here and
            the process specificity is carried by the biological_processes term above.'
          term:
            id: GO:0140101
            label: catalytic activity, acting on a tRNA
          modifier: DECREASED
      selected_evidence:
        snippet: The Elongator complex is an evolutionary highly conserved protein complex that participates
          in distinct cellular processes, including transcriptional elongation, acetylation of cytoskeletal
        supports: SUPPORT
