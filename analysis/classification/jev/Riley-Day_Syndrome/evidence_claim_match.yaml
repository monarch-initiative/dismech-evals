          — all qualities or material entities, none an exposure event and none in the ExposureTerm enum),
          `l~humidity` (no ECTO terms), `l~moist` (no ECTO terms), and `l~weather` (only ECTO:1000020
          exposure to weather, which is broader than the heat term and loses the temperature claim). XCO
          has only XCO:0000993 controlled humidity, a laboratory-controlled condition rather than ambient
          humid weather. ECTO:1000007 was preferred over ECTO:1000018 exposure to extreme high temperature
          environment because the source says "hot", not extreme, and over ECTO:4000001 exposure to increased
          temperature because the claim is about the ambient environment rather than a temperature increase
