  4e7a7466c656932de59e69723186c59206e16c6db32f7e273880a64bee4a53a8:
    claim:
      about:
        disease:
          name: Riley-Day Syndrome
          disease_term:
            preferred_term: Riley-Day syndrome (familial dysautonomia, HSAN III)
            term:
              id: MONDO:0009131
              label: Riley-Day syndrome
        context:
        - path: /treatments/2
          value:
            name: Carbidopa
            description: 'A peripheral DOPA-decarboxylase inhibitor, and the best-evidenced disease-specific
              pharmacotherapy in this entry. Because it does not cross the blood-brain barrier it blocks
              catecholamine synthesis only outside the central nervous system, which is where the unrestrained
              release happens, and two randomized placebo-controlled crossover trials have tested it on
              the two halves of that problem. The 2013 antiemetic trial reduced nausea and retching (Class
              II evidence, mean 480 mg/day); the 2020 trial met both co-primary endpoints for blood-pressure
              variability at 300 and 600 mg/day (class Ib evidence). Its practical significance is that,
              unlike the benzodiazepines and clonidine it supplements, it causes neither sedation nor
              respiratory depression, so it is usable as continuous prophylaxis in patients whose chemoreflex
              is already failing rather than only as rescue. It is symptomatic, not disease-modifying:
              it lowers the catecholamine output that baroreflex failure permits and does nothing to the
              afferent lesion.'
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: carbidopa
                term:
                  id: CHEBI:3395
                  label: carbidopa
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Blood Pressure Instability
        treatment_effect: INHIBITS
        description: Suppressing peripheral catecholamine synthesis also narrows the blood-pressure swings,
          since the hypertensive peaks are driven by excess norepinephrine release. This is a separate
          trial from the antiemetic one and its endpoints were the variability itself, not the vomiting.
      selected_evidence:
        snippet: Twenty-four hour urinary norepinephrine excretion, a marker of peripheral catecholamine
          release, was significantly suppressed on both high dose and low dose carbidopa, compared with
          placebo (P=0.0075).
        supports: SUPPORT
