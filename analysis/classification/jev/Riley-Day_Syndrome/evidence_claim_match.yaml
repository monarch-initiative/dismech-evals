  b0d1f86b664ec60e8ff5a06cd6e87f35bcdfbd0a5022660c64fdb2f2fdbb3680:
    claim:
      about:
        disease:
          name: Riley-Day Syndrome
          disease_term:
            preferred_term: Riley-Day syndrome (familial dysautonomia, HSAN III)
            term:
              id: MONDO:0009131
              label: Riley-Day syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: ELP1
        gene_term:
          preferred_term: ELP1 (formerly IKBKAP)
          term:
            id: hgnc:5959
            label: ELP1
        association: Causal
        notes: 'ELP1 encodes the scaffolding subunit of the Elongator complex and was named IKBKAP (IKAP)
          when the disease gene was identified in 2001. Essentially the whole patient population carries
          the same founder allele, IVS20+6T>C, which is present on 99.5% of familial dysautonomia chromosomes
          and homozygous in 99.5% of patients. The rare alternatives are missense: R696P in exon 19, seen
          only in compound heterozygotes with the major allele, and P914L in exon 26, the first allele
          reported outside the Ashkenazi Jewish population and the finding that forced the diagnostic
          criteria to drop the ancestry requirement. Because the founder allele is so nearly universal,
          genotype does not explain the wide variation in severity, and modifier genes are the standing
          hypothesis for it.'
        case_fractions:
        - population: Familial dysautonomia chromosomes
          case_fraction_percent: 99.5
          notes: Share of disease chromosomes carrying the IVS20+6T>C founder splice allele.
      selected_evidence:
        snippet: In individuals bearing a minor FD haplotype, a missense mutation in exon 19 disrupts
          a consensus serine/threonine kinase phosphorylation site. This mutation results in defective
          phosphorylation of IKAP.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
