      assertion:
        name: Midodrine for Orthostatic Hypotension
        description: 'An alpha-1 adrenergic agonist that raises vascular tone, used for the hypotensive
          half of the blood-pressure phenotype. It is the one treatment here whose scheduling is dictated
          by the mechanism rather than by convenience: the pressor effect lasts only about three hours
          and peaks roughly an hour after an oral dose, so it is timed to activity rather than given on
          a fixed schedule. Supine hypertension is its characteristic adverse effect, which matters more
          in this disease than in most because the same patients already swing into paroxysmal hypertension
          and already have renal damage that pressure accelerates.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: midodrine
            term:
              id: CHEBI:6933
              label: midodrine
      selected_evidence:
        snippet: Since the peak effect is around 1 hour after oral administration, midodrine should be
          taken ∼45 minutes before physical activity, so that the pressor effect coincides with exercise-induced
          hypotension.
        supports: SUPPORT
