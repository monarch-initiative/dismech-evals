            term:
              id: MONDO:0009131
              label: Riley-Day syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fd_kinetin_mouse_to_human_gap
        prompt: Splice-modulating compounds rescue proprioceptive loss, gait ataxia and retinal degeneration
          in the humanized TgFD9 mouse, but the only human result is a change in leukocyte ELP1 splicing.
          Does correcting splicing after birth in humans rescue neurological phenotypes, as it does in
          the mouse?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - animal_models#Mouse
        - treatments#Splice-Modulating Therapy (Kinetin and Derivatives)
        - pathophysiology#Postnatal Proprioceptive Neuron Loss
        rationale: 'The efficacy evidence and the human evidence measure different things. In the mouse,
          kinetin given from birth prevents proprioceptive neuron loss and spinal abnormality, and a brain-penetrant
          derivative improves survival, gait ataxia, and retinal degeneration — phenotypic endpoints.
          In patients, the only demonstrated effect is a significant rise in wild-type ELP1 message in
          leukocytes over 28 days, which is target engagement in an accessible tissue, not benefit in
          the nervous system and not a clinical outcome. Two specific things do not transfer: leukocytes
          are among the tissues that mis-splice least, so a leukocyte readout is a weak proxy for the
          neuronal compartment that matters; and the mouse rescues begin at birth, whereas patients are
          typically treated later, after some of the loss has already happened. The mechanism gives a
          reason to expect timing to be decisive, since proprioceptors and retinal ganglion cells are
          the populations lost postnatally and therefore the ones still present to save.'
      selected_evidence:
        snippet: This is the first report of a drug that produces in vivo mRNA splicing changes in individuals
          with FD and supports future long-term trials to determine whether kinetin will prove therapeutic
          in FD patients.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
      context_paths:
