                  label: carboxymethylcellulose
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Corneal Opacity and Neurotrophic Keratopathy
        treatment_effect: INHIBITS
        description: Topical lubrication substitutes for the missing tear film, which is one of the two
          upstream causes of the corneal damage. It does not restore corneal sensation, so the hypoesthesia
          arm of the lesion is untouched — which is why the treatment is preventive of surface breakdown
          rather than curative.
      selected_evidence:
        snippet: Therapeutic approaches focus on maintaining corneal moisture to avoid dry eye complications,
          including recurrent corneal abrasions, ulcers, and permanent opacities.
