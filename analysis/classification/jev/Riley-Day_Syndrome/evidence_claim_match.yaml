      assertion:
        discussion_id: fd_phenotypic_variability_one_allele
        prompt: If 99.5% of patients are homozygous for the same founder allele, what accounts for the
          wide variation in severity between them?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#ELP1
        - pathophysiology#Tissue-Specific Skipping of ELP1 Exon 20
        rationale: 'This disease is close to a natural experiment in which genotype is held constant,
          so the observed severity range has to come from somewhere else. Modifier genes are the standing
          hypothesis, but the identity of any modifier is unknown. A second, non-exclusive candidate follows
          from the mechanism this entry models: because the allele is leaky and the skipping fraction
          varies by tissue, an individual''s severity may be set by how much correctly spliced ELP1 their
          nervous system happens to make. Distinguishing the two matters for trial design, since ELP1
          level is being used as a surrogate endpoint for target engagement.'
      selected_evidence:
        snippet: Although 99.5% of patients are homozygous for the founder mutation, phenotypic severity
          varies, suggesting that modifier genes impact expression.
        supports: SUPPORT
