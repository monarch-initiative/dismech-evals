        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ELP1 Intron 20 Donor Splice Site Weakening
        biological_scale: MOLECULAR
        description: The Ashkenazi founder allele is a T-to-C transition at the sixth base of ELP1 intron
          20, in the donor (5') splice site of exon 20. It weakens the site without inactivating it, so
          it is a hypomorphic rather than a null allele — patient cells still make some correctly spliced
          transcript, which is why a recessive, uniformly homozygous disease nonetheless varies in severity
          and is a candidate for splice-modulating therapy. A minority of alleles are instead missense
          changes (R696P in exon 19, and P914L in exon 26, the first non-Jewish allele found).
        genes:
        - preferred_term: ELP1 (formerly IKBKAP)
          term:
            id: hgnc:5959
            label: ELP1
        biological_processes:
        - preferred_term: mRNA 5'-splice site recognition at ELP1 exon 20
          term:
            id: GO:0000395
            label: mRNA 5'-splice site recognition
          modifier: DECREASED
      selected_evidence:
        snippet: Interestingly, despite the fact that FD is a recessive disease, normal mRNA and protein
          are expressed in patient cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
