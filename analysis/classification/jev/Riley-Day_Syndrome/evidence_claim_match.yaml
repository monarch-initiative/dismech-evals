          target engagement in humans but not clinical benefit. Benefit has been shown only in the humanized
          mouse. No splice-modulating agent is approved for this disease.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
