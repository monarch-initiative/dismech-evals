        description: 'Corneal hypoesthesia is the ocular instance of the same protective-sensory loss:
          an insensate cornea does not register abrasion, so injury goes unreported and unprotected. This
          is the second of the two causes the source names, alongside the tear deficit from alacrima,
          which is why the corneal phenotype has two upstream edges rather than one.'
