      - /disease_term
    evidence_metadata:
      reference: PMID:21775922
      reference_title: Kinetin improves IKBKAP mRNA splicing in patients with familial dysautonomia.
      evidence_source: HUMAN_CLINICAL
      explanation: The human result is a splicing change with therapeutic benefit explicitly still to
        be determined, which is the mismatch.
