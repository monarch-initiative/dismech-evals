          value:
            name: Ocular Surface Lubrication
            description: Maintaining corneal moisture is the preventive treatment for the corneal limb
              of the eye disease, and it is the only ophthalmic intervention here that acts before damage
              rather than after it. The regimen is defined by frequency rather than by a single agent
              — preservative-free artificial tears every two to three hours, liquid gels every four to
              six, and a carboxymethylcellulose, glycerin, mineral-oil or petrolatum ointment overnight
              — because alacrima removes tear production continuously rather than episodically. It does
              nothing for the retinal ganglion cell optic neuropathy, which is a separate cause of visual
              loss in this entry.
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
