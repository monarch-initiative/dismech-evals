  3ce0c54ddd8ef9b801141508fa2d0739d28179f4ea0fc5c2529853cdcc90d630:
    claim:
      about:
        disease:
          name: Riley-Day Syndrome
          disease_term:
            preferred_term: Riley-Day syndrome (familial dysautonomia, HSAN III)
            term:
              id: MONDO:0009131
              label: Riley-Day syndrome
        context: []
      assertion_type: AnimalModel
      assertion:
        name: TgFD9;Elp1 humanized familial dysautonomia mouse
        species: Mouse
        genotype: TgFD9 human ELP1 transgene carrying IVS20+6T>C, on an Elp1 delta20/flox background
        publication: PMID:26769677
        description: The complete human ELP1 (IKBKAP) gene carrying the founder splice mutation was introduced
          as a transgene into a mouse expressing very little endogenous Elp1. Unlike earlier knockout
          attempts, this reproduces the human molecular defect itself — tissue-specific mis-splicing of
          a human transgene — rather than simply lowering Elp1, which is what makes it usable for testing
          splice-modulating drugs.
        modeled_mechanisms:
        - target: Tissue-Specific Skipping of ELP1 Exon 20
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: MOLECULAR
          description: The transgene reproduces the same tissue-specific exon 20 mis-splicing seen in
            patients, which is the property the model was built for.
        - target: Failed Development and Innervation of Sensory and Autonomic Neurons
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: The mouse shows sensory and sympathetic impairment and a reduced number of fungiform
            papillae, the developmental readouts of this node.
          limitations: Mouse Ikap is only about 80% identical to human IKAP, and the phenotype is produced
            by a human transgene on a hypomorphic mouse background rather than by the endogenous locus,
            so absolute expression levels are not those of a patient.
        - target: Postnatal Proprioceptive Neuron Loss
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: TISSUE
          description: The model reproduces the proprioceptive impairment seen in patients, and postnatal
            kinetin prevents the proprioceptive neuron loss and the spinal abnormalities that follow it
            — a rescue experiment that is also the strongest available evidence for the causal direction
            of this node.
          readouts:
          - name: Onset of spinal abnormalities under postnatal kinetin
            target: Postnatal Proprioceptive Neuron Loss
            direction: RESTORED
            interpretation: Preventing proprioceptive neuron loss prevents the spinal deformity, supporting
              the proprioception-to-kyphoscoliosis edge in this entry.
        - target: Retinal Ganglion Cell Degeneration
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: The same mouse develops a progressive retinal phenotype, which was characterized
            specifically to support development of therapies for the optic neuropathy.
          limitations: The murine retina lacks a macula, so the model cannot reproduce the macular ganglion
            cell and inner plexiform layer thinning that is the main quantitative measure of progression
            in patients.
      selected_evidence:
        snippet: This new mouse model, TgFD9; Ikbkap(Δ20/flox) was created by introducing the complete
          human IKBKAP transgene with the major FD splice mutation (TgFD9) into a mouse that expresses
          extremely low levels of endogenous Ikbkap
        supports: SUPPORT
