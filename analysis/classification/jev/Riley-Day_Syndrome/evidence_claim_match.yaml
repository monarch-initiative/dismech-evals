      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30905397
      reference_title: ELP1 Splicing Correction Reverses Proprioceptive Sensory Loss in Familial Dysautonomia.
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      explanation: Names tRNA modification among the Elongator complex's characterized activities, which
        is the catalytic-activity-on-a-tRNA molecular function bound on this node. Graded IN_VITRO because
        the quoted sentence reports the biochemical characterization of the complex rather than a clinical
