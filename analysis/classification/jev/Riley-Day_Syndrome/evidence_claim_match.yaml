          name: Riley-Day Syndrome
          disease_term:
            preferred_term: Riley-Day syndrome (familial dysautonomia, HSAN III)
            term:
              id: MONDO:0009131
              label: Riley-Day syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Fundoplication
        description: 'An antireflux wrap, performed in 72% of patients in the US, addressing the gastroesophageal
          reflux that occurs in about three quarters of them and adds a second route to aspiration on
          top of the swallowing lesion. It is included here with its own evidence of limits rather than
          as a settled benefit: the review states that its effect on natural history compared with untreated
          patients is unclear, that reflux can recur, that up to 12% need a second operation, and that
          oesophageal dilatation and achalasia are increasingly recognized afterwards. One independent
          corroboration of the wrap''s mechanical effect comes from the carbidopa antiemetic trial, where
          every enrolled patient had had a fundoplication and none could vomit — they retched instead,
          which is why that trial''s endpoints were nausea and retching rather than vomiting.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Fundoplication
          term:
            id: NCIT:C91834
            label: Fundoplication
      selected_evidence:
        snippet: fundoplication surgery has been performed in 72% of patients with FD in the US
        supports: SUPPORT
