            term:
              id: MONDO:0009131
              label: Riley-Day syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Phosphatidylserine
        description: 'Investigational, and worth modelling separately from kinetin because its mechanism
          is different rather than merely its chemistry: kinetin shifts the exon 20 inclusion-to-skipping
          ratio, whereas phosphatidylserine raises ELP1 transcription without altering that ratio. Both
          therefore converge on the same target — more ELP1 protein in neurons — by non-overlapping routes,
          which is the stated reason the two might be combined. Human evidence is early: a small number
          of patients showed an ELP1 rise with acceptable tolerability, and whether that translates into
          rescue or delay of optic atrophy and gait ataxia was still the object of ongoing long-term trials
          at the time of this review. Nothing here is a clinical outcome.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: phosphatidylserine
            term:
              id: CHEBI:18303
              label: phosphatidyl-L-serine
      selected_evidence:
        snippet: Phosphatidylserine, a phospholipidic component of cell membranes, has been shown to raise
          IKAP (ELP-1) levels in cell lines and animal models of FD.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/10
      evidence_path: /treatments/10/evidence/0
      context_paths:
