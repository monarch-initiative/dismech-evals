            term:
              id: MONDO:0009131
              label: Riley-Day syndrome
        context: []
      assertion_type: Environmental
      assertion:
        name: Full bladder
        description: GeneReviews lists a full bladder among the circumstances to avoid because it exacerbates
          symptoms. It belongs to the same class of visceral-afferent stimulus that provokes hyperadrenergic
          episodes in other afferent-lesioned autonomic disorders, and it is a modifiable one — which
          is why it appears on an avoid list rather than only in a mechanism discussion. The cited source
          states the exacerbation without a mechanism and this entry does not supply one.
        effect: Exacerbates symptoms, including dysautonomic crises.
        exposure_term:
          preferred_term: bladder distension from urinary retention
        notes: 'Left unbound: neither ECTO nor XCO has a bladder-distension or visceral-stimulus exposure
          class. Searched the pinned local builds with `runoak -i sqlite:obo:ecto info` for `l~bladder`,
          `l~distension`, `l~distention`, `l~visceral`, `l~stretch` and `l~retention` (no ECTO terms for
          any of the six) and `l~urine` (returns only ECTO:9000202 exposure to purines and an unrelated
          enzyme-inhibitor term). `runoak -i sqlite:obo:xco info` for `l~distension`, `l~distention`,
          `l~full ` and `l~visceral` returns no XCO terms; `l~bladder` returns only XCO:0001279 partial
          bladder outlet obstruction, which is an outflow obstruction rather than a distended bladder,
          and `l~urin` returns XCO:0001101 urinary catheterization, which is the intervention that relieves
          this exposure rather than the exposure. No term beats a wrong one, so the concept is carried
          in preferred_term alone.'
      selected_evidence:
        snippet: 'The following can exacerbate symptoms: hot or humid weather; full bladder.'
        supports: SUPPORT
