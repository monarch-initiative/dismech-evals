        rationale: The entry binds tRNA wobble-uridine modification to the Elongator deficiency node because
          it is the best-characterized activity, but that choice is a representative tag rather than a
          mechanistic verdict. ELP1 has also been implicated in exocytosis, cytoskeletal organization,
          axonal transport, adhesion, and migration, and the literature explicitly records that it remains
          unclear whether Elongator has distinct functions or whether its role in tRNA modification drives
          everything else. Treating the tRNA binding as the established cause of neuronal death would
          overstate what is known, which matters because the choice determines what a mechanism-directed
          therapy would target.
