        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Tissue-Specific Skipping of ELP1 Exon 20
        biological_scale: MOLECULAR
        description: 'Exon 20 skipping produces a frameshifted, truncated transcript. Crucially the skipping
          fraction differs by tissue: the nervous system produces mostly mutant transcript while fibroblasts
          and other non-neuronal tissue produce close to equal amounts of wild-type and mutant message.
          This tissue selectivity, not the mutation''s severity, is what makes an otherwise ubiquitously
          expressed housekeeping gene cause a purely neurological disease.'
        genes:
        - preferred_term: ELP1 (formerly IKBKAP)
          term:
            id: hgnc:5959
            label: ELP1
      selected_evidence:
        snippet: the relative amount of MU and WT IKBKAP transcripts varies between tissues, with the
          lowest levels of WT IKBKAP mRNA and IKAP protein in tissues from the central and peripheral
          nervous system
        supports: SUPPORT
    origin:
