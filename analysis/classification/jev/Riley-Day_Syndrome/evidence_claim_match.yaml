      assertion:
        name: Afferent Baroreflex and Chemoreflex Failure
        biological_scale: ORGANISM
        description: Loss of the afferent limb of the baroreflex leaves blood pressure without feedback
          control, producing both orthostatic hypotension and unopposed sympathetic surges. The parallel
          loss of chemoreceptor afferents abolishes the ventilatory response to hypoxia and blunts it
          to hypercapnia, so hypoxia produces paradoxical hypoventilation with hypotension and bradycardia
          instead of the normal defensive response. The efferent sympathetic apparatus is comparatively
          intact, which is why the failure manifests as uncontrolled output rather than as absent output.
      selected_evidence:
        snippet: In patients with familial dysautonomia, ventilatory responses to hypercapnia are reduced,
          and to hypoxia are almost absent.
        supports: SUPPORT
