      - /disease_term
    evidence_metadata:
      reference: PMID:22564756
      reference_title: The ring 14 syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Localises the epilepsy to the interval that is preserved in all ring patients, which
