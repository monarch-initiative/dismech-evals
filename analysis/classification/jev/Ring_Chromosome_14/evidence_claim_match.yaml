            term:
              id: MONDO:0014708
              label: ring chromosome 14
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: dynamic_mosaicism
        hypothesis_label: Mitotic ring instability produces a mosaic effective genotype
        status: EMERGING
        description: 'The ring is unstable in mitosis, so cells lose it or carry rearranged forms of it
          at varying rates. The resulting mosaicism, which increases with age, would make the functional
          genotype of any tissue a mixture and could explain why the phenotype exceeds the deletion and
          why it progresses.

          Instability itself is documented in a ring 14 patient. What is missing is any link between the
          degree of mosaicism and the severity of the phenotype, in this or any other ring 14 patient.'
      selected_evidence:
        snippet: dysregulation of FOXG1 may contribute to the classical r(14)-syndrome, likely mediated
          by dynamic mosaicism
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
