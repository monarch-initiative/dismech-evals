  36b373b09cda24198c814ce11a1e16dde8394348aba32d290b672dea5b8f77c9:
    claim:
      about:
        disease:
          name: Ring Chromosome 14 Syndrome
          disease_term:
            preferred_term: ring chromosome 14
            term:
              id: MONDO:0014708
              label: ring chromosome 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Position-Effect Dysregulation of Proximal 14q
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        description: 'The features that define the syndrome map to proximal 14q11.2-q12, which is preserved
          in every ring patient, so they cannot be explained by loss of material. The proposal is that
          circularisation changes the chromatin architecture of the chromosome and that heterochromatin
          spreading from the adjacent short arm silences genes in the proximal interval despite their
          being present in two copies.

          The supporting observation is a patient whose ring lost nothing but the telomeres, in whom two
          of eight chromosome-14 genes assayed were nonetheless downregulated relative to matched controls.
          FOXG1 at 14q12 is the specific candidate: in a patient with a ring derived from an interstitial
          excision, the breakpoint fell 225 kb downstream of FOXG1 inside its known regulatory landscape,
          and the phenotype overlapped FOXG1 syndrome.

          HYPOTHETICAL, and deliberately so. Two patients is the entire direct evidence base, neither
          study measured FOXG1 expression in classical ring 14, and no experiment has connected altered
          expression of any proximal 14q gene to the epilepsy.'
        biological_processes:
        - preferred_term: heterochromatin formation
          term:
            id: GO:0031507
            label: heterochromatin formation
          modifier: INCREASED
        - preferred_term: regulation of gene expression
          term:
            id: GO:0010468
            label: regulation of gene expression
          modifier: DECREASED
      selected_evidence:
        snippet: Because this region is preserved in all patients with ring 14, we speculate that genes
          residing in the proximal 14q interval are disregulated through heterochromatinization spreading
          from the adjacent short arm of the chromosome.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22564756
