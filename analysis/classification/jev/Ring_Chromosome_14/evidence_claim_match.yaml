        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant IgG N-Glycosylation
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        description: 'A second, and quite different, route to the infection phenotype. Mass spectrometry
          of patient IgG shows decreased galactosylation and sialylation, a pattern resembling the pro-inflammatory
          glycoforms seen in autoimmune disease. The change is selective for IgG and is not seen in total
          serum glycoproteins, and it occurs while IgG concentration is normal. So the immunological defect
          that has actually been measured in this syndrome is qualitative, not a dosage deficit.

          Whether it connects to the ring at all is the open question, and the authors are more cautious
          than a first reading suggests. No galactosyltransferase or sialyltransferase gene lies on chromosome
          14, so the straightforward hypothesis of a direct correlation is unproven. Going further, because
          total serum and transferrin N-glycans are unaffected, the authors judge that the IgG changes
          do not relate to the structural rearrangement. They then guard the inference in the other direction:
          the absence of candidate genes in the deleted region does not by itself exclude a genetic basis,
          because deletion is only one possible mechanism alongside ring instability during cell division
          and the effect of the ring''s new conformation on gene expression.

          Those two alternatives are the same mechanisms this entry already models as the dynamic_mosaicism
          and position_effect hypotheses, which is the most useful thing about this finding: it gives
          those hypotheses a second, independent phenotype to explain.

          HYPOTHETICAL because the glycosylation abnormality is established while its relationship to
          the ring is explicitly unresolved in the source, and its contribution to clinical infection
          risk is untested.'
        biological_processes:
        - preferred_term: protein N-linked glycosylation
          term:
            id: GO:0006487
            label: protein N-linked glycosylation
          modifier: ABNORMAL
      selected_evidence:
        snippet: Patients showed decreased galactosylation and sialylation, resembling pro-inflammatory
          patterns observed in autoimmune diseases.
        supports: SUPPORT
