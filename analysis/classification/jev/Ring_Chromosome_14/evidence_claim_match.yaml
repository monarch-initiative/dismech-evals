        prompt: Does the degree of ring instability correlate with phenotype severity or progression in
          ring chromosome 14?
        attaches_to:
        - mechanistic_hypotheses#dynamic_mosaicism
        - pathophysiology#Ring Mitotic Instability and Dynamic Mosaicism
        rationale: 'Dynamic mosaicism is invoked to explain both why the phenotype exceeds the deletion
          and why it progresses, and the underlying instability is genuinely documented: one patient showed
          micronuclei, aneuploidy and anaphase lags. But instability has been measured in one patient
          and severity has never been scored against it. Without that correlation the hypothesis explains
          everything and predicts nothing. A cohort measuring ring-loss rate in accessible cells against
          epilepsy severity and cognitive trajectory would test it.'
      selected_evidence:
        snippet: Genomic instability was evidenced by the presence of micronuclei and aneuploidies involving
          the ring and other chromosomes.
