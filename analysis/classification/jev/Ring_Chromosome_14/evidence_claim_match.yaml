      reference_title: Guideline recommendations for diagnosis and clinical management of Ring14 syndrome-first
        report of an ad hoc task force.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The consensus guideline states the diagnostic order directly: karyotype is primary,
        and an array-detected terminal 14q deletion should trigger a karyotype to look for a ring.'
