  62b9dd41d894a807046bc33710f251e4b79d4ecb04af8c0dd511b7dd2f4713be:
    claim:
      about:
        disease:
          name: Ring Chromosome 14 Syndrome
          disease_term:
            preferred_term: ring chromosome 14
            term:
              id: MONDO:0014708
              label: ring chromosome 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cortical Hyperexcitability
        biological_scale: TISSUE
        mechanism_confidence: HYPOTHETICAL
        description: 'The convergence node for the epilepsy, and an acknowledged gap. Epilepsy occurs
          in essentially all patients, begins early, is polymorphic and drug-resistant, and carries a
          characteristic electroencephalographic evolution: slow background with pseudoperiodic bursts
          of generalised slow waves early, then focal frontotemporal or temporoposterior slow waves with
          interposed multifocal spikes, and unusual rhythmic fast recruiting posterior spikes that generalise.

          What is not known is how the chromosomal lesion produces this. No causal gene, no ion channel,
          no synaptic or network abnormality has been identified in ring 14. The node is curated because
          the clinical and electroencephalographic phenotype is well characterised and highly stereotyped,
          not because its molecular basis is understood, and both incoming edges are typed as indirect
          with unknown intermediates for that reason.'
        locations:
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
      selected_evidence:
        snippet: The incidence of epilepsy in patients with r(14) syndrome is virtually 100%, characterized
          by early onset, polymorphic seizures, and drug-resistant seizures.
        supports: SUPPORT
    origin:
