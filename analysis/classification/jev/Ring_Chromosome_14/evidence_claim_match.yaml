      assertion_type: Diagnosis
      assertion:
        name: Conventional Karyotype
        description: Karyotyping is the test that makes this diagnosis, and the point is not incidental.
          A complete ring that has lost only telomeric material is balanced in copy number, so chromosomal
          microarray returns a normal result while the karyotype shows the ring. A child with early drug-resistant
          epilepsy, intellectual disability and a normal microarray therefore still warrants a karyotype.
        diagnosis_term:
          preferred_term: Karyotyping
          term:
            id: NCIT:C16768
            label: Karyotyping
      selected_evidence:
        snippet: Conventional cytogenetics is the primary tool to identify a ring chromosome. Children
          with a terminal deletion of chromosome 14q ascertained by molecular karyotyping (CGH/SNP array)
          should be tested secondarily by conventional cytogenetics for the presence of a ring chromosome.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/1
      context_paths:
