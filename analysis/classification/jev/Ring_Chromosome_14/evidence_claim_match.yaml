        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: r14_foxg1_untested_in_classical_ring
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is FOXG1 expression actually altered in classical ring chromosome 14, or is the FOXG1
          link confined to the single atypical case that raised it?
        attaches_to:
        - mechanistic_hypotheses#position_effect
        rationale: FOXG1 is an attractive candidate because it sits at 14q12 inside the implicated interval,
          and because FOXG1 syndrome shares features with ring 14. But the case that raised it carried
          a ring formed from an interstitial excision, not the usual telomere-fusion ring, and its breakpoint
          fell 225 kb downstream of FOXG1 within the regulatory landscape. FOXG1 expression was not measured
          in that patient and has not been measured in any classical ring 14 patient. The hypothesis is
          positional and currently untested where it matters.
        proposed_experiments:
        - experiment_id: r14_foxg1_expression_in_patient_neurons
          name: FOXG1 expression in ring 14 patient-derived neurons
          description: Measure FOXG1 and other proximal 14q transcript levels in neurons derived from
            classical ring 14 patients, including patients whose ring carries no deletion, against matched
            controls.
          would_support:
          - mechanistic_hypotheses#position_effect
          supporting_outcome:
          - FOXG1 or other proximal 14q genes are downregulated in ring 14 neurons at normal copy number,
            connecting the position-effect model to the tissue where the epilepsy arises.
          refuting_outcome:
          - Proximal 14q expression is unchanged in ring 14 neurons, indicating that position effect on
            this interval is not the route to the epilepsy and redirecting attention to mosaicism or to
            another mechanism entirely.
      selected_evidence:
        snippet: The patient represents the first case of a r(14) arising from an interstitial excision
          where the phenotype is compatible with dysregulation of FOXG1.
        supports: SUPPORT
        directness: DIRECT
