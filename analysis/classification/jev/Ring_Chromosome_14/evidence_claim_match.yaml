  d892889b2add440fa4a9cb35b732b14f9c382adf1db57ab7bd9da59f8dd4947b:
    claim:
      about:
        disease:
          name: Ring Chromosome 14 Syndrome
          disease_term:
            preferred_term: ring chromosome 14
            term:
              id: MONDO:0014708
              label: ring chromosome 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ring Mitotic Instability and Dynamic Mosaicism
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: 'A ring chromosome segregates poorly. Sister chromatid exchange within the ring generates
          interlocked and multimeric forms that lag at anaphase, and the ring can be lost outright or
          sequestered into a micronucleus. The consequence is that the effective genotype varies between
          cells and drifts with age, which is the standard explanation for why ring phenotypes exceed
          what their deletion predicts.

          Direct evidence in ring 14 comes from a single patient studied for instability, in whom micronuclei,
          aneuploidy involving both the ring and other chromosomes, and anaphase lags were all documented.

          PROVISIONAL: instability itself is demonstrated, but no study has linked the degree of mosaicism
          to the severity of the epilepsy, which is what the mechanism would need to explain.'
        cellular_components:
        - preferred_term: micronucleus
          description: Deliberately unbound. GO:0031040 micronucleus resolves and validates, but its definition
            is a membrane-bounded organelle of ciliated protozoan cells containing a diploid copy of the
            genome, and the term carries an explicit Ciliophora taxon restriction. That is the ciliate
            germline nucleus, not the mitotic-error micronucleus reported here. GO:0032125 micronucleus
            organization is the same ciliate concept. No correct GO term exists, so per the no-term-beats-a-bad-one
            rule this is free text pending a new-term request.
        biological_processes:
        - preferred_term: chromosome segregation
          term:
            id: GO:0007059
            label: chromosome segregation
          modifier: ABNORMAL
      selected_evidence:
        snippet: Genomic instability was evidenced by the presence of micronuclei and aneuploidies involving
          the ring and other chromosomes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39020403
      reference_title: 'Chromosomal instability in a patient with ring chromosome 14 syndrome: a case
        report.'
      evidence_source: HUMAN_CLINICAL
      explanation: Documents the cytogenetic instability this node asserts, in a ring 14 patient.
