        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: r14_epilepsy_mechanism_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How does a chromosome 14 ring that preserves the proximal 14q interval produce near-universal,
          drug-resistant epilepsy?
        attaches_to:
        - pathophysiology#Cortical Hyperexcitability
        - mechanistic_hypotheses#position_effect
        - mechanistic_hypotheses#dynamic_mosaicism
        rationale: This is the central unanswered question of the syndrome and the reason the convergence
          node is graded HYPOTHETICAL. The epilepsy maps by comparison with linear deletions to proximal
          14q11.2-q12, which is intact in every ring patient, so the deletion cannot be the cause. Position
          effect and dynamic mosaicism are both plausible and both have direct supporting observations,
          but neither has been connected to cortical excitability in any system. No causal gene, ion channel,
          synaptic abnormality or network mechanism has been identified. Distinguishing the two hypotheses
          would need expression measurement of proximal 14q genes in neural tissue or neurons derived
          from ring 14 patients, alongside quantification of ring loss in the same cells.
      selected_evidence:
        snippet: we could deduce that retinal abnormalities and epilepsy map within the proximal 14q11.2-
          q12 region
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
