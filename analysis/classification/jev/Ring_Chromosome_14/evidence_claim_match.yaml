      reference_title: Dysregulation of FOXG1 by ring chromosome 14.
      evidence_source: HUMAN_CLINICAL
      explanation: Proposes dynamic mosaicism as the mediator. Graded INDIRECT because it is offered as
        an interpretation of a single atypical case, not a demonstration.
