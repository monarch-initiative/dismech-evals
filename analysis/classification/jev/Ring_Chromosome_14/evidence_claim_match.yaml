      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: Two things drive the burden and they are different in kind. The epilepsy is near-universal,
          begins in the first months of life and resists drugs in about half of patients, and its severity
          tracks cognitive outcome. But the fact that changes management most is that infection, not seizures,
          is the leading cause of death in adulthood. The guideline is explicit that infection is among
          the worst prognostic factors and that prevention should be pursued actively rather than reactively,
          through hygiene, parental training for early recognition, extended vaccination and early hospitalisation.
          An entry that modelled only the epilepsy would misrepresent what actually kills these patients.
      selected_evidence:
        snippet: and the main cause of death in adulthood, all measures preventing infections must be
          undertaken
        supports: SUPPORT
    origin:
