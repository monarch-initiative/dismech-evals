      assertion_type: Pathophysiology
      assertion:
        name: Ring Chromosome 14 Formation
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Breakage in both arms of chromosome 14 followed by fusion of the ends produces a
          circular chromosome. In the reported series the ring was complete, with no apparent loss of
          material, in 6 of 27 patients, and carried a small terminal deletion of 0.3 to 5 Mb in the remaining
          21. Rings with a deletion were paternal in origin in about three quarters of cases, and uniparental
          disomy for chromosome 14 was excluded throughout, so the phenotype is not an imprinting disorder.
      selected_evidence:
        snippet: In our own sample of patients the ring was complete, with no apparent loss of chromosome
          material, in 6/27 cases, while it showed a small terminal deletion, varying in size from 0.3
          to 5 Mb, in the other 21.
        supports: SUPPORT
