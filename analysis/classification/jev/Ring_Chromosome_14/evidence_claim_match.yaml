  ec1493b4f17c1090bc41bfa6032efbc5a88dce1a7bf9000abb20ca069cc063b6:
    claim:
      about:
        disease:
          name: Ring Chromosome 14 Syndrome
          disease_term:
            preferred_term: ring chromosome 14
            term:
              id: MONDO:0014708
              label: ring chromosome 14
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: position_effect
        hypothesis_label: Position effect silences preserved proximal 14q genes
        status: EMERGING
        description: 'Circularisation changes the chromatin architecture of chromosome 14, and heterochromatin
          spreading from the short arm silences genes in the proximal 14q11.2-q12 interval that remain
          present in normal copy number. This is the only account on offer for why the epilepsy and the
          retinal phenotype map to a region that is never deleted. FOXG1 at 14q12 is the named candidate.

          The evidence is two patients: one whose telomere-only ring showed two of eight chromosome-14
          genes downregulated at normal copy number, and one whose breakpoint fell within the FOXG1 regulatory
          landscape with a FOXG1-syndrome-like phenotype. Neither demonstrates silencing of a proximal
          gene in a classical ring 14 patient, and neither connects expression to seizures.'
      selected_evidence:
        snippet: the phenotypic alterations found in the presence of complete ring chromosomes may be
          related to changes in the chromatin architecture, bringing about a change of expression by position
          effect
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26315457
      reference_title: Position effect modifying gene expression in a patient with ring chromosome 14.
      evidence_source: HUMAN_CLINICAL
      explanation: States the position-effect model and the chromatin-architecture mechanism behind it.
