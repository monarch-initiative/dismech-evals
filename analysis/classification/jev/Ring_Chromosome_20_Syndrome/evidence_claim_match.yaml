        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ring Ratio-Dependent Cortical Network Dysfunction
        biological_scale: TISSUE
        description: 'The unresolved step. Something about carrying the ring makes cortex epileptogenic,
          in proportion to how many cells carry it, without any lesion visible on imaging and without
          a neurological deficit on examination before seizures start. Two concrete candidate mechanisms
          have been tested and disfavoured: deletion of candidate genes on chromosome 20, which cannot
          apply to the mosaic majority who delete nothing, and altered expression of genes near the fusion
          point, which a patient transcriptome study looked for and did not find. This node exists so
          that the graph does not paper over that gap; it is a placeholder for a real biological step
          whose content is unknown, not a claim.'
        locations:
        - preferred_term: frontal lobe
          term:
            id: UBERON:0016525
            label: frontal lobe
      selected_evidence:
        snippet: While the underlying etiology of the phenotype is still not understood, evidence is accumulating
          which suggests the deletion of candidate genes on chromosome 20 is not responsible.
        supports: SUPPORT
