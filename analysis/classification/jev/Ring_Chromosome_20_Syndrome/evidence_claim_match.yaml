  979e4e62ff674fb2eb597ca41761e4c4f533b0ab4bdde6fd453daf3d3e2dc8b6:
    claim:
      about:
        disease:
          name: Ring Chromosome 20 Syndrome
          disease_term:
            preferred_term: ring chromosome 20
            term:
              id: MONDO:0015436
              label: ring chromosome 20
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: r20_encephalopathy_versus_parallel_effect
        kind: CONTROVERSY
        status: OPEN
        prompt: Is the intellectual disability of ring 20 caused by the epilepsy, making this a true developmental
          and epileptic encephalopathy, or is it a parallel consequence of carrying the ring that would
          occur regardless of seizure control?
        attaches_to:
        - pathophysiology#Cognitive Decline and Behavioural Disturbance
        - pathophysiology#Prolonged Nonconvulsive Status Epilepticus
        rationale: 'The encephalopathy reading rests on a genuinely striking observation: children develop
          normally and only then lose ground, with intellectual disability manifesting after seizure onset.
          It is reinforced by the finding that earlier seizure onset predicts worse cognitive outcome.
          But the correlation is confounded, because a higher ring ratio predicts both earlier seizure
          onset and worse cognition, so seizure timing may be a marker of ring burden rather than the
          cause of the cognitive outcome. Two further observations cut against the pure encephalopathy
          account. Behavioural disturbance has been reported to begin before the first seizure in a substantial
          minority, which no seizure-driven mechanism can explain. And adolescent-onset patients had a
          milder developmental course with no cognitive decline despite having both dyscognitive seizures
          and nonconvulsive status, suggesting the vulnerable window matters more than seizure burden.
          The question is not academic: if the epilepsy drives the cognitive outcome, then aggressive
          early seizure control is cognitively protective and worth its side effects, whereas if cognition
          tracks ring burden independently, that aggressive approach buys less than it appears to and
          families deserve to know that.'
        proposed_experiments:
        - experiment_id: exp_r20_ring_ratio_adjusted_cognitive_modeling
          name: Ring-ratio-adjusted modeling of cognitive outcome in a multicentre cohort
          description: Pooled multicentre longitudinal cohort with ring ratio, age at seizure onset, seizure
            and status burden, and serial standardized cognitive testing, modeling cognitive trajectory
            with ring ratio and seizure burden entered as separate predictors rather than examined pairwise.
          decision_criterion: An independent effect of seizure and status burden after adjustment for
            ring ratio would support the encephalopathy model. Cognitive outcome explained by ring ratio
            alone, with seizure burden adding nothing, would support the parallel-effect model.
        - experiment_id: exp_r20_prospective_preseizure_developmental_assessment
          name: Prospective developmental assessment of ring carriers before seizure onset
          description: Systematic developmental and behavioural assessment of individuals found to carry
            a ring 20 before epilepsy has begun, including relatives and incidental findings, establishing
            whether measurable deficits precede the first seizure.
          decision_criterion: Detectable pre-seizure developmental or behavioural deviation would show
            part of the phenotype is seizure-independent. Genuinely normal pre-seizure development across
            a series would strengthen the encephalopathy model.
      selected_evidence:
        snippet: There were three patients out of six with behavioral disturbances before the onset of
          seizures.
        supports: REFUTE
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22424860
      reference_title: 'Ring chromosome 20 syndrome: electroclinical description of six patients and review
        of the literature.'
      evidence_source: HUMAN_CLINICAL
      explanation: Refutes the claim that the whole neurobehavioural phenotype follows the seizures, since
        half of this series showed disturbance beforehand.
