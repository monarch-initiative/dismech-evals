      assertion:
        name: Ring Chromosome 14 Syndrome
        disease_term:
          preferred_term: ring chromosome 14
          term:
            id: MONDO:0014708
            label: ring chromosome 14
        description: 'The nearest structural analogue: another ring chromosome syndrome with drug-resistant
          epilepsy, intellectual disability, behavioural change, frequent status, and the same correlation
          between ring ratio and severity. It is the natural control for any theory of why rings cause
          epilepsy, since whatever explains r(20) has to explain why r(14) differs and why r(2) and r(4)
          produce no epilepsy at all.'
        distinguishing_features:
        - Seizures usually begin in the first months or years of life rather than at school age.
        - A distinctive facial appearance is present, whereas ring 20 characteristically has none.
        - Ocular manifestations occur that have never been reported in ring 20.
      selected_evidence:
        snippet: Status epilepticus is frequent, but seizures usually start in the first months/years
          of life, unlike in r(20) syndrome. Moreover, individuals with r(14) usually present with a distinctive
          facial appearance (epicanthic folds, down-slanting palpebral fissures, flat nasal bridge, upturned
          nares, and large low-set ears) and exhibit ocular manifestations that have never been reported
          in r(20) syndrome, thus facilitating distinguishing these two conditions
        supports: SUPPORT
