  5a11ed0cfce12854673fdd9fecd72eb8f05cfbbab28a6427c0a1321e01e9a079:
    claim:
      about:
        disease:
          name: Ring Chromosome 20 Syndrome
          disease_term:
            preferred_term: ring chromosome 20
            term:
              id: MONDO:0015436
              label: ring chromosome 20
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nigrostriatal Seizure-Termination Failure
        biological_scale: TISSUE
        description: The most distinctive thing about r(20) seizures is not that they start but that they
          will not stop, and this node is the reason to think that is a separate defect rather than just
          severe ictogenesis. Basal ganglia circuits, and striatal dopaminergic transmission in particular,
          are thought to interrupt seizures rather than generate them. In r(20), fluorodopa uptake is
          significantly reduced in both putamen and caudate, and functional imaging during an actual seizure
          shows the substantia nigra and striatum lighting up alongside frontal cortex. Notably the dopaminergic
          reduction does not track the ring ratio, so it behaves like a property of the syndrome rather
          than a dose effect. A seizure-stopping system that works poorly is exactly what a syndrome defined
          by days-long nonconvulsive status looks like from the inside.
        locations:
        - preferred_term: substantia nigra
          term:
            id: UBERON:0002038
            label: substantia nigra
        - preferred_term: striatum
          term:
            id: UBERON:0002435
            label: striatum
      selected_evidence:
        snippet: Striatal dopamine is modulated in r(20) epilepsy; dysfunction of this neurotransmission
          may impair the mechanisms that interrupt seizures.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
