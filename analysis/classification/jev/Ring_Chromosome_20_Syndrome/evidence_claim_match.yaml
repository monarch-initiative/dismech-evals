              label: ring chromosome 20
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Karyotype with adequate cell counts
        description: The diagnostic test, and a rare instance in modern practice where the older technology
          is the correct one. Because most patients are mosaic and carry no copy number change, a chromosomal
          microarray returns normal. Enough metaphase cells must be scored to detect a low ring fraction
          and to estimate the ring ratio, which is itself prognostically informative.
        diagnosis_term:
          preferred_term: Karyotyping
          term:
            id: NCIT:C16768
            label: Karyotyping
        results: A ring chromosome 20 replacing one normal chromosome 20, typically in a fraction of cells,
          reported with the proportion of ring-bearing metaphases.
      selected_evidence:
        snippet: Cytogenetic analysis, rather than chromosomal microarray analysis is recommended for
          diagnosis of this syndrome, as the mosaic cases do not have copy number alterations and are
          therefore not identified by array-based analysis.
        supports: SUPPORT
