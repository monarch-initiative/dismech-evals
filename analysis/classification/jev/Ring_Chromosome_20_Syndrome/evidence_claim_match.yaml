        - No nonconvulsive status epilepticus and no long-lasting rhythmic slow-wave pattern.
        - Karyotype is normal.
      selected_evidence:
        snippet: These features are often present in frontal lobe seizures of different etiologies (83),
          but the absence of NCSE and of the typical EEG features of r(20) syndrome are helpful in the
          diagnosis.
        supports: SUPPORT
