        name: Video-electroencephalography during behavioural change
        description: Prolonged video-electroencephalography is how nonconvulsive status is caught, and
          the threshold for ordering it should be low, because the clinical presentation is a change in
          behaviour or alertness rather than anything that looks like a seizure.
        diagnosis_term:
