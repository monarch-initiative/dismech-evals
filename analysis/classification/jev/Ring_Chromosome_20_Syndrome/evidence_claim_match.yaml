        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mitotic Ring Instability and Dynamic Mosaicism
        biological_scale: CELLULAR
        description: A circular chromosome is mechanically awkward at mitosis. Sister chromatid exchange
          within a ring produces interlocked or double-sized rings that segregate badly, so ring-bearing
          lineages continuously generate secondary aberrations and cells that have lost the ring entirely.
          This continuous reshuffling is called dynamic mosaicism, and it is the accepted explanation
          for the growth failure of the general ring syndrome. Whether it is also what drives the ring
          20 epilepsy is proposed rather than established, which is why the arrow from here into the hub
          node is one of the open questions recorded in the discussions block.
        biological_processes:
        - preferred_term: chromosome segregation
          term:
            id: GO:0007059
            label: chromosome segregation
          modifier: ABNORMAL
      selected_evidence:
        snippet: Ring syndrome is thought to be caused by "dynamic mosaicism" due to ring instability.
        supports: SUPPORT
