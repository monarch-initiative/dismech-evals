      assertion_type: ProgressionInfo
      assertion:
        phase: Seizure onset in a normally developing child
        age_range: Early childhood to adolescence
        notes: Onset is typically around school age in mosaic patients and several years earlier in the
          non-mosaic group, with a higher ring ratio predicting earlier onset. Development is normal beforehand,
          and there is usually neither dysmorphism nor a brain lesion, which is why the diagnosis is often
          delayed for years.
      selected_evidence:
        snippet: The age of onset of seizures was significantly lower in the non-mosaic patients (group
          2, median age of onset 2.1 years) than in the mosaic patients (group 1, median age of onset
          6.0 years).
        supports: SUPPORT
