  2f4880b044742aee1f1e75d0f4c079042cc52bac389fd33a3209134915a99f91:
    claim:
      about:
        disease:
          name: Ring Chromosome 20 Syndrome
          disease_term:
            preferred_term: ring chromosome 20
            term:
              id: MONDO:0015436
              label: ring chromosome 20
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Postzygotic Mosaic Ring Without Detectable Deletion
        biological_scale: CELLULAR
        description: 'In the majority of patients the ring is present in only a proportion of cells, with
          two structurally normal chromosome 20s in the rest, and neither cell line shows any detectable
          deletion or duplication. This is the group that defines the mechanistic problem, and it is also
          the group that a chromosomal microarray will call normal, because there is no copy number change
          to find. The proportion of ring-bearing cells, the ring ratio, behaves like a dose: a higher
          ratio goes with earlier seizure onset and worse cognition.'
        biological_processes:
        - preferred_term: chromosome segregation
          term:
            id: GO:0007059
            label: chromosome segregation
          modifier: ABNORMAL
      selected_evidence:
        snippet: However, in the majority of cases the ring is present in only a proportion of cells,
          with two normal 20's in the remaining cells (mosaicism), and in these cases, no deletions of
          chromosome 20 have been observed.
        supports: SUPPORT
    origin:
