        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Telomere-Telomere Fusion Forming Ring Chromosome 20
        biological_scale: MOLECULAR
        description: 'The short and long arms of chromosome 20 join end to end, converting a normally
          rod-shaped chromosome into a closed circle. The defining and counterintuitive feature is that
          this can happen with no loss of coding sequence: patients are symptomatic even when nothing
          has been deleted. That single fact is what rules out a straightforward gene-dosage account and
          forces the rest of this graph to be modeled around an unresolved step.'
        biological_processes:
        - preferred_term: telomere maintenance
          term:
            id: GO:0000723
            label: telomere maintenance
          modifier: ABNORMAL
      selected_evidence:
        snippet: The disease is caused by fusion of the long and short arms of chromosome 20. Patients
          are symptomatic even if there is no loss of genetic material.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
