  8e56ff3755d1bdca5929e1de231b1fe575bf35193cbc56b22b82772aff65e45a:
    claim:
      about:
        disease:
          name: Ring Chromosome 20 Syndrome
          disease_term:
            preferred_term: ring chromosome 20
            term:
              id: MONDO:0015436
              label: ring chromosome 20
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: r20_unexplained_female_excess
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why are patients with mosaic ring chromosome 20 disproportionately female, when the ring
          arises postzygotically and involves an autosome?
        attaches_to:
        - pathophysiology#Postzygotic Mosaic Ring Without Detectable Deletion
        - pathophysiology#Telomere-Telomere Fusion Forming Ring Chromosome 20
        rationale: 'Chromosome 20 is an autosome and the mosaic ring forms after fertilization, so there
          is no obvious route by which sex should matter. Yet the sex ratio is consistently skewed: a
          systematic review of 192 patients found only 40 percent male, and the skew has been reported
          specifically in the mosaic group rather than the non-mosaic one. Several explanations are available
          and none has been tested. It could be ascertainment, if girls with unexplained cognitive and
          behavioural decline are investigated differently from boys. It could be survival, if male embryos
          tolerate the ring and its ongoing instability less well, which would predict an excess of male
          losses rather than a female excess among survivors. It could reflect a genuine sex-dependent
          difference in tolerance of aneuploid or ring-bearing lineages during early development, which
          is testable. Or it could be a real but modest effect inflated by publication bias across a literature
          made almost entirely of case reports and small series. Which of these is right matters for whether
          the ratio is telling us something about ring biology or only about how the syndrome gets found.'
        proposed_experiments:
        - experiment_id: exp_r20_unbiased_ascertainment_sex_ratio
          name: Sex ratio in a diagnostically unbiased ascertainment stream
          description: Determine the sex ratio among ring 20 cases found by routine karyotyping of all
            children meeting a pre-specified clinical trigger, such as drug-resistant focal epilepsy with
            recurrent confusional episodes, rather than among published cases. Prospective registry ascertainment
            with a fixed testing rule removes the referral asymmetry that the case literature cannot exclude.
          decision_criterion: A sex ratio near parity under a fixed testing rule would identify the published
            excess as ascertainment bias. A persistent female excess would make it a biological finding
            needing a mechanism.
      selected_evidence:
        snippet: Seventy-one studies were included (192 patients), 40.4% (n = 67/166) were male.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42468067
      reference_title: 'Delineating the epilepsy phenotype of ring chromosome 20: A systematic literature
        review.'
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies the sex skew across the pooled published literature, which is the observation
        this gap is about. It also shows the base is published cases, which is precisely why ascertainment
        cannot be excluded.
