      assertion_type: DifferentialDiagnosis
      assertion:
        name: Lennox-Gastaut Syndrome
        disease_term:
          preferred_term: Lennox-Gastaut syndrome
          term:
            id: MONDO:0016532
            label: Lennox-Gastaut syndrome
        description: The commonest misdiagnosis, because both present as drug-resistant childhood-onset
          epilepsy with cognitive decline and frequent nonconvulsive status. The route out is the karyotype,
          not the clinical picture.
        distinguishing_features:
        - Slow spike-wave at 1.5 to 2.5 hertz and generalized paroxysmal fast activity, rather than long-lasting
          rhythmic slow waves with sparse spikes.
        - Tonic seizures in sleep are a defining feature and are not characteristic of ring 20.
        - Frequently follows an identifiable structural or genetic cause; ring 20 has neither a lesion
          nor a causal gene.
      selected_evidence:
        snippet: 'The Authors report that the differential diagnosis might be challenging especially with:
          (1) Frontal Lobe Seizures; (2) Rolandic Epilepsy treated with sodium channel blockers (NCSE
          during wakefulness); and (3) Lennox-Gastaut syndrome (LGS).'
        supports: SUPPORT
