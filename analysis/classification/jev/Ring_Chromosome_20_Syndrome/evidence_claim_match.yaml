      assertion:
        name: Cognitive Decline and Behavioural Disturbance
        biological_scale: ORGANISM
        description: 'Children who were developing normally lose ground after seizures begin, accumulating
          intellectual disability and behavioural problems, and the severity tracks both the ring ratio
          and how early the seizures started. That pattern is what earns the syndrome its classification
          as a developmental and epileptic encephalopathy. The classification is not unchallenged: behavioural
          disturbance has been reported to begin before the first seizure in some patients, which would
          make part of the cognitive phenotype a parallel effect of the ring rather than a consequence
          of the epilepsy. That dispute is recorded in the discussions block.'
      selected_evidence:
        snippet: The r(20) ratio and severity of cognitive impairment appear to be directly related to
          each other and inversely correlated with the age at epilepsy onset.
        supports: SUPPORT
