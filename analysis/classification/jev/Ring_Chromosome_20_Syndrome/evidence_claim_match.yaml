        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Meiotic Non-Mosaic Ring With Terminal Deletion
        biological_scale: CELLULAR
        description: 'A minority of patients carry the ring in every cell examined, and in these the ring
          is almost always accompanied by deletion of the terminal segments of one or both arms near the
          fusion point. This group behaves worse: seizure onset is several years earlier and comorbidities
          are more extensive. The contrast is informative rather than incidental, because it shows the
          syndrome is molecularly heterogeneous, and it means findings from one group should not be assumed
          to hold in the other.'
      selected_evidence:
        snippet: In some patients, the ring (20) is found in all cells analyzed and in these cases, the
          ring is almost always accompanied by deletions of 20pter and/or 20qter.
        supports: SUPPORT
