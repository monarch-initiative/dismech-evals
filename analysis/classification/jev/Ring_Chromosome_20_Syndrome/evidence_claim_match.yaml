        conforms_to: epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony
        description: Whatever the upstream cause, the network output is a hyperexcitable, hypersynchronous
          cortex with a frontal accent. The electroencephalographic signature is not the brief spike-wave
          of the generalized epilepsies but long-lasting bilateral high-voltage slow waves with only occasional
          spike components, often rhythmic theta with frontal predominance. The relative poverty of the
          spike component, alongside seizures that are clinically subtle relative to how dramatic the
          tracing looks, is a recurring observation and the seed of a genuine dispute about whether this
          pattern is ictal at all.
