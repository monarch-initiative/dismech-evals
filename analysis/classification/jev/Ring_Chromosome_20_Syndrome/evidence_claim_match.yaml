  26bf15c03531f9a65272aae170f23fd6a563ce42713a8ee5e1d765e9d2b0723c:
    claim:
      about:
        disease:
          name: Ring Chromosome 20 Syndrome
          disease_term:
            preferred_term: ring chromosome 20
            term:
              id: MONDO:0015436
              label: ring chromosome 20
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: r20_mechanism_without_deletion
        kind: CONTROVERSY
        status: UNDER_DISCUSSION
        prompt: If most ring 20 patients lose no genetic material, what does the ring actually do to make
          cortex epileptogenic, and why has every concrete candidate mechanism tested so far failed?
        attaches_to:
        - pathophysiology#Ring Ratio-Dependent Cortical Network Dysfunction
        - pathophysiology#Mitotic Ring Instability and Dynamic Mosaicism
        - pathophysiology#Postzygotic Mosaic Ring Without Detectable Deletion
        rationale: 'This is the central unsolved problem of the syndrome and the reason the mechanism
          graph carries an explicitly empty hub node. Two candidate accounts have been put to the test
          and both came back negative. The first was gene dosage: distal chromosome 20q carries plausible
          epilepsy genes, notably the nicotinic receptor subunit CHRNA4 implicated in sleep-related frontal
          epilepsy, so deletion at the fusion point looked promising. It cannot be the general answer,
          because the mosaic majority have no detectable deletion in either cell line, and a review of
          the accumulated evidence concluded that candidate gene deletion is not responsible. The second
          was a position effect: circularizing a chromosome moves formerly telomeric regions into a new
          context and might silence or derepress genes near the join. A transcriptome study of a patient
          cohort looked specifically for that and found no altered expression in peritelomeric or other
          chromosome 20 regions, concluding that peritelomeric altered transcription is not the likely
          pathogenic mechanism. A third candidate has since been tested and also failed. If circularizing
          the chromosome silences subtelomeric genes through telomeric heterochromatin spreading, that
          silencing should show up as altered methylation; a genome-wide methylation screen in r(20) patients
          found no shared epigenetic signature anywhere, and specifically none at CHRNA4 or KCNQ2. The
          authors note the array covers subtelomeric regions poorly, so this is a strong negative rather
          than a conclusive one. There is also a cleaner argument against dosage than the absence of deletions:
          people who carry terminal deletions of chromosome 20 on an ordinary linear chromosome do not
          develop this epilepsy. Losing the material is not sufficient; the ring is doing something the
          deletion does not. What remains are less tractable hypotheses. Dynamic mosaicism, in which ring
          instability continuously generates secondary aberrations and ring-loss cells, is the accepted
          explanation for the growth failure of ring syndromes generally but has not been shown to drive
          the ring 20 epilepsy, and it has a problem of its own: only 12 of 35 evaluated patients had
          secondary aberrations above a five percent threshold, so r(20) may simply not be unstable enough
          for the mechanism to bear the weight. A further constraint on any generic ring-based account
          is that ring chromosome 2 and ring chromosome 4 patients do not develop epilepsy at all, so
          whatever the ring does, it does it in a chromosome-specific way. Genome-wide chromosomal instability
          affecting expression of genes not on chromosome 20 is raised by the same transcriptome study,
          which found candidate differences across many genes rather than a localized signal. Nuclear
          architecture is a third possibility that has barely been tested, since a ring occupies a different
          territory and has different lamina contacts than a rod. There is also a real methodological
          obstacle underlying all of this: the accessible tissue is blood, the diseased tissue is brain,
          and mosaicism means the two may differ in ring content, so a negative result in blood does not
          settle the question for cortex.'
        proposed_experiments:
        - experiment_id: exp_r20_brain_versus_blood_ring_content
          name: Ring content and expression in brain versus blood from the same individuals
          description: Single-cell karyotype-informed sequencing and transcriptome profiling of postmortem
            or surgically obtained cortical tissue alongside matched blood from ring 20 donors, comparing
            ring fraction and gene expression between the two tissues.
          decision_criterion: A substantially higher cortical than blood ring fraction, or a cortical
            expression signature absent from blood, would show that blood-based negative studies were
            underpowered by tissue choice rather than wrong in principle. Matching ring fractions and
            expression would strengthen the case that the mechanism is not transcriptional at all.
        - experiment_id: exp_r20_nuclear_architecture_profiling
          name: Nuclear architecture profiling of ring versus rod chromosome 20
          description: Chromosome conformation capture and lamina-association mapping in patient-derived
            neurons carrying the ring, comparing the ring-bearing and normal cell lines from the same
            mosaic individual, which provides an internally controlled comparison.
          decision_criterion: Reproducible differences in chromosome 20 compartment or lamina association
            between the ring-bearing and normal lines of the same patient would support a nuclear architecture
            mechanism. Indistinguishable architecture would push the field toward instability-based accounts.
      selected_evidence:
        snippet: Geographic analysis did not identify altered expression in peritelomeric or other specific
          chromosome 20 regions.
        supports: SUPPORT
