            term:
              id: MONDO:0015436
              label: ring chromosome 20
        context: []
      assertion_type: Inheritance
      assertion:
        name: Sporadic, usually postzygotic
        description: 'The ring almost always arises de novo. In the common mosaic form it forms after
          fertilization, which is why a normal cell line persists alongside the ring line and why the
          ring fraction differs between tissues and between patients. The rarer non-mosaic form, which
          does carry terminal deletions, is consistent with an origin in meiosis. Familial recurrence
          is the exception rather than the rule, but it is not absent: four families are on record in
          which a mosaic mother transmitted the ring to her children, also in a mosaic state. In every
          one of those families the children carried a higher proportion of ring-bearing cells than the
          mother did, and that higher ratio went with earlier seizure onset. The counselling position
          is therefore that recurrence risk is low but not zero, that transmission when it occurs is maternal
          and mosaic-to-mosaic, and that an affected child may be more severely affected than the parent
          who transmitted the ring.'
        inheritance_term:
          preferred_term: Sporadic
          term:
            id: HP:0003745
            label: Sporadic
      selected_evidence:
        snippet: The non-mosaic nature of these rings is consistent with a meiotic origin.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/1
