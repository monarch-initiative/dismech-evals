            id: NCIT:C38054
            label: Electroencephalography
        results: Long-lasting bilateral high-voltage rhythmic slow waves at roughly 3 to 5 hertz with
          sparse spike components, sometimes persisting for days, with fluctuating clinical responsiveness.
      selected_evidence:
        snippet: as there is a high incidence of non-convulsive status epilepticus (NCSE), there should
          be a low threshold for video-EEG monitoring if patients have a change in behavior or level of
          consciousness
        supports: SUPPORT
