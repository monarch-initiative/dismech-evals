      assertion_type: ModelMechanismLink
      assertion:
        target: WASHC5 Hypomorphic Loss of Function
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: Complete ablation of the orthologue is not a model of the hypomorphic human genotype;
          it is lethal before the malformations of interest can form.
        limitations: The knockout is a null allele, whereas RSS1 alleles are hypomorphic and retain roughly
          40% of strumpellin. Homozygous embryonic lethality means no craniofacial, cerebellar, or cardiac
          phenotype can be scored, and heterozygotes showed no relevant phenotype. The study was designed
          to probe the dominant SPG8 mechanism rather than recessive RSS1, so its negative findings bear
          on RSS1 only through the dose-response relationship. A knock-in of a patient hypomorphic allele
          would be required.
      selected_evidence:
        snippet: We did, however, neither observe HSP-related in vivo and ex vivo phenotypes, nor alterations
          affecting endosomal, lysosomal, or autophagic compartments.
        supports: SUPPORT
