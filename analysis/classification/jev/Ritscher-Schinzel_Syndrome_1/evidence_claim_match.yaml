  2fe42b77bfa8868ae56a665974cc32f08f3ca8e538625870f0aaf6fe8c588a9c:
    claim:
      about:
        disease:
          name: Ritscher-Schinzel Syndrome 1
          disease_term:
            preferred_term: Ritscher-Schinzel Syndrome 1
            term:
              id: MONDO:0009073
              label: Ritscher-Schinzel syndrome 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rss1_no_viable_washc5_model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: A viable Washc5 knock-in mouse exists, but it carries N471D, an allele that causes dominant
          SPG8 rather than recessive RSS1, and it does not reproduce the RSS1 triad. Would a knock-in
          of an RSS1 hypomorphic allele, at the roughly 40% strumpellin dose seen in patients, develop
          the cerebellar, cardiac, and craniofacial malformations?
        attaches_to:
        - pathophysiology#WASHC5 Hypomorphic Loss of Function
        - animal_models#Washc5 constitutive knockout mouse
        - animal_models#N471D Washc5 knock-in mouse
        rationale: 'Two Washc5 alleles have been engineered in mouse and neither is an RSS1 allele, so
          the mismatch is about which allele was modelled rather than about an absence of models. The
          knockout is a clean deletion: homozygotes die before organogenesis can be scored and heterozygotes
          sit above the disease threshold with no phenotype, so neither dose is the disease. The N471D
          knock-in is viable as a homozygote and does produce mild multi-organ findings, including dilated
          cardiomyopathy, thinner eye lenses and gait instability, but N471D is the dominant SPG8 allele
          and the authors report it does not give a typical SPG8 phenotype either. It is also mechanistically
          the wrong kind of lesion: the same study found WASHC5 interaction partners and complexes at
          unchanged abundance in these animals, whereas RSS1 acts through reduced strumpellin and hence
          reduced WASH complex abundance. So no published model occupies the RSS1 window, and every in
          vivo statement about RSS1 organogenesis still rests on inference from human imaging and from
          cellular work in non-developmental systems. The tissue-selectivity question below cannot be
          addressed experimentally until that changes.'
        proposed_experiments:
        - experiment_id: rss1_hypomorphic_knockin
          name: Patient-allele Washc5 hypomorphic knock-in mouse
          description: Introduce the founder splice-site allele, or an equivalent allele titrated to leave
            roughly 40% strumpellin, into the mouse germline and phenotype homozygotes for posterior fossa,
            cardiac septal, and craniofacial development, with strumpellin quantified by western blot
            to confirm the intended dose.
          readouts:
          - name: Cerebellar vermis and posterior fossa morphology
            target: phenotypes#Cerebellar vermis hypoplasia
            direction: DECREASED
            interpretation: Vermian hypoplasia in a viable hypomorph would establish that partial strumpellin
              loss is sufficient for the cerebellar malformation.
          - name: Cardiac septation
            target: phenotypes#Congenital heart defect
            direction: ALTERED
            interpretation: Septal defects in the same animals would tie the cardiac arm of the triad
              to the same dose.
          would_support:
          - pathophysiology#WASHC5 Hypomorphic Loss of Function
          supporting_outcome:
          - Homozygous hypomorphs survive to term with vermian hypoplasia and septal defects, at a strumpellin
            level comparable to the patient cohort.
          would_refute:
          - pathophysiology#WASHC5 Hypomorphic Loss of Function
          refuting_outcome:
          - Homozygous hypomorphs are either normal or embryonic-lethal at every dose that can be engineered,
            which would mean the human phenotype depends on something other than strumpellin dose alone.
      selected_evidence:
        snippet: While biallelic ablation of Washc5 was prenatally lethal, expression of N471D mutated
          WASHC5 led to several mild clinical and laboratory parameter abnormalities, but not to a typical
          SPG8 phenotype.
        supports: SUPPORT
