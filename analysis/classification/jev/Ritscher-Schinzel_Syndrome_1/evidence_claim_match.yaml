      assertion_type: Pathophysiology
      assertion:
        name: Impaired Lysosomal Enzyme Delivery
        description: A second cargo arm. Failure of endosomal tubule fission also disrupts sorting of
          the mannose 6-phosphate receptor, which is what delivers acid hydrolases to the lysosome, so
          lysosomal enzyme trafficking and lysosomal morphology are both disturbed. The M6PR mis-sorting
          step itself was measured for loss of spastin and IST1, the proteins that drive fission at ER-endosome
          contacts; strumpellin-deficient cells were shown to share the downstream lysosomal abnormalities
          rather than to be the system in which the receptor defect was demonstrated. This arm has no
          established clinical correlate in RSS1 and is curated as a mechanistic consequence rather than
          as an explanation for any listed phenotype.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: endosome organization
          term:
            id: GO:0007032
            label: endosome organization
          modifier: DECREASED
      selected_evidence:
        snippet: similar lysosomal abnormalities were seen in cellular models lacking the WASH complex
          component strumpellin or the ER morphogen REEP1
        supports: SUPPORT
        directness: INDIRECT
