  e2a4e128fc8f19001b4b6f8c06926140b7bbc7a2e0520c02291fe3e3ff5ea7a8:
    claim:
      about:
        disease:
          name: Ritscher-Schinzel Syndrome 1
          disease_term:
            preferred_term: Ritscher-Schinzel Syndrome 1
            term:
              id: MONDO:0009073
              label: Ritscher-Schinzel syndrome 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rss1_tissue_selectivity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Strumpellin is ubiquitously expressed and the WASH complex serves endosomal recycling
          in every cell, so why do the malformations concentrate in the cerebellum, the cardiac septa,
          and the craniofacial skeleton rather than appearing as a uniform multi-organ defect?
        attaches_to:
        - pathophysiology#Multisystem Developmental Malformation
        - pathophysiology#Reduced Cell-Surface Cargo Receptor Density
        rationale: 'Two observations make this sharper than the usual tissue-selectivity question. Strumpellin
          loss does not disturb bulk recycling: transferrin receptor traffic is normal while the beta-2-adrenergic
          receptor is mislocalised, so the defect is already cargo-selective at the cell level. And in
          the Commander-related forms of the syndrome, cell-surface proteomics showed that the reduction
          in surface cargo is itself tissue-specific. Which WASH-dependent cargoes are rate-limiting in
          cerebellar, cardiac, and neural crest development is unknown, and answering it would explain
          why one housekeeping defect produces this particular triad.'
      selected_evidence:
        snippet: through cell surface proteomics, that this reduces tissue-specific presentation of cell
          surface integral membrane proteins essential for kidney, bone, and brain development
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
