    evidence_metadata:
      reference: PMID:40601774
      reference_title: Ritscher-Schinzel syndrome can be characterized as an endosomal recyclinopathy.
      evidence_source: IN_VITRO
      explanation: Establishes that the surface-cargo deficit is tissue-specific in Ritscher-Schinzel
        syndrome, which is what frames the gap. The measurement was made on Commander subunits rather
