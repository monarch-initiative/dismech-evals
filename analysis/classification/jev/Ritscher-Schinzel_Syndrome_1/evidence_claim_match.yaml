      assertion_type: Pathophysiology
      assertion:
        name: WASHC5 Hypomorphic Loss of Function
        description: Biallelic WASHC5 (KIAA0196) variants reduce the abundance of functional strumpellin.
          The founder variant identified in the northern Manitoba First Nations cohort is a splice-site
          change that shifts the relative abundance of KIAA0196 transcripts and leaves approximately 40%
          of normal strumpellin protein. Disease alleles are hypomorphic rather than complete nulls, consistent
          with embryonic lethality of the homozygous murine knockout.
        biological_scale: MOLECULAR
        genetic_context:
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: The recurrent First Nations allele is a homozygous splice-site variant associated
            with an approximately eightfold change in the relative amount of the KIAA0196 transcript lacking
            exon 27 and a 60% reduction in strumpellin protein. Compound heterozygous WASHC5 alleles have
            been reported in a separate family.
      selected_evidence:
        snippet: All eight patients were homozygous for a novel splice site mutation in KIAA0196. RNA
          analysis revealed an approximate eightfold reduction in the relative amount of a KIAA0196 transcript
          lacking exon 27. A 60% reduction in the amount of strumpellin protein was observed on western
          blot.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24065355
      reference_title: 'A novel mutation in KIAA0196: identification of a gene involved in Ritscher-Schinzel/3C
        syndrome in a First Nations cohort.'
      evidence_source: HUMAN_CLINICAL
      explanation: The founding genetic study demonstrates the causal WASHC5 variant and quantifies the
