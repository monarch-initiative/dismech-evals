          complex on the endosomal membrane. The complex is the endosomal member of the WASP family and
          is the dedicated Arp2/3 activator at this compartment. It reaches the endosome by the unstructured
          tail of its FAM21 subunit binding retromer VPS35, an interaction that is both necessary and
          sufficient for the targeting, so the complex acts specifically where retromer is selecting cargo.
          This retromer-dependent recruitment is what makes the WASH route distinct from the SNX17-dependent
          Commander route that fails in the CCDC22 and VPS35L forms of the syndrome.
