              label: Ritscher-Schinzel syndrome 1
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical minimal diagnostic criteria
        description: Before molecular testing, the diagnosis rested on a proposed clinical triad of cardiac
          malformation other than isolated patent ductus arteriosus, posterior fossa malformation, and
          characteristic dysmorphic features. These criteria are not met by every patient with a molecular
          diagnosis, so they are useful for raising suspicion rather than for excluding the diagnosis.
        notes: 'The cited paper numbers the genetic forms the opposite way round to OMIM, MONDO and GeneReviews:
          it calls the CCDC22 form RTSCS1 and the WASHC5 form RTSCS2, while its own text correctly pairs
          CCDC22 with X-linked and WASHC5 with autosomal recessive inheritance. This entry follows the
          standard numbering, in which RTSCS1 is the WASHC5 form (OMIM 220210). The paper is cited here
          only for the syndrome-level diagnostic criteria and the case count, neither of which depends
          on the numbering.'
      selected_evidence:
        snippet: 'minimal diagnostic criteria has been proposed for the syndrome: Cardiac malformations
          (other than isolated patent ductus arteriosis), fossa posterior malformations, and certain dysmorphic
          features.'
        supports: SUPPORT
