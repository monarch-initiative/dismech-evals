          the allele is the dominant SPG8 one and complex abundance is unchanged.
        limitations: 'N471D causes dominant SPG8, not recessive RSS1, and the study reports it does not
          produce a typical SPG8 phenotype either. Mechanistically it is the wrong lesion for this entry:
          WASHC5-related interaction partners and complexes showed unchanged abundance in these animals,
          whereas RSS1 acts through reduced strumpellin and therefore reduced WASH complex abundance.
          The cardiac and ocular findings are suggestive but were not characterised as the RSS1 malformations,
          and no cerebellar or craniofacial malformation was reported. A knock-in of a patient RSS1 hypomorphic
          allele is what the question needs.'
