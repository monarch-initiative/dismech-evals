        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Cerebral Small-Vessel Vasculopathy
        - phenotypes#Intracranial aneurysm
        rationale: The cerebrovascular phenotype rests on case reports, yet GeneReviews now recommends
          neurovascular surveillance. The vasculopathy node has no upstream mechanism in this entry; the
          p53-dependent vascular disruption seen in the embryonic mouse limb is a possible lead but has
          not been examined in cerebral vessels.
      selected_evidence:
        snippet: This case expands not only the cerebral involvement in Roberts syndrome but also the
          disease spectrum of the neuroimaging triad with leukoencephalopathy, calcifications, and cysts.
        supports: SUPPORT
