      assertion_type: Pathophysiology
      assertion:
        name: ESCO2 Biallelic Loss of Function
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Homozygous or compound heterozygous ESCO2 variants that remove all or part of the
          C-terminal acetyltransferase domain (frameshift, nonsense and splice-site alleles, often in
          exon 3), or, rarely, missense changes in that domain such as W539G that abolish autoacetylation.
          Truncating alleles lower mRNA through nonsense-mediated decay and no truncated protein is detected
          in patient cells.
        gene:
          preferred_term: ESCO2
          term:
            id: hgnc:27230
            label: ESCO2
        genetic_context:
          gene:
            preferred_term: ESCO2
            term:
              id: hgnc:27230
              label: ESCO2
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic, homozygous or compound heterozygous; most alleles are protein-truncating.
        molecular_functions:
        - preferred_term: cohesin acetyltransferase activity
          term:
            id: GO:0061733
            label: protein-lysine-acetyltransferase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Since only protein-truncating mutations were identified, regardless of clinical severity,
          we conclude that genotype does not predict phenotype.
        supports: SUPPORT
    origin:
