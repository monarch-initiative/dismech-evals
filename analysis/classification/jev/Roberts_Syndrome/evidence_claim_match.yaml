      assertion_type: Discussion
      assertion:
        discussion_id: rbs_limb_reduction_mechanism
        prompt: Is limb reduction caused mainly by death of limb mesenchyme, by a proliferation shortfall,
          by p53-dependent vascular disruption, or by transcriptional dysregulation of limb genes?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Limb Bud Outgrowth Failure
        - mechanistic_hypotheses#mitotic_failure_progenitor_apoptosis
        - mechanistic_hypotheses#limb_vascular_disruption
        rationale: In the Esco2 limb mouse, p53 inhibition reduced apoptosis and rescued hemorrhage but
          not chondrogenesis, so apoptosis alone does not explain the reduction; the fin-regeneration
          and translation studies propose apoptosis-independent routes. No study has compared these arms
          in one mammalian system.
      selected_evidence:
        snippet: We had presumed that the extensive cell death in the mesenchyme was the underlying cause
          of the limb deficiency, but pifithrin-α treatment only recovered the hemorrhage in mutant limbs
          and not the chondrogenesis.
        supports: SUPPORT
