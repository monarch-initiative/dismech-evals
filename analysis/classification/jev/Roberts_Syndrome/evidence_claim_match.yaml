        description: In the developing mouse cortex Esco2 is expressed in late radial glial progenitors
          and TBR2-positive intermediate progenitors. Cortex-specific deletion (Emx1-Cre) causes massive
          apoptosis of these progenitors and their neuronal progeny, a drastic reduction in cortical neurons
          and failure of cortical layer formation; acute deletion shows ESCO2 is needed to maintain, not
          to generate, intermediate progenitors. This is the proposed basis of microcephaly and intellectual
          disability, conforming to the progenitor-pool-distortion node of the cortical progenitor module
          through its apoptosis branch. Shown only in the mouse.
        cell_types:
        - preferred_term: neural progenitor cell
