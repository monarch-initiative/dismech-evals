        features: 'ESCO2 at 8p21.1. Biallelic variants, homozygous or compound heterozygous. Almost all
          reported alleles truncate the protein (frameshift, nonsense, splice site), often in exon 3,
          and remove all or part of the C-terminal acetyltransferase domain; rare missense or in-frame
          changes in that domain (W539G) abolish acetyltransferase activity. The previously reported exon
          3 alleles c.760_761insA and c.764_765delTT were found again, homozygous, in consanguineous Egyptian
          families. Genotype does not predict severity: the same truncating classes occur at both ends
          of the spectrum, and variation in the efficiency of nonsense-mediated decay between tissues
          and individuals has been proposed to contribute to the variability. Facial severity correlates
          with limb severity, and corneal opacity may track specific alleles. The allelic Juberg-Hayward
          syndrome is caused by homozygous p.Arg552Ter.'
