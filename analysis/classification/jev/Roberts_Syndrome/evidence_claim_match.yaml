  4acaa546dcf38dd895304b690ae8ca9123d4fb271410a7bee498197ae7d6b4fe:
    claim:
      about:
        disease:
          name: Roberts Syndrome
          disease_term:
            preferred_term: Roberts-SC phocomelia syndrome
            term:
              id: MONDO:0100253
              label: Roberts-SC phocomelia syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rbs_mouse_lethality_mismatch
        prompt: Constitutive Esco2 loss is lethal in early mouse embryos, while humans with biallelic
          truncating ESCO2 variants are born and some reach adulthood. What supplies the residual function
          in human embryos, and how faithfully do tissue-restricted mouse knockouts model the human systemic-but-partial
          deficiency?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - animal_models#Mouse
        - pathophysiology#Reduced SMC3 Acetylation of Chromatin-Bound Cohesin
        rationale: The mismatch concerns the Esco2 constitutive knockout mouse; the animal_models#Mouse
          anchor resolves by species and so also matches the two conditional knockouts listed in this
          entry. The mouse data argue that Esco2 is not redundant with Esco1, whereas human survival implies
          partial redundancy or residual activity. The limb and cortex conclusions in this entry rest
          on conditional knockouts that delete Esco2 completely in one lineage, which is a different state
          from the human deficiency.
        proposed_experiments:
        - experiment_id: rbs_patient_allele_knockin_mouse
          experiment_design: TARGETED_PERTURBATION
          name: Patient-allele Esco2 knock-in mouse
          description: Introduce a recurrent human truncating allele constitutively and test whether embryos
            survive to show limb, craniofacial and cortical phenotypes, and whether Esco1 dosage modifies
            severity.
          supporting_outcome:
          - Viable homozygous embryos with symmetric limb reduction, clefting and microcephaly whose severity
            varies with Esco1 dosage.
          refuting_outcome:
          - Early embryonic lethality as in the null, indicating that the human allele retains no function
            in the mouse.
      selected_evidence:
        snippet: Partial redundancy between ESCO1 and ESCO2 may also occur in Roberts syndrome (RBS),
          an ESCO2 deficiency in humans that does not lead to the loss of viability
        supports: SUPPORT
