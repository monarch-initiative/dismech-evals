        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cohesin-Dependent Transcriptional Dysregulation
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        description: 'Changes in gene expression that are not explained by cell death or mTORC1 repression:
          imprinted genes (H19, GTL2), HOX genes and genes in nucleolar-associated domains in RBS cells;
          reduced cx43 expression in the regenerating zebrafish fin after esco2 knockdown, rescued by
          cx43 overexpression; and reduced ddb1 expression, linking ESCO2 to the CRL4 ubiquitin ligase
          through which thalidomide acts. Altered interphase positioning of pericentric heterochromatin
          in fetal nuclei has been proposed as a route. How much of the human phenotype this explains
          is unknown.'
      selected_evidence:
        snippet: In contrast, other genes are differentially expressed independent of L-leucine treatment,
          including imprinted genes such as H19 and GTL2, miRNAs regulated by GTL2, HOX genes, and genes
          in nucleolar associated domains.
        supports: SUPPORT
