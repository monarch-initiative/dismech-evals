      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mitotic_failure_progenitor_apoptosis
        hypothesis_label: Mitotic failure and p53-dependent loss of embryonic progenitors
        status: CANONICAL
        description: Loss of pericentric cohesion prolongs mitosis and causes missegregation and aneuploidy;
          the resulting stress activates p53, and rapidly dividing progenitors in the limb buds, face
          and cortex die or proliferate too little, so the structures they build are reduced. Supported
          by patient cytogenetics and by fish and mouse models. It is qualified by the finding that patient
          lymphoblastoid lines show cell death without lengthened cell cycles, and by the Esco2 limb mouse,
          where p53 inhibition reduced apoptosis without restoring chondrogenesis.
      selected_evidence:
        snippet: Therefore, RS has been interpreted as a human mitotic mutation syndrome which leads to
          secondary developmental defects.
        supports: SUPPORT
