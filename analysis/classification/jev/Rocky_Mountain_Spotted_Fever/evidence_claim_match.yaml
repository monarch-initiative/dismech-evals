              label: Rocky mountain spotted fever
        context: []
      assertion_type: Treatment
      assertion:
        name: Tick-bite prevention counseling
        action_category: COUNSELING_INFORMATIONAL
        therapeutic_modality: BEHAVIORAL
        description: No vaccine is licensed against tickborne rickettsial diseases, so primary prevention
          rests entirely on interrupting the tick-inoculation step that triggers the pathograph. Personal
          protective measures are DEET at 20-30 percent on skin, with IR3535 or picaridin above 15 percent
          as alternatives; permethrin applied to outer clothing but never to skin, which reduces tick
          bites by more than 80 percent among outdoor workers; protective clothing; and prompt tick checks
          and bathing after time in tick habitat, since several hours may elapse before an attached tick
          transmits the organism. Prophylactic doxycycline after a tick bite is explicitly not recommended,
          and asymptomatic seropositive persons should not be treated - antibody can persist for months
          to years, so serology cannot be used to monitor treatment response.
        treatment_term:
          preferred_term: tick-bite prevention counseling
          term:
            id: NCIT:C181743
            label: Behavioral Counseling
      selected_evidence:
        snippet: Prophylactic use of doxycycline after a tick bite is not recommended for the prevention
          of tickborne rickettsial diseases.
        supports: SUPPORT
