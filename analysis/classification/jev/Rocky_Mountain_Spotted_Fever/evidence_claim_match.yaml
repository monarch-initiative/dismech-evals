      assertion_type: Treatment
      assertion:
        name: Pet acaricide use and peridomestic tick control
        action_category: THERAPEUTIC
        therapeutic_modality: OTHER
        description: Because dogs are the primary host of Rhipicephalus sanguineus, the brown dog tick
          that drives the epidemic RMSF foci in Arizona tribal communities and northern Mexico, controlling
          ticks on dogs is a population-level intervention against the same inoculation step. Monthly
          topical acaricides, acaricidal tick collars, oral acaricidal products, and acaricidal shampoos
          reduce human exposure to ticks carried by pets. This is the intervention that maps onto the
          peridomestic transmission cycle recorded in this entry's environmental risk factors, and it
          addresses a route that individual repellent use does not.
        treatment_term:
          preferred_term: pet ectoparasite control
          term:
            id: NCIT:C15843
            label: Preventive Intervention
      selected_evidence:
        snippet: dogs serve as the primary host for Rh. sanguineus, which is known to transmit R. rickettsii
          both to humans and dogs in certain geographic areas
        supports: SUPPORT
