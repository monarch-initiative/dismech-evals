      assertion_type: Treatment
      assertion:
        name: Empiric doxycycline for patients of all ages
        description: 'Doxycycline is the drug of choice for RMSF in patients of all ages, including children
          under 8 years, and should be started immediately on clinical suspicion without waiting for laboratory
          confirmation. Patients treated after the fifth day of illness are more likely to die. The historical
          reluctance to use doxycycline in young children is not supported: children who received courses
          of doxycycline before age 8 showed no tetracycline-like dental staining and no difference in
          tooth shade or enamel hypoplasia. Agents to avoid - sulfonamide antimicrobials can result in
          increased disease severity and death in RMSF.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
