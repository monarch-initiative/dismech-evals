      assertion_type: EpidemiologyInfo
      assertion:
        name: Treatment delay as the dominant determinant of death
        description: Delay in diagnosis and treatment is the most important factor associated with death.
          Patients treated after the fifth day of illness are more likely to die, and in a high-incidence
          Arizona region doxycycline was started a median of four days later in fatal than in nonfatal
          cases.
        factors:
        - delayed doxycycline initiation
        - late-onset or absent rash
        - atypical or gastrointestinal early manifestations
        - absence of a reported tick bite
      selected_evidence:
        snippet: Delay in diagnosis and treatment is the most important factor associated with increased
          likelihood of death, and early empiric therapy is the best way to prevent RMSF progression.
        supports: SUPPORT
