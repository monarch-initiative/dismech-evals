              label: doxycycline
      selected_evidence:
        snippet: Doxycycline is the drug of choice for treatment of all tickborne rickettsial diseases
          in patients of all ages, including children aged <8 years, and should be initiated immediately
          in persons with signs and symptoms suggestive of rickettsial disease
