        context: []
      assertion_type: Treatment
      assertion:
        name: Chloramphenicol as second-line therapy
        description: Chloramphenicol is the only alternative drug that has been used to treat RMSF, and
          it is clearly inferior to doxycycline - CDC case-report data show higher mortality in chloramphenicol-treated
          patients. It is no longer available orally in the United States, requires monitoring of blood
          indices for hematologic toxicity, and does not cover ehrlichiosis or anaplasmosis, so empiric
          substitution leaves those co-endemic infections untreated. In pregnancy it is a potential alternative
          to doxycycline, but administration late in the third trimester carries a theoretical risk of
          gray baby syndrome. Because doxycycline has been used successfully in pregnant women and RMSF
          is potentially fatal, doxycycline remains preferred for suspected RMSF in pregnancy; chloramphenicol
          is reserved for true doxycycline intolerance.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: chloramphenicol
            term:
              id: CHEBI:17698
              label: chloramphenicol
      selected_evidence:
        snippet: Chloramphenicol is the only alternative drug that has been used to treat RMSF; however,
          epidemiologic studies using CDC case report data suggest that patients with RMSF treated with
          chloramphenicol are at higher risk for death than persons who received a tetracycline
        supports: SUPPORT
