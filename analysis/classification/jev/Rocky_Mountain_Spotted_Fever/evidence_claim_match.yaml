      assertion:
        name: Endothelial Cell Invasion and Intracytoplasmic Replication
        biological_scale: CELLULAR
        description: R. rickettsii is an obligate intracellular organism that primarily infects vascular
          endothelial cells, and less commonly the underlying smooth muscle cells of small and medium
          vessels. Adhesion and invasion are mediated by the conserved rOmpA and rOmpB surface autotransporters
          engaging host receptors (Ku70 identified for the closely related R. conorii); after entry the
          organism escapes into the cytoplasm and replicates. Individual adhesins are redundant - an isogenic
          rOmpA knockout in a virulent strain did not attenuate virulence in guinea pigs.
        cell_types:
        - preferred_term: vascular endothelial cell
          term:
