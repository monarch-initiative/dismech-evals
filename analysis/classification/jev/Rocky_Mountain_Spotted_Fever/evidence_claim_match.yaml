      assertion_type: Diagnosis
      assertion:
        name: Immunohistochemical staining of a skin punch biopsy
        description: Immunostaining (immunohistochemistry or immunofluorescence) for rickettsial antigen
          in formalin-fixed, paraffin-embedded skin punch biopsy of a rash lesion or eschar is a rapid
          confirmatory technique that, unlike serology, can establish the diagnosis during acute illness.
          It is highly specific but only moderately sensitive, so a negative stain does not exclude RMSF.
        diagnosis_term:
          preferred_term: skin biopsy immunohistochemistry
          term:
            id: NCIT:C23020
            label: Immunohistochemistry Staining Method
        results: Detection of spotted fever group rickettsial antigen in dermal microvascular endothelium;
          approximately 100% specific and 70% sensitive.
      selected_evidence:
        snippet: For patients with a rash or eschar, immunohistochemical staining of a skin punch biopsy
          is a useful diagnostic technique
        supports: SUPPORT
