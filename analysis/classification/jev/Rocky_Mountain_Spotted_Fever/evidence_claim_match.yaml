      assertion:
        name: Rickettsial Ribosomal Translation
        role: therapeutic_vulnerability
        conforms_to: bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome
        biological_scale: MOLECULAR
        description: R. rickettsii, like other bacteria, depends on 70S-ribosome translation of its mRNA.
          Doxycycline, a tetracycline, binds the 30S ribosomal subunit and blocks aminoacyl-tRNA delivery
          to the A site, arresting bacterial protein synthesis. This ribosomal target - not a cell-wall
          target - is why a tetracycline rather than a beta-lactam is the drug of choice.
        biological_processes:
        - preferred_term: Translation
          term:
            id: GO:0006412
            label: translation
      selected_evidence:
        snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
      evidence_path: /pathophysiology/9/evidence/0
      context_paths:
