      - /disease_term
    evidence_metadata:
      reference: PMID:24336183
      reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
      evidence_source: OTHER
      explanation: Review establishing the bacterial ribosome as the target of tetracyclines and other
        protein-synthesis inhibitors, the step this node represents. Evidence source is OTHER as this
