              id: MONDO:0019359
              label: Rocky mountain spotted fever
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Whole-blood PCR for Rickettsia rickettsii
        description: Real-time PCR amplification of R. rickettsii DNA from whole blood can confirm infection
          during the acute stage, but sensitivity is low because few rickettsiae circulate before advanced
          disease; tissue specimens are a better source of spotted fever group rickettsial DNA than acute
          blood. Blood should be drawn before antibacterial agents are given, because doxycycline reduces
          PCR sensitivity. A negative PCR result therefore never excludes RMSF and must not delay empiric
          doxycycline.
        diagnosis_term:
          preferred_term: polymerase chain reaction
          term:
            id: NCIT:C17003
            label: Polymerase Chain Reaction
        results: A positive result confirms rickettsial infection and identifies the species; a negative
          result is uninformative in early or mild disease.
      selected_evidence:
        snippet: PCR detection of R. rickettsii in whole blood is possible but less sensitive because
          low numbers of rickettsiae typically circulate in the blood in the absence of advanced disease
        supports: SUPPORT
