  b5ec8cfe8cfdc7980d2a2a3d63bb2e859341e0d7b708351f6be088dec5d789bf:
    claim:
      about:
        disease:
          name: Rocky Mountain spotted fever
          disease_term:
            preferred_term: Rocky mountain spotted fever
            term:
              id: MONDO:0019359
              label: Rocky mountain spotted fever
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rmsf_surrogate_species_permeability_mechanism
        prompt: Does the VE-cadherin phosphorylation mechanism of microvascular hyperpermeability, demonstrated
          with the non-pathogenic surrogate Rickettsia montanensis under BSL2 conditions, hold quantitatively
          for Rickettsia rickettsii in human microvasculature?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#VE-Cadherin Phosphorylation and Adherens Junction Disruption
        - pathophysiology#Increased Microvascular Permeability
        rationale: The junctional mechanism curated on this entry is the best available molecular account
          of RMSF microvascular leak, but the biophysical and biochemical experiments were deliberately
          performed with R. montanensis, a genetically similar but non-pathogenic species chosen so the
          work could be done at biosafety level 2. Virulent R. rickettsii strains differ from avirulent
          relatives in outer-membrane protein expression, so the magnitude and kinetics of junctional
          disruption - and any pathogen-specific effector contribution - are not established for the disease-causing
          organism. The complementary in vivo permeability evidence comes from experimentally infected
          dogs rather than humans.
        proposed_experiments:
        - experiment_id: exp_rmsf_ve_cadherin_bsl3
          name: VE-cadherin phosphorylation assays with virulent R. rickettsii
          description: Repeat the atomic force microscopy and VE-cadherin phosphorylation assays using
            virulent R. rickettsii in human microvascular endothelial cells under BSL3 containment, to
            test whether the surrogate result holds for the pathogenic organism.
        - experiment_id: exp_rmsf_virulent_vs_avirulent_junction
          name: Virulent versus avirulent strain comparison of junctional disruption
          description: Compare adherens-junction disruption between the virulent Sheila Smith and avirulent
            Iowa strains of R. rickettsii to test whether the magnitude of the effect tracks with virulence.
        - experiment_id: exp_rmsf_human_tissue_junction
          name: Junctional integrity in human RMSF tissue
          description: Assess VE-cadherin phosphorylation and adherens-junction integrity in autopsy or
            skin-biopsy tissue from human RMSF cases to establish whether the in vitro mechanism is present
            in human disease.
      selected_evidence:
        snippet: R. montanensis, which is genetically similar to R. rickettsii and R. conorii, and displays
          a similar ability to invade cells, but is non-pathogenic and can be experimentally manipulated
          under Biosafety Level 2 (BSL2) conditions
        supports: SUPPORT
