      assertion_type: DifferentialDiagnosis
      assertion:
        name: Meningococcemia
        description: RMSF-associated cutaneous necrosis and gangrene can be difficult to distinguish clinically
          from purpura fulminans associated with meningococcemia.
        distinguishing_features:
        - Purpura fulminans of meningococcemia closely mimics RMSF cutaneous necrosis
        - Tick exposure history and acral-onset rash favour RMSF
        - Both warrant concurrent empiric therapy while awaiting diagnostic information
      selected_evidence:
