              id: MONDO:0019359
              label: Rocky mountain spotted fever
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Leukocytoclastic vasculitis with nuclear dust
        description: Leukocytoclastic vasculitis with a neutrophilic infiltrate and nuclear dust was present
          in 11 of 15 involved-skin specimens. It represents progression from the earlier lymphohistiocytic
          lesion, and the authors classify the vasculitis of RMSF as a septic vasculitis caused by direct
          rickettsial endothelial damage rather than an immune-complex process - a distinction that matters
          for the differential against idiopathic cutaneous vasculitis.
        finding_term:
          preferred_term: leukocytoclastic vasculitis
          term:
            id: NCIT:C35867
            label: Morphologic Finding
        frequency: FREQUENT
        context: Involved skin specimens; 11 of 15 (73 percent).
      selected_evidence:
        snippet: We studied a series of 26 cases of RMSF, of which 10 were surgical specimens and 16 were
          autopsies. ... Leukocytoclastic vasculitis (LCV) with neutrophilic infiltrate and nuclear dust
          was seen in 11 of 15 (73%) specimens from involved skin. ... The cutaneous histopathology of
          RMSF is caused by endothelial damage by the rickettsial organisms which elicit an initial lymphohistiocytic
          small vessel vasculitis with progression to LCV. The vasculitis in RMSF is, therefore, considered
          to be a form of septic vasculitis.
        supports: SUPPORT
