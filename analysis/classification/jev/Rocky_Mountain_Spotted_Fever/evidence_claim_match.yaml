          term:
            id: GO:0044409
            label: symbiont entry into host
          modifier: INCREASED
      selected_evidence:
        snippet: R. rickettsii is an obligate intracellular pathogen that primarily infects vascular endothelial
          cells, and, less commonly, underlying smooth muscle cells of small and medium vessels
