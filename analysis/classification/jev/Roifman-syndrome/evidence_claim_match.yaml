      assertion_type: Pathophysiology
      assertion:
        name: Defective U12-Type Minor Intron Splicing
        conforms_to: spliceosome_component_dysfunction#Mis-Splicing of a Sensitive Transcript Subset
        biological_scale: MOLECULAR
        description: U4atac base-pairs U6atac and licenses it to catalyse excision of U12-type minor introns,
          which occur in roughly 750 human genes. Destabilizing U4atac causes intron retention and elevated
          alternative splicing in that gene set, shifting the tissue-specific distribution of mRNA isoforms.
          Because the affected gene set is small but functionally clustered, the downstream consequences
          are selective rather than global - which is why one snRNA lesion produces an immune, a skeletal
          and a ciliary phenotype rather than generalized cell failure.
        biological_processes:
        - preferred_term: U12-type (minor) intron splicing
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: DECREASED
        cellular_components:
        - preferred_term: U12-type (minor) spliceosome
          term:
            id: GO:0005689
            label: U12-type spliceosomal complex
      selected_evidence:
        snippet: Defective minor intron splicing as a consequence of deleterious biallelic variants in
          RNU4ATAC results in intron retention and elevated alternative splicing, affecting the tissue-specific
          distribution of mRNA isoforms.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
