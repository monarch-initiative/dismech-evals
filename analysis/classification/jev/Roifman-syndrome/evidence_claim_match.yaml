      assertion_type: Environmental
      assertion:
        name: Immunizations
        description: Ensure up-to-date vaccines due to immunodeficiency.
      selected_evidence:
        snippet: As infections condition the final prognosis of most PIDs, clearly defined prophylactic
          practices are essential. In most cases, intravenously or subcutaneously administered immunoglobulin
          remains the mainstay of treatment, although antibiotics and antifungals can be added under some
          conditions, particularly when the infections are highly recurrent despite immunoglobulin replacement.
          Vaccines could also play a role, but their administration leads to different results depending
          on the type of PID.
        supports: SUPPORT
