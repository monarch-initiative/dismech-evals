      assertion_type: Pathophysiology
      assertion:
        name: Biallelic RNU4ATAC Variants Sparing the 5' Stem-Loop
        conforms_to: spliceosome_component_dysfunction#Germline Spliceosome Component Variant
        biological_scale: MOLECULAR
        role: trigger
        description: 'RNU4ATAC encodes U4atac, a non-protein-coding snRNA of the minor spliceosome. Roifman
          syndrome arises from compound heterozygous variants in which at least one allele spares the
          5'' stem-loop - typically one variant at the 5'' stem-loop or the Sm-binding element and the
          second in stem II. This genotype rule is what separates Roifman syndrome from MOPD I: variants
          located exclusively in the 5'' stem-loop give the severe lethal MOPD I phenotype, because that
          region is where U4atac binds the essential di-snRNP proteins.'
        genes:
        - preferred_term: RNU4ATAC
          term:
            id: hgnc:34016
            label: RNU4ATAC
      selected_evidence:
        snippet: whole-genome sequencing of Roifman Syndrome patients to reveal compound heterozygous
          rare variants that disrupt highly conserved positions of the RNU4ATAC small nuclear RNA gene
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
