          signal: B-cell activating factor (BAFF) is abundantly available, yet development past the BAFF-dependent
          stage is crippled, because minor splicing of MAPK1 - the critical signalling component downstream
          of BAFF - is disturbed. So the cell has the ligand and lacks the ability to transduce it.'
