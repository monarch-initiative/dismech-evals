          Dysplasias", row "MOPD1 Deficiency (Roifman syndrome)" (gene RNU4ATAC, AR, OMIM 601428). IUIS
          conflates the two RNU4ATAC phenotypes in a single row headed "MOPD1 Deficiency (Roifman syndrome)";
          the phenotype the row describes — antibody deficiency with spondyloepiphyseal dysplasia and
          retinal dystrophy — is Roifman syndrome, i.e. this entry. The KB's separate MOPD1 entry is not
          classified by this row.
