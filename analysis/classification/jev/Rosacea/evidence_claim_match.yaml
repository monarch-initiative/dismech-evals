          value:
            name: SZ95 sebocyte and live Demodex mite co-culture
            experimental_model_type: CO_CULTURE
            description: Immortalized human SZ95 sebocytes co-cultured with live Demodex mites extracted
              from normal facial skin, or exposed to mite-conditioned medium, in time- and mite-dose-dependent
              experiments with Toll-like receptor pathway gene and protein readouts. The only system in
              which the mite is the applied perturbation against a human sebaceous cell, the compartment
              where Demodex lives in vivo.
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            cell_types:
            - preferred_term: SZ95 sebocyte
              term:
                id: CL:0000317
                label: sebocyte
            conditions:
            - SZ95 sebocytes with live Demodex mites (low and high mite numbers)
            - SZ95 sebocytes with Demodex-conditioned medium
            - untreated SZ95 sebocytes
            culture_system: Immortalized SZ95 sebocyte line; live mites or mite-conditioned medium; TLR-pathway
              expression by RT-PCR array and protein assays; cytokine secretion by ELISA over a 48-hour
              time course.
            publication: PMID:29532463
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Demodex Folliculorum Proliferation
        relationship: PERTURBS
        fidelity: MODERATE
        model_scale: CELLULAR
        description: Mite number is the controlled input, so the system tests what a rising mite load
          does to the sebocyte rather than reproducing follicular proliferation itself.
        limitations: Mites came from normal donors and were applied to a monoculture with no follicular
          architecture, keratinocytes or immune cells; the TLR response was biphasic (early down-modulation,
          up-regulation after 48 h), so single-time-point readouts can mislead.
        divergences:
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: The follicle, its keratinocytes and the immune cells that respond to mite-derived
            signals in vivo are outside the model; only the sebocyte's own response is observed.
        readouts:
        - name: Interleukin-8 secretion versus mite number
          target: Demodex Folliculorum Proliferation
          direction: INCREASED
          interpretation: Mite-load-dependent pro-inflammatory cytokine output from sebocytes; low numbers
            did not induce it.
      selected_evidence:
        snippet: Live Demodex mites were extracted from normal facial skin of control subjects and used
          in cell stimulation experiments with the immortalized SZ95 sebocyte line.
        supports: SUPPORT
    origin:
