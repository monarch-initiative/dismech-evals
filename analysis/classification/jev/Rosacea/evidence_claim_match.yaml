  31019d3768eba111828916f07f426c28a3c68176c6d18717431de5a405c69ddb:
    claim:
      about:
        disease:
          name: Rosacea
          disease_term:
            preferred_term: rosacea
            term:
              id: MONDO:0006604
              label: rosacea
        context: []
      assertion_type: AnimalModel
      assertion:
        name: LL-37 intradermal injection mouse model
        species: Mouse
        genotype: Wild type (induced model)
        background: BALB/c
        publication: PMID:17676051
        description: Repeated intradermal injection of the rosacea-associated cathelicidin fragment LL-37
          into mouse dorsal skin, introduced by Yamasaki et al. (2007) alongside SCTE/KLK5 addition and
          Spink5 deletion, reproduces erythema, leukocyte infiltration and epidermal/dermal thickening.
          Prolonged (20-day) twice-daily administration adds dermal collagen deposition with alpha-SMA,
          TNF-alpha, vimentin and COL1 induction, and lesions that do not fully recover. It is the standard
          induced model for TLR/LL-37, mast cell, mTORC1, NLRP3 and neurovascular studies; datasets geo:GSE147950
          and geo:GSE308876 in this entry derive from it.
        modeled_mechanisms:
        - target: LL-37 generation
          relationship: PERTURBS
          fidelity: MODERATE
          model_scale: TISSUE
          description: Exogenous LL-37 substitutes for endogenous KLK5-mediated cathelicidin processing,
            so the model enters the pathway at the LL-37 step rather than recapitulating its generation.
          limitations: Bypasses upstream initiation (barrier injury, TLR2 induction, KLK5 processing);
            uses supraphysiological bolus dosing; dorsal murine skin lacks the sebaceous density and facial
            neurovascular anatomy of human centrofacial skin; no spontaneous relapse.
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: The TLR2 induction and KLK5 processing that generate LL-37 in human disease are
              outside the model; the peptide is supplied directly.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Mouse dorsal skin differs from human centrofacial skin in sebaceous unit density,
              vascular and sensory-nerve anatomy, and immune composition.
        - target: Immune cell infiltration
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Dermal inflammatory-cell aggregation with epidermal and dermal thickening after
            repeated LL-37 injection.
          limitations: Infiltrate composition in mouse dorsal skin has not been shown to match the Th1/Th17,
            mast cell and macrophage/dendritic profile of human lesions.
          readouts:
          - name: Dermal inflammatory cell aggregation on H&E
            target: Immune cell infiltration
            direction: INCREASED
            interpretation: Histological correlate of the immune infiltration node in this model.
        - target: Fibrotic dermal remodeling
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: TISSUE
          description: Prolonged LL-37 dosing produces dermal collagen deposition with alpha-SMA and COL1
            induction that persists after injections stop.
          limitations: Collagen deposition appears only with long-term dosing and is diffuse dorsal-skin
            fibrosis, not the sebaceous and soft-tissue hyperplasia of phymatous nasal disease; short-term
            dosing produces no fibrosis and fully recovers.
          readouts:
          - name: Dermal collagen deposition with alpha-SMA and COL1 induction
            target: Fibrotic dermal remodeling
            direction: INCREASED
            interpretation: Van Gieson collagen staining plus immunofluorescence/Western blot for myofibroblast
              and collagen markers.
        - target: Angiogenic vascular remodeling
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Long-term LL-37 induction produces dermal angiogenesis alongside skin thickening.
          limitations: Reported as a histological feature of the long-term protocol; the short-term protocol
            does not develop it.
        - target: Sebaceous gland and soft tissue hyperplasia/fibrosis
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: TISSUE
          description: Long-term LL-37 induction produces sebaceous gland hypertrophy with dermal thickening,
            the earliest tissue-level analogue of phymatous change.
          limitations: Dorsal murine sebaceous hypertrophy is not nasal rhinophyma; the model lacks the
            human nose's sebaceous density and the decades-long course over which phyma develops.
      selected_evidence:
        snippet: In mice, injection of the cathelicidin peptides found in rosacea, addition of SCTE, and
          increasing protease activity by targeted deletion of the serine protease inhibitor gene Spink5
          each increases inflammation in mouse skin.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17676051
      reference_title: Increased serine protease activity and cathelicidin promotes skin inflammation
        in rosacea.
      evidence_source: MODEL_ORGANISM
      explanation: The founding description of LL-37 injection as a rosacea-like inflammation model.
