  6a128c67249590e428fddc541ecae5c0a68e22020105d5bb5ec519b5cbf0479d:
    claim:
      about:
        disease:
          name: Rosacea
          disease_term:
            preferred_term: rosacea
            term:
              id: MONDO:0006604
              label: rosacea
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_rosacea_innervated_vascularized_nam
        prompt: Can the neurovascular arm of rosacea (TRP-channel sensory activation, CGRP and substance
          P release, and the vasodilation behind flushing and burning) be modelled in a human non-animal
          system, given that every current NAM lacks sensory neurons and perfused microvessels?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#TRP and neuropeptide signaling
        - pathophysiology#Neurovascular vasodilation
        - experimental_models#
        rationale: 'The three NAMs in this entry cover the innate-immune and sebaceous arms: the papulopustular
          explant keeps the resident multicellular circuit, the SZ95 co-culture isolates the mite-sebocyte
          interface, and HaCaT keratinocytes reproduce TLR2 induction. None contains sensory neurons or
          a perfused vascular bed, so the flushing and burning phenotypes, and the fibroblast-derived
          vasodilatory signalling that single-cell profiling places upstream of them, can only be studied
          in the facial LL-37 mouse. Generic innervated and vascularized skin-on-chip platforms exist,
          but no rosacea-specific application has been published, so this is recorded as an absence of
          evidence rather than a mismatch between model and human.'
        proposed_experiments:
        - experiment_id: exp_rosacea_innervated_vascularized_skin_chip
          name: Innervated, vascularized skin-on-chip built from rosacea fibroblasts
          description: Reconstruct full-thickness skin on a perfusable microfluidic chip with a dermal
            microvessel network, patient-derived (or PTGDS-high pro-inflammatory) dermal fibroblasts,
            keratinocytes, mast cells and iPSC-derived TRPV1-positive sensory neurons; challenge with
            LL-37, heat and capsaicin; measure neuropeptide release, vessel dilation and permeability,
            and mast cell degranulation, with and without a CGRP receptor antagonist.
          perturbations:
          - name: LL-37 challenge
            target: pathophysiology#LL-37 generation
            description: Apply the processed cathelicidin peptide at lesional concentrations to the epidermal
              compartment.
          - name: Heat and capsaicin challenge
            target: pathophysiology#TRP and neuropeptide signaling
            description: Thermal ramp and capsaicin to activate TRPV1 on the innervating sensory neurons.
          readouts:
          - name: CGRP and substance P in the dermal effluent
            target: pathophysiology#TRP and neuropeptide signaling
            direction: INCREASED
            interpretation: Neuropeptide release from innervating sensory neurons on challenge.
          - name: Microvessel diameter and permeability
            target: pathophysiology#Neurovascular vasodilation
            direction: INCREASED
            interpretation: Live-imaged vasodilation and dextran leak, the tissue-level readout of flushing.
          controls:
          - name: Neuron-free chips
            description: Otherwise identical chips built without sensory neurons, to show which readouts
              require innervation.
          - name: Control-donor fibroblast arm
            description: Chips built with fibroblasts from healthy donors to test whether the rosacea
              fibroblast state is required for amplification.
          - name: Vehicle challenge
            description: Buffer-only challenge to establish the baseline vessel and neuropeptide response
              of the platform.
          would_support:
          - pathophysiology#TRP and neuropeptide signaling
          - pathophysiology#Neurovascular vasodilation
          would_refute:
          - pathophysiology#Neurovascular vasodilation
          supporting_outcome:
          - LL-37, heat or capsaicin evokes CGRP release and vessel dilation that a CGRP receptor antagonist
            blocks, and rosacea-derived fibroblasts amplify the response relative to control-donor fibroblasts.
          refuting_outcome:
          - Vessel dilation on challenge is unchanged by building the chip without sensory neurons or
            by CGRP receptor antagonism, placing the vasodilation outside the neuropeptide arm this experiment
            models.
          decision_criterion: A reproducible, antagonist-sensitive coupling from neuropeptide release
            to vessel dilation in at least three independent chip builds.
        notes: Posed after the 2026-09 NAM curation. Generic innervated skin-on-chip and vascularized
          skin-equivalent platforms are published outside rosacea; the gap is their application to this
          disease, not their existence.
      selected_evidence:
        snippet: Increased expression of the temperature-sensitive receptors TRPV4 and TRPM8 was found
          in pruritic mouse skin and TG and human skin samples.
        supports: SUPPORT
