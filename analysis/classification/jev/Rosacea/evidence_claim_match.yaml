  22789898944e98dc17a72689f229ab9043358c8ea1224a2306c71e423663d64e:
    claim:
      about:
        disease:
          name: Rosacea
          disease_term:
            preferred_term: rosacea
            term:
              id: MONDO:0006604
              label: rosacea
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: phyma_fibroblast_identity
        hypothesis_label: Rhinophyma fibroblasts are an inflammation-associated activated state lacking
          the POSTN/CTHRC1 scar-persistence program, not a scar-type myofibroblast
        status: EMERGING
        applies_to_subtypes:
        - Phymatous Rosacea
        description: 'Single-cell transcriptomics of papulopustular rosacea identifies an expanded pro-inflammatory
          fibroblast population, marked by PTGDS, as the leading source of inflammatory and vasodilatory
          signals, and fibroblast depletion or PTGDS knockdown blocks disease in mice. Rhinophyma, the
          end-stage phymatous lesion, is clinically fibrotic yet reverts toward normal after surgical
          debulking, unlike hypertrophic scar. The hypothesis is that the phyma fibroblast is the same
          inflammation-driven state as the papulopustular fibroblast, persisting rather than transitioning
          to a scar-type myofibroblast, which would explain both the reversibility and why the fibrotic
          remodeling node feeds phymatous change. An exploratory comparison of the rhinophyma versus hypertrophic
          scar versus healthy skin single-cell atlas (ArrayExpress E-MTAB-16629) against the published
          papulopustular fibroblast markers asks whether rhinophyma fibroblasts carry the PTGDS pro-inflammatory
          signature or the ACTA2/COL1A1 myofibroblast signature of scar. Downstream causal edges that
          belong to this hypothesis opt in via hypothesis_groups: [phyma_fibroblast_identity].'
        notes: 'Exploratory dataset run on arrayexpress:E-MTAB-16629 (kb/hypotheses/Rosacea/phyma_fibroblast_identity/,
          assessed PARTIALLY_SUPPORTED): in the one rhinophyma donor, PTGDS is lowest in rhinophyma fibroblasts
          (5.0% positive) and highest in healthy fibroblasts (54.5%), tracks the quiescent markers CFD
          and APOD, and the PTGDS-high rhinophyma cells are endothelial, so the PTGDS marker from papulopustular
          disease does not transfer and was removed from the label. Rhinophyma fibroblasts are ACTA2-activated
          but POSTN- and CTHRC1-low (3.1% and 8.0% positive versus 46.4% and 43.4% in hypertrophic scar)
          with CCL19, CXCL12 and CCL2 above scar levels, supporting the non-scar-myofibroblast identity
          that the label now states. One donor per condition, marker-score lineage assignment and a proxy
          signature bound every claim. The papulopustular single-cell data of Chen et al. have no public
          accession, so a joint embedding, the analysis that would settle this, was not possible.'
      selected_evidence:
        snippet: Depletion of fibroblasts or knockdown of PTGDS, a gene specifically upregulated in fibroblasts,
          blocks rosacea development in mice.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/3
      evidence_path: /mechanistic_hypotheses/3/evidence/1
