        context: []
      assertion_type: AnimalModel
      assertion:
        name: Facial LL-37 injection mouse model with trigeminal readouts
        species: Mouse
        genotype: Wild type (induced model)
        publication: PMID:36517318
        description: 'A variant of the LL-37 model in which the peptide is injected intradermally into
          the face rather than the dorsum, so that lesions form in facial skin innervated by the trigeminal
          ganglion. Used to study the sensory symptoms of rosacea: facial injection produced rosacea-like
          lesions together with pruritus-indicative behaviour, and the temperature-sensitive channels
          TRPV4 and TRPM8 were increased in both the lesional skin and the trigeminal ganglion, matching
          increases in human rosacea skin. This is the only rodent model in this entry that uses the facial
          site and its native sensory innervation.'
        modeled_mechanisms:
        - target: TRP and neuropeptide signaling
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Facial LL-37 lesions are accompanied by increased TRPV4 and TRPM8 in skin and in
            the trigeminal ganglion, with pruritus behaviour, so the model reports the sensory-neuron
            arm of the neurovascular program at its anatomically correct site.
          limitations: Reports itch-related TRPV4/TRPM8 rather than the TRPV1/TRPA1-CGRP axis usually
            invoked for flushing and burning; behavioural pruritus scoring in mice is an indirect proxy
            for human sensory symptoms; mouse facial skin still differs from human centrofacial skin in
            sebaceous and vascular density.
          readouts:
          - name: TRPV4 and TRPM8 expression in lesional facial skin and trigeminal ganglion
            target: TRP and neuropeptide signaling
            direction: INCREASED
            interpretation: Transcript and protein increase of temperature-sensitive TRP channels in the
              skin and its sensory ganglion, paralleled in human rosacea skin samples.
      selected_evidence:
        snippet: The LL-37 was injected intradermally into the face of mice to establish the animal model.
        supports: SUPPORT
    origin:
