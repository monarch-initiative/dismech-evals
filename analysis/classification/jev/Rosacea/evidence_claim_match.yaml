              label: rosacea
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NLRP3 Inflammasome Activation
        description: Rosacea skin over-expresses inflammasome components (NLRP3/NALP-3, caspase-1) together
          with IL-1beta, most strongly in papulopustular disease. Reviews place the inflammasome downstream
          of LL-37 as one route from cathelicidin signaling to IL-1beta maturation and the neutrophilic
          papulopustular lesion; the paired transcriptomic and proteomic explant dataset geo:GSE155141
          in this entry independently implicates IL-1beta as a central lesional mediator.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: NLRP3 inflammasome complex assembly
          modifier: INCREASED
          term:
            id: GO:0044546
            label: NLRP3 inflammasome complex assembly
        - preferred_term: interleukin-1 beta production
          modifier: INCREASED
          term:
            id: GO:0032611
            label: interleukin-1 beta production
        notes: A dataset-analysis run on the paired papulopustular explant series geo:GSE155141 (kb/hypotheses/Rosacea/ll37_nlrp3_il1b_papulopustular/)
          found IL-1beta induces NLRP3 mRNA in non-lesional explants (paired p = 0.025, not FDR-significant
          at n = 5) but no steady-state lesional versus non-lesional change in NLRP3, CASP1, PYCARD, IL1B
          or IL18. That null does not reproduce the PPR-enriched over-expression reported by Casas 2012
          at the transcript level; the node's support therefore rests mainly on the mouse loss-of-function
          evidence and the LL-37 axis, not on lesional expression.
      selected_evidence:
        snippet: Skin sample analysis showed a higher expression of genes encoding pro-inflammatory cytokines
          (Il-8, Il-1b, TNF-a) and inflammasome-related genes (NALP-3 and CASP-1) in rosacea, especially
          PPR.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
      evidence_path: /pathophysiology/9/evidence/0
      context_paths:
      - /name
      - /disease_term
