              label: rosacea
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: gwas_loci_lesional_expression
        hypothesis_label: Rosacea GWAS susceptibility loci act through altered expression in lesional
          skin, including a TLR1-TLR2 heterodimer axis
        status: EMERGING
        description: 'The genome-wide significant rosacea loci fall into two groups: immune (HLA-DRA/BTNL2,
          the HLA class II alleles, IL13, IRF1, TLR1) and pigmentation (IRF4, HERC2-OCA2, SLC45A2). The
          hypothesis is that the immune loci are expressed and differentially regulated in lesional skin,
          so that germline susceptibility acts through the innate and adaptive inflammatory program modelled
          in this entry rather than only through skin phototype. Aponte et al. found three loci (PSMB9-HLA-DMB,
          HERC2-OCA2, NRXN3-DIO2) differentially expressed in lesional versus non-lesional skin, and Chang
          et al. localized HLA-DRA and BTNL2 protein to the perifollicular infiltrate, but the newer Million
          Veteran Program loci, TLR1 in particular, have never been tested this way. TLR1 is the obligate
          heterodimer partner of TLR2 for triacylated lipopeptide sensing, so a TLR1 risk allele would
          be the first germline entry point into the TLR2-KLK5-LL-37 axis. An exploratory analysis of
          the subtype-spanning biopsy series (GEO GSE65914) asks whether each locus gene is differentially
          expressed in lesional skin by subtype, and whether TLR1 and TLR2 are co-expressed there. This
          hypothesis has no causal edges of its own; it concerns the genetic entries. Downstream causal
          edges that belong to it would opt in via hypothesis_groups: [gwas_loci_lesional_expression].'
        notes: 'Exploratory dataset run: geo:GSE65914 with target genes HLA-DRA, BTNL2, HLA-DRB1, HLA-DQB1,
          HLA-DQA1, IL13, IRF1, TLR1, TLR2, IRF4, HERC2, OCA2, SLC45A2. The MVP loci come from the GWAS
          Catalog (GCST90476178), which this repository cannot yet cite directly (see the dbgap:phs001672
          dataset record).'
      selected_evidence:
        snippet: Exploratory immunohistochemical analysis of HLA-DRA and BTNL2 expression in papulopustular
          rosacea lesions from six individuals, including one with the rs763035 variant, revealed staining
          in the perifollicular inflammatory infiltrate of rosacea for both proteins.
        supports: SUPPORT
