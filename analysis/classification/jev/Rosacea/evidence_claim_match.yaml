      assertion:
        name: Pro-inflammatory Fibroblast Expansion
        description: Single-cell transcriptomics of lesional facial skin (131,243 cells from nine women
          with rosacea and three controls) identifies fibroblasts as the leading source of pro-inflammatory
          and vasodilatory signals, with expansion of a pro-inflammatory fibroblast population in papulopustular
          disease. Fibroblast depletion, or knockdown of the fibroblast-specific gene PTGDS, blocks rosacea-like
          disease in mice. This reframes the keratinocyte-centred TLR2-KLK5-LL-37 model as a multicellular
          circuit in which dermal fibroblasts amplify both inflammation and vasodilation.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: pro-inflammatory dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        subtypes:
        - Papulopustular Rosacea
      selected_evidence:
        snippet: The papulopustular rosacea is featured by expansion of pro-inflammatory fibroblasts,
          Schwann, endothelial and macrophage/dendritic cells.
        supports: SUPPORT
