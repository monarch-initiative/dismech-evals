        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ll37_nlrp3_il1b_papulopustular
        hypothesis_label: LL-37 drives papulopustular lesions through NLRP3 inflammasome activation and
          IL-1beta maturation
        status: EMERGING
        applies_to_subtypes:
        - Papulopustular Rosacea
        description: 'The cathelicidin fragment LL-37 is a recognized activator of the NLRP3 inflammasome,
          rosacea skin over-expresses NALP-3 (NLRP3) and CASP1 together with IL1B most strongly in papulopustular
          disease, and the LL-37-induced inflammatory infiltrate in mice is reported to be NLRP3-dependent.
          The hypothesis places inflammasome-processed IL-1beta as the route from cathelicidin signaling
          to the neutrophilic papule and pustule, distinct from the mast-cell and Th1/Th17 arms of the
          same LL-37 signal. In this entry it is supported by expression associations and a review synthesis,
          not by a human perturbation. A confirmatory re-analysis of the paired lesional versus non-lesional
          papulopustular explant RNA-seq (GEO GSE155141), which independently implicated IL-1beta, asks
          whether NLRP3, CASP1, PYCARD, IL1B and IL18 are coordinately elevated in lesional skin and further
          induced by IL-1beta treatment of non-lesional explants. Downstream causal edges that belong
          to this hypothesis opt in via hypothesis_groups: [ll37_nlrp3_il1b_papulopustular].'
        notes: 'Confirmatory dataset run on geo:GSE155141 (15 samples: paired non-lesional and lesional
          PPR explants, plus IL-1beta-treated non-lesional explants; kb/hypotheses/Rosacea/ll37_nlrp3_il1b_papulopustular/,
          assessed PARTIALLY_SUPPORTED): IL-1beta raised NLRP3 mRNA (paired p = 0.025, dz = 1.57, BH q
          = 0.196) with IL1B and IL1RN trending up, consistent with transcriptional priming of the sensor;
          the lesional versus non-lesional contrast was null for all eight genes and CAMP/KLK5 were flat,
          so the post-translational assembly and maturation steps that define the hypothesis remain untested
          at the transcript level. The mouse loss-of-function evidence (PMID:33745908) was promoted onto
          the LL-37 to NLRP3 edge as a result of the run''s post-lock literature check.'
      selected_evidence:
        snippet: Skin sample analysis showed a higher expression of genes encoding pro-inflammatory cytokines
          (Il-8, Il-1b, TNF-a) and inflammasome-related genes (NALP-3 and CASP-1) in rosacea, especially
          PPR.
        supports: SUPPORT
