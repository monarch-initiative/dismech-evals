        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: etr_lipid_metabolism_acsl5_macrophage
        hypothesis_label: Lipid-metabolic reprogramming centred on ACSL5 accompanies, and may promote,
          macrophage infiltration in erythematotelangiectatic rosacea
        status: EMERGING
        applies_to_subtypes:
        - Erythematotelangiectatic Rosacea
        description: 'Transcriptomic profiling of ETR skin (GEO GSE65914, 14 ETR versus 20 control biopsies)
          enriches for lipid-metabolism and PPAR-signaling genes, with ACSL5 and ACADVL nominated as hub
          genes, and ACSL5 co-localizes with M1 macrophage markers in a rosacea mouse model. The hypothesis
          is that fatty-acid metabolic reprogramming in lesional skin is upstream of macrophage-driven
          inflammation in the vascular subtype, rather than a bystander of it. It rests on a single WGCNA
          study plus co-localization, so the ACSL5 pathophysiology node carries mechanism_confidence PROVISIONAL.
          A confirmatory re-analysis of GSE65914 asks whether the lipid-metabolism signature and the ACSL5/ACADVL
          hub genes reproduce in ETR under a prespecified contrast, and whether they track macrophage
          marker expression (CD68, CD163, CD86) within the same samples. Downstream causal edges that
          belong to this hypothesis opt in via hypothesis_groups: [etr_lipid_metabolism_acsl5_macrophage].'
        notes: 'Confirmatory dataset run on geo:GSE65914 (kb/hypotheses/Rosacea/etr_lipid_metabolism_acsl5_macrophage/,
          assessed PARTIALLY_SUPPORTED): ACSL5 (5.6x), PPARG (4.5x) and ACADVL (2.0x) are strongly higher
          in ETR with CPT1A unchanged, and CD68, CD163 and CD86 are all higher (1.4-1.8x), robust to collapsing
          the two replicate arrays per subject. Within ETR, ACSL5 does not correlate with any macrophage
          marker (all q > 0.45), and the CD86/CD163 balance shifts toward the M2 marker CD163 with the
          M2 regulator PPARG up. The label was accordingly reworded from "drives M1 macrophage infiltration"
          to the co-occurrence the data support; a driver role and M1 polarization remain untested. The
          original study derived its signature from the same series, so this reproduces the analysis,
          not the cohort; independent replication would need a second ETR transcriptome, which does not
          yet exist in a public repository.'
      selected_evidence:
        snippet: we identified 304 differentially expressed genes in erythrotelangiectasia rosacea (ETR),
          primarily enriched in lipid metabolism pathways. Support vector machine (SVM), linear regression
          analyses and network analysis revealed ACADVL and ACSL5 as potential therapeutic targets.
        supports: SUPPORT
