  a4455d819c2d2ab248598f8ace89bbc600b6e94fe0f6d9a28d3f8ada1fc6a9af:
    claim:
      about:
        disease:
          name: Rosacea
          disease_term:
            preferred_term: rosacea
            term:
              id: MONDO:0006604
              label: rosacea
        context:
        - path: /experimental_models/0
          value:
            name: Paired lesional and non-lesional papulopustular rosacea skin explants
            experimental_model_type: OTHER
            description: Ex vivo full-thickness facial skin explants taken as paired lesional and non-lesional
              biopsies from papulopustular rosacea patients, cultured with or without IL-1beta and profiled
              by RNA-seq and by two proteomic platforms (dataset geo:GSE155141 in this entry). The explant
              keeps the resident multicellular circuit intact (keratinocytes, fibroblasts, mast cells,
              vessels and infiltrating immune cells), so it is the one human system that contains the
              fibroblast-centred network described by single-cell profiling, and the paired design controls
              for donor. The only NAM here that is human facial skin.
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: facial skin explant
              term:
                id: UBERON:1000021
                label: skin of face
            cell_types:
            - preferred_term: keratinocyte
              term:
                id: CL:0000312
                label: keratinocyte
            - preferred_term: dermal fibroblast
              term:
                id: CL:0000057
                label: fibroblast
            - preferred_term: mast cell
              term:
                id: CL:0000097
                label: mast cell
            conditions:
            - lesional papulopustular rosacea explant
            - paired non-lesional explant
            - IL-1beta-treated non-lesional explant
            culture_system: Ex vivo explant culture of paired human biopsies, untreated or stimulated
              with recombinant IL-1beta; transcriptome by Illumina RNA-seq in duplicate, proteome by MSD
              and Olink panels.
            notes: The NLRP3 readout comes from the assessed dataset-analysis run in kb/hypotheses/Rosacea/ll37_nlrp3_il1b_papulopustular/,
              not from a publication; no PubMed record is linked to GSE155141 at time of curation, so
              the GEO summary is the citable source.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: NLRP3 Inflammasome Activation
        relationship: PERTURBS
        fidelity: MODERATE
        model_scale: TISSUE
        description: Exogenous IL-1beta applied to non-lesional explants perturbs the IL-1 arm downstream
          of the inflammasome; the dataset-analysis run on this series found IL-1beta induces NLRP3 transcription
          in non-lesional tissue while the inflammasome module is not elevated at steady state in lesional
          explants.
        limitations: IL-1beta is the inflammasome's product, not its trigger, so the perturbation tests
          feed-forward priming rather than LL-37-driven inflammasome assembly; five donor pairs limit
          power, and the priming effect did not survive FDR correction.
        readouts:
        - name: NLRP3 transcript after IL-1beta treatment of non-lesional explants
          target: NLRP3 Inflammasome Activation
          direction: INCREASED
          interpretation: Feed-forward priming of NLRP3 by IL-1beta in human skin; nominal paired p =
            0.025 in the KB's own re-analysis, see notes.
      selected_evidence:
        snippet: Our study suggests that MAPK and TNF signaling pathways are the most significantly upregulated
          pathways in lesional papulopustular rosacea human skins, highlighting IL-1β as a potential central
          mediator.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /experimental_models/0/modeled_mechanisms/1
      evidence_path: /experimental_models/0/modeled_mechanisms/1/evidence/0
      context_paths:
