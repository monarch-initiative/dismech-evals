          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'HGNC records hgnc:2939 DNA2 with the approved name "DNA replication helicase/nuclease
