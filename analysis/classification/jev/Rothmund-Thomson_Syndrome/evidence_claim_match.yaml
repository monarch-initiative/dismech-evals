          but are not unusually sensitive to genotoxic stress, so the reported cellular phenotype is one
          of premature senescence rather than of measurable genome instability. Note that the report establishing
          the gene describes the entity as "RTS-like" rather than as RTS itself; MONDO files it as Rothmund-Thomson
          syndrome type 3, and this row follows MONDO''s placement while recording the distinction.

          '
        genes:
        - preferred_term: CRIPT
          term:
            id: hgnc:14312
            label: CRIPT
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: 'three additional genes have been recently identified in RTS: ANAPC1, encoding a subunit
          of the APC/C complex; DNA2, which encodes a nuclease/helicase involved in DNA repair; and CRIPT,
          encoding a poorly characterized protein implicated in excitatory synapse formation and splicing.'
        supports: SUPPORT
