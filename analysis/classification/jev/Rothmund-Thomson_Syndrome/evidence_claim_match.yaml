                label: Rothmund-Thomson syndrome type 4
            description: 'The DNA2-related form, reported in Brazilian probands and a Swiss/Portuguese
              sibling pair sharing a deep intronic splicing variant in trans with a loss-of-function allele.
              It presents with severe short stature, widespread poikiloderma and congenital ocular anomalies,
              and patient cells show reduced DNA2 protein and impaired double-strand break repair. Biallelic
              DNA2 variants were already known to cause microcephalic osteodysplastic primordial dwarfism,
              so this subtype extends the DNA2 phenotypic spectrum rather than describing a wholly separate
              gene-disease relationship. As with type 3, the originating report describes the presentation
              as reminiscent of RTS; this row follows MONDO''s placement of the concept under Rothmund-Thomson
              syndrome.

              '
            genes:
            - preferred_term: DNA2
              term:
                id: hgnc:2939
                label: DNA2
          role: subtype
