  76de3d6c70ce888a19d43bdffd2e4342cf9cad128777eb60fe4e937a2c2ef90b:
    claim:
      about:
        disease:
          name: Rotor Syndrome
          disease_term:
            preferred_term: Rotor syndrome
            term:
              id: MONDO:0009379
              label: Rotor syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Hepatic Bilirubin Conjugate Reuptake and Storage
        description: Even under physiological conditions a fraction of newly formed bilirubin conjugates
          is secreted across the sinusoidal membrane into blood by MRP3 and then recaptured by OATP1B1
          and OATP1B3 for re-excretion into bile. Rotor syndrome breaks that recapture limb, so conjugates
          that leave the hepatocyte are not retrieved and accumulate in plasma. Conjugation and canalicular
          export are intact, which is why the liver is not pigmented and why the disorder is mechanistically
          distinct from Dubin-Johnson syndrome despite an almost identical biochemical presentation.
        role: central_effector
        biological_scale: CELLULAR
        conforms_to: bilirubin_conjugation_transport#Hyperbilirubinaemia
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: bilirubin transport
          term:
            id: GO:0015723
            label: bilirubin transport
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Rotor and Dubin-Johnson syndromes are rare autosomal recessive liver diseases characterized
          by chronic conjugated hyperbilirubinemia, caused by the absence of the hepatic function OATP1B1/B3
          (leading to impaired hepatic bilirubin reuptake and storage) and MRP2 transporters (leading
          to impaired hepatic bilirubin excretion), respectively.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36157610
      reference_title: Rotor Syndrome Presenting as Dubin-Johnson Syndrome.
      evidence_source: OTHER
      explanation: States precisely the mechanism of this node - impaired hepatic reuptake and storage
        - and contrasts it with the excretion defect of Dubin-Johnson syndrome. Evidence source is OTHER
        because this sentence states the general mechanism of the two disorders rather than the reported
        patient's own findings.
