              id: MONDO:0009379
              label: Rotor syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Digenic inheritance
        description: 'Rotor syndrome is formally DIGENIC: pathogenic variants are required in both SLCO1B1
          and SLCO1B3, because the OATP1B1 and OATP1B3 transporters they encode are functionally redundant
          and loss of either alone is silent. It resembles monogenic autosomal recessive inheritance in
          practice only because the two genes are adjacent on chromosome 12 and so are unlikely to segregate
          independently - a homozygous deletion commonly removes both. This makes Rotor syndrome one of
          the clearest examples of digenic inheritance among the hereditary hyperbilirubinaemias, and
          distinguishes it from Dubin-Johnson syndrome, whose conjugated hyperbilirubinaemia arises from
          a single gene.'
        inheritance_term:
          preferred_term: Digenic inheritance
          term:
            id: HP:0010984
            label: Digenic inheritance
      selected_evidence:
        snippet: Rotor syndrome is inherited in an autosomal recessive digenic manner that clinically
          resembles monogenic autosomal recessive inheritance.
        supports: SUPPORT
