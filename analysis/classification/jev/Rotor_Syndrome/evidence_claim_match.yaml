        context:
        - path: /biochemical/1
          value:
            name: Urinary Coproporphyrin
            presence: INCREASED
            context: 'Classically, total urinary coproporphyrin excretion is increased two- to five-fold
              in Rotor syndrome with isomer I usually below 75-80% of the total - the pattern that historically
              distinguished it from Dubin-Johnson syndrome, where total excretion is normal but isomer
              I exceeds 80%. This discriminator is not reliable in individual patients: a genetically
              confirmed Rotor case has been reported with normal total coproporphyrin and 86% isomer I,
              a profile that reads as Dubin-Johnson syndrome. Molecular testing, not coproporphyrin analysis,
              establishes the diagnosis.'
          role: ancestor
      assertion_type: BiomarkerReadout
      assertion:
        target: Combined OATP1B1 and OATP1B3 Deficiency
        relationship: READOUT_OF
        direction: POSITIVE
        endpoint_context: DIAGNOSTIC
        interpretation: Altered coproporphyrin handling reports loss of OATP-dependent organic anion uptake,
          but the isomer pattern overlaps with Dubin-Johnson syndrome often enough that it cannot stand
          alone.
      selected_evidence:
        snippet: Contrary to DJS, in RS, total coproporphyrin excretion in urine is increased and isomer
          I is usually <75-80%, in line with the interaction of several porphyrins with OATP1B1
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/1/readouts/0
