        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Combined OATP1B1 and OATP1B3 Deficiency
        description: 'Complete loss of both sinusoidal organic anion transporting polypeptides OATP1B1
          (encoded by SLCO1B1) and OATP1B3 (encoded by SLCO1B3) abolishes hepatocellular reuptake of organic
          anions, including the bilirubin conjugates that normally re-enter the hepatocyte from sinusoidal
          blood after MRP3-mediated basolateral efflux. Both transporters must be lost: they are functionally
          redundant, so a lesion in either alone is insufficient. The genes are adjacent on chromosome
          12, and a single homozygous deletion spanning both loci has been reported as a cause.'
        role: trigger
        biological_scale: MOLECULAR
        conforms_to: bilirubin_conjugation_transport#Conjugated Bilirubin Transport Failure
        genes:
        - preferred_term: SLCO1B1
          term:
            id: hgnc:10959
            label: SLCO1B1
        - preferred_term: SLCO1B3
          term:
            id: hgnc:10961
            label: SLCO1B3
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: bilirubin transport
          term:
            id: GO:0015723
            label: bilirubin transport
          modifier: DECREASED
      selected_evidence:
        snippet: In patients with Rotor syndrome, bilirubin (re)uptake is impaired due to the deficiency
          of two basolateral/sinusoidal hepatocellular membrane proteins, organic anion-transporting polypeptide
          1B1 (OATP1B1) and OATP1B3.
        supports: SUPPORT
    origin:
