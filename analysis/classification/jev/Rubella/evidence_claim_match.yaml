              label: rubella
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Rubella IgG serology
        description: Measurement of rubella-specific IgG in serum. IgG is how immunity to rubella is usually
          determined when women of childbearing age are screened, and IgG seroconversion during pregnancy
          is one of the two findings (with a positive IgM) that prompts investigation for maternal rubella.
          Seroconversion alone has very low positive predictive value for primary infection where rubella
          circulates little.
        measurements:
        - preferred_term: Rubella IgG
          term:
            id: LOINC:8014-3
            label: Rubella virus IgG Ab [Units/volume] in Serum
        notes: The method-less quantitative serum code is bound, rather than the qualitative presence
          code, because seroconversion is read across two results; LOINC also carries first- and second-specimen
          variants of this code, which name the sample rather than the test. No reference_ranges are recorded.
          Seroconversion is a change between two results rather than a band on one, and an IgG concentration
          taken as evidence of immunity is a property of immunity screening, not a diagnostic threshold
          for rubella; the cited sources state neither as a value.
      selected_evidence:
        snippet: Immunity to rubella is usually determined by measuring the rubella virus-specific immunoglobulin
          G (RV-IgG).
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
