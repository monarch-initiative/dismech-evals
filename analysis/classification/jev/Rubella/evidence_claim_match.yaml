  e93d88b812928c99b8e4c911c95d1098937cefef11c29b3758dcba49f1d863c9:
    claim:
      about:
        disease:
          name: Rubella
          disease_term:
            preferred_term: rubella
            term:
              id: MONDO:0004656
              label: rubella
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Rubella IgG avidity
        description: Measurement of the avidity of rubella-specific IgG, used after a positive IgM result,
          particularly in pregnancy, to confirm or exclude recent primary infection. IgG avidity is low
          in acute and recent primary rubella and rises over the following months; high avidity indicates
          pre-existing immunity, and rubella reinfections fall in the high-avidity group.
        measurements:
        - preferred_term: Rubella IgG avidity
          term:
            id: LOINC:34421-8
            label: Rubella virus IgG Ab avidity [Ratio] in Serum
        notes: 'The method-less serum avidity code is bound rather than the immunoassay-specific variant
          (LOINC:52986-7 Rubella virus IgG Ab avidity [Ratio] in Serum by Immunoassay). No reference_ranges
          are recorded. The low- and high-avidity cut-offs in the cited studies belong to their assays:
          PMID:9316732 reports a low avidity index (< 40%) up to 6 weeks after onset of rash and a high
          index (> 60%) not before 13 weeks after infection, for a commercial rubella IgG ELISA with 35
          mM diethylamine added to the washing buffer, and PMID:2723615 classes sera as low, borderline
          or high with its own avidity-ELISA without stating a cut-off in its abstract. A PubMed search
          for rubella IgG avidity with pregnancy, primary infection and low avidity returned these single-assay
          studies and no guideline or consensus threshold, so the avidity index is left unbanded.'
      selected_evidence:
        snippet: In conclusion, the measurement of IgG avidity is a powerful tool for the distinction
          of acute or recent primary rubella from pre-existing rubella immunity, including rubella reinfections.
        supports: SUPPORT
