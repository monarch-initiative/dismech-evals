      assertion:
        name: Transplacental transmission and congenital rubella syndrome
        description: 'Maternal viremia during early gestation infects the placenta and fetus. Rubella
          virus induces apoptosis and disrupts cell proliferation in fetal cells (the rubella capsid protein
          perturbs mitochondrial distribution via host protein p32), disrupting organogenesis during critical
          developmental windows and producing the cataract, cardiac, and cochlear defects of congenital
          rubella syndrome.

          '
        locations:
        - preferred_term: Placenta
          term:
            id: UBERON:0001987
            label: placenta
        biological_processes:
        - preferred_term: Apoptotic process
          modifier: INCREASED
          term:
            id: GO:0006915
            label: apoptotic process
        - preferred_term: Cell population proliferation
          modifier: DECREASED
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: the fetus is most vulnerable to the rubella virus during the first trimester of pregnancy,
          due to the lack of immune defense in the developing fetus
        supports: SUPPORT
