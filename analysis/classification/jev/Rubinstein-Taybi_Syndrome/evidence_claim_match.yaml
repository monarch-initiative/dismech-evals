  bd5483a5c66666beba70839446721fcbadc2de6f3839a7de6f9c38b903f1e2e1:
    claim:
      about:
        disease:
          name: Rubinstein-Taybi Syndrome
          disease_term:
            preferred_term: Rubinstein-Taybi syndrome
            term:
              id: MONDO:0019188
              label: Rubinstein-Taybi syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CBP/p300 Haploinsufficiency and Loss of Histone Acetyltransferase Activity
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component
          Haploinsufficiency
        description: 'Heterozygous loss-of-function variants or deletions in CREBBP or EP300 reduce the
          dosage of the paralogous histone acetyltransferases CBP and p300. Both proteins function as
          transcriptional coactivators that acetylate histones and other substrates; a certain level of
          CBP is essential for normal development. Loss of one functional allele lowers histone acetyltransferase
          activity, producing aberrant chromatin regulation and dysregulated transcription that drives
          the developmental phenotype.

          '
        genes:
        - preferred_term: CREBBP
          term:
            id: hgnc:2348
            label: CREBBP
        - preferred_term: EP300
          term:
            id: hgnc:3373
            label: EP300
        genetic_context:
          genes:
          - preferred_term: CREBBP
            term:
              id: hgnc:2348
              label: CREBBP
          - preferred_term: EP300
            term:
              id: hgnc:3373
              label: EP300
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous loss-of-function variants. For CREBBP the reported allele classes
            are point mutations, small lesions, microdeletions and intragenic duplications; the EP300
            evidence cited here establishes heterozygous mutation without this entry recording a comparable
            allele breakdown. A variant in one paralog is sufficient to cause disease, so the node is
            annotated as haploinsufficiency of the affected paralog rather than as combined CBP/p300 loss.
        biological_processes:
        - preferred_term: Histone (peptidyl-lysine) acetylation
          term:
            id: GO:0018394
            label: peptidyl-lysine acetylation
          modifier: DECREASED
        - preferred_term: CBP/p300-mediated transcriptional coactivation
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
          modifier: DECREASED
        - preferred_term: Chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: There is a direct link between loss of acetyl transferase activity and RSTS, which indicates
          that the disorder is caused by aberrant chromatin regulation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15706485
      reference_title: 'Genetic heterogeneity in Rubinstein-Taybi syndrome: mutations in both the CBP
        and EP300 genes cause disease.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Roelfsema et al. directly link loss of CBP/p300 histone acetyltransferase activity
        to RSTS via aberrant chromatin regulation.

        '
