      - /disease_term
    evidence_metadata:
      reference: PMID:33988353
      reference_title: Eating and Psychiatric Disorders Are Independent Risk Factors for Rumination Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Case-control evidence supports a history of eating disorders and psychiatric disorders
        as independent risk factors for rumination syndrome, consistent with an upstream psychosocial
        liability.
