        name: Elevated Intragastric Pressure
        description: The abdominothoracic maneuver produces a postprandial spike in intragastric/intra-abdominal
          pressure. On combined high-resolution manometry with impedance, rumination episodes are characteristically
          associated with abdominal pressure peaks exceeding 30 mm Hg, a threshold that objectively separates
          rumination from gastroesophageal reflux disease.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: None of the GERD patients exhibited abdominal pressure peaks >30 mm Hg, whereas in the
          rumination patients 70% of the pressure peaks had an amplitude >30 mm Hg.
        supports: SUPPORT
