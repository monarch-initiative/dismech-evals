      assertion_type: Genetic
      assertion:
        name: No single causal gene (behaviorally mediated)
        association: Risk Factor
        notes: 'Rumination disorder is not a monogenic or otherwise genetically defined disease; it has
          no OMIM phenotype entry and no established causal or susceptibility gene. Risk is mediated behaviorally/psychosocially
          through psychiatric and eating-disorder comorbidity and antecedent stressors. NOTE (Named Entity
          Confusion guardrail): a separate behavioral-genetics literature on the heritability of "rumination"
          as a cognitive/depressive thinking construct (KCTD12, KCNJ6, CREB1, BDNF) pertains to a DIFFERENT
          entity that merely shares the English word "rumination" and must NOT be cited as genetic evidence
          for this food-regurgitation disorder.'
      selected_evidence:
        snippet: Rumination syndrome (RS) is an underdiagnosed behavioral disorder of recurrent regurgitation.
        supports: SUPPORT
