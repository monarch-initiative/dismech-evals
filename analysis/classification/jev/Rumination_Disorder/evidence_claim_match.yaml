      assertion_type: Pathophysiology
      assertion:
        name: Psychiatric Comorbidity and Antecedent Stressor
        description: Rumination is strongly associated with psychiatric and eating-disorder comorbidity
          and is frequently triggered in previously asymptomatic adolescents/adults by an antecedent illness,
          surgery, or psychological stressor. A prior history of an eating disorder (including self-induced
          vomiting in bulimia nervosa) or another psychiatric disorder is modeled as an upstream liability
          that predisposes to acquiring the rumination motor habit. This is a behaviorally/psychosocially
          mediated predisposition, not a genetic etiology.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: On multivariable analysis, ED (adjusted odds ratio=16.4, P=0.0033) and PD (adjusted odds
          ratio=4.47, P=0.029) remained independent predictors for RS.
        supports: SUPPORT
    origin:
