          regurgitation is effortless, involuntary, non-compensatory, and not preceded by retching. The
          two can co-occur, and rumination is frequently misdiagnosed as bulimia nervosa.
        distinguishing_features:
        - Rumination regurgitation is effortless, involuntary, and non-compensatory with no retching;
          bulimic vomiting is intentional, self-induced, compensatory, and tied to weight/body-image concerns.
        disease_term:
