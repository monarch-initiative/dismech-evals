      assertion:
        name: Nutritional and Dental Sequelae
        description: Consequences of chronic rumination. Frequent regurgitation can cause weight loss
          and malnutrition (occasionally severe enough to require enteral/ jejunostomy feeding), and repeated
          exposure of the dentition to regurgitated gastric contents causes dental erosion. Psychosocial
          impairment (social withdrawal, school/work absenteeism) commonly accompanies these.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Of patients with rumination syndrome, 23 (77%) had DE, compared with 4 (13%) control
          subjects.
        supports: SUPPORT
