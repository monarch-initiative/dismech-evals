            label: SAMD9L-associated autoinflammatory syndrome
        description: Severe neonatal- or infantile-onset autoinflammatory presentation caused by de novo
          frameshift variants that truncate SAMD9L C-terminal to its NOD-like region, removing autoregulatory
          domains while preserving the translational-repressor activity. Features include panniculitis
          with lipoatrophy, interstitial lung disease, basal ganglia calcification, cytopenias and B-cell
          deficiency. Included as a subtype because GeneReviews treats it as a subtype of the SAMD9L-related
          syndrome; ClinGen's lumping of MONDO:1060111 does not list it, and MONDO files it under autoinflammatory
          syndrome rather than under this term.
        genes:
