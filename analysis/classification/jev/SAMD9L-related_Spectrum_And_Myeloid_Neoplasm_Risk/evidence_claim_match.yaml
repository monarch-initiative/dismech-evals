        notes: Most pathogenic alleles are germline missense gain-of-function variants clustering in the
          middle region of the protein; the SAAD subtype carries de novo frameshift variants that truncate
          the C-terminus and are also gain-of-function. ClinGen additionally notes reported germline loss-of-function
          SAMD9L alleles in adult-onset myeloid neoplasms (Nagata et al. 2018, PMID:30322869, whose abstract
          is not cached here); that mechanism is opposite to the pediatric one and is recorded as a discussion
          rather than as part of this entry's causal chain.
        gene_term:
          preferred_term: SAMD9L
