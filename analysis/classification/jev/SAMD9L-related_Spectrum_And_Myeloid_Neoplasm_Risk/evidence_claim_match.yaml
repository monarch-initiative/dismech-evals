        context: []
      assertion_type: Diagnosis
      assertion:
        name: Germline SAMD9L testing on non-hematopoietic DNA
        description: Diagnosis rests on a heterozygous germline SAMD9L gain-of-function variant. Because
          monosomy 7 or UPD7q can lower or erase the variant allele fraction in blood, marrow, buccal
          or saliva DNA, a negative or apparently somatic result in those tissues does not exclude the
          disease, and testing of a non-hematopoietic tissue may be needed.
        diagnosis_term:
          preferred_term: Germline genetic testing of non-hematopoietic tissue
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: Acquired monosomy 7 or uniparental disomy of 7q can reduce the variant allele frequency
          of a germline SAMD9L pathogenic variant in blood-, bone marrow-, buccal mucosa-, or saliva-derived
          DNA, leading to failure to identify the pathogenic variant or misclassification as somatic.
        supports: SUPPORT
    origin:
