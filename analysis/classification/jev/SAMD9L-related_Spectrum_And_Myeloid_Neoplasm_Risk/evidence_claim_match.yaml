            label: SAMD9L
      selected_evidence:
        snippet: SAMD9L-associated autoinflammatory subtype (SAAD) is a severe autoinflammatory phenotype
          with infantile or neonatal onset caused by pathogenic SAMD9L variants that truncate the autoregulatory
          domain but preserve the protein's enzymatic function.
