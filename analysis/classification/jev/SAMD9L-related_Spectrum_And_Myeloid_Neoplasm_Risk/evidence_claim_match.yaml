              label: SAMD9L-related spectrum and myeloid neoplasm risk
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: adult_loss_of_function_arm
        kind: CONTROVERSY
        prompt: Do germline loss-of-function SAMD9L alleles in adult-onset myeloid neoplasms belong to
          this disease?
        attaches_to:
        - genetic#SAMD9L
        rationale: ClinGen's curation of MONDO:1060111 states that mechanism is gain of function for childhood
          onset and loss of function for adult onset, citing Nagata et al. 2018 (PMID:30322869). The pathograph
          here models only the gain-of-function chain. A loss-of-function allele would predispose by a
          different route (reduced tumor suppressor dosage, as in the Samd9l knockout mouse), with no
          growth restriction and no selection for rescue, and may be better modelled separately. The Nagata
          abstract is not available in the reference cache, so the adult arm is not curated as a claim.
      selected_evidence:
        snippet: 'The mechanism of pathogenicity is reported to be gain of function for onset in childhood,
          loss of function for onset in adulthood (PMID: 30322869).'
        supports: SUPPORT
