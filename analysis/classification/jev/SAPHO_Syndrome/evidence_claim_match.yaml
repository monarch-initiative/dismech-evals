      assertion_type: AnimalModel
      assertion:
        name: PSTPIP2-knockout mouse
        species: Mouse
        genotype: Pstpip2 knockout (Pstpip2-/-)
        publication: PMID:25602062
        description: Germline Pstpip2 knockout mice develop paw swelling, synovitis, hyperostosis and
          osteitis with multifocal osteomyelitis, marked neutrophil and macrophage infiltration of bone,
          joint and skin, and elevated neutrophil-attracting chemokines and IL-1beta - a phenocopy of
          the human syndrome arising from a single defined gene.
        modeled_mechanisms:
        - target: Sterile Osteitis
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Reproduces sterile multifocal osteitis with synovitis and hyperostosis, together
            with the neutrophil infiltration and IL-1beta elevation that the human cytokine model predicts.
          limitations: 'The gene is the problem. A candidate-gene study of 38 human SAPHO patients found
            no association with PSTPIP2, so the mouse establishes that loss of one innate regulator can
            produce a SAPHO-like phenotype, not that this is the human mechanism. The bone phenotype also
            diverges in direction: the mouse develops profound osteolytic lesions with decreased bone
            volume density, whereas proliferative hyperostosis and osteosclerosis are the human radiological
            signature.'
          readouts:
          - name: Neutrophil and macrophage infiltration of bone, joint and skin
            target: Sterile Osteitis
            direction: INCREASED
            interpretation: Cellular correlate of the sterile osteitis node, in the same three compartments
              the human syndrome involves.
          - name: Tissue IL-1beta and neutrophil-attracting chemokines
            target: Sterile Osteitis
            direction: INCREASED
            interpretation: Confirms in a model system the two mediators the human cytokine hub and the
              neutrophil recruitment node depend on.
      selected_evidence:
        snippet: Genetic studies of HLA genes have shown no role for these class II antigens, whereas
          studies of 2 mouse models (cmo and Lupo) point to a role of the PSTPIP2 gene.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
