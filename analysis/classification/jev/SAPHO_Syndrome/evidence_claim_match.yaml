  42e67849772ed0701166e264161a9c59bc47affcbbe307ce429954bed434ecdb:
    claim:
      about:
        disease:
          name: SAPHO Syndrome
          disease_term:
            preferred_term: SAPHO syndrome
            term:
              id: MONDO:0019266
              label: SAPHO syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Monogenic autoinflammatory bone diseases
        description: The mechanistically informative differential group, and the one that shows what SAPHO
          would look like if it had a single cause. PAPA, DIRA, DITRA and Majeed syndrome each produce
          sterile osteitis with neutrophilic skin disease from a defined gene, and each has a correspondingly
          clean cytokine dependency. SAPHO has neither - which is exactly the contrast that makes its
          heterogeneous treatment response the thing a mechanistic account has to explain.
        distinguishing_features:
        - Each has an identified causal gene; SAPHO has none, and its three strongest candidates were
          excluded in a human cohort
        - Onset is typically neonatal or paediatric rather than the third to fifth decade
        - Cytokine dependency is defined and single-agent responsive, unlike SAPHO's heterogeneous response
          across every drug class
      selected_evidence:
        snippet: 'Monogenic autoinflammatory bone diseases: PAPA syndrome, DIRA syndrome, deficiency of
          interleukin-36 receptor antagonist (DITRA) syndrome, or Majeed syndrome.'
        supports: SUPPORT
