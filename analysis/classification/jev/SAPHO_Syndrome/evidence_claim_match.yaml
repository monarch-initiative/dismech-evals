  4bd8f95485e490169d98b5cc15e291809c4aa7da5e6b69270f7697a524fce3af:
    claim:
      about:
        disease:
          name: SAPHO Syndrome
          disease_term:
            preferred_term: SAPHO syndrome
            term:
              id: MONDO:0019266
              label: SAPHO syndrome
        context: []
      assertion_type: Definition
      assertion:
        name: Kahn and Benhamou diagnostic criteria for SAPHO syndrome
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: ESTABLISHED_CRITERIA
        scope: DIAGNOSIS
        description: 'The two criteria sets in common use. Benhamou''s were published in 1988, Kahn''s
          in 1994 and modified by the same author in 2003. All of them are built the same way - an osteoarticular
          manifestation paired with a form of SAPHO-typical skin disease, present or past - which is why
          an entry-level diagnosis can be made without any laboratory or histological finding.

          The consequential clause is in Kahn''s set: chronic recurrent multifocal osteomyelitis in a
          child is by itself sufficient to diagnose SAPHO. That is what makes the boundary between this
          entry and Chronic Recurrent Multifocal Osteomyelitis a matter of convention rather than of biology,
          and it is the definitional basis of the nosology knowledge gap curated below.

          None of these criteria sets has been validated, and the contrast with the paediatric disease
          is instructive: CNO received jointly developed and externally validated EULAR/ACR classification
          criteria in 2025, while SAPHO has none.'
        inclusion_criteria:
        - preferred_term: Osteoarticular manifestation with SAPHO-typical skin disease
          description: An osteoarticular manifestation - osteitis, hyperostosis or synovitis - paired
            with a form of SAPHO-typical skin disease, present or past. This pairing is the shared structure
            of every proposed criteria set.
        - preferred_term: Chronic recurrent multifocal osteomyelitis in a child
          description: Under Kahn's criteria this is by itself sufficient to diagnose SAPHO, with no skin
            disease required.
        - preferred_term: Inflammatory bowel disease association
          description: Incorporated into the modified 2003 Kahn criteria, which is what makes the IBD
            association structural to the diagnosis rather than incidental.
        exclusion_criteria:
        - preferred_term: Infectious osteomyelitis or spondylodiscitis
          description: Must be excluded; a monostotic lesion generally requires bone biopsy to do so.
        - preferred_term: Bone malignancy
          description: Osteosarcoma, Ewing sarcoma, bone metastasis, bone lymphoma and histiocytosis are
            all listed among the differentials to exclude.
        - preferred_term: Langerhans cell histiocytosis
          description: Named explicitly among the differentials to be excluded before diagnosis.
        validation_status:
          status: UNVALIDATED
          rationale: The source states directly that several diagnostic criteria sets have been proposed
            and none has been validated. There are consequently no externally validated diagnostic criteria
            or outcome measures in SAPHO, and no prospective randomised controlled trials - the second
            follows from the first.
      selected_evidence:
        snippet: Several sets of diagnostic or classification criteria have been proposed, of which the
          ones developed by, Kahn et al (1994 modified in 2003) and Benhamou et al are most commonly used
          across the literature
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
