  56f2dd4bfd6eae354902e624512fa81a231bf0a861e53c39d2b954b25be4bf30:
    claim:
      about:
        disease:
          name: SAPHO Syndrome
          disease_term:
            preferred_term: SAPHO syndrome
            term:
              id: MONDO:0019266
              label: SAPHO syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Chronic nonbacterial osteomyelitis of childhood
        description: Not straightforwardly a differential. CNO/CRMO shares the sterile multifocal osteitis
          and can share the skin manifestations, and whether it is a distinct condition or the paediatric
          expression of the same disease is actively debated. Kahn's criteria treat the presence of CRMO
          in a child as sufficient for a SAPHO diagnosis, which makes the boundary a matter of convention
          rather than of biology. Curated as a differential because dismech holds a separate entry for
          it.
        distinguishing_features:
        - CNO/CRMO presents in children and adolescents; SAPHO onset is typically the third to fifth decade
        - Anterior chest wall hyperostosis is more characteristic of adult SAPHO
        - Under Kahn's criteria, CRMO in a child is itself sufficient to diagnose SAPHO
      selected_evidence:
        snippet: However, there is an ongoing debate about whether SAPHO syndrome and CNO are distinct
          conditions or simply represent different manifestations of the same disease depending on the
          age at onset
        supports: SUPPORT
    origin:
