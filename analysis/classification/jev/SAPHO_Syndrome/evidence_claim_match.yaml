  bc5c06f8e6116344a77bbb81b9a14b2be35677c0e140261e58a8f81dedd3a77c:
    claim:
      about:
        disease:
          name: SAPHO Syndrome
          disease_term:
            preferred_term: SAPHO syndrome
            term:
              id: MONDO:0019266
              label: SAPHO syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cutibacterium acnes Intraosseous Persistence
        biological_scale: CELLULAR
        description: 'A candidate initiating step, curated as a hypothesis rather than as established
          mechanism. Cutibacterium (formerly Propionibacterium) acnes is recovered from a proportion of
          SAPHO bone biopsies, and it is a potent activator of the NLRP3 inflammasome, which would supply
          the IL-1beta the rest of the chain depends on. The case against it is equally concrete: overt
          infection is absent in many patients and antibiotics produce only transient, incomplete benefit.
          The proposal that survives both observations is low-grade intracellular persistence rather than
          infection.'
        biological_processes:
        - preferred_term: NLRP3 inflammasome complex assembly
          term:
            id: GO:0044546
            label: NLRP3 inflammasome complex assembly
          modifier: INCREASED
      selected_evidence:
        snippet: P. acnes is indeed a powerful trigger of NLRP3-inflammasome activation and IL-1β, leading
          to osteitis and enhanced mesenchymal cells differentiation in osteoblasts.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28499891
      reference_title: SAPHO, autophagy, IL-1, FoxO1, and Propionibacterium (Cutibacterium) acnes.
      evidence_source: OTHER
      explanation: States the proposed molecular route from the organism to inflammasome activation and
        osteitis. The source is a hypothesis paper, graded OTHER accordingly.
