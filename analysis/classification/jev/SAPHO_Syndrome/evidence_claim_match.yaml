        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: emerging_cutibacterium_acnes_trigger_model
        hypothesis_label: Emerging Cutibacterium acnes Trigger Model
        status: EMERGING
        description: 'Low-grade intracellular persistence of Cutibacterium acnes in bone cells, rather
          than overt infection, supplies the recurrent NLRP3 inflammasome activation and IL-1beta release
          that drive the syndrome. This would make SAPHO a reactive osteitis in a susceptible host and
          would explain why the organism is culturable from lesions while antibiotics produce only transient
          benefit. It remains unproven: no controlled study establishes causation, and recovery of a commensal
          skin organism from a biopsy is equally consistent with contamination.'
      selected_evidence:
        snippet: As several auto-inflammatory bone disorders sharing overproduction of IL-1β can mimic
          SAPHO, this syndrome could partly depend on genetically encoded overproduction of IL-1β.
        supports: SUPPORT
    origin:
