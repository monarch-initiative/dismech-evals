      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_autoinflammatory_cytokine_model
        hypothesis_label: Canonical Autoinflammatory Cytokine Model
        status: CANONICAL
        description: 'SAPHO arises from dysregulated innate immunity in a genetically predisposed host:
          neutrophil hyperactivity and excess IL-1 drive a self-amplifying TNF-alpha / IL-1beta / IL-6
          / IL-8 / IL-23-IL-17 network that produces sterile osteitis, disordered bone remodelling and
          neutrophilic skin disease. The model is supported by the cytokine profile and by the therapeutic
          response to IL-1 and TNF blockade; its weakest point is that the predisposition itself has no
          identified genetic basis, so the model explains the amplification without explaining the initiation.'
      selected_evidence:
        snippet: Current evidence suggests that SAPHO results from a complex interplay between immune
          dysregulation, genetic susceptibility, and environmental factors.
        supports: SUPPORT
