        context: []
      assertion_type: Diagnosis
      assertion:
        name: Diagnosis of Exclusion
        description: There is no specific laboratory finding for SAPHO and no validated criteria set,
          so diagnosis rests on recognising a compatible clinical picture and excluding the alternatives.
          Infection and malignancy are the two that matter, and the monostotic lesion is the hard case
          - a single sclerotic or lytic lesion without skin disease is not distinguishable from osteomyelitis
          or a bone tumour on imaging alone.
        diagnosis_term:
          preferred_term: diagnosis of exclusion
