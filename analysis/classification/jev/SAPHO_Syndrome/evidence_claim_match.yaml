  4461409ffc48efb6d8b97c419db9dde492d528b9a9030371a31492e5f310d4f7:
    claim:
      about:
        disease:
          name: SAPHO Syndrome
          disease_term:
            preferred_term: SAPHO syndrome
            term:
              id: MONDO:0019266
              label: SAPHO syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Innate Immune Dysregulation
        biological_scale: CELLULAR
        description: 'The upstream lesion, and the least well characterised. What is reproducibly reported
          is a set of innate abnormalities - neutrophil hyperactivity, reduced natural killer cell numbers,
          high IL-1 - together with a therapeutic response to IL-1 blockade. That combination is why contemporary
          reviews classify SAPHO as autoinflammatory rather than autoimmune. No causal gene underlies
          it: this node describes a functional state, not a genotype.'
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        biological_processes:
        - preferred_term: interleukin-1 beta production
          term:
            id: GO:0032611
            label: interleukin-1 beta production
          modifier: INCREASED
      selected_evidence:
        snippet: It's not clear if SAPHO syndrome is an autoimmune disease or an autoinflammatory disease,
          but current evidence suggests that it's more likely an autoinflammatory disease because of things
          like neutrophil hyperactivity, fewer natural killer (NK) cells, high levels of interleukin (IL)-1,
          and a good response to treatments that block IL-1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37889264
      reference_title: 'SAPHO syndrome: current clinical, diagnostic and treatment approaches.'
      evidence_source: HUMAN_CLINICAL
      explanation: Names the four innate observations that ground this node, and the reasoning by which
        the disease is classified as autoinflammatory.
