            term:
              id: MONDO:0019266
              label: SAPHO syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Spondyloarthritis
        description: 'Overlaps SAPHO on almost every clinical axis - peripheral arthritis, enthesitis,
          sacroiliac and spinal involvement, psoriasis, inflammatory bowel disease - which is why the
          two are periodically proposed as the same family. The discriminator is genetic and clean: SAPHO
          shows no increase in HLA-B27 frequency, unlike SpA. MRI adds a second: SAPHO has lower rates
          of sacroiliitis and erosion but more anterior chest wall involvement.'
        distinguishing_features:
        - SAPHO shows no increased HLA-B27 frequency, unlike spondyloarthritis
        - Anterior chest wall involvement is commoner in SAPHO; sacroiliitis and erosions less common
        - Hyperostosis and osteitis rather than a purely erosive or ankylosing pattern
      selected_evidence:
        snippet: genetic reports on SAPHO syndrome did not show an increase in HLA-B27 frequency, unlike
          in SpA
        supports: SUPPORT
