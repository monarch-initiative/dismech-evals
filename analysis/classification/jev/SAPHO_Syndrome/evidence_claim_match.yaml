  87dd77cc9936cb7ed6d9ff773e343fa591084979278a52fb43dfbb3a566e8f88:
    claim:
      about:
        disease:
          name: SAPHO Syndrome
          disease_term:
            preferred_term: SAPHO syndrome
            term:
              id: MONDO:0019266
              label: SAPHO syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pro-Inflammatory Cytokine Amplification
        biological_scale: MOLECULAR
        description: The hub of the disease. TNF-alpha, IL-1beta, IL-6, IL-8, IL-18 and the IL-23/IL-17
          axis converge on NF-kappaB and MAPK signalling, each amplifying the others. This is a self-sustaining
          loop rather than a linear cascade, which is the mechanistic reason single-cytokine blockade
          helps many patients without curing any, and the reason different agents work in the bone and
          the skin compartments.
        biological_processes:
        - preferred_term: tumor necrosis factor production
          term:
            id: GO:0032640
            label: tumor necrosis factor production
          modifier: INCREASED
        - preferred_term: interleukin-17 production
          term:
            id: GO:0032620
            label: interleukin-17 production
          modifier: INCREASED
        - preferred_term: positive regulation of canonical NF-kappaB signal transduction
          term:
            id: GO:0043123
            label: positive regulation of canonical NF-kappaB signal transduction
          modifier: INCREASED
        cell_types:
        - preferred_term: T-helper 17 cell
          term:
            id: CL:0000899
            label: T-helper 17 cell
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
      selected_evidence:
        snippet: Furthermore, the signaling pathways involving IL-1 and TNF-α are central to the pathophysiology
          of SAPHO syndrome, supporting the use of biologic treatments such as TNF-α inhibitors and IL-1
          receptor antagonists
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39286247
      reference_title: The role of cytokines in the pathogenesis of SAPHO syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes IL-1 and TNF-alpha signalling as central, and ties that centrality to the
        therapeutic response that corroborates it.
