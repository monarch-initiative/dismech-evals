      assertion_type: DifferentialDiagnosis
      assertion:
        name: Bacterial osteomyelitis
        description: The differential the sterile osteitis is defined against, and a formal exclusion
          in every proposed criteria set. Imaging and histology can be indistinguishable, and the cost
          of error runs both ways - antibiotics and surgery for an inflammatory disease, or immunosuppression
          for an untreated infection.
        distinguishing_features:
        - No causative organism accounts for the lesions in SAPHO
        - Antibiotics give only transient and incomplete benefit in SAPHO
        - Anterior chest wall hyperostosis and accompanying neutrophilic skin disease are not features
          of bacterial osteomyelitis
      selected_evidence:
        snippet: diagnosing SAPHO relies on the presence of clinical features (including sterile bone
          inflammation, arthritis, inflammatory skin disease) and the exclusion of differential diagnoses
          (such as infections, tumours, Langerhans cell histiocytosis)
        supports: SUPPORT
