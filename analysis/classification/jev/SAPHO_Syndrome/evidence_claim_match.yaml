      assertion:
        name: Comorbidity burden
        description: Comorbidity data are sparse and come largely from single groups, so these are reported
          rather than treated as established disease features. The pattern that does recur is cardiometabolic
          - hypertension is the commonest reported comorbidity and metabolic syndrome is more prevalent
          than in controls - alongside increased osteoporosis and a substantial fibromyalgia fraction,
          the latter mattering because it confounds the pain outcome that every SAPHO treatment is judged
          on.
      selected_evidence:
        snippet: Przepiera-Będzak et al. reported hypertension (25%) as the most common comorbidity, followed
          by hypothyroidism and diabetes (9.6% each)
        supports: SUPPORT
