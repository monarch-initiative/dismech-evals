            term:
              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Exome or genome sequencing with SARS1 variant interpretation
        description: 'Molecular diagnosis rests on identifying SARS1 variants against transcript NM_006513.4
          by exome or genome sequencing. Three interpretation points follow from the published allelic
          series. First, do not filter for biallelic hits only: one reported patient carried a de novo
          monoallelic dominant-negative allele, and a laboratory applying a strict recessive filter would
          have discarded it. Second, expect the ClinVar evidence to be weaker than the OMIM entry implies
          - the allele published as causal in the Turkish series is currently a variant of uncertain significance
          in ClinVar - so a SARS1 candidate will often need functional support rather than database endorsement.
          Third, since the two named genes SARS1 and SARS2 differ only by a digit and share the legacy
          symbol SARS, confirm from the transcript accession, not the symbol, which enzyme has been reported.'
      selected_evidence:
        snippet: we identified a homozygous missense mutation (c.514G>A, p.Asp172Asn) in the cytoplasmic
          seryl-tRNA synthetase (SARS) gene
        supports: SUPPORT
    origin:
