        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cardiomyocyte Translational Insufficiency
        biological_scale: TISSUE
        description: Cardiomyopathy is part of the SARS1 phenotype in the presentation reported from Nancy
          and is the feature that determines survival. In the documented decompensation episode the left
          ventricular ejection fraction fell to 20%, requiring mechanical ventilation and vasopressor
          support, with myocardial oedema that resolved on follow-up echocardiography; a subsequent febrile
          crisis produced severe biventricular dysfunction and fatal cardiogenic shock. Cardiac muscle
          is a plausible target for a charging-capacity defect because it combines high protein turnover
          with an inability to reduce workload during fever - the opposite of skeletal muscle, which can
          rest. The reversibility of the myocardial oedema between crises argues that the cardiac lesion
          is at least in part an acute, demand-driven failure superimposed on a chronic cardiomyopathy
          rather than fixed structural damage alone.
        biological_processes:
        - preferred_term: cytoplasmic translation
          modifier: DECREASED
          term:
            id: GO:0002181
            label: cytoplasmic translation
        cell_types:
        - preferred_term: cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        mechanism_confidence: PROVISIONAL
        notes: No cardiac tissue from a SARS1 patient has been studied, so the attribution of the cardiomyopathy
          to cardiomyocyte translational insufficiency is inference from the systemic mechanism plus the
          organ involved. The competing explanation - that the cardiac failure is a secondary consequence
          of systemic metabolic collapse and inflammatory myocardial injury during sepsis-like decompensation,
          rather than a cell-autonomous cardiomyocyte defect - is not excluded by any published data and
          is arguably better supported by the myocardial oedema and its resolution. Both readings are
          recorded; neither is asserted as settled.
      selected_evidence:
        snippet: We describe here a new clinical presentation including developmental delay, central deafness,
          cardiomyopathy, and metabolic decompensation during fever leading to death, in a consanguineous
          Turkish family, with biallelic variants (c.638G>T, p.(Arg213Leu)) in SARS1
        supports: SUPPORT
