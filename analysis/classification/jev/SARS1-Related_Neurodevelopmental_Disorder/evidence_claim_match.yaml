      assertion_type: Diagnosis
      assertion:
        name: Serylation (aminoacylation) assay in patient fibroblasts
        description: The functional confirmatory test for a candidate SARS1 variant. Serylation activity
          measured in patient-derived fibroblasts, alongside yeast complementation, is what established
          pathogenicity for the dominant-negative allele and is the assay that distinguishes a true hypomorph
          from an incidental rare missense change. In the published SARS1 cases it was performed in a
          research setting; this entry makes no claim about where it is available as a clinical service,
          because no cached source addresses that. Its value is highest precisely where the genomic evidence
          is weakest, which for this gene is most of the time.
      selected_evidence:
        snippet: This missense variant was shown to lead to protein instability, resulting in reduced
          protein level and enzymatic activity.
        supports: SUPPORT
