              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: Treatment
      assertion:
        name: Emergency protocol for febrile illness
        action_category: THERAPEUTIC
        description: 'Because febrile illness is the trigger for lethal decompensation, anticipatory management
          of intercurrent fever is the central chronic-care task in this disorder: early presentation,
          aggressive escalation of L-serine, and cardiac and haemodynamic monitoring during the episode.
          The 2026 report explicitly frames early, aggressive escalation as a viable strategy while noting
          that no guidelines exist. It also records the limit of the approach: the patient died in a subsequent
          crisis despite having an emergency protocol in place, so a protocol reduces but does not remove
          the risk.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: acute decompensation emergency protocol
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: No published protocol exists to cite; the components listed in the description are drawn
          from what was actually done in the single reported episode (progressive tripling of L-serine,
          standard supportive care, mechanical ventilation and vasopressors as needed, serial cardiac
          biomarkers and echocardiography). Nothing here should be read as a validated pathway.
      selected_evidence:
        snippet: The findings strongly suggest that early, aggressive escalation of L-serine dosage can
          be a viable therapeutic strategy for acute decompensation in SARS1 deficiency.
        supports: SUPPORT
