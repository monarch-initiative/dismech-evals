      assertion_type: Pathophysiology
      assertion:
        name: Impaired Selenocysteine Incorporation
        biological_scale: MOLECULAR
        description: A predicted second consequence of the same enzyme deficit, included because it is
          a specific, testable prediction that the aminoacylation literature makes and the clinical literature
          has never examined. Selenoprotein synthesis in all domains of life begins with SerRS serylating
          the selenocysteine-specific tRNA-Sec; the serylated intermediate is then converted to selenocysteinyl-tRNA-Sec
          for co-translational insertion of the 21st amino acid. A hypomorphic SerRS therefore throttles
          the supply of the obligatory precursor for every selenoprotein. Which selenoproteins would be
          rate-limited first, and whether any of them are the antioxidant enzymes usually invoked, is
          not addressed by any source cached for this entry. If this arm operates, it would predict oxidative
          vulnerability that worsens under febrile stress and would give SARS1 deficiency a pathophysiological
          component that other ARS deficiencies do not have.
        biological_processes:
        - preferred_term: selenocysteine incorporation
          modifier: DECREASED
          term:
            id: GO:0001514
            label: selenocysteine incorporation
        - preferred_term: conversion of seryl-tRNA(Sec) to selenocysteinyl-tRNA(Sec)
          modifier: DECREASED
          term:
            id: GO:0001717
            label: conversion of seryl-tRNAsec to selenocys-tRNAsec
        molecular_functions:
        - preferred_term: serine-tRNA ligase activity
          modifier: DECREASED
          term:
            id: GO:0004828
            label: serine-tRNA ligase activity
        mechanism_confidence: HYPOTHETICAL
        notes: 'Explicitly HYPOTHETICAL and flagged as such rather than presented as part of the mechanism.
          No selenoprotein measurement, plasma selenium, glutathione peroxidase activity or selenocysteine-recoding
          assay has been reported in any SARS1 patient. The only established element is the biochemistry:
          SerRS serylates tRNA-Sec. Whether a partial reduction in SerRS activity is enough to limit the
          tRNA-Sec branch specifically is unknown - tRNA-Sec is a quantitatively minor substrate, so it
          could equally be spared or preferentially affected. This node is retained because it is cheap
          to test and would be diagnostically useful if true, not because there is evidence for it.'
      selected_evidence:
        snippet: SerRS also serylates the selenocysteine-specific tRNA (tRNASec) to participate in the
          translational incorporation of selenocysteine
        supports: SUPPORT
