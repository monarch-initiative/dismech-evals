  0363f70b0fe17ff11f7a9f4684e09ea255ef0aa775e4e041f5ead5c496767081:
    claim:
      about:
        disease:
          name: SARS1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with microcephaly, ataxia, and seizures
            term:
              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        description: 'A single reported exception, and it is mechanistically informative rather than a
          nosological nuisance. One patient carried a DE NOVO splice-site deletion producing a five-amino-acid
          in-frame insertion near the active site, and complementation in Saccharomyces cerevisiae plus
          serylation assays in both yeast and the patient''s own fibroblasts showed the allele to be not
          merely loss-of-function but DOMINANT NEGATIVE. Because SerRS is an obligate homodimer, a catalytically
          dead subunit that still dimerises poisons the wild-type subunit it partners, so a single such
          allele can drop total cellular serylation below the threshold that one intact recessive allele
          comfortably supports. That patient''s phenotype was also different: complex spastic paraplegia
          with ataxia, intellectual disability, developmental delay and seizures, but explicitly WITHOUT
          microcephaly.

          Recorded because the mode of inheritance for this gene cannot be stated as autosomal recessive
          without qualification, and a diagnostic laboratory that filters SARS1 for biallelic hits only
          will miss this class of allele. It rests on a single published patient. The homodimer-poisoning
          rationale above is the standard interpretation of a dominant-negative allele in an obligate-dimeric
          class II synthetase and is consistent with the cited assays, but the specific claim that the
          mutant subunit heterodimerises with wild-type SerRS was not itself demonstrated in that paper
          and is therefore reasoning, not a finding. Penetrance is UNKNOWN on a single case.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: UNKNOWN
      selected_evidence:
        snippet: A de novo splice site deletion in SARS1 was identified in our patient, resulting in a
          5-amino acid in-frame insertion near its active site.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/1
      evidence_path: /inheritance/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36041817
      reference_title: Loss of seryl-tRNA synthetase (SARS1) causes complex spastic paraplegia and cellular
        senescence.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes a de novo, monoallelic SARS1 event as a cause of disease at this locus.
