  b90a4a5064d08e75eae43f778ae7f52196aeab99691e705a389b029d93368792:
    claim:
      about:
        disease:
          name: SARS1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with microcephaly, ataxia, and seizures
            term:
              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other recessive cytoplasmic aminoacyl-tRNA synthetase deficiencies
        description: 'Not a single disease but the class this disorder belongs to, and in practice the
          differential a metabolic physician actually faces. Recessive deficiencies of AARS1, DARS1, GARS1,
          HARS1, IARS1, KARS1, LARS1, MARS1, QARS1, RARS1, VARS1 and YARS1 share a phenotype template
          with SARS1 deficiency: abnormalities of the central nervous system and/or the senses in all
          thirteen of the deficiencies surveyed - a compound category, not a claim about the CNS alone
          - plus failure to thrive, gastrointestinal symptoms, dysmaturity, liver disease and facial dysmorphism
          recurring across the group, with symptoms concentrated in the first year of life and during
          infections. Because the clinical picture does not identify the gene, the practical route to
          diagnosis is a broad sequencing approach rather than a targeted one, and the practical route
          to management - adequate protein and amino acid supply rather than protein restriction - is
          shared across the class.'
        distinguishing_features:
        - The clinical phenotypes of the recessive ARS deficiencies are described as diverse and without
          apparent logic; they are not separable at the bedside and the distinction is molecular.
        - Pulmonary alveolar proteinosis points towards MARS1, IARS1 or LARS1 rather than SARS1; it has
          not been reported in SARS1 disease.
        - Prominent liver disease points away from SARS1, in which hepatic involvement has not been reported.
        - Microcephaly as the leading feature narrows the group towards SARS1 and WARS1.
        - Fever-triggered decompensation is a class feature rather than a SARS1-specific one, so its presence
          does not identify the gene.
        notes: No MONDO term is bound to this differential because it is a class, not a disease entity,
          and binding any single member's term would misrepresent it. The gene symbols listed are the
          current HGNC forms of the symbols used in the quoted source, which predates the "1" suffix convention
          and writes AARS, DARS, GARS and so on.
      selected_evidence:
        snippet: In literature, we identified 107 patients with AARS, DARS, GARS, HARS, IARS, KARS, LARS,
          MARS, RARS, SARS, VARS, YARS, and QARS deficiencies
        supports: SUPPORT
