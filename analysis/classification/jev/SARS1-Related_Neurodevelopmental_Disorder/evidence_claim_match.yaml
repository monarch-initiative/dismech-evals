        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: WARS1-related neurodevelopmental disorder with microcephaly and speech delay
        disease_term:
          preferred_term: neurodevelopmental disorder with microcephaly and speech delay, with or without
            brain abnormalities
          term:
            id: MONDO:0957218
            label: neurodevelopmental disorder with microcephaly and speech delay, with or without brain
              abnormalities
        description: The closest true clinical mimic, and the reason the two were described in one paper.
          Biallelic variants in WARS1, the CYTOPLASMIC tryptophanyl-tRNA synthetase, produce microcephaly,
          developmental delay, intellectual disability and brain anomalies that overlap the SARS1 phenotype
          closely enough that the authors proposed a single emerging category of ARS-related developmental
          disorders with or without microcephaly. The distinction is molecular, not clinical.
        distinguishing_features:
        - Different gene - WARS1 is hgnc:12729, SARS1 is hgnc:10537; both are cytoplasmic synthetases
          and both disorders are autosomal recessive.
        - Different MONDO and OMIM entities - MONDO:0957218 / OMIM:620317 for WARS1 versus MONDO:0060577
          / OMIM:617709 here.
        - WARS1 also carries a dominant disease, distal hereditary motor neuronopathy type 9 (MONDO:0060585),
          which has no SARS1 counterpart; a family history of adult-onset motor neuropathy points to WARS1.
        - Central deafness, cardiomyopathy and fever-triggered metabolic decompensation have been reported
          in SARS1 disease and are not features of the WARS1 recessive phenotype as described.
        - Speech delay is emphasised in the WARS1 entity's own name; both disorders involve speech impairment,
          so this does not discriminate at the bedside.
        notes: MONDO:0957218 and hgnc:12729 were verified with OAK (`runoak -i sqlite:obo:mondo relationships
          --direction down -p RO:0004003 HGNC:12729` returns MONDO:0060585 and MONDO:0957218; `runoak
          -i sqlite:obo:mondo info MONDO:0957218 -O obo` gives xref OMIM:620317). No dismech entry exists
          for either WARS1 disorder as of this curation.
      selected_evidence:
        snippet: 'define an emerging disease spectrum: ARS-related developmental disorders with or without
          microcephaly'
        supports: SUPPORT
