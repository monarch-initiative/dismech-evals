          during febrile illness, with left ventricular ejection fraction falling to 20% in the documented
          episode and biventricular failure with fatal cardiogenic shock in a later one. Any child given
          a molecular diagnosis of SARS1 deficiency needs cardiac surveillance regardless of which presentation
          they were ascertained through, because the cardiac risk has not been shown to be allele-restricted
          - only to be, so far, allele-associated.
