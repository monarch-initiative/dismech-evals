  69ebd94107f1eadc6a628f3da20506aaf39cf56f5f97d55fb95c5d10ca2d0953:
    claim:
      about:
        disease:
          name: SARS1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with microcephaly, ataxia, and seizures
            term:
              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neural Progenitor Proliferation and Brain Growth
        biological_scale: TISSUE
        description: 'The causal step from a translation defect to the cardinal phenotype. Brain growth
          in the second and third trimesters and the first postnatal years is among the most protein-synthesis-intensive
          processes in human development; a ceiling on charged-tRNA supply constrains progenitor proliferation
          and the accretion of neuronal and glial mass, producing microcephaly. This is the single feature
          that unites the SARS1 families with the recessive WARS1 families reported alongside them, and
          it is the reason the two were described together as an emerging disease group of ARS-related
          developmental disorders with or without microcephaly. The microcephaly is not an isolated head-size
          measurement: it is accompanied by intellectual disability, developmental delay and structural
          brain anomalies in the same individuals.'
        biological_processes:
        - preferred_term: brain development
          modifier: ABNORMAL
          term:
            id: GO:0007420
            label: brain development
        - preferred_term: cytoplasmic translation
          modifier: DECREASED
          term:
            id: GO:0002181
            label: cytoplasmic translation
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        mechanism_confidence: PROVISIONAL
        notes: 'The link from reduced charging to reduced progenitor proliferation is reasoning from the
          demand-capacity model plus the observed microcephaly; no SARS1-specific proliferation assay,
          organoid, or fetal brain measurement has been published. The specific cell type at which the
          constraint bites - radial glia, intermediate progenitor, or post-mitotic neuron - is unknown,
          which is why the node is bound to the generic CL:0000540 neuron rather than to a progenitor
          class the evidence does not identify. Microcephaly is also NOT universal in this entity: the
          dominant-negative patient explicitly lacked it.'
      selected_evidence:
        snippet: Here, we report five individuals with biallelic missense variants in WARS1 or SARS1,
          who presented with an overlapping phenotype of microcephaly, developmental delay, intellectual
          disability, and brain anomalies.
        supports: SUPPORT
