            term:
              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cellular Senescence with a Senescence-Associated Secretory Phenotype
        biological_scale: CELLULAR
        description: 'The only cell-autonomous phenotype demonstrated in human SARS1 patient cells. Fibroblasts
          from the patient with the de novo dominant-negative allele showed abnormal cell shape, arrested
          division, increased beta-galactosidase staining, and a senescence-associated secretory phenotype
          with raised interleukin-6, p21, p16 and p53. The authors read this as revealing a role for SARS1
          in the regulation of cell growth, division and senescence. There are two ways this could arise
          and they are not mutually exclusive: a translational ceiling is itself a proliferation constraint
          and chronically stalled growth engages p53/p21-dependent arrest; alternatively, the senescence
          could reflect loss of a non-canonical SerRS activity, since SerRS binds telomeric DNA and cooperates
          with the shelterin protein POT1 to regulate telomere length and senescence. Distinguishing these
          would require testing whether senescence is rescued by restoring serylation alone.'
        biological_processes:
        - preferred_term: cellular senescence
          modifier: INCREASED
          term:
            id: GO:0090398
            label: cellular senescence
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        mechanism_confidence: PROVISIONAL
        notes: Scope caveat. This result comes from the fibroblasts of the ONE patient with the dominant-negative
          allele and the atypical spastic-paraplegia phenotype. It has not been reproduced in fibroblasts
          from any recessive SARS1 patient, so it is not established as a general feature of the disorder,
          and it should not be read backwards as evidence that the microcephaly families' cells senesce.
          Its relevance to a post-mitotic neuron, which does not divide, is also unclear - senescence-like
          states in neurons are described but are not the same phenomenon as replicative arrest in a fibroblast.
      selected_evidence:
        snippet: Fibroblasts showed an abnormal cell shape, arrested division and increased beta-galactosidase
          staining along with a senescence-associated secretory phenotype (raised interleukin-6, p21,
          p16 and p53 levels).
        supports: SUPPORT
