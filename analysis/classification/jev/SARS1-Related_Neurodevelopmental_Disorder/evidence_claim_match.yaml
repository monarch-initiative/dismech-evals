  f7a4d078d703a27096bfea90c9100a6d4e5848534053fd806f5805b9a2902d40:
    claim:
      about:
        disease:
          name: SARS1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with microcephaly, ataxia, and seizures
            term:
              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Insufficient Aminoacylation Capacity for Translational Demand
        biological_scale: CELLULAR
        description: 'The organising hypothesis of the whole recessive ARS deficiency family, and the
          reason this disorder''s phenotype is not arbitrary. Aminoacylation is the committed first step
          of protein synthesis: the synthetase ligates the amino acid to its cognate tRNA, and the resulting
          aminoacyl-tRNA is handed to ribosome elongation factors. A hypomorphic synthetase leaves a cell
          able to translate at rest but unable to scale, so the deficit manifests wherever and whenever
          translational demand is highest - in the tissues with the highest amino-acid incorporation rates
          and during the periods of highest demand, which are early growth and intercurrent illness. Fuchs
          and colleagues reached this formulation from the whole recessive ARS cohort, in which SARS was
          one of the thirteen synthetase deficiencies analysed, and drew from it the clinically consequential
          corollary that patients need adequate protein and amino acid supply rather than the traditional
          protein restriction of metabolic disease.'
        biological_processes:
        - preferred_term: cytoplasmic translation
          modifier: DECREASED
          term:
            id: GO:0002181
            label: cytoplasmic translation
        - preferred_term: tRNA aminoacylation for protein translation
          modifier: DECREASED
          term:
            id: GO:0006418
            label: tRNA aminoacylation for protein translation
        cellular_components:
        - preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
        mechanism_confidence: PROVISIONAL
        notes: Marked PROVISIONAL for this specific disease rather than ESTABLISHED, and the distinction
          matters. The demand-capacity model is well argued across the ARS family as a whole and is the
          only model that accounts for both the tissue distribution and the fever triggering. But no measurement
          of global or codon-specific translation rate has ever been reported in SARS1 patient cells;
          the model is imported from the family, not demonstrated for this gene. A ribosome-profiling
          experiment in SARS1 patient fibroblasts, with and without serine supplementation and with and
          without a thermal or inflammatory challenge, would convert this from an inference to a finding.
          It has not been done - see the knowledge-gap discussions.
      selected_evidence:
        snippet: We therefore suggest that the functional integrity of tRNAs in general is an important
          factor in the development and maintenance of human cognitive functions.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/3
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28236339
      reference_title: Mutations of the aminoacyl-tRNA-synthetases SARS and WARS2 are implicated in the
