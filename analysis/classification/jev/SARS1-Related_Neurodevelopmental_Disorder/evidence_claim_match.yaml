            label: Cardiomyopathy
        notes: The generic HP:0001638 (Cardiomyopathy) is bound rather than HP:0001644 (Dilated cardiomyopathy)
          or a hypertrophic term, because no cached source states the morphological subtype; the reported
          findings are a depressed ejection fraction, myocardial oedema, and biventricular dysfunction,
          which constrain function but not morphology. Reported in one family (with the 2026 case report
          describing what is on internal evidence a member of that same family), so the frequency across
          the disorder is unknown and no band is asserted.
