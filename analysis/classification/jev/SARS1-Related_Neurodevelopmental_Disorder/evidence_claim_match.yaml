        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hypomyelinating leukodystrophy 3
        disease_term:
          preferred_term: hypomyelinating leukodystrophy 3
          term:
            id: MONDO:0009843
            label: hypomyelinating leukodystrophy 3
        description: A mechanistic rather than a bedside differential. AIMP1 encodes a non-catalytic scaffold
          component of the cytoplasmic multi-tRNA-synthetase complex, and its loss causes a recessive
          disorder with microcephaly, severe developmental failure and seizures. The founding SARS1 paper
          cites AIMP1 explicitly as the precedent that led its authors to propose tRNA-aminoacylation
          integrity as a general requirement for human cognition. The pair therefore anchors the argument
          that lesions anywhere in the cytoplasmic aminoacylation apparatus - catalytic subunit or scaffold
          - converge on a neurodevelopmental phenotype.
        distinguishing_features:
        - Different gene - AIMP1 is hgnc:10648; AIMP1 is a scaffold protein of the multi-synthetase complex,
          not a synthetase, and has no aminoacylation activity of its own.
        - Hypomyelination is the defining MRI feature of HLD3; the SARS1 imaging phenotype reported to
          date is diffuse cerebral and cerebellar atrophy, not a hypomyelinating pattern.
        - Onset and severity are commonly said to differ, with HLD3 the earlier and more severe of the
          two, but no source cached for this entry states patient age, onset age or survival for either
          condition, so this contrast is background rather than a usable discriminator.
        - Cardiomyopathy and fever-triggered metabolic decompensation are reported in SARS1 disease and
          are not features of HLD3.
        notes: MONDO:0009843 and hgnc:10648 were verified with OAK (`runoak -i sqlite:obo:mondo relationships
          --direction down -p RO:0004003 HGNC:10648` returns MONDO:0009843 only). The clinical description
          of HLD3 above is general background and is deliberately not evidenced with a snippet, because
          no HLD3 paper is cached in this repository; the quotable element is the founding SARS1 paper's
          own citation of AIMP1, which is attached below.
      selected_evidence:
        snippet: three genes with a role in tRNA-aminoacylation are now associated with this condition
        supports: SUPPORT
    origin:
