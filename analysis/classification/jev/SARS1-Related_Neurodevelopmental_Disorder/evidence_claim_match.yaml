  dd729b3036c72d7be18114d64969d8178eba62350a0109a420305cecd70ebb60:
    claim:
      about:
        disease:
          name: SARS1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with microcephaly, ataxia, and seizures
            term:
              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Danio rerio
        genotype: adrasteia (adr) mutants; sars (seryl-tRNA synthetase) loss of function
        category: Forward-genetic mutant isolated in a vascular screen
        description: 'The zebrafish sars mutants are the only established animal model of the gene, and
          they are NOT a model of this disease - a distinction this entry insists on. They were recovered
          in a screen for vascular development and maintenance, and their phenotype is vascular: pronounced
          dilatation of the aortic arch vessels, aberrant patterning of hindbrain capillaries, and to
          a lesser extent altered intersomitic vessels, with the aortic dilatation dependent on Vegf signalling
          rather than on increased cell proliferation. Positional cloning identified seryl-tRNA synthetase
          as the affected gene, and siRNA knockdown in human umbilical vein endothelial cells showed the
          same regulation of endothelial sprouting. The model therefore validates the non-canonical, VEGFA-related
          function of SerRS at the organism level. It says nothing about microcephaly, ataxia, seizures,
          cardiomyopathy or febrile decompensation, and no vascular malformation has ever been reported
          in a human SARS1 patient. The consequence of that gap - that this disorder has no animal or
          cellular disease model at all, and what a usable one would have to capture - is worked through
          in the HUMAN_MODEL_MISMATCH discussion `sars1-no-disease-model`, which proposes the knock-in
          mouse and patient-derived cortical organoid experiments that would close it.'
        genes:
        - preferred_term: SARS1
          term:
            id: hgnc:10537
            label: SARS1
        associated_phenotypes:
        - Dilatation of the aortic arch vessels
        - Aberrant hindbrain capillary patterning
        - Altered intersomitic vessel patterning
      selected_evidence:
        snippet: These analyses of zebrafish and human endothelial cells reveal a new noncanonical function
          of Sars in endothelial development
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/2
