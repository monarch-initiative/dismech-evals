  851486b42d6bf5e5a1261a8839741c6d76b397b492425f3b8823cc649f14bf57:
    claim:
      about:
        disease:
          name: SARS1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with microcephaly, ataxia, and seizures
            term:
              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Non-Canonical Nuclear SerRS Function
        biological_scale: MOLECULAR
        description: 'Vertebrate SerRS is not only a synthetase. It acquired a C-terminal UNE-S domain
          in the lineage that developed closed circulatory systems; UNE-S carries a nuclear localisation
          signal that directs SerRS into the nucleus, where it attenuates VEGFA expression, acting through
          a complex with the transcription factor YY1 that binds distal cis-regulatory elements of the
          vegfa promoter and competes with activating factors. Genetically, this is not a minor embellishment:
          zebrafish sars mutants isolated in a vascular screen show dilated aortic arch vessels and aberrant
          hindbrain capillary patterning in a Vegf-dependent manner, and human SerRS alleles that disrupt
          nuclear localisation cause abnormal vasculature and premature death in fish. The question for
          this entry is whether any of this contributes to the human disease. The honest answer is that
          it is not known, and this node exists to say so precisely rather than to leave the moonlighting
          literature quietly attached to the mechanism.'
        genes:
        - preferred_term: SARS1
          term:
            id: hgnc:10537
            label: SARS1
        biological_processes:
        - preferred_term: negative regulation of vascular endothelial growth factor production
          modifier: ABNORMAL
          term:
            id: GO:1904046
            label: negative regulation of vascular endothelial growth factor production
        - preferred_term: telomere maintenance
          modifier: ABNORMAL
          term:
            id: GO:0000723
            label: telomere maintenance
        cellular_components:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        mechanism_confidence: HYPOTHETICAL
        notes: 'Why this is marked HYPOTHETICAL and kept out of the main causal chain. Three arguments
          say the human disease is a charging defect and not a moonlighting defect. (1) Every SARS1 allele
          reported in the clinical literature with a published location maps to the catalytic core or
          active site, not to UNE-S or its NLS; the one UNE-S-region allele this curation found, ClinVar
          VCV004529504 p.Ala497_Arg498insAla, has no accompanying publication and no functional data,
          so it weakens the argument without overturning it. (2) The functional assays performed in patient
          material measured serylation and protein abundance, and both were abnormal, so the charging
          deficit is demonstrated rather than assumed. (3) No vascular malformation, no VEGFA-related
          phenotype and no angiogenic abnormality has been reported in any SARS1 patient, in contrast
          to the striking vascular phenotype of the fish mutants.

