        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deficient Serylation of tRNA-Ser
        biological_scale: MOLECULAR
        description: 'The convergent molecular defect. SerRS is a homodimeric class II synthetase that
          catalyses aminoacylation in two steps - serine is first activated by ATP to form enzyme-bound
          serine-adenylate, then the seryl moiety is transferred to the 3'' end of the cognate tRNA to
          give Ser-tRNA-Ser for delivery to the ribosome. Its recognition strategy is unusual and relevant
          here: unlike most synthetases SerRS does not read the anticodon but recognises the long variable
          arm unique to tRNA-Ser, and each subunit''s N-terminal tRNA-binding domain directs the tRNA
          3''-CCA end into the active site of the OTHER subunit, so the functional unit is the dimer rather
          than the monomer. Motifs 2 and 3 of the class II fold carry the active-site residues; motif
          1 forms the dimer interface. Patient-derived material shows the predicted outcome: serylation
          assays in patient fibroblasts were used to demonstrate loss of function, and the founding report
          inferred reduced cytoplasmic tRNA-Ser charging directly from the impaired enzymatic activity
          of the mutant.'
        genes:
        - preferred_term: SARS1
          term:
            id: hgnc:10537
            label: SARS1
        molecular_functions:
        - preferred_term: serine-tRNA ligase activity
          modifier: DECREASED
          term:
            id: GO:0004828
            label: serine-tRNA ligase activity
        biological_processes:
        - preferred_term: seryl-tRNA aminoacylation
          modifier: DECREASED
          term:
            id: GO:0006434
            label: seryl-tRNA aminoacylation
        - preferred_term: tRNA aminoacylation for protein translation
          modifier: DECREASED
          term:
            id: GO:0006418
            label: tRNA aminoacylation for protein translation
        chemical_entities:
        - preferred_term: L-serine
          term:
            id: CHEBI:17115
            label: L-serine
        - preferred_term: ATP
          term:
            id: CHEBI:15422
            label: ATP
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: catalyzes the aminoacylation reaction that charges serine onto its cognate tRNA for protein
          synthesis
        supports: SUPPORT
