  934346e37fa0861c0de9daaa0063edd77132e370d52b7824fadcd54a487f02f8:
    claim:
      about:
        disease:
          name: SARS1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with microcephaly, ataxia, and seizures
            term:
              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: Genetic
      assertion:
        name: SARS1
        association: Biallelic missense and splice variants in the catalytic core cause autosomal recessive
          disease; one de novo, dominant-negative in-frame insertion allele has been reported
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: SARS1
          term:
            id: hgnc:10537
            label: SARS1
        notes: 'Nomenclature and identity. HGNC:10537 is symbol SARS1, "seryl-tRNA synthetase 1", at 1p13.3,
          Entrez 6301, Ensembl ENSG00000031698, UniProt P49591, EC 6.1.1.11, gene MIM 607529 (OAK, `runoak
          -i sqlite:obo:hgnc info hgnc:10537 -O obo`, 2026-08-01). The former approved symbol was SARS,
          which is how the gene appears in PMID:28236339 and in all the pre-2019 mechanistic literature,
          and the protein is universally called SerRS. Do not confuse with SARS2 (hgnc:17697), the mitochondrial
          enzyme, which unhelpfully also carries "SARS" as an exact synonym in HGNC.

          Allelic series, as published. c.514G>A (p.Asp172Asn), homozygous, Iranian family, enzymatic
          core domain, impaired activity and predicted plus demonstrated protein instability (PMID:28236339).
          c.638G>T (p.Arg213Leu), biallelic, consanguineous Turkish family, protein instability with reduced
          protein level and enzymatic activity (PMID:34570399). c.1196C>T (p.Thr399Met), reported as a
          novel variant in a Turkish series of three unrelated families with four patients; the abstract
          says only that "both patients carried" it, so how many of the four it was found in cannot be
          determined from the cached text and no family or patient count is asserted for this allele here
          - see the CURATION_TODO (PMID:36004946). A further variant mapped structurally into the active
          site (PMID:35790048) - the abstract does not give its coding change, and the full text is not
          cached, so no HGVS string is asserted for it here. A de novo splice-site deletion causing a
          five-residue in-frame insertion near the active site, dominant negative (PMID:36041817). All
          coding changes are against NM_006513.4, the transcript ClinVar uses for this gene.

          Variant classification is genuinely unsettled and is recorded rather than smoothed. A ClinVar
          E-utilities query on 2026-08-01 (`esearch db=clinvar term="SARS1[gene] AND single_gene[prop]"`)
          returned 69 records. Both founding disease alleles - c.514G>A (VCV000440921) and c.638G>T (VCV001209576)
          - are filed against the condition "Neurodevelopmental disorder with microcephaly, ataxia, and
          seizures" but currently return "no classifications from unflagged records", so ClinVar carries
          no usable classification for either. The Karaer allele c.1196C>T (VCV002506443) is classified
          Uncertain significance against "not specified" by a single submitter with criteria - that is,
          the variant published as the cause of disease in a Turkish series is a VUS in ClinVar. Two other
          alleles, c.447+1G>A (VCV003893287) and c.1483GCA[4] p.Ala497_Arg498insAla (VCV004529504), are
          Likely pathogenic for this condition and have no corresponding publication that this curation
          could find. Residues 497-498 fall inside the C-terminal UNE-S appendage, whose boundaries are
          given as 470-514 in the cached full text of PMID:22353712 ("the entire UNE-S (delta470-514)");
          that domain assignment is arithmetic on a cached range, not a claim taken from any SARS1 clinical
          paper. A laboratory reporting a SARS1 variant should therefore expect the evidence base to be
          thinner than the OMIM entry implies. These ClinVar figures are from the public API and are not
          quotable from a cached reference, so they appear here and not as evidence snippets.

          Not asserted, deliberately. gnomAD constraint metrics (pLI, o/e LoF, missense Z) are NOT recorded
          anywhere in this entry because no cached source provides them and populating them from memory
          is exactly the failure mode the evidence rules exist to prevent. No allele frequency is asserted
          for any variant. No founder effect is claimed: the recurrence of Turkish and Iranian ancestry
          in the reports most likely reflects ascertainment in consanguinity-enriched recessive cohorts,
          and consanguinity is stated in the cached abstracts only for the Turkish family of PMID:34570399
          - PMID:36004946 describes its Turkish families as unrelated but says nothing about consanguinity,
          and PMID:28236339 does not describe its Iranian family as consanguineous either. No genotype-phenotype
          rule is asserted beyond the two that the literature states directly - that the dominant-negative
          allele produced spastic paraplegia without microcephaly, and that fever-triggered decompensation
          has so far been reported only with p.Arg213Leu. Whether complete SARS1 loss of function occurs
          in humans is unknown and presumed lethal, on the general grounds that cytoplasmic aminoacyl-tRNA
          synthetases are essential; that presumption is reasoning, not a cited finding.'
      selected_evidence:
        snippet: Sequencing results showed that both patients carried a novel missense variant c.1196C>T
          (p.Thr399Met) in the seryl-tRNA synthetase gene.
        supports: SUPPORT
