            term:
              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cerebellar and Cerebral Atrophy
        biological_scale: TISSUE
        description: Structural neuroimaging in the Turkish NEDMAS families showed bilateral cerebral
          AND cerebellar diffuse atrophy. The cerebellar component is the anatomical substrate of the
          ataxia that names the disorder, and its presence alongside cerebral atrophy indicates that the
          lesion is not confined to a developmental failure of head growth but includes ongoing tissue
          loss. That combination - a small brain that also atrophies - is characteristic of the recessive
          ARS deficiencies generally, and it is the reason the disorder is curated as neurodevelopmental
          with a neurodegenerative component rather than as static.
        biological_processes:
        - preferred_term: brain development
          modifier: ABNORMAL
          term:
            id: GO:0007420
            label: brain development
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        mechanism_confidence: PROVISIONAL
        notes: 'The Purkinje-cell binding is an anatomical inference about which cerebellar cell type
          is most likely to be vulnerable, not a reported neuropathological finding. No cerebellar histopathology
          has been published for any SARS1 patient, and the imaging reports describe diffuse atrophy without
          regional or cellular resolution. Whether the atrophy is progressive over time, as opposed to
          established early and static, is also unknown: no serial imaging series has been published.'
      selected_evidence:
        snippet: Brain imaging revealed bilateral cerebral and cerebellar diffuse atrophy.
        supports: SUPPORT
