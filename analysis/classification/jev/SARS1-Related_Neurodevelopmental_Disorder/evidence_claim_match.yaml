  bc21fed92658f30cdb7e11cabdc6b3e037f8bd5feb779b36db45211a617a675d:
    claim:
      about:
        disease:
          name: SARS1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with microcephaly, ataxia, and seizures
            term:
              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative Poisoning of the SerRS Homodimer
        biological_scale: MOLECULAR
        description: An allele-specific route to the same endpoint. The de novo splice-site deletion reported
          in the spastic paraplegia patient yields a five-residue in-frame insertion near the active site,
          and complementation and serylation assays established that this allele is not simply inactive
          but dominant negative - that is, its presence reduces the activity attainable by the wild-type
          allele in the same cell. This node exists separately from the loss-of-abundance node because
          the two predict different things. Under simple haploinsufficiency a carrier of one null allele
          would be unaffected, which is what is observed for the recessive families; under dimer poisoning
          a single allele suffices, which is what is observed here.
        genes:
        - preferred_term: SARS1
          term:
            id: hgnc:10537
            label: SARS1
        molecular_functions:
        - preferred_term: serine-tRNA ligase activity
          modifier: DECREASED
          term:
            id: GO:0004828
            label: serine-tRNA ligase activity
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        mechanism_confidence: PROVISIONAL
        notes: Marked PROVISIONAL, on one patient and one allele. The dominant-negative effect itself
          is a published experimental result, but the structural interpretation offered here - that a
          catalytically dead subunit heterodimerises with and inactivates its wild-type partner - is inference
          from the known obligate-dimer architecture of class II SerRS and was not directly tested. An
          alternative reading, that the in-frame insertion sequesters tRNA-Ser unproductively, is not
          excluded by the published data.
      selected_evidence:
        snippet: Complementation assays in S. cerevisiae and serylation assays in both yeast strains and
          patient fibroblasts proved a loss-of-function, dominant negative effect.
        supports: SUPPORT
