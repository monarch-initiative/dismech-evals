              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Cardiac assessment with echocardiography
        description: Echocardiography with ejection fraction, together with cardiac biomarkers, is the
          surveillance test that matters most for prognosis in this disorder, and it is also the monitoring
          test during a febrile crisis. In the documented episode the ejection fraction fell to 20%, cardiac
          biomarkers normalised over about twenty days, and follow-up echocardiography at one month showed
          complete resolution of myocardial oedema - so serial imaging, not a single baseline study, is
          what captures the disease.
        notes: The specific follow-up timings (biomarker normalisation within 20 days, echocardiographic
          resolution at 1 month) are stated in the cached abstract of PMID:42158840 and are quoted below
          only in part; the recommendation to perform surveillance echocardiography in all SARS1 patients
          is a curatorial inference from the reported course and is not itself a published guideline.
          No surveillance protocol has been published for this disorder.
      selected_evidence:
        snippet: The clinical course rapidly progressed to metabolic decompensation and severe acute cardiac
          failure, characterised by a left ventricular ejection fraction of 20%, necessitating mechanical
          ventilation and vasopressor support
        supports: SUPPORT
