        name: WARS2-related mitochondrial neurodevelopmental disorder
        disease_term:
          preferred_term: neurodevelopmental disorder, mitochondrial, with abnormal movements and lactic
            acidosis, with or without seizures
          term:
            id: MONDO:0060578
            label: neurodevelopmental disorder, mitochondrial, with abnormal movements and lactic acidosis,
              with or without seizures
        description: 'Included because of a specific citation hazard rather than a clinical one. The founding
          publication for this entry, PMID:28236339, reports TWO families and TWO genes: SARS in the first
          and WARS2 - the mitochondrial tryptophanyl-tRNA synthetase - in the second. Any automated or
          hurried extraction from that paper will attribute WARS2 findings (a nonsense allele with predicted
          nonsense-mediated decay, and a missense allele disrupting the mitochondrial localisation signal)
          to this disorder. They belong to MONDO:0060578, a separate entity with lactic acidosis and abnormal
          movements.'
        distinguishing_features:
        - Different gene and compartment - WARS2 is hgnc:12730 and mitochondrial; SARS1 is hgnc:10537
          and cytoplasmic.
        - Different MONDO and OMIM entities - MONDO:0060578 / OMIM:617710 versus MONDO:0060577 / OMIM:617709;
          the OMIM numbers are consecutive because both came from the same 2017 paper, which compounds
          the hazard.
        - Lactic acidosis is a defining feature of the WARS2 entity and has not been reported in SARS1
          disease; a raised lactate should redirect the workup.
        - Abnormal movements including dystonia and parkinsonism characterise the WARS2 spectrum; the
          movement disorder in SARS1 disease is ataxia.
        notes: 'MONDO:0060578 was verified with OAK (`runoak -i sqlite:obo:mondo info MONDO:0060578 -O
          obo`: xref OMIM:617710, Orphanet:572798, `RO:0004003 HGNC:12730 ! WARS2`, synonyms "WARS2 deficiency"
          and "mitochondrial tryptophanyl-tRNA synthetase deficiency"). This differential exists to protect
          future curation of PMID:28236339, and no WARS2 content was used anywhere in this entry.'
      selected_evidence:
        snippet: we report on mutations in two aminoacyl-tRNA synthetases that are associated with ID
          in two unrelated Iranian families
        supports: SUPPORT
