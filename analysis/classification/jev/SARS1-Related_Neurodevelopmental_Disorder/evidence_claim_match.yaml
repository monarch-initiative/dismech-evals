              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: HarrisonsChapterAssignment
      assertion:
        classification_value: NEUROLOGIC
        notes: 'The defining and universal morbidity is central-nervous-system: microcephaly, moderate
          intellectual disability, global developmental delay, ataxia, tonic-clonic seizures and cerebral
          plus cerebellar atrophy on imaging. The chapter assignment is nonetheless not entirely comfortable,
          and the reason is recorded here rather than hidden. In the deafness-and-cardiomyopathy presentation,
          febrile metabolic decompensation is fatal, and in the one episode reported in detail (PMID:42158840)
          the terminal event was cardiogenic shock - so a purely neurological framing would miss the feature
          that actually determines survival. A single Harrison''s chapter is required, and the neurological
          features are the ones present in every reported individual across every family, so NEUROLOGIC
          is assigned and the cardiac involvement is curated as a phenotype and a pathophysiology node
          instead.'
      selected_evidence:
        snippet: Neurodevelopmental disorder with microcephaly, ataxia, and seizures (NEDMAS) syndrome
          is a rare neurodevelopmental disorder characterized by moderate intellectual disability (ID),
          thin body habitus, microcephaly, seizures, ataxia, muscle weakness, and speech impairment
        supports: SUPPORT
