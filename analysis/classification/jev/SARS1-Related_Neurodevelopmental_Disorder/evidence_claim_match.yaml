            term:
              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced SerRS Protein Stability and Steady-State Abundance
        biological_scale: MOLECULAR
        description: 'Two independently reported missense alleles reduce the amount of SerRS in the cell
          rather than only its per-molecule activity. The founding p.Asp172Asn allele was predicted to
          be unstable and this was substantiated for ectopically expressed mutant protein in transfected
          HEK293T cells; the p.Arg213Leu allele was shown to cause protein instability with a consequent
          fall in both protein level and enzymatic activity. Instability is the commonest single mechanism
          across the recessive ARS deficiencies and it has a specific consequence for this disease: the
          deficit is in total cellular charging CAPACITY, which is exactly the quantity that a rise in
          translational demand can outstrip.'
        genes:
        - preferred_term: SARS1
          term:
            id: hgnc:10537
            label: SARS1
        molecular_functions:
        - preferred_term: serine-tRNA ligase activity
          modifier: DECREASED
          term:
            id: GO:0004828
            label: serine-tRNA ligase activity
        cellular_components:
        - preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        mechanism_confidence: ESTABLISHED
        notes: Evidence quality differs between the two alleles and the difference is worth keeping. For
          p.Asp172Asn the demonstration was in ectopically expressed protein in a transfected immortalised
          cell line, not in patient cells, so it establishes that the substitution destabilises the protein
          but not the steady-state level in a patient neuron. For p.Arg213Leu the reported result is reduced
          protein level together with reduced activity. Neither report is a measurement in human brain.
      selected_evidence:
        snippet: The mutant protein was predicted to be unstable, which could be substantiated by investigating
          ectopic mutant SARS in transfected HEK293T cells.
        supports: SUPPORT
