            label: Moderate intellectual disability
        notes: 'HPO annotation for OMIM:617709 records HP:0002342 (Moderate intellectual disability) at
          4/4, sourced to PMID:28236339 (retrieved 2026-08-01). The term bound here is the graded child
          HP:0002342 rather than the parent HP:0001249 (Intellectual disability), because the sources
          state the grade explicitly. The countervailing observation that a different series reported
          SEVERE developmental delay and intellectual disability is recorded in the description and quoted
          below, so the grade is not presented as settled. Binding the parent instead was considered and
          rejected: HP:0002342 is a descendant of HP:0001249, so any query over the parent already retrieves
          this entry by subsumption, whereas demoting the binding would delete from the machine-readable
          layer the one grade that HPOA and two independent papers actually state. The moderate-versus-severe
          spread is therefore carried by the description and by the PARTIAL evidence item rather than
          by weakening the term.'
      selected_evidence:
