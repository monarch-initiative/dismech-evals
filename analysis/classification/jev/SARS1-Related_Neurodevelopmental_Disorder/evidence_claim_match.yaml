  db273acf5e4aaad9f461968ce20d2dac4d2d18c0f74bf79fcf2c96cd47046d1e:
    claim:
      about:
        disease:
          name: SARS1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with microcephaly, ataxia, and seizures
            term:
              id: MONDO:0060577
              label: neurodevelopmental disorder with microcephaly, ataxia, and seizures
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: 'The dominant mode by a wide margin. Every family in the microcephaly and in the
          cardiomyopathy presentations was recessive: a homozygous missense allele in the Iranian family,
          and biallelic c.638G>T (p.Arg213Leu) in the consanguineous Turkish family. For the recessive
          ARS deficiencies as a class, the ARS review states that heterozygous parents of patients are
          unaffected and reads that as evidence of excess capacity in ARS activity - the central quantitative
          claim of the family: one functional allele supplies enough aminoacylation capacity, and disease
          requires that both alleles be damaged while still leaving some residual activity, because complete
          loss of a cytoplasmic aminoacyl-tRNA synthetase is not compatible with life. No cached SARS1
          paper reports the phenotype of any SARS1 carrier parent directly, so the carrier statement is
          inherited from the class and not from a SARS1 observation.

          Penetrance is recorded as UNKNOWN rather than COMPLETE. Every reported biallelic individual
          is affected, but every reported biallelic individual was ascertained because they were affected,
          and the total number of families is in single figures. There is no population-scale genotype-first
          data for any SARS1 allele, so a penetrance claim of any kind would be an artefact of ascertainment.
          The HPO annotation set for OMIM:617709 records HP:0000007 (autosomal recessive inheritance)
          sourced to PMID:28236339 (retrieved 2026-08-01) and no dominant inheritance annotation, which
          is consistent with the dominant-negative case (PMID:36041817) postdating the annotation rather
          than contradicting it.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        penetrance: UNKNOWN
      selected_evidence:
        snippet: we identified a homozygous missense mutation (c.514G>A, p.Asp172Asn) in the cytoplasmic
          seryl-tRNA synthetase (SARS) gene
        supports: SUPPORT
