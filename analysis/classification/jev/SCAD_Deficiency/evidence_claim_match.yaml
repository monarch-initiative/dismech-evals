      assertion_type: DifferentialDiagnosis
      assertion:
        name: Medium-chain acyl-CoA dehydrogenase deficiency
        disease_term:
          preferred_term: medium-chain acyl-CoA dehydrogenase deficiency
          term:
            id: MONDO:0008721
            label: medium-chain acyl-CoA dehydrogenase deficiency
        description: Medium-chain acyl-CoA dehydrogenase (MCAD) and SCAD both catalyze the first step
          of mitochondrial beta-oxidation with overlapping short-to-medium chain substrate activity (substrate
          optima of 8-carbon and 4-carbon chains, respectively). Unlike unscreened MCADD, which carried
          approximately 25% mortality and 30-40% developmental delay before newborn screening, most individuals
          with SCADD do not present with classic fatty acid oxidation decompensation such as hypoketotic
          hypoglycemia, recurrent rhabdomyolysis, or cardiomyopathy.
        distinguishing_features:
        - Substrate optimum at 8-carbon acyl-CoA chains with high pre-screening mortality (~25%) in MCADD
          versus 4-carbon butyryl-CoA optimum and general absence of classic hypoketotic hypoglycemia,
          recurrent rhabdomyolysis, or cardiomyopathy in SCADD.
      selected_evidence:
        snippet: In humans, very long, medium, and short chain acyl-CoA dehydrogenases (VLCAD, MCAD, and
          SCAD) catalyze the first step in the β-oxidation cycle with substrate optima of 16, 8, and 4
          carbon chains, respectively.
        supports: SUPPORT
