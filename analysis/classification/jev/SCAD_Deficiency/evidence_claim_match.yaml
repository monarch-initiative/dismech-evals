                label: butyryl-CoA
              modifier: INCREASED
            - preferred_term: O-butanoylcarnitine (butyrylcarnitine, C4)
              term:
                id: CHEBI:7676
                label: O-butanoylcarnitine
              modifier: INCREASED
            - preferred_term: ethylmalonic acid
              term:
                id: CHEBI:741548
                label: ethylmalonic acid
              modifier: INCREASED
            - preferred_term: methylsuccinic acid
              term:
                id: CHEBI:89843
                label: methylsuccinic acid
              modifier: INCREASED
            - preferred_term: butyrylglycine
              term:
                id: CHEBI:89963
