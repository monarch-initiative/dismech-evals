        name: ACADS molecular function deficiency
        description: 'Biallelic variants in ACADS reduce short-chain acyl-CoA dehydrogenase (SCAD) activity
          in the mitochondrial matrix. SCAD is a homotetrameric flavoprotein with a non-covalently bound
          FAD prosthetic group that catalyzes the first, FAD-dependent dehydrogenation step of beta-oxidation,
          with its physiologic role specific to butyryl-CoA. Most disease-associated variants are missense
          changes that impair folding and stability rather than abolishing intrinsic catalytic chemistry.

          '
        genes:
