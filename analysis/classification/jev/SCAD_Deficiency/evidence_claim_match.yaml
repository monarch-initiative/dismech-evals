            preferred_term: short chain acyl-CoA dehydrogenase deficiency
            term:
              id: MONDO:0008722
              label: short chain acyl-CoA dehydrogenase deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: ACADS gene variants
        gene_term:
          preferred_term: ACADS
          term:
            id: hgnc:90
            label: ACADS
        inheritance:
        - name: Autosomal recessive
        variants:
        - name: ACADS - rare inactivating missense variants
          description: 'Most SCADD-associated ACADS variants are rare, largely private missense mutations.
            For alleles tested, these lead to complete inactivation, impaired biogenesis, or intramitochondrial
            aggregation of misfolded protein, and the degree of dysfunction correlates with biochemical
            (EMA) but not clinical phenotype.

            '
        - name: ACADS - c.511C>T (p.Arg147Trp) and c.625G>A (p.Gly185Ser) common variants
          description: 'Two common ACADS variants, c.511C>T (R147W) and c.625G>A (G185S), have little
            effect on catalytic kinetics but impair folding and stability. They are relatively common
            in the general population (allele frequencies ~22% and ~3% in one U.S. study), are overrepresented
            among individuals with ethylmalonic aciduria, and are considered susceptibility/variant alleles
            of uncertain clinical significance rather than fully penetrant pathogenic mutations.

            '
        features: 'SCADD results from biallelic ACADS variants. Genotypes are described as mutation/mutation,
          mutation/variant, or variant/variant combinations; the ACADS genotype correlates with biochemical
          (EMA, C4) levels but not with clinical characteristics, and asymptomatic relatives with the
          same genotype as affected probands are frequently identified.

          '
      selected_evidence:
        snippet: ACADS genotype showed a statistically significant association with EMA and C4-C
        supports: SUPPORT
