          this cellular toxicity has been linked to excessive reactive oxygen species production and chronic
          oxidative stress. This gain-of-toxicity mechanism, together with as-yet-unknown genetic and
          environmental modifiers, has been proposed to contribute to symptomatic disease in a subset
          of individuals, but no correlation between the degree of SCAD dysfunction and clinical phenotype
          has been established.
