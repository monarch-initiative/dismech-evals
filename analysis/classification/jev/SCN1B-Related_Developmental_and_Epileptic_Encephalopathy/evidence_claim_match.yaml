        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cardiac_arrhythmia_in_patients
        prompt: Do children with SCN1B-related DEE actually experience clinically detectable cardiac arrhythmia,
          and would cardiac surveillance or antiarrhythmic management reduce SUDEP in this population?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Cardiac Arrhythmia Susceptibility
        - pathophysiology#Elevated Risk of Sudden Unexpected Death in Epilepsy
        rationale: 'The dual neuro-cardiac SUDEP hypothesis is well supported at the level of substrate:
          the knock-in mouse has ventricular fibrosis and pacing-inducible arrhythmia, and patient-derived
          cardiomyocytes show increased currents. What is missing is the clinical link. No published series
          reports Holter monitoring, ECG surveillance, or documented arrhythmia in SCN1B-DEE52 patients,
          so the step from "arrhythmogenic substrate exists" to "arrhythmia contributes to these children''s
          deaths" is inference. It is actionable inference - if borne out it would justify cardiac surveillance
          in a population currently managed purely as neurological - which is exactly why it should not
          be curated as though settled.'
        proposed_experiments:
        - experiment_id: exp_cardiac_surveillance_cohort_dee52
          name: Prospective cardiac surveillance in an SCN1B-DEE52 cohort
          description: Enrol genetically confirmed DEE52 patients in prospective ECG and ambulatory rhythm
            monitoring, with repolarization interval measurement and event correlation, to establish whether
            the model-predicted arrhythmia substrate produces detectable clinical events.
      selected_evidence:
        snippet: Although the mechanisms of SUDEP remain unclear, we hypothesize that, in addition to
          seizures, SUDEP in some instances involves cardiac arrhythmias
        supports: SUPPORT
