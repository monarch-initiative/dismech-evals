            term:
              id: MONDO:0033361
              label: developmental and epileptic encephalopathy, 52
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_null_mouse_versus_human_missense
        prompt: How much of the Scn1b-null mouse phenotype - 100% pre-weaning SUDEP, severe cerebellar
          pathfinding failure - reflects human DEE52, given that every reported human genotype is missense
          and affected children survive for years?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Cerebellar Neuronal Pathfinding
        - pathophysiology#Cerebellar Purkinje Cell and Interneuron Hypoexcitability
        rationale: Most of the mechanistic detail curated here for the cerebellar arm comes from the constitutive
          null. But the human variants are missense changes in the immunoglobulin loop, and at least one
          of them - p.R85C - reaches the cell surface normally, so it is not a null at the level of protein
          presence. The p.R125C variant is a functional null and the p.R89C knock-in is not, yet both
          cause DEE52, which suggests the human phenotype is reached from more than one point on the dose-response
          curve. The severe developmental pathfinding failure seen in the null cerebellum may therefore
          over-represent what a surface-expressed missense variant does, and no human neuropathology exists
          to check it against.
        proposed_experiments:
        - experiment_id: exp_knockin_allelic_series_cerebellum
          name: Cerebellar phenotype across an Scn1b knock-in allelic series
          description: Compare cerebellar pathfinding, Purkinje cell sodium currents, and ataxia across
            knock-in mice carrying surface-expressed missense variants (p.R85C, p.R89C), the trafficking-null
            p.R125C, and the constitutive null, to establish how much of the developmental cerebellar
            phenotype requires complete absence of the protein.
      selected_evidence:
        snippet: Scn1b null mice model DEE52, with generalized seizures beginning in the second week of
          life and sudden unexpected death in epilepsy (SUDEP) in 100% of mice prior to weaning
        supports: SUPPORT
    origin:
