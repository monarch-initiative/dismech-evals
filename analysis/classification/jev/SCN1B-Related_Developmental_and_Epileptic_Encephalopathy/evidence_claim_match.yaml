  0d86bcdcac24975fa7d3d038bf4fc8ef0381e364918154c827b38f964601f0aa:
    claim:
      about:
        disease:
          name: SCN1B-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 52
            term:
              id: MONDO:0033361
              label: developmental and epileptic encephalopathy, 52
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_interneuron_versus_pyramidal_substrate
        prompt: Does SCN1B-related DEE arise through the same GABAergic interneuron hypoexcitability that
          underlies SCN1A-related Dravet syndrome, or through a fundamentally different substrate of regionally
          restricted pyramidal neuron hyperexcitability driven by increased input resistance?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Increased Forebrain Pyramidal Neuron Firing
        - pathophysiology#Regionally Restricted Network Hyperexcitability
        - pathophysiology#Cerebellar Purkinje Cell and Interneuron Hypoexcitability
        rationale: 'Because SCN1B and SCN1A variants produce overlapping clinical pictures, it is routinely
          assumed that SCN1B disease works through the SCN1A mechanism - beta-1 loss detunes Nav1.1, Nav1.1
          loss impairs interneurons, interneuron failure disinhibits the cortex. The Scn1b mouse contradicts
          the middle step directly: no changes in firing or synaptic properties of GABAergic interneurons
          were observed, explicitly in contrast with Scn1a-based models, and the hyperexcitability was
          instead in subicular and layer 2/3 pyramidal neurons via increased input resistance from reduced
          dendritic arborization. The cerebellar work complicates this further rather than settling it,
          since there GABAergic neurons ARE hypoexcitable - so cell-type effects appear to be region-dependent
          rather than uniform. This matters therapeutically: the input-resistance account predicts benefit
          from a potassium channel opener, and retigabine did protect these mice from thermal seizures,
          which is not a prediction the interneuron model makes.'
        proposed_experiments:
        - experiment_id: exp_celltype_conditional_scn1b_deletion
          name: Interneuron-restricted versus pyramidal-restricted Scn1b deletion
          description: Compare conditional Scn1b deletion restricted to forebrain GABAergic interneurons
            against deletion restricted to excitatory pyramidal neurons, scoring spontaneous seizure burden,
            thermal seizure threshold, and input resistance in each population, to establish which cell
            type is sufficient to produce the epilepsy phenotype.
      selected_evidence:
        snippet: These results suggest a novel mechanism of disease genesis in genetic epilepsy and demonstrate
          an effective mechanism-based treatment of the disease.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
