        variant_origin: GERMLINE
        notes: 'SCN1B encodes the beta-1 and beta-1B non-pore-forming subunits of the voltage-gated sodium
          channel. Reported DEE52 variants are missense and cluster in the extracellular immunoglobulin
          loop domain: c.136C>T p.R46C, c.178C>T p.R60C, c.472G>A p.V158M, p.R85C, c.265C>T p.R89C, and
          p.R125C. Dosage matters: monoallelic variants cause the milder GEFS+ spectrum and cardiac disorders
          including Brugada syndrome and atrial fibrillation, while biallelic variants cause this encephalopathy.
          Expressivity varies even within a sibship - two siblings homozygous for p.R89C had similar epilepsy
          but the younger still had normal development.'
        gene_term:
