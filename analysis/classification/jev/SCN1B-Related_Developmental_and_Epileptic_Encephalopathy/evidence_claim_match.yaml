          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 52
            term:
              id: MONDO:0033361
              label: developmental and epileptic encephalopathy, 52
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hearing_loss_mechanism
        prompt: By what mechanism does biallelic SCN1B loss produce sensorineural hearing loss - through
          beta-1's channel-modulating role in brainstem auditory pathway neurons, through its cell adhesion
          role in cochlear or auditory nerve development, or as a consequence of the encephalopathy itself?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Disrupted Beta-1 Immunoglobulin-Domain Cell Adhesion
        rationale: 'Bilateral sensorineural hearing loss with brainstem auditory pathway involvement is
          reported, but no node in this pathograph explains it, and nothing in the mouse literature addresses
          the auditory system. The two candidate arms - channel modulation and cell adhesion - predict
          different things: an adhesion-mediated developmental defect would be fixed and present from
          birth, whereas an excitability defect in auditory brainstem neurons might be modifiable. Because
          hearing loss in a child with no expressive development is easy to miss and consequential for
          the little communication that remains possible, whether it is an expected feature worth screening
          for is a practical question, not only a mechanistic one.'
        proposed_experiments:
        - experiment_id: exp_auditory_phenotyping_scn1b_mice
          name: Auditory brainstem response phenotyping in Scn1b mouse models
          description: Measure auditory brainstem responses and cochlear histology in Scn1b-null and knock-in
            mice, and in mice carrying a variant that selectively disrupts adhesion while preserving channel
            modulation, to determine which functional arm accounts for the hearing loss.
      selected_evidence:
        snippet: Non-pore-forming beta1 subunits function as channel modulators and chaperones to the
          plasma membrane as well as immunoglobulin superfamily cell adhesion molecules (CAMs)
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
