        prompt: Should sodium-channel-blocking anti-seizure medications be avoided in SCN1B-related DEE,
          as they are in SCN1A-related Dravet syndrome, or does the beta-1 subunit mechanism change that
          calculus?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Sodium Channel Voltage Dependence and Availability
        - pathophysiology#Refractory Multifocal and Generalized Seizures
        rationale: In SCN1A-related Dravet syndrome sodium-channel blockers are avoided because they further
          impair Nav1.1 in interneurons that are already underactive. The same reasoning is often extended
          to SCN1B by analogy, and the analogy is plausible - both lesions reduce sodium-channel function.
          But the Scn1b mouse contradicts the interneuron premise the SCN1A rule rests on, showing no
          interneuron changes and instead pyramidal hyperexcitability driven by input resistance. If that
          is the operative mechanism, the SCN1A avoidance rule does not transfer, and the mechanism-matched
          prediction from the same study points the other way, toward agents that lower input resistance.
          The published evidence reports only that carbamazepine failed among several drugs, which is
          refractoriness rather than harm, so the question is genuinely open and is curated here rather
          than asserted as a contraindication in the treatments block.
        proposed_experiments:
        - experiment_id: exp_sodium_blocker_challenge_in_scn1b_models
          name: Sodium-channel-blocker challenge in Scn1b versus Scn1a models
          description: Compare seizure burden and thermal seizure threshold under carbamazepine or lacosamide
            in Scn1b knock-in mice against Scn1a-haploinsufficient mice, to test whether the aggravation
            seen in the SCN1A model occurs in the SCN1B model at all, and pair it with a retrospective
            review of medication exposure in genetically confirmed DEE52 patients.
      selected_evidence:
        snippet: Importantly, no changes in firing or synaptic properties of gamma-aminobutyric acidergic
          interneurons from mutant mice were observed, which is in contrast with Scn1a-based models of
          Dravet syndrome.
        supports: SUPPORT
