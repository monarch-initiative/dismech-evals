  817c330d19ad30e188fa89302114e7bee8d42c3840998123ab84e4bba8e16cdd:
    claim:
      about:
        disease:
          name: SCO2-Related Fatal Infantile Cardioencephalomyopathy
          disease_term:
            preferred_term: SCO2-related fatal infantile cardioencephalomyopathy
            term:
              id: MONDO:0011451
              label: cardioencephalomyopathy, fatal infantile, due to cytochrome c oxidase deficiency
                1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sco2_mouse_cardiac_phenotype_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#SCO2 Loss and Defective Copper Delivery to COX
        - pathophysiology#Impaired Terminal Electron Transfer and ATP Synthesis
        prompt: Do the existing Sco2 mouse models reproduce the human hypertrophic cardiomyopathy and
          fatal infantile course, or does the model-human gap limit their use for preclinical testing
          of therapies such as copper-histidine?
        rationale: 'The mouse models are allele-matched and biochemically faithful yet phenotypically
          divergent, which is exactly the situation HUMAN_MODEL_MISMATCH is for: the evidence exists,
          but its translational validity is the open question. Constitutive Sco2 knockout mice are embryonic
          lethal, while the E129K knock-in (orthologous to the recurrent human p.E140K allele) and the
          compound KI/KO animals are viable and show respiratory chain deficiency, Complex IV assembly
          defects across tissues, and reduced mitochondrial copper content — but muscle weakness rather
          than the hypertrophic cardiomyopathy and infantile lethality that define the human disorder.
          The most genetically faithful models therefore fail to express the defining cardiac endpoint,
          so a therapeutic effect measured in them cannot be read directly as a prediction of cardiac
          benefit in patients. This matters concretely for copper-histidine, whose human support is one
          case report and whose in vitro support is a myoblast rescue.'
        proposed_experiments:
        - experiment_id: exp_sco2_ipsc_cardiomyocyte_copper_rescue
          name: Copper-histidine rescue in SCO2 patient iPSC-derived cardiomyocytes
          description: Use patient-derived and isogenic-corrected SCO2-mutant iPSC-derived cardiomyocytes
            to test whether copper-histidine restores oxidative ATP production, sarcoplasmic-reticulum
            calcium handling, and inotropic responsiveness in the human cardiac cell type the mouse models
            fail to model, with genotype stratification across p.E140K and p.G193S.
          supporting_outcome:
          - Genotype-dependent restoration of ATP production and calcium handling would support copper
            delivery as the rate-limiting, druggable step in human cardiomyocytes.
          refuting_outcome:
          - Failure to rescue human cardiomyocytes despite rescue of patient myoblasts would indicate
            a cardiomyocyte-specific block downstream of copper availability.
        - experiment_id: exp_sco2_cardiac_stress_phenotyping_ki_mouse
          name: Cardiac stress phenotyping of viable Sco2 KI and KI/KO mice
          description: Subject homozygous E129K knock-in and compound KI/KO animals to defined hemodynamic
            or adrenergic stress and assess left ventricular wall thickness, diastolic function, and survival,
            to test whether the absent cardiomyopathy reflects a genuine species difference or an unstressed
            baseline.
          supporting_outcome:
          - Emergence of hypertrophy under stress would restore the model's usefulness for cardiac preclinical
            work, with load as a required cofactor.
          refuting_outcome:
          - A persistently normal heart under stress would confirm a species-level divergence in cardiac
            vulnerability to Sco2 deficiency.
      selected_evidence:
        snippet: Whereas homozygous KO mice were embryonic lethals, homozygous KI and compound heterozygous
          KI/KO mice were viable, but had muscle weakness; biochemically, they had respiratory chain deficiencies
          as well as complex IV assembly defects in multiple tissues.
        supports: SUPPORT
