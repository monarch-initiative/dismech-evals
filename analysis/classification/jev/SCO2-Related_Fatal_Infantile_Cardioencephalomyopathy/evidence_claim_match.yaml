            label: copper chaperone activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: copper ion transport
          term:
            id: GO:0006825
            label: copper ion transport
          modifier: DECREASED
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Studies on a yeast homolog have suggested that human Sco2 acts as a copper chaperone,
          transporting copper to the Cu(A) site on the Cox II subunit
        supports: SUPPORT
