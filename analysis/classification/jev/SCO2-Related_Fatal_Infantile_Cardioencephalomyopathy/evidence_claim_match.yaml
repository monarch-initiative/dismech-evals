      assertion:
        name: SCO2 Loss and Defective Copper Delivery to COX
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        biological_scale: MOLECULAR
        description: 'Biallelic SCO2 variants impair copper delivery to the CuA center of COX2, preventing
          assembly of a catalytically competent Complex IV holoenzyme. Sco2 is a mitochondrial inner-membrane
          copper metallochaperone bearing a CxxxC metal-binding motif; loss of its chaperone function
          leaves the catalytic-core subunits unmetallated and destabilized, producing isolated COX deficiency
          that is most severe in striated muscle.

          '
