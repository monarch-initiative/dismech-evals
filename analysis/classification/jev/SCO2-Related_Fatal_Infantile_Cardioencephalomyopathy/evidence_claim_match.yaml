            preferred_term: SCO2-related fatal infantile cardioencephalomyopathy
            term:
              id: MONDO:0011451
              label: cardioencephalomyopathy, fatal infantile, due to cytochrome c oxidase deficiency
                1
        context: []
      assertion_type: Genetic
      assertion:
        name: SCO2 pathogenic variants causing cardioencephalomyopathy
        gene_term:
          preferred_term: SCO2
          term:
            id: hgnc:10604
            label: SCO2
        inheritance:
        - name: Autosomal recessive
        features: 'Biallelic SCO2 variants impair copper delivery to the COX CuA center, causing fatal
          infantile cardioencephalomyopathy. The clinical phenotype differs from that caused by SURF1.
          The recurrent p.E140K (c.1541G>A / G1541A) missense allele, adjacent to the CxxxC copper-binding
          motif, is present on at least one allele in nearly all reported patients and behaves as a founder/hotspot
          allele in Central European (notably Polish and other Slavic) populations; the single reported
          homozygous p.G193S patient is the documented exception. Genotype predicts course: E140K in trans
          with a null or truncating allele gives the severe neonatal cardioencephalomyopathic form, E140K
          homozygosity gives delayed onset with a Leigh-like, SMA-like-atrophy course, and E140K/p.M177T
          gives the mildest reported phenotype (onset after one year, nonspecific encephalomyopathy, 2-4
          year survival).

          '
      selected_evidence:
        snippet: The clinical phenotype caused by mutations in human SCO2 differs from that caused by
          mutations in SURF1, the only other known COX assembly gene associated with a human disease,
          Leigh syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
