  0b1eb9a8d2bdc17876260db41f75c8ffea23c8cd87e0aa07d1762d59d93f941e:
    claim:
      about:
        disease:
          name: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy
          disease_term:
            preferred_term: neurodegeneration with ataxia and late-onset optic atrophy
            term:
              id: MONDO:0031006
              label: neurodegeneration with ataxia and late-onset optic atrophy
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Pheochromocytoma/paraganglioma syndrome 5
        disease_term:
          preferred_term: pheochromocytoma/paraganglioma syndrome 5
          term:
            id: MONDO:0013602
            label: pheochromocytoma/paraganglioma syndrome 5
        description: 'The tumour-predisposition allelic disorder, in which a heterozygous SDHA loss-of-function
          germline allele behaves as a tumour-suppressor first hit, with somatic loss of the wild-type
          allele driving paraganglioma, phaeochromocytoma and gastrointestinal stromal tumour. It shares
          zygosity and gene with NDAXOA and shares nothing else. It is curated in dismech within `kb/disorders/Pheochromocytoma_Paraganglioma.yaml`,
          which was read and not modified.

          The overlap is not merely theoretical and it creates a live clinical problem. Codon 451 of SDHA
          produces neurodegeneration when the arginine is replaced by cysteine and has been reported in
          paraganglioma when it is replaced by histidine. Meanwhile, tumour surveillance is recommended
          for SDHA pathogenic-variant carriers and no equivalent surveillance exists for adult-onset mitochondrial
          disease, so a family found to carry an SDHA variant is offered a cancer protocol whose applicability
          to their particular allele nobody can state.'
        distinguishing_features:
        - PGL5 alleles are typically truncating or splice loss-of-function changes acting as tumour-suppressor
          first hits; the NDAXOA alleles are specific missense substitutions that leave a full-length
          subunit.
        - PGL5 requires a somatic second hit in the tumour tissue; NDAXOA is a constitutive, whole-body
          enzymatic deficit with no second hit.
        - 'The mechanism diverges at succinate: in PGL5 succinate accumulation acts as an oncometabolite
          driving pseudohypoxia and epigenetic remodelling, whereas in NDAXOA the pathogenic consequence
          curated here is bioenergetic failure in post-mitotic tissue.'
        - Neither NDAXOA pedigree has reported a tumour, and no PGL5 family has reported optic atrophy
          with ataxia; the two allele sets have historically been described as separate.
        - 'At codon 451 the substituting residue, not the position, decides which disease follows: Cys
          in NDAXOA, His reported in paraganglioma, Ser reported de novo in an infant with cardiomyopathy.'
        notes: 'MONDO:0013602 was verified with OAK on 2026-08-01: its definition is "Any paraganglioma
          in which the cause of the disease is a mutation in the SDHA gene", it xrefs OMIM:614165, and
          it carries the same `RO:0004003 HGNC:10680` relationship as this entry. The codon 451 allelic
          series is from the ClinVar submitter evidence for VCV000449389 recorded in the entry-level notes,
          not from a cached abstract.'
      selected_evidence:
        snippet: Interestingly, SDHx genes also function as tumor suppressor genes in hereditary paragangliomas,
          pheochromocytomas, and gastrointestinal stromal tumors.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
