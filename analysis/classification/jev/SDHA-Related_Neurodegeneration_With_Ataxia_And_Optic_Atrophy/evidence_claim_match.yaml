  bf2cec72b8f6a61a832de99cabdf167d0c6657d5e092e0b90e462e1c40ba4ad2:
    claim:
      about:
        disease:
          name: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy
          disease_term:
            preferred_term: neurodegeneration with ataxia and late-onset optic atrophy
            term:
              id: MONDO:0031006
              label: neurodegeneration with ataxia and late-onset optic atrophy
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'Two pedigrees and one singleton constitute the entire published clinical experience of
          this entity at the time of curation: two elderly sisters (PMID:8967754, genotyped in PMID:10976639),
          three members of a second family (PMID:27683074), and one adolescent with a de novo allele (PMID:33471299,
          whose assignment to this entity is qualified in the entry notes). NOT_YET_DOCUMENTED is used
          rather than a qualitative ULTRA_RARE band because no prevalence or incidence estimate of any
          kind has been published for NDAXOA, MONDO:0031006 carries no Orphanet xref, and there is therefore
          no source to band. `rate_per_100000` is left empty because there is no basis for a number.

          The one quantitative anchor that does exist is upstream of the entity rather than about it:
          isolated complex II defects of any genotype account for about 2% of all respiratory chain deficiency
          diagnoses, and NDAXOA is a small dominant subset of that 2%. No founder effect is asserted,
          and no ancestry is asserted either: none of the cited reports states the ancestry of any reported
          family. The only geographic information available is the location of the reporting centres (Newcastle
          upon Tyne, Bern, Afula), which is a fact about where the patients were investigated and must
          not be read as a statement about the patients'' ancestry or as a population restriction.'
      selected_evidence:
        snippet: Isolated defects of the mitochondrial respiratory complex II (succinate dehydrogenase,
          SDH) are rare, accounting for approximately 2% of all respiratory chain deficiency diagnoses.
        supports: SUPPORT
    origin:
      assertion_path: /prevalence/0
