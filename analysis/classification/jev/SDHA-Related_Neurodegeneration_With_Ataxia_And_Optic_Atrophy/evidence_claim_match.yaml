  c76548e7d4dffef3953670d9f1d652b2ab8e1d540b98c5547b3071ff0321a368:
    claim:
      about:
        disease:
          name: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy
          disease_term:
            preferred_term: neurodegeneration with ataxia and late-onset optic atrophy
            term:
              id: MONDO:0031006
              label: neurodegeneration with ataxia and late-onset optic atrophy
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Sequencing of SDHA with explicit phenotype disambiguation
        description: 'Molecular diagnosis rests on identifying a heterozygous SDHA missense variant against
          transcript NM_004168.4 in an individual with optic atrophy plus cerebellar, muscular or cardiac
          involvement. Three interpretation points follow from the published genotype-phenotype structure.
          First, the causal alleles are conservative-looking arginine-to-cysteine substitutions and must
          not be dismissed on in-silico grounds. Second, because SDHA carries four distinct MONDO disease
          terms, the laboratory cannot infer the phenotype from the gene: zygosity, variant class and,
          at codon 451, the identity of the substituting residue all change the answer, and the report
          should say so. Third, SDHA is not on every hereditary optic neuropathy panel; the authors of
          the most recent case report proposed adding it, which implies it was not there.'
      selected_evidence:
        snippet: We propose to add SDHA to next generation sequencing gene panels of optic atrophy.
        supports: SUPPORT
    origin:
