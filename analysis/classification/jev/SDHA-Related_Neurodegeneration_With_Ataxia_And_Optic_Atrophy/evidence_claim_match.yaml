      assertion_type: HarrisonsChapterAssignment
      assertion:
        classification_value: NEUROLOGIC
        notes: 'The defining and most consistently reported morbidity is neurological and neuro-ophthalmological:
          progressive optic atrophy, cerebellar and gait ataxia, myopathy and, in one pedigree, a progressive
          polyneuropathy with psychiatric involvement. The optic neuropathy is a lesion of retinal ganglion
          cells and their axons, that is, of central nervous system tissue, rather than an ophthalmological
          disease of the globe. Cardiomyopathy is real and was lethal in one infant in the second pedigree,
          but it is not the presenting or defining feature of the entity, so a second CARDIOVASCULAR assignment
          is deliberately not made.'
      selected_evidence:
        snippet: Previously, we identified a family with complex II deficiency and late-onset neurodegenerative
          disease with progressive optic atrophy, ataxia, and myopathy.
        supports: SUPPORT
