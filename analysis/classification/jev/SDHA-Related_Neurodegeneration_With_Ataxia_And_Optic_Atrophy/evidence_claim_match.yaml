        - LHON is maternally inherited with marked male bias and incomplete penetrance; NDAXOA is autosomal
          dominant with affected women in both pedigrees.
        - LHON typically produces subacute, sequential, painless central visual loss over weeks; the NDAXOA
          optic neuropathy is described as slowly progressive.
        - LHON is not accompanied by cerebellar ataxia, myopathy or cardiomyopathy in its classical form;
          those are the extra-ocular features that should redirect testing towards SDHA.
        - The biochemical lesion is complex I in LHON and complex II in NDAXOA, so respiratory chain enzymology
          distinguishes them directly.
        notes: MONDO:0010788 was verified with OAK on 2026-08-01; it xrefs OMIM:535000 and matches `kb/disorders/Leber_Hereditary_Optic_Neuropathy.yaml`.
      selected_evidence:
        snippet: Any dysfunction of these systems may be of pathological relevance for optic neuropathies
          with primary or secondary involvement of mitochondria.
        supports: SUPPORT
