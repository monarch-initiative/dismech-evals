  1b4df96e0faa1249a05fe829c084a9cd4db01e8f2a38dca4ad3e1f50d3477f7c:
    claim:
      about:
        disease:
          name: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy
          disease_term:
            preferred_term: neurodegeneration with ataxia and late-onset optic atrophy
            term:
              id: MONDO:0031006
              label: neurodegeneration with ataxia and late-onset optic atrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sdha-ndaxoa-tumour-risk-unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do carriers of the dominant neurodegenerative SDHA alleles have an elevated risk of paraganglioma,
          phaeochromocytoma or gastrointestinal stromal tumour, and should they be enrolled in SDHx tumour
          surveillance?
        rationale: 'The two questions a family actually asks are what will happen to them and what should
          be monitored, and this entity cannot answer either. Tumour surveillance is recommended for carriers
          of SDHA pathogenic variants and involves whole-body imaging plus biochemical testing, an appreciable
          lifelong burden. No tumour has been reported in either NDAXOA pedigree, but the total number
          of carriers ever followed is of the order of six, so the absence of reported tumours carries
          almost no statistical weight. The mechanistic argument cuts both ways: a missense allele that
          blocks flavinylation may or may not compromise the tumour-suppressor function of the locus,
          and the fact that a different substitution at the very same codon, p.Arg451His, has been reported
          in paraganglioma makes the position look precarious rather than reassuring. An independent group
          has framed this same problem as a counselling conundrum and concluded that the absolute risk
          of both outcomes is unknown.'
        attaches_to:
        - pathophysiology#Divergence From the SDHx Tumour-Predisposition Arm
        proposed_experiments:
        - experiment_id: sdha-ndaxoa-carrier-tumour-registry
          name: International registry and prospective imaging of dominant SDHA neurodegeneration carriers
          description: Assemble all known carriers of dominant neurodegenerative SDHA alleles into a single
            registry with standardised whole-body MRI and plasma metanephrine surveillance, to convert
            an anecdotal absence of tumours into an estimate with a denominator.
        - experiment_id: sdha-allele-tumour-suppressor-assay
          name: Tumour-suppressor function assay of NDAXOA alleles
          description: Test p.Arg451Cys and p.Arg662Cys alongside the paraganglioma-associated p.Arg451His
            in the assays that define SDHx tumour behaviour, namely succinate accumulation, HIF stabilisation
            and 5-hydroxymethylcytosine loss, to establish whether the neurodegenerative alleles engage
            the oncometabolite arm at all.
      selected_evidence:
        snippet: There is no similar screening or testing recommended for individuals potentially at risk
          for adult-onset mitochondrial disease. Additionally, the absolute risk for both conditions is
          unknown.
        supports: SUPPORT
