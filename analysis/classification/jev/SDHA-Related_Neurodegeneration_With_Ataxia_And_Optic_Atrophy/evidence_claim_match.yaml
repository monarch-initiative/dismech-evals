  594503bfb368899509a080aafdd3553ff6cae58537d13de604e37eb45e996874:
    claim:
      about:
        disease:
          name: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy
          disease_term:
            preferred_term: neurodegeneration with ataxia and late-onset optic atrophy
            term:
              id: MONDO:0031006
              label: neurodegeneration with ataxia and late-onset optic atrophy
        context: []
      assertion_type: Treatment
      assertion:
        name: Riboflavin supplementation
        description: 'Riboflavin is the dietary precursor of FAD, the cofactor whose covalent attachment
          to SDHA is the step that the NDAXOA alleles are argued to disrupt, so raising intracellular
          flavin availability is the one mechanistically targeted intervention that has ever been tried
          in complex II deficiency. In three children with recessive complex II deficiency treated with
          oral riboflavin and followed for a mean of 4.5 years, the neurological course was stable or
          moderately improved in two and plasma lactate decreased to near-normal levels in the third,
          and riboflavin supplementation of the culture medium doubled complex II activity in patient
          fibroblasts but not in control fibroblasts.

          Whether any of that transfers to NDAXOA is unknown and this entry does not claim it does. No
          patient with a dominant SDHA allele has been reported on riboflavin. There is a specific mechanistic
          reason for caution: raising FAD availability is a plausible remedy for a subunit that binds
          its cofactor poorly, but has no obvious mechanism against a subunit that cannot form the covalent
          linkage at all, and none at all if the dominant allele acts by competing for assembly slots.
          The intervention is nevertheless recorded because it is cheap, non-toxic and rationally connected
          to the curated mechanism, which is the strongest position available in a disease with no trials.'
        treatment_term:
          preferred_term: pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: riboflavin
            term:
              id: CHEBI:17015
              label: riboflavin
        therapeutic_modality: SMALL_MOLECULE
        action_category: THERAPEUTIC
        notes: Recorded with deliberately conservative framing. Riboflavin responsiveness is established
          for some flavoprotein disorders and has never been tested in NDAXOA; the citation here is to
          a different SDHA-related disease and is marked PARTIAL for that reason on both evidence items.
          No dose is stated because none is established for this indication.
      selected_evidence:
        snippet: We report on three complex II-deficient children treated with riboflavin per os, who
          were followed-up for a mean period of 4.5 years.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/0
