  4503673bddf1b41d6660140cfd89c7bccb143cdd8d14dc6c88e2f67404c52e68:
    claim:
      about:
        disease:
          name: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy
          disease_term:
            preferred_term: neurodegeneration with ataxia and late-onset optic atrophy
            term:
              id: MONDO:0031006
              label: neurodegeneration with ataxia and late-onset optic atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Catalytically Inert SDHA Subunit Competing for Complex II Assembly
        biological_scale: MOLECULAR
        description: 'This is the node that explains why the disease is dominant. Complex II is a heterotetramer
          containing exactly one copy of the flavoprotein subunit alongside the iron-sulfur subunit and
          the two transmembrane anchors, so every assembled complex commits to one SDHA molecule and there
          is no second copy to compensate. If the mutant subunit is still expressed and still competent
          to bind FAD non-covalently, it can be incorporated into complexes that are then structurally
          complete but catalytically dead, and it competes with the wild-type subunit for the available
          assembly slots. On that model a heterozygote loses close to half of total succinate dehydrogenase
          activity while retaining a full complement of assembled complex, which is precisely the biochemical
          picture reported in the founding family: an approximately 50% enzyme deficit accompanied by
          an apparent overexpression of the 70-kDa flavoprotein subunit whose membrane-associated amount
          was nonetheless normal.

          The alternative reading, simple haploinsufficiency, would predict the same 50% activity but
          is hard to reconcile with the population genetics. Heterozygous SDHA loss-of-function alleles
          are carried without neurodegeneration by the parents of children with recessive complex II deficiency
          and by members of tumour-predisposition families. The dominant-negative model accounts for that
          asymmetry; haploinsufficiency does not.'
        genes:
        - preferred_term: SDHA
          term:
            id: hgnc:10680
            label: SDHA
        protein_complexes:
        - preferred_term: respiratory chain complex II
          modifier: ABNORMAL
          term:
            id: GO:0045273
            label: respiratory chain complex II (succinate dehydrogenase)
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex II assembly
          modifier: ABNORMAL
          term:
            id: GO:0034553
            label: mitochondrial respiratory chain complex II assembly
        mechanism_confidence: HYPOTHETICAL
        notes: 'Marked HYPOTHETICAL. Nothing yet distinguishes dominant-negative subunit competition from
          simple haploinsufficiency for either NDAXOA allele in a heterozygous setting. The nearest datum
          is PMID:39321216, which measured p.Arg451Cys in a human SDHA-knockout background and found it
          amorphic while retaining high SDHA protein abundance (read from Figure 2 of the PMC11611653
          full text, retrieved 2026-08-01; references_cache/PMID_39321216.md is abstract-only and names
          no individual variant, so this is a full-text derivation and not a snippet-verifiable claim).
          That establishes the mutant subunit is stable rather than degraded, which is a precondition
          for competition, but it cannot demonstrate competition: the assay contains no wild-type subunit
          for the mutant to compete with. What is still absent is allele-specific quantification of assembled
          complex in a heterozygote, any isotopic or tag-based measurement of the mutant-to-wild-type
          ratio within assembled complex II, and a heterozygous knock-in model. The node is retained because
          the discrimination is clinically consequential, not because it is settled; the reasoning against
          haploinsufficiency rests on the observation that heterozygous SDHA null carriers are neurologically
          well, which is an inference from the recessive and tumour literature rather than a controlled
          comparison. The corresponding open question is recorded as a discussion.'
      selected_evidence:
        snippet: There was an overexpression of the 70-kd flavoprotein subunit in muscle mitochondria
          from both patients, although we showed that this subunit is present in normal amounts in mitochondrial
          membranes.
        supports: SUPPORT
