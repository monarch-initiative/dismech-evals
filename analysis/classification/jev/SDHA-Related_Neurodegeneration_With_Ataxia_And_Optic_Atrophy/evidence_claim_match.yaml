  fdb08f5f0eca4bc5f7aaf03b79a63c3d18cc0783b03054582e0e141696bfbad9:
    claim:
      about:
        disease:
          name: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy
          disease_term:
            preferred_term: neurodegeneration with ataxia and late-onset optic atrophy
            term:
              id: MONDO:0031006
              label: neurodegeneration with ataxia and late-onset optic atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Covalent FAD Attachment to the SDHA Flavoprotein
        biological_scale: MOLECULAR
        description: 'SDHA is a flavoprotein whose catalytic activity depends absolutely on a FAD cofactor
          attached covalently to the subunit; without the covalent linkage the subunit cannot oxidise
          succinate. Two independent lines of evidence converge on this step for the two NDAXOA-associated
          alleles. For the founding-family allele, mutation of the equivalent base in the Escherichia
          coli orthologue produces an enzyme that is inactive and cannot bind FAD covalently. For the
          de novo allele, structural modelling of p.Arg662Cys predicts that it compromises the integrity
          of the FAD-binding region at the C-terminus and so impairs FAD binding.

          That convergence is not a coincidence of two arginines. Yeast mutagenesis of Sdh1 shows that
          a pair of spatially close C-terminal arginine residues, physically distant from the FAD-binding
          site itself, are required for covalent flavinylation and for assembly of the tetramer, and that
          FAD binding rather than covalent attachment is what stabilises the Sdh1 conformation for association
          with its partners. Flavinylation is also an assisted reaction: the dedicated factor SDHAF2/SDH5
          binds the catalytic subunit and is required for its flavination. The step is therefore a discrete,
          mutable chemistry, not a passive property of the folded protein, and it is a plausible point
          at which a single conservative-looking arginine substitution can abolish catalysis without abolishing
          expression.'
        genes:
        - preferred_term: SDHA
          term:
            id: hgnc:10680
            label: SDHA
        molecular_functions:
        - preferred_term: flavin adenine dinucleotide binding
          modifier: DECREASED
          term:
            id: GO:0050660
            label: flavin adenine dinucleotide binding
        biological_processes:
        - preferred_term: covalent flavinylation of the SDHA subunit
          modifier: DECREASED
          term:
            id: GO:0018293
            label: protein-FAD linkage
        chemical_entities:
        - preferred_term: FAD
          term:
            id: CHEBI:16238
            label: FAD
        cellular_components:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
        mechanism_confidence: PROVISIONAL
        notes: 'Confidence is PROVISIONAL, not ESTABLISHED, and the reason is specific and narrower than
          an earlier revision of this note claimed. The flavinylation defect has been demonstrated for
          the founding-family allele only in the E. coli orthologue at the equivalent base, and for the
          de novo allele only in silico. The yeast work cited here concerns different residues in a different
          organism and is offered as mechanistic plausibility for the class of lesion, not as evidence
          about these two alleles.

          Both human alleles have, however, been assayed in a human system. PMID:39321216 expressed SDHA
          missense variants in a clonal human SDHA-knockout cell line and measured SDH activity and SDHA
          abundance for each; both p.Arg451Cys and p.Arg662Cys were in that panel and both scored as essentially
          inactive, with p.Arg451Cys additionally retaining high SDHA protein (per-variant values read
          from Figures 2 and 5 and Table 1 of PMC11611653, retrieved 2026-08-01; only the abstract is
          in references_cache, so those per-variant numbers are recorded here as a sourced note rather
          than as evidence snippets). What that study did not do is measure the covalent FAD linkage itself:
          it infers a flavinylation defect for Arg451 from the residue''s structural role, describing
          the affected variants as "presumed to affect flavinylation". So the remaining gap is specific
          — nobody has measured covalent FAD incorporation into human SDHA carrying either substitution
          — and the claim that these alleles fail to flavinylate is still inferred rather than directly
          measured, but it is now inferred from a human loss-of-activity measurement rather than from
          the bacterial orthologue alone.'
      selected_evidence:
        snippet: Mutation of the equivalent base in Escherichia coli generates an inactive enzyme unable
          to bind flavin adenine dinucleotide covalently.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10976639
      reference_title: Late-onset optic atrophy, ataxia, and myopathy associated with a mutation of a
        complex II gene.
      evidence_source: IN_VITRO
      explanation: Direct experimental demonstration, in the bacterial orthologue, that the founding-family
        base change abolishes covalent FAD binding and enzymatic activity. Classified IN_VITRO because
        the experiment is a bacterial enzymology result, not a human observation.
