  69dfa083402c63cfb5da657269ce1843185c9cc826bc95bf85374dce41a788a2:
    claim:
      about:
        disease:
          name: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy
          disease_term:
            preferred_term: neurodegeneration with ataxia and late-onset optic atrophy
            term:
              id: MONDO:0031006
              label: neurodegeneration with ataxia and late-onset optic atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bioenergetic Failure in Cells With Low Metabolic Reserve
        biological_scale: CELLULAR
        conforms_to: cerebellar_purkinje_degeneration#Cerebellar Neuron Insult
        description: 'A permanent halving of succinate dehydrogenase activity is a mild insult in most
          cells and a severe one in a few. Complex II sits at the junction of the tricarboxylic acid cycle
          and the electron transport chain, so its impairment restricts both the oxidative arm of intermediary
          metabolism and the electron supply to the quinone pool at once. Cells that are long-lived, post-mitotic,
          unable to dilute damaged mitochondria by division, and running near their ATP ceiling therefore
          carry the cost: retinal ganglion cells, cerebellar neurons, skeletal myofibres and cardiomyocytes.
          Cells that turn over, or that can lean on glycolysis, are spared, which is why a systemic enzyme
          defect produces a strikingly selective clinical picture and why cultured fibroblasts may look
          normal.'
        biological_processes:
        - preferred_term: oxidative phosphorylation
          modifier: DECREASED
          term:
            id: GO:0006119
            label: oxidative phosphorylation
        cellular_components:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
        notes: The conformance to `cerebellar_purkinje_degeneration#Cerebellar Neuron Insult` is asserted
          at the level of the insult, not at the level of Purkinje cell pathology. This node deliberately
          does not bind a Purkinje cell type, because no neuropathological material from an NDAXOA patient
          has ever been examined; the cerebellar involvement in this disorder is known from clinical ataxia
          and from the cerebellar atrophy in the OMIM clinical synopsis, not from histology. Binding CL:0000121
          here would assert a cellular finding that nobody has observed in this disease.
      selected_evidence:
        snippet: The mitochondrial respiratory Complex II or succinate:ubiquinone oxidoreductase (SQR)
          is an integral membrane protein complex in both the tricarboxylic acid cycle and aerobic respiration.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15989954
      reference_title: Crystal structure of mitochondrial respiratory membrane protein complex II.
      evidence_source: IN_VITRO
      explanation: Establishes the dual metabolic membership of complex II, which is why a single enzyme
        lesion restricts both the TCA cycle and respiration rather than only one of them.
