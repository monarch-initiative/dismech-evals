      assertion_type: Pathophysiology
      assertion:
        name: Approximately Half-Normal Succinate Dehydrogenase Activity
        biological_scale: CELLULAR
        description: 'The measured biochemical phenotype is a partial, roughly 50% deficiency of complex
          II and succinate dehydrogenase activity, reported concordantly in muscle and platelet mitochondria
          in the founding family and in fibroblasts and lymphocytes in the de novo case. This is the quantitative
          signature that separates NDAXOA from the recessive disorder, where biallelic loss-of-function
          genotypes drive activity far lower and produce infantile Leigh syndrome. A half-normal enzyme
          is compatible with decades of ordinary life and only fails where the metabolic margin is thinnest,
          which is the reason the disease is late in onset and restricted in the tissues it damages.

          Tissue expression of the defect is genuinely inconsistent between the two reports and this entry
          does not smooth that over. In the founding family the enzyme defect was explicitly not expressed
          in cultured skin fibroblasts or immortalised lymphocytes, so a normal fibroblast assay did not
          exclude the diagnosis; in the de novo case the defect was demonstrable in exactly those two
          cell types. The discrepancy has direct diagnostic consequences and is recorded as an open discussion.'
        biological_processes:
        - preferred_term: tricarboxylic acid cycle
          modifier: DECREASED
          term:
            id: GO:0006099
            label: tricarboxylic acid cycle
        - preferred_term: electron transport chain
          modifier: DECREASED
          term:
            id: GO:0022900
            label: electron transport chain
        molecular_functions:
        - preferred_term: succinate dehydrogenase activity
          modifier: DECREASED
          term:
            id: GO:0000104
            label: succinate dehydrogenase activity
        chemical_entities:
        - preferred_term: succinate
          modifier: INCREASED
          term:
            id: CHEBI:30031
            label: succinate(2-)
        - preferred_term: fumarate
          modifier: DECREASED
          term:
            id: CHEBI:29806
            label: fumarate(2-)
        notes: The succinate and fumarate bindings on this node are inferred from the position of the
          enzymatic block, not measured. No study of an NDAXOA patient has reported tissue or plasma succinate,
          and the two reports that measured anything metabolic reported enzyme activities rather than
          metabolite pools. The bindings are retained because the direction of the change is not in doubt
          for a blocked succinate dehydrogenase, but no evidence item is attached to them and no claim
          about the magnitude of succinate accumulation is made here; the tumour-relevant consequences
          of succinate accumulation are handled separately, and negatively, in the divergence node below.
      selected_evidence:
        snippet: In both patients, a partial deficiency of complex II (approximately 50% of control values)
          was shown to be present in mitochondria from muscle and platelets.
        supports: SUPPORT
