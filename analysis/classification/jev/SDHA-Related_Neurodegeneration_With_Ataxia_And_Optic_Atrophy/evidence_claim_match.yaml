  b1b17f543ed5cf3b954c74bad98c7fb4112a49ad6c4c58ca84ce4faad1f3df0c:
    claim:
      about:
        disease:
          name: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy
          disease_term:
            preferred_term: neurodegeneration with ataxia and late-onset optic atrophy
            term:
              id: MONDO:0031006
              label: neurodegeneration with ataxia and late-onset optic atrophy
        context: []
      assertion_type: Genetic
      assertion:
        name: SDHA
        association: Heterozygous missense substitutions at conserved arginine residues, argued to disable
          covalent flavinylation or FAD binding of the flavoprotein subunit; the recurrent founding-family
          allele is c.1351C>T (p.Arg451Cys), historically designated R408C.
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: SDHA
          term:
            id: hgnc:10680
            label: SDHA
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        notes: 'Nomenclature and locus. hgnc:10680 is SDHA, succinate dehydrogenase complex flavoprotein
          subunit A, at 5p15.33 (chromosome and cytogenetic band confirmed from the MedGen record for
          C5543254, retrieved 2026-08-01). The reference transcript used in the modern reports is NM_004168.4,
          protein NP_004159.2. The older complex II literature refers to the gene product as "the 70-kDa
          flavoprotein subunit", "Fp", or "SdhA", and numbers residues in the mature protein after cleavage
          of the mitochondrial targeting presequence; that is the source of the R408C versus p.Arg451Cys
          discrepancy reconciled in the entry-level notes.

          Allelic architecture, stated at the confidence the evidence supports. One allele, c.1351C>T
          (p.Arg451Cys), is established for this entity: it is the allele of the Taylor/Birch-Machin family
          and of the Courage family, and it is the only variant with a ClinVar record classified against
          "Neurodegeneration with ataxia and late-onset optic atrophy". A second allele, c.1984C>T (p.Arg662Cys),
          was reported de novo in an individual with childhood-onset optic atrophy and cognitive impairment
          whose authors describe it as the second cause of this phenotype, but ClinVar carries no NDAXOA
          record for it and its aggregate classification is conflicting. This entry therefore recognises
          one established and one candidate allele, not two established alleles. Both have since been
          measured in a human SDHA-knockout cell line (PMID:39321216) and both abolish SDH activity —
          per-variant results read from the full text of PMC11611653 (Figures 2 and 5, Table 1; retrieved
          2026-08-01), since the cached abstract for that PMID reports only aggregate counts and names
          neither variant. That strengthens the case that each is a damaging allele but does not change
          the candidate/established split, because that assay assigns no phenotype.

          What the genotype does NOT predict. Because four MONDO disease terms map to this one gene, an
          SDHA genotype alone does not assign a diagnosis. Zygosity separates the recessive infantile
          disorder from the three dominant ones; variant class separates the truncating tumour-predisposition
          alleles from the missense neurodegenerative ones; and, at codon 451 specifically, the identity
          of the substituting residue separates neurodegeneration (p.Arg451Cys) from paraganglioma (p.Arg451His)
          from infantile cardiomyopathy (p.Arg451Ser), per the ClinVar submitter evidence recorded in
          the entry-level notes. A laboratory reporting an SDHA variant must therefore report the phenotype
          question as open.

          Not asserted, deliberately. gnomAD constraint metrics (pLI, o/e LoF, missense Z) are not recorded
          anywhere in this entry because no source consulted here provides them and they were not retrieved
          live. One ClinVar submitter states that c.1351C>T is absent from the current gnomAD release;
          that single submitter statement is recorded here rather than converted into a population frequency
          claim. The one carrier-frequency figure used anywhere in this entry (0.3% of healthy controls,
          in the inheritance section) is for a different, recurrent SDHA nonsense allele and is cited
          there to its source; it is not a frequency for either NDAXOA allele. No modifier locus, no founder
          allele, no somatic mechanism and no genotype-based severity score has been established for this
          disorder.'
      selected_evidence:
        snippet: The affected family members are now shown to carry a C-to-T transition in one allele
          of the nuclear gene encoding the flavoprotein subunit of complex II.
        supports: SUPPORT
