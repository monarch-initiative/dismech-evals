            term:
              id: MONDO:0031006
              label: neurodegeneration with ataxia and late-onset optic atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Retinal Ganglion Cell and Optic Nerve Degeneration
        biological_scale: TISSUE
        description: 'Optic atrophy is the feature that names the disorder and the one that is present
          in every reported family. Its anatomical basis is the particular energetic geometry of the retinal
          ganglion cell: the cell body sits in the retina and generates the mitochondria, which are then
          transported down an axon that is unmyelinated and mitochondria-rich anterior to the lamina cribrosa
          and myelinated and mitochondria-poor behind it. The prelaminar segment therefore carries an
          unusually high, spatially concentrated demand for oxidative ATP with no local capacity to make
          more. Any systemic restriction of oxidative phosphorylation is felt there first, which is the
          accepted explanation for why chemically unrelated mitochondrial lesions, from mitochondrial
          DNA complex I mutations in Leber hereditary optic neuropathy to nuclear OPA1 mutations in dominant
          optic atrophy, all converge on the same optic neuropathy. Complex II deficiency joins that convergence
          from a different enzymatic starting point.'
        locations:
        - preferred_term: optic nerve
          term:
            id: UBERON:0000941
            label: cranial nerve II
        cell_types:
        - preferred_term: retinal ganglion cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
        notes: The retinal ganglion cell binding is an anatomical and mechanistic inference, not an observation
          in this disease. No retina or optic nerve from an NDAXOA patient has been examined histologically,
          and no optical-coherence-tomography ganglion-cell-layer measurement has been published. The
          cell type is bound because retinal ganglion cell axons constitute the optic nerve, so optic
          atrophy localises the lesion to that population by anatomy, and because the cited review establishes
          that population as the canonical target of mitochondrial energy failure. PMID:14766317 predates
          the identification of SDHA disease and says nothing about complex II; it is classified OTHER
          and cited for the general vulnerability mechanism only.
      selected_evidence:
        snippet: Any dysfunction of these systems may be of pathological relevance for optic neuropathies
          with primary or secondary involvement of mitochondria.
        supports: SUPPORT
