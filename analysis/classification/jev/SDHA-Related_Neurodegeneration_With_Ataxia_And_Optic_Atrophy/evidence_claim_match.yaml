      assertion_type: AnimalModel
      assertion:
        species: Saccharomyces cerevisiae
        genotype: SDH1 C-terminal arginine substitutions (Arg582, Arg638 with Cys630)
        category: Site-directed mutagenesis of the orthologous flavoprotein subunit
        description: 'Budding yeast is the only tractable system in which the flavinylation chemistry
          proposed for this disorder has been dissected genetically. Mutation of C-terminal arginine residues
          of Sdh1, the SDHA orthologue, prevents covalent flavinylation and, for one residue, prevents
          assembly of the tetramer, while showing that assembly requires FAD binding but not necessarily
          the covalent linkage. The authors state that their results document the basis for the SDH deficiency
          and pathology seen with mutations in human Sdh1.

          Its limits should be stated plainly. The residues mutated are yeast Arg582 and Arg638, not the
          human residues that cause this disease, and no alignment establishing correspondence to human
          Arg451 or Arg662 was performed here or asserted. The yeast work is therefore evidence that this
          class of lesion exists and behaves as modelled, not evidence about the human alleles. No animal
          model of NDAXOA exists in any species: there is no heterozygous Sdha knock-in mouse carrying
          either human allele, and homozygous Sdha disruption in mammals models the recessive disorder
          rather than this one.'
        genes:
        - preferred_term: SDHA
          term:
            id: hgnc:10680
            label: SDHA
        associated_phenotypes:
        - Loss of covalent flavinylation of the Sdh1 flavoprotein subunit
        - Failure of succinate dehydrogenase tetramer assembly (Arg582)
        - Destabilisation of the flavinylation factor Sdh5
      selected_evidence:
        snippet: Mutation of Arg(582) in yeast Sdh1 precludes flavinylation as well as assembly of the
          tetrameric enzyme complex.
        supports: SUPPORT
