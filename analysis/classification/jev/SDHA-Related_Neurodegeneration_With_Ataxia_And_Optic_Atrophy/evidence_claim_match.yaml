        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic counselling
        description: 'Counselling in this disorder is unusually difficult and the difficulty is specific
          rather than generic. A carrier faces a 50% transmission risk, but what is transmitted cannot
          be described: within one published family the same allele produced lethal infantile cardiomyopathy
          in one child and adult optic atrophy in another. Beyond that, the family must be told that the
          literature attaches a tumour-surveillance recommendation to SDHA pathogenic variants generally,
          that no such recommendation exists for adult-onset mitochondrial disease, and that the absolute
          risk of either outcome for their particular allele is unknown. Predictive testing of at-risk
          relatives therefore returns a result whose meaning is genuinely indeterminate.'
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        action_category: COUNSELING_INFORMATIONAL
      selected_evidence:
        snippet: There is no similar screening or testing recommended for individuals potentially at risk
          for adult-onset mitochondrial disease. Additionally, the absolute risk for both conditions is
          unknown.
        supports: SUPPORT
    origin:
