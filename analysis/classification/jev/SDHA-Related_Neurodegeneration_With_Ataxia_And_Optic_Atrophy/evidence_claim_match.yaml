  03d752496ff434d96ca38d6d9a2b860aceb1b8fed000f0a48ff6ee80f4167edd:
    claim:
      about:
        disease:
          name: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy
          disease_term:
