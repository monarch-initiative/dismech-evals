          as a phenotype with note-level provenance rather than as an evidence-backed claim on this node.
          No autopsy, and therefore no Purkinje-cell count, exists for any NDAXOA patient; the conformance
          to the cerebellar module is deliberately made at its `Cerebellar Ataxia` consequence node for
          that reason.
      selected_evidence:
        snippet: Previously, we identified a family with complex II deficiency and late-onset neurodegenerative
          disease with progressive optic atrophy, ataxia, and myopathy.
