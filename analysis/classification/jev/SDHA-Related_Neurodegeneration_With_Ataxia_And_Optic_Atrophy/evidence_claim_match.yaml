  d0a659792bd3bc45ee38f5d9433c9a6a7c4e9ec6db83d9a29c0524f0ff685fca:
    claim:
      about:
        disease:
          name: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy
          disease_term:
            preferred_term: neurodegeneration with ataxia and late-onset optic atrophy
            term:
              id: MONDO:0031006
              label: neurodegeneration with ataxia and late-onset optic atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Divergence From the SDHx Tumour-Predisposition Arm
        biological_scale: MOLECULAR
        description: 'Loss of succinate dehydrogenase has a second, entirely different consequence: succinate
          accumulates and acts as an oncometabolite, inhibiting alpha-ketoglutarate-dependent dioxygenases,
          driving a pseudohypoxic transcriptional response and remodelling the epigenome. That is the
          route by which heterozygous SDHx loss-of-function alleles, with somatic loss of the second allele,
          cause paraganglioma, phaeochromocytoma and gastrointestinal stromal tumour. This node exists
          to state explicitly that NDAXOA is not known to travel that route, and to keep the two arms
          from being conflated.

          The empirical position, as of this curation, is that mitochondrial-disease SDHx genotypes and
          tumour SDHx genotypes have historically been reported as separate sets, with only isolated alleles
          crossing over. No tumour has been reported in either NDAXOA pedigree. Whether that reflects
          a real mechanistic divergence, in which a missense allele that blocks flavinylation without
          destroying the tumour-suppressor function of the locus fails to initiate tumorigenesis, or merely
          reflects the tiny number of carriers ever followed, is unresolved and is recorded as an open
          discussion rather than asserted in either direction. The practical consequence is that clinicians
          have to make a surveillance decision on absent evidence.'
        genes:
        - preferred_term: SDHA
          term:
            id: hgnc:10680
            label: SDHA
        chemical_entities:
        - preferred_term: succinate
          modifier: INCREASED
          term:
            id: CHEBI:30031
            label: succinate(2-)
        - preferred_term: 2-oxoglutarate
          term:
            id: CHEBI:16810
            label: 2-oxoglutarate(2-)
        biological_processes:
        - preferred_term: hypoxia-inducible factor-1alpha signaling pathway
          modifier: INCREASED
          term:
            id: GO:0097411
            label: hypoxia-inducible factor-1alpha signaling pathway
        mechanism_confidence: HYPOTHETICAL
        notes: Marked HYPOTHETICAL because the direction being asserted is a negative and the evidence
          for it is absence of reported tumours in six or so carriers followed for a lifetime, which is
          not a reassuring denominator. Succinate has never been measured in an NDAXOA patient. The node
          is retained rather than deleted because leaving it out would allow a reader to import the tumour
          mechanism into this entity by association with the gene symbol, which is exactly the error this
          entry is scoped to prevent.
      selected_evidence:
        snippet: SDHx mutations lead to the accumulation of succinate, which acts as an oncometabolite
          by inhibiting iron(II) and alpha-ketoglutarate-dependent dioxygenases thereby regulating the
          cell's hypoxic response and epigenetic processes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/0
