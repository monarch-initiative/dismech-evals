  e7892b2b6e50bb3f4def9ce3419bd1693554fec2df637faae3731237b9a46088:
    claim:
      about:
        disease:
          name: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy
          disease_term:
            preferred_term: neurodegeneration with ataxia and late-onset optic atrophy
            term:
              id: MONDO:0031006
              label: neurodegeneration with ataxia and late-onset optic atrophy
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        description: 'A single heterozygous SDHA missense allele is sufficient to cause disease. Transmission
          was vertical in both reported pedigrees: two affected sisters in the first, and an affected
          father with two affected children in the second, whose report is titled for the dominant transmission
          it demonstrates. The third reported individual carried a de novo heterozygous allele with unaffected
          parents, which is the other signature of dominance.

          Dominance here is not equivalent to haploinsufficiency, and the distinction is load-bearing
          for the whole entry. Heterozygous SDHA loss-of-function alleles are carried, unaffected, by
          the parents of children with recessive complex II deficiency and by unaffected relatives in
          tumour-predisposition families, and at least one of them is not vanishingly rare: the recurrent
          nonsense allele c.91C>T (p.Arg31*) was found in 0.3% of healthy controls in the series cited
          below. If losing half the SDHA gene dosage were sufficient to cause optic atrophy and ataxia,
          those carriers would be affected and they are not. The dominant neurodegenerative alleles are
          instead specific missense substitutions at conserved arginines that are argued to produce a
          full-length subunit unable to carry its FAD cofactor.

          Expressivity within a single pedigree is extreme. In the second family the same heterozygous
          allele produced an index patient whose optic atrophy, polyneuropathy, psychiatric features and
          cardiomyopathy declared themselves over adult life, a son with cardiomyopathy from early childhood
          who did not develop optic atrophy until adulthood, and a daughter who died at seven months of
          cardiac insufficiency. Penetrance is recorded as UNKNOWN rather than complete: with two pedigrees
          in the world literature there is no denominator of obligate carriers from which to estimate
          it, and asserting COMPLETE would be an unsupported number dressed as an enum.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: UNKNOWN
        expressivity: VARIABLE
      selected_evidence:
        snippet: Here, we report clinical and molecular investigations of three family members with a
          heterozygous mutation in the large flavoprotein subunit SDHA previously described to cause complex
          II deficiency.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
