            id: MONDO:0100294
            label: mitochondrial complex II deficiency, nuclear type 1
        description: The recessive allelic disorder, caused by biallelic SDHA variants and curated separately
          in `kb/disorders/Mitochondrial_Complex_II_Deficiency_Nuclear_Type_1.yaml`. This is not a differential
          in the ordinary sense of a mimicking disease; it is the other zygosity of the same gene, and
          the two are separated by the number of damaged alleles rather than by clinical judgement. The
          distinction is made at the moment the sequencing result is read, not at the bedside.
        distinguishing_features:
        - 'Zygosity is the discriminator: NDAXOA arises from a single heterozygous missense allele, MC2DN1
          from biallelic loss-of-function or severely hypomorphic genotypes.'
        - MC2DN1 presents in infancy or early childhood with Leigh syndrome or leukodystrophy; NDAXOA
          is dominated by adult-onset optic atrophy and ataxia, with the qualification that its cardiac
          arm can present in infancy.
        - Residual complex II activity is partial in NDAXOA, of the order of half of control values, and
          far lower in MC2DN1.
        - Parents of an MC2DN1 proband are unaffected heterozygous carriers; a parent of an NDAXOA proband
          is either affected or the variant is de novo.
        - MONDO does not place NDAXOA beneath MONDO:0100294, verified by OAK ancestor query; the two are
          sibling consequences of one gene, not a parent and a subtype.
        notes: MONDO:0100294 was verified with OAK on 2026-08-01 and matches the disease_term already
          bound in the existing complex II deficiency entry, which was read and not modified. The description
          caveat about that file's prose blurring the two entities is recorded in the entry-level notes.
      selected_evidence:
        snippet: Underlying autosomal-recessive genetic defects are found in most of the 'SDHx' genes
          encoding complex II (SDHA, SDHB, SDHC, and SDHD) and its assembly factors.
        supports: SUPPORT
