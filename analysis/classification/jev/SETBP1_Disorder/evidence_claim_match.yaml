          anomalies, refractory epilepsy, and tumor predisposition favor Schinzel-Giedion syndrome.
        - Loss-of-function variants or gene-disrupting rearrangements with milder speech-dominant neurodevelopmental
          phenotype favor SETBP1 haploinsufficiency disorder.
      selected_evidence:
        snippet: This condition, distinctly separated from Schinzel-Giedion syndrome, is referred to as
          autosomal dominant mental retardation 29 (ADR29).
