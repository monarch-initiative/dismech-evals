            term:
              id: MONDO:0014482
              label: intellectual disability, autosomal dominant 29
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SETBP1 haploinsufficiency
        description: Heterozygous loss-of-function variants (nonsense, frameshift), intragenic deletions,
          or structural rearrangements that interrupt SETBP1 reduce functional SETBP1 protein to roughly
          half-normal dosage. SETBP1 encodes a SET-binding nuclear protein that acts as a transcriptional
          regulator and epigenetic hub; reduced dosage diminishes its regulatory activity in developing
          neural tissue. Unlike Schinzel-Giedion syndrome (degron-region gain-of-function, protein over-accumulation),
          SETBP1-HD results from insufficient SETBP1.
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        biological_processes:
        - preferred_term: Regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DECREASED
      selected_evidence:
        snippet: The diagnosis of SETBP1-HD is established in a proband with suggestive findings and a
          heterozygous pathogenic loss-of-function variant in SETBP1 identified by molecular genetic testing.
        supports: SUPPORT
    origin:
