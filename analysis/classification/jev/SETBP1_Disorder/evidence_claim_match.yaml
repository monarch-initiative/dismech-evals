  104583a146e5abf77ea90e2b563d82cc0052523ecebcf2d0f36260314d952baa:
    claim:
      about:
        disease:
          name: SETBP1 Haploinsufficiency Disorder
          disease_term:
            preferred_term: SETBP1 haploinsufficiency disorder
            term:
              id: MONDO:0014482
              label: intellectual disability, autosomal dominant 29
        context: []
      assertion_type: Genetic
      assertion:
        name: SETBP1
        association: Heterozygous loss-of-function variants, deletions, and structural rearrangements
          (haploinsufficiency)
        gene_term:
          preferred_term: SETBP1
          term:
            id: hgnc:15573
            label: SETBP1
        inheritance:
        - name: Autosomal Dominant
          de_novo_rate: '80'
        notes: SETBP1-HD is caused by heterozygous loss-of-function SETBP1 variants (nonsense, frameshift),
          intragenic deletions, or structural rearrangements that disrupt the gene, resulting in haploinsufficiency.
          Most cases are de novo; rarely the variant is inherited from a parent with germline (or somatic
          and germline) mosaicism. This is mechanistically distinct from the degron-region gain-of-function
          variants causing Schinzel-Giedion syndrome.
      selected_evidence:
        snippet: We propose structural variants as a recurrent event in SETBP1 haploinsufficiency, which
          may be overlooked by laboratory routine genomic analyses (CMA and Whole Exome Sequencing) or
          only partially determined when associated with genomic losses at breakpoints.
        supports: SUPPORT
