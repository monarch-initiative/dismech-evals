      assertion:
        name: Disrupted neurodevelopmental transcriptional programs
        description: Reduced SETBP1 dosage perturbs key developmental signaling and transcription pathways
          in neural cells. Isogenic CRISPR-edited iPSC neural models of SETBP1-HD variants show altered
          WNT signaling and RNA polymerase II (POL2RA) pathways, with GATA2 identified as a central transcription
          factor in the disease perturbation, and altered expression of gene sets related to neural forebrain
          development. SETBP1 forms nuclear bodies that interact with the nuclear lamina and may organize
          higher-order chromatin, so dosage changes influence global gene-expression patterns and signaling
          molecules such as AKT.
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
