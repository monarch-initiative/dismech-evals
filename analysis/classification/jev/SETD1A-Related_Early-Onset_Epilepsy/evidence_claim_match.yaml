        name: Trio Exome or Genome Sequencing
        description: Molecular diagnosis rests on identifying a heterozygous pathogenic or likely pathogenic
          SETD1A variant. Trio whole-exome or whole-genome sequencing is the modality used in essentially
          every reported case, because parental sequencing is what establishes de novo status -- which
          is both a major ACMG pathogenicity criterion (PS2) for these variants and the fact that separates
          the two recurrence-risk scenarios. Sanger sequencing is used to confirm the variant and its
          segregation.
        diagnosis_term:
          preferred_term: whole exome sequencing
          term:
            id: NCIT:C101295
            label: Whole Exome Sequencing
      selected_evidence:
        snippet: Here, whole-exome sequencing and Sanger sequencing were performed on a 4-year-old Chinese
          girl with early-onset epilepsy and her unaffected parents.
        supports: SUPPORT
