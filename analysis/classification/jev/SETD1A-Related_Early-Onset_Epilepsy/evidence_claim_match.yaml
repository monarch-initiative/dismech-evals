        description: In human SETD1A+/- iPSC-derived excitatory/inhibitory networks, SETD1A haploinsufficiency
          produces a hyperactive cAMP/PKA pathway, increased dendritic complexity, and increased network
          bursting, and pharmacological targeting of the cAMP pathway rescues the network phenotype. This
          offers a candidate molecular route from chromatin lesion to the network hyperexcitability presumed
          to underlie seizures -- and a candidate therapeutic axis -- but it has not been tested in patients
          or in an epilepsy-specific model.
