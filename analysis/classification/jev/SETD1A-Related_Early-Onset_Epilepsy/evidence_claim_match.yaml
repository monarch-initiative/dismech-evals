              label: epilepsy, early-onset, with or without developmental delay
        context: []
      assertion_type: Treatment
      assertion:
        name: Adrenocorticotropic Hormone Therapy
        description: 'ACTH is the guideline-standard therapy for infantile epileptic spasms syndrome and
          is the agent that produced remission in the one reported SETD1A-related IESS case: spasms stopped
          within three days of starting ACTH (2 U/kg/day), treatment continued for four weeks and was
          then switched to oral prednisone, with valproic acid added as adjunct. The child remained seizure-free
          at follow-up. Pyridoxine had been given empirically alongside ACTH from admission, but the authors
          concluded that a pyridoxine-dependent mechanism was not involved -- spasms persisted on pyridoxine
          alone and no ALDH7A1 alteration was found -- so the response is attributed to ACTH. This is
          a single case, not evidence of a SETD1A-specific ACTH effect.'
        therapeutic_modality: PEPTIDE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: adrenocorticotropic hormone
            term:
              id: CHEBI:3892
              label: corticotropin
        target_phenotypes:
        - preferred_term: Epileptic spasm
          term:
            id: HP:0011097
            label: Epileptic spasm
      selected_evidence:
        snippet: The epileptic spasms disappeared after 3 days of ACTH administration.
        supports: SUPPORT
