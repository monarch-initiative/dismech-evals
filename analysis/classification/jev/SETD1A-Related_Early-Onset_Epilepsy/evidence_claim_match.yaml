            description: Two independently generated heterozygous Setd1a mouse lines. Mukai et al. (PMID:31606247)
              report altered axonal branching, cortical synaptic dynamics and working-memory deficits,
              plus reversibility on adult Setd1a reinstatement or LSD1 antagonism; Nagahama et al. (PMID:32937141)
