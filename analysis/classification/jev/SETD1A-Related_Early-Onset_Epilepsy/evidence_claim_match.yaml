  7208fdb9ae0252afa83f954087e54980d83a2fb00f32815bc4122e76eecf7ccb:
    claim:
      about:
        disease:
          name: SETD1A-Related Early-Onset Epilepsy
          disease_term:
            preferred_term: epilepsy, early-onset, with or without developmental delay
            term:
              id: MONDO:0030005
              label: epilepsy, early-onset, with or without developmental delay
        context: []
      assertion_type: Diagnosis
      assertion:
        name: DNA Methylation Episignature Testing
        presence: ABSENT
        description: Not diagnostically informative for SETD1A, which is the point worth recording. Many
          chromatinopathies have a reproducible peripheral-blood DNA-methylation episignature that resolves
          variants of uncertain significance, and SETD1A's paralog SETD2 does. Targeted profiling of more
          than two million CpGs in six SETD1A patients found no strong episignature, so a negative methylation
          test does not argue against a SETD1A diagnosis and this assay should not be used for variant
          interpretation here. Note this concerns CpG DNA methylation and is not evidence against the
          histone H3K4 methylation lesion, which is a different mark measured by different assays.
      selected_evidence:
        snippet: Specific methylation episignatures have been detected for a range of chromatin gene-related
          NDDs and have impacted clinical practice by improving the interpretation of variant pathogenicity.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37166351
      reference_title: Epigenotype-genotype-phenotype correlations in SETD1A and SETD2 chromatin disorders.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Establishes the expectation this disorder departs from: episignatures are clinically
        useful across chromatin-gene NDDs generally, which is why their absence in SETD1A is a substantive
        test-selection point.'
