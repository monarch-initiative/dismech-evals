        - path: /animal_models/0
          value:
            name: Setd1a haploinsufficient mouse
            species: Mouse
            genotype: Setd1a+/- (heterozygous loss-of-function / frameshift)
            publication: PMID:32937141
            description: Two independently generated heterozygous Setd1a mouse lines. Mukai et al. (PMID:31606247)
              report altered axonal branching, cortical synaptic dynamics and working-memory deficits,
              plus reversibility on adult Setd1a reinstatement or LSD1 antagonism; Nagahama et al. (PMID:32937141)
              carry a frameshift mimicking a human loss-of-function allele and show impaired excitatory
              synaptic transmission in layer 2/3 medial prefrontal cortex pyramidal neurons. Both were
              built to model schizophrenia, and both are curated here as one model record because they
              share the genotype and the same relationship to this entry's pathograph.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Cortical Network Hyperexcitability
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: No Setd1a+/- mouse study reports spontaneous seizures, epileptiform EEG, or a lowered
          seizure threshold, and the measured direction of change in excitatory synaptic function is the
          opposite of a hyperexcitable state. The mouse therefore does not model the epileptogenic step
          of this entry's pathograph, which is the substance of the HUMAN_MODEL_MISMATCH discussion.
        limitations: 'Two limitations, and they are different. First, the phenotype: these lines show
          attenuated -- not increased -- excitatory synaptic transmission, so on the one relevant measure
          they run against the human epilepsy. Second, ascertainment: they were built and phenotyped for
          schizophrenia-related behavior and cognition, so no chronic video-EEG or chemoconvulsant seizure-threshold
          testing has been published at any age. A negative on an assay that was never run is weaker than
          a demonstrated absence of seizures, and this link should be revisited if such phenotyping is
          reported.'
      selected_evidence:
        snippet: Mice carrying a heterozygous loss-of-function mutation of the orthologous gene exhibit
          alterations in axonal branching and cortical synaptic dynamics accompanied by working memory
          deficits.
        supports: SUPPORT
