      assertion_type: Pathophysiology
      assertion:
        name: Transcriptional Dysregulation of Synaptic and Neurodevelopmental Genes
        description: Reduced H3K4 methylation at SETD1A-bound promoters and enhancers dysregulates transcriptional
          programs in neurons. In Setd1a-deficient mice, Setd1a binds both promoters and enhancers (overlapping
          Mef2 on enhancers), and its targets -- highly expressed in pyramidal neurons -- show complex
          up- and downregulation, including genes related to neurodevelopmental disorders and synaptic
          function in the medial prefrontal cortex. In human SETD1A+/- iPSC-derived neuronal networks,
          transcriptomic profiling shows perturbation of glutamatergic synaptic gene sets. In patient-variant
          overexpression experiments, two common downstream genes (Neurl4 and Usp39) were affected by
          SETD1A mutations.
        role: central_effector
        biological_scale: CELLULAR
