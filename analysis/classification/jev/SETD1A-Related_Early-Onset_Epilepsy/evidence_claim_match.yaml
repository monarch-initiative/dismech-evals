  19f629ba3426b0c5cf41c69467a97e43feb0ad0ce6c0b9cf23806f8cdc5087be:
    claim:
      about:
        disease:
          name: SETD1A-Related Early-Onset Epilepsy
          disease_term:
            preferred_term: epilepsy, early-onset, with or without developmental delay
            term:
              id: MONDO:0030005
              label: epilepsy, early-onset, with or without developmental delay
        context: []
      assertion_type: Genetic
      assertion:
        name: SETD1A
        gene_term:
          preferred_term: SETD1A
          term:
            id: hgnc:29010
            label: SETD1A
        relationship_type: CAUSATIVE
        notes: SETD1A (16p11.2) encodes the catalytic subunit of a Set1/COMPASS complex that methylates
          histone H3 lysine 4. The epilepsy-associated variants reported to date include missense changes
          both inside and outside the catalytic SET domain (p.Gln269Arg, p.Ser356Phe, p.Arg913Cys, p.Gly1369Arg,
          p.Arg1392His) and truncating alleles (p.Glu1002Glyfs*20 in an infantile epileptic spasms syndrome
          case). SETD1A is substantially depleted of loss-of-function variants in the general population,
          consistent with dosage sensitivity. No clean genotype-phenotype rule separating epilepsy-predominant
          from developmental-delay-predominant presentations has been established.
        variants:
        - name: p.Gln269Arg
          description: De novo missense variant reported in early-onset epilepsy (Yu et al. 2019).
          type: missense
        - name: p.Arg913Cys
          description: Missense variant segregating with seizures in a four-generation family (Yu et al.
            2019); its expression also perturbed cortical neuron migration in the mouse brain.
          type: missense
        - name: p.Gly1369Arg
          description: De novo missense variant reported in early-onset epilepsy (Yu et al. 2019).
          type: missense
        - name: p.Arg1392His
          description: De novo missense variant reported in early-onset epilepsy (Yu et al. 2019).
          type: missense
        - name: p.Ser356Phe (c.1067C>T)
          description: De novo missense variant outside the SET domain in a girl with focal-to-bilateral
            tonic-clonic seizures from 3 months, normal MRI, and preserved cognition; classified likely
            pathogenic (ACMG PS2+PM2+PP3).
          type: missense
          clinical_significance: LIKELY_PATHOGENIC
        - name: p.Glu1002Glyfs*20 (c.3005_3006delAG)
          description: De novo frameshift variant in exon 12 in a child with infantile epileptic spasms
            syndrome and hypsarrhythmia.
          type: frameshift
      selected_evidence:
        snippet: Whole-exome sequencing indicated that all four of these mutations were responsible for
          the seizures.
        supports: SUPPORT
