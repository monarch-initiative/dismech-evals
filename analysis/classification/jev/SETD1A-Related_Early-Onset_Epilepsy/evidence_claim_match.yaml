      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: h3k4_transcriptional_dysregulation_model
        hypothesis_label: H3K4-Methylation-Dependent Transcriptional Dysregulation Model
        status: CANONICAL
        description: 'The disorder results from SETD1A haploinsufficiency: reduced Set1/COMPASS H3K4 methyltransferase
          dosage lowers activating promoter methylation, dysregulating synaptic and neurodevelopmental
          transcriptional programs in cortical neurons, whose disturbed development and function produce
          early-onset seizures with variable developmental impact. This is the model advanced by the defining
          report and supported by mouse, fly, and human iPSC work across the allelic SETD1A disorders.
          Notably, the chromatin lesion appears pharmacologically reversible in mice: antagonizing LSD1,
          the demethylase that counteracts Setd1a, fully rescues the behavioral and morphological deficits
          of Setd1a-deficient animals, and reinstating Setd1a expression in adulthood rescues cognitive
          deficits -- implying a postnatal therapeutic window rather than fixed structural damage.'
      selected_evidence:
        snippet: we suggest that epigenetic dysregulation, specifically in the histone H3K4 methylation
          pathway, is an important mechanism in the pathogenesis of schizophrenia.
        supports: SUPPORT
