      assertion_type: Pathophysiology
      assertion:
        name: Abnormal Excitatory Synapse Development and Function
        description: Epilepsy-associated SETD1A variants expressed in mouse primary cortical neurons impair
          excitatory synapse development. Consistently, Setd1a+/- mice show altered axonal branching,
          cortical synaptic dynamics, and impaired excitatory synaptic transmission in layer 2/3 pyramidal
          neurons of the medial prefrontal cortex, with postsynaptic Setd1a required for normal excitatory
          transmission. Human SETD1A+/- iPSC-derived neurons show increased dendritic complexity. The
          mouse work is schizophrenia-focused and reports attenuated excitatory function, whereas human
          iPSC networks are hyperactive -- a directionality discrepancy recorded in the HUMAN_MODEL_MISMATCH
          discussion on this entry.
        role: central_effector
