  cabe6db2ff2b755da2d17c3c879572d221d5310e155e93a91ec17376a02369c4:
    claim:
      about:
        disease:
          name: SETD1A-Related Early-Onset Epilepsy
          disease_term:
            preferred_term: epilepsy, early-onset, with or without developmental delay
            term:
              id: MONDO:0030005
              label: epilepsy, early-onset, with or without developmental delay
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: setd1a_epedd_model_directionality_mismatch
        prompt: Do existing SETD1A model systems capture the epileptogenic mechanism of EPEDD, given that
          Setd1a+/- mice show attenuated excitatory synaptic function while human SETD1A+/- iPSC networks
          are hyperactive and patients have early-onset epilepsy?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Abnormal Excitatory Synapse Development and Function
        - pathophysiology#Cortical Network Hyperexcitability
        rationale: Nearly all functional SETD1A work was designed to model schizophrenia. Setd1a+/- mice
          show reduced excitatory synaptic transmission in medial prefrontal cortex and behavioral abnormalities,
          without reported spontaneous seizures, whereas human SETD1A+/- iPSC-derived networks show increased
          bursting driven by glutamatergic neurons -- the direction expected for an epilepsy. Whether
          this reflects a genuine species difference, a developmental-stage difference (immature iPSC
          networks versus adult mouse cortex), or circuit-level compensation is unresolved, and no model
          has been assessed for seizure phenotypes or EEG. Translational validity of the mouse synaptic
          findings to the human epilepsy is therefore the open question, not the existence of a synaptic
          lesion.
        proposed_experiments:
        - experiment_id: setd1a_mouse_eeg_seizure_threshold
          name: EEG and seizure-threshold phenotyping of Setd1a haploinsufficient mice
          description: Chronic video-EEG and chemoconvulsant seizure-threshold testing in existing Setd1a+/-
            lines, across developmental stages, to determine whether the models express a hyperexcitability
            phenotype relevant to EPEDD at any age.
          would_support:
          - pathophysiology#Cortical Network Hyperexcitability
          supporting_outcome:
          - Spontaneous epileptiform discharges or lowered seizure threshold in Setd1a+/- mice, particularly
            in early postnatal life.
          refuting_outcome:
          - Normal EEG and seizure thresholds at all ages despite confirmed haploinsufficiency, which
            would localize the epileptogenic mechanism to human-specific or developmental-stage-specific
            biology.
      selected_evidence:
        snippet: Our findings suggest that reduced SETD1A may attenuate excitatory synaptic function and
          contribute to the pathophysiology of SCZ.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
