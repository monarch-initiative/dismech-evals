              label: epilepsy, early-onset, with or without developmental delay
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SETD1A Haploinsufficiency
        description: Heterozygous SETD1A variants -- truncating alleles and damaging missense changes
          within and outside the catalytic SET domain -- reduce the dosage of functional SETD1A, the catalytic
          subunit of a Set1/COMPASS histone methyltransferase complex. Functional characterization of
          patient variants (including a SET-domain missense allele) shows behavior comparable to loss-of-function
          alleles, and the gene is strongly depleted of loss-of-function variants in the general population,
          consistent with dosage sensitivity.
        role: trigger
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genes:
        - preferred_term: SETD1A
          term:
            id: hgnc:29010
            label: SETD1A
        genetic_context:
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'Heterozygous SETD1A alleles: truncating (frameshift, nonsense, splice-site) changes
            and damaging missense substitutions both inside and outside the catalytic SET domain. Patient-derived
            cell lines show that even a SET-domain missense allele behaves as loss of function, and the
            gene is strongly depleted of loss-of-function variants in the general population. Most reported
            epilepsy variants arose de novo, but the defining report includes one missense allele inherited
            through four generations, so DE_NOVO records the predominant rather than exclusive origin.'
        molecular_functions:
        - preferred_term: histone H3K4 methyltransferase activity
          term:
            id: GO:0042800
            label: histone H3K4 methyltransferase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Whole-exome sequencing indicated that all four of these mutations were responsible for
          the seizures.
        supports: SUPPORT
