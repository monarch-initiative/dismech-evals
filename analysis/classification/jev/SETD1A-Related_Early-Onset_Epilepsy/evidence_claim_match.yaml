              built to model schizophrenia, and both are curated here as one model record because they
              share the genotype and the same relationship to this entry's pathograph.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Abnormal Excitatory Synapse Development and Function
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: The mice reproduce the existence of a cortical excitatory synaptic lesion downstream
          of Setd1a haploinsufficiency, together with the transcriptional dysregulation of synaptic genes
          that this entry places upstream of it.
        limitations: The synaptic deficit is characterized in adult medial prefrontal cortex in the context
          of schizophrenia-related behavior, not in the developing cortex at the ages when human seizures
          begin, and its direction (attenuated excitatory transmission) is opposite to that seen in human
          SETD1A+/- neuronal networks.
        readouts:
        - name: Excitatory synaptic transmission in layer 2/3 mPFC pyramidal neurons
          target: Abnormal Excitatory Synapse Development and Function
          direction: DECREASED
          interpretation: Electrophysiological measure of the excitatory synaptic lesion in this model;
            note the direction is opposite to the human iPSC network finding.
          biological_processes:
          - preferred_term: chemical synaptic transmission
            term:
              id: GO:0007268
              label: chemical synaptic transmission
            modifier: DECREASED
      selected_evidence:
        snippet: Our Setd1a (+/-) mice display various behavioral abnormalities relevant to features of
          SCZ, impaired excitatory synaptic transmission in layer 2/3 (L2/3) pyramidal neurons of the
          medial prefrontal cortex (mPFC), and altered expression of diverse genes related to neurodevelopmental
          disorders and synaptic functions in the mPFC.
        supports: SUPPORT
