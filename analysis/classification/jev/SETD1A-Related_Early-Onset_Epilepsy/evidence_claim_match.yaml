          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Setd1a targets are highly expressed in pyramidal neurons and display a complex pattern
          of transcriptional up- and downregulations shaped by presumed opposing functions of Setd1a on
          promoters and Mef2-bound enhancers.
