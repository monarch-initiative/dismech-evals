            term:
              id: MONDO:0030005
              label: epilepsy, early-onset, with or without developmental delay
        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counseling
        description: Counseling in this disorder has to cover two genuinely different recurrence scenarios,
          because SETD1A epilepsy is dominant but not exclusively de novo. Most reported probands carry
          de novo variants, where sibling recurrence risk is low but non-zero because parental gonadal
          mosaicism cannot be excluded by negative parental testing; but the defining report also describes
          a missense variant transmitted with seizures through four generations, where a carrier parent
          has a 50% transmission risk per pregnancy. Parental testing therefore changes the counseling
          substantially and should be offered rather than assumed negative. Expressivity is markedly variable
          even within the allelic spectrum -- from isolated epilepsy with normal cognition to global developmental
          delay -- so a carrier relative's phenotype does not predict a future child's.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: 'we identified four missense mutations in the SETD1A gene (SET domain-containing 1A,
          histone lysine methyltransferase): three de novo mutations in three individuals and one inherited
          mutation in a four-generation family.'
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31197650
      reference_title: De Novo and Inherited SETD1A Variants in Early-onset Epilepsy.
