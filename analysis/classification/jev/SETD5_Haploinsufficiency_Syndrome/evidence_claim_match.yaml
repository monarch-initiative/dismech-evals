      assertion_type: Discussion
      assertion:
        discussion_id: gap_setd5_moyamoya_surveillance
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is cerebrovascular imaging surveillance for moyamoya angiopathy warranted in individuals
          with pathogenic SETD5 variants?
        rationale: Bilateral moyamoya angiopathy has been reported with a de novo SETD5 frameshift variant
          and with two rare SETD5 missense variants, but the ascertainment ran from moyamoya cohorts to
          variants rather than the reverse, and the authors state that the SETD5-moyamoya association
          still requires validation and that penetrance must be assessed before imaging can be recommended.
          Because moyamoya causes childhood strokes and is treatable, resolving this is clinically consequential.
        attaches_to:
        - pathophysiology#Extra-Neural Developmental Involvement
      selected_evidence:
        snippet: These data indicate that rare variants in CHD4 and CNOT3 predispose to MMA in the presence
          and absence of DD; additional data are required to validate an association between SETD5 rare
          variants and MMA.
        supports: SUPPORT
