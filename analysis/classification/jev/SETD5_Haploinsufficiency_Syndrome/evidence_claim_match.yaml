  d6958b9fccde48d1997d75be4062bec171b51349d6aa2faecb853dd89992087b:
    claim:
      about:
        disease:
          name: SETD5 Haploinsufficiency Syndrome
          disease_term:
            preferred_term: intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
            term:
              id: MONDO:0014336
              label: intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: setd5_corepressor_scaffold
        hypothesis_label: SETD5 as a Catalytically Inert Co-Repressor Scaffold
        status: ALTERNATIVE
        description: Under this model SETD5 lacks intrinsic methyltransferase activity and instead scaffolds
          a co-repressor complex containing HDAC3, NCoR, G9a, and PAF1; haploinsufficiency then acts by
          failure of corepressor recruitment and altered histone acetylation rather than by loss of a
          methyl mark. Notably, SETD5 lacks the PHD finger present in its SET-domain homologues, which
          is part of the enzymological argument.
        notes: Both hypotheses converge on the same downstream node - aberrant RNA polymerase II elongation
          and transcriptional infidelity - so the disease model is robust to the controversy even though
          the molecular mechanism is not settled. See the gap_setd5_catalytic_activity discussion.
      selected_evidence:
        snippet: The yeast SET3 and SET4, Drosophila UpSET, and human MLL5 are homologous to SETD5 over
          their SET domains and, except for SETD5, contain a PHD ﬁnger
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
