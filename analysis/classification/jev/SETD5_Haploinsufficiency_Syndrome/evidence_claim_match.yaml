        disease_term:
          preferred_term: 3p25.3 microdeletion syndrome
          term:
            id: MONDO:0018564
            label: 3p25.3 microdeletion syndrome
        description: A contiguous-gene deletion syndrome whose critical region contains THUMPD3, SETD5,
          and THUMPD3-AS1 within a 124 kb interval. SETD5 is regarded as the principal driver of the neurodevelopmental
          core, so the two entities share most clinical features - but they are separate entities because
          deletions can remove additional genes and are detected by a different assay.
        distinguishing_features:
        - 'Molecular: an intragenic SETD5 sequence variant defines the single-gene entity; a copy-number
          loss at 3p25.3 defines the microdeletion syndrome. The deletion may remove THUMPD3 and THUMPD3-AS1
          in addition to SETD5, and larger 3p25-p26 deletions remove substantially more.'
        - 'Clinical: the larger, more distal 3p deletions add low birth weight, microcephaly, telecanthus,
          ptosis, micrognathia, cleft palate, and congenital heart disease - features that are not characteristic
          of isolated SETD5 loss of function.'
        - 'Assay: chromosomal microarray detects the deletion; sequencing detects the intragenic variant.
          Either may be the first-line test depending on presentation.'
      selected_evidence:
        snippet: Deﬁning the minimum common overlap of deletions in multiple individuals has reduced the
          critical region for 3p25 microdeletion syndrome to three genes within a 124 kb interval.
        supports: SUPPORT
