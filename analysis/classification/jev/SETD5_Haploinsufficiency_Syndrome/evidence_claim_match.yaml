        context: []
      assertion_type: Genetic
      assertion:
        name: SETD5
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: SETD5
          term:
            id: hgnc:25566
            label: SETD5
        notes: Heterozygous germline loss-of-function variants (nonsense, frameshift, splice site) in
          SETD5 at 3p25.3 cause the disorder through haploinsufficiency. MONDO asserts RO:0004003 from
          MONDO:0014336 to HGNC:25566 (SETD5); this was verified with OAK before curation as the NEC anchor.
          SETD5 is intolerant to loss-of-function variation (pLI = 1) but not to missense variation, which
          is why LoF alleles rather than missense alleles dominate the pathogenic spectrum. In the National
          Brain Gene Registry cohort, 6 of 11 unique variants were nonsense, 4 frameshift, and 1 splice
          site.
      selected_evidence:
        snippet: In the cohort, there were 11 unique pathogenic/likely pathogenic variants in 13 individuals
          from 11 different families. Of these 11 unique variants, 6 were nonsense, 4 were frameshift,
          and one was splice site.
        supports: SUPPORT
