        context: []
      assertion_type: Diagnosis
      assertion:
        name: DNA Methylation Episignature Testing
        description: 'Genome-wide DNA methylation profiling of peripheral blood using the clinically validated
          EpiSign assay resolves two problems that sequencing alone does not. First, it reclassifies SETD5
          variants of uncertain significance: in a 400-person routine diagnostic neurodevelopmental cohort,
          methylation profiles supported the pathogenicity of variants previously called VUS and were
