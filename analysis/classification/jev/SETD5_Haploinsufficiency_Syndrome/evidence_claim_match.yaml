              label: intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_setd5_mitochondrial_hierarchy
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the mitochondrial fragmentation and bioenergetic deficits seen in Setd5+/- mouse neural
          cells occur in human SETD5-haploinsufficient neurons, and where do they sit in the causal hierarchy
          of the human disease?
        rationale: The mitochondrial phenotype is well characterized in mouse neural stem cells, neurons,
          and cortex, but has not been demonstrated in human patient-derived neural cells, and the authors
          explicitly state that they can only speculate about its position in the pathological hierarchy.
          Whether it is a driver, a parallel consequence of transcriptional dysregulation, or an epiphenomenon
          determines whether mitochondrial-targeted intervention is worth pursuing.
        proposed_experiments:
        - experiment_id: exp_setd5_patient_ipsc_mitochondrial_phenotyping
          name: Patient-derived iPSC neural mitochondrial phenotyping
          description: Derive iPSC neural progenitors and cortical neurons from individuals with confirmed
            SETD5 loss-of-function variants alongside isogenic corrected controls, and measure mitochondrial
            morphology, membrane potential, ATP production, and axonal/synaptic mitochondrial localization.
            This tests whether the mouse mitochondrial phenotype is reproduced in human SETD5-haploinsufficient
            neurons.
        - experiment_id: exp_setd5_mitochondrial_epistasis
          name: Epistasis test placing the mitochondrial defect in the causal hierarchy
          description: Determine whether restoring rDNA output (for example by TIP5 ablation, which already
            rescues the proliferation defect) or correcting RNA polymerase II elongation also rescues
            the mitochondrial phenotype. Rescue would place the mitochondrial defect downstream of transcriptional
            dysregulation; failure to rescue would place it in a parallel branch.
        attaches_to:
        - pathophysiology#Mitochondrial Fragmentation and Bioenergetic Deficit in Neural Cells
      selected_evidence:
        snippet: We found several defects in the mitochondrial compartment; however, we can only speculate
          about their position in the hierarchy of the pathological mechanisms at the basis of the disease.
        supports: SUPPORT
