      assertion:
        name: Recombinant Growth Hormone Therapy
        description: Recombinant growth hormone was given from age 12 to a girl with a de novo SETD5 variant
          and severe short stature (-5.22 SDS) in an overlap phenotype spanning MRD23, Cornelia de Lange,
          and KBG syndromes; growth velocity increased significantly over two years. This is a single
          case and is not established therapy for the disorder.
        action_category: THERAPEUTIC
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        target_phenotypes:
        - preferred_term: Growth delay
          term:
            id: HP:0001510
            label: Growth delay
        notes: Evidence strength is deliberately low. This is n=1, uncontrolled, and short stature was
          normal in all seven individuals of the original SETD5 cohort, so this is not generalizable guidance.
          It is recorded because it is the only reported pharmacological intervention with a measured
          outcome in this disorder.
      selected_evidence:
        snippet: Recombinant growth hormone therapy (rhGH) was started at the age of 12 years. After both
          one year (+3.16 SDS) and two years (+2.9 SDS), the growth rate significantly increased compared
          with the pre-therapy period.
        supports: SUPPORT
