  539fea1f1f196e230901ef93c02632c3fca5b78377b269d20535bbf858bd0e0c:
    claim:
      about:
        disease:
          name: SETD5 Haploinsufficiency Syndrome
          disease_term:
            preferred_term: intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
            term:
              id: MONDO:0014336
              label: intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nec_setd5_vs_3p253_deletion
        kind: INTERPRETATION
        status: OPEN
        prompt: Should the single-gene SETD5 haploinsufficiency entity and the contiguous 3p25.3 microdeletion
          syndrome be modelled as one entity or two?
        rationale: 'dismech keeps them as two entities. SETD5 is now regarded as the principal driver
          of the 3p25.3 deletion neurodevelopmental phenotype - the critical region was narrowed to a
          124 kb three-gene interval, and SETD5 loss of function reproduces the core features - which
          is a strong lumping argument. Against lumping: (i) 3p25.3 deletions vary in size and can remove
          THUMPD3, THUMPD3-AS1, and, in the larger 3p25-p26 deletions, many additional genes, adding features
          (low birth weight, microcephaly, telecanthus, cleft palate) that are not characteristic of isolated
          SETD5 loss of function; (ii) MONDO models them as distinct terms with distinct OMIM anchors;
          (iii) the diagnostic assay differs (microarray versus sequencing); and (iv) authors who deeply
          phenotyped both explicitly argue the overlapping chromatin disorders "still remain distinct
          clinical entities" and that lumping is unhelpful for families. This entry therefore scopes to
          the intragenic-variant entity anchored on MONDO:0014336 / OMIM:615761 / HGNC:25566, and records
          the deletion syndrome as a differential diagnosis. A separate consideration: Orphanet has obsoleted
          its own standalone term for this concept (ORPHA:404440), which shows the boundary is genuinely
          contested at the nosology level.'
        attaches_to:
        - pathophysiology#SETD5 Haploinsufficiency
      selected_evidence:
        snippet: Whilst there is significant phenotypic overlap between the above-mentioned conditions,
          however, they still remain distinct clinical entities. This is important for long term support
          to patients and families, as there are differences and subtleties in both clinical features
          and neurodevelopmental profiles between these conditions which become apparent only when patients
          are deeply phenotyped.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32793091
      reference_title: SETD5 Gene Haploinsufficiency in Three Patients With Suspected KBG Syndrome.
