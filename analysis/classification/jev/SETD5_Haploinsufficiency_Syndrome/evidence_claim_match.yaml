        biological_scale: MOLECULAR
        description: Heterozygous nonsense, frameshift, and splice-disrupting SETD5 variants introduce
          premature termination codons whose transcripts are degraded by nonsense-mediated decay, halving
          functional SETD5 dosage. Whole-gene 3p25.3 microdeletions that remove one SETD5 allele converge
          on the same mechanism. CRISPR/Cas9 modelling of two patient intragenic variants demonstrated
          nonsense-mediated decay directly.
        genes:
        - preferred_term: SETD5
