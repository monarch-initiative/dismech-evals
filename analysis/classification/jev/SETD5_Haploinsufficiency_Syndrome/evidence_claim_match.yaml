              label: intellectual disability-facial dysmorphism syndrome due to SETD5 haploinsufficiency
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: setd5_h3k36me3_catalytic
        hypothesis_label: SETD5 as a Catalytic H3K36 Methyltransferase
        status: ALTERNATIVE
        description: Under this model SETD5 is a genuine SET-domain lysine methyltransferase that directly
          deposits H3K36me3 on active gene bodies, and haploinsufficiency causes disease by reducing that
          mark, desynchronizing RNA polymerase II elongation and corrupting RNA maturation and splicing.
        notes: Held as ALTERNATIVE rather than CANONICAL because the competing scaffold model is supported
          by independent enzymology; the two are not yet reconciled. If this model is correct, catalytic-activity
          restoration is conceptually a therapeutic target.
      selected_evidence:
        snippet: Notably, we demonstrated that SETD5 directly deposits H3K36me3, which is essential to
          allow on-time RNA elongation dynamics.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
