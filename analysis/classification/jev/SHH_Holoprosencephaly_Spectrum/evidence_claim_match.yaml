        context: []
      assertion_type: Genetic
      assertion:
        name: SHH loss-of-function variants
        gene_term:
          preferred_term: SHH
          term:
            id: hgnc:10848
            label: SHH
        association: Causative
        features: Heterozygous loss-of-function and missense variants in SHH. Functional studies in zebrafish
          classify 104 clinically reported SHH variants into loss of function (31), hypomorphic (33),
          and nonpathogenic (40) categories. Incomplete penetrance and variable expressivity are hallmarks,
          consistent with oligogenic and environmental modifier effects. In the largest SHH-genotyped
          series (396 individuals, 157 kindreds), SHH variants more often produced a non-HPE (microform)
          presentation than frank HPE, and truncating variants were more likely than non-truncating variants
          to produce frank HPE - so SHH sits at the milder end of the HPE gene spectrum even though individual-level
          prediction remains unreliable.
      selected_evidence:
        snippet: HPE is more frequent in individuals with truncating mutations, but clinical predictions
          at the individual level remain elusive.
        supports: SUPPORT
