  cedcccdc0c85b98c5dc44a43bc4576db912e56dc6f210f311ae06d87f2cb876b:
    claim:
      about:
        disease:
          name: SHH Holoprosencephaly Spectrum
          disease_term:
            preferred_term: holoprosencephaly 3
            term:
              id: MONDO:0007733
              label: holoprosencephaly 3
        context: []
      assertion_type: Inheritance
      assertion:
        name: Oligogenic
        inheritance_term:
          preferred_term: Oligogenic inheritance
          term:
            id: HP:0010983
            label: Oligogenic inheritance
        description: 'Holoprosencephaly is the only multi-locus claim in this knowledge base tested against
          control populations. Rather than a single pedigree, exome reanalysis of unsolved families found
          oligogenic events in ten families and showed the incidence of oligogenic combinations to be
          significantly higher in patients than in two independent control populations. That case-control
          comparison is what separates this from the many reports where two variants were simply observed
          together. It sits alongside, not instead of, the autosomal dominant SHH block above: the classic
          architecture is a dominant driver variant with markedly incomplete penetrance, and the oligogenic
          model addresses the substantial fraction of families in which no single driver accounts for
          the phenotype. Loci reported as recurrently mutated across the oligogenic families: FAT1, NDST1,
          COL2A1 and SCUBE2. The study''s variants of clinical interest overall fell in 180 genes associated
          with forebrain-development pathways including SHH signalling and primary cilia; that pathway
          statement is about the whole variant set, not specifically about the four recurrent oligogenic
          genes, and is not asserted of them here.'
      selected_evidence:
        snippet: Oligogenic events were observed in 10 families and involved both known and novel holoprosencephaly
          genes including recurrently mutated FAT1, NDST1, COL2A1 and SCUBE2.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/1
      evidence_path: /inheritance/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30508070
      reference_title: 'Integrated clinical and omics approach to rare diseases: novel genes and oligogenic
        inheritance in holoprosencephaly.'
      evidence_source: HUMAN_CLINICAL
      explanation: Reports oligogenic genotypes across ten families and names the recurrent contributing
        loci.
