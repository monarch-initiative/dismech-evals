          lethal in mice. The proposal is that skeletal, cochlear and brain tissue tolerate the LCA9 reduction
          but not the SHILCA one. Neither NAD+ levels nor any tissue-specific step has been measured in
          patients or in a model carrying SHILCA alleles.
