            term:
              id: MONDO:0031007
              label: spondyloepiphyseal dysplasia, sensorineural hearing loss, impaired intellectual development,
                and leber congenital amaurosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NMNAT1 Severe Hypomorphic Loss of Function
        biological_scale: MOLECULAR
        description: An Alu-mediated tandem duplication spanning NMNAT1 exons 4 and 5 of the main isoform
          (c.299+526_*968dup) produces aberrant mRNAs and an approximately four-fold reduction in NMNAT1
          expression in patient fibroblasts; some canonical transcript remains. In trans with the splice
          variant c.439+5G>T, total NMNAT1 mRNA in blood was about 25% lower than in controls and the
          isoform balance was disturbed. Because Nmnat1 knockout mice die as embryos and no human with
          biallelic null alleles is known, the duplication is interpreted as a strong but incomplete loss
          of function, more severe than the hypomorphs that cause retina-restricted LCA9.
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
        genes:
        - preferred_term: NMNAT1
          term:
            id: hgnc:17877
            label: NMNAT1
        molecular_functions:
        - preferred_term: nicotinamide-nucleotide adenylyltransferase activity
          modifier: DECREASED
          term:
            id: GO:0000309
            label: nicotinamide-nucleotide adenylyltransferase activity
      selected_evidence:
        snippet: Gene expression analysis revealed a 4-fold downregulation of the gene NMNAT1, residing
          indeed in the shared autozygous interval.
        supports: SUPPORT
