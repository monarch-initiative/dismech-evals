          value:
            name: Multi-Tissue Nuclear NAD+ Insufficiency
            biological_scale: MOLECULAR
            description: The working model for SHILCA is that the duplication lowers nuclear NAD+ synthesis
              below what skeletal, cochlear and central nervous system tissue tolerate, not only below
              the retina's threshold as in LCA9. Nmnat1 knockout mice die in utero, which shows that some
              NMNAT1 activity is required outside the retina. The tissue-specific steps between NAD+ shortfall
              and chondrodysplasia, hearing loss or hypomyelination have not been studied.
            biological_processes:
            - preferred_term: nuclear NAD+ biosynthesis
              modifier: DECREASED
              term:
                id: GO:0009435
                label: NAD+ biosynthetic process
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Photoreceptor Degeneration
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
      selected_evidence:
        snippet: Mechanistically, loss of NMNAT1 activates the NADase SARM1, the central executioner of
          axon degeneration, to trigger photoreceptor death and vision loss.
        supports: SUPPORT
        directness: INDIRECT
