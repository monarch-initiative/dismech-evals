              id: MONDO:0031007
              label: spondyloepiphyseal dysplasia, sensorineural hearing loss, impaired intellectual development,
                and leber congenital amaurosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Multi-Tissue Nuclear NAD+ Insufficiency
        biological_scale: MOLECULAR
        description: The working model for SHILCA is that the duplication lowers nuclear NAD+ synthesis
          below what skeletal, cochlear and central nervous system tissue tolerate, not only below the
          retina's threshold as in LCA9. Nmnat1 knockout mice die in utero, which shows that some NMNAT1
          activity is required outside the retina. The tissue-specific steps between NAD+ shortfall and
          chondrodysplasia, hearing loss or hypomyelination have not been studied.
        biological_processes:
        - preferred_term: nuclear NAD+ biosynthesis
          modifier: DECREASED
          term:
            id: GO:0009435
            label: NAD+ biosynthetic process
      selected_evidence:
        snippet: murine Nmnat1 knockouts show embryonic lethality, indicating that complete absence of
          NMNAT1 activity is probably not compatible with life
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32533184
      reference_title: An Alu-mediated duplication in NMNAT1, involved in NAD biosynthesis, causes a novel
        syndrome, SHILCA, affecting multiple tissues and organs.
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      explanation: Complete loss of NMNAT1 is not tolerated outside the retina in mouse, the basis for
        reading SHILCA as an extra-retinal NAD+ insufficiency. The paper restates prior mouse work rather
        than reporting it.
