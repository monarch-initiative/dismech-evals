            term:
              id: MONDO:0031007
              label: spondyloepiphyseal dysplasia, sensorineural hearing loss, impaired intellectual development,
                and leber congenital amaurosis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: nmnat1_extraretinal_nad_threshold
        hypothesis_label: Extra-retinal tissues fail below an NMNAT1/NAD+ dosage threshold
        status: EMERGING
        description: The SHILCA alleles leave less NMNAT1 than LCA9 alleles do, and complete loss is embryonic
          lethal in mice. The proposal is that skeletal, cochlear and brain tissue tolerate the LCA9 reduction
          but not the SHILCA one. Neither NAD+ levels nor any tissue-specific step has been measured in
          patients or in a model carrying SHILCA alleles.
      selected_evidence:
        snippet: The rearrangement found in our cases, presumably causing a strong but not complete reduction
          of enzymatic activity, may therefore result in an intermediate syndromic phenotype with respect
          to LCA and lethality.
        supports: SUPPORT
        directness: INDIRECT
