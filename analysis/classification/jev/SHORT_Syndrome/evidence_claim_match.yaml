        biological_scale: ORGANISM
        description: 'Obesity-related insulin resistance travels with fatty liver, dyslipidaemia and low
          adiponectin. Insulin resistance from insulin-receptor dysfunction travels with none of them,
          and insulin resistance from AKT2 dysfunction phenocopies the obesity pattern. SHORT syndrome
          sits with the receptor group: four of five studied patients had extreme insulin resistance without
          dyslipidaemia or hepatic steatosis, and adiponectin was preserved in three of those four. Because
          PIK3R1 acts between the receptor and AKT, that placement is informative about where in the cascade
          the lesion sits, and it makes the metabolic profile a discriminating clinical feature rather
          than an incidental one.'
