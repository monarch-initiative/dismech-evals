  4821e5647b9af9765f6248de6b1756a935d7328bdb0dd38e96c5238ec3824492:
    claim:
      about:
        disease:
          name: SHORT Syndrome
          disease_term:
            preferred_term: SHORT syndrome
            term:
              id: MONDO:0010026
              label: SHORT syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: anterior_segment_mechanism_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what developmental route does reduced PI3K-AKT signalling produce anterior segment
          dysgenesis (Rieger anomaly) in SHORT syndrome?
        attaches_to:
        - pathophysiology#Anterior Segment Dysgenesis
        rationale: 'The gap here is narrower than it looks, and narrower than an earlier draft of this
          entry claimed. Sufficiency is established: the heterozygous R649W allele produces iris hypoplasia
          with an enlarged irregular pupil in the knock-in mouse, and the same allele produces Rieger
          anomaly in human carriers, so the p85-alpha lesion demonstrably reaches anterior segment development
          in vivo. What is missing is everything between. The anterior segment derives from periocular
          neural crest, and no cited source identifies which crest population, which developmental window,
          or which PI3K-dependent process is affected - nor why the mouse stops at the iris while humans
          go on to goniosynechiae, cataract and glaucoma. That species difference is itself a clue nobody
          has followed up. The pathophysiology node is connected to the upstream signalling node with
          unknown intermediates, which is the honest encoding of "we know it gets there, we do not know
          how".'
      selected_evidence:
        snippet: A dominant-negative mutation in the p85α regulatory subunit of PI3K affects development
          of the iris, and contributes to changes consistent with anterior segment dysgenesis in both
          humans and mice.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28632845
      reference_title: Iris Malformation and Anterior Segment Dysgenesis in Mice and Humans With a Mutation
        in PI 3-Kinase.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes sufficiency, which is the half of the question that is answered.
