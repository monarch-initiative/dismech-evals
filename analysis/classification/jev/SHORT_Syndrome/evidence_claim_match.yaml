              id: MONDO:0010026
              label: SHORT syndrome
        context:
        - path: /pathophysiology/1
          value:
            name: Impaired p85-alpha Binding to IRS-1
            biological_scale: MOLECULAR
            description: 'Recruitment of class IA PI3K to the activated insulin receptor depends on the
              p85-alpha SH2 domains engaging phosphotyrosine motifs on IRS-1. The SHORT syndrome hotspot
              variant impairs that interaction, so the catalytic p110 subunit is not brought to its membrane
              substrate after insulin stimulation. This is the step that makes the disease a post-receptor
              defect: the insulin receptor itself is intact.'
            molecular_functions:
            - preferred_term: p85-alpha binding to IRS-1
              term:
                id: GO:0043560
                label: insulin receptor substrate binding
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Reduced PI3K-AKT Signal Transduction
        causal_link_type: DIRECT
        description: Failure to recruit the holoenzyme to IRS-1 is the immediate cause of reduced downstream
          AKT and S6 phosphorylation.
      selected_evidence:
        snippet: Functional studies on lymphoblastoid cells with the PIK3R1 c.1906_1907insC mutation showed
          decreased phosphorylation of the downstream S6 target of the PI3K-AKT-mTOR pathway.
        supports: SUPPORT
