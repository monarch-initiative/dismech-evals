      assertion_type: Treatment
      assertion:
        name: Multi-agent oral antidiabetic therapy
        description: 'Where a single agent is not enough, published practice is to stack oral agents with
          complementary mechanisms rather than move to insulin - which matters here, because insulin resistance
          of this severity makes injected insulin both unattractive and only partly effective. In the
          reported case, metformin, an SGLT-2 inhibitor, a sulfonylurea, a thiazolidinedione and a GLP-1
          agonist together took HbA1c from 14% to 8.8% in six months and then to 7.4%, and deferred insulin.
          Two of those classes are worth identifying separately: the SGLT-2 inhibitor lowers glucose by
          a renal route that does not depend on the impaired PI3K arm at all, and the GLP-1 agonist acts
          on the incretin axis that the knock-in mouse shows to be defective in this disease.'
