  baa9a90c3a7ae5602b6c1c5d34a92c818f232d86f2186ad2d834babc104f68b2:
    claim:
      about:
        disease:
          name: SHORT Syndrome
          disease_term:
            preferred_term: SHORT syndrome
            term:
              id: MONDO:0010026
              label: SHORT syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pik3r1_allelic_direction
        kind: OPEN_QUESTION
        status: OPEN
        prompt: How do PIK3R1 variants that reduce PI3K-AKT signalling (SHORT syndrome) and PIK3R1 variants
          that increase p110-delta activity (APDS2) coexist in the same patients, and what determines
          which phenotype a given allele produces?
        attaches_to:
        - pathophysiology#Reduced PI3K-AKT Signal Transduction
        - pathophysiology#PIK3R1 C-terminal SH2 Domain Variant
        rationale: 'The two PIK3R1 diseases are usually described as having opposite effects on the pathway,
          which makes their co-occurrence in one individual mechanistically awkward rather than merely
          unusual. Reported overlap cases show it is not a theoretical concern: two further patients with
          both phenotypes were described in 2017, taking the total beyond the single previously known
          case, and the authors concluded the association may not be rare. Resolving this matters for
          curation because it determines whether the two entries can keep independent pathographs or whether
          a shared allele-to-phenotype model is needed.'
      selected_evidence:
        snippet: 47 patients with APDS2 have been reported to date, only one of them sharing both PIK3R1-related
          phenotypes.
        supports: SUPPORT
