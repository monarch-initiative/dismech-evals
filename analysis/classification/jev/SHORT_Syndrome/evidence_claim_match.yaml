        description: Heterozygous PIK3R1 variants cluster in exon 14, which encodes the C-terminal SH2
          domain of the p85-alpha regulatory subunit. The reported allele spectrum comprises missense,
          frameshift and nonsense changes, all of which spare the N-terminal half of the protein, and
          c.1945C>T (p.Arg649Trp) recurs across unrelated families as a mutational hotspot. PIK3R1 also
          encodes the p55-alpha and p50-alpha subunits, so a single allele perturbs the regulatory arm
          of every class IA PI3K holoenzyme in which those subunits participate.
        genes:
