  e500afd0e85bc082b0910bb009d07c77134de493241142ed4d9c1065b3766108:
    claim:
      about:
        disease:
          name: SHORT Syndrome
          disease_term:
            preferred_term: SHORT syndrome
            term:
              id: MONDO:0010026
              label: SHORT syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: PIK3R1 pathogenic variants
        gene_term:
          preferred_term: PIK3R1
          term:
            id: hgnc:8979
            label: PIK3R1
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'Reported alleles are heterozygous and cluster in exon 14, encoding the C-terminal SH2
          domain of p85-alpha; they include missense (recurrently c.1945C>T, p.Arg649Trp), frameshift
          (c.1906_1907insC, p.Asn636Thrfs*18) and nonsense (c.1971T>G, p.Tyr657*; c.1960C>T, p.Gln654*)
          changes. The domain clustering is the clinically load-bearing observation: variants elsewhere
          in the same gene, notably splice-site changes affecting the inter-SH2 region, cause activated
          PI3K-delta syndrome 2 instead, which has the opposite effect on PI3K signalling. This entry
          does not assign a `functional_impact_category`: the reported functional data establish that
          pathway signalling is reduced, but none of the cited sources distinguishes haploinsufficiency
          from a dominant-negative action of the mutant subunit, and the recurrent missense hotspot in
          a heterozygous state is compatible with either.'
        variants:
        - name: PIK3R1 c.1945C>T (p.Arg649Trp)
          description: 'The recurrent hotspot allele, accounting for the majority of reported cases. It
            substitutes an arginine in the C-terminal SH2 domain of p85-alpha. Two lines of functional
            work place it as dominant negative rather than simply hypomorphic: overexpression of the mutant
            subunit in preadipocytes attenuates insulin-induced AKT phosphorylation and adipocyte differentiation,
            and the knock-in mouse carrying one copy reproduces the human phenotype.'
          gene:
            preferred_term: PIK3R1
            term:
              id: hgnc:8979
              label: PIK3R1
          type: MISSENSE
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: p85-alpha binding to IRS-1
            description: Impairs insulin-stimulated association of p85-alpha with IRS-1, so class IA PI3K
              is not recruited to the activated receptor complex.
        - name: PIK3R1 c.1906_1907insC (p.Asn636Thrfs*18)
          description: A frameshift insertion in exon 14, the allele in the trio whose exome sequencing
            identified PIK3R1 as the SHORT syndrome gene.
          gene:
            preferred_term: PIK3R1
            term:
              id: hgnc:8979
              label: PIK3R1
          type: FRAMESHIFT
          clinical_significance: PATHOGENIC
        - name: PIK3R1 c.1971T>G (p.Tyr657*)
          description: A de novo truncating allele in the same region. Cells from a patient carrying it
            express abundant truncated PIK3R1 products, which is the observation behind the dominant-negative
            reading rather than a simple loss of the subunit.
          gene:
            preferred_term: PIK3R1
            term:
              id: hgnc:8979
              label: PIK3R1
          type: NONSENSE
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Heterozygous mutations in exon 14 of PIK3R1 were subsequently identified by Sanger sequencing
          in three additional affected individuals and two affected family members.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
