            label: phosphatidylinositol 3-kinase regulator activity
          modifier: ABNORMAL
      selected_evidence:
        snippet: Whole-exome sequencing in a family trio of an affected child and unaffected parents identified
          a de novo frameshift insertion, c.1906_1907insC
        supports: SUPPORT
