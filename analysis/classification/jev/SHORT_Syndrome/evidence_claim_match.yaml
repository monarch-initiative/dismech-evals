      - /disease_term
    evidence_metadata:
      reference: PMID:32879144
      reference_title: 'Insulin resistant diabetes mellitus in SHORT syndrome: case report and literature
        review.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'The age-stratified counts, with the inequalities that make them a claim about puberty:
        every affected patient was 12 or older, and none of the nine aged 10 or under had developed diabetes
        regardless of growth hormone exposure.'
