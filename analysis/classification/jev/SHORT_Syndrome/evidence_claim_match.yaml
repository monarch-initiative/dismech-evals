      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'Heterozygous PIK3R1 variants segregate in an autosomal dominant manner. Both de
          novo and inherited variants are reported, and the recurrent p.Arg649Trp allele has been observed
          to segregate with the phenotype in multigenerational families as well as arising de novo. Penetrance
          is recorded as INCOMPLETE on the strength of a single documented asymptomatic carrier: a novel
          frameshift variant found in a child with APDS2 and mild SHORT features was also present in the
          mother, who was clinically unaffected. That is one family, and it concerns a variant at the
          APDS2 end of the PIK3R1 spectrum rather than a classic cSH2 SHORT allele, so it should not be
          read as a penetrance estimate for p.Arg649Trp.'
      selected_evidence:
        snippet: The same variant was also identified in the patient's hitherto asymptomatic mother, implicating
          an incomplete penetrance.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
