              label: SHORT syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: context_dependent_signalling
        kind: OPEN_QUESTION
        status: OPEN
        prompt: If the C-terminal PIK3R1 variants impair insulin signalling only in some cellular contexts,
          what determines which tissues are affected, and is a single "reduced PI3K-AKT signalling" node
          the right way to model this disease?
        attaches_to:
        - pathophysiology#Reduced PI3K-AKT Signal Transduction
        - pathophysiology#Dissociation of Insulin Resistance from Dyslipidaemia
        rationale: 'The pathograph in this entry routes everything through one node in which PI3K-AKT
          signalling is reduced, and that is how the founding papers framed it. The 2016 study that established
          the dyslipidaemia dissociation complicates the picture in two ways. First, it states outright
          that these mutations impair insulin signalling only in some cellular contexts. Second, in cells
          from one patient carrying the p.Tyr657X allele, the mutant p85-alpha failed to associate with
          IRS1 while downstream signalling was normal - a binding defect that did not propagate. Taken
          together these say the lesion is not a uniform dial turned down across every tissue, which is
          what the single node implies. The tissue selectivity would also explain the dissociation directly:
          hepatic lipogenesis is spared while glucose disposal is not. Nothing cited here identifies what
          makes a given cell type sensitive or resistant, so the node is kept as one and this question
          records the qualification rather than splitting the pathograph on speculation.'
      selected_evidence:
        snippet: PIK3R1 C-terminal mutations impair insulin signaling only in some cellular contexts
        supports: SUPPORT
