      reference_title: Clinical and immunological assessment of APDS2 with features of the SHORT syndrome
        related to a novel mutation in PIK3R1 with reduced penetrance.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The only penetrance observation in this literature: an unaffected carrier parent.
