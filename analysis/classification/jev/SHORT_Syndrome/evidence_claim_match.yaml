      assertion_type: Diagnosis
      assertion:
        name: Clinical recognition with PIK3R1 sequencing
        description: 'The diagnosis is suspected from the combination of intrauterine and postnatal growth
          restriction, lipoatrophy and the facial gestalt, and confirmed by finding a heterozygous PIK3R1
          variant. Relying on the acronym as a checklist under-diagnoses the condition: in a molecularly
          confirmed cohort only about half of patients had four or more of the five classic features,
          so the acronym should not be treated as a diagnostic threshold.'
      selected_evidence:
        snippet: Knowledge of the molecular etiology of SHORT syndrome has permitted a reassessment of
          the clinical phenotype.
        supports: SUPPORT
