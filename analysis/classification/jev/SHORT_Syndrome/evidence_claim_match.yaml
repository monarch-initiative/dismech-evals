  4c8cdc58a7cc9270c55b75fe2ed44de9e87cbce19bd5c341fccc3e69f434945c:
    claim:
      about:
        disease:
          name: SHORT Syndrome
          disease_term:
            preferred_term: SHORT syndrome
            term:
              id: MONDO:0010026
              label: SHORT syndrome
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Pubertal emergence of insulin-resistant diabetes
        notes: 'The metabolic phenotype has a clear temporal structure. Insulin resistance is detectable
          in childhood, but overt diabetes characteristically appears around or after puberty. In the
          literature review accompanying the case report, insulin-resistant diabetes had developed in
          10 of 15 growth-hormone-untreated patients aged 12 or over, and in none of the three treated
          or six untreated patients aged 10 or under. That contrast is what separates an age effect from
          a treatment effect, and it sets the surveillance interval: glucose monitoring matters most from
          puberty onward.'
      selected_evidence:
        snippet: Subsequent literature review for patients with molecularly confirmed SHORT syndrome revealed
          the development of IRDM in 10 of 15 GH-untreated patients aged ≥12 years but in none of three
          GH-treated and six GH-untreated patients aged ≤10 years.
        supports: SUPPORT
    origin:
      assertion_path: /progression/0
      evidence_path: /progression/0/evidence/0
      context_paths:
