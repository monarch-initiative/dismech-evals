              label: SIN3A-related intellectual disability syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: SIN3A-spanning deletion
        display_name: SIN3A-related intellectual disability syndrome due to a 15q24 deletion including
          SIN3A
        genes:
        - preferred_term: SIN3A
          term:
            id: hgnc:19353
            label: SIN3A
        description: Heterozygous 15q24.1-q24.2 microdeletions that remove the whole SIN3A gene, reported
          as Witteveen-Kolk syndrome when the deletion is small (a 550 kb deletion in one man with Kallmann
          syndrome; a 1.6 Mb deletion in a child with the classic phenotype). MONDO has no term for this
          form below MONDO:0044699. Larger recurrent LCR-mediated 15q24 deletions with a more severe contiguous-gene
          phenotype are curated in Chromosome_15q24_Deletion_Syndrome; the size boundary between the two
          concepts is not sharp and some reports call large deletions WITKOS.
      selected_evidence:
        snippet: This phenotype is highly related to that of individuals with atypical 15q24 microdeletions,
          linking SIN3A to this microdeletion syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/0
      context_paths:
