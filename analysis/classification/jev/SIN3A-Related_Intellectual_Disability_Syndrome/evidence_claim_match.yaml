              id: MONDO:0044699
              label: SIN3A-related intellectual disability syndrome
        context:
        - path: /pathophysiology/1
          value:
            name: SIN3A PAH1 Domain Partner-Binding Defect
            description: The few disease-associated missense variants include A126V and K155E in the PAH1
              domain, the amphipathic-helix hub that binds transcription factors and SIN3A-associated
              proteins. Recombinant PAH1 carrying either variant binds SAP25 and TET1 less tightly (K155E
              more than 15-fold weaker for TET1), so these alleles impair specific partner recruitment
              rather than abolishing the protein.
            biological_scale: MOLECULAR
            genes:
            - preferred_term: SIN3A
              term:
                id: hgnc:19353
                label: SIN3A
            genetic_context:
              variant_origin: GERMLINE
              functional_impact_category: LOSS_OF_FUNCTION
            molecular_functions:
            - preferred_term: transcription corepressor activity
              modifier: DECREASED
              term:
                id: GO:0003714
                label: transcription corepressor activity
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Reduced SIN3A-HDAC Corepressor Activity
        causal_link_type: DIRECT
        description: Weaker binding of PAH1 partners is expected to reduce recruitment of the corepressor
          to its target genes; this has not been shown in patient cells.
      selected_evidence:
        snippet: Our findings show how disease-associated Sin3A-PAH1 variants can affect global domain
          stability and flexibility as well as interactions with specific partner proteins
        supports: SUPPORT
