              label: developmental and epileptic encephalopathy, 34
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_kcc2_bidirectional_seizure_effect
        prompt: Given that both proconvulsant and anticonvulsant effects of KCC2 inhibition have been
          reported, under what circumstances does reduced KCC2 activity worsen rather than limit seizure
          activity, and does that boundary apply to the constitutive, lifelong partial deficiency of DEE34?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Termination of Ictal Discharges
        rationale: KCC2 extrudes chloride at the cost of raising extracellular potassium, which can itself
          depolarize neurons and potentiate seizures. Experimental KCC2 blockade has therefore been reported
          to be both pro- and anticonvulsant depending on which step is rate-limiting. All of that evidence
          comes from acute pharmacological manipulation in slice preparations; DEE34 is instead a constitutive
          partial deficiency present throughout development. Whether the acute-blockade findings transfer
          to the chronic genetic condition is unresolved, and it bears directly on whether KCC2-enhancing
          compounds would be expected to help these patients.
        proposed_experiments:
        - experiment_id: exp_kcc2_enhancer_in_hypomorphic_model
          name: Test a KCC2 enhancer in a constitutive hypomorphic Slc12a5 model
          description: Test a KCC2-enhancing compound against seizure burden in a hypomorphic Slc12a5
            knock-in mouse carrying a patient variant, rather than in acute pharmacological blockade models,
            measuring both electrographic seizure duration and extracellular potassium to establish which
            step is rate-limiting in a constitutive partial deficiency.
      selected_evidence:
        snippet: Thus, KCC2 may either diminish or facilitate seizure activity, and both proconvulsant
          and anticonvulsant effects of KCC2 inhibition have been reported.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
