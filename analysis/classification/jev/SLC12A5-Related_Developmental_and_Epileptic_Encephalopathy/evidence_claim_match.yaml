  073ba55b6b17955a2fc8f14fd5600f2a42cf8befc14764a21af1a95c45d52692:
    claim:
      about:
        disease:
          name: SLC12A5-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 34
            term:
              id: MONDO:0014718
              label: developmental and epileptic encephalopathy, 34
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_relative_contribution_transport_vs_structural_arm
        prompt: How much of the developmental phenotype in DEE34 is attributable to the transport-independent
          structural role of KCC2 in dendritic spine and excitatory synapse maturation, as opposed to
          the chloride-extrusion deficit and the seizure burden it causes?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Disrupted Transport-Independent KCC2 Structural Function
        - pathophysiology#Impaired Neurodevelopment
        rationale: 'Two upstream arms converge on the developmental phenotype in this model, and the published
          cases cannot separate them: every reported genotype impairs chloride extrusion, so no patient
          provides the natural experiment of an isolated structural defect. The distinction is not academic
          - if the structural arm carries substantial weight, then even complete seizure control or full
          restoration of chloride transport would leave part of the developmental disability untouched,
          which changes what a KCC2-targeted therapy could be expected to achieve.'
        proposed_experiments:
        - experiment_id: exp_transport_dead_structural_intact_knockin
          name: Transport-dead versus structure-disrupting KCC2 knock-in comparison
          description: Compare knock-in mice carrying a transport-dead but structurally intact KCC2 against
            mice carrying a C-terminal variant that preserves transport while disrupting protein interactions,
            scoring dendritic spine density, excitatory synapse number, seizure burden, and behavioural
            development, to apportion the developmental phenotype between the two arms.
      selected_evidence:
        snippet: More work will be needed to define the specific cellular basis for these findings, including
          whether they are due to abnormal circuit formation versus the sequela of defective IN inhibition.
        supports: SUPPORT
