              label: developmental and epileptic encephalopathy, 34
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC12A5
        association: Biallelic pathogenic variants
        presence: Positive
        notes: 'SLC12A5 encodes KCC2, the neuron-specific K+-Cl- cotransporter. Biallelic pathogenic variants
          - missense, splice-site, and in-frame deletions - cause DEE34. Reported variants include c.279+1G>C
          (p.E50_Q93del), c.572C>T (p.A191V), c.967T>C (p.S323P), c.1243A>G (p.M415V), c.953G>C (p.W318S),
          c.2242_2244del (p.S748del), and the homozygous transmembrane-domain-4 variant c.692G>A (p.R231H).
          Expressivity is variable within this biallelic recessive condition: of the nine children in
          the GeneReviews cohort, six had severe developmental delay with no progress of abilities while
          three made notable neurodevelopmental progress. Severity is thought to track the residual chloride-extrusion
          activity retained by the particular allele combination, and individual variants in one person
          can be impaired to different degrees.'
        gene_term:
          preferred_term: SLC12A5
          term:
            id: hgnc:13818
            label: SLC12A5
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Here we show recessive loss-of-function SLC12A5 mutations in patients with a severe infantile-onset
          pharmacoresistant epilepsy syndrome, epilepsy of infancy with migrating focal seizures (EIMFS).
        supports: SUPPORT
