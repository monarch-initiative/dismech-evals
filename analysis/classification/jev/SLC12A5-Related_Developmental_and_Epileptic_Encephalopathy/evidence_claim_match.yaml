        description: KCC2-mediated chloride transport normally restores the chloride equilibrium after
          intense GABA-A receptor activation, which helps bring an ictal discharge to an end. With reduced
          KCC2, chloride accumulated during a discharge is cleared slowly and the discharge is prolonged.
          This concerns seizure offset, not seizure onset.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
