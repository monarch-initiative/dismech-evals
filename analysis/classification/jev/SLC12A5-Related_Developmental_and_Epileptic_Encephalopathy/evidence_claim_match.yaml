      assertion_type: Discussion
      assertion:
        discussion_id: controversy_kcc2_setpoint_vs_impermeant_anions
        prompt: Is the elevated intraneuronal chloride in KCC2 deficiency principally the direct consequence
          of lost cation-chloride cotransport, or is the neuronal chloride setpoint dominated by the distribution
          of impermeant intracellular anions, with KCC2 acting mainly to restore that setpoint after activity-driven
          chloride loads?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced KCC2-Mediated Chloride Extrusion
        - pathophysiology#Elevated Intraneuronal Chloride Concentration
        rationale: 'The disease model curated here treats reduced KCC2 transport as the proximate cause
          of a raised chloride setpoint. An alternative account holds that the resting setpoint is fixed
          largely by fixed impermeant anionic charge, with KCC2 responsible for clearing dynamic chloride
          loads rather than for setting resting chloride. The two readings predict different therapeutic
          targets: restoring KCC2 transport capacity would be central under the first, whereas under the
          second the critical variable is the neuron''s ability to recover from activity-driven loading,
          which would foreground interventions aimed at seizure-associated chloride accumulation. Both
          readings are compatible with the human variant data, since patient assays measure extrusion
          capacity rather than resting setpoint in vivo.'
        proposed_experiments:
        - experiment_id: exp_chloride_imaging_patient_neurons
          name: Separate resting chloride setpoint from chloride recovery kinetics in patient neurons
          description: Measure resting intracellular chloride and post-load chloride recovery kinetics
            separately, using ratiometric chloride imaging in patient-derived iPSC neurons carrying DEE34
            genotypes alongside isogenic controls, to determine whether the resting setpoint or the recovery
            rate is the parameter that the variants change.
      selected_evidence:
        snippet: has been debated in favor of alternative mechanisms, such as distribution of impermeable
          anionic charges
        supports: SUPPORT
