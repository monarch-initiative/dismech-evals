            term:
              id: MONDO:0014718
              label: developmental and epileptic encephalopathy, 34
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_kcc2_null_mouse_versus_human_partial_loss
        prompt: Do the Kcc2 knockout mouse models, which are perinatally lethal or die within weeks, model
          DEE34 faithfully, given that surviving human patients retain partial KCC2 transport activity
          and that the perinatal NKCC1-to-KCC2 switch occurs at a different relative developmental stage
          in mouse and human?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced KCC2-Mediated Chloride Extrusion
        - pathophysiology#Cortical Interneuron Subtype Imbalance
        rationale: 'Complete Kcc2 loss kills mice at birth, whereas every published human DEE34 genotype
          retains measurable residual chloride extrusion and the children survive into childhood. The
          mouse models therefore sit at a more severe point on the dose-response curve than the human
          disease. Independently, the developmental window matters: in human neocortex the shift from
          depolarizing to hyperpolarizing GABA reaches maturity around six months after birth, and mouse
          postnatal age does not map one-to-one onto that timeline. Any inference from knockout phenotypes
          to the timing or severity of human disease - including the interneuron subtype imbalance, which
          has been shown only in mouse - has to carry this caveat.'
        proposed_experiments:
        - experiment_id: exp_hypomorphic_knockin_allelic_series
          name: Graded Slc12a5 knock-in allelic series against the null phenotype
          description: Generate an allelic series of Slc12a5 knock-in mice carrying human DEE34 variants
            of graded residual transport activity, and compare seizure onset, survival, and cortical interneuron
            composition against the null, to establish how much of the null phenotype is an artefact of
            complete loss.
      selected_evidence:
        snippet: We show that KCC2 knockout mice died immediately after birth due to severe motor deficits
          that also abolished respiration.
        supports: SUPPORT
