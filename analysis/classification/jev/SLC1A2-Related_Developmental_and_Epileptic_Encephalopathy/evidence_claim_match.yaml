  a26a330174fff4ae5a291f9fd495f39ce36c351a5fd71d1bffc08be31990ff7c:
    claim:
      about:
        disease:
          name: SLC1A2-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: SLC1A2-related developmental and epileptic encephalopathy
            term:
              id: MONDO:0014916
              label: developmental and epileptic encephalopathy, 41
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_slc1a2_uptake_enhancer_versus_anion_channel_blocker
        prompt: Should therapy for SLC1A2-related DEE aim to INCREASE transporter expression or to BLOCK
          the mutant transporter's anion channel - and does the negative ceftriaxone trial discriminate
          between the two mechanisms, or merely reflect treating too late?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Astrocytic Glutamate Clearance
        - pathophysiology#Mutant EAAT2 Anion Pore Glutamate Efflux
        rationale: The two curated mechanistic models make opposite therapeutic predictions. The canonical
          transport-loss model says to raise EAAT2 expression; the anion-pore efflux model says raising
          expression of a glutamate-leaking mutant transporter could be neutral or harmful, and that a
          selective EAAT anion-channel antagonist is the rational agent. The only human therapeutic datum
          is a single 14-day ceftriaxone trial in one 20-month-old with Leu85Pro, which showed no change
          in spasm frequency. That result is consistent with the anion-pore model but is equally consistent
          with the authors' own alternative reading - that cumulative excitotoxic damage had already accrued
          by 20 months and that earlier initiation might succeed. With n=1, one variant, and a 14-day
          exposure, the trial cannot separate "wrong mechanism" from "right mechanism, too late". No EAAT
          anion-channel antagonist has been tested in this disorder at all.
        proposed_experiments:
        - experiment_id: exp_slc1a2_anion_channel_antagonist
          name: Anion-channel antagonist versus uptake enhancer, head to head
          description: Compare a selective EAAT anion-channel antagonist against an EAAT2 expression enhancer
            in variant-matched cellular and in vivo models, stratified by variant class (pore-lining Gly82Arg/Leu85Pro
            versus Pro289Arg), with treatment initiated both before and after the onset of excitotoxic
            structural change, so that mechanism and timing are separated.
          experiment_type:
            preferred_term: comparative pharmacological intervention study
          perturbations:
          - name: EAAT anion-channel blockade versus transporter upregulation
            target: pathophysiology#Mutant EAAT2 Anion Pore Glutamate Efflux
            description: Apply a selective EAAT anion-channel antagonist or an EAAT2-upregulating agent
              to variant-matched models at early and late time points.
          readouts:
          - name: Extracellular glutamate and seizure burden
            target: pathophysiology#Extracellular Glutamate Accumulation and Excitotoxicity
            biological_processes:
            - preferred_term: L-glutamate transmembrane transport
              term:
                id: GO:0015813
                label: L-glutamate transmembrane transport
      selected_evidence:
        snippet: Ceftriaxone therapy did not result in a significant change in the daily spasm count
        supports: SUPPORT
