        context: []
      assertion_type: Diagnosis
      assertion:
        name: SLC1A2 Molecular Diagnosis
        description: 'Diagnosis rests on identification of a heterozygous pathogenic SLC1A2 missense variant,
          typically de novo, in an infant with neonatal-onset refractory multifocal epilepsy. Because
          the pathogenic alleles are recurrent and confined to the trimerization domain, exome or epilepsy
          gene-panel sequencing is the practical route. Deep coverage of parental samples is worthwhile:
          low-level parental mosaicism has been detected at 5-6% allelic fraction in apparently de novo
          DEE cases and changes recurrence-risk counseling.'
      selected_evidence:
        snippet: We sought to identify additional pathogenic variants in a subset (n = 27) of these genes
          via targeted sequencing in an unsolved cohort of 531 individuals with a diverse range of EEs.
        supports: SUPPORT
