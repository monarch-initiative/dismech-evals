        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: The severe, classical form arises from a recurrent de novo heterozygous SLC1A2 missense
          variant acting in a dominant negative fashion on the trimeric transporter. Because simple heterozygous
          SLC1A2 deletion is not epileptogenic in humans or mice, the mode of inheritance here is dominant
          only by virtue of the dominant-negative protein effect, not by haploinsufficiency. Parental
          mosaicism at low allelic fraction has been documented in the Epi4K cohort and carries recurrence-risk
          counseling implications.
      selected_evidence:
        snippet: Recurrent de novo SLC1A2 missense variants cause a severe, early onset developmental
          and epileptic encephalopathy via an unclear mechanism.
        supports: SUPPORT
