  2bf28e74ceefea31ab15519de04983aa09015c1c58c352ad0e67f111500425f3:
    claim:
      about:
        disease:
          name: SLC1A2-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: SLC1A2-related developmental and epileptic encephalopathy
            term:
              id: MONDO:0014916
              label: developmental and epileptic encephalopathy, 41
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: anion_pore_glutamate_efflux_model
        hypothesis_label: Widened EAAT Anion Pore / Glutamate Efflux Gain-of-Function Model
        status: ALTERNATIVE
        description: 'A mechanistically distinct account, not merely a restatement of transport loss:
          because EAAT2 is also an anion channel, the pore-lining Gly82Arg and Leu85Pro substitutions
          widen the anion pore enough for L-glutamate itself to permeate, so the mutant transporter actively
          EXPORTS glutamate rather than only failing to import it. This is a gain of function and predicts
          a different therapy - selective EAAT anion-channel antagonists - whereas the canonical model
          predicts benefit from increasing transporter expression. The two models are not mutually exclusive
          and may operate in parallel for different variants; Pro289Arg shows the split directly, losing
          uptake while gaining anion current. Discriminating them clinically matters, because an uptake-enhancing
          agent would increase expression of a variant transporter that, under this model, leaks glutamate.
          An independent 18-patient, 13-variant cohort has since corroborated the model at the clinical
          level: individuals carrying Gly82Arg, Leu85Pro, Pro289Arg, or the further recurrent pore-lining
          variant Leu85Arg (all classified as "mixed loss-of-transport/gain-of-anion-channel function")
          had systematically more severe disease than individuals whose variants caused pure transport
          loss-of-function with no anion-current change, directly supporting anion-channel gain of function
          as a distinct, clinically material pathogenic contribution rather than a redundant description
          of transport loss.'
      selected_evidence:
        snippet: It does not only function as a secondary active glutamate transporter, but also as an
          anion channel.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34961934
      reference_title: Mutations associated with epileptic encephalopathy modify EAAT2 anion channel function.
      evidence_source: IN_VITRO
      explanation: Establishes the dual transporter/anion-channel nature of EAAT2 on which this alternative
        model depends.
