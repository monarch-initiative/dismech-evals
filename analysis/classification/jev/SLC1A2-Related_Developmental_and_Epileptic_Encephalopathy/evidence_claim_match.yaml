        conforms_to: epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony
        biological_scale: CELLULAR
        description: Sustained elevation of extracellular glutamate shifts cortical networks toward net
          excitation, prolonging and broadening neuronal excitation because the duration and extent of
          glutamatergic signaling is normally terminated by EAAT2 uptake. The resulting hyperexcitable,
          hypersynchronous state is the substrate for the multifocal and generalized epileptiform discharges
          seen on EEG. Notably, animal models show that this hyperexcitability coexists with reduced BASAL
          network activity, so the disorder is a dysregulation of excitability rather than a uniform increase.
        role: amplifier
        cell_types:
