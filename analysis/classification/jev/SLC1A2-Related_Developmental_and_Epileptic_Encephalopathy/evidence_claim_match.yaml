      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other genetic developmental and epileptic encephalopathies
        description: Neonatal-onset refractory multifocal epilepsy with severe developmental delay is
          genetically heterogeneous. In the same targeted-sequencing study that established SLC1A2, pathogenic
          variants in CACNA1A, GABRB3, ALG13, DNM1, GNAO1 and IQSEC2 were also identified in individuals
          with epileptic encephalopathy, and these are the practical differential on a gene panel. Distinguishing
          features favouring SLC1A2 are the recurrent trimerization-domain missense alleles and the initially
          normal MRI that later acquires delayed myelination and cortical atrophy.
      selected_evidence:
        snippet: We also identified EEs caused by genetic variants in ALG13, DNM1, and GNAO1 and report
          a mutation in IQSEC2.
