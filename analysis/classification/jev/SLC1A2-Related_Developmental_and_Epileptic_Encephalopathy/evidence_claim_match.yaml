          of life and only from around five months begins to show delayed myelination, thinning of the
          corpus callosum, and cerebral cortical atrophy. The initially normal imaging is mechanistically
          important: it argues that the structural abnormality is an acquired consequence of ongoing excitotoxicity
          rather than a primary malformation, and it defines a therapeutic window before injury accumulates.'
