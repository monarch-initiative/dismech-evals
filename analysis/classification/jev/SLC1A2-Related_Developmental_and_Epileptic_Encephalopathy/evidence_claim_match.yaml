          term:
            id: GO:0051260
            label: protein homooligomerization
          modifier: ABNORMAL
      selected_evidence:
        snippet: SLC1A2 is a trimeric transporter essential for clearing glutamate from neuronal synapses.
        supports: SUPPORT
