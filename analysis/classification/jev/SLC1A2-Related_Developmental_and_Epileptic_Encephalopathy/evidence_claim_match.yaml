        description: The initiating lesion is a heterozygous de novo missense substitution in SLC1A2,
          which encodes the trimeric glutamate transporter EAAT2 (GLT-1). All three recurrent disease
          variants - p.Gly82Arg, p.Leu85Pro and p.Pro289Arg - localize to the trimerization domain of
          the transporter rather than to the transport domain, so the primary molecular event is a defect
          of subunit assembly and trafficking within the obligate trimer rather than a simple catalytic-site
          lesion. This node captures the single molecular trigger.
        role: trigger
        gene:
          preferred_term: SLC1A2
