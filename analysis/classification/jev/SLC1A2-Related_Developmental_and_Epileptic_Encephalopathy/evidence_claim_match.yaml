            term:
              id: MONDO:0014916
              label: developmental and epileptic encephalopathy, 41
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative Suppression of Wild-Type EAAT2
        biological_scale: MOLECULAR
        description: 'Because EAAT2 functions as an obligate trimer, a trimerization-domain variant subunit
          co-assembles with wild-type subunits into mixed trimers and suppresses their function. The Leu85Pro
          variant reduces - but does not eliminate - wild-type SLC1A2 protein localization and transport
          activity, cutting glutamate transport by roughly a third relative to wild-type alone. This explains
          the central genotype paradox of the disorder: simple heterozygous loss of one SLC1A2 allele
          is not epileptogenic, so the dominant-negative effect is what pushes carriers below a critical
          threshold of functional transporter (inferred to lie somewhere between 0 and 50 percent of wild-type).'
        role: amplifier
        molecular_functions:
        - preferred_term: L-glutamate transmembrane transporter activity
          term:
            id: GO:0005313
            label: L-glutamate transmembrane transporter activity
          modifier: DECREASED
      selected_evidence:
        snippet: the Leu85Pro variant acts via a dominant negative mechanism to reduce, but not eliminate,
          wild-type SLC1A2 protein localization and function
        supports: SUPPORT
