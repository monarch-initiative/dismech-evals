        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mutant EAAT2 Anion Pore Glutamate Efflux
        biological_scale: MOLECULAR
        description: EAAT2 is not only a secondary active transporter but also an anion channel. The pore-lining
          Gly82Arg and Leu85Pro substitutions enlarge the anion pore enough to permit passage of L-glutamate
          itself, converting the mutant transporter into a glutamate EFFLUX pathway - a gain of function
          that adds to, rather than merely subtracts from, the uptake defect. Pro289Arg instead decreases
          uptake while increasing anion current. This arm predicts that selective EAAT anion-channel antagonists,
          not uptake enhancers, would be the rational therapy, and is modeled as a distinct mechanistic
          hypothesis.
        role: amplifier
        molecular_functions:
        - preferred_term: L-glutamate transmembrane transporter activity
          term:
            id: GO:0005313
            label: L-glutamate transmembrane transporter activity
          modifier: ABNORMAL
        biological_processes:
        - preferred_term: L-glutamate transmembrane transport
          term:
            id: GO:0015813
            label: L-glutamate transmembrane transport
          modifier: ABNORMAL
      selected_evidence:
        snippet: G82R and L85P exchange amino acid residues that contribute to the formation of the EAAT
          anion pore. They enlarge the pore diameter sufficiently to permit the passage of l-glutamate
          and thus function as l-glutamate efflux pathways.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
