  5a5b3b985758bf1745bf43bdb617f1f8772cb6da654c3e132d731660f30f2492:
    claim:
      about:
        disease:
          name: SLC1A2-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: SLC1A2-related developmental and epileptic encephalopathy
            term:
              id: MONDO:0014916
              label: developmental and epileptic encephalopathy, 41
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_slc1a2_heterozygous_null_models
        prompt: Why do heterozygous Slc1a2-null mice and humans with heterozygous SLC1A2 deletion have
          essentially no epilepsy phenotype, while humans heterozygous for a trimerization-domain missense
          allele have a lethal-grade developmental and epileptic encephalopathy - and does that make the
          available null models unsuitable for testing therapies aimed at this disorder?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Dominant-Negative Suppression of Wild-Type EAAT2
        - pathophysiology#SLC1A2 Trimerization-Domain Missense Variant
        rationale: 'The workhorse model for this pathway is the GLT-1 knockout mouse, which faithfully
          shows lethal spontaneous seizures from elevated brain glutamate - but only in the HOMOZYGOUS
          state. Heterozygous Slc1a2-deletion mice have no apparent clinical phenotype, and heterozygous
          SLC1A2 deletion in humans (WAGR syndrome) is only rarely epileptogenic. The human disease, by
          contrast, is heterozygous. The reconciling proposal is a critical dosage threshold between 0
          and 50 percent of wild-type transporter that a deletion does not cross but a dominant-negative
          missense allele does. That proposal is inferred rather than measured, and it has a direct translational
          consequence: a homozygous-null mouse models an allelic state no patient has, so a therapy that
          rescues it may not rescue a mixed wild-type/dominant-negative trimer population, and vice versa.
          Variant knock-in mice exist but their reported readout is a "hyperactive phenotype", not the
          human refractory multifocal epilepsy, so phenotypic fidelity at the disease level remains unestablished.'
        proposed_experiments:
        - experiment_id: exp_slc1a2_dominant_negative_dosage_threshold
          experiment_design: TARGETED_PERTURBATION
          name: Allele-matched dosage-threshold titration
          description: Titrate the ratio of functional to dominant-negative EAAT2 in an allele-matched
            in vivo model (variant knock-in rather than null) and determine the residual-transporter fraction
            at which epileptiform activity appears, testing directly whether the proposed 0-50 percent
            critical threshold is real and whether heterozygous knock-in animals reproduce the human seizure
            phenotype rather than only hyperactivity.
          experiment_type:
            preferred_term: allele-matched in vivo dosage titration
          perturbations:
          - name: Graded dominant-negative EAAT2 expression
            target: pathophysiology#Dominant-Negative Suppression of Wild-Type EAAT2
            genes:
            - preferred_term: SLC1A2
              term:
                id: hgnc:10940
                label: SLC1A2
            description: Vary the dose of the Leu85Pro allele relative to wild-type SLC1A2 across an allelic
              series in vivo.
          readouts:
          - name: Residual glutamate uptake and epileptiform activity
            target: pathophysiology#Impaired Astrocytic Glutamate Clearance
            biological_processes:
            - preferred_term: glutamate reuptake
              term:
                id: GO:0051935
                label: glutamate reuptake
      selected_evidence:
        snippet: Furthermore, knock-in mice with disease-associated variants showed a hyperactive phenotype
          accompanied by reduced glutamate transporter expression.
        supports: SUPPORT
        directness: INDIRECT
