            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        notes: 'Three recurrent heterozygous missense variants account for the reported dominant cases:
          p.Gly82Arg, p.Leu85Pro (c.254T>C) and p.Pro289Arg. All three fall in the trimerization domain.
          Mechanistically they are not equivalent: Gly82Arg and Leu85Pro line the EAAT anion pore and
          widen it enough to make the transporter a glutamate efflux pathway, while Pro289Arg reduces
          uptake and raises anion current without that pore geometry change. Simple heterozygous SLC1A2
          deletion - as occurs in WAGR syndrome - is only rarely associated with epilepsy, so haploinsufficiency
          alone does not explain the phenotype and variant interpretation should not treat SLC1A2 truncating
          variants as equivalent to these missense alleles. An independent multi-center cohort has since
          reported a fourth pore-lining, anion-pore-efflux variant, p.Leu85Arg, with the same "mixed loss-of-transport/gain-of-anion-channel
          function" molecular phenotype as Gly82Arg and Leu85Pro, alongside other SLC1A2 variants that
          cause pure loss-of-function or mild gain-of-anion-channel-function phenotypes without efflux;
          those additional variants are not curated here individually because case-level phenotype detail
          comparable to the recurrent dominant alleles above is not yet available for them.'
