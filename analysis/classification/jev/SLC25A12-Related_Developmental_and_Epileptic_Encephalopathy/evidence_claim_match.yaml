        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hyperexcitability_in_an_energy_deficient_state
        prompt: How does a disorder whose central defect is reduced neuronal energy supply produce hyperexcitability
          and refractory seizures, rather than the depressed excitability that an energy deficit would
          naively predict?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Activity-Dependent Neuronal Respiration
        - pathophysiology#Neuronal Hyperexcitability and Seizure Generation
        rationale: 'This is the substantive puzzle of the disorder and the entry does not resolve it.
          Several contributors are proposed - reduced activity-dependent ATP supply, disturbed glutamate-glutamine
          cycling, loss of the astrocyte-neuron lactate shuttle''s protective role - but none has been
          shown to be sufficient, and their relative weights are unknown. The paradox is not unique to
          AGC1 deficiency; it recurs across metabolic encephalopathies, which suggests a general principle
          is missing rather than a disorder-specific detail. Note that the causal edges into the hyperexcitability
          node are typed INDIRECT_UNKNOWN_INTERMEDIATES precisely because of this: the endpoints are evidenced
          and the path between them is not.'
        proposed_experiments:
        - experiment_id: exp_dissect_excitability_contributors
          experiment_design: TARGETED_PERTURBATION
          name: Dissect the contributors to hyperexcitability in aralar-deficient cortex
          description: In aralar-knockout cortical slices, separately restore each candidate arm - supply
            exogenous pyruvate to bypass the redox block, supply glutamine to bypass the astroglial synthesis
            failure, and supply lactate to restore the shuttle - and measure epileptiform discharge threshold
            and duration after each, to establish which contributor is rate-limiting for the excitability
            phenotype rather than merely present.
      selected_evidence:
        snippet: Herein, we discuss the role of the AGC1/Aralar-MAS pathway in neuronal functions such
          as Asp and NAA synthesis, lactate use, respiration on glucose, glutamate (Glu) oxidation and
          other neurometabolic aspects.
        supports: SUPPORT
