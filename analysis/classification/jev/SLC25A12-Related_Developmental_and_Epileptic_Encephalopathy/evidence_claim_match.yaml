      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_knockout_mouse_versus_hypomorphic_patients
        prompt: Does the complete aralar knockout mouse represent human AGC1 deficiency faithfully, given
          that reported patients retain measurable residual carrier activity and that the knockout cannot
          distinguish neuronal from glial origins of the glial phenotypes?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Astroglial Glutamine Synthesis
        - pathophysiology#Nigrostriatal Dopaminergic Dysfunction
        rationale: The knockout mouse is described as extensively recapitulating the human disease, and
          it is the source of most of what is curated here about the astroglial and dopaminergic arms.
          Two caveats limit how far that transfers. First, it is a complete null while human variants
          span from abolished activity to about 15% of wild type, so the model sits at the severe end
          of a range that patients occupy unevenly - and the p.Arg353Gln children were not obviously milder,
          which is itself unexplained. Second, and more consequentially for this entry, a constitutive
          whole-animal knockout removes aralar from every expressing cell at once, so it cannot in principle
          distinguish a glial defect secondary to neuronal dysfunction from a cell-autonomous one. That
          is exactly the distinction the hypomyelination controversy turns on, which means the model that
          supplies most of the mechanism is structurally unable to settle the disorder's central question.
        proposed_experiments:
        - experiment_id: exp_hypomorphic_knockin_allelic_series_agc1
          experiment_design: TARGETED_PERTURBATION
          name: Hypomorphic Slc25a12 knock-in series against the null
          description: Generate knock-in mice carrying the human p.Arg353Gln allele, which retains about
            15% activity, alongside the existing null, and compare brain aspartate and NAA, myelination,
            astroglial glutamine synthesis, and seizure burden, to establish how much of the null phenotype
            requires complete loss and whether 15% residual activity is protective for any arm.
      selected_evidence:
        snippet: Recombinant mutant p.Arg353Gln AGC1 activity was reduced to 15% of wild type.
        supports: SUPPORT
