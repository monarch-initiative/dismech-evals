  69853efc9747c002738ca6e6ac74aaf3319584846c25c8e89deae429a0525b63:
    claim:
      about:
        disease:
          name: SLC25A12-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 39
            term:
              id: MONDO:0013056
              label: developmental and epileptic encephalopathy, 39
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_primary_versus_secondary_hypomyelination
        prompt: Is the hypomyelination in AGC1 deficiency a primary oligodendrocyte disease caused by
          loss of the NAA-derived acetyl-group supply, or is it a leuko-axonopathy - white matter abnormality
          secondary to a primary neuronal defect?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced Acetyl-Group Supply to Oligodendrocytes
        - pathophysiology#Global Cerebral Hypomyelination
        rationale: 'The mechanism curated here runs neuron to oligodendrocyte: aspartate depletion reduces
          NAA, NAA carries acetyl groups to oligodendrocytes, myelin lipid synthesis suffers. That chain
          is well motivated but the disagreement is explicit in the literature, and longitudinal imaging
          is what forces it. The oldest reported patient showed early hypomyelination followed by subsequent
          progression of myelination, which the authors read as characteristic of a leuko-axonopathy -
          a white matter abnormality arising from a primary neuronal defect - rather than of an oligodendrocyte
          disease, because a primary myelinating-cell defect would not be expected to catch up over time.
          The review literature is careful to leave both open, noting the glial deficits may be a consequence
          of neuronal affectation or a direct effect in glial cells. Two things hang on it: whether a
          therapy should target neuronal metabolism or oligodendrocyte substrate supply, and whether the
          white matter finding should be read prognostically as static or improvable.'
        proposed_experiments:
        - experiment_id: exp_celltype_restricted_aralar_deletion
          name: Neuron-restricted versus oligodendrocyte-restricted aralar deletion
          description: Compare conditional Slc25a12 deletion restricted to neurons against deletion restricted
            to the oligodendrocyte lineage, scoring myelin thickness, oligodendrocyte maturation, and
            brain NAA in each, to establish whether the myelin deficit requires the neuronal lesion or
            can arise cell-autonomously in glia. A neuron-restricted deletion that reproduces the full
            myelin phenotype would settle the question in favour of the leuko-axonopathy reading.
      selected_evidence:
        snippet: there has been discussion in the literature as to whether this hypomyelination is primary
          or secondary to a neuronal defect
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
