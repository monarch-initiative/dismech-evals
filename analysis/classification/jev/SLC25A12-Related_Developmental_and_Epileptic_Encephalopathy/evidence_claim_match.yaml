            term:
              id: MONDO:0013056
              label: developmental and epileptic encephalopathy, 39
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ketogenic_diet_mechanism_and_generality
        prompt: Does the ketogenic diet work in AGC1 deficiency because ketone bodies bypass the cytosolic
          NADH load that the failed malate-aspartate shuttle cannot clear, and if so should it be first-line
          rather than a late option after conventional agents fail?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Malate-Aspartate Shuttle Failure
        - pathophysiology#Infantile-Onset Epilepsy
        rationale: 'The reported ketogenic-diet response is striking - seizure frequency abated drastically
          - and there is a clean mechanistic rationale, since ketone body oxidation does not generate
          the cytosolic NADH that the shuttle would normally clear. The same logic explains why pyruvate
          rescues respiration in the model systems, and the mechanism has since been tested directly with
          the diet''s own active metabolite: beta-hydroxybutyrate restores basal and glutamate-stimulated
          respiration in aralar-KO neurons, and the rescue requires the ketone body to enter the neuron.
          So the mechanistic arm is no longer only an inference from biochemistry. What remains open is
          the translation: the clinical evidence is still individual case reports, the mechanism has not
          been demonstrated in patients, and no series compares early to late initiation. If the mechanistic
          account holds, the diet is not a generic anti-seizure measure here but a targeted metabolic
          bypass, which would argue for offering it at diagnosis rather than after conventional agents
          have failed - a materially different clinical posture from the one the current evidence supports.'
        proposed_experiments:
        - experiment_id: exp_ketogenic_timing_registry
          experiment_design: HUMAN_OBSERVATIONAL
          name: Registry comparison of early versus late ketogenic diet initiation
          description: Assemble the reported and newly ascertained AGC1-deficient patients into a registry
            recording time from diagnosis to ketogenic diet initiation, seizure outcome, and developmental
            trajectory, and pair it with measurement of brain NAA and lactate on the diet, to test both
            whether earlier initiation improves outcome and whether the diet shifts the metabolic markers
            the mechanism predicts it should.
      selected_evidence:
        snippet: Patient's seizure frequency abated drastically following initiation of ketogenic diet.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
