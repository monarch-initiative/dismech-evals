  c0fe5243b803d7ea5d130f65b0124c69a5a986d0d88ea3ee2b798b153ebf69e0:
    claim:
      about:
        disease:
          name: SLC25A12-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 39
            term:
              id: MONDO:0013056
              label: developmental and epileptic encephalopathy, 39
        context: []
      assertion_type: Treatment
      assertion:
        name: Ketogenic Diet
        description: 'Seizure frequency abated drastically following initiation of the ketogenic diet
          in a reported case. The rationale is mechanistically apt: ketone bodies are metabolized without
          generating the cytosolic NADH load that the failed malate-aspartate shuttle cannot clear, so
          the diet routes around the specific defect rather than merely suppressing excitability. The
          response should not be read as uniform: the published clinical evidence is a small number of
          individual reports, and no series establishes what fraction of patients benefit or by how much.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Dietary Intervention
          term:
            id: NCIT:C15447
            label: Dietary Intervention
        notes: 'Efficacy here rests on single-patient reports, so the striking response recorded above
          is the best-documented outcome rather than a typical one. Cohort data described in the deep-research
          artifact for this entry suggest the response is heterogeneous, with some children deriving modest
          or no benefit, but that source could not be resolved to a citable publication and so is deliberately
          not curated as evidence. The gap is recorded rather than filled: a case series reporting the
          distribution of responses is the missing observation, and it is the same gap the gap_ketogenic_diet_mechanism_and_generality
          discussion turns on.'
      selected_evidence:
        snippet: Our report also provides evidence regarding beneficial effect of ketogenic diet in this
          rare neurometabolic epilepsy.
        supports: SUPPORT
