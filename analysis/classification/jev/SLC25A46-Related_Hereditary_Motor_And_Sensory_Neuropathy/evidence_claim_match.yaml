          fidelity: MODERATE
          model_scale: CELLULAR
          description: Gene replacement normalised mitochondrial morphology in both central and peripheral
            nervous tissue, which is the cellular node this arm reverses.
          limitations: A rescue in a constitutive null mouse treated systemically; it does not show that
            restoring the gene would help a patient whose partially functional protein has already permitted
            decades of axonal loss.
          divergences:
