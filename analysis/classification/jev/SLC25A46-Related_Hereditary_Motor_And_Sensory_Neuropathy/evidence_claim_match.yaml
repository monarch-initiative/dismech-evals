          cell axons reaching the tectum, shorter motor axon tracts, and motor terminals showing blebbing
          and dying back.
        publication: PMID:26168012
        genes:
        - preferred_term: SLC25A46
          term:
            id: hgnc:25198
            label: SLC25A46
        modeled_mechanisms:
        - target: Distal Axonal Degeneration of Long Peripheral Nerves
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: CELLULAR
          description: Dying-back degeneration at motor neuron terminals, consistent with CMT2 pathology.
          limitations: A transient morpholino knockdown in a developing embryo, so it reports failure
            of axon growth and early maintenance rather than the adult length-dependent degeneration of
            a long human nerve. A later stable zebrafish mutant was found to undergo genetic compensation,
            which is a further caveat on knockdown results in this species.
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: The model has no long adult peripheral nerve, so length-dependent vulnerability,
              the defining feature of this node, is outside its boundary.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Morpholino knockdown is transient and incomplete, so the model represents partial
              developmental depletion rather than the biallelic germline lesion.
      selected_evidence:
        snippet: Loss of function in cultured cells and in zebrafish unexpectedly leads to increased mitochondrial
          connectivity, while severely affecting the development and maintenance of neurons in the fish.
        supports: SUPPORT
