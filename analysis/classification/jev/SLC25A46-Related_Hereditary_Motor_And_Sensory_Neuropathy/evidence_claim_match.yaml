  371ccc2a3163d165d0ece1ecbe0bbbdfec85f987ce4e5f8947860ea68c0d34ea:
    claim:
      about:
        disease:
          name: SLC25A46-Related Hereditary Motor And Sensory Neuropathy
          disease_term:
            preferred_term: neuropathy, hereditary motor and sensory, type 6B
            term:
              id: MONDO:0014671
              label: neuropathy, hereditary motor and sensory, type 6B
        context: []
      assertion_type: Phenotype
      assertion:
        name: Decreased compound muscle action potential amplitude
        category: Neurologic
        description: 'Conduction studies show an axonal rather than demyelinating pattern in patients:
          motor and sensory amplitudes fall, with responses lost altogether in the longest nerves, while
          conduction velocities are mostly preserved. Mostly, not entirely, because slowing has been reported
          in individual nerves of an affected sibling. The knockout mouse, by contrast, shows degeneration
          together with demyelination, which is one of the ways the model is more severe than the human
          disease.'
        phenotype_term:
          preferred_term: Decreased compound muscle action potential amplitude
          term:
            id: HP:0033383
            label: Decreased compound muscle action potential amplitude
        notes: Bound to an amplitude term rather than to a nerve-conduction-velocity term. The human electrophysiology
          is an axonal pattern, in which amplitudes fall and velocities are relatively preserved, so any
          velocity term would either misstate the finding (Decreased motor nerve conduction velocity,
          HP:0003431) or say almost nothing (the parent Abnormal nerve conduction velocity, HP:0040129).
          Amplitude is what the axonal pattern actually changes.
      selected_evidence:
        snippet: A nerve conduction study showed reduced amplitude in median nerves, loss of response
          in sural nerves, and severely reduced and no certain motor response in right and left tibial
          nerves.
        supports: SUPPORT
        directness: DIRECT
