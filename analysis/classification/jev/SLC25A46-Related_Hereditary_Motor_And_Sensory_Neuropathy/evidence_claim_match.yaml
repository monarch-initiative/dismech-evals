      assertion_type: Discussion
      assertion:
        discussion_id: slc25a46_tissue_selectivity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do retinal ganglion cells, long peripheral axons and Purkinje cells degenerate when
          SLC25A46 is lost, while the ubiquitously expressed protein leaves most tissues clinically unaffected?
        rationale: 'The protein is expressed broadly and its interactome spans OXPHOS complexes, adenine
          nucleotide translocases, MICOS subunits and ER contact-site components in cerebellum, cerebrum,
          heart and thymus alike. Yet the disease is almost entirely neurological, and within the nervous
          system it picks out three cell populations. Transcript enrichment in retinal ganglion cells
          is part of the answer but cannot be the whole of it, since Purkinje cells and long peripheral
          axons are hit without a comparable enrichment claim. The plausible explanation is that these
          cells have the longest or most trafficking-dependent processes and the least metabolic reserve,
          so they are the first to fail when organelle delivery and cristae integrity degrade together.
          That remains a hypothesis: no study has compared the threshold for degeneration across cell
          types in the same system. The mouse models also report a lymphoid phenotype and neuromuscular
          junction abnormalities that have no recognised clinical counterpart in patients, which sharpens
          rather than resolves the question.'
        attaches_to:
        - pathophysiology#Respiratory Chain Deficiency and Bioenergetic Failure
        - pathophysiology#Impaired Mitochondrial Transport and Distribution in Neuronal Processes
        posed_by: 'dismech curation (issue #16350)'
        posed_date: '2026-11-03T00:00:00Z'
      selected_evidence:
        snippet: Tissue-specific co-immunoprecipitated proteins were enriched for synapse annotated proteins
          in the cerebellum and cerebrum for metabolic processes in the heart and for nuclear processes
          and proteasome in the thymus.
        supports: SUPPORT
