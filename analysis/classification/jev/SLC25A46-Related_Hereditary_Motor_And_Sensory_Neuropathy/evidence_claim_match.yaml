      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Mitochondrial Network Morphology
        description: Patient fibroblasts carry a hyper-filamentous, interconnected network, and mitochondria
          are hyperfused in cells expressing pathogenic variants. Electron microscopy shows constriction
          sites that look like stalled fission intermediates, so the elongation reflects delayed division
          rather than a faster fusion rate.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: mitochondrion organization
          term:
            id: GO:0007005
            label: mitochondrion organization
          modifier: ABNORMAL
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        notes: The direction of the morphological change is not uniform across models. Patient-derived
          cells and pathogenic missense variants give hyperfusion, whereas a complete knockout cell line
          gives fragmentation, and the worm mutants fragment as well. This is the observational face of
          the unresolved fission-versus-fusion question recorded in the discussions section.
      selected_evidence:
        snippet: Mitochondria were fragmented in the knock-out cell line and hyperfused in all pathogenic
          variants.
        supports: SUPPORT
