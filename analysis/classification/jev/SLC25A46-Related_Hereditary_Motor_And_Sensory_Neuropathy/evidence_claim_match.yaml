              label: neuropathy, hereditary motor and sensory, type 6B
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: slc25a46_fission_or_fusion
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does SLC25A46 promote mitochondrial fission or mitochondrial fusion, and which direction
          of imbalance actually drives neurodegeneration in patients?
        rationale: 'This entry''s causal chain runs through loss of fission and a shift toward MFN1/MFN2-mediated
          hyperfusion, which is what patient fibroblasts and pathogenic missense variants show. But the
          primary literature does not agree on the protein''s direction of action, and the disagreement
          is explicit rather than apparent. The founding study concluded that SLC25A46 acts pro-fission
          and found no interaction with MFN2 or OPA1, only with mitofilin. Subsequent work reported direct
          interactions with both fusion GTPases and mapped the interfaces. Morphology does not settle
          it either: knockdown and pathogenic variants give hyperfusion, whereas a complete knockout cell
          line gives fragmentation, and the C. elegans orthologue behaves as a fusion factor whose phenotype
          is suppressed by loss of the fission factor drp-1 and rescued by overexpressing the mitofusin
          orthologue. A resource that asserts a single direction without recording the disagreement would
          overstate what is known, and the direction matters because it determines whether a therapeutic
          strategy should push the balance toward fission or toward fusion.'
        attaches_to:
        - pathophysiology#Loss of SLC25A46 at Mitochondrial Fission and Fusion Sites
        - pathophysiology#Dysregulated MFN1/MFN2 and OPA1 Oligomerization
        - pathophysiology#Aberrant Mitochondrial Network Morphology
        posed_by: 'dismech curation (issue #16350)'
        posed_date: '2026-11-03T00:00:00Z'
      selected_evidence:
        snippet: Disease model worms carrying mutations associated with SLC25A46 exhibited mitochondrial
          fragmentation and accelerated neurodegeneration, suggesting that slc-25A46 maintains neuronal
          morphology through regulating mitochondrial fusion regulation.
        supports: REFUTE
