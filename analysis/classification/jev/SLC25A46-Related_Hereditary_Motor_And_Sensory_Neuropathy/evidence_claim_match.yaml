              label: neuropathy, hereditary motor and sensory, type 6B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Destabilization and Proteasomal Degradation of SLC25A46
        description: Destabilising variants are ubiquitylated at the outer membrane by the E3 ligases
          MULAN and MARCH5 and extracted and degraded by p97 and the proteasome. This proteolysis runs
          independently of mitophagy and of apoptotic outer-membrane stress pathways, so the protein is
          removed without the organelle being turned over.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: proteasomal degradation of mutant SLC25A46
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
          modifier: INCREASED
        notes: The allele characterised in this pathway, L341P, is one that causes the severe pontocerebellar
          hypoplasia end of the spectrum rather than this entry's phenotype. The degradation route is
          cited here as the general mechanism by which a destabilising SLC25A46 missense allele is cleared;
          the severity that follows depends on how much protein a given genotype leaves.
      selected_evidence:
        snippet: The E3 ubiquitin ligases MULAN and MARCH5 coordinate ubiquitylation of SLC25A46 L341P,
          leading to degradation by organized activities of P97 and the proteasome.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
