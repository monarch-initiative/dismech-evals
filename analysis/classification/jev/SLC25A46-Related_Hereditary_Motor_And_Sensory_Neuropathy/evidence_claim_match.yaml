            term:
              id: MONDO:0014671
              label: neuropathy, hereditary motor and sensory, type 6B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of SLC25A46 at Mitochondrial Fission and Fusion Sites
        description: 'SLC25A46 normally occupies discrete foci at mitochondrial branch points and tube
          tips together with DRP1 and OPA1, and essentially every fission or fusion event is marked by
          such a focus. It is a hub in three complexes at once: with the fusion GTPases MFN1, MFN2 and
          OPA1, with the MICOS cristae-organising complex through MIC60, and with the ER membrane protein
          complex at ER-mitochondria contacts. Losing it therefore disrupts dynamics, cristae and lipid
          handling together rather than one at a time.'
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: mitochondrial fission
          term:
            id: GO:0000266
            label: mitochondrial fission
          modifier: DECREASED
        cellular_components:
        - preferred_term: mitochondrial outer membrane
          term:
            id: GO:0005741
            label: mitochondrial outer membrane
      selected_evidence:
        snippet: SLC25A46 was present in discrete puncta at mitochondrial branch points and tips of mitochondrial
          tubules, co-localizing with DRP1 and OPA1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36977595
