        notes: SLC25A46 at 5q22.1 encodes the outer mitochondrial membrane protein that is the sole cause
          of this disease. Reported alleles are predominantly missense, with nonsense, frameshift and
          splice variants and exonic deletions also described; the truncating and deletion alleles cluster
          at the lethal end of the spectrum rather than in this phenotype. No modifier genes, susceptibility
          loci or founder alleles are established. Many reported families are consanguineous, which is
          how most homozygous genotypes arose rather than a separate risk mechanism.
      selected_evidence:
        snippet: By whole-exome sequencing of patients with optic atrophy and CMT2, we identified four
          families with recessive mutations in SLC25A46.
