              label: neuropathy, hereditary motor and sensory, type 6B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic SLC25A46 Loss of Function
        description: Homozygous or compound heterozygous SLC25A46 variants remove or cripple a highly
          derived SLC25-family protein of the outer mitochondrial membrane. The protein has no identified
          transported substrate and is the closest human relative of yeast Ugo1, an adaptor of the fusion
          machinery, so the lesion is a loss of structural organisation of mitochondrial membrane dynamics
          rather than loss of a transport activity.
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        genes:
        - preferred_term: SLC25A46
          term:
            id: hgnc:25198
            label: SLC25A46
        cellular_components:
        - preferred_term: mitochondrial outer membrane
          term:
            id: GO:0005741
            label: mitochondrial outer membrane
        molecular_functions:
        - preferred_term: adaptor binding to the mitochondrial fusion and MICOS complexes
          term:
            id: GO:0044877
            label: protein-containing complex binding
          modifier: DECREASED
      selected_evidence:
        snippet: We demonstrate that SLC25A46, like Ugo1, is a modified carrier protein that has been
          recruited to the outer mitochondrial membrane and interacts with the inner membrane remodeling
          protein mitofilin (Fcj1).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
