        prompt: Beyond the reported dominant-negative p.R507W family, what is the penetrance and mutational
          spectrum of SLC26A6-related hyperoxaluria and nephrolithiasis?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Dominant-Negative SLC26A6 Oxalate Transporter Dysfunction
        rationale: A newer family supports a rare dominant-negative disease mechanism, but an earlier
          cohort found that SLC26A6 was not the monogenic cause of their non-PH1/PH2 hyperoxaluria cohort
          and that identified common variants had no significant effect on oxalate excretion. Additional
          families are needed to define the disease boundary and penetrance.
      selected_evidence:
        snippet: SLC26A6 was effectively ruled out as the disease gene in this non-PH1/PH2 cohort.
        supports: SUPPORT
