          name: SLC26A6-Related Hyperoxaluria and Nephrolithiasis
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC26A6
        gene_term:
          preferred_term: SLC26A6
          term:
            id: hgnc:14472
            label: SLC26A6
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Solute carrier family 26 member 6 (PAT1/CFEX), an apical epithelial chloride/oxalate, chloride/bicarbonate
          and sulfate anion exchanger that mediates intestinal oxalate secretion. A single family carries
          the heterozygous dominant-negative missense variant c.1519C>T p.R507W; earlier cohort screening
          did not support SLC26A6 as a common monogenic cause of hyperoxaluria. No ClinGen gene-disease
          validity assertion exists for SLC26A6.
      selected_evidence:
        snippet: We identified a rare heterozygous missense mutation (c.1519C>T/p.R507W) in the SLC26A6
          gene that encodes a secretory oxalate transporter.
        supports: SUPPORT
