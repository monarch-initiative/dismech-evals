      assertion_type: Pathophysiology
      assertion:
        name: Golgi CMP-Sialic Acid Donor Depletion
        description: The Golgi lumen is deprived of CMP-Neu5Ac, the activated donor every sialyltransferase
          requires. Cytosolic sialic acid synthesis is unaffected, so the cell is not short of sialic
          acid; it is short of sialic acid in the compartment where it is used. That distinction is what
          makes dietary sialic acid an ineffective strategy here.
        biological_scale: MOLECULAR
        cellular_components:
        - preferred_term: Golgi membrane
          term:
            id: GO:0000139
            label: Golgi membrane
      selected_evidence:
        snippet: Slc35a1 encodes the cytidine-5'-monophosphate (CMP)-sialic acid transporter that transports
          CMP-sialic acid from the cytoplasm into the Golgi apparatus for sialylation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32303557
      reference_title: Slc35a1 deficiency causes thrombocytopenia due to impaired megakaryocytopoiesis
        and excessive platelet clearance in the liver.
      evidence_source: OTHER
      quote_role: BACKGROUND
      explanation: 'States the transported species and its destination compartment, which is what this
        node claims is depleted. Marked BACKGROUND because the sentence opens the mouse study''s abstract
        as a statement of what the gene encodes, not as one of its results. Graded OTHER rather than MODEL_ORGANISM
        for the same reason: no animal experiment established what the transporter carries, so MODEL_ORGANISM
        would assert that this mouse study measured it. IN_VITRO is not used either, because the cited
        paper does not say where the fact was established and this entry does not grade a source on unstated
        provenance.'
