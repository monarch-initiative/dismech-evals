              label: SLC35A1-congenital disorder of glycosylation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Global Hyposialylation of Glycoconjugates
        description: Without the donor, sialyltransferases cannot cap glycans, and N-glycans, O-glycans
          and glycolipids across the cell are left without their terminal sialic acid. The p.Glu196Lys
          allele adds a second route to the same endpoint by decoupling the transporter from the sialyltransferase
          ST3Gal4.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: sialylation
          term:
            id: GO:0097503
            label: sialylation
          modifier: DECREASED
      selected_evidence:
        snippet: We showed that SLC35A1 associates with ST3Gal4, the main α2,3-sialyltransferase acting
          on N-glycans. This phenomenon is compromised by the E196K (but not T156R) mutation in the SLC35A1
          gene.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
