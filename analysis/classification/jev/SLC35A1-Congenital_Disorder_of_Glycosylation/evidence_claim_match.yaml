          classified_by: CLINGEN
          external_id: CGGV:assertion_bcf914f4-348a-43a5-95f3-64770b9f531c-2025-11-17T170000.000Z
        notes: 'Encodes the only known Golgi CMP-sialic acid transporter, a multipass nucleotide-sugar
          transporter of the SLC35 family. Reported disease alleles across the three proven patients are
          the index patient''s pair, homozygous p.Gln101His in the second, and p.Thr156Arg with p.Glu196Lys
          in the third. Structure-guided mutagenesis has mapped three substrate pockets in the central
          cavity, which is the framework in which missense alleles'' effects on transport are interpreted.

          One caveat on the index genotype: later work found that one of the two variants reported in
          2005 is very likely benign, having been seen homozygous in at least six unrelated healthy individuals.
          The index patient''s molecular diagnosis therefore rests on less than the original report implies,
          and this entry does not treat that genotype as an established truncating pair.'
      selected_evidence:
        snippet: No complementation was obtained with either of the 2 patient alleles, whereas full restoration
          of the sialylated phenotype was obtained in the Lec2 cells transfected with the corresponding
          human wild-type transcript.
        supports: SUPPORT
