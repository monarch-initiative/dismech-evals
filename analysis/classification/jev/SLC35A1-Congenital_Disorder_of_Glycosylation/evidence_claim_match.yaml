      assertion_type: Pathophysiology
      assertion:
        name: Platelet Desialylation and Hepatic Clearance
        description: Loss of terminal sialic acid on platelet surface glycoproteins exposes the subterminal
          galactose that hepatic clearance receptors recognise, so circulating platelets are removed by
          the liver. In the conditional mouse the clearing cells are hepatic Kupffer cells. The hepatocyte
          Ashwell-Morell receptor route is established for desialylated platelets in immune thrombocytopenia
          and is the mechanism generally invoked here; it has not been shown directly in SLC35A1-CDG,
          so the evidence for that step is marked indirect.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        - preferred_term: Kupffer cell
          term:
            id: CL:0000091
            label: Kupffer cell
      selected_evidence:
        snippet: In addition, an increased number of desialylated platelets was cleared by Küpffer cells
          in the liver of Plt Slc35a1–/– mice.
        supports: SUPPORT
