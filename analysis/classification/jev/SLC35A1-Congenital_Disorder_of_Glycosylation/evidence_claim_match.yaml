      assertion_type: Treatment
      assertion:
        name: Sialidase Inhibition
        description: A candidate strategy, not a treatment. Because the thrombocytopenia is driven in
          part by clearance of desialylated platelets, inhibiting the sialidase that strips the sialic
          acid is mechanistically rational. Sialidase inhibitors improved antibody-mediated thrombocytopenia
          in mice, but that was in immune thrombocytopenia, where the desialylation is enzymatic and reversible.
          In SLC35A1-CDG the platelets were never sialylated in the first place, so it is not obvious
          that blocking a sialidase would help. It has never been tested in this disorder.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: sialidase inhibitors ameliorate anti-GPIbα-mediated thrombocytopenia in mice
        supports: SUPPORT
        directness: INDIRECT
