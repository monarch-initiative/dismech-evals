          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Impaired Neuronal Glucose Transport
        description: Reduced SLC45A1 glucose transport activity is proposed to impair glucose uptake into
          neural cells, analogous to the mechanism of GLUT1 (SLC2A1) deficiency, the only other known
          cerebral glucose transporter disorder.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: Glucose transport across the blood brain barrier and into neural cells is critical for
          normal cerebral physiologic function. Dysfunction of the cerebral glucose transporter GLUT1
          (encoded by SLC2A1) is known to result in epilepsy, intellectual disability (ID), and movement
          disorder.
        supports: SUPPORT
