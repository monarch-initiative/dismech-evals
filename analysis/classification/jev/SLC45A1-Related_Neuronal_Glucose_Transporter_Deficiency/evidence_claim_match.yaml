              protein, a cerebral glucose transporter expressed in the developing and adult brain (cortex
              and cerebellum). Missense variants tested in transfected COS-7/COS7 cells show substantially
              reduced intracellular glucose transport activity relative to wild-type SLC45A1, in one case
              attributable to failure of the mutant protein to localize correctly to the cytomembrane.
            genes:
