      assertion_type: Subtype
      assertion:
        name: COMNB
        display_name: Childhood-onset biotin-responsive peripheral motor neuropathy (COMNB)
        subtype_term:
          preferred_term: peripheral motor neuropathy, childhood-onset, biotin-responsive
          term:
            id: MONDO:0859255
            label: peripheral motor neuropathy, childhood-onset, biotin-responsive
        description: The mild end of the spectrum. After normal early development, distal upper limb weakness
          with thenar, hypothenar and interosseous wasting begins at about 6 to 13 years, sometimes with
          distal leg weakness, absent ankle reflexes and gait difficulty. Nerve conduction findings are
          pleomorphic, with axonal and demyelinating features and sometimes asymmetry. The recurrent homozygous
          missense allele p.(Ser429Gly) accounts for most reported cases. A few patients also had dilated
          cardiomyopathy, premature hair graying or mild cerebellar and pyramidal signs.
      selected_evidence:
        snippet: We expand the phenotypic spectrum associated with biallelic SLC5A6 variants affecting
          function by reporting five individuals from three families with motor neuropathies.
        supports: SUPPORT
