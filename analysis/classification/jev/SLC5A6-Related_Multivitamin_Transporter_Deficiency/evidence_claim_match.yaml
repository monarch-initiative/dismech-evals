            label: neurodegeneration, infantile-onset, biotin-responsive
        description: 'The severe end of the spectrum and the first form described. Onset is at birth or
          in infancy, occasionally with prenatal ventriculomegaly, and disease is multisystem: failure
          to thrive, developmental delay or regression, seizures, brain atrophy, gastrointestinal hemorrhage,
          reflux and pseudo-obstruction, hypogammaglobulinemia and recurrent infections, osteopenia, metabolic
