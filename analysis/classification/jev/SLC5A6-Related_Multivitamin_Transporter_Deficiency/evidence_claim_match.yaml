  13a8cd553c3f068e5eb3d3305138c63c53fff892a0b6b5b22d90c4ef06d0c9b8:
    claim:
      about:
        disease:
          name: SLC5A6-Related Multivitamin Transporter Deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SLC5A6 Biallelic Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: Germline biallelic SLC5A6 variants reduce SMVT function. Severe infantile cases have
          usually carried a null allele (for example p.(Arg94*) or an early frameshift) in trans with
          a functionally impaired allele. The motor neuropathy cases carry missense alleles such as p.(Ser429Gly)
          and p.(Tyr162Cys) that reach the plasma membrane but transport less, so residual activity is
          thought to set the severity. Patient fibroblasts carrying p.(Ser429Gly) take up about 90 percent
          less biotin than controls.
        genes:
        - preferred_term: SLC5A6
          term:
            id: hgnc:11041
            label: SLC5A6
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The SLC5A6 missense variants p.(Tyr162Cys) and p.(Ser429Gly) did not affect plasma membrane
          localization of the ectopically expressed multivitamin transporter suggesting reduced but not
          abolished function, such as lower catalytic activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:35013551
      reference_title: Novel biallelic variants expand the SLC5A6-related phenotypic spectrum.
      evidence_source: IN_VITRO
      explanation: The neuropathy alleles are hypomorphic rather than null.
