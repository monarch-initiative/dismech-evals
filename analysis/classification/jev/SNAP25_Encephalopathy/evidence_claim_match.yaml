              label: Autosomal dominant inheritance
        notes: De novo heterozygous missense and loss-of-function variants in SNAP25 impair SNAP-25 function
          or its interaction with the other SNARE-complex components. SNAP25 (20p11.2) encodes synaptosomal-associated
          protein 25; the neuron-specific SNAP-25B splice isoform, which predominates in mature brain
          and at the motor nerve terminal, is the relevant transcript. The alleles reported with a myasthenic
          presentation are the index missense p.Ile67Asn in the coiled-coil interface and a nonsense c.529C>T
          (p.Gln177Ter) allele in a critically ill newborn.
