    evidence_metadata:
      reference: PMID:17283335
      reference_title: A dominant mutation in Snap25 causes impaired vesicle trafficking, sensorimotor
        gating, and ataxia in the blind-drunk mouse.
      evidence_source: MODEL_ORGANISM
