      assertion:
        name: Central Synaptic Dysfunction
        biological_scale: CELLULAR
        description: SNAP-25B is the dominant SNAP-25 isoform in the mature brain, so the same exocytosis
          defect operates at central synapses. Impaired calcium-triggered release at cortical, cerebellar,
          and other CNS synapses produces the central components seen alongside the myasthenia in the
          index myasthenic patient - cerebral cortical hyperexcitability, cerebellar ataxia, and intellectual
          disability - which are not features of most other presynaptic congenital myasthenic syndromes.
          This node carries the cerebellar and cognitive outcomes and the cortical hyperexcitability seen
          on EEG in the index patient; clinical epilepsy is carried by the cortical excitation-inhibition
          node.
        cell_types:
        - preferred_term: Central nervous system neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Synaptic vesicle exocytosis
          term:
            id: GO:0016079
            label: synaptic vesicle exocytosis
          modifier: DECREASED
      selected_evidence:
        snippet: Ile67Asn variant in SNAP25B is pathogenic because it inhibits synaptic vesicle exocytosis.
        supports: SUPPORT
