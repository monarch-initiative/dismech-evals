            term:
              id: MONDO:0014590
              label: congenital myasthenic syndrome 18
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant (De Novo)
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: The disorder arises from de novo heterozygous SNAP25 missense or loss-of-function
          variants, with unaffected parents. For the index myasthenic allele p.Ile67Asn the dominant behaviour
          is attributed to a dominant-negative effect of the mutant SNAP-25B subunit incorporated into
          SNARE complexes; whether other variants act by haploinsufficiency or dominant interference is
          unresolved (see gap_snap25_direction_of_effect).
      selected_evidence:
