          from impaired calcium-triggered vesicle fusion (release failure) versus SNAP-25's separable,
          non-fusion modulation of presynaptic voltage-gated calcium and potassium channels (a channelopathy-like
          change in intrinsic excitability)?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
        - pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
        rationale: The curated causal chain routes the phenotype through reduced SNARE-mediated release,
          but SNAP-25 has well-described roles beyond exocytosis, including negative modulation of voltage-gated
          calcium channels and interactions that tune neuronal excitability. Because DEE variants sit
          in the same protein that performs both jobs, the seizure phenotype could reflect a release deficit,
          a channelopathy-like intrinsic-excitability shift, or both — and the balance may differ by variant
          and neuron type. Distinguishing these arms is needed before excitability-targeted therapy is
          rationalized, and it is not resolved by the current release-centric evidence.
        proposed_experiments:
        - experiment_id: exp_snap25_release_vs_intrinsic_excitability
          name: SNAP25 release versus intrinsic-excitability dissection
          description: In neurons expressing SNAP25 DEE variants, separately quantify evoked synaptic
            release and cell-autonomous intrinsic excitability (voltage-gated calcium and potassium current
            density, action-potential threshold and firing) to apportion the excitability change between
            fusion failure and channel modulation.
          experiment_type:
            preferred_term: electrophysiological mechanism-dissection experiment
          perturbations:
          - name: SNAP25 DEE variant expression
            target: pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
            genes:
            - preferred_term: SNAP25
              term:
                id: hgnc:11132
                label: SNAP25
            description: Express DEE variants in neurons and compare against wild-type SNAP-25 and null
              controls.
          readouts:
          - name: Evoked synaptic transmission
            target: pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
            biological_processes:
            - preferred_term: chemical synaptic transmission
              term:
                id: GO:0007268
                label: chemical synaptic transmission
              modifier: DECREASED
            assays:
            - preferred_term: patch-clamp electrophysiology assay
            direction: NEGATIVE
          - name: Intrinsic excitability and channel currents
            target: pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
            assays:
            - preferred_term: voltage-clamp current-density assay
            - preferred_term: current-clamp firing assay
            direction: POSITIVE
          controls:
          - name: Wild-type SNAP-25
            description: Neurons expressing wild-type SNAP-25.
          - name: Snap25-null
            description: Null neurons isolating the loss-of-function reference.
          decision_criterion: The channel-modulation arm is supported if DEE variants shift intrinsic
            excitability (altered calcium or potassium current density, firing, or threshold) beyond what
            is accounted for by the measured reduction in evoked release; otherwise the phenotype is release-dominated.
          would_support:
          - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
          - pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
      selected_evidence:
        snippet: The causative I67T missense mutation results in increased binding affinities within the
          SNARE complex, impaired exocytotic vesicle recycling and granule exocytosis in pancreatic beta-cells,
          and a reduction in the amplitude of evoked cortical excitatory postsynaptic potentials.
        supports: SUPPORT
