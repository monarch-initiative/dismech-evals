  285b4f63d4cd170ed822d77eff1daf0246d44302e8a3ea70f20cc0d8b112939e:
    claim:
      about:
        disease:
          name: SNAP25-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: SNAP25-related developmental and epileptic encephalopathy
            term:
              id: MONDO:0014590
              label: congenital myasthenic syndrome 18
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_snap25_mouse_model_human_dee_fidelity
        prompt: Do existing Snap25 point-mutant mouse models, which reproduce ataxia, sensorimotor-gating
          deficits, and reduced cortical release, faithfully model the human SNAP25-DEE trajectory of
          before-age-two epileptic encephalopathy with intellectual disability, or do they capture only
          a partial, non-epileptic slice of the human phenotype?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
        - pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
        rationale: The strongest mechanistic in vivo evidence for SNAP-25 dysfunction comes from the blind-drunk
          I67T mouse, whose overt phenotype is ataxia and impaired sensorimotor gating with reduced evoked
          cortical release — features linked to psychiatric rather than epileptic disease. Human SNAP25-DEE,
          by contrast, is defined by early-onset epilepsy and intellectual disability with onset mostly
          before age two. Whether the mouse recapitulates the human epileptic encephalopathy trajectory,
          or only the synaptic and motor substrate, is the open translational question; this determines
          whether the model is a valid platform for testing DEE-directed therapies.
        proposed_experiments:
        - experiment_id: exp_snap25_ki_epileptogenesis_phenotyping
          name: SNAP25 patient-variant knock-in epileptogenesis phenotyping
          description: Generate knock-in mice carrying recurrent human SNAP25 DEE variants and phenotype
            for spontaneous seizures and epileptiform EEG, developmental cognitive assays, and cortical
            excitatory/inhibitory balance, comparing the trajectory and age of onset against the human
            before-age-two course.
          experiment_type:
            preferred_term: patient-variant knock-in mouse phenotyping experiment
          perturbations:
          - name: Human DEE variant knock-in
            target: pathophysiology#SNAP-25 SNARE Assembly Defect
            genes:
            - preferred_term: SNAP25
              term:
                id: hgnc:11132
                label: SNAP25
            description: Introduce a recurrent human SNAP25 DEE variant at the mouse locus.
          readouts:
          - name: Seizures and cortical excitability
            target: pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
            biological_processes:
            - preferred_term: chemical synaptic transmission
              term:
                id: GO:0007268
                label: chemical synaptic transmission
              modifier: ABNORMAL
            assays:
            - preferred_term: video-EEG seizure monitoring
            direction: POSITIVE
          controls:
          - name: Wild-type littermates
            description: Littermate controls without the knock-in variant.
          decision_criterion: The model faithfully represents SNAP25-DEE if knock-in mice develop early
            spontaneous seizures with epileptiform EEG and developmental cognitive deficits on a timeline
            analogous to the human before-age-two onset; absence of an epileptic phenotype indicates a
            human-model mismatch limited to the synaptic/motor substrate.
          would_support:
          - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
          - pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
      selected_evidence:
        snippet: The mice also display ataxia and impaired sensorimotor gating, a phenotype which has
          been associated with psychiatric disorders in humans.
        supports: SUPPORT
