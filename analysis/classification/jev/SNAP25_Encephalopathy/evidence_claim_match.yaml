        context: []
      assertion_type: Treatment
      assertion:
        name: Antiseizure Medication
        description: Seizures are managed with antiseizure medications; response is variable and can be
          severely refractory, with reported failure of more than eight agents in combination alongside
          ketogenic diet and steroid trials. No agent corrects the underlying SNARE-assembly defect, and
          no SNAP25-specific treatment has been established. The index myasthenic patient received levetiracetam
          to prevent seizures alongside 3,4-diaminopyridine, which shows antiseizure therapy may be needed
          in parallel with myasthenia-directed therapy.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: levetiracetam
            term:
              id: CHEBI:6437
              label: levetiracetam
      selected_evidence:
        snippet: Intellectual disability and early-onset epilepsy were identified as the core symptoms
          of SNAP25-DEE, with recurrent findings of movement disorders, cerebral visual impairment, and
          brain atrophy.
        supports: SUPPORT
        directness: INDIRECT
