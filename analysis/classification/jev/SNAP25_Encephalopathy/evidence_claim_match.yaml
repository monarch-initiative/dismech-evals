              label: congenital myasthenic syndrome 18
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Evoked Quantal Release at the Motor Endplate
        biological_scale: CELLULAR
        description: 'In vitro microelectrode studies of intercostal muscle endplates from the index patient
          showed neuromuscular transmission compromised by reduced evoked quantal release - the presynaptic,
          Lambert-Eaton-like signature that distinguishes SNAP25-CMS from postsynaptic acetylcholine receptor
          deficiency (a reduced synaptic response to acetylcholine, with quantal release preserved or
          even compensatorily increased) and from the acetylcholine-resynthesis defect of CHAT-CMS (a
          use-dependent fall in quantal size). SNAP25-CMS is classified with SYT2-, RPH3A- and UNC13A-CMS
          in the LEMS-like release-machinery subtype. Detailed endplate studies of the index patient refine
          this picture: the number of acetylcholine receptors per endplate was normal and endplate ultrastructure
          was preserved, but the probability of quantal release was reduced to 63% of normal, and the
          quantal content of the endplate potential and the number of readily releasable quanta were abnormally
          distributed - some endplates markedly abnormal and others normal or supranormal - a pattern
          the investigators attributed to postzygotic somatic mosaicism for the de novo variant.'
        cell_types:
        - preferred_term: Motor neuron presynaptic terminal
          term:
