      assertion_type: Pathophysiology
      assertion:
        name: Impaired SNARE-Mediated Vesicle Fusion
        conforms_to: synaptic_vesicle_cycle#Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion
        biological_scale: CELLULAR
        description: SNAP-25 is one of the three core SNAREs whose zippering, triggered by the calcium
          sensor synaptotagmin-1, fuses the synaptic vesicle with the presynaptic membrane. Impaired SNAP-25
          function degrades SNARE-complex assembly and reduces calcium-triggered neurotransmitter release.
          This is the module's key conformance target — the fusion-machinery arm. With a defective SNAP-25B
          moiety, fusion is hindered even in a reconstituted liposome system, and depolarization-evoked
          release from dense-core vesicles in chromaffin cells is markedly reduced. The same defect operates
          at cholinergic motor nerve terminals and at central synapses, which is why the disorder can
          combine a neuromuscular transmission defect with its CNS phenotype.
        role: central_effector
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: Motor neuron presynaptic terminal
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: calcium-dependent activation of synaptic vesicle fusion
          term:
            id: GO:0099502
            label: calcium-dependent activation of synaptic vesicle fusion
          modifier: DECREASED
        - preferred_term: synaptic vesicle exocytosis
          term:
            id: GO:0016079
            label: synaptic vesicle exocytosis
          modifier: DECREASED
