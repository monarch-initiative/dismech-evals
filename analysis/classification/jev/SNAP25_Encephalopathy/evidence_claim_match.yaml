      assertion:
        name: Amifampridine (3,4-Diaminopyridine)
        description: Amifampridine (3,4-diaminopyridine) is the mechanistically rational therapy for the
          myasthenic presentation. It blocks presynaptic voltage-gated potassium channels, prolonging
          the nerve terminal action potential and increasing calcium entry, which raises the number of
          acetylcholine quanta released per impulse and so directly counteracts the reduced release probability
          caused by the defective SNARE complex. In the index patient it improved strength, but it did
          not improve the ataxia - an important expectation-setting point, since the central nervous system
          components of the disorder are not corrected by a drug acting on presynaptic release at the
          neuromuscular junction.
        therapeutic_modality: SMALL_MOLECULE
