              SNAP-25 function degrades SNARE-complex assembly and reduces calcium-triggered neurotransmitter
              release. This is the module's key conformance target — the fusion-machinery arm. With a
              defective SNAP-25B moiety, fusion is hindered even in a reconstituted liposome system, and
              depolarization-evoked release from dense-core vesicles in chromaffin cells is markedly reduced.
              The same defect operates at cholinergic motor nerve terminals and at central synapses, which
