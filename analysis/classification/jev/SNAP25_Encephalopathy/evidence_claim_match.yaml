  71b86098c52e815451c1276229f7c97abfef69378b89f37ffbbe752602f4813a:
    claim:
      about:
        disease:
          name: SNAP25-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: SNAP25-related developmental and epileptic encephalopathy
            term:
              id: MONDO:0014590
              label: congenital myasthenic syndrome 18
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_snap25_direction_of_effect
        prompt: For a given pathogenic SNAP25 variant, what determines whether it acts by simple loss
          of function (haploinsufficiency, reduced evoked release) versus a dominant-negative or gain-of-function
          mechanism (altered SNARE zippering or increased complex-binding affinity), and does the direction
          of effect predict the clinical subphenotype (DEE versus milder intellectual disability versus
          ataxic or myasthenic features)?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#SNAP-25 SNARE Assembly Defect
        - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
        rationale: 'SNAP25-DEE is caused by a mix of missense and loss-of-function de novo variants, but
          structural modeling in the defining cohort could only predict "possible functional defects"
          without resolving whether release is reduced by haploinsufficiency or by a dominant-negative
          variant that is incorporated into the SNARE complex and poisons it. The blind-drunk mouse shows
          that a SNAP-25 missense change can act paradoxically by *increasing* SNARE-complex binding affinity
          rather than abolishing it, so direction of effect cannot be assumed from the variant class alone.
          This matters therapeutically: allele-silencing or protein-replacement strategies help only true
          loss of function, whereas a dominant-negative allele may need selective knockdown of the mutant
          transcript.'
        proposed_experiments:
        - experiment_id: exp_snap25_variant_direction_release_panel
          name: SNAP25 variant direction-of-effect release panel
          description: Express representative SNAP25 DEE variants (missense and loss-of-function) in Snap25-null
            neurons alone and co-expressed with wild-type SNAP-25 in an isogenic background, then measure
            evoked release and SNARE-complex assembly to classify each variant as loss-of-function versus
            dominant-negative.
          experiment_type:
            preferred_term: variant functional-classification and rescue experiment
          perturbations:
          - name: SNAP25 variant expression on null background
            target: pathophysiology#SNAP-25 SNARE Assembly Defect
            genes:
            - preferred_term: SNAP25
              term:
                id: hgnc:11132
                label: SNAP25
            description: Introduce each DEE variant into Snap25-null neurons, with and without co-expressed
              wild-type SNAP-25, to test for haploinsufficiency versus dominant interference.
          readouts:
          - name: Evoked release and SNARE assembly
            target: pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
            biological_processes:
            - preferred_term: calcium-dependent activation of synaptic vesicle fusion
              term:
                id: GO:0099502
                label: calcium-dependent activation of synaptic vesicle fusion
              modifier: DECREASED
            - preferred_term: synaptic vesicle exocytosis
              term:
                id: GO:0016079
                label: synaptic vesicle exocytosis
              modifier: DECREASED
            assays:
            - preferred_term: patch-clamp electrophysiology assay
            - preferred_term: co-immunoprecipitation assay
            direction: NEGATIVE
          controls:
          - name: Wild-type SNAP-25 rescue
            description: Snap25-null neurons rescued with wild-type human SNAP-25.
          - name: Null baseline
            description: Snap25-null neurons without rescue as the loss-of-function floor.
          decision_criterion: A variant is loss-of-function if it fails to restore evoked release on the
            null background and does not depress wild-type-mediated release when co-expressed; it is dominant-negative
            if co-expression with wild-type SNAP-25 reduces release below the wild-type-only level.
          would_support:
          - pathophysiology#SNAP-25 SNARE Assembly Defect
          - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
      selected_evidence:
        snippet: Structural modeling for all variants predicted possible functional defects concerning
          SNAP25 or impaired interaction with other components of the SNARE complex.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33299146
      reference_title: De novo variants in SNAP25 cause an early-onset developmental and epileptic encephalopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: Shows that the human cohort establishes disruption of SNAP-25 or its SNARE interactions
        but does not resolve the direction of effect (loss versus dominant-negative) for individual variants.
