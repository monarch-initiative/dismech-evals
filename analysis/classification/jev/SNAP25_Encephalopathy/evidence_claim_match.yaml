        description: De novo missense and loss-of-function variants in SNAP25 impair SNAP-25, a core t-SNARE
          of the neuronal fusion machine. Structural modeling of disease variants predicts defects in
          SNAP-25 itself or in its interaction with the other SNARE components (syntaxin-1, synaptobrevin-2),
          degrading assembly of the SNARE complex that executes vesicle fusion. In the index myasthenic
          allele p.Ile67Asn, a highly hydrophobic isoleucine in the coiled-coil interface is replaced
          by a strongly hydrophilic asparagine, disrupting the hydrophobic packing of the four-helix SNARE
          bundle; because the mutant subunit is incorporated into complexes alongside wild-type SNAP-25B,
          co-expression of mutant with wild-type protein still markedly impairs evoked exocytosis, a dominant-negative
          effect. The same lesion acts at central synapses and at the motor nerve terminal.
