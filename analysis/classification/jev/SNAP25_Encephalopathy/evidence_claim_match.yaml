        name: Repetitive nerve stimulation and single-fiber EMG
        description: The entry-level electrodiagnostic test. A decremental compound muscle action potential
          response to low-frequency repetitive nerve stimulation, or abnormal jitter/blocking on single-fiber
          EMG, establishes a defect of neuromuscular transmission and, with onset at birth to early childhood
          and fatigable cranial weakness, supports a generic CMS diagnosis. It does not discriminate CMS18
          from other CMS subtypes.
        diagnosis_term:
          preferred_term: repetitive nerve stimulation electromyography
          term:
            id: NCIT:C38056
            label: Electromyography
        results: A decremental CMAP response on low-frequency repetitive nerve stimulation, or abnormal
          single-fiber EMG, indicates impaired neuromuscular transmission.
      selected_evidence:
        snippet: Measurement of compound muscle action potentials elicited by repetitive nerve stimulation
          is required to diagnose CMS.
