        name: Other Presynaptic Congenital Myasthenic Syndromes
        description: CMS caused by defects in the other presynaptic release-machinery and acetylcholine-supply
          proteins - SYT2, VAMP1, UNC13A, RPH3A (LEMS-like release defects) and CHAT, SLC5A7, SLC18A3
          (acetylcholine synthesis, transport, and packaging). These share fatigable weakness but differ
          in inheritance, endplate electrophysiological signature, and drug response, and clinical and
          electrophysiological features alone are insufficient to discriminate them.
        distinguishing_features:
        - Most other presynaptic CMS are autosomal recessive loss-of-function disorders, whereas CMS18
          is autosomal dominant de novo with a dominant-negative mechanism
        - Prominent cortical hyperexcitability, ataxia, and intellectual disability point toward the SNARE-complex
          subtypes rather than the acetylcholine-supply subtypes
        - Genetic testing is required for definitive subtype assignment
        disease_term:
          preferred_term: Presynaptic congenital myasthenic syndrome
          term:
            id: MONDO:0700466
            label: presynaptic congenital myasthenic syndrome
      selected_evidence:
        snippet: Clinical and electrophysiological features are not sufficient to identify a defective
          molecule, and genetic studies are always required for accurate diagnosis.
        supports: SUPPORT
