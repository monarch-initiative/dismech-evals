          name: SNF8-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder plus optic atrophy
            term:
              id: MONDO:0968947
              label: neurodevelopmental disorder plus optic atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bi-allelic Hypomorphic SNF8 Variants
        biological_scale: MOLECULAR
        description: 'The primary lesion is bi-allelic damage to SNF8 at 17q21.32, reported against transcript
          NM_007241.4. Genotype maps onto severity: the mild NEDOA phenotype curated here occurs only
          in individuals who carry the hypomorphic missense allele c.304G>A (p.Val102Ile), which is inferred
          to leave residual SNF8 function, whereas the severe allelic encephalopathy arises from more
          damaging genotypes. Functional testing in vivo reproduced this graded effect, with different
          SNF8 alleles having different impacts on embryonic development, which is the mechanistic basis
          for the clinical heterogeneity across the spectrum.'
        genes:
        - preferred_term: SNF8
          term:
            id: hgnc:17028
            label: SNF8
      selected_evidence:
        snippet: 'caused by bi-allelic variants in SNF8 (GenBank: NM_007241.4), encoding the ESCRT-II
          subunit SNF8'
        supports: SUPPORT
