      assertion_type: HarrisonsChapterAssignment
      assertion:
        classification_value: NEUROLOGIC
        notes: 'The entire reported morbidity is neurological and neuro-ophthalmological: impaired intellectual
          development in 4/4, optic atrophy in 3/4, speech and language delay, mild global developmental
          delay, and in one individual congenital ataxia, with brain and cerebellar atrophy on MRI. The
          optic neuropathy is a lesion of the anterior visual pathway - central nervous system tissue
          - rather than an ophthalmological disease of the globe, so NEUROLOGIC rather than an ophthalmology
          assignment is the correct single chapter. No systemic, cardiac, renal, hepatic, haematological
          or skeletal involvement has been reported at either end of the SNF8 spectrum.'
      selected_evidence:
        snippet: We report nine individuals from six families presenting with a spectrum of neurodevelopmental/neurodegenerative
          features caused by bi-allelic variants in SNF8
        supports: SUPPORT
