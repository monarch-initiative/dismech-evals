      assertion_type: DifferentialDiagnosis
      assertion:
        name: Developmental and epileptic encephalopathy 115
        disease_term:
          preferred_term: developmental and epileptic encephalopathy 115
          term:
            id: MONDO:0968946
            label: developmental and epileptic encephalopathy 115
        description: The allelic disorder, caused by bi-allelic variants in the same gene. This is not
          a differential in the usual sense of a different disease that mimics this one; it is the other
          half of one continuum, and separating the two is a clinical judgement made after the SNF8 genotype
          is already known. A laboratory that reports bi-allelic SNF8 variants has not thereby chosen
          between OMIM:620783 and OMIM:620784.
        distinguishing_features:
        - DEE115 has a congenital onset, whereas the optic atrophy in NEDOA is described as childhood-onset
          and the HPO onset annotations for NEDOA are childhood or juvenile.
        - DEE115 is defined by severe developmental and epileptic encephalopathy with neurodevelopmental
          arrest and early death; NEDOA is compatible with survival and with mild rather than absent developmental
          progress.
        - Massive white matter reduction with hypoplasia or aplasia of the corpus callosum is characteristic
          of DEE115; in the NEDOA HPO annotation set both callosal hypoplasia and agenesis are recorded
          at 0/4 and only dysplasia appears.
        - Seizures and EEG abnormality are recorded in DEE115 but are annotated at 0/4 in NEDOA, so an
          epileptic presentation argues against this entity.
        - All mildly affected individuals carried the hypomorphic c.304G>A (p.Val102Ile) allele, so this
          genotype is currently the strongest single pointer towards NEDOA rather than DEE115.
        notes: MONDO:0968946 was verified with OAK (`runoak -i sqlite:obo:mondo relationships --direction
          down HGNC:17028`), which returns it and MONDO:0968947 as the only two SNF8 disease terms; its
          xref is OMIM:620783. The seizure and EEG contrasts in the distinguishing features come from
          the HPO annotation sets for OMIM:620783 and OMIM:620784 (retrieved 2026-08-01), not from the
          cached abstract.
      selected_evidence:
        snippet: The phenotypic spectrum included four individuals with severe developmental and epileptic
          encephalopathy, massive reduction of white matter, hypo-/aplasia of the corpus callosum, neurodevelopmental
          arrest, and early death.
        supports: SUPPORT
