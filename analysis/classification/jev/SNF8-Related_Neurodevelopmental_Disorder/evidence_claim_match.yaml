  2b768d9f0d3aa5a8f0efaff2c0d7c8dfab128a3e45d7678be12f3c7ef3967d40:
    claim:
      about:
        disease:
          name: SNF8-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder plus optic atrophy
            term:
              id: MONDO:0968947
              label: neurodevelopmental disorder plus optic atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of ESCRT-III Nucleation and Multivesicular Body Biogenesis
        biological_scale: CELLULAR
        description: 'ESCRT-0, -I, -II and -III act as a sequential relay on the endosomal membrane. ESCRT-II
          is the hand-off point: it binds the ESCRT-I VPS28 C-terminal domain on one side and, through
          VPS25, directly recruits and nucleates the ESCRT-III subunit VPS20/CHMP6 on the other. Losing
          ESCRT-II therefore breaks the cascade in the middle, so ubiquitinated cargo is not packaged
          into intralumenal vesicles, multivesicular bodies fail to mature, and surface receptors are
          not downregulated. This step is the mechanistic junction with the ESCRT-III disorders: an ESCRT-II
          lesion and an ESCRT-III lesion disable adjacent stages of one pathway.'
        biological_processes:
        - preferred_term: multivesicular body assembly
          modifier: DECREASED
          term:
            id: GO:0036258
            label: multivesicular body assembly
        - preferred_term: endosomal transport
          modifier: ABNORMAL
          term:
            id: GO:0016197
            label: endosomal transport
        - preferred_term: ubiquitin-dependent cargo delivery to the lysosome via the MVB sorting pathway
          modifier: DECREASED
          term:
            id: GO:0043328
            label: protein transport to vacuole involved in ubiquitin-dependent protein catabolic process
              via the multivesicular body sorting pathway
        cellular_components:
        - preferred_term: multivesicular body
          term:
            id: GO:0005771
            label: multivesicular body
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        notes: 'The block at this step is partial and cargo-selective, not a global collapse of ESCRT
          function, and the strongest evidence for that is a negative result. In the founding study, EGFR
          degradation - the canonical, most widely used readout of ESCRT-dependent receptor downregulation
          - was NOT detectably impaired in patient-derived fibroblasts compared with control fibroblasts.
          The authors attribute this to residual ESCRT-II activity and to cargo specificity: different
          cargoes have different ESCRT-II dependency thresholds. This constrains the model in a way the
          abstract alone does not. It argues against reading "loss of ESCRT-II subunits" as "the MVB pathway
          is shut down", and it is consistent with the mild pole existing at all: a partially functional
          pathway that still clears EGFR but fails somewhere else, most likely at autophagosome-lysosome
          progression.

          Provenance and honesty about it. This result is in the full text of PMID:38423010, not in its
          abstract, which is the only part cached here (`grep -i egfr references_cache/PMID_38423010.md`
          returns nothing, checked 2026-08-01). It is therefore recorded in this note rather than as an
          evidence snippet, and no `REFUTE`/`PARTIAL` evidence item is attached to it, because attaching
          one would require quoting text this repository cannot verify. It was surfaced by the deep research
          pass (research/SNF8-Related_Neurodevelopmental_Disorder-deep-research-claude_code.md, section
          6). The study also does not report which pole the EGFR-assayed fibroblasts came from, so the
          result is recorded for the SNF8 spectrum rather than asserted specifically for the NEDOA genotype.'
      selected_evidence:
        snippet: ESCRT-I, -II, and -III protein complexes are sequentially recruited to endosomal membranes,
          where they orchestrate protein sorting and MVB biogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15469844
      reference_title: 'ESCRT-II, an endosome-associated complex required for protein sorting: crystal
        structure and interactions with ESCRT-III and membranes.'
      evidence_source: IN_VITRO
      explanation: Establishes that ESCRT-II occupies an obligatory intermediate position in the sorting
        relay, so its loss interrupts the sequence rather than degrading it gracefully.
