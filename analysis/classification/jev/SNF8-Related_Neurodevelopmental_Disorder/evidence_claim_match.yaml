        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Optic Nerve and Forebrain Developmental Failure
        biological_scale: TISSUE
        description: The tissue-level endpoint is selective failure of the visual pathway and the forebrain.
          Zebrafish snf8 loss of function reproduces this pattern specifically, producing impaired optic
          nerve development and reduced forebrain size in addition to global developmental delay and altered
          embryo morphology. That the optic nerve phenotype is recovered in a model organism is what elevates
          optic atrophy in this disorder from an incidental association to a mechanistically anchored
          feature, and it is the strongest available support for the visual pathway being intrinsically
          vulnerable to ESCRT-II loss rather than secondarily damaged.
        locations:
        - preferred_term: optic nerve
          term:
            id: UBERON:0000941
            label: cranial nerve II
        - preferred_term: forebrain
          term:
            id: UBERON:0001890
            label: forebrain
        cell_types:
        - preferred_term: retinal ganglion cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
        notes: 'The retinal ganglion cell binding is an inference, not an observation, and is flagged
          as such. No retina was examined histologically in PMID:38423010, and no electroretinography
          or optical-coherence-tomography ganglion-cell-layer measurement is reported in the cached abstract.
          The cell type is named because the retinal ganglion cell is the neuron whose axons constitute
          the optic nerve, so optic atrophy with reduced anterior-visual-pathway volume localises the
          lesion to that population by anatomy; and because retinal ganglion cells are the canonical autophagy-
          and energy-vulnerable long-axon neuron implicated in the mitochondrial optic neuropathies that
          form this disorder''s clinical differential. Oligodendrocyte involvement, which the deep research
          pass also suggested, is NOT bound here: it rests only on "marked loss of myelin" at severe-pole
          autopsy, which is an inference from a different pole of the spectrum and one step further removed.
          CL:0000740 was verified with OAK on 2026-08-01.'
      selected_evidence:
        snippet: Snf8 loss of function in zebrafish results in global developmental delay and altered
          embryo morphology, impaired optic nerve development, and reduced forebrain size.
        supports: SUPPORT
