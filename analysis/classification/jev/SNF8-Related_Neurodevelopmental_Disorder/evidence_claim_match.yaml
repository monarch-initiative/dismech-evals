  9c3ebbc8940225c13af6d60d2a0f6721e3b5421af2a303def2f2e9603ed983f3:
    claim:
      about:
        disease:
          name: SNF8-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder plus optic atrophy
            term:
              id: MONDO:0968947
              label: neurodevelopmental disorder plus optic atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the ESCRT-II Complex
        biological_scale: MOLECULAR
        description: 'ESCRT-II is an obligate heterotetramer built from one copy of SNF8/VPS22, one copy
          of VPS36, and two copies of VPS25, arranged as a trilobal assembly of winged-helix domains.
          Because the subunits are mutually stabilising, damaging one of them destabilises the whole complex
          rather than removing a single activity: patient-derived fibroblasts carrying bi-allelic SNF8
          variants show loss of ESCRT-II subunits, plural. SNF8 is not a peripheral subunit in this assembly
          - the first helix of VPS22 contributes directly, alongside the VPS36 GLUE domain, to targeting
          ESCRT-II onto the endosomal membrane - so its loss removes both the structural core and part
          of the membrane-recruitment activity.'
        genes:
        - preferred_term: SNF8
          term:
            id: hgnc:17028
            label: SNF8
        protein_complexes:
        - preferred_term: ESCRT II complex
          modifier: DECREASED
          term:
            id: GO:0000814
            label: ESCRT II complex
        cellular_components:
        - preferred_term: endosome membrane
          term:
            id: GO:0010008
            label: endosome membrane
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        notes: Scope caveat, and the single most important qualification in this entry. The quoted abstract
          sentence "bi-allelic SNF8 variants cause loss of ESCRT-II subunits" is written across the whole
          spectrum, but the full-text proteomics behind it separates the two poles, and the separation
          runs against this entity. In severe-pole fibroblasts SNF8 fell to roughly a quarter of control
          with VPS36 and VPS25 significantly co-depleted; in the mild-pole fibroblasts (individuals D1
          and E1, the NEDOA genotype curated here) the reduction in SNF8 was not statistically significant
          and VPS36 and VPS25 were not significantly reduced at all. Complex destabilisation is therefore
          established for the severe allelic disorder and NOT demonstrated for NEDOA. This node is retained
          because ESCRT-II is unambiguously the affected machinery, but the destabilisation route is marked
          PARTIAL for this entity and the alternative route is modelled as its own node below. These per-individual
          fold changes are full-text/supplementary figures in PMID:38423010, not abstract content, so
          they are recorded here rather than quoted as a snippet; they were surfaced by the deep research
          pass.
      selected_evidence:
        snippet: In patient-derived fibroblasts, bi-allelic SNF8 variants cause loss of ESCRT-II subunits.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38423010
      reference_title: Bi-allelic variants in SNF8 cause a disease spectrum ranging from severe developmental
        and epileptic encephalopathy to syndromic optic atrophy.
      evidence_source: IN_VITRO
      explanation: Patient-cell demonstration that the SNF8 genotype can destabilise ESCRT-II subunits
        collectively. Marked PARTIAL rather than SUPPORT because the sentence is stated for the spectrum
        as a whole while the underlying proteomics shows the effect in the severe-pole genotypes and not
        in the mild-pole genotype that defines this MONDO term; see this node's notes.
    first_seen_at: '2026-09-28T18:13:57.858489+00:00'
