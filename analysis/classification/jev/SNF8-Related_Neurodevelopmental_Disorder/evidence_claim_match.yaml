        measure_type: CASES_IN_LITERATURE
        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'Nine individuals from six families have been reported in total across both ends of the
          SNF8 spectrum, in one 2024 publication; four of those nine are at the mild pole and therefore
          constitute the entire published experience of this entity. `NOT_YET_DOCUMENTED` is used rather
          than a qualitative `ULTRA_RARE` band because no prevalence or incidence estimate of any kind
          has been published and Orphanet has assigned no ORPHA code to this disorder, so there is no
          source to band. `rate_per_100000` is deliberately left empty - there is no basis for a number.
          No founder effect is asserted: the single homozygous family is one family, and the recurrence
          of p.Val102Ile across three unrelated families reflects that allele''s appreciable population
          frequency rather than a founder event. The reported ancestries are European and Middle Eastern,
          which reflects ascertainment through European diagnostic genomics networks and must not be read
          as population restriction.'
      selected_evidence:
        snippet: We report nine individuals from six families presenting with a spectrum of neurodevelopmental/neurodegenerative
