  39d21ad4287670bb33cd81a39da767f79493dfc958615d9914e88f03c0a04fa8:
    claim:
      about:
        disease:
          name: SNF8-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder plus optic atrophy
            term:
              id: MONDO:0968947
              label: neurodevelopmental disorder plus optic atrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Autophagic Flux
        biological_scale: CELLULAR
        description: 'The ESCRT machinery is required not only for endosomal sorting but for autophagy,
          where it contributes to phagophore closure and to autophagosome-lysosome fusion. The founding
          study''s stated conclusion is that the neurodevelopmental and neurodegenerative phenotypes of
          bi-allelic SNF8 disease are mediated principally through impaired autophagic flux rather than
          through cargo missorting alone. The abstract states this as a likelihood, but the full text
          backs it with direct patient-material assays: transmission electron microscopy of patient fibroblasts
          showing accumulated autolysosomes and morphologically aberrant, enlarged, electron-lucent lysosomes;
          LC3/LAMP1 confocal immunofluorescence showing the same accumulation; and, at the severe pole,
          strong LC3 immunostaining on autopsy neuropathology where age-matched controls stained only
          weakly.'
        biological_processes:
        - preferred_term: macroautophagy
          modifier: DECREASED
          term:
            id: GO:0016236
            label: macroautophagy
        - preferred_term: autophagosome maturation
          modifier: DECREASED
          term:
            id: GO:0097352
            label: autophagosome maturation
        cellular_components:
        - preferred_term: autolysosome
          term:
            id: GO:0044754
            label: autolysosome
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: cortical pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        - preferred_term: reactive astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        - preferred_term: activated microglial cell
          term:
            id: CL:0000129
            label: microglial cell
        mechanism_confidence: PROVISIONAL
        notes: 'Confidence, and why it moved. This node was previously marked HYPOTHETICAL on the ground
          that the abstract hedges with "likely". That understated the evidence: the full text of PMID:38423010
          reports direct autophagy readouts in patient material - fibroblast transmission electron microscopy
          showing autolysosome accumulation and aberrant enlarged, electron-lucent lysosomes, LC3/LAMP1
          confocal immunofluorescence showing the same, and strong LC3 immunostaining on autopsy neuropathology.
          PROVISIONAL is the honest level: the mechanism is measured, not merely posited, but the causal
          step from impaired flux to the neurological phenotype in vivo is still inferred. It is not upgraded
          further because none of those assays is quotable here (only the abstract of PMID:38423010 is
          cached) and because the study does not report an autophagic-flux measurement resolved by pole.

          Cell types, with their provenance and its limits. Fibroblast is the actual experimental cell
          type for the electron microscopy, LC3/LAMP1 and proteomics work, and mild-pole fibroblasts (individuals
          D1 and E1) were among those studied, so it is directly relevant to this entity. Pyramidal neuron,
          astrocyte and microglial cell come from autopsy neuropathology - LC3 accumulation in neurons
          of the internal pyramidal cell layer, reactive astrogliosis with LC3-positive white-matter astrocytes,
          and microglial activation. That autopsy was performed on individual A2, who carried p.Tyr167Ter/p.Gly191Asp
          and sits at the SEVERE pole, that is, in the allelic disorder DEE115 (MONDO:0968946) and not
          in this MONDO term. These three CNS cell types are therefore recorded as the neuropathological
          substrate of the SNF8 spectrum, not as a demonstrated finding in NEDOA; no post-mortem material
          exists from a mildly affected individual. All four CL identifiers were verified with OAK (`runoak
          -i sqlite:obo:cl info`) on 2026-08-01.'
      selected_evidence:
        snippet: we conclude that loss of ESCRT-II due to bi-allelic SNF8 variants is associated with
          a spectrum of neurodevelopmental/neurodegenerative phenotypes mediated likely via impairment
          of the autophagic flux
        supports: SUPPORT
