      assertion_type: AnimalModel
      assertion:
        species: Danio rerio
        genotype: snf8 antisense morpholino knockdown (morphant; no stable mutant line reported)
        category: Transient loss-of-function knockdown model
        description: 'Zebrafish snf8 knockdown is the only reported in vivo model of this disorder, and
          it is a transient antisense morpholino knockdown rather than a stable germline mutant - a distinction
          that changes how heavily the result should be weighted. It reproduces the two organ-level features
          that matter for this entity, impaired optic nerve development and reduced forebrain size, alongside
          global developmental delay and altered embryo morphology. The model was also used to test individual
          human SNF8 alleles, and the alleles differed in their impact on embryonic development, which
          is the experimental basis for attributing the clinical spectrum to allele severity.

          Model-type disclosure, added because the abstract''s phrase "Snf8 loss of function in zebrafish"
          reads as a stable mutant and is not one. The full text of PMID:38423010 describes morpholino
          injection with co-injection rescue ("rescued in fish co-injected with snf8 MO and WT SNF8"),
          so the model is a transient knockdown. Morpholinos carry well-documented off-target and p53-mediated
          toxicity artefacts, and morphant phenotypes have repeatedly failed to reproduce in germline
          mutants; the WT-mRNA rescue reported here mitigates that concern but does not remove it. The
          full text also records reduced penetrance among morphants and variable phenotypes. None of this
          is in the cached abstract, so it is a note rather than a snippet; it was surfaced by the deep
          research pass (section 15). The model additionally does not address seizures, corpus callosum
          morphology (zebrafish have no corpus callosum), leukoencephalopathy, or intellectual disability.'
        associated_phenotypes:
        - Impaired optic nerve development
        - Reduced forebrain size
        - Global developmental delay
      selected_evidence:
        snippet: Snf8 loss of function in zebrafish results in global developmental delay and altered
          embryo morphology, impaired optic nerve development, and reduced forebrain size.
        supports: SUPPORT
