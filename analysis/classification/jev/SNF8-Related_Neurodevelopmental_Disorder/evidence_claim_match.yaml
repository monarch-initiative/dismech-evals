  a272b1da1ecb0f2fc852d7177207941637dc8fac3a91f3e7a586c3a28a1667fe:
    claim:
      about:
        disease:
          name: SNF8-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder plus optic atrophy
            term:
              id: MONDO:0968947
              label: neurodevelopmental disorder plus optic atrophy
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: 'Disease requires two damaging SNF8 alleles. All nine reported individuals were bi-allelic,
          and every individual at the mild NEDOA end of the spectrum carried the hypomorphic missense
          allele c.304G>A (p.Val102Ile), which is understood to retain partial function and thereby to
          set the severity floor. Heterozygous carriers, including the parents in the six reported families,
          are not described as affected.

          Penetrance is recorded as incomplete, and the reason is specific to this entity rather than
          a generic hedge. gnomAD contains one apparently healthy individual homozygous for c.304G>A (p.Val102Ile)
          - the very allele that defines the mild pole. For the severe bi-allelic genotypes penetrance
          appears complete, so penetrance here is genotype-dependent rather than uniformly reduced. The
          practical consequence is a counselling problem: a fetus predicted to be a p.Val102Ile homozygote
          cannot be described as affected on present evidence. That gnomAD homozygote is reported in the
          full text of PMID:38423010 and was surfaced by the deep research pass; it is not in the cached
          abstract, so it carries no snippet. Consanguinity is not explicitly reported for any family
          and is deliberately not asserted, despite the one homozygous family being consistent with it.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        penetrance: INCOMPLETE
      selected_evidence:
        snippet: We report nine individuals from six families presenting with a spectrum of neurodevelopmental/neurodegenerative
          features caused by bi-allelic variants in SNF8
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
