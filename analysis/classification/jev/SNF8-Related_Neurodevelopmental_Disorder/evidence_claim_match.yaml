        context: []
      assertion_type: Genetic
      assertion:
        name: SNF8
        association: Bi-allelic variants; the mild NEDOA phenotype is associated specifically with the
          hypomorphic allele c.304G>A (p.Val102Ile)
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: SNF8
          term:
            id: hgnc:17028
            label: SNF8
        notes: 'Nomenclature. HGNC:17028 is symbol SNF8, "SNF8 subunit of ESCRT-II", at 17q21.32, Entrez
          11267, Ensembl ENSG00000159210, UniProt Q96H20, with alias symbols EAP30, VPS22 and Dot3 (HGNC
          REST API, retrieved 2026-08-01). The structural literature cited in this entry uses VPS22 exclusively.

          Allelic architecture. The reference transcript in the founding report is NM_007241.4. The only
          allele identified by name in the cached abstract is c.304G>A (p.Val102Ile), described as hypomorphic
          and shared by all mildly affected individuals. The deep research pass adds, from the full text
          and from ClinVar, that seven distinct variants were reported across the six families and that
          every mildly affected individual carries p.Val102Ile in trans to a more damaging allele: c.423-1G>C
          (splice acceptor) in family D, c.673_683delinsTGGA p.Asp225TrpfsTer99 in family E, and c.236C>T
          p.Pro79Leu in family F. Absence of p.Val102Ile predicted the severe pole in all five severe
          cases. None of that per-family detail is abstract-verifiable, so it is recorded here rather
          than asserted with a snippet.

          Variant classification is genuinely contested and is recorded as such rather than smoothed over.
          ClinVar holds conflicting germline interpretations for c.304G>A (p.Val102Ile): the Institute
          of Human Genetics Munich submitted Pathogenic and OMIM submitted Pathogenic for neurodevelopmental
          disorder plus optic atrophy, while Ambry Genetics submitted Uncertain significance on insufficient
          or conflicting evidence. The Ambry position is defensible on the population data - gnomAD allele
          frequency for rs200399045 is about 1.5 x 10^-4 and gnomAD contains one apparently healthy homozygote.
          A laboratory reporting this allele should not present it as unqualified Pathogenic. These ClinVar
          and gnomAD figures come from the deep research pass, not from the cached abstract.

          Not asserted, deliberately. gnomAD constraint metrics (pLI, o/e LoF, missense Z) are NOT recorded
          anywhere in this entry: the research pass could not reach the gnomAD API and explicitly warned
          against populating them from memory, and no other source consulted here provides them. DepMap
          essentiality is likewise not asserted for the same reason. Three large multi-gene 17q21.32 deletions
          appear in a ClinVar SNF8 gene query but are not SNF8-specific and are not curated as a cause
          of this disorder. No modifier locus, methylation episignature, founder allele, or somatic mechanism
          has been established.

          Because MONDO splits the SNF8 phenotype into two terms and both are caused by bi-allelic variants
          in this same gene, a laboratory reporting an SNF8 genotype cannot assign the OMIM phenotype
          number from the gene alone; the assignment depends on the allele and on the clinical severity.'
      selected_evidence:
        snippet: All mildly affected individuals shared the same hypomorphic variant, c.304G>A (p.Val102Ile).
        supports: SUPPORT
