        name: Reduced SNIP1 Protein Abundance and Altered Nuclear Distribution
        biological_scale: MOLECULAR
        description: Transcript levels of the mutant allele are comparable to wild type, so the lesion
          acts post-transcriptionally. Overexpressed mutant protein is markedly less abundant than wild
          type on Western blot and adopts an aggregated rather than a punctate nuclear distribution, indicating
          impaired protein stability and impaired assembly into nuclear transcriptional and splicing complexes.
          This dosage reduction is the shared upstream cause of both the splicing and the transcriptional
          arms of the disease.
        genes:
        - preferred_term: SNIP1
          term:
            id: hgnc:30587
            label: SNIP1
        cellular_components:
        - preferred_term: nuclear speck
          term:
            id: GO:0016607
            label: nuclear speck
          modifier: ABNORMAL
