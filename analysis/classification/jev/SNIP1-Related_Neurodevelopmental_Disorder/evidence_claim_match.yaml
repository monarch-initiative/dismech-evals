      assertion_type: Pathophysiology
      assertion:
        name: Detained-Intron Splicing Brake Dysregulation in Neurons
        biological_scale: CELLULAR
        description: Beyond bulk splicing, SNIP1 together with RNPS1 forms a molecular brake that pauses
          the spliceosome at the B-act state on detained introns, holding intron-detaining transcripts
          in the nucleus as a rapidly deployable mRNA pool. Conditional Snip1 deletion in mouse cerebellum
          reduces detained-intron splicing efficiency and causes neurodegeneration, identifying neurons
          as a tissue in which the timing of detained-intron release is SNIP1-dependent and functionally
          critical.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: regulation of alternative mRNA splicing, via spliceosome
          term:
            id: GO:0000381
            label: regulation of alternative mRNA splicing, via spliceosome
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Snip1 conditional knockout in the cerebellum decreases DI splicing efficiency and causes
          neurodegeneration
        supports: SUPPORT
