      assertion:
        phase: Mortality
        age_range: 1 week to 11 years for reported deaths; survivors to 30 years
        notes: 'Mortality is substantial but the disorder is not uniformly lethal. Of 51 identified individuals,
          12 (24%) were deceased at the time of the 2021 report, with age at death between one week and
          11 years, while the 39 survivors ranged up to 30 years of age. Reported causes of death were
          infection, sudden cardiopulmonary arrest, and accidental drowning. The drowning deaths are worth
          stating plainly: in a population where every affected individual has epilepsy and most are non-verbal,
          water supervision is a concrete family-level preventive measure, although the source does not
          frame it as a formal recommendation and none is asserted here. SUDEP is not invoked by the authors
          and is not asserted. No survival curve, life expectancy estimate or actuarial mortality rate
          has been published, and the 24% figure is a crude cross-sectional proportion in a founder cohort,
          not a survival statistic. Adult natural history beyond 30 years is undescribed.'
      selected_evidence:
        snippet: Seventy-six per- cent (n = 39) are currently living (age range 6 months to 30 years),
