              label: psychomotor retardation, epilepsy, and craniofacial dysmorphism
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: snip1_founder_generalisability
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do the phenotype frequencies curated here generalise beyond the Old Order Amish founder
          kindred, and does biallelic SNIP1 disease exist outside it?
        attaches_to:
        - pathophysiology#Biallelic SNIP1 p.Glu366Gly Founder Substitution
        - phenotypes#Seizure
        rationale: 'Every frequency band in this entry derives from a single published cohort of 35 clinically
          evaluated Old Order Amish individuals, all homozygous for one founder allele, drawn from 21
          interrelated families and linkable into a single pedigree. Three consequences follow and are
          flagged on each banded phenotype''s notes field. First, these are genotype-specific frequencies
          for p.(Glu366Gly) homozygosity, not disease-level frequencies: a different biallelic SNIP1 genotype
          could present differently, and the source itself records substantial phenotypic variation between
          individuals including within sibships. Second, the shared genetic and environmental background
          of a founder community means unmeasured modifiers are shared, which can both inflate apparent
          consistency and mask features that a heterogeneous cohort would reveal. Third, ascertainment
          was clinic-based within two Plain-community practices, so mildly affected individuals may be
          systematically absent. No non-Amish case with biallelic SNIP1 variants has been published, so
          whether the entity looks the same elsewhere is simply unknown. Resolving this requires GeneMatcher-style
          ascertainment of biallelic SNIP1 cases outside the founder population.'
        proposed_experiments: null
      selected_evidence:
        snippet: Substantial phenotypic variation was observed between affected individ- uals, including
          within sibships
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
