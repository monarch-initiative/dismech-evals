  b898a568205883180ad02a7af486203cdf72b289054441f08e8d414cd0b89a40:
    claim:
      about:
        disease:
          name: SNIP1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: psychomotor retardation, epilepsy, and craniofacial dysmorphism
            term:
              id: MONDO:0013787
              label: psychomotor retardation, epilepsy, and craniofacial dysmorphism
        context: []
      assertion_type: Genetic
      assertion:
        name: SNIP1
        gene_term:
          preferred_term: SNIP1
          term:
            id: hgnc:30587
            label: SNIP1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Biallelic SNIP1 variants are the sole established cause of this disorder. MONDO:0013787
          carries a single RO:0004003 (has material basis in germline mutation in) relation, to HGNC:30587
          (SNIP1), which was re-verified against the MONDO release used for this curation.
        notes: 'SNIP1 (1p34.3) encodes a 396-amino-acid nuclear protein with an N-terminal nuclear localisation
          signal that binds Smad4 and CBP/p300, and a C-terminal forkhead-associated (FHA) domain. Every
          molecularly confirmed case reported to date is homozygous for the single Old Order Amish founder
          allele NM_024700.4:c.1097A>G, p.(Glu366Gly) in exon 4. No compound heterozygote and no second
          biallelic SNIP1 disease allele has been published, so allelic heterogeneity for this disorder
          is currently unknown rather than absent.

          Variant classification is not fully concordant across sources and is recorded rather than resolved
          here: the 2021 cohort authors assessed p.(Glu366Gly) as "pathogenic" under ACMG/AMP criteria,
          which is the quoted evidence below. A separate discrepancy concerns the FHA-domain boundary:
          PMID:34570759 places Glu366 "in close proximity to" the FHA domain and within the C-terminal
          30 amino acids, whereas PMID:41904131 treats E366G as an FHA-domain mutation. Both framings
          are cited in the pathophysiology section; the substantive point they agree on is that the residue
          governs FHA-dependent phosphopeptide binding.

          Named-entity caution. SNIP1 is easily confused in text search with SNAP25, SNRPN and the SNX
          gene family, none of which is related to this disorder. The token "SNIP" additionally collides
          with the B-SNIP psychosis consortium literature, which is unrelated. Separately, the large majority
          of the SNIP1 literature concerns TGF-beta/Smad signalling, NF-kappaB, c-MYC and cancer biology
          in cell lines with no bearing on the human neurodevelopmental disorder. Every citation in this
          entry was checked to confirm either that it reports the human SNIP1 disorder, or that it is
          cited explicitly as background molecular biology of the SNIP1 protein and is labelled as such
          in its explanation.'
        variants:
        - name: NM_024700.4:c.1097A>G p.(Glu366Gly) Old Order Amish founder allele
          description: The single founder allele underlying every molecularly confirmed case reported
            to date. It is a missense substitution in exon 4 of SNIP1 (Chr1:g.37537842T>C, hg38) replacing
            a conserved glutamate at residue 366 near the C-terminal forkhead-associated domain, and it
            was assessed as pathogenic under ACMG/AMP criteria by the cohort authors. Disease occurs in
            the homozygous state; no compound heterozygote has been published.
          gene:
            preferred_term: SNIP1
            term:
              id: hgnc:30587
              label: SNIP1
          type: missense_variant
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: present evidence to strongly support the pathogenicity of variants identified in TUBGCP6,
          BRAT1, SNIP1, CRADD, and HARS
        supports: SUPPORT
