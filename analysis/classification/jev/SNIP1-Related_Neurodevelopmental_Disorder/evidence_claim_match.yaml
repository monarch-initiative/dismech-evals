  d8fa8dda23d5978a077e39241508177017b23afddd6c9a01ec97c64612b8c920:
    claim:
      about:
        disease:
          name: SNIP1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: psychomotor retardation, epilepsy, and craniofacial dysmorphism
            term:
              id: MONDO:0013787
              label: psychomotor retardation, epilepsy, and craniofacial dysmorphism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic SNIP1 p.Glu366Gly Founder Substitution
        biological_scale: MOLECULAR
        description: 'Homozygosity for NM_024700.4:c.1097A>G, p.(Glu366Gly) in exon 4 of SNIP1 (1p34.3)
          is the single molecular lesion underlying every molecularly confirmed case. Glu366 lies in the
          conserved C-terminal 30 amino acids, immediately adjacent to the forkhead-associated (FHA) domain,
          within a low-complexity or intrinsically disordered region that is strongly conserved across
          species orthologues. The variant is a hypomorph rather than a null: Snip1 knockout mice are
          embryonic lethal, so a complete loss-of-function allele would not be compatible with the viable
          human phenotype.'
        genes:
        - preferred_term: SNIP1
          term:
            id: hgnc:30587
            label: SNIP1
        cellular_components:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
      selected_evidence:
        snippet: SNIP1 Glu366 is highly conserved and the p.Glu366Gly mutation is in the C-terminus where
          SNIP1 interacts with c-Myc
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
