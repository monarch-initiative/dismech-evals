        prevalence_class: ULTRA_RARE
        notes: 'Founder-population case count, NOT a general population rate. Fifty-one Old Order Amish
          individuals across 27 sibships had been identified at the time of the 2021 report, of whom 35
          were comprehensively clinically evaluated and 49 were molecularly confirmed homozygous. No affected
          individual outside the Amish has been reported with biallelic SNIP1 variants, so no worldwide
          prevalence estimate exists and none is asserted. An Orphanet/ORPHA-derived epidemiology record
          could not be generated for this entry because the structured-source data pins are stale and
          un-refreshable (tracked in #7622).'
      selected_evidence:
        snippet: A total of fifty-one Old Order Amish individuals were identified with SNIP1-related disorder,
          among 27 sibships
        supports: SUPPORT
