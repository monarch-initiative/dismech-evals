            term:
              id: MONDO:0013787
              label: psychomotor retardation, epilepsy, and craniofacial dysmorphism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neural Progenitor Cell Apoptosis and Reduced Neurogenesis
        biological_scale: CELLULAR
        description: 'The pivotal cellular hub of the neurological arm. SNIP1 promotes neural progenitor
          cell survival and neurogenesis, and the SNIP1-depleted brain exhibits dysplasia with robust
          induction of caspase-9-dependent apoptosis, i.e. death by the intrinsic mitochondrial pathway
          rather than by death receptors. The same convergence is reproduced in a second vertebrate by
          a completely different route: zebrafish RES-complex mutants, including snip1, show increased
          cell death in the brain and a decrease in differentiated neurons. Two independent organisms
          and two independent mechanistic entry points (PRC2 and splicing) therefore arrive at the same
          cellular lesion.'
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        - preferred_term: radial glial cell
          term:
            id: CL:0000681
            label: radial glial cell
        biological_processes:
        - preferred_term: intrinsic apoptotic signaling pathway
          term:
            id: GO:0097193
            label: intrinsic apoptotic signaling pathway
          modifier: INCREASED
        - preferred_term: cerebral cortex neuron differentiation
          term:
            id: GO:0021895
            label: cerebral cortex neuron differentiation
          modifier: DECREASED
        notes: Both supporting models are loss-of-function nulls (mouse conditional null, zebrafish mutant),
          not the human hypomorphic allele, and neither has been demonstrated in human tissue. The node
          is nonetheless curated as central because two independent organisms and two independent molecular
          entry points converge on it, and because it is the point at which PRC2 depletion rescues.
      selected_evidence:
        snippet: we report that Smad nuclear interacting protein 1 (SNIP1) promotes neural progenitor
          cell survival and neurogenesis and is, therefore, integral to brain development
        supports: SUPPORT
