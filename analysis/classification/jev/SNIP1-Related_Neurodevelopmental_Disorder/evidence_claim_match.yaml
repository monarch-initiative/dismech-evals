    claim:
      about:
        disease:
          name: SNIP1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: psychomotor retardation, epilepsy, and craniofacial dysmorphism
            term:
              id: MONDO:0013787
              label: psychomotor retardation, epilepsy, and craniofacial dysmorphism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Laryngeal and Pharyngeal Cartilage Development
        biological_scale: TISSUE
        description: 'Three quarters of individuals have upper airway abnormalities: laryngomalacia, pharyngomalacia
          and subglottic stenosis of variable severity, producing a weak cry, stridor and apnoea and occasionally
          requiring tracheostomy and home oxygen. The common feature of malacia and subglottic narrowing
          is inadequate laryngeal and pharyngeal cartilage support, and TGF-beta/BMP pathway disruption
          characteristically affects connective tissue and cartilage, which is why this node is placed
          downstream of the TGF-beta arm. The mechanism has not been demonstrated directly in this disorder
          and the placement is an inference, flagged as such below.'
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        notes: The causal placement of this node is inferred from the general connective tissue and cartilage
          consequences of TGF-beta/BMP pathway disruption, not demonstrated in SNIP1 patients or models.
          It is curated because the airway phenotype is frequent (75%) and clinically dominant in the
          neonatal period, and leaving it mechanistically unexplained would be a larger omission than
          an explicitly flagged inference.
      selected_evidence:
        snippet: Genetic variants leading to disruption of the TGF-β/BMP molecular sig- nalling pathway
          have been implicated in the pathogenesis of a number of inherited disorders, in particular connective
          tissue disorders associated with craniofacial (e.g. cleft palate and cra- niosynostosis), cardiovascular
          (e.g. aortic aneurysm and syndromic aortopathies), and muscu- loskeletal (e.g. disorders of
          endochondral ossification, bone growth, remodelling and limb development) outcomes
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/22
      evidence_path: /pathophysiology/22/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34570759
      reference_title: A biallelic SNIP1 Amish founder variant causes a recognizable neurodevelopmental
        disorder.
      evidence_source: HUMAN_CLINICAL
      explanation: The basis for placing the airway phenotype downstream of the TGF-beta arm. Marked PARTIAL
        because the quotation establishes that TGF-beta/BMP disruption causes connective tissue disease
        in general, not that it causes the airway malacia in this specific disorder.
