        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Heterozygous 1p34.3p34.2 contiguous gene deletion including SNIP1
        description: A de novo 2.3 Mb interstitial deletion at 1p34.3p34.2 encompassing 43 genes, including
          SNIP1, was reported in a 17-year-old female with global developmental delay, mild intellectual
          disability and multiple congenital anomalies. The authors concluded that SNIP1 haploinsufficiency
          was the most likely cause. This is the single most important named-entity distinction for this
          entry, because a naive search for "SNIP1 neurodevelopmental disorder" returns it alongside the
          recessive disorder.
        distinguishing_features:
        - Dosage - heterozygous whole-gene deletion versus biallelic missense hypomorphism. These are
          different genetic mechanisms and should not be pooled.
        - Severity - the deletion case had mild intellectual disability and no epilepsy reported, whereas
          the biallelic disorder has severe non-verbal developmental delay and universal intractable epilepsy.
        - Attribution - the deletion removes 43 genes and the authors could neither confirm SNIP1 as the
          driver nor exclude contributions from the other genes, so it does not establish a heterozygous
          SNIP1 phenotype.
        - Inheritance and counselling - de novo heterozygous CNV versus autosomal recessive with 25% sibling
          recurrence risk. Amish parents of an affected child are obligate heterozygotes and are unaffected,
          which is itself evidence against a clinically significant heterozygous phenotype in this population.
        notes: 'Not curated as a subtype of this entry. MONDO:0013787 is anchored to the autosomal recessive
          OMIM entity 614501; the heterozygous CNV is a separate contiguous-gene deletion syndrome. disease_term
          is also left unbound: MONDO has no term for a 1p34.3p34.2 contiguous deletion, and the nearest
          concepts are generic chromosomal-deletion groupings carrying no locus, which would assert less
          than this prose already does.'
      selected_evidence:
        snippet: Haploinsufficiency of the 1p34.3p34.2 region, including the SNIP1 gene and excluding
          the five genes listed above, is responsible for the neurocognitive delays and other symptoms
          as identified in our patient
        supports: SUPPORT
