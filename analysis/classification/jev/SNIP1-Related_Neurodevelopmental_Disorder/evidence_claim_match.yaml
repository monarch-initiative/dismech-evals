      assertion:
        name: Craniofacial spliceosomopathies
        notes: 'disease_term left unbound deliberately: this is a mechanism-defined CATEGORY (SF3B4/Nager,
          EFTUD2/mandibulofacial dysostosis-microcephaly, TXNL4A/Burn-McKeown and others), not a single
          entity. MONDO has no spliceosomopathy grouping term - a search for "spliceosomopathy" returns
          nothing - and binding one member such as MONDO:0007943 Nager acrofacial dysostosis would narrow
          the differential to one gene and misstate it.'
        description: Disruption of spliceosome components causes several neurodevelopmental disorders
          with craniofacial defects, specifically Guion-Almeida type mandibulofacial dysostosis (EFTUD2),
          Nager syndrome (SF3B4) and cerebrocostomandibular syndrome (SNRPB). These overlap with SNIP1-related
          disorder in midface hypoplasia, cleft palate, developmental delay, intellectual disability,
          congenital cardiac defects and scoliosis, and the overlap is mechanistically real rather than
          coincidental given SNIP1's spliceosomal role.
        distinguishing_features:
        - Causal gene differs (EFTUD2, SF3B4, SNRPB versus SNIP1); the diagnosis is molecular.
        - Inheritance - the classical craniofacial spliceosomopathies listed are dominant, usually de
          novo, whereas SNIP1-related disorder is autosomal recessive.
        - Epilepsy burden - universal intractable epilepsy from infancy is characteristic of the SNIP1
          disorder and is not a defining feature of the mandibulofacial dysostoses.
        - Calvarial phenotype - the irregular "lumpy" skull surface with variable calvarial thickness
          and a cortical ribbon that follows the skull contour is distinctive to the SNIP1 disorder.
      selected_evidence:
        snippet: Disrup- tion of spliceosome components have been associated with several neurodevelopmental
          disor- ders involving craniofacial defects, for example Guion-Almeida type mandibulofacial dysostosis,
          Nager syndrome, and cerebrocostomandibular syndrome, which also display sev- eral overlapping
          features with SNIP1-related disorder including midface hypoplasia, cleft pal- ate, developmental
          delay, intellectual disability, congenital cardiac defects and scoliosis
        supports: SUPPORT
