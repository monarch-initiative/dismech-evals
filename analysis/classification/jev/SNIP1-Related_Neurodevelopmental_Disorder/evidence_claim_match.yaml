            label: Autosomal recessive inheritance
        penetrance: COMPLETE
        expressivity: VARIABLE
        description: 'All reported affected individuals are homozygous for the same founder allele inherited
          from heterozygous parents; heterozygotes are unaffected. Penetrance is recorded as COMPLETE
          because segregation in 35 evaluated individuals showed all parents heterozygous, all unaffected
          siblings heterozygous or wild type, and no unaffected homozygote among more than 5000 Amish
          controls. Expressivity is nonetheless VARIABLE: substantial phenotypic variation was documented
          between affected individuals including within sibships, so the same genotype does not predict
          severity.'
