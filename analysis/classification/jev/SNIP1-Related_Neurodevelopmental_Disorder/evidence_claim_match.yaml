        name: Derepressed TGF-beta/Smad Transcriptional Output
        biological_scale: MOLECULAR
        description: With less SNIP1 available to restrain Smad4/p300 complex formation, TGF-beta pathway
          transcriptional output rises. Blood transcriptome analysis of six affected individuals found
          TGF-beta receptor signalling in epithelial-to-mesenchymal transition to be the single most overrepresented
          dysregulated Reactome pathway, and identified two downregulated TGF-beta pathway genes (BMPR1A
          and ACVR1C). Because disorders of TGF-beta/BMP signalling characteristically produce craniofacial,
          skeletal and cardiovascular malformation, this node is the most plausible mechanistic route
          to the non-neurological half of the syndrome.
        biological_processes:
        - preferred_term: transforming growth factor beta receptor signaling pathway
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: DYSREGULATED
