        description: The forkhead-associated (FHA) domain is a phosphothreonine/phosphoserine reader module.
          In the spliceosome cycle, CDK11 phosphorylates the threonine-proline repeats of SF3B1 during
          spliceosome activation, and the SNIP1 FHA domain recognises phosphorylated SF3B1. Disease-associated
          FHA domain mutations, explicitly including the neurodevelopmental disorder-associated E366G
          variant, impair that phosphopeptide binding. This is the most direct available molecular explanation
          of what the Amish allele actually breaks.
