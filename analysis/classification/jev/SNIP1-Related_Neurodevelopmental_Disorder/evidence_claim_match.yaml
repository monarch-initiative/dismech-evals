            term:
              id: MONDO:0013787
              label: psychomotor retardation, epilepsy, and craniofacial dysmorphism
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Neuroimaging at diagnosis
        description: 'Brain imaging is recommended at diagnosis. It is a high-yield investigation in this
          disorder: neuroimaging was available for 18 individuals in the founder cohort and all 18 were
          confirmed to have abnormalities, spanning hydrocephalus, ventriculomegaly, white matter abnormality,
          thin corpus callosum, hypomyelination, irregular cortical ribbon, Chiari malformation, absence
          of the septum pellucidum, hypoplastic optic nerves and septo-optic dysplasia. The findings are
          not pathognomonic, so imaging characterises the structural burden and directs management rather
          than establishing the diagnosis, which rests on molecular confirmation.'
        diagnosis_term:
          preferred_term: Neuroimaging
          term:
            id: NCIT:C173635
            label: Neuroimaging
        notes: Founder-cohort derived. The 18/18 yield is the proportion abnormal among those imaged within
          the Old Order Amish p.Glu366Gly kindred, not a sensitivity estimate for the disorder in general,
          and 18 is a subset of the 35 comprehensively evaluated individuals rather than the whole cohort.
          The source names neuroimaging generically and does not specify a modality, so the generic NCIT
          Neuroimaging term is used rather than an MRI-specific one, even though MRI is the modality actually
          reported in both published series. No follow-up interval is specified, so no surveillance schedule
          is asserted.
      selected_evidence:
        snippet: Neuroimaging should be performed at diagnosis, and echocardiogram should be undertaken
          to screen for congenital heart defects
        supports: SUPPORT
