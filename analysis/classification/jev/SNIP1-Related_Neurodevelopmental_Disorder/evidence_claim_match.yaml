            term:
              id: MONDO:0013787
              label: psychomotor retardation, epilepsy, and craniofacial dysmorphism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neonatal Feeding Failure and Aspiration Risk
        biological_scale: ORGANISM
        description: 'Poor feeding in the neonatal period is universal, and pulmonary aspiration with
          or without a gastrostomy tube affects 46%. This is the single most actionable node in the entry:
          elective gastrostomy is one of two interventions the cohort authors single out as able to reduce
          hospitalisations, alleviate suffering and prolong life. The proximate mechanism is not established,
          and more than one contributor is plausible (central hypotonia with poor suck and swallow coordination,
          upper airway malacia, and gastroesophageal reflux are all documented in the same individuals),
          so no single mechanism is asserted.'
        notes: The proximate mechanism of feeding failure is deliberately left unasserted. Neither published
          source attributes it to a specific cause, and hypotonia, airway malacia and reflux are each
          independently documented in the cohort. An earlier revision wired this node to Small for Gestational
          Age; that edge was removed because small-for-gestational-age status is determined at birth and
          cannot be caused by a postnatal event. The retained IUGR snippet documents co-occurrence of
          prenatal growth restriction with postnatal failure to thrive, not causation in either direction,
          so Small for Gestational Age is now left unwired.
      selected_evidence:
        snippet: Poor feeding in the neonatal period is universal and many require a gastrostomy tube
          to both aid nutrition and reduce risk of aspiration pneumonia
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/24
