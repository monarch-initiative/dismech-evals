        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: snip1_which_arm_drives_disease
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the human phenotype driven predominantly by the spliceosomal (RES recruitment) arm
          of SNIP1 function or by the transcriptional co-regulation (CBP/p300, TGF-beta, NF-kappaB, c-MYC)
          arm?
        attaches_to:
        - pathophysiology#Impaired SNIP1 FHA-Domain Phosphopeptide Recognition
        - pathophysiology#Disrupted SNIP1 Co-Regulation of CBP/p300-Dependent Transcription
        rationale: 'The entry deliberately curates both arms as parallel branches from the same upstream
          dosage lesion because the evidence does not yet adjudicate between them. The splicing arm now
          has the more direct evidence: the E366G variant is shown by name to impair FHA-domain binding
          to phosphorylated SF3B1 and thereby RES recruitment (PMID:41904131), which is the only published
          experiment on the actual disease allele in its actual molecular context. The transcriptional
          arm has stronger patient-derived correlative support: TGF-beta receptor signalling in epithelial-to-mesenchymal
          transition was the most overrepresented dysregulated Reactome pathway in patient blood (PMID:34570759).
          But the patient transcriptome study is limited by a sample size of six, by blood as a surrogate
          for brain, and by an FDR at the pathway level of 0.43, and the authors state the tissue limitation
          explicitly. Critically, the two arms are not independent: reduced SNIP1 protein abundance (PMID:22279524)
          degrades both simultaneously, so a clean dissociation would require a separation-of-function
          allele that has not been reported.'
        proposed_experiments: null
      selected_evidence:
        snippet: Mutations in SNIP1 FHA domain, including the neurodevelopmental disorder-associated E366G
          variant, impair P-SF3B1 binding, pre-mRNA splicing, and cell viability
        supports: SUPPORT
