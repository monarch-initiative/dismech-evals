  37ccee1e364ac9ebb339eda4316179ed1a1cbe2c2bc63d191c084299977db7cb:
    claim:
      about:
        disease:
          name: SNIP1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: psychomotor retardation, epilepsy, and craniofacial dysmorphism
            term:
              id: MONDO:0013787
              label: psychomotor retardation, epilepsy, and craniofacial dysmorphism
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: snip1_null_vs_hypomorph_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do conclusions drawn from Snip1-null mouse and zebrafish models transfer to a human hypomorphic
          allele that is compatible with survival to adulthood?
        attaches_to:
        - pathophysiology#Neural Progenitor Cell Apoptosis and Reduced Neurogenesis
        - pathophysiology#Aberrant PRC2 Genomic Occupancy and H3K27me3 Turnover
        - pathophysiology#Biallelic SNIP1 p.Glu366Gly Founder Substitution
        rationale: 'Every in vivo model of SNIP1 loss published to date is a null or conditional null.
          Snip1 null mice are embryonic lethal; zebrafish RES-component mutants including snip1 fail in
          early embryogenesis. Humans homozygous for p.(Glu366Gly) survive, in the reported cohort to
          at least 30 years. That contrast is exactly the reason the human allele is inferred to be hypomorphic,
          but it also means the models are directionally informative and quantitatively wrong: the cellular
          lesion they demonstrate (neural progenitor apoptosis, reduced neurogenesis) is almost certainly
          the right lesion, while its magnitude, timing and tissue distribution in a patient are not established
          by them. Three further limits: the Nestin-Cre deletion is neural-restricted and therefore cannot
          model the craniofacial, calvarial, cardiac, airway or endocrine components that make this a
          recognisable multisystem syndrome; embryonic lethality precludes modelling epilepsy, the single
          most disabling human feature; and the PRC2-depletion rescue was performed in a null background
          during embryogenesis. Resolving the mismatch needs a p.(Glu366Gly) knock-in animal, or patient-derived
          iPSC cortical organoids, neither of which has been published.'
        proposed_experiments:
        - experiment_id: exp_snip1_e366g_knockin_mouse
          name: Snip1 p.Glu366Gly knock-in mouse with multisystem phenotyping
          description: 'Generate a constitutive Snip1 p.Glu366Gly knock-in mouse on a defined background
            and phenotype it for the features that null models cannot reach: postnatal survival, video-EEG
            for spontaneous seizures, craniofacial and calvarial micro-CT for suture patency and calvarial
            surface irregularity, echocardiography for septal and outflow lesions, and developmental milestone
            testing. Compare homozygotes, heterozygotes and wild-type littermates.'
          decision_criterion: Whether homozygous knock-in animals survive to weaning and reproduce any
