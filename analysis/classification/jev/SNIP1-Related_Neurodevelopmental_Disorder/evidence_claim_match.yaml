        biological_scale: TISSUE
        description: 'Three quarters of individuals have upper airway abnormalities: laryngomalacia, pharyngomalacia
          and subglottic stenosis of variable severity, producing a weak cry, stridor and apnoea and occasionally
          requiring tracheostomy and home oxygen. The common feature of malacia and subglottic narrowing
          is inadequate laryngeal and pharyngeal cartilage support, and TGF-beta/BMP pathway disruption
          characteristically affects connective tissue and cartilage, which is why this node is placed
          downstream of the TGF-beta arm. The mechanism has not been demonstrated directly in this disorder
          and the placement is an inference, flagged as such below.'
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        notes: The causal placement of this node is inferred from the general connective tissue and cartilage
          consequences of TGF-beta/BMP pathway disruption, not demonstrated in SNIP1 patients or models.
          It is curated because the airway phenotype is frequent (75%) and clinically dominant in the
          neonatal period, and leaving it mechanistically unexplained would be a larger omission than
          an explicitly flagged inference.
      selected_evidence:
        snippet: Affected individuals commonly displayed upper airway respiratory difficulties in the
          neonatal period, including laryngomalacia, pharyngomalacia and subglottic stenosis of var- iable
          severity, causing a weak cry, stridor and apnea, occasionally requiring tracheostomy and supplementary
          home oxygen
