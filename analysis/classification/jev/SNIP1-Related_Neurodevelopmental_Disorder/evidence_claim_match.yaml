      assertion_type: Prevalence
      assertion:
        population: Old Order Amish carrier screening (in-house control database, >5000 individuals)
        measure_type: CARRIER_FREQUENCY
        prevalence_class: ABOVE_1_IN_1000
        notes: 'Carrier (heterozygote) allele frequency of the founder allele in the Amish, reported as
          a range across settlements: 0.5% in the Pennsylvania Amish and 1.4% in the Ohio/Indiana/Wisconsin
          Amish. These are ALLELE frequencies in a founder population and must not be read as disease
          prevalence or as generalisable carrier rates. The prevalence_class band records only that the
          allele is common in this specific population. For contrast, the same allele has a gnomAD v3.1
          frequency of 0.001% with 11 heterozygotes (10 of them Amish) and no homozygotes.'
      selected_evidence:
        snippet: p.(Glu366Gly) variant is present at an allele frequency of between 0.5% (Pennsylvania
          Amish) and 1.4% (Ohio/Indiana/Wiscon sin Amish) in this founder population, with no unaffected
          individuals being homozygous for this variant
