              label: psychomotor retardation, epilepsy, and craniofacial dysmorphism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Derepressed NF-kappaB Transcriptional Output
        biological_scale: MOLECULAR
        description: SNIP1 normally competes with the RelA subunit of NF-kappaB for the C/H1 domain of
          CBP/p300. Reduced SNIP1 therefore raises NF-kappaB-dependent transcription. Two consequences
          are relevant here. In brain, inappropriate increases in NF-kappaB signalling have been shown
          to initiate epileptogenesis in mouse. In heart, SNIP1 deficiency worsens pressure-overload hypertrophy
          through NF-kappaB, and blocking NF-kappaB rescues it, which is notable because left ventricular
          non-compaction occurs in this disorder.
        biological_processes:
        - preferred_term: canonical NF-kappaB signal transduction
          term:
            id: GO:0007249
            label: canonical NF-kappaB signal transduction
          modifier: INCREASED
      selected_evidence:
        snippet: Inappropriate increases in TGF- b/Smad2 signaling and in NF- kB signaling in the mouse
          brain have been shown to independently initiate epileptogenesis
        supports: SUPPORT
