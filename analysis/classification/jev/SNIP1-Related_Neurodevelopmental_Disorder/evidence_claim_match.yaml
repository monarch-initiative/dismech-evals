  a3c626d56d2f2c61bb806b62da37239041549e427d7301aa8826d7697bd35998:
    claim:
      about:
        disease:
          name: SNIP1-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: psychomotor retardation, epilepsy, and craniofacial dysmorphism
            term:
              id: MONDO:0013787
              label: psychomotor retardation, epilepsy, and craniofacial dysmorphism
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant PRC2 Genomic Occupancy and H3K27me3 Turnover
        biological_scale: MOLECULAR
        description: 'A third, epigenetic arm of SNIP1 function, established in mouse neural-progenitor-specific
          knockout. SNIP1 facilitates the genomic occupancy of the Polycomb repressive complex PRC2 and
          instructs H3K27me3 turnover at target genes; the SNIP1 target genes concerned are ones that
          promote cell survival and neurogenesis, and SNIP1 activity at them is itself influenced by TGF-beta
          and NF-kappaB signalling, which ties this arm back to the transcriptional co-regulation arm.
          Loss of this function mislocalises repressive H3K27 marks and silences a survival programme.
          The decisive evidence is a rescue: depleting PRC2 is sufficient to reduce apoptosis and brain
          dysplasia in the SNIP1-depleted brain.'
        protein_complexes:
        - preferred_term: PcG protein complex
          term:
            id: GO:0031519
            label: PcG protein complex
          modifier: DYSREGULATED
        molecular_functions:
        - preferred_term: histone H3K27 trimethyltransferase activity
          term:
            id: GO:0140951
            label: histone H3K27 trimethyltransferase activity
          modifier: DYSREGULATED
        notes: Entirely mouse-derived and obtained in a conditional NULL background (Nestin-Cre Snip1
          knockout), not with the human hypomorphic p.(Glu366Gly) allele. See the snip1_null_vs_hypomorph_model_mismatch
          discussion.
      selected_evidence:
        snippet: Further, SNIP1 facilitates the genomic occupancy of Polycomb complex PRC2 and instructs
          H3K27me3 turnover at target genes
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
      evidence_path: /pathophysiology/9/evidence/0
