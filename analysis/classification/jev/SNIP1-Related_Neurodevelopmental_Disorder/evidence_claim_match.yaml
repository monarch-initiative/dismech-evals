      assertion_type: Discussion
      assertion:
        discussion_id: snip1_neurodegeneration_question
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Does SNIP1-related disorder include a genuine progressive neurodegenerative component,
          or is all apparent progression seizure-related secondary injury?
        attaches_to:
        - pathophysiology#Detained-Intron Splicing Brake Dysregulation in Neurons
        - pathophysiology#Status Epilepticus
        - pathophysiology#Hypoxic-Ischaemic Secondary Brain Injury
        rationale: 'Conditional Snip1 deletion in mouse cerebellum decreases detained-intron splicing
          efficiency and causes frank neurodegeneration (PMID:37027487), raising the possibility that
          the human hypomorph also drives slow neuronal loss. Against that, the human clinical description
          attributes regression and the late spastic quadriplegic picture to hypoxic injury from long-term
          untreated or unrecognised seizures rather than to intrinsic degeneration, and survivors reach
          30 years of age. No longitudinal imaging or neuropathology in genotyped individuals has been
          published, so the two explanations are not yet separable. This distinction is not academic:
          it determines whether aggressive early seizure control should be expected to preserve trajectory
          (secondary injury model) or merely to slow it (degenerative model).'
        proposed_experiments: null
      selected_evidence:
        snippet: Snip1 conditional knockout in the cerebellum decreases DI splicing efficiency and causes
          neurodegeneration
        supports: SUPPORT
