      assertion:
        name: Defective 5' Splice-Site Recognition with Cryptic Site Use
        conforms_to: spliceosome_component_dysfunction#Mis-Splicing of a Sensitive Transcript Subset
        description: In human cells, losing wild-type Brr2 increases use of a cryptic 5' splice site at
          the expense of the correct one, and the RP mutants cannot restore correct site choice, so the
          variants impair Brr2's role in 5' splice-site recognition. Which retinal transcripts are affected
          has not been mapped.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: mRNA 5'-splice site recognition
          term:
            id: GO:0000395
            label: mRNA 5'-splice site recognition
          modifier: ABNORMAL
      selected_evidence:
        snippet: Proper splicing of optimal and cryptic splice sites was restored in cells expressing
          BRR2-wt but not in cells expressing RP mutants.
        supports: SUPPORT
