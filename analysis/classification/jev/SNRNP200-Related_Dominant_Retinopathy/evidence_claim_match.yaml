      assertion:
        name: Impaired Brr2 U4/U6 Unwinding
        description: RP variants weaken Brr2 RNA binding, ATPase and helicase activity and alter how Brr2
          contacts U4 and U6 in the spliceosome, so U4/U6 is unwound inefficiently at activation. The
          mutant protein still assembles into snRNPs and spliceosomes, so this is an altered-function
          defect within the machine rather than a shortage of it.
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: Brr2 RNA helicase activity
          term:
            id: GO:0003724
            label: RNA helicase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: U4/U6 release during spliceosome activation
          term:
            id: GO:0000388
            label: spliceosome conformational change to release U4 (or U4atac) and U1 (or U11)
          modifier: DECREASED
      selected_evidence:
        snippet: The Δ247-Brr2 RP mutants exhibit a gradient of severity of weakened RNA binding, reduced
          helicase activity, and reduced ATPase activity compared with wild type Δ247-Brr2.
        supports: SUPPORT
