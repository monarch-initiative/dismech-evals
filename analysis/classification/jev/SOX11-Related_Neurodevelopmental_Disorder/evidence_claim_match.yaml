          as a RELATED synonym and is the canonical SOX2 disorder. It is not bound here because its primary
          label, "anophthalmia/microphthalmia-esophageal atresia syndrome", foregrounds a feature (oesophageal
          atresia) that is not what makes SOX2 a differential for this entry; binding it would overstate
          the resemblance. Recorded explicitly so the next curator is not told to stop looking for a term
          that does exist.
        description: SOX2 haploinsufficiency causes anophthalmia/microphthalmia with developmental delay.
          Because SOX11 loss can also produce microphthalmia and developmental delay, SOX2 is a realistic
          clinical and named-entity confusion, but SOX2 belongs to the SoxB1 group and is a different
          gene at a different locus.
        distinguishing_features:
        - Severe bilateral anophthalmia is characteristic of SOX2 and is not a feature of SOX11-related
          disorder, in which ocular malformation is infrequent and usually milder.
        - Fifth-digit nail/phalanx hypoplasia, hypogonadotropic hypogonadism with olfactory bulb hypoplasia,
          and the SOX11 episignature point to SOX11.
