      assertion:
        name: Autosomal dominant SOX11 haploinsufficiency
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        expressivity: VARIABLE
        de_novo_rate: Most reported pathogenic SOX11 variants are de novo; in a systematic review of SOX11-related
          hypogonadotropic hypogonadism, 15 of 18 variants with parental testing were proven de novo.
          Rare transmission from a mildly affected parent has been documented.
        description: Heterozygous loss of SOX11 function (intragenic point variants or whole-gene 2p25.2
          deletion) is sufficient to cause disease, indicating that the paralogous SoxC factors SOX4 and
          SOX12 cannot compensate for reduced SOX11 dosage in human neurodevelopment.
      selected_evidence:
        snippet: Thirty unique variants were identified, 17/30 clustering within the HMG domain and 15/18
          proven de-novo.
        supports: SUPPORT
