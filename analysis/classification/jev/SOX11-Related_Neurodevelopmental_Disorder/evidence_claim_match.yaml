  eb16832fe4c204c347d55968c9460d4d90a6ea292a76adbff15c599003179f29:
    claim:
      about:
        disease:
          name: SOX11-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: intellectual developmental disorder with microcephaly and with or without
              ocular malformations or hypogonadotropic hypogonadism
            term:
              id: MONDO:0014376
              label: intellectual developmental disorder with microcephaly and with or without ocular
                malformations or hypogonadotropic hypogonadism
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sox11_dosage_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the homozygous-null and morpholino knockdown models used for SOX11 faithfully represent
          the human heterozygous loss-of-function state?
        attaches_to:
        - pathophysiology#Reduced Cortical Neurogenesis and Brain Growth
        - pathophysiology#Impaired Cochlear Nerve Development
        - pathophysiology#Disrupted Nephrogenic Gdnf Domain Restriction
        - pathophysiology#Mandibular Hypoplasia with Secondary Palatal Shelf Obstruction
        rationale: 'Much of the mechanistic evidence for the microcephaly and cochlear-nerve arms comes
          from homozygous Sox11-null mice, zebrafish sox11a/b double morphants, and Xenopus morphants
          - all effectively complete loss of function - whereas human disease is heterozygous. Tsurusaki
          et al. note that physical and functional abnormalities in heterozygous mice have not been described.
          The dosage mismatch is partly mitigated by the isogenic SOX11+/- human embryonic stem cell model
          (PMID:31035284), which is the strongest dosage-matched evidence available, but that model is
          in vitro. The same zygosity caveat applies to the organ arms added from the deep research: the
          duplex-kidney and secondary-cleft-palate mechanisms come from Sox11 whole-gene-deletion mice,
          and the corresponding human findings in heterozygotes are milder (small or malrotated kidney;
          cleft palate in a single reported individual). The C. elegans model is explicit that the orthologous
          Y116C change is recessive, which is itself a dosage mismatch with the dominant human disease
          even though it supports the loss-of-function interpretation.'
        proposed_experiments:
        - experiment_id: sox11_het_mouse_deep_phenotyping
          name: Deep phenotyping of Sox11 heterozygous mice
          description: Characterise head size, cortical neuron number, and auditory brainstem response
            in Sox11 heterozygous mice, the dosage-matched in vivo model that has not previously been
            assessed.
          decision_criterion: Reduced brain size, reduced cortical neuron number, or elevated ABR thresholds
            in heterozygotes relative to littermate controls would confirm that single-copy loss is sufficient
            in vivo.
        - experiment_id: sox11_het_organoid
          name: Isogenic SOX11+/- human cerebral organoids
          description: Extend the existing two-dimensional isogenic SOX11+/- human embryonic stem cell
            model to three-dimensional cerebral organoids to test whether heterozygous dosage alone reduces
            neuron output in a human cortical context that includes outer radial glia.
          decision_criterion: Reduced organoid size and cortical neuron output in SOX11+/- versus isogenic
            wild-type organoids.
      selected_evidence:
        snippet: Physical and functional abnormalities in hetero- zygotes have not been described.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24886874
      reference_title: De novo SOX11 mutations cause Coffin-Siris syndrome.
      evidence_source: MODEL_ORGANISM
      explanation: States directly that the heterozygous mouse - the dosage-matched model - has not been
        characterised, which is the substance of the mismatch.
