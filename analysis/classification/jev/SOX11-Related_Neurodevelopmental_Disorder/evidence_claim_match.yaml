        description: 'Roughly half the normal amount of functional SOX11 activity remains. This is a pure
          dosage lesion, not a dominant-negative one: disease missense proteins still localise correctly
          to the nucleus, and the recurrent Y116C change behaves as a recessive loss of function when
          modelled at the orthologous residue in Caenorhabditis elegans. Critically, the paralogous SoxC
          factors SOX4 and SOX12 do not compensate in humans. SOX11 protein abundance is also set post-translationally
          by USP11-mediated deubiquitination, an independent route to functional SOX11 insufficiency.'
        molecular_functions:
