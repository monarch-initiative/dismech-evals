      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing for a heterozygous SOX11 variant
        description: SOX11-related neurodevelopmental disorder is a genotype-first diagnosis. There is
          no biochemical marker and the facial gestalt is explicitly non-specific, so identification of
          a heterozygous pathogenic SOX11 variant by multigene panel or exome/genome sequencing is the
          confirmatory test. SOX11 is one of the genes in which a pathogenic variant establishes the Coffin-Siris
          syndrome diagnosis per GeneReviews, although the SOX11 entity is now recognised as clinically
          and epigenetically distinct from the BAF core-subunit BAFopathies (see differential_diagnoses).
        diagnosis_term:
          preferred_term: Genetic Testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        notes: SOX11 is a single-exon gene, so exome-based CNV callers with poor single-exon sensitivity
          may miss an intragenic deletion; the single-exon architecture is evidenced in the genetic section.
          No frequency of diagnostic yield is asserted because no SOX11-specific yield study exists.
      selected_evidence:
        snippet: We used array based comparative genomic hybridisation and trio exome sequencing to identify
          children with intellectual disability who have deletions or de novo point mutations disrupting
          SOX11.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/1
      context_paths:
