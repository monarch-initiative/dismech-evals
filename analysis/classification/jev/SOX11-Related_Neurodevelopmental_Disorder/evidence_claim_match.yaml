  0978aeb8170d1389a96f13642e9c15acb2d662b3fb93c62fec2a307182fa40bb:
    claim:
      about:
        disease:
          name: SOX11-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: intellectual developmental disorder with microcephaly and with or without
              ocular malformations or hypogonadotropic hypogonadism
            term:
              id: MONDO:0014376
              label: intellectual developmental disorder with microcephaly and with or without ocular
                malformations or hypogonadotropic hypogonadism
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Coffin-Siris syndrome due to BAF (SWI/SNF) core-subunit variants
        description: 'Classical Coffin-Siris syndrome is caused by heterozygous variants in genes encoding
          subunits of the BAF/SWI-SNF chromatin remodelling complex (ARID1A, ARID1B, ARID2, DPF2, SMARCA4,
          SMARCB1, SMARCC2, SMARCD1, SMARCE1, BICRA) plus PHF6. SOX11 shares the clinical label "Coffin-Siris
          syndrome 9" but is a transcription factor acting DOWNSTREAM of the PAX6-BAF complex, not a component
          of it. This is the single most important named-entity distinction for this entry: BAF core-subunit
          cohort phenotype data must NOT be attributed to SOX11.'
        distinguishing_features:
        - Molecular criterion - the causal variant is in SOX11 (2p25.2), not in a BAF subunit gene; SOX11
          and BAF-subunit variants are mutually exclusive in Coffin-Siris cohorts.
        - Episignature - blood DNA methylation profiling separates SOX11 syndrome from the BAFopathies.
        - Mechanism - SOX11 is transcriptionally downstream of the PAX6-BAF complex (BRG1/SMARCA4 binds
          the SOX11 promoter), so SOX11 loss is a narrower lesion than loss of the remodeller itself.
        - Severity - BAF core-subunit disease tends to be more severe; SOX11 accounts for only about 2%
          of Coffin-Siris cohorts and clusters at the milder dysmorphic end while carrying a heavier microcephaly
          burden.
        - Epilepsy burden - GeneReviews reports epilepsy in about half of Coffin-Siris syndrome overall,
          whereas epilepsy is distinctly uncommon in reported SOX11 cohorts. Importing the Coffin-Siris
          epilepsy frequency into a SOX11 entry would materially misstate the phenotype, so no epilepsy
          frequency is curated here.
        - Coarse facies - coarse facial features are a hallmark of ARID1B Coffin-Siris syndrome and are
          characteristically absent in SOX11 disease, making facial gestalt a discriminator in the opposite
          direction to the historical CSS9 label.
        - Cancer surveillance - the ARID1A-specific AFP/hepatoblastoma surveillance recommendation in
          the Coffin-Siris GeneReviews chapter is gene-specific and is deliberately NOT applied to SOX11;
          no cancer predisposition has been reported with germline SOX11 variants.
        - Direction of the SOX11-BAF relationship is not fixed - in germline neurodevelopmental disease
          SOX11 sits downstream of PAX6-BAF, whereas in adrenergic neuroblastoma SOX11 acts upstream of
          and regulates SWI/SNF core components including SMARCA4 and ARID1A. The somatic over-expression
          biology is separate and must not be imported into this germline entry.
        notes: 'MONDO:0014376 is currently modelled as is_a MONDO:0015452 (Coffin-Siris syndrome). This
          entry retains MONDO:0014376 as its anchor but curates the SOX11 entity in its own right and
          does not inherit BAF-subunit cohort data. For the same reason disease_term is deliberately left
          UNBOUND on this differential: MONDO:0015452 is this entry''s own superclass, so binding it would
          make the entry machine-assert its ancestor as a differential diagnosis. The prose here concerns
          the BAF core-subunit SIBLINGS (ARID1B, SMARCB1, SMARCA4, ARID1A), which the grouping term does
          not isolate, and binding a single subtype such as MONDO:0007617 would narrow the differential
          to one gene and misstate it in the other direction.'
      selected_evidence:
        snippet: SOX11 syndrome is a distinct clinical entity with characteristic clinical features and
          episignature differentiating it from BAFopathies.
        supports: SUPPORT
    origin:
