        notes: The episignature was derived from a small training set and the published per-probe detail
          (224 differentially methylated probes, methylation variant pathogenicity score, 10 cases vs
          50 matched controls) sits in the paper's body text. Only the abstract of PMID:35341651 is obtainable
          - a re-fetch on 2026-07-31 returned content_type abstract_only despite PMCID PMC9245088 - so
          those numbers are deliberately not asserted here rather than quoted from an unverifiable source.
          No sensitivity or specificity figure is asserted for the same reason.
      selected_evidence:
        snippet: A distinctive pattern of blood DNA methylation was identified in SOX11 syndrome, separating
          SOX11 syndrome from other BAFopathies.
