      assertion:
        name: SOX11
        gene_term:
          preferred_term: SOX11
          term:
            id: hgnc:11191
            label: SOX11
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        association: Heterozygous pathogenic variants in SOX11 are the sole established cause of this
          disorder. The MONDO anchor MONDO:0014376 carries a single RO:0004003 (has material basis in
          germline mutation in) relation to HGNC:11191 (SOX11).
        notes: 'SOX11 (2p25.2) is a single-exon gene encoding a 441-amino-acid SoxC-group transcription
          factor. Pathogenic variation comprises de novo missense variants clustering in the HMG DNA-binding
          domain, truncating (nonsense and frameshift) variants, in-frame deletions, and whole-gene 2p25.2
          microdeletions. Because SOX11 is single-exon, truncating transcripts may escape nonsense-mediated
          decay, but the predicted proteins lack or disrupt the HMG domain and cannot bind DNA.

          SOX11 is genomically and functionally adjacent to two entities that must not be conflated with
          it: SOX4 (the closest SoxC paralogue, itself a Coffin-Siris-spectrum gene) and SOX2 (anophthalmia
          syndrome). Every citation in this entry was checked to confirm the reported gene is SOX11.'
      selected_evidence:
        snippet: we apply whole-exome sequencing (WES) to 92 CSS patients, and identify two de novo SOX11
          mutations in two unrelated patients.
        supports: SUPPORT
    origin:
