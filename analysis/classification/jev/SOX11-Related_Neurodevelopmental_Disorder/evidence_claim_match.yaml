          episignature that separates SOX11 syndrome from the BAF (SWI/SNF) core-subunit BAFopathies with
          which it is clinically confused. It is used both to confirm the diagnosis and to reclassify
          variants of uncertain significance. This assay is the discriminator the entity boundary rests
          on, and is modelled here as a diagnostic in addition to its pathophysiology node.
        diagnosis_term:
