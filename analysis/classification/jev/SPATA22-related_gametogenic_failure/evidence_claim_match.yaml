              label: premature ovarian failure 25
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of MEIOB-SPATA22 single-stranded DNA binding
        conforms_to: meiotic_prophase_failure#Homologous Recombination Repair of Meiotic DNA Breaks
        biological_scale: MOLECULAR
        description: 'SPATA22 and MEIOB form an obligate meiosis-specific heterodimer that resembles RPA,
          binds single-stranded DNA and associates with RPA-coated single-stranded DNA at resected meiotic
          double-strand breaks. Purified human SPATA22 binds single-stranded DNA on its own, and the heterodimer
          binds it more strongly than either protein alone. The two proteins stabilize each other: Spata22-null
          meiocytes fail to localize MEIOB and make less of it, and the patient frameshift c.203del abolishes
          the SPATA22-MEIOB interaction. Biallelic SPATA22 loss therefore removes the complex from recombination
          intermediates.'
        genes:
        - preferred_term: SPATA22
          term:
            id: hgnc:30705
            label: SPATA22
        - preferred_term: MEIOB
          term:
            id: hgnc:28569
            label: MEIOB
        molecular_functions:
        - preferred_term: single-stranded DNA binding
          term:
            id: GO:0003697
            label: single-stranded DNA binding
          modifier: DECREASED
      selected_evidence:
        snippet: The results show that hMEIOB has low ssDNA-binding affinity and stability alone, but
          hSPATA22 binds to ssDNA faster and more stably and promotes ssDNA condensation. Strong binding
          affinity and stability to ssDNA are present when the hMEIOB-hSPATA22 heterodimer is formed.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40296718
      reference_title: New feature of hMEIOB and hSPATA22 binding to ssDNA from a single-molecule perspective.
      evidence_source: IN_VITRO
      explanation: Confirms single-stranded DNA binding by the human SPATA22 protein and by the MEIOB-SPATA22
        heterodimer.
