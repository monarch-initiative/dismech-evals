        association: Causative (Primary)
        relationship_type: CAUSATIVE
        notes: 'SPATA22 encodes a germ-cell-specific partner of MEIOB. Three biallelic families or probands
          are published with phase-consistent genotypes (PMID:35285020: one consanguineous homozygous
          family and one sporadic compound heterozygote; PMID:34392356: one consanguineous homozygous
          family). A fourth pedigree (PMID:42098781) carries the same two variants as the PMID:35285020
          compound heterozygote with phase not reported, so it is probably a further biallelic family.
          No ClinGen gene-disease validity classification was found for this pair, so gene_disease_validity
          is left absent.'
      selected_evidence:
        snippet: Thus, this is the first report identifying SPATA22 as the causative gene for human POI.
        supports: SUPPORT
