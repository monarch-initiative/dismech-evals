  e6daf6ba9adf301135b47da3779afb7471a4131de6a68bd17e693678d8c07ee3:
    claim:
      about:
        disease:
          name: SPOP-Related Neurodevelopmental Disorder
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: bet_bidirectional_dysregulation
        hypothesis_label: Bidirectional BET protein dysregulation drives the contrasting phenotypes
        status: EMERGING
        description: 'The two clinical types track with opposite functional effects of SPOP variants on
          substrate ubiquitination, measured on BET proteins (BRD2/BRD3/BRD4) in Ishikawa cells and EBV-immortalized
          patient PBMC lines: gain-of-function variants deplete BET proteins (type 1, microcephaly) while
          dominant-negative variants stabilize them (type 2, macrocephaly). Whether BET dysregulation
          itself, or dysregulation of other SPOP substrates, is the proximate driver of abnormal human
          brain development has not been established in neural cells or in vivo.'
      selected_evidence:
        snippet: Our findings suggest that these opposite functional effects caused by the variants in
          SPOP result in two distinct and clinically recognizable syndromic forms of intellectual disability
          with contrasting craniofacial dysmorphisms.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:32109420
      reference_title: De Novo Variants in SPOP Cause Two Clinically Distinct Neurodevelopmental Disorders.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The genotype-phenotype correlation at the core of the hypothesis: opposite biochemical
        effects segregate with opposite craniofacial phenotypes.'
