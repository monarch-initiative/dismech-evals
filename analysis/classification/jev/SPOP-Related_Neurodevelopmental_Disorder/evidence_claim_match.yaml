            id: hgnc:11254
            label: SPOP
      selected_evidence:
        snippet: Two individuals shared craniofacial dysmorphisms, including congenital microcephaly,
          that were strikingly different from those of the other five individuals, who had (relative)
          macrocephaly and hypertelorism.
        supports: SUPPORT
