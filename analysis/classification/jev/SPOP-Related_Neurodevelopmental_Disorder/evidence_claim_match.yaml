              cancer (dominant-negative class) and endometrial cancer (gain-of-function class). The germline
              NSDVS variants overlap these functional classes (e.g. p.Arg121Gln is an endometrial-type
              gain-of-function change), but the cancers are somatic, non-heritable processes and are not
