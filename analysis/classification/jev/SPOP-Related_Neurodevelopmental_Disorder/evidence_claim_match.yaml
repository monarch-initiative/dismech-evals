            label: neurodevelopmental disorder with microcephaly and dysmorphic facies
        description: NSDVS type 1 (OMIM:618828) is caused by gain-of-function SPOP variants (e.g. p.Arg121Gln,
          p.Asp144Asn) that increase SPOP-mediated substrate degradation. The craniofacial phenotype includes
          congenital microcephaly, narrow forehead, highly arched eyebrows, and blepharophimosis; hearing
          loss and ocular abnormalities are recurrent.
        genes:
