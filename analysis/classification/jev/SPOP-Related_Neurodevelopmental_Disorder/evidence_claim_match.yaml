  8109dba6a35e7beee40af5422d159a677736c9dc3e559e9c9ae7086d648c5651:
    claim:
      about:
        disease:
          name: SPOP-Related Neurodevelopmental Disorder
        context: []
      assertion_type: Genetic
      assertion:
        name: SPOP
        gene_term:
          preferred_term: SPOP
          term:
            id: hgnc:11254
            label: SPOP
        relationship_type: CAUSATIVE
        association: Heterozygous de novo missense (and rare truncating) variants in SPOP cause both types
          of Nabais Sa-de Vries syndrome; the functional class of the variant determines the type.
        notes: Somatic SPOP mutation is separately one of the most recurrent driver events in prostate
          cancer (dominant-negative class) and endometrial cancer (gain-of-function class). The germline
          NSDVS variants overlap these functional classes (e.g. p.Arg121Gln is an endometrial-type gain-of-function
          change), but the cancers are somatic, non-heritable processes and are not part of this disorder's
          phenotype; no tumor predisposition has been established in NSDVS. De novo origin was not confirmed
          by segregation for the p.Met117Ile case, and its functional class remains proposed. Clinical
          classification of subsequent alleles must not be confused with the tested biochemical classes
          of the discovery cohort.
        variants:
        - name: SPOP p.Arg121Gln (c.362G>A)
          description: Gain-of-function variant; NSDVS type 1 (congenital microcephaly). Also a recurrent
            endometrial cancer somatic mutation.
        - name: SPOP p.Asp144Asn (c.430G>A)
          description: Gain-of-function variant; NSDVS type 1.
        - name: SPOP p.Thr25Ala (c.73A>G)
          description: Dominant-negative variant; NSDVS type 2.
        - name: SPOP p.Tyr83Cys (c.248A>G)
          description: Dominant-negative variant; NSDVS type 2.
        - name: SPOP p.Gly132Val (c.395G>T)
          description: Dominant-negative variant; NSDVS type 2.
        - name: SPOP p.Arg138Cys (c.412C>T)
          description: Dominant-negative variant; NSDVS type 2.
        - name: SPOP p.Arg121Trp (c.361C>T)
          description: Confirmed de novo missense at Arg121, classified clinically as type 1. Gain of
            function was proposed by analogy with p.Arg121Gln, not demonstrated by a disease-allele functional
            assay.
        - name: SPOP p.Met117Ile (c.351G>T)
          description: Variant reported in a premature girl clinically classified as type 1. The authors
            argued likely pathogenicity using computational and clinical criteria; segregation and a functional
            gain-of-function assay were unavailable.
        - name: SPOP p.Tyr353Ter (BACK-domain truncation)
          description: De novo nonsense variant truncating the BACK domain, reported with mixed type 1
            and type 2 features; proposed to act by attenuating SPOP higher-order oligomerization.
        - name: SPOP p.Cys23Arg (c.67T>C)
          description: Confirmed de novo missense in an infant classified as type 2, with relative head
            enlargement. Reduced mutant mRNA and protein abundance was measured in transfected cells;
            a dominant-negative BET degradation effect was not directly tested.
      selected_evidence:
        snippet: By using clinical exome sequencing, we identified six de novo pathogenic missense variants
          in SPOP in seven individuals with developmental delay and/or intellectual disability, facial
          dysmorphisms, and congenital anomalies.
        supports: SUPPORT
