  772f00dc4291e5cbe977e3097c7b0407f540f2a38e17ef6d43a034ba52d71d60:
    claim:
      about:
        disease:
          name: SPOP-Related Neurodevelopmental Disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gli3_hedgehog_axis_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does SPOP-dependent GLI3/Hedgehog dysregulation, firmly established in mouse genetics,
          contribute to the human SPOP neurodevelopmental syndrome?
        rationale: Mouse studies show that Spop targets the Gli3 repressor for degradation in vivo and
          that reducing Gli3 dosage rescues the Spop-null skeletal phenotype - unusually strong genetic
          evidence for a SPOP-GLI3 axis. But the mouse phenotype is predominantly skeletal, Spop-null
          spinal cord patterning is grossly normal, and no study has examined GLI3 or Hedgehog signaling
          in patient-derived neural tissue, so the translational validity of this axis for the human microcephaly/macrocephaly
          and cognitive phenotype is the open question. The BET-protein model (this entry's pathograph)
          and the GLI3 axis are not mutually exclusive.
        attaches_to:
        - pathophysiology#Impaired CUL3-SPOP Substrate Degradation
        - animal_models#Spop-null mouse
      selected_evidence:
        snippet: Consistent with this finding, reducing Gli3 dosage greatly rescued the Spop mutant skeletal
          defects.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:27930311
      reference_title: Spop promotes skeletal development and homeostasis by positively regulating Ihh
        signaling.
      evidence_source: MODEL_ORGANISM
      explanation: The genetic rescue that establishes GLI3 as the mediator of the mouse Spop-null phenotype,
