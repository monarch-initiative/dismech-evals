      assertion:
        discussion_id: oligomerization_mixed_phenotype
        kind: OPEN_QUESTION
        status: OPEN
        prompt: How do BACK-domain truncations that attenuate SPOP higher-order oligomerization produce
          mixed type 1/type 2 phenotypes, and should oligomerization state be modeled as a third functional
          class?
        rationale: A de novo p.Tyr353Ter BACK-domain truncation was reported with combined type 1 and
          type 2 features. Because the BACK domain drives higher-order oligomerization that enhances substrate
          avidity and ubiquitylation efficiency, a truncation could simultaneously reduce degradation
          of some substrates and dysregulate others, blurring the binary gain/loss model used in this
          entry's pathophysiology.
        attaches_to:
        - genetic#SPOP
        - pathophysiology#Heterozygous SPOP Variation
      selected_evidence:
        snippet: We conclude the p.Tyr353Term is a Janus-faced variant which explains the dual NSDVS type
          1 and 2 phenotypes in this case.
        supports: SUPPORT
