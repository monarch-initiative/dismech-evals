        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Swallowing dysfunction is a plausible contributor to feeding-related growth failure
          in this case. Weight gain improved mildly with thickened liquids and calorie supplements; the
          report does not isolate the relative contribution of dysphagia from nutritional or developmental
          factors.
      selected_evidence:
        snippet: "At age \n10, he was evaluated by speech pathology for \npoor weight gain and choking\
          \ episodes while \neating. A modified barium swallow study \nrevealed moderate oropharyngeal\
          \ dysphagia \ncomplicated by reduced hyolaryngeal excur -\nsion, diffuse pharyngeal residue,\
          \ and delayed \nswallow initiation. Further assessment at this \ntime revealed failure to thrive\
          \ with weight and \nheight below 5 th percentile and between 5 th-\n10th percentiles, respectively,\
          \ and BMI/weight \nfor length Z-score was equal to -1.44, indicating \nmild malnutrition. He\
          \ was placed on high calo -\nrie supplements and thickened liquids that \nmildly improved his\
          \ weight gain."
        supports: SUPPORT
        directness: INDIRECT
