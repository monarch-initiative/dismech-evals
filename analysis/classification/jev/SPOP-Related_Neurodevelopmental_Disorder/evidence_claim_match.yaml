  a71418b9ad66c1286266e5592b79e279c7d2a8cbfe34f44a61e09a12ac465f7a:
    claim:
      about:
        disease:
          name: SPOP-Related Neurodevelopmental Disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: neural_substrate_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which SPOP substrates mediate the neurodevelopmental phenotype in vivo, and do the BET
          protein changes measured in endometrial cancer cell models occur in human neural cells?
        rationale: Disease alleles alter BET protein abundance in Ishikawa cells and EBV-immortalized
          patient PBMC lines. The authors propose BET-dependent changes in neuronal differentiation using
          prior developmental models. The graph retains that qualified causal hypothesis; the remaining
          uncertainty is its mediation and translation to human neural tissue, including possible contributions
          of other SPOP substrates. The specific differentiation hypothesis is retained for head growth.
          Developmental delay, intellectual disability and language delay are linked to the broader causal
          SPOP genotype/functional attribution, without assuming that the same intermediary explains each
          outcome.
        attaches_to:
        - pathophysiology#Reduced BET Protein Abundance
        - pathophysiology#BET Protein Accumulation
      selected_evidence:
        snippet: We measured the effect of SPOP variants on BET protein amounts in human Ishikawa endometrial
          cancer cells and patient-derived cell lines because we hypothesized that variants would lead
          to functional divergent effects on BET proteins.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:32109420
      reference_title: De Novo Variants in SPOP Cause Two Clinically Distinct Neurodevelopmental Disorders.
      evidence_source: IN_VITRO
      explanation: Shows the functional evidence base is cancer cell lines and patient-derived non-neural
