            description: Gain-of-function variants (NSDVS type 1) enhance SPOP-mediated ubiquitination,
              accelerating proteasomal degradation of SPOP substrates.
            genetic_context:
              functional_impact_category: GAIN_OF_FUNCTION
              variant_origin: DE_NOVO
              zygosity: HETEROZYGOUS
