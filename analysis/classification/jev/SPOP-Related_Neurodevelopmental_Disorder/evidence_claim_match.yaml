      assertion_type: Phenotype
      assertion:
        name: Congenital Heart Disease
        category: Cardiovascular
        description: Congenital structural heart findings are heterogeneous. They include septal and outflow
          lesions in the type 2 series, and neonatal PDA/PFO in the p.Met117Ile case reported as type
          1. Pulmonary hypertension and tricuspid regurgitation are separately scoped observations, not
          synonyms for congenital heart malformation.
        phenotype_term:
          preferred_term: Congenital heart disease
          term:
            id: HP:0001627
            label: Abnormal heart morphology
        notes: The p.Met117Ile case was a premature twin born at 35 weeks; variant pathogenicity was argued
          from in silico and clinical evidence without segregation or functional confirmation. Its neonatal
          PDA/PFO cannot alone establish a specific SPOP cardiac mechanism.
      selected_evidence:
        snippet: A medical genetic evaluation was initiated at one week of age due to congenital heart
          disease.
        supports: SUPPORT
