                effect was proposed, not functionally demonstrated, for p.Arg121Trp and p.Met117Ile.
            biological_processes:
            - preferred_term: proteasome-mediated degradation of SPOP substrates
              term:
                id: GO:0043161
                label: proteasome-mediated ubiquitin-dependent protein catabolic process
              modifier: INCREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Reduced BET Protein Abundance
        causal_link_type: DIRECT
        hypothesis_groups:
        - bet_bidirectional_dysregulation
      selected_evidence:
        snippet: Variants p.Arg121Gln and p.Asp144Asn resulted in reduced amounts of the BET proteins
          BRD2, BRD3, and BRD4, suggesting that these are gain-of-function variants comparable to those
