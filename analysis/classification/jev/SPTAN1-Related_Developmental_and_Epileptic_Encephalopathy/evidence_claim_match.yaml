            fidelity: LOW
            description: Heterozygous R1098Q mice have seizure episodes, so a dominant-negative alpha-II
              spectrin allele is sufficient to produce seizures in vivo. The seizures are stress-induced
              and appear alongside progressive ataxia and memory impairment.
            limitations: The variant is in repeat 10, not the heterodimerization repeats that cause DEE5,
              and the phenotype it produces - progressive ataxia with stress-induced seizures and memory
              impairment - resembles the milder ataxia end of the human SPTAN1 spectrum more than infantile
              spasms with hypsarrhythmia. It therefore supports the dominant-negative principle without
              modelling this disease's epilepsy syndrome.
          role: ancestor
