  c32d3a322c3670c13ed5119ce1c06d033018890decf08e7cba16a086cf664f60:
    claim:
      about:
        disease:
          name: SPTAN1-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 5
            term:
              id: MONDO:0013277
              label: developmental and epileptic encephalopathy, 5
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_which_arm_causes_the_hypomyelination
        prompt: Cerebral hypomyelination is a diagnostic hallmark of DEE5, but alpha-II spectrin is a
          neuronal cytoskeletal protein. Is the hypomyelination a direct consequence of spectrin loss
          in oligodendrocytes, a non-cell-autonomous consequence of abnormal axons, or secondary to the
          epileptic encephalopathy itself?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Cerebral Hypomyelination
        - pathophysiology#Disrupted Dendritic and Axonal Development
        rationale: 'Hypomyelination is one of the features that made SPTAN1 a candidate gene in the first
          place - it was picked out partly because alpha-II spectrin is essential for proper myelination
          in zebrafish - so it is not an incidental finding. But the mechanism curated in the rest of
          this entry is neuronal: aggregation, axon initial segment disruption, inhibitory synapse loss.
          Nothing in the verified sources measures spectrin function in oligodendrocytes or asks whether
          myelination recovers when axonal development is rescued. The three candidate routes make different
          predictions and would support different interpretations of the MRI hallmark, and the entry deliberately
          places hypomyelination as a parallel arm rather than downstream of any one of them, because
          choosing would assert more than the evidence carries.'
        proposed_experiments:
        - experiment_id: exp_conditional_oligodendrocyte_sptan1_deletion
          name: Oligodendrocyte-restricted versus neuron-restricted Sptan1 deletion
          description: Compare myelin content and oligodendrocyte maturation between mice with Sptan1
            deleted only in oligodendrocytes and mice with it deleted only in neurons. Hypomyelination
            in the oligodendrocyte-restricted line would establish a cell-autonomous glial requirement;
            hypomyelination only in the neuron-restricted line would establish the non-cell-autonomous
            axonal route, as has been shown for other neuronal genes with myelin phenotypes.
      selected_evidence:
        snippet: SPTAN1 encoding alpha-II spectrin, which is essential for proper myelination in zebrafish,
          turned out to be deleted.
        supports: SUPPORT
