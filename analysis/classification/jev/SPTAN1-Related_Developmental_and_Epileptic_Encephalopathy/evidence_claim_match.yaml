      assertion_type: Genetic
      assertion:
        name: SPTAN1
        gene_term:
          preferred_term: SPTAN1
          term:
            id: hgnc:11273
            label: SPTAN1
        relationship_type: CAUSATIVE
        association: De novo in-frame deletions and duplications in the last two C-terminal spectrin repeats
          of SPTAN1 cause DEE5 by a dominant-negative mechanism.
        notes: 'The genotype-mechanism relationship is unusually well resolved for a developmental and
          epileptic encephalopathy, and it is not simply "variants in this gene cause this disease". Only
          in-frame changes in the last two spectrin repeats - the alpha/beta heterodimer nucleation site
          - produce the severe DEE5 phenotype, and they do so by dominant-negative aggregation rather
          than by reducing gene dose. Heterozygous null mice have no haploinsufficiency phenotype, which
          is the observation that separates the two mechanisms. Other SPTAN1 variant classes cause substantially
          milder disorders: a large sequencing study found statistically significant enrichment of rare
          damaging SPTAN1 variants in hereditary ataxia and hereditary spastic paraplegia families, with
          a third of the identified carriers presenting pure or complex HSP/ataxia rather than developmental
          delay and seizures. Curators extending this entry should therefore not treat "a SPTAN1 variant"
          as sufficient for DEE5 - position and variant type carry the phenotype.'
      selected_evidence:
        snippet: Only in-frame SPTAN1 mutations in the last two spectrin repeats in the C-terminal region
          lead to dominant negative effects and these specific phenotypes.
        supports: SUPPORT
