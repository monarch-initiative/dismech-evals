  b80a2cceae5cb471fd1a54c28e925210f8e6316e0f4b9bfc709de33c84e87b15:
    claim:
      about:
        disease:
          name: SPTAN1-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 5
            term:
              id: MONDO:0013277
              label: developmental and epileptic encephalopathy, 5
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_seizures_despite_raised_firing_threshold
        prompt: Neurons carrying SPTAN1 aggregates have a raised action potential threshold - they fire
          less readily. How does a lesion that makes individual neurons harder to excite produce an infantile
          epileptic encephalopathy?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Elevated Action Potential Threshold
        - pathophysiology#Reduced Inhibitory Innervation
        - pathophysiology#Cortical Network Disinhibition
        rationale: 'The measured direction is the opposite of the naive expectation for an epilepsy gene,
          and the pathograph records it that way rather than quietly smoothing it out. Disrupted clustering
          of voltage-gated sodium channels at the axon initial segment raises the threshold for firing,
          so the primary cellular defect is reduced excitability. The leading reconciliation is that the
          network consequence inverts the cellular one: inhibitory innervation is also reduced, and if
          inhibitory interneurons are more affected than principal cells - or if the loss of inhibitory
          synapses outweighs the raised threshold in principal cells - the net cortical effect is disinhibition
          despite less excitable individual neurons. That account is plausible and consistent with everything
          measured, and it gains support from an intact-animal result: a mouse carrying a destabilising
          alpha-II spectrin variant shows fewer and structurally defective axon initial segments together
          with increased neuronal excitability and greater chemoconvulsant sensitivity, so at network
          level the sign is the opposite of the single-neuron threshold shift. That still does not settle
          it, because the variant sits in repeat 10 rather than the DEE5 heterodimerization repeats and
          the measurement is at network rather than cellular level - and no study has compared threshold
          shifts between interneurons and pyramidal cells in the same preparation, which is exactly the
          measurement that would decide it. Until then the entry keeps the raised threshold and the reduced
          inhibition as separate nodes rather than merging them into a single excitability claim, because
          merging them would hide the tension rather than resolve it.'
        proposed_experiments:
        - experiment_id: exp_cell_type_resolved_threshold_comparison
          name: Cell-type-resolved excitability in SPTAN1-mutant cortex
          description: Record action potential threshold and firing from identified GABAergic interneurons
            and pyramidal neurons in the same SPTAN1-mutant cortical preparation, together with inhibitory
            and excitatory synaptic currents onto each. If interneurons show a larger threshold shift
            than pyramidal cells, the disinhibition account is supported directly; if both shift equally,
            the seizures must arise from the synaptic rather than the intrinsic arm, and the raised threshold
            is a bystander finding.
      selected_evidence:
        snippet: Clustering of ankyrinG and voltage-gated sodium channels at axon initial segment (AIS)
          was disturbed in relation to the aggregates, together with an elevated action potential threshold.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
