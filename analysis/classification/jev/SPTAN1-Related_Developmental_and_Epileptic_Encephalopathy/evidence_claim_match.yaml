  6b494772d088fb24e651bc33f0ab7c2213f269dfd0186c0672f2d02cc35c1b87:
    claim:
      about:
        disease:
          name: SPTAN1-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 5
            term:
              id: MONDO:0013277
              label: developmental and epileptic encephalopathy, 5
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_no_model_carries_the_dee5_allele
        prompt: No published animal model carries an in-frame variant in the last two spectrin repeats
          - the only variant class that causes DEE5. What is being modelled instead, and what does that
          cost?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Spectrin Heterodimer Aggregation
        - pathophysiology#De Novo In-Frame SPTAN1 Variant in the Heterodimerization Repeats
        rationale: 'The in vivo evidence for this disorder comes from two models, and neither carries
          the disease allele. The conditional knockout deletes alpha-II spectrin outright, so it cannot
          aggregate and cannot exert a dominant-negative effect - it shows what the protein is required
          for, not what the mutant protein does. The R1098Q mouse is genuinely dominant-negative but sits
          in repeat 10 rather than the heterodimer nucleation site, and produces progressive ataxia with
          stress-induced seizures, which resembles the milder human SPTAN1 phenotypes rather than West
          syndrome. The source that describes the R1098Q model states the underlying problem plainly:
          modelling these encephalopathies has been difficult because heterozygous nulls show nothing
          and no stable transgenic line carrying a human missense variant exists. The practical cost is
          that the causal step from aggregation to seizures has never been tested in an animal that actually
          aggregates the relevant complex, and patient-derived neurons - which do carry the allele - cannot
          supply a network or behavioural readout. This is a mismatch in what the models can address,
          not evidence that the mechanism is wrong.'
        proposed_experiments:
        - experiment_id: exp_knockin_heterodimerization_repeat_allele
          name: Knock-in mouse carrying a human DEE5 heterodimerization-repeat allele
          description: Generate a knock-in mouse carrying one of the recurrent in-frame deletions or duplications
            at the alpha/beta heterodimer nucleation site, and characterise spectrin aggregation, AIS
            integrity, inhibitory innervation, EEG and seizure phenotype. This is the single experiment
            that would let the step from aggregation to seizure be tested in vivo, and it would also test
            whether the raised firing threshold seen in vitro holds in an intact circuit.
      selected_evidence:
        snippet: Only in-frame SPTAN1 mutations in the last two spectrin repeats in the C-terminal region
          lead to dominant negative effects and these specific phenotypes.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
