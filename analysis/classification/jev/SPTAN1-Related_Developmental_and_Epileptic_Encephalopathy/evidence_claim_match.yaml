        description: 'An in-frame deletion or duplication in the last two spectrin repeats of the C-terminal
          region, the site at which alpha/beta spectrin heterodimer nucleation begins. Position and variant
          type are both load-bearing here: only in-frame changes in this region produce the severe phenotype,
          which is why this node names the region rather than simply recording "a SPTAN1 variant".'
      selected_evidence:
        snippet: In two subjects, an in-frame 3 bp deletion and a 6 bp duplication in SPTAN1 were found
          at the initial nucleation site of the alpha/beta spectrin heterodimer.
        supports: SUPPORT
