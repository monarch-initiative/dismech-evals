              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Axonal Hyperexcitability and Epileptiform Discharge
        biological_scale: CELLULAR
        description: Loss of nodal KCNQ2/3 removes the slow potassium brake on repetitive firing, and
          the result in mice is spontaneous and evoked neuromyotonic and myokymic discharge originating
          in myelinated axons distal to the nerve terminal. The human counterpart is the striking, and
          initially counterintuitive, finding that patients can have abundant to nearly continuous epileptiform
          discharges on EEG - in one case documented over 72 hours and in another over 24-hour video EEG
          - with no clinical seizure ever observed. This dissociation between electrographic and clinical
          epilepsy is a distinctive feature of the disorder and is the reason EEG is worth performing
          even in a child with no history of fits.
        biological_processes:
        - preferred_term: regulation of monoatomic ion transmembrane transport
          modifier: ABNORMAL
          term:
            id: GO:0034765
            label: regulation of monoatomic ion transmembrane transport
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        - preferred_term: cortical pyramidal neuron
          term:
            id: CL:4023111
            label: cerebral cortex pyramidal neuron
        mechanism_confidence: PROVISIONAL
        notes: 'Marked PROVISIONAL rather than ESTABLISHED for a specific reason: the causal link from
          KCNQ2 declustering to hyperexcitability is established in mouse peripheral axons, and the epileptiform
          EEG is established in patients, but nothing connects the two directly in human tissue. The mouse
          readout is neuromyotonia and myokymia at the neuromuscular junction, which is a peripheral phenomenon,
          whereas the patient readout is a cortical EEG. Whether the patients'' discharges arise by the
          same KCNQ2-declustering mechanism, or instead from the cortical AIS pathology, is untested.

          Seizure frequency is genuinely inconsistent across sources and is not averaged here. GeneReviews
          states that half of affected individuals develop seizures; the 2021 cohort report says more
          than half develop seizures or have a pathological EEG; the 2025 natural-history review of 38
          patients puts seizures at 21%; and the HPO annotation set for OMIM:617519 records HP:0001250
          Seizure with the frequency modifier "Very rare", sourced to OMIM (retrieved 2026-08-01). These
          four sources cannot all be right. The discrepancy is recorded as a knowledge-gap discussion.'
      selected_evidence:
        snippet: The quivering-3J mice show prominent spontaneous and evoked hyperactivities at diaphragm
          neuromuscular junctions.
        supports: SUPPORT
