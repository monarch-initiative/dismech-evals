            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mus musculus
        genotype: quivering (qv) allelic series - spontaneous Sptbn4 (Spnb4) loss-of-function alleles
          including qv3J and qv4J
        category: Spontaneous loss-of-function allelic series
        description: 'The quivering mouse is the reason this gene was ever connected to human disease.
          It arose spontaneously in 1953 and produces progressive ataxia with hindlimb paralysis, deafness
          and tremor; when the founding human case was described, the resemblance to quivering is what
          prompted the authors to examine muscle in both. The allelic series is unusually informative
          because the alleles truncate the protein at different points: qv3J removes the C-terminal specific
          and pleckstrin homology domains, qv4J additionally removes the ankyrinG-binding domain and abolishes
          detectable protein, and the two produce graded severity with central nodes affected before peripheral
          ones. The series is what established the separability of the mechanical (nodal undercoat) and
          electrical (channel clustering) arms of beta-IV spectrin function.

          Fidelity is good but not complete, and the mismatches run in both directions. Ataxia and tremor
          are cardinal in the mouse and were absent from every human report until 2025, when two siblings
          in one Saudi family were found to have ataxia. Conversely, intellectual disability - the most
          severe feature in humans - has no straightforward murine readout and the mouse cognitive phenotype
          has not been characterised. Muscle fibre-type findings differ too - the quivering mouse showed
          complete type 2 fibre uniformity, whereas human biopsies show only incomplete type 1 hypotrophy.'
        genes:
        - preferred_term: SPTBN4
          term:
            id: hgnc:14896
            label: SPTBN4
        associated_phenotypes:
        - Progressive ataxia with hindlimb paralysis
        - Tremor
        - Central (non-cochlear) deafness with abnormal brainstem auditory transmission
        - Broadened nodes of Ranvier with vesicle-filled membrane protrusions
        - Reduced nodal and AIS sodium channel immunoreactivity
        - Absent nodal KCNQ2 aggregates with neuromyotonic and myokymic discharge
      selected_evidence:
        snippet: The autosomal recessive mouse mutation quivering (qv), which arose spontaneously in 1953,
          produces progressive ataxia with hind limb paralysis, deafness and tremor.
        supports: SUPPORT
