  c2ea488fc4671e2b71bc88dfad1aeb60fa2cc071e20176958e51560511d37b22:
    claim:
      about:
        disease:
          name: SPTBN4-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of beta-IV Spectrin from the Axon Initial Segment and Nodal Membrane Skeleton
        biological_scale: MOLECULAR
        description: 'Beta-IV spectrin is the neuron-specific beta-subunit of the submembranous spectrin
          scaffold, restricted almost entirely to the axon initial segment and the nodes of Ranvier of
          myelinated neurons. The axonal scaffold it belongs to is a periodic lattice: actin rings spaced
          roughly 180 to 190 nm apart along the axon, bridged by spectrin tetramers of that same length,
          with sodium channels distributed in register with the lattice. Beta-IV spectrin is what links
          that lattice to the membrane at excitable domains. Its longest isoform, beta-IV-Sigma1, is the
          only one carrying an actin-binding domain and also carries 17 spectrin repeats, the ERQES specific
          domain and a pleckstrin homology domain; a shorter, N-terminally-truncated isoform, Sigma6,
          is expressed at much higher levels and carries the sodium-channel-clustering activity. The isoform
          structure matters clinically, because truncating variants at different positions remove different
          subsets of isoforms.'
        genes:
        - preferred_term: SPTBN4
          term:
            id: hgnc:14896
            label: SPTBN4
        protein_complexes:
        - preferred_term: beta-IV spectrin-containing membrane skeleton
          modifier: DECREASED
          term:
            id: GO:0008091
            label: spectrin
        cellular_components:
        - preferred_term: axon initial segment
          term:
            id: GO:0043194
            label: axon initial segment
        - preferred_term: node of Ranvier
          term:
            id: GO:0033268
            label: node of Ranvier
        - preferred_term: spectrin-associated cytoskeleton
          term:
            id: GO:0014731
            label: spectrin-associated cytoskeleton
        molecular_functions:
        - preferred_term: actin binding
          modifier: DECREASED
          term:
            id: GO:0003779
            label: actin binding
        - preferred_term: structural constituent of cytoskeleton
          modifier: DECREASED
          term:
            id: GO:0005200
            label: structural constituent of cytoskeleton
        - preferred_term: phosphoinositide binding via the pleckstrin homology domain
          modifier: DECREASED
          term:
            id: GO:0035091
            label: phosphatidylinositol binding
        cell_types:
        - preferred_term: myelinated neuron
          term:
            id: CL:0000540
            label: neuron
        mechanism_confidence: ESTABLISHED
        notes: 'Two independent patient-material demonstrations that the protein is actually lost, from
          different tissues and different laboratories: Western blot showing absence of the full-length
          isoform in muscle and of a 72 kDa isoform in fibroblasts (PMID:28540413), and immunohistochemistry
          showing no beta-IV-spectrin signal in patient muscle where control muscle stained (PMID:33772159).
          Both were performed on muscle, which is precisely the tissue whose beta-IV spectrin expression
          was later disputed (PMID:38441922); see the "Contested Skeletal Muscle Involvement" node. The
          protein-loss claim for neurons rests on the founding functional study''s neuronal expression
          experiments rather than on patient neural tissue, since no post-mortem CNS material from an
          affected individual has been reported.

          Isoform nomenclature is a live source of confusion and is stated explicitly. The original description
          names four alternatively spliced isoforms Sigma1 to Sigma4 and reports the longest as a 250
          kD band; subsequent work adds Sigma6 as the dominant short isoform; and the first clinical report
          describes the full-length isoform as 288 kDa. These are the same gene product family described
          with different antibodies, species and conventions, and the discrepancy in stated molecular
          weight is not resolved in the literature. It is recorded rather than averaged.'
      selected_evidence:
        snippet: The longest isoform (betaIVSigma1 spectrin) includes an actin-binding domain, followed
          by 17 spectrin repeats, a specific domain in which the amino acid sequence ERQES is repeated
          four times, several putative SH3-binding sites and a pleckstrin homology domain.
        supports: SUPPORT
