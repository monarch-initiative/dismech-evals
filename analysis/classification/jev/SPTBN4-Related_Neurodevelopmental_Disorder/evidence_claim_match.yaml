  33ec782651418138ab41831769d70b20d755f329c2b563d2f9cfba0d0a1b0392:
    claim:
      about:
        disease:
          name: SPTBN4-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Phenotype
      assertion:
        name: Epileptiform EEG without clinical seizures
        category: Neurologic
        description: Abundant to nearly continuous epileptiform discharges recorded on prolonged EEG in
          individuals who have never had an observed clinical seizure. In one patient this was documented
          on 72-hour EEG and in another on 24-hour video EEG with explicit parental confirmation that
          no fits had ever occurred. It is modelled as a distinct phenotype from clinical seizures because
          it has different management implications and because it is the human observation that most directly
          reflects the nodal KCNQ2 clustering failure.
        phenotype_term:
          preferred_term: Interictal epileptiform activity
          term:
            id: HP:0011182
            label: Interictal epileptiform activity
        notes: HP:0011182 is bound rather than its parent HP:0002353 EEG abnormality because its HPO definition
          ("Interictal epileptiform activity refers to such activity that occurs in the absence of a clinical
          or subclinical seizure") names exactly the finding described here; ancestry confirmed with `runoak
          -i sqlite:obo:hp ancestors -p i HP:0011182`, which lists HP:0002353. The HPO annotation set
          for OMIM:617519 records only the parent, HP:0002353 EEG abnormality, at 2/2, sourced to PMID:33772159
          (retrieved 2026-08-01); since no FrequencyEnum band is asserted anywhere in this entry that
          parent-level count is recorded here rather than driving the binding. Whether such discharges
          warrant antiseizure treatment in a child with no clinical events is not addressed anywhere in
          the literature and is not asserted here.
      selected_evidence:
        snippet: Though two of our patients did not exhibit clinically manifest seizures, their EEGs showed
          highly pathologic epileptiform discharges.
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/13
      evidence_path: /phenotypes/13/evidence/0
