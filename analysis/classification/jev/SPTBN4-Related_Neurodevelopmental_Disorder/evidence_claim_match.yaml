            label: cerebellum
        cellular_components:
        - preferred_term: axon initial segment
          term:
            id: GO:0043194
            label: axon initial segment
        mechanism_confidence: HYPOTHETICAL
        notes: 'Marked HYPOTHETICAL deliberately, and it is the weakest link in the pathograph. There
          is no human neuropathology in SPTBN4 disease - no autopsy, no biopsy of CNS tissue, no iPSC-derived
          neuronal model has been reported. The cortical AIS mechanism is imported wholesale from rodent
          hippocampal and brainstem recordings. The competing explanations are not excluded: the developmental
          delay could be substantially secondary to profound motor and communicative impairment plus recurrent
          hypoxia from aspiration, rather than a primary cortical lesion, and no study has tried to separate
          these. The cerebellar findings are a further complication - ataxia was reported in only one
          Saudi family, yet cerebellar vermian atrophy appears in the imaging series and ataxia is a cardinal
          feature of the quivering mouse, so the cerebellum may be involved more often than the clinical
          phenotype suggests.'
