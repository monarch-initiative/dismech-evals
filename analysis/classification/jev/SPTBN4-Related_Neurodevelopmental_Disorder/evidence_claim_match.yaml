  c40139c6a78a65ff778544609248c65360ec606cd85c3f8a59f019ead16a3e8e:
    claim:
      about:
        disease:
          name: SPTBN4-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: HarrisonsChapterAssignment
      assertion:
        classification_value: NEUROLOGIC
        notes: Every organ system affected in this disorder is affected through the nervous system. The
          cardinal features - congenital hypotonia, profound developmental delay and intellectual disability,
          absent speech, motor axonal neuropathy with areflexia, auditory neuropathy, seizures and epileptiform
          EEG - are all neurological. The gastrointestinal and respiratory morbidity (dysphagia, aspiration,
          ventilatory failure) is bulbar and neuromuscular rather than primary organ disease. The muscle
          involvement, historically reported as a congenital myopathy, is now argued to be neurogenic
          (PMID:38441922), which strengthens rather than weakens the single NEUROLOGIC assignment. Cardiomyopathy
          has been reported in two individuals and is not the disorder's centre of gravity.
      selected_evidence:
        snippet: Variants in SPTBN4 disrupt the cytoskeletal machinery that controls proper localization
          of ion channels and the function of axonal domains, thereby generating severe neurological dysfunction.
        supports: SUPPORT
    origin:
      assertion_path: /classifications/harrisons_chapter/0
      evidence_path: /classifications/harrisons_chapter/0/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /classifications
    evidence_metadata:
      reference: PMID:33772159
      reference_title: Novel bi-allelic variants expand the SPTBN4-related genetic and phenotypic spectrum.
      evidence_source: HUMAN_CLINICAL
      explanation: The authors characterise the whole disorder as neurological dysfunction arising from
        an axonal cytoskeletal lesion, which is the basis for the NEUROLOGIC chapter assignment.
