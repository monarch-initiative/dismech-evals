            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: SPTBN1-related developmental delay, impaired speech, and behavioral abnormalities
        disease_term:
          preferred_term: developmental delay, impaired speech, and behavioral abnormalities
          term:
            id: MONDO:0859178
            label: developmental delay, impaired speech, and behavioral abnormalities
        description: 'The beta-II spectrin sibling disorder. Beta-II spectrin is the general axonal beta-subunit,
          present along the axon shaft rather than concentrated at excitable domains, and its dominant
          variants cause developmental delay with impaired speech and behavioural abnormalities. Together
          with SPTBN2 ataxia and SPTBN5 disease it illustrates why beta-spectrin paralogues, all building
          the same lattice, produce non-overlapping diseases: they differ in where in the neuron they
          are deployed.'
        distinguishing_features:
        - SPTBN1 disease is autosomal dominant; SPTBN4 disease is recessive.
        - Autism and behavioural abnormality dominate the SPTBN1 phenotype; profound motor disability,
          areflexia and neuropathy dominate SPTBN4.
        - Congenital hypotonia with feeding and respiratory failure is not the SPTBN1 presentation.
        notes: 'MONDO:0859178 was verified with OAK (`runoak -i sqlite:obo:mondo relationships --direction
          down HGNC:11275` returns it as the only SPTBN1 disease term); SPTBN1 is hgnc:11275, also verified.
          Sibling beta-spectrin disorders that were looked up but NOT curated as separate differentials,
          to avoid padding: SPTBN2 spinocerebellar ataxia type 5 (MONDO:0010848) and autosomal recessive
          spinocerebellar ataxia 14 (MONDO:0014159), both verified against hgnc:11276. They are cerebellar
          ataxias with no hypotonia-neuropathy-deafness overlap.'
      selected_evidence:
        snippet: Despite their structural similarity and shared role as molecular organizers at the cell
          membrane, spectrins vary in expression, subcellular localization and specialization in neurons,
          and this variation partly underlies non-overlapping disease presentations across spectrinopathies.
        supports: SUPPORT
    origin:
