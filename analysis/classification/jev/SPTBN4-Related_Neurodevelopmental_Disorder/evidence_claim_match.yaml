            label: skeletal muscle fiber
        locations:
        - preferred_term: peripheral nerve
          term:
            id: UBERON:0001021
            label: nerve
        - preferred_term: skeletal muscle tissue
          term:
            id: UBERON:0001134
            label: skeletal muscle tissue
        mechanism_confidence: ESTABLISHED
        notes: 'Conformance caveat. This node declares conformance to the central effector step of the
          `peripheral_axonal_degeneration` module, which bundles axonal degeneration with Schwann-cell
          demyelination. Only the axonal arm applies here: the HPO annotation set for OMIM:617519 records
          HP:0007108 Demyelinating peripheral neuropathy at 0/5 (retrieved 2026-08-01), sensory and motor
          conduction velocities were normal in the patients in whom they were measured, and no myelin
          pathology has been reported. The module''s upstream axonal-transport and mitochondrial nodes
          are also NOT claimed: no transport or mitochondrial assay has been done in SPTBN4 disease, and
          the upstream lesion here is a nodal cytoskeletal and channel-clustering failure, not a transport
          failure. The conformance is therefore asserted at the effector node only.

          Neuropathy is not detectable in every patient. In the 2021 cohort, electrophysiology showed
          obvious neuropathy in only one of five; one patient (Patient 3) had entirely normal nerve conduction
          studies and EMG, and a second (Patient 4) had normal sensory and motor action potentials with
          no EMG reported - so a normal neurophysiological study does not exclude the diagnosis, and the
          HPOA denominator for HP:0003477 Peripheral axonal neuropathy is correspondingly low (2/6).'
      selected_evidence:
        snippet: cause a severe neurological syndrome that includes congenital hypotonia, intellectual
          disability, and motor axonal and auditory neuropathy
        supports: SUPPORT
