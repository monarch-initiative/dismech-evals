            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: KCNQ2 developmental and epileptic encephalopathy
        disease_term:
          preferred_term: developmental and epileptic encephalopathy, 7
          term:
            id: MONDO:0013387
            label: developmental and epileptic encephalopathy, 7
        description: A mechanistic rather than a clinical differential, and the closest thing this disorder
          has to a pathway relative. KCNQ2 encodes the channel subunit that beta-IV spectrin positions
          at the node; SPTBN4 disease produces nodes with no detectable KCNQ2. The 2021 cohort report
          proposed exactly this overlap when explaining the epileptiform EEGs. The two disorders converge
          on absent nodal M-current from opposite directions - one by losing the channel, the other by
          losing the scaffold that places it.
        distinguishing_features:
        - KCNQ2-DEE is a de novo dominant channelopathy; SPTBN4 disease is autosomal recessive, so unaffected
          consanguineous parents favour SPTBN4.
        - Seizures dominate the KCNQ2-DEE presentation from the neonatal period, whereas in SPTBN4 disease
          hypotonia and weakness dominate and the epileptiform activity is frequently subclinical.
        - Peripheral axonal neuropathy, areflexia and auditory neuropathy are features of SPTBN4 disease
          and not of KCNQ2-DEE.
        - Sodium-channel blockers are a rational therapy in KCNQ2 gain-of-function disease; no analogous
          targeted option exists for SPTBN4 disease.
        notes: MONDO:0013387 was verified with OAK (`runoak -i sqlite:obo:mondo relationships --direction
          down HGNC:6296` returns MONDO:0013387 "developmental and epileptic encephalopathy, 7" and MONDO:0007365
          "seizures, benign familial neonatal, 1"); KCNQ2 is hgnc:6296, also verified. MONDO:0013387 matches
          the disease_term already bound in `kb/disorders/KCNQ2_Developmental_and_Epileptic_Encephalopathy.yaml`,
          and MONDO:0007365 appears in `kb/disorders/Benign_Neonatal_Seizures.yaml` only as a `has_subtypes`
          subtype_term - that file's own disease_term is MONDO:0016027 `benign neonatal seizures`. No
          content was copied from either.
      selected_evidence:
        snippet: As βIV-spectrin plays a role in the clustering of KCNQ2 subunit-containing potassium
          channels, there could be some degree of overlap of clinical symptoms with early-infantile epileptic
          encephalopathy type 7 and with benign familial neonatal seizures type 1.
        supports: SUPPORT
