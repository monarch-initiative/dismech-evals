  8ce3caaf47936cb89cf3f421a0d3749d1bd248765f231943ec72700cb33dcd95:
    claim:
      about:
        disease:
          name: SPTBN4-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Phenotype
      assertion:
        name: Sensorineural hearing impairment (auditory neuropathy)
        category: Otologic
        description: 'Hearing loss in this disorder is an auditory neuropathy: outer hair cell function
          is preserved (otoacoustic emissions present) while brainstem auditory conduction fails. It is
          a minority feature despite being named in the disease label - present in roughly a fifth to
          two fifths of reported individuals depending on the series and on whether it was formally tested.
          Its neuropathic character matters practically, because auditory neuropathy responds poorly to
          conventional amplification.'
        phenotype_term:
          preferred_term: Sensorineural hearing impairment
          term:
            id: HP:0000407
            label: Sensorineural hearing impairment
        notes: HPO annotation for OMIM:617519 records HP:0000407 Sensorineural hearing impairment at 2/5,
          sourced to PMID:33772159 (retrieved 2026-08-01); the 2025 natural-history review of 38 patients
          reports deafness in 21%. Both figures are far below what the disease name implies. In the 2021
          cohort three of five patients were recorded as clinically unaffected without formal audiology,
          so the true figure is likely between the two. HPO has no term for auditory neuropathy - searches
          of `sqlite:obo:hp` for both `l~auditory neuropathy` and free-text `auditory neuropathy` returned
          nothing on 2026-08-01 - so the sensorineural term is bound and the neuropathic character is
          carried by the separate absent-brainstem-response phenotype below.
      selected_evidence:
        snippet: Nevertheless, scoliosis, deafness, and seizure are still present in some of the affected
          individuals (25%, 21%, and 21%, respectively).
        supports: SUPPORT
    origin:
