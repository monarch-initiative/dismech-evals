      assertion_type: HistopathologyFinding
      assertion:
        name: Type 1 fiber hypotrophy without frank fiber-type disproportion
        description: ATPase pH 4.3 staining in patient muscle shows selective reduction of type 1 fibre
          diameter relative to type 2, quantified by minimal Feret diameter, without the complete fibre-type
          disproportion classically defined for congenital myopathies. The founding case was described
          as having incomplete congenital fibre-type disproportion, and the corresponding quivering mouse
          muscle showed complete absence of type 1 fibres.
        diagnostic: false
        notes: Recorded as a finding, not as a mechanism. Whether this appearance is primary or denervation-driven
          is the subject of the "Contested Skeletal Muscle Involvement" pathophysiology node. Muscle biopsy
          was performed in only 8 of 38 reported patients.
      selected_evidence:
        snippet: ATPase pH 4.3 staining and IHC with an antibody directed against myosin heavy chain slow
          (MHC neonatal, NCL-MHCn, Novocastra, 1:20) revealed a reduction of type 1 fiber diameters but
          no manifest fiber-type disproportion
        supports: SUPPORT
