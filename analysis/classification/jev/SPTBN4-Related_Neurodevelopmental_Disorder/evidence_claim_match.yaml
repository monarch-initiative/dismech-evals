            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Course
        age_range: Childhood onward
        notes: 'The published course is static or slowly progressive rather than relentlessly degenerative:
          developmental milestones are not lost, but they are largely not gained either. Two individuals
          in the pooled review had disease onset only at 48 and 60 years of age, which is difficult to
          reconcile with a congenital-onset neurodevelopmental disorder and is flagged as a knowledge
          gap rather than smoothed into the natural history. The clinically important trajectory is the
          secondary one: progressive bulbar weakness leads to dysphagia, aspiration and recurrent pneumonia,
          and thence to restrictive lung disease, tracheostomy and death. Scoliosis and joint contractures
          accumulate with immobility.'
      selected_evidence:
        snippet: only two cases have late disease onset at the ages of 48 and 60 years old
        supports: SUPPORT
