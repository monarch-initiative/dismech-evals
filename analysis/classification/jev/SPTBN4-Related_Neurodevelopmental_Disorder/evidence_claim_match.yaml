              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'No population prevalence or incidence estimate of any kind has been published for NEDHND,
          and no ORPHA code with an epidemiology table was available in this checkout, so there is no
          source to band and `NOT_YET_DOCUMENTED` is used rather than a qualitative `ULTRA_RARE` tier.
          `rate_per_100000` is deliberately omitted rather than set to 0.0: no rate has been estimated,
          and a numeric zero would be read downstream as an assertion that the disorder does not occur.
          The only quantity that can be sourced is a case tally: the 2025 systematic natural-history review
          counted 38 reported individuals worldwide, including its own 10 Saudi patients, across all publications
          to that date. Ascertainment is heavily consanguinity-driven - 17 of the 38 were Arab, of whom
          13 were Saudi - so the reported ethnic distribution reflects which health systems run autozygosity-guided
          exome sequencing, and must not be read as a population restriction.'
      selected_evidence:
        snippet: there are only 38 patients (including our 10 cases) reported to carry deleterious variants
          of SPTBN4
        supports: SUPPORT
