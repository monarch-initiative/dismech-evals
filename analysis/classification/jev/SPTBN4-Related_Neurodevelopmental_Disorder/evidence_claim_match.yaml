  17d0263d80725f38c9cc79b9129d8bf2cfdf9881381ac9be501c2031f6987b10:
    claim:
      about:
        disease:
          name: SPTBN4-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of KCNQ2 and KCNQ3 Potassium Channel Clustering
        biological_scale: CELLULAR
        description: This is the mechanistically distinctive lesion of the disorder and the one that best
          explains its epilepsy. Nodal KCNQ2/KCNQ3 (Kv7) channels carry the slow M-current that damps
          repetitive firing. In patient nerve they are not merely reduced but absent, and in the disease
          mouse model the ankyrinR / beta-I spectrin backup that partially rescues sodium channels cannot
          cluster KCNQ2/KCNQ3 at all. Beta-IV spectrin does not bind KCNQ2/3 directly, so it must position
          them through regulatory partners; consistent with that, total KCNQ2 protein is normal in mutant
          animals and only its localisation fails. The functional consequence measured in mice is axonal
          hyperexcitability - spontaneous and evoked neuromyotonic and myokymic discharges arising in
          myelinated axons - which is pharmacologically reversible with the KCNQ2/3 opener retigabine.
        biological_processes:
        - preferred_term: clustering of voltage-gated potassium channels
          modifier: DECREASED
          term:
            id: GO:0045163
            label: clustering of voltage-gated potassium channels
        cellular_components:
        - preferred_term: voltage-gated potassium channel complex
          modifier: DECREASED
          term:
            id: GO:0008076
            label: voltage-gated potassium channel complex
        - preferred_term: node of Ranvier
          term:
            id: GO:0033268
            label: node of Ranvier
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        mechanism_confidence: ESTABLISHED
        notes: 'The mechanistic significance of this node is that it is where the SPTBN4 phenotype touches
          the KCNQ2 phenotypes. KCNQ2 loss of function causes both developmental and epileptic encephalopathy
          7 (MONDO:0013387) and benign familial neonatal seizures 1 (MONDO:0007365), both verified with
          OAK and both already curated in this knowledge base; a disorder that fails to cluster the same
          channel is expected to share features with them, and the 2021 cohort report makes exactly that
          argument. Retigabine is discussed in this entry only as an experimental probe in mice: it has
          never been tested in SPTBN4 disease, it was withdrawn from clinical use for retinal and skin
          pigmentation, and it is therefore NOT curated as a treatment.'
      selected_evidence:
        snippet: Of interest, KCNQ2 subunit aggregates were undetectable at PNS and CNS nodes, whereas
          Nav and Kv1.1/Kv1.2 channels were properly concentrated at nodal and juxtaparanodal regions,
          respectively.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20962009
      reference_title: The C-terminal domain of ßIV-spectrin is crucial for KCNQ2 aggregation and excitability
        at nodes of Ranvier.
      evidence_source: MODEL_ORGANISM
      explanation: Shows the selectivity of the defect - in this allele KCNQ2 clustering fails while sodium
