  8a1231917cfe77d3de3ae84727c941e5e9be2078bee4e6ce86616d7cd532d0bb:
    claim:
      about:
        disease:
          name: SPTBN4-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Central Auditory Conduction Failure
        biological_scale: TISSUE
        description: 'Hearing loss in this disorder is a neuropathy, not a cochlear disease. The quivering
          mouse, which is the natural model of the human condition, is deaf with normal cochlear morphology
          and normal cochlear potentials but abnormal transmission through the brainstem auditory nuclei
          - deafness "central in origin". The same pattern was documented in a patient: otoacoustic emissions
          present, but brainstem evoked response audiometry showing only wave I, localising the block
          to cochlear nerve conduction. Mechanistically the auditory pathway is the most demanding client
          of the nodal scaffold because it encodes at submillisecond precision, and beta-4-spectrin-null
          mice fail specifically at the heminode adjacent to the nerve terminal, with slowed central conduction
          and absent startle responses despite normal cochlear function.'
        cell_types:
        - preferred_term: spiral ganglion neuron
          term:
            id: CL:0011113
            label: spiral ganglion neuron
        locations:
        - preferred_term: cochlear nerve
          term:
            id: UBERON:0004727
            label: cochlear nerve
        - preferred_term: auditory brainstem
          term:
            id: UBERON:0002028
            label: hindbrain
        biological_processes:
        - preferred_term: clustering of voltage-gated sodium channels
          modifier: DECREASED
          term:
            id: GO:0045162
            label: clustering of voltage-gated sodium channels
        mechanism_confidence: ESTABLISHED
        notes: 'This node is the reason the entry does NOT declare conformance to the `sensorineural_hair_cell_loss`
          module. That module''s central effector is hair cell mechanotransduction failure and death,
          and the evidence here points the opposite way: cochlear function is preserved in both the mouse
          and the reported patients, and the lesion is in the first-order auditory neuron and its central
          projection. Curating this as hair-cell disease would be a category error, and would also mislead
          about management, since auditory neuropathy responds poorly to conventional amplification. HP:0000407
          Sensorineural hearing impairment is nonetheless the phenotype term used, because HPO has no
          "auditory neuropathy" term - searches for both `l~auditory neuropathy` and a free-text `auditory
          neuropathy` against `sqlite:obo:hp` returned nothing on 2026-08-01 - and HP:0004463 Absent brainstem
          auditory responses is bound alongside it to carry the neuropathic character.'
      selected_evidence:
        snippet: However, responses from brainstem auditory nuclei show abnormal transmission of auditory
          information, indicating that, in contrast to the many known mutations causing deafness originating
          in the cochlea, deafness in qv is central in origin.
        supports: SUPPORT
