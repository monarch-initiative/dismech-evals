          and is, with hypotonia, the feature that separates this disorder from an isolated hereditary
          neuropathy. The important exception is the sibling pair with a splice-site allele in whom cognition
          was normal, which is why the disorder must be considered in an infant with axonal neuropathy
          even when development appears cognitively appropriate.
        phenotype_term:
