      assertion:
        name: Spinal muscular atrophy type 1
        disease_term:
          preferred_term: spinal muscular atrophy, type 1
          term:
            id: MONDO:0009669
            label: spinal muscular atrophy, type 1
        description: 'The dominant clinical mimic and the diagnosis SPTBN4 patients are actually tested
          for first. A floppy infant with profound weakness, areflexia, poor suck, tongue involvement,
          respiratory compromise and denervation on EMG is SMA type 1 until proven otherwise, and both
          the 2021 cohort and the 2026 sibling report describe SMA testing being sent and returning negative
          before SPTBN4 was found. The distinction is now urgent rather than academic: approved disease-modifying
          therapy exists for SMA and none exists for SPTBN4 disease, so misdiagnosis in either direction
          has direct consequences. (No reference cached for this entry states the SMA treatment landscape;
          the claim is general clinical background, not a sourced assertion.)'
        distinguishing_features:
        - SMN1 testing (deletion/dosage) resolves the question directly and should precede or accompany
          exome sequencing in any floppy infant.
        - Cognition is typically normal in SMA type 1 but severely impaired in most SPTBN4 disease, so
          intellectual disability argues for SPTBN4.
        - Auditory neuropathy and an epileptiform EEG are not features of SMA and, when present, point
          strongly to SPTBN4.
        - Nystagmus, choreoathetosis and cerebral visual impairment occur in SPTBN4 disease and not in
          SMA.
        - Muscle biopsy in SMA shows large-group fascicular atrophy with hypertrophic type 1 fibres; SPTBN4
          biopsies more often show type 1 hypotrophy or patchy neurogenic change.
        notes: MONDO:0009669 was verified with OAK (`runoak -i sqlite:obo:mondo relationships --direction
          down HGNC:11117` returns it as an SMN1 disease with the label "spinal muscular atrophy, type
          1"); SMN1 is hgnc:11117, also verified. The existing dismech entry `kb/disorders/Spinal_Muscular_Atrophy.yaml`
          is bound to the broader MONDO:0001516, not to this type-specific term, so the two are not the
          same entity and no content was copied.
      selected_evidence:
        snippet: Both patients exhibited severe failure to thrive, hypotonia, dysphagia, and global developmental
          delay, initially suggesting spinal muscular atrophy (SMA).
        supports: SUPPORT
