  06bd62c1ac8bc114d567525507948cf659c149e9d4611ea8689294b01abe708e:
    claim:
      about:
        disease:
          name: SPTBN4-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: 'Disease requires two damaging SPTBN4 alleles. Homozygous genotypes dominate the
          reported literature, reflecting ascertainment through consanguineous families in the Middle
          East, Iran, Afghanistan and Kurdish populations; compound heterozygotes are a small minority.
          Heterozygous carriers, including the parents in every reported family, are not described as
          affected, and no dominant or de novo SPTBN4 mechanism has been established for this phenotype.

          Penetrance is left unset rather than asserted. No apparently healthy bi-allelic individual has
          been reported, but neither has any systematic population-database interrogation of SPTBN4 genotypes
          been published, so complete penetrance would be an inference from ascertainment rather than
          an observation. Two counts from the 2025 natural-history review bear on the recessive model
          and are recorded here rather than as separate claims - 31 different pathogenic variants across
          38 patients, and compound heterozygosity in only 4 of them. The same review reports two de novo
          variants in individuals ascertained through ADHD/autism cohorts rather than through NEDHND,
          which is a different and much weaker genotype-phenotype assertion; those cases are not treated
          here as evidence for a dominant mechanism in this disease.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: 'Neurodevelopmental disorder with hypotonia, neuropathy, and deafness (NEDHND, OMIM #617519)
          is an autosomal recessive disease caused by homozygous or compound heterozygous variants in
          SPTBN4 coding for type 4 βIV-spectrin, a non-erythrocytic member of the β-spectrin family.'
        supports: SUPPORT
