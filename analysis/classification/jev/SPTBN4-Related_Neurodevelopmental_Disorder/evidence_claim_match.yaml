      assertion_type: AnimalModel
      assertion:
        species: Mus musculus
        genotype: Sptbn4 gene-trap null (Sptbn4geo) and betaIVSigma1-specific knockout
        category: Targeted knockout
        description: 'Engineered nulls complement the spontaneous series. A gene-trap null was the basis
          for the demonstration that beta-IV spectrin and ankyrin-G stabilise each other reciprocally
          and that both are required for nodal sodium-channel clustering; the same line was later used
          to show the auditory heminode defect and the loss of presynaptic spike fidelity. A separate,
          isoform-specific knockout removing only betaIVSigma1 showed that the actin-binding isoform is
          the one that builds the nodal undercoat. A third strand of work used timed re-expression of
          beta-IV spectrin in vivo to show that nodal reorganisation and functional recovery in the CNS
          are possible only within a critical developmental window - the closest thing to a therapeutic
          proof of concept that exists for this disorder.

          The re-expression experiment is the reason this entry treats the disorder as potentially tractable
          rather than as fixed at birth. Two caveats prevent that being read as a therapeutic claim. First,
          re-expression in the mouse was achieved genetically at chosen developmental time points, not
          by any deliverable agent, and no gene-therapy or ASO approach to SPTBN4 has been reported. Second,
          the critical window closed in the CNS, which is where the most disabling component of the human
          phenotype - intellectual disability - resides, so the arm of the disease most in need of treatment
          is the arm the mouse says is hardest to rescue.'
        genes:
        - preferred_term: SPTBN4
          term:
            id: hgnc:14896
            label: SPTBN4
        associated_phenotypes:
        - Tremor and hindlimb contraction
        - Loss of ankyrinG and sodium channel clustering at AIS and nodes
        - Disappearance of the nodal membrane undercoat with widened nodes
        - Elevated action potential threshold and high-frequency transmission failure in auditory brainstem
        - Absent startle response with normal cochlear function
      selected_evidence:
        snippet: We have generated mice carrying a null mutation in the betaIV-spectrin gene using gene
          trapping in embryonic stem cells.
        supports: SUPPORT
