  c72e40120864db308ec8e42ce8f492434a988a5c42c7a7c8e0a0f2e3e88103ed:
    claim:
      about:
        disease:
          name: SPTBN4-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Contested Skeletal Muscle Involvement
        biological_scale: TISSUE
        description: 'Whether SPTBN4 disease includes a primary myopathy is unresolved, and the two positions
          are held by competent groups using different methods. The myogenic case: the founding report
          described congenital myopathy with incomplete congenital fibre-type disproportion, showed beta-IV-spectrin
          immunostaining at the sarcolemma of normal human and mouse muscle and its absence in patient
          and quivering muscle, and found complete absence of type 1 fibres in quivering mouse muscle;
          a follow-up cohort again found no beta-IV-spectrin staining in patient muscle and type 1 fibre
          hypotrophy without frank fibre-type disproportion, and hypothesised a direct effect on sarcolemmal
          stability and on depolarisation along the myofibre and its T-tubular system. The neurogenic
          case: a muscle-specific conditional knockout showed that beta-4 spectrin does not contribute
          to muscle function, and that the protein is not present in muscle at all - which would make
          the sarcolemmal immunostaining a cross-reaction and the muscle pathology entirely secondary
          to denervation. The 2025 natural-history review sides with the neurogenic reading.'
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        - preferred_term: type 1 (slow) skeletal muscle fiber
          term:
            id: CL:0000189
            label: slow muscle cell
        locations:
        - preferred_term: skeletal muscle tissue
          term:
            id: UBERON:0001134
            label: skeletal muscle tissue
        mechanism_confidence: HYPOTHETICAL
        notes: 'Deliberately curated as one node holding a live disagreement rather than as two confident
          nodes, and marked HYPOTHETICAL because the currently best controlled experiment - a tissue-specific
          conditional knockout with knockout-validated antibody controls - argues against the myogenic
          arm. The practical consequence is diagnostic: a muscle biopsy showing type 1 fibre atrophy in
          a hypotonic infant should not be read as excluding SPTBN4 disease, nor as establishing a primary
          myopathy within it. The 2025 review''s framing is quoted below rather than paraphrased because
          it is a reversal of the disorder''s original description. Note that neither the founding report
          nor the follow-up cohort had access to a beta-IV-spectrin-null muscle as an antibody control,
          which is the specific methodological gap the conditional-knockout study fills.'
      selected_evidence:
        snippet: We hypothesize that βIV-spectrin deficiency directly impacts the structural stability
          of the sarcolemma and the initiation or propagation of the depolarization waves along the myofiber
          and its T-tubular system.
        supports: SUPPORT
