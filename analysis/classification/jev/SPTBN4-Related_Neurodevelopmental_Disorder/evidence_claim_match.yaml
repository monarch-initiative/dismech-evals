        description: 'The peripheral endpoint is a length-dependent motor axonal neuropathy. Electrophysiology
          in patients shows low-amplitude motor responses with preserved conduction velocities - the signature
          of axonal rather than demyelinating disease - together with fibrillation potentials, positive
          sharp waves and enlarged, long-duration motor unit potentials indicating acute and chronic denervation.
          Clinically this produces areflexia, generalised and distal amyotrophy, and weakness that is
          severe enough in most individuals to prevent sitting, standing or walking. Muscle biopsy shows
          the corresponding neurogenic picture in some patients: atrophic fascicles, angulated fibres,
          and fibre grouping.'
        conforms_to: peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination
        biological_processes:
