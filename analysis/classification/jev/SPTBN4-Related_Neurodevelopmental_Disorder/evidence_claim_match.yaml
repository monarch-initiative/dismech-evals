  d25c6a16b6db69ddb3200c78cd1ac67ef264b362e60360f78cc606561d34bd09:
    claim:
      about:
        disease:
          name: SPTBN4-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Extraneural beta-IV Spectrin Expression and Reported Cardiac Involvement
        biological_scale: TISSUE
        description: 'Beta-IV spectrin is not exclusively neuronal. It is abundantly transcribed in pancreatic
          islets as well as brain, and a substantial separate literature places it in cardiomyocytes and
          cardiac fibroblasts as a scaffold for the cardiac sodium channel and as a signalling partner.
          Two individuals with SPTBN4 disease have been reported with cardiac disease: one with non-obstructive
          hypertrophic cardiomyopathy alongside mitochondrial dysfunction and optic atrophy, and one with
          congenital heart defects but no available neuromuscular data. This node exists to mark the possibility
          without over-reading it: two cardiac cases out of 38 reported individuals is not an established
          disease feature, and no cardiac surveillance recommendation follows from it in the GeneReviews
          chapter.'
        locations:
        - preferred_term: heart
          term:
            id: UBERON:0000948
            label: heart
        mechanism_confidence: HYPOTHETICAL
        notes: Explicitly marked HYPOTHETICAL and deliberately not connected to the main causal chain.
          The cardiac beta-IV spectrin literature is large and mechanistically detailed but is almost
          entirely about the mouse and rat heart and about acquired cardiac disease rather than about
          SPTBN4 patients; importing it here would be exactly the named-entity error this entry's preflight
          was designed to avoid. The mitochondrial dysfunction reported in one patient is likewise a single
          observation with no proposed mechanism linking it to beta-IV spectrin, and is not curated as
          a mechanism node.
      selected_evidence:
        snippet: This is the first report of a severe form of ßIV-spectrin deficiency with hypertrophic
          cardiomyopathy and mitochondrial dysfunction.
        supports: SUPPORT
