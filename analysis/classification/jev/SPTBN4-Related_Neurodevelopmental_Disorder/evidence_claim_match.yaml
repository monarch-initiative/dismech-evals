            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: The typical course is profound and lifelong. Most affected individuals never achieve
          head control and cannot sit, stand or walk; speech is absent or limited to single words; tube
          feeding is usually required; and respiratory failure from neuromuscular and bulbar weakness
          is the usual cause of death. Two of seventeen patients with respiratory involvement in the 2025
          review died at 14 months and 3 years of respiratory failure, and a 2026 report describes two
          siblings who died at 18 months and 31 months. Management is entirely supportive. Burden is assigned
          HIGH rather than VARIABLE despite the existence of a mild end (PMID:31857255), because the mild
          presentations are a small minority of a small literature.
      selected_evidence:
        snippet: Affected individuals rarely achieve head control. Most are unable to sit, stand, or walk.
        supports: SUPPORT
