  19c5c3a481b9e65c280d42afa8207f14bb4696a0bb87b472b02dd53108f04feb:
    claim:
      about:
        disease:
          name: SPTBN4-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of the Reciprocal AnkyrinG-beta-IV Spectrin Scaffold
        biological_scale: MOLECULAR
        description: 'AnkyrinG and beta-IV spectrin are not arranged in series but in a reciprocal pair.
          AnkyrinG recruits beta-IV spectrin to the AIS and to nodes through a specific domain in the
          spectrin, and beta-IV spectrin in turn retains ankyrinG there; deleting either one delocalises
          the other. That reciprocity is why an SPTBN4 lesion is not merely the loss of one scaffolding
          activity but the collapse of the adaptor hub through which every clustered channel and adhesion
          molecule is anchored. Two of the routes by which patient alleles break this hub were demonstrated
          directly: failure to localise to the AIS, and loss of phosphoinositide binding by the pleckstrin
          homology domain, which is the membrane-facing half of the linkage.'
        genes:
        - preferred_term: SPTBN4
          term:
            id: hgnc:14896
            label: SPTBN4
        molecular_functions:
        - preferred_term: ankyrin binding
          modifier: DECREASED
          term:
            id: GO:0030506
            label: ankyrin binding
        cellular_components:
        - preferred_term: axon initial segment
          term:
            id: GO:0043194
            label: axon initial segment
        - preferred_term: node of Ranvier
          term:
            id: GO:0033268
            label: node of Ranvier
        cell_types:
        - preferred_term: myelinated neuron
          term:
            id: CL:0000540
            label: neuron
        mechanism_confidence: ESTABLISHED
        notes: 'The reciprocity has a direct consequence for how this disorder relates to ANK3 disease.
          Because ankyrinG-null neurons lose beta-IV spectrin from the AIS and node, and beta-IV-spectrin-null
          neurons lose ankyrinG from the same sites, the two genes converge on one lesion; ANK3-related
          intellectual-disability-hypotonia-spasticity-sleep-disorder syndrome (MONDO:0014210, verified
          with OAK) is curated below as a mechanistic differential on that basis. The asymmetry is also
          informative: a dominant-negative ankyrinG construct displaced beta-IV spectrin without displacing
          endogenous ankyrinG or sodium channels, so beta-IV spectrin is the more downstream and more
          dispensable partner for the initial assembly step, and its role is retention and stabilisation
          rather than nucleation.'
      selected_evidence:
        snippet: These results indicate that betaIV-spectrin and ankyrin-G mutually stabilize the membrane
          protein cluster and the linked membrane cytoskeleton at AIS and NR.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
