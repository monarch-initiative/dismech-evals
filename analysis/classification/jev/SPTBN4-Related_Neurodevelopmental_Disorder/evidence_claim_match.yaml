        name: Genetic counselling and reproductive options
        description: Autosomal recessive recurrence-risk counselling with a 25% risk to each subsequent
          pregnancy, carrier testing for the specific familial alleles once identified, and prenatal or
          preimplantation testing. This carries unusual weight in this disorder because the reported population
          is heavily consanguineous and because the disorder is severe, untreatable and often lethal in
          early childhood; the 2025 Saudi natural-history study frames its entire rationale around enabling
          preimplantation and carrier-screening programmes.
        action_category: COUNSELING_INFORMATIONAL
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: At conception, each sib of an affected individual has a 25% chance of being affected,
          a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not
          a carrier.
        supports: SUPPORT
