              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Phenotype
      assertion:
        name: Seizures
        category: Neurologic
        description: Clinical seizures occur in a substantial minority and are refractory to medication
          in some. They coexist with a distinct and probably more common finding, an abundantly epileptiform
          EEG in a child who has never had a clinical fit. Reported seizure frequency varies more than
          fourfold across sources and no single figure is asserted here.
        phenotype_term:
          preferred_term: Seizure
          term:
            id: HP:0001250
            label: Seizure
        notes: 'The four sources disagree. GeneReviews: half of affected individuals develop seizures.
          The 2021 cohort report: more than half develop seizures or have a pathological EEG - a compound
          endpoint, not the same claim. The 2025 natural-history review of 38 patients: seizures in 21%.
          The HPO annotation set for OMIM:617519 (retrieved 2026-08-01): HP:0001250 with frequency modifier
          "Very rare", sourced to OMIM. No FrequencyEnum band is asserted, and the discrepancy is recorded
          as an explicit knowledge-gap discussion rather than averaged away.'
      selected_evidence:
        snippet: Half of affected individuals develop seizures.
        supports: SUPPORT
