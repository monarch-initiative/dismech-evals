          family were described. Its rarity in humans, set against its prominence in the mouse, is one
          of the clearest human-model mismatches in this disorder.
        phenotype_term:
          preferred_term: Ataxia
          term:
            id: HP:0001251
            label: Ataxia
        notes: Not present in the HPO annotation set for OMIM:617519 as retrieved on 2026-08-01. Curated
          from the 2025 natural-history review, in which ataxia was present in 2 of 10 patients, both
          in family 1, and had never previously been reported in the disorder. The same family also had
          cerebellar vermian atrophy on MRI.
