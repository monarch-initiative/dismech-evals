          HP:0011471 Gastrostomy tube feeding in infancy at 4/5, sourced to PMID:33772159 and PMID:28540413
          (retrieved 2026-08-01). The 2025 review reports gastrointestinal problems in 15 patients (54%).
          The review does not state the denominator for that percentage; 15/54% back-calculates to about
          28, not the 38 patients tabulated overall, so the fraction is a curator inference.
