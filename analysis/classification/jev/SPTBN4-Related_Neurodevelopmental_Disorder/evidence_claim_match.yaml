      assertion_type: Phenotype
      assertion:
        name: Peripheral axonal neuropathy
        category: Neurologic
        diagnostic: true
        description: 'A motor-predominant axonal neuropathy with areflexia is the feature that points
          specifically at SPTBN4 rather than at a generic hypotonia-plus-delay syndrome. It is axonal,
          not demyelinating: motor and sensory conduction velocities are normal while motor amplitudes
          are low. Crucially, it is not detectable in every patient - neurophysiology was entirely normal
          in some - so a normal study does not exclude the diagnosis.'
        phenotype_term:
          preferred_term: Peripheral axonal neuropathy
          term:
            id: HP:0003477
            label: Peripheral axonal neuropathy
        notes: HPO annotation for OMIM:617519 records HP:0003477 Peripheral axonal neuropathy at 2/6 and
          HP:0007002 Motor axonal neuropathy at 1/1, while HP:0007108 Demyelinating peripheral neuropathy
          is recorded at 0/5, all sourced to PMID:33772159 and PMID:28540413 (retrieved 2026-08-01). The
          low numerator for the axonal term reflects how few patients had electrophysiology, not how many
          had neuropathy.
      selected_evidence:
        snippet: Nerve conduction studies showed normal sensory and motor conduction velocities, with
          low-amplitude motor responses.
        supports: SUPPORT
