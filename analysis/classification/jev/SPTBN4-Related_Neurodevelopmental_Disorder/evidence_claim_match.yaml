          and GeneReviews uses "severe-to-profound"; HP:0010864 is bound rather than HP:0002187 because
          it is the term the HPO annotation set actually carries for this OMIM entity, and because the
          two are sibling severity grades rather than parent-and-child, so choosing the more severe one
          on the strength of a paper title would overstate the annotation.
