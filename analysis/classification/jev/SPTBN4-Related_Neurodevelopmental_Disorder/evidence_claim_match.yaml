            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the Dense Nodal Membrane Undercoat
        biological_scale: CELLULAR
        description: 'Beneath the nodal axolemma sits an electron-dense submembranous coat that is thought
          to be what physically holds the channel cluster in place. Beta-IV-Sigma1 spectrin, the actin-binding
          isoform, is an essential component of that coat, and removing it alone makes the coat disappear,
          widens the node, and fills it with organelle-laden membrane dilations. The structural failure
          is separable from the channel-clustering failure: mice retaining only the short Sigma6 isoform
          still show waving and swelling of the AIS and nodal membrane while recovering much of their
          sodium-channel clustering, and mice lacking only Sigma6 do the reverse. So the disorder has
          two mechanistically distinct arms - a mechanical one and an electrical one - and a given truncating
          allele may load them unequally.'
        cellular_components:
        - preferred_term: node of Ranvier
          term:
            id: GO:0033268
            label: node of Ranvier
        - preferred_term: cortical cytoskeleton
          modifier: ABNORMAL
          term:
            id: GO:0030863
            label: cortical cytoskeleton
        cell_types:
        - preferred_term: myelinated neuron
          term:
            id: CL:0000540
            label: neuron
        locations:
        - preferred_term: peripheral nervous system
          term:
            id: UBERON:0000010
            label: peripheral nervous system
        mechanism_confidence: ESTABLISHED
        notes: 'All the ultrastructural evidence for this node is murine. No nerve or brain ultrastructure
          from a human SPTBN4 patient has been published; the closest human evidence is the nerve biopsy
          in the founding cohort, which was assayed for channel content rather than for nodal ultrastructure.
          The structural arm of the mechanism is therefore well established in mouse and inferred in human.
          Note also the CNS/PNS asymmetry seen in the mouse allelic series: central nodes were far more
          severely affected than peripheral ones for the milder qv3J allele, whereas the more complete
          qv4J truncation damaged peripheral nodes too - a dose-dependence that is a plausible, untested
          explanation for why some human alleles produce neuropathy with normal cognition.'
      selected_evidence:
        snippet: Here, we prove that betaIVSigma1 spectrin, the only betaIV spectrin with an actin-binding
          domain, is an essential component of this coat.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
