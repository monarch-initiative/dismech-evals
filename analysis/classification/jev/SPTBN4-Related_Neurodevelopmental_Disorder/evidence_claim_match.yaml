  ede8dcd94ee8676f52c7cd6b4c23860009556ba15825bb9d7fdb4d43ac6f25db:
    claim:
      about:
        disease:
          name: SPTBN4-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
            term:
              id: MONDO:0060496
              label: neurodevelopmental disorder with hypotonia, neuropathy, and deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cortical Network Dysfunction and Impaired Neurodevelopment
        biological_scale: ORGANISM
        description: 'The cognitive and language phenotype is the least mechanistically resolved part
          of the disorder and also its most severe. The axon initial segment is where a cortical pyramidal
          neuron decides whether to fire; beta-IV spectrin is one of the two proteins that build it; and
          beta-IV-spectrin mutant mice have measurably reduced network excitability in vivo. Beyond that
          the chain is inference. Most affected individuals have severe to profound developmental delay
          and intellectual disability with absent or single-word speech, and neuroimaging is normal in
          a substantial minority - 8 of 22 patients with available MRI in the pooled review - so there
          is no gross structural lesion to which the cognitive phenotype can be attributed. Where MRI
          is abnormal the findings are non-specific: vermian atrophy, diffuse T2 hyperintensity, enlarged
          CSF spaces, cerebral atrophy and white matter change.'
        cell_types:
        - preferred_term: cortical pyramidal neuron
          term:
            id: CL:4023111
            label: cerebral cortex pyramidal neuron
        locations:
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
        - preferred_term: cerebellum
          term:
            id: UBERON:0002037
            label: cerebellum
        cellular_components:
        - preferred_term: axon initial segment
          term:
            id: GO:0043194
            label: axon initial segment
        mechanism_confidence: HYPOTHETICAL
        notes: 'Marked HYPOTHETICAL deliberately, and it is the weakest link in the pathograph. There
          is no human neuropathology in SPTBN4 disease - no autopsy, no biopsy of CNS tissue, no iPSC-derived
          neuronal model has been reported. The cortical AIS mechanism is imported wholesale from rodent
          hippocampal and brainstem recordings. The competing explanations are not excluded: the developmental
          delay could be substantially secondary to profound motor and communicative impairment plus recurrent
          hypoxia from aspiration, rather than a primary cortical lesion, and no study has tried to separate
          these. The cerebellar findings are a further complication - ataxia was reported in only one
          Saudi family, yet cerebellar vermian atrophy appears in the imaging series and ataxia is a cardinal
          feature of the quivering mouse, so the cerebellum may be involved more often than the clinical
          phenotype suggests.'
      selected_evidence:
        snippet: βIV spectrin links ankyrinG (AnkG) and clustered ion channels at axon initial segments
          (AISs) and nodes of Ranvier to the axonal cytoskeleton.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/10
      evidence_path: /pathophysiology/10/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
