          explains its epilepsy. Nodal KCNQ2/KCNQ3 (Kv7) channels carry the slow M-current that damps
          repetitive firing. In patient nerve they are not merely reduced but absent, and in the disease
          mouse model the ankyrinR / beta-I spectrin backup that partially rescues sodium channels cannot
          cluster KCNQ2/KCNQ3 at all. Beta-IV spectrin does not bind KCNQ2/3 directly, so it must position
          them through regulatory partners; consistent with that, total KCNQ2 protein is normal in mutant
          animals and only its localisation fails. The functional consequence measured in mice is axonal
          hyperexcitability - spontaneous and evoked neuromyotonic and myokymic discharges arising in
          myelinated axons - which is pharmacologically reversible with the KCNQ2/3 opener retigabine.
