          and the ataxia with oculomotor apraxia syndromes, so those conditions were the working diagnoses
          in reported SQSTM1 patients before sequencing.

          '
        distinguishing_features:
        - Oculocutaneous telangiectasia, raised serum alpha-fetoprotein, immunodeficiency and cancer predisposition
          mark ataxia-telangiectasia and none of them occurs in biallelic SQSTM1 disease.
        - Telangiectasia and alpha-fetoprotein were explicitly looked for and normal in the reported SQSTM1
          patients, which is how the two were separated at the bedside before sequencing.
        - Vertical supranuclear gaze palsy is a defining feature of biallelic SQSTM1 disease and is not
          a feature of ataxia-telangiectasia.
      selected_evidence:
        snippet: In ataxia, nystagmus is common, but other findings such as oculomotor apraxia, supranuclear
          gaze palsy, impaired fixation, or saccadic pursuit can contribute to diagnoses such as ataxia
          with oculomotor apraxia, Niemann-Pick type C, or ataxia telangiectasia.
        supports: SUPPORT
        directness: INDIRECT
