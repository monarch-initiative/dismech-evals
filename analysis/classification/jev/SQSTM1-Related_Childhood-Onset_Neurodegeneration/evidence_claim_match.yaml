      assertion_type: Discussion
      assertion:
        discussion_id: nadgp_heterozygote_risk
        kind: KNOWLEDGE_GAP
        prompt: Are heterozygous carriers of a NADGP truncating allele at increased risk of Paget disease
          of bone or of ALS/frontotemporal dementia, the dominant SQSTM1 disorders?
        attaches_to:
        - genetic#SQSTM1
        - inheritance#Autosomal recessive inheritance
        rationale: 'The dominant SQSTM1 disorders are caused predominantly by missense alleles — the recurrent
          UBA-domain p.Pro392Leu in Paget disease, and missense variants in ALS cohorts — whereas every
          NADGP allele reported is a null. Whether a single null allele confers any risk of the dominant
          phenotypes is unknown: NADGP parents are reported unaffected, but they are young relative to
          the age of onset of Paget disease and ALS and no cohort has been followed. The answer determines
          whether carrier relatives identified during cascade testing need surveillance, and it also bears
          on whether the dominant diseases are haploinsufficiency or altered-function disorders.'
        proposed_experiments:
        - experiment_id: nadgp_carrier_cohort_surveillance
          name: Longitudinal surveillance of obligate NADGP carriers
          description: Assembly of a multi-family cohort of obligate heterozygous carriers of NADGP null
            alleles with longitudinal bone turnover markers, skeletal imaging and neurological assessment,
            compared against age-matched non-carrier relatives.
          would_support:
          - genetic#SQSTM1
      selected_evidence:
        snippet: Screening SQSTM1/p62 for mutations led to the identification of a recurrent nonconservative
          change (P392L) flanking the ubiquitin-associated domain (UBA) (position 394-440) of the protein
          that was not present in 291 control individuals.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
