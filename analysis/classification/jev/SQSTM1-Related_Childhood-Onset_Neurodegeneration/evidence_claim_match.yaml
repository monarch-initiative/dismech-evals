          dystonia and cognitive decline with vertical supranuclear gaze palsy — which is the most characteristic
          sign of Niemann-Pick type C and the oculomotor hallmark of this disorder. A child with progressive
          ataxia and vertical gaze palsy should be evaluated for both.

          '
        distinguishing_features:
        - 'Niemann-Pick type C is neurovisceral: the neurological syndrome is usually preceded by systemic
          signs, either neonatal cholestatic jaundice or splenomegaly and hepatosplenomegaly in infancy
