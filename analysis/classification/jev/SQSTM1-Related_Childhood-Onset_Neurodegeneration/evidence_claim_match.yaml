  8b44cb34cd06b09e358a1e08a26e4d76dbe6619f507498cb61e9d45ea7703d5e:
    claim:
      about:
        disease:
          name: SQSTM1-Related Childhood-Onset Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration with ataxia, dystonia, and gaze palsy, childhood-onset
            term:
              id: MONDO:0014940
              label: neurodegeneration with ataxia, dystonia, and gaze palsy, childhood-onset
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nadgp_mouse_human_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Do the defining phenotypes of the p62-null mouse — tau hyperphosphorylation with neurofibrillary
          tangles, and mature-onset obesity with insulin resistance — occur in humans with complete p62
          absence?
        attaches_to:
        - pathophysiology#Cerebellar and Brainstem Neuron Proteostatic Stress
        - animal_models#Mouse
        rationale: 'The p62-null mouse is the only constitutive mammalian model of this genotype, and
          it is a poor phenotypic match. It develops an Alzheimer-like tauopathy with hippocampal involvement,
          memory impairment and depression-like behaviour, and separately a mature-onset obesity and insulin-resistance
          syndrome. Human NADGP presents in childhood as a cerebellar, extrapyramidal and oculomotor disorder;
          no tau pathology has been looked for in patients because no tissue exists, and no metabolic
          phenotype has been reported in any published family. This is evidence that exists in a model
          whose translational validity is the open question, not absent evidence. It matters practically:
          the tau result has been used to argue that p62 is a general anti-tauopathy factor, and importing
          that framing into NADGP would assert a mechanism no patient observation supports.'
        proposed_experiments:
        - experiment_id: nadgp_tau_and_metabolic_phenotyping
          name: Tau and metabolic phenotyping of NADGP patients
          description: Prospective assessment of plasma and CSF phosphorylated-tau species and, where
            feasible, tau PET in genetically confirmed NADGP patients, alongside structured metabolic
            phenotyping for obesity, glucose intolerance and insulin resistance.
          would_refute:
          - animal_models#Mouse
          supporting_outcome:
          - Elevated phosphorylated tau and a metabolic syndrome in patients, which would upgrade the
            mouse from a poor to a fair model.
          refuting_outcome:
          - Normal tau biomarkers and normal metabolic phenotype, confirming that the mouse phenotypes
            are species-specific and must not be curated as human mechanism.
      selected_evidence:
        snippet: We report here that p62(-/-) mice develop mature-onset obesity, leptin resistance, as
          well as impaired glucose and insulin intolerance.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
