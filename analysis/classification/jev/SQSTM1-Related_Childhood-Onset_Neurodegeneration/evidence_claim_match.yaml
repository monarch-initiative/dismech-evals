            term:
              id: MONDO:0014940
              label: neurodegeneration with ataxia, dystonia, and gaze palsy, childhood-onset
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Selective Autophagy Cargo Recognition
        biological_scale: CELLULAR
        conforms_to: disabled_macroautophagy#Failure of Cytoplasmic Quality Control
        description: 'Without p62 the cell cannot polymerise ubiquitinated cargo into sequestration-competent
          bodies or hand them to LC3 on the phagophore. Patient and knockout cells fail to form ubiquitin-positive
          aggregates under misfolded-protein stress and autophagic flux slows. Note that this is a cargo-recognition
          lesion, not a defect of the core autophagy machinery: the autophagosome can still be built,
          but selectively loading it fails.

          '
        biological_processes:
        - preferred_term: macroautophagy
          term:
            id: GO:0016236
            label: macroautophagy
          modifier: DECREASED
        - preferred_term: aggrephagy
          term:
            id: GO:0035973
            label: aggrephagy
          modifier: DECREASED
        molecular_functions:
        - preferred_term: LC3-interacting region binding of p62 to the phagophore
          term:
            id: GO:0030674
            label: protein-macromolecule adaptor activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: We show that loss of SQSTM1 causes impaired production of ubiquitin-positive protein
          aggregates in response to misfolded protein stress and decelerated autophagic flux.
        supports: SUPPORT
