            term:
              id: MONDO:0014940
              label: neurodegeneration with ataxia, dystonia, and gaze palsy, childhood-onset
        context: []
      assertion_type: Genetic
      assertion:
        name: SQSTM1
        gene_term:
          preferred_term: SQSTM1
          term:
            id: hgnc:11280
            label: SQSTM1
        association: CAUSATIVE
        variant_origin: GERMLINE
        features: 'SQSTM1 (chr5q35.3) encodes p62/sequestosome-1, a 440-residue multidomain scaffold with
          PB1 self-oligomerisation, ZZ zinc-finger, TRAF6-binding, LC3-interacting (LIR), KEAP1-interacting
          (KIR) and ubiquitin-associated (UBA) domains. Every NADGP allele reported to date is predicted-null:
          nonsense (p.Arg96Ter, p.Glu19Ter, p.Glu280Ter), frameshift (p.Glu104fs, p.Leu251SerfsTer4, c.790del),
          canonical splice-site (c.301+2T>A), start-loss (c.1A>G), or a synonymous change that disrupts
          splicing (c.969G>A). No missense NADGP allele has been reported, in pointed contrast to the
          dominant allelic disorders, whose defining alleles are missense.

          '
      selected_evidence:
        snippet: In both cases, initial workup was unremarkable, but whole-exome sequencing revealed a
          novel homozygous pathogenic truncating mutation, SQSTM1 (c.838G>T, p. Glu280Ter).
        supports: SUPPORT
    origin:
