      assertion_type: Pathophysiology
      assertion:
        name: Blunted KEAP1-NRF2 Antioxidant Response
        biological_scale: CELLULAR
        description: 'p62''s KEAP1-interacting region normally competes with NRF2 for the KEAP1 binding
          site, so p62 stabilises NRF2 and sustains antioxidant gene transcription. Complete p62 loss
          is therefore predicted to leave NRF2 less protected from KEAP1-directed degradation and the
          antioxidant response blunted. This node is an inference from the inverse experiment (p62 overproduction
          stabilises NRF2); it has not been measured in NADGP patients or patient cells, and is scoped
          to a hypothesis group for that reason.

          '
        biological_processes:
        - preferred_term: cellular response to oxidative stress
          term:
            id: GO:0034599
            label: cellular response to oxidative stress
          modifier: DECREASED
      selected_evidence:
        snippet: p62 interacts with the Nrf2-binding site on Keap1, a component of Cullin-3-type ubiquitin
          ligase for Nrf2.
        supports: SUPPORT
        directness: INDIRECT
    origin:
