        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        description: Establishes that constitutive p62 loss is sufficient to cause neurodegeneration in
          a mammal, which is the claim the human disorder needs from this model.
        limitations: The mouse phenotype is a tau/neurofibrillary-tangle Alzheimer-like pathology with
          hippocampal and behavioural involvement, plus mature-onset obesity and insulin resistance. Human
          NADGP is a cerebellar-brainstem-basal ganglia syndrome; no tau pathology has been examined in
          patients and no metabolic phenotype is reported. The model therefore supports the sufficiency
          of p62 loss but not the regional pattern or the molecular route.
      selected_evidence:
        snippet: we report age-dependent constitutive activation of glycogen synthase kinase 3beta, protein
          kinase B, mitogen-activated protein kinase, and c-Jun-N-terminal kinase in adult p62(-/-) mice
          resulting in hyperphosphorylated tau, neurofibrillary tangles, and neurodegeneration
        supports: SUPPORT
