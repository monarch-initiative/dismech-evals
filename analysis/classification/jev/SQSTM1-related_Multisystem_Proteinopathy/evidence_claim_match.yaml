        context: []
      assertion_type: Subtype
      assertion:
        name: DMRV
        display_name: Distal myopathy with rimmed vacuoles (SQSTM1)
        description: Late-onset, often asymmetric distal myopathy with ankle dorsiflexion and finger extensor
          weakness, mildly raised creatine kinase and rimmed vacuoles containing p62 and TDP-43. First
          described with the SQSTM1 c.1165+1G>A splice variant, which can cause myopathy without bone
          or brain involvement. Most subsequently reported patients also carry TIA1 p.Asn357Ser, and the
          myopathy is then considered digenic. A frameshift variant has also been reported with a proximal,
          limb-girdle myopathy with rimmed vacuoles.
        genes:
        - preferred_term: SQSTM1
          term:
            id: hgnc:11280
            label: SQSTM1
        - preferred_term: TIA1
          description: The p.Asn357Ser variant is co-inherited with the SQSTM1 variant in most reported
            patients with the myopathy.
          term:
            id: hgnc:11802
            label: TIA1
        subtype_term:
          preferred_term: myopathy, distal, with rimmed vacuoles
          term:
            id: MONDO:0014945
            label: myopathy, distal, with rimmed vacuoles
        inheritance:
        - name: Digenic inheritance
          inheritance_term:
            preferred_term: Digenic inheritance
            term:
              id: HP:0010984
              label: Digenic inheritance
          description: Most patients with SQSTM1-related distal myopathy carry a heterozygous UBA-domain
            SQSTM1 variant (most often p.Pro392Leu) together with the TIA1 p.Asn357Ser variant; the TIA1
            variant is proposed to determine the myodegenerative presentation of the SQSTM1 variant.
      selected_evidence:
        snippet: Affected patients had late-onset distal lower extremity weakness, myopathic features
          on EMG, and muscle pathology demonstrating rimmed vacuoles with both TAR DNA-binding protein
          43 and SQSTM1 inclusions.
        supports: SUPPORT
