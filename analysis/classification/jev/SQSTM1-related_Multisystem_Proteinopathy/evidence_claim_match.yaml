        mechanism_confidence: ESTABLISHED
        description: 'p62 is a multidomain scaffold: an N-terminal PB1 oligomerisation domain, a TRAF6-binding
          region, an LC3-interacting region (LIR) that docks it to the forming autophagosome, a KEAP1-interacting
          region (KIR), and a C-terminal UBA domain that binds ubiquitinated cargo. PDB-associated variants
          cluster in and around the UBA domain, whereas ALS/FTD-associated variants are distributed across
          the protein, including the LIR and KIR. Several alleles, p.Pro392Leu above all, occur in both
          groups. Which presentation an allele produces is therefore only partly predicted by where it
          lies.'
        genes:
        - preferred_term: SQSTM1
          term:
            id: hgnc:11280
