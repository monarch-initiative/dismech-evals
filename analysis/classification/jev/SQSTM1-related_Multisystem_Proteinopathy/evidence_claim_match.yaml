  9506cd879655292767390d9e3fa3454c29769744d2b3e7e153693c44ac728a9f:
    claim:
      about:
        disease:
          name: SQSTM1-related Multisystem Proteinopathy
          disease_term:
            preferred_term: SQSTM1-related multisystem proteinopathy
            term:
              id: MONDO:0800464
              label: SQSTM1-related multisystem proteinopathy
        context: []
      assertion_type: Genetic
      assertion:
        name: SQSTM1
        gene_term:
          preferred_term: SQSTM1
          term:
            id: hgnc:11280
            label: SQSTM1
        variant_origin: GERMLINE
        features: Heterozygous missense, truncating and splice variants. PDB variants cluster in and around
          the UBA domain; ALS/FTD variants are spread across the protein. p.Pro392Leu is the commonest
          allele in PDB, recurs in ALS and FTD, and is the usual SQSTM1 allele in the digenic myopathy.
          The c.1165+1G>A splice variant has been reported in PDB, ALS with PDB, and isolated distal myopathy.
        examples:
        - p.Pro392Leu
        - c.1165+1G>A
        - p.Pro387Leu
        - p.Ala381Val
        - p.Leu341Val
        - p.Gly427Arg
        variants:
        - name: p.Pro392Leu
          description: Recurrent UBA-flanking missense variant; the most frequent SQSTM1 allele in PDB,
            also found in FTD, ALS and the digenic myopathy.
        - name: c.1165+1G>A
          description: Splice-donor variant in intron 7 producing UBA-truncated and PEST2-deleted p62;
            reported in PDB, ALS with PDB, and distal myopathy.
        gene_disease_validity:
        - validity_classification: MODERATE
