        name: Rimmed Vacuolar Myofibre Degeneration
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        subtypes:
        - DMRV
        description: Myopathic degeneration of distal limb muscles with rimmed vacuoles, myofibrillar
          disorganisation, Z-band streaming and fibres containing p62, TDP-43 and LC3. With the c.1165+1G>A
          splice variant, a UBA-truncated and a PEST2-deleted p62 are made; the PEST2-deleted form builds
          large sarcoplasmic inclusions in muscle.
        cell_types:
