        subtypes:
        - PDB3
        description: UBA-domain variants impair p62 ubiquitin binding and raise basal and RANKL-induced
          NF-kB activation in osteoclast precursors, which become hypersensitive to RANKL and form larger
          osteoclasts with more nuclei that resorb more bone. The degree of NF-kB activation by a given
          UBA variant tracks the number of affected bones in patients. Osteoclast precursors from knock-in
          mice also show markers of dysregulated autophagy, so this arm is not purely a signalling defect.
        genes:
