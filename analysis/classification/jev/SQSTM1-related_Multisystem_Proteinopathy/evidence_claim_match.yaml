          name: SQSTM1-related Multisystem Proteinopathy
          disease_term:
            preferred_term: SQSTM1-related multisystem proteinopathy
            term:
              id: MONDO:0800464
              label: SQSTM1-related multisystem proteinopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bone_versus_neuromuscular_arm
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Enhanced RANKL-NF-kB Signalling in Osteoclast Precursors
        - pathophysiology#Impaired p62-Mediated Selective Autophagy
        prompt: Does the bone presentation share the autophagy lesion of the neurological and muscle presentations,
          and what decides which presentation a given SQSTM1 carrier develops?
        rationale: 'The entry models one shared variant node with two branches: a UBA-domain/NF-kB branch
          for bone and a cargo-receptor/autophagy branch for neurons and muscle. The branches are not
          cleanly separable, since mutant osteoclast lineage cells also show autophagy marker changes,
          and the same allele (p.Pro392Leu) produces either or both. Even within bone, two knock-in mouse
          lines disagree on whether the variant alone produces lesions or needs a second factor such as
          measles virus nucleocapsid protein; the Paget_Disease_of_Bone entry discusses that viral hypothesis,
          which studies of human pagetic bone have largely failed to confirm. Co-inherited variants are
          a partial answer for muscle (TIA1 p.Asn357Ser) and possibly for brain (a C9orf72 expansion was
          found with an SQSTM1 variant in one FTD case), but no determinant of the bone versus brain split
          is known. Coexistence of PDB with ALS/FTD may also be under-ascertained, because FTD families
          were not examined for bone disease and PDB families were not assessed for dementia.'
      selected_evidence:
        snippet: Coexistence of PDB and ALS-FTLD is apparently rare and precisely how different SQSTM1
          mutations (some of which are common to both disorders) can lead to either neurodegeneration
          or PDB is currently unknown
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
