              TDP-43. First described with the SQSTM1 c.1165+1G>A splice variant, which can cause myopathy
              without bone or brain involvement. Most subsequently reported patients also carry TIA1 p.Asn357Ser,
              and the myopathy is then considered digenic. A frameshift variant has also been reported
              with a proximal, limb-girdle myopathy with rimmed vacuoles.
