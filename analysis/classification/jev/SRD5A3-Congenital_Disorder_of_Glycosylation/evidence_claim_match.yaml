        context: []
      assertion_type: Diagnosis
      assertion:
        name: Retinal electrophysiology and imaging
        diagnosis_term:
          preferred_term: fundus autofluorescence imaging with electroretinography
          term:
            id: NCIT:C162465
            label: Fundus Autofluorescence Imaging
        description: 'The route by which this diagnosis is actually reached in a substantial share of
          patients, and the one the transferrin screen above does not cover. Fundus autofluorescence and
          optical coherence tomography detect the retinal dystrophy, and electroretinography characterises
          it as combined rod and cone dysfunction.

          Two things make this more than a supporting investigation. It has found retinal dystrophy in
          a patient followed for years under a different ophthalmic diagnosis, so a normal-looking fundus
          is not a rule-out; and in one series every patient came to attention this way rather than through
          metabolic medicine. NCIT has no electroretinography term reachable from Clinical Intervention
          or Procedure, so the binding names the imaging half and the preferred term carries both.'
      selected_evidence:
        snippet: Fundus autofluorescence imaging and optical coherence tomographic scans were abnormal
          in all patients, and electrodiagnostic testing revealed rod and cone dysfunction in the 5 patients
          tested.
        supports: SUPPORT
