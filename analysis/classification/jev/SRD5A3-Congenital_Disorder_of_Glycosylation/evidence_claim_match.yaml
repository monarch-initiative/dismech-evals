              label: SRD5A3-congenital disorder of glycosylation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: corticospinal_involvement
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is there a corticospinal or neuromuscular component to SRD5A3-CDG beyond the cerebellar
          and ocular involvement that defines it?
        attaches_to:
        - pathophysiology#Cerebellar and Optic Pathway Vulnerability
        - genetic#SRD5A3 pathogenic variants
        rationale: 'One patient has been reported with a proximal limb-girdle pattern of weakness, diffusely
          brisk reflexes and bilateral extensor plantar responses alongside the usual retinal dystrophy,
          ataxia and ichthyosiform skin change, and the authors propose this as an expansion of the neurological
          phenotype.

          This entry records the allele but does not curate limb-girdle weakness, hyperreflexia or extensor
          plantar responses as phenotypes. That is a deliberate line rather than an omission. It is a
          single patient; upper and lower motor neuron signs in a child with a multisystem disorder and
          marked hypotonia have several possible readings; and the features that would distinguish a genuine
          corticospinal component from an incidental one - imaging of the tracts, nerve conduction, muscle
          histology - are not reported. Curating three new phenotypes off one case would put them on the
          same footing as findings established across cohorts.

          Resolving it needs targeted neurological examination in an existing SRD5A3-CDG cohort, not another
          case report.'
      selected_evidence:
        snippet: neurological assessment revealed proximal limb-girdle pattern of weakness, hyperactive
          reflexes, extensor plantar responses with evidence of cerebellar dysfunction
        supports: SUPPORT
