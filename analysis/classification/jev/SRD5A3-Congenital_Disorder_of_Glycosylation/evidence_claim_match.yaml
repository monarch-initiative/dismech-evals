          level, including a mevalonate-pathway readout that connects the lesion to the isoprenoid supply
          upstream of polyprenol.
        limitations: An invertebrate. It cannot model the features that define the human disease clinically
          - the ocular malformations, the cerebellar vermis hypoplasia, the skin phenotype - so its value
          is as a screening system and a mechanism probe, not as a phenocopy.
