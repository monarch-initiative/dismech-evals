        context: []
      assertion_type: Treatment
      assertion:
        name: Atorvastatin (experimental, not established therapy)
        description: 'The only candidate disease-modifying therapy proposed for this disorder, and it
          is at the preclinical stage. An HMG-CoA reductase inhibitor is a counter-intuitive choice here
          - it restricts the isoprenoid supply upstream of polyprenol - but the logic follows from this
          entry''s mechanism: if the pathogenic quantity is the polyprenol-to-dolichol ratio rather than
          the dolichol level, then reducing polyprenol production should help even though it reduces flux
          into the pathway overall. In patient fibroblasts it did restore the ratio, and in the worm model
          it rescued the phenotype. Recorded here so the reasoning is visible, explicitly NOT as a treatment
          in clinical use: no patient has been treated, and no trial is reported.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
