              the most frequently reported allele in this disorder: it is the homozygous genotype of all
              seven patients in the four-family retinal-dystrophy series and of the reported twin pair,
              as well as of the fibroblast donor. So the model is built on the allele that the largest
              share of published patients actually carry, rather than on a convenient null.'
