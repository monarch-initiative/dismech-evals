  08255ca6def2cb0e5f17686bf2aa9aed1b817ce89dcac79d19b11f83dee121aa:
    claim:
      about:
        disease:
          name: SRD5A3-Congenital Disorder of Glycosylation
          disease_term:
            preferred_term: SRD5A3-congenital disorder of glycosylation
            term:
              id: MONDO:0012885
              label: SRD5A3-congenital disorder of glycosylation
        context: []
      assertion_type: Genetic
      assertion:
        name: SRD5A3 pathogenic variants
        gene_term:
          preferred_term: SRD5A3
          term:
            id: hgnc:25812
            label: SRD5A3
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'All reported alleles act by loss of function. Most are nonsense or frameshift changes
          in the homozygous state, arising in consanguineous families; documented examples include c.57G>A
          (p.Trp19X) and c.603G>A (p.Trp201X). Compound heterozygosity with a missense allele is less
          common and was first described in adults whose cognitive phenotype was milder, consistent with
          residual catalytic activity. Genotype does not determine the full phenotype: siblings homozygous
          for the same nonsense allele differ in whether they have structural eye anomalies or skin involvement.'
        variants:
        - name: SRD5A3 c.57G>A (p.Trp19X)
          description: 'An exon 1 nonsense allele leaving no functional protein. It is the genotype behind
            the entry''s central mechanistic observation: fibroblasts from this homozygous patient still
            contained normal dolichol while accumulating polyprenol, which is what forces the mechanism
            onto the polyprenol-to-dolichol ratio rather than onto dolichol depletion.

            It is also the most frequently reported allele in this disorder, and the reports that carry
            it are the ones that reframed the eye phenotype: seven individuals from four unrelated South
            Asian families, all homozygous for it, ascertained through eye clinics as early-onset retinal
            dystrophy, and separately a pair of monozygotic twins. Whether that reflects a founder haplotype
            is not established in the cited sources — the families are described as unrelated, and no
            haplotype analysis is reported — so it is recorded here as recurrent, not as a founder allele.'
          gene:
            preferred_term: SRD5A3
            term:
              id: hgnc:25812
              label: SRD5A3
          type: NONSENSE
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: polyprenol reductase activity
            description: Abolishes the enzyme. Despite that, dolichol levels are preserved, implying an
              alternative biosynthetic route.
        - name: SRD5A3 c.603G>A (p.Trp201X)
          description: A nonsense allele found homozygous in two affected siblings. Those siblings differ
            from each other in whether they have structural eye anomalies and in the severity of their
            skin involvement, which is this entry's evidence that genotype does not fix the phenotype.
          gene:
            preferred_term: SRD5A3
            term:
              id: hgnc:25812
              label: SRD5A3
          type: NONSENSE
          clinical_significance: PATHOGENIC
        - name: SRD5A3 c.460T>C (p.Ser154Pro)
          description: A missense allele modelled onto the predicted protein structure. It falls in a
            potential active site and is predicted to reduce catalytic efficiency rather than abolish
            it. Missense alleles are the minority in this disorder and are associated with the milder
            end of the cognitive spectrum, which is consistent with residual activity.
          gene:
            preferred_term: SRD5A3
            term:
              id: hgnc:25812
              label: SRD5A3
          type: MISSENSE
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: polyprenol reductase activity
            description: Predicted to reduce catalytic efficiency. This is an in silico prediction from
              structural modelling, not a measured enzyme activity.
        - name: SRD5A3 c.203dupC (p.Phe69LeufsX2)
          description: A frameshift allele found homozygous in a consanguineous family whose condition
            had been described, and mapped, as a separate entity — Kahrizi syndrome, defined by intellectual
            disability with coloboma, cataract and kyphosis. Identifying this variant is what showed the
            two conditions to be the same gene, and is the reason Kahrizi syndrome is a synonym of this
            entry rather than a differential diagnosis.
          gene:
            preferred_term: SRD5A3
            term:
              id: hgnc:25812
              label: SRD5A3
          type: FRAMESHIFT
          clinical_significance: PATHOGENIC
        - name: SRD5A3 c.436G>A (p.Glu146Lys)
          description: A missense allele found homozygous in a child followed for years as congenital
            nystagmus with bilateral optic neuropathy, in whom dedicated retinal imaging then showed an
            unrecognised retinal dystrophy. The same patient had optic nerve head drusen, which the authors
            state had not previously been seen in this syndrome; that is a single observation and is not
            curated as a phenotype here.
          gene:
            preferred_term: SRD5A3
            term:
              id: hgnc:25812
              label: SRD5A3
          type: MISSENSE
          clinical_significance: PATHOGENIC
        - name: SRD5A3 c.509A>G (p.Tyr170Cys)
          description: A missense allele reported in a single patient who had the expected retinal dystrophy,
            ataxia and ichthyosiform skin change, together with a proximal limb-girdle pattern of weakness,
            brisk reflexes and extensor plantar responses. The authors propose those last findings as
            an expansion of the neurological phenotype. This entry records the allele but not the proposed
            new features as phenotypes — see the discussion on corticospinal involvement for why.
          gene:
            preferred_term: SRD5A3
            term:
              id: hgnc:25812
              label: SRD5A3
          type: MISSENSE
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: Sanger sequencing of SRD5A3 was performed and confirmed a novel homozygous nonsense mutation
        supports: SUPPORT
