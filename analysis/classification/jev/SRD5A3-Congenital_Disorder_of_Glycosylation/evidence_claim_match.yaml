      assertion_type: Discussion
      assertion:
        discussion_id: dolichol_supplementation
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Could supplying dolichol itself bypass the enzymatic block, and is there any experimental
          support for that outside human cells?
        attaches_to:
        - pathophysiology#SRD5A3 Polyprenol Reductase Deficiency
        - treatments#Atorvastatin (experimental, not established therapy)
        rationale: 'The one therapeutic candidate this entry carries, atorvastatin, works upstream: it
          was found in a motility screen and acts on the isoprenoid supply, not on the missing reduction
          step. A more direct idea is to replace the product. There is no human evidence for it, but there
          is a plant result that bears on whether the logic holds at all: in Arabidopsis, the orthologue
          of SRD5A3 is essential, its loss impairs protein glycosylation, and the resulting dolichol shortage
          is partially corrected by feeding dolichol.

          Two things stop that from being a treatment proposal. The rescue is partial and in a plant,
          whose dolichol requirements and uptake are not those of a human; and this entry''s own mechanism
          argues the target may be wrong, since patient cells have normal dolichol already and the proposed
          lesion is the polyprenol-to-dolichol ratio. Adding dolichol would lower that ratio, so the idea
          is not incoherent - but it is untested, and the paper proposing it does so as a general suggestion
          for glycosylation disorders rather than for this one.'
      selected_evidence:
        snippet: Shortage of dolichol in PPRD2-deficient cells is partially rescued by PPRD1 overexpression
          or by supplementation with dolichol.
        supports: SUPPORT
