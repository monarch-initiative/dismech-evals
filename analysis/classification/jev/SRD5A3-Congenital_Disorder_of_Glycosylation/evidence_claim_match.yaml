      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: polyprenol_competition_model
        hypothesis_label: Raised Polyprenol-to-Dolichol Ratio Model
        status: CANONICAL
        description: 'The operative lesion is not the absence of dolichol but the accumulation of its
          unreduced precursor. Fibroblasts from a patient homozygous for an exon 1 stop codon, with no
          functional polyprenol reductase, contained normal amounts of dolichol together with elevated
          polyprenol, yet still hypoglycosylated transferrin. On this model the excess polyprenol competes
          with dolichol at the initiation of N-glycan assembly without being able to support glycosylation,
          so the pathogenic quantity is the ratio rather than the dolichol level. It also accounts for
          why complete dolichol loss is not seen: an alternative dolichol biosynthetic route persists,
          and its absence would be expected to be lethal.'
        notes: Recorded as CANONICAL because it is the only mechanism proposed in this literature and
          is consistent with the fibroblast measurements, not because it has been tested against an alternative.
          The competition step itself is inferred from the lipid ratio; no assay of polyprenol-linked
          glycan initiation is cited.
      selected_evidence:
        snippet: hypothesized that one explanation may be not the absence of dolichol (which would be
          lethal) but the increased ratio of polyprenol to dolichol leading to the phenotype associated
          with SRD5A3-CDG
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
