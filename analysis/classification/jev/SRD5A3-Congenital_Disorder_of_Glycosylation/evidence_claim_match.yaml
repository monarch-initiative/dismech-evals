              id: MONDO:0012885
              label: SRD5A3-congenital disorder of glycosylation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: no_mouse_model
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why is there still no isolated Srd5a3 mouse model of this disease, and does the one published
          mouse deletion covering the locus tell us anything about it?
        attaches_to:
        - pathophysiology#SRD5A3 Polyprenol Reductase Deficiency
        rationale: 'The absence is documentable rather than merely apparent, which is unusual for a negative.
          A spontaneous mouse mutant carrying a megabase-scale 5qC3.3 deletion does remove Srd5a3, and
          homozygotes die at peri-implantation - but that lethality was traced to Exoc1, one of the other
          eight genes in the interval, and confirmed by making an Exoc1 knockout separately and by showing
          that a CRISPR-engineered deletion of the same interval lacking the Exoc1 defect does not kill
          the embryo. So the only mouse in this literature that lacks Srd5a3 tells us nothing about Srd5a3,
          and it would be a mistake to read peri-implantation lethality as this gene''s phenotype. The
          gap that leaves is consequential: the disorder''s defining features are ocular malformation
          and cerebellar hypoplasia, and neither the patient fibroblasts nor the C. elegans model can
          address them. Every tissue-selectivity question in this entry is unanswerable without a vertebrate
          model.'
      selected_evidence:
        snippet: Genetic investigation revealed deletion of a > 1.2-Mb genomic region containing nine
          genes (Kit, Kdr, Srd5a3, Tmeme165, Clock, Pdcl2, Nmu, Exoc1, and Cep135).
        supports: SUPPORT
    origin:
