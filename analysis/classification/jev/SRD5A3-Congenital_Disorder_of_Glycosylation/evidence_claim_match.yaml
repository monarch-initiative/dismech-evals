      reference_title: 'Tissue-specific expression and regulation of congenital disorders of glycosylation
        genes: A GTEx-based in silico study.'
      evidence_source: COMPUTATIONAL
      explanation: 'Cited as REFUTE against the simplest explanation for why this node exists - that the
        cerebellum and optic pathway are hit because they express SRD5A3 most. Across twelve CDG genes
        in healthy tissue that does not hold. It leaves the selectivity unexplained rather than explaining
        it, which is the point: the hypothesis above, that the optic nerve is unusually sensitive to accumulated
        polyprenol, is not competing with a well-supported alternative.'
