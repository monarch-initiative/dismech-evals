          that were not present in childhood, so the disorder is progressive rather than purely static.
          This is the basis for the recommendation that children diagnosed with SRD5A3-CDG be monitored
          for these complications as they age.

          The retinal component needs a distinction the sources do not always make. It is progressive,
          but it is not late-onset: cohorts ascertained through eye clinics find visual loss by age three
          and a rod-cone dystrophy on imaging in patients whose retinas were never examined that way before.
          What arrives late is the diagnosis, not the disease. Cataract and kyphosis, by contrast, are
          documented as genuinely absent in childhood and present in the same patients as adults.'
      selected_evidence:
        snippet: All individuals diagnosed with SRD5A3-CDG as children will need close monitoring for
          the development of cataracts, retinitis pigmentosa, and kyphosis as they age.
        supports: SUPPORT
