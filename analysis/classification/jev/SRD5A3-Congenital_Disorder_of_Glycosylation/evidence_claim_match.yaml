  54a6e5d71acb88a17b2b3d3c152be4b9c437fa0530028a502e83dbe13d77e4b2:
    claim:
      about:
        disease:
          name: SRD5A3-Congenital Disorder of Glycosylation
          disease_term:
            preferred_term: SRD5A3-congenital disorder of glycosylation
            term:
              id: MONDO:0012885
              label: SRD5A3-congenital disorder of glycosylation
        context: []
      assertion_type: Biochemical
      assertion:
        name: Elevated polyprenol-to-dolichol ratio
        presence: INCREASED
        biomarker_term:
          preferred_term: polyprenol-to-dolichol ratio
        context: Measured by lipid quantification in cultured patient fibroblasts. NCIT has no term for
          either lipid - searching it returns the reductase protein and the SRD5A3 allele, not the analytes
          - so this biomarker is deliberately left with a free-text preferred_term rather than bound to
          an unrelated code.
        notes: 'This is the biochemical signature that defines the disorder and the measurement the whole
          mechanism of this entry rests on. Its diagnostic value is unusual in shape: the abnormality
          is the ratio, not either quantity on its own, because dolichol itself is normal in cells with
          no functional enzyme. A laboratory measuring dolichol alone would report a normal result in
