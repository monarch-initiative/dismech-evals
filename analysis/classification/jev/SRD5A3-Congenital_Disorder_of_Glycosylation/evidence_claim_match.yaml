      assertion_type: Pathophysiology
      assertion:
        name: SRD5A3 Polyprenol Reductase Deficiency
        biological_scale: MOLECULAR
        description: 'Biallelic SRD5A3 variants abolish or reduce polyprenol reductase, the enzyme that
          reduces the alpha-isoprene unit of polyprenol to yield dolichol. Reported alleles are predominantly
          nonsense and frameshift changes; a missense allele modelled onto the predicted protein structure
          falls in a potential active site and is predicted to reduce catalytic efficiency rather than
          abolish it, which fits the milder phenotype seen in compound heterozygotes.

          What that enzymatic step is has been revised since SRD5A3 was identified. Finding the gene,
          together with its yeast counterpart, established the view that dolichol is made from polyprenol
          in one step; the later discovery of DHRSX in CDG patients replaced that with a three-step detour
          pathway, now shown to be conserved in yeast. The revision matters for this entry in a specific
          way: the yeast DHRSX counterpart cannot be substituted for by SRD5A3, so the two are separate,
          non-redundant steps rather than alternative routes to the same product. Whatever preserves dolichol
          levels in SRD5A3-null patient fibroblasts, it is not DHRSX standing in for the missing enzyme.'
        genes:
        - preferred_term: SRD5A3
          term:
            id: hgnc:25812
            label: SRD5A3
        molecular_functions:
        - preferred_term: polyprenol reductase activity
          term:
            id: GO:0102389
            label: polyprenol reductase activity
          modifier: DECREASED
      selected_evidence:
