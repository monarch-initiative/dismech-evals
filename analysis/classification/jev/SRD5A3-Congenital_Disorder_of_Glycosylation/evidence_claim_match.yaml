            term:
              id: MONDO:0012885
              label: SRD5A3-congenital disorder of glycosylation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tissue_selectivity_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do the cerebellum and optic pathway bear the brunt of a defect in a biosynthetic step
          that is required by every cell?
        attaches_to:
        - pathophysiology#Cerebellar and Optic Pathway Vulnerability
        - pathophysiology#Systemic Protein Hypoglycosylation
        rationale: 'Serum glycoproteomics shows hypoglycosylation is broad, affecting most measured glycopeptides,
          yet the clinical phenotype is dominated by two tissues. One hypothesis has been offered - particular
          sensitivity of the optic nerve to accumulated polyprenol, supported by the contrast with DOLK-CDG,
          which sits one step downstream, shares the skin and seizure phenotype and lacks the eye involvement.
          That contrast is suggestive but is a comparison between two small case literatures, not an experiment.
          Nothing in the cited work measures polyprenol in neural or retinal tissue, so the edge from
          hypoglycosylation to tissue selectivity is left with unknown intermediates in this pathograph.

          The obvious rival explanation has been checked and does not work. If affected tissues were simply
          the ones that need the most SRD5A3, baseline expression would track the phenotype; across twelve
          CDG genes in healthy human tissue it does not. What that survey does find for SRD5A3 is among
          the strongest tissue-specific departures from balanced biallelic expression of any gene it examined,
          which is a different kind of candidate and an untested one. So the gap is not that nobody has
          looked - it is that the cheapest explanation has been ruled out and the remaining ones are unmeasured
          in the tissues that matter.'
      selected_evidence:
        snippet: The optic nerve may be more sensitive to accumulation of polyprenol and this could explain
          why optic nerve atrophy/hypoplasia are ubiquitous in SRD5A3-CDG but not as frequent in other
          N-linked CDG.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
