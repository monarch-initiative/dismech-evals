        context: []
      assertion_type: Diagnosis
      assertion:
        name: Intragenic copy-number analysis when sequencing is uninformative
        diagnosis_term:
          preferred_term: exome-based copy number analysis
        description: 'Sequencing does not always find the second allele. In one reported sibship the second
          variant was an intragenic tandem duplication of exons 2 to 4, invisible to the standard exome
          pipeline and found only when copy-number analysis was applied to the exome data. The patients
          were clinically typical, so nothing about the presentation signalled that the first result was
          incomplete.

          This is recorded as a diagnostic step so that a single heterozygous pathogenic variant in a
          clinically compatible patient is not read as excluding the diagnosis. NCIT has no term for this
          analysis under Clinical Intervention or Procedure, so it is left with a free-text preferred
          term.'
      selected_evidence:
        snippet: Only when applying exome-based copy number analysis, we identified as a second compound
          heterozygous variant a previously not reported tandem duplication of exons 2-4 in SRD5A3.
        supports: SUPPORT
    origin:
