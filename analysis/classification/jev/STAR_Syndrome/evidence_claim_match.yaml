            label: CCNQ
        association: Defining gene; heterozygous loss-of-function variants and deletions cause STAR syndrome,
          and ClinGen rates the X-linked relationship Moderate, so relationship_type is left unset rather
          than recorded as CAUSATIVE (Definitive or Strong).
        variant_origin: GERMLINE
        notes: CCNQ was named FAM58A when the disease gene was identified. Reported alleles include intragenic
          and larger Xq28 deletions, splice-site variants, a nonsense variant in the last exon (p.Trp217Ter)
          and frameshifts, including one that extends the protein. Larger deletions remove neighbouring
          genes as well, and a 130 kb deletion was found in the only reported lethal case, which also
          had cleft lip and palate, omphalocele and cerebral malformations; the extra features of such
          cases may reflect loss of the flanking genes. ClinGen excluded the deletion cases that remove
          additional genes from its gene-level curation.
