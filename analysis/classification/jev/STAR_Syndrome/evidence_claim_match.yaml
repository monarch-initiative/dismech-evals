        description: Knockout of Cdk10, the kinase partner of cyclin M, models loss of the CDK10/cyclin
          M complex rather than heterozygous CCNQ loss. Homozygous mice die after birth with growth retardation,
          skeletal defects and kidney and lung abnormalities, and their embryonic fibroblasts grow longer
          primary cilia. No Ccnq-deficient mouse is described in the cited literature.
        modeled_mechanisms:
        - target: Increased Primary Cilium Assembly and Elongation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: CELLULAR
          description: Cdk10-knockout embryonic fibroblasts reproduce the longer primary cilia seen with
            CDK10/cyclin M knockdown in human cells.
          limitations: The model removes CDK10 in both alleles of an autosomal gene, not one copy of X-linked
            CCNQ, so it lacks the X-inactivation mosaicism of affected females and models the related
            Al Kaissi syndrome more closely than STAR syndrome.
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: Cyclin M itself is intact in this model; any CDK10-independent function of cyclin
              M, and the female mosaic state produced by X-inactivation, are outside it.
      selected_evidence:
        snippet: Homozygous Cdk10-knockout mice died postnatally with severe growth retardation, skeletal
          defects, and kidney and lung abnormalities, symptoms that partly resemble the disease's effect
          in humans.
        supports: SUPPORT
