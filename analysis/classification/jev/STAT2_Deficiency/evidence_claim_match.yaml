      reference_title: STAT2 deficiency and susceptibility to viral illness in humans.
      evidence_source: HUMAN_CLINICAL
      explanation: Illustrates the severe viral illness phenotype, including disseminated live vaccine-strain
        measles, that follows from failed cell-intrinsic antiviral immunity.
