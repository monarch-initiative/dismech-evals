      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: incomplete_penetrance_model
        hypothesis_label: Incomplete penetrance and type I IFN redundancy
        description: 'Although STAT2 is essential for type I interferon signaling in vitro, the clinical
          phenotype shows incomplete penetrance for severe viral infection and many common childhood viral
          illnesses run a mild course. This is interpreted as evidence that human type I interferons are
          more redundant for protective antiviral immunity under natural conditions than expected, with
          type I IFN-independent mechanisms of cell-intrinsic antiviral immunity compensating in most
          infections.

          '
      selected_evidence:
        snippet: surviving STAT2-deficient individuals have remained generally healthy, with no obvious
          defects in their adaptive immunity or developmental abnormalities.
        supports: SUPPORT
