          preferred_term: STAT2
          term:
            id: hgnc:11363
            label: STAT2
        notes: 'Biallelic loss-of-function STAT2 variants cause this autosomal recessive disease. Reported
          lesions include a homozygous intron 4 splice-disrupting mutation (Hambleton et al) and compound
          heterozygous c.C1528T (p.R510X, nonsense-mediated decay) plus c.G1576A splice variants (Moens
          et al kindred). STAT1-dependent type II interferon signaling is preserved.

          '
      selected_evidence:
        snippet: Sequencing of genomic DNA and RNA revealed a homozygous mutation in intron 4 of STAT2
          that prevented correct splicing in patient cells.
        supports: SUPPORT
