              label: primary immunodeficiency with post-measles-mumps-rubella vaccine viral infection
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Permissiveness to Viral Replication
        description: 'Without an inducible type I interferon antiviral program, host cells cannot restrict
          viral replication. Clinically this manifests as severe viral illness and, characteristically,
          disseminated disease following live attenuated viral vaccines such as measles-mumps-rubella.
          The defect is cell-intrinsic and reproducible in patient fibroblasts, which fail to be protected
          by exogenous IFN-alpha (but remain responsive to IFN-gamma).

          '
        cell_types:
        - preferred_term: Fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: Viral defense failure
          term:
            id: GO:0051607
            label: defense response to virus
          modifier: DECREASED
      selected_evidence:
        snippet: the proband developed disseminated vaccine strain measles following routine immunization,
          whereas an infant brother died after a 2-d febrile illness from an unknown viral infection.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
