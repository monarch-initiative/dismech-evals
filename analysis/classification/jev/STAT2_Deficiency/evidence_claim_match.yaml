  13638c6d519254cea5f2cefb32257c2df79861155fa014daa9e9dca149e2557d:
    claim:
      about:
        disease:
          name: STAT2 Deficiency
          disease_term:
            preferred_term: STAT2 deficiency
            term:
              id: MONDO:0014715
              label: primary immunodeficiency with post-measles-mumps-rubella vaccine viral infection
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Type I Interferon (ISGF3) Signaling
        description: 'STAT2 is a required subunit of the heterotrimeric ISGF3 complex (STAT1-STAT2-IRF9)
          assembled downstream of the type I interferon receptor. Biallelic loss-of-function STAT2 variants
          abolish or cripple STAT2 protein expression and prevent ISGF3-dependent transcription, so type
          I interferon (IFN-alpha/beta) fails to induce its antiviral interferon-stimulated genes (e.g.,
          MxA, ISG15, OAS1). Because type III interferon (IFN-lambda) signals through the same ISGF3 module,
          the mucosal IFN-lambda arm is likely impaired as well, whereas STAT1-dependent type II (IFN-gamma/GAF)
          signaling remains intact - distinguishing STAT2 deficiency from the broader STAT1 deficiency
          phenotype that also includes mycobacterial susceptibility.

          '
        cell_types:
        - preferred_term: Fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: Type I interferon signaling
          term:
            id: GO:0060337
            label: type I interferon-mediated signaling pathway
          modifier: DECREASED
        - preferred_term: Cellular response to type I interferon
          term:
            id: GO:0071357
            label: cellular response to type I interferon
          modifier: DECREASED
        - preferred_term: Antiviral defense response
          term:
            id: GO:0051607
            label: defense response to virus
          modifier: DECREASED
      selected_evidence:
        snippet: Functional studies showed an impaired IFN-I-induced response and a defective IFNα expression
          at later stages of STAT2 pathway induction.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
