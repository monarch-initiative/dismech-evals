        description: Recombinant IGF-1 bypasses the GH receptor-STAT5B defect and is the growth-directed
          therapy. In three siblings it raised height velocity over the first three years, but the response
          was smaller than in other forms of severe primary IGF-I deficiency, and hypoglycemia limited
          dosing in one child. An earlier report found no meaningful response in a chronically ill patient.
          It does not address the immune defect.
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: mecasermin
            term:
              id: CHEBI:749581
              label: mecasermin
      selected_evidence:
        snippet: The response to rhIGF-1 therapy is less than observed with rhIGF-1 therapy for patients
          previously described with severe primary IGF-I deficiency, including patients with documented
          defects in the growth hormone receptor, but may still provide patients with STAT5B deficiency
          with an opportunity to prevent worsening growth failure.
        supports: SUPPORT
