      assertion_type: Discussion
      assertion:
        discussion_id: stat5a_compensation_growth
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Impaired GH-Induced IGF-1 Production
        - animal_models#Mouse
        prompt: Why does mouse Stat5a partly substitute for Stat5b in growth-hormone signalling when human
          STAT5A apparently does not?
        rationale: The Stat5b knockout mouse is GH-resistant with low IGF-I, but its growth defect is
          largely confined to males and the IGF-I fall is partial, which the mouse literature attributes
          to partial compensation by Stat5a. In patients IGF deficiency is profound in both sexes, and
          in patient dermal fibroblasts endogenous STAT5A did not restore GH-induced IGF1 expression.
          The mouse therefore under-models the growth arm of the disease, and the paralog-redundancy difference
          that would explain this is not established in human hepatocytes, the cells that produce circulating
          IGF-I.
      selected_evidence:
        snippet: suggested that, in mice, Stat5a can partially compensate for loss of Stat5b
        supports: SUPPORT
