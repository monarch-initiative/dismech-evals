              label: combined immunodeficiency due to STIM1 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Abolished Store-Operated Calcium Entry
        biological_scale: CELLULAR
        description: 'Store-operated calcium entry is the dominant sustained calcium influx pathway in
          lymphocytes, and it is also required in skeletal muscle, ameloblasts and eccrine sweat gland
          cells. Its loss is demonstrable in patient T cells, NK cells, B cell lines and fibroblasts,
          and is the single cellular lesion from which every arm of the disease follows. STIM1 is near-ubiquitously
          expressed, so the lesion is present in far more tissues than are clinically affected: the restriction
          of the phenotype reflects where SOCE is non-redundant, not where STIM1 is expressed.

          '
        biological_processes:
        - preferred_term: store-operated calcium entry
          modifier: DECREASED
          term:
            id: GO:0002115
            label: store-operated calcium entry
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        - preferred_term: natural killer cell
          term:
            id: CL:0000623
            label: natural killer cell
        - preferred_term: fibroblast
          term:
            id: CL:0000057
