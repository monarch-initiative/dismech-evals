  5da4c607a3cc732c7fa5920fd74395f961a6c5e3cfb0185adfe9034401c7e4eb:
    claim:
      about:
        disease:
          name: STIM1 Deficiency
          disease_term:
            preferred_term: combined immunodeficiency due to STIM1 deficiency
            term:
              id: MONDO:0013008
              label: combined immunodeficiency due to STIM1 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of ER Calcium Store Sensing and CRAC Channel Gating
        biological_scale: MOLECULAR
        description: 'STIM1 is the endoplasmic reticulum calcium sensor of the CRAC channel complex. Its
          luminal EF-hand binds ER calcium; on store depletion STIM1 oligomerizes, translocates to ER-plasma
          membrane junctions and gates ORAI1 through its cytoplasmic coiled-coil domains. Without functional
          STIM1 there is no signal from the depleted store to the pore, so the CRAC channel is never opened
          even though ORAI1 itself is intact. That the lesion is STIM1 and not a correlated defect is
          established by rescue: expressing wild-type STIM1 in patient cells restores calcium influx.

          '
        molecular_functions:
        - preferred_term: calcium channel regulator activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0005246
            label: calcium channel regulator activity
      selected_evidence:
        snippet: STIM1 mRNA splicing, protein production, and Ca(2+) influx were completely abolished
          in EBV-transformed B cell lines from the patient, but were rescued by the expression of wild-type
          STIM1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20876309
      reference_title: Whole-exome sequencing-based discovery of STIM1 deficiency in a child with fatal
        classic Kaposi sarcoma.
      evidence_source: IN_VITRO
      explanation: 'The rescue result establishes that loss of STIM1 is what removes calcium influx in
        patient cells, rather than a correlated abnormality.

