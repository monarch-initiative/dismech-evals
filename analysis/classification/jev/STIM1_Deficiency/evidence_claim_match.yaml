            term:
              id: MONDO:0013008
              label: combined immunodeficiency due to STIM1 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Peripheral Immune Tolerance
        biological_scale: ORGANISM
        description: 'Autoimmunity in STIM1 deficiency is mild and largely confined to autoimmune cytopenias,
          unlike the multi-organ autoimmunity of regulatory T cell deficiency in IPEX. The review attributes
          that restriction to residual regulatory T cells with normal suppressive function, and to the
          fact that effector T cell function is also impaired, so the autoreactive cells that escape tolerance
          are themselves poorly functional.

          Autoimmunity is commoner here than in the sibling disease ORAI1 deficiency, and whether that
          difference is real is unsettled. The review that reports it also cautions that the ORAI1 patients
          are few and died early, so they may simply not have lived long enough to develop what STIM1-deficient
          patients develop. Both readings are recorded rather than one being chosen.

          '
