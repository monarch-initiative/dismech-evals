        biological_scale: CELLULAR
        description: 'NFAT is heavily phosphorylated and cytoplasmic in resting lymphocytes and enters
          the nucleus only when dephosphorylated by the calcium/calmodulin dependent phosphatase calcineurin.
          Without sustained calcium entry calcineurin is not activated, NFAT does not translocate, and
          the NFAT-dependent transcriptional programme, which includes the cytokine genes and the differentiation
          programmes of several lymphocyte lineages, is not induced.

          '
        biological_processes:
        - preferred_term: calcineurin-NFAT signaling cascade
          modifier: DECREASED
          term:
            id: GO:0033173
            label: calcineurin-NFAT signaling cascade
      selected_evidence:
        snippet: However, T cells lacking either STIM1 or STIM2 had much less cytokine production and
          nuclear translocation of the transcription factor NFAT.
        supports: SUPPORT
