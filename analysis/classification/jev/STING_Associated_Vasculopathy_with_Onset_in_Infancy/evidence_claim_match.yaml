      assertion:
        name: STING1 gain-of-function variants
        gene_term:
          preferred_term: TMEM173
          term:
            id: hgnc:27962
            label: STING1
        association: Causative
        notes: SAVI is classically caused by heterozygous activating STING1/TMEM173 variants. A recessive
          SAVI presentation has also been reported for homozygous p.Arg281Trp.
      selected_evidence:
        snippet: Previously, only heterozygous and mostly de novo STING1 variants have been reported to
          cause SAVI. Interestingly, one variant that only leads to SAVI when homozygous, namely c.841C>T
          p.(Arg281Trp), has recently been described.
        supports: SUPPORT
