      assertion_type: Pathophysiology
      assertion:
        name: Impaired cellular retinol uptake
        description: STRA6 encodes a cell-surface receptor and transporter for retinol bound to plasma
          retinol-binding protein. Biallelic STRA6 deficiency impairs cellular vitamin A uptake as the
          initiating molecular defect in the syndrome.
        genes:
        - preferred_term: STRA6
          term:
            id: hgnc:30650
            label: STRA6
        molecular_functions:
        - preferred_term: retinol transmembrane transporter activity
          term:
            id: GO:0034632
            label: retinol transmembrane transporter activity
          modifier: DECREASED
      selected_evidence:
        snippet: The cellular uptake of vitamin A from its RBP4-bound circulating form (holo-RBP4) is
          a homeostatic process that evidently depends on the multidomain membrane protein STRA6.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
