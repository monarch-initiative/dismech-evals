        description: 'In STT3A-null cells the insulin receptor and IGF-1 receptor reach the cell surface
          in reduced amounts, because their own N-glycan site occupancy is lower and because the proprotein
          convertase PCSK5a that cleaves them is itself underglycosylated. This is an established cell-line
          finding. Its relevance to patients is unshown: no study has measured these receptors in STT3A-CDG
          patient cells, and any contribution to the short stature of the dominant form is an inference
          (see discussions).'
        biological_processes:
        - preferred_term: Protein processing
          term:
            id: GO:0016485
            label: protein processing
          modifier: DECREASED
      selected_evidence:
