        - preferred_term: STT3A
          term:
            id: hgnc:6172
            label: STT3A
        description: The originally described form, caused by biallelic STT3A variants. All families reported
          so far were consanguineous and homozygous for a missense variant, most carrying p.Val626Ala
          and one p.Tyr360Ser. The phenotype is a neurodevelopmental encephalopathy with developmental
          delay, intellectual disability, absent speech, seizures, hypotonia, failure to thrive and feeding
          problems, with a type I serum transferrin pattern. Episodic hypothermia with altered consciousness
          and a combined factor VIII and von Willebrand factor deficiency have each been reported in a
          minority.
      selected_evidence:
        snippet: STT3A-CDG (OMIM# 615596) is an autosomal recessive N-linked glycosylation disorder characterized
          by seizures, developmental delay, intellectual disability, and a type I carbohydrate deficient
          transferrin pattern.
        supports: SUPPORT
