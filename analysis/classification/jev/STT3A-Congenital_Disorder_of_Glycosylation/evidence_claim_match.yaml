            label: oligosaccharyltransferase complex A
      selected_evidence:
        snippet: STT3A encodes the catalytic subunit of the STT3A-containing oligosaccharyltransferase
          (OST) complex, essential for protein N-glycosylation.
        supports: SUPPORT
