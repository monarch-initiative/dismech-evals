            - preferred_term: STT3A
              term:
                id: hgnc:6172
                label: STT3A
            description: The originally described form, caused by biallelic STT3A variants. All families
              reported so far were consanguineous and homozygous for a missense variant, most carrying
              p.Val626Ala and one p.Tyr360Ser. The phenotype is a neurodevelopmental encephalopathy with
              developmental delay, intellectual disability, absent speech, seizures, hypotonia, failure
              to thrive and feeding problems, with a type I serum transferrin pattern. Episodic hypothermia
              with altered consciousness and a combined factor VIII and von Willebrand factor deficiency
              have each been reported in a minority.
          role: subtype
        - path: /has_subtypes/1
          value:
            name: AD-STT3A-CDG
            display_name: Autosomal dominant STT3A-CDG (OMIM 619714)
            subtype_term:
              preferred_term: congenital disorder of glycosylation, type Iw, autosomal dominant
              term:
                id: MONDO:0859223
                label: congenital disorder of glycosylation, type Iw, autosomal dominant
            genes:
            - preferred_term: STT3A
              term:
                id: hgnc:6172
                label: STT3A
            description: 'Caused by heterozygous STT3A missense variants, de novo, inherited, or mosaic,
              that cluster in conserved catalytic regions with a recurrent p.Arg405 hotspot. Across 21
              published individuals the phenotype is neuromusculoskeletal: subtle facial dysmorphism,
              motor and speech delay, learning difficulties, intellectual disability in about half, skeletal
              anomalies, short stature, macrocephaly, increased muscle tone, muscle cramps and early-onset
              osteoarthritis in adults, with congenital heart defects and coagulation factor deficiency
              in a minority. Transferrin glycosylation is abnormal in nearly all, but ranges from a classic
              type I pattern to subtle changes.'
          role: subtype
      assertion_type: Biochemical
      assertion:
        name: Serum Transferrin Glycoform Profile
        subtypes:
        - AR-STT3A-CDG
        - AD-STT3A-CDG
        notes: Serum transferrin isoelectric focusing or mass spectrometry shows transferrin molecules
          missing whole N-glycans (type I pattern). The change is marked in the recessive form. In the
          dominant form it is present in nearly all individuals but can be subtle, so a normal or near-normal
          screen does not exclude the dominant form.
      selected_evidence:
        snippet: Across 21 individuals, abnormal transferrin glycosylation was present in nearly all individuals
          (20/21), and subtle facial dysmorphism was common (18/21).
        supports: SUPPORT
