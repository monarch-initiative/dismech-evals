          and insulin-like growth factor 1 receptor (IGF-1R) - at the cell surface in STT3A-null cells,
          due to decreased N-linked glycan site occupancy and proteolytic processing in combination with
          increased endoplasmic reticulum localization.
        supports: SUPPORT
