        context: []
      assertion_type: Subtype
      assertion:
        name: AD-STT3A-CDG
        display_name: Autosomal dominant STT3A-CDG (OMIM 619714)
        subtype_term:
          preferred_term: congenital disorder of glycosylation, type Iw, autosomal dominant
          term:
            id: MONDO:0859223
            label: congenital disorder of glycosylation, type Iw, autosomal dominant
        genes:
        - preferred_term: STT3A
          term:
            id: hgnc:6172
            label: STT3A
        description: 'Caused by heterozygous STT3A missense variants, de novo, inherited, or mosaic, that
          cluster in conserved catalytic regions with a recurrent p.Arg405 hotspot. Across 21 published
          individuals the phenotype is neuromusculoskeletal: subtle facial dysmorphism, motor and speech
          delay, learning difficulties, intellectual disability in about half, skeletal anomalies, short
          stature, macrocephaly, increased muscle tone, muscle cramps and early-onset osteoarthritis in
          adults, with congenital heart defects and coagulation factor deficiency in a minority. Transferrin
          glycosylation is abnormal in nearly all, but ranges from a classic type I pattern to subtle
          changes.'
      selected_evidence:
        snippet: We here report the identification of 16 individuals from nine families who have either
          inherited or de novo heterozygous missense variants in STT3A, leading to an autosomal-dominant
          CDG.
        supports: SUPPORT
