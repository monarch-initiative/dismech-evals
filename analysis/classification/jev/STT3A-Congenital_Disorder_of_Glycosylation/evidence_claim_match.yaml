        description: STT3A is the active-site subunit of OST-A, the oligosaccharyltransferase isoform
          recruited to the ribosome-Sec61 translocon through its DC2 and KCP2 subunits. It transfers the
          Glc3Man9GlcNAc2 oligosaccharide from its dolichol-pyrophosphate carrier onto asparagine in N-X-S/T
          sequons of nascent chains. Reduced or poisoned STT3A lowers the transfer activity of this complex.
          The lipid-linked donor is assembled normally, which distinguishes this lesion from the assembly-type
          CDG-I.
