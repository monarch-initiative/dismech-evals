          fidelity: MODERATE
          description: Reduced stt3a dosage produces craniofacial and skeletal mineralization defects
            comparable to the patients' skeletal anomalies and dysmorphism.
          limitations: A heterozygous knockdown lowers the amount of STT3A; it does not reproduce a catalytic-site
            missense variant, so it tests haploinsufficiency rather than the dominant-negative mechanism
            proposed for most dominant alleles. Phenotypes were scored in larvae, so the adult features
            (osteoarthritis, muscle cramps) and the transferrin phenotype are not assessed.
      selected_evidence:
        snippet: We performed CRISPR-Cas9 to establish heterozygous knockdown zebrafish to validate the
          functional implications of autosomal dominant inheritance of STT3A in pathogenesis.
        supports: SUPPORT
