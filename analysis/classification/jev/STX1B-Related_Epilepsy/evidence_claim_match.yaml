      assertion_type: Treatment
      assertion:
        name: Antiseizure Medication
        description: 'Seizures are managed with antiseizure medications, guided by the specific epilepsy
          syndrome. Response splits sharply along that syndrome boundary: in the benign fever-associated
          (GEFS+) group seizures are controlled or remit without treatment, whereas the developmental
          and epileptic encephalopathy group is pharmacoresistant through many drug trials. Combined lamotrigine
          and valproic acid, and bromide, have each produced a substantial seizure reduction in individual
          pharmacoresistant patients.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
