      assertion_type: Discussion
      assertion:
        discussion_id: gap_stx1b_temperature_sensitivity_mechanism
        prompt: What is the molecular basis by which syntaxin-1B deficiency renders synaptic vesicle fusion
          temperature-sensitive, so that seizures cluster with fever rather than occurring uniformly across
          the physiological temperature range?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
        - pathophysiology#Temperature-Sensitive Cortical Hyperexcitability
        rationale: 'The defining clinical feature of STX1B-related epilepsy is fever-triggered seizures,
          and the zebrafish stx1b-knockdown model reproduces a highly temperature-sensitive epileptiform
          phenotype. Yet the biophysical mechanism linking reduced syntaxin-1B dosage to temperature-dependent
          release failure is unresolved: whether a partially depleted SNARE machine has reduced thermal
          reserve, whether syntaxin-1B/Munc18-1 chaperoning is temperature-labile, or whether excitatory
          and inhibitory terminals fail asymmetrically as temperature rises. Distinguishing these is prerequisite
          to explaining the fever specificity and to rational antipyretic-independent therapy.'
        proposed_experiments:
        - experiment_id: exp_stx1b_temperature_release_titration
          name: Temperature-dependent release titration in syntaxin-1B-reduced neurons
          description: In human iPSC-derived neurons with graded syntaxin-1B reduction (allelic series
            spanning haploinsufficiency to near-complete loss), measure evoked and spontaneous excitatory
            and inhibitory release across a controlled temperature ramp, correlating release probability
            and SNARE-complex assembly with temperature to test whether reduced dosage narrows the thermal
            operating range.
          experiment_type:
            preferred_term: temperature-dependent synaptic release titration
          perturbations:
          - name: Graded syntaxin-1B reduction
            target: pathophysiology#Syntaxin-1B t-SNARE Deficiency
            genes:
            - preferred_term: STX1B
              term:
                id: hgnc:18539
                label: STX1B
            description: Titrate syntaxin-1B levels across an allelic series in an isogenic human neuronal
              background.
          readouts:
          - name: Temperature-resolved synaptic release and fusion
            target: pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
            biological_processes:
            - preferred_term: calcium-dependent activation of synaptic vesicle fusion
              term:
                id: GO:0099502
                label: calcium-dependent activation of synaptic vesicle fusion
              modifier: DECREASED
            - preferred_term: synaptic vesicle exocytosis
              term:
                id: GO:0016079
                label: synaptic vesicle exocytosis
              modifier: DECREASED
            assays:
            - preferred_term: patch-clamp electrophysiology
            - preferred_term: live-cell imaging assay
            direction: NEGATIVE
          controls:
          - name: Wild-type syntaxin-1B neurons
            description: Isogenic neurons with unperturbed syntaxin-1B across the same temperature ramp.
          decision_criterion: A dosage-dependent narrowing of the thermal operating range for evoked release,
            emerging selectively at febrile temperatures, would support reduced thermal reserve of the
            depleted SNARE machine as the mechanism.
          would_support:
          - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
          - pathophysiology#Temperature-Sensitive Cortical Hyperexcitability
      selected_evidence:
        snippet: Video and local field potential analyses of zebrafish larvae with antisense knockdown
          of stx1b showed seizure-like behavior and epileptiform discharges that were highly sensitive
          to increased temperature.
        supports: SUPPORT
