          - preferred_term: valproic acid
            term:
              id: CHEBI:39867
              label: valproic acid
      selected_evidence:
        snippet: We identified 49 individuals harboring heterozygous variants in STX1B (NM_052874.3).
          ... [In the developmental and epileptic encephalopathy subgroup:] Of note, F4 responded with
          a significant seizure reduction to the combined therapy of lamotrigine and valproic acid after
          several unsuccessful AED trials. After the administration of bromide, F14 showed a significant
