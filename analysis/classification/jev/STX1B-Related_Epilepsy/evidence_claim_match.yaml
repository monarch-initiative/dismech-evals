        discussion_id: gap_stx1b_genotype_severity_determinants
        prompt: What determines an individual's position on the STX1B severity spectrum (simple febrile
          seizures, to GEFS+, to developmental and epileptic encephalopathy) - is it primarily loss-of-function
          dosage versus missense/dominant-negative effect, or do modifiers dominate?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Syntaxin-1B t-SNARE Deficiency
        rationale: STX1B variants span early-truncating and whole-gene-deletion (clear haploinsufficiency)
          through in-frame indel and missense changes that could act as reduced-function or dominant-negative
          alleles incorporated into the SNARE complex. The reported phenotype ranges from benign febrile
          seizures to severe encephalopathy, but whether variant class predicts severity - or whether
          genetic background and other GEFS+ modifiers dominate - is unresolved. This directly affects
          prognostic counseling and whether a variant should be curated as a distinct severity subtype.
        proposed_experiments:
        - experiment_id: exp_stx1b_variant_class_functional_severity
          name: Variant-class functional stratification against clinical severity
          description: Introduce a panel of reported STX1B variants (truncating, whole-gene loss, in-frame
            indel, missense) into an isogenic neuronal background and quantify release deficit and dominant-negative
            incorporation into the SNARE complex, then test whether the functional severity ranking correlates
            with the documented clinical severity of carriers.
          experiment_type:
            preferred_term: variant functional stratification experiment
          perturbations:
          - name: STX1B allelic panel knock-in
            target: pathophysiology#Syntaxin-1B t-SNARE Deficiency
            genes:
            - preferred_term: STX1B
              term:
                id: hgnc:18539
                label: STX1B
            description: Knock in individual STX1B variant classes into a shared human neuronal background
              for standardized functional comparison.
          readouts:
          - name: Release deficit and SNARE-complex incorporation
            target: pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
            biological_processes:
            - preferred_term: synaptic vesicle exocytosis
              term:
                id: GO:0016079
                label: synaptic vesicle exocytosis
              modifier: DECREASED
            assays:
            - preferred_term: patch-clamp electrophysiology
            - preferred_term: co-immunoprecipitation assay
            direction: NEGATIVE
          controls:
          - name: Wild-type STX1B knock-in
            description: Isogenic neurons carrying wild-type STX1B.
          - name: Benign population variant
            description: A population variant incompatible with disease causality.
          decision_criterion: If functional severity rank (dominant-negative missense worst, haploinsufficiency
            intermediate) tracks clinical severity, variant class is a primary determinant; a weak correlation
            implicates modifiers.
          would_support:
          - pathophysiology#Syntaxin-1B t-SNARE Deficiency
      selected_evidence:
        snippet: Three additional nonsense or missense mutations and a de novo microdeletion encompassing
          STX1B were then identified in 449 familial or sporadic cases.
