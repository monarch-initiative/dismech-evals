        discussion_id: gap_stx1b_stx1a_redundancy_therapeutic_lever
        prompt: Does the closely related paralog syntaxin-1A partially compensate for syntaxin-1B loss,
          and could its regional/developmental expression explain phenotype variability and offer a therapeutic
          lever (upregulating STX1A to rescue release)?
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
        rationale: Syntaxin-1A and syntaxin-1B are highly homologous plasma-membrane t-SNAREs that can
          both support calcium-triggered fusion, so residual release in STX1B-deficient neurons may depend
          on syntaxin-1A availability. If compensation is incomplete and varies with the regional and
          developmental expression ratio of the two paralogs, that could contribute to the fever-dependence
          and phenotypic variability - and raising syntaxin-1A expression or function becomes a candidate
          disease-modifying strategy. This is an emerging, largely untested hypothesis for STX1B disease
          rather than an established mechanism.
        proposed_experiments:
        - experiment_id: exp_stx1b_stx1a_compensation_rescue
          name: Syntaxin-1A dosage compensation of syntaxin-1B loss
          description: In syntaxin-1B-deficient human neurons, titrate syntaxin-1A expression and measure
            whether increased syntaxin-1A restores evoked release and rescues the temperature-sensitive
            release deficit, and profile the native STX1A:STX1B expression ratio across neuronal subtypes
            to test the regional-compensation model.
          experiment_type:
            preferred_term: paralog compensation rescue experiment
          perturbations:
          - name: Syntaxin-1A overexpression on STX1B-deficient background
            target: pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
            genes:
            - preferred_term: STX1A
              term:
                id: hgnc:11433
                label: STX1A
            description: Increase syntaxin-1A expression in syntaxin-1B-deficient neurons to test functional
              compensation.
          readouts:
          - name: Rescue of evoked release
            target: pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
            biological_processes:
            - preferred_term: calcium-dependent activation of synaptic vesicle fusion
              term:
                id: GO:0099502
                label: calcium-dependent activation of synaptic vesicle fusion
              modifier: DECREASED
            assays:
            - preferred_term: patch-clamp electrophysiology
            direction: POSITIVE
          controls:
          - name: STX1B-deficient neurons without STX1A manipulation
            description: Matched syntaxin-1B-deficient neurons at baseline syntaxin-1A levels.
          - name: Wild-type neurons
            description: Isogenic neurons with intact syntaxin-1B.
          decision_criterion: Dose-dependent rescue of evoked release and temperature sensitivity by syntaxin-1A
            would support paralog compensation as a determinant of severity and a therapeutic lever; failure
            to rescue would argue against it.
          would_support:
          - pathophysiology#Impaired SNARE-Mediated Vesicle Fusion
      selected_evidence:
        snippet: Neuronal SNAREs and their key regulators together drive synaptic vesicle exocytosis and
          synaptic transmission as a single integrated membrane fusion machine.
        supports: SUPPORT
