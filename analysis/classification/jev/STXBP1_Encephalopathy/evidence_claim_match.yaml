              label: developmental and epileptic encephalopathy, 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: STXBP1 Haploinsufficiency and Munc18-1 Deficiency
        conforms_to: synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency
        description: De novo heterozygous loss-of-function variants (nonsense, frameshift, splice-site,
          whole-gene/partial deletions) and destabilizing missense variants in STXBP1 reduce the functional
          dose of Munc18-1, an evolutionarily conserved Sec1/Munc18 protein essential for synaptic vesicle
          release. Missense variants render the protein thermolabile and prone to aggregation/degradation,
          so both truncating and missense mechanisms converge on haploinsufficiency of Munc18-1 at presynaptic
          terminals.
        role: trigger
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: synaptic vesicle cycle
          term:
            id: GO:0099504
            label: synaptic vesicle cycle
          modifier: ABNORMAL
        locations:
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: STXBP1 (also known as MUNC18-1) is an evolutionally conserved neuronal Sec1/Munc-18 (SM)
          protein that is essential in synaptic vesicle release in several species.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
