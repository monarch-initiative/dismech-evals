  b08e8efd52751027ab4fbc9f6ad5fab1e383f61206cc25a0e1eb88ed7628405b:
    claim:
      about:
        disease:
          name: STXBP1 Encephalopathy
          disease_term:
            preferred_term: STXBP1 encephalopathy
            term:
              id: MONDO:0012812
              label: developmental and epileptic encephalopathy, 4
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_stxbp1_genotype_phenotype_modifiers
        prompt: Why do STXBP1 variants produce a phenotypic spectrum ranging from classic early-onset
          epileptic encephalopathy to intellectual disability without epilepsy to a movement-disorder-predominant
          picture, and what genetic, variant-level, or network modifiers determine which arm dominates
          in a given patient?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
        - pathophysiology#Impaired Synaptic Network Development
        rationale: The entry already notes that cognitive impairment and seizures are partly independent,
          and cohort data find no correlation between seizure severity and the degree of intellectual
          disability. This dissociation implies that the epilepsy arm and the developmental/cognitive
          (and movement-disorder) arms are separably modifiable, yet no variant-class, residual-protein-level,
          cell-type (excitatory versus inhibitory), or modifier-gene predictor reliably explains why one
          arm dominates. Resolving this is prerequisite to prognostic counseling and to arm-specific therapy.
        proposed_experiments:
        - experiment_id: exp_stxbp1_genotype_phenotype_stratification
          name: STXBP1 genotype-phenotype and modifier stratification study
          description: In a deeply phenotyped STXBP1 cohort, stratify patients by variant class (truncating,
            deletion, missense) and estimated residual Munc18-1 level and test whether these, together
            with polygenic background and candidate modifier loci, predict the dominant phenotypic arm
            (epilepsy-predominant, intellectual-disability-without-epilepsy, or movement-disorder-predominant).
          experiment_type:
            preferred_term: genotype-phenotype correlation study
          perturbations:
          - name: Variant-class and residual-dose stratification
            target: pathophysiology#Impaired Synaptic Network Development
            genes:
            - preferred_term: STXBP1
              term:
                id: hgnc:11444
                label: STXBP1
            description: Group patients by STXBP1 variant class and modeled residual protein dose rather
              than introducing a perturbation, as an observational human study.
          readouts:
          - name: Dominant phenotypic arm and network phenotype
            target: pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
            biological_processes:
            - preferred_term: chemical synaptic transmission
              term:
                id: GO:0007268
                label: chemical synaptic transmission
              modifier: ABNORMAL
            assays:
            - preferred_term: electroencephalography
            direction: POSITIVE
          controls:
          - name: Variant-class comparison groups
            description: Truncating, deletion, and missense groups compared against one another.
          decision_criterion: A modifier is supported if variant class, residual protein level, or a modifier
            locus significantly predicts the dominant phenotypic arm across the cohort after correction
            for multiple testing.
          would_support:
          - pathophysiology#Cortical Excitation-Inhibition Imbalance and Seizures
          - pathophysiology#Impaired Synaptic Network Development
      selected_evidence:
        snippet: We found no correlation between severity of seizures and severity of ID
        supports: SUPPORT
