        prompt: Is STXBP1 encephalopathy a pure loss-of-dose (haploinsufficiency) disorder, or do destabilized
          missense variants act dominant-negatively by aggregating and co-depleting wild-type Munc18-1,
          and does the answer differ by variant class with direct consequences for therapy (gene/dosage
          restoration versus chemical-chaperone/proteostasis approaches)?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#STXBP1 Haploinsufficiency and Munc18-1 Deficiency
        - pathophysiology#Impaired Syntaxin-1 Chaperoning and SNARE-Mediated Vesicle Fusion
        rationale: 'The entry models both truncating and missense variants as converging on Munc18-1 haploinsufficiency,
          and an allelic-series mouse study concludes that impaired protein stability plus haploinsufficiency
          explain the disease. A competing biochemical model finds that missense mutants aggregate and
          sequester wild-type Munc18-1 below hemizygous levels, i.e. an additional dominant-negative effect.
          The two models are not merely academic: pure haploinsufficiency motivates gene-dosage or expression-restoration
          strategies, whereas a dominant-negative aggregation mechanism motivates chemical-chaperone/proteostasis
          rescue and possibly allele-specific knockdown. Which mechanism dominates, and whether it is
          variant-dependent, remains unresolved.'
        proposed_experiments:
        - experiment_id: exp_stxbp1_lof_vs_dn_allelic_series
          name: STXBP1 loss-of-function versus dominant-negative allelic-series test
          description: In a shared neuronal background, express an allelic series of STXBP1 variants (truncating,
            deletion, and multiple missense) on both null and heterozygous (wild-type-present) backgrounds
            and measure whether the variant lowers functional Munc18-1 below the hemizygous level and
            whether chemical chaperones (4-phenylbutyrate, trehalose) restore protein level and release.
            A variant that depletes wild-type Munc18-1 and impairs release below hemizygous levels indicates
            a dominant-negative component.
          experiment_type:
            preferred_term: allelic-series gain/loss-of-function experiment
          perturbations:
          - name: STXBP1 variant expression on null versus heterozygous background
            target: pathophysiology#STXBP1 Haploinsufficiency and Munc18-1 Deficiency
            genes:
            - preferred_term: STXBP1
              term:
                id: hgnc:11444
                label: STXBP1
            description: Introduce each STXBP1 variant on a Munc18-1 null background (isolated variant
              function) and on a wild-type-present background (test for wild-type co-depletion), with
              and without chemical-chaperone treatment.
          readouts:
          - name: Munc18-1 protein level and synaptic vesicle release
            target: pathophysiology#Impaired Syntaxin-1 Chaperoning and SNARE-Mediated Vesicle Fusion
            biological_processes:
            - preferred_term: synaptic vesicle exocytosis
              term:
                id: GO:0016079
                label: synaptic vesicle exocytosis
              modifier: DECREASED
            - preferred_term: neurotransmitter secretion
              term:
                id: GO:0007269
                label: neurotransmitter secretion
              modifier: DECREASED
            assays:
            - preferred_term: immunoblot assay
            - preferred_term: patch-clamp recording
            direction: NEGATIVE
          controls:
          - name: Wild-type STXBP1
            description: Wild-type Munc18-1 expressed on the same backgrounds.
          - name: Vehicle versus chemical chaperone
            description: Matched untreated versus chemical-chaperone-treated conditions.
          decision_criterion: A dominant-negative component is supported if a variant reduces functional
            Munc18-1 and release below hemizygous levels on a wild-type-present background and is rescued
            by chemical chaperones; pure haploinsufficiency is supported if variants have no effect beyond
            loss of dose.
          would_support:
          - pathophysiology#STXBP1 Haploinsufficiency and Munc18-1 Deficiency
          - pathophysiology#Impaired Syntaxin-1 Chaperoning and SNARE-Mediated Vesicle Fusion
      selected_evidence:
        snippet: impaired protein stability and STXBP1 haploinsufficiency explain STXBP1-encephalopathy
          and that, therefore, Stxbp1+/- mice provide a valid mouse model.
