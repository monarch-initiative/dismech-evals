        conforms_to: synaptic_vesicle_cycle#Neurotransmitter Release Failure and Synaptic Transmission
          Deficit
        description: Impaired SNARE-mediated fusion reduces Ca2+-evoked neurotransmitter release and disturbs
          chemical synaptic transmission across cortical circuits. Because Munc18-1 is required at both
          excitatory and inhibitory synapses, the net effect is a disturbance of cortical excitatory/inhibitory
          balance that both drives seizures and impairs the activity-dependent synaptic signaling needed
          for normal neurodevelopment.
        role: effector
