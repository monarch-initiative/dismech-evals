              label: developmental and epileptic encephalopathy, 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Syntaxin-1 Chaperoning and SNARE-Mediated Vesicle Fusion
        conforms_to: synaptic_vesicle_cycle#Impaired Calcium-Triggered SNARE-Mediated Vesicle Fusion
        description: Munc18-1 binds syntaxin-1 and templates assembly of the neuronal SNARE complex (syntaxin-1,
          SNAP-25, synaptobrevin-2/VAMP2) that mediates Ca2+-triggered synaptic vesicle fusion. Reduced
          Munc18-1 dose, and disease variants with impaired syntaxin binding, compromise SNARE-complex
          assembly and the vesicle fusion step. In the Munc18-1 null model, loss of this protein abolishes
          neurotransmitter secretion, demonstrating that Munc18-1 is indispensable for the fusion reaction.
        role: central_effector
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: calcium-dependent activation of synaptic vesicle fusion
          term:
            id: GO:0099502
            label: calcium-dependent activation of synaptic vesicle fusion
          modifier: DECREASED
        - preferred_term: synaptic vesicle exocytosis
          term:
            id: GO:0016079
            label: synaptic vesicle exocytosis
          modifier: DECREASED
      selected_evidence:
        snippet: Furthermore, binding of the mutant protein to syntaxin was impaired.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
