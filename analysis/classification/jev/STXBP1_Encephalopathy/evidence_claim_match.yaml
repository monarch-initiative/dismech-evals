  f96a59870cef606fdd825e205c0674350272e926f2b1a9e7358d77be63e36439:
    claim:
      about:
        disease:
          name: STXBP1 Encephalopathy
          disease_term:
            preferred_term: STXBP1 encephalopathy
            term:
              id: MONDO:0012812
              label: developmental and epileptic encephalopathy, 4
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_stxbp1_mouse_model_fidelity
        prompt: Does the Stxbp1+/- mouse, which reproduces spike-wave/spasm EEG activity and mild cognitive
          changes, capture the severity and developmental trajectory of human STXBP1 encephalopathy —
          in particular the severe-to-profound intellectual disability and Ohtahara/West-syndrome-level
          epileptic encephalopathy — or does it under-represent the human disease?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced Neurotransmitter Release and Synaptic Transmission Deficit
        - pathophysiology#Impaired Synaptic Network Development
        rationale: 'Model evidence clearly exists: Stxbp1+/- mice recapitulate the seizure/spasm EEG phenotype
          and show impaired cognition, hyperactivity, and anxiety-like behaviour, and the seizures respond
          to levetiracetam. The open question is translational fidelity — human patients almost universally
          have severe-to-profound intellectual disability and early catastrophic epileptic encephalopathy
          (Ohtahara/West syndrome), a severity that the comparatively mild murine cognitive and behavioural
          phenotype may not fully reproduce. Whether the mouse captures the human developmental trajectory,
          or whether human-specific cortical biology is required, gates its use for preclinical therapeutic
          testing.'
        proposed_experiments:
        - experiment_id: exp_stxbp1_mouse_human_trajectory_comparison
          name: STXBP1 mouse-to-human developmental-trajectory comparison
          description: Longitudinally phenotype Stxbp1+/- mice across postnatal development for EEG severity,
            learning/memory, and motor phenotypes, and compare the developmental trajectory and severity
            against matched human natural-history data and STXBP1 patient iPSC-derived cortical neuron/organoid
            synaptic readouts, to quantify where the mouse under-represents human severity.
          experiment_type:
            preferred_term: cross-species developmental phenotyping experiment
          perturbations:
          - name: Stxbp1 heterozygous loss of function
            target: pathophysiology#Reduced Neurotransmitter Release and Synaptic Transmission Deficit
            genes:
            - preferred_term: STXBP1
              term:
                id: hgnc:11444
                label: STXBP1
            description: Stxbp1+/- mice and STXBP1 patient-variant human iPSC-derived neurons compared
              against wild-type and isogenic-corrected controls.
          readouts:
          - name: Synaptic transmission and network activity across development
            target: pathophysiology#Reduced Neurotransmitter Release and Synaptic Transmission Deficit
            biological_processes:
            - preferred_term: chemical synaptic transmission
              term:
                id: GO:0007268
                label: chemical synaptic transmission
              modifier: ABNORMAL
            - preferred_term: neurotransmitter secretion
              term:
                id: GO:0007269
                label: neurotransmitter secretion
              modifier: DECREASED
            assays:
            - preferred_term: multielectrode array recording
            - preferred_term: electroencephalography
            direction: NEGATIVE
          controls:
          - name: Wild-type littermate mice
            description: Age-matched wild-type littermates across the same developmental windows.
          - name: Isogenic-corrected human neurons
            description: Patient iPSC lines in which the STXBP1 variant is corrected.
          decision_criterion: The mouse is a faithful model if its developmental severity trajectory matches
            human natural history and iPSC readouts; a mismatch is supported if murine phenotypes are
            substantially milder or follow a divergent trajectory despite equivalent loss of dose.
          would_support:
          - pathophysiology#Reduced Neurotransmitter Release and Synaptic Transmission Deficit
          - pathophysiology#Impaired Synaptic Network Development
      selected_evidence:
        snippet: Stxbp1+/- mice with different genomic backgrounds recapitulate the seizure/spasm phenotype
          observed in humans, characterized by myoclonic jerks and spike-wave discharges that were suppressed
          by the antiepileptic drug levetiracetam.
        supports: SUPPORT
