  5cf553a68a7a900a5c7787be373208285ca7bedeade867986e5d414c86d2479e:
    claim:
      about:
        disease:
          name: SURF1-Related Leigh Syndrome
          disease_term:
            preferred_term: SURF1-related Leigh syndrome
            term:
              id: MONDO:0700250
              label: mitochondrial complex IV deficiency, nuclear type 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_surf1_mouse_mild_cox_defect
        prompt: Does the Surf1(-/-) knockout mouse — the principal mammalian model of SURF1 deficiency
          — faithfully recapitulate the severe human COX-deficient Leigh syndrome, given that the mouse
          knockout produces only a mild COX defect and no necrotizing encephalopathy, reflecting a species-specific
          difference in how dependent complex IV assembly is on SURF1?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#SURF1 Loss and Defective Complex IV Assembly
        - pathophysiology#Impaired Terminal Electron Transfer and ATP Synthesis
        rationale: 'The Surf1(-/-) mouse validates the molecular lesion — loss of the SURF1 COX assembly
          factor reduces complex IV — but it does not reproduce the human disease severity: mouse fibroblasts
          show only a mild, more stable COX reduction and the animals develop no Leigh-type necrotizing
          encephalopathy (some reports even describe extended lifespan). Comparative fibroblast work shows
          human COX biogenesis is far more SURF1-dependent than mouse, so rodent efficacy or mechanism
          signals systematically underdetermine the human neurodegenerative phenotype. This is a translational-validity
          gap (evidence exists in the mouse but does not phenocopy human disease), not an absence of evidence,
          so it is flagged as HUMAN_MODEL_MISMATCH rather than a generic knowledge gap. Human iPSC-derived
          neurons/organoids are the emerging route to a faithful model.'
        proposed_experiments:
        - experiment_id: exp_surf1_ipsc_neuron_cox
          name: SURF1-null human iPSC-derived neuron COX-assembly and bioenergetics assay
          description: Generate isogenic SURF1-null human iPSC-derived neurons and quantify complex IV
            assembly intermediates, COX monomer/supercomplex distribution, oxygen consumption, and susceptibility
            to metabolic stress relative to controls, testing whether the human-specific SURF1 dependence
            produces the severe bioenergetic failure that the mouse model lacks.
          experiment_type:
            preferred_term: iPSC-derived neuron perturbation assay
          model_systems:
          - name: Human iPSC-derived neuron
            description: Neurons differentiated from SURF1-edited human iPSCs, preserving the human-specific
              dependence of complex IV assembly on SURF1 that the mouse knockout does not capture.
            experimental_model_type: OTHER
      selected_evidence:
        snippet: SURF1 gene mutations cause a severe COX deficiency manifesting as the Leigh syndrome
          in humans, whereas in mice SURF1(-/-) knockout leads only to a mild COX defect.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
