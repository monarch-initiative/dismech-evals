      assertion_type: Diagnosis
      assertion:
        name: Cytogenetic Analysis for Balanced Chromosomal Rearrangement
        description: In an infertile man carrying a balanced chromosomal aberration, the default explanation
          is production of unbalanced gametes. The SYCP2 index case shows that a balanced rearrangement
          can instead act by dysregulating a fertility gene at a breakpoint, which changes what a cytogenetic
          finding means and argues for looking at genes near the breakpoints.
        diagnosis_term:
          preferred_term: Genetic Testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: While BCAs may reduce fertility by production of unbalanced gametes, a chromosomal rearrangement
          may also disrupt or dysregulate genes important in fertility.
        supports: SUPPORT
