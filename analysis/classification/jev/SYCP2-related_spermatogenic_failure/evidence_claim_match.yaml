      assertion_type: Genetic
      assertion:
        name: SYCP2
        gene_term:
          preferred_term: SYCP2
          term:
            id: hgnc:11490
            label: SYCP2
        association: Heterozygous or homozygous loss-of-function variants, and translocation-mediated
          overexpression
        relationship_type: CAUSATIVE
        features: 'Reported lesions fall into two mechanistically opposite classes. The larger class is
          frameshift loss-of-function alleles: three heterozygous frameshifts in the original report,
          three further novel heterozygous LOF variants (c.89dup, c.946_947del, c.4378_4379del) in a later
          independent series, and one homozygous insertion (c.2689_2690insT). The second class is overexpression
          driven by a de novo balanced translocation through enhancer adoption. Gene-disease clinical
          validity for SYCP2 and autosomal dominant male infertility was assessed under the ClinGen Gene-Disease
          Validity framework as "on the border of limited and moderate", and was subsequently upgraded
          to "strong" once the additional cases were included — a level of evidence-strength metadata
          the dismech EvidenceItem model cannot currently carry in a structured slot.'
      selected_evidence:
        snippet: Collectively, this updated assessment of the genetic and experimental evidence upgrades
          the gene-disease association strength of SYCP2 and autosomal dominant male infertility from
          on the border of limited and moderate to strong.
        supports: SUPPORT
