        context: []
      assertion_type: Treatment
      assertion:
        name: Microdissection Testicular Sperm Extraction with ICSI
        description: 'The primary management pathway for non-obstructive azoospermia due to meiotic arrest.
          Microsurgical testicular sperm extraction searches the testis for focal regions of residual
          spermatogenesis, with higher yield and less tissue removal than conventional biopsy; retrieved
          sperm are used for intracytoplasmic sperm injection. It is squarely in scope here because residual
          sperm production is documented in this disorder: reported patients span oligoasthenozoospermia
          and cryptozoospermia as well as complete azoospermia.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: sperm retrieval
          term:
            id: NCIT:C94427
            label: Sperm Retrieval
        notes: Evidence is for the procedure in non-obstructive azoospermia generally, not for SYCP2 carriers
          specifically; no cited source reports retrieval rates stratified by SYCP2 genotype. Given that
          the underlying lesion is a meiotic arrest, retrieval success in this genotype should not be
          assumed to match that of obstructive or post-meiotic causes.
      selected_evidence:
        snippet: These findings suggest that microdissection TESE can improve sperm retrieval for men
          with non-obstructive azoospermia over that achieved with previously described biopsy techniques.
        supports: SUPPORT
