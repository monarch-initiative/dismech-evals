        name: Synaptonemal Complex Axial Element Assembly Failure
        conforms_to: meiotic_prophase_failure#Synaptonemal Complex Assembly
        biological_scale: CELLULAR
        description: 'SYCP2 heterodimerizes with SYCP3 through a conserved coiled-coil domain and is the
          primary determinant of the axial/lateral elements: in a mouse mutant lacking that domain, mutant
          SYCP2 still localizes to axial chromosomal cores but SYCP3 does not, showing that SYCP2 is required
          to incorporate SYCP3 into the complex. Loss of the axial element removes the scaffold on which
          synapsis depends.'
        cell_types:
        - preferred_term: primary spermatocyte
          term:
            id: CL:0000656
            label: primary spermatocyte
        biological_processes:
        - preferred_term: synaptonemal complex assembly
          term:
            id: GO:0007130
            label: synaptonemal complex assembly
          modifier: DECREASED
      selected_evidence:
        snippet: the mutant SYCP2 protein localizes to axial chromosomal cores in both spermatocytes and
          fetal oocytes, but SYCP3 does not, demonstrating that SYCP2 is a primary determinant of AEs/LEs
          and, thus, is required for the incorporation of SYCP3 into SCs
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
