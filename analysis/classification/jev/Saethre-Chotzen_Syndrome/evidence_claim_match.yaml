          halluces. Originally described as a separate autosomal dominant acrocephalosyndactyly, it is
          now treated as the bifid-hallux end of the TWIST1 Saethre-Chotzen spectrum: TWIST1 frameshift
          and nonsense variants were found in Robinow-Sorauf families, including the original family,
          and both phenotypes have segregated within one family. No genotype-phenotype correlation separates
          the hallux duplication from classic Saethre-Chotzen, so the pathophysiology of this entry applies
          unchanged.'
