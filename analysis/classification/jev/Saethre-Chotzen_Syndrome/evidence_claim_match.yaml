          insertions/deletions, or whole-gene deletions) reduces functional TWIST1 dosage. TWIST1 is a
          bHLH transcription factor required in head mesenchyme; its haploinsufficiency removes the anti-osteogenic
          restraint that keeps the coronal suture patent. This initiates the boundary/niche-loss route
          into the conserved cranial-suture premature-fusion endpoint, mechanistically distinct from the
          FGFR/BMP pro-osteogenic-drive routes.
