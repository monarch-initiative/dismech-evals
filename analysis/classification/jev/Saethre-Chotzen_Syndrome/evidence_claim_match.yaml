      assertion:
        name: Muenke syndrome
        disease_term:
          preferred_term: Muenke syndrome
          term:
            id: MONDO:0011274
            label: Muenke syndrome
        description: Autosomal dominant FGFR3 p.Pro250Arg craniosynostosis syndrome presenting with unilateral
          or bilateral coronal synostosis that clinically overlaps with TWIST1-related Saethre-Chotzen
          syndrome.
        distinguishing_features:
        - Caused by the FGFR3 p.Pro250Arg (P250R) mutation rather than a heterozygous pathogenic TWIST1
          variant
        - Characterized by predominantly sensorineural hearing loss (61-71%) and low preoperative risk
          of elevated intracranial pressure (0-4%), whereas Saethre-Chotzen syndrome shows predominantly
          conductive hearing loss (29%) and higher preoperative elevated intracranial pressure risk (19-35%)
      selected_evidence:
        snippet: Jadico compared 10 patients with a TWIST mutation (Saethre-Chotzen syndrome) with 11
          patients with P250R FGFR3 mutation (Muenke syndrome) (Table 6).
        supports: SUPPORT
