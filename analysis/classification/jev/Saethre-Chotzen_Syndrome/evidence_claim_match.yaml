              label: Saethre-Chotzen syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TWIST1 haploinsufficiency and loss of suture osteogenic restraint
        conforms_to: cranial_suture_premature_fusion#Loss of Suture Patency Restraint
        description: Heterozygous loss-of-function of TWIST1 (nonsense, missense within the bHLH domain,
          insertions/deletions, or whole-gene deletions) reduces functional TWIST1 dosage. TWIST1 is a
          bHLH transcription factor required in head mesenchyme; its haploinsufficiency removes the anti-osteogenic
          restraint that keeps the coronal suture patent, disrupting the TWIST1-EphA4 osteogenic boundary
          between the neural-crest-derived frontal bone and the mesoderm-derived parietal bone and depleting
          the suture stem-cell niche. This is the boundary/niche-loss route into the conserved cranial-suture
          premature-fusion endpoint, mechanistically distinct from the FGFR/BMP pro-osteogenic-drive routes.
        gene:
          preferred_term: TWIST1
          description: Basic helix-loop-helix transcription factor; haploinsufficiency causes Saethre-Chotzen
            syndrome.
          modifier: DECREASED
          term:
            id: hgnc:12428
            label: TWIST1
        cell_types:
        - preferred_term: migratory cranial neural crest cell
          term:
            id: CL:0000008
            label: migratory cranial neural crest cell
        - preferred_term: mesenchymal stem cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
        locations:
        - preferred_term: coronal suture
          term:
            id: UBERON:0002489
            label: coronal suture
        biological_processes:
        - preferred_term: negative regulation of osteoblast differentiation
          term:
            id: GO:0045668
            label: negative regulation of osteoblast differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: mutational analysis reveals nonsense, missense, insertion and deletion mutations in patients.
          These mutations occur within the basic DNA binding, helix I and loop domains, or result in premature
          termination of the protein.
        supports: SUPPORT
