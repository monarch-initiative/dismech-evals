      assertion_type: Discussion
      assertion:
        discussion_id: pac_prkd_prognostic_significance
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do PRKD alterations carry independent prognostic information, or are they only diagnostic
          and subtype-defining markers?
        attaches_to:
        - pathophysiology#Regional Lymph Node Metastasis
        rationale: Fusion status correlates strongly with nodal metastasis, yet recurrence-free survival
          did not differ between fusion-positive and mutation-positive tumors in the cohort where that
          comparison was made, and the authors attribute this to limited power given how rare recurrence
          is. A recent systematic review concludes that the prognostic significance of PRKD alterations
          remains inconclusive while their diagnostic value is established. Because tumor-related death
          is essentially absent, any prognostic endpoint must be regional control or recurrence rather
          than survival, which makes adequately powered studies difficult.
        proposed_experiments:
        - experiment_id: exp_pac_multicentre_genotype_outcome
          name: Multicentre genotype-stratified outcome study with regional-control endpoints
          description: Pool genotyped PAC-spectrum cases across centres with sufficient follow-up to test
            whether PRKD lesion class predicts regional recurrence and nodal relapse independently of
            histologic subtype and papillary proportion.
      selected_evidence:
        snippet: PRKD alterations serve primarily as diagnostic markers, and their prognostic significance
          remains inconclusive.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
