      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: prkd_pathogenetic_dichotomy
        hypothesis_label: Two-Entity (Pathogenetic Dichotomy) Model
        status: ALTERNATIVE
        description: 'Classic PAC and cribriform adenocarcinoma are distinct entities that happen to involve
          the same gene family: the near-restriction of rearrangements to cribriform tumors and of the
          hotspot mutation to classic tumors, combined with their different primary sites and sharply
          different nodal metastasis rates, is read as a pathogenetic dichotomy rather than intra-entity
          variation. The original rearrangement study raised exactly this reading, and the naming change
          that folded cribriform adenocarcinoma into PAC was contested on the grounds of these clinical
          behaviour differences. The disagreement is unresolved and is not merely nomenclatural, because
          nodal risk drives whether neck dissection is considered.'
      selected_evidence:
        snippet: Controversy exists as to whether these tumors represent separate entities or variants
          of one spectrum, as they appear to have significant overlap, but also clinicopathologic differences.
        supports: SUPPORT
