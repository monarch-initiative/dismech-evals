  4446bb1b4c75d8757b8d74673775f03c4c514e38f7baa99921117fddb5dd6b63:
    claim:
      about:
        disease:
          name: Salivary Gland Polymorphous Adenocarcinoma
          disease_term:
            preferred_term: polymorphous adenocarcinoma of salivary gland
            term:
              id: MONDO:0000521
              label: salivary gland carcinoma
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Long-term outcome after treatment
        notes: 'Behavior is indolent. Pooled systematic-review data give recurrence of 12.5% for cribriform
          adenocarcinoma versus 17.8% for PAC overall, distant metastasis of 4.1% versus 5.5%, and death
          from disease of 3% versus 2.7% — that is, comparable between the two, with the difference concentrated
          in regional nodal spread rather than in distant spread or mortality. Note the disagreement between
          sources on mortality: one systematic review reports around 3% death from disease while another
          reports no documented tumor-related deaths, so disease-specific mortality should be treated
          as very low but not established as zero.'
      selected_evidence:
        snippet: The 2 groups show a similar biologic behavior in regards to incidence of distant metastasis
          (4.1 vs 5.5%), recurrence (12.5 vs 17.8%), and death from disease (3 vs 2.7%).
        supports: SUPPORT
    origin:
      assertion_path: /progression/0
      evidence_path: /progression/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34023291
      reference_title: 'How Increased Nodal Metastasis and Recurrence in Cribriform Adenocarcinoma Relate
        to Polymorphous Adenocarcinoma and Survival: A Systematic Review.'
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies recurrence, distant metastasis, and disease-specific mortality and shows
        they are comparable between the cribriform subtype and PAC overall, isolating nodal spread as
        the real difference.
