      assertion_type: Pathophysiology
      assertion:
        name: Perineural Invasion
        biological_scale: TISSUE
        description: Tumor cells stream circumferentially around small nerves in concentric, targetoid
          whorls. Neurotropism is frequent, yet in the largest published series it coexisted with excellent
          long-term outcome after surgical excision alone.
        notes: 'The often-repeated contrast with adenoid cystic carcinoma — that perineural invasion is
          not an adverse prognostic factor here as it is there — is placed in notes rather than asserted
          as a curated claim, because no source cited in this entry tests perineural invasion as a prognostic
          variable within PAC. What the evidence supports is weaker and indirect: neurotropism is frequent,
          and the same series reports about 97.6% of patients alive or dead without disease at an average
          of 115 months, so frequent neurotropism plainly does not carry the outcome that ACC''s does.
          The 164-case series does state that PAC must be separated from adenoid cystic carcinoma for
          prognostic reasons, but attributes that to the entity, not specifically to perineural invasion.'
      selected_evidence:
        snippet: The tumors were infiltrative and characterized by a polymorphous growth pattern, with
          individual tumors demonstrating multiple patterns, including solid, ductotubular, cribriform,
          trabecular, and single file growth. Neurotropism was identified frequently.
        supports: SUPPORT
    origin:
