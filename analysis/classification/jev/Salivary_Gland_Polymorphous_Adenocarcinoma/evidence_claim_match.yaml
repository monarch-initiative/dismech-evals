        genetic_context:
          variant_origin: SOMATIC
        cell_types:
        - preferred_term: salivary gland cell
          term:
            id: CL:0009005
            label: salivary gland cell
        biological_scale: MOLECULAR
        description: A recurrent somatic missense mutation in PRKD1 encoding p.Glu710Asp occurs in the
          catalytic kinase domain of protein kinase D1 and is present in the majority of conventional
          polymorphous adenocarcinomas. Functional work showed the substitution is kinase-activating and
          behaves as a driver. The mutation is essentially absent from other salivary gland tumor types,
          making it both the initiating lesion and the most specific molecular diagnostic marker for this
          entity.
        genes:
        - preferred_term: PRKD1
          term:
            id: hgnc:9407
            label: PRKD1
        molecular_functions:
        - preferred_term: protein serine/threonine kinase activity
          term:
            id: GO:0004674
            label: protein serine/threonine kinase activity
          modifier: INCREASED
      selected_evidence:
        snippet: We identified PRKD1 hotspot mutations encoding p.Glu710Asp in 72.9% of PLGAs but not
          in other salivary gland tumors.
        supports: SUPPORT
