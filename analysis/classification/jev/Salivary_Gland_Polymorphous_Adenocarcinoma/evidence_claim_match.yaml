      assertion_type: Discussion
      assertion:
        discussion_id: pac_prkd_wildtype_driver_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What drives the substantial minority of polymorphous adenocarcinomas that carry neither
          the PRKD1 hotspot mutation nor a PRKD1/2/3 rearrangement?
        attaches_to:
        - pathophysiology#Deregulated Protein Kinase D Signaling
        rationale: 'Roughly one fifth of tumors across the PAC spectrum have no detectable PRKD alteration,
          and the obvious candidate explanation has been actively excluded: kinase domain sequencing of
          PRKD2 and PRKD3 in PRKD1-wild-type classic tumors found no mutations. Whether these cases are
          driven by non-hotspot PRKD1 lesions, by cryptic rearrangements missed by break-apart FISH, by
          epigenetic activation of the same pathway, or by a genuinely different mechanism is unresolved.
          This matters for the convergence claim in this entry: if the wild-type cases are driven by something
          other than protein kinase D, then PAC is not a single-pathway disease.'
        proposed_experiments:
        - experiment_id: exp_pac_wgs_rnaseq_prkd_wildtype
          name: Whole-genome and RNA sequencing of PRKD-wild-type PAC
          description: Apply whole-genome and RNA sequencing to tumors lacking both the PRKD1 hotspot
            mutation and PRKD1/2/3 rearrangements, which prior studies could not do for want of frozen
            material, to detect non-hotspot PRKD1 variants, cryptic fusions, and alternative drivers.
        - experiment_id: exp_pac_pathway_activity_readout
          name: Direct protein kinase D pathway activity readout across genotypes
          description: Measure protein kinase D substrate phosphorylation in hotspot-mutant, fusion-positive,
            and wild-type tumors to test whether wild-type cases nonetheless show pathway activation,
            which would support convergence by a non-genetic route.
      selected_evidence:
        snippet: We did not identify genetic alterations in PRKD genes in 21.6% (n=7) of the cases studied.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
