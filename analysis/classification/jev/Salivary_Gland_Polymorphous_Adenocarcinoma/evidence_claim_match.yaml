          (MONDO:0000521), with exact identity carried in ncit_mappings as skos:exactMatch. This is a
          deliberate broadMatch-by-necessity, not an assertion of equivalence between PAC and salivary
          gland carcinoma. A MONDO term request for polymorphous adenocarcinoma, with the two NCIT subtypes,
          would let disease_term be tightened.
      selected_evidence:
