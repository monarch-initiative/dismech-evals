        prompt: MONDO lacks a class for polymorphous adenocarcinoma, so what should anchor disease_term?
        rationale: Searching MONDO labels and exact synonyms returns no polymorphous adenocarcinoma class,
          and no MONDO term cross-references NCIT:C35702 or its parent NCIT:C8021 (Salivary Gland Adenocarcinoma).
