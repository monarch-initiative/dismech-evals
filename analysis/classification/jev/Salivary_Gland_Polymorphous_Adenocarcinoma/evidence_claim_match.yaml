            term:
              id: MONDO:0000521
              label: salivary gland carcinoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pac_no_model_systems_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why is there no experimental model of polymorphous adenocarcinoma, and what would one
          have to reproduce to be useful?
        attaches_to:
        - pathophysiology#Deregulated Protein Kinase D Signaling
        - pathophysiology#Architecturally Polymorphous Infiltrative Growth
        rationale: 'This entry carries no experimental_models, animal_models, or computational_models,
          and that is a statement about the field rather than an omission in curation: no established
          cell line, organoid, or genetically engineered animal model of PAC is in routine use. The consequence
          is visible in the pathograph itself — the step from protein kinase D activation to the tumor''s
          characteristic multipattern architecture is INDIRECT_UNKNOWN_INTERMEDIATES precisely because
          there is no system in which to interrogate it. Even primary material is scarce: the study that
          defined the PRKD-wild-type subset could not pursue it for want of frozen tissue. A useful model
          would need to reproduce the defining dissociation of architectural diversity from cytological
          uniformity, not merely express the mutant kinase.'
        proposed_experiments:
        - experiment_id: exp_pac_e710d_salivary_organoid
          experiment_design: TARGETED_PERTURBATION
          name: PRKD1 E710D knock-in salivary gland organoids
          description: Introduce the E710D hotspot substitution into human salivary gland epithelial organoids
            and test whether activated protein kinase D alone produces multipattern architecture with
            retained cytological uniformity, or whether additional context is required.
        - experiment_id: exp_pac_fusion_vs_hotspot_comparison
          name: Side-by-side fusion versus hotspot models of nodal propensity
          description: Build matched models carrying a PRKD fusion and the PRKD1 hotspot mutation and
            compare invasive and lymphatic behaviour, to test whether the 50% versus 0% nodal metastasis
            difference is intrinsic to the lesion class rather than a correlate of tumor site.
        - experiment_id: exp_pac_conditional_knockin_mouse
          experiment_design: TARGETED_PERTURBATION
          name: Conditional salivary-epithelial Prkd1 E710D knock-in mouse
          description: Restrict expression of the activating allele to salivary gland epithelium to test
            whether a whole-organism model develops an indolent, neurotropic palatal tumor resembling
            human PAC.
      selected_evidence:
        snippet: regrettably, representative frozen samples from these PRKD1/2/3 wild-type tumors were
          unavailable
        supports: SUPPORT
