      assertion:
        name: Deregulated Protein Kinase D Signaling
        biological_scale: CELLULAR
        description: Both driver classes converge on deregulated protein kinase D activity in the neoplastic
          ductal epithelium. The PRKD kinases are diacylglycerol-activated serine/threonine kinases acting
          in the diacylglycerol and protein kinase C signal transduction pathway, and the shared membership
          of PRKD1, PRKD2, and PRKD3 in that pathway is what makes lesions in any of the three interchangeable
          drivers. Genetic alterations targeting PRKD genes are present in roughly four fifths of tumors
          across the PAC histologic spectrum, supporting a convergent phenotype driven by one pathway.
        cell_types:
        - preferred_term: salivary gland cell
          term:
