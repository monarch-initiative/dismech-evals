      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: prkd_convergent_spectrum
        hypothesis_label: Single PRKD-Driven Spectrum Model
        status: CANONICAL
        description: Conventional PAC, cribriform adenocarcinoma, indeterminate tumors, and papillary-predominant
          tumors form one biological spectrum unified by alterations of the PRKD gene family, with the
          specific lesion (hotspot mutation versus rearrangement) explaining the morphological and nodal-risk
          differences rather than marking separate diseases. This is the position taken by the WHO classification,
          which places cribriform adenocarcinoma under the PAC heading, and is supported by the shared
          PRKD genotype across the spectrum and by the mutual exclusivity of the two lesion classes.
      selected_evidence:
        snippet: These findings show that polymorphous adenocarcinoma, cribriform adenocarcinoma, tumor
          with indeterminate features and tumor with predominant papillary pattern display marked genetic
          overlap, and suggest that they may represent a spectrum of lesions driven by PRKD gene alterations,
          rather than separate entities.
        supports: SUPPORT
