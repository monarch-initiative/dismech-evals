          term:
            id: GO:0008284
            label: positive regulation of cell population proliferation
          modifier: INCREASED
      selected_evidence:
        snippet: As PRKD2 and PRKD3 share similar functions with PRKD1 in the diacylglycerol and protein
          kinase C signal transduction pathway, we expanded the investigation for these genes by FISH.
        supports: SUPPORT
