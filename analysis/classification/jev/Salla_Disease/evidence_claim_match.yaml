      assertion_type: Prevalence
      assertion:
        population: Global
        prevalence_class: RARE
        percentage: Rare
        notes: 'Worldwide prevalence estimated at less than 1 per 1,000,000 individuals. Approximately
          200-260 cases of FSASD (including all clinical forms) reported worldwide. Salla disease (classic
          mild form) reported in approximately 150 individuals, predominantly of Finnish and Swedish descent.
          Likely underdiagnosed given rarity and non-specific clinical presentation.

          Diagnostic delay is a significant clinical challenge: median age at disease onset is 0.17 years
          (approximately 2 months), but median age at diagnosis is 3 years, resulting in a median diagnostic
          delay of 2.5 years. Median survival across all FSASD phenotypes is 11 years, though this varies
          substantially based on biochemical severity and clinical phenotype. Patient distribution is
          panethnic.

          '
      selected_evidence:
        snippet: Around 200 FSASD cases are reported worldwide, with the clinical spectrum ranging from
          a severe infantile onset form, often lethal in early childhood, to a mild, less severe form
          with subjects living into adulthood, also called Salla disease.
        supports: SUPPORT
    origin:
      assertion_path: /prevalence/0
      evidence_path: /prevalence/0/evidence/0
      context_paths:
      - /name
      - /disease_term
