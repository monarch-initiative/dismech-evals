        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Tay-Sachs Disease
        description: Tay-Sachs disease is the parallel GM2 gangliosidosis caused by HEXA variants. It
          overlaps clinically and biochemically with Sandhoff disease across infantile, juvenile, and
          late-onset forms, but is distinguished by isolated HEX A deficiency (with preserved HEX B activity),
          biallelic HEXA variants, and the absence of hepatosplenomegaly, coarse facies, or elevated urinary
          N-acetylglucosamine-containing oligosaccharides.
        disease_term:
          preferred_term: Tay-Sachs disease
          term:
            id: MONDO:0010100
            label: Tay-Sachs disease
      selected_evidence:
        snippet: Tay-Sachs disease is caused by variants in HEXA encoding the α-subunit and Sandhoff disease
          is caused by variants in HEXB encoding the β-subunit.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
