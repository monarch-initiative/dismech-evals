      assertion_type: Diagnosis
      assertion:
        name: Brain magnetic resonance imaging
        diagnosis_term:
          preferred_term: brain magnetic resonance imaging
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
        description: 'Brain MRI serves as a supplementary diagnostic and staging modality: in infantile
          Sandhoff disease, T2-weighted imaging can demonstrate basal ganglia hyperintensity and ventral
          thalamic hypointensity (alongside bilateral thalamic hyperdensity on CT), although characteristic
          cranial imaging findings are not present in all infantile patients. In pooled adult GM2 gangliosidosis
          cohorts, cerebellar atrophy is reported on conventional MRI, whereas quantitative volumetric
          MRI and diffusion tensor imaging comparing late-onset Sandhoff disease with late-onset Tay-Sachs
          disease (LOTS) found no statistically significant structural volume difference between late-onset
          Sandhoff disease and neurotypical controls and demonstrated a lower burden of cerebellar pathology
          in late-onset Sandhoff disease than in LOTS.'
        results: Infantile T2-weighted basal ganglia hyperintensity and ventral thalamic hypointensity,
          or late-onset cerebellar findings with milder cerebellar pathology in late-onset Sandhoff disease
          than in late-onset Tay-Sachs disease
        presence: PRESENT
      selected_evidence:
        snippet: Axial T2-weighted imaging on MRI in our patient revealed hyperintensity of the basal
          ganglia and hypointensity of the ventral thalami. Beker-Acay et al. also reported as bilateral
          thalamic hyperdensity on computed tomography and hypointensity on T2-weighted MRI images as
          the earliest diagnostic markers of Sandhoff disease.
        supports: SUPPORT
