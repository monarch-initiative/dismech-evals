      assertion_type: Treatment
      assertion:
        name: Supportive Care
        description: 'Current management is symptomatic and supportive across disease subtypes: in acute
          infantile Sandhoff disease, care focuses on adequate nutrition and hydration (including gastrostomy
          tube placement), managing infectious disease, airway protection to reduce aspiration risk, seizure
          control, motor development support, and preventing contractures or deformities; in subacute
          juvenile and late-onset disease, care focuses on maximizing motor function, speech and language
          therapy, and providing aids for daily living and communication, alongside periodic multidisciplinary
          surveillance, fall precautions, and avoidance of antipsychotics (such as haloperidol, risperidone,
          and chlorpromazine) associated with clinical worsening in late-onset GM2 gangliosidosis.'
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: 'Treatment of manifestations: Treatment is symptomatic. Supportive care in acute infantile
          Sandhoff disease focuses on providing adequate nutrition and hydration, managing infectious
          disease, protecting the airway to reduce aspiration risk, controlling seizures, supporting motor
          development, and preventing deformities.'
        supports: SUPPORT
