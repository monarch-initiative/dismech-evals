          SGSH and transplanted into the brain restore SGSH enzyme activity, reduce heparan sulfate storage,
          reverse neuroinflammation, and correct cognitive deficits in a preclinical MPS IIIA model.
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: ex vivo neural progenitor gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
        notes: 'This is an ex vivo gene-modified cell product, so it sits across two categories. `treatment_term`
          is bound to Gene Therapy because the intervention is lentiviral transfer of a codon-optimized
          SGSH transgene -- the paper''s own framing is a "neural stem cell gene therapy" -- while `therapeutic_modality`
          records CELL_THERAPY because the transgene is delivered as a transplanted neural progenitor
          cell product rather than as a vector. NCIT has no clinical-action term for neural or non-hematopoietic
          stem cell transplantation; the hematopoietic transplantation terms must not be reused here,
          because HSCT is a separate and distinct intervention in MPS III with its own outcome literature.
          How the graft corrects distant brain regions is not settled: the authors attribute the effect
          "likely through integration of healthy neural cells across multiple brain regions", which is
          a hedge, and the alternative -- secreted-enzyme cross-correction of neighbouring host cells
          from a focal striatal depot -- is not excluded by the reported data.'
      selected_evidence:
        snippet: This allogeneic, enzyme-expressing neural cell strategy addresses both enzyme deficiency
          and neurodegeneration, offering a promising therapeutic avenue for MPS IIIA and broader lysosomal
          storage disorders.
