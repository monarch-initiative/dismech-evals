        name: Molecular genetic testing of TBCE
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        presence: Biallelic TBCE pathogenic variants; in Middle Eastern and North African patients almost
          always the homozygous founder deletion
        description: Nearly all affected people of Arab descent in the Middle East are homozygous for
          the same 12-base-pair deletion in the second coding exon of TBCE and share an ancestral haplotype,
          so a targeted founder-allele test is the efficient first-line study in that population. The
          same founder allele is found in patients labelled Kenny-Caffey type 1 - the two diagnoses are
          allelic, and the molecular result does not distinguish them.
      selected_evidence:
        snippet: Both traits have previously been mapped to chromosome 1q43-44 (refs 5,6) and, despite
          the observed clinical variability, share an ancestral haplotype, suggesting a common founder
          mutation.
        supports: SUPPORT
