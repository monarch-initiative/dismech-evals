            genotype: Tbce c.1570T>G p.(Trp524Gly), homozygous (progressive motor neuronopathy allele)
            publication: PMID:12389029
            description: 'The only established Tbce animal model, and it is a spontaneous mouse mutant
              that was studied as a motor neuron disease model for a decade before the human gene was
              identified. It carries a substitution at the terminal residue of Tbce that destabilizes
              the protein - mechanistically the same class of lesion as the human disease - and it reproduces
              the microtubule deficit faithfully. It does not reproduce the human syndrome: pmn mice develop
              progressive motor axon degeneration and die at four to six weeks, while human HRD patients
              have hypoparathyroidism, primordial growth failure and immunodeficiency without a motor
              neuronopathy. The model is therefore informative about what TBCE does to microtubules and
              uninformative about why the human parathyroid fails.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Parathyroid Failure and Congenital Hypoparathyroidism
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: pmn mice have no reported hypoparathyroidism. The defining endocrine feature of the
          human disease is absent from the only Tbce model, so the step from a general cytoskeletal defect
          to selective parathyroid aplasia has no animal support.
        limitations: The mouse phenotype is a progressive motor neuronopathy with death at four to six
          weeks - a lethal course in a compartment the human disease spares, and possibly too early for
          a parathyroid phenotype to be ascertained. The published characterizations do not report parathyroid
          assessment either way, so this is an absence of evidence in a model whose overall phenotype
          is clearly divergent, not a documented negative parathyroid study.
      selected_evidence:
        snippet: Mice that are homozygous with respect to the progressive motor neuronopathy (pmn) mutation
          (chromosome 13) develop a progressive caudio-cranial degeneration of their motor axons from
          the age of two weeks and die four to six weeks after birth.
        supports: SUPPORT
