            term:
              id: MONDO:0009426
              label: hypoparathyroidism-retardation-dysmorphism syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Combined Immunodeficiency
        biological_scale: ORGANISM
        role: consequence
        description: 'HRD is not a syndromic disease that happens to get infections - the immune defect
          is itself part of the disorder, and it is the main cause of death. A dedicated immunological
          workup of nine patients found abnormalities in both arms: a humoral defect (high total IgA and
          IgE but poor anti-pneumococcal titres despite routine vaccination, fewer naive B cells, expanded
          CD21-low CD27-negative B cells) and a cellular defect (inverted CD4/CD8 ratios, reduced terminally
          differentiated effector memory CD8 cells, and impaired PHA-induced proliferation in every patient).
          Neutrophil superoxide production and chemotaxis were normal, which locates the deficit in lymphocytes
          rather than in innate effector function.'
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: lymphocyte proliferation
          term:
            id: GO:0046651
            label: lymphocyte proliferation
          modifier: DECREASED
        - preferred_term: humoral immune response
          term:
            id: GO:0006959
            label: humoral immune response
          modifier: ABNORMAL
      selected_evidence:
        snippet: HRD is a combined immunodeficiency disease with syndromic features, manifesting in severe
          invasive bacterial and viral infections.
        supports: SUPPORT
