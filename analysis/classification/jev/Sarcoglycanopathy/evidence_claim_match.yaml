          term:
            id: hgnc:10806
            label: SGCB
      selected_evidence:
        snippet: Cardiac involvement was observed in 20 patients (63%) even before overt muscle involvement.
          Six patients had restrictive respiratory insufficiency requiring assisted ventilation (19%).
        supports: SUPPORT
