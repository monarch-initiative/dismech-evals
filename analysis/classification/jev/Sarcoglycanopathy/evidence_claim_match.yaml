        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sgcd-recessive-vs-dominant-cardiomyopathy
        prompt: Should evidence for dominant-negative SGCD missense variants causing isolated familial
          dilated cardiomyopathy be used to support the pathophysiology of recessive LGMDR6 (delta-sarcoglycanopathy)?
        kind: INTERPRETATION
        status: RESOLVED
        attaches_to:
        - has_subtypes#SGCD
        rationale: 'Delta-sarcoglycan is essential for both skeletal and cardiac dystrophin-glycoprotein
          complex stability, but two distinct SGCD mutation classes produce clinically distinct diseases:
          biallelic loss-of-function variants cause recessive LGMDR6 (this entry, with skeletal myopathy
          plus variable cardiac involvement), while rare heterozygous dominant-negative missense variants
          (e.g., R71T, R97Q) cause isolated familial dilated cardiomyopathy without skeletal myopathy,
          by destabilizing cardiac myocyte membrane mechanics without perturbing overall DGC assembly.
          This entry cites the dominant-negative mechanism only as background evidence for delta-sarcoglycan''s
          general importance to cardiac membrane stability, and does not use it as direct evidence for
          the recessive LGMDR6 cardiac phenotype.'
        resolution_note: Scoped SGCD subtype description and evidence to the recessive loss-of-function
          mechanism only; the dominant DCM mechanism is documented here for context but is out of scope
          for this entry.
      selected_evidence:
        snippet: While recessive mutations in δ-sarcoglycan cause limb girdle muscular dystrophy 2F, dominant
          mutations in δ-sarcoglycan have been linked to inherited dilated cardiomyopathy (DCM).
        supports: SUPPORT
