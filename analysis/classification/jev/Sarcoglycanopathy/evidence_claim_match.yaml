        name: Investigational AAV gamma-sarcoglycan gene transfer (SGCG)
        description: A self-complementary AAVrh74 vector (SRP-9005) carrying a codon-optimized human SGCG
          transgene restored sarcoglycan complex expression, muscle histopathology, and functional performance
          in a Sgcg-null mouse model, supporting translation to human gamma-sarcoglycanopathy. An AAV
          vector carrying human SGCG (ATA-200) has since entered a Phase 1 human trial (NCT05973630) in
          ambulant children with gamma-sarcoglycanopathy (LGMDR5).
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
        therapeutic_modality: GENE_THERAPY
      selected_evidence:
        snippet: This study demonstrates successful systemic delivery of the hSGCG transgene in SGCG -/-
          mice, with functional protein expression, reconstitution of the sarcoglycan complex, and corresponding
          physiological and functional improvements, which will help establish a minimal effective dose
          for translation of SRP-9005 gene transfer therapy in patients with LGMD 2C/R5.
        supports: SUPPORT
