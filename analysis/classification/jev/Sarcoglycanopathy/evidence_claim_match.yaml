        biological_scale: CELLULAR
        description: Repeated contraction-induced membrane injury outpaces repair. Macrophages debride
          necrotic fibers and support satellite-cell-mediated regeneration, but when the degenerative
          process is massive or advanced, muscle stem cells can no longer sustain repair, so contractile
          tissue is progressively lost.
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
