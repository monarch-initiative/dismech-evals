            label: autosomal recessive limb-girdle muscular dystrophy type 2E
        description: Caused by biallelic SGCB (beta-sarcoglycan) variants. Beta-sarcoglycan co-folds with
          delta- and gamma-sarcoglycan to form the extracellular core of the subcomplex, so its loss is
          particularly disruptive to complex assembly. Clinically heterogeneous (often, but not always,
