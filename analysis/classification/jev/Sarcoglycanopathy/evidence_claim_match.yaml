      assertion_type: Treatment
      assertion:
        name: Investigational small-molecule ERAD inhibition
        description: Misfolded missense sarcoglycan variants are degraded by the ER-associated degradation
          (ERAD) quality-control pathway before reaching the sarcolemma; pharmacologically inhibiting
          this proteolysis is proposed as a mutation-class-specific small-molecule therapeutic strategy
          to increase the amount of (partially functional) sarcoglycan that reaches the membrane.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: The residual altered proteins are destroyed by a proteolytic quality-control system or
          endoplasmic reticulum-associated degradation, ERAD. The inhibition of this proteolysis makes
          these proteins more available to migrate to the sarcolemma and thus becomes a potential therapeutic
          objective
        supports: SUPPORT
