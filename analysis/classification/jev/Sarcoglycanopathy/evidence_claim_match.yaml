        description: Because missense mutations account for the majority (about two-thirds) of reported
          sarcoglycanopathy alleles, knock-in (KI) mice carrying a missense sarcoglycan variant would
          in principle be the more disease-relevant model class relative to null/knockout lines. However,
          the three sarcoglycan missense knock-in mouse lines generated to date have failed to develop
          a myopathic phenotype at all.
        modeled_mechanisms:
        - target: Sarcoglycan Complex Loss and DGC Destabilization
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: Missense knock-in mice fail to develop any myopathic phenotype, despite missense
            variants being the most common human sarcoglycanopathy lesion class and the ERAD-mediated-degradation
            mechanism being demonstrated directly in a zebrafish missense model (see the sgcb/sgcd-null
            zebrafish model below).
          limitations: All three sarcoglycan missense knock-in mouse lines generated to date fail to develop
            a myopathic phenotype, unlike the null/knockout mouse lines — limiting mouse KI models' usefulness
            for studying the missense/ERAD lesion class that predominates in human patients, and motivating
            the zebrafish missense-modeling approach instead.
      selected_evidence:
        snippet: we must consider that the three SG-KI mice, generated until now, failed to develop a
          myopathic phenotype
        supports: SUPPORT
