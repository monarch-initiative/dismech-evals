      assertion_type: Subtype
      assertion:
        name: SGCG
        display_name: LGMD R5 / gamma-sarcoglycanopathy (LGMD2C; SGCG)
        subtype_term:
          preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2C
          term:
            id: MONDO:0009677
            label: autosomal recessive limb-girdle muscular dystrophy type 2C
        description: Caused by biallelic SGCG (gamma-sarcoglycan, 13q12.12) variants. The first sarcoglycanopathy
          to be molecularly characterized, and typically the earliest-onset and most severe subtype (mean
          onset 5.5 years in a 100-patient cohort, versus 8 years for alpha- and 24.4 years for beta-sarcoglycanopathy).
          Shows strong founder effects in specific populations (>90% of patients homozygous for c.525delT
          in a French multicenter series; a near-exclusive c.521del founder mutation in Tunisia, historically
          called "Severe Childhood Autosomal Recessive Muscular Dystrophy"/Tunisian Muscular Dystrophy;
          a separate C283Y founder mutation in Roma/Gypsy populations across Europe). Frequently Duchenne-like
          in severity, with high rates of scoliosis, respiratory deficiency, and cardiomyopathy.
        genes:
        - preferred_term: SGCG
          term:
            id: hgnc:10809
            label: SGCG
      selected_evidence:
        snippet: The most common symptoms are proximal limb-girdle muscle weakness or wasting (common
          in about 80-90% of cases); other frequent features are scoliosis (40%) cardiomyopathy (30%),
          respiratory deficiency (50-60%) and retractions (70%), which are frequently observed especially
          in advanced cases.
        supports: SUPPORT
