          are secondarily reduced. Because the sarcoglycan-sarcospan subcomplex flanks and stabilizes
          dystroglycan within the DGC, its loss destabilizes the mechanical linkage of the whole complex
          between the muscle-fiber cytoskeleton and the basement membrane. Two lesion classes converge
