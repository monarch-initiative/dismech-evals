        snippet: Eighty-seven per cent of the patients had consanguineous parents. Ninety-one per cent
          of the patients were symptomatic at the time of the analysis. Proximal muscle weakness of the
          upper and lower limbs was the most common presenting symptom. Distal muscle weakness was observed
          early over the course of the disease in 56.5% of the patients. Cardiac involvement was reported
          in five patients (21.7%) and four patients (17.4%) required non-invasive ventilation. Sixty
          per cent of patients were wheelchair-bound since early teens (median age of 12.0 years).
        supports: SUPPORT
