        name: Distal muscle weakness
        subtype: SGCD
        description: Distal muscle weakness of the limbs appears early in the disease course in a majority
          of delta-sarcoglycanopathy (LGMDR6) patients, in addition to the proximal weakness that is the
          more common presenting symptom across sarcoglycanopathy subtypes.
        phenotype_term:
          preferred_term: Distal muscle weakness
