              of patients homozygous for c.525delT in a French multicenter series; a near-exclusive c.521del
              founder mutation in Tunisia, historically called "Severe Childhood Autosomal Recessive Muscular
              Dystrophy"/Tunisian Muscular Dystrophy; a separate C283Y founder mutation in Roma/Gypsy
              populations across Europe). Frequently Duchenne-like in severity, with high rates of scoliosis,
              respiratory deficiency, and cardiomyopathy.
