      assertion_type: Subtype
      assertion:
        name: SGCA
        display_name: LGMD R3 / alpha-sarcoglycanopathy (LGMD2D; SGCA)
        subtype_term:
          preferred_term: autosomal recessive limb-girdle muscular dystrophy type 2D
          term:
            id: MONDO:0011968
            label: autosomal recessive limb-girdle muscular dystrophy type 2D
        description: Caused by biallelic SGCA (alpha-sarcoglycan, 17q21.33) variants. Presents in childhood
          with progressive weakness of the pelvic and/or scapular girdle muscles and calf hypertrophy,
          with wide inter- and intra-familial clinical variability. Alpha-sarcoglycan is added to the
          sarcoglycan subcomplex last during assembly, docking onto the beta/gamma/delta core. In a large
          multicenter cohort, mean age at onset was 8 years (later than gamma-sarcoglycanopathy) and 66.7%
          of patients were wheelchair-bound at mean 22.9-year follow-up.
        genes:
        - preferred_term: SGCA
          term:
            id: hgnc:10805
            label: SGCA
      selected_evidence:
        snippet: Limb-girdle muscular dystrophy by alpha-sarcoglycan deficiency or LGMD R3 alpha-sarcoglycan-related
          is a subtype of the autosomal recessive sarcoglycanopathies caused by variants in the alpha-sarcoglycan
          gene (SGCA) at 17q21.33. It appears in childhood by progressive weakness of pelvic and/or scapular
          girdle muscles and calf hypertrophy, with a wide range of clinical inter- and intra-familial
          clinical variability.
        supports: SUPPORT
