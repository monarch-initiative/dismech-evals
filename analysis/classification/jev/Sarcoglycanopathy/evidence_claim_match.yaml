                label: autosomal recessive limb-girdle muscular dystrophy type 2F
            description: 'Caused by biallelic loss-of-function SGCD (delta-sarcoglycan) variants. Delta-sarcoglycan
              co-folds with beta- and gamma-sarcoglycan to form the core of the extracellular subcomplex,
              so its recessive loss is highly disruptive to assembly of the whole complex. The least frequent
              and most severe sarcoglycanopathy subtype (considered ultra-rare): in the largest reported
              international cohort (23 patients from 18 families), 87% had consanguineous parents, distal
              weakness appeared early in over half of patients, and 60% were wheelchair-bound from the
              early teens (median age 12 years). Note: separate, rare dominant-negative missense SGCD
              variants cause isolated familial dilated cardiomyopathy without skeletal myopathy — a mechanistically
              and clinically distinct entity from recessive LGMDR6 (see the discussion below).'
            genes:
            - preferred_term: SGCD
              term:
                id: hgnc:10807
                label: SGCD
          role: subtype
