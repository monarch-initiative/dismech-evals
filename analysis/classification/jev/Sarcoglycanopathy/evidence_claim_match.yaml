            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: when the degenerative process is massive or at an advanced stage, muscle stem cells are
          unable to sustain the muscle repair, and the contractile muscle is progressively replaced by
          fibrotic or adipose tissue
        supports: SUPPORT
