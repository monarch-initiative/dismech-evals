          syndrome is caused by a single recurrent amino acid substitution, p.Gly516Arg; only two COG4
          variants have been reported, both producing that same change. This allelic specificity is unusual
          enough to be diagnostically useful - a different COG4 variant is not Saul-Wilson syndrome.
      selected_evidence:
        snippet: To date only two COG4 variants, both resulting in a p.Gly516Arg missense change, have
          been reported.
        supports: SUPPORT
