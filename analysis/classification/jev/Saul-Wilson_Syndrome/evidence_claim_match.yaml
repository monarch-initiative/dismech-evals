            species: Caenorhabditis elegans
            genotype: cogc-4(av107) - CRISPR-Cas9 knock-in of the orthologous glycine-to-arginine substitution
            publication: PMID:33688625
            description: 'A genuine negative result, and the more rigorous model design of the two: an
              endogenous knock-in of the orthologous substitution rather than overexpression of the human
              protein. It produced no detectable phenotype - not on observation, not under heat or Paraquat
              stress, and not on RNAi against the other seven COG subunits. Recorded because a published
              negative that took this much work to establish should not have to be rediscovered.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Recurrent COG4 p.Gly516Arg Substitution
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: 'The same substitution, made endogenously in the orthologous gene, causes nothing
          detectable in the worm. This is a constraint on how the human variant is understood: whatever
          it does, it is not a cell-autonomous insult that any COG4-expressing organism would register.'
        limitations: Absence of a phenotype under the assays used is not absence of a molecular defect
          - the authors say so themselves, and recommend directly assessing Golgi function rather than
          screening for organismal phenotypes. C. elegans also lacks cartilage and endochondral bone entirely,
          so the tissue in which the human disease manifests has no counterpart to examine.
      selected_evidence:
        snippet: Our data suggest that this mutation in cogc-4(av107) worms does not lead to a detectable
          phenotype.
        supports: REFUTE
