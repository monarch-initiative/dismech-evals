            term:
              id: MONDO:0019407
              label: microcephalic osteodysplastic dysplasia, Saul-Wilson type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Selective Decorin Glycosylation Defect
        biological_scale: MOLECULAR
        description: 'Despite a visibly abnormal Golgi, protein glycosylation in patient serum and fibroblasts
          is not notably altered. The one demonstrated exception is decorin, a proteoglycan secreted into
          the extracellular matrix, whose Golgi-dependent glycosylation is altered. This selectivity is
          the reason the disease presents as a skeletal dysplasia rather than as a congenital disorder
          of glycosylation, and it is also the weakest link in the causal chain: no study has yet shown
          that altered decorin glycosylation is sufficient to produce the skeletal phenotype.'
        biological_processes:
        - preferred_term: proteoglycan biosynthetic process
          term:
            id: GO:0030166
            label: proteoglycan biosynthetic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: protein glycosylation in sera and fibroblasts from affected subjects was not notably
          altered, but decorin, a proteoglycan secreted into the extracellular matrix, showed altered
          Golgi-dependent glycosylation
        supports: SUPPORT
