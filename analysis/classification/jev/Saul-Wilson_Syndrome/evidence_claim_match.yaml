        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Imbalanced Bidirectional Golgi Vesicular Traffic
        biological_scale: CELLULAR
        description: Patient fibroblasts show delayed anterograde vesicular trafficking from the ER to
          the Golgi together with accelerated retrograde recycling from the Golgi back to the ER. The
          disorder is therefore one of steady-state imbalance in both directions, not a simple block -
          a distinction that matters because it predicts a shrinking rather than a distended Golgi.
        cell_types:
        - preferred_term: dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
          term:
            id: GO:0006888
            label: endoplasmic reticulum to Golgi vesicle-mediated transport
          modifier: DECREASED
        - preferred_term: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
          term:
            id: GO:0006890
            label: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
          modifier: INCREASED
      selected_evidence:
        snippet: exhibited delayed anterograde vesicular trafficking from the ER to the Golgi and accelerated
          retrograde vesicular recycling from the Golgi to the ER
        supports: SUPPORT
    origin:
