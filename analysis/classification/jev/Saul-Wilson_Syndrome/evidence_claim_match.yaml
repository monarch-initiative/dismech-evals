  c39d86ca8903083bd248c4fb3cc60d737b2a2fa792eaecdb8d01f615c0da1075:
    claim:
      about:
        disease:
          name: Saul-Wilson Syndrome
          disease_term:
            preferred_term: microcephalic osteodysplastic dysplasia, Saul-Wilson type
            term:
              id: MONDO:0019407
              label: microcephalic osteodysplastic dysplasia, Saul-Wilson type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Glypican Accumulation and Elevated wnt4 Signalling
        biological_scale: MOLECULAR
        description: The proteoglycan defect is not confined to decorin. Patient fibroblasts accumulate
          glypicans - heparan sulfate proteoglycans that gate several growth and bone-development pathways
          - and the same accumulation occurs in zebrafish embryos expressing COG4 p.G516R. Downstream,
          wnt4 transcripts rise selectively, and overexpressing wnt4 alone phenocopies the developmental
          defects, so the elevated wnt4 is doing causal work rather than marking the lesion. The Wnt inhibitor
          LGK974 partially corrects body length, which is the strongest evidence in this disorder that
          a downstream node is pharmacologically addressable.
        biological_processes:
        - preferred_term: heparan sulfate proteoglycan metabolic process
          term:
            id: GO:0030201
            label: heparan sulfate proteoglycan metabolic process
          modifier: ABNORMAL
        - preferred_term: non-canonical Wnt signaling pathway
          term:
            id: GO:0035567
            label: non-canonical Wnt signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: SWS fibroblasts accumulate glypicans, a group of heparan sulfate proteoglycans (HSPGs)
          critical for growth and bone development through multiple signaling pathways.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34595172
      reference_title: A Dominant Heterozygous Mutation in COG4 Causes Saul-Wilson Syndrome, a Primordial
