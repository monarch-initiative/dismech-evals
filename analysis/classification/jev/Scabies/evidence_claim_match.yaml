            label: skin epidermis
      selected_evidence:
        snippet: S. scabiei var. hominis causes skin infestation in humans by forming burrows in the stratum
          corneum of the skin and feeding on host epidermis and sera. The release of active metabolites
          from the mite contribute to the intense itching and inflammation manifesting as a skin allergy
          and inflammatory responses (2). Potential sources of allergens include fecal material, mite
          bodies, mite saliva secreted at feeding, soluble proteins released after death in body fluids,
          and enzymes involved in molting and digestive processes (34).
        supports: SUPPORT
