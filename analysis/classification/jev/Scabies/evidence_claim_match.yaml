      assertion:
        accession: geo:GSE178563
        title: Transcriptome analysis of the host immune responses to Sarcoptes scabiei
        description: Scabies is a human skin disease due to the burrowing ectoparasite Sarcoptes scabiei
          resulting in intense itching and inflammation and manifesting as skin allergy. Little is known
          about the specific scabies molecules and genes involved in the host inflammatory and immunologic
          responses. We interrogated the transcriptome profiles of skin biopsies using next generation
          sequencing and a combined clustering and pathway mapping approach which will enable us in the
          identification of key signaling events in the host immune and inflammatory responses to S. scabiei
          infestation. With the comprehensive analysis of RNA-seq results, it has been found that the
          immune response of host inhibits S.
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        data_type: BULK_RNA_SEQ
        sample_count: 8
        publication: PMID:34925353
        notes: Identified by GEO DataSets index search for Scabies (scripts/discover_datasets.py); accession
          and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism
          are GEO's own values.
      selected_evidence:
        snippet: Here we aimed to interrogate the transcriptomic profiles of mite-infested human skin
          biopsies with clinical manifestations of ordinary scabies subjects ("OS"; n = 05) and subjects
          naive to scabies ("control"; n = 03) using RNASeq data analysis.
        supports: SUPPORT
