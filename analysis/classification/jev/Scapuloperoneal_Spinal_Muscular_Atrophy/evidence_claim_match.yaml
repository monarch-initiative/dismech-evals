              label: scapuloperoneal spinal muscular atrophy, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Scapuloperoneal Denervation Pattern
        description: 'Topographically selective denervation produces the scapuloperoneal phenotype — progressive
          atrophy and weakness of the shoulder-girdle/scapular muscles (scapular winging) and the peroneal/distal
          lower-limb muscles (foot drop) — with areflexia and relative sensory sparing. Additional features
          include vocal cord paralysis, scoliosis, and, in congenital-onset cases, arthrogryposis and
          skeletal dysplasia.

          '
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
      selected_evidence:
        snippet: Scapuloperoneal spinal muscular atrophy (SPSMA) is a rare autosomal dominant disorder
          caused by heterozygous mutations in the transient receptor potential cation channel (TRPV4)
          gene, characterized by progressive scapuloperoneal atrophy and weakness.
        supports: SUPPORT
