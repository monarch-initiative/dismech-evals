            term:
              id: MONDO:0008408
              label: scapuloperoneal spinal muscular atrophy, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Lower Motor Neuron and Motor Axon Degeneration
        description: 'Calcium-mediated cytotoxicity drives degeneration of anterior-horn lower motor neurons
          and their motor axons, the substrate of the spinal muscular atrophy phenotype. In knock-in mouse
          models carrying disease mutations (R269C, R232C), the degeneration is regional and the motor-neuron
          loss is non-cell-autonomous — driven by mutant channel activity in neural vascular endothelial
          cells with focal blood-spinal cord barrier breakdown — and is rescued by a TRPV4 antagonist.

          '
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: Calcium ion import (cytotoxic)
          term:
            id: GO:0070509
            label: calcium ion import
          modifier: INCREASED
      selected_evidence:
        snippet: TRPV4 mutant mice exhibited weakness, early lethality, and regional motor neuron loss.
        supports: SUPPORT
