              label: scapuloperoneal spinal muscular atrophy, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TRPV4 Channel Gain-of-Function
        description: 'Heterozygous missense substitutions in TRPV4 — most clustering in the intracellular
          N-terminal ankyrin-repeat domain (e.g., R269H, R315W, R316C, R232C, R316H) — produce a gain
          of channel function. Patch-clamp studies show mutant channels carry much larger whole-cell currents
          and a higher open probability than wild-type, establishing increased constitutive calcium channel
          activity rather than loss of function as the core molecular defect.

          '
        genes:
        - preferred_term: TRPV4
          term:
            id: hgnc:18083
            label: TRPV4
        molecular_functions:
        - preferred_term: Calcium channel activity (constitutive)
          term:
            id: GO:0005262
            label: calcium channel activity
          modifier: INCREASED
        biological_processes:
        - preferred_term: Calcium ion transmembrane transport
          term:
            id: GO:0070588
            label: calcium ion transmembrane transport
          modifier: INCREASED
      selected_evidence:
        snippet: the three previously reported TRPV4 mutant channels have a physiological localization
          and display an increased calcium channel activity, leading to increased cytotoxicity in three
          different cell types.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
