              label: scapuloperoneal spinal muscular atrophy, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Calcium Influx and Cytotoxicity
        description: 'The gain-of-function channel drives excessive calcium ion influx and raises intracellular
          calcium, linking the TRPV4 mutation to altered calcium homeostasis. The resulting hypercalcemic
          state is cytotoxic; in heterologous cells expressing mutant TRPV4, cell death is reversible
          by the TRPV channel antagonist ruthenium red, implicating calcium overload as the toxic effector.

          '
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: Calcium ion transmembrane transport (influx)
          term:
            id: GO:0070588
            label: calcium ion transmembrane transport
          modifier: INCREASED
        - preferred_term: Intracellular calcium ion homeostasis
          term:
            id: GO:0006874
            label: intracellular calcium ion homeostasis
          modifier: ABNORMAL
      selected_evidence:
        snippet: Cells transfected with R232C and R316H displayed increased intracellular Ca(2+) levels
          and reversible cell death by the TRPV channel antagonist, ruthenium red.
        supports: SUPPORT
