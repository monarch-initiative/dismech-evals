        biological_scale: CELLULAR
        description: SMARCAL1-deficient cells activate the DNA damage response during S phase without
          exogenous genotoxins, show slower replication fork recovery and delayed mitotic entry after
          S-phase arrest, and are hypersensitive to replication stress and DNA-damaging agents in vitro
          and in vivo. This replication stress preferentially compromises highly proliferative compartments
          (growth plate, glomerulus, thymus/lymphocytes, marrow) and underlies the hypersensitivity to
          genotoxic therapies observed clinically.
        biological_processes:
        - preferred_term: replication fork processing
          term:
