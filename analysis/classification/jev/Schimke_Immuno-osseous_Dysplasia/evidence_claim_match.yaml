              undetectable IL-7 receptor alpha chain (IL7Rα) protein and mRNA with hypermethylation of
              the IL7R promoter and are unresponsive to IL-7, restricting T-cell development; residual
              peripheral T cells are skewed to mature/memory phenotypes with exhaustion features. B-cell
              numbers and immunoglobulins are comparatively preserved early, though hypogammaglobulinemia
              — aggravated by nephrotic protein loss — is a hallmark of the combined immunodeficiency.
