          modifier: DECREASED
        - preferred_term: T cell homeostasis
          term:
            id: GO:0043029
            label: T cell homeostasis
          modifier: DECREASED
      selected_evidence:
        snippet: Here, we demonstrate that the T cells of SIOD patients have undetectable levels of protein
          and mRNA for the IL-7 receptor alpha chain (IL7Rα) and are unresponsive to stimulation with
          IL-7, indicating a loss of functional receptor.
        supports: SUPPORT
