        description: 'HSCT is a potential definitive therapy for the T-cell immunodeficiency and bone
          marrow failure, but the historical experience is poor: only one of the first five transplanted
          patients survived, with the four deaths following myeloablative conditioning — a toxicity plausibly
          linked to the hypersensitivity of SMARCAL1-deficient cells to DNA-damaging agents. Reduced-intensity
          conditioning with alpha-beta T-cell-depleted haploidentical grafts underlies the more recent
          successes.'
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: hematopoietic stem cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
      selected_evidence:
        snippet: We find that only one patient survived the transplantation procedure and that the existing
          indicators of a good prognosis for bone marrow transplantation were not predictive in this small
          cohort.
        supports: SUPPORT
