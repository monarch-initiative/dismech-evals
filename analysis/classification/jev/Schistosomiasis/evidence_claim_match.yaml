            preferred_term: Schistosomiasis
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Urine microscopy for eggs (urine filtration)
        description: Urine is filtered and the filter examined microscopically for the eggs of S. haematobium,
          the cause of urogenital schistosomiasis; egg count per 10 mL of urine is the intensity measure.
          WHO guidelines define heavy-intensity S. haematobium infection as 50 or more eggs per 10 mL
          of urine.
        measurements:
        - preferred_term: Schistosoma eggs in urine
          term:
            id: LOINC:10715-1
            label: Schistosoma sp identified in Urine sediment by Light microscopy
        notes: No method-less urine Schistosoma identification code was returned by Monarch KG searches
          for "Schistosoma identified in Urine", "Schistosoma sp identified" and "Schistosoma haematobium";
          the urine-sediment light-microscopy code is bound for the qualitative egg finding. It names
          sediment rather than filtration. The S. haematobium count codes returned are computer-assisted-method
          codes and are not bound. No code carries the egg count per 10 mL, so the heavy-intensity threshold
          is stated in the description and not as a reference range.
      selected_evidence:
        snippet: Heavy-intensity infection was defined as ≥50 eggs per 10 mL of urine
        supports: SUPPORT
