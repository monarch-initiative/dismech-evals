  efd5ddf3077620de7dbc0253fccdc6251bf4d729fcfb39587efd7d3ee58dbe57:
    claim:
      about:
        disease:
          name: Schistosomiasis
          disease_term:
            term:
              id: MONDO:0015254
              label: schistosomiasis
            preferred_term: Schistosomiasis
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Stool microscopy for eggs (Kato-Katz)
        description: Kato-Katz thick smears of stool are examined microscopically for the eggs of the
          intestinal species (S. mansoni, S. japonicum), the standard diagnostic method in endemic regions.
          Microscopy is affordable and highly specific but insensitive, and the egg count per gram of
          stool is the measure of infection intensity. WHO guidelines define heavy-intensity S. mansoni
          infection as 400 or more eggs per gram of stool and use its prevalence to judge whether morbidity
          is controlled.
        measurements:
        - preferred_term: Schistosoma eggs in stool
          term:
            id: LOINC:11085-8
            label: Schistosoma sp identified in Stool by Concentration
        notes: LOINC has no Kato-Katz or Schistosoma eggs-per-gram code in the Monarch KG (searches "Kato-Katz",
          "Schistosoma eggs", "Schistosoma eggs [#/mass]", "Schistosoma mansoni [#/mass] in Stool", "Ova
          count per gram stool", "Schistosoma sp identified in Stool"). The only stool Schistosoma code
          returned is bound for the qualitative egg finding; it names a concentration method, whereas
          Kato-Katz is a quantitative thick smear, so it identifies the analyte and specimen but not the
          technique. Because no code carries the egg count, the WHO heavy-intensity threshold is stated
          in the description with its evidence and not as a reference range. The cited source states only
          the heavy-intensity threshold, not the light and moderate classes.
      selected_evidence:
        snippet: This detection method involves utilizing Kato–Katz (KK) and urine filtration techniques
          to prepare stool and urine samples, respectively. Subsequently, the samples undergo microscopic
          examination to detect intestinal and urogenital schistosomiasis
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38990839
      reference_title: 'Schistosomiasis diagnosis: Challenges and opportunities for elimination.'
      evidence_source: OTHER
      explanation: Names Kato-Katz stool microscopy as the endemic-area method for intestinal schistosomiasis.
