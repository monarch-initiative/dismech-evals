          intestinal or urogenital schistosomiasis with intermittent symptoms related to infection intensity.
      selected_evidence:
        snippet: Over time, the granulomatous response to eggs is downregulated through several mechanisms
          in most individuals, leading to progression to the chronic intestinal form of the disease for
          S mansoni, S japonicum, and S mekongi.
        supports: SUPPORT
