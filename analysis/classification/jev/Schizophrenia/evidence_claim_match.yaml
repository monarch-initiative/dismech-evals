        in schizophrenia.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Cuts against this hypothesis''s assignment of genetic risk to parvalbumin interneurons:
        in dorsal prefrontal cortex the risk enrichment falls on excitatory intratelencephalic neurons.
        It qualifies one component of the framework rather than the framework itself, and cannot establish
        temporal primacy, since postmortem differential expression is also sensitive to illness state,
        treatment, and tissue effects.'
