  3aeaeba1b5c86061dd220c717754dc569d3c6d9797c9ab052675a04e332a777a:
    claim:
      about:
        disease:
          name: Schizophrenia
          disease_term:
            preferred_term: schizophrenia
            term:
              id: MONDO:0005090
              label: schizophrenia
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: muscarinic_cholinergic_hypothesis
        hypothesis_label: Muscarinic Cholinergic (M1/M4) Hypothesis
        status: EMERGING
        description: Deficient signalling through the M1 and M4 muscarinic acetylcholine receptors is
          a primary driver of psychosis rather than a downstream consequence of dopaminergic pathology.
          Cortical M1 receptor loss — marked in a postmortem-defined subgroup termed muscarinic receptor-deficit
          schizophrenia (MRDS) — is proposed to degrade prefrontal circuit function underlying cognitive
          and negative symptoms, while loss of M4-mediated cholinergic restraint on striatal dopamine
          release permits the dopamine dysregulation that produces positive symptoms. The model predicts
          that a muscarinic agonist should be antipsychotic without D2 blockade, and that prediction has
          now been met in three placebo-controlled phase 3 trials of xanomeline-trospium (KarXT), approved
          in 2024.
        notes: 'Held as EMERGING rather than CANONICAL because the therapeutic arm is far stronger than
          the aetiological one, and the two do not entail each other: a drug that raises muscarinic tone
          can relieve psychosis whether or not deficient muscarinic tone caused it, exactly as D2 antagonism
          was antipsychotic long before striatal dopamine excess was demonstrated. Well-supported: selective
          cortical M1 loss in dorsolateral prefrontal cortex (PMID:12476323); a bimodal distribution separating
          an MRDS subgroup at roughly a quarter of cases with ~74% lower cortical pirenzepine binding
          (PMID:18317461); reduced in-vivo muscarinic availability in unmedicated patients, with striatal
          and frontal binding correlating inversely with positive symptoms (PMID:12505810); and the M4-dependent
          suppression of striatal dopamine release that supplies the mechanistic bridge to the canonical
          dopamine node (PMID:27618677, PMID:29268098). Four qualifications. (1) The receptor deficit
          is a subgroup finding, not a property of the syndrome — MRDS was defined postmortem and no prospective
          in-life biomarker stratifies patients today, so KarXT is prescribed without regard to muscarinic
          status. (2) The deficit has no established genetic origin: MRDS could not be separated from
          non-MRDS schizophrenia by CHRM1 sequence, so it is not explained by coding variation in the
          receptor gene, and nothing here anchors it to the polygenic architecture the way C4A anchors
          the complement hypothesis. (3) The M4/dopamine-release mechanism rests on rodent pharmacology,
          and the CB2-receptor dependence reported for it (PMID:27618677) has not been shown in humans.
          (4) Antipsychotic exposure is itself a confound: clozapine lowers in-vivo muscarinic receptor
          availability by 45-79% across regions in a dose-dependent way (PMID:12799613), so postmortem
          and unmedicated-patient designs are load-bearing for the aetiological claim and treated cohorts
          cannot settle it.'
      selected_evidence:
        snippet: These results indicate a reduction in muscarinic acetylcholine receptor availability
          in vivo in unmedicated patients with schizophrenia, confirming results from postmortem studies
          and adding further evidence that the muscarinic system is involved in the pathophysiology of
          schizophrenia.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12505810
      reference_title: In vivo determination of muscarinic acetylcholine receptor availability in schizophrenia.
      evidence_source: HUMAN_CLINICAL
      explanation: 'In-vivo SPECT in medication-free patients, so the reduction cannot be attributed to
        antipsychotic exposure — the central aetiological claim of the hypothesis.

        '
