        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cortical Muscarinic M1 Receptor Deficit
        biological_scale: MOLECULAR
        synonyms:
        - CHRM1 deficit
        - Muscarinic receptor-deficit schizophrenia (MRDS)
        description: 'Selective loss of M1 muscarinic acetylcholine receptor protein, mRNA and pirenzepine
          binding in dorsolateral prefrontal cortex (Brodmann area 9). The deficit is bimodally rather
          than uniformly distributed: kernel density estimation separates a distinct postmortem subgroup
          — muscarinic receptor-deficit schizophrenia (MRDS) — at roughly a quarter of cases, with a ~74%
          reduction in cortical binding, from a non-MRDS majority whose binding overlaps controls.'
        mechanism_confidence: PROVISIONAL
        genes:
        - preferred_term: CHRM1
          term:
            id: hgnc:1950
            label: CHRM1
        molecular_functions:
        - preferred_term: M1 muscarinic acetylcholine receptor activity
          modifier: DECREASED
          term:
            id: GO:0016907
            label: G protein-coupled acetylcholine receptor activity
        biological_processes:
        - preferred_term: muscarinic acetylcholine receptor signalling in prefrontal cortex
          modifier: DECREASED
          term:
            id: GO:0007213
            label: G protein-coupled acetylcholine receptor signaling pathway
        locations:
        - preferred_term: dorsolateral prefrontal cortex (Brodmann area 9)
          term:
            id: UBERON:0009834
            label: dorsolateral prefrontal cortex
        notes: Whether the M1 deficit is upstream or downstream is unsettled. Transcriptomic profiling
          of MRDS cortex found 65 differentially expressed genes whose interactions the authors read as
          lying largely upstream of the M1 receptor (PMID:27801890), which would make the receptor loss
          a readout of an earlier lesion rather than the initiating one. The node is therefore stated
          as a receptor-level deficit and not as a primary cause, and its mechanism_confidence is PROVISIONAL.
          MRDS is a postmortem construct. No validated in-life assay assigns a living patient to it, so
          it does not currently stratify treatment and is not curated as a has_subtypes entry.
      selected_evidence:
        snippet: The level of M1R protein (0.11 +/- 0.007 vs 0.15 +/- 0.008 OD; P < 0.01), but not M4R
          protein, was decreased in BA9 from schizophrenic subjects with neither receptor protein being
          altered in BA 40.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12476323
      reference_title: Decreased muscarinic1 receptors in the dorsolateral prefrontal cortex of subjects
