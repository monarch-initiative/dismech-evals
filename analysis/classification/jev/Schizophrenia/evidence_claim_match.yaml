        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_dopamine_glutamate_neurodevelopmental_model
        hypothesis_label: Canonical Dopamine / Glutamate / Neurodevelopmental Model
        status: CANONICAL
        description: Schizophrenia is a polygenic neurodevelopmental disorder in which rare large-effect
          (e.g., 22q11.2 deletion, NRXN1, SETD1A) and common variants (>250 GWAS loci) converge on synaptic,
          dopaminergic, and glutamatergic pathways. Striatal dopamine D2-receptor hyperactivity drives
          positive symptoms (psychosis, hallucinations); cortical NMDA-receptor hypofunction and parvalbumin-interneuron
          dysfunction produce negative and cognitive symptoms. Aberrant synaptic pruning during adolescence
          (C4-complement-driven) and altered early-life neurodevelopment provide the substrate for later-onset
          psychotic phenotypes. Antipsychotic efficacy (all first-line drugs are D2 antagonists) and NMDA-channel-blocker
          models (ketamine, PCP) corroborate the dopamine-glutamate axis as the canonical pharmacologic
          substrate.
        notes: 'Retained as CANONICAL with major qualifications. The 2026 openscientist hypothesis-search
          report (kb/hypotheses/Schizophrenia/canonical_dopamine_glutamate_neurodevelopmental_model) finds
          PARTIALLY SUPPORTED — pathophysiology validated, pharmacological predictions fractured. Core
          architecture is well-supported: meta-analytic PET shows elevated presynaptic dopamine synthesis
          (Hedges'' g = 0.68; effect size 1.18 in prospective pre-psychosis), C4A overexpression replicated,
          perineuronal-net density reduced in 6/7 postmortem studies (a proxy for PV-associated circuitry,
          not a direct measure of PV-cell number or function), SV2A PET confirms synaptic density loss,
          2022 GWAS (>287 loci) confirms synaptic-biology convergence, and 22q11.2/SETD1A/ NRXN1 validate
          the polygenic-to-synaptic axis. Five critical qualifications: (1) dopamine synthesis capacity
          is heterogeneous rather than uniformly elevated: in PET comparison, treatment resistant patients
          were indistinguishable from controls while responders were elevated. The report''s figure of
          ~30% dopamine normal patients is not established, and appears to transfer the approximate prevalence
          of treatment resistance onto the prevalence of normal dopamine physiology; (2) dopamine pathology
          localizes to the ASSOCIATIVE striatum, not the canonical mesolimbic pathway; (3) glutamate pharmacology
          has failed its primary endpoints in large placebo-controlled trials (pomaglumetad, the iclepertin
          CONNEX programme, bitopertin), which falsifies the model''s therapeutic prediction for those
          agents and targets but does not refute glutamate pathophysiology as a class, since target engagement
          and biological enrichment were not uniform across them; (4) KarXT (xanomeline-trospium, muscarinic
          agonist, FDA approved 2024) demonstrates that direct D2 antagonism is not required for antipsychotic
          efficacy, though M4 agonism can itself depress striatal dopamine release, so this is not yet
          a demonstration of a dopamine independent mechanism; (5) the largest snRNA-seq study (536,618
          nuclei) prioritizes excitatory cortical neurons rather than PV interneurons for genetic risk,
          with prominent mitochondrial gene dysregulation. Read that as a strong lead rather than proof
          of causal primacy: postmortem differential expression cannot order excitatory against inhibitory
          changes in time, and a separate orbitofrontal multi-omic analysis instead prioritized glial
          and endothelial cells, so cell-type primacy currently varies with region, assay, and method.'
      selected_evidence:
        snippet: Research has implicated dysfunction of glutamatergic neurotransmission in the pathophysiology
          of schizophrenia.
        supports: SUPPORT
    origin:
