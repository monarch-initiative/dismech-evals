      reference: PMID:42671824
      reference_title: 'Virtual Reality-Assisted Therapy Compared to Cognitive Behavioral Therapy for
        Patients with Treatment-Resistant Schizophrenia: A Randomized, Assessor-Blind Controlled Trial.'
      evidence_source: HUMAN_CLINICAL
      explanation: Randomized, assessor-blind, parallel-group trial (NCT04054778) comparing 9-session
        VRT to 9-session CBT in 136 adults with treatment-resistant schizophrenia or schizoaffective disorder
        and persistent AVH. Intention-to-treat analyses showed significant time-by-treatment interaction
        favoring VRT (p=0.013) with moderate effect size at 3 months (d=0.614). Both therapies demonstrated
        within-group improvements, with VRT showing large effect sizes (d=0.81 post-therapy, d=1.17 at
        3-month follow-up) versus CBT's moderate effects (d=0.58 post-therapy, d=0.39 at 3 months). There
        were no between-group differences for secondary outcomes; within-group improvements in general
        psychotic symptoms, emotional regulation, and voice acceptance were observed for both therapies.
