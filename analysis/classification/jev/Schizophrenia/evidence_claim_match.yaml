        name: COMT
        gene_term:
          preferred_term: COMT
          term:
            id: hgnc:2228
            label: COMT
        association: Risk Factor
      selected_evidence:
        snippet: 'COMT is an enzyme that is distributed widely throughout the brain, but seems to be uniquely
          relevant to how dopamine affects information-processing in the prefrontal cortex. There is a
          common variation in the genetic sequence of the COMT gene, which causes a dramatic change in
          its enzyme activity. In people with schizophrenia, in their healthy siblings, and also in normal
          controls, the COMT genotype predicts 4% of the variation in human executive cognition and working
          memory. We have thus identified a genetic mechanism in the human species that affects the efficiency
          and efficacy of information-processing in the prefrontal cortex. It is, also, a weak genetic
          risk factor for schizophrenia: in family studies, it increases the risk of schizophrenia by
          50-80%.'
        supports: SUPPORT
