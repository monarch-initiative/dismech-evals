      assertion_type: Discussion
      assertion:
        discussion_id: gap_schizophrenia_catatonia_has_no_mechanism_node
        prompt: Which pathophysiological node in this entry produces catatonia, and is catatonic schizophrenia
          mechanistically continuous with the rest of the disorder or a distinct process that co-occurs
          with it?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Catatonia
        - pathophysiology#Abnormality of GABAergic Signaling
        rationale: Catatonia is the one phenotype in this entry with no incoming causal edge, and that
          is a recorded finding rather than an unfinished section. The candidate parent is the GABAergic
          node — catatonia responds to lorazepam, which argues for a GABA-A mechanism — but the argument
          does not survive inspection. The benzodiazepine response is a treatment observation, not a localisation;
          the reviews that discuss mechanism list aberrant motor-pathway activity, neurotransmitter dysregulation
          and oligodendrocyte dysfunction side by side as proposals without deciding between them; and
          catatonia is transdiagnostic, occurring in mania, depression, anti-NMDA-receptor encephalitis,
          and several general medical conditions, which cuts against its arising from the cortical circuit
          lesion this entry models. Drawing an edge from the GABAergic node on the strength of lorazepam
          would assert a localisation nobody has established, in the graph position where readers expect
          a mechanism. What would close it is a study relating a measured GABAergic parameter — motor-cortex
          GABA-A binding, or prefrontal GABA concentration — to catatonic sign severity within schizophrenia,
          rather than to diagnosis or to treatment response.
      selected_evidence:
        snippet: Aberrant neuronal activity in different motor pathways, defective neurotransmitter regulation,
          and impaired oligodendrocyte function have all been proposed as the pathophysiology behind catatonia.
        supports: SUPPORT
