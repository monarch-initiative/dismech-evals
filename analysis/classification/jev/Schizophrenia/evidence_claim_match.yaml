      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: complement_synaptic_pruning_hypothesis
        hypothesis_label: Complement-Mediated Synaptic Pruning Hypothesis
        status: EMERGING
        description: Schizophrenia risk alleles that increase complement C4A activity may increase complement
          tagging of vulnerable synapses during adolescent and young-adult cortical maturation. Microglia
          then remove more synaptic material than is developmentally appropriate, especially in prefrontal
          and hippocampal circuits, creating synaptic-density loss and circuit dysconnectivity that can
          feed into downstream dopamine dysregulation and clinical symptom domains.
        notes: 'Modeled separately from the canonical dopamine/glutamate framework because the complement-C4A
          link has strong genetic, patient-derived cellular, and mouse-model support, but the full human
          causal chain from C4A dosage to synapse loss, dopamine changes, developmental timing, and symptom-domain
          specificity remains partially inferred. The 2026 openscientist hypothesis-search report (kb/hypotheses/Schizophrenia/complement_synaptic_pruning_hypothesis)
          grades this PARTIALLY SUPPORTED at its genetic and cellular core but flags substantial revision
          of the effector mechanism, developmental timing, and downstream chain. Well-established: the
          C4A expression-dosage dose-response for schizophrenia risk (Sekar 2016), C4A overexpression
          driving cortical synapse loss and increased microglial engulfment in mice (Yilmaz 2021), increased
          synapse elimination in patient-derived iPSC microglia-neuron models (Sellgren 2019), and the
          inverse sex-biased C4A relationship between schizophrenia and SLE/Sjögren''s (Kamitaki 2020).
          Key qualifications: (1) the microglial-phagocytosis effector step is now contested by contradictory
          2025-2026 mouse studies proposing CR3-dependent reduced-surveillance vs CR3-independent SNX27/AMPAR-trafficking
          mechanisms; (2) the adolescent-timing claim is challenged by human postmortem data showing complement
          activators peak in toddlers and decline in teenagers (Sager 2021); (3) the link to downstream
          dopamine dysregulation remains unsupported by direct evidence; and (4) after a decade there
          are still no complement-targeted schizophrenia trials and peripheral complement biomarkers are
          inconsistent across cohorts. C4 sits within a highly polygenic (287+ locus) architecture and
          contributes a modest effect for a common locus. The frequently repeated "OR ~1.27" should not
          be read as an odds ratio per unit of C4A expression: Sekar et al. reported relative risks running
          from 1.00 to 1.27 across four common C4 structural alleles, and did not estimate C4A''s share
          of schizophrenia heritability.'
      selected_evidence:
        snippet: complement activator (C1QB and C3) transcripts peaked in early neurodevelopment, and
          were highest in toddlers, declining in teenagers
        supports: SUPPORT
