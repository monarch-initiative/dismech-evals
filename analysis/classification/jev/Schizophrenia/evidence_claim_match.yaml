        discussion_id: mismatch_schizophrenia_setd1a_h3k4_demethylase_target
        prompt: Which H3K4 demethylase is the correct therapeutic target for restoring the SETD1A-H3K4
          methylation imbalance in human neurons - KDM5, which rescues SETD1A-deficiency phenotypes in
          human iPSC-derived neural models, or LSD1 (KDM1A), which rescues them in mouse Setd1a models
          where KDM5 inhibition does not?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced SETD1A H3K4 Methyltransferase Activity at Psychiatric Risk Gene Promoters
        - genetic#SETD1A
        rationale: 'The therapeutic logic of SETD1A haploinsufficiency is unusually direct: SETD1A writes
          H3K4 methylation, so inhibiting the demethylase that erases it should restore the balance. Which
          demethylase to inhibit, however, comes out differently in mouse and in human cells, and the
          two results are not reconcilable by dose or timing alone. In mouse Setd1a models the neuronal-morphology
          and synaptic phenotypes are rescued by LSD1 (KDM1A) inhibition and explicitly NOT by KDM5 inhibition.
          In human iPSC-derived isogenic SETD1A loss-of-function neurons, KDM5 inhibition rescues the
          DNA damage accumulation, and in independent patient-derived cells carrying the Old Order Amish
          p.Pro596Leu hypomorph, KDM5 inhibition partially rescues replication stress and neurite deficits.
          So the human evidence converges on KDM5 across two different SETD1A perturbations and two laboratories,
          while the mouse evidence specifically excludes it. This matters beyond the rare LoF carriers:
          postmortem cortex from schizophrenia cases WITHOUT SETD1A mutations shows reduced SETD1A expression
          and downregulation of SETD1A-regulated genes, so the target population for H3K4-restoring therapy
          would be far broader than the mutation carriers, and picking the wrong demethylase on the strength
          of the mouse data would misdirect it. Note also that the human rescue is explicitly partial
          - 10-20% of neural progenitors still became senescent under KDM5 inhibition - so even the human-supported
          target does not fully normalise the cellular phenotype.'
        proposed_experiments:
        - experiment_id: exp_schizophrenia_setd1a_kdm5_vs_lsd1_head_to_head
          name: Head-to-head KDM5 versus LSD1 inhibition in matched human and mouse SETD1A models
          description: Apply KDM5 and LSD1 (KDM1A) inhibitors side by side, at matched target engagement,
            to isogenic human iPSC-derived SETD1A loss-of-function neurons and to primary neurons from
            Setd1a haploinsufficient mice, reading out the same endpoints in both (H3K4me3 at SETD1A-bound
            promoters, DNA damage markers, neurite complexity, progenitor senescence, network activity).
          experiment_type:
            preferred_term: comparative pharmacologic rescue study
          decision_criterion: A genuine species difference would be supported if the KDM5-versus-LSD1
            ordering reverses between human and mouse cells under identical endpoints and matched target
            engagement; a shared mechanism obscured by assay differences would instead show both inhibitors
            rescuing in both species once the endpoints are harmonised, in which case the original discrepancy
            is methodological rather than biological.
      selected_evidence:
        snippet: SETD1A haploinsufficiency causes accelerated neurogenesis, reduced neuronal complexity,
          and DNA damage accumulation in postmitotic neurons that is rescued by inhibiting the H3K4me2/3
          demethylase KDM5.
        supports: SUPPORT
