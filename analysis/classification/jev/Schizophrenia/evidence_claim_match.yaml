      assertion_type: Pathophysiology
      assertion:
        name: Reduced SETD1A H3K4 Methyltransferase Activity at Psychiatric Risk Gene Promoters
        biological_scale: MOLECULAR
        description: SETD1A deposits H3K4 methylation at active promoters, and it binds those promoters
          selectively at schizophrenia risk loci controlling chromatin remodeling, DNA repair, and synaptic
          function. Loss-of-function variants reduce that activity directly. The same deficit is reached
          without a rare variant in sporadic disease, where cortical SETD1A expression is low and SETD1A-regulated
          genes are correspondingly downregulated, which is why this node is curated as a mechanism of
          schizophrenia rather than as an annotation on the mutation carriers.
        molecular_functions:
        - preferred_term: SETD1A histone H3K4 methyltransferase activity
          modifier: DECREASED
          term:
            id: GO:0042800
            label: histone H3K4 methyltransferase activity
      selected_evidence:
        snippet: SETD1A preferentially binds the promoters of polygenic risk loci for psychiatric disorders
          that regulate chromatin remodeling, DNA repair, and synaptic function
        supports: SUPPORT
