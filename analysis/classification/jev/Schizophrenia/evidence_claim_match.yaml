    evidence_metadata:
      reference: PMID:41903141
      reference_title: Schizophrenia-associated complement C4 impairs synaptic connectivity and decreases
        microglia-synapse interactions through CR3 signaling.
      evidence_source: MODEL_ORGANISM
      explanation: 'Supports the CR3 arm of this node: the synaptic consequences of frontal cortex C4
        overexpression are abolished when microglial CR3 is absent. The route, however, is not the one
        this node originally asserted. The same study reports that C4 overexpression decreases microglial
        surveilled volume, motility, and contact frequency with synaptic structures, so the proposed mechanism
        is CR3-dependent loss of microglial surveillance rather than CR3-dependent excess engulfment.'
