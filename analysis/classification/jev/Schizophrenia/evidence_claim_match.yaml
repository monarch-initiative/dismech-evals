    evidence_metadata:
      reference: PMID:40162239
      reference_title: Transcriptomic and genetic analysis suggests a role for mitochondrial dysregulation
        in schizophrenia.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Single-nucleus RNA-seq of 536,618 nuclei from dorsal prefrontal cortex of 43 cases
        and 42 controls ties a mitochondrial gene program to schizophrenia genetic risk. This is a different
        claim from the postmortem enzyme-activity citation above: it connects the bioenergetic lesion
        to inherited risk rather than measuring respiratory-chain function. Two limits on how far it reaches:
        the finding is postmortem differential expression and co-expression enrichment, so it cannot order
        bioenergetic failure relative to synaptic or interneuron changes, and the deposited record is
        a medRxiv preprint.'
