      assertion:
        target: Cortical Muscarinic M1 Receptor Deficit
        treatment_effect: MODULATES
        description: 'Agonist occupancy raises signalling through the M1 receptors that remain rather
          than replacing lost receptor protein, so the drug compensates for the deficit without correcting
          it. `MODULATES` rather than `BYPASSES`: the drug acts on the very receptor the node describes,
          so it is not routing around the lesion by another pathway. Not `RESTORES` either — receptor
          protein stays low. Whether patients with the marked cortical deficit (MRDS) respond better than
          others has never been tested, because trial entry has never been stratified by muscarinic status.'
      selected_evidence:
        snippet: In the cognitive test battery, subjects in the xanomeline group showed improvements most
          robustly in measures of verbal learning and short-term memory function.
        supports: SUPPORT
        directness: INDIRECT
