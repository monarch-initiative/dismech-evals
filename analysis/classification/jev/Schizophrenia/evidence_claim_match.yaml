      assertion:
        name: Oligodendrocyte and Myelin Dysfunction
        description: Abnormalities in oligodendrocytes and myelin sheaths leading to white matter changes
          and network dysconnectivity across brain regions.
        cell_types:
        - preferred_term: oligodendrocyte
          description: Oligodendrocyte dysfunction contributes to impaired myelination and dysconnectivity.
          term:
            id: CL:0000128
            label: oligodendrocyte
        biological_processes:
        - preferred_term: myelination
          term:
            id: GO:0042552
            label: myelination
        locations:
        - preferred_term: prefrontal cortex
          term:
            id: UBERON:0000451
            label: prefrontal cortex
        - preferred_term: hippocampus
          term:
            id: UBERON:0001954
            label: Ammon's horn
        notes: 'Deliberately left with no downstream edge. The obvious one to draw is myelin/dysconnectivity
          to formal thought disorder, and the study that tested it does not support it: white matter integrity
          was reduced in patients versus controls across every language-related tract, but the correlations
          with thought-disorder severity did not survive multiple-comparison correction, and patients
          with severe and mild thought disorder did not differ (PMID:29861197). So the node is real and
          the phenotype link is not established. An edge here would be graph tidiness bought with a citation
          that does not carry it.'
      selected_evidence:
        snippet: No difference in FA was found between patients with severe and patients with mild FTD.
        supports: REFUTE
        directness: DIRECT
