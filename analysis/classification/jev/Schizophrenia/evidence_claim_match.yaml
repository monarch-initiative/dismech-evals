  eec1d2dd0176dad78953f3539b3a0f3180ec200d40e0d00b6668f7bde89aba9c:
    claim:
      about:
        disease:
          name: Schizophrenia
          disease_term:
            preferred_term: schizophrenia
            term:
              id: MONDO:0005090
              label: schizophrenia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_schizophrenia_glutamate_pharmacology_translation
        prompt: Do the failed phase 3 trials of glutamate-modulating drugs mean that the glutamatergic
          target is wrong in schizophrenia, or that the trials enrolled patients unselected for a glutamatergic
          abnormality?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Abnormality of Glutamergic Signaling
        - mechanistic_hypotheses#canonical_dopamine_glutamate_neurodevelopmental_model
        rationale: 'This entry curates glutamatergic dysfunction as an established pathophysiological
          component while the therapeutic prediction that follows from it has repeatedly failed: an mGluR2/3
          agonist and a GlyT1 inhibitor both missed their primary endpoints in large placebo-controlled
          trials. The gap is that neither programme tested the mechanistic prediction directly. Enrolment
          was by clinical diagnosis, not by a glutamatergic biomarker, and target engagement was not uniformly
          demonstrated, so a null result in an unselected population cannot separate a wrong target from
          the wrong patients. Nothing here licenses the stronger reading that trial failure refutes glutamate
          pathophysiology as a class; it bounds the therapeutic prediction for the specific agents, doses,
          endpoints, and populations that were studied.'
        proposed_experiments:
        - experiment_id: exp_schizophrenia_biomarker_stratified_glutamate_trial
          name: Biomarker-stratified glutamate-modulator trial
          description: Randomize first-episode psychosis patients to a glutamate-modulating agent or placebo
            after stratifying on baseline hippocampal glutamate and glutamine by magnetic resonance spectroscopy,
            with SV2A PET as a secondary synaptic-density measure, and test the treatment-by-stratum interaction
            rather than the unstratified main effect.
          experiment_type:
            preferred_term: biomarker-stratified randomized controlled trial
          would_support:
          - pathophysiology#Abnormality of Glutamergic Signaling
          supporting_outcome:
          - Patients in the elevated-glutamate stratum improve relative to placebo while patients with
            normal baseline glutamate do not, indicating that the earlier null results reflect an unselected
            population rather than an invalid target.
          refuting_outcome:
          - No benefit in either stratum despite demonstrated target engagement, indicating that the glutamatergic
            abnormality is not a tractable therapeutic target in established illness.
          decision_criterion: A significant treatment-by-stratum interaction on the primary symptom or
            cognition endpoint, with target engagement independently confirmed.
      selected_evidence:
        snippet: Iclepertin was not associated with significant improvements in cognition in adults with
          schizophrenia, but it was well tolerated by patients.
        supports: SUPPORT
