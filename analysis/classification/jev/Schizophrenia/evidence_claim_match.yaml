      assertion_type: Pathophysiology
      assertion:
        name: Blood-Brain Barrier Dysfunction
        description: Increased BBB permeability with elevated CSF albumin and immunoglobulins, involving
          dysfunction of endothelial cells, pericytes, and astrocytes in the neurovascular unit.
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        locations:
        - preferred_term: blood-brain barrier
        notes: 'Deliberately left with no downstream edge. The intuitive one — barrier leak admitting
          peripheral immune activity that feeds the complement-pruning node — is not something the available
          evidence establishes; the human data show the leak (raised CSF/serum albumin and IgG ratios)
          without connecting it to synapse elimination. Note also how small the effect is: the same study
          found CSF white cell count, total protein and IgG index NOT significantly elevated, so this
          is a subtle group-level shift rather than a barrier breach, and the node should not be read
          as asserting neuroinflammation.'
      selected_evidence:
        snippet: 'CSF/serum albumin ratio (Relative Mean Difference (MD): 1.11; 95%CI: 1.00-1.23; P =
          .044) and CSF/serum IgG ratio (MD: 1.17; 95%CI: 1.01-1.36; P = .036) was increased in patients
          compared to controls.'
        supports: SUPPORT
        directness: DIRECT
    origin:
