      assertion_type: Pathophysiology
      assertion:
        name: Dysregulation of Dopamine Neurotransmission
        synonyms:
        - Dopamine Hypothesis
        description: 'Imbalance in dopamine transmission in the brain. Meta-analytic PET localizes the
          elevation of presynaptic dopamine function to the associative and sensorimotor (dorsal) striatal
          subdivisions rather than the limbic subdivision, which is inconsistent with a strictly mesolimbic
          formulation. Elevation is a group-level finding rather than a universal feature: patients whose
          illness is treatment resistant do not show it.'
        genes:
        - preferred_term: DRD2
          term:
            id: hgnc:3023
            label: DRD2
        - preferred_term: COMT
          term:
            id: hgnc:2228
            label: COMT
        biological_processes:
        - preferred_term: dopamine secretion
          term:
            id: GO:0014046
            label: dopamine secretion
        locations:
        - preferred_term: striatum
      selected_evidence:
        snippet: Findings have converged to suggest early dysregulation in the striatum, especially in
          the rostral caudate, manifesting as excess synthesis and release. Recent data showed deficit
          extending to most cortical regions and even to other extrastriatal subcortical regions not previously
          considered to be 'hypodopaminergic' in schizophrenia.
        supports: SUPPORT
