      assertion_type: Pathophysiology
      assertion:
        name: Loss of M4 Receptor Restraint of Striatal Dopamine Release
        biological_scale: CELLULAR
        synonyms:
        - Cholinergic-dopaminergic imbalance in the striatum
        description: 'Cholinergic input to the striatum and substantia nigra normally holds dopaminergic
          transmission in check through the M4 muscarinic receptor: M4 activation on spiny projection
          neurons produces a sustained depression of striatal dopamine release, and nigral M4 opposes
          D1 signalling in direct-pathway presynaptic terminals. Weakened M4 restraint is proposed to
          permit the striatal dopamine dysregulation that generates positive symptoms, and supplies the
          mechanistic route by which a non-D2 muscarinic agonist reaches the canonical dopamine node.'
        mechanism_confidence: HYPOTHETICAL
        genes:
        - preferred_term: CHRM4
          term:
            id: hgnc:1953
            label: CHRM4
        cell_types:
        - preferred_term: striatal spiny projection neuron
          description: Carries the M4 receptors whose activation depresses striatal dopamine release.
          term:
            id: CL:1001474
            label: medium spiny neuron
        - preferred_term: cholinergic neuron
          description: Source of the acetylcholine acting at M4, from striatal interneurons and from pedunculopontine
            projections to the substantia nigra pars reticulata.
          term:
            id: CL:0000108
            label: cholinergic neuron
        biological_processes:
        - preferred_term: muscarinic restraint of striatal dopamine release
          modifier: DECREASED
          term:
            id: GO:0033602
            label: negative regulation of dopamine secretion
        locations:
        - preferred_term: striatum
          term:
            id: UBERON:0002435
            label: striatum
        - preferred_term: substantia nigra pars reticulata
          term:
            id: UBERON:0002038
            label: substantia nigra
        notes: The M4-dopamine mechanism is established in rodent pharmacology and electrophysiology,
          not in human tissue; the human evidence for the node is the inverse correlation between striatal
          muscarinic availability and positive symptoms, which is associative. The CB2-receptor dependence
          reported for M4-mediated dopamine suppression (PMID:27618677) is unreplicated in humans and
          is not asserted here. mechanism_confidence is HYPOTHETICAL for that reason.
      selected_evidence:
        snippet: extra-striatal cholinergic projections from the pedunculopontine nucleus to the substantia
          nigra pars reticulata (SNr) act on muscarinic acetylcholine receptor subtype 4 (M4) to oppose
          cAMP-dependent dopamine receptor subtype 1 (D1) signaling in presynaptic terminals of direct
          pathway striatal spiny projections neurons
        supports: SUPPORT
        directness: DIRECT
    origin:
