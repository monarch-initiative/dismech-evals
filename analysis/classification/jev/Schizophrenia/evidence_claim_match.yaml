  bf741b9c848fe92196a69dc9ec5d7629987c330b005924c3c8bda858f88d8751:
    claim:
      about:
        disease:
          name: Schizophrenia
          disease_term:
            preferred_term: schizophrenia
            term:
              id: MONDO:0005090
              label: schizophrenia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_schizophrenia_mrds_stratification_of_muscarinic_response
        prompt: Does the cortical muscarinic M1 receptor deficit that defines MRDS predict who responds
          to a muscarinic agonist, and can that deficit be measured in a living patient before treatment?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Cortical Muscarinic M1 Receptor Deficit
        - treatments#Xanomeline-Trospium (KarXT)
        rationale: 'The muscarinic hypothesis and the drug built on it have never been joined at the level
          of the individual patient. MRDS was defined on postmortem tissue by pirenzepine binding in Brodmann
          area 9, and separates roughly a quarter of cases with a ~74% reduction from a majority overlapping
          controls — so the receptor deficit the mechanism turns on is present in a minority. Every KarXT
          trial, from the 20-patient pilot through the EMERGENT phase 3 programme, enrolled without regard
          to muscarinic status, and the drug is prescribed the same way. Two readings of the phase 3 results
          are therefore still open and have different consequences. If response tracks the deficit, the
          unstratified trials understate the effect in MRDS patients and a pre-treatment assay would be
          worth having. If response is independent of it, then M1/M4 agonism is a general pharmacological
          lever on the dopamine and prefrontal circuitry rather than replacement of a specific missing
          signal — which would weaken the aetiological hypothesis while leaving the treatment untouched.
          Closing this needs an in-life measure: the postmortem assay does not transfer, and existing
          muscarinic PET/SPECT ligands such as IQNB bind muscarinic receptors non-selectively rather than
          reporting M1 specifically. Current antipsychotic treatment lowers muscarinic availability on
          its own — dose-dependently and substantially for clozapine (PMID:12799613) — so any such measure
          has to handle medication status as a confound rather than a covariate.'
        proposed_experiments:
        - experiment_id: exp_schizophrenia_m1_biomarker_stratified_muscarinic_trial
          name: M1-stratified trial of muscarinic agonism
          description: Develop or qualify an M1-selective in-life measure of cortical muscarinic status
            (subtype-selective PET ligand, or a validated peripheral or transcriptomic proxy benchmarked
            against postmortem pirenzepine binding), then stratify patients by that measure at entry to
            a placebo-controlled trial of xanomeline-trospium and compare symptom and cognitive response
            between the deficit and non-deficit strata, with washout or medication status handled as a
            prespecified confounder.
          experiment_type:
            preferred_term: biomarker-stratified randomized controlled trial
          would_support:
          - pathophysiology#Cortical Muscarinic M1 Receptor Deficit
          supporting_outcome:
          - A larger reduction in PANSS total score, or a larger cognitive gain, in the receptor-deficit
            stratum than in the non-deficit stratum, under identical dosing.
          refuting_outcome:
          - Equivalent response across strata, showing that M1/M4 agonism works independently of baseline
            receptor status — the treatment effect intact, its support for the cortical deficit as a driving
            lesion removed.
          decision_criterion: The aetiological arm of the muscarinic hypothesis would be strengthened
            if receptor-deficit patients respond better than non-deficit patients under identical dosing,
            and weakened if the strata respond equivalently.
      selected_evidence:
        snippet: Being able to define a subgroup within schizophrenia using a central biological parameter
          is a pivotal step towards understanding the biochemistry underlying at least one form of the
          disorder and may represent a biomarker that can be used in neuroimaging.
        supports: SUPPORT
