              label: schneckenbecken dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Nucleotide-Sugar Transport
        description: 'SLC35D1 encodes an endoplasmic reticulum nucleotide-sugar transporter that transports
          UDP-glucuronic acid and UDP-N-acetylgalactosamine from the cytoplasm into the ER lumen. These
          substrates are required for chondroitin sulfate biosynthesis. Loss-of-function mutations abolish
          transporter activity, leading to defective chondroitin sulfate chain synthesis on cartilage
          proteoglycan core proteins. The resulting proteoglycans have short, sparse chondroitin sulfate
          chains that cannot maintain normal cartilage extracellular matrix integrity.

          '
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        - preferred_term: Growth Plate Chondrocyte
          term:
            id: CL:1000217
            label: growth plate cartilage chondrocyte
        biological_processes:
        - preferred_term: Nucleotide-Sugar Transmembrane Transport
          term:
            id: GO:0015780
            label: nucleotide-sugar transmembrane transport
        - preferred_term: Chondroitin Sulfate Proteoglycan Biosynthesis
          term:
            id: GO:0050650
            label: chondroitin sulfate proteoglycan biosynthetic process
      selected_evidence:
        snippet: Here we created Slc35d1-deficient mice that develop a lethal form of skeletal dysplasia
          with severe shortening of limbs and facial structures
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
