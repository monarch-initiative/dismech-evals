          Epiphyseal cartilage shows a decreased proliferating zone with round chondrocytes, scarce matrices,
          and reduced proteoglycan aggregates. Biochemical analysis revealed short, sparse chondroitin
          sulfate chains caused by defective chondroitin sulfate biosynthesis on cartilage proteoglycan
          core proteins.

