        features: 'Biallelic loss-of-function mutations in SLC35D1 (1p31.3) are the primary cause. Identified
          mutations include nonsense mutations (p.R107X), splice site mutations (IVS4+3A>G), large deletions
          (exon 7 deletion), and missense mutations that abolish transporter activity (p.T65P). SLC35D1
          encodes a nucleotide-sugar transporter in the endoplasmic reticulum membrane. Hypomorphic missense
          alleles (e.g. p.Pro133Leu, p.Met134Thr, p.Gly300Val) that reduce but do not abolish transport
          activity produce a milder nonlethal phenotype with short stature and skeletal anomalies.

