        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Monoclonal Gammopathy
        description: 'A monoclonal IgM (rarely IgG) gammopathy is a mandatory feature of Schnitzler syndrome,
          reflecting an underlying clonal B-cell/plasma-cell process. The relationship between the monoclonal
          component and the autoinflammation is not fully understood, but a shared pathophysiologic mechanism
          is hypothesized, and the clonal process underlies the long-term risk of lymphoproliferative
          transformation.

          '
        cell_types:
        - preferred_term: plasma cell
          term:
            id: CL:0000786
            label: plasma cell
      selected_evidence:
        snippet: 'Schnitzler''s syndrome is an auto-inflammatory disorder which is characterized by two
          mandatory features: an urticarial rash and a monoclonal gammopathy.'
        supports: SUPPORT
