      assertion_type: Discussion
      assertion:
        discussion_id: n100s_mouse_cholesterol_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Why does the Ubiad1 N100S knock-in mouse develop anterior corneal deposits without any
          detectable increase in corneal cholesterol, when the defining human lesion is corneal cholesterol
          accumulation?
        attaches_to:
        - pathophysiology#Corneal Cholesterol and Phospholipid Deposition
        rationale: 'The N100S mouse models the human N102S hotspot yet shows mitochondrial abnormality
          and altered glycerophosphoglycerols rather than cholesterol excess, while the G184R knock-in
          line does accumulate corneal free cholesterol. Species differences in cholesterol metabolism
          are the authors'' proposed explanation, but the discrepancy is unresolved and matters for choosing
          a preclinical model: a therapeutic candidate that normalizes cholesterol would show no benefit
          in the N100S line regardless of whether it works in humans.'
        status: OPEN
      selected_evidence:
        snippet: The Ubiad1N100S mouse provides a promising animal model of SCD revealing that mitochondrial
          dysfunction is a prominent component of the disease. The different phenotype in human and mouse
          may due to difference in cholesterol metabolism between species.
        supports: SUPPORT
