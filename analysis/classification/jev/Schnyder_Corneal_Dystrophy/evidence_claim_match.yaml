        expressivity: VARIABLE
        description: 'SCD segregates as a fully dominant trait with high penetrance, caused by heterozygous
          UBIAD1 missense variants. Penetrance is age-dependent rather than truly reduced: corneal findings
          emerge and progress along a predictable age schedule, so young carriers may be clinically unaffected
          at examination (recorded as INCOMPLETE, the closest available enum value). Expressivity is variable:
          the presence and extent of corneal crystals, degree of stromal haze, and presence of systemic
          findings differ substantially between carriers of the same variant, including within a single
          family. De novo variants are rare but documented, so a negative family history does not exclude
          the diagnosis.'
      selected_evidence:
        snippet: SCD is inherited as an autosomal dominant trait with high penetrance and has been mapped
          to the UBIAD1 gene on chromosome 1p36.3.
        supports: SUPPORT
