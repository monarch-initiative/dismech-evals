        context: []
      assertion_type: Pathophysiology
      assertion:
        name: UBIAD1 Missense Variant
        description: A heterozygous missense variant in UBIAD1 (1p36.22) substitutes a highly conserved
          residue in the prenyltransferase domain or an adjacent transmembrane helix. Over 20 SCD-associated
          UBIAD1 variants are known; p.Asn102Ser is a recurrent hotspot found in unrelated families of
          both European and Asian ancestry. The variants act by conferring an abnormal, persistent interaction
          with HMG-CoA reductase rather than by simple loss of catalytic activity.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genetic_context:
          gene:
            preferred_term: UBIAD1
            term:
              id: hgnc:30791
              label: UBIAD1
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: 'SCD variants are heterozygous germline missense changes. The disease-driving consequence
            is a gain, not a loss: the mutant protein sustains an abnormal, GGpp-resistant association
            with HMGCR that wild-type UBIAD1 releases, so it acquires a persistent HMGCR-stabilizing activity.
            Catalytic MK-4 synthesis is reduced in parallel, so the allele is simultaneously hypomorphic
            for its enzymatic function; the single controlled value records the dominant, phenotype-driving
            arm, since per-variant MK-4 activity does not track with the SCD phenotype.'
        molecular_functions:
        - preferred_term: prenyltransferase activity
          term:
            id: GO:0004659
            label: prenyltransferase activity
          modifier: DECREASED
        locations:
        - preferred_term: cornea
          term:
            id: UBERON:0000964
            label: cornea
      selected_evidence:
        snippet: Sequencing of genes in our interval led to the identification of five putative causal
          mutations in gene UBIAD1, in our family as well as in four other small families of various geographic
          origins.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
