        context: []
      assertion_type: Biochemical
      assertion:
        name: Inactive (Desphospho-Uncarboxylated) Matrix Gla Protein
        notes: Matrix Gla protein (MGP) is a vitamin-K-dependent protein that is abundant and predominantly
          mature in normal human cornea. SCD keratocytes show increased MGP expression with immature forms,
          and SCD patients have elevated plasma inactive (desphospho-uncarboxylated) MGP, indicating poor
          vascular vitamin K status. This is currently the clearest biochemical readout of the vitamin
          K arm of UBIAD1 dysfunction in patients, and raises an unresolved question about cardiovascular
          risk in SCD.
      selected_evidence:
        snippet: Systemic MGP findings reveal a poor vascular VK status in SCD patients and indicate that
          SCD may lead to cardiovascular consequences.
        supports: SUPPORT
    origin:
