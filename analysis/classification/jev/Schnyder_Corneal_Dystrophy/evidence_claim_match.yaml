      assertion:
        name: Progressive Corneal Opacification and Light Scattering
        description: 'Deposition follows a highly age-predictable spatial sequence: central corneal haze
          and/or crystals first, arcus lipoides in the third decade, then midperipheral haze in the late
          fourth decade. The optical consequence is asymmetric across lighting conditions, since scattering
          degrades bright-light (photopic) vision and produces disabling glare while scotopic acuity is
          comparatively preserved into middle age. Cumulative opacification drives progressive visual
          disability and, in most patients, corneal surgery by the seventh decade.'
        biological_scale: ORGANISM
        mechanism_confidence: ESTABLISHED
        locations:
        - preferred_term: cornea
          term:
            id: UBERON:0000964
            label: cornea
      selected_evidence:
