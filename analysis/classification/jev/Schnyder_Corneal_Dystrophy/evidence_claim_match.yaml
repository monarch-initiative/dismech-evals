              label: Schnyder corneal dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Blocked Sterol-Accelerated HMGCR ERAD
        description: HMG-CoA reductase is normally subject to sterol-accelerated, ER-associated degradation,
          a feedback arm that shuts down the mevalonate pathway when sterols are abundant. Sterols promote
          UBIAD1-HMGCR binding, which transiently spares the enzyme so that nonsterol isoprenoid synthesis
          can continue; GGpp then displaces UBIAD1 and permits maximal degradation. SCD-mutant UBIAD1
          cannot be displaced, so HMGCR escapes ERAD and accumulates, as demonstrated in cultured cells,
          in patient-derived material, and in knock-in mice, where HMGCR protein accumulates across several
          tissues.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        biological_processes:
        - preferred_term: ERAD pathway
          term:
            id: GO:0036503
            label: ERAD pathway
          modifier: DECREASED
        molecular_functions:
        - preferred_term: HMG-CoA reductase activity
          term:
            id: GO:0004420
            label: hydroxymethylglutaryl-CoA reductase (NADPH) activity
          modifier: INCREASED
      selected_evidence:
        snippet: SCD-associated mutations in UBIAD1 block its displacement from reductase in the presence
          of geranylgeraniol, thereby preventing degradation of reductase.
        supports: SUPPORT
    origin:
