      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: hmgcr_stabilization_model
        hypothesis_label: HMGCR stabilization (blocked ERAD) drives corneal cholesterol accumulation
        status: CANONICAL
        description: The dominant model. SCD-associated UBIAD1 is sequestered in the ER, competes with
          Insig-1 for HMG-CoA reductase, and blocks its sterol-accelerated ER-associated degradation.
          The stabilized reductase sustains cholesterol synthesis, producing corneal sterol overaccumulation.
          The model is supported by concordant cell-biological, biochemical, and knock-in mouse evidence,
          and it explains why the disease is corneal-local and why systemic statins are not expected to
          correct the corneal defect.
      selected_evidence:
        snippet: In summary, these results demonstrate that SCD-associated mutations of UBIAD1 impair
          its ER-to-Golgi transportation and enhance its interaction with HMGCR.
        supports: SUPPORT
