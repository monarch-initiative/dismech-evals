              id: MONDO:0007374
              label: Schnyder corneal dystrophy
        context: []
      assertion_type: Treatment
      assertion:
        name: Systemic Lipid-Lowering Therapy (Not Corneal Disease-Modifying)
        description: Statins are appropriately prescribed for the concurrent systemic hypercholesterolemia
          seen in about two-thirds of patients, but there is no evidence they alter the corneal disease,
          and there is a mechanistic reason to expect them not to. The SCD lesion acts by blocking degradation
          of HMG-CoA reductase, the very enzyme statins inhibit, so the mutant protein directly opposes
          the compensatory turnover that statin therapy depends on. This entry is curated to record the
          absence of corneal benefit, not to recommend statins for SCD.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: HMG-CoA reductase inhibitor
            term:
              id: NCIT:C1655
              label: HMG-CoA Reductase Inhibitor
        therapeutic_modality: SMALL_MOLECULE
        notes: No disease-modifying pharmacotherapy for the corneal lesion exists. Restoring HMGCR ERAD
          or correcting UBIAD1 ER retention are plausible future targets but remain at the preclinical
          stage.
      selected_evidence:
        snippet: These findings have important implications not only for the understanding of SCD etiology
          but also for the efficacy of cholesterol-lowering statin therapy, which becomes limited, in
          part, because of UBIAD1-mediated inhibition of reductase ERAD.
        supports: SUPPORT
