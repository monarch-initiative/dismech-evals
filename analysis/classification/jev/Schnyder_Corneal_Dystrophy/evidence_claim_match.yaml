      assertion:
        name: Impaired Menaquinone-4 Synthesis
        description: 'UBIAD1 is the human menaquinone-4 (vitamin K2) biosynthetic enzyme, prenylating
          vitamin K precursors using GGpp. SCD-associated variants have reduced MK-4 synthetic activity,
          plausibly through reduced GGpp affinity. The contribution of this arm to corneal disease is
          uncertain and is curated as an alternative rather than the canonical mechanism: SCD patients
          do not show the phenotypes expected from MK-4 or vitamin-K-dependent carboxylation deficiency,
          and per-variant MK-4 activity does not track with clinical severity. A vitamin-K readout is
          nonetheless measurably abnormal in SCD keratocytes and plasma.'
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        biological_processes:
