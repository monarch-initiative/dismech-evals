        context: []
      assertion_type: AnimalModel
      assertion:
        name: Ubiad1 N100S knock-in mouse
        species: Mus musculus
        genotype: Ubiad1 N100S point-mutation knock-in (heterozygous and homozygous)
        category: CRISPR/Cas9 knock-in mouse model of the human N102S hotspot variant
        genes:
        - preferred_term: UBIAD1
          term:
            id: hgnc:30791
            label: UBIAD1
        description: CRISPR/Cas9 knock-in of the mouse equivalent of the human N102S hotspot variant.
          Heterozygotes and homozygotes develop hyper-reflective anterior corneal deposits, but, unlike
          the human disease and unlike the G184R line, no difference in corneal cholesterol was detectable
          by filipin staining or lipidomics. Instead the model shows abnormal mitochondrial morphology
          and altered glycerophosphoglycerol metabolism, which the authors attribute to species differences
          in cholesterol metabolism. This divergence is curated as a human/model mismatch rather than
          as evidence against the cholesterol mechanism.
        modeled_mechanisms:
        - target: Corneal Cholesterol and Phospholipid Deposition
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: The hotspot-equivalent knock-in reproduces anterior corneal deposits but not the
            corneal cholesterol excess that defines this node in humans.
          limitations: Hyper-reflective anterior corneal deposits form, but no difference in corneal cholesterol
            was detectable between genotypes by filipin staining or lipidomic analysis; the authors attribute
            this to species differences in cholesterol metabolism. This divergence is the structural signal
            behind the human/model mismatch discussion curated in this entry.
          readouts:
          - name: Hyper-reflective anterior corneal deposits on in vivo confocal microscopy
            target: Corneal Cholesterol and Phospholipid Deposition
            direction: INCREASED
            interpretation: Deposit formation is recapitulated, supporting the partial match.
          - name: Corneal cholesterol level by filipin staining and lipidomics
            target: Corneal Cholesterol and Phospholipid Deposition
            direction: UNCHANGED
            interpretation: 'A genuine negative result: the cholesterol component of this node is not
              reproduced in this model.'
        associated_phenotypes:
        - Hyper-reflective anterior corneal deposits
        - Abnormal mitochondrial morphology in corneal epithelial, stromal, and endothelial cells
      selected_evidence:
        snippet: Unexpectedly, we did not find a difference in the corneal cholesterol level between different
          genotypes by filipin staining or lipidomic analysis.
        supports: SUPPORT
