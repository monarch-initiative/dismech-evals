        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mk4_versus_hmgcr_arm
        kind: CONTROVERSY
        prompt: Does impaired menaquinone-4 synthesis contribute to corneal disease in Schnyder corneal
          dystrophy, or is blocked HMGCR ERAD sufficient to explain the phenotype?
        attaches_to:
        - pathophysiology#Impaired Menaquinone-4 Synthesis
        - pathophysiology#Blocked Sterol-Accelerated HMGCR ERAD
        rationale: 'Both arms are demonstrably abnormal in SCD, but they make different predictions. The
          HMGCR arm predicts corneal sterol accumulation and is confirmed in knock-in mice. The MK-4 arm
          predicts vitamin-K-dependent deficits, and SCD patients do have elevated inactive matrix Gla
          protein, yet they lack the systemic phenotypes of MK-4 or VKD-carboxylation deficiency, and
          MK-4 activity per variant does not track severity (the hotspot N102S retains most of its activity).
          Resolving this matters therapeutically: if the MK-4 arm contributes, vitamin K2 supplementation
          becomes a candidate intervention; if not, only the ERAD axis is worth targeting.'
        status: OPEN
      selected_evidence:
        snippet: However, the G186R mutation significantly affected both MK-4 biosynthesis and VKD carboxylation.
          Other mutations exhibit varying degrees of effects on MK-4 biosynthesis and VKD carboxylation.
        supports: SUPPORT
