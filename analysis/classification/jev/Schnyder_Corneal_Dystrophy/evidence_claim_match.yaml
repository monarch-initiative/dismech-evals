  3d1c59dbe8dc45aec658d2d7212e3a45b4e8d9fb8931f35ebdc713256b6e66bf:
    claim:
      about:
        disease:
          name: Schnyder Corneal Dystrophy
          disease_term:
            preferred_term: Schnyder corneal dystrophy
            term:
              id: MONDO:0007374
              label: Schnyder corneal dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ER Sequestration of Mutant UBIAD1
        description: 'Wild-type UBIAD1 cycles between the ER and the medial-trans Golgi, with GGpp abundance
          acting as the switch: when GGpp is plentiful UBIAD1 is released from HMGCR and moves to the
          Golgi, and when GGpp falls UBIAD1 is trapped in the ER. SCD-associated UBIAD1 is constitutively
          trapped in the ER regardless of GGpp, mislocalizing the protein to the compartment where HMGCR
          resides. ER sequestration additionally shields the mutant protein from autophagy-mediated degradation,
          so it accumulates intracellularly and amplifies its own downstream effect.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        biological_processes:
        - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
          term:
            id: GO:0006888
            label: endoplasmic reticulum to Golgi vesicle-mediated transport
          modifier: DECREASED
        - preferred_term: protein retention in ER
          term:
            id: GO:0006621
            label: protein retention in ER lumen
