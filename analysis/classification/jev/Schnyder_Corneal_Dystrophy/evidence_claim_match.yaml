      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mk4_deficiency_model
        hypothesis_label: Impaired menaquinone-4 (vitamin K2) synthesis contributes to corneal disease
        status: ALTERNATIVE
        description: A competing/contributing model in which reduced UBIAD1 prenyltransferase output,
          i.e. loss of endogenous MK-4, is itself pathogenic for the cornea, consistent with evidence
          that vitamin K metabolism is active in human cornea and abnormal in SCD keratocytes. The main
          argument against it as the primary driver is that per-variant MK-4 activity does not correlate
          with SCD severity (the hotspot N102S retains most MK-4 activity), and SCD patients lack the
          systemic phenotypes expected from MK-4 or vitamin-K-dependent carboxylation deficiency.
      selected_evidence:
        snippet: In primary keratocytes from SCD patients, a highly increased MGP expression and presence
          of immature MGP forms were detected. Significantly elevated plasma concentration of inactive
          MGP was found in SCD patients.
        supports: SUPPORT
