        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Ex vivo 3D human corneal stroma model
        description: 'Long-term (over 3 months) 3D outgrowths of corneal stroma-derived mesenchymal stem-like
          cells from cadaveric explants spontaneously develop multilamellar bodies, the ultrastructural
          lesion associated with SCD. MLB abundance rises with autophagy induction (serum starvation,
          rapamycin) and falls with autophagy inhibition (3-methyladenine), making the system a tractable
          platform for testing autophagy-directed intervention. It is a phenocopy model: the cells carry
          no UBIAD1 variant, so it models the lesion rather than the genetic cause.'
        experimental_model_type: PRIMARY_CELL_CULTURE
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        publication: PMID:28872183
        modeled_mechanisms:
        - target: Corneal Cholesterol and Phospholipid Deposition
      selected_evidence:
        snippet: TEM confirmed the presence of MLBs in the long-term (>3 months) 3D cultures, which became
          more abundant under starvation and RAP treatment, and decreased in number under autophagy inhibition
          with 3-MA.
        supports: SUPPORT
