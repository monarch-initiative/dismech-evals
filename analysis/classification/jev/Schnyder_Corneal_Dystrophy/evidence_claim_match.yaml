            preferred_term: Schnyder corneal dystrophy
            term:
              id: MONDO:0007374
              label: Schnyder corneal dystrophy
        context: []
      assertion_type: Genetic
      assertion:
        name: UBIAD1
        gene_term:
          preferred_term: UBIAD1
          term:
            id: hgnc:30791
            label: UBIAD1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: UBIAD1 (UbiA prenyltransferase domain containing 1, 1p36.22, formerly TERE1) is the
          sole established SCD gene. Disease-causing alleles are heterozygous missense substitutions clustered
          in the prenyltransferase domain and adjacent transmembrane helices; more than 20 are known.
          p.Asn102Ser is a recurrent hotspot found in unrelated European and Asian families rather than
          a single founder haplotype. Genotype-phenotype correlation is generally absent, with the notable
          exception of p.Thr175Ile, which produces prominent diffuse haze typically without crystals.
          Several variants (including p.Thr120Arg) fall in the FARM motif, underlining its importance.
          The gene has two coding exons, so Sanger sequencing is an adequate diagnostic strategy.
      selected_evidence:
        snippet: The results suggest that N102S may be a mutation hot spot because the affected families
          were unrelated including Caucasian and Asian individuals.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
