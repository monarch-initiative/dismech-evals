    claim:
      about:
        disease:
          name: Schnyder Corneal Dystrophy
          disease_term:
            preferred_term: Schnyder corneal dystrophy
            term:
              id: MONDO:0007374
              label: Schnyder corneal dystrophy
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Crystalline and lipid keratopathies
        description: 'Crystal-forming corneal disorders and systemic lipid-metabolism disorders with corneal
          opacification. The crystal-free half of SCD patients is where misdiagnosis concentrates: bilateral
          central corneal haze with premature arcus in a young adult, with or without a family history,
          should prompt UBIAD1 testing.'
        distinguishing_features:
        - SCD is autosomal dominant with an age-predictable sequence of central haze, then arcus lipoides
          in the third decade, then midperipheral haze, and a characteristically spared corneal endothelium.
        - LCAT deficiency, fish-eye disease, and Tangier disease are autosomal recessive and are accompanied
          by characteristic systemic lipoprotein abnormalities.
        - Cystinosis and tyrosinemia have systemic (renal, hepatic, dermatologic) features absent in SCD.
        - Paraproteinemic crystalline keratopathy accompanies multiple myeloma or monoclonal gammopathy,
          detectable on serum and urine protein electrophoresis.
        - Infectious crystalline keratopathy is typically unilateral and follows corneal surgery or chronic
          topical corticosteroid use.
      selected_evidence:
        snippet: Diseases of systemic lipid metabolism that cause corneal opacification, such as lecithin-cholesterol
          acyltransferase deficiency, fish eye disease and Tangier disease, should also be considered
          although these are autosomal recessive disorders.
        supports: SUPPORT
    origin:
