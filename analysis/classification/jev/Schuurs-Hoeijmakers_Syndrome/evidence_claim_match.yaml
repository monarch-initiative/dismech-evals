      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Cranial Neural Crest Specification and Migration
        biological_scale: CELLULAR
        description: In zebrafish embryos, mRNA encoding the mutant PACS1 induces craniofacial cartilage
          defects, most likely in a dominant-negative fashion, through aberrant specification and migration
          of SOX10-positive cranial neural crest cells, while enteric neural crest is spared. In transfected
          cells the mutant protein forms cytoplasmic aggregates with increased stability. This is the
          proposed basis of the facial gestalt. The model is overexpression of human mRNA in fish, and
          the result predates the HDAC6 mechanism; how the two connect has not been tested.
        cell_types:
        - preferred_term: neural crest cell
          term:
            id: CL:0011012
            label: neural crest cell
        biological_processes:
        - preferred_term: neural crest cell migration
          term:
            id: GO:0001755
            label: neural crest cell migration
          modifier: ABNORMAL
      selected_evidence:
        snippet: Furthermore, consistent with the human pathology, expression of mutant PACS1 mRNA in
          zebrafish embryos induces craniofacial defects most likely in a dominant-negative fashion. This
          phenotype is driven by aberrant specification and migration of SOX10-positive cranial, but not
          enteric, neural-crest cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
