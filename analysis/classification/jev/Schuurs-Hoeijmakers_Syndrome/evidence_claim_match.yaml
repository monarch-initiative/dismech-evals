  0c550abd62aad237e0a078d501b03977470964c8f9f7e2400dcd4ef2b6733132:
    claim:
      about:
        disease:
          name: Schuurs-Hoeijmakers Syndrome
          disease_term:
            preferred_term: Schuurs-Hoeijmakers syndrome
            term:
              id: MONDO:0014006
              label: Schuurs-Hoeijmakers syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PACS1 Arg203 Gain-of-Function Substitution
        biological_scale: MOLECULAR
        description: The recurrent c.607C>T p.(Arg203Trp) substitution, and the rarer p.(Arg203Gln) at
          the same residue, lie in the furin-binding region (FBR, residues 101-273) of PACS1. NMR of the
          FBR shows that a central unstructured segment of PACS1 folds back across the FBR and contacts
          a positively charged loop that contains Arg203; this intramolecular contact restrains the PACS1-HDAC6
          interaction, and the tryptophan substitution disrupts it. The allele is therefore a gain of
          function. Consistent with this, a three-generation family heterozygous for a deletion of PACS1
          exons 12-24 lacked the facial gestalt, intellectual disability and brain anomalies of the syndrome.
        genes:
        - preferred_term: PACS1
          term:
            id: hgnc:30032
            label: PACS1
        genetic_context:
          variant_origin: DE_NOVO
          functional_impact_category: GAIN_OF_FUNCTION
          zygosity: HETEROZYGOUS
      selected_evidence:
        snippet: This pathogenic mutation lies on a solvent-exposed surface of the FBR and does not disrupt
          complex formation. Instead, Pacs1-R203W remains dependent on Wdr37 for stability and its levels
          can be reduced through targeted Wdr37 proteolytic degradation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/3
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41279321
      reference_title: The Structural Basis for Pacs1-Wdr37 Complex Assembly and Stability.
      evidence_source: IN_VITRO
      explanation: Cryo-EM of the Pacs1-Wdr37 complex places Arg203 on a solvent-exposed surface of the
        FBR, so the variant leaves the WDR37 complex intact rather than destabilizing PACS1.
