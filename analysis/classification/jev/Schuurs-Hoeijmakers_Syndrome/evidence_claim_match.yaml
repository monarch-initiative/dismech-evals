        biological_scale: CELLULAR
        description: 'PACS1 binds cytoplasmic dynein-1 heavy chain and is needed to keep furin at the
          trans-Golgi network. The PACS1 Arg203Trp-HDAC6 complex recruits the dynein adaptor BICD2, and
          the result is a dynein loss-of-function phenotype: cargo motility assays show reduced dynein
          initiation frequency and velocity, which HDAC6 inhibition or the dynein regulator Lis1 rescues.
          This places the syndrome among microtubule trafficking disorders.'
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: microtubule-based transport
          term:
            id: GO:0099111
            label: microtubule-based transport
          modifier: DECREASED
      selected_evidence:
        snippet: We demonstrate that PACS1R203W-HDAC6 recruits the adaptor BICD2, forming a complex that
          disperses the Golgi and impairs dynein function. Cargo motility assays revealed that PACS1R203W
          reduces dynein initiation frequency and velocity, defects rescued by HDAC6 inhibition or by
          expressing the dynein regulator Lis1.
        supports: SUPPORT
