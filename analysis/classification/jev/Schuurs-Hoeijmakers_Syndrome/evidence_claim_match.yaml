          oligonucleotides against PACS1 or HDAC6, or HDAC6 inhibitors, restore neuronal structure and
          synaptic transmission. The increased arborization was not seen in isogenic human iPSC-derived
          cortical neurons, whose deficit was in network activity instead, so the dendritic branching
          component is not settled across model systems.
