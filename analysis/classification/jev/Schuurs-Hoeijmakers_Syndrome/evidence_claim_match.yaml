          term:
            id: GO:0042903
            label: tubulin deacetylase activity
          modifier: INCREASED
      selected_evidence:
        snippet: Here, we use patient cells and PACS1 syndrome mice to show that PACS1 (or PACS-1) is
          an HDAC6 effector and that the R203W substitution increases the PACS1/HDAC6 interaction, aberrantly
          potentiating deacetylase activity.
        supports: SUPPORT
