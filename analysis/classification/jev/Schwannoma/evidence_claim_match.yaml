        description: Merlin normally restrains growth by controlling contact-dependent inhibition of proliferation.
          At cell-to-cell contact merlin limits the delivery and membrane accumulation of growth factor
          receptors. Loss of merlin removes this brake, so Schwann cells continue proliferating despite
          confluence — the permissive state for schwannoma formation.
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
