      - /disease_term
    evidence_metadata:
      reference: PMID:12544097
      reference_title: 'Neuroblastoma-like schwannoma: a case report and review of the literature.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: A later single-case report by different authors describes a schwannoma composed predominantly
        of small cells arranged in rosettes around central collagenous cores, corroborating the collagen-core
        rosette pattern outside the original three-case series. The quoted sentence does not describe
        the cells as round, hyperchromatic Schwann cells with scant cytoplasm, does not call the rosettes
        giant, does not mention perivascular rosettes and does not mention neuroblastoma, so it supports
        only the small-cell, collagen-core rosette part of the claim; the abstract's next sentence, cited
        separately below, names neuroblastoma as a differential diagnosis.
