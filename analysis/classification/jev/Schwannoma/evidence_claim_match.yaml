          term:
            id: NCIT:C207079
            label: Neuroblastoma-Like Schwannoma
        description: 'A rare, benign histological variant of schwannoma, first described in 1994, characterized
          by small round cells that surround collagenous cores to form rosette-like structures; histologically
          it mimics a malignant small round cell tumor. A 2010 case report and literature review describes
          it as sporadic, with no reported association with neurofibromatosis. A 2003 case report and
          literature review states that it must be differentiated from neuroblastoma, peripheral neuroectodermal
          tumors and malignant change in a schwannoma. In the original three-case series the tumors closely
          resembled neuroblastoma because they were made up predominantly of small, round, hyperchromatic
          Schwann cells with scant cytoplasm, which formed perivascular rosettes in one case and giant
          rosettes with central collagen cores in the others. A neuroblastic tumor was seriously considered
          in every case, and the diagnosis of schwannoma was substantiated by focal areas of conventional
          schwannoma and by the typical immunophenotypic profile: all three tumors strongly and diffusely
          expressed S-100 protein but lacked neurofilament protein, protein gene product (PGP) and synaptophysin.'
      selected_evidence:
        snippet: Neuroblastoma-like schwannoma is an extremely rare histological variant of schwannoma,
          which histologically mimics a malignant small round cell tumor. Only 19 cases have been reported
          in the literature to date.
        supports: SUPPORT
        directness: DIRECT
