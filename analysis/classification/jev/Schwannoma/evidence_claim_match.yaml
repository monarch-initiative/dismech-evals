    evidence_metadata:
      reference: PMID:19922484
      reference_title: 'Cutaneous neuroblastoma-like schwannoma: a report of two cases, one with a plexiform
        pattern, and a review of the literature.'
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      explanation: 'This sentence characterizes the variant as a whole rather than any single tumor: a
        benign, sporadic neoplasm with no reported association with neurofibromatosis, made up of small
        round lesional cells that surround collagenous cores to form rosette-like structures. It is cited
        for that variant-level histology and for the benign, sporadic character. The statement that no
        association with neurofibromatosis has been reported describes the literature as of this 2010
        review. The sentence belongs to the abstract''s introductory framing, which restates the established
        picture of the entity before the authors present their own two cases. It does not call the cells
        hyperchromatic Schwann cells with scant cytoplasm, does not call the rosettes giant and does not
        mention perivascular rosettes; those details describe the original series and rest on PMID:8116794.'
