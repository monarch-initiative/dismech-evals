    evidence_metadata:
      reference: PMID:8116794
      reference_title: Neuroblastoma-like neurilemoma.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'The three-case series in which Goldblum and colleagues first described this variant
        (neurilemoma is a synonym of schwannoma) reports tumors that closely resembled neuroblastoma because
        they were made up mostly of small, round, hyperchromatic Schwann cells with scant cytoplasm. These
        cells formed perivascular rosettes in one case and giant rosettes with central collagen cores
        in the others. The resemblance is histological: the same abstract says the schwannoma diagnosis
        was substantiated by focal areas of conventional schwannoma and by the immunophenotype. All three
        tumors were in superficial soft tissue, so the quote supports the histology only, not a site or
        a frequency.'
