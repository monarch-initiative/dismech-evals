      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: This is the primary immunohistochemistry result of Goldblum and colleagues' three-case
        series (palm, posterior neck and flank tumors). Every tumor was strongly and diffusely S-100 positive
        and negative for neurofilament protein, PGP and synaptophysin. The authors state that this typical
        immunophenotypic profile, together with focal areas of conventional schwannoma, substantiated
        the diagnosis of schwannoma, although a neuroblastic tumor had been seriously considered in every
        case. The result describes these three tumors, not every later case of the variant.
