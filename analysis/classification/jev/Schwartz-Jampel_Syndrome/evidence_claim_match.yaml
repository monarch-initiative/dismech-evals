              of HSPG2 are the initiating lesion. Two molecularly distinct routes reduce the amount of
              functional perlecan reaching the extracellular space: truncating alleles destabilize HSPG2
              mRNA through nonsense-mediated decay, while missense alleles affecting cysteine residues
              cause intracellular retention of the mutant core protein by ER quality control. Crucially,
              these are hypomorphic rather than null alleles — the same gene''s functional null alleles
              cause dyssegmental dysplasia, Silverman-Handmaker type.'
