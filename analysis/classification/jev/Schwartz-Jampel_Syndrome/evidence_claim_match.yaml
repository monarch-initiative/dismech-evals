          cassette?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#HSPG2 Hypomorphic Variation
        - pathophysiology#Chondrodysplasia and Skeletal Deformity
        - animal_models#Perlecan C1532Y point-mutation-only mouse
        rationale: The knock-in series separates the missense change from the transcriptional down-regulation
          supplied by the retained Neo cassette. Only the down-regulated line reproduces SJS, which led
          the authors to question whether C1532Y is the sole causative factor in the human family. Two
          readings remain open — that the human allele carries an additional transcriptional effect the
          mouse construct does not reproduce, or that mouse tolerates a perlecan level that human does
          not — and they imply different things about how faithfully hypomorphic-allele mouse models can
          be used to rank SJS variant severity.
        proposed_experiments:
        - experiment_id: sjs_c1532y_family_expression_reanalysis
          experiment_design: TARGETED_PERTURBATION
          name: Re-sequencing and expression analysis of the original C1532Y family
          description: Determine HSPG2 transcript level and search for a second cis-acting regulatory
            variant in the family carrying C1532Y, to test whether the human genotype includes a transcriptional
            component absent from the mouse knock-in.
      selected_evidence:
        snippet: These studies question the C1532Y mutation as the sole causative factor of SJS in the
          human family harboring this alteration and imply that transcriptional changes leading to perlecan
          reduction may represent the disease mechanism for SJS.
        supports: SUPPORT
