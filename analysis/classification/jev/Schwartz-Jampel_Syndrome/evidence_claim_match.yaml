      assertion_type: Phenotype
      assertion:
        category: Neuromuscular
        name: Skeletal Muscle Hypertrophy
        description: 'Increased muscle bulk, not attributable to training, and part of the cardinal SJS
          presentation alongside the myotonia and stiffness. The same source offers two non-exclusive
          mechanistic accounts, both curated here: a consequence of the sustained neuromuscular hyperactivity,
          and a fibre-type-specific signalling effect of the perlecan deficit itself (reduced myostatin
          restraint in fast-twitch muscle). Global hypertrophy in a genetically confirmed patient was
          observed to regress over follow-up.'
        phenotype_term:
          preferred_term: Skeletal muscle hypertrophy
          term:
            id: HP:0003712
            label: Skeletal muscle hypertrophy
      selected_evidence:
        snippet: In addition, perlecan deficiency causes hypertrophy in fast-twitch muscles by reducing
          myostatin signaling (1) and also can cause atrophy in the slow-twitch muscles, possibly through
          disinhibition of autophagy related to reduced Akt/mTORC1 signaling (2).
        supports: SUPPORT
