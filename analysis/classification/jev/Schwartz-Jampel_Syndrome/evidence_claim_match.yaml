      assertion_type: Pathophysiology
      assertion:
        name: Endplate Acetylcholinesterase Deficiency
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: Perlecan tethers acetylcholinesterase in the synaptic basal lamina of the neuromuscular
          junction. In SJS the postsynaptic apparatus is structurally well formed, but synaptic AChE is
          deficient, so acetylcholine released at the endplate is cleared too slowly and its action is
          prolonged. This is a synapse-specific consequence of the same basement-membrane perlecan deficit,
          and is the mechanism that distinguishes SJS from the muscle chloride- and sodium-channel myotonias.
        locations:
        - preferred_term: neuromuscular junction
          term:
            id: GO:0031594
            label: neuromuscular junction
        molecular_functions:
        - preferred_term: acetylcholinesterase activity
