      assertion_type: Pathophysiology
      assertion:
        name: Fiber-Type-Specific Myostatin and Akt-mTORC1 Dysregulation
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: A signalling account of the muscle-bulk changes in perlecan deficiency that is separate
          from, and potentially additive to, the neuromuscular-hyperactivity account of hypertrophy. Perlecan
          is a myostatin-binding basement-membrane proteoglycan, so its loss reduces myostatin (TGF-beta
          family) growth restraint and drives hypertrophy selectively in fast-twitch muscle; in slow-twitch
          muscle the same deficit is associated instead with reduced Akt/mTORC1 signalling and disinhibited
          autophagy, producing atrophy. The entry records this as PROVISIONAL and the atrophy arm explicitly
          as hypothesised, because the source itself hedges the Akt/mTORC1-autophagy limb ("possibly through")
          and because the fibre-type dissection rests on mouse work rather than on SJS patient muscle.
          Curated so the entry does not silently assert only the weaker of the two available explanations
          for the Skeletal Muscle Hypertrophy phenotype.
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: myostatin (TGF-beta family) receptor signaling
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: DECREASED
        - preferred_term: Akt/mTORC1 signaling in slow-twitch muscle
          term:
            id: GO:0043491
            label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
          modifier: DECREASED
        - preferred_term: TOR signaling
          term:
            id: GO:0031929
            label: TOR signaling
          modifier: DECREASED
        - preferred_term: autophagy (disinhibited in slow-twitch muscle)
          term:
            id: GO:0006914
            label: autophagy
          modifier: INCREASED
        notes: 'Deliberately NOT wired downstream to Continuous Muscle Fiber Hyperactivity: this is a
          parallel, activity-independent route to altered muscle bulk, and collapsing the two would assert
          a causal ordering the source does not make.'
      selected_evidence:
        snippet: In addition, perlecan deficiency causes hypertrophy in fast-twitch muscles by reducing
          myostatin signaling (1) and also can cause atrophy in the slow-twitch muscles, possibly through
          disinhibition of autophagy related to reduced Akt/mTORC1 signaling (2).
        supports: SUPPORT
