        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sjs_ache_sufficiency_gap
        prompt: Is endplate acetylcholinesterase deficiency sufficient to generate the spontaneous muscle
          activity of Schwartz-Jampel syndrome, or are additional perlecan-dependent changes required?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Endplate Acetylcholinesterase Deficiency
        - pathophysiology#Distal Peripheral Nerve Hyperexcitability and Junctional Remodeling
        rationale: 'The mouse model that established the endplate AChE deficiency in vivo also showed
          that the deficiency alone did not produce resting spontaneous EMG activity in the diaphragm,
          so the causal chain from AChE loss to continuous muscle hyperactivity is necessary-but-not-obviously-sufficient.
          The human biopsy study points to a combination of synaptic AChE deficiency, preterminal amyelination
          and junctional remodeling acting synergistically. Which of those is rate-limiting is unresolved,
          and it matters therapeutically: an AChE-directed strategy would only help if that arm dominates.'
        proposed_experiments:
        - experiment_id: sjs_nmj_perlecan_restoration
          name: Muscle-specific perlecan restoration in the SJS mouse
          description: Restore synaptic perlecan (and hence endplate AChE) selectively at the neuromuscular
            junction in the C1532Yneo line and test whether spontaneous EMG activity resolves without
            correcting preterminal myelination.
      selected_evidence:
        snippet: However, physiological endplate AChE deficiency was not associated with spontaneous activity
          at rest on EMG in the diaphragm, suggesting that additional changes are required to generate
          such activity characteristic of SJS.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
