        context:
        - path: /pathophysiology/0
          value:
            name: HSPG2 Hypomorphic Variation
            biological_scale: MOLECULAR
            mechanism_confidence: ESTABLISHED
            description: 'Biallelic partial loss-of-function variants distributed across the 97 exons
              of HSPG2 are the initiating lesion. Two molecularly distinct routes reduce the amount of
              functional perlecan reaching the extracellular space: truncating alleles destabilize HSPG2
              mRNA through nonsense-mediated decay, while missense alleles affecting cysteine residues
              cause intracellular retention of the mutant core protein by ER quality control. Crucially,
              these are hypomorphic rather than null alleles — the same gene''s functional null alleles
              cause dyssegmental dysplasia, Silverman-Handmaker type.'
            genes:
            - preferred_term: HSPG2
              term:
                id: hgnc:5273
                label: HSPG2
            genetic_context:
              gene:
                preferred_term: HSPG2
                term:
                  id: hgnc:5273
                  label: HSPG2
              variant_origin: GERMLINE
              zygosity: HOMOZYGOUS
              functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
              description: Homozygous or compound heterozygous hypomorphic germline HSPG2 alleles; compound
                heterozygosity is common because almost all reported mutations are private.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Reduced Perlecan Secretion into Basement Membranes
        causal_link_type: DIRECT
        description: Both truncating (NMD) and cysteine-missense (intracellular retention) alleles converge
          on less perlecan being secreted.
      selected_evidence:
        snippet: truncating mutations resulted in instability of HSPG2 mRNA through nonsense mRNA-mediated
          decay, whereas missense mutations involving cysteine residues led to intracellular retention
          of perlecan, probably due to quality control pathways
        supports: SUPPORT
