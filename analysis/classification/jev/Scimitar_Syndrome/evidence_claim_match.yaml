        description: A mass of non-functioning lung tissue with anomalous systemic arterial supply and
          no normal connection with the tracheobronchial tree. Intralobar sequestration shares features
          with scimitar syndrome including systemic arterial supply, but lacks the anomalous pulmonary
          venous drainage to the IVC that defines scimitar syndrome. The two conditions may coexist.
        disease_term:
          preferred_term: congenital pulmonary sequestration
          term:
