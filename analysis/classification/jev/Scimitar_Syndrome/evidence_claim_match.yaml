      assertion_type: Genetic
      assertion:
        name: Genetic underpinnings
        association: Unknown
        notes: The genetic basis of scimitar syndrome remains largely unknown. It is typically sporadic.
          In one cohort study, genetic testing revealed an underlying diagnosis in roughly 40% of those
          tested by chromosomal microarray or whole-exome sequencing. STRC and CATSPER2 have been tentatively
          suggested as possible contributors but causal roles are unconfirmed. Extracardiac anomalies
          are present in 96% of cases, and chromosomal microarray plus whole-exome sequencing is recommended
          for patients with extracardiac defects.
      selected_evidence:
        snippet: A molecular genetic diagnosis was made in 7 of 18 cases (39% of those tested). Ninety-six
          per cent of the cohort had some type of extracardiac finding, with 43% having asthma and 20%
          having a gastrointestinal pathology.
        supports: SUPPORT
    origin:
