  8b9b88882e478d84f0bd74688a23762f7c5b1402435b0b62637f776757c202b0:
    claim:
      about:
        disease:
          name: Scimitar Syndrome
          disease_term:
            preferred_term: scimitar syndrome
            term:
              id: MONDO:0015987
              label: scimitar syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ipsilateral right lung and vascular bed hypoplasia
        description: The right lung is hypoplastic in most cases, ranging from mild volume reduction to
          severe underdevelopment with only one or two lobes. Right lung hypoplasia reduces the volume
          of blood flow through the anomalous circuit, which may paradoxically limit the hemodynamic impact
          of the left-to-right shunt. The hypoplasia results in dextroposition of the heart (shifting
          of the mediastinum to the right) rather than true dextrocardia. Right pulmonary artery hypoplasia
          frequently accompanies lung hypoplasia, further reducing the pulmonary vascular bed.
        locations:
        - preferred_term: Right lung
          term:
            id: UBERON:0002167
            label: right lung
        biological_processes:
        - preferred_term: Right lung morphogenesis
          term:
            id: GO:0060461
            label: right lung morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: Associated cardiac and extracardiac defects, particularly hypoplasia of the right lung,
          are present in up to three-quarters of cases.
        supports: SUPPORT
    origin:
