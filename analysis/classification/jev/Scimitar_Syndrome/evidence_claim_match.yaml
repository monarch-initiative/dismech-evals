        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Embryologic developmental disruption
        description: The anomalies in scimitar syndrome arise from disrupted cardiopulmonary embryogenesis
          during the fourth to fifth week of gestation. Faulty incorporation of the common pulmonary vein
          into the left atrium results in the anomalous venous drainage, while abnormal branching morphogenesis
          of the right lung bud produces ipsilateral pulmonary hypoplasia. Aberrant systemic arterial
          connections and bronchopulmonary sequestration reflect concurrent errors in vascular patterning.
          The exact triggers are unknown, and no consistent environmental teratogenic exposure has been
          identified. The condition is typically sporadic.
        biological_processes:
        - preferred_term: Lung development
          term:
            id: GO:0030324
            label: lung development
          modifier: ABNORMAL
        - preferred_term: Pulmonary vein morphogenesis
          term:
            id: GO:0060577
            label: pulmonary vein morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: In this article, we review the historical aspects, presentation, and pathophysiology
          of Scimitar syndrome and discuss available treatment strategies.
        supports: SUPPORT
    origin:
