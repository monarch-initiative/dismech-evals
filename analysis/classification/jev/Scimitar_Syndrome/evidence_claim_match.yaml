      assertion_type: DifferentialDiagnosis
      assertion:
        name: Isolated partial anomalous pulmonary venous return
        description: Non-scimitar forms of partial anomalous pulmonary venous return (PAPVR), where pulmonary
          veins drain to the right atrium, superior vena cava, or innominate vein rather than the IVC.
          These lack the characteristic scimitar vein course along the right heart border and are not
          typically associated with right lung hypoplasia or systemic arterial supply anomalies.
        disease_term:
          preferred_term: congenital pulmonary venous return anomaly
          term:
            id: MONDO:0017705
            label: congenital pulmonary venous return anomaly
        distinguishing_features:
        - Anomalous vein drains to SVC, right atrium, or innominate vein rather than IVC
        - Absence of scimitar sign on chest radiograph
        - Right lung typically normal in size
        - No systemic arterial supply to lung
      selected_evidence:
        snippet: Scimitar syndrome is a rare vascular anomaly that can manifest in childhood with signs
          of right heart failure and/or recurrent pneumonia. When asymptomatic, this anomaly can be accidentally
          discovered in adulthood and should be suspected in cases of left-to-right shunt without evidence
          of obvious cardiac structural defects.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
