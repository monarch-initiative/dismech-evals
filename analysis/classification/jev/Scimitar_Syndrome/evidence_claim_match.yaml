              label: scimitar syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pulmonary hypertension pathogenesis
        description: Pulmonary hypertension in scimitar syndrome arises from multiple converging factors.
          The left-to-right shunt from anomalous venous drainage produces pulmonary overcirculation; right
          lung hypoplasia reduces the pulmonary vascular bed; anomalous systemic arterial supply adds
          high-pressure systemic inflow; and stenosis or obstruction of the scimitar vein elevates post-capillary
          pressure. These factors drive vascular remodeling including endothelial dysfunction and smooth
          muscle cell hypertrophy in small pulmonary arteries. Pulmonary hypertension is the major determinant
          of prognosis, especially in infants.
        cell_types:
        - preferred_term: Blood vessel endothelial cell
          term:
            id: CL:0000071
            label: blood vessel endothelial cell
        - preferred_term: Blood vessel smooth muscle cell
          term:
            id: CL:0019018
            label: blood vessel smooth muscle cell
      selected_evidence:
        snippet: PH, CHD, neonatal SS diagnosis, ECMO support, and markedly elevated scimitar vein pressure
          are associated with mortality.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
