  5151d928e1af596d0c04ecd233bf0a264f2c921021584629389a5ff5e3bdeed9:
    claim:
      about:
        disease:
          name: Scimitar Syndrome
          disease_term:
            preferred_term: scimitar syndrome
            term:
              id: MONDO:0015987
              label: scimitar syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Surgical repair
        description: Surgical correction involves reimplantation or baffling of the anomalous pulmonary
          vein to the left atrium. Various techniques include direct reimplantation, creation of an intracardiac
          baffle, or newer multipatch techniques. Indicated for significant left-to-right shunting (Qp:Qs
          > 1.5-2.0), recurrent infections, or pulmonary hypertension. Postoperative pulmonary vein obstruction
          is a significant complication, occurring in up to 45-50% of cases with traditional techniques.
        context: Significant hemodynamic shunt with or without associated defects
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: surgical procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        target_phenotypes:
        - preferred_term: Partial anomalous pulmonary venous return
          term:
            id: HP:0010773
            label: Partial anomalous pulmonary venous return
        - preferred_term: Congestive heart failure
          term:
            id: HP:0001635
            label: Congestive heart failure
        notes: Postoperative pulmonary vein obstruction remains a major challenge. Newer multipatch techniques
          that enlarge the left atrium and avoid circuitous pathways may reduce this complication. Infantile
          onset is an independent risk factor for stenosis after repair.
      selected_evidence:
        snippet: Overall operative mortality has been cited between 4.8% and 5.9%. Mortality was highest
          in patients with preoperative pulmonary hypertension, and those undergoing surgery in infancy.
          Despite timely surgical intervention, post-repair obstruction of the scimitar vein, intra-atrial
          baffle obstruction, or stenosis of the inferior caval vein were reported in up to two-thirds
          of cases.
        supports: SUPPORT
    origin:
