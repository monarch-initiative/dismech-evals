          value:
            name: Anomalous pulmonary venous drainage
            description: The hallmark of scimitar syndrome is partial or complete anomalous drainage of
              the right pulmonary veins into the inferior vena cava (IVC) rather than the left atrium.
              This creates a left-to-right shunt as oxygenated blood from the right lung is returned to
              the systemic venous circulation instead of the left heart. The anomalous vein typically
              drains into the IVC at or below the diaphragm, though supradiaphragmatic and hepatic vein
              drainage variants exist. The hemodynamic significance depends on the proportion of pulmonary
              venous drainage that is anomalous and the degree of associated right lung hypoplasia.
            locations:
