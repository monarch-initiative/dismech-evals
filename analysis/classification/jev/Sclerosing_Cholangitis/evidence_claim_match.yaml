      assertion_type: Genetic
      assertion:
        name: DCDC2
        gene_term:
          preferred_term: DCDC2
          term:
            id: hgnc:18141
            label: DCDC2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        subtype: Isolated neonatal sclerosing cholangitis
        association: 'Biallelic DCDC2 variants cause isolated neonatal sclerosing cholangitis (MONDO:0018816).
          DCDC2 is expressed in the primary cilium of cuboidal cholangiocytes; affected patients lose
          both the protein and the cilium, so the subtype is classified as a liver-based ciliopathy. Two
          independent series reported different allele classes with the same ciliary phenotype: protein-truncating
          variants in a series seen at King''s College Hospital, and biallelic missense variants or an
          in-frame deletion in the doublecortin domains in a second, independent series. Only the King''s
          College attribution is sourced - PMID:27469900''s full text states it - and no geography is
          asserted for the other series.'
        case_fractions:
        - population: Neonatal sclerosing cholangitis patients with available DNA at a single UK paediatric
            liver centre, selected for parental consanguinity at the exome-sequencing stage
          case_fraction_percent: 29.2
          cohort_size: 24
          notes: 7 of 24 patients (6 of 19 families); the percentage is that ratio expressed as a percentage,
            and the raw counts are in the quoted snippet. The exome-sequenced subgroup was chosen for
            consanguinity, so this share is not a population estimate for neonatal sclerosing cholangitis
            at large.
      selected_evidence:
        snippet: This data expands the molecular spectrum of NSC, that can be considered as a ciliopathy
          and also expands the clinical spectrum of the DCDC2 mutations, previously reported in dyslexia,
          deafness, and nephronophtisis.
        supports: SUPPORT
