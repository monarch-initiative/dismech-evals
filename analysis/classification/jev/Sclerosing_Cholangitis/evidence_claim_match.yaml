            subtype_term:
              preferred_term: neonatal ichthyosis-sclerosing cholangitis syndrome
              term:
                id: MONDO:0011874
                label: neonatal ichthyosis-sclerosing cholangitis syndrome
            genes:
            - preferred_term: CLDN1
              term:
                id: hgnc:2032
                label: CLDN1
            description: Syndromic neonatal form with sclerosing cholangitis and ichthyosis, caused by
              biallelic loss of function of the tight-junction protein claudin-1 (CLDN1). Also reported
              under the name ichthyosis, leukocyte vacuoles, alopecia and sclerosing cholangitis (ILVASC).
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Cholangiocyte Tight-Junction Failure
        description: In the syndromic neonatal form, biallelic CLDN1 variants remove claudin-1 from both
          liver and skin. Claudins are components of tight junctions, which in the liver separate bile
          flow from plasma, and the founding study proposes that lack of claudin-1 raises paracellular
          permeability between epithelial cells and that the bile-duct injury follows from its absence
          in cholangiocytes. That mechanism is the authors' proposal and is carried here with the same
          hedge. Claudin-1 is absent from skin as well as liver in affected patients, and this subtype
          is the one distinguished clinically by ichthyosis.
        biological_scale: CELLULAR
        subtypes:
        - Neonatal ichthyosis-sclerosing cholangitis syndrome
        genes:
        - preferred_term: CLDN1
          term:
            id: hgnc:2032
            label: CLDN1
        genetic_context:
          gene:
            preferred_term: CLDN1
            term:
              id: hgnc:2032
              label: CLDN1
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'Biallelic CLDN1 loss of function. `HOMOZYGOUS` is recorded here, unlike on the
            DCDC2 node above, because it is the state the sources report: PMID:37814412 states that most
            ILVASC cases described to date were attributed to homozygous truncating variants, and the
            founding report described a 2-bp deletion in exon 1 in inbred kindred, producing a premature
            stop codon and complete absence of claudin-1 protein. The later founder missense allele p.Arg81His
            segregates in North African Jewish families; the cited record does not state its zygosity,
            so the slot carries the modal reported state rather than a claim about every described case.'
        cell_types:
        - preferred_term: Cholangiocyte
          term:
            id: CL:1000488
            label: cholangiocyte
        cellular_components:
        - preferred_term: cholangiocyte tight junction
          term:
            id: GO:0005923
            label: bicellular tight junction
        biological_processes:
        - preferred_term: establishment of skin barrier
          term:
            id: GO:0061436
            label: establishment of skin barrier
          modifier: DECREASED
      selected_evidence:
        snippet: Lack of claudin-1 in NISCH syndrome may lead to increased paracellular permeability between
          epithelial cells. Bile duct injury may be related to the absence of claudin-1 expression in
          cholangiocytes.
        supports: SUPPORT
    origin:
