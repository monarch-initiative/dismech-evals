        context:
        - path: /has_subtypes/4
          value:
            name: Isolated neonatal sclerosing cholangitis
            subtype_term:
              preferred_term: isolated neonatal sclerosing cholangitis
              term:
                id: MONDO:0018816
                label: isolated neonatal sclerosing cholangitis
            genes:
            - preferred_term: DCDC2
              term:
                id: hgnc:18141
                label: DCDC2
            description: Neonatal sclerosing cholangitis without the syndromic ichthyosis component. Biallelic
              DCDC2 variants account for a substantial share of cases; the resulting loss of cholangiocyte
              primary cilia makes this subtype a liver-based ciliopathy rather than an immune-mediated
              cholangiopathy.
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Cholangiocyte Primary Cilium Loss
        description: In the isolated neonatal form, biallelic DCDC2 variants abolish DCDC2 protein, which
          is normally expressed in cholangiocyte cilia. Affected bile ducts lose not only the protein
          but the cilium itself, absent on both immunostaining for acetylated alpha-tubulin and transmission
          electron microscopy. What the cilium contributes to cholangiocyte function is not established
          by the sources cited here, so this node records the structural loss and the cholangiopathy that
          accompanies it rather than an intervening functional step. This is a monogenic route into cholangiopathy,
          distinct from the immune- and microbiome-driven mechanisms modeled for primary sclerosing cholangitis
          above.
        biological_scale: CELLULAR
        subtypes:
        - Isolated neonatal sclerosing cholangitis
        genes:
        - preferred_term: DCDC2
          term:
            id: hgnc:18141
            label: DCDC2
        genetic_context:
          gene:
            preferred_term: DCDC2
            term:
              id: hgnc:18141
              label: DCDC2
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'Homozygous or compound heterozygous DCDC2 variants. No `zygosity` is recorded:
            the slot is single-valued and has no biallelic value, and this node''s own cited quote reports
            four homozygous and two compound heterozygous patients, so naming either one would contradict
            the evidence. The series seen at King''s College Hospital found only protein-truncating alleles;
            a second, independent series reported biallelic missense variants and an in-frame deletion
            in the doublecortin domains, where the protein is mislocalized to the cytoplasm and absent
            from cilia rather than undetectable. Neither series'' geography is asserted here: PMID:27319779''s
            cached record carries no affiliation.'
        cell_types:
        - preferred_term: Cholangiocyte
          term:
            id: CL:1000488
            label: cholangiocyte
        cellular_components:
        - preferred_term: cholangiocyte primary cilium
          term:
