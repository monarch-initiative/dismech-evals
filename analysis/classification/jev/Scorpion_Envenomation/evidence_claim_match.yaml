  8e78abae5685df72f8b1f8b230886a16b76afdb313dc2537a28478a6cf04d011:
    claim:
      about:
        disease:
          name: Scorpion Envenomation
          disease_term:
            term:
              id: MONDO:0018755
              label: scorpion envenomation
            preferred_term: Scorpion envenomation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: which_autonomic_arm_kills
        kind: KNOWLEDGE_GAP
        prompt: Which arm of the autonomic storm actually produces the fatal cardiac dysfunction in human
          scorpion envenomation - the adrenergic one, or the IL-1R/PGE2-driven cholinergic one?
        attaches_to:
        - pathophysiology#Catecholamine-Mediated Myocardial Injury
        - pathophysiology#Excessive Vagal Acetylcholine Release at the Heart
        - mechanistic_hypotheses#adrenergic_catecholamine_storm
        - mechanistic_hypotheses#il1r_pge2_cholinergic_axis
        rationale: 'Both arms are real and both are measurable in the same envenomed animal - adrenaline
          and acetylcholine rise together. The question is which one the heart failure follows from, and
          the two answers point at opposite drugs. The canonical account is adrenergic, and prazosin''s
          clinical benefit is usually read as supporting it. The mouse account is cholinergic, and it
          is supported by something stronger than a correlation: IL-1R knockout, dexamethasone, atropine
          and vagotomy each abolish mortality, which is four interventions at three different points of
          one pathway.

          What makes this more than an academic dispute is that the two accounts prescribe differently.
          Under the canonical model an alpha-1 blocker treats the lethal mechanism; under the emerging
          one it treats a real but non-lethal arm while the fatal pathway runs untouched - including,
          the authors note, untouched by antivenom. A trial of early dexamethasone or of atropine in human
          envenomation would separate them; none has been done.

          Note also that the evidence is asymmetric in kind, not just in strength. The adrenergic account
          rests on human clinical observation and on a therapeutic response; the cholinergic one rests
          on mechanistic intervention in mice. Neither body of evidence is of the type that would refute
          the other.'
      selected_evidence:
        snippet: Adrenergic myocarditis, toxic myocarditis and myocardial ischemia are the 3 mechanisms
          that explain the cardiac dysfunction.
        supports: SUPPORT
