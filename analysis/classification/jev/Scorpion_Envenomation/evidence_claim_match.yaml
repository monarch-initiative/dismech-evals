  3bb51ffa19ad88aff4100e86f817c1579d96486e3082d91011b5553e310f71fa:
    claim:
      about:
        disease:
          name: Scorpion Envenomation
          disease_term:
            term:
              id: MONDO:0018755
              label: scorpion envenomation
            preferred_term: Scorpion envenomation
        context: []
      assertion_type: Treatment
      assertion:
        name: Atropine
        description: 'The drug the two hypotheses disagree about most sharply. In envenomed mice it is
          one of four interventions that abolish cardiac failure and death, and the emerging hypothesis
          predicts it should work. In human practice it is advised against for routine use - it blocks
          sweating, which children need for temperature regulation, and it potentiates the adrenergic
          arm the canonical hypothesis holds responsible. Both positions are curated here because the
          disagreement is the point: the same drug is protective or harmful depending on which arm is
          lethal.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: atropine
            term:
              id: CHEBI:16684
              label: atropine
        notes: 'The reason given against routine use is itself mechanistic and worth reading next to the
          pathograph: blocking the parasympathetic arm leaves the sympathetic one unopposed, which is
          the arm the canonical hypothesis says does the damage. So the human caution and the mouse result
          are not simply in conflict - they are what the two hypotheses each predict.'
      selected_evidence:
        snippet: However, these drugs can be useful in cases of severe bradycardia or complete atrioventricular
          block, which are sometimes observed.
        supports: SUPPORT
