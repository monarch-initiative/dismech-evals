        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: il1r_axis_is_mouse_only
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does the IL-1R/PGE2/acetylcholine axis shown in envenomed mice operate in human scorpion
          envenomation?
        attaches_to:
        - pathophysiology#Venom-Triggered Cardiac IL-1R Signaling and PGE2 Production
        - pathophysiology#Excessive Vagal Acetylcholine Release at the Heart
        - treatments#Early dexamethasone
        rationale: 'Every step of this pathway - the inflammasome-dependent IL-1 beta, the sustained PGE2,
          the EP2/EP4-mediated acetylcholine release, and the rescue by dexamethasone, atropine or vagotomy
          - was established in mice given Tityus serrulatus venom intraperitoneally at a defined lethal
          dose. That is a well-controlled demonstration and it is not a human result.

          Three specific reasons to hold the translation open. The route and dose are not those of a sting:
          an intraperitoneal bolus at 180 micrograms per kilogram is not a subcutaneous envenomation of
          uncertain quantity. The species is one whose venom has been studied in Brazil, while most of
          the world''s scorpion mortality is caused by other genera on other continents. And the human
          evidence that does exist for an inflammatory contribution is correlational - circulating IL-1
          beta separates patients with and without cardiac abnormality - which is consistent with the
          pathway being causal, with it being a marker of severity, and with both. Note that the same
          study found the pancreatic association statistically insignificant, so the human data support
          the cardiac half of the mouse account and not the pancreatic half, even though the paper''s
          title names both.

          This is filed as a model mismatch rather than a knowledge gap because the evidence is not absent:
          it exists, it is good, and what is open is whether it transfers. Resolving it needs a human
          study, and the obvious one - early dexamethasone against standard care - is also the one the
          mouse work proposes.'
      selected_evidence:
        snippet: PGE2 signaling via EP2/4 receptors mediates excessive ACh release, which in turn causes
          the heart failure of envenomed mice
        supports: SUPPORT
