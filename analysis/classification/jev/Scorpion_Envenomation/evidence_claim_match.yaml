        context: []
      assertion_type: Treatment
      assertion:
        name: Anti-heminecrolysin nanobody
        description: A candidate, not a treatment. Heminecrolysin is the haemolytic and dermonecrotic
          fraction of Hemiscorpius lepturus venom - the molecule behind the cytotoxic branch - and a camelid
          single-domain antibody against it neutralised both activities in mice. Recorded because it is
          the only agent in the entry aimed at the cytolytic lesion itself rather than at its consequences,
          and because the equine antivenom it would replace causes anaphylaxis.
        therapeutic_modality: NANOBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        notes: 'No `therapeutic_agent` binding: F7Nb is a research construct with no ontology identity,
          and NCIT has no generic single-domain-antibody class to fall back on - OLS `q=Single Domain
          Antibody, ontology=ncit` returns only named products (`NCIT:C211548` Lutetium Lu 177 Anti-PD-L1
          Nanobody RAD204, `NCIT:C120068` Anti-CEACAM6 AFAIKL2 Antibody Fragment/Jack Bean Urease Immunoconjugate
          L-DOS47) and unrelated constructs. `NCIT:C20401` Monoclonal Antibody was considered and rejected:
          a nanobody is a single-domain fragment, not a monoclonal antibody, and the distinction is exactly
          what this treatment turns on.'
      selected_evidence:
        snippet: However, this immunotherapy creates serious side effects, including anaphylactic shock
          sometimes even leading to death.
        supports: SUPPORT
