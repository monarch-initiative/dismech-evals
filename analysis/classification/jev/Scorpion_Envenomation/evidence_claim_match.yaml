              id: MONDO:0018755
              label: scorpion envenomation
            preferred_term: Scorpion envenomation
        context: []
      assertion_type: Environmental
      assertion:
        name: Scorpion sting delivering neurotoxic venom
        description: The exposure is an injection, not an ingestion or an inhalation, which is why dose
          scales with body mass and why children are the ones who die. Stings are domestic and rural in
          the great majority, concentrated in seven regions covering some 2.3 billion people.
        exposure_term:
          preferred_term: envenomation by buthid scorpion neurotoxins
          term:
            id: ECTO:0000730
            label: exposure to neurotoxin
        exposure_classifications:
          hazard_agent_type:
          - classification_value: BIOLOGICAL
          exposure_duration:
          - classification_value: ACUTE
        notes: 'Bound to `ECTO:0000730` exposure to neurotoxin, anchored on `CHEBI:50910` neurotoxin,
          which is exact for the agent class: the buthid venom''s active principles are sodium-channel
          neurotoxins. ECTO has no scorpion, venom or sting class. The searches, against the pinned local
          build the validator reads:

          `runoak -i sqlite:obo:ecto search ''l~scorpion''` returns nothing. `runoak -i sqlite:obo:ecto
          search ''l~venom''` returns nothing. `runoak -i sqlite:obo:ecto search ''l~arthropod''` returns
          nothing. `runoak -i sqlite:obo:ecto search ''l~bite''` returns nothing. `runoak -i sqlite:obo:ecto
          search ''l~sting''` returns only `ENVO:01000690` mass wasting and `XCO:0000002` resting, both
          substring false positives. `runoak -i sqlite:obo:ecto search ''t~exposure to neurotoxin''` returns
          `ECTO:0000730`, and `info ECTO:0000730 -O obo` shows it is `is_a ECTO:0000485` exposure to chemical
          with biological effect and involves `CHEBI:50910` neurotoxin. Neither it nor its parent is flagged
          Not4Curation.'
      selected_evidence:
        snippet: These involve 2.3 billion at risk population.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
