      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: il1r_pge2_cholinergic_axis
        hypothesis_label: An IL-1R/PGE2/acetylcholine neuro-immune axis drives it instead
        status: EMERGING
        description: A mouse account that puts the fatal arm on the other side of the autonomic nervous
          system. Venom recognition drives cardiac IL-1 receptor signalling and prostaglandin E2 production;
          PGE2 acting at EP2/EP4 receptors then drives excessive vagal acetylcholine release, and it is
          that cholinergic signal, not the adrenergic one, which produces the heart failure. Four independent
          interventions - IL-1R knockout, high-dose dexamethasone, atropine, and vagotomy - each abolish
          mortality in envenomed mice, and the authors note the pathway is untouched by antivenom. Recorded
          as EMERGING rather than ALTERNATIVE because nothing in it has been tested in humans.
      selected_evidence:
        snippet: cardiac dysfunction and fatal outcomes caused by lethal scorpion envenomation in mice
          are mediated by a neuro-immune interaction linking IL-1 receptor signaling, prostaglandin E2,
          and acetylcholine release
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
