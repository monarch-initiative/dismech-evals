              label: scorpion envenomation
            preferred_term: Scorpion envenomation
        context:
        - path: /treatments/5
          value:
            name: Atropine
            description: 'The drug the two hypotheses disagree about most sharply. In envenomed mice it
              is one of four interventions that abolish cardiac failure and death, and the emerging hypothesis
              predicts it should work. In human practice it is advised against for routine use - it blocks
              sweating, which children need for temperature regulation, and it potentiates the adrenergic
              arm the canonical hypothesis holds responsible. Both positions are curated here because
              the disagreement is the point: the same drug is protective or harmful depending on which
              arm is lethal.'
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: atropine
                term:
                  id: CHEBI:16684
                  label: atropine
            notes: 'The reason given against routine use is itself mechanistic and worth reading next
              to the pathograph: blocking the parasympathetic arm leaves the sympathetic one unopposed,
              which is the arm the canonical hypothesis says does the damage. So the human caution and
              the mouse result are not simply in conflict - they are what the two hypotheses each predict.'
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Excessive Vagal Acetylcholine Release at the Heart
        treatment_effect: INHIBITS
        description: Muscarinic blockade at the heart, which is the effector step of the emerging hypothesis.
          This edge is drawn under that hypothesis; under the canonical one atropine is acting on an arm
          that is not the lethal one, and unopposing the one that is.
      selected_evidence:
        snippet: Interestingly, in contrast to treatment with propranolol, the administration of atropine,
          a nonselective muscarinic antagonist, rescued the mice from mortality
        supports: SUPPORT
