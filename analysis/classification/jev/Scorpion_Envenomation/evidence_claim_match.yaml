        context:
        - path: /pathophysiology/0
          value:
            name: Scorpion Venom Neurotoxin Binding to Voltage-Gated Sodium Channels
            biological_scale: MOLECULAR
            description: 'Buthid venom carries small peptide neurotoxins that bind the voltage-sensing
              domains of voltage-gated sodium channels. The alpha-toxins are the structurally resolved
              case: AaH2 from Androctonus australis wedges into voltage-sensing domain IV and traps it
              in a deactivated state, so the S4 helix cannot make the translation that normally unlatches
              the fast inactivation gate. The modifier on the channel activity is `GAIN_OF_FUNCTION` rather
              than `INCREASED` deliberately: the claim is not that sodium current is quantitatively larger
              but that the channel has been taken outside its own regulatory constraint, since the gate
              that terminates its opening no longer operates. There is no host variant anywhere in this,
              so there is nothing for `functional_impact_category` to describe - the gain of function
              is imposed on a normal channel by a bound peptide.'
            molecular_functions:
            - preferred_term: voltage-gated sodium channel activity, with fast inactivation disabled
              term:
                id: GO:0005248
                label: voltage-gated sodium channel activity
              modifier: GAIN_OF_FUNCTION
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Failure of Sodium Channel Fast Inactivation and Repetitive Firing
        causal_link_type: DIRECT
        description: Trapping VSD4 in its deactivated state is the same event as preventing fast inactivation
          - the structure shows the mechanical linkage directly.
      selected_evidence:
        snippet: In the absence of AaH2, the S4 helix of VSD4 undergoes a ~13-angstrom translation to
          unlatch the intracellular fast-inactivation gating machinery.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0/downstream/0
      evidence_path: /pathophysiology/0/downstream/0/evidence/0
