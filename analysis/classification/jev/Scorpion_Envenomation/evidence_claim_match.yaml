  6c1436c474baf09abcac6e7ef7d3881fec8917fe348168e0ea3445bc2d443299:
    claim:
      about:
        disease:
          name: Scorpion Envenomation
          disease_term:
            term:
              id: MONDO:0018755
              label: scorpion envenomation
            preferred_term: Scorpion envenomation
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Lethally envenomed C57BL/6 mouse (Tityus serrulatus venom, 180 ug/kg i.p.)
        species: Mouse
        genotype: C57BL/6 wild type, with Il1r1-/-, Nlrp3-/-, Asc-/- and Casp1/11-/- knockouts used as
          mechanistic controls
        publication: PMID:33116136
        description: 'The model the whole emerging hypothesis rests on. Mice given a lethal intraperitoneal
          dose of Tityus serrulatus venom develop sweating, ocular and nasal secretion, lethargy and convulsion
          within an hour, with measurable rises in plasma adrenaline and acetylcholine, falling arterial
          pressure and heart rate, and death in half to all animals. Its value is that it is interventional
          where the human literature is observational: genetic knockouts and drugs can be applied to individual
          steps.'
        modeled_mechanisms:
        - target: Autonomic Neurotransmitter Storm
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Both arms of the storm are reproduced and measured directly in plasma - adrenaline
            and acetylcholine together - alongside the autonomic clinical signs that define the syndrome
            in people.
          limitations: 'The route and dose are not those of a sting: an intraperitoneal bolus at a defined
            lethal dose is not a subcutaneous injection of unknown quantity, and nothing in the model
            reproduces the dependence on body mass that makes this a disease of children.'
          readouts:
          - name: Plasma adrenaline and acetylcholine
            target: Autonomic Neurotransmitter Storm
            direction: INCREASED
            interpretation: Simultaneous elevation of both transmitters is the defining measurement of
              this node, and the reason the entry does not treat the storm as adrenergic alone.
        - target: Venom-Triggered Cardiac IL-1R Signaling and PGE2 Production
          relationship: RECAPITULATES
          fidelity: UNKNOWN
          model_scale: CELLULAR
          description: This node exists only because of this model. Every step of it - the inflammasome-dependent
            IL-1 beta, the sustained PGE2, and the IL-1R requirement - was established here and has never
            been shown in a person.
          limitations: 'Fidelity is UNKNOWN rather than low or moderate because there is no human counterpart
            to compare against: the one human study of this axis reports an association between circulating
            IL-1 beta and cardiac abnormality and does not test the pathway.'
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Tityus serrulatus is the Brazilian species this work uses, while most of the
              world's scorpion mortality is caused by Androctonus, Leiurus, Mesobuthus and Centruroides
              on other continents, whose venoms differ in toxin composition. Whether their venoms are
              sensed the same way by cardiac innate immunity is untested.
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: The sting is outside the model. Venom is delivered as an intraperitoneal bolus,
              so absorption from a subcutaneous depot, the dose actually injected by a scorpion, and the
              delay before care - all of which govern human outcome - are not represented.
        - target: Cardiac Dysfunction and Pulmonary Edema
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Envenomed mice develop falling arterial pressure and heart rate within an hour
            and die, which is the cardiovascular collapse this node describes.
          limitations: The model's cardiac endpoint is haemodynamic collapse and death within about an
            hour. The human node includes pulmonary oedema and a myocarditis that is reversible over days
            in survivors, neither of which this model reports - so it captures the fatal arm and not the
            recovery arm that most patients follow.
          readouts:
          - name: Mean arterial pressure and heart rate
            target: Cardiac Dysfunction and Pulmonary Edema
            direction: DECREASED
            interpretation: Falling pressure and falling rate together is the haemodynamic signature the
              cholinergic account predicts.
      selected_evidence:
        snippet: Lethally envenomed C57Bl/6 (WT) mice (TsV, 180
        supports: SUPPORT
