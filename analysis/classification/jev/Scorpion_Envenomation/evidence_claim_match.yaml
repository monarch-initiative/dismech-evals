      assertion_type: Diagnosis
      assertion:
        name: Transthoracic echocardiography
        description: 'The reference standard the whole biochemical section is measured against, and the
          test that decides management: it separates the child with an autonomic syndrome who will recover
          from the one with left ventricular failure who needs an intensive care bed. Reversibility is
          the point - ventricular function recovers in almost all survivors, so a depressed ejection fraction
          here is a reason to escalate support rather than a prognosis.'
        diagnosis_term:
          preferred_term: echocardiography
          term:
            id: NCIT:C16525
            label: Echocardiography Test
        markers: Ejection fraction, shortening fraction, left ventricular dysfunction
        results: Left ventricular dysfunction in roughly a quarter of patients presenting with signs of
          severity.
        notes: Curated as a diagnosis rather than as a biomarker because it is the endpoint every marker
          in the `biochemical:` section is evaluated against - sST2 and FABP3 report AUCs against cardiac
          ultrasound, and proBNP is correlated against ejection and shortening fraction. Reading the two
          sections together, the markers are candidates for triaging who gets an echocardiogram sooner,
          not replacements for it.
      selected_evidence:
        snippet: Left ventricular dysfunction was identified in 13 patients (26.5%), with 7 cases classified
          as severe.
        supports: SUPPORT
