      assertion:
        name: Cytolytic Venom Membrane Damage
        biological_scale: MOLECULAR
        description: The Hemiscorpius lepturus branch, and the point at which this subtype leaves the
          rest of the entry. The venom is cytolytic rather than neurotoxic, lysing cell membranes at the
          sting site and in the circulation. The sting itself is characteristically not painful, which
          is why presentation is late.
        notes: Named for the effect rather than the enzyme. The literature attributes the cytolysis to
          a lysophospholipase D and related lytic enzymes, but no source cited in this entry says so and
          the node carries no `molecular_functions` binding to hold the claim, so naming it for a phospholipase
          would have asserted an enzymology the entry does not evidence.
      selected_evidence:
        snippet: HL venom is cytotoxic, and HL is the only scorpion whose venom induces a toxic reaction.
        supports: SUPPORT
