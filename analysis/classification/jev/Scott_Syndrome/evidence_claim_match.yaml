              label: Scott syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Platelet Procoagulant Surface Formation
        role: effector
        biological_scale: CELLULAR
        description: 'The activated platelet fails to present the anionic surface that coagulation depends
          on, and fails to shed the phosphatidylserine-bearing microparticles that extend that surface
          into the surrounding plasma. Binding of the clotting enzyme complexes to a negatively charged
          membrane surface is what allows the dramatic acceleration of zymogen-to-protease conversion,
          so the loss is quantitative in the most consequential sense: the reactions still occur, but
          far too slowly.'
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: platelet procoagulant activity
          term:
            id: GO:0007596
            label: blood coagulation
          modifier: DECREASED
      selected_evidence:
        snippet: This newly-exposed PS surface is a major component of normal hemostasis because it supports
          platelet procoagulant function.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21958383
      reference_title: 'Platelet membrane phospholipid asymmetry: from the characterization of a scramblase
        activity to the identification of an essential protein mutated in Scott syndrome.'
      evidence_source: HUMAN_CLINICAL
      explanation: States that the exposed surface is what supports procoagulant function, which is what
        this node records as failing.
