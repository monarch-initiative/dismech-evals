              label: Scott syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Calcium-Dependent Phospholipid Scrambling
        role: central_effector
        biological_scale: MOLECULAR
        conforms_to: primary_hemostatic_plug_failure#Impaired Platelet Procoagulant Membrane Response
        description: The rate-limiting lesion. Resting cells maintain phospholipid asymmetry using ATP-dependent
          translocases (flippases and floppases) that move phospholipids unidirectionally against a gradient;
          on activation an energy-independent, calcium-dependent scramblase instead exchanges phospholipids
          bidirectionally between the two leaflets, collapsing the asymmetry and exposing phosphatidylserine.
          It is this second, scramblase activity that is lost here - the translocases are unaffected -
          so the defect is specific to the activated state, which is why resting platelets are entirely
          normal.
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: calcium-dependent phosphatidylserine externalization
          term:
            id: GO:0017121
            label: plasma membrane phospholipid scrambling
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: They also use an energy-independent, calcium-dependent scramblase activity to govern
          the bidirectional exchange of phospholipids between the two leaflets of the bilayer; this activity
          is essential for PS exposure during platelet activation. Scramblase activity, biochemically
          characterized in the 1980s, is deficient in patients with Scott syndrome, a rare inherited bleeding
          disorder with defective platelet procoagulant activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21958383
      reference_title: 'Platelet membrane phospholipid asymmetry: from the characterization of a scramblase
        activity to the identification of an essential protein mutated in Scott syndrome.'
      evidence_source: HUMAN_CLINICAL
      explanation: Distinguishes the scramblase activity from the ATP-dependent translocases and states
        that it is the one deficient in this disorder - the exact claim this node makes.
