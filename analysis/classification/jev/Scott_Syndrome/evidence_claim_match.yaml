              label: Scott syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Local Thrombin Burst
        role: effector
        biological_scale: TISSUE
        description: Without surface-accelerated assembly of the clotting enzyme complexes there is no
          burst of thrombin at the site of injury, so fibrin formation and the further platelet activation
          that thrombin drives both fail. Plasma coagulation factor levels are normal throughout - the
          defect is in where the reactions happen, not in what is available to run them - which is why
          standard plasma-based clotting assays are normal and why the historical name for the disorder
          was framed as defective prothrombin consumption.
        biological_processes:
        - preferred_term: blood coagulation
          term:
            id: GO:0007596
            label: blood coagulation
          modifier: DECREASED
      selected_evidence:
        snippet: Binding of blood clotting enzyme complexes to this negatively-charged membrane surface
          allows a dramatic increase in the rate of conversion of zymogens to active serine proteases,
          which in turn produce a burst of thrombin leading to the formation of a fibrin clot and further
          platelet activation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
