  d2290280eed98acc5067599b8443354e1384cab219539ab6aad9f90af41f3ed4:
    claim:
      about:
        disease:
          name: Scott Syndrome
          disease_term:
            preferred_term: Scott syndrome
            term:
              id: MONDO:0009885
              label: Scott syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ano6_beyond_scrambling
        kind: KNOWLEDGE_GAP
        prompt: Is the bleeding phenotype of ANO6 deficiency fully explained by loss of phosphatidylserine
          scrambling, or do the other ANO6-dependent platelet responses contribute?
        attaches_to:
        - pathophysiology#Loss of Calcium-Dependent Phospholipid Scrambling
        - pathophysiology#Failure of Platelet Procoagulant Surface Formation
        rationale: The disorder is conventionally described, and is curated here, as a scramblase deficiency.
          But ANO6-deficient platelets also show markedly reduced calcium-dependent swelling and membrane
          blebbing and reduced calpain-dependent protein cleavage, and these are not obviously downstream
          of scrambling - the source frames ANO6 as controlling multiple platelet responses, plural. Since
          membrane blebbing is how procoagulant microparticles are shed, at least one of these could contribute
          independently to the haemostatic defect. Resolving this matters for whether a therapy aimed
          at restoring phosphatidylserine exposure alone would be sufficient.
        proposed_experiments:
        - experiment_id: exp_ano6_separation_of_function
          name: Separation-of-function ANO6 variants in patient-derived megakaryocytes
          description: Express ANO6 variants that dissociate scrambling from ion-channel and blebbing
            activity in ANO6-null iPSC-derived megakaryocytes, and measure phosphatidylserine exposure,
            microparticle release and thrombin generation independently. Rescue of thrombin generation
            by a scrambling-only variant would settle the question in favour of the conventional account.
      selected_evidence:
        snippet: We investigated how the complex platelet phenotype of this syndrome is linked to defective
          expression of Anos or other ion channels.
        supports: SUPPORT
