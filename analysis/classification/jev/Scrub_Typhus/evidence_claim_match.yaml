      assertion_type: Diagnosis
      assertion:
        name: PCR detection of Orientia tsutsugamushi DNA
        description: PCR assays usually target outer-membrane-protein genes and may be more sensitive
          than serology, detecting Orientia DNA in blood even during persistent phases of infection without
          obvious clinical symptoms. PCR is best early, during the rickettsaemic phase that precedes seroconversion,
          which makes it complementary to serology rather than an alternative to it. It accounted for
          only 4.6% of diagnoses in the reviewed Indian literature.
        diagnosis_term:
          preferred_term: molecular diagnostic procedure
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        results: Detection of O. tsutsugamushi DNA, commonly by amplification of the 56-kDa type-specific
          antigen gene, confirms infection.
      selected_evidence:
        snippet: PCRs usually target the genes of outer membrane proteins. They may be more sensitive
          than serological tests detecting Orientia DNA in blood even during persistent phases of infection
          with no obvious clinical symptoms.
        supports: SUPPORT
