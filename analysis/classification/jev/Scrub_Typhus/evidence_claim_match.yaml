      assertion_type: Treatment
      assertion:
        name: Doxycycline
        description: 'A tetracycline and the standard first-line agent for scrub typhus in adults and
          children. It satisfies both mechanistic constraints simultaneously: it binds the 30S ribosomal
          subunit, which is the drug target in this organism, and it accumulates intracellularly, so it
          reaches an organism replicating free in the host cytosol. Because laboratory confirmation is
          usually retrospective, treatment is started empirically on clinical suspicion.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: doxycycline
            term:
              id: CHEBI:50845
              label: doxycycline
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: All patients achieved clinical defervescence and symptomatic improvement within 24-48
          hours of doxycycline initiation, consistent with the characteristic brisk antimicrobial response.
        supports: SUPPORT
