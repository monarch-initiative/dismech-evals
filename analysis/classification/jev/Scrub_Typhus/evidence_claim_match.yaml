      assertion:
        name: Immunochromatographic rapid antibody tests
        description: Rapid ICTs using pooled Orientia cell lysates or recombinant p56 outer-membrane protein
          as antigen detect IgG, IgM and IgA with better sensitivity and specificity than IFA in field
          conditions and may eventually replace it. Sensitivity is only moderate at around 70% and rises
          with fever duration, so a negative test early in illness carries a substantial false-negative
          rate - which is precisely when the treatment decision has to be made.
        diagnosis_term:
          preferred_term: serology testing
          term:
            id: NCIT:C25294
