              as an endosymbiont and is passed to the next mite generation transovarially, so no vertebrate
              is needed to maintain it. Only the larval stage, the chigger, feeds on a vertebrate, and
              it does so once; rodents and other small mammals carry those chiggers. Humans are incidental
              hosts, infected when a chigger attaches and injects bacteria from its salivary glands.'
            hosts:
            - preferred_term: Leptotrombidium chiggers
              role: Exclusive arthropod vector and the reservoir; maintains the agent as an endosymbiont
