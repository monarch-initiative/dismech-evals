      assertion_type: Pathophysiology
      assertion:
        name: Orientia Ribosomal Translation (Tetracycline and Macrolide Target)
        biological_scale: MOLECULAR
        role: therapeutic_vulnerability
        conforms_to: bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome
        description: Like other bacteria, Orientia tsutsugamushi depends on translation of its mRNA by
          the 70S ribosome, and that ribosome is the target of every antibiotic with established activity
          in scrub typhus. Doxycycline binds the 30S subunit and blocks aminoacyl-tRNA delivery to the
          A site; azithromycin binds the 50S subunit and blocks nascent-chain elongation. The target is
          the ribosome and not the cell wall, which - together with the intracellular niche - is why a
          tetracycline or macrolide rather than a beta-lactam is used.
        biological_processes:
        - preferred_term: translation
          term:
            id: GO:0006412
            label: translation
      selected_evidence:
        snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
        supports: SUPPORT
    origin:
