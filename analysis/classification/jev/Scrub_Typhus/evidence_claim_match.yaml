        results: Detection of IgM, IgG or IgA against O. tsutsugamushi supports the diagnosis; a negative
          result early in the febrile course does not exclude it.
      selected_evidence:
        snippet: ICTs detect IgG, IgM and IgA antibodies against O. tsutsugamushi with moderate sensitivity
          (~70%). Sensitivity increases with fever duration but has a substantial number of false negative
          results.
