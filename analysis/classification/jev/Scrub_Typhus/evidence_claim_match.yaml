        context: []
      assertion_type: Environmental
      assertion:
        name: Agricultural and forest-dependent occupational exposure to chigger habitat
        description: 'Scrub typhus is fundamentally an exposure disease: risk is set by contact with the
          vegetation where infected Leptotrombidium larvae wait for a host. Agricultural practice and
          work in or near forested land are the dominant behavioural determinants, and Indian states with
          agricultural and forest-dependent lifestyles show correspondingly high prevalence. This is why
          the disease clusters occupationally and seasonally rather than person-to-person - there is no
          human-to-human transmission at all.'
        exposure_term:
          preferred_term: occupational exposure to chigger-infested vegetation through agricultural and
            forest work
        notes: Deliberately left unbound to an ontology term. ECTO was searched for arthropod-vector,
          agricultural and occupational exposure concepts and no adequate match was found; per the project
          rule that no term beats a bad one, a free-text preferred_term is retained rather than forcing
          an approximate CURIE.
      selected_evidence:
        snippet: possibly due to agricultural and forest-dependent lifestyles, which increase exposure
          to vector habitats
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
