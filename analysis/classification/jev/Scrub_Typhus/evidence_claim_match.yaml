      assertion_type: Pathophysiology
      assertion:
        name: TSA56-Fibronectin Binding and Integrin-Mediated Host Cell Entry
        biological_scale: MOLECULAR
        role: central_effector
        description: 'The 56-kDa type-specific antigen (TSA56), the major outer membrane protein of O.
          tsutsugamushi, binds host fibronectin. Fibronectin bridges the bacterium to integrin alpha5beta1,
          and the bacterium then activates the integrin signalling machinery - focal adhesion kinase,
          Src kinase and RhoA GTPase, with recruitment of talin and paxillin - to drive actin reorganisation
          and membrane protrusion that engulfs it. This is an induced uptake: the organism forces its
          own entry into cells that are not professional phagocytes. Blocking tyrosine kinases or RhoA,
          or competing with the fibronectin-binding region of TSA56, reduces invasion, which is what makes
          this a causal step rather than a correlate.'
        biological_processes:
        - preferred_term: integrin-mediated signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007229
            label: integrin-mediated signaling pathway
        - preferred_term: actin cytoskeleton organization
          modifier: INCREASED
          term:
            id: GO:0030036
            label: actin cytoskeleton organization
        - preferred_term: symbiont entry into host
          term:
            id: GO:0044409
            label: symbiont entry into host
      selected_evidence:
        snippet: the 56-kDa type-specific antigen (TSA56), a major outer membrane protein of O. tsutsugamushi,
          binds to fibronectin and facilitates bacterial entry into the host cell
        supports: SUPPORT
