      assertion_type: Pathophysiology
      assertion:
        name: Eschar Formation at the Inoculation Site
        biological_scale: TISSUE
        role: consequence
        description: Replication at the chigger attachment site produces a localised necrotic papule that
          ulcerates and forms a black crust surrounded by an erythematous halo - the eschar - typically
          with regional lymphadenopathy in the draining basin. It is the single most useful diagnostic
          sign, but it is not universal, is frequently concealed in the axilla, groin or under clothing,
          and is easily missed on darker skin, which is a recurring cause of delayed diagnosis. The eschar
          is the visible correlate of the initiating focus rather than a cause of the systemic disease,
          so it is deliberately a terminal node carrying no outgoing causal edge.
      selected_evidence:
        snippet: these included fever, severe headache, myalgia, regional lymphadenopathy, and eschar
