      assertion_type: Phenotype
      assertion:
        category: Clinical
        name: Eschar
        frequency: OCCASIONAL
        description: 'A necrotic, black-crusted ulcer with an erythematous halo at the chigger attachment
          site. It is pathognomonic when present, but present in a minority of patients: a meta-analysis
          of 107 studies and 34,002 Indian cases pooled eschar positivity at 28.5% (95% CI 24.1-32.9%),
          which places it in the OCCASIONAL band. The band should be read as region-specific rather than
          global - the same meta-analysis found pooled positivity ranging from under 12% in some Indian
          states to 46% or more in others, and series from elsewhere in the endemic zone report higher
          rates still. Eschars concentrate on the trunk, groin and axilla, which is why they are missed
          without deliberate examination of covered areas.'
        phenotype_term:
          preferred_term: Eschar
          term:
            id: HP:6000793
            label: Eschar
      selected_evidence:
        snippet: 'The overall pooled proportion of eschar positivity was 28.5% (95% CI: 24.1 to 32.9%).'
        supports: SUPPORT
