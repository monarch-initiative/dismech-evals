      assertion_type: Diagnosis
      assertion:
        name: Indirect immunofluorescence assay (reference standard serology)
        description: 'IFA for anti-Orientia antibodies is the CDC reference standard. Its practical problem
          is an availability inversion that shapes the whole diagnostic landscape of this disease: the
          reference test is rarely available in exactly the developing-country settings where scrub typhus
          is most prevalent. Paired acute and convalescent sera are needed for a definitive serological
          diagnosis, so IFA rarely informs the decision to treat.'
        diagnosis_term:
          preferred_term: serology testing
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
        measurements:
        - preferred_term: Orientia tsutsugamushi antibody titer
          term:
            id: LOINC:22485-7
            label: Orientia tsutsugamushi Ab [Titer] in Serum
        results: Seroconversion or a fourfold rise in anti-Orientia tsutsugamushi antibody titre between
          paired acute and convalescent samples supports the diagnosis.
      selected_evidence:
        snippet: As per the Centre for Disease Control and Prevention, indirect immunofluorescence assay
          (IFA) is the reference standard, though it is rarely available in developing nations where prevalence
          is high.
        supports: SUPPORT
