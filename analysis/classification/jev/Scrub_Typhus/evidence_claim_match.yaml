          name: Scrub typhus
          disease_term:
            preferred_term: scrub typhus
            term:
              id: MONDO:0019365
              label: scrub typhus
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Weil-Felix agglutination test
        description: 'An old, cheap OXK-antigen agglutination test with poor sensitivity of about 15%
          and specificity of about 96%, which is therefore not the preferred method. It is recorded here
          because of an implementation gap that is itself a finding: despite being the least reliable
          option, Weil-Felix was the primary diagnostic method in about 61% of cases across two decades
          of Indian literature, while PCR accounted for 4.6%. Any epidemiological figure drawn from that
          literature inherits the misclassification of a 15%-sensitivity test, which is a reason to treat
          reported case counts as underestimates.'
        diagnosis_term:
          preferred_term: serology testing
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
        results: Agglutination against Proteus OXK antigen; a positive result is suggestive but a negative
          result excludes very little given approximately 15% sensitivity.
      selected_evidence:
        snippet: While providing a cheap option for identifying rickettsial infections in resource-poor
          settings, the Weil-Felix agglutination test has poor sensitivity (~15%) and specificity (~96%)
          and is thus not preferred.
        supports: SUPPORT
    origin:
