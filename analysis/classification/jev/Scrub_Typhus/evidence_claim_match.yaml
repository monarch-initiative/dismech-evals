              id: MONDO:0019365
              label: scrub typhus
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: scrub-typhus-neuroinflammation-model-fidelity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Type I Interferon-Driven M1 Monocyte Polarisation and Cytokine Response
        - pathophysiology#Multi-Organ Vascular Leak and End-Organ Dysfunction
        prompt: The mechanistic account of scrub typhus neuroinflammation - excessive interferon responses,
          microglial activation and blood-brain-barrier disruption - rests on brain RNA-seq and immunostaining
          in a murine model of severe infection. Do these pathways operate the same way in human scrub
          typhus encephalitis, where the CNS is rarely sampled?
        rationale: Evidence for the CNS arm exists and is internally coherent, but it is predominantly
          murine, so its translational validity rather than its existence is the open question - which
          is what distinguishes this from a plain knowledge gap. The monocyte arm of this entry is anchored
          partly in patient mononuclear cells and so is on firmer human ground; the brain-specific mechanism
          is not. Human CNS validation matters because interferon-directed or barrier-directed adjunctive
          therapy would be prescribed on the strength of exactly these pathways.
        proposed_experiments:
        - experiment_id: scrub-typhus-human-csf-validation
          name: Human CSF and neuroimaging validation of the murine neuroinflammation programme
          description: In patients with scrub typhus-associated acute encephalitis syndrome, measure CSF
            interferon-stimulated protein signatures, microglial activation markers and barrier-integrity
            indices, and compare the pattern against the murine brain transcriptome programme.
          readouts:
          - name: Concordance of human CSF interferon and barrier markers with the murine programme
            target: pathophysiology#Type I Interferon-Driven M1 Monocyte Polarisation and Cytokine Response
          would_support:
          - pathophysiology#Type I Interferon-Driven M1 Monocyte Polarisation and Cytokine Response
      selected_evidence:
        snippet: This study provides new insights into neuroinflammation in scrub typhus, highlighting
          the impact of excessive IFN responses, microglial activation, and BBB dysregulation on disease
          pathogenesis.
        supports: SUPPORT
