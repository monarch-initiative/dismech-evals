      assertion:
        name: Requirement for Cell-Penetrant Antimicrobials
        biological_scale: MOLECULAR
        role: therapeutic_vulnerability
        conforms_to: intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials
        description: Because the organism replicates free in the host cytosol, effective therapy requires
          an antibiotic that crosses the host plasma membrane and accumulates intracellularly. Doxycycline
          and azithromycin do; beta-lactams do not reach the cytosolic organism regardless of dose. This
          is pharmacokinetic gating rather than a molecular target, and it operates alongside - not instead
          of - the ribosomal target node. The clinical urgency of the constraint follows from the multi-organ
          node, since untreated disease progresses to organ failure - but that is a statement about why
          the constraint matters, not a causal relationship, so it is recorded here rather than encoded
          as an edge.
        biological_processes:
        - preferred_term: response to antibiotic
          term:
            id: GO:0046677
            label: response to antibiotic
      selected_evidence:
        snippet: The intracellular location of some microorganisms allow them to resist antibiotics with
          poor ability to penetrate eukaryotic cell membranes, such as the beta-lactam compounds.
        supports: SUPPORT
