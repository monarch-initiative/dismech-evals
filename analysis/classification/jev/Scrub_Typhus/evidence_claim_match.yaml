                to maintain the agent
              term:
                id: NCBITaxon:9989
                label: Rodentia
            - preferred_term: Homo sapiens
              role: Incidental host, infected by an attaching chigger larva; does not maintain the agent
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            vectors:
            - Chiggers, the larval stage of trombiculid mites of the genus Leptotrombidium
          role: ancestor
