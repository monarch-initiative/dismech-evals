      assertion_type: Pathophysiology
      assertion:
        name: Ank13-Mediated p53 Suppression and Host Cell Cycle Arrest
        biological_scale: MOLECULAR
        role: modifier
        description: Orientia does not merely occupy the host cell, it reconfigures it. The nucleomodulatory
          effector Ank13 blocks transcription of TP53, nearly depleting p53 and disabling the DNA-damage-triggered
          apoptosis that would otherwise destroy the infected cell and with it the bacterial niche. Rather
          than releasing the cell into unrestricted proliferation, the organism arrests the cycle at S
          phase in a way that favours its own replication, and delays genotoxic apoptosis until a high
          bacterial load has accumulated. This is niche maintenance, and it explains why infected endothelium
          survives long enough to support the bacterial burden that drives systemic disease.
        biological_processes:
        - preferred_term: biological process involved in interaction with host
          modifier: INCREASED
          term:
            id: GO:0051701
            label: biological process involved in interaction with host
      selected_evidence:
        snippet: the endotheliotropic obligate intracellular bacterium Orientia tsutsugamushi blocks transcription
          of TP53 to nearly deplete p53 levels
        supports: SUPPORT
