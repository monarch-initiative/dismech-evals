        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: orientia-strain-variation
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#TSA56-Fibronectin Binding and Integrin-Mediated Host Cell Entry
        - pathophysiology#Eschar Formation at the Inoculation Site
        - pathophysiology#Type I Interferon-Driven M1 Monocyte Polarisation and Cytokine Response
        prompt: 'Orientia tsutsugamushi is antigenically extremely diverse - Karp-like, Kato-like, Gilliam-like
          and JG-like strains circulate in different proportions across India alone, and the diversity
          is defined by the very TSA56 protein this entry models as the adhesin. Two strain-dependent
          observations are unexplained: it is postulated that some strains produce eschars less commonly
          than other antigenic types, and dual RNA-seq of two clinical isolates found them driving divergent
          host programmes, with the Karp strain associated with IL33-linked responses and UT176 with IL6-mediated
          inflammation, differences that tracked relative virulence in mice. Does strain genotype determine
          eschar formation, host inflammatory programme, and severity in humans?'
        rationale: This bears directly on three curated nodes. If TSA56 variation alters adhesion or entry,
          that is a property of this entry's molecular node, not a bystander observation. If it determines
          whether an eschar forms, then eschar frequency is not a single number at all - which would explain
          the wide geographic variation this entry already records (under 12% to over 46% between Indian
          states) as strain composition rather than examination technique, and would change how the diagnostic
          sign should be weighted regionally. And if strains drive different cytokine programmes, the
          interferon/M1 node is strain-conditioned rather than uniform. The practical obstacle is that
          most surveillance genotyping is done on the same TSA56 gene used for diagnosis, so genotype
          and detection are not independent.
        proposed_experiments:
        - experiment_id: orientia-genotype-phenotype-cohort
          experiment_design: HUMAN_OBSERVATIONAL
          name: Strain genotype versus eschar, cytokine programme and severity
          description: A prospective multi-site cohort in regions with differing circulating genotypes,
            in which infecting strain is typed by whole-genome sequencing rather than TSA56 alone, and
            correlated with eschar presence, host cytokine profile and severity - separating strain effects
            from examination technique and from host factors.
          readouts:
          - name: Eschar presence and host cytokine programme by infecting strain genotype
            target: pathophysiology#Eschar Formation at the Inoculation Site
          would_support:
          - pathophysiology#Eschar Formation at the Inoculation Site
          - pathophysiology#Type I Interferon-Driven M1 Monocyte Polarisation and Cytokine Response
      selected_evidence:
        snippet: It is postulated that some strains produce eschars less commonly than other antigenic
          types.
        supports: SUPPORT
    origin:
