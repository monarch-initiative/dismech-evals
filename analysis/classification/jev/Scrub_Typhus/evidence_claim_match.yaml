      assertion_type: Diagnosis
      assertion:
        name: Clinical recognition of the eschar
        description: Careful whole-body examination for an eschar remains a decisive bedside step because
          the lesion is pathognomonic when found. It is present in only a minority of patients and concentrates
          on the trunk, groin and axilla, so it is missed unless covered areas are deliberately examined;
          eliciting it by directed history and examination is associated with correct diagnosis at the
          first visit.
        diagnosis_term:
          preferred_term: physical examination
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        results: A necrotic, black-crusted ulcer with an erythematous halo at a chigger attachment site
          is pathognomonic; its absence does not exclude the diagnosis.
      selected_evidence:
        snippet: In endemic settings, patients correctly diagnosed at the first visit to a participating
          site more often had rash and eschar brought to clinical attention in specific ways. Directed
          inquiry about skin symptoms and careful examination for eschar may help recognition in routine
          care.
        supports: SUPPORT
