      assertion_type: Pathophysiology
      assertion:
        name: Peptidoglycan-Poor Atypical Cell Envelope
        biological_scale: MOLECULAR
        role: modifier
        description: 'Orientia''s envelope chemistry diverges sharply from that of the rickettsiae it
          was once classified with, and this divergence was the basis for erecting the genus Orientia.
          Chemical analysis found no detectable muramic acid, glucosamine, heptose or KDO and no lipopolysaccharide
          bands, concluding the organism has little or no peptidoglycan or LPS. A later structural study
          qualified this: it found evidence for a peptidoglycan-LIKE structure together with a cross-linked
          outer-membrane protein network that confers envelope stability. The two results are curated
          here together, unresolved, because the difference matters mechanistically - it determines whether
          beta-lactam inactivity in scrub typhus is target absence or only drug exclusion. See the `orientia-peptidoglycan-status`
          discussion; this entry deliberately does NOT declare conformance to `bacterial_cell_wall_synthesis_inhibition#Intrinsic
          Resistance in Cell-Wall-Deficient Organisms` while that question is open.'
      selected_evidence:
        snippet: It is concluded that R. tsutsugamushi has little or no peptidoglycan or lipopolysaccharide.
        supports: SUPPORT
