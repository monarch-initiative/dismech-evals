      reference: PMID:37366866
      reference_title: 'Scurvy: Rediscovering a Forgotten Disease.'
      explanation: This abstract confirms scurvy affects multiple organ systems through its role in connective
        tissue synthesis, supporting the collagen synthesis impairment mechanism.
