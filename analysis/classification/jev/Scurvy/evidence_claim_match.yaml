      assertion_type: Pathophysiology
      assertion:
        name: Vascular Integrity Failure
        description: 'Defective collagen in blood vessel walls and basement membranes leads to capillary
          fragility and increased vascular permeability. This manifests as spontaneous bleeding including
          petechiae, ecchymoses, and mucosal hemorrhages despite normal coagulation.

          '
      selected_evidence:
        snippet: Common manifestations include gingival bleeding, arthralgias, skin discoloration, impaired
          wound healing, perifollicular hemorrhage, and ecchymoses.
        supports: SUPPORT
