      assertion_type: Pathophysiology
      assertion:
        name: Collagen Synthesis Impairment
        description: 'Vitamin C (ascorbic acid) is essential for hydroxylation of proline and lysine residues
          in collagen synthesis by prolyl and lysyl hydroxylases. Deficiency leads to inadequate hydroxyproline
          and hydroxylysine formation, preventing triple-helix stability and mature cross-links, resulting
          in defective collagen formation that affects connective tissues throughout the body.

          '
      selected_evidence:
        snippet: It leads to a varied presentation, affecting multiple organ systems due to its role in
          the biochemical reactions of connective tissue synthesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
