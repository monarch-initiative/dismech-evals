    evidence_metadata:
      reference: PMID:33236467
      reference_title: Collagen release by human hepatic stellate cells requires vitamin C and is efficiently
        blocked by hydroxylase inhibition.
      evidence_source: IN_VITRO
      explanation: Directly states the biochemical basis of this node — ascorbate is the cofactor of the
        prolyl hydroxylases that mature collagen; the study further shows collagen release by human cells
        is blocked when hydroxylase activity is inhibited, experimentally confirming the ascorbate-dependent
        hydroxylation requirement whose loss underlies scurvy.
