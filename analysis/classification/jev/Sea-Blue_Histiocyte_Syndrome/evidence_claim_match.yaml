        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Macrophage Lipid and Lipoprotein Handling
        description: The initiating defect is impaired macrophage handling of lipids and lipoproteins.
          In the best-characterized primary form, an autosomal dominant APOE mutation (p.Leu149del) in
          the LDL-receptor-binding region deranges lipoprotein metabolism and drives macrophage hypercatabolism
          of lipoproteins. In secondary forms the upstream cause is a lysosomal hydrolase deficiency (e.g.,
          acid sphingomyelinase) or an excess substrate load (high cell turnover, dyslipidemia, intravenous
          lipid emulsion).
        gene:
          preferred_term: APOE
          term:
            id: hgnc:613
            label: APOE
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: lipoprotein metabolic process
          modifier: ABNORMAL
          term:
            id: GO:0042157
            label: lipoprotein metabolic process
      selected_evidence:
        snippet: we provide evidence linking the syndrome to an inherited dominant mutation in the apoE
          gene, a 3-bp deletion on the background of an apoE 3 allele that causes a derangement in lipid
          metabolism and leads to splenomegaly
        supports: SUPPORT
    origin:
