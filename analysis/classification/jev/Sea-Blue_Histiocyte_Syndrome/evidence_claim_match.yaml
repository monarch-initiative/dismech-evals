        name: Lysosomal Ceroid Accumulation and Sea-Blue Pigment Formation
        description: Indigestible, oxidized lipid and lipoprotein material accumulates within macrophage
          lysosomes and polymerizes into ceroid/lipofuscin pigment. The resulting lipid-laden macrophages
          display the characteristic deep blue cytoplasmic granules on Wright-Giemsa staining that define
          the sea-blue histiocyte.
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
