      assertion:
        name: Morphologic and clinical case definition of sea-blue histiocyte syndrome
        definition_type: CASE_DEFINITION
        description: Sea-blue histiocyte syndrome is defined by the presence of sea-blue histiocytes (lipid-laden
          macrophages with deep blue Wright-Giemsa cytoplasmic granules) in the bone marrow. The primary
          syndrome additionally comprises splenomegaly, thrombocytopenia, and hypertriglyceridemia in
          the absence of an identifiable cause; secondary sea-blue histiocytosis is the same morphologic
          finding accompanying another disorder.
        scope: Disease-level morphologic plus clinical case definition spanning primary and secondary
          forms.
      selected_evidence:
        snippet: It may occur rarely as a primary genetic clinical syndrome characterized by splenomegaly,
          hypertriglyceridemia and thrombocytopenia.
        supports: SUPPORT
