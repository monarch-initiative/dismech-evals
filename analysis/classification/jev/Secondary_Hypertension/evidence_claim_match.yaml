        name: Drug-Induced Vasoconstriction and Increased Peripheral Vascular Resistance
        description: 'The convergence step for VEGF-inhibitor-induced secondary hypertension: reduced
          endothelial nitric oxide with oxidative stress, endothelin-1 system activation, and microvascular
          rarefaction together shift the peripheral circulation toward constriction and raise total peripheral
          vascular resistance. Unlike most causes of secondary hypertension curated in this entry, the
          lesion is reversible on withdrawal of the culprit drug.'
        role: central_effector
        biological_scale: TISSUE
        conforms_to: vegf_inhibitor_hypertension#Vasoconstriction and Increased Peripheral Vascular Resistance
        cell_types:
        - preferred_term: vascular smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        - preferred_term: vascular endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        locations:
        - preferred_term: blood vessel
          term:
            id: UBERON:0001981
            label: blood vessel
        biological_processes:
        - preferred_term: vasoconstriction
          term:
            id: GO:0042310
            label: vasoconstriction
          modifier: INCREASED
      selected_evidence:
        snippet: Cancer therapy-induced hypertension is often dose limiting, increases cardiovascular
          mortality in cancer survivors, and is usually reversible after interruption or discontinuation
          of treatment.
        supports: SUPPORT
