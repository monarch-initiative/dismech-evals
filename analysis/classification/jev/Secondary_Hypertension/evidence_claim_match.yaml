      assertion:
        name: VEGF Pathway Inhibitor Exposure
        description: Drug-induced secondary hypertension arising from anticancer agents that block vascular
          endothelial growth factor signalling — the anti-VEGF antibody bevacizumab, the VEGF trap aflibercept,
          the VEGFR2 antibody ramucirumab, and the VEGF signalling pathway tyrosine kinase inhibitors
          (sunitinib, sorafenib, axitinib, pazopanib, lenvatinib, cabozantinib). This is curated as one
          worked exemplar of the "certain drugs" cause named in this entry's description; other pharmacological
          causes of secondary hypertension (NSAIDs, combined oral contraceptives, glucocorticoids, calcineurin
          inhibitors, sympathomimetics) are equally in scope for this entry but are not yet modelled.
        role: trigger
        biological_scale: MOLECULAR
        conforms_to: vegf_inhibitor_hypertension#VEGF Signaling Pathway Inhibition
        cell_types:
        - preferred_term: vascular endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: vascular endothelial growth factor receptor signaling pathway
          term:
            id: GO:0048010
            label: vascular endothelial growth factor receptor signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: One of the most common side effects of these drugs is hypertension, especially in patients
          treated with vascular endothelial growth factor inhibitors, as well as tyrosine kinase inhibitors
          and proteasome inhibitors.
        supports: SUPPORT
