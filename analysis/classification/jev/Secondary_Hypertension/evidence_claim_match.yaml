      assertion_type: Pathophysiology
      assertion:
        name: Sympathetic and hormonal coactivation
        description: A common theme across several of the non-pharmacological causes of secondary hypertension,
          in which sympathetic drive and hormonal axes are coactivated and blood-pressure regulation is
          reset upward. The causes this node is curated for are renal parenchymal disease, renovascular
          disease and obstructive sleep apnea, where increased sympathetic outflow is an established contributor.
        role: central_effector
        biological_scale: ORGANISM
        biological_processes:
        - preferred_term: regulation of systemic arterial blood pressure
          term:
            id: GO:0003073
            label: regulation of systemic arterial blood pressure
          modifier: DYSREGULATED
        notes: 'Deliberately scoped rather than exhaustive. The supporting source says a common theme
          across SEVERAL contributors, so this node claims no more than that, and it is not asserted as
          the route for every cause named in the entry''s description. Two are excluded on mechanism:
          primary aldosteronism reaches hypertension through renin-independent mineralocorticoid-receptor
          signalling and ENaC-mediated sodium and volume retention, with reciprocal renin suppression
          rather than sympathetic coactivation; and coarctation is substantially mechanical. Both still
          converge on the Hypertension phenotype, which is where the entry models the shared endpoint
          - the shared endpoint is the phenotype, not this mechanism. Pheochromocytoma is at best a partial
          fit, since catecholamine release from the tumour is not under normal neural control. Curating
          those routes as their own nodes is the natural follow-up.'
      selected_evidence:
        snippet: A common theme across several contributors to SH are coactivation of the sympathetic
          drive and hormonal changes, independent of hormonal axis activation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
