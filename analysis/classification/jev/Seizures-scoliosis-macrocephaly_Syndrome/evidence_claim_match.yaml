        kind: INTERPRETATION
        status: OPEN
        prompt: How should the nonsense/splice candidate be interpreted without assuming either a confirmed
          AREXT2 diagnosis or universal human null lethality?
        attaches_to:
        - genetic#EXT2
        rationale: The 2021 radiogenomics series describes one possible AREXT2 patient with maternal p.Trp79Ter
          and paternal c.1404+2T>C variants, but explicitly requests functional work and leaves syndrome
          attribution unclear. Its short stature, congenital heart disease, hearing loss, hemimegalencephaly
          and bilateral iris coloboma therefore remain scoped candidate findings rather than automatically
          entering the confirmed AREXT2 phenotype set. The whole 15-patient skeletal-dysplasia cohort
          is not an AREXT2 denominator. PMID:35045016 is a later title-only accessible record; without
          its case text, patient identity and follow-up conclusions are not assumed.
      selected_evidence:
        snippet: It is unclear whether patient 13 has AREXT2 thus, functional work is required.
        supports: SUPPORT
