      assertion_type: ICIMDAssignment
      assertion:
        classification_value: o_linked_protein_glycosylation
        notes: ICIMD disorders of O-linked protein glycosylation include glycosaminoglycan synthesis.
          EXT2 participates in HS biosynthesis on the O-linked proteoglycan linker. The classification
          follows the biosynthetic mechanism, not a claim that every measured fluid has low HS or that
          urinary HS excludes a mucopolysaccharidosis.
      selected_evidence:
        snippet: AREXT2 syndrome can be considered as a multiorgan Congenital Disorder of Glycosylation
          caused by a significant, but non-lethal, decrease in EXT2 expression, thereby affecting the
          synthesis of the heparan sulfate proteoglycans, which is relevant in many physiological processes.
        supports: SUPPORT
