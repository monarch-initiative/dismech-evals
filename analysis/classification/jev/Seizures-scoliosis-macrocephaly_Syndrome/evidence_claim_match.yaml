              label: seizures-scoliosis-macrocephaly syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced EXT2 Protein Availability
        biological_scale: MOLECULAR
        description: The founding homozygous complex p.Met87Arg/p.Arg95Cys allele reduces EXT2 abundance
          in cultured patient fibroblasts and reconstructed COS-7/HEK293 cells. Each substitution contributes,
          with the larger effect from p.Arg95Cys and the greatest decrease when both are present. These
          protein-expression experiments do not establish an activity fraction for every AREXT2 allele.
        genes:
        - preferred_term: EXT2
          term:
            id: hgnc:3513
            label: EXT2
      selected_evidence:
        snippet: We also performed an in vitro assay to determine which mutation has a larger effect on
          protein expression and observed reduced EXT2 expression in constructs expressing either one
          of the mutations but a greater reduction when both residues were mutated.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26246518
      reference_title: 'Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads
        to seizure and developmental disorder, no exostoses.'
      evidence_source: IN_VITRO
      explanation: Constructs carrying either substitution lowered protein abundance; the double-substitution
        construct lowered it further. These are substitutions on the same complex allele, and the assay
        does not directly quantify residual glycosyltransferase activity.
