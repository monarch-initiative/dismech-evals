        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do EXT2 families differ in head-size direction, and which developmental processes
          cause their individual craniofacial findings?
        attaches_to:
        - phenotypes#Microcephaly
        - phenotypes#Hypertelorism
        - phenotypes#Coarse facial features
        - phenotypes#High forehead
        - phenotypes#Prominent forehead
        - phenotypes#Long philtrum
        - phenotypes#Preauricular pit
        - phenotypes#Broad nasal tip
        - phenotypes#Flat forehead
        rationale: The founding authors offer a model-based neural explanation for macrocephaly, which
          is represented. It does not establish the mechanism of postnatal microcephaly in the El-Bazzal
          brothers or prove an allele-specific residual-HS threshold. Facial traits are distinct observations,
          not interchangeable consequences of head size. General HS-dependent morphogenesis is plausible,
          but the reviewed human reports do not map orbital spacing, forehead dimensions, philtral length,
          preauricular pits or nasal shape to a defined neural-crest or skeletal process. Coarse facies
          do not demonstrate lysosomal storage.
      selected_evidence:
        snippet: We report a consanguineous family where 2 boys presented with developmental delay, hypotonia,
          microcephaly, seizures, gastro-intestinal abnormalities, osteopenia, and neurological regression.
        supports: SUPPORT
