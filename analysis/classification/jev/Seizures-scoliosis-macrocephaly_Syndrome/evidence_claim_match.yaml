        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does abnormal cartilage differentiation explain the variable human spinal curves and bone
          density, or only the modeled exostosis route?
        attaches_to:
        - pathophysiology#Abnormal Chondrocyte Differentiation
        - phenotypes#Scoliosis
        - phenotypes#Kyphosis
        - phenotypes#Osteopenia
        - phenotypes#Overlapping toe
        - phenotypes#Multiple exostoses
        - phenotypes#Cervical segmentation defect
        rationale: The Ext2 mouse study provides a qualified cartilage-differentiation route to exostoses,
          and Gentile explicitly proposes genotype dependence in the human exostosis-positive family.
          That evidence does not establish that the same cartilage lesion causes scoliosis, kyphosis,
          reduced bone density or overlapping toes. Human growth-plate morphology, the effects of mobility
          and nutrition, and anatomic thresholds were not separated. Scoliosis narrative/table disagreement
          and absent skeletal findings in Gupta prevent a uniform-frequency claim. A supported model mechanism
          is retained; translation to each other skeletal feature remains unresolved. The cervical segmentation
          defect is a developmental anatomical observation, not proof of the later cartilage-differentiation
          mechanism.
      selected_evidence:
        snippet: Significantly, all of the mice showed multiple abnormalities in cartilage differentiation,
          including disorganization of chondrocytes in long bones and premature hypertrophy in costochondral
          cartilage.
        supports: SUPPORT
        directness: INDIRECT
