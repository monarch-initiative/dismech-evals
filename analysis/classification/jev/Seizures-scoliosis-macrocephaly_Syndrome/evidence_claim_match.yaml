        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_arext2_regression_behavior
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What explains early regression and behavioral variability when the same EXT2/NDST1 genotype
          occurs in twins with different severity?
        attaches_to:
        - phenotypes#Developmental regression
        - phenotypes#Autism
        - phenotypes#Aggressive behavior
        - phenotypes#Motor stereotypy
        - phenotypes#Sleep disturbance
        rationale: Gupta’s verbal/social regression at 27 months preceded seizures at ten years, so the
          seizure-injury route cannot explain that episode. The proband had voltage-gated potassium-channel
          antibodies and a reported transient immunotherapy response, but the study does not establish
          an autoimmune cause of the entire phenotype. Both twins carried the same EXT2 pair and monoallelic
          NDST1 VUS, making its proposed modifier effect unproven. Autism, aggression, rocking and nonspecific
          sleep difficulty are documented, but no experiment attributes each to a particular HS-dependent
