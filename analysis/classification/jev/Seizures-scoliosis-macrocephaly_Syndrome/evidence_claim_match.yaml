        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_arext2_renal_vascular_visceral
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which renal and other visceral observations are intrinsic to EXT2 dysfunction, and which
          reflect comorbidity or secondary injury?
        attaches_to:
        - phenotypes#Abnormal renal physiology
        - phenotypes#Hematuria
        - phenotypes#Proteinuria
        - phenotypes#Hypertension
        - phenotypes#Cerebral hemorrhage
        - phenotypes#Ventricular septal defect
        - phenotypes#Abnormal liver physiology
        - phenotypes#Bilateral cryptorchidism
        - phenotypes#Precocious puberty
        - phenotypes#Extremities cold to touch
        rationale: 'Renal findings require special attribution: II-3 had hemolytic uremic syndrome and
          dialysis, so renal failure is not direct proof of an EXT2 glomerular lesion. Hematuria and proteinuria
          in another sibling remain unexplained; the reports do not establish altered renal HS as their
          cause. Brain hemorrhage lacks timing and vascular mechanism, and must not be equated automatically
          with II-4’s status-associated injury. Hypertension, unspecified hepatic dysfunction, ventricular
          septal defects, bilateral cryptorchidism and precocious puberty are clinically documented but
          lack feature-specific physiological or developmental attribution in the reviewed sources. Maternal
          gestational hypertension is excluded from the child phenotype. Cold extremities do not establish
          vasospasm, neuropathy or impaired circulation as the causal route.'
      selected_evidence:
        snippet: he developed hemolytic uremic syndrome and required peritoneal dialysis.
        supports: SUPPORT
