        - phenotypes#Broad-based gait
        rationale: The genetic cause of the defining seizure-developmental syndrome is retained, but the
          sources do not establish the circuit mechanisms selecting focal versus generalized seizures
          or progression to status. Status-associated brain injury explains a specific acquired motor
          deficit, not baseline hypotonia or the broad-based gait in a different sibling. Hypotonia is
          absent in the Gupta proband; central versus peripheral contributions were not resolved in the
          reviewed families. A coarse tremor lacks physiological classification, and a broad-based gait
          alone does not establish cerebellar degeneration. These are unresolved mediators/localizations
          rather than a requirement for complete pathway reconstruction.
