        context: []
      assertion_type: Definition
      assertion:
        name: ESID working definition
        definition_type: DIAGNOSTIC_CRITERIA
        description: 'Substantially more stringent than the IUIS definition: IgM more than 2 standard
          deviations below the age-matched mean, preserved IgG and IgA, infections present, normal IgG
          subclasses and vaccination responses, and T-cell defects excluded. Requiring infection as a
          criterion is what makes the two sets select different patients, and is the specific point the
          2025 cohort study challenges.'
      selected_evidence:
        snippet: ESID working criteria for clinical diagnosis of IEIs are even more stringent, requiring,
          along with IgM deficiency (<2 standard deviations [SD] below age-matched mean), preserved IgG
          and IgA, the presence of infections, normal concentrations of IgG subclasses and vaccination
          responses, and exclusion of T-cell defects
        supports: SUPPORT
