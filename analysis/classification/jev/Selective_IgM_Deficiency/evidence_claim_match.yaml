      reference_title: 'Expanding the Spectrum of Selective IgM Deficiency: From Infections to Immune
        Dysregulation.'
      evidence_source: OTHER
      explanation: 'States both halves of what this node can claim: the biological role of the missing
        isotype, and the fact that the consequence of losing it is not established. The sentence is the
        review''s framing rather than its own result.'
      quote_role: BACKGROUND
