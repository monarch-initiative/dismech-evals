  97c32e1705b2edfb15ed3c15bea3d4bc2f0c7816a0e819ce56fb503edb1c33ad:
    claim:
      about:
        disease:
          name: Selective IgM Deficiency
          disease_term:
            preferred_term: selective IgM deficiency
            term:
              id: MONDO:0018039
              label: selective IgM deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sigmd_no_curated_treatments
        kind: KNOWLEDGE_GAP
        attaches_to:
        - treatments#
        prompt: Is there trial evidence for any treatment directed at selective IgM deficiency?
        rationale: 'Four interventions are now curated, all from a review''s compilation of what may benefit
          these patients, and none of them from a trial. The review says in as many words that no conclusive
          data on correct therapeutic management are available. So what is missing is not a described
          intervention - the earlier version of this discussion claimed that, and was wrong - but a controlled
          comparison of any of them. Note also that none of the four is directed at the IgM deficit itself:
          antibiotics and vaccination address infection risk, immunoglobulin replacement addresses an
          associated antibody deficiency where one is present, and atopy management addresses the commonest
          manifestations. A treatment that raises IgM, or that is shown to change outcome in an unselected
          SIgMD population, does not exist.'
      selected_evidence:
        snippet: No conclusive data on the correct therapeutic management of SIgMD are available.
        supports: SUPPORT
