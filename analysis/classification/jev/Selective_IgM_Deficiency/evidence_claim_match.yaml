  66d18ce5b14999771b14328c72e25f4623813e3380fcf55c0d1616d4364368ee:
    claim:
      about:
        disease:
          name: Selective IgM Deficiency
          disease_term:
            preferred_term: selective IgM deficiency
            term:
              id: MONDO:0018039
              label: selective IgM deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Persistently Reduced Serum IgM
        biological_scale: ORGANISM
        description: 'The defining abnormality, and the only node this entry asserts. IgM is the first
          antibody isotype produced in a humoral response and has a central role in early immune defence,
          so a persistent deficit is mechanistically plausible as a cause of the infection phenotype.
          No step upstream of this node is established: no gene, no cellular defect in B-cell terminal
          differentiation, and no regulatory mechanism has been shown to cause it. The node is deliberately
          left without an upstream cause rather than given a speculative one.'
      selected_evidence:
        snippet: IgM plays a central role in early immune responses, yet the clinical significance of
          its deficiency remains poorly defined.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
