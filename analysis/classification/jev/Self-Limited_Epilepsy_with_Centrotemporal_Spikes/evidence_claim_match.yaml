      reference: PMID:39361977
      reference_title: 'Epidemiology of self-limited epilepsy with centrotemporal spikes (SeLECTS): A
        population study using primary care records.'
      evidence_source: HUMAN_CLINICAL
      explanation: A dissenting population estimate, recorded deliberately. This Welsh primary-care cohort
        found SeLECTS in only 3% of childhood epilepsy and an incidence of 1.1/100,000/year - an order
        of magnitude below the 7-21 per 100,000 this record encodes. Recorded as REFUTE because it contradicts
        the rate rather than qualifying it. The authors attribute the difference to under-recording in
        primary-care coding, but the discrepancy is large enough that the recorded rate should be read
        as ascertainment-dependent.
