          disease_term:
            preferred_term: self-limited epilepsy with centrotemporal spikes
            term:
              id: MONDO:0007295
              label: self-limited epilepsy with centrotemporal spikes
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_selects_epilepsy_aphasia_spectrum_progression
        prompt: What determines whether a child with centrotemporal spikes stays at the benign SeLECTS
          end of the epilepsy-aphasia spectrum or progresses toward the severe end (atypical benign focal
          epilepsy, epileptic encephalopathy with spike-and-wave activation in sleep, Landau-Kleffner
          syndrome)?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Sleep-Activated Centrotemporal Epileptiform Discharges
        - pathophysiology#Transient Language and Cognitive Dysfunction
        rationale: SeLECTS is the mild anchor of a continuum whose severe end carries lasting language
          and cognitive morbidity. GRIN2A variants are enriched at the severe end and are essentially
          absent from classic SeLECTS, but they explain only a minority even of severe cases, so the factors
          (genetic, EEG burden in sleep, others) that tip a given child toward encephalopathic outcome
          are largely unknown. Because the severe end is where irreversible harm occurs, predicting and
          preventing progression is the central clinical question of the spectrum.
        proposed_experiments:
        - experiment_id: exp_selects_progression_predictors
          name: Predictors of progression along the epilepsy-aphasia spectrum
          description: In a prospective centrotemporal-spike cohort, relate sleep EEG spike burden, genotype,
            and early language measures to progression toward atypical/encephalopathic outcomes, to identify
            early predictors.
          experiment_type:
            preferred_term: prospective predictor cohort experiment
          readouts:
          - name: Progression versus baseline predictors
            target: pathophysiology#Transient Language and Cognitive Dysfunction
            assays:
            - preferred_term: electroencephalography
            - preferred_term: neuropsychological assessment
            direction: POSITIVE
          controls:
          - name: Non-progressing SeLECTS
            description: Children with typical self-limited course as comparators.
          decision_criterion: A predictor is supported if it separates children who progress to the severe
            end from those with typical remission.
          would_support:
          - pathophysiology#Transient Language and Cognitive Dysfunction
      selected_evidence:
        snippet: GRIN2A mutation was found in 11.1% (1 out of 9 cases) of LKS, and in 7.1% (3 out of 42
          cases) of ABPE, but in none with ECSWS and BECTS.
        supports: SUPPORT
