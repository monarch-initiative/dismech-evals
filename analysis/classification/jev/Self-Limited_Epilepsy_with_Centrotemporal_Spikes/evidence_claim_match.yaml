            id: hgnc:4585
            label: GRIN2A
          description: 'Contributes at the severe/atypical end of the epilepsy-aphasia spectrum rather
            than to typical SeLECTS: the cited series found GRIN2A mutations in Landau-Kleffner syndrome
            and atypical benign partial epilepsy, but in none of its ECSWS or BECTS patients.'
