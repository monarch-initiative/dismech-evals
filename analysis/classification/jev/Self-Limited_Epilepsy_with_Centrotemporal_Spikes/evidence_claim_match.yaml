        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_selects_cts_trait_penetrance_and_language_pleiotropy
        prompt: Why do only some carriers of the heritable centrotemporal-sharp-wave (CTS) EEG trait develop
          clinical seizures, and how does the same 11p13/ELP4 locus connect the EEG trait to the associated
          speech and language difficulties?
        kind: EMERGING_HYPOTHESIS
        status: OPEN
        attaches_to:
        - pathophysiology#Genetic Predisposition to Cortical Hyperexcitability
        - pathophysiology#Transient Language and Cognitive Dysfunction
        rationale: The CTS EEG trait maps to 11p13/ELP4 and is far more common than clinical SeLECTS,
          so most trait carriers never have seizures - the determinants of this incomplete, age-dependent
          penetrance are unknown. The same locus shows pleiotropy with developmental verbal dyspraxia,
          hinting that the EEG trait and the language phenotype share a developmental substrate. Whether
          ELP4 regulatory variation sets a cortical-excitability and language-network vulnerability that
          only sometimes crosses the seizure threshold is an open, testable hypothesis.
        proposed_experiments:
        - experiment_id: exp_selects_elp4_penetrance
          name: ELP4 regulatory variation, excitability, and language
          description: In carriers stratified by ELP4 regulatory genotype, relate cortical excitability
            measures and language-network function to seizure occurrence, testing whether the same variation
            grades both excitability and language vulnerability.
          experiment_type:
            preferred_term: genotype-endophenotype stratification experiment
          readouts:
          - name: Excitability and language by genotype and seizure status
            target: pathophysiology#Genetic Predisposition to Cortical Hyperexcitability
            assays:
            - preferred_term: electroencephalography
            - preferred_term: language assessment
            direction: POSITIVE
          controls:
          - name: Non-carrier controls
            description: Individuals without the CTS-associated 11p13 genotype.
          decision_criterion: The hypothesis is supported if ELP4 regulatory genotype grades both cortical
            excitability and language-network measures, with seizures occurring above an excitability
            threshold.
          would_support:
          - pathophysiology#Genetic Predisposition to Cortical Hyperexcitability
      selected_evidence:
        snippet: with genome-wide linkage of CTS to 11p13 (HLOD 4.30).
        supports: SUPPORT
