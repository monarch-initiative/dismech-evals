    evidence_metadata:
      reference: PMID:34039076
      reference_title: Differential Clinical Features in Colombian Patients With Rolandic Epilepsy and
        Suggestion of Unlikely Association With GRIN2A, RBFOX1, or RBFOX3 Gene Variants.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Establishes febrile seizures as a personal antecedent in a fifth of a rolandic epilepsy
        cohort. Two cautions apply. The support is indirect: a cohort prevalence shows the co-occurrence
        the edge posits, but does not itself demonstrate that a shared inherited susceptibility produces
        both, which is why the edge is typed INDIRECT_UNKNOWN_INTERMEDIATES. And the authors describe
        this Colombian cohort as "clearly different from other cohorts", with earlier onset and unusually
        prevalent febrile seizures and parasomnias, so the 20% figure should not be read as a general
        SeLECTS prevalence.'
