      assertion:
        name: Bony Dehiscence of Semicircular Canal
        description: 'An abnormal opening or thinning in the bone overlying the superior semicircular
          canal creates a pathological third mobile window in the inner ear, in addition to the oval and
          round windows. Dehiscence is best understood as the product of two hits: a congenital developmental
          thin-bone substrate (failure of postnatal otic capsule ossification, generalized skull base
          deficiency) and an acquired second hit from age-related remodeling or environmental triggers
          (trauma, Valsalva-type pressure events, noise/pressure exposure).'
        locations:
        - preferred_term: superior semicircular canal
          term:
            id: UBERON:0001841
            label: anterior semicircular canal
        - preferred_term: otic capsule
          term:
            id: UBERON:0005411
            label: bony otic capsule
      selected_evidence:
        snippet: Histopathologic examination of the right ear showed a 1.4 x 0.6-mm dehiscence of bone
          covering the superior canal. Dura was in direct contact with the endosteum and the membranous
          duct at the level of the dehiscence.
        supports: SUPPORT
