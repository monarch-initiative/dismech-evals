        description: Inner-ear disorder with overlapping episodic vertigo, tinnitus, and aural symptoms
          that can mimic SCDS.
        distinguishing_features:
        - SCDS more often has sound- and pressure-evoked symptoms (Tullio/Hennebert phenomena).
        - Physiologic third-window findings (low-threshold VEMP, low-frequency air-bone gap with intact
          middle ear) favor SCDS.
