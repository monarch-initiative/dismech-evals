      about:
        disease:
          name: Semicircular Canal Dehiscence Syndrome
          disease_term:
            preferred_term: semicircular canal dehiscence syndrome
            term:
              id: MONDO:0018484
              label: semicircular canal dehiscence syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Developmental Otic Capsule Bone Deficiency
        description: 'Incomplete postnatal ossification of the bone overlying the superior semicircular
          canal produces a constitutionally thin otic capsule that persists into adulthood in a subset
          of individuals. The bone over the superior canal is uniformly thin at birth and normally thickens
          through early childhood; failure of this maturation leaves a stable population of adults with
          thin (but not yet dehiscent) bone that is the substrate for later acquired dehiscence ("Hit
          1" of the two-hit model). The deficiency is not focal: SCDS patients show generalized thinning
          of the otic capsule and skull base.'
        locations:
        - preferred_term: superior semicircular canal
          term:
            id: UBERON:0001841
            label: anterior semicircular canal
        - preferred_term: otic capsule
          term:
            id: UBERON:0005411
            label: bony otic capsule
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: endochondral ossification of the otic capsule
          term:
            id: GO:0001958
            label: endochondral ossification
          modifier: DECREASED
      selected_evidence:
        snippet: Specimens from infants demonstrated uniformly thin bone over the superior canal in the
          middle fossa at birth, with gradual thickening until 3 years of age.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
