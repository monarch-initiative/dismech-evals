      assertion:
        name: EDS-Related Connective Tissue Disorder
        association: Risk Factor
        notes: Reported SSCD-Ehlers-Danlos cases have been hypermobility-type EDS (hEDS), whose genetic
          basis is heterogeneous and largely unmapped — most cases are not attributable to a single confirmed
          gene. The classical-EDS collagen genes (COL5A1, COL3A1, COL1A1) are mechanistically plausible
          candidates via shared collagen-matrix disruption, but no specific gene has been confirmed in
          SCDS-associated EDS cohorts. This entry is therefore curated as a connective-tissue-disorder
          risk class rather than a single-gene driver. Bilateral SSCD has been the consistent presenting
          pattern, suggesting a systemic collagen-matrix mechanism rather than a focal lesion.
      selected_evidence:
        snippet: Ehlers-Danlos syndrome (EDS) constitutes a group of genetic connective tissue disorders
          caused by a defect in the production, processing, or structure of collagen, or its associated
          proteins.
        supports: SUPPORT
