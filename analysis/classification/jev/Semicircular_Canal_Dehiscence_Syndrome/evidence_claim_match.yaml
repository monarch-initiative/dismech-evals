      assertion_type: Treatment
      assertion:
        name: Middle Fossa Craniotomy with Canal Plugging
        description: Surgical occlusion of the dehiscent superior semicircular canal via a middle cranial
          fossa craniotomy. The dehiscence is identified through the temporal lobe approach and the canal
          lumen is occluded with bone wax, fascia, or bone pâté to eliminate the third-window effect.
          This is the most established surgical option and the procedure of choice in most centers; canal
          plugging achieves long-term symptom control more often than resurfacing.
        treatment_term:
          preferred_term: middle cranial fossa craniotomy with canal plugging
          term:
            id: NCIT:C15214
            label: Craniotomy
      selected_evidence:
        snippet: Canal plugging was performed in 9 and resurfacing of the canal without plugging of the
          lumen in 11 patients. Complete resolution of vestibular symptoms and signs was achieved in 8
          of the 9 patients after canal plugging.
        supports: SUPPORT
