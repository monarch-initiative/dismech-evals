        presence: Modifying
        description: Post-menopausal estrogen decline is hypothesized to accelerate otic capsule bone
          loss through reduced OPG-mediated suppression of osteoclastogenesis (see the "Loss of OPG-Mediated
          Suppression of Otic Capsule Bone Remodeling" pathophysiology node). Selective SSC bone thinning
          has been observed in women over 45, consistent with menopausal contribution; SCDS surgical cohorts
          show a consistent female predominance (~57-66% female across series). However, cross-sectional
          CT cohorts have not detected an overall sex difference in baseline SSC bone thickness, indicating
          that any hormonal effect is likely age-restricted rather than constitutive.
        effect: May contribute to bone-erosion phase (Hit 2) in older women through estrogen-OPG-RANKL
          signaling.
      selected_evidence:
        snippet: However, superior semicircular canal dehiscence (SSCD) was more prevalent among females
          over 45 years old.
        supports: SUPPORT
