              serve as precipitating events for symptom onset by acutely fracturing or disrupting pre-thinned
              bone. In the largest surgical cohort to date, internal Valsalva-type events were the most
              common identified preceding event among patients reporting a clear trigger. The exposure_term
              is bound to sound radiation; the pressure component is not separately ontology-bound (no
              clean ECTO term for Valsalva-type acute pressure events).
            effect: Triggers vertigo, nystagmus, and dizziness episodes; can precipitate symptom onset.
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Abnormal Sound and Pressure Transmission
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: 'Distinct from the exposures above: these do not create the dehiscence, they provoke
          symptoms through it. Sound and pressure entering the third window is the Tullio and Hennebert
          phenomenon, which is why this targets the transmission node rather than the bony one.'
      selected_evidence:
        snippet: For the 60 patients with vestibular manifestations, symptoms induced by loud sounds were
          noted in 54 patients and pressure-induced symptoms (coughing, sneezing, straining) were present
          in 44.
        supports: SUPPORT
