      assertion:
        name: SLSN9
        display_name: Senior-Loken syndrome 9 (TRAF3IP1/IFT54)
        subtype_term:
          preferred_term: Senior-Loken syndrome 9
          term:
            id: MONDO:0014712
            label: Senior-Loken syndrome 9
        description: TRAF3IP1-related Senior-Loken syndrome. The gene encodes IFT54, a subunit of the
          intraflagellar transport B complex that carries axonemal cargo into the cilium; IFT54 docks
          at the ciliary transition fibres and transition zone, where it co-localises with CEP164, and
          the reported mutations keep it out of that compartment. The reported variants are hypomorphic
          and produce only mild structural ciliary defects; IFT54 additionally restrains cytoplasmic microtubule
          stability through MAP4, an extraciliary role that contributes to the phenotype. HGNC renamed
          TRAF3IP1 to IFT54 on 2026-03-20; the identifier hgnc:17861 is unchanged.
        genes:
        - preferred_term: TRAF3IP1
          term:
            id: hgnc:17861
            label: TRAF3IP1
      selected_evidence:
        snippet: Here we identified mutations in TRAF3IP1 (TNF Receptor-Associated Factor Interacting
          Protein 1) in eight patients from five families with nephronophthisis (NPH) and retinal degeneration,
          two of the most common manifestations of ciliopathies.
        supports: SUPPORT
