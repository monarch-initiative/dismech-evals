      assertion_type: Pathophysiology
      assertion:
        name: Ciliary Transition Zone Dysfunction
        conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
        description: 'The unifying upstream lesion of Senior-Loken syndrome is dysfunction of the ciliary
          base. The nephrocystin proteins encoded by the SLSN genes localize to the transition zone of
          renal and respiratory cilia and to the photoreceptor connecting cilium, where they gate ciliary
          membrane composition and bidirectional cargo transport. Loss of these proteins produces a structurally
          present but functionally incompetent cilium that cannot correctly compartmentalize signaling
          and phototransduction machinery, biasing the downstream phenotype toward the renal tubule and
          the photoreceptor. The ten genes bound here are not all transition-zone proteins in the strict
          sense: they span the transition zone itself, the distal appendages that anchor it (CEP164),
          and the intraflagellar transport machinery that moves cargo through it (WDR19 in IFT-A, TRAF3IP1
          in IFT-B). They are grouped at this one node because each defect produces the same functional
          outcome - a structurally present cilium that cannot gate its own membrane or cargo - which is
          what the three biological processes recorded here describe.'
        biological_processes:
        - preferred_term: cilium assembly
          term:
            id: GO:0060271
            label: cilium assembly
          modifier: ABNORMAL
        - preferred_term: protein localization to cilium
          term:
            id: GO:0061512
            label: protein localization to cilium
          modifier: ABNORMAL
        - preferred_term: intraflagellar transport
          term:
            id: GO:0042073
            label: intraciliary transport
          modifier: ABNORMAL
