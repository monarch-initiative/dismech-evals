        context: []
      assertion_type: Subtype
      assertion:
        name: SLSN3
        display_name: Senior-Loken syndrome 3 (NPHP3)
        subtype_term:
          preferred_term: Senior-Loken syndrome 3
          term:
            id: MONDO:0011755
            label: senior-loken syndrome 3
        description: 'NPHP3-related Senior-Loken syndrome. NPHP3 encodes nephrocystin-3, a component of
          the nephronophthisis protein network that interacts with inversin at the ciliary Inv compartment.
          NPHP3 was originally defined as the adolescent nephronophthisis locus on chromosome 3q, and
          the SLSN3 designation denotes the renal-retinal form linked to that locus. The gene attribution
          here rests on the literature rather than on MONDO: MONDO:0011755 carries neither a textual definition
          naming a gene nor a causal-gene OWL axiom, and the separate NPHP3 gene class MONDO:0011456 nephronophthisis
          3 is filed under nephronophthisis rather than under Senior-Loken syndrome. That isolated-nephronophthisis
          concept is bound on the NPHP3-related row of kb/disorders/Nephronophthisis.yaml; this row is
          the renal-retinal form.'
        genes:
        - preferred_term: NPHP3
          term:
            id: hgnc:7907
            label: NPHP3
      selected_evidence:
        snippet: Linkage to the NPHP3 locus has been shown in families with Senior-Løken syndrome (Omran
          et al., 2002).
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/0
