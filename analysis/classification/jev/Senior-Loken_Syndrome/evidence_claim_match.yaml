  d3393b1fe9393c7dd179f1c497ff0375ae8875bb171c3ffc3df77fcd0f13dab9:
    claim:
      about:
        disease:
          name: Senior-Loken Syndrome
          disease_term:
            preferred_term: Senior-Loken syndrome
            term:
              id: MONDO:0017842
              label: Senior-Loken syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: SLSN4
        display_name: Senior-Loken syndrome 4 (NPHP4)
        subtype_term:
          preferred_term: Senior-Loken syndrome 4
          term:
            id: MONDO:0011756
            label: Senior-Loken syndrome 4
        description: NPHP4-related Senior-Loken syndrome. NPHP4 encodes nephrocystin-4 (HGNC alias name
          nephroretinin; HGNC also carries SLSN4 as an alias symbol for this gene), which forms a complex
          with nephrocystin-1 at the ciliary transition zone and interacts with RPGR and RPGRIP1, which
          has been proposed as the link to retinal degeneration in NPHP4 patients. NPHP4 accounts for
          a small minority of molecularly solved Senior-Loken syndrome. In the case series cited below,
          patients carrying INVS, NPHP3 or NPHP4 variants developed nephropathy before retinopathy, the
          reverse of the CEP290 and IQCB1 order; that finding is reported for the three genes together
          rather than for NPHP4 alone.
        genes:
        - preferred_term: NPHP4
          term:
            id: hgnc:19104
            label: NPHP4
      selected_evidence:
        snippet: Variants in 5 genes were identified in 74 patients from 70 unrelated families, including
          CEP290 (61.4%), IQCB1 (28.6%), NPHP1 (4.2%), NPHP4 (2.9%), and WDR19 (2.9%).
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/2
      evidence_path: /has_subtypes/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36990420
      reference_title: Pathogenic Variants in CEP290 or IQCB1 Cause Earlier-Onset Retinopathy in Senior-Loken
        Syndrome Compared to Those in INVS, NPHP3, or NPHP4.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies NPHP4 as one of the five genes carrying biallelic variants in a molecularly
        solved Senior-Loken syndrome case series, and quantifies its share of that cohort.
