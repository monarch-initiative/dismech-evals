          term:
            id: hgnc:7905
            label: NPHP1
        - preferred_term: IQCB1
          term:
            id: hgnc:28949
            label: IQCB1
        - preferred_term: CEP290
          term:
            id: hgnc:29021
            label: CEP290
        - preferred_term: SDCCAG8
          term:
            id: hgnc:10671
