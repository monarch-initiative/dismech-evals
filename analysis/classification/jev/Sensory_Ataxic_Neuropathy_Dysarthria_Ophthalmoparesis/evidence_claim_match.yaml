        description: 'Accumulation of deleted and depleted mtDNA reduces the supply of mtDNA-encoded respiratory-chain
          subunits, impairing oxidative phosphorylation. In skeletal muscle this manifests histologically
          as ragged-red and cytochrome c oxidase (COX)-negative fibers; in long sensory neurons of the
          dorsal root ganglia the bioenergetic deficit produces sensory ataxic neuropathy.

          '
        cell_types:
