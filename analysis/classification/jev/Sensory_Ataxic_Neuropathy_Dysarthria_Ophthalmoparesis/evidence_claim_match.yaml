      assertion_type: Pathophysiology
      assertion:
        name: Polymerase Gamma Dysfunction and mtDNA Instability
        description: 'Biallelic POLG variants impair the catalytic and proofreading activity of mitochondrial
          DNA polymerase gamma, the sole replicative polymerase of the mitochondrial genome. This disrupts
          mitochondrial DNA replication, leading to accumulation of multiple large-scale mitochondrial
          DNA deletions and, in some tissues, mitochondrial DNA depletion. The resulting clonal expansion
          of deleted mtDNA species compromises mitochondrial genome integrity.

          '
        genes:
        - preferred_term: POLG
          term:
            id: hgnc:9179
            label: POLG
        cell_types:
        - preferred_term: dorsal root ganglion sensory neuron
          term:
            id: CL:1001451
            label: sensory neuron of dorsal root ganglion
        biological_processes:
        - preferred_term: mitochondrial DNA replication
          term:
            id: GO:0006264
            label: mitochondrial DNA replication
          modifier: DECREASED
        - preferred_term: mitochondrial DNA repair / proofreading
          term:
            id: GO:0006281
            label: DNA repair
          modifier: DECREASED
      selected_evidence:
        snippet: Mutations in POLG gene are responsible for a wide spectrum of clinical disorders with
          altered mitochondrial DNA (mtDNA) integrity, including mtDNA multiple deletions and depletion.
        supports: SUPPORT
