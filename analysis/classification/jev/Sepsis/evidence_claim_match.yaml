              id: MONDO:1040015
              label: infectious disease with sepsis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: bioenergetic_failure_model
        hypothesis_label: Oxidative Stress and Mitochondrial Bioenergetic Failure Model
        status: ALTERNATIVE
        description: An alternative, non-exclusive account holds that organ dysfunction in sepsis is driven
          less by perfusion failure than by a cellular inability to use oxygen. Overwhelming reactive
          species production with failure of antioxidant systems produces mitochondrial injury, so that
          organs fail despite adequate delivery of oxygen. This is offered as a complementary rather than
          competing mechanism, and it predicts that restoring macrocirculatory flow alone will not reverse
          organ dysfunction.
        notes: The two hypothesis groups are curated as complementary. No evidence here establishes the
          relative contribution of microcirculatory versus bioenergetic failure to organ dysfunction in
          an individual patient, and the causal edges are annotated accordingly rather than ranked.
      selected_evidence:
        snippet: The loss of the redox balance, together with a systemic inflammatory response during
          sepsis, can lead to progressive and irreversible mitochondrial failure, energy depletion, hypoxia,
          septic shock, severe sepsis, multiple organ dysfunction and death of the patient.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24690420
      reference_title: Sepsis, mitochondrial failure and multiple organ dysfunction.
      evidence_source: OTHER
      explanation: States the redox/mitochondrial route to multiple organ dysfunction that defines this
        hypothesis group.
