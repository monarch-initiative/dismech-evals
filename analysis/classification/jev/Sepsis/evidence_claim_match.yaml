            term:
              id: MONDO:1040015
              label: infectious disease with sepsis
        context: []
      assertion_type: Treatment
      assertion:
        name: Source Control of the Infectious Focus
        description: Drainage of an abscess, debridement of infected necrotic tissue, or removal of an
          infected device is the second intervention directed at the initiating infection. The guideline
          recommends rapidly identifying or excluding an anatomical focus that requires emergent source
          control, and implementing it as soon as medically and logistically practical.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: source control intervention
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
        notes: 'NCIT has no clinical-action term for source control as a concept, so the generic Therapeutic
          Procedure term is used. Its instances are heterogeneous by design - percutaneous drainage, open
          debridement, and device removal are all source control - and binding any one of them (for example
          Drainage, NCIT:C50434) would name a single instance as though it were the category. The guideline
          gives no recommended timeframe: it states that the supporting studies suggest 6 to 12 hours
          but that the data are too limited to recommend a window.'
      selected_evidence:
        snippet: Source control may include drainage of an abscess, debriding infected necrotic tissue,
          removal of a potentially infected device
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
