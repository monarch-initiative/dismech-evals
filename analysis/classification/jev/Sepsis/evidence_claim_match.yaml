  942ecf3e40ab0df2d87f46d7eb49a313000bbb4f40fe50ce753677e0f67a947d:
    claim:
      about:
        disease:
          name: Sepsis
          disease_term:
            preferred_term: Sepsis
            term:
              id: MONDO:1040015
              label: infectious disease with sepsis
        context: []
      assertion_type: Treatment
      assertion:
        name: Low-Dose IV Hydrocortisone
        description: For septic shock with an ongoing vasopressor requirement the guideline suggests IV
          corticosteroids, in practice hydrocortisone 200 mg/day in divided doses. This is the intervention
          aimed at the dysregulated inflammatory arm of the host response rather than at perfusion or
          at the pathogen. The evidence behind it is faster shock resolution and more vasopressor-free
          days, without a clear effect on mortality, and the optimal dose, timing, and duration remain
          unsettled.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: hydrocortisone
            term:
              id: NCIT:C555
              label: Therapeutic Hydrocortisone
        notes: 'The benefit is not uniform across patients. Transcriptomic septic shock endotypes differ
          in their response, and a re-analysis of the VANISH trial associated corticosteroid exposure
          with increased mortality in one of them. This is curated as an open caveat on a guideline-recommended
          therapy, not as a contraindication: the endotypes are research instruments derived from leukocyte
          transcriptomes and are not measured at the bedside, so there is no way to act on the finding
          in an individual patient.'
      selected_evidence:
        snippet: The optimal dose, timing of initiation, and duration of corticosteroids remain uncertain;
          recent RCTs used 200 mg per day of IV hydrocortisone in divided doses
        supports: SUPPORT
