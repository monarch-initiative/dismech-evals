  dfc7cdf5586ddda9e70f735f2728eaf8db307974399ee832bb57021f6c482367:
    claim:
      about:
        disease:
          name: Sepsis
          disease_term:
            preferred_term: Sepsis
            term:
              id: MONDO:1040015
              label: infectious disease with sepsis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: disc_sepsis_grp78_cancer_susceptibility
        prompt: Does tumor-microenvironment-driven GRP78 dysregulation causally increase sepsis susceptibility,
          severity, or mortality in patients with cancer, over and above the recognized contributions
          of neutropenia, mucosal barrier injury, and immunosuppressive antineoplastic therapy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Invasive Infection and Pattern Recognition
        - pathophysiology#Sepsis-Induced Immunosuppression
        rationale: 'Patients with a history of cancer carry a large excess risk of acquiring and dying
          from sepsis, and sepsis and cancer are independently known to share immune defects, which makes
          a cancer-specific susceptibility mechanism biologically plausible. A 2026 narrative review proposes
          GRP78/HSPA5 dysregulation as that mechanism, acting both as a pathogen entry cofactor and as
          a secreted immunosuppressive signal. The proposal is explicitly hypothesis-level: the review
          states that no clinical cohort study has established a causal link, and that its argument rests
          on in vitro work, animal models, and non-oncologic sepsis cohorts. It is therefore curated here
          as an open gap attached to the trigger and immunosuppression nodes, rather than as a curated
          causal edge, a GRP78 pathophysiology node, or a separate cancer-associated sepsis disease entry
          - any of which would assert more than the evidence supports.'
        proposed_experiments:
        - experiment_id: exp_sepsis_grp78_oncology_cohort
          experiment_design: HUMAN_OBSERVATIONAL
          name: Oncology-specific prospective cohort of circulating GRP78 and sepsis outcome
          description: Measure circulating GRP78 at cancer diagnosis and at infection onset in a prospective
            oncology cohort, and test whether it predicts sepsis incidence, severity, and mortality after
            adjustment for neutropenia, mucositis, recent cytotoxic therapy, and tumor stage. This is
            the study the source review identifies as absent.
        notes: 'Opened in response to issue #6274. The scope question there offered four options; this
          discussion implements the conservative one. A conserved GRP78 sepsis mechanism module and a
          distinct Cancer-Associated Sepsis disease entry were both considered and deferred, because a
          module asserts a recurrent, evidenced mechanism and the source explicitly disclaims that evidence.
          If an oncology-specific cohort establishes the link, the natural home is a comorbidity entry
          over Sepsis and the relevant cancer entries.'
      selected_evidence:
        snippet: To date, no clinical cohort study has directly established a causal link between GRP78
          dysregulation and sepsis incidence or mortality in patients with cancer.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42429070
      reference_title: 'GRP78 dysregulation: A proposed molecular mechanism linking the tumor microenvironment
        to sepsis susceptibility in patients with cancer (Review).'
      evidence_source: OTHER
      explanation: The review's own statement that the causal link is unestablished is the primary justification
        for curating this as a KNOWLEDGE_GAP rather than as a mechanism.
