      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: thromboinflammatory_microcirculatory_model
        hypothesis_label: Thromboinflammatory Microcirculatory Failure Model
        status: CANONICAL
        description: Pathogen- and damage-associated molecular patterns drive dysregulated innate immune
          activation. Activated leukocytes, platelets, and endothelium engage in reciprocal amplification,
          degrading the endothelial glycocalyx, raising permeability, and activating coagulation while
          suppressing fibrinolysis. The resulting thromboinflammation obstructs and dysregulates the microcirculation,
          causing tissue hypoperfusion and organ dysfunction.
      selected_evidence:
        snippet: In addition, glycocalyx damage and vascular tone dysfunction impair microcirculatory
          blood flow, leading to organ injury and, potentially, life-threatening organ failure.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
