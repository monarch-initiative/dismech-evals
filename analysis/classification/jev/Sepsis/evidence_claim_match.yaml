      assertion:
        name: Septic shock
        display_name: Septic Shock
        classification: severity
        description: The subset of sepsis in which circulatory, cellular, and metabolic abnormalities
          are profound enough to substantially increase mortality, clinically identified by a vasopressor
          requirement to maintain mean arterial pressure of 65 mm Hg or greater together with a serum
          lactate above 2 mmol/L in the absence of hypovolemia. No MONDO term for human septic shock exists,
          so no subtype_term is bound.
      selected_evidence:
        snippet: Septic shock should be defined as a subset of sepsis in which particularly profound circulatory,
          cellular, and metabolic abnormalities are associated with a greater risk of mortality than with
          sepsis alone.
        supports: SUPPORT
