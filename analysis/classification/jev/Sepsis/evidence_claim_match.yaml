      assertion:
        name: Organ dysfunction scoring (SOFA)
        description: Sepsis is diagnosed by demonstrating organ dysfunction in a patient with suspected
          infection, and the Sequential Organ Failure Assessment score is the instrument that operationalizes
          it. An acute rise of 2 points or more is the Sepsis-3 threshold. The score is a characterization
          of the patient rather than a management tool, and its components require laboratory results,
          so it does not capture dysfunction the moment it begins.
        diagnosis_term:
          preferred_term: organ dysfunction scoring
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
        results: An acute increase of 2 or more SOFA points in a patient with suspected infection, graded
          by organ system.
        markers: PaO2, platelet count, creatinine level, bilirubin level
      selected_evidence:
        snippet: This definition codifies organ dysfunction using the Sequential Organ Failure Assessment
          score.
        supports: SUPPORT
