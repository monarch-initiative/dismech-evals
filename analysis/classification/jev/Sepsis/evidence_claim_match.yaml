              label: infectious disease with sepsis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: disc_sepsis_microcirculatory_vs_bioenergetic
        prompt: In an individual patient with sepsis, what determines the relative contribution of microcirculatory
          perfusion failure versus mitochondrial bioenergetic failure to organ dysfunction, and can the
          two be distinguished at the bedside well enough to select therapy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Microcirculatory Dysfunction and Tissue Hypoperfusion
        - pathophysiology#Mitochondrial Dysfunction and Bioenergetic Failure
        rationale: 'Both routes to multiple organ dysfunction are curated here with supporting evidence,
          and they are not mutually exclusive. Neither source quantifies the relative contribution, and
          there is no validated bedside measure that separates a perfusion-limited from an oxygen-utilization-limited
          patient. This matters therapeutically: resuscitation strategies target the former, and would
          not be expected to reverse the latter.'
      selected_evidence:
        snippet: Knowledge of the molecular processes associated with the development of oxidative stress
          should facilitate the development of effective therapies and better prognosis for patients with
          sepsis and organ dysfunction.
        supports: SUPPORT
