      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Innate Immune Activation
        description: 'Innate immune cells mount a proinflammatory program with cytokine and chemokine
          release, complement activation, neutrophil recruitment, and reactive oxygen species production.
          In sepsis this response is not merely large but unbalanced: hyperinflammation and immune suppression
          run concurrently rather than sequentially, which is why the syndrome resists treatment framed
          as either simple inflammation or simple immunodeficiency.'
        role: mediator
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Macrophage
          term:
            id: CL:0000235
            label: macrophage
        - preferred_term: Neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        biological_processes:
        - preferred_term: Positive regulation of inflammatory response
          modifier: INCREASED
          term:
            id: GO:0050729
            label: positive regulation of inflammatory response
        - preferred_term: Reactive oxygen species metabolic process
          modifier: INCREASED
          term:
            id: GO:0072593
            label: reactive oxygen species metabolic process
        - preferred_term: Neutrophil extracellular trap formation
          modifier: INCREASED
          term:
            id: GO:0140645
            label: neutrophil extracellular trap formation
      selected_evidence:
        snippet: This recently implemented definition does not capture the heterogeneity or the underlying
          pathophysiology of the syndrome, which is characterized by concurrent unbalanced hyperinflammation
          and immune suppression.
        supports: SUPPORT
