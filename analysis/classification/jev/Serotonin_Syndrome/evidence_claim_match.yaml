      assertion_type: Diagnosis
      assertion:
        name: Hunter Serotonin Toxicity Criteria
        description: Diagnosis is clinical. The Hunter criteria apply decision rules over clonus, agitation,
          diaphoresis, tremor, hyperreflexia, hypertonicity, and temperature in a patient on a serotonergic
          agent. In their derivation study they were reported as more sensitive and specific than the
          older Sternbach criteria, and are widely treated as the reference standard; a later case meta-analysis
          (PMID:27406219) found that superiority rests on that one study and that the three criteria systems
          agree poorly, so the advantage is not independently established.
      selected_evidence:
        snippet: These new criteria were simpler, more sensitive (84% vs. 75%) and more specific (97%
          vs. 96%) than Sternbach's criteria.
        supports: SUPPORT
