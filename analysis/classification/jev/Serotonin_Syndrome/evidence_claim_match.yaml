        disease_term:
          preferred_term: neuroleptic malignant syndrome
          term:
            id: MONDO:0019790
            label: neuroleptic malignant syndrome
        description: 'The principal differential. Both present with hyperthermia, autonomic instability,
          altered mental status, and increased muscle tone, and the two overlap most in agents with both
          antidopaminergic and serotonergic activity. They separate on tempo and on the neuromuscular
          pattern: serotonin syndrome comes on within hours with clonus and hyperreflexia, whereas neuroleptic
          malignant syndrome evolves over days as an idiosyncratic reaction to neuroleptics with bradykinesia
          and lead-pipe rigidity.'
        distinguishing_features:
        - Serotonin syndrome has clonus and hyperreflexia; neuroleptic malignant syndrome has bradykinesia
          and lead-pipe or cogwheel rigidity.
        - Serotonin syndrome follows a serotonergic agent and onsets within hours; neuroleptic malignant
          syndrome is an idiosyncratic reaction to neuroleptics evolving over days.
      selected_evidence:
        snippet: NMS typically occurs over hours to days in a patient taking a neuroleptic agent; its
          recommended treatment is generally the combination of a central dopamine agonist, bromocriptine
          or L-dopa, and dantrolene
        supports: SUPPORT
