  55f6570ec0fa29f3ca96626d5f7e898cf544f360431232c49639ae6f7ae5506a:
    claim:
      about:
        disease:
          name: Serotonin Syndrome
          disease_term:
            preferred_term: serotonin syndrome
            term:
              id: MONDO:0018546
              label: serotonin syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ss_diagnostic_consensus
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What are the agreed terminology, diagnostic criteria, and boundaries of serotonin syndrome,
          now that it presents at therapeutic doses and across non-toxicology settings rather than only
          as overdose in psychiatric patients?
        attaches_to:
        - diagnosis#Hunter Serotonin Toxicity Criteria
        rationale: The entry already carries the measured disagreement between the Hunter, Sternbach and
          Radomski criteria (PMID:27406219). The broader problem is that the syndrome's terminology, clinical
          boundaries, etiology and pathophysiology remain unsettled decades after its description, and
          the classic toxicology/overdose picture does not match the milder, therapeutic-dose cases now
          reported from perioperative, neurology, cardiology and pediatric settings. Until a consensus
          definition exists, prevalence, criterion performance and even which presentations count as serotonin
          syndrome are all moving targets.
      selected_evidence:
        snippet: Since SS is a potentially lethal illness, consensus is required on several concerns related
          to SS.
        supports: SUPPORT
