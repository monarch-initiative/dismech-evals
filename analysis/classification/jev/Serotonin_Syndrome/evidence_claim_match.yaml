        publication: PMID:11164765
        description: 'The standard pharmacological rat model: an MAO-A inhibitor plus a serotonin precursor
          drives rectal temperature above 40 degrees C with death within 90 minutes, accompanied by a
          large anterior-hypothalamic noradrenaline surge. Potent 5-HT2A antagonists abolish both.'
        modeled_mechanisms:
