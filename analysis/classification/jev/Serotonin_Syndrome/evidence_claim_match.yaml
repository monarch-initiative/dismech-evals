      assertion_type: Environmental
      assertion:
        name: Electroconvulsive therapy concurrent with serotonergic agents
        description: Electroconvulsive therapy can precipitate serotonin syndrome when given to a patient
          already taking serotonergic drugs. ECT is thought to enhance central serotonergic neurotransmission,
          superimposing on the existing drug-raised serotonergic load. In a reported case the syndrome
          developed after the first ECT session in a patient on bupropion, trazodone, and quetiapine,
          and did not recur once the concurrent agents were changed.
        notes: No ECTO exposure class exists for electroconvulsive therapy (searched l~electroconvulsive,
          l~electroshock, l~electric in sqlite:obo:ecto, all empty), so exposure_term is omitted rather
          than bound to an approximate term.
      selected_evidence:
        snippet: Serotonin syndrome developed soon after she received the first session of electroconvulsive
          therapy (ECT).
        supports: SUPPORT
