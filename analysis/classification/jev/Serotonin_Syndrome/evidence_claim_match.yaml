      assertion:
        name: Kava supplement use with serotonergic agents
        description: 'Kava (Piper methysticum) is an over-the-counter botanical supplement. A pediatric
          case developed prolonged, cyproheptadine-refractory serotonin syndrome during daily kava use
          while transitioning between two SNRIs (duloxetine to venlafaxine). The authors propose that
          kavalactone CYP2D6 and monoamine oxidase inhibition raised the SNRI and active-metabolite levels.
          It is recorded as a reported association rather than a pathograph trigger: the proposed mechanism
          is offered as a possibility in a single case with a concurrent SNRI overlap, so kava''s own
          role is unconfirmed and no `influences_mechanisms` link is asserted.'
        notes: 'Mechanism proposed but unconfirmed: the authors suggest kavalactone CYP2D6 and MAO inhibition
          raised the SNRI/metabolite levels ("may have led to"), reported in a single case alongside a
          concurrent duloxetine-to-venlafaxine transition, so kava''s independent role is not established
          and no influences_mechanisms link is asserted. No ECTO exposure class exists for kava or Piper
          methysticum (searched l~kava, l~piper methysticum in sqlite:obo:ecto, both empty).'
      selected_evidence:
        snippet: We present a pediatric patient who developed prolonged serotonin syndrome after daily
          use of kava while transitioning from duloxetine to venlafaxine.
        supports: SUPPORT
