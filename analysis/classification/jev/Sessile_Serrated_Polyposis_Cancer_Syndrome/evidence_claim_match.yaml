          polyposis in an autosomal dominant pattern in the reported kindreds. Penetrance is incomplete
          and probably lower than the family-based literature implied: carriers ascertained outside polyposis
          families often lack polyps, and colorectal cancer risk depends on where the truncation falls
          in the protein. No numeric penetrance estimate is recorded because none of the cited sources
          provides one.'
