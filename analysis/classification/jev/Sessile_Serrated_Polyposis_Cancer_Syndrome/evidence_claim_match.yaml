      assertion_type: Discussion
      assertion:
        discussion_id: rnf43_yield_in_clinical_sps
        kind: KNOWLEDGE_GAP
        attaches_to:
        - disease#Sessile Serrated Polyposis Cancer Syndrome
        - genetic#RNF43
        prompt: How much of clinically defined serrated polyposis syndrome does germline RNF43 explain,
          and is the RNF43-defined entity a subtype of SPS or a separate predisposition that sometimes
          presents as SPS?
        rationale: MONDO places the RNF43-defined term under the clinical syndrome, but cohort yields
          of RNF43 in WHO-criteria SPS are low (none of 26 in a Dutch cohort, 1 of 73 and 1 of 139 in
          two UK series, 5 of 304 in a multinational study cited as background), and a review puts all
          identifiable germline causes below 3%. In the other direction, population carriers often lack
          polyposis. The overlap between the two concepts is therefore partial in both directions, which
          is why this entry follows the MONDO split rather than lumping clinical SPS into it. Whether
          the residual clinical SPS has an undiscovered Mendelian cause, a polygenic or environmental
          basis (smoking is associated), or both, is open.
      selected_evidence:
        snippet: a large multinational cohort found five of 304 (1.6%) tested SPS patients with probably
          pathogenic RNF43 variants.
        supports: SUPPORT
