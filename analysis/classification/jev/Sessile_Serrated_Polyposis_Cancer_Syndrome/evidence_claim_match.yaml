        discussion_id: rnf43_penetrance_and_surveillance_start
        kind: KNOWLEDGE_GAP
        attaches_to:
        - inheritance#Autosomal dominant with incomplete penetrance
        - treatments#Colonoscopic Surveillance with Polypectomy
        prompt: What is the age-specific penetrance of germline RNF43 variants by variant position, and
          at what age should surveillance of an asymptomatic carrier (including a carrier identified as
          a child through cascade testing) begin?
        rationale: The family-based literature suggested a high-risk dominant syndrome, with colorectal
          cancer as early as age 23, but population sequencing shows a moderate overall risk concentrated
          in N-terminal variants, and Danish families include older carriers with normal colonoscopy.
          None of the sources cited in this entry gives an age to start colonoscopy in RNF43 carriers
          or addresses predictive testing of minors; the surveillance data come from adults with clinical
          SPS. This matters for pediatric cascade testing, because the case for testing a child depends
          on a surveillance action taken in childhood or early adulthood.
      selected_evidence:
        snippet: In case-control analyses, germline RNF43 variants were associated with CRC risk (OR=2.696,
          p=0.010), but penetrance was much greater for germline mutations in the N-terminal half of the
          gene.
        supports: SUPPORT
