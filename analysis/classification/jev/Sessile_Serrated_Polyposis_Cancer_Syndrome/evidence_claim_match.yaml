          Znrf3 in mouse intestinal epithelium produces adenomas rich in LGR5+ stem cells, and RNF43-mutant
          human serrated adenoma organoids and edited mouse colon organoids grow with less R-spondin1.
          How this Wnt gain leads specifically to serrated rather than conventional adenomatous morphology
          in human carriers is not established.
        role: central_effector
