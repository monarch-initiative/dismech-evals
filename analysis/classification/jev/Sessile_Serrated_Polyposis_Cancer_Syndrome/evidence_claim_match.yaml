      assertion:
        name: Colonoscopic Surveillance with Polypectomy
        description: Regular colonoscopy with removal of serrated and adenomatous polyps. The surveillance
          data come from clinically defined SPS cohorts, not from RNF43 carriers specifically. In those
          cohorts advanced neoplasia is common during surveillance while colorectal cancer incidence is
          low, and a randomized trial could not show that a 3-year interval is non-inferior to a 2-year
          interval. For RNF43 carriers, the source recommends individually tailored colonoscopy taking
          account of variant position and polyp history.
        treatment_term:
          preferred_term: colonoscopic polypectomy
          term:
            id: NCIT:C51688
            label: Colonoscopic Polypectomy
      selected_evidence:
        snippet: Patients with SPS have a substantial risk of developing advanced neoplasia under endoscopic
          surveillance, whereas CRC incidence is low.
        supports: SUPPORT
