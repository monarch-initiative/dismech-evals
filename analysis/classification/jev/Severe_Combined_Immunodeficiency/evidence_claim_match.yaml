            term:
              id: MONDO:0015974
              label: severe combined immunodeficiency
        context: []
      assertion_type: Diagnosis
      assertion:
        name: TREC newborn screening
        description: Quantification of T-cell receptor excision circles by PCR on Guthrie-card dried blood
          spots detects failed thymic T-cell output before infection begins. It is the first immune disorder
          accepted for population-based screening and is now universal across US states.
        diagnosis_term:
          preferred_term: newborn screening
          term:
            id: NCIT:C81178
            label: Newborn Screening
        notes: The assay measures a by-product of T-cell receptor recombination, so it is blind to defects
          acting *after* that step. MHC class II deficiency, ZAP70 deficiency, and late-onset ADA deficiency
          can all screen normal — a real false-negative class rather than an assay-quality problem.
      selected_evidence:
        snippet: The T-cell receptor excision circle test, developed in 2005, proved to be successful
          in pilot studies starting in the period 2008 to 2010, and by 2019 all states in the United States
          had adopted versions of it in their public health programs.
        supports: SUPPORT
    origin:
