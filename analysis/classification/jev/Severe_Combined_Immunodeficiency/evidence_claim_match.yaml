      assertion:
        name: Reticular dysgenesis
        display_name: Reticular dysgenesis (AK2 deficiency, T-B-NK-)
        description: 'Autosomal recessive SCID caused by biallelic AK2 (adenylate kinase 2) defects, accounting
          for about 2% of children with SCID. Unlike the other subtypes, the block is in survival of haematopoietic
          precursors rather than in a lymphoid-specific signalling, recombination, or metabolic pathway,
          so both innate and adaptive immunity fail: profound neutropenia/absent granulocytes accompanies
          the lymphoid deficiency. It is the most severe SCID form, with fatal septicaemia within days
          of birth if untreated.'
        genes:
        - preferred_term: AK2
          term:
            id: hgnc:362
            label: AK2
      selected_evidence:
        snippet: Mutation of the AK2 gene causes reticular dysgenesis (RD), an autosomal recessive disorder
          occurring in 2% of children with SCID.
        supports: SUPPORT
