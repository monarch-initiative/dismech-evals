  1875acd7253d205de8255241f26601eb6a3ce5d24732e1fdb590771ebb2127ee:
    claim:
      about:
        disease:
          name: Severe Combined Immunodeficiency
          disease_term:
            preferred_term: severe combined immunodeficiency
            term:
              id: MONDO:0015974
              label: severe combined immunodeficiency
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: 'Untreated SCID is fatal in infancy, and the only treatments that change that are transplantation,
          gene therapy, or (for ADA) enzyme replacement — each of which requires specialist centres, conditioning
          chemotherapy, and prolonged protective isolation. Where those services are not readily accessible
          the burden is starkly visible: in a 277-child Indian cohort only 8.3% reached transplant and
          75.8% died. Where newborn screening and transplant are available, survival exceeds 85%, so the
          burden is dominated by access and by time-to-diagnosis rather than by any intrinsic untreatability.'
      selected_evidence:
        snippet: Only 23 children (8.3%) received hematopoietic stem cell transplantation (HSCT). Of these,
          11 are doing well post-HSCT. Mortality was recorded in 210 children (75.8%).
        supports: SUPPORT
    origin:
      assertion_path: /clinical_burden
      evidence_path: /clinical_burden/evidence/0
      context_paths:
