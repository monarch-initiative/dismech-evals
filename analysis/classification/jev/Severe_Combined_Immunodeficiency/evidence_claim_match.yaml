              label: severe combined immunodeficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Receptor-proximal T-cell receptor signaling defect
        description: In CD3D and LAT deficiency signalling through the pre-T-cell receptor and T-cell
          receptor fails at or immediately below the receptor, by two different routes. CD3delta is an
          invariant chain of the complex itself, so its loss leaves no signalling-competent receptor to
          assemble; LAT is the transmembrane adaptor that propagates the signal from a receptor that is
          intact, so its loss leaves the receptor silent. Thymocyte development arrests at the double-negative
          to double-positive transition, giving a T-B+NK+ immunophenotype. This is a fifth mechanism class
          alongside cytokine receptor signaling, V(D)J recombination and DNA repair, purine metabolism,
          and haematopoietic precursor survival, and it is the class the CD45/PTPRC and other CD3-chain
          deficiencies also belong to.
        biological_scale: CELLULAR
        genes:
        - preferred_term: CD3D
          term:
            id: hgnc:1673
            label: CD3D
        - preferred_term: LAT
          term:
            id: hgnc:18874
            label: LAT
        biological_processes:
        - preferred_term: T cell receptor signaling pathway
          modifier: DECREASED
          term:
            id: GO:0050852
            label: T cell receptor signaling pathway
        - preferred_term: T cell differentiation in thymus
          modifier: DECREASED
          term:
            id: GO:0033077
            label: T cell differentiation in thymus
        molecular_functions:
        - preferred_term: transmembrane signaling receptor activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0004888
            label: transmembrane signaling receptor activity
        - preferred_term: signaling receptor complex adaptor activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0030159
            label: signaling receptor complex adaptor activity
        cell_types:
        - preferred_term: thymocyte
          term:
            id: CL:0000893
            label: thymocyte
      selected_evidence:
        snippet: Homozygous mutations in CD3D and CD3E genes lead to a complete block in T-cell development
          and thus to an early-onset severe combined immunodeficiency phenotype.
        supports: SUPPORT
        directness: DIRECT
