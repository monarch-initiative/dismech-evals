        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective V(D)J recombination and DNA repair
        description: In RAG1, RAG2, DCLRE1C (Artemis), PRKDC (DNA-PKcs), and LIG4 (DNA ligase IV) deficiency,
          the machinery that assembles antigen-receptor genes is impaired. RAG1/RAG2 initiate site-specific
          DNA cleavage during V(D)J recombination; Artemis opens the resulting DNA hairpins as part of
          non-homologous end-joining; DNA-PKcs activates Artemis for that step; and DNA ligase IV seals
          the repaired ends. Failure to recombine T-cell (and B-cell) receptor genes arrests lymphocyte
          development (T-B-NK+). Loss of any of the three end-joining components additionally confers
          cellular radiosensitivity, which is what makes the molecular diagnosis matter before transplant
          conditioning.
        genes:
        - preferred_term: RAG2
          term:
            id: hgnc:9832
            label: RAG2
        - preferred_term: DCLRE1C
