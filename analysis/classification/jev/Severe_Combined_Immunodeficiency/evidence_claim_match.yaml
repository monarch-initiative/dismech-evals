  f124243109b52913878f156ec7d20d6dab64bb577fd6ab8915855d6e72569844:
    claim:
      about:
        disease:
          name: Severe Combined Immunodeficiency
          disease_term:
            preferred_term: severe combined immunodeficiency
            term:
