            label: DNA-dependent protein kinase activity
        - preferred_term: DNA ligase (ATP) activity
          modifier: DECREASED
          term:
            id: GO:0003910
            label: DNA ligase (ATP) activity
        cell_types:
        - preferred_term: thymocyte
          term:
            id: CL:0000893
            label: thymocyte
      selected_evidence:
        snippet: RAG1 and RAG2, are DNA recombinases that mediate DNA recombination process and ensure
          the somatic diversification of immunoglobulin and TCR genes during B-cell and T-cell development,
          respectively.
        supports: SUPPORT
