        name: Defective thymocyte egress
        description: In coronin-1A deficiency the actin regulation required for thymocytes to leave the
          thymus and for peripheral T cells to survive is lost, so T cells do not populate the periphery.
          The two mouse alleles show the two halves of this separately. The Ptcd strain carries an E26K
          gain-of-function substitution that increases coronin-1A inhibition of Arp2/3 and blocks thymic
          egress; Coro1a-null mice, which match the patient's absent protein, instead lose mature thymocytes
          through reduced survival. Neither is a block in thymocyte development, which is the basis for
          placing this node beside the developmental block rather than within it.
