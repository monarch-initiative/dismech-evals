              label: severe combined immunodeficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: LIG4
        gene_term:
          preferred_term: LIG4
          term:
            id: hgnc:6601
            label: LIG4
        association: Causative
        features: Biallelic hypomorphic LIG4 variants impair DNA ligase IV, the ligase that seals double-strand
          breaks during non-homologous end-joining and V(D)J recombination, and cause LIG4 syndrome. The
          immune phenotype is a spectrum rather than a fixed one, running from near-normal to radiosensitive
          T-B-NK+ SCID, and it is accompanied by microcephaly and growth retardation that the lymphoid-restricted
          SCID subtypes do not share.
        notes: Bound here as a gene acting at the V(D)J recombination and DNA repair node, not as a subtype
          row. The IUIS 2022 classification lists DNA ligase IV deficiency in the T-B- SCID table, but
          the disease-specific review describes a phenotypic range from normal to severe combined immunodeficiency,
          so treating LIG4 syndrome as a SCID subtype in its own right would overstate a variable immune
          phenotype in a disorder whose defining features are radiosensitivity and microcephaly. The review
          cited below states that range directly.
      selected_evidence:
        snippet: DNA ligase IV functions in DNA nonhomologous end-joining and V(D)J recombination.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /genetic/9
      evidence_path: /genetic/9/evidence/0
      context_paths:
