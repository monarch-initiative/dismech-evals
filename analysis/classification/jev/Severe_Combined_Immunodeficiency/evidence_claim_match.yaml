      assertion_type: Pathophysiology
      assertion:
        name: Cytokine receptor signaling defect
        description: In X-linked SCID, JAK3 deficiency, and IL7R deficiency, loss-of-function in the common
          gamma chain (IL2RG), its associated kinase JAK3, or the IL-7 receptor alpha chain abolishes
          IL-7-dependent JAK-STAT signaling that drives early thymocyte survival and proliferation, blocking
          T-cell development. IL2RG and JAK3 defects additionally abrogate NK-cell development (T-B+NK-),
          whereas IL7R defects spare B and NK cells (T-B+NK+).
        genes:
        - preferred_term: IL7R
          term:
            id: hgnc:6024
            label: IL7R
        - preferred_term: JAK3
