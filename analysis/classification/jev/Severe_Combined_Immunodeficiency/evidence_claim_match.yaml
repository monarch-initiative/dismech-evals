      assertion_type: Discussion
      assertion:
        discussion_id: ada_extraimmune_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what route do accumulating purine metabolites damage the brain, cochlea and growth
          plate in ADA deficiency, and is that route the same one that kills thymocytes?
        attaches_to:
        - pathophysiology#Non-lymphoid tissue purine metabolite toxicity
        rationale: 'The extra-immune features are established as features — they are more frequent in
          ADA deficiency than in other SCID subtypes receiving the same treatment, they occur in children
          transplanted without conditioning, and IQ correlates inversely with diagnostic dATP. What is
          missing is the mechanism connecting metabolite to organ. The review this node is built from
          says the mechanism of the neurological pathology has not been investigated, and proposes dATP
          neurotoxicity by analogy with the immune system as an untested possibility. The two molecular
          routes bound on the node — SAH hydrolase inactivation and ribonucleotide reductase inhibition
          — are characterised in lymphocytes and carried across on the strength of ubiquitous ADA expression,
          which is an inference rather than a measurement. This matters clinically because current therapies
          correct the immune phenotype while leaving the neurological one: six of twelve patients showed
          distinct neurological abnormality at a mean twelve years of follow-up despite complete immune
          reconstitution.'
      selected_evidence:
        snippet: neurological abnormalities are far more prevalent in ADA-SCID than other forms of immunodeficiency
        supports: SUPPORT
