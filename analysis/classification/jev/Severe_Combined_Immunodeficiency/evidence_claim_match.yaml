          because it is not populated by thymocytes; true thymic APLASIA (athymia) is the lesion of complete
          DiGeorge syndrome and FOXN1 deficiency, which are distinct entities. The absent thymic shadow
          on radiography reflects hypoplasia, not absence of the organ. This is also not a universal SCID
          finding - CORO1A deficiency, for example, produces T-B+ SCID with a normal-sized thymus - so
          no frequency band is asserted.
