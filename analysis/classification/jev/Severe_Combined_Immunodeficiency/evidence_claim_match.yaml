          pre-T-cell receptor and T-cell receptor complex, arresting thymocyte development at the double-negative
          to double-positive transition and producing T-B+NK+ SCID. The mechanism is failure of signal
          transduction through an assembled receptor, not failure of cytokine signalling, of antigen-receptor
          gene recombination, of purine metabolism, or of precursor survival.
      selected_evidence:
