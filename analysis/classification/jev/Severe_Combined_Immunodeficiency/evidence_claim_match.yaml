  3bbda067412a995b92d1b2ed6aebc52d4f98fa21559766d13a0f3e8d5bec9188:
    claim:
      about:
        disease:
          name: Severe Combined Immunodeficiency
          disease_term:
            preferred_term: severe combined immunodeficiency
            term:
              id: MONDO:0015974
              label: severe combined immunodeficiency
        context:
        - path: /pathophysiology/3
          value:
            name: Non-lymphoid tissue purine metabolite toxicity
            biological_scale: CELLULAR
            description: 'Because adenosine deaminase is ubiquitously expressed, the deoxyadenosine and
              dATP that accumulate in its absence are not confined to thymocytes. Two of the same molecular
              routes that damage developing lymphocytes operate in non-lymphoid cells: 2''-deoxyadenosine
              irreversibly inactivates S-adenosylhomocysteine hydrolase, so S-adenosylhomocysteine accumulates
              and inhibits transmethylation; and dATP inhibits ribonucleotide reductase, depleting the
              deoxynucleotide pool and impairing DNA synthesis in any proliferating cell. This node is
              the entry point for the extra-immune features of ADA deficiency — neurocognitive, auditory,
              skeletal, pulmonary and hepatic — which none of the other five SCID subtypes in this entry
              share.'
            molecular_functions:
            - preferred_term: S-adenosylhomocysteine hydrolase activity
              modifier: DECREASED
              term:
                id: GO:0004013
                label: adenosylhomocysteinase activity
            - preferred_term: ribonucleotide reductase activity
              modifier: DECREASED
              term:
                id: GO:0004748
                label: ribonucleoside-diphosphate reductase activity, thioredoxin disulfide as acceptor
            biological_processes:
            - preferred_term: transmethylation
              modifier: DECREASED
              term:
                id: GO:0032259
                label: methylation
            - preferred_term: DNA replication
              modifier: DECREASED
              term:
                id: GO:0006260
                label: DNA replication
            chemical_entities:
            - preferred_term: S-adenosyl-L-homocysteine
              modifier: INCREASED
              term:
                id: CHEBI:16680
                label: S-adenosyl-L-homocysteine
            - preferred_term: dATP
              modifier: INCREASED
              term:
                id: CHEBI:16284
                label: dATP
            notes: The two molecular routes bound here are characterised in the lymphoid compartment,
              where they were worked out; the review's argument for extending them to non-lymphoid tissue
              is the ubiquity of ADA expression plus the organ-specific patient findings downstream, not
              a direct measurement of transmethylation or deoxynucleotide pools in cochlea, brain or bone.
              The causal_link_type on each downstream edge records how far that inference reaches for
              the organ concerned.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
