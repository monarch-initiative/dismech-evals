        association: Causative
        features: 'Biallelic PRKDC variants abolish or cripple DNA-dependent protein kinase catalytic
          subunit (DNA-PKcs), which activates Artemis during hairpin opening in V(D)J recombination and
          is required for non-homologous end-joining. The resulting disease is radiosensitive T-B-NK+
          SCID, the same mechanism class and the same conditioning problem as DCLRE1C/Artemis deficiency.
          No separate has_subtypes row is asserted: this gene acts at the V(D)J recombination and DNA
          repair node the Artemis subtype already models.'
      selected_evidence:
        snippet: Radiosensitive T-B- severe combined immunodeficiency (RS-SCID) is caused by defects in
          the nonhomologous end-joining (NHEJ) DNA repair pathway, which results in failure of functional
          V(D)J recombination.
        supports: SUPPORT
        directness: DIRECT
