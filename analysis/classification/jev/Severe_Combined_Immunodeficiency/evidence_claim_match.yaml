      assertion_type: Genetic
      assertion:
        name: CORO1A
        gene_term:
          preferred_term: CORO1A
          term:
            id: hgnc:2252
            label: CORO1A
        association: Causative
        features: 'Biallelic CORO1A variants remove coronin-1A, an actin regulator required for thymocyte
          egress from the thymus and for peripheral T-cell survival. Complete absence causes T-B+NK+ SCID,
          in which T cells fail to populate the periphery. The two mouse alleles split that picture: the
          Ptcd E26K substitution increases coronin-1A inhibition of Arp2/3 and blocks egress from the
          thymus, while Coro1a-null mice, which match the patient''s absent protein, lose mature thymocytes
          through reduced survival. Hypomorphic alleles instead give a combined immunodeficiency with
          Epstein-Barr-virus-associated B-cell lymphoproliferation.'
        notes: Neither cited report states the size of the human thymus, so no thymic-size claim is made
          for this gene.
      selected_evidence:
        snippet: Our findings establish a function for coronin 1A in T cell egress, identify a surface
          of coronin involved in Arp2/3 regulation and demonstrate that actin regulation is a biological
          process defective in human and mouse severe combined immunodeficiency.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /genetic/12
      evidence_path: /genetic/12/evidence/0
      context_paths:
