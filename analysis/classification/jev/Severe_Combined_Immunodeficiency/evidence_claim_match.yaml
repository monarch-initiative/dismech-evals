        measure_type: BIRTH_PREVALENCE
        prevalence_class: BAND_1_5_PER_10000
        rate_per_100000: 28.6
        rate_low: 25.0
        rate_high: 158.7
        notes: A founder effect, not a different disease. SCID birth prevalence in the Navajo Nation is
          roughly 1 in 3,500 (95% CI 1/630-1/4,000), about seventeen times the overall US screened rate,
          driven by a frequent DCLRE1C (Artemis) founder variant estimated to cause SCID in 1 in 2,000
          births. Rates converted from the reported 1-in-N figures; the confidence interval is wide because
          the screened denominator is small.
      selected_evidence:
        snippet: The incidence was not significantly different in any state program but as expected was
          higher in the Navajo Nation (1/3500; 95%CI, 1/630-1/4000), where a frequent founder mutation
          in DCLRE1C, encoding a DNA repair protein, causes SCID in an estimated 1 in 2000 births.
        supports: SUPPORT
