      assertion_type: Diagnosis
      assertion:
        name: ADA enzyme and metabolite testing
        description: 'ADA deficiency has a biochemical diagnosis independent of the immune phenotype:
          red-cell ADA catalytic activity below 1%, or elevated adenosine and deoxyadenosine on tandem
          mass spectrometry. The metabolite assay also detects the later-onset ADA-CID cases that TREC
          screening misses.'
        diagnosis_term:
          preferred_term: biochemical enzyme and metabolite assay
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
        notes: '`diagnosis_term` is bound to a generic NCIT action term because NCIT has no clinical-action
          term for red-cell enzyme activity or tandem mass-spectrometry metabolite quantitation specific
          enough to be worth asserting; the free-text `preferred_term` carries the actual test.'
      selected_evidence:
        snippet: The diagnosis of ADA deficiency is established in a proband with suggestive findings
          either by biochemical testing showing <1% of ADA catalytic activity in red blood cells or in
          extracts of dried blood spots (valid in untransfused individuals), or by molecular genetic testing
          identifying biallelic pathogenic variants in ADA.
        supports: SUPPORT
