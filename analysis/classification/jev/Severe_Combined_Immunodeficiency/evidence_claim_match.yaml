            label: IL2RG
        biological_processes:
        - preferred_term: JAK-STAT cytokine receptor signaling
          modifier: DECREASED
          term:
            id: GO:0007259
            label: cell surface receptor signaling pathway via JAK-STAT
        cell_types:
        - preferred_term: thymocyte
          term:
            id: CL:0000893
            label: thymocyte
      selected_evidence:
        snippet: The gamma portion of IL2R is important for the development of T and NK cells through
          cytokines IL2 and IL15, respectively.
        supports: SUPPORT
