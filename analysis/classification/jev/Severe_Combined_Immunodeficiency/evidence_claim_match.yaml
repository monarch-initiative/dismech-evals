        name: Protective isolation and avoidance of live vaccines and non-irradiated blood products
        description: Until immune reconstitution is achieved, exposure avoidance is itself treatment.
          Live viral vaccines — given to the infant or to household contacts — can cause disseminated
          vaccine-strain disease; non-irradiated blood products can cause transfusion-associated graft-versus-host
          disease in a patient with no T cells to reject donor lymphocytes; and breast milk is withheld
          pending maternal CMV status. Live rotavirus vaccine is the specific exposure that newborn-screening
          programmes act on first, because it is administered at the age at which screened infants are
          still awaiting definitive therapy.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: infection-exposure avoidance and protective isolation
          term:
            id: NCIT:C15747
            label: Supportive Care
        target_phenotypes:
        - preferred_term: Recurrent infections
          term:
            id: HP:0002719
            label: Recurrent infections
      selected_evidence:
        snippet: All infants with T-cell lymphopenia were directed to avoid infectious exposures, transfusions
          (except with cytomegalovirus-negative, irradiated blood products), and live rotavirus vaccines
          until such time as immune compromise was no longer present.
        supports: SUPPORT
