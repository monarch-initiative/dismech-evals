    claim:
      about:
        disease:
          name: Severe Combined Immunodeficiency Due To CARD11 Deficiency
          disease_term:
            preferred_term: severe combined immunodeficiency due to CARD11 deficiency
            term:
              id: MONDO:0014081
              label: severe combined immunodeficiency due to CARD11 deficiency
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: BENTA (B-cell expansion with NF-kappaB and T-cell anergy)
        description: The third member of the CARD11 allelic series and the one this entry's description
          names without previously curating. Heterozygous gain-of-function variants drive constitutive
          NF-kappaB activity and a lymphoproliferative phenotype, which is the opposite signalling direction
          from the biallelic null disease curated here. Getting the allele class right is what decides
          whether the patient needs immune reconstitution or immunosuppression.
        distinguishing_features:
        - Caused by heterozygous gain-of-function CARD11 variants, not biallelic loss-of-function ones.
        - Presents with B-cell expansion and lymphoproliferation rather than agammaglobulinemia and infection.
      selected_evidence:
        snippet: Germline CARD11 mutations cause several distinct primary immune disorders in human subjects,
          including severe combined immune deficiency (biallelic null mutations), B-cell expansion with
          nuclear factor κB and T-cell anergy (heterozygous, gain-of-function mutations), and severe atopic
          disease
        supports: SUPPORT
