        biological_scale: MOLECULAR
        description: Null variants abolish CARD11 protein. CARD11 is expressed only in lymphocytes, which
          is why a defect in a general signalling scaffold produces a purely immunological disease, and
          why haematopoietic stem cell transplantation is curative.
        genes:
        - preferred_term: CARD11
          term:
            id: hgnc:16393
            label: CARD11
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          zygosity: HOMOZYGOUS
          variant_origin: GERMLINE
      selected_evidence:
        snippet: This deletion abrogated protein expression and activation of the canonical nuclear factor
          κB (NF-κB) pathway in lymphocytes after antigen receptor or phorbol 12-myristate 13-acetate
          stimulation, whereas CD40 signaling in B cells was preserved.
        supports: SUPPORT
