          case report describes agammaglobulinemia in its patient and the exon-21-deletion case report
          describes hypogammaglobulinemia in its patient, so the antibody defect is attested across a
          spectrum rather than uniformly at its severe end.
        notes: Lowered from OBLIGATE, which asserts every patient. The band had been taken from one paper's
          characterisation of the entity, which is a definition rather than a count. Across the published
          probands, agammaglobulinemia is reported in one, hypogammaglobulinemia in a second, and immunoglobulins
          are not reported for the two patients in the 2021 series or for the Omenn reversion case, whose
          syndrome is itself defined in part by elevated IgE. FREQUENT records what is attested; the developmental
          block that explains it is not in doubt.
