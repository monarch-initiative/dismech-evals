          missense that abolishes expression (p.V134M), whole-gene deletion within a 16p11.2 microdeletion,
          and a C-terminal frameshift (p.S401fs) that is expressed but cannot oligomerize. All are loss
          of function; heterozygous carriers are unaffected.
