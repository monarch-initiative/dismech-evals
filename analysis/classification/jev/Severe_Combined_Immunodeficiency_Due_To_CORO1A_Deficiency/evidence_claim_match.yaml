      assertion_type: Pathophysiology
      assertion:
        name: Biallelic CORO1A Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: 'Germline biallelic CORO1A variants: frameshift truncations, a homozygous beta-propeller
          missense change (p.V134M) that almost abolishes protein expression, a paternal 2-bp deletion
          paired with a de novo 16p11.2 deletion, and a homozygous C-terminal frameshift (p.S401fs) that
          is expressed but cannot oligomerize or associate with the cytoskeleton. Every reported allele
          removes coronin-1A protein or the domains it needs to act on actin.'
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        genes:
        - preferred_term: CORO1A
          term:
            id: hgnc:2252
            label: CORO1A
        molecular_functions:
        - preferred_term: actin filament binding
          modifier: DECREASED
          term:
            id: GO:0051015
            label: actin filament binding
      selected_evidence:
        snippet: Molecular analysis revealed a 2 bp deletion in the paternal CORO1A coding sequence paired
          with a 600 kb de novo deletion encompassing CORO1A on the maternal allele.
        supports: SUPPORT
