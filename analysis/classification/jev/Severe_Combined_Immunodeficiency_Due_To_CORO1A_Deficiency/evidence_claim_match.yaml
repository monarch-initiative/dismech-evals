      assertion_type: AnimalModel
      assertion:
        name: Coronin-1A knockout mouse
        species: Mouse
        genotype: Coro1a-/-
        publication: PMID:16902139
        description: Germline Coro1a-null mice have profound peripheral T-cell lymphopenia with impaired
          chemokine-directed migration and disturbed lymphocyte homeostasis, while T-cell receptor functions
          are relatively spared. The model reproduces the human peripheral T-cell deficiency and the migration
          lesion.
        modeled_mechanisms:
        - target: Impaired T-Cell Migration and Thymic Egress
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Coronin 1-deficient T cells fail chemokine-mediated migration, the same defect
            proposed to block thymic egress in patients.
          limitations: The mouse reproduces the T-cell migration and homeostasis defect but not the human-specific
            viral complications (EBV lymphoproliferation, beta-HPV disease), whose viruses do not infect
            mice.
          readouts:
          - name: Chemokine-mediated T-cell migration
            target: Impaired T-Cell Migration and Thymic Egress
            direction: DECREASED
            interpretation: Migration defect corresponding to the human egress block.
        - target: Reduced Peripheral T-Cell Survival
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Coro1a-null T cells survive poorly; the defect was attributed to impaired TCR-induced
            calcium mobilization, which is where the mouse and the human S401fs data diverge (see the
            discussion).
          limitations: The calcium-mobilization mechanism proposed in mice is not reproduced in patients
            with the C-terminal S401fs allele, whose calcium flux is near normal. The mouse mechanism
            may therefore be allele- or species-specific.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Coro1a-null mouse T cells show a profound calcium-mobilization defect driving
              apoptosis, whereas patient T cells carrying the S401fs allele have near-normal calcium flux
              with the same survival defect, so the murine calcium mechanism does not transfer to that
              human allele.
      selected_evidence:
        snippet: We generated coronin 1-/- mice and found that coronin 1 exerted an inhibitory effect
          on cellular steady-state F-actin formation via an Arp2/3-dependent mechanism.
        supports: SUPPORT
