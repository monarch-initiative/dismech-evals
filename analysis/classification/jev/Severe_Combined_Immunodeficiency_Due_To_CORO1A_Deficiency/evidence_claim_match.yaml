      assertion_type: Discussion
      assertion:
        discussion_id: coro1a_calcium_flux_mouse_human_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does defective TCR-induced calcium mobilization explain the T-cell survival defect in
          CORO1A-deficient patients, or is that mechanism specific to the mouse and to null alleles?
        attaches_to:
        - pathophysiology#Reduced Peripheral T-Cell Survival
        rationale: Coro1a-null mice have a profound defect in TCR-induced calcium mobilization that was
          proposed to cause their T-cell death. Patients with the C-terminal p.S401fs allele have the
          same poor T-cell survival but near-normal calcium flux, and their F-actin accumulation was proposed
          instead as the survival mechanism. The mouse mechanism therefore does not transfer to at least
          one human allele, leaving open whether calcium signalling matters in patients with null alleles,
          or whether F-actin accumulation is the common route.
      selected_evidence:
        snippet: resulted in a profound defect in Ca2+ mobilization, interleukin-2 production, T cell
          proliferation and T cell survival
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
