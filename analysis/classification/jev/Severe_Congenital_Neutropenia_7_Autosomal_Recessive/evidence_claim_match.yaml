          signalling is required for adequate neutrophil production but is dispensable for terminal maturation,
          so the precursors that remain go on maturing fully while their numbers fall.
      selected_evidence:
        snippet: the di-proline hinge motif in the extracellular cytokine receptor homology domain of
          CSF3R is critical for adequate neutrophil production, but dispensable for in vivo terminal neutrophil
          maturation
        supports: SUPPORT
