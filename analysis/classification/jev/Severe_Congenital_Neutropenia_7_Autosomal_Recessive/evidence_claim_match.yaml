        therapeutic_modality: PROTEIN_REPLACEMENT
        description: Recombinant G-CSF, the mainstay for other SCN types, is generally ineffective in
          SCN7 because the defect is in the G-CSF receptor itself; patients typically fail to respond
          even at very high doses. A minority with hypomorphic alleles show partial responses. It is usually
          tried first but is not a durable option.
