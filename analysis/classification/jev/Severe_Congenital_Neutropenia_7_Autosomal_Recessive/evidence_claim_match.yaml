            term:
              id: MONDO:0014865
              label: autosomal recessive severe congenital neutropenia due to CSF3R deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: CSF3R
        gene_term:
          preferred_term: CSF3R
          term:
            id: hgnc:2439
            label: CSF3R
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        frequency: a rare cause of severe congenital neutropenia (SCN type 7)
        case_fractions:
        - population: Turkish Severe Congenital Neutropenia Registry (216 patients)
          case_fraction_percent: 2.9
          cohort_size: 216
          notes: Biallelic CSF3R accounted for 6 of 216 registry patients in a population with high consanguinity,
            where HAX1 (36%) dominated. CSF3R is a rare subtype even where recessive SCN is common.
        variants:
        - name: p.Arg308Cys (c.922C>T)
          description: An extracellular missense variant near the WSXWS motif; reported homozygous in
            a consanguineous family, perturbing N-glycosylation and surface localization of the receptor.
        - name: Extracellular truncating variants
          description: Compound heterozygous frameshift/nonsense variants (e.g. c.948_963del p.Gly316fs
            and c.1245del p.Gly415fs) truncating the extracellular domain and abolishing surface expression.
        notes: 'All reported pathogenic SCN7 variants lie in the extracellular region of G-CSFR, distinguishing
          them from the somatic cytoplasmic-tail truncations acquired during leukaemic evolution of ELANE/HAX1
          SCN, and from the germline activating variants (e.g. T617N) that cause hereditary neutrophilia.
          A third entity shares the extracellular location and must still be kept separate: rare heterozygous
          extracellular CSF3R variants, somatic or arising de novo in meiosis, leave the receptor hyporesponsive
          to G-CSF and act in a dominant-negative fashion against the wild-type allele. Those are single-allele
          dominant-negative cases, not the biallelic recessive disease curated here, even though both
          localise to the extracellular domain and both present with G-CSF hyporesponsiveness.'
      selected_evidence:
        snippet: biallelic germ line hypomorphic variants in CSF3R are a rare cause of severe congenital
          neutropenia, a hypoproliferative condition
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
