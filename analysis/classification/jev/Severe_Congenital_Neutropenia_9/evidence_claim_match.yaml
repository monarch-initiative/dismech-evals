        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_scn9_mild_phenotype
        prompt: Why do variants that severely inhibit wild-type CLPB in vitro produce a relatively mild,
          often isolated neutropenia that can resolve with age?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Dominant-Negative Inhibition of CLPB Disaggregase
        - phenotypes#Congenital neutropenia
        rationale: Mixed-oligomer assays show the variants abolish most disaggregase activity, and myeloid
          cell models show severely impaired respiration, yet patients usually have neutropenia alone,
          often responsive to G-CSF, and in one cohort counts normalized with age. Dosage of the mutant
          subunit in vivo, tissue-specific compensation, and the developmental timing of the marrow defect
          are untested explanations.
      selected_evidence:
        snippet: A perplexing issue is why the SCN-related variants, with such a devastating influence
          on the ATPase and disaggregase activity on the wild-type protein in vitro, result in a relatively
          mild phenotype in patients.
        supports: SUPPORT
