        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: In the defining series and the Care-for-Rare patients, the heterozygous missense variants
          cluster near the ATP-binding pocket of the C-terminal nucleotide-binding domain (p.Arg561Gln,
          p.Gly560Arg, p.Arg620His; PMID:35499078). The Polish carriers include ATPase-domain variants
          (p.Arg598Cys, p.Arg599Cys) and also variants in the ankyrin and D2 domains, among them p.Arg297Trp
          (PMID:41383606). The arginine finger R561 is the most frequently mutated residue across monoallelic
          CLPB disease.
      selected_evidence:
        snippet: Moreover, the CLPB variants are distinct, consisting of heterozygous variants that cluster
          near the adenosine triphosphate-binding pocket.
        supports: SUPPORT
