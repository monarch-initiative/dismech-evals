        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - disease#
        - phenotypes#Neurological involvement
        - phenotypes#3-Methylglutaconic aciduria
        rationale: Both are caused by heterozygous CLPB missense variants that inhibit wild-type CLPB
          dominant-negatively, and R561 is mutated in both. The separating features, neurological disease
          and 3-methylglutaconic aciduria, occur in some heterozygous patients, and the aciduria was not
          measured in about half of the published neutropenia cases.
      selected_evidence:
