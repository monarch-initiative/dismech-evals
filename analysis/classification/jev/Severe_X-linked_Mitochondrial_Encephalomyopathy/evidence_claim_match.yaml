  cb1ef2da132e96e77e518787fbc22fcaf93622f8dfa020964f01e69ea3e00b93:
    claim:
      about:
        disease:
          name: Severe X-linked Mitochondrial Encephalomyopathy
          disease_term:
            preferred_term: severe X-linked mitochondrial encephalomyopathy
            term:
              id: MONDO:0010437
              label: severe X-linked mitochondrial encephalomyopathy
        context: []
      assertion_type: Genetic
      assertion:
        name: AIFM1
        gene_term:
          preferred_term: AIFM1
          term:
            id: hgnc:8768
            label: AIFM1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: 'AIFM1 (Xq26.1) encodes apoptosis-inducing factor, a 613-residue mitochondrial flavoprotein
          with FAD- and NADH-binding domains. Reported COXPD6 alleles are in-frame deletions, missense,
          splice and mitochondrial-targeting-sequence variants; no truncating allele has been reported,
          and the gene is highly intolerant of loss of function in population data. The alleles studied
          functionally lower steady-state AIF protein in patient cells.

          The same gene carries a phenotypic continuum that dismech curates as separate allelic entries:
          X-linked recessive Charcot-Marie-Tooth disease 4 (Cowchock syndrome), the X-linked auditory
          neuropathy subtype AUNX1 within the Auditory Neuropathy entry, and spondyloepimetaphyseal dysplasia
          (Bieganski type, hypomyelination with spondylometaphyseal dysplasia). This entry covers the
          encephalomyopathic, combined-OXPHOS-deficient end.'
        variants:
        - name: AIFM1 c.601_603del (p.Arg201del)
          description: The founding allele, segregating in two male infants with progressive encephalomyopathy.
            It destabilizes both the mitochondrial and the soluble forms of AIF and increases the DNA-binding
            affinity of the soluble form.
          clinical_significance: PATHOGENIC
        - name: AIFM1 c.506C>T (p.Pro169Leu)
          description: Found in a family with three affected males with severe multisystem disease, metabolic
            acidosis and early death, and separately in a manifesting heterozygous girl with extreme X-inactivation
            skewing. Patient fibroblasts show reduced AIF and complex I subunits.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: No frameshift or nonsense variants have been reported in the Human Gene Mutation Database
          (HGMD), and the gene is highly intolerant to loss of function (pLI = 1 in gnomAD).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34117073
      reference_title: Severe multisystem pathology, metabolic acidosis, mitochondrial dysfunction, and
        early death associated with an X-linked AIFM1 variant.
