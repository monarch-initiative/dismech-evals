      assertion:
        name: Progressive Neuronal Degeneration
        biological_scale: TISSUE
        description: Neurons of the cortex, basal ganglia, thalamus, cerebellum, brainstem, lower motor
          neurons and peripheral axons degenerate. Autopsy of a fatal infantile case showed mitochondrial
          encephalopathy with profound occipital cortical neuronal loss, gliosis and axonal degeneration
          in peripheral nerve; denervation in muscle reflects motor neuron and axonal loss. In the harlequin
          mouse, which keeps about 20% of normal AIF, mitochondria degenerate before neurons do, and neurodegeneration
          spreads from the cerebellum to the thalamus, striatum and cortex.
        cell_types:
        - preferred_term: neuron
