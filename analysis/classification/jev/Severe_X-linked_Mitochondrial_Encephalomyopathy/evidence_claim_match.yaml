        description: Separately from the OXPHOS defect, patient cells are primed for caspase-independent,
          AIF-mediated cell death (parthanatos). Staurosporine induces more parthanatos in p.Arg201del
          fibroblasts, patient muscle shows many TUNEL-positive, caspase 3-negative nuclei, and p.Pro169Leu
          fibroblasts are more sensitive to staurosporine and show more nuclear condensation under galactose.
          How much this branch contributes to neuronal loss in patients, as opposed to muscle, has not
          been measured.
        notes: 'GO has no parthanatos term, so the process is bound to the generic GO:0012501 programmed
          cell death with the specificity carried in preferred_term. Do not "correct" this to GO:0097300
          programmed necrotic cell death: parthanatos is caspase-independent but not necroptotic.'
