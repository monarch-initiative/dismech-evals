      assertion_type: Treatment
      assertion:
        name: Mitochondrial cofactor supplementation
        description: Riboflavin, the precursor of FAD, has been given on the rationale that it stabilizes
          the flavin-bound AIF protein, alone or with coenzyme Q10 and thiamine. Results are mixed. One
          founding patient had prolonged neurological improvement, with correction of respiratory chain
          defects in his fibroblasts. A neonatal-onset patient on riboflavin, coenzyme Q10 and thiamine
          did not deteriorate further over six months. A slowly progressive patient had no change in clinical
          course on coenzyme Q10 and riboflavin, and riboflavin did not stabilize AIF in p.Pro169Leu fibroblasts.
          In the allelic childhood ataxia phenotype, riboflavin up to 200 mg per day partially improved
          ataxia scores. There are no controlled data.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: riboflavin
            term:
              id: CHEBI:17015
              label: riboflavin
          - preferred_term: coenzyme Q10
            term:
              id: CHEBI:46245
              label: coenzyme Q10
          - preferred_term: thiamine
            term:
              id: CHEBI:18385
              label: thiamine(1+)
        therapeutic_modality: SMALL_MOLECULE
