      assertion_type: Definition
      assertion:
        name: Diagnostic definition of Sezary syndrome
        definition_type: CASE_DEFINITION
        description: Sezary syndrome is the leukemic cutaneous T-cell lymphoma entity defined by erythroderma,
          generalized lymphadenopathy, and a circulating malignant CD4-positive T-cell population with
          Sezary-cell morphology and aberrant antigen loss.
        scope: Disease-level diagnostic definition of Sezary syndrome
      selected_evidence:
        snippet: The Sezary syndrome has been defined by a triad combining erythrodermia, generalized
          lymphadenopathy, and the presence of circulating Sezary cells > 1 × 109/L characterized by a
          CD4+/CD8- phenotype with loss of one or more T antigens (mainly CD7 and/or CD26).
        supports: SUPPORT
