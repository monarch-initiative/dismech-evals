  3d56e1c7c1caa795eafbea5b7a8eb96fbaa726ba30766804b498ef437100051e:
    claim:
      about:
        disease:
          name: Shashi-Pena Syndrome
          disease_term:
            preferred_term: Shashi-Pena syndrome
            term:
              id: MONDO:0014963
              label: Shashi-Pena syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PPAR-gamma-Linked Metabolic Dysregulation
        biological_scale: ORGANISM
        mechanism_confidence: PROVISIONAL
        description: 'ASXL2 interacts with PPAR-gamma, and ASXL2-null mice are glucose-intolerant, insulin-resistant
          and lipodystrophic. That is a mouse-derived prediction about a human phenotype, and it is one
          of the few places in this entry where the prediction has been tested: an 8-year-old prepubertal
          boy with SHAPNS developed type 2 diabetes with dyslipidemia and fatty infiltration of the liver,
          in the absence of a family history.

          It is graded PROVISIONAL because that is one patient. The source itself asks for further cases
          before treating the association as established, and the infantile hypoglycemia that is well
          documented in this syndrome is a different metabolic problem in the opposite direction, not
          obviously part of the same account.'
      selected_evidence:
        snippet: ASXL2 null mice exhibit glucose intolerance, insulin resistance and lipodystrophy. The
          regulatory role of ASXL2 in glucose and lipid homeostasis occurs through its interaction with
          peroxisome proliferator-activated receptor gamma (PPARγ), a gene implicated in the pathogenesis
          of type 2 diabetes on genome-wide association studies.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
