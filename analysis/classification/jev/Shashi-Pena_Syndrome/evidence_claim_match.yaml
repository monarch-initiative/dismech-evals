      assertion_type: Genetic
      assertion:
        name: ASXL2
        gene_term:
          preferred_term: ASXL2
          term:
            id: hgnc:23805
            label: ASXL2
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        presence: PRESENT
        notes: 'ASXL2 ("ASXL transcriptional regulator 2") is the second of three mammalian Additional
          sex combs-like genes. Its germline disease is Shashi-Pena syndrome; somatically it is recurrently
          mutated in acute myeloid leukaemia with t(8;21), and mouse deletion produces a myelodysplastic-syndrome-like
          disease.

          Whether that somatic story implies a cancer risk in Shashi-Pena syndrome is not known and should
          not be asserted from the gene alone. No malignancy surveillance is recommended in the GeneReviews
          management section, and no case of myeloid malignancy in a person with SHAPNS is cited in the
          material reviewed here. The germline and somatic variant classes are also not the same problem:
          the germline disease is caused by truncating variants predicted to act dominant-negatively,
          while the mouse cancer model is a deletion.

          Diagnostically, the point worth taking from the transmitted-translocation family is that a negative
          exome does not exclude ASXL2. A balanced rearrangement disrupting the gene was invisible to
          both chromosomal microarray and whole-exome sequencing and needed long-read sequencing plus
          RNA-seq to find.'
      selected_evidence:
        snippet: ASXL2 is frequently mutated in acute myeloid leukaemia patients with t(8;21).
        supports: SUPPORT
    origin:
