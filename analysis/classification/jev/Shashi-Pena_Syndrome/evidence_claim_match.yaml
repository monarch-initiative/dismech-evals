      assertion_type: Pathophysiology
      assertion:
        name: De Novo Truncating ASXL2 Variant
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'Heterozygous truncating variants - nonsense and frameshift - in ASXL2. The defining
          series found six such variants in six unrelated probands, all de novo. Reported alleles since
          include p.Ser627Phefs*22 and further nonsense changes, and one family reached the same diagnosis
          through a balanced chromosomal rearrangement disrupting the gene rather than through a point
          variant.

          The variant class matters. All three ASXL germline diseases are caused by truncating variants,
          not missense, which is the observation the dominant-negative and gain-of-function arguments
          in this gene family are built on.'
        genes:
        - preferred_term: ASXL2
          term:
            id: hgnc:23805
            label: ASXL2
        genetic_context:
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
      selected_evidence:
        snippet: In this study, we performed whole-exome sequencing in six unrelated probands with developmental
          delay, macrocephaly, and dysmorphic features. All six had de novo truncating variants in ASXL2.
        supports: SUPPORT
