            description: 'The available Asxl2 mouse. It was made and characterised to study myeloid malignancy,
              and that is what it shows: increased long-term haematopoietic stem cells and granulocyte-macrophage
              progenitors, enhanced HSC self-renewal, dysregulated H3K27ac and H3K4me1/2, and a myelodysplastic-syndrome-like
