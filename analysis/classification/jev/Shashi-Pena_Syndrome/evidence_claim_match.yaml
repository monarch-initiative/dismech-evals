        description: 'ASXL proteins are the mammalian homologs of Drosophila Additional sex combs, which
          balances trithorax and Polycomb function, and they act as the scaffolding partner of the deubiquitinase
          BAP1 in the PR-DUB complex. The ASXL genes participate in body patterning during embryogenesis
          and encode proteins involved in epigenetic regulation and in assembling transcription factors
          at specific genomic loci.

          This node is PROVISIONAL, and the reason is specific rather than routine. No chromatin abnormality
          has been measured in tissue from a person with Shashi-Pena syndrome. The chromatin account is
          inherited from what is known about ASXL1 and about the mouse, and a review of the family notes
          that the domains of ASXL proteins are partly distinct from Asx and that the roles and redundancies
          of the three members are not well understood - including whether truncating variants give loss
          of protein or a stable truncated protein with dominant-negative or gain-of-function properties.'
        biological_processes:
