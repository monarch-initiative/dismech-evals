      assertion:
        target: Disturbed PR-DUB Chromatin Regulation
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        description: 'It demonstrates that losing Asxl2 does dysregulate histone marks and gene expression
          in vivo, which supports the chromatin node in kind. It does not model this disease: the phenotype
          it produces is haematological, the genotype is a deletion rather than a truncating allele, and
          the developmental features that define Shashi-Pena syndrome are not what the model was assessed
          for.'
        limitations: Two mismatches, and the second is the important one. First, the readout is myeloid
          rather than neurodevelopmental. Second, a deletion models haploinsufficiency or null, whereas
          the human disease is caused by truncating variants whose transcripts escape nonsense-mediated
          decay and which are argued to act dominant-negatively - so the mouse may be testing a different
          molecular lesion, not merely a different tissue.
      selected_evidence:
        snippet: The altered gene expression is associated with dysregulated H3K27ac and H3K4me1/2.
