      assertion_type: Diagnosis
      assertion:
        name: ASXL2 sequencing, and what to do when it is negative
        description: 'The diagnosis is established by a suggestive phenotype plus a heterozygous pathogenic
          ASXL2 variant. The gestalt is recognisable enough that the original series was assembled by
          clinical review after the sequencing, not before.

          The practically useful addition is the negative-exome case. A balanced t(2;11) translocation
          disrupting ASXL2 was missed by chromosomal microarray and by whole-exome sequencing and was
          found by long-read (nanopore) sequencing together with RNA-seq showing reduced ASXL2 expression.
          In a patient whose phenotype fits, a negative exome is not the end of the workup.'
      selected_evidence:
        snippet: We identified a complex chromosomal rearrangement affecting ASXL2 as a pathogenic mechanism
          of Shashi-Pena syndrome in a Chinese family.
        supports: SUPPORT
