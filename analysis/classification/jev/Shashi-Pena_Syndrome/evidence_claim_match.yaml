      assertion:
        name: Autosomal dominant inheritance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'Autosomal dominant, and in practice almost always de novo, so the recurrence risk
          to siblings is presumed low. All six probands in the defining series carried de novo truncating
          variants.

          One reported family departs from that pattern in a way worth knowing: a balanced t(2;11) translocation
          affecting ASXL2 was present in the proband, her father and her grandmother. That is transmitted
          rather than de novo, and it is also the case that argues for a different molecular mechanism
          (see the discussion below).'
      selected_evidence:
        snippet: Karyotyping showed that a chromosomal balanced translocation t(2; 11) (p23; q23) was
          detected in the proband, her father, and her grandmother.
        supports: SUPPORT
