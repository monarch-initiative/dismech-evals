  0bd319353d2fb0960f00f0d70c06e3f891d2dbd733c983b244a5a3764867e6a4:
    claim:
      about:
        disease:
          name: Shashi-Pena Syndrome
          disease_term:
            preferred_term: Shashi-Pena syndrome
            term:
              id: MONDO:0014963
              label: Shashi-Pena syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Developmental Patterning
        biological_scale: ORGANISM
        mechanism_confidence: PROVISIONAL
        description: 'The route from a chromatin scaffold to macrocephaly, a specific facial gestalt,
          dental anomalies and variable intellectual disability is not traced. What can be said is that
          the phenotype is reproducible enough to be recognised clinically, and that it differs from its
          two paralogous neighbours in a consistent direction - overgrowth rather than growth restriction.

          That direction is itself informative and is the reason this node is worth stating separately
          from the chromatin node: ASXL1 and ASXL3 truncations restrict growth, ASXL2 truncations do not,
          and one patient has been reported with marked postnatal overgrowth and only minor neurodevelopmental
          features, which has led to the suggestion that SHAPNS belongs among the overgrowth disorders
          with macrocephaly.'
      selected_evidence:
        snippet: Although overlapping features with Bohring-Opitz and Bainbridge-Ropers syndromes exist,
          features that distinguish the ASXL2-associated condition from ASXL1- and ASXL3-related disorders
          are macrocephaly, absence of growth retardation, and more variability in the degree of intellectual
          disabilities.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
