              label: syndromic X-linked intellectual disability Shashi type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted hnRNP G RGG/RG-Dependent Splicing Regulation
        biological_scale: MOLECULAR
        description: hnRNP G is an m6A reader that binds RNA through an RRM and Arg-Gly-Gly (RGG) motifs
          and uses those RGG motifs to contact the phosphorylated C-terminal domain of RNA polymerase
          II, coupling it co-transcriptionally to nascent pre-mRNA and to transcriptome-wide alternative
          splicing decisions. Loss of the RGG/RG motif therefore removes the principal interface through
          which hnRNP G regulates splice-site selection.
        biological_processes:
        - preferred_term: regulation of mRNA splicing, via spliceosome
          term:
            id: GO:0048024
            label: regulation of mRNA splicing, via spliceosome
          modifier: ABNORMAL
      selected_evidence:
        snippet: Here, we show that hnRNPG directly binds to the phosphorylated carboxy-terminal domain
          (CTD) of RNA polymerase II (RNAPII) using RGG motifs in its low-complexity region.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31445886
      reference_title: Regulation of Co-transcriptional Pre-mRNA Splicing by m(6)A through the Low-Complexity
        Protein hnRNPG.
      evidence_source: IN_VITRO
      explanation: Identifies the RGG motifs deleted in Shashi-XLID as the interface hnRNP G uses to engage
