        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: shashi_obesity_macroorchidism_mechanism_gap
        prompt: What links RBMX/hnRNP G loss of function to obesity and macroorchidism, the two non-neurological
          cardinal features of the Shashi syndrome?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#RBMX Loss of Function
        rationale: All the mechanistic work on the Shashi RGG/RG allele to date addresses neural phenotypes
          (SRSF1 complex assembly, MDM4 splicing, p53 activation, neural progenitor differentiation).
          No published work explains why loss of an ubiquitously expressed splicing regulator produces
          obesity and macroorchidism, and the corresponding causal edges are therefore modelled with unknown
          intermediates.
        proposed_experiments:
        - experiment_id: shashi_tissue_resolved_splicing
          name: Tissue-resolved splicing analysis in RBMX-deficient adipose and testis
          description: Compare RBMX-dependent alternative splicing programs in adipose and gonadal tissue
            against neural tissue to identify tissue-restricted mis-splicing events that could account
            for the metabolic and gonadal features.
      selected_evidence:
        snippet: Here, we show that in somatic cells the similar yet ubiquitously expressed RBMX protein
          has similar functions.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39356106
      reference_title: An anciently diverged family of RNA binding proteins maintain correct splicing
        of a class of ultra-long exons through cryptic splice site repression.
      evidence_source: IN_VITRO
      explanation: Confirms that RBMX is ubiquitously expressed in somatic cells, which is what makes
        the tissue-restricted metabolic and gonadal phenotypes an unexplained gap rather than an obvious
        consequence.
