            label: severe X-linked intellectual disability, Gustavson type
        description: Gustavson syndrome is the other RBMX-related X-linked intellectual disability, caused
          by an in-frame deletion (p.Pro162del) rather than RGG/RG-motif loss.
        distinguishing_features:
        - Gustavson syndrome presents with profound X-linked intellectual disability and early death,
          whereas the Shashi type has moderate intellectual disability with obesity and macroorchidism.
        - The Gustavson allele is an in-frame deletion, NM_002139.4; c.484_486del, p.(Pro162del), affecting
          a putative SH3-binding motif, rather than the C-terminal RGG/RG motif deleted in the Shashi
          type.
        - The two disorders show only minor phenotypic overlap, consistent with distinct domain-specific
          disease-causing mechanisms.
      selected_evidence:
        snippet: Affected individuals presented minor phenotypic overlap with Shashi syndrome, indicating
          a different disease-causing mechanism.
