        biological_scale: MOLECULAR
        description: The RBMX RGG/RG motif is methylated by PRMT5, and this methylation licenses assembly
          with the SRSF1 splicing factor into higher-order complexes. The Shashi-XLID frameshift removes
          the motif, so the higher-order RBMX/SRSF1 complex fails to form and SRSF1 recruitment to its
          target pre-mRNAs is reduced.
        biological_processes:
        - preferred_term: protein-containing complex assembly
          term:
            id: GO:0065003
            label: protein-containing complex assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Moreover, we identify that the RBMX RGG/RG motif is methylated by protein arginine methyltransferase
          5 (PRMT5), and this regulates assembly with the SRSF1 splicing factor into higher-order complexes.
        supports: SUPPORT
