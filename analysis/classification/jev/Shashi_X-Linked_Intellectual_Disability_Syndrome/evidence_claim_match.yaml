        name: Syndromic Neurodevelopmental Impairment
        biological_scale: ORGANISM
        description: The convergent clinical outcome of the corticogenesis defect is a syndromic neurodevelopmental
          disorder in hemizygous males, centred on moderate intellectual disability. The non-neurological
          cardinal features that complete the syndrome - the distinctive craniofacial gestalt, obesity
          and macroorchidism - are modeled as parallel consequences of RBMX loss rather than as descendants
          of this node, because no published work links impaired corticogenesis to adiposity, testicular
          volume or craniofacial patterning (see the shashi_obesity_macroorchidism_mechanism_gap discussion).
          Carrier females are cognitively unaffected.
      selected_evidence:
        snippet: Hemizygous RBMX variants lead to neurodevelopmental disorders characterized by intellectual
          disability and variable brain, ocular, and genital malformations.
        supports: SUPPORT
