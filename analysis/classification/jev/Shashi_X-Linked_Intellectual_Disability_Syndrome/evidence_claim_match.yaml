        attaches_to:
        - pathophysiology#Impaired Cortical Development
        rationale: RBMX has an independently arisen retrocopy, RBMXL1, in both primates and rodents. RBMX
          and RBMXL1 share protein and RNA partners and act redundantly in brain development, so RBMXL1
          buffers RBMX deficiency in a context- and dosage-dependent manner. Because that buffering differs
