        prompt: Can rodent Rbmx models be used to study Shashi X-linked intellectual disability, given
          that Rbmx-deficient mice show only mild cortical abnormalities while affected humans have moderate
          intellectual disability?
        kind: HUMAN_MODEL_MISMATCH
