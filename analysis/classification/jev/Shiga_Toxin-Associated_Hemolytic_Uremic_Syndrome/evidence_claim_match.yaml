          term:
            id: UBERON:0001155
            label: colon
      selected_evidence:
        snippet: Enterohemorrhagic E. coli (EHEC) are a sub-group of STEC that have the ability to form
          attaching and effacing lesions (A/E lesions) that facilitate intimate adhesion to the intestinal
          mucosa.
        supports: SUPPORT
