      assertion_type: AnimalModel
      assertion:
        name: Pod-Gb3 transgenic mouse (Gb3 restricted to podocytes)
        species: Mouse
        genotype: Transgenic expression of the Shiga toxin receptor Gb3 confined to kidney podocytes
        publication: PMID:37863058
        description: A mouse engineered to express the toxin receptor in podocytes alone, then challenged
          with systemic Shiga toxin. It was built to ask why the glomerulus is the target organ, and it
          is the experimental basis for the local complement arm of this entry's mechanism and for the
          C5-inhibition rationale.
        modeled_mechanisms:
        - target: Alternative Complement Pathway Activation on Injured Endothelium
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Toxin challenge reproduced the HUS phenotype through the VEGF-A, glycocalyx, factor-H
            and local complement chain this node asserts, and early C5 inhibition rescued it.
          limitations: Gb3 is confined to podocytes by construction, so the model deliberately removes
            the glomerular endothelial and extrarenal receptor distribution that shapes human disease.
            It also cannot speak to the toxin's direct effect on endothelium, which is the arm the human
            in-vitro work covers.
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: Receptor expression outside the podocyte - on glomerular microvascular endothelium,
              and on the cerebral and other beds that produce extrarenal disease - is outside the model
              by design. The complement claim holds in the narrower form the model supports.
          readouts:
          - name: Glomerular endothelial inhibitory complement factor H binding
            target: Alternative Complement Pathway Activation on Injured Endothelium
            direction: DECREASED
            interpretation: Reduced factor H binding at the endothelial surface is the regulatory failure
              this node turns on, measured here rather than inferred.
        notes: 'Species differences in Gb3 tissue distribution are the standing caveat on animal models
          of this disease, and are the reason this model had to put the receptor where it wanted it. Note
          that the deep-research report''s stronger claim - that animals do not reproduce the human renal
          phenotype - is not adopted here: this model does reproduce it, and PMID:25530917 records that
          the relative toxicity of Stx2a over Stx1a "is replicated in mice and baboons". The honest statement
          is that receptor distribution differs and has to be engineered around, not that animal models
          fail.'
      selected_evidence:
        snippet: Transgenic mice were engineered to express the Stx receptor (Gb3) exclusively in their
          kidney podocytes (Pod-Gb3) and challenged with systemic Stx.
        supports: SUPPORT
