          around defecation and frequently no fever at presentation. This is the window in which intervention
          can alter the renal outcome, and in which antibiotics should be withheld. Most infections stop
          here: 6.3% of 3464 STEC O157 infections under US surveillance progressed to HUS, rising to 15.3%
          in children under five.'
      selected_evidence:
        snippet: the brief interval between first presentation with diarrhea and HUS onset could be exploited
          to maintain or improve renal perfusion, possibly averting renal shutdown
        supports: SUPPORT
