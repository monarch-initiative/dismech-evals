        infectious_agent_term:
          preferred_term: Shigella dysenteriae serotype 1
          term:
            id: NCBITaxon:622
            label: Shigella dysenteriae
        description: Shigella dysenteriae serotype 1 carries chromosomally encoded Shiga toxin and is
          the original source of the toxin's name. It causes the same toxin-mediated syndrome, classically
          in settings of epidemic bacillary dysentery, and is the reason MONDO scopes this concept to
          Shiga toxin rather than to E. coli alone. The CURIE is the species, which is broader than the
          agent - only serotype 1 produces the toxin - so the serotype is carried in preferred_term rather
          than asserted through the binding.
      selected_evidence:
        snippet: Stx is found in Shigella dysenteriae 1 and in some serogroups of Escherichia coli
        supports: SUPPORT
