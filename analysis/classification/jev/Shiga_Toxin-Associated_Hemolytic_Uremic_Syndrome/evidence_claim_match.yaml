        limitations: Gb3 is confined to podocytes by construction, so the model deliberately removes the
          glomerular endothelial and extrarenal receptor distribution that shapes human disease. It also
          cannot speak to the toxin's direct effect on endothelium, which is the arm the human in-vitro
          work covers.
