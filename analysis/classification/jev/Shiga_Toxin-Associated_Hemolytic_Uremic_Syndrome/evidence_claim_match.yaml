              human renal phenotype - is not adopted here: this model does reproduce it, and PMID:25530917
              records that the relative toxicity of Stx2a over Stx1a "is replicated in mice and baboons".
              The honest statement is that receptor distribution differs and has to be engineered around,
              not that animal models fail.'
