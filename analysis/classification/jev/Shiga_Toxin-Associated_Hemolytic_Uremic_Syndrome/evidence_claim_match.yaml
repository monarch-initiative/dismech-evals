  dd5b8a943326e1815b88cab204d6432aad0467d5f89267565b2505b21053f234:
    claim:
      about:
        disease:
          name: Shiga Toxin-Associated Hemolytic Uremic Syndrome
          disease_term:
            preferred_term: Shiga toxin-associated hemolytic uremic syndrome
            term:
              id: MONDO:0019536
              label: Shiga toxin-associated hemolytic uremic syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Alternative Complement Pathway Activation on Injured Endothelium
        conforms_to: complement_dysregulation#Unrestrained Alternative Pathway Amplification
        description: 'Shiga toxin activates the alternative complement pathway locally on the glomerular
          endothelial surface. There is no inherited regulator lesion here, which is what distinguishes
          this disease from atypical HUS; instead the toxin reduces factor H binding at the endothelial
          surface, so local regulation fails where the toxin has acted. In a mouse model expressing the
          toxin receptor only in podocytes, toxin challenge reduced podocyte VEGF-A, stripped the glomerular
          endothelial glycocalyx, lowered inhibitory factor H binding and activated complement locally
          - and early C5 inhibition rescued the phenotype.

          '
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: glomerular endothelial cell
          term:
            id: CL:0002188
            label: glomerular endothelial cell
        - preferred_term: podocyte
          term:
            id: CL:0000653
            label: podocyte
        biological_processes:
        - preferred_term: complement activation, alternative pathway
          term:
            id: GO:0006957
            label: complement activation, alternative pathway
          modifier: INCREASED
        locations:
        - preferred_term: renal glomerulus
          term:
            id: UBERON:0000074
            label: renal glomerulus
      selected_evidence:
        snippet: This was mediated by a reduction in podocyte vascular endothelial growth factor A (VEGF-A),
          which led to loss of glomerular endothelial cell (GEnC) glycocalyx, a reduction in GEnC inhibitory
          complement factor H binding, and local activation of the complement pathway.
        supports: SUPPORT
