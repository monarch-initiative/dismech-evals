          to HUS, which is why antibiotics are not recommended in suspected or confirmed STEC infection.
          The association is significant in low-risk-of-bias studies but not in the pooled set as a whole,
          and the proposed mechanism - induction of the bacterial SOS response and phage-mediated toxin
          release - is not established by these clinical data.
