        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Shiga Toxin Binding to Globotriaosylceramide on Gb3-Rich Cells
        description: 'The toxin is an AB5 holotoxin: a pentamer of B subunits binds the neutral glycosphingolipid
          globotriaosylceramide (Gb3/CD77) on the target cell surface. Gb3 density differs markedly between
          vascular beds, and endothelial sensitivity to the toxin tracks that density, which is what targets
          the toxin to the glomerular endothelium and sets the organ tropism of the disease. The podocyte
          is bound here on the strength of PMID:37863058, whose human biopsy arm and title put the podocyte
          among the toxin''s targets. Do not read it off that paper''s mouse alone: Gb3 was engineered
          into podocytes there, so the model shows what podocyte-restricted receptor does, not that human
          podocytes carry it.

          '
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: glomerular endothelial cell
          term:
            id: CL:0002188
            label: glomerular endothelial cell
        - preferred_term: podocyte
          term:
            id: CL:0000653
            label: podocyte
        biological_processes:
        - preferred_term: receptor-mediated endocytosis of Shiga toxin
          term:
            id: GO:0006898
            label: receptor-mediated endocytosis
        locations:
        - preferred_term: renal glomerulus
          term:
            id: UBERON:0000074
            label: renal glomerulus
      selected_evidence:
        snippet: The Stxs consist of two major subunits, an A subunit that joins noncovalently to a pentamer
          of five identical B subunits.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
