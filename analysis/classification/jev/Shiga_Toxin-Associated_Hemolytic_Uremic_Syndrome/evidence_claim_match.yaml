        context: []
      assertion_type: Treatment
      assertion:
        name: Eculizumab
        description: 'Terminal complement inhibition is supported mechanistically - toxin-driven complement
          activation is part of the lesion, and early C5 inhibition rescues a mouse model - but is not
          standard care. The phase 3 randomised placebo-controlled trial in 100 children found no effect
          on the acute phase and a lower proportion with renal sequelae at one year. The two results belong
          together: the acute primary endpoint was negative, and the one-year difference is a follow-up
          result the trial''s own authors frame as needing larger studies. The abstract lists its secondary
          endpoints as haematologic and extrarenal involvement, so the one-year sequelae figure is not
          described there as one of them.'
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: eculizumab
            term:
              id: NCIT:C48386
              label: Eculizumab
      selected_evidence:
        snippet: The rate of RRT <48 hours did not differ significantly between the two groups (48% in
          the placebo versus 38% in the eculizumab group; P = 0.31) or in the course of ARF.
        supports: REFUTE
    origin:
      assertion_path: /treatments/4
      evidence_path: /treatments/4/evidence/0
