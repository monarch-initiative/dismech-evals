            label: Escherichia coli
        description: 'Shiga toxin-producing (equivalently verotoxigenic) Escherichia coli are Gram-negative
          Enterobacteriaceae that acquire the stx1 and/or stx2 genes on lambdoid prophages. Enterohaemorrhagic
          E. coli are the subset that also carry the locus of enterocyte effacement and form attaching-and-effacing
          lesions on the intestinal mucosa. O157:H7 is the serotype most often responsible worldwide,
          but the agent is defined by toxin genotype rather than serogroup: the 2011 German outbreak strain
          was an enteroaggregative O104:H4 that had acquired stx2 by horizontal transfer.'
        has_subtypes:
        - name: Escherichia coli O157:H7
          classification: serotype
          description: The sorbitol-non-fermenting serotype historically responsible for most STEC-HUS
            in North America and the United Kingdom, and the serogroup for which age-specific progression
            rates are best quantified.
          subtype_term:
            preferred_term: Escherichia coli O157:H7
            term:
              id: NCBITaxon:83334
              label: Escherichia coli O157:H7
      selected_evidence:
        snippet: Stx-producing E. coli O157:H7 has become recognized as the leading cause of HUS worldwide.
        supports: SUPPORT
