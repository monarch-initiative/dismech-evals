              label: Shiga toxin-associated hemolytic uremic syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Stool stx1/stx2 nucleic acid amplification testing
        description: Detecting the toxin genes in stool is what identifies the agent, and it is the step
          that separates this disease from atypical HUS, where management differs. A multiplex real-time
          PCR for stx1 and stx2 detects both O157 and non-O157 STEC - which matters because the two occur
          at similar incidence - and outperformed culture-based reference testing. Sorbitol-MacConkey
          culture, which exploits O157's failure to ferment sorbitol, misses the non-O157 serogroups by
          construction.
        notes: The research report also describes Shiga toxin immunoassay, anti-O157 LPS serology for
          stool-negative cases, and the point that a negative stool does not exclude STEC-HUS because
          the toxin may have cleared by the time HUS presents. Those are not recorded as claims here because
          no reference cached for this entry states them in quotable form; they are a curation gap, not
          a dismissal.
      selected_evidence:
        snippet: we assessed the performance of a multiplex, real-time PCR assay targeting stx1 and stx2
          for the detection of O157 and non-O157 STEC in diarrheal stool samples enriched in Gram-negative
          broth
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
