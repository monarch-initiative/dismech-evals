      assertion_type: Pathophysiology
      assertion:
        name: Type III secretion system-mediated invasion and vacuolar escape
        description: 'Shigella uses a plasmid-encoded Type III secretion system (T3SS/mxi-spa) to deliver
          bacterial effector proteins directly into host cells. The translocon proteins IpaB and IpaC
          assemble a funnel-shaped pore in target membranes through which the injectisome docks and delivers
          effectors. IpaC activates small GTPases and actin nucleation to promote bacterial uptake. IpaB
          mediates phagosomal membrane disruption and directly activates caspase-1 in macrophages, triggering
          pyroptotic cell death. This allows bacterial escape from the phagolysosome into the cytosol,
          where Shigella replicates and spreads.

          '
        cell_types:
        - preferred_term: enterocyte
          term:
            id: CL:0000584
            label: enterocyte
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
