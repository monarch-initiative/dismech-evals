          term:
            id: GO:0030254
            label: protein secretion by the type III secretion system
        - preferred_term: pyroptotic cell death
          term:
            id: GO:0141201
            label: pyroptotic cell death
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
        locations:
        - preferred_term: colon
          term:
            id: UBERON:0001155
            label: colon
        - preferred_term: small intestine
          term:
            id: UBERON:0002108
            label: small intestine
      selected_evidence:
        snippet: Humans are the only natural reservoir and an inoculum of only 10-100 organisms is required
          for infection
        supports: NO_EVIDENCE
