      assertion_type: Pathophysiology
      assertion:
        name: Actin-based motility and cell-to-cell spread
        description: 'Within the host cell cytosol, Shigella recruits the host actin polymerization machinery
          via the polar adhesin IcsA/VirG. The N-WASP (WASL) and Arp2/3 complex are recruited to the bacterial
          pole, forming actin comet tails that propel the pathogen toward and through the cell membrane
          into adjacent cells. IcsP regulates IcsA surface distribution; IcsB aids in autophagy evasion.
          This cell-to-cell spread mechanism drives epithelial fenestration, mucosal ulceration, and the
          characteristic invasive colitis phenotype without exposure to the lumen.

          '
        cell_types:
        - preferred_term: enterocyte
          term:
            id: CL:0000584
            label: enterocyte
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
