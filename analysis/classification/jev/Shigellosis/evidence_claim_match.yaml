              id: MONDO:0019345
              label: shigellosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Inflammasome sensing and pyroptotic inflammation
        description: 'Cytosolic detection of Shigella T3SS components (MxiH, MxiI) and other danger signals
          activates the NAIP/NLRC4 inflammasome complex. Non-canonical inflammasome sensing via caspase-4/5
          detects cytosolic lipopolysaccharide (LPS). Both pathways converge on caspase-1 and caspase-4/5
          activation, which cleave gasdermin D (GSDMD) to form membrane pores, leading to pyroptotic cell
          death, cytokine release (IL-1β, IL-18, IL-8), and recruitment of neutrophils. Shigella modulates
          this response via IpaH family E3 ligases (e.g., IpaH7.8) to favor bacterial survival and dissemination.

          '
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        - preferred_term: enterocyte
          term:
            id: CL:0000584
            label: enterocyte
        biological_processes:
        - preferred_term: canonical inflammasome complex assembly
          term:
            id: GO:0140632
            label: canonical inflammasome complex assembly
        - preferred_term: pyroptotic cell death
          term:
            id: GO:0141201
            label: pyroptotic cell death
        - preferred_term: defense response to bacterium
          term:
            id: GO:0042742
            label: defense response to bacterium
        locations:
        - preferred_term: colon
          term:
            id: UBERON:0001155
            label: colon
      selected_evidence:
        snippet: In the colon, they secrete virulence factors that cause severe inflammation and mediate
          enterotoxic effects, enabling colonization and invasion of the colonic epithelium
        supports: SUPPORT
