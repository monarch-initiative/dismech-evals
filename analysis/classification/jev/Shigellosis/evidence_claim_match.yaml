          term:
            id: GO:0030041
            label: actin filament polymerization
        - preferred_term: regulation of cell shape
          term:
            id: GO:0008360
            label: regulation of cell shape
        locations:
        - preferred_term: colon
          term:
            id: UBERON:0001155
            label: colon
      selected_evidence:
        snippet: destruction and inflammation of the colonic epithelium accompanied by acute diarrhea,
          fever, and abdominal pain
        supports: SUPPORT
