              locus, the growth-plate histology and the treatment section; this row is the classical-nomenclature
              view of the same concept and is deliberately kept short. Note the two are not co-extensive:
              MONDO:0009894 is the NEK1-defined disorder, while type II as a clinical class also covers
              the DYNC2H1 cases and the cases in which neither gene is found.'
