        name: Type I
        display_name: Type I (Saldino-Noonan)
        description: The original SRPS subtype described by Saldino and Noonan. Characterized by markedly
          dysplastic long bones with rounded metaphyses, a narrow thorax due to short ribs, cystic renal
          dysplasia, cardiovascular defects, pancreatic cysts, and abnormal genitalia. Polydactyly is
          variably present. Death occurs in the perinatal period from pulmonary hypoplasia.
      selected_evidence:
        snippet: Short rib syndrome (SRS) is one of the lethal osteochondrodysplasias and has been traditionally
          divided into four types (I—Saldino-Noonan, II—Majewski, III—Verma-Naumoff, and IV—Beemer-Langer).
        supports: SUPPORT
