            term:
              id: MONDO:0015461
              label: short rib-polydactyly syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Digenic diallelic inheritance (NEK1/DYNC2H1)
        inheritance_term:
          preferred_term: Digenic inheritance
          term:
            id: HP:0010984
            label: Digenic inheritance
        description: 'A minority, family-level pattern superimposed on the predominant autosomal recessive
          architecture: one family carried heterozygous mutations in NEK1 and in DYNC2H1 rather than two
          hits at either locus alone. This is the "digenic diallelic" model proposed for the skeletal
          ciliopathies, in which the shared ciliary transport machinery lets single hits at two different
          genes sum to a phenotype - the same logic curated for Meckel syndrome. Evidence is graded PARTIAL
          because it rests on one additional family in the NEK1 discovery report, not on a systematic
          two-locus series. Contributing genes: NEK1 and DYNC2H1.'
      selected_evidence:
        snippet: We further substantiate a proposed digenic diallelic inheritance of ciliopathies by the
          identification of heterozygous mutations in NEK1 and DYNC2H1 in an additional family
        supports: SUPPORT
    origin:
