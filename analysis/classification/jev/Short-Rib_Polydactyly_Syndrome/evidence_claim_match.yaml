      assertion_type: Pathophysiology
      assertion:
        name: Intraflagellar Transport and Ciliogenesis Defects
        conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
        description: 'SRPS are caused by mutations in genes encoding components of the intraflagellar
          transport (IFT) machinery, dynein motor complexes, and basal body proteins. These mutations
          disrupt primary cilium assembly and maintenance, producing structurally abnormal cilia (shortened,
          bulbous tips) or reduced cilia number.

          '
        biological_processes:
        - preferred_term: Intraflagellar Transport
          term:
            id: GO:0042073
            label: intraciliary transport
        - preferred_term: Cilium Assembly
          term:
            id: GO:0060271
            label: cilium assembly
        cellular_components:
        - preferred_term: Primary Cilium
          term:
            id: GO:0005929
            label: cilium
      selected_evidence:
        snippet: 10 different genes have been identified as responsible for seven "skeletal" ciliopathies.
          Mutations have been identified in dynein motor (DYNC2H1), in intraflagellar transport (IFT)
          complexes (IFT80, IFT122, IFT43, WDR35, WDR19, and TTC21B) as well as in genes responsible for
          the basal body (NEK1, EVC, and EVC2)
        supports: SUPPORT
