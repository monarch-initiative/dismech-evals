        name: NEK1 Mutations (SRP Type II/Majewski)
        subtype: Type II
        association: Causative
        notes: 'Biallelic mutations in NEK1, encoding a kinase involved in ciliogenesis. Associated with
          SRP type II (Majewski type), characterized by disproportionately short tibiae and preaxial/postaxial
          polydactyly.

          '
      selected_evidence:
        snippet: We used homozygosity mapping in two families with autosomal-recessive short-rib polydactyly
          syndrome Majewski type to identify mutations in NEK1 as an underlying cause of this lethal osteochondrodysplasia.
