              label: short rib-polydactyly syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: Type II
        display_name: Type II (Majewski)
        subtype_term:
          preferred_term: short-rib thoracic dysplasia 6 with or without polydactyly
          term:
            id: MONDO:0009894
            label: short-rib thoracic dysplasia 6 with or without polydactyly
        description: 'Caused by biallelic mutations in NEK1. Characterized by disproportionately short
          tibiae, preaxial and postaxial polydactyly, cleft lip and palate, and genital anomalies. Hypoplastic
          lungs cause perinatal death.

          Curated in full as its own entry, Short-Rib Thoracic Dysplasia 6 With or Without Polydactyly,
          under the modern per-gene SRTD naming. That entry holds the pathograph, the DYNC2H1 cooperating
          locus, the growth-plate histology and the treatment section; this row is the classical-nomenclature
          view of the same concept and is deliberately kept short. Note the two are not co-extensive:
          MONDO:0009894 is the NEK1-defined disorder, while type II as a clinical class also covers the
          DYNC2H1 cases and the cases in which neither gene is found.'
      selected_evidence:
        snippet: Affected individuals had a narrow thorax, hypoplastic lungs, polysyndactyly, disproportionate
          dwarfism, and cleft lip and palate.
        supports: SUPPORT
