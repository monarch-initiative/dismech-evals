        name: Type III
        display_name: Type III (Verma-Naumoff)
        description: The most extensively characterized subtype, caused by mutations in DYNC2H1, WDR34,
          or IFT80. Considered part of a spectrum with Jeune ATD. Characterized by short ribs, narrow
          thorax, short long bones, an abnormal acetabulum, and numerous extraskeletal malformations including
          renal cystic disease. Lethal in the perinatal period.
      selected_evidence:
        snippet: Short-rib polydactyly (SRP) syndrome type III, or Verma-Naumoff syndrome, is an autosomal-recessive
          chondrodysplasia characterized by short ribs, a narrow thorax, short long bones, an abnormal
          acetabulum, and numerous extraskeletal malformations and is lethal in the perinatal period.
        supports: SUPPORT
