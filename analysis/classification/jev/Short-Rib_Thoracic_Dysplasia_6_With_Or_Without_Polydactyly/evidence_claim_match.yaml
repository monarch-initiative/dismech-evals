  615c6fd53ac4066a0a146fbf158f6ebb21dd622c2bcc90a7609b5381df102137:
    claim:
      about:
        disease:
          name: Short-Rib Thoracic Dysplasia 6 With or Without Polydactyly
          disease_term:
            preferred_term: short-rib thoracic dysplasia 6 with or without polydactyly
            term:
              id: MONDO:0009894
              label: short-rib thoracic dysplasia 6 with or without polydactyly
        context: []
      assertion_type: AnimalModel
      assertion:
        name: kat2J Nek1-deficient mouse
        species: Mouse
        genotype: Nek1 kat2J homozygous (spontaneous mutant)
        publication: PMID:25030234
        description: A spontaneous Nek1 mutant line originally characterised as a polycystic kidney disease
          model rather than a skeletal one. Homozygotes show aberrant kidney development before gross
          cysts appear - thin cortical zones, immature glomeruli, excessive apoptosis - then postnatal
          cysts throughout the nephron. Cilia lining the cysts are morphologically diverse, some unusually
          long and some multiple.
        genes:
        - preferred_term: NEK1
          term:
            id: hgnc:7744
            label: NEK1
        modeled_mechanisms:
        - target: Defective Ciliogenesis
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Reproduces the ciliary defect in an intact animal, both as reduced cilium number
            in embryonic fibroblasts and as abnormal ciliary morphology in cyst-lining cells.
          limitations: 'Note the direction is not simply "fewer cilia": in cyst-lining cells some cilia
            are unusually long and some cells carry several, which is a patterning and length-control
            defect rather than a failure to ciliate. That is consistent with NEK1 coordinating the cilium
            cycle, but it means the model''s ciliary phenotype is not a clean quantitative match to the
            reduced ciliation reported in patient material.'
          readouts:
          - name: Primary cilium number in embryonic fibroblasts
            target: Defective Ciliogenesis
            direction: DECREASED
            interpretation: Reduced ciliation in Nek1-deficient cells.
          - name: Ciliary morphology in cyst-lining cells
            target: Defective Ciliogenesis
            direction: ALTERED
            interpretation: Length and number dysregulation rather than absence, supporting a cilium-cycle
              coordination role.
        notes: 'This model carries no link to Impaired Growth Plate Chondrogenesis, deliberately. The
          cited characterisation is entirely renal: no rib, thorax, limb or growth-plate phenotype is
          reported. That is an absence of reported skeletal assessment, not a documented normal skeleton,
          and FAILS_TO_RECAPITULATE is a substantive negative claim that exports consume - encoding "nobody
          looked" as "the model fails" would put a claim into the graph that no source makes. The gap
          is recorded in the nek1_srtd6_no_skeletal_model discussion instead, which is where an unanswered
          question belongs. A study that assays the kat2J skeleton and finds it normal is the evidence
          such a link would need.'
      selected_evidence:
        snippet: In the embryonic kidney, Nek1 expression is most prominent in cells that will become
          podocytes and proximal tubules.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25030234
      reference_title: Expression of Nek1 during kidney development and cyst formation in multiple nephron
        segments in the Nek1-deficient kat2J mouse model of polycystic kidney disease.
