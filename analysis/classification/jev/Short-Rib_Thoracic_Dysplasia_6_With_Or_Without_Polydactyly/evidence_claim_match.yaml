      assertion_type: Inheritance
      assertion:
        name: Digenic diallelic (NEK1/DYNC2H1)
        description: A proposed second inheritance mode in which heterozygous mutations at two ciliopathy
          loci combine. It rests on individual families rather than a systematic two-locus screen, and
          one prenatal case with a single paternal-origin NEK1 splice variant and no identified second
          mutation is consistent with - but does not establish - the same idea. Treat it as proposed,
          not settled.
        inheritance_term:
          preferred_term: Digenic inheritance
          term:
            id: HP:0010984
            label: Digenic inheritance
      selected_evidence:
        snippet: Molecular analysis of fetal tissues showed a paternal-origin heterozygous splice site
          mutation in intron 7 (c.465-1 G>A) in the NEK1 gene, but no mutations in the genes of WDR35,
          DYNC2H1, IFT80, EVC and EVC2. The NEK1 mutation causes an alteration of the splice acceptor
          site of intron 7 (IVS7-1 G>A). No second mutation was identified.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/1
      evidence_path: /inheritance/1/evidence/1
      context_paths:
