  d70d1331ca6a50b5c38cd773a5fab7208078ac06958e180084c5ce255c68649b:
    claim:
      about:
        disease:
          name: Short-Rib Thoracic Dysplasia 6 With or Without Polydactyly
          disease_term:
            preferred_term: short-rib thoracic dysplasia 6 with or without polydactyly
            term:
              id: MONDO:0009894
              label: short-rib thoracic dysplasia 6 with or without polydactyly
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nek1_srtd6_no_skeletal_model
        kind: HUMAN_MODEL_MISMATCH
        prompt: Why has the Nek1 mouse been characterised almost entirely as a kidney model when the human
          NEK1 disorder is defined by a lethal skeletal phenotype, and does a Nek1 mouse reproduce the
          short ribs and thoracic constriction at all?
        attaches_to:
        - pathophysiology#Impaired Growth Plate Chondrogenesis
        - pathophysiology#Thoracic Constriction
        - pathophysiology#Pulmonary Hypoplasia
        rationale: 'The kat2J line predates the human skeletal association by decades and entered the
          literature as a polycystic kidney disease model, so its characterisation followed the kidney.
          The result is that the organ system carrying essentially all of the human mortality has no reported
          model phenotype. Three readings are possible and they are not equivalent: the mouse skeleton
          may be genuinely spared, in which case there is a species difference in how growth-plate chondrocytes
          depend on NEK1; the skeletal phenotype may simply never have been looked for; or perinatal lethality
          in the severe human alleles may have no murine counterpart because kat2J is hypomorphic rather
          than null. Distinguishing them needs only skeletal preparations and rib measurements on existing
          animals. Until then, nothing in the model literature tests the growth-plate Hedgehog mechanism
          this entry proposes.'
      selected_evidence:
        snippet: Our studies indicate that Nek1 deficiency leads to disordered kidney maturation, and
          cysts throughout the nephron.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
