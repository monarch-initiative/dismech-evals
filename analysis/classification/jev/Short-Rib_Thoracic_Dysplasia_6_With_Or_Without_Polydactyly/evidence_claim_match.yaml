            term:
              id: MONDO:0009894
              label: short-rib thoracic dysplasia 6 with or without polydactyly
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Growth Plate Chondrogenesis
        description: The primary cilium transduces Hedgehog signalling, on which endochondral ossification
          at the growth plate depends. Ciliary failure therefore produces the disproportionate shortening
          of ribs and long bones and the digit patterning defects that define the disorder. The founding
          study suggests the severity of the resulting skeletal phenotype tracks the degree of defective
          microtubule or centriole elongation, which would place NEK1 disease and the other skeletal ciliopathies
          on one mechanistic continuum rather than making them separate entities.
        biological_scale: TISSUE
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        notes: This node carries no Hedgehog descriptor. Reduced Hedgehog signalling downstream of ciliary
          failure is well established in the skeletal ciliopathies as a group, but no reference cached
          for this entry measures or states it for NEK1, so annotating it here would assert as fact what
          the entry can only reason toward. The inference belongs in the description, where it reads as
          reasoning. A source reporting Hedgehog output in NEK1-deficient tissue is what a smoothened
          signaling pathway descriptor would need.
      selected_evidence:
        snippet: suggest a correlation between the degree of defective microtubule or centriole elongation
          and organization and the severity of the resulting phenotype
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
