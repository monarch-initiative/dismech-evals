        discussion_id: nek1_srtd6_unexplained_type_ii_cases
        kind: KNOWLEDGE_GAP
        prompt: What causes the quarter of Majewski-type short-rib polydactyly cases in which neither
          NEK1 nor DYNC2H1 is mutated?
        attaches_to:
        - genetic#NEK1
        rationale: 'In the largest targeted screen, NEK1 and DYNC2H1 were both excluded in 3 of 12 type
          II cases. That is not a rounding error, and the study reports a clinical correlate worth following:
          holoprosencephaly and polymicrogyria were the main difference between the mutation-positive
          and mutation-negative groups. A brain malformation segregating with the unexplained cases suggests
          they may not be the same entity at all, rather than being NEK1-negative instances of it - which
          would matter for whether they belong under this MONDO term. Whole exome sequencing is already
          established as sensitive and specific in this disease group, so the cohort exists and the method
          exists.'
      selected_evidence:
        snippet: The main difference between the mutation positive SRP type II group and the mutation
          negative SRP type II group was the presence of holoprosencephaly and polymycrogyria in the mutation
          negative group.
        supports: SUPPORT
