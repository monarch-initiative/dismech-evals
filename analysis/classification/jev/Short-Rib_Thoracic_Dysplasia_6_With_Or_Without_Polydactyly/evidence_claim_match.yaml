      assertion:
        name: Whole exome sequencing
        description: WES is established as an efficient first-line method for the short-rib thoracic dystrophies.
          Across 11 affected individuals it identified biallelic mutations in six confirmed SRTD genes
          including NEK1 in 10, giving 90.9% sensitivity, with specificity above 99% against 993 unaffected
          individuals. That performance matters here because the alternative - iterative Sanger sequencing
          across 14 genes and 398 exons - is expensive enough that it is often simply not undertaken.
      selected_evidence:
        snippet: Compound heterozygous or homozygous mutations were identified in six confirmed SRTD genes
          in 10 individuals (IFT172, DYNC2H1, TTC21B, WDR60, WDR34 and NEK1), giving overall sensitivity
          of 90.9%.
        supports: SUPPORT
