            term:
              id: MONDO:0030356
              label: short-rib thoracic dysplasia 21 without polydactyly
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Basal Body Docking and Ciliogenesis
        conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
        biological_scale: CELLULAR
        description: 'KIAA0753 forms a ternary complex with OFD1 and FOPNL (FOR20) at centrosomes and
          pericentriolar satellites, and it acts upstream of them: mammalian centrioles need Moonraker
          to recruit OFD1, FOPNL and CEP90, which then place the distal appendage proteins CEP83, CEP89
          and CEP164. Distal appendages are what dock the basal body to the plasma membrane, the step
          that permits a cilium to be built at all. The protein also has microtubule-stabilising activity.
          In patients the result is a measurable deficit in ciliation: fibroblasts from affected individuals
          make fewer primary cilia, and ablating the gene in vitro blocks ciliogenesis outright.

          This node substitutes a docking and appendage-assembly defect for the module''s generic basal
          body lesion. Intraflagellar transport is not the primary lesion here, which is what separates
          this disorder from the IFT and dynein-2 forms of short-rib thoracic dysplasia.'
        cellular_components:
        - preferred_term: centriolar satellite
          term:
            id: GO:0034451
            label: centriolar satellite
        - preferred_term: ciliary basal body
          term:
            id: GO:0036064
            label: ciliary basal body
        biological_processes:
        - preferred_term: cilium assembly
          modifier: DECREASED
          term:
            id: GO:0060271
            label: cilium assembly
        - preferred_term: protein localization to cilium
          modifier: ABNORMAL
          term:
            id: GO:0061512
            label: protein localization to cilium
      selected_evidence:
        snippet: We show that the KIAA0753/OFIP protein, whose sequence is conserved in ciliated species,
          associates with centrosome/centriole and pericentriolar satellites in human cells and forms
          a complex with FOR20 and OFD1.
        supports: SUPPORT
    origin:
