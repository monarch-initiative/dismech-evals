      assertion:
        name: Joubert syndrome
        description: 'The same gene causes Joubert syndrome, and the boundary is soft: two of the four
          patients in the skeletal discovery series had brain abnormalities consistent with Joubert syndrome.
          The distinction as used in the literature is which system dominates - a molar tooth sign with
          hypotonia, developmental delay and abnormal eye movements and no significant skeletal disease
          is called Joubert syndrome; short ribs with a narrow thorax is called this disorder, whether
          or not a molar tooth sign is also present.'
        disease_term:
          preferred_term: Joubert syndrome
          term:
            id: MONDO:0018772
            label: Joubert syndrome
        distinguishing_features:
        - Cerebellar and brainstem malformation dominates rather than skeletal disease
        - No short ribs or thoracic constriction
        - Growth hormone deficiency reported in the KIAA0753 Joubert siblings
      selected_evidence:
        snippet: Here, we present 2 siblings with Joubert syndrome associated with growth hormone deficiency.
          Whole exome sequencing of the family identified compound heterozygous mutations in KIAA0753,
          i.e., a missense mutation (p.Arg257Gly) and an intronic mutation (c.2359-1G>C).
        supports: SUPPORT
