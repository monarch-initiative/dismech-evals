            families of the discovery series, which makes it the one recurrent allele of this disorder.
            Carrier frequency in gnomAD is 4 in 245,846 heterozygotes, minor allele frequency 1.627e-5,
            in South Asian and non-Finnish European populations.
          type: nonsense
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: KIAA0753
            term:
              id: hgnc:29110
              label: KIAA0753
        - name: c.943C>T (p.Gln315*)
          description: A nonsense variant carried in trans with c.1271del by the affected fetus of the
            discovery series, and reported homozygous in an unrelated patient with the Jeune presentation.
            gnomAD carrier frequency 6 in 276,744, minor allele frequency 2.168e-5, non-Finnish European.
          type: nonsense
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: KIAA0753
            term:
              id: hgnc:29110
              label: KIAA0753
        - name: c.1271del (p.Pro424Hisfs*9)
          description: A single-base deletion causing a frameshift, in trans with c.943C>T in the affected
            fetus. Absent from gnomAD.
          type: frameshift
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: KIAA0753
            term:
              id: hgnc:29110
              label: KIAA0753
        - name: c.810C>T (synonymous, splice-altering)
          description: A synonymous change that in silico tools did not flag and that turned out to activate
            abnormal splicing, demonstrated by cDNA sequencing. Two apparently unrelated Pakistani families
            share it within an 85 kb homozygous block, indicating a common ancestor. It is the reason
            a negative first-pass panel does not exclude this diagnosis.
          type: synonymous
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: KIAA0753
