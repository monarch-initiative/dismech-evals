              id: MONDO:0030356
              label: short-rib thoracic dysplasia 21 without polydactyly
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_srtd21_which_phenotype
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What determines whether biallelic KIAA0753 variants produce a short-rib skeletal ciliopathy,
          Joubert syndrome, or orofaciodigital syndrome type 6, given that all three arise from the same
          class of truncating allele and that individual patients carry features of more than one?
        attaches_to:
        - genetic#KIAA0753
        - pathophysiology#Defective Basal Body Docking and Ciliogenesis
        - pathophysiology#Cerebellar and CNS Involvement
        rationale: The three labels were assigned by which organ system dominated in the first patients
          described under each, not by an allele-level or mechanistic distinction. Truncating variants
          appear in all three groups. Two of the four patients in the skeletal discovery series had the
          molar tooth sign, which is the defining feature of the second label; the report of the eighth
          patient said outright that this gene shows how one locus presents as apparently distinct syndromes.
          Variant-level functional testing has been done, and it finds that every patient allele tested
          is deficient in supporting ciliogenesis - which explains why they all cause disease but not
          why they cause different diseases. With thirteen reported individuals across all three phenotypes
          there is no prospect of a genotype-phenotype analysis powered to settle it. The practical consequence
          for this knowledge base is that a citation about this gene must be checked for which presentation
          it describes.
      selected_evidence:
        snippet: This case provides confirmation of an additional molecular basis for skeletal dysplasia
          and illustrates how ciliopathies due to mutations in a single gene may present as apparently
          distinct syndromes.
        supports: SUPPORT
    origin:
