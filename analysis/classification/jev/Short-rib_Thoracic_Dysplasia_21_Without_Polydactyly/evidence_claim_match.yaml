          name: Short-rib thoracic dysplasia 21 without polydactyly
          disease_term:
            preferred_term: short-rib thoracic dysplasia 21 without polydactyly
            term:
              id: MONDO:0030356
              label: short-rib thoracic dysplasia 21 without polydactyly
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_srtd21_chondrocyte_model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the Hedgehog signalling defect measured in KIAA0753 patient fibroblasts represent
          what happens in the growth-plate chondrocyte, the cell in which the disease actually manifests?
        attaches_to:
        - pathophysiology#Impaired Hedgehog Signal Transduction
        - pathophysiology#Growth Plate Zonal Disorganisation
        rationale: Every functional measurement for this disorder was made in fibroblasts or in immortalised
          human cell lines. The disease is a chondrodysplasia, and the one direct observation in the affected
          tissue - the disorganised proliferative zone and broadened hypertrophic zone in a single fetus
          - is histology, not a signalling measurement. The gap is not that the fibroblast result is unreliable;
          it is that Hedgehog signalling in the growth plate has a different ligand source, a different
          receiving cell and a different transcriptional output, and no chondrocyte or cartilage model
          carrying a KIAA0753 genotype has been reported. Neither animal model closes the gap. The zebrafish
          shows altered cartilage patterning in an animal with no mammalian endochondral growth plate,
          and dies early. The Mnr-null mouse does have the mammalian skeleton, and it does show the Hedgehog
          defect directly - but it was characterised at E8.5 to E9.5, before the skeleton forms, and that
          measurement was again made in fibroblasts. Until a chondrocyte model exists, or the mouse is
          taken to a skeletal timepoint, the step from measured signalling defect to observed growth plate
          lesion is an inference. The Inskeep signaling experiments used fibroblasts from Joubert-presenting
          patient 1, not the skeletal-presenting patient 3, adding a presentation mismatch to the tissue
          mismatch.
      selected_evidence:
        snippet: Correspondingly, KIAA0753 patient fibroblasts have a deficit in primary ciliation and
          improper SHH and WNT signaling, with a particularly blunted response to SHH pathway stimulation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34523780
      reference_title: Genetic and phenotypic heterogeneity in KIAA0753-related ciliopathies.
      evidence_source: IN_VITRO
      explanation: Names the cell type in which the signalling defect was actually measured.
