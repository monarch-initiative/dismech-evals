  654c0c0bb07ddcb999c7a244854dd3b8c958a7fd4512f5f98a6575d0c92e7921:
    claim:
      about:
        disease:
          name: Short-rib thoracic dysplasia 21 without polydactyly
          disease_term:
            preferred_term: short-rib thoracic dysplasia 21 without polydactyly
            term:
              id: MONDO:0030356
              label: short-rib thoracic dysplasia 21 without polydactyly
        context: []
      assertion_type: Genetic
      assertion:
        name: KIAA0753
        association: Causal biallelic variant
        gene_term:
          preferred_term: KIAA0753
          term:
            id: hgnc:29110
            label: KIAA0753
        notes: 'The same gene causes three named disorders: this skeletal ciliopathy, Joubert syndrome,
          and orofaciodigital syndrome type 6. The split is by clinical label rather than by allele -
          truncating variants appear across all three - and individual patients carry features of more
          than one, so the labels describe where a patient sits on a continuum rather than three separable
          diseases. Any citation about this gene must be checked for which presentation it describes before
          it is used.'
        variants:
        - name: c.970C>T (p.Arg324*)
          description: A nonsense variant, homozygous in three affected individuals across two separate
            families of the discovery series, which makes it the one recurrent allele of this disorder.
            Carrier frequency in gnomAD is 4 in 245,846 heterozygotes, minor allele frequency 1.627e-5,
            in South Asian and non-Finnish European populations.
          type: nonsense
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: KIAA0753
            term:
              id: hgnc:29110
              label: KIAA0753
        - name: c.943C>T (p.Gln315*)
          description: A nonsense variant carried in trans with c.1271del by the affected fetus of the
            discovery series, and reported homozygous in an unrelated patient with the Jeune presentation.
            gnomAD carrier frequency 6 in 276,744, minor allele frequency 2.168e-5, non-Finnish European.
          type: nonsense
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: KIAA0753
            term:
              id: hgnc:29110
              label: KIAA0753
        - name: c.1271del (p.Pro424Hisfs*9)
          description: A single-base deletion causing a frameshift, in trans with c.943C>T in the affected
            fetus. Absent from gnomAD.
          type: frameshift
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: KIAA0753
            term:
              id: hgnc:29110
              label: KIAA0753
        - name: c.810C>T (synonymous, splice-altering)
          description: A synonymous change that in silico tools did not flag and that turned out to activate
            abnormal splicing, demonstrated by cDNA sequencing. Two apparently unrelated Pakistani families
            share it within an 85 kb homozygous block, indicating a common ancestor. It is the reason
            a negative first-pass panel does not exclude this diagnosis.
          type: synonymous
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: KIAA0753
            term:
              id: hgnc:29110
              label: KIAA0753
        - name: c.2656C>T (p.Arg886*)
          description: A nonsense variant carried in trans with c.943C>T by the skeletally-presenting
            patient of the KIAA0753 heterogeneity series, who was managed in neonatal intensive care for
            pulmonary hypoplasia and died at two weeks of severe pulmonary hypertension. Its partner allele
            is curated above, so leaving this one out would make the allele list read as complete when
            it is not.
          type: nonsense
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: KIAA0753
            term:
              id: hgnc:29110
              label: KIAA0753
      selected_evidence:
        snippet: 'To date, there have been 8 patients with biallelic pathogenic variants in KIAA0753 reported
          in the literature(5–8): two are described as having JS, one with OFD, and six with SRPS (Table
          1).'
        supports: SUPPORT
