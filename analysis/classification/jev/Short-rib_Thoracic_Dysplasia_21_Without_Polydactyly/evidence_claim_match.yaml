      assertion_type: Treatment
      assertion:
        name: Respiratory support and thoracic management
        description: 'No disease-modifying treatment exists. Management is supportive and is dominated
          by the thorax: ventilatory support for the restrictive insufficiency, nutritional support for
          the feeding difficulties, and orthopaedic follow-up for the limb and spinal consequences of
          the skeletal dysplasia. Thoracic expansion surgery is used in the short-rib dysplasias generally;
          no KIAA0753 patient has been reported to have undergone it, so it is not curated here as a treatment
          for this disorder.'
        notes: The generic Supportive Care binding summarizes the respiratory and feeding difficulties
          documented in the skeletal case. Detailed airway and feeding interventions described in Joubert-only
          patients cannot establish treatment of thoracic restriction in SRTD21. This evidence does not
          establish the absence of such interventions in other skeletal patients.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
        target_phenotypes:
        - preferred_term: Respiratory insufficiency
          term:
            id: HP:0002093
            label: Respiratory insufficiency
      selected_evidence:
        snippet: This 4 year-old boy with narrow thorax, short limbs, severe respiratory and feeding difficulties
          from birth on had a history of hypotonia and developmental delay.
