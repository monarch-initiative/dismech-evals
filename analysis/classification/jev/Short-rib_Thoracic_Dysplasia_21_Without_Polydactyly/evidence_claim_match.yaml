          description: A nonsense variant carried in trans with c.943C>T by the skeletally-presenting
            patient of the KIAA0753 heterogeneity series, who was managed in neonatal intensive care for
            pulmonary hypoplasia and died at two weeks of severe pulmonary hypertension. Its partner allele
            is curated above, so leaving this one out would make the allele list read as complete when
            it is not.
          type: nonsense
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: KIAA0753
            term:
              id: hgnc:29110
              label: KIAA0753
