        - path: /has_subtypes/0
          value:
            name: SQTS1
            display_name: SQTS1 (KCNH2 / IKr gain-of-function)
            subtype_term:
              preferred_term: short QT syndrome type 1
              term:
                id: MONDO:0012312
                label: short QT syndrome type 1
            description: Potassium-channel subtype caused by gain-of-function KCNH2 variants (canonical
              N588K), the first-described and best-characterized form; attenuated IKr rectification abbreviates
              ventricular repolarization.
            genes:
            - preferred_term: KCNH2
              term:
                id: hgnc:6251
                label: KCNH2
          role: subtype
      assertion_type: Genetic
      assertion:
        name: KCNH2 gain-of-function variants
        subtype: SQTS1
        association: Causative
        features: Gain-of-function KCNH2 variants cause SQTS1, the first-described and best-characterized
          short QT subtype. The canonical N588K substitution in the S5-P (pore) loop attenuates the rapid
          inactivation (rectification) of the IKr (HERG/Kv11.1) channel, so IKr flows abnormally throughout
          the action potential plateau and abbreviates ventricular action potential duration and refractoriness.
        gene_term:
          preferred_term: KCNH2
          term:
            id: hgnc:6251
            label: KCNH2
        inheritance:
        - name: Autosomal dominant
      selected_evidence:
        snippet: In 2 of them, we identified 2 different missense mutations resulting in the same amino
          acid change (N588K) in the S5-P loop region of the cardiac IKr channel HERG (KCNH2).
        supports: SUPPORT
    origin:
