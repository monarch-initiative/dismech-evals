        subtype: SQTS3
        association: Causative
        features: Gain-of-function KCNJ2 variants cause SQTS3. The canonical D172N substitution increases
          outward current through the inwardly rectifying Kir2.1 (IK1) channel, accelerating the terminal
          phase of repolarization. The originally reported SQTS3 family showed a distinctive ECG signature
          of tall, peaked, asymmetric T waves, proposed to distinguish it from the other potassium-channel
          subtypes; the feature derives from a single family and awaits broader confirmation.
        gene_term:
          preferred_term: KCNJ2
          term:
            id: hgnc:6263
            label: KCNJ2
        inheritance:
        - name: Autosomal dominant
      selected_evidence:
        snippet: The affected members of a single family had a G514A substitution in the KCNJ2 gene that
          resulted in a change from aspartic acid to asparagine at position 172 (D172N).
        supports: SUPPORT
