      assertion:
        name: Ion-channel gain- and loss-of-function variants
        conforms_to: cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant
        role: trigger
        description: The upstream trigger of SQTS is a pathogenic germline variant that alters a cardiac
          ion channel. Gain-of-function variants in the potassium channels KCNH2 (IKr), KCNQ1 (IKs), and
          KCNJ2 (IK1) increase repolarizing current, while loss-of-function variants in the L-type calcium
          channel subunits CACNA1C, CACNB2, and CACNA2D1 reduce inward calcium current. Either route shifts
          the net balance of currents toward accelerated repolarization in structurally normal myocardium.
        genes:
        - preferred_term: KCNH2
          term:
            id: hgnc:6251
            label: KCNH2
        - preferred_term: KCNQ1
          term:
            id: hgnc:6294
            label: KCNQ1
        - preferred_term: KCNJ2
          term:
            id: hgnc:6263
            label: KCNJ2
        - preferred_term: CACNA1C
          term:
            id: hgnc:1390
            label: CACNA1C
        - preferred_term: CACNB2
          term:
            id: hgnc:1402
            label: CACNB2
        - preferred_term: CACNA2D1
          term:
            id: hgnc:1399
            label: CACNA2D1
        cell_types:
        - preferred_term: cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        molecular_functions:
        - preferred_term: monoatomic ion channel activity
          term:
            id: GO:0005216
            label: monoatomic ion channel activity
          modifier: ABNORMAL
        locations:
        - preferred_term: heart
          term:
            id: UBERON:0000948
            label: heart
      selected_evidence:
        snippet: In 2 of them, we identified 2 different missense mutations resulting in the same amino
          acid change (N588K) in the S5-P loop region of the cardiac IKr channel HERG (KCNH2).
        supports: SUPPORT
