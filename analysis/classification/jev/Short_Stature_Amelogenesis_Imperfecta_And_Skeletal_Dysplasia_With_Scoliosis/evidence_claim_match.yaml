        discussion_id: mismatch_mouse_joint_dislocation
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why does the Slc10a7 knockout mouse reproduce the growth, long-bone, craniofacial and
          enamel phenotypes of SSASKS but not the large-joint dislocations that define the human disease
          group?
        attaches_to:
        - pathophysiology#Cartilage and Ligament Proteoglycan Deficiency with Joint Instability
        rationale: The knockout has the cartilage heparan sulfate deficit that is supposed to cause the
          joint phenotype, yet no obvious dislocation. Either the mouse joint phenotype is present but
          too subtle for the assessment performed, or quadrupedal loading protects the mouse joints, or
          the human dislocations require something the heparan sulfate reduction does not supply. Which
          it is determines whether this model can be used to test interventions aimed at the joint arm
          at all, and the reporting authors explicitly left the question open.
        proposed_experiments:
        - experiment_id: exp_knockout_quantitative_joint_laxity
          name: Quantitative joint laxity phenotyping of the knockout
          description: Apply quantitative joint-laxity and micro-CT congruence measurement, plus histological
            assessment of the periarticular soft tissues, to the knockout, rather than relying on gross
            observation of dislocation. A graded laxity deficit would support the subtle-phenotype explanation.
      selected_evidence:
        snippet: However, no obvious joint dislocation was observed in Slc10a7−/− mice.
        supports: SUPPORT
