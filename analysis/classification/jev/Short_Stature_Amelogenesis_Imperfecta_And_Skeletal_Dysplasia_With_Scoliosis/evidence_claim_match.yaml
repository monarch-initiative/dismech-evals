        discussion_id: gap_enamel_route_gag_versus_trafficking
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the amelogenesis imperfecta of SSASKS caused by the glycoprotein trafficking defect
          rather than by the proteoglycan defect that explains the skeletal phenotype?
        attaches_to:
        - pathophysiology#Ameloblast Enamel Matrix Failure
        rationale: 'The founding study''s argument is negative and inferential: amelogenesis imperfecta
          appears specific to SLC10A7 deficiency within a disease group whose other members also have
          proteoglycan-biosynthesis defects, so proteoglycan deficiency alone is unlikely to explain it.
          That is a reasonable inference but not a measurement, and it is the reason this entry routes
          the enamel node through the trafficking arm rather than the proteoglycan arm. If wrong, the
          pathograph''s branch structure is wrong.'
        proposed_experiments:
        - experiment_id: exp_ameloblast_gag_versus_trafficking
          name: Ameloblast-specific dissection of the two arms
          description: Compare enamel formation in ameloblast-restricted disruption of glycosaminoglycan
            synthesis against ameloblast-restricted disruption of post-Golgi glycoprotein trafficking,
            and against Slc10a7 loss, measuring enamel thickness and mineral density. Only the trafficking
            arm should phenocopy Slc10a7 loss if the inference holds.
      selected_evidence:
        snippet: suggesting that amelogenesis imperfecta is not due to a defect in proteoglycan synthesis
        supports: SUPPORT
