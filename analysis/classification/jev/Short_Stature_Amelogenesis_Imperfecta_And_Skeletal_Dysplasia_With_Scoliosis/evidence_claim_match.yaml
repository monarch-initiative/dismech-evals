          are consanguineous, and both parents are heterozygous carriers. Expressivity is variable and
          partly genotype-correlated: the p.Pro303Leu missense allele, which retains residual calcium-regulatory
          activity, gives a milder skeletal phenotype than the nonsense and splice alleles.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
