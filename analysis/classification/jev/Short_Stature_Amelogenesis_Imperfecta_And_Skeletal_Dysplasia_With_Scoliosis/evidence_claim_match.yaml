            label: Autosomal recessive inheritance
        expressivity: VARIABLE
      selected_evidence:
        snippet: Using exome sequencing, we identify homozygous mutations in SLC10A7 in six individuals
          with skeletal dysplasia with multiple dislocations and amelogenesis imperfecta.
        supports: SUPPORT
