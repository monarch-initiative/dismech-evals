            term:
              id: MONDO:0032703
              label: short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: SLC10A7-CDG patient dermal fibroblasts
        description: 'Primary dermal fibroblasts from affected individuals are the workhorse human system
          for this disease and carry the two measurements that connect the calcium lesion to the glycosylation
          lesion in the same human cells: increased calcium influx on extracellular calcium challenge,
          and a selectively reduced heparan sulfate fraction. The same cells show intracellular mislocalization
          of glycoproteins and defective post-Golgi transport.'
        experimental_model_type: PRIMARY_CELL_CULTURE
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        cell_types:
        - preferred_term: Dermal fibroblast
          term:
            id: CL:0002620
            label: skin fibroblast
        publication: PMID:30082715
        modeled_mechanisms:
        - target: Secretory Pathway Calcium Dyshomeostasis
          relationship: MEASURES
          fidelity: HIGH
          description: Calcium influx after an extracellular calcium challenge is significantly increased
            relative to control fibroblasts.
          limitations: Fibroblasts are not an affected tissue in this disease; they report the cell-autonomous
            biochemical lesion but cannot show how it plays out in chondrocytes, osteoblasts or ameloblasts.
          readouts:
          - name: Calcium influx after extracellular CaCl2 challenge
            target: Secretory Pathway Calcium Dyshomeostasis
            direction: INCREASED
            interpretation: Functional confirmation in human patient cells that loss of SLC10A7 de-represses
              calcium entry.
        - target: Golgi Glycosylation and Glycosaminoglycan Biosynthesis Defect
          relationship: MEASURES
          fidelity: HIGH
          description: The heparan sulfate proportion of total glycosaminoglycan is reduced about two-fold,
            with total glycosaminoglycan preserved.
          limitations: Fibroblast glycosaminoglycan composition is not cartilage glycosaminoglycan composition;
            the cartilage measurement in the same study comes from the mouse, not from affected individuals.
          readouts:
          - name: Heparan sulfate proportion of total glycosaminoglycan
            target: Golgi Glycosylation and Glycosaminoglycan Biosynthesis Defect
            direction: DECREASED
            interpretation: Selective loss of the heparan sulfate chain class rather than a global glycosaminoglycan
              deficit.
        - target: Defective Post-Golgi Glycoprotein Delivery to the Extracellular Matrix
          relationship: MEASURES
          fidelity: HIGH
          description: Glycoproteins are mislocalized intracellularly and post-Golgi transport to the
            cell membrane is defective.
          limitations: The assay reports delivery to the fibroblast plasma membrane, which is a proxy
            for, not a measurement of, delivery into skeletal or enamel matrix.
      selected_evidence:
        snippet: we identify decreased heparan sulfate levels in Slc10a7-/- mouse cartilage and patient
          fibroblasts
        supports: SUPPORT
