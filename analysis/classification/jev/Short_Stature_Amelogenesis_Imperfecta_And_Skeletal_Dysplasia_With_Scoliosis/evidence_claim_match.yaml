              label: short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_calcium_to_glycosylation_step
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what molecular step does raised ER and Golgi luminal calcium in SLC10A7-deficient cells
          produce the specific glycosylation defects observed — reduced heparan sulfate, abnormal hybrid-type
          N-glycans, and disrupted O-GalNAc glycosylation?
        attaches_to:
        - pathophysiology#Secretory Pathway Calcium Dyshomeostasis
        - pathophysiology#Golgi Glycosylation and Glycosaminoglycan Biosynthesis Defect
        rationale: The calcium lesion and the glycosylation lesion are each well established in patient
          cells, but the edge between them is inferred from the general calcium-dependence of Golgi function
          rather than demonstrated. The 2025 study that went furthest towards closing it opened by stating
          the mechanism was unknown, and its candidate mediators — altered COSMC and C1GALT1 abundance,
          mislocalized Cab45 — are correlates rather than a demonstrated causal chain. This matters for
          curation because it is the single edge on which the CDG classification of the disease rests.
        proposed_experiments:
        - experiment_id: exp_calcium_clamp_golgi_glycosylation_rescue
          name: Calcium-clamp rescue of Golgi glycosylation
          description: Restore Golgi luminal calcium in SLC10A7-null cells independently of SLC10A7 (for
            example by manipulating SPCA1 or SERCA activity) and test whether heparan sulfate synthesis,
            N-glycan profile and O-GalNAc glycosylation normalize. Rescue would establish the calcium
            step as causal; failure would place the glycosylation defect on a parallel SLC10A7-dependent
            route.
      selected_evidence:
        snippet: The mechanisms by which SLC10A7 deficiency leads to Golgi glycosylation abnormalities
          are unknown.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
