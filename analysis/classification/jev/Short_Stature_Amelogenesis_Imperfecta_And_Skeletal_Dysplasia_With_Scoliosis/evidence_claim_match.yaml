        description: 'Three glycosylation outputs fail together, which is why SSASKS is classified as
          a congenital disorder of glycosylation affecting multiple pathways rather than a single-enzyme
          defect. Heparan sulfate on proteoglycans is reduced roughly two-fold in patient fibroblasts
          and about 2.5-fold in mutant mouse cartilage, while total glycosaminoglycan content is preserved;
          N-glycans on plasma glycoproteins are abnormal; and O-GalNAc glycosylation is disrupted, with
          altered abundance of the C1GALT1 chaperone COSMC and mislocalization of the calcium-binding
          Golgi cargo sorter Cab45. This is the organ-agnostic substitution this entry makes against the
          CDG module''s Golgi trigger: the module''s generic disruption of Golgi glycosylation machinery
          is here caused by a luminal ionic lesion rather than by loss of a glycosyltransferase or of
          a tethering complex.'
