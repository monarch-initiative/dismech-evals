              label: short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Childhood and adolescence
        notes: Skeletal involvement is progressive through childhood. Spinal deformity in particular worsens
          and is the phase that drives intervention; in the one fully documented surgical course, scoliosis
          required a first operation at about three and a half years and staged procedures continued to
          age fourteen.
      selected_evidence:
        snippet: 'Short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis is a rare,
          autosomal recessive, skeletal disorder first described in 2018. This syndrome starts with pre-
          and postnatal developmental delay, and gradually presents with variable facial dysmorphisms,
          a short stature, amelogenesis imperfecta, and progressive skeletal dysplasia affecting the limbs,
          joints, hands, feet, and spine. CASE PRESENTATION: We identified a homozygous novel nonsense
          mutation in exon 1 of SLC10A7 (NM_001300842.2: c.100G > T / p.Gly34*) segregating with the typical
          disease phenotype in a Han Chinese family. We reviewed the 12-year surgical treatment history
          with seven interventions on spine. ... The patient had her first surgery at 3.5 years old. ...
          She underwent lengthening twice at 4.5 and 5.5 years old respectively, and each time she was
          lengthened by 0.5 cm. From then, she had an X-ray every year to monitor the growth of her spine
          and progression of her scoliosis. ... At the age of 10.2, scoliosis progressed severely where
          the proximal end of single-side rods located. ... She received lengthening surgeries twice again
          at the ages of 11.2 and 12.2, lengthened by 0.8 cm and 0.6 cm respectively. Notably, the surgeons
          had difficulty during every lengthening session and the effect was limited. The last surgery
          of final definite in situ fusion was performed at the age of 14.2 (Fig. 1N).'
        supports: SUPPORT
