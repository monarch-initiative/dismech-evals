            term:
              id: MONDO:0032703
              label: short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: decision_module_conformance_boundaries
        kind: INTERPRETATION
        status: RESOLVED
        prompt: Should this entry declare conformance to defective_skeletal_mineralization or osteoporosis_bone_resorption,
          given that affected individuals have decreased bone mineral density compatible with osteoporosis?
        attaches_to:
        - pathophysiology#Growth Plate Disorganization and Impaired Skeletal Mineralization
        rationale: 'No, to both. defective_skeletal_mineralization is organized around three mutually
          exclusive trigger arms — calciopenic, phosphopenic, and mineralization-inhibitor excess — and
          none of them describes this disease. Calcium, phosphate and pyrophosphate handling are not reported
          as abnormal in SSASKS; what fails is delivery of a normally composed organic matrix, one step
          earlier than that module''s entry points. Conforming would assert a trigger arm the literature
          does not support. osteoporosis_bone_resorption is declined for the opposite reason: its mechanism
          is increased RANKL-driven osteoclastic resorption, and no resorption abnormality has been reported
          here — the published defect is a formation defect, so mineral is never laid down rather than
          lost after the fact. This is recorded as a resolved decision rather than left as prose so that
          a later curator revisiting the mineralization node finds the reasoning attached to it.'
      selected_evidence:
        snippet: Our combined data indicate an important role for SLC10A7 in bone mineralization and transport
          of glycoproteins to the extracellular matrix.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
