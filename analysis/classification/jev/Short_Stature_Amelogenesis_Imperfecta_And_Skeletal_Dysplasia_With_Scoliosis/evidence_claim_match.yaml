          TGF-beta signalling rather than a Golgi glycosylation defect — and carries a more prominent
          cardiovascular phenotype. This pairing is a documented named-entity-confusion hazard for automated
          literature retrieval on the SSASKS disease name; molecular testing, not phenotype, resolves
          it.
        notes: Flagged during this entry's deep-research preflight, which reported LTBP3 as a rival gene
