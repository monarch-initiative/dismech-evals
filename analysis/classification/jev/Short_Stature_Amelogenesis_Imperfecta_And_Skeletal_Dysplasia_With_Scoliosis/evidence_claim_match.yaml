        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic SLC10A7 Loss of Function
        biological_scale: MOLECULAR
        role: trigger
        description: SLC10A7 encodes a ten-transmembrane-domain protein of the SLC10 sodium/bile-acid
          cotransporter family which, unlike its relatives, transports none of the family's canonical
          substrates and remains an orphan carrier. It localizes to compartments of the secretory pathway,
          including the Golgi and the plasma membrane. Of the alleles actually assayed for protein level,
          a splice variant and the p.Leu74Pro missense reduce SLC10A7 protein expression; this is not
          a property of every missense allele, since p.Pro303Leu fibroblasts instead show SLC10A7 overexpression
          while the protein retains only partial calcium-regulatory activity. Hypomorphic rather than
          null function is the molecular basis of the milder end of the phenotypic spectrum. This is the
          disorder-specific lesion this entry substitutes for the generic Golgi trigger of the conserved
          CDG module.
        genes:
        - preferred_term: SLC10A7
          term:
            id: hgnc:23088
            label: SLC10A7
        cellular_components:
        - preferred_term: Golgi apparatus
          term:
            id: GO:0005794
            label: Golgi apparatus
      selected_evidence:
        snippet: Functional studies in vitro demonstrate that SLC10A7 mutations reduce SLC10A7 protein
          expression.
        supports: SUPPORT
