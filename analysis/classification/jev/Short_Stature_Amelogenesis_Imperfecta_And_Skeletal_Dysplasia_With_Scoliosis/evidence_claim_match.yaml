              label: short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Slc10a7 knockout mouse
        species: Mouse
        genotype: Slc10a7 constitutive homozygous null
        category: Genetic
        description: A constitutive Slc10a7 knockout generated by the gene-discovery group. It reproduces
          the growth, long-bone, craniofacial and enamel arms of the human phenotype and supplies the
          cartilage heparan sulfate measurement, but it does not reproduce joint dislocation, which is
          one of the defining human features.
        publication: PMID:30082715
        genes:
        - preferred_term: SLC10A7
          term:
            id: hgnc:23088
            label: SLC10A7
        modeled_mechanisms:
        - target: Growth Plate Disorganization and Impaired Skeletal Mineralization
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Shortened long bones with growth plate disorganization, growth retardation at birth
            and at eight weeks, and altered long-bone morphology.
          limitations: A constitutive null cannot separate the tissue-autonomous requirement in chondrocytes
            from systemic effects, and cannot address the temporal window in which SLC10A7 is needed.
          readouts:
          - name: Long bone length
            target: Growth Plate Disorganization and Impaired Skeletal Mineralization
            direction: DECREASED
            interpretation: Structural correlate of the growth plate node, measured at birth and at eight
              weeks.
        - target: Ameloblast Enamel Matrix Failure
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Tooth enamel anomalies are present in the knockout, matching the near-constant
            human enamel phenotype.
          limitations: Mouse and human amelogenesis differ in tooth type and in the continuously erupting
            incisor, so the correspondence is at the level of enamel formation failing rather than of
            an identical lesion.
        - target: Cartilage and Ligament Proteoglycan Deficiency with Joint Instability
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: The knockout shows no obvious joint dislocation, so the model does not reproduce
            the multiple-dislocation feature that defines the human disease group. The cartilage heparan
            sulfate reduction is nonetheless present in the same animals, so the biochemical arm of this
            node is modelled while its clinical consequence is not.
          limitations: The reporting authors themselves suggest the difference may be a matter of more
            subtle joint defects going undetected in the mouse rather than a true biological divergence,
            so this negative should not be read as evidence against the proteoglycan mechanism. Quadrupedal
            loading of the mouse skeleton also differs from the bipedal loading under which human large
            joints dislocate.
      selected_evidence:
        snippet: We generate a Slc10a7-/- mouse model, which displays shortened long bones, growth plate
          disorganization and tooth enamel anomalies, recapitulating the human phenotype.
        supports: SUPPORT
