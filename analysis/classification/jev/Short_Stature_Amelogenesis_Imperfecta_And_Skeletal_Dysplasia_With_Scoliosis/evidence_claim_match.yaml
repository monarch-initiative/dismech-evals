        role: central_effector
        description: 'SLC10A7 is a negative regulator of intracellular calcium signalling, and has been
          proposed to be renamed RCAS on that basis. Its expression is inversely correlated with store-operated
          calcium entry, and it co-localizes with STIM1, Orai1 and SERCA2. Loss of function therefore
          raises calcium influx: SLC10A7 knockout cells show increased influx after thapsigargin, ionomycin
          and ATP/carbachol, and patient fibroblasts show increased Ca2+ influx after an extracellular
          calcium challenge. Within the secretory pathway itself the consequence is an increased ER and
          Golgi calcium content. Because Golgi glycosyltransferase activity and Golgi organization are
          calcium-dependent, this node is the rate-limiting step linking an orphan transporter to a glycosylation
          disease.'
        cell_types:
