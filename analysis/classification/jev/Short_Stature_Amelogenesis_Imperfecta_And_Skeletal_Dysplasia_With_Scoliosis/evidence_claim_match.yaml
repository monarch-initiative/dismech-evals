            term:
              id: MONDO:0032703
              label: short stature, amelogenesis imperfecta, and skeletal dysplasia with scoliosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Secretory Pathway Calcium Dyshomeostasis
        biological_scale: MOLECULAR
        role: central_effector
        description: 'SLC10A7 is a negative regulator of intracellular calcium signalling, and has been
          proposed to be renamed RCAS on that basis. Its expression is inversely correlated with store-operated
          calcium entry, and it co-localizes with STIM1, Orai1 and SERCA2. Loss of function therefore
          raises calcium influx: SLC10A7 knockout cells show increased influx after thapsigargin, ionomycin
          and ATP/carbachol, and patient fibroblasts show increased Ca2+ influx after an extracellular
          calcium challenge. Within the secretory pathway itself the consequence is an increased ER and
          Golgi calcium content. Because Golgi glycosyltransferase activity and Golgi organization are
          calcium-dependent, this node is the rate-limiting step linking an orphan transporter to a glycosylation
          disease.'
        cell_types:
        - preferred_term: Dermal fibroblast
          term:
            id: CL:0002620
            label: skin fibroblast
        biological_processes:
        - preferred_term: regulation of cytosolic calcium ion concentration
          term:
            id: GO:0051480
            label: regulation of cytosolic calcium ion concentration
          modifier: ABNORMAL
        - preferred_term: Golgi calcium ion homeostasis
          term:
            id: GO:0032468
            label: Golgi calcium ion homeostasis
          modifier: ABNORMAL
      selected_evidence:
        snippet: In the present study, SLC10A7 was established as a novel negative regulator of intracellular
          calcium signaling that most likely acts via STIM1, Orai1 and/or SERCA2 inhibition.
        supports: SUPPORT
