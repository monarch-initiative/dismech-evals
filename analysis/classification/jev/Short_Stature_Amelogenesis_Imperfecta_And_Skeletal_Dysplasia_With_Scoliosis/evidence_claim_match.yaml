      assertion_type: Genetic
      assertion:
        name: SLC10A7
        gene_term:
          preferred_term: SLC10A7
          term:
            id: hgnc:23088
            label: SLC10A7
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        notes: 'SLC10A7 is the only gene implicated in SSASKS. Reported pathogenic alleles are nonsense
          (p.Gly34*, p.Gln172*), splice-site (including c.472-1G>T and c.722-16A>G) and missense (p.Leu74Pro,
          p.Gly130Arg, p.Pro303Leu). The genotype-phenotype relation is graded by residual function rather
          than by variant class alone: p.Pro303Leu retains partial calcium-regulatory activity and gives
          the mildest reported phenotype, and a 2026 study showed that a splice allele previously presumed
          to be a complete null in fact leaves substantial normally spliced transcript, so allele nullity
          should not be inferred from the predicted consequence.'
      selected_evidence:
        snippet: Using exome sequencing, we identify homozygous mutations in SLC10A7 in six individuals
          with skeletal dysplasia with multiple dislocations and amelogenesis imperfecta.
        supports: SUPPORT
