        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ameloblast Enamel Matrix Failure
        biological_scale: TISSUE
        description: Enamel is a secreted, protein-templated mineralized matrix, and it is the tissue
          in which SLC10A7 loss is most consistently expressed clinically. Slc10a7 is transcribed in the
          inner dental epithelium and in ameloblasts and odontoblasts during tooth development, mutant
          mice have tooth enamel anomalies, and every reported affected individual has amelogenesis imperfecta,
          typed as hypomineralized in the founding cohort and as hypoplastic/hypomineralized in the mildest
          case. Notably the founding study argued that the enamel phenotype is probably not explained
          by the proteoglycan defect alone, since amelogenesis imperfecta is what separates SSASKS from
          the other chondrodysplasias with multiple dislocations; the glycoprotein-trafficking arm is
          the more likely route.
        cell_types:
        - preferred_term: Ameloblast
          term:
            id: CL:0000059
            label: ameloblast
        biological_processes:
        - preferred_term: amelogenesis
          term:
            id: GO:0097186
            label: amelogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: At E18.5 labeling was observed in the inner dental epithelium of incisors and in ameloblasts
          and odontoblasts of molars.
        supports: SUPPORT
    origin:
