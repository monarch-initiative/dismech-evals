  5ca81a3aec9d0df8b900859604af2ecc5e80b506530e4926bc9f4550b3d78eaa:
    claim:
      about:
        disease:
          name: Short Stature, Dauber-Argente Type
          disease_term:
            preferred_term: Short stature, Dauber-Argente type
            term:
              id: MONDO:0859182
              label: Short stature, Dauber-Argente type
        context: []
      assertion_type: Treatment
      assertion:
        name: Recombinant Human IGF-1 (Mecasermin)
        description: 'rhIGF-1 given twice daily at escalating doses (40 to 120 micrograms/kg) supplies
          free hormone downstream of the blocked release step. In the two Spanish p.D643fs25* siblings,
          one-year data showed increased growth velocity and height with no hypoglycaemia or other adverse
          effects, and six-year data showed both reaching target height with progressive normalisation
          of bone mineral density and increased lean mass. Total IGF-1 and IGFBP-3 stay elevated throughout,
          so they cannot be used to monitor response.

          That clean safety record is specific to those two patients and should not be read as a property
          of the treatment. In a separately reported family the older brother developed severe headaches
          from raised intracranial hypertension, attributed to the rhIGF-1, and therapy was discontinued;
          the symptoms resolved on stopping. Intracranial hypertension is a recognised class effect of
          mecasermin, so it is the adverse event to monitor for rather than an isolated curiosity.'
        therapeutic_modality: PEPTIDE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: mecasermin
            term:
              id: NCIT:C2262
              label: Mecasermin
      selected_evidence:
        snippet: There was a clear increase in growth velocity and height in both siblings.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
