        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rhpappa2_sex_specific_efficacy
        kind: HUMAN_MODEL_MISMATCH
        prompt: Recombinant PAPP-A2 would correct the actual lesion rather than bypass it, but its efficacy
          in Pappa2-deficient mice appears female-specific. Does that sex-dependence reflect mouse biology
          or a real constraint on the human therapy?
        attaches_to:
        - pathophysiology#Loss of PAPP-A2 Proteolytic Activity
        rationale: 'rhIGF-1 works, but it is a bypass: it leaves the sequestered pool sequestered and
          the release step blocked. rhPAPP-A2 is the mechanistically direct alternative, and in Pappa2-deficient
          mice it modulates growth-related IGF-1 signalling — but the authors report the effect as female-specific.
          The mouse knockout is itself strongly sex-dimorphic in growth deficit (10% versus 25-30% weight
          reduction), so the therapeutic dimorphism may simply track the larger deficit available to rescue
          in females rather than a sex-specific drug mechanism. The reported human families are too small
          to establish whether any sex difference exists at all, and the two long-term-treated index patients
          are one female and one male sibling. Distinguishing "the drug works differently by sex" from
          "the model has more to rescue in females" matters before this reaches a trial design.'
      selected_evidence:
        snippet: pointing to rhPAPP-A2 as a promising drug to alleviate postnatal growth retardation underlying
          low IGF1 bioavailability in a female-specific manner
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
