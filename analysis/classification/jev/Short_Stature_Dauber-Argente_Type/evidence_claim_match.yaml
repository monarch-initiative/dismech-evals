              label: Short stature, Dauber-Argente type
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Acid-labile subunit (IGFALS) deficiency
        description: The closest mimic, and separated by the direction of the IGF-1 abnormality rather
          than by the clinical picture. Both are autosomal recessive ternary complex disorders with mild
          postnatal growth failure and insulin insensitivity. ALS deficiency has severely *reduced* IGF-1
          and IGFBP-3 that stay low after GH treatment; PAPP-A2 deficiency has *elevated* total IGF-1,
          IGFBP-3 and ALS with low free IGF-1. Measuring total IGF-1 alone will separate them; measuring
          it alone will also miss PAPP-A2 deficiency entirely.
      selected_evidence:
        snippet: complete ALS deficiency is characterized by severe reduction of IGF-I and IGFBP-3 that
          remain low after GH treatment, associated with mild growth retardation, much less pronounced
          than the IGF-I deficit.
        supports: SUPPORT
    origin:
