            term:
              id: MONDO:0859182
              label: Short stature, Dauber-Argente type
        context: []
      assertion_type: Genetic
      assertion:
        name: PAPPA2
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: PAPPA2
          term:
            id: hgnc:14615
            label: PAPPA2
        notes: 'Three homozygous alleles are reported across three families: the frameshift p.D643fs25*
          and the missense p.Ala1033Val in the two index families, and the nonsense p.Glu886* in exon
          7 in the Saudi kindred. The missense allele is the informative one — in vitro IGFBP cleavage
          assays showed it abolishes proteolytic activity completely, which is what establishes loss of
          enzyme function, rather than reduced expression or altered substrate binding, as the disease
          mechanism.'
        variants:
        - name: PAPPA2 p.D643fs25*
          description: Homozygous frameshift in the Spanish index family; carriers have undetectable PAPP-A2
            activity and are the two siblings in whom rhIGF-1 was first trialled.
        - name: PAPPA2 p.Ala1033Val
          description: Homozygous missense in the second index family. Despite being a single amino-acid
            substitution it abolishes proteolytic activity entirely in vitro.
        - name: PAPPA2 p.Glu886*
          description: Homozygous nonsense variant in exon 7 reported in the Saudi confirming family.
      selected_evidence:
        snippet: Two different homozygous mutations in PAPPA2, p.D643fs25* and p.Ala1033Val, were associated
          with this novel syndrome of growth failure. In vitro analysis of IGFBP cleavage demonstrated
          that both mutations cause a complete absence of PAPP-A2 proteolytic activity.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
