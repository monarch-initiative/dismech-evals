          by binding to SMAD proteins and recruiting transcriptional repression complexes. Loss-of-function
          mutations in SKI lead to enhanced TGF-beta signaling, similar to the paradoxical TGF-beta hyperactivation
          seen in Loeys-Dietz and Marfan syndromes. This drives abnormal connective tissue development.

          '
        cell_types:
        - preferred_term: vascular associated smooth muscle cell
          term:
