            label: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
        - preferred_term: Cranial Suture Closure
          term:
            id: GO:0060363
            label: cranial suture morphogenesis
      selected_evidence:
        snippet: Cultured dermal fibroblasts from affected individuals showed enhanced activation of TGF-beta
          signaling cascades and higher expression of TGF-beta-responsive genes relative to control cells.
        supports: SUPPORT
