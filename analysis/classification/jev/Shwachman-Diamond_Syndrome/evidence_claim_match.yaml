      assertion:
        classification_value: phagocyte defect
        notes: 'IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970), Table 5 "Congenital
          defects of phagocyte number or function", section 1 (Congenital Neutropenias). Four Table 5
          rows are printed under the Shwachman-Diamond Syndrome disease label, one per causal gene: SBDS
          (AR, MIM 607444), DNAJC21 (AR, MIM 617052), EFL1 (AR, MIM 617941) and SRP54 (AD, MIM 604857).
          This entry is the knowledge-base home for the SBDS, DNAJC21 and SRP54 rows; the EFL1 row is
          carried by the separate EFL1-related Shwachman-Diamond syndrome entry, which mirrors the split
          already recorded in the isds_skeletal_category notes above. Between them the two entries retire
          all four rows, and neither claims the other''s.

          IUIS 2022 places Shwachman-Diamond syndrome in Table 5, NOT in Table 9 (bone marrow failure).
          SBDS, DNAJC21, EFL1 and SRP54 appear only in the Table 5 congenital-neutropenia section; Table
          9 contains Fanconi anemia, MIRAGE, ataxia-pancytopenia, dyskeratosis congenita, BMFS1/2/5, Coats
          plus and MECOM. The `bone marrow failure` permissible value in src/dismech/schema/classifications/iuis_immunodeficiency.yaml
          names SDS in its description; that is a schema-documentation defect to be fixed separately and
          is not a reason to retag this entry.

          iuis_category is single-valued and cannot be scoped to a has_subtypes member, so the multi-row
          coverage is recorded here in prose.'
      selected_evidence:
        snippet: Congenit al defects of phagocyte number or function
        supports: SUPPORT
