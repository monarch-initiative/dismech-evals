        - path: /has_subtypes/3
          value:
            name: Severe neonatal SMD
            display_name: SBDS-related severe neonatal spondylometaphyseal dysplasia
            subtype_term:
              preferred_term: SBDS-related severe neonatal spondylometaphyseal dysplasia
              term:
                id: MONDO:0850096
                label: SBDS-related severe neonatal spondylometaphyseal dysplasia
            description: 'The severest end of the SBDS phenotypic spectrum, and the only presentation
              in which the skeleton is a neonatal emergency rather than a radiographic finding that accumulates
              through childhood. Both reported patients had platyspondyly, lacy iliac crests and severe
              metaphyseal dysplasia in the newborn period - a spondylo- plus metaphyseal pattern that
              sits outside the classic SDS skeletal phenotype and radiographically resembles Sedaghatian-type
              spondylometaphyseal dysplasia. One patient, a Japanese girl reported at 11 years, had neonatal
              respiratory failure requiring lifelong ventilation, severe short stature and severe developmental
              delay, and developed neutropenia in infancy with decreased serum amylase in childhood; the
              other, a British boy, was stillborn with pulmonary hypoplasia and hepatic fibrosis at autopsy.
              The neutropenia and low amylase that appeared in the surviving patient are what place this
              presentation inside the SDS spectrum rather than beside it. The severity is not explained
              by a distinct allele class: both carried the ordinary recurrent gene-conversion alleles
              seen in classic SDS (183TA>CT in both, 258+2T>C in the boy), the girl''s second allele being
              a novel 79T>C missense change.'
            genes:
            - preferred_term: SBDS
              term:
                id: hgnc:19440
                label: SBDS
          role: subtype
      assertion_type: Phenotype
      assertion:
        name: Platyspondyly
        category: Skeletal
        subtype: Severe neonatal SMD
        description: Flattening of the vertebral bodies, present in the newborn period. This is the finding
          that makes the severe neonatal form spondylometaphyseal; the classic SDS skeleton is metaphyseal
          with delayed epiphyseal ossification and is not platyspondylic.
        phenotype_term:
          preferred_term: Platyspondyly
          term:
            id: HP:0000926
            label: Platyspondyly
        notes: 'Present in both patients reported with this subtype (2/2). No frequency band is asserted:
          the denominator is two patients from two unrelated families.'
      selected_evidence:
        snippet: Both cases had neonatal skeletal manifestations that included platyspondyly, lacy iliac
          crests and severe metaphysial dysplasia, and thus did not fall in the range of the known Shwachman-Diamond
          syndrome skeletal phenotype but resembled spondylometaphysial dysplasia (SMD) Sedaghatian type.
        supports: SUPPORT
