        description: 'The severest end of the SBDS phenotypic spectrum, and the only presentation in which
          the skeleton is a neonatal emergency rather than a radiographic finding that accumulates through
          childhood. Both reported patients had platyspondyly, lacy iliac crests and severe metaphyseal
          dysplasia in the newborn period - a spondylo- plus metaphyseal pattern that sits outside the
          classic SDS skeletal phenotype and radiographically resembles Sedaghatian-type spondylometaphyseal
          dysplasia. One patient, a Japanese girl reported at 11 years, had neonatal respiratory failure
          requiring lifelong ventilation, severe short stature and severe developmental delay, and developed
          neutropenia in infancy with decreased serum amylase in childhood; the other, a British boy,
          was stillborn with pulmonary hypoplasia and hepatic fibrosis at autopsy. The neutropenia and
          low amylase that appeared in the surviving patient are what place this presentation inside the
          SDS spectrum rather than beside it. The severity is not explained by a distinct allele class:
          both carried the ordinary recurrent gene-conversion alleles seen in classic SDS (183TA>CT in
          both, 258+2T>C in the boy), the girl''s second allele being a novel 79T>C missense change.'
        genes:
