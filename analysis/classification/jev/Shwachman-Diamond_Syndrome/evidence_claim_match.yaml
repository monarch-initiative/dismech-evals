      assertion_type: Pathophysiology
      assertion:
        name: EIF6-Mutant Compensatory Clonal Expansion
        biological_scale: CELLULAR
        description: 'Somatic EIF6 inactivation ameliorates the underlying ribosome defect and so enhances
          clone fitness. It carries limited leukemic potential and is deliberately given no edge to malignant
          transformation: this arm is a compensatory response, not a step toward leukemia, and an edge
          here would assert the opposite of what the source reports. EIF6 is inactivated by two distinct
          genetic routes, and both belong here: point mutation, and interstitial deletion of chromosome
          20q, which removes the EIF6 locus and is the commoner of the two. This is why del(20q) in an
          SDS marrow does not carry the ominous meaning it carries in sporadic myelodysplastic syndrome.'
      selected_evidence:
        snippet: EIF6 inactivation mediates a compensatory pathway with limited leukemic potential by
          ameliorating the underlying SDS ribosome defect and enhancing clone fitness.
        supports: SUPPORT
