        name: Failure of eIF6 Eviction from the Pre-60S Subunit
        biological_scale: MOLECULAR
        description: Release of the anti-association factor eIF6 is the last step of cytoplasmic 60S maturation
          and is catalysed by SBDS together with the GTPase EFL1. Disease variants uncouple EFL1 GTP hydrolysis
          from eIF6 release, so eIF6 remains bound and the subunit cannot join a 40S partner.
        biological_processes:
        - preferred_term: ribosomal large subunit assembly
          modifier: ABNORMAL
          term:
            id: GO:0000027
            label: ribosomal large subunit assembly
      selected_evidence:
        snippet: Here, by isolating late cytoplasmic 60S ribosomal subunits from Sbds-deleted mice, we
          show that SBDS and the GTPase elongation factor-like 1 (EFL1) directly catalyze eIF6 removal
          in mammalian cells by a mechanism that requires GTP binding and hydrolysis by EFL1 but not phosphorylation
          of eIF6 Ser 235.
        supports: SUPPORT
