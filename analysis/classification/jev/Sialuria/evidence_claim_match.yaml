      assertion:
        hypothesis_group_id: ncam_polysialylation_delay
        hypothesis_label: NCAM polysialylation as a route to developmental delay
        status: EMERGING
        description: The hypothesis that increased intracellular sialic acid drives increased NCAM polysialylation,
          which in turn contributes to the developmental delay of sialuria. Support is currently limited
          to a transgenic mouse and cell models; the transgenic-mouse authors frame it explicitly as a
          possibility ("could play a role"). No direct human evidence links NCAM polysialylation to the
          delay.
      selected_evidence:
        snippet: Our results suggest that the intracellular sialic acid concentration regulates polysialylation
          on NCAM in vivo; this could play a role in the manifestation of the developmental delays in
          sialuria patients.
        supports: SUPPORT
