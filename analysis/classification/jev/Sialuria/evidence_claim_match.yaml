      assertion_type: Pathophysiology
      assertion:
        name: Cytoplasmic Free Sialic Acid Accumulation
        biological_scale: CELLULAR
        description: The overproduced free Neu5Ac accumulates in the cytoplasm of cells, not in the lysosome.
          In patient fibroblasts about 59% of recovered free NeuAc is in the soluble cytoplasmic fraction.
          This cytoplasmic (as opposed to intralysosomal) localization is the cell-biological feature
          that distinguishes sialuria from the recessive lysosomal free sialic acid storage disorders
          (ISSD and Salla disease), which are caused by defective lysosomal egress via SLC17A5, a different
          gene and mechanism.
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        locations:
        - preferred_term: liver
          term:
            id: UBERON:0002107
            label: liver
      selected_evidence:
        snippet: only 21% of the recovered NeuAc was found in the lysosomes, and 59% of the recovered
          NeuAc was in the soluble fraction representing the cytoplasm
        supports: SUPPORT
