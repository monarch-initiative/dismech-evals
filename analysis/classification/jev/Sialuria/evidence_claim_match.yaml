      assertion_type: Pathophysiology
      assertion:
        name: GNE Allosteric-Site Missense Variant
        biological_scale: MOLECULAR
        description: A single heterozygous missense variant in GNE at the allosteric CMP-Neu5Ac binding
          (feedback) site of the UDP-GlcNAc 2-epimerase domain. Reported changes cluster at two arginine
          residues, R263 and R266 in the original NM_005476 numbering (R266W, R266Q, R263L), now designated
          Arg294 and Arg297. Crystallography of the epimerase domain places these residues at the dimer-dimer
          interface where the carboxyl group of the Neu5Ac moiety of the inhibitor is coordinated, which
          is why single substitutions at Arg263/Arg266 abolish feedback binding.
        genes:
        - preferred_term: GNE
          term:
            id: hgnc:23657
            label: GNE
        genetic_context:
          genes:
          - preferred_term: GNE
            term:
              id: hgnc:23657
              label: GNE
          allele_type: missense (allosteric CMP-Neu5Ac feedback site)
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: A heterozygous missense variant at the allosteric feedback site that leaves catalysis
            intact but abolishes CMP-Neu5Ac feedback inhibition, a gain of function acting in the heterozygous
            state.
      selected_evidence:
        snippet: Their heterozygote mutations, R266W, R266Q, and R263L, indicate that the allosteric site
          of the epimerase resides in the region of codons 263-266.
        supports: SUPPORT
