        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of CMP-Neu5Ac Feedback Inhibition of UDP-GlcNAc 2-Epimerase
        biological_scale: MOLECULAR
        description: The mutant epimerase retains normal catalytic activity but is no longer inhibitable
          by its downstream product CMP-Neu5Ac. Normal fibroblast epimerase is inhibited 79-100% by 100
          microM CMP-Neu5Ac; sialuria enzyme is inhibited only 19-27%, and in some patients not at all.
          Because feedback inhibition is the enzyme's sole regulatory brake and does not affect the ManNAc
          kinase activity, its loss leaves a constitutively active, rate-limiting enzyme even in the heterozygous
          state — the biochemical basis of the dominant inheritance.
        molecular_functions:
        - preferred_term: UDP-N-acetylglucosamine 2-epimerase activity (feedback-resistant)
          term:
            id: GO:0008761
            label: UDP-N-acetylglucosamine 2-epimerase activity
          modifier: GAIN_OF_FUNCTION
        chemical_entities:
        - preferred_term: CMP-N-acetylneuraminic acid (allosteric feedback inhibitor)
          term:
            id: CHEBI:16556
            label: CMP-N-acetyl-beta-neuraminic acid
      selected_evidence:
        snippet: Thus, even in the heterozygous state, the mutant allele produces a constitutively active,
          rate-limiting enzyme that achieves sufficient NeuAc synthesis to cause overproduction of free
          sialic acid.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
