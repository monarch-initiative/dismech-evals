              label: sick sinus syndrome 2, autosomal dominant
        context: []
      assertion_type: Phenotype
      assertion:
        name: Prolonged QT Interval
        category: Cardiovascular
        description: 'Lengthening of ventricular repolarisation on the surface electrocardiogram, reported
          in individual HCN4 carriers in two independent settings: a trafficking-defective D553N carrier
          who also had torsade de pointes, and a neonate with an in-frame HCN4 deletion whose QTc of 500
          ms normalised over the first months of life. HCN4 is not a repolarising channel, so this is
          not an expected consequence of the funny-current lesion, and whether it is a real part of the
          SSS2 phenotype or a rate-related artefact of severe bradycardia is unsettled. Both reports are
          in genotyped carriers, and the distinction matters for drug avoidance. No pathophysiology node
          in this entry produces it, so it stands outside the causal graph rather than being given a parent
          the evidence does not support.'
        phenotype_term:
          preferred_term: Prolonged QT interval
          term:
            id: HP:0001657
            label: Prolonged QT interval
        frequency: VERY_RARE
      selected_evidence:
        snippet: A missense mutation, D553N, was found in a patient with sinus node dysfunction who showed
          recurrent syncope, QT prolongation in electrocardiogram, and polymorphic ventricular tachycardia,
          torsade de pointes.
        supports: SUPPORT
