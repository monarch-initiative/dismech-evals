  b991b51dea5aa3b76c9cfb8615f280531d24fe184dcb62637eadb594c5b9c9f8:
    claim:
      about:
        disease:
          name: Sick Sinus Syndrome 2, Autosomal Dominant
          disease_term:
            preferred_term: sick sinus syndrome 2, autosomal dominant
            term:
              id: MONDO:0008102
              label: sick sinus syndrome 2, autosomal dominant
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: q_sss2_variant_causality_threshold
        prompt: What functional evidence should be required before an HCN4 variant found in a bradycardic
          patient is called causal for SSS2?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - genetic#HCN4 loss-of-function variants
        - pathophysiology#HCN4 Loss-of-Function Variant
        rationale: 'SSS2 is defined by an HCN4 variant, so the entry''s causal claim is only as good as
          the variant calls behind it. HCN4 variant discovery has outrun functional characterisation:
          most reported variants have never been patch-clamped, and at least one variant that had been
          treated as pathogenic, and linked in the literature to sudden infant death and malignant epilepsy,
          was found on characterisation to be indistinguishable from wild type in voltage dependence,
          kinetics, cAMP-gating and surface expression, and not to segregate with disease in the proband''s
          own family. The alleles curated in this entry all carry electrophysiological or segregation
          evidence, which is the standard this discussion argues for, but the boundary is not settled
          and the field has no agreed threshold. Practically, this bears on cascade screening: a carrier
          identified on a panel without functional or segregation support has not been shown to have SSS2.'
      selected_evidence:
        snippet: However, detailed electrophysiological and cell biological characterization of HCN4 V759I
          in Xenopus laevis oocytes and embryonic rat cardiomyocytes, respectively, did not reveal any
          obvious abnormality.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33095298
      reference_title: Disease-associated HCN4 V759I variant is not sufficient to impair cardiac pacemaking.
