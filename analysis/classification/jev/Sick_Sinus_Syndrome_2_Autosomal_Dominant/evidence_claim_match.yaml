          value:
            name: HCN4 loss-of-function variants
            association: Causative
            relationship_type: CAUSATIVE
            gene_term:
              preferred_term: HCN4
              term:
                id: hgnc:16882
                label: HCN4
            features: 'Heterozygous loss-of-function variants in HCN4 are the sole established cause of
              SSS2. Reported alleles include pore-domain missense changes (G480R, G482R), C-linker and
              cyclic-nucleotide-binding-domain changes (K530N, S672R, D553N), C-terminal truncations (573X,
              695X), and canonical splice-donor changes (c.1737+1 G>T). Loss of function is achieved by
              a hyperpolarizing shift in the voltage dependence of activation, by reduced channel synthesis
              and defective trafficking, or by loss of cAMP responsiveness; most alleles additionally
              suppress wild-type subunits within the heterotetramer. P883R is the one curated allele that
              does not follow this pattern: it shifts activation in the opposite direction and raises
              current density, and whether it causes SSS2 at all is disputed, so it is not counted among
              the established causes above.'
          role: ancestor
      assertion_type: GeneCaseFraction
      assertion:
        population: Mutation-positive familial sick sinus syndrome probands
        case_fraction_percent: 33.3
        cohort_size: 48
        notes: 'HCN4 accounted for 16 of the 48 gene-positive familial sick sinus syndrome probands pooled
          in this meta-analysis, with SCN5A accounting for the other 32. Study design: meta-analysis pooling
          the authors'' own cohort with previously reported probands. The denominator differs from the
          5.3% record above and the two are not alternative estimates of the same quantity: that record
          counts HCN4 among all screened familial SSS families, whether or not a causal variant was found,
          while this one counts HCN4 only among families in which one was.'
      selected_evidence:
        snippet: We also evaluated the clinical features of familial SSS by a meta-analysis of 48 SSS
          probands with mutations in HCN4 (n = 16) and SCN5A (n = 32), including previously reported cases,
          and 538 sporadic SSS cases.
        supports: SUPPORT
