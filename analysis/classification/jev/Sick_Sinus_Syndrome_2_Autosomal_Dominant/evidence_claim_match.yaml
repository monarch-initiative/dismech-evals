      assertion_type: DifferentialDiagnosis
      assertion:
        name: Familial Sick Sinus Syndrome
        description: The dismech umbrella entry for inherited sinoatrial node dysfunction, which spans
          several causal genes (HCN4, SCN5A, ANK2, LMNA) and both dominant and recessive transmission.
          SSS2 is the HCN4-specific, autosomal dominant member of that set and is curated separately because
          MONDO models it as a distinct disease-series-by-gene entity with its own OMIM record.
        disease_term:
          preferred_term: familial sick sinus syndrome
          term:
            id: MONDO:0012061
            label: familial sick sinus syndrome
        distinguishing_features:
        - The umbrella entry is gene-heterogeneous and also spans the autosomal recessive SCN5A form,
          LMNA and ANK2.
        - SSS2 is defined by a heterozygous HCN4 loss-of-function variant acting on the funny current.
        - Left ventricular noncompaction is a characteristic co-segregating feature of the HCN4 form specifically.
      selected_evidence:
        snippet: Familial sick sinus syndrome (SSS) is often attributable to mutations in genes encoding
          the cardiac Na channel SCN5A and pacemaker channel HCN4.
        supports: SUPPORT
