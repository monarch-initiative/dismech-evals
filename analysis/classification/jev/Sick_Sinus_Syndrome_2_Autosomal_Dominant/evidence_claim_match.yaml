        context: []
      assertion_type: Treatment
      assertion:
        name: Stroke Prevention in Atrial Fibrillation
        description: 'Atrial fibrillation occurs in roughly 44% of HCN4 carriers, so thromboembolic prophylaxis
          is part of routine management once it is documented, prescribed on the same risk-score basis
          as in any other atrial fibrillation rather than on the genotype. What is genuinely unsettled
          is the carrier without documented atrial fibrillation: sinus node dysfunction carries an independently
          raised ischaemic stroke risk even in its absence, and the yearly stroke incidence in sinus node
          dysfunction with and without atrial fibrillation is indistinguishable, which has been read as
          evidence of an underlying atrial myopathy rather than of arrhythmia-driven stasis. No trial
          has tested anticoagulation in that group, and none of this evidence is HCN4-genotyped.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: anticoagulation therapy
          term:
            id: NCIT:C63341
            label: Anticoagulation Therapy
      selected_evidence:
        snippet: 'The average yearly stroke incidence in patients with SND was 1.542% (95% CI: 1.334%
          to 1.749%). The stroke incidence was similar between the isolated SND (1.587%; 95% CI: 1.510%
          to 1.664%) and non-isolated (SND+AF) (1.660%; 95% CI: 0.705% to 2.615%) groups.'
        supports: SUPPORT
        directness: INDIRECT
