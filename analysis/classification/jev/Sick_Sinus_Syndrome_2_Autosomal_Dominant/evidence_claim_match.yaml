        - preferred_term: SA node cell action potential
          term:
            id: GO:0086015
            label: SA node cell action potential
          modifier: DECREASED
        locations:
        - preferred_term: sinoatrial node
          term:
            id: UBERON:0002351
            label: sinoatrial node
      selected_evidence:
        snippet: The cardiac pacemaker current I(f) is a major determinant of diastolic depolarization
          in sinus nodal cells and has a key role in heartbeat generation.
        supports: SUPPORT
