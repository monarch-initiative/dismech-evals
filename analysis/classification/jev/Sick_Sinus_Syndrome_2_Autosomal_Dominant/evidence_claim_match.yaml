      assertion:
        name: Reduced Funny Current and Slowed Diastolic Depolarization
        role: central_effector
        biological_scale: CELLULAR
        description: The funny current I_f is the hyperpolarization-activated inward cation current that
          drives the early phase of spontaneous diastolic depolarization in sinoatrial node pacemaker
          cells. Mutant HCN4 channels activate at more negative voltages than wild-type channels, so at
          the diastolic potentials actually reached by a pacemaker cell less inward current flows. The
          diastolic depolarization slope falls, the interval to threshold lengthens, and the intrinsic
          firing rate of the node drops. The biophysical change has been described as mimicking mild vagal
          stimulation — a permanent, genetically imposed version of a physiological brake.
        cell_types:
        - preferred_term: cardiac pacemaker cell of sinoatrial node
          term:
            id: CL:1000477
