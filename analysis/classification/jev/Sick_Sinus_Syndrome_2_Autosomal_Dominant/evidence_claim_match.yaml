      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        description: SSS2 segregates as an autosomal dominant trait. All reported disease variants are
          heterozygous, and the dominant mechanism is usually dominant-negative suppression of wild-type
          HCN4 subunits within the heterotetrameric channel rather than simple haploinsufficiency. Penetrance
          and expressivity vary widely, from asymptomatic sinus bradycardia detected only on screening
          to syncope requiring pacemaker implantation.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
