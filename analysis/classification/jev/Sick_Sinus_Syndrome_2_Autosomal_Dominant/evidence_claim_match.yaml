  1d22bc98e9001485ee70395516b778a56bd0da44eeba4e4fa9d59823959759fa:
    claim:
      about:
        disease:
          name: Sick Sinus Syndrome 2, Autosomal Dominant
          disease_term:
            preferred_term: sick sinus syndrome 2, autosomal dominant
            term:
              id: MONDO:0008102
              label: sick sinus syndrome 2, autosomal dominant
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Patient-derived hiPSC lines carrying a heterozygous and a homozygous HCN4 variant (UKMi009-A,
          UKMi011-A)
        description: Two human induced pluripotent stem cell lines reprogrammed from members of a consanguineous
          family with sinus node dysfunction, one carrying the familial HCN4 variant heterozygously and
          the other homozygously. The pair is a gene-dose series in the patients' own genetic background
          and at the native locus, which is the closest available human substrate for the SSS2 lesion.
          As published, the lines are characterised only for pluripotency (karyotype, marker expression,
          three-germ-layer differentiation); no cardiomyocyte electrophysiology is reported, so nothing
          yet establishes that they reproduce the funny-current deficit.
        experimental_model_type: IPSC_DERIVED_MODEL
        cell_source: Reprogrammed somatic cells from two members of a consanguineous family with inherited
          sinus node dysfunction.
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        publication: PMID:40414080
        modeled_mechanisms:
        - target: HCN4 Loss-of-Function Variant
          relationship: PERTURBS
          fidelity: UNKNOWN
          description: The lines carry the family's own HCN4 variant at the endogenous locus in one and
            two copies, instantiating the genetic lesion of this node as a dose series rather than as
            an overexpressed construct.
          limitations: 'The family is consanguineous and the report does not say which members are affected,
            so it is not established that the heterozygous carrier has the disease; in a consanguineous
            pedigree segregating a homozygous allele the heterozygote may well be an unaffected carrier.
            Neither line is therefore known to instantiate the dominant heterozygous genotype of SSS2,
            and the homozygous state has no counterpart in it at all. The report also does not characterise
            the variant as loss-of-function: the link to this node rests on the gene, not on a demonstrated
            functional consequence. The publication reports pluripotency characterisation alone, with
            no cardiomyocyte differentiation, no I_f recording and no beating rate, so the functional
            fidelity of the model is untested rather than moderate or high.'
      selected_evidence:
        snippet: Generated hiPSCs enable further cardiomyocyte cell differentiation to provide unique
          patient-derived SND in-vitro disease models in a gene-dose dependent manner.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
      evidence_path: /experimental_models/0/evidence/0
      context_paths:
