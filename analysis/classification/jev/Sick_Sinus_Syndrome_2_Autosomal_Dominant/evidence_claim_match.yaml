          term:
            id: hgnc:16882
            label: HCN4
        features: 'Heterozygous loss-of-function variants in HCN4 are the sole established cause of SSS2.
          Reported alleles include pore-domain missense changes (G480R, G482R), C-linker and cyclic-nucleotide-binding-domain
          changes (K530N, S672R, D553N), C-terminal truncations (573X, 695X), and canonical splice-donor
