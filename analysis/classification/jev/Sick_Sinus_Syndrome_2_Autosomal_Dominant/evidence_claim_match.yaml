    evidence_metadata:
      reference: PMID:19570998
      reference_title: Control of heart rate by cAMP sensitivity of HCN channels.
      evidence_source: MODEL_ORGANISM
      explanation: A mouse model of the human 573X allele shows cAMP sensitivity of I_f sets basal and
        maximal rate. The same study finds that relative exercise rate adaptation is preserved, so the
        chronotropic claim rests on the loss of maximal rate rather than on a loss of rate adaptation
        itself.
