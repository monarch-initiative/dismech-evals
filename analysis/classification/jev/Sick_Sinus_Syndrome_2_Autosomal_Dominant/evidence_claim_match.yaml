      assertion_type: AnimalModel
      assertion:
        name: hHCN4-573X inducible cardiac transgenic mouse
        species: Mouse
        genotype: heart-specific, inducible expression of the human HCN4-573X allele
        description: Mice engineered for heart-specific, inducible expression of the human truncating
          HCN4-573X allele found in the index SSS2 patient. The model isolates the cAMP-insensitivity
          arm of the human mechanism.
        publication: PMID:19570998
        modeled_mechanisms:
        - target: Loss of cAMP-Dependent Rate Modulation
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Expression of the human disease allele eliminates cAMP sensitivity of I_f in sinoatrial
            node cells and lowers resting and maximal heart rate, the mechanism proposed for the human
            carrier.
          limitations: The transgene is expressed heart-wide and inducibly rather than as a germline heterozygous
            allele, and murine sinoatrial physiology operates at a resting rate roughly an order of magnitude
            faster than human. The model also shows that relative rate adaptation during exercise is preserved,
            so it does not reproduce chronotropic incompetence as completely as the human case report
            implies.
          readouts:
          - name: cAMP sensitivity of I_f in sinoatrial node pacemaker cells
            target: Loss of cAMP-Dependent Rate Modulation
            direction: ABOLISHED
            interpretation: Direct molecular readout of the proposed human mechanism.
          - name: Heart rate in conscious mice at rest and during exercise
            target: Loss of cAMP-Dependent Rate Modulation
            direction: DECREASED
            interpretation: Whole-animal correlate of the human resting bradycardia and blunted maximal
              rate.
      selected_evidence:
        snippet: we generated mice with heart-specific and inducible expression of a human HCN4 mutation
          (573X) that abolishes the cAMP-dependent regulation of HCN channels
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
