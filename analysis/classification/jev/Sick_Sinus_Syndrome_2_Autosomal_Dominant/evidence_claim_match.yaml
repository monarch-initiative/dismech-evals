        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of cAMP-Dependent Rate Modulation
        role: effector
        biological_scale: MOLECULAR
        description: Beta-adrenergic stimulation raises intracellular cAMP, which binds the cyclic-nucleotide-binding
          domain of HCN4 and shifts activation to more positive voltages, accelerating diastolic depolarization;
          vagal tone does the reverse. Truncating HCN4 alleles such as 573X delete this domain entirely,
          so the residual current is insensitive to cAMP. This is the proposed mechanistic basis of chronotropic
          incompetence in SSS2 — a failure of rate adaptation that is separable from the resting bradycardia.
          The corresponding mouse model shows that cAMP sensitivity of I_f sets basal and maximal heart
          rate while relative rate regulation during exercise is partially preserved by other mechanisms.
        cell_types:
        - preferred_term: cardiac pacemaker cell of sinoatrial node
          term:
            id: CL:1000477
            label: cardiac pacemaker cell of sinoatrial node
        biological_processes:
        - preferred_term: regulation of heart rate
          term:
            id: GO:0002027
            label: regulation of heart rate
          modifier: DECREASED
        - preferred_term: regulation of SA node cell action potential
          term:
            id: GO:0098907
            label: regulation of SA node cell action potential
          modifier: DECREASED
      selected_evidence:
        snippet: Our data demonstrate that cAMP-mediated regulation of I(f) determines basal and maximal
          heart rates but does not play an indispensable role in heart rate adaptation during physical
          activity.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/2
