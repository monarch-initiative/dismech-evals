        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Aortic dilatation, onset not reliably age-ordered
        age_range: Adolescence through adulthood; onset not reliably age-ordered
        notes: Ascending aortic and aortic root dilatation has been described as age-dependent in penetrance
          across HCN4 families, but it has also been found in a 15-year-old and a 13-year-old carrier
          while absent in their 50-year-old mother, so it is not reliably ordered by age within a family.
          The practical consequence is that imaging surveillance cannot be deferred in a young carrier
          on the strength of the age-dependence claim.
      selected_evidence:
        snippet: 20 of 26 patients (77%) and 6/9 (66.6%) patients with the p.Gly482Arg variant had aortic
          dilatation
        supports: SUPPORT
        directness: INDIRECT
