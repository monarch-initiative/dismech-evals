            term:
              id: MONDO:0008102
              label: sick sinus syndrome 2, autosomal dominant
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Asymptomatic childhood and adolescent bradycardia
        age_range: Childhood through adolescence
        notes: 'Carriers ascertained through family screening or through an incidental finding are often
          asymptomatic in this window, with resting bradycardia and noncompaction already present on imaging
          and no indication for a device. Being asymptomatic is not the same as being low risk: in the
          same family the adolescent proband was asymptomatic yet had 66 sinus pauses of three seconds
          or longer, the longest 10.5 seconds, and received a primary-prevention device. This is the phase
          in which cascade screening is most useful, since the structural findings are established well
          before symptoms.'
      selected_evidence:
        snippet: His ambulatory electrocardiographic (ECG) monitoring revealed 66 significant asymptomatic
          sinus pauses (≥3 seconds, the longest lasting 10.5 seconds), mainly nocturnal
        supports: SUPPORT
    origin:
      assertion_path: /progression/1
      evidence_path: /progression/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35257104
      reference_title: 'Noncompaction Cardiomyopathy, Sick Sinus Disease, and Aortic Dilatation: Too Much
        for a Single Diagnosis?'
      evidence_source: HUMAN_CLINICAL
      explanation: Her 15-year-old brother, in the same family and the same age window, was equally asymptomatic
        yet carried a heavy pause burden and was implanted, which is why this phase is described as often
        rather than uniformly device-free.
