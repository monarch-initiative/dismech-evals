          notes: 'HCN4 accounted for 16 of the 48 gene-positive familial sick sinus syndrome probands
            pooled in this meta-analysis, with SCN5A accounting for the other 32. Study design: meta-analysis
            pooling the authors'' own cohort with previously reported probands. The denominator differs
            from the 5.3% record above and the two are not alternative estimates of the same quantity:
