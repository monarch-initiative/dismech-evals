        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Prenatal and neonatal sinus bradycardia
        age_range: Second trimester through the neonatal period
        notes: The earliest detectable manifestation is a fetal heart rate below the gestational-age norm,
          which can be accompanied in utero by prominent left ventricular trabeculation. Neither the bradycardia
          nor the noncompaction is necessarily symptomatic at this stage, and de novo variants occur,
          so an unremarkable family history does not exclude SSS2 in a bradycardic fetus.
      selected_evidence:
        snippet: Fetal echocardiography revealed a normal fetal heart except for slightly prominent trabeculae
          in the left ventricle, normal cardiac function, and fetal sinus bradycardia with a heart rate
          of 100 bpm.
        supports: SUPPORT
    origin:
