    evidence_metadata:
      reference: PMID:39698436
      reference_title: Fetal bradycardia associated with left ventricle noncompaction diagnosed as HCN4
        mutations.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents both arms of the SSS2 phenotype, bradycardia and trabecular noncompaction,
        at the fetal stage in a carrier later shown to have a heterozygous HCN4 in-frame deletion.
