            childhood noncompaction rather than how often SSS2 does.'
        - population: Adults with isolated left ventricular noncompaction
          cohort_size: 95
          notes: 'No percentage is recorded because the source ranks genes without giving a per-patient
            count for HCN4: it reports 52 pathogenic or probably pathogenic variants in 40 of 95 patients
            and then ranks the genes, without stating which denominator the ranking uses. Study design:
            prospective cohort of 95 unrelated adults screened across 107 cardiomyopathy and arrhythmia
            genes. The ordinal result is still informative, and it is recorded because it replicates the
            paediatric finding in adults: HCN4 ranked second only to TTN among the causal genes of adult
            isolated noncompaction.'
        variants:
        - name: HCN4 p.Ser672Arg
          description: Missense change near the cyclic-nucleotide-binding site, identified in a large
            familial sinus bradycardia pedigree. Mutant channels retain a normal response to cAMP but
            activate at more negative voltages than wild-type, reducing the inward diastolic current.
          functional_effects:
          - function: hyperpolarizing shift of activation voltage
            description: Activation is displaced to more negative potentials while cAMP responsiveness
              is retained, so less current flows during diastole at any given membrane potential.
            type: loss-of-function
          gene:
            preferred_term: HCN4
            term:
              id: hgnc:16882
              label: HCN4
        - name: HCN4 573X (c.1631delC)
          description: Heterozygous single-base deletion in exon 5 producing a C-terminally truncated
            subunit that lacks the cyclic-nucleotide-binding domain. Trafficking is normal, but the resulting
            current is cAMP-insensitive and the subunit exerts a dominant-negative effect on wild-type
            channels.
          functional_effects:
          - function: loss of cAMP-dependent gating
            description: Truncation removes the cyclic-nucleotide-binding domain, so the channel still
              reaches the membrane and conducts but no longer responds to cAMP. The subunit also suppresses
              wild-type current in co-expression.
            type: dominant-negative
          - function: loss of cAMP-dependent acceleration of the pacemaker current
            description: 'The direction of effect, recorded alongside the dominant-negative mechanism
              above: the net result is less cAMP-responsive I_f than a wild-type heterotetramer would
              carry.'
            type: loss-of-function
          gene:
            preferred_term: HCN4
            term:
              id: hgnc:16882
              label: HCN4
        - name: HCN4 695X
          description: C-terminal truncating allele reported in a family with the combined sinus node
            dysfunction and noncompaction phenotype, in the same series that described G482R and P883R.
            It is grouped with 573X as a truncation, but unlike 573X it has not been characterised electrophysiologically
            in the cited work, so its consequence is inferred from the variant class and the family phenotype
            rather than measured.
          gene:
            preferred_term: HCN4
            term:
              id: hgnc:16882
              label: HCN4
          functional_effects:
          - function: reduced pacemaker current
            description: 'Inferred from the C-terminal truncating class and from the segregating phenotype,
              not from a functional assay: no patch-clamp characterisation of this allele is presented
              in the cited report.'
            type: loss-of-function
        - name: HCN4 p.Gly480Arg
          description: Pore-domain missense change segregating with autosomal dominant isolated sinus
            node dysfunction in a 16-member family. Reduces channel synthesis and membrane trafficking
            and shifts activation to more negative voltages, yet carries a benign long-term course.
          functional_effects:
          - function: reduced channel synthesis and membrane trafficking
            description: Less channel protein is made and reaches the surface, and what does activate
              does so at more negative potentials.
            type: loss-of-function
          gene:
            preferred_term: HCN4
            term:
              id: hgnc:16882
              label: HCN4
        - name: HCN4 p.Gly482Arg
          description: Pore-domain missense change segregating with the combined sinus node dysfunction
            and biventricular noncompaction phenotype. Mutant subunits are nonfunctional and dominant-negative
            on wild-type current.
          functional_effects:
          - function: nonfunctional pore with suppression of wild-type current
            description: Homomeric mutant channels carry no current, and the subunit suppresses wild-type
              current when the two are co-expressed.
            type: dominant-negative
          - function: reduced pacemaker current
            description: 'The direction of effect, recorded alongside the dominant-negative mechanism
              above: nonfunctional subunits assembling into the heterotetramer leave less current than
              a wild-type channel carries.'
            type: loss-of-function
          gene:
            preferred_term: HCN4
            term:
              id: hgnc:16882
              label: HCN4
        - name: HCN4 p.Lys530Asn
          description: C-linker missense change identified by screening 422 patients with tachyarrhythmias.
            Homomeric mutant channels behave almost like wild-type; the loss of function appears only
            in heteromeric mutant/wild-type channels, which show a hyperpolarizing shift of half-maximal
            activation — the biophysical situation of a heterozygous carrier.
          functional_effects:
          - function: heteromer-restricted hyperpolarizing shift of activation
            description: Homomeric mutant channels are close to wild-type; the shift in half-maximal activation
              appears only in mutant/wild-type heteromers, which is the configuration a heterozygous carrier
              actually has.
            type: loss-of-function
          gene:
            preferred_term: HCN4
            term:
              id: hgnc:16882
              label: HCN4
        - name: HCN4 p.Asp553Asn
          description: Missense change in the C-linker region that reduces the amount of channel reaching
            the membrane. It is the worked example of the trafficking class of HCN4 allele, and it acts
            dominant-negatively on the wild-type subunit rather than by simple loss of one copy. The index
            carrier had recurrent syncope with a prolonged QT interval and torsade de pointes as well
            as sinus node dysfunction, so this allele's reported phenotype reaches repolarisation and
            ventricular arrhythmia as well as impulse generation.
          functional_effects:
          - function: trafficking defect reducing surface channel
            description: Less channel reaches the membrane, lowering I_f, and the mutant subunit acts
              dominant-negatively rather than by simple loss of one copy.
            type: dominant-negative
          - function: reduced surface pacemaker current
            description: 'The direction of effect, recorded alongside the dominant-negative mechanism
              above: less channel at the membrane means less I_f.'
            type: loss-of-function
          gene:
            preferred_term: HCN4
            term:
              id: hgnc:16882
              label: HCN4
        - name: HCN4 p.Pro883Arg
          description: C-terminal missense change that does not fit the loss-of-function pattern the rest
            of these alleles follow. It segregated with the combined sinus node dysfunction and noncompaction
            phenotype in one proband, but when characterised functionally it shifted activation to more
            depolarised potentials and, co-expressed with wild-type subunits as in a heterozygote, produced
            higher rather than lower current density. It is also common enough (minor allele frequency
            around 0.9%) that it cannot be a fully penetrant cause on its own. The authors of the functional
            study read it as a modifier acting with a common KCNE1 variant to favour atrial fibrillation
            and tachycardia-induced cardiomyopathy, rather than as an SSS2 allele. Both readings stand
            in the literature and neither has been withdrawn.
          clinical_significance: UNCERTAIN_SIGNIFICANCE
          functional_effects:
          - function: depolarizing shift of activation with increased current density
            description: The opposite direction from every other allele in this entry. Activation moves
              to more depolarised potentials and deactivation is faster; in the heterozygous configuration,
              co-expressed with wild type, current density is higher than wild type rather than lower.
              This is why the statement that every reported HCN4 disease allele is loss-of-function does
              not hold for this one.
            type: gain-of-function
          gene:
            preferred_term: HCN4
            term:
              id: hgnc:16882
              label: HCN4
        - name: HCN4 c.1737+1 G>T (splice site)
          description: 'Canonical splice-donor variant segregating in a large bradycardia family with
            a two-point LOD score of 4.87. Its interest is that the family was characterised by Holter
            and exercise testing rather than by patch clamp, so it supplies the quantitative human chronotropic
            phenotype: carriers reach lower peak heart rates, have a reduced heart rate reserve, and show
            increased short-term heart rate variability even after normalisation for rate.'
          functional_effects:
          - function: reduced pacemaker current
            description: 'Inferred from the canonical +1 splice-donor class and from the family''s bradycardia
              phenotype rather than measured: this allele was characterised clinically, not by patch clamp.'
            type: loss-of-function
          gene:
            preferred_term: HCN4
            term:
              id: hgnc:16882
              label: HCN4
      selected_evidence:
        snippet: Thus, diminished function of pacemaker channels is linked to familial bradycardia.
        supports: SUPPORT
