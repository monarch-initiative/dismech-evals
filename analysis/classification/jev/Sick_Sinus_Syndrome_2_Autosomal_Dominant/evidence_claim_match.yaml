  82f85e10cced2ccc3ef0fc482ea9f7f9307a25f9bfce452a48ff405b2a48d283:
    claim:
      about:
        disease:
          name: Sick Sinus Syndrome 2, Autosomal Dominant
          disease_term:
            preferred_term: sick sinus syndrome 2, autosomal dominant
            term:
              id: MONDO:0008102
              label: sick sinus syndrome 2, autosomal dominant
        context: []
      assertion_type: ComputationalModel
      assertion:
        name: Fabbri-Severi human sinoatrial node cell model with HCN4 mutation-induced I_f changes
        model_type: PHYSIOLOGICAL
        description: 'A published in-silico risk-stratification study of SSS2. In-vitro biophysical data
          for HCN4 loss-of-function alleles were used to compute the charge carried by I_f during diastolic
          depolarization of a prerecorded human sinoatrial node action potential, and that quantity was
          used to drive the Fabbri-Severi model of a human sinoatrial node pacemaker cell. It is the computational
          counterpart of the funny-current node in this entry: it makes the qualitative claim (less diastolic
          I_f, slower firing) quantitative and allele-specific.'
        publication: PMID:37760888
        modeled_mechanisms:
        - target: Reduced Funny Current and Slowed Diastolic Depolarization
          relationship: MEASURES
          fidelity: MODERATE
          description: The simulated beating rate of the human sinoatrial node cell model tracks the computed
            diastolic I_f charge very closely, and the same quantity correlates strongly with the resting
            and minimum heart rates observed in carriers of the corresponding HCN4 mutations.
          limitations: The correlation with clinical heart rate is strong but not deterministic, the analysis
            is restricted to the subset of HCN4 alleles with both quantitative clinical and in-vitro data,
            and the authors state that a translational perspective remains to be established.
        findings:
        - statement: The diastolic funny-current charge computed by action-potential clamp predicts both
            the simulated pacemaker rate of a human sinoatrial node cell model and the resting or minimum
            heart rate of HCN4 mutation carriers, making it a candidate risk-stratification measure for
            HCN4 loss-of-function sinus bradycardia.
      selected_evidence:
        snippet: HCN4 is the gene responsible for the hyperpolarization-activated 'funny' current If,
          which is an important modulator of the spontaneous diastolic depolarization underlying the sinus
          node pacemaker activity.
        supports: SUPPORT
    origin:
