        discussion_id: q_sss2_chronotropic_incompetence_model_mismatch
        prompt: Does the mouse carrying the human cAMP-insensitive HCN4-573X allele reproduce human chronotropic
          incompetence, given that its relative rate adaptation to exercise is preserved?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of cAMP-Dependent Rate Modulation
        - phenotypes#Chronotropic Incompetence
        rationale: 'The hHCN4-573X mouse carries the human disease allele and loses cAMP sensitivity of
          I_f completely, yet the relative extent of its heart rate regulation during physical activity
          is preserved: basal and maximal rates fall, but the animal still scales its rate with demand.
          The human index patient was described with chronotropic incompetence. Both can be true if human
          chronotropic incompetence is a consequence of the depressed maximal rate rather than of a lost
          ability to modulate, and this entry''s pathophysiology is written that way. The mismatch is
          nonetheless real and unresolved: it is not established that cAMP insensitivity is what produces
          the clinical exercise limitation, and the mouse is the only experiment that separates the two.
          Deciding it needs formal chronotropic-index testing in genotyped carriers of cyclic-nucleotide-binding-domain
          truncations, compared against carriers of pore and trafficking alleles that retain cAMP sensitivity.'
      selected_evidence:
        snippet: Despite the complete loss of cAMP sensitivity of I(f), the relative extent of SAN cell
          frequency and heart rate regulation are preserved.
        supports: SUPPORT
