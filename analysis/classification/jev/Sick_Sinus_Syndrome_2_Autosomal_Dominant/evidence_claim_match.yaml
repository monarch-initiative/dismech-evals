          domain of HCN4 and shifts activation to more positive voltages, accelerating diastolic depolarization;
          vagal tone does the reverse. Truncating HCN4 alleles such as 573X delete this domain entirely,
          so the residual current is insensitive to cAMP. This is the proposed mechanistic basis of chronotropic
          incompetence in SSS2 — a failure of rate adaptation that is separable from the resting bradycardia.
          The corresponding mouse model shows that cAMP sensitivity of I_f sets basal and maximal heart
          rate while relative rate regulation during exercise is partially preserved by other mechanisms.
