  00d2a95721c2a1af95ec7b5284b634584fc36c262830c54e216e77558bbe8a35:
    claim:
      about:
        disease:
          name: Sick Sinus Syndrome 2, Autosomal Dominant
          disease_term:
            preferred_term: sick sinus syndrome 2, autosomal dominant
            term:
              id: MONDO:0008102
              label: sick sinus syndrome 2, autosomal dominant
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: q_sss2_noncompaction_developmental_or_rate_driven
        prompt: Is the ventricular noncompaction of SSS2 a developmental consequence of HCN4 loss in the
          early myocardium, or a secondary remodelling response to lifelong bradycardia?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Ventricular Trabecular Compaction
        - phenotypes#Left Ventricular Noncompaction
        rationale: 'Both readings fit the human data. The developmental reading is supported by HCN4 expression
          in early cardiac progenitors, by noncompaction being present already in fetal and adolescent
          carriers, and by Hcn4 sitting downstream of a transcriptional cascade rather than being an isolated
          channel gene: in mouse, loss of Shox2 abolishes Tbx3 and Hcn4 expression and leaves a hypoplastic
          sinoatrial node. That cascade is characterised for the sinoatrial node and not for ventricular
          trabeculation, so it shows that HCN4 has a developmental context without showing that it has
          one in the compacting ventricle. The haemodynamic reading is supported by the observation that
          HCN4 carriers with noncompaction have preserved ejection fraction and mild ventricular dilatation,
          a picture that could equally reflect volume loading at a low heart rate. One experiment on the
          same gene bears on the haemodynamic reading, though only on part of it: a knock-in mouse with
          a gain-of-function HCN4 allele runs chronically faster and develops no structural cardiomyopathy
          over twelve months. That speaks to adult remodelling under a sustained rate change, in the opposite
          direction from the bradycardia at issue and in a species whose baseline rate is an order of
          magnitude higher; it says nothing about whether lifelong bradycardia perturbs trabecular compaction
          during development, which is the reading actually in dispute. Settling that needs a loss-of-function
          HCN4 model examined for trabecular architecture, and a comparison of noncompaction burden between
          paced and unpaced carriers.'
      selected_evidence:
        snippet: Histological analysis did not reveal structural changes consistent with tachycardia-induced
          cardiomyopathy. Cardiac morphology, fibrosis, and contractility were indistinguishable between
          genotypes up to 12 months of age.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42358349
      reference_title: HCN4 gain-of-function mutation increases intrinsic heart rate and limits maladaptive
        remodeling under pressure overload.
      evidence_source: MODEL_ORGANISM
      explanation: A sustained HCN4-driven change in heart rate produced no structural cardiomyopathy
        in the adult mouse heart. It bears on the adult-remodelling reading only, and in the opposite
        direction from the bradycardia at issue, so it constrains the question rather than answering it.
