              label: sick sinus syndrome 2, autosomal dominant
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: q_sss2_aortic_wall_mechanism
        prompt: By what route does a loss-of-function variant in the sinoatrial pacemaker channel produce
          dilatation of the ascending aorta?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Dilatation of the Ascending Aorta
        - pathophysiology#Impaired Ventricular Trabecular Compaction
        rationale: 'Aortic root and ascending aortic dilatation has now been reported in several independent
          HCN4 families and in a majority of carriers in the largest series, so the association is replicated.
          What is missing is any mechanism. HCN4 has no described role in the aortic wall, no HCN4 animal
          model has been reported with an aortic phenotype, and neither of the two candidate routes has
          been tested: a direct requirement for HCN4 in neural-crest-derived or second-heart-field-derived
          outflow tract mesenchyme, or a haemodynamic consequence of lifelong bradycardia acting on the
          wall through increased stroke volume. The distinction is not academic, because it decides whether
          pacing a carrier would be expected to slow the aortic course. Until it is resolved, imaging
          surveillance in carriers rests on the observed association alone.'
      selected_evidence:
        snippet: Earliest expression of HCN4 has been reported to be a potential marker for the first
          heart field.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35257104
      reference_title: 'Noncompaction Cardiomyopathy, Sick Sinus Disease, and Aortic Dilatation: Too Much
        for a Single Diagnosis?'
      evidence_source: HUMAN_CLINICAL
      explanation: 'The one developmental fact that makes a direct route plausible: HCN4 marks an early
        cardiac progenitor population, so a developmental role in outflow structures is not excluded.
        It is a marker claim rather than a functional one, which is exactly the gap.'
