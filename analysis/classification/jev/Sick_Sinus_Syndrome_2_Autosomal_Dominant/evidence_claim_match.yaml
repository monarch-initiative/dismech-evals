          description: Heterozygous single-base deletion in exon 5 producing a C-terminally truncated
            subunit that lacks the cyclic-nucleotide-binding domain. Trafficking is normal, but the resulting
            current is cAMP-insensitive and the subunit exerts a dominant-negative effect on wild-type
            channels.
