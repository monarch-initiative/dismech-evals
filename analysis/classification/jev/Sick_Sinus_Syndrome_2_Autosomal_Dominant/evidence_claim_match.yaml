              label: sick sinus syndrome 2, autosomal dominant
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: q_sss2_anticoagulation_without_documented_af
        prompt: Should an HCN4 carrier with sinus node dysfunction but no documented atrial fibrillation
          receive anticoagulation?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Stroke Prevention in Atrial Fibrillation
        - phenotypes#Atrial Fibrillation
        rationale: 'Two independent lines of evidence say sinus node dysfunction raises ischaemic stroke
          risk whether or not atrial fibrillation has been documented, which has been read as an atrial
          myopathy underlying both. If that is right, the risk-score logic that gates anticoagulation
          on a documented arrhythmia is the wrong gate. Nothing resolves this for SSS2 in particular:
          no cohort in either source was genotyped, no trial has tested anticoagulation in sinus node
          dysfunction without atrial fibrillation, and HCN4 carriers are a young population in whom the
          bleeding side of the trade-off runs for decades. The practical question is whether prolonged
          rhythm monitoring in carriers, which they often already have through an implanted device or
          loop recorder, converts the question into an ordinary documented-atrial-fibrillation decision
          often enough to make the untested group small.'
      selected_evidence:
        snippet: SND is an independent risk marker for the development of IS in individuals without AF.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40315941
      reference_title: 'Risk of ischemic stroke in sinus node dysfunction with and without atrial fibrillation:
        Evidence for the presence of a left atrial myopathy in patients with isolated sinus node dysfunction-an
        analysis of the UK Biobank.'
      evidence_source: HUMAN_CLINICAL
      explanation: States the finding the gap turns on, that the excess stroke risk does not require documented
        atrial fibrillation. The cohort is unselected sinus node dysfunction rather than HCN4 carriers.
