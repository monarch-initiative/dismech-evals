            term:
              id: MONDO:0008102
              label: sick sinus syndrome 2, autosomal dominant
        context: []
      assertion_type: Prevalence
      assertion:
        population: First-degree relatives of individuals with pacemaker-treated sinus node dysfunction,
          Denmark
        measure_type: LIFETIME_PREVALENCE
        prevalence_class: ABOVE_1_IN_1000
        rate_per_100000: 790.0
        notes: 'Cumulative incidence of pacemaker-treated sinus node dysfunction by age 68 was 0.79% in
          first-degree relatives against 0.27% in the general population, a rate ratio of 2.9 that rose
          to 5.5 when the index case was implanted at or before 60 years. Study design: nationwide register-based
          cohort, 6,027,090 individuals followed 1982 to 2022. This is heritable sinus node dysfunction
          at population scale and is not genotyped, so SSS2 is one of several contributing causes rather
          than the measured entity, and the recorded rate is the rate for that relative population, not
          a prevalence for SSS2. It is recorded because it is the only population-scale occurrence figure
          available for the familial form, and because the inverse relationship with onset age is the
          epidemiological shadow of exactly the early-onset Mendelian subgroup this entry describes. No
          general-population prevalence has been reported for SSS2 itself; the HCN4 shares of ascertained
          cohorts are recorded under genetic.case_fractions, which is the slot for a genetic-spectrum
          share.'
      selected_evidence:
        snippet: 'The adjusted rate ratio (RR) of pacemaker-treated SND was 2.9 (2.4-3.6) for individuals
          having any father, mother, or sibling with a pacemaker implanted on this indication compared
          with the general population (derived cumulative incidence at the age of 68 years: 0.79 and 0.27%,
          respectively).'
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /prevalence/0
      evidence_path: /prevalence/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39535890
      reference_title: 'Familial risk of sinus node dysfunction indicating pacemaker implantation: a nationwide
        cohort study.'
      evidence_source: HUMAN_CLINICAL
      explanation: Gives both the recorded cumulative incidence and its general-population comparator.
        The cohort is not genotyped, so the step from familial sinus node dysfunction to SSS2 specifically
        is an inference.
