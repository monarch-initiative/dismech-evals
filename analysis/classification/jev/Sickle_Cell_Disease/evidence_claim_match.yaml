      assertion_type: Pathophysiology
      assertion:
        name: Erythrocyte Dehydration
        description: Sickling-induced membrane permeabilization activates the calcium-sensitive Gardos
          channel and the K-Cl cotransporter, so the cell loses potassium, chloride and water and becomes
          a dense, irreversibly dehydrated erythrocyte with a raised mean corpuscular hemoglobin concentration.
          Because the polymerization delay time is so steeply concentration dependent, that rise in intracellular
          HbS concentration feeds back onto polymerization, making dehydration an amplifying loop rather
          than a terminal consequence.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Dense dehydrated sickle erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
        biological_processes:
        - preferred_term: potassium efflux through the Gardos channel and K-Cl cotransporter
          term:
            id: GO:0006813
            label: potassium ion transport
      selected_evidence:
        snippet: Polymers of deoxyhemoglobin S deform sickle cell anemia red blood cells into sickle shapes,
          leading to the formation of dense, dehydrated red blood cells with a markedly shortened life-span.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15618480
      reference_title: Ion transport pathology in the mechanism of sickle cell dehydration.
      evidence_source: OTHER
      explanation: 'States the step this node represents: polymer-driven deformation produces dense dehydrated
