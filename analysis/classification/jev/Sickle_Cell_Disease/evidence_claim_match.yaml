        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_hbs_polymerization_vasoocclusion_model
        hypothesis_label: Canonical HbS Polymerization and Vaso-Occlusion Model
        status: CANONICAL
        description: Biallelic HBB pathogenic variants (most commonly βS/βS) produce hemoglobin S, which
          polymerizes upon deoxygenation into rigid intracellular fibers that deform erythrocytes into
          the characteristic sickle shape. Sickle erythrocytes show reduced deformability, increased adhesion
          to endothelium and leukocytes, and shortened survival, producing chronic hemolytic anemia and
          recurrent vaso-occlusive episodes. Downstream consequences include painful crises, acute chest
          syndrome, stroke, splenic infarction, end-organ damage (kidney, lung, retina, bone), and chronic
          inflammation driven by free heme and reactive oxygen species.
        notes: 'Retained as CANONICAL. The 2026 openscientist hypothesis-search report (kb/hypotheses/Sickle_Cell_Disease/canonical_hbs_polymerization_vasoocclusion_model)
          found the model strongly supported with mandatory qualifications. Most decisive evidence: CRISPR-Cas9
          gene therapy (exa-cel) achieves 97% freedom from severe VOCs by reactivating HbF to inhibit
          HbS polymerization — definitive that polymerization is the rate-limiting upstream event. Biophysical
          foundations (double-nucleation kinetics, extreme HbS-concentration dependence of polymerization
          delay) are among the most rigorously characterized in molecular medicine. Three qualifications:
          (1) vaso-occlusion is multicellular (endothelium, neutrophil, platelet, RBC adhesion), not purely
          RBC; (2) chronic hemolysis-driven oxidative stress and NO depletion drive pulmonary/renal end-organ
          damage independent of acute occlusion; (3) chronic inflammation persists post-HbF-reactivation,
          partly self-sustaining.'
      selected_evidence:
        snippet: Due to the unique dependence of Hb S polymerization on cellular Hb S concentration, cell
          dehydration promotes polymerization and sickling.
        supports: SUPPORT
    origin:
