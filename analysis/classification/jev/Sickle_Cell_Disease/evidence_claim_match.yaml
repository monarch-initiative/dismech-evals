        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Endothelial Activation and Leukocyte Recruitment
        description: Endothelial activation, driven by circulating sickle cells, by free heme from hemolysis
          and by secondary inflammatory stimuli, recruits adherent leukocytes to postcapillary venules.
          Those adherent leukocytes, principally neutrophils, then capture circulating sickle erythrocytes,
          and it is this heterotypic interaction rather than red-cell rigidity alone that impedes microvascular
          flow. This node carries the multicellular half of vaso-occlusion, which the rheological account
          of the canonical model leaves implicit.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: Endothelial Cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: leukocyte adhesion to vascular endothelial cell
          term:
            id: GO:0061756
            label: leukocyte adhesion to vascular endothelial cell
        - preferred_term: leukocyte migration
          term:
            id: GO:0050900
            label: leukocyte migration
      selected_evidence:
        snippet: IVIG rapidly (<10 minutes) reduced adherent leukocyte numbers and dramatically inhibited
          interactions between RBCs and WBCs, resulting in improved microcirculatory blood flow and survival
          of sickle cell "Berkeley" mice.
        supports: SUPPORT
    origin:
