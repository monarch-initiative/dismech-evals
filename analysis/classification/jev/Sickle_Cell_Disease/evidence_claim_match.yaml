  d7b3d48aad87a89311dab4f9406e4d854dfe6a95b90e16f7c63340afed5bd7f0:
    claim:
      about:
        disease:
          name: Sickle Cell Disease
          disease_term:
            preferred_term: sickle cell disease
            term:
              id: MONDO:0011382
              label: sickle cell disease
        context: []
      assertion_type: ComputationalModel
      assertion:
        name: Zheng multiscale QSP model of autologous gene therapy
        description: Deterministic ordinary-differential-equation model coupling hematopoietic stem-cell
          engraftment, erythroid differentiation, red-cell turnover, globin assembly, and oxygen-regulated
          erythropoiesis. Healthy and SCD parameterizations are extended with myeloablative preconditioning
          and transplantation of CD34-positive cells expressing an anti-sickling gamma-globin.
        model_type: KINETIC
        model_id: Zheng-SCD-QSP-2021
        model_format: ODE equations and parameters in the article and supporting information
        publication: PMID:34139105
        modeled_mechanisms:
        - target: Chronic Hemolysis
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Reproduces the shortened red-cell lifespan and compensatory erythropoietic state
            used to distinguish the SCD and healthy steady states.
          limitations: Hemolysis is represented through a fixed mean red-cell lifespan rather than explicit
            intravascular and extravascular destruction mechanisms.
        - target: Red Blood Cell Sickling
          relationship: PERTURBS
          fidelity: MODERATE
          description: Simulates replacement of HbS-containing cells by longer-lived transduced cells
            expressing an anti-sickling hemoglobin after autologous gene therapy.
          limitations: The model predicts hemoglobin composition and a non-sickled-cell fraction but does
            not explicitly simulate HbS nucleation, fiber growth, membrane deformation, vaso-occlusion,
            or organ injury.
        variables:
        - name: Initial transduced CD34-positive cell dose
          dataset_identifier: initial_dose
          description: Number of autologous progenitor cells infused after preconditioning
          unit: cells
        - name: Long-term hematopoietic stem-cell fraction
          dataset_identifier: LT-HSC_fraction
          description: Fraction of the infused dose capable of stable long-term engraftment
          unit: fraction
        - name: Mean vector copy number
          dataset_identifier: VCN
          description: Model proxy for the fraction of infused cells carrying the therapeutic vector
          unit: copies/cell
        - name: Preconditioning depletion
          dataset_identifier: preconditioning
          description: Fractional depletion of endogenous hematopoietic progenitor pools
          unit: fraction
        - name: Anti-sickling hemoglobin
          dataset_identifier: HbNew
          description: Peripheral-blood concentration of the modeled therapeutic hemoglobin
          unit: g/dL
        - name: Transduced red blood cells
          dataset_identifier: transduced_RBC
          description: Circulating red cells derived from transduced progenitors
          unit: cells
        findings:
        - statement: 'Simulated reconstitution is biphasic: short-lived progenitors generate an early
            wave of transduced red cells, while long-term stem-cell engraftment sustains later production.'
        - statement: Initial transduced-cell dose and myeloablative preconditioning intensity were the
            strongest positive determinants of modeled long-term outcome.
        notes: Curated from the publication and supporting equations; no exact deposited implementation
          was identified. Important assumptions include deterministic population averages, at most one
          vector copy per cell, fixed fractional progenitor depletion, immediate marrow homing, omission
          of non-erythroid hematopoiesis and iron/heme handling, and empirical oxygen feedback.
      selected_evidence:
        snippet: We used ordinary differential equations to model RBC production from progenitor cells
          in the bone marrow, and hemoglobin assembly from its constituent globin monomers.
        supports: SUPPORT
    origin:
      assertion_path: /computational_models/0
      evidence_path: /computational_models/0/evidence/0
      context_paths:
