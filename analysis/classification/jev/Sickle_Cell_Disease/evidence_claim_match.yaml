          description: Simulates oxygen-dependent HbS nucleation and fiber growth using classical nucleation
            theory and chemical rate laws.
          limitations: HbS nucleus structure is not experimentally known, so the nucleation barrier and
            related prefactors rely on approximations and fitted values.
        - target: Red Blood Cell Sickling
          relationship: MEASURES
          fidelity: MODERATE
          description: Converts simulated intracellular fiber-bundle growth into sickling time and the
            predicted fraction of sickled erythrocytes.
          limitations: Predictions depend strongly on patient-specific hemoglobin distributions, composition,
            and mean cell volume; missing inputs were sometimes replaced by assumed population values,
            and oxygen tension was modeled as spatially uniform.
