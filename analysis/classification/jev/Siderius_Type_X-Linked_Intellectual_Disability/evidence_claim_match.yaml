  3fda45e2104a583ce2c13f024b7386873db6adec9bfb6f57bdb86899e0ee060d:
    claim:
      about:
        disease:
          name: Siderius Type X-Linked Intellectual Disability
          disease_term:
            preferred_term: syndromic X-linked intellectual disability Siderius type
            term:
              id: MONDO:0010286
              label: syndromic X-linked intellectual disability Siderius type
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Exome or Genome Sequencing
        description: 'There are no formal clinical diagnostic criteria and the gestalt is too mild to
          be reliably recognised prospectively; molecular testing is the diagnosis. Exome or genome sequencing,
          or a targeted X-linked intellectual disability gene panel, is the appropriate route for a male
          with unexplained developmental delay, with or without orofacial clefting. The ascertainment
          shift matters clinically: the largest series was assembled largely through sequencing of individuals
          with developmental delay rather than through cleft clinics, so PHF8 should not be reserved for
          patients who have a cleft. Chromosomal microarray covers the Xp11.22 microdeletion fraction,
          which sequencing may miss.

          '
      selected_evidence:
        snippet: 'Seven families could be re-contacted and variant segregation analysis of the respective
          eight candidate variants was performed: HUWE1, IQSEC2, MAOA, MED12, PHF8, SLC6A8, SLC9A6, and
          SYN1.'
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
