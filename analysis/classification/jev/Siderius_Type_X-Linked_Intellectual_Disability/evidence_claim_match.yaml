      assertion_type: Pathophysiology
      assertion:
        name: Impaired Serine Biosynthesis in Neural Progenitors
        biological_scale: CELLULAR
        description: 'The most recently described arm, and the one that connects chromatin regulation
          to metabolism. In neural stem cells PHF8 drives the serine biosynthesis pathway by tuning chromatin
          accessibility at the promoters of metabolic genes, safeguarding the intracellular serine pool
          that progenitor proliferation depends on. Loss of PHF8 disrupts amino-acid metabolism, blocks
          autophagy and impairs vesicle formation, and culminates in replication defects, DNA damage and
          proliferation arrest; in mouse embryos PHF8 deficiency halts progenitor expansion and neuron
          generation in the developing brain. Evidence is from neural stem cells and mouse embryos, not
          from patients.

          '
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        biological_processes:
        - preferred_term: L-serine biosynthetic process
          term:
            id: GO:0006564
            label: L-serine biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: In vivo, PHF8 deficiency in mouse embryos halts neurogenesis, progenitor expansion, and
          neuron generation in the developing brain.
        supports: SUPPORT
