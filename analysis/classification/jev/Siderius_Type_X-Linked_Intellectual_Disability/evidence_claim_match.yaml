  3e55cfd5a9748cd3e84ba6c072538122bb7ba948cc8aeee72d6835fd1ce9103b:
    claim:
      about:
        disease:
          name: Siderius Type X-Linked Intellectual Disability
          disease_term:
            preferred_term: syndromic X-linked intellectual disability Siderius type
            term:
              id: MONDO:0010286
              label: syndromic X-linked intellectual disability Siderius type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of RNA Polymerase II-Coupled Transcriptional Coactivation
        biological_scale: MOLECULAR
        description: 'The convergence point of the chromatin arms. PHF8 occupies the transcription start
          sites of thousands of active or poised genes, mirroring the distribution of RNA polymerase II
          and H3K4me3-marked nucleosomes, and contacts the RNAPII C-terminal domain directly; it therefore
          acts as a promoter-resident transcriptional coactivator whose activation function depends on
          PHD binding to H3K4me3. Patient alleles are defective in coactivation as well as in demethylation.
          PHF8 additionally partners with the XLID transcription factor ZNF711 at a shared target set,
          and co-occupies promoters with the REST/NRSF repressor, so the net transcriptional output at
          any locus can be activating or repressive; the dominant documented effect is loss of activation.
          Downstream of this node the disease diversifies into distinct neural and craniofacial cell-type
          programmes.

