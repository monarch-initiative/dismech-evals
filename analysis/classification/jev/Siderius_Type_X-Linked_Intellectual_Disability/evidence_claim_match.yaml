          pathway becomes hyperactive in hippocampus. This is the one node in the entry with a demonstrated
          rescue: rapamycin normalises both long-term potentiation and cognitive performance in the knockout.
          The evidence is entirely from the mouse; no patient has been treated on this rationale.

