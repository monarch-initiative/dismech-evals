      assertion_type: Pathophysiology
      assertion:
        name: Perturbed Oligodendroglial Development
        biological_scale: CELLULAR
        description: 'A third glial arm, and the least clinically anchored of the three. Phf8 promotes
          proliferation of oligodendrocyte progenitor cells and restrains their differentiation into oligodendrocytes,
          acting largely through Olig2, whose regulatory regions it occupies; ectopic Olig2 rescues the
          proliferation defect in Phf8-deficient cells. Notably, human iPSC-derived oligodendrocyte generation
          did not require PHF8 when Olig2 was force-expressed, so the human requirement is conditional.
          No white-matter abnormality has been documented in patients with this syndrome, so this node
          is marked provisional.

          '
        mechanism_confidence: PROVISIONAL
        cell_types:
        - preferred_term: oligodendrocyte precursor cell
          term:
            id: CL:0002453
            label: oligodendrocyte precursor cell
        biological_processes:
        - preferred_term: Oligodendrocyte differentiation
          term:
            id: GO:0048709
            label: oligodendrocyte differentiation
          modifier: ABNORMAL
      selected_evidence:
        snippet: Taking the influence of Olig2 levels on oligodendroglial proliferation and differentiation
          into account, Olig2 likely acts as an important downstream effector of Phf8 in these cells.
        supports: SUPPORT
