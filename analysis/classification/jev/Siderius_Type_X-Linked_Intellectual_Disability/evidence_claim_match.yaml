        name: Impaired Neuronal Differentiation and Neurite Outgrowth
        biological_scale: CELLULAR
        description: 'PHF8 is required for neuronal differentiation and for the cytoskeletal programme
          that builds neurites. Knockdown in P19 embryonal carcinoma cells impairs retinoic-acid-induced
          neuronal differentiation, and overexpression of wild-type but not the catalytically dead F279S
          variant pushes the cells toward a neuronal fate - a clean genotype-to-cell-phenotype link through
          a patient allele. In differentiated neurons, PHF8 depletion downregulates cytoskeletal genes
          and produces deficient neurite outgrowth, which the authors propose is the cellular substrate
          of the cognitive phenotype.

          '
        cell_types:
        - preferred_term: neuron
          term:
