            id: GO:0031175
            label: neuron projection development
          modifier: DECREASED
      selected_evidence:
        snippet: Consistent with a role for PHF8 in neuronal differentiation, knockdown of PHF8 in mouse
          embryonic carcinoma P19 cells impairs RA-induced neuronal differentiation, whereas overexpression
          of the wild-type but not the F279S mutant PHF8 drives P19 cells toward neuronal differentiation.
