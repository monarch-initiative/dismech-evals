              label: syndromic X-linked intellectual disability Siderius type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pathogenic PHF8 Loss-of-Function Variant
        biological_scale: MOLECULAR
        description: 'The shared upstream lesion is a hemizygous loss-of-function variant in PHF8 at Xp11.22.
          The reported allele spectrum is small but mechanistically coherent: nonsense and frameshift
          alleles that truncate the protein before or within the JmjC domain and remove the nuclear localisation
          signals, splice alleles, missense alleles clustered in the JmjC-encoding exons, and whole-gene
          microdeletions. All reported mechanisms converge on loss of function; no dominant-negative or
          gain-of-function mechanism has been demonstrated for the germline neurodevelopmental phenotype.
          Two consequences fan out from this node in parallel rather than in series - loss of JmjC catalysis,
          and, for the truncating alleles, loss of the PHD-finger/nuclear-targeting module - because the
          F279S missense allele abolishes catalysis while leaving the N-terminal PHD finger intact, and
          the K177X nonsense allele removes both.

          '
        gene:
          preferred_term: PHF8
          term:
            id: hgnc:20672
            label: PHF8
        molecular_functions:
        - preferred_term: histone demethylase activity
          term:
            id: GO:0032452
            label: histone demethylase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Truncating mutations were found in the PHF8 gene (encoding the PHD finger protein 8)
          in two unrelated families with X linked mental retardation (XLMR) associated with cleft lip/palate
          (MIM 300263).
        supports: SUPPORT
