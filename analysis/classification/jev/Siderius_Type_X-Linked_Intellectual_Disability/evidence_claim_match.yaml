              label: syndromic X-linked intellectual disability Siderius type
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Claes-Jensen type syndromic X-linked intellectual disability (KDM5C)
        disease_term:
          preferred_term: syndromic X-linked intellectual disability Claes-Jensen type
          term:
            id: MONDO:0010355
            label: syndromic X-linked intellectual disability Claes-Jensen type
        description: 'The most important named-entity distinction for this entry, because the two literatures
          are genuinely entangled rather than merely similarly named. Both are eponymous X-linked syndromic
          intellectual disability entities caused by JmjC-domain histone demethylases, both were delineated
          by the same era of X-chromosome mutation screening, and PHF8 and KDM5C/JARID1C are functionally
          linked in one transcriptional module through ZNF711 - so KDM5C is cited inside PHF8 mechanism
          papers and vice versa. They are nonetheless distinct MONDO entities with distinct genes, distinct
          OMIM numbers and distinct clinical profiles: Claes-Jensen is a KDM5C H3K4me3 eraser disorder
          with short stature, spasticity, hyperreflexia and seizures and is one of the commoner causes
          of X-linked intellectual disability, whereas Siderius type is a PHF8 H4K20me1/H3K9me1-2 eraser
          disorder with orofacial clefting and a milder, much rarer picture. Evidence must never be pooled
          across the two.

          '
      selected_evidence:
        snippet: Interestingly, mutations in all four genes (KDM5C, ARX, ZNF711 and PHF8) are associated
          with X-linked NDDs comprising intellectual disability as a core feature.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
