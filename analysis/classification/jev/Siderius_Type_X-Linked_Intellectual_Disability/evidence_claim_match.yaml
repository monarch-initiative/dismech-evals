            term:
              id: MONDO:0010286
              label: syndromic X-linked intellectual disability Siderius type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: phf8_episignature
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Does PHF8-related intellectual disability have a DNA-methylation episignature that could
          resolve its reported variants of uncertain significance?

          '
        attaches_to:
        - pathophysiology#Failure of RNA Polymerase II-Coupled Transcriptional Coactivation
        rationale: 'Many chromatinopathies - Kabuki, Sotos and CHARGE among them - now have peripheral-blood
          DNA-methylation episignatures that reclassify missense variants of uncertain significance into
          pathogenic or benign. No such classifier exists for PHF8. This is not an academic gap: the largest
          series reported five individuals from four families with intellectual disability, a PHF8 variant
          of uncertain significance and no alternative explanation, which is precisely the population
          an episignature would resolve. PHF8 is a transcriptional coactivator acting on repressive histone
          marks, so a downstream methylation signature is mechanistically plausible.

          '
        proposed_experiments:
        - experiment_id: phf8_methylation_classifier
          name: Peripheral-blood methylation classifier for PHF8 loss of function
          description: 'Generate genome-wide methylation array data from peripheral blood of individuals
            with confirmed PHF8 loss-of-function variants and train a classifier against matched controls
            and against other chromatinopathy signatures.

            '
          decision_criterion: 'A reproducible signature separates PHF8 loss-of-function carriers from
            controls with high sensitivity and specificity.

            '
          supporting_outcome:
          - PHF8 belongs among the episignature-classifiable chromatinopathies.
        - experiment_id: phf8_vus_classification
          name: Classification of reported PHF8 missense variants of uncertain significance
          description: 'Apply the trained classifier to samples from the five reported individuals carrying
            PHF8 missense variants of uncertain significance.

            '
          decision_criterion: 'Each variant of uncertain significance is assigned to the affected or the
            control cluster.

            '
          supporting_outcome:
          - Episignature testing can resolve the PHF8 variant-interpretation backlog.
      selected_evidence:
        snippet: We also present five individuals from four different families who have ID and a variant
          of unknown significance in PHF8 with no other explanatory variant in another gene.
        supports: SUPPORT
