  cf30c7adf019fe2212d710b3c110e8bdfcd877e6ab4f4a36973c5438c3ca3baa:
    claim:
      about:
        disease:
          name: Siderius Type X-Linked Intellectual Disability
          disease_term:
            preferred_term: syndromic X-linked intellectual disability Siderius type
            term:
              id: MONDO:0010286
              label: syndromic X-linked intellectual disability Siderius type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of PHD-Finger H3K4me3 Reading and Nuclear Targeting
        biological_scale: MOLECULAR
        description: 'The N-terminal PHD finger of PHF8 binds H3K4me3/me2, the mark that decorates active
          transcription start sites, and this reader function is what recruits the enzyme to the promoters
          it acts on. Truncating patient alleles remove not only the JmjC domain but also the nuclear
          localisation signals, so the residual protein cannot reach chromatin at all. This is modelled
          as a sibling of the catalytic arm rather than a downstream consequence, because the F279S catalytic-dead
          allele leaves the PHD finger intact while the K177X nonsense allele removes both modules - the
          two arms are separable in the patient allele series.

          '
        molecular_functions:
        - preferred_term: histone H3K4me3 reader activity
          term:
            id: GO:0140002
            label: histone H3K4me3 reader activity
          modifier: DECREASED
      selected_evidence:
        snippet: Our biochemical analysis revealed specific association of the PHF8 PHD with histone H3
          trimethylated at lysine 4 (H3K4me3).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
