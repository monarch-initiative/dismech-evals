              label: syndromic X-linked intellectual disability Siderius type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of JmjC-Domain Histone Demethylase Activity
        biological_scale: MOLECULAR
        description: 'PHF8 is an Fe(II)- and 2-oxoglutarate-dependent oxygenase of the double-stranded
          beta-helix class. Its JmjC domain removes mono- and dimethyl marks from lysine but not trimethyl
          marks. Patient alleles clustered in the JmjC-encoding exons abolish this catalysis: the F279S
          missense variant, which substitutes a residue in a conserved hydrophobic region of the JmjC
          domain, is catalytically inactive against both peptide and intact-histone substrates, and truncating
          alleles remove the domain outright. Because the reaction requires molecular oxygen, PHF8 activity
          is oxygen-dependent, a property that has been proposed - though not demonstrated in patients
          - to link the catalytic arm to the known association between maternal hypoxia and cleft lip
          in mouse studies.

          '
        molecular_functions:
        - preferred_term: histone H4K20 demethylase activity
          term:
            id: GO:0035575
            label: histone H4K20 demethylase activity
          modifier: DECREASED
        - preferred_term: histone H3K9 demethylase activity
          term:
            id: GO:0032454
            label: histone H3K9 demethylase activity
          modifier: DECREASED
      selected_evidence:
        snippet: This mutant encodes a F279S variant of PHF8 that modifies a conserved hydrophobic region;
          assays with both peptides and intact histones reveal this variant to be catalytically inactive.
        supports: SUPPORT
