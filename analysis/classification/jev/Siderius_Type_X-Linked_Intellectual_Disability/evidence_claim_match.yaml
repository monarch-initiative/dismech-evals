        hypothesis_label: mTOR pathway suppression as a disease-modifying strategy
        status: EMERGING
        description: 'Because the cognitive and synaptic deficits of the Phf8 knockout mouse are driven
          by RSK1-dependent mTOR hyperactivation and are reversed by rapamycin, mTOR inhibition has been
          proposed as a rational therapeutic target for PHF8-related intellectual disability. The hypothesis
          rests on a single mouse study. It has not been tested in any human with a PHF8 variant, the
          therapeutic window in a chronic paediatric neurodevelopmental indication is unknown, and rapamycin''s
          immunosuppressive and metabolic toxicity is substantial. It is recorded here as an emerging
          research direction, not as a treatment.

          '
      selected_evidence:
