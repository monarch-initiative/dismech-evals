      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: oxygen_sensing_clefting
        hypothesis_label: Oxygen-dependence of PHF8 catalysis as a link to hypoxia-associated clefting
        status: EMERGING
        description: 'PHF8 is a 2-oxoglutarate/Fe(II) oxygenase and therefore consumes molecular oxygen.
          This has prompted the suggestion that partial loss of PHF8 activity and gestational hypoxia
          converge on the same craniofacial endpoint, which would predict that maternal hypoxic exposures
          modify cleft risk in carriers. No human data address this. It is recorded because it is the
          only proposed gene-environment interaction for this disorder and because it would be testable.

          '
      selected_evidence:
        snippet: The dependence of PHF8 activity on oxygen availability is interesting because the occurrence
          of fetal cleft lip has been demonstrated to increase with maternal hypoxia in mouse studies.
        supports: SUPPORT
