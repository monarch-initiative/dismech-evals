      reference_title: Histone demethylase KDM5C is a SAHA-sensitive central hub at the crossroads of
        transcriptional axes involved in multiple neurodevelopmental disorders.
      evidence_source: IN_VITRO
      explanation: 'States explicitly that PHF8 and KDM5C are separate genes causing separate X-linked
