        description: NOT effective in GLRX5-related sideroblastic anemia. Pyridoxine is the standard first-line
          treatment for X-linked ALAS2-related sideroblastic anemia, which is this disease's main differential,
          and the refractoriness is definitional enough that OMIM names the entity "anemia, sideroblastic,
          3, pyridoxine-refractory". Curated as an explicitly ineffective treatment rather than omitted,
          because a clinician reaching for the ALAS2 playbook would otherwise find nothing here to stop
          them.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
