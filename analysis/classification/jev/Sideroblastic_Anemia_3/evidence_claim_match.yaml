      assertion_type: Pathophysiology
      assertion:
        name: GLRX5 Deficiency and Impaired Iron-Sulfur Cluster Biogenesis
        biological_scale: MOLECULAR
        description: Biallelic GLRX5 variants reduce or abolish glutaredoxin 5, a mitochondrial protein
          that homodimerises and assembles a [2Fe-2S] cluster, and is required for iron-sulfur cluster
          biogenesis. GLRX5 is highly expressed in erythroid cells, which is one reason the phenotype
          is erythroid-predominant.
        genes:
        - preferred_term: GLRX5
          term:
            id: hgnc:20134
            label: GLRX5
        biological_processes:
        - preferred_term: iron-sulfur cluster assembly
          modifier: DECREASED
          term:
            id: GO:0016226
            label: iron-sulfur cluster assembly
        cellular_components:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
      selected_evidence:
        snippet: the iron-responsive element-binding (IRE-binding) activity of iron regulatory protein
          1 (IRP1) was activated, and increased IRP2 levels, indicative of relative cytosolic iron depletion,
          were observed together with mitochondrial iron overload.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
