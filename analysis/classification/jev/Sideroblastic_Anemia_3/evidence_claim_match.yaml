              label: pyridoxine
        target_phenotypes:
        - preferred_term: Microcytic anemia
          term:
            id: HP:0001935
            label: Microcytic anemia
      selected_evidence:
        snippet: The occurrence of pyridoxine resistant sideroblastic anemia is discernible given the
          role of GLRX5 in both mitochondrial and cytosolic Fe homeostasis
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/1
