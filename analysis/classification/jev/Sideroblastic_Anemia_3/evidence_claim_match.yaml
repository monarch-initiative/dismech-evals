      assertion_type: AnimalModel
      assertion:
        name: shiraz (sir) zebrafish grx5 mutant
        species: Zebrafish
        genotype: grx5 (glutaredoxin 5) deficiency
        publication: PMID:16110529
        description: The zebrafish mutant that established the GLRX5-heme connection. Loss of Fe-S cluster
          assembly activates IRP1 and blocks ALAS2-catalysed heme biosynthesis. The causal role of the
          IRP1-ALAS2 axis was established by two reciprocal rescue experiments rather than by correlation.
        modeled_mechanisms:
        - target: IRP1 Activation and Iron-Responsive Element Binding
          relationship: RECAPITULATES
          fidelity: HIGH
          description: 'The model demonstrates the IRP1-dependence of the heme block directly: ALAS2 lacking
            its iron-responsive element rescues the mutant while ALAS2 retaining the element does not,
            and IRP1 knockdown restores haemoglobin synthesis.'
          limitations: Severity does not translate. The zebrafish mutant is embryonically lethal, whereas
            human GLRX5 deficiency presents in adulthood with anemia and iron overload; the original human
            report states this divergence explicitly. Zebrafish also lack the iron-overload phenotype
            that dominates the human disease.
          readouts:
          - name: Haemoglobin synthesis after IRP1 antisense knockdown
            target: IRP1 Activation and Iron-Responsive Element Binding
            direction: RESTORED
            interpretation: Restoration of haemoglobin on IRP1 knockdown establishes that IRP1 activation
              is the causal intermediate, not a bystander.
          - name: Embryo rescue by iron-responsive-element-less ALAS2 overexpression
            target: IRP1 Activation and Iron-Responsive Element Binding
            direction: RESTORED
            interpretation: Rescue only by the ALAS2 transcript lacking the iron-responsive element localises
              the block to IRP1-mediated translational repression of ALAS2.
      selected_evidence:
        snippet: Here we show that the hypochromic anaemia in shiraz (sir) zebrafish mutants is caused
          by deficiency of glutaredoxin 5 (grx5), a gene required in yeast for Fe-S cluster assembly.
        supports: SUPPORT
