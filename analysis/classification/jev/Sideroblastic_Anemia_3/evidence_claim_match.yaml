        description: Activated IRP1 binds iron-responsive elements, stabilising transferrin receptor 1
          mRNA and repressing translation of transcripts carrying a 5'-iron-responsive element, which
          in erythroid cells includes ferritin and ALAS2. Erythroblasts are unusual in expressing both
          the IRP-repressible ALAS2 and a non-IRP-repressible ferroportin isoform, and this particular
          combination of IRP targets is what makes the phenotype erythroid-specific.
        biological_processes:
        - preferred_term: cellular iron ion homeostasis
          modifier: ABNORMAL
          term:
            id: GO:0006879
            label: intracellular iron ion homeostasis
      selected_evidence:
        snippet: Erythroblasts express both IRP-repressible ALAS2 and non-IRP-repressible ferroportin
          1b. The unique combination of IRP targets likely accounts for the tissue-specific phenotype
          of human GLRX5 deficiency.
        supports: SUPPORT
