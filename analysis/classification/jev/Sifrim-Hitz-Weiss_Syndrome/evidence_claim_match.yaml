      assertion:
        name: Impaired NuRD-dependent cortical neurogenesis
        description: In the developing cortex, NuRD is a major chromatin-remodeling complex in which a
          sequential switch of CHD subunits (CHD4, CHD5, CHD3) controls distinct developmental steps.
          CHD4-containing NuRD promotes the early proliferation of neural progenitor cells; loss or dysfunction
          of CHD4 disrupts progenitor proliferation and downstream neuronal differentiation and migration,
          providing a cellular basis for the intellectual disability, developmental delay, and brain anomalies
          of SIHIWES.
