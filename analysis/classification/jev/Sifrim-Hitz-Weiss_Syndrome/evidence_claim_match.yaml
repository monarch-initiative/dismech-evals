        prompt: Are there genotype-phenotype correlations in Sifrim-Hitz-Weiss syndrome based on the type
          or location of CHD4 variants, and do the variant-specific differences in CHD4 ATP hydrolysis
          and chromatin remodeling activity translate into distinct clinical subphenotypes?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#CHD4/NuRD chromatin remodeling dysfunction
        - genetic#CHD4 de novo variants
        rationale: The largest published cohort (32 individuals) found variant-specific alterations in
          CHD4 ATP hydrolysis and chromatin remodeling activity in vitro, yet a similar phenotype in humans
          and no detectable genotype-phenotype correlation by variant type or location. Resolving whether
          finer functional or domain-level stratification predicts clinical severity would clarify the
          genotype-phenotype map and inform prognosis.
      selected_evidence:
        snippet: We did not identify genotype-phenotype correlations based on the type or location of
          variants.
        supports: SUPPORT
