        name: CHD4/NuRD chromatin remodeling dysfunction
        description: CHD4 is the catalytic ATPase core of the nucleosome remodeling and deacetylase (NuRD)
          complex, which couples ATP-dependent chromatin remodeling with histone deacetylase activity
          to repress gene transcription. SIHIWES-causing variants are predominantly nontruncating substitutions
          clustered in the SNF2-like ATPase region; they alter CHD4 ATP hydrolysis and nucleosome-remodeling
          activity in a variant-specific manner, perturbing the NuRD-dependent transcriptional programs
          required for normal neurodevelopment and organogenesis.
