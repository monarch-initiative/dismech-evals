      assertion_type: Pathophysiology
      assertion:
        name: Mucociliary Stasis and Mucus Retention
        description: Loss of ciliary clearance and accumulation of static mucus opacifies the sinus on
          imaging and reinforces obstruction. Although classical SSS is "silent" because complete blockade
          prevents purulent rhinosinusitis, rare variants present without opacification when residual
          aeration persists, demonstrating that mucus retention is contributory rather than obligatory.
        cell_types:
        - preferred_term: ciliated epithelial cell
          term:
            id: CL:0000067
            label: ciliated epithelial cell
        - preferred_term: mucus secreting cell
          term:
            id: CL:0000319
            label: mucus secreting cell
        biological_processes:
        - preferred_term: mucociliary clearance
          term:
            id: GO:0120197
            label: mucociliary clearance
          modifier: DECREASED
        - preferred_term: mucus secretion
          term:
            id: GO:0070254
            label: mucus secretion
        locations:
        - preferred_term: mucosa of maxillary sinus
          term:
            id: UBERON:0005028
            label: mucosa of maxillary sinus
      selected_evidence:
        snippet: Secondary SSS arises from trauma or surgery disrupting mucociliary clearance.
        supports: SUPPORT
