  a2228fe49ec08789b359494e6eafafe5512a7005b84c017040a735bba24e603f:
    claim:
      about:
        disease:
          name: Silent Sinus Syndrome
          disease_term:
            preferred_term: silent sinus syndrome
            term:
              id: MONDO:0019108
              label: silent sinus syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ostiomeatal Complex Obstruction
        description: Functional occlusion of the maxillary infundibulum / ostiomeatal complex (OMC) initiates
          the SSS cascade. Obstruction may be idiopathic (anatomic variants such as uncinate process lateralization,
          septal deviation toward the affected side, or concha bullosa), iatrogenic/post-traumatic (mucociliary
          disruption from prior orbital or sinus surgery, midface fracture, malpositioned orbital floor
          implant), or rarely systemic (granulomatous sinonasal destruction in GPA). The obstruction is
          classically silent — the maxillary sinus does not produce inflammatory sinonasal symptoms —
          because complete outflow blockade prevents expression of typical mucopurulent rhinosinusitis.
        locations:
        - preferred_term: maxillary sinus
          term:
            id: UBERON:0001764
            label: maxillary sinus
        - preferred_term: uncinate process of ethmoid
          term:
            id: UBERON:0010372
            label: uncinate process of ethmoid
      selected_evidence:
        snippet: Obstruction of the maxillary ostium appears to play a critical role in the development
          of SSS.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
