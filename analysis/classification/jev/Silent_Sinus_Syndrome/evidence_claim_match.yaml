      assertion_type: Pathophysiology
      assertion:
        name: Negative-Pressure Bone Remodeling
        description: Sustained subatmospheric pressure combined with proposed subclinical inflammation
          activates osteoclast-mediated bone resorption and osteoblast-mediated remodeling of the thin
          bony walls of the maxillary sinus, particularly the orbital floor (sinus roof). The result is
          osteopenia, demineralization, focal dehiscence, and inward bowing of the sinus walls. Histologic
          data are sparse and stage-dependent; osteoclast activity is implicated mechanistically but may
          be undetectable in late, quiescent specimens.
        cell_types:
        - preferred_term: osteoclast
          term:
            id: CL:0000092
            label: osteoclast
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: bone resorption
          term:
            id: GO:0045453
            label: bone resorption
          modifier: INCREASED
        - preferred_term: bone remodeling
          term:
            id: GO:0046849
            label: bone remodeling
          modifier: INCREASED
        locations:
        - preferred_term: maxilla
          term:
            id: UBERON:0002397
            label: maxilla
        - preferred_term: orbit of skull
          term:
            id: UBERON:0001697
            label: orbit of skull
      selected_evidence:
        snippet: characterized by bone resorption and remodeling of the orbital floor due to otherwise
          asymptomatic maxillary sinus disease
        supports: SUPPORT
