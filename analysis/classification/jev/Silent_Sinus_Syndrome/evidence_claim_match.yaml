  679e7a21474eac041d237e9e58e56ffcffbee2216d4f19d589234039553bb9a8:
    claim:
      about:
        disease:
          name: Silent Sinus Syndrome
          disease_term:
            preferred_term: silent sinus syndrome
            term:
              id: MONDO:0019108
              label: silent sinus syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Orbital Floor Resorption and Descent
        description: The weakened and retracting maxillary sinus roof (which forms the orbital floor)
          progressively descends into the atelectatic sinus, often with focal dehiscence. Bone resorption
          and remodeling increase orbital volume and allow the orbital fat and inferior rectus to herniate
          inferiorly. The resulting expansion of the bony orbit is the immediate cause of the cardinal
          phenotypes of SSS — enophthalmos, hypoglobus, and superior sulcus deepening — and is the proximal
          target of orbital reconstruction. Dynamic studies show the orbital floor can re-elevate after
          sinus re-aeration, supporting causal coupling to negative pressure.
        cell_types:
        - preferred_term: osteoclast
          term:
            id: CL:0000092
            label: osteoclast
        biological_processes:
        - preferred_term: bone resorption
          term:
            id: GO:0045453
            label: bone resorption
          modifier: INCREASED
        locations:
        - preferred_term: orbit of skull
          term:
            id: UBERON:0001697
            label: orbit of skull
        - preferred_term: maxilla
          term:
            id: UBERON:0002397
            label: maxilla
      selected_evidence:
        snippet: characterized by bone resorption and remodeling of the orbital floor due to otherwise
          asymptomatic maxillary sinus disease
        supports: SUPPORT
