  2693974dae96df7a5a3f29d1cd05cfb7a29a083cbdb4bf118c57b9331fb2267f:
    claim:
      about:
        disease:
          name: Silent Sinus Syndrome
          disease_term:
            preferred_term: silent sinus syndrome
            term:
              id: MONDO:0019108
              label: silent sinus syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sinus Hypoventilation and Negative Pressure
        description: With outflow occluded, the trapped maxillary gas is resorbed by the sinus mucosa,
          generating a sustained subatmospheric pressure analogous to middle-ear atelectasis from Eustachian
          tube dysfunction. The negative pressure is the central mechanical driver that distinguishes
          SSS from simple maxillary hypoplasia and that propagates downstream wall remodeling.
        cell_types:
        - preferred_term: respiratory tract epithelial cell
          term:
            id: CL:0002368
            label: respiratory tract epithelial cell
        locations:
        - preferred_term: maxillary sinus
          term:
            id: UBERON:0001764
            label: maxillary sinus
        - preferred_term: mucosa of maxillary sinus
          term:
            id: UBERON:0005028
            label: mucosa of maxillary sinus
      selected_evidence:
        snippet: Silent sinus syndrome (SSS) arises from negative pressure in the maxillary sinus through
          occlusion of the ethmoidal infundibulum.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
