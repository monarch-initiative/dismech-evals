          silica. Characterized histologically by alveolar filling with lipoproteinaceous material resembling
          pulmonary alveolar proteinosis (silicoproteinosis), rapidly progressive dyspnea, and high mortality.
          Note that the silicoproteinosis histology and mortality claims rest on the wider clinical literature
          rather than on a source curated in this entry.
      selected_evidence:
        snippet: acute silicosis that develops a few weeks to five years after exposure to high concentrations
          of repairable silica dust
        supports: SUPPORT
