      assertion_type: Environmental
      assertion:
        name: Occupational Respirable Crystalline Silica Exposure
        exposure_term:
          preferred_term: exposure to respirable crystalline silica
          term:
            id: ECTO:7000030
            label: exposure to silica dust
        exposure_classifications:
          hazard_agent_type:
          - classification_value: CHEMICAL
            notes: Respirable crystalline silica is a mineral dust, classified as a chemical agent in
              the occupational-hygiene scheme (ILO section 1.1 / European schedule chapter 1), not as
              a physical agent.
          exposure_route:
          - classification_value: INHALATION
            notes: Only the respirable fraction reaching the alveoli is pathogenic; the route is what
              defines the exposure, hence "respirable" in the name.
          exposure_duration:
          - classification_value: CHRONIC
            notes: ATSDR chronic duration (365 days and longer), matching classic chronic silicosis after
              10-30 years of exposure. Accelerated and acute silicosis follow INTERMEDIATE-duration heavy
              exposure, as in engineered-stone benchtop work.
          - classification_value: INTERMEDIATE
            notes: ATSDR intermediate duration (15-364 days), the exposure pattern behind acute silicosis/silicoproteinosis
              and the accelerated form driving the contemporary engineered-stone epidemic.
          iarc_carcinogen_group:
            classification_value: GROUP_1
            notes: IARC classifies crystalline silica dust in the form of quartz or cristobalite as Group
              1, carcinogenic to humans (lung cancer). This is a hazard identification about the agent;
              the lung-cancer risk it refers to is a separate outcome from silicosis itself, though the
              two share the exposure. Silicosis is not a cancer.
          ghs_health_hazard_class:
          - classification_value: STOT_REPEATED_EXPOSURE
            notes: Silicosis is the archetypal specific target organ toxicity from repeated exposure —
              a non-lethal, organ-specific effect (lung) accumulating over prolonged exposure rather than
              an acute toxic response.
          exposome_domain:
          - classification_value: SPECIFIC_EXTERNAL
            notes: An identifiable individual-level occupational agent, in Wild's specific external domain
              rather than the general external environment.
        notes: Silicosis is caused by inhalation of respirable crystalline silica (quartz, cristobalite,
          tridymite). Classic high-risk work includes hard-rock mining, quarrying, tunneling, sandblasting,
          foundry work, ceramics, and stone masonry. A contemporary epidemic of accelerated and acute
          silicosis is driven by cutting and polishing engineered (artificial) stone benchtops, which
          contain a much higher proportion of crystalline silica than natural stone.
      selected_evidence:
        snippet: A modern epidemic of silicosis is emerging internationally, associated with dry processing
          of engineered stone with high (>90%) RCS content.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
