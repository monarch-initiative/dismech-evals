      assertion_type: Subtype
      assertion:
        name: Chronic Silicosis
        display_name: Chronic (Simple) Silicosis
        description: The classic and most common form, following prolonged relatively low-level exposure
          and usually appearing 10–30 years after first exposure. Characterized by small rounded upper-zone
          nodules (simple nodular silicosis) that may coalesce into progressive massive fibrosis (complicated
          silicosis / conglomerate masses). The three silicosis forms are separated by exposure intensity
          and time from exposure to symptom onset.
      selected_evidence:
        snippet: According to the intensity of exposures and onset of initiation of clinical symptoms
          silicosis is classified into three groups of acute, chronic and accelerated forms.
        supports: SUPPORT
