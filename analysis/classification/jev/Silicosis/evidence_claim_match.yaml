      assertion_type: Pathophysiology
      assertion:
        name: Alveolar Macrophage Phagocytosis of Respirable Silica
        description: Respirable crystalline silica particles (aerodynamic diameter <10 microns) deposit
          in the terminal bronchioles and alveoli, where they are recognized and internalized by alveolar
          macrophages via scavenger receptors. This uptake is the initiating event of silicosis.
        role: trigger
        locations:
        - preferred_term: pulmonary alveolus
          term:
            id: UBERON:0002299
            label: alveolus of lung
        cell_types:
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
        biological_processes:
        - preferred_term: phagocytosis
          term:
            id: GO:0006909
            label: phagocytosis
          modifier: INCREASED
      selected_evidence:
        snippet: NALP3 activation required phagocytosis of crystals, and this uptake subsequently led
          to lysosomal damage and rupture.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
