              label: silicosis
        context: []
      assertion_type: Genetic
      assertion:
        name: TNF
        gene_term:
          preferred_term: TNF
          term:
            id: hgnc:11892
            label: TNF
        association: Host susceptibility/severity modifier — TNF-alpha promoter polymorphisms (notably
          -238A and -308A) are associated with predisposition to, and greater severity of, silicosis among
          silica-exposed workers. These are common regulatory variants that amplify the TNF-alpha-driven
          inflammatory response to inhaled silica; they modify risk but are neither necessary nor sufficient
          without exposure.
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        notes: Additional candidate susceptibility/modifier loci reported in the literature include IL1RN
          (IL-1 receptor antagonist), IL1B, IL6, and the glutathione-S-transferase detoxification genes
          (GSTM1/GSTT1/GSTP1); effects are modest and population-dependent. No genome-wide-significant
          common causal locus is established, consistent with silicosis being an environmentally caused
          disease with polygenic susceptibility modification.
      selected_evidence:
        snippet: Susceptibility to silicosis is in part genetically determined.
        supports: SUPPORT
