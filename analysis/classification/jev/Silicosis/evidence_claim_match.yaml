          sandblasting illustrates an unusually fast extreme, rather than defining the subtype. Accelerated
          disease has correspondingly rapid radiographic and functional progression and a poor prognosis.
          Increasingly reported in engineered-stone fabrication workers.
      selected_evidence:
        snippet: The case demonstrates a rare but largely preventable disease with serious health effects
          and a poor prognosis.
        supports: SUPPORT
