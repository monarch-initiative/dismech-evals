      assertion_type: Pathophysiology
      assertion:
        name: Phagolysosomal Membrane Rupture and Cathepsin B Release
        description: The reactive silanol-rich surface of internalized silica damages the phagolysosomal
          membrane, causing lysosomal destabilization and rupture with leakage of the protease cathepsin
          B into the cytosol.
        role: driver
        conforms_to: nlrp3_inflammasome_activation#Activating Danger Signal
        cell_types:
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
      selected_evidence:
        snippet: inhibition of either phagosomal acidification or cathepsin B activity impaired NALP3
          activation.
        supports: SUPPORT
