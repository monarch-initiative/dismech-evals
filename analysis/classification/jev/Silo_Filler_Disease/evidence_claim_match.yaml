          exposure produced progressive functional deterioration and hypoxemia, while nose-only exposure
          at the same concentration produced no hypoxemia and no pathological exudation at all.'
        biological_scale: ORGANISM
        locations:
        - preferred_term: terminal bronchiole
          term:
            id: UBERON:0002187
            label: terminal bronchiole
        - preferred_term: alveolus of lung
          term:
            id: UBERON:0002299
            label: alveolus of lung
        chemical_entities:
        - preferred_term: nitrogen dioxide
          term:
            id: CHEBI:33101
            label: nitrogen dioxide
      selected_evidence:
        snippet: Respiratory pattern was not significantly altered, lung mechanics changes were minimal,
          hypoxemia did not occur, and pathologic evidence of exudation was not apparent in nose-only,
          NO2-exposed sheep.
        supports: SUPPORT
