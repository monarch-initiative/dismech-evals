        name: Free-radical and acid injury of bronchiolar and alveolar epithelium
        description: Nitrogen dioxide reacting with airway lining fluid generates acid and reactive species
          that injure bronchiolar and alveolar epithelium. In sheep, lavage fluid epithelial cell number
          and total protein both rose while macrophage number fell, and histology at 24 hours showed patchy
          edema, mild hemorrhage and mixed leukocyte infiltration. The injury is slow to declare itself,
          which is the clinically dangerous feature.
        biological_scale: CELLULAR
        locations:
        - preferred_term: terminal bronchiole epithelium
          term:
            id: UBERON:0001958
            label: terminal bronchiole epithelium
        cell_types:
        - preferred_term: epithelial cell of the distal airway
          term:
            id: CL:0000082
            label: epithelial cell of lung
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        biological_processes:
        - preferred_term: response to oxidative stress
          modifier: INCREASED
          term:
            id: GO:0006979
            label: response to oxidative stress
        - preferred_term: inflammatory response
          modifier: INCREASED
          term:
            id: GO:0006954
            label: inflammatory response
        notes: The free-radical and acid chemistry is the mechanism the clinical literature names, and
          the cellular detail here comes from a sheep model at 500 ppm for 15 to 20 minutes rather than
          from molecular profiling of silo-exposed patients. The deep-research report for this entry was
          explicit on that point and no human molecular pathway is asserted.
      selected_evidence:
        snippet: Bronchoalveolar lavage fluid epithelial cell number and total protein were significantly
          increased while macrophage number was significantly decreased within the 24 h post-exposure
          period.
        supports: SUPPORT
