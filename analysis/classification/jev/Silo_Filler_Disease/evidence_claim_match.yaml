        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Gas accumulation in the freshly filled silo
        notes: Nitrogen oxides form during the first days of fermentation and collect in the silo headspace.
          A dry growing season raises plant nitrate and so increases gas production, which is why incidence
          tracks the growing conditions of a particular year.
      selected_evidence:
        snippet: A dry growing season is known to be a factor for elevating nitrate levels in corn plants
          and can result in increased NO2 production.
        supports: SUPPORT
    origin:
