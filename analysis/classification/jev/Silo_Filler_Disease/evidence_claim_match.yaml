        context: []
      assertion_type: Definition
      assertion:
        name: Clinical case definition for silo filler disease
        definition_type: CASE_DEFINITION
        description: Silo filler disease is acute pulmonary injury following inhalation of nitrogen oxides
          generated by fermenting silage in a recently filled silo. The defining features are the exposure
          setting, the characteristically delayed onset of lower respiratory injury, and the two-tier
          outcome of a transient upper respiratory syndrome in most of those exposed against pulmonary
          edema or bronchiolitis obliterans in a minority.
        scope: Disease-level clinical framing of an acute occupational inhalation injury
      selected_evidence:
        snippet: Twenty new cases of Silo filler's disease (SFD) have been collected, documenting the
          incidence and clinical features of exposure to nitrogen oxides present in freshly filled silos.
        supports: SUPPORT
    origin:
