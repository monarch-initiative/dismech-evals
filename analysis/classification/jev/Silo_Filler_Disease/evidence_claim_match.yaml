        context: []
      assertion_type: Definition
      assertion:
        name: Practical recognition of the delayed-onset window
        definition_type: DIAGNOSTIC_CRITERIA
        description: The practical diagnostic problem is that the severe injury is delayed. A worker with
          a documented silo exposure and only mild early symptoms cannot be assumed well, because free-radical
          pulmonary injury may declare itself from 3 to 30 hours afterwards and progress to acute respiratory
          distress syndrome. Recognition therefore rests on the exposure history plus an observation period
          rather than on the initial examination.
        scope: Clinical recognition and the observation window
      selected_evidence:
        snippet: The most common presenting feature was dyspnea.
        supports: SUPPORT
    origin:
