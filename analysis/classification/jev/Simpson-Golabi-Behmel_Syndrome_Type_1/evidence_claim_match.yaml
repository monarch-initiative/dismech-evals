      - /disease_term
    evidence_metadata:
      reference: PMID:39158128
      reference_title: 'Phenotypic spectrum and tumor risk in Simpson-Golabi-Behmel syndrome: Case series
        and comprehensive literature review.'
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      explanation: Nisbet et al. reviewed published patients with molecularly confirmed SGBS, which they
        describe as caused by pathogenic GPC3 variants, and excluded patients clinically diagnosed with
        SGBS whose molecular finding was an isolated GPC4 or PIGA variant, so confirmation here means
        GPC3. Among the tumors other than Wilms tumor and hepatoblastoma, the review lists a neuroblastoma
        (Xu et al., 2022) and an adrenal neuroblastoma, for which it cites Hughes-Benzie et al. (1992,
        1996) and Lapunzina et al. (1998). This supports neuroblastoma, including an adrenal primary,
        as a tumor reported in individual GPC3-confirmed patients. Among individual tumor types, the review
        calculates incidence only for Wilms tumor and hepatoblastoma, so for neuroblastoma it gives individual
        published cases, not a risk estimate.
