            term:
              id: MONDO:0020602
              label: Simpson-Golabi-Behmel syndrome type 1
        context: []
      assertion_type: Phenotype
      assertion:
        category: Neoplastic
        name: Neuroblastoma
        description: Neuroblastoma, including adrenal neuroblastoma, is among the embryonal tumors reported
          in SGBS1, but the evidence is individual published cases. GeneReviews lists adrenal neuroblastoma
          among the embryonal tumors for which affected individuals are at increased risk. A 2024 review
          of molecularly confirmed patients lists neuroblastoma, including an adrenal neuroblastoma, among
          the tumors other than Wilms tumor and hepatoblastoma reported in the literature; it estimates
          incidence only for Wilms tumor and hepatoblastoma and gives no neuroblastoma-specific rate.
          A 2024 AACR surveillance update, which shares authors with that review and is not independent
          of it, reports tumor types other than hepatoblastoma and Wilms tumor in <1% of the 189 reported
          SGBS cases; it does not name neuroblastoma, so this bounds it only by inference.
        phenotype_term:
          preferred_term: Neuroblastoma
          term:
            id: HP:0003006
            label: Neuroblastoma
        frequency: VERY_RARE
        notes: 'No causal edge points here: the Persistence of Embryonal Progenitor Tissue node is described
          through nephrogenic rests and hepatic progenitors, and the GeneReviews sentence cited on it
          lists adrenal neuroblastoma only as a tumor of increased risk, so no cited source links that
          node, or GPC3 loss, to neuroblastoma by mechanism.'
      selected_evidence:
        snippet: In addition to the cases of Wilms tumor and hepatoblastoma, eight other cases of tumors
          were identified from the literature in patients with molecularly confirmed SGBS. These included
          pancreatoblastoma (Hasan et al., 2024), neuroblastoma (Xu et al., 2022), an unspecified leukemia
          (Cottereau et al., 2013), medulloblastoma (Thomas et al., 2012), ovarian tumor (Gurrieri et
          al., 2011), acute lymphoblastic leukemia (Sakazume et al., 2007), pancreatic carcinoma (Rodriguez-Criado
          et al., 2005), and an adrenal neuroblastoma which was initially reported as a Wilms tumor (Hughes-Benzie
          et al., 1992; Hughes-Benzie et al., 1996; Lapunzina et al., 1998).
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /phenotypes/12
      evidence_path: /phenotypes/12/evidence/0
      context_paths:
