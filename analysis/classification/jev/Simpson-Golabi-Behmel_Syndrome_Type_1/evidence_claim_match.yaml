            term:
              id: MONDO:0020602
              label: Simpson-Golabi-Behmel syndrome type 1
        context: []
      assertion_type: Genetic
      assertion:
        name: GPC3
        gene_term:
          preferred_term: GPC3
          term:
            id: hgnc:4451
            label: GPC3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Hemizygous loss of function variants and deletions of GPC3 at Xq26 cause Simpson-Golabi-Behmel
          syndrome type 1.
        notes: 'The allelic spectrum is broad and skewed toward gross lesions: point mutations, single
          and multi exon deletions, whole gene deletions, and X;autosome translocation breakpoints have
          all been reported. Contiguous deletions may extend into the neighbouring GPC4. Quantitatively,
          large deletions are the commonest single class at 34.9%, ahead of frameshift (24.4%) and nonsense
          (16.3%) variants, which is the numeric form of the skew described above and the reason dosage
          analysis belongs in the diagnostic strategy rather than after it. A nosological note for whoever
          revisits this entry: the clinical utility gene card argues that SGBS type 2 does not exist as
          an entity, the cases so designated being PIGA-related disease, and concludes that speaking of
          type 1 is therefore no longer justified. This entry keeps the type 1 name because that is the
          MONDO term it binds, not because the two-type division is endorsed. Germline mosaicism has been
          reported in this syndrome (Li et al., PMID:17850639), which is why an apparently de novo variant
          does not reduce recurrence risk to background. That report is cited here in prose rather than
          as an evidence item because its PubMed record carries no abstract text, so no exact quote can
          be verified against the cache.'
      selected_evidence:
        snippet: GPC3 encodes a putative extracellular proteoglycan, glypican 3, that is inferred to play
          an important role in growth control in embryonic mesodermal tissues in which it is selectively
          expressed.
        supports: SUPPORT
