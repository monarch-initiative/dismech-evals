        description: 'The principal differential: the other major overgrowth syndrome with embryonal tumor
          risk, macroglossia, visceromegaly, and neonatal hypoglycemia. The clinical resemblance is close
          enough that it drove the original hypothesis that glypican-3 acts on IGF2, since Beckwith-Wiedemann
          involves biallelic IGF2 expression.'
        distinguishing_features:
        - X-linked inheritance with affected males favors Simpson-Golabi-Behmel syndrome; 11p15 imprinting
          disruption favors Beckwith-Wiedemann syndrome.
        - Coarse facial features, postaxial polydactyly, and supernumerary nipples favor Simpson-Golabi-Behmel
          syndrome.
        - Hemihyperplasia and omphalocele are more characteristic of Beckwith-Wiedemann syndrome.
      selected_evidence:
        snippet: The clinical features of SGBS are very similar to the more extensively studied Beckwith-Wiedemann
          syndrome (BWS).
