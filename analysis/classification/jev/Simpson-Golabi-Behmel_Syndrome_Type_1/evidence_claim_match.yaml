    evidence_metadata:
      reference: PMID:39320341
      reference_title: Update on Surveillance for Wilms Tumor and Hepatoblastoma in Beckwith-Wiedemann
        Syndrome and Other Predisposition Syndromes.
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      explanation: The 2024 AACR surveillance update reports that, of 189 reported cases of SGBS, hepatoblastoma
        (HB) and Wilms tumor (WT) were the most frequent tumor types (5.1% each) and other tumor types
        were observed in <1% of cases. It names no other tumor type, so the bound covers neuroblastoma
        only by inference, and it does not say whether the neuroblastoma and the adrenal neuroblastoma
        listed in the Nisbet et al. review count as one tumor type or two. Under either reading neuroblastoma
        falls below 5%, the VERY_RARE band. The update's Wilms tumor and hepatoblastoma figures match
        those of the Nisbet et al. review cited above, and the two share authors (Kalish and Klein), so
        the update is not an independent estimate. It is a share of reported cases, not a population rate.
