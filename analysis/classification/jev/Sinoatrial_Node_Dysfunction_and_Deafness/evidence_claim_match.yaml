              label: sinoatrial node dysfunction and deafness
        context: []
      assertion_type: Treatment
      assertion:
        name: G-Protein-Gated Potassium (IKACh) Channel Inhibition
        description: 'An experimental, mechanism-directed strategy that does not replace the lost Cav1.3
          current but removes an opposing hyperpolarizing current. Genetic or pharmacological ablation
          of the acetylcholine-activated inward-rectifier potassium current IKACh, for example with the
          GIRK pore blocker tertiapin-Q, rescues pacemaker activity in Cav1.3-null mice. This is preclinical
          only: no human SANDD trial exists, and the concept is included to record the therapeutic hypothesis
          attached to the mechanism, not to recommend treatment. Note the contrast with the dominant CACNA1D
          gain-of-function disorders, where Cav1.3 blockade is the rational strategy; blocking an already
          non-conducting channel would be pointless in SANDD.'
        therapeutic_modality: SMALL_MOLECULE
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: This new concept of 'compensatory' ion channel targeting shines new light on the principles
          underlying the pacemaker mechanism and may open the way to new therapies for SSS.
        supports: SUPPORT
