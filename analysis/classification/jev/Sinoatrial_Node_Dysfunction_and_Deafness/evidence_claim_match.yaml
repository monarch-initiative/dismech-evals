  123de381c26f9a659c5f9f2626b1b774e344ae99df04c6c552fa538e73a6cf97:
    claim:
      about:
        disease:
          name: Sinoatrial Node Dysfunction and Deafness
          disease_term:
            preferred_term: sinoatrial node dysfunction and deafness
            term:
              id: MONDO:0013960
              label: sinoatrial node dysfunction and deafness
        context: []
      assertion_type: Genetic
      assertion:
        name: CACNA1D
        notes: 'CACNA1D (3p21.1) encodes the pore-forming alpha-1D subunit of the Cav1.3 L-type voltage-gated
          calcium channel. Cav1.3 differs from its close paralogue Cav1.2 in activating at unusually negative
          membrane potentials and inactivating slowly, which is what makes it suitable both for contributing
          inward current during sinoatrial diastolic depolarization and for sustaining graded transmitter
          release at the cochlear inner hair cell ribbon synapse. Two SANDD alleles are published: the
          founder in-frame insertion c.1208_1209insGGG, p.(Gly403_Val404insGly) (also written p.Gly403dup),
          which places an extra glycine in the alternatively spliced IS6 region near the channel pore
          and yields channels that reach the plasma membrane but conduct no calcium current; and the missense
          c.1127C>T, p.(Ala376Val). ClinVar classifications and gnomAD allele counts were not verified
          for this entry and should be checked against a specified transcript before downstream use.

          ALLELIC SERIES. The same locus produces mechanistically opposite dominant disorders. De novo
          heterozygous GAIN-of-function variants at Gly403 and Ile770 cause a syndrome of primary aldosteronism
          with seizures and neurologic abnormalities (PASNA), and further de novo gain-of-function variants
          are found in autism spectrum disorder; a heterozygous isoform-dependent p.Arg930His variant
          produces familial sinus node dysfunction with idiopathic epilepsy and ADHD. That the recessive
          SANDD glycine insertion and the dominant PASNA substitutions both fall at Gly403 makes CACNA1D
          an unusually clean natural experiment in channel loss-of-function versus gain-of-function.'
        gene_term:
          preferred_term: CACNA1D
          term:
            id: hgnc:1391
            label: CACNA1D
        relationship_type: CAUSATIVE
      selected_evidence:
        snippet: The insertion of a glycine residue in a highly conserved, alternatively spliced region
          near the channel pore resulted in nonconducting calcium channels that had abnormal voltage-dependent
          gating.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
