      assertion:
        name: Autosomal Recessive
        description: SANDD is inherited in an autosomal recessive manner. All reported families are consanguineous
          Pakistani pedigrees in which affected individuals are homozygous for a CACNA1D loss-of-function
          allele; heterozygous carriers, including the obligate-carrier parents, are clinically unaffected
          with respect to both hearing and heart rate. Four of the five families in the replication cohort
          share a 1.03 Mb haplotype around the founder p.Gly403_Val404insGly allele, indicating a common
          distant ancestor. Carrier couples face the standard 25% per-pregnancy recurrence risk.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
