        description: Lightheadedness and dizziness reported by affected individuals, occurring alongside
          episodic syncope in the setting of bradycardia. It is attributed to low cardiac output and cerebral
          hypoperfusion rather than to vestibular disease, since vestibular function is specifically documented
          as normal in the same individuals.
        phenotype_term:
          preferred_term: Presyncope
          term:
            id: HP:0031972
