    claim:
      about:
        disease:
          name: Sinoatrial Node Dysfunction and Deafness
          disease_term:
            preferred_term: sinoatrial node dysfunction and deafness
            term:
              id: MONDO:0013960
              label: sinoatrial node dysfunction and deafness
        context:
        - path: /treatments/3
          value:
            name: G-Protein-Gated Potassium (IKACh) Channel Inhibition
            description: 'An experimental, mechanism-directed strategy that does not replace the lost
              Cav1.3 current but removes an opposing hyperpolarizing current. Genetic or pharmacological
              ablation of the acetylcholine-activated inward-rectifier potassium current IKACh, for example
              with the GIRK pore blocker tertiapin-Q, rescues pacemaker activity in Cav1.3-null mice.
              This is preclinical only: no human SANDD trial exists, and the concept is included to record
              the therapeutic hypothesis attached to the mechanism, not to recommend treatment. Note the
              contrast with the dominant CACNA1D gain-of-function disorders, where Cav1.3 blockade is
              the rational strategy; blocking an already non-conducting channel would be pointless in
              SANDD.'
            therapeutic_modality: SMALL_MOLECULE
            action_category: THERAPEUTIC
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Sinoatrial Node Pacemaker Dysfunction
        treatment_effect: INHIBITS
        description: Blocking the opposing IKACh current shifts the net balance of sinoatrial currents
          toward depolarization, partially compensating for the absent Cav1.3 inward current.
      selected_evidence:
        snippet: Work in our laboratory shows that targeting G protein-gated K+ (IKACh ) channels effectively
          rescues SSS of Cav 1.3-/- mice.
        supports: SUPPORT
