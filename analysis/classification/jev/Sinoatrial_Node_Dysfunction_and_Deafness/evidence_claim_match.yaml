      assertion_type: Diagnosis
      assertion:
        name: Electrocardiography and ambulatory (Holter) rhythm monitoring
        description: 'A resting 12-lead ECG establishes the sinoatrial abnormality: a slow but regular
          rhythm with a narrow QRS complex, P waves that do not regularly precede the QRS, and a normal
          QT interval (which is what separates SANDD at the bedside from Jervell and Lange-Nielsen syndrome).
          Ambulatory Holter recording quantifies the mean and minimum rate and captures pauses; Holter
          tracings from genotyped SANDD homozygotes are published. Exercise testing is used to demonstrate
          chronotropic incompetence when exertional symptoms are present.'
        presence: Resting bradycardia with sinoatrial node dysfunction was present in every affected individual
          across the reported families, so a normal resting ECG argues strongly against the diagnosis
          in a congenitally deaf proband.
        diagnosis_term:
          preferred_term: electrocardiography
          term:
            id: NCIT:C38053
            label: Electrocardiography
      selected_evidence:
        snippet: All deaf subjects showed pronounced SAN dysfunction at rest.
