      assertion_type: Diagnosis
      assertion:
        name: CACNA1D molecular genetic testing
        description: 'Molecular confirmation requires two pathogenic CACNA1D loss-of-function alleles
          in trans in an individual with a compatible phenotype. In families of Khyber Pakhtunkhwa origin,
          targeted testing for the founder p.(Gly403_Val404insGly) allele is the efficient first step;
          otherwise CACNA1D sequencing, a combined hearing-loss/arrhythmia panel, or exome sequencing
          is appropriate. Parental testing confirms phase and segregation. Interpretation must be direction-aware:
          heterozygous CACNA1D variants, particularly gain-of-function ones, cause mechanistically distinct
          dominant disorders and do not establish SANDD.'
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: We studied five Pakistani families with SANDD and characterized a new missense variant
          p.(A376V) in CACNA1D in one family, and further characterized the founder variant p.(G403_V404insG)
          in four additional pedigrees.
        supports: SUPPORT
