        frequency: OCCASIONAL
        notes: Term choice is deliberate. HPO has no free-standing "dizziness" term at this level of granularity;
          the obvious candidate, HP:0002321 Vertigo, is `is_a` HP:0001751 Abnormal vestibular function
          and would therefore assert exactly the vestibular involvement that the source explicitly excludes
          and that this entry's `gap_sandd_vestibular_sparing` discussion treats as an open question.
          HP:0031972 Presyncope is `is_a` HP:0011025 Abnormal cardiovascular system physiology and is
          defined as "a state of lightheadedness, muscular weakness, blurred vision, and feeling faint",
          "most often cardiovascular in cause", which matches the mechanism curated here. The sources
          say "dizziness" rather than "presyncope", so the mapping evidence is graded PARTIAL.
      selected_evidence:
        snippet: There were no obvious signs of vestibular dysfunction, but he did report the symptoms
          of fatigue, dizziness, and dyspnea.
