      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cav1_3_two_tissue_divergence
        hypothesis_label: Single-Channel Two-Tissue Divergence Model
        status: CANONICAL
        description: 'One Cav1.3 loss-of-function lesion produces two clinically unrelated manifestations
          because the same low-voltage-activated, slowly inactivating L-type calcium channel performs
          two non-redundant jobs in two tissues: contributing inward current to diastolic depolarization
          in sinoatrial node pacemaker cells (yielding bradycardia and sinoatrial node dysfunction), and
          supplying the presynaptic calcium influx that triggers graded glutamate release at the cochlear
          inner hair cell ribbon synapse (yielding congenital deafness). Neither job can be taken over
          by the co-expressed Cav1.2 channel, whose more depolarized activation threshold is unsuitable
          for either. The human phenotype closely recapitulates the Cacna1d-null mouse, which supports
          the model rather than a species-specific mechanism.'
      selected_evidence:
        snippet: Ca(v)1.3 voltage-gated L-type calcium channels (LTCCs) translate sound-induced depolarization
          into neurotransmitter release in auditory hair cells and control diastolic depolarization in
          the mouse sinoatrial node (SAN).
        supports: SUPPORT
