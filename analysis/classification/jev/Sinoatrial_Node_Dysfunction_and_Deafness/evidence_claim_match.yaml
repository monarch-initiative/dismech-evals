        description: Homozygous CACNA1D loss-of-function variants abolish conduction through the Cav1.3
          L-type voltage-gated calcium channel. The founder allele inserts an extra glycine into a highly
          conserved, alternatively spliced segment near the channel pore and yields channels that reach
          the membrane but do not conduct calcium and show abnormal voltage-dependent gating. Because
          Cav1.3 is the low-voltage-activated, slowly inactivating member of the L-type family, its loss
          cannot be compensated by the co-expressed Cav1.2 channel in either of the two tissues that depend
          on it.
