          name: Sinonasal Undifferentiated Carcinoma
          disease_term:
            preferred_term: sinonasal undifferentiated carcinoma
            term:
              id: MONDO:0006411
              label: sinonasal undifferentiated carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cooperating Tumor Suppressor Loss
        biological_scale: MOLECULAR
        conforms_to: evading_growth_suppressors#Tumor Suppressor Inactivation
        description: IDH2 mutation alone is not sufficient. Within IDH2-mutant SNUC, co-occurring TP53
          mutation and CDKN2A/2B loss-of-function alterations are each present in roughly a third to two
          fifths of cases, disabling the p53 and RB antiproliferative axes. IDH2-wild-type tumors reach
          a comparable end by a different route, through SMARCA4 loss-of-function with confirmed loss
          of protein expression, NOTCH1 gain-of-function, or TET2 loss-of-function.
        cell_types:
        - preferred_term: sinonasal epithelial cell
          term:
            id: CL:0000066
            label: epithelial cell
        biological_processes:
        - preferred_term: signal transduction by p53 class mediator
          modifier: DECREASED
          term:
            id: GO:0072331
            label: signal transduction by p53 class mediator
        - preferred_term: chromatin remodeling
          modifier: DECREASED
          term:
            id: GO:0006338
            label: chromatin remodeling
      selected_evidence:
        snippet: Alterations in the IDH2-wild-type sinonasal undifferentiated carcinomas included SMARCA4
          loss-of-function with confirmed loss of immunohistochemical expression, NOTCH1 gain-of-function,
          and TET2 loss-of-function.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28084339
      reference_title: Recurrent IDH2 R172X mutations in sinonasal undifferentiated carcinoma.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the alternative, IDH2-wild-type route to loss of growth suppression through
        SWI/SNF (SMARCA4) and TET2 inactivation.
