      assertion:
        name: Undifferentiated High-Grade Proliferation
        biological_scale: CELLULAR
        description: 'The resulting tumor cell is undifferentiated and highly proliferative: cohesive
          nests, ribbons, and trabeculae of cells with hyperchromatic nuclei and a high nuclear-to-cytoplasmic
          ratio, a brisk mitotic rate, tumor necrosis, and vascular invasion. The absence of squamous
          or glandular differentiation is definitional and is what historically made SNUC a diagnosis
          of exclusion.'
        cell_types:
        - preferred_term: sinonasal epithelial cell
          term:
            id: CL:0000066
