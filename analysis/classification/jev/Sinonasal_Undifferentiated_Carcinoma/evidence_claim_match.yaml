    claim:
      about:
        disease:
          name: Sinonasal Undifferentiated Carcinoma
          disease_term:
            preferred_term: sinonasal undifferentiated carcinoma
            term:
              id: MONDO:0006411
              label: sinonasal undifferentiated carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: IDH2 R172 Neomorphic Hotspot Mutation
        genetic_context:
          variant_origin: SOMATIC
        biological_scale: MOLECULAR
        description: A somatic hotspot substitution at IDH2 residue R172 (R172S, R172T, R172M, and related
          variants) converts isocitrate dehydrogenase 2 into a neomorphic enzyme. This is the single most
          frequent recurrent alteration in SNUC, detected in 55% of cases in one targeted-sequencing series
          and in 82.4% in another, and it is essentially absent from the other head and neck tumor types
          tested. Mutant-specific IDH1/2 immunohistochemistry tracks the mutation, making it a practical
          diagnostic surrogate.
        cell_types:
        - preferred_term: sinonasal epithelial cell
          term:
            id: CL:0000066
            label: epithelial cell
        locations:
        - preferred_term: paranasal sinus
          term:
            id: UBERON:0001825
            label: paranasal sinus
        molecular_functions:
        - preferred_term: isocitrate dehydrogenase (NADP+) activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0004450
            label: isocitrate dehydrogenase (NADP+) activity
      selected_evidence:
        snippet: We identified IDH2 R172X mutations in 55% of sinonasal undifferentiated carcinomas including
          R172S, R172T, and R172M.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
