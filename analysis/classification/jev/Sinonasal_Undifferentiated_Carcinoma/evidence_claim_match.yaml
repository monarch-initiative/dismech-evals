          disease_term:
            preferred_term: sinonasal undifferentiated carcinoma
            term:
              id: MONDO:0006411
              label: sinonasal undifferentiated carcinoma
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: SMARCB1 (INI-1)-Deficient Sinonasal Carcinoma
        description: A separately recognized sinonasal entity defined by loss of SMARCB1/INI-1, historically
          diagnosed as SNUC before INI-1 immunohistochemistry became routine. It is IDH2-wild-type, forms
          its own DNA-methylation class, and carries a worse prognosis and higher locoregional recurrence
          rate than SNUC, so the distinction changes prognostic counselling rather than being purely academic.
        distinguishing_features:
        - Loss of SMARCB1/INI-1 nuclear expression by immunohistochemistry
        - IDH2 R172 wild type
        - Separate DNA-methylation class
        notes: MONDO has no class for SMARCB1 (INI-1)-deficient sinonasal carcinoma, so this differential
          carries no disease_term. MONDO:0100534 is the renal medullary SMARCB1-deficient carcinoma and
          is a different entity.
      selected_evidence:
        snippet: Notably, all studied cases lacked oncogenic IDH2 mutations characteristic of genuine
          SNUC.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/1
      context_paths:
