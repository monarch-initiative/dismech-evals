      reference_title: 'Proceedings of the North American Society of Head and Neck Pathology, Los Angeles,
        CA, March 20, 2022: SWI/SNF-deficient Sinonasal Neoplasms: An Overview'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Confirms the genotypic separation this differential rests on: the SWI/SNF-deficient
        sinonasal carcinomas are IDH2-wild-type, so the IDH2 R172 hotspot discriminates them from SNUC
