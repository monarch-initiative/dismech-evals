  bdd66795984d3938841b3f28e9f0e7e79e980fdf02de55b189756bae63bc0848:
    claim:
      about:
        disease:
          name: Sinonasal Undifferentiated Carcinoma
          disease_term:
            preferred_term: sinonasal undifferentiated carcinoma
            term:
              id: MONDO:0006411
              label: sinonasal undifferentiated carcinoma
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Mutant-Specific IDH1/2 Immunohistochemistry
        description: 'Multispecific mutant IDH1/2 immunohistochemistry detects the R132/R172 mutant protein
          product. It is a rule-in test rather than a rule-out one: in the largest cohort staining was
          absent in all 132 histologic mimics (specificity 100%) but positive in only 26 of 53 SNUCs (49%),
          because the antibody does not recognise the full range of IDH alleles. A negative stain therefore
          does not exclude an IDH2-mutant SNUC and sequencing remains necessary to rule the diagnosis
          out.'
        diagnosis_term:
          preferred_term: diagnostic procedure
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        notes: 'The allele dependence is what limits sensitivity rather than assay quality: in the same
          cohort every strongly staining case carried IDH2 R172S/G, the weakly staining cases all carried
          R172T, and sequencing of IHC-negative cases still recovered an IDH2 R172T and an IDH1 R132C.
          The two positive series are consistent once read this way, and the earlier 3/3-positive report
          is a small-sample view of the strongly staining alleles.'
      selected_evidence:
        snippet: 'Multispecific mutant IDH1/2 immunohistochemistry was performed and identified mutant-specific
          protein expression in all cases with available tissue: 3/3 sinonasal undifferentiated carcinomas
          with R172 mutations were positive and 4/4 wild-type cases were negative.'
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28084339
      reference_title: Recurrent IDH2 R172X mutations in sinonasal undifferentiated carcinoma.
