      assertion_type: Pathophysiology
      assertion:
        name: DNA and Histone Hypermethylator Phenotype
        biological_scale: MOLECULAR
        description: 'Mutant IDH2 induces a global hypermethylator state: genome-wide DNA methylation
          profiling separates IDH2-mutant sinonasal tumors into a single cluster irrespective of histologic
          type, and the tumors show increased repressive H3K27 trimethylation relative to IDH2-wild-type
          tumors. This epigenetic reprogramming, rather than a proliferative signaling lesion, is the
          proximate consequence of the driver mutation.'
        cell_types:
        - preferred_term: sinonasal epithelial cell
          term:
            id: CL:0000066
            label: epithelial cell
        biological_processes:
        - preferred_term: negative regulation of gene expression via chromosomal CpG island methylation
          modifier: INCREASED
          term:
            id: GO:0044027
            label: negative regulation of gene expression via chromosomal CpG island methylation
      selected_evidence:
        snippet: IDH2 mutations in sinonasal carcinomas induce a hypermethylator phenotype and define
          a molecular subgroup of tumors arising in this location.
        supports: SUPPORT
