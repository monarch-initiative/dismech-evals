  7502d9b96e2368b0bec6c85a7e34545290b8f7df4a3ad9276f5ed710a70a2a26:
    claim:
      about:
        disease:
          name: Sjogren's Syndrome
          disease_term:
            preferred_term: Sjogren syndrome
            term:
              id: MONDO:0010030
              label: Sjogren syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Salivary Gland JAK-STAT Activation and ISG Upregulation
        description: Salivary gland epithelial cells and immune cells in Sjögren's disease exhibit cell
          type-specific upregulation of interferon-stimulated genes (ISGs) and aberrant activation of
          the JAK-STAT signaling pathway, correlating with clinical severity indicators including focus
          score and anti-SSA seropositivity. JAK inhibition normalises this signalling, establishing the
          IFN-JAK-STAT axis as a primary pathogenic driver and therapeutic target.
        cell_types:
        - preferred_term: Salivary Gland Epithelial Cell
          term:
            id: CL:0000066
            label: epithelial cell
        biological_processes:
        - preferred_term: JAK-STAT Signaling Cascade
          term:
            id: GO:0007259
            label: cell surface receptor signaling pathway via JAK-STAT
      selected_evidence:
        snippet: SjD patients' tissues exhibit increased expression of ISGs and activation of the JAK-STAT
          pathway in a cell type-dependent manner. JAKi normalises this aberrant signalling at the tissue
