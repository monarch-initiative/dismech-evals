      assertion_type: Pathophysiology
      assertion:
        name: WDR26 Haploinsufficiency
        biological_scale: MOLECULAR
        description: Heterozygous nonsense, frameshift and splice-site variants, and 1q42.12 microdeletions,
          reduce the functional dosage of WDR26. Loss-of-function single-nucleotide variants trigger nonsense-mediated
          decay, reducing WDR26 RNA and protein levels; missense variants localise to highly conserved
          residues of the WD40-repeat protein. The single-gene dosage reduction is the core lesion.
        genes:
        - preferred_term: WDR26
          term:
            id: hgnc:21208
            label: WDR26
      selected_evidence:
        snippet: WDR26 loss-of-function single-nucleotide mutations identified in these subjects lead
          to nonsense-mediated decay with subsequent reduction of RNA expression and protein levels.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
