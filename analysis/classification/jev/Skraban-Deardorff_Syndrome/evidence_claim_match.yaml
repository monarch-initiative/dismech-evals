            label: ubiquitin-protein transferase activity
          modifier: DECREASED
      selected_evidence:
        snippet: WDR26 serves as a structural scaffold for the CTLH E3 complex, facilitating the assembly
          of large, hollow, supramolecular CTLH E3 assemblies
