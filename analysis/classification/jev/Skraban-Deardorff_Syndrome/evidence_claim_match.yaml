      reference: PMID:28686853
      reference_title: WDR26 Haploinsufficiency Causes a Recognizable Syndrome of Intellectual Disability,
        Seizures, Abnormal Gait, and Distinctive Facial Features.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that disease-associated LOF variants reduce WDR26 RNA and protein, the
