            name: RUNX1T1 Stabilization
            biological_scale: MOLECULAR
            mechanism_confidence: PROVISIONAL
            description: In Wdr26+/- mice and Wdr26-knockdown neuronal cells, reduced CTLH-mediated ubiquitination
              impairs proteasomal degradation of RUNX1T1 and stabilises the protein. RUNX1T1 is a transcriptional
              coactivator critical for neuronal differentiation. This stabilisation is demonstrated in
              mouse and cell models and has not yet been confirmed in human patient tissue, so the node
              is curated at provisional confidence.
            biological_processes:
            - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
              term:
                id: GO:0043161
                label: proteasome-mediated ubiquitin-dependent protein catabolic process
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Neuronal Differentiation Dysregulation
        causal_link_type: DIRECT
        description: Stabilised RUNX1T1 raises MAP2, a regulator of dendritic architecture and synaptic
          plasticity, dysregulating neuronal differentiation.
      selected_evidence:
        snippet: consequently disrupting the level of microtubule-associated protein 2 (MAP2), a key regulator
          of dendritic architecture and synaptic plasticity.
        supports: SUPPORT
