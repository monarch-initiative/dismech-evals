          checkpoint blockade, including T-cell exclusion (the "immune desert" phenotype of neuroendocrine-high
          tumors), downregulation of the MHC class I antigen processing and presentation machinery, and
          upregulation of macrophage inhibitory checkpoints.
        biological_processes:
        - preferred_term: antigen processing and presentation via MHC class I
          modifier: DECREASED
          term:
            id: GO:0002474
            label: antigen processing and presentation of peptide antigen via MHC class I
        - preferred_term: negative regulation of T cell mediated immunity
          modifier: INCREASED
          term:
            id: GO:0002710
            label: negative regulation of T cell mediated immunity
      selected_evidence:
        snippet: Several immune evasive mechanisms have been shown to be prominently altered in human
          SCLC, including T-cell exclusion, downregulation of components of the MHC class I antigen processing
          and presentation machinery
        supports: SUPPORT
