      assertion_type: Pathophysiology
      assertion:
        name: Lineage Transcription Factor Subtypes and State Plasticity
        description: 'SCLC is a transcriptionally heterogeneous disease that is subclassified by lineage-defining
          transcription factors (ASCL1/SCLC-A, NEUROD1/SCLC-N, POU2F3/SCLC-P, YAP1/SCLC-Y) plus an inflamed
          subtype (SCLC-I). Subtype identity is largely epigenetically rather than mutationally determined:
          the SWI/SNF ATPase SMARCA4 binds ASCL1 and NEUROD1 loci to maintain the neuroendocrine program,
          and tumors show plasticity toward low-neuroendocrine states during progression or acquired chemoresistance.'
        biological_processes:
        - preferred_term: chromatin remodeling
          modifier: ABNORMAL
          term:
            id: GO:0006338
            label: chromatin remodeling
        - preferred_term: neuron differentiation
          modifier: ABNORMAL
          term:
            id: GO:0030182
            label: neuron differentiation
      selected_evidence:
        snippet: distinct molecular subtypes driven by lineage-defining transcription factors, including
          ASCL1, NEUROD1, POU2F3, and YAP1, as well as an inflamed subtype (SCLC-I)
        supports: SUPPORT
