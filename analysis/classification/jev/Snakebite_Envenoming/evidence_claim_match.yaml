      assertion_type: Subtype
      assertion:
        name: Neurotoxic snakebite envenoming
        description: Envenoming dominated by presynaptic beta-neurotoxins (such as phospholipase A2 complexes)
          or postsynaptic alpha-neurotoxins that block neuromuscular transmission, producing cranial nerve
          palsy, descending flaccid paralysis, and respiratory failure.
      selected_evidence:
        snippet: In cases of neurotoxic envenoming, patients with neurological manifestations are monitored
          by serial general physical and neurological examination with special attention to cranial nerve
          function, airway, respiration, and bedside measures, such as Peak Expiratory Flow Rate (PEFR)
          and blood oxygen saturation (SpO2).
        supports: SUPPORT
