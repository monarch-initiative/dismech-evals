        description: Presynaptic phospholipase A2 beta-neurotoxins (such as Mojave toxin) trigger intracellular
          Ca2+ and arachidonic acid cascades, endoplasmic reticulum stress, and neurotransmitter overload
          in excitatory synapses, leading to presynaptic blockade of nerve signals that is relatively
          refractory to antivenom and anticholinesterase reversal once established.
        cell_types:
        - preferred_term: motor neuron
