            preferred_term: Snakebite envenoming
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Presynaptic phospholipase A2 neurotoxin blockade
        description: Presynaptic phospholipase A2 beta-neurotoxins (such as Mojave toxin) trigger intracellular
          Ca2+ and arachidonic acid cascades, endoplasmic reticulum stress, and neurotransmitter overload
          in excitatory synapses, leading to presynaptic blockade of nerve signals that is relatively
          refractory to antivenom and anticholinesterase reversal once established.
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        locations:
        - preferred_term: skeletal muscle tissue
          term:
            id: UBERON:0001134
            label: skeletal muscle tissue
        biological_processes:
        - preferred_term: neuromuscular synaptic transmission
          term:
            id: GO:0007274
            label: neuromuscular synaptic transmission
          modifier: DECREASED
      selected_evidence:
        snippet: The MTX, which is composed of heterodimers of basic and acidic phospholipase-A2, co-opts
          the host arachidonic acid and Ca2+ second messenger mechanisms and triggers multiple signaling
          cascades, such as the activation of MAPKs and NF-κB-regulated proinflammatory genes; the neurotransmitter
          overload in excitatory synapses leading to a presynaptic blockade of nerve signals; and the
          upregulation of unfolded protein response (UPR) due to the depletion of Ca2+ from the endoplasmic
          reticulum.
        supports: SUPPORT
    origin:
