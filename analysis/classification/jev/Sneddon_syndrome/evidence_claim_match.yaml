      assertion_type: Genetic
      assertion:
        name: NOTCH3
        relationship_type: UNKNOWN
        gene_term:
          preferred_term: NOTCH3
          term:
            id: hgnc:7883
            label: NOTCH3
        notes: 'A homozygous NOTCH3 nonsense variant, p.(Arg735Ter), was identified by exome sequencing
          in two affected siblings of one consanguineous family with childhood-onset Sneddon syndrome.
          Graded UNKNOWN rather than CAUSATIVE: CAUSATIVE asserts the ClinGen Definitive or Strong tier,
          and one consanguineous family with no ClinGen curation for this gene-disease pair does not reach
          it. The schema offers no Limited or Moderate tier, so UNKNOWN - not yet classified - is the
          value that fits. Dominant NOTCH3 variants cause CADASIL, a different small-vessel disease of
          the brain. In the same study, exome sequencing of six further unrelated Sneddon patients found
          no rare variant in NOTCH3 or in ADA2, which is the direct evidence that neither gene accounts
          for most cases.'
      selected_evidence:
        snippet: We performed whole-exome sequencing (WES) in 2 affected siblings of a consanguineous
          family with childhood-onset stroke and identified a homozygous nonsense mutation within the
          epidermal growth factor repeat (EGFr) 19 of NOTCH3, p.(Arg735Ter).
        supports: SUPPORT
