            term:
              id: MONDO:0008436
              label: Sneddon syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Monogenic Endothelial and Mural Cell Injury
        description: Sneddon syndrome is a clinically defined, etiologically heterogeneous syndrome, and
          a minority of cases have an identified monogenic cause acting on the small-vessel wall. Biallelic
          loss-of-function ADA2 variants (the disorder named deficiency of adenosine deaminase 2, curated
          separately in this knowledge base) produce compromised endothelial integrity with endothelial
          activation and inflammation. A homozygous NOTCH3 nonsense variant was reported in one consanguineous
          family with childhood-onset Sneddon syndrome; NOTCH3 acts in the mural cells of small vessels.
          Both converge on the occlusive small- and medium-vessel arteriopathy that defines the syndrome.
          Most patients referred with Sneddon syndrome carry neither lesion.
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: Notch signaling pathway
          term:
            id: GO:0007219
            label: Notch signaling pathway
          modifier: DECREASED
        genes:
        - preferred_term: ADA2
          term:
            id: hgnc:1839
            label: ADA2
        - preferred_term: NOTCH3
          term:
            id: hgnc:7883
            label: NOTCH3
      selected_evidence:
        snippet: Skin, liver, and brain biopsies revealed vasculopathic changes characterized by compromised
          endothelial integrity, endothelial cellular activation, and inflammation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24552284
      reference_title: Early-onset stroke and vasculopathy associated with mutations in ADA2.
