  303948c1269d5c07551f2f2fd409e1ef369db10da410f741ec4fd8f641f349cb:
    claim:
      about:
        disease:
          name: Sneddon syndrome
          disease_term:
            preferred_term: Sneddon syndrome
            term:
              id: MONDO:0008436
              label: Sneddon syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: ADA2
        relationship_type: UNKNOWN
        gene_term:
          preferred_term: ADA2
          term:
            id: hgnc:1839
            label: ADA2
        notes: 'Graded UNKNOWN, which needs explaining, because the underlying biology is not uncertain
          at all. Biallelic loss-of-function ADA2 variants cause deficiency of adenosine deaminase 2 (DADA2)
          - ClinGen Definitive - and DADA2 is curated in this knowledge base as its own entry (MONDO:0014306).
          What is unclassified is the relationship between ADA2 and *this* disease term. CAUSATIVE asserts
          the ClinGen Definitive or Strong tier for the gene-disease pair the entry denotes, and no panel
          has curated ADA2 against Sneddon syndrome; the Definitive call belongs to the other term. Grading
          this CAUSATIVE would have the entry assert in a controlled field the exact claim the rest of
          this note withdraws. ADA2 is recorded here because a minority of patients carrying the Sneddon
          syndrome diagnosis prove on testing to have DADA2: in the only series that genotyped an adult
          Sneddon-spectrum cohort, 6 of the 32 genotyped patients were biallelic. Plasma ADA2 activity
          separated the two groups with 100% sensitivity and specificity in that series, so in current
          practice DADA2 is the diagnosis that testing establishes rather than a subtype of Sneddon syndrome.
          Note the naming history: ADA2 was formerly CECR1, which is the symbol used throughout the 2014-2018
          literature quoted below.'
      selected_evidence:
        snippet: 'A total of 73 participants were included in the study: 26 patients with PSnS with no
          CECR1 mutation (PSnS), 6 bi-allelic (DADA2 patients) and 7 HHZ CECR1 mutations and 34 HC.'
        supports: SUPPORT
    origin:
