      assertion_type: DifferentialDiagnosis
      assertion:
        name: Sifrim-Hitz-Weiss syndrome
        description: CHD4-related NuRDopathy (Sifrim-Hitz-Weiss syndrome) shares macrocephaly, intellectual
          disability, hypotonia, and overlapping facial dysmorphism with Snijders Blok-Campeau syndrome,
          but is distinguished by higher rates of congenital heart defects, skeletal anomalies, and deafness/hearing
          loss, whereas CHD3 variants more characteristically feature childhood apraxia of speech and
          inguinal hernias.
        disease_term:
          preferred_term: Sifrim-Hitz-Weiss syndrome
          term:
            id: MONDO:0014946
            label: Sifrim-Hitz-Weiss syndrome
        distinguishing_features:
        - CHD4 pathogenic variants rather than CHD3 variants on molecular genetic testing
        - Higher prevalence of skeletal anomalies, hearing loss, and cardiac defects in CHD4-related disorder
          versus speech apraxia and inguinal hernia in CHD3-related disorder
      selected_evidence:
        snippet: In addition to macrocephaly and intellectual disability, CHD3 variants are associated
          with inguinal hernias and apraxia of speech; whereas CHD4 variants are associated with skeletal
          anomalies, deafness, and cardiac defects. GATAD2B-associated neurodevelopmental disorder (GAND)
          has phenotypic overlap with both of these disorders.
        supports: SUPPORT
