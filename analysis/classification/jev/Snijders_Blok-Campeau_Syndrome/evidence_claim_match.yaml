              label: Snijders Blok-Campeau syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted NuRD-dependent cortical layer specification
        description: 'The Mi-2/NuRD (Nucleosome Remodeling and Deacetylase) complex couples ATP-dependent
          chromatin remodeling (via mutually exclusive CHD3, CHD4, or CHD5 subunits) with histone deacetylation
          (via HDAC1/2). During mouse cortical development a sequential subunit switch assigns non-redundant
          developmental roles: CHD4 drives early progenitor proliferation, CHD5 facilitates radial neuronal
          migration, and CHD3 is specifically required for proper cortical layer specification. Inhibition
          of any one CHD cannot be rescued by overexpression of another, indicating CHD3''s role in the
          NuRD complex is irreplaceable. Loss of CHD3 catalytic function in NuRD therefore disturbs late
          transcriptional programs governing layer identity and post-mitotic neuronal differentiation,
          providing a mechanistic substrate for the intellectual disability, speech/language impairment,
          and structural cortical findings observed in SNIBCPS. Together with CHD4 (Sifrim-Hitz-Weiss)
          and GATAD2B (GAND) disorders, SNIBCPS belongs to a "NuRDopathy" class of macrocephaly-associated
          neurodevelopmental disorders sharing intellectual disability, hypotonia and overlapping facial
          features.'
        gene:
          preferred_term: CHD3
          term:
            id: hgnc:1918
            label: CHD3
          modifier: ABNORMAL
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        - preferred_term: cortical projection neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: chromatin remodeling
          term:
            id: GO:0006338
            label: chromatin remodeling
          modifier: DYSREGULATED
        - preferred_term: cerebral cortex development
          term:
            id: GO:0021987
            label: cerebral cortex development
          modifier: ABNORMAL
        - preferred_term: nervous system development
          term:
            id: GO:0007399
            label: nervous system development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Chromatin remodeling is of crucial importance during brain development. Pathogenic alterations
          of several chromatin remodeling ATPases have been implicated in neurodevelopmental disorders.
        supports: SUPPORT
