              label: syndromic X-linked intellectual disability Snyder type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: srs_respiratory_mechanism_gap
        prompt: How does SMS deficiency contribute to airway abnormalities and aspiration associated with
          recurrent respiratory infections in the NIH SRS sibship?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Recurrent respiratory infections
        rationale: Respiratory infections were reported in the NIH p.Gln148Arg sibship, distinct from
          the p.Gly203Asp digestive sibship. Patient II-1 had tracheomalacia, upper airway obstruction,
          increased secretions and frequent aspiration alongside pulmonary infections from infancy; his
          brother had laryngomalacia and tracheobronchomalacia with repeated Pseudomonas infections. Airway
          dysfunction and aspiration therefore provide a clinical candidate route. The source does not
          establish an immune defect or demonstrate a causal chain from SMS-related neuronal dysfunction
          or hypotonia to those airway findings. The gap concerns that upstream link and the relative
          contributions of airway obstruction and aspiration, so no additional causal edge is asserted.
      selected_evidence:
        snippet: 'Patient II-1 had tracheomalacia, upper airway obstruc-

          tion, increased respiratory secretions, frequent aspira-

          tions, and pulmonary infections from infancy.'
        supports: SUPPORT
