      assertion_type: Pathophysiology
      assertion:
        name: Loss of Polyamine-Dependent Ion Channel Modulation
        description: 'Spermine is the dominant endogenous polycation that blocks and gates inward-rectifier
          potassium channels and modulates glutamate receptors, so spermine depletion removes a physiological
          control on excitable membranes. This was the mechanism originally proposed to connect the polyamine
          defect to the cognitive phenotype of SRS, and in the spermine synthase-deficient Gy mouse the
          loss of the endocochlear potential and of vestibular function is attributed to defective polyamine
          regulation of Kir channels. Note that the direct human evidence is inferential rather than electrophysiological.

          '
        biological_scale: MOLECULAR
        role: intermediate
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        molecular_functions:
        - preferred_term: inward rectifier potassium channel activity
          term:
            id: GO:0005242
            label: inward rectifier potassium channel activity
          modifier: DYSREGULATED
        chemical_entities:
        - preferred_term: spermine
          term:
            id: CHEBI:15746
            label: spermine
          modifier: DECREASED
      selected_evidence:
        snippet: polyamines were able to block or modulate several distinct types of cation channels,
          including inward-rectifier K+ channels and glutamate receptors
        supports: SUPPORT
