              defects and synaptic and retinal degeneration, and the G56S SRS mouse shows impaired learning,
              increased anxiety, reduced mobility and reduced total and regional brain volumes. Together
              these establish a neuronal substrate for the intellectual disability, seizures and gait
              abnormality of SRS, though the human evidence remains largely clinical rather than histological.

              '
