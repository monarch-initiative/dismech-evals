      assertion_type: Pathophysiology
      assertion:
        name: Spermine Synthase Loss of Function
        description: 'Hemizygous loss-of-function variants in SMS reduce or abolish spermine synthase
          catalytic activity. Spermine synthase acts only as a homodimer and transfers an aminopropyl
          group from decarboxylated S-adenosylmethionine to spermidine to make spermine. Most pathogenic
          variants are hypomorphic missense changes; several act by destabilising the protein or abolishing
          homodimer formation rather than by disrupting the active site, and a rare complete loss-of-function
          frameshift allele produces a severe early-lethal phenotype.

          '
        biological_scale: MOLECULAR
        role: trigger
        genes:
        - preferred_term: SMS
          term:
