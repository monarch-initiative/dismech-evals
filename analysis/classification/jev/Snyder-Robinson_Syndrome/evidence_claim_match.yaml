      assertion:
        discussion_id: srs_severe_allele_multisystem_gap
        prompt: Are the digestive, pancreatic and growth manifestations of severe Snyder-Robinson syndrome
          direct tissue consequences of the polyamine imbalance, and through what mechanism?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Jejunal stenosis
        - phenotypes#Exocrine pancreatic insufficiency
        - phenotypes#Failure to thrive
        rationale: The digestive phenotypes rest on a single sibship carrying a severe allele, and the
          reporting authors themselves frame them as a possible expansion of the phenotype. Failure to
          thrive was attributed clinically to the dysfunctional gastrointestinal system in that family
          and is reproduced in the G56S mouse, but the cited human report does not establish an intestinal
          or pancreatic mechanism connecting SMS deficiency to these findings, so no causal edge is asserted.
      selected_evidence:
        snippet: One of the brothers presented with gastrointestinal symptoms, with jejunal stenosis,
          enteral feeding intolerance, failure to thrive due to a dysfunctional gastrointestinal system,
          cholestasis and exocrine pancreatic insufficiency.
        supports: SUPPORT
