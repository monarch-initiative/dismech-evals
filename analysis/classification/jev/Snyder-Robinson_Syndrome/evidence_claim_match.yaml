  c80749b40f54df3ef67ecf118e5f74ef7441b7d10e0a3a6c00a54f3315d2ef55:
    claim:
      about:
        disease:
          name: Snyder-Robinson Syndrome
          disease_term:
            preferred_term: Snyder-Robinson syndrome
            term:
              id: MONDO:0010664
              label: syndromic X-linked intellectual disability Snyder type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuronal and Synaptic Dysfunction
        description: 'Polyamines are required locally within neurons for chromatin, translational and
          channel-modulatory functions. Loss of spermine synthase in Drosophila causes survival defects
          and synaptic and retinal degeneration, and the G56S SRS mouse shows impaired learning, increased
          anxiety, reduced mobility and reduced total and regional brain volumes. Together these establish
