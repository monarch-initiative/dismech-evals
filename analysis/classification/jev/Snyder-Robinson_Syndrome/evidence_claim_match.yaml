          marrow stromal cells failed to mineralise on osteogenic differentiation. Silencing SMS in human
          MSCs reproduces the defect in vitro and in vivo, and in the SMS G56S mouse dynamic histomorphometry
          identifies a reduced bone formation rate as the main cause of the low bone mass. Excess spermidine
          is itself sufficient to suppress mineralisation, and inhibiting the upstream enzyme ornithine
          decarboxylase with DFMO rescues it.

          '
