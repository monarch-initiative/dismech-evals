            id: GO:0005829
            label: cytosol
        chemical_entities:
        - preferred_term: decarboxylated S-adenosylmethionine
          term:
            id: CHEBI:57443
            label: S-adenosylmethioninaminium
      selected_evidence:
        snippet: We report the first polyamine deficiency syndrome caused by a defect in spermine synthase
