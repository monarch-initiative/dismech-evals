            term:
              id: MONDO:0010664
              label: syndromic X-linked intellectual disability Snyder type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: srs_renal_mechanism_gap
        prompt: By what mechanism does spermine synthase deficiency produce the nephrocalcinosis and renal
          cysts reported in Snyder-Robinson syndrome?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Nephrocalcinosis
        - phenotypes#Renal cyst
        rationale: The NIH report documents renal tubular acidosis (RTA) and nephrocalcinosis in both
          brothers with the SMS p.Gln148Arg variant. RTA was explicitly proximal in patient II-1, who
          also had nephrolithiasis at age six; patient II-3 had nephrocalcinosis at age one and RTA diagnosed
          by age two. Both had carbonate apatite and calcium oxalate stones. The authors also associate
          the documented hypercalciuria with nephrocalcinosis. Thus tubular acid-base dysfunction and
          calcium handling are observed candidate contributors, rather than an absence of any renal account.
          Their causal relationship to SMS deficiency, contribution relative to medications or supplementation,
          and relevance to other families remain unresolved. These observations do not explain the renal
          cysts. No renal causal edge is asserted on this clinical association alone.
      selected_evidence:
        snippet: 'At 6 years, he developed proximal renal

          tubular acidosis (RTA), nephrocalcinosis and nephro-

          lithiasis. His renal stones were composed of carbonate

          apatite and calcium oxalate.'
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25888122
      reference_title: Impaired osteoblast and osteoclast function characterize the osteoporosis of Snyder
        - Robinson syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents proximal RTA, nephrocalcinosis, nephrolithiasis and stone composition in
        patient II-1; co-occurrence does not prove the direction of causation.
