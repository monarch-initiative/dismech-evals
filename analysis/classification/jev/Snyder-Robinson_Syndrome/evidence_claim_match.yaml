        context: []
      assertion_type: Treatment
      assertion:
        name: Difluoromethylornithine (DFMO, eflornithine) — investigational
        description: 'DFMO, an FDA-approved ornithine decarboxylase inhibitor, rebalances the spermidine:spermine
          ratio in SRS patient cells by reducing spermidine biosynthesis, stimulating residual conversion
          of spermidine to spermine in hypomorphic cells, and inducing uptake of exogenous spermine. It
          extends lifespan in the Drosophila SRS model and rescues the mineralisation defect of polyamine-loaded
          human stromal cells. This is preclinical only; DFMO is profoundly toxic in the spermine synthase-deficient
          Gy mouse, which suffers catastrophic loss of motor function and death within days, so translation
          requires caution.

          '
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: eflornithine (DFMO)
            term:
              id: CHEBI:41948
              label: eflornithine
      selected_evidence:
        snippet: Here we report the repurposing of 2-difluoromethylornithine (DFMO), an FDA-approved inhibitor
          of polyamine biosynthesis, in rebalancing spermidine:spermine ratios in SRS patient cells.
        supports: SUPPORT
