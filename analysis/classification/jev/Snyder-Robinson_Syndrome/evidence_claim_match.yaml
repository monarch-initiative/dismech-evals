        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
      selected_evidence:
        snippet: In the Drosophila SRS model, altered spermidine/spermine balance has been associated
          with increased generation of ROS and aldehydes, consistent with elevated spermidine catabolism.
          These toxic byproducts cause mitochondrial and lysosomal dysfunction, which are also observed
          in cells from SRS patients.
        supports: SUPPORT
