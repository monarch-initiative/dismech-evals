  058d089aa78d05db3f600e3d78c74f02c6d23a463bf22c19e3e07489b8e1e962:
    claim:
      about:
        disease:
          name: Solitary Fibrous Tumor
          disease_term:
            preferred_term: solitary fibrous tumor
            term:
              id: MONDO:0016238
              label: solitary fibrous tumor
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant EGR1-Target Transactivation
        description: Native NAB2 represses EGR1 (EGR-1) target genes. The NAB2-STAT6 fusion replaces the
          NAB2 repressor activity with the STAT6 transactivation domain, so EGR1-target genes are aberrantly
          activated. STAT6 accumulates in the nucleus (the basis of the diagnostic nuclear STAT6 immunostain).
          Upregulation of EGR1 and its proliferation-associated target IGF2 drives p-Rb/cyclin D1 and
          enhanced proliferation.
        biological_processes:
        - preferred_term: regulation of DNA-templated transcription
          modifier: INCREASED
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
        - preferred_term: positive regulation of transcription by RNA polymerase II
          modifier: INCREASED
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
        gene_products:
        - preferred_term: Signal Transducer and Activator of Transcription 6
          term:
            id: NCIT:C28670
            label: Signal Transducer and Activator of Transcription 6
      selected_evidence:
        snippet: we found that EGR-1 and the proliferation-related EGR-1 target gene IGF2 were upregulated
          in NIH-3T3 cells transfected with NAB2-STAT6.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
