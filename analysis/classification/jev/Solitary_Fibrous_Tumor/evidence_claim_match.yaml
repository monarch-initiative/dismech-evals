              label: solitary fibrous tumor
        context: []
      assertion_type: Subtype
      assertion:
        name: Malignant SFT
        display_name: Malignant / Dedifferentiated Solitary Fibrous Tumor
        description: A higher-grade form defined by high mitotic activity, large size, necrosis, and/or
          hypercellularity, frequently with additional TP53 and TERT-promoter alterations and loss of
          APAF1. Dedifferentiated SFT shows abrupt transition to a high-grade, often anaplastic sarcoma
          and behaves aggressively with high rates of metastasis. Antiangiogenic therapy is favored for
          advanced non-dedifferentiated disease.
      selected_evidence:
        snippet: a TERT promoter mutation was detected in 7/73 (10%) cases, and it showed a significant
          association with malignant SFTs
        supports: SUPPORT
    origin:
