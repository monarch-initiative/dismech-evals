              label: solitary fibrous tumor
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Paraneoplastic Big-IGF-II Secretion (Doege-Potter Syndrome)
        description: A subset of SFTs secretes incompletely processed insulin-like growth factor II ("Big-IGF-II"),
          a precursor of IGF-II. This prohormone aberrantly activates insulin/IGF receptors, inhibiting
          gluconeogenesis and stimulating glucose uptake, producing recurrent non-islet-cell tumor hypoglycemia
          known as Doege-Potter syndrome. EGR1-driven IGF2 upregulation downstream of NAB2-STAT6 provides
          a mechanistic link to the tumor's IGF-II production.
        biological_processes:
        - preferred_term: insulin-like growth factor receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0048009
            label: insulin-like growth factor receptor signaling pathway
        - preferred_term: gluconeogenesis
          modifier: DECREASED
          term:
            id: GO:0006094
            label: gluconeogenesis
        gene_products:
        - preferred_term: Insulin-Like Growth Factor II
          term:
            id: NCIT:C16744
            label: Insulin-Like Growth Factor II
      selected_evidence:
        snippet: Hypoglycemia can be attributed to paraneoplastic secretion of "Big-IGF-II," a precursor
          of Insulin-like growth factor-II.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38441351
      reference_title: 'Effective management of recurrent Doege-Potter syndrome with somatostatin-analogues:
        A case report.'
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      explanation: Establishes Big-IGF-II secretion as the mechanism of Doege-Potter syndrome in SFT.
