        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NAB2-STAT6 Fusion Oncogene
        genetic_context:
          variant_origin: SOMATIC
        description: A recurrent intrachromosomal rearrangement on chromosome 12q13 fuses the NAB2 gene
          to STAT6. NAB2-STAT6 is the defining molecular feature of SFT, identified by whole-exome sequencing
          across the SFT spectrum (including tumors formerly called hemangiopericytoma). The chimeric
          product joins the truncated repressor domain of NAB2 to the intact transactivation domain of
          STAT6.
        genes:
        - preferred_term: NAB2
          term:
            id: hgnc:7627
            label: NAB2
        - preferred_term: STAT6
          term:
            id: hgnc:11368
            label: STAT6
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        gene_products:
        - preferred_term: NAB2-STAT6 fusion protein
          term:
            id: NCIT:C122820
            label: NAB2/STAT6 Fusion Protein
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
      selected_evidence:
        snippet: Analysis in 53 tumors confirmed the presence of 7 variants of this fusion transcript
          in 29 tumors (55%), representing a lower bound for fusion frequency at this locus and suggesting
          that the NAB2-STAT6 fusion is a distinct molecular feature of SFTs.
        supports: SUPPORT
