              label: neuronopathy, distal hereditary motor, autosomal recessive 8
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Sord knockout Sprague Dawley rat
        species: Rat
        genotype: Sord-/- (CRISPR knockout, Sprague Dawley background)
        background: Sprague Dawley
        publication: PMID:38538210
        description: The best-characterised mammalian model. Sorbitol is raised in serum, CSF and peripheral
          nerve; motor performance and gait decline from about seven months; tibial motor conduction slows;
          and nerve histology shows degenerating and de/remyelinated axons with enlarged "ballooned" myelin
          sheaths, affecting motor axons while largely sparing sensory ones.
        modeled_mechanisms:
        - target: Distal Motor Axonal Degeneration and Demyelination
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Reproduces the motor-over-sensory selectivity of the human lesion at the level
            of nerve pathology and conduction.
          limitations: Histology was assessed at advanced ages and electrophysiology was not followed
            longitudinally, so the model speaks to the established lesion rather than to its earliest
            steps.
          readouts:
          - name: Tibial motor nerve conduction velocity
            target: Distal Motor Axonal Degeneration and Demyelination
            direction: DECREASED
            interpretation: Physiological correlate of motor axonal degeneration in the model.
          - name: Serum neurofilament light chain
            target: Distal Motor Axonal Degeneration and Demyelination
            direction: INCREASED
            interpretation: Fluid biomarker of ongoing axonal degeneration in the model.
        - target: Polyol Pathway Block with Sorbitol Accumulation
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Establishes that sorbitol accumulates in the nervous-system compartments that patient
            serum measurements cannot reach.
          limitations: Rodent sugar handling and laboratory diet differ from the human setting, which
            is the same variable invoked to explain why one mouse model fails.
          readouts:
          - name: Sorbitol concentration in serum, CSF and peripheral nerve
            target: Polyol Pathway Block with Sorbitol Accumulation
            direction: INCREASED
            interpretation: Compartment-resolved confirmation of the metabolic block.
      selected_evidence:
        snippet: Therefore, we have generated a Sord knockout (KO), Sord-/-, Sprague Dawley rat, to model
          the human disease and to investigate the pathophysiology underlying SORD deficiency.
        supports: SUPPORT
    origin:
