  09e0ff1e88288716aa0b4f5a96750333e58c61d0166bd62acc2b3988b7754134:
    claim:
      about:
        disease:
          name: Sorbitol Dehydrogenase Deficiency
          disease_term:
            preferred_term: sorbitol dehydrogenase deficiency with peripheral neuropathy
            term:
              id: MONDO:0030055
              label: neuronopathy, distal hereditary motor, autosomal recessive 8
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: interpretation_cmt2_dhmn_split
        kind: INTERPRETATION
        status: OPEN
        prompt: Should SORD deficiency be curated as one disease spanning CMT2 and dHMN, as it is here,
          or split along the clinical labels its patients receive?
        attaches_to:
        - pathophysiology#Motor-Predominant Hereditary Neuropathy Spanning CMT2 and dHMN
        rationale: Cohorts assign the same genotype to different labels in different proportions - roughly
          two-thirds CMT2 in the largest multicentre series, but a dHMN majority in the French and Swiss
          cohort - and a third label, intermediate CMT, is used for patients whose conduction velocities
          fall in between. The labels track how much sensory involvement was found and how velocities
          were interpreted, not genotype, mechanism, or the allele carried. Splitting would therefore
          produce entries that differ in ascertainment rather than in biology. MONDO indexes the disease
          under the dHMN branch (MONDO:0030055, is_a neuronopathy, distal hereditary motor, autosomal
          recessive), which this entry follows for its disease_term while recording the CMT2 presentation
          as the same disease.
      selected_evidence:
        snippet: Two-thirds of cases were diagnosed with CMT2 while one-third had distal hereditary motor
          neuropathy.
        supports: SUPPORT
