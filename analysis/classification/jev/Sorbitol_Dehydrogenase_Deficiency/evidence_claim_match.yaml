              label: neuronopathy, distal hereditary motor, autosomal recessive 8
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: redox_cofactor_imbalance_model
        hypothesis_label: NADPH and NAD+ cofactor imbalance
        status: EMERGING
        description: Flux through the polyol pathway consumes NADPH at the aldose reductase step and regenerates
          NAD+ at the SORD step. Losing SORD leaves the reductive step running without its oxidative partner,
          depleting NADPH - and with it the glutathione-based antioxidant capacity - while NAD+ is not
          regenerated. This is a well-developed idea in the diabetic-neuropathy literature, but in SORD
          deficiency it is named as a plausible candidate rather than measured, which is why it is EMERGING
          and carries no node of its own.
      selected_evidence:
        snippet: one or more of the known effects of decreased SORD activity, including increased sorbitol
          level, cellular osmolarity, oxidative stress and decreased NADPH levels, are plausible
        supports: SUPPORT
