          disease_term:
            preferred_term: sorbitol dehydrogenase deficiency with peripheral neuropathy
            term:
              id: MONDO:0030055
              label: neuronopathy, distal hereditary motor, autosomal recessive 8
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: 'Disease requires biallelic SORD loss-of-function variants - homozygosity for the
          recurrent c.757delG frameshift allele, compound heterozygosity for that allele with a second
          variant, or (increasingly recognised) a SORD/SORD2P inversion in trans. Heterozygous carriers
          have reduced SORD protein but are unaffected. Just over half of probands are sporadic with neither
          a family history nor reported consanguinity, but consanguinity is not negligible: 18% of the
          largest cohort had consanguineous parents.'
      selected_evidence:
        snippet: We identified 45 individuals from 38 families across multiple ancestries carrying the
          nonsense c.757delG (p.Ala253GlnfsTer27) variant in SORD, in either a homozygous or compound
          heterozygous state.
        supports: SUPPORT
