  12e300c1a42d85275bd409b843826f1bfec33c20523623f83aef45ef03b3b423:
    claim:
      about:
        disease:
          name: Sorbitol Dehydrogenase Deficiency
          disease_term:
            preferred_term: sorbitol dehydrogenase deficiency with peripheral neuropathy
            term:
              id: MONDO:0030055
              label: neuronopathy, distal hereditary motor, autosomal recessive 8
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_sorbitol_to_axon_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what route does trapped intracellular sorbitol kill long motor axons - osmotic stress,
          oxidative stress, NADPH/NAD+ cofactor imbalance, or some combination - and why are motor axons
          affected while sensory axons are largely spared?
        attaches_to:
        - pathophysiology#Polyol Pathway Block with Sorbitol Accumulation
        - pathophysiology#Osmotic Stress in Schwann Cells and Myelinated Axons
        - pathophysiology#Mitochondrial Dysfunction and Oxidative Stress
        - pathophysiology#Distal Motor Axonal Degeneration and Demyelination
        rationale: 'The genotype-to-metabolite half of the mechanism is settled, and the metabolite-to-axon
          half is not. The candidates are curated as competing mechanistic_hypotheses rather than argued
          in prose here: osmotic_myelin_injury_model (CANONICAL), mitochondrial_oxidative_model (ALTERNATIVE)
          and redox_cofactor_imbalance_model (EMERGING), with the first two carried on tagged causal edges
          out of the accumulation node. This discussion records what would settle between them. The discovery
          authors listed osmotic stress, oxidative stress and reduced NADPH as plausible and did not choose
          between them, and the govorestat study restated that the mechanisms of sorbitol-induced degeneration
          are not fully elucidated. The gap matters therapeutically as well as descriptively: substrate
          reduction works upstream of whichever route is correct, so it can succeed without settling the
          question, but any attempt to protect the axon downstream needs the answer. The motor-over-sensory
          selectivity is a second, related unknown - sorbitol accumulates systemically, yet the lesion
          is selective, and the ballooned myelin seen in the rat points at Schwann cells as at least a
          co-target.'
        proposed_experiments:
        - experiment_id: exp_osmotic_vs_oxidative_rat_nerve
          name: Compartment-resolved osmotic versus oxidative dissection in Sord-null rat nerve
          description: In Sord-/- rat sciatic and tibial nerve, measure Schwann cell and axonal water
            content and organic-osmolyte composition alongside oxidative-damage markers and NADPH/NADP+
            and NAD+/NADH ratios, at ages before and after the onset of conduction slowing, and test whether
            an antioxidant that does not lower sorbitol prevents the lesion. A dissociation between sorbitol
            lowering and antioxidant protection would separate the osmotic and oxidative arms.
        - experiment_id: exp_motor_vs_sensory_isogenic_ipsc
          name: Motor versus sensory neuron comparison in isogenic human cultures
          description: Differentiate isogenic patient and gene-corrected iPSC lines into motor and sensory
            neurons in microfluidic axon-compartment devices, and compare sorbitol handling, axonal transport,
            bioenergetics and axon survival between the two lineages under matched glucose. This tests
            whether the selectivity is cell-intrinsic or requires the Schwann cell.
      selected_evidence:
        snippet: The underlying mechanisms of sorbitol-induced degeneration have not been fully elucidated
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
