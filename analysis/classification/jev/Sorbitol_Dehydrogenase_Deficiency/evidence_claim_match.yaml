              label: neuronopathy, distal hereditary motor, autosomal recessive 8
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular testing of SORD with pseudogene-aware methods
        description: Confirmatory testing is molecular, but standard short-read exome or CMT panel sequencing
          is not sufficient on its own. SORD2P shares near-identical sequence with SORD and carries the
          c.757delG position on most control chromosomes, so reads mismap and biallelic variants cannot
          be phased. Long-read sequencing resolves the two loci and phases the alleles, and it is the
          only route that detects the recurrent SORD/SORD2P inversion - which accounts for most cases
          in which short-read testing finds just one pathogenic variant. A patient with a single detected
          variant and a compatible phenotype is therefore not excluded, and the biochemical markers curated
          above are the practical way to adjudicate such a case.
      selected_evidence:
        snippet: Subsequent Oxford Nanopore Tech (ONT) long-read sequencing was used to successfully differentiate
          SORD from the highly homologous non-functional SORD2P pseudogene and confirmed that the mutations
          were biallelic through haplotype-resolved analysis.
        supports: SUPPORT
