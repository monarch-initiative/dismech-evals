      assertion:
        category: Neurologic
        name: Retained or Brisk Upper Limb and Patellar Reflexes
        description: 'The counter-intuitive half of the reflex picture, and a diagnostic clue: in a disease
          whose lesion is a distal motor axonopathy, reflexes above the ankle are frequently preserved
          and may be frankly brisk. The reporting authors read the retained or brisk pattern as suggesting
          subclinical central involvement, a hypothesis rather than a demonstrated finding - imaging showed
          no relevant change - so this record asserts the reflex observation and not the CNS interpretation.
          No frequency is given: the source counts "retained or even increased" together, so the fraction
          that is actually hyperreflexic cannot be separated out, and the ontology term names only the
          brisk end.'
        phenotype_term:
          preferred_term: Hyperreflexia
          term:
            id: HP:0001347
            label: Hyperreflexia
      selected_evidence:
        snippet: Upper limb and patellar reflexes may be retained or even brisk, suggesting the presence
          of a possible subclinical involvement of the CNS, as also observed in other axonal CMT subtypes
        supports: SUPPORT
