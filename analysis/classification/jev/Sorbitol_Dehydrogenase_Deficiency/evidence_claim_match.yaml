  e701d73900dd484293c5068a6bc2a74550ca7581b02a86d3276e6c1c6809c322:
    claim:
      about:
        disease:
          name: Sorbitol Dehydrogenase Deficiency
          disease_term:
            preferred_term: sorbitol dehydrogenase deficiency with peripheral neuropathy
            term:
              id: MONDO:0030055
              label: neuronopathy, distal hereditary motor, autosomal recessive 8
        context: []
      assertion_type: Genetic
      assertion:
        name: SORD
        gene_term:
          preferred_term: SORD
          term:
            id: hgnc:11184
            label: SORD
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        association: SORD (15q21.1) encodes the 357-residue cytosolic NAD+-dependent sorbitol dehydrogenase.
          Biallelic loss-of-function is necessary and sufficient for disease. Molecular diagnosis is complicated
          by SORD2P, a highly homologous non-functional pseudogene in which the recurrent c.757delG position
          is fixed on most control chromosomes, so short-read data mismap and biallelic status is hard
          to phase; long-read sequencing resolves both problems, and a recurrent SORD/SORD2P inversion
          is only detectable that way.
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        case_fractions:
        - population: German neuromuscular centre cohort of 166 patients with genetically unexplained
            axonal neuropathy
          case_fraction_percent: 3.0
          cohort_size: 166
          notes: Yield of SORD screening among unsolved predominantly axonal CMT/dHMN cases, not a share
            of a SORD-diagnosed cohort.
        - population: Chinese hereditary neuropathy cohort, undiagnosed subset
          case_fraction_percent: 6.4
          cohort_size: 78
          notes: Five of 78 patients remaining undiagnosed after PMP22 duplication and panel testing carried
            biallelic SORD variants.
        notes: The discovery paper's abstract numbers the recurrent frameshift c.757delG while its main
          text writes c.753delG; an author correction was published (PMID:32457452). c.757delG (p.Ala253GlnfsTer27)
          is the designation used by every subsequent cohort and is what this entry records.
      selected_evidence:
        snippet: SORD has a non-functional highly homologous paralogue, the pseudogene SORD2P, which is
          thought to have arisen from the duplication of SORD within a 0.5 Mb region on chromosome 15
        supports: SUPPORT
