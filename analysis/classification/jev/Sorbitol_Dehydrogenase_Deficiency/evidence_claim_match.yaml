        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Male sex associated with greater severity and faster decline
        notes: Sex modifies expressivity rather than causing disease. In the largest cohort men were both
          over-represented (99 of 144) and more severely affected, with a larger longitudinal change in
          dorsiflexion strength. The same direction of effect was seen in the Sord-null rat, where motor
          conduction slowing was more pronounced in males. Whether the over-representation reflects true
          sex-differential expressivity or under-recognition in women is not resolved by these data.
      selected_evidence:
        snippet: we identified 144 patients from 126 families, including 99 males (69%) and 45 females
          (31%)
        supports: SUPPORT
