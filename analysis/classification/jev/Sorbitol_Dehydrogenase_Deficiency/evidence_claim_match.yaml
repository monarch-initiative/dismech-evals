          modifier: INCREASED
      selected_evidence:
        snippet: Light and electron microscopy of the peripheral nervous system revealed degenerating
          myelinated axons, de- and remyelinated axons, and a likely pathognomonic finding-enlarged 'ballooned'
          myelin sheaths.
        supports: SUPPORT
