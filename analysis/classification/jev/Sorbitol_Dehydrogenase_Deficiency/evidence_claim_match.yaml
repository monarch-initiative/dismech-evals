  c51fd85068e593678e3a42bc444e56141f30ac18d876924581df5d54384dd2a2:
    claim:
      about:
        disease:
          name: Sorbitol Dehydrogenase Deficiency
          disease_term:
            preferred_term: sorbitol dehydrogenase deficiency with peripheral neuropathy
            term:
              id: MONDO:0030055
              label: neuronopathy, distal hereditary motor, autosomal recessive 8
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_mouse_sord_no_neuropathy
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why does a mouse with markedly reduced SORD protein develop no neuropathy and no conduction
          slowing, when biallelic SORD loss reliably causes neuropathy in humans and a motor-predominant
          neuropathy in the rat?
        attaches_to:
        - pathophysiology#Distal Motor Axonal Degeneration and Demyelination
        rationale: 'This is a mismatch rather than an absence of evidence: the C57BL/LiA mouse has been
          studied and is negative. The explanation offered - that standard mouse chow is low in sugar
          relative to human and Drosophila diets, so polyol flux never reaches the level needed to accumulate
          toxic sorbitol - is attractive because it predicts the disease is flux-dependent rather than
          purely genotype-dependent, and because SORD deficiency does aggravate neuropathy in diabetic
          rodents. It is also untested. The alternative, that the hypomorphic allele leaves enough residual
          enzyme, is not excluded. The distinction matters for interpreting every negative rodent result
          in this disease and for whether dietary sugar should be treated as a modifier in patients.'
        proposed_experiments:
        - experiment_id: exp_high_sugar_diet_hypomorphic_mouse
          name: High-sugar diet and ageing challenge in the hypomorphic mouse
          description: Maintain C57BL/LiA and control mice on standard versus high-sugar diets to old
            age, with serial motor nerve conduction, nerve histology and nerve sorbitol. Emergence of
            the lesion on the high-sugar arm alone would confirm flux dependence; its absence under both
            would point instead at residual enzyme activity or a species difference.
        - experiment_id: exp_null_vs_hypomorph_mouse
          name: Null versus hypomorph comparison
          description: Phenotype a true Sord-null mouse alongside C57BL/LiA under identical husbandry,
            measuring residual enzyme activity, nerve sorbitol and conduction. This separates allele strength
            from diet as the explanation.
      selected_evidence:
        snippet: Mice that have significantly reduced levels of SORD protein due to an intronic splicing
          mutation (C57BL/LiA mice), bred and fed according to the standard laboratory conditions, do
          not develop neuropathy or even slowed nerve conduction velocities
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32367058
      reference_title: Biallelic mutations in SORD cause a common and potentially treatable hereditary
        neuropathy with implications for diabetes.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the negative mouse result that constitutes the mismatch.
