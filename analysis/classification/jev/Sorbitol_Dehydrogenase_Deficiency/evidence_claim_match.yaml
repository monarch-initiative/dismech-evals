            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: epalrestat
            term:
              id: CHEBI:31539
              label: epalrestat
          - preferred_term: govorestat (AT-007)
        notes: Efficacy in humans is not established here. The phase 2/3 INSPIRE trial (NCT05397665) is
          recorded by its registry as completed, but no peer-reviewed report of its results was found
          in PubMed at the time of curation, so no clinical outcome is curated; company announcements
          are not used as evidence.
      selected_evidence:
        snippet: AT-007 significantly reduced sorbitol levels in patient-derived fibroblasts, induced
