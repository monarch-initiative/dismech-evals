              label: neuronopathy, distal hereditary motor, autosomal recessive 8
        context: []
      assertion_type: Treatment
      assertion:
        name: Aldose Reductase Inhibition (Investigational)
        description: 'Substrate reduction rather than enzyme replacement: inhibiting aldose reductase,
          the enzyme upstream of the block, reduces flux of glucose into sorbitol and so lowers sorbitol
          despite the missing SORD. Epalrestat and ranirestat established the principle in patient fibroblasts
          and in Drosophila; the CNS-penetrant next-generation inhibitor govorestat (AT-007) carried it
          into the clinic, lowering sorbitol in patient fibroblasts, iPSC-derived motor neurons and fly
          brain and rescuing synaptic, locomotor and mitochondrial phenotypes in flies. No aldose reductase
          inhibitor is approved for this indication, and this entry records no clinical efficacy claim:
          the evidence curated here is preclinical, and the clinical trial is listed separately under
          clinical_trials.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
