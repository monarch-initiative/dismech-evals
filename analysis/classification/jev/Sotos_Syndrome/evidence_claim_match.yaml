        description: Nsd1 knockdown in embryonic mouse cortex reduces Apc2 expression and impairs neuronal
          migration and laminar positioning; forced Apc2 expression rescues the migration defect. This
          supports an NSD1–APC2 neural pathway in a model. The reported human APC2 siblings lacked NSD1
          mutations and had a distinct recessive Sotos-like disorder, so their phenotype does not directly
          establish this mechanism in NSD1-related Sotos syndrome.
