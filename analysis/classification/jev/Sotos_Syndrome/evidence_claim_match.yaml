      assertion_type: EpidemiologyInfo
      assertion:
        name: Ancestry-Dependent Lesion-Class Distribution
        description: 'The proportion of Sotos syndrome caused by the 5q35 microdeletion rather than an
          intragenic variant differs markedly by population. In the Japanese referral series 52% of patients
          had a microdeletion against 6% of non-Japanese patients, and a Korean series found 53% of NSD1-positive
          patients had a deletion. This matters operationally: a diagnostic strategy that sequences NSD1
          without a copy-number assay will miss most cases in these populations. The authors of the Japanese
          series were careful to note that patient-selection bias may contribute, since the flanking low-copy
          repeats mediating the deletion are present in different populations.'
      selected_evidence:
        snippet: 'A large difference in the frequency of microdeletions between Japanese and non-Japanese
          patients was noted: 49 (52%) of the 95 Japanese patients and only one (6%) of the 17 non-Japanese
          had microdeletions.'
        supports: SUPPORT
