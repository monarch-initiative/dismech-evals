        - The shared pathway means clinical overlap is expected, so molecular testing rather than phenotyping
          is the discriminator
      selected_evidence:
        snippet: TBRS shares clinical features with Sotos syndrome (which is caused by haploinsufficiency
          of NSD1, a histone methyltransferase that catalyses the dimethylation of histone H3 at K36 (H3K36me2)8,12,13),
