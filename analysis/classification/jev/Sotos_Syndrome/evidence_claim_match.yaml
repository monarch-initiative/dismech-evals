          in HEK293 cells instead increased a reporter response. The net effect is therefore not represented
          as a universal RASIP1-driven decrease across tissues.
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: In order to elucidate biological pathways explaining how NSD1 haploinsufficiency results
          in phenotypic features such as overgrowth in SoS a comprehensive study of dermal fibroblasts
          from SoS patients was performed. We obtained evidence that SoS syndrome is associated with a
          deregulation of the MAPK/ERK signaling pathway.
        supports: SUPPORT
        directness: INDIRECT
