        display_name: Intragenic NSD1 loss-of-function variant
        description: Sotos syndrome caused by a heterozygous intragenic NSD1 variant - truncating variants
          distributed throughout the gene, or missense variants confined to the functional domains. This
          is the majority class in European-ancestry cohorts, where it accounts for roughly 83% of clinically
          diagnosed individuals, and is associated with more prominent overgrowth and less severe learning
          disability than the microdeletion class.
        genes:
        - preferred_term: NSD1
          term:
            id: hgnc:14234
            label: NSD1
        subtype_frequency: ~83% of clinically diagnosed Sotos syndrome in the predominantly non-Japanese
          diagnostic series
      selected_evidence:
        snippet: Truncating NSD1 mutations occurred throughout the gene, but pathogenic missense mutations
          occurred only in functional domains (P < 2 x 10(-16)).
        supports: SUPPORT
