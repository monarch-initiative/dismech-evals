        description: 'The convergence point of both chromatin arms, and the node this entry shares with
          every other chromatinopathy. Transcriptomic profiling of Sotos patients identifies a signature
          that separates them from controls; most deregulated genes are underexpressed, and they are predominantly
          bivalent genes enriched for regulators of development and neural synapse function. The methylation
          signature points the same way: its CpG sites sit near genes for cellular morphogenesis, differentiation,
          neuronal differentiation and axonogenesis, and cell adhesion. One downstream target has been
          identified specifically - Nsd1 knockdown downregulates Apc2, a cytoskeletal regulator in neurons,
          and biallelic APC2 loss independently produces Sotos-like features in humans.'
