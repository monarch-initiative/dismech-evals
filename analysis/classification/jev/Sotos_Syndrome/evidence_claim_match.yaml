        snippet: We conducted an etiological study on two siblings with Sotos features without mutations
          in NSD1 and detected a homozygous frameshift mutation in the APC2 gene by whole-exome sequencing,
          which resulted in the loss of function of cytoskeletal regulation in neurons.
