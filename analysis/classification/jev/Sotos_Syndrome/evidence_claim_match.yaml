      assertion_type: Pathophysiology
      assertion:
        name: Genome-Wide H3K36me2 Depletion
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin
          State Imbalance
        description: 'NSD1 is a SET-domain methyltransferase that primarily dimethylates nucleosomal histone
          H3 lysine 36, and its catalytic domain carries an autoregulatory loop that normally occludes
          the substrate until the nucleosome stabilises the active conformation. Reduced NSD1 dosage therefore
          lowers H3K36me2 across the large intergenic euchromatic domains where this mark predominates.
          Because H3K36me2 is one arm of the permissive-repressive balance, its depletion is not simply
          a subtraction: at developmental enhancers the same loss permits excessive H3K27me3 and lowers
          H3K27ac. Catalysis depends on several NSD1 modules together (PHD1-4, PWWP2 and SET), which is
          why missense variants restricted to those domains behave like truncating alleles - molecular
          modelling of SET-domain substitutions shows loss of structural stability or steric clash near
          the S-adenosylmethionine binding site.'
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: NSD1 H3K36 dimethyltransferase activity
          term:
            id: GO:0140954
            label: histone H3K36 dimethyltransferase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: DYSREGULATED
      selected_evidence:
        snippet: The Sotos syndrome gene product, NSD1, is a SET domain histone methyltransferase that
          primarily dimethylates nucleosomal histone H3 lysine 36 (H3K36).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
