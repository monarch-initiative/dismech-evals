              label: Sotos syndrome
        context: []
      assertion_type: Definition
      assertion:
        name: Cardinal Clinical Triad of Sotos Syndrome
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'GeneReviews treats three features together as cardinal: the distinctive facial appearance,
          learning disability, and overgrowth of height and/or head circumference at or above 2 SD. The
          triad is a clinical-recognition construct that prompts molecular testing; it is not the diagnostic
          criterion, which is molecular. It is also not fully sensitive - a tenth of NSD1-positive individuals
          have normal height and head circumference.'
        scope: Clinical recognition prompting NSD1 molecular testing
        inclusion_criteria:
        - preferred_term: Distinctive facial appearance
          description: Broad prominent forehead with dolichocephaly, sparse frontotemporal hair, downslanting
            palpebral fissures, malar flushing, long narrow face, tall chin.
          term:
            id: HP:0001999
            label: Abnormal facial shape
        - preferred_term: Learning disability
          description: 'From early developmental delay to mild-to-severe intellectual impairment. This
            clinical-recognition criterion deliberately retains the source''s composite scope: binding
            it only to Intellectual disability would exclude developmental delay. The component phenotypes
            have separate HPO bindings; this is a composite-criterion modeling decision, not a claim that
            HPO lacks these terms.'
        - preferred_term: Overgrowth
          description: Height and/or head circumference at or above 2 SD above the mean.
          term:
            id: HP:0001548
            label: Overgrowth
      selected_evidence:
        snippet: These three clinical features (distinctive facial features, learning disability, and
          overgrowth) are considered the cardinal features of Sotos syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
      context_paths:
