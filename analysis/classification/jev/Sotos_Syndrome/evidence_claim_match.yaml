      assertion_type: Diagnosis
      assertion:
        name: NSD1 DNA Methylation Episignature Analysis
        description: Genome-wide DNA methylation profiling of peripheral blood detects a NSD1-specific
          signature of 7,085 CpG sites, almost all hypomethylated. In the defining study the signature
          classified every sample in independent validation cohorts correctly, distinguished Sotos syndrome
          from benign NSD1 variants and from the clinically overlapping Weaver syndrome, and reclassified
          NSD1 missense variants of uncertain significance in agreement with blinded expert clinical review.
          It remains an adjunct to variant interpretation, not a replacement for the molecular diagnostic
          criterion above. Long-read nanopore sequencing has since been shown to recover an equivalent
          signature, and even a single-locus mark at the NSD1 CpG island, which would let genotype and
          methylation be assessed in one assay.
        diagnosis_term:
          preferred_term: DNA methylation episignature analysis
          term:
            id: NCIT:C63328
            label: DNA Methylation Analysis
        results: A positive Sotos score supports pathogenicity of an NSD1 sequence variant and argues
          against clinically overlapping overgrowth syndromes.
      selected_evidence:
        snippet: Validation studies of independent cohorts of SS and controls assigned 100% of these samples
          correctly.
        supports: SUPPORT
