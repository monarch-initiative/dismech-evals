            description: NSD1-related autosomal dominant overgrowth syndrome with a distinctive facial
              gestalt, learning disability and advanced bone age.
            term:
              id: MONDO:0019349
              label: Sotos syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        description: Sotos syndrome is autosomal dominant. Approximately 95% of affected individuals have
          a de novo alteration and about 5% have an affected parent. Each child of an affected individual
          has a 50% chance of inheriting the alteration; severity cannot be predicted reliably across
          generations. Recurrence in clinically unaffected parents is uncommon but possible through parental
          gonadal mosaicism, and negative blood testing does not exclude that possibility. The low observed
          vertical transmission rate may partly reflect reproductive fitness, but its explanation remains
          uncertain.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        expressivity: VARIABLE
        de_novo_rate: ~95%
      selected_evidence:
        snippet: Phenotypic expression can vary from one generation to the next; thus, it is not possible
          to accurately predict phenotype based on the prenatal finding of a Sotos syndrome-related genetic
          alteration.
        supports: SUPPORT
