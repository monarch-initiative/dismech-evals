      assertion:
        name: Multisystem Surveillance and Supportive Care
        description: 'Regular general paediatric review, more frequent for younger children, those with
          many medical complications and families needing more support, and less frequent for older children
          and those with fewer complications. Two specific points sharpen this generic recommendation:
          echocardiography at diagnosis with cardiological follow-up, given the high heart-defect rate;
          and spinal surveillance weighted towards the deletion subtype, in which progressive scoliosis
          concentrates. GeneReviews also gives an explicit non-intervention rule - ventricular dilatation
          on brain MRI without raised intracranial pressure should not be treated. Neuropsychiatric evaluation
          after 12 months includes screening for sleep, attention, anxiety and autistic symptoms. Ongoing
          review includes aggression and self-injury, with pediatric psychiatric input for serious aggressive
          or destructive behavior. These GeneReviews recommendations reflect expert clinical experience
          rather than a published practice guideline.'
        treatment_term:
          preferred_term: Supportive Care
          term:
