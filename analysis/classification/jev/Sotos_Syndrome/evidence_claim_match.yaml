      assertion:
        name: Non-Allelic Homologous Recombination at 5q35 Sos-REP Low-Copy Repeats
        description: The recurrent Sotos deletion is generated by a structural-variant mechanism rather
          than by a point mutational process. Two complex mosaic low-copy repeat blocks flank NSD1 - proximal
          Sos-PREP (~390 kb) and distal Sos-DREP (~429 kb), each built from six subunits, most in inverted
