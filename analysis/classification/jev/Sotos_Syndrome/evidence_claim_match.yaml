      assertion_type: Pathophysiology
      assertion:
        name: Reduced NSD1 Tumor-Suppressor Function
        description: NSD1 loss may reduce transcriptional repression of growth-promoting targets such
          as MEIS1. NSD1 depletion and restoration alter proliferation in neuroblastoma cells; Sotos lymphoblastoid
          cells also show reduced NSD1 recruitment and increased MEIS1 expression. These experiments support
          a proposed tumor-suppressor role, but do not establish the penetrance, second-hit requirements
          or tumor spectrum of germline NSD1 haploinsufficiency. The reported H3K36/H4K20 changes in this
          older tumor study were principally trimethylation readouts, distinct from the H3K36 dimethylation
          mechanism above.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: DYSREGULATED
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: We also demonstrate that the epigenetic inactivation of NSD1 in transformed cells leads
          to the specifically diminished methylation of the histone lysine residues H4-K20 and H3-K36.
          The described phenotype is also observed in Sotos syndrome patients with NSD1 genetic disruption.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/0
      context_paths:
