  5f24c4acc487566b1fc071054b9a01a0f804e04dce51167c7f903c4bf0d1f977:
    claim:
      about:
        disease:
          name: Sotos Syndrome
          disease_term:
            preferred_term: Sotos syndrome
            description: NSD1-related autosomal dominant overgrowth syndrome with a distinctive facial
              gestalt, learning disability and advanced bone age.
            term:
              id: MONDO:0019349
              label: Sotos syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: 5q35 Microdeletion
        display_name: Recurrent 5q35 microdeletion encompassing NSD1
        description: Sotos syndrome caused by a contiguous 5q35 deletion encompassing NSD1. The recurrent
          deletion arises through non-allelic homologous recombination at flanking low-copy repeats. Frequencies
          vary between referral series and populations; Korean cohorts have reported both deletion-predominant
          and intragenic-variant-predominant distributions. Deletions are associated with less prominent
          overgrowth and more severe learning disability at group level. A scoliosis series also found
          greater progression in the deletion group. The absence of a deletion-size correlation does not
          exclude contributions from neighboring genes.
        genes:
        - preferred_term: NSD1
          term:
            id: hgnc:14234
            label: NSD1
        subtype_frequency: ~10% of clinically diagnosed Sotos syndrome in the predominantly non-Japanese
          diagnostic series; ~52% of Japanese patients in the older referral series
      selected_evidence:
        snippet: 'A large difference in the frequency of microdeletions between Japanese and non-Japanese
          patients was noted: 49 (52%) of the 95 Japanese patients and only one (6%) of the 17 non-Japanese
          had microdeletions.'
        supports: SUPPORT
    origin:
