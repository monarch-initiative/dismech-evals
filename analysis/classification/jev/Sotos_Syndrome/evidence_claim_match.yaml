        name: Hypodontia
        category: Dental
        description: Congenital absence of teeth, particularly premolars, is reported. In a dental series,
          9/13 children and adolescents lacked one or more premolars; 12/13 had an identified NSD1 mutation,
          including all nine with hypodontia. This small dental sample is not a population estimate. GeneReviews
          lists hypodontia among associated findings in the ≥2% to <15% interval; differing ascertainment
          and that interval’s overlap of frequency bands preclude a single category. Poor adult dentition
          is not evidence of congenital tooth absence.
        phenotype_term:
          preferred_term: Hypodontia
          term:
            id: HP:0000668
            label: Hypodontia
      selected_evidence:
        snippet: We investigated the dental manifestations of this disorder and found one or several premolar
          teeth were absent in 9 out of 13 (69%) affected children and adolescents. A heterozygous mutation
          in the NSD1 gene was identified in 12 patients, including all patients with hypodontia.
        supports: SUPPORT
