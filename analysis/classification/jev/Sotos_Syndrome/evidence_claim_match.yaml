        snippet: Gentling results indicated that the fetus and the patient inherited the same maternal
          chromosome 5. The heterozygous mutation of NSD1 gene c.4138delG is the pathogenic mutation of
          this Sots syndrome patient, and the mother may be germinal mosaicism.
        supports: SUPPORT
