        category: Growth
        name: Childhood Overgrowth
        description: Childhood overgrowth is defined by height and/or head circumference at least two
          standard deviations above age- and sex-matched norms. The combined endpoint occurs in about
          90% of NSD1-positive individuals; it does not establish the frequency of tall stature alone.
          Height may approach the normal range in adulthood, but the adult distribution is broad and macrocephaly
