      assertion:
        name: NSD1 Haploinsufficiency
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component
          Haploinsufficiency
        description: The initiating lesion in essentially all Sotos syndrome is loss of one functional
          copy of NSD1, reached either by an intragenic loss-of-function variant or by the 5q35 microdeletion
          above. NSD1 is a writer in the four-class scheme of the epigenetic machinery, so this node is
          the disease-specific instance of the module's dosage-sensitive component loss. Haploinsufficiency
          - rather than a dominant-negative or gain-of-function mechanism - is established both by the
          mutational spectrum (nonsense, frameshift and whole-gene deletion all producing the same syndrome)
          and by the near-exclusive association of NSD1 aberrations with the Sotos phenotype across a
          large diagnostic series.
        biological_scale: MOLECULAR
        gene:
          preferred_term: NSD1
          term:
            id: hgnc:14234
            label: NSD1
        genetic_context:
          gene:
            preferred_term: NSD1
            term:
              id: hgnc:14234
              label: NSD1
          variant_origin: GERMLINE
          allelic_events:
          - PATHOGENIC_VARIANT
          - NONSENSE_VARIANT
          - FRAMESHIFT_VARIANT
          - DELETION
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous germline NSD1 loss of function, usually de novo. The allelic events
            listed span the two curated subtypes; missense variants also occur but only within the functional
            domains.
      selected_evidence:
        snippet: We identified 1 nonsense, 3 frameshift and 20 submicroscopic deletion mutations of NSD1
          among 42 individuals with sporadic cases of Sotos syndrome. The results indicate that haploinsufficiency
          of NSD1 is the major cause of Sotos syndrome.
        supports: SUPPORT
