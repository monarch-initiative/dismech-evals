      assertion_type: Discussion
      assertion:
        discussion_id: sotos_overgrowth_mechanism_unexplained
        prompt: Does the proposed MAPK/ERK–chondrocyte maturation pathway mediate human Sotos overgrowth,
          and which NSD1-dependent changes are necessary?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Dysregulated Developmental Transcriptional Program
        - phenotypes#Childhood Overgrowth
        - phenotypes#Advanced Bone Age
        rationale: 'A source-supported provisional growth pathway is represented: altered MAPK/ERK signaling
          in patient-derived fibroblasts may affect hypertrophic chondrocyte differentiation. The study
          did not measure affected growth plates, and kinase-significance estimates depended on outlier
          exclusion. Patient blood profiling additionally identifies skeletal-development genes, but neither
          study establishes the tissue-specific mediators of statural growth or explains macrocephaly.
          The remaining gap is experimental confirmation and anatomical attribution, not absence of a
          published growth hypothesis.'
        proposed_experiments:
        - experiment_id: sotos-growth-plate-chondrocyte-model
          name: NSD1-haploinsufficient human chondrocyte and growth-plate model
          description: Differentiate isogenic NSD1+/- and corrected human iPSC lines into chondrocytes
            and cartilage organoids, and compare proliferation, hypertrophic transition timing, H3K36me2
            distribution and intergenic DNA methylation across matched differentiation stages.
          readouts:
          - name: Chondrocyte proliferative and hypertrophic-transition kinetics by NSD1 genotype
            target: phenotypes#Advanced Bone Age
          - name: H3K36me2 and CpG-methylation state at growth-regulatory loci in chondrocytes
            target: pathophysiology#Dysregulated Developmental Transcriptional Program
          decision_criterion: A reproducible genotype-dependent acceleration of hypertrophic transition,
            reversed by isogenic correction and accompanied by a chromatin change at identifiable growth-regulatory
            loci, would establish a candidate skeletal overgrowth mechanism. Normal chondrocyte behaviour
            despite the expected chromatin defect would push the explanation towards an endocrine or systemic
            route.
      selected_evidence:
        snippet: In analogy, we propose that deregulation of the MAPK/ERK pathway in SoS results in altered
          hypertrophic differentiation of NSD1 expressing chondrocytes and may be a determining factor
          in statural overgrowth and accelerated skeletal maturation in SoS.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23155469
      reference_title: Sotos syndrome is associated with deregulation of the MAPK/ERK-signaling pathway.
      evidence_source: IN_VITRO
      explanation: An explicit causal hypothesis links altered signaling to growth-plate differentiation
        and the two clinical outcomes. Patient growth plates were not studied; normal human growth plates
        established NSD1 localization.
