      assertion_type: Discussion
      assertion:
        discussion_id: sotos_episignature_causal_status
        prompt: Is the peripheral-blood DNA methylation episignature a step in the causal chain that produces
          the Sotos phenotype, or a robust biomarker of NSD1 loss measured in the wrong tissue?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Intergenic DNA Hypomethylation from Loss of DNMT3A Recruitment
        rationale: The intergenic hypomethylation node is curated as mechanism because the H3K36me2-DNMT3A
          dependency was established experimentally and the same hypomethylation is observed in patient
          tissue. But the diagnostic episignature is measured in peripheral blood, and the phenotype is
          generated in developing brain, heart and skeleton. Whether the methylation change in the relevant
          developing tissues is a cause of the transcriptional dysregulation or a parallel consequence
          of the same histone lesion is not settled by any cited study. The same open question is recorded
          at module level for the chromatinopathies generally; this entry inherits it rather than resolving
          it, and the episignature is therefore curated under `diagnosis` as a classifier rather than
          as a downstream pathophysiology node.
      selected_evidence:
        snippet: As DNAm can be tissue and cell-type specific, we tested fibroblast-derived DNA from three
          SS patients with truncating mutations in NSD1 in comparison to four control fibroblast samples.
        supports: SUPPORT
