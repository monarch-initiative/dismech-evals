      assertion_type: AnimalModel
      assertion:
        name: Nsd1 heterozygous mouse (CRISPR exon 3)
        species: Mouse
        genotype: Nsd1 heterozygous loss-of-function (CRISPR-targeted)
        description: The only reported constitutive heterozygous mouse for the Sotos gene, made to ask
          whether Nsd1 haploinsufficiency reproduces the human syndrome. Nsd1 expression in the mouse
          brain is predominantly neuronal, and the heterozygotes show behavioural changes reminiscent
          of some of the human deficits. Homozygous loss is embryonic lethal, so heterozygosity is the
          only postnatal window on this gene.
        publication: PMID:31909872
        genes:
        - preferred_term: NSD1
          term:
            id: hgnc:14234
            label: NSD1
        modeled_mechanisms:
        - target: Dysregulated Developmental Transcriptional Program
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: Halving Nsd1 dose in the mouse produces behavioural change but, on the published
            account, only a partial resemblance to the human phenotype. The model therefore supports the
            transcriptional-program node as dose-sensitive without establishing that the human syndrome
            follows from it in full.
          limitations: The published abstract claims only "behavioral characteristics reminiscent of some
            of the deficits" and reports no overgrowth or macrocephaly, which are two of the three cardinal
            human features the same abstract names. The more specific negative results attributed to this
            model in secondary summaries - absent overgrowth and macrocephaly, absent gross cortical enlargement,
            reduced SATB2-positive upper-layer neurons - come from full text that is not in the reference
            cache, so they are deliberately not curated here and the relationship is recorded as partial
            rather than as an outright failure to recapitulate.
      selected_evidence:
        snippet: In children, the three cardinal features of Sotos syndrome are a characteristic facial
          appearance, learning disability and overgrowth (height and/or head circumference > 2 SDs above
          average).
        supports: SUPPORT
