              variants distributed throughout the gene, or missense variants confined to the functional
              domains. This is the majority class in European-ancestry cohorts, where it accounts for
              roughly 83% of clinically diagnosed individuals, and is associated with more prominent overgrowth
              and less severe learning disability than the microdeletion class.
            genes:
            - preferred_term: NSD1
              term:
                id: hgnc:14234
                label: NSD1
            subtype_frequency: ~83% of clinically diagnosed Sotos syndrome in the predominantly non-Japanese
              diagnostic series
          role: subtype
        - path: /has_subtypes/1
          value:
            name: 5q35 Microdeletion
            display_name: Recurrent 5q35 microdeletion encompassing NSD1
            description: Sotos syndrome caused by a contiguous 5q35 deletion encompassing NSD1. The recurrent
              deletion arises through non-allelic homologous recombination at flanking low-copy repeats.
              Frequencies vary between referral series and populations; Korean cohorts have reported both
              deletion-predominant and intragenic-variant-predominant distributions. Deletions are associated
              with less prominent overgrowth and more severe learning disability at group level. A scoliosis
              series also found greater progression in the deletion group. The absence of a deletion-size
              correlation does not exclude contributions from neighboring genes.
            genes:
            - preferred_term: NSD1
              term:
                id: hgnc:14234
                label: NSD1
            subtype_frequency: ~10% of clinically diagnosed Sotos syndrome in the predominantly non-Japanese
              diagnostic series; ~52% of Japanese patients in the older referral series
          role: subtype
