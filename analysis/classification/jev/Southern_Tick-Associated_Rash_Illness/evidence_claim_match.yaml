          no validated laboratory diagnostic test.
        - Missouri STARI patients were less symptomatic, more often had single smaller circular lesions
          with central clearing, and recovered more rapidly after antibiotic treatment than New York early
          Lyme disease patients.
      selected_evidence:
        snippet: After antibiotic treatment, Missouri case patients recovered more rapidly than did New
          York case patients (P=.037).
        supports: SUPPORT
