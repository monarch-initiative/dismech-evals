            term:
              id: MONDO:0025294
              label: tick-borne infectious disease
        context: []
      assertion_type: InfectiousAgent
      assertion:
        name: Etiologic agent undetermined
        description: 'No organism has been established as the cause of STARI, so this record carries no
          infectious_agent_term. The candidates that were proposed have been tested and not supported:
          Borrelia burgdorferi was excluded by microbiologic study of classic Missouri cases, additional
          cases linking Borrelia lonestari to STARI never materialised, and serological screening for
          rickettsial agents found nothing. A tick-saliva-mediated mechanism producing an erythema-migrans-like
          lesion without any transmitted pathogen remains a hypothesis rather than an established alternative.
          Binding a taxon here would assert an identification the literature does not make; the honest
          record is the absent binding plus this note.'
      selected_evidence:
        snippet: Thus, at present no infectious etiology is known for STARI.
        supports: SUPPORT
    origin:
