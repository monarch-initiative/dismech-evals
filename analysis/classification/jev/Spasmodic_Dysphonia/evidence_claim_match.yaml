      assertion_type: Subtype
      assertion:
        name: Adductor
        display_name: Adductor Spasmodic Dysphonia
        description: Most common form (~80-95% of cases). Involuntary hyperadduction of the vocal folds
          during phonation produces a strained-strangled voice quality with abrupt voice breaks on vowels
          (voiced sounds). Caused by spasms of the adductor muscles, principally the thyroarytenoid (vocalis)
          and lateral cricoarytenoid muscles.
      selected_evidence:
        snippet: Adductor SD predominated (90-95%) and females were four-fold more likely to be affected
          than males.
        supports: SUPPORT
