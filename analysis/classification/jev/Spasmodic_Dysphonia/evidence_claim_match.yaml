        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cortico-Basal Ganglia Motor Network Dysfunction
        description: Spasmodic dysphonia is a central network disorder of the cortico-basal ganglia-thalamo-cortical
          motor loop controlling laryngeal motor output. Functional and structural imaging implicate altered
          activity and connectivity across sensorimotor cortex, basal ganglia, thalamus, and cerebellum,
          with reduced striatal dopamine D2/D3 receptor binding and a widespread decrease in cortical
          (GABAergic) inhibition demonstrated by transcranial magnetic stimulation, permitting excessive,
          involuntary laryngeal muscle activation during speech.
        cell_types:
        - preferred_term: GABAergic inhibitory neuron
          term:
            id: CL:0000617
            label: GABAergic neuron
        - preferred_term: striatal medium spiny neuron
          term:
            id: CL:1001474
            label: medium spiny neuron
        biological_processes:
        - preferred_term: GABAergic signaling
          term:
            id: GO:0007214
            label: gamma-aminobutyric acid signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: the pathophysiology likely involves large-scale functional and structural brain network
          disorganization.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
