        association: Causative
        presence: Positive
        gene_term:
          preferred_term: GNAL
          term:
            id: hgnc:4388
            label: GNAL
        notes: Most spasmodic dysphonia is sporadic, but ~12% of patients report a family history of dystonia.
          GNAL (DYT25) is the only gene shown to cause genuinely isolated laryngeal dystonia, albeit rarely;
          screening of classical dystonia genes (TOR1A, THAP1, TUBB4A, GNAL) has low yield in sporadic
          disease.
      selected_evidence:
        snippet: Our data show that GNAL mutation may represent one of the rare causative genetic factors
          of isolated laryngeal dystonia.
        supports: SUPPORT
