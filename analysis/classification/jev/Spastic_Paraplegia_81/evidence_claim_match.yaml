      assertion_type: Genetic
      assertion:
        name: SELENOI
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: SELENOI
          term:
            id: hgnc:29361
            label: SELENOI
        notes: 'Disease alleles reported to date are private to each consanguineous family and act by
          disrupting splicing or otherwise reducing enzyme activity. One is a synonymous change that would
          be dismissed on protein consequence alone: it disrupts splicing and removes exon 2. That is
          the clinically material point in this section - a synonymous variant in SELENOI is not automatically
          benign.

          Constitutive knockout is embryonic lethal in mouse, which implies that surviving human genotypes
          retain partial activity. The entry does not claim a genotype-phenotype correlation, because
          with three families there is no basis for one.'
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: disrupt normal splicing and lead to skipping of exon 2
        supports: SUPPORT
