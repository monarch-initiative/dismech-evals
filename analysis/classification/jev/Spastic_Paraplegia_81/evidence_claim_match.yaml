      assertion_type: Pathophysiology
      assertion:
        name: Extramotor Neurodevelopmental Involvement
        biological_scale: ORGANISM
        description: 'The features outside the motor system - impaired intellectual development, speech
          delay, seizures, microcephaly, sensorineural deafness and visual loss - reported mainly at the
          severe end of the spectrum.

          This node is deliberately weaker than the motor arm above, and the reason is stated rather than
          hidden by the arrow: these features co-occur with the myelin lesion in the reported patients,
          but no source establishes that each follows from it. Sensorineural deafness in particular is
          a cochlear or eighth-nerve phenotype whose relation to central hypomyelination is not demonstrated
          in this disease. The edges below therefore assert co-occurrence within a single CNS disorder,
          not a worked-out causal path, and the HUMAN_MODEL_MISMATCH-style gap that would be needed to
          resolve it is recorded in the discussions section.'
      selected_evidence:
        snippet: sensorineural deafness, blindness, cleft palate, delayed motor development, regression
          of motor skills, impaired intellectual development, poor speech and language acquisition, spasticity,
