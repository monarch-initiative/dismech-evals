          to cover auditory or visual function. The model therefore grounds the motor arm while being
          silent on the extramotor arm that carries most of the severe-end morbidity in patients - which
          is exactly what the knowledge gap below asks about. It also cannot represent the intellectual
          disability and speech impairment that define the human disorder clinically.'
      selected_evidence:
