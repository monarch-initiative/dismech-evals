          term:
            id: hgnc:29361
            label: SELENOI
        notes: 'Disease alleles reported to date are private to each consanguineous family and act by
          disrupting splicing or otherwise reducing enzyme activity. One is a synonymous change that would
          be dismissed on protein consequence alone: it disrupts splicing and removes exon 2. That is
          the clinically material point in this section - a synonymous variant in SELENOI is not automatically
          benign.

