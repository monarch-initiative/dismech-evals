          escape response, described by the authors as phenocopying the patients' HSP.
        limitations: Fidelity is recorded as MODERATE rather than HIGH because the comparison is between
          a larval zebrafish escape response and a progressive adult-onset human spasticity. The readouts
          are developmental and behavioural; the human disease is a progressive corticospinal degeneration,
          and no equivalent longitudinal measure exists in the fish.
        readouts:
        - name: Motor neuron branching
          target: Motor Neuron Branching Failure
