    claim:
      about:
        disease:
          name: Spastic Paraplegia 89 Autosomal Recessive
          disease_term:
            preferred_term: spastic paraplegia 89, autosomal recessive
            term:
              id: MONDO:0957274
              label: spastic paraplegia 89, autosomal recessive
        context: []
      assertion_type: Treatment
      assertion:
        name: Statins (preclinical only)
        description: 'NOT A TREATMENT FOR PATIENTS. In amfra-null zebrafish larvae, both simvastatin and
          atorvastatin rescued the touch-evoked escape response to levels indistinguishable from wild
          type, but only atorvastatin fully corrected the axon branching defect - the two statins are
          not interchangeable here and the entry does not flatten them. The rationale is direct: statins
          inhibit HMGCR, which is one of the ERAD substrates that accumulates when AMFR is lost.

          The complication is that Oil Red O staining under statin showed no difference from vehicle.
          The drug corrected the motor phenotype without a detectable change in the lipid droplet phenotype
          it is supposed to act through. That is modelled as an explicit UNCHANGED readout below, and
          it is the subject of this entry''s open discussion.

          No human has been treated and no trial exists. The authors'' own wording is "suggesting potential
          therapeutic implications". It is recorded here because a mechanism-derived, repurposing-ready
          hypothesis is exactly the kind of thing this knowledge base should make findable - but it must
          not be read as established therapy.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: atorvastatin
            term:
              id: CHEBI:39548
              label: atorvastatin
          - preferred_term: simvastatin
            term:
              id: CHEBI:9150
              label: simvastatin
      selected_evidence:
        snippet: administration of FDA-approved statins improves touch-evoked escape response and motor
          neuron branching defects in amfra-/- zebrafish larvae, suggesting potential therapeutic implications
        supports: SUPPORT
