              label: spastic paraplegia 89, autosomal recessive
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: gp78 E3 Ubiquitin Ligase Loss of Function
        description: Biallelic truncating AMFR variants remove gp78, a RING-H2 finger E3 ubiquitin ligase
          anchored at the ER membrane. gp78 is a core ERAD component, and the demonstrated downstream
          consequence in patient cells is a lipid one - not because the mechanism leaves ERAD behind,
          but because the ERAD substrates that matter here are the sterol-pathway regulators HMGCR and
          INSIG-1. Generalised proteostasis stress was tested for and not found.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: AMFR
          term:
            id: hgnc:463
            label: AMFR
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          allele_type: VARIANT
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
        molecular_functions:
        - preferred_term: ubiquitin protein ligase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0061630
            label: ubiquitin protein ligase activity
        locations:
        - preferred_term: endoplasmic reticulum
          term:
            id: GO:0005783
            label: endoplasmic reticulum
      selected_evidence:
        snippet: Whole genome sequencing identified bi-allelic truncating variants in AMFR, encoding a
          RING-H2 finger E3 ubiquitin ligase anchored at the membrane of the endoplasmic reticulum (ER),
          in two previously genetically unexplained HSP-affected siblings.
        supports: SUPPORT
