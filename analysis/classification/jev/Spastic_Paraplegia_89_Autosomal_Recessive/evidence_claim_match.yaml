  c3cf0137c32442760a2f293274d996c355f05689a91cd2cdebb6036423cadd51:
    claim:
      about:
        disease:
          name: Spastic Paraplegia 89 Autosomal Recessive
          disease_term:
            preferred_term: spastic paraplegia 89, autosomal recessive
            term:
              id: MONDO:0957274
              label: spastic paraplegia 89, autosomal recessive
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Blunted ERAD of HMGCR and INSIG-1
        description: 'The substrate-level step, and the one that makes the rest of the disease legible.
          Among the proteins gp78 polyubiquitinates for ER-associated degradation are HMGCR - the rate-limiting
          enzyme of cholesterol synthesis - and INSIG-1, its regulatory partner. Without the ligase their
          degradation is blunted, so the cholesterol-synthesis machinery is no longer turned over normally.

          This is why the mechanism is ERAD rather than a departure from it: the disease is not caused
          by losing a generic proteostasis function but by losing ERAD of *these* substrates. It is also
          the entire rationale for the statin hypothesis, since statins inhibit the very protein that
          accumulates.'
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: ERAD pathway
          modifier: DECREASED
          term:
            id: GO:0036503
            label: ERAD pathway
        - preferred_term: cholesterol metabolic process
          modifier: DYSREGULATED
          term:
            id: GO:0008203
            label: cholesterol metabolic process
      selected_evidence:
        snippet: argue that the loss of AMFR's ERAD function likely underlies the disease mechanism of
          this new disorder, leading to a disturbance in the balance of lipid and cholesterol homeostasis
          in cells without AMFR
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37119330
      reference_title: AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is
        amenable to statin treatment in a preclinical model.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The authors'' own synthesis, and the sentence this entry follows. Note the two hedges
        kept in the quote: "likely underlies", and a disturbance in the *balance* rather than a simple
        decrease - which is why the downstream node uses DYSREGULATED.'
