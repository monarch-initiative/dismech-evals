  db19b917c89db0783bf577643ade6d60f3ebdfc191b0046846e6bfa576c7c3b8:
    claim:
      about:
        disease:
          name: Spastic Paraplegia 89 Autosomal Recessive
          disease_term:
            preferred_term: spastic paraplegia 89, autosomal recessive
            term:
              id: MONDO:0957274
              label: spastic paraplegia 89, autosomal recessive
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: spg89_statin_rescue_without_lipid_correction
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Statins rescue motor phenotypes in amfra-null zebrafish but do not change lipid droplet
          burden in the same larvae. Through what mechanism does the rescue act, and does the dissociation
          weaken the case for trialling statins in SPG89 patients?
        attaches_to:
        - treatments#Statins (preclinical only)
        - pathophysiology#Blunted ERAD of HMGCR and INSIG-1
        - pathophysiology#Disturbed Lipid Homeostasis with Lipid Droplet Accumulation
        - animal_models#amfra-null zebrafish (amfra-/-)
        rationale: 'The mechanistic chain has a measured gap in the middle, and the measurement was taken
          - it just came back negative.

          Established: AMFR ubiquitinates HMGCR and INSIG-1 for ERAD; losing it disturbs the balance of
          lipid and cholesterol homeostasis; lipid droplets accumulate in patient fibroblasts and AMFR-null
          neural stem cells and reverse on AMFR re-expression; amfra-null zebrafish show branching and
          escape-response defects; statins rescue both motor readouts, atorvastatin more completely than
          simvastatin.

          Not established, and specifically looked for: that statins correct the lipid phenotype. Oil
          Red O staining at 3 dpf showed no difference between statin- and vehicle-treated null larvae.
          So the drug fixes the motor output without a detectable effect on the lipid readout that motivated
          using it.

          Several readings are open and the entry does not choose between them. Oil Red O measures neutral
          lipid droplets, which may be too coarse to register the sterol-level change that matters - notably,
          atorvastatin had the most pronounced effect on brain sterol ratios, which is a different and
          more sensitive measurement than droplet staining. Or statins may act through an HMGCR-independent
          route. Or droplet accumulation may be a marker of the lesion rather than the thing that damages
          axons, in which case correcting it was never the right target.

          This is filed as a KNOWLEDGE_GAP rather than a HUMAN_MODEL_MISMATCH because the disagreement
          is between two readouts within the same model, not between model and human.

          An earlier revision of this entry asserted that the lipid readout had never been taken under
          statin and proposed taking it as the resolving experiment. That was wrong - it is in the full
          text of the paper the entry cites - and the proposed experiment below has been re-scoped to
          human cells, where it genuinely has not been done.'
        proposed_experiments:
        - experiment_id: exp_spg89_statin_lipid_readout_patient_cells
          name: Statin treatment of AMFR-null patient cells with sterol profiling, not droplet staining
          description: 'Treat AMFR-null patient fibroblasts and AMFR-KO neural stem cells with atorvastatin
            and simvastatin, and measure cholesterol and non-cholesterol sterol levels alongside Oil Red
            O droplet burden. Two things this would settle that the zebrafish work did not: whether the
            null result is a limitation of droplet staining rather than of the drug, and whether any of
            it holds in human cells rather than fish.'
          would_support:
          - treatments#Statins (preclinical only)
          supporting_outcome:
          - Statins normalize sterol profiles in AMFR-null human cells even where droplet staining is
            unchanged, explaining the zebrafish dissociation as a readout limitation and joining the drug
            back to the mechanism.
          refuting_outcome:
          - Neither sterol profile nor droplet burden shifts under statin in human AMFR-null cells, indicating
            the zebrafish motor rescue is mechanistically unexplained and the precision-medicine framing
            is not earned.
        - experiment_id: exp_spg89_atorvastatin_vs_simvastatin
          name: Why atorvastatin and not simvastatin
          description: Determine whether the branching rescue difference reflects CNS penetration, potency,
            or an off-target effect, by comparing brain drug exposure and sterol response for the two
            agents at matched HMGCR inhibition.
          would_support:
          - treatments#Statins (preclinical only)
          supporting_outcome:
          - The difference tracks brain exposure or sterol response, meaning the mechanism is on-target
            and drug selection matters for any future trial.
          refuting_outcome:
          - The difference does not track HMGCR inhibition, pointing to an off-target effect and undercutting
            the HMGCR rationale for the whole approach.
      selected_evidence:
        snippet: Assessing ORO staining intensity at 3 dpf did not show differences between statin and
          vehicle-treated control amfra-/- larvae
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
