          target: Motor Neuron Branching Failure
          direction: ALTERED
          interpretation: Behavioural motor readout in the larva.
      selected_evidence:
        snippet: Similar findings are seen in amfra-/- zebrafish larvae, in addition to altered touch-evoked
          escape response and defects in motor neuron branching, phenocopying the HSP observed in patients.
        supports: SUPPORT
