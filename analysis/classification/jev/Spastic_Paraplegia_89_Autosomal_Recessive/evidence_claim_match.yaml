            term:
              id: MONDO:0957274
              label: spastic paraplegia 89, autosomal recessive
        context: []
      assertion_type: Genetic
      assertion:
        name: AMFR
        notes: 'Encodes gp78, an ER membrane-anchored RING-H2 finger E3 ubiquitin ligase and a core ERAD
          component. Disease-associated alleles are biallelic and truncating; a homozygous canonical splice
          variant (c.707+1G>A) has been reported independently.

          Worth recording for anyone reading the mechanism: the ERAD role is what gp78 is known for, and
          the demonstrated consequence in patient cells is disturbed lipid homeostasis. These are the
          same story, not competing ones - the route runs through ERAD of the sterol-pathway regulators
          HMGCR and INSIG-1, which is why statins engage it at all.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: AMFR
          term:
            id: hgnc:463
            label: AMFR
        variants:
        - name: c.707+1G>A
          description: Homozygous canonical splice donor variant reported in an Algerian patient with
            a complicated form, by a group independent of the founding report.
      selected_evidence:
        snippet: Our genetic and functional studies identify bi-allelic truncating variants in AMFR as
          a cause of a novel autosomal recessive HSP by altering lipid metabolism
        supports: SUPPORT
