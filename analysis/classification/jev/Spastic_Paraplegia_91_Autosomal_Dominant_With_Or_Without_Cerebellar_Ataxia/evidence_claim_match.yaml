        context: []
      assertion_type: Subtype
      assertion:
        name: HSP-predominant
        display_name: Spastic paraplegia-predominant SPG91
        description: The larger group, defined by the recurrent p.Arg19Trp variant at the alpha/beta spectrin
          tetramerization site. Onset is congenital to adolescent, usually in the first decade, with slowly
          progressive lower-limb spasticity. Most patients have pure spastic paraplegia; a minority have
          a complex form with sensorimotor axonal neuropathy, cerebellar ataxia, optic neuropathy or,
          rarely, learning disability and seizures, and the same variant produces both pure and complex
          forms within one family.
        genes:
        - preferred_term: SPTAN1
          term:
            id: hgnc:11273
            label: SPTAN1
      selected_evidence:
        snippet: There are two clearly delineated groups of patients with a respectively predominantly
          HSP phenotype linked with the p.Arg19Trp mutation and a cerebellar ataxia phenotype associated
          with the p.Lys2083del mutation.
        supports: SUPPORT
