            term:
              id: MONDO:0957813
              label: spastic paraplegia 91, autosomal dominant, with or without cerebellar ataxia
        context:
        - path: /has_subtypes/1
          value:
            name: Ataxia-predominant
            display_name: Cerebellar ataxia-predominant SPG91
            description: Patients carrying the recurrent in-frame p.Lys2083del or other de novo missense
              variants that destabilise a spectrin repeat (p.Arg1098Cys, p.Arg1624Cys, p.Gln2205Pro).
              The core picture is early to juvenile onset, slowly progressive cerebellar ataxia with cerebellar
              atrophy on MRI and usually mild intellectual disability. Some patients also have pyramidal
              signs, dystonia or epilepsy, and the most complex cases have developmental delay with severe
              intellectual disability and seizures.
            genes:
            - preferred_term: SPTAN1
              term:
                id: hgnc:11273
                label: SPTAN1
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Spectrin Repeat Destabilization
        biological_scale: MOLECULAR
        subtypes:
        - Ataxia-predominant
        description: p.Lys2083del, p.Arg1098Cys, p.Arg1624Cys and p.Gln2205Pro each remove an electrostatic
          interaction or a hydrogen bond that links helices within a spectrin repeat (repeats 10, 14 and
          20 among them), or introduce a buried proline. The predicted result is a less stable repeat.
          The authors compare this to dystrophin, where loss of an interhelical charge interaction destabilises
          a spectrin-like domain. Like the tetramerization node, this rests on modelling.
        genes:
        - preferred_term: SPTAN1
          term:
            id: hgnc:11273
            label: SPTAN1
        cellular_components:
        - preferred_term: spectrin
          term:
            id: GO:0008091
            label: spectrin
          modifier: ABNORMAL
      selected_evidence:
        snippet: Taken together, these observations form a common pattern, suggesting destabilization
          of spectrin repeats through disturbances in either electrostatic interactions or hydrogen bonds.
        supports: SUPPORT
    origin:
