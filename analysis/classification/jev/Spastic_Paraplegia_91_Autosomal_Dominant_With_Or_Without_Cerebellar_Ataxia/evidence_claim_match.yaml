          that destabilise a spectrin repeat (p.Arg1098Cys, p.Arg1624Cys, p.Gln2205Pro). The core picture
          is early to juvenile onset, slowly progressive cerebellar ataxia with cerebellar atrophy on
          MRI and usually mild intellectual disability. Some patients also have pyramidal signs, dystonia
          or epilepsy, and the most complex cases have developmental delay with severe intellectual disability
          and seizures.
        genes:
        - preferred_term: SPTAN1
          term:
            id: hgnc:11273
