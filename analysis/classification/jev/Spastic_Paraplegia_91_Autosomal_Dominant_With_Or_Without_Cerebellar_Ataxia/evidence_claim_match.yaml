        - path: /genetic/0
          value:
            name: SPTAN1
            gene_term:
              preferred_term: SPTAN1
              term:
                id: hgnc:11273
                label: SPTAN1
            relationship_type: CAUSATIVE
            association: Causative
            variant_origin: GERMLINE
            notes: 'Heterozygous SPTAN1 missense, in-frame deletion and splice variants cause SPG91. In
              the 100,000 Genomes Project, rare probably damaging SPTAN1 variants were enriched in hereditary
              ataxia and spastic paraplegia probands compared with controls (12/1142 vs 52/23,847). The
              HSP/ataxia carriers in that cohort had missense variants and one splice variant, and none
              of the control variants were truncating. Variant class and position predict phenotype across
              the SPTAN1 spectrum. C-terminal in-frame insertions, deletions and duplications in the heterodimer
              nucleation repeats cause DEE5 through dominant-negative aggregation (curated in the SPTAN1-Related
              Developmental and Epileptic Encephalopathy entry). Truncating variants cause dominant distal
              hereditary motor neuropathy (MONDO:0957875) and a childhood-onset distal myopathy with neurogenic
              features through nonsense-mediated decay, or milder developmental delay with or without
              seizures (MONDO:0957815). The SPG91 variants are missense or in-frame changes outside the
              DEE5 hotspot. Loss of function has not been shown to cause SPG91. The correlation is a trend,
              not a rule: the same p.Lys2083del variant that causes ataxia in four SPG91 patients is listed
              against a developmental and epileptic encephalopathy patient in the Morsy et al. cohort
              table. Two reports proposed biallelic SPTAN1 variants as a cause of recessive spastic paraplegia
              (PMID:31515523, PMID:34526651); the founding SPG91 cohort found no segregating recessive
              variants in more than 10,000 datasets, and recessive disease is outside this entry.'
          role: ancestor
      assertion_type: Variant
      assertion:
        name: p.Arg19Trp
        description: c.55C>T (NM_001130438), the recurrent SPG91 variant, at the N-terminal tetramerization
          site. It segregates dominantly in several families, arises de novo in others, and is associated
          with spastic paraplegia.
      selected_evidence:
        snippet: We also identified the c.55C>T, p.Arg19Trp SPTAN1 variant in seven probands with HSP
        supports: SUPPORT
