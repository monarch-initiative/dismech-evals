  469cfd559aab1d4726b1bbd581b97b3dec93a710bd4c125b4a02112706176dbd:
    claim:
      about:
        disease:
          name: Spastic Paraplegia 91, Autosomal Dominant, With or Without Cerebellar Ataxia
          disease_term:
            preferred_term: spastic paraplegia 91, autosomal dominant, with or without cerebellar ataxia
            term:
              id: MONDO:0957813
              label: spastic paraplegia 91, autosomal dominant, with or without cerebellar ataxia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Monoallelic SPTAN1 Variant at a Spectrin Interlinking Position
        biological_scale: MOLECULAR
        description: A heterozygous missense or in-frame SPTAN1 variant at a residue that holds alpha-II
          spectrin's helices together. The SPG91 variants typically remove a positively charged arginine
          or lysine, or a hydrogen-bonding residue, at either the N-terminal tetramerization site or a
          position linking the three helices of a spectrin repeat. This distinguishes them both from the
          DEE5 variants, which are in-frame changes in the last two repeats, and from the truncating variants
          associated with hereditary motor neuropathy and distal myopathy. The role of these residues
          comes from structural modelling, not from biochemistry on the mutant protein.
        genes:
        - preferred_term: SPTAN1
          term:
            id: hgnc:11273
            label: SPTAN1
      selected_evidence:
        snippet: The mutations presented in the current study typically affect positively charged Arginine
          or Lysine residues, producing the hypothesis that the disease mechanism is driven by the disruption
          of stabilizing electrostatic interactions.
        supports: SUPPORT
    origin:
