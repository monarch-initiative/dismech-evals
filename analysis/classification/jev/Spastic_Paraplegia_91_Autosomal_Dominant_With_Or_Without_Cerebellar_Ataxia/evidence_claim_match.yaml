            description: Axonal degeneration is the consistent finding in animals lacking alpha-II spectrin,
              and it falls preferentially on large-diameter myelinated axons, which have the highest density
              of nodal alpha-II spectrin and bear the greatest mechanical load. In a mouse with a destabilising
              alpha-II spectrin missense variant at Arg1098, the residue mutated in one SPG91 ataxia patient,
              heterozygous animals develop progressive ataxia with axonal and dendritic disruption and
              loss of more than 80% of cerebellar Purkinje cells. No neuropathology from an SPG91 patient
              exists, so degeneration of the corticospinal tract and of peripheral axons in humans is
              inferred from these models and from the clinical picture.
            cell_types:
