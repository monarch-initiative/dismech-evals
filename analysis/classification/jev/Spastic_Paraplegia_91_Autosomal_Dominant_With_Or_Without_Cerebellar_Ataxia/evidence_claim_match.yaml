        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: In the Arg1098 mouse, Purkinje cell loss and cerebellar degeneration track the progressive
          loss of coordination. The equivalent process in patients is inferred.
      selected_evidence:
        snippet: By adulthood, the degree of cerebellar degeneration becomes profound, and correlates
          with the progressive decline in coordinated movement
        supports: SUPPORT
        directness: INDIRECT
