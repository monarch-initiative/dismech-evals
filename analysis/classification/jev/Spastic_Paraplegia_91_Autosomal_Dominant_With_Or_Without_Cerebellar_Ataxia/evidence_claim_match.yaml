      assertion_type: Pathophysiology
      assertion:
        name: Impaired Alpha/Beta Spectrin Tetramerization
        biological_scale: MOLECULAR
        subtypes:
        - HSP-predominant
        description: Alpha-II spectrin's N-terminal partial repeat completes a three-helix bundle with
          the C-terminal helices of a beta-spectrin, which is how two alpha/beta heterodimers join head
          to head into a tetramer. Arg19 forms a salt bridge with an aspartate on the beta-spectrin helix.
          The tryptophan substitution is predicted to weaken this interaction, and the steric clashes
          it introduces, without destabilising the alpha-II tetramerization domain itself. The defect
          is therefore placed in alpha-II spectrin's binding to its beta partner. All of the support is
          computational; no binding assay on the mutant protein has been published.
        genes:
        - preferred_term: SPTAN1
          term:
            id: hgnc:11273
            label: SPTAN1
        molecular_functions:
        - preferred_term: spectrin binding
          term:
            id: GO:0030507
            label: spectrin binding
          modifier: ABNORMAL
      selected_evidence:
        snippet: The Arginine to Tryptophan amino acid substitution results in a loss of positive charge,
          which could in turn result in a partial loss of this electrostatic interaction at the tetramerization
          interface.
        supports: SUPPORT
