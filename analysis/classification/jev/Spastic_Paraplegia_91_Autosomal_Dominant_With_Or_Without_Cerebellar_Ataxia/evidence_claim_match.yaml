  b3048aac19b92e12813a1ffbadfbd63f60f8754e4c0eb8c124b2d737f4182396:
    claim:
      about:
        disease:
          name: Spastic Paraplegia 91, Autosomal Dominant, With or Without Cerebellar Ataxia
          disease_term:
            preferred_term: spastic paraplegia 91, autosomal dominant, with or without cerebellar ataxia
            term:
              id: MONDO:0957813
              label: spastic paraplegia 91, autosomal dominant, with or without cerebellar ataxia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mechanism_of_arg19trp_untested
        prompt: Every mechanistic claim about the SPG91 variants comes from structural modelling. Does
          p.Arg19Trp actually weaken alpha/beta spectrin tetramer assembly in neurons, and does it act
          through loss of function or through a dominant-negative effect?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Alpha/Beta Spectrin Tetramerization
        - pathophysiology#Abnormal Alpha-II Spectrin Accumulation in Patient Fibroblasts
        - pathophysiology#Disrupted Axonal Spectrin-Actin Periodic Skeleton
        rationale: Three modelling studies place p.Arg19Trp at the tetramerization interface and predict
          a weaker alpha/beta contact, and patient fibroblasts show abnormal alpha-II spectrin accumulation
          without reduced protein. That is consistent with a dominant-acting, assembly-defective subunit,
          but no binding assay, no measurement of the periodic skeleton in patient neurons, and no animal
          carrying an SPG91 allele have been published. Loss-of-function SPTAN1 alleles cause motor neuropathy,
          myopathy or developmental delay rather than spastic paraplegia, which suggests that p.Arg19Trp
          is not a simple null. The mechanism remains open.
        proposed_experiments:
        - experiment_id: exp_arg19trp_ipsc_motor_neurons
          name: Periodic skeleton and tetramer assembly in p.Arg19Trp iPSC-derived motor neurons
          description: Derive cortical motor neurons from p.Arg19Trp patient iPSCs and isogenic corrected
            controls. Measure alpha-II/beta-II spectrin tetramer formation by co-immunoprecipitation and
            native gel, image the periodic actin-spectrin lattice by super-resolution microscopy, and
            test axon resistance to mechanical stretch. Reduced tetramer assembly and a disordered lattice
            without reduced protein would support a dominant-acting assembly defect.
      selected_evidence:
        snippet: In computational simulations, this variant was predicted to perturb the stability of
          αII/β spectrin heterotetramerization but did not destabilize the tetramerization domain of αII-spectrin.
        supports: SUPPORT
