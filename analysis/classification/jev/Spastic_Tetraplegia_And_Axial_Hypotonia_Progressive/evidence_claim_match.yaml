      assertion_type: Genetic
      assertion:
        name: SOD1
        gene_term:
          preferred_term: SOD1
          term:
            id: hgnc:11179
            label: SOD1
        relationship_type: CAUSATIVE
        notes: Biallelic loss-of-function SOD1 variants cause STAHP, whereas heterozygous mostly missense
          variants cause dominant ALS1 through gain of function. Reported recessive alleles are c.335dupG
          (p.Cys112Trpfs*11, recurrent), c.357_357+2delGGT (p.Val119/Val120 in-frame deletion), c.52_56del5ins154,
          c.248dupG (p.Asp84Argfs*8) and c.369_371del. The mutant c.335dupG mRNA is present in carriers
          and patients, arguing against nonsense-mediated decay; the protein is lost through proteasomal
          degradation.
      selected_evidence:
        snippet: We identified a homozygous 3-bp in-frame deletion in SOD1.
        supports: SUPPORT
        directness: DIRECT
