        description: A recessive frameshift in the fourth codon of canine SOD1 segregates with a fully
          penetrant juvenile disease of severe tetraparesis, dystonia and falling in Markiesje pups, most
          of which were euthanized within weeks of onset.
        modeled_mechanisms:
        - target: Upper and Lower Motor Neuron Degeneration
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Juvenile, fully penetrant tetraparesis with Wallerian-like degeneration in brainstem
            and spinal cord and denervation atrophy of muscle, from a homozygous SOD1 loss-of-function
            allele.
          limitations: The canine disease was described as paroxysmal dyskinesia with dystonia, histological
            changes were mild, early euthanasia prevents comparison of the long-term course, and SOD1
            protein and enzyme activity were not measured.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Affected pups present with episodic dystonia, cramping and falling rather than
              the progressive spastic tetraplegia with axial hypotonia of children, so the shared feature
              is early motor system degeneration rather than the same clinical syndrome.
      selected_evidence:
        snippet: The DNA sequence analysis of SOD1 showed that the patients were homozygous for a frameshift
          mutation in the fourth codon.
        supports: SUPPORT
        directness: DIRECT
