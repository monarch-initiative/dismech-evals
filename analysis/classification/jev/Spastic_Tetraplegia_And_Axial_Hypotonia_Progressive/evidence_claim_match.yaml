        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Amyotrophic Lateral Sclerosis Type 1
        description: Dominant SOD1 ALS shares the motor neuron target and gene but arises in adulthood
          from heterozygous variants that produce aggregation-prone, misfolded protein with toxic gain
          of function, usually with preserved enzyme activity. STAHP is recessive, infantile in onset,
          and caused by complete absence of the enzyme with an unstable, non-aggregating product.
        disease_term:
          preferred_term: amyotrophic lateral sclerosis type 1
          term:
            id: MONDO:0007103
            label: amyotrophic lateral sclerosis type 1
        distinguishing_features:
        - Biallelic SOD1 variants with absent erythrocyte SOD1 activity
        - Onset in infancy with axial hypotonia, cerebellar vermis atrophy and hyperekplexia-like startle
        - Heterozygous relatives unaffected
      selected_evidence:
        snippet: Taken together, these findings suggest that homozygosity for loss-of-function variants
          in SOD1 results primarily in an infantile-onset motor neuron condition but with additional neuronal
          and non-neuronal involvement, which distinguishes it from typical adult-onset ALS.
        supports: SUPPORT
        directness: DIRECT
