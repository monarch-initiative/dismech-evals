          name: Spastic Tetraplegia and Axial Hypotonia, Progressive
          disease_term:
            preferred_term: spastic tetraplegia and axial hypotonia, progressive
            term:
              id: MONDO:0032828
              label: spastic tetraplegia and axial hypotonia, progressive
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: stahp-mouse-human-mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why does complete SOD1 absence cause infantile upper and lower motor neuron degeneration
          in humans but only a distal motor axonopathy, with motor neuron cell bodies spared, in Sod1
          knockout mice?
        rationale: The mouse knockout was the basis for the long-held view that loss of SOD1 activity
          does not damage motor neurons, a view the human syndrome contradicts. Knockout mice do develop
          a distal motor axonopathy from the first months of life, and SOD1-null dogs develop an early
          tetraparesis, so the mismatch lies in which parts of the motor system degenerate and how severely,
          rather than in an absence of motor involvement. Species differences in compensating antioxidants
          (mice synthesize ascorbate, humans do not), lifespan and motor system size are candidate explanations,
          but none has been tested.
        attaches_to:
        - animal_models#SOD1-null mouse
        - pathophysiology#Upper and Lower Motor Neuron Degeneration
      selected_evidence:
        snippet: the fact that SOD1 knockout mice do not develop ALS-like disease, contributed to the
          general view that reduced SOD1 activity does not cause ALS
        supports: SUPPORT
        directness: DIRECT
