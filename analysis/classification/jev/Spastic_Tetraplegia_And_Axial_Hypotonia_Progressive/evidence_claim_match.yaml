      assertion_type: Pathophysiology
      assertion:
        name: Absent SOD1 Superoxide Dismutase Activity
        description: SOD1, the principal cytosolic superoxide dismutase, converts superoxide to hydrogen
          peroxide. In affected children erythrocyte SOD1 activity is essentially zero across all reported
          alleles. Mouse knockout data suggest the mitochondrial and extracellular isoenzymes do not compensate,
          plausibly because charged superoxide crosses membranes poorly.
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: superoxide dismutase activity
          modifier: ABSENT
          term:
            id: GO:0004784
            label: superoxide dismutase activity
        biological_processes:
        - preferred_term: removal of superoxide radicals
          modifier: DECREASED
          term:
            id: GO:0019430
            label: removal of superoxide radicals
        genes:
        - preferred_term: SOD1
          term:
            id: hgnc:11179
            label: SOD1
      selected_evidence:
        snippet: Analysis of SOD1 activity and protein levels in erythrocyte lysates showed essentially
          no enzymatic activity and undetectable SOD1 protein in the child, whereas the parents had ∼50%
          protein expression and activity relative to controls.
        supports: SUPPORT
        directness: DIRECT
