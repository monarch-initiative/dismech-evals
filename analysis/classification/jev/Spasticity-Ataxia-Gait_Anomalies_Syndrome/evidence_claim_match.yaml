  c6b748db7fe2015410105fe4b6e3961c439233891d66e08757491475ae09fd60:
    claim:
      about:
        disease:
          name: Spastic Ataxia
          disease_term:
            preferred_term: spastic ataxia (SPAX)
            term:
              id: MONDO:0017845
              label: spastic ataxia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Proteotoxic Stress Signaling
        description: 'Mitochondrial protein quality control in the inner membrane is carried out by the
          m-AAA protease, whose subunits are AFG3L2 and paraplegin (SPG7). Both of this entry''s mitochondrial
          subtypes are defects of that one complex, which is why they are modelled at a single node: in
          the SPAX5 subtype, biallelic AFG3L2 dysfunction causes mitochondrial proteotoxic stress and
          activates the OMA1-DELE1-HRI integrated stress response pathway, and SPG7-associated disease
          is the paraplegin-subunit counterpart. The integrated-stress-response detail below is established
          for the AFG3L2 arm specifically.'
        genes:
        - preferred_term: AFG3L2
          term:
            id: hgnc:315
            label: AFG3L2
        - preferred_term: SPG7
          term:
            id: hgnc:11237
            label: SPG7
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
      selected_evidence:
        snippet: In this work, we demonstrated that mitochondrial proteotoxicity in the absence/mutation
          of AFG3L2 activates the OMA1-DELE1-HRI pathway eliciting the integrated stress response.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1093/brain/awad340
      reference_title: Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia
        type 5
      evidence_source: IN_VITRO
      explanation: This directly supports a subtype-specific mitochondrial stress mechanism within the
        spastic-ataxia syndrome family.
