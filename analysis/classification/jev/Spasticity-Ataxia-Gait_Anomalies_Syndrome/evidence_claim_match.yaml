  285fc120a1e8b1c0c745ab638ed89d179de0a5c7f62f54d49d2f2e00caa2b484:
    claim:
      about:
        disease:
          name: Spastic Ataxia
          disease_term:
            preferred_term: spastic ataxia (SPAX)
            term:
              id: MONDO:0017845
              label: spastic ataxia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: White Matter Degeneration and Secondary Demyelination
        description: 'In paradigmatic SPAX disorders, especially ARSACS, widespread white matter damage
          with secondary demyelination contributes to the spastic-ataxic phenotype. Only SACS is bound
          here: the PROSPAX comparison cited below found this pattern in ARSACS but explicitly not in
          SPG7 patients, so binding SPG7 to this node would contradict the entry''s own evidence.'
        genes:
        - preferred_term: SACS
          term:
            id: hgnc:10519
            label: SACS
        cell_types:
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: myelination
          term:
            id: GO:0042552
            label: myelination
          modifier: ABNORMAL
        - preferred_term: central nervous system myelination
          term:
            id: GO:0022010
            label: central nervous system myelination
          modifier: DECREASED
      selected_evidence:
        snippet: In ARSACS, but not SPG7 patients, we observed a complex and multi-faced involvement of
          brain WM, with a clinically meaningful widespread loss of axonal and dendritic integrity, secondary
          demyelination and, overall, a reduction in cellularity and volume.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1007/s00415-024-12505-y
      reference_title: 'An MRI evaluation of white matter involvement in paradigmatic forms of spastic
        ataxia: results from the multi-center PROSPAX study'
      explanation: This directly supports white-matter degeneration and secondary demyelination as a mechanistic
        branch in spastic ataxia.
