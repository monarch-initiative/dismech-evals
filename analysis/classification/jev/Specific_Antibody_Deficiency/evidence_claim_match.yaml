  6f407f4e36d609e0460f53bc6b809b2b52fef275acda95e6f9a7e7516b18cc62:
    claim:
      about:
        disease:
          name: Specific Antibody Deficiency
          disease_term:
            preferred_term: immunodeficiency due to selective anti-polysaccharide antibody deficiency
            term:
              id: MONDO:0019093
              label: immunodeficiency due to selective anti-polysaccharide antibody deficiency
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Pneumococcal polysaccharide vaccine challenge with serotype-specific titres
        description: 'The diagnostic test is a deliberate immunisation followed by titres: PPSV23, serotype-specific
          IgG at about four weeks, and - where an initial response is adequate but infections recur -
          a repeat at six months to catch the memory phenotype. Three constraints make this harder than
          it looks. The diagnosis cannot be made before age two, because failure to respond is normal
          below it. Serotypes present in any conjugate vaccine the patient has received must be excluded,
          and at least six PPSV23-only serotypes tested. And normal immunoglobulins, including IgG subclasses,
          are required - a low IgG points to common variable immunodeficiency instead.

          '
      selected_evidence:
        snippet: for patients who have previously received at least one dose of conjugate vaccine, normal
          antibody levels against serotypes in the conjugate vaccine do not exclude the diagnosis of SAD;
          thus, at least six serotypes should be tested that are present in PPSV23 only
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
