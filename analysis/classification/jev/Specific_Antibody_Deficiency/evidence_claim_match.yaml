  227d9784e7894ccfa95e01577bca00a32766782950fc3aeb94627e3d98dba045:
    claim:
      about:
        disease:
          name: Specific Antibody Deficiency
          disease_term:
            preferred_term: immunodeficiency due to selective anti-polysaccharide antibody deficiency
            term:
              id: MONDO:0019093
              label: immunodeficiency due to selective anti-polysaccharide antibody deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of T-Independent Type 2 B Cell Activation
        biological_scale: CELLULAR
        description: 'The core lesion, defined functionally because it cannot yet be defined molecularly.
          Unconjugated capsular polysaccharide is a repetitive carbohydrate with no peptide epitope, so
          it cannot be presented on MHC class II and cannot recruit T-cell help; it must instead crosslink
          the B cell receptor and activate B cells directly. In SAD that direct route fails while the
          T-dependent route - protein antigens, conjugate vaccines - works normally. The dissociation
          is the disease.

          '
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        - preferred_term: marginal zone B cell
          term:
            id: CL:0000845
            label: marginal zone B cell of spleen
        biological_processes:
        - preferred_term: B cell activation
          modifier: DECREASED
          term:
            id: GO:0042113
            label: B cell activation
        - preferred_term: immunoglobulin production
          modifier: DECREASED
          term:
            id: GO:0002377
            label: immunoglobulin production
      selected_evidence:
        snippet: SAD mimics the deficient immune response often seen in healthy young children and infants
          who are unable to mount a robust response to pure unconjugated polysaccharide antigens such
          as Streptococcus pneumoniae polysaccharide and Haemophilus influenzae type b capsular polysaccharide.
        supports: SUPPORT
    origin:
