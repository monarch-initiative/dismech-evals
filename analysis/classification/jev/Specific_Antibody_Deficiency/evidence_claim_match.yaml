      assertion_type: Subtype
      assertion:
        name: Memory
        display_name: Memory phenotype (adequate initial response, not sustained)
        description: 'An initially adequate response to vaccination that is not sustained beyond six months.
          Named by analogy rather than by mechanism - pure polysaccharide vaccines do not generate a long-lived
          memory B-cell response in the first place, so "memory phenotype" describes patients who lose
          their PPSV23 response faster than usual rather than patients with a demonstrated memory defect.
          Detecting it requires a second titre at six months, so it is missed by any protocol that measures
          only the four-week response.

          '
      selected_evidence:
        snippet: Patients with a memory phenotype of deficient responses initially mount an adequate response
          to vaccination but do not sustain the response beyond 6 months.
        supports: SUPPORT
