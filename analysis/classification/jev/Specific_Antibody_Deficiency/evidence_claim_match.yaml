    evidence_metadata:
      reference: PMID:28588580
      reference_title: 'Specific Antibody Deficiency: Controversies in Diagnosis and Management.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'The conjugate-vaccine confound and the specific testing rule that handles it - the
        commonest way this diagnosis is missed.

        '
