        name: Failure of T-Independent Type 2 B Cell Activation
        biological_scale: CELLULAR
        description: 'The core lesion, defined functionally because it cannot yet be defined molecularly.
          Unconjugated capsular polysaccharide is a repetitive carbohydrate with no peptide epitope, so
          it cannot be presented on MHC class II and cannot recruit T-cell help; it must instead crosslink
          the B cell receptor and activate B cells directly. In SAD that direct route fails while the
          T-dependent route - protein antigens, conjugate vaccines - works normally. The dissociation
          is the disease.

          '
