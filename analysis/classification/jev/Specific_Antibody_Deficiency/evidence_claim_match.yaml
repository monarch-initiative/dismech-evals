  4b064aab6cb5713cbafdb98d0e2c4e9fac785ebc957caa7af90fcc0e10204b19:
    claim:
      about:
        disease:
          name: Specific Antibody Deficiency
          disease_term:
            preferred_term: immunodeficiency due to selective anti-polysaccharide antibody deficiency
            term:
              id: MONDO:0019093
              label: immunodeficiency due to selective anti-polysaccharide antibody deficiency
        context: []
      assertion_type: Biochemical
      assertion:
        name: Serotype-specific anti-pneumococcal capsular polysaccharide IgG
        notes: 'The measurement that defines the disease, and therefore the one place its numbers should
          be recorded rather than only argued about. Two thresholds operate at once and they are independent
          of each other: a per-serotype protective concentration, and a proportion of tested serotypes
          that must reach it, which is itself age-stratified. A patient can fail on either.

          The interpretation bands below are the working-group severity tiers expressed against the serotype-proportion
          axis for a child under six. They are not laboratory reference intervals in the usual sense -
          they are a consensus classification with, as the knowledge gap on this entry records, no demonstrated
          relationship to outcome.

          '
        reference_ranges:
        - lower_bound: 1.3
          unit: ug/mL
          population: Per serotype, protective concentration after polysaccharide vaccination
          notes: 'No `loinc_term` is set: LOINC is not configured in `conf/oak_config.yaml` and has no
            term cache in this repository, so a code could not be validated. No `interpretation_bands`
            here either - the working-group severity tiers are defined on serotype counts and proportions,
            not on concentration, so they belong on the ranges below and not on this axis.'
        - lower_bound: 50.0
          unit: percent of serotypes tested
          population: Children under 6 years
          notes: 'The proportion axis, which is independent of the concentration axis above: a patient
            can fail on either.'
          interpretation_bands:
          - name: Deficient response, under 6 years
            upper_bound: 50.0
            unit: percent of serotypes tested
            abnormal_flag: LOW
            interpretation: Below the age-appropriate proportion. The moderate/severe split inside this
              band is an absolute serotype count - three or more versus two or fewer - and is therefore
              not expressible on a proportion axis; it is carried on the count range below.
          - name: Normal response, under 6 years
            lower_bound: 50.0
            unit: percent of serotypes tested
            abnormal_flag: NORMAL
            interpretation: Protective titres to at least half of the serotypes tested.
        - lower_bound: 70.0
          unit: percent of serotypes tested
          population: Patients 6 years and over
          notes: The same axis with the older-age threshold. The age split is why an identical serological
            result means different things in a four-year-old and a ten-year-old.
          interpretation_bands:
          - name: Deficient response, 6 years and over
            upper_bound: 70.0
            unit: percent of serotypes tested
            abnormal_flag: LOW
            interpretation: Below the age-appropriate proportion.
          - name: Normal response, 6 years and over
            lower_bound: 70.0
            unit: percent of serotypes tested
            abnormal_flag: NORMAL
            interpretation: Protective titres to at least 70% of the serotypes tested.
        - unit: serotypes with protective titre
          population: Severity tier, absolute serotype count
          notes: 'The third axis, and the honest home for the severe tier: it is defined by a count, not
            a proportion. Separating it is what stops "two or fewer serotypes" being written as a percentage
            it is not.'
          interpretation_bands:
          - name: Severe phenotype
            upper_bound: 3.0
            unit: serotypes with protective titre
            abnormal_flag: LOW
            severity: SEVERE
            interpretation: Protective titres against two or fewer serotypes, and those titres typically
              low.
          - name: Moderate phenotype or better
            lower_bound: 3.0
            unit: serotypes with protective titre
            abnormal_flag: LOW
            severity: MODERATE
            interpretation: Three or more serotypes with protective titres. Whether this is moderate or
              normal is then decided on the age-stratified proportion axis above, not on this one.
      selected_evidence:
        snippet: report on diagnostic vaccination in PIDD recommend that a normal response to pneumococcal
          vaccines is a response to ≥50% of serotypes for patients under 6 years of age and a response
          to ≥70% of serotypes for patients over 6 years of age
        supports: SUPPORT
