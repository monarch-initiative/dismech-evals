      assertion_type: ProgressionInfo
      assertion:
        phase: Childhood-onset, potentially transient
        age_range: 2 years and above
        notes: In some patients, particularly children, SAD resolves over time - which mirrors the fact
          that the polysaccharide response is normally acquired around age two and can simply be late.
          This is the reason the diagnosis should be re-tested rather than treated as permanent, and the
          reason long-term immunoglobulin replacement in a child is a decision with a horizon rather than
          a life sentence.
      selected_evidence:
        snippet: SAD may be a transient issue in some patients, especially children, and may resolve over
          time
        supports: SUPPORT
