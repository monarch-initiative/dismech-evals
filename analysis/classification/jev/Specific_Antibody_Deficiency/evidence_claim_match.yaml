  41336915c46ee0e9ef5e48418c8050b6b20c188fc3b17b4c518be00243ea0ff5:
    claim:
      about:
        disease:
          name: Specific Antibody Deficiency
          disease_term:
            preferred_term: immunodeficiency due to selective anti-polysaccharide antibody deficiency
            term:
              id: MONDO:0019093
              label: immunodeficiency due to selective anti-polysaccharide antibody deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: spad_case_definition_instability
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Absent Protective Anticapsular Antibody
        - prevalence#
        prompt: What serological threshold - how many serotypes, what absolute titre, what fold rise,
          at what age - actually separates people who benefit from treatment for specific antibody deficiency
          from people who do not?
        rationale: 'Every other uncertainty in this entry is downstream of this one. The prevalence range
          in adults with chronic rhinosinusitis, 11.6% to 24% across three retrospective series of the
          same clinical population, is largely a range about the criterion rather than about the populations.
          The four severity tiers are defined by the same contested numbers. And because the assay is
          the case definition, changing the cut-off does not reclassify patients within the disease -
          it changes who has the disease.

          Two things make this resolvable in principle rather than merely lamentable. Antibody responses
          are age-dependent and probably serotype-dependent, so a criterion that conditioned on both would
          be better founded than the current flat thresholds. And the outcome that matters - infection
          burden, and response to prophylaxis or immunoglobulin - is measurable, so a criterion could
          in principle be validated against it rather than set by consensus.

          The first has not been done. The second has been attempted, and the early answer is unfavourable:
          in the 55-patient adult cohort, at least a quarter of patients with recurrent severe infections,
          bronchiectasis, or a requirement for immunoglobulin replacement fell into the so-called mild
          tier, and the authors saw no clear association between the level of anti-polysaccharide response
          and prognosis. That is this experiment''s `refuting_outcome` partially realised in an observational
          setting, and it is the strongest single reason to treat the severity tiers as serological descriptions
          rather than as a graded prediction.

          '
        proposed_experiments:
        - experiment_id: spad_criterion_outcome_validation
          name: Prospective validation of PPSV23 response criteria against infection outcome
          description: Follow a prospectively enrolled cohort presenting with recurrent sinopulmonary
            infection and normal immunoglobulins, measure serotype-specific titres at four weeks and six
            months using serotypes absent from any conjugate vaccine received, and test each candidate
            criterion for how well it predicts subsequent infection burden and response to prophylaxis
            - rather than how well it agrees with expert opinion.
          would_support:
          - pathophysiology#Absent Protective Anticapsular Antibody
          supporting_outcome:
          - One criterion separates patients by subsequent infection burden and by benefit from prophylaxis,
            giving the entity an outcome-anchored boundary and turning the four severity tiers into a
            graded prediction rather than a serological description.
          would_refute:
          - pathophysiology#Absent Protective Anticapsular Antibody
          refuting_outcome:
          - No threshold predicts infection burden or treatment benefit, which would mean the polysaccharide
            response measures something real but not the thing that makes these patients ill, and that
            SAD as currently defined is a laboratory finding rather than a disease entity.
      selected_evidence:
        snippet: Confounding these issues, anti-polysaccharide antibody responses are age- and probably
          serotype dependent.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28588580
