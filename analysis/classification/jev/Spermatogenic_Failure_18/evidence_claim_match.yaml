  6069d038a07fceb212c002cf2e92c9e398c6a5bfe94cba0d17520f021f58c666:
    claim:
      about:
        disease:
          name: Spermatogenic Failure 18
          disease_term:
            preferred_term: spermatogenic failure 18
            term:
              id: MONDO:0054615
              label: spermatogenic failure 18
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dnah1_mouse_flagellar_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does the Dnah1 ferf1 mouse model the human MMAF flagellar phenotype at all, or only the
          downstream infertility - and is the divergence a species difference or an allele-class difference?
        attaches_to:
        - pathophysiology#Multiple Morphological Abnormalities of the Sperm Flagella
        - animal_models#Mouse
        rationale: 'The Dnah1 ferf1 allele produces infertility with apparently normal sperm morphology
          and a zona-penetration block, whereas human biallelic DNAH1 loss produces gross flagellar malformation
          with inner dynein arm loss. The model therefore reproduces the clinical endpoint by a route
          that may not be the human one. Because ferf1 is a missense allele and the best-characterised
          human genotypes are protein-null, the divergence could be allele class rather than species -
          a distinction that determines whether the model is usable for studying human flagellar morphogenesis.
          The missense-versus-null framing is itself not decisive: a separate constitutive Dnah1 knockout
          is described with reduced motility and no TEM-detectable axonemal defect, which is also unlike
          the human ultrastructural phenotype, so a null allele does not obviously rescue the comparison.
          That knockout is not cited here because its primary description was not verified in this round.
          The ferf1 source paper makes the general point, noting that DNAH1 mutations across mouse and
          human give a diversity of phenotypes with both subtle and considerable differences.'
      selected_evidence:
        snippet: the various mutations affecting the DNAH1 protein in both mouse and human produce a diversity
          of phenotypes with both subtle and considerable differences
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
