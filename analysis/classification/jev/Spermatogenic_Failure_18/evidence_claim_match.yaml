            term:
              id: MONDO:0054615
              label: spermatogenic failure 18
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: flagellum_specific_dynein_requirement
        hypothesis_label: DNAH1 is required by the sperm flagellum but largely dispensable in motile cilia,
          which is why SPGF18 is not primary ciliary dyskinesia
        status: EMERGING
        description: 'DNAH1 encodes an axonemal dynein heavy chain and is expressed in ciliated cells
          beyond the testis, so biallelic loss would be expected to produce primary ciliary dyskinesia
          - chronic sinopulmonary disease, otitis media, possible situs inversus. It does not. In the
          original 20-subject cohort, infertility was the only PCD feature observed. The proposed explanation
          is that DNAH1''s contribution to the motile cilium is redundant, covered by other inner-arm
          dynein heavy chains, while the sperm flagellum has no such redundancy.

          The evidence is an absence of reported respiratory disease rather than a systematic ciliary
          assessment, and the cohorts are small, so this is recorded as EMERGING. Distinguishing genuine
          tissue-specific redundancy from mild or unascertained ciliary disease would require nasal nitric
          oxide measurement or ciliary beat analysis in genotyped men, which no published study reports.

          There is also direct counter-evidence. Two sisters with clinically diagnosed PCD carry a homozygous
          DNAH1 missense variant segregating completely with the phenotype, and OMIM recognises a separate
          DNAH1 ciliary dyskinesia entity (CILD37) on that basis. That does not overturn the tissue-specific-redundancy
          reading - the alleles differ and the SPGF18 cohorts genuinely lack ciliary disease - but it
          does mean the redundancy cannot be a property of losing DNAH1 as such, and that a DNAH1 finding
          cannot be used to rule ciliary disease out.'
      selected_evidence:
        snippet: Although DNAH1 is also expressed in other ciliated cells, infertility was the only symptom
          of primary ciliary dyskinesia observed in affected subjects, suggesting that DNAH1 function
          in cilium is not as critical as in sperm flagellum.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
