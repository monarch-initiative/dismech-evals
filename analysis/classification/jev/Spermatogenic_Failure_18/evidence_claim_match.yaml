          term:
            id: MONDO:0033204
            label: ciliary dyskinesia, primary, 37
        distinguishing_features:
        - Same gene, different presentation, and this is the differential that matters most for SPGF18.
          Two sisters from a consanguineous family with clinically diagnosed PCD carry a homozygous DNAH1
          missense variant segregating with the phenotype, and OMIM assigns CILD37 to DNAH1 on that basis.
        - Chronic sinopulmonary disease - recurrent respiratory infection progressing to permanent lung
          damage - is present in CILD37 and absent from every reported SPGF18 patient. Respiratory history,
          not genotype, is what separates them.
        - 'A DNAH1 result therefore does not settle which entity is present. The entities were reached
          from opposite directions: SPGF18 from male-infertility cohorts screened for MMAF, CILD37 from
          a PCD family in whom all known genes had been excluded. Whether they are allele-specific outcomes
          of one gene or an ascertainment artefact is not resolved.'
      selected_evidence:
