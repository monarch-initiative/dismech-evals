      assertion_type: Pathophysiology
      assertion:
        name: Loss of the DNAH1 Inner-Arm Dynein Heavy Chain
        description: 'DNAH1 encodes an inner dynein arm heavy chain expressed in testis. Both truncating
          and missense routes converge on absence or dysfunction of the protein in sperm: in a donor-splice-site
          case neither transcript nor protein was detectable, and in the recurrent East Asian frameshift
          the protein was undetectable by Western blot and immunofluorescence even though DNAH1 mRNA was
          still present in spermatozoa - so loss of protein, not loss of transcript, is the common endpoint.'
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: Neither the transcript nor the protein was observed in this individual, confirming the
          pathogenicity of this variant.
        supports: SUPPORT
