          precise structural role in mammalian sperm is not established: it carries predicted Armadillo-type
          repeats, and its Chlamydomonas orthologue is associated with the C1b projection of the central
          apparatus, so it is treated here as a structural component of the axoneme.'
        biological_scale: MOLECULAR
