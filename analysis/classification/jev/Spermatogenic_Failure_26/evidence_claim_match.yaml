        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of TSGA10 Protein
        description: Frameshift, splice-site and missense variants all leave spermatozoa without detectable
          TSGA10. The frameshift alleles truncate the protein, the splice variant produces a truncated
          protein at very low level, and the Leu371Pro missense variant abolishes both mRNA and protein
          in sperm. TSGA10 is normally found at the sperm midpiece. In mouse testis the 65-kDa spermatid
          protein is processed to a 27-kDa fibrous sheath protein.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: TSGA10
          term:
            id: hgnc:14927
            label: TSGA10
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: TSGA10 is a testis-specific protein that localized to the midpiece in the spermatozoa
          of a normal control; however, immunostaining failed to detect TSGA10 protein in the patient's
          sperm. Western blot analysis also showed complete absence of TSGA10 protein in the patient.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
