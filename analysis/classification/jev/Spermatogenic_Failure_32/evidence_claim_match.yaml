              label: spermatogenic failure 32
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Spermatogonial Differentiation
        description: 'Without SOHLH1, spermatogonia keep proliferating but do not progress to spermatocytes;
          SOHLH1 and SOHLH2 normally repress stem-cell maintenance genes such as Gfra1 and induce differentiation
          genes. This is shown in knockout mice; it has not been examined directly in human testis. GO
          has no spermatogonial differentiation term: an OLS search of GO for "spermatogonial differentiation"
          returned only CL:0000015, and searches for "spermatogonial cell" and "spermatogonium" returned
          GO:0007284 spermatogonial cell division and germline stem-cell division terms, which describe
          division rather than differentiation. The node is therefore bound to the parent process GO:0007283
          spermatogenesis.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: spermatogonium
          term:
            id: CL:0000020
            label: spermatogonium
        biological_processes:
        - preferred_term: spermatogonial differentiation
          modifier: DECREASED
          term:
            id: GO:0007283
            label: spermatogenesis
      selected_evidence:
        snippet: Loss of Sohlh1 causes infertility by disrupting spermatogonial differentiation into spermatocytes.
        supports: SUPPORT
