        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SOHLH1 Transcription Factor Loss of Function
        description: The c.346-1G>A splice-acceptor variant activates a cryptic acceptor in exon 4 and
          produces SOHLH1 with a truncated bHLH domain. In the homozygous patient, SOHLH1 protein was
          reduced in testicular tissue. The molecular function bound here is SOHLH1's GO annotation (GO:0000981,
          ISA, GO_REF:0000113 in QuickGO for UniProt Q5JUK2); loss of transcription-factor activity was
          shown as failed KIT-promoter activation in transfected cells, not measured in patients.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: SOHLH1
          term:
            id: hgnc:27845
            label: SOHLH1
        molecular_functions:
        - preferred_term: bHLH DNA-binding transcription factor activity
          modifier: DECREASED
          term:
            id: GO:0000981
            label: DNA-binding transcription factor activity, RNA polymerase II-specific
      selected_evidence:
        snippet: Analysis of transcripts from minigenes carrying the c.346-1G>A revealed that splicing
          site variation leads to the partial deletion at a cryptic splicing site within exon 4. This
          deletion results in SOHLH1 with a truncated bHLH domain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20506135
      reference_title: Mutations in SOHLH1 gene associate with nonobstructive azoospermia.
      evidence_source: IN_VITRO
      explanation: Minigene assay showing the splice defect and bHLH truncation.
