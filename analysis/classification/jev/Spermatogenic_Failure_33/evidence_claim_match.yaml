      assertion:
        hypothesis_group_id: cfap251_tubb4b_slc25a4_recruitment
        hypothesis_label: CFAP251 recruits TUBB4B and SLC25A4 to the developing sperm flagellum
        status: EMERGING
        description: A single 2026 study found that CFAP251 binds the beta-tubulin TUBB4B and the mitochondrial
          ADP/ATP carrier SLC25A4 (testis pull-down with mass spectrometry, co-immunoprecipitation in
          vitro, and structural modelling), that both proteins are reduced in Cfap251 knockout testis
          and along knockout sperm flagella, and that their flagellar immunofluorescence is reduced in
          sperm of two men with homozygous CFAP251 splice variants. The authors propose that CFAP251 is
          a scaffold needed to incorporate both proteins into the flagellum, which would add a tubulin-supply
          and an energy-transport component to the radial spoke 3 defect. It has not been replicated,
          and no experiment separates the contribution of these two proteins from that of radial spoke
          loss.
      selected_evidence:
        snippet: Co-IP assays demonstrated strong interactions between TUBB4B, SLC25A4, and CFAP251 in
          vitro (Figure 6F and G)
        supports: SUPPORT
