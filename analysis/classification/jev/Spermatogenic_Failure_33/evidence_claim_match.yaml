        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced TUBB4B and SLC25A4 Recruitment to the Sperm Flagellum
        description: Co-immunoprecipitation and mass spectrometry of mouse testis identified the beta-tubulin
          TUBB4B and the mitochondrial ADP/ATP carrier SLC25A4 as CFAP251 partners, and both co-immunoprecipitate
          with CFAP251 in vitro. In elongating spermatids both colocalize with tubulin, and in mature
          sperm TUBB4B is enriched in the principal piece and SLC25A4 in the midpiece. Both proteins are
          reduced in Cfap251 knockout testis and along knockout sperm flagella, and their flagellar signal
          is reduced in sperm of men with CFAP251 splice variants. The authors propose that CFAP251 is
          a scaffold for the stable incorporation of TUBB4B and SLC25A4 into the flagellum; this rests
          on one study.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: TUBB4B
