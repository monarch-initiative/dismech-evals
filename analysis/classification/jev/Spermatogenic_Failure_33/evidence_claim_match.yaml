      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cfap251_sperm_restricted
        hypothesis_label: CFAP251 loss causes isolated male infertility rather than primary ciliary dyskinesia
        status: CANONICAL
        description: CFAP251 is expressed in both testis and airway, but almost all reported patients
          have isolated infertility, and a health questionnaire for PCD manifestations was negative in
          the founder-deletion cohort. In 2026 one patient with a homozygous splice variant was reported
          with tinnitus, a seasonal cough and chest CT changes (increased lung markings and a pulmonary
          bulla), and Cfap251 knockout mice had frequent loss of inner dynein arms in tracheal cilia.
          The human evidence for a respiratory phenotype is a single patient without ciliary biopsy, beat
          analysis or nasal nitric oxide, so the PCD-like phenotype is unconfirmed, and it is not recorded
          as a disease phenotype here.
      selected_evidence:
        snippet: All subjects had an isolated MMAF phenotype and no mention of any other PCD symptoms.
        supports: SUPPORT
