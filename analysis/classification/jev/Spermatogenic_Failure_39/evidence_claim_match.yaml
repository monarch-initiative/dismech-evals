      assertion:
        hypothesis_group_id: sperm_specific_dnah17_oda
        hypothesis_label: DNAH17 is a sperm-specific outer dynein arm heavy chain, so its loss causes
          isolated male infertility rather than primary ciliary dyskinesia
        status: CANONICAL
        description: DNAH17 and DNAH8 are found along the sperm axoneme but not in respiratory cilia,
          which use DNAH5, DNAH9 and DNAH11 instead. Patients therefore keep respiratory ODAs and have
          no ciliary disease. Two small reports of DNAH17 variants in individuals with laterality defects
          are the only evidence against this, and neither includes functional data.
      selected_evidence:
        snippet: We show that DNAH17 and DNAH8, but not DNAH5, DNAH9, or DNAH11, colocalize with α-tubulin
          along the sperm axoneme, whereas the reverse picture is observed in respiratory cilia, thus
          explaining the phenotype restricted to sperm cells.
        supports: SUPPORT
