  206458c13e280bce4b61e03817ca9420798750f8e4026259a04b5ecaf7b4d6e3:
    claim:
      about:
        disease:
          name: Spermatogenic failure 43
          disease_term:
            preferred_term: Spermatogenic failure 43
            term:
              id: MONDO:0032898
              label: spermatogenic failure 43
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: spgf43_reproductive_versus_pcd_spectrum
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is SPEF2-related spermatogenic failure a distinct entity from SPEF2-related primary ciliary
          dyskinesia, or is every biallelic SPEF2 man a PCD patient whose airway disease was or was not
          looked for?
        attaches_to:
        - pathophysiology#SPEF2 Loss of Function
        - pathophysiology#Male Infertility
        rationale: 'This is the central nosological question for the entry and it is left open deliberately.
          The evidence points both ways and the two directions are not symmetrical in strength.

          Toward one spectrum. In the cohort that took a respiratory history systematically, all six biallelic
          SPEF2 men had PCD-like symptoms — recurrent airway infections, bronchitis and rhinosinusitis
          — and the authors explicitly framed their result as bridging MMAF and PCD. That cohort is the
          load-bearing one, because it was ascertained on severe asthenozoospermia alone; a later series
          in which all three men had infertility with PCD or likely PCD was ascertained on both features
          together, so its 3/3 is a description of who was recruited rather than an independent frequency.
          The whole-animal bgh mouse has full PCD, not isolated infertility. ClinGen''s Motile Ciliopathy
          expert panel applied the Lumping and Splitting criteria and lumped all SPEF2 disease into primary
          ciliary dyskinesia. And the standard PCD diagnostic algorithm cannot exclude airway disease
          in a central pair defect, so an infertility proband called PCD-negative on nasal nitric oxide,
          electron microscopy and high-speed videomicroscopy has not really been cleared.

          Toward two entities. At least one proband was reported in the confirmed absence of respiratory
          features rather than merely without them being looked for. There is also a genuine tissue-level
          dissociation: in the same men, respiratory cilia keep a normal 9+2 axoneme while sperm flagella
          are 9+0, which the authors read as SPEF2 having different roles in the two tissues. A transcript
          explanation has been proposed — that alleles hitting only the long testis-expressed transcripts
          give isolated infertility while alleles hitting broadly expressed isoforms add airway disease
          — and it is not hand-waving: the naturally occurring immotile short-tail sperm defect of Finnish
          Yorkshire pigs is exactly that, an intronic SPEF2/KPL2 insertion whose aberrantly spliced exon
          is expressed predominantly in testis, giving a sperm-restricted disease with cilia elsewhere
          unaffected. What has not been done is testing it against the human genotypes, so it is cited
          here as a plausible and precedented mechanism rather than curated as this disease''s mechanism.

          What this entry does about it. dismech curates SPGF43 as its own record while recording the
          divergence from ClinGen rather than leaving it implicit. MONDO retains both concepts — MONDO:0032898
          for SPGF43 and MONDO:0016575 for PCD — and dismech entries are keyed to MONDO concepts, so curating
          SPGF43 is not an assertion that ClinGen is wrong about gene-disease validity, which is a different
          question from disease-concept granularity. The same call was made for CFAP54 in Spermatogenic_Failure_98,
          on the same reasoning. If MONDO merges the two terms, this entry should be merged with them.'
        proposed_experiments:
        - experiment_id: exp_spgf43_respiratory_phenotyping_of_infertility_probands
          name: Respiratory phenotyping of SPEF2 infertility probands
          description: Systematically assess reported and newly identified SPEF2 infertility probands
            for airway disease using methods that work in central pair defects — structured respiratory
            history, high-speed video microscopy and immunofluorescence for SPEF2 in respiratory cells
            — rather than the standard algorithm, which returns normal nasal nitric oxide and normal electron
            microscopy in this defect class.
        - experiment_id: exp_spgf43_transcript_stratified_genotype_comparison
          name: Transcript-stratified comparison of infertility-only and PCD genotypes
          description: 'Test the proposed transcript explanation directly: map every reported SPEF2 allele
            onto the long testis-specific and the broadly expressed transcripts, and ask whether transcript
            coverage separates probands with isolated infertility from those with airway disease, or whether
            the genotypes overlap.'
      selected_evidence:
        snippet: Notably, all six patients exhibited PCD-like symptoms, including recurrent airway infections,
          bronchitis, and rhinosinusitis.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31942643
      reference_title: 'Novel mutations in SPEF2 causing different defects between flagella and cilia
        bridge: the phenotypic link between MMAF and PCD.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'The strongest evidence for one spectrum: when respiratory history was taken systematically
        in a SPEF2 infertility cohort, every man had airway symptoms.'
