              label: spermatogenic failure 43
        context: []
      assertion_type: Genetic
      assertion:
        name: SPEF2
        gene_term:
          preferred_term: SPEF2
          term:
            id: hgnc:26293
            label: SPEF2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        frequency: 2 of 42 MMAF probands in the founding cohort; separately 4 of 45 families with severe
          asthenozoospermia
        notes: 'SPEF2 (5p13.2) encodes a component of the C1b projection of the ciliary and flagellar
          central pair apparatus that also links cargo to cytoplasmic dynein 1 during spermiogenesis.
          Reported yields are 2 of 42 Han Chinese MMAF probands in the founding cohort, 2 of 50 in a second
          Han Chinese MMAF cohort plus one Iranian proband from a separate cohort, and 4 of 45 unrelated
          Chinese families ascertained for severe asthenozoospermia.

          Read those denominators carefully: none of them is SPGF43. They are the fraction of MMAF or
          severe-asthenozoospermia probands in whom SPEF2 was the cause, not the prevalence of SPGF43
          and not a share of SPGF43 cases — SPGF43 is by definition entirely SPEF2, so no per-gene case
          fraction applies here.

          The alleles reported to date are truncating (nonsense and frameshift), canonical splice, and
          deleterious missense, and the ones characterised in detail fall in the long testis-expressed
          transcripts that carry the IFT20-binding domain. One report suggests missense alleles may produce
          milder spermatozoal damage than truncating ones, but that observation is drawn from a series
          covering FSIP2 and SPEF2 together and is not SPEF2-specific.

          The same gene causes primary ciliary dyskinesia, where ClinGen classifies the relationship as
          Definitive. A SPEF2 genotype found in an infertility workup should therefore prompt a respiratory
          history.'
      selected_evidence:
        snippet: By screening gene variants in 42 patients with MMAF using whole exome sequencing, we
          identified the c. 12delC, c. 1745-2A > G, c. 4102 G > T and c. 4323dupA mutations in the SPEF2
          gene from two patients.
        supports: SUPPORT
