      assertion:
        name: SPEF2-related primary ciliary dyskinesia
        disease_term:
          preferred_term: primary ciliary dyskinesia
          term:
            id: MONDO:0016575
            label: primary ciliary dyskinesia
        distinguishing_features:
        - Chronic upper and lower airway disease — recurrent airway infection, bronchitis, rhinosinusitis,
          bronchiectasis. This is what separates the two presentations clinically, and it is not part
          of the reproductive phenotype curated here.
        - Situs is normal in both, so laterality does not separate them.
        - Neither does ciliary ultrastructure. Respiratory cilia in SPEF2 disease have a normal 9+2 axoneme
          even in men whose sperm flagella are 9+0, so transmission electron microscopy of respiratory
          cells cannot make the call.
        - 'The PCD presentation is not male-restricted: reported SPEF2 PCD patients include women, in
          whom the reproductive phenotype of this entry cannot arise at all.'
        description: Not merely a differential but the same gene, and ClinGen classifies the SPEF2-PCD
          relationship as Definitive. The distinction rests on respiratory history rather than on any
          ciliary assay, and the standard PCD diagnostic algorithm is known to read normal in central
          pair defects, so a man diagnosed with SPEF2 spermatogenic failure may have unrecognised airway
          disease.
      selected_evidence:
        snippet: We performed whole-exome analysis and identified novel biallelic variants of SPEF2 in
          the homozygous state (c.1860_1861insCT).
        supports: SUPPORT
