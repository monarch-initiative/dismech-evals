      assertion_type: Pathophysiology
      assertion:
        name: Impaired Manchette and Intraflagellar Cargo Transport
        biological_scale: CELLULAR
        role: central_effector
        mechanism_confidence: PROVISIONAL
        description: SPEF2 binds the intraflagellar transport protein IFT20 and cytoplasmic dynein 1,
          and localises to the Golgi complex, manchette and basal body of differentiating spermatids.
          In the male-germ-cell-specific Spef2 knockout mouse, IFT20 transport from the Golgi to the manchette
          is delayed and the manchette fails to migrate, so SPEF2 acts as a cargo linker for dynein-1-mediated
          transport along the microtubule tracks that build the tail. The human evidence for this step
          is the IFT20 and RSPH9 binding shown in a heterologous assay plus the transcript localisation
          of the patient alleles; the transport defect itself has been demonstrated in mouse rather than
          in human spermatids, which is why this node is marked PROVISIONAL rather than ESTABLISHED.
        cell_types:
        - preferred_term: spermatid
          term:
            id: CL:0000018
            label: spermatid
        biological_processes:
        - preferred_term: intraciliary transport
          modifier: DECREASED
          term:
            id: GO:0042073
            label: intraciliary transport
        cellular_components:
        - preferred_term: sperm flagellum
          term:
            id: GO:0036126
            label: sperm flagellum
      selected_evidence:
        snippet: Furthermore, we showed that SPEF2 interacts with radial spoke head component 9 (RSPH9)
          and IFT20 in vitro, which are well-studied components of radial spokes or intra-flagellar transport
          and are essential for flagellar assembly.
        supports: SUPPORT
        directness: INDIRECT
