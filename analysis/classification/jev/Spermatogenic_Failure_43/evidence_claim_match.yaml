      assertion_type: Diagnosis
      assertion:
        name: Caveat - Central Pair Defects Evade the Standard PCD Diagnostic Algorithm
        notes: 'Recorded here because it bears directly on this entry''s scope rather than on its own
          diagnosis. A man given a SPEF2 spermatogenic-failure diagnosis cannot be cleared of airway disease
          by the usual ciliary tests: in central pair defects the ciliary beating abnormality is very
          subtle, the ciliary ultrastructure is normal and situs is normal, so the standard PCD algorithm
          returns normal results. In SPEF2 disease specifically, the respiratory cilia of affected men
          have a normal 9+2 axoneme even while their sperm flagella do not. Assessing for PCD therefore
          rests on respiratory history and on immunofluorescence for SPEF2 in respiratory cells, not on
          electron microscopy.'
      selected_evidence:
        snippet: However, it is difficult to establish a diagnosis in individuals with PCD and central
          pair (CP) defects, and alternative strategies are required because of very subtle ciliary beating
          abnormalities, a normal ciliary ultrastructure, and normal situs composition.
        supports: SUPPORT
