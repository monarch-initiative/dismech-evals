              label: spermatogenic failure 46
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: sperm_restricted_dnah8_oda
        hypothesis_label: DNAH8 is the sperm-specific gamma heavy chain of the outer dynein arm, so its
          loss causes isolated male infertility rather than primary ciliary dyskinesia
        status: CANONICAL
        description: 'Sperm and respiratory cilia build their outer dynein arms from different heavy chains:
          DNAH8 and DNAH17 in sperm, DNAH5 with DNAH9 or DNAH11 in respiratory cilia. DNAH8 is therefore
          needed in the sperm flagellum but not in motile cilia. In patients the evidence is clinical
          (normal situs and no PCD symptoms), not a formal ciliary work-up such as nasal nitric oxide
          or ciliary beat analysis.'
      selected_evidence:
        snippet: We show that DNAH17 and DNAH8, but not DNAH5, DNAH9, or DNAH11, colocalize with α-tubulin
          along the sperm axoneme, whereas the reverse picture is observed in respiratory cilia, thus
          explaining the phenotype restricted to sperm cells.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
