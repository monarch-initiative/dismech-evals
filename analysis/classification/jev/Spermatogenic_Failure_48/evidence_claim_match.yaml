            term:
              id: MONDO:0030846
              label: spermatogenic failure 48
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: M1AP Loss of Function
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: Biallelic frameshift, splice and exon-deletion variants remove or truncate M1AP.
          The only molecular activity demonstrated for M1AP is binding to the ZZS proteins SHOC1, TEX11
          and SPO16, shown by co-immunoprecipitation for the mouse and the human proteins. Truncated M1AP
          proteins modelled on patient alleles no longer bind TEX11, so the disease alleles abolish the
          one activity the protein is known to have.
        notes: 'The molecular function is bound to GO:0005515 protein binding because that is the activity
          the literature demonstrates and nothing more specific is supported. On 2026-10-15 QuickGO returned
          only GO:0005515 protein binding and GO:0042802 identical protein binding as molecular-function
          annotations for UniProtKB:Q8TC57, and PMID:37459509 describes M1AP as a conserved protein of
          unknown biochemical function. GO:0044877 protein-containing complex binding was considered and
          not used: PMID:40374915 shows each ZZS protein binding M1AP independently in pairwise co-expression,
          not binding to an assembled complex. An adaptor-activity term was also not used, since reduced
          TEX11 recruitment shows M1AP is needed for recruitment but not that it bridges TEX11 to another
          molecule. Unlike interaction-screen hits, these bindings are targeted experiments, and their
          loss is the disease mechanism.'
        genes:
        - preferred_term: M1AP
          term:
            id: hgnc:25183
            label: M1AP
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          description: Germline biallelic truncating, splice and exon-deletion variants; the recurrent
            allele is c.676dup (p.Trp226LeufsTer4).
        molecular_functions:
        - preferred_term: binding to the ZZS proteins SHOC1, TEX11 and SPO16
          modifier: DECREASED
          term:
            id: GO:0005515
            label: protein binding
      selected_evidence:
        snippet: We demonstrated that the deletion of the last 97 amino acids of M1AP (~ 18% of the protein)
          is already sufficient to completely abolish the binding of M1AP and TEX11 implying that for
          the protein-protein interaction the full-length protein of M1AP is mandatory.
        supports: SUPPORT
