      assertion_type: Treatment
      assertion:
        name: Testicular sperm extraction with intracytoplasmic sperm injection
        description: Nothing restores spermatogenesis, but the arrest is incomplete, so sperm can sometimes
          be recovered from the ejaculate or by testicular sperm extraction and used for ICSI. One cohort
          reported a TESE success rate of 40%, and a multicentre study reported up to 50% for M1AP carriers.
          Of the four men in that cohort who attempted ICSI, one fathered a healthy, euploid child using
          ejaculated sperm; the other attempts failed at fertilisation or embryo development. Because
          few crossovers form, aneuploid sperm are a theoretical concern that has not been measured.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Intracytoplasmic Sperm Injection
          term:
            id: NCIT:C185482
            label: Intracytoplasmic Sperm Injection
      selected_evidence:
        snippet: the proportion of cases with successful sperm recovery is up to 50% for patients carrying
          M1AP LP/P mutations
