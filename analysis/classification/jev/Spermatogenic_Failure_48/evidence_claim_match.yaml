        biological_scale: CELLULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: M1AP localises to the chromosome axes of spermatocytes in a SPO16-dependent manner
          and colocalises with TEX11. Its loss leaves SHOC1 in place but reduces the TEX11 recruited to
          recombination intermediates, by about two thirds in the one human spermatocyte spread analysed.
          The ZZS complex is not abolished, which distinguishes this lesion from loss of SHOC1, TEX11
          or SPO16 themselves, where TEX11 foci are absent.
        cell_types:
        - preferred_term: primary spermatocyte
          term:
            id: CL:0000656
            label: primary spermatocyte
      selected_evidence:
        snippet: M1AP deficiency significantly reduced the recruitment of TEX11 to the axes
        supports: SUPPORT
