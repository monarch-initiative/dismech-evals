      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cfap91_motile_cilia_involvement
        hypothesis_label: CFAP91 loss affects sperm flagella but spares other motile cilia
        status: EMERGING
        description: CFAP91 is part of the RS3 base in respiratory and ependymal cilia as well as sperm.
          No respiratory phenotype has been reported in patients, but the human report could only be read
          as an abstract, so absence was not confirmed. In Cfap91 knockout mice, tracheal and ependymal
          cilia grow normally on a mixed background, whereas on the B6D2 background knockouts were under-represented
          and died before 8 weeks, which the authors attributed, without confirming it, to hydrocephalus.
          In Tetrahymena, CFAP91 loss severely disrupts ciliary beating. Whether CFAP91 loss affects human
          motile cilia is therefore unresolved.
      selected_evidence:
        snippet: However, there were no apparent differences found between Cfap91+/- and Cfap91-/- mice
          (Supplementary Fig. 3e), indicating that ciliary elongation was endurable in Cfap91-/- mice
          in contrast to disrupted sperm flagellum formation.
        supports: SUPPORT
