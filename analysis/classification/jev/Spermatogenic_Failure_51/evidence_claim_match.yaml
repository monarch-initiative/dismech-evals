        description: The CSC (CFAP61, CFAP91 and CFAP251 with calmodulin) sits at the base of radial spoke
          3 and links it to the doublet microtubules. Loss of any one subunit destabilizes the others.
          Without CFAP91, CFAP251 and LRRC23 are not incorporated into the sperm flagellum, CFAP251 is
          reduced in patient sperm, and in Tetrahymena the RS3 base and the base of RS2 are not stably
          docked.
        biological_scale: MOLECULAR
        cellular_components:
