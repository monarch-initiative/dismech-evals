        - preferred_term: Radial spoke base 3
          term:
            id: GO:0120342
            label: radial spoke base 3
      selected_evidence:
        snippet: Using a transgenic rescue model expressing FLAG- and BioID2-tagged CFAP91, we reveal
          that CFAP91 immunoprecipitates with RS3 proteins CFAP251 and LRRC23, whose localization is disrupted
          in Cfap91 KO sperm flagella.
        supports: SUPPORT
