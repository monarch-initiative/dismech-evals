              id: MONDO:0030522
              label: spermatogenic failure 64
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of FBXO43 Inhibition of the APC/C
        description: FBXO43 (EMI2) binds the APC/C and holds its ubiquitin ligase activity in check during
          meiosis. In patient testis a homozygous nonsense allele removed the protein. Truncating and
          missense alleles both made FBXO43 less stable in transfected cells and broke its binding to
          APC3, the APC/C substrate-recognition subunit, while binding to APC2, APC6 and APC8 was kept.
          In Xenopus eggs, the C-terminal tail of EMI2 blocks the APC/C by occupying the APC10 site that
          the E2 enzyme Ube2S needs.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: FBXO43
          term:
            id: hgnc:28521
            label: FBXO43
        molecular_functions:
        - preferred_term: ubiquitin ligase inhibitor activity
          modifier: DECREASED
          term:
            id: GO:1990948
            label: ubiquitin ligase inhibitor activity
        - preferred_term: anaphase-promoting complex binding
          modifier: DECREASED
          term:
            id: GO:0010997
            label: anaphase-promoting complex binding
      selected_evidence:
        snippet: FBXO43 was absent from testicular tissue of the proband, and FBXO43-immunostaining signals
          were invisible in the affected seminiferous tubules.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
