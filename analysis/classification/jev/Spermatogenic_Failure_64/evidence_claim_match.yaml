      assertion:
        name: FBXO43
        notes: FBXO43 encodes EMI2, also called XErp1, a paralogue of EMI1 (FBXO5). Its C-terminal region,
          including the zinc-binding region, carries the APC/C inhibitory function. Reported male alleles
          are p.Gln583* (homozygous), p.Gly664Asp (homozygous), p.Trp532*/p.Ser577Leufs*11 and p.Pro641Leu/p.Arg660Gln
          (both compound heterozygous). Truncating alleles go with azoospermia and missense alleles with
          sperm present.
        gene_term:
          preferred_term: FBXO43
          term:
            id: hgnc:28521
            label: FBXO43
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: The results here demonstrate the pathogenicity of this loss-of-function mutation
        supports: SUPPORT
