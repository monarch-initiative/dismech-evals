          value:
            name: CCDC62
            association: Causal
            gene_term:
              preferred_term: CCDC62
              term:
                id: hgnc:30723
                label: CCDC62
            notes: 'Patient GL-13 carried a homozygous nonsense variant c.442C>T (p.Gln148*) in CCDC62,
              in a ~9 Mb region of homozygosity, identified by exome sequencing of 15 men with unexplained
              globozoospermia (PMID:31985809). He was of Lebanese origin from a consanguineous family,
              with one infertile male cousin, and also carried homozygous variants of uncertain significance
              in CCDC73, NRIP3 and ATP8A2, which the authors judged unlikely to be causative. His globozoospermia
              type and any ICSI outcome were not reported. The premature stop precedes a second homozygous
              missense variant (p.His283Tyr) and is predicted to trigger nonsense-mediated decay, so the
              authors treat the nonsense allele as the likely cause. No patient sperm or testis material
              was available for functional validation. The gene-disease relationship is otherwise supported
              by mouse genetics: the repro29 ENU nonsense allele and an independent CRISPR knockout, joined
              by complementation (PMID:28339613). Human evidence is limited to this single proband; no
              ClinGen gene-disease validity classification exists for this pair. A common CCDC62-region
              polymorphism (rs12817488) has been studied as a Parkinson disease risk locus; that is a
              separate, unrelated association.'
          role: ancestor
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: The analysis revealed homozygous nonsense mutations in ZPBP and CCDC62 in two unrelated
