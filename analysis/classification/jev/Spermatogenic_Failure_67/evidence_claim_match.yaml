  8034a1e96f7369bb4606c243f62e90c1987b74cdce9843a1ba8db7fdff9df3f5:
    claim:
      about:
        disease:
          name: Spermatogenic Failure 67
          disease_term:
            preferred_term: spermatogenic failure 67
            term:
              id: MONDO:0030718
              label: spermatogenic failure 67
        context: []
      assertion_type: Treatment
      assertion:
        name: ICSI with artificial oocyte activation
        description: There is no therapy that restores spermatogenesis. Acrosome-deficient (globozoospermic)
          sperm fail to fertilise oocytes naturally and often fail to activate the oocyte even after intracytoplasmic
          sperm injection (ICSI), because round-headed sperm lack normal oocyte-activating capacity. Artificial
          oocyte activation with a calcium ionophore is used to overcome this fertilisation failure, and
          a healthy live birth has been reported after calcium-ionophore activation of round-headed sperm.
          No ICSI/AOA outcome has been reported for a CCDC62-genotyped patient; the efficacy data come
          from general round-headed-sperm/globozoospermia populations, so this management is applied at
          the phenotype level. The globozoospermia case report (PMID:32318024) used a calcium ionophore
          without naming the specific compound; ionomycin is named here from the separate ionomycin-AOA
          study (PMID:41462321).
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: ICSI with calcium-ionophore artificial oocyte activation
          term:
            id: NCIT:C185482
            label: Intracytoplasmic Sperm Injection
          therapeutic_agent:
          - preferred_term: ionomycin (calcium ionophore for oocyte activation)
            term:
              id: CHEBI:63954
              label: ionomycin
      selected_evidence:
        snippet: These results indicate that calcium ionophore treatment can assist oocyte activation
          in patients with round-headed sperm, but its efficiency to activate oocytes is lower than that
          induced by a normal sperm injection.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32318024
      reference_title: Comparison of Human Oocyte Activation Between Round-Headed Sperm Injection Followed
        by Calcium Ionophore Treatment and Normal Sperm Injection in a Patient With Globozoospermia.
      evidence_source: HUMAN_CLINICAL
      explanation: Calcium-ionophore AOA assists fertilisation of oocytes by globozoospermic sperm, with
        lower efficiency than normal sperm.
