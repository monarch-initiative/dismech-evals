        publication: PMID:28339613
        description: The repro29 ENU line carries a nonsense mutation in Ccdc62 exon 6 producing a truncated
          protein. Homozygous males are infertile with deformed, poorly motile sperm. A complementation
          cross with a CRISPR Ccdc62 knockout confirms that the infertility is caused by the Ccdc62 mutation.
        modeled_mechanisms:
        - target: Impaired Acrosome Biogenesis
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: CCDC62 loss disrupts acrosome formation in spermatids, with deformed sperm, the
            mechanism proposed for the human disease.
          limitations: The human phenotype rests on a single proband; mouse spermiogenesis defects may
            be more complete than the human presentation, and acrosome ultrastructure was not compared
            directly across species.
      selected_evidence:
        snippet: Male repro29/repro29 mice generated by the Reproductive Genomics Program at the Jackson
          Laboratory were infertile with deformed sperm and poor motility
        supports: SUPPORT
