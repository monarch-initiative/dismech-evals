        status: CANONICAL
        description: Patients in three Pakistani families were questioned for PCD features and had none,
          and Cfap61 knockout mice are infertile without PCD-like symptoms. The organ-specific axoneme
          stabilization role proposed for CFAP61 would explain why sperm, but not respiratory cilia, are
          affected. In Tetrahymena, loss of the orthologue does alter ciliary waveform, so a subtle ciliary
          defect in humans has not been excluded; no ciliary ultrastructure or nasal nitric oxide data
          from patients are available.
      selected_evidence:
        snippet: In this study, we recruited three unrelated Pakistani families, having 11 primary infertile
          individuals diagnosed with MMAF without manifesting any primary ciliary dyskinesia (PCD) symptoms.
