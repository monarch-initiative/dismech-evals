      assertion_type: Pathophysiology
      assertion:
        name: Uncoupling of Meiotic Telomeres from Cytoplasmic Dynein
        description: In meiotic prophase I, telomeres attach to the inner nuclear membrane through SUN1,
          and KASH5 links SUN1 across the envelope to cytoplasmic dynein, for which it is an activating
          adaptor; KASH5 also binds the kinesin KIF5B. In Kash5-null mouse spermatocytes telomeres still
          attach to the envelope, but they are no longer coupled to the microtubule motors that move them
          and cluster them into the meiotic bouquet.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Primary spermatocyte
          term:
            id: CL:0000656
            label: primary spermatocyte
        biological_processes:
        - preferred_term: Meiotic telomere clustering
          term:
            id: GO:0045141
            label: meiotic telomere clustering
          modifier: DECREASED
        molecular_functions:
        - preferred_term: Dynein complex binding
          term:
            id: GO:0070840
            label: dynein complex binding
          modifier: DECREASED
      selected_evidence:
        snippet: 'We show that the meiosis-specific nuclear-envelope protein KASH5 is a dynein activating
          adaptor: KASH5 directly binds dynein using a mechanism conserved among activating adaptors and
          converts dynein into a processive motor.'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35703493
