        context: []
      assertion_type: Pathophysiology
      assertion:
        name: KASH5 Loss of Function
        description: Biallelic KASH5 variants remove the protein or keep it out of the nuclear envelope.
          A homozygous frameshift abolishes KASH5 in the patient's testis. The missense p.Leu197Pro in
          the coiled-coil domain blocks nuclear envelope distribution of KASH5 and with it the nuclear-envelope
          enrichment of its partner SUN1. The transmembrane-domain variant p.Leu535Gln misroutes KASH5
          to mitochondria in cultured cells, and a splice-site variant reported in women with ovarian
          insufficiency weakens nuclear envelope localization and SUN1 binding. Splice-site variants found
          in a man with meiotic arrest cause exon skipping in minigene assays.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: KASH5
          term:
            id: hgnc:26520
            label: KASH5
        molecular_functions:
        - preferred_term: Dynein light intermediate chain binding
          term:
            id: GO:0051959
            label: dynein light intermediate chain binding
          modifier: DECREASED
        cellular_components:
        - preferred_term: Meiotic LINC complex
          term:
            id: GO:0034993
            label: meiotic nuclear membrane microtubule tethering complex
      selected_evidence:
        snippet: This rare missense mutation with lesions in the conserved CC domain of CCDC155 blocked
          nuclear envelope (NE) distribution and subsequently prevented NE-specific enrichment of Sad1-
          and UNC84-domain-containing 1 either ex vivo or in vitro
        supports: SUPPORT
