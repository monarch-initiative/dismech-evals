      assertion_type: Genetic
      assertion:
        name: CFAP57
        association: Causal
        gene_term:
          preferred_term: CFAP57
          term:
            id: hgnc:26485
            label: CFAP57
        notes: 'Reported alleles: homozygous nonsense p.R913* and p.R958* (Pakistani families), p.R1084X
          (Chinese) and p.R1075* (Emirati), all in the long-isoform-specific region, and compound heterozygous
          missense p.V447A with p.R619H (Chinese), which lie in the region shared with the short isoform;
          that proband had no evidence of PCD on clinical evaluation, so the shared-region location of
          a variant does not on its own predict respiratory disease. ClinGen classifies CFAP57 only for
          primary ciliary dyskinesia (Limited, AR), a different disease, so no validity tier is recorded
          for this entry.'
      selected_evidence:
        snippet: Whole-exome sequencing and Sanger sequencing identified 2 cilia and flagella associated
          protein 57 (CFAP57) loss-of-function mutations (c.2872C>T, p. R958*; and c.2737C>T, p. R913*)
          recessively segregating with male infertility.
        supports: SUPPORT
