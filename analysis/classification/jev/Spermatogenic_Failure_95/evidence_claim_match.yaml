              label: spermatogenic failure 95
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cfap57_isoform_specificity
        hypothesis_label: Truncations confined to the long CFAP57 isoform cause isolated MMAF, while variants
          affecting both isoforms can cause primary ciliary dyskinesia
        status: EMERGING
        description: The long isoform (1,250 aa) is required in sperm; the short isoform (698 aa), which
          retains most WD repeats, is expressed in testis and nasal epithelium and is proposed to sustain
          respiratory cilia. All reported MMAF nonsense variants lie in the long-isoform-specific region,
          and the men carrying them have had no PCD. The one CFAP57 PCD patient carries a variant in exon
          11, shared by both isoforms, and his fertility was not reported. Two points do not fit cleanly.
          A compound heterozygous MMAF proband carries missense variants (p.V447A, p.R619H) in the region
          shared with the short isoform, yet clinical evaluation found no evidence of PCD; the authors
          read this as selective impairment of the long isoform, which would mean that a variant's position
          in the shared region does not by itself predict loss of short-isoform function, and that missense
          changes may spare the short isoform where the exon 11 skip in the PCD patient does not. Separately,
          one Pakistani proband reported occasional breathing difficulty but was not examined.
      selected_evidence:
        snippet: Notably, the patient exhibited no signs of primary ciliary dyskinesia (PCD), suggesting
          that the mutation selectively affects the sperm-specific isoform of CFAP57.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
