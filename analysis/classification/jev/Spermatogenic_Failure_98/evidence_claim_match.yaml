  99cad37a39bba3b55f08cd48a660513617b192cd2fc7a0e1dc9a12ec4f80448c:
    claim:
      about:
        disease:
          name: Spermatogenic failure 98
          disease_term:
            preferred_term: Spermatogenic failure 98
            term:
              id: MONDO:0700290
              label: spermatogenic failure 98
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: CFAP54-related primary ciliary dyskinesia
        disease_term:
          preferred_term: primary ciliary dyskinesia 54
          term:
            id: MONDO:0100607
            label: ciliary dyskinesia, primary, 54
        distinguishing_features:
        - Chronic upper and lower airway disease — recurrent sinusitis, bronchitis, otitis media, bronchiectasis
          — with or without hydrocephalus. None of this is part of the infertility presentation.
        - Situs is normal in both, so situs inversus does not separate them.
        - 'The usual discriminating ciliary tests do not separate them either: nasal nitric oxide, transmission
          electron microscopy and high-speed videomicroscopy are all normal in C1d-defective PCD, and
          PICADAR scoring is unreliable. The distinction therefore rests on clinical respiratory history
          rather than on any ciliary assay.'
        description: 'Not merely a differential but the same gene. Biallelic CFAP54 variants also cause
          primary ciliary dyskinesia, and C1d-defective PCD is notoriously hard to detect: it presents
          with normal situs, normal nasal nitric oxide, normal ciliary ultrastructure on transmission
          electron microscopy and normal high-speed videomicroscopy, and the PICADAR clinical prediction
          tool does not reliably identify it. A man diagnosed with CFAP54 spermatogenic failure could
          therefore have unrecognised airway disease that every standard PCD test would have called normal.'
      selected_evidence:
        snippet: Careful evaluation revealed that C1d-defective primary ciliary dyskinesia is associated
          with normal situs composition, normal nasal nitric oxide production rates, normal ciliary ultrastructure
          by transmission electron microscopy and normal ciliary beating by high-speed videomicroscopy
          analysis.
