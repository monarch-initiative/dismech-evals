      assertion_type: Genetic
      assertion:
        name: CFAP54
        gene_term:
          preferred_term: CFAP54
          term:
            id: hgnc:26456
            label: CFAP54
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        frequency: 3 of 334 MMAF/NOA probands; separately 1 of 167 primary-infertility probands
        notes: 'CFAP54 encodes a C1d projection component of the ciliary and flagellar central microtubule
          apparatus; its Chlamydomonas orthologue is FAP54. Three unrelated men were found among 334 Han
          Chinese probands with severe MMAF or NOA, giving a genotype yield of roughly 1%. Reported alleles
          include a homozygous frameshift and two compound heterozygous combinations of missense variants.
          The same gene causes primary ciliary dyskinesia, so a CFAP54 genotype found in an infertility
          workup should prompt a respiratory history.

          A second, independent cohort supports the relationship: whole-exome sequencing of 167 men with
          primary infertility identified CFAP54 among the known causative genes, in patient M827, who
          carried the compound heterozygous combination c.1540-4C>T and c.8642_8643del p.(Leu2882Phefs*7).
          That proband is worth noting for a second reason — his semen phenotype was oligoasthenozoospermia
          rather than the severe MMAF or NOA that defined the original cohort, so the reported genotype-phenotype
          range for CFAP54 infertility is wider than the founding series alone suggests.'
      selected_evidence:
        snippet: Here, we performed genetic analyses through whole-exome sequencing in a cohort of 334
          Han Chinese probands with severe MMAF or NOA.
        supports: SUPPORT
