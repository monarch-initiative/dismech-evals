    evidence_metadata:
      reference: PMID:32704025
      reference_title: Genetic interaction between central pair apparatus genes CFAP221, CFAP54, and SPEF2
        in mouse models of primary ciliary dyskinesia.
      evidence_source: MODEL_ORGANISM
      explanation: The CFAP54-SPEF2 double homozygote aborts spermiogenesis, supporting the node's claim
        that loss of this central apparatus component destabilises the wider flagellar assembly machinery.
        Two caveats travel with this evidence. SPEF2 localises to the C1b projection, not C1d, so the
        interaction is between distinct projections of the same central apparatus rather than within one
        complex. And the double homozygote's sperm phenotype is not more severe than the single mutants'
        - the paper states it "is not dissimilar to the spermatogenesis phenotype observed in single nm1054,
        bgh, or Cfap54gt/gt mutants". The paper's severity language concerns mortality, hydrocephalus
        and airway disease, which are not this entry's node.
