  bda265710b79d6cbf3e586a928963ea327cecfd7156d271e01b7f26baca81ca5:
    claim:
      about:
        disease:
          name: Spermatogenic failure 98
          disease_term:
            preferred_term: Spermatogenic failure 98
            term:
              id: MONDO:0700290
              label: spermatogenic failure 98
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: spgf98_isolated_infertility_versus_pcd_spectrum
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is CFAP54-related spermatogenic failure a distinct entity from CFAP54-related primary
          ciliary dyskinesia, or are the infertility probands simply PCD patients whose airway disease
          was never looked for?
        attaches_to:
        - pathophysiology#CFAP54 Loss of Function
        - pathophysiology#Male Infertility
        rationale: 'This is the central nosological question for this entry and it is deliberately left
          open. CFAP54 causes both isolated spermatogenic failure and PCD, and the Cfap54 mouse has full
          PCD — hydrocephalus, mucus accumulation and male infertility together — rather than infertility
          alone. The men in the infertility cohort were ascertained through a reproductive clinic, so
          a respiratory phenotype would not necessarily have been sought or recorded. What makes this
          more than a bookkeeping question is that C1d-defective PCD is specifically invisible to the
          standard diagnostic algorithm: normal situs, normal nasal nitric oxide, normal transmission
          electron microscopy, normal high-speed videomicroscopy, and unreliable PICADAR scoring. A man
          could therefore be correctly diagnosed with CFAP54 infertility while having genuinely undetected
          airway disease. The alternative explanation — that specific alleles or residual function separate
          an infertility-only phenotype from full PCD — is equally untested.

          ClinGen''s Motile Ciliopathy Gene Curation Expert Panel went further than leaving this open,
          and this entry diverges from them deliberately rather than silently. Applying the ClinGen Lumping
          & Splitting criteria, the panel found the molecular mechanism and mode of inheritance consistent
          across unrelated patients and the phenotypic variability to represent a spectrum rather than
          separate entities, and therefore lumped all inherited CFAP54 disease into a single entity, Primary
          Ciliary Dyskinesia 54 (MONDO:0100607, OMIM:621125). dismech nonetheless curates SPGF98 as its
          own entry, for three reasons. First, MONDO retains both terms — MONDO:0700290 for SPGF98 and
          MONDO:0100607 for PCD54 — and dismech entries are keyed to MONDO concepts, so curating SPGF98
          is not an assertion that ClinGen is wrong about gene-disease validity, which is a different
          question from disease-concept granularity. Second, ClinGen''s own narrative on the same record
          leaves the specific sub-question this discussion asks unresolved (quoted below), so the lumping
          conclusion and the open boundary question coexist in one document. Third, the differential diagnosis
          and `distinguishing_features` on this entry point explicitly at PCD54, so a reader who accepts
          ClinGen''s lumping can traverse to it; the split costs nothing in navigability. If MONDO merges
          the two terms, this entry should be merged with them.

          Their leaving the sub-question open is the strongest available evidence that it is genuinely
          unresolved rather than merely unexamined here. Their review adds one fact that partly cuts against
          the undiagnosed-PCD reading: the proband in the study this entry is built on was examined carefully,
          including CT scanning, and had no obvious PCD symptoms. That is a real negative finding, though
          the panel notes respiratory ciliary structure and function were not investigated in either infertility
          study, so a subtle phenotype is not excluded.'
        proposed_experiments:
        - experiment_id: exp_spgf98_respiratory_phenotyping_of_infertility_probands
          name: Respiratory phenotyping of CFAP54 infertility probands
          description: Systematically assess reported and newly identified CFAP54 infertility probands
            for airway disease using methods that work in C1d-defective PCD — ciliary transport assays
            and clinical history — rather than the standard algorithm that is known to return normal results
            in this PCD type.
        - experiment_id: exp_spgf98_genotype_stratified_comparison
          name: Genotype comparison between infertility-only and PCD cohorts
          description: Compare the CFAP54 alleles reported in infertility-only probands against those
            in PCD probands, testing whether allele class or predicted residual function separates the
            two presentations or whether the genotypes overlap.
      selected_evidence:
        snippet: It remains unclear if these patients might have subtle respiratory phenotypes or if spermatogenic
          failure alone may be part of the spectrum of disease seen in CFAP54 patients.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: CGGV:assertion_f16ea0ce-7d5d-4bdc-92fe-52d111913161-2025-07-16T070000.000Z
      reference_title: CFAP54 / ciliary dyskinesia, primary, 54 (Strong)
      evidence_source: OTHER
      explanation: ClinGen's expert panel states this exact question as unresolved, confirming it is a
        genuine open question rather than a gap local to this entry.
