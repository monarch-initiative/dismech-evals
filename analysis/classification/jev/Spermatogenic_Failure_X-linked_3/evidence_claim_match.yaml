        status: EMERGING
        description: 'Men in the infertility cohorts had no PCD features, and Cfap47 knockout mice are
          otherwise healthy. Against this, three men with hemizygous missense variants and PCD-like disease
          (bronchiectasis, sinusitis, otitis media, low nasal nitric oxide and reduced or abnormal airway
          cilia) have been reported from one centre. That evidence is weak: the variants are missense,
          pathogenicity predictions were divergent for one, functional data are limited to reduced mRNA
          and staining, and one of the men fathered two children naturally.'
