  76a7206e037c1a5c0f4c74fc37395f5d6c85360175635e08a27ca667ace31651:
    claim:
      about:
        disease:
          name: Sphingosine Phosphate Lyase Insufficiency Syndrome
          disease_term:
            preferred_term: Sphingosine phosphate lyase insufficiency syndrome
            term:
              id: MONDO:0033203
              label: nephrotic syndrome 14
        context: []
      assertion_type: Genetic
      assertion:
        name: SGPL1
        gene_term:
          preferred_term: SGPL1
          term:
            id: hgnc:10817
            label: SGPL1
        relationship_type: CAUSATIVE
        notes: 'Biallelic loss-of-function variants in SGPL1 (10q22.1; sphingosine-1-phosphate lyase 1)
          cause SPLIS. More than 45 disease-associated variants have been reported, including missense,
          nonsense, frameshift, splice-site and in-frame deletion alleles; all tested alleles reduce or
          abolish protein and/or enzyme activity, and several missense variants mislocalise the protein.
          The recurrent p.Arg222Gln (c.665G>A) allele accounts for roughly 20-30% of patients, is associated
          with isolated glucocorticoid deficiency and a milder course, and is pyridoxine-responsive in
          vitro and in some patients.

          '
        variants:
        - name: c.665G>A (p.Arg222Gln)
          description: 'The most common SPLIS allele, present in roughly 20-30% of reported patients.
            Molecular modelling suggests it distorts the dimer interface; the residual enzyme is stabilised
            by pyridoxal 5''-phosphate cofactor supplementation, and homozygotes show longer survival
            and a preponderance of isolated glucocorticoid deficiency.

            '
          type: missense
          clinical_significance: PATHOGENIC
        - name: c.1513C>T (p.Arg505*) and c.934delC (p.Leu312Phefs*30)
          description: 'Homozygous truncating variants identified in two consanguineous families with
            congenital nephrotic syndrome, hypogonadism and prenatally detected adrenal calcifications;
            associated with markedly elevated blood and fibroblast S1P.

            '
          type: nonsense
          clinical_significance: PATHOGENIC
        - name: p.Tyr416Cys, p.Arg340Trp, p.Ser346Ile and p.Arg222Trp (recurrent severe alleles)
          description: 'Together with p.Arg222Gln these four recurrent missense alleles account for three
            quarters of reported cases. They carry a genotype-severity signal: no patient homozygous for
            p.Ser346Ile (a Moroccan founder allele) or p.Arg222Trp (Turkish ancestry) survived, with median
            age at last report under six months, whereas p.Arg222Gln homozygotes survive into later childhood.

            '
          type: missense
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: In 7 families with SRNS and facultative ichthyosis, adrenal insufficiency, immunodeficiency,
          and neurological defects, we identified 9 different recessive mutations in SGPL1, which encodes
          sphingosine-1-phosphate (S1P) lyase. All mutations resulted in reduced or absent SGPL1 protein
          and/or enzyme activity.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28165339
      reference_title: Mutations in sphingosine-1-phosphate lyase cause nephrosis with ichthyosis and
        adrenal insufficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: One of the three simultaneous 2017 gene-discovery reports establishing SGPL1 as causative.
