          stimulation. In patients this manifests as glucocorticoid deficiency in early childhood, with
          mineralocorticoid deficiency in about a third, and prenatally detectable adrenal calcification
          in some. The intermediate steps by which sphingolipid accumulation disrupts adrenal development
          and steroidogenesis are not established.

          '
