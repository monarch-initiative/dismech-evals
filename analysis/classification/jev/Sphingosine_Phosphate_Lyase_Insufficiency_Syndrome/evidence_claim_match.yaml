  6d6e848af7ca4544148646c0734946df9a0efaa0ed414ba1e27fe086338905fd:
    claim:
      about:
        disease:
          name: Sphingosine Phosphate Lyase Insufficiency Syndrome
          disease_term:
            preferred_term: Sphingosine phosphate lyase insufficiency syndrome
            term:
              id: MONDO:0033203
              label: nephrotic syndrome 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sphingoid Base Phosphate and Sphingolipid Accumulation
        description: 'Without the lyase, S1P, sphingosine, ceramides and sphingomyelin accumulate in plasma,
          urine and cells. S1P is a bioactive signalling lipid acting through five G-protein-coupled S1P
          receptors and intracellular targets, so the accumulation is not inert storage but excessive
          signalling. Metabolic labelling shows that cells partly buffer S1P by feedback-inhibiting de
          novo synthesis and diverting ceramide into glycosphingolipids; pathological intracellular S1P
          accumulation emerges when these compensations are overwhelmed, and Sgpl1-null kidneys show pronounced
          S1P enrichment and urinary excretion.

          '
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: sphingolipid catabolic process
          term:
            id: GO:0030149
            label: sphingolipid catabolic process
          modifier: DECREASED
        - preferred_term: sphingosine-1-phosphate receptor signaling pathway
          term:
            id: GO:0003376
            label: sphingosine-1-phosphate receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: Metabolic stable isotope labeling revealed that SPL deficiency does not invariably result
          in S1P accumulation. Instead, SPL-deficient cells maintain near-normal S1P levels through (a)
          feedback regulation of de novo sphingolipid synthesis via the ORMDL-ceramide axis and (b) increased
          diversion of excess ceramides into glycosphingolipids.
        supports: SUPPORT
