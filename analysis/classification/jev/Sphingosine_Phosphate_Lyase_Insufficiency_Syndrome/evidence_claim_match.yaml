      assertion_type: ProgressionInfo
      assertion:
        phase: Later-onset and R222Q-associated milder course
        notes: Patients whose nephropathy is diagnosed at or after one year of age, and those homozygous
          for p.Arg222Gln, survive substantially longer; kidney transplantation extends survival. Time
          from onset of proteinuria to end-stage kidney disease ranges from under one month to five years.
      selected_evidence:
        snippet: Among those diagnosed at or after age one (n = 18), ~ 70% were alive 2 years after diagnosis,
          and 72% were living at time of last report. SPLIS patients homozygous for the SPL R222Q variant
          survived longer compared to patients with other genotypes. Kidney transplantation significantly
          extended survival outcomes.
        supports: SUPPORT
