          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Open Neural Placode Exposure and Secondary Injury
        biological_scale: TISSUE
        subtypes:
        - Myelomeningocele
        description: 'The "two-hit" mechanism proposed to explain the paralysis of myelomeningocele: the
          primary failure of neurulation (hit one) leaves the neural placode exposed to the amniotic cavity
          for the remainder of gestation, where chemical injury from amniotic fluid and mechanical trauma
          from fetal movement (hit two) causes progressive erosion, necrosis, and loss of neurons and
          axons beyond what congenital myelodysplasia alone would produce. This is the mechanistic rationale
          for in-utero surgical repair, which aims to halt the second hit rather than reverse the first.'
        biological_processes:
        - preferred_term: cell death (necrosis)
          term:
            id: GO:0008219
            label: cell death
          modifier: INCREASED
