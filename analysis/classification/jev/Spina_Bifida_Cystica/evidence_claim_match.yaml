      assertion_type: Inheritance
      assertion:
        name: Multifactorial polygenic inheritance
        inheritance_term:
          preferred_term: Polygenic inheritance
          term:
            id: HP:0010982
            label: Polygenic inheritance
        description: 'Nonsyndromic spina bifida cystica does not follow a Mendelian pattern. Heritability
          is substantial (60-70%) but reflects a polygenic background of common and rare variants (MTHFR,
          VANGL1/VANGL2, the 22q11.2/CRKL deletion, and others) interacting with environmental factors
          (folate status, anticonvulsant exposure, maternal diabetes, maternal obesity) rather than a
          single causal gene -- consistent with this entry''s own `category: Complex`. Sibling recurrence
          risk is markedly elevated over general-population prevalence but far below Mendelian expectation.'
      selected_evidence:
        snippet: The genetic component is estimated at 60-70%, but few causative genes have been identified
          to date, despite much information from mouse models.
        supports: SUPPORT
