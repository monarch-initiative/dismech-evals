          - preferred_term: VANGL2
            term:
              id: hgnc:15511
              label: VANGL2
          allele_type: missense
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
      selected_evidence:
        snippet: In a protein-protein interaction assay V239I abolished interaction of VANGL1 protein
