            description: Herniation of a cerebrospinal-fluid-filled meningeal sac (dura and arachnoid)
              through the posterior spina bifida defect, usually covered by skin of variable thickness.
              The spinal cord and nerve roots are generally not incorporated into the sac and function
              normally, though a tethered cord may coexist. Most commonly lumbar or sacral. This is the
              less common and clinically milder of the two forms.
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Skin-Covered Meningeal Herniation
        biological_scale: TISSUE
        subtypes:
        - Meningocele
        description: In meningocele, the vertebral arch defect and meningeal herniation occur without
          exposure or incorporation of the neural placode, which remains covered by an intact (if sometimes
          dysplastic or ulcerated) layer of skin. Because neural tissue is not directly exposed to the
          intrauterine environment, the "two-hit" secondary injury that drives myelomeningocele paralysis
          does not apply, and neurological examination is often normal; a tethered cord can still cause
          delayed deficits.
      selected_evidence:
        snippet: Closed spinal lesions are generally less severe and can be asymptomatic, as with spina
          bifida occulta which is considered a variant of normal. However, lumbosacral spinal cord tethering
          may be present in spinal dysraphism, and can lead to lower limb motor and sensory deficits,
          and a neuropathic bladder.
        supports: SUPPORT
