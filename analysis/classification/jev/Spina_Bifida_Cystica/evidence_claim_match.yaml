          -- more severe obesity confers greater risk -- and is mechanistically distinct from the folate
          pathway: unlike folate insufficiency, obesity-associated risk is not consistently rescued by
          folic acid supplementation. Suggested underlying mechanisms include aberrant maternal glucose
          control, oxidative stress, and metabolic syndrome, though the precise pathway remains uncertain.'
      selected_evidence:
