        name: Planar Cell Polarity Pathway Disruption
        biological_scale: CELLULAR
        role: trigger
        description: Rare missense variants in the core planar-cell-polarity (PCP) genes VANGL1 and VANGL2
          -- the human orthologs of the Drosophila Van Gogh/ Strabismus gene and of the mouse Looptail
          (Lp) locus -- impair non-canonical Wnt/PCP signaling. This pathway drives convergent extension,
          the coordinated mediolateral cell intercalation that narrows and elongates the neural plate;
          its disruption is a well-established genetic contributor to neural tube defects in both animal
          models and human cohorts, found in an estimated 1-3% of patients.
        biological_processes:
        - preferred_term: Wnt/planar cell polarity signaling pathway
