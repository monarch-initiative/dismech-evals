          anterior-horn owl-eye signal, cord edema, or associated vertebral-body infarction.
      selected_evidence:
        snippet: MRI disclosed hyperintense pencil-like lesion pattern on T2WI in 98.2%, cord swelling
          in 40%, enhancement on post-contrast T1WI in 42.9% and always hyperintense signal on diffusion-weighted
          imaging (DWI) when acquired.
        supports: SUPPORT
