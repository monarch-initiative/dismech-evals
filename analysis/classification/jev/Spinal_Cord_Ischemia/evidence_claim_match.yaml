      assertion:
        name: Rare and likely underrecognized spinal cord stroke
        description: Spinal cord infarction is a rare vascular event and the available epidemiology is
          incomplete, with diagnostic underrecognition likely because acute ischemic myelopathy can mimic
          other acute and subacute myelopathies.
      selected_evidence:
        snippet: Spinal cord infarction (SCI) of arterial origin is a rare vascular event, and its incidence
          is probably underestimated.
        supports: SUPPORT
