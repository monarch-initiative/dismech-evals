  b7baf771ede5654da4abf76d47b1aeaf91ef3cd93e379b38e82a779dbe4b8b8f:
    claim:
      about:
        disease:
          name: Spinal Muscular Atrophy
          disease_term:
            preferred_term: spinal muscular atrophy
            term:
              id: MONDO:0001516
              label: spinal muscular atrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_sma_microrna_primary_vs_secondary
        prompt: Is early microRNA accumulation in SMA (specifically miR-128-3p dysregulation) a primary
          pathogenic initiating event upstream of SMN-driven motor neuron degeneration, or a secondary
          consequence of SMN deficiency? The temporal relationship between SMN loss and microRNA dysregulation
          remains mechanistically unclear. Additionally, does the miR-128-3p→Hipk2 regulatory axis contribute
          directly to motor neuron injury, or does it represent a downstream marker of broader RNA metabolism
          dysfunction?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#SMN Protein Deficiency
        - pathophysiology#Motor Neuron Degeneration
        rationale: The SMN1 deficiency in SMA leads to widespread disruption in RNA metabolism, including
          dysregulation of microRNAs. PMID:42260294 demonstrates that early microRNA accumulation in SMA
          mouse spinal cords can contribute to molecular dysfunctions and "may represent an initiating
          event in pathogenesis." However, whether microRNA dysregulation is an upstream driver of pathology
          or a secondary consequence of SMN loss remains unresolved. The specific miR-128-3p inhibitor
          was shown to interfere with flunarizine-induced neurite outgrowth in vitro, and Hipk2 was identified
          as a novel miR-128-3p target, suggesting a potentially druggable axis. Determining the causal
          vs. reactive nature of this dysregulation is critical for mechanism-based therapeutic design.
        proposed_experiments:
        - experiment_id: exp_sma_temporal_microrna_smn
          name: Temporal kinetics of SMN loss versus microRNA dysregulation in SMA models
          description: Use inducible SMN degradation (degron) systems in mouse SMA models or patient-derived
            fibroblasts to establish the temporal relationship between SMN protein depletion and miR-128-3p
            accumulation. Measure SMN levels, miR-128-3p expression, Hipk2 mRNA/protein, and early neurite
            outgrowth markers at precise time intervals to determine whether miR-128-3p elevation precedes,
            follows, or is concurrent with SMN loss. If microRNA changes precede motor neuron degeneration,
            this would support a primary pathogenic role; if reactive, therapeutic targeting must address
            upstream SMN deficiency.
          experiment_type:
            preferred_term: temporal kinetics study with molecular markers
          model_systems:
          - name: Inducible SMN degradation SMA mouse model
            description: Mouse expressing an SMN-degron fusion allowing rapid, controlled SMN depletion
              via doxycycline or other degron system, enabling precise temporal measurement of downstream
              molecular events (miR-128-3p, Hipk2, neurodevelopmental markers).
            experimental_model_type: OTHER
        - experiment_id: exp_sma_microrna_inhibition_rescue
          name: miR-128-3p inhibition rescue of motor neuron degeneration in vivo
          description: Test whether early inhibition of miR-128-3p (e.g., with antagomiR or ASO blocking
            miR-128-3p) in presymptomatic or early symptomatic SMA mouse models rescues motor neuron survival
            and delays disease progression independently of SMN restoration. Measure motor neuron counts,
            motor function (rotarod, grip strength), lifespan, and spinal miRNA levels. If miR-128-3p
            inhibition provides significant rescue without restoring SMN, this would indicate a primary
            pathogenic role; limited/no rescue would suggest secondary status.
          experiment_type:
            preferred_term: antisense oligonucleotide or antagomiR in vivo efficacy
          model_systems:
          - name: SMA mouse model with locked miR-128-3p inhibitor
            description: Severe SMA mouse model (Smn1-/-; Smn2 transgene) treated with miR-128-3p antagomiR
              or locked nucleic acid (LNA) inhibitor delivered neonatally or in early postnatal period
              to assess whether miRNA inhibition alone can modify motor neuron and behavioral phenotypes.
            experimental_model_type: OTHER
        - experiment_id: exp_sma_hipk2_axis_causality
          name: Hipk2-dependent vs. independent effects of miR-128-3p in motor neurons
          description: Generate motor neurons (iPSC-derived or transgenic mouse neurons) with miR-128-3p
            overexpression, and compare phenotypes in isogenic Hipk2-wildtype vs. Hipk2-knockout backgrounds.
            If Hipk2 loss fully rescues miR-128-3p overexpression phenotypes, this indicates Hipk2 is
            the canonical target mediating miRNA toxicity. Evaluate neurite outgrowth, synaptic markers,
            and cell viability. Discordant rescue would suggest off-target effects of miR-128-3p.
          experiment_type:
            preferred_term: isogenic genetic background comparison in iPSC-derived neurons
          model_systems:
          - name: Human iPSC-derived motor neurons with miR-128-3p and Hipk2 perturbations
            description: Motor neurons differentiated from patient-derived SMA iPSCs or gene-edited controls,
              with CRISPR/Cas9-mediated knockout or overexpression of miR-128-3p and Hipk2 to dissect
              the regulatory axis in a disease-relevant human cellular context.
            experimental_model_type: IPSC_DERIVED_MODEL
      selected_evidence:
        snippet: early microRNA accumulation in spinal cords of SMA models can contribute to molecular
          dysfunctions and may represent an initiating event in pathogenesis
        supports: SUPPORT
