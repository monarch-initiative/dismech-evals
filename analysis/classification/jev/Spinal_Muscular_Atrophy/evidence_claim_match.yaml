  92e633fedba88ada918602d527e06fce0e6585a20b52af7c77feec517679aad4:
    claim:
      about:
        disease:
          name: Spinal Muscular Atrophy
          disease_term:
            preferred_term: spinal muscular atrophy
            term:
              id: MONDO:0001516
              label: spinal muscular atrophy
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_smn1_deficiency_motor_neuron_degeneration_model
        hypothesis_label: Canonical SMN1 Deficiency / SMN Protein Loss / Motor Neuron Degeneration Model
        status: CANONICAL
        description: Spinal muscular atrophy (SMA) is caused by biallelic loss-of-function variants in
          SMN1 on 5q13, most commonly homozygous SMN1 exon 7 deletion. SMN1 encodes the ubiquitously expressed
          Survival of Motor Neuron (SMN) protein, which functions in snRNP biogenesis, axonal mRNA transport,
          and neuromuscular junction development. SMA severity is inversely modified by SMN2 copy number
          — a near-identical paralog that produces predominantly an unstable, exon-7-skipped transcript
          (SMN-Δ7) but generates a low level of full-length SMN. SMN deficiency selectively kills alpha
          motor neurons in the anterior horn of the spinal cord, producing progressive symmetric weakness,
          hypotonia, and respiratory failure. Three FDA-approved therapies — nusinersen (intrathecal antisense
          oligonucleotide enhancing SMN2 exon 7 inclusion), onasemnogene abeparvovec (AAV9-SMN1 gene therapy,
          single intravenous infusion), and risdiplam (oral small-molecule SMN2 splicing modifier) — definitively
          validate the SMN-deficiency axis as the canonical pathogenic mechanism.
        notes: 'Retained as CANONICAL with important scope qualifiers. The 2026 falcon hypothesis-search
          report (kb/hypotheses/Spinal_Muscular_Atrophy/canonical_smn1_deficiency_motor_neuron_degeneration_model;
          openscientist timed out at 3600s) finds SUPPORTED. The core biallelic SMN1 loss → SMN protein
          deficiency → motor-neuron degeneration axis is strongly validated: 226/229 patients show complete
          SMN1 absence; >95% have homozygous SMN1 deletions/mutations; SMN2 copy number inversely correlates
          with severity via the canonical ~90% exon-7 skipping rule-of-thumb. Three FDA-approved SMN-restoring
          therapies (nusinersen, risdiplam, onasemnogene abeparvovec) provide compelling causal validation.
          Two important qualifications: (1) SMA is a MULTI-SYSTEM disorder — non-neuronal involvement
          in skeletal muscle, heart, mitochondria, and other tissues is now documented; (2) SMN restoration
          is NOT FULLY REVERSIBLE — particularly when treatment is post-symptomatic, residual musculoskeletal,
          metabolic/mitochondrial, and possibly glial/inflammatory pathology persists. Recent syntheses
          broaden SMA pathogenesis from a purely motor-neuron-autonomous model to a systemic framework
          involving SMN''s roles in snRNP biogenesis, translation, endocytosis, and cellular homeostasis.
          Newborn-screening + pre-symptomatic AAV9-SMN1 gene therapy yields the strongest phenotypic rescue,
          supporting the canonical SMN-deficiency axis but also indicating that timing within a developmental
          window matters more than restoration sufficiency alone.'
      selected_evidence:
        snippet: SMA is caused by mutations in a single gene, the Survival of Motor Neuron 1 (SMN1) gene.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
