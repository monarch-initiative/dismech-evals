          system. These disturbances affect cortical and cerebellar networks, conferring vulnerability
          to higher-order brain functions including cognition, expressive language, executive function,
          social communication, and behavioral regulation. Even with early disease-modifying therapy,
          developmental constraints and limited plasticity of specific neural circuits can leave persistent
          neurodevelopmental vulnerabilities.

          '
