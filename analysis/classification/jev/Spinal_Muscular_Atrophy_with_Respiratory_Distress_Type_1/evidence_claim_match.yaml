        context: []
      assertion_type: Pathophysiology
      assertion:
        name: IGHMBP2 Helicase Deficiency
        description: 'Biallelic loss-of-function variants in IGHMBP2 reduce or abolish the function of
          an ATP-dependent 5''->3'' DNA/RNA helicase of superfamily 1 (UPF1-like) that associates with
          ribosomes in the cytoplasm and colocalizes with the RNA-processing machinery. The deficiency
          is thought to impair pre-mRNA processing and ribosomal translation/biogenesis required for motor
          neuron maintenance and integrity. Most SMARD1-causing missense mutations cluster in the helicase
          domain.

          '
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: mRNA processing
          term:
            id: GO:0006397
            label: mRNA processing
          modifier: DECREASED
        - preferred_term: Ribosomal translation
          term:
            id: GO:0006412
            label: translation
          modifier: DECREASED
      selected_evidence:
        snippet: Like the SMN1 product, IGHMBP2 colocalizes with the RNA-processing machinery in both
          the cytoplasm and the nucleus.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
