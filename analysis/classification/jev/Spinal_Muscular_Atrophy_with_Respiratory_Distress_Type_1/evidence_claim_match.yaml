      assertion_type: DifferentialDiagnosis
      assertion:
        name: SMN1-related spinal muscular atrophy type 1 (Werdnig-Hoffmann)
        description: 'Classic infantile proximal SMA caused by biallelic SMN1 loss. Both present with
          infantile hypotonia, weakness, and motor neuron loss, but SMN1-SMA begins proximally and relatively
          spares the diaphragm, whereas SMARD1 begins distally with early diaphragmatic palsy.

          '
        disease_term:
          preferred_term: spinal muscular atrophy, type 1
          term:
            id: MONDO:0009669
            label: spinal muscular atrophy, type 1
        distinguishing_features:
        - SMN1-SMA begins proximally; SMARD1 weakness begins distally.
        - SMN1-SMA has a bell-shaped chest with paradoxical respiration from intercostal palsy and relative
          diaphragmatic sparing.
        - SMARD1 has a normal-shaped thorax with early neurogenic diaphragmatic palsy and hemidiaphragm
          eventration.
        - SMARD1 has biallelic IGHMBP2 variants with normal SMN1.
      selected_evidence:
        snippet: Spinal muscular atrophy with respiratory distress (SMARD) is clinically and genetically
          distinct from SMA.
        supports: SUPPORT
