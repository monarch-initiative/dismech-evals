        inheritance:
        - name: Autosomal Recessive
        notes: 'Biallelic loss-of-function variants in IGHMBP2 (immunoglobulin mu DNA binding protein
          2; chromosome 11q13.2-q13.4), encoding an ATP-dependent 5''->3'' DNA/RNA helicase, cause SMARD1
          (dSMA1 / HMNR1 / dHMN6). Most SMARD1-causing missense mutations lie in the helicase domain.
          IGHMBP2 is allelic to the milder Charcot-Marie-Tooth disease type 2S. SMN1 is normal, distinguishing
          SMARD1 from SMN1-related proximal SMA.

          '
      selected_evidence:
