      assertion:
        name: Diaphragmatic and Phrenic Motor Failure
        description: 'Degeneration of the phrenic nerve and its motor neurons causes neurogenic diaphragmatic
          palsy, manifest radiographically as eventration (abnormal elevation) of the right or both hemidiaphragms—a
          highly suggestive sign of SMARD1—and clinically as respiratory distress and failure requiring
          mechanical ventilation between 6 weeks and 6 months of age. Unlike SMN1-related SMA, the thorax
          is normally shaped because the defect mainly involves the diaphragm.

          '
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
      selected_evidence:
        snippet: the characteristic eventration (the abnormal elevation) of the right or, less frequently,
          both hemidiaphragms, which is considered a highly suggestive sign of SMARD1
        supports: SUPPORT
