          reduced, fever or other stressors push cerebellar excitability below threshold for days at a
          time. It rests on clinical observations (fever-triggered attacks, response to acetazolamide)
          and on the known temperature sensitivity of sodium channels; it has not been tested experimentally
          in an FGF14 model.'
      selected_evidence:
        snippet: FGF14 regulates brain sodium channels, especially in the cerebellum. Sodium channels
          can be fever sensitive.
        supports: SUPPORT
