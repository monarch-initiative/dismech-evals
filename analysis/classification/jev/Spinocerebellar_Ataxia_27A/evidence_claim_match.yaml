            id: hgnc:3671
            label: FGF14
      selected_evidence:
        snippet: We describe a large, three-generation family with early-onset tremor, dyskinesia, and
          slowly progressive cerebellar ataxia, not associated with any of the known SCA loci, and a mutation
          in the fibroblast growth factor 14 (FGF14) gene on chromosome 13q34.
        supports: SUPPORT
