  150a81118d0cd21bfce36c5330be55f366d8c522a39ee1ba5612cf27c701c3c8:
    claim:
      about:
        disease:
          name: Spinocerebellar ataxia 27B
          disease_term:
            preferred_term: Spinocerebellar ataxia 27B, late-onset
            term:
              id: MONDO:0859340
              label: spinocerebellar ataxia 27B, late-onset
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Purkinje Neuron Intrinsic Excitability and Firing
        description: Intracellular FGF14 binds the C-terminus of voltage-gated sodium (Nav) channel alpha
          subunits and is concentrated at the Purkinje neuron axon initial segment, where Nav1.6-mediated
          resurgent sodium current sustains the high-frequency pacemaking that defines these cells. Loss
          of FGF14 produces a hyperpolarizing shift in the voltage dependence of steady-state Nav inactivation
          and reduced Nav1.6 availability, so Purkinje neurons fail to fire spontaneously and cannot sustain
          repetitive firing to depolarizing input. This is a functional excitability defect that precedes
          and is separable from cell death, and it is the node targeted by 4-aminopyridine.
        role: central_effector
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        notes: This node is deliberately NOT declared as conforming to "cerebellar_purkinje_degeneration#Purkinje
          Cell Calcium and Proteostasis Dysregulation". That module node models calcium-handling and proteostatic/aggregation
          stress as the amplifying step, which is the polyglutamine and calcium-channelopathy SCA pattern.
          In SCA27B the amplifying lesion is sodium-channel-dependent intrinsic excitability failure,
          with no evidence of a proteotoxic or calcium-homeostasis intermediate. Asserting conformance
          here would misrepresent the mechanism.
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        biological_processes:
        - preferred_term: neuronal action potential
          term:
            id: GO:0019228
            label: neuronal action potential
          modifier: DECREASED
        - preferred_term: membrane depolarization during action potential
          term:
            id: GO:0086010
            label: membrane depolarization during action potential
          modifier: DECREASED
        molecular_functions:
        - preferred_term: voltage-gated sodium channel activity
          term:
            id: GO:0005248
            label: voltage-gated sodium channel activity
          modifier: DECREASED
        locations:
        - preferred_term: cerebellar cortex
          term:
            id: UBERON:0002129
            label: cerebellar cortex
      selected_evidence:
        snippet: Current clamp recordings from Purkinje neurons in cerebellar slices revealed attenuated
          spontaneous firing in Fgf14(-/-) neurons. Unlike in the wild type animals, more than 80% of
          Fgf14(-/-) Purkinje neurons were quiescent and failed to fire repetitively in response to depolarizing
          current injections.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18930825
      reference_title: FGF14 regulates the intrinsic excitability of cerebellar Purkinje neurons.
