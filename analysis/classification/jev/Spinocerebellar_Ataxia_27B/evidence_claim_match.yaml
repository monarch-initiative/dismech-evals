      assertion_type: Treatment
      assertion:
        name: 4-Aminopyridine
        description: '4-Aminopyridine (4-AP), a voltage-gated potassium channel blocker, is the principal
          symptomatic therapy for SCA27B and is the mechanistically rational choice: it does not increase
          inhibitory drive onto Purkinje cells but restores the precision of Purkinje pacemaking by prolonging
          the action potential and increasing the afterhyperpolarization, counteracting the firing failure
          caused by FGF14 loss. Across cohorts, 75-86% of treated patients report clinically meaningful
          benefit, and placebo-controlled video-oculography in a small number of expansion carriers showed
          a significant reduction in downbeat nystagmus slow-phase velocity on 4-AP but not placebo. Formal
          randomised trials in genetically defined SCA27B are still awaited.'
        therapeutic_modality: SMALL_MOLECULE
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: 4-aminopyridine
            term:
              id: CHEBI:34385
              label: 4-aminopyridine
        target_phenotypes:
        - preferred_term: Downbeat nystagmus
          term:
            id: HP:0010545
            label: Downbeat nystagmus
        - preferred_term: Gait ataxia
          term:
            id: HP:0002066
            label: Gait ataxia
        notes: Response rates are drawn from retrospective and open-label real-world data plus a very
          small placebo-controlled video-oculography subset; they are not equivalent to randomised trial
