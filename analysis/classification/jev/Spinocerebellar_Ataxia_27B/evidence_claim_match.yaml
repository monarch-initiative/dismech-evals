      assertion:
        discussion_id: sca27b_pathogenic_threshold
        prompt: What is the true pathogenic threshold for the FGF14 intronic GAA expansion, and how should
          length and motif purity be combined into a single interpretive rule?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#FGF14 Intronic GAA Repeat Expansion
        rationale: 'Every major cohort has proposed a different cut-off. The discovery study supported
          (GAA)>=250 from family cosegregation; an independent Australian/German cohort concluded (GAA)>335
          is fully penetrant with (GAA)>250 likely pathogenic at reduced penetrance; GeneReviews adopts
          (GAA)>300 for a definitive diagnosis with a 250-300 reduced-penetrance zone; a downbeat-nystagmus
          cohort found (GAA)200-249 alleles enriched 15-fold over controls with an indistinguishable phenotype;
          and long-read work argues that once the repeat is known to be uninterrupted, enrichment begins
          at 180-200 repeats. The disagreement is not merely statistical: it reflects that total allele
          length is the wrong variable. The pathogenically relevant quantity appears to be the longest
          pure GAA tract, since GAAGGA/AAGGAG hexameric expansions are equally common in patients and
          controls, and mosaic interruptions that shorten the pure tract are enriched in unaffected carriers.
          No consensus interpretive rule combining these dimensions exists, so laboratories currently
          report the same allele differently.'
