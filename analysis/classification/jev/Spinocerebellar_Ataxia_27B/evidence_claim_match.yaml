            preferred_term: Spinocerebellar ataxia 27B, late-onset
            term:
              id: MONDO:0859340
              label: spinocerebellar ataxia 27B, late-onset
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sca27b_firing_failure_versus_cell_loss
        prompt: Is the clinical deficit in SCA27B driven primarily by reversible Purkinje firing failure
          or by irreversible Purkinje neuron loss, and does that balance shift over the disease course?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Purkinje Neuron Intrinsic Excitability and Firing
        - pathophysiology#Purkinje Neuron Degeneration and Cerebellar Atrophy
        rationale: 'Several observations point towards a functional rather than degenerative dominant
          mechanism: the striking episodic phase, the rapid and substantial response to 4-aminopyridine,
          the mild SARA progression rate with a plateau at moderate severity, and serum neurofilament
          light that is not elevated relative to controls. Against that, autopsy in genetically confirmed
          cases shows definite Purkinje neuron loss. If the deficit is largely a reversible channel-availability
          problem for much of the disease course, that has direct consequences for trial endpoint choice
          (symptomatic versus disease-modifying), for the therapeutic window, and for whether restoring
          FGF14 expression late in disease could help.'
        proposed_experiments:
        - experiment_id: exp_sca27b_longitudinal_nfl_volumetry
          name: Longitudinal neurofilament light and cerebellar volumetry
          description: Longitudinal serum and CSF neurofilament light measurement plus cerebellar volumetry
            in a genetically defined SCA27B cohort, testing whether a degenerative signal emerges at a
            definable disease stage.
          decision_criterion: A stage-dependent rise in neurofilament light with accelerating volume loss
            would mark the transition from functional to degenerative pathophysiology and define the therapeutic
            window.
        - experiment_id: exp_sca27b_purkinje_counts_duration
          name: Quantitative Purkinje cell counts stratified by disease duration
          description: Quantitative Purkinje cell counts correlated with disease duration across a larger
            SCA27B autopsy series than the four brains reported to date.
          decision_criterion: Substantial Purkinje loss in short-duration cases would favour early degeneration;
            preserved counts in short-duration cases would favour a primarily functional early phase.
        - experiment_id: exp_sca27b_ipsc_purkinje_rescue
          name: Rescue electrophysiology in patient-derived Purkinje-like neurons
          description: Electrophysiological characterisation of iPSC-derived Purkinje-like neurons from
            expansion carriers, testing whether restoring FGF14 expression or applying 4-aminopyridine
            rescues firing independently of any effect on survival.
          decision_criterion: Full firing rescue without a survival effect would establish the deficit
            as functional and reversible at the cellular level.
      selected_evidence:
        snippet: The principal finding on post-mortem examination of 4 brain specimens was loss of Purkinje
          neurons that was most severe in the vermis most particularly in the anterior vermis.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
