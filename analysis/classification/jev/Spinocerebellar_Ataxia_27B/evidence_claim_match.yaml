            term:
              id: MONDO:0859340
              label: spinocerebellar ataxia 27B, late-onset
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sca27b_pathogenic_threshold
        prompt: What is the true pathogenic threshold for the FGF14 intronic GAA expansion, and how should
          length and motif purity be combined into a single interpretive rule?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#FGF14 Intronic GAA Repeat Expansion
        rationale: 'Every major cohort has proposed a different cut-off. The discovery study supported
          (GAA)>=250 from family cosegregation; an independent Australian/German cohort concluded (GAA)>335
          is fully penetrant with (GAA)>250 likely pathogenic at reduced penetrance; GeneReviews adopts
          (GAA)>300 for a definitive diagnosis with a 250-300 reduced-penetrance zone; a downbeat-nystagmus
          cohort found (GAA)200-249 alleles enriched 15-fold over controls with an indistinguishable phenotype;
          and long-read work argues that once the repeat is known to be uninterrupted, enrichment begins
          at 180-200 repeats. The disagreement is not merely statistical: it reflects that total allele
          length is the wrong variable. The pathogenically relevant quantity appears to be the longest
          pure GAA tract, since GAAGGA/AAGGAG hexameric expansions are equally common in patients and
          controls, and mosaic interruptions that shorten the pure tract are enriched in unaffected carriers.
          No consensus interpretive rule combining these dimensions exists, so laboratories currently
          report the same allele differently.'
        proposed_experiments:
        - experiment_id: exp_sca27b_motif_aware_threshold
          name: Motif-aware case-control threshold derivation by long-read sequencing
          description: Long-read resequencing of a large multi-ancestry case-control set, reporting the
            longest pure GAA tract rather than total allele size, to derive a motif-aware pathogenic threshold
            with calibrated penetrance estimates.
          decision_criterion: A motif-aware rule is preferable to a length-only rule if pure-tract length
            separates cases from controls with materially higher accuracy than total allele length in
            held-out cohorts.
        - experiment_id: exp_sca27b_carrier_penetrance_cohort
          name: Prospective penetrance follow-up of intermediate-range carriers
          description: Prospective longitudinal follow-up of asymptomatic carriers of 200-300-repeat alleles
            to measure age-dependent penetrance directly rather than inferring it from cross-sectional
            case-control enrichment.
          decision_criterion: Age-stratified conversion rates would establish whether the 200-300 zone
            is genuinely reduced-penetrance pathogenic or simply a common non-pathogenic polymorphism
            enriched by ascertainment.
        - experiment_id: exp_sca27b_somatic_mosaicism_tissue
          name: Cerebellum-versus-blood somatic repeat mosaicism
          description: Systematic assay of somatic repeat mosaicism in cerebellum versus blood from the
            same individuals, since a blood-derived repeat size may not represent the size present in
            the pathogenically relevant tissue.
          decision_criterion: Substantial cerebellum-specific somatic expansion would explain why blood-based
            thresholds disagree across cohorts and would argue for tissue-adjusted interpretation.
      selected_evidence:
        snippet: while (GAA)>250 is likely pathogenic with reduced penetrance
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
