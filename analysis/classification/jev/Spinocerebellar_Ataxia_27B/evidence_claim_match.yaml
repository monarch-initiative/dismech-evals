      assertion:
        name: Autosomal dominant
        description: SCA27B is inherited in an autosomal dominant manner. Most affected individuals inherit
          the expanded FGF14 (GAA) allele from a parent who may carry a high-normal, reduced-penetrance,
          or fully pathogenic repeat; each child of an affected individual has a 50% chance of inheriting
          the allele. Penetrance is age-dependent and incomplete at shorter expansion sizes, and de novo
          generation of an expansion during meiosis has been inferred from haplotype analysis.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        parent_of_origin_effect: Repeat size is more likely to expand on maternal transmission and to
          contract on paternal transmission, an intergenerational instability that underlies variable
          anticipation within families.
      selected_evidence:
        snippet: GAA-FGF14-related ataxia is inherited in an autosomal dominant manner.
        supports: SUPPORT
