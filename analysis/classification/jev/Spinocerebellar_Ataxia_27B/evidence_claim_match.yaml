        description: 'Counseling should cover the autosomal dominant 50% transmission risk, the age-dependent
          and incomplete penetrance of shorter expansions, and the intergenerational instability of the
          repeat (expansion on maternal, and contraction on paternal, transmission). Predictive and prenatal
          testing are technically possible but prognostically limited: clinical manifestations cannot
          be predicted from a fetal repeat size, and prenatal somatic instability is not characterised.'
        therapeutic_modality: OTHER
        action_category: COUNSELING_INFORMATIONAL
