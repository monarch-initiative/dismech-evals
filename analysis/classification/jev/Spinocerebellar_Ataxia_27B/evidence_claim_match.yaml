          severity even in advanced stages (maximum SARA score: 18 points). Functional impairment increased
          relatively slowly (unilateral mobility aids after 8 years in 50% of patients). Corresponding
          to slow progression and low extra-cerebellar involvement, sNfL was not increased relative to
          controls. Concurrent second diseases (including progressive supranuclear palsy neuropathology)
          represented major individual aggravators of disease severity, constituting important caveats
          for planning future GAA-FGF14 trials.'
