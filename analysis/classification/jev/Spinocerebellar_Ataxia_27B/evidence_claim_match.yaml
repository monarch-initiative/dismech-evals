            term:
              id: MONDO:0859340
              label: spinocerebellar ataxia 27B, late-onset
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sca27b_intronic_repeat_to_expression_route
        prompt: By what molecular route does the intronic GAA expansion reduce FGF14 expression - transcriptional
          elongation blockade, R-loop formation, repressive chromatin, or another mechanism?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#FGF14 Intronic GAA Repeat Expansion
        - pathophysiology#Reduced FGF14 Expression in Cerebellar Neurons
        rationale: Reduced FGF14 RNA and protein have been demonstrated in patient postmortem cerebellum
          and patient-derived neurons, and the pathogenic tract is a GAA repeat in the first intron -
          the same sequence and genomic context as the FXN intron 1 expansion in Friedreich ataxia, where
          heterochromatin formation and transcriptional silencing are established. Whether SCA27B uses
          the same machinery, however, has not been shown. Until it is, the causal edge from expansion
          to reduced expression carries unknown intermediates, and a whole class of candidate therapeutic
          strategies (transcriptional de-repression, HDAC inhibition, R-loop modulation) cannot be rationally
          prioritised.
        proposed_experiments:
        - experiment_id: exp_sca27b_fgf14_locus_chromatin
          name: Chromatin and methylation profiling of the FGF14 locus
          description: Chromatin state and DNA methylation profiling across the FGF14 locus in expansion-carrier
            versus control cerebellum and in iPSC-derived Purkinje-like neurons.
          decision_criterion: Repressive chromatin marks or hypermethylation spreading from the repeat
            in carriers would implicate the Friedreich-ataxia-like silencing mechanism.
        - experiment_id: exp_sca27b_nascent_transcription
          name: Nascent-transcription analysis for elongation stalling at the repeat
          description: PRO-seq or TT-seq analysis of expansion-carrier versus control neurons to test
            whether RNA polymerase II stalls within FGF14 intron 1 at the GAA tract.
          decision_criterion: A carrier-specific drop in nascent transcription immediately downstream
            of the repeat would establish elongation blockade as the route.
        - experiment_id: exp_sca27b_rloop_drip
          name: R-loop mapping at the FGF14 intron 1 tract
          description: DRIP-seq for R-loop accumulation at the FGF14 intron 1 GAA tract in carrier versus
            control cells.
          decision_criterion: Carrier-specific R-loop enrichment at the repeat would implicate co-transcriptional
            R-loop formation and nominate R-loop-directed therapeutics.
        - experiment_id: exp_sca27b_derepression_rescue
          name: Test of transcriptional de-repression agents on FGF14 expression
          description: Test whether transcriptional de-repression agents with efficacy in Friedreich ataxia
            models (for example HDAC inhibitors) restore FGF14 RNA and protein in patient-derived neurons.
          decision_criterion: Restoration of FGF14 expression would both confirm a silencing mechanism
            and identify a repurposable therapeutic class.
      selected_evidence:
        snippet: Postmortem cerebellum specimens and iPSC-derived motor neurons from patients showed reduced
          expression of FGF14 RNA and protein.
        supports: SUPPORT
