  4e30192b6d3d913de8c1920c7a90e025e5a98e78c2b95f7f8250888e9453b8bb:
    claim:
      about:
        disease:
          name: Spinocerebellar ataxia 27B
          disease_term:
            preferred_term: Spinocerebellar ataxia 27B, late-onset
            term:
              id: MONDO:0859340
              label: spinocerebellar ataxia 27B, late-onset
        context: []
      assertion_type: Genetic
      assertion:
        name: FGF14
        gene_term:
          preferred_term: FGF14
          term:
            id: hgnc:3671
            label: FGF14
        association: Deep intronic (GAA) repeat expansion in intron 1 of FGF14
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Positive
        notes: 'The pathogenic lesion is a heterozygous (GAA)n repeat expansion located deep within the
          first intron of FGF14 (equivalently written (AAG)n on the opposite strand in some reports).
          Reported thresholds have shifted as cohorts have grown: the original French Canadian cosegregation
          analysis supported (GAA) >= 250; the Australian/German discovery cohort concluded (GAA) > 335
          is disease causing and fully penetrant while (GAA) > 250 is likely pathogenic with reduced penetrance;
          GeneReviews uses (GAA) > 300 for a definitive molecular diagnosis with a reduced-penetrance
          250-300 zone; and a subsequent long-read study argued that uninterrupted expansions are already
          enriched in patients from 180-200 repeats. Repeat length correlates inversely with age at onset.
          Motif purity is a key modifier: pure GAA (AAG) expansions are pathogenic, whereas GAAGGA/AAGGAG
          hexameric expansions are found equally in patients and controls, and mosaic divergent repeat
          interruptions (mDRILS) that shorten the longest pure GAA tract are more frequent in unaffected
          carriers.'
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          penetrance: INCOMPLETE
        case_fractions:
        - population: French Canadian late-onset cerebellar ataxia index patients
          case_fraction_percent: 61.0
          notes: Founder-enriched population with the highest reported SCA27B share.
        - population: German late-onset cerebellar ataxia index patients
          case_fraction_percent: 18.0
        - population: Indian late-onset cerebellar ataxia index patients
          case_fraction_percent: 10.0
      selected_evidence:
        snippet: In the six French Canadian patients, we identified a GAA repeat expansion deep in the
          first intron of FGF14, which encodes fibroblast growth factor 14.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36516086
      reference_title: Deep Intronic FGF14 GAA Repeat Expansion in Late-Onset Cerebellar Ataxia.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the causal lesion as a deep intronic GAA repeat expansion in FGF14 intron
        1.
