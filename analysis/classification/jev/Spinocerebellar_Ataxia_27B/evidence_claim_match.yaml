      assertion_type: DifferentialDiagnosis
      assertion:
        name: CANVAS
        description: 'RFC1-related CANVAS (cerebellar ataxia, neuropathy, vestibular areflexia syndrome)
          is the closest clinical mimic and the most important differential in practice. Both are late-onset
          ataxias that combine cerebellar signs with vestibular hypofunction and sensory/afferent deficits,
          so the two are separated by genotype rather than by phenotype: CANVAS is autosomal recessive,
          caused by a biallelic intronic (AAGGG)n expansion in RFC1, whereas SCA27B is autosomal dominant
          and caused by a heterozygous intronic (GAA)n expansion in FGF14. The FGF14 expansion was explicitly
          identified as an alternative genetic cause in patients with CANVAS-like syndromes who test negative
          for biallelic RFC1 expansions, so a negative RFC1 result in a CANVAS-like presentation should
          prompt FGF14 repeat sizing rather than closing the workup.'
        distinguishing_features:
        - Autosomal recessive biallelic RFC1 (AAGGG)n expansion, versus autosomal dominant heterozygous
          FGF14 (GAA)n expansion
        - Prominent sensory neuronopathy and chronic cough are characteristic of CANVAS but not of SCA27B
        - Episodic ataxia and a marked 4-aminopyridine response point towards SCA27B
        disease_term:
          preferred_term: cerebellar ataxia with neuropathy and bilateral vestibular areflexia syndrome
          term:
            id: MONDO:0044720
            label: cerebellar ataxia with neuropathy and bilateral vestibular areflexia syndrome
      selected_evidence:
        snippet: provides an alternative genetic cause in individuals with CANVAS-like syndromes negative
          for bi-allelic
        supports: SUPPORT
