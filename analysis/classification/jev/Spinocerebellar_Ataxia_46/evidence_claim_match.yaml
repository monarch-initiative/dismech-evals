  ad665224a8f6ddb2d985e6bdaaf880218455364c7abfc8226dac845aa236d46e:
    claim:
      about:
        disease:
          name: Spinocerebellar Ataxia 46
          disease_term:
            preferred_term: spinocerebellar ataxia 46
            term:
              id: MONDO:0033481
              label: spinocerebellar ataxia 46
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sca46_pld3_causality
        kind: CONTROVERSY
        attaches_to:
        - genetic#PLD3
        prompt: Is PLD3 p.Leu308Pro the cause of SCA46, or a rare variant that happens to segregate in
          a single family?
        rationale: The association rests on one family. The variant abolishes exonuclease activity in
          transfected cells, but Pld3 knockout mice have no cerebellar phenotype and PLD3 is least expressed
          in the adult cerebellum. The challengers did not dispute the genetic data itself, and a reply
          from the original authors was published (PMID:30312384). The second reported patient carries
          a different variant, has a different phenotype (early onset, hearing loss, optic atrophy), has
          an unremarkable family history and has no segregation data, so it does not settle the question.
          Additional families with PLD3 variants segregating with a late-onset sensory-cerebellar ataxia
          would.
      selected_evidence:
        snippet: While there is little doubt about the genetic data, we have concerns regarding the cell
          biology follow up experiments, particularly the localization studies and functional assay for
          PLD3 performed by Nibbeling et al.
        supports: SUPPORT
