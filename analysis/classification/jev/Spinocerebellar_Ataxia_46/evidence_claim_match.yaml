        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Cerebellar Dysfunction
        - pathophysiology#Large-Fiber Sensory Axonal Degeneration
        prompt: Why do Pld3 knockout mice lack the cerebellar phenotype, and do they have the sensory
          neuropathy that dominates the human disease?
        rationale: The knockout study examined the cerebellum and motor performance but did not report
          dorsal root ganglia or peripheral nerves, although sensory neuropathy is the predominant human
          feature. PLD4 compensation, the short mouse lifespan relative to onset after 40 in humans, and
          a possible dominant-negative action of the missense protein that a null allele would not reproduce
          could each explain the mismatch. A heterozygous L308P knock-in mouse examined for sensory nerve
          pathology in old age would address it.
      selected_evidence:
        snippet: suggest a dominant loss-of-function mechanism due to the PLD3-L308P mutation, suggesting
          that the PLD3 knockout reflects the situation observed in SCA patients.
        supports: SUPPORT
