        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mutant PLD3 Retention in the ER and Loss of Exonuclease Activity
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: Wild-type PLD3 travels to lysosomes as a type II transmembrane protein by an ESCRT-dependent
          route and is cleaved there into a stable soluble enzyme. In transfected cells the L308P protein
          instead accumulates in the endoplasmic reticulum, is barely processed and has no 5' exonuclease
          activity. These results come from overexpression in cell lines, not from patient cells.
        genes:
        - preferred_term: PLD3
          term:
            id: hgnc:17158
            label: PLD3
        molecular_functions:
        - preferred_term: 5'-3' exonuclease activity
          modifier: DECREASED
          term:
            id: GO:0008409
            label: 5'-3' exonuclease activity
        cellular_components:
        - preferred_term: endoplasmic reticulum
          term:
            id: GO:0005783
            label: endoplasmic reticulum
        - preferred_term: lysosome
          term:
            id: GO:0005764
            label: lysosome
      selected_evidence:
        snippet: In contrast, the PLD3-L308P mutation led to strikingly reduced proteolytic cleavage of
          full-length PLD3, and both the 50 kDa and 12 kDa fragment were almost completely absent
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30312375
      reference_title: PLD3 and spinocerebellar ataxia.
      evidence_source: IN_VITRO
      explanation: The mutant protein is not processed into its mature lysosomal form.
