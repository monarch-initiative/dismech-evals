      assertion_type: Pathophysiology
      assertion:
        name: Impaired Lysosomal Degradation of Single-Stranded Nucleic Acids
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        description: PLD3 is the main acid 5' exonuclease in cultured cells, and its major physiological
          substrate is mitochondrial DNA. In PLD3-deficient neurons and cell lines, mtDNA builds up in
          lysosomes and leaks into the cytosol, where it activates cGAS-STING signalling. These consequences
          come from PLD3-deficient cells studied in an Alzheimer's disease context; none has been shown
          in SCA46 patients or tested for the L308P variant, so the node records the expected cellular
          result of losing PLD3 exonuclease activity.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: DNA catabolic process
          modifier: DECREASED
          term:
            id: GO:0006308
            label: DNA catabolic process
        cellular_components:
        - preferred_term: lysosome
          term:
            id: GO:0005764
            label: lysosome
      selected_evidence:
        snippet: Our experiments revealed PLD3 as the principal acid 5' exonuclease in HeLa cells, where
          it showed a markedly higher specific activity compared with PLD4.
        supports: SUPPORT
