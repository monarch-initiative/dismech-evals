            term:
              id: MONDO:0032526
              label: spinocerebellar ataxia 48
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TBP Intermediate Repeat Expansion as a Genetic Modifier
        description: 'Intermediate-length CAG/CAA repeat expansions in TBP (roughly 40-49 repeats), which
          are themselves incompletely penetrant for SCA17, co-occur with heterozygous STUB1 variants far
          more often than chance. The original interpretation was digenic inheritance - TBP41-46 alleles
          and STUB1 variants cosegregating, with neither genotype alone associated with disease - and
          this reading questioned whether SCA48 exists as a monogenic entity at all. Subsequent work resolved
          the question in favour of a modifier model rather than obligate digenic inheritance: probands
          with the full SCA48 phenotype and normal TBP alleles exclude digenic inheritance as the sole
          mode, while longer TBP repeats predict more cognitive impairment and faster progression. Patients
          carrying both genotypes have a more severe, fully penetrant multidomain ataxia-dementia phenotype
          with reduced cerebellar and brainstem volumes. This node therefore modifies the severity and
          penetrance of the main chain rather than initiating it.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genes:
        - preferred_term: TBP
          term:
            id: hgnc:11588
            label: TBP
      selected_evidence:
        snippet: All except 1 (30/31) of the index cases with TBP41-46 alleles carried a heterozygous
          pathogenic variant in the STUB1 gene associated with spinocerebellar ataxias SCAR16 (autosomal
          recessive) and SCA48 (autosomal dominant).
        supports: SUPPORT
