      assertion_type: Pathophysiology
      assertion:
        name: CHIP Loss of Function from Heterozygous STUB1 Variants
        description: 'The initiating lesion is a heterozygous germline pathogenic STUB1 variant. STUB1
          encodes CHIP, a 35 kDa cytosolic protein whose N-terminal tetratricopeptide-repeat (TPR) domain
          binds the HSC70/HSP70 chaperones and whose C-terminal U-box recruits E2 ubiquitin-conjugating
          enzymes. Missense, nonsense, frameshift, splice and in-frame deletion variants are distributed
          across the coding sequence with no hotspot. The functional consequence is domain-dependent rather
          than uniform: TPR-domain variants retain intrinsic ligase activity but lose HSP70 binding and
          protein stability, while U-box variants abolish ligase activity, oligomerise abnormally and
          only partly impair co-chaperone function. Dominant SCA48 variants and recessive SCAR16 variants
          produce biochemically indistinguishable defects in vitro, which is why the two disorders form
          a continuous clinical spectrum rather than two mechanisms.'
        biological_scale: MOLECULAR
        genes:
