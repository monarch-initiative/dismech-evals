        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sca48-mitophagy-human-relevance
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does CHIP-dependent mitophagy dysregulation contribute to Purkinje cell loss in human
          SCA48?
        attaches_to:
        - pathophysiology#Dysregulated PINK1/Parkin-Mediated Mitophagy
        rationale: CHIP negatively regulates PINK1/Parkin mitophagy and disease-associated CHIP variants
          dysregulate it in cell culture and in C. elegans neurons, but no human SCA48 tissue has been
          examined for mitophagy or mitochondrial pathology. The node is therefore recorded with PROVISIONAL
          confidence and an indirect downstream edge. A comparable candidate mechanism - impaired heat-shock
          response - was tested in SCAR16 (biallelic) patient iPSC-derived neurons against isogenic STUB1-null
          controls and did not survive, which is the cautionary precedent here.
        proposed_experiments:
        - experiment_id: exp_sca48_mitophagy_human_neurons
          name: Mitophagy flux in SCA48 patient iPSC-derived Purkinje-like neurons
          description: Measure mitophagy flux, PINK1/Parkin recruitment and mitochondrial morphology in
            iPSC-derived Purkinje-like neurons from patients carrying dominant SCA48 STUB1 variants against
            isogenic corrected controls, and stain the existing SCA48 autopsy cerebellum series for mitochondrial
            and PINK1/Parkin pathology.
          decision_criterion: A mitophagy defect present in patient neurons but absent from isogenic controls,
            and corroborated in autopsy tissue, would move this node from PROVISIONAL to ESTABLISHED;
            a null result matching the heat-shock-response precedent would justify removing the node.
      selected_evidence:
        snippet: Furthermore, STUB1(-/-) neurons generated by CRISPR/Cas9-mediated genome editing from
          an isogenic healthy control line showed a similar HSR to patients.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
