        description: SCA17 is caused by fully penetrant TBP CAG/CAA expansions above 49 repeats and is
          the principal Huntington-disease-like SCA. It is the critical differential because intermediate
          TBP alleles sit at the interface between the two disorders.
        distinguishing_features:
        - SCA17 with TBP>=47 alleles is a monogenic dominant disorder; intermediate TBP40-49 alleles are
          incompletely penetrant and their carriers usually also carry a STUB1 variant. Patients with
          both genotypes have more severe multidomain dementia and greater cerebellar and brainstem volume
          loss than those with fully expanded TBP alleles alone.
      selected_evidence:
        snippet: demonstrate a dual inheritance pattern for SCA17, which is a monogenic dominant disorder
          for TBP≥47 alleles and a digenic TBP/STUB1 disease (SCA17-DI) for intermediate expansions
        supports: SUPPORT
