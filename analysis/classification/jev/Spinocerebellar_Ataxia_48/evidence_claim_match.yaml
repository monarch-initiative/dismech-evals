          and age-dependent, and de novo variants occur, so a negative family history does not exclude
          the diagnosis. This is the dominant counterpart of the recessive STUB1 disorder SCAR16 / Gordon
          Holmes syndrome, and dominant and recessive variants produce indistinguishable in vitro defects.'
      selected_evidence:
        snippet: Since recessive mutations in STUB1 gene have been previously associated with SCAR16,
          these findings suggest a previously undescribed SCA locus (SCA48; MIM# 618093).
        supports: SUPPORT
