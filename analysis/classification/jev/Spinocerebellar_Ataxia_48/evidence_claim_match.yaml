      assertion_type: Pathophysiology
      assertion:
        name: Impaired Chaperone-Assisted Protein Quality Control
        description: CHIP is the physical link between the cytosolic chaperone machinery and the ubiquitin-proteasome
          system. Through its TPR domain it binds HSC70 and HSP70 and attenuates their folding cycle;
          through its U-box it acts as a bona fide E3 ubiquitin ligase, recruiting UBCH5-family E2 enzymes
          and ubiquitinating chaperone-bound clients so that terminally misfolded proteins are routed
          to the proteasome instead of being refolded indefinitely. Loss of CHIP function therefore removes
          the triage step of cytosolic protein quality control. Loss of Chip ubiquitin ligase activity
          in zebrafish reduces total brain 26S proteasome activity, showing that the proteasomal arm is
          degraded in vivo and not only in reconstituted assays.
        biological_scale: MOLECULAR
        conforms_to: loss_of_proteostasis#Loss of Proteostasis
        molecular_functions:
        - preferred_term: ubiquitin protein ligase activity
