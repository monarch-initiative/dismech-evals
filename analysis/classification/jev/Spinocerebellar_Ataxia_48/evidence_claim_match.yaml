          8-10 years; SCA48 is dominantly inherited, slowly progressive over decades, and is defined by
          the cerebellar cognitive-affective syndrome rather than by dysautonomia. Dentate T2 hyperintensity
          with postero-lateral hemispheric atrophy (the crab sign) and a family history point to SCA48;
          a STUB1 variant settles it.
