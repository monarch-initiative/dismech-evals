      assertion:
        name: Disruption of Cerebello-Cerebral Motor and Cognitive Circuits
        description: The clinical syndrome follows from the loss of cerebellar output to both motor and
          associative/limbic cerebro-cerebellar loops. The motor loop failure produces gait and limb ataxia,
          dysarthria, dysmetria and tremor; the cognitive-affective loop failure produces the cerebellar
          cognitive-affective syndrome - a predominantly frontal/dysexecutive picture with behavioural
          and psychiatric change that can present years before ataxia. FDG-PET in SCA48 families shows
          glucose hypometabolism not only in cerebellum but also in striatum and cerebral cortex, consistent
          with remote (diaschisis-like) effects on connected forebrain territories and matching the extrapyramidal
          features seen clinically.
        biological_scale: ORGANISM
        conforms_to: cerebellar_purkinje_degeneration#Loss of Cerebellar Cortical Output
        locations:
        - preferred_term: cerebellum
          term:
            id: UBERON:0002037
            label: cerebellum
      selected_evidence:
        snippet: MRI showed a significant cerebellar atrophy, coupled to a T2-weighted hyperintensity
          affecting the dentate nuclei and extending to the middle cerebellar peduncles, whereas FDG-PET
          studies revealed glucose hypometabolism in cerebellum, striatum, and cerebral cortex.
        supports: SUPPORT
