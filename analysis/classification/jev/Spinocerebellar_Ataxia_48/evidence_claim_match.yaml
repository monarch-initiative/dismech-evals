      assertion:
        name: Multidisciplinary Supportive Care
        description: No disease-modifying therapy exists for SCA48, and no SCA48-specific interventional
          trial has been reported. Management is symptomatic and coordinated across neurology, clinical
          genetics, rehabilitation, neuropsychology/psychiatry, speech-language pathology and dietetics.
          Expert consensus for degenerative cerebellar disorders is that no medication has been shown
          to be effective outside episodic ataxia type 2, so pharmacological trials should be framed as
          symptomatic and individualised rather than disease-modifying.
