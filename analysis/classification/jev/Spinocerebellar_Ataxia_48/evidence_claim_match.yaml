      assertion_type: Discussion
      assertion:
        discussion_id: sca48-tbp-modifier-magnitude
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How large is the TBP modifier effect on SCA48 penetrance, and does it extend to other
          repeat loci?
        attaches_to:
        - pathophysiology#TBP Intermediate Repeat Expansion as a Genetic Modifier
        rationale: 'The modifier reading of the STUB1/TBP interaction is well supported, but its magnitude
          is not quantified: there is no penetrance estimate stratified by TBP repeat length, variant
          domain, age and sex. The same cohort that reported the 7% yield also reported second hits in
          AFG3L2 and PRKCG in three families and a 70% female excess, neither of which has been replicated.
          Until these are quantified, prognostic counselling for a STUB1-positive individual rests on
          cohort-level associations rather than an individual risk estimate.'
        proposed_experiments:
        - experiment_id: exp_sca48_penetrance_registry
          name: Genotype-curated SCA48 penetrance registry with TBP sizing
          description: Prospective, genotype-curated multicentre registry with TBP repeat sizing on all
            STUB1 variant carriers, including asymptomatic relatives, powered to estimate age-specific
            penetrance stratified by TBP repeat length, CHIP domain and sex, with independent replication
            of the reported female excess and of the AFG3L2/PRKCG second hits.
          decision_criterion: An age-specific penetrance curve that separates by TBP repeat length with
            non-overlapping confidence intervals would establish the magnitude of the modifier effect;
            overlapping curves would place an upper bound on it.
      selected_evidence:
        snippet: 'This screening of STUB1 variants revealed new features: (1) the majority of patients
          were women (70%) and (2) "second hits" in AFG3L2, PRKCG, and TBP were detected in three families
          suggesting synergic effects.'
        supports: SUPPORT
    origin:
