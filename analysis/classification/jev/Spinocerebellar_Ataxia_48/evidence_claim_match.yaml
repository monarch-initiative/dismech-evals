      assertion_type: Diagnosis
      assertion:
        name: STUB1 sequencing with parallel TBP repeat sizing
        description: 'Diagnosis rests on identifying a heterozygous pathogenic STUB1 variant in a patient
          with a compatible progressive ataxia-plus-cognitive phenotype and cerebellar atrophy on MRI.
          Because STUB1 is a conventional (non-repeat) gene it is missed by the repeat-expansion panels
          used first-line in dominant ataxia, so it must be covered by a sequencing panel or exome/genome
          test. TBP CAG/CAA repeat length should be sized in parallel: it alters expected penetrance,
          severity and recurrence-risk counselling even though it is not required for the diagnosis.'
      selected_evidence:
        snippet: Molecular screening was performed in a cohort of 235 unrelated patients with adult-onset,
          autosomal dominant (17) or sporadic (218) cerebellar ataxia, negative for pathological trinucleotide
          expansions in the common SCAs, FRDA and FXTAS loci, by using targeted multigene panels or whole-exome
          sequencing.
        supports: SUPPORT
