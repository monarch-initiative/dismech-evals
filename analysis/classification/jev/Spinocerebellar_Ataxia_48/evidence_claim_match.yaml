              label: spinocerebellar ataxia 48
        context: []
      assertion_type: ImagingFinding
      assertion:
        name: Dentate nucleus T2 hyperintensity with postero-lateral cerebellar atrophy (crab sign)
        modality: MRI
        imaging_finding_term:
          preferred_term: Abnormal dentate nucleus morphology
          term:
            id: HP:0100321
            label: Abnormal dentate nucleus morphology
        located_in:
          preferred_term: dentate nucleus
          term:
            id: UBERON:0002132
            label: dentate nucleus
        laterality: BILATERAL
        description: 'The most specific imaging feature of SCA48 is bilateral T2-weighted hyperintensity
          of the dentate nuclei combined with atrophy predominantly of the postero-lateral cerebellar
          hemispheres; the two together were likened to a crab and named the "crab sign". Supratentorial
          volume loss and signal change are typically absent. In a separate series the dentate signal
          change extended into the middle cerebellar peduncles. Term-binding caveat: HPO has no dentate-nucleus
          signal-intensity term (it has thalamic, brainstem and basal-ganglia siblings), so this finding
          is bound to the morphology term HP:0100321, which is a different kind of claim from a T2 signal
          abnormality; preferred_term carries the intended meaning.'
      selected_evidence:
        snippet: We propose that the association of such signal change, along with the atrophy of the
          lateral portion of the cerebellar hemispheres, resembled the appearance of a crab, and therefore,
          we propose the "crab sign" as a neuroradiological sign present in SCA48 patients.
        supports: SUPPORT
