        description: Sporadic adult-onset cerebellar ataxia with parkinsonism and urinary symptoms is
          the MSA-C presentation, and it overlaps closely with the SCA48 phenotype set. Most SCA48 patients
          reach genetic testing only after repeat-expansion panels come back negative, so MSA-C is a realistic
          competing label at that point.
        distinguishing_features:
