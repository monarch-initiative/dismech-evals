        description: 'The competing model held that SCA48 is not a monogenic entity but the digenic product
          of a heterozygous STUB1 variant plus an intermediate-length TBP expansion, with neither genotype
          pathogenic alone. This was a serious proposal supported by near-complete co-occurrence in one
          cohort. It is recorded as rejected in its strong form: probands with the full phenotype and
          normal TBP alleles exclude obligate digenic inheritance. The weaker modifier claim survives
          and is curated in the "TBP Intermediate Repeat Expansion as a Genetic Modifier" pathophysiology
          node.'
      selected_evidence:
        snippet: TBP41-46 expansions and STUB1 variants cosegregate in all affected family members, whereas
          the presence of either TBP41-46 expansions or STUB1 variants individually was never associated
          with the disease.
        supports: SUPPORT
