          cognitive-affective syndrome, with pyramidal and peripheral nervous system signs conspicuously
          absent in some cohorts. Hypogonadism is rare in SCA48 - the eight-family Italian series reported
          it in one patient, in whom it was accompanied by other autoimmune endocrine dysfunction.
      selected_evidence:
        snippet: The overlap of several clinical signs between SCAR16 and SCA48 indicates the presence
          of a continuous clinical spectrum among recessively and dominantly inherited mutations of STUB1.
        supports: SUPPORT
