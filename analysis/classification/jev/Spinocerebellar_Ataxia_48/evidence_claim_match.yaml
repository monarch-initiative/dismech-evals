        description: CHIP acts as a negative regulator of PINK1/Parkin-mediated mitophagy, promoting PINK1
          degradation and limiting Parkin recruitment to stressed mitochondria. Disease-associated CHIP
          variants dysregulate this pathway in cell culture and in C. elegans neurons, giving a parallel
          branch of mitochondrial quality control alongside the aggregation branch. This arm is mechanistically
          plausible for SCA48 but has not been demonstrated in human SCA48 tissue, so it is recorded as
          a provisional mechanism.
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
