          incompletely penetrant and their carriers usually also carry a STUB1 variant. Patients with
          both genotypes have more severe multidomain dementia and greater cerebellar and brainstem volume
          loss than those with fully expanded TBP alleles alone.
      selected_evidence:
        snippet: SCATBP/STUB1 patients had multi-domain dementia with a more severe impairment in respect
          to patient carrying only fully expanded SCA17 alleles.
        supports: SUPPORT
