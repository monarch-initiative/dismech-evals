      assertion_type: AnimalModel
      assertion:
        species: Danio rerio
        genotype: stub1 mutant with truncated Chip U-box domain
        description: A zebrafish stub1 mutant truncating the functional U-box domain shows impaired ubiquitination
          of Hsc70 and of Chip itself, decreased total brain 26S proteasome activity, reduced Purkinje
          cell number and soma size, abnormal Purkinje dendrite organisation, and behavioural changes.
          It recapitulates the cellular Purkinje phenotype but not the gross cerebellar atrophy of human
          disease, which is its main limitation. stub1 mRNA is predominantly expressed in the cerebellum
          including the Purkinje cell layer, consistent with the cell-type selectivity of the human disorder.
        publication: PMID:34630034
        modeled_mechanisms:
        - target: Impaired Chaperone-Assisted Protein Quality Control
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Truncating the Chip U-box abolishes ubiquitination of Hsc70 and of Chip itself
            and lowers whole-brain 26S proteasome activity, reproducing the molecular lesion of U-box
            SCA48 variants.
        - target: Cerebellar Purkinje Cell Degeneration
          relationship: RECAPITULATES
          fidelity: MODERATE
          limitations: Purkinje cell number, soma size and dendritic organisation are abnormal, but the
            fish show no gross cerebellar atrophy, so the model captures the cellular phenotype without
            the tissue-level one.
      selected_evidence:
        snippet: In the brain, stub1 mRNA was predominantly detected in the cerebellum, including the
          Purkinje cell layer and granular layer.
        supports: SUPPORT
