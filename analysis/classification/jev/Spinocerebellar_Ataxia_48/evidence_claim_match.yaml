      assertion:
        name: TBP intermediate CAG/CAA repeat expansion (modifier)
        gene_term:
          preferred_term: TBP
          term:
            id: hgnc:11588
            label: TBP
        association: Modifier of penetrance and severity, not an independent cause of SCA48
        relationship_type: MODIFIER
        variant_origin: GERMLINE
        notes: 'Intermediate TBP alleles (approximately 40-49 CAG/CAA repeats) are themselves incompletely
          penetrant for SCA17 and co-occur with STUB1 variants far more often than expected. Current evidence
          favours a modifier role: repeat length predicts cognitive impairment and speed of progression,
          and the combined genotype is fully penetrant, but SCA48 also occurs with normal TBP alleles.
          TBP repeat sizing is therefore recommended alongside STUB1 sequencing for prognosis and counselling,
          not as a diagnostic requirement.'
      selected_evidence:
        snippet: We show that intermediate TBP40-49 alleles act as disease modifiers of SCA48 rather than
          a STUB1/TBP digenic model. This distinction from what has been proposed before has crucial consequences
          for genetic counseling in SCA48.
        supports: SUPPORT
