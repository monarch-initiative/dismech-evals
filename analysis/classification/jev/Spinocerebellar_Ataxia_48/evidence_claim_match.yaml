      assertion_type: Pathophysiology
      assertion:
        name: Cerebellar Purkinje Cell Degeneration
        description: The Purkinje cell is the selectively vulnerable cell type in SCA48. Human neuropathology
          in heterozygous STUB1 patients shows marked to massive Purkinje cell loss, most severe in the
          vermis and substantial in the hemispheres, with strikingly little pathology elsewhere in one
          series and no atrophy of pons, hippocampus or cerebral cortex in another. A second cell-autonomous
          abnormality is loss of the normal polarised somatodendritic distribution of CHIP within surviving
          Purkinje cells, with aberrant protein in the distal dendritic arbor. A zebrafish chip U-box
          truncation reproduces the cellular phenotype - reduced Purkinje cell number and soma size and
          disorganised dendrites - without gross cerebellar atrophy.
        biological_scale: CELLULAR
        conforms_to: cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        biological_processes:
        - preferred_term: neuron apoptotic process
          term:
            id: GO:0051402
            label: neuron apoptotic process
          modifier: INCREASED
        locations:
        - preferred_term: cerebellar cortex
          term:
            id: UBERON:0002129
            label: cerebellar cortex
      selected_evidence:
        snippet: We report neuropathological findings of a STUB1 heterozygous patient, showing massive
          loss of Purkinje cells in the vermis and major loss in the cerebellar hemispheres without atrophy
          of the pons, hippocampus, or cerebral cortex.
        supports: SUPPORT
