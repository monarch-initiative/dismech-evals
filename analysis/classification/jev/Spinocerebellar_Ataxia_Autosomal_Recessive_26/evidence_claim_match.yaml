        prompt: How well does a lethal, developmental, neural-null mouse model a slowly progressive human
          disease caused by hypomorphic alleles, and what causes the peripheral neuropathy?
        rationale: The mouse loses cerebellar interneurons during development and dies of seizures within
          weeks. The three described patients have onset from infancy to the late twenties, no seizures,
          and a prominent axonal neuropathy that no model has examined; one further, undescribed patient
          reportedly had seizures and microcephaly. A hypomorphic knock-in of the recurrent c.1293G>C
          allele, assessed for peripheral nerve pathology, would bridge the gap.
      selected_evidence:
        snippet: Here, we show that hyperactivity of the DNA strand break sensor protein Parp1 in mice
          in which the central SSBR protein Xrcc1 is conditionally deleted (Xrcc1Nes-Cre ) results in
          lethal seizures and shortened lifespan.
