        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#PARP1 Trapping and Hyperactivation
        prompt: Can PARP1 be reduced pharmacologically in a way that reproduces the genetic rescue seen
          in mice and zebrafish?
        rationale: Genetic deletion of Parp1 reduces the neuron loss and ataxia of Xrcc1-deficient mice,
          prevents their seizure-related defects, extends their lifespan, and rescues the cerebellar defect
          of xrcc1 zebrafish. The PARP inhibitor veliparib, given to Xrcc1-deficient mice, prevented the
          seizure-like activity in hippocampal slices and the calcium defects in isolated neurons but
          did not significantly extend lifespan. Clinical PARP inhibitors trap PARP1 on DNA, the very
          effect XRCC1 loss already produces, so they may not mimic deletion. No drug has been tested
          in patients.
      selected_evidence:
        snippet: this may explain why we have so far been unable to extend significantly the lifespan
          of XRCC1Nes-Cre mice by PARP inhibition.
