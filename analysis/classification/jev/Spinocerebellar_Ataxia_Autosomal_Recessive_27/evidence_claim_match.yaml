              label: spinocerebellar ataxia, autosomal recessive 27
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: scar27_gdap2_function
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#GDAP2 Loss of Function
        - pathophysiology#Impaired Neuronal Stress Response
        prompt: What does GDAP2 do in human neurons, and does its loss make them vulnerable to oxidative
          or metabolic stress?
        rationale: The stress-susceptibility mechanism rests on one Drosophila RNAi model. GDAP2 has a
          macro domain and a CRAL-TRIO domain but no demonstrated biochemical activity, and no mammalian
          loss-of-function model of the ataxia has been reported. Why a protein without known neuron-restricted
          expression causes adult-onset, cerebellum-predominant degeneration is unexplained.
      selected_evidence:
        snippet: Thus, Gdap2 knockdown in Drosophila and GDAP2 loss-of-function mutations in humans lead
          to locomotor phenotypes, which may be mediated by altered responses to cellular stress.
        supports: SUPPORT
