              label: spinocerebellar ataxia, autosomal recessive 27
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neuronal Stress Response
        biological_scale: CELLULAR
        description: In Drosophila, Gdap2 expression changes after stress, and ubiquitous Gdap2 knockdown
          makes flies die much sooner on paraquat (oxidative stress) and slightly sooner on starvation.
          The authors propose that defective stress handling contributes to the neurological phenotype.
          Cleaved-caspase-3 staining did not show increased neurodegeneration in knockdown fly brains,
          so the authors read the reduced survival as neuronal dysfunction rather than cell loss at that
          stage. This node rests on invertebrate data only.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: cellular response to oxidative stress
          term:
            id: GO:0034599
            label: cellular response to oxidative stress
          modifier: DECREASED
        - preferred_term: response to starvation
          term:
            id: GO:0042594
            label: response to starvation
          modifier: DECREASED
      selected_evidence:
        snippet: Gdap2 expression levels responded to stress treatments in control flies, and Gdap2 knockdown
          flies showed increased sensitivity to deleterious effects of stressors such as reactive oxygen
          species and nutrient deprivation.
        supports: SUPPORT
        directness: INDIRECT
