        prompt: Does the Drosophila Gdap2 knockdown phenotype tell us anything about the Purkinje cell
          loss seen in patients?
        rationale: Patients show Purkinje cell loss and progressive cerebellar atrophy, while the only
          functional model is an invertebrate without a cerebellum in which increased neuronal death was
          not detected. A neuron-specific or cerebellar mammalian knockout, or patient-derived neurons,
          would be needed to test whether stress susceptibility causes the human lesion.
      selected_evidence:
        snippet: This suggests that the decreased lifespan of the GDAP2 knockdown models upon stress might,
          at this stage, be a consequence of neuronal dysfunction instead of neuronal degeneration.
        supports: SUPPORT
