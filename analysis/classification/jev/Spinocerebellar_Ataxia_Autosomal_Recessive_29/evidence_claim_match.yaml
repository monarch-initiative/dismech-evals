        biological_scale: MOLECULAR
        description: VPS41 is one of the two HOPS-specific subunits. All tested disease variants prevented
          formation of a functional HOPS complex. Because VPS41 is not part of CORVET, the defect is confined
          to the late endosome/autophagosome-to-lysosome fusion arm, in contrast to VPS33A (Mucopolysaccharidosis-Plus
          Syndrome), whose loss compromises both complexes. A HOPS-independent function of VPS41 in regulated
          secretion was preserved for the p.Ser285Pro allele.
        protein_complexes:
        - preferred_term: HOPS complex
          term:
            id: GO:0030897
            label: HOPS complex
          modifier: DECREASED
      selected_evidence:
        snippet: All mutants prevented formation of a functional HOPS complex, causing delayed lysosomal
          delivery of endocytic and autophagic cargo.
        supports: SUPPORT
