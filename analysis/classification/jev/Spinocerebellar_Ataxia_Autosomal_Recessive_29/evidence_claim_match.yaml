              label: spinocerebellar ataxia, autosomal recessive 29
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: VPS41 Loss of Function
        biological_scale: MOLECULAR
        description: Biallelic VPS41 variants reduce or abolish the function of the HOPS-specific VPS41
          subunit. Disease missense variants fail to restore lysosomal function in VPS41 knockout cells,
          and in one compound heterozygote the two splice alleles (one producing an NMD-targeted out-of-frame
          transcript, one an in-frame exon-skipped transcript) jointly reduced VPS41 transcript and protein.
          VPS41 acts as an adaptor linking the HOPS complex to the lysosomal small GTPase ARL8B via its
          effector SKIP.
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic germline variants, homozygous or compound heterozygous; missense, nonsense
            and splice alleles are reported.
        genes:
        - preferred_term: VPS41
          term:
            id: hgnc:12713
            label: VPS41
        molecular_functions:
        - preferred_term: molecular adaptor activity (HOPS-to-lysosome linkage)
          term:
            id: GO:0060090
            label: molecular adaptor activity
          modifier: DECREASED
      selected_evidence:
        snippet: These complementary defects reduced VPS41 expression at both transcript and protein levels,
          supporting pathogenicity and variant reclassification.
        supports: SUPPORT
    origin:
