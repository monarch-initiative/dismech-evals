      assertion_type: Pathophysiology
      assertion:
        name: mTORC1 Redistribution and Constitutive TFE3 Activation
        biological_scale: CELLULAR
        description: In VPS41-deficient cells mTORC1 redistributes to the cytosol and TFE3 is continuously
          nuclear, while phosphorylation of the mTORC1 substrates S6K1 and 4EBP1 is unaffected; the defect
          is selective for the TFEB/TFE3 arm. Lysosomal biogenesis and autophagosome formation are continuously
          upregulated regardless of nutrient status, and the autophagic response to starvation is reduced.
        biological_processes:
        - preferred_term: lysosome organization (lysosomal biogenesis)
          term:
            id: GO:0007040
            label: lysosome organization
          modifier: INCREASED
      selected_evidence:
        snippet: Strikingly, loss of VPS41 function caused a cytosolic redistribution of mTORC1, continuous
          nuclear localization of Transcription Factor E3 (TFE3), enhanced levels of LC3II, and a reduced
          autophagic response to nutrient starvation.
        supports: SUPPORT
