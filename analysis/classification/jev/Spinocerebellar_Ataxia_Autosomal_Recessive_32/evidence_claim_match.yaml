            term:
              id: MONDO:0859245
              label: spinocerebellar ataxia, autosomal recessive 32
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: scar32_behavioral_attribution
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Social withdrawal
        - phenotypes#Mood disturbance
        prompt: What accounts for the social and mood changes in the two reported patients?
        rationale: PRDX3-dependent neuronal vulnerability is modeled, but the clinical reports do not
          assign social withdrawal or mood disturbance to an established circuit lesion. Patient 1 had
          normal global cognitive testing despite social isolation and academic decline. Patient 2 had
          a nonspecific mood disorder and an elder brother with psychiatric findings whose genotype was
          not established here. Direct neurological effects, psychosocial consequences of chronic illness
          and familial susceptibility remain unresolved; no specific mood subtype or additional affected
          sibling is inferred.
      selected_evidence:
        snippet: Patient 1 is a 19‐year‐old male admitted to our neurology department with imbalance and
          clumsiness present since the age of 10 years, when he also started to manifest introversion,
          social isolation, and academic decline.
        supports: SUPPORT
    origin:
