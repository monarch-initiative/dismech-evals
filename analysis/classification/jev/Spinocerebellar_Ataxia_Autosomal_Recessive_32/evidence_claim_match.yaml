              label: spinocerebellar ataxia, autosomal recessive 32
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: scar32_which_cerebellar_cell_population
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Cerebellar Circuit Dysfunction and Degeneration
        prompt: Which cerebellar cell population degenerates in SCAR32, and is the Purkinje cell the primary
          target?
        rationale: The reviewed human evidence consists of MRI regional changes, while experimental evidence
          comes from medulloblastoma cells, mouse cortical neurons, flies and zebrafish. These establish
          redox vulnerability without identifying a primary human cerebellar cell population. Neither
          cortical/vermian atrophy nor dentate or pontine signal distinguishes Purkinje-intrinsic injury
          from granule-cell, afferent, glial or olivary contributions.
        proposed_experiments:
        - experiment_id: exp_scar32_cerebellar_histopathology
          experiment_design: DESCRIPTIVE_PROFILING
          name: Cerebellar histopathology of a SCAR32 brain
          description: Quantitative Purkinje-cell, granule-cell and dentate-neuron counts with calbindin
            immunostaining on post-mortem cerebellum from a genetically confirmed SCAR32 patient, compared
            with age-matched controls.
          would_support:
          - pathophysiology#Cerebellar Circuit Dysfunction and Degeneration
          supporting_outcome:
          - Selective loss of Purkinje neurons with relative preservation of granule cells would localise
            the degeneration to the Purkinje cell and justify declaring conformance to the shared module.
          refuting_outcome:
          - Preserved Purkinje-cell counts with granule-cell or olivary loss would show that the shared
            Purkinje module is the wrong mechanism for SCAR32.
        - experiment_id: exp_scar32_cell_type_resolved_deletion
          name: Cell-type-resolved prdx3 loss in a cerebellum-bearing model
          description: Conditional Prdx3 deletion in mouse restricted to Purkinje cells versus to granule
            cells versus to inferior olivary neurons, with motor phenotyping and cerebellar histology.
          would_support:
          - pathophysiology#Neuronal Oxidative Injury
          supporting_outcome:
          - Ataxia and cerebellar degeneration following Purkinje-restricted deletion but not the other
            two would establish Purkinje-cell autonomy of the lesion.
      selected_evidence:
        snippet: The almost total absence of PRDX3, a key mitochondrial protein in the antioxidant TXN
          system, causes oxidative damage and severe alterations in mitochondria, leading to a new form
          of infantile-onset cerebellar ataxia.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
