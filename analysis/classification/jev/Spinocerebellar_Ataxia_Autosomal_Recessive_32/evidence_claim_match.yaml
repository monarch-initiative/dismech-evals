        context:
        - path: /genetic/0
          value:
            name: PRDX3
            notes: 'Biallelic variants in PRDX3 (peroxiredoxin 3, chromosome 10q26.11) cause SCAR32. Reported
              alleles span nonsense (p.Arg207*, p.Arg170*, p.Lys166*, p.Gln50*), frameshift (p.Leu8Cysfs*10,
              p.Leu176TrpfsTer11), noncanonical splice variants causing exon skipping, and missense (p.Asp202Asn,
              p.Ala142Gly, p.Asp163Glu). Functionally studied alleles cause absent or markedly reduced
              protein; residual abundance and respiratory phenotypes vary between cell lines. Two alleles
              recur across unrelated families: p.Asp202Asn, first found in Kurdish families and since
              in Brazilian and UK patients and sitting at a CpG dinucleotide, and p.Arg207*, which is
              comparatively common in East Asian population data and was present in all four patients
              of the Japanese series.'
            gene_term:
              preferred_term: PRDX3
              term:
                id: hgnc:9354
                label: PRDX3
            relationship_type: CAUSATIVE
          role: ancestor
      assertion_type: Variant
