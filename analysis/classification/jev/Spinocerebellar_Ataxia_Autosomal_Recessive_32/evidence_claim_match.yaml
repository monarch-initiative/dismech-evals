        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing
        description: Diagnosis rests on finding biallelic pathogenic PRDX3 variants, in practice by exome
          or genome sequencing after repeat-expansion testing is negative. Homozygosity mapping helps
          in consanguineous families. A noncanonical splice allele causing exon skipping has been reported,
          so RNA studies may be needed when only one clearly damaging allele is found. In East Asian patients
          the recurrent p.Arg207* nonsense allele is worth specific attention.
      selected_evidence:
        snippet: We report four unrelated Japanese patients with SCAR32 identified among 411 ataxia cases
          negative for repeat expansion disorders.
        supports: SUPPORT
