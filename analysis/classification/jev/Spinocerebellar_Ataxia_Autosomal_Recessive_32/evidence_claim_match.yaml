  cc5dad04618537ab1a88ce0b719d5c1f9d3eeef6e4c5064da1d2b9976915f5d6:
    claim:
      about:
        disease:
          name: Spinocerebellar Ataxia, Autosomal Recessive 32
          disease_term:
            preferred_term: spinocerebellar ataxia, autosomal recessive 32
            term:
              id: MONDO:0859245
              label: spinocerebellar ataxia, autosomal recessive 32
        context: []
      assertion_type: Genetic
      assertion:
        name: PRDX3
        notes: 'Biallelic variants in PRDX3 (peroxiredoxin 3, chromosome 10q26.11) cause SCAR32. Reported
          alleles span nonsense (p.Arg207*, p.Arg170*, p.Lys166*, p.Gln50*), frameshift (p.Leu8Cysfs*10,
          p.Leu176TrpfsTer11), noncanonical splice variants causing exon skipping, and missense (p.Asp202Asn,
          p.Ala142Gly, p.Asp163Glu). Functionally studied alleles cause absent or markedly reduced protein;
          residual abundance and respiratory phenotypes vary between cell lines. Two alleles recur across
          unrelated families: p.Asp202Asn, first found in Kurdish families and since in Brazilian and
          UK patients and sitting at a CpG dinucleotide, and p.Arg207*, which is comparatively common
          in East Asian population data and was present in all four patients of the Japanese series.'
        gene_term:
          preferred_term: PRDX3
          term:
            id: hgnc:9354
            label: PRDX3
        relationship_type: CAUSATIVE
        variants:
        - name: PRDX3 c.604G>A (p.Asp202Asn)
          description: Recurrent missense allele at the conserved dimer interface of the PRDX3 oligomer;
            abolishes the protein rather than reducing its catalytic rate. First reported in two unrelated
            Kurdish families, subsequently homozygous in a Brazilian patient and in a British boy with
            cerebellar hypoplasia found in 100,000 Genomes Project data.
          type: missense
          clinical_significance: PATHOGENIC
          regulatory_category: LOF
        - name: PRDX3 c.619C>T (p.Arg207*)
          description: Nonsense allele that is comparatively frequent in East Asian population data and
            was carried by all four patients in the Japanese series, homozygous in one and compound heterozygous
            in three; also reported homozygous in a Chinese paediatric patient.
          type: nonsense
          clinical_significance: PATHOGENIC
          regulatory_category: LOF
        - name: PRDX3 c.508C>T (p.Arg170*)
          description: The most frequently reported pathogenic allele, seen homozygous in an Indian patient
            and compound heterozygous in two Korean patients and in two of the four Japanese patients.
            Reported alongside a novel p.Asp171Gly missense allele four base pairs away in one Korean
            proband.
          type: nonsense
          clinical_significance: PATHOGENIC
          regulatory_category: LOF
        - name: PRDX3 c.496A>T (p.Lys166*)
          description: Homozygous nonsense allele in a consanguineous family, and the report that first
            added profound hearing impairment to the PRDX3 phenotype alongside global developmental delay,
            hypotonia, dystonia and cerebellar atrophy.
          type: nonsense
          clinical_significance: PATHOGENIC
          regulatory_category: LOF
        - name: PRDX3 c.425C>G (p.Ala142Gly)
          description: Missense allele reported in compound heterozygosity with the p.Leu176TrpfsTer11
            frameshift; the 2024 report classifies p.Ala142Gly as uncertain significance under ACMG criteria
            despite its earlier disease association. Used as a comparator in the aggregation experiments,
            where it damaged mitochondria less severely than p.Asp163Glu.
          type: missense
          clinical_significance: UNCERTAIN_SIGNIFICANCE
          regulatory_category: LOF
        - name: PRDX3 c.489C>G (p.Asp163Glu)
          description: 'Missense allele found homozygous in an infantile-onset patient (19 months). It
            produces an unstable protein that aggregates and activates the mitochondrial and endoplasmic-reticulum
            unfolded protein responses before being cleared, and damages mitochondria more severely than
            p.Asp202Asn or p.Ala142Gly when expressed exogenously. This allele is not simply a null: the
            published data show loss of the enzyme plus a gain of aggregation-driven proteostatic stress
            that the nonsense alleles do not produce, which is why the node-level `functional_impact_category`
            of LOSS_OF_FUNCTION describes the shared lesion rather than this allele in full.'
          type: missense
          clinical_significance: PATHOGENIC
          regulatory_category: LOF
        - name: PRDX3 c.525_535del (p.Leu176TrpfsTer11)
          description: Frameshift allele reported homozygous in one patient and compound heterozygous
