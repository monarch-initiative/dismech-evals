      reference_title: 'SCAR32: Functional characterization and expansion of the clinical-genetic spectrum.'
      evidence_source: HUMAN_CLINICAL
      explanation: Patient 1 developed social isolation around the onset of motor symptoms; formal global
        cognitive testing was normal. This observation supports reduced social interaction without diagnosing
        autism, depression, or intellectual disability.
