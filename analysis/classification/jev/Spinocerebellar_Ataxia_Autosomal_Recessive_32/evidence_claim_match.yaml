  0d4c6f75e49bcda47e47f17a8140418a0aee5645eb2a3d5c052b31b542a8cfe8:
    claim:
      about:
        disease:
          name: Spinocerebellar Ataxia, Autosomal Recessive 32
          disease_term:
            preferred_term: spinocerebellar ataxia, autosomal recessive 32
            term:
              id: MONDO:0859245
              label: spinocerebellar ataxia, autosomal recessive 32
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Misfolded PRDX3 Aggregation and Unfolded Protein Response
        biological_scale: CELLULAR
        description: The strongest evidence for this proteostatic arm concerns p.Asp163Glu; it does not
          apply to alleles that produce no protein. The p.Asp163Glu missense protein is unstable, forms
          insoluble aggregates and is routed to proteasomal degradation, and its expression activates
          the unfolded protein response in both the mitochondrion and the endoplasmic reticulum. Expressed
          exogenously it damages mitochondria far more severely than the p.Asp202Asn or p.Ala142Gly alleles
          do — cristae disorganisation, membrane damage and lipid-droplet accumulation — and in cultured
          mouse cortical neurons it distorts neurite morphology. This is the current candidate explanation
          for the 19-month onset in that patient, and it is a proteostatic mechanism layered on top of,
          not instead of, the shared enzyme loss.
        biological_processes:
        - preferred_term: mitochondrial unfolded protein response
          term:
            id: GO:0034514
            label: mitochondrial unfolded protein response
          modifier: INCREASED
        - preferred_term: endoplasmic reticulum unfolded protein response
          term:
            id: GO:0030968
            label: endoplasmic reticulum unfolded protein response
          modifier: INCREASED
      selected_evidence:
        snippet: The biochemical analysis suggested that the mutation p.D163E would result in an unstable
          structure tending to form aggregates that trigger unfolded protein responses via mitochondria
          and endoplasmic reticulum.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
