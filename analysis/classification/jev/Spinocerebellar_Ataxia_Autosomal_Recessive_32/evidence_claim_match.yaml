        context: []
      assertion_type: AnimalModel
      assertion:
        name: prdx3 F0 crispant zebrafish
        species: Zebrafish
        genotype: prdx3 CRISPR-Cas9 F0 crispant (somatic biallelic disruption)
        publication: PMID:38837640
        description: An F0 "crispant" zebrafish generated to test prdx3 function during nervous system
          development, made because no zebrafish model of PRDX3 existed. Larvae show reduced burst activity
          on tail-coiling, reduced locomotor velocity and distance, increased susceptibility to oxidative
          stress, impaired mitochondrial bioenergetics, and increased apoptotic cells with raised apoptosis-associated
          transcripts.
        modeled_mechanisms:
        - target: Neuronal Oxidative Injury
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: prdx3 depletion in vivo reproduces the ROS-sensitised apoptosis and the motor consequence
            that this node asserts for human cerebellar neurons.
          limitations: 'Species divergence, and an F0 somatic crispant is mosaic rather than a germline
            null, so residual prdx3 is expected. The apoptosis and motor readouts are whole-larva measurements
            at 24-120 hours post fertilisation: nothing localises the injury to the cerebellum, and a
            developing larva is not a model of the adult-onset human presentations.'
          readouts:
          - name: ROS-triggered apoptotic cell burden
            target: Neuronal Oxidative Injury
            direction: INCREASED
            interpretation: Acridine-orange-positive cells and apoptosis-associated transcripts both rise
              in prdx3-depleted larvae, the in vivo counterpart of the apoptotic sensitisation seen in
              PRDX3-knockdown cerebellar cells.
          - name: Larval locomotor burst activity
            target: Neuronal Oxidative Injury
            direction: DECREASED
            interpretation: Reduced burst activity on the tail-coiling test is the motor output consequence
              of prdx3 depletion.
        - target: Mitochondrial Respiratory Impairment
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Oxygen-consumption studies in prdx3-depleted larvae reproduce the loss of respiratory
            capacity measured in patient fibroblasts.
          limitations: Whole-larva respirometry rather than a neuronal measurement, in a mosaic F0 animal;
            and the corresponding human finding is itself inconsistent between patient fibroblast lines.
          readouts:
          - name: Larval maximal respiration and ATP production
            target: Mitochondrial Respiratory Impairment
            direction: DECREASED
            interpretation: Seahorse respirometry of 120-hpf larvae shows reduced ATP-linked and maximal
              respiration on prdx3 depletion.
      selected_evidence:
        snippet: our functional characterization of the prdx3 zebrafish model revealed motor defects,
          increased susceptibility to reactive oxygen species-triggered apoptosis, and an impaired oxygen
          consumption rate.
        supports: SUPPORT
    origin:
