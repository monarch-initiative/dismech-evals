        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Every reported patient carries two PRDX3 alleles — homozygous in the consanguineous
          and founder-allele families, compound heterozygous in several non-consanguineous ones — with
          unaffected heterozygous parents. PRDX3 is nuclear-encoded and autosomal (10q26.11), so despite
          the disease being mitochondrial in its biochemistry the transmission is nuclear recessive, with
          a 25 percent sibling recurrence risk and no maternal transmission.
      selected_evidence:
        snippet: we identified recessive mutations in PRDX3 as the genetic cause of cerebellar ataxia
          in five unrelated families, providing further evidence for oxidative stress in the pathogenesis
          of neurodegeneration.
        supports: SUPPORT
