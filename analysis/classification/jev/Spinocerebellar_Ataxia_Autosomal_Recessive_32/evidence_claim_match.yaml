        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Respiratory Impairment
        biological_scale: CELLULAR
        description: 'PRDX3-deficient cells lose respiratory reserve. Fibroblasts from proband 1 in the
          defining cohort had reduced maximal respiratory capacity, and prdx3-depleted zebrafish larvae
          show significant reductions in ATP production and maximal respiration. This is a consequence
          of the redox lesion rather than a primary OXPHOS subunit defect: PRDX3 is not part of any respiratory
          complex, and one later patient''s fibroblasts showed no measurable respiratory abnormality at
          all, so the finding is not uniform across cell lines. Human muscle histochemistry in a different
          discovery-cohort patient showed some COX-negative fibres, a localized complex IV activity readout
          rather than evidence that every patient has a generalized mitochondrial myopathy.'
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: cellular respiration
          term:
            id: GO:0045333
            label: cellular respiration
          modifier: DECREASED
      selected_evidence:
        snippet: Patient fibroblasts showed a lack of PRDX3 protein, resulting in decreased glutathione
          peroxidase activity and decreased mitochondrial maximal respiratory capacity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
