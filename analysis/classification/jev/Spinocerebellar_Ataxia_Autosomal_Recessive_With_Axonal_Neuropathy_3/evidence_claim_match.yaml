              id: MONDO:0020770
              label: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Mitochondrial COA7 Protein
        description: Pathogenic COA7 missense and in-frame alleles produce proteins that are imported
          into the mitochondrial intermembrane space more slowly than wild type through the MIA (CHCHD4)
          disulfide-relay pathway; mutant protein left in the cytosol is degraded by the proteasome, so
          little or no COA7 accumulates in mitochondria. In fibroblasts from the first reported patient
          no COA7 protein was detectable. Truncating alleles are presumed to abolish the protein, but
          this has not been tested.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: protein import into mitochondrial intermembrane space
          term:
            id: GO:0045041
            label: protein import into mitochondrial intermembrane space
          modifier: DECREASED
        - preferred_term: proteasomal degradation of mislocalized COA7
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
          modifier: INCREASED
      selected_evidence:
        snippet: We also found that pathogenic mutant versions of COA7 are imported slower than the wild-type
          protein, and mislocalized proteins are degraded in the cytosol by the proteasome.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
