        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of COA7 Disulfide Reductase Activity
        description: COA7 is a heme-binding protein built from five helix-turn-helix (Sel1-like) repeats
          that interacts transiently with the copper metallochaperones SCO1 and SCO2 and reduces disulfide
          bonds in them, which is proposed to regenerate the copper relay that delivers copper to COX2.
          Loss of COA7 removes this activity. The step is shown biochemically and in COA7 knockout cells;
          that patient variants act through it is inferred.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: COA7
          term:
            id: hgnc:25716
            label: COA7
          modifier: DECREASED
        molecular_functions:
        - preferred_term: protein-disulfide reductase activity
          term:
            id: GO:0015035
            label: protein-disulfide reductase activity
          modifier: DECREASED
        - preferred_term: heme binding
          term:
            id: GO:0020037
            label: heme binding
          modifier: DECREASED
      selected_evidence:
        snippet: COA7 binds heme with micromolar affinity, through axial ligation to the central iron
          atom by histidine and methionine residues.
        supports: SUPPORT
