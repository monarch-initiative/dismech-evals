  4adff50679fee6910a26a8637eb5d5d287876b05eaa19683904f8d03d24c6c00:
    claim:
      about:
        disease:
          name: Spinocerebellar Ataxia, Autosomal Recessive, With Axonal Neuropathy 3
          disease_term:
            preferred_term: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 3
            term:
              id: MONDO:0020770
              label: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 3
        context: []
      assertion_type: Genetic
      assertion:
        name: COA7
        notes: COA7 (formerly C1orf163, SELRC1, RESA1) encodes a 231-residue protein with five Sel1-like
          repeats that is present in animals but absent from yeast. Reported alleles are mostly missense,
          with a frameshift, a nonsense, a splice-donor and a whole-exon-2 deletion; the exon deletion
          was found by MLPA after sequencing detected only one allele. c.17A>G (p.Asp6Gly) recurs in Japanese
          patients on a shared haplotype. No ClinGen gene-disease validity record for COA7 is cached,
          so none is recorded.
        gene_term:
          preferred_term: COA7
          term:
            id: hgnc:25716
            label: COA7
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        variants:
        - name: c.17A>G (p.Asp6Gly)
          description: Recurrent missense allele, homozygous or compound heterozygous in most Japanese
            patients and in one Chinese patient, carried on a common haplotype in Japan. Classified pathogenic
            by ACMG criteria in the 2023 Japanese series.
          type: missense
          clinical_significance: PATHOGENIC
        - name: c.115C>T (p.Arg39Trp)
          description: Missense allele found in trans with an exon 2 deletion in one patient and homozygous
            in another; classified pathogenic in the 2023 Japanese series.
          type: missense
          clinical_significance: PATHOGENIC
        - name: c.410A>G (p.Tyr137Cys) / c.287+1G>T
          description: Compound heterozygous missense and splice-donor alleles in the first reported patient;
            the splice variant causes in-frame skipping of exon 2. Both mutant proteins are imported poorly
            and degraded by the proteasome.
          type: missense
        - name: c.554G>A (p.Trp185*)
          description: Nonsense allele in trans with p.Asp6Gly in a Chinese patient.
          type: nonsense
        - name: c.511G>A (p.Ala171Thr) / c.566A>G (p.Asn189Ser)
          description: Compound heterozygous missense alleles in the infantile encephalopathic form.
          type: missense
        - name: c.449G>A (p.Cys150Tyr)
          description: Missense allele in the fourth Sel1-like repeat, in trans with p.Asp6Gly in the
            infantile dystonia patient; classified likely pathogenic.
          type: missense
          clinical_significance: LIKELY_PATHOGENIC
        - name: c.457C>T (p.Leu153Phe)
          description: Novel missense allele carried in compound heterozygosity by two Italian siblings.
          type: missense
      selected_evidence:
        snippet: Here we identified four unrelated patients with recessive mutations in COA7 among a Japanese
          case series of 1396 patients with Charcot-Marie-Tooth disease (CMT) or other inherited peripheral
          neuropathies, including complex forms of CMT.
        supports: SUPPORT
