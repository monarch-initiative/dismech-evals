      assertion:
        name: Atxn1-154Q knock-in mouse
        species: Mouse
        genotype: Atxn1(154Q/2Q) knock-in
        publication: PMID:30385727
        description: Knock-in mice carrying an expanded CAG repeat inserted into one endogenous Atxn1
          allele, expressing ATXN1 with 154 glutamines throughout the brain. They display ataxia and premature
          lethality, and were the model used to demonstrate ASO rescue.
        modeled_mechanisms:
        - target: ATXN1 CAG Repeat Expansion
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: MOLECULAR
          description: Places the expansion at the endogenous locus under native regulation, making it
            the appropriate model for testing ATXN1-lowering therapy.
          limitations: The 154-repeat allele is far longer than typical human pathogenic alleles (usually
            39 or more), compressing an adult-onset human disease into a rapid murine course.
          readouts:
          - name: Motor performance and survival after single ASO treatment
            target: ATXN1 CAG Repeat Expansion
            direction: RESTORED
            interpretation: Lowering the expanded transcript rescued both motor deficits and premature
              lethality, confirming ongoing dependence on the initiating lesion.
      selected_evidence:
        snippet: Atxn1154Q/2Q mice were generated by the insertion of an expanded CAG repeat into one
          endogenous Atxn12Q allele
        supports: SUPPORT
