          term:
            id: CL:0000121
            label: Purkinje cell
      selected_evidence:
        snippet: In SCA1 mice, there was a depletion of RORalpha and a reduction in expression of genes
          controlled by RORalpha. Partial loss of RORalpha enhanced mutant ATXN1 pathogenicity.
        supports: SUPPORT
