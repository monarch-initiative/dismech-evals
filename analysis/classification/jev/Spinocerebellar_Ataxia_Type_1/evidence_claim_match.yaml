  ab57315c26e800f3e053a3aad48e5932e5ca3a241311a64c0ca2969fe89cc508:
    claim:
      about:
        disease:
          name: Spinocerebellar Ataxia Type 1
          disease_term:
            preferred_term: Spinocerebellar ataxia type 1
            term:
              id: MONDO:0008119
              label: spinocerebellar ataxia type 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Ataxin-1-Capicua Transcriptional Repressor Activity
        conforms_to: polyglutamine_expansion_proteotoxicity#Transcriptional Dysregulation
        description: 'Both wild-type and expanded ataxin-1 assemble into large stable cerebellar complexes
          containing the transcriptional repressor Capicua (CIC), and ataxin-1 modulates Capicua repressor
          activity. SCA1 toxicity depends on this native interaction rather than on a novel one acquired
          by the expanded protein. The genetic test is decisive: duplicating the ataxin-1 paralog Atxn1l,
          which displaces mutant ataxin-1 from the Capicua complex, suppresses neuropathology in a knock-in
          SCA1 model. Ataxin-1 also both gains and partially loses interactions, so SCA1 combines a dominant
          gain of function with partial loss of normal ataxin-1 activity. Capicua is not the whole mechanism:
          abolishing the ATXN1-CIC interaction globally in knock-in mice normalized genome-wide CIC binding
          but only partially corrected transcriptional and behavioural phenotypes, and further ataxin-1
          transcription-factor partners (RFX1, ZBTB5, ZKSCAN1) have since been identified.'
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: negative regulation of transcription by RNA polymerase II
          term:
            id: GO:0000122
            label: negative regulation of transcription by RNA polymerase II
          modifier: GAIN_OF_FUNCTION
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
      selected_evidence:
        snippet: We examined soluble protein complexes from mouse cerebellum and found that the majority
          of wild-type and expanded ATXN1 assembles into large stable complexes containing the transcriptional
          repressor Capicua.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
