      assertion_type: Pathophysiology
      assertion:
        name: Ser776-Dependent Assembly of Mutant Ataxin-1 into Native Complexes
        description: 'Phosphorylation of ataxin-1 at serine 776 gates its incorporation into large soluble
          protein complexes. Transgenic mice expressing ataxin-1[82Q]-A776, which cannot be phosphorylated
          at this residue, place the expanded protein in Purkinje cell nuclei yet are substantially protected
          from disease. The same S776A substitution markedly reduces the association of mutant ataxin-1
          with Capicua in vivo, linking this phosphorylation site directly to the pathogenic complex.
          The kinases that place this mark are region-specific: MSK1 in cerebellum and RSK3 in brainstem.
          This is the clearest available answer to why a brain-wide protein kills only select populations,
          and it predicts that rescuing the whole disease requires targeting more than one regulator.'
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: protein phosphorylation
          term:
            id: GO:0006468
            label: protein phosphorylation
        - preferred_term: protein-containing complex assembly
          term:
            id: GO:0065003
            label: protein-containing complex assembly
      selected_evidence:
        snippet: Unlike MSK1, RSK3 is highly expressed in the human and mouse brainstems where it regulates
          Atxn1 by phosphorylating S776.
        supports: SUPPORT
