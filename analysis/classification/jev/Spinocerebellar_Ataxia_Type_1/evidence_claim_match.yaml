        description: The expanded repeat is translated in non-canonical reading frames as well as the
          polyglutamine frame, yielding sense polyserine and antisense polyleucine RAN proteins. These
          accumulate through cerebellum and pons in SCA1 autopsy brain, are prominent in cerebellar white
          matter where polyglutamine is minimal, and impair autophagy in neural cells. This is a protein-level
          consequence of the repeat that is nonetheless separate from ataxin-1 itself, which is why the
          entry does not claim the polyglutamine protein is the only toxic species.
