        name: ATXN1
        gene_term:
          preferred_term: ATXN1
          term:
            id: hgnc:10548
            label: ATXN1
        association: Translated CAG trinucleotide repeat expansion
        presence: Positive
        relationship_type: CAUSATIVE
        notes: The pathogenic allele is an expanded, unstable CAG repeat in the coding region of ATXN1,
          encoding an elongated polyglutamine tract in ataxin-1. Affected individuals usually carry 39
          or more repeats. The repeat is unstable in transmission, producing anticipation with a paternal
          expansion bias, and longer expansions predict both earlier onset and faster measured progression.
          Toxicity is a dominant gain of function acting through the normal, Ser776 phosphorylation-regulated
          ataxin-1 complexes rather than through a novel interaction, combined with a partial loss of
          other native ataxin-1 interactions.
        variant_origin: GERMLINE
      selected_evidence:
        snippet: The discovery that residues in ATXN1 outside of the polyglutamine tract are crucial for
          pathogenesis hinted that alterations in the normal function of this protein are linked to its
          toxicity.
        supports: SUPPORT
