      assertion_type: Biochemical
      assertion:
        name: Blood Neurofilament Light Chain
        biomarker_term:
          preferred_term: neurofilament light polypeptide
          term:
            id: NCIT:C88043
            label: Neurofilament Light Polypeptide
        notes: 'Blood neurofilament light chain is a fluid marker of neuroaxonal injury that changes before
          ataxia onset in the progressive cerebellar ataxias and predicts subsequent decline. Its importance
          here is the premanifest window it opens: with ATXN1-lowering therapies entering trials, a marker
          that moves before symptoms is what makes a preventive trial design possible. Volumetric, microstructural
          and spectroscopic MRI behave the same way. Note this is a class-level finding across the progressive
          cerebellar ataxias including SCA1, not a SCA1-only measurement, and the source is a review rather
          than a primary cohort. No SCA1-specific reference interval was identified, so none is recorded.'
      selected_evidence:
        snippet: Volumetric, microstructural, and spectroscopic MRI and blood neurofilament light chain
          change before ataxia onset and predict subsequent decline, whereas repeat length and genetic
          modifiers set prior risk.
        supports: SUPPORT
