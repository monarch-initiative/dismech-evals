      assertion_type: ProgressionInfo
      assertion:
        phase: Symptomatic progression
        notes: Once symptomatic, SCA1 progresses faster than the other common spinocerebellar ataxias.
          In the EUROSCA longitudinal cohort the annual increase on the Scale for the Assessment and Rating
          of Ataxia (SARA) was greater in SCA1 than in SCA2, SCA3, or SCA6, and longer repeat expansions
          predicted faster progression.
      selected_evidence:
        snippet: Annual SARA score increase was 2.11 (SE 0.12) in patients with SCA1, 1.49 (0.07) in patients
          with SCA2, 1.56 (0.08) in patients with SCA3, and 0.80 (0.09) in patients with SCA6.
        supports: SUPPORT
