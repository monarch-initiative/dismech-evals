          and bulbar features that place SCA1 in the ADCA-I class, and it is what ultimately kills. The
          brainstem branch is not simply the cerebellar mechanism spilling over: it is governed by a different
          Ser776 kinase, RSK3, whose reduction rescues brainstem pathology specifically, and the brainstem
          is the region whose pathology is most closely tied to premature death.'
