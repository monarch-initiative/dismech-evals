          mice expressing ataxin-1[82Q] with a mutated nuclear localization signal do not develop disease.
          Critically, visible nuclear aggregation is dissociable from toxicity: mice expressing a self-association-deficient
          ataxin-1[77Q] that forms no detectable nuclear inclusions still develop ataxia and Purkinje
          cell pathology. SCA1 is therefore not driven by inclusion formation per se, which distinguishes
          it from a simple aggregation model of polyglutamine disease.'
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: protein localization to nucleus
