        description: 'Mutant ataxin-1 depletes RORalpha, a transcription factor critical for cerebellar
          development, and reduces expression of RORalpha-controlled genes; partial loss of RORalpha enhances
          mutant ataxin-1 pathogenicity. Because RORalpha acts developmentally, the timing of mutant ataxin-1
          expression matters: delaying its postnatal expression until cerebellar development is complete
          substantially reduces adult disease severity. This gives SCA1 a developmental component on top
          of its adult-onset degeneration.'
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: cerebellar Purkinje cell layer development
          term:
