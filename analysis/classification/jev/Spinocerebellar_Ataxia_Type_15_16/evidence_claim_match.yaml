      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing
        description: Diagnosis is confirmed by molecular genetic testing detecting a heterozygous ITPR1
          pathogenic sequence variant or, importantly, a copy-number deletion. Because single-exon and
          whole-gene deletions can be missed by sequence-only workflows, copy-number analysis (MLPA, dosage
          analysis, SNP array, or read-depth CNV calling) should accompany sequencing for ITPR1.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: we suggest adding CNV analysis alongside SNV analysis to SCA gene diagnostics using next-generation
          sequencing approaches, at least for ITPR1
        supports: SUPPORT
