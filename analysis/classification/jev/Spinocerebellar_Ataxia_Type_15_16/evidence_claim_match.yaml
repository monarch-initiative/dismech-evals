              label: spinocerebellar ataxia type 15/16
        context: []
      assertion_type: Genetic
      assertion:
        name: ITPR1 Pathogenic Variants
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        notes: Most SCA15/16 cases are caused by heterozygous partial or whole-gene deletions of ITPR1
          producing haploinsufficiency; reported deletions have involved ITPR1 exons 1-10, 1-40, 1-41,
          1-44, 1-48, and the complete gene, sometimes extending into adjacent SUMF1 sequence. Heterozygous
          missense variants (e.g., p.Pro1059Leu) have also been reported. ITPR1 is allelic with SCA29
          (congenital nonprogressive ataxia) and Gillespie syndrome.
        gene_term:
          preferred_term: ITPR1
          term:
            id: hgnc:6180
            label: ITPR1
      selected_evidence:
        snippet: Of the 338 patients with cerebellar ataxia, we identified putative clinically relevant
          CNV deletions in 3 patients
        supports: SUPPORT
