            term:
              id: MONDO:0011694
              label: spinocerebellar ataxia type 15/16
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ITPR1 Haploinsufficiency
        description: Heterozygous deletions (partial or whole-gene) and, less commonly, missense variants
          in ITPR1 reduce the dose of functional IP3R1, the endoplasmic reticulum inositol 1,4,5-trisphosphate-gated
          calcium-release channel. In deletion carriers, loss of one ITPR1 copy reduces ITPR1 RNA and
          protein; because heterozygous loss of the adjacent SUMF1 gene does not cause a movement disorder,
          ITPR1 haploinsufficiency - not SUMF1 loss - is the causal mechanism.
        biological_processes:
        - preferred_term: release of sequestered calcium ion into cytosol
          term:
            id: GO:0051209
            label: release of sequestered calcium ion into cytosol
          modifier: DECREASED
      selected_evidence:
        snippet: the CNV deletion in ITPR1 was clearly the underlying cause of SCA15 in the 2 related
          patients
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38058854
      reference_title: Copy Number Variant Analysis of Spinocerebellar Ataxia Genes in a Cohort of Dutch
        Patients With Cerebellar Ataxia.
      evidence_source: HUMAN_CLINICAL
      explanation: A heterozygous ITPR1 copy-number deletion was the clear cause of SCA15 in the affected
        patients, consistent with loss of one ITPR1 copy (haploinsufficiency) as the disease mechanism.
