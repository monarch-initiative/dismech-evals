      assertion_type: Pathophysiology
      assertion:
        name: Purkinje Cell Dysfunction and Degeneration
        description: Reduced IP3R1 disproportionately affects cerebellar Purkinje cells, in which IP3R1
          is very highly expressed and supports mGluR1-PLC-IP3 calcium signaling, dendritic integration,
          synaptic plasticity, and firing precision. Aberrant intracellular calcium homeostasis produces
          Purkinje-cell dysfunction and, over time, degeneration, reducing inhibitory cerebellar cortical
          output.
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        locations:
        - preferred_term: cerebellar cortex
          term:
            id: UBERON:0002129
            label: cerebellar cortex
      selected_evidence:
        snippet: markedly decreased levels of Itpr1 in cerebellar Purkinje cells
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17590087
      reference_title: Deletion at ITPR1 underlies ataxia in mice and spinocerebellar ataxia 15 in humans.
      evidence_source: MODEL_ORGANISM
      explanation: In the orthologous mouse model, the ITPR1 deletion markedly reduces IP3R1 protein in
        cerebellar Purkinje cells, the cell type disproportionately affected in SCA15/16.
