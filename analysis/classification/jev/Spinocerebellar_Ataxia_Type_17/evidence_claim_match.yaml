        association: CAG/CAA polyglutamine repeat expansion
        presence: Positive
        notes: 'The pathogenic variant is an expanded glutamine-encoding repeat in exon 3 of TBP. Normal
          alleles are typically in the mid-20s to 40 repeats. The pathogenic threshold is narrow: reduced
          penetrance is established for many 43-48-repeat alleles, and some 49-51-repeat alleles can remain
          nonpenetrant or have very late onset. Longer repeat lengths correlate with earlier onset. CAA
          interruptions generally stabilize transmission, so anticipation is less frequent than in many
          other polyglutamine SCAs.'
      selected_evidence:
        snippet: Observed pathogenic expansions ranged from 43-63 glutamine (Gln) codons (Gln43-63). Reduced
          penetrance is known for Gln43-48 alleles.
        supports: SUPPORT
