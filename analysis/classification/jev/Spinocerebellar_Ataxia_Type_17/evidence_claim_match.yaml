        description: Mutant TBP binds the CCAAT-binding transcription factor NFY more tightly, sequestering
          NFYA into mutant TBP aggregates and blocking NFY occupancy of chaperone gene promoters. The
          result is reduced Hsp70, Hsp25, and HspA5 expression and a blunted heat shock / unfolded protein
          response. With age, a constitutive decline in Hsc70 chaperone activity compounds this deficit
          and contributes to late-onset selective neuronal vulnerability.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
