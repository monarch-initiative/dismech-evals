      assertion_type: Pathophysiology
      assertion:
        name: TBP-NFY interference impairs chaperone expression
        description: Mutant TBP binds the CCAAT-binding transcription factor NFY more tightly, sequestering
          NFYA into mutant TBP aggregates and blocking NFY occupancy of chaperone gene promoters. The
          result is reduced Hsp70, Hsp25, and HspA5 expression and a blunted heat shock / unfolded protein
          response. With age, a constitutive decline in Hsc70 chaperone activity compounds this deficit
          and contributes to late-onset selective neuronal vulnerability.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: chaperone-mediated protein folding
          term:
            id: GO:0006457
            label: protein folding
        - preferred_term: response to unfolded protein
          term:
            id: GO:0006986
            label: response to unfolded protein
        - preferred_term: regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: In SCA17 cells, HSPA5 promoter activity was activated as a compensatory response before
          aggregate formation. NFYA dysfunction was indicated in SCA17 cells as HSPA5 promoter activity
          reduced along with TBP aggregate formation.
        supports: SUPPORT
