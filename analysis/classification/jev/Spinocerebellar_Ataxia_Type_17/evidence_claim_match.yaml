        name: Polyglutamine-driven Purkinje cell selective vulnerability
        conforms_to: polyglutamine_expansion_proteotoxicity#Selective Neuronal Dysfunction and Loss
        description: Despite ubiquitous TBP expression, polyglutamine expansion preferentially causes
          cerebellar neurodegeneration because adult cerebellar neurons are more vulnerable to mutant
          TBP than striatal or cortical neurons. The selective vulnerability of Purkinje cells emerges
          from the convergent toxic effects of mutant TBP on tissue-enriched cerebellar proteins and pathways
          — including INPP5A-dependent calcium homeostasis, Purkinje-enriched MANF neurotrophic support,
          and glial NF-kB inflammatory amplification — that are disproportionately concentrated in the
          cerebellum.
        cell_types:
        - preferred_term: Purkinje cell
          term:
