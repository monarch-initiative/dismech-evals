            label: response to unfolded protein
        - preferred_term: regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: Mutant TATA box-binding protein binds more tightly to the transcription factor nuclear
          factor-Y, inhibits its association with the chaperone protein promoter, as well as the promoter
          activity and reduces the expression of the chaperones Hsp70, Hsp25 and HspA5, and their response
          to stress.
        supports: SUPPORT
