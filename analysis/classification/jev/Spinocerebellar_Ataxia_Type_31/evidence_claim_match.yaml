        snippet: 'Our study indicated the averaged clinical course of SCA31 as follows: the patients develop
          ataxic symptoms at 58.5 ± 10.3 years, become wheelchair bound at 79.4 ± 1.7 years, and died
          at 88.5 ± 0.7 years.'
