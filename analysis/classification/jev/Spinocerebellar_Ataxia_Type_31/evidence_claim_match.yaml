  2117b3269d326d587751606653ca4d0fb5886d3c75f0bee4fb9d10466f2c87af:
    claim:
      about:
        disease:
          name: Spinocerebellar Ataxia Type 31
          disease_term:
            preferred_term: spinocerebellar ataxia type 31
            term:
              id: MONDO:0007296
              label: spinocerebellar ataxia type 31
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BEAN1/TK2 Intronic (TGGAA)n Pentanucleotide Repeat Insertion
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: cerebellar_purkinje_degeneration#Cerebellar Neuron Insult
        description: 'The causative lesion is a 2.5-3.8 kb insertion of complex pentanucleotide repeats
          at 16q22.1, located in an intronic segment shared by BEAN1 and TK2. The insertion contains (TGGAA)n,
          (TAGAA)n, (TAAAA)n and (TAAAATAGAA)n, but only (TGGAA)n segregates with the disease: the other
          motifs are encountered in control Japanese chromosomes, and the rare control insertions lack
          the (TGGAA)n stretch. This is the disorder-specific substitution this entry makes against the
          generic molecular lesion of the conserved Purkinje-degeneration module.

          Two negatives matter for interpretation. Insertion size alone does not establish pathogenicity,
          because control alleles can also carry a large insertion; the (TGGAA)n content does. And the
          lesion is intronic and far larger than an exome read, so standard exome sequencing does not
          exclude it.'
        genes:
        - preferred_term: BEAN1
          term:
            id: hgnc:24160
            label: BEAN1
        - preferred_term: TK2
          term:
            id: hgnc:11831
            label: TK2
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
      selected_evidence:
        snippet: The other was an insertion, from 2.5-3.8 kb long, consisting of complex penta-nucleotide
          repeats including a long (TGGAA)n stretch.
        supports: SUPPORT
