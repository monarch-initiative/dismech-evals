      assertion_type: Treatment
      assertion:
        name: Multidisciplinary Rehabilitation
        therapeutic_modality: BEHAVIORAL
        description: 'There is no disease-modifying therapy for SCA31, and management is supportive: physical
          therapy for balance, gait and falls prevention, occupational therapy and home-safety assessment,
          and speech and swallowing therapy. A seven-year follow-up of annual four-week intensive rehabilitation
          in patients with pure cerebellar SCA6 or SCA31 found SARA scores stable through year six, better
          than the expected natural history, with deterioration appearing at year seven; balance measured
          by the BESTest declined earlier, from year three. The study is small (seven patients) and mixes
          SCA6 with SCA31, so it supports rehabilitation as worthwhile maintenance rather than as an SCA31-specific
          intervention with a measured effect size.'
        treatment_term:
          preferred_term: rehabilitation
          term:
            id: NCIT:C15315
            label: Rehabilitation
      selected_evidence:
        snippet: Annual intensive rehabilitation effectively slowed the progression of ataxic symptoms
          (SARA) for up to six years, while balance function (BESTest) showed a significant decline from
          the third year.
        supports: SUPPORT
