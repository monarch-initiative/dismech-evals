        description: SCA31 is taught as a pure cerebellar ataxia, and the founding Japanese descriptions
          recorded no pyramidal signs, neuropathy or gaze limitation. The largest pooled review found
          extracerebellar signs in 52.5% of 374 patients, predominantly dysreflexia, vibratory hypoesthesia
          and hypoacousia. The practical consequence is that the presence of such signs should not by
          itself steer a workup away from SCA31, while their attribution to SCA31 in an individual patient
          in their seventies remains uncertain.
      selected_evidence:
        snippet: Extracerebellar signs were observed in 52.5% of patients, primarily consisting of dysreflexia,
          vibratory hypoesthesia and hypoacousia.
