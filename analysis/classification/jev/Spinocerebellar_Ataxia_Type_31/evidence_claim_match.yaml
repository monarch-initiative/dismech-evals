        context: []
      assertion_type: Treatment
      assertion:
        name: Naphthyridine Carbamate Dimer (Preclinical)
        therapeutic_modality: SMALL_MOLECULE
        description: 'An experimental small molecule, not a treatment. Naphthyridine carbamate dimer (NCD)
          binds the r(UGGAA)n repeat, recognizing four guanines in the UGGAA/UGGAA pentad, and disrupts
          RNA foci and the repeat''s interactions with TDP-43, HNRNPM and SRSF9. Fed to larvae of the
          SCA31 Drosophila model it alleviates the repeat-induced phenotype. It is curated because it
          is the only compound with a demonstrated effect on the SCA31 lesion and because it targets a
          pathophysiology node directly, not because it is near clinical use: there is no mammalian efficacy,
          pharmacokinetic or safety data, and its disruption of nuclear stress bodies suppresses a physiological
          splicing process, which is a mechanism-level liability rather than a hypothetical one.'
      selected_evidence:
        snippet: Feeding NCD to larvae of the Drosophila model of SCA31 alleviates the disease phenotype
          induced by toxic r(UGGAA)n repeat RNA.
        supports: SUPPORT
