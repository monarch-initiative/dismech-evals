        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sca31_foci_versus_ppr_contribution
        prompt: How much of SCA31 Purkinje cell degeneration is caused by the (UGGAA)n RNA itself versus
          by the poly-WNGME pentapeptide protein it is translated into?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Nuclear (UGGAA)n RNA Foci in Purkinje Cells
        - pathophysiology#Repeat-Associated Translation of poly-WNGME Pentapeptide Protein
        rationale: 'Both toxic species are present in patient Purkinje cells and both are produced by
          the fly model, but no experiment has separated their contributions. The obvious dissection,
          suppressing translation while leaving the RNA or the reverse, is complicated in SCA31 specifically,
          because the same manipulation affects both arms: raising TDP-43 reduces foci and PPR production
          together. It is complicated further by the unresolved translation route, since the repeat contains
          its own AUG and cannot be assumed to be RAN-translated, so a strategy that blocks RAN translation
          may not apply here. The answer matters for therapy: an approach that clears the transcript addresses
          both arms, whereas a translation-directed approach addresses only one.'
        proposed_experiments:
        - experiment_id: exp_sca31_translation_blocked_repeat
          name: Translation-silent (UGGAA)n allele in a mammalian Purkinje cell system
          description: Express an (UGGAA)n repeat engineered to retain its RNA structure and foci-forming
            capacity while being unable to produce poly-WNGME, alongside the wild-type repeat, in a mammalian
            Purkinje-cell system, and compare toxicity.
          decision_criterion: Comparable toxicity from the translation-silent allele would attribute the
            damage predominantly to the RNA; markedly reduced toxicity would implicate the PPR protein.
        - experiment_id: exp_sca31_ppr_only_expression
          name: Direct poly-WNGME expression without the repeat RNA
          description: Express poly-WNGME from a codon-altered, non-repetitive construct that makes the
            protein without producing (UGGAA)n RNA, and assay Purkinje cell toxicity.
          decision_criterion: Toxicity from the protein alone would establish an RNA-independent contribution;
            its absence would argue the PPR protein is a marker rather than a driver.
      selected_evidence:
        snippet: It is important to understand the contributions of repeat RNA and PPR proteins to disease
          pathogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
