            term:
              id: MONDO:0007296
              label: spinocerebellar ataxia type 31
        context: []
      assertion_type: Genetic
      assertion:
        name: TK2
        gene_term:
          preferred_term: TK2
          term:
            id: hgnc:11831
            label: TK2
        association: Shares the affected intron; transcribed in the opposite direction
        relationship_type: MODIFIER
        notes: 'TK2 is listed here because the repeat insertion lies in an intron it shares with BEAN1,
          and TK2 is therefore the source of the antisense (UUCCA)n transcript. This is a locus relationship,
          not a coding gene-disease relationship, and it is emphatically not TK2 deficiency: the recessive
          coding-variant mitochondrial DNA depletion syndrome caused by TK2 is a different disease with
          a different mechanism, and its clinical trials are not SCA31 trials. The original report also
          found a single-nucleotide change in a TK2 intron segregating with SCA31, but showed it did not
          affect splicing or expression, so it is not curated as causal. The relationship type is MODIFIER
          rather than CAUSATIVE for that reason: the gene contributes the antisense transcript and the
          shared intron, not the causal lesion.'
      selected_evidence:
        snippet: While TK2 is ubiquitously expressed, BEAN1 is transcribed only in the brain.
        supports: SUPPORT
