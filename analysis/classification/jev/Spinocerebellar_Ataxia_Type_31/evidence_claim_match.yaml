  60a48d1082cbcc5a018a12291240363e70b494b151413a16c01fdf62b7e1b596:
    claim:
      about:
        disease:
          name: Spinocerebellar Ataxia Type 31
          disease_term:
            preferred_term: spinocerebellar ataxia type 31
            term:
              id: MONDO:0007296
              label: spinocerebellar ataxia type 31
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Purkinje cell loss with halo-like amorphous perisomatic material
        diagnostic: false
        description: 'The signature SCA31 finding. Surviving Purkinje cells are surrounded by halo-like
          amorphous material composed of calbindin-positive somatic sprouts and synaptophysin-positive
          presynaptic terminals innervated from basket cells, inferior olivary neurons and other Purkinje
          cell afferents. The halo is therefore aberrant perisomatic reinnervation, not a protein aggregate,
          which distinguishes SCA31 from the inclusion-body pathology of the polyglutamine ataxias. Ubiquitin-positive
          degradation granules and Golgi fragmentation are enriched in the same cells, and the halo-bearing
          cells carry bent, elongated, folded nuclei while cells without the halo shrink with slender
          condensed nuclei.

          No finding_term is bound. HistopathologyFindingTerm is reachable only from the NCIT Histopathology
          Result branch plus a handful of HP rosette terms; neither NCIT nor HP names perisomatic sprouting
          around a degenerating Purkinje cell, and binding a generic neuronal-loss term would drop what
          is specific about this finding.'
      selected_evidence:
        snippet: We found that bent, elongated, often folded nuclei were observed frequently in degenerating
          Purkinje cells with the halo-like structure.
        supports: SUPPORT
    origin:
