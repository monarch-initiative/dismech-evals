  6b11e60ce210521d2a71203edcf16387877ea6154b836dd3e08786b397e2a835:
    claim:
      about:
        disease:
          name: Spinocerebellar Ataxia Type 31
          disease_term:
            preferred_term: spinocerebellar ataxia type 31
            term:
              id: MONDO:0007296
              label: spinocerebellar ataxia type 31
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nuclear (UGGAA)n RNA Foci in Purkinje Cells
        biological_scale: CELLULAR
        description: 'The (UGGAA)n transcript accumulates as discrete nuclear RNA foci in cerebellar Purkinje
          cells of SCA31 patients and not in controls. The foci are confined to Purkinje cell nuclei,
          are not seen in other neurons or in glia, are detected in roughly 30% of patient Purkinje cells
          examined, and measure about 0.2 to 1.8 micrometres. In the SCA31 fly model the number of foci
          tracks with disease severity, which is the closest available link between foci burden and outcome.

          A precise reading of what the human data show: the foci are associated with Purkinje cell degeneration.
          That is the word the neuropathology paper uses, and this entry keeps it. Whether foci formation
          is the proximal cause of the degeneration, or an accompanying marker of the toxic transcript,
          is not settled by an association in fixed tissue.'
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        cellular_components:
        - preferred_term: nuclear (UGGAA)n RNA focus
          term:
            id: GO:0035770
            label: ribonucleoprotein granule
      selected_evidence:
        snippet: We find that the RNA foci containing (UGGAA)n are indeed observed in PC nuclei of both
          SCA31 patients, whereas similar foci were not observed in control individuals.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
