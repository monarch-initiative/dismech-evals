        description: Diagnosis is molecular, and the assay has to be chosen for the lesion. The insertion
          is large, compositionally complex and intronic, so it is not resolved by standard exome sequencing
          and a negative exome does not exclude SCA31. Historically the allele was characterized by Southern
          blot with motif-specific probes, and this remains the method that distinguishes a pathogenic
          (TGGAA)n-containing insertion from a non-pathogenic control insertion of comparable size. Fragment-length
          methods that report only insertion size cannot make that distinction.
      selected_evidence:
        snippet: These data indicate that control alleles very rarely have a nonpathogenic large insertion
          in the SCA31 critical region and that not only the presence of the insertion but also its size
          is not sufficient evidence for a disease-causing allele.
