  a50b768475ff66060cdb8e20214ff6e7ad67abc684d730407f0dc4ef05479dab:
    claim:
      about:
        disease:
          name: Spinocerebellar Ataxia Type 31
          disease_term:
            preferred_term: spinocerebellar ataxia type 31
            term:
              id: MONDO:0007296
              label: spinocerebellar ataxia type 31
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bidirectional Transcription of the Repeat into (UGGAA)n Repeat RNA
        biological_scale: MOLECULAR
        description: 'The insertion is transcribed as two independent non-coding repeat RNAs: (UGGAA)n
          in the BEAN1 direction, brain-restricted, and (UUCCA)n in the TK2 direction, ubiquitous. The
          (UGGAA)n species is treated as the pathogenic one on three grounds: BEAN1 is brain-only while
          the disease is confined to the nervous system, RNA foci in patient Purkinje cells are detected
          only in the BEAN1 direction with no antisense foci, and the BEAN1-direction transcript is the
          more toxic of the two in cultured cells.

          This node also carries the reason the entry does not model a loss-of-function mechanism: BEAN1,
          TK2 and neighbouring gene expression and splicing are comparable between patient and control
          cerebella, so haploinsufficiency is not the primary route. That negative comes with its own
          caveat, quoted below, because bulk cerebellar measurement averages over a tissue in which Purkinje
          cells are a small minority.'
        biological_processes:
        - preferred_term: transcription of the intronic pentanucleotide repeat
          term:
            id: GO:0006351
            label: DNA-templated transcription
      selected_evidence:
        snippet: In both transiently and stably expressed cultured cell models, we also find that the
          mutation transcribed in the BEAN1-direction yields more toxicity than control transcripts
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23607545
      reference_title: Abnormal RNA structures (RNA foci) containing a penta-nucleotide repeat (UGGAA)n
