  9ec35698bf63222612ac0ecf84f728ce54c74874dae200c74f3ca0fe655599f7:
    claim:
      about:
        disease:
          name: Spinocerebellar Ataxia Type 31
          disease_term:
            preferred_term: spinocerebellar ataxia type 31
            term:
              id: MONDO:0007296
              label: spinocerebellar ataxia type 31
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sca31_drosophila_translational_validity
        prompt: Does the (UGGAA)n Drosophila model, in which the repeat is overexpressed from a heterologous
          driver in a nervous system with no cerebellum, capture the biology that makes SCA31 a Purkinje-cell
          disease?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - animal_models#Drosophila melanogaster
        - pathophysiology#Binding and Redistribution of RNA-Binding and Splicing Factors
        rationale: Almost every mechanistic claim about SCA31 beyond the human autopsy findings rests
          on the fly. The mismatch is specific rather than generic. The most distinctive feature of human
          SCA31 is that foci and degeneration are confined to Purkinje cells and spare other neurons and
          glia, and Drosophila has neither a cerebellum nor a Purkinje cell, so the model cannot address
          selectivity at all. The fly expresses the repeat from a GAL4 driver at supraphysiological levels
          rather than from an endogenous intron under BEAN1 transcriptional control, and the toxicity
          is explicitly expression-level dependent, so the dose relationship in the model is not the dose
          relationship in patients. The rescue result on which the whole RNA-chaperone therapeutic hypothesis
          rests, that raising TDP-43, FUS or hnRNPA2B1 suppresses toxicity, has not been reproduced in
          a mammalian system, and those proteins are pleiotropic enough that the manipulation may not
          be tolerable in one. No mouse model of the SCA31 insertion has been reported.
        proposed_experiments:
        - experiment_id: exp_sca31_knockin_mouse
          name: Knock-in mouse carrying the (TGGAA)n insertion at the orthologous intron
          description: Generate a mouse carrying the human-length (TGGAA)n-containing insertion at the
            orthologous Bean1/Tk2 shared intron, so the repeat is transcribed under endogenous brain-restricted
            control, and assay for Purkinje-cell foci, PPR protein, and age-dependent ataxia.
          decision_criterion: Purkinje-cell-selective foci and late-onset ataxia would establish that
            the fly findings translate to a mammalian cerebellum; their absence at physiological expression
            would show the fly phenotype depends on overexpression.
        - experiment_id: exp_sca31_ipsc_purkinje
          name: Patient-derived iPSC Purkinje cells
          description: Differentiate Purkinje-like neurons from SCA31 patient iPSCs carrying the endogenous
            insertion and test whether foci form, PPR protein accumulates, and RNA-binding-protein supplementation
            rescues, in a human cerebellar cell type at endogenous expression.
          decision_criterion: Reproduction of the fly rescue in human Purkinje-like cells would support
            the RNA-chaperone strategy; failure would localize the effect to the fly's overexpression
            regime.
      selected_evidence:
        snippet: Subsequent investigation by over-expressing (UGGAA)n in Drosophila revealed that the
          RNA containing (UGGAA)n exerts toxicity in a length- and expression level-dependent manner
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36319738
      reference_title: Spinocerebellar ataxia type 31 (SCA31).
      evidence_source: MODEL_ORGANISM
      explanation: 'Quoted for the words over-expressing and expression level-dependent, which together
        are the mismatch: the model''s phenotype is a function of a dose the endogenous locus does not
        deliver.'
