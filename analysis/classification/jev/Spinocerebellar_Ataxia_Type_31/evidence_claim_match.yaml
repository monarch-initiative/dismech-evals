        notes: SCA31 is among the latest-onset of all the spinocerebellar ataxias. A four-year prospective
          study of 44 genetically confirmed patients across ten Nagano referral centres measured a SARA
          progression of 0.8 points per year and a Barthel Index decline of 2.3 points per year, and summarized
          the averaged course as ataxia onset at 58.5 years, wheelchair dependence at 79.4, and death
          at 88.5. Shorter disease duration at baseline predicted faster SARA progression. These are cohort
          means from one region, not individual prognoses, and the cohort's mean age at enrolment was
          already 73.6 years.
