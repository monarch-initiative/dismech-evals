        association: Intronic complex pentanucleotide repeat insertion containing (TGGAA)n
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'The disease allele is a heterozygous 2.5-3.8 kb insertion of complex pentanucleotide repeats
          in an intron of BEAN1 at 16q22.1. The insertion contains (TGGAA)n, (TAGAA)n, (TAAAA)n and (TAAAATAGAA)n,
          but only (TGGAA)n is disease-specific; the others occur on control chromosomes. Insertion size
          correlates inversely with age at onset but not with the rate of progression after onset.

          Interpretation caveats that matter at the bench. Size alone does not make an allele pathogenic:
          about 0.7% of controls in one Nagano series carried insertions of 1.0 to 3.5 kb, and those insertions
          lacked (TGGAA)n at their 5'' end by sequencing and by Southern hybridization. The mechanism
          is a toxic RNA gain of function rather than a coding change in BEAN1, so no variant-level protein
          consequence is recorded here; there is no protein product of the repeat to describe.

          A single homozygote has been reported, carrying insertions of about 3.0 and 4.3 kb, of which
          only the 3.0 kb allele contained the (TGGAA)n stretch. The authors are explicit that whether
          a large insertion lacking (TGGAA)n is non-pathogenic remains undetermined.'
      selected_evidence:
        snippet: The other was an insertion, from 2.5-3.8 kb long, consisting of complex penta-nucleotide
          repeats including a long (TGGAA)n stretch.
        supports: SUPPORT
