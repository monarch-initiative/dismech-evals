        context: []
      assertion_type: Genetic
      assertion:
        name: NOP56
        gene_term:
          preferred_term: NOP56
          term:
            id: hgnc:15911
            label: NOP56
        association: GGCCTG hexanucleotide repeat expansion in intron 1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Positive
        notes: NOP56 encodes a core scaffold protein of the box C/D small nucleolar ribonucleoprotein
          complex, which directs 2'-O-methylation of ribosomal RNA. The pathogenic allele is a heterozygous
          GGCCTG expansion in intron 1. Neither NOP56 mRNA nor NOP56 protein levels were appreciably reduced
          in patient lymphoblastoid cells, so haploinsufficiency is not the favored mechanism. Repeat
          length is somatically unstable, which is why Southern blotting of an expanded allele gives a
          smeared rather than a discrete band.
        variants:
        - name: NOP56 intron 1 GGCCTG hexanucleotide repeat expansion
          description: Non-coding hexanucleotide repeat expansion in intron 1 of NOP56. Normal alleles
            carry 3-14 repeats. Typical pathogenic alleles carry roughly 650 or more, up to about 2500,
            but three affected individuals in a multicentre cohort carried only 25, 30 and 31 repeats
            with clinical features indistinguishable from carriers of long expansions, so a short expansion
            does not exclude the diagnosis.
          gene:
            preferred_term: NOP56
            term:
              id: hgnc:15911
              label: NOP56
          clinical_significance: PATHOGENIC
          type: hexanucleotide_repeat_expansion
      selected_evidence:
        snippet: we sequenced 33 of these and observed a large expansion of an intronic GGCCTG hexanucleotide
          repeat in NOP56
        supports: SUPPORT
