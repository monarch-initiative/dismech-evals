        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nop56_dosage_branch
        kind: CONTROVERSY
        status: OPEN
        prompt: Does reduced NOP56 dosage, and consequent box C/D snoRNP and rRNA-processing impairment,
          contribute to SCA36 at all?
        attaches_to:
        - pathophysiology#Impaired NOP56 Box C/D snoRNP Function
        rationale: 'This is the main alternative to the RNA gain-of-function account, and it is argued
          against rather than untested. NOP56 mRNA and protein were measured in patient lymphoblastoid
          cells and were not appreciably reduced, and Cajal body number was unchanged. The zebrafish nop56
          null then showed what complete loss of the gene produces — absent cerebellum and death within
          a week — which is not the disease. Neither result is decisive: the patient measurements are
          in a peripheral cell type, as with MIR1292, and a homozygous zebrafish null is several steps
          removed from a heterozygous human repeat expansion, so a partial or cell-type-restricted dosage
          effect in neurons is not excluded. Measuring NOP56 and rRNA 2''-O-methylation in patient cerebellum,
          or in expansion-carrying neurons, is what would settle it.'
      selected_evidence:
        snippet: We observed a severe neurodegenerative phenotype in nop56 mutants, characterized mainly
          by absence of cerebellum, reduced numbers of spinal cord neurons, high levels of apoptosis in
          the central nervous system (CNS) and impaired movement, resulting in death before 7 days post-fertilization.
        supports: REFUTE
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
