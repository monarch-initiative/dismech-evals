      assertion:
        name: MIR1292 Downregulation
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        description: The MIR1292 gene lies 19 bp downstream of the repeat, and its transcription is reduced
          in lymphoblastoid cells from expansion carriers in two independent cohorts. In the Han Chinese
          cohort, four of seven predicted targets were unchanged and three were unmeasurable in lymphoblastoid
          cells, and the authors raised the possibility that reduced MIR1292 is an epiphenomenon of the
          expansion. No downstream target has been demonstrated in cerebellar or motor neuron tissue,
          so this node is deliberately left with no outgoing edge; see the mir1292_contribution discussion.
      selected_evidence:
        snippet: It is possible that microRNA-1292 expression is simply an epiphenomenon of abnormal (GGCCTG)n
          expansion and might not play an active role in disease pathogenesis.
        supports: SUPPORT
