        description: Retained (GGCCUG)n repeat RNA accumulates as discrete nuclear foci. Foci are demonstrable
          by fluorescence in situ hybridization in patient lymphoblastoid cells, patient iPSCs and iPSC-derived
          neurons, and in autopsied brain, where sense but not antisense foci are found. In autopsy tissue
          the foci occur in neuronal nuclei of cerebrum, cerebellum, inferior olive, spinal cord and temporal
          muscle, and include giant foci nearly 10 micrometres across in Purkinje cells and spinal motor
          neurons.
        biological_processes:
        - preferred_term: mRNA splicing, via spliceosome
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: ABNORMAL
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        - preferred_term: spinal motor neuron
          term:
            id: CL:0011001
            label: spinal cord motor neuron
      selected_evidence:
        snippet: Of interest is that the giant RNA foci, nearly 10 μm in diameter, that were detected
          in Purkinje cells, spinal motor neurons and most frequently in the inferior olivary nucleus,
          may be responsible for pivotal clinical symptoms of Asidan.
        supports: SUPPORT
