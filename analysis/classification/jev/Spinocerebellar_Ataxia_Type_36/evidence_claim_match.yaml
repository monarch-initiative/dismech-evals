        context: []
      assertion_type: Treatment
      assertion:
        name: Antisense oligonucleotides targeting the expanded NOP56 repeat (investigational)
        description: Preclinical only. Antisense oligonucleotides directed at the expanded repeat or at
          NOP56 intron 1 reduce RNA foci in patient iPSCs and iPSC-derived neurons and reduce poly(GP)
          in patient fibroblasts and lymphoblastoid cells. Because NOP56 is an essential protein, the
          therapeutic window depends on suppressing the repeat-containing transcript without lowering
          total NOP56, which has been achieved at low ASO doses. No clinical trial in SCA36 has been reported.
        therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
        oligonucleotide_details:
          oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
          target_gene:
            preferred_term: NOP56
            term:
              id: hgnc:15911
              label: NOP56
          target_transcript: NOP56 intron 1 GGCCUG repeat-containing pre-mRNA
          conjugation: UNCONJUGATED
          delivery_platform: UNFORMULATED
        notes: 'Poly(GP) is detectable in SCA36 cerebrospinal fluid and has been proposed as a pharmacodynamic
          marker of ASO target engagement. The ASO chemistries reported so far differ: an ethylene-bridged
          nucleic acid series in the iPSC study and RNase H-dependent designs in the DPR study, so oligonucleotide_chemistry
          is left unset for this composite entry.'
      selected_evidence:
        snippet: Together, our data provide proof-of-principle that ASOs targeting the expanded TG3C2
          repeat can be a viable therapeutic strategy for reducing repeat-RNA and DPRs in SCA36
        supports: SUPPORT
