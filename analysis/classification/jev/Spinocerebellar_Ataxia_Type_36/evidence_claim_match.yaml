      assertion:
        name: Dipeptide Repeat Protein Production from the Expanded Repeat
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: The intron-retained GGCCTG repeat transcript is translated into dipeptide repeat
          proteins. In patient tissue poly(GP) is produced abundantly by canonical AUG-mediated translation
          reading through the retained intron, while the antisense product poly(PR) indicates that repeat-associated
          non-AUG (RAN) translation also occurs. Unlike in C9orf72 disease, SCA36 poly(GP) remains soluble
          and TDP-43 pathology is absent. Whether the DPRs are pathogenic in SCA36 or a comparatively
          inert byproduct is not settled — a Neuro2A model found RAN-derived DPR formation from expanded
          GGCCTG to be rare.
        biological_processes:
        - preferred_term: translation
          term:
            id: GO:0006412
            label: translation
          modifier: ABNORMAL
      selected_evidence:
        snippet: Here, we show the similar intronic GGCCTG HREs that causes spinocerebellar ataxia type
          36 (SCA36) is also translated into DPRs, including poly(GP) and poly(PR).
        supports: SUPPORT
