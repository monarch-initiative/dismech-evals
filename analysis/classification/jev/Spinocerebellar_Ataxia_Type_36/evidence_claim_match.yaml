      assertion:
        name: Impaired NOP56 Box C/D snoRNP Function
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        description: 'The alternative loss-of-function branch. NOP56 is a core scaffold of the box C/D
          small nucleolar ribonucleoprotein complex that directs 2''-O-methylation of ribosomal RNA, so
          reduced NOP56 dosage would be expected to impair rRNA processing and ribosome biogenesis. This
          node is deliberately left with no incoming or outgoing causal edge, because the branch is not
          supported as the patient mechanism: NOP56 mRNA and protein are not appreciably reduced in patient
          cells, and the zebrafish nop56 null shows what complete loss of the gene actually produces —
          an embryonic-lethal failure of cerebellar development, not a late-onset selective degeneration.
          It is recorded so the hypothesis is visible and falsifiable rather than surviving only as prose.
          See the nop56_dosage_branch discussion.'
        genes:
        - preferred_term: NOP56
          term:
            id: hgnc:15911
            label: NOP56
        biological_processes:
        - preferred_term: rRNA processing
          term:
            id: GO:0006364
            label: rRNA processing
          modifier: DECREASED
      selected_evidence:
        snippet: These findings were not able to support the haploinsufficiency hypothesis.
        supports: REFUTE
