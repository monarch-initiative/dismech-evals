      assertion:
        discussion_id: mir1292_contribution
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does reduced MIR1292 transcription contribute to neurodegeneration in SCA36, and through
          which targets?
        attaches_to:
        - pathophysiology#MIR1292 Downregulation
        rationale: 'Reduced MIR1292 transcription is reproducible: it was found in the original Japanese
          patients and replicated in Han Chinese patients. But both observations are in lymphoblastoid
          cells, a peripheral cell type that does not degenerate, and the one attempt to test predicted
          targets found four unchanged and three unmeasurable in that cell type, prompting the authors
          to raise the possibility of an epiphenomenon. No downstream target has been demonstrated in
          cerebellar or motor neuron tissue, so the node is left with no outgoing causal edge rather than
          being connected on the strength of adjacency. Resolving this would require measuring MIR1292
          and its candidate targets in patient cerebellum or in expansion-carrying neurons.'
      selected_evidence:
        snippet: Arguably, LCLs may not be an appropriate platform to study SCA36 pathogenesis because
          such cell lines might not faithfully recapitulate the pathologic phenotypes of Purkinje cells.
        supports: SUPPORT
