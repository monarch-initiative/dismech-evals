      assertion_type: Discussion
      assertion:
        discussion_id: dpr_pathogenicity
        kind: CONTROVERSY
        status: OPEN
        prompt: Are dipeptide repeat proteins pathogenic in SCA36, or a comparatively inert byproduct
          of repeat translation?
        attaches_to:
        - pathophysiology#Dipeptide Repeat Protein Production from the Expanded Repeat
        rationale: Human tissue work reports abundant poly(GP), mostly from canonical AUG-mediated translation
          of the intron-retained transcript, plus antisense poly(PR) indicating RAN translation. But SCA36
          poly(GP) is soluble and there is no TDP-43 pathology, unlike C9orf72 disease, and a Neuro2A
          model found RAN-derived DPR formation to be rare. The DPR arm of the mechanism is therefore
          recorded as PROVISIONAL and its edge to Purkinje degeneration is left uncited.
      selected_evidence:
        snippet: Glycine-proline dipeptide repeat (DPR) formation due to repeat-associated non-ATG translation
          rarely occurred in cells expressing expanded GGCCTG repeats; in contrast, cells harboring expanded
          c9orf72 GGGGCC/GGCCCC repeats robustly expressed DPR proteins.
        supports: REFUTE
    origin:
