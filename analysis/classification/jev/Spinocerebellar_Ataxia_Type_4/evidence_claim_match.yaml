        role: initiating genetic lesion
        mechanism_confidence: ESTABLISHED
        description: A heterozygous GGC repeat expansion in exon 10 of ZFHX3. Normal alleles carry about
          21 units interrupted by GGT and AGT codons; expanded alleles (roughly 40 to 57 units in reported
          families) are pure GGC. The expansion is in frame and encodes an elongated polyglycine tract
          in the C-terminal part of a roughly 400 kDa homeodomain-zinc finger transcription factor. It
          is not detectable by short-read exome sequencing.
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: Germline and inherited from an affected parent; every reported allele descends
            from one Swedish founder. Whether the expanded protein acts through a toxic or a normal-function
            gain is unresolved, so no functional impact category is recorded.
        genes:
        - preferred_term: ZFHX3
          term:
            id: hgnc:777
            label: ZFHX3
      selected_evidence:
        snippet: we identified a heterozygous GGC-repeat expansion in a large Utah pedigree encoding polyglycine
          (polyG) in zinc finger homeobox protein 3 (ZFHX3), also known as AT-binding transcription factor
          1 (ATBF1).
        supports: SUPPORT
