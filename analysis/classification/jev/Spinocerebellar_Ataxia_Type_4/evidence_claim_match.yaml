        description: Steady-state ZFHX3 protein is increased in patient fibroblasts and iPSCs, and patient
          iPSCs contain large cytoplasmic polyglycine aggregates that co-label with ubiquitin. In autopsy
          tissue, neurons carry p62- and ubiquitin-positive intranuclear (and in one Swedish case also
          intracytoplasmic) inclusions in the pons, medulla and elsewhere in the brain, and in myenteric
          plexus neurons. The inclusions do not react with the polyglutamine antibody 1C2. Whether aggregation,
          the excess protein or a nuclear loss of function drives neuronal death is not established.
        genes:
