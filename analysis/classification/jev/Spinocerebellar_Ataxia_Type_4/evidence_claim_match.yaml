  a127ace60861558fee13a11a61ae5c4e96582a184c65a62cf382003f1c17ddd3:
    claim:
      about:
        disease:
          name: Spinocerebellar Ataxia Type 4
          disease_term:
            preferred_term: spinocerebellar ataxia type 4
            term:
              id: MONDO:0010847
              label: spinocerebellar ataxia type 4
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_sca4_polyglycine_toxicity_route
        prompt: Does SCA4 neurodegeneration come from toxic polyglycine aggregation, excess normal ZFHX3
          activity, nuclear loss of function, or RNA toxicity, and does impaired autophagy occur in affected
          neurons?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Polyglycine-Expanded ZFHX3 Accumulation and Aggregation
        - pathophysiology#Impaired Autophagy with mTOR Activation
        rationale: The only mechanistic data come from patient fibroblasts and undifferentiated iPSCs,
          and the discovery paper states it cannot separate a gain of normal function from a toxic gain.
          Patient iPSCs could not be differentiated into neurons, and no animal model has been reported.
          The choice between lowering ZFHX3, enhancing autophagy or lowering ATXN2 as a therapy depends
          on the answer.
        proposed_experiments:
        - experiment_id: exp_sca4_neuronal_models
          experiment_design: TARGETED_PERTURBATION
          name: Neuronal and in vivo models of polyglycine-expanded ZFHX3
          description: Express pure expanded versus interrupted normal-length ZFHX3 repeats in iPSC-derived
            sensory and cerebellar neurons (for example by inducible differentiation that bypasses the
            apoptosis seen in patient lines) and in a knock-in mouse; compare autophagic flux, nuclear
            versus cytoplasmic inclusions, ZFHX3 transcriptional targets and neuronal survival, with and
            without ZFHX3 or ATXN2 lowering.
      selected_evidence:
        snippet: These results are consistent with a gain-of-function of polyG-expanded ZFHX3, but at
          this point we cannot discriminate between a gain-of-normal as compared to a gain-of-toxic function.
        supports: SUPPORT
