      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: polyglutamine_protein_toxicity
        hypothesis_label: ATG-initiated polyglutamine ATXN8 protein toxicity
        status: CANONICAL
        description: The CAG-direction transcript from ATXN8 is conventionally translated into a nearly
          pure polyglutamine protein that forms 1C2-positive intranuclear inclusions in Purkinje and brainstem
          neurons, in both transgenic mice and human autopsy tissue. This is the mechanism SCA8 was originally
          thought to lack, and its discovery is why SCA8 is now described as having toxicity at both the
          RNA and protein levels.
      selected_evidence:
        snippet: 1C2-positive intranuclear inclusions in cerebellar Purkinje and brainstem neurons in
          SCA8 expansion mice and human SCA8 autopsy tissue result from translation of a polyglutamine
          protein, encoded on a previously unidentified antiparallel transcript (ataxin 8, ATXN8) spanning
          the repeat in the CAG direction.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16804541
      reference_title: Bidirectional expression of CUG and CAG expansion transcripts and intranuclear
        polyglutamine inclusions in spinocerebellar ataxia type 8.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the polyglutamine protein, its origin on the antiparallel transcript, and
        its presence in human tissue as well as mice.
