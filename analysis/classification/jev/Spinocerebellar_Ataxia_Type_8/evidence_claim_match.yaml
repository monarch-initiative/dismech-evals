            preferred_term: spinocerebellar ataxia type 8
            term:
              id: MONDO:0012116
              label: spinocerebellar ataxia type 8
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bidirectional Transcription of the ATXN8OS/ATXN8 CTG-CAG Expansion
        description: 'The germline lesion is an unstable CTG-CAG repeat expansion on chromosome 13q21,
          in a region where ATXN8OS and the protein-coding ATXN8 overlap and are transcribed in opposite
          directions. The single expansion is therefore transcribed twice, in both senses, and everything
          downstream follows from that one fact: a CUG-repeat non-coding transcript from ATXN8OS and a
          CAG-repeat coding transcript from ATXN8. The repeat is highly unstable on transmission, tending
          to expand through the maternal line and contract through the paternal line, which is part of
          why the disease does not show the tidy repeat-size-to-onset relationship of the polyglutamine
          SCAs.'
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: ATXN8OS
          term:
            id: hgnc:10561
            label: ATXN8OS
        - preferred_term: ATXN8
          term:
            id: hgnc:32925
            label: ATXN8
      selected_evidence:
        snippet: We now report that a non-coding CTG expansion causes a novel form of spinocerebellar
          ataxia (SCA8). This expansion, located on chromosome 13q21, was isolated directly from the genomic
          DNA of an ataxia patient
        supports: SUPPORT
        directness: DIRECT
