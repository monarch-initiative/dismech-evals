        hypothesis_label: Toxic CUG-expansion RNA sequestering MBNL1
        status: CANONICAL
        description: 'The non-coding CUG-expansion transcript from ATXN8OS accumulates as ribonuclear
          foci that co-localise with MBNL1, depleting it from its normal splicing role. Supported by three
          independent lines of evidence in one study: foci that co-localise with MBNL1, a genetic interaction
          in which loss of Mbnl1 worsens motor deficits in SCA8 mice, and a specific downstream splicing
          and expression change (GAT4/Gabt4).'
      selected_evidence:
        snippet: Here, we present three lines of evidence that RNA gain-of-function plays a significant
          role in SCA8
        supports: SUPPORT
        directness: DIRECT
