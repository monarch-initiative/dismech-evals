      assertion:
        hypothesis_group_id: ran_translation_toxicity
        hypothesis_label: Repeat-associated non-ATG translation of polyAla and polySer
        status: EMERGING
        description: The expansion is additionally translated without an AUG start codon in several reading
          frames, producing homopolymeric polyalanine and polyserine proteins. PolySer accumulates specifically
          in white matter, increases with age and disease severity, and co-localises with demyelination
          and axonal degeneration, a tissue distribution neither of the other two hypotheses predicts.
          Marked EMERGING rather than CANONICAL because the causal contribution of RAN products to the
          human phenotype rests on a smaller body of work than the RNA and polyglutamine arms.
      selected_evidence:
        snippet: We report a novel toxic SCA8 polySer protein which accumulates in white matter (WM) regions
          as aggregates that increase with age and disease severity.
        supports: SUPPORT
        directness: DIRECT
