  ee38d8a3cc1893c48c2f19e6b0017611a1534bd659761dbef0aef9d6693c4140:
    claim:
      about:
        disease:
          name: Spinocerebellar Ataxia Type 8
          disease_term:
            preferred_term: spinocerebellar ataxia type 8
            term:
              id: MONDO:0012116
              label: spinocerebellar ataxia type 8
        context: []
      assertion_type: AnimalModel
      assertion:
        name: SCA8 BAC (CTG)116 expansion mouse
        species: Mouse
        genotype: Full-length human SCA8 (CTG·CAG) expansion transgene, (CTG)116, expressed from its endogenous
          promoter on a bacterial artificial chromosome; (CTG)11 lines serve as the matched control
        publication: PMID:16804541
        description: The central experimental system for this disease. Because the transgene carries the
          whole locus under its own promoter, the model reproduces bidirectional transcription and therefore
          all three toxic species at once, which is what makes it usable for separating their contributions.
          The (CTG)116 versus (CTG)11 comparison is what establishes that the expansion itself is pathogenic
          rather than a linked marker. Nearly every interventional result this entry relies on - the Mbnl1
          genetic interaction, the in vivo imaging of granular-layer inhibition, the polySerine white-matter
          pathology - comes from this model or its crosses.
        modeled_mechanisms:
        - target: Bidirectional Transcription of the ATXN8OS/ATXN8 CTG-CAG Expansion
          relationship: RECAPITULATES
          fidelity: HIGH
          description: The transgene is the full-length human locus with its own promoter, so bidirectional
            transcription is reproduced rather than engineered.
          limitations: A transgenic copy on a mouse background, so copy number and chromatin context are
            not those of the human locus, and the mouse carries its own endogenous Atxn8os alleles alongside
            it.
        - target: Loss of Cerebellar GABAergic Inhibition
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: In vivo imaging in expansion but not control lines shows the reduced cerebellar
            cortical inhibition this node describes.
          limitations: The inhibitory deficit is measured in mouse cerebellum; no equivalent measurement
            exists in human SCA8, so its translational weight is assumed rather than shown.
          readouts:
          - name: Cerebellar cortical inhibition on in vivo optical imaging
            target: Loss of Cerebellar GABAergic Inhibition
            direction: DECREASED
            interpretation: Direct functional readout of the inhibitory deficit attributed to GAT4 upregulation.
        - target: CUG-Expansion RNA Foci and MBNL1 Sequestration
          relationship: PERTURBS
          fidelity: MODERATE
          description: 'Crossing the model onto an Mbnl1 null background worsens motor deficits. This
            is a perturbation of the node rather than a recapitulation of it: it manipulates MBNL1 availability
            to test whether sequestration matters, which is the experiment the whole RNA gain-of-function
            hypothesis rests on.'
          limitations: Complete genetic loss of Mbnl1 is a much larger perturbation than the partial sequestration
            proposed in human disease, so it demonstrates that MBNL1 dose matters without calibrating
            how much sequestration occurs in patients.
        - target: White Matter PolySerine Aggregation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: The model accumulates polySerine in white matter alongside human autopsy tissue.
            Marked partial because the human and mouse distributions of polySer and polyGln differ, so
            the model reproduces the phenomenon without reproducing its anatomy exactly.
          limitations: Distribution differences between mouse and human brains are reported by the same
            study, so the model should not be used to infer which human regions are affected.
      selected_evidence:
        snippet: The neurological phenotype in SCA8 BAC expansion but not BAC control lines demonstrates
          the pathogenicity of the (CTG-CAG)n expansion.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /animal_models/0
