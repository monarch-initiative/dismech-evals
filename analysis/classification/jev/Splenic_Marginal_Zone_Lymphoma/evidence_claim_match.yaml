            label: white pulp of spleen
        biological_processes:
        - preferred_term: B cell receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0050853
            label: B cell receptor signaling pathway
      selected_evidence:
        snippet: Immunogenetic investigations have revealed biases in the immunoglobulin gene repertoire,
          indicating a role of antigen selection.
        supports: SUPPORT
