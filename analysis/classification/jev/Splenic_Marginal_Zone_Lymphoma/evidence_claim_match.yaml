        variant_origin: SOMATIC
        notes: Deletion of the long arm of chromosome 7, most often 7q31-32, is the single most frequent
          recurrent lesion in SMZL, more common than any individual point-mutated gene. No gene_term is
          bound because the lesion is a multi-gene chromosomal region rather than a single gene; the minimally
          deleted region removes both coding genes and microRNAs, and no single driver within it has been
          established. Together with IGHV1-2*04 usage it is one of the two strongest diagnostic pointers
          for SMZL.
        case_fractions:
