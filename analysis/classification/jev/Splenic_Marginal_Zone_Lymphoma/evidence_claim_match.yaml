            term:
              id: MONDO:0019462
              label: splenic marginal zone lymphoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disruption of Marginal Zone B-cell Identity and Quiescence
        description: SMZL is genetically defined by lesions in the very program that specifies marginal
          zone B cells and holds them quiescent. NOTCH2 signaling is required for marginal zone B-cell
          development, and recurrent truncating mutations clustered in the C-terminal PEST degron eliminate
          the degradation signal, stabilizing the activated protein and producing a sustained differentiation
          cue. KLF2, a transcription factor that restrains NF-kB and NOTCH output in mature B cells, is
          recurrently inactivated, removing that brake. Deletion of the long arm of chromosome 7 is the
          most frequent cytogenetic abnormality in the disease. Mutations in additional NOTCH-pathway
          members and in other pathways governing marginal zone development affect a majority of cases.
          This constellation is the mechanistic signature separating SMZL from MALT lymphoma, which reaches
          a comparable endpoint through BCL10-MALT1 translocations instead.
        cell_types:
        - preferred_term: marginal zone B cell of spleen
          term:
            id: CL:0000845
            label: marginal zone B cell of spleen
        biological_processes:
        - preferred_term: Notch signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007219
            label: Notch signaling pathway
      selected_evidence:
        snippet: these include NOTCH1, SPEN, and DTX1
        supports: SUPPORT
