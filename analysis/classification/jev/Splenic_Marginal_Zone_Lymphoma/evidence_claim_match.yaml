      assertion_type: Pathophysiology
      assertion:
        name: Chronic Antigenic Stimulation of Splenic Marginal Zone B Cells
        conforms_to: tumor_promoting_inflammation#Chronic Inflammatory Stimulus
        description: 'Sustained antigenic drive selects and expands marginal zone B cells of the splenic
          white pulp. Two independent lines of evidence point to a specific, non-random antigen rather
          than a random founding event: strongly biased immunoglobulin heavy-chain variable gene usage,
          with a large fraction of cases using IGHV1-2, and an epidemiological and therapeutic association
          with chronic hepatitis C virus infection. A stereotyped receptor repertoire implies that the
          founding clone is chosen by its antigen-binding specificity, placing SMZL alongside MALT lymphoma
          in the family of inflammation-associated, antigen-driven B-cell neoplasms.'
        cell_types:
        - preferred_term: marginal zone B cell of spleen
          term:
            id: CL:0000845
            label: marginal zone B cell of spleen
        locations:
