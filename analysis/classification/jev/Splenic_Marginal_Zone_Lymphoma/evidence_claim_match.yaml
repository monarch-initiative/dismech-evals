        association: Recurrent Somatic Driver
        relationship_type: SOMATIC_DRIVER
        variant_origin: SOMATIC
        notes: Truncating mutations cluster in the C-terminal PEST degron and eliminate the proteasomal
          degradation signal, stabilizing activated NOTCH2. Because NOTCH2 is required for marginal zone
          B-cell development, this is a lesion in the lineage-identity program itself. NOTCH2 mutation
          is restricted to SMZL among indolent B-cell lymphoproliferative disorders, giving it diagnostic
          value.
        case_fractions:
        - population: SMZL cohorts pooled in a 2024 molecular-landscape review
          case_fraction_low: 10
          case_fraction_high: 25
