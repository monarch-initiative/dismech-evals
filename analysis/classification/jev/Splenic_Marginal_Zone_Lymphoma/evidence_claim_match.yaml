              label: splenic marginal zone lymphoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cytopenias and Autoimmune Complications
        description: 'Anemia and thrombocytopenia in SMZL arise from two superimposed mechanisms: mechanical
          sequestration by the enlarged spleen, and true autoimmune destruction. The lymphoma clone and
          the dysregulated B-cell compartment around it generate autoantibodies, so autoimmune hemolytic
          anemia and immune thrombocytopenia are recognized paraneoplastic complications rather than incidental
          findings. This dual mechanism matters clinically because it separates patients whose counts
          respond to splenectomy or to lymphoma-directed therapy from those who require immunosuppression.'
        notes: No biological_processes term is bound to this node deliberately. The two operative mechanisms
          here are splenic sequestration and antibody-mediated destruction, neither of which is apoptosis;
          binding GO:0006915 apoptotic process would be a close-enough term rather than an accurate one.
      selected_evidence:
        snippet: immune mediated paraneoplastic phenomena such as autoimmune hemolytic anemia (AIHA),
          autoimmune thrombocytopenia (ITP) and C1 esterase inhibitor deficiency are relatively common
        supports: SUPPORT
    origin:
