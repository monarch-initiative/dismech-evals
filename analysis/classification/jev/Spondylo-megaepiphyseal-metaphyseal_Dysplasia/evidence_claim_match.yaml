        relationship_type: CAUSATIVE
        notes: 'Homeobox-containing transcription factor at 4p15.33, also known as BAPX1. Acts as a transcriptional
          repressor in the proliferative zone of the growth plate, downstream of PTHrP signalling, holding
          chondrocytes immature by repressing Runx2. All reported disease alleles are inactivating.

          The deep-research report supplies gnomAD constraint metrics for this gene (pLI 0.0009, LOEUF
          1.07, o/e 0.67) as the quantitative basis for the haplosufficiency that explains the recessive
          inheritance. They are not curated as evidence: they are a database lookup with no citable publication
          behind them in the report, and they could not be independently verified from this environment.
          Recorded here as a lead rather than asserted.'
      selected_evidence:
        snippet: Nkx3.2/Bapx1 expression is lost in the growth plates of mice engineered to lack PTHrP
          signaling and, conversely, is maintained by ectopic expression of PTHrP in developing bones.
        supports: SUPPORT
