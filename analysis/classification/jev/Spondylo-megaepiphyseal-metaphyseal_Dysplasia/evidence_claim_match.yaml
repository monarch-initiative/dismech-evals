            term:
              id: MONDO:0013228
              label: spondylo-megaepiphyseal-metaphyseal dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Derepression of the Chondrocyte Maturation Program
        description: 'NKX3-2 normally restrains chondrocyte maturation, acting as a transcriptional repressor
          of Runx2 in the proliferative zone and being switched off as maturation begins. The direction
          of the mechanism is established by a construct experiment: wild-type Nkx3.2 blocks maturation,
          while a reverse-function mutant converted into a transcriptional activator accelerates it, and
          Runx2 mis-expression rescues the Nkx3.2-induced block. Losing NKX3-2 therefore removes a brake
          on maturation timing rather than removing a positive signal.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: growth plate chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: negative regulation of chondrocyte differentiation
          modifier: DECREASED
          term:
            id: GO:0032331
            label: negative regulation of chondrocyte differentiation
        locations:
        - preferred_term: growth plate
          term:
            id: UBERON:0002516
            label: epiphyseal plate
      selected_evidence:
        snippet: Nkx3.2 represses expression of the chondrocyte maturation factor Runx2, and Runx2 mis-expression
          can rescue the Nkx3.2-induced blockade of chondrocyte maturation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16421188
      reference_title: Nkx3.2/Bapx1 acts as a negative regulator of chondrocyte maturation.
      evidence_source: MODEL_ORGANISM
      explanation: Names the transcriptional target and shows the block is relieved by restoring it, placing
        Runx2 downstream of NKX3-2 in this pathway.
