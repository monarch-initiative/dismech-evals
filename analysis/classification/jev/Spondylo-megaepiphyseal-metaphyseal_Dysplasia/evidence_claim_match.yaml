              label: spondylo-megaepiphyseal-metaphyseal dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cervical Spine Instability and Cord Injury
        description: 'The clinically decisive consequence of the axial ossification failure, and the reason
          this disorder is dangerous rather than merely deforming. Reduced or absent ossification of the
          cervical vertebrae leaves the cervical spine mechanically unsupported, producing instability
          with anterior or posterior kinking - the swan-neck deformity also called kyknodysostosis - and
          from there cord injury presenting as limb spasticity.

          Two things make this node worth separating from the general ossification derangement. It hit
          five of the six patients in the only series to look at it, so within that series it is the rule
          rather than a complication. And the authors state that the high incidence of cervical spine
          deformation is unique among skeletal dysplasias, which means it is not a generic consequence
          of poor vertebral ossification that could be inherited from a sibling disorder.

          It is also the only point in this disease where an intervention changes the outcome: the lesion
          upstream is embryonic and inaccessible, while cervical instability is detectable and stabilisable
          before the cord is injured.'
        biological_scale: ORGANISM
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: Reduced or absent ossification of the cervical vertebrae leads to cervical instability
          with anterior or posterior kinking of the cervical spine (swan neck-like deformity, kyknodysostosis).
        supports: SUPPORT
    origin:
