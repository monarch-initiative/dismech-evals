  f7b247dc6695ceb37448e9b640ba7f3d2db6a85cc752226d35c8011672ab691a:
    claim:
      about:
        disease:
          name: Spondylo-megaepiphyseal-metaphyseal Dysplasia
          disease_term:
            preferred_term: spondylo-megaepiphyseal-metaphyseal dysplasia
            term:
              id: MONDO:0013228
              label: spondylo-megaepiphyseal-metaphyseal dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Chondrocyte Survival Signalling
        description: 'A second, parallel arm of NKX3-2 function, distinct from the maturation brake modelled
          above. In proliferating chondrocytes NKX3-2 constitutively activates RelA by a ligand-independent
          route - recruiting the RelA-IkappaB-alpha complex into the nucleus by direct protein-protein
          interaction and degrading IkappaB-alpha there - and that NF-kappaB activity is required for
          chondrocyte viability. Losing it removes a survival signal from exactly the cells the maturation
          brake acts on.

          This makes NKX3-2 a dual-function node rather than a single repressor: a brake on maturation
          and a survival signal for the cells being braked. The two arms converge, which is consistent
          with the mouse null showing increased apoptosis alongside failed chondrogenesis.

          Curated as PROVISIONAL for this disease. The mechanism is established in chick and mouse chondrocytes
          and has not been shown in a patient with SMMD, so its contribution to the human phenotype is
          inferred from the gene rather than demonstrated in the disease.'
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        cell_types:
        - preferred_term: proliferating chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: canonical NF-kappaB signal transduction
          modifier: DECREASED
          term:
            id: GO:0007249
            label: canonical NF-kappaB signal transduction
        - preferred_term: negative regulation of apoptotic process
          modifier: DECREASED
          term:
            id: GO:0043066
            label: negative regulation of apoptotic process
      selected_evidence:
        snippet: Here, we show that the nuclear factor kappa B (NF-kappaB) pathway is required for chondrocyte
          viability and that Nkx3.2 supports chondrocyte survival by constitutively activating RelA.
        supports: SUPPORT
    origin:
