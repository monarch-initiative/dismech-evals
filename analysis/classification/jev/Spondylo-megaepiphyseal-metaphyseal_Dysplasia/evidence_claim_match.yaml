        discussion_id: smmd_overgrowth_unmodelled_in_mammals
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does the skeletal overgrowth of SMMD have a mammalian model, and can the zebrafish chondrocyte
          proliferation and stress-response mechanism be assumed to hold in human growth plates?
        rationale: 'Evidence for the overgrowth arm exists, but only in fish. Mouse Nkx3-2 mutants show
          skeletal *reductions* and nkx3.2 knockdown zebrafish show embryonic lethal jaw joint fusions;
          both lack the skeletal overgrowth seen in SMMD patients. Only the adult viable zebrafish mutant
          reproduces it, and the proposed mechanism - increased chondrocyte proliferation with upregulated
          stress-induced pathways including prostaglandin synthases - rests on single-cell RNA-sequencing
          in that fish. This is a translational-validity question rather than an absence of evidence,
          which is why it is recorded as HUMAN_MODEL_MISMATCH: the mammalian models diverge from the human
          phenotype in the specific direction that matters, and the mouse additionally shows asplenia
          that SMMD patients do not. The relevant node is marked PROVISIONAL for this reason. Resolving
          it would need chondrocyte proliferation and prostaglandin-pathway activity measured in human
          SMMD growth-plate or joint cartilage, or a conditional mouse allele that survives past the perinatal
          period.'
        attaches_to:
        - pathophysiology#Loss of Post-Embryonic Restraint on Joint Chondrocyte Proliferation
        - animal_models#Mouse
      selected_evidence:
        snippet: Whereas nkx3.2 knockdown zebrafish and mouse Nkx3.2 mutants display embryonic lethal
          jaw joint fusions and skeletal reductions, respectively, they lack the skeletal overgrowth seen
          in SMMD patients.
        supports: SUPPORT
