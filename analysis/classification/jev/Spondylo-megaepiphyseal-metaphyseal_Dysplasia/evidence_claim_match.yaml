      assertion_type: Treatment
      assertion:
        name: Prophylactic Cervical Spine Stabilization
        description: 'The one intervention in this disorder that changes the outcome rather than managing
          it. The upstream lesion is an embryonic transcription-factor failure and is not therapeutically
          accessible after birth; cervical instability is. Stabilization is prophylactic in the strict
          sense - performed on the basis of the radiographic pattern before cord injury has occurred,
          not as treatment for an established myelopathy.

          The evidence is a proposal rather than a demonstration, and the entry records it that way. The
          authors write that early diagnosis "might prevent" the neurologic complications; no series has
          reported outcomes in patients stabilized prophylactically, and with six patients described in
          total there is no prospect of one soon. This is curated because the reasoning is sound and the
          stakes are high, not because it has been shown to work.'
        therapeutic_modality: SURGERY
        treatment_term:
