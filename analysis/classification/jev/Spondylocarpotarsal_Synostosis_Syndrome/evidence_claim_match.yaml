        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counseling
        description: 'Genetic counseling should cover autosomal recessive FLNB-SCT recurrence risk, parental
          carrier testing, heterozygote testing for at-risk relatives, and prenatal or preimplantation
          testing once familial variants are known. Counseling should also explain the distinction from
          autosomal dominant FLNB gain-of-function disorders and MYH3-related SCT-like disease.

          '
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: FLNB-SCT is inherited in an autosomal recessive manner. If both parents are known to
          be heterozygous for an FLNB pathogenic variant, each sib of an affected individual has at conception
          a 25% chance of inheriting biallelic pathogenic variants and being affected, a 50% chance of
          inheriting one pathogenic variant and being heterozygous, and a 25% chance of inheriting neither
          of the familial FLNB pathogenic variants.
        supports: SUPPORT
