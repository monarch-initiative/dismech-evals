        description: Diagnosis is established using characteristic clinical-radiographic findings including
          disproportionate short trunk/short stature, vertebral fusion or segmentation-like defects across
          cervical, thoracic, or lumbar spine, scoliosis progression, and carpal/tarsal coalition. Molecular
          testing should confirm biallelic FLNB loss-of-function variants, include copy-number-sensitive
          methods for intragenic deletions, and distinguish classic FLNB-SCT from MYH3/RFLNA-related SCT-like
          disorders and dominant FLNB gain-of-function disorders.
      selected_evidence:
        snippet: Our report validates key clinical (fused thoracic vertebrae and carpal and tarsal coalition)
          and molecular (truncating variants in FLNB) characteristics of this condition.
        supports: SUPPORT
