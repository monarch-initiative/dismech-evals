        context: []
      assertion_type: Prevalence
      assertion:
        population: Published literature cohorts worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        percentage: approximately 25 historically reported patients
        notes: 'No population-based prevalence studies were identified in PubMed abstracts. The best available
          epidemiology remains literature-based case counting: a 2008 review summarized 25 reported patients,
          and a 2018 molecular series noted nine previously reported FLNB-positive families before adding
          10 more affected individuals from seven new families.'
      selected_evidence:
        snippet: Biallelic loss-of-function variants in FLNB are known to cause spondylocarpotarsal synostosis
          syndrome and 9 families and 9 pathogenic variants have been reported so far. We report clinical
          features of 10 additional patients from 7 families with spondylocarpotarsal synostosis syndrome
          due to 7 novel deleterious variants in FLNB, thus expanding the clinical and molecular repertoire
          of spondylocarpotarsal synostosis syndrome.
        supports: SUPPORT
