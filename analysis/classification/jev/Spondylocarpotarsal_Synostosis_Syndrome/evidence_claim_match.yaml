        snippet: FLNB-SCT is inherited in an autosomal recessive manner. If both parents are known to
          be heterozygous for an FLNB pathogenic variant, each sib of an affected individual has at conception
          a 25% chance of inheriting biallelic pathogenic variants and being affected, a 50% chance of
          inheriting one pathogenic variant and being heterozygous, and a 25% chance of inheriting neither
          of the familial FLNB pathogenic variants.
        supports: SUPPORT
