        population: Published literature cohorts worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        percentage: approximately 25 historically reported patients
        notes: 'No population-based prevalence studies were identified in PubMed abstracts. The best available
          epidemiology remains literature-based case counting: a 2008 review summarized 25 reported patients,
          and a 2018 molecular series noted nine previously reported FLNB-positive families before adding
          10 more affected individuals from seven new families.'
      selected_evidence:
        snippet: Spondylocarpotarsal synostosis syndrome (SCT) (OMIM 272460), originally thought to be
          a failure of normal spine segmentation, is characterized by progressive fusion of vertebras
          and associates unsegmented bars, scoliosis, short stature, carpal and tarsal synostosis. Cleft
          palate, sensorineural or mixed hearing loss, joint limitation, clinodactyly, and dental enamel
          hypoplasia are variable manifestations. Twenty-five patients have been reported.
        supports: SUPPORT
