          10 more affected individuals from seven new families.'
      selected_evidence:
        snippet: Spondylocarpotarsal synostosis syndrome (SCT) (OMIM 272460), originally thought to be
          a failure of normal spine segmentation, is characterized by progressive fusion of vertebras
          and associates unsegmented bars, scoliosis, short stature, carpal and tarsal synostosis. Cleft
          palate, sensorineural or mixed hearing loss, joint limitation, clinodactyly, and dental enamel
          hypoplasia are variable manifestations. Twenty-five patients have been reported.
        supports: SUPPORT
