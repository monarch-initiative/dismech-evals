  6413c637ef07b2122a2a676df908d2aa3df9706193d9a30e122ba351bbb487cf:
    claim:
      about:
        disease:
          name: Spondylocostal Dysostosis
          disease_term:
            preferred_term: spondylocostal dysostosis
            term:
              id: MONDO:0000359
              label: spondylocostal dysostosis
        context: []
      assertion_type: Subtype
      assertion:
        name: SCDO2
        display_name: SCDO2 (MESP2-related; includes spondylothoracic dysostosis / Puerto Rican Jarcho-Levin)
        subtype_term:
          preferred_term: spondylocostal dysostosis 2, autosomal recessive
          term:
            id: MONDO:0012097
            label: spondylocostal dysostosis 2, autosomal recessive
        description: 'SCDO2 (OMIM:608681) is caused by biallelic pathogenic variants in MESP2, a bHLH
          transcription factor that translates segmentation-clock oscillations into somite-boundary and
          rostrocaudal-polarity specification. This is the subtype that carries the spondylothoracic dysostosis
          (STD) / classic Puerto Rican "Jarcho-Levin syndrome" phenotype — symmetric, posteriorly fused
          "crab-like" ribs with a shortened trunk and early-childhood respiratory compromise — attributable
          to a MESP2 E103X founder mutation. Recording that identity here is the dismech-side mitigation
          for the ontology gap in issue #4957: MONDO has no distinct STD class, and the string "spondylothoracic
          dysostosis" appears as a synonym on the DLL3 (SCDO1) and TBX6 (SCDO5) terms rather than on this
          MESP2 term.'
        genes:
        - preferred_term: MESP2
          term:
            id: hgnc:29659
            label: MESP2
        geography:
        - Puerto Rico
        inheritance:
        - name: Autosomal Recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Using a genomewide scanning strategy in one consanguineous family with two affected children,
          we demonstrated linkage to 15q21.3-15q26.1 and furthermore identified a 4-bp duplication mutation
          in the human MESP2 gene that codes for a basic helix-loop-helix transcription factor.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
