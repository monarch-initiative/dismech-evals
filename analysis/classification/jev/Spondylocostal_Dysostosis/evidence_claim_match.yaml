        context: []
      assertion_type: Subtype
      assertion:
        name: SCDO1
        display_name: SCDO1 (DLL3-related)
        subtype_term:
          preferred_term: spondylocostal dysostosis 1, autosomal recessive
          term:
            id: MONDO:0020692
            label: spondylocostal dysostosis 1, autosomal recessive
        description: SCDO1 (OMIM:277300) is caused by biallelic pathogenic variants in DLL3, which encodes
          a Notch ligand acting in the presomitic-mesoderm segmentation clock. It was the first molecularly
          solved form of SCDO and produces a consistent, distinctive pattern of abnormal vertebral segmentation
          affecting the entire spine. Note that MONDO carries "spondylothoracic dysostosis" as a RELATED
          synonym on this DLL3 term; that synonym is a named-entity-confusion hazard, because the classic
          symmetric "crab-like-rib" STD entity is MESP2-related (see the SCDO2 subtype).
        genes:
        - preferred_term: DLL3
          term:
            id: hgnc:2909
            label: DLL3
        inheritance:
        - name: Autosomal Recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Here we have cloned and sequenced human DLL3 to evaluate it as a candidate gene for SD
          and identified mutations in three autosomal recessive SD families.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
