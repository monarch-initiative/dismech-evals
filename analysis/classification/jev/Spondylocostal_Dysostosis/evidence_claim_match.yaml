        description: SCDO4 (OMIM:613686) is caused by biallelic pathogenic variants in HES7, the Notch-driven
          transcriptional repressor that generates the oscillation of the segmentation clock itself. HES7-related
          disease is distinguished from the other SCDO subtypes by co-occurring laterality defects (dextrocardia
          with situs inversus) and neural tube malformations, consistent with an additional role outside
          somitogenesis.
