          single small cohort (PMID:32295219) with an explicitly uncertain causal relationship, which
          cannot establish a population frequency. Orphanet lists stroke (HP:0001297) only for the B3GALT6-related
          subtype (Occasional, 29-5%), not for SLC39A13-spEDS, so no curated Orphanet band supports this
          SLC39A13-scoped phenotype either.'
