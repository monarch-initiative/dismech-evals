        - preferred_term: Iron Ion Transport
          modifier: DECREASED
          term:
            id: GO:0006826
            label: iron ion transport
        chemical_entities:
        - preferred_term: iron(2+)
          modifier: DECREASED
          term:
            id: CHEBI:29033
            label: iron(2+)
      selected_evidence:
        snippet: ZIP13 loss causes an iron deficiency in the ER/Golgi and other intracellular compartments,
          such as lysosomes and mitochondria, as well as elevating iron in the cytosol
        supports: SUPPORT
