          the ER/Golgi. ZIP13 loss causes iron deficiency in the ER/Golgi compartment, depriving Fe2+-dependent
          enzymes of their required cofactor.

          '
        genes:
        - preferred_term: SLC39A13
          term:
            id: hgnc:20859
            label: SLC39A13
        cell_types:
