      assertion:
        name: ACAN
        notes: 'Encodes the aggrecan core protein. The recessive disease described here is caused by variants
          affecting aggrecan: the founding family is homozygous for a G3 C-type lectin domain substitution,
          and the second patient carries two missense variants in the CS1 and CS2 glycosaminoglycan-attachment
          domains. ACAN is allelic across a wide range: heterozygous variants cause dominant spondyloepiphyseal
          dysplasia Kimberley type and familial osteochondritis dissecans, and common variation at the
          locus associates with normal height. This entry is scoped to the recessive aggrecan-type SEMD
          and does not absorb those.'
        gene_term:
          preferred_term: ACAN
          term:
            id: hgnc:319
            label: ACAN
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: These genes were assessed and ranked by cartilage selectivity with whole-genome microarray
          data, revealing only two genes, encoding aggrecan and chondroitin sulfate proteoglycan 4, that
          were selectively expressed in cartilage.
        supports: SUPPORT
        directness: DIRECT
