        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Calcium-Dependent Binding of the G3 Domain to Tenascin-C
        description: The functional lesion. Surface plasmon resonance showed the substitution changes
          both the affinity and the kinetics of the interaction between the aggrecan G3 domain and tenascin-C.
          The G3 lectin domain is how aggrecan engages the wider matrix network - tenascin-R and tenascin-C,
          fibulins, fibrillin-1 - all in a calcium-dependent manner, so a change at the calcium-coordinating
          residue degrades the anchoring rather than the molecule.
        role: mechanism
        biological_scale: MOLECULAR
        genes:
        - preferred_term: TNC
          term:
            id: hgnc:5318
            label: TNC
      selected_evidence:
        snippet: Surface-plasmon-resonance studies showed that the mutation influenced the binding and
          kinetics of the interactions between the aggrecan G3 domain and tenascin-C.
