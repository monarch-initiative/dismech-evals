            term:
              id: MONDO:0013014
              label: spondyloepimetaphyseal dysplasia, aggrecan type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic ACAN Variants Disrupting Aggrecan Function
        description: The two reported families carry variants in different parts of the protein, and the
          node is named generically so it does not assert one lesion for both. The founding family is
          homozygous for c.6799G>A, predicting p.D2267N in the C-type lectin domain of aggrecan's G3 domain;
          that identification constrains what kind of mechanism this is, since the locus was mapped by
          identity-by-descent to a 17.4 Mb interval containing 296 genes and ranking those genes by cartilage-selective
          expression left only two, of which ACAN was one. The substituted residue is predicted to coordinate
          a calcium ion that shapes the binding loops of the lectin domain, and it is this allele that
          carries the functional work downstream. The second patient instead carries two missense variants
          in the chondroitin sulfate CS1 and CS2 domains, assessed only in silico. The mechanistic arms
          below are established for the lectin-domain allele; what the CS-domain variants do is not known.
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: ACAN
          term:
            id: hgnc:319
            label: ACAN
        notes: 'Named for the gene rather than the domain because the two reported families do not share
          a lesion: the founding family is homozygous for a C-type lectin domain substitution with functional
          data behind it, while the second patient carries two CS-domain missense variants supported only
          by in silico prediction. See the semd_acan_genotype_severity discussion.'
      selected_evidence:
        snippet: Sequence analysis of aggrecan complementary DNA from an affected individual revealed
          homozygosity for a missense mutation (c.6799G --> A) that predicts a p.D2267N amino acid substitution
          in the C-type lectin domain within the G3 domain of aggrecan.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19110214
      reference_title: A recessive skeletal dysplasia, SEMD aggrecan type, results from a missense mutation
        affecting the C-type lectin domain of aggrecan.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies the causal variant and its precise position within the protein, which is
        what the rest of the pathograph depends on.
