            term:
              id: MONDO:0013014
              label: spondyloepimetaphyseal dysplasia, aggrecan type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Preserved Aggrecan Synthesis and Secretion
        description: A negative result, and a load-bearing one. Expressing normal and mutant G3 domains
          in mammalian cells showed the mutation created a new functional N-glycosylation site but did
          not impair trafficking or secretion. That rules out the mechanisms this disease would otherwise
          be assumed to have - haploinsufficiency, retention in the endoplasmic reticulum, degradation
          of a misfolded product - and forces the mechanism onto what the secreted protein then fails
          to do.
        role: mechanism
        biological_scale: MOLECULAR
        notes: Recorded as a distinct node rather than folded into the description because it is the experiment
          that excludes the obvious alternative mechanism. A reader who assumes aggrecan deficiency will
          otherwise mis-model this disease.
      selected_evidence:
        snippet: Expression of the normal and mutant G3 domains in mammalian cells showed that the mutation
          created a functional N-glycosylation site but did not adversely affect protein trafficking and
          secretion.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19110214
      reference_title: A recessive skeletal dysplasia, SEMD aggrecan type, results from a missense mutation
        affecting the C-type lectin domain of aggrecan.
      evidence_source: IN_VITRO
      explanation: Directly excludes a secretion or trafficking defect, which is what makes this node
