      assertion_type: Pathophysiology
      assertion:
        name: Impaired Endochondral Ossification at the Growth Plate
        description: Linear bone growth is produced by chondrocyte division and matrix production at the
          growth plate, then replacement of that cartilage by bone. A defective matrix compromises both
          the template and the mechanical environment the chondrocytes work in. Because the vertebral
          bodies, epiphyses and metaphyses are all sites of endochondral growth, one lesion at this node
          produces the combined spondylar, epiphyseal and metaphyseal picture the disease is named for
          - which is why this is a single dysplasia rather than three coincident ones.
        role: consequence
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: endochondral ossification
          modifier: ABNORMAL
          term:
            id: GO:0001958
            label: endochondral ossification
