        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DEPTOR Accumulation and mTOR Downregulation
        biological_scale: MOLECULAR
        description: DEPTOR is a negative regulator of both mTOR complexes. SIK3 interacts with DEPTOR
          and its activity is required for DEPTOR turnover, so loss of SIK3 kinase activity leaves DEPTOR
          elevated and mTORC1 and mTORC2 activity reduced, measurable as decreased phosphorylation of
          S6K1, S6 and AKT in patient cells. In control human growth plate, DEPTOR is highest in resting
          and proliferative chondrocytes and falls as cells commit to hypertrophy, which is the expression
          pattern a persistent DEPTOR signal would disturb.
        biological_processes:
        - preferred_term: TOR signaling
          term:
            id: GO:0031929
            label: TOR signaling
          modifier: DECREASED
      selected_evidence:
        snippet: we observed a clear decrease in the phosphorylation of S6K1, S6 and AKT in the patient
          cells compared to control
        supports: SUPPORT
