        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nuclear Retention of HDAC4 and Blocked Chondrocyte Hypertrophy
        biological_scale: CELLULAR
        description: SIK3 phosphorylates HDAC4 at its 14-3-3 binding sites, which anchors HDAC4 in the
          cytoplasm and so releases MEF2 and RUNX2 to drive the hypertrophic programme. Without SIK3 activity
          HDAC4 stays in the nucleus, where it binds and blocks both transcription factors. This arm is
          established in mouse rather than in the patient, and is the second route by which the same lesion
          reaches the growth plate.
        cell_types:
        - preferred_term: hypertrophic chondrocyte
          term:
            id: CL:0000743
            label: hypertrophic chondrocyte
        biological_processes:
        - preferred_term: chondrocyte hypertrophy
          term:
            id: GO:0003415
            label: chondrocyte hypertrophy
          modifier: DECREASED
      selected_evidence:
        snippet: HDAC4, a crucial repressor of chondrocyte hypertrophy, remained in the nuclei in SIK3-deficient
          chondrocytes, but was localized in the cytoplasm in wild-type hypertrophic chondrocytes.
        supports: SUPPORT
    origin:
