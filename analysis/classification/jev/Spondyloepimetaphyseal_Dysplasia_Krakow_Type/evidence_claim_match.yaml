            label: endochondral bone growth
          modifier: DECREASED
      selected_evidence:
        snippet: Anatomical and histological analyses revealed marked expansion of the growth plate and
          articular cartilage regions in the limbs, accumulation of chondrocytes in the sternum, ribs
          and spine, and impaired skull bone formation in SIK3-deficient mice.
        supports: SUPPORT
