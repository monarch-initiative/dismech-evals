        biological_scale: TISSUE
        description: Chondrocytes fail to progress from proliferation to hypertrophy, so the growth plate
          expands and endochondral ossification is delayed. In SIK3-deficient mice this presents as marked
          expansion of growth plate and articular cartilage, accumulation of chondrocytes in the sternum,
          ribs and spine, and impaired skull bone formation — an axial and appendicular distribution matching
          the spondylo- and epimetaphyseal involvement named in the human disease.
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
