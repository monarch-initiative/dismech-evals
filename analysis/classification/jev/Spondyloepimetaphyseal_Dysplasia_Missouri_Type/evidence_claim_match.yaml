      assertion_type: Genetic
      assertion:
        name: MMP13
        notes: MMP13 encodes collagenase-3, a secreted matrix metalloproteinase expressed in terminal
          hypertrophic chondrocytes of the growth plate and in osteoblasts. The dominant disease alleles
          are missense substitutions in the propeptide encoded by exon 2; the recessive MMP13 disease
          (Spahr type) instead carries variants in the catalytic domain, which is the observation behind
          the ISDS dyadic split.
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: MMP13
          term:
            id: hgnc:7159
            label: MMP13
      selected_evidence:
        snippet: We show that a missense mutation of MMP13 causes the Missouri type of human spondyloepimetaphyseal
          dysplasia (SEMD(MO)), an autosomal dominant disorder characterized by defective growth and modeling
          of vertebrae and long bones.
        supports: SUPPORT
