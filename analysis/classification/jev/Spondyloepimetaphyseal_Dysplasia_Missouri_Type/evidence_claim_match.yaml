      assertion_type: Phenotype
      assertion:
        category: Skeletal
        name: Pear-shaped vertebrae
        description: 'The childhood vertebral form: greatest vertical height anteriorly with bulbous anterior
          contours, most pronounced in the lumbar spine. This is the "spondylo" of spondyloepimetaphyseal
          dysplasia and the entry had no phenotype for it until review pointed that out. HPO has no pear-shaped
          vertebra term, so the node stays bound at HP:0003468 and carries the shape in `preferred_term`
          - the case the Ontology Term Contract covers, rather than manufacturing a specificity HPO does
          not offer. The adult form is a separate node below, because the finding changes rather than
          persists. The vertebral involvement is variable and mild overall, which is why the ISDS Nosology
          files the disorder under metaphyseal dysplasias despite the name.'
        phenotype_term:
