        name: Delayed Exit of Chondrocytes From the Growth Plate
        description: Chondrocytes differentiate normally - the lesion is not a differentiation block -
          but they leave the growth plate late. The hypertrophic zone is therefore retained and the ordered
          replacement of cartilage by bone at the metaphysis is desynchronized. In the Mmp13-null mouse
          this abnormality intensifies to about five weeks of age and then resolves completely by twelve
          weeks, a time course that parallels the transient metaphyseal changes seen radiographically
          in patients.
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
