    evidence_metadata:
      reference: PMID:42142773
      reference_title: The Interstitial Collagenases MMP13 and MMP14 Are Dispensable for the Early Onset
        of Skin Morphogenesis but Modulate Endochondral Ossification.
      evidence_source: MODEL_ORGANISM
      explanation: 'Read the DIRECTION of this sentence carefully. It says MMP13 compensates for MMP14,
        established by the double knockout being far worse than either single one. That is evidence that
        the collagenases of the growth plate are partly interchangeable, which is why a partial MMP13
        deficiency is survivable and mild - but it is NOT evidence that MMP14 compensates for missing
        MMP13, which is the claim a reader wants here and which this paper does not make. Graded INDIRECT
        for that reason: the redundancy is demonstrated, its usefulness in the MMP13-deficient direction
        is an inference from it.'
