            in embryonic limb buds.
          limitations: Embryonic lethality at E11.5-E12.5 from an erythropoiesis defect absent in patients
            means the model never reaches a growth plate, a vertebra or postnatal life, and the global
            null does not model the tissue-restricted survival of the human disease.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Mouse Ddrgk1 loss is embryonic lethal through an erythropoiesis deficiency that
              has not been reported in any Shohat-type patient; the chondrogenic readout is taken before
              that lethality and is not affected by it, but the model cannot speak to anything later.
          readouts:
          - name: Limb-bud mesenchymal condensation (H&E)
