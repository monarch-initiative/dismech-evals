      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Biallelic DDRGK1 variants. The founder c.408+1G>A allele was homozygous in all affected
          members of four Iraqi Jewish families and in none of the unaffected relatives; the two Moroccan
          children carried a homozygous missense allele. The original 1993 and 1994 clinical reports had
          already inferred recessive transmission from the sibling and second-cousin pattern of the first
          family.
      selected_evidence:
        snippet: The 3 affected individuals had a homozygous c.408+1G>A donor splice site mutation in
          the third intron of the DDRGK1 gene, while none of the unaffected family members were homozygous
          for this mutation
        supports: SUPPORT
