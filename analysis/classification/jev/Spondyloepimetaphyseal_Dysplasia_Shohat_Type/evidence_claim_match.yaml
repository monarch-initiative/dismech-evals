        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ire1a_er_stress
        hypothesis_label: DDRGK1 loss causes chondrocyte ER stress and apoptosis through IRE1-alpha destabilisation
        status: ALTERNATIVE
        description: 'The 2023 chondrocyte-specific knockout and K268R knock-in study proposed that the
          growth-plate lesion arises from loss of IRE1-alpha UFMylation and stability, ER dysfunction
          and PERK/CHOP/caspase-3 apoptosis, explicitly instead of the SOX9 mechanism. The two branches
          are not mutually exclusive: both are downstream of the same lesion and the discovery paper itself
          noted that the skeletal phenotype exceeds what the measured SOX9 reduction predicts. Listed
          as alternative because it rests on mouse and cultured-cell evidence and has not been tested
          in patient chondrocytes.'
      selected_evidence:
        snippet: Instead of the classical modulation mechanism towards SOX9, our further mechanism study
          found that DDRGK1 stabilizes the stress sensor endoplasmic reticulum-to-nucleus signaling 1
          (IRE1α) to maintain endoplasmic reticulum (ER) homoeostasis.
        supports: SUPPORT
