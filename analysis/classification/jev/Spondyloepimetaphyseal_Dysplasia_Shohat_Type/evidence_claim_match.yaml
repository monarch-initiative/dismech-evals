        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DDRGK1 Loss of Function
        biological_scale: MOLECULAR
        description: Biallelic loss-of-function DDRGK1 variants. The founder c.408+1G>A donor splice-site
          allele produces an intron-3 read-through transcript and a cryptic-splice transcript, both with
          premature stop codons, and patient lymphoblastoid cells express no DDRGK1 protein. DDRGK1 (also
          called UFBP1) is an endoplasmic reticulum membrane protein and a core component of the UFM1
          conjugation system, so its loss removes both its UFMylation-dependent and its direct protein-stabilising
          functions.
        mechanism_confidence: ESTABLISHED
        genetic_context:
          gene:
            preferred_term: DDRGK1
            term:
              id: hgnc:16110
              label: DDRGK1
          zygosity: HOMOZYGOUS
          variant_origin: GERMLINE
          allele_type: splice-donor loss-of-function (founder allele) or missense
          functional_impact_category: LOSS_OF_FUNCTION
          description: Homozygous germline NM_023935.3:c.408+1G>A in the Iraqi Jewish families and the
            2022 delineation case; a homozygous missense allele in two Moroccan families. Graded as complete
            loss of function for the splice allele because patient cells express no detectable protein;
            the missense allele has no reported functional assay.
        molecular_functions:
        - preferred_term: UFM1-modified protein reader activity
          modifier: DECREASED
          term:
            id: GO:0141185
            label: UFM1-modified protein reader activity
        - preferred_term: ubiquitin-like protein ligase binding
          modifier: DECREASED
          term:
            id: GO:0044389
            label: ubiquitin-like protein ligase binding
        biological_processes:
        - preferred_term: protein ufmylation
          modifier: DECREASED
          term:
            id: GO:0071569
            label: protein ufmylation
        cellular_components:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
        genes:
        - preferred_term: DDRGK1
          term:
            id: hgnc:16110
            label: DDRGK1
      selected_evidence:
        snippet: Here, we have performed whole-exome sequencing to identify a recurrent homozygous c.408+1G>A
          donor splice site loss-of-function mutation in DDRGK domain containing 1 (DDRGK1) in 4 families
          affected by SEMD.
        supports: SUPPORT
