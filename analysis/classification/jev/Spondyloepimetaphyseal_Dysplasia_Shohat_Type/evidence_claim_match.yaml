          protein
        description: 'A CRISPR/Cas9-generated null allele. Homozygotes die between E11.5 and E12.5 from
          an erythropoiesis deficiency with no counterpart in patients, so the model reaches only the
          earliest chondrogenic step: limb-bud mesenchymal condensation fails to E12.5, E11.5 mesenchyme
