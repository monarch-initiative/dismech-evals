        description: Chondrogenesis begins with condensation of limb-bud mesenchyme under SOX9 control.
          Ddrgk1-null mouse limb buds show no mesenchymal condensation up to E12.5 and their mesenchymal
          cells form fewer cartilaginous nodules in micromass culture; ddrgk1 morphant zebrafish lack
          or malform the craniofacial cartilages. The discovery paper concludes that DDRGK1 is required
          for chondrocyte differentiation from mesenchymal cells and that its loss reduces the chondrogenic
          potency of mesenchyme.
