            term:
              id: MONDO:0011252
              label: spondyloepimetaphyseal dysplasia, Shohat type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: erythropoiesis_lethality_mouse_only
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why does complete loss of DDRGK1 kill mouse embryos through an erythropoiesis defect when
          patients homozygous for a protein-null allele survive to adulthood with no reported haematological
          phenotype?
        attaches_to:
        - pathophysiology#DDRGK1 Loss of Function
        - animal_models#Ddrgk1 null mouse (CRISPR c.-249_61del)
        rationale: Ddrgk1-null mice die at E11.5 to E12.5 from an erythropoiesis deficiency; patient lymphoblastoid
          cells express no DDRGK1 protein, yet no Shohat-type patient has a reported erythropoiesis phenotype.
          The discovery paper proposes that the erythropoiesis requirement is mouse-specific, which would
          explain the survival difference, but the alternative that the human splice allele retains an
          undetected residual function in some tissue has not been excluded. Which answer is right decides
          whether the conditional mouse models or a human-allele knock-in is the appropriate disease model.
      selected_evidence:
        snippet: However, there are no reports of Shohat-type SEMD patients with any erythropoiesis deficiency
          or phenotype
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
