        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sox9_versus_ire1a_branches
        kind: OPEN_QUESTION
        status: OPEN
        prompt: How do the SOX9-destabilisation and IRE1-alpha-ER-stress branches relate, and which operates
          in patient chondrocytes?
        attaches_to:
        - mechanistic_hypotheses#sox9_ubiquitination
        - mechanistic_hypotheses#ire1a_er_stress
        rationale: The 2017 work established SOX9 destabilisation with a sox9 rescue in zebrafish; the
          2023 work found the IRE1-alpha branch in chondrocyte-specific knockout mice and framed it as
          an alternative. The discovery paper itself noted that the skeletal phenotype of null mice exceeds
          what a sub-50 per cent SOX9 reduction predicts, which leaves room for both. Neither branch has
          been examined in any patient-derived chondrogenic cell, and no experiment has tested whether
          restoring IRE1-alpha, or suppressing CHOP, rescues the mouse growth plate.
      selected_evidence:
        snippet: Though the reduction in Sox9 protein levels is less than 50% in Ddrgk1–/– mice, these
          mice have a more severe skeletal phenotype than Sox9+/– mice haploinsufficient for Sox9
        supports: SUPPORT
