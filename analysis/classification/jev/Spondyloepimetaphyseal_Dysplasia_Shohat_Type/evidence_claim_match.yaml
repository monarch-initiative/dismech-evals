      assertion:
        name: Impaired IRE1-alpha UFMylation and Stability
        biological_scale: MOLECULAR
        description: DDRGK1 interacts with the kinase domain of the ER stress sensor IRE1-alpha (ERN1)
          and protects it from ubiquitin-dependent degradation in a UFMylation-dependent manner. Loss
          of DDRGK1, or mutation of its K268 UFMylation site, reduces IRE1-alpha UFMylation and increases
          ubiquitylation-mediated IRE1-alpha degradation. This branch was described in cancer cells and
          haematopoietic stem cells in 2017 and extended to chondrocytes and the growth plate in 2023.
        mechanism_confidence: ESTABLISHED
        biological_processes:
        - preferred_term: UFMylation of IRE1-alpha
          modifier: DECREASED
          term:
            id: GO:0071569
            label: protein ufmylation
        - preferred_term: ubiquitin-dependent degradation of IRE1-alpha
          modifier: INCREASED
          term:
            id: GO:0006511
            label: ubiquitin-dependent protein catabolic process
        genes:
        - preferred_term: ERN1 (IRE1-alpha)
          term:
            id: hgnc:3449
            label: ERN1
      selected_evidence:
        snippet: Instead of the classical modulation mechanism towards SOX9, our further mechanism study
          found that DDRGK1 stabilizes the stress sensor endoplasmic reticulum-to-nucleus signaling 1
          (IRE1α) to maintain endoplasmic reticulum (ER) homoeostasis.
        supports: SUPPORT
