      assertion:
        discussion_id: airway_cartilage_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the severe tracheal, laryngeal and bronchial narrowing a primary defect of airway cartilage
          caused by the same chondrogenic mechanism as the skeletal disease?
        attaches_to:
        - phenotypes#Tracheal stenosis
        - phenotypes#Laryngeal stenosis
        - pathophysiology#Impaired Chondrogenic Mesenchymal Condensation and Chondrocyte Differentiation
        rationale: Airway narrowing was life-threatening in two of five patients and fatal as a surgical
          complication in two more, yet no airway tissue has been examined and no model reports tracheal
          cartilage. The tracheal rings and laryngeal cartilages are SOX9-dependent cartilage, so a shared
          mechanism is plausible, but the phenotype is left unconnected in the pathograph rather than
          wired on plausibility.
      selected_evidence:
        snippet: At age 18, because of his narrowed trachea, patient 1 required a lifesaving tracheostomy
          during an aborted orthopedic surgery. Unfortunately, this surgical complication was the cause
          of death for patients 3 and 4 from families 1 and 4, respectively.
        supports: SUPPORT
