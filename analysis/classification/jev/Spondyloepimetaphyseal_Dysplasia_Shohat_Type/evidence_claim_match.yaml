      assertion_type: DifferentialDiagnosis
      assertion:
        name: COL2A1-related spondyloepiphyseal dysplasia spectrum
        description: Spondyloepiphyseal dysplasia congenita and the other type II collagenopathies share
          the vertebral and long-bone defects and were the obvious candidates before DDRGK1 was found;
          the discovery paper opens by contrasting them. COL2A1 is a downstream target of SOX9 in this
          disease, not a second causal gene.
        distinguishing_features:
        - Type II collagenopathies are caused by COL2A1 variants, usually dominant; Shohat-type SEMD is
          recessive and caused by DDRGK1.
        - Shohat-type SEMD adds metaphyseal irregularity, relative fibular overgrowth and abdominal distension
          with hepatosplenomegaly to the spondylo-epiphyseal pattern.
      selected_evidence:
        snippet: Similar skeletal disorders, such as spondyloepiphyseal dysplasias, are linked to mutations
          in type II collagen (COL2A1), but the causative gene in SEMD is not known.
        supports: SUPPORT
