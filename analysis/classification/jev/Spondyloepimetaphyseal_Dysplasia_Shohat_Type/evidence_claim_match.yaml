          biochemistry; whether SOX9 is itself UFMylated was proposed and not shown.
      selected_evidence:
        snippet: Taken together, these data indicate that loss of DDRGK1 decreases SOX9 expression and
          causes a human skeletal dysplasia, identifying a mechanism that regulates chondrogenesis via
          modulation of SOX9 ubiquitination.
