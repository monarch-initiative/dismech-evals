          description: A homozygous missense pathogenic variant reported in two children from unrelated
            Moroccan families, with clinical and radiological phenotypes similar to the splice-allele
            patients. The abstract does not name the nucleotide or amino-acid change and no functional
            assay is reported, so the allele is recorded by class only.
          gene:
            preferred_term: DDRGK1
            term:
              id: hgnc:16110
              label: DDRGK1
