      assertion_type: Pathophysiology
      assertion:
        name: Failure to Recruit TONSL-MMS22L to Post-Replicative Chromatin
        biological_scale: MOLECULAR
        description: Histone H4 deposited during replication is unmethylated at K20, so H4K20me0 marks
          chromatin as newly replicated until late G2/M. The TONSL ankyrin repeat domain reads that mark,
          and that reading is what puts the TONSL-MMS22L complex on replicated chromatin and at challenged
          forks. Losing the reader, or losing the dimer, removes the complex from the place it is needed.
        biological_processes:
        - preferred_term: replication fork processing
          modifier: DECREASED
          term:
            id: GO:0031297
            label: replication fork processing
      selected_evidence:
        snippet: H4K20me0 recognition is required for TONSL-MMS22L binding to chromatin and accumulation
          at challenged replication forks and DNA lesions.
        supports: SUPPORT
