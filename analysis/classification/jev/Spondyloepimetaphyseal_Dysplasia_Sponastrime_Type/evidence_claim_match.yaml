      assertion_type: Pathophysiology
      assertion:
        name: Hypomorphic Loss of TONSL Function
        biological_scale: MOLECULAR
        description: Biallelic TONSL variants reduce, without abolishing, the function of the Tonsoku-like
          DNA repair protein. Two structural routes are documented. Ankyrin repeat domain variants impair
          the H4K20me0 histone-reading function; ubiquitin-like domain variants, including the recurrent
          R934W and G973R, abolish TONSL homodimerization. R934W removes hydrogen bonds and introduces
          steric clashes that force a monomeric conformation, and G973R destabilizes a conserved residue
          in a constrained beta-turn.
        molecular_functions:
        - preferred_term: TONSL histone H4K20me0 reading and dimerization
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0042393
            label: histone binding
      selected_evidence:
        snippet: We reveal that TONSL homo-dimerizes via its ubiquitin-like domain (UBL), and two recurrent
          SPONASTRIME dysplasia causative variants (R934W and G973R) abolish this dimerization.
        supports: SUPPORT
