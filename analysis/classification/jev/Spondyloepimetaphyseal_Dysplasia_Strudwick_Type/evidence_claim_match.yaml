      assertion_type: AnimalModel
      assertion:
        species: Mouse
        genotype: Col2a1 R992C conditional transgenic
        description: 'Conditional transgenic mice expressing the R992C collagen II mutation in chondrocytes
          develop disorganized growth plates with loss of columnar chondrocyte arrangement, ER stress,
          aberrant cell polarization, reduced proliferation, and abnormal primary cilia morphology. Switching
          off transgene expression restores normal growth plate morphology, confirming direct causality.

          '
      selected_evidence:
        snippet: chondrocytes expressing the thermolabile R992C mutant collagen II molecules endured endoplasmic
          reticulum stress, had atypical polarization, and had reduced proliferation. Moreover, we demonstrated
          aberrant organization and morphology of primary cilia.
        supports: SUPPORT
