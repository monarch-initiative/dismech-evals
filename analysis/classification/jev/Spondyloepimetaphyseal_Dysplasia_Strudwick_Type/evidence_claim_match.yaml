            disruption of type II collagen.

            '
        - name: COL2A1 Gly154Arg substitution
          description: 'Recurrent Gly154Arg substitution in type II collagen reported in two unrelated
            individuals with SEMD and radiographic evolution consistent with the Strudwick subtype.

            '
        - name: COL2A1 Gly283Arg substitution
          description: 'Gly283Arg substitution producing a metaphyseal dysplasia pattern that matches
            Murdoch type metaphyseal dysplasia, subsequently renamed Strudwick type SEMD.

            '
      selected_evidence:
        snippet: We now describe the biochemical characterization of defects in alpha 1(II) collagen in
