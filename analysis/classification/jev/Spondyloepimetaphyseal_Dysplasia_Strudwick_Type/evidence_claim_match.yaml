        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Collagen Triple Helix Disruption
        description: 'Glycine-to-amino-acid substitutions in the Gly-X-Y repeats of the COL2A1 triple-helical
          domain destabilize the type II collagen triple helix through a dominant-negative mechanism.
          Because glycine is the only amino acid small enough to fit in the center of the triple helix,
          its substitution prevents proper chain folding. Even a single mutant alpha-1(II) chain incorporated
          into a trimeric molecule disrupts the entire structure, causing altered electrophoretic mobility,
          reduced thermostability, and slow secretion.

          '
        genes:
        - preferred_term: COL2A1
          term:
            id: hgnc:2200
            label: COL2A1
        molecular_functions:
        - preferred_term: extracellular matrix structural constituent
          term:
            id: GO:0005201
            label: extracellular matrix structural constituent
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: Collagen Fibril Organization
          term:
            id: GO:0030199
            label: collagen fibril organization
        - preferred_term: Collagen Biosynthesis
          term:
            id: GO:0032964
            label: collagen biosynthetic process
        cellular_components:
        - preferred_term: extracellular matrix
          term:
            id: GO:0031012
            label: extracellular matrix
          modifier: ABNORMAL
      selected_evidence:
        snippet: All previously reported autosomal dominant mutations causing SEMD have substituted an
          obligate glycine within the triple helix, in particular at codons 292, 304 and 709 in the three
          reported Strudwick-type patients.
        supports: SUPPORT
