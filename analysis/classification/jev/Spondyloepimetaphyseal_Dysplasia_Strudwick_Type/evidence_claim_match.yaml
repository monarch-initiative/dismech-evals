  a247d5d31503cf6fb1630146535d10ab1b18f2f0008fbff8e73ba0797f94e648:
    claim:
      about:
        disease:
          name: Spondyloepimetaphyseal Dysplasia Strudwick Type
          disease_term:
            preferred_term: spondyloepimetaphyseal dysplasia Strudwick type
            term:
              id: MONDO:0008476
              label: spondyloepimetaphyseal dysplasia, Strudwick type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ER Retention and Impaired Procollagen Proteostasis
        description: 'Misfolded type II procollagen molecules accumulate in the endoplasmic reticulum
          of chondrocytes, causing ER distention and an ER storage disorder phenotype. The cellular response
          to this accumulation is variant-dependent: some mutations activate canonical ER stress and the
          unfolded protein response (UPR), leading to chondrocyte apoptosis and growth plate disorganization.
          However, recent iPSC-derived cartilage models demonstrate that certain COL2A1 substitutions
          cause ER retention and defective matrix deposition without robust UPR activation, indicating
          a failure in cellular surveillance where misfolded procollagen evades ER quality control. Both
          pathways converge on reduced chondrocyte proliferation and compromised cartilage matrix.

          '
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        - preferred_term: Growth Plate Chondrocyte
          term:
            id: CL:1000217
            label: growth plate cartilage chondrocyte
        biological_processes:
        - preferred_term: ER Unfolded Protein Response
          term:
            id: GO:0030968
            label: endoplasmic reticulum unfolded protein response
        - preferred_term: Response to ER Stress
          term:
            id: GO:0034976
            label: response to endoplasmic reticulum stress
        - preferred_term: Chondrocyte Differentiation
          term:
            id: GO:0002062
            label: chondrocyte differentiation
        cellular_components:
        - preferred_term: endoplasmic reticulum
          term:
            id: GO:0005783
            label: endoplasmic reticulum
          modifier: ABNORMAL
      selected_evidence:
        snippet: The COL2pathy-iChon cells showed suppressed expression of COL2A1 and significant apoptosis.
          A distended endoplasmic reticulum (ER) was detected, thus suggesting the adaptation of gene
          expression and cell death caused by excess ER stress.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25187577
      reference_title: Modeling type II collagenopathy skeletal dysplasia by directed conversion and induced
        pluripotent stem cells.
      evidence_source: IN_VITRO
      explanation: Patient-derived iPSC chondrocytes demonstrate ER distension, suppressed COL2A1 expression,
        and apoptosis, directly modeling the ER stress pathomechanism.
