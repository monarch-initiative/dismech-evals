      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: exoc6b_ciliopathy
        hypothesis_label: Skeletal Ciliopathy Model
        status: EMERGING
        description: Loss of EXOC6B impairs primary cilium formation, through loss of exocytosis and possibly
          loss of autophagy-driven cilium elongation, which attenuates cilium-dependent Hedgehog signalling
          in prechondrocytes and disturbs chondrocyte differentiation. The same cilium defect is proposed
          to explain the central nervous system anomalies in one patient. Evidence is from one patient
          fibroblast study, a knockdown mouse chondrogenic cell line and engineered human cell lines;
          there is no animal model.
      selected_evidence:
        snippet: SEMDJL3 with biallelic pathogenic variants in EXOC6B might represent yet another ciliopathy
          with central nervous system involvement and joint dislocations.
        supports: SUPPORT
