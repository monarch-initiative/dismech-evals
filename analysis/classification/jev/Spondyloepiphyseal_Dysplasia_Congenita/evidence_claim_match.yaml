        description: Spondyloepiphyseal dysplasia congenita is diagnosed at birth from disproportionate
          short-trunk short stature and characteristic spondyloepiphyseal radiographic findings, and confirmed
          within the COL2A1-related type II collagen disorder spectrum by molecular genetic testing. Differential
          diagnosis includes other type II collagenopathies (Kniest dysplasia, SEMD Strudwick, hypochondrogenesis/achondrogenesis
