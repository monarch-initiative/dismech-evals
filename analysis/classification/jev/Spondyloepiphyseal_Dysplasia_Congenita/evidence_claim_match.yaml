  95b703446938bb262c824d47f342bb75c552edbb6e748ced29af5d107e342d85:
    claim:
      about:
        disease:
          name: Spondyloepiphyseal Dysplasia Congenita
          disease_term:
            preferred_term: spondyloepiphyseal dysplasia congenita
            term:
              id: MONDO:0008471
              label: spondyloepiphyseal dysplasia congenita
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ER Stress and Unfolded Protein Response in Chondrocytes
        description: 'Misfolded mutant procollagen II is retained in dilated endoplasmic reticulum cisternae
          of growth plate chondrocytes. In some mouse models (e.g., Col2a1 p.Gly1170Ser), this activates
          the endoplasmic reticulum stress (ERS)-unfolded protein response (UPR)-apoptosis cascade: chondrocyte
          apoptosis occurs prior to hypertrophy, preventing formation of a normal hypertrophic zone, disrupting
          chondrogenic signaling pathways including Ihh, Fgfr3, and Runx2, and impairing endochondral
          ossification. Patient-derived type II collagenopathy iPSC chondrocytes likewise show ER stress
          marker induction with apoptosis. However, an iPSC-derived human cartilage model of the milder
          COL2A1 p.Arg719Cys allele (precocious osteoarthritis with mild spondyloepiphyseal dysplasia,
          not SEDC) showed ER retention and ER distention without detectable UPR activation, indicating
          that some alleles behave as an ER procollagen storage problem rather than a classical UPR-driven
          apoptosis pathway. The degree of UPR engagement therefore appears to be allele-, dosage-, and
          context-dependent, and has not been resolved for SEDC-causing glycine substitutions specifically.

          '
        cell_types:
        - preferred_term: Growth Plate Chondrocyte
          term:
            id: CL:1000217
            label: growth plate cartilage chondrocyte
        - preferred_term: Hypertrophic Chondrocyte
          term:
            id: CL:0000743
            label: hypertrophic chondrocyte
        biological_processes:
        - preferred_term: Response to ER Stress
          term:
            id: GO:0034976
            label: response to endoplasmic reticulum stress
        - preferred_term: Unfolded Protein Response
          term:
            id: GO:0006986
            label: response to unfolded protein
        - preferred_term: Chondrocyte Apoptosis
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: Misfolded procollagen was largely synthesized and retained in dilated endoplasmic reticulum
          and the endoplasmic reticulum stress (ERS)-unfolded protein response (UPR)-apoptosis cascade
          was activated. Apoptosis occurred prior to hypertrophy, prevented the formation of a hypertrophic
          zone, disrupted normal chondrogenic signaling pathways, and eventually caused chondrodysplasia.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24475193
      reference_title: Endoplasmic reticulum stress-unfolding protein response-apoptosis cascade causes
        chondrodysplasia in a col2a1 p.Gly1170Ser mutated mouse model.
      evidence_source: MODEL_ORGANISM
      explanation: This col2a1 p.Gly1170Ser mouse model directly demonstrates that ER stress-UPR-apoptosis
        is the chief mechanism of chondrodysplasia caused by COL2A1 mutations.
