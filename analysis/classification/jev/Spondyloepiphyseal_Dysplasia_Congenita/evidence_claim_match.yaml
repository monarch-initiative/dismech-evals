  83e0ad667fc5192669663324cc5200172ac31455564a05173be706f26f080515:
    claim:
      about:
        disease:
          name: Spondyloepiphyseal Dysplasia Congenita
          disease_term:
            preferred_term: spondyloepiphyseal dysplasia congenita
            term:
              id: MONDO:0008471
              label: spondyloepiphyseal dysplasia congenita
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative Collagen Misfolding
        description: 'The most common COL2A1 mutations in SEDC are missense substitutions affecting glycine
          residues in the Gly-X-Y triple-helical repeat (over 70% of pathogenic variants). The mutant
          alpha-1 chains are incorporated into procollagen trimers but disrupt triple-helix folding, producing
          a dominant-negative effect. The structurally abnormal procollagen has reduced thermal stability,
          slower secretion, and altered electrophoretic mobility. Fibrils that are secreted self-assemble
          abnormally and cannot properly interact with other extracellular matrix components such as proteoglycans,
          compromising the mechanical integrity of cartilage. Arginine-to-cysteine substitutions toward
          the C-terminus of the triple helix are particularly deleterious, causing reduced thermal stability,
          protease susceptibility, and cleavage by matrix metalloproteinases.

          '
        genes:
        - preferred_term: COL2A1
          term:
            id: hgnc:2200
            label: COL2A1
        molecular_functions:
        - preferred_term: extracellular matrix structural constituent
          term:
            id: GO:0005201
            label: extracellular matrix structural constituent
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: Collagen Fibril Organization
          term:
            id: GO:0030199
            label: collagen fibril organization
        - preferred_term: Extracellular Matrix Organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
        - preferred_term: Protein Folding
          term:
            id: GO:0006457
            label: protein folding
        cellular_components:
        - preferred_term: rough endoplasmic reticulum
          term:
            id: GO:0005791
            label: rough endoplasmic reticulum
        - preferred_term: Golgi apparatus
          term:
            id: GO:0005794
            label: Golgi apparatus
        - preferred_term: extracellular matrix
          term:
            id: GO:0031012
            label: extracellular matrix
          modifier: DECREASED
      selected_evidence:
        snippet: Retention of misfolded R740C and R789C proteins triggered an ER stress response leading
          to apoptosis of the expressing cells. Arginine to cysteine mutations towards the C-terminus
          of the triple helix had a deleterious effect, whereas mutations towards the N-terminus of the
          triple helix (R75C and R134C) and R704C had less impact.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
