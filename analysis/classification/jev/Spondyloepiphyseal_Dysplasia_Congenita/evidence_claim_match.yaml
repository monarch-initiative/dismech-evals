              id: MONDO:0008471
              label: spondyloepiphyseal dysplasia congenita
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Growth Plate Organization
        description: 'The combined effects of abnormal extracellular collagen fibrils and ER stress-driven
          chondrocyte apoptosis lead to severe disorganization of growth plate architecture. Proliferative
          and hypertrophic zones become shortened or indistinguishable, columnar arrangement of chondrocytes
          is disrupted, and deposition of cartilage matrix is impaired. Collagen fibrils are fewer and
          less elaborate, and expression of chondrocyte differentiation markers (Ihh, Fgfr3, Col10a1,
          Runx2) is markedly reduced. This disrupted endochondral ossification accounts for the disproportionate
          short stature, platyspondyly, and epiphyseal dysplasia.

          '
        cell_types:
        - preferred_term: Growth Plate Chondrocyte
          term:
            id: CL:1000217
            label: growth plate cartilage chondrocyte
        biological_processes:
        - preferred_term: Endochondral Ossification
          term:
            id: GO:0001958
            label: endochondral ossification
          modifier: DECREASED
        - preferred_term: Cartilage Development
          term:
            id: GO:0051216
            label: cartilage development
          modifier: DECREASED
      selected_evidence:
        snippet: Histology revealed growth plate disorganization in 14-day-old Lpk/+ mice and embryonic
          cartilage from Lpk/+ and Lpk/Lpk mice had reduced safranin-O and type-II collagen staining in
          the extracellular matrix.
        supports: SUPPORT
