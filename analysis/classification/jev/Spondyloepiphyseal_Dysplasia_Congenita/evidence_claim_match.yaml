      assertion:
        name: Secondary Osteoarthritis
        description: 'Abnormal type II collagen in articular cartilage predisposes to premature degenerative
          joint disease. Even in heterozygous carriers without overt dwarfism, abnormal collagen leads
          to progressive cartilage degradation through upregulation of the HtrA1-Ddr2-Mmp-13 degradative
