            term:
              id: MONDO:0008471
              label: spondyloepiphyseal dysplasia congenita
        context: []
      assertion_type: Genetic
      assertion:
        name: COL2A1 Mutations
        association: Causative
        gene_term:
          preferred_term: COL2A1
          term:
            id: hgnc:2200
            label: COL2A1
        notes: 'Heterozygous mutations in COL2A1 (12q13.1-q13.2) cause SEDC. The gene has 54 exons encoding
          the 1487-amino acid alpha-1 chain of type II collagen. Over 400 pathogenic variants have been
          cataloged. The dominant-negative mechanism predominates: glycine substitutions in the Gly-X-Y
          repeat (74% of triple-helix mutations) and arginine-to-cysteine changes (10%) disrupt triple-helix
          assembly. Haploinsufficiency from premature stop codons is associated with milder phenotypes.
          No mutational hot spots have been identified, and no amino-to-carboxyterminal gradient in phenotypic
          severity exists, unlike osteogenesis imperfecta.

          '
        variants:
        - name: Triple-helical glycine substitutions
          description: 'The predominant SEDC variant class, replacing obligatory glycine residues in the
            COL2A1 triple-helical Gly-X-Y repeat and acting primarily through a dominant-negative collagen-folding
            mechanism.

            '
        - name: SEDC glycine-substitution examples G474V, G543E, G567S, G594R, and G1170R
          description: 'Patient-level examples from a Japanese SEDC cohort, all novel missense variants
            producing glycine substitutions in COL2A1.

            '
        - name: Arginine-to-cysteine substitutions in Gly-X-Y repeats
          description: 'Less common non-glycine missense class in COL2A1 that can cause SEDC or related
            type II collagenopathy phenotypes, with severity depending on position and protein-level effects
            on secretion, stability, ER retention, and cell survival.

            '
      selected_evidence:
        snippet: Previous evidence suggesting defects of type II collagen associated with the SEDC phenotype
          led us to genotype the family for various COL2A1 gene-associated RFLPs. A total of 17 affected
          and unaffected members of this family were studied. The family was informative for a recently
          discovered HinfI RFLP. No recombinants between the marker and the phenotype were found in eight
          informative meioses. A maximum LOD score of 3.01 was obtained at a recombination fraction of
          .00.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
