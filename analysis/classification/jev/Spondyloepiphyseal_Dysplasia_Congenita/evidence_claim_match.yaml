        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Vitreous Collagen Abnormality
        description: 'Type II collagen is a major component of the vitreous humor and is critical for
          vitreous gel structure. Abnormal collagen leads to vitreous liquefaction, vitreous syneresis,
          and posterior vitreous detachment, increasing the risk of retinal detachment. In a 93-patient
          cohort of COL2A1 mutation carriers with SEDC or a related phenotype, myopia was reported in
          45% and retinal detachment in 12%; these figures come from that mixed COL2A1 cohort rather than
          from a SEDC-only series.

          '
        biological_processes:
        - preferred_term: Vitreous Collagen Fibril Organization
          term:
            id: GO:0030199
            label: collagen fibril organization
      selected_evidence:
        snippet: Eighteen patients had ocular changes associated with spondyloepiphyseal dysplasia congenita,
          a rare cause of congenital dwarfism with normal mental development. Seven patients had nonprogressive
          myopia of 5.00 or more diopters. Vitreoretinal degeneration was encountered in six patients
          with high myopia, and vitreous syneresis was present in all patients.
        supports: SUPPORT
