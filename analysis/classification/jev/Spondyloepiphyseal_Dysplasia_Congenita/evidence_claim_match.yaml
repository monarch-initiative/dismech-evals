              term:
                id: hgnc:2200
                label: COL2A1
            notes: 'Heterozygous mutations in COL2A1 (12q13.1-q13.2) cause SEDC. The gene has 54 exons
              encoding the 1487-amino acid alpha-1 chain of type II collagen. Over 400 pathogenic variants
              have been cataloged. The dominant-negative mechanism predominates: glycine substitutions
              in the Gly-X-Y repeat (74% of triple-helix mutations) and arginine-to-cysteine changes (10%)
              disrupt triple-helix assembly. Haploinsufficiency from premature stop codons is associated
              with milder phenotypes. No mutational hot spots have been identified, and no amino-to-carboxyterminal
              gradient in phenotypic severity exists, unlike osteogenesis imperfecta.

              '
          role: ancestor
      assertion_type: Variant
