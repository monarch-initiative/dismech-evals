      assertion_type: Genetic
      assertion:
        name: MBTPS1
        gene_term:
          preferred_term: MBTPS1
          term:
            id: hgnc:15456
            label: MBTPS1
        relationship_type: CAUSATIVE
        notes: 'Biallelic. The founding patient was compound heterozygous for a 1-bp duplication and a
          missense variant - one amorphic and one severely hypomorphic - and a later Saudi patient was
          homozygous for c.2634C>A p.(Ser878Arg). The founding genotype is mechanistically informative
          rather than incidental: because one allele retains a trace of function, the disease shows what
          happens at about 1% of normal S1P rather than at zero, and complete loss may not be viable.'
      selected_evidence:
        snippet: The unique combination of these mutations results in a frequency of functional MBTPS1
          transcripts of approximately 1%, a finding that is associated with skeletal dysplasia and elevated
          blood lysosomal enzymes.
        supports: SUPPORT
