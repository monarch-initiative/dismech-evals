  470bab3ae74083022db41ff4857aae356c6d0b8b5fca02d3d25dd0980c1f3b2e:
    claim:
      about:
        disease:
          name: Spondyloepiphyseal Dysplasia, Kondo-Fu Type
          disease_term:
            preferred_term: spondyloepiphyseal dysplasia, Kondo-Fu type
            term:
              id: MONDO:0032721
              label: spondyloepiphyseal dysplasia, kondo-fu type
        context: []
      assertion_type: Treatment
      assertion:
        name: Recombinant Human Growth Hormone Therapy
        description: Growth hormone given for the growth failure. The evidence is one three-year course
          in a single patient with a partial growth-hormone-secretion deficit and a normal IGF-1, whose
          height moved from -4.86 SD to -3.96 SD - a real gain that still leaves the child profoundly
          short. The founding patient received growth hormone and stopped it for limited response, so
          the two reported courses point in opposite directions.
        treatment_term:
          preferred_term: recombinant human growth hormone therapy
          term:
            id: NCIT:C15445
            label: Hormone Therapy
          therapeutic_agent:
          - preferred_term: recombinant human growth hormone
            term:
              id: CHEBI:749556
              label: somatropin
        target_phenotypes:
        - preferred_term: Short stature
          term:
            id: HP:0004322
            label: Short stature
        notes: 'therapeutic_modality is left unset. Somatropin is a recombinant protein, but PROTEIN_REPLACEMENT
          would assert that this is replacement of a missing protein, and SEDKF short stature is a growth-plate
          disease rather than a growth-hormone deficiency - the one patient''s stimulation test showed
          only a partial secretion deficit and a normal IGF-1. No value in the enum states "recombinant
          protein hormone given pharmacologically", so none is recorded.

          Both reported courses are quoted above and they disagree. dismech has no way to record that
          two evidence items are in conflict with each other rather than each independently graded against
          the claim, so the disagreement lives in this note and in the description (issue #11142).'
      selected_evidence:
        snippet: However, after treatment, the child’s height increased from −4.86SD to −3.96SD, indicating
          that the growth hormone had specific benefits in increasing the height of such patients.
        supports: SUPPORT
