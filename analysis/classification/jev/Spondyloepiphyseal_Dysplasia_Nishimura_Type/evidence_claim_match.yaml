  f7e5fa7b5db507c6f249e68e8dce5c0d28b32ce662488da93f1894d16ee7b507:
    claim:
      about:
        disease:
          name: Spondyloepiphyseal Dysplasia, Nishimura Type
          disease_term:
            preferred_term: spondyloepiphyseal dysplasia, Nishimura type
            term:
              id: MONDO:0032835
              label: spondyloepiphyseal dysplasia, nishimura type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sedn_metabolic_branch_is_provisional
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced Acetyl-CoA Availability and Histone Acetylation
        - pathophysiology#Resting-Zone Chondrocyte Expansion
        prompt: Does reduced acetyl-CoA in miR-140 mutant chondrocytes cause the resting-zone expansion,
          and does it do so by raising FGFR3?
        rationale: 'The metabolic branch of this entry is attractive and incompletely demonstrated, and
          it is worth being exact about which links are which.

          Measured in the miR-140 mutant itself: HIF1A falls, glycolytic gene expression falls, mitochondrial
          gene expression rises, the Seahorse assay confirms the reciprocal shift, and histone acetylation
          falls. Measured in surrogates: that suppressing glycolysis by deleting Ldha, or blocking acetyl-CoA
          synthesis by deleting Acly, expands the resting zone and increases resting chondrocyte proliferation.
          The Acly result is the good control, because it separates acetyl-CoA from ATP supply, which
          a glycolysis block alone would not.

          What has not been done is the experiment in the middle: nobody has restored acetyl-CoA in a
          miR-140 mutant and asked whether the resting zone normalises. Until that is done, the identity
          of the mechanism in the mutant with the mechanism in the knockouts is an inference from phenotypic
          similarity.

          The onward step to FGFR3 is weaker again and is deliberately not curated as a causal edge. Fgfr3
          is upregulated in both knockouts and a constitutively active FGFR3 expands the resting zone,
          which makes it a good candidate, but the authors write that the mechanism by which acetyl-CoA
          deficiency would raise Fgfr3 is not clear, and no chromatin measurement at the Fgfr3 locus has
          been reported. A causal edge here would assert more than the source does. It is also worth noting
          the irony that would follow if it held: an FGFR3 gain of signalling is the mechanism of achondroplasia,
          reached in this disease by an entirely different route.

          A further caveat applies to the whole branch. Its source is a bioRxiv preprint that had not
          appeared in a peer-reviewed journal as of curation, and it has not been independently replicated.'
        proposed_experiments:
        - experiment_id: exp_sedn_acetyl_coa_rescue
          name: Restore acetyl-CoA in miR-140 knock-in chondrocytes and rescore the growth plate
          description: Supply acetate or citrate, or overexpress Acly, in Mir140 knock-in mice or their
            primary chondrocytes and measure histone acetylation, Fgfr3 expression, resting-zone width
            and resting chondrocyte proliferation against untreated mutants. A rescue would convert the
            acetyl-CoA account of this disease from a phenotypic parallel between three mouse lines into
            a demonstrated mechanism.
      selected_evidence:
        snippet: These data demonstrate the association between reduced glycolysis and an expansion of
          the resting zone and suggest that it is caused by acetyl-CoA deficiency, but not energy deficiency,
          possibly through epigenetic upregulation of FGFR3 signaling.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36711926
      reference_title: Reduced glycolysis links resting zone chondrocyte proliferation in the growth plate.
      evidence_source: MODEL_ORGANISM
      explanation: The strength of claim the paper itself makes, with its two hedges - "suggest" and "possibly"
        - which the curation follows.
