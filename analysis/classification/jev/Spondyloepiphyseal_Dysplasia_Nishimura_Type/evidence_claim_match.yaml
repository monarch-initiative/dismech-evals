        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Suppression of YBX1-Dependent Transcript Stabilization
        biological_scale: MOLECULAR
        description: The explanation the founding study offers for why a seed with no evolutionary history
          with its targets nonetheless represses them hard. The hexamer complementary to the mutant seed,
          ACCACC, is one of the motifs bound by YBX1, an RNA-binding protein that stabilises transcripts,
          so the mutant microRNA in the Ago2 complex and YBX1 compete for the same 3-prime UTR sites.
          Ago2 and Ybx1 seCLIP in knock-in chondrocytes show both sides of that competition, acquired
          targets that also carry YBX1 binding are repressed more strongly than those that do not, and
          previously reported YBX1-stabilised transcripts fall preferentially in mutant rather than null
          chondrocytes.
        genes:
        - preferred_term: YBX1
          term:
            id: hgnc:8014
            label: YBX1
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        mechanism_confidence: PROVISIONAL
        notes: Confidence is PROVISIONAL rather than ESTABLISHED because the competition is inferred from
          motif overlap plus crosslinking and reporter experiments in mouse chondrocytes and HEK293T cells,
          and the authors themselves phrase the conclusion as a partial attribution. No experiment has
          removed YBX1 from a knock-in animal, and nothing has been measured in human cartilage.
      selected_evidence:
        snippet: Importantly, miR-140-5p-G Ago2 seCLIP target genes with Ybx1 binding in the 3′ UTR showed
          stronger repression in mutant chondrocytes than those without Ybx1 binding
        supports: SUPPORT
        directness: INDIRECT
