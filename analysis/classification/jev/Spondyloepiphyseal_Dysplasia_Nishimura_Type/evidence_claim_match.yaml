            term:
              id: MONDO:0032835
              label: spondyloepiphyseal dysplasia, nishimura type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sedn_no_human_tissue
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Repression of Novel Targets Acquired by the Mutant Seed
        - pathophysiology#Resting-Zone Chondrocyte Expansion
        prompt: Does the mutant seed repress the same transcripts in a human chondrocyte that it represses
          in a mouse one, and does a patient growth plate have the expanded resting zone?
        rationale: 'Every mechanistic measurement in this entry was made in mouse cells or mouse bone.
          That is not a criticism of the work - the knock-in carries the patients'' exact substitution
          and the mature miR-140-5p sequence is conserved - but it leaves two specific things unmeasured
          in humans, and they are not the same kind of gap.

          The acquired target set is the first. It was predicted by TargetScan and confirmed against the
          mouse transcriptome. Because the seed is newly created, its targets have no evolutionary history
          with it, so there is no reason to expect the 3-prime UTR matches to be conserved between mouse
          and human the way the wild-type target set is - the founding study itself reports that mutant-seed
          target sites are less conserved than wild-type ones. A human chondrocyte could therefore carry
          a materially different acquired target set from the mouse. Nothing about that has been tested.

          The resting-zone expansion is the second, and it is a gap of a different kind: no human growth
          plate from a patient has been examined at all. The human evidence is radiographic delay in ossification,
          which is compatible with the mouse lesion but does not demonstrate it. Since the resting-zone
          phenotype is what the entire metabolic branch was built to explain, its human status matters
          more than its position in the entry suggests.

          Neither gap can be closed with the existing patients without cartilage, which is not ordinarily
          biopsied. Patient-derived induced pluripotent stem cells differentiated to chondrocytes would
          answer the first question and are within reach; the second may not be answerable at all outside
          an incidental surgical specimen.'
      selected_evidence:
        snippet: Target sites of miR-140-5p-G seldom overlapped with those of wild-type miR-140 species
          (wild-type 5p, 3p.1, and 3p.2) and were less conserved than those of wild-type miR-140 species
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30804514
      reference_title: Gain-of-function mutation of microRNA-140 in human skeletal dysplasia.
      evidence_source: IN_VITRO
      explanation: 'The specific reason the mouse acquired target set may not transfer: those sites are
        the less conserved ones, so cross-species inference is weaker here than for the wild-type set.'
