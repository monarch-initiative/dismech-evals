      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        description: 'Three affected individuals in two unrelated families all carry the same heterozygous
          MIR140 substitution. It arose de novo in the two probands and was transmitted from an affected
          mother to her affected son. Dominance here is not haploinsufficiency: a heterozygous MIR140
          deletion has not been associated with skeletal disease in humans and heterozygous miR-140 knockout
          mice are normal, so it is the presence of the mutant microRNA product, not the absence of half
          the wild-type dose, that produces the phenotype.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: The same single nucleotide substitution occurred de novo in P1 and P3, and co-segregated
          with the skeletal dysplasia phenotype in Family 1
        supports: SUPPORT
