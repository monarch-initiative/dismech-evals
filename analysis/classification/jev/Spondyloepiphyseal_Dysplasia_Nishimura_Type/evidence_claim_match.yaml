          actually covers MIR140. The practical trap is structural: MIR140 is a short non-coding gene,
          so an exome pipeline built around coding exons will not find the variant. In both families exome
          sequencing was performed first and returned nothing in the protein-coding genes; whole genome
          sequencing, searching non-coding as well as coding genes, found the substitution. A panel of
          378 known skeletal dysplasia genes and a dosage array were also negative. Once the entity was
          recognised in the second family, Sanger sequencing of MIR140 was sufficient.'
