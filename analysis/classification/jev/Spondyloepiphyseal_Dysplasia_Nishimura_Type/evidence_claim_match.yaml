  11e9545c288d23e8c9c93a9e73420d3e9ae988e1d51a7ccaa92fdd00a7542133:
    claim:
      about:
        disease:
          name: Spondyloepiphyseal Dysplasia, Nishimura Type
          disease_term:
            preferred_term: spondyloepiphyseal dysplasia, Nishimura type
            term:
              id: MONDO:0032835
              label: spondyloepiphyseal dysplasia, nishimura type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Abundant Production of the Mutant miR-140-5p
        biological_scale: MOLECULAR
        description: The mutant strand is made in quantity. Small RNA sequencing of knock-in mouse chondrocytes
          finds slightly more mutant miR-140-5p than wild-type miR-140-5p, with only minor shifts in Dicer
          processing and strand choice, so the substitution does not act by crippling biogenesis. Because
          MIR140 sits in a chondrocyte-specific super-enhancer, the mutant product is delivered at high
          level precisely in the cells the disease affects. This is the node that separates the lesion
          from the MIR96 Italian allele, which is a processing defect and reduces mature microRNA yield
          without changing what it targets.
        genes:
        - preferred_term: MIR140
          term:
            id: hgnc:31527
            label: MIR140
        notes: No biological_processes descriptor is attached. The claim this node makes is that microRNA
          processing is unaffected, and ModifierEnum has no value for "unchanged" - INCREASED, DECREASED,
          ABNORMAL and DYSREGULATED would each assert a change that the cited measurement specifically
          did not find. The negative is the point, so it is carried by the description and the evidence
          rather than by a modifier.
      selected_evidence:
        snippet: Small RNA sequencing analysis in mouse chondrocytes revealed that the miR-140 A>G mutation
          yields slightly greater amounts of the mutant miR-140-5p (miR-140-5p-G) than wild-type miR-140-5p,
          while decreasing two miR-140-3p species (3p.1 and 3p.2)
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
