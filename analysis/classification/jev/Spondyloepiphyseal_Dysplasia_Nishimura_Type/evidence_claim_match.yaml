      assertion_type: Pathophysiology
      assertion:
        name: Reduced Acetyl-CoA Availability and Histone Acetylation
        biological_scale: MOLECULAR
        description: Less glycolytic flux means less mitochondria-derived citrate and so less cytoplasmic
          acetyl-CoA, the acetyl donor for histone acetylation. Histone acetylation is reduced both in
          the miR-140 mutant and in Ldha-deficient chondrocytes. Deleting Acly, which converts citrate
          to acetyl-CoA, reproduces the growth plate phenotype without producing an energy deficit, which
          is the experiment that separates the acetyl-CoA explanation from a simple ATP shortage.
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        mechanism_confidence: PROVISIONAL
        notes: The step from reduced acetyl-CoA to the growth plate phenotype rests on Acly and Ldha conditional
          knockouts, not on the miR-140 mutant. What the mutant itself contributes is the reduced glycolysis
          and the reduced histone acetylation. The onward step to FGFR3 is weaker still and is recorded
          as an open question rather than as a causal edge.
      selected_evidence:
        snippet: We have also found that reduced glycolysis results in reduced histone acetylation in
          the miR-140 mutant as well as LDH-deficient chondrocytes likely due to the reduction in acetyl-CoA
          generated from mitochondria-derived citrate.
        supports: SUPPORT
        directness: INDIRECT
