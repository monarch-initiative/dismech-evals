          finds slightly more mutant miR-140-5p than wild-type miR-140-5p, with only minor shifts in Dicer
          processing and strand choice, so the substitution does not act by crippling biogenesis. Because
          MIR140 sits in a chondrocyte-specific super-enhancer, the mutant product is delivered at high
          level precisely in the cells the disease affects. This is the node that separates the lesion
          from the MIR96 Italian allele, which is a processing defect and reduces mature microRNA yield
          without changing what it targets.
        genes:
