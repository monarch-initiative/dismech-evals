        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Acrodysostosis
        description: The differential the authors single out. Both disorders combine midface hypoplasia
          with brachydactyly and cone-shaped epiphyses, so the hands and face look similar. Two things
          separate them. Epiphyseal maturation is delayed in SED Nishimura type and advanced, particularly
          in the carpus, in acrodysostosis - the ossification clock runs the opposite way. And epiphyseal
          dysplasia, which is a hallmark here, is not a feature of acrodysostosis. The reported patients
          also had none of the endocrine abnormalities of acrodysostosis and no PDE4D or PRKAR1A variant.
        distinguishing_features:
        - Delayed rather than advanced epiphyseal and carpal ossification
        - Epiphyseal dysplasia, which acrodysostosis does not have
        - No hypocalcaemia, hyperphosphataemia, raised PTH or TSH, or low IGF-1
        - No PDE4D or PRKAR1A variant
      selected_evidence:
        snippet: The present disorder should be differentiated from acrodysostosis.
        supports: SUPPORT
