            term:
              id: MONDO:0032835
              label: spondyloepiphyseal dysplasia, nishimura type
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: trps1_cone_epiphysis_bridge
        hypothesis_label: TRPS1 repression by the mutant seed as the route to cone-shaped epiphyses
        status: EMERGING
        description: 'A candidate bridge between one named acquired target and one specific patient feature.
          TRPS1 is among the genes the mutant miR-140-5p seed acquires as targets, and heterozygous TRPS1
          loss of function causes trichorhinophalangeal syndrome, whose diagnostic radiographic finding
          is cone-shaped epiphyses - which is also one of the radiological hallmarks of this disorder.
          If the mutant microRNA represses TRPS1 in patient chondrocytes, that would be a single-target
          explanation for a phenotype that otherwise has to be attributed to a diffuse transcriptional
          shift.

          It is recorded as EMERGING rather than curated as an established edge because the founding paper
          names Trps1 in a list of acquired targets and does not attribute any patient feature to it.
          Nobody has measured TRPS1 in a miR-140 mutant chondrocyte, in a patient, or in a reporter assay
          against the TRPS1 3-prime UTR, and no epistasis experiment has been done. The two disorders
          also differ in almost everything else: trichorhinophalangeal syndrome has sparse hair, dystrophic
          nails and a distinctive nose, none of which is reported here, so if the bridge holds it is partial
          rather than a shared mechanism.'
      selected_evidence:
        snippet: The miR-140-5p-G targets include many genes important for skeletal development and homeostasis,
          including Loxl3, Btg1, and Trps1, and genes associated with various metabolic pathways
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
