          processing is unaffected, and ModifierEnum has no value for "unchanged" - INCREASED, DECREASED,
          ABNORMAL and DYSREGULATED would each assert a change that the cited measurement specifically
          did not find. The negative is the point, so it is carried by the description and the evidence
          rather than by a modifier.
      selected_evidence:
        snippet: These data indicate that the A>G mutation did not compromise miRNA processing and yielded
          abundant expression of miR-140-5p-G from primary miR-140 transcripts of which transcription
