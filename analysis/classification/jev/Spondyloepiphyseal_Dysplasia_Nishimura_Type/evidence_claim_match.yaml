  ab7026bd5cfb82e3c22cbf6ec64fc25261aa92c93c31a97823bbbb375640a18a:
    claim:
      about:
        disease:
          name: Spondyloepiphyseal Dysplasia, Nishimura Type
          disease_term:
            preferred_term: spondyloepiphyseal dysplasia, Nishimura type
            term:
              id: MONDO:0032835
              label: spondyloepiphyseal dysplasia, nishimura type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MIR140 Seed-Region Point Mutation
        biological_scale: MOLECULAR
        description: A single-nucleotide substitution, NR_029681.1:n.24A>G (chr16:g.69967007A>G, hg19),
          at the first nucleotide of the seed of mature miR-140-5p. The seed is what selects a microRNA's
          target set, so a substitution there changes which transcripts miR-140-5p recognises. The same
          substitution is present in all three reported patients from two unrelated families, is absent
          from gnomAD, and the affected nucleotide is conserved from human to Australian ghostshark.
        genes:
        - preferred_term: MIR140
          term:
            id: hgnc:31527
            label: MIR140
        genetic_context:
          genes:
          - preferred_term: MIR140
            term:
              id: hgnc:31527
              label: MIR140
          allele_type: single-nucleotide substitution at the first seed nucleotide of the mature miR-140-5p
            strand
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: NEOMORPHIC
          description: Carriers are heterozygous. The variant arose de novo in the probands of both families
            and was transmitted once, mother to son.
          notes: On the choice of NEOMORPHIC, and how it differs from the sibling miRNA entry. The other
            microRNA disease in this knowledge base, Autosomal_Dominant_Nonsyndromic_Hearing_Loss_50 (MIR96),
            deliberately leaves functional_impact_category absent, on the ground that a seed mutation
            is simultaneously hypomorphic for the wild-type target set and neomorphic for an acquired
            one and that no single-valued category says both. The biology is the same here. The reason
            the value is set anyway is that the mouse genetics assigns the disease-defining features to
            the acquired half in a way the MIR96 work does not. The miR-140-null mouse is not phenotypically
            silent - it is smaller with a shorter nose - but it does not have the delayed secondary ossification,
            the widened basal skull growth plate or the expanded resting zone that the knock-in mouse
            and the patients have, and the founding authors state in those words that the substitution
            is "neomorphic, and not just loss-of-function". NEOMORPHIC in Muller's sense names an allele
            with a new activity and does not deny that the old one is also impaired; the impaired half
            is curated as its own node, "Loss of Repression of Wild-Type miR-140-5p Targets", with its
            own evidence. What the single value cannot record is that the shared short stature and craniofacial
            features track the abandoned half while the epiphyseal features track the acquired one, and
            that is stated here rather than left to be inferred.
      selected_evidence:
        snippet: Whole genome sequencing (WGS) identified the same heterozygous nucleotide substitution
          (chr16:g.69967007A>G (hg19), MIR140:NR_029681.1:n.24A>G) in P1 and P2
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30804514
      reference_title: Gain-of-function mutation of microRNA-140 in human skeletal dysplasia.
      evidence_source: HUMAN_CLINICAL
      explanation: The variant itself, in both coordinate systems, and the fact that it recurs.
