      assertion_type: Pathophysiology
      assertion:
        name: Impaired Mesenchymal Condensation and Chondrogenesis
        biological_scale: CELLULAR
        description: 'Mesenchymal condensation is the first committed step of skeletogenesis, and it fails
          in FN1-mutant cells. The proximate reason appears to be a shortfall of TGF-beta-1, which mutant
          cells express at significantly lower levels and which condensation requires. The finding is
          reversible in vitro: supplying either exogenous fibronectin or TGF-beta-1 restores condensation
          and promotes chondrogenesis, which makes this the first identified point of pharmacological
          leverage in the disorder.'
        cell_types:
        - preferred_term: mesenchymal stem cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: transforming growth factor beta receptor signaling pathway
          modifier: DECREASED
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
        - preferred_term: chondrocyte differentiation
          modifier: DECREASED
          term:
            id: GO:0002062
            label: chondrocyte differentiation
      selected_evidence:
        snippet: Moreover, FN mutant cells exhibited significantly lower transforming growth factor beta-1
          (TGFβ1) expression, crucial for mesenchymal condensation.
        supports: SUPPORT
