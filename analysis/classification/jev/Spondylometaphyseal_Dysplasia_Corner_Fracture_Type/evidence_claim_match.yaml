          name: Spondylometaphyseal Dysplasia Corner Fracture Type
          disease_term:
            preferred_term: spondylometaphyseal dysplasia, corner fracture type
            term:
              id: MONDO:0008479
              label: spondylometaphyseal dysplasia, 'corner fracture' type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: smdcf_dominant_negative_versus_haploinsufficiency
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Deficient Extracellular Matrix Assembly in Cartilage and Bone
        prompt: Does the retained mutant fibronectin act by simple haploinsufficiency, or does it interfere
          with the wild-type protein or with the secretory pathway itself?
        rationale: 'Partly answered since this entry was first written, and worth stating precisely how
          far. A 2024 patient-derived iPSC study shows the mechanism has two arms, not one: extracellular
          fibronectin is reduced — in patient plasma as well as in culture — and the retained mutant protein
          simultaneously accumulates with ER chaperones in uncleared cytosolic vesicles, raising cellular
          stress markers and distorting mitochondrial structure. That intracellular arm is a gain of toxic
          consequence and cannot be produced by a null allele, which argues against simple haploinsufficiency;
          the allelic spectrum, almost uniformly cysteine substitutions in one small region, points the
          same way. What remains untested is the decisive comparison: no study has put a truncating and
          a missense FN1 allele side by side in the same cell background. Until that is done the relative
          contribution of the two arms is unknown, and it is exactly what decides whether therapy should
          aim to raise wild-type output or to clear the retained mutant. Note that the rescue result —
          exogenous fibronectin or TGF-beta-1 restoring condensation — works through the extracellular
          arm and does not settle the question.'
        proposed_experiments:
        - experiment_id: exp_smdcf_allelic_mechanism
          name: Compare null and missense FN1 alleles in a skeletal cell model
          description: Introduce a representative cysteine-substituting missense allele and a truncating
            allele heterozygously into human iPSC-derived chondrocytes and osteoblasts, and compare extracellular
            fibronectin matrix assembly, wild-type allele secretion, and endoplasmic reticulum stress
            markers against isogenic controls.
          would_support:
          - pathophysiology#Intracellular Retention and Failed Fibronectin Secretion
          supporting_outcome:
          - Impaired matrix assembly and reduced wild-type secretion in the missense line but not in the
            truncating line would establish a dominant-negative or retention-driven mechanism rather than
            dosage.
          would_refute:
          - pathophysiology#Intracellular Retention and Failed Fibronectin Secretion
          refuting_outcome:
          - Equivalent matrix phenotypes from missense and truncating alleles would reduce the mechanism
            to haploinsufficiency and make the cysteine clustering an ascertainment artefact.
      selected_evidence:
        snippet: All individuals shared a substitution of a cysteine residue, disrupting disulfide bonds
          in the FN type-I assembly domains located in the N-terminal assembly region.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
