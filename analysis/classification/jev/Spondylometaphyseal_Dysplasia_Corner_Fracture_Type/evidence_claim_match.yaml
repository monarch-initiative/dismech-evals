        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: smdcf_entity_boundaries_col2a1_and_mcd_brussels
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - disease#Spondylometaphyseal Dysplasia Corner Fracture Type
        prompt: Is "SMD corner fracture type" one disorder, and where do the COL2A1-linked cases and metaphyseal
          chondrodysplasia Brussels type belong?
        rationale: 'The entity was defined radiographically decades before any gene was known, and the
          label has since accumulated cases attributed to FN1 and to COL2A1 — the latter not including
          the original Sutcliffe family. A separate report asks outright whether metaphyseal chondrodysplasia
          Brussels type and FN1-related SMD are the same disorder. The ISDS nosology and MONDO both encode
          the unresolved state rather than settling it: the nosology lists MIM 184255 in both the SMD
          group and the type 2 collagen group, and MONDO gives the class two parents. Any downstream analysis
          that treats this concept as a single gene-defined disease will be wrong about some of its members.'
        proposed_experiments:
        - experiment_id: exp_smdcf_genotype_stratified_radiographic_review
          name: Genotype-stratified radiographic review of the corner-fracture cohort
          description: Assemble the published and unpublished corner-fracture cases with molecular results,
            blind expert radiologists to genotype, and test whether FN1, COL2A1, and unsolved cases separate
            on radiographic criteria — including the Brussels-type cases.
          would_support:
          - disease#Spondylometaphyseal Dysplasia Corner Fracture Type
          supporting_outcome:
          - Reliable blinded radiographic separation of FN1 from COL2A1 cases would justify splitting
            the concept into gene-defined entities and retiring the shared MIM number.
          would_refute:
          - disease#Spondylometaphyseal Dysplasia Corner Fracture Type
          refuting_outcome:
          - Failure to separate them radiographically would support keeping a single radiographically
            defined entity with genetic heterogeneity, as the nosology and MONDO currently do.
      selected_evidence:
        snippet: The severe scoliosis in most individuals and rare developmental coxa vara distinguish
          individuals with FN1 mutations from those with classical Sutcliffe-type SMD.
        supports: SUPPORT
    origin:
