      assertion_type: Genetic
      assertion:
        name: Heterozygous FN1 Missense Variants in the N-Terminal Assembly Region
        gene_term:
          preferred_term: FN1
          term:
            id: hgnc:3778
            label: FN1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Pathogenic alleles are heterozygous missense variants affecting highly conserved residues
          in the N-terminal 70 kDa assembly region of fibronectin. They are strikingly stereotyped: p.Cys123Tyr,
          p.Cys169Tyr, p.Cys213Tyr, p.Cys225Trp, p.Cys231Trp, p.Cys258Tyr, p.Cys260Gly, and p.Cys87Phe
          all substitute a cysteine and so break a disulfide bond in a fibronectin type-I assembly domain.
          p.Tyr240Asp is the reported exception to the cysteine rule while remaining in the same region.'
      selected_evidence:
        snippet: All individuals shared a substitution of a cysteine residue, disrupting disulfide bonds
          in the FN type-I assembly domains located in the N-terminal assembly region.
        supports: SUPPORT
