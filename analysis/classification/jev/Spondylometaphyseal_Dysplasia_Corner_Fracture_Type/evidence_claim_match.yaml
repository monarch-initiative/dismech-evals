            label: X-Ray Imaging
        description: The diagnosis begins with recognising that the metaphyseal "corner fractures" are
          ossification abnormalities and not injuries. The classic metaphyseal lesion of physical abuse
          has the same distribution — distal tibia, distal radius, proximal humerus and femur — so a skeletal
