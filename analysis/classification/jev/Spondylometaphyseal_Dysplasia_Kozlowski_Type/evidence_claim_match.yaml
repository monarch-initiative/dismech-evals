      assertion_type: Discussion
      assertion:
        discussion_id: disc_smdk_trpv4_spectrum_lof_boundary
        prompt: How should SMDK be bounded within the overlapping TRPV4 skeletal dysplasia continuum when
          most cases show gain-of-function channel activation but a single recent case supports loss-of-function
          TRPV4 activity?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#TRPV4 Gain-of-Function Channel Activation
        - pathophysiology#TRPV4 Loss-of-Function Channel Impairment
        - diagnosis#TRPV4 Spectrum Differential Diagnosis
        rationale: SMDK overlaps clinically and radiographically with brachyolmia and metatropic dysplasia,
          and the p.W785S report shows that a loss-of-function mechanism can produce an SMDK diagnosis.
          The single-case LOF evidence should therefore be modeled as an alternative mechanism requiring
          cautious interpretation, not as replacement of the usual gain-of-function model.
      selected_evidence:
        snippet: Our data suggest the TRPV4 skeletal dysplasias represent a continuum of severity with
          areas of phenotypic overlap, even within the same family.
        supports: SUPPORT
