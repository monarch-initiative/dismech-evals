        name: TRPV4 Spectrum Differential Diagnosis
        description: Diagnostic interpretation should explicitly consider the TRPV4 skeletal dysplasia
          continuum. Brachyolmia, SMDK, spondyloepimetaphyseal dysplasia Maroteaux type, and metatropic
          dysplasia share short stature, platyspondyly, scoliosis, and metaphyseal or pelvic involvement.
          When TRPV4 testing is negative or clinical features are atypical, adjacent skeletal dysplasia
          differentials include type II collagenopathies such as SED congenita, Morquio-spectrum mucopolysaccharidoses,
          and TRAPPC2-related X-linked spondyloepiphyseal dysplasia tarda.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: Autosomal dominant brachyolmia, spondylometaphyseal dysplasia Kozlowski type (SMDK) and
          metatropic dysplasia (MD) are currently considered three distinct skeletal dysplasias with some
          shared clinical features, including short stature, platyspondyly, and progressive scoliosis.
        supports: SUPPORT
