        context: []
      assertion_type: Genetic
      assertion:
        name: Biallelic PCYT1A Variants
        gene_term:
          preferred_term: PCYT1A
          term:
            id: hgnc:8754
            label: PCYT1A
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: PCYT1A encodes CCT-alpha, which has a catalytic domain, an amphipathic membrane-binding
          domain, a signal-transducing linker between them, and an autoinhibitory helix. Disease alleles
          fall in all of these. Missense variants in the catalytic core (V142M, P150A) produce aggregated
          enzyme that cannot be refolded; five variants lower the unfolding transition temperature of
          the catalytic domain and three of those alter substrate Km; R223S sits in the regulatory linker;
          and E280del removes a single residue from the autoinhibitory helix. Allele class therefore does
          not reduce to a single loss-of-function statement.
      selected_evidence:
        snippet: Over-expression of two missense variants in the catalytic domain (V142M and P150A) generated
          aggregated enzymes that could not be refolded after solubilization by denaturation.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
