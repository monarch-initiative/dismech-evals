      reference: PMID:30559292
      reference_title: Disease-linked mutations in the phosphatidylcholine regulatory enzyme CCTα impair
        enzymatic activity and fold stability.
      evidence_source: IN_VITRO
      explanation: Establishes protein aggregation as one distinct allele class.
