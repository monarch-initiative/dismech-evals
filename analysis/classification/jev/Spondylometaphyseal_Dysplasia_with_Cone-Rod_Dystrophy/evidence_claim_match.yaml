      assertion_type: Discussion
      assertion:
        discussion_id: pcyt1a_tissue_selectivity
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Deficient Phosphatidylcholine Synthesis
        prompt: Why do PCYT1A variants produce three phenotypes — skeletal plus retinal, lipodystrophic,
          or retinal alone — when phosphatidylcholine is required by every cell?
        rationale: 'This is the central unexplained fact about the gene. Phosphatidylcholine is the main
          glycerophospholipid of all cellular membranes, yet PCYT1A disease strikes growth plate, retina,
          and adipose tissue in combinations that do not obviously nest inside one another: isolated retinal
          dystrophy occurs with a normal whole-skeleton survey, and lipodystrophy occurs with no retinal
          involvement at all. Enzymology complicates rather than resolves it, since the allele classes
          are heterogeneous — aggregation, fold destabilisation, altered Km, a linker defect, and one
          allele that increases constitutive activity — and no mapping from allele class to organ pattern
          has been proposed. Without that mapping, a PCYT1A genotype cannot be used to predict which organs
          will be affected, which is a live clinical problem and not only a mechanistic curiosity.'
        proposed_experiments:
        - experiment_id: exp_pcyt1a_allele_class_to_organ_mapping
          name: Map allele class to organ phenotype across the PCYT1A spectrum
          description: Assemble reported PCYT1A patients with genotype and full organ phenotyping, and
            test whether the biochemically defined allele classes — aggregating, fold-destabilising, kinetically
            impaired, linker, autoinhibitory-helix — predict skeletal, retinal, or adipose involvement.
            Complement with phosphatidylcholine flux measurement in patient-derived chondrocytes, retinal
            organoids, and adipocytes carrying matched genotypes.
          would_support:
          - pathophysiology#Deficient Phosphatidylcholine Synthesis
          supporting_outcome:
          - A consistent relationship between allele class and organ pattern, with flux deficits tracking
            the affected tissue, would establish reduced phosphatidylcholine synthesis as the operative
            mechanism and give a genotype-based prediction.
          would_refute:
          - pathophysiology#Deficient Phosphatidylcholine Synthesis
          refuting_outcome:
          - Equivalent phosphatidylcholine flux across affected and spared tissues from the same patient
            would move the mechanism away from bulk synthesis towards a localised or moonlighting function
            of CCT-alpha.
      selected_evidence:
        snippet: This is the first report showing that the PCYT1A gene can be responsible for isolated
          forms of retinal dystrophy, particularly without any skeletal involvement, thus further expanding
          the phenotypic spectrum induced by mutations in this gene.
        supports: SUPPORT
