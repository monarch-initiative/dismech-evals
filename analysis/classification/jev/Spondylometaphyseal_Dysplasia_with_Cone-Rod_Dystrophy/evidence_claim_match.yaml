  96085e29e30030c793beb3ac3d7a175ec860daa70b41d7f0275daf82a2d0cbc6:
    claim:
      about:
        disease:
          name: Spondylometaphyseal Dysplasia with Cone-Rod Dystrophy
          disease_term:
            preferred_term: spondylometaphyseal dysplasia with cone-rod dystrophy
            term:
              id: MONDO:0012160
              label: spondylometaphyseal dysplasia-cone-rod dystrophy syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pcyt1a_no_model_of_the_growth_plate_lesion
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Growth-Plate Failure with Metaphyseal and Vertebral Change
        prompt: By what route does reduced phosphatidylcholine synthesis disorder the growth plate?
        rationale: 'This gap got wider, not narrower, when the retinal branch was worked out. The intuitive
          rationale for both branches was bulk membrane supply — outer segments are membrane-dense and
          continuously renewed, growth-plate chondrocytes are proliferative. A 2024 retina-specific Pcyt1a
          knockout removed that rationale for the retina: phosphatidylcholine synthesis was not reduced
          overall, the lesion ran through free fatty acid metabolism and ferroptosis, and the enzyme turned
          out to sit in Mueller glia rather than in the dying photoreceptors. If the retinal branch does
          not work by bulk supply, there is no longer any reason to assume the skeletal one does. Nothing
          comparable has been done in cartilage, and the disorder''s skeletal lesion is specifically metaphyseal
          and vertebral rather than a generalised bone abnormality, which a membrane-supply deficit never
          predicted well. The step from the metabolic defect to the growth plate remains the largest hole
          in the mechanism, and the retinal result suggests it needs a lipid-species answer rather than
          a lipid-quantity one.'
        proposed_experiments:
        - experiment_id: exp_pcyt1a_chondrocyte_lipidomics
          name: Lipidomic and differentiation phenotyping of PCYT1A-mutant chondrocytes
          description: Differentiate patient iPSCs carrying SMD-CRD genotypes into growth-plate-like chondrocytes,
            and measure membrane phospholipid composition, secretory capacity, hypertrophic differentiation,
            and matrix output against isogenic corrected controls, with and without exogenous phosphatidylcholine
            or choline supplementation.
          would_support:
          - pathophysiology#Growth-Plate Failure with Metaphyseal and Vertebral Change
          supporting_outcome:
          - A chondrocyte differentiation or secretion defect that is rescued by restoring phosphatidylcholine
            would close the gap between the metabolic lesion and the growth plate, and would nominate
            choline supplementation as a candidate intervention. Given the retinal result, the assay should
            measure individual lipid species and ferroptosis markers, not only bulk phosphatidylcholine.
          would_refute:
          - pathophysiology#Deficient Phosphatidylcholine Synthesis
          refuting_outcome:
          - A chondrocyte phenotype that is not rescued by phosphatidylcholine repletion would indicate
            the growth-plate lesion does not run through bulk phosphatidylcholine supply.
      selected_evidence:
        snippet: further studies are necessary to uncover its precise pathogenic mechanisms and the entirety
          of its phenotypic spectrum
        supports: SUPPORT
