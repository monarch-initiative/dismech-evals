      assertion_type: Pathophysiology
      assertion:
        name: Retinal Fatty-Acid Dysregulation and Ferroptosis in Mueller Glia
        biological_scale: CELLULAR
        description: In the retina, PCYT1A is expressed mainly in Mueller glial cells of the inner nuclear
          layer, not in the photoreceptors that die. Retina-specific Pcyt1a knockout produces reduced
          scotopic electroretinogram responses and progressive photoreceptor degeneration together with
          loss of inner-nuclear-layer cells, and proteomics implicates dysregulated fatty acid metabolism
          and activation of ferroptosis rather than a shortfall of phosphatidylcholine. The photoreceptor
          loss is therefore non-cell-autonomous on this evidence — a Mueller glial lesion that photoreceptors
          do not survive.
        cell_types:
        - preferred_term: Mueller cell
          term:
            id: CL:0000636
            label: Mueller cell
        biological_processes:
        - preferred_term: fatty acid metabolic process
          modifier: ABNORMAL
