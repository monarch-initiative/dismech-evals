            id: GO:0006631
            label: fatty acid metabolic process
        - preferred_term: ferroptosis
          modifier: INCREASED
          term:
            id: GO:0097707
            label: ferroptosis
      selected_evidence:
        snippet: Instead, this deficiency appeared to disrupt free fatty acid metabolism and ultimately
          trigger ferroptosis.
        supports: SUPPORT
