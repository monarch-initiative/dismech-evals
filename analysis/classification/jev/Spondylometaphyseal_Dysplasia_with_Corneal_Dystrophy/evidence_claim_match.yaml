      assertion:
        name: Homozygous PLCB3 c.2632G>T (p.Ala878Ser)
        gene_term:
          preferred_term: PLCB3
          term:
            id: hgnc:9056
            label: PLCB3
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: A single homozygous missense allele, PLCB3 NM_000932.2:c.2632G>T (p.Ala878Ser), at 11q13.
          The substituted alanine is highly conserved at both DNA and protein level across vertebrates
          and affects all three coding isoforms of PLCB3. The variant is absent from 200 ethnically matched
          control chromosomes and from dbSNP and EVS, with a heterozygous minor allele frequency of 1.824e-05
          in ExAC. Structural modelling on the Gq-alpha-PLCbeta3 complex places it in the Ha2' element
          of the proximal C-terminal domain.
      selected_evidence:
        snippet: The identified variant (c.2632G>T) substitutes a serine for a highly conserved alanine
          within the Ha2' element of the proximal C-terminal domain.
        supports: SUPPORT
