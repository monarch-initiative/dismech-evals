          and coarse metaphyseal trabeculae, cupping of the distal radius and ulna, uncalcified distal
          femoral and proximal tibial epiphyses in the neonate, short ribs with a wide anterior aspect,
          anterior beaking of the lumbar and thoracic vertebrae with wide intervertebral spaces, and almost
          square, short iliac bones with medial projections. The iliac shape was close enough to Schneckenbecken
          dysplasia that SLC35D1 was sequenced and excluded before the locus was mapped.
