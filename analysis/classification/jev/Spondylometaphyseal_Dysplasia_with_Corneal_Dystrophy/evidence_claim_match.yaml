  5259a829132aaabd2bdfcc8b33e5538c82c49b358c2cd3819bdee5fecf4b9625:
    claim:
      about:
        disease:
          name: Spondylometaphyseal Dysplasia with Corneal Dystrophy
          disease_term:
            preferred_term: spondylometaphyseal dysplasia with corneal dystrophy
            term:
              id: MONDO:0030074
              label: spondylometaphyseal dysplasia with corneal dystrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: smdcd_actin_to_organ_lesion_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#F-Actin Cytoskeletal Disorganisation
        prompt: How does a fibroblast actin phenotype account for a growth-plate dysplasia, a corneal
          opacity, and severe developmental delay?
        rationale: 'The mechanism is demonstrated as far as the fibroblast and stops there. Three distinct
          organ lesions are attributed to it, in tissues that were never assayed. Zebrafish plcb3 nulls
          give some support for the skeletal branch, but mouse Plcb3 disruption is embryonic lethal and
          further knockout models gave discordant results that the authors attribute to how the gene was
          disrupted — so there is no settled animal model either. The corneal branch is the weakest: nothing
          connects phosphoinositide signalling to corneal stromal transparency, and the opacity is present
          within days of birth, implying a developmental rather than a degenerative process.'
        proposed_experiments:
        - experiment_id: exp_smdcd_hypomorphic_knockin_and_tissue_models
          name: Hypomorphic Plcb3 knock-in and human tissue-specific models
          description: Generate a knock-in carrying the human p.A878S hypomorph rather than a null, so
            that animals survive, and phenotype the growth plate, cornea, and brain. Complement with patient
            iPSC-derived chondrocytes and corneal keratocytes assayed for PIP2, actin organisation, and
            tissue-specific differentiation.
          would_support:
          - pathophysiology#Corneal Dystrophy
          supporting_outcome:
          - Corneal opacity and a spondylometaphyseal skeletal phenotype in hypomorphic animals would
            establish that the single allele accounts for the organ lesions.
          would_refute:
          - pathophysiology#F-Actin Cytoskeletal Disorganisation
          refuting_outcome:
          - Normal actin organisation in patient-derived chondrocytes and keratocytes despite the skeletal
            and corneal phenotypes would show the fibroblast actin finding is not the operative mechanism
            in the affected tissues.
      selected_evidence:
        snippet: However, further Plcb3 knockout models showed discordant results.
        supports: SUPPORT
        directness: INDIRECT
