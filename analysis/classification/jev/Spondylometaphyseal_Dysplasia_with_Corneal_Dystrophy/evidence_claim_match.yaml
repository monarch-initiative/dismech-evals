            term:
              id: MONDO:0030074
              label: spondylometaphyseal dysplasia with corneal dystrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: smdcd_single_family_evidence_base
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - disease#Spondylometaphyseal Dysplasia with Corneal Dystrophy
        prompt: Is SMDCD an established gene-disease relationship, given that it rests on one homozygous
          missense allele in two cousins from a single family?
        rationale: Every clinical and molecular statement about this disorder comes from one report of
          one consanguineous pedigree. The linkage interval spanned 19.3 Mb and 487 genes, and four homozygous
          candidate variants survived filtering; PLCB3 was selected partly on the prior that phospholipid-metabolism
          genes such as PLCB4 and PCYT1A cause bone dysplasia, and the three competitors were excluded
          by functional assays rather than by independent genetic replication. The functional work is
          good, but no second family has been published, so the relationship has not been replicated in
          the way a gene-disease assertion normally requires. The ISDS nosology nonetheless lists it as
          a distinct entity, which this entry follows while recording the limitation.
        proposed_experiments:
        - experiment_id: exp_smdcd_independent_replication
          name: Seek independent PLCB3 families through matchmaking
          description: Submit the PLCB3 phenotype to GeneMatcher and equivalent matchmaking services and
            to skeletal dysplasia consortia, and reanalyse unsolved neonatal corneal-clouding-plus-skeletal-dysplasia
            exomes for biallelic PLCB3 variants.
          would_support:
          - pathophysiology#Homozygous PLCB3 p.Ala878Ser
          supporting_outcome:
          - A second unrelated family with biallelic PLCB3 variants and a matching phenotype would convert
            the assertion from single-family to replicated.
          would_refute:
          - pathophysiology#Homozygous PLCB3 p.Ala878Ser
          refuting_outcome:
          - Identification of a pathogenic variant in one of the other candidate genes in the interval
            in a second family with the same phenotype would reopen the gene assignment.
      selected_evidence:
        snippet: Whole genome homozygosity mapping localised the genetic cause to 11q12.1-q13.1, a region
          spanning 19.32 Mb with ~490 genes.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
