        description: T183A abolishes a hydrogen bond between Y162 (beta-strand S2) and T183 (alpha-helix
          H3) that, in the wild-type protein, is a gatekeeper interaction stabilizing the packing between
          the S1-H1-S2 and H2-H3 subdomains. Its loss produces the strongest native-state destabilization
          of any TSE-associated PrP variant - a melting-temperature drop of roughly 26-28 degrees C -
          and populates a misfolding-prone intermediate.
        biological_processes:
        - preferred_term: protein destabilization
          term:
            id: GO:0031648
            label: protein destabilization
          modifier: INCREASED
      selected_evidence:
        snippet: Differential scanning fluorimetry (DSF) revealed that T183A strongly destabilizes this
          huPrPC domain, resulting in a reduction of 28 °C in the melting temperature (Tm, Fig. 1A and
          SI Appendix, Table S1).
        supports: SUPPORT
