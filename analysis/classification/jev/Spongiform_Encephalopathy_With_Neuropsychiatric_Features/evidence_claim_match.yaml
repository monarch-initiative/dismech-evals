      assertion_type: Genetic
      assertion:
        name: PRNP T183A
        gene_term:
          preferred_term: PRNP
          term:
            id: hgnc:9449
            label: PRNP
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'Causal variant is a heterozygous germline nonconservative missense substitution at codon
          183 of PRNP (threonine to alanine, T183A), first reported in a Brazilian kindred (Nitrini 1997)
          and independently confirmed as disease-causing in a second (German) patient (Grasbon-Frodl 2004).
          It is a gain-of-toxic-function lesion rather than a loss-of-function: it does not abolish PrP
          but renders the protein misfolding-prone. The substitution simultaneously removes one of PrP''s
          two N-glycosylation sequons and abolishes the Y162-T183 gatekeeper hydrogen bond.'
      selected_evidence:
        snippet: A novel prion protein gene mutation causing a nonconservative substitution at codon 183
          was identified in 2 neuropathologically confirmed affected individuals (mother and son).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
