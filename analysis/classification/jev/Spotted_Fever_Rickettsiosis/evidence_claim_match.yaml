          tick-bite fever to frequently fatal Rocky Mountain spotted fever. That gradient tracks how strongly
          the particular species drives interleukin-8 and adhesion-molecule expression in endothelium
          and how much endothelial barrier failure and cell death follow: R. conorii elicits a markedly
          stronger response in vitro and in patients than R. africae does, and the Israeli spotted fever
          strain of R. conorii collapses endothelial monolayer resistance where the mild pathogen R. massiliae
          does not.'
