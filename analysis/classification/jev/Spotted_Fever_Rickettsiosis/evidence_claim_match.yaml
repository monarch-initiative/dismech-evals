              label: spotted fever
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Group-specific serology and the species-level limit
        description: Serology is the mainstay of confirmation for the whole group, and it is group-specific
          rather than species-specific. The immunodominant response is against spotted fever group lipopolysaccharide,
          which is shared, rather than against the OmpA and OmpB outer-membrane proteins that carry the
          species-specific epitopes. A reactive R. rickettsii titre therefore establishes infection with
          an SFG rickettsia, not with R. rickettsii — which is why species assignment needs cross-adsorption,
          Western blot, PCR or culture, and why the individual member diseases are so often reported as
          an undifferentiated "spotted fever group rickettsiosis". This is a claim about the group as
          a whole and has no home on any member entry.
        diagnosis_term:
          preferred_term: serologic testing
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
      selected_evidence:
        snippet: Cross-reactive immune responses to rickettsial antigens result in antibodies that are
          typically group-specific, although perhaps not species-specific, for tickborne rickettsial pathogens
        supports: SUPPORT
