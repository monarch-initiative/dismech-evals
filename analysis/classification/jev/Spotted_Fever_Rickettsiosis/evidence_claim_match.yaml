  b2d559cdb47bd0e2ab21fcf93b560427b0c17d8147dd3dfac6d53f0c97864796:
    claim:
      about:
        disease:
          name: Spotted fever rickettsiosis
          disease_term:
            preferred_term: spotted fever
            term:
              id: MONDO:0001195
              label: spotted fever
        context: []
      assertion_type: Treatment
      assertion:
        name: Empiric doxycycline for all patients of all ages
        action_category: THERAPEUTIC
        description: 'One recommendation covers the entire group: doxycycline, started immediately on
          clinical suspicion, in patients of every age including children under eight. This is a genuinely
          group-level rule — it does not depend on which SFG species is involved, and it is made before
          the species (or often even the group) is known, which is what makes it a root-level claim rather
          than a per-member one. Its two mechanistic legs are the shared rickettsial ribosome and the
          shared cytosolic niche, both modelled above. The historical reluctance to give doxycycline to
          young children has been overturned: the concern derived from older tetracyclines that bind calcium
          more readily, and a CDC cohort of 58 children given short courses before age eight showed no
          dental staining, no enamel hypoplasia and no difference in tooth shade against 213 unexposed
          controls. Per-member specifics — the day-5 mortality window in RMSF, the sulfonamide contraindication,
          macrolide alternatives in pregnancy — are curated on the member entries.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: doxycycline
            term:
              id: CHEBI:50845
              label: doxycycline
      selected_evidence:
        snippet: Doxycycline is the drug of choice for treatment of all tickborne rickettsial diseases
          in patients of all ages, including children aged <8 years
        supports: SUPPORT
