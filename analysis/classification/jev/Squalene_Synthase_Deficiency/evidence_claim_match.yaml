    evidence_metadata:
      reference: PMID:36180924
      reference_title: 'Sequencing individual genomes with recurrent genomic disorder deletions: an approach
        to characterize genes for autosomal recessive rare disease traits.'
      evidence_source: COMPUTATIONAL
      explanation: A population-genetic model places FDFT1 inside the recurrent 8p23.1 NAHR deletion and
        predicts that this deletion is the leading contributor to SQSD burden, carried by about 55 percent
        of affected individuals (Table 2, column "Top 3 allele contribution to disease"). This is a modeled
        estimate from population allele frequencies, not an observed patient series, but it argues for
        copy-number analysis alongside sequencing.
