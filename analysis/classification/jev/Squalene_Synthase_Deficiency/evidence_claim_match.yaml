        context: []
      assertion_type: Genetic
      assertion:
        name: FDFT1
        gene_term:
          preferred_term: FDFT1
          term:
            id: hgnc:3629
            label: FDFT1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Biallelic germline variants cause SQSD. Somatic biallelic inactivation and promoter hypermethylation
          of FDFT1 in skin cause forms of porokeratosis, a separate disease curated in Porokeratosis;
          that association is not part of this entry. FDFT1 lies in the 8p23.1 interval affected by a
          recurrent NAHR-mediated deletion; a population-genetic model (PMID:36180924) predicts this deletion
          to be a common SQSD allele, so chromosomal microarray or genome sequencing can find an allele
          that exome sequencing misses. No ClinGen gene-disease validity assertion for FDFT1 was found
          in the committed ClinGen export (`grep -i FDFT1 cache/clingen/gene_validity.csv` returns nothing).
      selected_evidence:
        snippet: FDFT1 | Squalene synthase deficiency, MIM# 618156 | 8p23.1 | 9.495x10-6 | 5.1 | 55, 53,
          53 | 38 | 2.52x10-5
        supports: SUPPORT
