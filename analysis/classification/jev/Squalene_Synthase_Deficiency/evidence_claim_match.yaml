          with a squalene synthase inhibitor this is the major fate of the diverted carbon, and the urinary
          profile it produces is the biochemical signature of the human disease. In inhibitor-treated
          mice farnesol formation was not detected, which the authors read as rapid onward conversion
          to farnesoic acid and dicarboxylic acids in the liver, so the measurable products are the acids
          and conjugates rather than farnesol itself.
