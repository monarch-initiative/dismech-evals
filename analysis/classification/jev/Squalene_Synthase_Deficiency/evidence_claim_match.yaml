      assertion:
        name: Fdft1 null mouse
        species: Mouse
        genotype: Fdft1(-/-)
        publication: PMID:10521476
        description: Constitutive squalene synthase knockout. Heterozygotes are normal with unchanged
          hepatic cholesterol synthesis despite halved enzyme activity; homozygotes die around midgestation
          with growth retardation and defective neural tube closure, and neither maternal dietary squalene
          nor cholesterol rescues them.
        modeled_mechanisms:
        - target: Disrupted Cholesterol-Dependent Embryonic Development
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: Shows that endogenous squalene synthase activity is required for embryonic, particularly
            neural, development.
          limitations: Complete loss of the enzyme is embryonic lethal, whereas the human patients survive
            with partial-function alleles, so the model shows the severe extreme rather than the human
            malformation pattern.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: The authors attribute lethality partly to the immaturity of the murine chorioallantoic
              circulation at midgestation, a placental constraint that may not apply in the same way to
              the human embryo.
      selected_evidence:
        snippet: The lethal phenotype was not rescued by supplementing the dams either with dietary squalene
          or cholesterol.
        supports: SUPPORT
