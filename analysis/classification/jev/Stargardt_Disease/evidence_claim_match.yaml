      assertion:
        name: STGD1 iPSC-derived RPE disease-in-a-dish model
        description: 'Patient-derived induced pluripotent stem cell retinal pigment epithelium model revealing
          autofluorescent-material accumulation, lysosomal alkalinization, and cathepsin D dysfunction
          in STGD1.

          '
        experimental_model_type: IPSC_DERIVED_MODEL
        namo_type: namo:TwoDCellCulture
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        tissue_term:
          preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        conditions:
        - Stargardt disease
        - confirmed STGD1 patient-derived RPE
        cell_source: Patient-derived induced pluripotent stem cell retinal pigment epithelium
        culture_system: Two-dimensional disease-in-a-dish retinal pigment epithelium culture
        publication: PMID:38837708
        findings:
        - statement: STGD1 iPSC-RPE cultures show lysosomal dysfunction and impaired cathepsin D processing
            linked to ABCA4 deficiency
        modeled_mechanisms:
        - target: RPE endo-lysosomal dysfunction
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Patient-derived iPSC-RPE directly reproduces the elevated lysosomal pH and impaired
            cathepsin D maturation and activity that define this node; the node's own evidence is already
            built from this model.
          readouts:
          - name: Lysosomal pH elevation
            target: RPE endo-lysosomal dysfunction
            description: Lysosomal pH measured in iPSC-RPE from three STGD1 patients.
            direction: INCREASED
            interpretation: Elevated lysosomal pH is the proximal readout of the endo-lysosomal dysfunction
              node.
          - name: Cathepsin D protein maturation and activity
            target: RPE endo-lysosomal dysfunction
            description: Cathepsin D processing and enzymatic activity in patient iPSC-RPE.
            direction: DECREASED
            interpretation: Impaired cathepsin D maturation is the protease-level correlate of the endo-lysosomal
              dysfunction node.
          - name: Drug-mediated lysosomal re-acidification rescue
            target: RPE endo-lysosomal dysfunction
            description: Pharmacological re-acidification of iPSC-RPE lysosomes in the same disease-in-a-dish
              model.
            direction: RESTORED
            interpretation: Restoring cathepsin D function by re-acidifying the lysosome is a rescue arm
              that supports the lysosomal pH defect as causally upstream of the protease defect, rather
              than an incidental correlate.
        - target: Lipofuscin and A2E accumulation in RPE
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: The disease-in-a-dish RPE model shows intracellular autofluorescent material accumulation
            consistent with lipofuscin loading.
          limitations: The paper reports accumulation of autofluorescent material and phosphatidylethanolamine
            (PE), not A2E specifically, so this model supports the broader lipofuscin-loading claim but
            not the A2E bisretinoid identity asserted by this node's name.
        notes: 'Provides the main non-organoid NAMO bridge for Stargardt, complementing retinal organoid
          transcriptomic models.

          '
      selected_evidence:
        snippet: dysfunctional ABCA4 in STGD1 RPE cells results in intracellular accumulation of autofluorescent
          material and phosphatidylethanolamine (PE)
        supports: SUPPORT
