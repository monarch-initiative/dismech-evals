          and among patients who all carry p.Gly1961Glu the identity of the second allele shifts progression
          by decades in either direction.

          '
      selected_evidence:
        snippet: This gene, ABCR, is expressed exclusively and at high levels in the retina, in rod but
          not cone photoreceptors, as detected by in situ hybridization. Mutational analysis of ABCR in
          STGD families revealed a total of 19 different mutations including homozygous mutations in two
          families with consanguineous parentage. These data indicate that ABCR is the causal gene of
          STGD/FFM.
        supports: SUPPORT
