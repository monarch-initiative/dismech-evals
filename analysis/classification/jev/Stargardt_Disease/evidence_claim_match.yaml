        notes: 'Biallelic loss-of-function variants in ABCA4 cause classic autosomal recessive STGD1.
          Over 1,000 disease-associated variants have been reported, including missense, nonsense, splice-site,
          and complex alleles with genotype-phenotype correlation. The common p.Gly1961Glu variant is
          associated with a relatively milder phenotype in some cohorts, but that mildness is conditional
          in two ways: a cis-acting deep intronic modifier (c.769-784C>T) carried on roughly 15% of p.Gly1961Glu
