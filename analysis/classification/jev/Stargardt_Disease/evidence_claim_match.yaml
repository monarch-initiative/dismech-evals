        description: 'A splice-modulating antisense oligonucleotide is in preclinical development for
          the recurrent ABCA4 variant c.768G>T, which lies at the exon 6 splice junction and creates a
          35-nucleotide aberrant elongation of exon 6 that leads to premature protein termination. The
          lead 2''-O-methoxyethyl oligonucleotide (A7 21-mer) occludes the mutant splice site to restore
          normal ABCA4 splicing, offering a mutation-specific alternative to whole-gene replacement.

          '
        therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
