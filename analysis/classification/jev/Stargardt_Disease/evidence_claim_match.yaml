        description: 'Bioimaging dataset from NASA Rodent Research 9 (SpaceX CRS-12) comprising micro-computed
          tomography, H&E histology, peanut agglutinin (PNA) immunostaining of cone photoreceptors, and
          4-hydroxynonenal (4-HNE) oxidative stress immunofluorescence in retinas of C57BL/6 mice flown
          aboard the ISS for 35 days. Flight mice showed significant RPE and choroid thinning, cone photoreceptor
          degradation, and elevated lipid peroxidation markers, paralleling the oxidative RPE injury pathway
          in Stargardt disease.

          '
        organism:
          preferred_term: mouse
          term:
            id: NCBITaxon:10090
            label: Mus musculus
        data_type: MULTI_OMICS_PERTURBATION
        sample_types:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
          tissue_term:
            preferred_term: retina
            term:
              id: UBERON:0000966
              label: retina
        conditions:
        - spaceflight (35-day ISS mission)
        - ground control
        - vivarium control
        publication: PMID:31527661
        findings:
        - statement: Spaceflight causes RPE and choroid thinning with elevated oxidative stress markers
            in mouse retina, mirroring the RPE injury pathway in Stargardt disease.
        - statement: Spaceflight-induced retinal gene expression changes overlap with retinitis pigmentosa-associated
            genes, suggesting shared photoreceptor vulnerability pathways.
      selected_evidence:
        snippet: RNA sequencing detected 600 differentially expressed genes (DEGs) in murine spaceflight
          retinas, which were enriched for genes related to visual perception, the phototransduction pathway,
          and numerous retina and photoreceptor phenotype categories.
        supports: SUPPORT
