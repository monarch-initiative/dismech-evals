      - /disease_term
    evidence_metadata:
      reference: PMID:31527661
      reference_title: Spaceflight influences gene expression, photoreceptor integrity, and oxidative
        stress-related damage in the murine retina.
      evidence_source: MODEL_ORGANISM
      explanation: ISS-flown mouse retinas show RPE thinning and oxidative damage analogous to the RPE
