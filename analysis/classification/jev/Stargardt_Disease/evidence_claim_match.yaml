      assertion_type: Subtype
      assertion:
        name: Stargardt disease 5 (STGD5)
        description: 'The most recently delimited subtype, caused by biallelic RDH8 variants and distinguished
          from the other forms by its late onset: the proposita of the founding family showed early signs
          of maculopathy at 40 years of age, with visual acuity of 20/25 and electroretinograms of normal
          amplitude when evaluated at 62, rather than the juvenile central vision loss of STGD1. The evidence
          base is one consanguineous Italian family, which is the whole of the human literature on RDH8
          disease at the time of curation, so the row records the gene without claiming an established
          allelic series. RDH8 is the retinol dehydrogenase that reduces all-trans-retinal in photoreceptor
          outer segments, and this entry already cites Abca4-/-Rdh8-/- double-knockout mice in the canonical
          hypothesis notes; the human subtype places that mouse gene on the human side of the same visual-cycle
          step.

          '
        genes:
        - preferred_term: RDH8
          term:
            id: hgnc:14423
            label: RDH8
        subtype_term:
          preferred_term: Stargardt disease 5
          term:
            id: MONDO:0980722
            label: Stargardt disease 5
      selected_evidence:
        snippet: a biallelic mutation in the RDH8 gene was identified to be responsible for Stargardt
          macular dystrophy in a consanguineous Italian family
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/3
      evidence_path: /has_subtypes/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
