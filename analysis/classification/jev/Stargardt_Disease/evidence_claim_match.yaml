      assertion_type: Discussion
      assertion:
        discussion_id: stgd1_light_exposure_human_epidemiology_gap
        prompt: Does ambient or occupational light exposure modify the rate of progression in human STGD1,
          as the mouse models predict?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - environmental#Retinal light exposure
        - pathophysiology#Direct all-trans-retinal photoreceptor toxicity
        rationale: Degeneration in the Abca4/Rdh8 double-knockout mouse appears only after illumination,
          and blocking the visual cycle before illumination is protective, yet no study has asked whether
          light exposure changes progression in patients. The gap matters because photoprotection is cheap,
          available now, and testable inside an existing natural-history registry, whereas every therapy
          that has reached a human readout has failed to show functional benefit. The 2026 openscientist
          hypothesis-search report states that its PubMed searches for this question returned nothing;
          that negative search is not logged in the hypothesis directory, so the absence is recorded here
          as an open question rather than as an established absence of literature.
      selected_evidence:
        snippet: photoreceptor atrophy and ferroptosis in light-exposed Abca4-/-Rdh8-/- mice were effectively
          alleviated by intraperitoneally injected Fer-1, a selective inhibitor of ferroptosis
        supports: SUPPORT
