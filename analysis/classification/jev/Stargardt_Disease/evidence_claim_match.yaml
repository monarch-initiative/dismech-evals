        subtype_term:
          preferred_term: cone-rod dystrophy 3
          term:
            id: MONDO:0011395
            label: cone-rod dystrophy 3
        description: A more extensive, biallelic-ABCA4 phenotype at the severe end of the ABCA4 spectrum,
          beyond the macula-limited classic STGD1 presentation. Cone-rod dystrophy involves earlier and
          more pronounced cone system dysfunction (central vision loss, photophobia, dyschromatopsia preceding
          or accompanying peripheral rod loss) and more extensive retinal degeneration on fundus autofluorescence
          than STGD1, consistent with a more severe residual-ABCA4-activity genotype (typically at least
          one severe/null allele) than the hypomorphic alleles that produce classic STGD1.
        subtype_frequency: ~5%
      selected_evidence:
        snippet: ABCA4-associated retinal degeneration presented as Stargardt disease 1 (STGD1, 62.16%),
          retinitis pigmentosa (32.43%), and cone-rod dystrophy (5.41%)
        supports: SUPPORT
