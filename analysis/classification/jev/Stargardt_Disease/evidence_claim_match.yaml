            label: retina
          tissue_term:
            preferred_term: retina
            term:
              id: UBERON:0000966
              label: retina
        conditions:
        - spaceflight (35-day ISS mission)
        - antioxidant treatment (BuOE)
        - saline control
        - habitat ground control
        publication: PMID:37108526
        findings:
        - statement: Spaceflight causes measurable photoreceptor functional impairment (39% a-wave, 32%
            b-wave reduction) that is partially mitigated by antioxidant therapy, suggesting shared oxidative
            stress pathways with Stargardt disease.
      selected_evidence:
        snippet: ERG data showed that the average amplitudes of the a- and b-wave were significantly decreased
          (39% and 32% by spaceflight, respectively) compared to that of habitat ground controls.
        supports: SUPPORT
