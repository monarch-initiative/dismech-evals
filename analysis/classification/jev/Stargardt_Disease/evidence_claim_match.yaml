  e999bd0449b91a91474e0fd211903ee76b630fbd6fcee6b1476898ed00c02ed1:
    claim:
      about:
        disease:
          name: Stargardt Disease
          disease_term:
            preferred_term: Stargardt disease
            term:
              id: MONDO:0019353
              label: Stargardt disease
        context: []
      assertion_type: Environmental
      assertion:
        name: Retinal light exposure
        exposure_term:
          preferred_term: exposure to visible light radiation
          term:
            id: ECTO:0000007
            label: exposure to visible light radiation
        description: Light drives the phototransduction cycle that generates the all-trans-retinal ABCA4
          fails to clear, and it photo-oxidizes bisretinoid once deposited. In mice lacking both Abca4
          and Rdh8 the degeneration is expressed only after illumination, and blocking the visual cycle
          with retinylamine before illumination preserves retinal structure and function. Whether light
          exposure modifies progression in human STGD1 has never been tested; see the linked knowledge-gap
          discussion.
        effect: PATHOGENIC
        notes: Curated as EXACERBATES rather than TRIGGERS on purpose. The mouse evidence would support
          light as a necessary cofactor in that model, but the report generalizing it to human STGD1 has
          no human epidemiology behind it, and the entry should not assert a stronger environmental claim
          than the species it was measured in.
      selected_evidence:
        snippet: We observed that ferroptosis was indeed present in neural retina of Abca4-/-Rdh8-/- mice
          after light exposure.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/1
      evidence_path: /environmental/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33334878
      reference_title: Ferroptosis drives photoreceptor degeneration in mice with defects in all-trans-retinal
        clearance.
      evidence_source: MODEL_ORGANISM
      explanation: Places the ferroptotic photoreceptor death of the atRAL-clearance mouse after illumination
        rather than at baseline.
