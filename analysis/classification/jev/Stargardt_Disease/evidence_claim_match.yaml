      assertion_type: ExperimentalModel
      assertion:
        name: Patient-derived retinal organoid model
        description: 'Human retinal organoids generated from unresolved and genetically confirmed STGD1
          cases to model genotype-phenotype correlations, photoreceptor-retina developmental abnormalities,
          and therapeutic-response hypotheses.

          '
        experimental_model_type: ORGANOID
        namo_type: namo:Organoid
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        tissue_term:
          preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
        conditions:
        - Stargardt disease
        - late-onset STGD1
        - unaffected control
        cell_source: Patient-derived induced pluripotent stem cells differentiated into retinal organoids
        culture_system: Three-dimensional retinal organoid culture
        publication: PMID:39971915
        findings:
        - statement: Retinal organoids recapitulate genotype-dependent developmental and transcriptomic
            abnormalities in STGD1
        modeled_mechanisms:
        - target: ABCA4 transporter dysfunction
          relationship: MEASURES
          fidelity: HIGH
          description: Organoid photoreceptor ABCA4 protein abundance tracks genotype severity, and long-read
            RNA-seq recapitulates the patient-specific ABCA4 retina-specific splicing defect.
          readouts:
          - name: ABCA4 protein abundance across genotype severity
            target: ABCA4 transporter dysfunction
            description: Western blot quantification of ABCA4 protein in organoids from patients with
              progressively more severe genotypes, normalised to unaffected control organoids.
            direction: DECREASED
            interpretation: Residual ABCA4 protein scales inversely with genotype severity, the expected
              relationship if the organoid is faithfully reporting the transporter defect.
          - name: ABCA4 retina-specific splicing defect recapitulation
            target: ABCA4 transporter dysfunction
            description: Long-read RNA sequencing of organoid ABCA4 transcripts from a patient carrying
              the c.5461-10T>C splice-acceptor variant.
            direction: ALTERED
            interpretation: Reproducing the patient-specific splicing defect in a tissue model directly
              evidences the transporter mechanism rather than merely modeling downstream consequences.
        - target: Secondary macular photoreceptor degeneration
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Cone and rod photoreceptor mislocalisation intensifies with genotype severity,
            modeling photoreceptor stress that precedes overt degeneration.
          limitations: The organoid attributes photoreceptor mislocalisation to a secondary stress response
            from harbouring mutated ABCA4 rather than to a direct effect of ABCA4 loss, and CASP3-mediated
            apoptosis was explicitly ruled out as the cause. A 220-day developmental organoid also has
            no route to the decades-long lipofuscin-to-RPE-to-photoreceptor axis that drives human macular
            degeneration, so the model bypasses the middle of this arm of the pathograph.
          readouts:
          - name: CASP3-positive photoreceptor apoptosis
            target: Secondary macular photoreceptor degeneration
            description: CASP3 immunofluorescence in organoid photoreceptors across patient and control
              lines.
            direction: UNCHANGED
            interpretation: A very low CASP3-positive fraction argues against apoptotic cell death as
              the driver of photoreceptor mislocalisation in this model, distinguishing its stress-response
              mechanism from the degeneration the node ultimately describes.
        notes: 'This is the primary NAMO-style organoid anchor for Stargardt disease in dismech.

          '
      selected_evidence:
        snippet: Collectively, these results highlight the suitability of retinal organoids in STGD1 modelling.
        supports: SUPPORT
