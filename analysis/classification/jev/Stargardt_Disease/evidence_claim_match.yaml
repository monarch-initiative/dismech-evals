          a superoxide dismutase mimic (BuOE) as a countermeasure against spaceflight-induced retinal
          damage in C57BL/6 mice. Spaceflight reduced ERG a-wave and b-wave amplitudes by 39% and 32%
          respectively, demonstrating functional photoreceptor impairment. Antioxidant treatment mitigated
          oxidative stress biomarkers, suggesting shared therapeutic targets with oxidative RPE injury
          in Stargardt disease.

          '
        organism:
          preferred_term: mouse
          term:
            id: NCBITaxon:10090
            label: Mus musculus
        data_type: MULTI_OMICS_PERTURBATION
        sample_types:
        - preferred_term: retina
          term:
