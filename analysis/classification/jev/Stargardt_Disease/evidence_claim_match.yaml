                label: Stargardt disease 3
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Impaired ELOVL4 Very-Long-Chain Fatty Acid Elongation
        description: 'The dominant STGD3 route, and it is a biosynthetic defect rather than a transport
          one. ELOVL4 is the elongase that extends very-long-chain fatty acids in photoreceptors, and
          the Stargardt-like dominant disease follows from mutations in it. This node does not pass through
          the retinoid-adduct and RPE lipofuscin steps that the ABCA4 route runs through; it converges
          with them only at the photoreceptor degeneration endpoint.

          '
        biological_scale: MOLECULAR
        subtypes:
        - Stargardt disease 3 (STGD3)
        genes:
        - preferred_term: ELOVL4
          term:
            id: hgnc:14415
            label: ELOVL4
        genetic_context:
          gene:
            preferred_term: ELOVL4
            term:
              id: hgnc:14415
              label: ELOVL4
          variant_origin: GERMLINE
          functional_impact_category: DOMINANT_NEGATIVE
          description: Dominant-negative rather than haploinsufficient, and the support is model-system
            only. Heterozygous Elovl4 knockout mice have normal retinae, which rules out simple loss of
            one copy as the cause of the human degeneration; in co-transfected cells the mutant protein,
            which lacks the C-terminal di-lysine endoplasmic-reticulum retention motif, sequesters wild-type
            ELOVL4 into aggresome-like inclusions. No human functional study is cited for this, and the
            review hedges the enzymatic consequence - the dominant-negative effect is on wild-type localization
            and "possibly" on its elongase function - which is why the molecular function below carries
            DECREASED on the strength of the loss of the enzyme rather than of a measured residual activity.
        molecular_functions:
        - preferred_term: very-long-chain fatty acid elongase activity
          term:
            id: GO:0009922
            label: fatty acid elongase activity
          modifier: DECREASED
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
      selected_evidence:
        snippet: the ELOVL4 (elongation of very-long-chain FA-4) enzyme is responsible for vertebrate
          VLC-PUFA biosynthesis
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /has_subtypes/1
