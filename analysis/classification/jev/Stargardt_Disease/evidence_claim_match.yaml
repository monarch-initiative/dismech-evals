      assertion_type: Pathophysiology
      assertion:
        name: Direct all-trans-retinal photoreceptor toxicity
        biological_scale: CELLULAR
        description: Free all-trans-retinal that ABCA4 fails to clear from outer segment discs is cytotoxic
          to the photoreceptor itself, independently of bisretinoid delivered to the retinal pigment epithelium.
          Retinal overload raises ferrous iron, depletes glutathione, induces ACSL4, and drives lipid
          peroxidation, killing photoreceptors by ferroptosis. This is a parallel arm of the ABCA4 chain
          rather than a consequence of retinal pigment epithelial injury, and in mice it is expressed
          only after light exposure.
        cell_types:
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        biological_processes:
        - preferred_term: ferroptosis
          modifier: INCREASED
          term:
            id: GO:0097707
            label: ferroptosis
        - preferred_term: response to oxidative stress
          modifier: INCREASED
          term:
            id: GO:0006979
            label: response to oxidative stress
        notes: Added from the 2026 openscientist hypothesis-search report as the parallel photoreceptor
          death axis the canonical model lacked. The evidence is mouse and 661W cell line only. The report
          also lists GSDME pyroptosis, NLRP3 inflammasome activation, ER stress, and ferritinophagy as
          further limbs of this axis; those were not source-checked during that review and are deliberately
          not curated here.
      selected_evidence:
        snippet: Ferroptosis of photoreceptor cells induced by atRAL resulted from increased ferrous ion
          (Fe2+), elevated ACSL4 expression, system Xc- inhibition, and mitochondrial destruction.
        supports: SUPPORT
