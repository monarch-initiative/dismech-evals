  1504439514b24f9583549816b34de9c603ce51604239c4b6f01490cab203fcfc:
    claim:
      about:
        disease:
          name: Stargardt Disease
          disease_term:
            preferred_term: Stargardt disease
            term:
              id: MONDO:0019353
              label: Stargardt disease
        context: []
      assertion_type: Environmental
      assertion:
        name: Spaceflight microgravity and cosmic radiation
        description: 'Spaceflight exposes the retina to two concurrent stresses that converge on pathways
          shared with Stargardt disease: microgravity-driven cephalad fluid shifts increase intracranial
          and intraocular pressures, while galactic cosmic radiation and solar particle events generate
          reactive oxygen species. Together these insults produce retinal pigment epithelium apoptosis,
          photoreceptor degeneration, choroid thinning, and oxidative lipid peroxidation in ISS-flown
          mice, paralleling the RPE injury and photoreceptor loss caused by bisretinoid and lipofuscin
          accumulation in ABCA4-deficient retinas.

          '
        effect: PATHOGENIC
      selected_evidence:
        snippet: Immunofluorescence assays showed degradation of cone photoreceptors and increased retinal
          oxidative stress. Total retinal, retinal pigment epithelium, and choroid layer thickness were
          significantly lower after spaceflight.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
