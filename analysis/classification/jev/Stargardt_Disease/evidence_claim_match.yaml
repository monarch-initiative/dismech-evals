        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: stgd1_lipofuscin_sufficiency_mouse_human_mismatch
        prompt: Why does a mouse carrying knockout-level A2E and lipofuscin fail to degenerate, and does
          that insufficiency also hold in human retina?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Lipofuscin and A2E accumulation in RPE
        - pathophysiology#Direct all-trans-retinal photoreceptor toxicity
        rationale: 'The Abca4(PV/PV) knock-in mouse accumulates A2E and lipofuscin at knockout levels
          and shows no retinal degeneration for 12 months, while the same complex allele causes severe
          disease in patients. The authors read this as a species difference in the photoreceptor unfolded
          protein response rather than as evidence that lipofuscin is harmless. Two independent lines
          of human data point the same way without settling it: quantitative autofluorescence finds that
          lipofuscin accumulation precedes structural change and may remain without clinically relevant
          functional effect, while removing deposited lipofuscin rescues degeneration in an advanced Stargardt
          mouse. The open question is therefore what converts an accumulated burden into injury. The report
          proposes light-driven photo-oxidation, which is plausible and untested in humans.'
      selected_evidence:
        snippet: These findings suggest likely differences in the unfolded protein response between murine
          and human photoreceptors and support development of therapies directed at increasing this capability
          in patients.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25712131
      reference_title: Protein misfolding and the pathogenesis of ABCA4-associated retinal degenerations.
      evidence_source: MODEL_ORGANISM
      explanation: The source itself frames the negative mouse result as a mouse-versus-human difference,
        which is what makes this a model-fidelity question rather than a refutation of the canonical chain.
