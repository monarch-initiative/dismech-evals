  08cb702210e88d783810cdeb8ff3066aa61392d2a1052583cd9976cb65e22bc8:
    claim:
      about:
        disease:
          name: Stargardt Disease
          disease_term:
            preferred_term: Stargardt disease
            term:
              id: MONDO:0019353
              label: Stargardt disease
        context: []
      assertion_type: Environmental
      assertion:
        name: Spaceflight microgravity and cosmic radiation
        description: 'Spaceflight exposes the retina to two concurrent stresses that converge on pathways
          shared with Stargardt disease: microgravity-driven cephalad fluid shifts increase intracranial
          and intraocular pressures, while galactic cosmic radiation and solar particle events generate
          reactive oxygen species. Together these insults produce retinal pigment epithelium apoptosis,
          photoreceptor degeneration, choroid thinning, and oxidative lipid peroxidation in ISS-flown
          mice, paralleling the RPE injury and photoreceptor loss caused by bisretinoid and lipofuscin
          accumulation in ABCA4-deficient retinas.

          '
        effect: PATHOGENIC
      selected_evidence:
        snippet: approximately 29% and 60% of astronauts on short and long-duration missions, respectively,
          experienced a degradation in distant and near visual acuity
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/5
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21849212
      reference_title: Optic disc edema, globe flattening, choroidal folds, and hyperopic shifts observed
        in astronauts after long-duration space flight.
      evidence_source: HUMAN_CLINICAL
      explanation: The high incidence of visual acuity degradation in astronauts establishes spaceflight
        as a significant environmental risk factor for retinal dysfunction.
