        description: 'Best vitelliform macular dystrophy can resemble Stargardt disease in children and
          adolescents with bilateral central vision loss and macular lipofuscin-related lesions, but it
          is usually caused by dominant BEST1-related disease.

          '
        distinguishing_features:
        - Best disease typically shows a vitelliform, pseudohypopyon, or vitelliruptive yolk-like submacular
          lesion rather than pisciform flecks and diffuse fundus autofluorescence change.
        - Abnormal electrooculography with reduced Arden ratio and autosomal dominant inheritance favor
          Best disease over recessive ABCA4-related Stargardt disease.
        disease_term:
          preferred_term: vitelliform macular dystrophy
