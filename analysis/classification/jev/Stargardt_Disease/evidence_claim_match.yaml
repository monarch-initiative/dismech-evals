      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_abca4_lipofuscin_retinal_degeneration_model
        hypothesis_label: Canonical ABCA4 / Bisretinoid Lipofuscin / RPE-Photoreceptor Degeneration Model
        status: CANONICAL
        description: Stargardt disease (STGD1) is caused by biallelic loss-of-function variants in ABCA4
          on 1p22.1 encoding a photoreceptor-disc-membrane ATP-binding cassette transporter that flips
          N-retinylidene-phosphatidylethanolamine (NRPE) from the lumenal to cytoplasmic face of disc
          membranes, supporting all-trans-retinal clearance from outer segments. Loss of ABCA4 function
          permits accumulation of toxic bisretinoid byproducts (predominantly A2E and its photo-oxidation
          products) as autofluorescent lipofuscin in retinal pigment epithelium (RPE) cells. Bisretinoid
          lipofuscin disrupts RPE phagocytosis, lysosomal function, and complement regulation, producing
          progressive RPE atrophy and secondary photoreceptor loss — manifesting as central scotoma, yellowish
          'pisciform' macular flecks, and characteristic 'dark choroid' on fluorescein angiography. ABCA4
          knockout mice recapitulate lipofuscin accumulation; deuterated vitamin A (gildeuretinol/ALK-001)
          and emixustat slow lipofuscin formation; AAV-ABCA4 retinal gene therapy strategies (including
          EIAV-ABCA4 / SAR422459 and dual-vector AAV designs) are in clinical development and corroborate
          the ABCA4-deficiency / lipofuscin-toxicity / RPE-degeneration axis as the canonical pathogenic
          mechanism.
        notes: 'Retained as CANONICAL with seven critical qualifications. The 2026 openscientist hypothesis-search
          report (kb/hypotheses/Stargardt_Disease/canonical_abca4_lipofuscin_retinal_degeneration_model)
          finds SUPPORTED. The core ABCA4 → impaired N-Ret-PE transport → bisretinoid accumulation → RPE
          damage → photoreceptor degeneration chain is validated at every step by structural biology,
          mouse genetics, human genotype-phenotype, qAF imaging, pharmacological rescue (gildeuretinol/ALK-001,
          emixustat), and an expanding gene therapy toolbox. Seven qualifications: (1) light exposure
          is a REQUIRED COFACTOR, not merely an accelerator — bisretinoid accumulation alone is insufficient
          for degeneration in the PV knock-in mouse; Abca4⁻/⁻Rdh8⁻/⁻ double-KO mice degenerate ONLY upon
          light exposure; (2) direct all-trans-retinal (atRAL) toxicity via ferroptosis, pyroptosis, and
          ER stress constitutes a PARALLEL photoreceptor death pathway independent of RPE lipofuscin;
          (3) the temporal order of cell death is GENOTYPE-DEPENDENT — RPE-first in most subtypes but
          photoreceptor-first in G1961E-associated disease; (4) ABCA4 has RPE-autonomous functions in
          lipid homeostasis beyond photoreceptor-disc transport; (5) protein misfolding and ER retention
          represent a distinct pathogenic mechanism for many missense variants; (6) complement dysregulation
          secondary to RPE lipofuscin contributes to inflammatory amplification of injury; (7) age and
          oxidative stress modulate threshold for clinical degeneration. The canonical ELOVL4 mutation
          produces autosomal-DOMINANT Stargardt-like macular dystrophy (a related but mechanistically
          distinct entity).'
      selected_evidence:
        snippet: An autosomal dominant form of Stargardt disease also known as Stargardt-like dystrophy
          is caused by mutations in a gene encoding ELOVL4, an enzyme that catalyzes the elongation of
          very long-chain fatty acids in photoreceptors and other tissues
        supports: SUPPORT
    origin:
