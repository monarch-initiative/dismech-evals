      assertion:
        name: Hepatotoxicity
        display_name: Statin-associated aminotransferase elevation and liver injury
        description: Usually asymptomatic alanine and aspartate aminotransferase elevation; clinically
          important drug-induced liver injury is uncommon. A trial safety threshold of three times the
          upper limit of normal is used for reassessment, but a mild isolated elevation is neither proof
          of hepatocellular destruction nor necessarily of hepatic origin, since aspartate aminotransferase
          also rises from injured muscle.
      selected_evidence:
        snippet: The deteriorated liver function, especially the increase of serum alanine aminotransferase
          (ALT) and/or aspartate aminotransferase (AST), is one of the most common side effects of statins.
        supports: SUPPORT
