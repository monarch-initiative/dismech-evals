          disorder and the cardiovascular risk of leaving it untreated; they are not antidotes, and they
          do nothing for muscle necrosis once it has occurred. They are recorded here because withdrawing
          a statin has its own cost, which is what makes this entry's management a trade-off rather than
          a removal.
