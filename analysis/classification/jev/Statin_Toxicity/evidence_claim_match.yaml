      assertion_type: Diagnosis
      assertion:
        name: Anti-HMGCR antibody testing
        description: 'Serological detection of antibodies against HMG-CoA reductase. This is the test
          that separates the autoimmune stratum from the direct toxic one, and the indication for it is
          the clinical course rather than the severity: proximal weakness or a markedly raised creatine
          kinase that persists after the statin has been stopped. It is not a screening test for transient
          muscle pain.'
      selected_evidence:
        snippet: In addition to inducing a self-limited myopathy, statin use is associated with an immune-mediated
          necrotizing myopathy (IMNM), with autoantibodies that recognize ∼200-kd and ∼100-kd autoantigens.
        supports: SUPPORT
