        context: []
      assertion_type: Subtype
      assertion:
        name: SAMS
        display_name: Statin-associated muscle symptoms (CK normal or minimally raised)
        description: Symmetrical muscle aching, cramp, stiffness or subjective weakness arising after
          initiation or dose escalation, with creatine kinase normal or only mildly raised and no objective
          weakness. Improves on dechallenge. Distinguished from the strata below by the absence of biochemical
          muscle injury, and managed by switching statin, lowering the dose, alternate-day dosing or combination
          lipid-lowering therapy rather than by stopping lipid-lowering treatment altogether. Immunosuppression
          has no role.
      selected_evidence:
        snippet: However, complete statin intolerance occurs in only a small minority of treated patients
          (estimated prevalence of only 3-5%).
        supports: SUPPORT
