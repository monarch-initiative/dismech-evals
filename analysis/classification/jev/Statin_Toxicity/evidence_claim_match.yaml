        notes: 'Deliberately carries no target_mechanisms link. No node in this pathograph is acted on
          by these drugs: they address the indication the statin was prescribed for, which is outside
          this entry. Linking them to a mechanism node would assert they treat the toxicity.'
      selected_evidence:
        snippet: In addition to statins, which have been available for several decades, ezetimibe, bempedoic
          acid (also as fixed dose combinations), and modulators of proprotein convertase subtilisin/kexin
