      assertion_type: Discussion
      assertion:
        discussion_id: complement_effector_in_anti_hmgcr_imnm
        kind: CONTROVERSY
        prompt: Does terminal complement activation carry the myofiber injury in anti-HMGCR immune-mediated
          necrotizing myopathy, or is the complement deposition seen on biopsy a consequence of injury
          rather than its cause?
        status: OPEN
        attaches_to:
        - pathophysiology#Anti-HMGCR Autoantibody Response
        - pathophysiology#Autoimmune Myofiber Necrosis and Regeneration
        rationale: 'Complement deposition on myofibers is part of the histological picture, and passive
          transfer of anti-HMGCR antibodies to mice has been reported to cause weakness and necrosis in
          a complement-dependent setting, which together motivated terminal complement inhibition as a
          therapy. A randomised phase 2 trial of the C5 inhibitor zilucoplan then showed no benefit despite
          target engagement. That does not establish that complement is uninvolved in the biology, but
          it does mean no complement-mediated effector edge can be drawn in this pathograph: the one intervention
          that tested the step directly in patients was negative. The question matters because the effector
          mechanism is what a targeted treatment for this stratum would have to act on, and immunosuppression
          is currently non-specific.'
        notes: The trial enrolled 27 patients with anti-HMGCR or anti-SRP antibodies, so it is small and
          not confined to the statin-associated subset, and it is registered as terminated (see clinical_trials
          NCT04025632). Read as evidence against C5 inhibition as a treatment, and as a reason not to
          assert a complement effector edge, rather than as a demonstration that complement plays no part.
      selected_evidence:
        snippet: At Week 8 there were no clinically relevant or statistically significant differences,
          despite target engagement based on mode of action, between treatment arms in mean percent change
          (standard deviation) of CK levels versus baseline
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
