        description: The systemic statin concentration actually reached, which is what determines delivery
          of drug to tissues other than liver. Set by the molecule and dose, by interacting drugs that
          inhibit statin metabolism or transport, by renal and hepatic function, and by the transporter
          genotype above. Higher exposure is the quantity that scales with risk in the dose-comparison
          and genotype literature alike.
        role: trigger
        biological_scale: ORGANISM
        chemical_entities:
        - preferred_term: statin
          modifier: INCREASED
          term:
            id: CHEBI:87631
            label: statin
      selected_evidence:
        snippet: Some statins (atorvastatin, simvastatin, and lovastatin) are metabolized by the enzyme
          CYP3A4 in the liver. When it is used in large doses or in combination with CYP3A4 inhibitors
          (such as macrolides), both of the drug concentration and the liver load increase significantly,
          which can directly cause liver damage.
        supports: SUPPORT
