          class and the route. ECTO was searched through this repository's own adapter (sqlite:obo:ecto)
          with the queries l~statin, l~simvastatin, l~atorvastatin, l~rosuvastatin, l~HMG, l~cholesterol,
          l~lipid-lowering, l~hypolipidemic and l~drug. The class-level ECTO:9000259 exposure to statin
          also resolves and is the parent of the bound term; agent-specific terms exist for simvastatin,
          atorvastatin, rosuvastatin and pravastatin, and are not used here because the entry is the drug
