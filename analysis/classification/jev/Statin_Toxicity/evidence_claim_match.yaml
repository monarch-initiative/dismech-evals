      - /pathophysiology/0
    evidence_metadata:
      reference: PMID:39796117
      reference_title: 'Effect of Genetic Variants on Rosuvastatin Pharmacokinetics in Healthy Volunteers:
        Involvement of ABCG2, SLCO1B1 and NAT2.'
      evidence_source: HUMAN_CLINICAL
      explanation: A pharmacokinetic measurement in healthy volunteers of the exact step this edge asserts
        - reduced transporter function raising systemic drug exposure - rather than of any downstream
        injury.
