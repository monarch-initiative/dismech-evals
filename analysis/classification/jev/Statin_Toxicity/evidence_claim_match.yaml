      assertion_type: Subtype
      assertion:
        name: Anti-HMGCR IMNM
        display_name: Statin-triggered anti-HMGCR immune-mediated necrotizing myopathy
        description: An uncommon autoimmune myopathy in which statin exposure is followed by an antibody
          response against HMG-CoA reductase itself. Progressive symmetrical proximal weakness with markedly
          raised creatine kinase that persists or worsens after the statin is stopped, and biopsy showing
          myofiber necrosis and regeneration with comparatively sparse lymphocytic infiltrate. Diagnosis
          rests on anti-HMGCR serology; treatment is specialist-directed immunosuppression, and statin
          re-exposure is permanently avoided. This is the one stratum where drug withdrawal is not sufficient
          treatment.
      selected_evidence:
        snippet: The initial creatine kinase (CK) levels ranged from 1438 to over 13,000 IU/L.
        supports: SUPPORT
    origin:
