  6b5cab76dde3265d525b536f37db8320d372683a8f0dae042b772f0834b47cd1:
    claim:
      about:
        disease:
          name: Statin Toxicity
          disease_term:
            preferred_term: statin toxicity
            term:
              id: MONDO:0033170
              label: statin toxicity
        context:
        - path: /pathophysiology/0
          value:
            name: Reduced Statin Transporter Function
            description: 'Reduced-function variants of two transporters that between them govern how much
              of an administered dose reaches the systemic circulation. OATP1B1, encoded by SLCO1B1, is
              the hepatic uptake transporter, so reduced function lowers hepatic extraction of the drug.
              BCRP, encoded by ABCG2, is an efflux transporter whose contribution to statin disposition
              is not hepatic extraction, so reduced function is recorded here as raising systemic availability
              without this entry asserting which compartment it acts in - the source measures accumulation,
              not its site. This node is host susceptibility rather than drug action: it injures nothing
              by itself, and its only consequence in this pathograph is the concentration reached by a
              given dose. It is absent in most people who develop toxicity, so the chain below it runs
              with or without it.'
            role: modifier
            biological_scale: MOLECULAR
            genes:
            - preferred_term: SLCO1B1
              term:
                id: hgnc:10959
                label: SLCO1B1
            - preferred_term: ABCG2
              term:
                id: hgnc:74
                label: ABCG2
            molecular_functions:
            - preferred_term: xenobiotic transmembrane transporter activity
              modifier: DECREASED
              term:
                id: GO:0042910
                label: xenobiotic transmembrane transporter activity
            notes: The two transporters move the drug in opposite directions and are bound to one molecular
              function here because GO's separate canonical activities for them - organic-anion transport
              for OATP1B1, ABC-type xenobiotic efflux for BCRP - would split a node whose single claim
              is the capacity to clear the drug from the circulation.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Elevated Systemic Statin Exposure
        causal_link_type: DIRECT
        description: Reduced uptake and efflux capacity leave more drug in the systemic circulation for
          a given administered dose.
      selected_evidence:
        snippet: Genetic analysis showed that decreased (DF) and poor function (PF) volunteers for the
          ABCG2 transporter had higher AUC
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0/downstream/0
      evidence_path: /pathophysiology/0/downstream/0/evidence/0
      context_paths:
