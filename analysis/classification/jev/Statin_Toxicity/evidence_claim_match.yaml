  c720b4e31c4a20fc6e7723eec34f5fc902df03a6e3b1639420d49a6b7ab56669:
    claim:
      about:
        disease:
          name: Statin Toxicity
          disease_term:
            preferred_term: statin toxicity
            term:
              id: MONDO:0033170
              label: statin toxicity
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: C2C12 myotube simvastatin exposure with pathway-intermediate add-back
        description: 'Differentiated mouse C2C12 myotubes exposed to simvastatin, with mevalonate-pathway
          intermediates added back one at a time. This is the system that carries the mechanistic spine
          of this entry: it is where the geranylgeranyl donor is shown to prevent the injury while cholesterol
          and ubiquinone do not, and where blocking the transferase while the donor is replete reproduces
          the deficit. Every molecular step between enzyme inhibition and cell injury recorded here is
          measured in this model and not in human muscle.'
        experimental_model_type: CELL_LINE
        organism:
          preferred_term: mouse
          term:
            id: NCBITaxon:10090
            label: Mus musculus
        cell_types:
        - preferred_term: myotube
          term:
            id: CL:0002372
            label: myotube
        publication: PMID:21732624
        modeled_mechanisms:
        - target: Impaired Protein Geranylgeranylation
          relationship: PERTURBS
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: The add-back and transferase-inhibitor arms intervene directly on geranylgeranylation,
            which is what isolates this step rather than merely observing it.
          limitations: A mouse myoblast-derived line differentiated in culture, exposed to a single statin
            at 10 micromolar for 48 hours. Human myocytes in a treated patient see a far lower concentration
            over years, and the line carries none of the transporter-dependent exposure variation that
            governs risk in people.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: The myotubes are mouse. The prenylation chemistry is conserved, but the claim
              the entry makes is about human skeletal muscle, and no human myocyte experiment is cited
              for this step.
          - divergence_type: TEMPORAL_SCOPE
            materiality: QUALIFYING
            description: A 48-hour exposure at a supratherapeutic concentration stands in for years of
              therapeutic dosing. It can show that the step occurs; it cannot show the rate at which it
              occurs in a patient.
          readouts:
          - name: Cellular ATP after geranylgeranyl pyrophosphate add-back
            target: Impaired Protein Geranylgeranylation
            direction: RESTORED
            interpretation: Restoring the prenyl donor restores cellular energy, which is what places
              the loss of geranylgeranylation rather than of cholesterol or ubiquinone in the causal path.
        - target: Myocyte Bioenergetic Failure
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: The model reproduces the falling energy charge and the apoptotic programme of this
            node, but not the fiber necrosis or the clinical syndrome downstream of it.
          limitations: Reproduces an energy deficit and caspase activation in culture. It does not reproduce
            muscle pain, which is the commonest clinical manifestation and has no correlate in a myotube,
            and it does not reproduce the autoimmune stratum at all.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Mouse myotubes standing in for human skeletal muscle fibers.
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: The model contains no circulation, no transporters governing drug delivery, no
              immune system and no nervous system, so it cannot represent the exposure step above this
              node or the pain and autoimmune branches beside it.
          readouts:
          - name: Caspase-3/7 activity after simvastatin exposure
            target: Myocyte Bioenergetic Failure
            direction: INCREASED
            interpretation: Programmed cell death is engaged, and is suppressed by restoring the prenyl
              donor, which links the energy deficit to cell death within the same chain.
        notes: Recorded because three pathophysiology nodes and the edges between them rest on this one
          system. Without it the entry would state a molecular mechanism for human muscle injury without
          anywhere saying that a mouse myoblast line at a supratherapeutic concentration is what the claim
          is measured in.
      selected_evidence:
        snippet: We previously identified a cellular signature of statin-induced muscle toxicity in the
          C2C12 myotube.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
      evidence_path: /experimental_models/0/evidence/0
