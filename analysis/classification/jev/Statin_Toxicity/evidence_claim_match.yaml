      assertion_type: Subtype
      assertion:
        name: CK-Defined Myopathy
        display_name: Statin-induced myopathy and rhabdomyolysis
        description: Creatine-kinase-defined muscle injury, graded in the clinical literature by multiples
          of the upper limit of normal, extending to rhabdomyolysis with myoglobin release and acute kidney
          injury. Dose- and exposure-dependent, and the stratum in which the SEARCH trial's simvastatin
          dose comparison measured a thirty-fold difference in incidence. Requires immediate drug withdrawal
          and assessment of renal function, rather than rechallenge.
      selected_evidence:
        snippet: CK levels in severe myopathy and rhabdomyolysis (SRM 4 and 5, respectively) are raised
          above 10 times and 50 times the ULN, respectively
        supports: SUPPORT
