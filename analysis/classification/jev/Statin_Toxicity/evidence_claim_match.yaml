          value:
            name: Anti-HMGCR Autoantibody Response
            description: 'A circulating antibody response against HMG-CoA reductase. The same protein
              the drug inhibits becomes the target of autoimmunity, which is what makes this stratum self-sustaining:
              removing the drug removes the inhibition but not the antibody, so the disease continues
              after withdrawal. Antibody detection is the diagnostic test for this branch.'
            role: central_effector
            biological_scale: ORGANISM
            biological_processes:
            - preferred_term: humoral immune response mediated by circulating immunoglobulin
              modifier: INCREASED
              term:
                id: GO:0002455
                label: humoral immune response mediated by circulating immunoglobulin
            notes: 'Whether terminal complement deposition carries the injury is unsettled and is recorded
              as a knowledge gap rather than as an edge: a randomised trial of C5 inhibition in this disease
              was negative despite target engagement, so a complement-mediated effector edge would assert
              more than the evidence supports.'
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Autoimmune Myofiber Necrosis and Regeneration
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: 'The antibody response is accompanied by necrotizing muscle injury that responds
          to immunosuppression rather than to drug withdrawal, which is the basis for treating it as immune-mediated.
          The intermediates are recorded as unknown because what the antibody does to the fiber is exactly
          what is unsettled: the candidate effector was terminal complement, and the one trial that inhibited
          it in patients was negative.'
      selected_evidence:
        snippet: Given that these patients had proximal muscle weakness, elevated CK levels, MHC I expression
          on non-necrotic muscle fibers, autoantibodies, and responded to immunosuppression, we concluded
          that these patients had an IMNM.
