      assertion_type: Pathophysiology
      assertion:
        name: Hepatocyte Mitochondrial Injury
        description: Statin exposure injures hepatocyte mitochondria in a time- and dose-dependent manner
          in experimental systems, with loss of membrane potential and increased superoxide. This is the
          proposed basis of the aminotransferase elevation seen clinically; the link from the experimental
          lesion to the clinical enzyme rise in patients is not established, and most mild elevations
          are not shown to reflect hepatocellular destruction at all.
        role: intermediate
        conforms_to: drug_induced_liver_injury#Mitochondrial Dysfunction and Oxidative Stress
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        cellular_components:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
        biological_processes:
        - preferred_term: response to oxidative stress
          modifier: INCREASED
          term:
            id: GO:0006979
            label: response to oxidative stress
        notes: 'Conforms to the drug-induced liver injury module''s mitochondrial amplifier node, which
          exists so a drug-toxicity entry need not re-derive the hepatotoxicity chain; the module''s generic
          hepatotoxic drug is substituted by the statin. The oxidative-stress process is annotated because
          the cited source reports increased mitochondrial superoxide specifically. Two neighbouring modules
          were considered and rejected: sarcolemmal_fragility_myofiber_necrosis is scoped to mechanical
          fragility of the dystrophin complex rather than toxic metabolic injury, and drug_induced_nephrotoxicity
          begins with tubular uptake of the drug, whereas the nephrotoxin in this entry is myoglobin rather
          than the statin.'
      selected_evidence:
        snippet: Statins can result in a decrease in membrane potential and a significant increase in
          superoxides in mitochondria, which then lead to serious mitochondrial damage.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/13
      evidence_path: /pathophysiology/13/evidence/0
      context_paths:
