      assertion_type: Treatment
      assertion:
        name: Withdrawal of the implicated statin
        description: Stopping the drug. For the direct toxic strata this is both the diagnostic manoeuvre
          and the treatment, because removing the exposure removes the lesion and creatine kinase and
          symptoms then fall. It is required immediately for severe creatine-kinase elevation, rhabdomyolysis
          or progressive weakness. It is not sufficient in the autoimmune stratum, where the disease continues
          without the drug.
        treatment_term:
          preferred_term: statin discontinuation
          term:
            id: NCIT:C128535
            label: Pharmacotherapy Discontinuation
        therapeutic_modality: OTHER
      selected_evidence:
        snippet: In patients with a CK elevation of more than four times the ULN, and definitely in those
          with a CK elevation of above 10 times the ULN, even without the muscle symptoms, statin therapy
          should be stopped.
        supports: SUPPORT
