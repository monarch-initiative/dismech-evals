              id: MONDO:0033170
              label: statin toxicity
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: attribution_of_muscle_symptoms_to_the_drug
        kind: CONTROVERSY
        prompt: What proportion of muscle symptoms reported during statin treatment is caused by the drug,
          and can any individual case be attributed without a blinded rechallenge?
        status: OPEN
        attaches_to:
        - phenotypes#Myalgia
        - has_subtypes#SAMS
        rationale: 'This is the entry''s central difficulty and it is deliberately not drawn as pathophysiology,
          because the competing explanations are not mechanisms of the drug: exercise, an untreated thyroid
          or musculoskeletal disorder, intercurrent illness, and expectation. Reported symptom prevalence
          in registries runs far above what blinded comparison supports, and the International Lipid Expert
          Panel puts the expectation effect at possibly over half of all reported muscle weakness or pain.
          The consequence for this entry is structural: the frequency of reported symptoms and the frequency
          of drug-caused injury are different quantities with different denominators, so no frequency
          slot is filled from a reported-symptom rate anywhere in the SAMS stratum. It is recorded as
          a controversy rather than a knowledge gap because the evidence exists and is contested in its
          interpretation, not absent.'
        notes: 'This is why exercise is named as a confounder in the creatine kinase and myalgia descriptions
          rather than linked as an environmental exposure: in this entry exercise is an alternative explanation
          for the observation, not a modifier of the drug''s mechanism.'
      selected_evidence:
        snippet: Observational studies are valuable; however, the lack of a placebo comparator limits
          the ability to establish a causal relationship between statins and muscle complaints with exercise.
        supports: SUPPORT
