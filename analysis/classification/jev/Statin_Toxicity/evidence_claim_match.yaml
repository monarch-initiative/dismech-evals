      assertion_type: Genetic
      assertion:
        name: SLCO1B1
        gene_term:
          preferred_term: SLCO1B1
          term:
            id: hgnc:10959
            label: SLCO1B1
        presence: PRESENT
        relationship_type: SUSCEPTIBILITY
        association: Reduced-function variants of the hepatic uptake transporter OATP1B1 raise systemic
          statin exposure and with it the risk of muscle injury, most strongly for simvastatin.
        variant_origin: GERMLINE
        notes: 'Typed SUSCEPTIBILITY rather than CAUSATIVE deliberately. The variant is neither necessary
          nor sufficient: most people who develop statin myopathy do not carry it, and most carriers tolerate
          statins. It is a pharmacokinetic risk allele whose effect size depends on which statin is prescribed,
          not a disease-causing mutation. A Dutch cohort of 1,136 statin users could not confirm an association
          between this genotype and change of statin therapy, but used dispensing change as the outcome
          rather than documented muscle injury, so it does not contradict the myopathy association above.'
        variants:
        - name: rs4149056
          description: SLCO1B1 c.521T>C, p.Val174Ala. A reduced-function missense variant of OATP1B1.
            No clinical_significance is recorded because that slot carries ACMG pathogenicity classes,
            and this is a drug-response and pharmacokinetic susceptibility allele rather than a variant
            pathogenic for a monogenic disease.
      selected_evidence:
        snippet: In our analyses, we could not confirm an association between the SLCO1B1 c.521T>C genotype
          and any change in statin therapy or arriving at a stable dose sooner in primary care.
        supports: NO_EVIDENCE
