              id: MONDO:0033170
              label: statin toxicity
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ubiquinone_depletion_as_the_myopathy_mechanism
        kind: CONTROVERSY
        prompt: Does depletion of ubiquinone explain statin myopathy, and is there any role for coenzyme
          Q10 supplementation?
        status: OPEN
        attaches_to:
        - pathophysiology#Depletion of Mevalonate Pathway Isoprenoid Intermediates
        - pathophysiology#Myocyte Bioenergetic Failure
        rationale: 'Ubiquinone is a mevalonate-pathway product, statins deplete it, and it is required
          for mitochondrial electron transport - which makes its depletion the oldest and most intuitive
          candidate mechanism for the muscle injury, and the rationale for coenzyme Q10 supplementation.
          The rescue experiment argues against it: adding coenzyme Q10 back to statin-exposed myotubes
          does not prevent the fall in cellular energy, while adding the geranylgeranyl donor does. That
          is why this entry draws its edge through geranylgeranylation and draws no edge through ubiquinone,
          and why no coenzyme Q10 treatment is recorded. The question stays open rather than closed because
          a single in vitro rescue in a mouse cell line does not settle a clinical question.'
        notes: Reduced ubiquinone and reduced mitochondrial content have been reported in statin-exposed
          human muscle by work not cited in this entry. Those are observations of depletion; this discussion
          is about whether the depletion carries the injury, which is a different question and the one
          the rescue experiment addresses.
      selected_evidence:
        snippet: Simultaneous addition of cholesterol or CoQ was unable to prevent the simvastatin-mediated
          decrease in ATP levels (Figure 1, panel b).
        supports: SUPPORT
