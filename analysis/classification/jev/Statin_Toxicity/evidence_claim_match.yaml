          an exposure, is not an ECTO class, and is from an ontology dismech no longer uses. So no ECTO
          class for HMG-CoA reductase inhibitor exposure under that name exists.
      selected_evidence:
        snippet: The most common adverse effects associated with statins involve muscle-related toxicity,
          which results in myalgia, myopathy and rhabdomyolysis.
