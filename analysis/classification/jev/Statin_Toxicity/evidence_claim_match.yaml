  a9ddfff31cb645ac26094088603b8185cb723b9fc9068d8badfe425cdd04a85c:
    claim:
      about:
        disease:
          name: Statin Toxicity
          disease_term:
            preferred_term: statin toxicity
            term:
              id: MONDO:0033170
              label: statin toxicity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Myocyte Bioenergetic Failure
        description: Falling cellular energy charge in the statin-exposed muscle fiber, with the accompanying
          stress, senescence and apoptotic programmes that human muscle biopsy shows after rechallenge.
          This is the point at which a molecular lesion becomes cell injury, and it is dose-graded rather
          than all-or-none, which is consistent with the clinical spectrum running from reversible symptoms
          to overt necrosis.
        role: intermediate
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: muscle cell apoptotic process
          modifier: INCREASED
          term:
            id: GO:0010657
            label: muscle cell apoptotic process
        notes: No mitochondrion is annotated on this node, although the energy deficit invites it. The
          source that measures the deficit reports mitochondrial gene expression and membrane potential
          intact, so binding the organelle would assert a lesion the evidence specifically did not find.
          Reduced mitochondrial content has been reported in statin-exposed human muscle by other work,
          which is not cited here.
