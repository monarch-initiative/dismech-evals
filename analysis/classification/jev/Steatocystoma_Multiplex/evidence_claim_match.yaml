      assertion:
        hypothesis_group_id: krt17_sfn_bad_apoptosis_suppression
        hypothesis_label: KRT17 p.Arg94Cys suppresses apoptosis of the cyst wall via SFN-BAD sequestration
        status: EMERGING
        description: The recurrent KRT17 p.Arg94Cys variant binds 14-3-3 sigma (SFN) more tightly and
          favours a KRT17/SFN/BAD complex that may sequester pro-apoptotic BAD, so cyst wall cells persist
          rather than turn over. Based on modelling and immunoprecipitation in HeLa cells plus TUNEL staining
          of patient cysts; not replicated.
      selected_evidence:
        snippet: Immunoprecipitation in KRT17-knockout HeLa cells confirmed significantly enhanced KRT17–SFN
          interaction in p.Arg94Cys versus wild-type cells
        supports: SUPPORT
