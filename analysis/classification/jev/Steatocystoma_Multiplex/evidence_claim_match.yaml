      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        description: Familial SM segregates as an autosomal dominant trait with heterozygous KRT17 missense
          variants, as in a four-generation Chinese pedigree with p.Arg94Cys in all ten affected members.
          Expressivity varies within and between families, and the same variant can give SM in one kindred
          and pachyonychia congenita in another.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Genealogical investigations demonstrated an autosomal dominant pattern, and direct sequencing
          of the PCR product revealed a heterozygous mutation, c.280C/T (R94C), which was located in exon
          1 of the KRT17 gene in all 10 affected family members.
        supports: SUPPORT
