      assertion_type: Genetic
      assertion:
        name: KRT17
        gene_term:
          preferred_term: KRT17
          term:
            id: hgnc:6427
            label: KRT17
        association: Causative
        relationship_type: CAUSATIVE
        notes: Reported heterozygous missense variants in SM families include p.Asn92His, p.Arg94His,
          p.Arg94Cys (recurrent, including Chinese families), p.Arg94Gly, p.Ser24Leu and p.Gly34Ser; p.Arg94
          is the most frequently mutated site. p.Arg94Cys and p.Asn92Ser have also been reported in pachyonychia
          congenita (PC-K17) families. Most sporadic cases have no reported KRT17 variant. Homozygous
          p.Arg94His causes a separate recessive atypical pachyonychia congenita with hair and tooth anomalies,
          in which most heterozygous relatives are unaffected; that phenotype is not part of this entry.
          No ClinGen gene-disease validity record for KRT17 and this disease was found in the local cache.
      selected_evidence:
        snippet: We also show heterozygous missense mutations in K17 (N92H and R94H) in two families diagnosed
          as steatocystoma multiplex.
        supports: SUPPORT
