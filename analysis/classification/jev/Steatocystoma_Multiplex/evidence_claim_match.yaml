  cc8cf5aff2fa7a42b6bc3c0b062e9355068d1af96e4fcdbea049535fb72f8394:
    claim:
      about:
        disease:
          name: Steatocystoma Multiplex
          disease_term:
            preferred_term: sebocystomatosis
            term:
              id: MONDO:0008485
              label: sebocystomatosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous KRT17 Helix Initiation Motif Missense Variant
        conforms_to: keratin_intermediate_filament_fragility#Dominant-Negative Keratin Variant in a Filament
          Assembly Domain
        biological_scale: MOLECULAR
        description: Familial SM is caused by heterozygous KRT17 missense variants, most at the start
          of the 1A helix of the rod domain (p.Asn92His, p.Arg94His, p.Arg94Cys, p.Arg94Gly) and a few
          in the head domain (p.Ser24Leu, p.Gly34Ser). The helix initiation motif is the assembly-critical
          region in which pachyonychia congenita keratin variants act dominant-negatively; the identical
          p.Arg94Cys and p.Asn92Ser changes are reported in both SM and PC-K17 families, so genotype alone
          does not predict which phenotype results.
        genes:
        - preferred_term: KRT17
          term:
            id: hgnc:6427
            label: KRT17
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
        molecular_functions:
        - preferred_term: structural constituent of cytoskeleton
          term:
            id: GO:0005200
            label: structural constituent of cytoskeleton
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Mutations in this location are considered to have a significant effect on the assembly
          and/or integrity of the keratin cytoskeleton in cells
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
