  6ad31487670d9a98530b8672a76d45987980e8a9bb3ef74c137d2f2e66686554:
    claim:
      about:
        disease:
          name: Steel Syndrome
          disease_term:
            preferred_term: Steel syndrome
            term:
              id: MONDO:0014061
              label: Steel syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hmm_col27a1_murine_lung_lethality
        prompt: Why is loss of collagen XXVII perinatally lethal from a lung defect in mice while humans
          with markedly reduced or absent COL27A1 protein survive with no reported respiratory disease,
          and what does that species difference imply for using the murine growth-plate phenotype as a
          model of the human lesion?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Structurally Defective or Absent Collagen XXVII
        - pathophysiology#Collapse of the Growth Plate Proliferative Zone
        rationale: Both published mouse models, the engineered 87-amino-acid deletion and the knock-in
          of the human founder allele, kill most homozygotes perinatally through a lung defect or presumed
          respiratory insufficiency. Human patients carrying frameshift, nonsense and splice alleles that
          abolish the protein are viable and are not reported to have respiratory problems. The growth-plate
          readouts from these mice are the main mechanistic evidence in this entry, so the weight they
          can carry depends on whether the murine dependence on collagen XXVII in lung is a species-specific
          requirement or a difference in residual protein.
        proposed_experiments:
        - experiment_id: exp_col27a1_lung_requirement
          name: Cross-species comparison of the collagen XXVII requirement in lung
          description: Compare COL27A1 expression, matrix localisation and pulmonary architecture in human
            fetal lung against mouse, and assess pulmonary function and imaging in a cohort of adults
            with biallelic loss-of-function COL27A1 alleles, to establish whether the murine lung requirement
            has a human counterpart that has simply not been looked for.
          would_support:
          - pathophysiology#Structurally Defective or Absent Collagen XXVII
      selected_evidence:
        snippet: Interestingly, STLS patients do not appear to have respiratory problems or lung abnormalities.
        supports: SUPPORT
    origin:
