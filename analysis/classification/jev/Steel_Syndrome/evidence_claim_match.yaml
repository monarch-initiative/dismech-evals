              label: Steel syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: COL27A1 biallelic pathogenic variants
        gene_term:
          preferred_term: COL27A1
          term:
            id: hgnc:22986
            label: COL27A1
        association: Causative
        relationship_type: CAUSATIVE
        inheritance:
        - name: Autosomal recessive
        frequency: the single known disease gene for Steel syndrome
        notes: 'COL27A1 lies on chromosome 9q32, spans 61 exons and encodes a 1860-amino-acid pro-peptide
          of fibrillar collagen type XXVII. The Puerto Rican founder allele c.2089G>C p.(Gly697Arg) replaces
          a conserved glycine of the Gly-Xaa-Yaa repeat in the triple-helical domain and behaves as a
          hypomorph; carriers are phenotypically normal. Reported non-founder alleles include missense
          (p.Gly802Glu, p.Gly841Arg, p.Gly850Arg, p.Gly676Arg, p.Ala99Thr, p.Pro1019His), frameshift,
          nonsense, splice-site and multi-exon deletion variants.

          '
        case_fractions:
        - population: Molecularly confirmed patients reported to 2020
          notes: Eight of the eleven patients with homozygous COL27A1 mutations reported before 2020 carried
            the p.Gly697Arg founder allele, so the founder allele accounted for the majority of solved
            cases at that time.
      selected_evidence:
        snippet: We identified a homozygous missense variant p.(Gly697Arg) in COL27A1, in a family with
          Steel syndrome and no consanguinity.
        supports: SUPPORT
