        context:
        - path: /pathophysiology/1
          value:
            name: Structurally Defective or Absent Collagen XXVII
            biological_scale: MOLECULAR
            description: 'Collagen XXVII is a fibrillar collagen whose triple-helical domain depends on
              an uninterrupted Gly-Xaa-Yaa repeat. Substituting a helical glycine causes modest endoplasmic-reticulum
              retention of the mutant protein in chondrogenic cells, consistent with abnormal folding
              and impaired secretion, and behaves as a hypomorph; null alleles remove the protein outright.

              '
            genes:
            - preferred_term: COL27A1
              term:
                id: hgnc:22986
                label: COL27A1
            molecular_functions:
            - preferred_term: extracellular matrix structural constituent conferring tensile strength
              term:
                id: GO:0030020
                label: extracellular matrix structural constituent conferring tensile strength
              modifier: DECREASED
            biological_processes:
            - preferred_term: collagen biosynthetic process
              term:
                id: GO:0032964
                label: collagen biosynthetic process
              modifier: DECREASED
            - preferred_term: retention of misfolded procollagen XXVII in the endoplasmic reticulum
              term:
                id: GO:0006621
                label: protein retention in ER lumen
              modifier: INCREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Collagen XXVII Deficiency in Inner Ear Cartilage
        causal_link_type: DIRECT
        description: 'The same collagen deficit applies wherever the protein is normally deposited, and
          the gene is expressed in the cartilaginous structures of the developing inner ear. This is the
          branch point at which the auditory arm of the phenotype separates from the growth-plate arm.

          '
      selected_evidence:
        snippet: Mouse Col27a1 was found to be expressed in the cartilaginous structures associated with
          inner ear development and cochlear epithelium
        supports: SUPPORT
