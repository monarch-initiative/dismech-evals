            label: regulation of growth plate cartilage chondrocyte proliferation
          modifier: ABNORMAL
        - preferred_term: cartilage development
          term:
            id: GO:0051216
            label: cartilage development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Stained sections of femoral and tibial growth plates of homozygous KI mice showed loss
          of the normal architecture of the proliferative zone with absence and disorganization of columnar
          chondrocytes
        supports: SUPPORT
