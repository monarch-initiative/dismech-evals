      assertion_type: AnimalModel
      assertion:
        name: Col27a1 G682R knock-in mouse (Steel founder allele)
        species: Mus musculus
        genotype: Col27a1 G682R knock-in, homozygous and heterozygous
        genes:
        - preferred_term: COL27A1
          term:
            id: hgnc:22986
            label: COL27A1
        publication: PMID:32376988
        description: 'A mouse carrying the murine orthologue of the human Steel syndrome founder allele
          p.Gly697Arg. Homozygotes are dwarfed and kyphotic with a shorter snout and a rounded skull,
          and their growth plates lose the columnar architecture of the proliferative zone. Most homozygotes
          die perinatally, presumably from respiratory insufficiency, which human patients do not show.

          '
        associated_phenotypes:
        - Reduced body length
        - Scoliosis
        - Rounded skull shape
        modeled_mechanisms:
        - target: Collapse of the Growth Plate Proliferative Zone
          relationship: RECAPITULATES
          fidelity: HIGH
          description: 'The knock-in reproduces the growth-plate lesion attributed to the human founder
            allele, with loss of the proliferative-zone architecture and of columnar chondrocytes.

            '
          limitations: Proteoglycan accumulation, mineralisation and collagen II and X staining were not
            overtly different from wild type, so the model speaks to chondrocyte architecture rather than
            to matrix mineralisation.
          readouts:
          - name: Columnar chondrocyte organisation in the femoral and tibial growth plate
            target: Collapse of the Growth Plate Proliferative Zone
            direction: ABOLISHED
            interpretation: Histological correlate of proliferative-zone collapse in homozygous knock-in
              mice.
        - target: Impaired Endochondral Bone Growth
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: 'Homozygotes reproduce reduced body length, scoliosis and a rounded skull, the
            growth consequences of the human lesion.

            '
          limitations: Most homozygous knock-in mice die perinatally from presumed respiratory insufficiency,
            a lethality with no counterpart in Steel syndrome patients, so the severity of the murine
            growth phenotype overstates the human one.
      selected_evidence:
        snippet: Our STLS KI animal model (Col27a1G682R/G682R) recapitulates the short stature and some
          of the skeletal abnormalities observed in the human subjects, however most homozygous KI mice
          die perinatally, presumably due to respiratory insufficiency consistent with previous Col27a1
          mouse models
        supports: SUPPORT
