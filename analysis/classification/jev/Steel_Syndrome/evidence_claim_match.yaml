      assertion:
        name: Collapse of the Growth Plate Proliferative Zone
        biological_scale: CELLULAR
        description: 'Chondrocytes still differentiate, but they lose their columnar organisation. Homozygous
          knock-in mice carrying the murine equivalent of the Steel founder allele lose the normal architecture
          of the proliferative zone, with absence and disorganisation of columnar chondrocytes, while
          proteoglycan accumulation, mineralisation, and collagen II and X staining are not overtly changed.
          Human fetal material shows the corresponding lesion, with severely disorganised metaphyseal
          cartilage and hypercellular resting cartilage arranged in irregular nests bounded by acellular
          matrix.

          '
        cell_types:
        - preferred_term: growth plate chondrocyte
          term:
            id: CL:1000217
            label: growth plate cartilage chondrocyte
        biological_processes:
        - preferred_term: regulation of growth plate cartilage chondrocyte proliferation
          term:
