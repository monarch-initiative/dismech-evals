      assertion_type: Treatment
      assertion:
        name: Hip Reduction Surgery
        description: 'Operative reduction of the dislocated hips has an unfavourable record in Steel syndrome.
          In the original series every hip treated by reduction augmented by an operation redislocated,
          and among closed reductions the results were satisfactory only in patients still skeletally
          immature at review. Untreated hips functioned satisfactorily over the reported follow-up. This
          history is why surgical reduction is approached cautiously rather than as routine.

          '
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: hip reduction surgery
          term:
            id: NCIT:C16186
            label: Orthopedic Surgical Procedure
      selected_evidence:
        snippet: Eighteen hips in nine patients were treated with a reduction augmented by some form of
          operation. All of these hips redislocated.
        supports: REFUTE
