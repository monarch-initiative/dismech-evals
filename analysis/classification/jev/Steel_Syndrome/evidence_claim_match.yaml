        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical, Radiographic and Molecular Diagnosis
        description: 'Steel syndrome is suspected from the combination of short stature, bilateral irreducible
          hip dislocation, dislocated radial heads, carpal coalition, scoliosis and the characteristic
          facies, and is confirmed by finding biallelic COL27A1 variants. Targeted testing for the c.2089G>C
          p.(Gly697Arg) allele is appropriate in patients of Puerto Rican ancestry; exome sequencing is
          used otherwise, and copy-number analysis matters because at least one reported allele is a multi-exon
          deletion.

          '
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: Based on the clinical and radiographic findings in all three children, a clinical diagnosis
          of Steel syndrome was made.
        supports: SUPPORT
