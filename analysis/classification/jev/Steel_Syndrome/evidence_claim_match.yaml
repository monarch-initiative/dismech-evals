      assertion_type: Pathophysiology
      assertion:
        name: COL27A1 Biallelic Pathogenic Variants
        biological_scale: MOLECULAR
        description: 'Steel syndrome is initiated by biallelic pathogenic variants in COL27A1 on chromosome
          9q32. The Puerto Rican founder allele c.2089G>C substitutes arginine for a conserved glycine
          of a Gly-Xaa-Yaa repeat inside the triple-helical domain. Elsewhere in the world, private missense
          alleles and null alleles (frameshift, nonsense, splice-site and multi-exon deletion) have been
          reported in consanguineous and non-consanguineous families.

          '
        genes:
        - preferred_term: COL27A1
          term:
            id: hgnc:22986
            label: COL27A1
      selected_evidence:
        snippet: We identified a homozygous missense variant p.(Gly697Arg) in COL27A1, in a family with
          Steel syndrome and no consanguinity.
        supports: SUPPORT
