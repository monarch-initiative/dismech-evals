    evidence_metadata:
      reference: PMID:24986830
      reference_title: Mutations in COL27A1 cause Steel syndrome and suggest a founder mutation effect
        in the Puerto Rican population.
      evidence_source: HUMAN_CLINICAL
      explanation: Shows that the diagnosis is made clinically and radiographically before molecular confirmation.
