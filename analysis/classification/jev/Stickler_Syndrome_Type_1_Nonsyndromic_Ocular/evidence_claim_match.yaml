      assertion_type: Pathophysiology
      assertion:
        name: COL2A1 Null Allele in the Alternatively Spliced Exon 2
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: The initiating lesion in the alleles that the isoform model explains. A premature
          termination codon or a structural change inside COL2A1 exon 2 removes or destabilises the exon
          2 containing transcript from that allele. Reported alleles include Cys64Stop and Cys57Tyr, a
          Cys86 premature termination codon in an eight-generation pedigree, and C192A. Lymphoblast RT-PCR
          in a Cys64Stop patient recovered only the normal allele's IIA form, which the reporting authors
          read as either nonsense-mediated decay of the mutant IIA transcript or nonsense-associated skipping
          of exon 2 - in either case, no mutant IIA product.
        genes:
        - preferred_term: COL2A1
          term:
            id: hgnc:2200
            label: COL2A1
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        biological_processes:
        - preferred_term: nonsense-mediated mRNA decay of the exon 2 containing COL2A1 transcript
          term:
            id: GO:0000184
            label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
          modifier: INCREASED
      selected_evidence:
        snippet: We describe here two mutations in exon 2 of COL2A1 in three patients with predominantly
          ocular Stickler syndrome
        supports: SUPPORT
        directness: DIRECT
