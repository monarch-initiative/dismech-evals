  cc8f8c573cc89408f0426fd3a96d04122f638cc984054dca29a42b59bc616938:
    claim:
      about:
        disease:
          name: Stickler Syndrome Type 1 Nonsyndromic Ocular
          disease_term:
            preferred_term: Stickler syndrome, type I, nonsyndromic ocular
            term:
              id: MONDO:0012287
              label: Stickler syndrome, type I, nonsyndromic ocular
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ostl1_non_exon2_alleles
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do some COL2A1 alleles outside the alternatively spliced exon 2 produce a predominantly
          ocular phenotype, when the isoform model predicts they should not?
        attaches_to:
        - pathophysiology#Isoform-Restricted Loss of Type IIA Procollagen
        - genetic#COL2A1
        rationale: The exon 2 isoform model is the reason this entity exists as a mechanistic concept,
          and three independent reports do not fit it. An Arg453Ter allele in exon 30 - previously reported
          in classic Stickler syndrome - segregated with predominantly ocular disease in one family, which
          the reporting authors themselves flagged as surprising. A GC donor splice site in intron 51
          was shown by splicing reporter construct to splice normally, and the authors attribute the ocular-predominant
          phenotype in that family to it. A c.3534dupT frameshift in exon 50 was found in a two-generation
          family with the ocular phenotype. None of these removes only the IIA isoform, so either the
          model is incomplete, or modifier loci or leaky splicing produce the same tissue restriction
          by a different route, or the phenotype boundary is softer than the label implies - the Arg453Ter
          family had minimal rather than no systemic features, and the exon 50 family had scoliosis and
          mild hearing loss. This matters practically as well as mechanistically, because it means an
          allele's position cannot be used to predict whether a newly diagnosed family needs systemic
          surveillance.
        proposed_experiments:
        - experiment_id: ostl1_isoform_ratio_across_alleles
          name: IIA-to-IIB transcript ratio across exon 2 and non-exon-2 alleles
          description: Measure the allele-specific IIA and IIB transcript ratio in patient-derived cells
            carrying exon 2 alleles, the intron 51 splice-site allele, the exon 50 frameshift and Arg453Ter,
            to test whether the non-exon-2 alleles converge on the same isoform imbalance by a different
            route or produce the phenotype without one.
          would_support:
          - pathophysiology#Isoform-Restricted Loss of Type IIA Procollagen
        - experiment_id: ostl1_systemic_phenotyping_by_allele
          name: Prospective systemic phenotyping stratified by allele position
          description: Apply uniform audiological, craniofacial and orthopaedic assessment to individuals
            with exon 2 and non-exon-2 COL2A1 alleles who present with the ocular phenotype, to establish
            whether the systemic features are genuinely absent in the exon 2 group or merely not looked
            for, and whether allele position predicts what surveillance a family needs.
          would_refute:
          - pathophysiology#Preserved Type IIB Procollagen in Adult Cartilage
      selected_evidence:
        snippet: We also demonstrate that the predominantly ocular form of type 1 Stickler syndrome is
          not confined to mutations in the alternatively spliced exon 2.
        supports: SUPPORT
        directness: DIRECT
