      assertion_type: Pathophysiology
      assertion:
        name: Isoform-Restricted Loss of Type IIA Procollagen
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: The step that makes this a distinct disease rather than a mild Stickler syndrome.
          COL2A1 pre-mRNA is alternatively spliced into a long isoform that retains exon 2 (type IIA)
          and a short isoform that skips it (type IIB). The two are expressed in different tissues, so
          an exon 2 lesion partitions along that boundary instead of reducing type II collagen everywhere.
          This is the node the whole entity turns on, and it has no counterpart in classic type 1 Stickler
          syndrome, where the lesion is not isoform-selective.
        molecular_functions:
        - preferred_term: type IIA procollagen as an extracellular matrix structural constituent
          term:
            id: GO:0005201
            label: extracellular matrix structural constituent
          modifier: DECREASED
        biological_processes:
        - preferred_term: alternative splicing of COL2A1 exon 2
          term:
            id: GO:0000380
            label: alternative mRNA splicing, via spliceosome
      selected_evidence:
        snippet: COL2A1 precursor mRNA undergoes alternative splicing, resulting in two isoforms, a long
          form including exon 2 (type IIA isoform) and a short form excluding exon 2 (type IIB isoform).
        supports: SUPPORT
        directness: DIRECT
    origin:
