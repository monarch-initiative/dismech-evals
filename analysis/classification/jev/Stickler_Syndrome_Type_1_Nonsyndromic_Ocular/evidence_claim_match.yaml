          Cys86 premature termination codon (PMID:12429250) and C192A (PMID:22574936) - all in exon 2
          - alongside three that are not: Arg453Ter in exon 30, an allele previously reported in classic
          Stickler syndrome (PMID:12939326); a GC donor splice site in intron 51 (PMID:16752401); and
          a c.3534dupT frameshift in exon 50 (PMID:41050055). The exon 2 alleles have a mechanism; the
          other three do not yet, and that is recorded as a knowledge gap rather than smoothed over. Note
          that the same nucleotide change can give different phenotypes in different families, so a variant''s
          position in exon 2 is supporting evidence for this diagnosis and not a substitute for the ophthalmic
          examination.'
      selected_evidence:
        snippet: In family B, an Arg453Ter mutation was identified in exon 30 of the COL2A1 gene, that
          was previously described in a patient with classic Stickler syndrome.
        supports: REFUTE
        directness: DIRECT
