      reference_title: Autosomal dominant rhegmatogenous retinal detachment associated with an Arg453Ter
        mutation in the COL2A1 gene.
      evidence_source: HUMAN_CLINICAL
      explanation: Recorded as REFUTE against the claim that this phenotype requires an exon 2 allele.
