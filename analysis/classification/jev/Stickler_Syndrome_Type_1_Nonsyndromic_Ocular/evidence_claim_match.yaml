  fde4348b79afba677aadbf02e8fa6c17bf92c06b7f115da33c7384eacbcbf78d:
    claim:
      about:
        disease:
          name: Stickler Syndrome Type 1 Nonsyndromic Ocular
          disease_term:
            preferred_term: Stickler syndrome, type I, nonsyndromic ocular
            term:
              id: MONDO:0012287
              label: Stickler syndrome, type I, nonsyndromic ocular
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ostl1_extraocular_residue
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the small residue of extraocular findings in ocular-only families coincidental, or
          a real low-grade cartilage phenotype that the isoform model predicts should not exist?
        attaches_to:
        - pathophysiology#Preserved Type IIB Procollagen in Adult Cartilage
        rationale: The isoform model predicts that adult cartilage is spared, and the clinical labels
          say nonsyndromic. Neither is quite what the data show. The largest pedigree found extraocular
          manifestations characteristic of Stickler syndrome in 4 of 100 affected individuals, and the
          most recently reported family had scoliosis in the proband and mild bilateral hearing loss in
          the proband's mother. Four percent in a 100-person pedigree is not obviously distinguishable
          from population background, and a two-person family cannot settle it either way. But the model
          makes a sharp prediction about a tissue, so the residue is worth resolving rather than absorbing
          into the word "minimal" - the answer determines whether IIA has a real developmental role in
          cartilage that the adult IIB switch does not fully cover, and whether these families need any
          systemic surveillance at all.
        proposed_experiments:
        - experiment_id: ostl1_cartilage_iia_developmental_role
          name: Developmental requirement for type IIA procollagen in cartilage
          description: Determine whether chondroprogenitor-stage type IIA procollagen, which is expressed
            before the adult IIB switch, is required for normal cartilage and skeletal development, using
            an exon 2 specific knockout rather than a whole-gene null so that the IIB isoform is preserved.
          would_support:
          - pathophysiology#Preserved Type IIB Procollagen in Adult Cartilage
      selected_evidence:
        snippet: Extraocular manifestations, characteristic for Stickler syndrome, were detected in only
          four of 100 (4%) affected individuals.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
