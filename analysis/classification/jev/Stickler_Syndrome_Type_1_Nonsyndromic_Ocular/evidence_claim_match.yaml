            term:
              id: MONDO:0012287
              label: Stickler syndrome, type I, nonsyndromic ocular
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Preserved Type IIB Procollagen in Adult Cartilage
        biological_scale: MOLECULAR
        role: modulator
        mechanism_confidence: ESTABLISHED
        description: 'The branch that explains an absence, which is why it is drawn. Adult differentiated
          chondrocytes express the exon 2 skipping IIB isoform almost exclusively, so a premature termination
          codon inside exon 2 is not present in the transcript they make. The cartilage, and with it the
          arthropathy, craniofacial and auditory features of classic type 1 Stickler syndrome, is largely
          spared. This node deliberately has no downstream edge: what it produces is the non-occurrence
          of the systemic phenotype, and drawing an arrow to an absent manifestation would be a phantom
          node.'
        cell_types:
        - preferred_term: differentiated chondrocyte in adult cartilage
          term:
            id: CL:0000138
            label: chondrocyte
      selected_evidence:
        snippet: The short form is predominantly expressed by differentiated chondrocytes in adult cartilage,
          and the long form in chondroprogenitor cells during early development and in the vitreous of
          the eye, which is the only adult tissue containing procollagen IIA.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
