        context: []
      assertion_type: Genetic
      assertion:
        name: COL2A1
        gene_term:
          preferred_term: COL2A1
          term:
            id: hgnc:2200
            label: COL2A1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Heterozygous null allele, characteristically in the alternatively spliced exon 2
        notes: 'COL2A1 (HGNC:2200, OMIM 120140) is at 12q13.11 and encodes the alpha-1 chain of type II
          collagen. The alleles reported in this entity are Cys64Stop and Cys57Tyr (PMID:17721977), a
          Cys86 premature termination codon (PMID:12429250) and C192A (PMID:22574936) - all in exon 2
          - alongside three that are not: Arg453Ter in exon 30, an allele previously reported in classic
          Stickler syndrome (PMID:12939326); a GC donor splice site in intron 51 (PMID:16752401); and
          a c.3534dupT frameshift in exon 50 (PMID:41050055). The exon 2 alleles have a mechanism; the
          other three do not yet, and that is recorded as a knowledge gap rather than smoothed over. Note
          that the same nucleotide change can give different phenotypes in different families, so a variant''s
          position in exon 2 is supporting evidence for this diagnosis and not a substitute for the ophthalmic
          examination.'
      selected_evidence:
        snippet: Three of the families exhibited a predominantly ocular phenotype with minimal or absent
          systemic involvement and were found to have mutations in exon 2 of COL2A1.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
