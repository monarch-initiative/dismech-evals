      assertion:
        name: Impaired Type XI Collagen Regulation of Fibrillogenesis
        description: 'Type XI collagen co-assembles with type II collagen and controls fibril nucleation,
          diameter and spacing. With a mutant alpha1(XI) chain in the heterotrimer, that control is lost
          and the resulting heterotypic fibrils are abnormally sized, sparse and disorganized wherever
          the type II/XI network is load-bearing.

          '
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: collagen fibril organization
          term:
            id: GO:0030199
            label: collagen fibril organization
          modifier: DECREASED
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: DECREASED
      selected_evidence:
        snippet: The data demonstrate that collagen XI is essential for normal formation of cartilage
          collagen fibrils and the cohesive properties of cartilage
        supports: SUPPORT
