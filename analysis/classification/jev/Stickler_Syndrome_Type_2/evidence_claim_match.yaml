  82a573503d0801d26081599c163c90d3e3aef735824d91a9af5d583efa3ff5fa:
    claim:
      about:
        disease:
          name: Stickler Syndrome Type 2
          disease_term:
            preferred_term: Stickler syndrome type 2
            term:
              id: MONDO:0011493
              label: Stickler syndrome type 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cho_heterozygote_auditory_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: 'Why do cho/+ mice, heterozygous for a Col11a1 functional null, develop the joint phenotype
          of COL11A1 disease but show no hearing loss at all, when human COL11A1 heterozygotes have frequent
          sensorineural hearing loss?

          '
        attaches_to:
        - pathophysiology#Cochlear Extracellular Matrix Abnormality
        - animal_models#cho/+ heterozygous Col11a1 mouse
        rationale: 'The mismatch is mechanistically load-bearing rather than a modelling nuisance. The
          mouse heterozygote tests halved Col11a1 dosage; human STL2 alleles are missense and splice changes
          whose product still enters the heterotrimer. That the joint phenotype survives the switch to
          a null allele while the auditory phenotype does not is the study''s argument that the human
          cochlear lesion needs dominant-negative mutant chains and is not a dosage effect. The cho/cho
          homozygote is not the exception it looks like: it does have marked ABR hearing loss and a disorganized
          organ of Corti, but that is a recessive, perinatally lethal genotype modelling the fibrochondrogenesis
          end of the COL11A1 spectrum rather than dominant STL2. So no current mouse model addresses the
          auditory arm of STL2 at the right gene dosage; a knock-in of a human triple-helical missense
          allele would be the test.

          '
      selected_evidence:
        snippet: We conclude that Stickler syndrome and Marshall syndrome mutations in COL11A1 cause hearing
          loss via dominant negative effects upon wild-type fibrillar collagen polypeptides in the extracellular
          matrices of the cochlea
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12527136
      reference_title: Auditory function associated with Col11a1 haploinsufficiency in chondrodysplasia
