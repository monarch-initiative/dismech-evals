        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COL11A1 Triple-Helical Domain Variant
        description: 'A heterozygous COL11A1 variant - classically a glycine substitution within the Gly-X-Y
          repeat of the triple-helical domain, or a splice-site change causing in-frame skipping of a
          triple-helical exon - yields a structurally abnormal pro-alpha1(XI) chain. The chain is still
          competent to enter the type XI heterotrimer, which is what makes the lesion dominant negative
          rather than a simple loss of one allele''s product.

          '
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: COL11A1
            term:
              id: hgnc:2186
              label: COL11A1
          allele_type: SNV
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
          description: 'Heterozygous germline COL11A1 variants acting through incorporation of the mutant
            chain into the collagen XI heterotrimer.

            '
      selected_evidence:
        snippet: characterise the mutation as a Glycine to Valine substitution at position 97 of the triple
          helical domain caused by a single base G-->T mutation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
