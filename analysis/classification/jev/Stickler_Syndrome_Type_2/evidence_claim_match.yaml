      assertion:
        category: Auditory
        name: Conductive hearing impairment
        description: 'A conductive component is present in a small minority of ears (3%). Separately,
          hypermobile tympanic membranes are found in 24% of ears - less often than has been documented
          in type 1 disease - and, when present, are attributed to collagen abnormality in the middle
          ear itself. The two observations are distinct: the source makes the collagen attribution for
          the hypermobile tympanic membrane, not for the conductive loss, and a palatal defect with middle
          ear effusion is a well-described route to conductive loss in Stickler syndrome.

          '
        phenotype_term:
          preferred_term: Conductive hearing impairment
          term:
            id: HP:0000405
            label: Conductive hearing impairment
      selected_evidence:
        snippet: Sensorineural hearing loss was most common (77% of ears), with conductive (3%), mixed
          (7%) and no hearing loss (13%), respectively. The proportion of hypermobile tympanic membranes
          (24%) was less than previously documented in type 1 Stickler Syndrome. When present, this appears
          to arise as a direct result of collagen abnormalities in the middle ear.
        supports: SUPPORT
