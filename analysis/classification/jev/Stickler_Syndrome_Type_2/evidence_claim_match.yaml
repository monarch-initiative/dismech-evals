      assertion_type: Definition
      assertion:
        name: Orphanet disease definition
        definition_type: CASE_DEFINITION
        description: 'Orphanet defines Stickler syndrome as a group of connective tissue disorders with
          ophthalmic, auditory, orofacial and articular manifestations. It has no separate record for
          type 2, so the quoted definition is the group''s; the clause that separates the two main forms
          is the vitreous phenotype, evidenced below from the primary literature.

          '
      selected_evidence:
        snippet: Mutations in COL2A1 usually result in a congenital membranous vitreous anomaly. In contrast
          mutations in COL11A1 result in a different vitreous phenotype where the lamellae have an irregular
          and beaded appearance.
        supports: SUPPORT
