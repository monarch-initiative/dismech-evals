  ab88f4b7c6eafc520c0c701e7fad49f410adf0b7fc3fbb0c6c1331fe5f5b851a:
    claim:
      about:
        disease:
          name: Stickler Syndrome Type 4
          disease_term:
            preferred_term: Stickler syndrome, type 4
            term:
              id: MONDO:0013590
              label: Stickler syndrome, type 4
        context: []
      assertion_type: Genetic
      assertion:
        name: COL9A1
        gene_term:
          preferred_term: COL9A1
          term:
            id: hgnc:2217
            label: COL9A1
        relationship_type: CAUSATIVE
        notes: 'COL9A1 on chromosome 6q13 encodes the alpha-1 chain of collagen IX. Biallelic loss of
          function causes STL4. Heterozygous carriers are clinically unaffected, although intervertebral
          disc bulging was noted in two carriers of R507X.

          Note that COL9A1 variants in other allelic and dosage contexts have separately been associated
          with multiple epiphyseal dysplasia and with intervertebral disc disease. Those are different
          diseases on the same gene and are not curated here.'
        variants:
        - name: p.R295X
          description: Homozygous in the founding consanguineous Moroccan family of four affected children.
            A nonsense allele, and the first COL9A1 variant reported in Stickler syndrome. It was later
            found again in an unrelated Moroccan boy.
        - name: p.R507X
          description: Homozygous in two affected Turkish sisters. The second independent nonsense allele,
            which established COL9A1 as a disease gene rather than a single-family observation.
        - name: c.1970delC, p.(Pro657fs)
          description: A frameshift allele reported in the NHS England type IX cohort, in a patient who
            also carried an ARID1B variant.
        - name: g.70,948,188_70,997,277del
          description: A 44.6 kb homozygous in-frame deletion spanning exons 6 to 33, found by copy-number
            analysis of exome data in two Iranian siblings reported as having nonsyndromic hearing loss.
            It is the only structural COL9A1 allele reported and the only one not associated with the
            full syndrome.
      selected_evidence:
        snippet: Therefore, COL9A1 is the fourth identified gene that can cause Stickler syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
