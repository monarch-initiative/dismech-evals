        - path: /animal_models/0
          value:
            name: Col9a1 knockout mouse
            species: Mouse
            genotype: Col9a1 targeted disruption, homozygous null
            publication: PMID:15802199
            description: 'The germline Col9a1 null mouse is the model that supplies this entry''s cochlear
              and cartilage mechanism. Reading it across to human STL4 requires one step the literature
              does not take for you: the mouse is a Col9a1 null and so is the human disease, but almost
              every human cohort pools the three collagen IX genes, so the mouse is gene-matched to this
              entry in a way the human evidence is not.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Cartilage and Craniofacial Matrix Disorganization
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: ORGANISM
        description: The knockout develops premature osteoarthritis and intervertebral disc degeneration
          with cartilage erosion, raised serum hyaluronan, gait changes and increased mechanical sensitivity.
        limitations: 'The human COL9A1 skeletal phenotype is epiphyseal dysplasia in children, not premature
          osteoarthritis in adults, and human arthropathy in this genotype is reported as uncommon. The
          mouse therefore models the cartilage matrix defect but expresses it as a degenerative joint
          phenotype the human cohorts do not consistently show. Intervertebral disc degeneration is the
          one place the two converge: disc bulging was reported in a COL9A1 patient and in two heterozygous
          carriers.'
        readouts:
        - name: Knee and spine histologic degeneration grade
          target: Cartilage and Craniofacial Matrix Disorganization
          direction: INCREASED
          interpretation: Cartilage erosion and disc degeneration in the knockout.
