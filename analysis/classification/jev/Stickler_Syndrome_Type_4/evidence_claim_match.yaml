      assertion_type: ProgressionInfo
      assertion:
        phase: Congenital ocular and auditory presentation
        notes: High myopia, an enlarged globe and an abnormal hypoplastic vitreous are present from early
          life, and the sensorineural hearing loss is congenital or early. The ear typically brings the
          child to attention before the eye does, which is the argument for adding the collagen IX genes
          to congenital hearing loss panels.
      selected_evidence:
        snippet: All patients were highly myopic with congenital megalophthalmos and abnormal, hypoplastic
          vitreous gel, and all had sensorineural hearing loss.
        supports: SUPPORT
    origin:
      assertion_path: /progression/0
