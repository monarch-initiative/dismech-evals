        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Tectorial Membrane Collagen Disorganization
        biological_scale: TISSUE
        description: The mechanistic step between collagen IX loss and deafness, worked out in the Col9a1
          knockout mouse rather than in humans. Type IX collagen is present in the tectorial membrane
          and co-localizes there with type II collagen; in knockout mice the tectorial membrane is misshapen,
          its collagen fibrils are disorganized on electron microscopy, and an anti-type-II-collagen antibody
          fails to detect type II collagen in it at all. So the same surface-decoration failure that disorganizes
          the vitreous and cartilage matrices removes the type II collagen network from the structure
          that transduces sound onto the hair cells. The human counterpart has not been examined; the
          human-side evidence is that COL9A1 is highly expressed in the inner ear.
        locations:
        - preferred_term: tectorial membrane
          term:
            id: UBERON:0002233
            label: tectorial membrane of cochlea
      selected_evidence:
        snippet: We suggest that COL9A1, COL9A2, and COL9A3 be added to genetic screening panels for patients
          with congenital hearing loss.
        supports: SUPPORT
