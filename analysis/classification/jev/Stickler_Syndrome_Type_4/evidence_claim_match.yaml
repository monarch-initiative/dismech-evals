        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Collagen IX Heterotrimer Failure
        biological_scale: MOLECULAR
        description: 'Without the alpha-1 chain, the normal collagen IX heterotrimer is not formed. Collagen
          IX is a FACIT collagen assembled onto the surface of the collagen II/XI fibril and covalently
          linked to collagen II, so it acts as a bridge between fibrils and the surrounding matrix. Its
          loss is therefore felt wherever a collagen II fibril network has to be spaced and stabilised:
          the vitreous gel, hyaline cartilage, and the cochlea.'
        cellular_components:
        - preferred_term: collagen trimer
          modifier: DECREASED
