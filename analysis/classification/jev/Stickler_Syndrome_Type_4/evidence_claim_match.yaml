      assertion_type: CausalEdge
      assertion:
        target: Collagen IX Heterotrimer Failure
        causal_link_type: DIRECT
        description: Collagen IX assembles from the alpha-1, alpha-2 and alpha-3 chains, so losing the
          alpha-1 chain prevents assembly of the normal molecule. The remaining two chains may form an
          alternative heterotrimer that covers some of its functions, which is the proposed reason a collagen
          IX null is survivable where a collagen II null is not.
      selected_evidence:
        snippet: This may suggest that the remaining two α chains are able to form an alternative heterotrimer,
          which can fulfil some, but not all, of the functions of the normal heterotrimer.
        supports: SUPPORT
