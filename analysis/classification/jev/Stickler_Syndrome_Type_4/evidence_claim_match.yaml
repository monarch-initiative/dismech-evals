        context: []
      assertion_type: Treatment
      assertion:
        name: Prophylactic retinopexy, genotype-scoped
        description: 'Prophylactic retinopexy is the standard of care in type 1 Stickler syndrome, where
          it prevents giant-tear detachment. It does not transfer to the collagen IX Sticklers on current
          evidence: the national type IX cohort found no giant retinal tears and no bilateral detachments,
          and its authors recommend offering prophylaxis case by case rather than routinely. Both the
          general recommendation and its genotype-specific restriction are curated here so a reader meets
          them together.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: prophylactic retinopexy
          term:
            id: NCIT:C15329
            label: Surgical Procedure
