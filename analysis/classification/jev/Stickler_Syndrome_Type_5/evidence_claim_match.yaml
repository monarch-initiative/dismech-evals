      assertion:
        phase: Congenital ocular and auditory presentation
        notes: 'High myopia and abnormal vitreous architecture are present from early life, and the hearing
          loss is congenital or early. This is the argument the literature makes for adding the collagen
          IX genes to congenital hearing loss panels: the ear brings the child to attention before the
          eye does, and dual sensory impairment is the thing early diagnosis prevents.'
