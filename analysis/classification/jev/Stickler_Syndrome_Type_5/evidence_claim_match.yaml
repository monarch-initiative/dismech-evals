      assertion:
        name: Avoidance of contact sports
        description: 'Activities carrying a risk of ocular trauma are avoided because trauma can precipitate
          retinal detachment in an eye whose vitreous is already abnormal. This is the one piece of standard
          Stickler management that the type IX data does not qualify: the argument rests on the vitreous
          abnormality, which the type IX cohort confirms, rather than on the giant-tear risk, which it
          does not.'
