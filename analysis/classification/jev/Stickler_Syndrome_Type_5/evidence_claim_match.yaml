      assertion:
        phase: Later retinal and joint complications
        notes: Retinal detachment, when it occurs, follows later; in the national cohort it occurred in
          15.4% of patients through horseshoe tears. Arthropathy is uncommon and variable. The published
          cohorts are young — mean age 11 years in the 2022 review — so the lifetime incidence of both
          complications is likely underestimated.
