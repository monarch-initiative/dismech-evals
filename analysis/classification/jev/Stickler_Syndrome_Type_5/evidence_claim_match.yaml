      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing for biallelic COL9A2 variants
        description: The confirmatory test. Because the clinical picture overlaps the dominant Stickler
          forms while the management differs, and because type IX disease is recessive, the diagnosis
          rests on finding two pathogenic COL9A2 alleles rather than on the ocular phenotype. GeneReviews
          states the requirement as biallelic variants in any of the three collagen IX genes, which is
          also why a heterozygous finding does not make this diagnosis.
      selected_evidence:
        snippet: The diagnosis of Stickler syndrome can be established in a proband with characteristic
          clinical features and/or a heterozygous pathogenic variant in COL2A1, COL11A1, or COL11A2 or
          biallelic pathogenic variants in COL9A1, COL9A2, or COL9A3 identified by molecular genetic testing.
        supports: SUPPORT
