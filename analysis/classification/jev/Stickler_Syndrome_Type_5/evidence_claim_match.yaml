        target: Collagen IX Heterotrimer Failure
        causal_link_type: DIRECT
        description: Collagen IX is an obligate heterotrimer of alpha-1, alpha-2 and alpha-3 chains, so
          losing one chain prevents assembly of the molecule.
      selected_evidence:
        snippet: All three collagen IX α chains, α1, α2, and α3, are needed for formation of functional
          collagen IX molecule.
        supports: SUPPORT
