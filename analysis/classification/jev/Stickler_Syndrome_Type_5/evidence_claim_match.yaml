  8b64248c0bb71c3429030b2b2ef951a7784be623a9c72c14da96183be5af59f0:
    claim:
      about:
        disease:
          name: Stickler Syndrome Type 5
          disease_term:
            preferred_term: Stickler syndrome, type 5
            term:
              id: MONDO:0013666
              label: Stickler syndrome, type 5
        context: []
      assertion_type: Genetic
      assertion:
        name: COL9A2
        gene_term:
          preferred_term: COL9A2
          term:
            id: hgnc:2218
            label: COL9A2
        relationship_type: CAUSATIVE
        notes: 'COL9A2 (1p34.2) encodes the alpha-2 chain of collagen IX. Reported STL5 alleles are loss
          of function — the founding c.843_846+4del8 removes an exon-intron junction, and c.1332del is
          a frameshift. Because collagen IX is an obligate heterotrimer, a null in COL9A2 is functionally
          equivalent to a null in COL9A1 or COL9A3, which is why the three genes produce one clinical
          entity that the nosology splits into STL4, STL5 and STL6.

          Note that heterozygous and other COL9A2 variants have separately been associated with multiple
          epiphyseal dysplasia and with intervertebral disc disease. Those are different allelic and dosage
          contexts and are not this disease.'
        variants:
        - name: c.843_846+4del8
          description: Homozygous in the founding family. An eight-base deletion spanning an exon-intron
            boundary, reported as loss of function.
        - name: c.1332del
          description: Homozygous in two brothers from a consanguineous family with severe ocular and
            auditory disease and minimal orofacial and joint involvement.
      selected_evidence:
        snippet: Affected family members were found to have a homozygous loss-of-function mutation in
          COL9A2, c.843_c.846 + 4del8.
        supports: SUPPORT
