  10e83b567cdbd63cd9c10c0cb9e50ea7abf54e231a697a6095fd5e7c6cae16b7:
    claim:
      about:
        disease:
          name: Stickler Syndrome Type 5
          disease_term:
            preferred_term: Stickler syndrome, type 5
            term:
              id: MONDO:0013666
              label: Stickler syndrome, type 5
        context: []
      assertion_type: Treatment
      assertion:
        name: Case-by-case prophylactic retinopexy
        description: 'Prophylactic cryotherapy or laser retinopexy is standard in type 1 Stickler syndrome,
          where lifetime retinal detachment risk exceeds 50% and giant retinal tears dominate. The type
          IX cohort does not support transferring that policy: detachment was less frequent, through horseshoe
          tears, with no giant tears and no bilateral cases. The authors'' conclusion is that prophylaxis
          should be offered case by case, specifically for the fellow eye of a patient who has already
          had a giant-tear detachment. This entry records the restriction rather than the intervention,
          because the restriction is the finding.

          The restriction is not a claim that prophylaxis does not work. The pro-prophylaxis evidence
          base in Stickler syndrome generally is strong, and the review that makes that case names the
          missing piece itself: the cohort comparisons it rests on were done without molecular genetic
          sub-typing. The type IX cohort is what sub-typing looks like when it is done, so the two findings
          are consistent rather than opposed.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: prophylactic retinopexy
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: Prophylactic retinopexy should only be offered case-by-case for fellow eyes of patients
          presenting with GRT detachments in their first eye.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
