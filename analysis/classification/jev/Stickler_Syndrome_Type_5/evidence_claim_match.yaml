      assertion_type: Diagnosis
      assertion:
        name: Electroretinography in Stickler syndrome
        description: Full-field and multifocal electroretinography demonstrate reduced rod, cone and macular
          function in COL9A2 patients even where optical coherence tomography and fundus autofluorescence
          show no structural macular abnormality. This matters diagnostically because it means reduced
          acuity in these patients should not be attributed solely to refractive error or to a past detachment.
      selected_evidence:
        snippet: FfERG revealed reduced function of both rods and cones and mERG showed reduced macular
          function. No morphological macular changes were found by OCT or FAF.
        supports: SUPPORT
