      assertion_type: Pathophysiology
      assertion:
        name: Collagen IX Heterotrimer Failure
        biological_scale: MOLECULAR
        description: Without the alpha-2 chain, functional collagen IX is not formed. Collagen IX is a
          FACIT collagen that sits on the surface of collagen II fibrils and mediates their interaction
          with the surrounding matrix, so its absence is felt wherever a collagen II fibril network has
          to be spaced and stabilised — principally the vitreous gel and hyaline cartilage.
        cellular_components:
        - preferred_term: collagen trimer
          modifier: DECREASED
          term:
            id: GO:0005581
            label: collagen trimer
      selected_evidence:
        snippet: Together the data from the present study and the previous studies suggest that loss-of-function
          mutations in any of the collagen IX genes can cause autosomal recessive Stickler syndrome.
        supports: SUPPORT
