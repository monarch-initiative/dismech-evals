      assertion_type: Genetic
      assertion:
        name: HLA-DQB1
        gene_term:
          preferred_term: HLA-DQB1
          term:
            id: hgnc:4944
            label: HLA-DQB1
        association: Associated
        notes: Association with HLA class II alleles indicates genetic susceptibility to autoimmunity,
          though SPS itself is not inherited. The DQB1*0201 allele is carried by approximately 70% of
          SPS patients and is shared with type 1 diabetes and other organ-specific autoimmune disease.
          Contemporary four-digit typing of GAD65-antibody neurological syndromes localizes the signal
          primarily to DQ rather than DR, so this record is keyed to HLA-DQB1 rather than HLA-DRB1.
      selected_evidence:
        snippet: Seventy-two percent carried the DQB1*0201 allele (13 of 18, P = 0.02 vs. 18 of 48 controls),
          indicating that SMS is associated with this allele.
        supports: SUPPORT
