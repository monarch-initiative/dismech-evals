      assertion_type: Pathophysiology
      assertion:
        name: Multiple Synaptic Autoantigen Targeting
        description: SPS involves autoantibodies targeting multiple autoantigens at different locations
          within the GABAergic synapse. Presynaptic targets include GAD65; postsynaptic targets include
          GABARAP and gephyrin; and amphiphysin is located at both pre- and postsynaptic sides. This multi-target
          autoimmunity collectively disrupts GABAergic neurotransmission at multiple levels of the inhibitory
          synapse.
      selected_evidence:
        snippet: The autoantigens can be either presynaptic such as the smaller isoform of glutamic acid
          decarboxylase (GAD65), postsynaptic such as GABA-A receptor-associated protein and gephyrin,
          or located at the pre- and postsynaptic side such as amphiphysin
        supports: SUPPORT
