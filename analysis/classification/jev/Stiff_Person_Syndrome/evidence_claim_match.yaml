      assertion_type: Pathophysiology
      assertion:
        name: GABAergic Inhibition Impairment
        description: Anti-GAD65 antibodies target glutamic acid decarboxylase, the enzyme that synthesizes
          GABA from glutamate. This leads to reduced GABA production and impaired inhibitory neurotransmission,
          resulting in neuronal hyperexcitability. GAD65 is predominantly localized to synaptic vesicles
          and provides additional GABA synthesis when there is increased demand for rapid neurotransmitter
          release during high-frequency neural firing.
        cell_types:
        - preferred_term: GABAergic Interneuron
          term:
            id: CL:0011005
            label: GABAergic interneuron
        - preferred_term: Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        biological_processes:
        - preferred_term: GABAergic synaptic transmission
          term:
            id: GO:0051932
            label: synaptic transmission, GABAergic
        - preferred_term: Inhibitory chemical synaptic transmission
          term:
            id: GO:0098977
            label: inhibitory chemical synaptic transmission
      selected_evidence:
        snippet: A band comigrating with glutamic acid decarboxylase in sodium dodecyl sulfate-polyacrylamide
          gels appeared to be the only nervous-tissue antigen recognized by cerebrospinal fluid antibodies
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
