      assertion_type: Treatment
      assertion:
        name: Secukinumab
        description: An anti-IL-17A monoclonal antibody reported to improve segmental disease in isolated
          cases. Recorded because it is used and reported, not because a mechanism connects it to the
          disease.
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        notes: The mechanistic rationale usually offered for this drug does not survive scrutiny and is
          recorded here rather than repeated. One reported responder carried a variant in IL17C, while
          secukinumab blocks IL-17A. These are different cytokines signalling through different receptors,
          IL-17C acting through IL-17RE, so the variant does not explain the response. The drug may still
          work; the proposed link between that variant and that drug is a plausible-sounding leap rather
          than an established mechanism.
      selected_evidence:
        snippet: we report a patient that showed improvement with anti-IL17 biologic therapy
        supports: SUPPORT
