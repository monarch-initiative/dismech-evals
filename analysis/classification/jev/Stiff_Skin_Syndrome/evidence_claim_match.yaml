      assertion_type: Subtype
      assertion:
        name: Segmental
        display_name: Segmental stiff skin syndrome
        description: Localised disease affecting one or a few regions, in which no FBN1 variant is identified
          and the genetic basis is unknown. It is a subtype rather than a differential, which is how it
          was originally and wrongly filed in this entry. The distinction carries real weight for evidence
          interpretation, because most of the best downstream mechanistic data in this disease, including
          the lesional fibroblast signalling profile and the losartan response, were generated in segmental
          cases and cannot simply be assumed to describe the FBN1-associated form.
      selected_evidence:
        snippet: The syndrome can be divided into segmental and widespread subtypes according to the distribution
          of the lesions, age of onset and functional impairment
        supports: SUPPORT
