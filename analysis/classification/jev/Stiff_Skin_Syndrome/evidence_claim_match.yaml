      assertion:
        name: Skin biopsy
        description: 'The diagnostic gold standard, and in practice often reached late. In the reported
          paediatric series, biopsy followed a period of ineffective treatment, which is the usual shape
          of the diagnostic path in a disease that is mistaken for scleroderma and morphoea first. The
          informative laboratory finding is a negative one: autoantibodies and inflammatory markers are
          unremarkable, which should redirect toward this diagnosis rather than away from it.'
      selected_evidence:
        snippet: These patients underwent skin biopsy after ineffective treatments, ultimately confirming
          the diagnosis of SSS.
        supports: SUPPORT
