      assertion_type: Pathophysiology
      assertion:
        name: Increased Dermal TGF-beta Signalling
        biological_scale: MOLECULAR
        description: 'Increased TGF-beta pathway activity in the dermis, evidenced at the level of signal
          transduction rather than of cytokine synthesis. Patient fibroblasts show nuclear accumulation
          of phosphorylated Smad2 alongside raised ERK1/2 phosphorylation and NF-kB. The distinction between
          activity and synthesis matters and is discussed below: an early human study found no difference
          in TGF-beta transcript, which is what a model of released latent cytokine would predict, since
          the mechanism liberates TGF-beta that is already present rather than making more of it.'
        biological_processes:
        - preferred_term: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
      selected_evidence:
        snippet: No differences were observed for TGF-beta, CTGF and ET-1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19468049
      reference_title: 'Stiff skin syndrome: evidence for an inflammation-independent fibrosis?'
      evidence_source: HUMAN_CLINICAL
      explanation: 'An early human skin study found no elevation of TGF-beta transcript. Curated as PARTIAL
        rather than REFUTE because it constrains the claim rather than contradicting it: this node asserts
        increased pathway ACTIVITY, and unchanged transcript alongside increased downstream signalling
        is precisely what a release-of-sequestered-latent-cytokine mechanism predicts. It would only be
        a refutation of a claim about increased TGF-beta synthesis, which is not the claim made here.
        Note also n=1 and predating the identification of FBN1 as causal.'
