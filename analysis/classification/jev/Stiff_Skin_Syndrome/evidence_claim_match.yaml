        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FBN1 TB4 Domain Missense Variant
        biological_scale: MOLECULAR
        description: 'Missense substitutions clustering in the fourth TGF-beta-binding protein-like domain
          of fibrillin-1, the domain that carries the RGD motif mediating cell adhesion through integrin
          binding. The critical and easily missed point is that these variants do not impair production:
          the mutant protein is secreted and incorporated into microfibrils. The lesion is functional
          rather than quantitative, which is what separates this disease mechanistically from the fibrillinopathies
          caused by fibrillin-1 deficiency.'
      selected_evidence:
        snippet: Fibrillin-1 is a modular glycoprotein that includes 7 latent transforming growth factor
          β (TGFβ)-binding protein-like (TB) domains and mediates cell adhesion through integrin binding
          to the RGD motif in its 4th TB domain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31640988
      reference_title: A disease-associated mutation in fibrillin-1 differentially regulates integrin-mediated
        cell adhesion.
      evidence_source: IN_VITRO
      explanation: Locates the RGD motif in the TB4 domain and states its role in integrin mediated adhesion,
        which is why variants in this specific domain produce this specific disease.
