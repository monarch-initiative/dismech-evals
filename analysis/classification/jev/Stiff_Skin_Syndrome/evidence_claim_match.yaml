          mucin. The adipocyte entrapment is the finding that explains the clinical sign, since it is
          what binds the skin to what lies beneath rather than merely thickening it.'
        diagnostic: true
      selected_evidence:
        snippet: Skin histopathology demonstrated thickening of the dermis (16, 100%), adipocyte entrapment
          by thickened and horizontally oriented collagen bundles (8/9, 88.9%), and absence of infiltration
          by inflammatory cells.
