      assertion_type: AnimalModel
      assertion:
        name: Fbn1 W1572C knock-in mouse (stiff skin syndrome substitution)
        species: Mouse
        genotype: Fbn1 knock-in carrying the stiff-skin-syndrome-analogous TB4 substitution
        publication: PMID:24107997
        description: Knock-in mice carrying the amino acid substitution analogous to the human disease
          variant develop aggressive skin fibrosis. The model is the source of the only evidence that
          established fibrosis can be reversed rather than merely prevented, and simultaneously the source
          of the entry's principal unresolved problem, since its immune phenotype has no human counterpart.
        modeled_mechanisms:
        - target: Fibroblast Activation and Matrix Overproduction
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: 'Reproduces the aggressive dermal fibrosis of the human disease from the equivalent
            substitution, and supports intervention experiments the human disease cannot. Two distinct
            results emerged, and the verbs matter: integrin-modulating therapy PREVENTED the fibrosis,
            while TGF-beta antagonism REVERSED it. The second is the only lead anywhere in this disease
            pointing at regression of established lesions.'
          limitations: The model develops a prominent inflammatory infiltrate and produces autoantibodies,
            neither of which is a feature of human lesional skin, so the immune component of the mouse
            phenotype cannot be assumed to operate in patients. Whether the therapeutic responses depend
            on that immune component is therefore unknown, which directly limits how far the prevention
            and reversal results can be translated.
      selected_evidence:
        snippet: Mutant mice show skin infiltration of pro-inflammatory immune cells including plasmacytoid
          dendritic cells, T helper cells and plasma cells, and also autoantibody production
        supports: SUPPORT
