      assertion_type: Genetic
      assertion:
        name: FBN1
        gene_term:
          preferred_term: FBN1
          term:
            id: hgnc:3603
            label: FBN1
        relationship_type: CAUSATIVE
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        notes: Encodes fibrillin-1. Stiff skin syndrome variants cluster in the fourth TGF-beta-binding
          protein-like domain, which carries the RGD motif mediating integrin binding, and reported substitutions
          include W1570C, C1564S, and C1577G. The mutant protein is secreted and assembled into microfibrils,
          so this is a functional defect in matrix-cell communication rather than a deficiency of fibrillin-1.
          That is the mechanistic separation from Marfan syndrome, which arises from reduced functional
          fibrillin-1 and produces lax connective tissue and aortopathy rather than rigid skin. Segmental
          stiff skin syndrome, the localised form, is not associated with FBN1 variants and remains genetically
          unexplained.
      selected_evidence:
        snippet: Fibrillin-1 is a modular glycoprotein that includes 7 latent transforming growth factor
          β (TGFβ)-binding protein-like (TB) domains and mediates cell adhesion through integrin binding
          to the RGD motif in its 4th TB domain.
