        name: Loss of Integrin Binding by Fibrillin-1
        biological_scale: MOLECULAR
        description: 'Selective loss of fibrillin-1 engagement with cell-surface integrins. This is the
          pivot of the disease, and it has two consequences that then run in parallel: the fibroblast
          loses proper adhesion to its own matrix, and the restraint that integrin engagement places on
          latent TGF-beta held in that matrix is released. The fibrotic phenotype is thought to be regulated
          by exactly this change in fibrillin-1''s ability to mediate integrin binding.'
        molecular_functions:
        - preferred_term: integrin binding
          modifier: DECREASED
          term:
            id: GO:0005178
            label: integrin binding
        biological_processes:
        - preferred_term: cell-matrix adhesion
          modifier: DECREASED
          term:
            id: GO:0007160
            label: cell-matrix adhesion
      selected_evidence:
        snippet: The fibrotic phenotype is thought to be regulated by changes in the ability of fibrillin-1
          to mediate integrin binding.
        supports: SUPPORT
