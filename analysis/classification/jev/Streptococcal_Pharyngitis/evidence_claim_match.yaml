      assertion_type: Pathophysiology
      assertion:
        name: Streptococcal Ribosomal Translation
        role: therapeutic_vulnerability
        conforms_to: bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome
        description: Streptococcus pyogenes depends on 70S-ribosome translation. Clindamycin and macrolides
          target the 50S ribosome and are treatment alternatives for immediate-type penicillin hypersensitivity.
        biological_processes:
        - preferred_term: Translation
          term:
            id: GO:0006412
            label: translation
      selected_evidence:
        snippet: The macrolide-lincosamide-streptogramin B class (MLS) of antibiotics contains structurally
          different but functionally similar drugs, that all bind to the 50S ribosomal subunit. It has
          been suggested that these compounds block the path by which nascent peptides exit the ribosome.
          We have studied the mechanisms of action of four macrolides (erythromycin, josamycin, spiramycin
          and telithromycin), one lincosamide (clindamycin) and one streptogramin B (pristinamycin IA).
          All these MLS drugs cause dissociation of peptidyl-tRNA from the ribosome.
        supports: SUPPORT
