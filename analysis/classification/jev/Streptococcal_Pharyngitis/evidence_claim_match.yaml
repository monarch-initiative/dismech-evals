      assertion:
        name: SpeA-Mediated Tonsillar Immune Dysregulation
        role: amplifier
        description: Streptococcal pyrogenic exotoxin A and related superantigens can drive proliferation
          of human tonsillar T cells, alter T follicular helper-cell phenotype, and induce B-cell apoptosis
          with reduced immunoglobulin release, providing superantigen-producing organisms with a local
          survival advantage.
        locations:
        - preferred_term: tonsil
          term:
            id: UBERON:0002372
            label: tonsil
        cell_types:
        - preferred_term: tonsillar T cell
          term:
            id: CL:0000084
            label: T cell
        - preferred_term: tonsillar B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: T cell activation
          modifier: INCREASED
          term:
            id: GO:0042110
            label: T cell activation
        - preferred_term: B-cell apoptotic process
          modifier: INCREASED
          term:
            id: GO:0006915
            label: apoptotic process
      selected_evidence:
        snippet: Tonsil T cells proliferated in response to SpeA and demonstrated typical release of proinflammatory
          cytokines. When cultured in the absence of superantigen, tonsil preparations released large
          quantities of immunoglobulin over 7 days. In contrast, marked B cell apoptosis and abrogation
          of total immunoglobulin (Ig)A, IgM, and IgG production occurred in the presence of SpeA and
          other superantigens.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
