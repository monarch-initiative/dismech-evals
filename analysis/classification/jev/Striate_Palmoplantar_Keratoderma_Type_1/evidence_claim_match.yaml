      assertion_type: Pathophysiology
      assertion:
        name: Reduced DSG1-Dependent Suppression of EGFR-ERK Signaling
        biological_scale: CELLULAR
        description: Desmoglein 1 binds Erbin, which disrupts SHOC2-mediated Ras-Raf scaffolds and so
          inhibits ERK1/2 activation. This brake on EGFR-ERK signalling lets keratinocytes leaving the
          basal layer progress through terminal differentiation, and it does not need the adhesive ectodomain.
