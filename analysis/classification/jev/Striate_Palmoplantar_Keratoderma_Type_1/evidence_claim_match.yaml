            label: keratosis palmoplantaris striata 2
        description: Clinically similar striate keratoderma caused by heterozygous DSP variants. DSP carriers
          may develop cardiomyopathy, so the gene matters for surveillance.
        distinguishing_features:
        - Causal gene (DSP rather than DSG1) on genetic testing.
