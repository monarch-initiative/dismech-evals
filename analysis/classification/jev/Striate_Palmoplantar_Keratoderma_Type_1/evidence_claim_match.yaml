        description: Biallelic loss of function of the same gene causes a severe recessive disorder with
          palmoplantar keratoderma, dermatitis and multiple allergies.
        distinguishing_features:
        - Biallelic loss-of-function DSG1 variants rather than heterozygous ones (a biallelic hypomorphic
          allele can instead give mild SPPK).
        - Severe dermatitis and multiple allergies, sometimes metabolic wasting.
      selected_evidence:
        snippet: Monoallelic desmoglein 1 mutations have been known for many years to cause striate palmoplantar
          keratoderma, but only recently, biallelic loss-of-function mutations were associated with a
          new disorder, designated as SAM syndrome (comprising severe dermatitis, multiple allergies and
          metabolic wasting) in two consanguineous families.
        supports: SUPPORT
