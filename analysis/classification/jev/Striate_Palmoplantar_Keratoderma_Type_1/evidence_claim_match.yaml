        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DSG1 Heterozygous Loss-of-Function Variants
        conforms_to: desmosomal_adhesion_failure#Desmosomal Component Loss or Blockade
        biological_scale: MOLECULAR
        description: Heterozygous DSG1 variants introduce a premature termination codon in the extracellular
          domain or the prosequence (nonsense, single-base insertions or deletions, and splice-site changes
          that skip an out-of-frame exon). The mutant transcript is expected to be removed by nonsense-mediated
          decay, and cDNA from affected skin carries no detectable mutant message, so the mutant allele
          drops out and the disease is caused by haploinsufficiency. An early in-frame exon-skipping splice
          variant that removes part of the first extracellular domain, and a single missense allele, show
          that loss of adhesive function without loss of protein can produce the same phenotype.
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          zygosity: HETEROZYGOUS
        genes:
        - preferred_term: DSG1
          term:
            id: hgnc:3048
            label: DSG1
        molecular_functions:
        - preferred_term: desmoglein 1 cell-cell adhesion mediator activity
          term:
            id: GO:0098632
            label: cell-cell adhesion mediator activity
          modifier: DECREASED
        cell_types:
        - preferred_term: Keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
      selected_evidence:
        snippet: All were heterozygotic mutations in the extracellular domain leading to a truncated protein,
          due either to an addition or deletion of a single base, or a base change resulting in a stop
          codon.
        supports: SUPPORT
