          recurs in unrelated families. One family with a homozygous hypomorphic splice allele (c.685-3T>A)
          also had mild, non-syndromic striate PPK rather than SAM syndrome, so the phenotype follows
          the residual DSG1 dose rather than the number of mutant alleles.
      selected_evidence:
        snippet: Mutation analysis resulted in the identification of one recurrent mutation (p.R26X) and
