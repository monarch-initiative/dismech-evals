  73932f8cc9dd1694e0ce6382ed2a3161eba7dc59e03ccb83aeaabd88ebaf7598:
    claim:
      about:
        disease:
          name: Sturge-Weber Syndrome
          disease_term:
            preferred_term: Sturge-Weber syndrome
            term:
              id: MONDO:0008501
              label: Sturge-Weber syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sws-presymptomatic-treatment-neuro-outcome
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Neurological Deficits
        prompt: Early seizure onset and drug-resistant seizures are associated with worse cognitive outcome
          in Sturge-Weber syndrome. Does presymptomatic treatment (antiseizure medication and/or low-dose
          aspirin started before the first seizure in high-risk infants) reduce seizure burden and protect
          neurological and cognitive outcome, or does it merely delay onset?
        rationale: Cohort data link early, poorly controlled seizures to more severe cognitive impairment,
          and seizures can further worsen cortical perfusion in a vicious cycle. If presymptomatic treatment
          interrupts that cycle, the risk/benefit balance of treating clinically silent infants shifts,
          but this has not been established in a controlled prospective study.
        proposed_experiments:
        - experiment_id: sws-presymptomatic-rct
          name: Presymptomatic treatment trial in high-risk infants
          description: Prospective controlled trial in infants with a high-risk V1 port-wine stain and
            imaging/EEG evidence of leptomeningeal involvement, randomizing to presymptomatic antiseizure
            medication and/or low-dose aspirin versus treatment at first seizure, with long-term neurodevelopmental
            follow-up.
          readouts:
          - name: Age at first seizure and seizure control
            target: pathophysiology#Seizures
          - name: Neurodevelopmental and cognitive scores
            target: pathophysiology#Neurological Deficits
          - name: Stroke-like episode frequency
            target: pathophysiology#Neurological Deficits
          decision_criterion: A significant improvement in cognitive outcome without prohibitive treatment
            harm would support presymptomatic treatment.
          would_support:
          - pathophysiology#Neurological Deficits
          - pathophysiology#Seizures
      selected_evidence:
        snippet: An early age at seizure onset and those with drug-resistant seizures had more severe
          degree of mental subnormality
        supports: SUPPORT
