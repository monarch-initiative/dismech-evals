      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: vulnerability_precipitant_model
        hypothesis_label: Delirium as the product of baseline vulnerability multiplied by an acute precipitant
        status: CANONICAL
        description: 'The multifactorial model is the organizing framework for delirium and the one this
          entry''s pathograph is built on: predisposing factors (age, dementia, frailty, sensory impairment)
          set the threshold, and precipitating insults (infection, surgery, drugs, metabolic derangement)
          cross it. Its strength is that it explains why a trivial insult suffices in one patient and
          a series of major ones is needed in another, and why single-target interventions fail while
          multicomponent ones work. Its weakness as a *mechanistic* model is that it is a risk architecture
          rather than a molecular pathway — it says which combinations produce delirium, not what the
          brain does when they do.'
      selected_evidence:
        snippet: Available data suggest that numerous pathological factors may serve as precipitants for
          delirium, each having differential effects depending on patient-specific patient physiological
          characteristics (substrate).
        supports: SUPPORT
    origin:
