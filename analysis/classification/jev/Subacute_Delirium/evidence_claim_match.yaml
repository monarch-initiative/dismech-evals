      assertion_type: AnimalModel
      assertion:
        name: LPS-induced neuroinflammation and cognitive impairment in mice
        species: Mouse
        genotype: Wild-type C57BL/6J challenged with lipopolysaccharide
        publication: PMID:30962497
        description: 'The dominant experimental proxy for infection-triggered delirium. Lipopolysaccharide
          produces sickness behaviour with cognitive impairment alongside hippocampal microglial activation,
          neuronal loss, and a shift in the cytokine milieu — TNF-alpha, IL-1beta, PGE2 and nitric oxide
          up, IL-4 and IL-10 down — with NF-kB pathway activation. The model earns its place in this entry
          because it is not merely descriptive: a TLR4-specific inhibitory peptide prevents both the neuroinflammation
          and the cognitive impairment, which makes the inflammatory step causal rather than correlated.'
        modeled_mechanisms:
        - target: Microglial Activation and Neuroinflammation
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Reproduces the systemic-insult-to-microglial-activation step directly, with the
            hippocampal cellular and cytokine readouts that cannot be obtained in patients, and with a
            TLR4 blockade arm that establishes the direction of causation.
          limitations: The behavioural readouts are Morris water maze and passive avoidance — memory tasks,
            not measures of attention or awareness, which are what define human delirium. The LPS challenge
            is also an acute bolus in a healthy young animal, so the model speaks to the precipitant without
            the reduced-reserve substrate that the human syndrome requires; the ME7 models curated elsewhere
            in this entry supply that half.
          readouts:
          - name: Hippocampal microglial activation (IBA-1) and neuronal loss (MAP-2)
            target: Microglial Activation and Neuroinflammation
            direction: INCREASED
            interpretation: Microglial activation with concurrent neuronal loss in the hippocampus is
              the cellular signature this node asserts.
          - name: Cognitive impairment after TLR4 blockade
            target: Microglial Activation and Neuroinflammation
            direction: ABOLISHED
            interpretation: Preventing the deficit by blocking the receptor that initiates the inflammatory
              cascade is what makes the model causal rather than descriptive.
      selected_evidence:
        snippet: These data suggest that LPS induced cognitive impairment and neuroinflammation via microglia
          activation by activating the NF-kB signaling pathway
        supports: SUPPORT
