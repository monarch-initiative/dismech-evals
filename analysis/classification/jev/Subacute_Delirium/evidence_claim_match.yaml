          name: Subacute Delirium
          disease_term:
            preferred_term: subacute delirium
            term:
              id: MONDO:0004629
              label: subacute delirium
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Protracted and Persistent Course
        biological_scale: ORGANISM
        description: 'The node that gives this entry its name. Where a classical delirium declares itself
          in hours and resolves with its precipitant, the subacute presentation evolves over days and
          often does not resolve on the expected timescale: among older hospital patients who become delirious,
          nearly half are still delirious at discharge and a fifth remain so at six months. Because the
          presentation is gradual and the deficits — inattention, disorientation, impaired memory — are
          the ones dementia also produces, the subacute form is preferentially misread as an evolving
          dementia rather than as an acute brain state with a treatable cause.'
      selected_evidence:
        snippet: The outcomes (mortality, nursing home placement, function, cognition) of patients with
          PerD were consistently worse than the outcomes of patients who had recovered from delirium.
        supports: SUPPORT
