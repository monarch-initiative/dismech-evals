      assertion_type: Diagnosis
      assertion:
        name: Search for the precipitating cause
        description: There is no diagnostic test for delirium itself; the diagnostic work is identifying
          what precipitated it. Because delirium can be the presenting feature of a medical emergency,
          screening for acute physiological disturbance — hypoxaemia, hypoglycaemia, hypercapnia — precedes
          any elaborate work-up, and testing is targeted by history and examination rather than run as
          a battery.
      selected_evidence:
        snippet: First, because delirium can be the harbinger of a medical emergency, every patient presenting
          with delirium should be screened for acute physiologic disturbance such as hypoxemia, low blood
          glucose, and high arterial carbon dioxide.
        supports: SUPPORT
