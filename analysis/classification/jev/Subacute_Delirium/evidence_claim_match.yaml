        description: 'Relative cholinergic deficiency with dopaminergic excess is the classical proximate
          account, and it remains the best explanation for drug-precipitated delirium: anticholinergic
          and dopaminergic agents are among the most reliable precipitants, and their withdrawal is part
          of effective management. It is curated as a real node with a failed therapeutic corollary —
          neither cholinesterase inhibition nor dopamine-receptor blockade shortened delirium in randomized
          trials — so the imbalance should not be read as a validated drug target.'
