              label: subacute delirium
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cholinergic_dopaminergic_imbalance_model
        hypothesis_label: Relative cholinergic deficiency with dopaminergic excess
        status: ALTERNATIVE
        description: The oldest mechanistic account of delirium, motivated by the deliriogenic potency
          of anticholinergic and dopaminergic drugs. It is retained here as ALTERNATIVE rather than CANONICAL
          because its two strongest predictions have failed. Therapeutically, augmenting cholinergic transmission
          with rivastigmine did not shorten delirium in critically ill patients and the trial was stopped
          early for excess mortality in the treatment arm; and dopamine-receptor blockade with haloperidol
          or ziprasidone did not alter delirium duration against placebo. The neurotransmitter disturbance
          is real and is the best explanation for drug-precipitated delirium; what the negative trials
          refute is that correcting it downstream reverses the syndrome.
      selected_evidence:
        snippet: Impaired cholinergic neurotransmission seems to have an important role in the development
          of delirium.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/0
