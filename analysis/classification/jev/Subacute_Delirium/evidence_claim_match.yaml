              label: subacute delirium
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuronal and Astrocytic Injury
        biological_scale: CELLULAR
        description: The arm that makes delirium more than a transient state. Astrocytic (S100B) and axonal
          (neurofilament light) injury markers rise in association with delirium, and at the clinical
          level a longer duration of delirium predicts worse global cognition and executive function at
          3 and 12 months, with delirium independently associated with long-term cognitive decline across
          studies. The direction of causation is not fully settled — delirium is at minimum a marker of
          a vulnerable brain — but the dose-response with delirium duration is what motivates curating
          injury as a distinct node.
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
      selected_evidence:
        snippet: A longer duration of delirium was independently associated with worse global cognition
          at 3 and 12 months (P=0.001 and P=0.04, respectively) and worse executive function at 3 and
          12 months (P=0.004 and P=0.007, respectively).
        supports: SUPPORT
