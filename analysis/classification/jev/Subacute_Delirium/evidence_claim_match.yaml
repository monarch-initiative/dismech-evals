        biological_scale: ORGANISM
        description: The predisposing half of the model. Advanced age, dementia or milder cognitive impairment,
          frailty, sensory impairment, and comorbidity burden lower the insult required to produce delirium.
          This node is a state of the patient before any precipitant arrives; it does not itself produce
          delirium, and it is the reason the same drug dose is inert in one patient and deliriogenic in
          another.
      selected_evidence:
        snippet: The risk factors of delirium included frailty (odds ratio = 2.05), physical restraints
          (5.01), prior falls (1.99), severe illness (1.32) (evaluated using the Acute Physiology and
          Chronic Health Evaluation II), and cognitive impairment (2.61).
