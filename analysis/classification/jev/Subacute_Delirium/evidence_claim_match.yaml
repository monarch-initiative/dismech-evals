      assertion_type: Environmental
      assertion:
        name: Physical restraint use
        description: Physical restraints carry the largest odds ratio of any risk factor in the contemporary
          meta-analysis of hospitalized older patients, and are iatrogenic and modifiable. The direction
          of causation is not fully separable from confounding by indication — agitated patients get restrained
          — but restraint use is also a component that multicomponent prevention programs deliberately
          remove.
        effect: Increases risk of delirium in hospitalized older patients
      selected_evidence:
        snippet: The risk factors of delirium included frailty (odds ratio = 2.05), physical restraints
          (5.01), prior falls (1.99), severe illness (1.32) (evaluated using the Acute Physiology and
          Chronic Health Evaluation II), and cognitive impairment (2.61).
        supports: SUPPORT
