          term:
            id: GO:0150076
            label: neuroinflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: TNF-α (50μg/kg) had no impact on performance of normal animals (normal brain homogenate;
          NBH) on working memory (T-maze) but produced acute impairments in ME7 animals similarly challenged.
