      assertion:
        name: Depression
        description: Hypoactive delirium — withdrawal, psychomotor slowing, reduced engagement — is readily
          mistaken for depression, particularly in an older inpatient with a depression history.
        distinguishing_features:
        - Depression does not produce the fluctuating inattention or the altered level of consciousness
          that define delirium, and lacks an acute precipitant on work-up. Formal cognitive testing that
          demonstrates inattention is the practical discriminator.
      selected_evidence:
        snippet: hypoactive delirium prevents participation in nursing interventions, physical therapy,
          and occupational therapy
        supports: SUPPORT
