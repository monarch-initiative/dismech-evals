        description: 'An alpha-2 adrenergic agonist, and the one pharmacological agent in this entry with
          a positive randomized result. In a multicentre, double-blind, placebo-controlled trial across
          nine ICUs, non-intubated critically ill adults with hyperactive delirium randomized to dexmedetomidine
          did better than placebo on a joint model of agitation duration, delirium duration, and the need
          for intubation and deep sedation; the trial was stopped for efficacy at the preplanned interim
          analysis. The effect is real but should not be overread: the median reduction in agitation was
          about an hour, the other key secondary outcomes were similar between groups, and the population
          is a specific one — non-intubated patients with the hyperactive presentation, which is the minority
          form in critical illness.'
