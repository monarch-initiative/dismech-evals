      assertion_type: AnimalModel
      assertion:
        name: Systemic TNF-alpha challenge on a neurodegenerative background (ME7 prion mouse)
        species: Mouse
        genotype: ME7 prion-inoculated C57BL/6, challenged with intraperitoneal TNF-alpha
        publication: PMID:27633985
        description: The model that operationalizes vulnerability rather than the insult. An identical
          systemic cytokine challenge is given to normal mice and to mice with established prion neurodegeneration;
          only the latter show acute working-memory impairment, with higher hippocampal and hypothalamic
          cytokine transcription despite equivalent plasma TNF-alpha and CCL2. This is the vulnerability
          × precipitant model reduced to a single controlled experiment.
        modeled_mechanisms:
        - target: Microglial Activation and Neuroinflammation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Reproduces the conditional central inflammatory response — the same peripheral
            stimulus, a larger central response and an acute cognitive deficit only on the degenerating
            background.
          limitations: The cognitive readout is T-maze working memory, not the attentional disturbance
            that defines human delirium, and the background pathology is prion disease rather than the
            Alzheimer-type pathology that predisposes most human patients. The model also shows sickness
            behaviour that overlaps with, but is not, delirium.
          readouts:
          - name: T-maze working memory performance after systemic TNF-alpha
            target: Microglial Activation and Neuroinflammation
            direction: DECREASED
            interpretation: Acute cognitive impairment appearing only on the degenerating background is
              the model's operational stand-in for delirium.
      selected_evidence:
        snippet: Systemic inflammation caused by infection, trauma or co-morbidity can alter the brain's
          inflammatory status, produce acute cognitive impairments, such as delirium, and drive new pathology
          and accelerated decline.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
