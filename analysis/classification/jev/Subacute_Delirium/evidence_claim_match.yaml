      assertion_type: Pathophysiology
      assertion:
        name: Cortical Feedback Connectivity Loss
        biological_scale: ORGANISM
        description: The circuit-level state of the delirious brain and the proximate substrate of its
          cardinal sign. Dynamic causal modelling of auditory evoked responses shows reduced top-down
          (feedback) connectivity during delirium, with increased intrinsic inhibitory tone in the same
          region; the reduction scales with delirium severity and with systemic inflammation. Framed predictively,
          the delirious cortex fails to impose top-down expectations on sensory input — which is what
          inattention, disorganized thinking, and perceptual disturbance look like from the inside.
        locations:
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
      selected_evidence:
        snippet: Delirium is associated with decreased feedback cortical connectivity, possibly resulting
          from increased intrinsic inhibitory tone.
        supports: SUPPORT
