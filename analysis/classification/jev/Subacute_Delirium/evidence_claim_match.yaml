      assertion_type: Treatment
      assertion:
        name: Multicomponent non-pharmacological delirium prevention
        description: The Hospital Elder Life Program and its descendants apply standardized protocols
          to six modifiable risk factors — cognitive impairment, sleep deprivation, immobility, visual
          impairment, hearing impairment, and dehydration. In the original controlled study delirium developed
          in 9.9% of the intervention group versus 15.0% of usual care, and pooled across subsequent studies
          the odds of incident delirium fall by roughly half. It is the only intervention with a consistent
          effect on incidence, and it is mechanistically a treatment of the predisposing node rather than
          of any molecular target — which is exactly what the multifactorial model predicts would work.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Delirium developed in 9.9 percent of the intervention group as compared with 15.0 percent
          of the usual-care group, (matched odds ratio, 0.60; 95 percent confidence interval, 0.39 to
          0.92).
        supports: SUPPORT
