      assertion_type: DifferentialDiagnosis
      assertion:
        name: Dementia
        description: The differential that matters most for the subacute presentation, because an insidious
          onset over days to weeks removes the abruptness that usually separates the two. Both produce
          inattention, disorientation, and memory impairment.
        distinguishing_features:
        - Delirium is distinguished by its acute change from a known baseline, its fluctuating course
          across the day, and disturbance of the level of consciousness — none of which characterize uncomplicated
          dementia. Establishing the patient's baseline from an informant is the decisive step, and dementia
          is itself the strongest predisposing factor, so the two frequently coexist as delirium superimposed
          on dementia.
      selected_evidence:
        snippet: To differentiate delirium from dementia, obtaining the history is critical to establish
          the patient's baseline, determine the acuity of mental status change and fluctuations typical
          of delirium, and to search for etiologic clues.
        supports: SUPPORT
