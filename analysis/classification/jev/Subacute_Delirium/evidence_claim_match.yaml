              label: subacute delirium
        context: []
      assertion_type: Treatment
      assertion:
        name: Treatment of the precipitating illness and withdrawal of deliriogenic drugs
        description: 'The mainstay of management of established delirium. No agent has been shown to shorten
          delirium in an unselected critically ill population — the antipsychotic and cholinesterase-inhibitor
          trials curated here are both negative — so treatment consists of identifying and correcting
          the precipitant, reducing sedative and analgesic burden, and applying the same non-pharmacological
          measures used in prevention. Dexmedetomidine is the exception that defines the rule: it benefited
          the specific population of non-intubated patients with hyperactive delirium, and is curated
          separately below.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Drug reduction for sedation and analgesia and non-pharmacological approaches are recommended.
        supports: SUPPORT
