              label: subacute delirium
        context: []
      assertion_type: Genetic
      assertion:
        name: APOE
        notes: 'APOE is the most consistently reported common-variant susceptibility locus for delirium,
          acting as a modifier of vulnerability rather than a cause: no APOE genotype produces delirium
          without a precipitant, and no delirium requires one. It is curated as SUSCEPTIBILITY for that
          reason. The same meta-analysis reports a multi-trait analysis with Alzheimer disease identifying
          five delirium risk loci and plasma proteins predicting incident delirium up to sixteen years
          ahead — the proteomic counterpart of the reduced-reserve node curated in the pathograph. Earlier
          candidate associations at the muscarinic receptor genes CHRM2 and CHRM4 are deliberately not
          curated: they are not among the loci reported by that meta-analysis.'
        gene_term:
          preferred_term: APOE
          term:
            id: hgnc:613
            label: APOE
        relationship_type: SUSCEPTIBILITY
      selected_evidence:
        snippet: Here we conducted a genetic meta-analysis on delirium using multi-ancestry data from
          the UK Biobank, FinnGen, All of Us Research Program and Michigan Genomics Initiative cohorts
          (n = 1,059,130; 11,931 cases), yielding the Apolipoprotein E (APOE) gene as a strong delirium
          risk factor independently of dementia.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
