            term:
              id: MONDO:0004629
              label: subacute delirium
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: neuroinflammatory_model
        hypothesis_label: Peripheral inflammation reaching the CNS through a permeable blood-brain barrier
        status: CANONICAL
        description: 'The best-evidenced molecular account of how a systemic insult becomes a brain state.
          Peripheral pro-inflammatory signalling — IL-6 prominently — is associated with delirium risk
          before the insult and with delirium severity after it, and the same studies tie the CNS compartment
          of that signalling to measured blood-brain barrier permeability. Animal work adds the crucial
          conditional: the same cytokine challenge is cognitively inert in a normal brain and disabling
          in a degenerating one, which is the vulnerability × precipitant model expressed at the level
          of a single molecule.'
      selected_evidence:
        snippet: Higher preoperative interleukin-6 was associated with postoperative delirium with a standardised
          mean difference (95% confidence interval) of 0.33 (0.11-0.56) and P=0.003.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
