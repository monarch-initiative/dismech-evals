      assertion:
        name: Microglial Activation and Neuroinflammation
        biological_scale: CELLULAR
        description: 'Central amplification of the peripheral signal. Microglia switch from a surveillant
          to an activated phenotype and release IL-1beta, TNF-alpha, and other mediators locally; astrocytic
          activation accompanies it, and is reflected clinically in the S100B rise curated under biochemical.
          The conditional nature of this node is what distinguishes delirium from ordinary sickness behaviour:
          in animals, an identical systemic cytokine challenge leaves working memory intact on a normal
          background and impairs it acutely on a degenerating one.'
