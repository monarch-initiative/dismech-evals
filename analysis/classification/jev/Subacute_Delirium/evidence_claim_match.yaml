        status: CANONICAL
        description: 'The circuit-level endpoint on which the other models converge: whatever the upstream
          insult, the delirious brain shows breakdown of the long-range connectivity that supports attention
          and predictive processing. Electrophysiological modelling localizes this to reduced feedback
          connectivity, with the reduction scaling with delirium severity and with systemic inflammation
          — which is what makes it a shared endpoint rather than a parallel story.'
      selected_evidence:
        snippet: DCM showed that delirium was associated with decreased left-sided superior temporal gyrus
          (l-STG) to auditory cortex feedback connectivity.
        supports: SUPPORT
