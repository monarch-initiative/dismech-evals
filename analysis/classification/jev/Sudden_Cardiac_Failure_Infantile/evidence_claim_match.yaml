            id: UBERON:0002349
            label: myocardium
      selected_evidence:
        snippet: PPA2 encodes the mitochondrial pyrophosphatase, which hydrolyzes inorganic pyrophosphate
          into two phosphates. This is an essential activity for many biosynthetic reactions and for energy
          metabolism of the cell.
        supports: SUPPORT
