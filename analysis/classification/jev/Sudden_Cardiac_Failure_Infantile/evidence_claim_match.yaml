              id: MONDO:0014973
              label: sudden cardiac failure, infantile
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Viral myocarditis
        disease_term:
          preferred_term: viral myocarditis
          term:
            id: MONDO:0023161
            label: viral myocarditis
        description: Infants and young children with biallelic PPA2 deficiency frequently present with
          acute heart failure, cardiogenic shock, or sudden cardiac arrest shortly after a febrile viral
          respiratory or gastrointestinal illness, and a subset show mild myocardial inflammatory infiltrates
          on autopsy or biopsy, closely mimicking acute viral myocarditis.
        distinguishing_features:
        - Prominent focal or mid-myocardial collagen fibrosis (present in ~88% of evaluated PPA2 cases
          and always accompanying any inflammatory infiltrate) on cardiac MRI or histology
        - Familial recurrence of sudden unexpected cardiac arrest or acute heart failure in siblings
        - Identification of biallelic pathogenic variants in PPA2 on molecular genetic testing
      selected_evidence:
        snippet: Irrespective of the main clinical presentation, myocardial fibrosis was reported in 15
          cases in our cohort, either at necropsy or on cardiac MRI, whereas an inflammatory infiltrate
          was noted in only 6 cases and always in combination with fibrosis. Thus, fibrosis may help discriminate
          between PPA2-related cardiomyopathy and viral myocarditis when individuals present with acute
          heart failure.
        supports: SUPPORT
