          replacement fibrosis (occasionally accompanied by mild secondary inflammatory infiltrates).
          Myocardial fibrosis is the histopathological and cardiac MRI hallmark of biallelic PPA2 deficiency,
          observed in nearly all examined hearts (15 of 17 evaluated cases in the 2021 international cohort)
          and often detectable on cardiac MRI even in clinically asymptomatic siblings prior to arrhythmic
          or heart-failure decompensation.
