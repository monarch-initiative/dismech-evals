              label: sudden cardiac failure, infantile
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: 'Biallelic PPA2 deficiency carries an exceptionally high mortality rate in infancy,
          early childhood, and adolescence: in the largest international cohort of 34 affected individuals,
          28 (82%) died—23 before 2 years of age and 5 between 14 and 16 years of age—from sudden unexpected
          cardiac arrest or acute heart failure. Survivors require lifelong cardiology surveillance, strict
          avoidance of alcohol and fever triggers, implantable cardioverter-defibrillator placement, or
          orthotopic heart transplantation, and may develop progressive peripheral axonal neuropathy,
          external ophthalmoplegia, or cerebellar ataxia in adulthood.'
      selected_evidence:
        snippet: Among the 34 individuals, only 6 remain alive. Twenty-three died before the age of 2
          years while five died between 14 and 16 years. Within these 28 cases, 15 died of sudden cardiac
          arrest and 13 of acute heart failure.
        supports: SUPPORT
