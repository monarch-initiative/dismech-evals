        context: []
      assertion_type: Genetic
      assertion:
        name: PPA2
        gene_term:
          preferred_term: PPA2
          term:
            id: hgnc:28883
            label: PPA2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Positive
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        features: Biallelic pathogenic variants in PPA2 (12 exons, chromosome 4q24) cause autosomal recessive
          infantile sudden cardiac failure and the broader PPA2-related sudden cardiac death and cardiomyopathy
          spectrum. Because complete loss of mitochondrial inorganic pyrophosphatase is incompatible with
          cell survival, biallelic null genotypes have not been observed; affected individuals carry either
          two hypomorphic missense variants or one missense variant in trans with a nonsense, frameshift,
          splice-site, or multi-exon deletion allele. The most frequent recurrent pathogenic missense
          allele in European-ancestry cohorts is c.514G>A (p.Glu172Lys), identified in 11 of 20 families
          in the 2021 international series. Homozygosity for c.500C>T (p.Pro167Leu) causes a severe neonatal/early-infantile
          presentation with lactic acidosis, seizures, hypotonia, and lethal arrhythmia, whereas compound
          heterozygosity pairing c.683C>T (p.Pro228Leu; 24%–28% residual activity) with c.514G>A (p.Glu172Lys;
          5%–10% residual activity) permits survival into adolescence or adulthood with extreme sensitivity
          to alcohol-induced sudden cardiac arrest (allelic disorder MONDO:0014974).
        variants:
        - name: c.514G>A (p.Glu172Lys)
          description: Most frequent recurrent pathogenic PPA2 missense allele in European-ancestry cohorts
            (identified in 11 of 20 families in the 2021 international series). Recombinant p.Glu172Lys
            retains 5%–10% residual inorganic pyrophosphatase activity; compound heterozygosity with a
            severe missense or truncating allele causes infantile sudden cardiac failure (MONDO:0014973),
            whereas compound heterozygosity with p.Pro228Leu causes adolescent/adult alcohol-induced sudden
            cardiac failure (MONDO:0014974).
        - name: c.500C>T (p.Pro167Leu)
          description: Severe hypomorphic missense variant retaining 5%–10% residual enzymatic activity;
            homozygosity causes neonatal/early-infantile lactic acidosis, seizures, hypotonia, cardiac
            arrhythmia, and fatal heart failure within the first months of life.
        - name: c.683C>T (p.Pro228Leu)
          description: Milder hypomorphic missense allele retaining 24%–28% residual activity in recombinant
            enzyme assays across PPi substrate concentrations of 18–500 μmol/L.
        - name: c.379C>T (p.Arg127Cys)
          description: De novo pathogenic missense variant identified in trans with a maternal nonsense
            PPA2 allele (c.524C>G; p.Ser175*) in a patient with infantile sudden cardiac failure.
      selected_evidence:
        snippet: Altogether these data demonstrate that PPA2 is an essential gene in yeast and that biallelic
          mutations in PPA2 cause a mitochondrial disease leading to sudden cardiac arrest in infants.
        supports: SUPPORT
