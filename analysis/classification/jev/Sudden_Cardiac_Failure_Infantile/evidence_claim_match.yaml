      assertion_type: DifferentialDiagnosis
      assertion:
        name: Sudden cardiac failure, alcohol-induced
        disease_term:
          preferred_term: sudden cardiac failure, alcohol-induced
          term:
            id: MONDO:0014974
            label: sudden cardiac failure, alcohol-induced
        description: Sudden cardiac failure, alcohol-induced (SCFAI; OMIM:617223; MONDO:0014974) is an
          allelic autosomal recessive disorder caused by biallelic hypomorphic variants in PPA2—classically
          compound heterozygosity pairing the milder hypomorphic allele p.Pro228Leu (24%–28% residual
          enzymatic activity) in trans with a lower-activity allele such as p.Glu172Lys (5%–10% residual
          activity)—in which sudden cardiac arrest is triggered in adolescence or adulthood by ingestion
          of small amounts of alcohol.
        distinguishing_features:
        - SCFI (MONDO:0014973) typically presents in the neonatal, infantile, or early-childhood period
          (often triggered by febrile viral illness) in individuals whose biallelic PPA2 genotypes confer
          lower total residual enzymatic activity (e.g., 5%–10% for p.Pro167Leu and p.Glu172Lys)
        - SCFAI (MONDO:0014974) typically presents in adolescence or adulthood with sudden cardiac arrest
          precipitated by small amounts of alcohol in individuals carrying at least one milder hypomorphic
          allele with higher residual PPA2 activity (~24%–28% for p.Pro228Leu, often in compound heterozygosity
          with p.Glu172Lys)
      selected_evidence:
        snippet: Compared to wild-type, the p.Pro167Leu and p.Glu172Lys variants showed 5%–10% residual
          activity at PPi substrate concentrations 18–500 μmol/L. The p.Pro228Leu variant had a residual
          activity of 24%–28% in this concentration range compared to wild-type (Figure 3D).
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
