        description: 'Biallelic hypomorphic missense variants or compound heterozygous missense/truncating
          variants in PPA2 severely reduce mitochondrial inorganic pyrophosphatase activity in the mitochondrial
          matrix. Because PPA2 catalyzes the hydrolysis of inorganic pyrophosphate (PPi) into two orthophosphate
          ions, reduced PPA2 activity impairs PPi clearance during high-flux mitochondrial biosynthetic
          reactions (DNA, RNA, protein, and lipid synthesis) and short-chain fatty-acid/acetate activation.
          Residual enzymatic activity of recombinant mutant PPA2 proteins correlates with age at onset
          and clinical severity: variants associated with neonatal or early infantile lethality (such
          as p.Pro167Leu and p.Glu172Lys) retain only 5%–10% wild-type activity, whereas variants permissive
          for survival into adolescence (such as p.Pro228Leu) retain 24%–28% activity. Furthermore, missense
          PPA2 variants exhibit temperature sensitivity in vitro, so febrile viral illnesses or modest
          ethanol/acetic acid loads acutely overwhelm residual PPi hydrolysis capacity.'
