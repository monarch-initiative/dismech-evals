      assertion_type: Pathophysiology
      assertion:
        name: Bronchiolitis Obliterans and Progressive Airflow Obstruction
        biological_scale: TISSUE
        conforms_to: fibrotic_response#Architectural Distortion and Organ Dysfunction
        description: 'Obliterated small airways and stiffened parenchyma translate into measurable physiology:
          rising lung resistance, falling compliance, and a mixed obstructive-restrictive spirometric
          pattern that declines year on year. The pattern is mixed, not purely obstructive, in every source
          that reports it - worth stating because the node''s name emphasises obstruction. This is the
          dominant cause of long-term disability and death in survivors, and it is what the clinical literature
          calls mustard lung. Roughly 42.5% of exposed Iranian veterans have pulmonary involvement, with
          cough and dyspnoea the leading complaints.'
        locations:
        - preferred_term: bronchiole
          term:
            id: UBERON:0002186
            label: bronchiole
      selected_evidence:
        snippet: Pulmonary function testing demonstrated a time-dependent increase in lung resistance,
          as well as a decrease in lung compliance.
        supports: SUPPORT
