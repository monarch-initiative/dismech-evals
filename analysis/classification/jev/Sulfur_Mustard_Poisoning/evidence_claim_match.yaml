  8a8480d4c5029899f5fa1d00e2f08fd30e0383afc2cb329e6c3e8983a4461edc:
    claim:
      about:
        disease:
          name: Sulfur Mustard Poisoning
          disease_term:
            preferred_term: sulfur mustard poisoning
            term:
              id: MONDO:0800387
              label: sulfur mustard poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Glutathione Depletion and Oxidative Stress
        biological_scale: MOLECULAR
        description: 'Sulfur mustard depletes intracellular glutathione by direct conjugation to the electrophile
          and, in chronically exposed human lung, by downregulation of glutathione reductase, the enzyme
          that regenerates reduced glutathione from its disulfide. The cell therefore loses its principal
          antioxidant buffer at the moment it most needs it, and reactive oxygen and nitrogen species
          accumulate. This arm is largely independent of the DNA-alkylation arm and synergistic with it:
          both converge on the same dying cell. Human mustard lung shows the paradoxical signature of
          the pathway under strain - glutathione peroxidases, transferases and synthetase are all overexpressed
          while glutathione reductase is strongly suppressed and the substrate they need is scarce.'
        biological_processes:
        - preferred_term: glutathione metabolic process
          term:
            id: GO:0006749
            label: glutathione metabolic process
          modifier: DECREASED
        - preferred_term: cellular response to oxidative stress
          term:
            id: GO:0034599
            label: cellular response to oxidative stress
          modifier: INCREASED
        molecular_functions:
        - preferred_term: glutathione reductase activity
          term:
            id: GO:0004362
            label: glutathione-disulfide reductase (NADPH) activity
          modifier: DECREASED
      selected_evidence:
        snippet: GSH depletion induced by GSR downregulation may be a major mechanism of SM toxicity on
          human lung.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29676192
      reference_title: Sulfur mustard triggers oxidative stress through glutathione depletion and altered
        expression of glutathione-related enzymes in human airways.
      evidence_source: HUMAN_CLINICAL
      explanation: The authors' own statement that glutathione depletion is a major toxicity mechanism,
        not merely a correlate.
