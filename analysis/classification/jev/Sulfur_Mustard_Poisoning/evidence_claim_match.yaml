            term:
              id: MONDO:0800387
              label: sulfur mustard poisoning
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Biomarker confirmation of exposure
        description: 'Four biomarker classes confirm sulfur mustard retrospectively, and they have different
          detection windows: hydrolysis and oxidation products and beta-lyase metabolites are short-lived,
          DNA adducts remain detectable in urine for about 30 days, and N-terminal valine adducts on haemoglobin
          persist beyond 90 days. Concentrations track clinical severity, so the assay is prognostic as
          well as confirmatory. This is the test that identified an accidental exposure to an unknown
          agent after the fact.'
        diagnosis_term:
          preferred_term: laboratory procedure
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
      selected_evidence:
        snippet: The concentrations of the biomarkers in specimens revealed a good correlation with the
          severity of the patient's symptom.
        supports: SUPPORT
