  91e03a22c2181d257bf1ea1be47d4b0cb4882131046105303451ae4a8f192453:
    claim:
      about:
        disease:
          name: Sulfur Mustard Poisoning
          disease_term:
            preferred_term: sulfur mustard poisoning
            term:
              id: MONDO:0800387
              label: sulfur mustard poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PARP1 Hyperactivation and NAD+ Depletion
        biological_scale: MOLECULAR
        description: 'PARP1 detects DNA strand breaks and responds by transferring ADP-ribose units from
          NAD+ onto nuclear acceptor proteins. At the lesion densities sulfur mustard produces, this repair
          response becomes the injury: PARP1 consumes the cellular NAD+ pool, and because NAD+ is an obligate
          cofactor for glycolysis, the TCA cycle and the electron transport chain, ATP synthesis fails
          with it. The consequence is a switch in death mode - a cell with modest damage apoptoses or
          repairs, a cell with severe damage runs out of energy and dies by necrosis. Necrosis rather
          than apoptosis is what makes the lesion inflammatory and slow to heal.'
        biological_processes:
        - preferred_term: protein poly-ADP-ribosylation
          term:
            id: GO:0070212
            label: protein poly-ADP-ribosylation
          modifier: INCREASED
        - preferred_term: NAD+ consumption by poly-ADP-ribosylation
          term:
            id: GO:0019677
            label: NAD+ catabolic process
          modifier: INCREASED
      selected_evidence:
        snippet: In case of severe DNA injury, overactivation of PARP-1 depletes the cellular stores of
          NAD+, an essential cofactor in the glycolytic pathway, the tricarboxylic acid cycle, and the
          mitochondrial electron transport chain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21218101
      reference_title: Acute and delayed sulfur mustard toxicity; novel mechanisms and future studies.
      evidence_source: OTHER
      explanation: Supports PARP1 overactivation as the mechanism of NAD+ depletion and names the pathways
        that depend on it.
