      assertion_type: Treatment
      assertion:
        name: Macrolide and Inhaled Corticosteroid Therapy for Bronchiolitis Obliterans
        description: Long-term azithromycin combined with an inhaled corticosteroid and long-acting beta-2
          agonist, plus N-acetylcysteine, is the regimen used for established mustard-related bronchiolitis
          obliterans. Over five years of spirometry the rate of FEV1 decline in treated bronchiolitis
          obliterans patients was not significantly different from that in COPD patients treated to guideline,
          which the authors read as evidence the regimen works. Note this is a comparison against a different
          disease's treated course, not against untreated bronchiolitis obliterans, so it is suggestive
          rather than controlled.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
