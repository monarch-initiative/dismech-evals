  af3e62b33880f82d6f671ac6e838f06cabf6f7c5f486e87f13c99f3811339d6a:
    claim:
      about:
        disease:
          name: Sulfur Mustard Poisoning
          disease_term:
            preferred_term: sulfur mustard poisoning
            term:
              id: MONDO:0800387
              label: sulfur mustard poisoning
        context: []
      assertion_type: Genetic
      assertion:
        name: GSTM1
        relationship_type: MODIFIER
        gene_term:
          preferred_term: GSTM1
          term:
            id: hgnc:4632
            label: GSTM1
        notes: 'Homozygous deletion of GSTM1 - the null genotype, common in the general population - removes
          one of the glutathione S-transferases that conjugate the episulfonium electrophile and handle
          the downstream oxidant load. In a cohort of 185 sulfur-mustard-exposed subjects the null genotype
          was over-represented among those with severe or very severe mustard lung. This modifies severity
          in people who have already been exposed; it is not a cause of the disease and confers no risk
          in the absence of exposure.

          The two lines of evidence fit together, though the synthesis is inference rather than a finding
          either study makes: GSTM1 message is upregulated several-fold in mustard-lung airway wall, so
          the isoform is part of the response to the oxidant load, and individuals who carry no copy of
          it at all cannot mount that part of the response. Neither study tests that link directly.'
      selected_evidence:
