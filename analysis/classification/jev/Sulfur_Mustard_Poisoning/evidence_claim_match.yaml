          and IL-17-positive cells accumulate in the inflamed regions of the lung. This persistence is
          the hinge of the whole entry: it is the mechanism by which a single exposure produces disease
          that is still progressing decades later, and it is why the chronic pulmonary disease develops
          in patients whose acute exposure was unremarkable.'
