        context: []
      assertion_type: Treatment
      assertion:
        name: N-Acetylcysteine
        description: A glutathione precursor and direct radical scavenger, used both acutely and in chronic
          pulmonary management. It is the pharmacological agent that maps most directly onto a curated
          mechanism in this entry - the glutathione depletion node - which is the argument for it. A dedicated
          review reports clinical and paraclinical improvement in sulfur mustard bronchiolitis obliterans
          on oral NAC alone or combined with clarithromycin, while the same review and an independent
          one both state there is no validated antidote. Both are recorded below, and the entry does not
          resolve them, because "improves parameters in an established chronic complication" and "is not
          an antidote for the poisoning" are compatible claims about different things.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: N-acetylcysteine
            term:
              id: CHEBI:22198
              label: acetylcysteine
      selected_evidence:
        snippet: However, N-acetyle cysteine (NAC) is recommended, none of them acts as specific or effective
          antidote.
        supports: SUPPORT
