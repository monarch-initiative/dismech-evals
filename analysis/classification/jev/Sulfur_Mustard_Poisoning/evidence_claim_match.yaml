        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sm_delayed_toxicity_mechanism_unknown
        kind: KNOWLEDGE_GAP
        prompt: What sustains sulfur mustard disease for decades after a single exposure, when the agent
          and its metabolites have been cleared within weeks?
        rationale: This is the central unanswered question of the entry. Sulfur mustard metabolites are
          excreted within a few weeks and do not accumulate, so nothing of the original insult is still
          present when the delayed disease emerges. The chain curated here carries the mechanism as far
          as chronic IL-17-dependent inflammation and shows that it persists, but it does not explain
          why it persists rather than resolving as inflammation normally does. Epigenetic perturbation
          has been proposed as the missing step and remains a hypothesis. Until it is settled, the causal
          edge from acute injury to chronic inflammation in this entry is descriptive rather than mechanistic.
        attaches_to:
        - pathophysiology#Chronic IL-17-Dependent Airway Inflammation
      selected_evidence:
        snippet: Unfortunately, it is not clear how mustard gas causes severe multi-organ damage years
          after even a single exposure
        supports: SUPPORT
