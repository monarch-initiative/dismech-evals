        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DNA N7-Guanine Alkylation and Interstrand Crosslinking
        biological_scale: MOLECULAR
        description: The episulfonium ion attacks nucleophilic sites in DNA, predominantly the N7 position
          of deoxyguanosine. Because sulfur mustard is bifunctional, a single molecule can alkylate two
          nucleophiles, producing intrastrand and interstrand DNA crosslinks as well as DNA-protein crosslinks.
          An interstrand crosslink tethers the two strands together and physically blocks the replication
          and transcription machinery, so the lesion is cytotoxic rather than merely mutagenic. Replication
          forks that collide with an unrepaired crosslink generate double-strand breaks.
        biological_processes:
        - preferred_term: interstrand cross-link repair
          term:
            id: GO:0036297
            label: interstrand cross-link repair
          modifier: INCREASED
        - preferred_term: DNA damage response
          term:
            id: GO:0006974
            label: DNA damage response
          modifier: INCREASED
      selected_evidence:
        snippet: it causes DNA replication cessation because it alkylates N7 of a deoxyguanosine residue
          and a cysteine residue
        supports: SUPPORT
