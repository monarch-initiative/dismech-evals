            term:
              id: MONDO:0800387
              label: sulfur mustard poisoning
        context: []
      assertion_type: Treatment
      assertion:
        name: Immediate Skin Decontamination
        description: 'Copious water with neutral soap, and dilute sodium hypochlorite where available,
          removing agent still on the skin. This is the single highest-yield intervention and the only
          one that acts on the lesion before it is fixed: alkylation is complete within minutes, so decontamination
          buys back only the dose that has not yet reacted. Its benefit falls off steeply with delay.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: skin decontamination
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
      selected_evidence:
        snippet: washing after this time is not beneficial
        supports: SUPPORT
