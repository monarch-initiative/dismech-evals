              in every source that reports it - worth stating because the node''s name emphasises obstruction.
              This is the dominant cause of long-term disability and death in survivors, and it is what
              the clinical literature calls mustard lung. Roughly 42.5% of exposed Iranian veterans have
              pulmonary involvement, with cough and dyspnoea the leading complaints.'
