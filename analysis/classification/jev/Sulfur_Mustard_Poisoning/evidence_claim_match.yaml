  5d1ca3bd283ac0bdb9266ef2d357fccf8fb55bc3393275815ec89f9dd8c35714:
    claim:
      about:
        disease:
          name: Sulfur Mustard Poisoning
          disease_term:
            preferred_term: sulfur mustard poisoning
            term:
              id: MONDO:0800387
              label: sulfur mustard poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Malignant Transformation of Chronically Injured Bronchial Epithelium
        biological_scale: CELLULAR
        description: Bronchial epithelium that has been alkylated, is chronically inflamed and is proliferating
          to repair itself carries an elevated risk of malignant transformation. Two lines of evidence
          support this, and neither is as strong as it first looks. In bronchial biopsies, FOXM1 and APOE
          are overexpressed roughly 15-fold and 4-fold - but the study has six exposed patients and five
          controls, excluded anyone with lung cancer, and its authors read APOE the other way, as protective
          against ROS damage in the short term, with the cancer link offered as a hypothesis. Clinically,
          in 719 victims followed for a mean of 38 years, lung fibrosis raised tumour risk about 17.75-fold,
          air trapping about 11.73-fold and bronchiectasis about 10.14-fold, and the lobes with fibrosis
          were the lobes tumours appeared in - but that cohort had no control group. The spatial concordance
          makes the association hard to explain by shared exposure alone; it is not itself a demonstration
          of mechanism.
        biological_processes:
        - preferred_term: DNA damage response
          term:
            id: GO:0006974
            label: DNA damage response
          modifier: DYSREGULATED
        cell_types:
        - preferred_term: bronchial epithelial cell
          term:
            id: CL:0002328
            label: bronchial epithelial cell
      selected_evidence:
        snippet: Expression of FOXM1 and APOE genes in bronchial of the patients was significantly (p
          < 0.001) overexpressed by 14.8316 and 3.9504-folds, respectively.
        supports: SUPPORT
    origin:
