        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sm_haematopoietic_suppression_evidence_thin
        kind: KNOWLEDGE_GAP
        prompt: What is the dose relationship, frequency and time course of haematopoietic suppression
          after sulfur mustard exposure, and is there a primary clinical series that reports it?
        rationale: 'Haematopoietic suppression is now curated as a node, but on evidence thin enough that
          the gap is worth stating rather than closing. The only quotable statement in this entry''s cache
          is a review''s secondhand assertion (PMID:40034085) that sulfur mustard causes blood cytopenia
          and bone marrow destruction, attributed to another author and carrying no counts, frequency,
          dose relationship or time course. Nothing else reaches it: the radiation-comparison workshop
          report (PMID:37852927) records only that the case could have been made to include bone-marrow
          myelosuppression in that meeting''s scope, which is a statement about the meeting rather than
          about the toxicity.

          An earlier draft of this discussion, and of the entry''s notes, asserted that no cached source
          reported it quotably at all. That was false - the review sentence was already in the cache,
          and this entry already quoted the tail of the same sentence elsewhere. Recording the correction
          here because the failure is instructive: a claim about what the cache does not contain is the
          easiest kind of claim to get wrong, and the cheapest to check.

          Closing this properly needs a primary clinical series reporting blood counts in exposed patients,
          with a dose relationship.'
        attaches_to:
        - pathophysiology#Haematopoietic Suppression
      selected_evidence:
        snippet: the programs elected to focus on similarities between radiation exposure and SM-induced
          injuries to the lung and skin; although arguably, the case could also have been made to include
          bone marrow myelosuppression
        supports: NO_EVIDENCE
