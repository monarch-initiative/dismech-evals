      assertion_type: Pathophysiology
      assertion:
        name: Dermal-Epidermal Separation and Vesication
        biological_scale: TISSUE
        description: 'Death of basal keratinocytes at the dermal-epidermal junction, together with the
          proteases released from them, separates the epidermis from the dermis and produces the blister
          that gives the agent its name. The lesion is delayed relative to the chemistry: alkylation is
          complete within minutes, while the visible lesion takes hours. In the mouse ear vesicant model
          the equivalent lesion rises sharply between 4 and 8 hours after exposure and stays elevated
          at 24 hours. The figures commonly quoted for humans - erythema at 2 to 24 hours, vesication
          at 24 to 48 - are not stated in any source cached for this entry and are deliberately not asserted
          here.'
        locations:
        - preferred_term: skin epidermis
          term:
            id: UBERON:0001003
            label: skin epidermis
        cell_types:
        - preferred_term: basal cell of epidermis
          term:
            id: CL:0002187
            label: basal cell of epidermis
      selected_evidence:
        snippet: It has been found that SM manifests via vesication of the skin and then later leads to
          systemic toxicity
        supports: SUPPORT
    origin:
