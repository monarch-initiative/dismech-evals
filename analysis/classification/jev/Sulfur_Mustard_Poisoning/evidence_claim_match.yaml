        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sm_no_animal_model_reproduces_human_blistering
        kind: HUMAN_MODEL_MISMATCH
        prompt: Can any animal model reproduce human sulfur mustard blistering, and what does it mean
          for countermeasure development that none does?
        rationale: The cutaneous arm of this entry has an evidence problem the pulmonary arm does not.
          Rodent skin models reproduce epidermal cell death and the inflammatory response but do not form
          true human-type blisters, so the vesication node - the lesion the agent is named for - is supported
          in humans by clinical description and in animals only by proxies such as ear weight and morphometric
          thickness. This is why the vesication evidence in this entry is thinner than the fibrosis evidence,
          and why a cutaneous countermeasure that works in a mouse ear cannot be assumed to work on a
          human blister.
        attaches_to:
        - pathophysiology#Dermal-Epidermal Separation and Vesication
      selected_evidence:
        snippet: had an increase in ear weights, morphometric thickness, edema, inflammatory cell infiltration,
          and signs of vesication at all time points
        supports: SUPPORT
        directness: INDIRECT
