          epithelium, and conjunctival epithelium invades across the limbal barrier instead. The clinical
          result appears after a silent interval that can run to decades: limbal ischaemia, corneal scarring
          and opacity, neovascularization, thinning, lipid and amyloid deposits, and persistent epithelial
          defects. In a series of 48 patients, corneal scar or opacity was present in 87.5% and neovascularization
          in 70.8%. The link between the acute limbal insult and the multi-decade latency is inferred
          from clinical natural history and is not established at the cell-biological level.'
