  4bc26e2886d148673659765b966027a8e9f070e12d408c9df0c4e09f27f01742:
    claim:
      about:
        disease:
          name: Sulfur Mustard Poisoning
          disease_term:
            preferred_term: sulfur mustard poisoning
            term:
              id: MONDO:0800387
              label: sulfur mustard poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cellular Energy Collapse and Epithelial Necrosis
        biological_scale: CELLULAR
        description: 'Keratinocytes, corneal epithelial cells and airway epithelial cells that have lost
          their NAD+ and ATP pools and their antioxidant buffer die. The death mode is dose-dependent
          rather than uniform: a cell with modest damage apoptoses, a cell whose energy has collapsed
          cannot run the ATP-dependent apoptotic programme and dies by necrosis. Both are present in the
          injured airway, and the balance between them is what the PARP1 arm sets. Necrotic death spills
          intracellular contents into the tissue, which is what converts a molecular lesion into an inflammatory
          one. Do not read this node as claiming the death is exclusively necrotic - the evidence below
          includes a direct demonstration of early apoptosis in the same inhalation model.'
        biological_processes:
        - preferred_term: cell death
          term:
            id: GO:0008219
            label: cell death
          modifier: INCREASED
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        - preferred_term: bronchial epithelial cell
          term:
