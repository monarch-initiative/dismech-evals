      assertion_type: Pathophysiology
      assertion:
        name: Melanocyte Injury and Dyspigmentation
        biological_scale: CELLULAR
        description: 'Epidermal melanocytes are alkylated alongside keratinocytes, and the effect on pigment
          is dose-dependent in opposite directions. Low sulfur mustard concentrations raise melanin synthesis
          and the expression of tyrosinase, TRP1, TRP2 and MITF; high concentrations reduce melanin content
          and downregulate all of them. This is offered as an explanation for the characteristic mixture
          of hyper- and hypopigmented patches in healed skin. Keep the two claims apart: the opposing
          dose-dependence is measured, in cultured human melanocytes, and the mapping onto the clinical
          pattern is the study authors'' own inference from it - no cached source here reports the concentration
          gradient across a patient''s contact area that the explanation would require.'
        biological_processes:
        - preferred_term: melanin biosynthetic process
          term:
            id: GO:0042438
            label: melanin biosynthetic process
          modifier: DYSREGULATED
        cell_types:
        - preferred_term: melanocyte
          term:
            id: CL:0000148
            label: melanocyte
      selected_evidence:
        snippet: In contrast, high SM concentrations led to decreased melanin content and a downregulation
          in expression of all investigated melanogenesis-associated proteins.
        supports: SUPPORT
