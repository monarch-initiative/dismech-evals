        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sulfur Mustard Penetration and Episulfonium Ion Formation
        biological_scale: MOLECULAR
        description: Sulfur mustard is lipophilic and crosses skin, corneal and airway epithelium within
          minutes of contact. Inside the cell it cyclizes intramolecularly, displacing chloride to form
          a strained three-membered episulfonium (ethylene sulfonium) ring. That cation, not the parent
          molecule, is the alkylating electrophile, and because the parent carries two chloroethyl arms
          the reaction can happen twice on the same molecule. Most of a dermal dose stays in the epidermis,
          which is why the cutaneous lesion is superficial and the systemic dose is small relative to
          the local injury.
        chemical_entities:
        - preferred_term: sulfur mustard
          term:
            id: CHEBI:25434
            label: bis(2-chloroethyl) sulfide
        locations:
        - preferred_term: skin epidermis
          term:
            id: UBERON:0001003
            label: skin epidermis
      selected_evidence:
        snippet: SM and NM are easily absorbed through the skin and can cause immediate cutaneous injury
          and blistering
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
