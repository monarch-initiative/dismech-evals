        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sm_keratopathy_latency_unexplained
        kind: KNOWLEDGE_GAP
        prompt: Why does mustard gas keratopathy appear after a silent interval of years to decades rather
          than following on from the acute corneal injury?
        rationale: 'The acute corneal lesion re-epithelialises within days, and the delayed keratopathy
          then arrives after an interval during which the eye looks well. Limbal stem cell deficiency
          is the accepted structural explanation for the end state, but it does not by itself account
          for the timing: a stem cell pool destroyed at exposure should produce failure of corneal renewal
          sooner. The authors of the largest delayed-keratitis series say outright that the pathophysiology
          of these changes is not clearly identified, and raise a possible immune-mediated component from
          the histology. The edge from limbal injury to delayed keratopathy in this entry rests on clinical
          natural history.'
        attaches_to:
        - pathophysiology#Limbal Stem Cell Deficiency and Delayed Mustard Gas Keratopathy
      selected_evidence:
        snippet: The pathophysiologic features of these changes are not clearly identified.
        supports: SUPPORT
