          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Reproduces both the histological lesion and the physiological deficit.
          limitations: Whole-organism pulmonary function testing in a rat reports resistance and compliance
            rather than the spirometric indices used clinically, so the physiological endpoints are analogous
            rather than identical.
          readouts:
          - name: Lung resistance and compliance
            target: Bronchiolitis Obliterans and Progressive Airflow Obstruction
