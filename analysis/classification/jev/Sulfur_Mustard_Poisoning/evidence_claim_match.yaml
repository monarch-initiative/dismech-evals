            term:
              id: CHEBI:31441
              label: fluticasone propionate
          - preferred_term: salmeterol
            term:
              id: CHEBI:9011
              label: salmeterol
      selected_evidence:
        snippet: The non-significant difference of FEV1 decline in BO compared to COPD patients suggests
          the effectiveness of azithromycin, inhaled steroid and N-acetyl cysteine in BO patients.
