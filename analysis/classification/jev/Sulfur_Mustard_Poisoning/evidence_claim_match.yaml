      evidence_source: HUMAN_CLINICAL
      explanation: The molecular measurement, in exposed human bronchial tissue. Note the study is six
        exposed patients against five controls and its authors frame the cancer link as a hypothesis,
        so this establishes the expression change and not the transformation risk.
