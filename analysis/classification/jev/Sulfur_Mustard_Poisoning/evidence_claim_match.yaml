        name: Rat sulfur mustard vapour inhalation model (biphasic lung injury)
        species: Rat
        publication: PMID:33002157
        description: 'Rats exposed to sulfur mustard vapour at 0.2 to 0.6 mg/kg. The striking finding
          is that the pathology is biphasic: damage at 3 days, apparent improvement at 7 to 16 days, then
          a second and worse wave at 28 days with distal bronchiolar epithelial necrosis and interstitial
          fibrosis. That shape is the animal counterpart of the human latent-then-delayed course, which
          is what makes the model useful for something other than acute toxicity.'
        modeled_mechanisms:
        - target: Cellular Energy Collapse and Epithelial Necrosis
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Reproduces airway epithelial necrosis after inhalational exposure.
          limitations: The model reads the lesion histologically and does not measure the NAD+ or ATP
            depletion that this node asserts as its mechanism, so it supports the outcome rather than
            the pathway.
          readouts:
          - name: Distal bronchiolar epithelial necrosis on histopathology
            target: Cellular Energy Collapse and Epithelial Necrosis
            direction: INCREASED
            interpretation: Histological correlate of the epithelial death node.
      selected_evidence:
        snippet: Time course studies revealed that the pathologic response was biphasic.
        supports: SUPPORT
