            28 days.
          limitations: 'Rodent lifespan makes the human multi-decade course unmodellable: 28 days of rat
            follow-up stands in for forty years of human disease, so the model can show that the pathway
            engages but not that it keeps engaging.'
          readouts:
          - name: Lung and plasma TGF-beta, PDGF and PAI-1 concentrations
            target: TGF-beta Driven Myofibroblast Activation
