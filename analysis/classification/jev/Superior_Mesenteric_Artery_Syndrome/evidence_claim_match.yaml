  61dbe8f49647959eab955a90944ea3e31c3761ff2371b8c8f2e82a8f24aa242a:
    claim:
      about:
        disease:
          name: Superior Mesenteric Artery Syndrome
          disease_term:
            preferred_term: superior mesenteric artery syndrome
            term:
              id: MONDO:0002687
              label: superior mesenteric artery syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Nutcracker Syndrome (Left Renal Vein Entrapment)
        description: 'The other clinical consequence of a narrowed aortomesenteric angle. The same geometry
          that traps the duodenum also traps the left renal vein, so the two entities share an anatomic
          substrate, are frequently co-reported, and can coexist in the same patient. They are nonetheless
          distinct diseases with distinct compressed structures and distinct presentations, and must not
          be conflated.

          '
        distinguishing_features:
        - Nutcracker syndrome compresses the LEFT RENAL VEIN and presents as a urologic/venous syndrome
          with haematuria, proteinuria, left flank pain, pelvic congestion, and left varicocele.
        - SMA syndrome compresses the THIRD PART OF THE DUODENUM and presents as a gastrointestinal obstructive
          syndrome with postprandial pain, vomiting, and weight loss.
      selected_evidence:
        snippet: The reduced angle compresses the structures situated between the aorta and the superior
          mesenteric artery, such as the duodenum and left renal vein; this can determine painful crises,
          intestinal subocclusions, and left varicocele.
        supports: SUPPORT
    origin:
