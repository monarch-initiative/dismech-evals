        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: fat_pad_depletion_vicious_cycle
        hypothesis_label: Self-amplifying fat-pad-depletion cycle
        status: CANONICAL
        description: 'The canonical model of SMA syndrome is not a simple linear cascade but a positive-feedback
          loop. Depletion of the aortomesenteric fat pad narrows the aortomesenteric angle and compresses
          the duodenum; the resulting meal-provoked pain, nausea, and vomiting reduce oral intake; the
          reduced intake produces further weight loss and further fat-pad depletion, which narrows the
          angle still further. Edges tagged with this hypothesis group form the closed cycle (fat-pad
          depletion -> angle narrowing -> duodenal compression -> obstruction -> reduced intake -> weight
          loss -> fat-pad depletion). The clinical corollary is that the loop can only be broken by restoring
          the fat pad (nutritional rehabilitation, ideally delivered distal to the obstruction) or by
          surgically bypassing the compressed segment.

          '
      selected_evidence:
        snippet: The symptoms that patients experience lead to further decreases in oral intake, which
          in turn brings about further weight and fat pad loss and thus worsening of the duodenal obstruction.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31998513
      reference_title: 'Superior mesenteric artery syndrome in severe anorexia nervosa: A case series.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'States the positive-feedback structure explicitly - symptoms reduce intake, which
        worsens fat-pad loss, which worsens the obstruction.

        '
