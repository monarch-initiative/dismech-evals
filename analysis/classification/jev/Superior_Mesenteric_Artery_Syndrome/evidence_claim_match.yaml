        description: 'The primary lesion. The horizontal (third) portion of the duodenum, which crosses
          the midline in the aortomesenteric window, is squeezed between the SMA anteriorly and the aorta
          and vertebral column posteriorly. The compression is extrinsic - the duodenal wall and lumen
          are intrinsically normal - which is why endoscopy alone cannot establish the diagnosis and why
          bypassing or decompressing the segment relieves it.

          '
        locations:
        - preferred_term: Third (horizontal) part of the duodenum
          term:
            id: UBERON:0002114
            label: duodenum
      selected_evidence:
        snippet: The syndrome is caused by compression of the third part of the duodenum in the angle
          between the aorta and the superior mesenteric artery.
