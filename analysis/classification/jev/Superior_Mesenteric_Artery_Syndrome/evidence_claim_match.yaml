          less commonly utilized modalities in the work-up of SMA syndrome, but provide imaging alternatives
          without the use of ionizing radiation. ... Imaging can assist in diagnosis by demonstrating
          characteristic findings of reduced aortomesenteric angle, reduced aortomesenteric distance,
          gastroduodenal distention, bowel caliber narrowing at the takeoff of the superior mesenteric
          artery from the aorta, as well as delayed gastric emptying or positional obstruction observed
          with real time with fluoroscopy. ... The diagnosis of SMA syndrome must be based on clinical
          symptomatology correlated with radiographic information.
