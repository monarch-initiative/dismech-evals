          value:
            name: Progressive Weight Loss and Malnutrition
            biological_scale: ORGANISM
            description: 'Sustained negative energy balance with falling BMI, dehydration, and electrolyte
              and acid-base disturbance (classically hypochloraemic metabolic alkalosis from recurrent
              vomiting). In the largest prospective series the median BMI at presentation was 17.8 kg/m2,
              and surgical relief of the obstruction raised it significantly - consistent with the undernutrition
              being substantially driven by the obstruction rather than merely preceding it, though that
              series was single-arm and uncontrolled with concurrent nutritional care.

              '
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Mesenteric Fat Pad Depletion
        causal_link_type: DIRECT
        description: 'The closing edge of the vicious cycle. Obstruction-driven weight loss further depletes
          the very fat pad whose loss caused the obstruction, so the aortomesenteric angle narrows further
          and the disease becomes self-sustaining unless nutrition is restored or the segment is bypassed.

          '
        hypothesis_groups:
        - fat_pad_depletion_vicious_cycle
      selected_evidence:
        snippet: The symptoms that patients experience lead to further decreases in oral intake, which
          in turn brings about further weight and fat pad loss and thus worsening of the duodenal obstruction.
        supports: SUPPORT
