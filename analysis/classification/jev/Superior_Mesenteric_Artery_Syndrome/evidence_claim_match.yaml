  c6e1d5a56bdf7743e5e4b033f397c56ed5e18b230742dfcc99479dbee3096bb7:
    claim:
      about:
        disease:
          name: Superior Mesenteric Artery Syndrome
          disease_term:
            preferred_term: superior mesenteric artery syndrome
            term:
              id: MONDO:0002687
              label: superior mesenteric artery syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Anorexia Nervosa
        description: 'The most consequential differential. SMA syndrome mimics a restrictive eating disorder
          (food avoidance, low BMI, vomiting), AND anorexia nervosa is one of its commonest causes, so
          the two are bidirectionally confusable and frequently coexist. Attributing SMA-syndrome symptoms
          to the psychiatric diagnosis alone delays treatment and blocks weight restoration.

          '
        distinguishing_features:
        - In SMA syndrome food avoidance is secondary to reproducible meal-provoked pain relieved by emesis
          or postural change, and imaging shows duodenal obstruction with a narrowed aortomesenteric angle.
        - In uncomplicated anorexia nervosa there is a primary drive for thinness and fear of weight gain,
          and imaging shows no duodenal obstruction.
      selected_evidence:
        snippet: The symptoms are variable, consisting of postprandial abdominal pain, nausea and vomiting,
          early satiety, anorexia, and weight loss and can mimic anorexia nervosa or functional dyspepsia.
        supports: SUPPORT
