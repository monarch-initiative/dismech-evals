        biological_scale: ORGANISM
        description: 'Partial or complete high intestinal obstruction at the third part of the duodenum.
          Chyme cannot pass the compressed segment, so the proximal duodenum and stomach dilate and empty
          slowly. Obstruction may be intermittent and posture-dependent - supine positioning worsens it
          and left lateral decubitus, prone, or knee-chest positions can transiently relieve it - which
          explains both the fluctuating symptoms and the positional manoeuvres used in conservative management.

          '
        locations:
