      assertion_type: Pathophysiology
      assertion:
        name: Meal-Provoked Symptoms and Reduced Oral Intake
        biological_scale: ORGANISM
        description: 'Eating loads the obstructed segment, producing postprandial epigastric pain, nausea,
          early satiety, bloating, and vomiting that begins within roughly 15-20 minutes of a meal and
          is characteristically relieved by emesis. Patients learn to avoid solids, then to avoid eating,
          so the obstruction is converted into a behavioural restriction of intake. This is the node at
          which a mechanical lesion becomes a nutritional one, and it is the hinge of the vicious cycle.

          '
      selected_evidence:
        snippet: The symptoms are variable, consisting of postprandial abdominal pain, nausea and vomiting,
          early satiety, anorexia, and weight loss and can mimic anorexia nervosa or functional dyspepsia.
        supports: SUPPORT
