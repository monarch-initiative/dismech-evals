  869b8c8b651657e29cccf371f3feb4b1807d3eb3fd964a25337c12df9e777dfe:
    claim:
      about:
        disease:
          name: Superior Mesenteric Artery Syndrome
          disease_term:
            preferred_term: superior mesenteric artery syndrome
            term:
              id: MONDO:0002687
              label: superior mesenteric artery syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Precipitating Catabolic Weight Loss or Anatomic Alteration
        biological_scale: ORGANISM
        description: 'The upstream trigger. Two mechanistically distinct routes converge on the same aortomesenteric
          geometry. (1) A catabolic/undernutrition state producing rapid or substantial weight loss -
          anorexia nervosa and other restrictive eating, malignancy and cachexia, major burns, trauma,
          malabsorption, chronic infection, prolonged immobilisation, or severe systemic illness. (2)
          A change in the spatial relationship among the spine, aorta, SMA, and duodenum without primary
          fat loss - corrective spinal surgery for scoliosis (the classic paediatric setting), body casting
          (the origin of the name "cast syndrome"), rapid linear growth, or abdominal/retroperitoneal
          operations that alter intestinal fixation and tension. A third, less common route is constitutional:
          a congenital anatomic variant of the SMA origin (an abnormally low, caudally angled take-off)
          or of duodenal fixation (a short, high-inserting ligament of Treitz suspending the duodenum
          within the aortomesenteric window) can narrow the window from birth, so that a much smaller
          degree of fat loss is sufficient to precipitate obstruction.

          '
        triggers:
        - preferred_term: Rapid or substantial weight loss
        - preferred_term: Corrective spinal surgery for scoliosis
        - preferred_term: Body casting or spinal traction
        - preferred_term: Congenital anatomic variant of SMA origin or duodenal fixation
      selected_evidence:
        snippet: Frequently, predisposing medical conditions associated with catabolic states or rapid
          weight loss result in a decrease of the aortomesenteric angle and subsequent duodenal obstruction.
          External cast compression, anatomic variants and surgical alteration of the anatomy following
          spine surgery or ileoanal pouch anastomosis can also precipitate the syndrome.
        supports: SUPPORT
    origin:
