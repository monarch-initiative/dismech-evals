      assertion_type: Diagnosis
      assertion:
        name: Clinical-Radiological Concordance
        description: 'Diagnosis requires BOTH a compatible obstructive clinical picture AND imaging evidence
          of duodenal compression with narrowed aortomesenteric geometry. A narrow angle or distance in
          isolation occurs in asymptomatic individuals and is not diagnostic; conversely, endoscopy cannot
          establish an extrinsic compression. In practice barium swallow, contrast-enhanced CT or CT/MR
          angiography, and endoscopy are combined.

          '
      selected_evidence:
        snippet: CT angiography is currently favored in the literature for diagnosis as it can not only
          show the narrowed aorto-mesenteric angle and distance, but also the extent of duodenal obstruction.
        supports: SUPPORT
