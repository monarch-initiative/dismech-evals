  2c44bce2f3b57d29954ebf8428c3e21bfa3d29602204c39c56ba618493007466:
    claim:
      about:
        disease:
          name: Superior Mesenteric Artery Syndrome
          disease_term:
            preferred_term: superior mesenteric artery syndrome
            term:
              id: MONDO:0002687
              label: superior mesenteric artery syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: smas_threshold_variability
        prompt: 'What aortomesenteric angle and distance thresholds should define SMA syndrome, and should
          they be adjusted for age, BMI, sex, population, and imaging technique?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Aortomesenteric Angle and Distance Narrowing
        rationale: 'One population-specific cross-sectional series reported a mean aortomesenteric angle
          of 54.07 +/- 8.53 degrees and a mean distance of 16.25 +/- 3.44 mm, while a prospective clinical
          cohort used 22 degrees or less and 8 mm or less as operational thresholds. Because the angle
          and distance correlate directly with BMI - which is itself the disease''s principal risk factor
          - a fixed threshold necessarily entangles the exposure with the diagnostic criterion, and narrowed
          geometry occurs in asymptomatic individuals. Population- and age-specific normative studies
          are actively being conducted but have not yet produced adjusted criteria.

          '
        proposed_experiments:
        - experiment_id: smas_normative_multipopulation
          name: Multi-population normative aortomesenteric reference study
          description: 'Normative CT and ultrasound studies across multiple populations, stratified by
            age, sex, BMI, and measured visceral fat, deriving percentile-based rather than fixed thresholds.

            '
          decision_criterion: 'Demonstration that percentile-based, covariate-adjusted thresholds outperform
            a single fixed cut-off would justify replacing the current criteria.

            '
        - experiment_id: smas_threshold_accuracy
          name: Prospective diagnostic-accuracy study of candidate thresholds
          description: 'Prospective study comparing candidate angle and distance thresholds against a
            reference standard combining compatible symptoms with demonstrated duodenal transit obstruction,
            reporting sensitivity, specificity, and positive predictive value.

            '
          decision_criterion: 'A threshold pair with acceptable positive predictive value against the
            composite reference standard would define operational diagnostic criteria.

            '
      selected_evidence:
        snippet: Multicenter, prospective, observational research project on children aged from 10 to
          15 years old undergoing abdominal ultrasound examinations during routine clinical practice.
        supports: SUPPORT
