        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aortomesenteric Angle and Distance Narrowing
        biological_scale: TISSUE
        description: 'Reduction of the angle at which the SMA leaves the abdominal aorta, and of the aorta-to-SMA
          distance at the level of the duodenum. Normative values vary by population; one cross-sectional
          series reported a mean angle of 54.07 +/- 8.53 degrees and a mean distance of 16.25 +/- 3.44
          mm. The operational diagnostic thresholds used in the largest prospective surgical series are
          an aortomesenteric angle of 22 degrees or less and/or a distance of 8 mm or less. This is a
          geometric, not a biochemical, lesion: no vascular occlusion, thrombosis, dissection, or ischaemia
          is involved, and the SMA itself is structurally normal.

          '
        locations:
        - preferred_term: Superior mesenteric artery
          term:
            id: UBERON:0001182
            label: superior mesenteric artery
        - preferred_term: Abdominal aorta
          term:
            id: UBERON:0001516
            label: abdominal aorta
        notes: 'An angle of 22 degrees or less and a distance of 8 mm or less are supportive operational
          cut-offs in the cited prospective cohort, but narrowed geometry can be present in asymptomatic
          individuals. Diagnosis therefore requires clinical-radiological concordance rather than a threshold
          alone.

          '
      selected_evidence:
        snippet: The diagnosis was achieved through barium swallow, CT/MR angiography (aortomesenteric
          angle ≤ 22°, distance ≤ 8 mm), endoscopy.
        supports: SUPPORT
