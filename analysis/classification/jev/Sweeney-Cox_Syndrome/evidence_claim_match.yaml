      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: glu117_interference_dosage_continuum
        hypothesis_label: Graded antimorphism places Sweeney-Cox and Saethre-Chotzen on one continuum
        status: EMERGING
        description: 'Under this model the substituting residue at Glu117 sets how strongly the mutant
          subunit interferes with the wild-type pool, and the resulting phenotype moves along a continuum
          rather than falling into one of two categories. A conservative substitution such as Glu117Asp
          interferes weakly and behaves closer to haploinsufficiency, which is the reading offered for
          the one patient who had both the Sweeney-Cox facies and bicoronal craniosynostosis; stronger
          substitutions produce the non-synostotic frontonasal phenotype, and the C. elegans series ordered
          all five human alleles by severity rather than separating them into classes.

          If correct, the distinction between this entry and Saethre-Chotzen syndrome is quantitative,
          and the craniosynostosis discriminator is a threshold effect rather than a categorical feature.
          The competing model is that the two disorders are mechanistically disjoint because the alleles
          differ in kind, not degree. Three patients, one per allele, cannot separate these.'
      selected_evidence:
        snippet: This allelic series revealed that different substitutions exhibit graded severity, in
          terms of both gene expression and cellular phenotype, which we incorporate into a model explaining
          the various human disease phenotypes.
        supports: SUPPORT
