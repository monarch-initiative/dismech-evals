        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: swcos_glu117_allele_specific_model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does a TWIST1 Glu117 knock-in reproduce the human frontonasal and ablepharon phenotype,
          and does it act through the Alx1 distal enhancer?
        attaches_to:
        - pathophysiology#Failure of TWIST1-Dependent Frontonasal Ectomesenchyme Programme
        rationale: Every mechanistic model of this disorder is currently an allele mismatch. The C. elegans
          series carries the right substitution but has no craniofacial skeleton; the mouse work has the
          right tissue but uses conditional nulls, which model haploinsufficiency-like loss rather than
          the antimorphic allele. The whole clinical point of Sweeney-Cox is that those two lesions give
          different diseases, so no existing model tests the step that actually distinguishes it from
          Saethre-Chotzen. Whether the enhancer route is the one a Glu117 allele travels is therefore
          inference from tissue overlap, not a result.
        proposed_experiments:
        - experiment_id: swcos_glu117_knockin_mouse
          name: Twist1 Glu117 knock-in mouse with frontonasal enhancer readout
          description: Generate a mouse carrying the Glu117 substitution at the endogenous locus and compare
            its craniofacial phenotype and Alx1 distal-enhancer activity against a Twist1 heterozygous
            null.
          would_support:
          - pathophysiology#Failure of TWIST1-Dependent Frontonasal Ectomesenchyme Programme
          supporting_outcome:
          - The knock-in shows frontonasal and periocular defects with reduced Alx1 enhancer activity,
            while the heterozygous null does not, separating the antimorphic route from simple dosage
            loss.
          refuting_outcome:
          - The knock-in phenocopies the heterozygous null, indicating the Glu117 allele acts by dosage
            reduction and that the antimorphic model does not explain the distinct human phenotype.
      selected_evidence:
        snippet: we engineered all five disease-associated alleles into the equivalent Glu29 residue encoded
          by hlh-8, the single Twist homolog present in Caenorhabditis elegans
        supports: SUPPORT
