            term:
              id: MONDO:0060592
              label: Sweeney-Cox syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: swcos_allelic_ascertainment_bias
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do the three reported patients represent the survivable tail of the Glu117 allelic series,
          with more severe substitutions going unascertained?
        attaches_to:
        - pathophysiology#TWIST1 Glu117 Basic-Domain Substitution
        - prevalence#Worldwide
        rationale: 'The C. elegans series showed graded severity across substitutions at this residue,
          and the clinical literature explicitly raises lethality as an alternative outcome of substituting
          Glu117. If some substitutions are embryonic-lethal or lethal in the neonatal period, the reported
          phenotype is conditioned on survival and the three living patients are a biased sample. This
          matters for two curated claims at once: the severity range recorded in the phenotypes section,
          and the case count recorded under prevalence, which is also the constraint behind ClinGen''s
          Limited gene-disease classification. Prenatal or perinatal-loss sequencing series covering TWIST1
          would be the way to test it; nothing of the sort has been reported.'
        notes: 'Ascertainment cuts differently from evidence availability, and the two should not be confused.
          The malformation list itself is curated: 46 features come from the HPO disease annotation for
          OMIM:617746, which records each as a count out of the two index subjects. What that annotation
          cannot say is whether those two subjects, plus the later Glu117Asp patient, span the phenotype
          of Glu117 substitution or only its survivable part. A feature absent from a two-patient annotation
          may be genuinely rare, or may belong to a substitution that was never ascertained.'
      selected_evidence:
        snippet: This suggests that any amino acid substitutions at Glu117 would likely lead to the Sweeney-Cox
          syndrome phenotype or lethality.
        supports: SUPPORT
