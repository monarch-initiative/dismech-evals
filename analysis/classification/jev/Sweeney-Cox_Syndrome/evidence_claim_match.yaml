  3315ca6ad5c14470c2f6e43c825e339417a4837cfaf2aa781b7ccb7fd85c22f7:
    claim:
      about:
        disease:
          name: Sweeney-Cox Syndrome
          disease_term:
            preferred_term: Sweeney-Cox syndrome
            term:
              id: MONDO:0060592
              label: Sweeney-Cox syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Antimorphic Interference with TWIST1 bHLH Complexes
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'TWIST1 acts as homodimers and as heterodimers with the TCF3, TCF4 and TCF12 E-proteins,
          and it is the basic region of each partner that grips the E-box. Substituting Glu117 alters
          a DNA-contacting residue while leaving the helix-loop-helix dimerisation surface untouched,
          so the expected consequence is a subunit that still enters complexes but cannot read their targets.
          The genetic evidence supports that reading: engineering the five human alleles into the equivalent
          Glu29 residue of hlh-8, the single Twist homolog in Caenorhabditis elegans, produced a graded
          severity series rather than a simple null, and the analysis favours a predominantly dominant-negative
          mechanism.

          Two caveats belong on this node. The dimerisation-retained, DNA-binding-lost model is inferred
          from where the residue sits in the domain — no biochemistry on the human Glu117 protein has
          been reported, so it is not known directly whether these subunits still dimerise or still occupy
          chromatin. And "predominantly" is the source''s own word: the C. elegans series does not exclude
          a partial loss-of-function component.

          What is established is that this step is where Sweeney-Cox parts from Saethre-Chotzen. Reducing
          TWIST1 to one functional copy leaves the remaining protein competent; an antimorphic allele
          does not.'
        molecular_functions:
        - preferred_term: E-box binding
          term:
            id: GO:0070888
            label: E-box binding
          modifier: DECREASED
        - preferred_term: protein dimerization activity
          term:
            id: GO:0046983
            label: protein dimerization activity
        - preferred_term: DNA-binding transcription factor activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
          modifier: DECREASED
      selected_evidence:
        snippet: The genetic analysis favors a predominantly dominant-negative mechanism for the action
          of amino acid substitutions at this highly conserved glutamic acid residue
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28369379
      reference_title: Localized TWIST1 and TWIST2 basic domain substitutions cause four distinct human
        diseases that can be modeled in Caenorhabditis elegans.
      evidence_source: MODEL_ORGANISM
      explanation: States the antimorphic mechanism directly, as the conclusion of the C. elegans allelic
        series.
