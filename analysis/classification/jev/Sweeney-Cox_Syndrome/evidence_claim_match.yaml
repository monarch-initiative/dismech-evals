        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: A de novo heterozygous missense substitution replaces the conserved glutamic acid
          at codon 117 of TWIST1. Glu117 lies in the basic region of the bHLH domain — the segment that
          contacts DNA — so the lesion is positioned to disable DNA recognition while leaving the helix-loop-helix
          dimerisation surface intact. Three substitutions are reported (p.Glu117Val, p.Glu117Gly, p.Glu117Asp),
          and this codon is untouched among roughly one hundred loss-of-function TWIST1 alleles catalogued
          in Saethre-Chotzen syndrome, which is the first indication that it is not simply another way
          of losing the gene.
        gene:
          preferred_term: TWIST1
          description: Basic helix-loop-helix transcription factor; substitution of the DNA-contacting
