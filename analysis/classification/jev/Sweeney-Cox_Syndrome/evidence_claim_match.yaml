              label: Sweeney-Cox syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of TWIST1-Dependent Frontonasal Ectomesenchyme Programme
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: 'TWIST1 is expressed in migratory cranial neural crest and maintained in the crest-derived
          mesenchyme of the frontonasal prominence, where it switches on the ectomesenchyme programme.
          In mouse, neural-crest-specific inactivation of Twist1 disrupts frontonasal development and
          fails to activate Alx1, Alx3 and Alx4 in the frontonasal prominence; Twist1 occupies a conserved
          element in a distal Alx1 enhancer and drives Alx1 reporter expression specifically in periocular
          and frontonasal mesenchyme. Deleting that enhancer alone reproduces frontonasal and ocular defects.

          Curated as PROVISIONAL: the enhancer and target-gene work is mouse conditional-knockout and
          reporter biology, so it establishes what TWIST1 does in this tissue, not that a human Glu117
          allele acts through this particular enhancer. The inference from an antimorphic allele to this
          specific regulatory step has not been made in patient tissue.'
        cell_types:
        - preferred_term: migratory cranial neural crest cell
          term:
            id: CL:0000008
            label: migratory cranial neural crest cell
        locations:
        - preferred_term: frontonasal prominence
          term:
            id: UBERON:0004066
            label: frontonasal prominence
        biological_processes:
        - preferred_term: positive regulation of transcription by RNA polymerase II
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
          modifier: DECREASED
        - preferred_term: embryonic cranial skeleton morphogenesis
          term:
            id: GO:0048701
            label: embryonic cranial skeleton morphogenesis
          modifier: DECREASED
      selected_evidence:
        snippet: Twist1 suppresses Irf6 and other epithelial genes in CNCCs during the epithelial-to-mesenchymal
          transition (EMT) process and cell migration. Conversely, a loss of Twist1 leads to a sustained
          expression of epithelial and cell adhesion markers in migratory CNCCs.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/5
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35781329
      reference_title: TWIST1 interacts with beta/delta-catenins during neural tube development and regulates
        fate transition in cranial neural crest cells.
      evidence_source: MODEL_ORGANISM
      explanation: 'Adds a second TWIST1-dependent step upstream of the ectomesenchyme programme: releasing
        cranial neural crest from its epithelial state. Graded INDIRECT because it is loss-of-function
        mouse work and no Glu117 allele has been tested for this function, so whether an antimorphic allele
