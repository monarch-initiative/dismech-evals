      assertion:
        name: BAF Complex Disruption
        description: The SS18-SSX fusion protein incorporates into the BAF chromatin remodeling complex,
          displacing wild-type SS18. This alters BAF complex targeting and function, particularly affecting
          polycomb-mediated gene repression. The fusion protein causes eviction of BAF47 (SMARCB1) from
          the complex at certain genomic loci.
        biological_processes:
        - preferred_term: regulation of gene expression
          modifier: ABNORMAL
          term:
            id: GO:0010468
            label: regulation of gene expression
      selected_evidence:
        snippet: SS18-SSX globally hijacks BAF complexes on chromatin to activate an SS transcriptional
          signature that we define using primary tumors and cell lines.
        supports: SUPPORT
