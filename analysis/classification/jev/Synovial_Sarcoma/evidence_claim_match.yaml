      assertion:
        name: SS18-SSX Fusion Oncogene
        description: The t(X;18)(p11;q11) translocation fuses the SS18 gene on chromosome 18 to one of
          three SSX genes (SSX1, SSX2, or rarely SSX4) on the X chromosome. The SS18-SSX fusion protein
          disrupts the BAF (SWI/SNF) chromatin remodeling complex, leading to aberrant transcriptional
          regulation and epigenetic reprogramming.
        biological_processes:
