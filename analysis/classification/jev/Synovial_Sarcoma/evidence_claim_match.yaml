      assertion_type: Pathophysiology
      assertion:
        name: Epigenetic Reprogramming
        description: SS18-SSX-containing BAF complexes fail to properly oppose polycomb repressive complexes,
          leading to abnormal silencing of tumor suppressors and activation of oncogenic programs. Key
          target genes include BCL2 (antiapoptotic) and multiple receptor tyrosine kinases. The SS18-SSX
          fusion also activates downstream effectors including YAP1/TAZ and beta-catenin transcriptional
          programs.
        biological_processes:
        - preferred_term: apoptotic process
          modifier: DECREASED
          term:
            id: GO:0006915
            label: apoptotic process
      selected_evidence:
        snippet: This leads to the expression of the SS18-SSX fusion protein, which causes disturbances
          in several interacting multiprotein complexes such as the SWItch/Sucrose Non-Fermentable (SWI/SNF)
          complex, also known as the BAF complex and the Polycomb Repressive Complex 1 and 2 (PRC1 and
          PRC2).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31681608
      reference_title: 'Epigenetic Targets in Synovial Sarcoma: A Mini-Review.'
      evidence_source: HUMAN_CLINICAL
      explanation: Confirms that SS18-SSX disrupts both SWI/SNF and PRC1/2 complexes leading to epigenetic
        rewiring.
