        snippet: Pld4 homozygous KO (Pld4−/−) mice exhibited autoimmune phenotypes, such as slower body
          weight gain, significantly elevated levels of anti-double-stranded-DNA (dsDNA) antibodies, anti-dsRNA
          antibodies and IgG in the plasma
        supports: SUPPORT
