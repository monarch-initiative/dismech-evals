      assertion_type: Genetic
      assertion:
        name: SRSF2
        association: S/A/R panel member; adverse overall survival in KIT D816V(+) advanced SM
        relationship_type: COOPERATING
        variant_origin: SOMATIC
        notes: SRSF2 is one of the three "S/A/R" genes (with ASXL1 and RUNX1) whose somatic mutation co-occurs
          with KIT D816V in advanced SM and adversely affects overall survival, and it is one of the two
          that remain predictive in multivariate analysis. TET2 is mutated more frequently than any S/A/R
          gene in the same cohort (n=33 of 70) but, unlike SRSF2/ASXL1/RUNX1, did not influence overall
          survival, so it is not curated as a prognostic cooperating alteration.
        gene_term:
          preferred_term: SRSF2
          term:
            id: hgnc:10783
            label: SRSF2
        case_fractions:
        - population: 70 multi-mutated KIT D816V(+) advanced SM patients
          case_fraction_percent: 42.9
          cohort_size: 70
          notes: SRSF2 mutated in 30 of 70 patients; the most frequent S/A/R panel gene.
      selected_evidence:
        snippet: In multivariate analysis, SRSF2 and ASXL1 remained the most predictive adverse indicators
          concerning OS.
        supports: SUPPORT
