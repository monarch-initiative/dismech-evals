          term:
            id: MONDO:0020331
            label: indolent systemic mastocytosis
        description: Most common form of SM, with low mast cell burden and a near-normal life expectancy.
          Dominated by mediator-release symptoms (anaphylaxis, flushing, pruritus, gastrointestinal symptoms)
          and osteoporosis. Lacks the "B" and "C" findings that define smouldering or advanced disease.
      selected_evidence:
        snippet: Patients diagnosed with CM or nonadvanced SM, including indolent SM, have a near-normal
          life expectancy
        supports: SUPPORT
