      assertion_type: Pathophysiology
      assertion:
        name: Constitutive KIT D816V Signaling
        description: In the great majority of adult SM patients a somatic activating KIT mutation, usually
          D816V in the kinase activation loop, renders the KIT receptor tyrosine kinase constitutively
          active and independent of its ligand stem cell factor. This sustained signaling drives downstream
          MAPK and PI3K/AKT pathways, conferring constitutive mast cell proliferation and survival.
        gene:
          preferred_term: KIT
          term:
            id: hgnc:6342
            label: KIT
        molecular_functions:
        - preferred_term: transmembrane receptor protein tyrosine kinase activity
          term:
            id: GO:0004714
            label: transmembrane receptor protein tyrosine kinase activity
          modifier: INCREASED
        biological_processes:
        - preferred_term: KIT receptor tyrosine kinase signaling
          term:
            id: GO:0007169
            label: cell surface receptor protein tyrosine kinase signaling pathway
          modifier: INCREASED
        - preferred_term: MAPK cascade
          term:
            id: GO:0000165
            label: MAPK cascade
          modifier: INCREASED
        - preferred_term: PI3K/AKT signaling
          term:
            id: GO:0043491
            label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
          modifier: INCREASED
      selected_evidence:
        snippet: The multikinase inhibitor midostaurin inhibits KIT D816V, a primary driver of disease
          pathogenesis.
        supports: SUPPORT
    origin:
