      assertion_type: Pathophysiology
      assertion:
        name: Clonal Mast Cell Proliferation and Organ Infiltration
        description: Constitutive KIT signaling produces a clonal proliferation of abnormal mast cells
          that accumulate in extracutaneous organs, classically forming multifocal dense clusters of spindled
          mast cells in the bone marrow. The aberrant mast cells characteristically express CD25, and
          infiltration of bone marrow, liver, spleen, GI tract, and bone underlies the organ damage of
          advanced disease.
        cell_types:
        - preferred_term: neoplastic mast cell
          term:
            id: CL:0000097
            label: mast cell
          modifier: INCREASED
        biological_processes:
        - preferred_term: mast cell proliferation
          term:
            id: GO:0070662
            label: mast cell proliferation
          modifier: INCREASED
      selected_evidence:
        snippet: Systemic mastocytosis (SM) results from a clonal proliferation of abnormal mast cells
          (MC) in extra-cutaneous organs.
        supports: SUPPORT
