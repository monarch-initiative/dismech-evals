            description: 'Most indolent SM patients are managed with symptomatic anti-mediator therapy
              directed at mast-cell mediator release: H1 and H2 antihistamines and the oral mast cell
              stabilizer cromolyn sodium for chronic symptom control, and self-injectable epinephrine
              for anaphylaxis. This is distinct from the cytoreductive/KIT-inhibitor arm used in more
              advanced or refractory disease.'
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: H1 antihistamine
                term:
                  id: NCIT:C29578
                  label: Histamine-1 Receptor Antagonist
              - preferred_term: H2 antihistamine
                term:
                  id: NCIT:C29702
                  label: Histamine-2 Receptor Antagonist
              - preferred_term: cromolyn sodium
                term:
                  id: CHEBI:128458
                  label: disodium cromoglycate
              - preferred_term: epinephrine
                term:
                  id: CHEBI:33568
                  label: adrenaline
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Mast Cell Mediator Release
        treatment_effect: INHIBITS
        description: H1/H2 antihistamines and the mast cell stabilizer cromolyn blunt the symptomatic
          consequences of mediator release rather than the upstream KIT driver; epinephrine reverses the
          acute anaphylactic consequence of a mediator-release episode rather than acting on the node
          itself.
      selected_evidence:
        snippet: When the symptom scores were analyzed separately for gastrointestinal manifestations
          of disease (diarrhea, abdominal pain, nausea, and vomiting), cromolyn sodium treatment was significantly
          beneficial relative to placebo (p less than 0.02), whereas the benefit for nongastrointestinal
          manifestations did not reach statistical significance.
        supports: SUPPORT
