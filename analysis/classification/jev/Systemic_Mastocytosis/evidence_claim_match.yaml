              label: systemic mastocytosis
        context: []
      assertion_type: Genetic
      assertion:
        name: KIT D816V Somatic Mutation
        association: Somatic Driver Mutation
        notes: A somatic activating point mutation at codon 816 of KIT (most commonly D816V), located
          in the kinase activation loop, is found in the great majority of adult SM patients and is a
          minor diagnostic criterion. It is detectable in peripheral blood of virtually all adult SM patients
          using highly sensitive PCR. Because D816V lies in the activation loop, it is resistant to imatinib,
          which targets the inactive kinase conformation.
        gene_term:
          preferred_term: KIT
          term:
            id: hgnc:6342
            label: KIT
      selected_evidence:
        snippet: Recent studies have found the KIT D816V mutation in peripheral blood of virtually all
          adult systemic mastocytosis patients once highly sensitive PCR techniques were used
        supports: SUPPORT
