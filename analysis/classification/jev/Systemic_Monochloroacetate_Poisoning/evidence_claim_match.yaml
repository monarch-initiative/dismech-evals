        context: []
      assertion_type: Treatment
      assertion:
        name: Dichloroacetate (candidate antidote)
        description: 'Dichloroacetate is the most disease-specific pharmacologic agent reported: it acts
          directly on the affected enzymatic system and reduces the lactic acidosis of monochloroacetate
          poisoning. It is a candidate and regionally-approved antidote rather than an established standard
          of care — approved in Sweden for life-threatening monochloroacetate poisoning and, at the time
          of the cited report, at the clinical-trial stage in the United States — with efficacy demonstrated
          in animal experiments rather than controlled human trials.'
        notes: The source states only that dichloroacetate acts on the affected enzymatic system and reduces
          lactic acidosis. Its textbook pyruvate-dehydrogenase activation is a proposed, and in this setting
          disputed, mechanism that no node or evidence in this entry establishes, so it is not asserted
          here.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: dichloroacetate
            term:
              id: CHEBI:28240
              label: dichloroacetate
      selected_evidence:
        snippet: The results of animal experiments demonstrated that dichloroacetic acid is the most effective
          drug against monochloroacetic acid poisoning
        supports: SUPPORT
