  d1874944ffe49ecfcc2973711b5a3039b271a6790f0d6351e82878a3a029db1c:
    claim:
      about:
        disease:
          name: Systemic Monochloroacetate Poisoning
          disease_term:
            preferred_term: systemic monochloroacetate poisoning
            term:
              id: MONDO:0019545
              label: systemic monochloroacetate poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Inactivation of glyceraldehyde-3-phosphate dehydrogenase
        biological_scale: MOLECULAR
        description: The specific metabolic lesion is inactivation of glyceraldehyde-3-phosphate dehydrogenase
          (GAPDH), a thiol-dependent glycolytic/gluconeogenic enzyme. GAPDH activity in the liver of monochloroacetate-exposed
          rats fell to about a fifth of control, while neighbouring glycolytic enzymes were spared.
        notes: 'An older hypothesis held that monochloroacetate enters the citric acid cycle and inhibits
          mitochondrial aconitase. That hypothesis was tested and refuted by Sakai et al. 2005 (PMID:15720133):
          citrate and 2-oxoglutarate fell in parallel (inconsistent with aconitase blockade), and GAPDH
          was identified as the inactivated enzyme. The entry therefore records GAPDH, not aconitase,
          as the target.'
        molecular_functions:
        - preferred_term: glyceraldehyde-3-phosphate dehydrogenase activity
          modifier: DECREASED
          term:
            id: GO:0004365
            label: glyceraldehyde-3-phosphate dehydrogenase (NAD+) (phosphorylating) activity
      selected_evidence:
        snippet: The finding that the levels of citrate and 2-OG were similarly reduced (to 31 and 36%
          of control, respectively) indicates that aconitase was not inhibited by MCA.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
