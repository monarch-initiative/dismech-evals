        context: []
      assertion_type: Treatment
      assertion:
        name: Supportive and intensive care
        description: 'There is no widely licensed specific antidote. Management is supportive: correction
          of the metabolic acidosis, correction of hypoglycemia with intravenous glucose, hemodynamic
          support for shock, respiratory support, and continuous renal replacement therapy both to support
          the kidneys and to enhance removal of the acid from the circulation.'
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: bedside continuous veno-venous haemofiltration (CVVH) was applied every other day to
          rapidly remove acid from the circulation and prevent acute renal failure.
        supports: SUPPORT
