        name: Burn wound surgical care
        description: The corrosive burn is managed with thorough debridement and, for deep wounds, delayed
          skin grafting; the delay also allows residual monochloroacetic acid in the tissue to be diluted
          and eliminated.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: surgical debridement and skin grafting
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        notes: Bound to the broad NCIT:C15329 Surgical Procedure because this treatment bundles debridement,
          escharotomy, and delayed skin grafting. NCIT:C51682 Debridement is a more specific and validated
          term for the debridement component alone; it is not used here so the single binding covers the
          whole surgical bundle.
      selected_evidence:
        snippet: After a thorough debridement of the wound surface and subsequent skin grafting combined
          with early glucocorticoid therapy and haemofiltration, a satisfactory result was achieved, and
          the patient eventually recovered.
