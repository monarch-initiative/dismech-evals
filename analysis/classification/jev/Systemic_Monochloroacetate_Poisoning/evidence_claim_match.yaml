      assertion_type: Diagnosis
      assertion:
        name: Plasma monochloroacetate confirmation
        description: Diagnosis is largely circumstantial — exposure history, the corrosive burn, and the
          metabolic picture (lactic acidosis, hypoglycemia, organ-injury enzymes). Confirmation is a plasma
          monochloroacetic acid concentration, which documents systemic absorption after a dermal splash.
        diagnosis_term:
          preferred_term: plasma monochloroacetate measurement
          term:
            id: NCIT:C217390
            label: Diagnostic Blood Testing
        notes: No LOINC code is bound on this diagnosis row. A Monarch KG search (monochloroacetate) returns
          only specimen-specific codes - LOINC:54945-1 Monochloroacetate [Mass/volume] in Urine and LOINC:38654-0
          Chloroacetate [Mass/volume] in Air - and no plasma or serum monochloroacetate code, which is
          the specimen the cited confirmatory level was measured in. A specimen-specific code is not bound
          for a test's identity (CLAUDE.md), so the plasma-confirmation measurement is carried in preferred_term
          rather than a measurements[] code.
      selected_evidence:
        snippet: The 4 h post exposure plasma monochloroacetic acid concentration was 33 mg/L confirming
          skin absorption.
        supports: SUPPORT
