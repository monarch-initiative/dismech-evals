      assertion:
        name: TACO1 Loss and Defective Mitochondrial COX I Translation
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'Biallelic TACO1 variants abolish a mitochondrial translational activator specific
          for the mtDNA-encoded COX I (MT-CO1) subunit, producing a selective defect in COX I synthesis.
          Without its largest catalytic core subunit, a mature, catalytically competent Complex IV holoenzyme
          cannot assemble.

          '
        genes:
        - preferred_term: TACO1
          term:
            id: hgnc:24316
            label: TACO1
        biological_processes:
        - preferred_term: mitochondrial translation
          term:
            id: GO:0032543
            label: mitochondrial translation
          modifier: DECREASED
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: We identified a specific defect in the synthesis of the mitochondrial DNA (mtDNA)-encoded
          COX I subunit in a pedigree segregating late-onset Leigh syndrome and cytochrome c oxidase (COX)
          deficiency.
        supports: SUPPORT
