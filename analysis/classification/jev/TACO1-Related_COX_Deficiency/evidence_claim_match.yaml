          oxygen and abolishes the coupled proton pumping, collapsing the proton-motive force and oxidative
          ATP synthesis. The bioenergetic deficit is most damaging in high-energy neural tissue, producing
          the basal ganglia-predominant Leigh phenotype.

          '
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
          term:
