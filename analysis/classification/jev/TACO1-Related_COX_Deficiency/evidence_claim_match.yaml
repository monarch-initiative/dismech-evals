            label: mitochondrial electron transport, cytochrome c to oxygen
          modifier: DECREASED
        - preferred_term: ATP synthesis coupled electron transport
          term:
            id: GO:0042775
            label: mitochondrial ATP synthesis coupled electron transport
          modifier: DECREASED
      selected_evidence:
        snippet: Mammalian cytochrome c oxidase (COX) catalyses the transfer of reducing equivalents from
          cytochrome c to molecular oxygen and pumps protons across the inner mitochondrial membrane.
        supports: SUPPORT
