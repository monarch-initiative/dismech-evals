      assertion_type: ExperimentalModel
      assertion:
        name: Patient-derived and CRISPR-engineered iPSC cardiomyocytes
        description: Induced pluripotent stem cell-derived cardiomyocytes from individuals with TDD recapitulate
          the key electrophysiological abnormalities, and these are rescued by adenoviral wild-type TANGO2
          expression or CRISPR correction of the pathogenic variant, establishing causality. An independent
          CRISPR line carrying the exon 3-9 deletion showed that the electrophysiological defect is substrate-conditional
          and mediated by ATP depletion and TRPM4 upregulation. This is currently the most disease-proximal
          platform for the arrhythmia arm.
      selected_evidence:
        snippet: CRISPR/Cas9 were used to generate human induced pluripotent stem cell cardiomyocytes
          (hiPSC-CMs) carrying a TANGO2 exon 3-9 deletion (TANGO2-/-).
