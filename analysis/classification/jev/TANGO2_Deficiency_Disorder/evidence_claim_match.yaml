            label: TANGO2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Biallelic loss-of-function variants in TANGO2 at 22q11.21 are necessary and sufficient
          to cause TANGO2 deficiency disorder. Reported pathogenic classes include multiexon deletions,
          nonsense, frameshift, canonical splice-site, small in-frame deletion and missense variants.
          The recurrent 34-kb deletion of exons 3-9 is the single most common allele, seen in 42% of reported
          individuals and enriched in European-ancestry cases; c.460G>A (p.Gly154Arg) is recurrent in
          Hispanic/Latino families. Because the disorder is caused by deletions as often as by sequence
          variants, exon-level deletion/duplication analysis is required alongside sequencing, and hemizygous
          variants that appear heterozygous on sequencing alone are a recognized diagnostic pitfall.
      selected_evidence:
        snippet: Our results establish TANGO2 deficiency as a clinically recognizable cause of pediatric
          disease with multi-organ involvement.
        supports: SUPPORT
