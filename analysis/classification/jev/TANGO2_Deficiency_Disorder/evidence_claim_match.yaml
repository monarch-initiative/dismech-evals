      assertion_type: Pathophysiology
      assertion:
        name: Lipid and Acyl-CoA Homeostasis Failure
        biological_scale: MOLECULAR
        role: central_effector
        description: Quantitative lipidomics of TANGO2-null HepG2 cells and patient fibroblasts shows
          a marked rise in lysophosphatidic acid with a reciprocal fall in its biosynthetic product phosphatidic
          acid, consistent with insufficient acyl-CoA available for LPA acylation. Triglyceride and lysophospholipid
          pools rise, the free fatty acid pool expands, and lipid droplets enlarge. The resulting defect
          in fatty-acid handling generates high levels of reactive oxygen species and promotes lipid peroxidation.
          Critically, these changes are exacerbated by nutrient starvation - the biochemical correlate
          of the clinical fasting trigger - and are reversed by vitamin B5 supplementation, which restores
          the coenzyme A precursor pool.
        chemical_entities:
        - preferred_term: phosphatidic acid
          term:
            id: CHEBI:16337
            label: phosphatidic acid
          modifier: DECREASED
        biological_processes:
        - preferred_term: glycerolipid metabolic process
          term:
            id: GO:0046486
            label: glycerolipid metabolic process
          modifier: ABNORMAL
        - preferred_term: phospholipid biosynthetic process
          term:
            id: GO:0008654
            label: phospholipid biosynthetic process
          modifier: DECREASED
        - preferred_term: cellular response to reactive oxygen species
          term:
            id: GO:0034614
            label: cellular response to reactive oxygen species
          modifier: INCREASED
        cellular_components:
        - preferred_term: lipid droplet
          term:
            id: GO:0005811
            label: lipid droplet
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: Quantitative lipidomics revealed a marked increase in lysophosphatidic acid (LPA) and
          a concomitant decrease in its biosynthetic precursor phosphatidic acid (PA). These changes were
          exacerbated in nutrient-starved cells.
        supports: SUPPORT
