        description: 'Daily supplementation with a multivitamin containing all eight B vitamins, or a
          B-complex preparation, is the principal disease-directed intervention and is recommended in
          expert-consensus guidance. The evidence base is convergent but not randomized: in the 73-patient
          natural-history study metabolic crises were significantly reduced after supplementation was
          started, and an independent natural-history analysis found that multivitamin/B-complex intake
          greatly diminished the risk of cardiac crises. Both observations are retrospective and uncontrolled.
          No randomized controlled trial has been performed, optimal dose and formulation are not standardized,
          and the long-term safety of sustained high-dose supplementation in children (including vitamin
          B6 toxicity, for which serum monitoring is advised) is explicitly flagged as unresolved. This
          is therefore curated as a promising, guideline-endorsed but trial-unvalidated intervention rather
          than as proven standard of care.'
