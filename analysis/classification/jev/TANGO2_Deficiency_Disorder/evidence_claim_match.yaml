      assertion:
        discussion_id: tango2_spell_mechanism
        prompt: What is the neurophysiological mechanism of TANGO2 spells, and how does it relate to the
          lipid and energy defect that drives metabolic crises?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#TANGO2 Spells
        rationale: 'Spells are the single most characteristic episodic feature of the disorder, yet they
          are defined purely clinically: paroxysmal worsening of baseline neurological function without
          rhabdomyolysis or cardiac involvement. No study has established whether they are a milder expression
          of the same catabolic-stress energy failure that produces crises, a distinct channel- or network-level
          phenomenon, or something else, so no causal edge is drawn to this phenotype.'
      selected_evidence:
        snippet: Most individuals have TANGO2 spells, non-life-threatening paroxysmal worsening of baseline
          symptoms, including sudden onset of hypotonia, ataxia with loss of balance, head and body tilt,
          increased dysarthria, drooling, lethargy, and disorientation.
        supports: SUPPORT
