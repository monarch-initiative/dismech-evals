          is a conditional, substrate-dependent loss of energy reserve rather than a constitutive respiratory-chain
          enzyme deficiency. Autophagy and mitophagy are additionally impaired on starvation, limiting
          the clearance of damaged organelles. This node conforms to the module''s toxic-metabolite/energy-deficit
