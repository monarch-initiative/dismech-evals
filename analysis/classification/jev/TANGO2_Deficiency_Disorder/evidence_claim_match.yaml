                disability syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing with deletion/duplication analysis
        description: Diagnosis is established by identifying biallelic pathogenic TANGO2 variants. Because
          multiexon deletions account for a large share of pathogenic alleles, testing must combine sequence
          analysis with exon-level deletion/duplication analysis; exome sequencing alone requires additional
          copy-number analysis. In an individual with a 22q11.2 deletion and suggestive features, the
          remaining TANGO2 allele should be sequenced.
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: We illustrate the utility of routine ES data reanalysis whereby discovery of novel disease
          genes can lead to a diagnosis in previously unsolved cases and the need for additional copy-number
          variation analysis when ES is performed.
        supports: SUPPORT
    origin:
