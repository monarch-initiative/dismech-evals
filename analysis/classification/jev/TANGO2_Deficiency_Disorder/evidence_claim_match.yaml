              label: recurrent metabolic encephalomyopathic crises-rhabdomyolysis-cardiac arrhythmia-intellectual
                disability syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TANGO2 Loss of Function
        biological_scale: MOLECULAR
        role: primary_defect
        description: Biallelic loss-of-function variants in TANGO2 - multiexon deletions (predominantly
          the recurrent exon 3-9 deletion), nonsense, frameshift, canonical splice-site and missense alleles
          - abolish or severely reduce TANGO2 protein. Purified TANGO2 binds acyl-coenzyme A, and mutation
          of its conserved NRDE motif abolishes that binding, leading its authors to propose that TANGO2
          is an acyl-CoA-binding protein of the mitochondrial lumen. Separate imaging work localizes it
          predominantly to mitochondria and partially to mitochondrial sites juxtaposed to lipid droplets
          and the endoplasmic reticulum. An independent line of work identifies TANGO2 as a binding partner
          of the small heat-shock protein CRYAB that restrains desmin intermediate-filament aggregation,
          so the precise primary biochemical activity remains an area of active disagreement.
        genes:
        - preferred_term: TANGO2
          term:
            id: hgnc:25439
            label: TANGO2
        molecular_functions:
        - preferred_term: fatty-acyl-CoA binding
          term:
            id: GO:0000062
            label: fatty-acyl-CoA binding
          modifier: DECREASED
        cellular_components:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
        - preferred_term: lipid droplet
          term:
            id: GO:0005811
            label: lipid droplet
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: By exome sequencing, we identified three different bi-allelic truncating mutations in
          TANGO2 in three unrelated individuals with infancy-onset episodic metabolic crises characterized
          by encephalopathy, hypoglycemia, rhabdomyolysis, arrhythmias, and laboratory findings suggestive
          of a defect in mitochondrial fatty acid oxidation.
        supports: SUPPORT
