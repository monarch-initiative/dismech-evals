          folate metabolism. Combined B5 plus B9 pretreatment prevents the palmitate-and-fasting-induced
          energetic crisis in an independent CRISPR cardiomyocyte model. Human evidence is observational
          only; folate is not established as a standalone antiarrhythmic in TDD and is delivered in practice
          as part of B-complex supplementation.
