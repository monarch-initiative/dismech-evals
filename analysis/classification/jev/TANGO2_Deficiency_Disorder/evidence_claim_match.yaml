        prompt: Why does biallelic TANGO2 loss cause hypothyroidism in more than half of patients?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Hypothyroidism
        rationale: Hypothyroidism, often with isolated TSH elevation, affected 12 of 20 patients in the
          French cohort, but no study addresses whether it reflects a secretory-pathway defect in thyroid
          hormone production, altered hypothalamic-pituitary signalling, or another route. None of the
          entry's pathophysiology nodes accounts for it, so it is deliberately left without a causal edge
          rather than being wired to an arbitrary node.
      selected_evidence:
        snippet: Here, we describe a cohort of 20 French patients bearing mutations in the TANGO2 gene.
          We found that the main clinical presentation was the association of neurodevelopmental delay
          (n = 17), acute metabolic crises (n = 17) and hypothyroidism (n = 12), with a large intrafamilial
          clinical variability.
        supports: SUPPORT
