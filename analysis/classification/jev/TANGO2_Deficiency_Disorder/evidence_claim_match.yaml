        description: 'In TANGO2-null iPSC-derived cardiomyocytes, the palmitate-driven collapse of the
          ATP/ADP ratio prolongs the action potential; the prolongation is abolished by intracellular
          delivery of Mg-ATP or creatine kinase, showing it is energy-dependent rather than a primary
          channel defect. The metabolic crisis upregulates TRPM4, an ATP- and calcium-regulated cation
          channel, and TRPM4 knockdown or block prevents action-potential prolongation without correcting
          the energy deficit. L-type calcium channel inhibition with verapamil also prevents prolongation
          by normalizing ATP/ADP and intracellular calcium handling. Conformance to the channelopathy
          module is declared here on the altered-action-potential/calcium-handling stage only: TDD reaches
          that stage through a metabolic route, not through an inherited ion-channel variant, so the module''s
          trigger node is deliberately not claimed.'
