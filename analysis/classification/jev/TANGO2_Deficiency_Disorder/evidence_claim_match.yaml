        name: Autosomal recessive inheritance
        description: TDD is inherited in an autosomal recessive manner. Parents of an affected child are
          typically heterozygous carriers, giving a 25% recurrence risk per pregnancy. Penetrance for
          biallelic severe loss of function appears high, but expressivity is markedly variable - including
          between siblings who share a genotype - so genotype does not reliably predict severity. Consanguinity
          increases the chance of homozygosity but is not required; compound heterozygosity and unmasking
          by a 22q11.2 deletion in trans are both recognized routes to biallelic loss.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
