            label: TANGO2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: TANGO2 lies within the interval recurrently deleted in 22q11.2 deletion syndrome.
          An individual carrying a 22q11.2 deletion that removes one TANGO2 allele develops TDD if the
          remaining allele carries a pathogenic sequence variant - an autosomal-recessive second diagnosis
          unmasked by the deletion. This configuration has been documented directly, and it makes 22q11.2
          deletion syndrome an at-risk group in which TDD is thought to be underdiagnosed because the
          phenotypes overlap. A multicentre screen of 435 individuals with 22q11.2 deletion syndrome identified
          21 meeting consensus criteria for TANGO2 testing; of the nine actually sequenced with deletion/duplication
          analysis, none were diagnosed with TDD, so the practical yield of symptom-based screening remains
          unproven. This entry describes the TDD side of that relationship; the 22q11.2 Deletion Syndrome
          entry covers it as a second-diagnosis and differential-diagnosis consideration.
      selected_evidence:
        snippet: TANGO2 deficiency disorder (TDD) is a rare, autosomal recessive condition caused by pathogenic
          variants in TANGO2, a gene residing within the region commonly deleted in 22q11.2 deletion syndrome
          (22q11.2DS).
        supports: SUPPORT
