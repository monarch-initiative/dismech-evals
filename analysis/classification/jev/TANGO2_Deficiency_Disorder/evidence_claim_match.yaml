      assertion:
        discussion_id: tango2_chronic_motor_bulbar_route
        prompt: Which mechanistic route produces the chronic dystonia, dysarthria, hypotonia, speech delay
          and feeding difficulty of TDD?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Dystonia
        - phenotypes#Dysarthria
        - phenotypes#Hypotonia
        - phenotypes#Delayed Speech and Language Development
        - phenotypes#Feeding Difficulties
        rationale: The oligodendroglial cerebellar-myelin arm demonstrated in mouse accounts for motor
          incoordination, and the ataxia edge is drawn on that basis; but extending it to dystonia (a
          basal-ganglia phenotype), dysarthria, tone abnormalities, speech delay and bulbar feeding difficulty
          would outrun the published evidence, which localizes the mouse finding to motor coordination.
          These phenotypes are therefore left without causal edges until human neuropathology or further
          cell-type-specific models identify their substrate.
      selected_evidence:
        snippet: Behavioral analyses revealed that both constitutive and oligodendrocyte-specific deletion
          of Tango2 recapitulate the motor deficits associated with individuals with TDD.
        supports: SUPPORT
