        context:
        - path: /pathophysiology/0
          value:
            name: RBM10-mediated alternative splicing dysregulation
            description: Loss-of-function mutations in RBM10 (RNA Binding Motif Protein 10) impair its
              role as a U2-associated splicing repressor, leading to widespread dysregulation of alternative
              splicing across the transcriptome. RBM10 normally promotes cassette exon skipping through
              interaction with U2 snRNP at intron branch sites on chromatin. Loss of RBM10 function shifts
              hundreds to thousands of splicing events toward exon inclusion. Key downstream effects include
              NOTCH pathway de-repression via NUMB missplicing and dysregulation of extracellular matrix
              and cytoskeletal signaling through isoform changes in VCL, CD44, and TNC. These splicing
              defects disrupt developmental pathways controlling craniofacial morphogenesis, limb patterning,
              and cardiac development, leading to the characteristic TARP phenotype.
            biological_processes:
            - preferred_term: Regulation of alternative mRNA splicing via spliceosome
              term:
                id: GO:0000381
                label: regulation of alternative mRNA splicing, via spliceosome
            - preferred_term: Notch signaling pathway
              term:
                id: GO:0007219
                label: Notch signaling pathway
            - preferred_term: Extracellular matrix organization
              term:
                id: GO:0030198
                label: extracellular matrix organization
            - preferred_term: Cytoskeleton organization
              term:
                id: GO:0007010
                label: cytoskeleton organization
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Talipes equinovarus
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
        - RBM10-dependent splicing programs in limb morphogenesis
        description: The clubfoot component of TARP syndrome is modeled as a downstream limb-patterning
          consequence of RBM10-mediated splicing dysregulation.
      selected_evidence:
        snippet: Talipes equinovarus, atrial septal defect, Robin sequence, and persistence of the left
          superior vena cava are the main features of this syndrome
        supports: SUPPORT
