      assertion_type: Pathophysiology
      assertion:
        name: RBM10-mediated alternative splicing dysregulation
        description: Loss-of-function mutations in RBM10 (RNA Binding Motif Protein 10) impair its role
          as a U2-associated splicing repressor, leading to widespread dysregulation of alternative splicing
          across the transcriptome. RBM10 normally promotes cassette exon skipping through interaction
          with U2 snRNP at intron branch sites on chromatin. Loss of RBM10 function shifts hundreds to
          thousands of splicing events toward exon inclusion. Key downstream effects include NOTCH pathway
          de-repression via NUMB missplicing and dysregulation of extracellular matrix and cytoskeletal
          signaling through isoform changes in VCL, CD44, and TNC. These splicing defects disrupt developmental
          pathways controlling craniofacial morphogenesis, limb patterning, and cardiac development, leading
          to the characteristic TARP phenotype.
        biological_processes:
        - preferred_term: Regulation of alternative mRNA splicing via spliceosome
          term:
            id: GO:0000381
            label: regulation of alternative mRNA splicing, via spliceosome
        - preferred_term: Notch signaling pathway
          term:
            id: GO:0007219
            label: Notch signaling pathway
        - preferred_term: Extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
        - preferred_term: Cytoskeleton organization
          term:
            id: GO:0007010
            label: cytoskeleton organization
      selected_evidence:
        snippet: TARP (talipes equinovarus, atrial septal defect (ASD), Robin sequence, persistent left
          superior vena cava) syndrome is a rare X-linked disorder affecting the RBM10 gene
        supports: SUPPORT
