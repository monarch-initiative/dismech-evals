            id: HP:0000006
            label: Autosomal dominant inheritance
        description: A single inactivating TCF20 allele is sufficient. Most cases are de novo, about a
          tenth are inherited from a mildly affected parent, and around one in twelve arise through germline
          mosaicism, which is the figure that matters for recurrence-risk counselling.
        de_novo_rate: ~67% de novo; ~10% inherited; ~8% confirmed or suspected germline mosaicism
      selected_evidence:
        snippet: To date, a total of 91 individuals with TAND have been reported; ~67% of cases arose
          de novo, while ~10% were inherited, and, intriguingly, ~8% were either confirmed or suspected
          to have arisen via germline mosaicism.
        supports: SUPPORT
