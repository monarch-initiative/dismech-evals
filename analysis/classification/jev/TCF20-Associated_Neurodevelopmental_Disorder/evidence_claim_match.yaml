        kind: KNOWLEDGE_GAP
        prompt: How often is an apparently de novo TCF20 variant actually parental germline mosaicism,
          and what tissue should be tested to find out?
        attaches_to:
        - genetic#TCF20
        rationale: Around 8% of reported cases are confirmed or suspected germline mosaicism, but only
          two have physical confirmation, and in the documented family blood testing of both parents was
          negative by Sanger and by deep sequencing. The variant was found only by droplet digital PCR
          on urine-derived urothelial cells. The true rate is therefore a lower bound set by what people
          happened to test, and no protocol establishes which tissue to sample. This has direct consequences
          for the recurrence risk quoted to a family.
      selected_evidence:
        snippet: discusses germline mosaicism as a likely under-detected mode of inheritance in neurodevelopmental
          conditions
        supports: SUPPORT
