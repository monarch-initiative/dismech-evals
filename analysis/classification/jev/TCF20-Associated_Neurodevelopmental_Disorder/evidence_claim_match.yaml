        description: The other 22q13 deletion disorder, and the one TAND was carved out of. A terminal
          22q13.3 deletion removing SHANK3 produces Phelan-McDermid syndrome; the deletions that led to
          TCF20 sit proximal to it at 22q13.2 and leave SHANK3 intact. The clinical pictures overlap,
          so a microarray finding of a 22q13 deletion does not by itself distinguish them and the breakpoint
          location does.
