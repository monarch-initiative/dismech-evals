            preferred_term: TCF20-associated neurodevelopmental disorder
            term:
              id: MONDO:0032745
              label: developmental delay with variable intellectual impairment and behavioral abnormalities
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tand_dendritic_phenotype_translation
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does the dendritic and synaptic phenotype measured in TCF20-knockdown rodent cortical
          cultures account for the human developmental and autistic phenotype?
        attaches_to:
        - pathophysiology#Impaired Dendritic Arborization and Spine Formation
        rationale: The cellular mechanism is measured in rat cortical cultures under acute knockdown,
          not in a heterozygous animal and not in human neurons. That is a different genetic situation
          from the human disease, where one allele is lost from conception and the other is intact. The
          direction of the synaptic changes is also mixed rather than uniform, so the step from a reshaped
          synaptic composition to intellectual disability and autism is an inference. The entry types
          both edges out of this node as having unknown intermediates for that reason.
      selected_evidence:
        snippet: synaptosomal preparations of knockdown TCF20 rat cortical cultures showed significant
          downregulation of GluN2B and GABRA5, while GluA2 was significantly upregulated
        supports: SUPPORT
