        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tand_craniofacial_dysmorphism_unconnected
        kind: KNOWLEDGE_GAP
        prompt: By what route does TCF20 haploinsufficiency produce the craniofacial features seen in
          two-thirds of patients?
        attaches_to:
        - phenotypes#Craniofacial Dysmorphism
        rationale: 'Every mechanism node in this entry is neuronal: the chromatin complex, the neuronal
          transcriptional program, and dendritic and spine formation in cortical culture. None of them
          reaches craniofacial development, so the craniofacial phenotype is deliberately left with no
          incoming causal edge rather than being attached to a neuronal node it does not follow from.
          The gap is not that the finding is doubtful, it is reported in 18 of 27 patients, but that no
          cited work traces it to a mechanism. Its unpatterned character makes this harder rather than
          easier, since there is no recognizable gestalt to compare against a developmental field.'
      selected_evidence:
        snippet: craniofacial features were reported in 18/27 (67%) and other minor malformations in 10/27
          (37%), but did not appear to constitute a single recognizable or distinct phenotype
        supports: SUPPORT
