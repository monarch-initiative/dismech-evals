      assertion_type: Treatment
      assertion:
        name: Genetic Counseling With Germline Mosaicism Testing
        description: Recurrence-risk counselling has a specific technical component here. Around one in
          twelve reported cases arose through germline mosaicism, and in the documented family the variant
          was undetectable in either parent's blood by Sanger sequencing and by deep sequencing, and was
          found only by droplet digital PCR on urine-derived cells. A negative parental blood test therefore
          does not establish a de novo event.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: The variant was not detected in DNA extracted from peripheral blood in either parent
          by Sanger sequencing of PCR-generated amplicons, or by deep sequencing of PCR amplicons using
          MiSeq and MinION.
        supports: SUPPORT
