          modifier: DECREASED
        - preferred_term: synaptonemal complex assembly
          term:
            id: GO:0007130
            label: synaptonemal complex assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Loss of TEX11 function causes chromosomal asynapsis and reduced crossover formation,
          leading to elimination of spermatocytes, respectively, at the pachytene and anaphase I stages.
        supports: SUPPORT
        directness: INDIRECT
