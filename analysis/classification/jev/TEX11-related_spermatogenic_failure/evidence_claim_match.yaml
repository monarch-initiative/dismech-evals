        biological_scale: CELLULAR
        conforms_to: meiotic_prophase_failure#Synaptonemal Complex Assembly
        description: TEX11 forms foci on synapsed regions of meiotic chromosomes as a constituent of recombination
          nodules, and it binds SYCP2, an integral component of the synaptonemal complex lateral element.
          That interaction is the proposed physical link between synapsis and recombination. Losing TEX11
          produces asynapsis of homologous chromosomes together with a genome-wide reduction in crossover
          formation, rather than either defect alone.
        cell_types:
