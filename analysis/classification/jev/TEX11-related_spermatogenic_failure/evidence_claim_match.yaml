        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Meiosis I Nondisjunction in Escaping Spermatocytes
        biological_scale: CELLULAR
        description: Spermatocytes that survive the pachytene checkpoint carry too few crossovers to segregate
          their homologues, and undergo chromosome nondisjunction at the first meiotic division. These
          cells die too. This second, later loss is why TEX11 deficiency produces infertility rather than
          aneuploid offspring.
      selected_evidence:
        snippet: However, cells that survive the pachytene stage display chromosome nondisjunction at
          the first meiotic division, resulting in cell death and male infertility.
        supports: SUPPORT
        directness: INDIRECT
    origin:
