      assertion:
        name: TEX11 Loss of Function
        biological_scale: MOLECULAR
        description: Hemizygous TEX11 variants, including splice-site and missense changes and a recurrent
          99 kb deletion removing three exons from the meiosis-specific SPO22 sporulation domain, abolish
          functional TEX11 protein. In normal human testis TEX11 is expressed in late spermatocytes and
          in round and elongated spermatids; in testes of affected men that expression is absent.
        genetic_context:
          gene:
            preferred_term: TEX11
            term:
              id: hgnc:11733
              label: TEX11
          zygosity: HEMIZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: This loss, which was identical in 2 patients with azoospermia, predicts a deletion of
          79 amino acids within the meiosis-specific sporulation domain SPO22.
        supports: SUPPORT
