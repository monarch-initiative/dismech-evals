        name: X-linked recessive
        description: Affected men are hemizygous for a TEX11 loss-of-function allele on Xq13. Carrier
          women are fertile and unaffected. Because affected men are infertile without assisted reproduction,
          alleles reach probands by maternal transmission or arise de novo, and pedigrees rarely show
          the multigenerational segregation typical of dominant disease.
        inheritance_term:
          preferred_term: X-linked recessive inheritance
          term:
            id: HP:0001419
            label: X-linked recessive inheritance
      selected_evidence:
        snippet: We identified a 99-kb hemizygous loss on chromosome Xq13.2 that involved three TEX11
          exons.
        supports: SUPPORT
