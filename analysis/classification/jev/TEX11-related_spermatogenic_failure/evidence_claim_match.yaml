            term:
              id: MONDO:0010647
              label: spermatogenic failure, X-linked, 2
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Meiotic arrest on testicular biopsy
        description: The discriminating histology is meiotic arrest with germ cells present, not germ
          cell aplasia. Spermatogenesis stops in meiosis I and post-meiotic cells are absent, while spermatogonia
          and early spermatocytes remain. In the founding series the human picture was explicitly matched
          to the arrest seen in Tex11-deficient mice, and TEX11 protein was absent from the same testes.
        notes: 'Focal Sertoli-cell-only tubules can coexist with arrested ones in the same biopsy, the
          pattern described as mixed testicular atrophy. A report naming Sertoli-cell-only tubules therefore
          does not exclude this diagnosis, and does not make the entity the same as the gene-less SPGFX1
          concept discussed in notes. That mixed pattern follows from the mechanism rather than being
          an incidental observation: spermatocytes whose only asynapsed chromosomes are the sex chromosomes
          escape the pachytene checkpoint and are lost later, so different tubules arrest at different
          points.'
      selected_evidence:
        snippet: Meiotic arrest in these patients resembled the phenotype of Tex11-deficient male mice.
        supports: SUPPORT
    origin:
      assertion_path: /histopathology/0
      evidence_path: /histopathology/0/evidence/1
