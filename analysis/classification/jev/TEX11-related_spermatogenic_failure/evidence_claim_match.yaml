        description: The mouse in which the meiotic mechanism was established. It is the source of the
          asynapsis, crossover-reduction and two-stage cell-loss findings that this entry's pathophysiology
          chain rests on, and the founding human series explicitly matched patient histology to it.
        modeled_mechanisms:
        - target: Chromosomal Asynapsis and Reduced Crossover Formation
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: Establishes that TEX11 loss produces asynapsis together with reduced crossover
            formation, and the TEX11-SYCP2 interaction that links synapsis to recombination.
          limitations: The mechanism is established in mouse and inferred for human spermatocytes from
            cross-species conservation; no human cell assay of TEX11 function exists.
        - target: Pachytene Checkpoint Elimination of Spermatocytes
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: Establishes which spermatocytes are eliminated at pachytene and which escape, which
            is what makes the human histology mixed rather than uniform.
          limitations: The stage-specific selectivity is a mouse observation; human biopsies show the
            mixed pattern it predicts but have not been used to test the chromosome-specific mechanism
            directly.
      selected_evidence:
        snippet: Meiotic arrest in these patients resembled the phenotype of Tex11-deficient male mice.
        supports: SUPPORT
