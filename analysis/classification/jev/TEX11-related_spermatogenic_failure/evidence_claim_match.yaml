        context: []
      assertion_type: Treatment
      assertion:
        name: Testicular sperm extraction, withheld or not repeated
        description: The clinically actionable consequence of a TEX11 diagnosis is unusual in shape, because
          the intervention it supports is a negative one. Meiotic arrest predicts a poor yield from testicular
          sperm extraction, and TEX11 is one of only a small number of genes for which the evidence base
          linking genotype to negative retrieval outcomes is considered strong enough to act on. A molecular
          diagnosis can therefore spare a man a surgical procedure unlikely to recover usable sperm, or
          spare him a repeat of one that has already failed. Nothing restores endogenous fertility; there
          is no therapy directed at the meiotic lesion itself.
        therapeutic_modality: SURGERY
        notes: The therapeutic_modality here tags the intervention being withheld, not one being administered.
          What the diagnosis supports is a decision not to operate, or not to operate again.
        treatment_term:
          preferred_term: testicular sperm retrieval
          term:
            id: NCIT:C94427
            label: Sperm Retrieval
      selected_evidence:
        snippet: caution is warranted for genes linked to negative TESE outcomes, except for TEX11, SYCE1,
          and MSH4, each of which have 10 or more reported TESE-negative cases
        supports: SUPPORT
