      assertion_type: Discussion
      assertion:
        discussion_id: myelodysplasia_risk
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Is the bone marrow dysmyelopoiesis reported before transplantation in TFRC deficiency
          a consequence of the iron-delivery defect itself, and does it carry a real risk of myelodysplastic
          syndrome?
        attaches_to:
        - pathophysiology#Erythroid Sparing via STEAP3
        - phenotypes#Decreased total neutrophil count
        rationale: 'The cytopenias in this disease are usually described as intermittent and benign, but
          the transplant series found signs of dysmyelopoiesis and dysplasia in all three patients who
          had a pre-transplant marrow examined, and one patient developed a clonal cytogenetic abnormality
          concerning for myelodysplastic syndrome. That is a small number and a selected population -
          patients referred for transplantation - so it is not a population risk estimate. It nonetheless
          sits awkwardly with the erythroid sparing recorded in the pathograph: if erythroid precursors
          largely escape the receptor defect, what accounts for a marrow phenotype spanning myeloid lineages?
          The question is whether this is a direct consequence of impaired iron delivery to proliferating
          marrow progenitors, a secondary effect of chronic infection and inflammation, or ascertainment.'
      selected_evidence:
        snippet: 3 patients who underwent bone marrow evaluation before HSCT were found to have signs
          of dysmyelopoiesis and dysplasia
        supports: SUPPORT
