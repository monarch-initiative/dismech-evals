          name: TFRC-related Combined Immunodeficiency
          disease_term:
            preferred_term: TFRC-related combined immunodeficiency
            term:
              id: MONDO:0014760
              label: TFRC-related combined immunodeficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: steap3_erythroid_sparing
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Does STEAP3 really provide the accessory endocytosis signal that spares erythroid cells
          in TFRC-related combined immunodeficiency, and if so why does the same redundancy not operate
          in lymphocytes?
        attaches_to:
        - pathophysiology#Erythroid Sparing via STEAP3
        - pathophysiology#Impaired Transferrin-Bound Iron Delivery
        rationale: 'The cell-type selectivity is the most interesting feature of this disease and the
          least well established. The proposal is specific and testable - STEAP3 associates with TfR1
          and supplies an alternative internalization signal - but the supporting rescue was performed
          in patient fibroblasts, not in erythroid cells, so the experiment demonstrating the mechanism
          was done in the cell type the hypothesis is not about. The authors state the inference with
          hedging. Two things would settle it: showing the rescue in erythroid precursors, and showing
          that lymphocytes lack sufficient STEAP3 to do the same. Neither is reported. This matters beyond
          the disease: if correct, it identifies a lineage-restricted redundancy in receptor-mediated
          iron uptake that would be relevant wherever TfR1 trafficking is perturbed.'
      selected_evidence:
        snippet: patients had only mild anemia and only slightly increased TfR1 expression in erythroid
          precursors
        supports: SUPPORT
