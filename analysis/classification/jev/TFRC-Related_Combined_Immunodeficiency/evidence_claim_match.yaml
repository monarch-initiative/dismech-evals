        name: Immunological workup with TFRC sequencing
        description: The picture that should prompt testing is a combined immunodeficiency with normal
          lymphocyte counts but impaired lymphocyte function, hypogammaglobulinaemia, and cytopenias,
          in a child with recurrent sinopulmonary infection, chronic diarrhoea and failure to thrive.
          Raised surface TfR1 (CD71) and raised soluble serum TfR1 are directly informative, because they
          are the specific consequence of an internalization defect rather than of low receptor expression;
          sequencing TFRC confirms it.
      selected_evidence:
        snippet: Patients with a combined immunodeficiency characterized by normal numbers but impaired
          function of T and B cells had a homozygous p.Tyr20His substitution in transferrin receptor 1
          (TfR1), encoded by TFRC.
        supports: SUPPORT
