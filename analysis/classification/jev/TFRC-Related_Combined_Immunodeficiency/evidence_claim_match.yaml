        - path: /biochemical/0
          value:
            name: Surface and soluble transferrin receptor 1
            presence: INCREASED
            context: 'The diagnostically distinctive laboratory finding, and the one that separates this
              disorder from every other cause of impaired cellular iron acquisition. Because the receptor
              cannot be internalized, it accumulates where it was made: surface TfR1 is 13-fold and 7-fold
              higher on patient T and B cells respectively than on controls, and 6-fold higher on patient
              fibroblasts. Soluble TfR1, released by cleavage of the surface receptor, is correspondingly
              raised in serum. The direction is the counter-intuitive part - in ordinary iron deficiency
              TfR1 also rises, but here it rises because the receptor is stranded rather than because
              the cell is signalling for more iron, and the two contributions are not separated by any
              cited measurement.'
          role: ancestor
      assertion_type: BiomarkerReadout
      assertion:
        target: Defective TfR1 Endocytosis with Surface Accumulation
        relationship: READOUT_OF
        direction: POSITIVE
        endpoint_context: DIAGNOSTIC
        interpretation: Raised surface and soluble TfR1 is the direct observable consequence of the internalization
          block, and is what makes the mechanism visible in a patient sample.
      selected_evidence:
        snippet: Likewise, surface TfR1 expression was 6-fold higher on patient than control fibroblasts
        supports: SUPPORT
