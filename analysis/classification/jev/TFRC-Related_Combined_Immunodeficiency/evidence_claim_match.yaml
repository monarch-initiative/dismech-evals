            term:
              id: MONDO:0014760
              label: TFRC-related combined immunodeficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: iron_supplementation_therapeutic_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Iron citrate corrects the lymphocyte defects in patient cells and in the knock-in mouse.
          Has any receptor-independent iron delivery strategy been tried in patients, and if not, what
          stands in the way?
        attaches_to:
        - pathophysiology#Impaired Transferrin-Bound Iron Delivery
        - treatments#
        rationale: 'The rescue result is unusually clean for a monogenic immunodeficiency: supplying iron
          by a route that bypasses the defective receptor corrects lymphocyte proliferation, immunoglobulin
          secretion and class-switch transcripts in patient cells, and improves T cell proliferation in
          the mouse carrying the patients'' allele. That is a mechanistic argument for a non-transplant
          therapy. Yet the reported management is transplantation or prophylaxis, and the anaemia is explicitly
          described as resistant to iron supplementation - which is not the same intervention as supersaturating
          transferrin in culture, but does show that the naive version of the idea has been tried and
          failed for at least one phenotype. Nothing in the cited literature reports an attempt at receptor-independent
          iron delivery for the immune phenotype in patients, so this is recorded as a gap rather than
          a negative result. The attachment to the whole treatments section is deliberate: the gap is
          the absence of an intervention, not a defect in one that exists.'
      selected_evidence:
        snippet: mild anemia resistant to iron supplementation
        supports: SUPPORT
