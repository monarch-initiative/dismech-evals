        biological_scale: MOLECULAR
        description: 'Homozygous missense substitutions in the YTRF endocytic internalization motif of
          the TfR1 cytoplasmic tail. The motif requires an aromatic residue at the position altered by
          p.Tyr20His; the second reported allele, p.Arg22Trp, lies immediately adjacent and has the same
          functional consequence. Neither allele removes the receptor: the protein is made and reaches
          the surface, where it accumulates.'
        genes:
        - preferred_term: TFRC
          term:
            id: hgnc:11763
            label: TFRC
      selected_evidence:
        snippet: Patients with a combined immunodeficiency characterized by normal numbers but impaired
          function of T and B cells had a homozygous p.Tyr20His substitution in transferrin receptor 1
          (TfR1), encoded by TFRC.
        supports: SUPPORT
