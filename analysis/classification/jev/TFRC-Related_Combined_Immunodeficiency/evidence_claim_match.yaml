            term:
              id: MONDO:0014760
              label: TFRC-related combined immunodeficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: treg_model_direction_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Deleting this receptor in regulatory T cells causes autoimmunity in mouse, while losing
          its internalization in every cell causes immunodeficiency in humans. Does the mouse tell us
          anything about the patients, and is the vitiligo reported in patients the same phenomenon?
        attaches_to:
        - animal_models#Treg-restricted CD71 (Tfrc) conditional knockout mouse
        - pathophysiology#Impaired Transferrin-Bound Iron Delivery
        - phenotypes#Vitiligo
        rationale: 'The Treg-restricted knockout is the clearest case in this entry of a model whose phenotype
          points the opposite way from the disease. Mice lacking CD71 only in regulatory T cells develop
          a scurfy-like autoimmune syndrome from failed perinatal Treg expansion; patients with a germline
          hypomorphic allele in every cell present with infection, not autoimmunity. Two readings are
          possible and the cited literature does not choose between them. Either the difference is dose
          - a hypomorph leaves enough residual uptake for Tregs while a deletion does not - or it is competition,
          with a whole-organism defect impairing conventional and regulatory lymphocytes alike so that
          no imbalance results. The question is not idle: several patients have autoimmune-flavoured features
          (vitiligo, Evans syndrome, an HLH-like presentation) that this entry currently records without
          a mechanism, and the Treg axis is the obvious candidate. Distinguishing the two readings needs
          Treg number and function measured in patients, which is not reported.'
      selected_evidence:
        snippet: Mice with a Treg-restricted CD71 deficiency spontaneously developed a scurfy-like disease,
          caused by impaired perinatal Treg expansion.
        supports: SUPPORT
    origin:
