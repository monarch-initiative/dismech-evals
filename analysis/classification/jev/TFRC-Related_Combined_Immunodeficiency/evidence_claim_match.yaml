  1a21b7b2ce2b42bdba257b247b20c3a3b38492a0c6adbbe4bde1e41e80034db4:
    claim:
      about:
        disease:
          name: TFRC-related Combined Immunodeficiency
          disease_term:
            preferred_term: TFRC-related combined immunodeficiency
            term:
              id: MONDO:0014760
              label: TFRC-related combined immunodeficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: TFRC pathogenic variants
        gene_term:
          preferred_term: TFRC
          term:
            id: hgnc:11763
            label: TFRC
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'Two homozygous missense alleles have been reported, both in the intracellular internalization
          motif: c.58T>C (p.Tyr20His), found in every patient of the eight patient cohort and in the founding
          report, and c.64C>T (p.Arg22Trp), reported in a single Turkish patient in 2024. The allelic
          spectrum is therefore extremely narrow, and both alleles act by the same mechanism - impaired
          internalization of an otherwise expressed receptor - rather than by loss of the protein. That
          distinction matters clinically: complete absence of TfR1 would be expected to compromise erythropoiesis
          far more severely than is observed.'
        variants:
        - name: TFRC c.58T>C (p.Tyr20His)
          description: 'The founding and by far the commonest allele, homozygous in every patient of the
            eight-patient cohort and in both families of the original report. It substitutes the aromatic
            tyrosine required at the p.Y20 position of the YTRF internalization motif. The knock-in mouse
            establishes that it is hypomorphic rather than null: unlike Tfrc-null mice, homozygous knock-in
            animals are viable.'
          gene:
            preferred_term: TFRC
            term:
              id: hgnc:11763
              label: TFRC
          type: MISSENSE
          clinical_significance: PATHOGENIC
          identifiers:
          - rs863225436
          - ClinVar:VCV000218163
          functional_effects:
          - function: TfR1 internalization
            description: Disrupts recognition of the YTRF motif by the clathrin adaptor machinery, so
              the receptor is not endocytosed and accumulates at the cell surface.
        - name: TFRC c.64C>T (p.Arg22Trp)
          description: The second reported allele, homozygous in a single Turkish patient. It lies two
            codons from p.Tyr20 in the same internalization motif and produces the same internalization
            defect.
          gene:
            preferred_term: TFRC
            term:
              id: hgnc:11763
              label: TFRC
          type: MISSENSE
          clinical_significance: LIKELY_PATHOGENIC
          identifiers:
          - rs373123870
          functional_effects:
          - function: TfR1 internalization
            description: Impairs TfR1 internalization in the same way as p.Tyr20His.
      selected_evidence:
        snippet: The same homozygous missense mutation c.58T>C:p.Y20H, in the TFRC gene, was detected
          in all patients.
        supports: SUPPORT
