      assertion_type: Pathophysiology
      assertion:
        name: Erythroid Sparing via STEAP3
        biological_scale: TISSUE
        description: 'The cell-type selectivity is the mechanistically distinctive feature of this disease.
          Erythroid precursors depend on TfR1 more than lymphocytes do, yet are much less affected: patients
          have only mild anaemia, and surface TfR1 is only slightly raised in erythroid precursors rather
          than six-fold as in fibroblasts. The proposed explanation is that STEAP3, a metalloreductase
          expressed in erythroblasts, associates with TfR1 and supplies an accessory endocytosis signal
          that the mutant motif does not provide; STEAP3 partially rescued transferrin uptake in patient
          fibroblasts.'
        cell_types:
        - preferred_term: erythroblast
          term:
            id: CL:0000765
            label: erythroblast
        - preferred_term: erythroid progenitor cell
          term:
            id: CL:0000038
            label: erythroid progenitor cell
        genes:
        - preferred_term: STEAP3
          term:
            id: hgnc:24592
            label: STEAP3
      selected_evidence:
        snippet: We show that STEAP3, a metalloreductase expressed in erythroblasts, associates with TfR1
          and partially rescues transferrin uptake in patient-derived fibroblasts, suggesting that STEAP3
          may provide an accessory TfR1 endocytosis signal that spares patients from severe anemia.
        supports: SUPPORT
        directness: INDIRECT
