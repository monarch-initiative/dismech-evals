            preferred_term: TFRC-related combined immunodeficiency
            term:
              id: MONDO:0014760
              label: TFRC-related combined immunodeficiency
        context: []
      assertion_type: Biochemical
      assertion:
        name: Surface and soluble transferrin receptor 1
        presence: INCREASED
        context: 'The diagnostically distinctive laboratory finding, and the one that separates this disorder
          from every other cause of impaired cellular iron acquisition. Because the receptor cannot be
          internalized, it accumulates where it was made: surface TfR1 is 13-fold and 7-fold higher on
          patient T and B cells respectively than on controls, and 6-fold higher on patient fibroblasts.
          Soluble TfR1, released by cleavage of the surface receptor, is correspondingly raised in serum.
          The direction is the counter-intuitive part - in ordinary iron deficiency TfR1 also rises, but
          here it rises because the receptor is stranded rather than because the cell is signalling for
          more iron, and the two contributions are not separated by any cited measurement.'
        readouts:
        - target: Defective TfR1 Endocytosis with Surface Accumulation
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: Raised surface and soluble TfR1 is the direct observable consequence of the
            internalization block, and is what makes the mechanism visible in a patient sample.
      selected_evidence:
        snippet: Surface TfR1 was minimally expressed on unstimulated control T and B cells, but was expressed
          on a large percentage of patients’ T and B cells, at levels 13- and 7-fold higher, respectively,
          than in controls
        supports: SUPPORT
