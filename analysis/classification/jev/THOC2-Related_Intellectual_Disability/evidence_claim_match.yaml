      assertion_type: Phenotype
      assertion:
        category: Cognitive
        name: Intellectual Disability
        description: Intellectual disability is the core phenotype, of variable degree. The largest cohort
          refines the core to language disorder and/or intellectual disability, so some individuals have
          language impairment without frank intellectual disability, while a subset has severe-to-profound
          intellectual disability. The 2015 defining families spanned borderline to severe intellectual
          disability; the 2018 series, ascertained more severely, found intellectual disability universal
          and at least moderate in all seven individuals. The pooled cohort describes the range of cognitive
          disability as very broad, from a normal IQ to profound intellectual disability - one functionally
          confirmed variant carrier had a performance IQ of 104 with an isolated language disorder, which
          is the concrete case behind the "language disorder AND/OR intellectual disability" formulation
          of the core phenotype and the reason this band is not stated as obligate.
        frequency: VERY_FREQUENT
        diagnostic: true
        phenotype_term:
          preferred_term: Intellectual disability
          term:
            id: HP:0001249
            label: Intellectual disability
      selected_evidence:
        snippet: the range of cognitive disability in THOC2-related disorder is very broad—ranging from
          a normal IQ to a profound ID
        supports: SUPPORT
