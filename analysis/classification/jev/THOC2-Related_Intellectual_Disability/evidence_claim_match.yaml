            term:
              id: MONDO:0010496
              label: intellectual developmental disorder, X-linked, syndromic, Kumar type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hypomorphic THOC2 Variants Reducing Protein Stability
        biological_scale: MOLECULAR
        description: Every disease-associated THOC2 allele is hypomorphic rather than null, because THOC2
          is an essential gene. Two mechanistic classes are documented. Missense variants at evolutionarily
          conserved residues reduce THOC2 protein stability - 9 of 14 tested missense variants did so
          across current and published studies. Splice-site and intragenic-deletion variants instead produce
          C-terminally truncated THOC2 with loss of small regions of the C-terminal RNA-binding domain.
          Structural modelling places the altered residues in RNA-binding domains of two THOC2 conformations,
          interpreted as different intermediate RNA-binding states during RNA transport.
        genes:
        - preferred_term: THOC2
          term:
            id: hgnc:19073
            label: THOC2
      selected_evidence:
        snippet: Ex vivo missense variant testing and patient-derived cell line data from current and
          published studies show 9 of the 14 missense THOC2 variants result in reduced protein stability.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32116545
      reference_title: Expanding Clinical Presentations Due to Variations in THOC2 mRNA Nuclear Export
        Factor.
      evidence_source: IN_VITRO
      explanation: Quantifies the proportion of tested missense variants that destabilise THOC2, establishing
        reduced protein stability as the dominant missense mechanism.
