        description: Reduced THOC2 stability has a flow-on effect on the stability of its partner TREX
          subunits.
      selected_evidence:
        snippet: We show that two variants lead to decreased stability of THOC2 and its TREX-complex partners
          in cells derived from the affected individuals.
        supports: SUPPORT
