        expressivity: VARIABLE
        description: 'THOC2 is on the X chromosome and the disorder is X-linked, with affected males and
          typically milder or unaffected carrier females. Both inherited and de novo variants occur: the
          original families were ascertained through X-linked intellectual disability pedigrees, and a
          de novo variant has been documented in a female with epileptic encephalopathy, so the disorder
          is not confined to transmitting families. Heterozygous carrier mothers are clinically unaffected
          and, where tested, show highly skewed X-chromosome inactivation, which is the proposed explanation
          for their non-penetrance; the one severely affected female reported carried a de novo variant
          and her XCI status could not be assessed.'
