  3419e5f47fdb2e3905b95ea5855489c7441046c627b01a0fd3414abb23381801:
    claim:
      about:
        disease:
          name: THOC2-Related Intellectual Disability
          disease_term:
            preferred_term: THOC2-related X-linked intellectual disability
            term:
              id: MONDO:0010496
              label: intellectual developmental disorder, X-linked, syndromic, Kumar type
        context: []
      assertion_type: Phenotype
      assertion:
        category: Musculoskeletal
        name: Arthrogryposis Multiplex Congenita
        description: 'The most severe reported presentation of THOC2 disease and an allele-specific one.
          A recurrent canonical acceptor splice-site variant (c.2482-1_2484delGTCA, affecting the intron
          22/exon 23 acceptor site) has caused lethal fetal akinesia with multiple congenital joint contractures
          in male fetuses from two unrelated families reported independently. Muscle histology in the
          second family showed a myopathic picture with cytoplasmic bodies - the only tissue-level muscle
          characterisation available for this disorder. No frequency is assigned: this is a small number
          of isolated fetal reports tied to one specific variant, not a rate within the intellectual-disability
          cohorts, and it would be misleading to band it as if it were.'
        phenotype_term:
          preferred_term: Arthrogryposis multiplex congenita
          term:
            id: HP:0002804
            label: Arthrogryposis multiplex congenita
      selected_evidence:
        snippet: This is the most severe phenotype described in THOC2 gene-related disease till date.
        supports: SUPPORT
