          day 18.5, and the cortical plate and corpus callosum are correspondingly thinner. Neurons that
          do form show perturbed migration, altered electrophysiological properties and impaired synapse
          formation. This node is what connects the molecular genome-instability lesion to a brain-predominant
          clinical phenotype: the affected compartment is the proliferating progenitor pool of the developing
          cortex, which is why a ubiquitously required housekeeping factor produces a predominantly neurodevelopmental
          disease. This node accounts for the neurological arm only - the largest cohort concluded that
          THOC2 disease is also multisystemic in a significant proportion of individuals, which is modelled
          separately in the Multi-Organ Developmental Involvement node. All measurements are murine; the
          corresponding human neuroimaging findings are inconsistent: structural MRI was normal in three
          of the five individuals imaged in the 2018 series, and the 2020 pooled cohort found no unifying
          neuroradiological abnormality across the individuals it reviewed.'
