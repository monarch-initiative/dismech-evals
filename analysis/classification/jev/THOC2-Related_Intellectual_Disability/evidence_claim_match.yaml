          in a significant proportion of individuals: congenital anomalies of the cardiorespiratory, genitorenal
          and skeletal systems are each present in 10-30%, and the cohort authors attribute these to a
          role for THOC2 in multi-organ development and function rather than to a secondary consequence
          of the neurological phenotype. The molecular route from TREX destabilisation to organ malformation
          has not been investigated - no non-neural tissue has been examined in the mouse model or in
          patient material - so this node records a well-evidenced clinical observation with an unevidenced
          mechanism.'
