        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TREX Complex Destabilisation
        biological_scale: MOLECULAR
        description: 'THOC2 is the largest subunit of the TREX complex, which couples transcription to
          mRNA export. Reduced THOC2 stability propagates to the complex: the stability of the other TREX/THOC
          subunits - specifically those themselves associated with neurodevelopmental disorders - falls
          as a consequence. The disorder is therefore a complex-level lesion rather than a single-protein
          one, which is one reason the phenotype overlaps other THOC-subunit disorders. Scope of the export
          claim. The 2015 discovery paper framed the disorder as a disturbance of the canonical mRNA-export
          pathway, and that framing survives at the level of the pathway. It does NOT survive as a claim
          of measurable bulk nuclear mRNA retention: when the exon 37-38 deletion allele was tested directly,
          neither mutant mouse primary neurons nor the corresponding patient fibroblasts showed overt
          nuclear retention of mRNAs. The GO annotation below is therefore left without a DECREASED modifier
          - the pathway is the affected one, but a quantitative reduction in bulk export has not been
          demonstrated for a disease allele, and the measured downstream consequence is loss of R-loop
          and genome homeostasis rather than transcript sequestration.'
        biological_processes:
        - preferred_term: mRNA export from nucleus
          term:
            id: GO:0006406
            label: mRNA export from nucleus
      selected_evidence:
        snippet: Interestingly, reduced stability of THOC2 variant proteins has a flow-on effect on the
          stability of the multi-protein TREX complex; specifically on the other NDD-associated THOC subunits.
        supports: SUPPORT
