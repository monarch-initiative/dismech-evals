        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Perturbed R-Loop Homeostasis and DNA Damage
        biological_scale: CELLULAR
        description: 'The best-supported root mechanism, derived from a mouse model carrying a patient
          allele together with cells from the patient who carries it. Compromised THOC2/TREX function
          allows R-loops (RNA:DNA hybrids with a displaced single strand) to accumulate, producing DNA
          damage and consequent cell death during brain development. Two pieces of evidence lift this
          above a purely model-organism inference: R-loops accumulate in the patient''s own fibroblasts
          as well as in mutant mouse neural stem cells, and forced RNase H1 expression - which degrades
          the RNA strand of RNA:DNA hybrids - reduces both the R-loop burden and the comet-assay DNA damage,
          placing R-loops upstream of the damage rather than alongside it. Confidence is nonetheless held
          at PROVISIONAL: the rescue experiment was performed in mouse neural stem cells rather than patient
          cells, only the exon 37-38 deletion allele has been tested, and no R-loop or DNA-damage measurement
          exists in human brain tissue.'
        mechanism_confidence: PROVISIONAL
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        biological_processes:
