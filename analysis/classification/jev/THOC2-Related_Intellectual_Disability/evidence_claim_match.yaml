          modifier: INCREASED
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: The Thoc2Δ/Y mouse brain development is significantly impacted by compromised THOC2/TREX
