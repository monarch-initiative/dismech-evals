            biological_scale: MOLECULAR
            description: Every disease-associated THOC2 allele is hypomorphic rather than null, because
              THOC2 is an essential gene. Two mechanistic classes are documented. Missense variants at
              evolutionarily conserved residues reduce THOC2 protein stability - 9 of 14 tested missense
              variants did so across current and published studies. Splice-site and intragenic-deletion
              variants instead produce C-terminally truncated THOC2 with loss of small regions of the
              C-terminal RNA-binding domain. Structural modelling places the altered residues in RNA-binding
              domains of two THOC2 conformations, interpreted as different intermediate RNA-binding states
              during RNA transport.
            genes:
