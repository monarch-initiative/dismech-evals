              label: systemic lupus erythematosus 17
        context: []
      assertion_type: Inheritance
      assertion:
        name: X-linked dominant inheritance
        inheritance_term:
          preferred_term: X-linked dominant inheritance
          term:
            id: HP:0001423
            label: X-linked dominant inheritance
        description: TLR7 is on the X chromosome and pathogenic gain-of-function variants act in an X-linked
          dominant pattern. Across the reported cohort there is a marked female predominance (10/11 patients),
          thought to reflect the severity of the phenotype in hemizygous males rather than the inheritance
          mode alone; the single reported male had severe early-onset disease. The founding p.Y264H variant
          arose de novo, whereas the p.F507S variant has been transmitted maternally. A somatic F506S
          case has also been reported, but mosaicism is not a general feature and HP:0001442 is not bound
          here.
      selected_evidence:
        snippet: We identified a de novo, previously undescribed missense TLR7Y264H variant in a child
          with severe lupus and additional variants in other patients with lupus.
        supports: SUPPORT
