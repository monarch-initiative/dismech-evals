        causal_link_type: DIRECT
      selected_evidence:
        snippet: Whereas MnCl2 supplementation unambiguously fully rescues the N- and O-linked as well
          as GAG glycosylations in TMEM165-deficient cells, D-Gal supplementation only rescues the N-linked
          glycosylation, without any effects on the other Golgi-related glycosylation types.
        supports: SUPPORT
