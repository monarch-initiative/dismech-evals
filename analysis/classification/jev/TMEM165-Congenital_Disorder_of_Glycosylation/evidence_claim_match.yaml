        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'Also known as TPARL. Two mechanistic classes of allele are published. The deep intronic
          c.792+182G>A variant, found homozygous in three Georgian Jewish patients, activates a cryptic
          splice donor and almost abolishes full-length protein; these patients have the full skeletal
          phenotype. The missense alleles (p.Arg126His, p.Arg126Cys, p.Gly304Arg, p.Glu108Gly, p.Ala310Pro)
          reduce protein stability, shift the protein toward lysosomes (Arg126) or disrupt the conserved
          E-phi-G-D-[KR]-[TS] cation-binding motif (Glu108; Gly304 indirectly). The original report''s
          summary states that the missense-allele patients were milder and lacked the skeletal phenotype,
          but its own case descriptions separate them: the p.Arg126His homozygote (case 4) had no clear
          skeletal anomalies, while the p.Arg126Cys/p.Gly304Arg compound heterozygote (case 5) had osteoporosis,
          vertebral dysplasia and kyphoscoliosis. Later missense patients (p.Ala310Pro) had a predominant
          bone phenotype, so the genotype-phenotype relationship is not settled.'
        variants:
        - name: c.792+182G>A (deep intronic, cryptic splice donor)
          description: Homozygous in the founding sibling pair and one unrelated patient of the same origin.
            Activates a cryptic donor, replacing exon 4 with a 117 bp intronic sequence; the aberrant
            transcript is degraded and full-length protein is barely detectable.
        - name: c.377G>A p.(Arg126His) and c.376C>T p.(Arg126Cys)
          description: Two substitutions of the same conserved arginine, found homozygous (Arg126His,
            consanguineous Turkish family) and compound heterozygous with p.Gly304Arg (Arg126Cys).
        - name: c.323A>G p.(Glu108Gly)
          description: Homozygous in two siblings of a consanguineous family, both of whom died in infancy;
            the second had nephrotic syndrome and congenital heart defects. The substitution sits in the
            conserved cytosolic ELGDK motif and significantly reduces transport activity.
        - name: c.928G>C p.(Ala310Pro)
          description: Homozygous in one patient diagnosed at two months with a predominant bone phenotype;
            the protein is functional but unstable.
      selected_evidence:
        snippet: In our cohort of unsolved CDG-II cases, we found another individual with the same mutation
          and two unrelated individuals with missense mutations in TMEM165.
        supports: SUPPORT
