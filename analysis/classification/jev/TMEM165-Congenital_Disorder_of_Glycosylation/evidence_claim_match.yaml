              label: TMEM165-congenital disorder of glycosylation
        context:
        - path: /genetic/0
          value:
            name: TMEM165
            gene_term:
              preferred_term: TMEM165
              term:
                id: hgnc:30760
                label: TMEM165
            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            notes: 'Also known as TPARL. Two mechanistic classes of allele are published. The deep intronic
              c.792+182G>A variant, found homozygous in three Georgian Jewish patients, activates a cryptic
              splice donor and almost abolishes full-length protein; these patients have the full skeletal
              phenotype. The missense alleles (p.Arg126His, p.Arg126Cys, p.Gly304Arg, p.Glu108Gly, p.Ala310Pro)
              reduce protein stability, shift the protein toward lysosomes (Arg126) or disrupt the conserved
              E-phi-G-D-[KR]-[TS] cation-binding motif (Glu108; Gly304 indirectly). The original report''s
              summary states that the missense-allele patients were milder and lacked the skeletal phenotype,
              but its own case descriptions separate them: the p.Arg126His homozygote (case 4) had no
              clear skeletal anomalies, while the p.Arg126Cys/p.Gly304Arg compound heterozygote (case
              5) had osteoporosis, vertebral dysplasia and kyphoscoliosis. Later missense patients (p.Ala310Pro)
              had a predominant bone phenotype, so the genotype-phenotype relationship is not settled.'
          role: ancestor
      assertion_type: Variant
      assertion:
        name: c.377G>A p.(Arg126His) and c.376C>T p.(Arg126Cys)
        description: Two substitutions of the same conserved arginine, found homozygous (Arg126His, consanguineous
          Turkish family) and compound heterozygous with p.Gly304Arg (Arg126Cys).
      selected_evidence:
        snippet: P4 is homozygous for the G>A transition at position c.377, and P5 is compound heterozygous
          for the C>T transition at position 376 and the G>A transition at position 910.
        supports: SUPPORT
