  bb9317fda43e3816b62ae695f7452966e5ec2e3a10fc037b7c81c5c894345e6a:
    claim:
      about:
        disease:
          name: TMEM165-Congenital Disorder of Glycosylation
          disease_term:
            preferred_term: TMEM165-congenital disorder of glycosylation
            term:
              id: MONDO:0013870
              label: TMEM165-congenital disorder of glycosylation
        context: []
      assertion_type: Treatment
      assertion:
        name: Oral D-Galactose Supplementation
        description: Oral D-galactose, escalated from 0.5 to 1.5 g/kg/day (maximum 50 g/day) over 18 weeks
          in two c.792+182G>A patients. Well tolerated. Improved transferrin sialylation and serum N-glycan
          galactosylation, APTT, antithrombin, IGF-1, IGFBP3 and ALT in one or both patients; no effect
          on creatine kinase, TSH or cholesterol, and 1 g/kg/day was as good as 1.5. In cells galactose
          corrects N-glycosylation but not O-glycosylation or glycosaminoglycan synthesis, so it bypasses
          only the galactosylation step.
        treatment_term:
          preferred_term: oral D-galactose supplementation
          term:
            id: NCIT:C15447
            label: Dietary Intervention
          therapeutic_agent:
          - preferred_term: D-galactose
            term:
              id: CHEBI:12936
              label: D-galactose
        therapeutic_modality: SMALL_MOLECULE
        dosing_interval: daily
        dosing_interval_days: 1
        target_phenotypes:
        - preferred_term: Type II transferrin isoform profile
          term:
            id: HP:0012301
            label: Type II transferrin isoform profile
        - preferred_term: coagulation factor deficiency
          term:
            id: HP:0001928
            label: Abnormality of coagulation
      selected_evidence:
        snippet: We then demonstrated that oral galactose supplementation in patients with TMEM165-deficient
          CDG improved biochemical and clinical parameters, including a substantial increase in the negatively
          charged transferrin isoforms, and a decrease in hypogalactosylated total N-glycan structures,
          endocrine function, and coagulation parameters.
        supports: SUPPORT
