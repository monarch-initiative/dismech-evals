      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing of TMEM165 including deep intronic sequence
        description: Confirms biallelic variants, and has been used prenatally in a family with a known
          variant. The recurrent c.792+182G>A variant lies deep in intron 4, outside the exons and flanking
          splice sites that exome sequencing covers; the founding authors state that exome sequencing
          would not have found it.
      selected_evidence:
        snippet: the causal mutation in the index family would never have been identified if the affected
          individuals' samples had been directly subjected to exome sequencing.
        supports: SUPPORT
