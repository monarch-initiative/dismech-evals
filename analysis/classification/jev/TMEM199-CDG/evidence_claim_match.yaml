      assertion_type: Discussion
      assertion:
        discussion_id: tmem199_course_heterogeneity
        kind: KNOWLEDGE_GAP
        prompt: Is TMEM199-CDG genuinely non-progressive, or does the reported stability reflect the p.Arg31Pro
          founder allele that most published patients carry?
        attaches_to:
        - progression#Childhood to adolescence, non-progressive
        - phenotypes#Periportal hepatic fibrosis
        - phenotypes#Cirrhosis
        rationale: The two-decade stability that families are told about comes from European patients,
          four of seven families of whom carry the same p.Arg31Pro allele. The one Chinese patient, carrying
          a different frameshift variant, had cirrhosis on biopsy. With nine patients total the genotype
          and the geography are confounded, and the reassuring prognosis may not generalise.
        status: OPEN
      selected_evidence:
        snippet: To the best of our knowledge, novel findings included strabismus, cirrhosis by liver
          biopsy, reduced expression of TMEM199 by immunohistochemistry, and a frameshift variant of c.128delA/p.Lys43Argfs*25
          in the TMEM199 gene.
        supports: SUPPORT
