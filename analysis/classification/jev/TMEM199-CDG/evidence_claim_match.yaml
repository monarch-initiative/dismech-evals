      assertion_type: DifferentialDiagnosis
      assertion:
        name: Wilson disease
        description: 'Low ceruloplasmin plus liver disease is the classic Wilson picture. The discriminators
          are urinary copper, which is normal here and raised in Wilson disease, and the transferrin isoform
          profile, which is normal in Wilson disease. The cost of getting it wrong is measurable: one
          reported patient spent a year on bicyclic alcohol, zinc sulfate and penicillamine with no effect.'
      selected_evidence:
        snippet: However, the absence of ATP7B mutation and normal DNA copy number variant (CNV) ruled
          out Wilson disease.
        supports: SUPPORT
