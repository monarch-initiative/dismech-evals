          Chinese patient received bicyclic alcohol, zinc sulfate and penicillamine for a year from age
          four with no effect, and the disease did not progress over that year either -- so the stability
          cannot be credited to the treatment. This entry records the failure because the entry is framed
          around the Wilson-mimic trap, and a reader needs to know that falling into it costs a year rather
          than being harmless.
