        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tmem199_copper_mechanism
        kind: KNOWLEDGE_GAP
        prompt: Why is serum ceruloplasmin low in TMEM199-CDG -- because ceruloplasmin itself is hypoglycosylated
          and cleared faster, because copper loading of apoceruloplasmin fails in an abnormally acidified
          compartment, or both?
        attaches_to:
        - pathophysiology#Abnormal Copper and Ceruloplasmin Handling
        rationale: Low ceruloplasmin is one of the two features that make this a Wilson mimic, and it
          recurs across every Golgi-homeostasis CDG, so it is not incidental. But no reported study separates
          the glycoprotein-stability explanation from the copper-loading one in these patients. The edge
          into this node is marked INDIRECT_UNKNOWN_INTERMEDIATES for that reason.
        status: OPEN
      selected_evidence:
        snippet: Biological results were similar to previously described patients, including hypercholesterolemia,
          elevated alkaline phosphatases and defects in copper metabolism.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
