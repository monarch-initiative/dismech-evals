      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous TOPORS Last-Exon Variant
        conforms_to: photoreceptor_degeneration#Photoreceptor Gene Defect
        description: The initiating lesion is a heterozygous germline TOPORS variant. Most are frameshift
          or nonsense variants in the last exon (exon 3) that fall between residues 807 and 867, near
          the C-terminus of the 1,045 residue protein; truncating variants outside this window, and N-terminal
          copy number losses, are found in people without RP. Missense variants make up about a third
          of reported alleles and include p.Gln402Pro, which causes a pericentral form.
        biological_scale: MOLECULAR
        role: trigger
        genes:
        - preferred_term: TOPORS
          term:
            id: hgnc:21653
            label: TOPORS
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: Functional impact is left unset because the literature disagrees between haploinsufficiency
            and a dominant-negative effect; see mechanistic_hypotheses.
      selected_evidence:
        snippet: A comprehensive analysis showed that 64.1% (25/39) of the mutant alleles are truncated
          mutations, and 34.3% (12/39) are missense mutations.
        supports: SUPPORT
