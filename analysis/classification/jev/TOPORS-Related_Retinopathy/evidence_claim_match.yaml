        hypothesis_label: TOPORS dominant-negative effect
        status: ALTERNATIVE
        description: Pathogenic truncations cluster in a short C-terminal window while N-terminal truncations
          and deletions are tolerated, which suggests that a truncated protein interferes with the remaining
          normal TOPORS. Proposed from the allele distribution; no functional test of interference has
          been reported.
