        kind: KNOWLEDGE_GAP
        prompt: Would drugs that lower thin-filament calcium sensitivity help patients with hypercontractile
          TPM2 variants, and calcium sensitisers help those with hypocontractile variants?
        attaches_to:
        - pathophysiology#Increased Thin-Filament Calcium Sensitivity
        - pathophysiology#Reduced Thin-Filament Calcium Sensitivity
        rationale: The two molecular classes have opposite contractile defects, so a single contractility
          drug could help one class and harm the other. A calcium sensitiser raised calcium sensitivity
          in hypocontractile patient fibres ex vivo, and the p.Lys7del study proposes the opposite approach
          for hypercontractile disease, but no clinical study has tested either.
      selected_evidence:
        snippet: increased Ca(2+) sensitivity of contraction, suggesting a potential therapeutic approach
          in patients carrying the E41K beta-Tm mutation.
        supports: SUPPORT
