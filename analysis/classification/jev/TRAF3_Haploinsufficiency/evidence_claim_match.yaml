        description: 'With less TRAF3 to hold NIK down, non-canonical NF-kB2 signalling runs above its
          resting level. Patient B cells show increased NF-kB2 activation directly, and the heterozygous
          mouse shows the same thing alongside the downstream transcriptional output - the survival proteins
