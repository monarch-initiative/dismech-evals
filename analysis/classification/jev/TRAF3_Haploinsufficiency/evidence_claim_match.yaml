          not been demonstrated in a patient. What exists is a plausible substrate (chronic NF-kB2 and
          survival-protein signalling), an epidemiological association, a mouse in which complete B cell
          TRAF3 loss produces lymphoma with age, and a naturally occurring canine B cell lymphoma in which
          TRAF3 mutation is common.'
