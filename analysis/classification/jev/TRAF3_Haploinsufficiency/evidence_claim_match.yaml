        biological_scale: CELLULAR
        description: 'B cells with reduced TRAF3 survive longer than they should and accumulate. In the
          heterozygous mouse this is visible as increased spleen weight and splenic B cell numbers; in
          the complete B cell knockout the same axis produces lymphoid organ enlargement, autoantibodies
          and lymphoma with age. Patient B cells also show elevated mitochondrial respiration, so the
          survival advantage has a metabolic component and not only an anti-apoptotic one.

          IL-6 responsiveness is raised too: heterozygous B cells have higher phospho-STAT3 Y705 after
          IL-6 stimulation than wild type, though the difference reached significance only at the earliest
          timepoint - curated at the strength the source states it.'
