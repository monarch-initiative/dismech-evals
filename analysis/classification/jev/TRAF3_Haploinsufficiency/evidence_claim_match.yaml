              label: TRAF3 haploinsufficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous TRAF3 Loss-of-Function Variant
        role: trigger
        biological_scale: MOLECULAR
        description: A single TRAF3 allele carries a premature-stop or frameshift variant. Reported alleles
          include the stop-gain variants p.Arg163* and p.Gln407*. The other allele is normal, and the
          variants act by reducing the amount of protein made rather than by producing an interfering
          product - which is what distinguishes this disease from its allelic dominant-negative counterpart.
        genetic_context:
          gene:
            preferred_term: TRAF3
            term:
              id: hgnc:12033
              label: TRAF3
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'Monoallelic truncating variants reducing TRAF3 expression. Typed LOSS_OF_FUNCTION
            rather than DOMINANT_NEGATIVE, but not because the measured protein loss is a clean 50%: it
            is not. In the four founding-cohort patients tested the protein fell by more than half, and
            the authors proposed that increased ubiquitin-mediated proteasomal degradation of the wild-type
            product may account for the excess.

            The typing still holds. The alleles are truncating and act by removing one allele''s output,
            and the accelerated turnover proposed here is a downstream consequence of the reduced dose
            rather than an interfering mutant protein. The distinction from the allelic dominant-negative
            disorder survives on both counts - protein there falls to roughly a sixth of control, and
            the phenotype is viral rather than bacterial.'
        genes:
        - preferred_term: TRAF3
          term:
            id: hgnc:12033
            label: TRAF3
      selected_evidence:
        snippet: Affected individuals each had monoallelic mutations in TRAF3 that reduced TRAF3 expression.
        supports: SUPPORT
