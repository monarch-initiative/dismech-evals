  6e9a3a4667c5ab16abe67f4c6269439ae4b169511ba8a11e100f911a414bb87d:
    claim:
      about:
        disease:
          name: TRAF3 Haploinsufficiency
          disease_term:
            preferred_term: TRAF3 haploinsufficiency
            term:
              id: MONDO:0100513
              label: TRAF3 haploinsufficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced TRAF3 Protein Dosage
        role: central_effector
        biological_scale: MOLECULAR
        description: 'The disease is a dosage disease: roughly half the normal amount of TRAF3 protein
          is enough to produce it. That is not obvious a priori for an adaptor whose job is constitutive
          negative regulation, and the mouse work makes the case directly - B cell-conditional heterozygous
          mice have a 40 to 50% reduction in TRAF3 protein and mRNA in their B cells and a measurable
          phenotype at that level, intermediate between wild type and complete knockout.

          The node also explains why this pathway is dosage-sensitive at all. TRAF3 is degraded as part
          of normal signalling: CD40 and BAFF-R engagement drives its polyubiquitination and proteasomal
          destruction for hours after the signal. A cell that starts with half the protein and then degrades
          some of it on every activation event has correspondingly less brake to spare.'
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: K48-linked polyubiquitination of TRAF3
          term:
            id: GO:0070936
            label: protein K48-linked ubiquitination
      selected_evidence:
        snippet: We found that B-Traf3+/− mice have a 40 to 50% decrease in the amount of TRAF3 protein
          and Traf3 mRNA in their B cells
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40773231
      reference_title: Reduction of TRAF3 by heterozygosity or aging impacts B cell function.
      evidence_source: MODEL_ORGANISM
      explanation: Quantifies the dosage reduction that this node is about, in the model built to match
        the human genotype.
