        biological_processes:
        - preferred_term: non-canonical NF-kappaB signal transduction
          term:
            id: GO:0038061
            label: non-canonical NF-kappaB signal transduction
          modifier: INCREASED
      selected_evidence:
        snippet: Immunophenotyping showed that patients' B cells were dysregulated, exhibiting increased
          nuclear factor-κB 2 activation, elevated mitochondrial respiration, and heightened inflammatory
          responses.
        supports: SUPPORT
