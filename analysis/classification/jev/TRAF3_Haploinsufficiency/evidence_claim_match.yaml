              label: TRAF3 haploinsufficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: TRAF3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: TRAF3
          term:
            id: hgnc:12033
            label: TRAF3
        association: 'Heterozygous loss-of-function variants in TRAF3 cause this disease. The gene-disease
          relationship rests on nine patients from five unrelated families in the founding study plus
          three patients from two further families in the 2024 reanalysis, with a consistent immunophenotype
          and a mechanism that the B cell-conditional heterozygous mouse reproduces at the same gene dose.

          Every published allele is truncating. The founding cohort contributed p.Tyr425*, p.Ser356Profs*6
          and p.Gln114*; the 2024 cohort added p.Arg163* and p.Gln407*, with p.Arg163* recurring across
          both.

          That uniformity is what makes the variant class usable for interpretation. Premature-stop and
          frameshift alleles reduce TRAF3 output and cause this disease. Missense alleles that destabilise
          the wild-type protein - which take total TRAF3 below what haploinsufficiency alone would give
          - cause a different, allelic disorder with a different phenotype, and should not be curated
          against this entry.

          Practically, TRAF3 belongs on any CVID or hypogammaglobulinemia gene panel: all three patients
          in the 2024 cohort already carried a CVID diagnosis and were on immunoglobulin replacement when
          the variant was found by targeted reanalysis.'
      selected_evidence:
        snippet: Thus, we define monogenic TRAF3 haploinsufficiency syndrome and demonstrate how common
          TRAF3 variants affect a range of human diseases.
        supports: SUPPORT
