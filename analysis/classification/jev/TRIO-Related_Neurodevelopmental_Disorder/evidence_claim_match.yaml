  a76f47013e00aee38d5550daf8e20e77b80e1185efed02e501dc0ab437f5b526:
    claim:
      about:
        disease:
          name: TRIO-Related Neurodevelopmental Disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Seventh Spectrin Repeat Gain-of-Function and RAC1 Hyperactivation
        description: Missense variants clustering in the seventh spectrin repeat domain of TRIO disrupt
          the intramolecular autoinhibition of the GEF1 domain by the spectrin repeats, producing increased
          RAC1 activation with enhanced neurite outgrowth and lamellipodia formation. This TRIO-mediated
          RAC1 hyperactivation is proposed to underlie the macrocephaly and the more severe intellectual
          disability of the MRD63 arm, with a striking correlation observed between RAC1 activation level
          and head size.
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Rac protein signal transduction
          term:
            id: GO:0016601
            label: Rac protein signal transduction
          modifier: INCREASED
        - preferred_term: Neuron projection development
          term:
            id: GO:0031175
            label: neuron projection development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Several missense variants that cluster in the spectrin repeat domain have been functionally
          shown to lead to increased RAC1 activation and enhanced neurite outgrowth and lamellipodia formation
        supports: SUPPORT
