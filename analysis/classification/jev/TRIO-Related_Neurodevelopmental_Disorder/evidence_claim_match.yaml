  b8ec5cc31660c8c3317c35759f781b2970b991e0d1c27e8b027973ceddcd79bf:
    claim:
      about:
        disease:
          name: TRIO-Related Neurodevelopmental Disorder
        context: []
      assertion_type: Genetic
      assertion:
        name: TRIO
        gene_term:
          preferred_term: TRIO
          term:
            id: hgnc:12303
            label: TRIO
        association: Causal
        relationship_type: CAUSATIVE
        notes: 'Heterozygous pathogenic variants in TRIO cause both MRD44 and MRD63. A genotype-phenotype
          correlation is defined by variant class and its direction of effect on RAC1 activity: (1) GEFD1
          missense variants and protein-truncating (nonsense/frameshift) variants act by loss-of-function
          (reduced RAC1 activation) and associate with microcephaly and milder ID (MRD44); (2) seventh
          spectrin repeat missense variants act by gain-of-function (increased RAC1 activation via released
          autoinhibition) and associate with macrocephaly and more severe ID (MRD63). The reported p.Ile2580Phe
          second-SH3 case is retained as a proposed, unreplicated extension of the MRD63 arm rather than
          being folded into the established spectrin-repeat mechanism.'
