      assertion_type: Pathophysiology
      assertion:
        name: Impaired Dendritic and Synaptic Morphogenesis
        description: Both the hypo- and hyper-activation of RAC1 converge on abnormal actin-based remodeling
          of dendritic and synaptic structures. Dysregulated RAC1 control of actin polymerization at glutamatergic
          synapses disturbs dendritic arborization, spine morphogenesis, and excitatory synaptic transmission,
          providing a shared cellular substrate for the intellectual disability, speech delay, and neurobehavioral
          phenotype seen across TRIO-related disease despite the opposing head-size outcomes.
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Dendritic spine morphogenesis
          term:
            id: GO:0060997
            label: dendritic spine morphogenesis
          modifier: ABNORMAL
        - preferred_term: Regulation of dendrite development
          term:
            id: GO:0050773
            label: regulation of dendrite development
          modifier: ABNORMAL
      selected_evidence:
        snippet: directly activating the small GTPase Rac1.
