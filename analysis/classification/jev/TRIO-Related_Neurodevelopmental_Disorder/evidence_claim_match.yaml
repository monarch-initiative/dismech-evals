        description: Missense variants in the RAC1-activating GEFD1 domain, and protein-truncating variants
          across TRIO, reduce TRIO-mediated RAC1 binding and activation. In neuronal and heterologous
          models these loss-of-function variants impair neurite outgrowth and lamellipodia formation and
          reduce excitatory synaptic transmission. The hypoactivation of RAC1 is proposed to underlie
          the microcephaly and milder intellectual disability of the MRD44 arm.
        cell_types:
