  65c13b5750b5c3e7c5aa81efeaf4d15ce790ca0be11c6caab7b3f05791f99c2b:
    claim:
      about:
        disease:
          name: TRIO-Related Neurodevelopmental Disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TRIO GEF Regulation of RAC1 Signaling
        description: TRIO is a Dbl-family Rho guanine nucleotide exchange factor and a major regulator
          of neuronal development. Through its first GEF domain (GEFD1) it catalyzes GDP-to-GTP exchange
          on RAC1 (and RHOG), while its second GEF domain (GEFD2) activates RHOA. By controlling RAC1
          activity and actin cytoskeleton remodeling, TRIO governs neuronal migration, axon outgrowth
          and guidance, dendritic arborization, and excitatory synaptogenesis. Tight bidirectional control
          of TRIO-RAC1 signaling is required for normal cortical development, and pathogenic TRIO variants
          perturb this axis in opposite directions depending on the affected domain.
        genes:
        - preferred_term: TRIO
          term:
            id: hgnc:12303
            label: TRIO
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Rac protein signal transduction
          term:
            id: GO:0016601
            label: Rac protein signal transduction
          modifier: ABNORMAL
        - preferred_term: Actin filament organization
          term:
            id: GO:0007015
            label: actin filament organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: The first GEF domain (GEFD1) regulates RAC1 and RHOG activity, and the second GEF domain
          (GEFD2) regulates RHOA activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:32109419
      reference_title: Opposite Modulation of RAC1 by Mutations in TRIO Is Associated with Distinct, Domain-Specific
        Neurodevelopmental Disorders.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the domain architecture and the RAC1/RHOA GEF activities of TRIO.
