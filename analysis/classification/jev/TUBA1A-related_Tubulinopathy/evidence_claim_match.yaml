        name: Contribution of TUBA1A to lissencephaly cohorts
        description: TUBA1A is not a stand-alone prevalence figure so much as a share of the lissencephaly
          spectrum. It accounts for roughly 1% of classic lissencephaly but about 30% of lissencephaly
          with cerebellar hypoplasia, making it the first major gene identified for that rarer phenotype.
          Within cohorts ascertained specifically for complex cortical malformation with tubulin testing,
          TUBA1A is the most frequently mutated tubulin gene.
      selected_evidence:
        snippet: We identified novel and recurrent TUBA1A mutations in approximately 1% of children with
          classic LIS and in approximately 30% of children with LCH, making this the first major gene
          associated with the rare LCH phenotype
