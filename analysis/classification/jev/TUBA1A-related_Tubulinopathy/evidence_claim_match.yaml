      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing
        description: Diagnosis is confirmed by identifying a heterozygous pathogenic TUBA1A variant, in
          practice by exome or genome sequencing (trio where possible, given the de novo mechanism) or
          by a targeted cortical-malformation panel. Variant interpretation is aided by a complete functional
          atlas of all 2,683 TUBA1A coding variants, which assigns variants to classes acting on folding,
          chaperone engagement, or protofilament geometry.
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: This approach complements conservation-based predictors and enables functional reinterpretation
          of disease-associated variants.
