            term:
              id: MONDO:0012703
              label: lissencephaly due to TUBA1A mutation
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Prenatal neurosonography
        description: 'Tubulinopathy was historically a postnatal diagnosis, but second- and early third-trimester
          anomaly scanning can now raise the suspicion in utero, with dedicated neurosonography and targeted
          genetic testing following recognition of red-flag patterns. Reported prenatal detection is most
          common at 28-34 weeks, though a TUBA1A case has been characterised at 21 weeks on findings that
          were individually subtle - low-normal head circumference, cerebellar hypoplasia, partial callosal
          agenesis, interhemispheric fissure interdigitation, ventricular asymmetry and basal ganglia
          asymmetry. The clinical purpose is explicit: parental counselling and decisions about continuation
          of pregnancy.'
        diagnosis_term:
          preferred_term: fetal neurosonography
          term:
            id: NCIT:C222238
            label: Fetal Ultrasound Imaging
      selected_evidence:
        snippet: Amniocentesis with trio genome sequencing detected a novel, de novo heterozygous c.799T>C
          variant in TUBA1A that has not been previously reported.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/1
      context_paths:
