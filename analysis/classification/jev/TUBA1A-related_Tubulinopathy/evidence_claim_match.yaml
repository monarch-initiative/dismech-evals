  511886fa321872d6a96ea4be88cfc1410e6a57d2b8e52fcac840232cbf07ffe8:
    claim:
      about:
        disease:
          name: TUBA1A-related Tubulinopathy
          disease_term:
            preferred_term: lissencephaly due to TUBA1A mutation
            term:
              id: MONDO:0012703
              label: lissencephaly due to TUBA1A mutation
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: 'Among the highest in the grouping. TUBA1A carries the lissencephaly-predominant end
          of the tubulinopathy spectrum, and the resulting impairment is severe across every domain measured.
          On caregiver-rated developmental profiling across the four curated tubulinopathy genes, challenges
          were observed in all domains with motor skills most severely affected, and co-occurring vision
          impairment - present in most of that cohort - tracked with greater overall delay. Burden extends
          to the family: quality-of-life scores in genetically confirmed lissencephaly are low, and a
          median of eight concurrent supportive therapies per patient is typical.'
      selected_evidence:
        snippet: Group-level challenges were observed across all domains evaluated, and motor skills were
