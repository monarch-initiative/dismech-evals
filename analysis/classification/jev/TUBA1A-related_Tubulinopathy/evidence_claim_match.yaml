        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Alpha-Tubulin (TUBA1A) Function
        description: Heterozygous de novo missense mutations in TUBA1A alter the brain-predominant alpha-1A
          tubulin subunit. Disease-associated substitutions map to functionally critical regions of the
          protein, including the GTP-binding pocket, and impair tubulin heterodimer formation and microtubule
          assembly. Additional mutations disrupt the binding surfaces for microtubule-associated proteins,
          so that the alpha-tubulin lesion compromises microtubule structure and the docking of the regulatory
          and motor proteins that act on microtubules. This establishes altered alpha-tubulin function
          as the initiating molecular lesion of the malformation.
        conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule Apparatus Perturbation
        biological_scale: MOLECULAR
        genetic_context:
          functional_impact_category: DOMINANT_NEGATIVE
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          allele_type: missense
          description: 'Disease alleles are heterozygous, almost always de novo missense substitutions;
            no nonsense, frameshift, or whole-gene-deletion alleles are reported, so the mechanism is
            not haploinsufficiency. For the recurrent Arg402 alleles the mechanism has been resolved directly:
            mutant alpha-tubulin is incorporated into microtubules and poisons them by populating the
            polymer with defective dynein-binding sites, and the degree of dynein impairment scales with
            mutant expression level. Comprehensive mutagenesis of all 2,683 TUBA1A coding variants further
            separates the allele space into classes acting on folding, chaperone engagement, and protofilament
            geometry, so DOMINANT_NEGATIVE describes the best-resolved recurrent alleles rather than every
            reported variant.'
        cell_types:
        - preferred_term: cortical progenitor and migrating neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: tubulin heterodimer assembly
          term:
            id: GO:0007021
            label: tubulin complex assembly
          modifier: DECREASED
        - preferred_term: microtubule cytoskeleton organization
          term:
            id: GO:0000226
            label: microtubule cytoskeleton organization
          modifier: DYSREGULATED
        - preferred_term: microtubule-based process
          term:
            id: GO:0007017
            label: microtubule-based process
          modifier: DYSREGULATED
      selected_evidence:
        snippet: the causative mutation lies in the guanosine triphosphate (GTP) binding pocket of alpha-1
          tubulin (Tuba1) and affects tubulin heterodimer formation
        supports: SUPPORT
    origin:
