              label: lissencephaly due to TUBA1A mutation
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Brain magnetic resonance imaging
        description: 'MRI is the diagnostic anchor. The recognisable pattern is a cortical malformation
          - ranging from microlissencephaly and agyria-pachygyria through dysgyria to polymicrogyria-like
          dysplasia - combined with a characteristic set of extracortical findings: dysmorphic basal ganglia
          with a fused striatum, dysgenesis of the internal capsule, corpus callosum hypoplasia or agenesis,
          ventriculomegaly, and brainstem and cerebellar hypoplasia. It is the combination rather than
          any single feature that raises tubulinopathy.'
        diagnosis_term:
          preferred_term: magnetic resonance imaging
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
      selected_evidence:
        snippet: Pathomorphological manifestations of the disease include basal ganglia dysmorphism with
          a fused striatum (pathognomonic in approximately 75% of cases), dysgenesis of the internal capsule
          (most commonly involving the anterior limb), and a broad spectrum of cortical anomalies.
        supports: SUPPORT
