        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Microtubule-Dependent Neuronal Migration
        biological_scale: CELLULAR
        description: Microtubules generated from TUBA1A-containing heterodimers drive the interkinetic
          nuclear migration of progenitors and the nucleokinesis of migrating neurons. Because TUBA1A
          is expressed at high levels throughout central nervous system development, the alpha-tubulin
