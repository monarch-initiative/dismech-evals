      assertion_type: Discussion
      assertion:
        discussion_id: gap_tuba1a_human_organoid_translatability
        prompt: Which TUBA1A variant effects on microtubule heterodimer formation, neuronal migration,
          and progenitor behavior are conserved across biochemical or mouse systems, and which require
          human iPSC-derived cortical organoids or fetal tissue benchmarks to resolve?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Alpha-Tubulin (TUBA1A) Function
        - pathophysiology#Impaired Microtubule-Dependent Neuronal Migration
        - pathophysiology#Cortical Dyslamination and Lissencephaly Spectrum
        rationale: The TUBA1A pathograph is supported by mouse neuronal-migration phenotypes, human clinical
          genetics, and cellular/structural assays, but human cortical expansion depends on outer radial
          glia and fetal cortical organization that are not fully represented in lissencephalic rodents.
          A TUBA1A-specific new-approach-model experiment is needed to test whether the alpha-tubulin
          mechanism is purely post-mitotic neuronal motility failure or also includes human progenitor
