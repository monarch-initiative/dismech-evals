        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Motor Neuron and Cerebellar Dysfunction
        biological_scale: TISSUE
        description: The neurological arm, and historically the first to be recognised. TUBA4A has a ClinGen
          Moderate relationship with autosomal dominant ALS22, and a segregating missense variant has
          been reported in one extended family with FTD. A separate 448-proband ataxia screen plus a 100,000
          Genomes burden analysis support a hereditary spastic-ataxia association with variable age of
          onset. In the myo-tubulinopathy cohort, CNS involvement appeared in two of nineteen families,
          coexisting with muscle weakness and protein aggregation - the combination the authors call a
          multisystem proteinopathy.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: Taken together, we report 12 patients presenting with spasticity and/or cerebellar ataxia
          and harbouring a predicted pathogenic TUBA4A missense mutation, including five confirmed de
          novo cases and a mutation previously reported in a large family presenting with spastic ataxia.
        supports: SUPPORT
