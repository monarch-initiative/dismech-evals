        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tuba4a_phenotype_determination
        prompt: What determines whether a TUBA4A variant produces isolated myopathy, spastic ataxia, ALS/FTD,
          or multisystem proteinopathy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Alpha-Tubulin 4A (TUBA4A) Function
        - pathophysiology#Skeletal Muscle Myopathic Change
        rationale: 'TUBA4A now spans four clinical territories, and the striking fact is the proportions:
          17 of 19 families in the largest series had myopathy with no CNS involvement at all, in a gene
          originally described as an ALS gene. Something determines the tissue that fails. There is a
          real lead - variant domain position correlates with both the pattern of muscle involvement and
          the extent of microtubule disruption - but that analysis was run within the myopathy cohort,
          so it explains variation inside the muscle arm rather than the choice between muscle and CNS.
          Inheritance adds a second unexplained axis: the same gene carries dominant, de novo and recessive
          alleles, and a recessive allele with unaffected heterozygous carriers implies a different mechanism
          from a dominant de novo one. Resolving this needs the domain-position analysis extended across
          all four phenotype groups, with tissue-specific expression or isotype-compensation data to explain
          why muscle tolerates or fails to tolerate a given lesion differently from motor neurons.'
      selected_evidence:
        snippet: Correlation analyses integrating clinical severity, variant location, and mechanistic
          readouts further demonstrated that domain specificity within TUBA4A influences both the pattern
          of muscle involvement and the extent of microtubule disruption.
        supports: SUPPORT
