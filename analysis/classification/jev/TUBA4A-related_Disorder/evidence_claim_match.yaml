            term:
              id: MONDO:0014531
              label: amyotrophic lateral sclerosis type 22
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Alpha-Tubulin 4A (TUBA4A) Function
        role: TRIGGER
        biological_scale: MOLECULAR
        description: 'Missense variants alter the alpha-tubulin 4A isotype. Patient-derived fibroblasts
          carrying distinct TUBA4A missense variants show significant alterations in microtubule organization
          and dynamics, and in silico and in vitro work indicates the variants cause protein abnormalities
          that may differentially affect microtubule dynamics. Domain position matters: variant location
          within TUBA4A correlates both with the pattern of muscle involvement and with the extent of
          microtubule disruption, so this is one of the few tubulin genes where a structure-phenotype
          relationship has been measured directly.'
        genetic_context:
          functional_impact_category: UNKNOWN
          variant_origin: GERMLINE
          description: 'The myopathy and spastic-ataxia cohorts considered at this node carry missense
            variants. The broader ALS literature also includes one nonsense, one splice-site and one frameshift
            variant, so missense is not an accurate locus-wide description. The mechanism class remains
            unresolved: the same gene carries dominant, de novo and recessive alleles, and a recessive
            allele whose heterozygous carriers are unaffected may behave differently from a dominant de
            novo allele. A single functional_impact_category is therefore unlikely to be correct across
            the full phenotypic spectrum.'
        genes:
        - preferred_term: TUBA4A
          term:
            id: hgnc:12407
            label: TUBA4A
        biological_processes:
        - preferred_term: microtubule cytoskeleton organization
          term:
            id: GO:0000226
            label: microtubule cytoskeleton organization
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Cultured fibroblasts from three patients harbouring distinct TUBA4A missense showed significant
          alterations in microtubule organization and dynamics, providing insight of TUBA4A variants pathogenicity.
        supports: SUPPORT
