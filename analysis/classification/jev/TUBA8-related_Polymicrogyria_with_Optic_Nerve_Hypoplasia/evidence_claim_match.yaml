  d5a7997501c1a4b77785c06bbcaf08ca238b1c70c3a17b6137b272a194e7d214:
    claim:
      about:
        disease:
          name: TUBA8-related Polymicrogyria with Optic Nerve Hypoplasia
          disease_term:
            preferred_term: Polymicrogyria with optic nerve hypoplasia
            term:
              id: MONDO:0013172
              label: polymicrogyria with optic nerve hypoplasia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tuba8_gene_disease_validity
        prompt: Is TUBA8 a genuine cause of polymicrogyria with optic nerve hypoplasia, or was the 2009
          autozygosity finding a linked bystander?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Reported Hypomorphic TUBA8 Splice Defect
        - pathophysiology#Competing Homozygous SNAP29 Loss of Function
        - pathophysiology#Disrupted Cortical Development
        rationale: 'ClinGen''s 2023 Brain Malformations GCEP assessment is the controlling validity judgment:
          the TUBA8-PMGOH relationship is Disputed and no valid evidence remained to support it. The founding
          observation still deserves accurate representation. Two consanguineous Pakistani families, probably
          sharing an ancestral autozygous interval, carried the same molecularly hypomorphic TUBA8 splice
          variant, and TUBA8 has experimentally supported functions in radial-glial differentiation and
          Purkinje-cell dendrite development.

          Those observations do not establish the syndrome relationship. The 7.42-Mb autozygous interval
          contained more than TUBA8, and exome reanalysis found a homozygous SNAP29 frameshift that the
          original authors judged likely to explain most or all of the neurodevelopmental phenotype. A
          validated global Tuba8 knockout had no PMG or consistent cortical defect. The founding broad
          cortical expression pattern was not reproduced by later TUBA8-specific probes, which found very
          low expression during mouse and human neuronal migration. ClinGen also considered a fifth proband
          with compound heterozygous TUBA8 missense variants; that individual had epilepsy but no brain
          structural anomaly or optic nerve hypoplasia and therefore did not replicate PMGOH.

          The remaining question is narrow: whether independently ascertained, phenotypically concordant
          families without a competing cause could overturn the disputed classification, or whether TUBA8
          only modifies particular neural functions while SNAP29 explains the founding syndrome. The MONDO
          disease identity is bound because the clinical entity exists; the TUBA8 association remains
          Disputed and the entry is not a Tubulinopathies grouping member.'
        proposed_experiments:
        - experiment_id: exp_tuba8_independent_family_ascertainment
          name: Ascertainment of additional biallelic TUBA8 families
          description: Query large polymicrogyria and cortical malformation sequencing cohorts for biallelic
            TUBA8 variants, and where found, assess segregation and phenotype concordance with the reported
            PMGOH syndrome.
          decision_criterion: Two or more unrelated families with biallelic TUBA8 variants and concordant
            polymicrogyria with optic nerve hypoplasia, no competing causal variant, convincing segregation,
            and variant-level functional evidence would materially support re-evaluation by ClinGen and
            reconsideration for the Tubulinopathies grouping. Continued absence across well-powered cohorts
            would reinforce the disputed classification.
          would_support:
          - pathophysiology#Reported Hypomorphic TUBA8 Splice Defect
      selected_evidence:
        snippet: We show that the non-canonical tubulin Tuba8, transiently expressed in cortical progenitors,
          drives differentiation of RGs into apical intermediate progenitors, a more restricted progenitor
          type lacking attachment to the basal lamina.
        supports: SUPPORT
