              id: MONDO:0013172
              label: polymicrogyria with optic nerve hypoplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reported Hypomorphic TUBA8 Splice Defect
        role: TRIGGER
        biological_scale: MOLECULAR
        description: 'The reported allele is a homozygous 14-bp deletion in the intron-1 splice acceptor
          polypyrimidine tract. Patient lymphoblastoid cells retained a low level of full-length transcript,
          so the allele is hypomorphic rather than a proven null. Its molecular effect can be classified
          independently of the disputed disease attribution: partial loss of TUBA8 function is supported,
          but causation of PMGOH is not. TUBA8 is an unusual alpha-tubulin with alanine rather than the
          modifiable lysine found at position 40 in other isotypes. Later experiments confirm that this
          alanine contributes to Purkinje-cell dendrite development, but they do not demonstrate the generalized
          cortical migration failure proposed for PMGOH.'
        genetic_context:
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          allele_type: intronic 14-bp splice-altering deletion
          description: A shared homozygous splice-altering deletion was reported in two consanguineous
            Pakistani families whose autozygous intervals indicated a likely common ancestral background.
            The allele reduced correctly spliced transcript but did not eliminate it. This molecular classification
            does not imply that the allele caused the subjects' PMGOH phenotype.
        genes:
        - preferred_term: TUBA8
          term:
            id: hgnc:12410
            label: TUBA8
        biological_processes:
        - preferred_term: microtubule cytoskeleton organization
          term:
            id: GO:0000226
            label: microtubule cytoskeleton organization
          modifier: DYSREGULATED
      selected_evidence:
        snippet: We previously identified homozygous hypomorphic TUBA8 mutations in human subjects with
          a polymicrogyria (PMG) syndrome
        supports: SUPPORT
