        name: Autosomal dominant inheritance with incomplete penetrance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: Most reported disease-associated alleles are heterozygous and segregate in dominant
          pedigrees, but a carrier may have macrothrombocytopenia, isolated platelet enlargement, or normal
          platelet count and size.
      selected_evidence:
        snippet: Segregation studies showed incomplete penetrance of these variants for platelet traits.
          Indeed, most carriers showed macrothrombocytopenia, some only increased platelet size, and a
          minority had no abnormalities.
        supports: SUPPORT
