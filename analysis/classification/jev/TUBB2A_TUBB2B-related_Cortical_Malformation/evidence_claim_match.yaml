              label: tubulinopathy-associated dysgyria
        context: []
      assertion_type: Phenotype
      assertion:
        name: Movement Disorder
        description: Dystonia and mirror movements (bimanual synkinesia) were reported in a third of a
          2026 multicentre tubulinopathy cohort spanning seven genes including TUBB2A and TUBB2B. Mirror
          movements are mechanistically interesting here because they point at the module's axon-guidance
          branch - failure of corticospinal midline decussation - rather than at the migration branch
          that accounts for the cortical malformation. The cohort figure is across all seven genes, so
          it is not a TUBB2A/TUBB2B-specific frequency and no frequency band is asserted.
        phenotype_term:
          preferred_term: Dystonia
          term:
            id: HP:0001332
            label: Dystonia
      selected_evidence:
        snippet: Movement disorders were observed in 33.3% of the cohort, including dystonia and mirror
          movements.
        supports: SUPPORT
