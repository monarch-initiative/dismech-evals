  eea4294ea3425dfdaa24af64e73dd9ab4502b2b55009f9e0d75e6e4f70693ea4:
    claim:
      about:
        disease:
          name: TUBB2A/TUBB2B-related Cortical Malformation
          disease_term:
            preferred_term: tubulinopathy-associated dysgyria
            term:
              id: MONDO:0018763
              label: tubulinopathy-associated dysgyria
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tubb2ab_lumping_boundary
        prompt: Should TUBB2A and TUBB2B remain a shared beta-tubulin cortical malformation entry, or
          should additional TUBB2A cases split out a distinct disease skeleton?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
        - pathophysiology#Tubulinopathy-Associated Dysgyria and Extracortical Malformation Pattern
        rationale: 'The original argument for the lump was asymmetry of evidence: TUBB2B had a cohort-level
          natural-history and imaging profile while TUBB2A had only nine reported individuals, so a TUBB2A
          entry would have been a stub. Reviewed 2026-08-20, that premise no longer holds. TUBB2A now
          has (i) a 28-patient epilepsy cohort with an explicit genotype-phenotype correlation - variants
          at or near the alpha-beta tubulin dimer interface give a higher proportion of severe phenotypes
          such as pachygyria - backed by functional testing of eight variants; (ii) a recurrent mutational
          hotspot at Arg391 in the longitudinal E-site heterodimer interface, found in multiple unrelated
          families; and (iii) a phenotype extending to an adult with slowly progressive ataxia and preserved
          ambulation at 40 years, far outside the range this entry curates. The lump is NOT thereby refuted
