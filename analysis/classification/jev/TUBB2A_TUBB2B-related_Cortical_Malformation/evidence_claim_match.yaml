  4636ae722bdfd61595cbe186ac1ef1412c608251dc6778896960ca75aa2f4c36:
    claim:
      about:
        disease:
          name: TUBB2A/TUBB2B-related Cortical Malformation
          disease_term:
            preferred_term: tubulinopathy-associated dysgyria
            term:
              id: MONDO:0018763
              label: tubulinopathy-associated dysgyria
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
        role: TRIGGER
        biological_scale: MOLECULAR
        conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule Apparatus Perturbation
        description: Pathogenic TUBB2A or TUBB2B variants alter beta-tubulin isotypes that pair with alpha-tubulin
          in heterodimers and co-assemble into microtubules. The shared molecular lesion is therefore
          not an MRI-defined malformation label, but beta-tubulin/microtubule apparatus dysfunction during
          cortical development. TUBB2B has stronger published evidence; TUBB2A is retained in the same
          entry because the available cases fit the same beta-tubulin heterodimer and cortical dysplasia
          skeleton rather than a distinct pathograph.
        genetic_context:
          functional_impact_category: UNKNOWN
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          allele_type: missense
          description: 'Disease alleles are heterozygous, predominantly de novo missense substitutions.
            What is directly evidenced for both genes is impaired alpha/beta-tubulin heterodimer formation
            - shown for two TUBB2B disease-associated mutations in the founding study, and modeled for
            the recurrent TUBB2A Arg391 E-site hotspot. That finding alone does not discriminate the mechanism
            class: reduced formation of functional heterodimers is compatible both with a dominant-negative
            subunit that poisons the polymer (the mechanism resolved for TUBA1A Arg402 and inferred for
            TUBB3) and with a mutant subunit that simply fails to contribute, lowering the functional
            heterodimer pool. UNKNOWN records that the question was examined and is unresolved for these
            two isotypes, rather than that it was never annotated. See the gap_tubb2ab_functional_impact_class
            discussion.'
        cell_types:
        - preferred_term: cortical progenitor and migrating neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: radial glial cell
          term:
            id: CL:0000681
            label: radial glial cell
        biological_processes:
        - preferred_term: tubulin heterodimer assembly
          term:
            id: GO:0007021
            label: tubulin complex assembly
          modifier: DYSREGULATED
        - preferred_term: microtubule cytoskeleton organization
          term:
            id: GO:0000226
            label: microtubule cytoskeleton organization
          modifier: DYSREGULATED
        - preferred_term: microtubule-based process
          term:
            id: GO:0007017
            label: microtubule-based process
          modifier: DYSREGULATED
        genes:
        - preferred_term: TUBB2A
          term:
            id: hgnc:12412
            label: TUBB2A
        - preferred_term: TUBB2B
          term:
            id: hgnc:30829
            label: TUBB2B
      selected_evidence:
        snippet: These globular proteins form heterodimers and subsequently co-assemble into microtubules.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30016746
      reference_title: Tubulin genes and malformations of cortical development.
      evidence_source: OTHER
      explanation: Establishes the alpha/beta tubulin heterodimer and microtubule assembly biology that
        makes TUBB2A and TUBB2B mechanistically coherent.
