        prompt: Do human iPSC-derived cortical organoids reveal TUBB2A/TUBB2B-specific progenitor, outer-radial-glia,
          or migration defects that are not captured by clinical imaging, biochemical inference, or rodent/tubulinopathy
          models?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
        - pathophysiology#Impaired Microtubule-Dependent Neuronal Migration and Organization
        rationale: The Falcon report found human clinical and cohort evidence but no direct TUBB2A/TUBB2B
          organoid or iPSC disease model. Because human cortical expansion and outer radial glia are incompletely
          represented in lissencephalic rodents, a human organoid/iPSC experiment is needed to decide
          whether the beta-tubulin skeleton is purely postmitotic migration/organization failure or also
          includes human progenitor vulnerability.
        proposed_experiments:
        - experiment_id: exp_tubb2ab_isogenic_cortical_organoid_migration
          name: TUBB2A/TUBB2B isogenic cortical-organoid migration experiment
          description: Engineer representative pathogenic TUBB2A and TUBB2B missense variants into human
            iPSCs, correct patient-derived variants where available, and compare cortical organoid radial-glial
            organization, outer-radial-glia mitosis, neuronal migration, microtubule dynamics, and cortical
            layer organization across mutant, corrected, and knock-in lines.
          experiment_type:
            preferred_term: patient-derived cortical organoid perturbation experiment
          model_systems:
          - name: TUBB2A/TUBB2B human iPSC-derived cortical organoid
            description: Three-dimensional human cortical organoid carrying a pathogenic TUBB2A or TUBB2B
              variant, with matched isogenic corrected and knock-in controls.
            experimental_model_type: ORGANOID
            namo_type: namo:Organoid
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: cerebral cortex
              term:
                id: UBERON:0000956
                label: cerebral cortex
            cell_types:
            - preferred_term: radial glial cell
              term:
                id: CL:0000681
                label: radial glial cell
            - preferred_term: migrating cortical neuron
              term:
                id: CL:0000540
                label: neuron
            conditions:
            - TUBB2A/TUBB2B-related cortical malformation
            - polymicrogyria-like cortical dysplasia
            - microtubule-dependent neuronal migration failure
            cell_source: Patient-derived or CRISPR-engineered human induced pluripotent stem cells
            culture_system: Three-dimensional cortical organoid with live-imaging migration assays
          perturbations:
          - name: Isogenic TUBB2A/TUBB2B variant correction or knock-in
            target: pathophysiology#Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
            description: Correct a patient variant or knock in a recurrent pathogenic variant to separate
              variant effect from donor genetic background.
          readouts:
          - name: Microtubule dynamics and tubulin heterodimer incorporation
            target: pathophysiology#Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
            description: Quantify microtubule polymerization, stability, and mutant beta-tubulin incorporation
              in cortical progenitors and neurons.
            biological_processes:
            - preferred_term: microtubule cytoskeleton organization
              term:
                id: GO:0000226
                label: microtubule cytoskeleton organization
              modifier: DYSREGULATED
            assays:
            - preferred_term: live-cell imaging assay
            direction: NEGATIVE
          - name: Live-imaging neuronal migration and cortical organization
            target: pathophysiology#Impaired Microtubule-Dependent Neuronal Migration and Organization
            description: Track DCX-positive neuronal movement, radial-glial scaffold integrity, outer-radial-glia
              mitotic timing, and cortical layer organization.
            biological_processes:
            - preferred_term: neuron migration
              term:
                id: GO:0001764
                label: neuron migration
              modifier: DECREASED
            assays:
            - preferred_term: live-cell imaging assay
            - preferred_term: single-cell transcriptomic profiling
            direction: NEGATIVE
          controls:
          - name: Isogenic corrected organoids
            description: Matched organoids in which the candidate pathogenic variant is corrected.
          - name: Isogenic knock-in organoids
            description: Wild-type-background organoids carrying the introduced pathogenic variant.
          - name: Non-disease donor organoids
            description: Unedited control organoids differentiated and imaged in parallel.
          decision_criterion: A conserved beta-tubulin migration mechanism is supported if mutant organoids
            show reduced neuronal migration, altered microtubule dynamics, or abnormal radial-glial organization
            that is rescued by correction and reproduced by knock-in. A human-specific branch is supported
            if organoids reveal reproducible outer-radial-glia or progenitor-output defects not predicted
            from existing model systems.
          would_support:
          - pathophysiology#Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
          - pathophysiology#Impaired Microtubule-Dependent Neuronal Migration and Organization
      selected_evidence:
        snippet: We saw a cell migration defect that was rescued when we corrected the MDS causative chromosomal
          deletion
        supports: SUPPORT
