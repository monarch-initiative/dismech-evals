  4728f4d042cc7c6cf0211a71fc8b968329cfad008022738189148a5fe213be37:
    claim:
      about:
        disease:
          name: TUBB2A/TUBB2B-related Cortical Malformation
          disease_term:
            preferred_term: tubulinopathy-associated dysgyria
            term:
              id: MONDO:0018763
              label: tubulinopathy-associated dysgyria
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tubb2b_uner_tan_boundary
        prompt: Should the recessive TUBB2B p.Arg390Gln entity (Uner Tan syndrome, MONDO:0100144) be curated
          inside this entry, as its own Disease entry, or left as an out-of-scope allele-specific concept?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
        - phenotypes#Dysmorphic Basal Ganglia
        rationale: 'MONDO:0100144 is an is-a descendant of MONDO:0100153 tubulinopathy and is caused by
          a variant in a gene this entry curates, so on a naive gene-family reading it belongs here. Three
          features argue it does not. First, inheritance: it is biallelic in a consanguineous family,
          an unusual recessive mode for missense tubulinopathies, whereas every other allele in this entry
          is heterozygous and de novo. Second, phenotype: the defining finding is quadrupedal locomotion
          with severe cerebellar hypoplasia and an explicit ABSENCE of the basal ganglia malformations
          this entry curates as a core TUBB2B feature - the discriminating feature is a negative. Third,
          mechanism: functional analysis showed R390Q does not impair folding, heterodimer assembly, or
          incorporation into microtubule polymers, only increasing sensitivity to depolymerizing drugs
          - which is a much milder lesion than the impaired heterodimer formation this entry''s trigger
          node curates for other TUBB2B alleles. It is therefore recorded as a relatedMatch mapping rather
          than folded in, and the mapping deliberately does not retire the MONDO concept from the curation
          queue. Note the parallel worth watching: the recurrent severe TUBB2A hotspot is Arg391, the
          structurally equivalent residue in the neighbouring isotype, yet it is dominant and severe.
          Why the same position gives a dominant severe phenotype in TUBB2A and a recessive cerebellar
          one in TUBB2B is unexplained and is the sharpest available test of this entry''s isotype-specificity
          premise.'
      selected_evidence:
        snippet: Analysis of a consanguineous UTS family identified a biallelic TUBB2B mutation, resulting
          in a p.R390Q amino acid substitution.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
