        conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule-Based Neuronal Motility
          Failure
        description: Microtubules provide the cytoskeletal machinery for neuronal migration, cortical
          laminar organization, and projection outgrowth. In TUBB2B and probably TUBB2A disease, altered
          beta-tubulin function disrupts these microtubule-dependent processes and produces a cortical
          organization defect that is closer to polymicrogyria-like cortical dysplasia than to classic
          postmigrational polymicrogyria.
        cell_types:
        - preferred_term: migrating cortical neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
