          term:
            id: GO:0007018
            label: microtubule-based movement
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Microtubules are dynamic, cytoskeletal polymers which play key roles in cellular processes
          crucial for cortical development, including neuronal proliferation, migration and cortical laminar
          organisation.
        supports: SUPPORT
