  0c2d10d1e5503b14b84f485888e411604cc5ce4789e758bf2df44bbdc08fa4b7:
    claim:
      about:
        disease:
          name: TUBB2A/TUBB2B-related Cortical Malformation
          disease_term:
            preferred_term: tubulinopathy-associated dysgyria
            term:
              id: MONDO:0018763
              label: tubulinopathy-associated dysgyria
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tubb2ab_functional_impact_class
        prompt: Do TUBB2A and TUBB2B disease alleles act as dominant-negative subunits that poison the
          microtubule polymer, or by lowering the pool of functional alpha/beta heterodimers?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Beta-Tubulin (TUBB2A/TUBB2B) Function
        rationale: 'This node records functional_impact_category UNKNOWN, and that value is a finding
          rather than an omission. What is directly evidenced for both genes is impaired alpha/beta-tubulin
          heterodimer formation - shown for two TUBB2B disease-associated mutations in the founding study,
          modeled for the recurrent TUBB2A Arg391 E-site variant, and supported functionally for eight
          TUBB2A variants that all altered spindle morphology and microtubule dynamics. That observation
          does not discriminate between the two mechanism classes. A mutant subunit that folds and incorporates
          but degrades a motor-binding surface is dominant-negative - the mechanism resolved for TUBA1A
          Arg402, where dynein impairment scales with mutant expression, and inferred for TUBB3, where
          folded mutant heterodimers still polymerize and a subset disrupts kinesin binding. A mutant
          subunit that simply fails to form heterodimers instead lowers the functional tubulin pool, which
          is closer to reduced dose. The distinction is not academic: it decides whether isotype-compensation
          strategies such as CRISPRa upregulation of an unaffected beta-tubulin should be expected to
          work for these two genes, since adding wild-type subunits dilutes a poisoning allele but does
          not remove it. Resolving it needs a dose-response incorporation assay of the TUBB2A and TUBB2B
          alleles in a common background, of the kind already done for TUBA1A Arg402.'
      selected_evidence:
        snippet: We also show that two disease-associated mutations lead to impaired formation of tubulin
          heterodimers.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19465910
      reference_title: Mutations in the beta-tubulin gene TUBB2B result in asymmetrical polymicrogyria.
      evidence_source: IN_VITRO
      explanation: The TUBB2B half of what is evidenced - impaired heterodimer formation - which is compatible
        with either mechanism class.
