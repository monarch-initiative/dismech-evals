        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tubb3_kinesin_causality_for_cfeom
        prompt: Is disruption of the kinesin-microtubule interaction sufficient and necessary to cause
          CFEOM3, or is altered microtubule dynamic instability alone able to produce the axon guidance
          defect?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Kinesin-Microtubule Interaction and Axon Guidance Failure
        rationale: Engineering a compensatory mutation in the kinesin L12 loop restores motility on R262
          mutant microtubules and rescues axonal growth in a CFEOM3 mouse model, strongly supporting kinesin-microtubule
          disruption as causal for the axon-guidance arm. However, because all TUBB3 mutations also alter
          dynamic instability, the independent contribution of microtubule dynamics to the cranial dysinnervation
          phenotype is not fully excluded.
      selected_evidence:
        snippet: in a CFEOM3 mouse model expressing the same mutation, overexpressing the suppressor mutant
          kinesin restores axonal growth in vivo.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
