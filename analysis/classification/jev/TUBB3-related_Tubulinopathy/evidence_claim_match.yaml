  69b0a058017d5a04f24a755e435f10f3dd713060c58e6d22744cabbbd734a2d9:
    claim:
      about:
        disease:
          name: TUBB3-related Tubulinopathy
          disease_term:
            preferred_term: TUBB3-related tubulinopathy
            term:
              id: MONDO:0100154
              label: TUBB3-related tubulinopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tubb3_cell_type_primacy_human_model_translatability
        prompt: For the TUBB3 cortical neuronal-migration arm, is the primary defect in post-mitotic migrating
          neurons or in apical/outer radial glial progenitors, and which features require human iPSC-derived
          cortical organoids or fetal tissue to resolve, given that the available knock-in disease mouse
          does not reproduce the human cortical malformation?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Beta-III Tubulin (TUBB3) Function
        - pathophysiology#Impaired Microtubule-Dependent Neuronal Migration
        - pathophysiology#Cortical Dyslamination
        rationale: Human TUBB3 patients show cortical malformations (dyslamination, polymicrogyria-like
          cortex, callosal and pontocerebellar anomalies), yet the TUBB3 knock-in disease mouse reproduces
          the axon-guidance arm without cortical cell-migration abnormalities, so the cell population
          primarily responsible for the human cortical-migration arm — post-mitotic migrating neurons
          versus apical or outer radial glial progenitors — cannot be assigned from the available rodent
          model. As for the other tubulinopathies (TUBA1A, TUBB2A/TUBB2B, TUBB5), human cortical expansion
          depends on outer radial glia and fetal cortical organization that lissencephalic rodents do
          not fully represent, so resolving progenitor-primary versus migration-primary contributions
          requires human iPSC-derived cortical organoid or fetal-tissue benchmarks. Captured per the cortical-malformation
          epic (#4098/#4101) cell-type-ambiguity and human/model-mismatch curation guidance.
        proposed_experiments:
        - experiment_id: exp_tubb3_isogenic_cortical_organoid_celltype
          name: TUBB3 isogenic cortical-organoid cell-type-of-origin experiment
          description: Engineer recurrent cortical-malformation-associated TUBB3 missense variants into
            human iPSCs, correct patient-derived variants isogenically where available, and compare cortical
            organoid neuronal migration, radial-glial organization, microtubule dynamics, and outer-radial-glia
            mitosis to test whether the cortical-migration arm is primarily post-mitotic neuronal or also
            reflects apical/outer radial glial progenitor vulnerability not captured by the knock-in mouse.
          experiment_type:
            preferred_term: patient-derived cortical organoid perturbation experiment
          model_systems:
          - name: TUBB3 human iPSC-derived cortical organoid
            description: Three-dimensional human cortical organoid carrying a cortical-malformation-associated
              TUBB3 variant, with isogenic corrected and knock-in controls.
            experimental_model_type: ORGANOID
            namo_type: namo:Organoid
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: cerebral cortex
              term:
                id: UBERON:0000956
                label: cerebral cortex
            cell_types:
            - preferred_term: radial glial cell
              term:
                id: CL:0000681
                label: radial glial cell
            - preferred_term: migrating cortical neuron
              term:
                id: CL:0000540
                label: neuron
            conditions:
            - TUBB3-related tubulinopathy
            - malformation of cortical development
            - microtubule-dependent neuronal migration failure
            cell_source: Patient-derived or CRISPR-engineered human induced pluripotent stem cells
            culture_system: Three-dimensional cortical organoid with live-imaging migration assays
          perturbations:
          - name: TUBB3 variant correction or knock-in
            target: pathophysiology#Altered Beta-III Tubulin (TUBB3) Function
            genes:
            - preferred_term: TUBB3 (beta-III tubulin)
              term:
                id: hgnc:20772
                label: TUBB3
            description: Correct a patient TUBB3 variant or introduce a recurrent cortical-malformation-associated
              missense variant into an isogenic human iPSC background.
          readouts:
          - name: Cortical neuronal migration and progenitor organization
            target: pathophysiology#Impaired Microtubule-Dependent Neuronal Migration
            biological_processes:
            - preferred_term: neuron migration
              term:
                id: GO:0001764
                label: neuron migration
              modifier: DECREASED
            - preferred_term: microtubule cytoskeleton organization
              term:
                id: GO:0000226
                label: microtubule cytoskeleton organization
              modifier: DYSREGULATED
      selected_evidence:
        snippet: However, the mouse brain is naturally lissencephalic, suggesting that certain aspects
          of cortical development may not be adequately assessed in mice.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28111201
      reference_title: Human iPSC-Derived Cerebral Organoids Model Cellular Features of Lissencephaly
        and Reveal Prolonged Mitosis of Outer Radial Glia.
      evidence_source: OTHER
      explanation: Supports treating rodent-to-human translation as an explicit knowledge gap for the
        cortical-migration arm of tubulin-related malformations, including the contribution of human outer
