            term:
              id: MONDO:0100154
              label: TUBB3-related tubulinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Beta-III Tubulin (TUBB3) Function
        role: TRIGGER
        biological_scale: MOLECULAR
        conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule Apparatus Perturbation
        description: Heterozygous missense mutations in TUBB3 alter the neuron-specific beta-III tubulin
          isotype. Disease-associated substitutions reduce the abundance of functional alpha/beta-tubulin
          heterodimers and alter the dynamic instability of the microtubules that incorporate beta-III
          tubulin. Different residues perturb distinct microtubule properties — some alter the resistance
          of microtubules to depolymerization while a subset disrupts the interaction of microtubules
          with kinesin motors — establishing altered beta-III tubulin function as the shared initiating
          molecular lesion that feeds the divergent axon-guidance and neuronal-migration arms of the disorder.
        genetic_context:
          functional_impact_category: DOMINANT_NEGATIVE
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          allele_type: missense
          description: All reported disease alleles are heterozygous missense substitutions. The founding
            functional study showed that although the substitutions impair heterodimer formation, the
            mutant heterodimers that do fold still polymerize into microtubules, where they alter dynamic
            instability and, for a subset of residues, disrupt the microtubule-kinesin interaction. A
            mutant subunit that incorporates into the polymer and degrades a motor-binding surface acts
            on the wild-type polymer rather than merely subtracting one gene dose, which is why the category
            is DOMINANT_NEGATIVE and not haploinsufficiency. Some alleles are inherited from a mildly
            affected or unaffected parent, and one maternally inherited TUBB3 c.211G>A allele has been
            reported with milder features.
        cell_types:
        - preferred_term: migrating and post-mitotic neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: tubulin heterodimer assembly
          term:
            id: GO:0007021
            label: tubulin complex assembly
          modifier: DECREASED
        - preferred_term: microtubule cytoskeleton organization
          term:
            id: GO:0000226
            label: microtubule cytoskeleton organization
          modifier: DYSREGULATED
        genes:
        - preferred_term: TUBB3
          term:
            id: hgnc:20772
            label: TUBB3
      selected_evidence:
        snippet: Modeling each mutation in yeast tubulin demonstrates that all alter dynamic instability
          whereas a subset disrupts the interaction of microtubules with kinesin motors.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
