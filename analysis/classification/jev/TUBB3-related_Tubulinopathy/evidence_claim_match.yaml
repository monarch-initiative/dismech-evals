              label: TUBB3-related tubulinopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tubb3_arm_genotype_phenotype_divergence
        prompt: Why do different TUBB3 missense mutations preferentially produce the kinesin-dependent
          axon guidance / CFEOM3 arm versus the microtubule-dynamics cortical migration arm, and what
          is the structural basis for this phenotypic divergence from a shared tubulin lesion?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Kinesin-Microtubule Interaction and Axon Guidance Failure
        - pathophysiology#Impaired Microtubule-Dependent Neuronal Migration
        rationale: CFEOM3-associated mutations increase microtubule stability and disrupt kinesin interaction,
          whereas malformation-of-cortical-development mutations alter microtubule resistance to depolymerization,
          and the two phenotypic profiles are largely non-overlapping. The residue-to-mechanism map is
          only partially resolved, so it is not yet possible to predict from genotype which arm will dominate,
          or whether some variants engage both arms simultaneously.
      selected_evidence:
        snippet: MCD mutations can alter the resistance of MTs to depolymerization. Interestingly, this
          finding contrasts with the increased MT stability observed in the case of CFEOM3-related mutations.
        supports: SUPPORT
    origin:
