        role: CENTRAL_EFFECTOR
        biological_scale: CELLULAR
        conforms_to: microtubule_dependent_neuronal_migration_failure#Axon Guidance and Projection Wiring
          Defects
        description: In the axon-guidance arm, TUBB3 mutations that affect residues mediating the kinesin-microtubule
          interface (notably R262) impair the motility and ATPase activity of kinesin motors moving along
          microtubules. Because beta-III tubulin is expressed most highly during axon outgrowth, this
          defect compromises kinesin-dependent axonal transport and growth-cone dynamics, producing axon
          guidance and projection-maintenance failure in the absence of overt cortical migration abnormalities
          — the mechanism underlying the cranial dysinnervation phenotype.
        cell_types:
        - preferred_term: developing neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: cranial motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: microtubule-based movement
          term:
