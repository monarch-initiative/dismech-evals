            label: microtubule-based movement
          modifier: DYSREGULATED
        - preferred_term: neuron projection guidance
          term:
            id: GO:0097485
            label: neuron projection guidance
          modifier: DYSREGULATED
      selected_evidence:
        snippet: A knock-in disease mouse model reveals axon guidance defects without evidence of cortical
          cell migration abnormalities.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
