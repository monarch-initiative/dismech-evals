              functional_impact_category: DOMINANT_NEGATIVE
              variant_origin: DE_NOVO
              zygosity: HETEROZYGOUS
              allele_type: missense
              description: All reported disease alleles are heterozygous missense substitutions. The founding
                functional study showed that although the substitutions impair heterodimer formation,
                the mutant heterodimers that do fold still polymerize into microtubules, where they alter
                dynamic instability and, for a subset of residues, disrupt the microtubule-kinesin interaction.
                A mutant subunit that incorporates into the polymer and degrades a motor-binding surface
                acts on the wild-type polymer rather than merely subtracting one gene dose, which is why
                the category is DOMINANT_NEGATIVE and not haploinsufficiency. Some alleles are inherited
                from a mildly affected or unaffected parent, and one maternally inherited TUBB3 c.211G>A
                allele has been reported with milder features.
