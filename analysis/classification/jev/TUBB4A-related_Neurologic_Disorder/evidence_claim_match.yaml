        - pathophysiology#H-ABC Antimorphic Microtubule Dysfunction
        - pathophysiology#DYT-TUBB4A-Associated Neuronal Dysfunction
        rationale: TUBB4A is the clearest pleiotropy problem in the tubulin family. Two observations pull
          in different directions. On one hand, the dystonia-causing variants (p.R2G, p.Q424H) and the
