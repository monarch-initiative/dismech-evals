  917acd06f5395d41e7a6acd60851d8ee26db611ca82563b420d26dfbdc1a71f3:
    claim:
      about:
        disease:
          name: TUBB4A-related Neurologic Disorder
          disease_term:
            preferred_term: TUBB4A-related neurologic disorder
            term:
              id: MONDO:0800470
              label: TUBB4A-related neurologic disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tubb4a_pleiotropy_mechanism
        prompt: Why do TUBB4A variants in the same gene produce either isolated adult-onset dystonia or
          infantile hypomyelinating leukodystrophy, and is a single functional_impact_category ever correct
          for this locus?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Altered Beta-Tubulin 4A (TUBB4A) Function
        - pathophysiology#H-ABC Antimorphic Microtubule Dysfunction
        - pathophysiology#DYT-TUBB4A-Associated Neuronal Dysfunction
        rationale: TUBB4A is the clearest pleiotropy problem in the tubulin family. Two observations pull
          in different directions. On one hand, the dystonia-causing variants (p.R2G, p.Q424H) and the
          H-ABC-causing variants (p.R2W, p.D249N) have demonstrably divergent effects on microtubule polymerization
          and on incorporation into the network in disease-relevant oligodendrocytes - which argues the
          two poles are mechanistically distinct, not one mechanism at two doses. Note the pointed detail
          that R2G and R2W affect the SAME residue and fall on opposite clinical poles. On the other hand,
          an allelic mouse series shows severity correlating cleanly with mutant expression and preserved
          wild-type tubulin, which is exactly what a single dose-dependent mechanism would look like.
          Both cannot be the whole story. The authors of the divergence study are careful to say the mechanisms
