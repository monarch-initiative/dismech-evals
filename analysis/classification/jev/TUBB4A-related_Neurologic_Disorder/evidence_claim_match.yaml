      assertion_type: Discussion
      assertion:
        discussion_id: gap_tubb4a_cerebellar_aso_gap
        prompt: Can a Tubb4a-suppressing ASO reach cerebellar granule neurons, and if not, does the cerebellar
          arm of H-ABC remain untreated by an otherwise effective therapy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Basal Ganglia and Cerebellar Neurodegeneration
        rationale: 'The ASO proof-of-concept is striking on the myelin arm - extended lifespan, improved
          motor phenotypes, fewer seizures, preserved oligodendrocytes and myelin. But the authors flag
          one failure plainly: the ASO does not reach cerebellar granule neurons by any route of brain
          administration they tried. That matters more here than it would for a disorder with a single
          mechanism, because this entry curates cerebellar degeneration as a parallel arm rather than
          as a consequence of demyelination - the mouse work shows both glial and neuronal degeneration.
          If the arms are truly parallel, an intervention that rescues myelin and misses the cerebellum
          treats part of the disease, and the residual cerebellar phenotype would only become visible
          once the animals live long enough to show it. Resolving this needs either a delivery route that
          reaches granule neurons or long-term outcome data in treated animals with cerebellar-specific
          readouts.'
      selected_evidence:
        snippet: A major limitation we noted is that ASOs fail to target cerebellar granule neurons even
          with multiple routes of administration in the brain.
        supports: SUPPORT
    origin:
