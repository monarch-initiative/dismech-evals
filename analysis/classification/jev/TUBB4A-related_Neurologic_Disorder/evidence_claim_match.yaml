        context: []
      assertion_type: Genetic
      assertion:
        name: TUBB4A
        association: Causative
        gene_term:
          preferred_term: TUBB4A (beta-tubulin 4A)
          term:
            id: hgnc:20774
            label: TUBB4A
        notes: TUBB4A encodes the brain-specific beta-tubulin 4A isotype. It is a pleiotropic locus in
          which heterozygous missense variants produce H-ABC, other pediatric hypomyelinating presentations,
          or DYT-TUBB4A. p.Arg2Trp and p.Asp249Asn have tested antimorphic effects; p.Gln424His alone
          has an explicit gain-of-function result; p.Arg2Gly lacks a prominent microtubule-dynamics defect.
          p.Cys239Phe and p.Arg262His are preserved as H-ABC alleles without importing a mechanism from
          the tested variants.
      selected_evidence:
        snippet: A p.C239F mutation was found in one of the originally described H-ABC patients, for whom
          we provide follow-up 11 years after the original publication. The second novel mutation, p.R262H,
          was found in a patient with a typical clinical presentation for H-ABC
        supports: SUPPORT
    origin:
