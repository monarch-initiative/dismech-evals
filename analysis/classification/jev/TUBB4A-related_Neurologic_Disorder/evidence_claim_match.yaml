      assertion_type: Pathophysiology
      assertion:
        name: H-ABC Antimorphic Microtubule Dysfunction
        role: TRIGGER
        biological_scale: MOLECULAR
        subtypes:
        - H-ABC
        conforms_to: cns_myelin_failure#Oligodendrocyte-Lineage or Myelin-Membrane Insult
        description: In the studied H-ABC alleles p.Arg2Trp and p.Asp249Asn, mutant heterodimers incorporate
          less efficiently, grow more slowly, and can act as steric blocks during assembly. This antimorphic
          mechanism is limited to those tested alleles; it is not assigned to p.Cys239Phe or p.Arg262His
          merely because they also cause H-ABC.
        genetic_context:
          functional_impact_category: DOMINANT_NEGATIVE
          zygosity: HETEROZYGOUS
          allele_type: missense
          description: Applies to the experimentally studied H-ABC p.Arg2Trp and p.Asp249Asn substitutions.
            The functional category records their reported antimorphic behavior and is not a spectrum-wide
            assertion.
        genes:
        - preferred_term: TUBB4A
          term:
            id: hgnc:20774
            label: TUBB4A
      selected_evidence:
        snippet: Therefore, we suggest an antimorphic conformational change in the H-ABC mutants, but
          not to a complete loss of function of the affected tubulin heterodimers. Hence, the H-ABC mutants
          might act as steric hindrances during microtubule assembly.
        supports: SUPPORT
