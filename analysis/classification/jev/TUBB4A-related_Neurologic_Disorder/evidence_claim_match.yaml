            term:
              id: MONDO:0800470
              label: TUBB4A-related neurologic disorder
        context: []
      assertion_type: Treatment
      assertion:
        name: Tubb4a-suppressing antisense oligonucleotide (preclinical)
        description: An H-ABC-specific preclinical strategy. The rationale comes from an allelic mouse
          series showing that disease severity correlates with mutant Tubb4a expression and with relative
          preservation of wild-type tubulin - so lowering the mutant transcript should help even without
          repairing it. A single intracerebroventricular dose of a Tubb4a-targeted ASO in postnatal Tubb4a
          D249N/KO mice drastically extended lifespan, improved motor phenotypes, reduced seizures, prevented
          myelin and oligodendrocyte loss, and recovered visual evoked potential latencies. A stated limitation
          is that the ASO fails to reach cerebellar granule neurons by any tested route, so the cerebellar
          arm of the disease may be untreated by this approach. There is no human trial; this must not
          be curated as an available therapy or extrapolated to DYT-TUBB4A.
        context: H-ABC p.Asp249Asn mouse models only; preclinical, not DYT-TUBB4A.
        therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
        treatment_term:
