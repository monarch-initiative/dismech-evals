        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Beta-Tubulin 4A (TUBB4A) Function
        role: TRIGGER
        biological_scale: MOLECULAR
        description: Heterozygous missense variants alter the brain-enriched beta-tubulin 4A isotype,
          but this locus-level trigger does not imply one downstream mechanism. H-ABC and DYT-associated
          alleles have divergent cellular effects, so the graph immediately separates an H-ABC oligodendrocyte/grey-matter
          branch from a cautious DYT neuronal branch.
        genetic_context:
          functional_impact_category: UNKNOWN
          zygosity: HETEROZYGOUS
          allele_type: missense
          description: UNKNOWN is deliberate at the umbrella level. p.Arg2Trp and p.Asp249Asn were interpreted
            as antimorphic, p.Gln424His showed a gain-of-function growth pattern, and p.Arg2Gly showed
            no prominent dynamics change. p.Cys239Phe and p.Arg262His are established H-ABC alleles without
            equivalent functional testing in the cached evidence. Variant origin is omitted because H-ABC
            is usually de novo whereas DYT-TUBB4A is often inherited.
        genes:
        - preferred_term: TUBB4A
          term:
            id: hgnc:20774
            label: TUBB4A
      selected_evidence:
        snippet: Moreover, in silico simulations demonstrated that the mutants rarely adopted a straight
          heterodimer conformation in contrast to wild type.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35275727
      reference_title: H-ABC- and dystonia-causing TUBB4A mutations show distinct pathogenic effects.
