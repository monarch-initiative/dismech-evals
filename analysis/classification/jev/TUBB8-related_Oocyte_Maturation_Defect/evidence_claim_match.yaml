        name: HDAC6 inhibition to restore spindle microtubule acetylation (preclinical)
        action_category: THERAPEUTIC
        description: Model-only, variant-limited rescue. Cultured oocytes from the conditional human-TUBB8-D417N
          mouse and mouse oocytes acutely expressing selected human TUBB8 variants were treated with tubacin
          or tubastatin A. Spindle morphology, microtubule acetylation, and polar-body extrusion improved
          in selected model conditions. No affected patient received an HDAC6 inhibitor, and the study
          provides no human efficacy, safety, dosing, pregnancy, or live-birth data.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
