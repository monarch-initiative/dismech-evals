              id: CHEBI:94186
              label: tubastatin A
          - preferred_term: Histone Deacetylase Inhibitor
            term:
              id: NCIT:C1946
              label: Histone Deacetylase Inhibitor
        notes: Preclinical mouse-oocyte evidence only as of 2026-08; no human efficacy or clinical recommendation
          is asserted.
      selected_evidence:
        snippet: These rescue results shed light on the strategy to treat meiotic defects in a certain
          group of TUBB8 mutated patients.
        supports: SUPPORT
