            publication: PMID:42241496
            description: 'A CRISPR/Cas9 tubb5-null zebrafish. Homozygotes die within two weeks post-fertilization
              with developmental delay, craniofacial malformation, uncoordinated movement, reduced locomotor
              activity, impaired photomotor response and increased seizure susceptibility. The model''s
              distinctive contribution is a reversible mechanism: tubb5 loss derepresses Notch effectors
              that hold neural progenitors undifferentiated, and gamma-secretase inhibition rescues the
              phenotype.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Notch-Dependent Block of Neural Progenitor Differentiation
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: 'The model is the sole source of evidence for this node: it establishes the Notch-dependent
          differentiation block and shows it is pharmacologically reversible.'
        limitations: A homozygous null, whereas human disease alleles are heterozygous missense variants
          shown to act by gain-of-function rather than loss-of-function; a null and a dose-dependent gain-of-function
          allele need not converge on the same downstream pathway. Zebrafish larval neurodevelopment also
          lacks the expanded outer subventricular zone of human cortex.
        readouts:
        - name: Notch effector transcript levels (notch1a, her5)
          target: Notch-Dependent Block of Neural Progenitor Differentiation
          direction: INCREASED
          interpretation: Transcriptomic signature of Notch derepression in tubb5-null larvae.
          biological_processes:
          - preferred_term: Notch signaling pathway
            term:
              id: GO:0007219
              label: Notch signaling pathway
            modifier: INCREASED
        - name: Differentiated neuron versus progenitor marker counts
          target: Notch-Dependent Block of Neural Progenitor Differentiation
          direction: DECREASED
          interpretation: Fewer neurogenin1/huc-positive differentiated neurons with more sox2-positive
            progenitors - the cellular readout of the block.
        - name: Developmental and locomotor phenotype under gamma-secretase inhibition
          target: Notch-Dependent Block of Neural Progenitor Differentiation
          direction: RESTORED
          interpretation: DAPT rescue establishes that the differentiation block is Notch-dependent and
            reversible in this model.
      selected_evidence:
        snippet: This study demonstrates that tubb5 regulates neural progenitor differentiation via the
          Notch signaling pathway
        supports: SUPPORT
