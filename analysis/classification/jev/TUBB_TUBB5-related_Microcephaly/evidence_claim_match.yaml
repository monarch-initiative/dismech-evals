        prompt: What is the full natural-history and phenotype range for TUBB/TUBB5-related microcephaly
          beyond the three original cases and small tubulinopathy cohort counts?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Global Developmental Delay / Intellectual Disability
        - phenotypes#Polymicrogyria-like Cortical Dysplasia / Simplified Gyral Pattern
        rationale: 'The entry is supported by a strong founding case series and model mechanism, but TUBB/TUBB5-specific
          longitudinal outcomes, seizure frequency, genotype-phenotype correlations, and variant-class
          effects remain much thinner than for TUBA1A or TUBB2B. Two 2025-2026 reports narrow the gap
          without closing it: a Korean beta-tubulinopathy cohort places TUBB alongside the other beta-tubulin
          genes in a series of only twelve patients across five genes, and a single family shows complete
          penetrance with markedly variable expressivity - including a transmitting mother judged healthy
          until MRI - which means published TUBB case counts are a floor, not an estimate.'
      selected_evidence:
        snippet: Ten pathogenic or likely pathogenic missense variants were identified in five β-tubulin
          genes (TUBB2A, TUBB2B, TUBB3, TUBB4A, and TUBB5).
        supports: SUPPORT
