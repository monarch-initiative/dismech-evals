    evidence_metadata:
      reference: PMID:41309602
      reference_title: Mutations in the β-tubulin TUBB impair ciliogenesis and are associated with ciliopathy-like
        phenotypes.
      evidence_source: IN_VITRO
      explanation: Establishes that human TUBB disease is not a loss-of-function mechanism, which is precisely
        why a homozygous-null zebrafish phenotype cannot be assumed to model it.
