      assertion_type: Discussion
      assertion:
        discussion_id: gap_tubb_tubb5_human_organoid_translatability
        prompt: Are the progenitor cell-cycle, spindle-orientation, apoptosis, and migration defects observed
          in mouse Tubb5 models conserved in human radial glia, outer-radial-glia-like cells, and cortical
          organoids carrying pathogenic TUBB/TUBB5 variants?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Progenitor Cell-Cycle and Spindle Dysfunction
        - pathophysiology#p53-Associated Apoptosis and Progenitor Pool Distortion
        - pathophysiology#Impaired Neurogenic Division and Migration
        rationale: The strongest mechanistic evidence is mouse based, while the Falcon report did not
          identify a direct TUBB/TUBB5 human iPSC or organoid disease model. Human cortical expansion
          depends on outer radial glia and OSVZ biology, so a human organoid/iPSC test is needed before
          assuming the mouse progenitor apoptosis branch fully explains the human microcephaly phenotype.
        proposed_experiments:
        - experiment_id: exp_tubb_tubb5_isogenic_organoid_progenitor_apoptosis
          name: TUBB/TUBB5 isogenic cortical-organoid progenitor and apoptosis experiment
          description: Generate patient-derived or CRISPR-engineered human cortical organoids carrying
            M299V, V353I, E401K, or newer pathogenic TUBB/TUBB5 variants; compare mutant, isogenic-corrected,
            and knock-in organoids for microtubule dynamics, tubulin heterodimer assembly, progenitor
            cell-cycle timing, spindle orientation, p53 activation, apoptosis, neuronal output, and migration.
          experiment_type:
            preferred_term: isogenic cortical organoid progenitor perturbation experiment
          model_systems:
          - name: TUBB/TUBB5 human iPSC-derived cortical organoid
            description: Three-dimensional human cortical organoid carrying a pathogenic TUBB/TUBB5 variant,
              with matched isogenic correction and knock-in controls.
            experimental_model_type: ORGANOID
            namo_type: namo:Organoid
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: cerebral cortex
              term:
                id: UBERON:0000956
                label: cerebral cortex
            cell_types:
            - preferred_term: neural progenitor cell
              term:
                id: CL:0011020
                label: neural progenitor cell
            - preferred_term: radial glial cell
              term:
                id: CL:0000681
                label: radial glial cell
            conditions:
            - TUBB/TUBB5-related microcephaly
            - progenitor cell-cycle dysfunction
            - p53-associated apoptosis
            cell_source: Patient-derived or CRISPR-engineered human induced pluripotent stem cells
            culture_system: Three-dimensional cortical organoid with live imaging, immunostaining, and
              single-cell profiling
          perturbations:
          - name: Isogenic TUBB/TUBB5 variant correction or knock-in
            target: pathophysiology#Altered TUBB/TUBB5 Beta-Tubulin Function
            description: Correct a patient variant or introduce a pathogenic variant to separate variant
              effects from donor background.
          readouts:
          - name: Progenitor mitosis, p53 activation, and apoptosis
            target: pathophysiology#p53-Associated Apoptosis and Progenitor Pool Distortion
            description: Quantify cell-cycle length, spindle orientation, ectopic progenitor markers,
              p53 activation, apoptotic cells, and upper-layer neuron output.
            biological_processes:
            - preferred_term: mitotic cell cycle
              term:
                id: GO:0000278
                label: mitotic cell cycle
              modifier: DYSREGULATED
            - preferred_term: apoptotic process
              term:
                id: GO:0006915
                label: apoptotic process
              modifier: INCREASED
            assays:
            - preferred_term: immunostaining
            - preferred_term: single-cell transcriptomic profiling
            direction: POSITIVE
          controls:
          - name: Isogenic corrected organoids
            description: Patient-derived variant organoids corrected to the reference sequence.
          - name: Isogenic knock-in organoids
            description: Control-background organoids carrying the introduced pathogenic variant.
          decision_criterion: The mouse-derived mechanism is supported if human variant organoids show
            delayed progenitor cell cycle, spindle orientation defects, p53 activation, increased apoptosis,
            reduced upper-layer neuron output, and/or migration defects that are rescued by correction
            and reproduced by knock-in.
          would_support:
          - pathophysiology#Progenitor Cell-Cycle and Spindle Dysfunction
          - pathophysiology#p53-Associated Apoptosis and Progenitor Pool Distortion
          - pathophysiology#Impaired Neurogenic Division and Migration
      selected_evidence:
        snippet: cause TUBB5-associated microcephaly by exploiting two new mouse models
        supports: SUPPORT
