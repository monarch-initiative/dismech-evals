      assertion_type: Discussion
      assertion:
        discussion_id: gap_tubb_tubb5_notch_arm_human_translatability
        prompt: Does the Notch-dependent block of neural progenitor differentiation seen in tubb5-null
          zebrafish operate in human TUBB-related microcephaly, and is it pharmacologically reversible
          in a human model?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Notch-Dependent Block of Neural Progenitor Differentiation
        - pathophysiology#Microcephaly and Structural Brain Abnormalities
        rationale: 'The zebrafish arm is mechanistically attractive because it is reversible: gamma-secretase
          inhibition with DAPT rescued both developmental and locomotor deficits. But three features do
          not transfer automatically to the human disease. First, the fish model is a homozygous knockout,
          whereas human disease alleles are heterozygous missense variants whose mechanism has been shown
          to be gain-of-function rather than loss-of-function - a null and a dose-dependent gain-of-function
          allele need not converge on the same downstream pathway. Second, the mammalian mechanism established
          to date is p53-associated apoptosis of upper-layer neurons, which removes neurons that were
          made, while the Notch arm prevents them being made; whether both operate in humans, or whether
          one is species-specific, is untested. Third, DAPT rescue in a larval fish says nothing about
          a therapeutic window in a human brain whose malformation is established prenatally. Resolving
          this requires a human neural model carrying a patient TUBB missense allele.'
      selected_evidence:
        snippet: Furthermore, we demonstrate that the disease mechanism is not haploinsufficiency and
          that other patient mutations in TUBB affect cilia formation, putting forward defective ciliogenesis
          as a contributing pathogenic factor in a subset of tubulinopathy patients.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
