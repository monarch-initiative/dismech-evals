            term:
              id: MONDO:0014341
              label: complex cortical dysplasia with other brain malformations 6
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Ciliogenesis and Reduced Ciliation
        conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
        biological_scale: CELLULAR
        description: A subset of TUBB variants impairs the early stages of primary cilium assembly. Because
          the ciliary axoneme is itself built from microtubules, the beta-tubulin lesion acts on ciliogenesis
          directly, without any basal body, transition zone or intraflagellar-transport gene defect. Patient-derived
          cells and gene-edited isogenic lines carrying G308S show reduced ciliation through altered microtubule
          dynamics and structure; knock-in mice show decreased ciliation in cerebellum and kidney; and
          E108K and E401K reproduce the defect. The mechanism is dose-dependent gain-of-function, not
          haploinsufficiency - TUBB-haploid cells ciliate normally - so this branch is allele-specific
          rather than a property of every TUBB variant. It is what connects this entry to the ciliopathy
          spectrum, and the patients carrying these alleles show ciliopathy-like brain features on MRI.
        cell_types:
        - preferred_term: ciliated cell
          term:
            id: CL:0000064
            label: ciliated cell
        biological_processes:
        - preferred_term: cilium assembly
          term:
            id: GO:0060271
            label: cilium assembly
          modifier: DECREASED
        - preferred_term: microtubule cytoskeleton organization
          term:
            id: GO:0000226
            label: microtubule cytoskeleton organization
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Using patient-derived cells and gene-edited isogenic cell lines, we show that the identified
          variant impairs the early stages of cilia formation by altering microtubule dynamics and structure.
        supports: SUPPORT
    origin:
