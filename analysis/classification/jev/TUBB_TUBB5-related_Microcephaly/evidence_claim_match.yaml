              label: complex cortical dysplasia with other brain malformations 6
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Notch-Dependent Block of Neural Progenitor Differentiation
        biological_scale: CELLULAR
        description: 'In a zebrafish tubb5 knockout, loss of the beta-tubulin isotype upregulates the
          Notch effectors notch1a and her5, which hold neural progenitors in an undifferentiated state:
          neurogenin1- and huc-positive neurons are reduced while sox2-positive cells increase. Pharmacological
          Notch inhibition with DAPT rescues the developmental and locomotor deficits, so the arm is reversible
          in that model. This is curated as a separate branch from the p53-apoptosis arm because it removes
          neurons by failing to make them rather than by killing them, and the two have different therapeutic
          implications. The evidence is zebrafish-only; see the gap_tubb_tubb5_notch_arm_human_translatability
          discussion.'
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        biological_processes:
        - preferred_term: Notch signaling pathway
          term:
            id: GO:0007219
            label: Notch signaling pathway
          modifier: INCREASED
        - preferred_term: neuronal differentiation from neural progenitors
          term:
            id: GO:0030182
            label: neuron differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: Transcriptome analysis revealed that tubb5 knockout larvae showed upregulated expression
          of notch1a and her5, which inhibit neural progenitor differentiation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
