        description: 'The rate-limiting step. TUBG1 mutants disrupt the locomotion of newborn neurons
          and thereby their final positioning, while leaving progenitor proliferation unaffected - so
          the neurons are made, and then fail to travel. The defect is specifically in initiating locomotion:
          in the knock-in mouse, bipolar neurons position their centrosome correctly and still do not
          start moving, which separates this from a centrosome-repositioning failure. This is the node
          that makes TUBG1 a member of the migration module rather than of the progenitor-output modules.'
