          Ectopia
        description: 'The tissue-level readout, and the entry''s diagnostic signature. Failed locomotion
          produces a pachygyric cortex with a posterior-to-anterior gradient, lateral ventricles enlarged
          most over the posterior horns, and variably reduced white matter volume. What is absent matters
          as much as what is present: basal ganglia, brainstem and cerebellum are often normal, in contrast
          to the alpha- and beta-tubulinopathies where those structures are frequently malformed. Corpus-callosum
          morphology is variable rather than invariantly spared: it was often normal in the dedicated
          series but was thick and dysmorphic in P478. The resulting pattern resembles LIS1/PAFAH1B1 lissencephaly
          more than it resembles the rest of this gene family, which is why a tubulinopathy can be missed
          on imaging if dysmorphic basal ganglia are treated as a required feature.'
        cell_types:
        - preferred_term: cortical neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: cerebral cortex development
          term:
            id: GO:0021987
            label: cerebral cortex development
          modifier: DYSREGULATED
      selected_evidence:
        snippet: The core phenotype of TUBA1A and TUBG1 tubulinopathies are lissencephalies and microlissencephalies
        supports: SUPPORT
