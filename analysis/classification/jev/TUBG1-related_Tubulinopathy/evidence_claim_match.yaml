              label: complex cortical dysplasia with other brain malformations 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Gamma-Tubulin (TUBG1) Function in Microtubule Nucleation
        role: TRIGGER
        biological_scale: MOLECULAR
        conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule Apparatus Perturbation
        description: 'Heterozygous missense variants alter gamma-tubulin 1, the core component of the
          gamma-tubulin ring complex (gamma-TuRC) that templates microtubule nucleation at the centrosome.
          This is a categorically different lesion from the one carried by the alpha- and beta-tubulinopathies:
          gamma-tubulin is not a subunit of the microtubule lattice, so the defect is in how microtubules
          are started rather than in what they are built from. Expression of altered gamma-tubulin proteins
          in yeast disrupts normal microtubule behavior, and in subject-derived fibroblasts pathogenic
          variants reduce microtubule dynamics. The module''s trigger node is nevertheless the correct
          conformance target: whichever way the microtubule apparatus is perturbed, the same downstream
          migration machinery fails.'
        genetic_context:
          functional_impact_category: UNKNOWN
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          allele_type: missense
          description: 'All reported alleles are heterozygous missense, with no nonsense, frameshift or
            deletion alleles, so haploinsufficiency is not the presumed mechanism. The mechanism class
            has not been resolved further, and the one experiment that would have discriminated it argues
            against the obvious candidate: if the variants acted by disabling the centrosome as a nucleating
            center, subject fibroblasts should show centrosome defects, and they do not. UNKNOWN records
            that the question was examined and remains open, rather than that it was never annotated.'
        genes:
        - preferred_term: TUBG1
          term:
            id: hgnc:12417
            label: TUBG1
        cell_types:
        - preferred_term: migrating cortical neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: microtubule nucleation
          term:
            id: GO:0007020
            label: microtubule nucleation
          modifier: DYSREGULATED
        - preferred_term: microtubule cytoskeleton organization
          term:
            id: GO:0000226
            label: microtubule cytoskeleton organization
          modifier: DYSREGULATED
        cellular_components:
        - preferred_term: gamma-tubulin ring complex
          term:
            id: GO:0000931
            label: gamma-tubulin ring complex
          modifier: DYSREGULATED
      selected_evidence:
        snippet: expression of altered γ-tubulin proteins in Saccharomyces cerevisiae disrupts normal
          microtubule behavior
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
