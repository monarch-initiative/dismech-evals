  6fadfaf2d26235e0ef524259f0bc6902f52264147e38c688afa220d7c0c1b752:
    claim:
      about:
        disease:
          name: TUBG1-related Tubulinopathy
          disease_term:
            preferred_term: complex cortical dysplasia with other brain malformations 4
            term:
              id: MONDO:0014171
              label: complex cortical dysplasia with other brain malformations 4
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tubg1_imaging_signature_divergence
        prompt: Why does a tubulin-gene lesion produce a LIS1-like imaging phenotype with often-spared
          basal ganglia, brainstem and cerebellum but variable corpus-callosum morphology, when the alpha-
          and beta-tubulinopathies often malform those structures?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Posterior-Predominant Pachygyria with Spared Deep Structures
        - pathophysiology#Altered Gamma-Tubulin (TUBG1) Function in Microtubule Nucleation
        rationale: 'This is the sharpest natural experiment available in the tubulinopathy grouping, and
          it is unresolved. Dysmorphic basal ganglia with a fused striatum are reported as pathognomonic
          in roughly three quarters of tubulinopathy cases and are one of the imaging features that raises
          the diagnosis at all - yet in TUBG1 disease those structures are often normal. The proposed
          explanation is that gamma-tubulin''s job is microtubule nucleation rather than lattice assembly,
          so its failure does not perturb the same processes. That is plausible but currently an inference
          from function, not a demonstration: nobody has shown which developmental process in the basal
          ganglia and commissures requires lattice integrity but tolerates reduced nucleation fidelity.
          The practical consequence is diagnostic - a tubulin-gene disorder that looks like LIS1 on MRI
          will be missed by an imaging-led differential that treats dysmorphic basal ganglia as required.'
      selected_evidence:
        snippet: Basal ganglia, corpus callosum, brainstem, and cerebellum were often normal, in contrast
          to patients with variants in other tubulin genes where these structures are frequently malformed.
        supports: SUPPORT
