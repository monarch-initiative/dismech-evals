  8dcecf1583ff703bf3f7db409fbfa34a35c21266d3558ed2e9698abf8240da16:
    claim:
      about:
        disease:
          name: TUBG1-related Tubulinopathy
          disease_term:
            preferred_term: complex cortical dysplasia with other brain malformations 4
            term:
              id: MONDO:0014171
              label: complex cortical dysplasia with other brain malformations 4
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tubg1_neurogenesis_versus_locomotion
        prompt: Does pathogenic TUBG1 variation impair neurogenesis, or only the locomotion of neurons
          that were made normally?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Failure of Neuronal Locomotion Initiation
        - pathophysiology#Altered Gamma-Tubulin (TUBG1) Function in Microtubule Nucleation
        rationale: 'Two model systems give opposite answers, and the disagreement is not cosmetic - it
          decides which module this disease belongs to. In mouse, in utero electroporation of four patient
          variants and a Tubg1 Y92C/+ knock-in show disrupted locomotion of newborn neurons without affecting
          progenitor proliferation; the paper''s title states the point as "not neurogenesis". In zebrafish,
          somatic tubg1 mutation is reported to disrupt neurogenesis and brain development, mirroring
          microcephaly. The most likely reconciliation is the difference in allele class: the mouse work
          models heterozygous patient missense variants, while the zebrafish work is a somatic loss-of-function
          crispant, and gamma-tubulin is essential for mitosis, so removing it should impair proliferation
          even if a missense allele does not. If that is right, the zebrafish neurogenesis phenotype models
          gamma-tubulin deficiency rather than human TUBG1 disease. But it is not settled, and the human
          phenotype does include microcephaly, which a pure locomotion defect does not obviously explain.
          Resolving it requires a zebrafish or human model carrying the heterozygous missense allele rather
          than a null, with progenitor proliferation measured directly.'
        proposed_experiments:
        - experiment_id: exp_tubg1_missense_vs_null_progenitor_proliferation
          name: Allele-matched comparison of progenitor proliferation under TUBG1 missense versus null
          description: In a single model system, compare a heterozygous patient missense allele against
            a loss-of-function allele, measuring progenitor proliferation, neuronal output and migration
            side by side, to test whether the neurogenesis phenotype is allele-class-dependent.
          decision_criterion: If progenitor proliferation is impaired by the null but not by the heterozygous
            missense allele, the neurogenesis arm belongs to gamma-tubulin deficiency rather than to human
            TUBG1 disease, and the locomotion-only model stands. If the missense allele also impairs proliferation,
            this entry needs a progenitor branch and a second module conformance.
          would_support:
          - pathophysiology#Failure of Neuronal Locomotion Initiation
      selected_evidence:
        snippet: We demonstrate that γ-tubulin deficiency disrupts neurogenesis and brain development,
          mirroring microcephaly phenotypes.
        supports: REFUTE
