        biological_scale: CELLULAR
        description: 'The cellular consequence is a quantitative slowing of microtubule dynamics, not
          a broken centrosome. Subject-derived fibroblasts carrying pathogenic TUBG1 variants show reduced
          microtubule dynamics with no major structural or functional centrosome defects, and in mutant
          bipolar neurons centrosomal positioning is correct. This negative finding is load-bearing for
          the entry: it is why TUBG1 disease is curated on the migration module rather than the neural-progenitor
          centrosome/spindle module that TUBB/TUBB5 conforms to, despite gamma-tubulin being a centrosomal
          protein and despite the obvious prior expectation that a nucleation defect would present as
          a spindle disorder.'
