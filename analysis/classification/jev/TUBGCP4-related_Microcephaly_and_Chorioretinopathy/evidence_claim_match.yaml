        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Long-term ophthalmic course
        notes: One TUBGCP4 proband was reported as clinically stable over two decades. A separate mixed
          KIF11/TUBGCP4/TUBGCP6 cohort, which included only one person with TUBGCP4 variants, found that
          visually significant posterior-segment progression can occur and recommended close ophthalmic-genetics
          monitoring. Progression is reported only for the pooled cohort, so the direction and rate of
          TUBGCP4-specific retinal change remain uncertain.
      selected_evidence:
        snippet: Nine patients had KIF11 variants, two had heterozygous TUBGCP6 variants, and one had
          heterozygous variants in TUBGCP4.
        supports: SUPPORT
