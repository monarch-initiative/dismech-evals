      assertion_type: Subtype
      assertion:
        name: Group I
        display_name: Group I (switch II; classical TKS)
        description: Variants in the switch II loop (p.Tyr64Cys, p.Arg66Gly, p.Arg68Gln). These mutants
          are locked toward the GTP-bound state, are insensitive to regulators and have defective binding
          to all tested effectors. All carriers in the founding functional series had thrombocytopenia,
          and sensorineural hearing loss is characteristic of this group. p.Tyr64Cys is the recurrent
          hot-spot variant and the one the eponym was coined for.
      selected_evidence:
        snippet: demonstrating a stabilized GTP-bound conformation but defective interaction with all
          tested partners for group I mutations
        supports: SUPPORT
