        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated CDC42 GTPase Cycling
        biological_scale: MOLECULAR
        description: p.Tyr64Cys CDC42 shows a roughly 4,700-fold reduction in GAP-stimulated GTP hydrolysis
          and an almost abolished response to the exchange factor ITSN1, so it is held in the GTP-bound
          state independent of normal regulation. It also binds RhoGDI poorly, which normally extracts
          CDC42 from membranes, and escapes the KLHL23-Cul3 ubiquitin ligase that degrades GTP-bound CDC42;
          KLHL23 and RhoGDI both act on the switch II region that Tyr64 lies in.
        molecular_functions:
        - preferred_term: GTPase activity (regulator-insensitive)
          modifier: DYSREGULATED
          term:
            id: GO:0003924
            label: GTPase activity
      selected_evidence:
        snippet: By contrast, p.Tyr64Cys resulted in an almost completely abolished response to GEF.
        supports: SUPPORT
    origin:
