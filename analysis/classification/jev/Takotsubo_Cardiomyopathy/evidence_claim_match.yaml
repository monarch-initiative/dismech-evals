  c27682ef623349f953fe6f9eaa84c3a88e4dbe34d14db30a3c00efbfc577b807:
    claim:
      about:
        disease:
          name: Takotsubo Cardiomyopathy
          disease_term:
            preferred_term: Takotsubo cardiomyopathy
            term:
              id: MONDO:0019018
              label: Tako-tsubo cardiomyopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: polygenic_susceptibility_absent_locus
        prompt: 'Is there a genuine heritable component to takotsubo susceptibility, and if so why has
          no locus replicated despite two decades of candidate-gene work?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Beta2-adrenergic receptor switch from Gs to Gi coupling
        rationale: 'Familial clustering has been reported repeatedly, and the adrenergic pathway supplies
          unusually well-motivated candidate genes, ADRB2 above all, since it encodes the receptor through
          which the leading mechanism operates. Yet no variant has been conclusively associated, and the
          field has moved to a polygenic and gene-environment framing largely by elimination. Three explanations
          remain open. The effect may be genuinely polygenic with per-variant effects far below what candidate-gene
          sample sizes can detect. The heritable component may not be cardiac at all but reside in central
          stress-response and autonomic regulation, in which case adrenergic candidate genes were the
          wrong place to look. Or the familial reports may reflect shared environment and ascertainment
          rather than genetics. Resolving this determines whether a susceptibility panel is a realistic
          goal or a category error.

          '
        proposed_experiments:
        - experiment_id: exp_tts_gwas_consortium
          name: Adequately powered multinational genome-wide association study of takotsubo syndrome
          description: Pool takotsubo cases across the international registries with matched controls
            to reach a sample size capable of detecting common variants of modest effect, test for enrichment
            in adrenergic, stress-response, and neuropsychiatric pathways, and evaluate whether a polygenic
            score derived in one cohort predicts case status in an independent one.
          decision_criterion: Replicated genome-wide significant loci, or a polygenic score that transfers
            between cohorts, would establish a heritable component and localise it; a well-powered null
            would make a shared-environment explanation the leading account of familial clustering.
      selected_evidence:
        snippet: Despite a large number of investigations, no definitive genetic markers associated with
          TS risk have been conclusively identified. The lack of a clear Mendelian inheritance pattern
          suggests a multifactorial etiology and pathogenesis, likely involving complex gene-environment
          interactions and a polygenic background.
        supports: SUPPORT
