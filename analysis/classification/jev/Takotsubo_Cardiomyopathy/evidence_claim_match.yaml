  093f4e890162f3b6b4450146be99fb4b37c56852d99bc4af5672100315af6631:
    claim:
      about:
        disease:
          name: Takotsubo Cardiomyopathy
          disease_term:
            preferred_term: Takotsubo cardiomyopathy
            term:
              id: MONDO:0019018
              label: Tako-tsubo cardiomyopathy
        context: []
      assertion_type: Treatment
      assertion:
        name: Beta-adrenergic blockade
        description: 'Mechanistically the most attractive drug in the syndrome and the one that has repeatedly
          failed to show benefit. Blocking the receptor through which the catecholamine surge acts ought
          to work, and in animal models combined alpha- and beta-blockade does attenuate the ballooning.
          In patients, registry data show no survival benefit and no reduction in recurrence, and acute
          use is constrained by bradycardia, hypotension, low ejection fraction, and the torsade risk
          of a prolonged QT. Beta-blockade does have a specific acute role in relieving dynamic outflow
          obstruction. The gap between the mechanism and the outcome is curated as an open controversy.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: beta-adrenergic antagonist
            term:
              id: NCIT:C29576
              label: Beta-Adrenergic Antagonist
      selected_evidence:
        snippet: In contrast, there was no evidence of any survival benefit for the use of beta-blockers.2
          Moreover, one-third of patients experienced a TTS recurrence during beta-blockade2
        supports: REFUTE
    origin:
