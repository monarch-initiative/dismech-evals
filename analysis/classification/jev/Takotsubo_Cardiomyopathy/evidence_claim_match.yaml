        description: 'The initiating event is an acute stressor: bereavement, fear, anger, or interpersonal
          conflict on the emotional side; surgery, sepsis, respiratory failure, seizure, intracranial
          haemorrhage, or trauma on the physical side. Contemporary registry data overturned the original
          "broken heart" framing by showing that physical triggers are at least as common as emotional
          ones, and that patients with physical or neurologic triggers do worse. A minority of cases have
          no identifiable trigger at all, which is itself an argument against a purely reactive model.

          '
        biological_scale: ORGANISM
        role: trigger
      selected_evidence:
        snippet: Emotional triggers were not as common as physical triggers
        supports: SUPPORT
