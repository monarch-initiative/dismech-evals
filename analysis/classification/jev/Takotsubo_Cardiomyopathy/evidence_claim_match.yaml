        context:
        - path: /pathophysiology/1
          value:
            name: Sympathoadrenal activation and catecholamine surge
            description: 'Plasma epinephrine, norepinephrine, and dopamine rise steeply, to levels several-fold
              above those measured in patients with severe myocardial infarction and pulmonary oedema.
              The comparison matters: it is not simply that catecholamines are elevated in a sick patient,
              but that they are elevated far beyond what comparable haemodynamic stress produces. Endogenous
              catecholamine excess from pheochromocytoma, and iatrogenic epinephrine administration, reproduce
              the syndrome, which is the strongest available argument that the surge is causal rather
              than reactive.

              '
            biological_scale: ORGANISM
            role: mechanism
            biological_processes:
            - preferred_term: cellular response to catecholamine stimulus
              term:
                id: GO:0071870
                label: cellular response to catecholamine stimulus
              modifier: INCREASED
            cell_types:
