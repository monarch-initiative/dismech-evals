      assertion:
        burden_level: HIGH
        rationale: 'In-hospital mortality is around 6.5 percent and is not falling, which is comparable
          to acute myocardial infarction and refutes the historical description of the syndrome as benign.
          More than a third of admitted patients develop congestive heart failure, one in five atrial
          fibrillation, and one in fifteen cardiogenic shock. Men are a small minority of cases but die
          at more than twice the rate of women, for reasons that are unexplained.

          '
        notes: 'The burden is not confined to the admission. Survivors commonly remain fatigued, breathless,
          and exercise-limited after ejection fraction has normalised, and their long-term major adverse
          cardiovascular event rate approaches that of acute coronary syndrome survivors. Recurrence affects
          roughly four to ten percent. No therapy has been shown in a randomised trial to alter any of
          this.

          '
      selected_evidence:
        snippet: Mortality was high at 6.5% with no significant improvement over the years studied.
        supports: SUPPORT
