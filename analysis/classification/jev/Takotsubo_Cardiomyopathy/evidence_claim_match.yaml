        context:
        - path: /pathophysiology/2
          value:
            name: Beta2-adrenergic receptor switch from Gs to Gi coupling
            description: 'The leading molecular explanation for why the apex fails while the base becomes
              hypercontractile. At physiologic epinephrine levels the beta2-adrenergic receptor couples
              to stimulatory Gs and is inotropic. At the supraphysiologic levels reached in a catecholamine
              surge the receptor switches to inhibitory Gi, converting the same ligand into a negative
              inotropic and cardioprotective signal. Because beta2-receptor density and responsiveness
              are highest in apical cardiomyocytes, the switch is expressed as regional apical cardiodepression.
              Blocking Gi with pertussis toxin abolishes the apical depression, which is the causal test.

              '
            biological_scale: MOLECULAR
            role: mechanism
            molecular_functions:
            - preferred_term: beta2-adrenergic receptor activity
              term:
                id: GO:0004941
                label: beta2-adrenergic receptor activity
              modifier: GAIN_OF_FUNCTION
            biological_processes:
            - preferred_term: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
              term:
                id: GO:0007193
                label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
              modifier: INCREASED
            cell_types:
            - preferred_term: Apical cardiomyocyte
              term:
                id: CL:0000746
                label: cardiac muscle cell
            locations:
            - preferred_term: Left ventricle
              term:
                id: UBERON:0002084
                label: heart left ventricle
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Reversible regional wall motion abnormality
        causal_link_type: DIRECT
        description: 'Negative inotropy confined to the beta2-receptor-rich apex produces apical akinesis
          with preserved or exaggerated basal contraction.

          '
      selected_evidence:
        snippet: β(2)AR number and functional responses were greater in isolated apical cardiomyocytes
          than in basal cardiomyocytes, which confirmed the higher apical sensitivity and response to
          circulating epinephrine.
        supports: SUPPORT
    origin:
