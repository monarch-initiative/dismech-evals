      assertion:
        name: Coronary microvascular dysfunction
        description: 'Coronary flow reserve is impaired and microcirculatory resistance is elevated in
          the acute phase despite angiographically unobstructed epicardial arteries. Whether this is a
          primary driver of the stunning or a consequence of the same catecholamine surge acting on the
          microvasculature is unresolved, and the alpha-adrenergic receptors that dominate the coronary
          microcirculation are one proposed reason beta-blockade alone fails to prevent recurrence.

          '
        biological_scale: TISSUE
        role: mechanism
        cell_types:
        - preferred_term: Cardiac endothelial cell
          term:
            id: CL:0010008
            label: cardiac endothelial cell
      selected_evidence:
        snippet: suggesting that other receptors such as alpha-receptors, that are more prevalent in the
          coronary microcirculation, might be involved
