          the receptor switches to inhibitory Gi, converting the same ligand into a negative inotropic
          and cardioprotective signal. Because beta2-receptor density and responsiveness are highest in
          apical cardiomyocytes, the switch is expressed as regional apical cardiodepression. Blocking
          Gi with pertussis toxin abolishes the apical depression, which is the causal test.

          '
