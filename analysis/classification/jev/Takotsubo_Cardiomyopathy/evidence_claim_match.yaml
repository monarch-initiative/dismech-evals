      assertion_type: Treatment
      assertion:
        name: Avoidance of catecholamine inotropes
        description: 'A treatment defined by what is withheld. Giving catecholamines to a patient whose
          disease is caused by a catecholamine surge is mechanistically perverse, and in those with outflow
          obstruction it is haemodynamically harmful as well. Reported mortality among patients treated
          with catecholamines is high, though confounded by their being the sickest. Recognising this
          is arguably the single highest-yield management decision in the syndrome.

          '
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
