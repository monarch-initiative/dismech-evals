        name: Contraction band necrosis and focal myocytolysis
        description: 'The histologic signature, seen on endomyocardial biopsy: hypercontracted sarcomeres
          with dense eosinophilic transverse bands, focal myocyte dropout, and a mononuclear rather than
          neutrophilic infiltrate. It is qualitatively different from the coagulative necrosis of infarction,
          and it is reversible, which is the tissue-level reason the ventricle recovers. The same lesion
          appears in pheochromocytoma and in neurogenic stunned myocardium, tying the three catecholamine-excess
          states together.

          '
