  4013b520927fbeea05953e07ba8817be72da40025bae8b1ccb791e9d8df7f848:
    claim:
      about:
        disease:
          name: Takotsubo Cardiomyopathy
          disease_term:
            preferred_term: Takotsubo cardiomyopathy
            term:
              id: MONDO:0019018
              label: Tako-tsubo cardiomyopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: animal_models_and_the_sex_bias
        prompt: 'Do rodent immobilisation and catecholamine-infusion models reproduce the biology responsible
          for the overwhelming postmenopausal female predominance of takotsubo syndrome in humans?

          '
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Beta2-adrenergic receptor switch from Gs to Gi coupling
        - pathophysiology#Central limbic and autonomic network hypoconnectivity
        rationale: 'The animal models are genuinely strong on the core mechanism: immobilisation stress
          and epinephrine boluses reproduce the ST changes, the apical ballooning, and the reversibility,
          and pharmacologic blockade abolishes them. What they reproduce far less well is the single most
          striking epidemiologic fact about the human syndrome, that roughly nine in ten patients are
          postmenopausal women. Rat work shows that raising serum estrogen partially attenuates the cardiac
          changes, which is a real signal in the right direction but a much weaker effect than a nine-to-one
          sex ratio implies, and the models do not address the human limbic and insular findings at all.
          Two readings follow. Either the sex bias arises from a mechanism the models do not capture,
          in which case negative model results for hormone-directed interventions are uninformative about
          patients; or estrogen modulation of beta-adrenergic coupling is the right mechanism and the
          models simply underpower it. This matters directly for whether hormone-related susceptibility
          is worth pursuing therapeutically.

          '
        proposed_experiments:
        - experiment_id: exp_tts_ovariectomised_aged_model
          name: Aged ovariectomised rodent model with graded estrogen replacement
          description: Compare takotsubo induction rate and severity across intact young, intact aged,
            ovariectomised aged, and ovariectomised aged animals receiving graded estrogen replacement,
            using a standardised epinephrine bolus, with beta2-adrenergic receptor density and Gs-to-Gi
            coupling measured in apical and basal cardiomyocytes from each group.
          decision_criterion: A susceptibility gradient tracking estrogen exposure, with a matching shift
            in apical beta2-adrenergic receptor coupling, would establish the hormonal mechanism as sufficient
            to explain the human sex bias; a comparable induction rate across hormone states would show
            the models lack the relevant biology and would redirect attention to the central autonomic
            arm.
      selected_evidence:
        snippet: An increase of serum estrogen partially attenuated these cardiac changes.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
