        context: []
      assertion_type: Treatment
      assertion:
        name: Mechanical circulatory support for refractory shock
        description: 'For shock that does not respond, or that cannot be treated with inotropes because
          of outflow obstruction, temporary mechanical support bridges the patient through the days to
          weeks until the myocardium recovers. Device choice is dictated by the same physiology: a device
          that unloads the left ventricle is preferable, whereas veno-arterial extracorporeal support
          without unloading raises afterload and can worsen an outflow gradient.

          '
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: percutaneous ventricular assist device placement
          term:
            id: NCIT:C172592
            label: Percutaneous Ventricular Assist Device Placement
      selected_evidence:
        snippet: The overall number of publications on MCS for TS increased over time, as did those using
          veno-arterial extracorporeal membrane oxygenation (V-A ECMO) and Impella, while those using
          intra-aortic balloon pump declined.
        supports: SUPPORT
