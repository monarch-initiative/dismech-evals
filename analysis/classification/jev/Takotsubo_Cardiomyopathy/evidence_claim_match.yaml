          reactive oxygen species, and impairs mitochondrial energetics. This is the classical catecholamine
          cardiotoxicity mechanism, shared with pheochromocytoma crisis and subarachnoid haemorrhage,
          and it is what produces the histologic lesion below. It is a parallel arm to the receptor switch
          rather than a consequence of it: the switch explains the regional distribution, this explains
          the tissue injury.

          '
