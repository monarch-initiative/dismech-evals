          value:
            name: Myocardial macrophage inflammatory infiltrate
            description: 'Iron-oxide-enhanced cardiac magnetic resonance shows macrophage accumulation
              in both ballooning and non-ballooning left ventricular segments, accompanied by a shift
              in circulating monocyte subsets and raised interleukin-6 and CXCL1. Two findings make this
              more than an epiphenomenon of injury. First, the infiltrate is present in segments that
              are contracting normally, so it is not simply a reaction to regional akinesis. Second, the
              systemic inflammatory changes persist for months after the myocardial signal has resolved,
              which is the best current mechanistic candidate for the persistent subclinical dysfunction
              seen in survivors.

              '
            biological_scale: TISSUE
            role: mechanism
            cell_types:
