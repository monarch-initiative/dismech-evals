              term:
                id: CL:0000166
                label: chromaffin cell
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Beta2-adrenergic receptor switch from Gs to Gi coupling
        causal_link_type: DIRECT
        description: 'Supraphysiologic epinephrine concentrations drive the beta2-adrenergic receptor
          into inhibitory G-protein coupling.

          '
      selected_evidence:
        snippet: We describe an in vivo rat model in which a high intravenous epinephrine, but not norepinephrine,
          bolus produces the characteristic reversible apical depression of myocardial contraction coupled
          with basal hypercontractility.
        supports: SUPPORT
