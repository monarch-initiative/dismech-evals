  490505f309a03599dba7252c87792c17610f9e0ecd324e13567cf1173d9c5559:
    claim:
      about:
        disease:
          name: Takotsubo Cardiomyopathy
          disease_term:
            preferred_term: Takotsubo cardiomyopathy
            term:
              id: MONDO:0019018
              label: Tako-tsubo cardiomyopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: beta_blockade_mechanism_outcome_gap
        prompt: 'Why does beta-adrenergic blockade, which targets the mechanism that causes takotsubo
          syndrome, fail to improve survival or prevent recurrence?

          '
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Sympathoadrenal activation and catecholamine surge
        - pathophysiology#Beta2-adrenergic receptor switch from Gs to Gi coupling
        - pathophysiology#Coronary microvascular dysfunction
        rationale: 'Every element of the accepted mechanism predicts that beta-blockade should work: the
          trigger is a catecholamine surge, the molecular lesion is a beta2-adrenergic receptor switch,
          and in animals combined adrenoceptor blockade abolishes the ballooning. Registry data nonetheless
          show no survival benefit, and a third of patients recur while taking a beta-blocker. Several
          explanations are live and mutually compatible. Alpha-adrenergic receptors dominate the coronary
          microcirculation and are untouched by beta-blockade, which would matter if the microvascular
          arm carries more causal weight than assumed. The animal evidence required combined alpha and
          beta blockade, not beta alone, so the preclinical result may never have supported beta-monotherapy.
          Blockade started after presentation cannot prevent a surge that has already happened, so an
          acute-phase trial may be testing the wrong window. And if the receptor switch is partly cardioprotective
          rather than purely injurious, blocking it could offset its own benefit. Distinguishing these
          matters because they imply different drugs and different timing.

          '
        proposed_experiments:
        - experiment_id: exp_tts_combined_alpha_beta_blockade_trial
          name: Randomised trial of combined alpha- and beta-adrenoceptor blockade versus beta-blockade
            alone for recurrence prevention
          description: Randomise takotsubo survivors at hospital discharge to a combined alpha- and beta-blocking
            agent, a selective beta-blocker, or renin-angiotensin blockade alone, and follow recurrence,
            major adverse cardiovascular events, and global longitudinal strain for three years.
          decision_criterion: A reduction in recurrence with combined blockade but not with beta-blockade
            alone would support the alpha-receptor and microvascular explanation and would reconcile the
            animal and clinical evidence; equivalence across all three arms would argue that adrenergic
            blockade after the index event is simply too late.
      selected_evidence:
        snippet: In contrast, there was no evidence of any survival benefit for the use of beta-blockers.2
          Moreover, one-third of patients experienced a TTS recurrence during beta-blockade2 suggesting
          that other receptors such as alpha-receptors, that are more prevalent in the coronary microcirculation,
          might be involved.
        supports: SUPPORT
