          name: Takotsubo Cardiomyopathy
          disease_term:
            preferred_term: Takotsubo cardiomyopathy
            term:
              id: MONDO:0019018
              label: Tako-tsubo cardiomyopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: brain_heart_axis_causal_direction
        prompt: 'Is the limbic and autonomic network hypoconnectivity seen in takotsubo patients a pre-existing
          vulnerability that permits the syndrome, or a consequence of having had it?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Central limbic and autonomic network hypoconnectivity
        rationale: 'The imaging is unambiguous that connectivity in sympathetic- and parasympathetic-associated
          subnetworks is reduced, involving exactly the regions that generate autonomic outflow. The direction
          of causation is not established, because every published cohort was scanned after the cardiac
          event. The distinction is not academic: a pre-existing central lesion would make takotsubo a
          disorder of autonomic regulation that happens to present cardiologically, would explain why
          some patients recur and others never do, and would make central rather than cardiac intervention
          the rational target. A reactive change would instead make the brain findings a marker of illness
          severity.

          '
        proposed_experiments:
        - experiment_id: exp_tts_prospective_neuroimaging_cohort
          name: Prospective neuroimaging in a population at elevated takotsubo risk
          description: Acquire resting-state functional magnetic resonance imaging in a large cohort scanned
            for unrelated indications or as part of a population imaging study, then ascertain incident
            takotsubo syndrome over subsequent years and compare baseline limbic and autonomic connectivity
            in those who develop the syndrome against matched controls who do not.
          decision_criterion: Reduced baseline connectivity preceding the event would establish it as
            a predisposing lesion; connectivity indistinguishable from controls before the event, with
            the abnormality appearing only afterwards, would establish it as reactive.
      selected_evidence:
        snippet: We found parasympathetic- and sympathetic-associated subnetworks both showing reduced
          resting state functional connectivity in TTS patients compared with controls.
        supports: SUPPORT
