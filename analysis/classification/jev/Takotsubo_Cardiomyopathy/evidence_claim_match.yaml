        description: 'Resting-state functional magnetic resonance imaging in takotsubo survivors shows
          reduced connectivity in both sympathetic- and parasympathetic-associated subnetworks, involving
          amygdala, hippocampus, insula, and cingulate cortex. The direction of causation is the open
          question and is curated as such: these are the regions that generate and regulate the autonomic
          outflow, so reduced integration is a plausible predisposing lesion, but the imaging is done
          after the cardiac event, so it is equally compatible with the event having altered the brain.

          '
        biological_scale: ORGANISM
