            term:
              id: MONDO:0014401
              label: tall stature-scoliosis-macrodactyly of the great toes syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: NPR2
        gene_term:
          preferred_term: NPR2
          term:
            id: hgnc:7944
            label: NPR2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Heterozygous activating alleles cluster in the intracellular regions of NPR-B: the
          submembrane segment (p.Ala488Pro, p.Met482_Leu483del), the kinase homology domain (p.Arg655Cys)
          and the guanylyl cyclase domain (p.Val883Met). Loss-of-function NPR2 alleles cause the opposite,
          short stature phenotypes, so the direction of the variant''s effect on receptor activity has
          to be established before an NPR2 variant is assigned to this disorder.'
        variants:
        - name: p.Val883Met
          description: NM_003995 c.2647G>A, a missense variant in the conserved C-terminal guanylyl cyclase
            domain. It segregated in a three-generation Japanese family and was found again in a two-generation
            family with five affected members. In transfected cells it produces cGMP without CNP and blocks
            the normal desensitization of the receptor.
          gene:
            preferred_term: NPR2
            term:
              id: hgnc:7944
              label: NPR2
          variant_type: single nucleotide variant
          functional_effects:
          - function: guanylate cyclase activity
            description: Ligand-independent cGMP production and loss of time-dependent receptor inactivation.
            type: gain-of-function
        - name: p.Ala488Pro
          description: c.1462G>C, a missense variant in the intracellular submembrane region, co-segregating
            in a four-generation Korean family. The mutant receptor is overactive at baseline and with
            CNP; biochemically it lowers the EC50 for CNP and the Km for GTP, and requires receptor phosphorylation
            for its CNP-dependent activation.
          gene:
            preferred_term: NPR2
            term:
              id: hgnc:7944
              label: NPR2
          variant_type: single nucleotide variant
          functional_effects:
          - function: guanylate cyclase activity
            description: Increased basal and CNP-stimulated receptor activity.
            type: gain-of-function
        - name: p.Met482_Leu483del
          description: c.1444_1449delATGCTG, a six-base in-frame deletion removing two residues of the
            intracellular submembrane region, found in a Dutch mother and her two daughters. Patient fibroblasts
            and transfected HEK-293 cells show raised basal and CNP-stimulated cGMP production.
          gene:
            preferred_term: NPR2
            term:
              id: hgnc:7944
              label: NPR2
          variant_type: deletion
          functional_effects:
          - function: guanylate cyclase activity
            description: Increased ligand-independent and CNP-stimulated cGMP synthesis.
            type: gain-of-function
        - name: p.Arg655Cys
          description: A missense variant in the kinase homology domain reported in a man with extreme
            tall stature but without the skeletal deformities of this syndrome. It increases CNP responsiveness
            and ATP-dependent allosteric activation and forms stable heterodimers with wild-type NPR-B.
            It is an activating NPR2 allele at the boundary of the clinical entity rather than a typical
            cause of it.
          gene:
            preferred_term: NPR2
            term:
              id: hgnc:7944
              label: NPR2
          variant_type: single nucleotide variant
          functional_effects:
          - function: guanylate cyclase activity
            description: Increased CNP-stimulated cGMP production in patient fibroblasts and transfected
              cells.
            type: gain-of-function
      selected_evidence:
        snippet: We describe a three-generation family with tall stature, scoliosis and macrodactyly of
          the great toes and a heterozygous p.Val883Met mutation in Npr2
        supports: SUPPORT
