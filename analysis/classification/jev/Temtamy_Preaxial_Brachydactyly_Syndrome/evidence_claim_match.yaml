            name: CHSY1 Deficiency and Reduced Chondroitin Sulfate Biosynthesis
            description: 'CHSY1 is a secreted glycosyltransferase, bearing a Fringe domain, that is required
              for the synthesis of chondroitin sulfate chains on proteoglycans. Biallelic loss-of-function
              mutations eliminate CHSY1 activity, reducing chondroitin sulfate moieties and altering the
              extracellular matrix and proteoglycan context that supports cartilage, bone, and craniofacial
              development. TPBS is therefore part of the spectrum of disorders caused by defects in glycosaminoglycan/proteoglycan
              biosynthesis.

              '
