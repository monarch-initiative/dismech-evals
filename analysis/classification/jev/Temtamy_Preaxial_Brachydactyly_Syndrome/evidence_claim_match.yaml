            term:
              id: MONDO:0011533
              label: temtamy preaxial brachydactyly syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated BMP-CHSY1 Limb and Inner-Ear Patterning
        description: 'CHSY1 has been identified as a potential mediator/target of BMP signaling. In zebrafish,
          unrestricted Bmp2b signaling or loss of the BMP inhibitor Dan reduces chsy1 expression, and
          Chsy1 perturbation produces inner-ear and other developmental defects similar to those seen
          with altered BMP signaling. Both loss and gain of chsy1 produce comparable zebrafish phenotypes,
          paralleling how human brachydactyly can result from either reduced or excessive BMP signaling.
          This BMP-CHSY1 axis links the chondroitin sulfate defect to limb, craniofacial, and inner-ear
          (hearing) phenotypes.

          '
        genes:
        - preferred_term: CHSY1
          term:
            id: hgnc:17198
            label: CHSY1
        biological_processes:
        - preferred_term: BMP signaling pathway
          term:
            id: GO:0030509
            label: BMP signaling pathway
          modifier: ABNORMAL
        - preferred_term: Skeletal system development
          term:
            id: GO:0001501
            label: skeletal system development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Furthermore, unrestricted Bmp2b signaling or loss of Dan activity leads to reduced chsy1
          expression and, during epithelial morphogenesis, defects similar to those that occur upon Chsy1
          inactivation, indicating that Bmp signaling affects inner-ear development by repressing chsy1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
