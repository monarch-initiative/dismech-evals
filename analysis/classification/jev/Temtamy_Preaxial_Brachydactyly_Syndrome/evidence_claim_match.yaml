            term:
              id: MONDO:0011533
              label: temtamy preaxial brachydactyly syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical, Radiographic, and Molecular Diagnosis
        description: TPBS is recognized clinically and radiographically from bilateral preaxial brachydactyly
          with hyperphalangism and partial duplication/splitting of proximal phalanges (digits 1-3), symphalangism,
          carpal/tarsal and radioulnar synostoses, facial dysmorphism, dental anomalies, and sensorineural
          hearing loss (assessed by audiometry). Diagnosis is confirmed by identification of biallelic
          CHSY1 loss-of-function variants on molecular genetic testing. Differential diagnosis includes
          other syndromic brachydactylies with hyperphalangism (e.g., Catel-Manzke syndrome). TPBS must
          be distinguished from the unrelated C12orf57-related Temtamy syndrome.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: After mapping the TPBS locus to chromosome 15q26-qterm, we identified causative mutations
          in five consanguineous TPBS families.
        supports: SUPPORT
