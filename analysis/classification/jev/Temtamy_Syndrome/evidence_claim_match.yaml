            label: corpus callosum development
          modifier: ABNORMAL
        - preferred_term: eye development
          term:
            id: GO:0001654
            label: eye development
          modifier: ABNORMAL
        - preferred_term: nervous system development
          term:
            id: GO:0007399
            label: nervous system development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Little is known about C12orf57 but we show that it is expressed in several mouse tissues,
          including the eye and brain.
        supports: SUPPORT
