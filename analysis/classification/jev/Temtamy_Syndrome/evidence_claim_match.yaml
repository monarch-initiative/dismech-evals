      assertion_type: Pathophysiology
      assertion:
        name: C12orf57 Loss of Function
        description: Biallelic loss-of-function variants in C12orf57 (GRCC10) — most commonly an ancestral
          start-loss founder mutation (c.1A>G; p.M1?) and other truncating or missense changes — abolish
          or severely reduce function of a small, poorly annotated 126-amino-acid protein that is ubiquitously
          expressed and tightly conserved across evolution. The protein is required for normal development
          of the human corpus callosum and is expressed in tissues including the eye and brain, linking
          its loss to the combined forebrain commissural and ocular developmental phenotype.
        genes:
        - preferred_term: C12orf57
          term:
            id: hgnc:29521
            label: C12orf57
        cell_types:
