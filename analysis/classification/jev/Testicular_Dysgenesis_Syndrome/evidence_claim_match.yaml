      assertion:
        name: Gestational DBP rat model of TDS
        species: Rat
        category: Chemical anti-androgen exposure model
        background: Wistar
        description: 'Pregnant rats exposed to di(n-butyl) phthalate, which suppresses fetal testicular
          testosterone production. The model''s decisive feature is window specificity: DBP suppresses
          fetal testosterone equally during and after the masculinisation programming window, but only
          exposure inside the window shortens anogenital distance and produces focal testicular dysgenesis
          and the TDS disorders. It is the model that converted TDS from a hypothesis into a testable,
          and tested, causal claim.'
        publication: PMID:28352662
        modeled_mechanisms:
        - target: Deficient Androgen Action in the Masculinization Programming Window
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: 'Reproduces the core mechanistic claim of TDS: androgen deficiency confined to
            the programming window, and not an equivalent deficiency outside it, generates the syndrome.'
          readouts:
          - name: Anogenital distance
            target: Deficient Androgen Action in the Masculinization Programming Window
            description: Ano-genital distance measured in male offspring, used as the read-out of androgen
              action during the programming window.
            direction: DECREASED
            interpretation: Shortened AGD indicates deficient androgen action inside the window specifically,
              because AGD is programmed there and is unaffected by exposure that begins afterwards.
          limitations: The window is defined in rat embryonic days; the corresponding human interval is
            extrapolated from rat timings rather than measured.
        - target: Fetal Leydig Cell Dysfunction
          relationship: PERTURBS
          fidelity: HIGH
          model_scale: ORGANISM
          description: DBP is used as the means of suppressing fetal Leydig cell steroidogenesis, so the
            model manipulates this node rather than arising from it spontaneously.
          readouts:
          - name: Intratesticular testosterone
            target: Fetal Leydig Cell Dysfunction
            description: Testosterone measured in the fetal testis during and after the programming window.
            direction: DECREASED
            interpretation: Reduced intratesticular testosterone confirms the intended Leydig cell perturbation.
              It is a poor predictor of the TDS outcome on its own, because it falls just as far under
              exposure that begins after the programming window and produces no syndrome.
          divergences:
          - divergence_type: CONTESTED_ASSUMPTION
            materiality: QUALIFYING
            description: The link assumes the rat steroidogenic response to phthalate stands in for the
              human one. Grafted human fetal testis tested directly did not suppress steroidogenic gene
              expression, although it did show the germ cell change, and mice do not suppress it either.
              The rat perturbation of this node is real and well measured; what is contested is reading
              it as the human response. Marked QUALIFYING rather than INVALIDATING because the germ cell
              arm did transfer and the mechanism remains informative.
          limitations: Phthalate suppression of fetal Leydig steroidogenesis is species specific. Rats
            show it, mice do not, and grafted human fetal testis does not either, so this link supports
            a mechanism that human tissue has not been shown to share at the steroidogenic step.
        - target: Arrested Gonocyte Differentiation
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: 'The rat model reproduces the somatic and masculinisation arms of TDS but not the
            germ cell neoplasia arm: GCNIS cells and human-type germ cell cancers have not been described
            in any animal model of TDS. The model does reproduce the focal dysgenetic histology seen in
            the testes of men with GCNIS, so it speaks to the lesion''s context without reproducing the
            neoplastic lesion itself.'
          limitations: Likely a species difference in male gonad development. Any inference from this
            model to the cancer component of TDS passes through the shared dysgenetic histology, not through
            a modelled neoplasm, and the latency and post-pubertal proliferation that produce human invasive
            cancer are not represented at all.
      selected_evidence:
        snippet: If our results are translatable to humans, they suggest that identification of potential
          causes of human TDS disorders should focus on exposures during a human MPW equivalent, especially
          if negatively associated with offspring AGD.
        supports: SUPPORT
