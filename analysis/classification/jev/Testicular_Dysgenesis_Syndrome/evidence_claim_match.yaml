        species: Mouse
        category: ENU-induced missense model of INSL3 receptor dysfunction
        genotype: Rxfp2 D294G homozygous and Rxfp2 D294G over null compound heterozygous
        description: A mouse carrying an ENU-induced missense change in leucine-rich repeat 8 of Rxfp2,
          the INSL3 receptor. The variant leaves total protein near normal but markedly reduces cell-surface
          expression and caps the maximum cAMP response, so it is a partial loss-of-function of receptor
          trafficking rather than a null. Genetic complementation against a loss-of-function allele confirmed
          causality. It isolates the descent arm of TDS from the androgen arm, and shows that a descent
          defect alone brings spermatogenic damage with it.
        publication: PMID:20963592
        modeled_mechanisms:
        - target: Impaired INSL3-RXFP2 Signalling at the Gubernaculum
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Reproduces partial loss of INSL3 receptor function and the descent failure that
            follows, with the molecular defect localised to receptor trafficking.
          readouts:
          - name: Maximal cAMP response to INSL3
            target: Impaired INSL3-RXFP2 Signalling at the Gubernaculum
            description: Intracellular cAMP accumulation in cells transfected with wild-type or mutant
              receptor, measured alongside total and cell-surface RXFP2 protein.
            direction: DECREASED
            interpretation: Preserved EC50 with a reduced maximum response indicates fewer functional
              receptors at the surface rather than altered ligand affinity, which is what makes this a
              trafficking defect.
          limitations: A mouse germline receptor variant, not an environmental exposure, so it models
            the descent mechanism rather than the environmental aetiology TDS is usually framed around.
            Recessive RXFP2 variants do cause familial bilateral cryptorchidism in humans (PMID:31167797),
            but that is a rare Mendelian presentation; the INSL3-RXFP2 axis is not established as a common
            cause of sporadic human cryptorchidism.
        - target: Failure of Trans-abdominal Testicular Descent
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Produces cryptorchidism together with the spermatogenic damage that follows a maldescended
            testis, up to Sertoli-cell-only tubules.
          readouts:
          - name: Testicular histology
            target: Failure of Trans-abdominal Testicular Descent
            description: Seminiferous tubule histology in homozygous mutant mice.
            direction: ALTERED
            interpretation: Germ cell loss progressing to Sertoli-cell-only tubules shows the descent
              failure carries a spermatogenic cost, linking the cryptorchidism and infertility components
              of TDS within one lesion.
      selected_evidence:
        snippet: Deletion of Insl3 or its receptor, Rxfp2, in mice causes cryptorchidism.
        supports: SUPPORT
    origin:
