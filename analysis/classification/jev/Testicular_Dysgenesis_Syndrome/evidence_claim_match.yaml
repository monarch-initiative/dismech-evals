        description: Interruption of the first stage of testicular descent, in which the testis is held
          near the inguinal region as the abdomen grows. In the mouse it carries spermatogenic consequences
          in its own right, up to Sertoli-cell-only tubules. Human descent has two phases and this node
          models only the INSL3-dependent trans-abdominal one; the later inguinoscrotal phase is androgen-dependent
          and reaches cryptorchidism through Incomplete Reproductive Tract Masculinization instead, so
          human cryptorchidism is not attributed wholly to this node.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: The mutation impaired testicular descent and resulted in decreased testis weight in Rxfp2
          ( DG/DG ) mice compared to Rxfp2 (+/DG ) and Rxfp2 (+/+) mice.
        supports: SUPPORT
