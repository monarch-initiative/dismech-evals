              label: testicular dysgenesis syndrome
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Gestational flutamide rat model of androgen receptor blockade
        species: Rat
        category: Androgen receptor antagonist exposure model
        background: Sprague-Dawley and Wistar
        description: 'Pregnant rats exposed to flutamide, an androgen receptor antagonist, which blocks
          androgen action at the receptor rather than suppressing its synthesis. This separates the receptor-level
          step from the steroidogenic step: flutamide and DBP both shorten anogenital distance and reduce
          androgen-dependent organ size, but flutamide does so without reducing testosterone production.
          Single-dose dosing on individual gestational days further resolves which day programmes which
          structure.'
        publication: PMID:15788718
        modeled_mechanisms:
        - target: Deficient Androgen Action in the Masculinization Programming Window
          relationship: PERTURBS
          fidelity: HIGH
          model_scale: ORGANISM
          description: Receptor-level blockade isolates androgen action from androgen production as the
            step that the programming window depends on.
          readouts:
          - name: Anogenital distance
            target: Deficient Androgen Action in the Masculinization Programming Window
            description: Anogenital distance in offspring of flutamide-exposed dams, measured alongside
              androgen-dependent organ weights.
            direction: DECREASED
            interpretation: Shortening under receptor blockade shows AGD reports androgen action at the
              receptor, not circulating or intratesticular testosterone concentration.
        - target: Incomplete Reproductive Tract Masculinization
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Gestational receptor blockade produces the under-virilisation phenotypes, with
            the affected structure depending on the gestational day of exposure.
          readouts:
          - name: Hypospadias incidence
            target: Incomplete Reproductive Tract Masculinization
            description: Hypospadias in adult male offspring after a single gestational flutamide dose.
            direction: INCREASED
            interpretation: Peak incidence at gestational day 17 locates urethral programming within the
              window and shows tissue-selective timing.
          limitations: Cryptorchidism was almost absent after single-dose exposure, unlike the multiple-dose
            flutamide and DBP models, so this model under-reproduces the testicular descent component.
      selected_evidence:
        snippet: Thus, a single gestational exposure of flutamide induced numerous reproductive tract
          malformations consistent with previously reports following multiple exposures, with the timing
          of the exposure producing marked tissue selectivity in the response noted in adult offspring.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1
      evidence_path: /animal_models/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15788718
      reference_title: Changes in androgen-mediated reproductive development in male rat offspring following
        exposure to a single oral dose of flutamide at different gestational ages.
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      explanation: 'The model''s own summary result: one receptor-blocking dose is enough to produce the
