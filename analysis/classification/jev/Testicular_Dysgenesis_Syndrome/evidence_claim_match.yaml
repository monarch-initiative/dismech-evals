            label: AR
        relationship_type: CAUSATIVE
        notes: A missense variant in the androgen receptor, c.2214T>G p.Ile738Met, segregating in a family
          in which three males showed the full set of TDS components. Functional assay showed roughly
          half-normal AR transcriptional activity, making this a genetic counterpart of the androgen signalling
          deficit that anti-androgens produce environmentally. A single family, so this establishes sufficiency
          of reduced androgen signalling in principle rather than a recurrent genetic cause of TDS.
      selected_evidence:
        snippet: The presence of all hallmarks of TDS, including germ cell cancer, in a family with a
          novel AR mutation causing a partial decrease in AR function is in line with the concept that
          reduced androgen signaling may contribute to the development of TDS.
        supports: SUPPORT
