        notes: 'TDS itself has no prevalence figure, because it is not diagnosed as a unit. What the literature
          measures is the incidence of its components, and the component that carries the epidemiological
          argument is testicular germ cell cancer: its incidence rises by birth cohort rather than by
          period, which is what implicates a fetal exposure. Recorded at the TDS level because the birth-cohort
          pattern, not the rate, is the TDS-relevant claim. Rates for individual components belong in
          the component entries.'
      selected_evidence:
        snippet: Cohort-specific trends in seminoma incidence are similar to cohort-specific trends in
          nonseminoma incidence, lending support to the conclusion that the subtypes are epidemiologically
          and etiologically comparable.
