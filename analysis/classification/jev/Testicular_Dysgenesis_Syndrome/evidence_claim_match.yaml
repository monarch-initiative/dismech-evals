          value:
            name: Failure of Trans-abdominal Testicular Descent
            description: Interruption of the first stage of testicular descent, in which the testis is
              held near the inguinal region as the abdomen grows. In the mouse it carries spermatogenic
              consequences in its own right, up to Sertoli-cell-only tubules. Human descent has two phases
              and this node models only the INSL3-dependent trans-abdominal one; the later inguinoscrotal
              phase is androgen-dependent and reaches cryptorchidism through Incomplete Reproductive Tract
              Masculinization instead, so human cryptorchidism is not attributed wholly to this node.
            biological_scale: ORGANISM
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Male infertility
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
      selected_evidence:
        snippet: Impaired fertility (33% in unilateral cases and 66% in bilateral undescended testes)
          and a cancer risk 5-10 times greater than normal is observed over time.
        supports: SUPPORT
