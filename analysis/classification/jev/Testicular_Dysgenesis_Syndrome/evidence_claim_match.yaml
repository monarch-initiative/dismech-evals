  5b01eb299f5be5e58e90cc65a05465c20c26567b6b774477faa3fc1eb17809b1:
    claim:
      about:
        disease:
          name: Testicular Dysgenesis Syndrome
          disease_term:
            preferred_term: testicular dysgenesis syndrome
            term:
              id: MONDO:0005437
              label: testicular dysgenesis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Focal Testicular Dysgenesis
        description: 'The structural signature of the early disruption: focal areas in which Leydig cells
          form large aggregates, Sertoli cells sit ectopically outside the seminiferous cords, and cords
          are malformed, with intratubular Leydig cells appearing after birth. It is a marker of poor
          set-up during the programming window rather than a cause of the downstream disorders, which
          is why it carries no downstream edges: it is not even detectable until after the window in which
          the damage is done. The same focal changes are found in the testes of men with germ cell neoplasia
          in situ.'
        biological_scale: TISSUE
        cell_types:
        - preferred_term: Leydig cell
          term:
            id: CL:0000178
            label: Leydig cell
        - preferred_term: Sertoli cell
          term:
            id: CL:0000216
            label: Sertoli cell
      selected_evidence:
        snippet: Focal testicular dysgenesis is simply a reflection of poor set-up during this early programming
          period, even though it is not observed itself until some time later in development.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
