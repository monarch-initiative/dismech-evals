      assertion_type: Pathophysiology
      assertion:
        name: Impaired INSL3-RXFP2 Signalling at the Gubernaculum
        description: A second, androgen-independent route from fetal Leydig cell dysfunction to a TDS
          component. Insulin-like 3 (INSL3), made by the fetal Leydig cells, acts through its receptor
          RXFP2 on the gubernaculum, the ligament anchoring the testis to the lower abdomen. Signalling
          through this axis drives myogenic differentiation and maintains androgen-receptor-positive cells
          in the gubernaculum, with Wnt/beta-catenin and Notch as downstream pathways. Loss of the ligand
          or the receptor interrupts the first, trans-abdominal stage of descent, which is why cryptorchidism
          can arise from Leydig cell failure without a proportionate deficit in testosterone.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Leydig cell
          term:
            id: CL:0000178
            label: Leydig cell
      selected_evidence:
        snippet: We have shown that INSL3/RXFP2 signaling is essential for myogenic differentiation and
          maintenance of AR-positive cells in the gubernaculum.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
