      assertion_type: Pathophysiology
      assertion:
        name: Germ Cell Neoplasia In Situ (GCNIS)
        description: Nearly all postpubertal TGCTs arise from germ cell neoplasia in situ (GCNIS, formerly
          carcinoma in situ or intratubular germ cell neoplasia unclassified). GCNIS cells resemble fetal
          gonocytes that failed to mature normally during embryonic development. The initiating malignant
          transformation most likely occurs in utero in primordial germ cells/gonocytes. GCNIS cells can
          remain dormant until puberty and then accumulate chromosomal abnormalities that drive malignant
          progression.
        cell_types:
        - preferred_term: primordial germ cell
          term:
            id: CL:0000670
            label: primordial germ cell
        biological_processes:
        - preferred_term: germ cell development
          modifier: ABNORMAL
          term:
            id: GO:0007281
            label: germ cell development
      selected_evidence:
        snippet: the genetic and epigenetic factors involved in the pathogenesis of testicular germ cell
          tumors (TGCTs)
        supports: SUPPORT
