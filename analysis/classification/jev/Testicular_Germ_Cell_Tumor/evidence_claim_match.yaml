        - preferred_term: chromosome organization
          modifier: ABNORMAL
          term:
            id: GO:0051276
            label: chromosome organization
      selected_evidence:
        snippet: Epigenetic mechanisms, such as methylations of cytosines on the DNA string and methylations
          and acetylations of histone 3 lysines, regulate expression of these driver genes between the
          TGCT subtypes
        supports: SUPPORT
