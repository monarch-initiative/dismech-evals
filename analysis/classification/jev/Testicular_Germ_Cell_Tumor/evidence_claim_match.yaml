            id: CL:0000670
            label: primordial germ cell
        description: Isochromosome 12p [i(12p)] is the most consistent cytogenetic abnormality in TGCTs,
          present in more than 80% of cases. The remaining cases show 12p overrepresentation through other
          mechanisms. The short arm of chromosome 12 harbors genes including KRAS, CCND2 (cyclin D2),
          NANOG, and LDHB that drive tumor proliferation and maintain pluripotency.
        biological_processes:
        - preferred_term: cell population proliferation
          modifier: INCREASED
