        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cisplatin Resistance Mechanisms
        description: Approximately 15% of TGCT patients develop platinum-refractory disease. Resistance
          mechanisms include epigenetic rewiring (DNA hypermethylation, H3K27me3 dynamics), upregulation
          of DNA repair pathways (ERCC1/XPF), suppression of apoptotic signaling, and overactivation of
          the neddylation pathway promoting degradation of tumor suppressors. CRISPR screening has identified
          NAE1 overexpression as a resistance factor, and its inhibition by MLN4924 can resensitize resistant
          cells to cisplatin.
        biological_processes:
        - preferred_term: response to drug
          modifier: ABNORMAL
          term:
            id: GO:0009410
            label: response to xenobiotic stimulus
      selected_evidence:
        snippet: approximately 15% of the patients develop platinum-refractory disease and suffer multiple
          relapses
        supports: SUPPORT
