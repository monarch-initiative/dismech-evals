        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cisplatin Sensitivity and DNA Damage Response
        description: 'TGCTs are exquisitely sensitive to cisplatin-based chemotherapy due to several factors:
          limited DNA repair capacity, wild-type TP53 in most cases enabling robust apoptotic response,
          and high expression of pro-apoptotic factors (Bax, Noxa) with low expression of anti-apoptotic
          factors (Bcl-2). Both the death receptor (FAS/FASL) and mitochondrial apoptotic pathways become
          strongly activated following cisplatin treatment.'
        biological_processes:
        - preferred_term: apoptotic process
          modifier: INCREASED
          term:
            id: GO:0006915
            label: apoptotic process
        - preferred_term: nucleotide-excision repair
          modifier: DECREASED
          term:
            id: GO:0006289
            label: nucleotide-excision repair
      selected_evidence:
        snippet: metastatic testicular germ cell tumors (TGCT) are cured in over 80% of patients using
          cisplatin-based combination therapy. Published data suggest that TGCTs are sensitive to cisplatin
          due to limited DNA repair and presumably also to a propensity to undergo apoptosis
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37891379
      reference_title: Strong apoptotic response of testis tumor cells following cisplatin treatment.
      evidence_source: IN_VITRO
      explanation: Directly supports the dual mechanism of cisplatin sensitivity - limited DNA repair
        and strong apoptotic propensity in TGCTs.
