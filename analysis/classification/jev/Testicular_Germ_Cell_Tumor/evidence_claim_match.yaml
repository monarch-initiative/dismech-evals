      assertion_type: Subtype
      assertion:
        name: Seminoma
        description: Pure seminoma accounts for approximately 50-55% of TGCTs. It arises from undifferentiated
          germ cells, is characterized by sheets of uniform cells with clear cytoplasm and central nuclei,
          and frequently contains lymphocytic infiltrates. Seminomas are highly radiosensitive and chemosensitive
          with excellent prognosis. Seminoma expresses an iPSC panel with OCT4/POU5F1, SOX17, KLF4, and
          MYC.
        subtype_frequency: 50-55%
      selected_evidence:
        snippet: a seminoma subtype expresses an induced pluripotent stem cell (iPSC) panel with four
          upregulated genes, OCT4/POU5F1, SOX17, KLF4, and MYC
        supports: SUPPORT
