      assertion_type: Pathophysiology
      assertion:
        name: Epigenetic Regulation of Subtype Identity
        description: DNA methylation is a primary determinant of TGCT subtype identity. GCNIS and seminomas
          are characterized by global DNA hypomethylation resembling fetal gonocytes, while non-seminomas
          show progressive hypermethylation associated with differentiation. Embryonal carcinoma exhibits
          an ESC-like methylation pattern. This epigenetic divergence underlies the distinct biology and
          treatment responses of TGCT subtypes.
        biological_processes:
        - preferred_term: DNA methylation
          modifier: DYSREGULATED
          term:
            id: GO:0006304
            label: DNA modification
      selected_evidence:
        snippet: Epigenetic mechanisms, such as methylations of cytosines on the DNA string and methylations
          and acetylations of histone 3 lysines, regulate expression of these driver genes between the
          TGCT subtypes
        supports: SUPPORT
