        context: []
      assertion_type: Subtype
      assertion:
        name: Classic Seminoma
        display_name: Classic (Typical) Seminoma
        description: Classic seminoma is the prototypical and by far most common form, accounting for
          the great majority of pure seminomas. It arises from GCNIS, occurs predominantly in men aged
          15-44 with a peak around 35-39 years, and presents most often as clinical stage I disease. Histologically
          it shows sheets and nests of uniform polygonal cells with clear, glycogen-rich cytoplasm and
          central nuclei, separated by fibrous septa containing a characteristic lymphocytic infiltrate.
          It is GCNIS-derived, harbors i(12p), expresses the primordial-germ-cell/pluripotency program
          (OCT4, SOX17, NANOG, TFAP2C), and is highly radio- and chemosensitive.
        subtype_frequency: '>90% of pure seminomas'
      selected_evidence:
        snippet: Seminoma is the most common malignant solid tumor in 14 to 44 year-old men
        supports: SUPPORT
    origin:
