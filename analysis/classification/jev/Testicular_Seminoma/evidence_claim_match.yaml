  b9156c40940d56c5dba0fba269c45aa6c010ce4c3c5d0fcf26c86b503431e8b2:
    claim:
      about:
        disease:
          name: Testicular Seminoma
          disease_term:
            preferred_term: testicular seminoma
            term:
              id: MONDO:0003669
              label: testicular seminoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Immune-Infiltrated Microenvironment and HLA-Loss Immune Evasion
        description: Seminoma is characteristically heavily infiltrated by immune cells, with a shift
          from the macrophage-dominated normal testis toward a T-cell-, B-cell-, and dendritic-cell-rich
          microenvironment. CD4+ T cells predominate over CD8+ cells, and regulatory T (Treg) and follicular
          helper T (Tfh) cells are most abundant in seminoma. Single-cell/spatial studies localize immune
          subtypes with exhaustion features adjacent to the tumor. Whole-genome sequencing identifies
          human leukocyte antigen (HLA) loss as a seminoma-enriched mechanism of immune disruption, providing
          a route to immune evasion despite robust infiltration.
        cell_types:
        - preferred_term: CD4-positive T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
        - preferred_term: regulatory T cell
          term:
            id: CL:0000815
            label: regulatory T cell
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: T cell activation
          modifier: INCREASED
          term:
            id: GO:0042110
            label: T cell activation
        - preferred_term: antigen presentation via MHC class I
          modifier: DECREASED
          term:
            id: GO:0002474
            label: antigen processing and presentation of peptide antigen via MHC class I
      selected_evidence:
        snippet: In most samples (96%), the CD4+ T cell frequency exceeded that of CD8+ cells, with decreasing
          numbers from central to peripheral tumor areas, and to tumor-free, contralateral testes. T cells
          including Treg and Tfh were most abundant in seminoma compared to mixed tumors and embryonal
          carcinoma
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1038/s41416-024-02669-9
      reference_title: 'T cells in testicular germ cell tumors: new evidence of fundamental contributions
        by rare subsets'
      evidence_source: HUMAN_CLINICAL
      explanation: Documents the CD4-predominant infiltrate and seminoma enrichment of Treg/Tfh subsets.
