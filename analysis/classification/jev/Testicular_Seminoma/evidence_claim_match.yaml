          ERCC1-XPF that impairs repair of cisplatin interstrand crosslinks - combined with a strong propensity
          to undergo apoptosis. Because TGCTs including seminoma almost universally retain wild-type TP53,
          DNA-damaging therapy drives a robust p53-controlled apoptotic response through both the intrinsic
          mitochondrial pathway (high endogenous Bax and Noxa with low Bcl-2, Bax translocation to the
          mitochondrial membrane and cytochrome c release) and the extrinsic Fas/FasL death-receptor pathway,
          so that DNA-damaging therapy efficiently triggers tumor cell death. This underlies cure rates
          approaching 99% in early-stage and over 80% in advanced disease.
