  19393e8c5b2ef287f25b916a2e8bcb20676b528c8e518b75a94671f7fedebdbb:
    claim:
      about:
        disease:
          name: Testicular Seminoma
          disease_term:
            preferred_term: testicular seminoma
            term:
              id: MONDO:0003669
              label: testicular seminoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Isochromosome 12p and Copy-Number-Driven Genome
        description: Seminoma genomes are dominated by chromosomal copy-number change rather than recurrent
          somatic point mutations. Gain of the short arm of chromosome 12 - most often as isochromosome
          12p [i(12p)] - is the hallmark cytogenetic event, and whole-genome sequencing of adult TGCTs
          identifies recurrent arm-level gains spanning KRAS on 12p. The 12p region harbors KRAS, CCND2,
          and NANOG, supporting pluripotency and proliferation.
        biological_processes:
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
        - preferred_term: chromosome organization
          modifier: ABNORMAL
          term:
            id: GO:0051276
            label: chromosome organization
      selected_evidence:
        snippet: KRAS copy number gain was a very frequent event (80.4%) in TGCT and presented a worse
          prognosis compared with the group with no KRAS copy gain (10y-OS, 90% vs. 81.5%, p = 0.048)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.3389/fonc.2023.1133363
      reference_title: Somatic mutation detection and KRAS amplification in testicular germ cell tumors
      evidence_source: HUMAN_CLINICAL
      explanation: Demonstrates the high frequency and prognostic relevance of KRAS (12p) copy-number
        gain in TGCT, consistent with i(12p) biology.
