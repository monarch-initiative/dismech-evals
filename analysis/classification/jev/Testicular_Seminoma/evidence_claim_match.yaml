            term:
              id: MONDO:0003669
              label: testicular seminoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Germ Cell Neoplasia In Situ (GCNIS)
        description: Classic seminoma arises from germ cell neoplasia in situ (GCNIS), a preinvasive lesion
          composed of transformed fetal gonocytes/primordial germ cells that failed to mature and remained
          dormant within the seminiferous tubules until pubertal hormonal stimulation. Unlike most cancers,
          TGCTs including seminoma are rarely driven by somatic point mutations; instead they reflect
          a failure to control the latent developmental potential of their fetal germ-cell-of-origin,
          with reprogramming toward a malignant primordial germ cell-like state.
        cell_types:
        - preferred_term: primordial germ cell
          term:
            id: CL:0000670
            label: primordial germ cell
        biological_processes:
        - preferred_term: germ cell development
          modifier: ABNORMAL
          term:
            id: GO:0007281
            label: germ cell development
        locations:
        - preferred_term: seminiferous tubule
          term:
            id: UBERON:0001343
            label: seminiferous tubule of testis
      selected_evidence:
        snippet: our findings provide valuable insights into the developmental and immune modulatory processes
          implicated in TGCT pathogenesis and progression
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1038/s41467-024-53193-6
      reference_title: Genomic landscape of adult testicular germ cell tumours in the 100,000 Genomes
