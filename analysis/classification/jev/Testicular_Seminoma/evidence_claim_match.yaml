              label: testicular seminoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: KIT and RAS-MAPK Signaling Activation
        description: Activating alterations of KIT and KRAS are the principal recurrent driver events
          in seminoma. WGS of adult TGCTs identified focal KIT amplification in approximately 19% of cases,
          and KIT mutations are enriched in seminoma relative to non-seminoma. KIT (a receptor tyrosine
          kinase) and amplified/mutated KRAS activate the RAS-RAF-MEK-ERK (MAPK) cascade, driving germ
          cell survival and proliferation.
        gene_products:
        - preferred_term: KIT receptor tyrosine kinase
          term:
            id: NCIT:C17328
            label: Mast/Stem Cell Growth Factor Receptor Kit
        biological_processes:
        - preferred_term: MAPK cascade
          modifier: INCREASED
          term:
            id: GO:0000165
            label: MAPK cascade
      selected_evidence:
        snippet: Variants were also detected in genes such as KIT, KRAS, PDGFRA, EGFR, BRAF, RET, NRAS,
          PIK3CA, MET, and ERBB2, with some of them potentially targetable
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
