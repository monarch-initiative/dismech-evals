      assertion_type: Pathophysiology
      assertion:
        name: Wnt/Beta-Catenin Pathway Activation
        description: Recurrent activating (exon 3) mutations in CTNNB1 stabilize beta-catenin, leading
          to constitutive canonical Wnt signaling and nuclear beta-catenin accumulation in a subset of
          testicular Sertoli cell and Leydig cell tumors.
        genes:
        - preferred_term: CTNNB1
          description: The gene whose exon 3 activating mutation stabilizes beta-catenin in this node.
          term:
            id: hgnc:2514
            label: CTNNB1
        molecular_functions:
        - preferred_term: beta-catenin transcription coactivator activity
          modifier: GAIN_OF_FUNCTION
          description: Exon 3 mutations remove the sites through which the destruction complex targets
            beta-catenin for degradation, so the stabilized protein enters the nucleus and co-activates
            TCF/LEF target genes such as cyclin D1 without an upstream Wnt signal. The qualitative modifier
            records that the activity has escaped regulation, not merely risen.
          term:
            id: GO:0003713
            label: transcription coactivator activity
        cell_types:
        - preferred_term: Sertoli cell
          term:
            id: CL:0000216
            label: Sertoli cell
        biological_processes:
        - preferred_term: canonical Wnt signaling pathway
          modifier: INCREASED
          term:
            id: GO:0060070
            label: canonical Wnt signaling pathway
      selected_evidence:
        snippet: β-catenin mutation in SCT results in nuclear β-catenin and cyclin-D1 expressions on immunohistochemical
          analysis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
