        description: In a genetically engineered mouse model, sustained Sertoli cell-specific activation
          of the TGF-beta receptor TGFBR1 is sufficient to reprogram Sertoli cells toward a granulosa-like
          fate and to drive testicular granulosa cell tumor formation. This provides a mechanistic link
          between TGF-beta signaling dysregulation and the granulosa-cell phenotype of a subset of testicular
          sex cord-stromal tumors.
        cell_types:
        - preferred_term: Sertoli cell
          term:
            id: CL:0000216
            label: Sertoli cell
        - preferred_term: granulosa cell
          term:
            id: CL:0000501
            label: granulosa cell
        biological_processes:
        - preferred_term: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
      selected_evidence:
        snippet: overactivation of TGFBR1 in Sertoli cells would promote their transdifferentiation into
          granulosa-like cells and the formation of TGCTs.
        supports: SUPPORT
