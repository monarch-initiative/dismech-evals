  c430e71f1e5be3666b52af377d7c6ec26684668a88e4266daffc7539a5705ab6:
    claim:
      about:
        disease:
          name: Testicular Sex Cord-Stromal Neoplasm
          disease_term:
            preferred_term: testicular sex cord-stromal neoplasm
            term:
              id: MONDO:0003125
              label: testicular sex cord-stromal neoplasm
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: cAMP/PKA Pathway Activation
        description: Activating GNAS mutations (constitutive Gs-alpha) and loss of the PKA regulatory
          subunit PRKAR1A (in Carney complex) both increase protein kinase A signaling, driving proliferation
          and steroidogenesis in Leydig and Sertoli cell tumors. PRKAR1A inactivation underlies large-cell
          calcifying Sertoli cell tumors in Carney complex.
        notes: GNAS and PRKAR1A reach this node by different lesions, a gained Gs-alpha activity upstream
          of cAMP and a lost PKA regulatory subunit downstream of it, and the one molecular function true
          of both is the resulting catalytic activity of protein kinase A, which is what is bound. The
          Sertoli cell is included beside the Leydig cell because the PRKAR1A evidence on this node is
          from large-cell calcifying Sertoli cell tumors.
        genes:
        - preferred_term: GNAS
          description: Somatic activating (gsp, e.g. R201C) mutation in Leydig cell tumors, producing
            a constitutively active Gs-alpha subunit.
          term:
            id: hgnc:4392
            label: GNAS
        - preferred_term: PRKAR1A
          description: Germline (Carney complex) or somatic inactivation of the PKA type I-alpha regulatory
            subunit in large-cell calcifying Sertoli cell tumors.
          term:
            id: hgnc:9388
            label: PRKAR1A
        molecular_functions:
        - preferred_term: protein kinase A catalytic activity
          modifier: INCREASED
          description: 'Both lesions converge on unrestrained PKA catalytic activity: more cAMP from constitutive
            Gs-alpha, or less inhibition of the catalytic subunit when the regulatory subunit is lost.'
          term:
            id: GO:0004691
            label: cAMP-dependent protein kinase activity
        cell_types:
        - preferred_term: Leydig cell
          term:
            id: CL:0000178
            label: Leydig cell
        - preferred_term: Sertoli cell
          term:
            id: CL:0000216
            label: Sertoli cell
        biological_processes:
        - preferred_term: cAMP/PKA signal transduction
          modifier: INCREASED
          term:
            id: GO:0141156
            label: cAMP/PKA signal transduction
      selected_evidence:
        snippet: PRKAR1A alterations were present in all cases and appear to be the major driver in LCCSCTs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38154678
      reference_title: 'Molecular characterization of large cell calcifying sertoli cell tumors: A multi-institutional
        study of 6 benign and 2 malignant tumors.'
      evidence_source: HUMAN_CLINICAL
      explanation: Targeted sequencing of large-cell calcifying Sertoli cell tumors identified PRKAR1A
        alterations as the major molecular driver, supporting dysregulated cAMP/PKA signaling as the central
        mechanism in this Sertoli cell tumor variant.
