                id: MONDO:0003395
                label: testicular granulosa cell tumor
            genes:
            - preferred_term: FOXL2
              term:
                id: hgnc:1092
                label: FOXL2
            description: Granulosa cell tumors of the testis recapitulate ovarian granulosa cell tumors.
              The juvenile type is the most common congenital testicular tumor and is virtually always
              benign. The adult type is rare and can behave aggressively. Adult-type tumors may carry
              a FOXL2 mutation (e.g., C134W) as seen in ovarian counterparts.
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: FOXL2 C134W Neomorphic Transcription Factor Activity
        biological_scale: MOLECULAR
        subtypes:
        - Granulosa Cell Tumor
        description: The recurrent somatic FOXL2 c.402C>G (p.C134W) variant of adult-type granulosa cell
          tumors, found also in the rare testicular adult granulosa cell tumor, changes what the FOXL2
          transcription factor does rather than removing it. The mutant protein gains the ability to bind
          SMAD4 and, with SMAD2/3, occupies a hybrid DNA motif that wild-type FOXL2 does not bind, switching
