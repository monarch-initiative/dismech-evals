      assertion_type: Subtype
      assertion:
        name: Malignant Sex Cord-Stromal Tumor
        display_name: Malignant Sex Cord-Stromal Tumor
        description: A minority (approximately 10%) of testicular sex cord-stromal tumors are malignant,
          most often malignant Leydig or Sertoli cell tumors. Malignancy is suggested by large size (>5
          cm), infiltrative margins, vascular invasion, necrosis, cytologic atypia, and increased mitotic
          activity. Malignant SCSTs metastasize to retroperitoneal lymph nodes, lung, liver, and bone,
          and respond poorly to chemotherapy and radiotherapy.
      selected_evidence:
        snippet: Sex cord stromal cell tumours (SCSCT) are a rare subset of testicular tumours, the majority
          of which are benign but a small proportion can be malignant.
        supports: SUPPORT
