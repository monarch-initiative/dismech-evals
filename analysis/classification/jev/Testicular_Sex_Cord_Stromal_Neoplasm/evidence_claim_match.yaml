  7f5e5ac8e5ac5af05fee531d2ce8e2038a103bdd1c1aabe2257c3923acce7d68:
    claim:
      about:
        disease:
          name: Testicular Sex Cord-Stromal Neoplasm
          disease_term:
            preferred_term: testicular sex cord-stromal neoplasm
            term:
              id: MONDO:0003125
              label: testicular sex cord-stromal neoplasm
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Estrogen-Mediated Clinical Manifestations
        description: Tumor-derived estrogen excess produces gynecomastia and can suppress the hypothalamic-pituitary-gonadal
          axis, reducing spermatogenesis and fertility.
        biological_processes:
        - preferred_term: estrogen receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0030520
            label: estrogen receptor signaling pathway
        notes: 'No estrogen receptor gene is bound on this node. It is ligand excess from the tumor acting
          on structurally normal receptors in two remote target tissues, the breast and the hypothalamic-pituitary
          axis, and the node carries no cell type that would fix which receptor is meant. None of the
          sources cited in this entry names a receptor. PubMed searches run for this decision: Leydig
          cell tumor with gynecomastia and estrogen receptor in the title or abstract returned nothing;
          sex cord-stromal with testis and estrogen receptor returned one record (PMID:21974818), which
          reports GPER expression in tumor and normal testis and states that testicular estrogen signaling
          runs through estrogen receptor beta isoforms, measuring the tumor tissue rather than the tissues
          where this node''s manifestations arise; Sertoli cell tumor with estrogen receptor returned
          five, of which the one human testis report (PMID:16944977) describes aromatase and estrogen
          receptor expression within a large-cell calcifying Sertoli cell tumor as a mechanism of tumor
          development, again the tumor rather than the target tissue; and gynecomastia in the title with
          estrogen receptor alpha or ESR1 returned two, of which PMID:21597315 found estrogen receptor
          beta expressed above alpha in stromal cells of pubertal gynecomastia tissue and both barely
          detectable in epithelial cells, so even the breast arm of this node does not reduce to ESR1.
          Records for Leydig cell tumor with gynecomastia and estradiol are case reports of estradiol-producing
          tumors; the abstracts of those cited as evidence here report estradiol excess, gynecomastia
          and low gonadotropins but name no receptor. The INCREASED modifier on the pathway term carries
          the ligand-excess consequence.'
      selected_evidence:
        snippet: Endocrine function tests showed decreased gonadotropin concentrations, and reduction
          of testosterone/estradiol ratio.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16671273
      reference_title: '[An uncommon cause of gynecomastia: testicular Leydig cell tumor. Hormonal profile
        before and after orchiectomy].'
      evidence_source: HUMAN_CLINICAL
      explanation: A man with bilateral gynecomastia and a Leydig cell tumor had a lowered testosterone-to-estradiol
        ratio with suppressed gonadotropins.
