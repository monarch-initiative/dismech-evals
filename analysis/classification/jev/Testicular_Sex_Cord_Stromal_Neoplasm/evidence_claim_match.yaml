      assertion_type: Pathophysiology
      assertion:
        name: LKB1 Loss in Sertoli Cells
        biological_scale: MOLECULAR
        subtypes:
        - Large-Cell Calcifying Sertoli Cell Tumor
        description: In boys with Peutz-Jeghers syndrome, the germline STK11 mutation is joined by loss
          of the second allele in Sertoli cells of the abnormal testicular cords, so those cells lack
          the LKB1 serine/threonine kinase. Loss of LKB1 reduces phosphorylation of its target AMPK, and
          AMPK no longer holds the CRTC transcriptional coactivators out of the nucleus.
        genes:
        - preferred_term: STK11
          description: Germline heterozygous in Peutz-Jeghers syndrome, with loss of heterozygosity in
            the affected Sertoli cells.
          term:
            id: hgnc:11389
            label: STK11
        molecular_functions:
        - preferred_term: LKB1 serine/threonine kinase activity
          modifier: LOSS_OF_FUNCTION
          description: LKB1 protein is absent from the affected Sertoli cells after loss of the second
            allele, so its kinase activity toward AMPK is lost rather than reduced.
          term:
            id: GO:0004674
            label: protein serine/threonine kinase activity
        cell_types:
        - preferred_term: Sertoli cell
          term:
            id: CL:0000216
            label: Sertoli cell
      selected_evidence:
        snippet: Loss of heterozygosity of STK11, measured by the absence of LKB1 immunofluorescence,
          was observed in Sertoli cells of abnormal cords of testis samples from affected individuals.
        supports: SUPPORT
