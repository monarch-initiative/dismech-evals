              id: MONDO:0005526
              label: tetanus
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Tetanus Toxin (Tetanospasmin) Action
        description: 'Clostridium tetani produces tetanospasmin, a potent neurotoxin that is transported
          retrogradely along motor neurons to the spinal cord. The toxin blocks the release of inhibitory
          neurotransmitters (GABA and glycine) from presynaptic terminals in the spinal cord, leading
          to unopposed muscle contraction and characteristic spasms.

          '
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: synaptic transmission, GABAergic
          term:
            id: GO:0051932
            label: synaptic transmission, GABAergic
        - preferred_term: synaptic transmission, glycinergic
          term:
            id: GO:0060012
            label: synaptic transmission, glycinergic
        - preferred_term: negative regulation of neurotransmitter secretion
          term:
            id: GO:0046929
            label: negative regulation of neurotransmitter secretion
      selected_evidence:
        snippet: Tetanus and botulinum neurotoxins cause the neuroparalytic syndromes of tetanus and botulism,
          respectively, by delivering inside different types of neurons, metalloproteases specifically
          cleaving the SNARE proteins that are essential for the release of neurotransmitters.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35333944
      reference_title: 'Toxicology and pharmacology of botulinum and tetanus neurotoxins: an update.'
      explanation: This review confirms the mechanism of tetanus toxin action through metalloprotease
        cleavage of SNARE proteins, blocking neurotransmitter release.
