        description: 'Flaccid descending paralysis from botulinum toxin can mimic early bulbar involvement
          but lacks the painful spasms and rigidity seen in tetanus.

          '
        distinguishing_features:
        - Botulism causes flaccid paralysis and cranial nerve palsies, whereas tetanus causes spasticity
          with intact sensation.
        - Botulism often follows ingestion or wound contamination with progressive weakness; tetanus presents
          with stimulus-induced spasms.
      selected_evidence:
        snippet: Tetanus and botulinum neurotoxins cause the neuroparalytic syndromes of tetanus and botulism,
          respectively, by delivering inside different types of neurons, metalloproteases specifically
          cleaving the SNARE proteins that are essential for the release of neurotransmitters.
        supports: SUPPORT
