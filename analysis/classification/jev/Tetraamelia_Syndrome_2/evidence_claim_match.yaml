            term:
              id: MONDO:0060732
              label: tetraamelia syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Apical Ectodermal Ridge Maintenance
        description: Rspo2 is expressed in the apical ectodermal ridge (AER) of all limb buds. In Rspo2-null
          mice the AER is induced normally, but expression of AER markers (Fgf8, Fgf4) and of beta-catenin
          targets within the AER is not maintained, and Shh signalling in the limb is reduced. Without
          a maintained AER the limb bud cannot grow out; in mice the defect is most severe distally and
          in the hindlimb, whereas human null alleles abolish all four limbs.
        biological_scale: TISSUE
        locations:
        - preferred_term: apical ectodermal ridge
          term:
            id: UBERON:0004356
            label: apical ectodermal ridge
        - preferred_term: limb bud
          term:
            id: UBERON:0004347
            label: limb bud
        biological_processes:
        - preferred_term: embryonic limb morphogenesis
          term:
            id: GO:0030326
            label: embryonic limb morphogenesis
          modifier: DECREASED
      selected_evidence:
        snippet: Although the initiation of the expression of apical ectodermal ridge (AER)-specific genes,
          including fibroblast growth factor 8 (FGF8) and FGF4 occurred normally, the maintenance of these
          marker expressions was significantly defective in the hindlimb of Rspo2(-/-) mice.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17904116
      reference_title: Mouse R-spondin2 is required for apical ectodermal ridge maintenance in the hindlimb.
      evidence_source: MODEL_ORGANISM
      explanation: Shows the AER forms but is not maintained without Rspo2.
