              label: tetraamelia syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Unopposed RNF43 and ZNRF3 Activity with Reduced WNT Potentiation
        description: 'RSPO2 acts as a direct antagonistic ligand of the transmembrane E3 ligases RNF43
          and ZNRF3. Without it, these ligases remain active and WNT/beta-catenin signalling in responsive
          tissues is not amplified. The limb-relevant activity does not require the LGR4/5/6 receptors:
          a ubiquitous triple Lgr4/5/6 knockout mouse does not reproduce the Rspo2 loss-of-function phenotype,
          whereas concurrent loss of rnf43 and znrf3 in Xenopus produces supernumerary limbs, the mirror
          image of amelia.'
        biological_scale: CELLULAR
        genes:
        - preferred_term: RNF43
          term:
            id: hgnc:18505
            label: RNF43
        - preferred_term: ZNRF3
          term:
            id: hgnc:18126
            label: ZNRF3
        biological_processes:
        - preferred_term: canonical Wnt signaling pathway
          term:
            id: GO:0060070
            label: canonical Wnt signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Our results establish that RSPO2, without the LGR4/5/6 receptors, serves as a direct
          antagonistic ligand to RNF43 and ZNRF3, which together constitute a master switch that governs
          limb specification.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29769720
      reference_title: RSPO2 inhibition of RNF43 and ZNRF3 governs limb development independently of LGR4/5/6.
      evidence_source: MODEL_ORGANISM
      explanation: Identifies RNF43/ZNRF3 antagonism, not LGR4/5/6 signalling, as the RSPO2 activity that
        controls limb specification.
