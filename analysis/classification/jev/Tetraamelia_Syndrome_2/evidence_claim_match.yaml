              of the developing lung. Hypomorphic Rspo2 mice have hypoplastic lungs with reduced branching
              and reduced WNT reporter activity, and further loss of WNT co-receptor function (Lrp6) makes
              the hypoplasia more severe. In humans with RSPO2 null alleles the lungs fail to form.
            biological_scale: TISSUE
