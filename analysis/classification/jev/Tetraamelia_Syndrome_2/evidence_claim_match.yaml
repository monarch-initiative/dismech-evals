            id: UBERON:0002048
            label: lung
        biological_processes:
        - preferred_term: epithelial tube branching involved in lung morphogenesis
          term:
            id: GO:0060441
            label: epithelial tube branching involved in lung morphogenesis
          modifier: DECREASED
      selected_evidence:
        snippet: Rspo2(Tg/Tg) lung defects were associated with reduced branching, a reduction in TOPGAL
          reporter activity, and reduced expression of the downstream Wnt target Irx3.
        supports: SUPPORT
