      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_bh4_cofactor_deficiency_model
        hypothesis_label: Canonical BH4 Cofactor Deficiency and Dual Hydroxylase Failure Model
        status: CANONICAL
        description: Loss-of-function variants in BH4 biosynthesis (GCH1, PTS, SPR) or regeneration (QDPR,
          PCBD1) genes deplete the tetrahydrobiopterin cofactor shared by phenylalanine hydroxylase, tyrosine
          hydroxylase, and tryptophan hydroxylase. The resulting dual failure produces hyperphenylalaninemia
          (from impaired PAH) AND monoamine neurotransmitter deficiency (low dopamine, norepinephrine,
          and serotonin from impaired TH/TPH), generating a neurological disease that is characteristically
          unresponsive to phenylalanine restriction alone, distinguishing it from PAH-deficiency PKU.
          Treatment therefore combines BH4/sapropterin cofactor replacement with neurotransmitter precursor
          supplementation (L-dopa/carbidopa, 5-hydroxytryptophan).
      selected_evidence:
        snippet: Tetrahydrobiopterin (BH4) deficiencies comprise a group of six rare neurometabolic disorders
          characterized by insufficient synthesis of the monoamine neurotransmitters dopamine and serotonin
          due to a disturbance of BH4 biosynthesis or recycling.
        supports: SUPPORT
