        description: 'The step that makes thanatophoric dysplasia lethal, and the one part of the chain
          that is TD-specific rather than shared with the viable members of the FGFR3 allelic series.
          Severely shortened ribs and a narrow thorax restrict fetal lung growth and neonatal chest-wall
          excursion; respiratory insufficiency is the immediate cause of death in the great majority of
          affected infants. Survival beyond the perinatal period has been reported only with long-term
          tracheostomy and ventilation. This node is deliberately not anchored on the FGFR module: achondroplasia
          and hypochondroplasia share every upstream node and do not reach this one.'
