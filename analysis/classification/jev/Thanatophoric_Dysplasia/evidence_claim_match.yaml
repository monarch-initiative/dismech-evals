    claim:
      about:
        disease:
          name: Thanatophoric Dysplasia
          disease_term:
            preferred_term: thanatophoric dysplasia
            term:
              id: MONDO:0017042
              label: thanatophoric dysplasia
        context: []
      assertion_type: Genetic
      assertion:
        name: FGFR3
        gene_term:
          preferred_term: FGFR3
          term:
            id: hgnc:3690
            label: FGFR3
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        presence: Heterozygous activating variant in essentially all cases
        association: 'Heterozygous gain-of-function FGFR3 variants cause both TD subtypes. The subtypes
          are separated by which functional domain the change lies in: extracellular and juxtamembrane
          cysteine-creating changes plus the exon-18 stop-codon extensions in TD1, and the single recurrent
          kinase-domain K650E change in TD2. Per-allele detail is curated in the subtype entries.'
        notes: ClinGen has no Gene-Disease Validity assertion for FGFR3-thanatophoric dysplasia in the
          locally cached ClinGen set (checked 2026-08), although the Skeletal Disorders GCEP has curated
          FGFR3 as Definitive for achondroplasia and for hypochondroplasia and Moderate for SADDAN. MONDO
          nonetheless records FGFR3 as the causal gene for MONDO:0017042 via RO:0004003, and credits ClinGen
          for the exact synonym "FGFR3-related thanatophoric dysplasia".
      selected_evidence:
        snippet: A sporadic mutation causing a Lys650Glu change in the tyrosine kinase domain of FGFR3
          was found in 16 of 16 individuals with one type of TD. Of 39 individuals with a second type
          of TD, 22 had a mutation causing an Arg248Cys change and one had a Ser371Cys substitution, both
          in the extracellular region of the protein.
        supports: SUPPORT
