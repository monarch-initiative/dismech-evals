            label: achondroplasia
        distinguishing_features:
        - Two affected parents and biallelic G380R on molecular testing, versus unaffected parents and
          a single strongly activating de novo FGFR3 allele in TD. See `Achondroplasia.yaml`.
      selected_evidence:
        snippet: Homozygous achondroplasia resembles the phenotype of TD.
