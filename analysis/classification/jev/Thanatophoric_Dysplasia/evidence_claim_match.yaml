            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: TD is an autosomal dominant condition. Almost all probands reported to date represent
          simplex cases and have the condition as the result of a de novo FGFR3 pathogenic variant.
        supports: SUPPORT
