          disease_term:
            preferred_term: thanatophoric dysplasia
            term:
              id: MONDO:0017042
              label: thanatophoric dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Thoracic Insufficiency and Pulmonary Hypoplasia
        biological_scale: ORGANISM
        role: consequence
        description: 'The step that makes thanatophoric dysplasia lethal, and the one part of the chain
          that is TD-specific rather than shared with the viable members of the FGFR3 allelic series.
          Severely shortened ribs and a narrow thorax restrict fetal lung growth and neonatal chest-wall
          excursion; respiratory insufficiency is the immediate cause of death in the great majority of
          affected infants. Survival beyond the perinatal period has been reported only with long-term
          tracheostomy and ventilation. This node is deliberately not anchored on the FGFR module: achondroplasia
          and hypochondroplasia share every upstream node and do not reach this one.'
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
        biological_processes:
        - preferred_term: lung development
          term:
            id: GO:0030324
            label: lung development
          modifier: DECREASED
        - preferred_term: respiratory gaseous exchange
          term:
            id: GO:0007585
            label: respiratory gaseous exchange by respiratory system
          modifier: DECREASED
      selected_evidence:
        snippet: In the lungs, pseudoglandular growth predominated, transitioning partially to an early
          canalicular phase, and incomplete development was noted in bronchi, with primary and a few secondary
          bronchi visible, covered with pseudostratified columnar ciliated epithelium, with scattered
          goblet cells
        supports: SUPPORT
