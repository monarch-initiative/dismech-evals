            description: Because most affected infants die in the perinatal period from multisystem complications,
              management goals are set with the family and commonly focus on comfort care. Infants who
              are to be supported require long-term respiratory support, typically tracheostomy and ventilation.
              Anaesthetic guidelines for skeletal dysplasias apply. Other measures in long-term survivors
              include shunting for hydrocephalus, suboccipital decompression for craniocervical-junction
              constriction, anti-seizure medication and hearing aids.
