      assertion_type: Diagnosis
      assertion:
        name: Molecular confirmation of FGFR3 variant
        description: 'Molecular testing confirms the clinical and radiological diagnosis, distinguishes
          TD from the other lethal chondrodysplasias, and assigns the subtype. A single multiplexed PCR
          plus single-nucleotide-extension assay covers 14 recurrent FGFR3 changes accounting for 99%
          of TD1 and TD2 together — including the technically awkward adjacent stop-codon changes in exon
          18 — so one reaction serves both subtypes with a shorter turnaround than Sanger or next-generation
          sequencing. This shared single-assay diagnostic pathway is a root-level property of TD: it is
          defined over the union of the subtypes, not over either one.'
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: We developed a single multiplexed PCR and a single-nucleotide extension (SNE) assay to
          identify 14 common mutations causing 99% of TD I and TD II, including the challenging three
          adjacent mutations in the stop codon of exon 18 of the FGFR3 gene.
        supports: SUPPORT
    origin:
