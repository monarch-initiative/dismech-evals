    claim:
      about:
        disease:
          name: Thanatophoric Dysplasia Type 1
          disease_term:
            preferred_term: thanatophoric dysplasia type 1
            term:
              id: MONDO:0008546
              label: thanatophoric dysplasia type 1
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mouse
        genotype: Fgfr3 K644E knock-in (Fgfr3-TD)
        description: 'Knock-in mouse carrying the Lys644Glu substitution (equivalent to human K650E, a
          TD2-associated kinase domain mutation). Used here because downstream FGFR3 gain-of-function
          signaling is conserved across TD1 and TD2 alleles. Heterozygous mice show mild bone dysplasia;
          homozygous mice exhibit severe dwarfism with macrocephaly, shortened long bones, dramatically
          reduced growth plate proliferation, and expanded resting zone. STAT1/5 activation and upregulation
          of p16/p18/p19 ink4 cell cycle inhibitors were demonstrated.

          '
        genes:
        - preferred_term: FGFR3
          term:
            id: hgnc:3690
            label: FGFR3
      selected_evidence:
        snippet: the Lys644Glu mutation resulted in retarded endochondral bone growth with severity directly
          linked to the expression level of the mutated Fgfr3.
        supports: SUPPORT
