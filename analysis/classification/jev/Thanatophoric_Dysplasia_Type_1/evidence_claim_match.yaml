  e9d84273257d12b25482e0846f0486253ccec5e32d1a6dec60d00f1791706db9:
    claim:
      about:
        disease:
          name: Thanatophoric Dysplasia Type 1
          disease_term:
            preferred_term: thanatophoric dysplasia type 1
            term:
              id: MONDO:0008546
              label: thanatophoric dysplasia type 1
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant (de novo)
        description: 'Virtually all cases arise from de novo heterozygous gain-of-function mutations in
          FGFR3. Penetrance is complete in the sense that no unaffected heterozygous carriers have been
          described: TD is ascertained as a perinatally lethal phenotype, so carriers are by construction
          affected and the value cannot be estimated from an unselected carrier series. Sib recurrence
          risk is not appreciably raised above the population rate; germline mosaicism in healthy parents
          remains a theoretical possibility but has not been reported.

          '
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: COMPLETE
      selected_evidence:
        snippet: A sporadic mutation causing a Lys650Glu change in the tyrosine kinase domain of FGFR3
          was found in 16 of 16 individuals with one type of TD. Of 39 individuals with a second type
          of TD, 22 had a mutation causing an Arg248Cys change and one had a Ser371Cys substitution, both
          in the extracellular region of the protein.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:7773297
      reference_title: Thanatophoric dysplasia (types I and II) caused by distinct mutations in fibroblast
        growth factor receptor 3.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that the TD-causing FGFR3 variants are heterozygous and sporadic, supporting
        the de novo autosomal dominant mode. The mutation detection counts do not address penetrance,
        which is recorded on the basis of the GeneReviews statements below.
