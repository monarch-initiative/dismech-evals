              label: thanatophoric dysplasia type 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FGFR3 constitutive activation via cysteine mutations
        conforms_to: fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation
        description: 'TD1 mutations (R248C, Y373C, S249C, G370C) create unpaired cysteine residues in
          the extracellular or juxtamembrane domains of FGFR3, enabling ligand-independent receptor dimerization
          through aberrant disulfide bonds. This results in severe constitutive activation of receptor
          tyrosine kinase signaling. The degree of constitutive FGFR3 activation correlates with phenotypic
          severity across the allelic series (hypochondroplasia < achondroplasia < thanatophoric dysplasia).

          '
        gene:
          preferred_term: FGFR3
          description: Fibroblast growth factor receptor 3 with severe gain-of-function mutations causing
            ligand-independent receptor activation.
          modifier: INCREASED
          term:
            id: hgnc:3690
            label: FGFR3
        cell_types:
        - preferred_term: Growth plate chondrocyte
          term:
            id: CL:1000217
            label: growth plate cartilage chondrocyte
        molecular_functions:
        - preferred_term: fibroblast growth factor receptor activity
          term:
            id: GO:0005007
            label: fibroblast growth factor receptor activity
          modifier: INCREASED
        biological_processes:
        - preferred_term: FGFR signaling pathway
          term:
            id: GO:0008543
            label: fibroblast growth factor receptor signaling pathway
          modifier: INCREASED
        - preferred_term: Protein phosphorylation
          term:
            id: GO:0006468
            label: protein phosphorylation
          modifier: INCREASED
      selected_evidence:
        snippet: Two novel missense mutations (Y373C and G370C) were detected in 8/26 and 1/26 TD1 cases
          respectively. Both mutations created cysteine residues in the juxta extramembrane domain of
          the receptor.
        supports: SUPPORT
