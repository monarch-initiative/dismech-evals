          iPSCs. The chondrogenic differentiation of TD1 iPSCs and ACH iPSCs resulted in the formation
          of degraded cartilage. We found that statins could correct the degraded cartilage in both chondrogenically
          differentiated TD1 and ACH iPSCs.
        supports: SUPPORT
