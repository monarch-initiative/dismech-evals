      assertion_type: Pathophysiology
      assertion:
        name: Disrupted endochondral ossification via Sox9/beta-catenin dysregulation
        conforms_to: fgfr_gain_of_function_skeletal_dysplasia#Impaired Endochondral Ossification and Chondrodysplasia
        description: 'The FGFR3 K650E mutation disrupts endochondral ossification by stabilizing Sox9
          and promoting beta-catenin degradation in growth plate chondrocytes. This creates a block at
          the prehypertrophic stage, severely reducing the hypertrophic chondrocytes that produce VEGF,
          which in turn impairs vascularization of primary ossification centers. Since both Sox9 overexpression
          and beta-catenin deletion independently block hypertrophic differentiation, the simultaneous
          dysregulation of both constitutes a critical mechanism underlying the skeletal phenotype.

          '
        cell_types:
        - preferred_term: Growth plate chondrocyte
          term:
            id: CL:1000217
            label: growth plate cartilage chondrocyte
        biological_processes:
        - preferred_term: Endochondral ossification
          term:
            id: GO:0001958
            label: endochondral ossification
          modifier: DECREASED
      selected_evidence:
        snippet: the differentiation block and defects in joint formation are associated with persistent
          expression of the chondrogenic factor Sox9 and down-regulation of β-catenin levels and activity
          in growth plate chondrocytes
        supports: SUPPORT
    origin:
