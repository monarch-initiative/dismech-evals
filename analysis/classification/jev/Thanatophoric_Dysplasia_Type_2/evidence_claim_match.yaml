      assertion_type: Pathophysiology
      assertion:
        name: Sustained ERK/MAPK pathway activation
        conforms_to: fgfr_gain_of_function_skeletal_dysplasia#Sustained MAPK/STAT Signaling
        description: 'The K650E FGFR3 mutation also constitutively activates the RAS/MEK/ERK (MAPK) signaling
          cascade. Sustained ERK1/2 activation drives premature hypertrophic differentiation of growth
          plate chondrocytes. Studies in PC12 cells expressing inducible K650E FGFR3 demonstrate that
          sustained ERK1/2 activation is necessary for the ligand-independent differentiation phenotype,
          while STAT1/3 activation alone is not sufficient.

          '
        biological_processes:
        - preferred_term: MAPK cascade
          term:
            id: GO:0000165
            label: MAPK cascade
          modifier: INCREASED
      selected_evidence:
        snippet: Silencing of STAT1 or 3 independently or in combination had no significant effect on
          ligand-independent neurite outgrowth, ERK1/2 activation or p21(WAF1/CIP1) protein levels
        supports: SUPPORT
