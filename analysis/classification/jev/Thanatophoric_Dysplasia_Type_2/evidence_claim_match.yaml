              label: thanatophoric dysplasia type 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PLCgamma-STAT1-mediated chondrocyte apoptosis
        description: 'In addition to cell cycle arrest, the constitutively active FGFR3 K650E promotes
          premature apoptosis of growth plate chondrocytes. Signaling through phospholipase C gamma (PLCgamma)
          activates STAT1, which induces caspase-dependent apoptosis. In human TD fetal growth plates,
          increased apoptotic chondrocytes are associated with elevated Bax and decreased Bcl-2 levels.
          This apoptotic phenotype compounds the differentiation block to severely reduce the hypertrophic
          zone required for ossification.

          '
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: Apoptotic signaling pathway
          term:
            id: GO:0097190
            label: apoptotic signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: FGFR 3 mutations in TD I fetuses do not hamper chondrocyte proliferation but rather alter
          their differentiation by triggering premature apoptosis through activation of the STAT signaling
          pathway
        supports: SUPPORT
