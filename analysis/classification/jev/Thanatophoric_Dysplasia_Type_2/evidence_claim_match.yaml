  27897ef72095c99896a552199471d8eb85e947b90f695539b37dd4a139d13f7a:
    claim:
      about:
        disease:
          name: Thanatophoric Dysplasia Type 2
          disease_term:
            preferred_term: thanatophoric dysplasia type 2
            term:
              id: MONDO:0008547
              label: thanatophoric dysplasia type 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: STAT1/p21-mediated growth plate chondrocyte arrest
        description: 'Constitutively activated FGFR3 K650E signals through STAT1 and STAT5 in growth plate
          chondrocytes, upregulating the cell cycle inhibitor p21Cip1 and ink4 family members (p16, p18,
          p19). This drives premature exit of proliferative chondrocytes from the cell cycle and blocks
          their normal progression to hypertrophic differentiation. The extent of STAT1/p21 overexpression
          correlates directly with phenotypic severity across the FGFR3-related chondrodysplasia spectrum,
          being most pronounced in thanatophoric dysplasia.

          '
        cell_types:
        - preferred_term: Growth plate chondrocyte
          term:
            id: CL:1000217
            label: growth plate cartilage chondrocyte
        biological_processes:
        - preferred_term: JAK-STAT signaling
          term:
            id: GO:0007259
            label: cell surface receptor signaling pathway via JAK-STAT
          modifier: INCREASED
        - preferred_term: Negative regulation of cell cycle
          term:
            id: GO:0045786
            label: negative regulation of cell cycle
          modifier: INCREASED
        - preferred_term: Negative regulation of chondrocyte differentiation
          term:
            id: GO:0032331
            label: negative regulation of chondrocyte differentiation
          modifier: INCREASED
      selected_evidence:
        snippet: Abnormally high amounts of Stat1, Stat5 and p21Cip1 proteins were found in prehypertrophic-hypertrophic
          chondrocytes, the extent of overexpression being directly related to the severity of the disease.
        supports: SUPPORT
    origin:
