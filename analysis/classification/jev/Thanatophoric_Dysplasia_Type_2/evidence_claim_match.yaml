      assertion_type: Treatment
      assertion:
        name: Supportive and palliative care
        description: 'Most affected infants die shortly after birth from respiratory failure. Palliative
          care is typically provided. Rare long-term survivors require continuous ventilatory support,
          and some can be transitioned to home-based care with meticulous respiratory and nutritional
          management. The long-term survivor literature is generally thanatophoric dysplasia-wide and
          not always subtype-resolved, so survivor management claims should not be read as confirmed TD2-specific
          unless a report documents the subtype. For survivors, management also includes monitoring and
          treatment of hydrocephalus, craniocervical junction constriction, seizures, hearing impairment,
          and developmental complications.

          '
        treatment_term:
          preferred_term: Supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Long-term survival of TD individuals is common. Some individuals enjoy home-based lives;
          however, they are severely psychosocially and physically disabled and require meticulous respiratory
          and nutritional support.
        supports: SUPPORT
