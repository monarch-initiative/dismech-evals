              label: thanatophoric dysplasia type 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Constitutive FGFR3 kinase activation by K650E
        conforms_to: fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation
        description: 'The K650E mutation in the FGFR3 tyrosine kinase activation loop introduces a network
          of intramolecular hydrogen bonds that mimic the structural effect of activation-loop tyrosine
          phosphorylation, locking the kinase in its active conformation independent of ligand binding
          or A-loop phosphorylation. Crystal structure analysis shows that the glutamate side chain at
          position 650 forms hydrogen bonds with the catalytic loop arginine R616 and backbone amides
          of adjacent residues, stabilizing the active-state A-loop conformation and disengaging the autoinhibitory
          molecular brake at the kinase hinge region. This constitutive activation is more severe than
          the K650M mutation (associated with SADDAN syndrome).

          '
        gene:
          preferred_term: FGFR3
          description: Fibroblast growth factor receptor 3 with severe gain-of-function mutation (K650E)
            in the kinase domain activation loop.
          modifier: INCREASED
          term:
            id: hgnc:3690
            label: FGFR3
        molecular_functions:
        - preferred_term: fibroblast growth factor receptor activity
          term:
            id: GO:0005007
            label: fibroblast growth factor receptor activity
          modifier: INCREASED
        biological_processes:
        - preferred_term: FGFR signaling pathway
          term:
            id: GO:0008543
            label: fibroblast growth factor receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: the mutation introduces a network of intramolecular hydrogen bonds to stabilize the active-state
          conformation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23972473
      reference_title: Structural mimicry of a-loop tyrosine phosphorylation by a pathogenic FGF receptor
        3 mutation.
      evidence_source: IN_VITRO
      explanation: Crystal structure of FGFR3 K650E shows the mutation mimics A-loop phosphorylation,
        providing the structural basis for constitutive activation.
