            term:
              id: MONDO:0008547
              label: thanatophoric dysplasia type 2
        context: []
      assertion_type: Genetic
      assertion:
        name: FGFR3 gain-of-function mutations in TD2
        association: Causative
        gene_term:
          preferred_term: FGFR3
          term:
            id: hgnc:3690
            label: FGFR3
        notes: 'The c.1948A>G (p.Lys650Glu) mutation is the canonical and overwhelmingly recurrent cause
          of TD2. This mutation occurs at a CpG dinucleotide hotspot, explaining its recurrence. Unlike
          TD1, which has multiple common causative mutations in the extracellular and transmembrane domains,
          TD2 is strongly K650E-dominant. The same codon is affected in SADDAN syndrome (K650M) and when
          acquired somatically, K650E contributes to bladder cancer and multiple myeloma.

          '
        variants:
        - name: c.1948A>G (p.Lys650Glu, K650E)
          description: Substitution in the tyrosine kinase activation loop that introduces a glutamate
            residue mimicking activation-loop phosphorylation, causing constitutive kinase activity.
      selected_evidence:
        snippet: A sporadic mutation causing a Lys650Glu change in the tyrosine kinase domain of FGFR3
          was found in 16 of 16 individuals with one type of TD.
        supports: SUPPORT
