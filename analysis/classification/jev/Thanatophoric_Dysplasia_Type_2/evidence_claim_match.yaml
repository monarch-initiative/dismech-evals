      assertion_type: Pathophysiology
      assertion:
        name: Premature craniosynostosis and synchondrosis closure
        conforms_to: fgfr_gain_of_function_skeletal_dysplasia#Premature Suture Fusion and Craniosynostosis
        description: 'The FGFR3 K650E mutation affects cranial suture and synchondrosis development, leading
          to the cloverleaf skull deformity (kleeblattschadel) seen in most TD2 cases. FGFR3-MAPK signaling
          in chondrocytes promotes premature synchondrosis closure and fusion of ossification centers
          in the cranial base and spine by increasing BMP ligand expression and decreasing BMP antagonist
          expression. This premature closure contributes to foramen magnum stenosis and spinal canal narrowing,
          which can cause neurological complications. The cloverleaf skull involves premature fusion of
          multiple cranial sutures with compensatory bulging at patent sutures, and the resulting craniostenosis
          contributes to intracranial hypertension and pseudoencephaloceles.

          '
        biological_processes:
