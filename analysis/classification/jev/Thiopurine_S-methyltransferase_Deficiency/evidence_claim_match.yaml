            preferred_term: thiopurine S-methyltransferase deficiency
            term:
              id: MONDO:0012503
              label: thiopurine S-methyltransferase deficiency
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Pre-Prescription TPMT Genotyping or Activity Testing
        description: 'Determining TPMT status before the first thiopurine dose is what makes this latent
          trait actionable, and it is a diagnostic procedure rather than a therapy: it identifies the
          metabolizer phenotype, and a separate decision then sets the dose or substitutes the drug. Two
          assay routes exist — genotyping against the CPIC allele definitions, and direct measurement
          of erythrocyte TPMT activity. CPIC provides genotype-stratified starting-dose recommendations
          for mercaptopurine, thioguanine and azathioprine. Because the genotype-phenotype relationship
          is pharmacokinetic rather than disease-specific, the recommendations are extrapolated across
          all conditions treated with thiopurines, not only the few in which the dosing studies were done.

          A TPMT-only result is not a complete answer to thiopurine-toxicity risk. CPIC issues joint TPMT/NUDT15
          recommendations because NUDT15 accounts for most severe thiopurine-related myelosuppression
          in patients of Asian descent, so testing TPMT alone leaves the dominant risk allele unmeasured
          in a large part of the world''s population. NUDT15 deficiency remains a separate entity and
          is not curated here; see the notes.

          '
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        markers: Erythrocyte TPMT activity; TPMT genotype (CPIC allele definitions)
        results: Assigns a normal, intermediate or poor metabolizer phenotype, which sets the thiopurine
          starting dose or triggers substitution with a nonthiopurine agent.
      selected_evidence:
        snippet: Decreased and no‐function alleles in NUDT15 explain the majority of severe thiopurine‐related
          myelosuppression in patients of Asian descent and are common in patients with Amerindian genetic
          ancestry.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41618934
      reference_title: 'Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine
        Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Cited support for the scope limit stated in this entry''s notes: a TPMT-only test
        does not measure the dominant thiopurine-toxicity risk allele in patients of Asian or Amerindian
        ancestry.'
