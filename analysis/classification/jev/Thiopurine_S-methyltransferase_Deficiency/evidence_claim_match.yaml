      assertion:
        name: Alternative Nonthiopurine Agent for Poor Metabolizers
        description: 'For TPMT poor metabolizers treated for a nonmalignant condition, CPIC recommends
          switching to a nonthiopurine agent rather than prescribing a reduced thiopurine dose, because
          alternative agents are available and because 6-TGN concentrations in poor metabolizers remain
          well above tolerated levels even at markedly reduced doses. For azathioprine the same recommendation
          is phrased as considering alternative immunosuppressant therapy. This is the one situation in
          TPMT deficiency where the correct action is to withhold the drug class outright rather than
          dose around the enzyme defect; in malignant disease, where thiopurines are not readily replaceable,
          drastic dose reduction is used instead.

