        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TPMT Loss-of-Function Variant
        biological_scale: MOLECULAR
        description: 'Low-activity TPMT alleles reduce or abolish enzyme activity, chiefly by destabilizing
          the protein and accelerating its proteasomal degradation rather than by abolishing catalysis
          outright. Three alleles account for almost all deficiency in European-ancestry populations:
          TPMT*3A (the commonest, carrying two missense changes in cis), TPMT*3C and TPMT*2. Every deficient
          subject in a 1,214-donor cohort was homozygous or compound heterozygous for one of these three.
          Allele frequencies differ substantially by ancestry, so a genotyping panel validated in one
          population under-detects deficiency in another.

          '
        genes:
        - preferred_term: TPMT
          term:
            id: hgnc:12014
            label: TPMT
        molecular_functions:
        - preferred_term: thiopurine S-methyltransferase activity
          term:
            id: GO:0008119
            label: thiopurine S-methyltransferase activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: All seven TPMT deficient subjects were homozygous or compound heterozygous carriers for
          these alleles.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
