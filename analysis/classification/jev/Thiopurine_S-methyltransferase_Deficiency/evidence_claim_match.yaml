            term:
              id: MONDO:0012503
              label: thiopurine S-methyltransferase deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Genotype-Guided Thiopurine Dose Reduction
        description: 'Where a thiopurine is still indicated, the starting dose is set from metabolizer
          status rather than the drug being withheld. This is the recommendation for intermediate metabolizers,
          and for poor metabolizers it applies only where the thiopurine is not readily replaceable —
          in malignant disease, where CPIC calls for drastic dose reduction rather than substitution.
          In nonmalignant disease a poor metabolizer is switched to a different drug class instead; see
          "Alternative Nonthiopurine Agent for Poor Metabolizers". Dose reduction is what makes TPMT testing
          actionable in the intermediate range: efficacy and toxicity share the same metabolite, so a
          lower dose can reach a therapeutic 6-TGN concentration without reaching a toxic one. That logic
          does not extend to poor metabolizers, in whom 6-TGN stays above tolerated concentrations even
          at markedly reduced doses.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: azathioprine
            term:
              id: CHEBI:2948
              label: azathioprine
          - preferred_term: mercaptopurine
            term:
              id: CHEBI:50667
              label: mercaptopurine
      selected_evidence:
        snippet: On average, TPMT or NUDT15 IM patients can tolerate ~60% of the standard dose of thiopurine,
          even though it ranges from 30% to 80% across patients.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/1
