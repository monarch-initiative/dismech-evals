  f7402b03b19b10a707469d2a7c1710298ecbd8eb1aac2b8a13556144e020e8b3:
    claim:
      about:
        disease:
          name: Thiopurine S-methyltransferase Deficiency
          disease_term:
            preferred_term: thiopurine S-methyltransferase deficiency
            term:
              id: MONDO:0012503
              label: thiopurine S-methyltransferase deficiency
        context:
        - path: /treatments/0
          value:
            name: Genotype-Guided Thiopurine Dose Reduction
            description: 'Where a thiopurine is still indicated, the starting dose is set from metabolizer
              status rather than the drug being withheld. This is the recommendation for intermediate
              metabolizers, and for poor metabolizers it applies only where the thiopurine is not readily
              replaceable — in malignant disease, where CPIC calls for drastic dose reduction rather than
              substitution. In nonmalignant disease a poor metabolizer is switched to a different drug
              class instead; see "Alternative Nonthiopurine Agent for Poor Metabolizers". Dose reduction
              is what makes TPMT testing actionable in the intermediate range: efficacy and toxicity share
              the same metabolite, so a lower dose can reach a therapeutic 6-TGN concentration without
              reaching a toxic one. That logic does not extend to poor metabolizers, in whom 6-TGN stays
              above tolerated concentrations even at markedly reduced doses.

              '
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: azathioprine
                term:
                  id: CHEBI:2948
                  label: azathioprine
              - preferred_term: mercaptopurine
                term:
                  id: CHEBI:50667
                  label: mercaptopurine
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: 6-Thioguanine Nucleotide Accumulation
        treatment_effect: MODULATES
        description: 'Setting the dose from metabolizer status keeps 6-TGN within the therapeutic window
          instead of allowing it to reach the toxic concentrations a standard dose would produce. The
          link is to the metabolite node rather than to the enzyme, because dose reduction does not restore
          TPMT activity — it lowers the flux the residual activity has to handle. In poor metabolizers
          this only partially controls the node, which is why substitution is preferred wherever an alternative
          agent exists.

          '
      selected_evidence:
        snippet: we provide recommendations for adjusting starting doses of mercaptopurine, thioguanine,
          and azathioprine based on TPMT and NUDT15 genotypes
        supports: SUPPORT
