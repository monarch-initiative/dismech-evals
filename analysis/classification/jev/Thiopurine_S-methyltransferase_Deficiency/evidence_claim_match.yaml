  180ddab9630995e8a4a0a3da4987ff228e858b8200370e06db1a2a849aec8791:
    claim:
      about:
        disease:
          name: Thiopurine S-methyltransferase Deficiency
          disease_term:
            preferred_term: thiopurine S-methyltransferase deficiency
            term:
              id: MONDO:0012503
              label: thiopurine S-methyltransferase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Accelerated Proteasomal Degradation of Variant TPMT
        biological_scale: MOLECULAR
        description: 'The low-activity alleles do not abolish catalysis directly — they destabilize the
          protein. TPMT*2 and TPMT*3A produce normal mRNA levels and are translated at a normal rate,
          but their degradation half-life falls from about 18 hours to roughly 15 minutes, and the degradation
          is proteasome- and ATP-dependent rather than lysosomal. Erythrocyte TPMT activity tracks TPMT
          protein amount almost perfectly across the activity range. This node is what justifies treating
          the star alleles as one pathograph rather than as subtypes: they differ in sequence but converge
          on the same proximal event, less enzyme.

          '
        biological_processes:
        - preferred_term: proteasome-mediated degradation of variant TPMT
          term:
            id: GO:0030163
            label: protein catabolic process
          modifier: INCREASED
      selected_evidence:
        snippet: pulse-chase experiments revealed significantly shorter degradation half-lives for TPMT*2
          and TPMT*3A ( approximately 0.25 hr) compared with wild-type TPMT*1 (18 hr)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
