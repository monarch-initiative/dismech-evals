              label: thiopurine S-methyltransferase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: 6-Thioguanine Nucleotide Accumulation
        biological_scale: MOLECULAR
        description: 'Thiopurines are prodrugs: therapeutic and toxic effects alike are mediated by the
          6-thioguanine nucleotides (6-TGN) formed downstream of HGPRT. In a TPMT-deficient patient given
          a standard dose, 6-TGN concentrations rise to levels that would ordinarily follow a many-fold
          higher dose. The nucleotides are incorporated into DNA and RNA, and the resulting thioguanine-substituted
          DNA triggers cytotoxicity in dividing cells. Because the same metabolite mediates efficacy,
          this is a therapeutic-index problem rather than an off-target toxicity — dose reduction preserves
          the intended effect while avoiding the toxic exposure, which is precisely why genotype-guided
          dosing works rather than requiring a different drug class.

          '
        biological_processes:
        - preferred_term: purine nucleotide salvage
          term:
            id: GO:0032261
            label: purine nucleotide salvage
          modifier: INCREASED
      selected_evidence:
        snippet: Decreased or no-function alleles in TPMT and NUDT15 are associated with reduced or no
          enzyme activity and predictive of pronounced adverse effects, including severe myelosuppression,
          that may occur among individuals treated with standard doses of thiopurines.
        supports: SUPPORT
