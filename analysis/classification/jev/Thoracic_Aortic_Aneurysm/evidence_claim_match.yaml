          name: Thoracic Aortic Aneurysm
          disease_term:
            preferred_term: thoracic aortic aneurysm
            term:
              id: MONDO:0005396
              label: thoracic aortic aneurysm
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Extracellular matrix proteolysis and elastic fiber fragmentation
        description: Protease-mediated destruction of the medial extracellular matrix — matrix metalloproteinase
          activity, plus plasmin generated from plasminogen that is convected across the abnormally permeable
          aortic wall — degrades elastin and fibrillar collagen. Loss of intact elastic lamellae removes
          the principal load-bearing element of the media. Inflammatory reactions and oxidative stress
          act as amplifiers of this proteolytic injury rather than as the primary lesion, distinguishing
          thoracic medial degeneration from the florid transmural inflammation of abdominal aortic aneurysm.
        role: effector
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: extracellular matrix disassembly
          modifier: INCREASED
          term:
            id: GO:0022617
            label: extracellular matrix disassembly
        notes: GO:0048251 elastic fiber assembly (DECREASED) was removed from this node during review.
          The claim here is proteolytic DESTRUCTION of existing elastin, which GO:0022617 extracellular
          matrix disassembly (INCREASED) already states; reduced assembly is a different mechanism, is
          not what the cited evidence shows, and carrying both would have implied a synthetic defect the
          sources do not support.
      selected_evidence:
        snippet: Inflammatory reactions and increased oxidative stress are cellular responses to aortic
          injury, and they may induce protease-mediated destruction of the aortic wall.
        supports: SUPPORT
