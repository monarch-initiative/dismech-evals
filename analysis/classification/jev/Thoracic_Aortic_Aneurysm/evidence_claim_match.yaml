  2ee40c41aae9527f16c8bd3e2a5979ea00fd9aef72afc062f93047089b1c340a:
    claim:
      about:
        disease:
          name: Thoracic Aortic Aneurysm
          disease_term:
            preferred_term: thoracic aortic aneurysm
            term:
              id: MONDO:0005396
              label: thoracic aortic aneurysm
        context: []
      assertion_type: Phenotype
      assertion:
        category: Cardiovascular
        name: Aortic regurgitation
        description: 'Valve incompetence arising from the aneurysm itself rather than from primary valve
          disease: root dilatation widens the aortic annulus and separates the commissures, so the leaflets
          no longer coapt. This is the structural consequence that makes root aneurysms behave differently
          from tubular ones, and it is the main reason roots are operated at smaller diameters - the decision
          is driven by valve competence as well as by rupture risk. It also changes the operation: a competent-leaflet
          root can take a valve-sparing replacement, whereas established regurgitation with damaged leaflets
          points to a composite graft.'
        phenotype_term:
          preferred_term: Aortic regurgitation
          term:
            id: HP:0001659
            label: Aortic regurgitation
        frequency: FREQUENT
        notes: 'Curated after a previous round declined it for want of a cached source. The mechanistic
          case is what justifies it independently of the frequency: root dilatation to annular dilatation
          to valve incompetence is a direct structural consequence of the Loss of wall tensile strength
          and progressive dilatation node this entry already models, and without it the pathograph''s
          downstream story runs only to dissection and rupture, omitting the commonest reason a root aneurysm
          is repaired early.'
      selected_evidence:
        snippet: Classic physical findings such as aortic regurgitation and pulse deficit were noted in
          only 31.6% and 15.1% of patients, respectively
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/9
      evidence_path: /phenotypes/9/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10685714
      reference_title: 'The International Registry of Acute Aortic Dissection (IRAD): new insights into
        an old disease.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Quantifies aortic regurgitation in a large registry, and the word "only" is the authors''
        point: it is present in under a third even where it is classically expected. PARTIAL, and the
        caveat is important - this is the acute DISSECTION population, not the stable aneurysm population
        this entry otherwise describes, so the figure bounds rather than measures the frequency in unruptured
        disease. The FREQUENT band is set from this figure and should be read with that ascertainment
        attached.'
