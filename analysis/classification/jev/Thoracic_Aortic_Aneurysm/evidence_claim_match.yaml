          fiber fragmentation and/or loss, and smooth muscle cell nuclei loss. Inflammatory infiltrate
          is characteristically absent — this is a non-inflammatory degenerative lesion.'
      selected_evidence:
        snippet: Older terms such as cystic medial necrosis and medionecrosis are replaced by more technically
          accurate terms such as mucoid extracellular matrix accumulation (MEMA), elastic fiber fragmentation
          and/or loss, and smooth muscle cell nuclei loss.
