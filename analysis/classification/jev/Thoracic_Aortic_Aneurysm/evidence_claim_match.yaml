              id: MONDO:0005396
              label: thoracic aortic aneurysm
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aortic wall aging and chronic hemodynamic stress
        description: Cumulative pulsatile wall stress across a lifetime, amplified by systemic hypertension,
          drives a vasculopathic aging process in the aortic media. This is the dominant upstream trigger
          for sporadic degenerative thoracic aortic aneurysm, and is especially characteristic of descending
          thoracic disease in older patients. It is the acquired counterpart of the monogenic wall defects
          that trigger the heritable aortopathies.
        role: trigger
        biological_scale: TISSUE
        cell_types:
        - preferred_term: vascular associated smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        biological_processes:
        - preferred_term: extracellular matrix organization
          modifier: DECREASED
          term:
            id: GO:0030198
            label: extracellular matrix organization
      selected_evidence:
        snippet: A number of diseases, genetic syndromes (Marfan syndrome, Loeys-Dietz syndrome, etc.),
          and vasculopathic aging processes involved in vascular injury can cause both distinct and nonspecific
          histopathologic changes with degeneration of the media as a common denominator.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27031798
      reference_title: 'Consensus statement on surgical pathology of the aorta from the Society for Cardiovascular
