      assertion_type: Pathophysiology
      assertion:
        name: Medial degeneration of the aortic wall
        description: 'The convergent tissue lesion of thoracic aortic aneurysm: loss of smooth muscle
          cell nuclei, fragmentation and/or loss of elastic fibers, and mucoid extracellular matrix accumulation
          (MEMA) within the media. The 2016 Society for Cardiovascular Pathology / Association for European
          Cardiovascular Pathology consensus replaced the older terms "cystic medial necrosis" and "medionecrosis"
          with these descriptive terms and defined a grading system. Importantly, this is a non-inflammatory
          degenerative lesion; florid inflammatory infiltrate is characteristically absent.'
        role: central_effector
        biological_scale: TISSUE
        conforms_to: aortopathy_tgfbeta_dysregulation#Aortic Medial Degeneration and Wall Weakening
        cell_types:
        - preferred_term: vascular associated smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        biological_processes:
        - preferred_term: extracellular matrix disassembly
          modifier: INCREASED
          term:
            id: GO:0022617
            label: extracellular matrix disassembly
      selected_evidence:
        snippet: Older terms such as cystic medial necrosis and medionecrosis are replaced by more technically
          accurate terms such as mucoid extracellular matrix accumulation (MEMA), elastic fiber fragmentation
          and/or loss, and smooth muscle cell nuclei loss.
        supports: SUPPORT
