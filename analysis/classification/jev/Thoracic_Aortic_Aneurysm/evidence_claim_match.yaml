              label: thoracic aortic aneurysm
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aortic dissection and rupture
        description: 'Wall failure, the lethal endpoint. When stress exceeds the strength of the degenerated
          media, an intimal tear admits blood into the media and propagates a dissection, or the wall
          ruptures outright. Rupture risk is strongly non-linear in diameter: hinge points for natural
          complications occur near 6.0 cm for the ascending and 7.0 cm for the descending aorta, and a
          6 cm aorta carries an approximately 14% annual risk of rupture, dissection, or death. Dissection,
          however, does NOT follow the same size dependence — a majority of both type A (59% below 5.5
          cm) and type B (80% below 5 cm) dissections occur below the operative threshold, so diameter-triggered
          prophylactic repair prevents rupture far more effectively than it prevents dissection.'
        role: consequence
        biological_scale: ORGANISM
        conforms_to: aortopathy_tgfbeta_dysregulation#Aortic Dissection and Rupture
      selected_evidence:
        snippet: 'a patient with an aorta that has reached 6 cm maximal diameter faces the following yearly
          rates of devastating adverse events: rupture (3.6%), dissection (3.7%), death (10.8%), rupture,
          dissection, or death (14.1%)'
        supports: SUPPORT
