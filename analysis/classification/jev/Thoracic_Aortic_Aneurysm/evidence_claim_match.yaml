          - preferred_term: angiotensin II receptor antagonist
            term:
              id: NCIT:C66930
              label: Angiotensin II Receptor Antagonist
      selected_evidence:
        snippet: Both slopes were significantly less than zero, indicating a decrease in the aortic-root
          diameter relative to body-surface area with either treatment.
