  4ef7738eb9b401d4bf02104aa848e0a174ee93f76c2780bc7e55f62eee8ae1a1:
    claim:
      about:
        disease:
          name: Thoracic Aortic Aneurysm
          disease_term:
            preferred_term: thoracic aortic aneurysm
            term:
              id: MONDO:0005396
              label: thoracic aortic aneurysm
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_taa_tgfbeta_losartan_translation
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the TGF-beta-antagonism mechanism that prevents aortic aneurysm in the Marfan mouse
          translate into a clinically distinguishable benefit in humans, and does it apply at all to sporadic
          degenerative thoracic aortic aneurysm?
        attaches_to:
        - pathophysiology#Loss of wall tensile strength and progressive dilatation
        - pathophysiology#Segment-specific smooth muscle lineage susceptibility
        rationale: 'The mechanistic rationale for angiotensin-receptor blockade in aortopathy comes from
          a fibrillin-1 mouse model, in which losartan and a TGF-beta-neutralizing antibody prevented
          aneurysm outright. The subsequent randomized human trial in Marfan syndrome found no difference
          between losartan and atenolol in the rate of aortic-root dilatation over three years — both
          slowed indexed growth, but the TGF-beta-directed agent conferred no additional benefit than
          an active comparator. That trial is often read as showing the mechanism failed to translate,
          and it does not show that: a later individual-patient-data meta-analysis of seven randomized
          trials (1442 patients) found ARB allocation approximately halved the annual rate of aortic root
          Z score increase when compared against control rather than against a beta blocker, with a significantly
          larger effect in fibrillin-1 variant carriers. The honest statement of the mismatch is therefore
          narrower than "losartan did not work": ARBs demonstrably slow root dilatation in Marfan syndrome,
          but they do not outperform beta blockade, so the human data do not isolate a TGF-beta-specific
          benefit of the magnitude the mouse model predicted. This remains a model-to-human fidelity question
          rather than an absence of evidence. The gap is wider still for this entry, because even the
          human trial evidence comes from syndromic Marfan disease, whereas sporadic degenerative thoracic
          aortic aneurysm has no comparable randomized data and is not established to be TGF-beta-driven
          at all. This is the main reason the entry does not declare conformance to the `aortopathy_tgfbeta_dysregulation#TGF-beta
          Signaling Dysregulation` node.'
        proposed_experiments:
        - experiment_id: taa_tgfbeta_axis_in_sporadic_disease
          name: TGF-beta pathway activity in sporadic versus syndromic thoracic aneurysm tissue
          description: Compare canonical TGF-beta pathway activation (phospho-SMAD2/3 signalling, pathway
            transcriptional output) in resected aortic tissue from sporadic degenerative thoracic aortic
            aneurysm, syndromic heritable aortopathy, and non-aneurysmal control aorta, stratified by
            aortic segment and smooth muscle lineage.
          decision_criterion: Sporadic degenerative aneurysm tissue shows TGF-beta pathway activation
            comparable to syndromic aortopathy, versus control aorta, in independent specimen series.
          would_support:
          - pathophysiology#Segment-specific smooth muscle lineage susceptibility
      selected_evidence:
        snippet: Among children and young adults with Marfan's syndrome who were randomly assigned to
          losartan or atenolol, we found no significant difference in the rate of aortic-root dilatation
          between the two treatment groups over a 3-year period.
        supports: REFUTE
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25405392
