  34202f97f8dcfbaddfcd54cb2afaac4a1fb99b55ea8ddabfbcd76040666e7555:
    claim:
      about:
        disease:
          name: Thoracic Aortic Aneurysm
          disease_term:
            preferred_term: thoracic aortic aneurysm
            term:
              id: MONDO:0005396
              label: thoracic aortic aneurysm
        context: []
      assertion_type: Treatment
      assertion:
        name: Blood-pressure and wall-stress reducing pharmacotherapy
        description: 'Antihypertensive therapy, conventionally beta-blockade and/or renin-angiotensin
          system blockade, to lower the pulsatile wall stress driving dilatation. Medical therapy is a
          named management domain in the 2022 ACC/AHA aortic disease guideline. The evidence base is weaker
          than that framing suggests: the strongest randomized data come from syndromic (Marfan) cohorts,
          where the head-to-head Pediatric Heart Network trial found losartan no better than atenolol,
          and no comparable randomized evidence exists for sporadic degenerative thoracic aortic aneurysm.
          The distinction between those two findings matters and is easy to collapse: an individual-patient-data
          meta-analysis of seven randomized trials in Marfan syndrome found that allocation to an ARB
          approximately halved the annual rate of aortic root Z score increase against control, with the
          effect particularly large in fibrillin-1 variant carriers. So ARBs do work against control;
          what the head-to-head trial showed is that they are not superior to an active beta-blocker comparator.
          Both agents are curated here for that reason.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: beta-adrenergic antagonist
            term:
              id: NCIT:C29576
              label: Beta-Adrenergic Antagonist
          - preferred_term: angiotensin II receptor antagonist
            term:
              id: NCIT:C66930
              label: Angiotensin II Receptor Antagonist
      selected_evidence:
        snippet: Prespecified secondary subgroup analyses showed that the effects of ARB were particularly
          large in those with pathogenic variants in fibrillin-1, compared with those without such variants
          (heterogeneity p=0·0050)
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36049495
      reference_title: 'Angiotensin receptor blockers and β blockers in Marfan syndrome: an individual
        patient data meta-analysis of randomised trials.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'The effect concentrates in fibrillin-1 carriers, which is mechanistically informative
        but also the reason this evidence is PARTIAL for the present entry: it comes from syndromic Marfan
        cohorts, and transfer to sporadic degenerative thoracic aortic aneurysm is not established.'
