      assertion_type: Pathophysiology
      assertion:
        name: Bicuspid aortic valve-associated altered wall shear stress
        description: A bicuspid aortic valve produces an eccentric, high-velocity systolic jet that imposes
          regionally elevated wall shear stress (WSS) on the ascending aortic convexity. Elevated WSS
          is associated with locally altered aortic wall biomechanics and maladaptive remodeling, giving
          a hemodynamic route to ascending aneurysm that is distinct from, and additive to, the intrinsic
          vascular smooth muscle cell abnormality also documented in bicuspid aortic tissue.
        role: trigger
        biological_scale: TISSUE
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
      selected_evidence:
        snippet: This study shows strong evidence that biomechanical changes in the aorta are strongly
          associated with hemodynamics
        supports: SUPPORT
