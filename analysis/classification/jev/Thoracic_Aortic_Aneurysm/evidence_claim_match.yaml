        description: Mortality is the terminal outcome the entire size-threshold literature exists to
          prevent, and until now the pathograph in this entry stopped at dissection and rupture without
          representing it. At 6 cm maximal diameter the yearly rate of death reaches 10.8%, exceeding
          the rates of rupture and dissection individually - which is the quantitative core of the argument
          for elective repair before that diameter.
        phenotype_term:
          preferred_term: Sudden death
