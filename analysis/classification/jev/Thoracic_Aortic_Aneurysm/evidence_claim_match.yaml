          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
      selected_evidence:
        snippet: VSMCs in the root arise from cardiogenic mesoderm cells, whereas the ascending aorta
          is composed of both cardiogenic mesodermal cells and cardiac neural crest cells
        supports: SUPPORT
