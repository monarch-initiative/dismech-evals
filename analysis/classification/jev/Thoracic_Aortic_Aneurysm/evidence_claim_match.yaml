      assertion:
        name: Medial degeneration (MEMA, elastic fiber fragmentation, smooth muscle cell nuclei loss)
        description: 'The diagnostic surgical-pathology lesion of resected thoracic aortic aneurysm. The
          2016 SCVP/AECVP consensus retired "cystic medial necrosis" and "medionecrosis" in favor of three
