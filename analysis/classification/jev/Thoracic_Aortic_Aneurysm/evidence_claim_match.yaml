        notes: HP:0001699 Sudden death is the closest available term. The 10.8% yearly figure is all-cause
          death in this aneurysm cohort rather than specifically sudden death, so the term is broader
          in mechanism than the cited datum; preferred_term keeps the phenotype label general for that
          reason.
      selected_evidence:
        snippet: 'a patient with an aorta that has reached 6 cm maximal diameter faces the following yearly
