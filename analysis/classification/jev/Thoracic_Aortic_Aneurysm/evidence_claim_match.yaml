      assertion_type: Pathophysiology
      assertion:
        name: Segment-specific smooth muscle lineage susceptibility
        description: 'The thoracic aorta is a mosaic of vascular smooth muscle cells of different embryonic
          origin: root VSMCs derive from cardiogenic mesoderm, the ascending aorta from both cardiogenic
          mesoderm and cardiac neural crest, and the descending thoracic aorta from somites. Lineages
          differ in their transcriptional response to stimuli such as TGF-beta, and the boundaries between
          them are proposed focal points of lamellar weakness. This developmental mosaicism is a mechanistic
          explanation for why proximal and distal thoracic aneurysm/dissection differ in age at onset,
          risk-factor profile, and histology.'
        role: modifier
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: vascular associated smooth muscle cell
          term:
