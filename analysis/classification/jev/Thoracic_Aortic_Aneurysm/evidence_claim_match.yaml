  b893ab2150a4ed072f5d642fe118dc10c45ecaabfe9dc03611597ba84b9dad62:
    claim:
      about:
        disease:
          name: Thoracic Aortic Aneurysm
          disease_term:
            preferred_term: thoracic aortic aneurysm
            term:
              id: MONDO:0005396
              label: thoracic aortic aneurysm
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_taa_nondiameter_dissection_prediction
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Can aortic dissection risk be predicted by anything other than maximal diameter, given
          that a majority of both type A and type B dissections occur below the operative size threshold?
        attaches_to:
        - pathophysiology#Aortic dissection and rupture
        - pathophysiology#Loss of wall tensile strength and progressive dilatation
        rationale: Rupture and dissection have different size dependence, yet the entire management algorithm
          is built on diameter. In the descending aorta, median size at acute type B dissection was 4.1
          cm with 80% of dissections below 5 cm, while 93% of ruptures occurred above 5 cm. In the ascending
          aorta, 59% of IRAD type A dissections presented below 5.5 cm. Diameter-triggered prophylactic
          repair therefore addresses rupture well but leaves dissection risk largely unmitigated, and
          the authors of both cohorts state this explicitly. No validated non-diameter predictor (biomechanical,
          imaging biomarker, or circulating marker) is yet in routine clinical use, so the most common
          acute presentation of thoracic aortic disease is currently not preventable by the standard size-based
          algorithm.
        proposed_experiments:
        - experiment_id: taa_nondiameter_dissection_predictors
          name: Prospective imaging-biomarker cohort for sub-threshold aortic dissection
          description: Enrol patients under surveillance for thoracic aortic aneurysm below the operative
            diameter threshold and collect 4D-flow MRI wall shear stress, wall-strain/distensibility imaging,
            and aortic height index at baseline and at intervals, with acute aortic dissection as the
            prespecified endpoint.
          decision_criterion: A candidate marker predicts dissection independently of maximal diameter
            in multivariable competing-risks analysis, with reproducible discrimination in an external
            validation cohort.
          would_support:
          - pathophysiology#Aortic dissection and rupture
      selected_evidence:
        snippet: the guideline criterion of 5.5 cm for ascending aortic intervention misses many dissections
          occurring at smaller dimensions
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/2
      context_paths:
