      - /disease_term
    evidence_metadata:
      reference: PMID:34238012
      reference_title: Root Dilatation Is More Malignant Than Ascending Aortic Dilation.
      evidence_source: HUMAN_CLINICAL
      explanation: Restates the gap and offers one partial mitigation short of a new biomarker — segment-specific
        hinge points (5.0 cm root, 5.25 cm mid-ascending) rather than a single ascending threshold. Marked
        PARTIAL because refining the diameter criterion narrows but does not close the sub-threshold dissection
        gap.
