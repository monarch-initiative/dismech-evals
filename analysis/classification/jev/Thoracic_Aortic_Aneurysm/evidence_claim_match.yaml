          cm for the descending aorta in non-syndromic disease, with earlier intervention (5.0 cm ascending,
          6.0 cm descending) for Marfan syndrome or familial thoracic aortic aneurysm. A contemporary
          surveillance cohort found a seven-fold rise in mortality at diameters >=5.5 cm, supporting that
          threshold for rupture prevention — though it does not address the sub-threshold dissection problem.
