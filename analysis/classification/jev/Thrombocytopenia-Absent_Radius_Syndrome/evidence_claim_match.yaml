        attaches_to:
        - treatments#
        - pathophysiology#Megakaryocyte Maturation Failure
        rationale: 'TPO-receptor agonists have accumulated real experience across the inherited thrombocytopenias,
          but the reported diagnoses are Wiskott-Aldrich, MYH9- and ANKRD26-related disease; TAR is not
          among them. The question is not purely empirical, because TAR patients have been reported to
          have elevated endogenous TPO with impaired responsiveness rather than TPO deficiency, so agonist
          therapy is not obviously indicated by the mechanism. Recorded as a gap rather than as a treatment:
          nothing here supports offering a TPO-RA in TAR, and nothing rules it out.'
      selected_evidence:
        snippet: The main diagnoses were Wiskott-Aldrich syndrome, MYH9-related disorder and ANKRD26-related
          thrombocytopenia.
