              label: thrombocytopenia-absent radius syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced RBM8A Gene Dosage
        biological_scale: MOLECULAR
        description: 'A rare null allele on one chromosome - most often the recurrent 200-kb interstitial
          microdeletion of 1q21.1, less often a frameshift or nonsense variant in RBM8A - is inherited
          in trans with a low-frequency non-coding SNP in the RBM8A 5''UTR or first intron. The regulatory
          minor alleles sit in active regulatory elements and lower transcription from the remaining copy,
          so total RBM8A output falls below what either lesion produces on its own. Two such regulatory
          SNPs accounted for nearly all cases in the original series, but the allelic spectrum is not
          closed: further TAR-associated SNPs continue to be identified.'
        genes:
        - preferred_term: RBM8A
          term:
            id: hgnc:9905
            label: RBM8A
      selected_evidence:
        snippet: we describe a common interstitial microdeletion of 200 kb on chromosome 1q21.1 in all
          30 investigated patients with TAR syndrome
        supports: SUPPORT
