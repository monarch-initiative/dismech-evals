      assertion_type: Treatment
      assertion:
        name: In Utero Platelet Transfusion
        description: Where TAR is recognised antenatally and severe fetal thrombocytopenia is confirmed
          by cordocentesis, platelets can be transfused into the umbilical vein before delivery. The aim
          is peripartum haemostasis at the point of greatest bleeding risk, not correction of the underlying
          defect. This is reported experience from case management rather than trial evidence.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Platelet Transfusion
          term:
            id: NCIT:C15366
            label: Platelet Transfusion
      selected_evidence:
        snippet: We conclude that TAR syndrome can be readily identified prenatally on sonogram, and if
          severe thrombocytopenia is confirmed by cordocentesis, platelets should be transfused to diminish
          the risk of serious internal bleeding during and immediately after delivery.
        supports: SUPPORT
