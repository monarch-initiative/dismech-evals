      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: 'Formally autosomal recessive, but with a two-allele structure that makes the observed
          pedigrees look unlike a classic recessive disorder. Affected individuals carry a rare null allele
          in trans with a common low-frequency hypomorphic regulatory allele of RBM8A. Because null alleles
          are rare and often de novo while the hypomorphic allele is common in the population, the pedigree
          pattern shows few affected sibs, apparent parent-to-child transmission, and affected second-
          and third-degree relatives. Carriers of either allele alone, including individuals homozygous
          for the hypomorphic allele, are asymptomatic. Recurrence risk therefore depends on which alleles
          the parents carry rather than on a single figure: a quarter when one parent carries the null
          allele and the other a single hypomorphic allele, and a half when the hypomorph-carrying parent
          is homozygous for it. The naive "25% autosomal recessive" answer is right only in the first
          of those cases.'
      selected_evidence:
        snippet: a paucity of affected sibs, apparent parent-to-child transmission, and affected second-
          and third-degree relatives
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
