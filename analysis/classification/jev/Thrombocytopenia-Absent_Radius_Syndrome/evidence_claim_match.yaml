      assertion_type: Treatment
      assertion:
        name: Avoidance of Antiplatelet Drugs
        description: 'NSAIDs and aspirin are avoided or used with caution. The rationale is not only the
          low platelet count: platelet function is itself somewhat impaired in this disorder, so an antiplatelet
          agent compounds a qualitative defect on top of a quantitative one. This matters most in infancy,
          when bleeding risk is highest, but the platelet functional defect does not resolve with the
          count.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Platelet function is somewhat impaired, suggesting that drugs such as nonsteroidal anti-inflammatory
          drugs or aspirin should be avoided or used with caution.
        supports: SUPPORT
