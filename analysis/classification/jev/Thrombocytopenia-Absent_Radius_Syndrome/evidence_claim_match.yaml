        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ibmfs_classification_and_malignancy_risk
        kind: INTERPRETATION
        status: OPEN
        prompt: Should TAR be treated as an inherited bone marrow failure syndrome, and does it carry
          a leukemia predisposition?
        attaches_to:
        - clinical_burden#
        - phenotypes#Thrombocytopenia
        notes: 'One of the two later case reports (PMID:41925074) describes its patient as having a homozygous
          RBM8A c.-21G>A variant rather than the compound null-plus-hypomorph genotype this entry models,
          and GeneReviews states that individuals with biallelic hypomorphic alleles are asymptomatic.
          Flagged rather than acted on: a single case report is not enough to revise the inheritance model,
          and the discrepancy could equally be a reporting simplification. Worth checking against the
          primary genotype data if anyone revisits the allelic spectrum, which PMID:37611607 says is still
          open.'
        rationale: 'TAR is conventionally listed among the inherited bone marrow failure syndromes and
          is enrolled as one by the NCI natural-history cohort recorded under clinical_trials, but the
          haematological behaviour fits that label poorly and the literature says so directly. The thrombocytopenia
          is lineage-restricted and remits with age rather than progressing to pancytopenia, which is
          the opposite of the course in Fanconi anemia or dyskeratosis congenita. Leukemia in TAR is at
          case-report level: a 2017 review counted four reported cases in the entire literature, and further
          single cases have appeared since, including Philadelphia-positive AML and juvenile myelomonocytic
          leukemia. Recorded as an interpretation rather than as a phenotype because the honest statement
          is a reported near-absence, and a handful of cases across a rare disease does not establish
          a predisposition. Curators should not infer a Fanconi-like surveillance requirement from the
          IBMFS label alone.'
      selected_evidence:
        snippet: TAR syndrome is not generally associated with bone marrow failure or malignancy.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
