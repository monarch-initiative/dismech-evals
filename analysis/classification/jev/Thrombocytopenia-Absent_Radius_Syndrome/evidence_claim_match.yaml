              id: MONDO:0010121
              label: thrombocytopenia-absent radius syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Y14 Protein Insufficiency
        biological_scale: MOLECULAR
        description: 'Y14 abundance falls below the level the most sensitive tissues require. What is
          settled is the negative claim: this is not plain haploinsufficiency. Carriers of the 1q21.1
          deletion alone are healthy and the regulatory SNPs alone have no measurable effect on platelet
          count, so only the combination produces disease. Why that combination is pathogenic while either
          allele alone is tolerated is not settled, and the source describes its data as compatible with
          two models. Both are recorded under mechanistic_hypotheses rather than asserted here.'
      selected_evidence:
        snippet: Our data implicate Y14 insufficiency and, presumably, an EJC defect as the cause of TAR
          syndrome.
        supports: SUPPORT
