            preferred_term: thrombocytopenia-absent radius syndrome
            term:
              id: MONDO:0010121
              label: thrombocytopenia-absent radius syndrome
        context: []
      assertion_type: Variant
      assertion:
        name: RBM8A rs139428292
        description: 'The recurrent low-frequency non-coding RBM8A regulatory allele, reported in trans
          with the 1q21.1 microdeletion in molecularly characterized patients. Named here because the
          entry otherwise refers to the regulatory alleles only by their position in the 5''UTR or first
          intron. Classified mLOE rather than LOE because the expression loss is modular, not global:
          reporter activity fell in megakaryocytic and osteoblast lines but not in endothelial or HEK293
          cells. That cell-type restriction is the same observation the entry uses to model the phenotype
          as tissue-selective. The caveat is that the evidence is reporter activity in cell lines rather
          than expression measured in primary megakaryocytes and limb bud, so "modular" is inferred from
          which lines responded. RBM8A itself is widely expressed, so a reviewer who judged the reduction
          to be global rather than cell-type restricted would classify this LOE instead.'
        gene:
          preferred_term: RBM8A
          term:
            id: hgnc:9905
            label: RBM8A
        regulatory_category: mLOE
      selected_evidence:
        snippet: The minor alleles were associated with significantly lower luciferase activity in human
          megakaryocytic CHRF and DAMI cell lines and the murine osteoblast cell line MC3T3.
        supports: SUPPORT
    origin:
      assertion_path: /variants/0
      evidence_path: /variants/0/evidence/0
      context_paths:
