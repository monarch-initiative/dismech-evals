      assertion_type: Discussion
      assertion:
        discussion_id: rbm8a_regulatory_snp_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what molecular mechanism do the RBM8A 5'UTR and first-intron minor alleles reduce Y14
          protein abundance in patients?
        attaches_to:
        - pathophysiology#Reduced RBM8A Gene Dosage
        rationale: The genetic association is settled and the protein deficit is measured in patient platelets,
          but the step between them is not established. Reporter assays show both minor alleles lower
          promoter activity in megakaryocytic and osteoblast lines, yet allele-specific expression in
          platelet RNA from healthy heterozygotes showed no difference between transcripts, so reduced
          transcription alone does not account for the observed protein reduction. The authors state the
          mechanism remains open and may differ between the two SNPs. This matters for curation because
          the causal edge from genotype to Y14 insufficiency is currently supported by correlation plus
          a partially contradicted transcriptional model.
      selected_evidence:
        snippet: It therefore still leaves open the question of the exact mechanism by which the non-coding
          SNPs lead to the decreased protein expression observed in TAR cases.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
