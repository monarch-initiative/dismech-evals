      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: y14_lineage_dependence
        hypothesis_label: Lineage-dependent Y14 requirement
        status: ALTERNATIVE
        description: The deficit is not uniform. The regulatory alleles lower expression only in particular
          lineages and developmental windows, so the affected tissues are the ones where the variant actually
          acts, not merely the ones that need most protein. Reporter activity fell in megakaryocytic and
          osteoblast lines but not in endothelial or HEK293 cells, and Evi1, the repressor predicted to
          bind the 5'UTR minor allele, is transiently expressed in emerging limb buds. This is the model
          the rs139428292 mLOE classification presupposes.
        notes: 'The two groups are recorded as ALTERNATIVE rather than one CANONICAL and one ALTERNATIVE
          because the source explicitly declines to choose between them, and they are not mutually exclusive:
          a lineage-restricted reduction could still act by crossing a shared threshold in the tissues
          where it applies.'
      selected_evidence:
        snippet: The minor alleles were associated with significantly lower luciferase activity in human
          megakaryocytic CHRF and DAMI cell lines and the murine osteoblast cell line MC3T3.
        supports: SUPPORT
