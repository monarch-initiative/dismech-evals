          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          penetrance: INCOMPLETE
          description: Heterozygous PROC variants cause the common, incompletely penetrant mild/moderate
            deficiency.
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
          description: Homozygous or compound heterozygous PROC variants cause severe congenital protein
            C deficiency, presenting as neonatal purpura fulminans.
      selected_evidence:
        snippet: Protein C (PC) deficiency is a heritable or acquired risk factor for thrombophilia, with
