        notes: 'HP:0200067 (Recurrent spontaneous abortion) exists in HPO but is not bindable here: its
          full ancestor closure (`Recurrent spontaneous abortion -> Pregnancy history -> Past medical
          history -> All`, verified with `runoak -i sqlite:obo:hp ancestors HP:0200067`) does not pass
