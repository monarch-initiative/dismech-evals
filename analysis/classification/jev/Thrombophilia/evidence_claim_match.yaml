        - path: /has_subtypes/4
          value:
            name: Protein S Deficiency
            display_name: Protein S Deficiency
            subtype_term:
              preferred_term: protein S deficiency
              term:
                id: MONDO:0019144
                label: hereditary thrombophilia due to congenital protein S deficiency
            description: A hereditary thrombophilia caused by PROS1 variants that reduce the level or
              function of protein S, a vitamin K-dependent glycoprotein that is a non-enzymatic cofactor
              for activated protein C (and, independently, for tissue factor pathway inhibitor). Severe
              deficiency can present as neonatal purpura fulminans.
            genes:
            - preferred_term: PROS1
              term:
                id: hgnc:9456
                label: PROS1
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Warfarin-Induced Transient Anticoagulant Depletion
        subtypes:
        - Protein C Deficiency
        - Protein S Deficiency
        role: trigger
        biological_scale: ORGANISM
        description: Because protein C and protein S have short plasma half-lives (protein C approximately
          8 hours) relative to the procoagulant vitamin K-dependent clotting factors (24-72 hours), initiating
          vitamin K antagonist therapy (warfarin) without heparin bridging causes their activity to fall
          faster than that of the procoagulant factors, producing a paradoxical transient hypercoagulable
          state. This is proportionally more severe when baseline protein C or protein S activity is already
          reduced by hereditary deficiency, and can precipitate microvascular thrombosis and skin necrosis.
      selected_evidence:
        snippet: The initiation of warfarin therapy leads to a rapid decline in protein C and protein
          S levels due to their relatively short half-lives (protein C ~8 h), in contrast to other vitamin
          K-dependent clotting factors such as factors II, IX, and X (24–72 h)
        supports: SUPPORT
