          - preferred_term: rivaroxaban
            term:
              id: CHEBI:68579
              label: rivaroxaban
      selected_evidence:
        snippet: Direct oral anticoagulants (DOACs) like rivaroxaban and apixaban are emerging alternatives
          due to favorable pharmacokinetics
        supports: SUPPORT
