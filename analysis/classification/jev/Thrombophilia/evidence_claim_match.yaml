      assertion_type: Treatment
      assertion:
        name: Long-Term Oral Anticoagulation with Heparin-Bridged Initiation
        description: Long-term oral anticoagulation (vitamin K antagonists such as warfarin, or direct
          oral anticoagulants) reduces the risk of recurrent venous thromboembolism; duration is individualized
          to the risk of recurrence versus bleeding. When warfarin is used, initiation should be bridged
          with heparin and avoid high loading doses, because unbridged warfarin initiation can precipitate
          warfarin-induced skin necrosis, particularly in protein C or protein S deficiency (see Warfarin-Induced
          Transient Anticoagulant Depletion). Direct oral anticoagulants avoid this mechanism and are
          an emerging alternative in this setting.
        treatment_term:
          preferred_term: anticoagulation therapy
          term:
            id: NCIT:C63341
            label: Anticoagulation Therapy
          therapeutic_agent:
          - preferred_term: warfarin
            term:
