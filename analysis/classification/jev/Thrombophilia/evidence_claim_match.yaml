          and there is no MONDO disease term for recurrent pregnancy loss either. This is a deliberate
          needs-term/NTR gap, not an oversight.'
        description: An association between hereditary thrombophilia (particularly factor V Leiden, prothrombin
          G20210A, and protein S deficiency) and recurrent pregnancy loss has been reported, though the
          association is heterogeneous across studies and confounded by selection bias, and routine thrombophilia
          testing after pregnancy loss is not uniformly recommended.
      selected_evidence:
        snippet: With an odds ratios of 2.44 for FVL, 2.08 for PT, and a notably high 3.45 for protein
          S deficiency, their findings underscore the substantial impact of these genetic factors on RPL.
