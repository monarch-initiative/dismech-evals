      assertion_type: Pathophysiology
      assertion:
        name: Bronchial Epithelial Barrier Dysfunction Facilitating Allergen Access
        conforms_to: epithelial_barrier_dysfunction#Increased Transepithelial Allergen Penetration and
          Innate Immune Activation
        description: Asthmatic and atopic airways exhibit a dysregulated epithelial barrier — disrupted
          tight and adherens junctions, loss of terminal differentiation, and impaired innate defense
          — that pre-dates and predisposes to allergic disease. Aeroallergens, many of which carry proteolytic
          activity, further degrade epithelial tight junctions, enhancing paracellular allergen penetration
          to antigen-presenting cells in the lamina propria. This "epithelial barrier" component helps
          explain heightened susceptibility of pollen-sensitized airways to the sudden allergen load of
          a thunderstorm.
        cell_types:
        - preferred_term: bronchial epithelial cell
          term:
            id: CL:0002328
            label: bronchial epithelial cell
        biological_processes:
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: "In asthmatic \npatients abnormalities in many aspects of epithelial \nbarrier function\
          \ have been identified. We postulate that such \nabnormalities play a causal role in immune\
          \ dysregulation in the \nairways by translating \ngene-environment interactions that underpin\
          \ disease pathogenesis and \nexacerbation."
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28583446
      reference_title: Phenotypic and genetic aspects of epithelial barrier function in asthmatic patients.
