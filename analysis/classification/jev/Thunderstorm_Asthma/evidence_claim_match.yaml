      assertion_type: Pathophysiology
      assertion:
        name: Bronchoconstriction and Acute Airflow Obstruction
        description: Mast-cell-derived mediators provoke airway smooth muscle contraction (bronchospasm),
          mucosal edema, and mucus hypersecretion, producing acute variable airflow obstruction. Because
          exposure is sudden and intense and affects many sensitized individuals simultaneously, the result
          is an epidemic of acute, sometimes near-fatal, asthma attacks within a short window.
        biological_processes:
        - preferred_term: airway smooth muscle contraction
          term:
            id: GO:0006939
            label: smooth muscle contraction
          modifier: INCREASED
        cell_types:
        - preferred_term: goblet cell
          term:
            id: CL:0000160
            label: goblet cell
        notes: Goblet cells are annotated here as the source of the mucus hypersecretion component of
          acute airflow obstruction (a generic feature of asthmatic bronchoconstriction); the cited evidence
          on this node documents the epidemic outcome rather than goblet-cell biology specifically.
      selected_evidence:
        snippet: "Epidemic thunderstorm asthma (ETSA) is due to a complex \ninteraction of environmental\
          \ and individual susceptibility factors, with \noutbreaks reported globally over the last four\
          \ decades."
        supports: SUPPORT
