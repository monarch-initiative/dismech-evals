        status: CANONICAL
        description: The leading mechanistic model holds that thunderstorm outflows concentrate pollen
          at ground level where osmotic rupture releases respirable allergen-bearing paucimicronic particles
          that penetrate the lower airways of sensitized individuals, triggering epidemic asthma. Contributory
          cofactors proposed include electrical fields enhancing pollen rupture and outdoor mold spores.
      selected_evidence:
