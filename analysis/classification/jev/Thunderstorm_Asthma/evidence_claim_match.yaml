      assertion_type: Pathophysiology
      assertion:
        name: Deep Airway Deposition of Paucimicronic Allergen Particles
        description: The respirable allergen-bearing particles released by ruptured pollen are small enough
          to bypass upper-airway filtration and deposit on the bronchial epithelium of the lower airways,
          delivering a sudden, high allergen dose directly to the asthmatic effector site. This explains
          why pollen — long linked to asthma despite grains being too large to reach the bronchi — can
          trigger lower-airway disease under thunderstorm conditions.
        cell_types:
        - preferred_term: bronchial epithelial cell
          term:
            id: CL:0002328
            label: bronchial epithelial cell
      selected_evidence:
        snippet: "During the first 20-30 min of a thunderstorm, patients suffering from \npollen allergies\
          \ may inhale a high concentration of the allergenic material that \nis dispersed into the atmosphere,\
          \ which in turn can induce asthmatic reactions, \noften severe."
        supports: SUPPORT
