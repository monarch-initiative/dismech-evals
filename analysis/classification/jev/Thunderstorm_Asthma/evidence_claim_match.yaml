              label: allergic asthma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Thunderstorm Concentration and Osmotic Rupture of Pollen Grains
        description: During a thunderstorm in the pollen season, dry updrafts entrain whole pollen grains
          into the high humidity at the cloud base, where the grains imbibe water and rupture by osmotic
          shock; cold downdrafts and outflows then carry the fragments to ground level and concentrate
          them in a shallow band of air. This releases respirable allergenic particles (cytoplasmic starch
          granules and other paucimicronic components, ~0.5-2.5 µm) from grains that are themselves too
          large (>10 µm) to enter the lower airways.
        biological_processes:
        - preferred_term: response to osmotic stress (pollen grain rupture)
          term:
            id: GO:0006970
            label: response to osmotic stress
          modifier: INCREASED
        triggers:
        - preferred_term: thunderstorm outflow during pollen season
        - preferred_term: high ambient grass pollen concentration
      selected_evidence:
        snippet: thunderstorms can concentrate pollen grains at ground level which may then release allergenic
          particles of respirable size in the atmosphere after their rupture by osmotic shock
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26765082
      reference_title: 'Thunderstorm-related asthma: what happens and why.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Review of thunderstorm-asthma epidemics articulates the core mechanism: ground-level
        concentration of pollen followed by osmotic rupture releasing respirable allergen particles.'
