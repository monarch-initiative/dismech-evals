      assertion_type: Pathophysiology
      assertion:
        name: IgE-Mediated Mast Cell Activation and Type 2 Airway Inflammation
        description: In individuals sensitized to grass pollen (and/or Alternaria) allergens, the inhaled
          respirable allergen cross-links allergen-specific IgE bound to high-affinity receptors on airway
          mucosal mast cells, triggering degranulation and release of histamine, leukotrienes, and prostaglandins
          (type I immediate hypersensitivity). Recruitment of eosinophils and type 2 helper T cells amplifies
          the type 2 inflammatory response.
        cell_types:
        - preferred_term: mast cell
          term:
            id: CL:0000097
            label: mast cell
        - preferred_term: eosinophil
          term:
            id: CL:0000771
            label: eosinophil
        - preferred_term: T-helper 2 cell
          term:
            id: CL:0000546
            label: T-helper 2 cell
        biological_processes:
        - preferred_term: type I hypersensitivity
          term:
            id: GO:0016068
            label: type I hypersensitivity
          modifier: INCREASED
        - preferred_term: mast cell degranulation
          term:
            id: GO:0043303
            label: mast cell degranulation
          modifier: INCREASED
        - preferred_term: type 2 immune response
          term:
            id: GO:0042092
            label: type 2 immune response
          modifier: INCREASED
      selected_evidence:
        snippet: Twenty-three of 26 cases had IgE sensitization to Alternaria species.
        supports: SUPPORT
    origin:
