          (secondary) hypercortisolism with the ectopic Cushing syndrome phenotype - hypertension, hypokalaemic
          metabolic alkalosis, hyperglycaemia, proximal myopathy, osteoporosis and immunosuppression with
          opportunistic infection. In thymic neuroendocrine tumors this hormonal morbidity is a substantial
          and sometimes dominant contributor to mortality independent of tumor bulk, and its control is
          an urgent management priority.
