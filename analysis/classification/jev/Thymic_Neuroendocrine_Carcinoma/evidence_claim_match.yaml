  bf3c7816d4930629d8d5e3387a225b472de56872d1258a6cb84fc402e7029427:
    claim:
      about:
        disease:
          name: Thymic Neuroendocrine Carcinoma
          disease_term:
            preferred_term: thymic neuroendocrine carcinoma
            term:
              id: MONDO:0020516
              label: thymic neuroendocrine carcinoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_tnec_cell_of_origin_and_menin_sufficiency
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the thymic neuroendocrine cell of origin proposed on immunohistochemical grounds
          - a normal thymic ACTH/CRH-immunoreactive cell - actually give rise to thymic neuroendocrine
          carcinoma, and is menin loss in that cell sufficient for transformation?
        rationale: The cell-of-origin claim currently rests on the observation that non-neoplastic thymus
          contains scattered ACTH- and CRH-immunoreactive cells and that tumors from Cushing patients
          stain more strongly for both. That is a correlational immunohistochemical inference, not lineage
          tracing. No validated mouse model, organoid, patient-derived xenograft or canonical cell line
          for thymic neuroendocrine carcinoma was identified in the deep-research sweep, so neither the
          cell of origin nor the sufficiency of menin loss has been tested experimentally.
        attaches_to:
        - pathophysiology#Menin Tumor Suppressor Loss
        - pathophysiology#Ectopic Corticotropin and CRH Secretion
        proposed_experiments:
        - experiment_id: exp_tnec_thymic_ne_precursor_atlas
          name: Single-cell and spatial atlas of the putative thymic neuroendocrine precursor
          description: Profile non-neoplastic human thymus by single-cell and spatial transcriptomics
            to define the putative neuroendocrine precursor population, and match its signature against
            thymic neuroendocrine carcinoma tumor transcriptomes.
          supporting_outcome:
          - A transcriptional lineage relationship between a defined normal thymic neuroendocrine population
            and the tumor.
        - experiment_id: exp_tnec_conditional_men1_mouse
          name: Thymic-epithelial-restricted conditional Men1 inactivation
          description: Conditionally inactivate Men1 in a thymic-epithelial-lineage-restricted mouse model
            to test whether menin loss alone is sufficient to generate thymic neuroendocrine tumors.
          supporting_outcome:
          - Menin loss as a sufficient initiating lesion in the thymic epithelial lineage.
          refuting_outcome:
          - Absence of thymic tumors would indicate that additional cooperating lesions (for example RB-axis
            loss) are required.
      selected_evidence:
        snippet: The thymus contains CRH and ACTH immunoreactive cells that are probably the origin of
          thymic NET.
        supports: SUPPORT
