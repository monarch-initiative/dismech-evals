      assertion_type: HistopathologyFinding
      assertion:
        name: Absent PD-L1 expression
        finding_term:
          preferred_term: lack of expression of PD-L1
          term:
            id: NCIT:C122809
            label: Lack of Expression of PD-L1
        description: In contrast to thymoma and thymic squamous cell carcinoma, which typically show a
          PD-L1-high phenotype, PD-L1 staining was absent in a series of 27 thymic typical and atypical
          carcinoids. This is a mechanistic argument against reflexive extrapolation of checkpoint-inhibitor
          strategies from other thymic epithelial tumors to the neuroendocrine arm.
      selected_evidence:
        snippet: 'Thymic typical and atypical carcinoids are rare and appear to be more aggressive than
          similar tumors in other sites. We retrospectively analyzed a group of biomarkers that hold therapeutic
          and prognostic utility, in 27 of these tumors. ... Biomarkers stained tumor cases as follows:
          PDL-1 = 0%, PAX-5 = 0%, MET = 7.4%'
        supports: SUPPORT
