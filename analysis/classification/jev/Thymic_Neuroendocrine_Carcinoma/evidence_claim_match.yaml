            label: thymic carcinoma
        description: Overtly malignant, non-organotypic thymic epithelial carcinoma, predominantly squamous
          cell type. Curated separately in kb/disorders/Thymic_Carcinoma.yaml; deliberately not duplicated
          here. Note that MONDO places thymic neuroendocrine carcinoma beneath thymic carcinoma, so this
          is a parent entity as well as a practical differential.
        distinguishing_features:
        - Thymic squamous cell carcinoma characteristically coexpresses CD5 and CD117 (KIT). CD5 is not
          a feature of the neuroendocrine arm; CD117/KIT is less discriminating, since a proportion of
          neuroendocrine tumors are also KIT-positive, so this marker pair should not be used alone.
        - Genomics differ - conventional thymic carcinoma is dominated by CDKN2A, TP53, ASXL1 and CDKN2B
          alterations, whereas thymic neuroendocrine neoplasms are dominated by MEN1, MLL2, APC, RB1 and
          TSC2.
        - Neuroendocrine marker expression (chromogranin A, synaptophysin) is required for the neuroendocrine
          designation.
