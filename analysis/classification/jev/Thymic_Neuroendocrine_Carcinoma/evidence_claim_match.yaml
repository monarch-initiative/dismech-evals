          encodes tuberin, which with hamartin restrains RHEB and hence mTORC1; its loss releases that
          restraint and drives constitutive TOR signalling. This node - not the RB axis - is the mechanistic
          rationale for mTOR-inhibitor (everolimus) therapy in this tumor family.
