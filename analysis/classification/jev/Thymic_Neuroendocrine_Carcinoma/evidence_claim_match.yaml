            term:
              id: MONDO:0020516
              label: thymic neuroendocrine carcinoma
        context: []
      assertion_type: ProgressionInfo
      assertion:
        age_range: adulthood
        notes: Behaviour is graded. Reported 5- and 10-year overall survival in surgical series is 77%
          and 35% (Japanese multicentre, all grades) and 53% and 18% (a mediastinal typical/atypical carcinoid
          biomarker series). In a modern French national cohort restricted to locally advanced or metastatic
          disease the 5-year overall survival was 85%, better than historically reported. Prognosis is
          markedly worse for the poorly differentiated grades - in one series all 3 patients with large
          cell neuroendocrine carcinoma died of tumor progression versus 17% of atypical carcinoid patients.
          MEN1-associated disease is aggressive, with 5- and 10-year survival of 62.5% and 31.3% in a
          Finnish cohort and 10-year overall survival of 45% at a US referral centre. Late metachronous
          recurrence is characteristic, so surveillance must be prolonged.
      selected_evidence:
        snippet: Five- and 10-year-survival rates were 53% and 18%, respectively.
        supports: SUPPORT
