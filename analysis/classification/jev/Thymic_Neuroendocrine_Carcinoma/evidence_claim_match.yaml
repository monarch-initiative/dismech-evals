        role: outcome
        description: Thymic neuroendocrine carcinoma disseminates to regional mediastinal lymph nodes
          and then to bone, lung, pleura, liver and brain. Metastasis is frequently metachronous - appearing
          years after an apparently complete resection - which is why prolonged surveillance is required
          even for well-differentiated tumors. Pleural spread appears to be almost exclusively metachronous
          and may reflect perioperative dissemination. In MEN1-associated disease the metachronous-metastasis
          rate is very high.
      selected_evidence:
        snippet: 'Metastatic sites were as follows: lymph nodes (54 patients, 73%), bone (42 patients,
          65%), lung (31 patients, 42%), and pleura (31 patients, 42%).'
        supports: SUPPORT
