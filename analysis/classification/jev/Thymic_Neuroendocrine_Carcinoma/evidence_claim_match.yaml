        distinguishing_features:
        - Thymoma is organotypic and contains immature TdT-positive thymocytes; thymic neuroendocrine
          carcinoma does not.
        - Thymoma carries the classic autoimmune paraneoplastic syndromes (myasthenia gravis, pure red
          cell aplasia, Good syndrome); thymic neuroendocrine carcinoma instead carries the ectopic ACTH/Cushing
          endocrine syndrome.
        - Thymoma lacks chromogranin A / synaptophysin neuroendocrine marker expression.
        - Thymoma typically shows a PD-L1-high phenotype, whereas PD-L1 staining was absent across a series
          of thymic carcinoids.
      selected_evidence:
        snippet: thymomas and most thymic carcinomas lack currently targetable mutations, have an extraordinarily
          low tumor mutational burden, but typically have a programmed death-ligand 1high phenotype
        supports: SUPPORT
