            label: Neuroendocrine Differentiation
        frequency: OBLIGATE
        diagnostic: true
        description: Diagnosis requires neuroendocrine morphology (organoid nesting, trabeculae, rosettes;
          or sheets with high-grade cytology) together with immunohistochemical confirmation of neuroendocrine
          differentiation. Chromogranin A and synaptophysin are positive in the large majority of cases,
          and pancytokeratin positivity confirms the epithelial lineage that separates thymic neuroendocrine
          carcinoma from mediastinal paraganglioma.
