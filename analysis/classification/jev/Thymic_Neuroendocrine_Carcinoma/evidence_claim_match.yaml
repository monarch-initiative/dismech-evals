        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Germline loss-of-function variants in MEN1 cause multiple endocrine neoplasia type
          1, in which thymic neuroendocrine tumors are an uncommon but disproportionately lethal manifestation.
          Thymic carcinoids occur in 1-5% of MEN1 patients; conversely a quarter to a third of thymic
          neuroendocrine neoplasms arise on a MEN1 background.
        features: Both truncating point variants and whole-exon copy-number variants are represented;
          no thymic-specific genotype-phenotype correlation has been established.
        case_fractions:
        - population: French national advanced thymic NET cohort (GTE / ENDOCAN RENATEN / RYTHMIC)
          case_fraction_percent: 34.0
          cohort_size: 74
          notes: Proportion of patients with locally advanced or metastatic thymic NET who carried the
            MEN1 inherited syndrome.
        inheritance:
        - name: MEN1 autosomal dominant predisposition
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          description: MEN1 syndrome is inherited in an autosomal dominant manner; the thymic tumor itself
            arises after somatic loss of the second allele.
      selected_evidence:
        snippet: Thymic carcinoids are rare neuroendocrine tumors that occur in 1-5 % of patients with
          multiple endocrine neoplasia type 1 (MEN1) and are a major cause of morbidity and mortality.
        supports: SUPPORT
