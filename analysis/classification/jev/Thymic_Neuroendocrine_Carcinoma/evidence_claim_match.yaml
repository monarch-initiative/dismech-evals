            term:
              id: MONDO:0020516
              label: thymic neuroendocrine carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Menin Tumor Suppressor Loss
        biological_scale: MOLECULAR
        role: trigger
        description: Biallelic inactivation of MEN1, which encodes the chromatin-adaptor tumor suppressor
          menin, is the best-established initiating lesion of thymic neuroendocrine neoplasia. In multiple
          endocrine neoplasia type 1 a germline loss-of-function MEN1 variant is followed by somatic loss
          of the remaining allele in the thymic precursor; MEN1 is also the top-ranked somatically altered
          gene in thymic neuroendocrine neoplasms overall. Roughly a quarter to a third of thymic neuroendocrine
          neoplasms arise on a MEN1 background, and thymic disease is a disproportionate contributor to
          MEN1 mortality.
        genes:
        - preferred_term: MEN1
          term:
            id: hgnc:7010
            label: MEN1
        locations:
        - preferred_term: thymus
          term:
            id: UBERON:0002370
            label: thymus
        cell_types:
        - preferred_term: thymic epithelial cell with neuroendocrine differentiation
          term:
            id: CL:0002293
            label: epithelial cell of thymus
      selected_evidence:
        snippet: About 25% of the tumors are related to multiple endocrine neoplasia type I (MEN-1), where
          they contribute significantly to mortality.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
