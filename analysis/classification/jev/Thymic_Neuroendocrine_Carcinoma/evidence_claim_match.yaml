  b6cb9eca483b3c930c563d3f221a688ec712970dbab7fb6b58dc5cfc14b99102:
    claim:
      about:
        disease:
          name: Thymic Neuroendocrine Carcinoma
          disease_term:
            preferred_term: thymic neuroendocrine carcinoma
            term:
              id: MONDO:0020516
              label: thymic neuroendocrine carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RB-Axis Tumor Suppressor Loss
        biological_scale: MOLECULAR
        role: trigger
        conforms_to: evading_growth_suppressors#Tumor Suppressor Inactivation
        description: RB1 is among the top-ranked somatically altered genes in thymic neuroendocrine neoplasms.
          Loss of the RB axis removes the antiproliferative brake that gates G1/S transit - the conserved
          hallmark route modeled in the evading_growth_suppressors module. This node is the entry point
          for the high-grade (large cell neuroendocrine carcinoma and small cell) end of the spectrum,
          where the classic poorly differentiated neuroendocrine RB1/TP53-loss biology applies.
        genes:
        - preferred_term: RB1
          term:
            id: hgnc:9884
            label: RB1
        biological_processes:
        - preferred_term: regulation of cell cycle
          term:
            id: GO:0051726
            label: regulation of cell cycle
          modifier: ABNORMAL
        notes: Conformance caveat. The conforms_to link is asserted at the module's trigger node on the
          strength of thymus-specific panel-sequencing data showing recurrent RB1 alteration - RB1 is
          squarely inside the module's RB/p53-axis scope. The other recurrently altered thymic neuroendocrine
          tumor suppressors (KMT2D, APC, TSC2) are deliberately modeled as separate nodes because they
          are not RB/p53 axis lesions. Downstream checkpoint-loss mechanics in thymic neuroendocrine carcinoma
          specifically have not been dissected experimentally and are extrapolated from pulmonary and
          extrapulmonary high-grade neuroendocrine carcinoma; the disease-specific edge is therefore not
          asserted beyond the proliferation node.
      selected_evidence:
        snippet: those in TNENs were in MEN1, MLL2, APC, RB1 , and TSC2 .
        supports: SUPPORT
    origin:
