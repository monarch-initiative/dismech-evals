      assertion:
        name: Ectopic Corticotropin and CRH Secretion
        biological_scale: CELLULAR
        role: consequence
        description: The normal thymus contains scattered ACTH- and CRH-immunoreactive cells, and thymic
          neuroendocrine tumors are correspondingly immunoreactive for both hormones; tumors from patients
          with Cushing syndrome stain more strongly for both than those without. Autonomous, non-pituitary
          secretion of ACTH (with a probable contribution from tumoral CRH) drives bilateral adrenocortical
          stimulation and ACTH-dependent hypercortisolism. This is the signature functional paraneoplastic
          syndrome of the thymic neuroendocrine family and frequently brings the tumor to attention before
          it is otherwise symptomatic.
        biological_processes:
        - preferred_term: corticotropin secretion
          term:
            id: GO:0051458
            label: corticotropin secretion
          modifier: INCREASED
        - preferred_term: peptide hormone secretion
          term:
            id: GO:0030072
            label: peptide hormone secretion
          modifier: INCREASED
        cell_types:
        - preferred_term: thymic neuroendocrine tumor cell
          term:
            id: CL:0000165
            label: neuroendocrine cell
      selected_evidence:
        snippet: Ten NET were CRH immunoreactive and 6 were ACTH immunoreactive. Thymic NET with CS exhibited
          stronger immunoreactivity for ACTH and CRH than those without CS.
        supports: SUPPORT
