      assertion_type: Phenotype
      assertion:
        category: Neoplasm
        name: Thymic neuroendocrine tumor
        frequency: OBLIGATE
        diagnostic: true
        description: The defining lesion - a neuroendocrine neoplasm of the thymus. Historically labelled
          thymic carcinoid, it is a malignant thymic epithelial tumor with neuroendocrine morphology and
          marker expression.
        phenotype_term:
          preferred_term: Thymic neuroendocrine neoplasm
          term:
            id: HP:0100521
            label: Neoplasm of the thymus
        notes: Term choice. HP:0034954 Thymic carcinoid tumor ("A primary thymic neuroendocrine tumor")
          reads as the obvious match on its label, but under the 2021 WHO scheme "carcinoid" denotes only
          the well- and moderately-differentiated grades. This entry deliberately spans all four grades
          including large cell neuroendocrine carcinoma and small cell carcinoma, which are not carcinoids,
          so HP:0034954 is narrower than the disease it would be annotating. HP:0100521 Neoplasm of the
          thymus is used instead as the nearest term that covers the whole graded spectrum; the neuroendocrine
          qualification is carried by preferred_term and by the subtype-level MONDO terms. An HPO NTR
          for a grade-agnostic "thymic neuroendocrine neoplasm" class would resolve this properly.
      selected_evidence:
        snippet: Thymic carcinoids or neuroendocrine neoplasms (t-NEN) are a rare entity with a dismal
          prognosis.
        supports: SUPPORT
