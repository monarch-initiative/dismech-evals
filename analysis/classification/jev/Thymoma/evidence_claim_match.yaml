              id: MONDO:0006456
              label: thymoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gtf2i_wildtype_driver_unknown
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#GTF2I-driven thymic epithelial transformation
        status: OPEN
        prompt: What drives the substantial fraction of thymomas that carry no GTF2I mutation and no other
          detectable somatic driver?
        rationale: The oncogenic arm of this entry is built almost entirely on GTF2I, which is honest
          to the evidence but covers only part of the disease. Prospective sequencing with a thymic-tumour-dedicated
          77-gene panel found GTF2I mutations in 41 percent of patients and NO mutation at all in 39 percent,
          and the authors report a pattern of mutually exclusive and co-occurring mutations suggesting
          that GTF2I-wildtype thymoma has a distinct pathogenesis rather than being a diluted version
          of the same one. Curators should therefore not extend GTF2I-derived mechanism to thymoma as
          a whole. The gap is partly technical - epithelial cells were absent from some dissociated tumours,
          so the driver may be present but unsampled in a lymphocyte-dominated specimen - and partly biological,
          since a non-mutational (epigenetic or structural) driver would be invisible to a targeted panel
          by construction.
        proposed_experiments:
        - experiment_id: exp_gtf2i_wildtype_epithelium_enriched_wgs
          name: Epithelium-enriched whole-genome and methylome profiling of GTF2I-wildtype thymoma
          description: Apply whole-genome sequencing plus methylation and structural-variant calling to
            flow-sorted or laser-captured epithelial cells from GTF2I-wildtype thymomas, so that dilution
            by the abundant non-neoplastic thymocyte compartment cannot mask a driver, and so that non-coding
            and epigenetic drivers invisible to a targeted panel are within reach.
      selected_evidence:
        snippet: The absence of epithelial cells in some dissociated tumors highlights the challenge of
          identifying mutations in a subset of thymic epithelial tumors that lack the GTF2I mutation.
        supports: SUPPORT
