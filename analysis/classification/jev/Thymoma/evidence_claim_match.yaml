  69e135e7058212d63f6a0c48171b3b400e35dc6824cce990edc83da213f7eb06:
    claim:
      about:
        disease:
          name: Thymoma
          disease_term:
            preferred_term: thymoma
            term:
              id: MONDO:0006456
              label: thymoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mhc_class_ii_mg_paradox
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Reduced MHC class II antigen presentation
        status: OPEN
        prompt: If reduced MHC class II expression contributes to tolerance failure, why is better-preserved
          MHC class II expression the feature that actually tracks with the presence of myasthenia gravis?
        rationale: 'This entry curates reduced MHC class II antigen presentation as a tolerance-failure
          mechanism, and that reduction is real and most pronounced in WHO types A and AB. But in the
          same study, among all the abnormalities assessed, only better-preserved MHC class II levels
          were significantly associated with the presence of myasthenia gravis - and myasthenia gravis
          is clinically most frequent in types B1 and B2, not A and AB. A coherent reading is that two
          requirements pull in opposite directions: escape of autoreactive clones needs defective negative
          selection, but their activation still needs enough class II to present the neuromuscular autoantigen.
          This entry currently models only the first. Until this is resolved, the reduced-MHC class-II
          node should not be read as a monotonic driver of myasthenia gravis risk. Prospective sequencing
          data point the same way from a different direction: GTF2I mutation, which marks the same A/AB
          histotypes that carry the lowest class II, is prevalent specifically in patients WITHOUT myasthenia
          gravis. Any resolution has to account for both observations together.'
        proposed_experiments:
        - experiment_id: exp_mhcii_mg_stratified_by_histotype
          name: MHC class II expression versus MG status stratified by WHO histotype
          description: Stratify MHC class II expression against myasthenia gravis status within each WHO
            histotype, so the histotype confound (A and AB have both the lowest class II and the least
            myasthenia gravis) is separated from any independent effect of class II level on risk.
        - experiment_id: exp_nmtec_restricted_class_ii
          name: nmTEC-restricted versus bulk tumour MHC class II
          description: Test whether MHC class II expression restricted to the neuromuscular antigen-expressing
            medullary thymic epithelial cell compartment, rather than bulk tumour class II, is what determines
            myasthenia gravis risk. This would reconcile the two directions by locating the requirement
            for class II in a specific niche.
      selected_evidence:
        snippet: Among all theses abnormalities, only better preserved expression levels of MHCII (P <
          0.001) in thymomas were significantly associated with the presence of MG.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18567864
      reference_title: 'Common cellular and diverse genetic basis of thymoma-associated myasthenia gravis:
        role of MHC class II and AIRE genes and genetic polymorphisms.'
      evidence_source: HUMAN_CLINICAL
      explanation: States the observation that runs against a simple reduced-class-II-drives-MG reading,
        which is what makes this an open question rather than a settled mechanism.
