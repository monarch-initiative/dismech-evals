  d24d9c04a08418e84fd7455db287eafa8465b037364352ecb4ac7e2b0d0b787e:
    claim:
      about:
        disease:
          name: Thymoma
          disease_term:
            preferred_term: thymoma
            term:
              id: MONDO:0006456
              label: thymoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Checkpoint-blockade-unmasked immune-related toxicity
        biological_scale: ORGANISM
        description: Pharmacologic PD-1/PD-L1 blockade in thymoma removes a peripheral brake on a T-cell
          repertoire that was already incompletely purged of autoreactive clones, producing severe (grade
          3-5) immune-related adverse events at a rate far above that seen in thymic carcinoma treated
          with the same agents. This node is a treatment-toxicity consequence of the same tolerance defect
          that drives the spontaneous paraneoplastic syndromes, not an independent mechanism.
        notes: Deliberately carries no biological_processes descriptor. The defective thymic selection
          that predisposes to this toxicity is modelled once, upstream, on "Central tolerance failure
          in the thymic microenvironment"; repeating it here would duplicate a cause onto its own distal
          consequence. The evidence attached to this node is clinical irAE incidence and says nothing
          about any intrathymic process, so no descriptor would be evidence-supported here.
      selected_evidence:
        snippet: Although immune checkpoint blockers (ICB) are a potential treatment strategy, their efficacy
          seems limited with an increased risk of immune-related adverse events (ir-AEs), thus hampering
          their application in daily clinical practice.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36592506
      reference_title: 'Immune checkpoint blockers in patients with unresectable or metastatic thymic
        epithelial tumours: A meta-analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: Meta-analysis of six phase I/II trials establishes excess immune-related toxicity as
        the dominant limitation of checkpoint blockade in thymic epithelial tumours.
