              label: thymoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gtf2i_mouse_no_autoimmunity
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Impaired thymic epithelial progenitor differentiation
        status: OPEN
        prompt: Why does the Gtf2i-mutant mouse reproduce the thymic epithelial architecture defect of
          human thymoma without reproducing the autoimmunity that defines the human disease?
        rationale: The mouse model recapitulates the upstream half of the dismech causal chain - aberrant
          thymic architecture, impaired medullary differentiation, a cortex-like epithelial signature
          - yet TCR repertoire analysis shows intrathymic selection remains efficient and no autoimmunity
          develops. That matters mechanistically, because the disease-level claim in this entry is that
          the medulla-poor architecture is what causes tolerance failure. The mouse dissociates the two,
          implying that either an additional human-specific factor is required (the CTLA-4 and PTPN22
          risk polymorphisms reported in thymoma-associated myasthenia gravis are candidates) or that
          the relevant lesion is the frank neoplastic mass rather than the differentiation skew the transgenic
          reproduces. Curators should not treat this mouse as evidence for the autoimmunity arm of the
          graph.
        proposed_experiments:
        - experiment_id: exp_gtf2i_autoimmune_permissive_background
          name: Gtf2i L424H on autoimmune-permissive genetic backgrounds
          description: Cross the Gtf2i L424H allele onto autoimmune-permissive backgrounds, or combine
            it with the CTLA-4 and PTPN22 risk variants reported in human thymoma-associated myasthenia
            gravis, and re-assess autoantibody development and neuromuscular phenotype. A positive result
            would show the architecture defect is necessary but not sufficient for autoimmunity.
        - experiment_id: exp_gtf2i_mouse_human_epithelium_comparison
          name: Direct comparison of transgenic and human thymoma epithelium
          description: Compare TCR repertoire and tissue-restricted antigen expression in the transgenic
            epithelium against human thymoma tissue, to establish whether the mouse reaches the same degree
            of AIRE loss and MHC class II reduction that human thymomas show. If it does not, the mismatch
            is one of degree rather than of species-specific biology.
      selected_evidence:
        snippet: TCR repertoire analysis of the cytopenic T cell compartment indicates efficient intrathymic
          selection; hence, despite marked homeostatic proliferation of T cell clones, autoimmunity is
          not observed.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36175547
