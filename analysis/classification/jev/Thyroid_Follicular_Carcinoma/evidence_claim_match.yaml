      assertion_type: Pathophysiology
      assertion:
        name: RAS and PAX8-PPARG Driver Alterations
        genetic_context:
          variant_origin: SOMATIC
        description: Early oncogenic events in follicular thyroid carcinoma are dominated by activating
          point mutations in the RAS family (NRAS, HRAS, KRAS) and by the PAX8-PPARG gene fusion arising
          from a t(2;3)(q13;p25) translocation. These truncal alterations occur in thyroid follicular
          cells and define the "RAS-like" molecular class of follicular-patterned thyroid tumors. Mutant
          RAS is locked in the active GTP-bound state, and the chimeric PAX8-PPARG protein exhibits neomorphic
          transcriptional activity dysregulating differentiation and metabolism.
        cell_types:
        - preferred_term: thyroid follicular cell
          term:
            id: CL:0002258
            label: thyroid follicular cell
        locations:
        - preferred_term: thyroid gland
          term:
            id: UBERON:0002046
            label: thyroid gland
        genes:
