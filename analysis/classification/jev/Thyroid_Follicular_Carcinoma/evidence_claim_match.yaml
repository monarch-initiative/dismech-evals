      assertion_type: Pathophysiology
      assertion:
        name: TERT Promoter Mutation in Tumor Progression
        description: TERT promoter mutation is a secondary, progression-associated somatic event rather
          than a truncal driver. It is the second most frequently mutated gene in follicular thyroid carcinoma
          and is associated with distant metastasis, advanced stage, recurrence and disease-specific mortality.
          It is entered here as a separate progression arm converging on distant metastasis, because the
          published evidence links the mutation to metastatic outcome rather than placing it in the truncal
          RAS/PAX8-PPARG sequence.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: TERT
          term:
            id: hgnc:11730
            label: TERT
      selected_evidence:
        snippet: TERT promoter mutations were associated with distant metastasis, advanced TNM stage,
          recurrence and disease-specific mortality.
        supports: SUPPORT
