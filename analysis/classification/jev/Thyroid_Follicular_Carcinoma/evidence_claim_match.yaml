            id: hgnc:7989
            label: NRAS
        - preferred_term: HRAS
          term:
            id: hgnc:5173
            label: HRAS
        - preferred_term: KRAS
          term:
            id: hgnc:6407
            label: KRAS
        - preferred_term: PAX8
          term:
            id: hgnc:8622
            label: PAX8
        - preferred_term: PPARG
          term:
            id: hgnc:9236
            label: PPARG
      selected_evidence:
        snippet: In 134 samples, genetic tests for N/H/KRAS and TERT promoter mutations and PAX8/PPARγ
          rearrangement were performed.
        supports: SUPPORT
