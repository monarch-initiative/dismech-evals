            id: GO:0007265
            label: Ras protein signal transduction
        - preferred_term: MAPK cascade
          modifier: INCREASED
          term:
            id: GO:0000165
            label: MAPK cascade
        - preferred_term: PI3K/AKT signal transduction
          modifier: INCREASED
          term:
            id: GO:0043491
            label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
        genes:
        - preferred_term: PTEN
          term:
            id: hgnc:9588
            label: PTEN
      selected_evidence:
        snippet: In a healthy cell, PTEN dephosphorylates Akt to maintain proper signaling balance; however,
          loss-of-function mutations in PTEN, which we observed in over 10% of samples
        supports: SUPPORT
