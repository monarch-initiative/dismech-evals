          term:
            id: hgnc:8622
            label: PAX8
        - preferred_term: PPARG
          term:
            id: hgnc:9236
            label: PPARG
      selected_evidence:
        snippet: NRAS mutations were more frequent in metastatic tumors (42.4%) than primary tumors (29.2%).
        supports: SUPPORT
