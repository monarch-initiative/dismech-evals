        name: MAPK and PI3K-AKT Pathway Activation
        description: RAS-family mutations and PI3K-pathway lesions co-activate the MAPK (RAS-RAF-MEK-ERK)
          and PI3K/AKT cascades. In follicular thyroid carcinoma the PI3K/AKT arm is especially prominent,
          promoting cell growth, survival, metabolism, and invasive behavior, while moderate "RAS-like"
          MAPK output is associated with the follicular architecture.
        biological_processes:
        - preferred_term: Ras protein signal transduction
          modifier: INCREASED
