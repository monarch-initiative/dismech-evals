      assertion:
        name: Cutaneous Inoculation, Peripheral Viral Replication, and Primary Viremia
        description: Following inoculation of TBEV via tick bite into the skin (or across the gastrointestinal
          tract after dairy ingestion), the virus replicates locally in cutaneous dendritic cells, drains
          to regional lymph nodes, and establishes a primary viremia that causes the first febrile phase
          of biphasic illness with transient bone marrow suppression (leukopenia and thrombocytopenia)
          and mild hepatic injury.
