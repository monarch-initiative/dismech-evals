      assertion:
        name: TBE Virus-Specific IgM ELISA and Plaque Reduction Neutralization Test (PRNT)
        description: Laboratory diagnosis of tick-borne encephalitis is established primarily by detection
          of TBEV-specific IgM and IgG antibodies in serum or cerebrospinal fluid by ELISA at the onset
          of neurologic symptoms, confirmed by plaque reduction neutralization testing (PRNT) to exclude
          flavivirus cross-reactivity or demonstrate a >=4-fold neutralizing titer rise between acute
          and convalescent sera.
        diagnosis_term:
          preferred_term: laboratory examination
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
      selected_evidence:
        snippet: Plaque reduction neutralization tests can be performed to discriminate between cross-reacting
          antibodies attributable to another primary flavivirus infection or to confirm recent TBE virus
          infection on the basis of a fourfold or higher increase in virus-specific neutralizing antibodies
          between acute- and convalescent-phase serum specimens.
        supports: SUPPORT
