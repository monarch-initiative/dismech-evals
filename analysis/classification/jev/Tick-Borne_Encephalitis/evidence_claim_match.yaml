          envelope (E) glycoprotein neutralizing epitopes.
        infectious_agent_term:
          preferred_term: Tick-borne encephalitis virus
          term:
            id: NCBITaxon:11084
            label: Tick-borne encephalitis virus
      selected_evidence:
        snippet: TBE virus is a single-stranded RNA virus in the genus Flavivirus, family Flaviviridae
          (4). TBE virus is closely related to Powassan virus, a tickborne flavivirus transmitted in parts
          of the United States (5). The three main antigenic subtypes of TBE virus (i.e., European, Siberian,
          and Far Eastern) differ in the severity of disease they cause and geographic distribution
        supports: SUPPORT
