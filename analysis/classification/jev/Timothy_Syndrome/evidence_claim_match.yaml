      assertion_type: Pathophysiology
      assertion:
        name: Fever-triggered CaV1.2 activation and lowered arrhythmia/seizure threshold
        role: trigger
        description: Elevated body temperature activates the CaV1.2 L-type calcium channel. Superimposed
          on the CACNA1C gain-of-function lesion, fever is hypothesized to further augment the persistent
          inward calcium current, acutely lowering the threshold for both ventricular arrhythmia and seizures.
          In a zebrafish cacna1c model this was sufficient to elicit arrhythmia and seizure-like behavior
          even in overtly normal heterozygotes, framing fever as an acute, modifiable exacerbating factor
          rather than a fixed trait. This node and its downstream edges are part of the emerging fever_exacerbated_cav1.2
          hypothesis.
        gene:
          preferred_term: CACNA1C
          term:
            id: hgnc:1390
            label: CACNA1C
        molecular_functions:
        - preferred_term: voltage-gated calcium channel activity
          term:
            id: GO:0005245
            label: voltage-gated calcium channel activity
          modifier: INCREASED
        biological_processes:
        - preferred_term: cellular response to heat
          term:
            id: GO:0034605
            label: cellular response to heat
          modifier: INCREASED
      selected_evidence:
        snippet: fever, known to activate CaV1.2 channels, may exacerbate TS, yet its impact is poorly
          understood
        supports: SUPPORT
