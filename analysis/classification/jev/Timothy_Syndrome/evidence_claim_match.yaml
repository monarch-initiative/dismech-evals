      assertion_type: Definition
      assertion:
        name: Fever-associated arrhythmia/seizure case-finding query for latent CACNA1C carriers
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: MECHANISTIC_HYPOTHESIS
        validation_status:
          status: PROPOSED
          rationale: Drafted from the zebrafish fever-exacerbation result; never executed against a human
            EHR/OMOP dataset, so no PPV/sensitivity is characterized.
        attaches_to:
        - pathophysiology#Fever-triggered CaV1.2 activation and lowered arrhythmia/seizure threshold
        description: 'Proposed EHR/OMOP case-finding query: identify individuals with a new ventricular
          arrhythmia / QT-prolongation event or a new seizure within a short window after a documented
          febrile episode, absent a prior such event, as candidate latent or mild CACNA1C-spectrum cases.
          The query operationalizes the emerging fever_exacerbated_cav1.2 hypothesis (fever activates
          CaV1.2 and can unmask arrhythmia/seizures even in overtly normal carriers); a positive yield
          is itself partial evidence for that hypothesis.'
        scope: EHR/OMOP case-finding; HYPOTHESIS-GENERATING, NOT a validated diagnostic or consensus phenotype
          algorithm. Predicated on an unproven mechanism (fever_exacerbated_cav1.2) whose human validity
          is an open question.
        criteria_sets:
        - name: Febrile-onset rhythm disturbance or seizure
          description: Documented fever (temperature or febrile-illness diagnosis code) followed within
            a short window (e.g. days) by a NEW ventricular arrhythmia / long-QT event or a new seizure,
            with no prior arrhythmia/seizure history. Temporal window and code sets to be specified at
            implementation.
          inclusion_criteria:
          - preferred_term: Documented febrile episode
            description: Elevated body temperature or a febrile-illness diagnosis code (index exposure).
          - preferred_term: New post-fever arrhythmia or seizure
            description: First ventricular arrhythmia / QT-prolongation event or first seizure occurring
              shortly after the febrile episode.
          exclusion_criteria:
          - preferred_term: Pre-existing arrhythmia or epilepsy
            description: Prior history of the same event type, which would confound the fever-provoked
              interpretation.
        notes: Hypothesis-based, unvalidated case-finding query — not a consensus or gold-standard-validated
          phenotype algorithm. Its epistemic status is carried structurally by derivation_basis (MECHANISTIC_HYPOTHESIS),
          the validation_status object (PROPOSED), and attaches_to the fever-trigger pathophysiology node,
          so the hypothesis basis is inferred from the pathograph (fever_exacerbated_cav1.2). See monarch-initiative/dismech#6245.
      selected_evidence:
        snippet: elevated water temperature elicited arrhythmia and seizure-like behavior even in overtly
          normal heterozygotes, implicating fever as a modifiable risk
        supports: SUPPORT
    origin:
      assertion_path: /definitions/2
      evidence_path: /definitions/2/evidence/0
      context_paths:
