      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: fever_exacerbated_cav1.2
        hypothesis_label: Fever/elevated body temperature lowers the threshold for CaV1.2-driven arrhythmia
          and seizures
        status: EMERGING
        description: 'Elevated body temperature activates the CaV1.2 L-type calcium channel and is hypothesized
          to augment the mutant persistent inward calcium current, so febrile episodes may acutely unmask
          ventricular arrhythmia and lower the seizure threshold — even in CACNA1C carriers who are overtly
          normal at baseline. This frames fever as a modifiable risk factor and, at a population level,
          as a candidate signal for scanning electronic health records for latent or mild CACNA1C-spectrum
          cases (e.g. a new rhythm disturbance or seizure temporally following a documented fever). The
          hypothesis is currently supported by a zebrafish cacna1c model; its validity in human patients
          is an open question (see the linked HUMAN_MODEL_MISMATCH discussion). Downstream causal edges
          that belong to this hypothesis opt in via hypothesis_groups: [fever_exacerbated_cav1.2].'
      selected_evidence:
        snippet: elevated water temperature elicited arrhythmia and seizure-like behavior even in overtly
          normal heterozygotes, implicating fever as a modifiable risk
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42426269
      reference_title: Elevated body temperature exacerbates arrhythmia and seizure-like activity in a
        zebrafish model of Timothy syndrome.
      evidence_source: MODEL_ORGANISM
      explanation: In a zebrafish cacna1c Timothy-syndrome model, raising temperature elicited arrhythmia
        and seizure-like behavior even in phenotypically normal heterozygotes, directly motivating the
        fever-exacerbation hypothesis.
