          name: Tonne-Kalscheuer Syndrome
          disease_term:
            preferred_term: intellectual disability, X-linked 61
            term:
              id: MONDO:0010506
              label: intellectual disability, X-linked 61
        context: []
      assertion_type: Genetic
      assertion:
        name: RLIM
        gene_term:
          preferred_term: RLIM
          term:
            id: hgnc:13429
            label: RLIM
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: RLIM (RNF12, Xq13.2) encodes a RING-H2 E3 ubiquitin ligase. Every reported disease
          allele is a missense variant; truncating variants have not been reported, and the gene is highly
          intolerant to loss-of-function variation. Variants cluster in the basic region (required for
          chromatin recruitment and substrate targeting) and in the C-terminal RING catalytic domain.
        variants:
        - name: p.Arg611Cys
          description: Recurrent missense variant at the conserved linchpin arginine of the RING domain;
            the main cause of antenatal and perinatally lethal TOKAS.
          clinical_significance: PATHOGENIC
        - name: p.Tyr356Cys
          description: Missense variant in the conserved domain that binds LIM-homeodomain transcription
            factors; identified in the original Norwegian family, in which affected males survived into
            adulthood.
          clinical_significance: PATHOGENIC
        - name: p.Tyr421Cys
          description: Missense variant adjacent to the basic region that destabilizes the protein and
            impairs E3 ligase activity; reported in a neonate who died of congenital diaphragmatic hernia.
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: All RLIM variants identified are missense changes co-segregating with the phenotype and
          predicted to affect protein function.
        supports: SUPPORT
    origin:
