        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tokas_malformation_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which RLIM substrates and gene expression programmes connect reduced RLIM ligase activity
          to diaphragmatic hernia, differences of sex development and the other malformations of TOKAS?
        attaches_to:
        - pathophysiology#Impaired RLIM E3 Ubiquitin Ligase Activity
        - phenotypes#Congenital diaphragmatic hernia
        - phenotypes#Differences of sex development
        rationale: The substrate-level defects (REX1, SMAD7) and the accelerated neural differentiation
          are shown only in mouse embryonic stem cells. No study has connected them to diaphragm, genital,
          heart or limb development. Only the diaphragmatic hernia, which PMID:33953269 names as a feature
          caused by disrupted RLIM function through unidentified programmes, carries a causal edge; the
          other malformations and the neurodevelopmental features are left without an upstream mechanism
          node rather than wired to one no source connects them to.
      selected_evidence:
        snippet: However, the relevant gene expression programmes that are disrupted to cause the syndromic
          features of TOKAS, such as diaphragmatic hernia, are yet to be elucidated.
        supports: SUPPORT
