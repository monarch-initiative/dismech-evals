        description: The convergence point of the variant classes. THAP1 is a zinc-finger transcription
          factor, and disease variants reduce its regulatory output either by impairing sequence-specific
          DNA binding, by reducing protein stability and so effective dosage, or by abolishing recruitment
          of the HCFC1 cofactor at promoters THAP1 still binds. The last of these is the reason a variant
          can be pathogenic with normal DNA binding.
        molecular_functions:
        - preferred_term: sequence-specific DNA binding by the THAP zinc-finger domain
          modifier: DECREASED
          term:
            id: GO:0043565
            label: sequence-specific DNA binding
