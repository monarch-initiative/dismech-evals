            species: Mouse
            genotype: Thap1 heterozygous null
            publication: PMID:30590536
            description: 'The genotype that should, in principle, model human THAP1 haploinsufficiency.
              Unprovoked, it does not: the mouse compensates by upregulating transcription from the intact
              allele and has no discernable phenotype. Given a second hit it does. After sciatic nerve
              crush, Thap1+/- mice show significantly more dystonia-like movements than naive Thap1+/-
              mice and than injured wild-type mice, so the genotype carries a real susceptibility that
              is invisible without a trigger. Both results are modelled below, as separate links, because
              they are claims about different nodes.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Reduced THAP1 Transcriptional Regulatory Function
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        model_scale: MOLECULAR
        description: 'The model fails at the first node it is meant to reproduce: transcriptional autoregulation
          restores Thap1 message, so the haploinsufficient state the human disease depends on is not established.'
        limitations: 'Thap1 mRNA is autoregulated in mouse, with upregulation at the non-affected locus,
          so heterozygous deletion does not produce a reduced-dosage state. Germline homozygous deletion
          cannot be used instead because it is embryonic lethal. The failure is a species difference in
          gene dosage compensation, not a limitation of the construct. This grading is about the molecular
          node only: the same animal does produce a dystonic phenotype after a peripheral nerve injury,
          which is recorded as a separate link below. Read together, the model is uninformative about
          steady-state THAP1 dosage and informative about gene-environment interaction.'
        divergences:
