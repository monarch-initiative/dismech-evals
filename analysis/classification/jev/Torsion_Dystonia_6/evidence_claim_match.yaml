  930e3eab31a82410ab81d9bbe21cd0003f7ea8f08a7433556b3f93ca058ed831:
    claim:
      about:
        disease:
          name: Torsion Dystonia 6
          disease_term:
            preferred_term: torsion dystonia 6
            term:
              id: MONDO:0011264
              label: torsion dystonia 6
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Derepression of TOR1A
        biological_scale: MOLECULAR
        description: 'THAP1 binds the core promoter of TOR1A and represses it; DYT6-associated mutant
          THAP1 represses it less. TOR1A is the gene mutated in DYT1 dystonia, so this is the molecular
          link between the two commonest monogenic isolated dystonias, and it is the reason a transcription-factor
          disease and a torsinA-protein disease can converge on one clinical syndrome.

          Recorded as a distinct node rather than folded into the SP1 arm because the binding is direct
          and demonstrated by promoter assay and ChIP, whereas the SP1 arm is an indirect expression-level
          effect. No downstream edge is asserted from here: how much of the dystonia is attributable to
          TOR1A derepression rather than to the wider expression change is not established by the curated
          evidence.'
        molecular_functions:
        - preferred_term: repression of the TOR1A core promoter by THAP1
          modifier: DECREASED
          term:
            id: GO:0000976
            label: transcription cis-regulatory region binding
      selected_evidence:
        snippet: Further, we report that wild type THAP1 represses the expression of TOR1A, whereas dystonia
          6-associated mutant THAP1 results in decreased repression of TOR1A.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20976771
      reference_title: The dystonia gene DYT1 is repressed by the transcription factor THAP1 (DYT6).
      evidence_source: IN_VITRO
      explanation: States both the normal repressive function and the direction of its loss in disease-associated
        mutants, which is the whole claim of this node.
