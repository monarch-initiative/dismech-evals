        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dyt6_no_genotype_phenotype_correlation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why is there no genotype-phenotype correlation in THAP1 dystonia, and what determines
          penetrance?
        attaches_to:
        - genetic#THAP1
        - pathophysiology#Isolated Dystonia
        rationale: 'More than eighty variants are known across several functional classes - DNA-binding
          missense, protein-destabilising missense, HCFC1-binding-motif missense, and truncating alleles.
          Whether they predict phenotype is disputed rather than settled: the 2011 review of 56 families
          found no relationship, while a later screen of more than 1800 subjects found that truncating
          and THAP-domain missense variants manifest earlier and involve more body regions. Both are cited
          in the genetic section. Either way the molecular assays curated in this entry do not by themselves
          predict who becomes ill or how severely.

          Penetrance is incomplete at 40 to 60 per cent, so something other than the THAP1 allele decides
          whether a carrier develops dystonia. The environmental second hit is no longer purely speculative:
          a peripheral nerve crush unmasks dystonia-like movements in the heterozygous mouse, which is
          a demonstration in principle that a trigger can convert a silent genotype into a phenotype.
          It is not a human exposure, and no precipitant is established in carriers, so the practical
          counselling question stays open.'
      selected_evidence:
        snippet: Currently, 56 families present with a THAP1 mutation; however, no genotype/phenotype
          relationship has been found.
        supports: SUPPORT
