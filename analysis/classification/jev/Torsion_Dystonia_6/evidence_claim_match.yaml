  abc10b93b0077d407ea7622191c9fff06a4c27e56fd5f5b166e8d862e337017d:
    claim:
      about:
        disease:
          name: Torsion Dystonia 6
          disease_term:
            preferred_term: torsion dystonia 6
            term:
              id: MONDO:0011264
              label: torsion dystonia 6
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dyt6_mouse_does_not_get_dystonia
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: No unprovoked Thap1 mouse develops dystonia, yet a nerve-injured heterozygote does. What
          does the need for a second hit imply about the proposed causal chain from transcriptional dysregulation
          to dystonic movement?
        attaches_to:
        - pathophysiology#Basal Ganglia and Cerebellar Motor Network Dysfunction
        - animal_models#Mouse
        rationale: 'This is a mismatch rather than a gap, because the model evidence exists and is informative
          - it simply does not reproduce the phenotype that defines the disease. Three things are established
          in mouse: germline Thap1 deletion is embryonic lethal; the heterozygote is rescued by autoregulatory
          upregulation of the intact allele and has no phenotype; and conditional deletion in neural precursors
          produces locomotor deficits and a dystonia-related transcriptional signature but not dystonia.

          The mismatch is mechanistically meaningful in two ways. First, the autoregulatory rescue is
          a species difference in gene-dosage handling, which means mouse cannot be used to test a haploinsufficiency
          hypothesis for this gene at all. Second, and more consequentially, the step in this entry''s
          pathograph from network dysfunction to dystonia is the step no model has closed unprovoked:
          the conditional mouse reaches the network node and stops. Human iPSC-derived striatal neurons
          reach the cellular node and cannot, being a dish, address circuit output.

          That framing needs qualifying, and the qualification is the interesting part. A peripheral nerve
          crush in the heterozygote does produce dystonia-like movements, exceeding both naive heterozygotes
          and injured wild-types. So the genotype is not phenotypically silent; it is latent. The unanswered
          question shifts from "why does the mouse never get it" to "what does the second hit supply".
          That reframes the human question too, since penetrance in carriers is only 40 to 60 per cent,
          and it is the reason this entry now records the gene-environment link on the heterozygous model
          rather than only the failure.

          What remains genuinely unclosed is whether the injury acts through this entry''s chain at all.
          The multi-omic differences reported in nerve-injured heterozygotes are energy-metabolism signatures
          in cerebellum, striatum and cortex, which is not obviously the SP1-mediated transcriptional
          route this pathograph models. The final causal edge is therefore still marked inferred.'
        proposed_experiments:
        - experiment_id: dyt6_reduced_dosage_without_autoregulation
          name: Knock-in of a patient THAP1 missense allele in a model without Thap1 autoregulation
          description: Test whether the absent phenotype is due to the autoregulatory rescue rather than
            to a deeper difference in motor circuitry, by using a model organism in which the compensating
            upregulation does not occur, or by engineering an allele that escapes autoregulation.
          would_support:
          - pathophysiology#Basal Ganglia and Cerebellar Motor Network Dysfunction
          supporting_outcome:
          - Dystonic posturing emerges in an animal carrying a reduced-dosage THAP1 state that is not
            autoregulatorily rescued, closing the step from network dysfunction to dystonia.
          refuting_outcome:
          - A genuinely reduced-dosage animal still shows locomotor deficit without dystonia, which would
            argue that the human phenotype depends on features of primate motor circuitry rather than
            on THAP1 dosage alone.
      selected_evidence:
        snippet: Although these mice do not exhibit dystonia, they show pronounced locomotor deficits
          reflecting derangements in the cerebellar and basal ganglia circuitry.
        supports: SUPPORT
