        notes: 'therapeutic_modality is OTHER, not SMALL_MOLECULE. Botulinum neurotoxin is a roughly 150
          kDa bacterial protein, so SMALL_MOLECULE is factually wrong, and PEPTIDE would be almost as
          wrong at that size. PROTEIN_REPLACEMENT does not apply because nothing deficient is being replaced.
          OTHER is the honest remainder. Note the KB is inconsistent here: botulinum treatments elsewhere
          carry SMALL_MOLECULE about as often as OTHER, which is worth a sweep.

          therapeutic_agent is left absent. NCIT:C163032 Botulinum Toxin and NCIT:C82623 Botulinum Toxin
          Type A both exist and were read from the NCIT cache, but the evidence below is a dystonia-management
          guideline rather than a THAP1-genotyped series, so the agent is named in the description rather
          than bound as an evidence-backed claim about this disorder specifically. The openscientist report
          offered NCIT:C1084 for botulinum toxin; that CURIE is Staphylococcal Enterotoxin B, and it was
          not used.'
