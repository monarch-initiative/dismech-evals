              label: toxoplasmosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ocular_pathogenesis_uncertainty
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: In ocular toxoplasmosis, how much of the retinal tissue destruction is caused by direct
          parasite cytolysis versus the host inflammatory response to recrudescing cysts, and what determines
          which patients suffer recurrent sight-threatening flares?
        attaches_to:
        - pathophysiology#Recurrent Necrotizing Retinochoroiditis
        rationale: The balance between parasite-driven and immune-driven damage determines whether adjunctive
          corticosteroids help or harm, yet contemporary reviews state that the mechanisms of ocular involvement
          remain elusive and that treatment of active and recurrent disease is still unresolved. This
          entry therefore does not assert a dominant damage mechanism for the ocular node.
        proposed_experiments:
        - experiment_id: exp_toxo_ocular_load_vs_cytokine
          name: Paired intraocular parasite load and cytokine profiling across the flare cycle
          description: Measure aqueous and vitreous parasite load by quantitative PCR alongside intraocular
            cytokine profiling in the same eyes during active flares and in quiescence, to establish whether
            tissue destruction tracks parasite burden or inflammatory intensity.
        - experiment_id: exp_toxo_ocular_steroid_rct
          name: Randomised adjunctive corticosteroid trial stratified by parasite load
          description: Randomise patients with active retinochoroiditis to antiparasitic therapy with
            or without adjunctive corticosteroid, stratified by baseline intraocular parasite load, with
            lesion size and visual acuity as endpoints.
      selected_evidence:
        snippet: Despite extensive research, the specific mechanisms underlying ocular involvement in
          T. gondii infection remain elusive, and current diagnostic options have limitations.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
