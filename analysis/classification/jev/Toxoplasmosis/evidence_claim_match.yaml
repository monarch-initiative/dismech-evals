        context: []
      assertion_type: EpidemiologyInfo
      assertion:
        name: Lifetime reactivation risk in untreated AIDS
        description: Up to 30% of people diagnosed with AIDS who remain untreated for HIV and receive
          no effective anti-Toxoplasma prophylaxis will reactivate latent infection over their lifetime;
          in a severely immunosuppressed Edinburgh cohort, 48% of Toxoplasma-seropositive patients with
          CD4 below 50 cells/mm3 developed cerebral toxoplasmosis. Seronegative patients are essentially
          not at risk, which is what makes baseline serology the gate for prophylaxis.
        unit: percent of at-risk patients
        factors:
        - Toxoplasma IgG seropositivity (latent reservoir present)
        - Absence of antiretroviral therapy
        - Absence of anti-Toxoplasma prophylaxis
      selected_evidence:
        snippet: The lifetime probability of a latent T. gondii infection reactivation is up to 30% in
          people diagnosed with AIDS, of whom the HIV infection remains untreated and who do not receive
          effective anti-Toxoplasma prophylaxis
