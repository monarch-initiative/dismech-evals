      assertion_type: Discussion
      assertion:
        discussion_id: antifolate_module_scope
        kind: CURATION_TODO
        status: OPEN
        prompt: Toxoplasma is treated with the same sequential DHFR/DHPS antifolate blockade that the
          bacterial_folate_synthesis_inhibition module models, but that module is explicitly scoped to
          bacteria. Should the module be generalised to eukaryotic-parasite antifolate targets, or should
          a separate protozoal module be created?
        attaches_to:
        - pathophysiology#Tachyzoite Replication and Haematogenous Dissemination
        rationale: Pyrimethamine (DHFR) plus sulfadiazine (DHPS) is mechanistically the same sequential-blockade
          pattern the existing module encodes, and the same drug class treats malaria and Pneumocystis
          pneumonia. Declaring conformance from this entry would be a category error while the module's
          stated scope, node names and evidence are bacterial, so no conforms_to has been asserted here.
          Recording the parallel is more useful than either forcing conformance or silently dropping it.
      selected_evidence:
        snippet: such as spiramycin, azithromycin, traditional Chinese medicine (TCM), pyrimethamine-
          sulfadiazine (P-S), trimethoprim-sulfamethoxazole (TMP-SMX), and pyrimethamine-clindamycin (P-C)
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26394212
      reference_title: A Systematic Review and Meta-Analysis of the Efficacy of Anti-Toxoplasma gondii
        Medicines in Humans.
      evidence_source: HUMAN_CLINICAL
      explanation: Confirms that the antifolate combinations named in this discussion are the conventional
        anti-Toxoplasma regimens, which is what makes the parallel to the bacterial antifolate module
        worth recording.
