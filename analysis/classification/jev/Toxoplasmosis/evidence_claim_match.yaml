      assertion_type: Diagnosis
      assertion:
        name: IgG avidity testing to date maternal infection
        description: Because management in pregnancy turns on whether infection preceded or followed conception,
          dating the maternal infection is decisive. High IgG avidity rules out infection acquired within
          the preceding four months, which is what allows a seropositive woman to be reassured or escalated
          to treatment and amniotic fluid PCR. Applies to the Congenital subtype.
      selected_evidence:
        snippet: IgG avidity has been shown to be useful as high avidity rules out an infection dating
          less than 4 months
        supports: SUPPORT
