  7ccdd2da118db540daa8897cae6197e31cad79af5fdbdfbb54f3d9763291163f:
    claim:
      about:
        disease:
          name: Toxoplasmosis
          disease_term:
            preferred_term: toxoplasmosis
            term:
              id: MONDO:0005989
              label: toxoplasmosis
        context: []
      assertion_type: Treatment
      assertion:
        name: Prenatal Screening with Early Treatment on Seroconversion
        description: 'Programmatic serological screening of seronegative pregnant women with prompt treatment
          on seroconversion. The evidence is genuinely mixed and is curated that way rather than resolved.
          Against benefit: the SYROCOT individual-patient-data meta-analysis found only weak evidence
          that early treatment reduced mother-to-child transmission and no significant reduction in clinical
          manifestations. For benefit: a later Spanish multicentre cohort (REIV-TOXO) found four-fold
          lower risk of clinical features at birth and six-fold lower risk of later complications in newborns
          of prenatally treated mothers, and France''s compulsory programme is associated with declining
          transmission and severity at population level. The observational designs of the supportive studies
          cannot exclude confounding by indication, which is why the SYROCOT null result is retained here
          rather than superseded.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: we found weak evidence that treatment started within 3 weeks of seroconversion reduced
          mother-to-child transmission compared with treatment started after 8 or more weeks
        supports: SUPPORT
    origin:
      assertion_path: /treatments/9
      evidence_path: /treatments/9/evidence/0
      context_paths:
