      assertion_type: Treatment
      assertion:
        name: Adjunctive Corticosteroids in Ocular Toxoplasmosis
        description: Corticosteroids are widely used alongside anti-parasitic therapy when inflammation
          threatens the macula or optic nerve, on the rationale that host inflammation contributes to
          retinal damage. A Cochrane review found NO randomised evidence either for or against this practice,
          and the dose, timing and even the direction of benefit remain unestablished. Curated deliberately
          with NO_EVIDENCE rather than omitted, because the practice is common and the absence of trial
          support is itself the clinically important fact. Directly linked to the ocular_pathogenesis_uncertainty
          discussion.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: corticosteroid
            term:
              id: CHEBI:50858
              label: corticosteroid
      selected_evidence:
        snippet: our review did not identify any evidence from randomized controlled trials for or against
          the role of corticosteroids in the management of ocular toxoplasmosis
        supports: NO_EVIDENCE
