      assertion_type: Genetic
      assertion:
        name: Toxoplasma gondii clonal lineage structure (parasite genotype)
        relationship_type: RISK_FACTOR
        notes: The clinically decisive genetic axis in toxoplasmosis is the PARASITE genome, not a host
          gene. T. gondii has an unusual population structure of three widespread clonal lineages (types
          I, II and III) with near-absent sexual recombination, and most human toxoplasmosis is associated
          with type II. No gene_term is bound because the entity is a parasite strain lineage, for which
          HGNC (a human gene nomenclature) has no applicable identifier. The ROP18/ROP5 allelic variation
          underlying the lineage-virulence difference is modelled mechanistically in the Rhoptry and Dense
          Granule Effector-Mediated Immune Subversion node.
      selected_evidence:
        snippet: Phylogenetic and statistical analyses indicated a highly unusual population structure
          consisting of 3 widespread clonal lineages.
        supports: SUPPORT
