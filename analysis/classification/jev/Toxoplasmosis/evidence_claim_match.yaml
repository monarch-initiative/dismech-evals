  74e89887bb4fb1cdf5569b33bea42638059750d6b9af16d51dbb5efb2d6d45a2:
    claim:
      about:
        disease:
          name: Toxoplasmosis
          disease_term:
            preferred_term: toxoplasmosis
            term:
              id: MONDO:0005989
              label: toxoplasmosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: no_cyst_active_therapy
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: No available drug eradicates bradyzoite tissue cysts, so chronic toxoplasmosis cannot
          be cured and reactivation risk persists for life. What would a cyst-active agent have to do,
          and does the BFD1 differentiation switch offer a tractable target?
        attaches_to:
        - pathophysiology#Lifelong Latent Tissue Cyst Persistence
        - pathophysiology#Bradyzoite Differentiation and Tissue Cyst Formation
        rationale: Every current regimen acts on the replicating tachyzoite, which is why treatment of
          encephalitis must be followed by secondary prophylaxis until immune reconstitution. Identification
          of BFD1 as a master regulator of differentiation provides a genetic handle on the stage conversion
          that creates the untreatable reservoir.
        proposed_experiments:
        - experiment_id: exp_toxo_bfd1_chemical_screen
          name: Chemical screen against BFD1-driven differentiation
          description: Screen compound libraries for agents that block BFD1-driven bradyzoite differentiation,
            or that force bradyzoite-to-tachyzoite reversion into a drug-susceptible state, using the
            BFD1 genetic switch as the readout.
        - experiment_id: exp_toxo_cyst_burden_reactivation
          name: Cyst burden reduction and reactivation incidence in vivo
          description: Test whether pharmacological reduction of brain cyst burden in chronically infected
            animals lowers the incidence of encephalitis after subsequent immunosuppression.
      selected_evidence:
        snippet: Acute-stage tachyzoites differentiate into chronic-stage bradyzoites, which form intracellular
          cysts resistant to immune clearance and existing therapies.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31955846
      reference_title: Identification of a Master Regulator of Differentiation in Toxoplasma.
      evidence_source: IN_VITRO
      explanation: Documents that existing therapies do not clear the cyst stage.
