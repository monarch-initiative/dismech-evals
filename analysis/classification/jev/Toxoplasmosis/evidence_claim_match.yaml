        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mus musculus
        category: Bradyzoite differentiation / chronic-stage model
        description: Mice are the standard system for the acute-to-chronic transition. The parasite transcription
          factor BFD1 was shown to be necessary for bradyzoite differentiation both in cell culture and
          in mice, tying the in vitro stress-induced switch to cyst formation in a living host. BFD1 is
          a Toxoplasma gene, so it is described here rather than bound to a gene descriptor, which is
          HGNC-scoped.
      selected_evidence:
        snippet: we identify a Myb-like transcription factor (BFD1) necessary for differentiation in cell
          culture and in mice.
        supports: SUPPORT
