          rescue of fertility was demonstrated in heterozygotes.
        modeled_mechanisms:
        - target: Mitochondrial dysfunction
          relationship: RECAPITULATES
          description: Taldo1-null liver shows reduced mitochondrial membrane potential, mitochondrial
            mass and ATP/ADP ratio under the studied conditions.
          limitations: Mouse liver ATP and mitochondrial mass changes differ from patient lymphoblast
            responses.
        - target: Fas apoptosis resistance and adaptive proliferation
          relationship: RECAPITULATES
          description: Taldo1-null hepatocytes resist CD95/Fas-mediated apoptosis in culture and in vivo,
            with altered beta-catenin phosphorylation and c-Jun expression.
          limitations: Fas resistance is distinct from sensitivity to oxidative necrosis.
        - target: Hepatocarcinogenesis
          relationship: RECAPITULATES
          description: Taldo1-deficient mice develop liver tumors; genetic and antioxidant interventions
            test contributions of redox stress to progression.
          limitations: Heterozygous mouse tumor risk does not establish autosomal dominant human TALDO
            deficiency.
      selected_evidence:
        snippet: Reduced beta-catenin phosphorylation and enhanced c-Jun expression in Taldo1-/- livers
          reflected adaptation to oxidative stress.
        supports: SUPPORT
