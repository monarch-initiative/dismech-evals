        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_taldo1_ppp_redox_model
        hypothesis_label: Canonical TALDO1 Pentose-Phosphate Redox Model
        status: CANONICAL
        description: Biallelic TALDO1 loss disrupts nonoxidative PPP carbon recycling and redox homeostasis.
          Liver injury, fibrosis and carcinogenesis follow partly distinct pathways. Mouse AR epistasis,
          mTOR/PON1 observations and context-dependent cell-death responses refine the canonical mechanism;
          tissue-specific causes of many extrahepatic manifestations remain unresolved.
        notes: 'The canonical proximal metabolic model is retained after assessment of the OpenScientist
          report. The report is a literature synthesis, not an executed analysis. Increased Fas apoptosis
          is not the central hepatocyte mechanism: mouse hepatocytes resist it. AR deletion restores NADPH
          and prevents HCC but not GSH depletion or cirrhosis. The mTOR/PON1/aPL findings occur in TAL
          single and TAL/AR double knockouts; patient relevance is unproven. Four heterozygous APAP cases
          treated with NAC are not a controlled trial in congenital biallelic disease. Erythronic acid
          is a variable biomarker with proposed PPP-derived routes, not a universally elevated proven
          toxin. Long-term transplant outcomes and GenCC assertions exist, contrary to report absence
          claims.'
      selected_evidence:
        snippet: Recombinant TALDeltaS171 had no enzymic activity.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15115436
      reference_title: Deletion of Ser-171 causes inactivation, proteasome-mediated degradation and complete
        deficiency of human transaldolase.
      evidence_source: IN_VITRO
      explanation: The deletion causes loss of activity and protein instability; it is not equivalent
        to removal of the bacterial catalytic lysine.
