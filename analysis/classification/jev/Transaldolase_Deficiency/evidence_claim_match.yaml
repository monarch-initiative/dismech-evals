    evidence_metadata:
      reference: PMID:30323337
      reference_title: Synthetic lethality between HER2 and transaldolase in intrinsically resistant HER2-positive
        breast cancers.
      evidence_source: IN_VITRO
      explanation: 'Corroborates the model''s proximal molecular step from outside the inborn-error literature:
        an unbiased CRISPR/Cas9 screen in HER2-amplified breast cancer cells shows that removing transaldolase
        lowers NADPH and raises reactive oxygen species. The inference step is that the effect was measured
        only in combination with HER2 blockade and in a cell type unrelated to transaldolase deficiency,
        so it speaks to the consequence of losing the enzyme and not to the patient phenotype.'
