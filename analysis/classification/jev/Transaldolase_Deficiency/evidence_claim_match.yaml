              id: MONDO:0011624
              label: transaldolase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aldose reductase-dependent polyol formation
        description: Aldose reductase converts accumulated unphosphorylated sugars to polyols while consuming
          NADPH. In mice, AR deletion prevents polyol buildup and HCC but worsens carbon trapping and
