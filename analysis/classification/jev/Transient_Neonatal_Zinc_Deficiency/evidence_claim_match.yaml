        variants:
        - name: p.His54Arg (H54R)
          description: First reported maternal allele; mutant protein accumulates perinuclearly and secretes
            less zinc.
        - name: p.Gly87Arg (G87R)
          description: Heterozygous dominant-negative allele found in Ashkenazi Jewish mothers and in
            a Swiss family.
        - name: p.Glu88Lys (E88K)
          description: Homozygous maternal allele; functional analysis suggested strong disruption of
            zinc secretion.
      selected_evidence:
        snippet: SLC30A2 | HGNC:11013 | zinc deficiency, transient neonatal | MONDO:0011973 | AD | Definitive
        supports: SUPPORT
