  cf11bef71fb087ddf6511d315ab3ad482985fc9e3bf87b87c18b964ce2cf4baa:
    claim:
      about:
        disease:
          name: Transient Neonatal Zinc Deficiency
          disease_term:
            preferred_term: zinc deficiency, transient neonatal
            term:
              id: MONDO:0011973
              label: zinc deficiency, transient neonatal
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Maternal SLC30A2 Loss of Function
        biological_scale: MOLECULAR
        role: initiating lesion (mother)
        description: Germline SLC30A2 variants in the mother inactivate ZnT2, the zinc transporter that
          loads zinc into the secretory vesicles of lactating mammary epithelial cells. Missense alleles
          act in two ways. H54R and G87R mutants are retained in the endoplasmic reticulum or aggregate
          perinuclearly and are unstable, and G87R also pulls wild-type ZnT2 into nonfunctional dimers
          (dominant negative). G280R, T312M and E355Q hit residues for zinc coordination or permeation,
          still reach vesicles and do not inhibit the wild-type protein, implying haploinsufficiency.
          Splice-altering and promoter variants have also been reported. A single heterozygous allele
          usually suffices; compound heterozygous (W152R with S296L) and homozygous (E88K) mothers have
          also been described, the latter with earlier onset in the infant.
        genes:
        - preferred_term: SLC30A2
          term:
            id: hgnc:11013
            label: SLC30A2
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          gene:
            preferred_term: SLC30A2
            term:
              id: hgnc:11013
              label: SLC30A2
          notes: Describes the mother's genotype. The affected infant's own SLC30A2 genotype does not
            determine the disease.
        cell_types:
        - preferred_term: mammary gland epithelial cell
          term:
            id: CL:0002327
            label: mammary gland epithelial cell
        molecular_functions:
        - preferred_term: zinc:proton antiporter activity
          term:
            id: GO:0140826
            label: zinc:proton antiporter activity
          modifier: DECREASED
      selected_evidence:
        snippet: Sequencing of genomic DNA detected a mis-sense mutation (Ade-->Gua) that substitutes
          a conserved histidine at amino acid 54 with arginine (H54R) in SLC30A2 (ZnT-2) that is present
          in both affected subjects and several other siblings.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17065149
      reference_title: Identification of a mutation in SLC30A2 (ZnT-2) in women with low milk zinc concentration
