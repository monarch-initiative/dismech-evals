        hypothesis_label: ZnT2 dysfunction also impairs mammary secretory function and milk volume
        status: EMERGING
        description: Beyond lowering milk zinc, loss of ZnT2 in mice disrupts alveolar architecture, epithelial
          polarity and secretion and reduces milk volume, and the common human T288S variant is associated
          with breast stress markers and was found in women producing low milk volume. Whether disease-causing
          alleles in mothers of affected infants also reduce milk volume has not been shown; the human
          data are small series and in vitro studies of a common variant.
      selected_evidence:
        snippet: Here we determined a common mutation in SLC30A2/ZnT2 substituting serine for threonine
          at amino acid 288 (Thr288Ser) was found in 20% of women producing low milk volume (n = 2/10)
          but was not identified in women producing normal volume.
        supports: SUPPORT
