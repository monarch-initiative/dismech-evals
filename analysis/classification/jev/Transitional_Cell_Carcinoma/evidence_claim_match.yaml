        description: In the non-muscle-invasive papillary pathway, activating FGFR3 hotspot mutations
          (and less commonly HRAS) drive ligand-independent receptor tyrosine kinase signaling through
          RAS-MAPK and PI3K-AKT, producing luminal-papillary proliferation. FGFR3 alterations occur in
          roughly 70% of NMIBC.
        cell_types:
        - preferred_term: Urothelial cell
          term:
