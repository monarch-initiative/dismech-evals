            label: fibroblast growth factor receptor signaling pathway
        - preferred_term: RAS signal transduction
          modifier: INCREASED
          term:
            id: GO:0007265
            label: Ras protein signal transduction
        gene_products:
        - preferred_term: Fibroblast Growth Factor Receptor 3
          term:
            id: NCIT:C26129
            label: Fibroblast Growth Factor Receptor 3
      selected_evidence:
        snippet: Commonly mutated genes include TERT, FGFR3, TP53, PIK3CA, STAG2 and genes involved in
          chromatin modification.
        supports: SUPPORT
