      assertion_type: Pathophysiology
      assertion:
        name: Carcinogen-Induced Urothelial Mutagenesis
        description: Tobacco smoke and occupational aromatic amines are excreted in urine and concentrate
          in contact with the urothelium, inducing DNA damage. Combined with APOBEC cytidine-deaminase
          activity, this produces one of the highest somatic mutational burdens among human cancers and
          seeds the divergent molecular pathways of transitional cell carcinoma.
        cell_types:
        - preferred_term: Urothelial cell
          term:
            id: CL:0000731
            label: urothelial cell
        biological_processes:
        - preferred_term: DNA cytosine deamination (APOBEC)
          modifier: INCREASED
          term:
            id: GO:0070383
            label: DNA cytosine deamination
      selected_evidence:
        snippet: The mutational burden is higher in muscle-invasive than in non-muscle-invasive disease.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37884563
      reference_title: Bladder cancer.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the high and stage-dependent somatic mutational burden that results from
        carcinogen exposure and endogenous mutagenic processes in the urothelium.
