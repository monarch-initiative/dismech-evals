      assertion:
        name: KCNMA1
        gene_term:
          preferred_term: KCNMA1
          term:
            id: hgnc:6284
            label: KCNMA1
        association: Disability severity and transverse myelitis manifestation modifier in neuromyelitis
          optica spectrum disorder
        relationship_type: MODIFIER
        features: 'Single nucleotide polymorphism rs1516512 in KCNMA1 (encoding the potassium calcium-activated
          channel subfamily M alpha 1 subunit expressed in perivascular astrocyte endfeet) is associated
          with disability score at genome-wide significance (P = 2.33 x 10^-8) and transverse myelitis
          manifestation (OR = 1.77, P = 0.011) in neuromyelitis optica spectrum disorder, with markedly
          diminished KCNMA1 immunoreactivity in active spinal cord lesions.

          '
        notes: 'Identified in a genome-wide association study of neuromyelitis optica spectrum disorder
          (NMOSD) cohorts rather than idiopathic transverse myelitis; rs1516512 was associated with clinical
          disability (EDSS score) and with the transverse myelitis manifestation within NMOSD, not overall
          susceptibility to idiopathic transverse myelitis.

          '
      selected_evidence:
        snippet: A SNP in the KCNMA1 (potassium calcium-activated channel subfamily M alpha 1) gene was
          associated with disability score with genome-wide significance (rs1516512, P = 2.33 × 10-8 )
          and transverse myelitis (OR = 1.77, P = 0.011).
        supports: SUPPORT
