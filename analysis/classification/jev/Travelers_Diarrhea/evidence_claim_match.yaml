      assertion_type: ExperimentalModel
      assertion:
        name: Human and mouse intestinal enteroid ST-secretion model
        description: Three-dimensional ex vivo intestinal enteroids derived from mouse and human epithelium
          express the GUCY2C secretory axis. Heat-stable ETEC enterotoxin produces quantifiable luminal
          fluid accumulation through GUCY2C-cGMP-PKG-CFTR signaling, and pharmacologic CFTR inhibition
          abrogates secretion.
        experimental_model_type: ORGANOID
        cell_source: Human and mouse intestinal epithelium
        culture_system: Three-dimensional ex vivo intestinal enteroids with luminal fluid-accumulation
          imaging
        conditions:
        - heat-stable ETEC enterotoxin challenge
        - linaclotide secretagogue challenge
        - pharmacologic CFTR inhibition
        publication: PMID:27481254
        modeled_mechanisms:
        - target: GUCY2C-dependent cGMP production
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The enteroids retain the canonical GUCY2C-to-cGMP-to-PKG signaling axis needed
            for heat-stable-enterotoxin secretion.
          limitations: This is an ex vivo toxin-challenge system rather than intact pathogen infection
            and does not reproduce immune, microbiota, vascular, systemic, or travel-exposure compartments;
            it combines observations from two species.
        - target: Net intestinal electrolyte and water secretion
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Heat-stable enterotoxin produces quantifiable fluid accumulation within enteroid
            lumens, recapitulating the net secretory output of ETEC disease.
          limitations: Luminal volume is a tissue-level epithelial secretion readout in an ex vivo toxin
            challenge; it does not model whole-organism stool output, hydration status, immune responses,
            microbiota, or intact infection.
          readouts:
          - name: Enteroid luminal fluid accumulation after heat-stable enterotoxin
            target: Net intestinal electrolyte and water secretion
            direction: INCREASED
            interpretation: Increased enteroid-lumen volume is the functional readout of toxin-induced
              epithelial secretion.
        - target: CFTR-mediated epithelial chloride secretion
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: CFTR opening is required for the enteroid secretory response, and pharmacologic
            CFTR inhibition rescues the fluid-accumulation readout.
          limitations: CFTR inhibition demonstrates pathway dependence in an epithelial ex vivo model
            but does not establish safety or efficacy of an antidiarrheal therapy in travelers.
          readouts:
          - name: Abrogation of enterotoxin-induced fluid secretion by CFTR inhibition
            target: CFTR-mediated epithelial chloride secretion
            direction: ABOLISHED
            interpretation: Loss of luminal fluid accumulation after CFTR inhibition shows that the modeled
              secretory output depends on CFTR.
      selected_evidence:
        snippet: Here, we reveal that mouse and human intestinal enteroids in three-dimensional ex vivo
          cultures express the components of the GUCY2C secretory signaling axis.
        supports: SUPPORT
