        context: []
      assertion_type: Treatment
      assertion:
        name: Azithromycin for severe or dysenteric illness
        description: Azithromycin is an antibiotic option for moderate to severe disease and can be used
          for dysentery. Macrolides remain recommended for illness from South Central Asia and are preferred
          in sub-Saharan Africa because of high fluoroquinolone nonsusceptibility in Campylobacter; empiric
          therapy after South American exposure warrants closer monitoring because Shigella macrolide
          resistance and Campylobacter fluoroquinolone resistance pull selection in opposing directions.
        treatment_term:
          preferred_term: antibiotic therapy
          term:
            id: NCIT:C15620
            label: Antibiotic Therapy
          therapeutic_agent:
          - preferred_term: azithromycin
            term:
              id: CHEBI:2955
              label: azithromycin
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: Although there is limited evidence associating in vitro AST results with treatment outcomes
          for acute diarrhea,29 given the high nonsusceptibility rates for fluoroquinolones in Campylobacter
          and Shigella species, it is reasonable to continue to recommend macrolides for TD originating
          or occurring in South Central Asia. Similarly, in sub-Saharan Africa, where Campylobacter infections
          were a common cause of TD, macrolides are preferred given that 60% of isolates were nonsusceptible
          to fluoroquinolones. In South America, where there is 78% nonsusceptibility to macrolides in
          Shigella species, as well as 71% nonsusceptibility to fluoroquinolones in Campylobacter species,
          patients receiving empiric therapy may need closer monitoring for persistent or worsening symptoms
          and possible broader antibiotic coverage.
        supports: SUPPORT
