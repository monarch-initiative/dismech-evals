        prompt: How should rapid pathogen identification and destination-specific antimicrobial-resistance
          surveillance be combined to select self-treatment or clinician-directed therapy for heterogeneous
          traveler's diarrhea?
        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: Molecular testing increasingly detects viral disease and mixed infections, bacterial
          rankings differ by method and geography, and susceptibility to fluoroquinolones and macrolides
          varies markedly across destinations. A universal ETEC-centered or single-antibiotic treatment
          rule is therefore not supported.
      selected_evidence:
        snippet: In this cross-sectional study of travelers' diarrhea antimicrobial resistance patterns,
          there was marked variability of nonsusceptibility to 2 major classes of antibiotics commonly
          used for treating travelers' diarrhea among global regions.
        supports: SUPPORT
