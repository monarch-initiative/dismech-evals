      assertion_type: Treatment
      assertion:
        name: Avoid routine antibiotic prophylaxis
        description: Prophylactic antibiotics are not recommended for most travelers because adverse effects,
          C. difficile infection, microbiome disruption, and acquisition or carriage of antimicrobial-resistant
          bacteria generally outweigh benefit. They may be considered rarely for short-term travelers
          who are high-risk hosts.
        treatment_term:
          preferred_term: antibiotic therapy
          term:
            id: NCIT:C15620
            label: Antibiotic Therapy
      selected_evidence:
        snippet: For almost all travelers, though, the risks associated with the use of prophylactic antibiotics,
          including side effects, <em>Clostridioides difficile</em> infection, and increased risk of carriage
          of antimicrobial-resistant bacteria, outweigh the potential benefits. Prophylactic antibiotics
          might rarely be considered for short-term travelers who are high-risk hosts (e.g., immunocompromised
          people or people who have significant medical comorbidities).
        supports: SUPPORT
