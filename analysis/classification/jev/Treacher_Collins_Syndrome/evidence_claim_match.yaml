      assertion_type: Discussion
      assertion:
        discussion_id: multisystem_and_neonatal_ascertainment
        kind: INTERPRETATION
        status: OPEN
        prompt: Which multisystem associations and neonatal intervention rates should alter routine care,
          and which reflect EHR coding or tertiary-NICU ascertainment?
        attaches_to:
        - phenotypes#Upper Airway Obstruction
        - phenotypes#Feeding Difficulties
        - treatments#Airway Management
        - treatments#Multidisciplinary Surveillance
        rationale: 'A propensity-matched EHR study of 1,114 coded TCS patients found elevated circulatory,
          otologic, and selected neurologic diagnoses, while a 103-infant multicenter NICU cohort quantified
          high tracheostomy and gastrostomy use. These studies broaden multisystem and neonatal outcome
          ascertainment, but neither supplies population penetrance: coding validity and phenotype/genotype
          resolution constrain the EHR analysis, and NICU referral enriches for severe neonatal disease.
          The 2024 European consensus therefore supports initial cardiac/vertebral screening and structured
          feeding, hearing, vision, and airway surveillance without encoding the cohort estimates as universal
          phenotype frequencies.'
      selected_evidence:
        snippet: We identified 103 infants with TCS and 11 with NS to compare with the micrognathia cohort
          (n = 4210). Compared with infants with micrognathia, those with TCS were more likely to undergo
          tracheostomy (54% vs 11%) and gastrostomy tube placement (67% vs 35%) and were less likely to
          undergo mandibular distraction (9.7% vs 28.2%).
        supports: SUPPORT
