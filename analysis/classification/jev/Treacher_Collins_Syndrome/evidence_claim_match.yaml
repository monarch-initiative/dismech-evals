      assertion_type: Subtype
      assertion:
        name: TCS1
        display_name: Treacher Collins Syndrome 1 (TCOF1)
        description: The most common subtype, caused by heterozygous pathogenic variants in TCOF1 encoding
          Treacle, a nucleolar phosphoprotein required for ribosomal DNA transcription and ribosome biogenesis.
        subtype_term:
          preferred_term: Treacher Collins syndrome 1
          term:
            id: MONDO:0007944
            label: Treacher Collins syndrome 1
        genes:
        - preferred_term: TCOF1
          description: Encodes Treacle, a nucleolar phosphoprotein required for ribosomal DNA transcription;
            the gene MONDO asserts for this subtype (RO:0004003).
          term:
            id: hgnc:11654
            label: TCOF1
      selected_evidence:
        snippet: TCS can be caused by pathogenic variants in the TCOF1, POLR1D, POLR1C and POLR1B genes.
          Genetically, the TCOF1 gene contains 27 exons which encodes the Treacle protein. In TCOF1, over
          200 pathogenic variants have been identified
        supports: SUPPORT
