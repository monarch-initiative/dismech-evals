            syndrome and RO:0004003 POLR1C, but that gene relation appears only in the equivalence axiom
            (intersection_of) and is not asserted as a relationship the way it is for TCS1, TCS2 and TCS4,
            so an extraction that reads asserted relations alone will not see it.
          term:
            id: hgnc:20194
