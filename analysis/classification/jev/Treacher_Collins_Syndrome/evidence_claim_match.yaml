              id: MONDO:0002457
              label: Treacher-Collins syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Ribosome Biogenesis
        conforms_to: pharyngeal_arch_patterning_serial_homology#Cranial Neural Crest and Pharyngeal Arch
          Program Perturbation
        biological_scale: MOLECULAR
        description: Dominant TCOF1, POLR1B, or POLR1D loss of function and biallelic POLR1C/POLR1D loss
          of function collectively disrupt one or more RNA polymerase I-associated steps in rRNA transcription,
          rRNA processing, and production of mature ribosomes.
        genes:
        - preferred_term: TCOF1
          term:
            id: hgnc:11654
            label: TCOF1
        - preferred_term: POLR1B
          term:
            id: hgnc:20454
            label: POLR1B
        - preferred_term: POLR1C
          term:
            id: hgnc:20194
            label: POLR1C
        - preferred_term: POLR1D
          term:
            id: hgnc:20422
            label: POLR1D
        cell_types:
        - preferred_term: Migratory neural crest cell
          term:
            id: CL:0000333
            label: migratory neural crest cell
        cellular_components:
        - preferred_term: nucleolus
          term:
            id: GO:0005730
            label: nucleolus
        biological_processes:
        - preferred_term: Ribosome biogenesis
          term:
            id: GO:0042254
            label: ribosome biogenesis
          modifier: DECREASED
      selected_evidence:
        snippet: The association of the TCOF1 gene product, Treacle, and gene products of POLR1C and POLR1D
          with ribosome biosynthesis suggests that a loss of function mutation in these genes disrupts
          ribosome biosynthesis in constituent neural crest cells and neuroepithelium leading to apoptosis.
        supports: SUPPORT
