  efc598d78dda437c8f885a97f5c5860fb8e2d253e7b4b3fbf907065aaab2eedf:
    claim:
      about:
        disease:
          name: Treacher Collins Syndrome
          disease_term:
            preferred_term: Treacher Collins syndrome
            term:
              id: MONDO:0002457
              label: Treacher-Collins syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing
        description: Use a craniofacial-disorder multigene panel with sequencing and deletion/duplication
          analysis, or exome/genome testing when the phenotype is atypical or panel testing is nondiagnostic.
          The molecular diagnosis is established by a heterozygous pathogenic variant in TCOF1, POLR1B,
          or POLR1D; biallelic pathogenic variants in POLR1C; or, rarely, biallelic pathogenic variants
          in POLR1D. A 5q deletion including TCOF1 is another uncommon mechanism. In unresolved cases
          with strong clinical suspicion, selected structural-variant, RNA, or long-read genomic analyses
          can reveal cryptic variants missed by routine short-read testing, but these remain complementary
          rather than first-line tests.
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        results: Identification of a genotype matching one of the established dominant or recessive TCS
          mechanisms establishes the molecular diagnosis.
      selected_evidence:
        snippet: The diagnosis of TCS is established in a proband with characteristic clinical features
          and/or a heterozygous pathogenic variant in TCOF1, POLR1D, or POLR1B, biallelic pathogenic variants
