        - target: Cranial Neural Crest Cell Deficiency
          description: TCOF1+/- neural crest and mesenchymal derivatives show impaired migration in vitro.
        findings:
        - statement: TCOF1+/- human neural crest cells recapitulate the abnormal cell-death phenotype
            of the murine TCS model and add a migration deficit.
          supporting_text: The NC cells derived from TCOF1+/- HPSC recapitulate the phenotype of the reported
            TCS murine model. We also report for the first time an impairment of migration in TCOF1+/-
            NC and mesenchymal stem cells.
      selected_evidence:
        snippet: We assessed the potential of the derived NC population to model the neurocristopathy,
          Treacher Collins Syndrome (TCS), using small interfering RNA (siRNA) knockdown of TCOF1 and
          by creating different TCOF1+/- HPSC lines through CRISPR/Cas9 technology.
        supports: SUPPORT
