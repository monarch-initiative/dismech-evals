      assertion_type: Treatment
      assertion:
        name: Hearing Amplification
        description: Audiology-directed amplification should start early. Air-conduction devices are the
          first choice when outer-ear anatomy permits and hearing and speech outcomes are acceptable;
          bone-conduction devices are an alternative for conductive or mixed loss from outer- or middle-ear
          malformation. Noninvasive versus implanted systems are individualized to anatomy, age, hearing
          loss, expected benefit, and patient preferences, and bone-conduction rehabilitation is preferred
          over reconstructive canal or middle-ear surgery when those surgical outcomes are expected to
          be poor.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: hearing amplification
        target_phenotypes:
        - preferred_term: Conductive hearing impairment
          term:
            id: HP:0000405
            label: Conductive hearing impairment
      selected_evidence:
        snippet: the experts came to an agreement that air-conducting hearing devices are an appropriate
          first choice in FDS patients if acceptable hearing and speech intelligibility can be achieved,
          and their outer ear anatomy allows for wearing them
        supports: SUPPORT
