        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: emerging_diagnostic_adjuncts_and_generalizability
        kind: INTERPRETATION
        status: OPEN
        prompt: How should long-read DNA/RNA sequencing, prenatal imaging, and facial-image algorithms
          be incorporated into TCS diagnosis without overextending small, selected, or ancestry-imbalanced
          datasets?
        attaches_to:
        - diagnosis#Clinical diagnosis
        - diagnosis#Molecular genetic testing
        - treatments#Genetic Counseling
        rationale: Long-read multi-omics resolved a cryptic intronic TCOF1 insertion in two paternal half-siblings
          after conventional testing, establishing value for selected unresolved families rather than
          first-line use. Prenatal imaging plus molecular testing can identify affected fetuses, but mosaicism
          and variable expressivity prevent reliable severity prediction. A 2026 facial dysmorphology
          study reported high sensitivity on 127 publicly available images but lower confidence in Asian
          than White participants; it remains a research adjunct and cannot replace clinical evaluation
          or molecular confirmation.
      selected_evidence:
        snippet: A total of 127 images of TCS patients were analysed by F2G. A high diagnostic accuracy
          of 93.7% was obtained. However, F2G was less confident when diagnosing Asians with TCS than
          White individuals (p < 0.05).
        supports: SUPPORT
