      assertion:
        name: Clinical diagnosis
        description: No consensus clinical diagnostic criteria have been published. A clinical diagnosis
          can be made from the characteristic bilaterally symmetric facial and mandibular abnormalities,
          downslanted palpebral fissures, zygomatic and mandibular hypoplasia, and conductive hearing
          loss. Limb anomalies, microcephaly, or intellectual disability are unusual and should trigger
          a broader differential diagnosis.
        diagnosis_term:
          preferred_term: Clinical Evaluation
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
        results: A compatible symmetric craniofacial and conductive-hearing-loss pattern supports TCS
          but does not determine the causal gene.
      selected_evidence:
        snippet: Treacher Collins syndrome (TCS) is characterized by lower eyelid abnormalities, malar
          hypoplasia, downslanted palpebral fissures, and micro- or retrognathia due to symmetric hypoplasia
          of the zygomatic bones, maxilla, and mandible.
        supports: SUPPORT
