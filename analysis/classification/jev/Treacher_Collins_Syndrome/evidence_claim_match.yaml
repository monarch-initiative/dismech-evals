        associated_phenotypes:
        - Deficient generation and proliferation of migrating cranial neural crest cells
        - Bilateral craniofacial skeletal hypoplasia with perinatal respiratory compromise on susceptible
          backgrounds
        description: Germline Tcof1 haploinsufficiency is the foundational TCS model. It reproduces deficient
          mature-ribosome production, p53-dependent neuroepithelial/neural crest apoptosis, neural crest
          deficiency, and craniofacial hypoplasia. Phenotypic severity depends strongly on strain background,
          and rescue by p53 inhibition or maternal antioxidants is prenatal animal-model evidence rather
          than an established human intervention.
      selected_evidence:
        snippet: inhibition of p53 prevents cyclin G1-driven apoptotic elimination of neural crest cells
          while rescuing the craniofacial abnormalities associated with mutations in Tcof1 and extending
          life span.
        supports: SUPPORT
