  57fdd89e24a62fc1f3ec11038c9431f9013333ebc73a68c5b41500d956a34975:
    claim:
      about:
        disease:
          name: Trichohepatoenteric Syndrome
          disease_term:
            preferred_term: trichohepatoenteric syndrome
            term:
              id: MONDO:0009105
              label: trichohepatoenteric syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of a Human SKI Complex Cofactor
        description: 'The initiating lesion. The SKI complex is a heterotetrameric cytoplasmic cofactor
          of the RNA exosome, and TTC37 and SKIV2L encode two of its subunits - a tetratricopeptide-repeat
          scaffold protein and an RNA helicase respectively. Biallelic loss of either subunit disables
          the complex, and because both routes produce clinically indistinguishable disease the pathogenic
          unit is the complex rather than either individual protein. This is a housekeeping lesion, not
          a gut-specific one: nothing about the SKI complex is intestine-restricted, which is why the
          resulting disease is multisystem and why the enteropathy needs explaining rather than being
          self-evident.'
        genes:
        - preferred_term: TTC37
          term:
            id: hgnc:23639
            label: TTC37
        - preferred_term: SKIV2L
          term:
            id: hgnc:10898
            label: SKIV2L
        role: trigger
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: SKIV2L RNA helicase activity
          term:
            id: GO:0003724
            label: RNA helicase activity
          modifier: LOSS_OF_FUNCTION
        cellular_components:
        - preferred_term: Ski complex
          term:
            id: GO:0055087
            label: Ski complex
      selected_evidence:
        snippet: The aetiology is a defect in TTC37, a TPR containing protein, or in the RNA helicase
          SKIV2L, both constituting the putative human ski complex.
        supports: SUPPORT
