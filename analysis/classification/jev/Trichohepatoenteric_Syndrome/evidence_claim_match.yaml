        name: Surveillance for late complications
        description: 'THES requires scheduled surveillance rather than one-off diagnosis, because several
          of its complications appear after presentation. GeneReviews prescribes yearly assessment of
          liver function and size, immunoglobulin concentration and functionality, TSH for hypothyroidism,
          and any change in the diarrhea that might indicate inflammatory bowel disease, plus periodic
          developmental and speech assessment. The IBD item is notable: a change in bowel pattern in an
          already-diarrheal child is easy to attribute to the underlying enteropathy, which is precisely
          why it is called out.'
