  ef50264c2ab54a02e11f51f910945fc8a0991cedbcba7223c4ee29e2e6b80b66:
    claim:
      about:
        disease:
          name: Trichohepatoenteric Syndrome
          disease_term:
            preferred_term: trichohepatoenteric syndrome
            term:
              id: MONDO:0009105
              label: trichohepatoenteric syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Abundance and Localization of Target Proteins
        description: 'The proposed bridge between a general RNA-surveillance defect and the tissue-specific
          phenotypes, and the least certain step in the chain. Loss of the SKI complex is proposed to
          destabilize or mislocalize its downstream target proteins rather than eliminate one activity.
          In the intestine this is directly observable: several enterocyte brush-border ion transporters
          - NHE2, NHE3, aquaporin 7, the sodium-iodide symporter and H/K-ATPase - show reduced expression
          or mislocalization, and critically the profile differs between patients. Basolateral Na/K-ATPase
          localization is by contrast unaltered, so the effect is selective rather than a global collapse
          of membrane protein trafficking. The absence of a single consistent transporter defect is what
          distinguishes THES from the electrolyte-transport-related congenital diarrheas, where one named
          transporter fails in every patient.'
        role: effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Small-intestinal enterocyte
          term:
            id: CL:0000584
            label: enterocyte
        biological_processes:
        - preferred_term: Apical membrane transporter localization
          term:
            id: GO:0072659
            label: protein localization to plasma membrane
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: Enterocyte brush border
          term:
            id: GO:0005903
            label: brush border
      selected_evidence:
        snippet: showed reduced expression or mislocalization in all THES patients with different profiles
          for each
        supports: SUPPORT
