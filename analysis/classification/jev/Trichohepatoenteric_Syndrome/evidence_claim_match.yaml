        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intractable Infantile Diarrhea with a Structurally Normal Brush Border
        description: 'The intestinal output, and the finding that fixes this disorder''s position in the
          CODE nosology. Diarrhea begins in the first month of life - not at birth - and is severe enough
          to require parenteral nutrition. On biopsy the mucosa shows non-specific changes: initial subtotal
          villous atrophy that improves with time, with a variable mixed inflammatory infiltrate, and
          severity of diarrhea does not correlate with the histological change. Crucially the enterocyte
          brush border is ultrastructurally NORMAL, which excludes the enterocyte-structural mechanism
          of microvillus inclusion disease and tufting enteropathy despite the villous atrophy the two
          classes share.'
        role: consequence
        biological_scale: ORGANISM
        locations:
        - preferred_term: Small intestine
          term:
            id: UBERON:0002108
            label: small intestine
      selected_evidence:
        snippet: On microscopy intestinal changes are non-specific; initial subtotal villous atrophy improves
          with time (although severity of diarrhoea does not correlate with the histological change)
        supports: SUPPORT
