      assertion:
        name: Multisystem Involvement Outside the Gut
        description: The extraintestinal output, expected of a housekeeping-gene disorder and unusual
          among the congenital diarrheas. Hair is woolly, coarse, sparse and fragile with trichorrhexis
          nodosa; facial features are distinctive (hypertelorism, broad flat nasal bridge, prominent forehead);
          antibody production is defective, giving low immunoglobulins and poor response to childhood
          vaccination, though this often improves with age. Intrauterine growth restriction is one of
          the five defining signs. Liver involvement - hepatomegaly, fibrosis, siderosis, cirrhosis -
          is inconsistent even between siblings, occurs irrespective of parenteral nutrition, and can
          precede the onset of diarrhea, which is what establishes it as intrinsic to the disease rather
          than a complication of treatment.
