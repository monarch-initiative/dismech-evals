      assertion_type: Phenotype
      assertion:
        name: Immunodeficiency
        category: Immunological
        description: 'THES appears in the IUIS classification of inborn errors of immunity on the strength
          of this feature, but its character is worth stating precisely: what is established is defective
          antibody production with low immunoglobulins and poor vaccine responses, and GeneReviews describes
          the immunodeficiency overall as "poorly characterized". No consistent cellular immune defect
          has been defined, and the humoral defect often improves with age. The immunodeficiency here
          is therefore a consequence of losing post-transcriptional control over many gene products, not
          a lesion in a named immune pathway - which is why THES sits among the syndromic rather than
          the mechanistically-defined immunodeficiencies.'
        phenotype_term:
          preferred_term: Immunodeficiency
          term:
