              id: MONDO:0009105
              label: trichohepatoenteric syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Exosome-Mediated Cytoplasmic mRNA Surveillance
        description: 'The rate-limiting step. The SKI complex delivers transcripts to the cytoplasmic
          RNA exosome for degradation, so it is required both for normal mRNA turnover and for the decay
          of aberrant or nonfunctional transcripts. Losing it removes post-transcriptional quality control
          over the whole cytoplasmic transcriptome rather than over any particular gene product. This
          is the node that makes the disease multisystem, and it is also why THES resists the tidy trigger-to-organ
          logic of the other congenital diarrheas: the downstream consequences depend on which transcripts
          and proteins are most sensitive to loss of surveillance in each tissue, which is not fully characterised.'
        role: central_effector
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: Exosome-mediated mRNA decay
          term:
            id: GO:0000956
            label: nuclear-transcribed mRNA catabolic process
          modifier: DECREASED
        - preferred_term: RNA surveillance and turnover
          term:
            id: GO:0006401
            label: RNA catabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: The Ski complex is a multiprotein complex required for exosome-mediated RNA surveillance,
          including the regulation of normal mRNA and the decay of nonfunctional mRNA.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
