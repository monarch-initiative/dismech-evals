          with a dizygotic concordance of 0% under strict DSM-IV criteria - a denominator small enough
          that the point estimate is fragile even though the direction is clear.

          No specific gene is established. SLITRK1 variants were reported in trichotillomania, but that
          record caches without retrievable content, so it is named here rather than cited; SLITRK5 has
          human genetic study only in OCD, where the rare-variant prevalence did not differ from controls.'
