      assertion:
        name: Polygenic Burden and Structural Variation
        association: 'The 2025 case-control study of 101 European-ancestry cases and 488 matched controls
          found trichotillomania cases carry a higher load of common polygenic risk for psychiatric disorders
          than controls, and detected copy number variants previously associated with neuropsychiatric
          disorders - deletions in NRXN1, CSMD1 and 15q11.2.

          This is the shape the genetics actually has: shared polygenic liability with psychiatric disorders
          generally, plus recurrent neurodevelopmental CNVs, rather than a trichotillomania-specific locus.'
        relationship_type: SUSCEPTIBILITY
