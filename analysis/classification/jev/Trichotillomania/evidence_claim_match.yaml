  4031b7517f94378a3276505903f03f0301e1422d8ac3115a7b93b44944e64659:
    claim:
      about:
        disease:
          name: Trichotillomania
          disease_term:
            preferred_term: trichotillomania
            term:
              id: MONDO:0013189
              label: trichotillomania
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Trichophagia and Gastrointestinal Hair Accumulation
        biological_scale: ORGANISM
        description: 'A branch of the behaviour, not of the hair loss: a subset of patients swallow the
          hair they pull. Ingested hair resists peristalsis and is not digested, so it accumulates in
          the stomach as a trichobezoar - a hair ball taking the shape of the gastric lumen.

          When the mass extends through the pylorus into the small intestine or beyond, it is called Rapunzel
          syndrome. This is where the disorder''s serious morbidity and mortality come from: presentations
          include obstruction, cachexia and critical dehydration, and the reported masses are large enough
          to be mistaken for tumours on imaging. It is the one arm of trichotillomania whose definitive
          treatment is surgical rather than behavioural.'
      selected_evidence:
        snippet: trichobezoars, an extremely rare human intestinal disease caused by the ingestion of
          hair (trichophagia)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36090734
      reference_title: 'Trichopsychodermatology: trichotillomania and trichophagia leading to Rapunzel
        syndrome.'
      evidence_source: HUMAN_CLINICAL
      explanation: Ties bezoar formation to hair ingestion as its cause.
