        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Striatal Glutamate Dysregulation
        biological_scale: MOLECULAR
        description: 'Altered extracellular glutamate homeostasis in the ventral striatum, curated here
          principally because a treatment that acts on it works. N-acetylcysteine restores extracellular
          glutamate concentration in the nucleus accumbens, and in a randomised adult trial it reduced
          hair-pulling substantially more than placebo.

          This is inference from therapeutic response, which is weaker than a measurement. The node is
          retained because the effect size was large and the mechanism of the drug is specific - but the
          direction of the underlying abnormality in patients has not been measured, and the paediatric
          trial of the same drug was negative.'
        biological_processes:
        - preferred_term: regulation of glutamate secretion
          term:
            id: GO:0014048
            label: regulation of glutamate secretion
      selected_evidence:
        snippet: N-acetylcysteine, an amino acid, seems to restore the extracellular glutamate concentration
          in the nucleus accumbens and, therefore, offers promise in the reduction of compulsive behavior
        supports: SUPPORT
    origin:
