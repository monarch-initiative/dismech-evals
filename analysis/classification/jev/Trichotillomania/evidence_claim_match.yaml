              label: trichotillomania
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Corticostriatal Synaptic Dysfunction
        biological_scale: CELLULAR
        description: 'Impaired excitatory neurotransmission at cortico-striatal synapses, the level at
          which both genetic mouse models of pathological grooming converge. Deleting either SAPAP3 (a
          postsynaptic scaffolding protein at excitatory synapses, highly expressed in striatum) or SLITRK5
          produces defective corticostriatal transmission together with a grooming phenotype severe enough
          to remove hair.

          The direction of causation is established rather than inferred in the SAPAP3 case: restoring
          the protein selectively in the striatum rescues both the synaptic and the behavioural defect,
          so the striatal synapse is not merely correlated with the behaviour.'
        cell_types:
        - preferred_term: medium spiny neuron
          term:
            id: CL:1001474
            label: medium spiny neuron
        biological_processes:
        - preferred_term: chemical synaptic transmission
          term:
            id: GO:0007268
            label: chemical synaptic transmission
          modifier: DECREASED
      selected_evidence:
        snippet: mice with genetic deletion of Sapap3 exhibit increased anxiety and compulsive grooming
          behaviour leading to facial hair loss and skin lesions
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
