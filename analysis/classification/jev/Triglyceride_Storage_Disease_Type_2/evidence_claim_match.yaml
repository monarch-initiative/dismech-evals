              label: triglyceride storage disease, type 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tsd2_molecular_identity_and_causal_validity
        prompt: Does the preserved-cAMP, reduced-glycerol adipose phenotype reproducibly segregate as
          a monogenic disorder, what post-cAMP signaling or lipase step is altered, and is that alteration
          causal for obesity rather than an incidental feature of the original kindred?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Post-cAMP Failure of Isoprenaline-Stimulated Adipocyte Lipolysis
        - pathophysiology#Excessive Adipose Triglyceride Storage
        - phenotypes#Obesity
        rationale: Evidence is limited to a small historical kindred characterized before modern sequencing
          and contemporary adipocyte-signaling assays. The original classification was provisional, the
          precise lesion was not identified, and retained fasting lipid mobilization complicates a simple
          global-lipolysis model.
        proposed_experiments:
        - experiment_id: tsd2_family_genomics_and_adipocyte_signaling
          name: Family-Informed Genomics and Adipocyte Signaling Study
          description: Identify contemporary patients matching the paired assay phenotype (or, if possible,
            descendants of the original kindred), perform genome sequencing with segregation analysis,
            and derive primary or induced-pluripotent-stem-cell adipocytes. Compare matched controls across
            a stimulation ladder measuring beta-adrenergic signaling, cyclic AMP, PKA-substrate phosphorylation,
            lipase activation, glycerol and non-esterified-fatty-acid release, triglyceride turnover,
            and a fasting-mimic condition.
          readouts:
          - name: Replicated post-cAMP signaling-to-lipolysis defect
            target: pathophysiology#Post-cAMP Failure of Isoprenaline-Stimulated Adipocyte Lipolysis
          - name: Genotype-linked triglyceride retention
            target: pathophysiology#Excessive Adipose Triglyceride Storage
          decision_criterion: A segregating variant whose correction restores post-cAMP lipase activation
            and triglyceride turnover would support a monogenic causal entity. Failure to reproduce the
            paired signaling phenotype, lack of segregation, or persistence after genotype correction
            would refute that model and favor an incidental or common-obesity-associated observation.
          would_support:
          - pathophysiology#Post-cAMP Failure of Isoprenaline-Stimulated Adipocyte Lipolysis
          - pathophysiology#Excessive Adipose Triglyceride Storage
          would_refute:
          - pathophysiology#Post-cAMP Failure of Isoprenaline-Stimulated Adipocyte Lipolysis
          - pathophysiology#Excessive Adipose Triglyceride Storage
      selected_evidence:
        snippet: A provisional classification is proposed for the metabolic defects of triglyceride breakdown
          based on the separate stages of lipolysis and includes the rare defect of triglyceride breakdown
          already described in the literature as Wolman's disease.
        supports: SUPPORT
