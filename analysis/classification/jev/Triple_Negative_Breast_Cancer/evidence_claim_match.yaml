        context:
        - path: /pathophysiology/4
          value:
            name: Macrophage-Mediated Immune Suppression
            description: The TNBC microenvironment is immunosuppressive, with pro-inflammatory M1 macrophage
              polarization suppressed. Apolipoprotein C-II (APOC2) is upregulated in TNBC tissue and inversely
              correlates with M1 macrophage infiltration; overexpressing it in tumor cells suppresses
              M1 polarization and promotes tumor growth, so the effect on macrophages is tumor-cell-extrinsic.
              KLHL1 (a Cullin3-RING E3 ubiquitin ligase substrate adaptor) degrades APOC2 via the ubiquitin-proteasome
              pathway and reverses this immunosuppressive phenotype by restoring M1 polarization.
            notes: Scoped to what PMID:42600954 measures. That study reports M1 infiltration and M1 polarization
              only and never assays M2 markers, so no M2-skewing claim is made here even though M2 polarization
              in the TNBC microenvironment is well described elsewhere; curating it needs its own reference.
            biological_processes:
            - preferred_term: inflammatory response
              modifier: DECREASED
              term:
                id: GO:0006954
                label: inflammatory response
            - preferred_term: M1 macrophage polarization
              modifier: DECREASED
              term:
                id: GO:0002281
                label: macrophage activation involved in immune response
            cell_types:
            - preferred_term: M1 macrophage
              term:
                id: CL:0000863
                label: M1 macrophage
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Intratumoral CXCL9 Deficiency
        causal_link_type: DIRECT
        description: Macrophages are a principal source of the CD8-recruiting chemokine CXCL9, so an immunosuppressed
          macrophage compartment leaves the tumor short of it.
      selected_evidence:
        snippet: Myeloid-restricted ALDH2 ablation converts TAMs from a pro-tumorigenic phenotype to immunostimulatory
          regulators, concomitantly amplifying CD8+ T cell infiltration and cytotoxicity to improve ICB
          responsiveness
        supports: SUPPORT
        directness: DIRECT
