      assertion_type: Subtype
      assertion:
        name: Basal-like TNBC
        description: The most common TNBC subtype (50-75%), characterized by expression of basal cytokeratins
          (CK5/6, CK14, CK17), EGFR expression, high proliferation, and frequent TP53 and BRCA1 mutations.
          Overlaps significantly with BRCA1-associated breast cancer.
      selected_evidence:
        snippet: BL1 and BL2 subtypes had higher expression of cell cycle and DNA damage response genes,
          and representative cell lines preferentially responded to cisplatin.
        supports: SUPPORT
    origin:
