  36cebfe7e9a5949a4ff381e07bd41593f651d2804554f628cb2454e5bd76024f:
    claim:
      about:
        disease:
          name: Triple-Negative Breast Cancer
          disease_term:
            preferred_term: triple-negative breast carcinoma
            term:
              id: MONDO:0005494
              label: triple-negative breast carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Macrophage-Mediated Immune Suppression
        description: The TNBC microenvironment is immunosuppressive, with pro-inflammatory M1 macrophage
          polarization suppressed. Apolipoprotein C-II (APOC2) is upregulated in TNBC tissue and inversely
          correlates with M1 macrophage infiltration; overexpressing it in tumor cells suppresses M1 polarization
          and promotes tumor growth, so the effect on macrophages is tumor-cell-extrinsic. KLHL1 (a Cullin3-RING
          E3 ubiquitin ligase substrate adaptor) degrades APOC2 via the ubiquitin-proteasome pathway and
          reverses this immunosuppressive phenotype by restoring M1 polarization.
        notes: Scoped to what PMID:42600954 measures. That study reports M1 infiltration and M1 polarization
          only and never assays M2 markers, so no M2-skewing claim is made here even though M2 polarization
          in the TNBC microenvironment is well described elsewhere; curating it needs its own reference.
        biological_processes:
        - preferred_term: inflammatory response
          modifier: DECREASED
          term:
            id: GO:0006954
            label: inflammatory response
        - preferred_term: M1 macrophage polarization
          modifier: DECREASED
          term:
            id: GO:0002281
            label: macrophage activation involved in immune response
        cell_types:
        - preferred_term: M1 macrophage
          term:
            id: CL:0000863
            label: M1 macrophage
      selected_evidence:
        snippet: APOC2 was upregulated in TNBC tissues and was negatively correlated with M1 macrophage
          infiltration.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42600954
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes APOC2 upregulation in TNBC as negatively correlating with anti-tumor M1
        macrophage infiltration. This is the tissue-expression arm of the study, stated before any cell-line
        or xenograft work.
