        description: TNBC lacks expression of estrogen receptor alpha (ESR1) and progesterone receptor
          (PGR), eliminating the growth-promoting effects of estrogen signaling that drive most breast
          cancers. This absence removes a key therapeutic target but also indicates fundamentally different
          tumor biology.
        biological_processes:
        - preferred_term: estrogen receptor signaling pathway
          modifier: ABSENT
          term:
            id: GO:0030520
            label: estrogen receptor signaling pathway
      selected_evidence:
        snippet: Triple negative breast cancer (TNBC) is characterized by the lack of estrogen and progesterone
          receptor expression and lacks HER2 overexpression or gene amplification.
        supports: SUPPORT
