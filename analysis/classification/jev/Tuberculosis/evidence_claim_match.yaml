      assertion:
        name: Rv0191 MFS-Mediated Pyrazinamide Efflux
        biological_scale: MOLECULAR
        description: Rv0191, a putative major facilitator superfamily (MFS) transporter of Mycobacterium
          tuberculosis, is proposed to extrude the first-line drug pyrazinamide from the bacterial cytoplasm
          to the periplasm through a protonation-driven alternating-access cycle. Molecular docking and
          molecular dynamics simulation suggest a plausible efflux pathway; the mechanism has not been
          confirmed by efflux assay, MIC shift, or knockout, so it remains a proposed, non-mutational
          route to drug resistance rather than an established one. Efflux of this kind is parallel to
          the mutation-driven resistance curated above and is thought to precede it, by providing the
          low-level drug tolerance during which resistance mutations can be selected.
        molecular_functions:
        - preferred_term: xenobiotic transmembrane transporter activity
          term:
            id: GO:0042910
            label: xenobiotic transmembrane transporter activity
        biological_processes:
        - preferred_term: xenobiotic transmembrane transport
          term:
            id: GO:0006855
            label: xenobiotic transmembrane transport
      selected_evidence:
        snippet: The Rv0191 efflux transporter protein, a putative member of the MFS, has recently emerged
          as a potential target for investigating the molecular mechanisms behind the multidrug resistance
          (MDR) mechanism in Mtb, as it is involved in the efflux of PZA.
        supports: SUPPORT
