  27fc91309671f1716eb8905de2e615d278676397af8fb2324c33e0d4fe1dfb38:
    claim:
      about:
        disease:
          name: Tuberculosis
          disease_term:
            preferred_term: tuberculosis
            term:
              id: MONDO:0018076
              label: tuberculosis
        context: []
      assertion_type: Treatment
      assertion:
        name: Isoniazid
        description: First-line antibiotic for TB treatment.
        notes: It's important to note that resistance to isoniazid can develop through mutations in the
          katG gene, which reduces the activation of the drug, or in the inhA gene, which decreases the
          binding affinity of the activated drug to the InhA enzyme. To minimize the risk of resistance,
          isoniazid is typically used in combination with other antitubercular drugs, such as rifampicin,
          ethambutol, and pyrazinamide.
        mechanism:
        - name: Prodrug Activation
          description: Isoniazid is a prodrug that requires activation by the bacterial enzyme catalase-peroxidase
            (KatG). KatG couples the isonicotinic acyl with NADH to form an isonicotinic acyl-NADH complex.
        - name: Inhibition of InhA
          description: The activated form of isoniazid binds to and inhibits the enoyl-acyl carrier protein
            reductase (InhA), an enzyme involved in the fatty acid synthase II (FAS-II) pathway. This
            pathway is essential for the synthesis of mycolic acids.
        - name: Depletion of mycolic acids
          description: By inhibiting InhA, isoniazid prevents the synthesis of mycolic acids, which are
            long-chain fatty acids that make up a significant portion of the mycobacterial cell wall.
            Mycolic acids provide structural integrity and help the bacteria resist the host's immune
            response.
        - name: Cell wall disruption
          description: The depletion of mycolic acids leads to the weakening and disruption of the bacterial
            cell wall. This makes the bacteria more susceptible to the host's immune defenses and other
            antibiotics.
        - name: Reactive oxygen species
          description: In addition to inhibiting mycolic acid synthesis, the isoniazid-NAD adduct can
            also generate reactive oxygen species (ROS) and nitric oxide (NO) within the bacteria. These
            reactive species can cause damage to various bacterial components, including DNA, proteins,
            and lipids, contributing to the bactericidal effect.
        - name: Bactericidal action
          description: The combination of cell wall disruption and the production of reactive oxygen and
            nitrogen species ultimately leads to the death of the M. tuberculosis bacteria.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: isoniazid
            term:
              id: CHEBI:6030
              label: isoniazide
      selected_evidence:
        snippet: The drugs shown to inhibit mycolic acid biosynthesis are isoniazid, ethionamide, isoxyl,
          thiolactomycin, and triclosan.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
