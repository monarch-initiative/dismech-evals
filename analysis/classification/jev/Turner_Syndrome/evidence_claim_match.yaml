    claim:
      about:
        disease:
          name: Turner Syndrome
          disease_term:
            preferred_term: Turner syndrome
            term:
              id: MONDO:0019499
              label: Turner syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Karyotype Analysis
        description: 'Definitive diagnosis rests on demonstrating complete or partial absence of a second
          sex chromosome. Because mosaicism is common and can be tissue-limited, a normal peripheral-blood
          karyotype does not exclude the diagnosis in a clinically suspicious case — which is why the
          guideline specifies a minimum of 30 metaphases rather than a standard count, and why a normal
          blood result in a phenotypically suspicious individual is followed by analysis of a second tissue.

          '
        diagnosis_term:
          preferred_term: Karyotyping
          term:
            id: NCIT:C16768
            label: Karyotyping
      selected_evidence:
        snippet: Turner syndrome is a rare condition in women that is associated with either complete
          or partial loss of one X chromosome, often in mosaic karyotypes.
        supports: SUPPORT
