  37688c6b181f49e1890070c9c9e9507610a9a5b68ba82b14664e7dc01f5881bb:
    claim:
      about:
        disease:
          name: Turner Syndrome
          disease_term:
            preferred_term: Turner syndrome
            term:
              id: MONDO:0019499
              label: Turner syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: SHOX
        association: 'SHOX haploinsufficiency is causative for the short-stature and mesomelic skeletal
          arm of Turner syndrome, but SHOX variation is neither necessary nor sufficient for Turner syndrome
          as a whole; the defining lesion is loss of all or part of a sex chromosome.

          '
        gene_term:
          preferred_term: SHOX
          term:
            id: hgnc:10853
            label: SHOX
        notes: 'The one Turner gene assigned to its phenotype with confidence. SHOX lies in PAR1, escapes
          X-inactivation, and is therefore reduced to a single dose whenever the second sex chromosome
          is absent or its short arm deleted. Haploinsufficiency — not mutation of the retained copy —
          is the mechanism, which is why the same phenotype arises in Léri-Weill dyschondrosteosis from
          PAR1 deletions in individuals with two intact sex chromosomes. No variant_origin is recorded:
          there is no allele here to assign an origin to. The de-novo event is the loss of the chromosome,
          which is captured on the trigger pathophysiology node, not a variant in the retained SHOX copy.
          `relationship_type` is intentionally omitted: the controlled CAUSATIVE value means that variants
          in the gene are sufficient to cause the disease, which is false for Turner syndrome even though
          SHOX dosage causes one phenotype arm. The free-text association records the narrower, supported
          relationship.

          '
      selected_evidence:
        snippet: SHOX haploinsufficiency frequently results from deletions and duplications in PAR1 involving
          SHOX exons and/or the cis-acting enhancers, while exonic point mutations account for a small
          percentage of cases.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
