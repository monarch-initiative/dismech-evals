              label: Turner syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Progressive Aortic Dilation
        role: effector
        biological_scale: TISSUE
        description: 'The chronic, silent, measurable state: an ascending aorta enlarging over years.
          It is held separate from the acute dissection event downstream of it because the two differ
          in everything that matters clinically — time course, detectability, and above all treatment
          join point. Dilation is what surveillance imaging measures and what antihypertensive therapy
          and elective surgery are aimed at; dissection is the event those measures exist to prevent.
          The decisive feature of the dilation is one of calibration rather than biology: it becomes dangerous
          at absolute diameters that are unremarkable in an average-height adult, which is why surveillance
          is indexed to body surface area and why an aortic size index above 2.5 cm/m2 triggers surgical
          consideration.

          '
      selected_evidence:
        snippet: Dilation of the aorta, brachiocephalic and carotid arteries may be present even in the
          absence of structural heart disease, consistent with an underlying generalized arteriopathy.
        supports: SUPPORT
