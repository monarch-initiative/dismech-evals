        hypothesis_label: Granulosa-Cell Apelin/APJ Dysfunction Model of Ovarian Attrition
        status: EMERGING
        description: 'A human 45,X iPSC-derived granulosa-cell study places reduced apelin/APJ signaling
          upstream of abnormal granulosa differentiation and cell-cycle progression, then proposes that
          defective somatic support during ovarian development contributes to early oocyte loss. Ligand
          and Akt-pathway rescue provide model-specific causal support for the signaling-to-cellular step;
          the relay from chromosome dosage to apelin signaling and the translation from cultured cells
          to follicular attrition in vivo remain unproven.

          '
        notes: 'This model does not replace the established ovarian-attrition path. It supplies one candidate
          somatic-cell relay within an arm whose responsible X-dosage-sensitive gene or genes remain unidentified.

          '
      selected_evidence:
        snippet: We hypothesize that during early embryonic development, failures in apelin/APJ signaling
          in GCs of Turner syndrome patients lead to abnormalities in ovarian development, ultimately
          resulting in early oocyte loss and infertility.
        supports: SUPPORT
