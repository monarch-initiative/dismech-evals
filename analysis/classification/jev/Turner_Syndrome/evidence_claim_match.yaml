      assertion_type: Discussion
      assertion:
        discussion_id: gap_lymphatic_versus_dosage_origin_of_cardiac_defect
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Is the left-heart obstructive lesion of Turner syndrome caused by the fetal lymphatic
          defect through a hemodynamic mechanism, or are the two parallel consequences of the same gene-dosage
          lesion?

          '
        rationale: 'The two accounts predict the same epidemiology — neck web and coarctation co-occur
          — and are therefore not separated by the association data that motivated the hemodynamic model.
          The distinction matters because it decides whether the cardiac phenotype is in principle preventable
          by anything acting on lymphatic development, or whether it is an independent dosage effect that
          a lymphatic intervention could never touch. This entry does not resolve it: the hemodynamic
          chain is confined to a named ALTERNATIVE hypothesis group, and the corresponding edge is typed
          INDIRECT so no node asserts it as settled mechanism.

          '
        attaches_to:
        - pathophysiology#Fetal Jugular Lymphatic Sac Obstruction and Lymphatic Network Dysplasia
        - pathophysiology#Left-Sided Cardiac Outflow Tract Malformation
      selected_evidence:
        snippet: The following hypothesis is proposed to explain the association.
        supports: SUPPORT
