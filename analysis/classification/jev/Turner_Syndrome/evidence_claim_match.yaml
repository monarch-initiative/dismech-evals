  d1df412b79e4e028b242df1444f1b0b84389101fa43ef9600a65da52cbe59694:
    claim:
      about:
        disease:
          name: Turner Syndrome
          disease_term:
            preferred_term: Turner syndrome
            term:
              id: MONDO:0019499
              label: Turner syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_xo_mouse_ovarian_background_dependence
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: 'Which genetic-background determinants make monosomy X cause profound ovarian reserve
          loss in some mouse strains while leaving other XO females fertile, and do those determinants
          illuminate variability in human Turner syndrome?

          '
        attaches_to:
        - pathophysiology#Accelerated Ovarian Germ Cell Attrition and Follicular Atresia
        rationale: 'The generic statement that XO mice are fertile is true for commonly used backgrounds
          but incomplete. A direct strain comparison found early oocyte loss and infertility or subfertility
          on C57BL/6J, while mixed-background XO females remained as fertile as XX controls despite a
          reduced neonatal oocyte count. That makes genetic background part of the mechanism, not merely
          a nuisance variable. It also prevents either extreme interpretation: the mouse is not a faithful
          generic model of human Turner infertility, but neither is murine monosomy X intrinsically incapable
          of reproducing ovarian attrition.

          '
      selected_evidence:
        snippet: We conclude that the impact of monosomy X on female mouse fertility depends on the genetic
          background.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
