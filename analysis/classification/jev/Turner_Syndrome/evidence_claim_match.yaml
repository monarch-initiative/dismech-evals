      assertion_type: Inheritance
      assertion:
        name: Not inherited (sporadic chromosomal aneuploidy)
        description: 'Turner syndrome arises from a sporadic meiotic or post-zygotic mitotic error and
          is not transmitted in a Mendelian pattern. It is therefore not assigned an HPO mode-of-inheritance
          term: the standard modes describe transmission of alleles, and there is no transmission here.
          Recurrence risk in siblings is not appreciably raised, and the practical genetic-counselling
          content concerns the affected individual''s own reproductive options rather than family segregation.

          '
      selected_evidence:
        snippet: Turner syndrome is a rare condition in women that is associated with either complete
          or partial loss of one X chromosome, often in mosaic karyotypes.
        supports: SUPPORT
