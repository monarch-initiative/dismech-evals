      assertion_type: Treatment
      assertion:
        name: Fertility Preservation by Oocyte Cryopreservation
        description: 'Controlled ovarian stimulation followed by oocyte cryopreservation, offered to post-menarcheal
          individuals with residual fertility potential. The treatment exists because the ovarian lesion
          is attrition rather than absent germ cells: there is a window before the reserve is exhausted,
          and the intervention is an attempt to act inside it. The guideline is explicit that it should
          not be offered to premenarcheal children, which is a limit on the window as much as an ethical
          constraint.

          '
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: fertility preservation
          term:
            id: NCIT:C71326
            label: Fertility Preservation
      selected_evidence:
        snippet: We recommend offering AMH measurements to all individuals with TS from diagnosis. AMH
          should be monitored annually if fertility preservation is considered
        supports: SUPPORT
