  4a36c9cf6d4a1b0ebe2220d2ea765e9ddf174f74ab41c3d174b3c7d3b093b7ee:
    claim:
      about:
        disease:
          name: Turner Syndrome
          disease_term:
            preferred_term: Turner syndrome
            term:
              id: MONDO:0019499
              label: Turner syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Haploinsufficiency of Pseudoautosomal and X-Inactivation Escape Genes
        role: central_effector
        biological_scale: MOLECULAR
        description: 'Genes in the pseudoautosomal regions and the subset of X-linked genes that escape
          X-inactivation are normally transcribed from both sex chromosomes. With one sex chromosome absent
          or truncated they drop to a single functional dose. This node is the convergence point of the
          disease: every downstream arm is a tissue-specific consequence of a dosage shortfall in one
          or more of these genes. Only SHOX is confidently assigned to its phenotype; the identity of
          the escape genes responsible for the gonadal, cardiovascular, renal, auditory and immune arms
          is unresolved, and is curated here as an explicit knowledge gap rather than as a mechanism.

          '
        notes: 'No GO annotation is attached to this node deliberately. The obvious candidate, GO:0009048
          (dosage compensation by inactivation of X chromosome), misdescribes 45,X: with a single X there
          is no second chromosome to inactivate, so dosage compensation is not pathologically decreased,
          it is simply not required. The lesion is half-dose of the pseudoautosomal and escape genes,
          which the node name already states accurately. Preferring no term to a misleading one.

          '
      selected_evidence:
        snippet: How loss of one X chromosome drive these conditions remains largely unknown.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/2
      context_paths:
