              id: MONDO:0019499
              label: Turner syndrome
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: 'Morbidity and mortality are raised across the lifespan, and the burden is distributed
          across organ systems rather than concentrated in one. The dominant avoidable event is aortic
          dissection, which in Turner syndrome occurs younger and at smaller absolute aortic diameters
          than in the general population — so a diameter that would not trigger intervention in an average-height
          adult can be the one that dissects here. Diagnostic delay is itself part of the burden: a mean
          age at diagnosis around 15 years means growth-promoting and cardiac-surveillance interventions
          are frequently started after their window of greatest benefit.

          '
      selected_evidence:
        snippet: Aortic dissection in Turner syndrome occurs in young individuals at smaller aortic diameters
          than in the general population or other forms of genetically triggered aortopathy.
        supports: SUPPORT
    origin:
