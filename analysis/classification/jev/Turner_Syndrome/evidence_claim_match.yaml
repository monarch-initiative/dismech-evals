      assertion_type: Diagnosis
      assertion:
        name: Y Chromosomal Material Screening
        description: 'Molecular screening for Y-chromosome material in individuals with a 45,X karyotype
          and signs of virilization. This is a mechanism with a surveillance consequence rather than a
          diagnostic refinement: retained Y material in a dysgenetic gonad carries a gonadoblastoma and
          dysgerminoma risk, and the finding opens an individualised discussion about gonadectomy weighed
          against residual gonadal function and fertility.

          '
        diagnosis_term:
          preferred_term: Karyotyping
          term:
            id: NCIT:C16768
            label: Karyotyping
        notes: 'The diagnosis_term reuses NCIT:C16768 (Karyotyping) because NCIT has no distinct clinical-action
          term for targeted Y-material molecular screening. The description carries the specificity the
          ontology term cannot.

          '
      selected_evidence:
        snippet: We recommend screening for Y chromosomal material by PCR or other molecular method in
          TS individuals with a 45,X karyotype and signs of virilization
        supports: SUPPORT
