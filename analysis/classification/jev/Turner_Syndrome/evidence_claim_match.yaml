  deb608d9593de548e1bad596372c3a02d430ef617888ce549d47e84d40ab85e3:
    claim:
      about:
        disease:
          name: Turner Syndrome
          disease_term:
            preferred_term: Turner syndrome
            term:
              id: MONDO:0019499
              label: Turner syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_unassigned_escape_genes
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Which X-inactivation escape and pseudoautosomal genes, beyond SHOX, account for the gonadal,
          cardiovascular, renal, auditory and autoimmune arms of Turner syndrome?

          '
        rationale: 'This is the central unresolved question of the disease rather than a loose end. The
          canonical model attributes every arm of the syndrome to haploinsufficiency of escape genes,
          but only one gene-to-phenotype assignment has been made — SHOX to stature and the mesomelic
          skeleton — and the field states explicitly that SHOX does not explain most Turner anomalies.
          Consequently the edges from the escape-gene node to the ovarian and lymphatic arms in this entry
          are curated as INDIRECT, because naming them DIRECT would assert a gene-level mechanism nobody
          has identified. The gap has practical weight: without the responsible genes there is no molecular
          target for the non-growth arms. Every therapy curated in this entry acts downstream of the unknown
          dosage lesion rather than on it — growth hormone drives a partially responsive growth plate,
          estrogen replaces a missing hormone, antihypertensives and aortic surgery act on the consequences
          of a malformation whose genetic cause is unassigned, and oocyte cryopreservation bypasses the
          attrition rather than slowing it. There is no gene-directed therapy for any arm of the disease,
          and there cannot be one until this gap closes.

          '
        attaches_to:
        - pathophysiology#Haploinsufficiency of Pseudoautosomal and X-Inactivation Escape Genes
        proposed_experiments:
        - experiment_id: exp_ts_escape_gene_dosage_mapping
          name: Systematic escape-gene dosage mapping against organ-specific Turner phenotypes
          description: 'Extend the partial-Xp deletion mapping strategy that localised the neurocognitive
            phenotype to PAR1 across the remaining organ arms, using contemporary cohorts of individuals
            with structurally abnormal X chromosomes and defined breakpoints, phenotyped for gonadal reserve,
            cardiac malformation, renal structure and audiometry. The design''s strength is that it is
            the same human-genetics logic already shown to work here, rather than an animal model whose
            fidelity to human X-dosage biology would itself need establishing.

            '
      selected_evidence:
        snippet: As the inheritance of only one copy of the SHOX gene does not explain most of TS anomalies,
          more studies are needed to explain them.
        supports: SUPPORT
    origin:
