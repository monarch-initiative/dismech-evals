      assertion_type: Treatment
      assertion:
        name: Recombinant Growth Hormone
        description: 'Somatropin given from childhood to increase adult height. Mechanistically it is
          not replacement — growth hormone secretion is not deficient in Turner syndrome — but pharmacological
          stimulation of a growth plate whose SHOX dosage deficit has blunted its output. The randomised
          evidence to adult height gives roughly +7 cm, which is the honest size of the effect. The PROTEIN_REPLACEMENT
          modality tag records the therapeutic platform — somatropin is a 191-amino-acid recombinant protein
          — and is not a claim that the treatment replaces a deficient hormone, which it does not.

          '
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: somatropin
            term:
              id: NCIT:C837
              label: Somatropin
      selected_evidence:
        snippet: One hundred fifty-four girls with Turner syndrome, aged 7-13 yr, were randomly assigned
          to one of two groups
        supports: SUPPORT
