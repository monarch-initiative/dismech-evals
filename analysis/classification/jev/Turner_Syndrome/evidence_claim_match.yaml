          X-inactivation. This is the molecular lesion itself — reduced SHOX gene dose — held separately
          from the cellular programme it dysregulates, because the same dosage lesion arises in Léri-Weill
          dyschondrosteosis from PAR1 deletion in individuals with two intact sex chromosomes. It is the
          one arm of Turner syndrome where the responsible gene is named with confidence.

