          — which is why the guideline specifies an age window (8-9 years, then annually) rather than
          a single measurement, and why a normal value in mid-childhood carries no reassurance.

          '
        biomarker_term:
          preferred_term: follicle-stimulating hormone
          term:
            id: NCIT:C181076
            label: Follicle-Stimulating Hormone
        readouts:
        - target: Hypergonadotropic Hypogonadism and Estrogen Deficiency
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: 'A rising FSH without pubertal signs is the biochemical definition of the hypergonadotropic
            state this node represents, and is the trigger for hormone replacement.

            '
      selected_evidence:
        snippet: 'Circulating concentrations of both FSH and LH present a biphasic pattern in TS individuals
          with hypogonadism: elevated after birth, declining to values similar to girls with normal ovarian
          function during mid-childhood, and rising again in the peripubertal years, or at the time of
          loss of ovarian function.'
        supports: SUPPORT
