              fertility. The model therefore captures a background-modified ovarian-reserve phenotype,
              not a stable mouse analogue of human Turner infertility.

              '
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Accelerated Ovarian Germ Cell Attrition and Follicular Atresia
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: 'C57BL/6J XO females reproduce early oocyte loss and infertility or subfertility,
          while mixed-background XO females show a milder reserve loss without the human fertility endpoint.

          '
        limitations: 'Fidelity is strongly strain-dependent: mixed-background XO females retain normal
          fertility, and even the C57BL/6J phenotype does not reproduce the profound prenatal lethality
          or near-universal ovarian failure of human non-mosaic 45,X. The series can test modifiers of
          oocyte loss but cannot be treated as a generic model of the full Turner ovarian phenotype.

          '
      selected_evidence:
        snippet: In this article, we report that XO mice on the C57BL/6J (B6) genetic background showed
          early oocyte loss, infertility or subfertility and high embryonic lethality, suggesting that
          the effect of monosomy X in the female germline may be shared between mice and humans.
        supports: SUPPORT
