        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Complete or Partial Loss of One X Chromosome
        role: trigger
        biological_scale: MOLECULAR
        description: 'A meiotic or post-zygotic mitotic error leaves a phenotypically female individual
          with one intact X and either no second sex chromosome (45,X), a structurally abnormal second
          X (ring, isochromosome, deletion), or a mosaic mixture of cell lines. This is the only whole-chromosome
          haploinsufficiency compatible with postnatal life, which is itself the first mechanistic fact
          about the disease: survival is possible because X-inactivation has already reduced most X-linked
          genes to one functional copy in typical cells, so only the genes exempt from that silencing
          are actually rendered haploinsufficient by the loss.

          '
      selected_evidence:
        snippet: Turner syndrome is a rare condition in women that is associated with either complete
          or partial loss of one X chromosome, often in mosaic karyotypes.
        supports: SUPPORT
