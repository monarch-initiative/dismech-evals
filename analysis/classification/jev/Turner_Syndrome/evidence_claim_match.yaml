        hypothesis_groups:
        - lymphatic_obstruction_hemodynamic_model
        description: 'Clark''s hemodynamic hypothesis: distended thoracic ducts compress the ascending
          aorta and redirect intracardiac flow, producing left-heart obstructive lesions. This edge is
          curated as belonging to a named hypothesis rather than as established fact — the epidemiological
