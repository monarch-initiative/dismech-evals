              label: twin to twin transfusion syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Fetoscopic laser photocoagulation
        description: 'The primary treatment for TTTS diagnosed at 16-26 weeks. A fetoscope is introduced
          into the recipient sac under ultrasound guidance and a laser is used to coagulate all placental
          vascular anastomoses connecting the two fetal circulations. The Solomon technique (dichorionization)
          involves coagulating the entire vascular equator to reduce the risk of recurrent TTTS and twin
          anemia-polycythemia sequence (TAPS). High-volume centers report up to 70% double survival and
          at least one survivor in over 90% of cases.

          '
        treatment_term:
          preferred_term: Laser ablation for twin twin transfusion syndrome
          term:
            id: NCIT:C111241
            label: Laser Ablation
      selected_evidence:
        snippet: As compared with the amnioreduction group, the laser group had a higher likelihood of
          the survival of at least one twin to 28 days of age (76 percent vs. 56 percent; relative risk
          of the death of both fetuses, 0.63; 95 percent confidence interval, 0.25 to 0.93; P=0.009)
        supports: SUPPORT
    origin:
