          term:
            id: GO:0008286
            label: insulin receptor signaling pathway
      selected_evidence:
        snippet: These alterations in glucose transport activity are likely the result of dysregulation
          of intramyocellular fatty acid metabolism, whereby fatty acids cause insulin resistance by activation
          of a serine kinase cascade, leading to decreased insulin-stimulated insulin receptor substrate
          (IRS)-1 tyrosine phosphorylation and decreased IRS-1-associated phosphatidylinositol 3-kinase
          activity, a required step in insulin-stimulated glucose transport into muscle.
        supports: SUPPORT
