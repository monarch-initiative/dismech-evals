          value:
            target: White Adipose Tissue Inflammation
            relationship: RECAPITULATES
            fidelity: MODERATE
            description: 'Reproduces this node in human cells down to its histologic signature, and supplies
              the polarization control the rodent literature reaches by cytokine neutralization: M2 macrophages
              present in the same numbers do not produce the phenotype.'
            limitations: Inflammation is imposed by adding pre-polarized macrophages rather than arising
              from resident immune recruitment, so the model reproduces the inflamed state without reproducing
              how patients arrive at it. There is no vasculature, no lymphocyte compartment and no adipose
              expansion over time. Isogenic by design, so it cannot speak to donor variation in inflammatory
              susceptibility.
          role: ancestor
