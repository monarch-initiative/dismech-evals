        context:
        - path: /animal_models/0
          value:
            name: FATP1 (Slc27a1) knockout mouse on high-fat diet
            species: Mouse
            genotype: Slc27a1 (FATP1) targeted deletion, homozygous null
            background: Diet-induced obesity
            publication: PMID:16611988
            genes:
            - preferred_term: SLC27A1
              term:
                id: hgnc:10995
                label: SLC27A1
            description: 'Germline loss of the insulin-responsive fatty acid transporter. Insulin-stimulated
              long-chain fatty acid uptake is abolished in adipocytes and greatly reduced in skeletal
              muscle while basal uptake is untouched, postprandial fatty acids are redistributed from
              adipose and muscle to the liver, and the animals are completely protected from diet-induced
              obesity and insulin desensitization. The protection is the reason this model is curated:
              it is the result that prevents the adipocyte fatty acid uptake node from being drawn as
              a straightforward driver of insulin resistance.'
          role: ancestor
        - path: /animal_models/0/modeled_mechanisms/0
          value:
            target: Insulin-Stimulated Adipocyte Fatty Acid Uptake via FATP1
            relationship: PERTURBS
            fidelity: MODERATE
            description: Removes the hormone-responsive arm of adipocyte fatty acid uptake genetically,
              and shows the loss is specific to the insulin-stimulated component rather than to fatty
              acid handling generally.
            limitations: A germline null cannot separate lifelong adaptation from the acute consequence
              of losing the transporter, which matters here because the whole-animal outcome is protection
              rather than harm. Lipid is redistributed to the liver rather than simply not absorbed, so
              adipose and muscle are spared at a hepatic cost this entry does not model. Murine, and no
              human SLC27A1 variant evidence is curated here.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Diet-induced obesity and insulin desensitization
        target: Insulin-Stimulated Adipocyte Fatty Acid Uptake via FATP1
        direction: ABOLISHED
        interpretation: The counterintuitive result. If loss of this arm were simply a pathogenic feature
          of the insulin-resistant adipocyte, animals lacking it should be worse; they are protected.
          This readout is what the attached knowledge-gap discussion turns on.
      selected_evidence:
        snippet: led to a complete protection from diet-induced obesity and insulin desensitization.
        supports: SUPPORT
