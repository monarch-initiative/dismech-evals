          value:
            name: Isogenic iPSC macrophage-adipocyte microphysiological system (iMAC-iADIPO-MPS)
            description: 'Human adipose tissue inflammation reconstructed from isogenic induced pluripotent
              stem cells. Macrophages migrate into three-dimensional adipocyte clusters and form crown-like
              structures around damaged adipocytes, reproducing the defining histology of obese human
              adipose tissue, and the number of such structures increases with adipocyte age and with
              palmitic acid exposure so inflammatory severity is gradable. Polarization is the operative
              variable: M1 but not M2 macrophages induce adipocyte insulin resistance and dysregulated
              lipolysis, and transcriptomic and cytokine profiling identify a reciprocal proinflammatory
              loop between the two cell types.'
            experimental_model_type: ORGAN_ON_CHIP
            namo_type: namo:OrganOnChip
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
