        context:
        - path: /experimental_models/2
          value:
            name: Isogenic iPSC adipocyte-hepatocyte-macrophage microphysiological system (M1-iADIPO-iHEP-MPS)
            description: 'The adipose compartment above fluidically connected to an induced pluripotent
              stem cell-derived hepatocyte compartment by circulating media, with all three cell types
              from one donor line. Because adipose expansion (set by the adipocyte-to-hepatocyte ratio)
              and adipose inflammation (set by macrophage polarization) are varied independently, the
              system separates two variables that animal models confound, and finds inflammation rather
              than expansion to be the driver of hepatic insulin resistance. It also carries the drug
              panel: metformin and rosiglitazone improve the hepatic compartment, dexamethasone does not,
              and the GLP-1 receptor agonist semaglutide works through the adipocyte compartment alone.'
            experimental_model_type: ORGAN_ON_CHIP
            namo_type: namo:OrganOnChip
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: white adipose tissue
              term:
                id: UBERON:0001347
                label: white adipose tissue
            cell_types:
            - preferred_term: iPSC-derived white adipocyte (iADIPO)
              term:
                id: CL:0000448
                label: white adipocyte
            - preferred_term: iPSC-derived hepatocyte (iHEP)
              term:
                id: CL:0000182
                label: hepatocyte
            - preferred_term: iPSC-derived proinflammatory (M1) macrophage (iMAC)
              term:
                id: CL:0000863
                label: M1 macrophage
            conditions:
            - white adipose tissue inflammation imposed by proinflammatory macrophages
            - graded adipose expansion set by adipocyte-to-hepatocyte ratio
            - hepatic insulin resistance and hepatic glucose production
            - pharmacological intervention with metformin, rosiglitazone, dexamethasone and semaglutide
            cell_source: Isogenic human induced pluripotent stem cell-derived white adipocytes, hepatocytes
              and macrophages from a single donor line
            culture_system: Interconnected two-chamber microphysiological system with circulating media
              at 20 microlitres per hour, and a non-circulating flow-through configuration for compartment-selective
              drug exposure
            publication: PMID:39266553
            notes: Fully curated for its MASLD arm in the Metabolic_Dysfunction-Associated_Steatotic_Liver_Disease
              entry, where the same chip is linked to hepatocyte lipid overload and hepatic fatty acid
              uptake. The links here are the type 2 diabetes arm of the same system, and the two entries
              should be kept consistent if either is revised.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Insulin Resistance
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Produces insulin resistance across two connected human tissues from a single upstream
          manipulation, and adjudicates between adipose inflammation and adipose expansion as its cause.
          Expansion alone produced hepatic insulin resistance only at an extreme adipocyte-to-hepatocyte
          ratio; inflammation produced it readily.
        limitations: Two tissues only — no muscle and no islet, so neither the largest site of insulin-stimulated
          glucose disposal nor the beta-cell arm of this entry is represented. Insulin resistance is imposed
          over days by macrophage polarization rather than developing over years, and the iPSC-derived
          cells retain a fetal-like maturation state. There is no central control of feeding or body weight,
          which is precisely why the semaglutide result is interpretable here and confounded in rodents.
        readouts:
        - name: Insulin suppression of hepatic glucose production under adipose inflammation
          target: Insulin Resistance
          direction: DECREASED
          biological_processes:
          - preferred_term: Insulin Receptor Signaling
            term:
              id: GO:0008286
              label: insulin receptor signaling pathway
          interpretation: Measured in the hepatocyte compartment after manipulating only the adipose compartment,
            so it reads the transfer of insulin resistance between tissues rather than a cell-autonomous
            defect.
      selected_evidence:
        snippet: macrophage-induced adipocyte inflammation causes lipid accumulation in hepatocytes and
          MPS-wide insulin resistance, corresponding to initiation of metabolic dysfunction-associated
          steatotic liver disease.
        supports: SUPPORT
