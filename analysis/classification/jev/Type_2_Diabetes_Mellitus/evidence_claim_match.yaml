      assertion:
        name: TBC1D4
        gene_term:
          preferred_term: TBC1D4
          term:
            id: hgnc:19165
            label: TBC1D4
        association: Founder nonsense variant, recessive effect
        relationship_type: SUSCEPTIBILITY
        notes: 'The gene behind MONDO:0014488 "diabetes mellitus, noninsulin-dependent, 5", which MONDO
          defines as a type 2 diabetes in which the cause is a TBC1D4 mutation. It is recorded here rather
          than as a subtype of the diabetes mellitus umbrella because the phenotype is type 2 diabetes
          with a defined muscle mechanism, not a separate clinical entity: the p.Arg684Ter allele is common
          in the Greenlandic population (17% allele frequency in the study population), acts overwhelmingly
          in homozygotes - heterozygotes show only a moderately higher 2-hour glucose - and raises risk
          rather than being fully penetrant, so SUSCEPTIBILITY rather than CAUSATIVE. The committed ClinGen
          Gene-Disease Validity snapshot (data/clingen/gene_validity.csv) carries no TBC1D4 row for any
          disease.'
      selected_evidence:
        snippet: we discovered a nonsense p.Arg684Ter variant (in which arginine is replaced by a termination
          codon) in the gene TBC1D4 with an allele frequency of 17%
        supports: SUPPORT
