  02dded652e60cb8ce0d2ebaf7dc7a07254b685e5e54f76d5634b90827fe97cc1:
    claim:
      about:
        disease:
          name: Type 2 Diabetes Mellitus
          disease_term:
            preferred_term: type 2 diabetes mellitus
            term:
              id: MONDO:0005148
              label: type 2 diabetes mellitus
        context:
        - path: /computational_models/0
          value:
            name: Topp Beta-Cell Mass / Insulin / Glucose Model
            description: 'Minimal three-ODE dynamical model of the glucose regulatory system (Topp et
              al. 2000): plasma glucose, plasma insulin, and beta-cell mass, with fast glucose/insulin
              dynamics on a slow beta-cell-mass manifold. For normal parameters the system is bistable
              - a physiological steady state (euglycemia) and a pathological, insulinopenic steady state
              (beta-cell-mass collapse and severe hyperglycemia) separated by a saddle. This makes it
              the reference dynamical substrate for type 2 diabetes: reduced insulin sensitivity, impaired
              secretion, or hepatic glucose overproduction decompensates the at-risk state to overt diabetes,
              and it is wired for perturbation analysis (see the model config sidecar) so that both risk
              genes and glucose-lowering treatments can be simulated as parameter changes.'
            model_type: KINETIC
            repository_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000341
            model_id: BIOMD0000000341
            model_software: COPASI
            model_format: SBML
            publication: PMID:11013117
            perturbations:
            - preferred_term: PPARG
              term:
                id: hgnc:9236
                label: PPARG
            - preferred_term: TCF7L2
              term:
                id: hgnc:11641
                label: TCF7L2
            - preferred_term: KCNJ11
              term:
                id: hgnc:6257
                label: KCNJ11
            - preferred_term: HNF1A
              term:
                id: hgnc:11621
                label: HNF1A
            - preferred_term: GCK
              term:
                id: hgnc:4195
                label: GCK
            - preferred_term: SLC5A2
              term:
                id: hgnc:11037
                label: SLC5A2
            notes: 'Wired for dismech-perturb (models/BIOMD0000000341/config.yaml). The disease-severity
              dial is insulin sensitivity si (baseline_gfr 0.72 = healthy); the deposited initial state
              (G=250 mg/dL) sits on the model''s unstable saddle, i.e. the metabolically at-risk / impaired-fasting
              tipping point. Glucose-lowering treatments are simulated as parameter changes: metformin
              (R0 down), thiazolidinedione (si up), SGLT2 inhibitor (Eg0 up, insulin-independent), sulfonylurea/GLP-1
              (sigma up), insulin therapy (net insulin action up). Insulin-independent therapies (SGLT2
              inhibition, metformin) and sensitizers (TZD) recompensate the model to euglycemia, whereas
              a pure secretagogue fails once beta-cell mass has collapsed - reproducing secondary secretagogue
              failure in advanced disease. Thresholds are calibrated to model steady-state values, not
              clinical reference ranges.'
            variables:
            - name: Fasting_Plasma_Glucose
              dataset_identifier: G
              description: Plasma glucose concentration at steady state.
              unit: mg/dL
              mappings_list:
              - preferred_term: glucose
                term:
                  id: CHEBI:17234
                  label: glucose
              - preferred_term: Hyperglycemia
                description: Steady-state plasma glucose above the model's decompensation level. The pathological
                  fixed point runs near 600 mg/dL; the physiological fixed point near 100 mg/dL. Bands
                  are calibrated to model steady states, not clinical fasting-glucose cutoffs.
                term:
                  id: HP:0003074
                  label: Hyperglycemia
                threshold: 126
                threshold_direction: above
                severity_scale:
                - threshold: 126
                  name: mild
                - threshold: 200
                  name: moderate
                - threshold: 400
                  name: severe
            - name: Plasma_Insulin
              dataset_identifier: I
              description: Plasma insulin concentration at steady state. Elevated in the compensated insulin-resistant
                regime and near-zero after glucotoxic beta-cell-mass collapse.
              unit: uU/mL
              mappings_list:
              - preferred_term: Hyperinsulinemia
                description: Compensatory hyperinsulinemia in the insulin-resistant regime before beta-cell-mass
                  collapse. Threshold calibrated to model steady state (healthy ~10 uU/mL).
                term:
                  id: HP:0000842
                  label: Hyperinsulinemia
                threshold: 18
                threshold_direction: above
                severity_scale:
                - threshold: 18
                  name: mild
                - threshold: 30
                  name: moderate
                - threshold: 60
                  name: severe
            - name: Beta_Cell_Mass
              dataset_identifier: B
              description: Functional beta-cell mass (slow state variable). Expands under mild hyperglycemia
                (compensation) and collapses toward zero under sustained extreme hyperglycemia (glucotoxicity),
                the positive-feedback route to insulinopenic diabetes.
              unit: mg
          role: ancestor
      assertion_type: Finding
      assertion:
        statement: For normal parameters the model is bistable, with a physiological (euglycemic) and
          a pathological (hyperglycemic, beta-cell-collapse) steady state separated by a saddle - the
          dynamical basis for decompensation to overt diabetes.
      selected_evidence:
        snippet: For normal parameter values, the model has two stable fixed points (representing physiological
          and pathological steady states), separated on a slow manifold by a saddle point
        supports: SUPPORT
    origin:
      assertion_path: /computational_models/0/findings/0
      evidence_path: /computational_models/0/findings/0/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /computational_models/0
    evidence_metadata:
      reference: PMID:11013117
      reference_title: 'A model of beta-cell mass, insulin, and glucose kinetics: pathways to diabetes.'
      evidence_source: COMPUTATIONAL
      explanation: Confirms the bistable, saddle-separated structure that lets an impairing perturbation
        tip the at-risk state to overt diabetes while a corrective treatment restores euglycemia.
