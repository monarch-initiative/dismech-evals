        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Insulin-Stimulated Adipocyte Fatty Acid Uptake via FATP1
        biological_scale: MOLECULAR
        description: 'Insulin acts on the adipocyte through two transporter arms, not one. Alongside GLUT4,
          insulin drives translocation of fatty acid transport proteins — FATP1 (SLC27A1) and FATP4 (SLC27A4)
          — from an intracellular perinuclear compartment to the plasma membrane within minutes, and long-chain
          fatty acid uptake rises in parallel. In FATP1-null adipocytes the insulin-stimulated component
          of fatty acid uptake is entirely absent while basal uptake is unaffected, so FATP1 specifically
          carries the hormone-responsive arm. Tumor necrosis factor alpha from inflamed adipose tissue
          suppresses this arm and lowers FATP1 and FATP4 protein. This node is deliberately terminal.
          Whether losing the arm drives systemic insulin resistance is genuinely unsettled — FATP1-null
          mice, which lack it from birth, are completely protected from diet-induced insulin desensitization
          — so no edge is drawn into Insulin Resistance and the tension is carried by the kgap_t2d_fatp1_insulin_stimulated_fatty_acid_uptake
          discussion instead. The node is curated because it is a real, measurable arm of adipocyte insulin
          action that the entry otherwise omits, and because it is one of the three functional assays
          the human adipose microphysiological systems use to score insulin sensitivity.

          '
        genes:
        - preferred_term: SLC27A1
          term:
            id: hgnc:10995
            label: SLC27A1
        - preferred_term: SLC27A4
          term:
            id: hgnc:10998
            label: SLC27A4
        cell_types:
        - preferred_term: White Adipocyte
          term:
            id: CL:0000448
            label: white adipocyte
        - preferred_term: Skeletal Muscle Cell
          term:
            id: CL:0000188
            label: cell of skeletal muscle
        biological_processes:
        - preferred_term: Insulin-Stimulated Long-Chain Fatty Acid Import
          term:
            id: GO:0044539
            label: long-chain fatty acid import into cell
          modifier: DECREASED
        - preferred_term: Insulin Receptor Signaling
          term:
            id: GO:0008286
            label: insulin receptor signaling pathway
        molecular_functions:
        - preferred_term: FATP1/FATP4 long-chain fatty acid transport activity
          term:
            id: GO:0005324
            label: long-chain fatty acid transmembrane transporter activity
        locations:
        - preferred_term: White Adipose Tissue
          term:
            id: UBERON:0001347
            label: white adipose tissue
      selected_evidence:
        snippet: in adipocytes, insulin induces plasma membrane translocation of FATPs from an intracellular
          perinuclear compartment to the plasma membrane.
        supports: SUPPORT
