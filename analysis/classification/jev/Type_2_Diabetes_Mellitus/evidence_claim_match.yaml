  d10cc60a0dfa9a2f7ffa9807b5e0cd0899cfc01230cdeb23af9daa6c067f66ce:
    claim:
      about:
        disease:
          name: Type 2 Diabetes Mellitus
          disease_term:
            preferred_term: type 2 diabetes mellitus
            term:
              id: MONDO:0005148
              label: type 2 diabetes mellitus
        context: []
      assertion_type: Biochemical
      assertion:
        name: NMR metabolomic risk score (MetRS)
        specificity: 'A research composite, not a clinical assay. MetRS is a machine-learning score built
          from the top 30 of 313 Nightingale Health NMR plasma measures, derived and replicated in UK
          Biobank. It is not validated for clinical use and does not replace fasting glucose or HbA1c.

          '
        context: 'In the UK Biobank metabolome-phenome atlas, MetRS classified prevalent type 2 diabetes
          with an area under the curve of 0.941 and predicted incident diabetic complications, including
          diabetic maculopathy (0.921), diabetic kidney failure (0.919) and type 2 diabetes with peripheral
          circulatory complications (0.913). No presence value is recorded because MetRS is a derived
          multi-analyte score rather than a measured analyte. Two limits matter for interpretation: the
          score is trained and tested in a single, predominantly European-ancestry volunteer cohort, and
          a high classification area under the curve for prevalent disease partly reflects the metabolic
          consequences of established diabetes rather than antecedent risk.

          '
        readouts:
        - target: Chronic Hyperglycemia
          relationship: CORRELATES_WITH
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: 'The lipid, amino-acid and glycolysis-related measures that dominate MetRS shift
            with sustained hyperglycemia and insulin resistance, so the score reads out the systemic metabolic
            state rather than any single mechanism.

            '
      selected_evidence:
        snippet: MetRS offered favourable diagnostic and predictive performance, particularly in T2D
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/1
      evidence_path: /biochemical/1/evidence/0
      context_paths:
