        context: []
      assertion_type: Pathophysiology
      assertion:
        name: White Adipose Tissue Inflammation
        biological_scale: TISSUE
        description: 'With expanding adiposity, bone-marrow-derived macrophages accumulate in white adipose
          tissue, shift toward classical (M1) proinflammatory activation, and surround damaged adipocytes
          as crown-like structures. The resulting local and systemic tumor necrosis factor alpha, together
          with other proinflammatory cytokines, impairs adipocyte insulin signalling and releases lipolysis
          from insulin restraint, so non-esterified fatty acids and cytokines are exported to liver and
          muscle. This node is the adipose-tissue origin of the insulin resistance the entry otherwise
          begins with: the Insulin Resistance node names adipose as a resistant tissue but does not say
          what makes it resistant. The causal direction is anchored by an intervention rather than an
          association: neutralizing tumor necrosis factor alpha in obese rats restores insulin-stimulated
          peripheral glucose uptake.

          '
        cell_types:
        - preferred_term: White Adipocyte
          term:
            id: CL:0000448
            label: white adipocyte
        - preferred_term: Proinflammatory (M1) Adipose Tissue Macrophage
          term:
            id: CL:0000863
            label: M1 macrophage
        genes:
        - preferred_term: TNF
          term:
            id: hgnc:11892
            label: TNF
        biological_processes:
        - preferred_term: Adipose Tissue Inflammation
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
        - preferred_term: Tumor Necrosis Factor Production
          term:
            id: GO:0032640
            label: tumor necrosis factor production
          modifier: INCREASED
        - preferred_term: Dysregulated Adipocyte Lipolysis
          term:
            id: GO:0019433
            label: triglyceride catabolic process
          modifier: INCREASED
        locations:
        - preferred_term: White Adipose Tissue
          term:
            id: UBERON:0001347
            label: white adipose tissue
      selected_evidence:
        snippet: the percentage of cells expressing the macrophage marker F4/80 (F4/80+) was significantly
          and positively correlated with both adipocyte size and body mass
        supports: SUPPORT
