              preferred_term: white adipose tissue
              term:
                id: UBERON:0001347
                label: white adipose tissue
            cell_types:
            - preferred_term: iPSC-derived white adipocyte (iADIPO)
              term:
                id: CL:0000448
                label: white adipocyte
            - preferred_term: iPSC-derived macrophage (iMAC), M1 and M2 polarized
              term:
                id: CL:0000235
                label: macrophage
            conditions:
            - chronic white adipose tissue inflammation
            - M1 versus M2 macrophage polarization
            - palmitic acid lipotoxic exposure
            - adipocyte aging in culture
            cell_source: Isogenic human induced pluripotent stem cell-derived macrophages and adipocytes
            culture_system: Microphysiological system supporting three-dimensional adipocyte clusters
              with macrophage infiltration
            publication: PMID:37104853
