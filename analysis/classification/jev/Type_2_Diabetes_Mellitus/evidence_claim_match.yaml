          that experiment should have gone the other way. Three readings survive the curated evidence
          and it does not discriminate between them. The loss may be a compensatory brake that limits
          adipocyte lipid loading, in which case it is protective and the cytokine effect is not the lesion.
          It may be pathogenic acutely but confounded in the knockout by lifelong adaptation and by the
          redistribution of postprandial lipid to the liver that the same paper reports — a redistribution
          that spares adipose at a hepatic cost this entry does not model. Or the timing may matter: a
          transient suppression during an established inflammatory state is not the same intervention
          as congenital absence. The discriminating experiment is unusually close to hand. Human adipose
          microphysiological systems already use insulin-stimulated fatty acid uptake as one of their
          three validated insulin-sensitivity assays, so the readout exists in a human non-animal system;
          what has not been reported is that assay run against an acute FATP1 knockdown, with and without
          the inflammatory stimulus.'
