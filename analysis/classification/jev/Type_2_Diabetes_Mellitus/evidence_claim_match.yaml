  8550d2c5f8e294b759891617887e331f6911c5293a426009cabd9b66e01f6c30:
    claim:
      about:
        disease:
          name: Type 2 Diabetes Mellitus
          disease_term:
            preferred_term: type 2 diabetes mellitus
            term:
              id: MONDO:0005148
              label: type 2 diabetes mellitus
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pgs_context_amplification
        hypothesis_label: Amplification of polygenic T2D risk in adverse metabolic contexts via shared
          insulin-resistance convergence
        status: EMERGING
        description: 'Polygenic-score-by-context (PGS×C) interactions reported for type 2 diabetes in
          the UK Biobank appear to reflect amplification rather than context-specific causal variants:
          the same susceptibility loci (e.g. TCF7L2, PPARG, KCNJ11, SLC30A8) exert systematically larger
          effects in disease-promoting metabolic contexts. This entry proposes that the amplification
          arises because polygenic liability and adverse exposures converge on the shared Insulin Resistance
          node (with Beta Cell Dysfunction as a parallel target), so their joint effect on the liability-threshold
          scale is super-additive rather than additive. Nagpal & Gibson (Nat Genet 2026, PMID:42443528)
          highlight the interaction between reduced polyunsaturated fatty acids (low omega-6) and high
          glucose, which elevates T2D risk increasingly as the PGS rises, and identify sex and sex-adjusted
          testosterone as further amplifying contexts.'
        notes: EMERGING hypothesis motivated by population-scale PGS×context analyses (primary source
          PMID:42443528; general amplification mechanism corroborated by PMID:37228747, which documents
          testosterone-mediated amplification). The convergence claim (polygenic liability + adverse metabolic
          context → Insulin Resistance) is a mechanistic interpretation and is not itself established
          as causal — see the reverse-causation knowledge gap under discussions.
      selected_evidence:
        snippet: GxSex is pervasive but acts primarily through systematic sex differences in the magnitude
          of many genetic effects
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37228747
      reference_title: Amplification is the primary mode of gene-by-sex interaction in complex human traits.
      evidence_source: COMPUTATIONAL
      explanation: Establishes amplification — systematic differences in the magnitude of polygenic effects
        rather than in the identity of causal variants — as the primary mode of gene-by-sex interaction
        across physiological traits, and notes that testosterone may mediate this amplification. Cited
        as general support for amplification as a mode of PGS×context interaction; the paper is not T2D-specific.
