        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: viral_interferon_beta_cell_autoimmunity_model
        hypothesis_label: Viral-Interferon Beta-Cell Autoimmunity Model
        status: EMERGING
        description: Enteroviral or other viral exposure in a genetically susceptible host induces interferon
          signaling in pancreatic islets, increasing beta-cell antigen presentation, chemokine release,
          and stress programs that may bridge innate antiviral responses to durable adaptive beta-cell
          autoimmunity.
        notes: 'Retained as EMERGING per the 2026 openscientist hypothesis-search report (kb/hypotheses/Type_I_Diabetes/viral_interferon_beta_cell_autoimmunity_model/openscientist.md).
          The report judged the model partially supported: the beta-cell interferon arm is the best-supported
          component, while pathogen-specific causality, same-person temporal ordering from viral exposure
          to autoantibody seroconversion, and applicability beyond rapid/fulminant presentations remain
          unresolved. Kept at EMERGING after a 2026 assessment of that report even though both arms now
          have a positive interventional trial behind them, because both are phase 2 with no replication:
          antiviral treatment (pleconaril plus ribavirin, n=96) and JAK inhibition (baricitinib, n=91)
          each preserved stimulated C-peptide in new-onset disease. The report also overstated two of
          its own sources, reading a co-expressed islet signature as a timed interferon to chemokine to
          MHC sequence and attaching the wrong odds ratio to the IFIH1 risk allele; both are corrected
          where the underlying findings are curated.'
      selected_evidence:
        snippet: These data suggest that IFN-α and IFN-γ are key cytokines at the islet level in human
          type 1 diabetes, contributing to the triggering and amplification of autoimmunity.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
