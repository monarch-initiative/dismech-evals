            term:
              id: MONDO:0005147
              label: type 1 diabetes mellitus
        context: []
      assertion_type: Biochemical
      assertion:
        name: NMR metabolomic risk score (MetRS)
        specificity: 'A research composite, not a clinical assay. MetRS is a machine-learning score built
          from the top 30 of 313 Nightingale Health NMR plasma measures, derived and replicated in UK
          Biobank. It is not validated for clinical use and does not replace glucose, HbA1c or islet autoantibody
          testing, which remain the basis of type 1 diabetes diagnosis and staging.

          '
        context: 'In the UK Biobank metabolome-phenome atlas, MetRS classified prevalent type 1 diabetes
          with an area under the curve of 0.944, the highest of the four diagnostic areas under the curve
          the source reports (type 1 diabetes 0.944, type 2 diabetes 0.941, diabetic maculopathy 0.940,
          chronic kidney disease 0.933). The source does not rank it highest across the whole analysis,
          and this entry does not claim that. No presence value is recorded because MetRS is a derived
          multi-analyte score rather than a measured analyte. The score is a readout of the systemic metabolic
          consequences of insulin deficiency in people who already have the disease; it carries no information
          about islet autoimmunity, and nothing here supports using metabolomics in place of autoantibody-based
          staging or to distinguish type 1 from type 2 diabetes. The cohort is middle-aged and older adult
          volunteers, so prevalent cases are largely long-standing and insulin-treated.

          '
        readouts:
        - target: Hyperglycemia
          relationship: CORRELATES_WITH
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: 'The glycolysis-related, ketone-body, amino-acid and lipoprotein measures that
            dominate MetRS shift with sustained hyperglycemia and insulin deficiency, so the score reads
            out the systemic metabolic state rather than the autoimmune process that causes it.

            '
      selected_evidence:
        snippet: The MetRS witnessed excellent diagnosis for type 1 diabetes (T1D; AUC = 0.944), T2D (AUC
          = 0.941), diabetic maculopathy (AUC = 0.940) and chronic kidney disease (CKD; AUC = 0.933).
        supports: SUPPORT
