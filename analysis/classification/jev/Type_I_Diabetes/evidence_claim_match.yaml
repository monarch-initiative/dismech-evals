  e4e9c78cda003a8c0601e368b5439db334af957c6b192064c1786426920fde7d:
    claim:
      about:
        disease:
          name: Type I Diabetes
          disease_term:
            preferred_term: type 1 diabetes mellitus
            term:
              id: MONDO:0005147
              label: type 1 diabetes mellitus
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_t1d_interferon_protective_versus_destructive_balance
        prompt: What decides whether the interferon programs induced in a beta cell favour destruction,
          through MHC class I overexpression and chemokine release, or protection, through PD-L1 and HLA-E
          checkpoint ligands?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Interferon-Driven Beta Cell Response
        - pathophysiology#Autoimmune Destruction of Beta Cells
        rationale: The same interferon-alpha exposure that raises antigen presentation and chemokine output
          on human beta cells also raises the checkpoint ligands PD-L1 and HLA-E, so this node carries
          opposing programs rather than a single destructive one. Two clinical observations bracket the
          question without answering it. Blocking PD-1 or PD-L1 pharmacologically produces insulin-dependent
          diabetes in close to one percent of treated cancer patients, which shows the protective arm
          is load-bearing in people. Sustained exogenous interferon-alpha in chronic hepatitis C produces
          the disease at ten to eighteen times background rate, which shows enough interferon overwhelms
          that arm. What is missing is any quantitative account of where the crossover sits, whether it
          is set by interferon dose, by duration, by genotype, or by disease stage. Without it the entry
          cannot say why most viral infections never produce autoimmune diabetes, and cannot predict who
          would benefit from interferon or JAK blockade rather than be harmed by it.
      selected_evidence:
        snippet: We conclude that autoimmune, insulin-dependent diabetes occurs in close to 1% of patients
          treated with anti-PD-1 or -PD-L1 CPIs.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29937434
      reference_title: 'Collateral Damage: Insulin-Dependent Diabetes Induced With Checkpoint Inhibitors.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the premise of this gap in humans. Removing the PD-1 and PD-L1 brake pharmacologically
        is by itself sufficient to precipitate insulin-dependent diabetes, so the protective arm of the
        interferon response is load-bearing and the balance between the two arms is a real determinant
        rather than a modelling convenience.
