        discussion_id: u2af2_dosage_versus_altered_function
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Germline U2AF2 RNA Recognition Motif Variant
        - pathophysiology#Altered Splicing of Neurodevelopmental RNA-Binding Protein Transcripts
        prompt: Do the recurrent RRM missense variants act purely as partial loss of function equivalent
          to reduced U2AF2 dosage, and which human neural transcripts mis-spliced by them account for
          the brain phenotype?
        rationale: Fly rescue experiments classify the recurrent variants as partial loss of function,
          and a whole-gene deletion produces an overlapping phenotype, but the missense proteins are expressed
          at normal levels and missense variants cluster at RNA-contacting residues, which leaves open
          a dominant or substrate-specific component. The splicing targets identified so far come from
          fly brain knockdown and from non-neural human cell lines; no transcriptome of patient-derived
          neurons carrying the variants has identified the disease-relevant human splicing events. The
          facial, growth and cardiac features have no mechanistic node in this entry for the same reason.
      selected_evidence:
        snippet: The patient's clinical features overlap substantially with those reported in individuals
          harboring heterozygous U2AF2 variants, supporting haploinsufficiency as a plausible disease
          mechanism.
        supports: SUPPORT
        directness: INDIRECT
