        name: Germline U2AF2 RNA Recognition Motif Variant
        conforms_to: spliceosome_component_dysfunction#Germline Spliceosome Component Variant
        description: A heterozygous de novo U2AF2 variant, usually a missense change in RNA recognition
          motif 1 or 2, alters the U2AF65 subunit that binds the polypyrimidine tract of 3' splice sites.
          The recurrent Arg149Trp, Arg150His and Arg150Cys substitutions lower the affinity of U2AF2 for
          a consensus polypyrimidine-tract RNA by roughly three- to five-fold by disrupting Arg146 contacts
          with the terminal nucleotide, without changing U2AF2 protein abundance or nuclear localization.
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: U2AF2
          term:
            id: hgnc:23156
            label: U2AF2
        molecular_functions:
        - preferred_term: polypyrimidine tract RNA binding at the 3' splice site
          term:
            id: GO:0030628
            label: pre-mRNA 3'-splice site binding
          modifier: DECREASED
      selected_evidence:
        snippet: Together, we identified 23 U2AF2 variants associated with an NDD, including 21 de novo
          and 7 recurrent variants, in the RRMs required for RNA recognition.
        supports: SUPPORT
        directness: DIRECT
    origin:
