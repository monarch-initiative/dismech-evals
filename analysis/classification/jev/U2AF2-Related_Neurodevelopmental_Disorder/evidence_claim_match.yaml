        description: Reduced U2AF2 function changes exon usage in a subset of transcripts rather than
          abolishing splicing. In U2af50-deficient fly brain and in U2AF2-depleted human cell lines the
          affected set is enriched for transcripts encoding RNA-binding proteins, including Rbfox1 and
          other neurodevelopmental splicing regulators, and restoring Iswi, Rbfox1 or RpS19a partially
          rescues the fly brain phenotype. Which human neural transcripts carry the disease is not yet
          established.
        role: central_effector
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: mRNA splicing, via spliceosome
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: ABNORMAL
      selected_evidence:
        snippet: Indeed, we observed that coexpression of 8 of 18 mutant constructs and the pyPY minigene
          in HEK293T cells significantly reduced py splicing
        supports: SUPPORT
        directness: DIRECT
