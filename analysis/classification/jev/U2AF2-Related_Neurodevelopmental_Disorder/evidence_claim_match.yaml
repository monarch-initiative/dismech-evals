        notes: U2 small nuclear RNA auxiliary factor 2, the 65 kDa U2AF subunit. Variants are heterozygous
          and nearly all de novo. Missense variants cluster in the RRM1 and RRM2 RNA recognition motifs;
          seven recurrent variants account for about two thirds of individuals in the largest cohort,
          with Arg149Trp and Arg150Cys/His as hotspots. Fly rescue experiments classify the recurrent
          missense variants as partial loss of function. A presumed missense variant (c.603G>T) instead
          causes exon 6 skipping and an in-frame deletion, and a 2.2 Mb de novo deletion spanning U2AF2
          has been reported with an overlapping phenotype, suggesting haploinsufficiency may also cause
          disease. No ClinGen gene-disease validity record for U2AF2 is present in the local structured-source
          cache.
        variants:
        - name: p.(Arg149Trp)
          description: c.445C>T, the commonest recurrent missense variant, in RRM1. Reduces polypyrimidine-tract
            RNA binding and is a partial loss-of-function allele in Drosophila rescue assays.
        - name: c.603G>T (exon 6 skipping)
          description: Presumed missense variant shown in patient lymphoblastoid cells to cause exon 6
            skipping and an in-frame deletion (p.E163_E201del).
      selected_evidence:
        snippet: We implicated pathogenic variants in U2AF2 and PRPF19, encoding spliceosome subunits
          in neurodevelopmental disorders (NDDs), by identifying 46 unrelated individuals with 23 de novo
          U2AF2 missense variants (including 7 recurrent variants in 30 individuals)
