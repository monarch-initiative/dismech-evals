  5549546117fe164162ad6a987fa7b8b2c57a98a25198036d1f5ce09177c4da3e:
    claim:
      about:
        disease:
          name: U4 and U6 snRNA Gene-Related Retinitis Pigmentosa
          disease_term:
            preferred_term: U4 and U6 snRNA gene-related retinitis pigmentosa
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: U4/U6 Three-Way Junction snRNA Variant
        conforms_to: spliceosome_component_dysfunction#Germline Spliceosome Component Variant
        description: A heterozygous variant in RNU4-2 or in one of the RNU6 paralogs changes the sequence
          of U4 or U6 snRNA within the three-way junction of the U4/U6 duplex, bounded by stem I, stem
          II and the U4 5' stem-loop. RNA folding predictions suggest the RNU4-2 variants enlarge the
          internal loop and the RNU6 insertions lengthen stem I and reorient the 5' stem-loop; the authors
          note these structural effects are not yet verified experimentally. Because only about a quarter
          of cellular U4 or a tenth of U6 would be mutant, and because common benign variants at the same
          position appear not to enter the assembly pathway, the authors favour a gain-of-function or
          dominant-negative effect over haploinsufficiency. Evidence for the variant spectrum is from
          human genetic studies; the structural mapping is computational.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: RNU4-2
          term:
            id: hgnc:10193
            label: RNU4-2
        - preferred_term: RNU6-1
          term:
            id: hgnc:10227
            label: RNU6-1
        - preferred_term: RNU6-2
          term:
            id: hgnc:34270
            label: RNU6-2
        - preferred_term: RNU6-8
          term:
            id: hgnc:34285
            label: RNU6-8
        - preferred_term: RNU6-9
          term:
            id: hgnc:34269
            label: RNU6-9
        cellular_components:
        - preferred_term: U4/U6 snRNP
          term:
            id: GO:0071001
            label: U4/U6 snRNP
      selected_evidence:
        snippet: These variants cluster within the three-way junction of the U4/U6 duplex, a site that
          interacts with tri-snRNP splicing factors also known to cause RP (PRPF3, PRPF8, PRPF31), and
          seem to affect snRNP biogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41513982
      reference_title: De novo and inherited dominant variants in U4 and U6 snRNA genes cause retinitis
