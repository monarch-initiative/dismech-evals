  e49d44d9333ad2164fedeb1ffaa4df1e9d17d59ee53171257781025a02e16a39:
    claim:
      about:
        disease:
          name: U4 and U6 snRNA Gene-Related Retinitis Pigmentosa
          disease_term:
            preferred_term: U4 and U6 snRNA gene-related retinitis pigmentosa
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: u4u6_rp_no_detected_missplicing
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Increased Di-snRNP Factor Binding and Delayed Tri-snRNP Assembly
        - pathophysiology#Photoreceptor Degeneration
        prompt: Does delayed snRNP assembly cause mis-splicing in photoreceptors, and if so of which transcripts?
        rationale: Leukocyte RNA-seq from nine patients found no consistent splicing change, and the two
          shared events differed by under 10%. Leukocytes are not the affected tissue, and the snRNA demand
          of retina is several-fold higher, so a retina-restricted splicing defect is not excluded. Until
          splicing is measured in patient-derived photoreceptors or retinal organoids, the step between
          the assembly delay and photoreceptor degeneration is unknown, which is why this entry does not
          conform to the module's mis-splicing node.
      selected_evidence:
        snippet: we did not observe any major splicing anomalies in transcripts from patients with RP,
          with the only two significant events showing differences below 10% in expression
        supports: SUPPORT
