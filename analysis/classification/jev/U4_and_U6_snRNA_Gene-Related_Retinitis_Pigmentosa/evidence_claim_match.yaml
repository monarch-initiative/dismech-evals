  7281e7e1e83c54df12d12916ed13da0085f15a49ffaba896b0cc222497ccbc1a:
    claim:
      about:
        disease:
          name: U4 and U6 snRNA Gene-Related Retinitis Pigmentosa
          disease_term:
            preferred_term: U4 and U6 snRNA gene-related retinitis pigmentosa
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Increased Di-snRNP Factor Binding and Delayed Tri-snRNP Assembly
        description: 'Ectopically expressed U4 and U6 snRNAs carrying RP variants co-purify more SART3
          and, partially, more PRPF31, while binding of the U5 snRNP protein SNRNP200 is unchanged or
          reduced. The authors read this as a modest delay in the transition from the U4/U6 di-snRNP to
          the U4/U6.U5 tri-snRNP, not a failure of assembly: all changes were under 1.5-fold. The ReNU
          variant n.64_65insT tested alongside showed no significant change, and the RP and ReNU variants
          did not differ significantly from each other. Evidence is from cell-based immunoprecipitation
          assays.'
        biological_scale: MOLECULAR
        cellular_components:
        - preferred_term: U4/U6 x U5 tri-snRNP complex
          term:
            id: GO:0046540
            label: U4/U6 x U5 tri-snRNP complex
        biological_processes:
        - preferred_term: delayed spliceosomal tri-snRNP complex assembly
          term:
            id: GO:0000244
            label: spliceosomal tri-snRNP complex assembly
          modifier: ABNORMAL
      selected_evidence:
        snippet: The combined results showed an increased association of snRNA constructs with RP variants
          with SART3 and partially with PRPF31, while the interaction with SNRNP200 was unchanged or reduced
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
