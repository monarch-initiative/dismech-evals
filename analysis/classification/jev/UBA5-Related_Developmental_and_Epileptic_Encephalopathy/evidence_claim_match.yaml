          value:
            name: UBA5
            gene_term:
              preferred_term: UBA5
              term:
                id: hgnc:23230
                label: UBA5
            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            association: UBA5 encodes the E1 activating enzyme of the UFM1 cascade. Pathogenic variants
              are missense, nonsense, frameshift and splice-affecting, and their functional consequence
              ranges from mild attenuation to near-complete loss. The recurrent c.1111G>A (p.Ala371Thr)
              partial-function allele carries an allele frequency of 0.28% in the founding European dataset
              and is found in trans with a more severe variant in many affected individuals. Across a
              25-person retrospective allelic analysis, 21 carried a mild Group IA/IB allele with a severe
              Group III/IV allele, while two symptomatic partial-function plus partial-function combinations
              show that this is a hierarchy, not an absolute genotype rule.
            notes: The UBA5 allelic spectrum also includes autosomal recessive spinocerebellar ataxia
              24 (SCAR24, OMIM 617133) and a severe congenital neuropathy presentation. They overlap mechanistically
              but remain distinct clinical disease concepts; this entry is limited to MONDO:0014933 DEE44.
          role: ancestor
      assertion_type: Variant
      assertion:
        name: NM_024818.6(UBA5):c.1111G>A (p.Ala371Thr)
        type: missense
        gene:
          preferred_term: UBA5
          term:
            id: hgnc:23230
            label: UBA5
        description: Recurrent very mild partial-loss-of-function allele. It impairs UFM1 transfer to
          UFC1 in vitro, yet adult homozygotes without an apparent neurologic phenotype show that it is
          not sufficient alone to cause DEE44. Its disease relevance is therefore genotype-context dependent,
          most often in trans with a more severe UBA5 allele.
      selected_evidence:
        snippet: we show that the p.Ala371Thr variant is hypomorphic with attenuated ability to transfer
          the activated UFM1 to UFC1
        supports: SUPPORT
