        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired UFM1 Adenylation and Thioester Formation
        biological_scale: MOLECULAR
        description: UBA5 is a non-canonical E1 that carries its catalytic cysteine inside the adenylation
          domain rather than in a separate domain. It adenylates the UFM1 C-terminal glycine and then
          forms a thioester bond through Cys250. This node covers those two steps on the enzyme itself,
          and is kept separate from the handoff to UFC1 because the two are assayed independently and
          specific variants dissociate them - p.Tyr53Phe leaves E1 activity at 3.4% but transthiolation
          at 6.8% of wild type.
        molecular_functions:
        - preferred_term: UFM1 adenylation and thioester bond formation at Cys250
          modifier: DECREASED
          term:
            id: GO:0071566
            label: UFM1 activating enzyme activity
      selected_evidence:
        snippet: In the activation process UBA5 adenylates UFM1 C-terminal Gly and then forms a thioester
          bond with the UFM1 C-terminus via its active site Cys250
        supports: SUPPORT
