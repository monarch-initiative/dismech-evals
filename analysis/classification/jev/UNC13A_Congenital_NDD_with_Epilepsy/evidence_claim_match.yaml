  764552e986ca69f275ef19f22d1c18b3eca981912670139ea0ae959701f9bdea:
    claim:
      about:
        disease:
          name: UNC13A-Related Congenital NDD with Epilepsy
          disease_term:
            preferred_term: UNC13A-related congenital neurodevelopmental disorder with epilepsy
            term:
              id: MONDO:0980940
              label: neurodevelopmental disorder with hypotonia, epilepsy, and absent speech
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_unc13a_entity_delineation_lump_split
        prompt: Is the recessive congenital "NDD with epilepsy" presentation the same disease entity as
          the dominant UNC13A "NDD with seizures and movement disorder", or do distinct variant classes
          (biallelic loss-of-function versus heterozygous gain-of-function/dysregulatory) and affected
          protein domains (C2/MUN) segregate genuinely separate disorders?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Synaptic Vesicle Priming
        - pathophysiology#Cortical Hyperexcitability
        rationale: 'dismech currently curates two UNC13A entries: this recessive type A loss-of-function
          disorder and a separate dominant type B/C entry with movement disorder. The distinction rests
          on a genotype-phenotype-functional classification into three subtypes, but whether these are
          truly discrete entities or a mechanistic continuum along one gene - and how reliably variant
          class and domain location predict which presentation emerges - is not settled. This lump-versus-split
          question directly governs whether the two entries should remain separate, be linked as subtypes,
          or be merged.'
        proposed_experiments:
        - experiment_id: exp_unc13a_genotype_phenotype_domain_map
          name: UNC13A genotype-phenotype domain-mapping cohort review
          description: Assemble reported UNC13A cases with variant type, zygosity, protein domain (C2/MUN),
            functional class (loss versus gain versus dysregulation), and standardized phenotype coding,
            then test whether variant class and domain partition cleanly into the type A congenital-NDD
            and type B/C movement-disorder presentations or form a continuum.
          experiment_type:
            preferred_term: genotype-phenotype correlation study
          perturbations:
          - name: UNC13A variant class and domain stratification
            target: pathophysiology#Loss of Synaptic Vesicle Priming
            genes:
            - preferred_term: UNC13A
              term:
                id: hgnc:23150
                label: UNC13A
            description: Stratify curated cases by zygosity, functional class, and affected domain to
              test entity boundaries.
          readouts:
          - name: Phenotype-class separation
            target: pathophysiology#Cortical Hyperexcitability
            biological_processes:
            - preferred_term: chemical synaptic transmission
              term:
                id: GO:0007268
                label: chemical synaptic transmission
              modifier: ABNORMAL
            assays:
            - preferred_term: clinical phenotype classification
            direction: POSITIVE
          controls:
          - name: Established distinct-entity genes
            description: Genes with well-separated recessive/dominant allelic disorders as a positive
              comparison.
          decision_criterion: The two entries should stay split if variant class and domain reliably predict
            presentation with minimal overlap; a continuum with frequent intermediate phenotypes would
            argue for a single spectrum entity.
          would_support:
          - pathophysiology#Loss of Synaptic Vesicle Priming
          - pathophysiology#Cortical Hyperexcitability
      selected_evidence:
        snippet: Based on a strong genotype-phenotype-functional correlation, we classify three UNC13A
          syndrome subtypes (types A-C).
        supports: SUPPORT
