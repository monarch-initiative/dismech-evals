  e39caad6fc0684af814ff4af06cef4d487139b4d47296f9b2392e08c3c09730a:
    claim:
      about:
        disease:
          name: UNC13A-Related Congenital NDD with Epilepsy
          disease_term:
            preferred_term: UNC13A-related congenital neurodevelopmental disorder with epilepsy
            term:
              id: MONDO:0980940
              label: neurodevelopmental disorder with hypotonia, epilepsy, and absent speech
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_unc13a_null_mouse_human_fidelity
        prompt: Because constitutive Munc13-1 knockout mice are perinatally lethal with abolished evoked
          release, the null mouse cannot model the viable human developmental disorder; do human iPSC-derived
          neuron or conditional/hypomorphic models faithfully reproduce the congenital CNS and neuromuscular
          phenotypes?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired CNS Synaptic Development and Network Maturation
        - pathophysiology#Impaired Neuromuscular Transmission
        rationale: The strongest in vivo mechanistic evidence is the constitutive Munc13-1 knockout mouse,
          which dies at or before birth from paralysis and abolished release. That lethal null phenotype
          cannot capture the postnatal neurodevelopmental trajectory (absent speech, evolving epilepsy,
          progressive neuromuscular decline) seen in surviving human patients, so translational fidelity
          is the open question rather than absence of evidence. Human iPSC-derived neurons and conditional
          or hypomorphic models are needed to test whether patient-relevant developmental and neuromuscular
          phenotypes emerge from partial UNC13A loss.
        proposed_experiments:
        - experiment_id: exp_unc13a_ipsc_hypomorph_developmental_fidelity
          name: UNC13A iPSC and conditional-hypomorph developmental-fidelity experiment
          description: Compare patient iPSC-derived cortical neurons and neuromuscular co-cultures, and
            conditional/hypomorphic UNC13A mouse models, against the human phenotype for activity-dependent
            network maturation and neuromuscular transmission, to test whether partial-loss models reproduce
            the surviving human developmental course.
          experiment_type:
            preferred_term: iPSC and conditional-model comparative phenotyping experiment
          perturbations:
          - name: Partial UNC13A loss in human and conditional models
            target: pathophysiology#Impaired CNS Synaptic Development and Network Maturation
