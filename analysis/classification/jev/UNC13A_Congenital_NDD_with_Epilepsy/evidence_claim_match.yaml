      reference: PMID:41125872
      reference_title: Pathogenic UNC13A variants cause a neurodevelopmental syndrome by impairing synaptic
        function.
      evidence_source: HUMAN_CLINICAL
      explanation: The three-subtype framework is the basis for splitting the recessive loss-of-function
        entity from the dominant gain-of-function/dysregulatory entity, but the discreteness of the boundary
        remains an open curation decision.
