          description: Homozygous nonsense mutation in the N-terminal domain truncating the protein after
            101 of 1,703 residues. Associated with the severe phenotype including microcephaly, cortical
            hyperexcitability, fatal myasthenia, and death at 50 months.
          type: nonsense
          clinical_significance: PATHOGENIC
        - name: c.1188delC (p.Asp397Thrfs*107)
          description: Homozygous frameshift variant causing loss of function. Associated with congenital
            encephalopathy, severe neuromuscular phenotype, infantile spasms with burst-suppression EEG
            pattern, and death in infancy.
          type: frameshift
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Exome sequencing identified a homozygous nonsense mutation in the N-terminal domain of
          MUNC13-1 (UNC13A) truncating the protein after 101 residues.
        supports: SUPPORT
