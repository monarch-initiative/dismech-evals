        - name: Autosomal Recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: Biallelic loss-of-function variants in UNC13A (encoding Munc13-1) cause the severe congenital
          form (type A). These include homozygous nonsense, frameshift, and splice-site variants that
          reduce or abolish UNC13A protein expression. The resulting loss of synaptic vesicle priming
          leads to markedly reduced neurotransmitter release at both central and neuromuscular synapses.
        variants:
