  4b9fa4d1ce2e820e32350565b1682258e85d9aa689e5153856709faa7cddc15a:
    claim:
      about:
        disease:
          name: UNC13A-Related Congenital NDD with Epilepsy
          disease_term:
            preferred_term: UNC13A-related congenital neurodevelopmental disorder with epilepsy
            term:
              id: MONDO:0980940
              label: neurodevelopmental disorder with hypotonia, epilepsy, and absent speech
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_unc13a_residual_priming_and_severity
        prompt: Munc13-1 is the essential priming factor that renders docked vesicles fusion-competent,
          so complete loss is expected to near-abolish evoked release; how is a viable congenital neurodevelopmental
          disorder compatible with biallelic UNC13A loss, and what residual priming (e.g., Munc13-2/3
          redundancy) or partial expression sets the observed phenotype severity?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Synaptic Vesicle Priming
        rationale: Constitutive Munc13-1 knockout in mice abolishes evoked release and is perinatally
          lethal, yet reported human biallelic UNC13A patients survive for months to years with residual
          movement and neuromuscular function. This implies incomplete abolition of priming in patients
          - through residual or truncated protein, developmental compensation, or paralog redundancy from
          Munc13-2/Munc13-3 in some synapse populations. The type A mechanism is framed as reduced (not
          absent) synaptic strength, so the quantitative relationship between residual priming capacity
          and clinical severity (survival, seizure burden, neuromuscular involvement) is an open, curation-relevant
          gap.
        proposed_experiments:
        - experiment_id: exp_unc13a_residual_priming_dose_response
          name: UNC13A allelic-series residual-priming and paralog-redundancy experiment
          description: In human iPSC-derived neurons carrying an allelic series of UNC13A variants (null,
            hypomorphic truncating, and patient missense), quantify readily releasable pool size and evoked
            release, and test whether Munc13-2/Munc13-3 co-expression rescues release. Relate residual
            release to a graded cellular-phenotype severity scale.
          experiment_type:
            preferred_term: iPSC-derived neuron electrophysiology and rescue experiment
          perturbations:
          - name: UNC13A allelic series and paralog rescue
            target: pathophysiology#Loss of Synaptic Vesicle Priming
            genes:
            - preferred_term: UNC13A
              term:
                id: hgnc:23150
                label: UNC13A
            description: Engineer graded UNC13A loss (null, hypomorph, patient missense) and test Munc13-2/Munc13-3
              paralog co-expression for functional compensation.
          readouts:
          - name: Evoked release and readily releasable pool size
            target: pathophysiology#Loss of Synaptic Vesicle Priming
            biological_processes:
            - preferred_term: synaptic vesicle exocytosis
              term:
                id: GO:0016079
                label: synaptic vesicle exocytosis
              modifier: DECREASED
            - preferred_term: chemical synaptic transmission
              term:
                id: GO:0007268
                label: chemical synaptic transmission
              modifier: DECREASED
            assays:
            - preferred_term: patch-clamp electrophysiology assay
            direction: NEGATIVE
          controls:
          - name: Wild-type UNC13A
            description: Isogenic wild-type UNC13A neurons as the release reference.
          - name: Paralog-only rescue
            description: Munc13-2/Munc13-3 expression without UNC13A to test redundancy.
          decision_criterion: Residual priming explains viability if hypomorphic and patient-missense
            alleles retain measurable evoked release that grades with a severity scale, and if paralog
            co-expression partially rescues release in a subset of synapses.
          would_support:
          - pathophysiology#Loss of Synaptic Vesicle Priming
      selected_evidence:
        snippet: Neuromuscular transmission was severely compromised by marked depletion of the readily
          releasable pool of quanta, but the probability of quantal release was normal.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
