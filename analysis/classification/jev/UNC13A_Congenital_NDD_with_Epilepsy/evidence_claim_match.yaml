            label: synaptic vesicle exocytosis
          modifier: DECREASED
        - preferred_term: chemical synaptic transmission
          term:
            id: GO:0007268
            label: chemical synaptic transmission
          modifier: DECREASED
        locations:
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: The UNC13A gene encodes a presynaptic protein that is crucial for setting the strength
          and dynamics of information transfer between neurons.
        supports: SUPPORT
