          term:
            id: UBERON:0001950
            label: neocortex
      selected_evidence:
        snippet: Loss of Munc13-1 function predicts that syntaxin 1B is consigned to a nonfunctional closed
          state; this inhibits cholinergic transmission at the neuromuscular junction and glutamatergic
          transmission in the brain.
        supports: SUPPORT
