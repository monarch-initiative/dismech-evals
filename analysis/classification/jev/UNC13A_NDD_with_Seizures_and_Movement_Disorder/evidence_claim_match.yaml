              label: neurodevelopmental disorder with speech delay, movement abnormalities, and seizures
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_unc13a_human_model_fidelity
        prompt: Do heterologous mouse-hippocampal-neuron and C. elegans variant-expression assays faithfully
          model the human movement-and-seizure phenotype of dominant UNC13A syndrome, given that constitutive
          Munc13-1 loss abolishes neurotransmitter release and precludes a viable whole-animal behavioral
          model?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Gain-of-Function Neurotransmission
        - pathophysiology#Synaptic Circuit Dysregulation
        rationale: The mechanistic evidence for gain-of-function and dysregulatory UNC13A variants comes
          from expressing the variants in mouse hippocampal neurons and in C. elegans, which measure single-synapse
          release changes in reduced heterologous systems rather than human motor and cortical circuit
          behavior. Constitutive Munc13-1 null animals are perinatally lethal with abolished glutamatergic
          transmission, so a complete-loss whole-animal model cannot recapitulate a viable movement-and-seizure
          disorder. Whether these assays translate to the human-specific circuit phenotype is therefore
          open, and patient iPSC-derived neurons/assembloids and humanized knock-in or hypomorphic models
          are needed to test fidelity.
        proposed_experiments:
        - experiment_id: exp_unc13a_patient_ipsc_neuron_release
          experiment_design: TARGETED_PERTURBATION
          name: Patient iPSC-derived neuron and assembloid release/network experiment
          description: Generate patient-derived or CRISPR-engineered isogenic human iPSC neurons and cortico-striatal
            assembloids carrying type B and type C UNC13A variants and corrected alleles, and compare
            regulated neurotransmitter release, short-term plasticity, and network activity against the
            mouse and C. elegans assay results to test whether the heterologous findings reproduce in
            human tissue.
          experiment_type:
            preferred_term: patient iPSC-derived neuron functional experiment
          model_systems:
          - name: UNC13A human iPSC-derived neuron and cortico-striatal assembloid
            description: Human iPSC-derived neuronal and assembloid model with excitatory and inhibitory
              neurons for release and network readouts rather than behavioral phenotyping.
            experimental_model_type: ORGANOID
            namo_type: namo:Organoid
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            cell_types:
            - preferred_term: neuron
              term:
                id: CL:0000540
                label: neuron
            conditions:
            - UNC13A-related neurodevelopmental disorder with seizures and movement disorder
            cell_source: Patient-derived or CRISPR-engineered human induced pluripotent stem cells
            culture_system: Two-dimensional neuronal cultures and three-dimensional cortico-striatal assembloids
          perturbations:
          - name: UNC13A variant knock-in or correction
            target: pathophysiology#Gain-of-Function Neurotransmission
            genes:
            - preferred_term: UNC13A
              term:
                id: hgnc:23150
                label: UNC13A
            description: Introduce or correct type B and type C UNC13A variants in an isogenic human iPSC
              background.
          readouts:
          - name: Human neuronal release and network activity
            target: pathophysiology#Synaptic Circuit Dysregulation
            biological_processes:
            - preferred_term: synaptic vesicle exocytosis
              term:
                id: GO:0016079
                label: synaptic vesicle exocytosis
              modifier: ABNORMAL
            - preferred_term: chemical synaptic transmission
              term:
                id: GO:0007268
                label: chemical synaptic transmission
              modifier: ABNORMAL
            assays:
            - preferred_term: patch-clamp electrophysiology
            - preferred_term: multielectrode array recording
            direction: POSITIVE
          controls:
          - name: Isogenic corrected control
            description: Isogenic iPSC line with the UNC13A variant corrected to wild type.
          decision_criterion: The heterologous assays are considered faithful if human iPSC neurons carrying
            the same variants reproduce the direction and relative magnitude of the release and network
            changes seen in mouse and C. elegans; a divergent human result would mark a genuine model-fidelity
            gap.
          would_support:
          - pathophysiology#Gain-of-Function Neurotransmission
          - pathophysiology#Synaptic Circuit Dysregulation
      selected_evidence:
        snippet: Using assays with expression of UNC13A variants in mouse hippocampal neurons and in Caenorhabditis
          elegans, we identify three mechanisms of pathogenicity
        supports: SUPPORT
