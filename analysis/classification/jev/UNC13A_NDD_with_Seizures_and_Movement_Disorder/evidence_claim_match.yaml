        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Gain-of-Function Neurotransmission
        conforms_to: epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction
        description: Heterozygous missense variants in UNC13A cause increased neurotransmitter release
          (gain-of-function), leading to excessive synaptic transmission. This corresponds to UNC13A syndrome
          type B and results in seizure susceptibility and movement abnormalities due to excitatory/inhibitory
          imbalance in motor and cortical circuits.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: chemical synaptic transmission
          term:
            id: GO:0007268
            label: chemical synaptic transmission
          modifier: INCREASED
        - preferred_term: synaptic vesicle exocytosis
          term:
            id: GO:0016079
            label: synaptic vesicle exocytosis
          modifier: INCREASED
        locations:
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: Using assays with expression of UNC13A variants in mouse hippocampal neurons and in Caenorhabditis
          elegans, we identify three mechanisms of pathogenicity, including reduction in synaptic strength
          caused by reduced UNC13A protein expression, increased neurotransmission caused by UNC13A gain-of-function
          and impaired regulation of neurotransmission by second messenger signalling.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
