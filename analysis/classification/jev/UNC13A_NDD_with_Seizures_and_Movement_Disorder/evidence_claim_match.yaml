        function.
      evidence_source: MODEL_ORGANISM
      explanation: Functional assays identified impaired second-messenger regulation as the type C mechanism;
        this is assay evidence for synaptic dysregulation rather than a direct measurement from human
        brain tissue. UNC13A encodes Munc13-1, the vesicle-priming factor, so dysregulated second-messenger
        control of its activity is dysregulated priming — ABNORMAL rather than DECREASED, since these
        variants act without directly altering baseline synaptic strength.
