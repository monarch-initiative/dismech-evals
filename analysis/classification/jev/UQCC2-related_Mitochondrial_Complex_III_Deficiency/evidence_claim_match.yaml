  1a420a76fa3e1822f4393e81502777641f3e1445059b9c7ea1223722da7a4ef8:
    claim:
      about:
        disease:
          name: UQCC2-related mitochondrial complex III deficiency
          disease_term:
            preferred_term: mitochondrial complex III deficiency nuclear type 7
            term:
              id: MONDO:0014356
              label: mitochondrial complex III deficiency nuclear type 7
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: UQCC2 Loss of Function
        biological_scale: MOLECULAR
        description: Biallelic UQCC2 variants remove almost all functional UQCC2. The splice-site allele
          c.214-3C>G uses cryptic acceptor sites and leaves about 2% of wild-type transcript, with no
          stable aberrant protein; the homozygous p.[Arg8Pro;Leu10Phe] allele causes near-complete loss
          of UQCC2 protein in muscle and fibroblasts. Lentiviral re-expression of UQCC2 in patient fibroblasts
          corrects the complex III defect, which establishes causality. No catalytic activity is known
          for UQCC2; the only molecular activity shown for it is binding to UQCC1, which is why the molecular
          function bound here is the broad protein binding term rather than anything more specific.
        genes:
        - preferred_term: UQCC2
          term:
            id: hgnc:21237
            label: UQCC2
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: binding to the assembly factor UQCC1
          term:
            id: GO:0005515
            label: protein binding
          modifier: DECREASED
        cellular_components:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
      selected_evidence:
        snippet: These results prove that the complex III deficiency is due to a lack of UQCC2, and that
          the mutations in other candidate genes in the patient, TYMP and MTCH1, are not causative.
        supports: SUPPORT
