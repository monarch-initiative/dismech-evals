                id: GO:0005743
                label: mitochondrial inner membrane
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Defective Cytochrome b Synthesis
        description: Without the UQCC1-UQCC2 complex, newly made cytochrome b is not produced or is not
          stabilized, while the other mtDNA-encoded subunits are made normally.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: We show that UQCC1 binds the newly synthesized mtDNA-encoded cytochrome b subunit of
          complex III and that UQCC2 patient fibroblasts have specific defects in the synthesis or stability
          of cytochrome b.
        supports: SUPPORT
