      assertion:
        name: Failure to Process Stalled RNA Polymerase II
        description: 'Repair normally proceeds by an ordered handover: CSB binds the stalled polymerase
          and recruits CSA, CSA loads UVSSA, ELOF1 positions UVSSA and the CRL4-CSA ligase so that the
          polymerase is ubiquitylated and inactivated, and UVSSA then recruits TFIIH to open the DNA.
          Losing any one of CSB, CSA or UVSSA breaks this chain, so the arrested polymerase is neither
          inactivated nor cleared and the repair machinery is never delivered to the lesion.'
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
      selected_evidence:
        snippet: Importantly, we find that UVSSA is the key factor that recruits the TFIIH complex in
          a manner that is stimulated by CSB and CSA.
        supports: SUPPORT
