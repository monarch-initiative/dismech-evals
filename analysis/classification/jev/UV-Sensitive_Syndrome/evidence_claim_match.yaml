  af945129f4adc459038e836650b03307de775fb8cb6243c2c37a32ca544eb3a0:
    claim:
      about:
        disease:
          name: UV-Sensitive Syndrome
          disease_term:
            preferred_term: UV-sensitive syndrome
            term:
              id: MONDO:0015797
              label: UV-sensitive syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: csb_pgbd3_fusion_position
        hypothesis_label: Outcome is set by where the CSB truncation falls relative to the PGBD3 insertion
        status: EMERGING
        description: 'A specific alternative to the general hypothesis above, and a positional rather
          than quantitative one. CSB transcripts can read through into an inserted PiggyBac-derived element,
          PGBD3, producing a CSB-PGBD3 fusion protein. On this account UV-sensitive syndrome alleles carry
          their nonsense mutations upstream of that insertion in both copies, so no fusion is made, while
          Cockayne alleles are mutated downstream of it or in exon 1, so a fusion protein is still produced.
          The two diseases would then differ by the presence of the fusion rather than by how much intact
          CSB survives. Forcing an upstream stop codon recovered mitochondrial membrane potential in Cockayne
          cells, which connects the model to the mitochondrial arm of the general hypothesis.

          Marked EMERGING rather than ALTERNATIVE: it rests on one cell-line study and has not been tested
          against the full set of reported alleles.'
        applies_to_subtypes:
        - UVSS1
        notes: Recorded as a hypothesis group rather than only as prose in the uvss_vs_cs_severity discussion,
          so that the two competing explanations for the same divergence are comparable as records. No
          causal edge in this entry opts into either group, because the disagreement is about what Cockayne
          syndrome adds, not about any step in this disease's own chain.
      selected_evidence:
        snippet: How the CSB gene determines a patient’s fate is unknown, but one intriguing point is
          that in UVSS patient cell, there are nonsense mutations in both alleles at the same position
          in each upstream region of the PiggyBac transposable element derived 3 (PGBD3) inserted region.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
