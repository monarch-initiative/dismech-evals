      assertion_type: Diagnosis
      assertion:
        name: Recovery of RNA synthesis assay in patient fibroblasts
        description: The functional test that defines the disorder. After UV irradiation, patient fibroblasts
          fail to restore RNA synthesis while unscheduled DNA synthesis, which reflects global-genome
          repair, remains near normal. That combination separates this disorder from xeroderma pigmentosum,
          in which global-genome repair is the defective arm. It does not separate it from Cockayne syndrome,
          which gives the same cellular result.
        notes: Specialised and not standardised across routine laboratories, with no universal clinical
          cutoffs, so molecular confirmation of biallelic variants is the practical diagnostic endpoint.
      selected_evidence:
        snippet: Despite mild clinical features, cells from individuals with UV(S)S, like Cockayne syndrome
          cells, are very UV sensitive and are deficient in transcription-coupled nucleotide-excision
          repair (TC-NER), which removes DNA damage in actively transcribed genes.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
