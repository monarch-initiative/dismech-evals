      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: csa_csb_repair_independent_functions
        hypothesis_label: CSA and CSB carry TC-NER-independent functions whose loss produces Cockayne
          syndrome
        status: CANONICAL
        description: The field's general explanation for why the same two genes give two very different
          diseases. Because both disorders share the TC-NER defect, the severity of Cockayne syndrome
          is attributed to further roles of CSA and CSB outside transcription-coupled repair - in transcription
          itself, in mitochondrial maintenance, and in handling endogenous rather than UV-induced damage
          - which would matter most in long-lived post-mitotic cells. UV-sensitive syndrome alleles would
          spare those roles. The hypothesis is coherent and widely held, but it is stated at the level
          of "some other function" rather than a specified one, which is why it remains a hypothesis here
          rather than a curated mechanism.
        applies_to_subtypes:
        - UVSS1
        - UVSS2
      selected_evidence:
        snippet: Our findings provide mechanistic insights into the processing of stalled RNA polymerase
          and explain the different clinical features across these TC-NER–deficient disorders.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
