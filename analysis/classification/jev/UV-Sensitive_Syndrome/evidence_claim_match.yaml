      assertion_type: ProgressionInfo
      assertion:
        phase: Cumulative cutaneous change without systemic progression
        notes: 'Freckling, pigmentary change and telangiectasia accumulate with repeated exposure, so
          the skin findings worsen over time while the disease itself does not progress systemically.
          Growth, cognition and neurological examination stay normal and survival is not shortened. This
          is the axis on which the disorder separates most sharply from Cockayne syndrome, where progression
          is the defining feature, so severity here is governed by cumulative ultraviolet dose and adherence
          to photoprotection rather than by a natural history intrinsic to the disease.

          A childhood-onset phase is not curated separately: the research report describes the sunburn
          as usually recognised in childhood, but no cached source states it in a quotable sentence.'
      selected_evidence:
        snippet: no pathologies other than sunburn and freckles have been associated with UVSS
        supports: SUPPORT
    origin:
