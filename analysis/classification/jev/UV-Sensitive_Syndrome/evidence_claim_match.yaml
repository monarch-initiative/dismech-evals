  71d7fd983613ff2998ed785ebf8a454bcd3c9c540c84f8dffa909d9347867fa6:
    claim:
      about:
        disease:
          name: UV-Sensitive Syndrome
          disease_term:
            preferred_term: UV-sensitive syndrome
            term:
              id: MONDO:0015797
              label: UV-sensitive syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: uvss_vs_cs_severity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does loss of CSA or CSB cause Cockayne syndrome in most people but UV-sensitive syndrome
          in others, when both disorders share the same transcription-coupled repair defect?
        attaches_to:
        - pathophysiology#Failure to Process Stalled RNA Polymerase II
        rationale: 'The TC-NER defect is common to both disorders, so it cannot by itself explain why
          one is a fatal multisystem progeroid disease and the other is confined to the skin. A homozygous
          null CSB allele has been reported in UV-sensitive syndrome without Cockayne features, which
          rules out simple dose of residual CSB activity as the answer. The favoured explanation is that
          CSA and CSB carry further transcriptional, mitochondrial or repair-independent functions whose
          loss produces the Cockayne phenotype, and that these are somehow spared in UV-sensitive syndrome.
          That remains an inference. UVSSA is the natural comparator, since it acts in the same pathway
          and has never been reported to cause Cockayne syndrome.

          One concrete candidate mechanism is on the table, and it is positional rather than quantitative.
          CSB transcripts can read through into an inserted PiggyBac-derived element, PGBD3, producing
          a CSB-PGBD3 fusion protein. A dataset curated here (geo:GSE111989) reports that UV-sensitive
          syndrome alleles carry their nonsense mutations upstream of that insertion in both copies, while
          Cockayne alleles are mutated downstream of it or in exon 1 - so the two diseases would differ
          by whether the fusion protein can still be made, not by how much CSB survives. The same work
          reports that forcing an upstream stop codon recovered mitochondrial membrane potential in Cockayne
          cells, which is the kind of repair-independent function the general explanation appeals to.
          This is a hypothesis supported by a cell-line experiment, not an established mechanism, and
          it has not been tested against the full set of reported alleles.'
      selected_evidence:
        snippet: This finding was surprising because a null mutation of the CSB gene would be expected
          to result in CS features such as severe developmental and neurological abnormalities.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15486090
      reference_title: Complete absence of Cockayne syndrome group B gene product gives rise to UV-sensitive
        syndrome but not Cockayne syndrome.
      evidence_source: IN_VITRO
      explanation: The authors themselves frame the observation as an unexplained genotype-phenotype discrepancy,
        which is what this gap records.
