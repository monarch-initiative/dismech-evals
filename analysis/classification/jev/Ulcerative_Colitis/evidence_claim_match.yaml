    claim:
      about:
        disease:
          name: Ulcerative Colitis
          disease_term:
            preferred_term: ulcerative colitis
            term:
              id: MONDO:0005101
              label: ulcerative colitis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_uc_stroke_shared_genetic_architecture
        prompt: By what molecular pathway does the shared IBD/UC genetic susceptibility translate into
          large arterial atherosclerotic stroke (LAS) risk, and does FCGR2A-mediated Fc-receptor signaling
          causally link colonic mucosal immune activation to systemic atherosclerosis? Why is the genetic
          correlation with LAS stronger for ulcerative colitis than for Crohn's disease, and which gut
          microbial, metabolite, and immune-cell intermediaries mediate the IBD/UC to stroke axis?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Dysregulated Immune Response
        - pathophysiology#Mucosal Inflammation
        rationale: 'The epidemiological association between IBD and stroke is well established, but the
          shared genetic architecture and the causal mechanism have been unclear. A 2026 cross-trait GWAS/Mendelian-randomization
          study (Wang et al., PMID:42400809) found that common variants contribute more to UC (than to
          CD) and multiple stroke subtypes, identified a potential causal relationship between IBD/UC
          and large arterial atherosclerotic stroke, and pinpointed a single colocalized culprit variant
          (rs7522794) in the FCGR2A promoter: the risk allele is predicted to increase SPI1 binding and
          FCGR2A expression, plausibly amplifying Fcgamma-receptor-mediated immune activation shared by
          intestinal inflammation and atherosclerotic vascular disease. This connects directly to the
          UC "Dysregulated Immune Response" node, but the disease-specific causal chain (how FCGR2A dosage
          in which immune compartment drives plaque immunity), the UC-versus-CD specificity, and the proposed
          gut-microbe/blood-metabolite/immune-cell mediation remain unresolved and not yet modeled as
          pathophysiology edges. Whether dismech should capture this as a dedicated IBD-stroke comorbidity
          entry (kb/comorbidities/) or as shared pathophysiology nodes on the individual UC and Ischemic
          Stroke entries is a maintainer scope decision left open here.'
        proposed_experiments:
        - experiment_id: exp_uc_fcgr2a_stroke_immune_axis
          name: Compartment-resolved test of FCGR2A dosage linking mucosal immune activation to atherosclerotic
            plaque immunity
          description: Use the rs7522794 promoter genotype (and allele-specific SPI1-binding reporters)
            to titrate FCGR2A expression in monocyte/macrophage and other Fcgamma-receptor-bearing immune
            compartments, then test whether increased FCGR2A signaling amplifies both colonic mucosal
            inflammatory output and pro-atherogenic macrophage activation. Cross-validate in human UC
            and carotid atherosclerotic plaque tissue to establish translational relevance of the shared
            FCGR2A-mediated immune pathway.
          experiment_type:
            preferred_term: allele-specific expression and cell-type-resolved perturbation study
        - experiment_id: exp_uc_stroke_microbe_metabolite_mediation
          name: Mediation dissection of gut-microbe and blood-metabolite intermediaries in the IBD/UC
            to LAS axis
          description: Apply mediation Mendelian randomization and matched multi-omics (gut microbiome,
            serum metabolome, circulating immune-cell profiling) in UC cohorts with and without large-artery
            atherosclerotic stroke to identify which specific microbial taxa, metabolite signatures, and
            immune-cell populations causally mediate the shared IBD/UC to stroke pathophysiology, and
            to test whether these mediators are UC-specific relative to Crohn's disease.
          experiment_type:
            preferred_term: mediation Mendelian randomization with multi-omics profiling
        posed_by: automated curation scanner (high_effort)
        posed_date: '2026-07-13T00:00:00Z'
      selected_evidence:
        snippet: common genetic variants contributing more on ulcerative colitis (UC) and multiple stroke
          subtypes than Crohn's disease (CD). Among them, there is a potential causal relationship between
          IBD/UC and large arterial atherosclerotic stroke (LAS)
        supports: SUPPORT
