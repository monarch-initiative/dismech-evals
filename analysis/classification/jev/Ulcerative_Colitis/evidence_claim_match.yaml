          ulcerative colitis tissue. Does canonical cuproptosis - copper-dependent, FDX1-lipoylation-driven
          regulated cell death - actually operate in the human UC colon, or is the causal chain a property
          of DSS and TNBS models while the human signal remains copper-associated metabolic stress alongside
          the ferroptosis this entry already models?
