            label: response to oxidative stress
      selected_evidence:
        snippet: The ferroptosis of intestinal epithelial cells (IECs), an iron-dependent form of cell
          death driven by lipid peroxidation, has emerged as a critical pathogenic driver of ulcerative
          colitis (UC).
        supports: SUPPORT
