      explanation: Cross-trait GWAS and Mendelian-randomization analysis establishes the shared genetic
        architecture and a potential causal IBD/UC to large-artery-atherosclerotic-stroke relationship,
        with UC showing stronger correlation than CD, framing the open mechanistic gap.
