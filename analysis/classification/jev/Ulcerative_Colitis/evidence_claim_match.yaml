        description: 'Iron-dependent regulated cell death driven by lipid peroxidation in intestinal epithelial
          cells. Ferroptosis in IECs is characterized by iron accumulation, lipid peroxidation, and dysregulation
          of antioxidant defense systems. Key signaling networks regulating ferroptosis include the Nrf2/HO-1
          antioxidant pathway, the SLC7A11/GPX4 lipid peroxidation control system, and the AMPK/mTOR metabolic
          regulatory pathway. Dysregulation of these pathways leads to uncontrolled ferroptosis that contributes
          to epithelial barrier dysfunction and inflammation in UC.

          '
        cell_types:
