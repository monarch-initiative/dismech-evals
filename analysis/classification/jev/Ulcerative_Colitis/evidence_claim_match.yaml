      assertion_type: Discussion
      assertion:
        discussion_id: uc_epithelial_barrier_intrinsic_vs_downstream
        prompt: Is epithelial barrier dysfunction purely a downstream consequence of mucosal inflammation
          in this entry's pathograph, or does it also have a cell-intrinsic component that should feed
          back into the disease process?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Epithelial Barrier Dysfunction
        - experimental_models#Biopsy-derived UC colonoid air-liquid interface model
        rationale: 'In this entry, Epithelial Barrier Dysfunction is wired only as a sink: it has inbound
          edges from pathobiont expansion, impaired colonocyte energy metabolism, and epithelial ferroptosis,
          and no outgoing `downstream` edge of its own. A biopsy-derived colonoid model that removes UC
          epithelium from the inflamed tissue environment entirely and still finds graded architectural,
          differentiation, and mucus-barrier defects argues that at least part of the phenotype is cell-intrinsic
          and persists independently of active inflammation, rather than being wholly generated by it.
          That does not by itself justify adding a new outgoing edge — the model does not identify what
          the intrinsic defect propagates to — but it is a structural gap worth recording rather than
          silently leaving the node as a pure consequence.'
        notes: Raised while adding modeled_mechanisms links for the UC biopsy-derived colonoid model (monarch-initiative/dismech#10432).
      selected_evidence:
        snippet: UC-derived colonoid monolayers display a range of developmental and functional defects
          that persist in the absence of inflammation.
        supports: SUPPORT
    origin:
