          damage in chemically induced mouse colitis, but no equivalent rescue has been performed in human
          ulcerative colitis tissue. Does canonical cuproptosis - copper-dependent, FDX1-lipoylation-driven
          regulated cell death - actually operate in the human UC colon, or is the causal chain a property
          of DSS and TNBS models while the human signal remains copper-associated metabolic stress alongside
          the ferroptosis this entry already models?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Intestinal Epithelial Cell Ferroptosis
        - pathophysiology#Epithelial Barrier Dysfunction
        - pathophysiology#Impaired Colonocyte Energy Metabolism
        rationale: 'Ulcerative colitis sits differently from the other dismech entries carrying this gap.
          For systemic lupus erythematosus, rheumatoid arthritis and ankylosing spondylitis the cuproptosis
          literature is transcriptomic association; for UC there is functional work, and it is model work.
          In DSS-induced colitis the copper-depleting agent tetrathiomolybdate and the chelator penicillamine
          both reverse DLAT oligomerization and restore FDX1 and LIAS, and copper chelation likewise rescues
          colitis in Grx1-knockout mice - between them these clear copper dependence, lipoylated-protein
          aggregation, Fe-S cluster destabilization and functional rescue. What is absent is the human
          arm of exactly those experiments: human UC colon contributes the descriptive half of the signature
          (raised copper, DLAT oligomerization, reduced FDX1 and LIAS) with no copper-targeted rescue.
          There is one human interventional observation nearby - golimumab responders with active UC normalize
          the hub cuproptosis genes - but it does not close the gap, because the intervention is anti-TNF
          rather than copper-directed and the readout is transcript abundance rather than the canonical
          criteria. Whether the signature normalizes because cuproptosis was driving the lesion or simply
          because the mucosa healed is exactly the question left open. The most recent mechanistic study
          states outright that directly visualizing cuproptosis in vivo remains a future direction. This
          is therefore recorded as a human/model mismatch rather than a plain knowledge gap: the evidence
          exists, but in chemically induced rodent colitis, and its translational validity is the open
          question. No cuproptosis pathophysiology node is added, and the reason is specific to this entry
          rather than generic caution - the entry already models Intestinal Epithelial Cell Ferroptosis,
          a metal-dependent regulated cell death converging on the same Epithelial Barrier Dysfunction
          node. A cuproptosis node would have to be shown to be separable from that one, not merely added
          beside it, and no study has yet run the two readout panels against each other in the same tissue.
