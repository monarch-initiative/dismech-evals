            label: colon
        conditions:
        - ulcerative colitis-like cytokine exposure
        - TNF-α/IFN-γ/IL-1β stimulation
        - tofacitinib response testing
        cell_source: Human induced pluripotent stem cell-derived colon organoids
        culture_system: Three-dimensional colon organoid culture with pro-inflammatory cytokine conditioning
        publication: PMID:39435148
        findings:
        - statement: Cytokine-conditioned hiPSC colon organoids reproduce epithelial injury and inflammatory
            stromal responses that resemble UC tissue
        - statement: The model can be used to test whether cytokine-driven inflammatory outputs are pharmacologically
            reversible
        modeled_mechanisms:
        - target: Epithelial Barrier Dysfunction
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Exogenous TNF-alpha/IFN-gamma/IL-1beta conditioning of healthy hiPSC colon organoids
            produces epithelial damage whose molecular signature resembles UC patient colon tissue.
          limitations: This is a healthy-background organoid exposed to an exogenous cytokine cocktail,
            so it models the downstream consequences of a UC-like cytokine milieu, not UC's own genetic
            or microbial aetiology.
        - target: Dysregulated Immune Response
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Cytokine-conditioned hiPSC colon organoids show inflammatory stromal responses
            whose molecular signature resembles UC patient colon, with a pharmacologically reversible
            cytokine output.
          limitations: The inflammatory state is imposed exogenously rather than arising from the patient's
            own genetically susceptible immune response, so the model captures the cytokine-output arm
            of this node rather than its upstream genetic-susceptibility trigger.
          readouts:
          - name: Tofacitinib-mediated cytokine attenuation
            target: Dysregulated Immune Response
            description: Inflammatory cytokine production in 3CK-treated hiPSC colon organoids with and
              without tofacitinib.
            direction: RESTORED
            interpretation: A JAK-inhibitor rescue arm that reduces the cytokine output supports treating
              the elevated cytokine production as the node's own output rather than an incidental correlate.
      selected_evidence:
        snippet: Comparison of molecular signatures of 3CK-treated hiPSC-COs with those of ulcerative
          colitis (UC) patient's colon revealed that 3CK-treated hiPSC-COs resemble UC patient's colon.
        supports: SUPPORT
