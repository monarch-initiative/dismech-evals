  a866ad39828b9f602430a9df2af3498e8548de3692135bd2960199cb11d88b44:
    claim:
      about:
        disease:
          name: Ulcerative Colitis
          disease_term:
            preferred_term: ulcerative colitis
            term:
              id: MONDO:0005101
              label: ulcerative colitis
        context: []
      assertion_type: Biochemical
      assertion:
        name: Plasma albumin (Mendelian randomization signal)
        specificity: 'Not the clinical albumin measurement used to assess disease activity. Recorded because
          albumin was the metabolite with the largest number of potentially causal disease links in a
          274,241-participant UK Biobank metabolome atlas, and ulcerative colitis was one of them.

          '
        context: 'This entry records a genetically instrumented, population-level causal signal, and its
          direction is the opposite of the familiar clinical picture. In active ulcerative colitis measured
          serum albumin is typically low, reflecting inflammation and protein loss; the atlas instead
          reports that genetically predicted higher albumin links to a higher incidence of ulcerative
          colitis, with a reciprocal signal in the disease-to-metabolite direction. The two statements
          are not in conflict because they describe different quantities: a lifelong genetic propensity
          to a higher albumin set point versus the measured albumin of a patient with active disease.
          No presence value is recorded here for that reason, and nothing in this entry should be used
          to interpret an individual albumin result.

          '
      selected_evidence:
        snippet: positively linking to a higher incidence of ulcerative colitis, certain types of anaemias
          and CKD
        supports: SUPPORT
