              id: MONDO:0005101
              label: ulcerative colitis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pgs_context_amplification
        hypothesis_label: Amplification of polygenic ulcerative colitis risk in adverse contexts via shared
          mucosal-inflammation convergence
        status: EMERGING
        description: 'Polygenic-score-by-context (PGS×C) interactions reported for inflammatory bowel
          disease in the UK Biobank appear to reflect amplification rather than context-specific causal
          variants: the same susceptibility loci (e.g. IL23R, HLA-DRB1) exert systematically larger effects
          in disease-promoting contexts. This entry proposes that the amplification arises because polygenic
          liability and contextual exposures converge on the shared Mucosal Inflammation node, so their
          joint effect on the liability-threshold scale is super-additive rather than additive. Notably,
          several exposures act in the opposite direction to Crohn disease — tobacco smoking and appendectomy
          are protective in ulcerative colitis — a clear illustration that a "context" is not intrinsically
          adverse but disease-specific. Nagpal & Gibson (Nat Genet 2026, PMID:42443528) report pervasive
          PGS×context interactions for prevalent IBD.'
        notes: EMERGING hypothesis motivated by population-scale PGS×context analyses (primary source
          PMID:42443528; general amplification mechanism corroborated by PMID:37228747). The convergence
          claim (polygenic liability + contextual exposures → Mucosal Inflammation) is a mechanistic interpretation
          and is not itself established as causal — see the reverse-causation knowledge gap under discussions.
      selected_evidence:
        snippet: The predominant mechanism for PGS×C is the amplification of genetic effects in adverse
          contexts, such as low polyunsaturated fatty acids or social determinants of ill health
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42443528
      reference_title: Pervasive interactions between exposures and polygenic risk can inform more effective
        clinical and behavioral interventions.
      evidence_source: COMPUTATIONAL
      explanation: 'Direct source (Nagpal & Gibson 2026): across seven UK Biobank diseases and 75 contexts,
        amplification of genetic effects in adverse contexts is identified as the predominant mechanism
        of PGS×context interaction — the mechanism applied in this hypothesis.'
