              label: Ullrich congenital muscular dystrophy
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        description: 'UCMD is typically caused by a de novo autosomal dominant variant in one of the collagen
          VI alpha-chain genes, with autosomal recessive inheritance the less common route. Recurrence
          counselling has to allow for parental somatic and concomitant germline mosaicism, which GeneReviews
          reports is not uncommon in the autosomal dominant collagen VI-related dystrophies, so apparently
          de novo disease does not carry a negligible sibling risk.

          '
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: It is known to occur through either recessive or dominant genetic mechanism
        supports: SUPPORT
