      assertion:
        name: COL6A1
        gene_term:
          preferred_term: COL6A1
          term:
            id: hgnc:2211
            label: COL6A1
        subtype: UCMD1A
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'COL6A1 encodes the collagen VI alpha 1 chain; pathogenic variants can cause UCMD through
          dominant-negative or recessive collagen VI mechanisms.

          '
        variants:
        - name: COL6A1 c.930+189C>T (intron 11 deep-intronic pseudoexon)
          description: A recurrent de novo deep-intronic variant in COL6A1 intron 11 that creates an in-frame
            pseudoexon. Lying deep in an intron, it is outside the sequence an exome or coding-exon panel
            reads, and the reported patients are ones whose clinical and muscle pathology features were
            highly suggestive of collagen VI-related dystrophy but who had no identified causative variant
            in COL6A1, COL6A2 or COL6A3; it was found by combined muscle RNA sequencing and whole-genome
            sequencing. The reported international cohort is 44 patients, and the phenotype is consistently
            at the severe UCMD end.
          gene:
            preferred_term: COL6A1
            term:
              id: hgnc:2211
              label: COL6A1
          clinical_significance: PATHOGENIC
          type: deep-intronic pseudoexon-inducing variant
          functional_effects:
          - function: collagen VI alpha 1 chain assembly
            type: dominant negative
            description: The authors describe the pseudoexon insertion as dominantly acting and in frame,
              so a single de novo allele is sufficient. The one reported patient who is somatically mosaic
              for the variant has a milder Bethlem phenotype, which is the dosage observation behind the
              splice-modulating therapeutic strategy.
      selected_evidence:
        snippet: COL6A1 | collagen type VI alpha 1 chain | hgnc:2211 | Disease-causing germline mutation(s)
          in
        supports: SUPPORT
