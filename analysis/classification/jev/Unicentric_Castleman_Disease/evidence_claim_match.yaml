      assertion_type: Discussion
      assertion:
        discussion_id: gap_ucd_persistent_symptoms_after_resection
        prompt: Why do some UCD patients keep constitutional symptoms after complete excision with normalized
          laboratory markers, and what should they be offered?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Surgical Resection
        - phenotypes#Elevated C-Reactive Protein
        rationale: Complete resection is described as often curative, so persisting symptoms with normal
          inflammatory markers after a complete excision are not explained by the current model, in which
          the resected node is the entire lesion and the source of the cytokine signal. Either the disease
          is not confined to the resected node in these patients, or the symptoms have a separate cause.
          The international UCD guideline names this as an open research question and offers no recommendation,
          so these patients are managed without evidence.
        proposed_experiments:
        - experiment_id: exp_ucd_post_resection_longitudinal_profiling
          name: Longitudinal profiling of post-resection symptomatic UCD
          description: Follow UCD patients from before resection through 24 months with serial serum proteomics
            (including CXCL13, IL-6, and VEGF-A), whole-body FDG-PET, and patient-reported symptom scores,
            comparing those with and without persisting symptoms. Sequence the resected node and any FDG-avid
            residual site for the same somatic alleles to test whether persistent symptoms mark occult
            multicentric or multifocal disease.
          would_support:
          - pathophysiology#Somatic Stromal Cell Mutation
          supporting_outcome:
          - Symptomatic post-resection patients show residual FDG-avid nodal tissue or a persistently
            elevated cytokine signature, indicating incompletely resected or multifocal disease.
          refuting_outcome:
          - Symptomatic and asymptomatic post-resection patients are indistinguishable on imaging and
            cytokine profile, pointing to a cause outside the Castleman lesion.
      selected_evidence:
        snippet: Further research is needed in UCD patients with persisting constitutional symptoms despite
          complete excision and normal laboratory markers.
        supports: SUPPORT
