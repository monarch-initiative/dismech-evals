          term:
            id: CL:4033054
            label: perivascular cell
        - preferred_term: Fibroblastic reticular cell
          term:
            id: CL:0009101
            label: fibroblastic reticular cell
        biological_processes:
        - preferred_term: Extracellular matrix remodeling
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: INCREASED
        - preferred_term: MAPK cascade
          term:
            id: GO:0000165
            label: MAPK cascade
          modifier: INCREASED
        - preferred_term: TGF-beta receptor signaling
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: MCD is characterized by increased TRC while UCD shows increased B-reticular cells (BRC).
