      assertion_type: ProgressionInfo
      assertion:
        phase: Post-resection long-term survival
        notes: 'UCD has the best outcome of any Castleman category: 5-year overall survival was 91% in
          a 113-patient two-centre series, against 65% for multicentric disease without POEMS. Complete
          resection is generally curative and recurrence is rare. The exceptions are unresectable disease
          and paraneoplastic pemphigus with bronchiolitis obliterans, which can progress to respiratory
          failure even after the Castleman lesion is removed.'
      selected_evidence:
        snippet: (1) unicentric CD (91%); (2) multicentric CD associated with the osteosclerotic variant
          of POEMS syndrome (90%); (3); multicentric CD without POEMS syndrome (65%); and (4) multicentric
          CD with POEMS syndrome without osteosclerotic lesions (27%).
        supports: SUPPORT
