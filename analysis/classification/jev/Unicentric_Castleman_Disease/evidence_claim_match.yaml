        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: stromal_cytokine_source
        hypothesis_label: Lymph Node Stromal Cells as the Source of VEGF
        status: EMERGING
        description: The cells that oversupply VEGF in unicentric Castleman disease are lymph node stromal
          cells - CXCL13+ follicular dendritic cells and FDCSP+/CLU+ B-zone reticular cells - rather than
          the hematopoietic compartment that earlier immunohistochemical work implicated. In UCD the expanded
          subsets and the VEGF signal are confined to follicles, which distinguishes it from the multicentric
          forms where T-zone and perivascular reticular cells dominate and the signal extends interfollicularly.
          The evidence is a single spatial multi-omic study of 22 cases with no functional perturbation,
          so the causal direction (stromal activation driving the lesion versus responding to it) is not
          established.
      selected_evidence:
        snippet: Previously, prominent FDCs in CD were considered remnants of attenuated germinal centers.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1038/s41467-025-61214-1
      reference_title: Spatial and single cell mapping of castleman disease reveals key stromal cell types
        and cytokine pathways
      evidence_source: HUMAN_CLINICAL
      explanation: 'States the prior interpretation this hypothesis displaces: follicular dendritic cells
        as passive remnants rather than activated drivers.'
