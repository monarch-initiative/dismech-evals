        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ucd_clonal_vs_reactive
        prompt: Are the recurrent somatic PDGFRB and IL6ST alleles in UCD the initiating lesion, or passengers
          acquired inside an already-expanding stromal population?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Somatic Stromal Cell Mutation
        - genetic#PDGFRB
        - genetic#IL6ST
        rationale: 'The answer decides whether UCD is a clonal stromal neoplasm or a reactive process,
          and therefore whether a PDGFRB inhibitor is a rational therapy for unresectable disease. PDGFRB
          N666S is activating in other diseases and PDGFRB marks the stromal subsets that expand here,
          which is suggestive. Against it: the alleles are present in a minority of cases, the cell of
          origin within the node has not been established, and no functional model has shown that either
          allele initiates the lesion.'
        proposed_experiments:
        - experiment_id: exp_ucd_sorted_stromal_variant_allele_fraction
          name: Variant allele fraction across sorted lymph node compartments
          description: Sort follicular dendritic cells, B-zone and perivascular reticular cells, endothelium,
            B cells, T cells, and plasma cells from PDGFRB- or IL6ST-mutant UCD nodes and measure the
            variant allele fraction in each. A driver should be near-clonal in one stromal compartment
            and absent from the hematopoietic ones; a passenger should be subclonal or spread across compartments.
          would_support:
          - pathophysiology#Somatic Stromal Cell Mutation
          supporting_outcome:
          - The variant is near-clonal in a single stromal compartment and absent from hematopoietic cells,
            identifying a cell of origin.
          refuting_outcome:
          - The variant is subclonal or distributed across unrelated compartments, indicating it was acquired
            within an already-expanded population.
      selected_evidence:
        snippet: However, we continue to lack a foundational understanding of the biological mechanisms
          driving this disease process.
        supports: SUPPORT
