      assertion_type: DifferentialDiagnosis
      assertion:
        name: Multicentric Castleman disease
        description: 'The same histopathology in more than one nodal region. This is the distinction that
          defines the entity and it is made by imaging, not by pathology: a node that looks identical
          under the microscope belongs to a different disease with a different cause and a different first-line
          therapy if other regions are involved. Systemic symptoms, cytopenias, and hypoalbuminemia in
          a patient with apparently unicentric disease should prompt a careful search for additional sites.'
        distinguishing_features:
        - Multiple enlarged lymph node regions on cross-sectional or FDG-PET imaging; systemic inflammatory
          syndrome in most rather than a minority of patients.
      selected_evidence:
        snippet: Unicentric CD (UCD) involves one enlarged lymph node region, whereas multicentric CD
          (MCD) involves multiple enlarged lymph node regions.
        supports: SUPPORT
