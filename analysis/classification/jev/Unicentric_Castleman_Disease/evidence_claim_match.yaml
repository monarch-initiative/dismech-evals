              label: localized Castleman disease
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: clonal_stromal_origin
        hypothesis_label: Clonal Somatic Stromal Mutation as a Driver of UCD
        status: EMERGING
        description: Recurrent somatic mutations in the stromal compartment - notably PDGFRB N666S, and
          IL6ST and PDGFRB in paraneoplastic-pemphigus-associated cases - make unicentric Castleman disease
          at least partly a clonal stromal-cell neoplasm rather than a purely reactive process. The mutations
          are recurrent and enriched, and PDGFRB N666S is an activating allele in other diseases, but
          they are present in a minority of cases, no functional model has shown that they initiate the
          lymph node lesion, and their cell of origin within the node is unresolved.
      selected_evidence:
        snippet: specific mutations in PDGFRB N666S in 10% of unicentric CD (UCD) and NCOA4 L261F in 23%
          of idiopathic multicentric CD (iMCD) cases
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33804823
      reference_title: A Review of Genetic Abnormalities in Unicentric and Multicentric Castleman Disease.
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies the recurrent somatic allele this hypothesis rests on, and the minority
        frequency that keeps it from being canonical.
