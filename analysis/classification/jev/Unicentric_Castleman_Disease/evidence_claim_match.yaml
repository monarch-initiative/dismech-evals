        description: CD21+ follicular dendritic cell meshworks are larger, brighter, and more structurally
          complex in both UCD and MCD than in reactive lymph nodes. Interdigitation of the expanded meshwork
          between concentric layers of mantle zone B cells is the proposed structural basis of the "onion-skinning"
          appearance, and the resulting sustained antigen presentation is proposed to drive B cell activation
          and plasma cell differentiation. This reinterprets the prominent FDCs of Castleman histology
          as an active driver rather than a passive remnant of an attenuated germinal center.
