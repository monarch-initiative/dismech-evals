        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ucd_no_disease_model
        prompt: Can a model system be built that reproduces the UCD lymph node lesion, and until one exists
          how can the stromal-activation mechanism be tested causally?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Lymph Node Stromal Cell Activation and Expansion
        - pathophysiology#Follicular Dendritic Cell Meshwork Expansion
        - pathophysiology#Stromal VEGF Overproduction and Neovascularization
        rationale: 'Every mechanism node in this entry derives from human tissue association - spatial
          transcriptomics and immunohistochemistry - with no perturbation experiment behind it, because
          no validated model system exists. That is why the causal direction cannot be settled: stromal
          activation could be driving the lesion or responding to it.'
        proposed_experiments:
        - experiment_id: exp_ucd_lymphoid_organoid_stromal_perturbation
          name: Human lymphoid organoid with defined stromal perturbation
          description: 'Build a human lymphoid organoid containing primary follicular dendritic cells,
            B-zone reticular cells, naive B cells, and endothelium, then perturb single stromal populations
            (constitutive PDGFRB N666S expression, forced VEGFA expression, lymphotoxin-beta receptor
            stimulation) and score for the defining tissue readouts: CD21 meshwork expansion, concentric
            mantle-zone B cell layering, and perifollicular neovascularization.'
          would_support:
          - pathophysiology#Lymph Node Stromal Cell Activation and Expansion
          - pathophysiology#Follicular Dendritic Cell Meshwork Expansion
          supporting_outcome:
          - Perturbing a single stromal population reproduces the onion-skinning and penetrating-vessel
            architecture, establishing stromal activation as sufficient rather than reactive.
          refuting_outcome:
          - No stromal perturbation reproduces the architecture, indicating the lesion requires an input
            absent from the organoid.
      selected_evidence:
        snippet: The absence of accurate cell culture or murine models limits functional studies of CD.
        supports: SUPPORT
