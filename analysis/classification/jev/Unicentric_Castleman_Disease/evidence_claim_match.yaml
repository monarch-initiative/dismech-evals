      assertion:
        name: Lymph Node Stromal Cell Activation and Expansion
        description: Spatial proteomic and single-nuclei transcriptomic mapping shows that the non-lymphoid
          stromal compartment of the UCD lymph node expands and forms microenvironments absent from reactive
          nodes. The subsets that expand in UCD are FDCSP+/CLU+ B-zone reticular cells and CXCL13+ follicular
          dendritic cells, in contrast to the T-zone and ACTA2+ perivascular reticular cells that dominate
          in the multicentric forms. These stromal populations, not the hematopoietic compartment, carry
          the highest VEGFA expression, and they activate JAK-STAT, TGF-beta, and MAPK programs. UCD follicles
          also show reduced cellular diversity, consistent with follicular dendritic cell predominance.
        biological_scale: TISSUE
        cell_types:
        - preferred_term: Follicular dendritic cell
          term:
            id: CL:0000442
            label: follicular dendritic cell
        - preferred_term: T-zone reticular cell
          term:
            id: CL:0009105
            label: T cell zone reticular cell
        - preferred_term: B-zone reticular cell
          term:
            id: CL:0009104
            label: B cell zone reticular cell
