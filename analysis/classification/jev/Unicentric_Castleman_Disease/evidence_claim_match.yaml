      assertion:
        name: Angiofollicular Lymph Node Hyperplasia, Hyaline-Vascular Variant
        description: The hyaline-vascular histologic pattern predominates in UCD. Features regressed/atretic
          germinal centers, penetrating radial "lollipop" vessels with hyalinized walls, expanded "onion-skinning"
          mantle zones of concentric small lymphocytes, and interfollicular vascular proliferation. Plasmacytosis
          is minimal. Spatial mapping attributes the onion-skinning to interdigitation of expanded CD21+
          follicular dendritic cell meshworks between the concentric mantle-zone B cell layers, and the
          lollipop vessels to focal VEGF overexpression by those same follicular dendritic cells.
        context: UCD
        diagnostic: true
      selected_evidence:
        snippet: Interaction of activated follicular dendritic cell (FDC) cytoplasmic meshworks with mantle-zone
          B cells is associated with B-cell activation and differentiation.
