  7af333813d977f74f316a62ea132ff13d4b9aa3dc4b076a4a0de3e2f740bff9f:
    claim:
      about:
        disease:
          name: Unicentric Castleman Disease
          disease_term:
            preferred_term: unicentric Castleman disease
            term:
              id: MONDO:0019753
              label: localized Castleman disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic Stromal Cell Mutation
        description: Recurrent somatic mutations are found in UCD lesional tissue. PDGFRB N666S, an activating
          receptor tyrosine kinase allele, is present in about 10% of cases. In paraneoplastic-pemphigus-associated
          UCD, whole-exome sequencing found IL6ST (encoding gp130) and PDGFRB as the most frequently mutated
          genes at 32% each, with IL6ST variants predicting worse overall survival. MAPK and interleukin
          signaling pathway abnormalities cluster in UCD, in contrast to the chromatin-organization and
          methylation abnormalities that cluster in idiopathic multicentric disease. Whether these alleles
          initiate the lesion or accumulate within it is unresolved.
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        genetic_context:
          variant_origin: SOMATIC
          functional_impact_category: GAIN_OF_FUNCTION
          notes: PDGFRB N666S is an activating allele; IL6ST encodes the gp130 subunit through which IL-6
            signals. PDGFRB is also the marker of the perivascular and fibroblastic reticular cells that
            expand in Castleman lymph nodes.
        biological_processes:
        - preferred_term: MAPK cascade
          term:
            id: GO:0000165
            label: MAPK cascade
          modifier: INCREASED
      selected_evidence:
        snippet: Genes affecting chromatin organization and abnormalities in methylation are seen more
          commonly in iMCD while abnormalities within the mitogen-activated protein kinase (MAPK) and
          interleukin signaling pathways are more frequent in UCD.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33804823
      reference_title: A Review of Genetic Abnormalities in Unicentric and Multicentric Castleman Disease.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the subtype-specific pathway clustering described in this node.
