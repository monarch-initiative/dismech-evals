      assertion_type: Pathophysiology
      assertion:
        name: Catabolic nitrogen stress exceeding residual ureagenesis
        description: 'Catabolic stressors such as infection, fasting, surgery, childbirth, or high protein
          intake increase endogenous protein breakdown and nitrogen load. In patients with partial residual
          urea-cycle function, this excess nitrogen can exceed detoxification capacity and precipitate
          acute hyperammonemic crises.

          '
        biological_processes:
        - preferred_term: protein catabolic process
          term:
            id: GO:0030163
            label: protein catabolic process
        locations:
        - preferred_term: liver
          term:
            id: UBERON:0002107
            label: liver
      selected_evidence:
        snippet: During metabolic stress induced by infection, childbirth or surgery, a catabolic phase
          leads to the metabolism of a large amount of proteins. This excess intake will exceed the capacity
          of the urea cycle, especially if it has an enzymatic deficit. A significant production of ammonia
          then follows.
        supports: SUPPORT
