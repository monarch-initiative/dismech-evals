          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: Ammonia passes into the circulation and crosses the blood–brain barrier. The ammonia
          will exert a direct toxic effect on the neurotransmission responsible for part of the neurological
          symptomatology.
        supports: SUPPORT
