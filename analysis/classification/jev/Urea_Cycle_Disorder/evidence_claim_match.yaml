      assertion:
        name: Arginine and citrulline supplementation
        description: 'Arginine supplementation replaces the amino acid that cannot be synthesized endogenously
          in most UCDs (except ARG1 deficiency). Citrulline supplementation may be preferable as it bypasses
          intestinal and hepatic first-pass metabolism and has been associated with lower mean ammonia
          concentrations compared to arginine alone.

          '
        treatment_term:
          preferred_term: nutritional supplementation
          term:
            id: NCIT:C15433
            label: Nutritional Support
        target_phenotypes:
        - preferred_term: Hyperammonemia
          term:
            id: HP:0001987
            label: Hyperammonemia
        notes: 'Citrulline supplementation was associated with mean ammonia of 35.9 umol/L versus 49.8
          umol/L with arginine in a retrospective cohort. Arginine is contraindicated in ARG1 deficiency.

          '
      selected_evidence:
        snippet: Most patients, except those with arginase deficiency, will need supplements of arginine
        supports: SUPPORT
