  5e9c081b438574714967b28eb51999d22dd2141c0883a1ebc90b6cca4c731d8b:
    claim:
      about:
        disease:
          name: Usher Syndrome Type 1
          disease_term:
            preferred_term: Usher syndrome type 1
            term:
              id: MONDO:0010168
              label: Usher syndrome type 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ush1_mouse_lacks_calyceal_processes
        kind: HUMAN_MODEL_MISMATCH
        prompt: Can a mouse model report on the type-1 retinal mechanism at all, given that mice have
          no calyceal processes?
        attaches_to:
        - pathophysiology#Photoreceptor Calyceal Process Network Disruption
        rationale: 'The classical type-1 mouse models are deaf without retinal degeneration, and the usual
          explanation has been species differences in where individual proteins are expressed. A structural
          explanation covers all five genes at once: the mouse photoreceptor lacks calyceal processes
          entirely, so the structure the type-1 protein network builds in human, macaque and frog does
          not exist in the model organism. That makes the absent retinal phenotype an expected consequence
          of the model rather than evidence against the mechanism, and it means a negative retinal result
          in mouse carries very little weight for this entity.

          This bears directly on preclinical efficacy testing for MYO7A gene therapy: a mouse retina cannot
          report restoration of a structure it never had.'
      selected_evidence:
        snippet: By contrast, mouse photoreceptors lacked calyceal processes and had no USH1 proteins
          at the inner-outer segment interface.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23045546
      reference_title: Localization of Usher 1 proteins to the photoreceptor calyceal processes, which
        are absent from mice.
      evidence_source: MODEL_ORGANISM
      explanation: States the structural absence that makes the mouse retina uninformative for this mechanism.
