        subtype_term:
          preferred_term: Usher syndrome type 1C
          term:
            id: MONDO:0010171
            label: Usher syndrome type 1C
        description: 'Harmonin is the scaffold of the upper tip-link density complex. It is the one type-1
          protein that genuinely spans two of the Usher entities: harmonin PDZ1 also binds the C-terminal
          PDZ-binding motifs of USH2A and ADGRV1, so harmonin is a deliberate physical bridge between
          the type-1 and type-2 networks rather than an annotation artifact. It is included here because
          the tension-bearing tip-link role is the one whose loss produces the type-1 presentation.'
        genes:
        - preferred_term: USH1C
          term:
            id: hgnc:12597
            label: USH1C
      selected_evidence:
        snippet: We identified this gene (USH1C), encoding a PDZ-domain-containing protein, harmonin,
          in a subtracted mouse cDNA library derived from inner ear sensory areas.
        supports: SUPPORT
