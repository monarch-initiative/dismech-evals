            id: GO:0007605
            label: sensory perception of sound
          modifier: DECREASED
      selected_evidence:
        snippet: Disease-causing mutations in USH genes can destabilize the tip links that bind the stereocilia
          to each other, and cause defects in protein trafficking and stereocilia bundle morphology, thereby
          inhibiting mechanosensory transduction.
        supports: SUPPORT
