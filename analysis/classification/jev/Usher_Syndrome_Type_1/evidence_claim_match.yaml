            term:
              id: MONDO:0010168
              label: Usher syndrome type 1
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Audiologic, vestibular and retinal functional evaluation
        description: Establish the clinical phenotype with subjective and electrophysiologic hearing and
          retinal testing. Vestibular testing carries particular weight here because areflexia is present
          from infancy, long before the retinal phenotype.
        results: Congenital profound hearing loss with absent vestibular responses distinguishes type
          1 from type 2 and type 3 before retinitis pigmentosa is detectable.
        measurements:
        - preferred_term: pure-tone threshold audiometry
          term:
            id: LOINC:89015-2
            label: Pure tone threshold audiometry panel
        - preferred_term: hearing threshold, left ear, 500 Hz
          term:
            id: LOINC:89024-4
            label: Hearing threshold Ear - left --500 Hz
        - preferred_term: hearing threshold, right ear, 500 Hz
          term:
            id: LOINC:89025-1
            label: Hearing threshold Ear - right --500 Hz
        - preferred_term: hearing threshold, left ear, 1000 Hz
          term:
            id: LOINC:89016-0
            label: Hearing threshold Ear - left --1000 Hz
        - preferred_term: hearing threshold, right ear, 1000 Hz
          term:
            id: LOINC:89017-8
            label: Hearing threshold Ear - right --1000 Hz
        - preferred_term: hearing threshold, left ear, 2000 Hz
          term:
            id: LOINC:89018-6
            label: Hearing threshold Ear - left --2000 Hz
        - preferred_term: hearing threshold, right ear, 2000 Hz
          term:
            id: LOINC:89019-4
            label: Hearing threshold Ear - right --2000 Hz
        - preferred_term: hearing threshold, left ear, 4000 Hz
          term:
            id: LOINC:89022-8
            label: Hearing threshold Ear - left --4000 Hz
        - preferred_term: hearing threshold, right ear, 4000 Hz
          term:
            id: LOINC:89023-6
            label: Hearing threshold Ear - right --4000 Hz
        reference_ranges:
        - unit: dB
          population: Grades recommended by the Global Burden of Disease Expert Group on Hearing Loss,
            better-ear average of 500, 1000, 2000 and 4000 Hz, as tabulated by Olusanya, Davis and Hoffman
            (WHO Bulletin)
          interpretation_bands:
          - name: Normal hearing
            upper_bound: 20
            unit: dB
            abnormal_flag: NORMAL
          - name: Mild hearing loss
            lower_bound: 20
            upper_bound: 35
            unit: dB
            abnormal_flag: HIGH
            severity: MILD
          - name: Moderate hearing loss
            lower_bound: 35
            upper_bound: 50
            unit: dB
            abnormal_flag: HIGH
            severity: MODERATE
          - name: Moderately severe hearing loss
            lower_bound: 50
            upper_bound: 65
            unit: dB
            abnormal_flag: HIGH
          - name: Severe hearing loss
            lower_bound: 65
            upper_bound: 80
            unit: dB
            abnormal_flag: HIGH
            severity: SEVERE
          - name: Profound hearing loss
            lower_bound: 80
            upper_bound: 95
            unit: dB
            abnormal_flag: HIGH
          - name: Complete or total hearing loss
            lower_bound: 95
            unit: dB
            abnormal_flag: HIGH
          notes: Values are dB hearing level (HL). The source gives each grade as a closed range to one
            decimal place (Mild hearing loss 20.0 to 34.9 dB hearing level, and so on up to Complete or
            total hearing loss 95.0 dB hearing level or greater); the half-open bands here are the same
            partition. The source splits normal hearing into -10.0 to 4.9 and 5.0 to 19.9 dB hearing level;
            both are folded into one Normal hearing band. Its Unilateral category (below 20.0 dB in the
            better ear, 35.0 dB or greater in the worse ear) needs both ears and is not representable
            as a band. Severity is set only where the grade name is mild, moderate or severe. Type 1's
            congenital loss characteristically falls in the profound band or above from infancy; the grading
            itself is generic to hearing loss of any cause, not specific to Usher syndrome.
        - unit: dB
          population: Earlier WHO grades of hearing impairment (based on the 1991 version), better-ear
            average of 500, 1000, 2000 and 4000 Hz, as tabulated by Olusanya, Davis and Hoffman (WHO Bulletin)
          interpretation_bands:
          - name: 'Grade 0: no impairment'
            upper_bound: 26
            unit: dB
            abnormal_flag: NORMAL
          - name: 'Grade 1: slight impairment'
            lower_bound: 26
            upper_bound: 41
            unit: dB
            abnormal_flag: HIGH
          - name: 'Grade 2: moderate impairment'
            lower_bound: 41
            upper_bound: 61
            unit: dB
            abnormal_flag: HIGH
            severity: MODERATE
          - name: 'Grade 3: severe impairment'
            lower_bound: 61
            upper_bound: 81
            unit: dB
            abnormal_flag: HIGH
            severity: SEVERE
          - name: 'Grade 4: profound impairment including deafness'
            lower_bound: 81
            unit: dB
            abnormal_flag: HIGH
          notes: Superseded scheme, recorded because older clinical literature reports severity on it
            and its boundaries differ from the Global Burden of Disease grades above. The source states
            whole-decibel ranges (25 dB or better, 26-40 dB, 41-60 dB, 61-80 dB, 81 dB or greater); an
            average falling between two stated ranges, such as 25.5 dB, is not assigned by the source
            and falls in the upper grade under the half-open convention used here. The same source records
            that only adults with a permanent unaided impairment above 40 dB hearing level in the better
            ear, and children with more than 30 dB, were regarded as having a disabling hearing impairment.
            Severity is set only where the grade name is moderate or severe. The grading is generic to
            hearing loss of any cause.
      selected_evidence:
        snippet: The diagnosis of USH1 is established in a proband with characteristic findings on electrophysiologic
          and subjective tests of hearing and retinal function.
