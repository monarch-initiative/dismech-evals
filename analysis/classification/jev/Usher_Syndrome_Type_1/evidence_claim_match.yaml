        name: USH1DF
        display_name: Usher syndrome type 1D/F (digenic CDH23 + PCDH15)
        subtype_term:
          preferred_term: Usher syndrome, type 1D/F
          term:
            id: MONDO:0100050
            label: Usher syndrome, type 1D/F
        genes:
        - preferred_term: CDH23
          term:
            id: hgnc:13733
            label: CDH23
        - preferred_term: PCDH15
          term:
            id: hgnc:14674
            label: PCDH15
        description: 'A type-1 phenotype in which single heterozygous variants at the two tip-link cadherin
          loci act together, rather than biallelic variants at either. It is a separate row from USH1D
          and USH1F because the inheritance claim differs: neither locus is biallelic, so those two rows
          do not describe it. The corresponding mouse cross is hearing-impaired as a double heterozygote
          while age-matched single heterozygotes are not, which is what establishes an interaction rather
          than simple carriage.'
      selected_evidence:
        snippet: In humans, we also have obtained evidence for a digenic inheritance of a USH1 phenotype
          in three unrelated families with mutations in CDH23 and PCDH15.
        supports: SUPPORT
