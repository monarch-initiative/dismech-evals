      assertion:
        name: USH1B
        display_name: Usher syndrome type 1B (MYO7A)
        subtype_term:
          preferred_term: Usher syndrome type 1B
          term:
            id: MONDO:0700087
            label: Usher syndrome type 1B
        description: 'The most common type-1 locus, accounting for more than half of type-1 cases. Myosin
          VIIa is the motor element of the upper tip-link density complex. USH1B is the subtype with an
          active retinal gene-therapy programme (dual-AAV MYO7A), which is what makes the choice of MYO7A
          isoform to deliver a live therapeutic design question rather than an academic one.

          Named for the locus rather than the gene on purpose: USH1C and USH1G are simultaneously locus
          designations and HGNC gene symbols, so a gene-symbol naming convention would be ambiguous for
          two of the five subtypes.'
        genes:
        - preferred_term: MYO7A
          term:
            id: hgnc:7606
            label: MYO7A
      selected_evidence:
        snippet: To date, 10 causative genes have been identified for Usher syndrome, with MYO7A accounting
          for >50% of type 1 and USH2A contributing to approximately 80% of type 2 Usher syndrome.
        supports: SUPPORT
