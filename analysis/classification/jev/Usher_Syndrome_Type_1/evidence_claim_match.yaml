        context:
        - path: /pathophysiology/0
          value:
            name: Upper Tip-Link Density Complex Disruption
            genes:
            - preferred_term: MYO7A
              term:
                id: hgnc:7606
                label: MYO7A
            - preferred_term: USH1C
              term:
                id: hgnc:12597
                label: USH1C
            - preferred_term: CDH23
              term:
                id: hgnc:13733
                label: CDH23
            - preferred_term: PCDH15
              term:
                id: hgnc:14674
                label: PCDH15
            - preferred_term: USH1G
              term:
                id: hgnc:16356
                label: USH1G
            subtypes:
            - USH1B
            - USH1C
            - USH1D
            - USH1F
            - USH1G
            description: 'Biallelic loss of myosin VIIa, harmonin, SANS, cadherin-23 or protocadherin-15
              disrupts the upper tip-link density (UTLD), the tension-bearing assembly at the insertion
              point of the tip link into the taller stereocilium. In the accepted model a cluster of myosin
              motors at the UTLD holds the tip link under resting tension; myosin VIIa and SANS are localized
              there, which is what places these Usher proteins in mechanotransduction rather than only
              in bundle morphogenesis.

              This is the mature-bundle complex. It is deliberately distinguished from the transient ankle-link
              complex that carries the type-2 mechanism, which is present in developing stereocilia and
              absent from mature ones.'
            biological_scale: MOLECULAR
            cell_types:
            - preferred_term: cochlear inner hair cell
              term:
                id: CL:0000589
                label: cochlear inner hair cell
            - preferred_term: cochlear outer hair cell
              term:
                id: CL:0000601
                label: cochlear outer hair cell
          role: ancestor
        - path: /has_subtypes/0
          value:
            name: USH1B
            display_name: Usher syndrome type 1B (MYO7A)
            subtype_term:
              preferred_term: Usher syndrome type 1B
              term:
                id: MONDO:0700087
                label: Usher syndrome type 1B
            description: 'The most common type-1 locus, accounting for more than half of type-1 cases.
              Myosin VIIa is the motor element of the upper tip-link density complex. USH1B is the subtype
              with an active retinal gene-therapy programme (dual-AAV MYO7A), which is what makes the
              choice of MYO7A isoform to deliver a live therapeutic design question rather than an academic
              one.

              Named for the locus rather than the gene on purpose: USH1C and USH1G are simultaneously
              locus designations and HGNC gene symbols, so a gene-symbol naming convention would be ambiguous
              for two of the five subtypes.'
            genes:
            - preferred_term: MYO7A
              term:
                id: hgnc:7606
                label: MYO7A
          role: subtype
        - path: /has_subtypes/1
          value:
            name: USH1C
            display_name: Usher syndrome type 1C (USH1C, harmonin)
            subtype_term:
              preferred_term: Usher syndrome type 1C
              term:
                id: MONDO:0010171
                label: Usher syndrome type 1C
            description: 'Harmonin is the scaffold of the upper tip-link density complex. It is the one
              type-1 protein that genuinely spans two of the Usher entities: harmonin PDZ1 also binds
              the C-terminal PDZ-binding motifs of USH2A and ADGRV1, so harmonin is a deliberate physical
              bridge between the type-1 and type-2 networks rather than an annotation artifact. It is
              included here because the tension-bearing tip-link role is the one whose loss produces the
              type-1 presentation.'
            genes:
            - preferred_term: USH1C
              term:
                id: hgnc:12597
                label: USH1C
          role: subtype
        - path: /has_subtypes/2
