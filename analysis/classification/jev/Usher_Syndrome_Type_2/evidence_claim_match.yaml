                id: MONDO:0012662
                label: Usher syndrome type 2D
            description: 'Whirlin heterodimerizes with PDZD7 and, together with it, is required for assembly
              of the quaternary ankle-link complex with usherin and ADGRV1.

              Held as a subtype rather than promoted to its own entry, although ClinGen curates WHRN against
              a distinct MONDO term (Usher syndrome type 2D, MONDO:0012662) rather than against the type-2
              term this entry binds. The mechanism is the same ankle-link assembly, so the disjunction
              test that justified separating the four Usher entities is not met here: there is no pathophysiology
              node that is true of USH2D and untrue of USH2A or USH2C. Recorded explicitly rather than
              flattened, because the external curation does draw a boundary here and a later reviewer
              should see that it was considered.'
