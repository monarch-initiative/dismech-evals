          biology within the type-2 complex and does not reproduce the full human auditory-retinal disease.
        associated_phenotypes:
        - Retinal cell death
        modeled_mechanisms:
        - target: Photoreceptor Periciliary Membrane Complex Disruption
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: CELLULAR
          limitations: Knockdown in zebrafish is a developmental perturbation and does not establish the
            magnitude or clinical course of PDZD7 modification in humans.
          description: Combined perturbation changes retinal cell survival and Gpr98 localization near
            the photoreceptor connecting cilium.
      selected_evidence:
        snippet: We validated the human genotypes using zebrafish, and our findings were consistent with
          digenic inheritance of PDZD7 and GPR98, and with PDZD7 as a retinal disease modifier in patients
          with USH2A.
        supports: SUPPORT
