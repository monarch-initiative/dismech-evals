        subtypes:
        - USH2A
        - USH2C
        - USH2D
        description: 'Biallelic loss of usherin, ADGRV1 or whirlin prevents assembly of the ankle-link
          complex at the ankle region of developing stereocilia. Whirlin and PDZD7 heterodimerize and
          orchestrate usherin and ADGRV1 into the complex through liquid-liquid phase separation; both
          scaffolds are required, and the whirlin-PDZD7 interaction is the bridge between usherin and
          ADGRV1.

          This is a transient developmental assembly, not the mature tension-bearing complex that carries
          the type-1 mechanism.'
