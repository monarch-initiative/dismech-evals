            label: Digenic inheritance
        description: A subset of type-2 disease shows digenic inheritance, in which a heterozygous PDZD7
          variant contributes together with a variant in a second type-2 gene. PDZD7 also acts as a retinal
          disease modifier. This is curated on the type-2 entity specifically because PDZD7 is a member
          of the ankle-link complex, and the reported digenic partners are ADGRV1 and USH2A.
      selected_evidence:
        snippet: Further, heterozygous PDZD7 mutations were present in patients with truncating mutations
          in USH2A, G protein-coupled receptor 98 (GPR98; also known as USH2C), and an unidentified locus.
        supports: SUPPORT
