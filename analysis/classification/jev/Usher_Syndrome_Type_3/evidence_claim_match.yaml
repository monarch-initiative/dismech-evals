      assertion_type: Treatment
      assertion:
        name: Hearing Aids and Cochlear Implantation
        description: 'Amplification early, implantation later. The sequencing is specific to this entity
          and follows from its mechanism: the deficit is a PROGRESSIVE postnatal hair cell loss, so hearing
          aids are useful while enough hair cells remain and cochlear implantation becomes indicated as
          the loss advances. Types 1 and 2 do not have this trajectory - type 1 goes to implantation early
          because the loss is profound from birth, and type 2''s sloping loss is usually managed with
          amplification throughout.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: hearing amplification and cochlear device implantation
        target_phenotypes:
        - preferred_term: Progressive sensorineural hearing impairment
          term:
            id: HP:0000408
            label: Progressive sensorineural hearing impairment
      selected_evidence:
        snippet: Hearing aids are of benefit early in the course of disease, but cochlear implants may
          be required with progressive hearing loss.
        supports: SUPPORT
