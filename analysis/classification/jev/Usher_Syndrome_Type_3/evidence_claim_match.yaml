            term:
              id: MONDO:0016485
              label: Usher syndrome type 3
        context: []
      assertion_type: Treatment
      assertion:
        name: Investigational Gene-Directed Therapy
        description: 'No approved treatment exists for the retinal degeneration. Gene replacement, gene
          editing, antisense oligonucleotides and small molecules are in development across the Usher
          entities.

          The Müller glial localization of clarin-1 has a direct consequence for this entity that does
          not apply to types 1 and 2: a retinal gene therapy would need to reach Müller glia, not photoreceptors.
          The zebrafish rescue experiment cited on the Müller glial node is the evidence for that targeting
          requirement.'
        treatment_term:
          preferred_term: Gene Therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
        notes: The binding is narrower than the row. NCIT:C15238 Gene Therapy covers gene replacement
          and editing but not the antisense oligonucleotides and small molecules the description also
          names, and NCIT has no clinical-action term spanning all four. Bound to the narrower accurate
          term rather than to a vague broader one; if the small-molecule or ASO strand becomes a specific
          named therapy for this entity it should be split into its own treatment row with its own binding.
      selected_evidence:
        snippet: While there is currently no available approved treatment for the RP, various therapeutic
          strategies are in development or in clinical trials for Usher syndrome, including gene replacement,
          gene editing, antisense oligonucleotides and small molecule drugs.
        supports: SUPPORT
