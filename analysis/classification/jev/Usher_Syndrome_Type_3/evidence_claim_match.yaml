      assertion_type: Diagnosis
      assertion:
        name: Serial audiometry with retinal functional evaluation
        description: Type 3 is distinguished from types 1 and 2 by the COURSE of the hearing loss rather
          than by its severity at any single time point, so a single audiogram cannot make the distinction
          and serial testing is required.
        results: Progressive postlingual hearing loss with variable vestibular findings and retinitis
          pigmentosa. Phenotypic variability means clinical typing does not reliably identify every CLRN1
          family.
      selected_evidence:
        snippet: Usher syndrome type III is an autosomal recessive disorder clinically characterized by
          the association of retinitis pigmentosa (RP), variable presence of vestibular dysfunction and
          progressive hearing loss, being the progression of the hearing impairment the critical parameter
          classically used to distinguish this form from Usher syndrome type I and Usher syndrome type
          II.
        supports: SUPPORT
