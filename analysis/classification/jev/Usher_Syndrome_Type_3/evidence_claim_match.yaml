      assertion:
        name: Clarin-1 Loss of Function
        genes:
        - preferred_term: CLRN1
          term:
            id: hgnc:12605
            label: CLRN1
        description: 'Biallelic loss of clarin-1, a four-transmembrane protein that belongs to neither
          the upper tip-link density complex nor the ankle-link complex. Its core experimentally supported
          cellular role is actin filament organization.

          Because clarin-1 is in neither Usher complex and has no assigned biochemical activity, this
          node names the protein''s loss rather than the disruption of a named assembly - which is the
          honest form of the claim and is itself the reason type 3 could not share a root node with types
          1 and 2.'
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: "USH3, the candidate gene that we \nidentified, encodes a 120-amino-acid protein."
        supports: SUPPORT
