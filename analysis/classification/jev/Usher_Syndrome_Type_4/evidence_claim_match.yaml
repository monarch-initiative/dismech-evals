  5e47b650e4b50ba9dc099c57d75abfeb48fd5e8d1ca563201dbcb86edcbf7fc0:
    claim:
      about:
        disease:
          name: Usher Syndrome Type 4
          disease_term:
            preferred_term: Usher syndrome, type 4
            term:
              id: MONDO:0029141
              label: Usher syndrome, type 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RPE-Restricted ARSG Loss
        biological_scale: CELLULAR
        description: 'In the retina, ARSG is not expressed where the disease is seen. In wild-type mouse
          retina the protein is detectable only in the retinal pigment epithelium, yet it is the photoreceptors
          that degenerate - so the photoreceptor loss is cell-non-autonomous, driven from the RPE.

          What the RPE does next is genuinely unresolved, and the two available species disagree. In Arsg-null
          mice the RPE is morphologically normal on electron microscopy and no storage vacuoles are found
          anywhere in the retina, which argues against a simple storage-crushes-the-RPE account. In ARSG-mutant
          dogs the RPE does accumulate autofluorescent storage bodies. The proposal that this perturbs
          the RPE-photoreceptor interactions required for photoreceptor maintenance is exactly that -
          the canine study states that the mechanism "remains to be elucidated". The node is therefore
          curated for what is established, the RPE-restricted site of action, with the downstream edge
          left as having unknown intermediates.'
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
      selected_evidence:
        snippet: the finding that the RPE of affected dogs accumulated autofluorescent storage bodies
          suggests that disease-related RPE pathology may alter the RPE–photoreceptor cell interactions
          that are necessary for maintaining normal photoreceptor cell functions
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41295716
      reference_title: Retinal Function Deficits in American Staffordshire Terriers with a Late-Onset
        Neurodegenerative Disease Associated with an ARSG Variant.
      evidence_source: MODEL_ORGANISM
      explanation: The canine counterpart, curated as PARTIAL because the same paragraph states the mechanism
        remains to be elucidated and because canine RPE storage is not seen in the mouse.
