            description: The Arsg-null mouse is both the model on which the MPS IIIE designation rests
              and the best available model of the retinal disease. Systemically it stores heparan sulfate
              in central nervous system and viscera. In the retina it loses more than half its photoreceptors
              by 24 months, with reactive astrogliosis and an outer-retinal microgliosis - and, importantly,
