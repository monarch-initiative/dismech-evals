      assertion:
        name: Impaired Lysosomal Degradation of 3-O-Sulfated Heparan Sulfate
        conforms_to: lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation
        biological_scale: CELLULAR
        description: 'ARSG catalyses one obligate step in the nine-enzyme lysosomal heparan sulfate degradation
          pathway: removal of 3-O-sulfate from glucosamine. Losing it stalls the sequential catabolic
          chain at that residue. In mouse and dog this produces frank, generalised storage; in humans
          no generalised storage phenotype has been demonstrated, which is why the downstream node here
          is confined to the retina and cochlea.'
        biological_processes:
        - preferred_term: heparan sulfate proteoglycan catabolic process
          term:
            id: GO:0030200
            label: heparan sulfate proteoglycan catabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: Within this degradation pathway, Arylsulfatase G (ARSG) is critical for removing 3-O-sulfate
          from glucosamine, and mutations in ARSG are causative for Usher syndrome type IV.
        supports: SUPPORT
