          human disease this model reproduces well, and the reason it is the reference model for USH4
          retinal degeneration rather than for the mucopolysaccharidosis it is named after.
        limitations: Onset and tempo are murine, and the mouse shows no storage vacuoles in the retina,
          so a therapy endpoint defined by clearing retinal storage would have nothing to measure in this
          model.
