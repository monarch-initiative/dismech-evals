              label: Usher syndrome, type 4
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Mucopolysaccharidosis type IIIE
        description: Not a mimic but a competing classification of the same molecular defect. Arsg-null
          mice accumulate heparan sulfate in brain and viscera and are designated MPS IIIE; whether human
          ARSG deficiency should carry that label instead of, or alongside, USH4 is actively debated.
          Humans do not show the somatic features of a mucopolysaccharidosis, which is the main argument
          against.
        distinguishing_features:
        - MPS IIIE has been described only in animal models, never established in humans
        - Human ARSG patients lack coarse facies, dysostosis multiplex and organomegaly
        - The human presentation is confined to retina and cochlea
      selected_evidence:
        snippet: This type of MPS, associated with pathogenic variants in the ARSG gene, has thus far
          been described only in the context of animal models. However, pathogenic variants in this gene
          also occur in humans, but are linked to a different disorder, Usher syndrome (USH) type IV,
          which is sparking increasing debate.
        supports: SUPPORT
