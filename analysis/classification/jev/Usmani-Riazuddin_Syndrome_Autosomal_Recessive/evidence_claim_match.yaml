        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Polarized Delivery of Somatodendritic Membrane Proteins
        description: 'AP-1 mediates selective intracellular vesicular trafficking and the polarized localization
          of somatodendritic proteins in neurons. A recycling defect in that machinery is expected to
          mis-place membrane proteins in the neuronal somatodendritic compartment.

          This node is an inference, and is marked PROVISIONAL for that reason. What is established is
          that AP-1 does this job and that these alleles disturb endosome recycling; what has not been
          measured in a neuron carrying a recessive AP1G1 genotype is the mis-delivery itself.'
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: intracellular protein transport
          modifier: DECREASED
          term:
            id: GO:0006886
            label: intracellular protein transport
      selected_evidence:
        snippet: Adaptor protein (AP) complexes mediate selective intracellular vesicular trafficking
          and polarized localization of somatodendritic proteins in neurons.
        supports: SUPPORT
        directness: INDIRECT
