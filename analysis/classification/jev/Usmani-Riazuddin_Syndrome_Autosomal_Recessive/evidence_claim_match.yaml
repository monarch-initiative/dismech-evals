            relationship: PARTIALLY_RECAPITULATES
            fidelity: MODERATE
            model_scale: ORGANISM
            description: Establishes that ap1g1 function is required for normal development and that the
              human missense alleles cannot supply it.
            limitations: 'The assay is rescue of a null, not a model of the human recessive state. A human
              USRISR patient has two missense alleles making assembled, partly functional complex; the
              fish has none, and then receives mutant mRNA. So it shows the alleles are hypofunctional
              relative to wild type, and says nothing about the residual function that biallelic missense
              leaves. It also cannot report the human phenotype: lethality at an early developmental stage
              is not intellectual disability or epilepsy.'
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Rescue of ap1g1-null morphology and lethality by human AP1G1 mRNA
        target: Disrupted Neurodevelopment
        direction: RESTORED
        interpretation: Wild-type transcript restores the phenotype; disease missense transcripts do not,
          which grades those alleles as hypofunctional.
      selected_evidence:
        snippet: significantly rescued by injection of wild-type AP1G1 mRNA and not by transcripts encoding
          the missense variants
        supports: SUPPORT
