      assertion_type: AnimalModel
      assertion:
        name: ap1g1 knockout zebrafish
        species: Zebrafish
        genotype: ap1g1 knockout
        publication: PMID:34102099
        description: 'Loss of ap1g1 in zebrafish is severely deleterious and lethal. The model is used
          here as a rescue assay rather than as a phenocopy: wild-type human AP1G1 mRNA rescues, and transcripts
          carrying the disease missense variants do not.'
        modeled_mechanisms:
        - target: Disrupted Neurodevelopment
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Establishes that ap1g1 function is required for normal development and that the
            human missense alleles cannot supply it.
          limitations: 'The assay is rescue of a null, not a model of the human recessive state. A human
            USRISR patient has two missense alleles making assembled, partly functional complex; the fish
            has none, and then receives mutant mRNA. So it shows the alleles are hypofunctional relative
            to wild type, and says nothing about the residual function that biallelic missense leaves.
            It also cannot report the human phenotype: lethality at an early developmental stage is not
            intellectual disability or epilepsy.'
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The measured quantity is rescue of morphological defect and lethality in a null
              background. The quantity the node needs is impairment of neurodevelopment in the presence
              of two hypomorphic alleles. Rescue failure stands in for that.
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: The readout phenotype is early embryonic morphology and lethality in a fish.
              The human phenotype is intellectual disability, developmental delay and epilepsy, none of
              which this assay can observe.
          readouts:
          - name: Rescue of ap1g1-null morphology and lethality by human AP1G1 mRNA
            target: Disrupted Neurodevelopment
            direction: RESTORED
            interpretation: Wild-type transcript restores the phenotype; disease missense transcripts
              do not, which grades those alleles as hypofunctional.
      selected_evidence:
        snippet: Knocking out ap1g1 in zebrafish leads to severe morphological defect and lethality
        supports: SUPPORT
