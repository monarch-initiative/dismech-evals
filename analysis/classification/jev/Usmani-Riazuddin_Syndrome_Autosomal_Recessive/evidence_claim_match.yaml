      assertion_type: Pathophysiology
      assertion:
        name: Biallelic AP1G1 Missense Substitution
        description: Both AP1G1 alleles carry a missense substitution. In silico analysis and 3D protein
          modelling predicted altered AP1-gamma-1 folding for the missense variants, and altered AP1-gamma-1
          levels were observed in heterologous cells, so the protein is made but is not normal.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genes:
        - preferred_term: AP1G1
          term:
            id: hgnc:555
            label: AP1G1
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: Recorded as PARTIAL_LOSS_OF_FUNCTION rather than LOSS_OF_FUNCTION. The zebrafish
            rescue failure is a loss-of-function readout, but the same alleles retain normal interaction
            with the other AP-1 subunits, so the protein is not simply absent or non-functional - it assembles
            and then misroutes. A full LOSS_OF_FUNCTION grading would assert more than the functional
            data show.
        biological_processes:
        - preferred_term: protein folding
          modifier: ABNORMAL
          term:
            id: GO:0006457
            label: protein folding
      selected_evidence:
        snippet: In silico analysis and 3D protein modeling simulation predicted alteration of AP1γ1 protein
          folding for missense variants, which was consistent with the observed altered AP1γ1 levels in
          heterologous cells.
        supports: SUPPORT
