  6315bc35965db5a690d076f1227445887c19dc0ccdc84189c4cc7c4adf7eb262:
    claim:
      about:
        disease:
          name: Usutu Virus Disease
          disease_term:
            preferred_term: Usutu virus disease
        context: []
      assertion_type: AgentLifeCycle
      assertion:
        description: USUV circulates in an enzootic cycle between ornithophilic Culex mosquitoes and birds,
          which are the amplifying and reservoir hosts and in which the virus can cause lethal epizootics
          (notably in Eurasian blackbirds and captive owls). Humans and horses are incidental, dead-end
          hosts that do not contribute to the transmission cycle.
        hosts:
        - preferred_term: Wild birds (amplifying and reservoir host)
          role: amplifying and reservoir host
          term:
            id: NCBITaxon:8782
            label: Aves
        - preferred_term: Human (incidental dead-end host)
          role: incidental (dead-end) host
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        vectors:
        - Culex mosquitoes (notably Culex pipiens)
      selected_evidence:
        snippet: During late summer 2001 in Austria, a series of deaths in several species of birds occurred,
          similar to the beginning of the West Nile virus (WNV) epidemic in the United States.
        supports: SUPPORT
    origin:
      assertion_path: /agent_life_cycle
      evidence_path: /agent_life_cycle/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12095429
      reference_title: Emergence of Usutu virus, an African mosquito-borne flavivirus of the Japanese
        encephalitis virus group, central Europe.
      evidence_source: OTHER
      quote_role: PRIMARY_RESULT
      explanation: Documents the European emergence of USUV as avian die-offs, the first recognition of
        the virus outside Africa.
