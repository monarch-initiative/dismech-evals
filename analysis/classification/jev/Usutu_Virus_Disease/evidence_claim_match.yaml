          I interferon induction and signalling, blunting the early antiviral response and permitting
          systemic spread.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: viral genome replication
          term:
            id: GO:0019079
            label: viral genome replication
        - preferred_term: flaviviral suppression of host type I interferon signaling
          term:
            id: GO:0039502
            label: symbiont-mediated suppression of host type I interferon-mediated signaling pathway
      selected_evidence:
        snippet: Previous studies demonstrated that whole-body deletion of type I interferon (IFN) signaling
          led to widespread USUV infection and fatality in mice.
        supports: SUPPORT
        directness: INDIRECT
