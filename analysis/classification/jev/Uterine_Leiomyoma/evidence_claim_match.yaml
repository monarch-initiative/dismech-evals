  42799d70885b22d34b28b4751ca60dd696934e2bb366af736443a859b944b24c:
    claim:
      about:
        disease:
          name: Uterine Leiomyoma
          disease_term:
            preferred_term: uterine fibroid
            term:
              id: MONDO:0007886
              label: uterine corpus leiomyoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hmb_dominant_mechanism
        kind: OPEN_QUESTION
        status: OPEN
        prompt: 'Which mechanism dominates fibroid-associated heavy menstrual bleeding: rupture of structurally
          deficient pseudocapsule neovessels, dilated venous lakes from mass effect, or TGF-beta-3-mediated
          endometrial hemostatic failure?'
        attaches_to:
        - pathophysiology#Aberrant Pseudocapsule Angiogenesis and Venous Ectasia
        - pathophysiology#Endometrial Hemostatic Failure and Impaired Vessel Closure
        - phenotypes#Heavy Menstrual Bleeding
        rationale: 'All three mechanisms are separately evidenced and this entry curates all three, but
          their relative contribution is unsettled and the candidate explanations make different predictions.
          The pseudocapsule account predicts bleeding should track fibroid location, since only intramural
          fibroids develop a pseudocapsule. The venous-lake account was originally attributed to interstitial
          pressure and later reattributed to growth factors enlarging the veins. The endometrial account
          is location-independent and predicts bleeding even from fibroids that do not distort the cavity.
          Distinguishing them matters clinically, because tranexamic acid and the levonorgestrel system
          act on the endometrial arm while embolization and ablation act on the vascular one.

          '
      selected_evidence:
        snippet: These aberrations in vascular architecture and network could explain the heavy menstrual
          bleeding observed. However, other theories have been proposed such as venous trunks, or venous
          lakes caused by the blocking of normal blood flow by uterine fibroids, or the increased local
          action of vasoactive growth factors.
        supports: SUPPORT
