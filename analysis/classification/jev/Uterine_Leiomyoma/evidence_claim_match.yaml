        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Excessive Extracellular Matrix Deposition and Tissue Stiffening
        conforms_to: fibrotic_response#Excessive ECM Deposition
        description: 'The defining feature of a fibroid is not its cell count but its matrix: the mutated
          smooth muscle cells and the adjacent tumor-associated fibroblasts deposit disproportionate quantities
          of collagen, fibronectin and proteoglycans, which constitute a substantial fraction of tumor
          volume. The accumulated matrix is not inert. It stiffens the tissue, and it binds and prolongs
          the activity of the growth factors (TGF-beta chief among them) that drove its own deposition,
          so the matrix becomes a self-reinforcing feed-forward arm of the mechanism rather than the end
          of it. Matrix metalloproteinase activity is dysregulated in parallel, so remodeling as well
          as deposition is abnormal. This is the node on which the disease''s name rests and the one that
          distinguishes a fibroid from a simple hyperplasia.

          '
        biological_scale: TISSUE
        cell_types:
        - preferred_term: leiomyoma smooth muscle cell
          term:
            id: CL:0000192
            label: smooth muscle cell
        - preferred_term: tumor-associated fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: excessive extracellular matrix deposition
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: INCREASED
        - preferred_term: collagen fibril organization
          term:
            id: GO:0030199
            label: collagen fibril organization
          modifier: INCREASED
        - preferred_term: TGF-beta receptor signaling
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: Excessive ECM accumulation and aberrant remodeling are crucial for fibrotic diseases
          and excessive ECM deposition is the central characteristics of UFs.
        supports: SUPPORT
