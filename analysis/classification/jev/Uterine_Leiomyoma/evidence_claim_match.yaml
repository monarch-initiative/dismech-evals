      assertion_type: AnimalModel
      assertion:
        name: Human leiomyoma tissue xenograft in immunodeficient mouse
        species: Mouse
        genotype: Severe combined immunodeficiency (SCID) host, human leiomyoma tissue graft
        category: Xenograft
        description: 'Human fibroid tissue grafted subcutaneously or beneath the renal capsule of immunodeficient
          mice, usually with a sustained-release hormone device to keep the graft in its native hormonal
          environment. This is the model that preserves the human tumor''s own driver genotype, heterogeneity
          and microenvironment, and so the one used for preclinical efficacy work meant to translate.

          '
        publication: PMID:41810407
        modeled_mechanisms:
        - target: Excessive Extracellular Matrix Deposition and Tissue Stiffening
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: TISSUE
          description: The graft retains the histopathological morphology of the source tumor, matrix
            included, which is exactly the property that makes it the translational bridge.
          limitations: Requires an immunodeficient host, so the immune and inflammatory contributions
            to fibroid matrix biology cannot be studied in it at all. Results also vary between tissue
            donors, and the model is technically demanding and expensive.
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: The host has no adaptive immune system, so the immune infiltrate and the inflammatory
              signalling that recent reviews implicate in fibroid ECM production are outside the model
              boundary.
          - divergence_type: POPULATION_MISMATCH
            materiality: QUALIFYING
            description: Each graft reproduces one donor's tumor, and inter-donor variability is reported
              as a limitation of the approach, so a single xenograft experiment speaks to one molecular
              subtype rather than to the disease's driver spectrum.
      selected_evidence:
        snippet: xenograft models can best simulate the pathological features of human ULs and serve as
          a key bridge between basic research and clinical translation
        supports: SUPPORT
