            term:
              id: MONDO:0007886
              label: uterine corpus leiomyoma
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: VARIABLE
        rationale: 'The burden is genuinely bimodal rather than merely heterogeneous, and averaging it
          would misdescribe the disease. Most women with fibroids never know they have them; among those
          who do, roughly 30% report a quality-of-life impact, and for that minority heavy menstrual bleeding
          is the dominant complaint and the leading reason for elective hysterectomy. Mortality is essentially
          nil. So the same diagnosis covers an incidental ultrasound finding and an indication for major
          surgery.

          '
      selected_evidence:
        snippet: In ~30% of patients, uterine fibroids cause menorrhagia, or heavy menstrual bleeding,
          and more than half of the patients experience symptoms such as heavy menstrual bleeding, pelvic
          pain, or infertility.
        supports: SUPPORT
