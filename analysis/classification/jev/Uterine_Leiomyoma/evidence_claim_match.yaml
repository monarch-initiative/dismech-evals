      assertion_type: Pathophysiology
      assertion:
        name: Hormone-Driven Myometrial Smooth Muscle Proliferation
        conforms_to: sex_steroid_driven_proliferation#Target-Cell Population Expansion
        description: 'Estradiol and progesterone are essential for fibroid growth. During each ovulatory
          cycle the myometrium proliferates under ovarian steroid stimulation. Progesterone, acting through
          its nuclear receptor (PGR) in differentiated fibroid cells, activates paracrine secretion of
          WNT ligands, cytokines, and growth factors that drive a small stem cell population to proliferate.
          Fibroids rarely arise before menarche and frequently regress after menopause, underscoring steroid
          hormone dependence. The excessive matrix these proliferating cells and the adjacent tumor-associated
          fibroblasts lay down is modelled as the separate downstream node "Excessive Extracellular Matrix
          Deposition and Tissue Stiffening"; this node is the cell-population expansion alone.

          '
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: myometrial smooth muscle cell
          term:
            id: CL:0002366
            label: myometrial cell
        - preferred_term: tumor-associated fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: smooth muscle cell proliferation
          term:
            id: GO:0048661
            label: positive regulation of smooth muscle cell proliferation
          modifier: INCREASED
        - preferred_term: progesterone receptor signaling
          term:
            id: GO:0050847
            label: progesterone receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: "Progesterone, via its receptors in differentiated fibroid cell \npopulations, activates\
          \ the production of Wingless-type MMTV integration site \nfamily (WNT) ligands, cytokines, and\
          \ other growth substances to act on adjacent \nstem cells in a paracrine fashion to support\
          \ tumor growth."
        supports: SUPPORT
    origin:
