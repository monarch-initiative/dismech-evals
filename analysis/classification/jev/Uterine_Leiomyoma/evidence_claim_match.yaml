    evidence_metadata:
      reference: PMID:41810407
      reference_title: 'Preclinical research platform for uterine leiomyoma: construction optimization
        and selection of animal models.'
      evidence_source: MODEL_ORGANISM
      explanation: Establishes this strain's standing as the most commonly used uterine leiomyoma model,
        which is why it is curated here rather than only mentioned in notes.
