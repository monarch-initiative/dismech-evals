              label: uterine corpus leiomyoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: eker_rat_driver_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does a Tsc2-driven rat tumor tell us anything about how a MED12-, HMGA2- or FH-driven
          human fibroid starts?
        attaches_to:
        - pathophysiology#Driver Mutation-Initiated Clonal Transformation
        - animal_models#Rat
        rationale: 'The Eker rat is the workhorse spontaneous model and its tumors look and behave like
          human fibroids at the tissue and hormonal level, so results from it are routinely read as being
          about fibroid biology generally. But its lesion is a germline Tsc2 mutation acting through mTOR,
          and none of the recurrent human somatic drivers is present. The mismatch is therefore not that
          evidence is missing but that evidence exists in a system whose initiating genotype is wrong,
          which is the distinction between a knowledge gap and a model mismatch. The practical consequence
          is that the developmental-exposure and vitamin D results obtained in this strain support the
          environmental records in this entry at the level of myometrial stem cell DNA repair, and do
          not support any claim about the human driver mutations themselves.

          '
      selected_evidence:
        snippet: Current uterine fibroid animal models cannot fully reproduce the complex pathological
          process of human ULs, so optimization of current pathological models is needed.
        supports: SUPPORT
