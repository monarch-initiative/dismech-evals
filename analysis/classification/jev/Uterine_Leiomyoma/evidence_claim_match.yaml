      assertion_type: Environmental
      assertion:
        name: Developmental exposure to endocrine-disrupting chemicals
        description: 'Early-life exposure of the myometrium to endocrine-disrupting chemicals raises adult
          fibroid risk. The strongest mechanistic evidence is from Eker rats exposed neonatally to diethylstilbestrol,
          whose myometrial stem cells show reduced RAD50 and MRE11 and a defective DNA damage response
          at the pro-fibroid stage, months before tumors appear. In humans the corresponding exposures
          reported are xenoestrogens in early ontogenesis, diethylstilbestrol, and phthalates and bisphenol
          A.

          '
        exposure_term:
          preferred_term: exposure to xenoestrogen
          term:
            id: ECTO:9002036
            label: exposure to xenoestrogen
        effect: Developmental risk factor, acting through DNA-damage-response impairment in myometrial
          stem cells.
      selected_evidence:
        snippet: These factors include race, age, parity, family history, food additives, obesity, vitamin
          D deficiency, and endocrine-disrupting chemical exposure
        supports: SUPPORT
