  73a75bf689d578915ae9e5c39abee3be245565e7f9794310da4b9d47e87b2175:
    claim:
      about:
        disease:
          name: Uterine Leiomyoma
          disease_term:
            preferred_term: uterine fibroid
            term:
              id: MONDO:0007886
              label: uterine corpus leiomyoma
        context:
        - path: /pathophysiology/0
          value:
            name: Driver Mutation-Initiated Clonal Transformation
            description: 'Uterine leiomyomas (fibroids) originate as monoclonal tumors from a single myometrial
              smooth muscle cell (or a myometrial stem cell acquiring tumor-initiating features) that
              acquires a recurrent somatic driver mutation. The most common driver is a MED12 exon-2 mutation
              (~70-77%), followed by HMGA2/HMGA1 overexpression or chromosomal rearrangement (~10%, 12q14-15),
              biallelic FH (fumarate hydratase) loss defining the FH-deficient subtype (also seen in hereditary
              leiomyomatosis and renal cell cancer, HLRCC), with rarer collagen IV (COL4A5/COL4A6) deletions
              also reported. Heterozygous MED12 mutations disrupt the CDK8/CDK19 kinase module of the
              Mediator complex, altering the chromatin landscape, enhancer engagement, genomic stability,
              and progesterone responsiveness.

              Scoping decision, recorded so it is not mistaken for an oversight: COL4A5/COL4A6 deletion
              and the SRCAP-complex class are named here but are deliberately not given has_subtypes entries.
              Both are recurrent but rare relative to the three modelled classes, neither has a distinct
              pathophysiology arm this entry could populate beyond the shared ECM output, and neither
              changes management. A curator with a collagen-IV-specific mechanism or frequency source
              should add the subtype then.

              '
            biological_scale: MOLECULAR
            genetic_context:
              variant_origin: SOMATIC
              functional_impact_category: GAIN_OF_FUNCTION
              notes: This block describes the MED12 arm only, which is the majority route and the one
                the node's evidence characterizes. It does not describe FH, whose lesion is biallelic
                loss of a tumor suppressor (LOSS_OF_FUNCTION) and is germline in roughly half of FH-deficient
                tumors - see the separate FH node and the FH-deficient subtype. It does not describe HMGA2
                rearrangement either, which is a structural event rather than a point-mutation gain of
                function. The slots are single-valued, so restricting them to one arm and saying so is
                more accurate than picking a value that is wrong for two of the three genes.
            genes:
            - preferred_term: MED12
              term:
                id: hgnc:11957
                label: MED12
            - preferred_term: HMGA2
              term:
                id: hgnc:5009
                label: HMGA2
            - preferred_term: FH
              term:
                id: hgnc:3700
                label: FH
            cell_types:
            - preferred_term: myometrial smooth muscle cell
              term:
                id: CL:0002366
                label: myometrial cell
            biological_processes:
            - preferred_term: Wnt/beta-catenin signaling dysregulation
              term:
                id: GO:0016055
                label: Wnt signaling pathway
              modifier: INCREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Fumarate Accumulation in FH-Deficient Leiomyoma
        description: 'In the FH-deficient subtype the driver lesion is biallelic loss of the tricarboxylic-acid-cycle
          enzyme fumarate hydratase, so the initiating event is metabolic rather than transcriptional:
          fumarate accumulates and succinates cysteine residues, which is the branch this edge names.'
        causal_link_type: DIRECT
      selected_evidence:
        snippet: The immunohistochemical sensitivity of FH and 2SC were 97.3% and 100%, respectively.
        supports: SUPPORT
