      - /disease_term
    evidence_metadata:
      reference: PMID:34626221
      reference_title: 'Uterine cellular leiomyomas are characterized by common HMGA2 aberrations, followed
        by chromosome 1p deletion and MED12 mutation: morphological, molecular, and immunohistochemical
        study of 52 cases.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Gives the immunohistochemical overlap that makes this differential hard: CD10 is positive
