  15203305b7fada9e2af5106dfadcc047a4b27e940ee574cfd95b461fb29d54e9:
    claim:
      about:
        disease:
          name: Uterine Leiomyoma
          disease_term:
            preferred_term: uterine fibroid
            term:
              id: MONDO:0007886
              label: uterine corpus leiomyoma
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Eker rat (germline Tsc2 mutation)
        species: Rat
        genotype: Tsc2 germline loss-of-function (Eker strain)
        category: Spontaneous
        genes:
        - preferred_term: Tsc2
          term:
            id: hgnc:12363
            label: TSC2
        description: 'The most widely used spontaneous model. Roughly 65% of female Eker rats develop
          uterine smooth muscle tumors at 12-16 months through a germline Tsc2 mutation and consequent
          mTOR pathway activation. Histomorphology and oestrogen/progesterone dependence closely resemble
          human fibroids, and the strain has carried most of the gene-environment work in this field,
          including the developmental DES exposure and vitamin D3 rescue experiments this entry cites.

          '
        publication: PMID:41810407
        notes: The gene_term binds the human TSC2 ortholog because HGNC codes human genes; the model's
          own lesion is rat Tsc2. MGI/RGD identifiers for the rat gene are not bound by any current dismech
          slot.
        modeled_mechanisms:
        - target: Hormone-Driven Myometrial Smooth Muscle Proliferation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Reproduces spontaneous, hormone-dependent uterine smooth muscle tumorigenesis in
            an intact animal, which is what makes it usable for gene-environment and chemoprevention work
            no in vitro system can do.
          limitations: The driving lesion is Tsc2, which is not one of the recurrent human somatic drivers
            (MED12, HMGA2, FH), so the model recapitulates the hormone-dependent growth phase without
            recapitulating the initiating genotype. It also takes 12-16 months, is expensive, and the
            animals develop concurrent renal and hepatic tumors that confound interpretation.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Rat myometrium rather than human, with a rodent oestrous cycle rather than a
              menstrual cycle, so the cyclical progesterone exposure that drives human fibroid growth
              is not reproduced in the same temporal pattern.
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: 'The human driver lesions are outside the model entirely: no MED12 exon-2 mutation,
              no HMGA2 rearrangement and no FH loss, so nothing in this animal addresses the Mediator-kinase,
              architectural-transcription-factor or oncometabolite arms of the human mechanism.'
        - target: Driver Mutation-Initiated Clonal Transformation
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: MOLECULAR
          description: The model does not reproduce the human initiating lesion. Its tumors start from
            a germline Tsc2 mutation present in every cell, where human fibroids start from a somatic
            driver acquired by one myometrial cell, so the monoclonal-origin and driver-genotype claims
            of this node are outside what the model can support.
          limitations: Tsc2 is not among MED12, HMGA2, FH or COL4A5/COL4A6, and the lesion is germline
            rather than somatic. Any inference from this model to the human initiating event is an inference
            about hormone-dependent growth in a predisposed myometrium, not about how a human fibroid
            starts.
        - target: Excessive Extracellular Matrix Deposition and Tissue Stiffening
          relationship: RESCUES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: The Eker rat is the system in which vitamin D3 was shown to restore the MRN complex/ATM
            DNA-repair axis in myometrial stem cells after developmental DES exposure, which is the experimental
            basis for the vitamin D environmental record in this entry.
          limitations: The measured endpoint is DNA damage and repair-protein expression in isolated myometrial
            stem cells, not matrix deposition or tumor volume, so the link to the fibrotic output node
            is an extrapolation across both scale and endpoint.
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: INVALIDATING
            description: The model's measured quantity is DNA-damage load and MRN-complex protein expression
              in stem cells. The node's quantity is collagen-rich matrix deposited in a tumor. Nothing
              in the cited experiment measures the latter.
          - divergence_type: SCALE_EXTRAPOLATION
            materiality: QUALIFYING
            description: Observed at the molecular scale (repair-protein expression) and cited for a TISSUE-scale
              node, so the inference crosses two scale steps.
      selected_evidence:
        snippet: Because of the convenience of model establishment, this model has become one of the most
          commonly used models for ULs
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
