  f4f08599bc9c080b8a06b76a417ed332bb3452619a917ad5255070fb797f4f57:
    claim:
      about:
        disease:
          name: Uterine Leiomyoma
          disease_term:
            preferred_term: uterine fibroid
            term:
              id: MONDO:0007886
              label: uterine corpus leiomyoma
        context: []
      assertion_type: Subtype
      assertion:
        name: FH-deficient
        display_name: FH-deficient leiomyoma
        description: 'An uncommon but clinically consequential subtype defined by biallelic loss of fumarate
          hydratase, recognizable on routine histology by a cluster of features (staghorn vasculature,
          alveolar-pattern oedema, bizarre nuclei, eosinophilic nucleoli with perinucleolar haloes, eosinophilic
          intracytoplasmic globules) and confirmable by loss of FH or gain of 2SC staining. It matters
          out of proportion to its frequency because a large fraction of cases carry a germline FH variant
          - 31 of 80 tumors (39%) in the reference series, or 52% of those in which sequencing found a
          variant at all - which makes the patient and her relatives HLRCC kindred at risk of renal cell
          carcinoma.

          '
        genes:
        - preferred_term: FH
          term:
            id: hgnc:3700
            label: FH
      selected_evidence:
        snippet: More than four histologic features, including staghorn vasculature, alveolar-pattern
          edema, bizarre nuclei, oval nuclei arranged in chains, prominent eosinophilic nucleoli with
          perinucleolar haloes and eosinophilic intracytoplasmic globules were observed in 98.5% (67/68)
          patients.
        supports: SUPPORT
    origin:
