  e20e5c8e826815dc33b4a67587005d9809cbdb70be4bee5868fa3a0a42d9d52a:
    claim:
      about:
        disease:
          name: Uterine Leiomyoma
          disease_term:
            preferred_term: uterine fibroid
            term:
              id: MONDO:0007886
              label: uterine corpus leiomyoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Driver Mutation-Initiated Clonal Transformation
        description: 'Uterine leiomyomas (fibroids) originate as monoclonal tumors from a single myometrial
          smooth muscle cell (or a myometrial stem cell acquiring tumor-initiating features) that acquires
          a recurrent somatic driver mutation. The most common driver is a MED12 exon-2 mutation (~70-77%),
          followed by HMGA2/HMGA1 overexpression or chromosomal rearrangement (~10%, 12q14-15), biallelic
          FH (fumarate hydratase) loss defining the FH-deficient subtype (also seen in hereditary leiomyomatosis
          and renal cell cancer, HLRCC), with rarer collagen IV (COL4A5/COL4A6) deletions also reported.
          Heterozygous MED12 mutations disrupt the CDK8/CDK19 kinase module of the Mediator complex, altering
          the chromatin landscape, enhancer engagement, genomic stability, and progesterone responsiveness.

          Scoping decision, recorded so it is not mistaken for an oversight: COL4A5/COL4A6 deletion and
          the SRCAP-complex class are named here but are deliberately not given has_subtypes entries.
          Both are recurrent but rare relative to the three modelled classes, neither has a distinct pathophysiology
          arm this entry could populate beyond the shared ECM output, and neither changes management.
          A curator with a collagen-IV-specific mechanism or frequency source should add the subtype then.

          '
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: SOMATIC
          functional_impact_category: GAIN_OF_FUNCTION
          notes: This block describes the MED12 arm only, which is the majority route and the one the
            node's evidence characterizes. It does not describe FH, whose lesion is biallelic loss of
            a tumor suppressor (LOSS_OF_FUNCTION) and is germline in roughly half of FH-deficient tumors
            - see the separate FH node and the FH-deficient subtype. It does not describe HMGA2 rearrangement
            either, which is a structural event rather than a point-mutation gain of function. The slots
            are single-valued, so restricting them to one arm and saying so is more accurate than picking
            a value that is wrong for two of the three genes.
        genes:
        - preferred_term: MED12
          term:
            id: hgnc:11957
            label: MED12
        - preferred_term: HMGA2
          term:
            id: hgnc:5009
            label: HMGA2
        - preferred_term: FH
          term:
            id: hgnc:3700
            label: FH
        cell_types:
        - preferred_term: myometrial smooth muscle cell
          term:
            id: CL:0002366
            label: myometrial cell
        biological_processes:
        - preferred_term: Wnt/beta-catenin signaling dysregulation
          term:
            id: GO:0016055
            label: Wnt signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: "Heterozygous mutations in MED12, a chromatin-associated protein, disrupt \nthe attached\
          \ CDK8 kinase module in the Mediator complex. MED12 mutations are \nassociated with increased\
          \ genomic instability, altered chromatin landscape and \nenhancer engagement, and increased\
          \ responsiveness to progesterone."
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40214304
      reference_title: UTERINE FIBROIDS.
      evidence_source: HUMAN_CLINICAL
      explanation: Describes the molecular consequence of MED12 driver mutations on the Mediator kinase
        module and progesterone responsiveness.
