              to reduce expression of plasminogen activator inhibitor 1, antithrombin III and thrombomodulin,
              which the source says likely contributes to the bleeding. Both steps are hedged in the source
              and are hedged here. Note also that two of those three regulators are anticoagulants, so
              the net direction is an interpretation of the hemostatic outcome the source draws rather
              than a reading of each protein in isolation - the DECREASED modifier on the blood-coagulation
              process below records that net outcome, not a per-protein reading. The endometrium is therefore
              both less able to decidualize and less able to form and hold a hemostatic plug. This node
              is where the reproductive and the bleeding phenotypes share a mechanism.

              Scope note: the purely physical contributions to the bleeding - increased endometrial surface
              area, disordered myometrial contractility, and venous ectasia from compression - are real
              and are cited below, but they are properties of the tumor mass and belong to the Tumor Growth
              and Bulk Compression nodes. This node is the endometrial signalling arm, which is why it
              is tagged TISSUE.

              '
