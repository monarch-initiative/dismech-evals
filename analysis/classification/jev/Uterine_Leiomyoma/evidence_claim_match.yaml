  eefbab4e6af21b519613a7086fb752e1572a381661b48c1c5c2e6b62acbaddf0:
    claim:
      about:
        disease:
          name: Uterine Leiomyoma
          disease_term:
            preferred_term: uterine fibroid
            term:
              id: MONDO:0007886
              label: uterine corpus leiomyoma
        context:
        - path: /has_subtypes/2
          value:
            name: FH-deficient
            display_name: FH-deficient leiomyoma
            description: 'An uncommon but clinically consequential subtype defined by biallelic loss of
              fumarate hydratase, recognizable on routine histology by a cluster of features (staghorn
              vasculature, alveolar-pattern oedema, bizarre nuclei, eosinophilic nucleoli with perinucleolar
              haloes, eosinophilic intracytoplasmic globules) and confirmable by loss of FH or gain of
              2SC staining. It matters out of proportion to its frequency because a large fraction of
              cases carry a germline FH variant - 31 of 80 tumors (39%) in the reference series, or 52%
              of those in which sequencing found a variant at all - which makes the patient and her relatives
              HLRCC kindred at risk of renal cell carcinoma.

              '
            genes:
            - preferred_term: FH
              term:
                id: hgnc:3700
                label: FH
          role: subtype
      assertion_type: HistopathologyFinding
      assertion:
        name: FH-deficient histologic signature
        subtype: FH-deficient
        description: 'A recognizable constellation rather than a single feature: staghorn vasculature,
          alveolar-pattern oedema, bizarre nuclei, oval nuclei arranged in chains, prominent eosinophilic
          nucleoli with perinucleolar haloes, and eosinophilic intracytoplasmic globules. More than four
          of these were present in 98.5% of an 80-case series. Confirmation is immunohistochemical: loss
          of FH staining (97.3% sensitive) or gain of S-(2-succino)-cysteine staining (100% in the five
          cases tested). Finding this pattern is what prompts germline FH testing, so it is the histology
          with the largest downstream consequence in this disease.

          '
        finding_term:
          preferred_term: FH-deficient uterine leiomyoma with bizarre nuclei
          term:
            id: NCIT:C4257
            label: Bizarre Leiomyoma
        frequency: VERY_FREQUENT
        diagnostic: true
        notes: The bound term names only the bizarre-nuclei component. NCIT has no term for the FH-deficient
          composite signature, and the atypical/bizarre leiomyoma concept is not coextensive with it,
          so preferred_term carries the specific meaning per the ontology term contract. The frequency
          band is within the FH-deficient subtype (98.5% of cases), not within uterine leiomyoma as a
          whole, where the subtype is uncommon.
      selected_evidence:
        snippet: More than four histologic features, including staghorn vasculature, alveolar-pattern
          edema, bizarre nuclei, oval nuclei arranged in chains, prominent eosinophilic nucleoli with
          perinucleolar haloes and eosinophilic intracytoplasmic globules were observed in 98.5% (67/68)
          patients.
        supports: SUPPORT
