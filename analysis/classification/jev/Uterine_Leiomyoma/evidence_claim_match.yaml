    evidence_metadata:
      reference: PMID:37263921
      reference_title: '[Fumarate hydratase deficient uterine leiomyoma: a clinicopathological and molecular
        analysis of 80 cases].'
      evidence_source: HUMAN_CLINICAL
      explanation: Loss of FH protein and accumulation of the fumarate adduct S-(2-succino)-cysteine are
        both demonstrable by immunohistochemistry in FH-deficient leiomyoma, which is what makes the FH
        driver lesion and the fumarate accumulation downstream of it a single observable step.
