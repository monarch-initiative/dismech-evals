        features: 'Biallelic FH loss defines the fumarate-hydratase-deficient leiomyoma subtype. In an
          80-case series the first FH hit was germline in 31 tumors, somatic in 29, and undetected by
          exon sequencing in 20, so the subtype is not synonymous with the hereditary syndrome. Germline
          FH variants cause hereditary leiomyomatosis and renal cell cancer (HLRCC), an autosomal dominant
          syndrome of cutaneous and uterine leiomyomas plus renal cell carcinoma, which dismech curates
          separately as Hereditary_Leiomyomatosis_and_Renal_Cell_Cancer; 69% of the germline-variant patients
          in that series had a clear family history. Because the germline case is heritable and carries
          a renal cancer risk, recognizing FH-deficient histology on a resected fibroid is the clinically
          consequential part of this subtype.

          '
      selected_evidence:
        snippet: "Driver mutations in genes such as \nMED12, HMGA2, and FH also play roles in the development\
          \ and growth of fibroids."
