  2954785c03f10b58290f8dea2867ff92c629d9298a4a4250d516664ed83e2421:
    claim:
      about:
        disease:
          name: Uterine Leiomyoma
          disease_term:
            preferred_term: uterine fibroid
            term:
              id: MONDO:0007886
              label: uterine corpus leiomyoma
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Endometrial stromal tumor
        description: 'Endometrial stromal nodule and low-grade endometrial stromal sarcoma enter the differential
          chiefly against the cellular leiomyoma variant, where increased cellularity and reduced stroma
          remove the morphologic cues that separate them.

          '
        distinguishing_features:
        - 'Immunohistochemistry is suggestive rather than decisive: cellular leiomyomas express CD10 in
          a majority of cases (65.4%, though only 42.2% strongly, at H-score above 50) and IFITM1 in 36.5%,
          so positivity for an endometrial stromal marker does not settle it.'
        - Smooth muscle markers are near-uniformly expressed in cellular leiomyoma (calponin and desmin
          in 100%), which is the more reliable direction of evidence.
      selected_evidence:
        snippet: "Concerning markers of endometrial stromal differentiation, the expression of \nCD10\
          \ was observed in 65.4% cases (42.2% with H-score > 50), and IFITM1 in 36.5% \ncases (1.9% with\
          \ H-score > 50)"
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
      context_paths:
