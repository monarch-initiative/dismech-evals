        description: 'With the HIF prolyl hydroxylases inhibited by fumarate, HIF-alpha escapes degradation
          and a hypoxia transcriptional programme runs in a normoxic cell. This is the FH subtype''s distinctive
          route to the tumor''s distorted, staghorn vasculature.

          Read this alongside the angiogenesis node, which records HIF-1-alpha as absent from uterine
          fibroids. The two are not in conflict but the boundary matters: that observation comes from
          unselected fibroids, which are overwhelmingly MED12- or HMGA2-driven, and it is what establishes
          that the common fibroid does NOT use the hypoxia/VEGF route. Pseudohypoxia is specific to the
          uncommon FH-deficient subtype, where it is driven by a metabolite rather than by low oxygen.
          A reader who took the pseudohypoxia claim to apply to fibroids generally would have it backwards.

          '
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: myometrial smooth muscle cell
          term:
            id: CL:0002366
            label: myometrial cell
      selected_evidence:
        snippet: This increases the levels of intracellular fumarate which inhibits the activity of hypoxia-inducible
          factor (HIF) prolyl hydroxylases, contributing to the accumulation of HIF-
        supports: SUPPORT
