  237cbc531e3f84df0aa76f087df74cc2436fb4290ac847c6c133208b8934f40f:
    claim:
      about:
        disease:
          name: Uterine Leiomyoma
          disease_term:
            preferred_term: uterine fibroid
            term:
              id: MONDO:0007886
              label: uterine corpus leiomyoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Pseudocapsule Angiogenesis and Venous Ectasia
        description: 'Fibroid vasculature is organized differently from that of a malignant solid tumor.
          The fibroid mass itself is poorly vascularized and is instead supplied by a highly vascularized
          pseudocapsule that develops in response to its growth and appears as a peripheral "ring of fire"
          on Doppler ultrasound. The angiogenic drive is attributed principally to the insulin-like growth
          factor system rather than to the HIF-1-alpha/VEGF axis of hypoxic tumors, and HIF-1-alpha has
          been reported absent from fibroids where it is readily demonstrable in leiomyosarcoma - which
          is what establishes that the common fibroid does not use the hypoxia route, and is not contradicted
          by the pseudohypoxia node, whose HIF stabilization is metabolite-driven and confined to the
          uncommon FH-deficient subtype. Separately, the growing mass raises interstitial pressure and
          obstructs venous drainage, enlarging the endometrial and myometrial venous lakes. Both the structurally
          deficient pseudocapsule vessels and the dilated venous lakes are proposed sources of the heavy
          bleeding, and which of them dominates is unsettled.

          One correction the source makes about its own history is worth keeping: the interstitial-pressure
          explanation for the enlarged venous lakes was later challenged, with growth factors rather than
          mechanical pressure held largely responsible for enlarging the veins. The pressure account is
          recorded here because the microradiographic observation of enlarged lakes stands; its mechanical
          explanation does not.

          '
        biological_scale: TISSUE
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: angiogenesis
          term:
            id: GO:0001525
            label: angiogenesis
          modifier: INCREASED
      selected_evidence:
        snippet: These also lead to downstream expression of angiogenic factors including IGF-1 and IGF-2,
          as opposed to the VEGF-driven mechanism found in the angiogenesis of hypoxic tumors. The resulting
          vasculature supplying the fibroid with nutrients and oxygen is highly irregular.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36303616
      reference_title: Uterine Fibroids (Leiomyomata) and Heavy Menstrual Bleeding.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Establishes both halves of this node''s angiogenic claim: the IGF-driven rather than
        VEGF-driven route, and the irregular vasculature that results.'
