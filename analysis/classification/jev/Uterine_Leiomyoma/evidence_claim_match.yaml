        name: Uterine leiomyosarcoma
        disease_term:
          preferred_term: uterine leiomyosarcoma
          term:
            id: MONDO:0016262
            label: leiomyosarcoma of the corpus uteri
        description: 'The differential that matters, because it cannot be resolved before resection. No
          imaging finding or biomarker reliably separates a benign leiomyoma from a leiomyosarcoma preoperatively,
          which is why a rapidly enlarging mass prompts evaluation and why morcellation of a presumed
          fibroid carries a dissemination risk.

          '
        distinguishing_features:
        - Histopathology of the resected specimen is definitive; nothing before resection is.
        - Molecular profiling may assist in the cellular and variant morphologies.
        - HIF-1-alpha is readily demonstrable in leiomyosarcoma but has been reported absent from leiomyoma,
          which is also why the two tumors' angiogenic mechanisms differ.
      selected_evidence:
        snippet: HIF-1α for example has been shown lacking in uterine fibroids, when it was readily shown
          in leiomyosarcomata
        supports: SUPPORT
