              label: uterine corpus leiomyoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: med12_mutation_growth_paradox
        kind: CONTROVERSY
        status: OPEN
        prompt: If MED12 exon-2 mutation is a gain-of-function driver present in most fibroids, why do
          MED12 wild-type tumors grow faster than mutant ones?
        attaches_to:
        - pathophysiology#Driver Mutation-Initiated Clonal Transformation
        - genetic#MED12 somatic exon-2 mutation
        rationale: 'The entry records MED12 mutation as a gain-of-function driver, which is what the review
          literature says, and that reading invites the inference that the mutation drives growth. A 44-tumor
          series reports the opposite for growth specifically: wild-type leiomyomas have higher growth
          potential and higher MED12-associated CDK8 kinase activity than mutant ones, and CDK8 inhibition
          suppresses wild-type cell growth in primary culture. One way to reconcile these is that the
          mutation is required for tumor initiation while wild-type tumors, once initiated by some other
          route, retain more intact Mediator-kinase output and therefore grow faster. That reconciliation
          is not established, and an entry that recorded only the gain-of-function label would hide the
          tension rather than resolve it.

          '
      selected_evidence:
        snippet: Of the 44 leiomyomas tested, 11 MED12 wild-type leiomyomas without preoperative GnRH
          agonist treatment had significantly higher CDK8 activity than nine GnRH agonist-treated MED12
          wild-type leiomyomas and 15 leiomyomas with MED12 mutations without GnRH agonist treatment.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41493967
      reference_title: Impact of MED12 mutation and CDK8 activity on uterine leiomyoma growth and response
        to gonadotropin-releasing hormone agonist treatment.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The measurement behind the controversy: CDK8 activity is highest in untreated wild-type
        tumors, lower in mutant ones.'
