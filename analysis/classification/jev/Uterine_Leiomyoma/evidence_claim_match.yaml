      assertion_type: Genetic
      assertion:
        name: MED12 somatic exon-2 mutation
        gene_term:
          preferred_term: MED12
          term:
            id: hgnc:11957
            label: MED12
        variant_origin: SOMATIC
        features: 'Recurrent somatic exon-2 (codon 44 region) point mutations in MED12 are the most common
          driver, present in ~50-80% of uterine fibroids (~77% in a large review). These gain-of-function
          mutations disrupt the CDK8/CDK19 Mediator kinase module, are more frequent in Black women, are
          commonly found even in small tumors, and associate with multiple rather than solitary fibroids.
          Note that the mutation is not simply growth-promoting: MED12 wild-type leiomyomas have a higher
          growth potential than mutant ones and show higher MED12-associated CDK8 kinase activity, which
          the entry records as an open question rather than smoothing over.

          '
      selected_evidence:
        snippet: "Recent studies have demonstrated that somatic MED12 mutations in exon 2 occur at \n\
          a frequency of up to 80% and have a functional role in leiomyoma pathogenesis."
        supports: SUPPORT
