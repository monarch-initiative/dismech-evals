        name: Oral GnRH Antagonist Therapy
        therapeutic_modality: SMALL_MOLECULE
        description: 'Oral GnRH antagonists (elagolix, relugolix, linzagolix) directly block pituitary
          GnRH receptors to suppress ovarian steroid production, reducing heavy menstrual bleeding in
          a uterus-sparing, reversible regimen, usually with steroid add-back to avoid the hypoestrogenic
          effects that limit GnRH agonists. Linzagolix is the one agent with a lower-dose arm usable without
          mandatory add-back. The effect is suppressive, not curative: symptoms recur relatively quickly
          after the drug is stopped, which is the argument the PRIMROSE withdrawal study makes for long-term
          continuation.

          '
        treatment_term:
