      assertion_type: ImagingFinding
      assertion:
        name: Peripheral "ring of fire" vascularity on Doppler
        modality: ULTRASOUND
        description: 'Colour Doppler shows flow concentrated at the rim of an intramural fibroid rather
          than through it, reflecting the vascularized pseudocapsule that supplies a tumor whose own mass
          is poorly vascularized. This is the imaging correlate of the pseudocapsule angiogenesis node.

          '
        phenotype_term:
          preferred_term: Uterine leiomyoma
          term:
            id: HP:0000131
            label: Uterine leiomyoma
      selected_evidence:
        snippet: While the fibroid mass itself is poorly vascularised, it can be surrounded by a highly
          vascularised pseudocapsule in intramural fibroids, a specialized layer of tissue between the
          tumor and the surrounding myometrium that contains the blood vessels needed to sustain the fibroid
          (81), which develops in response to the fibroid growth (82). This structure can be seen as a
          “ring of fire” in ultrasound Doppler imaging, and it is separated from the myometrium by a clear
          cleft, as observed in histological images.
        supports: SUPPORT
    origin:
      assertion_path: /imaging_findings/1
      evidence_path: /imaging_findings/1/evidence/0
