      assertion_type: Subtype
      assertion:
        name: MED12-mutant
        display_name: MED12-mutant leiomyoma
        description: 'The dominant molecular subtype, defined by a recurrent somatic exon-2 point mutation
          in MED12 disrupting the CDK8/CDK19 kinase module of the Mediator complex. These tumors tend
          to be multiple rather than solitary, are found even at small size, are more frequent in Black
          women, and carry a distinctive ECM-organization and Wnt/beta-catenin transcriptional program.
          Reported frequency spans 50-80% of tumors depending on cohort and detection method.

          '
        genes:
        - preferred_term: MED12
          term:
            id: hgnc:11957
            label: MED12
      selected_evidence:
        snippet: "Among the driver gene mutations identified in UFs, mutations \nin MED12, a component\
          \ of the cyclin-dependent kinase (CDK) Mediator module, are \nthe most common and observed in\
          \ 50-80% of UFs."
        supports: SUPPORT
