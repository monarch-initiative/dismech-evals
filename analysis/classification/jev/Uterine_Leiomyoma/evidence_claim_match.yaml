        name: Bulk Compression of Adjacent Pelvic Organs
        description: 'A fibroid large enough to enlarge and deform the uterus displaces the structures
          around it. Anterior and fundal tumors press on the bladder, producing urinary frequency and,
          when the ureters are involved, hydronephrosis; posterior tumors press on the rectum, producing
          constipation; a large fibroid can go further and cause urinary obstruction or, rarely, hydronephrosis.
          This is the one arm of the mechanism that is purely a consequence of volume and position: severity
          correlates with fibroid size, number and anatomical placement rather than with driver genotype,
          and the treatments that shrink or remove the tumor relieve it while the treatments that only
          control bleeding do not.

          '
        biological_scale: ORGANISM
      selected_evidence:
        snippet: The bulk growth of this extremely dense tissue leads an enlarged and deformed uterus
          and to some of the key symptoms associated with uterine fibroids in addition to HMB such as
          pressure symptoms, abdominal pain, and infertility
