      assertion:
        name: Chronic low vitamin D status
        description: 'Vitamin D deficiency is repeatedly associated with fibroid presence and size, and
          unlike most epidemiological risk factors it has a specific proposed mechanism at the initiating
          node rather than at the growth node: calcitriol acting through VDR supports the MRN-complex/ATM
          DNA-repair axis in myometrial stem cells, so deficiency plausibly permits the driver lesion
          to be acquired and retained. In vitro work shows vitamin D inhibiting fibroid growth through
          proliferation, ECM remodelling, DNA repair and apoptosis pathways; clinical studies support
          this only in part.

          '
        exposure_term:
          preferred_term: vitamin D deficiency
        effect: Risk factor for fibroid development and growth; adequate status is plausibly protective.
      selected_evidence:
        snippet: In recent years, epidemiological studies reported a vitamin D deficiency in patients
          with UFs raised interest in the potential biological effects of vitamin D supplementation.
        supports: SUPPORT
