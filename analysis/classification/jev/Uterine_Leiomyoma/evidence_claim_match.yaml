  22474223f14b5093cd19bfca327f89d0e5d2d091cdabdcc062ff5b4872ab5130:
    claim:
      about:
        disease:
          name: Uterine Leiomyoma
          disease_term:
            preferred_term: uterine fibroid
            term:
              id: MONDO:0007886
              label: uterine corpus leiomyoma
        context: []
      assertion_type: Phenotype
      assertion:
        category: Clinical
        name: Recurrent Pregnancy Loss
        description: 'Pregnancy loss in fibroid-complicated pregnancies. The cited meta-analysis reports
          miscarriage rather than recurrent miscarriage, and does not attribute it to cavity distortion,
          so neither qualifier is claimed here; the recurrent framing comes from the phenotype concept,
          not from this source. A meta-analysis of 24 studies found fibroids raised miscarriage risk in
          unadjusted analysis; after adjustment for confounders the significant obstetric associations
          were preterm birth, cesarean delivery, placenta previa, placental abruption, postpartum hemorrhage,
          intrauterine fetal death, breech presentation and preeclampsia, and miscarriage was not among
          them. Both results are recorded here because the distinction matters for how strongly this phenotype
          should be claimed.

          The ontology binding is deliberately omitted. HP:0200067 Recurrent spontaneous abortion means
          exactly this, but it sits under HP:0032443 (past medical history) rather than under HP:0000118
          (phenotypic abnormality), so it is not a member of the PhenotypeTerm dynamic enum; HP:0005268
          Miscarriage and HP:0003826 Stillbirth are both outside the enum root too, under the clinical-modifier
          branch. Binding a term that means something else would be worse than leaving it unbound, so
          the meaning is carried by preferred_term. Asherman_Syndrome records the same gap for the same
          term (issue #7837, gap 3).

          '
        phenotype_term:
          preferred_term: Recurrent spontaneous abortion
      selected_evidence:
        snippet: However, after adjusting for the potential factors, negative effects were only seen for
          preterm birth, cesarean delivery, placenta previa, placental abruption, PPH, intrauterine fetal
          death, breech presentation, and preeclampsia.
        supports: REFUTE
    origin:
