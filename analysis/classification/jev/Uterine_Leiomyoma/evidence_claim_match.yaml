  c44d79fec7a00122e672b1e255ec45241e0cacd36de61489c5173e97f13ead4c:
    claim:
      about:
        disease:
          name: Uterine Leiomyoma
          disease_term:
            preferred_term: uterine fibroid
            term:
              id: MONDO:0007886
              label: uterine corpus leiomyoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Endometrial Hemostatic Failure and Impaired Vessel Closure
        description: 'Fibroids do not bleed only by mechanics. Fibroid tissue secretes TGF-beta-3 in response
          to ovarian steroids, and TGF-beta-3 acts on the overlying endometrium to downregulate BMP receptor
          2 (which the source says is likely to cause defective decidualization) and to reduce expression
          of plasminogen activator inhibitor 1, antithrombin III and thrombomodulin, which the source
          says likely contributes to the bleeding. Both steps are hedged in the source and are hedged
          here. Note also that two of those three regulators are anticoagulants, so the net direction
          is an interpretation of the hemostatic outcome the source draws rather than a reading of each
          protein in isolation - the DECREASED modifier on the blood-coagulation process below records
          that net outcome, not a per-protein reading. The endometrium is therefore both less able to
          decidualize and less able to form and hold a hemostatic plug. This node is where the reproductive
          and the bleeding phenotypes share a mechanism.

          Scope note: the purely physical contributions to the bleeding - increased endometrial surface
          area, disordered myometrial contractility, and venous ectasia from compression - are real and
          are cited below, but they are properties of the tumor mass and belong to the Tumor Growth and
          Bulk Compression nodes. This node is the endometrial signalling arm, which is why it is tagged
          TISSUE.

          '
        biological_scale: TISSUE
        cell_types:
        - preferred_term: endometrial stromal cell
          term:
            id: CL:0002255
            label: stromal cell of endometrium
        biological_processes:
        - preferred_term: endometrial hemostatic plug formation
          term:
            id: GO:0007596
            label: blood coagulation
          modifier: DECREASED
        - preferred_term: endometrial decidualization
          term:
            id: GO:0046697
            label: decidualization
          modifier: DECREASED
      selected_evidence:
        snippet: TGF-β3 secreted by fibroids has been shown to induce BMP-2 resistance in endometrium
          by down-regulation of BMPR-2, likely causing defective endometrial decidualization
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36303616
