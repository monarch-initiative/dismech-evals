          causing heavy menstrual bleeding and consequent iron deficiency anemia. Bulk from larger tumors
          compresses adjacent pelvic organs (bladder, rectum), causing pressure symptoms, while distortion
          of the cavity and tubal ostia contributes to reproductive morbidity. Most affected women are
          asymptomatic: fibroids cause clinically significant disease in roughly a quarter of reproductive-age
          women overall, and affect quality of life in approximately 30% of cases.

          '
