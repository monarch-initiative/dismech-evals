  97b7c28e8810331ef2f1d5a6ad3197b2422071d66159c15c80cd51fbddaa0751:
    claim:
      about:
        disease:
          name: Uveal Coloboma-Cleft Lip and Palate-Intellectual Disability Syndrome
          disease_term:
            preferred_term: uveal coloboma-cleft lip and palate-intellectual disability
            term:
              id: MONDO:0007355
              label: uveal coloboma-cleft lip and palate-intellectual disability
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: yap1_haematuria_renal_basis_unknown
        prompt: What renal lesion produces the haematuria in YAP1-related syndromic coloboma, and does
          it carry a risk of progressive kidney disease?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Pleiotropic YAP1 Requirement Across Eye, Ear, Palate, and Kidney Primordia
        rationale: Haematuria is a recurrent feature of YAP1 loss-of-function families and prompted Holt
          et al. to look specifically for YAP1 expression in the developing kidney, which they found in
          renal tubules at CS22. But no renal biopsy, imaging, or longitudinal renal-function data have
          been published for any affected individual, so it is unknown whether the haematuria reflects
          a glomerular basement membrane defect, a tubular lesion, a structural malformation, or something
          benign. This matters clinically because it determines whether carriers need renal surveillance,
          and mechanistically because a glomerular versus tubular origin would point at different YAP1
          dependencies.
        proposed_experiments:
        - experiment_id: exp_yap1_renal_phenotyping
          name: Structured renal phenotyping of genotyped YAP1 carriers
          description: Perform urinalysis with phase-contrast microscopy for dysmorphic red cells, albumin:creatinine
            ratio, renal ultrasound, and eGFR in all molecularly confirmed carriers from reported YAP1
            families, with longitudinal follow-up in adults. Dysmorphic erythrocytes and albuminuria would
            indicate a glomerular origin; isolated isomorphic haematuria with normal albumin would favour
            a tubular or structural cause.
          decision_criterion: Presence of dysmorphic erythrocytes and/or albuminuria in a majority of
            carriers distinguishes a glomerular from a tubular or structural origin.
        - experiment_id: exp_yap1_conditional_kidney_deletion
          name: Compartment-specific conditional Yap1 deletion in mouse kidney
          description: Delete Yap1 conditionally in nephron progenitors versus differentiated tubular
            epithelium in mouse and assay for haematuria, glomerular basement-membrane ultrastructure,
            and tubular integrity, to localise the developmental compartment in which reduced YAP1 dose
            produces the renal phenotype.
          decision_criterion: Haematuria arising only in one compartment-specific deletion localises the
            YAP1 requirement to that compartment.
      selected_evidence:
        snippet: we also examined expression in the human embryonic kidney
        supports: SUPPORT
    origin:
