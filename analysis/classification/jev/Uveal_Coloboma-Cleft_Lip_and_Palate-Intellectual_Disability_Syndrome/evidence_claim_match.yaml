  5d8020497680a3489ea88e2f0f4c3f71d03312347aa35a8cc3e93705c945d464:
    claim:
      about:
        disease:
          name: Uveal Coloboma-Cleft Lip and Palate-Intellectual Disability Syndrome
          disease_term:
            preferred_term: uveal coloboma-cleft lip and palate-intellectual disability
            term:
              id: MONDO:0007355
              label: uveal coloboma-cleft lip and palate-intellectual disability
        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counseling
        description: 'The one intervention with disease-specific content in this entity. Counseling must
          convey a 50% per-conception transmission risk for a heterozygous carrier, but also that neither
          the presence nor the severity of expression can be predicted from the genotype: expressivity
          within the single defining pedigree ranges from a minor ocular sign to microphthalmia with clefting,
          hearing loss and learning difficulty, and YAP1 loss-of-function alleles have been transmitted
          by clinically unaffected carriers. Cascade testing of at-risk relatives should therefore be
          paired with ophthalmic examination rather than relied on alone.'
        therapeutic_modality: OTHER
        notes: 'Modality decided on the enum definition rather than on precedent. TherapeuticModalityEnum
          defines BEHAVIORAL as a "non-pharmacologic behavioral, physical, dietary, or lifestyle intervention";
          genetic counseling is none of those four — it is a risk-communication and decision-support service
          — so OTHER ("modality not covered by the above categories") is the accurate value. The KB is
          genuinely split on this: measured across kb/disorders/ on 2026-08-11 with this entry already
          changed, 578 treatments bind NCIT:C15240 — 57 tagged BEHAVIORAL, 38 OTHER, and 483 carrying
          no modality at all. (An earlier draft of this note recorded 58/37, which was the split BEFORE
          this entry was retagged: the note described the KB as it was before its own edit. Corrected,
          and date-stamped, because these counts drift with every entry that touches this term.) There
          is therefore no settled convention to defer to, and CLAUDE.md lists NCIT:C15240 among the generic
          action terms that need a per-entry look rather than an ID-based rule. Flagged here because a
          KB-wide reconciliation of this term is worth doing on its own.'
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: Considerable variability in expression of the gene is apparent
        supports: SUPPORT
