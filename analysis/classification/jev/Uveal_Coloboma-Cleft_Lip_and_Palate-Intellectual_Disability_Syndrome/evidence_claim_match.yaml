        context: []
      assertion_type: Variant
      assertion:
        name: NM_001130145:c.1066G>T (p.Glu356*)
        description: The cosegregating heterozygous nonsense allele identified in the syndromic family
          (family 132) that defines this entity. It lies downstream of both the canonical and the intron-1
          alternative transcription start sites and is therefore predicted to cause nonsense-mediated
          decay of transcripts from either, producing true YAP1 haploinsufficiency.
        gene:
          preferred_term: YAP1
          term:
            id: hgnc:16262
            label: YAP1
        type: nonsense
        clinical_significance: PATHOGENIC
        functional_effects:
        - function: LOSS_OF_FUNCTION
          description: 'A premature termination codon downstream of both transcription start sites, predicted
            to clear the mutant transcript by nonsense-mediated decay and so to halve the functional YAP1
            dose. Loss of function, not dominant-negative or gain of function: the independent de novo
            YAP1 frameshift case is argued on haploinsufficiency, and no cached source proposes a dominant-negative
            mechanism for any YAP1 coloboma allele.'
      selected_evidence:
        snippet: The c. 1066G>T mutation in family 132 should result in NMD in transcripts from either
          TSS.
        supports: SUPPORT
