      explanation: 'Orphanet builds its definition around uveal coloboma — the entity is "characterized
        by" it, and every other feature is qualified as "variably associated" — which supports coloboma
        as the cardinal, diagnostic feature (hence diagnostic: true). It does NOT support a frequency
        band, and none is assigned. An earlier draft mapped "characterized by" to VERY_FREQUENT as hallmark
        wording under Pattern C; that was withdrawn on audit, because "characterized by" is the genus-differentia
        opening of essentially every Orphanet definition rather than one of the frequency terms in the
        Pattern C table, and because it makes the same comparative contrast (coloboma versus the variably
        associated features) that made "most constant feature" unusable for a band. No numerator/denominator
        for the coloboma is published in any cached source, so per docs/frequency-evidence-guidelines.md
        the frequency is omitted: a missing frequency is honest, a fabricated one is not.'
