        context: []
      assertion_type: Genetic
      assertion:
        name: YAP1
        gene_term:
          preferred_term: YAP1
          term:
            id: hgnc:16262
            label: YAP1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        association: Heterozygous loss-of-function (nonsense and frameshift) variants in YAP1 cause dominantly
          inherited optic fissure closure defects. The syndromic form corresponding to this entity segregates
          the nonsense allele c.1066G>T (p.Glu356*), predicted to trigger nonsense-mediated decay in transcripts
          from both the canonical and the intron-1 alternative transcription start site.
        notes: 'The causal gene IS established for this entity — MONDO:0007355 carries the YAP1 gene association
          (RO:0004003 HGNC:16262), and the defining pedigree is the syndromic family (family 132) of Williamson
          et al. 2014. No second gene has been implicated, and no modifier gene, founder allele, epigenetic
          signature, or recurrent rearrangement is known. Genotype-phenotype correlation within YAP1 remains
          incomplete: the isolated-coloboma family carried c.370C>T (p.Arg124*), and later reported alleles
          include a non-NMD frameshift (c.1160delA, p.Asn387Thrfs*16) inherited from an asymptomatic father
          and a de novo c.178dupG (p.Asp60GlyfsTer52). Missense alleles reported in YAP1 coloboma families
          should not be assumed pathogenic without segregation and ACMG/AMP assessment.'
      selected_evidence:
        snippet: Exome sequence analysis of affected individuals from two families with autosomal-dominant
          inheritance of coloboma identified two different cosegregating heterozygous nonsense mutations
        supports: SUPPORT
