      assertion_type: Pathophysiology
      assertion:
        name: Pleiotropic YAP1 Requirement Across Eye, Ear, Palate, and Kidney Primordia
        role: intermediate
        biological_scale: TISSUE
        description: 'This is the node that explains why the syndrome is a syndrome, and it carries the
          shared developmental mechanism the eye and the face have in common. Whole-mount in situ hybridisation
          in mouse embryos localises Yap1 to the eye, brain, and the fusing facial processes; nonradioactive
          in situ hybridisation on staged human embryos localises YAP1 to the retina, the otic vesicle
          (primitive ear), the primordium of the lateral palatine process, the neural tube, and the renal
          tubules. Optic fissure closure and palatal/facial process fusion are both epithelial fusion
          events occurring in overlapping embryonic windows, and both depend on the same dosage-sensitive
          Hippo effector — so a single haploinsufficient allele perturbs both. The correspondence of this
          expression domain to the clinical phenotype is close to one-to-one: retina to coloboma, otic
          vesicle to sensorineural hearing loss, lateral palatine process to cleft lip/palate, neural
          tube to the discussed neural tube defect, and renal tubules to the haematuria.'
        gene:
          preferred_term: YAP1
          term:
            id: hgnc:16262
            label: YAP1
        locations:
        - preferred_term: optic fissure
          term:
            id: UBERON:0005412
            label: optic fissure
        - preferred_term: primordium of the lateral palatine process
          term:
            id: UBERON:0005871
            label: palatine process of maxilla
        - preferred_term: otic vesicle
          term:
            id: UBERON:0003051
            label: ear vesicle
        - preferred_term: neural tube
          term:
            id: UBERON:0001049
            label: neural tube
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: whole-mount in situ hybridization in mouse embryos has shown that Yap1 is strongly expressed
          in the eye, brain, and fusing facial processes
        supports: SUPPORT
