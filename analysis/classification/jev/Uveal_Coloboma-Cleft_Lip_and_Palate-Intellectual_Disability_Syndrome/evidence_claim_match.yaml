  a4ce80b2bfa2d1f2cb8ec03a8c6763cfe50c75d8dc5ca472f2f91ffdd86450d0:
    claim:
      about:
        disease:
          name: Uveal Coloboma-Cleft Lip and Palate-Intellectual Disability Syndrome
          disease_term:
            preferred_term: uveal coloboma-cleft lip and palate-intellectual disability
            term:
              id: MONDO:0007355
              label: uveal coloboma-cleft lip and palate-intellectual disability
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Zebrafish yap1 mutant, alone and with wwtr1 (taz)
        species: Danio rerio
        genotype: yap1 (yap) loss-of-function mutant, alone and combined with wwtr1 (taz)
        publication: PMID:26209646
        description: Zebrafish yap1 mutants lack a subset of retinal pigment epithelium and/or develop
          coloboma, and combined loss of yap and taz abolishes the ability of optic vesicle progenitors
          to form RPE at all. This is the closest available model of the ocular arm of the syndrome and
          the source of the instructive (not merely permissive) role of Yap/Taz-Tead in RPE fate. It does
          not model the clefting, hearing loss, or intellectual disability arms.
        associated_phenotypes:
        - Coloboma
        - Loss of retinal pigment epithelium
        modeled_mechanisms:
        - target: Reduced YAP-TEAD Transcriptional Output in the Hippo Pathway
          relationship: PERTURBS
          fidelity: MODERATE
          description: Genetic removal of yap1, and of yap1 together with wwtr1, lowers Yap/Taz-Tead output
            in optic vesicle progenitors — the animal counterpart of the reduced co-activator dose imposed
            by human YAP1 haploinsufficiency.
          limitations: Homozygous null and double-mutant genotypes model a far deeper loss of output than
            a human heterozygous nonsense allele, so the model addresses the direction of the lesion rather
            than its dose.
          readouts:
          - name: Ability of optic vesicle progenitors to form RPE
            target: Reduced YAP-TEAD Transcriptional Output in the Hippo Pathway
            direction: ABOLISHED
            interpretation: 'The functional consequence of removing that output: complete loss of RPE-forming
              capacity when both Yap and Taz are absent establishes the requirement as instructive, not
              merely permissive. Note this measures the capacity the node''s output confers, not a direct
              measurement of transcriptional output in the mutant.'
        - target: Failure of Optic Fissure Closure
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: yap1 mutants develop coloboma — the optic fissure closure defect itself — alongside
            the RPE deficiency proposed to underlie it.
          limitations: 'The zygosity mismatch bites hardest here, on the stronger claim: the coloboma
            is scored in homozygous yap1 nulls, whereas the human disorder is caused by a heterozygous
            nonsense allele, so the model recapitulates the lesion''s direction and not its dose. Zebrafish
            ocular morphogenesis is also not identical to the human weeks-5-to-7 fissure closure window,
            and the model does not reproduce the clefting, hearing loss, haematuria, or intellectual disability
            arms of the syndrome.'
          readouts:
          - name: Coloboma incidence in yap1 mutants
            target: Failure of Optic Fissure Closure
            direction: INCREASED
            interpretation: Coloboma arising on loss of yap1 is the model's direct correlate of the human
              optic fissure closure defect.
          - name: Retinal pigment epithelium cell number in yap1 mutants
            target: Failure of Optic Fissure Closure
            direction: DECREASED
            interpretation: The RPE deficiency that accompanies the coloboma, recorded separately because
              it moves in the opposite direction from coloboma incidence and cannot share a single direction
              value with it.
      selected_evidence:
        snippet: yap (yap1) mutants lack a subset of RPE cells and/or exhibit coloboma.
        supports: SUPPORT
