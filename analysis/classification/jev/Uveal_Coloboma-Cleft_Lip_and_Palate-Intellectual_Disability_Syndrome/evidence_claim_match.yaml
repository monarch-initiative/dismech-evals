        description: A candidate explanation for why one YAP1 nonsense family is syndromic and the other
          is eye-only. YAP1 has an alternative transcription start site in intron 1, widely used in human
          and mouse development, whose transcripts initiate at codon Met179. The isolated-coloboma allele
          c.370C>T (p.Arg124*) falls in the 5' UTR of those alternative transcripts and so cannot trigger
          nonsense-mediated decay in them, leaving a partially rescuing pool of protein; the syndromic
          allele c.1066G>T (p.Glu356*) lies downstream of both start sites and is predicted to cause NMD
          of transcripts from either. On this model the syndromic multisystem phenotype of this entity
          reflects the absence of that alternative-transcript rescue. The model is proposed rather than
          experimentally demonstrated in patient tissue, and other alleles complicate it — the c.1160delA
          frameshift escapes NMD altogether yet was inherited from an asymptomatic father.
        gene:
          preferred_term: YAP1
          term:
            id: hgnc:16262
            label: YAP1
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: Amelioration of the phenotype by the alternative transcripts provides a plausible explanation
          for the phenotypic differences between the families.
        supports: SUPPORT
