      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: alternative_tss_severity_modulation
        hypothesis_label: Position of the YAP1 nonsense allele relative to the intron-1 alternative transcription
          start site determines whether the phenotype is isolated coloboma or the full multisystem syndrome
        status: EMERGING
        description: 'Williamson et al. propose that the intron-1 alternative transcription start site
          of YAP1 (initiating at Met179) supplies a partially functional protein pool when a nonsense
          allele falls upstream of it, ameliorating the phenotype to eye-only disease; alleles downstream
          of both start sites cause NMD of all transcripts and produce the syndromic phenotype of this
          entity. The hypothesis is attractive because it would explain, from allele position alone, why
          two families with the same class of YAP1 lesion differ so sharply. It is not established: it
          rests on predicted rather than measured NMD in the relevant tissues, and a later NMD-escaping
          frameshift allele was carried by an asymptomatic father, which the model does not readily accommodate.
          Causal edges belonging to this model opt in via the alternative_tss_severity_modulation hypothesis
          group.'
      selected_evidence:
        snippet: RT-PCR showed that an alternative transcription start site (TSS) in intron 1 of YAP1
          and Yap1 is widely used in human and mouse development, respectively.
        supports: SUPPORT
