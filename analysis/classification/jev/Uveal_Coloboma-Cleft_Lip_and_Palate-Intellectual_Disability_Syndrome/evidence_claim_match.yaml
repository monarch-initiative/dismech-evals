            term:
              id: MONDO:0007355
              label: uveal coloboma-cleft lip and palate-intellectual disability
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: yap1_single_family_entity_boundary
        prompt: Is uveal coloboma-cleft lip and palate-intellectual disability a distinct nosological
          entity, or the syndromic tail of a single YAP1-related developmental eye disorder spectrum?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Alternative Transcription Start Site Modulation of Phenotype Severity
        rationale: MONDO:0007355 / OMIM:120433 / ORPHA:1473 describe an entity resting on a single pedigree.
          The same gene, with the same class of lesion, produces isolated non-syndromic coloboma in a
          second family and in singleton cases. Whether the syndromic label names a real biological subdivision
          (as the alternative-TSS model would predict) or simply the most severely expressed end of one
          allelic spectrum cannot be settled without further syndromic families. Until then, curators
          should be careful not to import generic coloboma or generic clefting literature into this entry,
          and should not treat the syndrome boundary as mechanistically validated.
        proposed_experiments:
        - experiment_id: exp_yap1_allele_position_genotype_phenotype
          name: Allele-position versus extraocular-phenotype audit across YAP1 carriers
          description: Assemble every published and diagnostic-laboratory YAP1 loss-of-function carrier,
            annotate each allele by position relative to the intron-1 alternative transcription start
            site, and test whether downstream alleles (those predicted to trigger NMD in both transcript
            classes) are enriched for extraocular features relative to upstream alleles. Pair this with
            quantitative allele-specific expression of canonical and alternative YAP1 transcripts in accessible
            patient tissue.
          decision_criterion: Enrichment of extraocular features among alleles downstream of the alternative
            TSS would support a real syndromic/isolated subdivision; absence of enrichment would favour
            a single spectrum with stochastic expressivity.
      selected_evidence:
        snippet: The phenotypes of the affected families differed in that one included no extraocular
          features and the other manifested with highly variable multisystem involvement
        supports: SUPPORT
