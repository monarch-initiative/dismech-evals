          bilateral, and particularly with clefting, hearing loss, developmental impairment, or haematuria
          in a dominant pedigree) and confirming a heterozygous YAP1 loss-of-function variant by exome/genome
          sequencing or a developmental-eye-disorder panel that includes YAP1. Segregation analysis matters
          because YAP1 alleles show incomplete penetrance, so an unaffected parent may carry the variant.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: Whole-genome sequencing of the coding regions and intron-exon boundaries confirmed a
          mutation in the proband. These genetic findings were verified using the Sanger method of DNA
          sequencing.
