            term:
              id: MONDO:0007355
              label: uveal coloboma-cleft lip and palate-intellectual disability
        context:
        - path: /animal_models/0
          value:
            name: Zebrafish yap1 mutant, alone and with wwtr1 (taz)
            species: Danio rerio
            genotype: yap1 (yap) loss-of-function mutant, alone and combined with wwtr1 (taz)
            publication: PMID:26209646
            description: Zebrafish yap1 mutants lack a subset of retinal pigment epithelium and/or develop
              coloboma, and combined loss of yap and taz abolishes the ability of optic vesicle progenitors
              to form RPE at all. This is the closest available model of the ocular arm of the syndrome
              and the source of the instructive (not merely permissive) role of Yap/Taz-Tead in RPE fate.
              It does not model the clefting, hearing loss, or intellectual disability arms.
            associated_phenotypes:
            - Coloboma
            - Loss of retinal pigment epithelium
          role: ancestor
        - path: /animal_models/0/modeled_mechanisms/1
          value:
            target: Failure of Optic Fissure Closure
            relationship: RECAPITULATES
            fidelity: MODERATE
            description: yap1 mutants develop coloboma — the optic fissure closure defect itself — alongside
              the RPE deficiency proposed to underlie it.
            limitations: 'The zygosity mismatch bites hardest here, on the stronger claim: the coloboma
              is scored in homozygous yap1 nulls, whereas the human disorder is caused by a heterozygous
              nonsense allele, so the model recapitulates the lesion''s direction and not its dose. Zebrafish
              ocular morphogenesis is also not identical to the human weeks-5-to-7 fissure closure window,
              and the model does not reproduce the clefting, hearing loss, haematuria, or intellectual
              disability arms of the syndrome.'
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Coloboma incidence in yap1 mutants
        target: Failure of Optic Fissure Closure
        direction: INCREASED
        interpretation: Coloboma arising on loss of yap1 is the model's direct correlate of the human
          optic fissure closure defect.
      selected_evidence:
        snippet: yap (yap1) mutants lack a subset of RPE cells and/or exhibit coloboma.
        supports: SUPPORT
