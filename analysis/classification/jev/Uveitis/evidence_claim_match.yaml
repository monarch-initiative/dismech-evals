              label: uveitis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Autoreactive Th1/Th17 T Cell Priming and Uveal Infiltration
        biological_scale: CELLULAR
        description: Genetic susceptibility (HLA class I/II alleles and peptide-trimming enzymes such
          as ERAP1) shapes antigen presentation and lowers the activation threshold for autoreactive T
          cells directed against ocular or cross-reactive antigens. These T cells are primed toward Th1/Th17
          phenotypes in draining lymphoid tissue, then infiltrate the eye where they are restimulated
          by resident microglia and recruited macrophages. This is the mechanism underlying HLA-B27-associated
          and juvenile idiopathic arthritis-associated anterior uveitis and contributes to Behcet's disease-
          and Vogt-Koyanagi-Harada disease-associated panuveitis. Experimental autoimmune uveitis (EAU)
          models in rodents are the primary source of mechanistic detail for this pathway.
        cell_types:
        - preferred_term: CD4-positive, alpha-beta T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
        - preferred_term: T-helper 17 cell
          term:
            id: CL:0000899
            label: T-helper 17 cell
        - preferred_term: microglial cell
          term:
            id: CL:0000129
            label: microglial cell
        biological_processes:
        - preferred_term: T-helper 1 type immune response
          modifier: INCREASED
          term:
            id: GO:0042088
            label: T-helper 1 type immune response
        - preferred_term: T-helper 17 type immune response
          modifier: INCREASED
          term:
            id: GO:0072538
            label: T-helper 17 type immune response
      selected_evidence:
        snippet: Th17 cells elicit EAU, can be found in uveitic eyes along with Th1 cells, and are dominant
          in some types of EAU. In other types of EAU, Th1 cells have a dominant role.
        supports: SUPPORT
    origin:
