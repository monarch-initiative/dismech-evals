      assertion_type: Pathophysiology
      assertion:
        name: Breakdown of Ocular Immune Privilege
        biological_scale: TISSUE
        description: The eye is normally shielded from systemic immunity by physical barriers (blood-aqueous
          and blood-retinal), a locally immunosuppressive microenvironment, and tolerance circuits such
          as anterior chamber-associated immune deviation. Non-infectious (autoimmune) uveitis arises
          when these layered controls fail, permitting autoreactive lymphocyte access to intraocular antigens.
          This node begins the autoimmune arm of uveitis pathogenesis, modeled separately from the infectious
          arm below.
        biological_processes:
        - preferred_term: establishment of blood-retinal barrier
          modifier: DECREASED
          term:
            id: GO:1990963
            label: establishment of blood-retinal barrier
        notes: GO:1990963 is a developmental-process term (establishment, not maintenance) but is the
          only blood-retinal-barrier term in GO — there is no maintenance analogue to GO:0035633 (maintenance
          of blood-brain barrier). Used deliberately with DECREASED to represent adult barrier breakdown;
          do not re-litigate this without a better term becoming available.
      selected_evidence:
        snippet: 'Layered mechanisms normally restrain inflammation: physical barriers (blood-aqueous
          and blood-retina), a locally immunosuppressive milieu, and systemic tolerance circuits such
          as anterior chamber-associated immune deviation.'
        supports: SUPPORT
    origin:
