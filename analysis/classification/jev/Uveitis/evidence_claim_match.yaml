      assertion_type: Pathophysiology
      assertion:
        name: Ocular Pathogen Invasion or Reactivation
        biological_scale: TISSUE
        description: 'Infectious uveitis is triggered by direct invasion or reactivation of an infectious
          agent within the eye, mechanistically distinct from the autoimmune arm above. The responsible
          organism differs by anatomic class: herpesviruses (herpes simplex virus, varicella zoster virus)
          predominate in infectious anterior uveitis; Toxoplasma gondii, cytomegalovirus, and Mycobacterium
          tuberculosis predominate in infectious posterior uveitis and panuveitis. This node begins the
          infectious arm of uveitis pathogenesis and is modeled as a separate causal chain rather than
          merged with the autoimmune arm.'
      selected_evidence:
        snippet: Infectious uveitis reflects direct intraocular infection or reactivation.
        supports: SUPPORT
