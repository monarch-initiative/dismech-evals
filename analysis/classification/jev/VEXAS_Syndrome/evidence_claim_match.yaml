      assertion:
        discussion_id: vexas_model_human_fidelity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Multi-Organ Inflammation
        prompt: 'Do existing zebrafish and mouse Uba1-perturbation models faithfully reproduce the full
          multi-organ, relapsing human VEXAS syndrome (chondritis, neutrophilic skin disease, vacuolated
          marrow precursors, and hematopoietic dysfunction), or only its molecular/inflammatory arm?

          '
        rationale: 'The curated zebrafish knockout reproduces systemic inflammation, and a 2025 base-edited
          humanized HSPC model recapitulates proteostatic, cytologic, senescence, hematologic, and inflammatory
          hallmarks. Whether available models reproduce the full relapsing multi-organ clinical syndrome
          remains unresolved.

          '
        proposed_experiments:
        - experiment_id: vexas_humanized_met41_mouse
          name: Humanized hematopoietic-restricted somatic Met41 mouse model
          description: 'Engineer humanized, hematopoietic-restricted somatic Met41 mouse models with age-dependent
            clonal acquisition and assess multi-organ phenotype recapitulation including marrow precursor
            vacuolization and independently classified MDS emergence.

            '
      selected_evidence:
        snippet: Knockout of the cytoplasmic UBA1 isoform homologue in zebrafish caused systemic inflammation.
        supports: SUPPORT
