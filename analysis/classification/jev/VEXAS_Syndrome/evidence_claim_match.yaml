      assertion_type: Pathophysiology
      assertion:
        name: Emerging Non-Met41 UBA1 Enzymatic Dysfunction
        mechanism_confidence: PROVISIONAL
        description: 'Recurrent, functionally defective non-Met41 UBA1 variants have been reported in
          hematologic cohorts. Unlike canonical p.Met41 variants, they can reduce the activity of both
          nuclear and cytoplasmic UBA1 isoforms and are associated with distinct hematologic and biochemical
          phenotypes. Their relationship to the classic inflammatory VEXAS phenotype is variable and remains
          under definition.

          '
        biological_processes:
        - preferred_term: Protein ubiquitination
          term:
            id: GO:0016567
            label: protein ubiquitination
          modifier: DECREASED
        notes: 'This provisional branch intentionally has no downstream inflammatory edge: the cited study
          establishes enzymatic dysfunction and a distinct hematologic spectrum but does not show that
          every functional non-Met41 variant converges on classic VEXAS inflammation.

          '
      selected_evidence:
        snippet: Canonical pathogenic mutations at UBA1 p.Met41 (M41) lead to the loss of the cytoplasmic
          isoform (UBA1b), while non-canonical mutations outside of M41 (non-M41) result in reduced activity
          of both nuclear and cytoplasmic isoforms.
        supports: SUPPORT
    origin:
