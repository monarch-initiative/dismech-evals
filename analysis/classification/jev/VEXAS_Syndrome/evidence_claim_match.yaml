          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Monoclonal Gammopathy of Undetermined Significance
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: 'A plasma-cell clone arising against the background of the disordered, chronically
          inflamed UBA1-mutant marrow. Grouped under this node with MDS because both are clonal haematologic
          complications of the same compartment, and separated from the inflammatory arm because neither
          is a manifestation of the multi-organ inflammation.

          The lineage does not line up, and that is worth stating rather than glossing: this node is myeloid-skewed,
          while a monoclonal gammopathy is B-lineage. The UBA1 mutation in VEXAS is myeloid-restricted,
          so the plasma-cell clone is unlikely to carry it. Candidate explanations — that chronic inflammatory
          drive in the marrow selects for a plasma-cell clone, or that the two are independent age-associated
          clonal processes in the same patients — are not distinguished by anything cited here, which
          is why the link is INDIRECT_UNKNOWN_INTERMEDIATES.'
      selected_evidence:
        snippet: Hematologic involvement includes macrocytic anemia, myelodysplastic syndrome (MDS), thrombocytopenia,
          monoclonal gammopathy
        supports: SUPPORT
