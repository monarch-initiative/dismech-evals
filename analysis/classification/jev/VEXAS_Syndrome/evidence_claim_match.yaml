            term:
              id: MONDO:0026777
              label: VEXAS syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Canonical p.Met41 UBA1b Loss and Reduced Ubiquitylation
        description: 'Mutations at p.Met41 abolish initiation of the canonical cytoplasmic UBA1 isoform
          (UBA1b) and force expression of a novel, catalytically impaired isoform initiated at a downstream
          methionine (p.Met67). The net effect is a reduction in cytoplasmic ubiquitylation. The level
          of residual UBA1b translation is genotype-dependent and tracks with disease severity and survival.

          '
        biological_processes:
        - preferred_term: Protein ubiquitination
          term:
            id: GO:0016567
            label: protein ubiquitination
          modifier: DECREASED
      selected_evidence:
        snippet: Using in vitro models and patient-derived cells, we demonstrate that p.Met41Val variant
          supports less UBA1b translation than either p.Met41Leu or p.Met41Thr, providing a molecular
          rationale for decreased survival.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35793467
      reference_title: Translation of cytoplasmic UBA1 contributes to VEXAS syndrome pathogenesis.
      evidence_source: IN_VITRO
      explanation: 'Shows that residual cytoplasmic UBA1b translation is genotype-dependent and provides
        a molecular rationale for the observed survival association.

        '
