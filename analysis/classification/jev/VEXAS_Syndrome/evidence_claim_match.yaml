        description: 'The founding lesion of VEXAS is an acquired (post-zygotic, mosaic) somatic pathogenic
          variant in UBA1 within the hematopoietic stem and progenitor-cell compartment. Variants affecting
          methionine-41 (p.Met41) predominate, but pathogenic splice-site and selected non-Met41 variants
          broaden the molecular spectrum. Mutant cells are enriched in the myeloid compartment; in the
          original cohort, they were not detected in lymphocytes or fibroblasts.

          '
        cell_types:
        - preferred_term: Hematopoietic stem cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        genes:
        - preferred_term: UBA1
          term:
            id: hgnc:12469
            label: UBA1
      selected_evidence:
        snippet: We identified 25 men with somatic mutations affecting methionine-41 (p.Met41) in UBA1,
          the major E1 enzyme that initiates ubiquitylation.
        supports: SUPPORT
