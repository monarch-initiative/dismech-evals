              label: VEXAS syndrome
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: IUISAssignment
      assertion:
        classification_value: phenocopy of IEI
        notes: 'IUIS 2022 phenotypic classification of inborn errors of immunity (Tangye et al., PMID:35748970),
          Table 10 "Phenocopies of inborn errors of immunity", first section, "Associated with somatic
          mutations". VEXAS is one of the three entities new to Table 10 in the 2022 update, added on
          the strength of the UBA1 somatic-mutation report. The placement is the whole point of the disease:
          the lesion is acquired postzygotically in haematopoietic progenitors rather than inherited in
          the germline, so it produces an inborn-error phenotype without being an inborn error. There
          is no germline counterpart entry in dismech for this to be confused with, which is why the value
          sits on the entry itself rather than on a subtype. Note also that VEXAS involves a dysplastic
          marrow, so it may look like a Table 9 candidate; it is not in Table 9, and iuis_category is
          single-valued in any case.'
      selected_evidence:
        snippet: VEXAS (vacuoles, E1 enzyme, X-linked, autoinflammatory, somatic) syndrome Somatic mutation
          in UBA1
        supports: SUPPORT
    origin:
      assertion_path: /classifications/iuis_category
      evidence_path: /classifications/iuis_category/evidence/0
      context_paths:
