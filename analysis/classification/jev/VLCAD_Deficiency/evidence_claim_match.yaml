            as "at or above", which the half-open band reproduces exactly. The same paper records that
            the Dutch referral cut-off was later lowered to 0.6 umol/L (the introduction dates the reduction
            to 2010, the results say "adopted 2013"); that later value is not banded here because the
            study''s sensitivity figures were computed against 0.8. Screening cut-offs differ by programme;
            this band records the Dutch one, not a universal threshold.'
          interpretation_bands:
          - name: Screen negative
            upper_bound: 0.8
            unit: umol/L
            abnormal_flag: NORMAL
          - name: Screen positive
