  cf292bfea0acfc61aecb4fd2ccf7a1438be942422e1966a5da9c6794d2c4ad0b:
    claim:
      about:
        disease:
          name: Very Long-Chain Acyl-CoA Dehydrogenase Deficiency
          disease_term:
            preferred_term: very long chain acyl-CoA dehydrogenase deficiency
            term:
              id: MONDO:0008723
              label: very long chain acyl-CoA dehydrogenase deficiency
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Newborn bloodspot screening
        diagnosis_term:
          preferred_term: newborn screening
          term:
            id: NCIT:C81178
            label: Newborn Screening
        description: Tandem-mass-spectrometry newborn screening uses the long-chain acylcarnitine profile,
          particularly C14:1, to identify infants who require confirmatory biochemical and molecular testing.
          A screening result alone is not diagnostic. Several programmes read C14:1 together with its
          ratio to acetylcarnitine (C14:1/C2), which the Dutch programme found more sensitive than C14:1
          alone at the cost of a lower positive predictive value.
        results: Abnormal long-chain acylcarnitine pattern with elevated C14:1.
        measurements:
        - preferred_term: tetradecenoylcarnitine (C14:1), DBS
          term:
            id: LOINC:53191-3
            label: Tetradecenoylcarnitine (C14:1) [Moles/volume] in DBS
        - preferred_term: C14:1/C2 acylcarnitine ratio, DBS
          term:
            id: LOINC:53193-9
            label: Tetradecenoylcarnitine (C14:1)/Acetylcarnitine (C2) [Molar ratio] in DBS
        reference_ranges:
        - loinc_term:
            id: LOINC:53191-3
            label: Tetradecenoylcarnitine (C14:1) [Moles/volume] in DBS
          unit: umol/L
          population: newborn screening, Dutch NBS programme, October 2007-2010
          notes: 'Source wording: "Based solely on the C14:1 levels (cutoff ≥0.8 μmol/L), six newborns
            with VLCADD had been identified through NBS during this period." The source states the cut-off
            as "at or above", which the half-open band reproduces exactly. The same paper records that
            the Dutch referral cut-off was later lowered to 0.6 umol/L (the introduction dates the reduction
            to 2010, the results say "adopted 2013"); that later value is not banded here because the
            study''s sensitivity figures were computed against 0.8. Screening cut-offs differ by programme;
            this band records the Dutch one, not a universal threshold.'
          interpretation_bands:
          - name: Screen negative
            upper_bound: 0.8
            unit: umol/L
            abnormal_flag: NORMAL
          - name: Screen positive
            lower_bound: 0.8
            unit: umol/L
            abnormal_flag: HIGH
            interpretation: C14:1 at or above the programme cut-off was a presumptive positive screen
              for VLCAD deficiency and led to referral for confirmatory acylcarnitine, enzyme or ACADVL
              testing.
        - loinc_term:
            id: LOINC:53191-3
            label: Tetradecenoylcarnitine (C14:1) [Moles/volume] in DBS
          unit: umol/L
          population: newborn screening, New Zealand NBS programme, births 2006-2013
          notes: 'Source wording: "below the NZ C14:1 notification cut-off of 2.5 μmol/L". The source
            does not say whether a value of exactly 2.5 is notified; the half-open band places 2.5 itself
            in the positive tier. Recorded as a second programme''s cut-off to make the between-programme
            spread visible: it is about three times the Dutch value, in a population where elevated C14:1
            is common and largely attributable to the ACADVL c.1226C>T variant.'
          interpretation_bands:
          - name: Below notification cut-off
            upper_bound: 2.5
            unit: umol/L
            abnormal_flag: NORMAL
            interpretation: Values between 0.9 and 2.4 umol/L were not notified; the cited follow-up found
              no excess of clinically significant childhood disease in that group.
          - name: Notified (screen positive)
            lower_bound: 2.5
            unit: umol/L
            abnormal_flag: HIGH
        - loinc_term:
            id: LOINC:53193-9
            label: Tetradecenoylcarnitine (C14:1)/Acetylcarnitine (C2) [Molar ratio] in DBS
          population: newborn screening, Dutch NBS programme, retrospective evaluation of October 2007-2010
            blood spots
          notes: 'Source wording: "Retrospective analysis based on the C14:1/C2 ratio with a cutoff of
            ≥0.020 identified an additional five children with known ACADVL mutations and low enzymatic
            activity." The ratio is dimensionless, so no unit is given. The source also evaluated 0.023,
            at which sensitivity stayed at 93% and positive predictive value rose to 37%; the band records
            the 0.020 value the retrospective selection used, and the paper reports the ratio as subsequently
            added to the Dutch programme as a primary marker without stating the adopted value.'
          interpretation_bands:
          - name: Below ratio cut-off
            upper_bound: 0.02
            abnormal_flag: NORMAL
          - name: At or above ratio cut-off
            lower_bound: 0.02
            abnormal_flag: HIGH
            interpretation: A C14:1/C2 ratio at or above 0.020 selected blood spots for ACADVL sequencing
              in the retrospective study and identified biallelic cases missed by C14:1 alone.
        notes: LOINC codes and labels were read from the Monarch KG (biolink:ClinicalMeasurement nodes)
          and seeded into cache/loinc/terms.csv by scripts/seed_loinc_cache.sh. The quantitative method-less
          DBS codes exist for both C14:1 and the C14:1/C2 ratio, so no method-specific code was needed;
          the dried blood spot is intrinsic to this test, which is why the DBS codes rather than the C14:1
          Part (LOINC:LP19322-4) are bound here. The biochemical Tetradecenoylcarnitine (C14:1) marker
          describes the analyte across newborn screening and plasma and carries that specimen-independent
          Part instead. diagnosis_term was moved from NCIT:C15419 Disease Screening to NCIT:C81178 Newborn
          Screening, the more specific term reachable from NCIT:C25218, when the measurements were added;
          the other diagnosis rows in this entry are not screening rows and are unchanged.
      selected_evidence:
        snippet: VLCADD, developed in neonates or later adults, can be diagnosed using newborn bloodspot
          screening (NBS) or genetic sequencing.
        supports: SUPPORT
