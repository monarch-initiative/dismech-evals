        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: How much do secondary OXPHOS dysfunction, oxidative stress, abnormal lipid handling, and
          attenuated TLR4 responses contribute to the cardiac, hepatic, and myopathic VLCAD presentations
          in humans?
        attaches_to:
        - pathophysiology#Secondary mitochondrial dysfunction and OXPHOS impairment
        - pathophysiology#Oxidative stress and glutathione vulnerability
        - pathophysiology#Long-chain lipid metabolite accumulation
        - pathophysiology#Attenuated TLR4 inflammatory response
        rationale: The primary ACADVL/FAO defect and three clinical presentations are established, but
          the secondary branches are supported by reviews, patient fibroblasts, targeted cell perturbation,
          metabolomics, and mouse work rather than direct causal tests in affected human heart, liver,
          or skeletal muscle.
        proposed_experiments:
        - experiment_id: exp_vlcad_isogenic_multilineage_rescue
          experiment_design: TARGETED_PERTURBATION
          name: Isogenic ACADVL rescue across cardiac, hepatic, and skeletal-muscle models
          description: Compare patient-derived and corrected iPSC cardiomyocytes, hepatocytes, and myotubes
            under matched catabolic stress, measuring FAO flux, OXPHOS, lipid species, glutathione, cytokine
            responses, and cell injury.
        - experiment_id: exp_vlcad_branch_specific_perturbation
          experiment_design: TARGETED_PERTURBATION
          name: Branch-specific rescue of VLCAD cellular phenotypes
          description: Rescue lipid balance, redox capacity, or OXPHOS independently to determine which
            interventions prevent lineage-specific injury without restoring ACADVL itself.
      selected_evidence:
        snippet: there is growing evidence that other aspects of mitochondrial function are also affected
          in VLCADD, including secondary defects in OXPHOS function.
        supports: SUPPORT
