            rescues trafficking, lipid, and glycosylation defects.
        - experiment_id: exp_vps53_sphingolipid_perturbation
          name: Sphingolipid-pathway perturbation in VPS53 neural models
          description: Perturb sphingolipid synthesis in disease-relevant neural models and measure neuronal
            survival and network phenotypes.
