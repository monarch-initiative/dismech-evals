        status: OPEN
        prompt: 'How does lengthening the perilipin-4 amphipathic domain cause it to aggregate at the
          sarcolemma, and can an expansion model reproduce the disease?

          '
        attaches_to:
        - pathophysiology#PLIN4 Amphipathic Repeat Expansion
        - pathophysiology#Perilipin-4 Subsarcolemmal Accumulation and Aggregation
        rationale: 'The causal step from expansion to aggregation is inferred from patient biopsies. One
          proposal is that the longer, more hydrophobic amphipathic domain changes lipid-droplet binding
          and mistargets perilipin-4 to cellular membranes. The Plin4 knockout mouse has no muscle phenotype,
          which argues against loss of function but leaves the gain-of-function mechanism untested; no
          expansion knock-in or patient-derived muscle cell model has been reported.

          '
      selected_evidence:
        snippet: This would explain the increase of PLIN4 observed at the sarcolemma, likely as a result
          of protein misfolding and aggregation.
        supports: SUPPORT
