        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Does the original 1999 Italian "vacuolar neuromyopathy" family, which gave the disease
          its name, carry a PLIN4 expansion?

          '
        attaches_to:
        - disease#Vacuolar Neuromyopathy
        - genetic#PLIN4
        rationale: 'Two Italian kindreds were linked to 19p13.3: the 1999 family described as a vacuolar
          neuromyopathy (ten affected, mixed neurogenic and myopathic EMG, dysphonia, dysphagia, areflexia)
          and a second kindred described in 2004, in which the PLIN4 expansion was later found. No publication
          found here reports PLIN4 testing in the 1999 family. Its bulbar features (dysphonia and dysphagia)
          are therefore not attributed to PLIN4 in this entry; they are absent in the PLIN4-confirmed
          Chinese patients. Areflexia and mixed neurogenic-myogenic EMG have since been seen in PLIN4-confirmed
          patients (Chinese and Spanish respectively), which makes a shared cause plausible but not shown.

          '
      selected_evidence:
        snippet: The disease was characterized by onset from the late teens to early 50s with distal leg
          weakness and atrophy, development of generalized muscle weakness with distal-to-proximal progression
          sparing facial and ocular muscles, dysphonia and dysphagia, pes cavus and areflexia, variable
          clinical expression ranging from subclinical myopathy to severely disabling weakness, and mixed
          neurogenic and myopathic abnormalities on electromyography.
        supports: SUPPORT
