          are therefore not attributed to PLIN4 in this entry; they are absent in the PLIN4-confirmed
          Chinese patients. Areflexia and mixed neurogenic-myogenic EMG have since been seen in PLIN4-confirmed
          patients (Chinese and Spanish respectively), which makes a shared cause plausible but not shown.

          '
      selected_evidence:
        snippet: Interestingly, we observed mixed neurogenic-myogenic features on electromyography in
          most of the patients
        supports: SUPPORT
