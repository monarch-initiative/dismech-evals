      assertion_type: Pathophysiology
      assertion:
        name: PLIN4 Amphipathic Repeat Expansion
        biological_scale: MOLECULAR
        description: 'A heterozygous in-frame expansion or duplication of the 99-nucleotide coding repeat
          of PLIN4 lengthens the amphipathic-helix domain of perilipin-4 by 6 to 19 units of 33 amino
          acids (40 x 99 in the Italian index kindred, 39 and 37 x 99 in the Spanish families, 50 units
          in one Chinese family, and a 14-unit duplication giving 45 units in an Italian sporadic case).
          The amphipathic repeats are the part of perilipin-4 that binds the lipid droplet surface. Loss
          of function is unlikely to be the mechanism, because Plin4-null mice have no skeletal-muscle
          phenotype.

          '
        genes:
        - preferred_term: PLIN4
          term:
            id: hgnc:29393
            label: PLIN4
        molecular_functions:
        - preferred_term: lipid droplet surface binding by amphipathic helices
          term:
            id: GO:0008289
            label: lipid binding
      selected_evidence:
        snippet: Perilipin-4 is the most abundantly expressed perilipin in muscle, notwithstanding which,
          aside from reduced cardiac triacylglycerol levels, its absence in mouse results in no cardiac,
          skeletal muscle or other impairment
        supports: SUPPORT
        directness: INDIRECT
