      assertion:
        name: PLIN4
        relationship_type: CAUSATIVE
        notes: 'PLIN4 encodes perilipin-4, a lipid-droplet coat protein that is the most abundant perilipin
          in skeletal muscle and sits beneath the sarcolemma. Its amphipathic domain is encoded by about
          31 tandem 99-nucleotide repeats in a single exon (numbered exon 3 or exon 5 depending on transcript).
          All reported disease alleles are heterozygous in-frame expansions or duplications of this repeat.
          Standard short-read exome and genome sequencing does not size the repeat, so the variant is
          easily missed; an unusually high read depth over the repeat exon is a clue. No ClinGen gene-disease
          validity assertion exists for PLIN4.

          '
        gene_term:
          preferred_term: PLIN4
          term:
            id: hgnc:29393
            label: PLIN4
      selected_evidence:
        snippet: Oxford Nanopore long-read sequencing, which confirmed that the higher band is an expansion
          of the normal 31 × 99-nucleotide sequence to 40 × 99 bases, resulting in 297 (9 × 33) extra
          amino acids
        supports: SUPPORT
