      assertion_type: ModelMechanismLink
      assertion:
        target: Loss of DCHS1-FAT4 Cadherin Pair Function
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        description: Establishes that Dchs1 regulates the actin and microtubule cytoskeleton, and that
          some of this is independent of Fat. That matters for this entry because it means DCHS1 loss
          is not wholly equivalent to loss of the pair.
        limitations: The phenotypes are in the single-celled and gastrulating embryo - egg activation,
          cortical granule exocytosis, dorsal organizer specification - none of which correspond to any
          human van Maldergem feature. It is evidence about Dchs1 protein function, not a model of the
          disease, and is curated at LOW fidelity for that reason.
      selected_evidence:
        snippet: Moreover, the bundled microtubule phenotype was partially rescued by expressing either
          full-length Dchs1b or its intracellular domain, suggesting that Dchs1b affects microtubules
          and some developmental processes independent of its known ligand Fat.
        supports: SUPPORT
