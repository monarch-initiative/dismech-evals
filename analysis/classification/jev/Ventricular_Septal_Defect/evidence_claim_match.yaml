            term:
              id: MONDO:0002070
              label: ventricular septal defect
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cardiac Septation Transcriptional Program Disruption
        biological_scale: MOLECULAR
        role: trigger
        description: 'Ventricular septation depends on a small network of interacting cardiac transcription
          factors. GATA4 missense and frameshift mutations segregate with isolated septal defects in large
          pedigrees; the disease-causing G296S substitution reduces DNA binding and transcriptional activity
          and abolishes the physical interaction between GATA4 and TBX5. The reciprocal experiment closes
          the loop: TBX5 missense mutations that cause similar septal defects disrupt the same interaction
          from the other side. NKX2-5 is the other established locus. What the network explains is a minority
          of defects, but it explains them mechanistically rather than statistically.

          '
        locations:
        - preferred_term: interventricular septum
          term:
            id: UBERON:0002094
            label: interventricular septum
        biological_processes:
        - preferred_term: ventricular septum development
          term:
            id: GO:0003281
            label: ventricular septum development
          modifier: ABNORMAL
        genes:
        - preferred_term: GATA4
          term:
            id: hgnc:4173
            label: GATA4
        - preferred_term: NKX2-5
          term:
            id: hgnc:2488
            label: NKX2-5
        - preferred_term: TBX5
          term:
            id: hgnc:11604
            label: TBX5
      selected_evidence:
        snippet: A heterozygous G296S missense mutation of GATA4, a transcription factor essential for
          heart formation, was found in all available affected family members but not in any control individuals.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
