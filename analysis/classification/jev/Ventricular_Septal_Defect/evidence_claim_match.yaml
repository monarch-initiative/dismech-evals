            term:
              id: MONDO:0002070
              label: ventricular septal defect
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: stochastic_developmental_error
        hypothesis_label: Stochastic morphogenetic error
        status: ALTERNATIVE
        description: 'Most ventricular septal defects arise as random errors during a complex morphogenetic
          process, at a rate set by that complexity rather than by any particular genetic or environmental
          exposure. The prediction is that incidence should be largely invariant across populations and
          exposures and that monozygotic twins should be substantially discordant - both of which are
          observed. This remains an epidemiologically supported hypothesis rather than a demonstrated
          mechanism: somatic mutation, stochastic gene expression, or unmeasured micro-environmental differences
          could produce the same pattern.

          '
      selected_evidence:
        snippet: Incidence rates are similar in different races and seasons and are unrelated to maternal
          age, birth order, sex, and socioeconomic status.
        supports: SUPPORT
    origin:
