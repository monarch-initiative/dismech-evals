        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Stochastic Error in Cardiac Morphogenesis
        biological_scale: TISSUE
        role: trigger
        description: 'Most ventricular septal defects have no identifiable genetic or environmental cause,
          and the epidemiology suggests this is a fact about the disease rather than a gap in ascertainment.
          Incidence is essentially flat across races, seasons, maternal age, birth order, sex, and socioeconomic
          status; known risk factors explain few cases; and monozygotic twins, who share genome and prenatal
          environment, are concordant only about 10% of the time. The inference is that many defects arise
          as random errors during a morphogenetic process whose complexity sets the error rate - a claim
          with the practical corollary that many are not preventable.

          '
        locations:
        - preferred_term: interventricular septum
          term:
            id: UBERON:0002094
            label: interventricular septum
        biological_processes:
        - preferred_term: ventricular septum development
          term:
            id: GO:0003281
            label: ventricular septum development
          modifier: ABNORMAL
      selected_evidence:
        snippet: The consistency of incidence among individuals with widely differing genes and environments
          and the frequency of discordance in identical twins suggest that VSDs often occur as random
          errors in development, at a frequency largely determined by the complexity of normal cardiac
          morphogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
