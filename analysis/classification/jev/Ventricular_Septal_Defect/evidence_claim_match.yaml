      assertion_type: Discussion
      assertion:
        discussion_id: vsd_intervention_timing_window
        kind: OPEN_QUESTION
        attaches_to:
        - pathophysiology#Interventricular Communication
        - pathophysiology#Obstructive Pulmonary Vascular Remodeling
        prompt: 'How should the intervention window be bounded when the same defect may either close itself
          or become inoperable?

          '
        rationale: 'The therapeutic window in this disease is bounded on both sides, which is unusual.
          Operating too early risks intervening on a defect that would have closed spontaneously - the
          majority outcome, and 83.5% within one year in unselected newborns. Waiting too long allows
          pulmonary vascular remodeling to become irreversible, converting a correctable lesion into one
          where closure is contraindicated. Subtype resolves much of this (muscular defects can be watched;
          large perimembranous defects cannot), but the intermediate case - a moderate perimembranous
          defect with a growing shunt in an infant who is feeding adequately - is not resolved by the
          available data, and early age at presentation has been shown specifically not to predict the
          need for surgery.

          '
      selected_evidence:
        snippet: Early age at presentation, in contrast, is not predictive of the need for surgical intervention.
        supports: SUPPORT
