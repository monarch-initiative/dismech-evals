        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Interventricular Communication
        biological_scale: TISSUE
        description: 'The anatomic lesion: a communication between the ventricular chambers. Its location
          is the single strongest determinant of what happens next. Muscular defects, entirely bordered
          by septal muscle, close spontaneously in the large majority of cases as the muscular septum
          grows and remodels around them. Perimembranous defects, which abut the fibrous membranous septum,
          close far less often. Size matters within subtype - perimembranous defects of 4 mm or more are
          those that do not close - but subtype dominates.

          '
        locations:
        - preferred_term: interventricular septum
          term:
            id: UBERON:0002094
            label: interventricular septum
      selected_evidence:
        snippet: Muscular VSDs showed significantly higher rate of spontaneous closure compared with perimembranous
          VSDs
        supports: SUPPORT
