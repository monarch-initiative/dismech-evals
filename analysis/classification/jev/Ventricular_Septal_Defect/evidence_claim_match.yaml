        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: transcriptional_network_lesion
        hypothesis_label: Cardiac transcription factor network lesion
        status: ALTERNATIVE
        description: 'In a minority of cases, and disproportionately in familial ones, the defect results
          from a specific lesion in the GATA4-NKX2-5-TBX5 septation network. This account explains far
          fewer cases than the stochastic one but explains them far better, and is the only branch that
          currently supports mechanistic prediction, family counselling, or modeling. The mouse work makes
          the relationship between the two accounts explicit: even a defined Nkx2-5 mutation produces
          a variable phenotype governed by modifier loci, so "genetic cause" and "stochastic variability"
          are not competing at the level of the individual patient.

          '
      selected_evidence:
        snippet: These results implicate GATA4 as a genetic cause of human cardiac septal defects, perhaps
          through its interaction with TBX5.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
