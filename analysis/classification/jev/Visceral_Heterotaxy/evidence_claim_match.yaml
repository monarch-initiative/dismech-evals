              contribute to the ciliated left-right organizer. This is the principal vertebrate evidence
              for a cilia-independent origin of left-right asymmetry, so the model is included here as
              a challenge to the organizer-first ordering of this entry's pathophysiology rather than
              as a model of a patient genotype.
