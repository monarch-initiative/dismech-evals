      assertion_type: Discussion
      assertion:
        discussion_id: heterotaxy_lr_initiation_stage
        kind: CONTROVERSY
        status: OPEN
        prompt: Is left-right asymmetry in vertebrates initiated by the ciliated left-right organizer,
          or is the axis already specified at cleavage stages by cilia-independent signaling that the
          organizer subsequently amplifies?
        attaches_to:
        - pathophysiology#Left-right organizer ciliary dysfunction
        rationale: 'This entry orders its pathophysiology with organizer ciliary dysfunction upstream
          of Nodal-PITX2 signaling, which matches the human genetics: most identified heterotaxy genes
          are motile-cilia genes. Blastomere-resolution work in Xenopus argues that serotonergic signaling
          specifies the axis at cleavage stages, in ventral right cells that never contribute to the ciliated
          organizer — before cilia exist at all. If that ordering is right, ciliary dysfunction would
          be a step at which an already-specified axis fails to be read out robustly rather than the symmetry-breaking
          event itself. The distinction matters for what an unexplained heterotaxy case should be screened
          for, and roughly half of affected individuals still have no identified causative gene.'
        notes: Recorded because the Xenopus serotonergic model curated in animal_models bears on the ordering
          of this entry's pathophysiology, not because the entry's current ordering is thought to be wrong.
      selected_evidence:
        snippet: The results uniformly support a role for serotonin in the cleavage-stage embryo, long
          before the appearance of cilia, in ventral right blastomeres that do not contribute to the ciliated
          organ.
        supports: SUPPORT
