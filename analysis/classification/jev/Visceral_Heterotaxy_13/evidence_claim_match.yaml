      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: dand5_myocardial_proliferation
        hypothesis_label: DAND5 loss affects ventricular myocardium independently of laterality
        status: EMERGING
        description: Cerl2-null mice without laterality defects have left ventricular hyperplasia from
          cardiomyocyte hyperproliferation, with prolonged Nodal pathway signaling, and DAND5-null human
          iPSC-derived cardiomyocytes are more proliferative and electrophysiologically immature. This
          suggests a second, laterality-independent role for DAND5 in heart development.
        notes: EMERGING because it rests on one knockout mouse study and one iPSC study, and has not been
          examined in patients. One of the three patients had biventricular hypertrophy with reduced left
          ventricular function, but it occurred alongside pulmonary stenosis and an unrepaired atrioventricular
          canal defect, and no source attributes it to this mechanism, so the phenotype is not wired to
          this node.
      selected_evidence:
        snippet: Neonatal mutants obtained from the compound mouse line Cer2-/-::Mlc1v-nLacZ24+, in which
          the pulmonary ventricle is genetically marked, revealed a massive enlargement of the ventricular
          myocardium in animals without laterality defects.
        supports: SUPPORT
