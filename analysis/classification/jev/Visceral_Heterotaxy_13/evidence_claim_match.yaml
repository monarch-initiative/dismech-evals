      assertion_type: Genetic
      assertion:
        name: DAND5
        gene_term:
          preferred_term: DAND5
          term:
            id: hgnc:26780
            label: DAND5
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'DAND5 (19p13.13) has two coding exons and encodes a secreted protein whose C-terminal
          cysteine-knot DAN domain binds Nodal. The two disease alleles reported to date are homozygous
          frameshifts: c.197del (p.Leu66ArgfsTer22) in exon 1, upstream of the DAN domain and predicted
          to undergo nonsense-mediated decay, and c.396_397dup (p.Tyr133SerfsTer11) in exon 2, predicted
          to escape decay and yield a protein lacking the DAN domain. The gene is not constrained against
          loss-of-function or missense variation in the general population, which is consistent with recessive
          rather than dominant disease.'
        notes: No ClinGen gene-disease validity assertion for DAND5 and this disease was found in the
          committed ClinGen cache, so gene_disease_validity is left unset. The evidence base is three
          patients; the 2026 report describes its own findings as preliminary.
      selected_evidence:
        snippet: Here, we describe a second unrelated individual with heterotaxy syndrome and a homozygous
          frameshift variant in DAND5 (NM_152654.2:c.197del [p.Leu66ArgfsTer22]).
        supports: SUPPORT
