        genotype: Cerl2-/- (targeted null)
        publication: PMID:15466485
        description: Homozygous Cerl2-null mice show randomized left-right axis, heterotaxy and congenital
          heart defects, with substantial mortality on the first day after birth, and a separate left
          ventricular hyperplasia that is present even in mutants with normal laterality.
        modeled_mechanisms:
        - target: Lateral Plate Mesoderm Laterality Signaling Disruption
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: The null allele matches the human loss-of-function alleles and reproduces randomized
            laterality and heterotaxy with heart defects.
          limitations: Nodal-dosage rescue and the laterality-independent ventricular phenotype have not
            been examined in patients.
        - target: Excess Nodal Signaling in Developing Ventricular Myocardium
          relationship: RECAPITULATES
          fidelity: UNKNOWN
          model_scale: ORGANISM
          description: Mutants without laterality defects show left ventricular hyperplasia with prolonged
            pSmad2 signaling and systolic dysfunction.
          limitations: No human counterpart has been established, so fidelity to patients cannot be judged.
      selected_evidence:
        snippet: cerl-2 knockout mice display multiple laterality defects including randomization of the
          L/R axis.
