              id: MONDO:0976134
              label: heterotaxy, visceral, 13, autosomal
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bilateral Nodal Activity at the Left-Right Organizer
        description: At the left-right organizer (the mouse node, Xenopus gastrocoel roof plate and zebrafish
          Kupffer's vesicle) DAND5 and Nodal are co-expressed in the marginal crown cells. Leftward flow,
          sensed through the PKD2 channel, triggers Bicc1- and Ccr4-Not-dependent decay of Dand5 mRNA
          on the left, so Nodal is released on the left only. DAND5 is the first gene to be asymmetrically
          expressed and the main target of flow. When it is absent, Nodal at the organizer is active on
          both sides and the flow signal has nothing to act on, so the left-right cue passed to the lateral
          plate is lost or randomized. The ciliary machinery that produces the flow is not affected.
        biological_scale: CELLULAR
        locations:
        - preferred_term: embryonic node
          term:
            id: UBERON:0003062
            label: primitive knot
        biological_processes:
        - preferred_term: nodal signaling pathway
          modifier: INCREASED
          term:
            id: GO:0038092
            label: nodal signaling pathway
        - preferred_term: determination of left/right symmetry
          modifier: ABNORMAL
          term:
            id: GO:0007368
            label: determination of left/right symmetry
      selected_evidence:
        snippet: Here we identify the Nodal inhibitor Coco as a critical target of flow.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/2
      context_paths:
