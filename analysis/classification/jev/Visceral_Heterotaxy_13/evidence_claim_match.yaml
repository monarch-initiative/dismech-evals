        - phenotypes#Biventricular hypertrophy
        prompt: Does DAND5 loss cause ventricular myocardial overgrowth in patients, as it does in Cerl2-null
          mice and DAND5-null iPSC-derived cardiomyocytes?
        rationale: The mouse and human cell data point to a laterality-independent effect on cardiomyocyte
          proliferation and left ventricular function. One of three patients had biventricular hypertrophy
          with reduced systolic function, but with obstructive and shunt lesions that can explain it,
          and the other two were not described in those terms. Serial imaging of ventricular wall thickness
          and function in further biallelic patients would show whether the model phenotype translates.
        status: OPEN
      selected_evidence:
        snippet: The majority of Cerl2 (DAND5 ortholog) knockout mice were found to have heterotaxy and
          left ventricular cardiac hyperplasia
