      assertion_type: Discussion
      assertion:
        discussion_id: dand5_monoallelic_contribution
        kind: KNOWLEDGE_GAP
        attaches_to:
        - genetic#DAND5
        prompt: Do heterozygous DAND5 variants contribute to laterality defects or congenital heart disease,
          or is DAND5 disease strictly recessive?
        rationale: The first DAND5 reports were heterozygous p.Arg152His carriers with heart disease,
          and the variant reduced activity in a reporter assay. But the allele is common, with healthy
          homozygotes, DAND5 is tolerant of loss-of-function variation, and those patients were not screened
          for a cause in another heterotaxy gene. Heterozygous parents and relatives of the recessive
          patients were unaffected, though they were not imaged for subtle situs defects. Whether DAND5
          acts as a low-penetrance modifier is therefore open.
        status: OPEN
      selected_evidence:
        snippet: Additionally, this gene does not exhibit missense constraint (z score = −0.36) and is
          tolerant to loss-of-function variants (pLI = 0), leaving the contribution of monoallelic DAND5
          variants to human disease unresolved.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42650045
      reference_title: Further Support for Association of DAND5 with Autosomal Recessive Laterality Disorders.
      evidence_source: HUMAN_CLINICAL
      explanation: The latest report states that the role of single DAND5 variants is unresolved.
