          versus left lung isomerism, and different survival. Human patients range from situs inversus
          totalis without heart disease to lethal heterotaxy, and siblings with the same genotype differ,
          but no human allele has been tested for which mouse outcome it resembles. Until that is known,
          the edge from flow-sensing failure to a particular situs outcome is an inference from mouse.
        status: OPEN
