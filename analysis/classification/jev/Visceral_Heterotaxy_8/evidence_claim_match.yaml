        description: PKD1L1 is expressed in the ventral node and node crown cells (mouse) and in Kupffer's
          vesicle (medaka) at the time leftward flow breaks symmetry, and it co-localizes and physically
          interacts with PKD2 in cilia. Flow carries PKD1L1-containing fibrous strands to the left margin
          of the node, where they associate with Nodal. In Pkd1l1 mutants the cilia beat and flow is generated,
          but the flow is not sensed, so the organizer never acquires its left-right bias. This places
          HTX8 among the flow-sensing laterality disorders, distinct from the primary ciliary dyskinesias
          in which the cilia cannot move.
