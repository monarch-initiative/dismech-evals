        hypothesis_label: PKD1L1 loss causes biliary atresia through cholangiocyte cilia dysfunction
        status: EMERGING
        description: Beyond its role at the left-right organizer, PKD1L1 is expressed in bile duct epithelium,
          and Pkd1l1-deficient mice show reduced cholangiocyte primary cilia, decreased Hedgehog pathway
          gene expression and fibrotic extrahepatic bile duct remodeling. This would explain why PKD1L1
          variants are found in biliary atresia splenic malformation syndrome, which combines laterality
          defects with biliary atresia.
