      assertion:
        name: PKD1L1
        gene_term:
          preferred_term: PKD1L1
          term:
            id: hgnc:18053
            label: PKD1L1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: PKD1L1 (7p12.3) encodes a 2,849-residue polycystin-1 family protein with two extracellular
          Ig-like PKD domains, a REJ domain, a GPS autoproteolysis motif, eleven transmembrane segments,
          a PLAT domain and a C-terminal coiled-coil that binds PKD2. Reported pathogenic alleles include
          a recurrent canonical splice-donor deletion in intron 42 (c.6473+2_6473+3delTG, found homozygous
          and in trans with other alleles), nonsense variants (for example p.Gln463* and p.Glu427*), and
          a homozygous missense change (p.Cys1691Ser) predicted to break a disulfide bond in the GPS motif.
          The truncating and splice alleles and the mouse null phenotype indicate loss of function.
      selected_evidence:
        snippet: Via whole-exome sequencing (WES), we identified homozygous mutations in PKD1L1 from three
          affected individuals in two unrelated families.
        supports: SUPPORT
    origin:
