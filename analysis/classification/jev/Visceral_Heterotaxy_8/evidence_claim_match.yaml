        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PKD1L1 Loss of Function
        description: Biallelic PKD1L1 variants remove or disable the protein. The recurrent intron 42
          splice-donor deletion abolishes the canonical donor site, nonsense alleles truncate the protein
          before the transmembrane and PKD2-binding regions, and the p.Cys1691Ser missense change is predicted
          to destabilize the GPS motif needed for protein maturation. In cultured cells PKD1L1 is sufficient
          to support a calcium signaling response to fluid flow, and destabilizing its extracellular PKD
          domain abolishes that response.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: PKD1L1
          term:
            id: hgnc:18053
            label: PKD1L1
        molecular_functions:
        - preferred_term: calcium channel activity (as a PKD2 channel partner)
          modifier: DECREASED
          term:
            id: GO:0005262
            label: calcium channel activity
      selected_evidence:
        snippet: WES identified a homozygous splicing mutation, c.6473+2_6473+3delTG, which disrupts the
          invariant splice donor site in intron 42, in both affected individuals.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
