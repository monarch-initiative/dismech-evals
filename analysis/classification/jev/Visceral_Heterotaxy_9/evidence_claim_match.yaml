        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Randomization of Left-Right Axis Specification
        biological_scale: ORGANISM
        role: consequence
        description: With nodal flow absent, left-right identity is assigned stochastically rather than
          deterministically. Some affected individuals develop normal situs solitus, some develop mirror-image
          situs inversus totalis, and a further fraction fails to establish a coherent axis at all and
          develops true heterotaxy (situs ambiguus) with discordant thoracic and abdominal arrangement
          and complex congenital heart disease. This randomisation - as opposed to consistent reversal
          - is the signature of a nodal-cilium laterality defect and explains the intrafamilial variability
          seen in MNS1 pedigrees.
        biological_processes:
        - preferred_term: determination of left/right symmetry
          term:
            id: GO:0007368
            label: determination of left/right symmetry
          modifier: ABNORMAL
      selected_evidence:
        snippet: Genotyping of multiple family members identified randomisation of the laterality defects
          in other homozygous individuals, with all wild type or MNS1 c.407_410del heterozygous carriers
          being unaffected, consistent with an autosomal recessive mode of inheritance.
        supports: SUPPORT
