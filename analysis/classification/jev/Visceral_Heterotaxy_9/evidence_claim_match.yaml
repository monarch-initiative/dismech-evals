            term:
              id: MONDO:0030070
              label: heterotaxy, visceral, 9, autosomal, with male infertility
        context: []
      assertion_type: Genetic
      assertion:
        name: MNS1
        gene_term:
          preferred_term: MNS1
          term:
            id: hgnc:29636
            label: MNS1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'MNS1 (15q21.3) encodes meiosis-specific nuclear structural protein 1, a coiled-coil
          protein that is a detergent-resistant integral component of the motile axoneme. MNS1 self-associates
          into dimers and higher-order polymers and binds CCDC114, a subunit of the outer dynein arm docking
          complex, giving it a structural role in tethering outer dynein arms to the outer doublet microtubules.
          It is expressed in testicular germ cells, in respiratory epithelium, and - in mouse - in the
          embryonic ventral node. Reported pathogenic alleles are uniformly loss-of-function: homozygous
          nonsense (p.Arg242*, p.Gln203*), homozygous frameshift (the c.407_410del Amish founder allele;
          c.603_604insG), an in-frame deletion, and compound heterozygous frameshift/nonsense combinations.'
        variants:
        - name: MNS1 p.Arg242*
          description: Homozygous nonsense variant identified in four males with laterality defects and
            infertility from consanguineous families; the index allele for HTX9.
        - name: MNS1 c.407_410del p.(Glu136Glyfs*16)
          description: Homozygous founder frameshift allele segregating in an extended Amish pedigree
            with situs inversus and male infertility.
        - name: MNS1 c.603_604insG p.Lys202Glufs*6
          description: Homozygous frameshift variant identified in a Han Chinese proband with severe oligoasthenoteratozoospermia,
            the fertility-only presentation of MNS1 deficiency.
      selected_evidence:
        snippet: we demonstrate that MNS1 deficiency in humans causes laterality defects (situs inversus)
          and likely male infertility and that MNS1 plays a role in the ODA-DC assembly
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
