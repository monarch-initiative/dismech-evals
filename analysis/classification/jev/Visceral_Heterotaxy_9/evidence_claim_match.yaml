            term:
              id: MONDO:0030070
              label: heterotaxy, visceral, 9, autosomal, with male infertility
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sperm Flagellar Axoneme Assembly Failure
        biological_scale: CELLULAR
        role: intermediate
        description: 'MNS1 is an integral, detergent-resistant component of the sperm flagellum. In its
          absence the flagellar axoneme is not correctly assembled: the 9+2 microtubule arrangement and
          the surrounding outer dense fibres are disrupted, and outer doublet microtubules show ultrastructural
          disturbance in human patients. Because MNS1 loss acts during spermiogenesis - the post-meiotic
          morphogenesis of the round spermatid into a spermatozoon - both the number and the structure
          of the resulting gametes are affected.'
        cell_types:
        - preferred_term: sperm
          term:
            id: CL:0000019
            label: sperm
        biological_processes:
        - preferred_term: sperm axoneme assembly
          term:
            id: GO:0007288
            label: sperm axoneme assembly
          modifier: DECREASED
        - preferred_term: spermatid development
          term:
            id: GO:0007286
            label: spermatid development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Abnormal flagellum morphology and ultrastructural disturbances in outer doublet microtubules
          were observed in the proband's sperm.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
