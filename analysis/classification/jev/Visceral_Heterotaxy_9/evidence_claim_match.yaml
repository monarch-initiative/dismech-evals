      assertion:
        discussion_id: mns1_phenotype_expansion_uncertainty
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Randomization of Left-Right Axis Specification
        prompt: Are the non-ciliary features reported in individual MNS1 cases - severe myopia and oligodontia
          in one compound heterozygous woman, and a complex prenatal malformation syndrome in a sibling
          fetal pair - part of the MNS1 phenotype, or attributable to coincidental or second-locus variation?
        rationale: The report expanding the MNS1 phenotype describes features with no known connection
          to motile cilia. Critically, the two affected fetuses in that report carried homozygous GLDN
          variants in addition to their in-frame MNS1 deletion, so their malformation syndrome cannot
          be attributed to MNS1 without disentangling the two loci. Given that only a handful of individuals
          have ever been reported, single additional features carry disproportionate weight in shaping
          the perceived phenotype, and this entry deliberately does not curate them as MNS1 phenotypes.
        status: OPEN
      selected_evidence:
        snippet: The second and third patients were sibling fetuses with homozygous in-frame deletion
          variants in MNS1 and homozygous missense variants in GLDN.
        supports: SUPPORT
