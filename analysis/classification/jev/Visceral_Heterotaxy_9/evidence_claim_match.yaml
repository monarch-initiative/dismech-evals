  ed3a209c92b7788b0943dce76f3da2e34b544924eb96826a52d8eff130464b1b:
    claim:
      about:
        disease:
          name: Visceral Heterotaxy 9
          disease_term:
            preferred_term: heterotaxy, visceral, 9, autosomal, with male infertility
            term:
              id: MONDO:0030070
              label: heterotaxy, visceral, 9, autosomal, with male infertility
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cfap53_paralogue_redundancy_airway_sparing
        hypothesis_label: CFAP53 paralogue redundancy buffers (9+2) airway cilia against MNS1 loss
        status: EMERGING
        description: 'A candidate explanation for the tissue-selective phenotype of MNS1 deficiency: why
          laterality and sperm flagella fail while the airway is largely spared. MNS1 and CFAP53 are paralogous
          filamentous microtubule inner proteins (fMIPs) of the motile axoneme. In (9+2) cilia - the multiciliated
          airway cell type - the two proteins act redundantly, so losing MNS1 alone leaves outer dynein
          arms largely docked and mucociliary clearance largely intact; only combined loss strips outer
          dynein arms and significantly impairs motility. The monocilia of the embryonic left-right organiser,
          by contrast, are (9+0), the axoneme type in which CFAP53 is itself essential rather than redundant.
          Note what this does and does not establish: CFAP53 being required in (9+0) cilia is not the
          same claim as CFAP53 being unable to cover for absent MNS1 there, and no published work reports
          whether MNS1 is non-redundantly required in (9+0) cilia. The asymmetry between the two axoneme
          types is therefore a motivation for this model, not a derivation of it. On this model the mild
          or absent airway disease reported in MNS1 deficiency is a predictable consequence of paralogue
          redundancy rather than evidence that MNS1 is dispensable for airway ciliary function. ClinGen''s
          Motile Ciliopathy Gene Curation Expert Panel separately classifies the MNS1-primary ciliary
          dyskinesia relationship as Disputed; that classification grades the strength and consistency
          of the gene-disease evidence and is not a measurement of phenotype severity, so it is cited
          here as a fact this model would have to be compatible with, not as its rationale.'
        notes: 'Marked EMERGING rather than CANONICAL deliberately. The redundancy itself is demonstrated,
          but in zebrafish and mouse rather than in human airway epithelium, and no study has yet tested
          CFAP53 dosage as a modifier of the respiratory phenotype in an MNS1-deficient person. It is
          offered as the most specific available mechanistic account of the airway sparing, not as an
          established one. The competing account already carried on the Outer Dynein Arm Docking Defect
          node - that the docking lesion is simply subtle and distally restricted - is not displaced by
          this hypothesis and the two are not mutually exclusive.

          The hypothesis also has a specific unresolved problem, which is worth stating rather than smoothing
          over: the sperm flagellum is itself a (9+2) axoneme, so paralogue redundancy as described would
          predict that it too is buffered, yet flagellar assembly failure is the most penetrant consequence
          of MNS1 loss in humans. Something must break the symmetry - CFAP53 abundance during spermiogenesis,
          the far greater structural demand on the flagellum, or an MNS1-specific interaction such as
          the MFN2 association reported in sperm - but no published work settles which, and none of those
          candidates is asserted here. Resolving that is the obvious next test of this model.

          A second and arguably cleaner counterexample is already curated in this entry and should be
          read alongside the hypothesis rather than after it. Mns1 SINGLE nulls - no CFAP53 lesion - lose
          outer dynein arms from tracheal cilia and develop hydrocephalus (PMID:22396656, carried on the
          Mns1 knockout mouse and in the mns1_hydrocephalus_model_mismatch discussion). Tracheal and ependymal
          cilia are both (9+2), so on a strict reading of paralogue redundancy neither should fail, and
          both do. Either the buffering is partial rather than absolute, or it is tissue-restricted in
          a way the zebrafish and mouse work has not mapped. The honest position is that this model accounts
          for the mildness of the HUMAN airway phenotype relative to classic primary ciliary dyskinesia,
          and does not account for the mouse (9+2) phenotypes at all.

          Note the polarity of the edge opt-in, which is the reverse of the usual case. This group is
          declared on the Outer Dynein Arm Docking Defect to Respiratory Ciliary Dysfunction edge, and
          it does not explain why that edge holds - the edge holds on its own evidence. It explains why
          the edge is ATTENUATED, i.e. why airway disease is mild rather than PCD-grade. A reader should
          not take the opt-in as this hypothesis supplying the edge''s causal warrant.'
      selected_evidence:
        snippet: in (9+2) cilia, CFAP53 functions redundantly with a paralogous fMIP, MNS1
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
