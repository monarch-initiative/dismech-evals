      assertion_type: Pathophysiology
      assertion:
        name: Outer Dynein Arm Docking Defect in the Motile Axoneme
        biological_scale: MOLECULAR
        role: central_effector
        description: MNS1 dimerises and binds CCDC114, a component of the outer dynein arm docking complex
          (ODA-DC). Without MNS1, outer dynein arms are incompletely docked onto the outer doublet microtubules.
          Crucially, the resulting ultrastructural lesion is subtle - a partial rather than complete loss
          of outer dynein arms, most pronounced in the distal axoneme - which distinguishes MNS1 deficiency
          from the complete ODA loss seen with DNAH5 or DNAI1 defects and accounts for the mild airway
          phenotype relative to classic primary ciliary dyskinesia.
        biological_processes:
        - preferred_term: outer dynein arm assembly
          term:
            id: GO:0036158
            label: outer dynein arm assembly
          modifier: DECREASED
        cellular_components:
        - preferred_term: axoneme
          term:
            id: GO:0005930
            label: axoneme
        notes: The individual in whom the distal ODA-docking phenotype was characterised also carried
          homozygous DNAH5 mutations, so the MNS1-specific contribution to that particular ultrastructural
          readout is partially confounded. See the mns1_pcd_boundary KNOWLEDGE_GAP discussion.
      selected_evidence:
        snippet: In-depth ultrastructural analyses confirmed a subtle outer dynein arm (ODA) defect in
          the axonemes of respiratory epithelial cells resembling findings reported in Mns1-deficient
          mice.
        supports: SUPPORT
