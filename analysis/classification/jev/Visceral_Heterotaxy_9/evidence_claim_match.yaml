        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mns1_hydrocephalus_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Nodal Cilia Motility Failure at the Left-Right Organizer
        prompt: Mns1-null mice develop hydrocephalus, a canonical consequence of ependymal motile cilia
          dysfunction, yet hydrocephalus has not been reported in any MNS1-deficient human. Is the ependymal
          arm of MNS1 function genuinely absent in humans, or has it simply not been looked for?
        rationale: 'Ependymal cilia use the same axonemal machinery as nodal and respiratory cilia, so
          an MNS1-dependent ependymal phenotype is mechanistically expected. Its absence from the human
          literature could reflect a true species difference (mouse aqueductal geometry makes murine hydrocephalus
          far more sensitive to ciliary dysfunction than the human equivalent), ascertainment bias (affected
          individuals are ascertained through cardiology and fertility clinics, not neurology, and brain
          imaging is not routinely reported), or the small size of the published cohort. This is a model-fidelity
          question rather than a plain absence of evidence: the evidence exists in mouse and its translational
          validity to human disease is what is uncertain.'
        status: OPEN
        proposed_experiments:
        - experiment_id: mns1_prospective_neuroimaging
          name: Prospective neuroimaging of MNS1-deficient individuals
          description: Obtain brain MRI with ventricular volumetry in every genetically confirmed MNS1-deficient
            individual, and report ependymal ciliary function where post-mortem or surgical tissue is
            available. This distinguishes a genuine species difference from a reporting gap; a negative
            imaging series across the known cohort would itself be a substantive human result.
          decision_criterion: Ventriculomegaly in a meaningful fraction of the imaged cohort would establish
            the ependymal arm in humans; normal ventricular volumes across the full known cohort would
            establish the mouse hydrocephalus phenotype as species-specific.
      selected_evidence:
        snippet: Defects in motile cilia, termed motile ciliopathies, result in clinical manifestations
          affecting the respiratory and reproductive system, as well as laterality defects and hydrocephalus.
        supports: SUPPORT
