      assertion_type: Environmental
      assertion:
        name: Gestational alcohol exposure during gastrulation
        description: 'Not a cause of HTX9, and not currently an established modifier of it in people.
          This entry records the one published gene-environment interaction involving the causal gene:
          in mice, reducing Mns1 dosage sharply increases susceptibility to the ocular, craniofacial and
          midline brain defects produced by alcohol given at gastrulation (GD7), the same developmental
          window in which the motile monocilia of the left-right organiser establish the morphogen gradients
          that pattern the midline. Defect rates rose from 41% in alcohol-exposed wild-type fetuses to
          64% in Mns1 heterozygotes and 92% in Mns1 nulls. The readout in that work was craniofacial and
          ocular dysmorphology, NOT laterality reversal, so the interaction is recorded here as modulating
          the shared nodal-cilia mechanism rather than as an exposure that triggers or worsens heterotaxy
          itself.'
        exposure_term:
          preferred_term: prenatal alcohol exposure during gastrulation
          term:
            id: ECTO:0300001
            label: exposure to drinking alcohol via maternal
        notes: Deliberately recorded as MODULATES and not as EXACERBATES or PREDISPOSES. Three limits
          are worth stating plainly. The evidence is entirely murine; no human study has examined alcohol
          exposure in an MNS1-deficient pregnancy, and HTX9 is ultra-rare enough that none is likely soon.
          The phenotype that alcohol potentiated was craniofacial, ocular and midline - none of which
          is a reported feature of human MNS1 deficiency - so this is not evidence that alcohol worsens
          laterality or infertility. And the interaction was demonstrated in heterozygotes as well as
          nulls, which makes it a statement about Mns1 dosage generally rather than about the biallelic
          loss-of-function state that defines HTX9. It is included because it is the only published environmental
          modifier of this gene and because the converging mechanism is specific and testable, not because
          it supports a clinical recommendation.
      selected_evidence:
        snippet: PAE interacted with genotype to significantly increase the defect rate and severity in
          Mns1+/- (64.29%) and Mns1-/- mice (92.31%)
        supports: SUPPORT
