        context: []
      assertion_type: AnimalModel
      assertion:
        name: Mns1 knockout mouse
        species: Mouse
        genotype: Mns1 null (homozygous)
        publication: PMID:22396656
        description: The founding loss-of-function model for MNS1 deficiency. Mns1-null males are sterile
          with markedly reduced sperm production and immotile, short-tailed spermatozoa in which the 9+2
          microtubule arrangement and outer dense fibres are disrupted. The mice also display situs inversus
          and hydrocephalus, and their tracheal motile cilia lack a subset of outer dynein arms - the
          same partial ODA lesion later found in human patients.
        modeled_mechanisms:
        - target: Sperm Flagellar Axoneme Assembly Failure
          relationship: RECAPITULATES
          fidelity: HIGH
          description: The mouse null reproduces the human flagellar assembly defect at both the light-microscopic
            (short, immotile tails) and ultrastructural (disrupted 9+2 axoneme and outer dense fibres)
            level.
          limitations: Mouse sterility is complete, whereas the human phenotype is reported as severe
            oligoasthenoteratozoospermia with residual sperm production; the human quantitative severity
            is therefore not identical.
          readouts:
          - name: Sperm production and flagellar ultrastructure
            target: Sperm Flagellar Axoneme Assembly Failure
            direction: DECREASED
            interpretation: Reduced sperm output with disrupted axonemal and outer dense fibre architecture
              is the structural correlate of the flagellar assembly node.
        - target: Nodal Cilia Motility Failure at the Left-Right Organizer
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Mns1-null mice display situs inversus, the organismal readout of failed nodal cilium
            function, and their tracheal motile cilia show the partial outer dynein arm loss that is the
            presumed proximate cause.
          limitations: Nodal cilium beating and nodal flow were not measured directly in this study; situs
            inversus and tracheal ciliary ultrastructure are used as proxies. The mouse also develops
            hydrocephalus, which has not been reported in MNS1-deficient humans.
          readouts:
          - name: Tracheal ciliary outer dynein arm content
            target: Nodal Cilia Motility Failure at the Left-Right Organizer
            direction: DECREASED
            interpretation: Partial loss of outer dynein arms from motile cilia is the ultrastructural
              readout supporting impaired ciliary beating in this model.
      selected_evidence:
        snippet: Here, we report that MNS1, a coiled-coil protein of unknown function, is essential for
          spermiogenesis.
        supports: SUPPORT
