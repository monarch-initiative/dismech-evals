          lesion to become clinically significant?
        rationale: 'The two strongest airway observations in MNS1 deficiency are confounded or isolated.
          In the index cohort, the one individual with recurrent respiratory infections and the informative
          distal ODA-docking ultrastructure also carried homozygous DNAH5 mutations, a well-established
          PCD gene, so her airway phenotype cannot be attributed to MNS1 alone. The later report of a
          pronounced respiratory phenotype rests on a single six-year-old girl, with two further individuals
          showing only a mild phenotype. ClinGen''s Motile Ciliopathy Gene Curation Expert Panel classifies
          the MNS1-primary ciliary dyskinesia gene-disease relationship as Disputed. Resolving this matters
          clinically: it determines whether MNS1-deficient individuals need PCD surveillance (airway clearance,
          spirometry, imaging for bronchiectasis) or only laterality and fertility management.'
        status: OPEN
        proposed_experiments:
        - experiment_id: mns1_pcd_diagnostic_battery
          name: Systematic PCD diagnostic workup of an MNS1 cohort
          description: Apply the standard PCD diagnostic battery - nasal nitric oxide, high-speed video
            microscopy of ciliary beat frequency and waveform, transmission electron microscopy and air-liquid
            interface culture - to every reported MNS1-deficient individual without a second motile-ciliopathy
            gene lesion, and compare against genotype-matched DNAH5 controls. Only a systematic, second-gene-negative
            series can separate an MNS1-intrinsic airway phenotype from digenic or coincidental disease.
          decision_criterion: MNS1 is judged an independent cause of PCD-grade airway disease if second-gene-negative
            individuals show low nasal nitric oxide together with abnormal ciliary beat pattern in the
            majority of cases; it is judged insufficient alone if those individuals are indistinguishable
            from controls.
          would_support:
          - pathophysiology#Respiratory Ciliary Dysfunction
      selected_evidence:
        snippet: MNS1 | HGNC:29636 | primary ciliary dyskinesia | MONDO:0016575 | AR | Disputed
        supports: SUPPORT
