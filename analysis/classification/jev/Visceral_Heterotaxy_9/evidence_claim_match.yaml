  f22888178ac2298a9dbe8b1e875853f7aa066a145e75d665b8d40de648b90884:
    claim:
      about:
        disease:
          name: Visceral Heterotaxy 9
          disease_term:
            preferred_term: heterotaxy, visceral, 9, autosomal, with male infertility
            term:
              id: MONDO:0030070
              label: heterotaxy, visceral, 9, autosomal, with male infertility
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mns1_sperm_9plus2_redundancy_paradox
        kind: KNOWLEDGE_GAP
        attaches_to:
        - mechanistic_hypotheses#cfap53_paralogue_redundancy_airway_sparing
        - pathophysiology#Sperm Flagellar Axoneme Assembly Failure
        prompt: If CFAP53 acts redundantly with MNS1 in (9+2) axonemes, and the sperm flagellum is a (9+2)
          axoneme, why is flagellar assembly failure the most penetrant consequence of MNS1 loss in humans
          while the airway is largely spared?
        rationale: 'The paralogue-redundancy model accounts neatly for two of the three arms of this disease.
          Nodal monocilia are (9+0), where CFAP53 is itself essential and cannot substitute, so laterality
          randomisation follows. Airway multiciliated cells are (9+2) and buffered, so respiratory disease
          is mild - which is what ClinGen''s Disputed classification reflects. The sperm flagellum breaks
          the pattern: it is (9+2) yet fails in every affected male in whom it has actually been assessed.
          The qualifier matters: semen analysis exists for very few, one of the five homozygous males
          in the Amish pedigree was confirmed infertile with no further assessment possible, and Ta-Shma''s
          title says "likely male infertility". Whatever breaks that symmetry is the substantive open
          question, and it is not currently answered. Candidate explanations are that CFAP53 is not present
          at sufficient abundance during spermiogenesis, that the flagellum''s far greater length and
          mechanical load exceeds what a partially docked outer dynein arm array can sustain, or that
          MNS1 has flagellum-specific partners - the MFN2 association reported in mouse sperm is the only
          characterised candidate - that have no ciliary equivalent. Distinguishing these matters beyond
          bookkeeping: it determines whether CFAP53 dosage is a plausible modifier locus worth genotyping
          in MNS1-deficient men, and whether the airway really is protected or merely under-tested.'
        status: OPEN
        proposed_experiments:
        - experiment_id: cfap53_dosage_across_motile_cell_types
          name: CFAP53 abundance and MNS1 dependence across airway, ependymal and germ cells
          description: Quantify CFAP53 protein in human airway multiciliated cells and in spermatids/spermatozoa
            from the same donors, then knock MNS1 down in an air-liquid interface airway culture and in
            a germ-cell model while measuring outer dynein arm docking by transmission electron microscopy
            and motility by high-speed video microscopy. A CFAP53 rescue arm in the germ-cell model tests
            the redundancy claim directly rather than by correlation.
          decision_criterion: The redundancy model is supported if CFAP53 is abundant in airway cells
            and scarce in germ cells, and if restoring CFAP53 in the MNS1-deficient germ-cell model rescues
            outer dynein arm docking. It is refuted if CFAP53 is comparably abundant in both and rescue
            fails, which would point instead to a flagellum-specific MNS1 partner or a mechanical-load
            explanation.
          would_support:
          - mechanistic_hypotheses#cfap53_paralogue_redundancy_airway_sparing
          would_refute:
          - mechanistic_hypotheses#cfap53_paralogue_redundancy_airway_sparing
          supporting_outcome:
          - CFAP53 abundant in airway multiciliated cells and scarce in germ cells, with CFAP53 restoration
            rescuing outer dynein arm docking in the MNS1-deficient germ-cell model.
          refuting_outcome:
          - CFAP53 comparably abundant in both cell types and rescue failing, which would leave the airway
            sparing unexplained by paralogue dosage and point to a flagellum-specific MNS1 partner or
            a mechanical-load account instead.
      selected_evidence:
        snippet: Co-immunoprecipitation demonstrated an association between MFN2 and MNS1 in spermatogenic
          cells
        supports: SUPPORT
        directness: INDIRECT
