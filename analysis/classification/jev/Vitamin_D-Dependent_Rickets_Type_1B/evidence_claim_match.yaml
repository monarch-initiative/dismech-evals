            label: Autosomal recessive inheritance
        description: 'Homozygous and compound heterozygous CYP2R1 genotypes produce the classic, severe
          disorder. A Nigerian study found a dosage-dependent biochemical effect and described semidominant
          inheritance, and a Saudi cohort reported symptomatic heterozygotes. This is not universal: other
          pedigrees have clinically normal heterozygous parents, and phenotype severity can vary independently
          of gene dosage. Autosomal recessive inheritance therefore remains the primary label, with reported
          semidominant behavior and variable heterozygote penetrance.'
      selected_evidence:
        snippet: CYP2R1 mutations cause a novel form of genetic vitamin D deficiency with semidominant
          inheritance.
        supports: SUPPORT
