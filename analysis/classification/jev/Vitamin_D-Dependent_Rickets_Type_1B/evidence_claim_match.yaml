      assertion_type: DifferentialDiagnosis
      assertion:
        name: Phosphopenic rickets from renal phosphate wasting
        description: FGF23-mediated disorders and proximal renal tubulopathies can cause rickets through
          primary phosphate loss. Age-adjusted phosphate, PTH, calcium, 25-hydroxyvitamin D, and tubular
          phosphate reabsorption separate this branch from calciopenic VDDR1B.
        distinguishing_features:
        - Normal PTH and calcium with low phosphate favors primary phosphopenic rickets.
        - Reduced tubular phosphate reabsorption identifies genetic or acquired renal phosphate wasting.
      selected_evidence:
        snippet: Subjects who have hypophosphatemia and normal serum levels of PTH, calcium, and 25(OH)D
          are likely to have phosphopenic rickets; a normal or elevated tubular reabsorption of phosphorus
          (TRP) will be found in subjects with inadequate intake or absorption of phosphorus. By contrast,
          patients with XLH and other genetic or acquired causes of renal phosphate wasting will have
          reduced TRP values.
        supports: SUPPORT
