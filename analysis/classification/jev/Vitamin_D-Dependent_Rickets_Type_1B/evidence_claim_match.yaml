              label: vitamin D hydroxylation-deficient rickets, type 1B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hepatic 25-Hydroxylase Deficiency
        description: CYP2R1 is the principal microsomal enzyme that hydroxylates carbon 25 of vitamin
          D in the liver, the first of the two activation steps. Disease variants reduce or abolish CYP2R1-dependent
          activity, so ingested or cutaneously synthesized vitamin D is converted inefficiently to 25-hydroxyvitamin
          D. Partially active alleles retain some conversion in vitro, while alternative 25-hydroxylases
          are a proposed additional source; consequently 25-hydroxyvitamin D is markedly reduced but calcitriol
          need not be.
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: CYP2R1
          term:
            id: hgnc:20580
            label: CYP2R1
        molecular_functions:
        - preferred_term: Vitamin D 25-Hydroxylase Activity
          term:
            id: GO:0030343
            label: vitamin D 25-hydroxylase activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The inherited mutation caused the substitution of a proline for an evolutionarily conserved
          leucine at amino acid 99 in the CYP2R1 protein and eliminated vitamin D 25-hydroxylase enzyme
          activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
