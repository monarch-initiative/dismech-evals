      assertion:
        target: Hepatic 25-Hydroxylase Deficiency
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: Recapitulates reduced circulating 25-hydroxyvitamin D while showing that the pathway
          is not abolished and that calcitriol can remain regulated.
        limitations: The null mouse retains a substantial residual fraction of circulating 25-hydroxyvitamin
          D3 and has no reported overt illness, whereas humans with severe biallelic CYP2R1 variants can
          develop rickets. Diet, species-specific alternative hydroxylases and unreported skeletal phenotyping
          in the abstract leave skeletal fidelity unassessed.
        readouts:
        - name: Serum 25-hydroxyvitamin D3 concentration
          target: Hepatic 25-Hydroxylase Deficiency
          direction: DECREASED
          interpretation: A greater-than-50% reduction demonstrates that CYP2R1 is a major, but not exclusive,
            source of circulating 25-hydroxyvitamin D3 in mice.
        - name: Serum 1-alpha,25-dihydroxyvitamin D3 concentration
          target: Hepatic 25-Hydroxylase Deficiency
          direction: UNCHANGED
          interpretation: Preserved active hormone despite loss of Cyp2r1 argues against treating calcitriol
            deficiency as an obligatory consequence of this lesion.
      selected_evidence:
        snippet: Our results support the idea that the CYP2R1 is the major enzyme responsible for 25-hydroxylation
          of vitamin D, but clearly a second, as-yet unknown, enzyme is another contributor to this important
          step in vitamin D activation.
        supports: SUPPORT
