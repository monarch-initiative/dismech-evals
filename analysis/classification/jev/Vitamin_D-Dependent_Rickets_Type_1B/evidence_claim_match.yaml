  7fb4eecad4c2c9bd975b8b597a527a5e7c40c316ddf9e34967ca79c43a1eae2d:
    claim:
      about:
        disease:
          name: Vitamin D-Dependent Rickets Type 1B
          disease_term:
            preferred_term: vitamin D hydroxylation-deficient rickets, type 1B
            term:
              id: MONDO:0010810
              label: vitamin D hydroxylation-deficient rickets, type 1B
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cyp2r1_mouse_human_severity_mismatch
        prompt: Do Cyp2r1-null mice develop a skeletal mineralization defect under the studied conditions,
          or were the relevant skeletal endpoints simply not assessed?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Hepatic 25-Hydroxylase Deficiency
        - pathophysiology#Defective Skeletal Mineralization
        rationale: The mouse establishes that CYP2R1 is a major 25-hydroxylase, but its residual metabolite
          production and preserved calcitriol coexist with a report of no overt health issues. That abstract-level
          statement is not a skeletal assessment and cannot support a negative mineralization result.
          Humans can develop a mineralization defect despite retaining normal or high calcitriol; whether
          mice differ because of stronger alternative 25-hydroxylation, dietary rescue, developmental
          timing, or merely unmeasured skeletal endpoints remains open.
        proposed_experiments:
        - experiment_id: exp_cyp2r1_cross_species_hydroxylase_flux
          name: Cross-species mapping of residual vitamin D 25-hydroxylation
          description: Compare isotope-traced vitamin D-to-25-hydroxyvitamin D flux and expression of
            candidate alternative hydroxylases in Cyp2r1-null mouse hepatocytes and CYP2R1-deficient patient-derived
            hepatocyte models under matched substrate concentrations.
          decision_criterion: Greater residual flux in mouse cells, reversible by perturbing a candidate
            alternative hydroxylase, would support species-specific enzymatic compensation; similar flux
            would shift attention to diet and mineral homeostasis.
        - experiment_id: exp_cyp2r1_mouse_skeletal_stress_test
          name: Longitudinal skeletal phenotyping under controlled vitamin D and calcium intake
          description: Phenotype Cyp2r1-null and wild-type mice across growth using matched, controlled
            vitamin D and calcium diets, serial mineral biochemistry, radiography and growth-plate histomorphometry.
          decision_criterion: Emergence of rickets only under restricted substrate or mineral intake would
            identify dietary rescue in the original model; persistently normal skeletons despite low 25-hydroxyvitamin
            D would support species-specific compensation.
      selected_evidence:
        snippet: These mice had greater than 50% reduction in serum 25-hydroxyvitamin D3. Curiously, the
          1α,25-dihydroxyvitamin D3 level in the serum remained unchanged. These mice presented no health
          issues.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
