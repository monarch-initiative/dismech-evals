            term:
              id: MONDO:0010810
              label: vitamin D hydroxylation-deficient rickets, type 1B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced 25-Hydroxyvitamin D Availability and Calciopenic Signaling
        description: Very low 25-hydroxyvitamin D limits substrate availability for renal 1-alpha-hydroxylation.
          General vitamin-D-dependent-rickets physiology predicts that effective intestinal calcium and
          phosphate absorption can then become inadequate relative to mineral demand, but absorption has
          not been measured directly in the cited VDDR1B cohorts. Renal regulation and residual 25-hydroxylation
          can preserve or increase circulating calcitriol, while other reports support lower values; calcitriol
          is therefore variable rather than a defining deficiency. When effective vitamin D and calcium
          supply is inadequate, the calciopenic cascade of hypocalcemia, secondary hyperparathyroidism
          and phosphaturia follows. This is an evidence-calibrated mechanistic inference that places the
          disorder in the module's calciopenic trigger arm.
        role: central_effector
        biological_scale: ORGANISM
        conforms_to: defective_skeletal_mineralization#Calciopenic Substrate Deficiency
        biological_processes:
        - preferred_term: Vitamin D Metabolic Process
          term:
            id: GO:0042359
            label: vitamin D metabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: With regard to human inborn errors, selective 25-hydroxyvitamin D3deficiency is a rare
          autosomal recessive disorder characterized by impaired synthesis of an intermediate in the vitamin
          D biosynthetic pathway that results in endocrine defects in vitamin D signaling.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
