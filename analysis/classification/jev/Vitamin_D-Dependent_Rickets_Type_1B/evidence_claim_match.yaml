      assertion_type: DifferentialDiagnosis
      assertion:
        name: Nutritional calcium or vitamin D deficiency rickets
        description: Nutritional rickets is the commonest mimic and can share very low 25-hydroxyvitamin
          D and a calciopenic biochemical profile. Adequate calcium and vitamin D with adherence should
          heal ordinary nutritional disease; persistence or recurrent dose dependence warrants refractory-rickets
          evaluation.
        distinguishing_features:
        - Dietary calcium/vitamin D intake, sunlight exposure, and adherence explain most nutritional
          cases.
        - Failure to heal despite adequate calcium and vitamin D or a strong family history favors a refractory
          cause such as VDDR1B.
      selected_evidence:
        snippet: By far the commonest cause of rickets is nutritional rickets, due to dietary deficiency
          in calcium and/or vitamin D intake. Therefore, it would be common practice, particularly in
          resource-deprived settings, to treat cases of rickets presenting clinically empirically with
          oral calcium and vitamin D supplementation. However, if despite adequate compliance to these
          regimes, rickets persists, then ‘refractory’ causes of rickets must be considered.
        supports: SUPPORT
