      assertion_type: Genetic
      assertion:
        name: VDR pathogenic variants
        gene_term:
          preferred_term: VDR
          term:
            id: hgnc:12679
            label: VDR
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Most affected individuals have homozygous or compound-heterozygous VDR variants; complete
          maternal chromosome-12 isodisomy is a rare alternative route to homozygosity. Representative
          alleles span non-truncating ligand-binding-domain variants such as p.Ile268Thr and p.Arg343Cys,
          DNA-binding-domain variants such as p.Val26Met, the RXR-binding-domain p.Arg343His variant,
          splice-site variants, truncating variants, and compound-heterozygous combinations. Functional
          consequences include absent or truncated receptor, impaired ligand binding, impaired DNA binding,
          defective RXR heterodimerization, and defective coactivator recruitment; residual activity,
          alopecia, and treatment response vary by allele class. Exceptionally, heterozygous dominant-negative
          alleles such as p.Q400LfsX7 inhibit wild-type VDR through constitutive corepressor retention
          and cause dominant disease.
      selected_evidence:
        snippet: In each family, a different single nucleotide mutation was found in the DNA binding domain
          of the protein; one family near the tip of the first zinc finger (Gly----Asp) and one at the
          tip of the second zinc finger (Arg----Gly).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
