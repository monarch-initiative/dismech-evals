          must account for treatment and assay context; molecular VDR testing establishes type 2A.
        notes: Recorded as a biochemical marker rather than a phenotype because no HPO term exists for
          an elevated 1,25-dihydroxyvitamin D concentration. HP:0100512 covers only a DECREASED vitamin
          D concentration and would state the opposite of the finding, so no term is bound - a candidate
          for an HPO new-term request.
      selected_evidence:
        snippet: Patients with HVDDR-II have rickets along with hypocalcemia, hypophosphatemia, secondary
          hyperparathyroidism, and elevated serum 1,25(OH)2D levels, which is a hallmark for diagnosing
          this disease.
        supports: SUPPORT
