      assertion_type: AnimalModel
      assertion:
        name: VDR-null mouse (targeted ablation of the second zinc finger)
        species: Mouse
        genotype: Vdr knockout, second zinc finger of the DNA-binding domain deleted
        publication: PMID:9275211
        description: The reference model of this disorder, engineered to reproduce the human DNA-binding-domain
          lesion. Mice are normal at birth and develop hypocalcemia, hyperparathyroidism, rickets and
          osteomalacia on the human timeline, together with progressive alopecia that dietary vitamin
          D deficiency does not cause.
        modeled_mechanisms:
        - target: Defective Skeletal Mineralization
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Reproduces the full mineral and skeletal sequence, and shows the growth-plate lesion
            appearing before overt rickets.
          limitations: The engineered allele removes the second zinc finger specifically; human disease
            alleles are heterogeneous across the DNA-binding and ligand-binding domains, so the model
            represents the DNA-binding class rather than the whole allelic spectrum.
          readouts:
          - name: Hypertrophic chondrocyte zone width in the growth plate
            target: Defective Skeletal Mineralization
            direction: INCREASED
            interpretation: Expansion of the hypertrophic zone is the growth-plate correlate of the mineralization
              defect, and it precedes radiographic rickets in this model.
        - target: Disrupted Ligand-Independent VDR Hair-Cycle Function
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Progressive alopecia develops from four weeks of age and is absent from dietary
            vitamin D deficiency, matching the human observation that alopecia tracks receptor loss rather
            than hormone deficiency.
          limitations: Alopecia is present in some but not all human kindreds, so the model reproduces
            the alopecic subset rather than the disorder uniformly.
      selected_evidence:
        snippet: We have generated a mouse model of VDDR II by targeted ablation of the second zinc finger
          of the VDR DNA-binding domain.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
