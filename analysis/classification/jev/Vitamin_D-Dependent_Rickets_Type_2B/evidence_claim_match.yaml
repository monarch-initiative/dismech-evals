      assertion_type: Discussion
      assertion:
        discussion_id: knowledge_gap_vddr2b_hnrnpc_cause
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Index-Case Endogenous VDR Nuclear-Localization Failure
        - pathophysiology#Index-Case HNRNPC C1/C2 Competition at Vitamin D Response Elements
        prompt: What caused HNRNPC C1/C2 overexpression in the single index case, and how is VDRE competition
          related to the earlier endogenous VDR localization failure?
        rationale: Reciprocal overexpression and siRNA experiments support HNRNPC C1/C2 as a transcriptional
          actor, but no causal germline lesion or upstream regulatory event was identified. The earlier
          localization result and the later occupancy result were not placed in one experimentally tested
          causal sequence. Germline HNRNPC haploinsufficiency has since been associated with a distinct
          neurodevelopmental disorder, not with this rachitic phenotype, so it cannot be imported as evidence
          for VDDR2B inheritance.
        proposed_experiments:
        - experiment_id: exp_vddr2b_genome_sequencing_hnrnpc_regulation
          name: Causal analysis of HNRNPC regulation in the index lineage
          description: Perform genome, transcriptome, copy-number, chromatin, and allele-specific expression
            analysis on archived index-lineage material; perturb candidate regulatory events and normalize
            HNRNPC expression to test rescue of VDRE occupancy, VDR localization, and calcitriol-responsive
            transcription.
      selected_evidence:
        snippet: When overexpressed in vitamin D-responsive cells, cDNAs for both hnRNPC1 and hnRNPC2
          inhibited VDR-VDRE-directed transactivation (28 and 43%, respectively; both p < 0.005).
        supports: SUPPORT
