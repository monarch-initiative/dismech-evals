        description: Modern VDDR3 is a distinct, dominantly acting CYP3A4 p.Ile301Thr gain-of-function
          disorder with accelerated inactivation and low 25-hydroxyvitamin D and calcitriol. Conventional
          dosing can be inadequate, although the original subjects maintained normal mineral biochemistry
          with sufficiently high calcitriol or vitamin D dosing. It must not be inferred from the historical
          phrase "HVDRR type III" used for the receptor-positive index case before modern VDDR3 was defined.
        distinguishing_features:
