        description: Follow-up work on the index-case cells first detected an overexpressed response-element-binding
          protein and provisionally assigned it to the hnRNPA family. The protein was subsequently purified
          and cloned as HNRNPC C1/C2. Overexpressed HNRNPC competed with VDR-RXR for VDRE occupancy, disrupted
          the normal reciprocal occupancy cycle, and suppressed vitamin-D-directed transcription. HNRNPC
          is annotated here as the experimentally implicated actor; these studies did not identify a germline
          HNRNPC lesion.
        role: trigger
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        gene:
          preferred_term: HNRNPC
          term:
            id: hgnc:5035
            label: HNRNPC
        molecular_functions:
        - preferred_term: Vitamin D response-element binding by HNRNPC C1/C2
          term:
            id: GO:0000976
            label: transcription cis-regulatory region binding
          modifier: INCREASED
        biological_processes:
        - preferred_term: Vitamin D receptor signaling
          term:
            id: GO:0070561
            label: vitamin D receptor signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Ab blocking in electrophoretic mobility-shift assays indicated that this dominant-negative
          acting protein was in the hnRNPA family of nucleic acid-binding proteins.
        supports: SUPPORT
