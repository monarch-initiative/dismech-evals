          absent from tested parents in four patients. The Saudi patient's father had rickets, short stature,
          and genu varum but was not genotyped, leaving vertical transmission unconfirmed. This evidence
          cannot establish penetrance, prevalence, sex effects, an allelic spectrum, or adult complications.
