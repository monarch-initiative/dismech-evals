      assertion_type: DifferentialDiagnosis
      assertion:
        name: Vitamin D-dependent rickets type 2B
        description: VDDR2B has been proposed as a VDDR2A-like target-tissue resistance disorder without
          a VDR variant, potentially mediated by excess expression of a nuclear response-element-binding
          protein. No causative gene is established, and the review questions whether it is a distinct
          disorder. Its reported receptor-resistance pattern, rather than depleted vitamin D metabolites,
          separates the proposal from molecularly defined CYP3A4-related VDDR3.
        disease_term:
          preferred_term: vitamin D-dependent rickets, type 2B
          term:
            id: MONDO:0010931
            label: vitamin D-dependent rickets, type 2B
        distinguishing_features:
        - VDDR2A-like vitamin D target-tissue resistance without a VDR defect, rather than accelerated
          metabolite depletion.
        - No established causative gene and no CYP3A4 p.Ile301Thr variant; the status of VDDR2B as a distinct
          entity remains uncertain.
      selected_evidence:
        snippet: VDDR2b (OMIM 600785) resembles VDDR2a but is not caused by a defect in the VDR gene.
          Rather, the molecular defect appears to be overexpression of a nuclear protein that specifically
          interacts with a DNA response element that binds retinoid X receptor-VDR heterodimers.
        supports: SUPPORT
