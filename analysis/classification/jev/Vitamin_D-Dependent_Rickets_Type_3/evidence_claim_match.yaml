        name: Hypophosphatasia
        description: Hypophosphatasia can produce a rickets-like metaphyseal appearance, but tissue-nonspecific
          alkaline phosphatase activity is low rather than elevated. Persistently low age-adjusted alkaline
          phosphatase and pathogenic ALPL variation favor hypophosphatasia over VDDR3.
        disease_term:
          preferred_term: hypophosphatasia
          term:
            id: MONDO:0018570
            label: hypophosphatasia
        distinguishing_features:
        - Low rather than elevated age-adjusted serum alkaline phosphatase activity.
        - Pathogenic ALPL variation rather than CYP3A4 p.Ile301Thr.
      selected_evidence:
        snippet: Because the appearance of the growth plate in children with rickets can resemble that
          of subjects with hypophosphatasia or metaphyseal dysplasias, a reasonable first step in diagnosis
          is to determine the serum level of alkaline phosphatase (Figure 2). Using age- and sex-related
          references ranges, alkaline phosphatase activity will usually be elevated in rickets, normal
          in metaphyseal dysplasia, and low in hypophosphatasia.
        supports: SUPPORT
