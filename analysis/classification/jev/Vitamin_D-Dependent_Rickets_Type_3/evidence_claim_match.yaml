        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hypophosphatemic rickets
        description: Primary phosphopenic rickets shares hypophosphatemia, limb deformity, and growth-plate
          disease, but typically has normal calcium, parathyroid hormone, and vitamin D status with evidence
          of renal phosphate wasting; VDDR3 is a calciopenic disorder with elevated parathyroid hormone
          and depleted vitamin D metabolites.
        disease_term:
          preferred_term: hypophosphatemic rickets
          term:
            id: MONDO:0024300
            label: hypophosphatemic rickets
        distinguishing_features:
        - Normal calcium and parathyroid hormone in primary phosphopenic disease.
        - Reduced tubular phosphate reabsorption in genetic renal phosphate-wasting disorders such as
          XLH.
        - No CYP3A4 p.Ile301Thr variant or accelerated vitamin D metabolite clearance.
      selected_evidence:
        snippet: Subjects who have hypophosphatemia and normal serum levels of PTH, calcium, and 25(OH)D
          are likely to have phosphopenic rickets; a normal or elevated tubular reabsorption of phosphorus
          (TRP) will be found in subjects with inadequate intake or absorption of phosphorus. By contrast,
          patients with XLH and other genetic or acquired causes of renal phosphate wasting will have
          reduced TRP values.
        supports: SUPPORT
