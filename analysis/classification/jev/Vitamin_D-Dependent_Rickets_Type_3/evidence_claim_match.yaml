        markers: Serum calcium, phosphate, alkaline phosphatase, parathyroid hormone, 25-hydroxyvitamin
          D, 1,25-dihydroxyvitamin D, and metaphyseal radiographs.
        results: Calciopenic biochemical abnormalities with radiographic metaphyseal splaying, cupping,
          lucency, osteopenia, or other evidence of active rickets.
