        type: missense
        clinical_significance: PATHOGENIC
        description: A recurrent heterozygous germline missense variant affecting substrate recognition
          site 4. The threonine substitution changes CYP3A4 substrate positioning and selectively increases
          vitamin D metabolite hydroxylation; activity toward at least one non-vitamin D substrate was
          not increased.
      selected_evidence:
        snippet: In vitro, the mutant CYP3A4 oxidized 1,25-dihydroxyvitamin D with 10-fold greater activity
          than WT CYP3A4 and 2-fold greater activity than CYP24A1, the principal inactivator of vitamin
          D metabolites.
        supports: SUPPORT
