              id: MONDO:0033640
              label: vitamin D-dependent rickets, type 3
        context: []
      assertion_type: Treatment
      assertion:
        name: Pharmacologic-Dose Vitamin D Replacement
        description: 'The gain of catabolism makes conventional replacement inadequate, not futile. Pharmacologic-dose
          cholecalciferol or calcitriol can maintain vitamin D metabolites, calcium, phosphate, and parathyroid
          hormone; cholecalciferol regimens have also produced skeletal and functional improvement. Reported
          requirements vary substantially with age and body size: 50,000 IU cholecalciferol daily or high-dose
          calcitriol in the founding patients, 10,000 IU cholecalciferol daily plus calcium in a younger
          child, alfacalcidol 1.5–2 mcg with calcium 30 mg/kg daily followed by 50,000 IU cholecalciferol
          weekly in the Saudi case. The alfacalcidol-calcium regimen accompanied clinical improvement
          but residual generalized osteopenia, so it is not evidence of complete skeletal correction.
          These are case-derived observations, not a standardized regimen; dose selection and monitoring
          require specialist supervision.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: cholecalciferol
            term:
              id: CHEBI:28940
              label: calciol
          - preferred_term: calcitriol
            term:
              id: CHEBI:17823
              label: calcitriol
          - preferred_term: alfacalcidol
            term:
              id: CHEBI:31186
              label: alfacalcidol
        target_phenotypes:
        - preferred_term: Rickets
          term:
            id: HP:0002748
            label: Rickets
        - preferred_term: Growth delay
          term:
            id: HP:0001510
            label: Growth delay
        notes: Calcium supplements accompanied treatment in the two recent case reports, so their independent
          contribution cannot be separated. Published experience is too small to define an age- or weight-standardized
          optimal dose.
      selected_evidence:
        snippet: Both patients required high doses of calcitriol or vitamin D3 (50,000 IU daily) to maintain
          normal serum concentrations of vitamin D metabolites as well as normal serum levels of PTH,
          calcium, and phosphorus.
        supports: SUPPORT
