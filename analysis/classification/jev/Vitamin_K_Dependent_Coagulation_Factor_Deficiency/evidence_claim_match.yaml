            term:
              id: MONDO:0015722
              label: congenital vitamin K-dependent coagulation factors deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Vitamin K epoxide reductase deficiency (VKCFD2)
        description: In VKCFD2, biallelic VKORC1 missense variants impair the vitamin K epoxide reductase
          complex, which recycles vitamin K 2,3-epoxide back to the reduced vitamin K hydroquinone cofactor.
          Loss of VKOR activity depletes the reduced vitamin K pool needed to drive gamma-carboxylation,
          upstream of the carboxylase reaction itself.
        gene:
          preferred_term: VKORC1
          modifier: DECREASED
          term:
            id: hgnc:23663
            label: VKORC1
        genetic_context:
          gene:
            preferred_term: VKORC1
            term:
              id: hgnc:23663
              label: VKORC1
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic pathogenic VKORC1 variants define the germline VKCFD2 context represented
            by this proximal reductase-deficiency mechanism.
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        molecular_functions:
        - preferred_term: vitamin-K-epoxide reductase (warfarin-sensitive) activity
          term:
            id: GO:0047057
            label: vitamin-K-epoxide reductase (warfarin-sensitive) activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: vitamin K recycling (vitamin K metabolic process)
          modifier: DECREASED
          term:
            id: GO:0042373
            label: vitamin K metabolic process
      selected_evidence:
        snippet: This complex recycles vitamin K 2,3-epoxide to vitamin K hydroquinone, a cofactor that
          is essential for the post-translational gamma-carboxylation of several blood coagulation factors.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:14765194
      reference_title: Mutations in VKORC1 cause warfarin resistance and multiple coagulation factor deficiency
        type 2.
      evidence_source: HUMAN_CLINICAL
      explanation: VKOR recycling of vitamin K is required to supply the cofactor for carboxylation; its
        loss in VKCFD2 starves the carboxylase of reduced vitamin K.
