        name: PIVKA-II / des-gamma-carboxy prothrombin
        presence: INCREASED
        context: Circulating protein induced by vitamin K absence or antagonism (PIVKA-II), also called
          des-gamma-carboxy prothrombin, is an undercarboxylated prothrombin biomarker. Abnormal levels
          can precede prolongation of prothrombin time, but they indicate impaired hepatic vitamin K use
          rather than uniquely proving inherited VKCFD.
        readouts:
        - target: Undercarboxylated, functionally defective coagulation factors
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: Increased undercarboxylated prothrombin reports defective vitamin K-dependent
            gamma-carboxylation upstream of the combined factor defect.
      selected_evidence:
        snippet: PIVKA-II or DCP levels can thus be adopted as an indirect indicator of hepatic vitamin
          K status, and their abnormal levels precede any subsequent change in PT.
        supports: SUPPORT
