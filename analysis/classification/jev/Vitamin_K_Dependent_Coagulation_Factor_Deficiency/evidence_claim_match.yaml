            chondrocytes, vascular smooth-muscle cells, and ocular cells; quantify MGP, GRP, osteocalcin,
            and additional Gla-protein carboxylation, then test wild-type GGCX rescue alongside cell-specific
            functional readouts.
          decision_criterion: A reproducible, cell-specific loss-and-rescue pattern links one or more
            substrates to each extra-hemostatic phenotype across independent variants.
