      assertion_type: Discussion
      assertion:
        discussion_id: vulvar_adeno_subtype_evidence_gap
        prompt: What are the subtype-specific incidence, molecular drivers, natural history, and comparative
          treatment outcomes across the officially grouped primary vulvar adenocarcinoma descendants?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Primary Vulvar Glandular Malignancy
        - pathophysiology#Regional Nodal Spread or Late Recurrence
        rationale: The MONDO umbrella also groups rare sebaceous, eccrine (including porocarcinoma), apocrine,
          Skene-gland, clear-cell hidradenocarcinoma, and Bartholin adenoid-cystic branches. Those descendants
          are represented here so that scope is explicit, but remain under-curated because disease-specific
          evidence was not established in this review. A multi-institutional registry with centralized
          pathology review and subtype-resolved outcomes is needed before broad vulvar-cancer treatment
          evidence can be treated as adenocarcinoma-specific.
      selected_evidence:
        snippet: Given the extremely low incidence of VAIt, individual case reports and small case series
          represent the only source of information about this condition in the literature, which inherently
          limits the power of definitive conclusions and uniform treatment protocols.
        supports: SUPPORT
