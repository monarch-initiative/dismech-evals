          and immunophenotype, so a metastatic orthotopic breast primary must be excluded.
        distinguishing_features:
        - Correlate vulvar histology and immunohistochemistry with breast examination and breast imaging.
        - Look for adjacent in situ carcinoma or non-neoplastic mammary-like vulvar tissue when present,
          while recognizing these features may be absent.
      selected_evidence:
        snippet: Furthermore, it is necessary to exclude metastasis disease from orthotopic breast carcinoma
          or other organs.
