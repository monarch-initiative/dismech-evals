        definition_type: CASE_DEFINITION
        description: Vulvar carcinoma is a vulvar epithelial cancer, most commonly squamous cell carcinoma,
          diagnosed by biopsy of a suspicious vulvar lesion and staged with clinical, pathologic, and
          imaging assessment of local and nodal disease.
        scope: General adult gynecologic oncology definition
      selected_evidence:
        snippet: Vulvar carcinoma is a rare cancer affecting the genital tract, constituting 4% of gynecological
          tumors. Vulvar squamous cell carcinoma (VSCC) is the most common type. Diagnosis relies on biopsy
          during vulvoscopy, plus imaging such as ultrasonography (USG), magnetic resonance imaging (MRI)
          and positron emission tomography (PET).
        supports: SUPPORT
