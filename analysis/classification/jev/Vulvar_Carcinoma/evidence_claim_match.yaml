  e041969025b3d61b12fb3773478ba3b08aac0f3843ccb9bc8e464425198fb435:
    claim:
      about:
        disease:
          name: Vulvar Carcinoma
          disease_term:
            preferred_term: vulvar carcinoma
            term:
              id: MONDO:0005215
              label: vulvar carcinoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_vulvar_carcinoma_caf_model_subtype_generality
        prompt: Is cancer-associated-fibroblast dependence a shared invasion mechanism across HPV-associated,
          HPV-independent p53-abnormal, and HPV-independent p53-wild-type VSCC, or is the VCC1 result
          specific to one lichen-sclerosus-associated tumor model?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Fibroblast-Supported Tumor Invasion
        - experimental_models#VCC1 Lichen-Sclerosus-Associated VSCC Cell Line
        rationale: The current experimental evidence comes from one spontaneously immortalized lichen-sclerosus-associated
          cell line studied in organotypic culture and xenografts. That model supports stromal dependence
          in VCC1 but cannot by itself establish generality across the three molecular VSCC subtypes or
          distinguish patient-specific from subtype-shared fibroblast effects.
        proposed_experiments:
        - experiment_id: exp_vscc_subtype_stratified_organoid_caf_panel
          name: Subtype-stratified patient-derived VSCC organoid and CAF perturbation panel
          description: Establish multiple patient-derived tumor organoids from each major VSCC molecular
            subtype and compare matched CAF addition, depletion, and cross-over coculture under a harmonized
            invasion assay.
          experiment_type:
            preferred_term: patient-derived tumor organoid coculture perturbation experiment
          model_systems:
          - name: Subtype-stratified patient-derived VSCC organoid-CAF coculture panel
            description: Replicate organoid lines from HPV-associated p16-positive, HPV-independent p53-abnormal,
              and HPV-independent p53-wild-type tumors, each paired with matched primary CAFs and normal-vulvar
              fibroblasts.
            experimental_model_type: CO_CULTURE
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: vulva
              term:
                id: UBERON:0000997
                label: mammalian vulva
            cell_types:
            - preferred_term: vulvar squamous carcinoma cell
              term:
                id: CL:0000312
                label: keratinocyte
            - preferred_term: cancer-associated fibroblast
              term:
                id: CL:0000057
                label: fibroblast
            cell_source: Fresh patient VSCC resections and matched tumor-adjacent stromal tissue, stratified
              by p16, p53, and direct HPV status.
            culture_system: Three-dimensional tumor organoids in matrix with matched, depleted, or cross-over
              primary fibroblast coculture.
          perturbations:
          - name: Matched CAF addition or depletion
            target: pathophysiology#Fibroblast-Supported Tumor Invasion
            description: Compare tumor organoids with matched CAFs, without fibroblasts, and with normal-vulvar
              fibroblasts to isolate stromal dependence.
          - name: Cross-subtype CAF exchange
            target: pathophysiology#Fibroblast-Supported Tumor Invasion
            description: Exchange CAFs among molecular-subtype organoids to distinguish a shared fibroblast
              program from subtype-matched or patient-specific effects.
          readouts:
          - name: Three-dimensional invasion and organoid growth
            target: pathophysiology#Fibroblast-Supported Tumor Invasion
            description: Quantified invasion distance, invasive area, and organoid growth over time.
            assays:
            - preferred_term: three-dimensional invasion assay
            direction: POSITIVE
          - name: Histologic and transcriptional stromal-response fidelity
            target: pathophysiology#Fibroblast-Supported Tumor Invasion
            description: Keratinizing morphology, epithelial-mesenchymal-transition markers, and single-cell
              tumor/CAF programs compared across subtypes and conditions.
            assays:
            - preferred_term: histopathologic assessment
            - preferred_term: single-cell transcriptomic profiling
            direction: POSITIVE
          controls:
          - name: Tumor organoid without fibroblasts
            description: Establishes the fibroblast-independent invasion and growth baseline for each
              patient line.
          - name: Normal-vulvar fibroblast coculture
            description: Distinguishes a cancer-associated fibroblast effect from nonspecific stromal
              support.
          - name: VCC1 organotypic benchmark
            description: Reproduces the published single-line result as a positive benchmark without treating
              it as subtype-representative.
          decision_criterion: A shared CAF-dependence mechanism is supported if CAF addition reproducibly
            increases invasion across independent lines in all three subtypes and CAF depletion reverses
            it relative to matched controls. Subtype restriction is supported if the effect replicates
            only within one molecular group; failure to reproduce beyond VCC1 would refute cross-subtype
            generality.
          would_support:
          - pathophysiology#Fibroblast-Supported Tumor Invasion
      selected_evidence:
        snippet: In vitro 3D organotypic assays and in vivo xenografts revealed a prominent role of cancer-associated
          fibroblasts in VCC1 invasion and tumor formation.
        supports: SUPPORT
