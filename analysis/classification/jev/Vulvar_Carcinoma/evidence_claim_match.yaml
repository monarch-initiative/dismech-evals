      assertion_type: ExperimentalModel
      assertion:
        name: VCC1 Lichen-Sclerosus-Associated VSCC Cell Line
        description: VCC1 is a spontaneously immortalized human vulvar squamous carcinoma cell line derived
          from lichen-sclerosus-associated VSCC. Three-dimensional organotypic cultures and xenografts
          make it useful for studying tumor-stroma dependence, invasion, and drug response.
        experimental_model_type: CELL_LINE
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        tissue_term:
          preferred_term: vulva
          term:
            id: UBERON:0000997
            label: mammalian vulva
        cell_types:
        - preferred_term: vulvar squamous carcinoma cell
          term:
            id: CL:0000312
            label: keratinocyte
        - preferred_term: cancer-associated fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        cell_source: Spontaneously immortalized VCC1 cells isolated from a human lichen-sclerosus-associated
          VSCC.
        culture_system: Monolayer culture and three-dimensional fibroblast-containing organotypic culture,
          complemented by xenografts.
        publication: PMID:31654625
        modeled_mechanisms:
        - target: Fibroblast-Supported Tumor Invasion
          description: Tests whether cancer-associated fibroblasts support VSCC invasion and tumor formation.
        findings:
        - statement: VCC1 retains epithelial morphology and well-differentiated keratinizing squamous
            carcinoma histology resembling the source tumor.
          supporting_text: Detailed characterization of the novel spontaneously immortalized cell line,
            VCC1 revealed a characteristic epithelial morphology in vitro and a well-differentiated keratinizing
            SCC histology in vivo, closely resembling the tumor of origin.
        - statement: VCC1 shows increased epithelial-mesenchymal-transition markers and clonogenic properties
            relative to established non-VLS-VSCC lines.
          supporting_text: VCC1 expressed higher levels of epithelial-mesenchymal transition markers and
            higher clonogenic properties as compared to other established non VLS-VSCC cell lines.
      selected_evidence:
        snippet: In vitro 3D organotypic assays and in vivo xenografts revealed a prominent role of cancer-associated
          fibroblasts in VCC1 invasion and tumor formation.
        supports: SUPPORT
