      assertion_type: Discussion
      assertion:
        discussion_id: gap_wagr_bdnf_mouse_contiguous_deletion_translation
        prompt: 'Which metabolic and neurobehavioral effects of the human BDNF-deleted WAGRO phenotype
          are attributable specifically to BDNF dosage, and which require other genes in the variably
          sized 11p deletion or human developmental context?

          '
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#BDNF haploinsufficiency and hypothalamic energy dysregulation
        rationale: 'Heterozygous Bdnf knockout mice provide strong directional support for the hyperphagia-obesity
          mechanism and show learning and social-behavior changes. Human WAGRO, however, is a variably
          sized contiguous-gene deletion that always also removes WT1 and PAX6 and may remove additional
          neurodevelopmental genes. The mouse therefore supports BDNF-specific dosage biology but cannot
          by itself assign every human cognitive, adaptive, or autism-related feature to BDNF, and it
          does not model the renal-tumor, genitourinary, or ocular syndrome arms.

          '
      selected_evidence:
        snippet: Heterozygous Bdnf knockout mice exhibit hyperphagia, obesity, decreased nociception,
          and impaired learning and social behaviours
        supports: SUPPORT
