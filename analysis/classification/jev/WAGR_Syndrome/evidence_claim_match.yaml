      assertion_type: Pathophysiology
      assertion:
        name: 11p13 contiguous-gene deletion
        description: 'WAGR syndrome results from a heterozygous, variably sized interstitial deletion
          at chromosome 11p13 that simultaneously removes multiple contiguous genes, obligately including
          WT1 and PAX6. Because the deletion is the unifying lesion, the specific genes lost (and therefore
          the clinical features) depend on deletion extent; larger deletions reaching BDNF produce the
          WAGRO obesity subphenotype.

          '
      selected_evidence:
        snippet: a deletion of chromosome 11p13 that includes the genes WT1 and PAX6 identified by molecular
          genetic testing
        supports: SUPPORT
