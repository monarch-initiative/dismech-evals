          of tinted or photochromic lenses; occlusion therapy in childhood for anisometropic amblyopia
          or strabismic amblyopia; caution regarding surgical procedures to decrease the likelihood or
          exacerbation of aniridic-related keratopathy (ARK) and/or severe aniridic fibrosis syndrome
