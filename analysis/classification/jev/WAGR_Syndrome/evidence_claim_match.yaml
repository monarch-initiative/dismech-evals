  80f67c8014ed5bf5891de98a02a1ce7c589ff97e66675b92798416980eb2cdeb:
    claim:
      about:
        disease:
          name: WAGR Syndrome
          disease_term:
            preferred_term: WAGR syndrome
            term:
              id: MONDO:0008681
              label: WAGR syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BDNF haploinsufficiency and hypothalamic energy dysregulation
        description: 'When the 11p deletion extends distally to BDNF (11p14.1), brain-derived neurotrophic
          factor dosage is reduced. BDNF acts in hypothalamic circuits regulating energy homeostasis,
          and its haploinsufficiency produces hyperphagia and childhood-onset obesity, defining the WAGRO
          subtype. Serum BDNF is roughly halved in deletion carriers. BDNF deletion is also associated
          with lower cognitive and adaptive-behavior scores within WAGR syndrome. Apparent differences
          in autism-interview social scores disappeared after adjustment for cognitive function, and clinician-assigned
          ASD did not differ significantly by BDNF deletion status; ASD is therefore not assigned as a
          BDNF-specific downstream outcome.

          '
        gene:
          preferred_term: BDNF
          term:
            id: hgnc:1033
            label: BDNF
        biological_processes:
        - preferred_term: regulation of feeding behavior
          term:
            id: GO:0060259
            label: regulation of feeding behavior
          modifier: ABNORMAL
        - preferred_term: regulation of synaptic plasticity
          term:
            id: GO:0048167
            label: regulation of synaptic plasticity
          modifier: ABNORMAL
      selected_evidence:
        snippet: BDNF haploinsufficiency is associated with lower levels of serum BDNF and with childhood-onset
          obesity
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18753648
      reference_title: Brain-derived neurotrophic factor and obesity in the WAGR syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Han et al. directly link BDNF haploinsufficiency to reduced serum BDNF and obesity
        in WAGR patients, establishing the WAGRO mechanism.

        '
