      assertion_type: DifferentialDiagnosis
      assertion:
        name: WT1-related tumor predisposition or nephropathy
        description: 'Germline WT1 variants or smaller deletions can cause Wilms tumor predisposition,
          nephropathy, or differences of sex development without the PAX6-related pan-ocular aniridia
          phenotype that defines WAGR.

          '
        distinguishing_features:
        - A pathogenic WT1 variant or WT1-limited deletion without PAX6 involvement supports a WT1-related
          disorder.
        - Pan-ocular aniridia plus a deletion of both WT1 and PAX6 supports WAGR spectrum disorder.
      selected_evidence:
        snippet: The WT1-related tumor predisposition syndromes, however, are distinct from WAGR syndrome
          which involves a large germline deletion spanning a larger section of the chromosomal region
          and includes both WT1 and PAX6
        supports: SUPPORT
