  a6d162ec0daab9f4822cda63a8a29e95b739567083e23b04a99dffe4433859ad:
    claim:
      about:
        disease:
          name: WAPL-Related Developmental Disorder
        context: []
      assertion_type: Subtype
      assertion:
        name: 10q Deletion
        display_name: 10q22.3q23.2 contiguous-gene deletion subtype (WAPL-containing)
        subtype_term:
          preferred_term: 10q22.3q23.2 recurrent deletion syndrome
          term:
            id: MONDO:0012830
            label: chromosome 10q23 deletion syndrome
        description: Individuals with a large recurrent deletion of 10q22.3q23.2, generated by non-allelic
          homologous recombination between the flanking low-copy repeats LCR3 and LCR4, which removes
          WAPL together with roughly 30 neighbouring genes. Clinically this subtype adds features that
          the source literature attributes to other genes in the interval (cardiac defects, congenital
          breast aplasia, cerebellar anomalies, macrocephaly) on top of the developmental delay shared
          with the sequence-variant subtype.
      selected_evidence:
        snippet: Our data provide evidence that the 10q22-q23 genomic region harbors one or more genes
          important for cognitive and behavioral development and that recurrent deletions affecting this
          interval define a novel genomic disorder.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/1
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:17436248
      reference_title: 'Recurrent 10q22-q23 deletions: a genomic disorder on 10q associated with cognitive
        and behavioral abnormalities.'
      evidence_source: HUMAN_CLINICAL
      explanation: Original delineation of the recurrent 10q22-q23 deletion as a genomic disorder, i.e.
        the entity within which WAPL was later nominated as driver.
