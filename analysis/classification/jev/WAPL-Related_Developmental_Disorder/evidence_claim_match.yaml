      reference_title: WAPL maintains a cohesin loading cycle to preserve cell-type-specific distal gene
        regulation.
      evidence_source: IN_VITRO
      explanation: 'Supplies the missing step between the folding defect and the transcriptional one,
        and corrects an intuition the loop-extension model invites: because WAPL-driven turnover is what
        frees cohesin for reloading, losing WAPL does not simply leave cohesin in place - it strips cohesin
        from cell-type-specific regulatory sites. That is why a release-factor defect reads out as loss
        of cell-type-specific gene expression rather than as generic chromatin compaction.'
