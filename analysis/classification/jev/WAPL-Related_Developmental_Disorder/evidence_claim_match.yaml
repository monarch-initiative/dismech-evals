      assertion_type: Phenotype
      assertion:
        category: Gastrointestinal
        name: Hamartomatous Polyposis
        subtype: 10q Deletion
        description: 'The recurrent deletion removes one copy of BMPR1A, in which loss-of-function variants
          cause juvenile polyposis syndrome - a hamartomatous polyposis with a high risk of malignant
          transformation. This is the deletion''s cancer-predisposition arm, and the most clinically actionable
          feature in the entry: the reported adult developed severe juvenile polyposis requiring preventive
