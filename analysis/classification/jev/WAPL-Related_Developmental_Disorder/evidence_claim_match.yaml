            label: Hamartomatous polyposis
          onset:
            onset_category: YOUNG_ADULT
        notes: 'Frequency is deliberately omitted: the source reports a single case and explicitly argues
          that juvenile polyps have never previously been reported in this deletion because the deletion
          is now diagnosed by CNV array years before the digestive phenotype appears. That is an ascertainment
          argument for under-reporting, not a frequency estimate, so no band can be derived. The interval
          is labelled 10q22.3q23.1 (7 Mb) in this source and 10q22.3q23.2 elsewhere in the entry - see
          the entry notes on source-inherited cytoband labelling.'
      selected_evidence:
        snippet: We present the case of a young adult harboring this recurrent deletion, in a context
          of intellectual disability, ventricular septal defect and severe juvenile polyposis syndrome
          diagnosed at the age of 25 years, requiring a surgical preventive colectomy.
        supports: SUPPORT
