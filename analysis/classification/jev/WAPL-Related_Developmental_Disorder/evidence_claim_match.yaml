      reference_title: PDS5A and PDS5B in Cohesin Function and Human Disease.
      evidence_source: MODEL_ORGANISM
      explanation: 'The strongest evidence against PDS5A/PDS5B being neurodevelopmental disease genes,
        and a genuine counterweight to the biological-candidacy argument: unlike Wapl heterozygotes, Pds5
        knockout mice have no reported brain phenotype, though they do have cardiac, palatal and skeletal
        defects. Fenced as MODEL_ORGANISM, and note the review also records that the two published Pds5
        mouse models disagree with each other on redundancy and embryonic lethality, so this is not a
        settled negative.'
