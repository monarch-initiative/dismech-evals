        kind: CURATION_TODO
        status: OPEN
        rationale: '`disease_term` is currently omitted because no MONDO class exists for the monogenic
          entity. MONDO:0012830 is deliberately not reused, since conflating a single-gene disorder with
          the deletion syndrome that contains it is exactly the named-entity-confusion failure mode the
          curation SOP warns about. Once the full text and additional cases are published, a MONDO new-term
          request would let this entry carry a proper `disease_term` and would let the deletion/sequence-variant
          distinction be represented in the ontology rather than only in dismech.'
      selected_evidence:
