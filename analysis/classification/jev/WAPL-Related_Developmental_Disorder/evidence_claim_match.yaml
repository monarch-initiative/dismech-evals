  e29b00a627a0a5fe65f360df1b8473ad2167f408bca23cd9226e83a0508a909f:
    claim:
      about:
        disease:
          name: WAPL-Related Developmental Disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: wapl_mouse_dosage_threshold_translation
        prompt: Does the mouse Wapl dosage-liability threshold, which lies below heterozygosity, actually
          describe the human dose-response, and does it predict that severely hypomorphic or biallelic
          human WAPL genotypes are non-viable?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        rationale: 'The dosage-series evidence is retained in the animal model rather than as a human
          causal-graph node because it exists only in mouse. Every reported human is heterozygous, so
          the 25%-residual arm - birth defects and postnatal lethality - has no human counterpart and
          its translational validity is untested. The mismatch is mechanistically meaningful in two directions:
          if the human curve is shifted, apparently mild human heterozygotes could still harbour subclinical
          cohesin-folding defects; and if it holds, human sub-heterozygous WAPL genotypes would be expected
          to present as pregnancy loss or lethal congenital anomaly rather than as this neurodevelopmental
          disorder, which would systematically hide them from neurodevelopmental cohorts.'
        proposed_experiments:
        - experiment_id: exp_wapl_perinatal_loss_cohort_search
          name: Search perinatal-loss and lethal-anomaly cohorts for sub-heterozygous WAPL genotypes
          description: Search prenatal and perinatal-loss and lethal-congenital-anomaly sequencing cohorts
            for biallelic or severely hypomorphic WAPL genotypes, which the mouse data predict should
            exist there and nowhere else.
        - experiment_id: exp_wapl_human_residual_dosage_assay
          name: Residual WAPL protein and cohesin residence time in human heterozygote cells
          description: Quantify residual WAPL protein and cohesin residence time in cells from human heterozygotes
            and relate them to phenotype severity, to place human carriers on the mouse dose-response
            curve directly.
      selected_evidence:
        snippet: Mice with 50% Wapl expression exhibited mild deficits of growth and learning/memory,
          whereas those with 25% residual Wapl displayed birth defects and postnatal lethality, revealing
          a dosage liability threshold below the level of heterozygosity.
        supports: SUPPORT
