      assertion:
        name: WAPL Variant
        display_name: WAPL sequence-variant subtype (heterozygous damaging WAPL variant)
        description: Individuals with a heterozygous predicted damaging sequence variant in WAPL and no
          deletion of the surrounding 10q22.3q23.2 interval. This is the subtype that establishes WAPL
          as a Mendelian disease gene; 27 such individuals were phenotyped in the defining report.
      selected_evidence:
        snippet: We explored the relevance of cohesin release factors in Mendelian disease by phenotyping
          individuals with heterozygous predicted damaging variants in WAPL (n = 27), PDS5A (n = 8), and
          PDS5B (n = 8)
        supports: SUPPORT
