  125cbe669ebc291e8f97e2b19210186d8acaece2b6956bd1c414031a987f266f:
    claim:
      about:
        disease:
          name: WAPL-Related Developmental Disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: wapl_pds5a_pds5b_validity
        prompt: Are PDS5A and PDS5B Mendelian disease genes, and if so what phenotypes do they cause?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Cohesin Release from Chromatin
        rationale: 'PDS5A and PDS5B are WAPL''s binding partners and, with WAPL, control chromatin loop
          length, so they are strong biological candidates for a parallel disorder. Eight individuals
          with damaging variants in each were phenotyped and did show features of developmental disorders,
          yet neither cohort statistics nor phenotyping produced a specific association. It is therefore
          unresolved whether these are genuine but low-penetrance or heterogeneous disease genes, whether
          the cohorts were simply too small, or whether the variants are tolerated.

          The preprint full text has since been read, and it does not resolve the question - but it does
          sharpen it in two ways, so this gap is no longer "waiting on the full text". First, the negative
          result is not that the carriers were unaffected: every PDS5A/PDS5B subject had neurodevelopmental
          and/or neurological features, and what failed was the coalescence of those features into a defined
          syndrome. Second, PDS5A and PDS5B truncating variants were pooled with WAPL in Analysis 1 of
          the methylation work, and that combined analysis did yield a cohesin-release-factor-deficiency
          episignature - which is suggestive of a shared molecular consequence, but cannot be attributed
          to PDS5A/PDS5B individually from a pooled classifier. Neither observation changes relationship_type:
          UNKNOWN, which remains the correct call.'
        proposed_experiments:
        - experiment_id: exp_pds5_matchmaking_cohort
          name: Powered PDS5A and PDS5B variant cohort with repeated association statistics
          description: Assemble larger international PDS5A and PDS5B variant cohorts through matchmaking
            platforms and repeat the phenotype-association statistics with adequate power.
        - experiment_id: exp_pds5_isogenic_ipsc_transcriptomics
          experiment_design: TARGETED_PERTURBATION
          name: Isogenic PDS5A/PDS5B iPSC and induced-neuron transcriptomic comparison
          description: Apply the same isogenic iPSC and induced-neuron CRISPR and transcriptomic pipeline
            used for WAPL to PDS5A and PDS5B knockouts, and test whether their differentially expressed
            gene sets overlap the WAPL signature.
      selected_evidence:
        snippet: every subject had neurodevelopmental and/or neurological features
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
      context_paths:
      - /name
    evidence_metadata:
      reference: DOI:10.64898/2026.02.23.26346364
      reference_title: Clinical, <i>in vitro,</i> and <i>in vivo</i> evidence of <i>WAPL</i> as a novel
        cohesinopathy gene and phenotypic driver of 10q22.3q23.2 genomic disorder
      evidence_source: HUMAN_CLINICAL
      explanation: Shows the carriers were not unaffected, which is what makes this a genuine open question
        rather than a negative result. PARTIAL because it supports the existence of a phenotype while
        leaving the gene-disease association unresolved.
    first_seen_at: '2026-11-09T20:47:19.151517+00:00'
