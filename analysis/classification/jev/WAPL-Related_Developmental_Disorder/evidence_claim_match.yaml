  2cf6739cd307ebee0769d91ca18d622ac44bb6c9239cd650f01be6260f9d9e3d:
    claim:
      about:
        disease:
          name: WAPL-Related Developmental Disorder
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Investigational DNA methylation episignature analysis
        description: EpiSign analysis of peripheral blood DNA identified a cohesin release factor deficiency-associated
          methylation episignature, and a second signature combining WAPL sequence-variant and 10q deletion
          samples. Both classifiers showed high specificity against other episignature disorders, including
          Cornelia de Lange syndrome, whose overall methylation pattern these profiles do NOT mimic -
          so the episignature is not simply a cohesinopathy readout. The small research analyses do not
          establish a clinically validated diagnostic assay. The important bound is that the study did
          not find a methylation signature for WAPL sequence variants alone (the left-out sample clustered
          with cases in 0 of 8 leave-one-out iterations of that analysis). This assay therefore cannot
          currently be used to reclassify an isolated WAPL variant of uncertain significance; the reported
          profiles apply only to the combined and release-factor-wide research groupings.
      selected_evidence:
        snippet: we identified an overall cohesin release factor deficiency -associated DNA
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/2
      evidence_path: /diagnosis/2/evidence/0
      context_paths:
      - /name
