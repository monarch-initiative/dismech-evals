              id: MONDO:0700293
              label: WFS1-related disorder
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant (nonclassic WFS1-SD)
        description: 'A single heterozygous WFS1 variant is sufficient. It may be transmitted from an
          affected parent or arise de novo; for the recurrent p.A684V allele de novo occurrence is the
          rule rather than the exception, confirmed in seven of thirteen families in the largest series.

          Dominance here is a statement about the allele, not only about the pedigree. Carriers of truncating
          WFS1 alleles - the obligate heterozygotes in recessive Wolfram families - generally hear normally,
          so halving wolframin dose does not cause the disease. The dominant alleles are missense changes
          and small in-frame deletions in exon 8.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Nonclassic WFS1-SD is caused by a heterozygous pathogenic variant and can either be inherited
          in an autosomal dominant manner from an affected parent or result from a de novo WFS1 pathogenic
          variant.
        supports: SUPPORT
