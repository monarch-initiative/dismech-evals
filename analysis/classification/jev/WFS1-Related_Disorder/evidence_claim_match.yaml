              label: WFS1-related disorder
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: UNKNOWN
        prevalence_class: RARE
        notes: 'No numeric prevalence estimate exists for nonclassic WFS1-SD as a whole, and none of the
          sources cited here offers one. What the literature does state is a relative claim - the nonclassic
          arm is less common than the classic arm - and a qualitative one, that WFS1 is nonetheless the
          commonest genetic cause of low-frequency non-syndromic hearing loss. Those two are compatible:
          rare disease, dominant share of a rare audiometric phenotype.

