        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: wfs1_lfsnhl_frequency_specificity
        kind: KNOWLEDGE_GAP
        prompt: Why does the non-syndromic dominant form of WFS1 disease take the low frequencies while
          the syndromic forms take the high ones, when wolframin is expressed without a basal-to-apical
          gradient along the cochlea?
        rationale: This is the central unexplained fact of the entry and it constrains the mechanism.
          A frequency-specific audiometric phenotype normally invites a gradient explanation - more protein,
          or more dependence on it, at one end of the cochlea than the other. The one localisation study
          that looked found no such gradient. So either the relevant quantity is not expression level,
          or the lesion acts on something that varies along the cochlea for another reason. Until this
          is settled, the Impaired Inner Ear Ion Homeostasis node in this entry cannot account for the
          phenotype it points at, which is why it is marked HYPOTHETICAL.
        attaches_to:
        - pathophysiology#Impaired Inner Ear Ion Homeostasis
        - phenotypes#Low-frequency sensorineural hearing loss
      selected_evidence:
        snippet: It is not yet understood why some variants lead to syndromic and others to non-syndromic
          disease or why DFNA6/14/38 is characterized by LFSNHL, while in most syndromic forms, the higher
          frequencies are typically affected.
        supports: SUPPORT
