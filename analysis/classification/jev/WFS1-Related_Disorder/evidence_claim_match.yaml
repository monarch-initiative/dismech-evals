      assertion_type: DifferentialDiagnosis
      assertion:
        name: Classic Wolfram syndrome (recessive WFS1 or CISD2)
        description: The same gene, and the discriminator is allele dose rather than any single clinical
          feature. Classic disease needs two inactivating alleles, starts with childhood diabetes mellitus
          and optic atrophy before 16, and its hearing loss is high-frequency. Dominant disease needs
          one non-inactivating exon 8 allele, and in its non-syndromic form takes the low frequencies
          and nothing else. The recessive disease is curated separately in the Wolfram_Syndrome entry,
          which also covers the CISD2-related form.
        distinguishing_features:
        - Two inactivating WFS1 alleles rather than one non-inactivating exon 8 allele
        - High-frequency rather than low-frequency hearing loss
        - Diabetes mellitus and optic atrophy before age 16 as the defining pair
      selected_evidence:
        snippet: Classic WFS1-SD, a progressive neurodegenerative disorder, is characterized by onset
          of diabetes mellitus and optic atrophy before age 16 years.
        supports: SUPPORT
