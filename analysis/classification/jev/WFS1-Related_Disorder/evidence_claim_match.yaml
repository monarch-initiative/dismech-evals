      assertion_type: Discussion
      assertion:
        discussion_id: wfs1_dominant_allele_mechanism
        kind: KNOWLEDGE_GAP
        prompt: Do the dominant WFS1 alleles act by interfering with wild-type wolframin, or by a toxic
          gain of function, and does the answer differ between the mild non-syndromic alleles and the
          aggregating de novo ones?
        rationale: 'The two readings are offered side by side in the literature and have never been separated
          experimentally for the non-syndromic alleles. They are not interchangeable: dominant-negative
          interference predicts that the phenotype depends on the wild-type allele being present and on
          the two proteins meeting, while toxic gain of function predicts a cell-autonomous burden that
          antisense knockdown of the mutant allele would relieve regardless. The aggregating alleles of
          the neonatal-diabetes subtype do have a measured gain-of-function-like behaviour, which is the
          one point in the series where the question has an answer - and it is an answer for one allele
          class only.'
        attaches_to:
        - pathophysiology#Mutant Wolframin Interference with Wild-Type Wolframin
        - pathophysiology#Heterozygous Non-Inactivating WFS1 Variant in Exon 8
      selected_evidence:
        snippet: are non-inactivating variants with a dominant-negative effect in which the mutant protein
          impairs the function of the wild-type protein
        supports: SUPPORT
