      assertion_type: Phenotype
      assertion:
        name: Congenital severe-to-profound sensorineural hearing impairment
        category: Auditory
        description: The p.A684V allele breaks the usual dominant pattern. Instead of a mild ascending
          audiogram it gives congenital or very early, severe-to-profound bilateral loss, and it arises
          de novo often enough that most probands have no family history. This is the genotype-phenotype
          correlation with the clearest management consequence in the entry.
        notes: 'Deliberately not scoped to a subtype, and deliberately carrying no frequency. The allele
          spans the subtype boundary: it is the commonest allele in the series that defined Wolfram-like
          dominant optic atrophy with hearing loss, while in the fourteen-patient audiological series
          most carriers had hearing loss and nothing else - optic atrophy in two of eleven assessed, diabetes
          in none. Recording it under Wolfram-like syndrome would assert a syndromic presentation most
          of those patients did not have. A frequency would need a denominator across the whole entity,
          and the only denominators published are per-allele.'
        phenotype_term:
          preferred_term: Congenital severe-to-profound sensorineural hearing impairment
          term:
            id: HP:0008527
            label: Congenital sensorineural hearing impairment
      selected_evidence:
        snippet: The identified heterozygous p.A684V variant appears to be a hotspot mutation and likely
          to cause severe-to-profound hearing loss in early childhood.
        supports: SUPPORT
