  df7b2dbb88681720a6c96b4a1d865d585c3dbb110dcbc7d5b9678f10c9cd9ba4:
    claim:
      about:
        disease:
          name: WFS1-Related Disorder
          disease_term:
            preferred_term: WFS1 spectrum disorder
            term:
              id: MONDO:0700293
              label: WFS1-related disorder
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: VARIABLE
        rationale: 'The dominant arm spans two very different burdens, which is why this is VARIABLE rather
          than a single tier. At one end, DFNA6/14/38 is a lifelong, progressive but non-life-limiting
          hearing loss confined to one organ, with good speech perception retained for decades. At the
          other, the aggregating de novo alleles give insulin-requiring diabetes in the first year of
          life together with congenital deafness, congenital cataract and hypotonia. Wolfram-like syndrome
          sits between them, adding progressive visual loss to the hearing loss and, in fewer than half
          of patients, diabetes.

          The sharpest contrast with classic WFS1-SD is survival. Classic disease is life-limiting through
          brainstem neurodegeneration; the systematic review of 86 Wolfram-like patients found no study
          reporting reduced life expectancy. That is an absence of reported evidence in a small, recently
          delineated literature rather than a demonstration of normal survival, and should be read as
          such.'
      selected_evidence:
        snippet: There were no studies reporting decreased life expectancy.
        supports: SUPPORT
    origin:
      assertion_path: /clinical_burden
