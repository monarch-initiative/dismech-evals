      assertion_type: Discussion
      assertion:
        discussion_id: pdc_interferon_wart_susceptibility
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why is susceptibility to human papillomavirus so disproportionate in WHIM syndrome relative
          to other immunodeficiencies, and how much is due to the plasmacytoid dendritic cell / type I
          interferon defect versus a cell-intrinsic keratinocyte CXCR4 effect?
        attaches_to:
        - pathophysiology#Plasmacytoid Dendritic Cell Deficiency
        - pathophysiology#CXCR4-Driven HPV Keratinocyte Transformation
        rationale: 'HPV susceptibility in WHIM syndrome exceeds what neutropenia and antibody deficiency
          alone predict. Two non-exclusive mechanisms are proposed: loss of plasmacytoid dendritic cell
          type I interferon output, and a cell-intrinsic effect of the gain-of-function receptor in HPV-infected
          keratinocytes that promotes transformation. Their relative contributions in patients are not
          established, and it is not settled why HPV in particular, rather than other viruses, dominates.'
      selected_evidence:
        snippet: we hypothesized that the susceptibility of WHIM patients to warts is related to the abnormal
          homeostasis of plasmacytoid dendritic cells.
        supports: SUPPORT
