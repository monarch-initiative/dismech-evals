      assertion_type: Discussion
      assertion:
        discussion_id: human_model_mismatch_lymphopoiesis
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the mesenchymal stromal niche mechanism of B and T lymphopenia defined in the R334X
          mouse operate the same way in human WHIM syndrome bone marrow?
        attaches_to:
        - pathophysiology#Impaired B and T Lymphopoiesis
        rationale: The switch from an adipogenic to an osteolineage-prone marrow stroma with reduced IL-7,
          and the rescue of B-cell development by LTbetaR or CXCR4 blockade, are defined in the CXCR4
          R334X mouse. Human lymphopenia is concordant at the level of reduced early B-progenitor output,
          but the stromal transcriptional mechanism has not been demonstrated directly in human marrow,
          so its translational validity is the open question.
      selected_evidence:
        snippet: Blocking LTβR or CXCR4 signaling restored IL-7 production and B cell development in WHIM
          mice.
        supports: SUPPORT
