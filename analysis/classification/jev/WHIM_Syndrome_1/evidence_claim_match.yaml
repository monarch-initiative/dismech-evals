          term:
            id: HP:0410252
            label: Persistently decreased total neutrophil count
      selected_evidence:
        snippet: plerixafor was noninferior to G-CSF for maintaining neutrophil counts of more than 500
          cells/μL (P = 0.023) and was superior to G-CSF for maintaining lymphocyte counts above 1,000
          cells/μL (P < 0.0001).
        supports: SUPPORT
