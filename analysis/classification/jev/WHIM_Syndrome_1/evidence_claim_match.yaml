        mechanism_confidence: ESTABLISHED
        description: After binding CXCL12 the mutant receptor is not efficiently desensitized or internalized,
          so it stays on the surface in a signaling-competent state. Recruitment of GRK6 and beta-arrestin
          2 is impaired. The degree of the internalization defect across variants correlates with the
          severity of leukopenia and infection susceptibility.
        biological_processes:
        - preferred_term: desensitization of G protein-coupled receptor signaling pathway
