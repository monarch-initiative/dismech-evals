      assertion_type: Genetic
      assertion:
        name: CXCR4
        gene_term:
          preferred_term: CXCR4
          term:
            id: hgnc:2561
            label: CXCR4
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: CXCR4 encodes C-X-C chemokine receptor type 4, the G protein-coupled receptor for
          CXCL12 that retains hematopoietic cells in the bone marrow and directs lymphocyte development
          and trafficking. Disease alleles are heterozygous gain-of-function variants clustered in the
          carboxy-terminal cytoplasmic tail, which carries the phosphorylation sites for receptor desensitization
          and internalization. They were the first chemokine receptor variants shown to cause a human
          disease.
        variants:
        - name: Carboxy-terminal truncating CXCR4 variants
          description: Nonsense and frameshift variants that truncate the CXCR4 carboxy-terminus by 10
            to 19 amino acids, removing negative regulatory phosphorylation sites. R334X is the most common
            allele.
          clinical_significance: PATHOGENIC
        - name: E343K
          description: A missense variant in the same carboxy-terminal domain (c.1027G>A) segregating
            with autosomal dominant WHIM syndrome in one family; it increases signaling about twofold,
            like R334X, but has a weaker effect on blocking receptor down-regulation. Nomenclature follows
            the source.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: We describe here the localization of the gene associated with WHIM syndrome to a region
          of roughly 12 cM on chromosome 2q21 and the identification of truncating mutations in the cytoplasmic
          tail domain of the gene encoding chemokine receptor 4 (CXCR4).
        supports: SUPPORT
    origin:
