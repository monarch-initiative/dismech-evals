            description: A heterozygous Cxcr4 knock-in mouse expressing a desensitization-resistant receptor.
              It reproduces the enhanced leukocyte response to CXCL12, the leukopenia, and the defective
              B and T lymphopoiesis of WHIM syndrome, and the leukopenia is reversed by CXCR4 antagonists,
              establishing the causal role of the mutant receptor. A parallel R334X gain-of-function model
              was used to dissect the stromal niche contribution to lymphopenia.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired B and T Lymphopoiesis
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: ORGANISM
        description: The knock-in mouse shows defective thymopoiesis and B-cell development, reproducing
          the developmental component of the human lymphopenia.
        limitations: Mouse lymphoid ontogeny differs from human; the stromal-niche mechanism is best characterized
          in the separate R334X model.
      selected_evidence:
        snippet: In contrast, Cxcr4(+/1013) mice show defective thymopoiesis and B-cell development, accounting
          for circulating lymphopenia.
        supports: SUPPORT
