          term:
            id: GO:0002031
            label: G protein-coupled receptor internalization
          modifier: DECREASED
      selected_evidence:
        snippet: This phenomenon relies on the refractoriness of CXCR4 to be both desensitized and internalized
          in response to CXCL12.
        supports: SUPPORT
