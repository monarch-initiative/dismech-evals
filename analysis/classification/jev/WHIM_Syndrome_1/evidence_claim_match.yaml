          a phase 3 crossover trial found it noninferior to G-CSF for neutrophil maintenance and superior
          for lymphocyte counts.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
