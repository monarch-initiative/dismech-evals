          which inflates penetrance: Wilms tumor in 18 of 19 truncating-variant carriers in the Dutch
          national cohort, and a risk of at least 50 per cent in the 2006 UK recommendations. Unaffected
          carriers occur in families. The figure matters for counselling relatives found by cascade testing
          and for the cost-benefit of surveillance, and would need a cohort of carriers identified by
          cascade or population sequencing.'
