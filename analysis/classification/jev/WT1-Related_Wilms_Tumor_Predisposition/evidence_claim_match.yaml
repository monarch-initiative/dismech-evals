      assertion_type: Diagnosis
      assertion:
        name: Germline WT1 genetic testing
        diagnosis_term:
          preferred_term: germline WT1 genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        description: Testing of WT1 in constitutional DNA. Features that raise the likelihood of a germline
          variant in a child with Wilms tumor are early onset, stromal-predominant histology, bilateral
          tumors, genitourinary anomalies and early nephrotic syndrome; girls with Wilms tumor alone are
          the group most often missed. Testing outside the exon 8 and 9 hotspot is needed, since many
          truncating variants found in Wilms tumor lie outside it.
        results: A heterozygous pathogenic WT1 variant in constitutional DNA establishes the diagnosis.
      selected_evidence:
        snippet: In addition to genital tract anomalies (GU), early onset nephrotic syndrome with diffuse
          mesangial sclerosis and stromal-predominant histology, tumor bilaterality, and early age of
          onset can now be added to the list of risk factors for carrying a germline WT1 mutation.
        supports: SUPPORT
