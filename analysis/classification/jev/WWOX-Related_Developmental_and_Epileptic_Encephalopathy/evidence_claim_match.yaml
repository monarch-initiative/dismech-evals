          name: WWOX-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 28
            term:
              id: MONDO:0014533
              label: developmental and epileptic encephalopathy, 28
        context: []
      assertion_type: Genetic
      assertion:
        name: WWOX
        gene_term:
          preferred_term: WWOX
          term:
            id: hgnc:12799
            label: WWOX
        relationship_type: CAUSATIVE
        association: Biallelic germline loss-of-function variants in WWOX cause WOREE syndrome (DEE28);
          the same gene causes the milder allelic disorder SCAR12.
        notes: 'WWOX encodes a 46 kDa, 414-amino-acid adaptor with two N-terminal WW domains and a C-terminal
          short-chain dehydrogenase/reductase domain whose substrate is unknown, so the protein is curated
          here as a scaffold rather than by a catalytic output. Pathogenic alleles span nonsense, frameshift,
          splice-site, missense and copy-number changes, and compound heterozygosity for one SNV plus
          one CNV is common enough that CNV-capable testing matters diagnostically. Genotype class is
          the dominant prognostic variable: biallelic null genotypes carry significantly lower survival
          probability than genotypes containing a presumed hypomorphic missense allele, and missense-predominant
          genotypes sit at the SCAR12 end of the spectrum. Note the deliberate limit of that claim - the
          cited sources support a survival *difference* between genotype classes, and this entry does
          not assert the stronger version sometimes stated in review summaries, that premature death has
          never occurred with a missense-only genotype, because that sentence could not be verified against
          either source abstract.'
      selected_evidence:
        snippet: Pathogenic variants were located throughout WWOX and comprised both missense and null
          changes including five copy number variants (four deletions, one duplication).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36779245
      reference_title: 'WWOX developmental and epileptic encephalopathy: Understanding the epileptology
        and the mortality risk.'
      evidence_source: HUMAN_CLINICAL
      explanation: Confirms that variants are distributed across the gene rather than clustered in a hotspot,
        and that CNVs are a substantial fraction.
