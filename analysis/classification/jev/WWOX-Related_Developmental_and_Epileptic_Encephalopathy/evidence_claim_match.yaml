  4d3fa58d9cff26d6805096329ba6a78a9035a4eb820fa6ae6183c967275c6d6e:
    claim:
      about:
        disease:
          name: WWOX-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 28
            term:
              id: MONDO:0014533
              label: developmental and epileptic encephalopathy, 28
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_are_missense_alleles_truly_hypomorphic
        prompt: Genotype class predicts survival, with missense-containing genotypes faring better than
          biallelic null. Is that because missense alleles retain partial function, or because they do
          something qualitatively different?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Genotype-Stratified Mortality Risk
        - pathophysiology#Loss of WWOX Scaffold Function
        rationale: 'The survival difference is the best-quantified genotype-phenotype relationship in
          this disorder, and the word doing the work in the source is "presumed" - the hypomorphic status
          of missense alleles is inferred from the milder outcome rather than measured. This matters mechanistically
          because WWOX is a multi-domain scaffold: a missense change in a WW domain could preserve SDR-domain
          function while abolishing one protein interaction, which is not the same thing as uniformly
          reduced dose, and would predict arm-selective rather than globally milder disease. No published
          assay measures residual WWOX function allele by allele, so the dose-response model underlying
          the entire WOREE-to-SCAR12 spectrum rests on clinical severity rather than on protein function.
          It also bears directly on gene replacement, whose rationale assumes that adding functional protein
          back is sufficient regardless of which allele is present.'
        proposed_experiments:
        - experiment_id: exp_allele_series_residual_function
          name: Residual-function assay across a WWOX missense allele series
          description: Express each recurrent patient missense allele in a WWOX-null human neuronal background
            and measure, per allele, partner binding through each WW domain, the Hyal-2/Smad4 nuclear
            relocation readout, and rescue of the organoid hyperexcitability phenotype. A graded series
            would support the hypomorph model; arm-selective loss - one allele rescuing signalling but
            not excitability - would refute it and predict that genotype classes differ in kind rather
            than degree.
      selected_evidence:
        snippet: patients with biallelic null WWOX pathogenic variants have significantly lower survival
          probability compared to those carrying at least one presumed hypomorphic missense pathogenic
          variant
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
