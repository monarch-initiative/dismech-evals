              label: developmental and epileptic encephalopathy, 28
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of WWOX Scaffold Function
        biological_scale: MOLECULAR
        description: WWOX is a 46 kDa adaptor carrying two N-terminal WW domains and a C-terminal short-chain
          dehydrogenase/reductase domain. The WW domains bind PPxY-motif partners, so the protein acts
          as a hub rather than through a single catalytic output - its own substrate is still unknown.
          Loss of the hub is what propagates into the separate signalling arms below.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: This protein contains two N-terminal WW domains (referred to as WW1 and WW2) and a catalytic
          domain in the C-terminus, which is homologous to short-chain dehydrogenase/reductase (SDR) family
          proteins, although the substrate of WWOX is currently unknown.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39507621
      reference_title: 'Case report: Adult patient with WWOX developmental and epileptic encephalopathy:
        40 years of observation.'
      evidence_source: HUMAN_CLINICAL
      explanation: Gives the domain architecture and states explicitly that the catalytic substrate is
        unknown, which is why this node is scoped to scaffold function.
