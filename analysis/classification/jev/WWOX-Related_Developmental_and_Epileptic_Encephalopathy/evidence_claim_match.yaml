      assertion_type: Treatment
      assertion:
        name: WWOX Gene Replacement Therapy
        description: Experimental, preclinical. A single neonatal intracerebroventricular injection of
          an AAV9 vector carrying WWOX under a neuronal Synapsin I promoter rescues hyperexcitability,
          seizures, myelination and survival in Wwox-null mice. No peer-reviewed human efficacy data exist;
          this is curated as a mechanism-matched strategy with preclinical support, not as available care.
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: Gene Therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
        notes: 'Press coverage during 2026 described a first compassionate-use administration of an AAV9-WWOX
          product to an infant. That report is deliberately not curated as evidence here: it has no peer-reviewed
          publication, so there is no citable source and no verifiable outcome data. It is recorded in
          this note so a future curator knows the claim was seen and consciously excluded rather than
          missed.'
      selected_evidence:
        snippet: These findings provide a proof-of-concept for WWOX gene therapy as a promising approach
          to curing children with WOREE and SCAR12.
        supports: SUPPORT
