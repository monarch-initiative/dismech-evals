        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_myelin_versus_synaptic_route_to_seizures
        prompt: Neuronal WWOX loss produces both hypomyelination and a cortical excitation-inhibition
          imbalance in the same animals. Which of the two actually generates the seizures, and is the
          myelin arm causal or merely concurrent?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#CNS Hypomyelination
        - pathophysiology#Impaired Axonal Conductivity
        - pathophysiology#Cortical Excitation-Inhibition Imbalance
        rationale: 'This is not a manufactured gap - the electrophysiology paper states the problem in
          as many words, noting that hypomyelination alone does not necessarily cause epilepsy and citing
          demyelinating conditions that are not epileptic. Both arms are present in the same neuronal-deletion
          mouse and in WWOX-deleted human organoids, so co-occurrence is established and precedence is
          not. The pathograph therefore carries them as parallel arms from the scaffold node rather than
          placing myelin upstream of excitability, which would assert exactly the causal claim in dispute.
          It matters therapeutically: a remyelinating strategy and an excitability-directed strategy target
          different arms, and the gene-replacement result cannot separate them because restoring WWOX
          rescues both at once.'
        proposed_experiments:
        - experiment_id: exp_remyelination_without_wwox_restoration
          name: Uncouple myelin repair from WWOX restoration in the conditional mouse
          description: Treat neuronal Wwox-deletion mice with a promyelinating agent that does not restore
            WWOX, and ask whether seizure burden and neocortical bursting fall while excitability measures
            are held constant. If myelin repair alone suppresses seizures, the myelin arm is causal; if
            bursting persists at restored myelin content, the synaptic arm is the seizure driver and myelin
            is concurrent.
      selected_evidence:
        snippet: hypomyelination alone does not necessarily cause epilepsy
        supports: SUPPORT
