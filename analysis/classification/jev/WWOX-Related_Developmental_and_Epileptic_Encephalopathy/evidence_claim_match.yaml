              id: MONDO:0014533
              label: developmental and epileptic encephalopathy, 28
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_model_lifespan_versus_human_disease_course
        prompt: Every rodent model of WWOX loss dies within two to four weeks of birth, while the human
          disease runs for years and the longest-followed patient reached 40. What can a model that never
          survives past infancy establish about a progressive disorder?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Progressive Cerebral and Optic Atrophy
        - pathophysiology#Genotype-Stratified Mortality Risk
        rationale: 'The mismatch is structural rather than a matter of degree. Progressive cerebral atrophy
          in patients is documented over years of serial imaging; the mouse is dead before an equivalent
          interval has elapsed, so the degeneration it shows is compressed into a window that cannot be
          mapped onto the human course. The same limit applies to the therapeutic endpoint: the gene-therapy
          experiment scores rescue of premature lethality at two to four weeks, an endpoint whose human
          counterpart - death in early childhood - occurs in only a subset of patients and at a very different
          point in development. The genotype-stratified survival data make this sharper still, because
          the human severity spectrum runs from death in infancy to survival into a fifth decade, and
          no current model spans it. Note this is a mismatch in translational reach, not evidence that
          the models are wrong: the same models supply the mechanistic measurements this entry depends
          on.'
        proposed_experiments:
        - experiment_id: exp_inducible_adult_onset_wwox_deletion
          name: Adult-onset inducible Wwox deletion to model the chronic phase
          description: Use a tamoxifen-inducible neuronal Cre to delete Wwox after the postnatal window
            that kills the constitutive model, then follow atrophy, myelin content and seizure burden
            longitudinally. This would separate the developmental contribution from the degenerative one,
            which the constitutive models necessarily conflate, and give the progressive arm a model with
            a survivable time course.
      selected_evidence:
        snippet: specific neuronal deletion of murine Wwox produces phenotypes typical of the Wwox-null
          mutation leading to brain hyperexcitability, intractable epilepsy, ataxia and postnatal lethality
        supports: SUPPORT
