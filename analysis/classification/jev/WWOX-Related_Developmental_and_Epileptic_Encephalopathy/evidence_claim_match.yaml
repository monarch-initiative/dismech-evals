              id: MONDO:0014533
              label: developmental and epileptic encephalopathy, 28
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_gsk3b_as_a_druggable_node
        prompt: Lithium abolishes chemically induced seizures in Wwox-null mice by inhibiting GSK-3beta.
          Does that translate to the spontaneous, drug-resistant seizures of WOREE syndrome in children?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Wnt/GSK-3beta Signalling Dysregulation
        rationale: This is the only node in the pathograph with an existing drug pointed at it, which
          makes the gap worth stating precisely rather than optimistically. Two things separate the mouse
          result from a clinical claim. The rescue was measured against pentylenetetrazol-induced seizures
          - a provoked-threshold assay - whereas the human disease is defined by spontaneous, drug-resistant
          seizures, and a compound can raise a chemical seizure threshold without touching established
          epileptogenic networks. Lithium is also not a selective GSK-3beta inhibitor, so the experiment
          licenses "GSK-3beta inhibition raises seizure threshold in this model" rather than identifying
          lithium as the agent. Against that, the target is attractive precisely because it is reachable
          with existing drugs in a disorder where 95% of patients fail conventional medication.
        proposed_experiments:
        - experiment_id: exp_selective_gsk3b_inhibition_spontaneous_seizures
          name: Selective GSK-3beta inhibition against spontaneous seizures
          description: Treat neuronal Wwox-deletion mice - which have spontaneous seizures, unlike the
            PTZ paradigm - with a selective GSK-3beta inhibitor rather than lithium, and score spontaneous
            seizure frequency on continuous video EEG together with neocortical bursting in slices. This
            tests the target rather than the drug, and against the endpoint that matters clinically.
      selected_evidence:
        snippet: Inhibition of GSK3β by lithium ion significantly abolishes the onset of PTZ-induced seizure
          in Wwox-/- mice.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
