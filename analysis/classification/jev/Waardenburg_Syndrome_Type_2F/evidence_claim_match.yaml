        context:
        - path: /pathophysiology/0
          value:
            name: Biallelic KITLG Variants Reducing KIT Ligand Signalling
            conforms_to: neural_crest_melanocyte_deficiency#Neural Crest Melanocyte Program Disruption
            biological_scale: MOLECULAR
            description: 'Homozygous germline KITLG variants reduce the KIT ligand signal available to
              KIT-expressing melanoblasts. This is the KITLG substitution at the module''s trigger node,
              the ligand-side counterpart of KIT loss of function in piebaldism. The reduction is inferred
              from variant class rather than measured: the case-series authors propose that complete loss
              of function produces generalized hypomelanosis and that alleles retaining some function
              produce the Waardenburg-like and piebaldism-like presentations, and no functional assay
              of the recessive alleles has been reported.'
            genetic_context:
              variant_origin: GERMLINE
              zygosity: HOMOZYGOUS
              gene:
                preferred_term: KITLG
                term:
                  id: hgnc:6343
                  label: KITLG
              description: Homozygous missense (p.Arg32Cys, p.Ile148Thr), frameshift (p.Met184ValfsTer10,
                p.Arg268SerfsTer29) and nonsense (p.Trp215Ter) KITLG variants in the defining case series.
            molecular_functions:
            - preferred_term: stem cell factor receptor binding
              term:
                id: GO:0005173
                label: stem cell factor receptor binding
              modifier: DECREASED
            cell_types:
            - preferred_term: melanoblast
              term:
                id: CL:0000541
                label: melanoblast
            biological_processes:
            - preferred_term: Kit signaling pathway
              term:
                id: GO:0038109
                label: Kit signaling pathway
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Reduced Melanoblast Survival, Proliferation and Colonization
        description: Melanoblasts depend on KIT ligand for survival and proliferation during their embryonic
          migration, so less ligand leaves fewer melanoblasts to reach their targets.
      selected_evidence:
        snippet: In mice, it appears that soluble KITLG plays a role in melanocyte migration and/or early
          survival and that transmembrane KITLG plays a role in melanocyte survival at or close to the
          destination.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0/downstream/0
      evidence_path: /pathophysiology/0/downstream/0/evidence/0
      context_paths:
      - /name
