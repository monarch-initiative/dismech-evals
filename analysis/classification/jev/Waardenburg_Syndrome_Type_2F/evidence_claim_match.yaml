            term:
              id: MONDO:0030983
              label: Waardenburg syndrome 2F
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant (single reported family)
        description: One small family with Waardenburg syndrome type 2 segregated a heterozygous KITLG
          missense variant, p.Leu104Val. The variant reached the cell membrane normally but its soluble
          isoform was reduced in culture medium, and the authors raised a dominant-negative or gain-of-function
          mechanism rather than simple loss of function. Whether heterozygous WS2 of this kind belongs
          to the same disease as the recessive case series is not settled by the published data; it is
          recorded here as a single dominant report.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: We speculate that the mechanism of the mutation underlying WS2 and leading to membrane
          incorporation and reduced secretion of KITLG occurs via a dominant-negative or gain-of-function
          effect.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/1
      evidence_path: /inheritance/1/evidence/1
