        context: []
      assertion_type: AnimalModel
      assertion:
        name: Steel-dickie (Sl/Sld) mouse
        species: Mouse
        genotype: Kitl Sl/Sld compound heterozygote
        description: Steel mutations are alleles of Kitl, the mouse ortholog of KITLG. Sld lacks the membrane-bound
          form of the ligand. Sl/Sld mice are deaf with absent strial intermediate cells. Sld/Sld mice
          are viable and lack coat pigmentation, and in Sld/Sld embryos melanoblasts fail to survive and
          fewer reach the inner ear.
        publication: PMID:2460075
        modeled_mechanisms:
        - target: Strial Intermediate Cell Deficiency
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Sl/Sld mice lack strial intermediate cells and are deaf, the cochlear mechanism
            proposed for human KITLG hearing loss.
          limitations: Sl/Sld is a compound heterozygote of a severe allele and an allele that removes
            the membrane-bound isoform, not a model of the human homozygous missense or truncating alleles.
            Steel mice also have anemia and sterility, which are not reported in human KITLG disease,
            and no human temporal bone pathology exists to confirm the strial lesion in people.
        - target: Reduced Melanoblast Survival, Proliferation and Colonization
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: In Sld/Sld embryos, melanoblasts emerge and begin to migrate normally but fail
            to survive.
          limitations: Sld removes the membrane-bound ligand isoform specifically, whereas the human alleles
            affect both isoforms to differing, unmeasured degrees.
      selected_evidence:
        snippet: In contrast, vimentin was seen to stain only the basal cells in the mutant mice, confirming
          our previous findings of the absence of intermediate cells in these cases of hereditary deafness.
        supports: SUPPORT
