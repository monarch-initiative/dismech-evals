      assertion_type: Pathophysiology
      assertion:
        name: Strial Intermediate Cell Deficiency
        conforms_to: neural_crest_melanocyte_deficiency#Stria Vascularis Melanocyte Deficiency
        biological_scale: TISSUE
        description: 'The intermediate cells of the stria vascularis are melanocytes of neural crest origin,
          and they are required for the endocochlear potential that drives hair-cell transduction. In
          steel (Kitl) and dominant white spotting (Kit) mutant mice they are absent or reduced, the endocochlear
          potential is lost or reduced, and the animals are deaf. In mice heterozygous for a Kitlg frameshift
          the deficit is functional rather than numerical: intermediate cells are present but morphologically
          abnormal, strial melanin is reduced in the animals with impaired hearing, and the gross cochlear
          structure is normal. The same study found reduced FXYD6, a regulator of Na+/K+-ATPase, and proposed
          that it adds to the loss of endocochlear potential. Because the strial deficit can differ between
          ears, it offers an explanation for the unilateral and asymmetric hearing loss characteristic
          of KITLG disease. No human temporal bone from a person with WS2F has been described, so this
          node rests on the mouse models.'
        cell_types:
        - preferred_term: strial intermediate cell
          term:
            id: CL:0002486
            label: strial intermediate cell
        locations:
        - preferred_term: stria vascularis
          term:
            id: UBERON:0002282
            label: stria vascularis of cochlear duct
      selected_evidence:
        snippet: In contrast, vimentin was seen to stain only the basal cells in the mutant mice, confirming
          our previous findings of the absence of intermediate cells in these cases of hereditary deafness.
        supports: SUPPORT
