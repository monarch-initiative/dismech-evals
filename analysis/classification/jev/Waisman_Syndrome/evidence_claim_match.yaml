        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_01dc73a8-fbd2-4081-95cd-ab7cb59236d7-2018-06-04T100000.000Z
        notes: Reported disease alleles include c.21C>A (p.Tyr7*), the c.215+1G>A splice variant of the
          MRX72 family, a ~45 kb whole-gene deletion, the destabilizing missense c.503C>A (p.Thr168Lys),
          frameshifts c.137dupT and c.371delA, the nonstop c.640T>C (p.*214Glnext*21), the in-frame deletion
          c.436_447del, and c.200G>T and c.463C>T. Somatic mosaicism in one family is stated in the title
          of PMID:28851564, but its abstract gives no detail. Loss of function is the disease mechanism.
      selected_evidence:
        snippet: Genetic analysis of an Australian family with three males displaying clinical features
          of early-onset parkinsonism and intellectual disability identified a ∼45 kb deletion resulting
          in the complete loss of RAB39B.
        supports: SUPPORT
