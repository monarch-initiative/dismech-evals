      assertion_type: Pathophysiology
      assertion:
        name: Impaired Golgi-Endosomal Vesicular Trafficking
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: RAB39B normally localizes to Golgi vesicles and recycling endosomes and is needed
          for glutamatergic receptor maturation. Without it, trafficking of receptor cargo to the synapse
          and the formation of presynaptic structures are disturbed.
        cell_types:
        - preferred_term: glutamatergic neuron
          term:
            id: CL:0000679
            label: glutamatergic neuron
        biological_processes:
        - preferred_term: vesicle-mediated transport
          modifier: DECREASED
          term:
            id: GO:0016192
            label: vesicle-mediated transport
      selected_evidence:
