      assertion_type: Discussion
      assertion:
        discussion_id: wcs_n144s_mechanism_discordance
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Activating DDR2 Kinase-Domain Missense Variants
        - pathophysiology#Ligand-Independent Constitutive DDR2 Kinase Activation
        prompt: Is the neonatal p.Asn144Ser variant a Warburg-Cinotti allele at all, given that it lies
          outside the kinase domain and the reported functional result is a failure of pathway activation
          rather than a gain?
        rationale: 'Every mechanistically characterised WCS allele is a kinase-domain missense variant
          producing ligand-independent constitutive activation. A 2025 neonatal case reports a maternally
          inherited DDR2 c.431A>G (p.Asn144Ser) variant - in the discoidin region, not the kinase domain
          - and in vitro the mutated DDR2 fails to activate the p38 MAPK pathway. A failure to activate
          is not obviously the same lesion as constitutive activation, and the reporting authors themselves
          hedge ("may contribute", "may expand the phenotypic spectrum"). Three readings are open: the
          allele is mechanistically distinct and expands the spectrum; the p38 readout is not the relevant
          output for this allele; or the variant is not causal. This entry curates the kinase-domain gain-of-function
          mechanism and records the discordance here rather than flattening the two into one node.'
      selected_evidence:
        snippet: WES revealed a maternally inherited heterozygous missense mutation in DDR2 (c.431A>G,
          p.Asn144Ser).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
