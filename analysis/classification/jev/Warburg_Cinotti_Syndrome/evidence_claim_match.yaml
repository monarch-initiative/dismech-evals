  5e59adb17bb643ff0399dd7b6048ef548ae02a569f062ae106169f2a970e32df:
    claim:
      about:
        disease:
          name: Warburg-Cinotti Syndrome
          disease_term:
            preferred_term: Warburg-Cinotti syndrome
            term:
              id: MONDO:0032579
              label: warburg-cinotti syndrome
        context: []
      assertion_type: Environmental
      assertion:
        name: Ocular and cutaneous trauma or surgery
        description: 'The single most actionable finding in the clinical literature on this disease, and
          the one with a management consequence. Lesions are provoked by injury and accelerated by attempts
          to remove them: the original 2006 patient''s corneal vascularization arose after ocular surface
          surgery, and in the 2024 paediatric case the mass began after trauma and recurred larger after
          every surgical intervention until it covered the whole cornea.

          Read against the entry''s mechanism, this is what a constitutively active collagen receptor
          should do. Wounding exposes fibrillar collagen and calls for exactly the matrix-remodelling
          program that DDR2 normally gates - but the gate is already open, so the response does not terminate.

          '
        exposure_term:
          preferred_term: exposure to ocular surface surgery or trauma
          term:
            id: ECTO:2000054
            label: exposure to surgery
        notes: 'The exposure is trauma or surgery, but the binding covers only the surgical half. ECTO
          was searched for trauma, injury, wound, physical, mechanical, burn, and laceration and returns
          nothing for any of them, while surgery resolves. Its exposure classes are overwhelmingly chemical,
          dietary, and infectious, with no physical-injury branch. ECTO:2000054 is therefore the most
          specific accurate binding available, with the trauma component carried in preferred_term and
          in the evidence. Revisit if ECTO adds a physical-injury branch.

          '
      selected_evidence:
        snippet: Warburg et al. first described a 42-year-old white male with deafness, acro-osteolysis,
          wasting of subcutaneous tissue, and corneal vascularization secondary to ocular surface surgery
          in 2006
        supports: SUPPORT
    origin:
