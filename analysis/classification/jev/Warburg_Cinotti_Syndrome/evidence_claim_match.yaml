      assertion_type: Discussion
      assertion:
        discussion_id: wcs_dasatinib_translational_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#DDR2 Kinase Inhibition (Dasatinib)
        - pathophysiology#Ligand-Independent Constitutive DDR2 Kinase Activation
        prompt: Does pharmacological DDR2 kinase inhibition, shown to abolish variant autophosphorylation
          in patient fibroblasts, alter the clinical course of Warburg-Cinotti syndrome?
        rationale: 'The founding report showed dasatinib prevents DDR2 autophosphorylation in patient
          fibroblasts and proposed it as an approach to treatment. Seven years on, no patient outcome
          data exist. The gap is worth stating because the mechanistic case here is unusually clean -
          a constitutively active kinase with an available inhibitor - and cleanliness of rationale is
          exactly what makes an untested therapy get cited as though it were a treatment. A relevant design
          question is also open: the ocular disease is described as accelerated by trauma and surgery,
          so the peri-operative window may be the natural place to test an inhibitor, rather than continuous
          therapy.'
      selected_evidence:
        snippet: Finally, we found that the protein kinase inhibitor dasatinib prevented DDR2 autophosphorylation
          in fibroblasts, suggesting an approach to treatment.
        supports: SUPPORT
