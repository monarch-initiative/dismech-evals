        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'DDR2 encodes a collagen-responsive receptor tyrosine kinase that regulates connective-tissue
          formation. Wild-type DDR2 kinase follows a two-step activation mechanism, previously characterised
          for DDR1, but with enhanced autophosphorylation and substrate phosphorylation rates. Disease
          alleles are heterozygous kinase-domain missense variants that disable autoinhibition; the recurrent
          p.Tyr740Cys removes activation-loop hydrogen bonds to catalytic residues.

          '
      selected_evidence:
        snippet: 'In six affected individuals from four families, we found one of two recurrent variants
          in discoidin domain receptor tyrosine kinase 2 (DDR2): c.1829T>C (p.Leu610Pro) or c.2219A>G
          (p.Tyr740Cys).'
        supports: SUPPORT
