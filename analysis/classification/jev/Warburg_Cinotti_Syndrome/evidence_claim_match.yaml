              label: warburg-cinotti syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Activating DDR2 Kinase-Domain Missense Variants
        biological_scale: MOLECULAR
        description: 'Two recurrent variants account for the founding series - c.1829T>C (p.Leu610Pro)
          and c.2219A>G (p.Tyr740Cys) - both in the kinase domain. The structural basis is specific: Tyr-740
          lies in the activation loop and forms autoinhibitory hydrogen bonds with key catalytic residues,
          and a cysteine substituted at that position cannot form them, releasing the A-loop from its
          autoinhibitory conformation.

          '
        genes:
        - preferred_term: DDR2
          term:
            id: hgnc:2731
            label: DDR2
          modifier: GAIN_OF_FUNCTION
        genetic_context:
          description: Heterozygous germline missense variants in the DDR2 kinase domain, recurrent across
            unrelated families and arising both de novo and by dominant transmission. p.Tyr740Cys substitutes
            an activation-loop tyrosine whose autoinhibitory hydrogen bonds cannot form with cysteine.
          allele_type: SNV
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: 'In six affected individuals from four families, we found one of two recurrent variants
          in discoidin domain receptor tyrosine kinase 2 (DDR2): c.1829T>C (p.Leu610Pro) or c.2219A>G
          (p.Tyr740Cys).'
        supports: SUPPORT
