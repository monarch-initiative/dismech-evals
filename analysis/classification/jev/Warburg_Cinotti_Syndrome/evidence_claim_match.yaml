              label: warburg-cinotti syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ligand-Independent Constitutive DDR2 Kinase Activation
        biological_scale: MOLECULAR
        description: 'The central node, and the claim is stronger than "more active". Both disease variants
          autophosphorylate constitutively when expressed as full-length proteins in mammalian cells,
          without ligand. Kinetically, unphosphorylated DDR2-Y740C has autophosphorylation and substrate
          phosphorylation rates similar to those of fully phosphorylated wild-type DDR2 - meaning the
          variant bypasses all autoinhibitory constraints and adopts the fully active kinase conformation
          - while ATP binding affinity is unchanged, so the gain is in catalysis and regulation rather
          than in substrate handling. Because the kinase is operating outside its normal regulatory constraints
          rather than merely running above its normal level, this node is tagged GAIN_OF_FUNCTION rather
          than INCREASED.

          '
        molecular_functions:
        - preferred_term: DDR2 protein tyrosine kinase activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0004713
            label: protein tyrosine kinase activity
        biological_processes:
        - preferred_term: cell surface receptor protein tyrosine kinase signaling pathway
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0007169
            label: cell surface receptor protein tyrosine kinase signaling pathway
      selected_evidence:
        snippet: Here we show that both disease variants exhibit ligand-independent constitutive autophosphorylation
          when expressed as full-length proteins in mammalian cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
